# =============================================================================
# Coffee Roaster Wholesale — Scaffold (§1.0–§1.7)
# =============================================================================

scenario: "Coffee Roaster Wholesale: green-coffee lot inventory, roast batch & profile log, wholesale account & price tier, standing order & subscription, fulfillment & freshness (roast date), sample/cupping request, invoice/net terms, par-based reorder"

domain_name: coffee-roaster-wholesale
api_prefix: /

# -----------------------------------------------------------------------------
# Step 0: Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: quota_allocation        # finite green-coffee + roasted inventory reserved/committed/consumed
  secondary_archetype: pricing_engine        # tiered wholesale pricing + invoice/net-terms aging
  complexity_layers:
    - optimistic_concurrency                 # OCC on GreenLot.version and RoastedLot.version for reservation races
    - cascading_side_effects                 # roast completion + fulfillment chains span 3+ entities
    - dual_variant_calculation               # planned (forward) vs actual (post-roast) green/roasted weight
    - rate_threshold_triggers                # par-level reorder threshold + roast-date freshness window

  entity_topology: hybrid
  # Accounts own Orders/Invoices/StandingOrders/SampleRequests (tree); GreenLot,
  # RoastBatch, RoastedLot, Product, PriceTier are peer inventory/config entities
  # referenced by FK across the tree (cross-cutting associations).

  state_machine_shape: parallel
  # Order carries two independent dimensions (fulfillment_status × billing_status);
  # RoastBatch is cyclic (PLANNED→ROASTING→COOLING→ROASTING on re-roast reject);
  # SampleRequest branches (fork to APPROVED/DECLINED with divergent side effects).

  relationship_patterns:
    - one_to_many        # Account → Orders; RoastBatch → RoastedLots; Order → Fulfillments
    - cross_aggregate    # Fulfillment allocates across RoastedLots; Order line references Product
    - many_to_many       # Fulfillment ↔ RoastedLot via allocation array

  role_model: peer_roles
  # RoasterStaff own production (green lots, roast batches, roasted inventory);
  # SalesRep own commercial surface (accounts, orders, invoices, samples);
  # WholesaleBuyer (entity-backed Account) act on their own orders/standing orders.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # --- Configuration: price tiers ---
  - name: PriceTier
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Tier code, unique among non-archived tiers (e.g. BRONZE, SILVER, GOLD)" }
      - { name: discount_bps, type: integer, source: input, description: "Discount in basis points applied to product base price (e.g. 500 = 5%)", constraints: "0..3000" }
      - { name: min_monthly_kg, type: integer, source: input, description: "Minimum committed monthly kilograms qualifying for this tier" }
      - { name: freshness_max_days, type: integer, source: input, description: "Max days from roast_date a roasted lot may be allocated to this tier's accounts" }
      - { name: archived, type: boolean, source: system, default: false, description: "Soft-delete flag; archived tiers excluded from default tier lists" }

  # --- Root commercial entity ---
  - name: WholesaleAccount
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Account / cafe business name" }
      - { name: price_tier_id, type: string, source: input, description: "FK -> PriceTier.id; pricing tier governing this account's order pricing and freshness ceiling" }
      - { name: net_terms_days, type: integer, source: input, description: "Net payment terms in days (e.g. 0, 15, 30); due_date = invoice issued_at + net_terms_days", constraints: "one of 0, 15, 30, 45, 60" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum outstanding (unpaid issued invoice) balance permitted before new orders are blocked" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum of amount_due_cents over this account's invoices whose status IN {ISSUED, PARTIALLY_PAID, OVERDUE}" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CREDIT_HOLD", constraints: "ACTIVE | CREDIT_HOLD" }

  # --- Catalog ---
  - name: RoastProfile
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Profile name (e.g. 'Filter — City+')" }
      - { name: roast_level, type: enum, source: input, description: "LIGHT | MEDIUM | DARK", constraints: "LIGHT | MEDIUM | DARK" }
      - { name: expected_shrink_bps, type: integer, source: input, description: "Expected roasting weight loss in basis points (e.g. 1500 = 15% loss)", constraints: "500..2500" }
      - { name: charge_temp_c, type: integer, source: input, description: "Drum charge temperature in Celsius, logged for the profile" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "SKU code, unique among non-archived products" }
      - { name: name, type: string, source: input, description: "Product display name" }
      - { name: roast_profile_id, type: string, source: input, description: "FK -> RoastProfile.id; the roast profile RoastBatches for this product must use" }
      - { name: base_price_cents_per_kg, type: integer, source: input, description: "List price per kg before tier discount" }
      - { name: freshness_window_days, type: integer, source: input, description: "Product-level max days from roast_date a roasted lot remains shippable (independent of tier ceiling)" }
      - { name: archived, type: boolean, source: system, default: false, description: "Soft-delete flag; archived products cannot be added to new order lines" }

  # --- Green inventory (finite pool, OCC-guarded) ---
  - name: GreenLot
    parent: null
    common_fields: true
    fields:
      - { name: origin, type: string, source: input, description: "Origin / mark (e.g. 'Ethiopia Yirgacheffe')" }
      - { name: lot_ref, type: string, source: input, description: "Supplier lot reference, unique among non-depleted green lots" }
      - { name: received_kg, type: number, source: input, description: "Total green kilograms received into the lot" }
      - { name: on_hand_kg, type: number, source: computed, description: "received_kg minus sum of consumed_green_kg over this lot's RoastBatches in {ROASTING, COOLING, COMPLETED}; never negative" }
      - { name: reserved_kg, type: number, source: computed, description: "Sum of planned_green_kg over this lot's RoastBatches in status PLANNED" }
      - { name: available_kg, type: number, source: computed, description: "on_hand_kg - reserved_kg; never negative" }
      - { name: par_level_kg, type: number, source: input, description: "Par threshold; when available_kg drops below par_level_kg the lot needs reorder" }
      - { name: reorder_status, type: enum, source: computed, default: OK, description: "OK when available_kg >= par_level_kg, else BELOW_PAR", constraints: "OK | BELOW_PAR" }

  # --- Roast production (cyclic state machine) ---
  - name: RoastBatch
    parent: null
    common_fields: true
    fields:
      - { name: green_lot_id, type: string, source: input, description: "FK -> GreenLot.id; the green lot this batch draws from" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the finished product this batch yields" }
      - { name: roast_profile_id, type: string, source: computed, description: "FK -> RoastProfile.id; copied from Product.roast_profile_id at creation, pinned for the batch" }
      - { name: planned_green_kg, type: number, source: input, description: "Green kilograms planned to charge; reserves this much on the green lot while PLANNED" }
      - { name: planned_roasted_kg, type: number, source: computed, description: "Forward estimate = planned_green_kg * (1 - expected_shrink_bps/10000), rounded HALF_UP to 3 decimals" }
      - { name: actual_green_kg, type: number, source: input, description: "Green kilograms actually charged, recorded at the start_roast transition", constraints: "null until ROASTING" }
      - { name: actual_roasted_kg, type: number, source: input, description: "Roasted kilograms actually weighed out, recorded at the complete transition", constraints: "null until COMPLETED" }
      - { name: actual_shrink_bps, type: integer, source: computed, description: "round_half_up((1 - actual_roasted_kg/actual_green_kg) * 10000); null until COMPLETED" }
      - { name: roast_date, type: datetime, source: system, description: "Set to current clock at the complete transition; governs freshness; null until COMPLETED" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | ROASTING | COOLING | COMPLETED | CANCELLED", constraints: "PLANNED | ROASTING | COOLING | COMPLETED | CANCELLED" }

  - name: RoastedLot
    parent: null
    common_fields: true
    fields:
      - { name: roast_batch_id, type: string, source: system, description: "FK -> RoastBatch.id; the batch that produced this roasted lot" }
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; copied from the producing batch" }
      - { name: roast_date, type: datetime, source: system, description: "Copied from RoastBatch.roast_date at completion; freshness reference" }
      - { name: produced_kg, type: number, source: system, description: "= RoastBatch.actual_roasted_kg at completion" }
      - { name: reserved_kg, type: number, source: computed, description: "Sum of allocated_kg over Fulfillments referencing this lot whose status IN {RESERVED, SHIPPED}" }
      - { name: on_hand_kg, type: number, source: computed, description: "produced_kg minus sum of allocated_kg over Fulfillments referencing this lot whose status == SHIPPED; never negative" }
      - { name: available_kg, type: number, source: computed, description: "produced_kg - reserved_kg; never negative" }

  # --- Standing orders / subscriptions (cyclic) ---
  - name: StandingOrder
    parent: WholesaleAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> WholesaleAccount.id; owning account" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; recurring product" }
      - { name: qty_kg, type: number, source: input, description: "Kilograms generated per cycle" }
      - { name: cadence_days, type: integer, source: input, description: "Days between generated orders", constraints: "one of 7, 14, 28" }
      - { name: next_release_at, type: datetime, source: system, description: "Clock timestamp at/after which the next cycle Order may be released" }
      - { name: cycles_released, type: integer, source: computed, default: 0, description: "Count of Orders generated by this standing order" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | PAUSED | CANCELLED", constraints: "ACTIVE | PAUSED | CANCELLED" }

  # --- Wholesale orders (parallel state: fulfillment_status × billing_status) ---
  - name: Order
    parent: WholesaleAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> WholesaleAccount.id; owning account" }
      - { name: standing_order_id, type: string, source: system, description: "FK -> StandingOrder.id; set when generated by a standing order, else null" }
      - { name: lines, type: array, source: input, description: "Order lines: [{ product_id, qty_kg }]; qty_kg > 0" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum over lines of round_half_up(qty_kg * product.base_price_cents_per_kg)" }
      - { name: discount_cents, type: integer, source: computed, description: "round_half_up(subtotal_cents * tier.discount_bps / 10000) computed on the discount of the whole-order subtotal" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents" }
      - { name: fulfillment_status, type: enum, source: system, default: OPEN, description: "OPEN | PARTIALLY_FULFILLED | FULFILLED | CANCELLED", constraints: "OPEN | PARTIALLY_FULFILLED | FULFILLED | CANCELLED" }
      - { name: billing_status, type: enum, source: system, default: UNBILLED, description: "UNBILLED | INVOICED", constraints: "UNBILLED | INVOICED" }

  # --- Fulfillment / shipment (freshness-gated, allocates roasted lots) ---
  - name: Fulfillment
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; fulfilled order" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the order line product being shipped" }
      - { name: roasted_lot_id, type: string, source: input, description: "FK -> RoastedLot.id; the roasted lot allocated for this shipment" }
      - { name: allocated_kg, type: number, source: input, description: "Kilograms drawn from the roasted lot for this fulfillment; > 0" }
      - { name: roast_date, type: datetime, source: computed, description: "Copied from RoastedLot.roast_date at reservation; the roast date shipped" }
      - { name: status, type: enum, source: system, default: RESERVED, description: "RESERVED | SHIPPED | CANCELLED", constraints: "RESERVED | SHIPPED | CANCELLED" }

  # --- Sample / cupping requests (branching) ---
  - name: SampleRequest
    parent: WholesaleAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> WholesaleAccount.id; requesting account" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; product to sample" }
      - { name: sample_kg, type: number, source: input, description: "Sample size in kilograms (small, e.g. 0.25)" }
      - { name: cupping_score, type: number, source: input, description: "Cupping score 0..100 recorded at the review transition; null until reviewed", constraints: "0..100" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | APPROVED | DECLINED | CONVERTED", constraints: "REQUESTED | APPROVED | DECLINED | CONVERTED" }

  # --- Invoicing / net terms / aging ---
  - name: Invoice
    parent: WholesaleAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> WholesaleAccount.id; billed account" }
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; the order this invoice bills" }
      - { name: amount_cents, type: integer, source: system, description: "Invoiced total, copied from Order.total_cents at issue" }
      - { name: paid_cents, type: integer, source: computed, description: "Sum of amount_cents over this invoice's Payments in status CLEARED" }
      - { name: amount_due_cents, type: integer, source: computed, description: "amount_cents - paid_cents; never negative" }
      - { name: issued_at, type: datetime, source: system, description: "Clock timestamp at issue" }
      - { name: due_at, type: datetime, source: system, description: "= issued_at + account.net_terms_days days, pinned at issue" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | PARTIALLY_PAID | PAID | OVERDUE", constraints: "ISSUED | PARTIALLY_PAID | PAID | OVERDUE" }

  - name: Payment
    parent: Invoice
    common_fields: false
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; the invoice paid" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount applied to the invoice; > 0" }
      - { name: status, type: enum, source: system, default: CLEARED, description: "CLEARED; append-only payment event (no reversal in this scope)", constraints: "CLEARED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- RoastBatch: CYCLIC (re-roast loop) + cross-entity green precondition ----
  - entity: RoastBatch
    field: status
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: ROASTING
        trigger: "POST /roast-batches/{id}/start"
        actor: RoasterStaff
        preconditions:
          - "batch.status == PLANNED"
          - "GreenLot.available_kg >= 0 after the reservation is converted to consumption — i.e. actual_green_kg <= GreenLot.on_hand_kg at start (cross-entity: GreenLot must hold enough physical green)"
          - "actual_green_kg > 0"
        side_effects:
          - "Set actual_green_kg from input"
          - "GreenLot.reserved_kg drops by planned_green_kg (batch leaves PLANNED) and GreenLot consumption rises by actual_green_kg; recompute GreenLot.on_hand_kg, reserved_kg, available_kg, reorder_status (cascade to GreenLot)"
          - "increments RoastBatch.version by 1"

      - from: ROASTING
        to: COOLING
        trigger: "POST /roast-batches/{id}/drop"
        actor: RoasterStaff
        preconditions:
          - "batch.status == ROASTING"
        side_effects:
          - "increments RoastBatch.version by 1"

      - from: COOLING
        to: ROASTING
        trigger: "POST /roast-batches/{id}/reroast"
        actor: RoasterStaff
        preconditions:
          - "batch.status == COOLING"
          - "reroast_count < MAX_REROASTS (2)"
        side_effects:
          - "Increments an internal reroast counter (cyclic loop back to ROASTING for a development re-pass)"
          - "increments RoastBatch.version by 1"
        note: "Cyclic edge COOLING->ROASTING enables a bounded re-roast development loop."

      - from: COOLING
        to: COMPLETED
        trigger: "POST /roast-batches/{id}/complete"
        actor: RoasterStaff
        preconditions:
          - "batch.status == COOLING"
          - "actual_roasted_kg > 0"
          - "actual_roasted_kg <= actual_green_kg (cannot gain weight roasting)"
        side_effects:
          - "Set actual_roasted_kg from input; compute actual_shrink_bps; set roast_date = current clock"
          - "Create a RoastedLot (roast_batch_id, product_id, roast_date, produced_kg = actual_roasted_kg) — cascade child creation"
          - "increments RoastBatch.version by 1"

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /roast-batches/{id}/cancel"
        actor: RoasterStaff
        preconditions:
          - "batch.status == PLANNED"
        side_effects:
          - "Releases the planned_green_kg reservation; recompute GreenLot.reserved_kg, available_kg, reorder_status (compensation cascade to GreenLot)"
          - "increments RoastBatch.version by 1"

  # ---- Order.fulfillment_status: PARALLEL dimension A (compound from Fulfillments) ----
  - entity: Order
    field: fulfillment_status
    initial_state: OPEN
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: OPEN
        to: PARTIALLY_FULFILLED
        trigger: "system (a Fulfillment ships covering some but not all ordered kg)"
        actor: system
        preconditions:
          - "0 < total shipped kg per product < ordered kg for at least one line; no line over-shipped"
        side_effects:
          - "Recompute fulfillment_status by bubble-up from child Fulfillment SHIPPED quantities"

      - from: PARTIALLY_FULFILLED
        to: FULFILLED
        trigger: "system (final Fulfillment ships, every line fully covered)"
        actor: system
        preconditions:
          - "For every order line, sum of SHIPPED allocated_kg for that product >= line qty_kg"
        side_effects:
          - "Recompute fulfillment_status = FULFILLED (bubble-up)"

      - from: OPEN
        to: FULFILLED
        trigger: "system (a single Fulfillment ships covering all ordered kg at once)"
        actor: system
        preconditions:
          - "Every order line fully covered by SHIPPED allocated_kg in one shipment"
        side_effects:
          - "Recompute fulfillment_status = FULFILLED (bubble-up)"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: SalesRep
        preconditions:
          - "order.fulfillment_status == OPEN"
          - "order.billing_status == UNBILLED (cross-entity: no Invoice issued for this order)"
        side_effects:
          - "Cancel all RESERVED Fulfillments on this order; each cancellation releases its roasted-lot reservation (cascade: Order -> Fulfillment -> RoastedLot)"
          - "increments Order.version by 1"

  # ---- Order.billing_status: PARALLEL dimension B (independent of fulfillment) ----
  - entity: Order
    field: billing_status
    initial_state: UNBILLED
    terminal_states: [INVOICED]
    transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "POST /orders/{id}/invoice"
        actor: SalesRep
        preconditions:
          - "order.billing_status == UNBILLED"
          - "order.fulfillment_status IN {PARTIALLY_FULFILLED, FULFILLED} (cross-entity: at least one Fulfillment has shipped)"
          - "account.outstanding_balance_cents + order.total_cents <= account.credit_limit_cents (cross-entity: WholesaleAccount credit ceiling)"
        side_effects:
          - "Create an Invoice (amount_cents = order.total_cents, issued_at = clock, due_at = issued_at + account.net_terms_days days, status = ISSUED) — cascade child creation"
          - "Recompute WholesaleAccount.outstanding_balance_cents (ledger sync)"
          - "increments Order.version by 1"

  # ---- Fulfillment: freshness-gated, allocation reservation ----
  - entity: Fulfillment
    field: status
    initial_state: RESERVED
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: (none)
        to: RESERVED
        trigger: "POST /orders/{id}/fulfillments"
        actor: SalesRep
        preconditions:
          - "order.fulfillment_status IN {OPEN, PARTIALLY_FULFILLED}"
          - "RoastedLot.product_id == fulfillment.product_id (cross-entity: lot must be of the ordered product)"
          - "RoastedLot.available_kg >= allocated_kg (quota: enough unreserved roasted stock)"
          - "freshness OK: (clock - RoastedLot.roast_date) in whole days <= min(product.freshness_window_days, tier.freshness_max_days) where tier is the order account's PriceTier (cross-entity rate/threshold)"
          - "allocated_kg does not push cumulative reserved+shipped kg for the line product above the line's ordered qty_kg"
        side_effects:
          - "Set roast_date copied from RoastedLot.roast_date; RoastedLot.reserved_kg and available_kg recompute (cascade to RoastedLot)"
          - "increments Order.version by 1"

      - from: RESERVED
        to: SHIPPED
        trigger: "POST /fulfillments/{id}/ship"
        actor: RoasterStaff
        preconditions:
          - "fulfillment.status == RESERVED"
        side_effects:
          - "RoastedLot.on_hand_kg decreases by allocated_kg; reserved_kg/available_kg recompute (cascade to RoastedLot: reservation becomes consumption)"
          - "Order.fulfillment_status re-derived by bubble-up (OPEN->PARTIALLY_FULFILLED or ->FULFILLED)"
          - "increments Order.version by 1"

      - from: RESERVED
        to: CANCELLED
        trigger: "POST /fulfillments/{id}/cancel"
        actor: SalesRep
        preconditions:
          - "fulfillment.status == RESERVED"
        side_effects:
          - "Release roasted-lot reservation: RoastedLot.reserved_kg/available_kg recompute (compensation cascade to RoastedLot)"
          - "increments Order.version by 1"

  # ---- StandingOrder: CYCLIC (release loop) ----
  - entity: StandingOrder
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /standing-orders/{id}/release"
        actor: SalesRep
        preconditions:
          - "standing_order.status == ACTIVE"
          - "clock >= standing_order.next_release_at"
          - "account.status == ACTIVE (cross-entity: not on credit hold/closed)"
          - "product.archived == false (cross-entity: Product still sellable)"
        side_effects:
          - "Create an Order (account_id, standing_order_id, single line {product_id, qty_kg}) priced per tier — cascade child creation"
          - "Advance next_release_at by cadence_days; increment cycles_released (cyclic self-loop)"
          - "increments StandingOrder.version by 1"

      - from: ACTIVE
        to: PAUSED
        trigger: "POST /standing-orders/{id}/pause"
        actor: SalesRep
        preconditions:
          - "standing_order.status == ACTIVE"
        side_effects:
          - "increments StandingOrder.version by 1"

      - from: PAUSED
        to: ACTIVE
        trigger: "POST /standing-orders/{id}/resume"
        actor: SalesRep
        preconditions:
          - "standing_order.status == PAUSED"
        side_effects:
          - "increments StandingOrder.version by 1"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /standing-orders/{id}/cancel"
        actor: SalesRep
        preconditions:
          - "standing_order.status IN {ACTIVE, PAUSED}"
        side_effects:
          - "increments StandingOrder.version by 1"

      - from: PAUSED
        to: CANCELLED
        trigger: "POST /standing-orders/{id}/cancel"
        actor: SalesRep
        preconditions:
          - "standing_order.status IN {ACTIVE, PAUSED}"
        side_effects:
          - "increments StandingOrder.version by 1"

  # ---- SampleRequest: BRANCHING (fork to APPROVED / DECLINED, divergent side effects) ----
  - entity: SampleRequest
    field: status
    initial_state: REQUESTED
    terminal_states: [DECLINED, CONVERTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /sample-requests/{id}/review"
        actor: RoasterStaff
        preconditions:
          - "sample_request.status == REQUESTED"
          - "decision == APPROVE"
          - "cupping_score in 0..100"
        side_effects:
          - "Set cupping_score from input (branch APPROVE)"
          - "increments SampleRequest.version by 1"

      - from: REQUESTED
        to: DECLINED
        trigger: "POST /sample-requests/{id}/review"
        actor: RoasterStaff
        preconditions:
          - "sample_request.status == REQUESTED"
          - "decision == DECLINE"
        side_effects:
          - "Set cupping_score from input (branch DECLINE; terminal, no order eligibility)"
          - "increments SampleRequest.version by 1"

      - from: APPROVED
        to: CONVERTED
        trigger: "POST /sample-requests/{id}/convert"
        actor: SalesRep
        preconditions:
          - "sample_request.status == APPROVED"
          - "cupping_score >= MIN_CONVERT_SCORE (80)"
          - "product.archived == false (cross-entity: Product still sellable)"
        side_effects:
          - "Create an Order for the account with one line {product_id, qty_kg = sample-to-order qty} (branch CONVERT, divergent from DECLINE) — cascade child creation"
          - "increments SampleRequest.version by 1"

  # ---- Invoice: aging + payment-driven ----
  - entity: Invoice
    field: status
    initial_state: ISSUED
    terminal_states: [PAID]
    transitions:
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /invoices/{id}/payments"
        actor: SalesRep
        preconditions:
          - "invoice.status IN {ISSUED, OVERDUE}"
          - "0 < payment.amount_cents < invoice.amount_due_cents"
        side_effects:
          - "Recompute paid_cents, amount_due_cents; recompute WholesaleAccount.outstanding_balance_cents (ledger sync)"

      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/payments"
        actor: SalesRep
        preconditions:
          - "invoice.status IN {ISSUED, OVERDUE}"
          - "payment.amount_cents == invoice.amount_due_cents"
        side_effects:
          - "Recompute paid_cents, amount_due_cents = 0; recompute WholesaleAccount.outstanding_balance_cents; if account was CREDIT_HOLD and now under limit it returns to ACTIVE (cross-entity ledger sync)"

      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /invoices/{id}/payments"
        actor: SalesRep
        preconditions:
          - "invoice.status IN {PARTIALLY_PAID, OVERDUE}"
          - "payment.amount_cents == invoice.amount_due_cents"
        side_effects:
          - "Recompute paid_cents, amount_due_cents = 0; recompute WholesaleAccount.outstanding_balance_cents"

      - from: ISSUED
        to: OVERDUE
        trigger: "POST /_clock/advance (system aging sweep when clock passes due_at)"
        actor: system
        preconditions:
          - "invoice.status IN {ISSUED, PARTIALLY_PAID}"
          - "clock > invoice.due_at"
          - "invoice.amount_due_cents > 0"
        side_effects:
          - "Set status OVERDUE; if account.outstanding_balance_cents > credit_limit_cents OR any invoice OVERDUE, set WholesaleAccount.status = CREDIT_HOLD (cascade to account)"

      - from: PARTIALLY_PAID
        to: OVERDUE
        trigger: "POST /_clock/advance (system aging sweep when clock passes due_at)"
        actor: system
        preconditions:
          - "invoice.status IN {ISSUED, PARTIALLY_PAID}"
          - "clock > invoice.due_at"
          - "invoice.amount_due_cents > 0"
        side_effects:
          - "Set status OVERDUE; set WholesaleAccount.status = CREDIT_HOLD if overdue exists (cascade to account)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent.version — true races only)
# =============================================================================
concurrency_rules:
  - rule_id: roasted-lot-reserve-stale
    parent_entity: RoastedLot
    write_endpoint: "POST /orders/{id}/fulfillments"
    occ_field: "expected_roasted_lot_version"
    description: |
      Reserving roasted kilograms against a RoastedLot whose version has advanced
      since the client last observed it is rejected. A prior reservation against
      the same lot legitimately succeeded and consumed available kilograms, so the
      current writer's view of available_kg is stale; the reservation is refused on
      the stale-version check rather than silently overbooking the lot.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: green-lot-reserve-stale
    parent_entity: GreenLot
    write_endpoint: "POST /roast-batches"
    occ_field: "expected_green_lot_version"
    description: |
      Creating a RoastBatch (which reserves planned_green_kg) against a GreenLot
      whose version has advanced since the client last read it is rejected. Another
      batch creation has already reserved green from the same lot, making the
      writer's available_kg view stale; the create is refused on the stale-version
      check rather than over-reserving the finite green pool.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- DUAL-VARIANT #1: roasted-weight yield (RoastBatch domain) ----
  - name: roasted_weight_yield
    trigger: "RoastBatch create (planned variant); RoastBatch complete (actual variant)"
    algorithm: forward_looking
    formula: |
      planned_roasted_kg = round_half_up(planned_green_kg * (1 - expected_shrink_bps / 10000), 3)
      actual_roasted_kg  = recorded at complete (input), MUST satisfy 0 < actual_roasted_kg <= actual_green_kg
      actual_shrink_bps  = round_half_up((1 - actual_roasted_kg / actual_green_kg) * 10000, 0)
    input_set: "Single RoastBatch; planned uses Product.roast_profile expected_shrink_bps, actual uses charged/weighed inputs"
    constants:
      SHRINK_DENOM: 10000
    precision: "planned_roasted_kg 3 decimals round_half_up; actual_shrink_bps integer round_half_up"
    variants:
      - name: planned
        when: "At RoastBatch creation, before any green is charged"
        difference: "Forward estimate from expected_shrink_bps; never touches actual_green_kg"
      - name: actual
        when: "At complete, after green charged and roasted weighed"
        difference: "Uses measured actual_green_kg / actual_roasted_kg; yields actual_shrink_bps that may diverge from expected_shrink_bps"

  # ---- DUAL-VARIANT #2: account outstanding balance (WholesaleAccount domain) ----
  - name: account_outstanding_balance
    trigger: "Invoice issue, Payment cleared, aging sweep, order invoice precheck"
    algorithm: aggregation
    formula: |
      posted_balance_cents = sum(invoice.amount_due_cents
                                 for invoice in account.invoices
                                 if invoice.status IN {ISSUED, PARTIALLY_PAID, OVERDUE})
      projected_balance_cents = posted_balance_cents + candidate_order.total_cents
    input_set: "Account's invoices filtered by status; posted excludes PAID; tie-break not order-sensitive (pure sum)"
    constants: {}
    precision: "integer cents, no rounding (all summands integer)"
    variants:
      - name: posted
        when: "Reading account.outstanding_balance_cents / aging credit-hold decision"
        difference: "Counts only already-issued invoices' amount_due_cents"
      - name: projected
        when: "Credit precheck at POST /orders/{id}/invoice"
        difference: "Adds the candidate order's total_cents before any invoice exists, so a credit decision can differ from the posted view for identical invoice data"

  # ---- COMBINATORIAL (b): nested rounding order — order pricing ----
  - name: order_pricing
    trigger: "Order create (manual, standing-order release, sample convert) and on line edit"
    algorithm: tiered_pricing
    formula: |
      # Rounding order is PINNED: round each line to integer cents FIRST, then sum,
      # then apply the tier discount to the summed subtotal and round the discount.
      per_line_cents[i] = round_half_up(line[i].qty_kg * product[i].base_price_cents_per_kg)   # round per line
      subtotal_cents    = sum(per_line_cents)                                                   # then sum
      discount_cents    = round_half_up(subtotal_cents * tier.discount_bps / 10000)             # discount on summed subtotal
      total_cents       = subtotal_cents - discount_cents
    input_set: "All lines on the order; tier from account.price_tier_id"
    constants:
      BPS_DENOM: 10000
    precision: "round_half_up to integer cents; round-per-line-then-sum order is authoritative (NOT sum-then-round)"

  # ---- COMBINATORIAL (a): freshness eligibility — >=3 inputs, nested min, branch on tier ----
  - name: freshness_eligibility
    trigger: "Fulfillment reservation (POST /orders/{id}/fulfillments)"
    algorithm: threshold
    formula: |
      age_days       = floor((clock - roasted_lot.roast_date) / 86400 seconds)   # whole days, floor
      effective_max  = min(product.freshness_window_days, tier.freshness_max_days)  # nested min across two entities
      eligible       = age_days <= effective_max
      # Boundary: age_days == effective_max is ELIGIBLE (<=); age_days == effective_max + 1 is STALE.
    input_set: "RoastedLot.roast_date, Product.freshness_window_days, PriceTier.freshness_max_days (via account), clock"
    constants:
      SECONDS_PER_DAY: 86400
    precision: "age_days floored to whole days; comparison uses <= (inclusive at boundary)"

  # ---- par-based reorder threshold (GreenLot) ----
  - name: green_reorder_status
    trigger: "GreenLot create, RoastBatch create/start/cancel/complete (any change to reserved/on_hand)"
    algorithm: threshold
    formula: |
      on_hand_kg   = round_half_up(received_kg - sum(consumed_green_kg for batches in {ROASTING, COOLING, COMPLETED}), 3)
      reserved_kg  = round_half_up(sum(planned_green_kg for batches in PLANNED), 3)
      available_kg = max(0, round_half_up(on_hand_kg - reserved_kg, 3))
      reorder_status = BELOW_PAR if available_kg < par_level_kg else OK
      # Boundary: available_kg == par_level_kg is OK (strict < triggers reorder).
    input_set: "GreenLot's RoastBatches filtered by status; consumed_green_kg = actual_green_kg once charged"
    constants: {}
    precision: "kg to 3 decimals round_half_up; reorder boundary uses strict < (== par is OK)"

  # ---- roasted-lot availability (allocation accounting) ----
  - name: roasted_lot_availability
    trigger: "Fulfillment reserve/ship/cancel"
    algorithm: aggregation
    formula: |
      reserved_kg  = round_half_up(sum(allocated_kg for fulfillments in {RESERVED, SHIPPED}), 3)
      on_hand_kg   = max(0, round_half_up(produced_kg - sum(allocated_kg for fulfillments in SHIPPED), 3))
      available_kg = max(0, round_half_up(produced_kg - reserved_kg, 3))
    input_set: "RoastedLot's Fulfillments filtered by status"
    constants: {}
    precision: "kg to 3 decimals round_half_up; never negative"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC; entity-backed WholesaleBuyer must act on its own account's resources"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist (validated left-to-right in path), incl. FK targets (account, product, green_lot, roasted_lot, invoice, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body present and required fields present with correct types; enum members valid; numeric quantities > 0 where required; net_terms_days/cadence_days/roast_level among allowed values"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all writes

  - priority: 5
    category: business_constraint
    check: "Uniqueness: PriceTier.code unique among non-archived; Product.sku unique among non-archived; GreenLot.lot_ref unique among non-depleted"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /price-tiers, POST /products, POST /green-lots"

  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition (state-machine from-state precondition)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"

  - priority: 7
    category: business_referential
    check: "Cross-entity reference compatibility: RoastedLot.product_id == fulfillment.product_id; RoastBatch.product roast_profile pinned; sample/standing-order product not archived"
    error_id: ERR_PRODUCT_MISMATCH
    http_status: 409
    applies_to: "POST /orders/{id}/fulfillments, POST /sample-requests/{id}/convert, POST /standing-orders/{id}/release"

  - priority: 8
    category: business_safety
    check: "Freshness gate: floor((clock - roasted_lot.roast_date)/86400) <= min(product.freshness_window_days, tier.freshness_max_days)"
    error_id: ERR_STALE_ROAST
    http_status: 409
    applies_to: "POST /orders/{id}/fulfillments"

  - priority: 9
    category: business_temporal
    check: "Standing-order release not before next_release_at: clock >= standing_order.next_release_at"
    error_id: ERR_RELEASE_NOT_DUE
    http_status: 409
    applies_to: "POST /standing-orders/{id}/release"

  - priority: 10
    category: business_constraint
    check: "Green sufficiency at start: actual_green_kg <= GreenLot.on_hand_kg (cannot charge more green than physically on hand)"
    error_id: ERR_INSUFFICIENT_GREEN
    http_status: 409
    applies_to: "POST /roast-batches/{id}/start"

  - priority: 11
    category: business_constraint
    check: "Roasted sufficiency at reservation: RoastedLot.available_kg >= allocated_kg; and line over-allocation: reserved+shipped per line product <= line qty_kg"
    error_id: ERR_INSUFFICIENT_ROASTED
    http_status: 409
    applies_to: "POST /orders/{id}/fulfillments"

  - priority: 12
    category: business_constraint
    check: "Roast weight conservation: actual_roasted_kg <= actual_green_kg at complete"
    error_id: ERR_WEIGHT_GAIN
    http_status: 409
    applies_to: "POST /roast-batches/{id}/complete"

  - priority: 13
    category: business_fiscal
    check: "Credit ceiling at invoice: account.outstanding_balance_cents + order.total_cents <= account.credit_limit_cents; account.status == ACTIVE"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /orders/{id}/invoice"

  - priority: 14
    category: business_fiscal
    check: "Payment amount sane: 0 < amount_cents <= invoice.amount_due_cents (no overpayment)"
    error_id: ERR_OVERPAYMENT
    http_status: 409
    applies_to: "POST /invoices/{id}/payments"

  - priority: 15
    category: state
    check: "OCC: expected_<parent>_version equals current parent version on guarded writes (green-lot reserve, roasted-lot reserve)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /roast-batches, POST /orders/{id}/fulfillments"

