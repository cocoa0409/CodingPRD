            - call: "POST /ood-placements/tuition-rate-schedules"
              payload: { school_id: "${sch_id}", fiscal_year: 2027, day_rate_cents: 32000, residential_rate_cents: 51500, service_hourly_rate_cents: 11000, effective_from: "2026-07-01", effective_to: "2027-06-30", approval_state: "STATE_APPROVED", expected_school_version: "${sch_v}" }
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
              captures: { rs_id: $.data.id }
          trigger:
            - call: "POST /ood-placements/tuition-rate-schedules"
              payload: { school_id: "${sch_id}", fiscal_year: 2028, day_rate_cents: 33500, residential_rate_cents: 53000, service_hourly_rate_cents: 11500, effective_from: "2027-07-01", effective_to: "2028-06-30", approval_state: "STATE_APPROVED", expected_school_version: "${sch_v}" }
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
            - call: "GET /ood-placements/private-schools/${sch_id}"
              payload: {}
              as: SystemAdmin
              as_user_id: "u-admin-1"
              captures: { sch_v2: $.data.version }
            - call: "POST /ood-placements/tuition-rate-schedules"
              payload: { school_id: "${sch_id}", fiscal_year: 2028, day_rate_cents: 33500, residential_rate_cents: 53000, service_hourly_rate_cents: 11500, effective_from: "2027-07-01", effective_to: "2028-06-30", approval_state: "STATE_APPROVED", expected_school_version: "${sch_v2}" }
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
              captures: { rs28_id: $.data.id }
          assert:
            - "Trigger 1 (expected_school_version 1) returns HTTP 412 with data.error_id == ERR_STALE_SCHOOL_VERSION, NOT ERR_STALE_PLACEMENT_VERSION"
            - "Trigger 2 confirms the school version is 2"
            - "Trigger 3 (expected_school_version 2) returns HTTP 201 with fiscal_year == 2028 and approval_state == STATE_APPROVED"
            - "A follow-up GET /ood-placements/private-schools/${sch_id} shows version == 3 and active_rate_schedule_id == the FY2028 schedule id"
            - "A follow-up GET /ood-placements/tuition-rate-schedules?school_id=${sch_id} returns total_count == 2, and the FY2027 schedule is still STATE_APPROVED - a different fiscal year never supersedes"
      - name: version_increments_on_every_write_and_never_on_a_read
        claim_type: optimistic_concurrency
        grounds:
          - "entities.Student.common_fields"
          - "response_envelope"
          - "endpoints.PATCH_students_medicaid_consent"
        distinguishing_aspect: |
          OCC is only sound if version moves on EVERY write and stands still on reads. A freshly
          created entity is at version 1; two successive PATCHes take it to 2 then 3; the interleaved
          GETs leave it untouched. The second PATCH writes the SAME values as the first, so an
          implementation that skips the bump when nothing changed - a very common optimization - fails
          here and would silently let a stale writer win elsewhere.
        test_recipe:
          setup:
            - "Clock at the default 2026-08-01T00:00:00Z."
            - "One Student created by u-coord-1 with medicaid_eligible and medicaid_consent_on_file defaulted to false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
            - call: "POST /ood-placements/students"
              payload: { state_student_id: "SS-C077", full_name: "Anouk Vervloet", district_of_residence: "Northvale USD", disability_category: "AUTISM", iep_effective_date: "2026-08-15", lre_current_setting: "RESOURCE_40_79" }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
