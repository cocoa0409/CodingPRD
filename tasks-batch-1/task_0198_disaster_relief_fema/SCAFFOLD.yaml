# =============================================================================
# Disaster Relief & FEMA Case Management — Scaffold (§1.0–§1.7)
# Difficulty: Expert
# =============================================================================

scenario: |
  Disaster Relief & FEMA Case Management: registration/intake, damage
  assessment/inspection, IHP eligibility, award calculation/duplication-of-benefits
  check, appeal, SBA referral, rental/repair assistance, recoupment

domain_name: disaster-relief-fema
api_prefix: /disaster-relief

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation     # provisional vs final award; at-award vs at-recoupment DOB
    - cascading_side_effects       # SBA approval -> DOB -> award reduction -> recoupment
    - rate_threshold_triggers      # IHP max-grant cap, SBA income/loss thresholds
    - optimistic_concurrency       # OCC on IhpCase.version for disbursement / appeal create
    - derived_field_reconciliation # total_approved, net_eligible, total_dob, remaining_obligation

  entity_topology: flat
  # All entities are peer collections under /disaster-relief linked by FK fields;
  # no nesting of business resources in URL paths (only the /{id} resource form).

  state_machine_shape: cyclic
  # IhpCase carries an appeal cycle (AWARD_APPROVED -> UNDER_APPEAL -> AWARD_APPROVED);
  # SbaReferral and Appeal contribute branching with divergent side-effect sets.

  relationship_patterns:
    - one_to_many        # DisasterDeclaration -> Applicants; IhpCase -> AwardLineItems
    - cross_aggregate    # IhpCase reads DamageAssessment / DisasterDeclaration / DobRecord state

  role_model: segregation_of_duties
  # The Caseworker who renders the original eligibility determination on an IhpCase
  # MUST NOT be the Caseworker who decides an appeal on the same case (tracked via
  # decided_by_caseworker_id). Inspector and Caseworker own disjoint operations.

  consistency_model: immediate
  # All cascades (SBA->DOB->award->recoupment, appeal re-decision) complete inside
  # the triggering request; derived fields are reconciled synchronously.

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: DisasterDeclaration
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: title, type: string, source: input, description: "Disaster declaration title, e.g. 'DR-4827 Severe Storms'" }
      - { name: incident_start, type: datetime, source: input, description: "Inclusive start of the incident period (ISO 8601 UTC). Damage dates outside the incident period are ineligible." }
      - { name: incident_end, type: datetime, source: input, description: "Inclusive end of the incident period (ISO 8601 UTC). MUST be >= incident_start." }
      - { name: ihp_max_grant_cents, type: integer, source: input, description: "Per-household IHP financial-assistance cap in cents for this declaration (e.g. 4250000 = $42,500)." }
      - { name: registration_deadline, type: datetime, source: input, description: "Last instant an Applicant may register against this declaration (ISO 8601 UTC)." }
      - { name: status, type: enum, source: system, description: "OPEN -> REGISTRATION_CLOSED -> CLOSED", default: "OPEN", constraints: "enum: OPEN, REGISTRATION_CLOSED, CLOSED" }

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Inspector full name" }
      - { name: badge_number, type: string, source: input, description: "Unique inspector badge number", constraints: "unique across Inspector" }
      - { name: travel_buffer_minutes, type: integer, source: input, default: 30, description: "Minimum gap in minutes the inspector requires between two inspection appointments (closed-interval buffer)." }
      - { name: status, type: enum, source: system, description: "ACTIVE -> SUSPENDED", default: "ACTIVE", constraints: "enum: ACTIVE, SUSPENDED" }

  - name: Caseworker
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Caseworker full name" }
      - { name: employee_id, type: string, source: input, description: "Unique caseworker employee id", constraints: "unique across Caseworker" }
      - { name: can_approve_awards, type: boolean, source: input, default: true, description: "Whether this caseworker may approve awards (vs recommend only)." }
      - { name: status, type: enum, source: system, description: "ACTIVE -> SUSPENDED", default: "ACTIVE", constraints: "enum: ACTIVE, SUSPENDED" }

  - name: Applicant
    parent: DisasterDeclaration
    common_fields: true
    fields:
      - { name: declaration_id, type: string, source: input, description: "FK -> DisasterDeclaration.id" }
      - { name: household_name, type: string, source: input, description: "Primary applicant / head-of-household name" }
      - { name: household_size, type: integer, source: input, description: "Number of household members (>= 1).", constraints: ">= 1" }
      - { name: annual_income_cents, type: integer, source: input, description: "Self-reported annual household income in cents (used for SBA income test).", constraints: ">= 0" }
      - { name: damage_date, type: datetime, source: input, description: "Date the disaster damage occurred (ISO 8601 UTC). MUST fall within the declaration incident period to be eligible." }
      - { name: reported_repair_cost_cents, type: integer, source: input, description: "Self-reported home repair cost in cents (drives PROVISIONAL award).", constraints: ">= 0" }
      - { name: reported_personal_property_cents, type: integer, source: input, description: "Self-reported personal-property loss in cents (drives PROVISIONAL award).", constraints: ">= 0" }
      - { name: reported_rental_months, type: integer, source: input, description: "Self-reported months of temporary rental need (drives PROVISIONAL award).", constraints: ">= 0" }
      - { name: total_dob_cents, type: integer, source: computed, description: "Derived: sum of DobRecord.amount_cents for this applicant where dob_status == RECORDED. Reconciled on every DOB mutation.", default: 0 }
      - { name: status, type: enum, source: system, description: "REGISTERED -> INSPECTION_SCHEDULED -> INSPECTED -> ELIGIBILITY_PENDING -> (ELIGIBLE / INELIGIBLE) -> WITHDRAWN", default: "REGISTERED", constraints: "enum: REGISTERED, INSPECTION_SCHEDULED, INSPECTED, ELIGIBILITY_PENDING, ELIGIBLE, INELIGIBLE, WITHDRAWN" }

  - name: DamageAssessment
    parent: Applicant
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id" }
      - { name: inspector_id, type: string, source: input, description: "FK -> Inspector.id; the inspector conducting this inspection." }
      - { name: scheduled_start, type: datetime, source: input, description: "Inspection appointment start (ISO 8601 UTC). Used for inspector calendar overlap detection (closed interval)." }
      - { name: scheduled_end, type: datetime, source: input, description: "Inspection appointment end (ISO 8601 UTC). MUST be > scheduled_start." }
      - { name: habitability, type: enum, source: input, description: "Set at INSPECTED. HABITABLE = minor damage, repair only; UNINHABITABLE = unlocks rental + replacement.", required: false, constraints: "enum: HABITABLE, UNINHABITABLE" }
      - { name: verified_repair_cost_cents, type: integer, source: input, description: "Inspector-verified real-property repair cost in cents (drives FINAL award). Set at INSPECTED.", required: false, constraints: ">= 0" }
      - { name: verified_personal_property_cents, type: integer, source: input, description: "Inspector-verified personal-property loss in cents (drives FINAL award). Set at INSPECTED.", required: false, constraints: ">= 0" }
      - { name: verified_rental_months, type: integer, source: input, description: "Inspector-verified months of temporary rental need (drives FINAL award). Set at INSPECTED.", required: false, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> INSPECTED -> VERIFIED / CANCELLED", default: "SCHEDULED", constraints: "enum: SCHEDULED, INSPECTED, VERIFIED, CANCELLED" }

  - name: IhpCase
    parent: Applicant
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id" }
      - { name: assessment_id, type: string, source: input, description: "FK -> DamageAssessment.id; the VERIFIED assessment this case is built from." }
      - { name: monthly_fmr_cents, type: integer, source: input, description: "Fair Market Rent per month in cents for the applicant's locality (rental-assistance unit rate).", constraints: ">= 0" }
      - { name: gross_eligible_cents, type: integer, source: computed, description: "Derived FINAL gross eligible amount across line items BEFORE max-grant cap and BEFORE DOB offset. Computed by eligible_award_amount (final variant).", default: 0 }
      - { name: capped_eligible_cents, type: integer, source: computed, description: "Derived: min(gross_eligible_cents, declaration ihp_max_grant_cents). The max-grant cap result.", default: 0 }
      - { name: net_eligible_cents, type: integer, source: computed, description: "Derived: max(0, capped_eligible_cents - dob_offset_cents). The amount the household is finally entitled to.", default: 0 }
      - { name: dob_offset_cents, type: integer, source: computed, description: "Derived: duplication-of-benefits offset applied to this case, computed by duplication_of_benefits_offset.", default: 0 }
      - { name: total_approved_cents, type: integer, source: computed, description: "Derived: sum of AwardLineItem.approved_amount_cents for this case where li_status IN {APPROVED, DISBURSED}. Conserved quantity for the obligation invariant.", default: 0 }
      - { name: disbursed_total_cents, type: integer, source: computed, description: "Derived: sum of Disbursement.amount_cents for this case where disb_status == PAID.", default: 0 }
      - { name: remaining_obligation_cents, type: integer, source: computed, description: "Derived: total_approved_cents - disbursed_total_cents. Invariant: disbursed_total_cents + remaining_obligation_cents == total_approved_cents.", default: 0 }
      - { name: determined_by_caseworker_id, type: string, source: system, description: "FK -> Caseworker.id; the caseworker who rendered the original eligibility determination (set at ELIGIBILITY_PENDING->AWARD_APPROVED/DENIED). Used to enforce segregation of duties on appeal." }
      - { name: pre_appeal_status, type: enum, source: system, description: "The status (AWARD_APPROVED or DENIED) the case held immediately before its current/most-recent appeal was filed. Set on AWARD_APPROVED->UNDER_APPEAL and DENIED->UNDER_APPEAL; consumed when an appeal is DENIED to restore the case to exactly this status.", required: false, constraints: "enum: AWARD_APPROVED, DENIED" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ELIGIBILITY_PENDING -> (AWARD_APPROVED / DENIED); AWARD_APPROVED -> DISBURSING -> CLOSED; (AWARD_APPROVED | DENIED) -> UNDER_APPEAL -> (re-decided to AWARD_APPROVED / DENIED); cyclic appeal loop.", default: "DRAFT", constraints: "enum: DRAFT, ELIGIBILITY_PENDING, AWARD_APPROVED, DENIED, DISBURSING, UNDER_APPEAL, CLOSED" }

  - name: AwardLineItem
    parent: IhpCase
    common_fields: true
    fields:
      - { name: ihp_case_id, type: string, source: input, description: "FK -> IhpCase.id" }
      - { name: category, type: enum, source: system, description: "Award component category.", constraints: "enum: RENTAL_ASSISTANCE, REPAIR_ASSISTANCE, PERSONAL_PROPERTY, REPLACEMENT" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "Eligible amount for this category BEFORE cap proration and DOB offset.", default: 0 }
      - { name: approved_amount_cents, type: integer, source: computed, description: "Final approved amount for this line after max-grant proration and DOB waterfall offset (rounded to cents).", default: 0 }
      - { name: li_status, type: enum, source: system, description: "PENDING -> APPROVED -> DISBURSED; PENDING|APPROVED -> VOIDED on appeal/recoupment revert.", default: "PENDING", constraints: "enum: PENDING, APPROVED, DISBURSED, VOIDED" }

  - name: DobRecord
    parent: Applicant
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id" }
      - { name: source_type, type: enum, source: input, description: "Origin of the duplicative benefit.", constraints: "enum: INSURANCE, SBA_LOAN, CHARITY, OTHER_FEDERAL" }
      - { name: amount_cents, type: integer, source: input, description: "Benefit amount in cents from this source.", constraints: ">= 0" }
      - { name: received_at, type: datetime, source: input, description: "When the benefit was received/settled (ISO 8601 UTC). Determines whether it is an AWARD-time or LATE (post-award) duplication." }
      - { name: dob_status, type: enum, source: system, description: "RECORDED -> REVERSED. Only RECORDED rows count toward total_dob and offsets.", default: "RECORDED", constraints: "enum: RECORDED, REVERSED" }

  - name: Appeal
    parent: IhpCase
    common_fields: true
    fields:
      - { name: ihp_case_id, type: string, source: input, description: "FK -> IhpCase.id" }
      - { name: expected_ihp_case_version, type: integer, source: input, description: "OCC: the IhpCase.version the appellant last observed; rejected as stale if the case advanced." }
      - { name: reason, type: string, source: input, description: "Appellant's stated grounds for appeal." }
      - { name: requested_repair_cost_cents, type: integer, source: input, description: "Repair cost the appellant asks to be re-evaluated against (overrides verified amount if appeal is granted).", required: false, constraints: ">= 0" }
      - { name: decided_by_caseworker_id, type: string, source: system, description: "FK -> Caseworker.id; the caseworker who decided this appeal. MUST differ from IhpCase.determined_by_caseworker_id (segregation of duties)." }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> (GRANTED / DENIED) with divergent side-effects per branch.", default: "SUBMITTED", constraints: "enum: SUBMITTED, GRANTED, DENIED" }

  - name: SbaReferral
    parent: IhpCase
    common_fields: true
    fields:
      - { name: ihp_case_id, type: string, source: input, description: "FK -> IhpCase.id" }
      - { name: referred_loss_cents, type: integer, source: system, description: "Verified total loss snapshot that triggered the referral.", default: 0 }
      - { name: sba_loan_amount_cents, type: integer, source: input, description: "Loan amount SBA approved (only meaningful when outcome=APPROVED); becomes an SBA_LOAN DobRecord.", required: false, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "REFERRED -> (SBA_APPROVED / SBA_DECLINED) with divergent side-effects.", default: "REFERRED", constraints: "enum: REFERRED, SBA_APPROVED, SBA_DECLINED" }

  - name: Disbursement
    parent: IhpCase
    common_fields: true
    fields:
      - { name: ihp_case_id, type: string, source: input, description: "FK -> IhpCase.id" }
      - { name: line_item_id, type: string, source: input, description: "FK -> AwardLineItem.id; the approved line being paid against." }
      - { name: expected_ihp_case_version, type: integer, source: input, description: "OCC: the IhpCase.version the disbursing caseworker last observed; rejected as stale if the case advanced." }
      - { name: amount_cents, type: integer, source: input, description: "Amount to disburse in cents against the line item.", constraints: ">= 1" }
      - { name: disb_status, type: enum, source: system, description: "PAID -> VOIDED. A VOIDED disbursement credits remaining_obligation back.", default: "PAID", constraints: "enum: PAID, VOIDED" }

  - name: RentalAssistancePeriod
    parent: IhpCase
    common_fields: true
    fields:
      - { name: ihp_case_id, type: string, source: input, description: "FK -> IhpCase.id; the case funding this rental coverage." }
      - { name: applicant_id, type: string, source: system, description: "FK -> Applicant.id; copied from the case (the household whose rental coverage timeline this occupies)." }
      - { name: period_start, type: datetime, source: input, description: "Inclusive start of the rental coverage window (ISO 8601 UTC). Used for per-applicant coverage overlap detection (half-open, no buffer)." }
      - { name: period_end, type: datetime, source: input, description: "Exclusive end of the rental coverage window (ISO 8601 UTC). MUST be > period_start." }
      - { name: status, type: enum, source: system, description: "ACTIVE -> CLOSED", default: "ACTIVE", constraints: "enum: ACTIVE, CLOSED" }

  - name: Recoupment
    parent: IhpCase
    common_fields: true
    fields:
      - { name: ihp_case_id, type: string, source: input, description: "FK -> IhpCase.id" }
      - { name: origin, type: enum, source: system, description: "What created the overpayment debt.", constraints: "enum: LATE_DOB, APPEAL_REDUCTION, MANUAL" }
      - { name: debt_amount_cents, type: integer, source: computed, description: "Computed overpayment = max(0, disbursed_total_cents - net_eligible_cents) at establishment.", default: 0 }
      - { name: recovered_cents, type: integer, source: input, description: "Cumulative amount recovered from the household so far.", default: 0, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ESTABLISHED -> (SATISFIED / WAIVED). SATISFIED when recovered_cents >= debt_amount_cents.", default: "ESTABLISHED", constraints: "enum: ESTABLISHED, SATISFIED, WAIVED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: DisasterDeclaration
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: REGISTRATION_CLOSED
        trigger: "POST /disaster-relief/declarations/{id}/close-registration"
        actor: ProgramAdmin
        preconditions: ["Declaration is OPEN (ERR_DECLARATION_NOT_OPEN)"]
        side_effects: ["No new Applicant may be created against this declaration (registration gate)"]
      - from: REGISTRATION_CLOSED
        to: CLOSED
        trigger: "POST /disaster-relief/declarations/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "Declaration is REGISTRATION_CLOSED (ERR_DECLARATION_NOT_REGISTRATION_CLOSED)"
          - "No IhpCase under this declaration is in DISBURSING (ERR_OPEN_DISBURSING_CASES)"
        side_effects: ["Disbursement creation is blocked once the declaration is CLOSED (cross-entity gate on Disbursement)"]

  - entity: Applicant
    initial_state: REGISTERED
    terminal_states: [INELIGIBLE, WITHDRAWN]
    transitions:
      - from: REGISTERED
        to: INSPECTION_SCHEDULED
        trigger: "POST /disaster-relief/assessments (creates a SCHEDULED DamageAssessment for this applicant)"
        actor: Inspector
        preconditions: ["Applicant is REGISTERED (ERR_APPLICANT_NOT_REGISTERED)"]
        side_effects: ["A DamageAssessment is created in SCHEDULED state"]
      - from: INSPECTION_SCHEDULED
        to: INSPECTED
        trigger: "POST /disaster-relief/assessments/{id}/inspect"
        actor: Inspector
        preconditions: ["The applicant's assessment moves SCHEDULED->INSPECTED"]
        side_effects: ["Applicant.status -> INSPECTED"]
      - from: INSPECTED
        to: ELIGIBILITY_PENDING
        trigger: "POST /disaster-relief/ihp-cases (creates IhpCase referencing a VERIFIED assessment)"
        actor: Caseworker
        preconditions:
          - "Applicant is INSPECTED (ERR_APPLICANT_NOT_INSPECTED)"
          - "The referenced DamageAssessment is VERIFIED (ERR_ASSESSMENT_NOT_VERIFIED) [cross-entity]"
        side_effects: ["An IhpCase is created in DRAFT, then advanced; Applicant.status -> ELIGIBILITY_PENDING"]
      - from: ELIGIBILITY_PENDING
        to: ELIGIBLE
        trigger: "system (on IhpCase ELIGIBILITY_PENDING -> AWARD_APPROVED)"
        actor: system
        preconditions: ["IhpCase reached AWARD_APPROVED with net_eligible_cents > 0"]
        side_effects: []
      - from: ELIGIBILITY_PENDING
        to: INELIGIBLE
        trigger: "system (on IhpCase ELIGIBILITY_PENDING -> DENIED)"
        actor: system
        preconditions: ["IhpCase reached DENIED"]
        side_effects: []
      - from: REGISTERED
        to: WITHDRAWN
        trigger: "POST /disaster-relief/applicants/{id}/withdraw"
        actor: Caseworker
        preconditions: ["Applicant is REGISTERED or INSPECTION_SCHEDULED (ERR_APPLICANT_NOT_WITHDRAWABLE)"]
        side_effects: ["Any SCHEDULED DamageAssessment -> CANCELLED"]
      - from: INSPECTION_SCHEDULED
        to: WITHDRAWN
        trigger: "POST /disaster-relief/applicants/{id}/withdraw"
        actor: Caseworker
        preconditions: ["Applicant is REGISTERED or INSPECTION_SCHEDULED (ERR_APPLICANT_NOT_WITHDRAWABLE)"]
        side_effects: ["Any SCHEDULED DamageAssessment -> CANCELLED"]

  - entity: DamageAssessment
    initial_state: SCHEDULED
    terminal_states: [VERIFIED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: INSPECTED
        trigger: "POST /disaster-relief/assessments/{id}/inspect"
        actor: Inspector
        preconditions:
          - "Assessment is SCHEDULED (ERR_ASSESSMENT_NOT_SCHEDULED)"
          - "habitability, verified_repair_cost_cents, verified_personal_property_cents, verified_rental_months supplied (ERR_MISSING_REQUIRED_FIELD)"
        side_effects: ["Verified amounts and habitability recorded; Applicant.status -> INSPECTED"]
      - from: INSPECTED
        to: VERIFIED
        trigger: "POST /disaster-relief/assessments/{id}/verify"
        actor: Caseworker
        preconditions:
          - "Assessment is INSPECTED (ERR_ASSESSMENT_NOT_INSPECTED)"
          - "The verifying Caseworker is NOT the assessment's inspector's paired user [SoD is enforced at IhpCase level]"
        side_effects: ["Assessment becomes the eligible source for IhpCase creation"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /disaster-relief/assessments/{id}/cancel (or applicant withdraw cascade)"
        actor: Inspector
        preconditions: ["Assessment is SCHEDULED (ERR_ASSESSMENT_NOT_SCHEDULED)"]
        side_effects: ["Frees the inspector's calendar slot"]

  - entity: IhpCase
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ELIGIBILITY_PENDING
        trigger: "system (immediately on IhpCase create)"
        actor: system
        preconditions: ["Referenced DamageAssessment is VERIFIED [cross-entity]"]
        side_effects:
          - "PROVISIONAL gross_eligible_cents computed via eligible_award_amount (provisional variant) from Applicant self-reported amounts"
          - "AwardLineItems created in PENDING per applicable category"
      - from: ELIGIBILITY_PENDING
        to: AWARD_APPROVED
        trigger: "POST /disaster-relief/ihp-cases/{id}/approve"
        actor: Caseworker
        preconditions:
          - "IhpCase is ELIGIBILITY_PENDING (ERR_CASE_NOT_PENDING)"
          - "Damage date within incident period [validated on case create]"
          - "net_eligible_cents (final) > 0 (else use deny) (ERR_NO_ELIGIBLE_AMOUNT)"
        side_effects:
          - "FINAL gross_eligible_cents recomputed via eligible_award_amount (final variant) from VERIFIED amounts"
          - "capped_eligible_cents = min(gross_eligible_cents, declaration.ihp_max_grant_cents) [max-grant cap]"
          - "dob_offset_cents computed via duplication_of_benefits_offset (at-award variant)"
          - "net_eligible_cents = max(0, capped_eligible_cents - dob_offset_cents)"
          - "AwardLineItem.approved_amount_cents set via dob waterfall; line items -> APPROVED; total_approved_cents reconciled"
          - "determined_by_caseworker_id = acting caseworker; Applicant.status -> ELIGIBLE"
          - "increments IhpCase.version by 1"
      - from: ELIGIBILITY_PENDING
        to: DENIED
        trigger: "POST /disaster-relief/ihp-cases/{id}/deny"
        actor: Caseworker
        preconditions: ["IhpCase is ELIGIBILITY_PENDING (ERR_CASE_NOT_PENDING)"]
        side_effects:
          - "All AwardLineItems -> VOIDED; total_approved_cents -> 0"
          - "determined_by_caseworker_id = acting caseworker; Applicant.status -> INELIGIBLE"
          - "increments IhpCase.version by 1"
      - from: AWARD_APPROVED
        to: DISBURSING
        trigger: "POST /disaster-relief/disbursements (first PAID disbursement on the case)"
        actor: Caseworker
        preconditions:
          - "IhpCase is AWARD_APPROVED (ERR_CASE_NOT_APPROVED)"
          - "Declaration is not CLOSED (ERR_DECLARATION_CLOSED) [cross-entity]"
        side_effects:
          - "Disbursement created PAID; disbursed_total_cents += amount; remaining_obligation_cents recomputed"
          - "increments IhpCase.version by 1"
      - from: DISBURSING
        to: DISBURSING
        trigger: "POST /disaster-relief/disbursements (subsequent PAID disbursement)"
        actor: Caseworker
        preconditions:
          - "IhpCase is DISBURSING (ERR_CASE_NOT_DISBURSING)"
          - "Declaration is not CLOSED (ERR_DECLARATION_CLOSED) [cross-entity]"
          - "amount <= remaining_obligation_cents (ERR_DISBURSEMENT_EXCEEDS_OBLIGATION) [fiscal]"
        side_effects:
          - "disbursed_total_cents += amount; remaining_obligation_cents recomputed"
          - "increments IhpCase.version by 1"
      - from: DISBURSING
        to: CLOSED
        trigger: "POST /disaster-relief/ihp-cases/{id}/close"
        actor: Caseworker
        preconditions:
          - "IhpCase is DISBURSING (ERR_CASE_NOT_DISBURSING)"
          - "No Recoupment for this case is ESTABLISHED (ERR_OPEN_RECOUPMENT)"
        side_effects: ["Case finalized"]
      - from: AWARD_APPROVED
        to: UNDER_APPEAL
        trigger: "POST /disaster-relief/appeals (create appeal on an AWARD_APPROVED case)"
        actor: Caseworker
        preconditions:
          - "IhpCase is AWARD_APPROVED (ERR_CASE_NOT_APPEALABLE)"
          - "expected_ihp_case_version matches IhpCase.version (ERR_STALE_CASE_VERSION) [OCC]"
        side_effects:
          - "Appeal created SUBMITTED"
          - "pre_appeal_status = AWARD_APPROVED (recorded so a DENIED appeal can restore it)"
          - "increments IhpCase.version by 1"
      - from: DENIED
        to: UNDER_APPEAL
        trigger: "POST /disaster-relief/appeals (create appeal on a DENIED case)"
        actor: Caseworker
        preconditions:
          - "IhpCase is DENIED (ERR_CASE_NOT_APPEALABLE)"
          - "expected_ihp_case_version matches IhpCase.version (ERR_STALE_CASE_VERSION) [OCC]"
        side_effects:
          - "Appeal created SUBMITTED"
          - "pre_appeal_status = DENIED (recorded so a DENIED appeal can restore it)"
          - "increments IhpCase.version by 1"
      - from: UNDER_APPEAL
        to: AWARD_APPROVED
        trigger: "POST /disaster-relief/appeals/{id}/decide (outcome=GRANTED)"
        actor: Caseworker
        preconditions:
          - "IhpCase is UNDER_APPEAL (ERR_CASE_NOT_UNDER_APPEAL)"
          - "Deciding caseworker != IhpCase.determined_by_caseworker_id (ERR_SEGREGATION_OF_DUTIES) [SoD]"
        side_effects:
          - "Appeal -> GRANTED; gross/capped/net recomputed using appeal.requested_repair_cost_cents override (final variant); line items re-approved via max_grant_cap_waterfall; total_approved_cents reconciled (appeal cascade); case becomes AWARD_APPROVED regardless of pre_appeal_status"
          - "If new net_eligible_cents < disbursed_total_cents, an APPEAL_REDUCTION Recoupment is established (transitive cascade)"
          - "increments IhpCase.version by 1"
      - from: UNDER_APPEAL
        to: AWARD_APPROVED
        trigger: "POST /disaster-relief/appeals/{id}/decide (outcome=DENIED, when pre_appeal_status == AWARD_APPROVED)"
        actor: Caseworker
        preconditions:
          - "IhpCase is UNDER_APPEAL (ERR_CASE_NOT_UNDER_APPEAL)"
          - "pre_appeal_status == AWARD_APPROVED"
          - "Deciding caseworker != IhpCase.determined_by_caseworker_id (ERR_SEGREGATION_OF_DUTIES) [SoD]"
        side_effects:
          - "Appeal -> DENIED; case restored to AWARD_APPROVED with all award figures unchanged (compensating no-op on award totals)"
          - "increments IhpCase.version by 1"
      - from: UNDER_APPEAL
        to: DENIED
        trigger: "POST /disaster-relief/appeals/{id}/decide (outcome=DENIED, when pre_appeal_status == DENIED)"
        actor: Caseworker
        preconditions:
          - "IhpCase is UNDER_APPEAL (ERR_CASE_NOT_UNDER_APPEAL)"
          - "pre_appeal_status == DENIED"
          - "Deciding caseworker != IhpCase.determined_by_caseworker_id (ERR_SEGREGATION_OF_DUTIES) [SoD]"
        side_effects:
          - "Appeal -> DENIED; case restored to DENIED with all award figures unchanged (compensating no-op on award totals)"
          - "increments IhpCase.version by 1"

  - entity: Appeal
    initial_state: SUBMITTED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: SUBMITTED
        to: GRANTED
        trigger: "POST /disaster-relief/appeals/{id}/decide (outcome=GRANTED)"
        actor: Caseworker
        preconditions:
          - "Appeal is SUBMITTED (ERR_APPEAL_NOT_SUBMITTED)"
          - "Deciding caseworker != IhpCase.determined_by_caseworker_id (ERR_SEGREGATION_OF_DUTIES) [SoD, cross-entity]"
        side_effects:
          - "decided_by_caseworker_id recorded; drives the IhpCase UNDER_APPEAL -> AWARD_APPROVED recompute cascade"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /disaster-relief/appeals/{id}/decide (outcome=DENIED)"
        actor: Caseworker
        preconditions:
          - "Appeal is SUBMITTED (ERR_APPEAL_NOT_SUBMITTED)"
          - "Deciding caseworker != IhpCase.determined_by_caseworker_id (ERR_SEGREGATION_OF_DUTIES) [SoD, cross-entity]"
        side_effects:
          - "decided_by_caseworker_id recorded; IhpCase reverts to its pre-appeal decision (DENIED) with no award change"

  - entity: SbaReferral
    initial_state: REFERRED
    terminal_states: [SBA_APPROVED, SBA_DECLINED]
    transitions:
      - from: REFERRED
        to: SBA_APPROVED
        trigger: "POST /disaster-relief/sba-referrals/{id}/record-outcome (outcome=APPROVED, sba_loan_amount_cents)"
        actor: Caseworker
        preconditions: ["Referral is REFERRED (ERR_REFERRAL_NOT_OPEN)"]
        side_effects:
          - "Creates an SBA_LOAN DobRecord on the applicant for sba_loan_amount_cents (cascade hop 1)"
          - "Applicant.total_dob_cents recomputed; IhpCase dob_offset_cents/net_eligible_cents recomputed (cascade hop 2)"
          - "If disbursed_total_cents > new net_eligible_cents, a LATE_DOB Recoupment is established (cascade hop 3)"
      - from: REFERRED
        to: SBA_DECLINED
        trigger: "POST /disaster-relief/sba-referrals/{id}/record-outcome (outcome=DECLINED)"
        actor: Caseworker
        preconditions: ["Referral is REFERRED (ERR_REFERRAL_NOT_OPEN)"]
        side_effects: ["No DobRecord created; the household remains eligible for full IHP award (divergent branch — no cascade)"]

  - entity: Disbursement
    initial_state: PAID
    terminal_states: [VOIDED]
    transitions:
      - from: PAID
        to: VOIDED
        trigger: "POST /disaster-relief/disbursements/{id}/void"
        actor: ProgramAdmin
        preconditions: ["Disbursement is PAID (ERR_DISBURSEMENT_NOT_PAID)"]
        side_effects:
          - "disbursed_total_cents -= amount; remaining_obligation_cents recomputed (compensating action; obligation invariant preserved)"

  - entity: DobRecord
    initial_state: RECORDED
    terminal_states: [REVERSED]
    transitions:
      - from: RECORDED
        to: REVERSED
        trigger: "POST /disaster-relief/dob-records/{id}/reverse"
        actor: ProgramAdmin
        preconditions: ["DobRecord is RECORDED (ERR_DOB_NOT_RECORDED)"]
        side_effects:
          - "Applicant.total_dob_cents -= amount (compensating action; total_dob invariant preserved)"
          - "If the linked case is AWARD_APPROVED/DISBURSING, dob_offset_cents/net_eligible_cents recomputed"

  - entity: Recoupment
    initial_state: ESTABLISHED
    terminal_states: [SATISFIED, WAIVED]
    transitions:
      - from: ESTABLISHED
        to: SATISFIED
        trigger: "POST /disaster-relief/recoupments/{id}/record-recovery (recovered amount reaches debt)"
        actor: ProgramAdmin
        preconditions:
          - "Recoupment is ESTABLISHED (ERR_RECOUPMENT_NOT_ESTABLISHED)"
          - "Cumulative recovered_cents >= debt_amount_cents (ERR_RECOUPMENT_NOT_FULLY_RECOVERED)"
        side_effects: ["Debt cleared"]
      - from: ESTABLISHED
        to: WAIVED
        trigger: "POST /disaster-relief/recoupments/{id}/waive"
        actor: ProgramAdmin
        preconditions: ["Recoupment is ESTABLISHED (ERR_RECOUPMENT_NOT_ESTABLISHED)"]
        side_effects: ["Debt forgiven; no recovery required"]

  - entity: RentalAssistancePeriod
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /disaster-relief/rental-periods/{id}/close"
        actor: Caseworker
        preconditions: ["Period is ACTIVE (ERR_RENTAL_PERIOD_NOT_ACTIVE)"]
        side_effects: ["Frees the applicant's rental timeline for that window (a later overlapping period no longer collides with a CLOSED one)"]

# =============================================================================
# §1.2.1 Concurrency Rules (true CREATE-with-supersede races, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: disbursement-create-stale-case
    parent_entity: IhpCase
    write_endpoint: "POST /disaster-relief/disbursements"
    occ_field: "expected_ihp_case_version"
    description: |
      Creating a Disbursement against an IhpCase whose version has advanced since
      the disbursing caseworker last observed it is rejected. This captures the
      case where another writer has already disbursed against the case (advancing
      remaining_obligation_cents and the version) so the current caseworker's view
      of the case ledger is stale; proceeding would over-disburse.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
  - rule_id: appeal-create-stale-case
    parent_entity: IhpCase
    write_endpoint: "POST /disaster-relief/appeals"
    occ_field: "expected_ihp_case_version"
    description: |
      Creating an Appeal against an IhpCase whose version has advanced since the
      appellant last observed it is rejected. This captures the case where the case
      decision/award has just been re-evaluated (advancing the version), so an appeal
      filed against the stale decision must be refused.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: eligible_award_amount
    trigger: "IhpCase create (provisional variant); IhpCase approve (final variant); appeal GRANTED recompute (final variant with override)"
    algorithm: tiered_threshold
    formula: |
      Inputs (cents + integer months):
        repair      = repair cost input
        personal    = personal-property loss input
        rental_mo   = rental months input
        fmr         = IhpCase.monthly_fmr_cents
        habitable   = (DamageAssessment.habitability == HABITABLE)
      Per-category gross (before cap, before DOB):
        REPAIR_ASSISTANCE   = min(repair, REPAIR_CATEGORY_CAP_CENTS)
        PERSONAL_PROPERTY   = min(personal, PERSONAL_CATEGORY_CAP_CENTS)
        if habitable:
          RENTAL_ASSISTANCE = 0
          REPLACEMENT       = 0
        else (UNINHABITABLE):
          RENTAL_ASSISTANCE = fmr * rental_mo            # fmr already in cents; months integer
          REPLACEMENT       = min(repair, REPLACEMENT_CAP_CENTS) if repair > REPAIR_CATEGORY_CAP_CENTS else 0
      gross_eligible_cents = REPAIR_ASSISTANCE + PERSONAL_PROPERTY + RENTAL_ASSISTANCE + REPLACEMENT
      Then (only in case approve / appeal recompute):
        capped_eligible_cents = min(gross_eligible_cents, declaration.ihp_max_grant_cents)
    input_set: "PROVISIONAL uses Applicant.reported_* fields; FINAL uses DamageAssessment.verified_* fields; appeal-GRANTED FINAL substitutes appeal.requested_repair_cost_cents for verified_repair_cost_cents."
    constants:
      REPAIR_CATEGORY_CAP_CENTS: 4150000     # $41,500 repair component cap
      PERSONAL_CATEGORY_CAP_CENTS: 4150000   # $41,500 personal-property component cap
      REPLACEMENT_CAP_CENTS: 4150000         # $41,500 replacement component cap
    precision: "Integer cents; no rounding inside this formula (all inputs are integer cents)."
    variants:
      - name: provisional
        when: "IhpCase create — household not yet inspected against final figures"
        difference: "Uses self-reported Applicant.reported_repair_cost_cents / reported_personal_property_cents / reported_rental_months."
      - name: final
        when: "IhpCase approve and appeal-GRANTED recompute"
        difference: "Uses inspector DamageAssessment.verified_* amounts (appeal override replaces verified_repair_cost_cents); typically diverges from provisional."

  - name: duplication_of_benefits_offset
    trigger: "IhpCase approve (at-award variant); SBA approval / late DobRecord create / DOB reverse (at-recoupment variant)"
    algorithm: aggregation
    formula: |
      at-award offset (computed at IhpCase approve):
        offset = sum(DobRecord.amount_cents
                     where applicant_id == case.applicant_id
                       AND dob_status == RECORDED
                       AND received_at <= case.approved_at)         # only DOB known at award time
      at-recoupment offset (recomputed after SBA approval / late DOB / reverse):
        offset = sum(DobRecord.amount_cents
                     where applicant_id == case.applicant_id
                       AND dob_status == RECORDED)                  # ALL recorded DOB including LATE-arriving
      dob_offset_cents = offset
      net_eligible_cents = max(0, capped_eligible_cents - dob_offset_cents)
    input_set: "DobRecord rows for the applicant with dob_status == RECORDED. at-award filters by received_at <= approved_at; at-recoupment includes all."
    constants: {}
    precision: "Integer cents."
    variants:
      - name: at_award
        when: "IhpCase approve"
        difference: "Filters DOB by received_at <= case.approved_at — only duplications already known at award time count."
      - name: at_recoupment
        when: "SBA approval cascade, late DobRecord create, or DOB reverse"
        difference: "Includes ALL RECORDED DOB regardless of received_at — late-arriving benefits enter the offset and can drive recoupment; differs from at_award whenever a DOB has received_at > approved_at."

  - name: max_grant_cap_waterfall
    trigger: "IhpCase approve and appeal-GRANTED recompute (sets AwardLineItem.approved_amount_cents)"
    algorithm: waterfall_allocation
    formula: |
      Step 1 — proportional cap reduction (if gross_eligible_cents > ihp_max_grant_cents):
        scale = ihp_max_grant_cents / gross_eligible_cents (rational, not yet rounded)
        for each line in fixed order [RENTAL_ASSISTANCE, REPAIR_ASSISTANCE, PERSONAL_PROPERTY, REPLACEMENT]:
          capped_line = floor(line.gross_amount_cents * scale)   # floor each line
        remainder = ihp_max_grant_cents - sum(capped_line)        # pennies lost to floor
        assign remainder to the LAST non-zero line in the fixed order (deterministic)
      else: capped_line = line.gross_amount_cents
      Step 2 — DOB waterfall offset over the capped lines, in fixed order
        [RENTAL_ASSISTANCE, REPAIR_ASSISTANCE, PERSONAL_PROPERTY, REPLACEMENT]:
        remaining_offset = dob_offset_cents
        for each line in fixed order:
          take = min(capped_line, remaining_offset)
          line.approved_amount_cents = capped_line - take         # subtract then keep integer cents
          remaining_offset -= take
      total_approved_cents = sum(line.approved_amount_cents over APPROVED lines)
    input_set: "All AwardLineItems of the case; processed in the fixed category order above."
    constants:
      CATEGORY_ORDER: "[RENTAL_ASSISTANCE, REPAIR_ASSISTANCE, PERSONAL_PROPERTY, REPLACEMENT]"
    precision: "Integer cents; floor() during cap proration; remainder pennies assigned to the LAST non-zero line in CATEGORY_ORDER. The cap-proration floor happens per line BEFORE the DOB subtraction — order is pinned."
    note: "Rounding order matters: 'floor per line then assign remainder' yields different per-line cents than 'subtract DOB then floor'. This scaffold pins floor-cap-first, then DOB-subtract."

  - name: recoupment_debt
    trigger: "Recoupment establishment (LATE_DOB via SBA/late-DOB cascade; APPEAL_REDUCTION via appeal grant)"
    algorithm: aggregation
    formula: |
      debt_amount_cents = max(0, disbursed_total_cents - net_eligible_cents)
      where net_eligible_cents is the freshly recomputed value AFTER the triggering
      cascade (at_recoupment DOB variant for SBA/late-DOB; appeal-override final award
      for appeal reductions).
    input_set: "IhpCase.disbursed_total_cents (sum of PAID disbursements) and the recomputed IhpCase.net_eligible_cents."
    constants: {}
    precision: "Integer cents."

  - name: sba_referral_eligibility
    trigger: "POST /disaster-relief/sba-referrals (create)"
    algorithm: threshold
    formula: |
      verified_total_loss = DamageAssessment.verified_repair_cost_cents
                          + DamageAssessment.verified_personal_property_cents
      A referral is permitted (eligible) iff:
        annual_income_cents <= SBA_INCOME_CEILING_CENTS
        OR verified_total_loss > SBA_LOSS_THRESHOLD_CENTS
      Boundary: income exactly == SBA_INCOME_CEILING_CENTS qualifies (<=);
                loss exactly == SBA_LOSS_THRESHOLD_CENTS does NOT qualify (> is strict).
      referred_loss_cents = verified_total_loss (snapshot stored on the referral)
    input_set: "Applicant.annual_income_cents and the case's VERIFIED assessment loss totals."
    constants:
      SBA_INCOME_CEILING_CENTS: 7500000   # $75,000 income ceiling (<=)
      SBA_LOSS_THRESHOLD_CENTS: 3000000   # $30,000 verified-loss threshold (strict >)
    precision: "Integer cents."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_AUTH
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to invoke this endpoint per the RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every resource id referenced in the path or required FK body field exists (validated left-to-right: path ids first, then body FKs)"
    error_id: "ERR_*_NOT_FOUND (by resource type)"
    http_status: 404
    applies_to: all endpoints with path ids or FK inputs

  - priority: 4
    category: business_temporal
    check: "Applicant registration: declaration must be OPEN and request time <= registration_deadline; damage_date within [incident_start, incident_end]"
    error_id: ERR_REGISTRATION_CLOSED
    http_status: 409
    applies_to: "POST /disaster-relief/applicants"
    note: "Damage-date-out-of-incident-period uses ERR_DAMAGE_DATE_OUT_OF_PERIOD (422)."

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is legal"
    error_id: "varies (ERR_CASE_NOT_PENDING, ERR_ASSESSMENT_NOT_SCHEDULED, ERR_REFERRAL_NOT_OPEN, ...)"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "Cross-entity state precondition: IhpCase create requires referenced DamageAssessment == VERIFIED"
    error_id: ERR_ASSESSMENT_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /disaster-relief/ihp-cases"

  - priority: 7
    category: business_referential
    check: "Disbursement.line_item_id must belong to the same IhpCase as ihp_case_id and be APPROVED"
    error_id: ERR_LINE_ITEM_NOT_APPROVED
    http_status: 409
    applies_to: "POST /disaster-relief/disbursements"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: caseworker deciding an appeal MUST NOT equal IhpCase.determined_by_caseworker_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /disaster-relief/appeals/{id}/decide"

  - priority: 9
    category: business_constraint
    check: "Inspector appointment overlap (resource = Inspector): a new DamageAssessment must not collide with another non-terminal (SCHEDULED/INSPECTED) appointment of the SAME inspector. Closed-interval geometry WITH travel buffer: collision iff new.scheduled_start <= other.scheduled_end + travel_buffer AND other.scheduled_start <= new.scheduled_end + travel_buffer (buffer added on both sides; touching/adjacent within the buffer collides)."
    error_id: ERR_INSPECTOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /disaster-relief/assessments"

  - priority: 9.5
    category: business_constraint
    check: "Rental coverage overlap (resource = Applicant's rental timeline): a new RentalAssistancePeriod must not collide with another ACTIVE RentalAssistancePeriod of the SAME applicant. Half-open-interval geometry, NO buffer: collision iff new.period_start < other.period_end AND other.period_start < new.period_end (exactly-adjacent period_end==period_start does NOT collide)."
    error_id: ERR_RENTAL_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /disaster-relief/rental-periods"
    note: "Distinct interval semantics from priority 9: inspector appointments use closed-interval + travel buffer; rental coverage uses half-open, no buffer. Distinct resource entities (Inspector calendar vs Applicant rental timeline)."

  - priority: 10
    category: business_temporal
    check: "Concurrency OCC: expected_ihp_case_version must equal IhpCase.version on disbursement create and appeal create"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /disaster-relief/disbursements, POST /disaster-relief/appeals"

  - priority: 11
    category: business_constraint
    check: "SBA referral eligibility: income <= ceiling OR verified loss > loss threshold (else not referable)"
    error_id: ERR_SBA_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /disaster-relief/sba-referrals"

  - priority: 12
    category: business_fiscal
    check: "Disbursement amount must not exceed the case's remaining_obligation_cents"
    error_id: ERR_DISBURSEMENT_EXCEEDS_OBLIGATION
    http_status: 402
    applies_to: "POST /disaster-relief/disbursements"

  - priority: 13
    category: business_constraint
    check: "Field-level request validation (types, enum membership, required fields, >= 0 amounts, end > start)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- Clock (test-driving) ----------
  - method: POST
    path: "/disaster-relief/_clock/set"
    description: "Set the server's current UTC clock for deadline/incident-period and DOB received_at comparisons (test-driving)."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Server current_utc is pinned to to_iso8601 for subsequent requests"]

  # ---------- DisasterDeclaration ----------
  - method: POST
    path: "/disaster-relief/declarations"
    description: "Create a disaster declaration"
    roles: [ProgramAdmin]
    code: 201
    input: [title, incident_start, incident_end, ihp_max_grant_cents, registration_deadline]
    output: DisasterDeclaration
    side_effects: ["status initialized to OPEN"]
  - method: GET
    path: "/disaster-relief/declarations"
    description: "List disaster declarations"
    roles: [ProgramAdmin, Caseworker, Inspector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DisasterDeclaration[]"
    side_effects: []
  - method: GET
    path: "/disaster-relief/declarations/{id}"
    description: "Get a disaster declaration"
    roles: [ProgramAdmin, Caseworker, Inspector]
    code: 200
    input: []
    output: DisasterDeclaration
    side_effects: []
  - method: POST
    path: "/disaster-relief/declarations/{id}/close-registration"
    description: "Close registration (OPEN -> REGISTRATION_CLOSED)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: DisasterDeclaration
    side_effects: ["status -> REGISTRATION_CLOSED; new Applicant creation blocked"]
  - method: POST
    path: "/disaster-relief/declarations/{id}/close"
    description: "Close the declaration (REGISTRATION_CLOSED -> CLOSED)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: DisasterDeclaration
    side_effects: ["status -> CLOSED; disbursement creation blocked"]

  # ---------- Inspector ----------
  - method: POST
    path: "/disaster-relief/inspectors"
    description: "Create an inspector profile (entity-backed identity for Inspector role)"
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, badge_number, "travel_buffer_minutes?"]
    output: Inspector
    side_effects: ["status initialized to ACTIVE"]
  - method: GET
    path: "/disaster-relief/inspectors"
    description: "List inspectors"
    roles: [ProgramAdmin, Caseworker, Inspector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Inspector[]"
    side_effects: []
  - method: GET
    path: "/disaster-relief/inspectors/{id}"
    description: "Get an inspector"
    roles: [ProgramAdmin, Caseworker, Inspector]
    code: 200
    input: []
    output: Inspector
    side_effects: []

  # ---------- Caseworker ----------
  - method: POST
    path: "/disaster-relief/caseworkers"
    description: "Create a caseworker profile (entity-backed identity for Caseworker role)"
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, employee_id, "can_approve_awards?"]
    output: Caseworker
    side_effects: ["status initialized to ACTIVE"]
  - method: GET
    path: "/disaster-relief/caseworkers"
    description: "List caseworkers"
    roles: [ProgramAdmin, Caseworker, Inspector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Caseworker[]"
    side_effects: []
  - method: GET
    path: "/disaster-relief/caseworkers/{id}"
    description: "Get a caseworker"
    roles: [ProgramAdmin, Caseworker, Inspector]
    code: 200
    input: []
    output: Caseworker
    side_effects: []

  # ---------- Applicant ----------
  - method: POST
    path: "/disaster-relief/applicants"
    description: "Register an applicant household against a declaration (intake)"
    roles: [Caseworker, ProgramAdmin]
    code: 201
    input: [declaration_id, household_name, household_size, annual_income_cents, damage_date, reported_repair_cost_cents, reported_personal_property_cents, reported_rental_months]
    output: Applicant
    side_effects: ["status initialized to REGISTERED; total_dob_cents initialized to 0"]
  - method: GET
    path: "/disaster-relief/applicants"
    description: "List applicants; filter by declaration_id (FK reverse-reachability for Applicant.declaration_id)"
    roles: [ProgramAdmin, Caseworker, Inspector]
    code: 200
    input: ["declaration_id?", "status?", "limit?", "offset?"]
    output: "Applicant[]"
    side_effects: []
  - method: GET
    path: "/disaster-relief/applicants/{id}"
    description: "Get an applicant (includes computed total_dob_cents)"
    roles: [ProgramAdmin, Caseworker, Inspector]
    code: 200
    input: []
    output: Applicant
    side_effects: []
  - method: POST
    path: "/disaster-relief/applicants/{id}/withdraw"
    description: "Withdraw an applicant (REGISTERED/INSPECTION_SCHEDULED -> WITHDRAWN)"
    roles: [Caseworker, ProgramAdmin]
    code: 200
    input: []
    output: Applicant
    side_effects: ["status -> WITHDRAWN; any SCHEDULED DamageAssessment -> CANCELLED"]

  # ---------- DamageAssessment ----------
  - method: POST
    path: "/disaster-relief/assessments"
    description: "Schedule a damage assessment / inspection for an applicant"
    roles: [Inspector, ProgramAdmin]
    code: 201
    input: [applicant_id, inspector_id, scheduled_start, scheduled_end]
    output: DamageAssessment
    side_effects: ["status -> SCHEDULED; Applicant.status -> INSPECTION_SCHEDULED; inspector calendar overlap (closed-interval + travel buffer) checked"]
  - method: GET
    path: "/disaster-relief/assessments"
    description: "List assessments; filter by applicant_id or inspector_id (FK reverse-reachability for both FKs)"
    roles: [ProgramAdmin, Caseworker, Inspector]
    code: 200
    input: ["applicant_id?", "inspector_id?", "status?", "limit?", "offset?"]
    output: "DamageAssessment[]"
    side_effects: []
  - method: GET
    path: "/disaster-relief/assessments/{id}"
    description: "Get a damage assessment"
    roles: [ProgramAdmin, Caseworker, Inspector]
    code: 200
    input: []
    output: DamageAssessment
    side_effects: []
  - method: POST
    path: "/disaster-relief/assessments/{id}/inspect"
    description: "Record inspection results (SCHEDULED -> INSPECTED)"
    roles: [Inspector]
    code: 200
    input: [habitability, verified_repair_cost_cents, verified_personal_property_cents, verified_rental_months]
    output: DamageAssessment
    side_effects: ["verified amounts + habitability recorded; status -> INSPECTED; Applicant.status -> INSPECTED"]
  - method: POST
    path: "/disaster-relief/assessments/{id}/verify"
    description: "Verify an inspected assessment (INSPECTED -> VERIFIED)"
    roles: [Caseworker]
    code: 200
    input: []
    output: DamageAssessment
    side_effects: ["status -> VERIFIED; becomes eligible source for IhpCase creation"]
  - method: POST
    path: "/disaster-relief/assessments/{id}/cancel"
    description: "Cancel a scheduled assessment (SCHEDULED -> CANCELLED)"
    roles: [Inspector, ProgramAdmin]
    code: 200
    input: []
    output: DamageAssessment
    side_effects: ["status -> CANCELLED; inspector calendar slot freed"]

  # ---------- IhpCase ----------
  - method: POST
    path: "/disaster-relief/ihp-cases"
    description: "Open an IHP case from a VERIFIED assessment; computes PROVISIONAL award"
    roles: [Caseworker]
    code: 201
    input: [applicant_id, assessment_id, monthly_fmr_cents]
    output: IhpCase
    side_effects:
      - "DamageAssessment must be VERIFIED [cross-entity precondition]"
      - "status DRAFT -> ELIGIBILITY_PENDING; PROVISIONAL gross_eligible_cents computed; PENDING AwardLineItems created; Applicant.status -> ELIGIBILITY_PENDING"
  - method: GET
    path: "/disaster-relief/ihp-cases"
    description: "List IHP cases; filter by applicant_id, assessment_id, or determined_by_caseworker_id (FK reverse-reachability for all three FKs)"
    roles: [ProgramAdmin, Caseworker, Inspector]
    code: 200
    input: ["applicant_id?", "assessment_id?", "determined_by_caseworker_id?", "status?", "limit?", "offset?"]
    output: "IhpCase[]"
    side_effects: []
  - method: GET
    path: "/disaster-relief/ihp-cases/{id}"
    description: "Get an IHP case (computed award + DOB + obligation fields)"
    roles: [ProgramAdmin, Caseworker, Inspector]
    code: 200
    input: []
    output: IhpCase
    side_effects: []
  - method: POST
    path: "/disaster-relief/ihp-cases/{id}/approve"
    description: "Approve eligibility and compute FINAL award (ELIGIBILITY_PENDING -> AWARD_APPROVED)"
    roles: [Caseworker]
    code: 200
    input: []
    output: IhpCase
    side_effects:
      - "FINAL gross/capped/dob_offset/net recomputed; line items APPROVED via max_grant_cap_waterfall; total_approved_cents reconciled; determined_by_caseworker_id set; Applicant.status -> ELIGIBLE; version += 1"
  - method: POST
    path: "/disaster-relief/ihp-cases/{id}/deny"
    description: "Deny eligibility (ELIGIBILITY_PENDING -> DENIED)"
    roles: [Caseworker]
    code: 200
    input: []
    output: IhpCase
    side_effects: ["line items VOIDED; total_approved_cents -> 0; determined_by_caseworker_id set; Applicant.status -> INELIGIBLE; version += 1"]
  - method: POST
    path: "/disaster-relief/ihp-cases/{id}/close"
    description: "Close a case (DISBURSING -> CLOSED)"
    roles: [Caseworker, ProgramAdmin]
    code: 200
    input: []
    output: IhpCase
    side_effects: ["status -> CLOSED (blocked while a Recoupment is ESTABLISHED)"]

  # ---------- AwardLineItem ----------
  - method: GET
    path: "/disaster-relief/award-line-items"
    description: "List award line items; filter by ihp_case_id (FK reverse-reachability for AwardLineItem.ihp_case_id)"
    roles: [ProgramAdmin, Caseworker, Inspector]
    code: 200
    input: ["ihp_case_id?", "category?", "li_status?", "limit?", "offset?"]
    output: "AwardLineItem[]"
    side_effects: []
  - method: GET
    path: "/disaster-relief/award-line-items/{id}"
    description: "Get an award line item"
    roles: [ProgramAdmin, Caseworker, Inspector]
    code: 200
    input: []
    output: AwardLineItem
    side_effects: []

  # ---------- DobRecord ----------
  - method: POST
    path: "/disaster-relief/dob-records"
    description: "Record a duplication-of-benefits source for an applicant (insurance, SBA loan, charity, other federal)"
    roles: [ProgramAdmin, Caseworker]
    code: 201
    input: [applicant_id, source_type, amount_cents, received_at]
    output: DobRecord
    side_effects:
      - "dob_status RECORDED; Applicant.total_dob_cents recomputed; if applicant's case is AWARD_APPROVED/DISBURSING, dob_offset/net recomputed (at_recoupment variant); LATE_DOB Recoupment established if disbursed_total > net_eligible"
  - method: GET
    path: "/disaster-relief/dob-records"
    description: "List DOB records; filter by applicant_id (FK reverse-reachability for DobRecord.applicant_id)"
    roles: [ProgramAdmin, Caseworker, Inspector]
    code: 200
    input: ["applicant_id?", "dob_status?", "source_type?", "limit?", "offset?"]
    output: "DobRecord[]"
    side_effects: []
  - method: GET
    path: "/disaster-relief/dob-records/{id}"
    description: "Get a DOB record"
    roles: [ProgramAdmin, Caseworker, Inspector]
    code: 200
    input: []
    output: DobRecord
    side_effects: []
  - method: POST
    path: "/disaster-relief/dob-records/{id}/reverse"
    description: "Reverse a DOB record (RECORDED -> REVERSED)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: DobRecord
    side_effects: ["Applicant.total_dob_cents -= amount; case dob_offset/net recomputed (compensating action)"]

  # ---------- Appeal ----------
  - method: POST
    path: "/disaster-relief/appeals"
    description: "File an appeal against an AWARD_APPROVED or DENIED case (OCC on the case)"
    roles: [Caseworker, ProgramAdmin]
    code: 201
    input: [ihp_case_id, expected_ihp_case_version, reason, "requested_repair_cost_cents?"]
    output: Appeal
    side_effects: ["Appeal SUBMITTED; IhpCase -> UNDER_APPEAL; IhpCase.version += 1"]
  - method: GET
    path: "/disaster-relief/appeals"
    description: "List appeals; filter by ihp_case_id or decided_by_caseworker_id (FK reverse-reachability for both FKs)"
    roles: [ProgramAdmin, Caseworker, Inspector]
    code: 200
    input: ["ihp_case_id?", "decided_by_caseworker_id?", "status?", "limit?", "offset?"]
    output: "Appeal[]"
    side_effects: []
  - method: GET
    path: "/disaster-relief/appeals/{id}"
    description: "Get an appeal"
    roles: [ProgramAdmin, Caseworker, Inspector]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: POST
    path: "/disaster-relief/appeals/{id}/decide"
    description: "Decide an appeal (SUBMITTED -> GRANTED/DENIED); SoD enforced"
    roles: [Caseworker]
    code: 200
    input: [outcome]
    output: Appeal
    side_effects:
      - "GRANTED: case award recomputed with appeal override, line items re-approved, APPEAL_REDUCTION Recoupment if net < disbursed; DENIED: case reverts to DENIED with no award change; deciding caseworker must differ from determined_by_caseworker_id; IhpCase.version += 1"

  # ---------- SbaReferral ----------
  - method: POST
    path: "/disaster-relief/sba-referrals"
    description: "Refer a case to SBA (income/loss threshold gate)"
    roles: [Caseworker]
    code: 201
    input: [ihp_case_id]
    output: SbaReferral
    side_effects: ["referred_loss_cents snapshot stored; status REFERRED"]
  - method: GET
    path: "/disaster-relief/sba-referrals"
    description: "List SBA referrals; filter by ihp_case_id (FK reverse-reachability for SbaReferral.ihp_case_id)"
    roles: [ProgramAdmin, Caseworker, Inspector]
    code: 200
    input: ["ihp_case_id?", "status?", "limit?", "offset?"]
    output: "SbaReferral[]"
    side_effects: []
  - method: GET
    path: "/disaster-relief/sba-referrals/{id}"
    description: "Get an SBA referral"
    roles: [ProgramAdmin, Caseworker, Inspector]
    code: 200
    input: []
    output: SbaReferral
    side_effects: []
  - method: POST
    path: "/disaster-relief/sba-referrals/{id}/record-outcome"
    description: "Record SBA decision (REFERRED -> SBA_APPROVED/SBA_DECLINED)"
    roles: [Caseworker, ProgramAdmin]
    code: 200
    input: [outcome, "sba_loan_amount_cents?"]
    output: SbaReferral
    side_effects:
      - "APPROVED: creates SBA_LOAN DobRecord -> total_dob recompute -> dob_offset/net recompute -> LATE_DOB Recoupment if disbursed > net (3-hop cascade); DECLINED: no cascade"

  # ---------- Disbursement ----------
  - method: POST
    path: "/disaster-relief/disbursements"
    description: "Disburse against an APPROVED line item (OCC on the case; first one moves case AWARD_APPROVED -> DISBURSING)"
    roles: [Caseworker]
    code: 201
    input: [ihp_case_id, line_item_id, expected_ihp_case_version, amount_cents]
    output: Disbursement
    side_effects: ["disb_status PAID; disbursed_total_cents += amount; remaining_obligation_cents recomputed; case -> DISBURSING; IhpCase.version += 1"]
  - method: GET
    path: "/disaster-relief/disbursements"
    description: "List disbursements; filter by ihp_case_id or line_item_id (FK reverse-reachability for both FKs)"
    roles: [ProgramAdmin, Caseworker, Inspector]
    code: 200
    input: ["ihp_case_id?", "line_item_id?", "disb_status?", "limit?", "offset?"]
    output: "Disbursement[]"
    side_effects: []
  - method: GET
    path: "/disaster-relief/disbursements/{id}"
    description: "Get a disbursement"
    roles: [ProgramAdmin, Caseworker, Inspector]
    code: 200
    input: []
    output: Disbursement
    side_effects: []
  - method: POST
    path: "/disaster-relief/disbursements/{id}/void"
    description: "Void a disbursement (PAID -> VOIDED)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["disbursed_total_cents -= amount; remaining_obligation_cents recomputed (compensating action)"]

  # ---------- Recoupment ----------
  - method: GET
    path: "/disaster-relief/recoupments"
    description: "List recoupments; filter by ihp_case_id (FK reverse-reachability for Recoupment.ihp_case_id)"
    roles: [ProgramAdmin, Caseworker, Inspector]
    code: 200
    input: ["ihp_case_id?", "status?", "origin?", "limit?", "offset?"]
    output: "Recoupment[]"
    side_effects: []
  - method: GET
    path: "/disaster-relief/recoupments/{id}"
    description: "Get a recoupment"
    roles: [ProgramAdmin, Caseworker, Inspector]
    code: 200
    input: []
    output: Recoupment
    side_effects: []
  - method: POST
    path: "/disaster-relief/recoupments/{id}/record-recovery"
    description: "Record a recovery payment against a recoupment debt"
    roles: [ProgramAdmin]
    code: 200
    input: [amount_cents]
    output: Recoupment
    side_effects: ["recovered_cents += amount; status -> SATISFIED when recovered_cents >= debt_amount_cents"]
  - method: POST
    path: "/disaster-relief/recoupments/{id}/waive"
    description: "Waive a recoupment debt (ESTABLISHED -> WAIVED)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Recoupment
    side_effects: ["status -> WAIVED; debt forgiven"]

  # ---------- RentalAssistancePeriod ----------
  - method: POST
    path: "/disaster-relief/rental-periods"
    description: "Open a rental-assistance coverage period for an approved/disbursing case's household (half-open, no-buffer per-applicant overlap check)"
    roles: [Caseworker, ProgramAdmin]
    code: 201
    input: [ihp_case_id, period_start, period_end]
    output: RentalAssistancePeriod
    side_effects: ["case must be AWARD_APPROVED or DISBURSING (ERR_CASE_NOT_FUNDABLE_FOR_RENTAL); status ACTIVE; applicant_id copied from case; per-applicant rental-timeline overlap checked against ACTIVE periods"]
  - method: GET
    path: "/disaster-relief/rental-periods"
    description: "List rental-assistance periods; filter by ihp_case_id or applicant_id (FK reverse-reachability for both FKs)"
    roles: [ProgramAdmin, Caseworker, Inspector]
    code: 200
    input: ["ihp_case_id?", "applicant_id?", "status?", "limit?", "offset?"]
    output: "RentalAssistancePeriod[]"
    side_effects: []
  - method: GET
    path: "/disaster-relief/rental-periods/{id}"
    description: "Get a rental-assistance period"
    roles: [ProgramAdmin, Caseworker, Inspector]
    code: 200
    input: []
    output: RentalAssistancePeriod
    side_effects: []
  - method: POST
    path: "/disaster-relief/rental-periods/{id}/close"
    description: "Close a rental-assistance period (ACTIVE -> CLOSED)"
    roles: [Caseworker, ProgramAdmin]
    code: 200
    input: []
    output: RentalAssistancePeriod
    side_effects: ["status -> CLOSED; frees the applicant's rental timeline for that window"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_AUTH, http: 401, condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not a known role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role is not permitted to invoke this endpoint" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Caseworker deciding an appeal equals the case's determined_by_caseworker_id" }

  # --- Not found ---
  - { id: ERR_DECLARATION_NOT_FOUND, http: 404, condition: "DisasterDeclaration id does not exist" }
  - { id: ERR_INSPECTOR_NOT_FOUND, http: 404, condition: "Inspector id does not exist" }
  - { id: ERR_CASEWORKER_NOT_FOUND, http: 404, condition: "Caseworker id does not exist" }
  - { id: ERR_APPLICANT_NOT_FOUND, http: 404, condition: "Applicant id does not exist" }
  - { id: ERR_ASSESSMENT_NOT_FOUND, http: 404, condition: "DamageAssessment id does not exist" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "IhpCase id does not exist" }
  - { id: ERR_LINE_ITEM_NOT_FOUND, http: 404, condition: "AwardLineItem id does not exist" }
  - { id: ERR_DOB_NOT_FOUND, http: 404, condition: "DobRecord id does not exist" }
  - { id: ERR_APPEAL_NOT_FOUND, http: 404, condition: "Appeal id does not exist" }
  - { id: ERR_REFERRAL_NOT_FOUND, http: 404, condition: "SbaReferral id does not exist" }
  - { id: ERR_DISBURSEMENT_NOT_FOUND, http: 404, condition: "Disbursement id does not exist" }
  - { id: ERR_RECOUPMENT_NOT_FOUND, http: 404, condition: "Recoupment id does not exist" }

  # --- Request validation ---
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed request: missing required field, bad type, invalid enum, negative amount, or end <= start" }
  - { id: ERR_MISSING_REQUIRED_FIELD, http: 422, condition: "An operation-specific required field (e.g. inspect verified amounts/habitability) is absent" }
  - { id: ERR_DAMAGE_DATE_OUT_OF_PERIOD, http: 422, condition: "Applicant damage_date falls outside the declaration incident period [incident_start, incident_end]" }

  # --- Temporal / registration ---
  - { id: ERR_REGISTRATION_CLOSED, http: 409, condition: "Declaration is not OPEN, or request time is past registration_deadline, when registering an applicant" }
  - { id: ERR_DECLARATION_NOT_OPEN, http: 409, condition: "close-registration requires declaration OPEN" }
  - { id: ERR_DECLARATION_NOT_REGISTRATION_CLOSED, http: 409, condition: "close requires declaration REGISTRATION_CLOSED" }
  - { id: ERR_DECLARATION_CLOSED, http: 409, condition: "Disbursement creation attempted while the declaration is CLOSED [cross-entity]" }
  - { id: ERR_OPEN_DISBURSING_CASES, http: 409, condition: "close blocked because an IhpCase under the declaration is DISBURSING" }

  # --- Applicant / assessment state ---
  - { id: ERR_APPLICANT_NOT_REGISTERED, http: 409, condition: "Scheduling an assessment requires the applicant REGISTERED" }
  - { id: ERR_APPLICANT_NOT_INSPECTED, http: 409, condition: "IhpCase create requires the applicant INSPECTED" }
  - { id: ERR_APPLICANT_NOT_WITHDRAWABLE, http: 409, condition: "Withdraw requires applicant REGISTERED or INSPECTION_SCHEDULED" }
  - { id: ERR_ASSESSMENT_NOT_SCHEDULED, http: 409, condition: "inspect/cancel requires assessment SCHEDULED" }
  - { id: ERR_ASSESSMENT_NOT_INSPECTED, http: 409, condition: "verify requires assessment INSPECTED" }
  - { id: ERR_ASSESSMENT_NOT_VERIFIED, http: 409, condition: "IhpCase create requires referenced assessment VERIFIED [cross-entity]" }
  - { id: ERR_INSPECTOR_DOUBLE_BOOKED, http: 409, condition: "New assessment overlaps another non-terminal appointment of the same inspector within travel_buffer_minutes (closed interval + buffer)" }
  - { id: ERR_RENTAL_PERIOD_OVERLAP, http: 409, condition: "New rental-assistance coverage period overlaps another ACTIVE period of the same applicant (half-open interval, no buffer)" }

  # --- IhpCase / appeal state ---
  - { id: ERR_CASE_NOT_PENDING, http: 409, condition: "approve/deny requires case ELIGIBILITY_PENDING" }
  - { id: ERR_CASE_NOT_APPROVED, http: 409, condition: "First disbursement requires case AWARD_APPROVED" }
  - { id: ERR_CASE_NOT_DISBURSING, http: 409, condition: "Subsequent disbursement / close requires case DISBURSING" }
  - { id: ERR_CASE_NOT_APPEALABLE, http: 409, condition: "Appeal create requires case AWARD_APPROVED or DENIED" }
  - { id: ERR_CASE_NOT_UNDER_APPEAL, http: 409, condition: "Appeal decision requires case UNDER_APPEAL" }
  - { id: ERR_APPEAL_NOT_SUBMITTED, http: 409, condition: "Appeal decision requires appeal SUBMITTED" }
  - { id: ERR_NO_ELIGIBLE_AMOUNT, http: 409, condition: "approve attempted when final net_eligible_cents <= 0 (use deny)" }
  - { id: ERR_INVALID_APPEAL_OUTCOME, http: 422, condition: "Appeal decide outcome is not GRANTED or DENIED" }

  # --- DOB / SBA ---
  - { id: ERR_DOB_NOT_RECORDED, http: 409, condition: "reverse requires DobRecord RECORDED" }
  - { id: ERR_REFERRAL_NOT_OPEN, http: 409, condition: "record-outcome requires referral REFERRED" }
  - { id: ERR_SBA_NOT_ELIGIBLE, http: 422, condition: "Referral create: income > ceiling AND verified loss <= loss threshold" }
  - { id: ERR_INVALID_SBA_OUTCOME, http: 422, condition: "SBA record-outcome outcome is not APPROVED or DECLINED, or APPROVED without sba_loan_amount_cents" }

  # --- Disbursement fiscal / OCC ---
  - { id: ERR_LINE_ITEM_NOT_APPROVED, http: 409, condition: "Disbursement line_item_id is not APPROVED or belongs to a different case" }
  - { id: ERR_DISBURSEMENT_EXCEEDS_OBLIGATION, http: 402, condition: "Disbursement amount exceeds remaining_obligation_cents" }
  - { id: ERR_DISBURSEMENT_NOT_PAID, http: 409, condition: "void requires disbursement PAID" }
  - { id: ERR_STALE_CASE_VERSION, http: 412, condition: "expected_ihp_case_version does not match IhpCase.version (disbursement or appeal create)" }

  # --- Recoupment ---
  - { id: ERR_RECOUPMENT_NOT_ESTABLISHED, http: 409, condition: "record-recovery/waive requires recoupment ESTABLISHED" }
  - { id: ERR_RECOUPMENT_NOT_FULLY_RECOVERED, http: 409, condition: "Cannot satisfy recoupment until cumulative recovered_cents >= debt_amount_cents (informational; SATISFIED is auto on threshold)" }
  - { id: ERR_OPEN_RECOUPMENT, http: 409, condition: "Case close blocked while a Recoupment is ESTABLISHED" }

  # --- Rental assistance period ---
  - { id: ERR_RENTAL_PERIOD_NOT_ACTIVE, http: 409, condition: "close requires rental period ACTIVE" }
  - { id: ERR_CASE_NOT_FUNDABLE_FOR_RENTAL, http: 409, condition: "Rental-period create requires case AWARD_APPROVED or DISBURSING" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Operational administrator: sets up declarations, opens/closes registration, imports DOB, voids disbursements, establishes/recovers/waives recoupment, drives the test clock."
    identity: opaque
    exclusive_operations:
      - "POST /disaster-relief/_clock/set"
      - "POST /disaster-relief/declarations — create declaration"
      - "POST /disaster-relief/declarations/{id}/close-registration"
      - "POST /disaster-relief/declarations/{id}/close"
      - "POST /disaster-relief/inspectors — create inspector"
      - "POST /disaster-relief/caseworkers — create caseworker"
      - "POST /disaster-relief/dob-records/{id}/reverse"
      - "POST /disaster-relief/disbursements/{id}/void"
      - "POST /disaster-relief/recoupments/{id}/record-recovery"
      - "POST /disaster-relief/recoupments/{id}/waive"
    shared_operations:
      - "POST /disaster-relief/applicants — register applicant (with Caseworker)"
      - "POST /disaster-relief/applicants/{id}/withdraw (with Caseworker)"
      - "POST /disaster-relief/assessments — schedule (with Inspector)"
      - "POST /disaster-relief/assessments/{id}/cancel (with Inspector)"
      - "POST /disaster-relief/dob-records — record DOB (with Caseworker)"
      - "POST /disaster-relief/appeals — file appeal (with Caseworker)"
      - "POST /disaster-relief/sba-referrals/{id}/record-outcome (with Caseworker)"
      - "POST /disaster-relief/ihp-cases/{id}/close (with Caseworker)"
      - "All GET list/detail endpoints"
  - name: Inspector
    description: "Field inspector (entity-backed). Schedules and conducts damage assessments; cannot determine eligibility or award."
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /disaster-relief/assessments/{id}/inspect"
    shared_operations:
      - "POST /disaster-relief/assessments — schedule (with ProgramAdmin)"
      - "POST /disaster-relief/assessments/{id}/cancel (with ProgramAdmin)"
      - "All GET list/detail endpoints"
  - name: Caseworker
    description: "Eligibility caseworker (entity-backed). Verifies assessments, opens/approves/denies IHP cases, files/decides appeals (subject to SoD), refers to SBA, records DOB, disburses."
    identity: "entity_backed:Caseworker"
    exclusive_operations:
      - "POST /disaster-relief/assessments/{id}/verify"
      - "POST /disaster-relief/ihp-cases — open case"
      - "POST /disaster-relief/ihp-cases/{id}/approve"
      - "POST /disaster-relief/ihp-cases/{id}/deny"
