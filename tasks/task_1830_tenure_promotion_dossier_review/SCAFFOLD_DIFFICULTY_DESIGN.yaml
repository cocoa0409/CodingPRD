            - { call: "POST /api/members", payload: { committee_id: "${comm_a}", full_name: "Chair A", email: "chair_a@u.edu", role_in_committee: "CHAIR", service_start: "2026-01-01", service_end: "2026-12-31" }, as: ProvostOfficer, captures: { chair_a: $.data.id } }
            - { call: "POST /api/members", payload: { committee_id: "${comm_a}", full_name: "M A1", email: "ma1@u.edu", service_start: "2026-01-01", service_end: "2026-12-31" }, as: ProvostOfficer, captures: { ma1: $.data.id } }
            - { call: "POST /api/members", payload: { committee_id: "${comm_a}", full_name: "M A2", email: "ma2@u.edu", service_start: "2026-01-01", service_end: "2026-12-31" }, as: ProvostOfficer, captures: { ma2: $.data.id } }
            - { call: "POST /api/members", payload: { committee_id: "${comm_a}", full_name: "M A3", email: "ma3@u.edu", service_start: "2026-01-01", service_end: "2026-12-31" }, as: ProvostOfficer, captures: { ma3: $.data.id } }
            - { call: "POST /api/members", payload: { committee_id: "${comm_a}", full_name: "M A4", email: "ma4@u.edu", service_start: "2026-01-01", service_end: "2026-12-31" }, as: ProvostOfficer, captures: { ma4: $.data.id } }
            - { call: "POST /api/members", payload: { committee_id: "${comm_a}", full_name: "M A5", email: "ma5@u.edu", service_start: "2026-01-01", service_end: "2026-12-31" }, as: ProvostOfficer, captures: { ma5: $.data.id } }
            - { call: "POST /api/members", payload: { committee_id: "${comm_a}", full_name: "M A6", email: "ma6@u.edu", service_start: "2026-01-01", service_end: "2026-12-31" }, as: ProvostOfficer, captures: { ma6: $.data.id } }
            - { call: "POST /api/cases/${case_a}/close-solicitation", as: ProvostOfficer }
            - { call: "GET /api/rounds?case_id=${case_a}", as: Any, captures: { round_a: "$.data[0].id" } }
            - { call: "POST /api/rounds/${round_a}/open", as: CommitteeChair, as_user_id: "${chair_a}" }
            - { call: "POST /api/votes", payload: { round_id: "${round_a}", ballot: "YES" }, as: CommitteeVoter, as_user_id: "${ma1}" }
            - { call: "POST /api/votes", payload: { round_id: "${round_a}", ballot: "YES" }, as: CommitteeVoter, as_user_id: "${ma2}" }
            - { call: "POST /api/votes", payload: { round_id: "${round_a}", ballot: "YES" }, as: CommitteeVoter, as_user_id: "${ma3}" }
            - { call: "POST /api/votes", payload: { round_id: "${round_a}", ballot: "NO" }, as: CommitteeVoter, as_user_id: "${ma4}" }
            - { call: "POST /api/votes", payload: { round_id: "${round_a}", ballot: "ABSTAIN" }, as: CommitteeVoter, as_user_id: "${ma5}" }
            - { call: "POST /api/votes", payload: { round_id: "${round_a}", ballot: "ABSTAIN" }, as: CommitteeVoter, as_user_id: "${ma6}" }
