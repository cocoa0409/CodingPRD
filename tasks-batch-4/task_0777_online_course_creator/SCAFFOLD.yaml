# =============================================================================
# task_0777 — Online-Course Creator Platform (Teachable/Kajabi style)
# Difficulty: Expert
# =============================================================================

scenario: |
  Online-Course Creator Platform (Teachable/Kajabi style): creator & course
  builder/curriculum, pricing (one-time/subscription/payment-plan) & coupon,
  student enrollment & drip/progress, community/membership & email, affiliate &
  revenue/payout, quiz/certificate, refund window, analytics

domain_name: online-course-creator
api_prefix: ""   # flat topology: all resource collections live at the root ("/creators", "/courses", ...)

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  state_machine_shape: parallel     # Enrollment carries two independent state axes; Course is cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic          # Invoice.kind (INITIAL/INSTALLMENT/CYCLE) discriminates billing behavior
  role_model: peer_roles
  consistency_model: immediate

  entity_count: 11
  endpoint_count: 41
  error_code_count: 42
  calculation_count: 10
  state_machine_count: 5

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Creator
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: email, type: string, source: input, description: "Creator login email; unique" }
      - { name: display_name, type: string, source: input, description: "Public creator name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE, constraints: "ACTIVE, SUSPENDED" }
      - { name: lifetime_gross_cents, type: integer, source: computed, description: "Sum of amount_cents over all PAID (non-refunded) invoices across this creator's courses" }
      - { name: lifetime_refunded_cents, type: integer, source: computed, description: "Sum of amount_cents over all REFUNDED invoices across this creator's courses" }
      - { name: lifetime_creator_net_cents, type: integer, source: computed, description: "Conserved money quantity: sum of creator_net_cents over invoices whose status==PAID (drops on refund)" }
      - { name: pending_net_cents, type: integer, source: computed, description: "Sum of creator_net_cents over PAID invoices still inside their refund window (clock_now <= paid_at + course.refund_window_days)" }
      - { name: settled_net_cents, type: integer, source: computed, description: "Sum of creator_net_cents over PAID invoices past their refund window (clock_now > paid_at + course.refund_window_days)" }
      - { name: earnings_reserved_cents, type: integer, source: computed, description: "Sum of amount_cents over this creator's payouts in status REQUESTED or PROCESSING" }
      - { name: earnings_paid_cents, type: integer, source: computed, description: "Sum of amount_cents over this creator's payouts in status PAID" }
      - { name: available_for_payout_cents, type: integer, source: computed, description: "settled_net_cents - earnings_paid_cents - earnings_reserved_cents; never negative" }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: email, type: string, source: input, description: "Student email; unique" }
      - { name: full_name, type: string, source: input, description: "Student full name" }

  - name: Course
    parent: Creator
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: creator_id, type: string, source: input, description: "FK -> Creator.id; owning creator" }
      - { name: title, type: string, source: input, description: "Course title" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | UNPUBLISHED | ARCHIVED", default: DRAFT, constraints: "DRAFT, PUBLISHED, UNPUBLISHED, ARCHIVED" }
      - { name: refund_window_days, type: integer, source: input, description: "Refund eligibility window in whole days from paid_at", default: 14, constraints: ">= 0" }
      - { name: community_enabled, type: boolean, source: input, description: "Whether SUBSCRIPTION members get community access", default: false }
      - { name: welcome_email_subject, type: string, source: input, description: "Subject line emailed to a student when their enrollment activates (email touchpoint)", default: "Welcome!" }
      - { name: published_lesson_count, type: integer, source: computed, description: "Count of this course's Lessons with is_published==true" }
      - { name: required_quiz_lesson_count, type: integer, source: computed, description: "Count of this course's published Lessons with is_quiz_required==true" }
      - { name: enrollment_count, type: integer, source: computed, description: "Count of Enrollments whose billing_status not in {CANCELLED, REFUNDED}" }
      - { name: completion_count, type: integer, source: computed, description: "Count of Enrollments with access_status==COMPLETED" }
      - { name: gross_revenue_cents, type: integer, source: computed, description: "Provisional variant: sum of amount_cents over PAID invoices for this course's enrollments" }
      - { name: net_settled_revenue_cents, type: integer, source: computed, description: "Final variant: sum of creator_net_cents over PAID invoices past their refund window" }

  - name: Lesson
    parent: Course
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: course_id, type: string, source: input, description: "FK -> Course.id; owning course" }
      - { name: title, type: string, source: input, description: "Lesson title" }
      - { name: position, type: integer, source: input, description: "1-based ordering within the course curriculum", constraints: ">= 1" }
      - { name: is_published, type: boolean, source: input, description: "Whether lesson counts toward curriculum and progress", default: true }
      - { name: drip_offset_days, type: integer, source: input, description: "Whole days after enrollment activation before this lesson unlocks (drip)", default: 0, constraints: ">= 0" }
      - { name: is_quiz_required, type: boolean, source: input, description: "Whether a passing quiz attempt is required for mastery", default: false }
      - { name: quiz_passing_score, type: integer, source: input, description: "Inclusive score threshold to pass this lesson's quiz (0-100)", default: 70, constraints: "0..100" }

  - name: PricePlan
    parent: Course
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: course_id, type: string, source: input, description: "FK -> Course.id; course this plan prices" }
      - { name: plan_type, type: enum, source: input, description: "ONE_TIME | SUBSCRIPTION | PAYMENT_PLAN", constraints: "ONE_TIME, SUBSCRIPTION, PAYMENT_PLAN" }
      - { name: amount_cents, type: integer, source: input, description: "ONE_TIME/PAYMENT_PLAN: full list price total; SUBSCRIPTION: per-cycle amount", constraints: ">= 1" }
      - { name: billing_interval_days, type: integer, source: input, description: "SUBSCRIPTION cycle length in days; null otherwise", default: null }
      - { name: num_installments, type: integer, source: input, description: "PAYMENT_PLAN installment count; null otherwise", default: null, constraints: ">= 2 when PAYMENT_PLAN" }
      - { name: grants_community, type: boolean, source: input, description: "Whether purchasing this plan grants community/membership access", default: false }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED", default: ACTIVE, constraints: "ACTIVE, ARCHIVED" }

  - name: Coupon
    parent: Course
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: course_id, type: string, source: input, description: "FK -> Course.id; course the coupon discounts" }
      - { name: code, type: string, source: input, description: "Redemption code; unique among overlapping ACTIVE windows on the same course" }
      - { name: discount_type, type: enum, source: input, description: "PERCENT | FIXED", constraints: "PERCENT, FIXED" }
      - { name: discount_value, type: integer, source: input, description: "PERCENT: 1..100; FIXED: cents off", constraints: ">= 1" }
      - { name: min_purchase_cents, type: integer, source: input, description: "Coupon applies only if list_price_cents >= this", default: 0, constraints: ">= 0" }
      - { name: max_redemptions, type: integer, source: input, description: "Maximum successful redemptions", constraints: ">= 1" }
      - { name: redeemed_count, type: integer, source: computed, description: "Conserved count: number of Enrollments using this coupon whose billing_status not in {CANCELLED, REFUNDED}" }
      - { name: starts_at, type: datetime, source: input, description: "Inclusive start of validity window (ISO 8601 UTC)" }
      - { name: expires_at, type: datetime, source: input, description: "Inclusive end of validity window (ISO 8601 UTC)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISABLED", default: ACTIVE, constraints: "ACTIVE, DISABLED" }

  - name: Affiliate
    parent: Creator
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: creator_id, type: string, source: input, description: "FK -> Creator.id; creator whose courses this affiliate promotes" }
      - { name: code, type: string, source: input, description: "Affiliate referral code; unique per creator" }
      - { name: commission_pct, type: integer, source: input, description: "Commission percentage of each paid invoice amount (0..100)", constraints: "0..100" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE, constraints: "ACTIVE, SUSPENDED" }
      - { name: commission_pending_cents, type: integer, source: computed, description: "Sum of affiliate_commission_cents over PAID invoices attributed to this affiliate" }
      - { name: commission_clawed_back_cents, type: integer, source: computed, description: "Sum of affiliate_commission_cents over REFUNDED invoices attributed to this affiliate" }
      - { name: referred_revenue_cents, type: integer, source: computed, description: "Sum of amount_cents over PAID (non-refunded) invoices attributed to this affiliate" }

  - name: Enrollment
    parent: Course
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; enrolled student" }
      - { name: course_id, type: string, source: input, description: "FK -> Course.id; enrolled course" }
      - { name: price_plan_id, type: string, source: input, description: "FK -> PricePlan.id; plan purchased" }
      - { name: coupon_id, type: string, source: system, description: "FK -> Coupon.id; resolved from coupon_code at checkout; null if none", default: null }
      - { name: affiliate_id, type: string, source: system, description: "FK -> Affiliate.id; resolved from affiliate_code at checkout; null if none", default: null }
      - { name: access_status, type: enum, source: system, description: "LOCKED | ACTIVE | COMPLETED | REVOKED (access axis)", default: LOCKED, constraints: "LOCKED, ACTIVE, COMPLETED, REVOKED" }
      - { name: billing_status, type: enum, source: system, description: "PENDING | CURRENT | CANCELLED | REFUNDED (billing axis)", default: PENDING, constraints: "PENDING, CURRENT, CANCELLED, REFUNDED" }
      - { name: activated_at, type: datetime, source: system, description: "Clock time when the initial invoice was paid and access became ACTIVE; drip offsets count from here", default: null }
      - { name: list_price_cents, type: integer, source: computed, description: "Base price used for checkout, before coupon (see checkout_charge)" }
      - { name: discount_cents, type: integer, source: computed, description: "Coupon discount applied to the initial charge" }
      - { name: initial_charge_cents, type: integer, source: computed, description: "Amount of the INITIAL invoice created at checkout" }
      - { name: scheduled_total_cents, type: integer, source: computed, description: "Provisional variant: total the plan is scheduled to collect" }
      - { name: collected_total_cents, type: integer, source: computed, description: "Final variant: sum of amount_cents over this enrollment's PAID invoices" }
      - { name: completed_lesson_count, type: integer, source: computed, description: "Number of published lessons the student has completed" }
      - { name: raw_progress_pct, type: integer, source: computed, description: "Provisional completion variant: floor(completed_lesson_count / course.published_lesson_count * 100)" }
      - { name: is_mastery_complete, type: boolean, source: computed, description: "Final completion variant: all published lessons completed AND all required-quiz lessons passed" }
      - { name: community_access, type: boolean, source: computed, description: "True when access_status==ACTIVE/COMPLETED and the purchased PricePlan.grants_community and course.community_enabled" }
      - { name: certificate_serial, type: string, source: system, description: "Minted on transition to COMPLETED; cleared on REVOKED", default: null }
      - { name: certificate_issued_at, type: datetime, source: system, description: "Clock time the certificate was minted", default: null }

  - name: Invoice
    parent: Enrollment
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; owning enrollment" }
      - { name: sequence_index, type: integer, source: system, description: "1-based order of this invoice within the enrollment", constraints: ">= 1" }
      - { name: kind, type: enum, source: system, description: "INITIAL | INSTALLMENT | CYCLE (polymorphic billing discriminator)", constraints: "INITIAL, INSTALLMENT, CYCLE" }
      - { name: amount_cents, type: integer, source: system, description: "Charge amount for this invoice", constraints: ">= 1" }
      - { name: cycle_start, type: datetime, source: input, description: "CYCLE coverage start (inclusive); null for INITIAL/INSTALLMENT", default: null }
      - { name: cycle_end, type: datetime, source: input, description: "CYCLE coverage end (exclusive); null for INITIAL/INSTALLMENT", default: null }
      - { name: status, type: enum, source: system, description: "PENDING | PAID | REFUNDED | VOID", default: PENDING, constraints: "PENDING, PAID, REFUNDED, VOID" }
      - { name: paid_at, type: datetime, source: system, description: "Clock time the invoice was paid", default: null }
      - { name: refunded_at, type: datetime, source: system, description: "Clock time the invoice was refunded", default: null }
      - { name: platform_fee_cents, type: integer, source: computed, description: "floor(amount_cents * PLATFORM_FEE_PCT / 100), computed on pay" }
      - { name: affiliate_commission_cents, type: integer, source: computed, description: "floor(amount_cents * affiliate.commission_pct / 100) if affiliate ACTIVE else 0, computed on pay" }
      - { name: creator_net_cents, type: integer, source: computed, description: "amount_cents - platform_fee_cents - affiliate_commission_cents, computed on pay" }

  - name: Payout
    parent: Creator
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: creator_id, type: string, source: input, description: "FK -> Creator.id; payee creator" }
      - { name: amount_cents, type: integer, source: input, description: "Requested payout amount", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "REQUESTED | PROCESSING | PAID | FAILED | CANCELLED", default: REQUESTED, constraints: "REQUESTED, PROCESSING, PAID, FAILED, CANCELLED" }

  - name: QuizAttempt
    parent: Enrollment
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; owning enrollment" }
      - { name: lesson_id, type: string, source: input, description: "FK -> Lesson.id; lesson whose quiz was attempted" }
      - { name: score, type: integer, source: input, description: "Score achieved (0..100)", constraints: "0..100" }
      - { name: passed, type: boolean, source: computed, description: "score >= lesson.quiz_passing_score (inclusive boundary)" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Course: cyclic (publish / unpublish / republish loop) ----
  - entity: Course
    field: status
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /courses/{id}/set-status status=PUBLISHED"
        actor: Creator
        preconditions:
          - "Course has >= 1 published lesson (published_lesson_count >= 1)"
          - "Course has >= 1 ACTIVE PricePlan"
        side_effects: []
      - from: PUBLISHED
        to: UNPUBLISHED
        trigger: "POST /courses/{id}/set-status status=UNPUBLISHED"
        actor: Creator
        preconditions: []
        side_effects: ["Blocks new enrollments while UNPUBLISHED; existing enrollments unaffected"]
      - from: UNPUBLISHED
        to: PUBLISHED
        trigger: "POST /courses/{id}/set-status status=PUBLISHED (republish)"
        actor: Creator
        preconditions:
          - "Course has >= 1 published lesson"
          - "Course has >= 1 ACTIVE PricePlan"
        side_effects: []
      - from: [DRAFT, PUBLISHED, UNPUBLISHED]
        to: ARCHIVED
        trigger: "POST /courses/{id}/set-status status=ARCHIVED"
        actor: Creator
        preconditions: []
        side_effects: ["Course becomes immutable; blocks new enrollments"]

  # ---- Enrollment access axis (parallel dimension #1) ----
  - entity: Enrollment
    field: access_status
    initial_state: LOCKED
    terminal_states: [REVOKED]
    transitions:
      - from: LOCKED
        to: ACTIVE
        trigger: "system: initial invoice transitions PENDING->PAID"
        actor: system
        preconditions: []
        side_effects:
          - "Sets Enrollment.activated_at = clock_now (drip offsets count from here)"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: on complete-lesson when is_mastery_complete becomes true"
        actor: system
        preconditions:
          - "completed_lesson_count == course.published_lesson_count"
          - "every published lesson with is_quiz_required==true has a QuizAttempt with passed==true"
        side_effects:
          - "Mint certificate: set certificate_serial and certificate_issued_at = clock_now"
          - "Course.completion_count incremented (bubble-up)"
      - from: [ACTIVE, COMPLETED]
        to: REVOKED
        trigger: "system: initial invoice transitions PAID->REFUNDED (cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Clear certificate_serial and certificate_issued_at"
          - "Reset completed_lesson_count to 0"
          - "Cascade to Creator earnings reversal (see Invoice refund chain)"

  # ---- Enrollment billing axis (parallel dimension #2) ----
  - entity: Enrollment
    field: billing_status
    initial_state: PENDING
    terminal_states: [CANCELLED, REFUNDED]
    transitions:
      - from: PENDING
        to: CURRENT
        trigger: "system: initial invoice transitions PENDING->PAID"
        actor: system
        preconditions: []
        side_effects: ["Coupon.redeemed_count already counts this enrollment (see coupon_redemption invariant)"]
      - from: [PENDING, CURRENT]
        to: CANCELLED
        trigger: "POST /enrollments/{id}/cancel"
        actor: Student
        preconditions:
          - "No invoice for this enrollment is in status PAID (only pre-payment cancellation)"
        side_effects:
          - "access_status -> REVOKED"
          - "All PENDING invoices -> VOID"
          - "Enrollment drops out of Coupon.redeemed_count (compensating count)"
      - from: [PENDING, CURRENT]
        to: REFUNDED
        trigger: "system: initial invoice transitions PAID->REFUNDED (cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "access_status -> REVOKED"
          - "Enrollment drops out of Coupon.redeemed_count (compensating count)"

  # ---- Invoice: branching (pay / refund / void) ----
  - entity: Invoice
    field: status
    initial_state: PENDING
    terminal_states: [REFUNDED, VOID]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: "Student or PlatformAdmin"
        preconditions:
          - "Parent enrollment's course.status != ARCHIVED"
        side_effects:
          - "Set paid_at = clock_now"
          - "Compute platform_fee_cents = floor(amount_cents * PLATFORM_FEE_PCT/100)"
          - "Compute affiliate_commission_cents (per-invoice, see affiliate_commission)"
          - "Compute creator_net_cents = amount_cents - platform_fee_cents - affiliate_commission_cents"
          - "If kind==INITIAL: enrollment access_status LOCKED->ACTIVE and billing_status PENDING->CURRENT"
          - "Creator ledger recomputed (lifetime_gross, lifetime_creator_net, pending_net/settled_net)"
      - from: PAID
        to: REFUNDED
        trigger: "POST /invoices/{id}/refund"
        actor: "Creator or PlatformAdmin"
        preconditions:
          - "clock_now <= paid_at + course.refund_window_days (inclusive refund window)"
        side_effects:
          - "Set refunded_at = clock_now"
          - "Creator ledger reversal: creator_net_cents drops out of lifetime_creator_net_cents; amount added to lifetime_refunded_cents"
          - "Affiliate commission clawback: affiliate_commission_cents moves from commission_pending_cents to commission_clawed_back_cents"
          - "If kind==INITIAL: cascade Enrollment access_status->REVOKED and billing_status->REFUNDED"
      - from: PENDING
        to: VOID
        trigger: "system: parent enrollment cancelled"
        actor: system
        preconditions: []
        side_effects: []

  # ---- Payout: linear with cancel/fail branches ----
  - entity: Payout
    field: status
    initial_state: REQUESTED
    terminal_states: [PAID, FAILED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: PROCESSING
        trigger: "POST /payouts/{id}/set-status status=PROCESSING"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["amount_cents remains reserved (earnings_reserved_cents)"]
      - from: PROCESSING
        to: PAID
        trigger: "POST /payouts/{id}/set-status status=PAID"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "amount_cents moves from earnings_reserved_cents to earnings_paid_cents"
          - "increments Creator.version by 1"
      - from: PROCESSING
        to: FAILED
        trigger: "POST /payouts/{id}/set-status status=FAILED"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Reservation released (amount returns to available_for_payout_cents)"
          - "increments Creator.version by 1"
      - from: [REQUESTED, PROCESSING]
        to: CANCELLED
        trigger: "POST /payouts/{id}/set-status status=CANCELLED"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Reservation released (amount returns to available_for_payout_cents)"
          - "increments Creator.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: payout-create-stale-creator
    parent_entity: Creator
    write_endpoint: "POST /creators/{id}/payouts"
    occ_field: "expected_creator_version"
    description: |
      Creating a Payout against a Creator whose version has advanced since the
      client last observed it is rejected. A payout draws down the creator's
      available balance; when a prior payout create (which legitimately draws
      the same balance) or a refund cascade has already advanced the creator's
      version, the current writer's view is stale and the create is refused.
    error_id: ERR_STALE_CREATOR_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: checkout_charge
    trigger: "POST /enrollments (checkout)"
    algorithm: tiered_pricing
    formula: |
      # list_price_cents by plan_type
      if plan_type == ONE_TIME:      list_price_cents = plan.amount_cents
      if plan_type == PAYMENT_PLAN:  list_price_cents = plan.amount_cents     # total across installments
      if plan_type == SUBSCRIPTION:  list_price_cents = plan.amount_cents     # first cycle

      # coupon eligibility (all must hold, else discount_cents = 0)
      eligible = coupon != null
                 AND coupon.status == ACTIVE
                 AND coupon.starts_at <= clock_now <= coupon.expires_at
                 AND coupon.redeemed_count < coupon.max_redemptions
                 AND list_price_cents >= coupon.min_purchase_cents          # inclusive boundary

      if eligible and coupon.discount_type == PERCENT:
        discount_cents = floor(list_price_cents * coupon.discount_value / 100)
      elif eligible and coupon.discount_type == FIXED:
        discount_cents = min(coupon.discount_value, list_price_cents)
      else:
        discount_cents = 0

      discounted_total_cents = list_price_cents - discount_cents

      if plan_type == ONE_TIME:      initial_charge_cents = discounted_total_cents
      if plan_type == SUBSCRIPTION:  initial_charge_cents = discounted_total_cents   # later cycles bill full amount_cents
      if plan_type == PAYMENT_PLAN:  initial_charge_cents = installment_amount(discounted_total_cents, num_installments, index=1)
    input_set: "The single PricePlan, optional Coupon (resolved from coupon_code) at the current clock."
    constants: {}
    precision: "integer cents; floor on PERCENT discount"
    variants: []

  - name: installment_split
    trigger: "PAYMENT_PLAN checkout; determines each installment invoice amount"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is pinned: first (n-1) installments are ceil, the LAST is the remainder.
      per = ceil(discounted_total_cents / num_installments)
      installment_amount(total, n, index):
        if index < n:  return ceil(total / n)
        else:          return total - ceil(total / n) * (n - 1)   # last = remainder
      # Sum of all installments == discounted_total_cents exactly (no drift).
    input_set: "discounted_total_cents and num_installments from the PAYMENT_PLAN checkout."
    constants: {}
    precision: "integer cents; ceil per installment, last is remainder"
    variants: []

  - name: platform_fee
    trigger: "invoice PENDING->PAID"
    algorithm: percentage
    formula: |
      platform_fee_cents = floor(invoice.amount_cents * PLATFORM_FEE_PCT / 100)
    constants: { PLATFORM_FEE_PCT: 10 }
    precision: "integer cents, floor"
    variants: []

  - name: affiliate_commission
    trigger: "invoice PENDING->PAID"
    algorithm: aggregation
    formula: |
      # Per-invoice, then summed across invoices (pinned: NOT computed on the summed total).
      if enrollment.affiliate_id != null AND affiliate.status == ACTIVE:
        affiliate_commission_cents = floor(invoice.amount_cents * affiliate.commission_pct / 100)
      else:
        affiliate_commission_cents = 0
      # Affiliate.commission_pending_cents = sum(affiliate_commission_cents of PAID invoices attributed to affiliate)
      # is the sum of per-invoice floors, deliberately != floor(sum(amount)*pct/100).
    constants: {}
    precision: "integer cents, floor per invoice"
    variants: []

  - name: creator_net
    trigger: "invoice PENDING->PAID"
    algorithm: aggregation
    formula: |
      creator_net_cents = invoice.amount_cents - invoice.platform_fee_cents - invoice.affiliate_commission_cents
    input_set: "single invoice at pay time"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: course_revenue
    trigger: "GET /courses/{id}; recomputed on every invoice pay/refund and clock change"
    algorithm: aggregation
    formula: |
      gross_revenue_cents      = sum(inv.amount_cents      for inv in invoices(course) if inv.status == PAID)
      net_settled_revenue_cents = sum(inv.creator_net_cents for inv in invoices(course)
                                       if inv.status == PAID AND clock_now > inv.paid_at + course.refund_window_days)
    input_set: "All invoices belonging to enrollments of this course."
    constants: {}
    precision: "integer cents"
    variants:
      - name: gross
        when: "always available; counts every PAID invoice including those still inside the refund window"
        difference: "uses amount_cents (pre-fee) and ignores the refund window"
      - name: net_settled
        when: "revenue recognized only after the refund window closes"
        difference: "uses creator_net_cents and excludes PAID invoices still inside their window"

  - name: enrollment_completion
    trigger: "GET /enrollments/{id}; recomputed on complete-lesson and quiz-attempts"
    algorithm: threshold
    formula: |
      raw_progress_pct = floor(completed_lesson_count / course.published_lesson_count * 100)   # 0 when denominator is 0
      is_mastery_complete = (completed_lesson_count == course.published_lesson_count)
                            AND (for every published lesson L with L.is_quiz_required:
                                   exists QuizAttempt qa for this enrollment with qa.lesson_id==L.id and qa.passed==true)
    input_set: "This enrollment's completed lessons and quiz attempts vs the course's published lessons."
    constants: {}
    precision: "integer percent, floor"
    variants:
      - name: raw_progress
        when: "progress bar / analytics"
        difference: "counts only lesson completion; a student can be 100% raw_progress yet not mastery-complete if a required quiz is unpassed"
      - name: mastery
        when: "certificate issuance gate"
        difference: "requires both full lesson completion AND all required quizzes passed"

  - name: enrollment_billing_total
    trigger: "GET /enrollments/{id}"
    algorithm: aggregation
    formula: |
      scheduled_total_cents:
        ONE_TIME:      = discounted_total_cents
        PAYMENT_PLAN:  = discounted_total_cents            # sum of all installments
        SUBSCRIPTION:  = discounted_total_cents            # provisional: first cycle only (open-ended plan)
      collected_total_cents = sum(inv.amount_cents for inv in invoices(enrollment) if inv.status == PAID)
    input_set: "This enrollment's invoices."
    constants: {}
    precision: "integer cents"
    variants:
      - name: scheduled
        when: "at checkout (forward-looking)"
        difference: "the amount the plan is scheduled to collect"
      - name: collected
        when: "any time (chronological, actuals)"
        difference: "only invoices actually PAID; diverges from scheduled when a payment plan is partially paid or cancelled"

  - name: creator_available_balance
    trigger: "GET /creators/{id}; recomputed on invoice pay/refund, payout transitions, clock change"
    algorithm: aggregation
    formula: |
      pending_net_cents  = sum(inv.creator_net_cents for inv in creator_invoices if inv.status==PAID
                               AND clock_now <= inv.paid_at + course.refund_window_days)
      settled_net_cents  = sum(inv.creator_net_cents for inv in creator_invoices if inv.status==PAID
                               AND clock_now  > inv.paid_at + course.refund_window_days)
      earnings_reserved_cents = sum(p.amount_cents for p in creator_payouts if p.status in {REQUESTED, PROCESSING})
      earnings_paid_cents     = sum(p.amount_cents for p in creator_payouts if p.status == PAID)
      available_for_payout_cents = max(0, settled_net_cents - earnings_paid_cents - earnings_reserved_cents)
    input_set: "All PAID/REFUNDED invoices and all payouts for this creator's courses."
    constants: {}
    precision: "integer cents"
    variants: []

  - name: creator_net_ledger_invariant
    trigger: "invariant checked after any invoice pay/refund"
    algorithm: aggregation
    formula: |
      # Conserved money quantity: lifetime_creator_net_cents equals the running sum over PAID invoices.
      lifetime_creator_net_cents == sum(inv.creator_net_cents for inv in creator_invoices if inv.status == PAID)
      # A pay(+net) then a full refund(-net, invoice leaves PAID) returns this to its pre-pay value: zero drift.
    input_set: "All of a creator's invoices."
    constants: {}
    precision: "integer cents"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Request body/query well-formed; required fields present, enums/types valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 3
    category: auth
    check: "Role permitted for this operation per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 4
    category: existence
    check: "Path resources exist (validated left-to-right); unknown id -> that entity's NOT_FOUND"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: all id-bearing endpoints

  - priority: 5
    category: business_referential
    check: "Ownership: Creator acts only on own Course/Lesson/PricePlan/Coupon/Affiliate/Invoice/Payout; Student acts only on own Enrollment"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: all mutating owned-resource endpoints

  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition (state-machine from-state check)"
    error_id: "ERR_*_INVALID_STATE / ERR_INVOICE_NOT_PAYABLE / ERR_INVOICE_NOT_REFUNDABLE / ERR_ENROLLMENT_INVALID_STATE / ERR_PAYOUT_INVALID_STATUS_TRANSITION / ERR_COURSE_INVALID_STATUS_TRANSITION"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 7
    category: business_referential
    check: "Cross-references belong together: price_plan.course_id==course, coupon.course_id==course, affiliate.creator_id==course.creator_id, lesson.course_id==enrollment.course_id"
    error_id: "ERR_PRICE_PLAN_COURSE_MISMATCH / ERR_COUPON_COURSE_MISMATCH / ERR_AFFILIATE_CREATOR_MISMATCH / ERR_LESSON_COURSE_MISMATCH"
    http_status: 422
    applies_to: "POST /enrollments, complete-lesson, quiz-attempts"

  - priority: 8
    category: business_constraint
    check: "Cross-entity state gates: enroll requires course.status==PUBLISHED and price_plan.status==ACTIVE; payout requires creator.status==ACTIVE; affiliate must be ACTIVE to attribute"
    error_id: "ERR_COURSE_NOT_PUBLISHED / ERR_PRICE_PLAN_INACTIVE / ERR_CREATOR_SUSPENDED / ERR_AFFILIATE_INACTIVE"
    http_status: "409 / 403"
    applies_to: "POST /enrollments, POST /creators/{id}/payouts"

  - priority: 9
    category: business_temporal
    check: "Time-window gates: coupon window (starts_at<=now<=expires_at), refund window (now<=paid_at+refund_window_days), lesson drip lock (now>=activated_at+drip_offset_days)"
    error_id: "ERR_COUPON_WINDOW_EXPIRED / ERR_REFUND_WINDOW_EXPIRED / ERR_LESSON_LOCKED"
    http_status: "422 / 409"
    applies_to: "POST /enrollments, POST /invoices/{id}/refund, complete-lesson"

  - priority: 10
    category: business_constraint
    check: "Interval-overlap gates: coupon code windows on a course must not overlap (closed intervals); subscription CYCLE invoice intervals must not overlap (half-open, adjacency allowed); one active enrollment per student+course"
    error_id: "ERR_COUPON_WINDOW_OVERLAP / ERR_CYCLE_OVERLAP / ERR_DUPLICATE_ENROLLMENT"
    http_status: 409
    applies_to: "POST /coupons, POST /enrollments/{id}/invoices, POST /enrollments"

  - priority: 11
    category: business_fiscal
    check: "Quota/fiscal gates: coupon min_purchase met, coupon redemption limit, payout amount <= available_for_payout_cents"
    error_id: "ERR_COUPON_MIN_PURCHASE_NOT_MET / ERR_COUPON_REDEMPTION_LIMIT / ERR_INSUFFICIENT_BALANCE"
    http_status: "422 / 409 / 402"
    applies_to: "POST /enrollments, POST /creators/{id}/payouts"

  - priority: 12
    category: state
    check: "OCC: expected_creator_version must equal creator.version on payout create"
    error_id: ERR_STALE_CREATOR_VERSION
    http_status: 412
    applies_to: "POST /creators/{id}/payouts"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Creators ----
  - method: POST
    path: "/creators"
    description: "Onboard a creator"
    roles: [PlatformAdmin]
    code: 201
    input: [email, display_name]
    output: Creator
    side_effects: ["status=ACTIVE; all ledger fields 0"]

  - method: GET
    path: "/creators/{id}"
    description: "Get creator (includes version and ledger fields)"
    roles: [PlatformAdmin, Creator]
    code: 200
    input: []
    output: Creator
    side_effects: []

  - method: POST
    path: "/creators/{id}/set-status"
    description: "Suspend or reactivate a creator"
    roles: [PlatformAdmin]
    code: 200
    input: [status]
    output: Creator
    side_effects: ["status -> ACTIVE | SUSPENDED"]

  # ---- Students ----
  - method: POST
    path: "/students"
    description: "Register a student"
    roles: [PlatformAdmin]
    code: 201
    input: [email, full_name]
    output: Student
    side_effects: []

  # ---- Courses ----
  - method: POST
    path: "/courses"
    description: "Create a course (DRAFT)"
    roles: [Creator]
    code: 201
    input: [creator_id, title, "refund_window_days?", "community_enabled?", "welcome_email_subject?"]
    output: Course
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/courses/{id}"
    description: "Get course with computed analytics (revenue, counts)"
    roles: [PlatformAdmin, Creator, Student]
    code: 200
    input: []
    output: Course
    side_effects: []

  - method: GET
    path: "/courses"
    description: "List courses; filter by creator_id/status"
    roles: [PlatformAdmin, Creator, Student]
    code: 200
    input: ["creator_id?", "status?", "limit?", "offset?"]
    output: "Course[]"
    side_effects: []

  - method: POST
    path: "/courses/{id}/set-status"
    description: "Publish / unpublish / republish / archive a course"
    roles: [Creator]
    code: 200
    input: [status]
    output: Course
    side_effects: ["status transition per Course state machine"]

  # ---- Lessons ----
  - method: POST
    path: "/lessons"
    description: "Add a curriculum lesson to a course"
    roles: [Creator]
    code: 201
    input: [course_id, title, position, "is_published?", "drip_offset_days?", "is_quiz_required?", "quiz_passing_score?"]
    output: Lesson
    side_effects: ["Course.published_lesson_count / required_quiz_lesson_count recomputed"]

  - method: GET
    path: "/lessons/{id}"
    description: "Get lesson"
    roles: [PlatformAdmin, Creator, Student]
    code: 200
    input: []
    output: Lesson
    side_effects: []

  - method: GET
    path: "/lessons"
    description: "List lessons; filter by course_id"
    roles: [PlatformAdmin, Creator, Student]
    code: 200
    input: ["course_id?", "limit?", "offset?"]
    output: "Lesson[]"
    side_effects: []

  # ---- Price Plans ----
  - method: POST
    path: "/price-plans"
    description: "Create a pricing plan for a course"
    roles: [Creator]
    code: 201
    input: [course_id, plan_type, amount_cents, "billing_interval_days?", "num_installments?", "grants_community?"]
    output: PricePlan
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/price-plans/{id}"
    description: "Get price plan"
    roles: [PlatformAdmin, Creator, Student]
    code: 200
    input: []
    output: PricePlan
    side_effects: []

  - method: GET
    path: "/price-plans"
    description: "List price plans; filter by course_id"
    roles: [PlatformAdmin, Creator, Student]
    code: 200
    input: ["course_id?", "limit?", "offset?"]
    output: "PricePlan[]"
    side_effects: []

  - method: POST
    path: "/price-plans/{id}/set-status"
    description: "Archive a price plan"
    roles: [Creator]
    code: 200
    input: [status]
    output: PricePlan
    side_effects: ["status -> ARCHIVED"]

  # ---- Coupons ----
  - method: POST
    path: "/coupons"
    description: "Create a coupon for a course"
    roles: [Creator]
    code: 201
    input: [course_id, code, discount_type, discount_value, max_redemptions, starts_at, expires_at, "min_purchase_cents?"]
    output: Coupon
    side_effects: ["status=ACTIVE; rejects window overlap with an existing ACTIVE coupon of the same code"]

  - method: GET
    path: "/coupons/{id}"
    description: "Get coupon"
    roles: [PlatformAdmin, Creator]
    code: 200
    input: []
    output: Coupon
    side_effects: []

  - method: GET
    path: "/coupons"
    description: "List coupons; filter by course_id"
    roles: [PlatformAdmin, Creator]
    code: 200
    input: ["course_id?", "limit?", "offset?"]
    output: "Coupon[]"
    side_effects: []

  - method: POST
    path: "/coupons/{id}/set-status"
    description: "Disable a coupon"
    roles: [Creator]
    code: 200
    input: [status]
    output: Coupon
    side_effects: ["status -> DISABLED"]

  # ---- Affiliates ----
  - method: POST
    path: "/affiliates"
    description: "Create an affiliate under a creator"
    roles: [Creator]
    code: 201
    input: [creator_id, code, commission_pct]
    output: Affiliate
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/affiliates/{id}"
    description: "Get affiliate with commission analytics"
    roles: [PlatformAdmin, Creator]
    code: 200
    input: []
    output: Affiliate
    side_effects: []

  - method: GET
    path: "/affiliates"
    description: "List affiliates; filter by creator_id"
    roles: [PlatformAdmin, Creator]
    code: 200
    input: ["creator_id?", "limit?", "offset?"]
    output: "Affiliate[]"
    side_effects: []

  - method: POST
    path: "/affiliates/{id}/set-status"
    description: "Suspend or reactivate an affiliate"
    roles: [Creator]
    code: 200
    input: [status]
    output: Affiliate
    side_effects: ["status -> ACTIVE | SUSPENDED"]

  # ---- Enrollments ----
  - method: POST
    path: "/enrollments"
    description: "Checkout: enroll a student in a course via a price plan, optional coupon_code and affiliate_code"
    roles: [Student]
    code: 201
    input: [student_id, course_id, price_plan_id, "coupon_code?", "affiliate_code?"]
    output: Enrollment
    side_effects:
      - "Resolve coupon_code -> coupon_id, affiliate_code -> affiliate_id"
      - "Compute list_price_cents, discount_cents, initial_charge_cents, scheduled_total_cents (checkout_charge)"
      - "ONE_TIME/SUBSCRIPTION: create one INITIAL invoice (status PENDING, amount=initial_charge_cents)"
      - "PAYMENT_PLAN: create all num_installments invoices at once — sequence 1 kind INITIAL amount=installment[1], sequence 2..n kind INSTALLMENT amount=installment[i] (all PENDING)"
      - "access_status=LOCKED, billing_status=PENDING"
      - "Coupon.redeemed_count incremented if a coupon applied"

  - method: GET
    path: "/enrollments/{id}"
    description: "Get enrollment with progress, completion, billing totals, certificate"
    roles: [PlatformAdmin, Creator, Student]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: GET
    path: "/enrollments"
    description: "List enrollments; filter by student_id/course_id/price_plan_id/coupon_id/affiliate_id/status"
    roles: [PlatformAdmin, Creator, Student]
    code: 200
    input: ["student_id?", "course_id?", "price_plan_id?", "coupon_id?", "affiliate_id?", "status?", "limit?", "offset?"]
    output: "Enrollment[]"
    side_effects: []

  - method: POST
    path: "/enrollments/{id}/complete-lesson"
    description: "Mark a (drip-unlocked, published) lesson complete; may trigger completion"
    roles: [Student]
    code: 200
    input: [lesson_id]
    output: Enrollment
    side_effects:
      - "completed_lesson_count / raw_progress_pct recomputed"
      - "If is_mastery_complete becomes true: access_status ACTIVE->COMPLETED, mint certificate, Course.completion_count++"

  - method: POST
    path: "/enrollments/{id}/cancel"
    description: "Cancel an enrollment before any payment"
    roles: [Student]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["billing_status->CANCELLED, access_status->REVOKED, PENDING invoices->VOID, coupon redemption released"]

  - method: POST
    path: "/enrollments/{id}/quiz-attempts"
    description: "Submit a quiz attempt for a required-quiz lesson"
    roles: [Student]
    code: 201
    input: [lesson_id, score]
    output: QuizAttempt
    side_effects: ["passed = score >= lesson.quiz_passing_score; may enable mastery completion"]

  - method: POST
    path: "/enrollments/{id}/invoices"
    description: "Generate the next SUBSCRIPTION cycle invoice for an enrollment"
    roles: [Creator, PlatformAdmin]
    code: 201
    input: [cycle_start, cycle_end]
    output: Invoice
    side_effects: ["Create CYCLE invoice (status PENDING, amount=plan.amount_cents); rejects interval overlap with existing non-refunded CYCLE invoice"]

  # ---- Quiz Attempts ----
  - method: GET
    path: "/quiz-attempts/{id}"
    description: "Get a quiz attempt"
    roles: [PlatformAdmin, Creator, Student]
    code: 200
    input: []
    output: QuizAttempt
    side_effects: []

  - method: GET
    path: "/quiz-attempts"
    description: "List quiz attempts; filter by enrollment_id/lesson_id"
    roles: [PlatformAdmin, Creator, Student]
    code: 200
    input: ["enrollment_id?", "lesson_id?", "limit?", "offset?"]
    output: "QuizAttempt[]"
    side_effects: []

  # ---- Invoices ----
  - method: GET
    path: "/invoices/{id}"
    description: "Get an invoice with fee/commission/net breakdown"
    roles: [PlatformAdmin, Creator, Student]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/invoices"
    description: "List invoices; filter by enrollment_id"
    roles: [PlatformAdmin, Creator, Student]
    code: 200
    input: ["enrollment_id?", "limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []

  - method: POST
    path: "/invoices/{id}/pay"
    description: "Pay an invoice (simulated settlement)"
    roles: [Student, PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status PENDING->PAID; fees/commission/net computed; INITIAL activates enrollment; creator ledger recomputed"]

  - method: POST
    path: "/invoices/{id}/refund"
    description: "Refund a PAID invoice within the refund window"
    roles: [Creator, PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status PAID->REFUNDED; ledger reversal; affiliate clawback; INITIAL cascades enrollment REVOKED/REFUNDED"]

  # ---- Payouts ----
  - method: POST
    path: "/creators/{id}/payouts"
    description: "Request a payout against a creator's available balance (OCC)"
    roles: [Creator]
    code: 201
    input: [amount_cents, expected_creator_version]
    output: Payout
    side_effects: ["status=REQUESTED; amount reserved; increments Creator.version by 1"]

  - method: GET
    path: "/payouts/{id}"
    description: "Get a payout"
    roles: [PlatformAdmin, Creator]
    code: 200
    input: []
    output: Payout
    side_effects: []

  - method: GET
    path: "/payouts"
    description: "List payouts; filter by creator_id"
    roles: [PlatformAdmin, Creator]
    code: 200
    input: ["creator_id?", "limit?", "offset?"]
    output: "Payout[]"
    side_effects: []

  - method: POST
    path: "/payouts/{id}/set-status"
    description: "Advance a payout (PROCESSING/PAID/FAILED/CANCELLED)"
    roles: [PlatformAdmin]
    code: 200
    input: [status]
    output: Payout
    side_effects: ["status transition per Payout state machine; ledger reservation/settle/release; increments Creator.version"]

  # ---- Test-driving ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["logical clock advanced; recomputes window-dependent computed fields"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, or invalid enum/type" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "Acting user is not the owner of the target resource" }
  - { id: ERR_CREATOR_NOT_FOUND, http: 404, condition: "Creator id does not exist" }
  - { id: ERR_STUDENT_NOT_FOUND, http: 404, condition: "Student id does not exist" }
  - { id: ERR_COURSE_NOT_FOUND, http: 404, condition: "Course id does not exist" }
  - { id: ERR_LESSON_NOT_FOUND, http: 404, condition: "Lesson id does not exist" }
  - { id: ERR_PRICE_PLAN_NOT_FOUND, http: 404, condition: "PricePlan id does not exist" }
  - { id: ERR_COUPON_NOT_FOUND, http: 404, condition: "Coupon id (or resolved coupon_code) does not exist" }
  - { id: ERR_AFFILIATE_NOT_FOUND, http: 404, condition: "Affiliate id (or resolved affiliate_code) does not exist" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "Enrollment id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Invoice id does not exist" }
  - { id: ERR_PAYOUT_NOT_FOUND, http: 404, condition: "Payout id does not exist" }
  - { id: ERR_QUIZ_ATTEMPT_NOT_FOUND, http: 404, condition: "QuizAttempt id does not exist" }
  - { id: ERR_COURSE_INVALID_STATUS_TRANSITION, http: 409, condition: "Requested Course status transition not allowed from current status (e.g., publish with no published lesson / no active plan, or archived is immutable)" }
  - { id: ERR_COURSE_NOT_PUBLISHED, http: 409, condition: "Enrollment attempted on a course not in PUBLISHED status" }
  - { id: ERR_PRICE_PLAN_INACTIVE, http: 409, condition: "Enrollment attempted with an ARCHIVED price plan" }
  - { id: ERR_PRICE_PLAN_COURSE_MISMATCH, http: 422, condition: "price_plan.course_id does not match the enrollment's course_id" }
  - { id: ERR_COUPON_COURSE_MISMATCH, http: 422, condition: "coupon.course_id does not match the enrollment's course_id" }
  - { id: ERR_COUPON_INACTIVE, http: 409, condition: "Coupon is DISABLED" }
  - { id: ERR_COUPON_WINDOW_EXPIRED, http: 422, condition: "Current clock is outside the coupon [starts_at, expires_at] window" }
  - { id: ERR_COUPON_MIN_PURCHASE_NOT_MET, http: 422, condition: "list_price_cents < coupon.min_purchase_cents" }
  - { id: ERR_COUPON_REDEMPTION_LIMIT, http: 409, condition: "coupon.redeemed_count >= coupon.max_redemptions" }
  - { id: ERR_COUPON_WINDOW_OVERLAP, http: 409, condition: "New coupon's window overlaps an existing ACTIVE coupon of the same code on the same course (closed intervals)" }
  - { id: ERR_AFFILIATE_CREATOR_MISMATCH, http: 422, condition: "affiliate.creator_id does not match the course's creator_id" }
  - { id: ERR_AFFILIATE_INACTIVE, http: 409, condition: "Affiliate is SUSPENDED and cannot be attributed" }
  - { id: ERR_ENROLLMENT_INVALID_STATE, http: 409, condition: "Enrollment not in a valid state for the operation (e.g., cancel after payment, complete-lesson while LOCKED/REVOKED)" }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 409, condition: "Student already has a non-terminal enrollment in this course" }
  - { id: ERR_LESSON_COURSE_MISMATCH, http: 422, condition: "lesson.course_id does not match the enrollment's course_id" }
  - { id: ERR_LESSON_NOT_PUBLISHED, http: 409, condition: "Cannot complete or quiz an unpublished lesson" }
  - { id: ERR_LESSON_LOCKED, http: 409, condition: "Lesson is still drip-locked (clock_now < activated_at + drip_offset_days)" }
  - { id: ERR_QUIZ_NOT_REQUIRED, http: 422, condition: "Quiz attempt submitted for a lesson with is_quiz_required==false" }
  - { id: ERR_INVOICE_NOT_PAYABLE, http: 409, condition: "Invoice not in PENDING status" }
  - { id: ERR_INVOICE_NOT_REFUNDABLE, http: 409, condition: "Invoice not in PAID status" }
  - { id: ERR_REFUND_WINDOW_EXPIRED, http: 409, condition: "clock_now > paid_at + course.refund_window_days" }
  - { id: ERR_CYCLE_OVERLAP, http: 409, condition: "CYCLE invoice interval overlaps an existing non-refunded CYCLE invoice (half-open)" }
  - { id: ERR_CREATOR_SUSPENDED, http: 403, condition: "Payout requested while creator status==SUSPENDED" }
  - { id: ERR_INSUFFICIENT_BALANCE, http: 402, condition: "Payout amount_cents > available_for_payout_cents" }
  - { id: ERR_PAYOUT_INVALID_STATUS_TRANSITION, http: 409, condition: "Requested Payout status transition not allowed from current status" }
  - { id: ERR_INVALID_STATUS_VALUE, http: 422, condition: "set-status target value not a member of the entity's status enum" }
  - { id: ERR_STALE_CREATOR_VERSION, http: 412, condition: "expected_creator_version != creator.version on payout create" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator: onboards creators/students, processes payouts, may refund/pay any invoice, controls the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /creators — onboard creator"
      - "POST /creators/{id}/set-status — suspend/reactivate creator"
      - "POST /students — register student"
      - "POST /payouts/{id}/set-status — advance payout"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "POST /invoices/{id}/pay — with Student"
      - "POST /invoices/{id}/refund — with Creator"
      - "POST /enrollments/{id}/invoices — with Creator"
      - "GET reads across creators/courses/coupons/affiliates/enrollments/invoices/payouts"

  - name: Creator
    description: "Course creator: builds courses/curriculum/pricing/coupons/affiliates, refunds own invoices, requests payouts"
    identity: "entity_backed:Creator"
    exclusive_operations:
      - "POST /courses — create own course"
      - "POST /courses/{id}/set-status — publish/unpublish/archive own course"
      - "POST /lessons — add lesson to own course"
      - "POST /price-plans — price own course"
      - "POST /price-plans/{id}/set-status — archive own plan"
      - "POST /coupons — create own coupon"
      - "POST /coupons/{id}/set-status — disable own coupon"
      - "POST /affiliates — create own affiliate"
      - "POST /affiliates/{id}/set-status — suspend/reactivate own affiliate"
      - "POST /creators/{id}/payouts — request own payout"
    shared_operations:
      - "POST /invoices/{id}/refund — with PlatformAdmin (own invoices)"
      - "POST /enrollments/{id}/invoices — with PlatformAdmin (own course enrollments)"
      - "GET reads of own resources"

  - name: Student
    description: "Learner: enrolls, pays, consumes curriculum, submits quizzes"
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /enrollments — enroll self"
      - "POST /enrollments/{id}/complete-lesson — progress own enrollment"
      - "POST /enrollments/{id}/cancel — cancel own enrollment"
      - "POST /enrollments/{id}/quiz-attempts — attempt quiz on own enrollment"
    shared_operations:
      - "POST /invoices/{id}/pay — with PlatformAdmin (own invoices)"
      - "GET reads of own resources / public course catalog"
