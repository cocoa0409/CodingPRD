        grounds:
          - state_machines.MoveDayPlan.status.IN_PROGRESS_to_COMPLETED
          - state_machines.CrewAssignment.status.CHECKED_IN_to_COMPLETED
          - calculations.engagement_labor_rollup
          - calculations.labor_charge_pipeline_selector
          - calculations.invoice_subtotal
          - state_machines.Milestone.status.IN_PROGRESS_to_COMPLETE
          - calculations.engagement_phase_derivation
        distinguishing_aspect: |
          Depth 6 from the single trigger POST /move-day-plans/{id}/complete: the plan
          completion completes the CHECKED_IN assignment, which recomputes that
          assignment's hours and labor_cents, which recomputes the engagement labour
          rollup, which appends the HOURLY_LABOR invoice line, which recomputes the
