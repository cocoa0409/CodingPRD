              as: PlatformAdmin
            - call: "POST /staffing/clinicians"
              payload: { full_name: "Ivo Marek", email: "ivo.marek@example.com", specialty: "RN" }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /staffing/clinicians/${cl_id}/credentials"
              payload: { credential_type: "RN_LICENSE", license_number: "RN-9009", issued_on: "2025-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
