# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index (task_0251)
# Public Library Management — EXPERT band
# 9 Difficulty Rules x >= 2 instances each = 18 instances.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# Every setup_api_calls/trigger call resolves to a §1.5 endpoint.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: overdue_fine_estimate_vs_final_diverge_on_loan
        grounds:
          - calculations.overdue_fine_final
          - calculations.overdue_fine_final.variants.overdue_fine_estimate
          - state_machines.Loan.ACTIVE_to_RETURNED
          - endpoints["GET /library/loans/{id}/fine-estimate"]
        distinguishing_aspect: |
          Dual-variant on the Loan domain: forward-looking estimate (projected_return=5 days
          past due -> 100c) and chronological final at checkin (actual 7 days past due -> 150c)
          produce DIFFERENT cents for the SAME loan. This pair operates on Loan; the second
          dual-variant pair (replacement_charge) operates on Copy — different entity domains.
        test_recipe:
          setup:
            - "Branch with loan_period_days=7, grace_days=1, daily_fine_cents=25, max_fine_cents=1000, fine_free=false."
            - "Clock pinned to 2026-06-01T00:00:00Z; one ACTIVE loan due 2026-06-08T00:00:00Z."
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "Main", fine_free: false, daily_fine_cents: 25, max_fine_cents: 1000, grace_days: 1, loan_period_days: 7, block_threshold_cents: 1000 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Librarian
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Pat One" }
              as: Librarian
              captures: { p_id: $.data.id }
            - call: "POST /library/titles"
              payload: { branch_id: "${br_id}", isbn: "9780000000001", title_text: "Estimate Book" }
              as: Librarian
              captures: { t_id: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-1", acquired_on: "2025-06-01T00:00:00Z" }
              as: Librarian
              captures: { c_id: $.data.id }
            - call: "POST /library/loans"
              payload: { copy_id: "${c_id}", patron_id: "${p_id}" }
              as: Librarian
              captures: { ln_id: $.data.id }
          trigger:
            - call: "GET /library/loans/${ln_id}/fine-estimate?projected_return=2026-06-13T00:00:00Z"
              payload: {}
              as: Librarian
              captures: { est: $.data.estimate_cents }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: Librarian
            - call: "POST /library/loans/${ln_id}/checkin"
              payload: {}
              as: Librarian
              captures: { final: $.data.accrued_fine_cents }
          assert:
            - "GET fine-estimate estimate_cents == 100  (projected 12 days out: 2026-06-13 is 5 days past due, chargeable 4 * 25)"
            - "Loan.${ln_id}.accrued_fine_cents == 150  (actual 2026-06-15 is 7 days past due, chargeable 6 * 25)"
            - "estimate_cents (100) != accrued_fine_cents (150) for the same loan"

      - name: replacement_charge_depreciated_vs_default_diverge_on_copy
        grounds:
          - calculations.replacement_charge
          - calculations.replacement_charge.variants.replacement_charge_default
          - state_machines.Loan.ACTIVE_to_LOST
          - entities.Copy.fields.condition_factor
        distinguishing_aspect: |
          Dual-variant on the Copy domain: DEPRECIATED base (age 1yr, cf=1.0 -> 2700+300=3000c)
          vs DEFAULT flat (flat_replacement=true -> 3000+300=3300c) yield DIFFERENT cents for the
          SAME lost copy. Distinct entity domain (Copy) from the overdue-fine dual-variant (Loan).
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; copy acquired 2025-06-01 (age 365 days -> 1.0yr -> 10% depreciation), condition_factor=1.0, title default_replacement_cents=3000."
            - "Two identical loans on two identical copies of the title, one declared lost flat, one depreciated."
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "Main", loan_period_days: 7, block_threshold_cents: 100000 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Librarian
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Pat Two" }
              as: Librarian
              captures: { p_id: $.data.id }
            - call: "POST /library/titles"
              payload: { branch_id: "${br_id}", isbn: "9780000000002", title_text: "Lost Book", default_replacement_cents: 3000 }
              as: Librarian
              captures: { t_id: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-D", acquired_on: "2025-06-01T00:00:00Z", condition_factor: 1.0 }
              as: Librarian
              captures: { c_dep: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-F", acquired_on: "2025-06-01T00:00:00Z", condition_factor: 1.0 }
              as: Librarian
              captures: { c_flat: $.data.id }
            - call: "POST /library/loans"
              payload: { copy_id: "${c_dep}", patron_id: "${p_id}" }
              as: Librarian
              captures: { ln_dep: $.data.id }
            - call: "POST /library/loans"
              payload: { copy_id: "${c_flat}", patron_id: "${p_id}" }
              as: Librarian
              captures: { ln_flat: $.data.id }
          trigger:
            - call: "POST /library/loans/${ln_dep}/declare-lost"
              payload: {}
              as: Librarian
              captures: { dep_fine: $.data.accrued_fine_cents }
            - call: "POST /library/loans/${ln_flat}/declare-lost"
              payload: { flat_replacement: true }
              as: Librarian
              captures: { flat_fine: $.data.accrued_fine_cents }
          assert:
            - "Fine created for ${ln_dep} has amount_cents == 3000  (item round(3000*0.90*1.0)=2700 + processing round(300)=300)"
            - "Fine created for ${ln_flat} has amount_cents == 3300  (item 3000 flat + processing 300)"
            - "depreciated charge (3000) != default charge (3300) for identical copies"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: overdue_fine_nested_min_max_with_grace_and_cap
        grounds:
          - calculations.overdue_fine_final
          - entities.Branch.fields.grace_days
          - entities.Branch.fields.max_fine_cents
          - state_machines.Loan.ACTIVE_to_RETURNED
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs and non-linear interaction —
          min(max(0, overdue_days - grace_days) * daily_fine_cents, max_fine_cents).
          At 100 overdue days the inner product 99*25=2475 is capped to max_fine_cents=1000.
          This is mode (a); the second combinatorial instance is mode (b) rounding-order.
        test_recipe:
          setup:
            - "Branch loan_period_days=7, grace_days=1, daily_fine_cents=25, max_fine_cents=1000."
            - "Loan due 2026-06-08; clock advanced 100 days past due before checkin."
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "Cap", daily_fine_cents: 25, max_fine_cents: 1000, grace_days: 1, loan_period_days: 7 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Librarian
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Cap Pat" }
              as: Librarian
              captures: { p_id: $.data.id }
            - call: "POST /library/titles"
              payload: { branch_id: "${br_id}", isbn: "9780000000003", title_text: "Cap Book" }
              as: Librarian
              captures: { t_id: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-C", acquired_on: "2025-01-01T00:00:00Z" }
              as: Librarian
              captures: { c_id: $.data.id }
            - call: "POST /library/loans"
              payload: { copy_id: "${c_id}", patron_id: "${p_id}" }
              as: Librarian
              captures: { ln_id: $.data.id }
          trigger:
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: Librarian
            - call: "POST /library/loans/${ln_id}/checkin"
              payload: {}
              as: Librarian
              captures: { fine: $.data.accrued_fine_cents }
          assert:
            - "Loan.${ln_id}.accrued_fine_cents == 1000  (100 overdue days, chargeable 99, 99*25=2475 capped to max_fine_cents 1000)"

      - name: replacement_charge_round_each_component_then_sum
        grounds:
          - calculations.replacement_charge
          - entities.Copy.fields.condition_factor
          - entities.Title.fields.default_replacement_cents
          - state_machines.Loan.ACTIVE_to_LOST
        distinguishing_aspect: |
          Mode (b): nested rounding where order is pinned — item_value and processing fee are EACH
          round_half_up to whole cents, THEN summed (round-per-component-then-sum), distinct from
          mode (a) above. cf=0.5, age 2yr, default 5000 -> item round(5000*0.80*0.5)=2000,
          processing round(5000*0.10)=500, sum 2500.
        test_recipe:
          setup:
            - "Clock 2026-06-01; copy acquired 2024-06-01 (age 730 days -> 2.0yr -> 20% depreciation), condition_factor=0.5, default_replacement_cents=5000."
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "Round", loan_period_days: 7, block_threshold_cents: 100000 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Librarian
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Round Pat" }
              as: Librarian
              captures: { p_id: $.data.id }
            - call: "POST /library/titles"
              payload: { branch_id: "${br_id}", isbn: "9780000000004", title_text: "Round Book", default_replacement_cents: 5000 }
              as: Librarian
              captures: { t_id: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-R", acquired_on: "2024-06-01T00:00:00Z", condition_factor: 0.5 }
              as: Librarian
              captures: { c_id: $.data.id }
            - call: "POST /library/loans"
              payload: { copy_id: "${c_id}", patron_id: "${p_id}" }
              as: Librarian
              captures: { ln_id: $.data.id }
          trigger:
            - call: "POST /library/loans/${ln_id}/declare-lost"
              payload: {}
              as: Librarian
              captures: { fine: $.data.accrued_fine_cents }
          assert:
            - "Fine for ${ln_id} amount_cents == 2500  (item round(5000*0.80*0.5)=2000 + processing round(5000*0.10)=500)"

      - name: account_balance_waiver_tier_evaluation_order
        grounds:
          - calculations.capped_account_balance
          - endpoints["GET /library/patrons/{id}/account-summary"]
          - state_machines.Fine.UNPAID_to_PAID
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order — net_owed depends on
          waiver, waiver depends on the TIER of raw_total, raw_total depends on UNPAID fines.
          Order: compute raw_total (2500) -> tier>=2000 -> waiver 200 -> net 2300. Distinct from
          mode (a) and mode (b) instances above.
        test_recipe:
          setup:
            - "Patron with two UNPAID lost fines summing to 2500c (one LOST fine 2500 from a single declared-lost copy at default 2500)."
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "Acct", loan_period_days: 7, block_threshold_cents: 100000 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Librarian
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Acct Pat" }
              as: Librarian
              captures: { p_id: $.data.id }
            - call: "POST /library/titles"
              payload: { branch_id: "${br_id}", isbn: "9780000000005", title_text: "Acct Book", default_replacement_cents: 2500 }
              as: Librarian
              captures: { t_id: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-A1", acquired_on: "2026-06-01T00:00:00Z", condition_factor: 1.0 }
              as: Librarian
              captures: { c_id: $.data.id }
            - call: "POST /library/loans"
              payload: { copy_id: "${c_id}", patron_id: "${p_id}" }
              as: Librarian
              captures: { ln_id: $.data.id }
            - call: "POST /library/loans/${ln_id}/declare-lost"
              payload: { flat_replacement: true }
              as: Librarian
          trigger:
            - call: "GET /library/patrons/${p_id}/account-summary"
              payload: {}
              as: Librarian
              captures: { raw: $.data.raw_total_cents, waiver: $.data.waiver_cents, net: $.data.net_owed_cents }
          assert:
            - "account-summary raw_total_cents == 2750  (LOST flat: item 2500 + processing round(2500*0.10)=250)"
            - "account-summary waiver_cents == 200  (raw 2750 >= GOODWILL_TIER 2000)"
            - "account-summary net_owed_cents == 2550  (2750 - 200)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: loan_renewal_self_loop_cyclic
        grounds:
          - state_machines.Loan.ACTIVE_to_ACTIVE
          - entities.Loan.fields.renewal_count
          - entities.Loan.fields.due_date
        distinguishing_aspect: |
          Cyclic shape on Loan: ACTIVE -> ACTIVE self-loop (renewal) advances due_date and
          renewal_count without leaving ACTIVE. Non-linear (loops back to same state) on the Loan
          entity; the second non-linear machine (Reservation branching) is a DIFFERENT entity.
        test_recipe:
          setup:
            - "Branch loan_period_days=7; one ACTIVE loan, no holds on the title."
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "Renew", loan_period_days: 7 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Librarian
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Renew Pat" }
              as: Librarian
              captures: { p_id: $.data.id }
            - call: "POST /library/titles"
              payload: { branch_id: "${br_id}", isbn: "9780000000006", title_text: "Renew Book" }
              as: Librarian
              captures: { t_id: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-RN", acquired_on: "2025-06-01T00:00:00Z" }
              as: Librarian
              captures: { c_id: $.data.id }
            - call: "POST /library/loans"
              payload: { copy_id: "${c_id}", patron_id: "${p_id}" }
              as: Librarian
              captures: { ln_id: $.data.id }
          trigger:
            - call: "POST /library/loans/${ln_id}/renew"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
              captures: { rc1: $.data.renewal_count }
            - call: "POST /library/loans/${ln_id}/renew"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
              captures: { rc2: $.data.renewal_count, st2: $.data.status }
          assert:
            - "After first renew Loan.${ln_id}.renewal_count == 1 and status still ACTIVE"
            - "After second renew Loan.${ln_id}.renewal_count == 2 and status still ACTIVE (self-loop)"
            - "Loan.${ln_id}.due_date == 2026-06-22T00:00:00Z  (checkout 06-01 + 7 + 7 + 7)"

      - name: reservation_confirmed_branches_to_divergent_terminals
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CHECKED_IN
          - state_machines.Reservation.CONFIRMED_to_NO_SHOW
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Branching shape on Reservation: from CONFIRMED, three forks with divergent side-effects
          (CHECKED_IN stamps checked_in_at; NO_SHOW frees window without check-in; CANCELLED frees
          window). Different entity than the Loan cyclic machine.
        test_recipe:
          setup:
            - "IN_SERVICE ROOM resource; one CONFIRMED reservation 10:00-11:00 on 2026-06-01."
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "Res", reservation_buffer_minutes: 15 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Res Pat" }
              as: Librarian
              captures: { p_id: $.data.id }
            - call: "POST /library/resources"
              payload: { branch_id: "${br_id}", resource_kind: "ROOM", label: "Study Room A" }
              as: BranchManager
              captures: { rs_id: $.data.id, rs_v: $.data.version }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Librarian
            - call: "POST /library/reservations"
              payload: { resource_id: "${rs_id}", patron_id: "${p_id}", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z", expected_resource_version: "${rs_v}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { rv_id: $.data.id }
            - call: "POST /library/reservations/${rv_id}/confirm"
              payload: {}
              as: Librarian
          trigger:
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T10:05:00Z" }
              as: Librarian
            - call: "POST /library/reservations/${rv_id}/checkin"
              payload: {}
              as: Librarian
              captures: { st: $.data.status, cin: $.data.checked_in_at }
          assert:
            - "Reservation.${rv_id}.status == CHECKED_IN (one of three CONFIRMED forks)"
            - "Reservation.${rv_id}.checked_in_at == 2026-06-01T10:05:00.000Z (CHECKED_IN fork stamps the field; NO_SHOW/CANCELLED forks would leave it null)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: declare_lost_cascade_to_patron_block_depth4
        grounds:
          - state_machines.Loan.ACTIVE_to_LOST
          - state_machines.Copy
          - calculations.patron_balance_and_block
          - entities.Patron.fields.borrowing_status
        distinguishing_aspect: |
          Depth-4 cascade from declare-lost: Loan -> LOST mutates Copy -> LOST; Copy LOST causes
          Fine(LOST) creation; the Fine raises Patron.total_owed_cents; crossing block_threshold
          flips Patron.borrowing_status -> BLOCKED. Each link caused by the prior. Trigger =
          declare-lost (distinct from the return/promotion cascade).
        test_recipe:
          setup:
            - "Branch block_threshold_cents=1000; patron with one ACTIVE loan on a copy worth 3300c lost."
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "Block", loan_period_days: 7, block_threshold_cents: 1000 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Librarian
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Block Pat" }
              as: Librarian
              captures: { p_id: $.data.id }
            - call: "POST /library/titles"
              payload: { branch_id: "${br_id}", isbn: "9780000000007", title_text: "Block Book", default_replacement_cents: 3000 }
              as: Librarian
              captures: { t_id: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-BL", acquired_on: "2026-06-01T00:00:00Z", condition_factor: 1.0 }
              as: Librarian
              captures: { c_id: $.data.id }
            - call: "POST /library/loans"
              payload: { copy_id: "${c_id}", patron_id: "${p_id}" }
              as: Librarian
              captures: { ln_id: $.data.id }
          trigger:
            - call: "POST /library/loans/${ln_id}/declare-lost"
              payload: { flat_replacement: true }
              as: Librarian
            - call: "GET /library/copies/${c_id}"
              payload: {}
              as: Librarian
              captures: { copy_status: $.data.status }
            - call: "GET /library/patrons/${p_id}"
              payload: {}
              as: Librarian
              captures: { owed: $.data.total_owed_cents, bstatus: $.data.borrowing_status }
          assert:
            - "Copy.${c_id}.status == LOST"
            - "A Fine of fine_type LOST amount_cents == 3300 exists for patron ${p_id} (flat 3000 + processing 300)"
            - "Patron.${p_id}.total_owed_cents == 3300 and borrowing_status == BLOCKED (3300 >= 1000)"

      - name: checkin_return_promotes_head_hold_depth3
        grounds:
          - state_machines.Loan.ACTIVE_to_RETURNED
          - state_machines.Copy
          - state_machines.Hold.WAITING_to_READY
          - entities.Patron.fields.ready_pickup_count
        distinguishing_aspect: |
          Depth-3 cascade from checkin: Loan -> RETURNED mutates Copy -> AVAILABLE; Copy becoming
          AVAILABLE promotes the head WAITING Hold -> READY (re-reserving the copy ON_HOLD_SHELF and
          bumping that holder's ready_pickup_count). Each link caused by the prior. Trigger = checkin
          (distinct from declare-lost cascade).
        test_recipe:
          setup:
            - "One copy ON_LOAN to patron A; patron B has a WAITING hold (queue head) on the title."
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "Promote", loan_period_days: 7 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Librarian
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Patron A" }
              as: Librarian
              captures: { pa_id: $.data.id }
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Patron B" }
              as: Librarian
              captures: { pb_id: $.data.id }
            - call: "POST /library/titles"
              payload: { branch_id: "${br_id}", isbn: "9780000000008", title_text: "Hot Book" }
              as: Librarian
              captures: { t_id: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-PR", acquired_on: "2025-06-01T00:00:00Z" }
              as: Librarian
              captures: { c_id: $.data.id }
            - call: "POST /library/loans"
              payload: { copy_id: "${c_id}", patron_id: "${pa_id}" }
              as: Librarian
              captures: { ln_id: $.data.id }
            - call: "POST /library/holds"
              payload: { title_id: "${t_id}", patron_id: "${pb_id}" }
              as: Patron
              as_user_id: "${pb_id}"
              captures: { h_id: $.data.id }
          trigger:
            - call: "POST /library/loans/${ln_id}/checkin"
              payload: {}
              as: Librarian
            - call: "GET /library/copies/${c_id}"
              payload: {}
              as: Librarian
              captures: { cs: $.data.status }
            - call: "GET /library/holds/${h_id}"
              payload: {}
              as: Librarian
              captures: { hs: $.data.status, rcid: $.data.ready_copy_id }
            - call: "GET /library/patrons/${pb_id}"
              payload: {}
              as: Librarian
              captures: { rpc: $.data.ready_pickup_count }
          assert:
            - "Hold.${h_id}.status == READY and ready_copy_id == ${c_id}"
            - "Copy.${c_id}.status == ON_HOLD_SHELF (reserved for the promoted hold, not AVAILABLE)"
            - "Patron.${pb_id}.ready_pickup_count == 1"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: checkout_state_beats_business_constraint
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_RESOURCE_NOT_AVAILABLE]
          - errors[ERR_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Category pair: business_referential (priority 6, Copy not AVAILABLE) vs business_constraint
          (priority 10, checkout_limit exceeded). A checkout that violates BOTH returns the
          higher-priority ERR_RESOURCE_NOT_AVAILABLE. Distinct error-category pair from the
          temporal-vs-fiscal conflict instance.
        test_recipe:
          setup:
            - "Patron with checkout_limit=1 already at 1 ACTIVE loan; a second copy that is currently ON_LOAN (not AVAILABLE)."
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "Conf1", loan_period_days: 7 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Librarian
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Limit Pat", checkout_limit: 1 }
              as: Librarian
              captures: { p_id: $.data.id }
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Other Pat" }
              as: Librarian
              captures: { p2_id: $.data.id }
            - call: "POST /library/titles"
              payload: { branch_id: "${br_id}", isbn: "9780000000009", title_text: "Conf Book" }
              as: Librarian
              captures: { t_id: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-X1", acquired_on: "2025-06-01T00:00:00Z" }
              as: Librarian
              captures: { c1_id: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-X2", acquired_on: "2025-06-01T00:00:00Z" }
              as: Librarian
              captures: { c2_id: $.data.id }
            - call: "POST /library/loans"
              payload: { copy_id: "${c1_id}", patron_id: "${p_id}" }
              as: Librarian
            - call: "POST /library/loans"
              payload: { copy_id: "${c2_id}", patron_id: "${p2_id}" }
              as: Librarian
          trigger:
            - call: "POST /library/loans"
              payload: { copy_id: "${c2_id}", patron_id: "${p_id}" }
              as: Librarian
              captures: { err: $.data.error_id }
          assert:
            - "Checkout of ${c2_id} for ${p_id} returns 409 ERR_RESOURCE_NOT_AVAILABLE (priority 6 wins over the priority-10 limit violation)"

      - name: reservation_temporal_beats_fiscal_block_pair
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_PATRON_BLOCKED]
          - errors[ERR_RESERVATION_CONFLICT]
        distinguishing_aspect: |
          Category pair: business_safety (priority 8, patron BLOCKED) vs business_temporal
          (priority 9, reservation interval conflict). A blocked patron booking a conflicting ROOM
          window returns the higher-priority ERR_PATRON_BLOCKED. Distinct error-category pair from
          the referential-vs-constraint conflict instance.
        test_recipe:
          setup:
            - "Patron BLOCKED by a 2000c unpaid lost fine (threshold 1000); a ROOM already CONFIRMED 10:00-11:00 so any overlapping window also conflicts."
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "Conf2", loan_period_days: 7, block_threshold_cents: 1000, reservation_buffer_minutes: 0 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Librarian
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Blocked Pat" }
              as: Librarian
              captures: { p_id: $.data.id }
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Holder Pat" }
              as: Librarian
              captures: { p2_id: $.data.id }
            - call: "POST /library/titles"
              payload: { branch_id: "${br_id}", isbn: "9780000000010", title_text: "Conf2 Book", default_replacement_cents: 2000 }
              as: Librarian
              captures: { t_id: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-Y1", acquired_on: "2026-06-01T00:00:00Z", condition_factor: 1.0 }
              as: Librarian
              captures: { c_id: $.data.id }
            - call: "POST /library/loans"
              payload: { copy_id: "${c_id}", patron_id: "${p_id}" }
              as: Librarian
              captures: { ln_id: $.data.id }
            - call: "POST /library/loans/${ln_id}/declare-lost"
              payload: { flat_replacement: true }
              as: Librarian
            - call: "POST /library/resources"
              payload: { branch_id: "${br_id}", resource_kind: "ROOM", label: "Room Z" }
              as: BranchManager
              captures: { rs_id: $.data.id, rs_v: $.data.version }
            - call: "POST /library/reservations"
              payload: { resource_id: "${rs_id}", patron_id: "${p2_id}", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z", expected_resource_version: "${rs_v}" }
              as: Patron
              as_user_id: "${p2_id}"
            - call: "GET /library/resources/${rs_id}"
              payload: {}
              as: Librarian
              captures: { rs_v2: $.data.version }
          trigger:
            - call: "POST /library/reservations"
              payload: { resource_id: "${rs_id}", patron_id: "${p_id}", start_at: "2026-06-01T10:30:00Z", end_at: "2026-06-01T11:30:00Z", expected_resource_version: "${rs_v2}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Patron ${p_id} total_owed_cents == 2200 (flat 2000 + processing 200) so borrowing_status BLOCKED"
            - "Reservation create returns 409 ERR_PATRON_BLOCKED (priority 8 beats the priority-9 temporal conflict)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: overdue_grace_boundary_day_index
        grounds:
          - calculations.overdue_fine_final
          - entities.Branch.fields.grace_days
          - endpoints["POST /library/loans/{id}/checkin"]
        distinguishing_aspect: |
          Boundary on the overdue-day metric at the grace edge: overdue_days == grace_days (1) is
          fine-free (day index <= grace), overdue_days == grace_days+1 (2) charges exactly one day.
          Metric = chargeable_days threshold on the checkin endpoint. Distinct metric/endpoint from
          the empty-license-pool boundary.
        test_recipe:
          setup:
            - "Branch grace_days=1, daily_fine_cents=25, loan_period_days=7. Loan due 2026-06-08, returned exactly 1 day late vs exactly 2 days late."
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "Grace", daily_fine_cents: 25, grace_days: 1, loan_period_days: 7, max_fine_cents: 1000 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Librarian
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Grace Pat" }
              as: Librarian
              captures: { p_id: $.data.id }
            - call: "POST /library/titles"
              payload: { branch_id: "${br_id}", isbn: "9780000000011", title_text: "Grace Book" }
              as: Librarian
              captures: { t_id: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-G1", acquired_on: "2025-06-01T00:00:00Z" }
              as: Librarian
              captures: { c1_id: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-G2", acquired_on: "2025-06-01T00:00:00Z" }
              as: Librarian
              captures: { c2_id: $.data.id }
            - call: "POST /library/loans"
              payload: { copy_id: "${c1_id}", patron_id: "${p_id}" }
              as: Librarian
              captures: { ln1_id: $.data.id }
            - call: "POST /library/loans"
              payload: { copy_id: "${c2_id}", patron_id: "${p_id}" }
              as: Librarian
              captures: { ln2_id: $.data.id }
          trigger:
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: Librarian
            - call: "POST /library/loans/${ln1_id}/checkin"
              payload: {}
              as: Librarian
              captures: { f1: $.data.accrued_fine_cents }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: Librarian
            - call: "POST /library/loans/${ln2_id}/checkin"
              payload: {}
              as: Librarian
              captures: { f2: $.data.accrued_fine_cents }
          assert:
            - "Loan ${ln1_id} returned 2026-06-09 (1 day overdue == grace) accrued_fine_cents == 0"
            - "Loan ${ln2_id} returned 2026-06-10 (2 days overdue == grace+1) accrued_fine_cents == 25"

      - name: ebook_checkout_empty_pool_boundary
        grounds:
          - calculations.pool_license_availability
          - validations[priority=11]
          - errors[ERR_NO_LICENSE_AVAILABLE]
          - endpoints["POST /library/ebook-loans"]
        distinguishing_aspect: |
          Boundary on the license-availability metric (zero-count edge): available_licenses == 1
          permits checkout, available_licenses == 0 rejects with ERR_NO_LICENSE_AVAILABLE. Distinct
          metric (integer pool count) and distinct endpoint (ebook-loans) from the overdue-day grace
          boundary.
        test_recipe:
          setup:
            - "License pool with total_licenses=1; one ACTIVE ebook-loan already consuming the single license."
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "Ebook", loan_period_days: 7 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Librarian
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Ebook Pat A" }
              as: Librarian
              captures: { pa_id: $.data.id }
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Ebook Pat B" }
              as: Librarian
              captures: { pb_id: $.data.id }
            - call: "POST /library/titles"
              payload: { branch_id: "${br_id}", isbn: "9780000000012", title_text: "Ebook Title" }
              as: Librarian
              captures: { t_id: $.data.id }
            - call: "POST /library/license-pools"
              payload: { title_id: "${t_id}", total_licenses: 1, loan_term_days: 14 }
              as: Librarian
              captures: { pool_id: $.data.id }
            - call: "POST /library/ebook-loans"
              payload: { pool_id: "${pool_id}", patron_id: "${pa_id}" }
              as: Patron
              as_user_id: "${pa_id}"
          trigger:
            - call: "POST /library/ebook-loans"
              payload: { pool_id: "${pool_id}", patron_id: "${pb_id}" }
              as: Patron
              as_user_id: "${pb_id}"
              captures: { err: $.data.error_id }
          assert:
            - "After first checkout pool available_licenses == 0"
            - "Second checkout returns 409 ERR_NO_LICENSE_AVAILABLE (boundary: available_licenses == 0)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: checkout_blocked_when_copy_not_available
        grounds:
          - state_machines.Copy
          - validations[priority=6]
          - errors[ERR_RESOURCE_NOT_AVAILABLE]
          - endpoints["POST /library/loans"]
        distinguishing_aspect: |
          Cross-entity pair Loan<-Copy: a Loan checkout is valid only when the referenced Copy.status
          is AVAILABLE; an ON_LOAN copy rejects the second checkout. Distinct entity pair from the
          Reservation<-BookableResource dependency.
        test_recipe:
          setup:
            - "One copy already ON_LOAN to patron A; patron B attempts to check out the same copy."
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "CopyDep", loan_period_days: 7 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Librarian
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Dep Pat A" }
              as: Librarian
              captures: { pa_id: $.data.id }
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Dep Pat B" }
              as: Librarian
              captures: { pb_id: $.data.id }
            - call: "POST /library/titles"
              payload: { branch_id: "${br_id}", isbn: "9780000000013", title_text: "Dep Book" }
              as: Librarian
              captures: { t_id: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-CD", acquired_on: "2025-06-01T00:00:00Z" }
              as: Librarian
              captures: { c_id: $.data.id }
            - call: "POST /library/loans"
              payload: { copy_id: "${c_id}", patron_id: "${pa_id}" }
              as: Librarian
          trigger:
            - call: "POST /library/loans"
              payload: { copy_id: "${c_id}", patron_id: "${pb_id}" }
              as: Librarian
              captures: { err: $.data.error_id }
          assert:
            - "Second checkout of ${c_id} returns 409 ERR_RESOURCE_NOT_AVAILABLE (Copy.status ON_LOAN, not AVAILABLE)"

      - name: reservation_checkin_blocked_when_resource_out_of_service
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CHECKED_IN
          - entities.BookableResource.fields.status
          - errors[ERR_RESOURCE_NOT_AVAILABLE]
          - endpoints["POST /library/reservations/{id}/checkin"]
        distinguishing_aspect: |
          Cross-entity pair Reservation<-BookableResource: a confirmed reservation can only check in
          while its BookableResource.status is IN_SERVICE; taking the resource OUT_OF_SERVICE blocks
          check-in. Distinct entity pair from the Loan<-Copy dependency.
        test_recipe:
          setup:
            - "CONFIRMED reservation on a ROOM whose resource is then set OUT_OF_SERVICE; clock at start time."
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "ResDep", reservation_buffer_minutes: 0 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "ResDep Pat" }
              as: Librarian
              captures: { p_id: $.data.id }
            - call: "POST /library/resources"
              payload: { branch_id: "${br_id}", resource_kind: "ROOM", label: "Room OOS" }
              as: BranchManager
              captures: { rs_id: $.data.id, rs_v: $.data.version }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Librarian
            - call: "POST /library/reservations"
              payload: { resource_id: "${rs_id}", patron_id: "${p_id}", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z", expected_resource_version: "${rs_v}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { rv_id: $.data.id }
            - call: "POST /library/reservations/${rv_id}/confirm"
              payload: {}
              as: Librarian
            - call: "POST /library/resources/${rs_id}/set-service-status"
              payload: { status: "OUT_OF_SERVICE" }
              as: BranchManager
          trigger:
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T10:05:00Z" }
              as: Librarian
            - call: "POST /library/reservations/${rv_id}/checkin"
              payload: {}
              as: Librarian
              captures: { err: $.data.error_id }
          assert:
            - "Check-in returns 409 ERR_RESOURCE_NOT_AVAILABLE (BookableResource.status OUT_OF_SERVICE)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: room_exclusive_with_buffer_overlap
        grounds:
          - calculations.reservation_overlap_room
          - entities.Branch.fields.reservation_buffer_minutes
          - validations[priority=9]
          - errors[ERR_RESERVATION_CONFLICT]
        distinguishing_aspect: |
          ROOM interval semantics: exclusive half-open windows EXPANDED by reservation_buffer_minutes
          on the end side, so a booking starting within the 15-minute cleanup gap after a prior
          booking's end is rejected even though the raw windows do not overlap. Distinct interval
          arithmetic (buffer-expanded exclusion) and distinct resource entity from the COMPUTER
          aggregate-capacity rule.
        test_recipe:
          setup:
            - "ROOM resource, branch reservation_buffer_minutes=15. One booking 10:00-11:00; a second booking 11:10-12:00 sits inside the 15-min buffer."
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "Buf", reservation_buffer_minutes: 15 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Buf Pat A" }
              as: Librarian
              captures: { pa_id: $.data.id }
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Buf Pat B" }
              as: Librarian
              captures: { pb_id: $.data.id }
            - call: "POST /library/resources"
              payload: { branch_id: "${br_id}", resource_kind: "ROOM", label: "Buffer Room" }
              as: BranchManager
              captures: { rs_id: $.data.id, rs_v: $.data.version }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Librarian
            - call: "POST /library/reservations"
              payload: { resource_id: "${rs_id}", patron_id: "${pa_id}", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z", expected_resource_version: "${rs_v}" }
              as: Patron
              as_user_id: "${pa_id}"
            - call: "GET /library/resources/${rs_id}"
              payload: {}
              as: Librarian
              captures: { rs_v2: $.data.version }
          trigger:
            - call: "POST /library/reservations"
              payload: { resource_id: "${rs_id}", patron_id: "${pb_id}", start_at: "2026-06-01T11:10:00Z", end_at: "2026-06-01T12:00:00Z", expected_resource_version: "${rs_v2}" }
              as: Patron
              as_user_id: "${pb_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Second booking 11:10-12:00 returns 409 ERR_RESERVATION_CONFLICT (starts 10 min after prior end, inside the 15-min buffer)"

      - name: computer_aggregate_capacity_overlap
        grounds:
          - calculations.reservation_overlap_computer
          - entities.BookableResource.fields.capacity
          - validations[priority=9]
          - errors[ERR_RESERVATION_CONFLICT]
        distinguishing_aspect: |
          COMPUTER interval semantics: aggregate capacity with NO buffer — overlapping bookings are
          permitted up to capacity=2; the third concurrent booking over the same window is rejected.
          Distinct interval arithmetic (peak-concurrency vs capacity, no buffer) and distinct resource
          entity-kind from the ROOM exclusive-with-buffer rule.
        test_recipe:
          setup:
            - "COMPUTER resource capacity=2. Two overlapping bookings 10:00-11:00 already active; a third overlapping booking is attempted."
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "Comp" }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Comp Pat A" }
              as: Librarian
              captures: { pa_id: $.data.id }
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Comp Pat B" }
              as: Librarian
              captures: { pb_id: $.data.id }
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Comp Pat C" }
              as: Librarian
              captures: { pc_id: $.data.id }
            - call: "POST /library/resources"
              payload: { branch_id: "${br_id}", resource_kind: "COMPUTER", label: "PC Bank", capacity: 2 }
              as: BranchManager
              captures: { rs_id: $.data.id, rs_v0: $.data.version }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Librarian
            - call: "POST /library/reservations"
              payload: { resource_id: "${rs_id}", patron_id: "${pa_id}", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z", expected_resource_version: "${rs_v0}" }
              as: Patron
              as_user_id: "${pa_id}"
            - call: "GET /library/resources/${rs_id}"
              payload: {}
              as: Librarian
              captures: { rs_v1: $.data.version }
            - call: "POST /library/reservations"
              payload: { resource_id: "${rs_id}", patron_id: "${pb_id}", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z", expected_resource_version: "${rs_v1}" }
              as: Patron
              as_user_id: "${pb_id}"
            - call: "GET /library/resources/${rs_id}"
              payload: {}
              as: Librarian
              captures: { rs_v2: $.data.version }
          trigger:
            - call: "POST /library/reservations"
              payload: { resource_id: "${rs_id}", patron_id: "${pc_id}", start_at: "2026-06-01T10:30:00Z", end_at: "2026-06-01T10:45:00Z", expected_resource_version: "${rs_v2}" }
              as: Patron
              as_user_id: "${pc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Third overlapping booking returns 409 ERR_RESERVATION_CONFLICT (peak concurrency 3 > capacity 2)"
            - "Two overlapping-window bookings on the same window both succeeded (capacity 2), proving no buffer/exclusion is applied to COMPUTER resources"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: physical_copy_count_conserved_across_checkout_return
        grounds:
          - state_machines.Loan.ACTIVE_to_RETURNED
          - calculations.pool_license_availability
          - entities.Title.fields.available_copy_count
          - entities.Title.fields.total_copy_count
        distinguishing_aspect: |
          Conserved quantity: total physical copies. Checkout (AVAILABLE->ON_LOAN) decrements
          available_copy_count by 1; the compensating return (ON_LOAN->AVAILABLE) increments it back,
          and total_copy_count is invariant throughout: total_copy_count == 1 before, during, and
          after. Distinct conserved quantity from the license-token invariant.
        test_recipe:
          setup:
            - "Title with exactly one AVAILABLE copy; one checkout then one return."
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "Inv1", loan_period_days: 7 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Librarian
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Inv Pat" }
              as: Librarian
              captures: { p_id: $.data.id }
            - call: "POST /library/titles"
              payload: { branch_id: "${br_id}", isbn: "9780000000014", title_text: "Inv Book" }
              as: Librarian
              captures: { t_id: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-IV", acquired_on: "2025-06-01T00:00:00Z" }
              as: Librarian
              captures: { c_id: $.data.id }
            - call: "POST /library/loans"
              payload: { copy_id: "${c_id}", patron_id: "${p_id}" }
              as: Librarian
              captures: { ln_id: $.data.id }
            - call: "GET /library/titles/${t_id}"
              payload: {}
              as: Librarian
              captures: { avail_mid: $.data.available_copy_count, total_mid: $.data.total_copy_count }
          trigger:
            - call: "POST /library/loans/${ln_id}/checkin"
              payload: {}
              as: Librarian
            - call: "GET /library/titles/${t_id}"
              payload: {}
              as: Librarian
              captures: { avail_after: $.data.available_copy_count, total_after: $.data.total_copy_count }
          assert:
            - "During loan: Title.${t_id}.available_copy_count == 0 and total_copy_count == 1"
            - "After return: Title.${t_id}.available_copy_count == 1 and total_copy_count == 1 (available restored, total conserved at 1)"

      - name: license_token_count_conserved_across_checkout_return
        grounds:
          - state_machines.EbookLoan.ACTIVE_to_RETURNED
          - calculations.pool_license_availability
          - entities.LicensePool.fields.loaned_licenses
          - entities.LicensePool.fields.available_licenses
        distinguishing_aspect: |
          Conserved quantity: license tokens. The invariant loaned_licenses + available_licenses ==
          total_licenses (3) holds before, during, and after an e-book checkout followed by its
          compensating return (loaned 1/avail 2 during -> loaned 0/avail 3 after). Distinct conserved
          quantity from the physical-copy invariant.
        test_recipe:
          setup:
            - "License pool total_licenses=3; one e-book checkout then its return."
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "Inv2", loan_period_days: 7 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Librarian
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Inv2 Pat" }
              as: Librarian
              captures: { p_id: $.data.id }
            - call: "POST /library/titles"
              payload: { branch_id: "${br_id}", isbn: "9780000000015", title_text: "Inv2 Book" }
              as: Librarian
              captures: { t_id: $.data.id }
            - call: "POST /library/license-pools"
              payload: { title_id: "${t_id}", total_licenses: 3, loan_term_days: 14 }
              as: Librarian
              captures: { pool_id: $.data.id }
            - call: "POST /library/ebook-loans"
              payload: { pool_id: "${pool_id}", patron_id: "${p_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { el_id: $.data.id }
            - call: "GET /library/license-pools/${pool_id}"
              payload: {}
              as: Librarian
              captures: { loaned_mid: $.data.loaned_licenses, avail_mid: $.data.available_licenses }
          trigger:
            - call: "POST /library/ebook-loans/${el_id}/return"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
            - call: "GET /library/license-pools/${pool_id}"
              payload: {}
              as: Librarian
              captures: { loaned_after: $.data.loaned_licenses, avail_after: $.data.available_licenses }
          assert:
            - "During loan: LicensePool.${pool_id}.loaned_licenses == 1 and available_licenses == 2 (sum 3 == total_licenses)"
            - "After return: LicensePool.${pool_id}.loaned_licenses == 0 and available_licenses == 3 (sum 3 == total_licenses, token conserved)"
