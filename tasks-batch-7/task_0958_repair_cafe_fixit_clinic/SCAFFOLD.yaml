# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Coordinator
    description: "Event organizer/operator; runs the café back office"
    identity: opaque
    exclusive_operations: ["event publish/open-intake/close-intake/begin-repairs/close/cancel/report", "station create/open/pause/resume/close", "fixer registration and deactivation", "skill management", "shift confirm", "item enqueue/assign/unassign/reopen", "outcome reject", "part stock create/adjust", "donation refund", "logical clock control"]
    shared_operations: ["shift signup/check-in/check-out/cancel (on behalf)", "outcome verify", "part reservations create/commit/release", "incident report", "waiver revoke", "item withdraw", "all reads"]
  - name: IntakeVolunteer
    description: "Front-desk volunteer handling visitors, waivers, item intake and donations"
    identity: opaque
    exclusive_operations: ["visitor registration", "waiver signing", "item intake", "donation create/receive/receipt"]
    shared_operations: ["item withdraw", "all reads"]
  - name: Fixer
    description: "Volunteer repairer; X-User-ID is a FixerProfile id"
    identity: "entity_backed:FixerProfile"
    exclusive_operations: ["triage creation", "start-repair and outcome recording on own assigned items"]
    shared_operations: ["own shift signup/check-in/check-out/cancel", "return-to-queue on own items", "part reservations create/commit/release", "outcome verify (never own)", "incident report", "all reads"]
  - name: SafetyOfficer
    description: "Safety officer; exclusive authority over incidents and suspensions"
    identity: opaque
    exclusive_operations: ["incident resolve/dismiss", "fixer suspend/reinstate"]
    shared_operations: ["incident report", "waiver revoke", "all reads"]
