- rule_id: compensating_invariant
  instances:
  - name: draft_void_conserves_roster_occupancy
    grounds:
    - state_machines.Player.EVALUATED_to_DRAFTED
    - state_machines.Player.DRAFTED_to_EVALUATED
    - entities.Team.fields.roster_count
    distinguishing_aspect: 'Conserved quantity = roster occupancy: invariant sum(Team.roster_count over division) ==

      count of Players with team_id != null in division. A draft pick (+1) paired with its void

      (-1) leaves this quantity at its pre-pick value (0 -> 1 -> 0), no drift.

      '
    test_recipe:
      setup:
      - League in DRAFT; 2 teams; 2 EVALUATED players; before any pick sum(roster_count)=0.
      setup_api_calls:
      - call: POST /leagues
        payload:
          name: Spring
