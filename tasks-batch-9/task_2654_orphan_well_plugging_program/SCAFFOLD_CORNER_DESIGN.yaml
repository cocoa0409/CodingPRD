      - name: reporting_the_same_production_month_twice_is_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority 66].ERR_DUPLICATE_PRODUCTION_MONTH
          - entities.ProductionRecord.fields.month
        distinguishing_aspect: |
          Uniqueness is per well and month, not per well, so an EARLIER month is still acceptable
          after the duplicate is refused - and accepting it must not walk last_production_month
          backwards, because that field only advances.
        test_recipe:
          setup:
            - "one Well with no production records; logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Wind River Petroleum", region_code: "WY", financial_assurance_tier: "BLANKET", bond_amount_cents: 250000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-013-32001", operator_id: "${op_id}", spud_year: 1961, total_depth_ft: 2500, casing_strings: 1, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /wells/${w_id}/production-records"
              payload: { month: "2026-05", oil_bbl: 10, gas_mcf: 0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { pr_id: $.data.id }
            - call: "POST /wells/${w_id}/production-records"
              payload: { month: "2026-05", oil_bbl: 999, gas_mcf: 0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err: $.data.error_id }
            - call: "POST /wells/${w_id}/production-records"
              payload: { month: "2026-04", oil_bbl: 5, gas_mcf: 0 }
              as: Operator
              as_user_id: "${op_id}"
          assert:
            - "the first call returns HTTP 201 with data.month == 2026-05 and data.boe == 10"
            - "the second call returns HTTP 422 with error_id ERR_DUPLICATE_PRODUCTION_MONTH"
            - "after the rejection Well.${w_id}.cumulative_boe_60mo == 10.00, NOT 1009.00: the duplicate was not appended"
            - "GET /wells/${w_id}/production-records returns total_count == 2 at the end"
            - "the third call returns HTTP 201 with data.month == 2026-04"
            - "Well.${w_id}.last_production_month == 2026-05 after the third call, NOT 2026-04: the field only advances"
            - "Well.${w_id}.cumulative_boe_60mo == 15.00 and idle_months == 3"

      - name: responsive_evaluation_needs_the_minimum_score_but_nonresponsive_does_not
        claim_type: Conditional validation
        grounds:
          - validations[priority 68].ERR_TECHNICAL_SCORE_BELOW_MINIMUM
        distinguishing_aspect: |
          The rule is scoped to outcome RESPONSIVE only, so the same 69-score bid that cannot be found
          responsive can still be recorded NONRESPONSIVE; and the comparison is strictly-below, so a
          score of exactly 70 against a minimum of 70 is responsive.
        test_recipe:
          setup:
            - "one EVALUATING solicitation with min_technical_score 70 and two SUBMITTED bids scoring 69 and 70"
          setup_api_calls:
            - call: "POST /contractors"
              payload: { name: "Bighorn Plugging", license_number: "P-B0001", bond_amount_cents: 2500000, performance_score: 69 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { c69_id: $.data.id }
            - call: "POST /contractors"
              payload: { name: "Teton Cementing", license_number: "P-B0002", bond_amount_cents: 2500000, performance_score: 70 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { c70_id: $.data.id }
            - call: "POST /solicitations"
              payload: { region_code: "WY", scope_description: "district 8 orphan well plugging", bid_due_at: "2026-08-20T00:00:00Z", ceiling_cents: 20000000, min_technical_score: 70 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { sol_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/lifecycle"
              payload: { action: "OPEN" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
            - call: "POST /solicitations/${sol_id}/bids"
              payload: { contractor_id: "${c69_id}", cement_per_sack_cents: 4000, rig_day_rate_cents: 800000, casing_per_ft_cents: 1200, mobilization_fee_cents: 2400000, technical_score: 69 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { b69_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/bids"
              payload: { contractor_id: "${c70_id}", cement_per_sack_cents: 4100, rig_day_rate_cents: 810000, casing_per_ft_cents: 1250, mobilization_fee_cents: 2450000, technical_score: 70 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { b70_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/lifecycle"
              payload: { action: "CLOSE" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
          trigger:
            - call: "POST /bids/${b69_id}/evaluation"
              payload: { outcome: "RESPONSIVE" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { err: $.data.error_id }
            - call: "POST /bids/${b69_id}/evaluation"
              payload: { outcome: "NONRESPONSIVE", reason: "technical score 69 below the 70 minimum" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
            - call: "POST /bids/${b70_id}/evaluation"
              payload: { outcome: "RESPONSIVE" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
          assert:
            - "the first call returns HTTP 422 with error_id ERR_TECHNICAL_SCORE_BELOW_MINIMUM"
            - "after the rejection Bid.${b69_id}.status == SUBMITTED and nonresponsive_reason == null"
            - "the second call returns HTTP 200 with data.status == NONRESPONSIVE: the rule does not apply to this outcome"
            - "the third call returns HTTP 200 with data.status == RESPONSIVE (70 is not strictly below 70)"
            - "Bid.${b69_id}.price_score == null and Bid.${b70_id}.price_score == null: scoring happens only at award"

      - name: awarding_with_no_responsive_bid_is_rejected_until_one_is_reevaluated
        claim_type: Aggregate validation
        grounds:
          - validations[priority 70].ERR_NO_RESPONSIVE_BIDS
          - calculations.bid_composite_score.formula
        distinguishing_aspect: |
          The solicitation has a bid, so the pool is non-empty and only the RESPONSIVE cardinality is
          zero; the award endpoint must refuse before creating any contract. Flipping that single bid
          to RESPONSIVE with no other change then makes the same award call succeed, which proves the
          count is evaluated at call time rather than cached at CLOSE.
        test_recipe:
          setup:
            - "one EVALUATING solicitation whose only bid has been marked NONRESPONSIVE"
          setup_api_calls:
            - call: "POST /contractors"
              payload: { name: "Bighorn Plugging", license_number: "P-C0001", bond_amount_cents: 2500000, performance_score: 89 }
