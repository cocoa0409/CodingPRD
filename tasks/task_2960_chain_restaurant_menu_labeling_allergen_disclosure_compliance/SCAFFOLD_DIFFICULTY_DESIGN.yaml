# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: chain-menu-labeling
# Sibling of SCAFFOLD.yaml. Every `grounds:` reference resolves into that file's
# §1.1-§1.7; every call in `setup_api_calls:` / `trigger:` resolves to a §1.5
# endpoint with a role listed there; every `${var}` is bound by an earlier
# `captures:` in the same instance; every numeric assert is a literal computed
# from the §1.3 formulas and their constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 - Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: coverage_basis_divergence_operating_only_vs_registered_all
        grounds:
          - calculations.covered_establishment_determination
          - calculations.covered_establishment_determination.variants.OPERATING_ONLY
          - calculations.covered_establishment_determination.variants.REGISTERED_ALL
          - entities.Brand.coverage_status
          - entities.Brand.coverage_reason
          - entities.Brand.counted_unit_count
          - endpoints[POST /brands/{id}/coverage-determinations]
          - state_machines.Brand.compliance_posture.transitions.EXEMPT_to_COMPLIANT
        distinguishing_aspect: "Dual variant on the Brand coverage domain (unit-count eligibility): from one identical fleet of 19 OPERATING + 1 TEMPORARILY_CLOSED units, OPERATING_ONLY counts 19 and yields NOT_COVERED/BELOW_UNIT_THRESHOLD while REGISTERED_ALL counts 20 and yields COVERED/COVERED_BY_UNIT_COUNT - no money or penalty field participates."
        test_recipe:
          setup:
            - "One Jurisdiction (code CA-VAR, VARIANCE_ALLOWED, extra_requirement NONE, FEDERAL_ALIGNED)."
            - "One Brand with exactly one non-exempt MenuItem (item_class STANDARD), so standard_item_count == 1 and the zero-item branch does not fire."
            - "The brand owns exactly 20 Establishment rows with operates_under_brand_name == true: 19 with unit_status OPERATING and 1 with unit_status TEMPORARILY_CLOSED."
            - "The last automatic determination (on the OPERATING_ONLY basis, fired by the status change) left Brand.coverage_status == NOT_COVERED with coverage_reason BELOW_UNIT_THRESHOLD and compliance_posture EXEMPT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "CA-VAR", name: "California", preemption_mode: "VARIANCE_ALLOWED", extra_requirement: "NONE", enforcement_tier: "FEDERAL_ALIGNED" }
              as: PlatformAdmin
              captures: { juris_ca: $.data.id }
            - call: "POST /brands"
              payload: { legal_name: "Golden Grill Holdings LLC", doing_business_as: "Golden Grill" }
              as: PlatformAdmin
              captures: { brand: $.data.id }
            - call: "POST /menu-items"
              payload: { brand_id: "${brand}", name: "Grill Sandwich", item_class: "STANDARD", variable_type: "NONE", first_offered_on: "2026-01-05" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { item_sandwich: $.data.id }
            - call: "POST /brands/${brand}/establishment-batches"
              payload: { jurisdiction_id: "${juris_ca}", unit_count: 19, unit_status: "OPERATING", operates_under_brand_name: true, unit_label_prefix: "CA-OP" }
              as: PlatformAdmin
              captures: { batch_first_est: $.data.first_created_establishment_id }
            - call: "POST /establishments"
              payload: { brand_id: "${brand}", jurisdiction_id: "${juris_ca}", unit_label: "CA-TMP-0001", unit_status: "OPERATING", operates_under_brand_name: true }
              as: PlatformAdmin
              captures: { est_tmp: $.data.id }
            - call: "POST /establishments/${est_tmp}/status-changes"
              payload: { new_unit_status: "TEMPORARILY_CLOSED", effective_note: "Seasonal closure of the mall unit" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
          trigger:
            - call: "POST /brands/${brand}/coverage-determinations"
              payload: { basis: "OPERATING_ONLY" }
              as: PlatformAdmin
              captures: { operating_units: $.data.counted_unit_count, operating_status: $.data.coverage_status }
            - call: "POST /brands/${brand}/coverage-determinations"
              payload: { basis: "REGISTERED_ALL" }
              as: PlatformAdmin
              captures: { registered_units: $.data.counted_unit_count, registered_status: $.data.coverage_status }
          assert:
            - "trigger[0] response data.counted_unit_count == 19"
            - "trigger[0] response data.standard_item_count == 1"
            - "trigger[0] response data.coverage_status == NOT_COVERED"
            - "trigger[0] response data.coverage_reason == BELOW_UNIT_THRESHOLD"
            - "trigger[1] response data.counted_unit_count == 20"
            - "trigger[1] response data.coverage_status == COVERED"
            - "trigger[1] response data.coverage_reason == COVERED_BY_UNIT_COUNT"
            - "trigger[1] response data.basis == REGISTERED_ALL and data.persisted == true"
            - "Brand.${brand}.counted_unit_count == 20 after trigger[1]"
            - "Brand.${brand}.coverage_status == COVERED after trigger[1]"
            - "Brand.${brand}.compliance_posture == COMPLIANT after trigger[1]"
            - "trigger[0] response data.counted_unit_count != trigger[1] response data.counted_unit_count on identical Establishment rows"

      - name: penalty_basis_divergence_per_board_vs_per_establishment
        grounds:
          - calculations.enforcement_penalty_assessment
          - calculations.enforcement_penalty_assessment.variants.PER_BOARD
          - calculations.enforcement_penalty_assessment.variants.PER_ESTABLISHMENT
          - entities.EnforcementAction.violation_unit_count
          - entities.EnforcementAction.base_penalty_cents
          - entities.EnforcementAction.admin_fee_cents
          - entities.EnforcementAction.penalty_total_cents
          - entities.Establishment.outstanding_penalty_cents
          - entities.Jurisdiction.assessed_penalty_cents_total
          - state_machines.EnforcementAction.transitions.ESCALATED_to_PENALTY_ASSESSED
          - state_machines.EnforcementAction.transitions.PENALTY_ASSESSED_to_RESPONSE_SUBMITTED
        distinguishing_aspect: "Dual variant on the EnforcementAction money domain: with three non-current published boards on one establishment in an ENHANCED jurisdiction, PER_BOARD yields base 225000 / fee 18000 / total 243000 (fee tier 2) while PER_ESTABLISHMENT on the very same rows yields base 75000 / fee 3750 / total 78750 (fee tier 1) - a different entity domain and a different metric from the Brand unit-count instance."
        test_recipe:
          setup:
            - "Jurisdiction NY-ENH with enforcement_tier ENHANCED, extra_requirement NONE (reprint_grace_days 30) and required_succinct_statement_variant FEDERAL_DEFAULT."
            - "Brand with 20 OPERATING units, one STANDARD MenuItem whose Recipe v1 declares 530 Cal, and a PUBLISHED DisclosurePacket."
            - "Three PUBLISHED MenuBoards of the same establishment (PRIMARY_MENU_BOARD, DRIVE_THRU_BOARD, PRINTED_MENU), each listing that item."
            - "Recipe v2 (mayonnaise 20 g -> 45 g) is certified, declaring 700 Cal, so all three boards sit at calorie_compliance_status REPRINT_REQUIRED."
            - "An EnforcementAction on that establishment has reached ESCALATED after one response, one REQUEST_INFO round and a second response."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "NY-ENH", name: "New York City", preemption_mode: "VARIANCE_ALLOWED", extra_requirement: "NONE", enforcement_tier: "ENHANCED", sodium_warning_threshold_mg: 2300, required_succinct_statement_variant: "FEDERAL_DEFAULT" }
              as: PlatformAdmin
              captures: { juris_ny: $.data.id }
            - call: "POST /brands"
              payload: { legal_name: "Golden Grill Holdings LLC", doing_business_as: "Golden Grill" }
              as: PlatformAdmin
              captures: { brand: $.data.id }
            - call: "POST /establishments"
              payload: { brand_id: "${brand}", jurisdiction_id: "${juris_ny}", unit_label: "NY-0001", unit_status: "OPERATING", operates_under_brand_name: true }
              as: PlatformAdmin
              captures: { est: $.data.id }
            - call: "POST /brands/${brand}/establishment-batches"
              payload: { jurisdiction_id: "${juris_ny}", unit_count: 19, unit_status: "OPERATING", operates_under_brand_name: true, unit_label_prefix: "NY-B" }
              as: PlatformAdmin
            - call: "POST /menu-items"
              payload: { brand_id: "${brand}", name: "Grill Sandwich", item_class: "STANDARD", variable_type: "NONE", first_offered_on: "2026-01-05" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { item: $.data.id, item_v1: $.data.version }
            - call: "POST /menu-items/${item}/recipes"
              payload: { expected_menu_item_version: "${item_v1}", change_note: "Initial specification" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { r1: $.data.id }
            - call: "POST /recipes/${r1}/components"
              payload: { component_name: "Grilled chicken breast", role: "BASE", grams: 140, calories_per_100g: 140, sodium_mg_per_100g: 240, added_sugar_g_per_100g: 0, allergen_group: "NONE", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r1}/components"
              payload: { component_name: "Brioche bun", role: "BASE", grams: 60, calories_per_100g: 330, sodium_mg_per_100g: 148, added_sugar_g_per_100g: 4, allergen_group: "WHEAT", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r1}/components"
              payload: { component_name: "Herb mayonnaise", role: "BASE", grams: 20, calories_per_100g: 680, sodium_mg_per_100g: 620, added_sugar_g_per_100g: 1, allergen_group: "EGG", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r1}/submit-for-analysis"
              payload: { method: "DATABASE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { a1: $.data.id }
            - call: "POST /nutrition-analyses/${a1}/decision"
              payload: { decision: "CERTIFY", decision_note: "Database values verified against supplier specs" }
              as: NutritionAnalyst
              as_user_id: "analyst-2"
            - call: "GET /brands/${brand}"
              payload: {}
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { brand_v: $.data.version }
            - call: "POST /brands/${brand}/disclosure-packets"
              payload: { expected_brand_version: "${brand_v}", cross_contact_statement: "", written_info_channels: ["IN_STORE_BINDER", "WEBSITE"] }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { packet: $.data.id }
            - call: "POST /disclosure-packets/${packet}/publish"
              payload: {}
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
            - call: "POST /menu-boards"
              payload: { establishment_id: "${est}", board_type: "PRIMARY_MENU_BOARD", succinct_statement_variant: "FEDERAL_DEFAULT" }
              as: MenuboardPublisher
              as_user_id: "${est}"
              captures: { b1: $.data.id }
            - call: "POST /menu-boards/${b1}/listings"
              payload: { menu_item_id: "${item}", sodium_warning_icon: false }
              as: MenuboardPublisher
              as_user_id: "${est}"
            - call: "POST /menu-boards/${b1}/publish"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: MenuboardPublisher
              as_user_id: "${est}"
            - call: "POST /menu-boards"
              payload: { establishment_id: "${est}", board_type: "DRIVE_THRU_BOARD", succinct_statement_variant: "FEDERAL_DEFAULT" }
              as: MenuboardPublisher
              as_user_id: "${est}"
              captures: { b2: $.data.id }
            - call: "POST /menu-boards/${b2}/listings"
              payload: { menu_item_id: "${item}", sodium_warning_icon: false }
              as: MenuboardPublisher
              as_user_id: "${est}"
            - call: "POST /menu-boards/${b2}/publish"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: MenuboardPublisher
              as_user_id: "${est}"
            - call: "POST /menu-boards"
              payload: { establishment_id: "${est}", board_type: "PRINTED_MENU", succinct_statement_variant: "FEDERAL_DEFAULT" }
              as: MenuboardPublisher
              as_user_id: "${est}"
              captures: { b3: $.data.id }
            - call: "POST /menu-boards/${b3}/listings"
              payload: { menu_item_id: "${item}", sodium_warning_icon: false }
              as: MenuboardPublisher
              as_user_id: "${est}"
            - call: "POST /menu-boards/${b3}/publish"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: MenuboardPublisher
              as_user_id: "${est}"
            - call: "GET /menu-items/${item}"
              payload: {}
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { item_v2: $.data.version }
            - call: "POST /menu-items/${item}/recipes"
              payload: { expected_menu_item_version: "${item_v2}", change_note: "Mayonnaise portion increased to 45 g" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { r2: $.data.id }
            - call: "POST /recipes/${r2}/components"
              payload: { component_name: "Grilled chicken breast", role: "BASE", grams: 140, calories_per_100g: 140, sodium_mg_per_100g: 240, added_sugar_g_per_100g: 0, allergen_group: "NONE", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r2}/components"
              payload: { component_name: "Brioche bun", role: "BASE", grams: 60, calories_per_100g: 330, sodium_mg_per_100g: 148, added_sugar_g_per_100g: 4, allergen_group: "WHEAT", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r2}/components"
              payload: { component_name: "Herb mayonnaise", role: "BASE", grams: 45, calories_per_100g: 680, sodium_mg_per_100g: 620, added_sugar_g_per_100g: 1, allergen_group: "EGG", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r2}/submit-for-analysis"
              payload: { method: "DATABASE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { a2: $.data.id }
            - call: "POST /nutrition-analyses/${a2}/decision"
              payload: { decision: "CERTIFY", decision_note: "Revised portion certified" }
              as: NutritionAnalyst
              as_user_id: "analyst-2"
            - call: "POST /enforcement-actions"
              payload: { establishment_id: "${est}", citation_code: "CALORIES_NOT_DECLARED", inspection_note: "Board calories do not match the certified declaration" }
              as: StateRegulator
              as_user_id: "${juris_ny}"
              captures: { action: $.data.id }
            - call: "POST /enforcement-actions/${action}/responses"
              payload: { response_type: "DISPUTED", response_note: "Declaration under review by counsel" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
            - call: "POST /enforcement-actions/${action}/regulator-actions"
              payload: { action_type: "REQUEST_INFO", action_note: "Provide the certified nutrition analysis" }
              as: StateRegulator
              as_user_id: "${juris_ny}"
            - call: "POST /enforcement-actions/${action}/responses"
              payload: { response_type: "DISPUTED", response_note: "Analysis attached" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
            - call: "POST /enforcement-actions/${action}/regulator-actions"
              payload: { action_type: "ESCALATE", action_note: "Escalating for penalty review" }
              as: StateRegulator
              as_user_id: "${juris_ny}"
          trigger:
            - call: "POST /enforcement-actions/${action}/regulator-actions"
              payload: { action_type: "ASSESS_PENALTY", penalty_basis: "PER_BOARD", action_note: "Assessed per non-current board" }
              as: StateRegulator
              as_user_id: "${juris_ny}"
            - call: "POST /enforcement-actions/${action}/regulator-actions"
              payload: { action_type: "RESCIND_PENALTY", action_note: "Basis re-elected" }
              as: StateRegulator
              as_user_id: "${juris_ny}"
            - call: "POST /enforcement-actions/${action}/regulator-actions"
              payload: { action_type: "ESCALATE", action_note: "Re-escalated for reassessment" }
              as: StateRegulator
              as_user_id: "${juris_ny}"
            - call: "POST /enforcement-actions/${action}/regulator-actions"
              payload: { action_type: "ASSESS_PENALTY", penalty_basis: "PER_ESTABLISHMENT", action_note: "Assessed per establishment" }
              as: StateRegulator
              as_user_id: "${juris_ny}"
          assert:
            - "trigger[0] response data.violation_unit_count == 3"
            - "trigger[0] response data.base_penalty_cents == 225000"
            - "trigger[0] response data.admin_fee_cents == 18000"
            - "trigger[0] response data.penalty_total_cents == 243000"
            - "Establishment.${est}.outstanding_penalty_cents == 243000 after trigger[0]"
            - "Jurisdiction.${juris_ny}.assessed_penalty_cents_total == 243000 after trigger[0]"
            - "trigger[1] response data.penalty_total_cents == 0 and data.status == RESPONSE_SUBMITTED"
            - "Establishment.${est}.outstanding_penalty_cents == 0 after trigger[1]"
            - "Jurisdiction.${juris_ny}.assessed_penalty_cents_total == 0 after trigger[1]"
            - "trigger[3] response data.violation_unit_count == 1"
            - "trigger[3] response data.base_penalty_cents == 75000"
            - "trigger[3] response data.admin_fee_cents == 3750"
            - "trigger[3] response data.penalty_total_cents == 78750"
            - "Establishment.${est}.outstanding_penalty_cents == 78750 after trigger[3]"
            - "Jurisdiction.${juris_ny}.assessed_penalty_cents_total == 78750 after trigger[3]"
            - "MenuBoard.${b1}.calorie_compliance_status == REPRINT_REQUIRED and MenuBoard.${b1}.reprint_deadline == 2026-08-31T00:00:00Z"

  # ===========================================================================
  # Rule 2 - Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: base_declaration_sums_at_full_precision_then_rounds_once
        grounds:
          - calculations.base_item_calorie_declaration
          - calculations.base_item_calorie_declaration.constants.DECLARE_ZERO_CEILING
          - calculations.declared_sodium_rounding
          - calculations.declared_sodium_rounding.constants.SODIUM_ZERO_CEILING
          - entities.Recipe.computed_base_calories
          - entities.Recipe.computed_declared_max
          - entities.Recipe.computed_sodium_mg
          - entities.MenuItem.declared_calorie_max
        distinguishing_aspect: "Mode (b) - nested rounding where the order is outcome-changing: two BASE components of 2.60 Cal each must be summed at full precision (5.20) and declared once (5), whereas declaring each component first would give 0 + 0 = 0; the same order rule on the sodium metric keeps 1.20 + 1.20 = 2.40 below SODIUM_ZERO_CEILING and declares 0."
        test_recipe:
          setup:
            - "One Brand (no establishments needed; coverage is irrelevant to recipe arithmetic)."
            - "One STANDARD MenuItem 'Herb Garnish Plate' with variable_type NONE."
            - "Its Recipe v1 holds exactly two BASE components, each 2 g at 130 Cal/100 g and 60 mg sodium/100 g."
            - "The recipe is submitted by analyst-1 and certified by analyst-2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brands"
              payload: { legal_name: "Golden Grill Holdings LLC", doing_business_as: "Golden Grill" }
              as: PlatformAdmin
              captures: { brand: $.data.id }
            - call: "POST /menu-items"
              payload: { brand_id: "${brand}", name: "Herb Garnish Plate", item_class: "STANDARD", variable_type: "NONE", first_offered_on: "2026-02-01" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { item: $.data.id, item_v1: $.data.version }
            - call: "POST /menu-items/${item}/recipes"
              payload: { expected_menu_item_version: "${item_v1}", change_note: "Initial specification of the two-herb garnish" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { r1: $.data.id }
            - call: "POST /recipes/${r1}/components"
              payload: { component_name: "Chopped parsley", role: "BASE", grams: 2, calories_per_100g: 130, sodium_mg_per_100g: 60, added_sugar_g_per_100g: 0, allergen_group: "NONE", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r1}/components"
              payload: { component_name: "Chopped chives", role: "BASE", grams: 2, calories_per_100g: 130, sodium_mg_per_100g: 60, added_sugar_g_per_100g: 0, allergen_group: "NONE", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r1}/submit-for-analysis"
              payload: { method: "LAB_ANALYSIS" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /nutrition-analyses/${a1}/decision"
              payload: { decision: "CERTIFY", decision_note: "Lab report 2026-0731 accepted" }
              as: NutritionAnalyst
              as_user_id: "analyst-2"
          assert:
            - "Recipe.${r1}.component_count == 2"
            - "Recipe.${r1}.computed_base_calories == 5.20"
            - "Recipe.${r1}.computed_declared_min == 5"
            - "Recipe.${r1}.computed_declared_max == 5"
            - "Recipe.${r1}.computed_sodium_mg == 0"
            - "MenuItem.${item}.declared_calorie_min == 5"
            - "MenuItem.${item}.declared_calorie_max == 5"
            - "MenuItem.${item}.declared_sodium_mg == 0"
            - "MenuItem.${item}.labeling_status == DECLARED"
            - "Recipe.${r1}.computed_declared_max != 0 - declaring each 2.60 component before summing would yield 0"

      - name: variable_range_nested_min_max_over_choice_groups
        grounds:
          - calculations.variable_item_calorie_range
          - calculations.variable_item_calorie_range.variants.TOPPING_BASED
          - calculations.variable_item_calorie_range.variants.COMBINATION_MEAL
          - entities.RecipeComponent.selection_mode
          - entities.RecipeComponent.selection_limit
          - entities.RecipeComponent.choice_group
          - entities.MenuItem.declared_calorie_min
          - entities.MenuItem.declared_calorie_max
          - entities.MenuBoardListing.display_calorie_text
        distinguishing_aspect: "Mode (a) - one formula over five-plus inputs with non-linear interaction: an UP_TO_N group contributes the sum of its two largest members (nested max-selection over three candidates) while two EXACTLY_ONE groups each contribute a nested min and max, so the TOPPING_BASED burger declares 570-780 Cal and the COMBINATION_MEAL kids box declares 320-700 Cal; no rounding-order question arises because declare() is applied once to raw_min and once to raw_max."
        test_recipe:
          setup:
            - "One Brand with two variable MenuItems: 'Signature Burger' (variable_type TOPPING_BASED) and 'Kids Combo Box' (variable_type COMBINATION_MEAL)."
            - "The burger recipe has BASE patty 125 g at 300 Cal/100 g and BASE bun 56 g at 350 Cal/100 g, plus one CHOICE group TOPPINGS with selection_mode UP_TO_N and selection_limit 2 holding bacon (108.00), cheddar (100.00) and avocado (48.00)."
            - "The kids box recipe has BASE nuggets 100 g at 290 Cal/100 g, one EXACTLY_ONE group SIDE holding fries (265.20) and apple slices (31.20), and one EXACTLY_ONE group DRINK holding soda (143.50), milk (99.12) and water (0.00)."
            - "Both recipes are submitted by analyst-1; the burger is certified before the trigger and the kids box is certified by the trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brands"
              payload: { legal_name: "Golden Grill Holdings LLC", doing_business_as: "Golden Grill" }
              as: PlatformAdmin
              captures: { brand: $.data.id }
            - call: "POST /menu-items"
