            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
            - *c_bp
            - *c_bp_open
            - *c_bal_n
            - *c_bal_s
            - *c_bal_e
            - *c_bal_w
            - *c_bp_close
            - *c_conf_read
            - *c_res12
            - *c_p26
            - *c_p26_open
            - *c_p26_cb
            - *c_p26_read
            - *c_r26
            - &c_ar26
              call: "POST /audit-reports"
              payload: { conference_id: "${conf_id}", distribution_run_id: "${r26_id}", fiscal_year: 2026, opinion: "UNQUALIFIED", note: "FY2026 attestation" }
              as: Auditor
              as_user_id: "u_aud_1"
              captures: { ar26_id: $.data.id }
            - *c_mc
            - *c_ma_admit
