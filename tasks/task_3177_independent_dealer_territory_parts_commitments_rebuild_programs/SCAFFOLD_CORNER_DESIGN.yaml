# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3177_independent_dealer_territory_parts_commitments_rebuild_programs
#
# Breadth probe: every testable claim the scaffold's §1.1–§1.7 surface declares
# that §1.8 does not already exercise. Corners that §1.8 already covers appear as
# `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: dealer_create_returns_every_declared_field_and_starts_pending
        claim_type: Creation
        grounds:
          - entities.Dealer
          - endpoints.POST_/dealer-network/dealers
        distinguishing_aspect: "A dealer created with only legal_name, home_state_code and territory_code comes back 201 with status PENDING_AGREEMENT, version 1, and system-generated id, created_at and updated_at; status is never client-supplied."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &n_clock
              call: "POST /dealer-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: DealerNetworkManager
          trigger:
            - call: "POST /dealer-network/dealers"
              payload: { legal_name: "High Plains Machinery Co", home_state_code: "NE", territory_code: "T-410" }
              as: DealerNetworkManager
              captures: { dealer_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Dealer.${dealer_id}.legal_name == \"High Plains Machinery Co\" and home_state_code == \"NE\""
            - "Dealer.${dealer_id}.status == PENDING_AGREEMENT"
            - "Dealer.${dealer_id}.version == 1"
            - "Dealer.${dealer_id}.certified_family_count == 0 and trusted_commitment_count == 0 and open_backorder_units == 0"
            - "the response data carries non-null id, created_at and updated_at"

      - name: dealer_get_returns_the_stored_configuration_unchanged
        claim_type: Retrieval
        grounds:
          - entities.Dealer
          - endpoints.GET_/dealer-network/dealers/{id}
        distinguishing_aspect: "Every dealer configuration field round-trips through GET exactly as posted, and the three derived counters read back as the values the create response reported rather than as recomputed deltas."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One dealer T-410."
          setup_api_calls:
            - *n_clock
            - &n_dealer
              call: "POST /dealer-network/dealers"
              payload: { legal_name: "High Plains Machinery Co", home_state_code: "NE", territory_code: "T-410" }
              as: DealerNetworkManager
              captures: { d_id: $.data.id, d_v: $.data.version }
          trigger:
            - call: "GET /dealer-network/dealers/${d_id}"
              payload: {}
              as: DealerPerformanceReviewer
          assert:
            - "the response status is 200 and response_type is object"
            - "Dealer.${d_id}.territory_code == \"T-410\" and home_state_code == \"NE\""
            - "Dealer.${d_id}.status == PENDING_AGREEMENT and version == 1"
            - "Dealer.${d_id}.market_share_pct == 0.0 because no review has been evaluated"

      - name: dealers_list_paginates_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/dealer-network/dealers
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three dealers on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the remaining row with has_more false; total_count counts the whole filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Three dealers in three territories."
          setup_api_calls:
            - *n_clock
            - *n_dealer
            - call: "POST /dealer-network/dealers"
              payload: { legal_name: "Coastal Lift Systems", home_state_code: "CA", territory_code: "T-411" }
              as: DealerNetworkManager
            - call: "POST /dealer-network/dealers"
              payload: { legal_name: "Delta Compaction Supply", home_state_code: "LA", territory_code: "T-412" }
              as: DealerNetworkManager
          trigger:
            - call: "GET /dealer-network/dealers"
              payload: { limit: 2, offset: 0 }
              as: DealerNetworkManager
          assert:
            - "the response status is 200 and response_type is array"
            - "the response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /dealer-network/dealers?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /dealer-network/dealers?home_state_code=CA returns exactly 1 row, the Coastal Lift Systems dealer"
            - "GET /dealer-network/dealers with no query parameters returns 3 rows with limit defaulting to 10 and offset to 0"

      - name: dealer_get_with_an_unknown_id_returns_dealer_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/dealer-network/dealers/{id}
          - errors.ERR_DEALER_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unallocated id on a path segment produces the entity-specific 404 ERR_DEALER_NOT_FOUND, not a generic error and not a 400."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. No dealer has been created."
          setup_api_calls:
            - *n_clock
          trigger:
            - call: "GET /dealer-network/dealers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: DealerNetworkManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and err == ERR_DEALER_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: dealer_create_missing_territory_code_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Dealer.fields.territory_code
          - errors.ERR_INVALID_REQUEST
          - validations[priority=4]
        distinguishing_aspect: "territory_code is a required input with no default, so omitting it is a 400 ERR_INVALID_REQUEST from the required-field check rather than a created dealer with a null territory."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *n_clock
          trigger:
            - call: "POST /dealer-network/dealers"
              payload: { legal_name: "Unassigned Machinery Co", home_state_code: "KS" }
              as: DealerNetworkManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST"
            - "GET /dealer-network/dealers returns 0 rows"

      - name: parts_order_batch_create_omitting_emergency_defaults_to_false
        claim_type: Defaults
        grounds:
          - entities.PartsOrderBatch.fields.emergency
          - endpoints.POST_/dealer-network/parts-order-batches
          - calculations.tier_weighted_machine_population
        distinguishing_aspect: "emergency declares a default of false, so omitting it stores false and the batch reserves min(requested_units, available_commitment_units) = 10 rather than the emergency cap of 5 * required_stocking_units."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The T-410 commitment is ORDER_READY with required_stocking_units_final 63."
          setup_api_calls:
            - *n_clock
            - *n_dealer
            - &n_agree
              call: "POST /dealer-network/dealer-agreements"
              payload: { dealer_id: "${d_id}", product_family: "EXCAVATION", territory_code: "T-410", exclusivity_level: "EXCLUSIVE", start_at: "2026-09-01T00:00:00Z", end_at: "2027-09-01T00:00:00Z", performance_plan_share_pct: 20, expected_dealer_version: "${d_v}" }
              as: DealerNetworkManager
              captures: { ag_id: $.data.id }
            - &n_cert1
              call: "POST /dealer-network/certification-records"
              payload: { dealer_id: "${d_id}", technician_name: "T-01", product_family: "EXCAVATION", credential_code: "DEALER_MASTER", certified_at: "2026-08-01T00:00:00Z" }
              as: PartsManager
            - &n_cert2
              call: "POST /dealer-network/certification-records"
              payload: { dealer_id: "${d_id}", technician_name: "T-02", product_family: "EXCAVATION", credential_code: "DEALER_MASTER", certified_at: "2026-08-01T00:00:00Z" }
              as: PartsManager
            - &n_read_dealer
              call: "GET /dealer-network/dealers/${d_id}"
              payload: {}
              as: DealerNetworkManager
              captures: { d_v2: $.data.version }
            - &n_commit
              call: "POST /dealer-network/parts-commitments"
              payload: { agreement_id: "${ag_id}", dealer_id: "${d_id}", product_family: "EXCAVATION", machine_population_units: 500, machine_population_slope: 1.0, planned_annual_units: 50000, emergency_stocking_target_pct: 50, emergency_fill_window_hours: 24, expected_dealer_version: "${d_v2}" }
              as: PartsManager
              captures: { cm_id: $.data.id }
            - &n_submit
              call: "POST /dealer-network/parts-commitments/${cm_id}/submit"
              payload: {}
              as: PartsManager
            - &n_submit_agree
              call: "POST /dealer-network/dealer-agreements/${ag_id}/submit"
              payload: {}
              as: DealerNetworkManager
            - &n_ready
              call: "POST /dealer-network/parts-commitments/${cm_id}/ready-for-orders"
              payload: {}
              as: PartsManager
          trigger:
            - call: "POST /dealer-network/parts-order-batches"
              payload: { commitment_id: "${cm_id}", product_family: "EXCAVATION", requested_units: 10, core_units: 0, core_return_required: false, requested_at: "2026-08-28T00:00:00Z" }
              as: PartsManager
              captures: { bt_id: $.data.id }
          assert:
            - "the response status is 201"
            - "PartsOrderBatch.${bt_id}.emergency == false"
            - "PartsOrderBatch.${bt_id}.reserved_units == 10"
            - "PartsOrderBatch.${bt_id}.status == OPEN"

      - name: certification_record_status_is_computed_on_read_and_never_stored
        claim_type: Computed Fields
        grounds:
          - entities.CertificationRecord.fields.status
          - entities.CertificationRecord.fields.recurrence_within_period
          - endpoints.GET_/dealer-network/certification-records/{id}
        distinguishing_aspect: "CertificationRecord.status is derived from the logical clock against certified_at plus twelve months on every read: ACTIVE strictly before that instant and EXPIRED once the clock reaches it, with the stored row and its version unchanged across both reads."
        test_recipe:
          setup:
            - "Logical clock 2024-10-01T00:00:00Z. One dealer with a single DEALER_CERTIFIED credential granted 2024-09-01."
          setup_api_calls:
            - call: "POST /dealer-network/_clock/set_current_utc"
              payload: { to_iso8601: "2024-10-01T00:00:00Z" }
              as: DealerNetworkManager
            - *n_dealer
            - &n_cert_old
              call: "POST /dealer-network/certification-records"
              payload: { dealer_id: "${d_id}", technician_name: "T-07", product_family: "EXCAVATION", credential_code: "DEALER_CERTIFIED", certified_at: "2024-09-01T00:00:00Z" }
              as: PartsManager
              captures: { cr_id: $.data.id }
          trigger:
            - call: "GET /dealer-network/certification-records/${cr_id}"
              payload: {}
              as: PartsManager
          assert:
            - "the first read reports CertificationRecord.${cr_id}.status == ACTIVE and version == 1"
            - "after POST /dealer-network/_clock/set_current_utc with to_iso8601 2026-09-01T00:00:00Z the same read reports status == EXPIRED"
            - "CertificationRecord.${cr_id}.recurrence_within_period == false on both reads"
            - "CertificationRecord.${cr_id}.version is still 1 after both reads"

      - name: dealer_agreement_create_extra_status_and_version_are_ignored_input
        claim_type: System Fields
        grounds:
          - entities.DealerAgreement.fields.status
          - endpoints.POST_/dealer-network/dealer-agreements
        distinguishing_aspect: "DealerAgreement.status is source: system with initial state DRAFT. A client that sends status ACTIVE and version 99 is ignored: the row is created DRAFT with version 1, and the only visible effect of the call is the dealer version bump."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One dealer T-410."
          setup_api_calls:
            - *n_clock
            - *n_dealer
          trigger:
            - call: "POST /dealer-network/dealer-agreements"
              payload: { dealer_id: "${d_id}", product_family: "EARTHMOVING", territory_code: "T-410", exclusivity_level: "SHARED", start_at: "2026-09-01T00:00:00Z", end_at: "2027-09-01T00:00:00Z", performance_plan_share_pct: 15, expected_dealer_version: "${d_v}", status: "ACTIVE", version: 99 }
              as: DealerNetworkManager
              captures: { ag_id: $.data.id }
          assert:
            - "the response status is 201"
            - "DealerAgreement.${ag_id}.status == DRAFT"
            - "DealerAgreement.${ag_id}.version == 1"
            - "DealerAgreement.${ag_id}.dealer_id == ${d_id} and performance_plan_share_pct == 15"
            - "GET /dealer-network/dealers/${d_id} reports version == 2 after the create"

      - name: dealer_agreement_create_with_unknown_exclusivity_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.DealerAgreement.fields.exclusivity_level
          - errors.ERR_INVALID_REQUEST
          - validations[priority=4]
        distinguishing_aspect: "exclusivity_level is a closed enum of exactly EXCLUSIVE and SHARED, so SOLE is rejected with 400 ERR_INVALID_REQUEST instead of being treated as a shared agreement."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One dealer T-410."
          setup_api_calls:
            - *n_clock
            - *n_dealer
          trigger:
            - call: "POST /dealer-network/dealer-agreements"
              payload: { dealer_id: "${d_id}", product_family: "EARTHMOVING", territory_code: "T-410", exclusivity_level: "SOLE", start_at: "2026-09-01T00:00:00Z", end_at: "2027-09-01T00:00:00Z", performance_plan_share_pct: 15, expected_dealer_version: "${d_v}" }
              as: DealerNetworkManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST"
            - "GET /dealer-network/dealer-agreements?dealer_id=${d_id} returns 0 rows"

      - name: trade_in_unit_create_requires_an_existing_equipment_order
        claim_type: Parent Relationships
        grounds:
          - entities.TradeInUnit.fields.order_id
          - errors.ERR_INVALID_REQUEST
          - endpoints.GET_/dealer-network/equipment-orders/{id}/trade-ins
        distinguishing_aspect: "The flat topology carries the parent link in the request body, so an unknown order_id on a would-be trade-in row is a 400 ERR_INVALID_REQUEST against the declared input schema, and the sub-resource read of a real order returns its remarketing rows as an array."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One dealer T-410 with an EquipmentOrder carrying trade_in_serial SN-6001."
          setup_api_calls:
            - *n_clock
            - *n_dealer
            - &n_equip
              call: "POST /dealer-network/equipment-orders"
              payload: { dealer_id: "${d_id}", product_family: "EXCAVATION", machine_serial: "SN-6100", list_price_cents: 50000000, trade_in_serial: "SN-6001", requested_at: "2026-08-20T00:00:00Z" }
              as: DealerSalesManager
              as_user_id: "${d_id}"
              captures: { eq_id: $.data.id }
            - call: "POST /dealer-network/equipment-orders/${eq_id}/submit"
              payload: {}
              as: DealerSalesManager
              as_user_id: "${d_id}"
          trigger:
            - call: "GET /dealer-network/equipment-orders/${eq_id}/trade-ins"
              payload: {}
              as: DealerSalesManager
              as_user_id: "${d_id}"
          assert:
            - "the response status is 200 and response_type is array"
            - "the sub-resource read returns exactly 1 row whose machine_serial == \"SN-6001\" and status == APPRAISED"
            - "the row's order_id == ${eq_id}"
            - "GET /dealer-network/trade-in-units?order_id=00000000-0000-4000-8000-000000000000 returns 0 rows"

      - name: performance_review_is_immutable_and_carries_no_version_field
        claim_type: Immutability
        grounds:
          - entities.PerformanceReview
          - endpoints.POST_/dealer-network/performance-reviews
        distinguishing_aspect: "PerformanceReview declares common_fields false, so the row carries only id and created_at — no updated_at and no version — and the OCC field that guards its creation belongs to the agreement rather than to the review itself."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. An ACTIVE T-410 EXCAVATION agreement with a compliant stocking commitment."
          setup_api_calls:
            - *n_clock
            - *n_dealer
            - *n_agree
            - *n_cert1
            - *n_cert2
            - *n_read_dealer
            - *n_commit
            - *n_submit
            - *n_submit_agree
            - *n_ready
            - call: "POST /dealer-network/dealer-agreements/${ag_id}/activate"
              payload: {}
              as: DealerNetworkManager
            - &n_read_agree
              call: "GET /dealer-network/dealer-agreements/${ag_id}"
              payload: {}
              as: DealerNetworkManager
              captures: { ag_v: $.data.version }
          trigger:
            - call: "POST /dealer-network/performance-reviews"
              payload: { dealer_id: "${d_id}", agreement_id: "${ag_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", actual_territory_machine_units: 6, territory_market_machine_units: 30, sampled_service_orders: 10, met_sla_service_orders: 9, expected_dealeragreement_version: "${ag_v}" }
              as: DealerPerformanceReviewer
              captures: { rv_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "the response data carries a non-null id and created_at"
            - "the response data carries no version field"
            - "PerformanceReview.${rv_id}.status == DRAFT and actual_market_share_pct == 20.0000"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: parts_commitment_starts_in_planned_state
        claim_type: Initial State
        grounds:
          - state_machines.PartsCommitment.initial_state
          - endpoints.POST_/dealer-network/parts-commitments
        distinguishing_aspect: "A commitment created with no status in the payload starts in PLANNED with version 1 and a fully derived mandate, so required_stocking_units is already computed before any submit call."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One dealer T-410 with a DRAFT agreement and two technicians."
          setup_api_calls:
            - *n_clock
            - *n_dealer
            - *n_agree
            - *n_cert1
            - *n_cert2
            - *n_read_dealer
          trigger:
            - call: "POST /dealer-network/parts-commitments"
              payload: { agreement_id: "${ag_id}", dealer_id: "${d_id}", product_family: "EXCAVATION", machine_population_units: 500, machine_population_slope: 1.0, planned_annual_units: 50000, emergency_stocking_target_pct: 50, emergency_fill_window_hours: 24, expected_dealer_version: "${d_v2}" }
              as: PartsManager
              captures: { cm_id: $.data.id }
          assert:
            - "the response status is 201"
            - "PartsCommitment.${cm_id}.status == PLANNED"
            - "PartsCommitment.${cm_id}.version == 1"
            - "PartsCommitment.${cm_id}.required_stocking_units == 64 and required_stocking_units_final == 63"
            - "PartsCommitment.${cm_id}.credit_balance_cents == 0"

      - name: parts_order_batch_cancel_from_cancelled_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.PartsOrderBatch.terminal_states
          - state_machines.PartsOrderBatch.OPEN_to_CANCELLED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "CANCELLED is terminal: a second cancel from CANCELLED is refused with 409 ERR_INVALID_STATE and fires no side effect, so the released reservation is not released twice."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The T-410 commitment is ORDER_READY with one OPEN batch of 10 units."
          setup_api_calls:
            - *n_clock
            - *n_dealer
            - *n_agree
            - *n_cert1
            - *n_cert2
            - *n_read_dealer
            - *n_commit
            - *n_submit
            - *n_submit_agree
            - *n_ready
            - call: "POST /dealer-network/parts-order-batches"
              payload: { commitment_id: "${cm_id}", product_family: "EXCAVATION", requested_units: 10, core_units: 0, core_return_required: false, requested_at: "2026-08-28T00:00:00Z" }
              as: PartsManager
              captures: { bt_id: $.data.id }
            - call: "POST /dealer-network/parts-order-batches/${bt_id}/cancel"
              payload: {}
              as: PartsManager
          trigger:
            - call: "POST /dealer-network/parts-order-batches/${bt_id}/cancel"
              payload: {}
              as: PartsManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_INVALID_STATE"
            - "PartsOrderBatch.${bt_id}.status is still CANCELLED"
            - "GET /dealer-network/parts-commitments/${cm_id} reports committed_units == 0 and open_backorder_units == 0"

      - name: service_order_resolve_after_resolved_is_idempotent
        claim_type: Idempotency
        grounds:
          - state_machines.ServiceOrder.OPEN_to_RESOLVED
          - state_machines.ServiceOrder.terminal_states
          - endpoints.POST_/dealer-network/service-orders/{id}/resolve
        distinguishing_aspect: "Repeating resolve on an already-RESOLVED order reports success with the first resolved_at stamp retained, so the second call is a no-op rather than a 409."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The T-410 commitment is ORDER_READY with one OPEN SLA_AUDIT order."
          setup_api_calls:
            - *n_clock
            - *n_dealer
            - *n_agree
            - *n_cert1
            - *n_cert2
            - *n_read_dealer
            - *n_commit
            - *n_submit
            - *n_submit_agree
            - *n_ready
            - call: "POST /dealer-network/service-orders"
              payload: { dealer_id: "${d_id}", commitment_id: "${cm_id}", kind: "SLA_AUDIT", product_family: "EXCAVATION", restriction_scope: "HOURS_SPENT", sla_hours: 12.0 }
              as: ServiceTechnicianSupervisor
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /dealer-network/service-orders/${so_id}/resolve"
              payload: {}
              as: ServiceTechnicianSupervisor
              captures: { first_at: $.data.resolved_at }
            - call: "POST /dealer-network/service-orders/${so_id}/resolve"
              payload: {}
              as: ServiceTechnicianSupervisor
              captures: { second_at: $.data.resolved_at }
          assert:
            - "the first resolve returns 200 and ServiceOrder.${so_id}.status == RESOLVED"
            - "the second resolve also returns 200"
            - "the second resolve reports resolved_at equal to first_at"
            - "GET /dealer-network/service-orders?dealer_id=${d_id}&status=RESOLVED returns exactly 1 row"

      - name: rebuild_claim_deny_locks_the_claim_out_of_approval
        claim_type: Invalid Transitions
        grounds:
          - state_machines.RebuildClaim.terminal_states
          - state_machines.RebuildClaim.REQUESTED_to_DENIED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "DENIED is terminal, so an approve attempted on a denied claim answers 409 ERR_INVALID_STATE and leaves the pricing fields null rather than pricing a denied claim."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One dealer T-410 with a REQUESTED rebuild claim."
          setup_api_calls:
            - *n_clock
            - *n_dealer
            - call: "POST /dealer-network/rebuild-claims"
              payload: { dealer_id: "${d_id}", product_family: "EXCAVATION", machine_serial: "SN-7100", machine_operating_weight_lb: 90000, client_meter_hours: 3000, requested_at: "2026-08-22T00:00:00Z", core_purchase_value_cents: 4000000, rebuild_labor_hours: 10.0, rebuild_labor_rate_cents: 14000, certified_rebuild_spec_code: "CAT_CERTIFIED_2" }
              as: RebuildProgramSpecialist
              captures: { rc_id: $.data.id, rc_v: $.data.version }
            - call: "POST /dealer-network/rebuild-claims/${rc_id}/deny"
              payload: {}
              as: RebuildProgramSpecialist
          trigger:
            - call: "POST /dealer-network/rebuild-claims/${rc_id}/approve"
              payload: { expected_rebuildclaim_version: "${rc_v}" }
              as: RebuildProgramSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_INVALID_STATE"
            - "RebuildClaim.${rc_id}.status is still DENIED"
            - "RebuildClaim.${rc_id}.rebuild_fee_cents is null and core_return_credit_cents is null"

      - name: support_agreement_terminate_recomputes_population_coverage
        claim_type: Side Effect Execution
        grounds:
          - state_machines.SupportAgreement.ACTIVE_to_TERMINATED
          - entities.MachinePopulationRecord.fields.coverage_multiplier
          - endpoints.POST_/dealer-network/support-agreements/{id}/terminate
        distinguishing_aspect: "Terminating a support agreement cascades onto a different entity: the covered serial's MachinePopulationRecord.coverage_multiplier falls from 1.5 to 1.0, the dealer's parts forecast drops by the difference, and the support agreement itself is TERMINATED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One dealer T-410 whose machine SN-3001 is covered by an ACTIVE PREMIUM support agreement."
          setup_api_calls:
            - *n_clock
            - *n_dealer
            - call: "POST /dealer-network/machine-population-records"
              payload: { dealer_id: "${d_id}", product_family: "LIFT_TRUCK", machine_serial: "SN-3001", machine_operating_weight_lb: 30000, meter_hours: 1000 }
              as: PartsManager
              captures: { pop_id: $.data.id }
            - call: "POST /dealer-network/support-agreements"
              payload: { dealer_id: "${d_id}", machine_serial: "SN-3001", plan_tier: "PREMIUM", enrolled_at: "2026-08-15T00:00:00Z" }
              as: PartsManager
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /dealer-network/support-agreements/${sup_id}/terminate"
              payload: {}
              as: PartsManager
          assert:
            - "the response status is 200 and SupportAgreement.${sup_id}.status == TERMINATED"
            - "GET /dealer-network/machine-population-records/${pop_id} reports coverage_multiplier == 1.0"
            - "GET /dealer-network/machine-population-records/forecast?dealer_id=${d_id} reports forecast_parts_demand_units == 29"
            - "the same forecast read before the terminate reported 44"

      - name: equipment_order_deliver_requires_a_live_agreement_for_the_family
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.EquipmentOrder.FINANCE_APPROVED_to_DELIVERED
          - errors.ERR_NO_ACTIVE_AGREEMENT
          - entities.DealerAgreement.fields.status
        distinguishing_aspect: "The delivery transition is guarded by a cross-entity precondition: with the dealer holding no ACTIVE agreement for the ordered product family the call answers 409 ERR_NO_ACTIVE_AGREEMENT, while the same call succeeds once a matching agreement is ACTIVE."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One dealer T-410 with a FINANCE_APPROVED POWER_SYSTEMS order but no agreement for that family."
          setup_api_calls:
            - *n_clock
            - *n_dealer
            - call: "POST /dealer-network/equipment-orders"
              payload: { dealer_id: "${d_id}", product_family: "POWER_SYSTEMS", machine_serial: "SN-6200", list_price_cents: 90000000, requested_at: "2026-08-20T00:00:00Z" }
              as: DealerSalesManager
              as_user_id: "${d_id}"
              captures: { eq_id: $.data.id }
            - call: "POST /dealer-network/equipment-orders/${eq_id}/submit"
              payload: {}
              as: DealerSalesManager
              as_user_id: "${d_id}"
            - call: "POST /dealer-network/equipment-orders/${eq_id}/approve-financing"
              payload: { financing_approval_reference: "OEM-FIN-2201" }
              as: FinancePartner
          trigger:
            - call: "POST /dealer-network/equipment-orders/${eq_id}/deliver"
              payload: {}
              as: DealerSalesManager
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_NO_ACTIVE_AGREEMENT"
            - "EquipmentOrder.${eq_id}.status is still FINANCE_APPROVED"
            - "GET /dealer-network/machine-population-records?machine_serial=SN-6200 returns 0 rows"

  # ===========================================================================
  - section: calculations
    instances:

      - name: availability_target_known_inputs_surrogate_formula
        claim_type: Correct Result
        grounds:
          - calculations.availability_target_pct
          - endpoints.POST_/dealer-network/parts-commitments/{id}/submit
        distinguishing_aspect: "With a 50 percent emergency stocking target the surrogate is 92.0 — the knee at 60 contributes nothing — while a 100 percent target contributes the full 4.0 and reads 96.0, so the value is 92.0 and never 100.0 for these inputs."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One dealer T-410 with a DRAFT agreement and two technicians."
          setup_api_calls:
            - *n_clock
            - *n_dealer
            - *n_agree
            - *n_cert1
            - *n_cert2
            - *n_read_dealer
            - call: "POST /dealer-network/parts-commitments"
              payload: { agreement_id: "${ag_id}", dealer_id: "${d_id}", product_family: "EXCAVATION", machine_population_units: 500, machine_population_slope: 1.0, planned_annual_units: 50000, emergency_stocking_target_pct: 50, emergency_fill_window_hours: 24, expected_dealer_version: "${d_v2}" }
              as: PartsManager
              captures: { cm_low: $.data.id }
            - call: "POST /dealer-network/parts-commitments"
              payload: { agreement_id: "${ag_id}", dealer_id: "${d_id}", product_family: "EARTHMOVING", machine_population_units: 500, machine_population_slope: 1.0, planned_annual_units: 50000, emergency_stocking_target_pct: 100, emergency_fill_window_hours: 24, expected_dealer_version: "${d_v2}" }
              as: PartsManager
              captures: { cm_high: $.data.id }
          trigger:
            - call: "POST /dealer-network/parts-commitments/${cm_low}/submit"
              payload: {}
              as: PartsManager
            - call: "POST /dealer-network/parts-commitments/${cm_high}/submit"
              payload: {}
              as: PartsManager
          assert:
            - "PartsCommitment.${cm_low}.availability_target_pct == 92.0"
            - "PartsCommitment.${cm_high}.availability_target_pct == 96.0"
            - "PartsCommitment.${cm_high}.availability_target_pct != 100.0"
            - "the surrogate is capped at 4.0 percentage points above the 92.0 base"

      - name: emergency_fill_sla_outcome_is_met_at_the_window_boundary
        claim_type: Precision
        grounds:
          - calculations.service_order_sla_outcome
          - entities.ServiceOrder.fields.response_window_hours
          - endpoints.POST_/dealer-network/service-orders/{id}/begin
        distinguishing_aspect: "The SLA comparison is inclusive on the upper edge: a response of exactly 24.0 hours against a 24-hour window is MET, and the outcome flips only once the response strictly exceeds the window."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The T-410 commitment is ORDER_READY with a 24-hour emergency fill window."
          setup_api_calls:
            - *n_clock
            - *n_dealer
            - *n_agree
            - *n_cert1
            - *n_cert2
            - *n_read_dealer
            - *n_commit
            - *n_submit
            - *n_submit_agree
            - *n_ready
            - call: "POST /dealer-network/service-orders"
              payload: { dealer_id: "${d_id}", commitment_id: "${cm_id}", kind: "EMERGENCY_FILL", product_family: "EXCAVATION", orderable_ref_enabled: true, restriction_scope: "HOURS_SPENT", sla_hours: 24.0 }
              as: ServiceTechnicianSupervisor
              captures: { so_id: $.data.id, so_window: $.data.response_window_hours }
          trigger:
            - call: "POST /dealer-network/service-orders/${so_id}/begin"
              payload: {}
              as: ServiceTechnicianSupervisor
          assert:
            - "ServiceOrder.${so_id}.response_window_hours == 24.0"
            - "ServiceOrder.${so_id}.sla_hours == 24.0 and the outcome is MET at the inclusive boundary"
            - "a response of 24.0 is not treated as a miss, while 24.5 would be"

      - name: coverage_multiplier_selects_the_plan_tier_constant
        claim_type: Constants Applied
        grounds:
          - calculations.coverage_multiplier
          - entities.SupportAgreement.fields.coverage_multiplier
          - endpoints.POST_/dealer-network/support-agreements
        distinguishing_aspect: "The plan-tier constants are applied exactly: PREMIUM binds 1.5, PLUS binds 1.25 and an uncovered serial binds 1.0, and a SUSPENDED plan binds 1.0 rather than its tier constant."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One dealer T-410 with three machines and one SUSPENDED PREMIUM plan."
          setup_api_calls:
            - *n_clock
            - *n_dealer
            - call: "POST /dealer-network/machine-population-records"
              payload: { dealer_id: "${d_id}", product_family: "LIFT_TRUCK", machine_serial: "SN-3101", machine_operating_weight_lb: 50000, meter_hours: 1000 }
              as: PartsManager
              captures: { pop_prem: $.data.id }
            - call: "POST /dealer-network/machine-population-records"
              payload: { dealer_id: "${d_id}", product_family: "LIFT_TRUCK", machine_serial: "SN-3102", machine_operating_weight_lb: 50000, meter_hours: 1000 }
              as: PartsManager
              captures: { pop_plus: $.data.id }
            - call: "POST /dealer-network/machine-population-records"
              payload: { dealer_id: "${d_id}", product_family: "LIFT_TRUCK", machine_serial: "SN-3103", machine_operating_weight_lb: 50000, meter_hours: 1000 }
              as: PartsManager
              captures: { pop_bare: $.data.id }
            - call: "POST /dealer-network/support-agreements"
              payload: { dealer_id: "${d_id}", machine_serial: "SN-3101", plan_tier: "PREMIUM", enrolled_at: "2026-08-15T00:00:00Z" }
              as: PartsManager
              captures: { sup_prem: $.data.id }
            - call: "POST /dealer-network/support-agreements"
              payload: { dealer_id: "${d_id}", machine_serial: "SN-3102", plan_tier: "PLUS", enrolled_at: "2026-08-15T00:00:00Z" }
              as: PartsManager
              captures: { sup_plus: $.data.id }
          trigger:
            - call: "GET /dealer-network/machine-population-records"
              payload: { dealer_id: "${d_id}" }
              as: PartsManager
          assert:
            - "the PREMIUM-covered record reports coverage_multiplier == 1.5 and projected_annual_parts_units == 54"
            - "the PLUS-covered record reports coverage_multiplier == 1.25 and projected_annual_parts_units == 45"
            - "the uncovered record reports coverage_multiplier == 1.0 and projected_annual_parts_units == 36"
            - "GET /dealer-network/machine-population-records/forecast?dealer_id=${d_id} reports per_record_total == 135"

      - name: forecast_input_set_excludes_retired_population_records
        claim_type: Input Set Filtering
        grounds:
          - calculations.forecast_parts_demand_units
          - entities.MachinePopulationRecord.fields.status
          - endpoints.GET_/dealer-network/machine-population-records/forecast
        distinguishing_aspect: "The forecast input set is filtered to status ACTIVE: retiring a record removes its whole contribution from the dealer forecast while leaving the row queryable, so the total drops by exactly that record's units."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One dealer T-410 with two uncovered machines and an accepted trade-in for the retired serial."
          setup_api_calls:
            - *n_clock
            - *n_dealer
            - call: "POST /dealer-network/machine-population-records"
              payload: { dealer_id: "${d_id}", product_family: "LIFT_TRUCK", machine_serial: "SN-3201", machine_operating_weight_lb: 50000, meter_hours: 1000 }
              as: PartsManager
              captures: { pop_a: $.data.id }
            - call: "POST /dealer-network/machine-population-records"
              payload: { dealer_id: "${d_id}", product_family: "COMPACTION", machine_serial: "SN-3202", machine_operating_weight_lb: 50000, meter_hours: 1000 }
              as: PartsManager
              captures: { pop_b: $.data.id }
            - call: "POST /dealer-network/equipment-orders"
              payload: { dealer_id: "${d_id}", product_family: "COMPACTION", machine_serial: "SN-6201", list_price_cents: 40000000, trade_in_serial: "SN-3202", requested_at: "2026-08-20T00:00:00Z" }
              as: DealerSalesManager
              as_user_id: "${d_id}"
              captures: { eq_id: $.data.id }
            - call: "POST /dealer-network/equipment-orders/${eq_id}/submit"
              payload: {}
              as: DealerSalesManager
              as_user_id: "${d_id}"
          trigger:
            - call: "GET /dealer-network/machine-population-records/forecast"
              payload: { dealer_id: "${d_id}" }
              as: PartsManager
            - call: "POST /dealer-network/machine-population-records/${pop_b}/retire"
              payload: {}
              as: PartsManager
            - call: "GET /dealer-network/machine-population-records/forecast"
              payload: { dealer_id: "${d_id}" }
              as: PartsManager
          assert:
            - "the first forecast reports forecast_parts_demand_units == 64"
            - "after retire the forecast reports forecast_parts_demand_units == 36"
            - "GET /dealer-network/machine-population-records?dealer_id=${d_id}&status=RETIRED returns exactly 1 row"
            - "the retired row remains queryable with status RETIRED"

      - name: observed_share_pct_uses_the_kind_weight_table
        claim_type: Variant Divergence
        grounds:
          - calculations.market_share_from_observations_pct
          - entities.MarketShareObservation.fields.observed_share_pct
          - entities.MarketShareObservation.fields.kind
        distinguishing_aspect: "The kind weights are load-bearing: a MACHINE observation of 5 of 10 units plus a LIGHT observation of 0 of 1 unit gives 47.6190 percent, while the same rows weighted as raw counts would give 45.4545 — so 47.6190 is the served value and 45.4545 is not."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One dealer T-410 with no observations."
          setup_api_calls:
            - *n_clock
            - *n_dealer
          trigger:
            - call: "POST /dealer-network/market-share-observations"
              payload: { dealer_id: "${d_id}", product_family: "EXCAVATION", observed_machine_units: 5, territory_machine_units: 10, recorded_at: "2026-03-01T00:00:00Z", kind: "MACHINE" }
              as: DealerPerformanceReviewer
              captures: { obs_m: $.data.id }
            - call: "POST /dealer-network/market-share-observations"
              payload: { dealer_id: "${d_id}", product_family: "EXCAVATION", observed_machine_units: 0, territory_machine_units: 1, recorded_at: "2026-03-02T00:00:00Z", kind: "LIGHT" }
              as: DealerPerformanceReviewer
              captures: { obs_l: $.data.id }
          assert:
            - "GET /dealer-network/market-share-observations/${obs_m} reports observed_share_pct == 47.6190"
            - "observed_share_pct != 45.4545"
            - "GET /dealer-network/market-share-observations?dealer_id=${d_id} returns exactly 2 rows"
            - "the LIGHT row stores observed_share_pct == 0.0000"

      - name: exact_tier_edge_weighted_numerator_100_is_small
        claim_type: Boundary
        grounds:
          - calculations.tier_weighted_machine_population
          - entities.PartsCommitment.fields.machine_population_tier
          - endpoints.POST_/dealer-network/parts-commitments/{id}/submit
        distinguishing_aspect: "The tier edges belong to the higher tier: a weighted numerator of exactly 100 is SMALL while 99.99 is MICRO, and exactly 1500 is LARGE while 1499.99 is MEDIUM."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One dealer T-410 with a DRAFT agreement and two technicians."
          setup_api_calls:
            - *n_clock
            - *n_dealer
            - *n_agree
            - *n_cert1
            - *n_cert2
            - *n_read_dealer
            - call: "POST /dealer-network/parts-commitments"
              payload: { agreement_id: "${ag_id}", dealer_id: "${d_id}", product_family: "EXCAVATION", machine_population_units: 500, machine_population_slope: 0.2, planned_annual_units: 5000, emergency_stocking_target_pct: 50, emergency_fill_window_hours: 24, expected_dealer_version: "${d_v2}" }
              as: PartsManager
              captures: { cm_edge: $.data.id }
            - call: "POST /dealer-network/parts-commitments"
              payload: { agreement_id: "${ag_id}", dealer_id: "${d_id}", product_family: "EARTHMOVING", machine_population_units: 500, machine_population_slope: 0.19998, planned_annual_units: 5000, emergency_stocking_target_pct: 50, emergency_fill_window_hours: 24, expected_dealer_version: "${d_v2}" }
              as: PartsManager
              captures: { cm_below: $.data.id }
          trigger:
            - call: "POST /dealer-network/parts-commitments/${cm_edge}/submit"
              payload: {}
              as: PartsManager
            - call: "POST /dealer-network/parts-commitments/${cm_below}/submit"
              payload: {}
              as: PartsManager
          assert:
            - "PartsCommitment.${cm_edge}.machine_population_tier == SMALL"
            - "PartsCommitment.${cm_below}.machine_population_tier == MICRO"
            - "the 100 edge belongs to SMALL, not MICRO"

      - name: forecast_floor_and_ceiling_are_honored_per_record
        claim_type: Aggregation
        grounds:
          - calculations.forecast_parts_demand_units
          - endpoints.GET_/dealer-network/machine-population-records/forecast
        distinguishing_aspect: "The per-record ceiling is honoured without upward drift: two records that each round up to 36 sum to exactly 72, so the aggregation neither floors the sum nor rounds the total again."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One dealer T-410 with two uncovered LIFT_TRUCK machines on a 50000 lb MIDDLE band."
          setup_api_calls:
            - *n_clock
            - *n_dealer
            - call: "POST /dealer-network/machine-population-records"
              payload: { dealer_id: "${d_id}", product_family: "LIFT_TRUCK", machine_serial: "SN-3301", machine_operating_weight_lb: 50000, meter_hours: 1000 }
              as: PartsManager
              captures: { pop_a: $.data.id }
            - call: "POST /dealer-network/machine-population-records"
              payload: { dealer_id: "${d_id}", product_family: "LIFT_TRUCK", machine_serial: "SN-3302", machine_operating_weight_lb: 50000, meter_hours: 1000 }
              as: PartsManager
              captures: { pop_b: $.data.id }
          trigger:
            - call: "GET /dealer-network/machine-population-records/forecast"
              payload: { dealer_id: "${d_id}" }
              as: PartsManager
          assert:
            - "MachinePopulationRecord.${pop_a}.projected_annual_parts_units == 36"
            - "MachinePopulationRecord.${pop_b}.projected_annual_parts_units == 36"
            - "the response data forecast_parts_demand_units == 72"
            - "the response data per_record_total equals the response data sum_then_ceiling_total == 72"

  # ===========================================================================
  - section: validations
    instances:

      - name: service_order_begin_without_auth_headers_returns_unauthenticated
        claim_type: Violation to Error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Priority 1 fires before every other check: a call with no X-User-Role and no X-User-ID against an endpoint that also requires an existing order answers 401 ERR_UNAUTHENTICATED, not a 404."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *n_clock
          trigger:
            - call: "POST /dealer-network/service-orders/00000000-0000-4000-8000-000000000000/begin"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 401 and err == ERR_UNAUTHENTICATED"
            - "err != ERR_INVALID_STATE and err != ERR_DEALER_NOT_FOUND"

      - name: batch_create_by_a_role_outside_the_endpoint_role_list_returns_unauthorized
        claim_type: Violation to Error
        grounds:
          - validations[priority=2]
          - errors.ERR_UNAUTHORIZED
          - endpoints.POST_/dealer-network/parts-order-batches
        distinguishing_aspect: "Priority 2 fires before existence and state checks: a DealerSalesManager attempting the batch create answers 403 ERR_UNAUTHORIZED even though the commitment it names does exist."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The T-410 commitment is ORDER_READY."
          setup_api_calls:
            - *n_clock
            - *n_dealer
            - *n_agree
            - *n_cert1
            - *n_cert2
            - *n_read_dealer
            - *n_commit
            - *n_submit
            - *n_submit_agree
            - *n_ready
          trigger:
            - call: "POST /dealer-network/parts-order-batches"
              payload: { commitment_id: "${cm_id}", product_family: "EXCAVATION", requested_units: 10, core_units: 0, core_return_required: false, requested_at: "2026-08-28T00:00:00Z" }
              as: DealerSalesManager
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and err == ERR_UNAUTHORIZED"
            - "GET /dealer-network/parts-order-batches?commitment_id=${cm_id} returns 0 rows"

      - name: order_ready_when_the_agreement_is_not_compliant_returns_tooling_incomplete
        claim_type: Satisfaction to Pass
        grounds:
          - validations[priority=6]
          - errors.ERR_TOOLING_INCOMPLETE
          - state_machines.PartsCommitment.SUBMITTED_to_ORDER_READY
        distinguishing_aspect: "The compliance gate separates the two calls: with one technician on file the agreement status stays PARTIAL and ready-for-orders answers 409 ERR_TOOLING_INCOMPLETE, while the identical call after the second credential is written returns 200 with status ORDER_READY."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One dealer T-410 with a SUBMITTED agreement carrying a single technician."
          setup_api_calls:
            - *n_clock
            - *n_dealer
            - *n_agree
            - *n_cert1
            - *n_read_dealer
            - *n_commit
            - *n_submit
            - *n_submit_agree
          trigger:
            - call: "POST /dealer-network/parts-commitments/${cm_id}/ready-for-orders"
              payload: {}
              as: PartsManager
              captures: { err_first: $.data.error_id }
            - call: "POST /dealer-network/certification-records"
              payload: { dealer_id: "${d_id}", technician_name: "T-02", product_family: "EXCAVATION", credential_code: "DEALER_MASTER", certified_at: "2026-08-01T00:00:00Z" }
              as: PartsManager
            - call: "POST /dealer-network/parts-commitments/${cm_id}/ready-for-orders"
              payload: {}
              as: PartsManager
          assert:
            - "the first call returns 409 with err_first == ERR_TOOLING_INCOMPLETE"
            - "DealerAgreement.${ag_id}.tooling_compliance_status == PARTIAL before the second credential"
            - "the second call returns 200 and PartsCommitment.${cm_id}.status == ORDER_READY"
            - "DealerAgreement.${ag_id}.tooling_compliance_status == COMPLIANT after the second credential"

      - name: batch_create_conforms_and_succeeds_on_a_satisfied_precondition
        claim_type: Satisfaction to Pass
        grounds:
          - validations[priority=7]
          - endpoints.POST_/dealer-network/parts-order-batches
          - entities.PartsOrderBatch.fields.reserved_units
        distinguishing_aspect: "The aggregate reservation condition is satisfied when the requested units fit with one unit to spare: requested 61 against an outstanding 63 reserves the full 61, where requesting 65 exceeds the outstanding units and takes the oversized branch."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The T-410 commitment is ORDER_READY with required_stocking_units_final 63 and no batches."
          setup_api_calls:
            - *n_clock
            - *n_dealer
            - *n_agree
            - *n_cert1
            - *n_cert2
            - *n_read_dealer
            - *n_commit
            - *n_submit
            - *n_submit_agree
            - *n_ready
          trigger:
            - call: "POST /dealer-network/parts-order-batches"
              payload: { commitment_id: "${cm_id}", product_family: "EXCAVATION", requested_units: 61, core_units: 0, core_return_required: false, requested_at: "2026-08-28T00:00:00Z" }
              as: PartsManager
              captures: { bt_id: $.data.id }
            - call: "POST /dealer-network/parts-order-batches"
              payload: { commitment_id: "${cm_id}", product_family: "EXCAVATION", requested_units: 65, core_units: 0, core_return_required: false, requested_at: "2026-08-28T00:00:00Z" }
              as: PartsManager
              captures: { bt_second: $.data.id }
          assert:
            - "the first create returns 201 with reserved_units == 61"
            - "GET /dealer-network/parts-commitments/${cm_id} reports available_commitment_units == 2 after the first batch"
            - "the second create returns 201 with reserved_units == 66"
            - "the second batch is the oversized branch, reserving required_stocking_units + 2 without confirming the allocation at 64"

      - name: service_order_begin_with_a_non_technician_role_returns_unauthorized
        claim_type: Cascading Validation
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "The auth pair runs in order: the same call answers 401 without headers and 403 with a role whose identity exists but is not permitted, so the existence check never runs on either call."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One dealer T-410 with a real service order."
          setup_api_calls:
            - *n_clock
            - *n_dealer
            - *n_agree
            - *n_cert1
            - *n_cert2
            - *n_read_dealer
            - *n_commit
            - *n_submit
            - *n_submit_agree
            - *n_ready
            - call: "POST /dealer-network/service-orders"
              payload: { dealer_id: "${d_id}", commitment_id: "${cm_id}", kind: "SLA_AUDIT", product_family: "EXCAVATION", restriction_scope: "HOURS_SPENT", sla_hours: 12.0 }
              as: ServiceTechnicianSupervisor
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /dealer-network/service-orders/${so_id}/begin"
              payload: {}
              as: ""
              captures: { err_a: $.data.error_id }
            - call: "POST /dealer-network/service-orders/${so_id}/begin"
              payload: {}
              as: DealerNetworkManager
              captures: { err_b: $.data.error_id }
          assert:
            - "the header-less call returns 401 with err_a == ERR_UNAUTHENTICATED"
            - "the wrongly-roled call returns 403 with err_b == ERR_UNAUTHORIZED"
            - "ServiceOrder.${so_id}.status is still OPEN after both calls"

