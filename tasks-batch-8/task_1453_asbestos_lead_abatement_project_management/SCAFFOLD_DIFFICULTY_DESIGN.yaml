            - { call: "POST /abatement/assignments", payload: { project_id: "${p_id}", worker_id: "${w_sup}", role_on_site: "SUPERVISOR", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }, as: Supervisor, as_user_id: "${w_sup}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /abatement/projects/${p_id}/start-abatement", payload: {}, as: ContractorAdmin }
            - { call: "POST /abatement/projects/${p_id}/complete-work", payload: {}, as: Supervisor, as_user_id: "${w_sup}" }
            - { call: "POST /abatement/air-tests", payload: { project_id: "${p_id}", phase: "CLEARANCE", collected_at: "2026-08-12T08:00:00Z" }, as: IndustrialHygienist, as_user_id: "ih_1", captures: { t1: "$.data.id" } }
            - { call: "POST /abatement/air-tests", payload: { project_id: "${p_id}", phase: "CLEARANCE", collected_at: "2026-08-12T09:00:00Z" }, as: IndustrialHygienist, as_user_id: "ih_1", captures: { t2: "$.data.id" } }
