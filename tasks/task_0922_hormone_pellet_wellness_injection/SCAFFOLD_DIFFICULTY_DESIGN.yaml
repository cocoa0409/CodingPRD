            - call: "POST /clinic/patients/${p17}/eligibility-hold"
              payload: { hold_kind: "FINANCIAL", hold_action: "SET", reason: "Defaulted plan on another account" }
              as: ClinicAdmin
            - call: "POST /clinic/patients/${p17}/eligibility-hold"
              payload: { hold_kind: "CLINICAL", hold_action: "SET", reason: "Awaiting cardiology clearance" }
              as: Physician
              as_user_id: "${dr1}"
          trigger:
            - call: "POST /clinic/procedures"
              payload: { patient_id: "${p17}", provider_id: "${dr1}", consult_id: "${cs17}", standing_order_id: "${so17}", procedure_type: "INITIAL", room_code: "RM10", scheduled_start: "2026-06-10T09:00:00Z" }
              as: FrontDesk
              captures: { dual_err: $.data.error_id }
            - call: "POST /clinic/patients/${p17}/eligibility-hold"
              payload: { hold_kind: "CLINICAL", hold_action: "CLEAR", reason: "Cardiology cleared" }
