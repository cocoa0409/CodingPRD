        distinguishing_aspect: "With profile_quota_per_cycle 1 the first activation drains the pool to 0 and the second returns ERR_PROFILE_QUOTA_EXCEEDED; retiring the first profile releases the unit and the second activation then succeeds."
        test_recipe:
          setup:
            - "A plan with profile_quota_per_cycle 1; ACTIVE account; two DRAFT profiles, each with one identifier; the first already ACTIVE."
          setup_api_calls:
            - call: "POST /plans"
