            - "cc_amt == 177855"
            - "cc_rd != 31"
            - "PerDiemClaim.${cc_id}.corrects_claim_id == ${ca_id}"
            - "PerDiemClaim.${cc_id}.correction_generation == 1"
            - "PerDiemClaim.${cc_id}.claim_month == 2026-08"
            - "PerDiemClaim.${cc_id}.care_unit_id == ${ua_id}"
