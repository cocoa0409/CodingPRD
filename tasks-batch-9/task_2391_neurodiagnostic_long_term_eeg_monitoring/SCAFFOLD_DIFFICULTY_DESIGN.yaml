              as: PayerReviewer
            - call: "POST /neurodiagnostics/admissions"
              payload: { patient_id: "${patient_id}", authorization_id: "${auth_id}", unit_id: "${unit_id}", setting: "INPATIENT_VEEG", scheduled_admit_at: "2026-08-02T00:00:00Z", target_event_count: 4, planned_days: 2 }
              as: UnitCoordinator
              captures: { adm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
