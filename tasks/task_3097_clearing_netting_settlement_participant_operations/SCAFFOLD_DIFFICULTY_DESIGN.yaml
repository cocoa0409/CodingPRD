  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: participant_default_declaration_three_hop_cascade
        grounds:
          - state_machines.Participant.SUSPENDED_to_DEFAULTED
          - state_machines.TradeSubmission.ACTIVE_to_SUSPENDED
          - entities.NetPosition.fields.dvp_status
          - state_machines.ClearingFund.OPEN_to_RECOMPUTED
          - entities.ClearingFund.fields.total_component_cents
        distinguishing_aspect: "The hop depth is measured from the participant lifecycle: declaring the default mutates Participant, which mutates the ClearingMemberDeposit status, which mutates the ClearingFund's total_component_cents — depth 3, where hop N is caused by hop N-1 and never directly by the declaration."
