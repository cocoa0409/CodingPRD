          trigger:
            - call: "POST /bookings"
              payload: { unit_id: "${unit2_id}", tenant_id: "${tenant_id}", start_date: "2026-07-01", end_date: "2026-08-01" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_TENANT_DOUBLE_BOOKED (closed [2026-06-01,2026-07-01] intersects [2026-07-01,2026-08-01] at 2026-07-01)"

  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deposit_partition_conserved
        grounds:
          - calculations.deposit_settlement
          - entities.Deposit.fields.held_cents
          - entities.Deposit.fields.refunded_cents
          - entities.Deposit.fields.forfeited_cents
        distinguishing_aspect: |
          Conserved quantity = deposit total: amount_cents == held + refunded +
          forfeited stays 150000 while a forfeiture (claim approve 40000) and the
          compensating refund (settle) redistribute the partition.
        test_recipe:
          setup:
            - "Verified host/tenant, unit LISTED deposit 150000; booking [2026-06-01,2026-07-01] confirmed, activated (clock 2026-06-15), completed (clock 2026-07-01)"
            - "Deposit HELD 150000; claim FILED 40000 then APPROVED 40000 (held 110000, forfeited 40000)"
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Host Q", email: "hostQ@x.com" }
              as: Anonymous
              captures: { host_id: $.data.id }
            - call: "POST /hosts/${host_id}/verify-payout"
              payload: {}
              as: ComplianceReviewer
            - call: "POST /tenants"
              payload: { full_name: "Nurse Q", email: "nurseQ@x.com", tenant_type: "TRAVEL_NURSE" }
              as: Anonymous
              captures: { tenant_id: $.data.id }
            - call: "POST /verifications"
              payload: { tenant_id: "${tenant_id}", doc_type: "GOVERNMENT_ID", document_ref: "docQ" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: ComplianceReviewer
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "U17", address: "17 St", monthly_rate_cents: 300000, cleaning_included: true, deposit_cents: 150000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/transitions"
              payload: { to_status: "LISTED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings"
              payload: { unit_id: "${unit_id}", tenant_id: "${tenant_id}", start_date: "2026-06-01", end_date: "2026-07-01" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "COMPLETED" }
              as: PlatformAdmin
            - call: "GET /deposits?booking_id=${booking_id}"
              payload: {}
              as: PlatformAdmin
              captures: { dep_id: "$.data[0].id", dep_v: "$.data[0].version" }
            - call: "POST /damage-claims"
              payload: { deposit_id: "${dep_id}", expected_deposit_version: "${dep_v}", claimed_cents: 40000, description: "stain" }
              as: Host
              as_user_id: "${host_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /damage-claims/${claim_id}/transitions"
              payload: { to_status: "APPROVED", approved_cents: 40000 }
              as: ComplianceReviewer
          trigger:
            - call: "POST /deposits/${dep_id}/settle"
              payload: {}
              as: ComplianceReviewer
          assert:
            - "GET /deposits?booking_id=${booking_id}: amount_cents == 150000, held_cents == 0, refunded_cents == 110000, forfeited_cents == 40000, status == PARTIALLY_REFUNDED"
            - "invariant holds: 150000 == 0 + 110000 + 40000 (deposit total unchanged across forfeit + compensating refund)"

      - name: host_ledger_pay_reverse_conserved
        grounds:
          - state_machines.Payout.SCHEDULED_to_PAID
          - state_machines.Payout.PAID_to_REVERSED
          - entities.Host.fields.payout_balance_cents
          - calculations.host_ledger
        distinguishing_aspect: |
          Conserved quantity = host ledger (different from deposit partition):
          payout_balance_cents == sum(net for PAID payouts); paying (+264000)
          then reversing (-264000) leaves the balance at 0, its pre-pay value.
        test_recipe:
          setup:
            - "Verified host/tenant, unit LISTED rate 300000 cleaning_included true deposit 0"
            - "Booking [2026-06-01,2026-07-01] confirmed, activated (clock 2026-06-15), completed (clock 2026-07-01) -> Payout FINAL net 264000; scheduled by admin-1"
          setup_api_calls:
