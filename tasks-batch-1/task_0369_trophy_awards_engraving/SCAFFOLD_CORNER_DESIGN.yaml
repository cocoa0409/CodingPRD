  # ===========================================================================
  # excluded_because stubs — corners already covered by a §1.8 instance
  # ===========================================================================
  - section: calculations
    instances:
      - name: error_component_shortage_on_confirm_stub
        claim_type: Correct Result
        grounds:
          - "errors[ERR_COMPONENT_SHORTAGE]"
        excluded_because:
          difficulty_instance: component_available_vs_physical_two_gates_diverge
          rationale: "ERR_COMPONENT_SHORTAGE at confirm-reserve is the failure path asserted by the named §1.8 dual_variant_calc instance."

      - name: order_pricing_invoice_correct_result_stub
        claim_type: Variant Selection
        grounds:
          - calculations.order_pricing
        excluded_because:
          difficulty_instance: order_pricing_estimate_vs_invoice_diverge_on_promo
          rationale: "Invoice-variant pricing correctness (PERCENT promo redeemed) is asserted by the named §1.8 dual_variant_calc instance."

  - section: state_machines
    instances:
      - name: proof_request_changes_reverts_line_stub
        claim_type: Compensation
        grounds:
          - state_machines.Proof.SENT_to_CHANGES_REQUESTED
          - state_machines.OrderLine.ENGRAVING_to_PENDING
        excluded_because:
          difficulty_instance: request_changes_reverts_line_depth2
          rationale: "The proof request-changes -> line revert cascade is asserted by the named §1.8 transitive_cascade instance."

      - name: cancel_releases_allocations_stub
        claim_type: Compensation
        grounds:
          - state_machines.Order.DRAFT_to_CANCELLED
          - state_machines.ComponentAllocation.RESERVED_to_RELEASED
        excluded_because:
          difficulty_instance: cancel_release_conserves_on_hand_qty
          rationale: "Cancel -> allocation RELEASED -> component recompute is asserted by the named §1.8 compensating_invariant instance."

  - section: cross_cutting_complexity_layers
    instances:
      - name: reorder_stale_source_returns_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.reorder-supersede-stale-source
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Reorder from a source order with expected_order_version one below the source's current version (a line was added after the snapshot) -> ERR_STALE_VERSION (412); no new order created."
        test_recipe:
          setup: ["A source order with one line; client captures its version, then a SECOND line is added (source version bumps), making the captured version stale."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: Anonymous
            - call: "POST /components"
              payload: { code: "EC-41", name: "Base", on_hand_qty: 20 }
              as: ShopManager
              captures: { comp_id: $.data.id }
            - call: "POST /catalog-products"
              payload: { sku: "EP-41", name: "Plaque", product_type: "PLAQUE", base_price_cents: 4000, engraving_price_per_char_cents: 0, logo_setup_fee_cents: 0, standard_lead_days: 3, bom: [{ component_id: "${comp_id}", qty_per_unit: 1 }] }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "e41@x.com", full_name: "E Fortyone" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_level: "STANDARD", due_date: "2026-07-15T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { src: $.data.id }
            - call: "POST /orders/${src}/lines"
              payload: { catalog_product_id: "${prod_id}", quantity: 1, engraving_text: "ONE" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /orders/${src}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { srcv: $.data.version }
            - call: "POST /orders/${src}/lines"
              payload: { catalog_product_id: "${prod_id}", quantity: 1, engraving_text: "TWO" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${src}/reorder"
              payload: { expected_order_version: "${srcv}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_STALE_VERSION (412)"
            - "Order.${src}.production_status == DRAFT"
            - "Order.${src}.line_count == 2"
