      - name: segregation_of_duties_same_user_rejected
        claim_type: segregation_of_duties
        grounds: ["validations[priority=11]", "errors[ERR_SEGREGATION_OF_DUTIES]", roles]
        distinguishing_aspect: "An OperationsAdmin who filed a claim (X-User-ID ops-9) cannot approve it as the same ops-9: ERR_SEGREGATION_OF_DUTIES (403); a different admin ops-1 can."
        test_recipe:
          setup: ["RETURNED reservation; claim filed by OperationsAdmin ops-9"]
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Cid Dh", email: "cid@x.com", phone: "029" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib AY", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
