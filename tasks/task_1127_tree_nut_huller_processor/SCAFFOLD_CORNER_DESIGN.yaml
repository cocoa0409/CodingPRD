              captures: { lot1: $.data.id }
          trigger:
            - call: "GET /lots/${lot1}"
              as: Grower
              as_user_id: "${g1}"
            - call: "GET /lots/${lot2}"
              as: Grower
              as_user_id: "${g1}"
