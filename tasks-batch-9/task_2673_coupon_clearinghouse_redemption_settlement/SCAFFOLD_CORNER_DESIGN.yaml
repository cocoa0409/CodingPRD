          assert:
            - "trigger call 1: 404 error.code == \"ERR_MANUFACTURER_NOT_FOUND\""
            - "trigger call 2: 404 error.code == \"ERR_RETAILER_NOT_FOUND\""
            - "trigger call 3: 404 error.code == \"ERR_COUPON_ITEM_NOT_FOUND\""
            - "trigger call 4: 404 error.code == \"ERR_PURCHASE_RECORD_NOT_FOUND\""
            - "trigger call 5: 404 error.code == \"ERR_STATEMENT_NOT_FOUND\""
            - "trigger call 6: 404 error.code == \"ERR_INVOICE_NOT_FOUND\""
            - "trigger call 7: 404 error.code == \"ERR_DISPUTE_NOT_FOUND\""
            - "trigger call 8: 404 error.code == \"ERR_CLIP_NOT_FOUND\""
            - "trigger call 9: 404 error.code == \"ERR_REDEMPTION_EVENT_NOT_FOUND\""
            - "every response body follows the §1.0 envelope with data null and a non-blank error.message"

      - name: logical_clock_refuses_a_repeated_or_earlier_instant
        claim_type: triggerable
        grounds:
          - errors.ERR_CLOCK_NOT_MONOTONIC
          - endpoints.POST./_clock/set_current_utc
        distinguishing_aspect: |
          Strict monotonicity means the SAME instant is refused, not just an
          earlier one: after moving to 2026-09-01 the repeat of that exact value
          is a 422 and so is any earlier value, while the next microsecond
          forward is accepted. The refused calls must not run the three sweeps,
          so an offer that expires on 2026-08-31 is still ACTIVE after the
          rejected backward jump and only expires on the accepted forward one.
        test_recipe:
          setup:
            - "one ACTIVE offer expiring 2026-08-31, at the default 2026-08-01 clock"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { mfr_id: $.data.id }
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "SOUP50", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-08-31", redemption_instructions: "Save 50c", barcode_family: "GS1_DATABAR", max_redemptions: 1000 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/register"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /offers/${offer_id}/activate"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "GET /offers/${offer_id}"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "GET /offers/${offer_id}"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
          assert:
            - "trigger call 1: 200 with current_utc \"2026-08-15T00:00:00Z\", expired_offer_count 0 — 2026-08-15 is still inside the offer's life"
            - "trigger call 2: 422 with error.code == \"ERR_CLOCK_NOT_MONOTONIC\" — an equal instant is refused, the comparison is strictly greater"
            - "trigger call 3: 422 with error.code == \"ERR_CLOCK_NOT_MONOTONIC\" — the clock never moves backward"
            - "trigger call 4: the offer is still status \"ACTIVE\" — neither refused call ran a sweep"
            - "trigger call 5: 200 with expired_offer_count 1 — expiration_date 2026-08-31 < 2026-09-01"
            - "trigger call 6: data.status == \"EXPIRED\" and data.barcode_payload is unchanged"

      - name: digital_endpoints_refuse_an_offer_that_is_not_digital_enabled
        claim_type: triggerable
        grounds:
          - errors.ERR_OFFER_NOT_DIGITAL
          - validations.priority_15.ERR_OFFER_NOT_DIGITAL
        distinguishing_aspect: |
          The flag gates both digital endpoints, and it is read from the offer
          rather than from the retailer: the same consumer_ref that is refused on
          the paper-only offer is accepted on the digital one, where the clip
          gets clip_expires_at 2026-09-30 (2026-08-01 + clip_validity_days 60,
