              payload: { artwork_id: "${art_id}", crate_id: "${crate_id}", crew_id: "${crew_id}", origin_location: "Warehouse", destination_location: "Gallery", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", requires_rigging: true, estimated_hours: 2 }
