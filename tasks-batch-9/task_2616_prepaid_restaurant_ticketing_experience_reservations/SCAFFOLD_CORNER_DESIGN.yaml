          assert:
            - "${err_release} == ERR_SERVICE_NOT_PUBLISHED with HTTP 409, even though the logical clock is inside the release window"
            - "${err_close} == ERR_SERVICE_INVALID_STATE with HTTP 409: there is no DRAFT -> CLOSED edge, and the close path is the PUBLISHED-only row"
            - "${err_wl} == ERR_SERVICE_NOT_PUBLISHED with HTTP 409"
            - "${err_resume} == ERR_SERVICE_NOT_PUBLISHED with HTTP 409: resume is listed on the priority-13 rule, so the service check outranks the PAUSED status check"
            - "Service.${svc_id}.status is still DRAFT, release_run_count == 0 and seats_released_total == 0"
            - "TicketClass.${tc_id}.status is still PAUSED"
