              payload: {}
              as: WarehouseOps
              captures: { cver: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_account_version: "${cver}" }
              as: Buyer
              as_user_id: "${acct2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_ACCOUNT_OWNER"

      - name: create_account_invalid_user_header_returns_400
        claim_type: rbac_denial
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "A request carrying an unrecognized X-User-Role value is rejected with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before RBAC."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
