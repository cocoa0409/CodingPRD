            - call: "POST /vessel-jobs/${job_id}/production-welds"
              payload: { weld_number: "W-005", joint_category: "B", joint_type: "BUTT", thickness_in: 2.0000, wps_id: "${wps_id}", part_a_id: "${sh01_id}", part_b_id: "${hd01_id}" }
              as: WeldingEngineer
              as_user_id: "${we1_id}"
              captures: { w5_id: $.data.id, w5_pct: $.data.required_volumetric_pct, w5_method: $.data.volumetric_method }
            - call: "POST /vessel-jobs/${job_id}/production-welds"
              payload: { weld_number: "W-006", joint_category: "C", joint_type: "FILLET", thickness_in: 2.5000, wps_id: "${wps_id}", part_a_id: "${sh01_id}", part_b_id: "${hd01_id}" }
