        grounds: ["validations[priority=6]", "errors[ERR_AUTH_NOT_APPROVED]"]
        distinguishing_aspect: "Scheduling against a PENDING (not APPROVED) authorization returns 409 ERR_AUTH_NOT_APPROVED."
