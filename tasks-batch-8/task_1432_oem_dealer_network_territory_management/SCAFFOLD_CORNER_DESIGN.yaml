          - "errors[ERR_DEALER_NOT_SUSPENDED]"
        distinguishing_aspect: "Reinstate (target ACTIVE) on a dealer already ACTIVE fails with ERR_DEALER_NOT_SUSPENDED."
        test_recipe:
          setup: ["Dealer DL-RS1 ACTIVE"]
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer RS1", dealer_code: "DL-RS1", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-RS1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-RS2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-RS1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
