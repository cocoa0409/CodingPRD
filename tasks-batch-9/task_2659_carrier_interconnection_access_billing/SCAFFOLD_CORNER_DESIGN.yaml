- section: validations
  instances:
  - name: factor_filing_whose_piu_and_plu_exceed_one_hundred_is_refused
    claim_type: violation_to_error
    grounds:
    - validations[priority=20]
    - errors[ERR_FACTOR_SUM_EXCEEDS_TOTAL]
    distinguishing_aspect: |
      Violation claim: the pairwise ceiling is a business_safety rule at priority 20, so 60.00 PIU with 50.00 PLU is refused with ERR_FACTOR_SUM_EXCEEDS_TOTAL even though each field is individually inside its 0.00..100.00 range.
    test_recipe:
      setup:
      - A registered carrier at version 1 with no factor filing.
      - Logical clock at the 2026-08-01T00:00:00Z default.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      trigger:
      - call: POST /interconnection/traffic-factor-filings
        payload:
          carrier_id: ${car_id}
          expected_carrier_version: ${car_v0}
          quarter: 2026Q3
          reported_piu_pct: 60.00
          reported_plu_pct: 50.00
        as: AccessBillingAnalyst
        captures: *id002
      assert:
      - response.status == 422 and response.data.error_id == ERR_FACTOR_SUM_EXCEEDS_TOTAL, not ERR_INVALID_REQUEST
      - GET /interconnection/carriers/${car_id}/traffic-factor-filings returns total_count == 0
      - 'Carrier.${car_id}.version is still 1: the rejected write never bumped the OCC parent'
  - name: factor_filing_whose_piu_and_plu_sum_to_exactly_one_hundred_is_accepted
    claim_type: satisfaction_to_pass
    grounds:
    - validations[priority=20]
    - calculations.jurisdiction_determination
    distinguishing_aspect: |
      Satisfaction claim: the same priority-20 rule uses <=, so 70.00 PIU with 30.00 PLU is accepted, leaves a zero intrastate residual and bumps the OCC parent's version.
    test_recipe:
      setup:
      - A registered carrier at version 1 with no factor filing.
      - Logical clock at the 2026-08-01T00:00:00Z default.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      trigger:
      - call: POST /interconnection/traffic-factor-filings
        payload:
          carrier_id: ${car_id}
          expected_carrier_version: ${car_v0}
          quarter: 2026Q3
          reported_piu_pct: 70.00
          reported_plu_pct: 30.00
        as: AccessBillingAnalyst
        captures:
          ff_id: $.data.id
      assert:
      - response.status == 201 and TrafficFactorFiling.${ff_id}.status == REPORTED
      - TrafficFactorFiling.${ff_id}.effective_piu_pct == 70.00 and effective_plu_pct == 30.00
      - TrafficFactorFiling.${ff_id}.audited_piu_pct is null and audit_completed_at is null
      - 'Carrier.${car_id}.version == 2: the accepted write bumped the OCC parent'
  - name: two_violated_rules_return_the_higher_priority_error
    claim_type: priority_ordering
    grounds:
    - validations[priority=9]
    - validations[priority=28]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / payment_on_draft_invoice_state_beats_fiscal_overpayment
      rationale: The named §1.8 instance violates a priority-9 state rule and a priority-28 fiscal rule in one call and asserts the priority-9 error.
  - name: validity_depending_on_another_entity_is_tested_both_ways
    claim_type: cross_entity_validation
    grounds:
    - validations[priority=26]
    - errors[ERR_NO_EFFECTIVE_TARIFF_RATE]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / batch_rating_requires_effective_tariff_for_every_carried_jurisdiction
      rationale: The named §1.8 instance asserts the rejection while the sibling TariffFiling is FILED and the success once it is EFFECTIVE.
  - name: usage_batch_whose_period_has_not_closed_is_refused
    claim_type: temporal_validation
    grounds:
    - validations[priority=24]
    - errors[ERR_INVALID_USAGE_PERIOD]
    distinguishing_aspect: |
      Temporal claim: a batch period must be strictly before the logical clock, so a period ending 2026-09-30 cannot be exchanged while the clock reads 2026-09-01, even though period_end is strictly after period_start.
    test_recipe:
      setup:
      - A registered carrier.
      - Logical clock at 2026-09-01T00:00:00Z.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      - call: POST /_clock/set_current_utc
        payload:
          target_utc: '2026-09-01T00:00:00.000Z'
        as: PlatformAdmin
      trigger:
      - call: POST /interconnection/usage-batches
        payload:
          carrier_id: ${car_id}
          period_start: '2026-09-01T00:00:00.000Z'
          period_end: '2026-09-30T00:00:00.000Z'
          direction: TERMINATING_TO_US
          exchange_reference: EXG-2026-09-IN
        as: AccessBillingAnalyst
        captures: *id002
      assert:
      - response.status == 422 and response.data.error_id == ERR_INVALID_USAGE_PERIOD
      - GET /interconnection/usage-batches with carrier_id ${car_id} returns total_count == 0
  - name: provisioning_past_the_poi_facility_ceiling_is_refused
    claim_type: aggregate_validation
    grounds:
    - validations[priority=22]
    - errors[ERR_POI_CAPACITY_EXCEEDED]
    distinguishing_aspect: |
      Aggregate claim: each provision quantity is individually legal (a positive multiple of 24) but the POI aggregate over sibling groups sharing (agreement_id, poi_clli_code) must stay within poi_facility_capacity_trunks, so the second group's 24 trunks are refused at a 48-trunk ceiling already fully committed.
    test_recipe:
      setup:
      - An EFFECTIVE agreement whose poi_facility_capacity_trunks is exactly 48.
      - One IN_SERVICE TWO_WAY trunk group at DLLSTXCTDS0 holding all 48 trunks.
      - A second REQUESTED trunk group at the same DLLSTXCTDS0 point of interconnection.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      - call: POST /interconnection/tariff-filings
        payload:
          filing_docket: TF-2026-LOC-001
          rate_element: LOCAL_RECIPROCAL_COMP
          rate_per_mou_usd: 0.061250
          benchmark_interstate_rate_per_mou_usd: 0.512500
          effective_date: '2026-08-01T00:00:00.000Z'
          expiry_date: '2027-01-01T00:00:00.000Z'
        as: RegulatoryAffairsSpecialist
        captures:
          tf_loc_id: $.data.id
      - call: POST /interconnection/tariff-filings/${tf_loc_id}/approve
        payload: {}
        as: RegulatoryAffairsSpecialist
      - call: POST /interconnection/agreements
        payload:
          carrier_id: ${car_id}
