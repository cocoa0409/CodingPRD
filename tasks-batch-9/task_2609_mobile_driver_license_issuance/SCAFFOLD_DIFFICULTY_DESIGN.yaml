      - name: trust_list_snapshots_must_tile_exactly_rejecting_gap_and_overlap
        grounds: "validations priority 21, INTERVAL SEMANTICS B (exact aggregate tiling), errors ERR_TRUST_LIST_WINDOW_OVERLAP (409) and ERR_TRUST_LIST_WINDOW_GAP (422); endpoint POST /mdl/trust-list-snapshots"
        distinguishing_aspect: "A DIFFERENT resource entity (InteropProfile rather than Device) under DIFFERENT interval arithmetic: semantics B demands EQUALITY, so both a one-month overlap and a one-day gap are rejected - and with different error_ids and different statuses - whereas the same adjacency that semantics A merely tolerates is here the one and only acceptable value. A single non-overlap predicate satisfies A but cannot satisfy B."
        test_recipe:
          setup: "One interop profile with a first published snapshot covering [2026-08-01, 2026-12-01)."
          setup_api_calls:
            - call: "POST /mdl/interop-profiles"
              payload: { profile_code: "AAMVA-MDL-2026", standard_version: "ISO_18013_5_2021" }
              as: SystemAdmin
              captures: { profile_id: "$.data.id" }
            - call: "GET /mdl/interop-profiles/${profile_id}"
              payload: {}
              as: SystemAdmin
              captures: { profile_v_one: "$.data.version" }
            - call: "POST /mdl/trust-list-snapshots"
              payload: { interop_profile_id: "${profile_id}", effective_from: "2026-08-01T00:00:00Z", effective_until: "2026-12-01T00:00:00Z", expected_interop_profile_version: "${profile_v_one}" }
              as: SystemAdmin
              captures: { snapshot_one_id: "$.data.id" }
            - call: "GET /mdl/interop-profiles/${profile_id}"
              payload: {}
              as: SystemAdmin
              captures: { profile_v_two: "$.data.version" }
          trigger:
            - call: "POST /mdl/trust-list-snapshots"
              payload: { interop_profile_id: "${profile_id}", effective_from: "2026-11-01T00:00:00Z", effective_until: "2027-04-01T00:00:00Z", expected_interop_profile_version: "${profile_v_two}" }
              as: SystemAdmin
            - call: "POST /mdl/trust-list-snapshots"
              payload: { interop_profile_id: "${profile_id}", effective_from: "2026-12-02T00:00:00Z", effective_until: "2027-04-01T00:00:00Z", expected_interop_profile_version: "${profile_v_two}" }
              as: SystemAdmin
            - call: "POST /mdl/trust-list-snapshots"
              payload: { interop_profile_id: "${profile_id}", effective_from: "2026-12-01T00:00:00Z", effective_until: "2027-04-01T00:00:00Z", expected_interop_profile_version: "${profile_v_two}" }
              as: SystemAdmin
              captures: { snapshot_two_id: "$.data.id" }
            - call: "GET /mdl/interop-profiles/${profile_id}/trust-list-snapshots"
              payload: {}
              as: SystemAdmin
          assert:
            - "the first POST /mdl/trust-list-snapshots in the trigger responds 409 with data.error_id == \"ERR_TRUST_LIST_WINDOW_OVERLAP\""
            - "the second POST /mdl/trust-list-snapshots in the trigger responds 422 with data.error_id == \"ERR_TRUST_LIST_WINDOW_GAP\""
            - "the third POST /mdl/trust-list-snapshots in the trigger responds 201 with data.snapshot_sequence == 2"
            - "the third POST /mdl/trust-list-snapshots in the trigger response data.effective_from == \"2026-12-01T00:00:00Z\""
            - "GET /mdl/interop-profiles/${profile_id}/trust-list-snapshots response data has length 2"
            - "GET /mdl/interop-profiles/${profile_id}/trust-list-snapshots response data[0].effective_until == \"2026-12-01T00:00:00Z\""
            - "GET /mdl/interop-profiles/${profile_id}/trust-list-snapshots response data[1].effective_from == \"2026-12-01T00:00:00Z\""

  # ===========================================================================
  # RULE 9 - compensating_invariant
  # DIFFERENT conserved quantities, each pinned as an explicit formula:
  #   Holder.active_credential_count  and  Verifier.billable_query_balance_cents
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: device_recovery_restores_holder_active_credential_count_exactly
        grounds: "endpoints[POST /mdl/devices/{id}/recover] described as the exact compensating action for POST /mdl/devices/{id}/report-lost; entities.Holder.active_credential_count"
        distinguishing_aspect: "Conserved quantity: Holder.active_credential_count, pinned as `active_credential_count == count(DigitalCredential where holder_id == H.id and lifecycle_state == ACTIVE)` and required to hold the value 1 both before report-lost and after recover, with the intermediate value 0 observed in between. The append-only side of the ledger deliberately does NOT return to its prior value - two RevocationEntry rows and pending_republish_count 2 remain - which is what separates a true compensation of the counter from a naive rollback of everything."
        test_recipe:
          setup: "One ACTIVE credential on a BOUND handset, plus one published trust-list snapshot so the revocation pointer has something to invalidate on both legs."
          setup_api_calls:
            - call: "POST /mdl/interop-profiles"
              payload: { profile_code: "AAMVA-MDL-2026", standard_version: "ISO_18013_5_2021" }
              as: SystemAdmin
              captures: { profile_id: "$.data.id" }
            - call: "POST /mdl/holders"
              payload: { legal_name: "Rosa Ibarra", date_of_birth: "1990-04-11", address_line1: "18 Cedar Row", city: "Waverly", state_code: "NE", postal_code: "68462", physical_credential_number: "NE-4417820", physical_credential_expires_on: "2030-06-30" }
              as: SystemAdmin
              captures: { holder_id: "$.data.id" }
            - call: "POST /mdl/devices"
              payload: { holder_id: "${holder_id}", platform: "ANDROID", model_name: "Pixel 9", hardware_attestation_token: "att-tok-a1", protection_method: "BIOMETRIC" }
              as: SystemAdmin
              captures: { device_id: "$.data.id" }
            - call: "POST /mdl/devices/${device_id}/attest"
              payload: { attestation_result: "PASS", secure_element_grade: "HARDWARE_STRONGBOX" }
              as: SystemAdmin
            - call: "POST /mdl/proofing-sessions"
              payload: { holder_id: "${holder_id}", requested_assurance_level: "IAL2" }
              as: ProofingAgent
              as_user_id: "pa-001"
              captures: { session_id: "$.data.id" }
            - call: "POST /mdl/proofing-sessions/${session_id}/evidence"
              payload: { evidence_type: "DOCUMENT_SCAN", quality: "STRONG", captured_at: "2026-07-20T09:00:00Z", source_reference: "doc-1" }
              as: ProofingAgent
              as_user_id: "pa-001"
            - call: "POST /mdl/proofing-sessions/${session_id}/evidence"
              payload: { evidence_type: "BIOMETRIC_MATCH", quality: "STRONG", captured_at: "2026-07-20T09:05:00Z", source_reference: "bio-1" }
              as: ProofingAgent
              as_user_id: "pa-001"
            - call: "POST /mdl/proofing-sessions/${session_id}/submit"
              payload: {}
              as: ProofingAgent
              as_user_id: "pa-001"
            - call: "POST /mdl/proofing-sessions/${session_id}/adjudicate"
              payload: { decision: "VERIFY" }
              as: CredentialAdjudicator
              as_user_id: "ca-001"
            - call: "GET /mdl/devices/${device_id}"
              payload: {}
              as: SystemAdmin
              captures: { device_v: "$.data.version" }
            - call: "POST /mdl/credentials"
              payload: { holder_id: "${holder_id}", device_id: "${device_id}", proofing_session_id: "${session_id}", valid_from: "2026-08-01T00:00:00Z", valid_until: "2031-07-01T00:00:00Z", expected_device_version: "${device_v}" }
              as: CredentialAdjudicator
              as_user_id: "ca-001"
              captures: { credential_id: "$.data.id" }
            - call: "POST /mdl/credentials/${credential_id}/activate"
              payload: { device_unlock_proof: "BIOMETRIC" }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "GET /mdl/interop-profiles/${profile_id}"
              payload: {}
              as: SystemAdmin
              captures: { profile_v: "$.data.version" }
            - call: "POST /mdl/trust-list-snapshots"
              payload: { interop_profile_id: "${profile_id}", effective_from: "2026-08-01T00:00:00Z", effective_until: "2026-12-01T00:00:00Z", expected_interop_profile_version: "${profile_v}" }
              as: SystemAdmin
              captures: { snapshot_id: "$.data.id" }
            - call: "GET /mdl/holders/${holder_id}"
              payload: {}
              as: SystemAdmin
          trigger:
            - call: "POST /mdl/devices/${device_id}/report-lost"
              payload: {}
              as: Holder
              as_user_id: "${holder_id}"
            - call: "GET /mdl/holders/${holder_id}"
              payload: {}
              as: SystemAdmin
            - call: "POST /mdl/devices/${device_id}/recover"
              payload: { reattestation_token: "reattest-tok-a1" }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "GET /mdl/holders/${holder_id}"
              payload: {}
              as: SystemAdmin
            - call: "GET /mdl/credentials/${credential_id}"
              payload: {}
              as: SystemAdmin
            - call: "GET /mdl/credentials/${credential_id}/revocation-entries"
              payload: {}
              as: PrivacyAuditor
              as_user_id: "pauditor-001"
            - call: "GET /mdl/credentials/${credential_id}/revocation-status"
              payload: {}
              as: PrivacyAuditor
              as_user_id: "pauditor-001"
            - call: "GET /mdl/interop-profiles/${profile_id}"
              payload: {}
              as: SystemAdmin
          assert:
            - "the setup GET /mdl/holders/${holder_id} response data.active_credential_count == 1"
            - "POST /mdl/devices/${device_id}/report-lost responds 200 with data.state == \"LOST_REPORTED\""
            - "the GET /mdl/holders/${holder_id} after report-lost has data.active_credential_count == 0"
            - "POST /mdl/devices/${device_id}/recover responds 200 with data.state == \"BOUND\""
            - "POST /mdl/devices/${device_id}/recover response data.lost_reported_at == null"
            - "the GET /mdl/holders/${holder_id} after recover has data.active_credential_count == 1"
            - "GET /mdl/credentials/${credential_id} response data.lifecycle_state == \"ACTIVE\""
            - "GET /mdl/credentials/${credential_id} response data.suspend_reason == null"
            - "GET /mdl/credentials/${credential_id}/revocation-entries response data has length 2"
            - "GET /mdl/credentials/${credential_id}/revocation-entries response data[0].status == \"SUSPENDED\""
            - "GET /mdl/credentials/${credential_id}/revocation-entries response data[1].status == \"REINSTATED\""
            - "GET /mdl/credentials/${credential_id}/revocation-entries response data[1].sequence == 2"
            - "GET /mdl/credentials/${credential_id}/revocation-status response data.status == \"VALID\""
            - "GET /mdl/interop-profiles/${profile_id} response data.pending_republish_count == 2"

      - name: void_billing_returns_verifier_balance_to_pre_disclosure_value
        grounds: "endpoints[POST /mdl/presentation-sessions/{id}/void-billing].side_effects described as the exact compensating action for the disclose billing side effects; entities.Verifier.billable_query_balance_cents and credited_amount_cents"
        distinguishing_aspect: "A DIFFERENT conserved quantity from the credential counter: Verifier.billable_query_balance_cents, pinned as `sum(PresentationLogEntry.billed_amount_cents for this verifier where billing_state == BILLED)` and required to read 0, then 30, then 0 again. The trap is double subtraction - credited_amount_cents is an audit counterpart and must never be netted out of the balance a second time - and the second invariant is that exposure_index does NOT move, because the exposure formula has no billing filter."
        test_recipe:
          setup: "One ACTIVE credential and one approved verifier with a listed reader app at base_rate_cents 30 under a published trust list, with a presentation session already in CONSENT_GRANTED and no withheld elements so exposure stays 0."
