scenario: |
  Theatrical House Booking, Weekly Grosses & Royalty Pool Settlement (The Shubert Organization): theater availability booking with production companies competing for houses of specific sizes, license agreements setting rent, stop clauses and the terms under which a production can be evicted for underperformance, weekly gross reporting and settlement with house expenses, crew costs and theater share, royalty pool arrangements where creative participants share in weekly operating profit rather than fixed royalties, box office operations including group sales, discount codes and dynamic pricing, union labor requirements with minimum crew sizes by house, load-in and load-out scheduling between productions, capital maintenance on landmark theaters

domain_name: theatrical-house-booking
api_prefix: /theatres

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: ProductionCompany
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Legal name of the production company"
      - name: contact_email
        type: string
        source: input
        description: "Primary contact email"

  - name: Theatre
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "House name"
      - name: capacity
        type: integer
        source: input
        description: "Seating capacity; > 0"
      - name: size_class
        type: enum
        source: input
        description: "SMALL | MEDIUM | LARGE — drives union minimum crew size and base weekly rent"
        constraints: "SMALL | MEDIUM | LARGE"
      - name: is_landmark
        type: boolean
        source: input
        description: "Landmark houses require capital maintenance bookings between dark windows"
      - name: base_weekly_rent_cents
        type: integer
        source: input
        description: "Base weekly rent in cents; >= 0"

  - name: Production
    parent: null
    common_fields: true
    fields:
      - name: company_id
        type: string
        source: input
        description: "FK -> ProductionCompany.id; owning production company"
      - name: title
        type: string
        source: input
        description: "Production title"
      - name: required_size_class
        type: enum
        source: input
        description: "Minimum house size the production can play"
        constraints: "SMALL | MEDIUM | LARGE"
      - name: required_loadin_hours
        type: integer
        source: input
        description: "Consecutive load-in hours needed before opening; > 0"
      - name: required_loadout_hours
        type: integer
        source: input
        description: "Consecutive load-out hours needed after closing; > 0"

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id; production occupying the house"
      - name: theatre_id
        type: string
        source: input
        description: "FK -> Theatre.id; the booked house"
      - name: loadin_start
        type: datetime
        source: input
        description: "Load-in start (ISO 8601 UTC); must be future-dated at request time"
      - name: run_end
        type: datetime
        source: input
        description: "Closing date of the run (load-out begins after); must be > loadin_start"
      - name: status
        type: enum
        source: system
        description: "REQUESTED | APPROVED | DECLINED | WITHDRAWN | ACTIVE | CLOSED | EVICTED | MAINTENANCE_HOLD | DONE"
        constraints: "REQUESTED | APPROVED | DECLINED | WITHDRAWN | ACTIVE | CLOSED | EVICTED | MAINTENANCE_HOLD | DONE"

  - name: LicenseAgreement
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; one license per booking"
      - name: weekly_rent_cents
        type: integer
        source: input
        description: "Agreed weekly rent; defaults to theatre base_weekly_rent_cents if omitted"
        default: null
      - name: stop_clause_weekly_floor_cents
        type: integer
        source: input
        description: "Weekly gross floor below which stop-clause demerits accrue; >= 0"
      - name: stop_clause_consecutive_weeks
        type: integer
        source: input
        description: "Consecutive underperforming weeks that authorize eviction; >= 1"
      - name: status
        type: enum
        source: system
        description: "DRAFT | SIGNED | SUPERSEDED | VOIDED"
        constraints: "DRAFT | SIGNED | SUPERSEDED | VOIDED"

  - name: RoyaltyParticipant
    parent: null
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id; production the participant belongs to"
      - name: participant_name
        type: string
        source: input
        description: "Creative participant name"
      - name: royalty_points
        type: integer
        source: input
        description: "Whole royalty points; per-production total must be in [1, 100] while booking is ACTIVE"
        constraints: "1 <= royalty_points; sum over production <= 100 while booking ACTIVE"
      - name: pool_eligible
        type: boolean
        source: input
        description: "True = royalty-pool participant (shares weekly operating profit); False = fixed-royalty participant"
      - name: fixed_royalty_cents
        type: integer
        source: input
        description: "Fixed weekly royalty in cents; ignored for pool participants"
        default: 0

  - name: DiscountCode
    parent: null
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id; production the code applies to"
      - name: code
        type: string
        source: input
        description: "Code string; unique per production"
      - name: percent_off
        type: number
        source: input
        description: "Discount percent; 0 < percent_off < 100"
      - name: active
        type: boolean
        source: computed
        description: "True until deactivated; set at creation"
        default: true

  - name: TicketOrder
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; booking whose performances are sold"
      - name: performance_date
        type: datetime
        source: input
        description: "Performance date (UTC); used to bucket the order into a settlement week"
      - name: ticket_count
        type: integer
        source: input
        description: "Number of tickets; >= 1"
      - name: is_group_sale
        type: boolean
        source: input
        description: "Group-sale flag; 8+ tickets require it (else business constraint error); fewer than 8 tickets must not set it"
      - name: discount_code_id
        type: string
        source: input
        description: "FK -> DiscountCode.id; optional applied discount code"
        default: null
      - name: dynamic_pricing_factor
        type: number
        source: input
        description: "Multiplier in [0.5, 2.0] applied to face value; defaults to 1.0"
        default: 1.0
      - name: face_value_cents
        type: integer
        source: input
        description: "Per-ticket face value in cents; > 0"
      - name: status
        type: enum
        source: system
        description: "SOLD | REFUNDED"
        constraints: "SOLD | REFUNDED"
      - name: computed_gross_cents
        type: integer
        source: computed
        description: "Line gross after discount and dynamic factor; round per order to integer cents (round_half_up), not after summing"
      - name: refunded
        type: boolean
        source: computed
        description: "True when status is REFUNDED"
        default: false

  - name: WeeklyGrossReport
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; booking the report covers"
      - name: week_start
        type: datetime
        source: input
        description: "Monday 00:00:00Z of the settlement week; one report per booking per week"
      - name: week_end
        type: datetime
        source: computed
        description: "week_start + 7 days; half-open interval [week_start, week_end)"
      - name: status
        type: enum
        source: system
        description: "DRAFT | SUBMITTED | VERIFIED | REJECTED"
        constraints: "DRAFT | SUBMITTED | VERIFIED | REJECTED"
      - name: gross_cents
        type: integer
        source: computed
        description: "Sum of computed_gross_cents over TicketOrders for this booking with status SOLD and performance_date inside [week_start, week_end); provisional at DRAFT, re-derived at SUBMITTED, locked at VERIFIED"
      - name: version
        type: integer
        source: system
        description: "OCC version on the report"

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - name: report_id
        type: string
        source: input
        description: "FK -> WeeklyGrossReport.id; one settlement per report"
      - name: booking_id
        type: string
        source: computed
        description: "FK -> Booking.id; copied from the report"
      - name: house_expenses_cents
        type: integer
        source: input
        description: "Itemized house expenses; >= 0"
      - name: crew_cost_cents
        type: integer
        source: computed
        description: "Weekly crew cost derived from union minimum crew by house size_class"
      - name: theatre_share_cents
        type: integer
        source: computed
        description: "House share: max(weekly_rent_cents, theatre_pct * gross)"
      - name: weekly_operating_profit_cents
        type: integer
        source: computed
        description: "gross - house_expenses - crew_cost - theatre_share - fixed_royalties; may be negative"
      - name: royalty_pool_cents
        type: integer
        source: computed
        description: "Amount distributed to pool participants; 0 when operating profit <= 0"
      - name: status
        type: enum
        source: system
        description: "DRAFT | FINALIZED"
        constraints: "DRAFT | FINALIZED"

  - name: StopNotice
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: computed
        description: "FK -> Booking.id; booking under stop-clause review"
      - name: consecutive_under_floor_weeks
        type: integer
        source: system
        description: "Count of consecutive VERIFIED weeks with gross < stop_clause_weekly_floor_cents"
        default: 0
      - name: status
        type: enum
        source: system
        description: "OPEN | DISCHARGED | EXECUTED"
        constraints: "OPEN | DISCHARGED | EXECUTED"

  - name: CapitalProject
    parent: null
    common_fields: true
    fields:
      - name: theatre_id
        type: string
        source: input
        description: "FK -> Theatre.id; landmark theatre receiving maintenance"
      - name: description
        type: string
        source: input
        description: "Maintenance description"
      - name: window_start
        type: datetime
        source: input
        description: "Maintenance window start (UTC)"
      - name: window_end
        type: datetime
        source: input
        description: "Maintenance window end (UTC); half-open; must be > window_start"
      - name: status
        type: enum
        source: system
        description: "SCHEDULED | COMPLETED | CANCELLED"
        constraints: "SCHEDULED | COMPLETED | CANCELLED"

  - name: CrewAssignment
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; booking the crew is engaged for"
      - name: crew_size
        type: integer
        source: input
        description: "Engaged crew size; must be >= union minimum for the theatre size_class while booking is ACTIVE"
      - name: engaged_at
        type: datetime
        source: system
        description: "Timestamp of engagement"

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Booking
    initial_state: REQUESTED
    terminal_states: [DECLINED, WITHDRAWN, DONE]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /theatres/bookings/{booking_id}/approve"
        actor: HouseManager
        preconditions:
          - "Theatre capacity size_class >= Production.required_size_class"
          - "No APPROVED or ACTIVE booking on the same theatre overlapping [loadin_start, run_end + required_loadout_hours) inclusive of buffers"
          - "No SCHEDULED CapitalProject window overlapping [loadin_start, run_end)"
          - "If theatre is_landmark, at least one SCHEDULED CapitalProject exists on the theatre whose window is disjoint from [loadin_start, run_end) and falls within the 365 days preceding loadin_start or following run_end"
        side_effects:
          - "Competing REQUESTED bookings on the same theatre overlapping the window are DECLINED (cascade)"
          - "Each cascade-DECLINED booking causes its ProductionCompany to be notified (cascade depth 2 marker on declined booking)"

      - from: REQUESTED
        to: DECLINED
        trigger: "POST /theatres/bookings/{booking_id}/decline"
        actor: HouseManager
        preconditions: []
        side_effects: []

      - from: REQUESTED
        to: DECLINED
        trigger: "system (cascade from another booking's approval on the same theatre)"
        actor: system
        preconditions:
          - "Booking overlaps the approved window on the same theatre"
        side_effects:
          - "status -> DECLINED (cascade depth 1)"
          - "ProductionCompany of the declined booking receives a decline notice (cascade depth 2)"

      - from: [REQUESTED, APPROVED]
        to: WITHDRAWN
        trigger: "POST /theatres/bookings/{booking_id}/withdraw"
        actor: CompanyRep
        preconditions:
          - "Acting CompanyRep belongs to the ProductionCompany owning the production"
        side_effects:
          - "LicenseAgreement for the booking (if any, status DRAFT or SIGNED) is VOIDED (cascade)"
          - "Voiding the LicenseAgreement discharges any OPEN StopNotice on the booking (cascade depth 2: StopNotice -> DISCHARGED)"

      - from: APPROVED
        to: ACTIVE
        trigger: "system (logical clock reaches loadin_start)"
        actor: system
        preconditions:
          - "Logical clock >= loadin_start"
          - "A CrewAssignment exists for the booking with crew_size >= union minimum for theatre size_class"
        side_effects:
          - "status -> ACTIVE"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /theatres/bookings/{booking_id}/close"
        actor: CompanyRep
        preconditions:
          - "Acting CompanyRep belongs to owning company"
          - "No WeeklyGrossReport for the booking is in DRAFT or SUBMITTED status"
        side_effects:
          - "status -> CLOSED"

      - from: ACTIVE
        to: EVICTED
        trigger: "POST /theatres/bookings/{booking_id}/execute_stop_notice"
        actor: HouseManager
        preconditions:
          - "An OPEN StopNotice exists for the booking with consecutive_under_floor_weeks >= LicenseAgreement.stop_clause_consecutive_weeks"
        side_effects:
          - "status -> EVICTED"
          - "StopNotice -> EXECUTED (cascade depth 1)"
          - "All future-dated SOLD TicketOrders (performance_date > eviction timestamp) for the booking are REFUNDED (cascade depth 2)"
          - "Each cascade-REFUNDED order reduces the gross of its DRAFT/SUBMITTED WeeklyGrossReport for the affected week (cascade depth 3: recompute via weekly_gross_sum)"

      - from: [CLOSED, EVICTED]
        to: MAINTENANCE_HOLD
        trigger: "system (theatre is landmark and run_end reached)"
        actor: system
        preconditions:
          - "Theatre.is_landmark is true"
          - "A SCHEDULED CapitalProject exists on the theatre with window_start <= run_end + required_loadout_hours < window_end (load-out falls inside the maintenance window)"
        side_effects:
          - "status -> MAINTENANCE_HOLD"

      - from: [CLOSED, EVICTED]
        to: DONE
        trigger: "system (load-out completes for non-landmark theatre, or no maintenance window contains the load-out)"
        actor: system
        preconditions:
          - "Logical clock >= run_end + Production.required_loadout_hours"
          - "Theatre is not landmark, or no SCHEDULED CapitalProject window contains the load-out interval"
        side_effects:
          - "status -> DONE"

      - from: MAINTENANCE_HOLD
        to: DONE
        trigger: "POST /theatres/capital-projects/{project_id}/complete"
        actor: HouseManager
        preconditions:
          - "CapitalProject status is SCHEDULED"
          - "Project window contains the booking's load-out interval"
        side_effects:
          - "CapitalProject -> COMPLETED (cascade depth 1)"
          - "Bookings in MAINTENANCE_HOLD whose load-out fell inside the completed window -> DONE (cascade depth 2)"

  - entity: LicenseAgreement
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, VOIDED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /theatres/license-agreements/{id}/sign"
        actor: CompanyRep
        preconditions:
          - "Booking is APPROVED or ACTIVE"
          - "Acting CompanyRep belongs to owning company"
          - "expected_booking_version matches Booking.version (OCC)"
        side_effects:
          - "Booking.version incremented by 1 (OCC touch)"
          - "LicenseAgreement.version incremented by 1"

      - from: [DRAFT, SIGNED]
        to: SUPERSEDED
        trigger: "POST /theatres/bookings/{booking_id}/license-agreements (new agreement created while one exists)"
        actor: HouseManager
        preconditions:
          - "Booking is APPROVED or ACTIVE"
          - "expected_booking_version matches Booking.version (OCC)"
        side_effects:
          - "Existing DRAFT/SIGNED LicenseAgreement -> SUPERSEDED (cascade)"
          - "Booking.version incremented by 1 (OCC touch)"

      - from: [DRAFT, SIGNED]
        to: VOIDED
        trigger: "system (booking withdrawn or declined)"
        actor: system
        preconditions: []
        side_effects:
          - "OPEN StopNotice on the booking -> DISCHARGED (cascade depth 2 from withdraw)"

  - entity: WeeklyGrossReport
    initial_state: DRAFT
    terminal_states: [VERIFIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /theatres/weekly-gross-reports/{id}/submit"
        actor: CompanyRep
        preconditions:
          - "Booking is ACTIVE"
          - "Acting CompanyRep belongs to owning company"
          - "week_end <= logical clock (the week has fully elapsed)"
        side_effects:
          - "gross_cents re-derived (final variant of weekly_gross_sum) and frozen for review"

      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /theatres/weekly-gross-reports/{id}/verify"
        actor: HouseManager
        preconditions: []
        side_effects:
          - "status -> VERIFIED; gross_cents locked"
          - "If gross_cents < LicenseAgreement.stop_clause_weekly_floor_cents: StopNotice.consecutive_under_floor_weeks += 1 and StopNotice created as OPEN if none exists (cascade)"
          - "If gross_cents >= stop_clause_weekly_floor_cents and an OPEN StopNotice exists: StopNotice -> DISCHARGED (counter reset, cascade)"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /theatres/weekly-gross-reports/{id}/reject"
        actor: HouseManager
        preconditions: []
        side_effects: []

      - from: REJECTED
        to: DRAFT
        trigger: "POST /theatres/weekly-gross-reports/{id}/revise"
        actor: CompanyRep
        preconditions:
          - "Booking is ACTIVE"
        side_effects:
          - "status -> DRAFT; gross_cents re-derived with the provisional variant (cycle: DRAFT -> SUBMITTED -> REJECTED -> DRAFT)"

  - entity: Settlement
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /theatres/settlements/{id}/finalize"
        actor: HouseManager
        preconditions:
          - "WeeklyGrossReport is VERIFIED"
          - "LicenseAgreement for the booking is SIGNED"
          - "RoyaltyParticipant point total for the production is in [1, 100]"
        side_effects:
          - "All settlement computed fields are frozen"

  - entity: StopNotice
    initial_state: OPEN
    terminal_states: [DISCHARGED, EXECUTED]
    transitions:
      - from: OPEN
        to: DISCHARGED
        trigger: "system (a VERIFIED week at/above the stop floor, or license voided)"
        actor: system
        preconditions: []
        side_effects: []

      - from: OPEN
        to: EXECUTED
        trigger: "POST /theatres/bookings/{booking_id}/execute_stop_notice"
        actor: HouseManager
        preconditions:
          - "consecutive_under_floor_weeks >= LicenseAgreement.stop_clause_consecutive_weeks"
        side_effects:
          - "Booking -> EVICTED (cascade; see Booking state machine for depth-2/3 effects)"

  - entity: CapitalProject
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /theatres/capital-projects/{id}/complete"
        actor: HouseManager
        preconditions: []
        side_effects:
          - "Bookings in MAINTENANCE_HOLD with load-out inside the window -> DONE (cascade)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /theatres/capital-projects/{id}/cancel"
        actor: HouseManager
        preconditions:
          - "No booking in MAINTENANCE_HOLD depends on this window (ERR_CAPITAL_PROJECT_IN_USE)"
        side_effects: []

  - entity: TicketOrder
    initial_state: SOLD
    terminal_states: [REFUNDED]
    transitions:
      - from: SOLD
        to: REFUNDED
        trigger: "POST /theatres/ticket-orders/{id}/refund"
        actor: BoxOfficeAgent
        preconditions:
          - "status is SOLD"
        side_effects:
          - "status -> REFUNDED; refunded = true"
          - "WeeklyGrossReport covering performance_date, if still DRAFT or SUBMITTED, has gross_cents recomputed (provisional variant) (cascade)"

      - from: SOLD
        to: REFUNDED
        trigger: "system (booking eviction cascade)"
        actor: system
        preconditions:
          - "performance_date is strictly after the eviction timestamp"
        side_effects:
          - "status -> REFUNDED; owning DRAFT/SUBMITTED report gross recomputed (cascade depth 3 from execute_stop_notice)"

# =============================================================================
# Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: license-create-stale-booking
    parent_entity: Booking
    write_endpoint: "POST /theatres/bookings/{booking_id}/license-agreements"
    occ_field: "expected_booking_version"
    description: |
      Creating a LicenseAgreement against a Booking whose version has advanced
      since the client last observed it is rejected, because a new agreement
      legitimately supersedes the existing one and the client's view of which
      agreement is current is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: license-sign-stale-booking
    parent_entity: Booking
    write_endpoint: "POST /theatres/license-agreements/{id}/sign"
    occ_field: "expected_booking_version"
    description: |
      Signing a LicenseAgreement while carrying a Booking version that has
      advanced since the client last observed the booking is rejected; the
      booking may have gained a superseding agreement in the meantime.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: ticket_order_gross
    trigger: "ticket order creation (and re-derivation on refund analysis)"
    algorithm: aggregation
    formula: |
      per_order_gross_cents = round_half_up_to_integer_cents(
          ticket_count * face_value_cents * dynamic_pricing_factor * (1 - percent_off/100)
      )
      where percent_off = applied DiscountCode.percent_off, or 0 if none.
      Rounding order is pinned: apply the discount factor and dynamic factor to the
      raw whole-order value, THEN round once to integer cents (round_half_up).
      Do NOT round per-ticket then multiply, and do NOT sum raw values and round
      at the report level.
    input_set: "single TicketOrder at creation"
    constants:
      MIN_DYNAMIC_FACTOR: 0.5
      MAX_DYNAMIC_FACTOR: 2.0
    precision: "integer cents, round_half_up; rounding pinned per-order before any aggregation"

  - name: weekly_gross_sum
    trigger: "report create (provisional), report submit (final), refund cascade recompute (provisional)"
    algorithm: aggregation
    formula: |
      gross_cents = sum over TicketOrder t where
        t.booking_id == report.booking_id
        AND t.status == SOLD
        AND t.performance_date in [week_start, week_end)   # half-open
      of t.computed_gross_cents
    input_set: "TicketOrders with status SOLD only; REFUNDED excluded; half-open weekly window [week_start, week_end)"
    precision: "integer cents; each order's computed_gross_cents was already rounded per-order"
    variants:
      - name: provisional
        when: "report in DRAFT (including after REJECTED -> DRAFT revise) and on refund cascade recompute"
        difference: "computed live from the current order set each time; a later refund or new sale changes it"
      - name: final
        when: "on submit and verify"
        difference: "re-derived once at submit and then frozen; identical inputs at submit and verify yield identical gross, but provisional DRAFT gross for the same data can differ from the submitted value if orders changed in between"

  - name: weekly_crew_cost
    trigger: "settlement creation"
    algorithm: threshold
    formula: |
      crew_min = UNION_MIN_CREW[theatre.size_class]   # SMALL:4, MEDIUM:8, LARGE:14
      engaged = max(crew_min, CrewAssignment.crew_size)  # if assignment exists; else crew_min
      crew_cost_cents = engaged * CREW_WEEKLY_RATE_CENTS
    input_set: "CrewAssignment for the booking (latest by engaged_at; tie-break: created_at ASC); theatre size_class"
    constants:
      UNION_MIN_CREW_SMALL: 4
      UNION_MIN_CREW_MEDIUM: 8
      UNION_MIN_CREW_LARGE: 14
      CREW_WEEKLY_RATE_CENTS: 120000
    precision: "integer cents"

  - name: weekly_settlement_split
    trigger: "settlement creation and finalize"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is pinned to break the circular-looking dependency
      # (theatre share depends on gross; profit depends on share; pool depends on profit):
      # 1) gross
      # 2) crew_cost (see weekly_crew_cost)
      # 3) fixed_royalties = sum of fixed_royalty_cents over participants with pool_eligible == false
      # 4) theatre_share = max(weekly_rent_cents, round_half_up_to_integer_cents(THEATRE_GROSS_PCT * gross_cents))
      # 5) weekly_operating_profit = gross - house_expenses - crew_cost - theatre_share - fixed_royalties
      # 6) royalty_pool = round_half_up_to_integer_cents(POOL_SHARE_PCT * max(0, weekly_operating_profit))
      # 7) per pool participant p: p.payout = floor(royalty_pool * p.royalty_points / total_pool_points)
      #    with the rounding remainder allocated one cent at a time to participants
      #    ranked by royalty_points DESC, tie-break participant created_at ASC.
    input_set: "VERIFIED WeeklyGrossReport.gross_cents; SIGNED LicenseAgreement.weekly_rent_cents; RoyaltyParticipants of the production (pool_eligible true for the pool split, false for fixed); house_expenses input"
    constants:
      THEATRE_GROSS_PCT: 0.30
      POOL_SHARE_PCT: 0.65
    precision: "integer cents, round_half_up; pool payout remainder pinned to points DESC then created_at ASC"

  - name: stop_clause_counter
    trigger: "weekly gross report verify"
    algorithm: threshold
    formula: |
      if gross_cents < LicenseAgreement.stop_clause_weekly_floor_cents:
          consecutive_under_floor_weeks += 1   # strict less-than: a week exactly AT the floor does NOT increment
          create StopNotice OPEN if none exists for the booking
      else:
          consecutive_under_floor_weeks = 0
          StopNotice OPEN -> DISCHARGED
      Eviction is authorized when consecutive_under_floor_weeks >= stop_clause_consecutive_weeks (inclusive).
    input_set: "VERIFIED report gross; SIGNED LicenseAgreement floor and week threshold"
    precision: "integer weeks; boundary is strict < for accrual and inclusive >= for eviction authority"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is authorized for the endpoint"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 2
    category: existence
    check: "Path resources exist, validated left-to-right (booking, report, agreement, order, project)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 3
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "state transition endpoints"

  - priority: 4
    category: business_safety
    check: "Union minimum crew satisfied: CrewAssignment.crew_size >= UNION_MIN_CREW[theatre.size_class] before booking activation and on settlement crew-cost derivation"
    error_id: ERR_UNION_MIN_CREW_VIOLATION
    http_status: 422
    applies_to: "crew assignment create; booking activation; settlement create"

  - priority: 5
    category: business_temporal
    check: "Booking window does not overlap another APPROVED/ACTIVE booking on the same theatre (load-in and load-out buffers included, half-open intervals; touching boundaries allowed), and does not overlap a SCHEDULED CapitalProject window (closed-interval contact on the performance run conflicts)"
    error_id: ERR_BOOKING_WINDOW_CONFLICT
    http_status: 409
    applies_to: "booking create; booking approve"

  - priority: 6
    category: business_referential
    check: "Theatre.size_class >= Production.required_size_class on booking create"
    error_id: ERR_SIZE_CLASS_MISMATCH
    http_status: 422
    applies_to: "booking create"

  - priority: 6
    category: business_referential
    check: "DiscountCode applied to a ticket order belongs to the same production as the order's booking and is active"
    error_id: ERR_DISCOUNT_CODE_INVALID
    http_status: 422
    applies_to: "order create"

  - priority: 6
    category: business_referential
    check: "One weekly gross report per booking per week_start (uniqueness)"
    error_id: ERR_REPORT_WEEK_DUPLICATE
    http_status: 409
    applies_to: "report create"

  - priority: 7
    category: business_constraint
    check: "Field-level business constraints: dynamic_pricing_factor in [0.5, 2.0]; group-sale flag coherence (>=8 tickets requires is_group_sale true; <8 tickets requires false); royalty point totals within bounds"
    error_id: ERR_BUSINESS_CONSTRAINT_VIOLATION
    http_status: 422
    applies_to: "order create; participant create"

  - priority: 8
    category: business_fiscal
    check: "Fiscal guardrails: house_expenses_cents >= 0; weekly_rent_cents >= 0; royalty pool cannot exceed weekly operating profit; fixed royalties deducted before pool computation"
    error_id: ERR_FISCAL_GUARD_VIOLATION
    http_status: 422
    applies_to: "license create; settlement create; settlement finalize"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
