      - name: audit_materiality_threshold_at_exactly_five_percent
        claim_type: threshold
        grounds:
          - state_machines[ArtistStatement.status].transitions[FINALIZED->REVISED]
          - entities.ArtistStatement.audit_cost_bearer
          - entities.ArtistStatement.revision_count
          - endpoints[POST /artist-statements/{id}/conclude-audit]
        distinguishing_aspect: |
          The materiality gate is round_half_up(net_payable_cents * 0.05) tested with abs() and >=.
          Two FINALIZED FINAL statements on the same release read the same 600000 physical base at
          0.5000 and 0.2500, so their net payables are 55000 (threshold 2750) and 127500 (threshold
          6375). A 2749-cent finding is immaterial: the statement stays FINALIZED and the artist
          bears the cost. A 6375-cent finding is EXACTLY at the threshold and must reopen the
          statement to REVISED with audit_cost_bearer LABEL. A `>` gate, a percentage taken on
          gross_royalty_cents, or a per-statement constant threshold all fail one of the two.
