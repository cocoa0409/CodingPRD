errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state permitting the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version mismatch on HangarSlot or Discrepancy" }
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "Hangar slot half-open interval intersects existing RESERVED/OCCUPIED slot for same hangar_code" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "ends_at <= starts_at or slot exceeds 30 days" }
  - { id: ERR_MECHANIC_OVERBOOKED, http: 409, condition: "Labor entry would push mechanic's same-day cumulative + buffer over 10 billable hours" }
  - { id: ERR_TRACEABILITY_MISSING, http: 422, condition: "OVERHAUL/SERVICEABLE part lacks trace_doc_ref at sourcing or install" }
  - { id: ERR_AIRWORTHINESS_BLOCKED, http: 422, condition: "Regulatory gate failed: open AD, unrectified AIRWORTHINESS discrepancy, SoD violation on verify, or missing IA for ANNUAL signoff" }
  - { id: ERR_OWNER_DECISION_REQUIRED, http: 422, condition: "Discrepancy at-or-above owner cap requires owner decision; non-owner decide attempt" }
  - { id: ERR_INVOICE_LOCKED, http: 409, condition: "Mutation attempted on WO whose invoice is ISSUED or PAID" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed input: missing required field, invalid enum, quantity < 1, duration_tenths not positive multiple of 3" }
  - { id: ERR_CHECKLIST_INCOMPLETE, http: 422, condition: "complete-inspection with any ChecklistItem still PENDING, or ANNUAL with all items NA" }
  - { id: ERR_DUPLICATE_INVOICE, http: 409, condition: "Second active (non-VOIDED) invoice for same WorkOrder" }
  - { id: ERR_CERTIFICATE_INSUFFICIENT, http: 422, condition: "Mechanic certificate_class insufficient for operation (IA required)" }

roles:
  - name: ShopManager
    description: "Repair-station manager; administrative and scheduling authority"
    identity: opaque
    exclusive_operations:
      - "POST /api/owners, /api/aircraft, /api/mechanics, /api/hangar-slots"
      - "POST /api/work-orders, /schedule, /close, /cancel"
      - "POST /api/invoices/{id}/issue, /void"
      - "POST /api/_clock/set_current_utc"
    shared_operations: ["GET endpoints"]
  - name: Mechanic
    description: "Certificated A&P or IA technician performing inspection and repair"
    identity: "entity_backed:Mechanic"
    exclusive_operations:
      - "Work-order lifecycle actions: /start, /complete-inspection, /submit-for-approval, /begin-work, /ready-for-rts, /return-to-service"
      - "Checklist record, labor entries, rectify, verify"
      - "POST /api/logbook-entries, /api/directives/{id}/evaluate, /api/parts/{id}/install"
    shared_operations: ["GET work-orders, aircraft, parts, hangar-slots, directives"]
  - name: Owner
    description: "Aircraft owner approving or deferring discrepancies and paying invoices"
    identity: "entity_backed:Owner"
    exclusive_operations:
      - "POST /api/discrepancies/{id}/decide"
      - "POST /api/work-orders/{id}/reopen-inspection"
      - "POST /api/invoices/{id}/pay"
    shared_operations: ["GET own aircraft, work-orders, invoices, logbook entries"]
  - name: PartsClerk
    description: "Parts room clerk managing sourcing and receiving"
    identity: opaque
    exclusive_operations:
      - "POST /api/parts/{id}/mark-sourced, /receive, /return"
    shared_operations: ["POST /api/parts", "GET parts, mechanics"]
