              payload: { licensee_id: "${lic_id}", full_name: "Priya Raman", role_title: "CFO", direct_ownership_bps: 0 }
              as: LicensingManager
              captures: { cp_id: "$.data.id", det: "$.data.control_determination", bg: "$.data.background_check_status" }
          assert:
            - "HTTP 201; ${det} == CONTROL and ${bg} == PENDING"
            - "ControlPerson.${cp_id}.effective_ownership_bps == 0 and attributed_ownership_bps == 0"
            - "Licensee.${lic_id}.control_chain_status == PENDING_CHECKS"

      - name: removed_ancestor_zeroes_both_ownership_variants_downstream
        claim_type: constraint_propagation
        grounds:
          - calculations.control_person_ownership_attribution.input_set
          - endpoints[POST /control-persons/{id}/background-check-adjudication]
          - entities.ControlPerson.fields.attributed_ownership_bps
        distinguishing_aspect: "Removing the intermediate holder re-runs the propagation for the descendant: the child's effective_ownership_bps falls 2400 -> 0 and attributed_ownership_bps falls 4000 -> 0, flipping it to NON_CONTROL and clearing the licensee's chain to VERIFIED."
        test_recipe:
          setup:
            - "Jurisdiction CA and one licensee with a SUBMITTED CA application, which puts CA in scope for control-person adjudications."
            - "Holdco chain: root Dana Whitfield at 6000 bps, child Ravi Menon at 4000 bps under her."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "CA", name: "California DFPI", min_net_worth_cents: 50000000, base_bond_cents: 5000000, per_delegate_bond_cents: 100000, bond_cap_cents: 40000000, response_window_days: 15, renewal_fee_cents: 500000, assessment_rate_bps: 25, call_report_frequency: "QUARTERLY", participates_in_multistate: true }
              as: PlatformAdmin
              captures: { ca_id: "$.data.id" }
            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC", ein: "74-1100001", reported_tangible_net_worth_cents: 500000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_id: "$.data.id" }
            - call: "POST /license-applications"
              payload: { licensee_id: "${lic_id}", jurisdiction_id: "${ca_id}", license_class: "MONEY_TRANSMISSION", projected_annual_volume_cents: 90000000, new_product_narrative: "Domestic P2P transfers." }
              as: LicensingManager
              captures: { app_id: "$.data.id" }
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensingManager
            - call: "POST /control-persons"
              payload: { licensee_id: "${lic_id}", full_name: "Dana Whitfield", role_title: "ENTITY_HOLDER", direct_ownership_bps: 6000 }
              as: LicensingManager
              captures: { root_id: "$.data.id" }
            - call: "POST /control-persons"
              payload: { licensee_id: "${lic_id}", full_name: "Ravi Menon", role_title: "ENTITY_HOLDER", direct_ownership_bps: 4000, parent_control_person_id: "${root_id}" }
              as: LicensingManager
              captures: { child_id: "$.data.id" }
          trigger:
            - call: "POST /control-persons/${root_id}/background-check-adjudication"
              payload: { outcome: "ADVERSE", disqualifying_finding: true }
              as: StateRegulator
              as_user_id: "${ca_id}"
            - call: "GET /control-persons/${child_id}"
              as: LicensingManager
              captures: { eff: "$.data.effective_ownership_bps", attr: "$.data.attributed_ownership_bps", det: "$.data.control_determination", bg: "$.data.background_check_status" }
          assert:
            - "before the trigger: ControlPerson.${child_id}.effective_ownership_bps == 2400, attributed_ownership_bps == 4000, control_determination == CONTROL"
            - "trigger call 1: HTTP 200; ControlPerson.${root_id}.status == REMOVED and background_check_status == ADVERSE"
            - "${eff} == 0 and ${attr} == 0 and ${det} == NON_CONTROL and ${bg} == NOT_REQUIRED"
            - "Licensee.${lic_id}.control_chain_status == VERIFIED (the REMOVED root is excluded and the child is no longer CONTROL)"

  - section: validations
