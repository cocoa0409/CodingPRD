              as: ProjectAccountant
              as_user_id: "acct-001"
              captures: { te_a: $.data.id }
            - call: "POST /time-entries/${te_a}/approve"
              payload: {}
              as: ProjectManager
              as_user_id: "pm-001"
            - call: "POST /time-entries"
              payload: { project_id: "${p_id}", phase_id: "${ph_id}", role_code: "PROJECT_ARCHITECT", work_date: "2026-05-12", hours: 10.00 }
              as: ProjectAccountant
              as_user_id: "acct-001"
