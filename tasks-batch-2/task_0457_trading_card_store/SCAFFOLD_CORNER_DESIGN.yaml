            - call: "POST /customers/${ca}/credit-adjustments"
              payload: { delta_cents: 5000 }
              as: StoreManager
            - call: "POST /customers/${cb}/credit-adjustments"
              payload: { delta_cents: 5000 }
              as: StoreManager
            - call: "POST /release-products"
              payload: { title: "Stale Box", street_date: "2026-09-01T00:00:00Z", allocation_pool: 10, unit_price_cents: 1000, deposit_required_cents: 500 }
              as: StoreManager
              captures: { rp: $.data.id, rpv0: $.data.version }
            - call: "POST /pre-orders"
              payload: { customer_id: "${ca}", release_product_id: "${rp}", requested_quantity: 1, deposit_paid_cents: 500 }
              as: Customer
              as_user_id: "${ca}"
              captures: { poa: $.data.id }
            - call: "POST /pre-orders"
              payload: { customer_id: "${cb}", release_product_id: "${rp}", requested_quantity: 1, deposit_paid_cents: 500 }
              as: Customer
              as_user_id: "${cb}"
              captures: { pob: $.data.id }
            - call: "POST /pre-orders/${poa}/allocate"
              payload: { expected_release_product_version: "${rpv0}" }
              as: StoreManager
          trigger:
            - call: "POST /pre-orders/${pob}/allocate"
              payload: { expected_release_product_version: "${rpv0}" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"
            - "response.status == 412"

      - name: preorder_deposit_debits_store_credit
        claim_type: derived_field_reconciliation
        grounds: ["entities.Customer.fields.store_credit_balance_cents", "calculations.store_credit_balance"]
        distinguishing_aspect: "Creating a pre-order with deposit_paid_cents=1000 appends a PREORDER_DEPOSIT ledger row delta=-1000; customer balance drops from 6000 to 5000."
        test_recipe:
          setup: ["A customer granted 6000 credit; one PRE_ORDER_OPEN release."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { display_name: "Dep Cust", email: "dep@x.com" }
              as: StoreManager
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/credit-adjustments"
              payload: { delta_cents: 6000 }
              as: StoreManager
            - call: "POST /release-products"
              payload: { title: "Dep Box", street_date: "2026-09-01T00:00:00Z", allocation_pool: 10, unit_price_cents: 1000, deposit_required_cents: 1000 }
              as: StoreManager
              captures: { rp: $.data.id }
          trigger:
            - call: "POST /pre-orders"
              payload: { customer_id: "${cust}", release_product_id: "${rp}", requested_quantity: 1, deposit_paid_cents: 1000 }
              as: Customer
              as_user_id: "${cust}"
              captures: { po: $.data.id }
          assert:
            - "Customer.${cust}.store_credit_balance_cents == 5000"
            - "PreOrder.${po}.deposit_paid_cents == 1000"

