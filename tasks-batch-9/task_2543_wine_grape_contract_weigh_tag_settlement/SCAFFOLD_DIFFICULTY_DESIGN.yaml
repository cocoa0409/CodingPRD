            - "Load 2 SettlementLine: price_per_ton_cents == 456750 and gross_amount_cents == 10048500"
            - "Load 3 (Brix 21.9 is below brix_penalty_start yet only 0.1 below it): brix_component_pct == 0.0 because floor(1/5) == 0 steps, acid_component_pct == -3.0, rot_component_pct == -1.5, mog_component_pct == -2.5, adjustment_pct == -7.0"
            - "Load 3 SettlementLine: price_per_ton_cents == 418500 and gross_amount_cents == 9207000"
            - "All three loads keep net_tons == 22.000 and disposition == ACCEPTED; none is rejected, since Brix 21.9 is still at or above min_brix_accept 20.0 and rot 3.0 is below rot_rejection_pct 8.0"
            - "GrapeContract.${contract_id}.delivered_contract_tons == 66.000 and tonnage_status == CAP_REACHED, hitting contract_cap_tons 66.000 exactly"
            - "GrapeContract.${contract_id}.provisional_settlement_cents == 17493300"

  # ===========================================================================
  # RULE 7 — cross-entity state dependencies (three different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: pick_call_issuance_requires_completed_pick_ready_sampling_visit
        entity_pair: "PickCall depends on SamplingVisit"
        grounds:
          - validations.priority_32
          - entities.SamplingVisit.fields.maturity_flag
          - state_machines.SamplingVisit.SCHEDULED_to_COMPLETED
          - entities.VineyardBlock.fields.latest_sampling_brix
        distinguishing_aspect: |
          Pair 1: PickCall <- SamplingVisit. Whether a pick call may be issued at all depends on
          a DIFFERENT entity being in state COMPLETED with maturity_flag PICK_READY for the same
          contract. Three probes separate the two conditions: no visit at all fails; a visit that
          exists but is still SCHEDULED fails; a COMPLETED visit whose measured_brix 20.0 is
          below min_brix_pick_call 21.0 is IMMATURE and still fails; only a COMPLETED PICK_READY
          visit lets the pick call through.
        test_recipe:
          setup:
            - "Producer, block, reference QualitySpec with min_brix_pick_call 21.0, crew SC-1 in region NAPA-NORTH, ACTIVE contract with one allocation."
            - "No sampling visit exists at first; then a SCHEDULED one; then a COMPLETED but IMMATURE one; then a COMPLETED PICK_READY one."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T08:00:00Z" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/growers"
              payload: { name: "Ridgeline Vineyards", license_number: "PL-44821", region_code: "NAPA-NORTH" }
              as: GrowerRelationsManager
              captures: { grower_id: $.data.id }
            - call: "POST /grower-relations/vineyard-blocks"
              payload: { grower_id: "${grower_id}", block_code: "B-12", varietal: "CABERNET_SAUVIGNON", acres: 20.000, expected_yield_tons_per_acre: 2.000, ava_code: "NAPA-VALLEY" }
              as: GrowerRelationsManager
              captures: { block_id: $.data.id }
            - call: "POST /grower-relations/quality-specs"
              payload: { spec_code: "CAB-STD-2026", min_brix_accept: 20.0, brix_bonus_start: 24.0, brix_penalty_start: 22.0, rot_rejection_pct: 8.0, min_brix_pick_call: 21.0 }
              as: GrowerRelationsManager
              captures: { spec_id: $.data.id }
            - call: "POST /grower-relations/sampling-crews"
              payload: { crew_code: "SC-1", region_code: "NAPA-NORTH", max_concurrent_visits: 2 }
              as: HarvestCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /grower-relations/grape-contracts"
              payload: { grower_id: "${grower_id}", quality_spec_id: "${spec_id}", contract_code: "GC-MATURITY", contract_basis: "TONNAGE", base_price_per_ton_cents: 450000, over_delivery_policy: "ACCEPT_AT_SPOT", term_start_vintage: 2026, term_end_vintage: 2028, committed_tons: 40.000, installment_plan: [{ installment_no: 1, pct_of_settlement: 100.0, due_offset_days: 30, lien_protected: true }] }
              as: GrowerRelationsManager
              captures: { contract_id: $.data.id }
            - call: "POST /grower-relations/contract-block-allocations"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_id}/offer"
              payload: {}
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_id}/accept"
              payload: {}
              as: Grower
              as_user_id: "${grower_id}"
          trigger:
            - call: "POST /grower-relations/pick-calls"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}", target_pick_at: "2026-08-25T14:00:00Z", estimated_tons: 40.000 }
              as: HarvestCoordinator
            - call: "POST /grower-relations/sampling-visits"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}", crew_id: "${crew_id}", window_start: "2026-08-20T09:00:00Z", window_end: "2026-08-20T11:00:00Z" }
              as: HarvestCoordinator
              captures: { visit_1_id: $.data.id }
            - call: "POST /grower-relations/pick-calls"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}", target_pick_at: "2026-08-25T14:00:00Z", estimated_tons: 40.000 }
              as: HarvestCoordinator
            - call: "POST /grower-relations/sampling-visits/${visit_1_id}/record"
              payload: { measured_brix: 20.0, measured_ta_gl: 6.5, measured_ph: 3.20, measured_rot_pct: 1.0 }
              as: HarvestCoordinator
            - call: "POST /grower-relations/pick-calls"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}", target_pick_at: "2026-08-25T14:00:00Z", estimated_tons: 40.000 }
              as: HarvestCoordinator
            - call: "POST /grower-relations/sampling-visits"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}", crew_id: "${crew_id}", window_start: "2026-08-20T12:00:00Z", window_end: "2026-08-20T14:00:00Z" }
              as: HarvestCoordinator
