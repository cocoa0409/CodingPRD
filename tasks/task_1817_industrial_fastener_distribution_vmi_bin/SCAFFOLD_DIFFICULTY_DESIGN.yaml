scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_pricing_unit_vs_flat_bin_same_inputs
        grounds:
          - calculations.order_pricing
          - entities.ReplenishmentOrder.fields.total_price_cents
          - entities.BinAgreement.fields.pricing_mode
        distinguishing_aspect: |
          Pricing domain on ReplenishmentOrder: two agreements over the same
          part with identical counted_qty and ordered_qty produce different
          total_price_cents because one prices UNIT_PRICE (qty x tiered unit)
          and the other COST_PER_BIN (flat per-trip fee).
        test_recipe:
          setup:
            - "Site S (credit 100000000), part P (unit_price_cents=1000, not critical, stock 100000)"
            - "Agreement AU: UNIT_PRICE, min 10, max 600 (so a count of 100 yields ordered_qty 500 -> tier2 unit 950, total 475000)"
            - "Agreement AB: COST_PER_BIN, flat_bin_price_cents=7500, min 10, max 600 (same count yields total 7500)"
            - "Route started; two stops each scanned at counted_qty=100"
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S", ship_to_code: "SHP-S1", credit_limit_cents: 100000000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "SKU-P1", description: "M8 hex bolt", is_critical: false, unit_price_cents: 1000, total_stock_qty: 100000 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${part_id}", bin_location: "A1", pricing_mode: "UNIT_PRICE", min_qty: 10, max_qty: 600 }
              as: DistributorAdmin
              captures: { agr_u_id: $.data.id }
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${part_id}", bin_location: "A2", pricing_mode: "COST_PER_BIN", flat_bin_price_cents: 7500, min_qty: 10, max_qty: 600 }
              as: DistributorAdmin
              captures: { agr_b_id: $.data.id }
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v: $.data.version }
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-10T00:00:00Z", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z", expected_site_version: "${site_v}" }
              as: DistributorAdmin
              captures: { route_id: $.data.id }
            - call: "POST /vmi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: DistributorAdmin
            - call: "POST /vmi/routes/${route_id}/start"
              payload: {}
              as: RouteDriver
            - call: "POST /vmi/routes/${route_id}/stops"
              payload: { bin_agreement_id: "${agr_u_id}" }
              as: RouteDriver
              captures: { stop_u_id: $.data.id }
            - call: "POST /vmi/routes/${route_id}/stops"
              payload: { bin_agreement_id: "${agr_b_id}" }
              as: RouteDriver
              captures: { stop_b_id: $.data.id }
          trigger:
            - call: "POST /vmi/route-stops/${stop_u_id}/submit"
              payload: { counted_qty: 100 }
              as: RouteDriver
              captures: { order_u_id: $.data.generated_order_id }
            - call: "POST /vmi/route-stops/${stop_b_id}/submit"
              payload: { counted_qty: 100 }
              as: RouteDriver
              captures: { order_b_id: $.data.generated_order_id }
          assert:
            - "ReplenishmentOrder.${order_u_id}.ordered_qty == 500"
            - "ReplenishmentOrder.${order_u_id}.unit_price_cents == 950"
            - "ReplenishmentOrder.${order_u_id}.total_price_cents == 475000"
            - "ReplenishmentOrder.${order_b_id}.ordered_qty == 500"
            - "ReplenishmentOrder.${order_b_id}.unit_price_cents == 0"
            - "ReplenishmentOrder.${order_b_id}.total_price_cents == 7500"

      - name: sizing_recommendation_trailing_vs_projected
        grounds:
          - calculations.bin_sizing_recommendation
          - entities.RouteStop.fields.generated_order_id
        distinguishing_aspect: |
          Sizing domain on BinAgreement (distinct from the order-pricing
          domain): identical scan history yields recommended_min 30 vs 39
          because the PROJECTED variant double-weights the one week whose stop
          generated an order while TRAILING averages all weeks equally.
        test_recipe:
          setup:
            - "Site S, part P (unit 1000, stock 100000)"
            - "Agreement AG: UNIT_PRICE, min_qty 25, max_qty 200"
            - "Five weekly stops submitted with counts 100, 90, 80, 70, 20 (usages 10,10,10,50; only the last stop at 20 < 25 generates an order)"
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S2", ship_to_code: "SHP-S2", credit_limit_cents: 100000000, delivery_mode: "LINE_SIDE" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "SKU-P2", description: "M10 nut", is_critical: false, unit_price_cents: 1000, total_stock_qty: 100000 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${part_id}", bin_location: "B1", pricing_mode: "UNIT_PRICE", min_qty: 25, max_qty: 200 }
              as: DistributorAdmin
              captures: { agr_id: $.data.id }
            # week 1 (baseline, count 100 — establishes on_hand, no usage recorded for this stop)
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v1: $.data.version }
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-03T00:00:00Z", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T12:00:00Z", expected_site_version: "${site_v1}" }
              as: DistributorAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /vmi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: DistributorAdmin
            - call: "POST /vmi/routes/${r1_id}/start"
              payload: {}
              as: RouteDriver
            - call: "POST /vmi/routes/${r1_id}/stops"
              payload: { bin_agreement_id: "${agr_id}" }
              as: RouteDriver
              captures: { s1_id: $.data.id }
            - call: "POST /vmi/route-stops/${s1_id}/submit"
              payload: { counted_qty: 100 }
              as: RouteDriver
            - call: "POST /vmi/routes/${r1_id}/close"
              payload: {}
              as: RouteDriver
            # week 2, count 90
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v2: $.data.version }
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-04T00:00:00Z", window_start: "2026-08-04T08:00:00Z", window_end: "2026-08-04T12:00:00Z", expected_site_version: "${site_v2}" }
              as: DistributorAdmin
              captures: { r2_id: $.data.id }
            - call: "POST /vmi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: DistributorAdmin
            - call: "POST /vmi/routes/${r2_id}/start"
              payload: {}
              as: RouteDriver
            - call: "POST /vmi/routes/${r2_id}/stops"
              payload: { bin_agreement_id: "${agr_id}" }
              as: RouteDriver
              captures: { s2_id: $.data.id }
            - call: "POST /vmi/route-stops/${s2_id}/submit"
              payload: { counted_qty: 90 }
              as: RouteDriver
            - call: "POST /vmi/routes/${r2_id}/close"
              payload: {}
              as: RouteDriver
            # week 3, count 80
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v3: $.data.version }
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-05T00:00:00Z", window_start: "2026-08-05T08:00:00Z", window_end: "2026-08-05T12:00:00Z", expected_site_version: "${site_v3}" }
              as: DistributorAdmin
              captures: { r3_id: $.data.id }
            - call: "POST /vmi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: DistributorAdmin
            - call: "POST /vmi/routes/${r3_id}/start"
              payload: {}
              as: RouteDriver
            - call: "POST /vmi/routes/${r3_id}/stops"
              payload: { bin_agreement_id: "${agr_id}" }
              as: RouteDriver
              captures: { s3_id: $.data.id }
            - call: "POST /vmi/route-stops/${s3_id}/submit"
              payload: { counted_qty: 80 }
              as: RouteDriver
            - call: "POST /vmi/routes/${r3_id}/close"
              payload: {}
              as: RouteDriver
            # week 4, count 70
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v4: $.data.version }
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-06T00:00:00Z", window_start: "2026-08-06T08:00:00Z", window_end: "2026-08-06T12:00:00Z", expected_site_version: "${site_v4}" }
              as: DistributorAdmin
              captures: { r4_id: $.data.id }
            - call: "POST /vmi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T09:00:00Z" }
              as: DistributorAdmin
            - call: "POST /vmi/routes/${r4_id}/start"
              payload: {}
              as: RouteDriver
            - call: "POST /vmi/routes/${r4_id}/stops"
              payload: { bin_agreement_id: "${agr_id}" }
              as: RouteDriver
              captures: { s4_id: $.data.id }
            - call: "POST /vmi/route-stops/${s4_id}/submit"
              payload: { counted_qty: 70 }
              as: RouteDriver
            - call: "POST /vmi/routes/${r4_id}/close"
              payload: {}
              as: RouteDriver
            # week 5, count 20 (< min 25 => generates order => weight 2 in PROJECTED)
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v5: $.data.version }
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-07T00:00:00Z", window_start: "2026-08-07T08:00:00Z", window_end: "2026-08-07T12:00:00Z", expected_site_version: "${site_v5}" }
              as: DistributorAdmin
              captures: { r5_id: $.data.id }
            - call: "POST /vmi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T09:00:00Z" }
              as: DistributorAdmin
            - call: "POST /vmi/routes/${r5_id}/start"
              payload: {}
              as: RouteDriver
            - call: "POST /vmi/routes/${r5_id}/stops"
              payload: { bin_agreement_id: "${agr_id}" }
              as: RouteDriver
              captures: { s5_id: $.data.id }
            - call: "POST /vmi/route-stops/${s5_id}/submit"
              payload: { counted_qty: 20 }
              as: RouteDriver
          trigger:
            - call: "GET /vmi/bin-agreements/${agr_id}/sizing-recommendation?method=TRAILING"
              payload: {}
              as: DistributorAdmin
              captures: { t_min: $.data.recommended_min, t_max: $.data.recommended_max }
            - call: "GET /vmi/bin-agreements/${agr_id}/sizing-recommendation?method=PROJECTED"
              payload: {}
              as: DistributorAdmin
              captures: { p_min: $.data.recommended_min, p_max: $.data.recommended_max }
          assert:
            - "TRAILING recommended_min == 30 and recommended_max == 90"
            - "PROJECTED recommended_min == 39 and recommended_max == 117"
            - "PROJECTED recommended_min != TRAILING recommended_min for the identical scan history"

  # =========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: order_pricing_tier_mode_branch_and_cert_fee
        grounds:
          - calculations.order_pricing
          - entities.Part.fields.is_critical
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — pricing_mode
          branch x quantity-tier selection (0/2/5 percent at 100/500) x
          critical-part cert fee (1500). A critical part at qty 500 under
          UNIT_PRICE yields 950*500+1500 = 476500; the same qty under
          COST_PER_BIN (flat 7500) yields 9000 — tier logic is bypassed
          entirely on the flat branch.
        test_recipe:
          setup:
            - "Site S (credit 100000000), critical part CP (unit 1000, stock 100000) with a VALID lot certificate"
            - "Agreement AU: UNIT_PRICE min 10 max 600; Agreement AB: COST_PER_BIN flat 7500 min 10 max 600"
            - "Route started; two stops, each submitted at counted_qty 100 (ordered_qty 500)"
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S3", ship_to_code: "SHP-S3", credit_limit_cents: 100000000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "SKU-CP", description: "Grade-8 structural bolt", is_critical: true, unit_price_cents: 1000, total_stock_qty: 100000 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
            - call: "POST /vmi/lot-certificates"
              payload: { part_id: "${part_id}", lot_number: "LOT-1", cert_expires_at: "2027-01-01T00:00:00Z" }
              as: DistributorAdmin
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${part_id}", bin_location: "C1", pricing_mode: "UNIT_PRICE", min_qty: 10, max_qty: 600 }
              as: DistributorAdmin
              captures: { agr_u_id: $.data.id }
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${part_id}", bin_location: "C2", pricing_mode: "COST_PER_BIN", flat_bin_price_cents: 7500, min_qty: 10, max_qty: 600 }
              as: DistributorAdmin
              captures: { agr_b_id: $.data.id }
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v: $.data.version }
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-10T00:00:00Z", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z", expected_site_version: "${site_v}" }
              as: DistributorAdmin
              captures: { route_id: $.data.id }
            - call: "POST /vmi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: DistributorAdmin
            - call: "POST /vmi/routes/${route_id}/start"
              payload: {}
              as: RouteDriver
            - call: "POST /vmi/routes/${route_id}/stops"
              payload: { bin_agreement_id: "${agr_u_id}" }
              as: RouteDriver
              captures: { stop_u_id: $.data.id }
            - call: "POST /vmi/routes/${route_id}/stops"
              payload: { bin_agreement_id: "${agr_b_id}" }
              as: RouteDriver
              captures: { stop_b_id: $.data.id }
          trigger:
            - call: "POST /vmi/route-stops/${stop_u_id}/submit"
              payload: { counted_qty: 100 }
              as: RouteDriver
              captures: { order_u_id: $.data.generated_order_id }
            - call: "POST /vmi/route-stops/${stop_b_id}/submit"
              payload: { counted_qty: 100 }
              as: RouteDriver
              captures: { order_b_id: $.data.generated_order_id }
          assert:
            - "ReplenishmentOrder.${order_u_id}.total_price_cents == 476500  # 950*500 + 1500 cert fee"
            - "ReplenishmentOrder.${order_b_id}.total_price_cents == 9000    # 7500 flat + 1500 cert fee; qty/tier irrelevant"

      - name: kit_packaging_per_line_round_then_sum
        grounds:
          - calculations.kit_packaging_cost
          - entities.KitJob.fields.packaging_cost_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — two components with
          unit_price_cents 333 each: per-line ceil(250 + 30 + 13.32) = 294 per
          line then summed = 588, whereas sum-then-round would give
          ceil(586.64) = 587. The scaffold pins per-line-then-sum, so
          packaging_cost_cents == 588 exactly.
        test_recipe:
          setup:
            - "Site S; parts P1 and P2 each unit_price_cents 333, stock 10000, ACTIVE"
            - "KitJob K: components [P1, P2], qty_per_part 10, kit_count 1, valid station window"
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S4", ship_to_code: "SHP-S4", credit_limit_cents: 100000000, delivery_mode: "LINE_SIDE" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "SKU-K1", description: "washer", is_critical: false, unit_price_cents: 333, total_stock_qty: 10000 }
              as: DistributorAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "SKU-K2", description: "lock washer", is_critical: false, unit_price_cents: 333, total_stock_qty: 10000 }
              as: DistributorAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /vmi/kit-jobs"
              payload: { site_id: "${site_id}", kit_name: "washer kit", component_part_ids: ["${p1_id}", "${p2_id}"], qty_per_part: 10, kit_count: 1, station_window_start: "2026-08-10T08:00:00Z", station_window_end: "2026-08-10T09:00:00Z" }
              as: WarehouseOperator
              captures: { kit_id: $.data.id }
            - call: "POST /vmi/kit-jobs/${kit_id}/start-picking"
              payload: {}
              as: WarehouseOperator
          trigger:
            - call: "POST /vmi/kit-jobs/${kit_id}/pack"
              payload: {}
              as: WarehouseOperator
          assert:
            - "KitJob.${kit_id}.packaging_cost_cents == 588"
            - "KitJob.${kit_id}.status == PACKED"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: replenishment_order_delivered_disputed_delivered_cycle
        grounds:
          - state_machines.ReplenishmentOrder.DELIVERED_to_DISPUTED
          - state_machines.ReplenishmentOrder.DISPUTED_to_DELIVERED
        distinguishing_aspect: |
          Cycle on ReplenishmentOrder: DELIVERED -> DISPUTED -> DELIVERED is a
          revert loop (count dispute), and the loop mutates
          BinAgreement.on_hand_qty down then back up — cycling twice returns
          the bin to its exact pre-dispute quantity.
        test_recipe:
          setup:
            - "Site S (credit 100000000), part P (unit 1000, stock 100000, not critical)"
            - "Agreement AG: UNIT_PRICE min 10 max 200; order of 190 confirmed, shipped, delivered; bin on_hand == 200 (10 scan + 190 delivered)"
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S5", ship_to_code: "SHP-S5", credit_limit_cents: 100000000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "SKU-P5", description: "bolt", is_critical: false, unit_price_cents: 1000, total_stock_qty: 100000 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${part_id}", bin_location: "D1", pricing_mode: "UNIT_PRICE", min_qty: 10, max_qty: 200 }
              as: DistributorAdmin
              captures: { agr_id: $.data.id }
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v: $.data.version }
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-10T00:00:00Z", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z", expected_site_version: "${site_v}" }
              as: DistributorAdmin
              captures: { route_id: $.data.id }
            - call: "POST /vmi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: DistributorAdmin
            - call: "POST /vmi/routes/${route_id}/start"
              payload: {}
              as: RouteDriver
            - call: "POST /vmi/routes/${route_id}/stops"
              payload: { bin_agreement_id: "${agr_id}" }
              as: RouteDriver
              captures: { stop_id: $.data.id }
            - call: "POST /vmi/route-stops/${stop_id}/submit"
              payload: { counted_qty: 5 }
              as: RouteDriver
              captures: { order_id: $.data.generated_order_id }
            - call: "POST /vmi/replenishment-orders/${order_id}/confirm"
              payload: {}
              as: DistributorAdmin
            - call: "POST /vmi/replenishment-orders/${order_id}/ship"
              payload: {}
              as: DistributorAdmin
            - call: "POST /vmi/replenishment-orders/${order_id}/deliver"
              payload: {}
              as: RouteDriver
          trigger:
            - call: "POST /vmi/replenishment-orders/${order_id}/dispute"
              payload: {}
              as: RouteDriver
            - call: "POST /vmi/replenishment-orders/${order_id}/resolve-dispute"
              payload: {}
              as: DistributorAdmin
          assert:
            - "ReplenishmentOrder.${order_id}.status == DELIVERED after the cycle"
            - "BinAgreement.${agr_id}.on_hand_qty == 200 after dispute (5+195-195) then resolve (+195)"
            - "BinAgreement.${agr_id}.open_order_qty == 0"

      - name: kit_job_picking_hold_branching
        grounds:
          - state_machines.KitJob.PICKING_to_ON_HOLD
          - state_machines.KitJob.ON_HOLD_to_SCRAPPED
        distinguishing_aspect: |
          Branching fork on KitJob (distinct entity from ReplenishmentOrder):
          PICKING diverges to {PACKED, ON_HOLD} and ON_HOLD diverges to
          {PICKING, SCRAPPED}; the two SCRAPPED entries have identical
          compensating releases while PACKED->COMPLETED consumes stock —
          divergent side-effect sets per branch.
        test_recipe:
          setup:
            - "Site S; part P (unit 1000, stock 1000); kit job K with qty_per_part 5, kit_count 2 (reserve 10), started then held"
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S6", ship_to_code: "SHP-S6", credit_limit_cents: 100000000, delivery_mode: "LINE_SIDE" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "SKU-P6", description: "screw", is_critical: false, unit_price_cents: 1000, total_stock_qty: 1000 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
            - call: "POST /vmi/kit-jobs"
              payload: { site_id: "${site_id}", kit_name: "screw kit", component_part_ids: ["${part_id}"], qty_per_part: 5, kit_count: 2, station_window_start: "2026-08-10T08:00:00Z", station_window_end: "2026-08-10T09:00:00Z" }
              as: WarehouseOperator
              captures: { kit_id: $.data.id }
            - call: "POST /vmi/kit-jobs/${kit_id}/start-picking"
              payload: {}
              as: WarehouseOperator
          trigger:
            - call: "POST /vmi/kit-jobs/${kit_id}/hold"
              payload: {}
              as: WarehouseOperator
            - call: "POST /vmi/kit-jobs/${kit_id}/resume"
              payload: {}
              as: WarehouseOperator
            - call: "POST /vmi/kit-jobs/${kit_id}/hold"
              payload: {}
              as: WarehouseOperator
            - call: "POST /vmi/kit-jobs/${kit_id}/scrap"
              payload: {}
              as: WarehouseOperator
          assert:
            - "KitJob.${kit_id}.status == SCRAPPED"
            - "Part.${part_id}.reserved_qty == 0 after scrap-from-hold compensation"
            - "Part.${part_id}.available_qty == 1000 and Part.${part_id}.total_stock_qty == 1000 (reservation fully released, none consumed)"

  # =========================================================================
  # Rule 4 — transitive_cascade (different triggers, depth >=3 and >=2)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: stop_submit_to_order_to_capacity_posture_depth3
        grounds:
          - state_machines.RouteStop.PENDING_to_SUBMITTED
          - state_machines.ReplenishmentOrder.DRAFT_to_CONFIRMED
          - state_machines.BinAgreement.ACTIVE_to_AT_CAPACITY
        distinguishing_aspect: |
          Depth-3 chain originating at RouteStop submit: submit creates a
          DRAFT order (link 1); confirming that order mutates
          BinAgreement.open_order_qty (link 2); that mutation itself flips
          BinAgreement posture ACTIVE -> AT_CAPACITY (link 3), which then
          blocks retire and changes further validation behaviour.
        test_recipe:
          setup:
            - "Site S (credit 100000000), part P (unit 1000, stock 100000, not critical)"
            - "Agreement AG: UNIT_PRICE min 10 max 100; stop scanned at counted_qty 5 (order qty 95); on_hand 5 + open 95 = 100 >= max 100"
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S7", ship_to_code: "SHP-S7", credit_limit_cents: 100000000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "SKU-P7", description: "anchor", is_critical: false, unit_price_cents: 1000, total_stock_qty: 100000 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${part_id}", bin_location: "E1", pricing_mode: "UNIT_PRICE", min_qty: 10, max_qty: 100 }
              as: DistributorAdmin
              captures: { agr_id: $.data.id }
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v: $.data.version }
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-10T00:00:00Z", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z", expected_site_version: "${site_v}" }
              as: DistributorAdmin
              captures: { route_id: $.data.id }
            - call: "POST /vmi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: DistributorAdmin
            - call: "POST /vmi/routes/${route_id}/start"
              payload: {}
              as: RouteDriver
            - call: "POST /vmi/routes/${route_id}/stops"
              payload: { bin_agreement_id: "${agr_id}" }
              as: RouteDriver
              captures: { stop_id: $.data.id }
          trigger:
            - call: "POST /vmi/route-stops/${stop_id}/submit"
              payload: { counted_qty: 5 }
              as: RouteDriver
              captures: { order_id: $.data.generated_order_id }
            - call: "POST /vmi/replenishment-orders/${order_id}/confirm"
              payload: {}
              as: DistributorAdmin
          assert:
            - "ReplenishmentOrder.${order_id}.status == CONFIRMED (link 1 output consumed)"
            - "BinAgreement.${agr_id}.open_order_qty == 95 (link 2 mutation)"
            - "BinAgreement.${agr_id}.status == AT_CAPACITY (link 3 auto-transition: 5 + 95 >= 100)"

      - name: cert_expiry_to_compliance_block_to_order_hold_depth2
        grounds:
          - state_machines.LotCertificate.VALID_to_EXPIRED
          - state_machines.ReplenishmentOrder.CONFIRMED_to_ON_HOLD
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (cert-expiry sweep, not a
          route scan): sweep flips the LotCertificate (link 1); the cert
          transition itself blocks the BinAgreement compliance_flag AND holds
          the CONFIRMED order (link 2) — the order was never touched by the
          sweep request directly.
        test_recipe:
          setup:
            - "Site S (credit 100000000), critical part CP (unit 1000, stock 100000) with one lot cert expiring 2026-08-05"
            - "Agreement AG: UNIT_PRICE min 10 max 100; order for 95 confirmed while cert VALID"
            - "Logical clock then advanced to 2026-08-06 and sweep executed"
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S8", ship_to_code: "SHP-S8", credit_limit_cents: 100000000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "SKU-CP8", description: "struct bolt", is_critical: true, unit_price_cents: 1000, total_stock_qty: 100000 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
            - call: "POST /vmi/lot-certificates"
              payload: { part_id: "${part_id}", lot_number: "LOT-X", cert_expires_at: "2026-08-05T00:00:00Z" }
              as: DistributorAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${part_id}", bin_location: "F1", pricing_mode: "UNIT_PRICE", min_qty: 10, max_qty: 100 }
              as: DistributorAdmin
              captures: { agr_id: $.data.id }
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v: $.data.version }
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-03T00:00:00Z", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T12:00:00Z", expected_site_version: "${site_v}" }
              as: DistributorAdmin
              captures: { route_id: $.data.id }
            - call: "POST /vmi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: DistributorAdmin
            - call: "POST /vmi/routes/${route_id}/start"
              payload: {}
              as: RouteDriver
            - call: "POST /vmi/routes/${route_id}/stops"
              payload: { bin_agreement_id: "${agr_id}" }
              as: RouteDriver
              captures: { stop_id: $.data.id }
            - call: "POST /vmi/route-stops/${stop_id}/submit"
              payload: { counted_qty: 5 }
              as: RouteDriver
              captures: { order_id: $.data.generated_order_id }
            - call: "POST /vmi/replenishment-orders/${order_id}/confirm"
              payload: {}
              as: DistributorAdmin
            - call: "POST /vmi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: DistributorAdmin
          trigger:
            - call: "POST /vmi/_sweep/cert-expiry"
              payload: {}
              as: DistributorAdmin
          assert:
            - "LotCertificate.${cert_id}.status == EXPIRED (link 1)"
            - "BinAgreement.${agr_id}.compliance_flag == BLOCKED (link 2a)"
            - "ReplenishmentOrder.${order_id}.status == ON_HOLD (link 2b — order held by the cascade, never directly addressed)"

  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_order_state_beats_fiscal
        grounds:
          - validations[priority=4]
          - validations[priority=13]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Category pair state (p4) vs business_fiscal (p13): confirming an
          order that is already CANCELLED on a site with credit_limit 0 must
          return ERR_INVALID_STATE, not ERR_CREDIT_LIMIT_EXCEEDED — the state
          check outranks the fiscal check even though both fail.
        test_recipe:
          setup:
            - "Site S with credit_limit_cents = 0 (any confirm would exceed), part P"
            - "Agreement AG min 10 max 100; order created by scan at 5 then cancelled from DRAFT"
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S9", ship_to_code: "SHP-S9", credit_limit_cents: 0, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "SKU-P9", description: "stud", is_critical: false, unit_price_cents: 1000, total_stock_qty: 100000 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${part_id}", bin_location: "G1", pricing_mode: "UNIT_PRICE", min_qty: 10, max_qty: 100 }
              as: DistributorAdmin
              captures: { agr_id: $.data.id }
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v: $.data.version }
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-10T00:00:00Z", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z", expected_site_version: "${site_v}" }
              as: DistributorAdmin
              captures: { route_id: $.data.id }
            - call: "POST /vmi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: DistributorAdmin
            - call: "POST /vmi/routes/${route_id}/start"
              payload: {}
              as: RouteDriver
            - call: "POST /vmi/routes/${route_id}/stops"
              payload: { bin_agreement_id: "${agr_id}" }
              as: RouteDriver
              captures: { stop_id: $.data.id }
            - call: "POST /vmi/route-stops/${stop_id}/submit"
              payload: { counted_qty: 5 }
              as: RouteDriver
              captures: { order_id: $.data.generated_order_id }
            - call: "POST /vmi/replenishment-orders/${order_id}/cancel"
              payload: {}
              as: DistributorAdmin
          trigger:
            - call: "POST /vmi/replenishment-orders/${order_id}/confirm"
              payload: {}
              as: DistributorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409), NOT ERR_CREDIT_LIMIT_EXCEEDED"

      - name: route_create_retired_site_beats_window_overlap
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors[ERR_AGREEMENT_OR_SITE_RETIRED]
          - errors[ERR_ROUTE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Category pair state/retired-parent (p5) vs business_temporal (p8)
          — a different pair from state-vs-fiscal: scheduling a route on a
          RETIRED site with a window that also overlaps an existing route
          must return ERR_AGREEMENT_OR_SITE_RETIRED, not
          ERR_ROUTE_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Site S created then retired (no live agreements/routes at retire time)"
            - "Second site S2 with a route occupying 2026-08-10T08:00-12:00 (used only to guarantee an overlapping window exists somewhere the caller might mean; the retired-site request reuses the same window on the RETIRED site after giving it one historical route pre-retirement)"
            - "Concretely: site S had route R (08:00-12:00 on 2026-08-10) which was cancelled before retirement; a new route request on retired S reuses window 10:00-11:00 which overlaps R's successor — setup instead: S keeps no live routes; S is retired; the conflicting window is checked only after the retired check per priority"
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S10", ship_to_code: "SHP-S10", credit_limit_cents: 100000000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v1: $.data.version }
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-10T00:00:00Z", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z", expected_site_version: "${site_v1}" }
              as: DistributorAdmin
              captures: { route_id: $.data.id }
            - call: "POST /vmi/routes/${route_id}/cancel"
              payload: {}
              as: RouteDriver
            - call: "POST /vmi/sites/${site_id}/retire"
              payload: {}
              as: DistributorAdmin
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v2: $.data.version }
          trigger:
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-10T00:00:00Z", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T10:00:00Z", expected_site_version: "${site_v2}" }
              as: DistributorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_AGREEMENT_OR_SITE_RETIRED (http 409), NOT ERR_ROUTE_WINDOW_OVERLAP (cancelled routes do not block windows, and the retired-site check fires first regardless)"

  # =========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: scan_count_exactly_at_min_triggers_no_order
        grounds:
          - state_machines.RouteStop.PENDING_to_SUBMITTED
          - entities.BinAgreement.fields.min_qty
        distinguishing_aspect: |
          Numeric-threshold boundary on POST /vmi/route-stops/{id}/submit:
          counted_qty == min_qty (exactly at the reorder point) generates NO
          order because the trigger is strictly `counted_qty < min_qty`;
          counted_qty == min_qty - 1 does generate one.
        test_recipe:
          setup:
            - "Site S, part P, agreement min 10 max 100; route started; two stops created"
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S11", ship_to_code: "SHP-S11", credit_limit_cents: 100000000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "SKU-P11", description: "rivet", is_critical: false, unit_price_cents: 1000, total_stock_qty: 100000 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${part_id}", bin_location: "H1", pricing_mode: "UNIT_PRICE", min_qty: 10, max_qty: 100 }
              as: DistributorAdmin
              captures: { agr_id: $.data.id }
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v: $.data.version }
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-10T00:00:00Z", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z", expected_site_version: "${site_v}" }
              as: DistributorAdmin
              captures: { route_id: $.data.id }
            - call: "POST /vmi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: DistributorAdmin
            - call: "POST /vmi/routes/${route_id}/start"
              payload: {}
              as: RouteDriver
            - call: "POST /vmi/routes/${route_id}/stops"
              payload: { bin_agreement_id: "${agr_id}" }
              as: RouteDriver
              captures: { stop_at_id: $.data.id }
          trigger:
            - call: "POST /vmi/route-stops/${stop_at_id}/submit"
              payload: { counted_qty: 10 }
              as: RouteDriver
              captures: { gen_at: $.data.generated_order_id }
          assert:
            - "RouteStop.${stop_at_id}.generated_order_id is null (count == min does not trigger)"
            - "BinAgreement.${agr_id}.on_hand_qty == 10 and open_order_qty == 0"

      - name: route_close_with_zero_submitted_stops_rejected
        grounds:
          - state_machines.ReplenishmentRoute.IN_PROGRESS_to_CLOSED
          - errors[ERR_ROUTE_EMPTY]
        distinguishing_aspect: |
          Empty-collection boundary on a different endpoint
          (POST /vmi/routes/{id}/close) and different metric (stop count, not
          a quantity threshold): a route whose stops were created but never
          submitted has zero SUBMITTED stops and cannot close; and a route
          with exactly one SUBMITTED stop closes fine.
        test_recipe:
          setup:
            - "Site S, part P, agreement min 10 max 100; route started; one stop created and left PENDING"
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S12", ship_to_code: "SHP-S12", credit_limit_cents: 100000000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "SKU-P12", description: "pin", is_critical: false, unit_price_cents: 1000, total_stock_qty: 100000 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${part_id}", bin_location: "I1", pricing_mode: "UNIT_PRICE", min_qty: 10, max_qty: 100 }
              as: DistributorAdmin
              captures: { agr_id: $.data.id }
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v: $.data.version }
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-10T00:00:00Z", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z", expected_site_version: "${site_v}" }
              as: DistributorAdmin
              captures: { route_id: $.data.id }
            - call: "POST /vmi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: DistributorAdmin
            - call: "POST /vmi/routes/${route_id}/start"
              payload: {}
              as: RouteDriver
            - call: "POST /vmi/routes/${route_id}/stops"
              payload: { bin_agreement_id: "${agr_id}" }
              as: RouteDriver
              captures: { stop_id: $.data.id }
          trigger:
            - call: "POST /vmi/routes/${route_id}/close"
              payload: {}
              as: RouteDriver
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ROUTE_EMPTY (http 422)"
            - "ReplenishmentRoute.${route_id}.status == IN_PROGRESS (unchanged)"

  # =========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: stop_submit_requires_route_in_progress
        grounds:
          - state_machines.RouteStop.PENDING_to_SUBMITTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Pair RouteStop -> ReplenishmentRoute: a stop on a SCHEDULED route
          cannot be submitted even though the stop itself is PENDING and the
          payload is valid — the parent's state gates the child transition.
        test_recipe:
          setup:
            - "Site S, part P, agreement min 10 max 100; route created but NOT started; stop created"
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S13", ship_to_code: "SHP-S13", credit_limit_cents: 100000000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "SKU-P13", description: "clip", is_critical: false, unit_price_cents: 1000, total_stock_qty: 100000 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${part_id}", bin_location: "J1", pricing_mode: "UNIT_PRICE", min_qty: 10, max_qty: 100 }
              as: DistributorAdmin
              captures: { agr_id: $.data.id }
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v: $.data.version }
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-10T00:00:00Z", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z", expected_site_version: "${site_v}" }
              as: DistributorAdmin
              captures: { route_id: $.data.id }
            - call: "POST /vmi/routes/${route_id}/stops"
              payload: { bin_agreement_id: "${agr_id}" }
              as: RouteDriver
              captures: { stop_id: $.data.id }
          trigger:
            - call: "POST /vmi/route-stops/${stop_id}/submit"
              payload: { counted_qty: 5 }
              as: RouteDriver
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (route still SCHEDULED)"
            - "RouteStop.${stop_id}.status == PENDING (unchanged)"

      - name: kit_picking_requires_all_component_parts_active
        grounds:
          - state_machines.KitJob.DRAFT_to_PICKING
          - errors[ERR_QUANTITY_OUT_OF_BOUNDS]
        distinguishing_aspect: |
          Pair KitJob -> Part (a different entity pair than
          RouteStop -> ReplenishmentRoute): start-picking is rejected when any
          component part is OBSOLETE, even though the KitJob itself is in a
          valid source state and stock is sufficient.
        test_recipe:
          setup:
            - "Site S; parts PA (ACTIVE) and PB; kit job created with [PA, PB]; PB then obsoleted (PB has no open orders/kits blocking because the kit job is still DRAFT)"
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S14", ship_to_code: "SHP-S14", credit_limit_cents: 100000000, delivery_mode: "LINE_SIDE" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "SKU-PA", description: "bolt A", is_critical: false, unit_price_cents: 1000, total_stock_qty: 1000 }
              as: DistributorAdmin
              captures: { pa_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "SKU-PB", description: "bolt B", is_critical: false, unit_price_cents: 1000, total_stock_qty: 1000 }
              as: DistributorAdmin
              captures: { pb_id: $.data.id }
            - call: "POST /vmi/kit-jobs"
              payload: { site_id: "${site_id}", kit_name: "mixed kit", component_part_ids: ["${pa_id}", "${pb_id}"], qty_per_part: 1, kit_count: 1, station_window_start: "2026-08-10T08:00:00Z", station_window_end: "2026-08-10T09:00:00Z" }
              as: WarehouseOperator
              captures: { kit_id: $.data.id }
            - call: "POST /vmi/parts/${pb_id}/obsolete"
              payload: {}
              as: DistributorAdmin
          trigger:
            - call: "POST /vmi/kit-jobs/${kit_id}/start-picking"
              payload: {}
              as: WarehouseOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_QUANTITY_OUT_OF_BOUNDS (http 422) — component part PB is OBSOLETE"
            - "KitJob.${kit_id}.status == DRAFT (unchanged)"

  # =========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: route_windows_half_open_adjacency_allowed
        grounds:
          - validations[priority=8]
          - errors[ERR_ROUTE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Half-open [start, end) semantics on ReplenishmentRoute (resource:
          the site's dock): a route starting at exactly the existing route's
          window_end does NOT overlap, while one starting one minute earlier
          does — adjacency is permitted.
        test_recipe:
          setup:
            - "Site S with an existing route 2026-08-10T08:00-12:00 (SCHEDULED)"
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S15", ship_to_code: "SHP-S15", credit_limit_cents: 100000000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v1: $.data.version }
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-10T00:00:00Z", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z", expected_site_version: "${site_v1}" }
              as: DistributorAdmin
              captures: { route_id: $.data.id }
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v2: $.data.version }
          trigger:
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-10T00:00:00Z", window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T14:00:00Z", expected_site_version: "${site_v2}" }
              as: DistributorAdmin
              captures: { route2_id: $.data.id }
          assert:
            - "Adjacent route created successfully (201) — half-open boundary permits end == start"
            - "ReplenishmentRoute.${route2_id}.status == SCHEDULED"

      - name: kit_station_windows_require_buffer_gap
        grounds:
          - validations[priority=9]
          - errors[ERR_STATION_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Different resource (packaging station) with different interval
          semantics — closed-interval-with-buffer: a new job whose
          station_window_start equals the existing job's station_window_end
          is REJECTED (a STATION_BUFFER_MINUTES gap is required), the exact
          opposite of the half-open route adjacency rule.
        test_recipe:
          setup:
            - "Site S; part P stock 10000; existing non-terminal KitJob J1 occupying station window 2026-08-10T08:00-09:00"
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S16", ship_to_code: "SHP-S16", credit_limit_cents: 100000000, delivery_mode: "LINE_SIDE" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "SKU-P16", description: "nut", is_critical: false, unit_price_cents: 1000, total_stock_qty: 10000 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
            - call: "POST /vmi/kit-jobs"
              payload: { site_id: "${site_id}", kit_name: "job one", component_part_ids: ["${part_id}"], qty_per_part: 1, kit_count: 1, station_window_start: "2026-08-10T08:00:00Z", station_window_end: "2026-08-10T09:00:00Z" }
              as: WarehouseOperator
              captures: { kit1_id: $.data.id }
          trigger:
            - call: "POST /vmi/kit-jobs"
              payload: { site_id: "${site_id}", kit_name: "job two", component_part_ids: ["${part_id}"], qty_per_part: 1, kit_count: 1, station_window_start: "2026-08-10T09:00:00Z", station_window_end: "2026-08-10T10:00:00Z" }
              as: WarehouseOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STATION_WINDOW_CONFLICT (http 422) — abutting windows without the required buffer are rejected even though start == end"

  # =========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: order_confirm_then_cancel_restores_open_qty_and_balance
        grounds:
          - state_machines.ReplenishmentOrder.DRAFT_to_CONFIRMED
          - state_machines.ReplenishmentOrder.ON_HOLD_to_CANCELLED
          - calculations.site_balance_rollup
        distinguishing_aspect: |
          Conserved quantity 1 (fiscal/pipeline): for a BinAgreement,
          open_order_qty, and for the site, outstanding_balance_cents. A
          confirm followed by a cancel-from-hold leaves
          open_order_qty == 0 and outstanding_balance_cents == 0 — no drift
          in either conserved quantity.
        test_recipe:
          setup:
            - "Site S credit 100000000; critical part CP (unit 1000, stock 100000) with a cert expiring 2026-08-05; agreement min 10 max 100"
            - "Order for 95 created at 2026-08-03, confirmed (open_order_qty 95; balance 91700 = 950*... wait: qty 95 < tier1 100 => unit 1000; total 95000 + 1500 cert = 96500)"
            - "Clock advanced past cert expiry; sweep fires order -> ON_HOLD"
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S17", ship_to_code: "SHP-S17", credit_limit_cents: 100000000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "SKU-CP17", description: "bolt", is_critical: true, unit_price_cents: 1000, total_stock_qty: 100000 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
            - call: "POST /vmi/lot-certificates"
              payload: { part_id: "${part_id}", lot_number: "LOT-17", cert_expires_at: "2026-08-05T00:00:00Z" }
              as: DistributorAdmin
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${part_id}", bin_location: "K1", pricing_mode: "UNIT_PRICE", min_qty: 10, max_qty: 100 }
              as: DistributorAdmin
              captures: { agr_id: $.data.id }
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v: $.data.version }
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-03T00:00:00Z", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T12:00:00Z", expected_site_version: "${site_v}" }
              as: DistributorAdmin
              captures: { route_id: $.data.id }
            - call: "POST /vmi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: DistributorAdmin
            - call: "POST /vmi/routes/${route_id}/start"
              payload: {}
              as: RouteDriver
            - call: "POST /vmi/routes/${route_id}/stops"
              payload: { bin_agreement_id: "${agr_id}" }
              as: RouteDriver
              captures: { stop_id: $.data.id }
            - call: "POST /vmi/route-stops/${stop_id}/submit"
              payload: { counted_qty: 5 }
              as: RouteDriver
              captures: { order_id: $.data.generated_order_id }
            - call: "POST /vmi/replenishment-orders/${order_id}/confirm"
              payload: {}
              as: DistributorAdmin
            - call: "POST /vmi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: DistributorAdmin
            - call: "POST /vmi/_sweep/cert-expiry"
              payload: {}
              as: DistributorAdmin
          trigger:
            - call: "POST /vmi/replenishment-orders/${order_id}/cancel"
              payload: {}
              as: DistributorAdmin
          assert:
            - "ReplenishmentOrder.${order_id}.total_price_cents == 96500 (95 x 1000 + 1500 cert fee)"
            - "BinAgreement.${agr_id}.open_order_qty == 0 after ON_HOLD -> CANCELLED compensation"
            - "CustomerSite.${site_id}.outstanding_balance_cents == 0 after compensation"
            - "BinAgreement.${agr_id}.status == ACTIVE (posture restored: 5 + 0 < 100)"

      - name: kit_start_then_scrap_restores_part_stock_invariant
        grounds:
          - state_machines.KitJob.DRAFT_to_PICKING
          - state_machines.KitJob.PICKING_to_SCRAPPED
          - entities.Part.fields.reserved_qty
        distinguishing_aspect: |
          Conserved quantity 2 (physical inventory, a different quantity
          than money/pipeline): for every component Part, the invariant
          reserved_qty + available_qty == total_stock_qty holds before,
          during, and after a start-picking / scrap pair — scrap is the exact
          compensating action of the reservation.
        test_recipe:
          setup:
            - "Site S; part P (stock 1000); kit job K with qty_per_part 5, kit_count 2 (reservation 10)"
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S18", ship_to_code: "SHP-S18", credit_limit_cents: 100000000, delivery_mode: "LINE_SIDE" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "SKU-P18", description: "spacer", is_critical: false, unit_price_cents: 1000, total_stock_qty: 1000 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
            - call: "POST /vmi/kit-jobs"
              payload: { site_id: "${site_id}", kit_name: "spacer kit", component_part_ids: ["${part_id}"], qty_per_part: 5, kit_count: 2, station_window_start: "2026-08-10T08:00:00Z", station_window_end: "2026-08-10T09:00:00Z" }
              as: WarehouseOperator
              captures: { kit_id: $.data.id }
            - call: "POST /vmi/kit-jobs/${kit_id}/start-picking"
              payload: {}
              as: WarehouseOperator
          trigger:
            - call: "POST /vmi/kit-jobs/${kit_id}/scrap"
              payload: {}
              as: WarehouseOperator
          assert:
            - "During PICKING (pre-scrap observation point): reserved_qty == 10 and available_qty == 990 — asserted via post-state reconstruction"
            - "After SCRAP: Part.${part_id}.reserved_qty == 0"
            - "After SCRAP: Part.${part_id}.available_qty == 1000 == total_stock_qty (invariant restored exactly, no drift)"
            - "KitJob.${kit_id}.status == SCRAPPED"
