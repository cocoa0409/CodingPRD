      - name: a_second_split_on_the_version_the_first_split_consumed
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.certificate-split-stale-certificate
          - endpoints.POST_certificates_id_split
          - validations.priority_23_ERR_STALE_PARENT_VERSION
          - compensating_invariant.rights_conserved_across_split_and_retirement
        distinguishing_aspect: "The §1.2.1 rule for Certificate: repeated splits are legitimate, so only the OCC field distinguishes a deliberate second split from a duplicate submission of the first. The refused split must mint no child, leave split_count and the serial-number sequence untouched, and leave the easement's units_outstanding at 22."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; one LANDOWNER party"
            - "ACTIVE SA-EAST; parcel APN-001 (100.00 / 22.00 / PRIME / 2) severed for 22 units and certified; the certificate is HELD at version 1"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-001", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_id: $.data.id }
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_id}", applicant_party_id: "${own_id}", requested_units: 22 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { app_id: $.data.id }
            - call: "POST /tdr/severance-applications/${app_id}/screen"
              payload: {}
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/certify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cert_id: $.data.id, eas_id: $.data.conservation_easement_id, cert_v: $.data.version }
          trigger:
            - call: "POST /tdr/certificates/${cert_id}/split"
              payload: { units: 5, expected_certificate_version: "${cert_v}" }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { child1_id: $.data.id }
            - call: "POST /tdr/certificates/${cert_id}/split"
              payload: { units: 5, expected_certificate_version: "${cert_v}" }
              as: Landowner
              as_user_id: "${own_id}"
            - call: "GET /tdr/certificates/${cert_id}"
              payload: {}
              as: Landowner
              as_user_id: "${own_id}"
              captures: { cert_v2: $.data.version }
            - call: "POST /tdr/certificates/${cert_id}/split"
              payload: { units: 5, expected_certificate_version: "${cert_v2}" }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { child2_id: $.data.id }
          assert:
            - "the certificate is issued at version ${cert_v} == 1 with units_face 22, units_remaining 22, split_count 0"
            - "the first split returns 201: Certificate.${child1_id}.units_face == 5, generation == 2, serial_number ends in '-S1', parent version becomes 2, units_split_out == 5, units_remaining == 17, split_count == 1"
            - "the second split carrying ${cert_v} returns 412 ERR_STALE_PARENT_VERSION"
            - "the 412 mints nothing: parent version is still 2, split_count is still 1, units_split_out is still 5, and GET /tdr/certificates?parent_certificate_id=${cert_id} returns total_count 1"
            - "the retry with ${cert_v2} == 2 returns 201: Certificate.${child2_id}.serial_number ends in '-S2' (the sequence never skipped a number), units_face == 5, generation == 2"
            - "after the retry the parent is at version 3 with units_split_out == 10, units_remaining == 12, split_count == 2"
            - "ConservationEasement.${eas_id}.units_issued_total == 22 and units_outstanding == 22 across all three attempts — splits never mint or destroy rights"
            - "a split carrying expected_certificate_version 1 again after both successes still returns 412"

      - name: a_rejected_debit_does_not_consume_the_party_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.account-action-stale-party
          - endpoints.POST_parties_id_account_actions
          - validations.priority_23_ERR_STALE_PARENT_VERSION
          - validations.priority_45_ERR_INSUFFICIENT_FUNDS
        distinguishing_aspect: "The §1.2.1 rule for Party, plus the ordering that surrounds it: a stale DEBIT is refused at priority 23 with 412 before the funds check at priority 45 ever runs, and a DEBIT rejected for insufficient funds leaves version untouched — so the operator's just-read version is still current on the next attempt. Party.version advances on this endpoint only."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one LANDOWNER party at version 1 with cash_balance_cents 0"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id, own_v: $.data.version }
          trigger:
            - call: "POST /tdr/parties/${own_id}/account-actions"
              payload: { action: "CREDIT", amount_cents: 5000000, expected_party_version: "${own_v}", note: "seed" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /tdr/parties/${own_id}/account-actions"
              payload: { action: "CREDIT", amount_cents: 1000000, expected_party_version: "${own_v}" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "GET /tdr/parties/${own_id}"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { own_v2: $.data.version }
            - call: "POST /tdr/parties/${own_id}/account-actions"
              payload: { action: "DEBIT", amount_cents: 7000000, expected_party_version: "${own_v}" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /tdr/parties/${own_id}/account-actions"
              payload: { action: "DEBIT", amount_cents: 7000000, expected_party_version: "${own_v2}" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /tdr/parties/${own_id}/account-actions"
              payload: { action: "DEBIT", amount_cents: 5000000, expected_party_version: "${own_v2}" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
          assert:
            - "the party is created at version ${own_v} == 1 with cash_balance_cents 0, fee_revenue_cents 0, status ACTIVE"
            - "the first CREDIT returns 200 with cash_balance_cents == 5000000 and version == 2"
            - "the duplicate CREDIT carrying ${own_v} returns 412 ERR_STALE_PARENT_VERSION and the balance is still 5000000 — the credit was not applied twice"
            - "the stale DEBIT of 7000000 carrying ${own_v} returns 412 ERR_STALE_PARENT_VERSION, not 402 ERR_INSUFFICIENT_FUNDS — priority 23 precedes priority 45"
            - "the fresh DEBIT of 7000000 carrying ${own_v2} == 2 returns 402 ERR_INSUFFICIENT_FUNDS with cash_balance_cents unchanged at 5000000"
            - "the rejected DEBIT did not consume the version: the next DEBIT of 5000000 with the same ${own_v2} returns 200, balance 0, version 3"
            - "a SUSPEND carrying amount_cents returns 400 ERR_INVALID_REQUEST, and a CREDIT with no amount_cents returns 400 as well"
            - "an account action with no expected_party_version at all returns 400 ERR_INVALID_REQUEST — the OCC field is required, not optional"

      - name: holdings_counters_reconcile_across_issuance_split_sale_and_retirement
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Party.fields.units_held
          - entities.Party.fields.certificates_held_count
          - endpoints.POST_market_transactions_id_settle
          - endpoints.POST_certificates_id_retire
          - compensating_invariant.rights_conserved_across_split_and_retirement
        distinguishing_aspect: "Party.units_held and certificates_held_count are denormalized over the certificate registry and must be correct after a create (issuance), after two different kinds of update (a split that adds a row without adding units, and a settlement that moves a row between holders), and after a delete of the source (a full retirement that removes the row entirely). The split is the discriminating step: certificates_held_count rises while units_held does not move."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; LANDOWNER, DEVELOPER and MUNICIPAL_BANK parties, the developer credited 10000000"
            - "ACTIVE SA-EAST (UNDERSERVED) and NB-EAST schedule 1234567 / 250 bps -> per-unit base 1265431"
            - "parcel APN-001 (100.00 / 22.00 / PRIME / 2) severed for 22 units and certified to the landowner"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
