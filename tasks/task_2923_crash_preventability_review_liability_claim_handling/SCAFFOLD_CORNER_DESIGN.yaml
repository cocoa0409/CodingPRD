      - name: weighted_scoring_rounds_each_ballot_before_the_mean
        claim_type: weighted_scoring
        grounds:
          - calculations.preventability_determination
          - entities.CommitteeVote.fields.weighted_member_score
        distinguishing_aspect: "The five criterion weights sum to 1.00 but renormalise to 0.85 when the crash has no mechanical factor, and the committee score is the mean of the already-rounded ballot scores, not the rounded mean of the raw scores."
        excluded_because:
          difficulty_instance: member_score_round_then_mean_ordering
          rationale: "That §1.8 instance pins each ballot's two-decimal weighted_member_score under the 0.85 denominator and shows the committee_score differing from the mean-then-round and from the zero-scored-vehicle-criterion answers, which is the whole weighted-scoring row including the rounding-drift claim."

