  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: provisional_cycle_nets_to_final
        grounds:
          - calculations.visit_credit_minutes
          - calculations.recognition_lifetime_and_tier
          - entities.HourCredit.fields.kind
        distinguishing_aspect: |
          Conserved quantity = Handler lifetime-minute accounting: a
          check-out/verify cycle must leave lifetime == seed + FINAL with zero
          provisional residue — the PROVISIONAL posting and its REVERSAL
          cancel exactly, and the ledger sum equals the derived field.
        test_recipe:
          setup:
            - "Certified team + ACTIVE facility; handler lifetime seeded to 100 via ADJUSTMENT; visit v scheduled 60 minutes, actually 45"
          setup_api_calls:
            - { call: "POST /v1/handlers", payload: { full_name: "H V1", email: "hv1@x.com", region_code: "WA", volunteer_since: "2024-08-01" }, as: Anonymous, captures: { h: $.data.id } }
