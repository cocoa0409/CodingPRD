          - entities.EngineeringReport.fields.total_replacement_cost_cents
          - endpoints[GET /engineering-reports/{id}/major-components]
        distinguishing_aspect: "The declared consistency model is immediate, so the recomputed parent
          aggregates must be readable in the very next call with no settle step and no re-read loop: the
          first verification response already reports VERIFIED, and the immediately following report GET
          shows verified_component_count 1 and total_replacement_cost_cents 10000000 over the VERIFIED
          child only, while the second component stays out of both aggregates until its own verification
          lands. Un-verifying the first component in the same sequence must walk the aggregates straight
          back down - 10000000 -> 4000000 - rather than leaving a stale denormalized copy."
        test_recipe:
          setup:
            - "One SUBMITTED ER-1 with two UNVERIFIED components: ROOF 10000000 cents and FOUNDATION
              4000000 cents."
          setup_api_calls:
            - call: "POST /conversion-projects"
              payload: { building_address: "44 Cove Lane, Bangor ME", year_built: 1968, total_unit_count: 1, sponsor_user_id: "sponsor-1" }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
