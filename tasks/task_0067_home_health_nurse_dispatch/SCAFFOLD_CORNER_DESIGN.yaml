scaffold_corner_design:
  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_patient_returns_201_with_fields
        claim_type: Creation
        grounds: ['endpoints.POST /patients', 'entities.Patient.fields.full_name']
        distinguishing_aspect: "POST /patients with all required fields returns 201 and a Patient whose status defaults to ACTIVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Jane Doe", medicare_id: "MED-1", home_zip: "19100", home_lat: 40.0, home_lon: -75.2 }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id, st: $.data.status }
          assert:
            - "response.status == 201"
            - "Patient.${pat_id}.status == ACTIVE"
            - "Patient.${pat_id}.full_name == Jane Doe"

      - name: get_patient_returns_stored_data
        claim_type: Retrieval
        grounds: ['endpoints.GET /patients/{id}', 'entities.Patient.fields.medicare_id']
        distinguishing_aspect: "GET /patients/{id} returns the previously stored Patient with matching medicare_id."
        test_recipe:
          setup: ["One patient created."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Jane Doe", medicare_id: "MED-2", home_zip: "19100", home_lat: 40.0, home_lon: -75.2 }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
          trigger:
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { mid: $.data.medicare_id }
          assert:
            - "response.status == 200"
            - "Patient.${pat_id}.medicare_id == MED-2"

      - name: get_patient_not_found
        claim_type: Not Found
        grounds: ['validations[priority=4]', 'errors[ERR_NOT_FOUND]']
        distinguishing_aspect: "GET /patients/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /patients/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_patient_missing_required_field
        claim_type: Required Fields
        grounds: ['errors[ERR_VALIDATION]', 'entities.Patient.fields.medicare_id']
        distinguishing_aspect: "POST /patients omitting required medicare_id returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "No Medicare", home_zip: "19100", home_lat: 40.0, home_lon: -75.2 }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: clinician_license_active_default_true
        claim_type: Defaults
        grounds: ['entities.Clinician.fields.license_active']
        distinguishing_aspect: "POST /clinicians omitting license_active applies the default true."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /clinicians"
              payload: { full_name: "RN Def", discipline: "RN", base_lat: 40.0, base_lon: -75.0, weekly_visit_cap: 40 }
              as: Scheduler
              captures: { c_id: $.data.id, la: $.data.license_active }
          assert:
            - "response.status == 201"
            - "Clinician.${c_id}.license_active == true"

      - name: episode_id_is_uuid_with_no_prefix
        claim_type: System Fields
        grounds: ['entities.Episode.fields.status', 'endpoints.POST /episodes']
        distinguishing_aspect: "Episode create mints a prefix-free UUID id, sets status=DRAFT, version=1, and a created_at timestamp; client-supplied id is ignored."
        test_recipe:
          setup: ["Clock 2026-02-01; WOUND config; patient + SOC OASIS exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-02-01T08:00:00Z" }
              as: BillingManager
            - call: "POST /pdgm-rate-configs"
              payload: { clinical_group: "WOUND", base_30day_rate: 2000.00, functional_weight_low: 0.95, functional_weight_medium: 1.00, functional_weight_high: 1.05, lupa_threshold: 5, active: true }
              as: BillingManager
            - call: "POST /clinicians"
              payload: { full_name: "RN SF", discipline: "RN", license_active: true, base_lat: 40.0, base_lon: -75.0, weekly_visit_cap: 40 }
              as: Scheduler
              captures: { rn_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat SF", medicare_id: "MED-SF-1", home_zip: "19100", home_lat: 40.0, home_lon: -75.2 }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /oasis-assessments"
              payload: { patient_id: "${pat_id}", clinician_id: "${rn_id}", assessment_type: "START_OF_CARE", assessment_date: "2026-02-01T08:00:00Z", clinical_group: "WOUND", functional_level: "HIGH", comorbidity_count: 2 }
              as: IntakeCoordinator
              captures: { oasis_id: $.data.id }
          trigger:
            - call: "POST /episodes"
              payload: { patient_id: "${pat_id}", soc_oasis_id: "${oasis_id}" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id, ver: $.data.version, st: $.data.status }
          assert:
            - "Episode.${ep_id}.status == DRAFT"
            - "Episode.${ep_id}.version == 1"

      - name: oasis_invalid_enum_assessment_type
        claim_type: Type Constraints
        grounds: ['entities.OASISAssessment.fields.assessment_type', 'errors[ERR_VALIDATION]']
        distinguishing_aspect: "POST /oasis-assessments with assessment_type outside {START_OF_CARE,RECERTIFICATION} returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A patient and clinician exist."]
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { full_name: "RN TC", discipline: "RN", license_active: true, base_lat: 40.0, base_lon: -75.0, weekly_visit_cap: 40 }
              as: Scheduler
              captures: { rn_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat TC", medicare_id: "MED-TC-1", home_zip: "19100", home_lat: 40.0, home_lon: -75.2 }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /oasis-assessments"
              payload: { patient_id: "${pat_id}", clinician_id: "${rn_id}", assessment_type: "RESUMPTION", assessment_date: "2026-02-01T08:00:00Z", clinical_group: "WOUND", functional_level: "HIGH", comorbidity_count: 2 }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: episode_computed_payments_initialize_zero
        claim_type: Computed Fields
        grounds: ['entities.Episode.fields.provisional_payment', 'entities.Episode.fields.final_payment']
        distinguishing_aspect: "A freshly created DRAFT Episode has provisional_payment==0 and final_payment==0 before activation."
        test_recipe:
          setup: ["Clock 2026-02-01; WOUND config; patient + SOC OASIS; episode created (DRAFT)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-02-01T08:00:00Z" }
              as: BillingManager
            - call: "POST /pdgm-rate-configs"
              payload: { clinical_group: "WOUND", base_30day_rate: 2000.00, functional_weight_low: 0.95, functional_weight_medium: 1.00, functional_weight_high: 1.05, lupa_threshold: 5, active: true }
              as: BillingManager
            - call: "POST /clinicians"
              payload: { full_name: "RN CF", discipline: "RN", license_active: true, base_lat: 40.0, base_lon: -75.0, weekly_visit_cap: 40 }
              as: Scheduler
              captures: { rn_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat CF", medicare_id: "MED-CF-1", home_zip: "19100", home_lat: 40.0, home_lon: -75.2 }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /oasis-assessments"
              payload: { patient_id: "${pat_id}", clinician_id: "${rn_id}", assessment_type: "START_OF_CARE", assessment_date: "2026-02-01T08:00:00Z", clinical_group: "WOUND", functional_level: "HIGH", comorbidity_count: 2 }
              as: IntakeCoordinator
              captures: { oasis_id: $.data.id }
            - call: "POST /episodes"
              payload: { patient_id: "${pat_id}", soc_oasis_id: "${oasis_id}" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id }
          trigger:
            - call: "GET /episodes/${ep_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { pp: $.data.provisional_payment, fp: $.data.final_payment }
          assert:
            - "Episode.${ep_id}.provisional_payment == 0"
            - "Episode.${ep_id}.final_payment == 0"

      - name: episode_event_log_immutable_no_version
        claim_type: Immutability
        grounds: ['entities.EpisodeEvent.fields.event_type', 'endpoints.GET /episodes/{id}/events']
        distinguishing_aspect: "EpisodeEvent uses common_fields:false (append-only, no version field); activation appends an ACTIVATED event visible via GET /episodes/{id}/events."
        test_recipe:
          setup: ["Clock 2026-02-01; WOUND config; episode ACTIVE (plan + activate)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-02-01T08:00:00Z" }
              as: BillingManager
            - call: "POST /pdgm-rate-configs"
              payload: { clinical_group: "WOUND", base_30day_rate: 2000.00, functional_weight_low: 0.95, functional_weight_medium: 1.00, functional_weight_high: 1.05, lupa_threshold: 5, active: true }
              as: BillingManager
            - call: "POST /clinicians"
              payload: { full_name: "RN EV", discipline: "RN", license_active: true, base_lat: 40.0, base_lon: -75.0, weekly_visit_cap: 40 }
              as: Scheduler
              captures: { rn_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat EV", medicare_id: "MED-EV-1", home_zip: "19100", home_lat: 40.0, home_lon: -75.2 }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /oasis-assessments"
              payload: { patient_id: "${pat_id}", clinician_id: "${rn_id}", assessment_type: "START_OF_CARE", assessment_date: "2026-02-01T08:00:00Z", clinical_group: "WOUND", functional_level: "HIGH", comorbidity_count: 2 }
              as: IntakeCoordinator
              captures: { oasis_id: $.data.id }
            - call: "POST /episodes"
              payload: { patient_id: "${pat_id}", soc_oasis_id: "${oasis_id}" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id, ep_v: $.data.version }
            - call: "POST /episodes/${ep_id}/plans-of-care"
              payload: { planned_rn_visits: 6, planned_pt_visits: 0, planned_ot_visits: 0, planned_slp_visits: 0, companion_hours_authorized: 0, expected_episode_version: "${ep_v}" }
              as: IntakeCoordinator
            - call: "POST /episodes/${ep_id}/activate"
              payload: {}
              as: IntakeCoordinator
          trigger:
            - call: "GET /episodes/${ep_id}/events"
              payload: {}
              as: IntakeCoordinator
          assert:
            - "response.data is an array containing an EpisodeEvent with event_type == ACTIVATED"

      - name: episode_requires_existing_patient_parent
        claim_type: Parent Relationships
        grounds: ['validations[priority=4]', 'entities.Episode.fields.patient_id', 'errors[ERR_NOT_FOUND]']
        distinguishing_aspect: "POST /episodes with a non-existent patient_id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["A SOC OASIS exists but the patient_id supplied to the episode is wrong."]
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { full_name: "RN PR", discipline: "RN", license_active: true, base_lat: 40.0, base_lon: -75.0, weekly_visit_cap: 40 }
              as: Scheduler
              captures: { rn_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat PR", medicare_id: "MED-PR-1", home_zip: "19100", home_lat: 40.0, home_lon: -75.2 }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /oasis-assessments"
              payload: { patient_id: "${pat_id}", clinician_id: "${rn_id}", assessment_type: "START_OF_CARE", assessment_date: "2026-02-01T08:00:00Z", clinical_group: "WOUND", functional_level: "HIGH", comorbidity_count: 2 }
              as: IntakeCoordinator
              captures: { oasis_id: $.data.id }
          trigger:
            - call: "POST /episodes"
              payload: { patient_id: "00000000-0000-0000-0000-000000000000", soc_oasis_id: "${oasis_id}" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: list_episodes_pagination_envelope
        claim_type: Listing
        grounds: ['endpoints.GET /patients/{id}/episodes']
        distinguishing_aspect: "GET /patients/{id}/episodes returns a paginated array with total_count and has_more meta fields."
        test_recipe:
          setup: ["Clock 2026-02-01; WOUND config; patient with one DRAFT episode."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-02-01T08:00:00Z" }
              as: BillingManager
            - call: "POST /pdgm-rate-configs"
              payload: { clinical_group: "WOUND", base_30day_rate: 2000.00, functional_weight_low: 0.95, functional_weight_medium: 1.00, functional_weight_high: 1.05, lupa_threshold: 5, active: true }
              as: BillingManager
            - call: "POST /clinicians"
              payload: { full_name: "RN LP", discipline: "RN", license_active: true, base_lat: 40.0, base_lon: -75.0, weekly_visit_cap: 40 }
              as: Scheduler
              captures: { rn_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat LP", medicare_id: "MED-LP-1", home_zip: "19100", home_lat: 40.0, home_lon: -75.2 }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /oasis-assessments"
              payload: { patient_id: "${pat_id}", clinician_id: "${rn_id}", assessment_type: "START_OF_CARE", assessment_date: "2026-02-01T08:00:00Z", clinical_group: "WOUND", functional_level: "HIGH", comorbidity_count: 2 }
              as: IntakeCoordinator
              captures: { oasis_id: $.data.id }
            - call: "POST /episodes"
              payload: { patient_id: "${pat_id}", soc_oasis_id: "${oasis_id}" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id }
          trigger:
            - call: "GET /patients/${pat_id}/episodes"
              payload: { limit: 10, offset: 0 }
              as: IntakeCoordinator
          assert:
            - "response.response_type == array"
            - "response.meta total_count == 1 and has_more == false"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: cancel_active_episode_invalid_state
        claim_type: Invalid Transitions
        grounds: ['state_machines.Episode.DRAFT_to_CANCELLED', 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Cancel is only valid from DRAFT; cancelling an ACTIVE episode returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Clock 2026-02-01; WOUND config; episode ACTIVE."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-02-01T08:00:00Z" }
              as: BillingManager
            - call: "POST /pdgm-rate-configs"
              payload: { clinical_group: "WOUND", base_30day_rate: 2000.00, functional_weight_low: 0.95, functional_weight_medium: 1.00, functional_weight_high: 1.05, lupa_threshold: 5, active: true }
              as: BillingManager
            - call: "POST /clinicians"
              payload: { full_name: "RN CA", discipline: "RN", license_active: true, base_lat: 40.0, base_lon: -75.0, weekly_visit_cap: 40 }
              as: Scheduler
              captures: { rn_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat CA", medicare_id: "MED-CA-1", home_zip: "19100", home_lat: 40.0, home_lon: -75.2 }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /oasis-assessments"
              payload: { patient_id: "${pat_id}", clinician_id: "${rn_id}", assessment_type: "START_OF_CARE", assessment_date: "2026-02-01T08:00:00Z", clinical_group: "WOUND", functional_level: "HIGH", comorbidity_count: 2 }
              as: IntakeCoordinator
              captures: { oasis_id: $.data.id }
            - call: "POST /episodes"
              payload: { patient_id: "${pat_id}", soc_oasis_id: "${oasis_id}" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id, ep_v: $.data.version }
            - call: "POST /episodes/${ep_id}/plans-of-care"
              payload: { planned_rn_visits: 6, planned_pt_visits: 0, planned_ot_visits: 0, planned_slp_visits: 0, companion_hours_authorized: 0, expected_episode_version: "${ep_v}" }
              as: IntakeCoordinator
            - call: "POST /episodes/${ep_id}/activate"
              payload: {}
              as: IntakeCoordinator
          trigger:
            - call: "POST /episodes/${ep_id}/cancel"
              payload: {}
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: activate_without_plan_required
        claim_type: Precondition Enforcement
        grounds: ['state_machines.Episode.DRAFT_to_ACTIVE', 'validations[priority=16]', 'errors[ERR_PLAN_REQUIRED]']
        distinguishing_aspect: "Activating a DRAFT episode with no ACTIVE PlanOfCare returns ERR_PLAN_REQUIRED (422)."
        test_recipe:
          setup: ["Clock 2026-02-01; WOUND config; episode DRAFT with no plan."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-02-01T08:00:00Z" }
              as: BillingManager
            - call: "POST /pdgm-rate-configs"
              payload: { clinical_group: "WOUND", base_30day_rate: 2000.00, functional_weight_low: 0.95, functional_weight_medium: 1.00, functional_weight_high: 1.05, lupa_threshold: 5, active: true }
              as: BillingManager
            - call: "POST /clinicians"
              payload: { full_name: "RN PL", discipline: "RN", license_active: true, base_lat: 40.0, base_lon: -75.0, weekly_visit_cap: 40 }
              as: Scheduler
              captures: { rn_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat PL", medicare_id: "MED-PL-1", home_zip: "19100", home_lat: 40.0, home_lon: -75.2 }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /oasis-assessments"
              payload: { patient_id: "${pat_id}", clinician_id: "${rn_id}", assessment_type: "START_OF_CARE", assessment_date: "2026-02-01T08:00:00Z", clinical_group: "WOUND", functional_level: "HIGH", comorbidity_count: 2 }
              as: IntakeCoordinator
              captures: { oasis_id: $.data.id }
            - call: "POST /episodes"
              payload: { patient_id: "${pat_id}", soc_oasis_id: "${oasis_id}" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id }
          trigger:
            - call: "POST /episodes/${ep_id}/activate"
              payload: {}
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_PLAN_REQUIRED"

      - name: plan_supersede_marks_prior_superseded
        claim_type: Side Effect Execution
        grounds: ['endpoints.POST /episodes/{id}/plans-of-care', 'entities.PlanOfCare.fields.status']
        distinguishing_aspect: "Creating a second PlanOfCare sets the prior ACTIVE plan to SUPERSEDED; only one ACTIVE plan remains."
        test_recipe:
          setup: ["Clock 2026-02-01; WOUND config; episode DRAFT with one ACTIVE plan."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-02-01T08:00:00Z" }
              as: BillingManager
            - call: "POST /pdgm-rate-configs"
              payload: { clinical_group: "WOUND", base_30day_rate: 2000.00, functional_weight_low: 0.95, functional_weight_medium: 1.00, functional_weight_high: 1.05, lupa_threshold: 5, active: true }
              as: BillingManager
            - call: "POST /clinicians"
              payload: { full_name: "RN SU", discipline: "RN", license_active: true, base_lat: 40.0, base_lon: -75.0, weekly_visit_cap: 40 }
              as: Scheduler
              captures: { rn_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat SU", medicare_id: "MED-SU-1", home_zip: "19100", home_lat: 40.0, home_lon: -75.2 }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /oasis-assessments"
              payload: { patient_id: "${pat_id}", clinician_id: "${rn_id}", assessment_type: "START_OF_CARE", assessment_date: "2026-02-01T08:00:00Z", clinical_group: "WOUND", functional_level: "HIGH", comorbidity_count: 2 }
              as: IntakeCoordinator
              captures: { oasis_id: $.data.id }
            - call: "POST /episodes"
              payload: { patient_id: "${pat_id}", soc_oasis_id: "${oasis_id}" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id, ep_v0: $.data.version }
            - call: "POST /episodes/${ep_id}/plans-of-care"
              payload: { planned_rn_visits: 6, planned_pt_visits: 0, planned_ot_visits: 0, planned_slp_visits: 0, companion_hours_authorized: 0, expected_episode_version: "${ep_v0}" }
              as: IntakeCoordinator
              captures: { plan1: $.data.id }
            - call: "GET /episodes/${ep_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { ep_v1: $.data.version }
          trigger:
            - call: "POST /episodes/${ep_id}/plans-of-care"
              payload: { planned_rn_visits: 8, planned_pt_visits: 0, planned_ot_visits: 0, planned_slp_visits: 0, companion_hours_authorized: 0, expected_episode_version: "${ep_v1}" }
              as: IntakeCoordinator
              captures: { plan2: $.data.id }
          assert:
            - "PlanOfCare.${plan1}.status == SUPERSEDED"
            - "PlanOfCare.${plan2}.status == ACTIVE"

      - name: terminal_discharged_finalize_again_rejected
        claim_type: Terminal State Lockdown
        grounds: ['state_machines.Episode.ACTIVE_to_DISCHARGED', 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Finalizing an already DISCHARGED episode (terminal for the finalize edge) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Clock 2026-02-01; MMTA_OTHER config (lupa 1); episode finalized (DISCHARGED)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-02-01T08:00:00Z" }
              as: BillingManager
