        distinguishing_aspect: "Immediate consistency: the offer-accept response carries the fully-created Placement, and a GET on the requisition in the NEXT request already shows openings_filled == 1 and status FILLED — no reconciliation lag anywhere in the cascade."
        test_recipe:
          setup:
            - "Full pipeline ready: offer ISSUED, screening COMPLETE, contract APPROVED, requisition openings_total 2 with one opening free."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - *k_nurse
            - *k_lic
            - *k_submit
            - *k_verify
            - *k_req
            - *k_app
            - *k_review
            - *k_iv
            - *k_clock_iv
            - *k_iv_done
            - *k_scr
            - *k_scr_cred
            - *k_scr_bg
            - *k_doc
            - *k_doc_ok
            - *k_offer
          trigger:
            - call: "POST /marketplace/offers/${offer_id}/accept"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_id}"
              captures: { placement_id: $.data.id }
            - call: "GET /marketplace/requisitions/${req_id}"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "GET /marketplace/nurses/${nurse_id}"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_id}"
          assert:
            - "the accept response IS the Placement (response_type object with Placement fields, status PENDING_START)"
            - "the immediately-following GET shows Requisition.${req_id}.openings_filled == 1 (still OPEN: 1 < 2)"
            - "the immediately-following GET shows Nurse.${nurse_id}.status == HIRED"
            - "GET /marketplace/employers/${emp_id}/invoices returns 1 ISSUED invoice — invoice creation is part of the same atomic accept"
