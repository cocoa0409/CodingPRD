          - errors.ERR_PERMIT_NOT_SUBMITTED
          - calculations.inspection_slot_availability
        distinguishing_aspect: |
          Pairs the state category (priority 8, ERR_PERMIT_NOT_SUBMITTED) against business_temporal
          (priority 23, ERR_INSPECTION_SLOT_FULL) - a different category pair from the
          business_safety/business_fiscal instance. The jurisdiction allows one slot per day and that
          slot is already consumed on 2026-08-06 by another project's SUBMITTED permit, while the
          target application is still DRAFT, so the state error must win.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Jurisdiction NARROWGAP with inspection_slots_per_day 1, backlog_days 3, permit_review_days 7, repermit_required_for_reinstall false, reinspection_required true."
            - "Project P1 has a SUBMITTED REINSTALL_ONLY permit with a ROOF_DECK inspection already booked for 2026-08-06, consuming the jurisdiction's only slot on that date."
            - "Project P2 has a REINSTALL_ONLY permit still in DRAFT (never submitted)."
            - "The booking attempt targets P2's DRAFT permit on the exhausted 2026-08-06 slot date, so priority 8 and priority 23 are violated simultaneously."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/jurisdictions"
