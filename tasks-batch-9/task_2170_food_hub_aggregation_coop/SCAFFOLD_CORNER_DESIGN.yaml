    grounds:
    - state_machines.Producer.ACTIVE_to_SUSPENDED
    excluded_because:
      difficulty_instance: transitive_cascade / producer_suspension_five_hop_delist_reverse_reprice_detach_cascade
      rationale: That instance walks all five hops and asserts the observable state of Product, Allocation, OrderLine, BuyerOrder and DeliveryRoute after a single call.
  - name: dual_variant_calculation_layer_is_exercised_by_the_provisional_versus_final_valuation
    claim_type: dual_variant_calculation
    grounds:
    - calculations.order_pricing_rollup
    excluded_because:
      difficulty_instance: dual_variant_calc / order_valuation_provisional_versus_final_at_invoice
      rationale: That instance captures the provisional total and asserts the divergent final total plus the tier flip in one recipe.
- section: consistency_model
  instances:
  - name: suspension_cascade_is_visible_in_the_same_response_and_immediately_on_read
    claim_type: immediate
    grounds:
    - complexity_profile.consistency_model
    - state_machines.Producer.ACTIVE_to_SUSPENDED
    - state_machines.Product.LISTED_to_DELISTED
    distinguishing_aspect: 'The consistency model is immediate, not eventual: the review response itself already carries onboarding_status SUSPENDED and suspension_count 1, and a GET issued straight afterwards
      already shows the product DELISTED with quantity_offered 0 - no second call, sweep or delay is required.'
    test_recipe:
      setup:
      - Producer P1 is ACTIVE with Product PR1 LISTED, quantity_offered 100 and no allocations.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: HubAdmin
        as_user_id: hub-admin-1
      - call: POST /producers
        payload:
          legal_name: Green Acres Farm
          region_code: NEV
          contact_email: ga@example.org
        as: HubAdmin
        as_user_id: hub-admin-1
        captures:
          p1_id: $.data.id
      - call: POST /producers/${p1_id}/documents
        payload:
          doc_type: GAP_AUDIT
          issued_on: '2026-01-01T00:00:00Z'
          expires_on: '2027-01-01T00:00:00Z'
        as: Producer
        as_user_id: ${p1_id}
        captures:
          p1_gap: $.data.id
      - call: POST /producers/${p1_id}/documents
        payload:
          doc_type: LIABILITY_INSURANCE
          issued_on: '2026-01-01T00:00:00Z'
          expires_on: '2027-01-01T00:00:00Z'
        as: Producer
        as_user_id: ${p1_id}
        captures:
          p1_ins: $.data.id
      - call: POST /producers/${p1_id}/documents
        payload:
          doc_type: HACCP_PLAN
          issued_on: '2026-01-01T00:00:00Z'
          expires_on: '2027-01-01T00:00:00Z'
        as: Producer
        as_user_id: ${p1_id}
        captures:
          p1_hac: $.data.id
      - call: POST /producers/${p1_id}/application
        payload: {}
        as: Producer
        as_user_id: ${p1_id}
      - call: POST /producer-documents/${p1_gap}/adjudication
        payload:
          decision: VERIFY
        as: ComplianceOfficer
        as_user_id: co-verify-1
      - call: POST /producer-documents/${p1_ins}/adjudication
        payload:
          decision: VERIFY
        as: ComplianceOfficer
        as_user_id: co-verify-1
      - call: POST /producer-documents/${p1_hac}/adjudication
        payload:
          decision: VERIFY
        as: ComplianceOfficer
        as_user_id: co-verify-1
      - call: POST /producers/${p1_id}/review
        payload:
          decision: APPROVE
        as: ComplianceOfficer
        as_user_id: co-approve-9
      - call: POST /products
        payload:
          producer_id: ${p1_id}
          commodity_code: CARROT_LOOSE
          unit_of_measure: CASE
          storage_class: CHILL
          pack_weight_lb: 25
          units_per_pallet: 40
          producer_unit_price_cents: 1800
        as: Producer
        as_user_id: ${p1_id}
        captures:
          pr1_id: $.data.id
