        distinguishing_aspect: |
          Two independent state dimensions on one row: the remedy release moves remedy_status
          INTERIM_ONLY -> REMEDY_RELEASED and clears stop_sale_flag while campaign_status stays
          INTERIM_NOTIFIED and do_not_drive_flag stays true, proving the dimensions are not a
