  - rule_id: priority_pair_validation_conflict
    instances:
      - name: priority_state_over_fiscal_on_escrow_deduction
        grounds:
          - validations[priority=20]
          - validations[priority=21]
          - validations[priority=53]
          - concurrency_rules[driver-escrow-deduction-stale]
          - state_machines.Driver.ACTIVE_to_TERMINATED
        distinguishing_aspect: |
          Category pair (state, business_fiscal): one escrow-deduction request violates the
          employment-state check at priority 20, the escrow-state check at 21 and the fiscal
          balance check at 53 at once, and the response MUST be ERR_DRIVER_NOT_ACTIVE with HTTP 409 -
          the lowest-numbered state check - never the fiscal ERR_ESCROW_INSUFFICIENT_BALANCE, and
          never a 412 either, because the OCC version supplied is the current one.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "package PKG_K: OWNER_OPERATOR, PRACTICAL, per_diem_method NONE, escrow_required false, PER_MILE 58 and REVENUE_PERCENT 2500 bps"
            - "driver DRV_K assigned to PKG_K, so escrow_status stays NOT_REQUIRED with escrow_balance_cents 0"
            - "DRV_K terminated at 2026-08-06T12:00Z, so employment_status is TERMINATED"
            - "the current Driver.version is read immediately before the trigger so the OCC check passes"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages"
