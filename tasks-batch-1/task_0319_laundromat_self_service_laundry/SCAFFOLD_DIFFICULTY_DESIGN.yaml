# =============================================================================
# task_0319 — Laundromat & Self-Service Laundry — §1.8 Scaffold Difficulty Design
# Nine §0.5 Difficulty Rules × ≥2 instances each (≥18 instances total).
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# A shared bootstrap (plan + machines + members) recurs across recipes; each
# recipe rebuilds it from empty-DB so instances are independently executable.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: vend_quote_vs_charged_diverge_on_free_credit
        grounds:
          - calculations.vend_quote_cents
          - calculations.vend_charged_cents
          - entities.VendTransaction.fields.quoted_amount_cents
          - entities.VendTransaction.fields.charged_amount_cents
        distinguishing_aspect: |
          On VendTransaction, the forward-looking quote (quoted_amount_cents=300) and the
          applied charge (charged_amount_cents=0 via free credit) diverge for identical inputs;
          this is cost accounting on the VendTransaction domain.
        test_recipe:
          setup:
            - "ACTIVE plan P1: wash_base_cents=300, loyalty_cents_per_point=1, loyalty_redeem_threshold_points=50, surge 16-20."
            - "Two IDLE WASHERs W1 (used to earn points) and W2 (the trigger machine)."
            - "Member M1 ACTIVE: APP reload 5000 -> wallet 5500; an APP_WALLET vend on W1 (charged 300) accrues 300 points; redeem yields 1 free_wash_credit (points -> 250). Clock 2026-06-01T10:00:00Z (non-surge)."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: Manager
            - call: "POST /pricing-plans"
              payload: { label: "P1", wash_base_cents: 300, dry_base_cents_per_block: 75, wdf_rate_cents_per_lb: 180, surge_multiplier_bps: 15000, surge_start_hour_utc: 16, surge_end_hour_utc: 20, loyalty_cents_per_point: 1, loyalty_redeem_threshold_points: 50, reload_bonus_tier1_min_cents: 2000, reload_bonus_tier1_bps: 500, reload_bonus_tier2_min_cents: 5000, reload_bonus_tier2_bps: 1000 }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /pricing-plans/${plan_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /machines"
              payload: { label: "W1", machine_type: "WASHER", capacity_lb: 25, cycle_minutes: 30 }
              as: Manager
              captures: { w1_id: $.data.id, w1_v: $.data.version }
            - call: "POST /machines"
              payload: { label: "W2", machine_type: "WASHER", capacity_lb: 25, cycle_minutes: 30 }
              as: Manager
              captures: { w2_id: $.data.id, w2_v: $.data.version }
            - call: "POST /members"
              payload: { full_name: "M One", phone: "555-0001", card_token: "tok-m1" }
              as: Manager
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/reloads"
              payload: { tender: "APP", principal_cents: 5000 }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /machines/${w1_id}/vends"
              payload: { payment_method: "APP_WALLET", member_id: "${m1_id}", expected_machine_version: "${w1_v}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /members/${m1_id}/redeem"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
          trigger:
            - call: "POST /machines/${w2_id}/vends"
              payload: { payment_method: "APP_WALLET", member_id: "${m1_id}", used_free_credit: true, expected_machine_version: "${w2_v}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { vend_id: $.data.id }
          assert:
            - "VendTransaction.${vend_id}.quoted_amount_cents == 300"
            - "VendTransaction.${vend_id}.charged_amount_cents == 0"
            - "VendTransaction.${vend_id}.loyalty_points_earned == 0"

      - name: shift_expected_vs_counted_drawer_variance
        grounds:
          - calculations.shift_expected_drawer_cents
          - entities.Shift.fields.expected_drawer_cents
          - entities.Shift.fields.counted_drawer_cents
          - entities.Shift.fields.variance_cents
        distinguishing_aspect: |
          On the Shift domain (a different entity from VendTransaction), the system-computed
          expected_drawer_cents=7300 and the attendant-counted counted_drawer_cents=7250 diverge,
          producing variance_cents=-50; this is cash reconciliation, not cost accounting.
        test_recipe:
          setup:
            - "ACTIVE plan P1 (wash_base_cents=300, reload tier1 min 2000 @5%)."
            - "One IDLE WASHER W1; clock 2026-06-01T10:00:00Z (non-surge)."
            - "Attendant A1 (a Member acting as attendant) with an OPEN shift, opening_float_cents=5000."
            - "During the shift: one COIN washer vend (charged 300) and one CASH reload (principal 2000)."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: Manager
            - call: "POST /pricing-plans"
              payload: { label: "P1", wash_base_cents: 300, dry_base_cents_per_block: 75, wdf_rate_cents_per_lb: 180, surge_start_hour_utc: 16, surge_end_hour_utc: 20, reload_bonus_tier1_min_cents: 2000, reload_bonus_tier1_bps: 500, reload_bonus_tier2_min_cents: 5000, reload_bonus_tier2_bps: 1000 }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /pricing-plans/${plan_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /machines"
              payload: { label: "W1", machine_type: "WASHER", capacity_lb: 25 }
              as: Manager
              captures: { w1_id: $.data.id, w1_v: $.data.version }
            - call: "POST /members"
              payload: { full_name: "A One", phone: "555-0100", card_token: "tok-a1" }
              as: Manager
              captures: { a1_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Walk In", phone: "555-0200", card_token: "tok-w" }
              as: Manager
              captures: { wm_id: $.data.id }
            - call: "POST /shifts"
              payload: { attendant_id: "${a1_id}", opening_float_cents: 5000 }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { shift_id: $.data.id }
            - call: "POST /machines/${w1_id}/vends"
              payload: { payment_method: "COIN", expected_machine_version: "${w1_v}" }
              as: Attendant
              as_user_id: "${a1_id}"
            - call: "POST /members/${wm_id}/reloads"
              payload: { tender: "CASH", principal_cents: 2000 }
              as: Attendant
              as_user_id: "${a1_id}"
            - call: "POST /shifts/${shift_id}/begin-reconcile"
              payload: {}
              as: Attendant
              as_user_id: "${a1_id}"
          trigger:
            - call: "POST /shifts/${shift_id}/close"
              payload: { counted_drawer_cents: 7250 }
              as: Attendant
              as_user_id: "${a1_id}"
          assert:
            - "Shift.${shift_id}.expected_drawer_cents == 7300"
            - "Shift.${shift_id}.counted_drawer_cents == 7250"
            - "Shift.${shift_id}.variance_cents == -50"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: vend_quote_three_input_nonlinear_surge_branch
        grounds:
          - calculations.vend_quote_cents
          - entities.PricingPlan.fields.surge_multiplier_bps
          - entities.Machine.fields.machine_type
        distinguishing_aspect: |
          Mode (a): quoted_amount_cents=338 is a non-linear function of three inputs — machine_type
          branch (DRYER), dry_blocks (3) and the surge multiplier (1.5x) — with round_half_up applied
          at the multiplier step (75*3*1.5=337.5 -> 338).
        test_recipe:
          setup:
            - "ACTIVE plan P1: dry_base_cents_per_block=75, surge_multiplier_bps=15000, surge 16-20."
            - "IDLE DRYER D1; clock 2026-06-01T18:00:00Z (inside surge window)."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-01T18:00:00Z" }
              as: Manager
            - call: "POST /pricing-plans"
              payload: { label: "P1", wash_base_cents: 300, dry_base_cents_per_block: 75, wdf_rate_cents_per_lb: 180, surge_multiplier_bps: 15000, surge_start_hour_utc: 16, surge_end_hour_utc: 20 }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /pricing-plans/${plan_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /machines"
              payload: { label: "D1", machine_type: "DRYER", capacity_lb: 30 }
              as: Manager
              captures: { d1_id: $.data.id, d1_v: $.data.version }
          trigger:
            - call: "POST /machines/${d1_id}/vends"
              payload: { payment_method: "COIN", dry_blocks: 3, expected_machine_version: "${d1_v}" }
              as: Attendant
              as_user_id: "attendant-op"
              captures: { vend_id: $.data.id }
          assert:
            - "VendTransaction.${vend_id}.quoted_amount_cents == 338"
            - "VendTransaction.${vend_id}.surge_applied == true"

      - name: wdf_total_minimum_before_rush_rounding_order
        grounds:
          - calculations.wdf_total_cents
          - entities.PricingPlan.fields.wdf_minimum_cents
          - entities.PricingPlan.fields.wdf_rate_cents_per_lb
        distinguishing_aspect: |
          Mode (b): rounding/flooring order is pinned — a 5-lb load (raw=900) is floored to the
          minimum 1500 BEFORE the 25% rush surcharge, giving 1875, not 900*1.25=1125 floored later.
          Order of operations changes the cents.
        test_recipe:
          setup:
            - "ACTIVE plan P1: wdf_rate_cents_per_lb=180, wdf_minimum_cents=1500."
            - "Attendant A1; member M1; rush drop-off of a light 5-lb load."
          setup_api_calls:
            - call: "POST /pricing-plans"
              payload: { label: "P1", wash_base_cents: 300, dry_base_cents_per_block: 75, wdf_rate_cents_per_lb: 180, wdf_minimum_cents: 1500 }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /pricing-plans/${plan_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /members"
              payload: { full_name: "A One", phone: "555-0100", card_token: "tok-a1" }
              as: Manager
              captures: { a1_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "M One", phone: "555-0001", card_token: "tok-m1" }
              as: Manager
              captures: { m1_id: $.data.id }
          trigger:
            - call: "POST /wdf-orders"
              payload: { intake_attendant_id: "${a1_id}", member_id: "${m1_id}", weight_lb: 5, rush: true }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { order_id: $.data.id }
          assert:
            - "WdfOrder.${order_id}.quoted_total_cents == 1875"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: machine_cyclic_idle_running_done_idle
        grounds:
          - state_machines.Machine.IDLE_to_RUNNING
          - state_machines.Machine.RUNNING_to_DONE
          - state_machines.Machine.DONE_to_IDLE
        distinguishing_aspect: |
          Machine state machine is cyclic: a single machine returns to IDLE after a full
          IDLE->RUNNING->DONE->IDLE loop and can be vended again — a loop, not a linear pipeline.
        test_recipe:
          setup:
            - "ACTIVE plan P1; IDLE WASHER W1; clock 2026-06-01T10:00:00Z; W1.cycle_minutes=30."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: Manager
            - call: "POST /pricing-plans"
              payload: { label: "P1", wash_base_cents: 300, dry_base_cents_per_block: 75, wdf_rate_cents_per_lb: 180 }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /pricing-plans/${plan_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /machines"
              payload: { label: "W1", machine_type: "WASHER", capacity_lb: 25, cycle_minutes: 30 }
              as: Manager
              captures: { w1_id: $.data.id, w1_v0: $.data.version }
            - call: "POST /machines/${w1_id}/vends"
              payload: { payment_method: "COIN", expected_machine_version: "${w1_v0}" }
              as: Attendant
              as_user_id: "attendant-op"
            - call: "POST /machines/${w1_id}/complete-cycle"
              payload: {}
              as: Attendant
              as_user_id: "attendant-op"
            - call: "POST /machines/${w1_id}/clear"
              payload: {}
              as: Attendant
              as_user_id: "attendant-op"
            - call: "GET /machines/${w1_id}"
              payload: {}
              as: Manager
              captures: { w1_v1: $.data.version }
          trigger:
            - call: "POST /machines/${w1_id}/vends"
              payload: { payment_method: "COIN", expected_machine_version: "${w1_v1}" }
              as: Attendant
              as_user_id: "attendant-op"
              captures: { vend2_id: $.data.id }
          assert:
            - "Machine.${w1_id}.status == RUNNING"
            - "Machine.${w1_id}.lifetime_vend_count == 1"
            - "VendTransaction.${vend2_id}.cycle_status == RUNNING"

      - name: vend_parallel_payment_and_cycle_dimensions
        grounds:
          - state_machines.VendTransaction.cycle_status=RUNNING_to_cycle_status=ABORTED
          - state_machines.VendTransaction.payment_status=CAPTURED_to_payment_status=REFUNDED
          - entities.VendTransaction.fields.payment_status
          - entities.VendTransaction.fields.cycle_status
        distinguishing_aspect: |
          On a different entity (VendTransaction), payment_status and cycle_status are parallel
          dimensions: declaring a fault drives cycle_status RUNNING->ABORTED while payment_status
          stays CAPTURED; a later refund drives payment_status->REFUNDED leaving cycle_status ABORTED.
        test_recipe:
          setup:
            - "ACTIVE plan P1; IDLE WASHER W1; clock 2026-06-01T10:00:00Z."
            - "Member M1 with wallet 5000; an APP_WALLET vend RUNNING on W1 (charged 300)."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: Manager
            - call: "POST /pricing-plans"
              payload: { label: "P1", wash_base_cents: 300, dry_base_cents_per_block: 75, wdf_rate_cents_per_lb: 180, loyalty_cents_per_point: 100 }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /pricing-plans/${plan_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /machines"
              payload: { label: "W1", machine_type: "WASHER", capacity_lb: 25 }
              as: Manager
              captures: { w1_id: $.data.id, w1_v: $.data.version }
            - call: "POST /members"
              payload: { full_name: "M One", phone: "555-0001", card_token: "tok-m1" }
              as: Manager
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/reloads"
              payload: { tender: "APP", principal_cents: 5000 }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /machines/${w1_id}/vends"
              payload: { payment_method: "APP_WALLET", member_id: "${m1_id}", expected_machine_version: "${w1_v}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { vend_id: $.data.id }
            - call: "POST /refund-claims"
              payload: { vend_id: "${vend_id}", reported_by_id: "${m1_id}", reason: "MACHINE_FAULT", refund_destination: "WALLET" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { claim_id: $.data.id, claim_v: $.data.version }
          trigger:
            - call: "POST /machines/${w1_id}/declare-fault"
              payload: {}
              as: Attendant
              as_user_id: "attendant-op"
            - call: "POST /refund-claims/${claim_id}/approve"
              payload: { expected_claim_version: "${claim_v}" }
              as: Manager
          assert:
            - "VendTransaction.${vend_id}.cycle_status == ABORTED"
            - "VendTransaction.${vend_id}.payment_status == REFUNDED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: refund_approve_cascade_depth3_vend_member_ledger
        grounds:
          - state_machines.RefundClaim.SUBMITTED_to_APPROVED
          - state_machines.VendTransaction.payment_status=CAPTURED_to_payment_status=REFUNDED
          - entities.Member.fields.wallet_cents
          - entities.Member.fields.loyalty_points
          - entities.LoyaltyLedgerEntry.fields.points_delta
        distinguishing_aspect: |
          Depth-3 chain originating from refund-claim approval: approve RefundClaim (A) flips
          VendTransaction.payment_status CAPTURED->REFUNDED (B), which itself credits Member.wallet_cents
          and reverses Member.loyalty_points (C), which itself appends a LoyaltyLedgerEntry REVERSAL (D).
          Each hop is caused by the previous hop, not by the approve call directly.
        test_recipe:
          setup:
            - "ACTIVE plan P1 (wash_base 300, loyalty_cents_per_point 100, reload tier2 5000@10%)."
            - "Member M1: APP reload 5000 -> wallet 5500; APP_WALLET washer vend charged 300 -> wallet 5200, points 3, lifetime 300."
            - "A SUBMITTED RefundClaim (WALLET dest) against that vend."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: Manager
            - call: "POST /pricing-plans"
              payload: { label: "P1", wash_base_cents: 300, dry_base_cents_per_block: 75, wdf_rate_cents_per_lb: 180, loyalty_cents_per_point: 100, reload_bonus_tier1_min_cents: 2000, reload_bonus_tier1_bps: 500, reload_bonus_tier2_min_cents: 5000, reload_bonus_tier2_bps: 1000 }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /pricing-plans/${plan_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /machines"
              payload: { label: "W1", machine_type: "WASHER", capacity_lb: 25 }
              as: Manager
              captures: { w1_id: $.data.id, w1_v: $.data.version }
            - call: "POST /members"
              payload: { full_name: "M One", phone: "555-0001", card_token: "tok-m1" }
              as: Manager
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/reloads"
              payload: { tender: "APP", principal_cents: 5000 }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /machines/${w1_id}/vends"
              payload: { payment_method: "APP_WALLET", member_id: "${m1_id}", expected_machine_version: "${w1_v}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { vend_id: $.data.id }
            - call: "POST /refund-claims"
              payload: { vend_id: "${vend_id}", reported_by_id: "${m1_id}", reason: "NO_CYCLE", refund_destination: "WALLET" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { claim_id: $.data.id, claim_v: $.data.version }
          trigger:
            - call: "POST /refund-claims/${claim_id}/approve"
              payload: { expected_claim_version: "${claim_v}" }
              as: Manager
          assert:
            - "VendTransaction.${vend_id}.payment_status == REFUNDED"
            - "Member.${m1_id}.wallet_cents == 5500"
            - "Member.${m1_id}.loyalty_points == 0"
            - "Member.${m1_id}.lifetime_spend_cents == 0"
            - "the latest LoyaltyLedgerEntry for ${m1_id} has entry_type == REVERSAL and points_delta == -3"

      - name: plan_activate_cascade_depth2_retires_prior
        grounds:
          - state_machines.PricingPlan.DRAFT_to_ACTIVE
          - state_machines.PricingPlan.ACTIVE_to_RETIRED
          - entities.PricingPlan.fields.status
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (plan activation): activating plan P2 (A) forces the
          previously ACTIVE plan P1 to RETIRED (B). The retirement of P1 is caused by the activation of
          P2, a single propagation hop distinct from the refund chain's trigger.
        test_recipe:
          setup:
            - "Plan P1 created and ACTIVE; plan P2 created DRAFT."
          setup_api_calls:
            - call: "POST /pricing-plans"
              payload: { label: "P1", wash_base_cents: 300, dry_base_cents_per_block: 75, wdf_rate_cents_per_lb: 180 }
              as: Manager
              captures: { p1_id: $.data.id }
            - call: "POST /pricing-plans/${p1_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /pricing-plans"
              payload: { label: "P2", wash_base_cents: 350, dry_base_cents_per_block: 80, wdf_rate_cents_per_lb: 200 }
              as: Manager
              captures: { p2_id: $.data.id }
          trigger:
            - call: "POST /pricing-plans/${p2_id}/activate"
              payload: {}
              as: Manager
          assert:
            - "PricingPlan.${p2_id}.status == ACTIVE"
            - "PricingPlan.${p1_id}.status == RETIRED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: machine_unavailable_beats_insufficient_wallet
        grounds:
          - validations[priority=9]
          - validations[priority=13]
        distinguishing_aspect: |
          Error-category pair business_safety (priority 9, ERR_MACHINE_UNAVAILABLE) vs business_fiscal
          (priority 13, ERR_INSUFFICIENT_WALLET): a vend on a RUNNING machine by a member with an empty
          wallet returns the machine-availability error, not the balance error, because availability is
          checked first.
        test_recipe:
          setup:
            - "ACTIVE plan P1; WASHER W1 already RUNNING from a prior COIN vend."
            - "Member M1 ACTIVE with wallet_cents=0."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: Manager
            - call: "POST /pricing-plans"
              payload: { label: "P1", wash_base_cents: 300, dry_base_cents_per_block: 75, wdf_rate_cents_per_lb: 180 }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /pricing-plans/${plan_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /machines"
              payload: { label: "W1", machine_type: "WASHER", capacity_lb: 25 }
              as: Manager
              captures: { w1_id: $.data.id, w1_v: $.data.version }
            - call: "POST /members"
              payload: { full_name: "M One", phone: "555-0001", card_token: "tok-m1" }
              as: Manager
              captures: { m1_id: $.data.id }
            - call: "POST /machines/${w1_id}/vends"
              payload: { payment_method: "COIN", expected_machine_version: "${w1_v}" }
              as: Attendant
              as_user_id: "attendant-op"
            - call: "GET /machines/${w1_id}"
              payload: {}
              as: Manager
              captures: { w1_v_after: $.data.version }
          trigger:
            - call: "POST /machines/${w1_id}/vends"
              payload: { payment_method: "APP_WALLET", member_id: "${m1_id}", expected_machine_version: "${w1_v_after}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MACHINE_UNAVAILABLE (not ERR_INSUFFICIENT_WALLET)"
            - "HTTP status == 409"

      - name: not_found_beats_invalid_state_on_dispose
        grounds:
          - validations[priority=3]
          - validations[priority=16]
        distinguishing_aspect: |
          Error-category pair existence (priority 3, ERR_NOT_FOUND) vs business_temporal (priority 16,
          ERR_DISPOSAL_HOLD_ACTIVE): disposing a non-existent item id returns NOT_FOUND, proving the
          existence check runs before the temporal disposal-hold check — a different pairing than the
          first instance.
        test_recipe:
          setup:
            - "Empty lost-found store (no items)."
          setup_api_calls: []
          trigger:
            - call: "POST /lost-found/00000000-0000-4000-8000-000000000000/dispose"
              payload: {}
              as: Attendant
              as_user_id: "attendant-op"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND (not ERR_DISPOSAL_HOLD_ACTIVE)"
            - "HTTP status == 404"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: reload_bonus_tier_boundary_at_exact_minimum
        grounds:
          - calculations.reload_bonus_cents
          - entities.PricingPlan.fields.reload_bonus_tier1_min_cents
        distinguishing_aspect: |
          Numeric threshold crossing via POST /members/{id}/reloads: principal_cents exactly equal to
          reload_bonus_tier1_min_cents (2000) qualifies for the tier-1 5% bonus (>= boundary), yielding
          bonus_cents=100; 1999 would yield 0.
        test_recipe:
          setup:
            - "ACTIVE plan P1: reload_bonus_tier1_min_cents=2000, reload_bonus_tier1_bps=500."
            - "Member M1 ACTIVE, wallet 0."
          setup_api_calls:
            - call: "POST /pricing-plans"
              payload: { label: "P1", wash_base_cents: 300, dry_base_cents_per_block: 75, wdf_rate_cents_per_lb: 180, reload_bonus_tier1_min_cents: 2000, reload_bonus_tier1_bps: 500, reload_bonus_tier2_min_cents: 5000, reload_bonus_tier2_bps: 1000 }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /pricing-plans/${plan_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /members"
              payload: { full_name: "M One", phone: "555-0001", card_token: "tok-m1" }
              as: Manager
              captures: { m1_id: $.data.id }
          trigger:
            - call: "POST /members/${m1_id}/reloads"
              payload: { tender: "APP", principal_cents: 2000 }
              as: Member
              as_user_id: "${m1_id}"
              captures: { reload_id: $.data.id }
          assert:
            - "ReloadTransaction.${reload_id}.bonus_cents == 100"
            - "ReloadTransaction.${reload_id}.credited_cents == 2100"
            - "Member.${m1_id}.wallet_cents == 2100"

      - name: surge_window_end_hour_exclusive_boundary
        grounds:
          - calculations.vend_quote_cents
          - entities.PricingPlan.fields.surge_end_hour_utc
          - entities.VendTransaction.fields.surge_applied
        distinguishing_aspect: |
          A different metric (clock-hour membership in the half-open surge window [16,20)) on a different
          endpoint (POST /machines/{id}/vends): a vend captured at exactly hour 20 is NOT surged
          (end-hour exclusive), so surge_applied=false and quoted_amount_cents=300, not 450.
        test_recipe:
          setup:
            - "ACTIVE plan P1: wash_base 300, surge_multiplier_bps 15000, surge_start_hour_utc 16, surge_end_hour_utc 20."
            - "IDLE WASHER W1; clock 2026-06-01T20:00:00Z (exactly the exclusive end hour)."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-01T20:00:00Z" }
              as: Manager
            - call: "POST /pricing-plans"
              payload: { label: "P1", wash_base_cents: 300, dry_base_cents_per_block: 75, wdf_rate_cents_per_lb: 180, surge_multiplier_bps: 15000, surge_start_hour_utc: 16, surge_end_hour_utc: 20 }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /pricing-plans/${plan_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /machines"
              payload: { label: "W1", machine_type: "WASHER", capacity_lb: 25 }
              as: Manager
              captures: { w1_id: $.data.id, w1_v: $.data.version }
          trigger:
            - call: "POST /machines/${w1_id}/vends"
              payload: { payment_method: "COIN", expected_machine_version: "${w1_v}" }
              as: Attendant
              as_user_id: "attendant-op"
              captures: { vend_id: $.data.id }
          assert:
            - "VendTransaction.${vend_id}.surge_applied == false"
            - "VendTransaction.${vend_id}.quoted_amount_cents == 300"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: vend_requires_machine_idle
        grounds:
          - state_machines.Machine.IDLE_to_RUNNING
          - validations[priority=9]
          - entities.Machine.fields.status
        distinguishing_aspect: |
          Entity pair VendTransaction->Machine: a VendTransaction can be captured only when the target
          Machine.status is IDLE; a vend against a RUNNING machine is rejected with ERR_MACHINE_UNAVAILABLE.
        test_recipe:
          setup:
            - "ACTIVE plan P1; WASHER W1 RUNNING from a prior COIN vend; clock 2026-06-01T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: Manager
            - call: "POST /pricing-plans"
              payload: { label: "P1", wash_base_cents: 300, dry_base_cents_per_block: 75, wdf_rate_cents_per_lb: 180 }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /pricing-plans/${plan_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /machines"
              payload: { label: "W1", machine_type: "WASHER", capacity_lb: 25 }
              as: Manager
              captures: { w1_id: $.data.id, w1_v: $.data.version }
            - call: "POST /machines/${w1_id}/vends"
              payload: { payment_method: "COIN", expected_machine_version: "${w1_v}" }
              as: Attendant
              as_user_id: "attendant-op"
            - call: "GET /machines/${w1_id}"
              payload: {}
              as: Manager
              captures: { w1_v_after: $.data.version }
          trigger:
            - call: "POST /machines/${w1_id}/vends"
              payload: { payment_method: "COIN", expected_machine_version: "${w1_v_after}" }
              as: Attendant
              as_user_id: "attendant-op"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MACHINE_UNAVAILABLE"
            - "Machine.${w1_id}.status == RUNNING"

      - name: refund_approve_requires_vend_captured
        grounds:
          - state_machines.RefundClaim.SUBMITTED_to_APPROVED
          - validations[priority=15]
          - entities.VendTransaction.fields.payment_status
        distinguishing_aspect: |
          A different entity pair RefundClaim->VendTransaction: a second RefundClaim cannot be approved
          once the referenced VendTransaction.payment_status is already REFUNDED — the approve transition
          depends on the vend's payment_status being CAPTURED, returning ERR_ALREADY_REFUNDED.
        test_recipe:
          setup:
            - "ACTIVE plan P1; member M1 with APP_WALLET vend charged 300 already REFUNDED via an approved claim."
            - "A second SUBMITTED RefundClaim against the same vend."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: Manager
            - call: "POST /pricing-plans"
              payload: { label: "P1", wash_base_cents: 300, dry_base_cents_per_block: 75, wdf_rate_cents_per_lb: 180, loyalty_cents_per_point: 100, reload_bonus_tier2_min_cents: 5000, reload_bonus_tier2_bps: 1000, reload_bonus_tier1_min_cents: 2000, reload_bonus_tier1_bps: 500 }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /pricing-plans/${plan_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /machines"
              payload: { label: "W1", machine_type: "WASHER", capacity_lb: 25 }
              as: Manager
              captures: { w1_id: $.data.id, w1_v: $.data.version }
            - call: "POST /members"
              payload: { full_name: "M One", phone: "555-0001", card_token: "tok-m1" }
              as: Manager
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/reloads"
              payload: { tender: "APP", principal_cents: 5000 }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /machines/${w1_id}/vends"
              payload: { payment_method: "APP_WALLET", member_id: "${m1_id}", expected_machine_version: "${w1_v}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { vend_id: $.data.id }
            - call: "POST /refund-claims"
              payload: { vend_id: "${vend_id}", reported_by_id: "${m1_id}", reason: "MACHINE_FAULT", refund_destination: "WALLET" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { claim1_id: $.data.id, claim1_v: $.data.version }
            - call: "POST /refund-claims/${claim1_id}/approve"
              payload: { expected_claim_version: "${claim1_v}" }
              as: Manager
            - call: "POST /refund-claims"
              payload: { vend_id: "${vend_id}", reported_by_id: "${m1_id}", reason: "DOUBLE_CHARGE", refund_destination: "WALLET" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { claim2_id: $.data.id, claim2_v: $.data.version }
          trigger:
            - call: "POST /refund-claims/${claim2_id}/approve"
              payload: { expected_claim_version: "${claim2_v}" }
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ALREADY_REFUNDED"
            - "VendTransaction.${vend_id}.payment_status == REFUNDED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: machine_cycle_interval_single_occupancy_reject
        grounds:
          - state_machines.Machine.IDLE_to_RUNNING
          - entities.Machine.fields.cycle_ends_at
          - validations[priority=9]
        distinguishing_aspect: |
          Interval semantics: a Machine is a bounded single-occupancy resource holding the half-open
          cycle interval [capture, cycle_ends_at). A second vend whose start falls inside that running
          interval is rejected (ERR_MACHINE_UNAVAILABLE). Bounded-end interval on the Machine resource.
        test_recipe:
          setup:
            - "ACTIVE plan P1; WASHER W1 with cycle_minutes=30; clock 2026-06-01T10:00:00Z."
            - "A COIN vend at 10:00 occupies [10:00, 10:30); a second vend at 10:15 falls inside."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: Manager
            - call: "POST /pricing-plans"
              payload: { label: "P1", wash_base_cents: 300, dry_base_cents_per_block: 75, wdf_rate_cents_per_lb: 180 }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /pricing-plans/${plan_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /machines"
              payload: { label: "W1", machine_type: "WASHER", capacity_lb: 25, cycle_minutes: 30 }
              as: Manager
              captures: { w1_id: $.data.id, w1_v: $.data.version }
            - call: "POST /machines/${w1_id}/vends"
              payload: { payment_method: "COIN", expected_machine_version: "${w1_v}" }
              as: Attendant
              as_user_id: "attendant-op"
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-01T10:15:00Z" }
              as: Manager
            - call: "GET /machines/${w1_id}"
              payload: {}
              as: Manager
              captures: { w1_v_after: $.data.version }
          trigger:
            - call: "POST /machines/${w1_id}/vends"
              payload: { payment_method: "COIN", expected_machine_version: "${w1_v_after}" }
              as: Attendant
              as_user_id: "attendant-op"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MACHINE_UNAVAILABLE"
            - "Machine.${w1_id}.status == RUNNING"

      - name: shift_open_session_overlap_per_attendant_reject
        grounds:
          - validations[priority=17]
          - entities.Shift.fields.status
          - entities.Shift.fields.attendant_id
        distinguishing_aspect: |
          Different interval semantics on a different resource (Shift): an OPEN shift holds an
          open-ended interval [opened, closed) with no predetermined end. A second OPEN shift for the
          same attendant overlaps that unbounded session and is rejected (ERR_SHIFT_ALREADY_OPEN) —
          aggregate-capacity-of-1 on an open-ended interval, distinct from the bounded machine cycle.
        test_recipe:
          setup:
            - "Attendant A1 (a Member) with one OPEN shift, opening_float_cents=5000."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "A One", phone: "555-0100", card_token: "tok-a1" }
              as: Manager
              captures: { a1_id: $.data.id }
            - call: "POST /shifts"
              payload: { attendant_id: "${a1_id}", opening_float_cents: 5000 }
              as: Attendant
              as_user_id: "${a1_id}"
          trigger:
            - call: "POST /shifts"
              payload: { attendant_id: "${a1_id}", opening_float_cents: 3000 }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SHIFT_ALREADY_OPEN"
            - "HTTP status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: refund_preserves_wallet_money_conservation
        grounds:
          - state_machines.VendTransaction.payment_status=CAPTURED_to_payment_status=REFUNDED
          - entities.Member.fields.wallet_cents
          - calculations.refund_requested_cents
        distinguishing_aspect: |
          Conserved quantity = wallet money. Invariant: Member.wallet_cents after (reload credited_cents)
          then (APP_WALLET vend charged_amount_cents) then (WALLET refund approved_cents) equals
          credited_cents exactly — debit and compensating credit net to zero: 5500 - 300 + 300 == 5500.
        test_recipe:
          setup:
            - "ACTIVE plan P1; member M1 reloaded APP 5000 -> wallet 5500."
            - "APP_WALLET washer vend charged 300 -> wallet 5200; a SUBMITTED WALLET RefundClaim."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: Manager
            - call: "POST /pricing-plans"
              payload: { label: "P1", wash_base_cents: 300, dry_base_cents_per_block: 75, wdf_rate_cents_per_lb: 180, loyalty_cents_per_point: 100, reload_bonus_tier2_min_cents: 5000, reload_bonus_tier2_bps: 1000, reload_bonus_tier1_min_cents: 2000, reload_bonus_tier1_bps: 500 }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /pricing-plans/${plan_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /machines"
              payload: { label: "W1", machine_type: "WASHER", capacity_lb: 25 }
              as: Manager
              captures: { w1_id: $.data.id, w1_v: $.data.version }
            - call: "POST /members"
              payload: { full_name: "M One", phone: "555-0001", card_token: "tok-m1" }
              as: Manager
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/reloads"
              payload: { tender: "APP", principal_cents: 5000 }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /machines/${w1_id}/vends"
              payload: { payment_method: "APP_WALLET", member_id: "${m1_id}", expected_machine_version: "${w1_v}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { vend_id: $.data.id }
            - call: "POST /refund-claims"
              payload: { vend_id: "${vend_id}", reported_by_id: "${m1_id}", reason: "NO_CYCLE", refund_destination: "WALLET" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { claim_id: $.data.id, claim_v: $.data.version }
          trigger:
            - call: "POST /refund-claims/${claim_id}/approve"
              payload: { expected_claim_version: "${claim_v}" }
              as: Manager
          assert:
            - "Member.${m1_id}.wallet_cents == 5500"
            - "VendTransaction.${vend_id}.payment_status == REFUNDED"

      - name: loyalty_accrual_reversal_preserves_points_conservation
        grounds:
          - entities.Member.fields.loyalty_points
          - entities.LoyaltyLedgerEntry.fields.points_delta
          - state_machines.VendTransaction.payment_status=CAPTURED_to_payment_status=REFUNDED
        distinguishing_aspect: |
          A different conserved quantity = loyalty points. Invariant: the ACCRUAL of +3 points on the
          APP_WALLET vend plus the REVERSAL of -3 on refund sum to a net 0 point movement, so
          Member.loyalty_points returns to its pre-vend value (0) and the ledger deltas sum to 0.
        test_recipe:
          setup:
            - "ACTIVE plan P1 (loyalty_cents_per_point 100); member M1 with wallet 5500 from APP reload."
            - "APP_WALLET washer vend charged 300 accrued +3 points (loyalty_points=3); a SUBMITTED WALLET RefundClaim."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: Manager
            - call: "POST /pricing-plans"
              payload: { label: "P1", wash_base_cents: 300, dry_base_cents_per_block: 75, wdf_rate_cents_per_lb: 180, loyalty_cents_per_point: 100, reload_bonus_tier2_min_cents: 5000, reload_bonus_tier2_bps: 1000, reload_bonus_tier1_min_cents: 2000, reload_bonus_tier1_bps: 500 }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /pricing-plans/${plan_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /machines"
              payload: { label: "W1", machine_type: "WASHER", capacity_lb: 25 }
              as: Manager
              captures: { w1_id: $.data.id, w1_v: $.data.version }
            - call: "POST /members"
              payload: { full_name: "M One", phone: "555-0001", card_token: "tok-m1" }
              as: Manager
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/reloads"
              payload: { tender: "APP", principal_cents: 5000 }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /machines/${w1_id}/vends"
              payload: { payment_method: "APP_WALLET", member_id: "${m1_id}", expected_machine_version: "${w1_v}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { vend_id: $.data.id }
            - call: "POST /refund-claims"
              payload: { vend_id: "${vend_id}", reported_by_id: "${m1_id}", reason: "NO_CYCLE", refund_destination: "WALLET" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { claim_id: $.data.id, claim_v: $.data.version }
          trigger:
            - call: "POST /refund-claims/${claim_id}/approve"
              payload: { expected_claim_version: "${claim_v}" }
              as: Manager
          assert:
            - "Member.${m1_id}.loyalty_points == 0"
            - "the LoyaltyLedgerEntry rows for ${m1_id} have points_delta summing to 0 (+3 ACCRUAL, -3 REVERSAL)"
