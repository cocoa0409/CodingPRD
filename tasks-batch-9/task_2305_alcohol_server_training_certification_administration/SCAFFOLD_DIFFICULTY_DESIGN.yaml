        grounds:
          - validations.priority_19_ERR_APPROVAL_STALE_CONTENT
          - state_machines.CourseApproval.APPROVED_to_STALE
          - state_machines.Course.PUBLISHED_content_revision
          - endpoints.POST_/class-sessions/{id}/open-exam
        distinguishing_aspect: |
          The blocking state lives two entities away from the request: opening the exam
