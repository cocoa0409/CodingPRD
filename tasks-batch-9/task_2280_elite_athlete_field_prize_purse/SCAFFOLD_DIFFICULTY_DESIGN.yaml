  # ===========================================================================
  # RULE 4 — transitive_cascade (depth 4 and depth 3, different triggers)
  # ===========================================================================

  - rule_id: transitive_cascade
    instances:
      - name: adverse_finding_four_hop_clawback_and_breach_cascade
        grounds:
          - state_machines.DopingTest.COLLECTED_to_ADVERSE
          - state_machines.RaceResult.CERTIFIED_to_DISQUALIFIED
          - state_machines.PrizeAward.PAID_to_CLAWBACK_PENDING
          - state_machines.Invitation.ACCEPTED_to_BREACHED
          - calculations.purse_and_budget_ledger
          - entities.FluidStationSlot.fields.status
        distinguishing_aspect: >-
          Depth 4, each hop caused strictly by the previous one: adjudicating the OUT_OF_COMPETITION
          test ADVERSE (hop 1) disqualifies the athlete's CERTIFIED result (hop 2), which flips the
          already-PAID award to CLAWBACK_PENDING and the CLAIMED record claim to REJECTED (hop 3),
          which breaches the ACCEPTED invitation and therefore rewrites the edition's appearance and
          purse ledgers and releases the fluid-station slots (hop 4). Falsifiable in one sentence: a
          one-hop implementation leaves the RaceResult CERTIFIED, and a three-hop implementation leaves
          appearance_committed_cents at 1216000, so only a full four-hop cascade reports
          (test ADVERSE, result DISQUALIFIED, award CLAWBACK_PENDING, invitation BREACHED,
          appearance_committed_cents == 0, purse_allocated_cents == 1000000).
        test_recipe:
          setup: >-
            One domestic ELITE MALE athlete, accepted at guaranteed 1,216,000 (1,000,000 fee + 120,000
            ECONOMY + 96,000 for 3 hotel nights + 0 ground), bibbed, holding one RESERVED fluid slot at
            station 10.0 positions 5..6. An OUT_OF_COMPETITION test is scheduled and COLLECTED on
            2026-10-01 (its adjudication is deliberately deferred), and a separate IN_COMPETITION test
            on race day is COLLECTED and CLEARED so the prize can legitimately be approved and paid.
            The single OVERALL place 1 award of 1,000,000 is APPROVED by user fin-approve-1 and PAID by
            user fin-pay-2. Edition total_purse_cents = 10,000,000, appearance_budget_cents =
            10,000,000, course record null so the result also carries a CLAIMED record claim.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /race-editions
              payload:
                name: "Cascade Marathon"
                city: "Metro City"
                race_date: "2026-11-01"
                appearance_budget_cents: 10000000
                total_purse_cents: 10000000
                bonus_pool_cap_cents: 0
              as: ElitesDirector
              captures: { ed_id: "$.data.id" }
            - call: POST /division-standards
              payload: { race_edition_id: "${ed_id}", division: ELITE, gender: MALE, max_qualifying_seconds: 8100, bib_range_start: 11, bib_range_end: 20 }
              as: ElitesDirector
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: OVERALL, gender: MALE, place: 1, amount_cents: 1000000 }
              as: ElitesDirector
            - call: POST /race-editions/${ed_id}/open-field
              as: ElitesDirector
            - call: POST /rep-agents
              payload: { agency_name: "Cascade Sports", license_code: "AGT-CAS-1" }
              as: ElitesDirector
              captures: { agt1_id: "$.data.id" }
            - call: POST /athletes
              payload: { full_name: "Doped Winner", country_code: USA, gender: MALE, birth_date: "1998-03-04", whereabouts_filed: true }
              as: ElitesDirector
              captures: { ath1_id: "$.data.id" }
            - call: POST /performance-records
              payload: { athlete_id: "${ath1_id}", race_name: "Prior D", performance_date: "2026-04-01", performance_seconds: 7900, division: ELITE, sanctioning_ref: "SB-D-1", chip_timed: true }
              as: AthleteAgent
              as_user_id: "${agt1_id}"
              captures: { pr1_id: "$.data.id" }
            - call: POST /performance-records/${pr1_id}/verification
              payload: { decision: VERIFIED, official_seconds: 7900 }
              as: TechnicalOfficial
            - call: POST /invitations
              payload: { race_edition_id: "${ed_id}", athlete_id: "${ath1_id}", agent_id: "${agt1_id}", qualifying_performance_id: "${pr1_id}", division: ELITE }
              as: ElitesDirector
              captures: { inv1_id: "$.data.id" }
            - call: POST /invitations/${inv1_id}/offer
              payload: { appearance_fee_cents: 1000000, air_class: ECONOMY, hotel_nights: 3, ground_transport: false }
              as: ElitesDirector
            - call: POST /invitations/${inv1_id}/respond
              payload: { decision: ACCEPT }
