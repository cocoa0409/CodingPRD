      - name: excess_weight_group_boundary_at_five_pounds_and_the_pound_rounding
        grounds:
          - calculations.excess_weight_fee
          - entities.Airline.fields.max_excess_weight_lb
          - endpoints.POST_/baggage/bags/{id}/weigh
        distinguishing_aspect: "A numeric threshold crossing measured in whole pounds: the ceiling uses > not >=, so 4.4 lb over the threshold is one group while 4.6 lb rounds the scale reading up to 5 and is still one group, but 5.0 lb over is exactly two groups and 5.4 lb over also two."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; station SEA, lane EDS-2; airline DL with max_excess_weight_lb 50"
            - "three flights DL1423 (15:00), DL1499 (15:30) and DL1602 (16:00) so four bags can be carried; no outage active"
