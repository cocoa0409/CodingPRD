      - name: provider_suspend_three_hop_publication_allocation_session_chain
        grounds:
          - state_machines.Provider.ACTIVE_to_SUSPENDED
          - state_machines.Provider.SUSPENDED_to_ACTIVE
          - calculations.coaching_allocation_cost
          - entities.CoachingAllocation.fields.remaining_hours
          - entities.CoachingSession.fields.scheduled_hours
          - entities.RatingCycle.fields.publication_status
        distinguishing_aspect: |
          Triggering transition is Provider ACTIVE -> SUSPENDED via POST
          /providers/{provider_id}/status-changes — a third distinct trigger — and the
          chain is serial at depth 3: the suppression of the provider's ACTIVE cycle
          (hop 1) causes CoachingAllocation ACTIVE -> SUSPENDED (hop 2), which causes its
          SCHEDULED CoachingSession -> CANCELLED with 4.0 hours returned (hop 3); the
          REINSTATE reversal is deliberately asymmetric — it restores hops 1 and 2 but
          the hop-3 CANCELLED session is never recreated, so remaining_hours stays 10.0.
        test_recipe:
          setup:
            - "Logical clock starts at the 2026-08-01T00:00:00Z default."
            - "All 5 StandardDomain rows exist with weights 0.30/0.25/0.20/0.15/0.10; LEARNING_ENVIRONMENT is observation_linked with min_composite_for_block 4.00."
            - "Provider I (RURAL, active_staff_fte 2.00, credential_compliance_pct 90.00) holds a cycle awarded FINAL at awarded_tier 4, promoted to ACTIVE by the 2026-09-05 expiry run and PUBLISHED, so Provider.status == ACTIVE, current_tier == 4 and public_listing_visible == true."
            - "A STATE-funded CoachingAllocation for 2026-09-07..2026-12-31 with allocated_hours 10.0 at 12000 cents/hour gives base_hours_cost_cents 120000, admin_fee_cents 10800, total_cost_cents 130800 and spend_cap_cents 400000; the provider accepted it, so status == ACTIVE."
            - "One CoachingSession 2026-09-15T09:00:00Z..2026-09-15T13:00:00Z (4.0 hours) sits in SCHEDULED, so allocation.scheduled_hours == 4.0 and remaining_hours == 6.0."
            - "Clock sits at 2026-09-05T00:00:00Z."
