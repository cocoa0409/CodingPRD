  - section: validations
    instances:
      - name: request_without_auth_headers_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with neither X-User-Role nor X-User-ID is rejected 401 before any other check (the call below is sent with both headers omitted)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /newsroom/staff", payload: {}, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_UNAUTHENTICATED (request carried no X-User-Role / X-User-ID headers)"

      - name: greenlight_as_reporter_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]", roles]
        distinguishing_aspect: "Reporter is absent from the greenlight role list; the denial fires at priority 2 before any pitch state check."
        test_recipe:
          setup: ["pitch in DESK_REVIEW; its author attempts the greenlight"]
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk GF", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep GF", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "GF", summary: "x", desk: METRO, deadline_at: "2026-08-03T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${p_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
          trigger:
            - { call: "POST /newsroom/pitches/${p_id}/greenlight", payload: { story_type: PRINT }, as: Reporter, as_user_id: "${rep_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_FORBIDDEN"

      - name: withdraw_by_non_owner_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Ownership scope: a different reporter (valid role, wrong person) cannot withdraw the pitch; priority 6 ownership fails after role and existence pass."
        test_recipe:
          setup: ["pitch owned by reporter 1; reporter 2 exists"]
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep One WO", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { r1_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep Two WO", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { r2_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "WO", summary: "x", desk: METRO, deadline_at: "2026-08-03T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${r1_id}", captures: { p_id: "$.data.id" } }
          trigger:
            - { call: "POST /newsroom/pitches/${p_id}/withdraw", payload: {}, as: Reporter, as_user_id: "${r2_id}", captures: { err: "$.data.error_id" } }
            - { call: "GET /newsroom/pitches/${p_id}", payload: {}, as: NewsDirector, captures: { st: "$.data.status" } }
          assert:
            - "err == ERR_FORBIDDEN (X-User-ID != submitting_staff_id)"
            - "st == SUBMITTED (no drift)"

      - name: accept_by_other_staff_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Ownership scope on assignments: reporter 2 cannot accept an assignment addressed to reporter 1 even though both hold the Reporter role."
        test_recipe:
          setup: ["PROPOSED assignment for reporter 1; reporter 2 exists"]
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk AO", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep One AO", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { r1_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep Two AO", role_capability: REPORTER, home_desk: SPORTS, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { r2_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "AO", summary: "x", desk: METRO, deadline_at: "2026-08-03T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${r1_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${p_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${p_id}/greenlight", payload: { story_type: PRINT }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { story_id: "$.data.greenlit_story_id" } }
            - { call: "POST /newsroom/assignments", payload: { story_id: "${story_id}", staff_id: "${r1_id}", assignment_role: REPORTER, start_at: "2026-08-01T08:00:00Z", end_at: "2026-08-01T09:00:00Z", planned_effort_minutes: 60 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { asg_id: "$.data.id" } }
          trigger:
            - { call: "POST /newsroom/assignments/${asg_id}/accept", payload: {}, as: Reporter, as_user_id: "${r2_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_FORBIDDEN (assignee mismatch)"

      - name: capability_mismatch_on_propose
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_CAPABILITY_MISMATCH]"]
        distinguishing_aspect: "assignment_role PHOTOGRAPHER against a REPORTER-capability staff member fails ERR_CAPABILITY_MISMATCH (business_referential)."
        test_recipe:
          setup: ["REPORTER-capability staff; DRAFT story"]
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk CM", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep CM", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "CM", summary: "x", desk: METRO, deadline_at: "2026-08-03T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${p_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${p_id}/greenlight", payload: { story_type: PRINT }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { story_id: "$.data.greenlit_story_id" } }
          trigger:
            - { call: "POST /newsroom/assignments", payload: { story_id: "${story_id}", staff_id: "${rep_id}", assignment_role: PHOTOGRAPHER, start_at: "2026-08-01T08:00:00Z", end_at: "2026-08-01T09:00:00Z", planned_effort_minutes: 30 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_CAPABILITY_MISMATCH"

      - name: channel_mismatch_on_schedule
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_CHANNEL_MISMATCH]"]
        distinguishing_aspect: "A BROADCAST story cannot take a PRINT slot; ERR_CHANNEL_MISMATCH (business_referential) fires before capacity is consulted."
        test_recipe:
          setup: ["BROADCAST story CLEARED; PRINT slot with free capacity"]
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk CH", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep CH", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Copy CH", role_capability: COPY_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { copy_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Fact CH", role_capability: FACT_CHECKER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { fact_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Legal CH", role_capability: LEGAL_REVIEWER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { legal_id: "$.data.id" } }
