      - name: filing_a_petition_before_asking_a_reachable_donor_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DONOR_CONSENT_REQUIRED
          - validations.priority_30_ERR_DONOR_CONSENT_REQUIRED
          - state_machines.RestrictedFund
          - calculations.restricted_fund_transferable_amount
        distinguishing_aspect: "ERR_DONOR_CONSENT_REQUIRED guards two different doorways and both are tested here. Entering the judicial branch straight from HELD is only lawful for an unreachable donor on petition_basis DONOR_UNREACHABLE, so a reachable donor is refused (the donor must be asked before the court is) and so is an unreachable donor petitioned on the wrong basis. Then, at the far end of the machine, a fund sitting in MODIFIED is a legal transfer state that carries NO donor consent, so transfer_basis DONOR_CONSENT is refused there too - which priority 18 deliberately does not cover, because MODIFIED is a state from which transfers ARE permitted."
        test_recipe:
          setup:
            - "A deal at STRUCTURE_SELECTED, plus two TEMP_RESTRICTED funds of the initiator: fund R with a reachable donor (value 62000000) and fund U with an unreachable donor (value 30000000)"
