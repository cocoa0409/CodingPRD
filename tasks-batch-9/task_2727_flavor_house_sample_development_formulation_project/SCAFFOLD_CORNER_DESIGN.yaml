      - name: tier_two_composition_without_a_grant_forbidden
        claim_type: conditional_action
        grounds:
          - validations[priority=24]
          - entities.Formula.fields.confidentiality_tier
          - errors.ERR_IP_TIER_FORBIDDEN
        distinguishing_aspect: "The formula's own confidentiality_tier governs: a TIER_2_RESTRICTED formula under a TIER_1_STANDARD brief returns ERR_IP_TIER_FORBIDDEN (403) when read without grant_id, while GET /formulas/{formula_id} still returns its header."
        test_recipe:
          setup:
            - "Brief BRF-0001 accepted at TIER_1_STANDARD; formula F1 was created with confidentiality_tier TIER_2_RESTRICTED, holds GUM-BASE at 100.0000 % and has been costed."
          setup_api_calls:
