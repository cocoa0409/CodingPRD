      - name: harassment_appeal_cycle_corner
        claim_type: invalid_transition
        grounds:
          - state_machines.HarassmentReport.SUBSTANTIATED_to_APPEALED
        excluded_because:
          difficulty_instance: harassment_report_appeal_cycle_reenters_under_review
          rationale: "The full appeal cycle (SUBSTANTIATED->APPEALED->UNDER_REVIEW->DISMISSED) including side effects and compensation is exercised end-to-end by the named §1.8 instance."

      - name: deployment_revision_loop_corner
        claim_type: invalid_transition
        grounds:
          - state_machines.Deployment.DATA_REJECTED_to_DEBRIEFING
        excluded_because:
          difficulty_instance: deployment_data_rejected_revision_loop
          rationale: "The DEBRIEFING->DATA_REJECTED->DEBRIEFING->DATA_VALIDATED loop and the SAFETY_HOLD fork-join branch are exercised by the named §1.8 instance."

      - name: em_activation_cascade_corner
