              as: BillingAdministrator
              captures: { inv_b: $.data.id, b_lines: "$.data.line_entry_ids[0]", b_subtotal: $.data.line_subtotal_cents, b_total: $.data.total_due_cents }
          assert:
            - "Invoice A is DRAFT with line_entry_ids == [${t1}], line_subtotal_cents == 22500, admin_fee_cents == 1575, total_due_cents == 24075"
            - "The 2026-08-10..2026-08-20 candidate returns HTTP 409 with data.error_id == \"ERR_INVOICE_PERIOD_OVERLAP\" — A already covers service_date 2026-08-10, which lies inside the candidate window"
            - "The 2026-08-16..2026-08-31 candidate returns HTTP 201 even though A is still DRAFT: A's only covered service_date (2026-08-10) is outside the new window"
            - "Invoice B has line_entry_ids == [${t2}], line_subtotal_cents == 22500 and total_due_cents == 24075"
            - "The rejected candidate created nothing: GET /care/invoices?client_id=${cli} returns exactly two rows"

      - name: daily_cap_aggregates_across_clients_and_is_inclusive_at_six_hundred
        claim_type: aggregate_validation
        grounds:
          - validations[priority 72].ERR_DAILY_CAP_EXCEEDED
          - calculations.time_entry_billable_amount.constants.DAILY_BILLABLE_CAP_MINUTES
        distinguishing_aspect: "The 600-minute cap is summed per care_manager_id and service_date across every client, so two 300-minute entries for two different clients total exactly 600 and pass, the next 15-minute entry on that date is rejected, and the same 15 minutes on the following date is accepted."
        test_recipe:
          setup:
            - "CareManager Dana (hourly_rate_cents 22500) and two clients Uma and Vera (billing_increment_min 15)."
            - "All entries share service_location_id OFFICE so the travel buffer never applies, and none overlap (half-open intervals touch at 13:00)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T20:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500 }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Uma Bergstrom", residence_setting: "PRIVATE_HOME", billing_increment_min: 15 }
              as: PracticeAdmin
              captures: { cli_u: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Vera Bergstrom", residence_setting: "ASSISTED_LIVING", billing_increment_min: 15 }
              as: PracticeAdmin
              captures: { cli_v: $.data.id }
          trigger:
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli_u}", care_manager_id: "${cm_dana}", service_type: "CARE_COORDINATION", start_at: "2026-08-14T08:00:00Z", end_at: "2026-08-14T13:00:00Z", service_location_id: "OFFICE" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { e1: $.data.id, e1_min: $.data.rounded_minutes, e1_amt: $.data.billable_amount_cents }
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli_v}", care_manager_id: "${cm_dana}", service_type: "CARE_COORDINATION", start_at: "2026-08-14T13:00:00Z", end_at: "2026-08-14T18:00:00Z", service_location_id: "OFFICE" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { e2: $.data.id, e2_min: $.data.rounded_minutes, e2_amt: $.data.billable_amount_cents }
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli_u}", care_manager_id: "${cm_dana}", service_type: "CARE_COORDINATION", start_at: "2026-08-14T18:15:00Z", end_at: "2026-08-14T18:30:00Z", service_location_id: "OFFICE" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { err_cap: $.data.error_id }
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli_u}", care_manager_id: "${cm_dana}", service_type: "CARE_COORDINATION", start_at: "2026-08-15T08:00:00Z", end_at: "2026-08-15T08:15:00Z", service_location_id: "OFFICE" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { e4: $.data.id, e4_date: $.data.service_date, e4_amt: $.data.billable_amount_cents }
          assert:
            - "E1 (Uma): rounded_minutes == 300, after_hours_factor == 1.00, billable_amount_cents == 112500"
            - "E2 (Vera): rounded_minutes == 300, billable_amount_cents == 112500 — accepted at exactly 600 aggregate minutes because the comparison is <= 600"
            - "E2 does not trip ERR_TIME_ENTRY_OVERLAP: the intervals are half-open and touch at 2026-08-14T13:00:00Z"
            - "E3 returns HTTP 422 with data.error_id == \"ERR_DAILY_CAP_EXCEEDED\" (600 + 15 > 600) even though it belongs to a third-party-free window and to Uma, not Vera"
            - "E4 on 2026-08-15 returns HTTP 201 with service_date == \"2026-08-15\" and billable_amount_cents == 5625 — the cap is per service_date"
            - "GET /care/time-entries?care_manager_id=${cm_dana}&service_date=2026-08-14 returns exactly two rows"

      - name: author_cannot_review_own_assessment_or_approve_own_time_entry
