          assert:
            - "link 1: Disclosure.${dis_id}.status == WITHDRAWN and withdrawal_reason == 'Guidance withdrawn pending restatement review.'"
            - "link 2: ResponseDraft.${dr_id}.status == BLOCKED and blocked_reason == CITED_DISCLOSURE_WITHDRAWN"
            - "link 2: ResponseDraft.${dr_id}.pinned_disclosure_version == 2 (left untouched by the block)"
            - "link 3: InquiryTicket.${inq_id}.status == DRAFTING"
            - "link 3: InquiryTicket.${inq_id}.sla_due_at == 2026-08-14T09:00:00.000Z (recomputed as 2026-08-11T09:00:00Z + 72h for IR_DESK, no longer the original 2026-08-13T09:00:00.000Z)"
            - "link 4: Company.${co_id}.open_inquiry_count == 1 and Company.${co_id}.posture_recomputed_at == 2026-08-11T09:00:00.000Z"
            - "link 4: Company.${co_id}.disclosure_posture == OPEN"

      - name: meeting_release_promotes_waitlisted_request_depth_three
