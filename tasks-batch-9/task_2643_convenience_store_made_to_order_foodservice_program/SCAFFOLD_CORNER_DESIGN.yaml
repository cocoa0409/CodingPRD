              captures: { st_v: $.data.version }
            - call: "POST /stores/${store_id}/staffing-plans"
              payload: { service_date: "2026-08-01", daypart: "LUNCH", forecast_txn_count: 300, mto_share_bp: 5000, expected_store_version: "${st_v}" }
              as: StoreManager
              captures: { plan_id: $.data.id, plan_status: $.data.status }
            - call: "POST /menu-items"
              payload: { sku: "HOAGIE-ITAL", name: "Italian Hoagie", station: "SANDWICH", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 899, unit_food_cost_cents: 300, prep_seconds: 180, valid_dayparts: ["BREAKFAST", "LUNCH", "DINNER", "OVERNIGHT"], included_premium_count: 1, is_catering_eligible: true }
              as: ChainAdmin
              captures: { hoagie_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel: "CATERING", pickup_window_start: "2026-08-01T23:00:00Z", pickup_window_end: "2026-08-01T23:30:00Z" }
              as: StoreTerminal
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { menu_item_id: "${hoagie_id}", qty: 1 }
              as: StoreTerminal
          trigger:
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: StoreTerminal
              captures: { err_id: $.data.error_id }
          assert:
            - "${plan_status} == DRAFT"
            - "HTTP status == 409"
            - "${err_id} == ERR_DAYPART_PLAN_NOT_PUBLISHED"
            - "${err_id} != ERR_ORDER_MINIMUM_NOT_MET"
            - "Order.${order_id}.production_status == DRAFT"
            - "Order.${order_id}.placed_at == null"
            - "Order.${order_id}.total_cents == 0"

      - name: modifier_ownership_error_wins_over_the_modifier_limit_error
        claim_type: priority_conflict
        grounds:
          - validations[priority=19]
          - validations[priority=23]
          - errors[ERR_MODIFIER_NOT_FOR_ITEM]
        distinguishing_aspect: |
          One request violates priority 19 and priority 23 together: the modifier belongs to the coffee, not
          the hoagie, AND its qty 9 exceeds the option's max_qty 2. The lower priority number must win, so
          the answer is ERR_MODIFIER_NOT_FOR_ITEM. Checking quantities before ownership returns
          ERR_MODIFIER_LIMIT_EXCEEDED and leaks the fact that a foreign option was even looked at.
        test_recipe:
          setup:
            - "store WAWA-0101 on the default clock 2026-08-01T00:00:00Z, current_daypart BREAKFAST"
            - "hoagie 899c with its own EXTRA-PROV option; coffee 249c with an ESPRESSO-SHOT option of max_qty 2"
            - "one DRAFT anonymous TOUCHSCREEN order"
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "HOAGIE-ITAL", name: "Italian Hoagie", station: "SANDWICH", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 899, unit_food_cost_cents: 300, prep_seconds: 180, valid_dayparts: ["BREAKFAST", "LUNCH", "DINNER", "OVERNIGHT"], included_premium_count: 1, is_catering_eligible: true }
              as: ChainAdmin
              captures: { hoagie_id: $.data.id }
            - call: "POST /menu-items/${hoagie_id}/modifier-options"
              payload: { code: "EXTRA-PROV", modifier_class: "CHEESE", price_delta_cents: 60, is_premium: true, max_qty: 1 }
              as: ChainAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "COFFEE-LG", name: "Large Coffee", station: "BEVERAGE", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 249, unit_food_cost_cents: 40, prep_seconds: 45, valid_dayparts: ["BREAKFAST", "LUNCH", "DINNER", "OVERNIGHT"], included_premium_count: 0, is_catering_eligible: true }
              as: ChainAdmin
              captures: { coffee_id: $.data.id }
            - call: "POST /menu-items/${coffee_id}/modifier-options"
              payload: { code: "ESPRESSO-SHOT", modifier_class: "PREP", price_delta_cents: 90, is_premium: true, max_qty: 2 }
              as: ChainAdmin
              captures: { shot_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel: "TOUCHSCREEN" }
              as: StoreTerminal
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/lines"
              payload: { menu_item_id: "${hoagie_id}", qty: 1, modifiers: [{ modifier_option_id: "${shot_id}", qty: 9 }] }
              as: StoreTerminal
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err_id} == ERR_MODIFIER_NOT_FOR_ITEM"
            - "${err_id} != ERR_MODIFIER_LIMIT_EXCEEDED"
            - "Order.${order_id}.subtotal_gross_cents == 0"
            - "GET /order-lines?order_id=${order_id} -> total_count == 0"

      - name: preorder_one_minute_inside_the_fifteen_minute_lead_is_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=34]
          - calculations.pickup_window_capacity.constants
          - errors[ERR_PREORDER_LEAD_TIME_TOO_SHORT]
        distinguishing_aspect: |
          PREORDER_LEAD_MINUTES is 15 and the comparison is >=, so both sides of the boundary are pinned in
          one chain at clock 11:00:00Z: a window opening at 11:14:00Z is refused with
          ERR_PREORDER_LEAD_TIME_TOO_SHORT (422) and stays DRAFT, while a window opening at exactly
          11:15:00Z is accepted. The lead is measured from placement time, not from order creation.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T11:00:00Z; store in LUNCH with a PUBLISHED LUNCH plan and pickup_slot_capacity 2"
            - "coffee 249c is valid in LUNCH"
            - "two DRAFT anonymous MOBILE_PREORDER orders, one for the 11:14:00Z window and one for the 11:15:00Z window, each with a single coffee"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/daypart-transitions"
              payload: { to_daypart: "LUNCH" }
              as: StoreManager
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
              captures: { st_v: $.data.version }
            - call: "POST /stores/${store_id}/staffing-plans"
              payload: { service_date: "2026-08-01", daypart: "LUNCH", forecast_txn_count: 300, mto_share_bp: 5000, expected_store_version: "${st_v}" }
              as: StoreManager
              captures: { plan_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/publish"
              payload: {}
              as: StoreManager
            - call: "POST /menu-items"
              payload: { sku: "COFFEE-LG", name: "Large Coffee", station: "BEVERAGE", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 249, unit_food_cost_cents: 40, prep_seconds: 45, valid_dayparts: ["BREAKFAST", "LUNCH", "DINNER", "OVERNIGHT"], included_premium_count: 0, is_catering_eligible: true }
              as: ChainAdmin
              captures: { coffee_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel: "MOBILE_PREORDER", pickup_window_start: "2026-08-01T11:14:00Z", pickup_window_end: "2026-08-01T11:44:00Z" }
              as: StoreTerminal
              captures: { order_early: $.data.id }
            - call: "POST /orders/${order_early}/lines"
              payload: { menu_item_id: "${coffee_id}", qty: 1 }
              as: StoreTerminal
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel: "MOBILE_PREORDER", pickup_window_start: "2026-08-01T11:15:00Z", pickup_window_end: "2026-08-01T11:45:00Z" }
              as: StoreTerminal
              captures: { order_ok: $.data.id }
            - call: "POST /orders/${order_ok}/lines"
              payload: { menu_item_id: "${coffee_id}", qty: 1 }
              as: StoreTerminal
          trigger:
            - call: "POST /orders/${order_early}/place"
              payload: {}
              as: StoreTerminal
              captures: { err_id: $.data.error_id }
            - call: "POST /orders/${order_ok}/place"
              payload: {}
              as: StoreTerminal
              captures: { ps_ok: $.data.production_status, tot_ok: $.data.total_cents }
          assert:
            - "first trigger HTTP status == 422"
            - "${err_id} == ERR_PREORDER_LEAD_TIME_TOO_SHORT"
            - "Order.${order_early}.production_status == DRAFT"
            - "Order.${order_early}.placed_at == null"
            - "second trigger HTTP status == 200"
            - "${ps_ok} == PLACED"
            - "${tot_ok} == 249"
            - "Order.${order_ok}.service_fee_cents == 0"
            - "Order.${order_ok}.daypart_at_placement == LUNCH"

      - name: line_creation_is_gated_on_the_stores_current_daypart
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=20]
          - global_conventions.daypart_authority
          - errors[ERR_MENU_ITEM_NOT_IN_DAYPART]
        distinguishing_aspect: |
          The same request is invalid then valid with no change to the order or the menu item - only the
          STORE's current_daypart moves. A LUNCH-only coffee is refused with ERR_MENU_ITEM_NOT_IN_DAYPART
          while the store still reads BREAKFAST even though the logical clock already says 11:00:00Z, which
          proves the check reads Store.current_daypart and not the clock.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T11:00:00Z, but the store is freshly created so current_daypart is still BREAKFAST"
            - "coffee 249c has valid_dayparts [LUNCH] only"
            - "one DRAFT anonymous TOUCHSCREEN order"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id, dp0: $.data.current_daypart }
            - call: "POST /menu-items"
              payload: { sku: "COFFEE-LG", name: "Large Coffee", station: "BEVERAGE", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 249, unit_food_cost_cents: 40, prep_seconds: 45, valid_dayparts: ["LUNCH"], included_premium_count: 0, is_catering_eligible: true }
              as: ChainAdmin
              captures: { coffee_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel: "TOUCHSCREEN" }
              as: StoreTerminal
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/lines"
              payload: { menu_item_id: "${coffee_id}", qty: 1 }
              as: StoreTerminal
              captures: { err_id: $.data.error_id }
            - call: "POST /stores/${store_id}/daypart-transitions"
              payload: { to_daypart: "LUNCH" }
              as: StoreManager
              captures: { dp1: $.data.current_daypart }
            - call: "POST /orders/${order_id}/lines"
              payload: { menu_item_id: "${coffee_id}", qty: 1 }
              as: StoreTerminal
              captures: { line_id: $.data.id, gross: $.data.line_gross_cents }
          assert:
            - "${dp0} == BREAKFAST"
            - "first trigger HTTP status == 422"
            - "${err_id} == ERR_MENU_ITEM_NOT_IN_DAYPART"
            - "${dp1} == LUNCH"
            - "third trigger HTTP status == 201"
            - "${gross} == 249"
            - "OrderLine.${line_id}.station == BEVERAGE"
            - "Order.${order_id}.subtotal_gross_cents == 249"
            - "GET /order-lines?order_id=${order_id} -> total_count == 1"

      - name: fuel_combo_is_ineligible_at_a_non_fuel_site
        claim_type: conditional_validation
        grounds:
          - calculations.promotion_selection
          - entities.Store.fields.is_fuel_site
          - entities.PromotionRule.fields.kind
        distinguishing_aspect: |
          The FUEL_FOOD_COMBO branch of promotion_selection is conditional on Store.is_fuel_site. The member
          has 40 gallons on file - far past the rule's 10-gallon requirement - but the store does not sell
          fuel, so the 900c combo must be dropped from the candidate set and the 100c daypart bundle applied
          instead. The fuel-site side of the same condition is covered by
          fuel_lookback_window_includes_both_of_its_closed_bounds.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T11:00:00Z; store WAWA-0199 created with is_fuel_site false, in LUNCH with a PUBLISHED LUNCH plan"
            - "member M-1 has one 40.000-gallon fuel sale at 11:00:00Z on 2026-08-01"
            - "two ACTIVE LUNCH rules: FUEL900 (FUEL_FOOD_COMBO, 900c off, needs 10 gal) and BUNDLE100 (DAYPART_BUNDLE, 100c off)"
            - "one DRAFT TOUCHSCREEN order for member M-1 with a single hoagie, subtotal 899"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0199", name: "Wawa Inline Store", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: false }
              as: ChainAdmin
              captures: { store_id: $.data.id, fuel_flag: $.data.is_fuel_site }
            - call: "POST /stores/${store_id}/daypart-transitions"
              payload: { to_daypart: "LUNCH" }
              as: StoreManager
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
              captures: { st_v: $.data.version }
            - call: "POST /stores/${store_id}/staffing-plans"
              payload: { service_date: "2026-08-01", daypart: "LUNCH", forecast_txn_count: 300, mto_share_bp: 5000, expected_store_version: "${st_v}" }
              as: StoreManager
              captures: { plan_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/publish"
              payload: {}
              as: StoreManager
            - call: "POST /loyalty-accounts"
              payload: { member_code: "M-1", email: "m1@example.com" }
              as: ChainAdmin
              captures: { member_id: $.data.id }
            - call: "POST /loyalty-accounts/${member_id}/fuel-transactions"
              payload: { gallons: 40.000, price_per_gallon_cents: 329, occurred_at: "2026-08-01T11:00:00Z" }
              as: StoreTerminal
            - call: "POST /promotion-rules"
              payload: { code: "FUEL900", kind: "FUEL_FOOD_COMBO", discount_kind: "CENTS_OFF", discount_cents: 900, max_discount_cents: 900, valid_dayparts: ["LUNCH"], stacking_rank: 1, requires_fuel_gallons: 10 }
              as: ChainAdmin
              captures: { fuel_id: $.data.id }
            - call: "POST /promotion-rules"
              payload: { code: "BUNDLE100", kind: "DAYPART_BUNDLE", discount_kind: "CENTS_OFF", discount_cents: 100, max_discount_cents: 100, valid_dayparts: ["LUNCH"], stacking_rank: 9 }
              as: ChainAdmin
              captures: { bundle_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "HOAGIE-ITAL", name: "Italian Hoagie", station: "SANDWICH", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 899, unit_food_cost_cents: 300, prep_seconds: 180, valid_dayparts: ["BREAKFAST", "LUNCH", "DINNER", "OVERNIGHT"], included_premium_count: 1, is_catering_eligible: true }
              as: ChainAdmin
              captures: { hoagie_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel: "TOUCHSCREEN", loyalty_account_id: "${member_id}" }
              as: StoreTerminal
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { menu_item_id: "${hoagie_id}", qty: 1 }
              as: StoreTerminal
          trigger:
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: StoreTerminal
              captures: { promo: $.data.applied_promotion_id, disc: $.data.promo_discount_cents, tot: $.data.total_cents }
          assert:
            - "${fuel_flag} == false"
            - "HTTP status == 200"
            - "${promo} == ${bundle_id}"
            - "${promo} != ${fuel_id}"
            - "${disc} == 100"
            - "${tot} == 799"
            - "Order.${order_id}.points_provisional == 7"

      - name: unknown_menu_item_on_line_create_beats_the_daypart_check
        claim_type: cascading_validation
        grounds:
          - validations[priority=5]
          - validations[priority=20]
          - errors[ERR_MENU_ITEM_NOT_FOUND]
        distinguishing_aspect: |
          The daypart check cannot even be evaluated until the menu item is resolved, so existence
          (priority 5) must run first and return ERR_MENU_ITEM_NOT_FOUND (404). An implementation that
          treats an unresolvable item as "not in this daypart" answers 422 with
          ERR_MENU_ITEM_NOT_IN_DAYPART instead.
        test_recipe:
          setup:
            - "store WAWA-0101 on the default clock 2026-08-01T00:00:00Z, current_daypart BREAKFAST, no menu items at all"
            - "one DRAFT anonymous TOUCHSCREEN order"
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel: "TOUCHSCREEN" }
              as: StoreTerminal
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/lines"
              payload: { menu_item_id: "11111111-2222-3333-4444-555555555555", qty: 1 }
              as: StoreTerminal
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err_id} == ERR_MENU_ITEM_NOT_FOUND"
            - "${err_id} != ERR_MENU_ITEM_NOT_IN_DAYPART"
            - "Order.${order_id}.subtotal_gross_cents == 0"
            - "GET /order-lines?order_id=${order_id} -> total_count == 0"

      - name: pickup_window_aggregate_capacity_corner
        claim_type: aggregate_validation
        grounds:
          - validations[priority=36]
          - calculations.pickup_window_capacity
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / half_open_pickup_capacity_counts_concurrent_windows_not_exclusive_slots"
          rationale: "Three individually-legal windows that collectively breach pickup_slot_capacity, plus the touching-window escape, are all driven there."

  # =========================================================================
  - section: endpoints
    instances:

      - name: deleting_a_draft_order_line_recomputes_the_subtotal
        claim_type: standard_crud
        grounds:
          - endpoints[DELETE /orders/{id}/lines/{line_id}]
          - endpoints[GET /order-lines]
          - entities.Order.fields.subtotal_gross_cents
        distinguishing_aspect: |
          The delete is a 204 with an empty body, so the recomputation has to be observed on a follow-up
          read: after removing the 249c coffee the order subtotal must fall from 1148 back to 899 and
          Order.version must read 4 - version 1 at create, 2 and 3 for the two line adds, 4 for the delete.
          Leaving the subtotal at 1148, or not counting the delete as a write, is what this pins.
        test_recipe:
          setup:
            - "store WAWA-0101 on the default clock 2026-08-01T00:00:00Z, current_daypart BREAKFAST"
            - "one DRAFT anonymous TOUCHSCREEN order with a 899c hoagie line and a 249c coffee line, subtotal 1148"
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "HOAGIE-ITAL", name: "Italian Hoagie", station: "SANDWICH", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 899, unit_food_cost_cents: 300, prep_seconds: 180, valid_dayparts: ["BREAKFAST", "LUNCH", "DINNER", "OVERNIGHT"], included_premium_count: 1, is_catering_eligible: true }
              as: ChainAdmin
              captures: { hoagie_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "COFFEE-LG", name: "Large Coffee", station: "BEVERAGE", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 249, unit_food_cost_cents: 40, prep_seconds: 45, valid_dayparts: ["BREAKFAST", "LUNCH", "DINNER", "OVERNIGHT"], included_premium_count: 0, is_catering_eligible: true }
              as: ChainAdmin
              captures: { coffee_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel: "TOUCHSCREEN" }
              as: StoreTerminal
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { menu_item_id: "${hoagie_id}", qty: 1 }
              as: StoreTerminal
              captures: { line_h: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { menu_item_id: "${coffee_id}", qty: 1 }
              as: StoreTerminal
              captures: { line_c: $.data.id, gross_c: $.data.line_gross_cents }
          trigger:
            - call: "DELETE /orders/${order_id}/lines/${line_c}"
              payload: {}
              as: StoreTerminal
            - call: "GET /orders/${order_id}"
              payload: {}
              as: StoreTerminal
              captures: { sub_after: $.data.subtotal_gross_cents, ver: $.data.version }
          assert:
            - "${gross_c} == 249"
            - "delete HTTP status == 204"
            - "${sub_after} == 899"
            - "${ver} == 4"
            - "GET /order-lines?order_id=${order_id} -> total_count == 1"
            - "GET /order-lines/${line_h} -> data.line_gross_cents == 899"
            - "OrderLine.${line_c} no longer exists"

      - name: suspend_promotion_rule_flips_status_and_bumps_version
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /promotion-rules/{id}/suspend]
          - entities.PromotionRule.fields.status
        distinguishing_aspect: |
          suspend is the only writer of PromotionRule.status: one call moves ACTIVE to SUSPENDED and takes
          version from 1 to 2, with every pricing field left byte-identical. A second suspend on an already
          SUSPENDED rule must not silently bump the version again.
        test_recipe:
          setup:
            - "one ACTIVE LUNCH DAYPART_BUNDLE rule BUNDLE100 worth 100c off, created at version 1"
          setup_api_calls:
            - call: "POST /promotion-rules"
              payload: { code: "BUNDLE100", kind: "DAYPART_BUNDLE", discount_kind: "CENTS_OFF", discount_cents: 100, max_discount_cents: 100, valid_dayparts: ["LUNCH"], stacking_rank: 9 }
              as: ChainAdmin
              captures: { rule_id: $.data.id, s0: $.data.status, v0: $.data.version }
          trigger:
            - call: "POST /promotion-rules/${rule_id}/suspend"
              payload: {}
              as: ChainAdmin
              captures: { s1: $.data.status, v1: $.data.version, cents: $.data.discount_cents, rank: $.data.stacking_rank }
          assert:
            - "${s0} == ACTIVE"
            - "${v0} == 1"
            - "HTTP status == 200"
            - "${s1} == SUSPENDED"
            - "${v1} == 2"
            - "${cents} == 100"
            - "${rank} == 9"
            - "GET /promotion-rules?status=SUSPENDED -> total_count == 1"
            - "GET /promotion-rules?status=ACTIVE -> total_count == 0"

      - name: daypart_transition_sweeps_two_batches_and_skips_the_planned_one
        claim_type: bulk_action
        grounds:
          - endpoints[POST /stores/{id}/daypart-transitions]
          - state_machines.ProductionBatch.HOLDING_to_DISCARDED
          - calculations.waste_valuation
        distinguishing_aspect: |
          One transition call is a bulk write over the store's batches with skip-not-fail semantics: the two
          HOLDING batches (40 and 20 pretzels) are both written off for 2400 food-cost and 11940 retail and
          release both hot-case slots, while the PLANNED batch in slot 3 is skipped entirely and keeps
          status PLANNED with baked_qty 0. Sweeping only the first batch reports 1600, and sweeping the
          PLANNED batch too reports 3200 and a spurious third WasteLog.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T06:00:00Z; store in BREAKFAST; the pretzel item is BREAKFAST-only"
            - "unit BC-1 with 3 slots; batch A of 40 in slot 1 and batch B of 20 in slot 2 are both baked and pulled at 06:00, so both hold to 10:00"
            - "batch C of 30 sits in slot 3 and was never baked, so it is still PLANNED"
            - "the clock is then advanced to 2026-08-01T11:00:00Z so the LUNCH transition is due"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "BC-1", unit_type: "BAKERY_CASE", min_temp_f: 135, max_temp_f: 185, slot_count: 3 }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "PRETZEL-SOFT", name: "Soft Pretzel", station: "BAKERY", fulfillment_mode: "PAR_BAKED_CASE", base_price_cents: 199, unit_food_cost_cents: 40, bake_minutes: 25, hold_minutes: 240, valid_dayparts: ["BREAKFAST"], is_catering_eligible: true }
              as: ChainAdmin
              captures: { pretzel_id: $.data.id }
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_id}", slot_index: 1, planned_qty: 40, bake_start_at: "2026-08-01T06:00:00Z" }
              as: KitchenAssociate
              captures: { batch_a: $.data.id }
            - call: "POST /production-batches/${batch_a}/bake"
              payload: {}
              as: KitchenAssociate
            - call: "POST /production-batches/${batch_a}/pull"
              payload: {}
              as: KitchenAssociate
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_id}", slot_index: 2, planned_qty: 20, bake_start_at: "2026-08-01T06:00:00Z" }
              as: KitchenAssociate
              captures: { batch_b: $.data.id }
            - call: "POST /production-batches/${batch_b}/bake"
              payload: {}
              as: KitchenAssociate
            - call: "POST /production-batches/${batch_b}/pull"
              payload: {}
              as: KitchenAssociate
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_id}", slot_index: 3, planned_qty: 30, bake_start_at: "2026-08-01T06:00:00Z" }
              as: KitchenAssociate
              captures: { batch_c: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ChainAdmin
          trigger:
            - call: "POST /stores/${store_id}/daypart-transitions"
              payload: { to_daypart: "LUNCH" }
              as: StoreManager
              captures: { dp: $.data.current_daypart, waste: $.data.waste_cost_cents_mtd, slots: $.data.hot_case_slots_used }
          assert:
            - "HTTP status == 200"
            - "${dp} == LUNCH"
            - "${waste} == 2400"
            - "${slots} == 0"
            - "ProductionBatch.${batch_a}.status == DISCARDED"
            - "ProductionBatch.${batch_a}.discarded_qty == 40"
            - "ProductionBatch.${batch_b}.status == DISCARDED"
            - "ProductionBatch.${batch_b}.discarded_qty == 20"
            - "ProductionBatch.${batch_c}.status == PLANNED"
            - "ProductionBatch.${batch_c}.baked_qty == 0"
            - "ProductionBatch.${batch_c}.discarded_qty == 0"
            - "GET /production-batches/${batch_a}/waste-logs -> total_count == 1"
            - "GET /production-batches/${batch_b}/waste-logs -> total_count == 1"
            - "GET /production-batches/${batch_c}/waste-logs -> total_count == 0"
            - "GET /production-batches?store_id=${store_id}&status=DISCARDED -> total_count == 2"
            - "GET /stores/${store_id}/readiness -> retail_waste_exposure_cents == 11940"
            - "GET /stores/${store_id}/readiness -> food_cost_waste_cents_mtd == 2400"

      - name: fuel_transaction_links_to_its_loyalty_account_and_is_listable
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /loyalty-accounts/{id}/fuel-transactions]
          - endpoints[GET /loyalty-accounts/{id}/fuel-transactions]
          - validations[priority=4]
          - errors[ERR_LOYALTY_ACCOUNT_NOT_FOUND]
        distinguishing_aspect: |
          The link half and the existence half of the same nested route: posting under a real member stores
          loyalty_account_id and makes the row visible on that member's list, and posting the identical body
          under an unknown member id must fail with ERR_LOYALTY_ACCOUNT_NOT_FOUND (404) rather than creating
          an orphan. The second member's list must stay empty, proving the association is not global.
        test_recipe:
          setup:
            - "two loyalty accounts M-1 and M-2, both with no fuel history"
          setup_api_calls:
            - call: "POST /loyalty-accounts"
              payload: { member_code: "M-1", email: "m1@example.com" }
              as: ChainAdmin
              captures: { m1: $.data.id }
            - call: "POST /loyalty-accounts"
              payload: { member_code: "M-2", email: "m2@example.com" }
              as: ChainAdmin
              captures: { m2: $.data.id }
          trigger:
            - call: "POST /loyalty-accounts/${m1}/fuel-transactions"
              payload: { gallons: 12.500, price_per_gallon_cents: 329, occurred_at: "2026-08-01T09:15:00Z" }
              as: StoreTerminal
              captures: { ft: $.data.id, owner: $.data.loyalty_account_id, spend: $.data.fuel_spend_cents }
            - call: "POST /loyalty-accounts/99999999-8888-7777-6666-555555555555/fuel-transactions"
              payload: { gallons: 12.500, price_per_gallon_cents: 329, occurred_at: "2026-08-01T09:15:00Z" }
              as: StoreTerminal
              captures: { err_id: $.data.error_id }
          assert:
            - "first trigger HTTP status == 201"
            - "${owner} == ${m1}"
            - "${spend} == 4113"
            - "second trigger HTTP status == 404"
            - "${err_id} == ERR_LOYALTY_ACCOUNT_NOT_FOUND"
            - "GET /loyalty-accounts/${m1}/fuel-transactions -> total_count == 1"
            - "GET /loyalty-accounts/${m1}/fuel-transactions -> data[0].id == ${ft}"
            - "GET /loyalty-accounts/${m2}/fuel-transactions -> total_count == 0"

      - name: kitchen_queue_read_filters_by_station_and_orders_by_sequence
        claim_type: computed_read
        grounds:
          - endpoints[GET /stores/{id}/kitchen-queue]
          - calculations.station_queue_sequencing
          - global_conventions
        distinguishing_aspect: |
          Two placements produce four tickets across two stations. The queue read must project them ordered
          by sequence_position then created_at and honour the station filter: SANDWICH yields exactly the
          two hoagie tickets at positions 1 and 2 with lead_seconds 0 and 180, BEVERAGE yields the two coffee
          tickets with lead_seconds 0 and 45, and the unfiltered read yields 4 with total_count 4. A shared
          store-wide counter would number the second order's tickets 3 and 4.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T11:00:00Z; store in LUNCH with a PUBLISHED LUNCH plan for 2026-08-01"
            - "hoagie prep 180s at SANDWICH and coffee prep 45s at BEVERAGE, no modifiers"
            - "two anonymous TOUCHSCREEN orders, each with one hoagie and one coffee, placed in order"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/daypart-transitions"
              payload: { to_daypart: "LUNCH" }
              as: StoreManager
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
              captures: { st_v: $.data.version }
            - call: "POST /stores/${store_id}/staffing-plans"
              payload: { service_date: "2026-08-01", daypart: "LUNCH", forecast_txn_count: 300, mto_share_bp: 5000, expected_store_version: "${st_v}" }
              as: StoreManager
              captures: { plan_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/publish"
              payload: {}
              as: StoreManager
            - call: "POST /menu-items"
              payload: { sku: "HOAGIE-ITAL", name: "Italian Hoagie", station: "SANDWICH", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 899, unit_food_cost_cents: 300, prep_seconds: 180, valid_dayparts: ["BREAKFAST", "LUNCH", "DINNER", "OVERNIGHT"], included_premium_count: 1, is_catering_eligible: true }
              as: ChainAdmin
              captures: { hoagie_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "COFFEE-LG", name: "Large Coffee", station: "BEVERAGE", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 249, unit_food_cost_cents: 40, prep_seconds: 45, valid_dayparts: ["BREAKFAST", "LUNCH", "DINNER", "OVERNIGHT"], included_premium_count: 0, is_catering_eligible: true }
              as: ChainAdmin
              captures: { coffee_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel: "TOUCHSCREEN" }
              as: StoreTerminal
              captures: { order_a: $.data.id }
            - call: "POST /orders/${order_a}/lines"
              payload: { menu_item_id: "${hoagie_id}", qty: 1 }
              as: StoreTerminal
            - call: "POST /orders/${order_a}/lines"
              payload: { menu_item_id: "${coffee_id}", qty: 1 }
              as: StoreTerminal
            - call: "POST /orders/${order_a}/place"
              payload: {}
              as: StoreTerminal
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel: "TOUCHSCREEN" }
              as: StoreTerminal
              captures: { order_b: $.data.id }
            - call: "POST /orders/${order_b}/lines"
              payload: { menu_item_id: "${hoagie_id}", qty: 1 }
              as: StoreTerminal
            - call: "POST /orders/${order_b}/lines"
              payload: { menu_item_id: "${coffee_id}", qty: 1 }
              as: StoreTerminal
            - call: "POST /orders/${order_b}/place"
              payload: {}
              as: StoreTerminal
          trigger:
            - call: "GET /stores/${store_id}/kitchen-queue"
              payload: { station: "SANDWICH" }
              as: KitchenAssociate
              captures: { s1_seq: "$.data[0].sequence_position", s1_lead: "$.data[0].lead_seconds", s2_seq: "$.data[1].sequence_position", s2_lead: "$.data[1].lead_seconds" }
            - call: "GET /stores/${store_id}/kitchen-queue"
