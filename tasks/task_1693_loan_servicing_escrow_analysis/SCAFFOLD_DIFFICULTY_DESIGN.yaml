          setup:
            - "Twin loans LN-FP-1 / LN-FP-2 with ACTIVE escrow accounts; account 1 funded with 200000"
            - "Policy on each: HAZARD [2026-01-01, 2027-01-01), reported lapsed 2026-08-01, notice_1 sent 2026-08-01, reminder sent 2026-08-31 (exactly +30 days)"
