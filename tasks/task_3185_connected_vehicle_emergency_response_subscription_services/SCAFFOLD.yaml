    roles: [PlatformAdmin]
    code: 201
    input: [region_code, has_cellular, supports_data, supports_navigation]
    output: CoverageZone
    side_effects: []

  - method: GET
    path: "/coverage-zones"
    description: "List coverage zones"
    roles: [PlatformAdmin, Account, Advisor, EmergencyOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: "CoverageZone[]"
    side_effects: []

  - method: GET
    path: "/coverage-zones/{zoneId}"
    description: "Get a coverage zone"
    roles: [PlatformAdmin, Account, Advisor, EmergencyOperator]
    code: 200
    input: []
    output: CoverageZone
    side_effects: []

  - method: POST
    path: "/accounts/{accountId}/vehicles"
    description: "Register a vehicle on an account"
    roles: [Account]
    code: 201
    input: [vin, make, model, model_year, region_code, hardware_generation]
    output: Vehicle
    side_effects: ["status := ACTIVE; VIN uniqueness enforced; region must map to a CoverageZone"]

  - method: GET
    path: "/accounts/{accountId}/vehicles"
    description: "List vehicles of an account"
    roles: [PlatformAdmin, Account, Advisor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Vehicle[]"
    side_effects: []

  - method: GET
    path: "/accounts/vehicles/{vehicleId}"
    description: "Get a vehicle (prefixed alias of the flat read)"
    roles: [PlatformAdmin, Account, Advisor, EmergencyOperator, LawEnforcement, DealerService]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/accounts/vehicles"
    description: "List vehicles across accounts (flat, filterable)"
    roles: [PlatformAdmin, Account, Advisor, EmergencyOperator, LawEnforcement, DealerService]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: "Vehicle[]"
    side_effects: []

  - method: GET
    path: "/vehicles/{vehicleId}"
    description: "Get a vehicle"
    roles: [PlatformAdmin, Account, Advisor, EmergencyOperator, LawEnforcement, DealerService]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: PATCH
    path: "/vehicles/{vehicleId}"
    description: "Update vehicle status (RECOVERED->ACTIVE, ACTIVE->DECOMMISSIONED)"
    roles: [Account, PlatformAdmin]
    code: 200
    input: [status]
    output: Vehicle
    side_effects: ["Vehicle state machine transitions; DECOMMISSIONED blocked while a non-terminal subscription exists"]

  - method: POST
    path: "/accounts/{accountId}/subscriptions"
    description: "Start a trial subscription for a vehicle"
    roles: [Account]
    code: 201
    input: [vehicle_id, tier_code]
    output: Subscription
    side_effects: ["status := TRIAL; trial_start_date := logical clock date; trial_end_date := +30 days; one non-terminal subscription per vehicle enforced"]

  - method: GET
    path: "/accounts/{accountId}/subscriptions"
    description: "List subscriptions of an account"
    roles: [PlatformAdmin, Account, Advisor, EmergencyOperator]
    code: 200
    input: ["vehicle_id?", "status?", "limit?", "offset?"]
    output: "Subscription[]"
    side_effects: []

  - method: GET
    path: "/accounts/subscriptions"
    description: "List subscriptions across accounts (flat, filterable)"
    roles: [PlatformAdmin, Account, Advisor, EmergencyOperator, BillingAdmin]
    code: 200
    input: ["account_id?", "vehicle_id?", "status?", "limit?", "offset?"]
    output: "Subscription[]"
    side_effects: []

  - method: GET
    path: "/accounts/subscriptions/{subscriptionId}"
    description: "Get a subscription (prefixed alias of the flat read)"
    roles: [PlatformAdmin, Account, Advisor, EmergencyOperator, BillingAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: GET
    path: "/accounts/{accountId}/subscriptions/{subscriptionId}"
    description: "Get a subscription"
    roles: [PlatformAdmin, Account, Advisor, EmergencyOperator]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: POST
    path: "/accounts/{accountId}/subscriptions/{subscriptionId}/convert"
    description: "Convert TRIAL to ACTIVE (OCC on subscription version)"
    roles: [Account]
    code: 200
    input: [expected_subscription_version]
    output: Subscription
    side_effects: ["TRIAL -> ACTIVE; conversion_fee computed; increments Subscription.version by 1; billing period starts"]

  - method: POST
    path: "/accounts/{accountId}/subscriptions/{subscriptionId}/billing-events"
    description: "Record a billing outcome (renewal success / payment failure / retry success)"
    roles: [BillingAdmin]
    code: 200
    input: [outcome]
    output: Subscription
    side_effects: ["PAYMENT_FAILED: ACTIVE -> PAST_DUE; PAYMENT_SUCCEEDED: renewal or PAST_DUE -> ACTIVE with period reset"]

  - method: POST
    path: "/accounts/{accountId}/subscriptions/{subscriptionId}/retain-emergency"
    description: "Retention decision: keep emergency-only functionality after lapse"
    roles: [Account]
    code: 200
    input: []
    output: Subscription
    side_effects: ["LAPSED -> EMERGENCY_RETAINED within the 30-day retention window"]

  - method: POST
    path: "/accounts/{accountId}/subscriptions/{subscriptionId}/reactivate"
    description: "Reactivate an EMERGENCY_RETAINED subscription to ACTIVE (OCC)"
    roles: [Account]
    code: 200
    input: [expected_subscription_version]
    output: Subscription
    side_effects: ["EMERGENCY_RETAINED -> ACTIVE; period reset; increments Subscription.version by 1"]

  - method: POST
    path: "/accounts/{accountId}/subscriptions/{subscriptionId}/cancel"
    description: "Cancel a TRIAL, ACTIVE, or EMERGENCY_RETAINED subscription"
    roles: [Account]
    code: 200
    input: []
    output: Subscription
    side_effects: ["-> CANCELLED; emergency_only_flag := false"]

  - method: POST
    path: "/vehicles/{vehicleId}/crash-events"
    description: "Vehicle ingestion endpoint: automatic crash notification"
    roles: [SystemIngestion]
    code: 201
    input: [delta_v_kph, "rollover_detected?", "airbag_deployed?", location_region_code]
    output: CrashEvent
    side_effects: ["severity computed; below-threshold reports rejected with ERR_CRASH_THRESHOLD_NOT_MET; coverage/entitlement rejection lands the event in REJECTED_* terminal states"]

  - method: GET
    path: "/accounts/crash-events"
    description: "List crash events across vehicles (flat, filterable)"
    roles: [PlatformAdmin, Account, Advisor, EmergencyOperator]
    code: 200
    input: ["vehicle_id?", "subscription_id?", "status?", "limit?", "offset?"]
    output: "CrashEvent[]"
    side_effects: []

  - method: GET
    path: "/vehicles/{vehicleId}/crash-events"
    description: "List crash events of a vehicle"
    roles: [PlatformAdmin, Account, Advisor, EmergencyOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CrashEvent[]"
    side_effects: []

  - method: GET
    path: "/accounts/crash-events/{eventId}"
    description: "Get a crash event (prefixed alias of the flat read)"
    roles: [PlatformAdmin, Account, Advisor, EmergencyOperator]
    code: 200
    input: []
    output: CrashEvent
    side_effects: []

  - method: GET
    path: "/vehicles/{vehicleId}/crash-events/{eventId}"
    description: "Get a crash event"
    roles: [PlatformAdmin, Account, Advisor, EmergencyOperator]
    code: 200
    input: []
    output: CrashEvent
    side_effects: []

  - method: POST
