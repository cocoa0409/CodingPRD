      - name: save_play_windows_use_closed_days_with_an_aggregate_cap_of_two
        grounds:
          - calculations.save_play_window_capacity
          - validations[priority=20]
          - state_machines.SavePlay.DRAFT_to_ACTIVE
          - errors.ERR_SAVE_PLAY_WINDOW_CAPACITY
        distinguishing_aspect: |
          A different resource entity (Account) with different interval
          semantics: CLOSED INCLUSIVE calendar days and an AGGREGATE cap of two
          concurrent plays rather than a pairwise buffer. Two overlapping plays
          are legal; the third play touching 2026-08-10 is rejected, while a
          play starting 2026-08-21 is admitted.
        test_recipe:
          setup:
            - "ENTERPRISE Account with the three usage rows, health_tier AMBER, and one ACTIVE HIGH_TOUCH Csm as owner."
            - "Two ACTIVE SavePlay rows covering [2026-08-01, 2026-08-10] and [2026-08-05, 2026-08-20], so open_save_play_count is 2."
            - "Two DRAFT SavePlay rows: one for [2026-08-10, 2026-08-15] and one for [2026-08-21, 2026-08-25]."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 17 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-05-31", weekly_active_users: 40, licensed_seats: 100, feature_depth_pct: 30.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /accounts/${acct_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-06-30", weekly_active_users: 60, licensed_seats: 100, feature_depth_pct: 50.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /accounts/${acct_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-07-31", weekly_active_users: 90, licensed_seats: 100, feature_depth_pct: 80.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /save-plays"
              payload: { account_id: "${acct_id}", owner_csm_id: "${csm_a_id}", risk_code: "ADOPTION_DECLINE", play_type: "ENABLEMENT_SPRINT", window_start_date: "2026-08-01", window_end_date: "2026-08-10" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { sp1_id: $.data.id }
            - call: "POST /save-plays/${sp1_id}/transition"
              payload: { action: "ACTIVATE" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /save-plays"
              payload: { account_id: "${acct_id}", owner_csm_id: "${csm_a_id}", risk_code: "OUTCOME_MISS", play_type: "TECHNICAL_REMEDIATION", window_start_date: "2026-08-05", window_end_date: "2026-08-20" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { sp2_id: $.data.id }
            - call: "POST /save-plays/${sp2_id}/transition"
              payload: { action: "ACTIVATE" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /save-plays"
              payload: { account_id: "${acct_id}", owner_csm_id: "${csm_a_id}", risk_code: "BUDGET_PRESSURE", play_type: "COMMERCIAL_CONCESSION", window_start_date: "2026-08-10", window_end_date: "2026-08-15" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { sp3_id: $.data.id }
            - call: "POST /save-plays"
              payload: { account_id: "${acct_id}", owner_csm_id: "${csm_a_id}", risk_code: "BUDGET_PRESSURE", play_type: "COMMERCIAL_CONCESSION", window_start_date: "2026-08-21", window_end_date: "2026-08-25" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { sp4_id: $.data.id }
          trigger:
            - call: "POST /save-plays/${sp3_id}/transition"
              payload: { action: "ACTIVATE" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { capacity_err: $.data.error_id }
            - call: "POST /save-plays/${sp4_id}/transition"
              payload: { action: "ACTIVATE" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
          assert:
            - "SavePlay.${sp1_id}.state == \"ACTIVE\" and SavePlay.${sp2_id}.state == \"ACTIVE\" (two overlapping plays are legal)"
            - "the ${sp3_id} activation returns HTTP 409 with data.error_id == \"ERR_SAVE_PLAY_WINDOW_CAPACITY\" because 2026-08-10 is closed-inclusive in both existing windows"
            - "SavePlay.${sp3_id}.state remains \"DRAFT\""
            - "SavePlay.${sp4_id}.state == \"ACTIVE\" (its window starts the day after ${sp2_id} ends)"
            - "Account.${acct_id}.open_save_play_count == 3 and coverage_posture == \"RESTRICTED\""

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: csm_capacity_units_return_to_the_same_value_after_release_and_recommit
        grounds:
          - calculations.csm_capacity_conservation
          - state_machines.CoverageAssignment.COMMITTED_to_RELEASED
          - state_machines.CoverageAssignment.QUEUED_to_COMMITTED
          - entities.Csm.fields.capacity_units_committed
        distinguishing_aspect: |
          Conserved quantity 1 - integer CSM capacity units. The identity
          `capacity_units_committed == sum(load_units over COMMITTED assignments)`
          and `capacity_units_available == capacity_units_total -
          capacity_units_committed` must hold at every step of a
          commit -> release -> recommit round trip, ending at exactly 17 and 23
          with no drift.
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm with capacity_units_total 40."
            - "ENTERPRISE Account segmented to HIGH_TOUCH with load_units 17, holding one COMMITTED CoverageAssignment."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 40 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-07-31", weekly_active_users: 90, licensed_seats: 100, feature_depth_pct: 80.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /accounts/${acct_id}/segmentation"
              payload: {}
              as: CsOpsAdmin
              captures: { acct_v_seg: $.data.version }
            - call: "POST /coverage-assignments"
              payload: { account_id: "${acct_id}", expected_account_version: "${acct_v_seg}", csm_id: "${csm_a_id}" }
              as: CsOpsAdmin
              captures: { ca1_id: $.data.id }
          trigger:
            - call: "POST /coverage-assignments/${ca1_id}/release"
              payload: { release_reason: "Pod reshuffle" }
              as: CsOpsAdmin
            - call: "GET /csms/${csm_a_id}"
              payload: {}
              as: CsOpsAdmin
              captures: { committed_after_release: $.data.capacity_units_committed }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: CsOpsAdmin
              captures: { acct_v2: $.data.version }
            - call: "POST /coverage-assignments"
              payload: { account_id: "${acct_id}", expected_account_version: "${acct_v2}", csm_id: "${csm_a_id}" }
              as: CsOpsAdmin
              captures: { ca2_id: $.data.id }
          assert:
            - "before the release Csm.${csm_a_id}.capacity_units_committed == 17 and capacity_units_available == 23"
            - "after the release Csm.${csm_a_id}.capacity_units_committed == 0 and capacity_units_available == 40, and CoverageAssignment.${ca1_id}.state == \"RELEASED\""
            - "after the recommit Csm.${csm_a_id}.capacity_units_committed == 17 and capacity_units_available == 23 (identical to the pre-release values, no drift)"
            - "CoverageAssignment.${ca2_id}.state == \"COMMITTED\" with load_units == 17, and exactly one CoverageAssignment of ${csm_a_id} is in state COMMITTED"
            - "Account.${acct_id}.assigned_csm_id == ${csm_a_id} and coverage_posture == \"OPEN\""

      - name: remediation_credit_outstanding_returns_to_zero_after_case_withdrawal
        grounds:
          - calculations.remediation_credit_conservation
          - state_machines.RemediationCommitment.PROPOSED_to_ACCEPTED
          - state_machines.EscalationCase.OPEN_to_WITHDRAWN
          - entities.Account.fields.remediation_credit_outstanding_cents
        distinguishing_aspect: |
          Conserved quantity 2 - a different type entirely: money in cents held
          on Account.remediation_credit_outstanding_cents. Accepting two
          commitments accrues 600000 + 250000 = 850000, and withdrawing the case
          must reverse exactly that amount, leaving outstanding at 0 and
          settled at 0 with no residue.
        test_recipe:
          setup:
            - "ENTERPRISE Account, arr_cents 30000000, with one CXO ACTIVE economic buyer."
            - "One DRAFT SavePlay and one EscalationCase in state OPEN at remediation_round 1."
            - "Two RemediationCommitment rows of 600000 and 250000 cents, both ACCEPTED, so remediation_credit_outstanding_cents is 850000."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 17 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/sponsor-contacts"
              payload: { full_name: "Dana Reed", seniority: "CXO", is_economic_buyer: true }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { sponsor_id: $.data.id }
            - call: "POST /save-plays"
              payload: { account_id: "${acct_id}", owner_csm_id: "${csm_a_id}", risk_code: "SUPPORT_ESCALATION", play_type: "TECHNICAL_REMEDIATION", window_start_date: "2026-08-01", window_end_date: "2026-09-30" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /escalation-cases"
              payload: { account_id: "${acct_id}", save_play_id: "${sp_id}", severity: "HIGH", summary: "Repeat P1 incidents" }
              as: CsExecutive
              as_user_id: "exec-1"
              captures: { esc_id: $.data.id, esc_v: $.data.version }
            - call: "POST /escalation-cases/${esc_id}/remediation-commitments"
              payload: { description: "Service credit tranche one", due_date: "2026-09-15", credit_cents: 600000, expected_escalation_case_version: "${esc_v}" }
              as: CsExecutive
              as_user_id: "exec-1"
              captures: { rc1_id: $.data.id }
            - call: "GET /escalation-cases/${esc_id}"
              payload: {}
              as: CsExecutive
              as_user_id: "exec-1"
              captures: { esc_v2: $.data.version }
            - call: "POST /escalation-cases/${esc_id}/remediation-commitments"
              payload: { description: "Service credit tranche two", due_date: "2026-09-30", credit_cents: 250000, expected_escalation_case_version: "${esc_v2}" }
              as: CsExecutive
              as_user_id: "exec-1"
              captures: { rc2_id: $.data.id }
            - call: "POST /remediation-commitments/${rc1_id}/transition"
              payload: { action: "ACCEPT" }
              as: CsExecutive
              as_user_id: "exec-1"
            - call: "POST /remediation-commitments/${rc2_id}/transition"
              payload: { action: "ACCEPT" }
              as: CsExecutive
              as_user_id: "exec-1"
          trigger:
            - call: "POST /escalation-cases/${esc_id}/transition"
              payload: { action: "WITHDRAW" }
              as: CsExecutive
              as_user_id: "exec-1"
          assert:
            - "before the trigger Account.${acct_id}.remediation_credit_outstanding_cents == 850000 and remediation_credit_settled_cents == 0"
            - "after the trigger EscalationCase.${esc_id}.state == \"WITHDRAWN\" and final_credit_cents == null"
            - "after the trigger RemediationCommitment.${rc1_id}.state == \"WITHDRAWN\" and RemediationCommitment.${rc2_id}.state == \"WITHDRAWN\""
            - "after the trigger Account.${acct_id}.remediation_credit_outstanding_cents == 0 (the full 850000 was reversed, no residue) and remediation_credit_settled_cents == 0"
            - "calculations.remediation_credit_conservation holds: the sum over ACCEPTED and DELIVERED commitments on non-terminal cases is 0"
