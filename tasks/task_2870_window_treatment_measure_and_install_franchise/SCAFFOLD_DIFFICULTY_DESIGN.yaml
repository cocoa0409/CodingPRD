              as_user_id: "${t1}"
              captures: { d1: $.data.id }
            - call: "POST /blinds/vendors"
              payload: { name: "Ridgeline Shade Works", base_lead_time_days: 10, motorization_extra_days: 3, cutoff_hour_utc: 15, remake_policy: "FULL_VENDOR_90D", concurrent_capacity: 2, supported_lift_systems: ["CORDED", "CORDLESS", "MOTORIZED"] }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { v1: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Ana Ruiz", postal_code: "30301", source: "WEB_FORM", requested_at: "2026-08-03T00:00:00.000Z", child_occupied_dwelling: false }
              as: Franchisee
