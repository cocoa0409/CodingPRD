            - call: "POST /mile-sale-agreements"
              payload:
                issuer_id: "${issuer_id}"
                term_start_date: "2026-09-01"
                term_end_date: "2027-08-31"
                committed_volume_miles: 1000000
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 200 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { agr_id: "$.data.id" }
            - call: "POST /mile-sale-agreements/${agr_id}/submit"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
            - call: "POST /mile-sale-agreements/${agr_id}/ratify"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
            - call: "POST /mile-sale-agreements/${agr_id}/activate"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
              captures: { agr_v: "$.data.version" }
            - call: "POST /mile-purchase-orders"
              payload: { agreement_id: "${agr_id}", order_miles: 100000, expected_agreement_version: "${agr_v}" }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { order_id: "$.data.id" }
          trigger:
            - call: "POST /mile-purchase-orders/${order_id}/invoice"
              payload: {}
              as: RevenueAccountant
            - call: "POST /mile-purchase-orders/${order_id}/issue"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
            - call: "POST /mile-purchase-orders/${order_id}/invoice"
              payload: {}
              as: RevenueAccountant
            - call: "POST /mile-purchase-orders/${order_id}/settle"
              payload: {}
              as: RevenueAccountant
          assert:
            - "the first invoice call returns 409 with error_id ERR_INVALID_STATE and leaves settlement_status == PENDING"
            - "MilePurchaseOrder.${order_id}.fulfillment_status == ISSUED"
            - "MilePurchaseOrder.${order_id}.settlement_status == SETTLED"
            - "MilePurchaseOrder.${order_id}.gross_amount_cents == 200000"
            - "MilePurchaseOrder.${order_id}.final_amount_cents == 200000"
            - "MilePurchaseOrder.${order_id}.volume_true_up_cents == 0"
            - "MilePurchaseOrder.${order_id}.net_amount_cents == 200000"
            - "MileSaleAgreement.${agr_id}.drawn_miles == 100000"
            - "MileSaleAgreement.${agr_id}.prepayment_balance_miles == 100000"
            - "LoyaltyProgram.${prog_id}.deferred_revenue_cents == 200000"

  # ===================================================================
  - rule_id: transitive_cascade
    instances:

      - name: fraud_substantiation_five_hop_cascade
        grounds:
          - state_machines.FraudCase.INVESTIGATING_to_SUBSTANTIATED
          - state_machines.MemberAccount.security_state_NORMAL_to_FROZEN
          - state_machines.AwardBooking.HELD_to_CANCELLED
          - state_machines.AwardInventoryWindow.CONSTRAINED_to_OPEN
          - calculations.fraud_risk_and_clawback
          - entities.LoyaltyProgram.fields.outstanding_miles
          - entities.AwardInventoryWindow.fields.load_factor_bps
        distinguishing_aspect: |
          One substantiate call propagates five hops through five DIFFERENT entities:
          FraudCase.status -> MemberAccount.security_state + a synthetic ADJUSTMENT MileTransaction
          of -60000 -> AwardBooking HELD->CANCELLED -> AwardInventoryWindow seats_held 8->0 flipping
          capacity_control_state CONSTRAINED->OPEN -> LoyaltyProgram.outstanding_miles 60000->0;
          none of these five effects is reachable without the hop before it.
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08, outstanding_miles 60000."
            - "One MemberAccount, security_state NORMAL, elite_tier BASE, mile_balance 60000, built from a 50000-mile card-spend earn and a 10000-mile partner earn both dated 2026-07-01."
            - "One AwardInventoryWindow JFK-LHR BUSINESS 2026-09-01..2026-09-30 with authorized_seats 10, carrying one HELD 8-seat FLEX AwardBooking, so seats_held is 8, load_factor_bps 8000 and capacity_control_state CONSTRAINED."
            - "One MILE_BROKERING FraudCase in status INVESTIGATING with detection_score 17, opened by user fa-1."
            - "Logical clock at its 2026-08-01T00:00:00Z default, so the 90-day clawback lookback covers 2026-05-03..2026-08-01."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Cascade", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-BROKER", home_region: "AMER" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "CARD_SPEND_EARN", activity_date: "2026-07-01", qualifying_spend_cents: 5000000 }
              as: RevenueAccountant
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "PARTNER_EARN", activity_date: "2026-07-01", base_miles: 10000 }
              as: RevenueAccountant
            - call: "POST /award-inventory-windows"
              payload: { program_id: "${prog_id}", route_code: "JFK-LHR", cabin: "BUSINESS", window_start_date: "2026-09-01", window_end_date: "2026-09-30", authorized_seats: 10 }
              as: ProgramAdmin
              captures: { win_id: "$.data.id", win_v: "$.data.version" }
            - call: "POST /award-bookings"
              payload: { member_id: "${mem_id}", window_id: "${win_id}", travel_date: "2026-09-15", seats: 8, fare_class: "FLEX", expected_window_version: "${win_v}" }
              as: ProgramAdmin
              captures: { bk_id: "$.data.id" }
            - call: "POST /fraud-cases"
              payload: { member_id: "${mem_id}", case_type: "MILE_BROKERING", login_geo_velocity: 1, redemption_velocity_24h: 1, brokering_pattern_hits: 1, dormancy_days: 40 }
              as: FraudAnalyst
              as_user_id: "fa-1"
              captures: { case_id: "$.data.id", score: "$.data.detection_score" }
            - call: "POST /fraud-cases/${case_id}/investigate"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fa-1"
          trigger:
            - call: "POST /fraud-cases/${case_id}/substantiate"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fa-2"
          assert:
            - "FraudCase.${case_id}.detection_score == 17"
            - "FraudCase.${case_id}.status == SUBSTANTIATED"
            - "FraudCase.${case_id}.clawback_miles == 60000"
            - "FraudCase.${case_id}.freeze_applied == true"
            - "FraudCase.${case_id}.adjudicated_by_user_id == \"fa-2\""
            - "MemberAccount.${mem_id}.security_state == FROZEN"
            - "MemberAccount.${mem_id}.mile_balance == 0"
            - "MemberAccount.${mem_id}.risk_score == 17"
            - "GET /mile-transactions?member_id=${mem_id}&txn_type=ADJUSTMENT returns total_count 1 with total_miles == -60000"
            - "AwardBooking.${bk_id}.status == CANCELLED"
            - "AwardBooking.${bk_id}.quoted_miles == 612000"
            - "AwardInventoryWindow.${win_id}.seats_held == 0"
            - "AwardInventoryWindow.${win_id}.load_factor_bps == 0"
            - "AwardInventoryWindow.${win_id}.capacity_control_state == OPEN"
            - "LoyaltyProgram.${prog_id}.outstanding_miles == 0"

      - name: agreement_ratification_supersede_cascade
        grounds:
          - state_machines.MileSaleAgreement.ISSUER_REVIEW_to_RATIFIED
          - state_machines.MileSaleAgreement.ACTIVE_to_TERMINATED
          - entities.MileSaleAgreement.fields.supersedes_agreement_id
          - entities.MileSaleAgreement.fields.prepayment_balance_miles
          - entities.CoBrandIssuer.fields.aggregate_committed_miles
          - entities.CoBrandIssuer.fields.suspension_reason
          - validations[priority=34]
        distinguishing_aspect: |
          A different cascade CHAIN SHAPE than the fraud instance: this one runs along the
          self-referential MileSaleAgreement.supersedes_agreement_id edge, so ratifying the
          successor terminates its predecessor (hop 1), sweeps 1000000 prepayment miles from the
          predecessor onto the successor (hop 2), and recomputes the issuer aggregate to 7000000,
          which crosses 90% of the 7500000 cap and suspends the issuer with CAP_BREACH (hop 3).
        test_recipe:
          setup:
            - "One LoyaltyProgram and one CoBrandIssuer with annual_mile_purchase_cap_miles 7500000, status ACTIVE."
            - "Agreement A1 ACTIVE, committed_volume_miles 6000000, term 2026-09-01..2027-08-31, tier_schedule [{0,150}], with one ISSUED 1000000-mile order so its drawn_miles and prepayment_balance_miles are both 1000000."
            - "The issuer's aggregate_committed_miles is 6000000, below the 6750000 utilization alert."
            - "Agreement A2 in ISSUER_REVIEW, committed_volume_miles 7000000, term 2027-09-01..2028-08-31, supersedes_agreement_id A1, negotiated by pm-1."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Supersede", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /co-brand-issuers"
              payload: { program_id: "${prog_id}", name: "Northbank Card Services", annual_mile_purchase_cap_miles: 7500000 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { issuer_id: "$.data.id" }
            - call: "POST /mile-sale-agreements"
              payload:
                issuer_id: "${issuer_id}"
                term_start_date: "2026-09-01"
                term_end_date: "2027-08-31"
                committed_volume_miles: 6000000
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 150 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { a1_id: "$.data.id" }
            - call: "POST /mile-sale-agreements/${a1_id}/submit"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
            - call: "POST /mile-sale-agreements/${a1_id}/ratify"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
            - call: "POST /mile-sale-agreements/${a1_id}/activate"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
              captures: { a1_v: "$.data.version" }
            - call: "POST /mile-purchase-orders"
              payload: { agreement_id: "${a1_id}", order_miles: 1000000, expected_agreement_version: "${a1_v}" }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { order_id: "$.data.id" }
            - call: "POST /mile-purchase-orders/${order_id}/issue"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
            - call: "POST /mile-sale-agreements"
              payload:
                issuer_id: "${issuer_id}"
                term_start_date: "2027-09-01"
                term_end_date: "2028-08-31"
                committed_volume_miles: 7000000
                supersedes_agreement_id: "${a1_id}"
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 140 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { a2_id: "$.data.id" }
            - call: "POST /mile-sale-agreements/${a2_id}/submit"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
          trigger:
            - call: "POST /mile-sale-agreements/${a2_id}/ratify"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
          assert:
            - "MileSaleAgreement.${a2_id}.status == RATIFIED"
            - "MileSaleAgreement.${a1_id}.status == TERMINATED"
            - "MileSaleAgreement.${a1_id}.prepayment_balance_miles == 0"
            - "MileSaleAgreement.${a2_id}.prepayment_balance_miles == 1000000"
            - "MileSaleAgreement.${a1_id}.drawn_miles == 1000000"
            - "CoBrandIssuer.${issuer_id}.aggregate_committed_miles == 7000000"
            - "CoBrandIssuer.${issuer_id}.status == SUSPENDED"
            - "CoBrandIssuer.${issuer_id}.suspension_reason == CAP_BREACH"
            - "MilePurchaseOrder.${order_id}.gross_amount_cents == 1500000"
            - "LoyaltyProgram.${prog_id}.deferred_revenue_cents == 1500000"

  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: frozen_member_state_beats_insufficient_miles_fiscal
        grounds:
          - validations[priority=12]
          - validations[priority=31]
          - calculations.fraud_risk_and_clawback
          - state_machines.MemberAccount.security_state_NORMAL_to_FROZEN
          - errors.ERR_MEMBER_FROZEN
          - errors.ERR_INSUFFICIENT_MILES
        distinguishing_aspect: |
          A single REDEEM for 5000 miles against a FROZEN member holding only 1000 miles violates
          the business_safety rule at priority 12 and the business_fiscal rule at priority 31
          simultaneously, and the response is ERR_MEMBER_FROZEN (409), never
          ERR_INSUFFICIENT_MILES (402).
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One MemberAccount with mile_balance exactly 1000 from a single 100000-cent card-spend earn dated 2026-07-20."
            - "One ACCOUNT_TAKEOVER FraudCase with detection_score 100, which drove security_state to FROZEN at case creation."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Priority", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-ATO", home_region: "APAC" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "CARD_SPEND_EARN", activity_date: "2026-07-20", qualifying_spend_cents: 100000 }
              as: RevenueAccountant
            - call: "POST /fraud-cases"
              payload: { member_id: "${mem_id}", case_type: "ACCOUNT_TAKEOVER", login_geo_velocity: 10, redemption_velocity_24h: 5, brokering_pattern_hits: 4, dormancy_days: 400 }
              as: FraudAnalyst
              as_user_id: "fa-1"
              captures: { case_id: "$.data.id" }
          trigger:
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "REDEEM", activity_date: "2026-08-01", base_miles: 5000 }
              as: RevenueAccountant
              captures: { err: "$.data.error_id" }
          assert:
            - "the trigger returns HTTP 409 with data.error_id == ERR_MEMBER_FROZEN"
            - "the trigger does NOT return ERR_INSUFFICIENT_MILES and does NOT return HTTP 402"
            - "FraudCase.${case_id}.detection_score == 100"
            - "MemberAccount.${mem_id}.security_state == FROZEN"
            - "MemberAccount.${mem_id}.mile_balance == 1000"
            - "GET /mile-transactions?member_id=${mem_id} returns total_count 1"
            - "LoyaltyProgram.${prog_id}.outstanding_miles == 1000"

      - name: promotion_window_in_past_temporal_beats_overlap_constraint
        grounds:
          - validations[priority=15]
          - validations[priority=19]
          - errors.ERR_WINDOW_IN_PAST
          - errors.ERR_PROMOTION_WINDOW_OVERLAP
          - entities.PromotionCampaign.fields.window_start
        distinguishing_aspect: |
          A DIFFERENT error-category pair than the frozen/insufficient instance
          (business_temporal at priority 15 versus business_constraint at priority 19): one campaign
          request is both backdated and overlapping, and the response is ERR_WINDOW_IN_PAST (422),
          never ERR_PROMOTION_WINDOW_OVERLAP (409).
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One SCHEDULED CARD_SPEND PromotionCampaign over [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z)."
            - "Logical clock at its 2026-08-01T00:00:00Z default, so any window opening on 2026-07-01 is in the past."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Promo Priority", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /promotion-campaigns"
              payload: { program_id: "${prog_id}", code: "SEPT-SPEND", earn_channel: "CARD_SPEND", multiplier_bps: 15000, stacking_mode: "ADDITIVE", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { camp1_id: "$.data.id" }
          trigger:
            - call: "POST /promotion-campaigns"
              payload: { program_id: "${prog_id}", code: "BACKDATED-OVERLAP", earn_channel: "CARD_SPEND", multiplier_bps: 12500, stacking_mode: "ADDITIVE", window_start: "2026-07-01T00:00:00Z", window_end: "2026-09-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "the trigger returns HTTP 422 with data.error_id == ERR_WINDOW_IN_PAST"
            - "the trigger does NOT return ERR_PROMOTION_WINDOW_OVERLAP and does NOT return HTTP 409"
            - "GET /promotion-campaigns?program_id=${prog_id} returns total_count 1"
            - "PromotionCampaign.${camp1_id}.status == SCHEDULED"

  # ===================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: elite_tier_awarded_at_exact_qualifying_miles_threshold
        grounds:
          - calculations.elite_qualification_and_rollover
          - state_machines.MemberAccount.qualification_state_ACCUMULATING_to_CLOSED
          - entities.MemberAccount.fields.awarded_tier_at_close
          - entities.MemberAccount.fields.rollover_carried_out
        distinguishing_aspect: |
          Two members separated by exactly one qualifying mile land on different tiers: 75000
          effective miles earns GOLD with rollover_carried_out 0, while 74999 earns only SILVER and
          - counter-intuitively - banks the ROLLOVER_CAP_MILES maximum of 40000 (clipped from the
          49999 surplus over SILVER's 25000 threshold).
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "MemberAccount M1 with qualifying_miles_ytd 75000 (66000 flight miles over 4 segments plus 9000 card-spend miles), qualifying_spend_cents_ytd 900000, rollover_carried_in 0, qualification_state ACCUMULATING."
            - "MemberAccount M2 identical except its flight earn is 65999 miles, so qualifying_miles_ytd is 74999."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Qualification", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-EXACT", home_region: "AMER", rollover_carried_in: 0 }
              as: ProgramAdmin
              captures: { m1_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-ONESHORT", home_region: "AMER", rollover_carried_in: 0 }
              as: ProgramAdmin
              captures: { m2_id: "$.data.id" }
            - call: "POST /mile-transactions"
              payload: { member_id: "${m1_id}", txn_type: "FLIGHT_EARN", activity_date: "2026-07-10", base_miles: 66000, segments: 4 }
              as: RevenueAccountant
            - call: "POST /mile-transactions"
              payload: { member_id: "${m1_id}", txn_type: "CARD_SPEND_EARN", activity_date: "2026-07-11", qualifying_spend_cents: 900000 }
              as: RevenueAccountant
            - call: "POST /mile-transactions"
              payload: { member_id: "${m2_id}", txn_type: "FLIGHT_EARN", activity_date: "2026-07-10", base_miles: 65999, segments: 4 }
              as: RevenueAccountant
            - call: "POST /mile-transactions"
              payload: { member_id: "${m2_id}", txn_type: "CARD_SPEND_EARN", activity_date: "2026-07-11", qualifying_spend_cents: 900000 }
              as: RevenueAccountant
          trigger:
            - call: "POST /member-accounts/${m1_id}/qualification-cycle/close"
              payload: {}
              as: ProgramAdmin
            - call: "POST /member-accounts/${m2_id}/qualification-cycle/close"
              payload: {}
              as: ProgramAdmin
          assert:
            - "MemberAccount.${m1_id}.qualifying_miles_ytd == 75000"
            - "MemberAccount.${m1_id}.awarded_tier_at_close == GOLD"
            - "MemberAccount.${m1_id}.elite_tier == GOLD"
            - "MemberAccount.${m1_id}.rollover_carried_out == 0"
            - "MemberAccount.${m1_id}.qualification_state == CLOSED"
            - "MemberAccount.${m2_id}.qualifying_miles_ytd == 74999"
            - "MemberAccount.${m2_id}.awarded_tier_at_close == SILVER"
            - "MemberAccount.${m2_id}.elite_tier == SILVER"
            - "MemberAccount.${m2_id}.rollover_carried_out == 40000"
            - "MemberAccount.${m1_id}.qualifying_segments_ytd == 4 and MemberAccount.${m2_id}.qualifying_segments_ytd == 4"
            - "MemberAccount.${m1_id}.mile_balance == 75000 and MemberAccount.${m2_id}.mile_balance == 74999"

      - name: promo_bonus_zero_when_campaign_cap_exactly_exhausted
        grounds:
          - calculations.earning_credit_with_multipliers
          - entities.PromotionCampaign.fields.bonus_cap_miles
          - entities.PromotionCampaign.fields.accrued_bonus_miles
          - entities.MileTransaction.fields.bonus_miles
        distinguishing_aspect: |
          A cap-exhaustion boundary rather than a tier-threshold boundary: the first earn drives
          accrued_bonus_miles to EXACTLY bonus_cap_miles 5000, so the second earn - which would
          otherwise have qualified for 5000 bonus miles - is created with HTTP 201 and
          bonus_miles 0 and total_miles 5000, leaving accrued_bonus_miles pinned at 5000 rather
          than rejecting the transaction.
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One FLIGHT PromotionCampaign, multiplier_bps 20000, stacking_mode ADDITIVE, bonus_cap_miles 5000, window [2026-08-01T00:00:00Z, 2026-12-01T00:00:00Z), made LIVE by run-epoch at the clock default."
            - "MemberAccount M1 at elite_tier GOLD via a status match; MemberAccount M2 at elite_tier BASE."
            - "Logical clock at its 2026-08-01T00:00:00Z default, which is exactly the campaign's window_start."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Promo Cap", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /promotion-campaigns"
              payload: { program_id: "${prog_id}", code: "AUG-FLIGHT-2X", earn_channel: "FLIGHT", multiplier_bps: 20000, stacking_mode: "ADDITIVE", window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z", bonus_cap_miles: 5000 }
              as: ProgramAdmin
              captures: { camp_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-GOLD", home_region: "EMEA" }
              as: ProgramAdmin
              captures: { m1_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-BASE", home_region: "EMEA" }
              as: ProgramAdmin
              captures: { m2_id: "$.data.id" }
            - call: "POST /member-accounts/${m1_id}/status-match"
              payload: { matched_tier: "GOLD", trial_days: 90 }
              as: ProgramAdmin
            - call: "POST /_ops/run-epoch"
              payload: { program_id: "${prog_id}" }
              as: ProgramAdmin
          trigger:
            - call: "POST /mile-transactions"
              payload: { member_id: "${m1_id}", txn_type: "FLIGHT_EARN", activity_date: "2026-08-01", base_miles: 5000, segments: 2, promotion_id: "${camp_id}" }
              as: RevenueAccountant
              captures: { txn1_id: "$.data.id" }
            - call: "POST /mile-transactions"
              payload: { member_id: "${m2_id}", txn_type: "FLIGHT_EARN", activity_date: "2026-08-01", base_miles: 5000, segments: 2, promotion_id: "${camp_id}" }
              as: RevenueAccountant
              captures: { txn2_id: "$.data.id" }
          assert:
            - "MileTransaction.${txn1_id}.elite_tier_at_earn == GOLD"
            - "MileTransaction.${txn1_id}.tier_bonus_miles == 2500"
            - "MileTransaction.${txn1_id}.bonus_miles == 5000"
            - "MileTransaction.${txn1_id}.total_miles == 12500"
            - "MileTransaction.${txn2_id}.elite_tier_at_earn == BASE"
            - "MileTransaction.${txn2_id}.tier_bonus_miles == 0"
            - "MileTransaction.${txn2_id}.bonus_miles == 0"
            - "MileTransaction.${txn2_id}.total_miles == 5000"
            - "the second trigger call returns HTTP 201 (it is not rejected)"
            - "PromotionCampaign.${camp_id}.accrued_bonus_miles == 5000"
            - "PromotionCampaign.${camp_id}.status == LIVE"
            - "MemberAccount.${m1_id}.mile_balance == 12500 and MemberAccount.${m2_id}.mile_balance == 5000"
            - "LoyaltyProgram.${prog_id}.outstanding_miles == 17500"

  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: mile_transaction_blocked_when_program_recognition_state_locked
        grounds:
          - validations[priority=13]
          - errors.ERR_PERIOD_LOCKED
          - state_machines.LoyaltyProgram.CLOSING_to_LOCKED
          - state_machines.LoyaltyProgram.OPEN_to_CLOSING
          - entities.MileTransaction
        distinguishing_aspect: |
          A MileTransaction insert that is perfectly valid in isolation (NORMAL member, positive
          balance, well-formed payload) is refused with ERR_PERIOD_LOCKED (409) purely because a
          DIFFERENT entity - its grandparent LoyaltyProgram - sits in revenue_recognition_state
          LOCKED; the member's balance is unchanged, proving the guard runs before any ledger write.
        test_recipe:
          setup:
            - "One LoyaltyProgram, current_period 2026-08, driven OPEN -> CLOSING -> LOCKED after the member's earn is booked."
            - "One MemberAccount with mile_balance 1000 from a single 100000-cent card-spend earn dated 2026-07-05, security_state NORMAL."
            - "One DeferredRevenuePosting for 2026-08 written while the program was CLOSING, with zero expiries and zero redemptions so breakage_rate_bps and breakage_income_cents are both 0."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Locked", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-LOCKED", home_region: "AMER" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "CARD_SPEND_EARN", activity_date: "2026-07-05", qualifying_spend_cents: 100000 }
              as: RevenueAccountant
              captures: { txn1_id: "$.data.id" }
            - call: "POST /loyalty-programs/${prog_id}/recognition-transitions"
              payload: { target_state: "CLOSING" }
              as: RevenueAccountant
              captures: { prog_v_closing: "$.data.version" }
            - call: "POST /deferred-revenue-postings"
              payload: { program_id: "${prog_id}", period: "2026-08", expected_program_version: "${prog_v_closing}" }
              as: RevenueAccountant
              captures: { post_id: "$.data.id" }
            - call: "POST /loyalty-programs/${prog_id}/recognition-transitions"
              payload: { target_state: "LOCKED" }
              as: RevenueAccountant
          trigger:
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "PARTNER_EARN", activity_date: "2026-08-01", base_miles: 500 }
              as: RevenueAccountant
              captures: { err: "$.data.error_id" }
          assert:
            - "the trigger returns HTTP 409 with data.error_id == ERR_PERIOD_LOCKED"
            - "LoyaltyProgram.${prog_id}.revenue_recognition_state == LOCKED"
            - "MemberAccount.${mem_id}.mile_balance == 1000"
            - "LoyaltyProgram.${prog_id}.outstanding_miles == 1000"
            - "GET /mile-transactions?member_id=${mem_id} returns total_count 1"
            - "DeferredRevenuePosting.${post_id}.breakage_rate_bps == 0"
            - "DeferredRevenuePosting.${post_id}.breakage_income_cents == 0"
            - "the same PARTNER_EARN payload succeeds with HTTP 201 once the program is driven LOCKED -> OPEN"

      - name: mile_purchase_order_requires_agreement_active_not_merely_ratified
        grounds:
          - state_machines.MileSaleAgreement.RATIFIED_to_ACTIVE
          - validations[priority=8]
          - errors.ERR_INVALID_STATE
          - entities.MilePurchaseOrder.fields.agreement_id
          - concurrency_rules[mile-purchase-order-stale-agreement]
        distinguishing_aspect: |
          A different cross-entity direction than the LOCKED-program instance: here the blocking
          entity is the order's own PARENT MileSaleAgreement and the discriminator is one hop inside
          that parent's lifecycle - RATIFIED is not enough, only ACTIVE admits draws - so the order
          fails with ERR_INVALID_STATE (409) even though the OCC version supplied is current.
        test_recipe:
          setup:
            - "One LoyaltyProgram and one CoBrandIssuer with annual_mile_purchase_cap_miles 5000000."
            - "One MileSaleAgreement submitted and ratified but deliberately NOT activated, so status is RATIFIED, tier_schedule [{0,170}], committed_volume_miles 2000000."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Gate", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /co-brand-issuers"
              payload: { program_id: "${prog_id}", name: "Northbank Card Services", annual_mile_purchase_cap_miles: 5000000 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { issuer_id: "$.data.id" }
            - call: "POST /mile-sale-agreements"
              payload:
                issuer_id: "${issuer_id}"
                term_start_date: "2026-09-01"
                term_end_date: "2027-08-31"
                committed_volume_miles: 2000000
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 170 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { agr_id: "$.data.id" }
            - call: "POST /mile-sale-agreements/${agr_id}/submit"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
            - call: "POST /mile-sale-agreements/${agr_id}/ratify"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
            - call: "GET /mile-sale-agreements/${agr_id}"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { agr_v_ratified: "$.data.version" }
          trigger:
            - call: "POST /mile-purchase-orders"
              payload: { agreement_id: "${agr_id}", order_miles: 100000, expected_agreement_version: "${agr_v_ratified}" }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "the trigger returns HTTP 409 with data.error_id == ERR_INVALID_STATE"
            - "the trigger does NOT return ERR_STALE_VERSION and does NOT return HTTP 412"
            - "MileSaleAgreement.${agr_id}.status == RATIFIED"
            - "MileSaleAgreement.${agr_id}.drawn_miles == 0"
            - "GET /mile-purchase-orders?agreement_id=${agr_id} returns total_count 0"
            - "LoyaltyProgram.${prog_id}.deferred_revenue_cents == 0"
            - "after POST /mile-sale-agreements/${agr_id}/activate the identical order payload (with the refreshed version) succeeds with HTTP 201 and gross_amount_cents 170000"

  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: promotion_half_open_window_overlap_same_channel_adjacency_allowed
        grounds:
          - validations[priority=19]
          - errors.ERR_PROMOTION_WINDOW_OVERLAP
          - entities.PromotionCampaign.fields.window_start
          - entities.PromotionCampaign.fields.window_end
          - entities.PromotionCampaign.fields.earn_channel
        distinguishing_aspect: |
          Promotion windows are HALF-OPEN [start, end): a campaign starting exactly at the incumbent's
          window_end is accepted, a campaign starting one second BEFORE it (2026-09-30T23:59:59Z)
          collides with ERR_PROMOTION_WINDOW_OVERLAP (409), and that same colliding interval is
          accepted on a different earn_channel because the exclusion is scoped per channel.
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "No campaigns yet; all four requests below are issued against the same program."
            - "Logical clock at its 2026-08-01T00:00:00Z default, so every window below is in the future."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Windows", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /promotion-campaigns"
              payload: { program_id: "${prog_id}", code: "FLIGHT-SEP", earn_channel: "FLIGHT", multiplier_bps: 15000, stacking_mode: "ADDITIVE", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { c1_id: "$.data.id" }
          trigger:
            - call: "POST /promotion-campaigns"
              payload: { program_id: "${prog_id}", code: "FLIGHT-OCT", earn_channel: "FLIGHT", multiplier_bps: 15000, stacking_mode: "ADDITIVE", window_start: "2026-10-01T00:00:00Z", window_end: "2026-11-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { c2_id: "$.data.id" }
            - call: "POST /promotion-campaigns"
              payload: { program_id: "${prog_id}", code: "FLIGHT-CLASH", earn_channel: "FLIGHT", multiplier_bps: 12500, stacking_mode: "ADDITIVE", window_start: "2026-09-30T23:59:59Z", window_end: "2026-10-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /promotion-campaigns"
              payload: { program_id: "${prog_id}", code: "CARD-CLASH-OK", earn_channel: "CARD_SPEND", multiplier_bps: 12500, stacking_mode: "ADDITIVE", window_start: "2026-09-30T23:59:59Z", window_end: "2026-10-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { c4_id: "$.data.id" }
          assert:
            - "the FLIGHT-OCT call returns HTTP 201 (start == incumbent window_end is adjacency, not overlap)"
            - "the FLIGHT-CLASH call returns HTTP 409 with data.error_id == ERR_PROMOTION_WINDOW_OVERLAP"
            - "the CARD-CLASH-OK call returns HTTP 201"
            - "PromotionCampaign.${c1_id}.status == SCHEDULED"
            - "PromotionCampaign.${c2_id}.status == SCHEDULED"
            - "PromotionCampaign.${c4_id}.earn_channel == CARD_SPEND"
            - "GET /promotion-campaigns?program_id=${prog_id} returns total_count 3"
            - "GET /promotion-campaigns?program_id=${prog_id}&earn_channel=FLIGHT returns total_count 2"

      - name: award_window_closed_interval_two_day_buffer_same_route_cabin
        grounds:
          - validations[priority=20]
          - errors.ERR_AWARD_WINDOW_BUFFER_VIOLATION
          - entities.AwardInventoryWindow.fields.window_start_date
          - entities.AwardInventoryWindow.fields.window_end_date
          - entities.AwardInventoryWindow.fields.cabin
        distinguishing_aspect: |
          The opposite interval convention from the promotion instance: award windows are CLOSED
          [start, end] and additionally demand 2 clear days of separation, so 2026-10-02 (one clear
          day after a 2026-09-30 end) is rejected while 2026-10-03 (two clear days) is accepted -
          adjacency that the promotion rule permits is a violation here - and the buffer is scoped
          per (route_code, cabin), so the same dates on another cabin are fine.
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One AwardInventoryWindow W1 on JFK-LHR BUSINESS over 2026-09-01..2026-09-30 with authorized_seats 10."
            - "Logical clock at its 2026-08-01T00:00:00Z default, so every window below is in the future."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Buffer", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /award-inventory-windows"
              payload: { program_id: "${prog_id}", route_code: "JFK-LHR", cabin: "BUSINESS", window_start_date: "2026-09-01", window_end_date: "2026-09-30", authorized_seats: 10 }
              as: ProgramAdmin
              captures: { w1_id: "$.data.id" }
          trigger:
            - call: "POST /award-inventory-windows"
              payload: { program_id: "${prog_id}", route_code: "JFK-LHR", cabin: "BUSINESS", window_start_date: "2026-10-02", window_end_date: "2026-10-31", authorized_seats: 10 }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /award-inventory-windows"
              payload: { program_id: "${prog_id}", route_code: "JFK-LHR", cabin: "BUSINESS", window_start_date: "2026-10-03", window_end_date: "2026-10-31", authorized_seats: 10 }
              as: ProgramAdmin
              captures: { w3_id: "$.data.id" }
            - call: "POST /award-inventory-windows"
              payload: { program_id: "${prog_id}", route_code: "JFK-LHR", cabin: "ECONOMY", window_start_date: "2026-09-01", window_end_date: "2026-09-30", authorized_seats: 40 }
              as: ProgramAdmin
              captures: { w4_id: "$.data.id" }
          assert:
            - "the 2026-10-02 call returns HTTP 409 with data.error_id == ERR_AWARD_WINDOW_BUFFER_VIOLATION"
            - "the 2026-10-03 call returns HTTP 201"
            - "the ECONOMY call returns HTTP 201 even though its dates are identical to W1's"
            - "AwardInventoryWindow.${w1_id}.capacity_control_state == OPEN"
            - "AwardInventoryWindow.${w3_id}.window_start_date == \"2026-10-03\""
            - "AwardInventoryWindow.${w4_id}.cabin == ECONOMY"
            - "GET /award-inventory-windows?program_id=${prog_id} returns total_count 3"
            - "GET /award-inventory-windows?program_id=${prog_id}&cabin=BUSINESS returns total_count 2"

  # ===================================================================
  - rule_id: compensating_invariant
    instances:

      - name: booking_refund_restores_outstanding_mile_liability
        grounds:
          - state_machines.AwardBooking.TICKETED_to_REFUNDED
          - state_machines.AwardBooking.HELD_to_TICKETED
          - entities.MileTransaction.fields.reverses_transaction_id
          - entities.LoyaltyProgram.fields.outstanding_miles
          - calculations.award_dynamic_pricing
        distinguishing_aspect: |
          Refunding a ticketed booking must restore the EXACT quoted_miles it debited - 45000 - by
          inserting a REVERSAL row rather than re-pricing the award, so mile_balance returns to
          100000 and outstanding_miles returns to 100000 even though the window's load factor (and
          therefore its demand multiplier) changed between ticketing and refund; the ledger keeps
          all three rows and seats_confirmed and saver_seats_consumed both return to 0.
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One MemberAccount at elite_tier BASE with mile_balance 100000 from a single 10000000-cent card-spend earn dated 2026-07-02."
            - "One AwardInventoryWindow JFK-LHR BUSINESS 2026-09-01..2026-09-30, authorized_seats 10, saver_seat_share_bps 3000 (saver allotment 3), empty so load_factor_bps 0 and demand_multiplier_bps 9000."
            - "Logical clock at its 2026-08-01T00:00:00Z default throughout, so the 72-hour hold never lapses."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Refund", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-REFUND", home_region: "AMER" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "CARD_SPEND_EARN", activity_date: "2026-07-02", qualifying_spend_cents: 10000000 }
              as: RevenueAccountant
            - call: "POST /award-inventory-windows"
              payload: { program_id: "${prog_id}", route_code: "JFK-LHR", cabin: "BUSINESS", window_start_date: "2026-09-01", window_end_date: "2026-09-30", authorized_seats: 10, saver_seat_share_bps: 3000 }
              as: ProgramAdmin
              captures: { win_id: "$.data.id", win_v: "$.data.version" }
            - call: "POST /award-bookings"
              payload: { member_id: "${mem_id}", window_id: "${win_id}", travel_date: "2026-09-10", seats: 1, fare_class: "SAVER", expected_window_version: "${win_v}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { bk_id: "$.data.id", quoted: "$.data.quoted_miles" }
            - call: "POST /award-bookings/${bk_id}/ticket"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
          trigger:
            - call: "POST /award-bookings/${bk_id}/refund"
              payload: {}
              as: ProgramAdmin
          assert:
            - "AwardBooking.${bk_id}.quoted_miles == 45000"
            - "AwardBooking.${bk_id}.demand_multiplier_bps_applied == 9000"
            - "AwardBooking.${bk_id}.surcharge_band == SURCHARGE_MID"
            - "AwardBooking.${bk_id}.cash_surcharge_cents == 1120"
            - "AwardBooking.${bk_id}.elite_discount_bps_applied == 0"
            - "AwardBooking.${bk_id}.status == REFUNDED"
            - "MemberAccount.${mem_id}.mile_balance == 100000"
            - "LoyaltyProgram.${prog_id}.outstanding_miles == 100000"
            - "GET /mile-transactions?member_id=${mem_id} returns total_count 3"
            - "GET /mile-transactions?member_id=${mem_id}&txn_type=REVERSAL returns total_count 1 with total_miles == 45000"
            - "the REVERSAL row's reverses_transaction_id equals the id of the REDEEM row created by ticketing"
            - "AwardInventoryWindow.${win_id}.seats_confirmed == 0"
            - "AwardInventoryWindow.${win_id}.seats_held == 0"
            - "AwardInventoryWindow.${win_id}.saver_seats_consumed == 0"
            - "AwardInventoryWindow.${win_id}.load_factor_bps == 0"
            - "AwardInventoryWindow.${win_id}.capacity_control_state == OPEN"

      - name: hold_expiry_restores_award_seat_inventory
        grounds:
          - state_machines.AwardBooking.HELD_to_EXPIRED
          - entities.AwardBooking.fields.hold_expires_at
          - entities.AwardInventoryWindow.fields.saver_seats_consumed
          - endpoints[POST /_ops/run-epoch]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          A time-driven compensation instead of an operator-driven one: nobody calls an endpoint on
          the booking at all - the 72-hour hold simply lapses at 2026-08-04T00:00:00Z and run-epoch
          releases all 3 held seats, unwinding saver_seats_consumed from 3 back to 0 and the load
          factor from 3000 to 0, while the member's mile_balance is untouched at 100000 because a
          hold never debited miles (the ledger still holds exactly one row).
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One MemberAccount at elite_tier BASE with mile_balance 100000 from a single 10000000-cent card-spend earn dated 2026-07-02."
            - "One AwardInventoryWindow JFK-LHR BUSINESS 2026-09-01..2026-09-30, authorized_seats 10, saver_seat_share_bps 3000, so the saver allotment is exactly 3."
            - "One HELD 3-seat SAVER AwardBooking created at the clock default, so hold_expires_at is 2026-08-04T00:00:00Z."
            - "Logical clock starts at its 2026-08-01T00:00:00Z default and is later advanced to 2026-08-04T00:00:01Z."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Hold Expiry", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-HOLD", home_region: "AMER" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "CARD_SPEND_EARN", activity_date: "2026-07-02", qualifying_spend_cents: 10000000 }
              as: RevenueAccountant
            - call: "POST /award-inventory-windows"
              payload: { program_id: "${prog_id}", route_code: "JFK-LHR", cabin: "BUSINESS", window_start_date: "2026-09-01", window_end_date: "2026-09-30", authorized_seats: 10, saver_seat_share_bps: 3000 }
              as: ProgramAdmin
              captures: { win_id: "$.data.id", win_v: "$.data.version" }
            - call: "POST /award-bookings"
              payload: { member_id: "${mem_id}", window_id: "${win_id}", travel_date: "2026-09-12", seats: 3, fare_class: "SAVER", expected_window_version: "${win_v}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { bk_id: "$.data.id", hold_until: "$.data.hold_expires_at" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:01Z" }
              as: ProgramAdmin
            - call: "POST /_ops/run-epoch"
              payload: { program_id: "${prog_id}" }
              as: ProgramAdmin
              captures: { expired_count: "$.data.holds_expired" }
          assert:
            - "AwardBooking.${bk_id}.quoted_miles == 135000"
            - "AwardBooking.${bk_id}.hold_expires_at == \"2026-08-04T00:00:00Z\""
            - "AwardBooking.${bk_id}.status == EXPIRED"
            - "the run-epoch response reports holds_expired == 1"
            - "AwardInventoryWindow.${win_id}.seats_held == 0"
            - "AwardInventoryWindow.${win_id}.saver_seats_consumed == 0"
            - "AwardInventoryWindow.${win_id}.load_factor_bps == 0"
            - "AwardInventoryWindow.${win_id}.capacity_control_state == OPEN"
            - "MemberAccount.${mem_id}.mile_balance == 100000"
            - "LoyaltyProgram.${prog_id}.outstanding_miles == 100000"
            - "GET /mile-transactions?member_id=${mem_id} returns total_count 1"
            - "a second POST /_ops/run-epoch reports holds_expired == 0 (the release is not applied twice)"
