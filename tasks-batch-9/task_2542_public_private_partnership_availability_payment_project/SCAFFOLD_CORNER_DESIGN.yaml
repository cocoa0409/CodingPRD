      - name: the_cure_action_drives_its_declared_transition
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /ppp/enforcement-actions/{id}/cure]
          - state_machines.EnforcementAction
          - state_machines.Concession
        excluded_because:
          difficulty_instance: concession_step_in_cycle_returns_to_operations_and_can_be_re_entered
          rationale: |
            cure is the archetypal action endpoint here — it moves EnforcementAction
            STEP_IN_ACTIVE -> CURED and returns the concession from STEP_IN to OPERATIONS —
            and that instance drives it inside the full cycle, including the re-entry that
            proves the transition is not one-shot. Every other action endpoint's transition
            and preconditions are covered instance-by-instance in the state_machines section.

      # Bulk action: NOT APPLICABLE. §1.5 declares no bulk, batch or collection-mutating
      # endpoint; every write addresses exactly one row by path id, so there is no
      # partial-success or rollback-or-skip semantic to probe.

  - section: errors
    instances:
      - name: a_headerless_request_is_answered_before_the_path_is_resolved
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
        distinguishing_aspect: |
          The top of the ladder, demonstrated on a request that is wrong in three separate
          ways at once: no identity headers, a path id that does not exist, and a body the
          endpoint would reject anyway. Priority 1 must win over the 404 at priority 20, so
          the 401 must not leak the existence — or non-existence — of the target row.
        test_recipe:
          setup:
            - "An empty system. No concessionaire, concession or reserve transaction exists."
          setup_api_calls: []
          trigger:
            - call: "POST /ppp/reserve-transactions/tx-does-not-exist/reverse"
              payload: { reason: "no identity headers on this request" }
              as: "(none — X-User-Role and X-User-ID are both omitted)"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 401"
            - "${err} == \"ERR_UNAUTHENTICATED\" — not ERR_RESERVE_TRANSACTION_NOT_FOUND"
            - "the body carries only error_id and message; no entity fields are echoed"
            - "GET /ppp/reserve-transactions as PlatformAdmin returns total_count == 0 — nothing was written"

      - name: a_voluntary_ground_cannot_support_a_step_in
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ENFORCEMENT_GROUND_NOT_ADMITTED]
          - endpoints[POST /ppp/concessions/{id}/enforcement-actions]
          - state_machines.EnforcementAction
        distinguishing_aspect: |
          action_type and trigger_reason are each individually valid enum members, so this
          can only be caught as a pairing rule: STEP_IN admits PERSISTENT_BREACH and
          LENDER_DEFAULT_CURE and nothing else. The rejection must be total — no NOTIFIED
          row, no cure_deadline, and above all the concession must stay in OPERATIONS with
          the concessionaire ACTIVE, since a half-applied step-in would freeze every other
          write on the project.
        test_recipe:
          setup:
            - "The base chain to OPERATIONS with no enforcement action outstanding."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Meridian Infrastructure Partners", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
              captures: { cnr_id: $.data.id }
            - call: "POST /ppp/concessions"
              payload: { concessionaire_id: "${cnr_id}", project_name: "A47 Availability Scheme", masp_cents: 100000000, indexation_pct: 0.0325, deduction_cap_pct: 0.20, total_project_cost_cents: 400000000, senior_debt_committed_cents: 300000000, equity_committed_cents: 100000000, base_case_equity_irr_bps: 1200, scheduled_service_commencement: "2027-01-01", ld_daily_rate_cents: 250000, ld_cap_cents: 5000000, lifecycle_reserve_target_cents: 20000000 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_id: $.data.id }
            - call: "POST /ppp/concessions/${csn_id}/financial-close"
              payload: { close_date: "2026-09-15" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_v_close: $.data.version }
            - call: "POST /ppp/concessions/${csn_id}/drawdown-milestones"
              payload: { milestone_name: "M1 Design Complete", requested_amount_cents: 120000000, expected_concession_version: "${csn_v_close}" }
              as: Concessionaire
              as_user_id: "${cnr_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /ppp/drawdown-milestones/${m1_id}/approve"
