              as: PlatformAdmin
            - call: "POST /clearing/participants"
              payload: { legal_name: "Zero Alpha", lei: "LEI-ZA2", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_za2: $.data.id }
            - call: "POST /clearing/participants"
              payload: { legal_name: "Zero Beta", lei: "LEI-ZB2", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_zb2: $.data.id }
            - call: "POST /clearing/participants/${p_za2}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/participants/${p_zb2}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/securities"
              payload: { ticker: "ZER1", cusip: "912828XV2", prev_settlement_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_zer: $.data.id }
            - call: "POST /clearing/settlement-windows"
              payload: { security_id: "${sec_zer}", settlement_date: "2026-09-10", trade_entry_deadline: "2026-09-09T20:00:00Z", affirmation_deadline: "2026-09-09T22:00:00Z" }
              as: PlatformAdmin
              captures: { win_zer: $.data.id }
            - call: "POST /clearing/trade-submissions"
              payload: { counterparty_participant_id: "${p_zb2}", security_id: "${sec_zer}", side: "BUY", quantity: 100, trade_price_cents: 4000, trade_date: "2026-09-08T14:00:00Z" }
              as: ClearingMember
              as_user_id: "${p_za2}"
              captures: { t_zer: $.data.id }
            - call: "POST /clearing/trade-submissions/${t_zer}/lock-in"
              payload: {}
              as: ClearingMember
              as_user_id: "${p_za2}"
            - call: "POST /clearing/settlement-windows/${win_zer}/net"
              payload: {}
              as: PlatformAdmin
            - call: "GET /clearing/net-positions?window_id=${win_zer}"
              payload: {}
              as: ClearingMember
              captures: { np_zer: "$.data[0].id" }
          trigger:
            - call: "POST /clearing/net-positions/${np_zer}/fund"
              payload: { amount_cents: 0 }
              as: ClearingMember
              as_user_id: "${p_za2}"
              captures: { err_zero: $.data.error_id }
          assert:
            - "the response status is 422 and data.error_id == ERR_INVALID_AMOUNT"
            - "GET /clearing/net-positions/${np_zer} still reports funded_amount_cents == 0"
            - "the identical zero amount with mark_to_market_only true is accepted with 200, because the sign rule applies to the funding leg only"

      - name: release_without_reason_code_rejected
        claim_type: Violation → Error
        grounds:
          - errors[ERR_DEPOSIT_RELEASE_INVALID]
          - validations[priority=20]
        distinguishing_aspect: "A negative posting is refused with ERR_DEPOSIT_RELEASE_INVALID when it omits reason_code, and an over-release is refused with the same error, while posted_amount_cents is left untouched in both cases."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z. Participant DP2 is ACTIVE with 500000 cents posted to its deposit pool."
          setup_api_calls:
            - call: "POST /clearing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clearing/participants"
              payload: { legal_name: "Release Co", lei: "LEI-DP2", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_dp2: $.data.id }
            - call: "POST /clearing/participants/${p_dp2}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "GET /clearing/deposits?participant_id=${p_dp2}"
              payload: {}
              as: PlatformAdmin
              captures: { dep_dp2: "$.data[0].id" }
            - call: "POST /clearing/deposits/${dep_dp2}/postings"
              payload: { amount_cents: 500000 }
              as: ClearingMember
              as_user_id: "${p_dp2}"
          trigger:
            - call: "POST /clearing/deposits/${dep_dp2}/postings"
              payload: { amount_cents: -100000 }
              as: ClearingMember
              as_user_id: "${p_dp2}"
              captures: { err_release: $.data.error_id }
          assert:
            - "the response status is 409 and data.error_id == ERR_DEPOSIT_RELEASE_INVALID, because the negative posting carries no reason_code"
            - "a second attempt with amount_cents -600000 and reason_code OVER_RELEASE is refused with the same error, since it would drive posted_amount_cents below zero"
            - "GET /clearing/deposits/${dep_dp2} still reports posted_amount_cents == 500000"

      - name: stale_window_version_rejected_on_cycle_rerun
        claim_type: Violation → Error
        grounds:
          - errors[ERR_STALE_VERSION]
          - concurrency_rules[netposition-create-stale-window]
        excluded_because:
          difficulty_instance: settlement_window_cyclic_cycle_rerun_and_auto_close
          rationale: "The 412 stale-window-version rejection is asserted as the negative branch of that named §1.8 instance."

      - name: low_level_capital_fails_financial_standard_and_blocks_activation
        claim_type: Violation → Error
        grounds:
          - errors[ERR_FINANCIAL_STANDARD_NOT_MET]
          - calculations.financial_standard_minimum
        distinguishing_aspect: "ERR_FINANCIAL_STANDARD_NOT_MET is reachable through two different endpoints on the same deficient participant: activation is refused, and a trade submission by that participant is refused as well."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z. Participant FS2 is created class BROKER_DEALER with net_capital_cents 400000000, which is below the 500000000 flat floor, and is therefore FAIL while still PENDING."
          setup_api_calls:
            - call: "POST /clearing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
