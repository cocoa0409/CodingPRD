              payload: { dealer_id: "${dpwr_id}", vehicle_id: "${vehs_id}", labor_operation_id: "${lo_diag_id}", repair_order_number: "RO-S-1", repair_date: "2026-04-20", odometer_at_repair: 20000, claimed_labor_hours: 2.0, claimed_parts_qty: 0, complaint_text: "Customer reports a dash warning lamp on.", cause_text: "Diagnostic scan traced a transient sensor code.", correction_text: "Cleared the code and verified no recurrence." }
              as: DealerWarrantyAdmin
