  # ===================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: increase_cap_exact_boundary
        grounds:
          - calculations.allowable_increase
          - validations[priority=19]
          - entities.Unit.fields.current_lawful_rent_cents
        distinguishing_aspect: >
          Numeric cap on POST /rent-adjustments: proposed 309000 == round(300000×1.03) is accepted
          (>= boundary), while 309001 would be ERR_INCREASE_EXCEEDS_ALLOWABLE.
        test_recipe:
          setup:
            - "Landlord + STABILIZED unit (lawful 300000); AGA 2026 = 0.03 published."
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Kilo Rentals", email: "kilo@x.com", business_license_no: "BL-1100" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/aga-determinations"
              payload: { effective_year: 2026, cpi_pct: 0.032, aga_pct: 0.03, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RentBoardClerk
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "2 Spruce St #7", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id, u_v1: $.data.version }
          trigger:
            - call: "POST /rent-board/units/${u_id}/rent-adjustments"
              payload: { effective_date: "2026-07-01", proposed_new_rent_cents: 309000, apply_banked: false, expected_unit_version: "${u_v1}" }
              as: Landlord
              as_user_id: "${l_id}"
          assert:
            - "Unit.${u_id}.current_lawful_rent_cents == 309000"
            - "proposed 309001 on the same setup would return ERR_INCREASE_EXCEEDS_ALLOWABLE."

      - name: rescind_deadline_inclusive_boundary
        grounds:
          - calculations.rescind_deadline
          - validations[priority=12]
          - entities.Buyout.fields.rescind_deadline
        distinguishing_aspect: >
          Temporal boundary on POST /buyouts/{id}/rescind: with filed_at at the 2026-05-01T00:00:00Z
          default clock, rescind_deadline is 2026-05-31T00:00:00Z; rescinding at exactly that instant
          is allowed (now <= deadline), whereas one second later is ERR_COOLING_OFF_EXPIRED.
        test_recipe:
          setup:
            - "Buyout FILED at the default clock (filed_at 2026-05-01T00:00:00Z); clock advanced to the exact deadline 2026-05-31T00:00:00Z."
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Lima Group", email: "lima@x.com", business_license_no: "BL-1200" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/tenants"
              payload: { name: "Dana Cole", email: "dana@x.com", phone: "555-0600" }
              as: RentBoardClerk
              captures: { t_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "10 Poplar Ave #3", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
            - call: "POST /rent-board/tenancies"
              payload: { unit_id: "${u_id}", tenant_id: "${t_id}", start_date: "2026-04-01" }
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /rent-board/buyouts"
              payload: { unit_id: "${u_id}", landlord_id: "${l_id}", tenant_id: "${t_id}", offer_amount_cents: 4000000, relocation_amount_cents: 800000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { b_id: $.data.id }
            - call: "POST /rent-board/buyouts/${b_id}/file"
              payload: { disclosure_acknowledged: true }
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-31T00:00:00Z" }
              as: RentBoardClerk
          trigger:
            - call: "POST /rent-board/buyouts/${b_id}/rescind"
              payload: {}
              as: Tenant
              as_user_id: "${t_id}"
          assert:
            - "Buyout.${b_id}.status == RESCINDED"
            - "Buyout.${b_id}.rescind_deadline == 2026-05-31T00:00:00Z"

  # ===================================================================
  # Rule 7 — Cross-entity state dependencies across different pairs
  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: hearing_requires_petition_under_review
        grounds:
          - state_machines.Petition.UNDER_REVIEW_to_HEARING_SCHEDULED
          - validations[priority=8]
        distinguishing_aspect: >
          Hearing scheduling depends on the Petition's state: with the petition only SUBMITTED
          (not UNDER_REVIEW), POST /petitions/{id}/hearings returns ERR_PETITION_NOT_UNDER_REVIEW.
          Pair: Hearing -> Petition.
        test_recipe:
          setup:
            - "A CAPITAL petition is SUBMITTED (not yet reviewed); an officer exists."
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Mike Props", email: "mike@x.com", business_license_no: "BL-1300" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/hearing-officers"
              payload: { name: "Officer Ng", email: "ng@board.gov" }
              as: RentBoardClerk
              captures: { o_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "12 Cherry Ln #2", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
            - call: "POST /rent-board/petitions"
              payload: { unit_id: "${u_id}", landlord_id: "${l_id}", petition_type: "CAPITAL_IMPROVEMENT", requested_cost_cents: 1200000, amortization_months: 120 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /rent-board/petitions/${pet_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${l_id}"
          trigger:
            - call: "POST /rent-board/petitions/${pet_id}/hearings"
              payload: { officer_id: "${o_id}", scheduled_start: "2026-06-10T10:00:00Z", scheduled_end: "2026-06-10T11:00:00Z" }
              as: RentBoardClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PETITION_NOT_UNDER_REVIEW"

      - name: tenancy_requires_unit_stabilized
        grounds:
          - validations[priority=7]
          - state_machines.Unit.STABILIZED_to_EXEMPT
        distinguishing_aspect: >
          Tenancy creation depends on the Unit's stabilization_status: on an EXEMPT unit,
          POST /tenancies returns ERR_UNIT_NOT_STABILIZED. Pair: Tenancy -> Unit (distinct from Hearing->Petition).
        test_recipe:
          setup:
            - "A vacant unit is made EXEMPT via an approved OWNER_OCCUPIED exemption."
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "November Inc", email: "nov@x.com", business_license_no: "BL-1400" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/tenants"
              payload: { name: "Pat Ito", email: "pat@x.com", phone: "555-0700" }
              as: RentBoardClerk
              captures: { t_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "14 Hazel St #1", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
            - call: "POST /rent-board/exemptions"
              payload: { unit_id: "${u_id}", exemption_type: "OWNER_OCCUPIED" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { ex_id: $.data.id }
            - call: "POST /rent-board/exemptions/${ex_id}/decide"
              payload: { decision: "APPROVE", effective_date: "2026-06-01" }
              as: ComplianceOfficer
              as_user_id: "co-7"
          trigger:
            - call: "POST /rent-board/tenancies"
              payload: { unit_id: "${u_id}", tenant_id: "${t_id}", start_date: "2026-07-01" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNIT_NOT_STABILIZED"

  # ===================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different semantics
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: hearing_officer_buffered_overlap
        grounds:
          - calculations.hearing_officer_overlap
          - validations[priority=16]
          - entities.Hearing.fields.officer_id
        distinguishing_aspect: >
          Officer scheduling uses buffered half-open intervals: an existing hearing 10:00-11:00 with a
          30-minute buffer blocks a new 11:15-12:00 window (11:15 < 11:30) -> ERR_OFFICER_UNAVAILABLE.
          Buffered-datetime semantics on HearingOfficer (distinct from the unbuffered date adjacency on Unit).
        test_recipe:
          setup:
            - "One officer with a SCHEDULED hearing 2026-06-10T10:00-11:00 (petition A) and a second petition B UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Oscar LLC", email: "oscar@x.com", business_license_no: "BL-1500" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/hearing-officers"
              payload: { name: "Officer Vaz", email: "vaz@board.gov" }
              as: RentBoardClerk
              captures: { o_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "16 Olive St #4", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
            - call: "POST /rent-board/petitions"
              payload: { unit_id: "${u_id}", landlord_id: "${l_id}", petition_type: "CAPITAL_IMPROVEMENT", requested_cost_cents: 1200000, amortization_months: 120 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { pet_a: $.data.id }
            - call: "POST /rent-board/petitions/${pet_a}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /rent-board/petitions/${pet_a}/review"
              payload: {}
              as: HearingOfficer
              as_user_id: "${o_id}"
            - call: "POST /rent-board/petitions/${pet_a}/hearings"
              payload: { officer_id: "${o_id}", scheduled_start: "2026-06-10T10:00:00Z", scheduled_end: "2026-06-10T11:00:00Z" }
              as: RentBoardClerk
              captures: { h_a: $.data.id }
            - call: "POST /rent-board/petitions"
              payload: { unit_id: "${u_id}", landlord_id: "${l_id}", petition_type: "CAPITAL_IMPROVEMENT", requested_cost_cents: 1200000, amortization_months: 120 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { pet_b: $.data.id }
            - call: "POST /rent-board/petitions/${pet_b}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /rent-board/petitions/${pet_b}/review"
              payload: {}
              as: HearingOfficer
              as_user_id: "${o_id}"
          trigger:
            - call: "POST /rent-board/petitions/${pet_b}/hearings"
              payload: { officer_id: "${o_id}", scheduled_start: "2026-06-10T11:15:00Z", scheduled_end: "2026-06-10T12:00:00Z" }
              as: RentBoardClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_OFFICER_UNAVAILABLE"
            - "A window starting at 2026-06-10T11:30:00Z (exactly end+buffer) would be accepted."

      - name: tenancy_unit_adjacency_allowed
        grounds:
          - validations[priority=15]
          - entities.Tenancy.fields.start_date
          - entities.Tenancy.fields.end_date
        distinguishing_aspect: >
          Unit occupancy uses unbuffered half-open date intervals [start, end): a new tenancy starting
          2026-12-01 (== prior tenancy end) is ACCEPTED (adjacency), whereas an overlapping start would
          be ERR_UNIT_OCCUPIED. Date closed-open adjacency semantics on Unit (distinct from officer buffer).
        test_recipe:
          setup:
            - "Unit has an ACTIVE tenancy occupying [2026-06-01, 2026-12-01)."
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Papa Rentals", email: "papa@x.com", business_license_no: "BL-1600" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/tenants"
              payload: { name: "Lee Wu", email: "lee@x.com", phone: "555-0800" }
              as: RentBoardClerk
              captures: { t1_id: $.data.id }
            - call: "POST /rent-board/tenants"
              payload: { name: "Mo Diaz", email: "mo@x.com", phone: "555-0900" }
              as: RentBoardClerk
              captures: { t2_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "18 Sage Ct #2", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
            - call: "POST /rent-board/tenancies"
              payload: { unit_id: "${u_id}", tenant_id: "${t1_id}", start_date: "2026-06-01", end_date: "2026-12-01" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { ten1: $.data.id }
          trigger:
            - call: "POST /rent-board/tenancies"
              payload: { unit_id: "${u_id}", tenant_id: "${t2_id}", start_date: "2026-12-01", end_date: "2027-06-01" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { ten2: $.data.id }
          assert:
            - "Tenancy.${ten2}.status == ACTIVE"
            - "Tenancy.${ten2}.monthly_rent_cents == 300000"
            - "A trigger with start_date 2026-11-01 would instead return ERR_UNIT_OCCUPIED."

  # ===================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: service_decrease_restore_conserves_lawful_rent
        grounds:
          - state_machines.ServiceClaim.INVESTIGATING_to_SUBSTANTIATED
          - state_machines.ServiceClaim.SUBSTANTIATED_to_RESTORED
          - entities.ServiceClaim.fields.pre_decrease_rent_cents
          - entities.Unit.fields.current_lawful_rent_cents
        distinguishing_aspect: >
          Conserved quantity = Unit.current_lawful_rent_cents. Forward decrease (SUBSTANTIATE, -75000 to 225000)
          paired with the compensating RESTORE returns lawful rent to exactly the pre-decrease snapshot 300000
          and the cascaded tenancy to 300000 — zero drift on the rent level.
        test_recipe:
          setup:
            - "Landlord + unit (300000) + tenant + ACTIVE tenancy; a SUBSTANTIAL WATER claim is SUBSTANTIATED (lawful now 225000)."
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Quebec Homes", email: "quebec@x.com", business_license_no: "BL-1700" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/tenants"
              payload: { name: "Val Ono", email: "val@x.com", phone: "555-1000" }
              as: RentBoardClerk
              captures: { t_id: $.data.id }
            - call: "POST /rent-board/hearing-officers"
              payload: { name: "Officer Cho", email: "cho@board.gov" }
              as: RentBoardClerk
              captures: { o_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "20 Rowan St #3", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
            - call: "POST /rent-board/tenancies"
              payload: { unit_id: "${u_id}", tenant_id: "${t_id}", start_date: "2026-04-01" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { ten_id: $.data.id }
            - call: "POST /rent-board/service-claims"
              payload: { unit_id: "${u_id}", tenant_id: "${t_id}", claim_type: "WATER", severity: "SUBSTANTIAL" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { sc_id: $.data.id }
            - call: "POST /rent-board/service-claims/${sc_id}/investigate"
              payload: {}
              as: HearingOfficer
              as_user_id: "${o_id}"
            - call: "POST /rent-board/service-claims/${sc_id}/decide"
              payload: { disposition: "SUBSTANTIATE" }
              as: HearingOfficer
              as_user_id: "${o_id}"
          trigger:
            - call: "POST /rent-board/service-claims/${sc_id}/restore"
              payload: {}
              as: RentBoardClerk
          assert:
            - "Unit.${u_id}.current_lawful_rent_cents == 300000"
            - "Unit.${u_id}.decrease_active == false"
            - "Tenancy.${ten_id}.monthly_rent_cents == 300000"

      - name: buyout_file_rescind_conserves_escrow
        grounds:
          - state_machines.Buyout.DRAFT_to_FILED
          - state_machines.Buyout.FILED_to_RESCINDED
          - calculations.buyout_escrow
          - entities.Landlord.fields.escrow_committed_cents
        distinguishing_aspect: >
          Conserved quantity = Landlord.escrow_committed_cents (money). Forward FILE (+1,000,000) paired
          with the compensating RESCIND (-1,000,000) returns committed escrow to exactly 0 — a different
          conserved quantity (escrow money) than the rent-level invariant.
        test_recipe:
          setup:
            - "Landlord, tenant, unit, ACTIVE tenancy; a buyout (relocation 1,000,000) is FILED (escrow 1,000,000)."
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Romeo Ltd", email: "romeo@x.com", business_license_no: "BL-1800" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/tenants"
              payload: { name: "Toni Ash", email: "toni@x.com", phone: "555-1100" }
              as: RentBoardClerk
              captures: { t_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "24 Vine St #5", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
            - call: "POST /rent-board/tenancies"
              payload: { unit_id: "${u_id}", tenant_id: "${t_id}", start_date: "2026-04-01" }
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /rent-board/buyouts"
              payload: { unit_id: "${u_id}", landlord_id: "${l_id}", tenant_id: "${t_id}", offer_amount_cents: 6000000, relocation_amount_cents: 1000000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { b_id: $.data.id }
            - call: "POST /rent-board/buyouts/${b_id}/file"
              payload: { disclosure_acknowledged: true }
              as: Landlord
              as_user_id: "${l_id}"
          trigger:
            - call: "POST /rent-board/buyouts/${b_id}/rescind"
              payload: {}
              as: Tenant
              as_user_id: "${t_id}"
          assert:
            - "Landlord.${l_id}.escrow_committed_cents == 0"
            - "Immediately after FILE and before RESCIND, Landlord.${l_id}.escrow_committed_cents was 1000000."
