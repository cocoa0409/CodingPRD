scenario: |
  Generate task harder than expert level!

  2477. School Psychologist Evaluation Scheduling & Timeline Compliance (district psychological services):
  referral intake from intervention teams with consent-to-evaluate timestamps, evaluation timeline clock with
  statutory day counts and permissible exclusions, psychologist caseload balancing across buildings and
  evaluation types, assessment instrument inventory, protocol ordering and scoring software licensing,
  bilingual and interpreter-supported evaluation assignment, report completion, eligibility meeting
  scheduling and parent notice requirements, timeline breach reporting, compensatory remedies and
  corrective action, reevaluation cycle and consent-to-waive documentation

domain_name: school-psych-evaluation-timeline
api_prefix: /psych-services

complexity_profile:
  difficulty_level: expert_plus          # §0.4 Expert band, deliberately pushed past it per "harder than expert level"
  difficulty_note: |
    11 entities / 42 endpoints / 35 error codes / 8 calculations (3 carrying variants) / 10 state machines
    across 9 entities (Evaluation carries two independent state dimensions). Density, not volume, carries the
    difficulty: the statutory clock is the hub every other entity perturbs — exclusion credits move the due
    date, the due date moves compliance posture, compliance posture moves caseload pressure weights, caseload
    pressure decides which psychologist the server selects, and selection changes protocol/licence consumption.
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency          # OCC on Evaluation.version for assign + meeting-create supersede
    - cascading_side_effects          # exclusion approval and psychologist leave both cascade 3–4 levels
    - dual_variant_calculation        # compensatory minutes (TimelineBreach) + caseload pressure (Psychologist)
    - selector_policy                 # server-side psychologist selection when psychologist_id is omitted

  entity_topology: flat
  # Every business collection sits directly under /psych-services with FK references in bodies; no id is
  # nested inside another entity's path. Sub-resource GETs exist only as reverse-reachability read channels.

  state_machine_shape: parallel
  # Evaluation carries two independent dimensions (assessment_status x compliance_status). EligibilityMeeting
  # is cyclic (NOTICED -> RESCHEDULE_REQUESTED -> NOTICED), Evaluation.assessment_status is cyclic
  # (REPORT_DRAFTED -> SCORED on peer-review RETURN), TimelineBreach is branching (DETECTED -> {REMEDY_PROPOSED,
  # VACATED}).

  relationship_patterns:
    - one_to_many                     # School -> Referral, Evaluation -> TimelineExclusion / InterpreterSession
    - many_to_many                    # Psychologist.assigned_school_ids x School; ScoringLicenseSeat junction
    - self_referential                # Evaluation.prior_evaluation_id -> Evaluation.id (reevaluation cycle)
    - cross_aggregate                 # InterpreterSession overlap resolves Psychologist via Evaluation.psychologist_id
    - polymorphic                     # Referral.consent_events accepts three event_type values on one endpoint

  role_model: segregation_of_duties
  # The psychologist who drafted a report may never be the peer reviewer who finalizes it; the officer who
  # proposes a compensatory remedy may never be the actor who approves it (different role entirely).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: School
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Building display name
      - name: building_code
        type: string
        source: input
        description: District building code; unique across all Schools
        constraints: "uppercase alphanumeric, 2-8 chars, unique"
      - name: grade_band
        type: enum
        source: input
        description: Grade band served by the building
        constraints: "one of ELEMENTARY, MIDDLE, HIGH"
      - name: concurrent_meeting_capacity
        type: integer
        source: input
        description: Maximum number of EligibilityMeetings whose closed intervals may overlap at this building
        default: 1
        constraints: ">= 1"
      - name: enrollment_count
        type: integer
        source: input
        description: Enrolled student count, used for reporting only
        default: 0
        constraints: ">= 0"

  - name: Psychologist
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Psychologist display name
      - name: employee_number
        type: string
        source: input
        description: District employee number (informational, not enforced unique)
      - name: credential_type
        type: enum
        source: input
        description: Credential held; INTERN restricts the evaluation types that may be assigned
        constraints: "one of SSP, PHD, INTERN"
      - name: languages_certified
        type: array
        source: input
        description: ISO 639-1 language codes the psychologist is certified to evaluate in
        default: ["en"]
        constraints: "non-empty array of 2-letter lowercase codes"
      - name: assigned_school_ids
        type: array
        source: input
        description: >-
          Array of School.id values this psychologist serves (many-to-many membership set, not a single FK).
          Every element MUST resolve to an existing School at write time.
        constraints: "non-empty array; each element an existing School.id"
      - name: weekly_capacity_points
        type: integer
        source: input
        description: Caseload point ceiling used by caseload_status and the assignment selector
        default: 20
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: Lifecycle state; ON_LEAVE removes the psychologist from the selector candidate pool
        default: ACTIVE
        constraints: "one of ACTIVE, ON_LEAVE"
      - name: open_case_points
        type: integer
        source: computed
        description: >-
          Sum of Evaluation.caseload_points over Evaluations where psychologist_id == this Psychologist.id and
          assessment_status IN {ASSIGNED, IN_TESTING, SCORED, REPORT_DRAFTED}; recomputed by
          calculations.psychologist_open_case_points
      - name: caseload_status
        type: enum
        source: computed
        description: BALANCED when open_case_points < weekly_capacity_points, AT_CAP when equal, OVER_CAP when greater
        constraints: "one of BALANCED, AT_CAP, OVER_CAP"
      - name: pressure_index_assigned_basis
        type: number
        source: computed
        description: ASSIGNED_BASIS variant of calculations.caseload_pressure_index (2 dp)
      - name: pressure_index_clock_weighted
        type: number
        source: computed
        description: CLOCK_WEIGHTED_BASIS variant of calculations.caseload_pressure_index (2 dp); the variant the selector ranks on

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - name: school_id
        type: string
        source: input
        description: FK -> School.id; building whose intervention team raised the referral
      - name: active_evaluation_id
        type: string
        source: system
        description: >-
          FK -> Evaluation.id; the Evaluation created by the CONSENT_RECEIVED / CONSENT_WAIVED consent event.
          null until a consent event starts the clock; never reassigned afterwards.
        default: null
      - name: student_local_id
        type: string
        source: input
        description: District-local student identifier (opaque string)
      - name: referral_type
        type: enum
        source: input
        description: INITIAL evaluation or REEVALUATION of an existing eligibility
        constraints: "one of INITIAL, REEVALUATION"
      - name: prior_evaluation_id
        type: string
        source: input
        description: >-
          FK -> Evaluation.id; the most recent completed Evaluation being re-evaluated. Required when
          referral_type == REEVALUATION, MUST be omitted when referral_type == INITIAL.
        default: null
      - name: primary_language
        type: string
        source: input
        description: ISO 639-1 code of the family's primary language
        default: "en"
      - name: interpreter_required
        type: boolean
        source: input
        description: Family requires an interpreter for evaluation sessions
        default: false
      - name: bilingual_evaluation_required
        type: boolean
        source: input
        description: Evaluation must be administered by a psychologist certified in primary_language
        default: false
      - name: requested_domains
        type: array
        source: input
        description: Assessment domains requested by the intervention team
        constraints: "non-empty subset of {COGNITIVE, ACADEMIC, SOCIAL_EMOTIONAL, ADAPTIVE}, no duplicates"
      - name: intervention_team_summary
        type: string
        source: input
        description: Free-text summary of tier-2/tier-3 interventions already attempted
        default: ""
      - name: status
        type: enum
        source: system
        description: Consent lifecycle state
        default: INTAKE_RECEIVED
        constraints: "one of INTAKE_RECEIVED, CONSENTED, CONSENT_WAIVED, CONSENT_WITHDRAWN, COMPLETED"
      - name: consent_received_at
        type: datetime
        source: system
        description: Consent-to-evaluate timestamp taken from the consent event's effective_at; starts the statutory clock
        default: null
      - name: last_consent_event_type
        type: enum
        source: system
        description: event_type of the most recent consent event recorded on this Referral
        default: null
        constraints: "one of CONSENT_RECEIVED, CONSENT_WAIVED, CONSENT_WITHDRAWN"
      - name: parent_signature_reference
        type: string
        source: system
        description: Document reference supplied with the consent event (signature packet id)
        default: null
      - name: waiver_reason
        type: string
        source: system
        description: Reason recorded with a CONSENT_WAIVED event (reevaluation consent-to-waive documentation)
        default: null

  - name: Evaluation
    parent: null
    common_fields: true
    fields:
      - name: referral_id
        type: string
        source: system
        description: FK -> Referral.id; the referral whose consent event created this Evaluation
      - name: psychologist_id
        type: string
        source: system
        description: FK -> Psychologist.id; assigned evaluator, null while PENDING_ASSIGNMENT
        default: null
      - name: prior_evaluation_id
        type: string
        source: system
        description: FK -> Evaluation.id; copied from Referral.prior_evaluation_id, null for INITIAL referrals
        default: null
      - name: testing_instrument_id
        type: string
        source: system
        description: FK -> AssessmentInstrument.id; instrument recorded at testing-start, null before
        default: null
      - name: report_drafted_by_psychologist_id
        type: string
        source: system
        description: FK -> Psychologist.id; author of the current report draft, used by the segregation-of-duties check
        default: null
      - name: evaluation_domains
        type: array
        source: system
        description: Copied from Referral.requested_domains at creation; drives caseload_points and protocol consumption
      - name: interpreter_required
        type: boolean
        source: system
        description: Copied from Referral.interpreter_required at creation
      - name: referral_type
        type: enum
        source: system
        description: Copied from Referral.referral_type at creation
        constraints: "one of INITIAL, REEVALUATION"
      - name: assessment_status
        type: enum
        source: system
        description: Assessment-workflow state dimension (see §1.2 Evaluation/assessment_status)
        default: PENDING_ASSIGNMENT
        constraints: "one of PENDING_ASSIGNMENT, ASSIGNED, IN_TESTING, SCORED, REPORT_DRAFTED, REPORT_FINAL, CANCELLED"
      - name: compliance_status
        type: enum
        source: system
        description: Timeline-compliance state dimension (see §1.2 Evaluation/compliance_status)
        default: ON_TRACK
        constraints: "one of ON_TRACK, AT_RISK, BREACHED, COMPLIANT_CLOSED, BREACH_CLOSED_REMEDIED, WAIVED"
      - name: clock_start_date
        type: string
        source: system
        description: UTC calendar date (YYYY-MM-DD) of Referral.consent_received_at; day 0 of the statutory clock
      - name: base_due_date
        type: string
        source: computed
        description: clock_start_date + STATUTORY_EVAL_DAYS calendar days, ignoring exclusions (calculations.evaluation_timeline_clock)
      - name: credited_exclusion_days
        type: integer
        source: computed
        description: Capped sum of days_credited over this Evaluation's APPROVED TimelineExclusions
      - name: statutory_due_date
        type: string
        source: computed
        description: base_due_date + credited_exclusion_days calendar days
      - name: elapsed_statutory_days
        type: integer
        source: computed
        description: max(0, (current clock date - clock_start_date) in days - credited_exclusion_days)
      - name: days_remaining
        type: integer
        source: computed
        description: STATUTORY_EVAL_DAYS - elapsed_statutory_days; may be negative
      - name: caseload_points
        type: integer
        source: computed
        description: Workload weight of this Evaluation (calculations.evaluation_caseload_points)
      - name: reassignment_count
        type: integer
        source: system
        description: Number of times assign has moved this Evaluation to a different psychologist_id
        default: 0
      - name: protocol_units_consumed
        type: integer
        source: system
        description: Protocol booklets consumed from AssessmentInstrument.protocol_stock_count at testing-start
        default: 0
      - name: score_summary
        type: string
        source: system
        description: Free-text score summary recorded at the scores step
        default: null
      - name: report_narrative
        type: string
        source: system
        description: Free-text report narrative recorded at the report-draft step
        default: null

  - name: TimelineExclusion
    parent: null
    common_fields: true
    fields:
      - name: evaluation_id
        type: string
        source: input
        description: FK -> Evaluation.id; the evaluation whose clock the exclusion would pause
      - name: exclusion_type
        type: enum
        source: input
        description: Statutory basis for the exclusion; determines the per-exclusion day cap
        constraints: "one of BREAK_CLOSURE, PARENT_UNAVAILABLE, STUDENT_ABSENT_STREAK, TRANSFER_IN_TRANSIT"
      - name: start_date
        type: string
        source: input
        description: First excluded calendar date (YYYY-MM-DD, inclusive)
      - name: end_date
        type: string
        source: input
        description: Last excluded calendar date (YYYY-MM-DD, inclusive); MUST be >= start_date
      - name: claim_note
        type: string
        source: input
        description: Narrative justification recorded by the claiming psychologist
        default: ""
      - name: status
        type: enum
        source: system
        description: Review state of the claim
        default: CLAIMED
        constraints: "one of CLAIMED, APPROVED, REJECTED"
      - name: days_claimed
        type: integer
        source: computed
        description: Inclusive calendar-day count of [start_date, end_date]
      - name: days_credited
        type: integer
        source: computed
        description: Days actually credited to the clock after window intersection and per-type cap (0 while CLAIMED or REJECTED)
      - name: decided_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the supervisor who decided the claim
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the decision
        default: null

  - name: AssessmentInstrument
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Instrument display name
      - name: instrument_code
        type: string
        source: input
        description: Publisher instrument code (informational)
      - name: protocol_stock_count
        type: integer
        source: input
        description: Consumable protocol booklets on hand; debited at testing-start, credited on order receipt
        default: 0
        constraints: ">= 0"
      - name: protocol_units_per_administration
        type: integer
        source: input
        description: Booklets consumed per assessment domain administered
        default: 1
        constraints: ">= 1"
      - name: protocol_unit_cost_cents
        type: integer
        source: input
        description: List price per protocol booklet in cents, before tier and contract adjustments
        constraints: ">= 1"
      - name: license_seat_total
        type: integer
        source: input
        description: Scoring-software concurrent seats owned by the district for this instrument
        default: 0
        constraints: ">= 0"
      - name: license_seats_free
        type: integer
        source: computed
        description: license_seat_total - count(ScoringLicenseSeat WHERE instrument_id == this AND status == ASSIGNED)
      - name: license_expires_on
        type: string
        source: input
        description: Last calendar date (YYYY-MM-DD, inclusive) the scoring licence is valid
      - name: license_status
        type: enum
        source: computed
        description: ACTIVE when current clock date <= license_expires_on, else EXPIRED
        constraints: "one of ACTIVE, EXPIRED"
      - name: supported_language_editions
        type: array
        source: input
        description: ISO 639-1 codes for which a translated protocol edition exists
        default: ["en"]

  - name: ProtocolOrder
    parent: null
    common_fields: true
    fields:
      - name: instrument_id
        type: string
        source: input
        description: FK -> AssessmentInstrument.id; instrument whose protocols are ordered
      - name: quantity_requested
        type: integer
        source: input
        description: Protocol booklets ordered
        constraints: ">= 1"
      - name: rush_flag
        type: boolean
        source: input
        description: Rush handling requested; adds the rush surcharge component
        default: false
      - name: unit_price_cents
        type: integer
        source: computed
        description: Tier-adjusted per-booklet price, rounded HALF_UP to whole cents before multiplication
      - name: base_cents
        type: integer
        source: computed
        description: unit_price_cents * quantity_requested
      - name: contract_discount_cents
        type: integer
        source: computed
        description: HALF_UP rounding of base_cents * DISTRICT_CONTRACT_DISCOUNT_PCT, rounded independently
      - name: rush_surcharge_cents
        type: integer
        source: computed
        description: HALF_UP rounding of base_cents * RUSH_SURCHARGE_PCT when rush_flag, else 0, rounded independently
      - name: handling_fee_cents
        type: integer
        source: computed
        description: SMALL_ORDER_HANDLING_FEE_CENTS when quantity_requested < 25, else 0
      - name: total_cost_cents
        type: integer
        source: computed
        description: base_cents - contract_discount_cents + rush_surcharge_cents + handling_fee_cents
      - name: status
        type: enum
        source: system
        description: Order lifecycle state; orders at or under the auto-approve threshold skip review
        default: SUBMITTED
        constraints: "one of SUBMITTED, APPROVED, CANCELLED, RECEIVED"
      - name: auto_approved
        type: boolean
        source: computed
        description: true when total_cost_cents <= AUTO_APPROVE_THRESHOLD_CENTS at creation
      - name: received_quantity
        type: integer
        source: system
        description: Booklets actually received; credited to AssessmentInstrument.protocol_stock_count
        default: 0
      - name: decided_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the district administrator who approved or cancelled the order
        default: null

  - name: ScoringLicenseSeat
    parent: null
    common_fields: true
    fields:
      - name: instrument_id
        type: string
        source: system
        description: FK -> AssessmentInstrument.id; instrument whose scoring licence this seat belongs to
      - name: psychologist_id
        type: string
        source: input
        description: FK -> Psychologist.id; seat holder
      - name: status
        type: enum
        source: system
        description: Seat occupancy state
        default: ASSIGNED
        constraints: "one of ASSIGNED, RELEASED"
      - name: assigned_at
        type: datetime
        source: system
        description: Logical-clock timestamp of seat assignment
      - name: released_at
        type: datetime
        source: system
        description: Logical-clock timestamp of seat release
        default: null

  - name: InterpreterSession
    parent: null
    common_fields: true
    fields:
      - name: evaluation_id
        type: string
        source: input
        description: >-
          FK -> Evaluation.id; the evaluation being interpreted. The occupied psychologist calendar is
          Evaluation.psychologist_id and the session's building is Evaluation.referral_id -> Referral.school_id.
      - name: language_code
        type: string
        source: input
        description: ISO 639-1 code interpreted during the session
      - name: interpreter_name
        type: string
        source: input
        description: Interpreter display name (vendor-supplied, informational)
      - name: session_start_at
        type: datetime
        source: input
        description: Session start instant (UTC, inclusive)
      - name: session_end_at
        type: datetime
        source: input
        description: Session end instant (UTC, exclusive); MUST be strictly after session_start_at
      - name: status
        type: enum
        source: system
        description: Session state
        default: SCHEDULED
        constraints: "one of SCHEDULED, COMPLETED, CANCELLED"
      - name: cancellation_reason
        type: enum
        source: system
        description: Why a cascade cancelled the session
        default: null
        constraints: "one of PSYCHOLOGIST_UNAVAILABLE, CONSENT_WITHDRAWN"
      - name: duration_minutes
        type: integer
        source: computed
        description: Whole minutes between session_start_at and session_end_at

  - name: EligibilityMeeting
    parent: null
    common_fields: true
    fields:
      - name: evaluation_id
        type: string
        source: input
        description: FK -> Evaluation.id; the evaluation whose eligibility determination this meeting makes
      - name: school_id
        type: string
        source: input
        description: FK -> School.id; building hosting the meeting; its concurrent_meeting_capacity gates booking
      - name: scheduled_start_at
        type: datetime
        source: input
        description: Meeting start instant (UTC)
      - name: scheduled_end_at
        type: datetime
        source: input
        description: Meeting end instant (UTC); MUST be strictly after scheduled_start_at
      - name: parent_notice_sent_at
        type: datetime
        source: system
        description: Logical-clock timestamp when the parent notice was issued
        default: null
      - name: notice_lead_days
        type: integer
        source: computed
        description: Calendar days between parent_notice_sent_at's date and scheduled_start_at's date; null before notice
      - name: reschedule_count
        type: integer
        source: system
        description: Number of accepted reschedule requests on this meeting
        default: 0
      - name: status
        type: enum
        source: system
        description: Meeting lifecycle state
        default: PROPOSED
        constraints: "one of PROPOSED, NOTICED, RESCHEDULE_REQUESTED, HELD, SUPERSEDED, CANCELLED"
      - name: held_at
        type: datetime
        source: system
        description: Logical-clock timestamp when the meeting was recorded as held
        default: null

  - name: TimelineBreach
    parent: null
    common_fields: true
    fields:
      - name: evaluation_id
        type: string
        source: system
        description: FK -> Evaluation.id; the evaluation that blew its statutory due date
      - name: detected_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the compliance run that detected the breach
      - name: breach_days
        type: integer
        source: computed
        description: Days past the statutory due date at detection (- days_remaining), frozen at detection
      - name: severity
        type: enum
        source: computed
        description: MINOR when breach_days <= 5, MODERATE when 6..15, SEVERE when > 15
        constraints: "one of MINOR, MODERATE, SEVERE"
      - name: minutes_breach_day_basis
        type: integer
        source: computed
        description: BREACH_DAY_BASIS variant of calculations.compensatory_minutes
      - name: minutes_missed_service_basis
        type: integer
        source: computed
        description: MISSED_SERVICE_BASIS variant of calculations.compensatory_minutes
      - name: remedy_basis
        type: enum
        source: system
        description: Basis chosen when the remedy was proposed
        default: null
        constraints: "one of BREACH_DAY_BASIS, MISSED_SERVICE_BASIS"
      - name: additional_minutes
        type: integer
        source: system
        description: Discretionary minutes added on top of the chosen basis at proposal time
        default: 0
      - name: remedy_minutes_awarded
        type: integer
        source: computed
        description: minutes for remedy_basis + additional_minutes; 0 while DETECTED or after VACATED
        default: 0
      - name: corrective_action_note
        type: string
        source: system
        description: Corrective-action narrative recorded with the proposal
        default: null
      - name: proposed_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the compliance officer who proposed the remedy
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the district administrator who approved the remedy
        default: null
      - name: status
        type: enum
        source: system
        description: Breach lifecycle state
        default: DETECTED
        constraints: "one of DETECTED, REMEDY_PROPOSED, REMEDY_APPROVED, VACATED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Referral
    state_field: status
    initial_state: INTAKE_RECEIVED
    terminal_states: [CONSENT_WITHDRAWN, COMPLETED]
    transitions:
      - from: INTAKE_RECEIVED
        to: CONSENTED
        trigger: "POST /psych-services/referrals/{referral_id}/consent-events with event_type=CONSENT_RECEIVED"
        actor: IntakeCoordinator
        preconditions:
          - "referral.status == INTAKE_RECEIVED"
          - "effective_at <= current logical clock instant"
        side_effects:
          - "sets consent_received_at = effective_at, last_consent_event_type = CONSENT_RECEIVED, parent_signature_reference = payload value"
          - "creates one Evaluation with referral_id = this Referral.id, assessment_status = PENDING_ASSIGNMENT, compliance_status = ON_TRACK, clock_start_date = UTC date of effective_at, evaluation_domains / interpreter_required / referral_type copied from the Referral, prior_evaluation_id copied from Referral.prior_evaluation_id"
          - "runs calculations.evaluation_timeline_clock and calculations.evaluation_caseload_points on the new Evaluation"
          - "sets Referral.active_evaluation_id = new Evaluation.id"
      - from: INTAKE_RECEIVED
        to: CONSENT_WAIVED
        trigger: "POST /psych-services/referrals/{referral_id}/consent-events with event_type=CONSENT_WAIVED"
        actor: IntakeCoordinator
        preconditions:
          - "referral.status == INTAKE_RECEIVED"
          - "referral.referral_type == REEVALUATION (consent-to-waive documentation exists only for reevaluations)"
          - "effective_at <= current logical clock instant"
        side_effects:
          - "sets consent_received_at = effective_at, last_consent_event_type = CONSENT_WAIVED, waiver_reason = payload value"
          - "creates one Evaluation exactly as the CONSENTED transition does (clock starts from the waiver's effective_at)"
          - "sets Referral.active_evaluation_id = new Evaluation.id"
        note: "The reevaluation cycle: parents may waive the full reevaluation consent, and the clock still runs from the waiver signature."
      - from: CONSENTED
        to: CONSENT_WITHDRAWN
        trigger: "POST /psych-services/referrals/{referral_id}/consent-events with event_type=CONSENT_WITHDRAWN"
        actor: IntakeCoordinator
        preconditions:
          - "referral.status IN {CONSENTED, CONSENT_WAIVED}"
          - "effective_at <= current logical clock instant"
        side_effects:
          - "cascade L1: Evaluation(active_evaluation_id).assessment_status -> CANCELLED when it is not already REPORT_FINAL or CANCELLED"
          - "cascade L2 (caused by L1): Evaluation.compliance_status -> WAIVED; Evaluation.psychologist_id retained for audit but the evaluation leaves the caseload window, so calculations.psychologist_open_case_points reruns for the assigned Psychologist"
          - "cascade L3 (caused by L1): every InterpreterSession of that Evaluation with status == SCHEDULED -> CANCELLED with cancellation_reason = CONSENT_WITHDRAWN"
          - "cascade L3 (caused by L1): every EligibilityMeeting of that Evaluation with status IN {PROPOSED, NOTICED, RESCHEDULE_REQUESTED} -> CANCELLED"
      - from: CONSENT_WAIVED
        to: CONSENT_WITHDRAWN
        trigger: "POST /psych-services/referrals/{referral_id}/consent-events with event_type=CONSENT_WITHDRAWN"
        actor: IntakeCoordinator
        preconditions:
          - "referral.status IN {CONSENTED, CONSENT_WAIVED}"
        side_effects:
          - "identical cascade to CONSENTED -> CONSENT_WITHDRAWN"
      - from: CONSENTED
        to: COMPLETED
        trigger: "system, on POST /psych-services/eligibility-meetings/{meeting_id}/hold"
        actor: system
        preconditions:
          - "the held meeting's Evaluation is this Referral.active_evaluation_id"
        side_effects:
          - "no further consent events accepted (terminal)"
      - from: CONSENT_WAIVED
        to: COMPLETED
        trigger: "system, on POST /psych-services/eligibility-meetings/{meeting_id}/hold"
        actor: system
        preconditions:
          - "the held meeting's Evaluation is this Referral.active_evaluation_id"
        side_effects:
          - "no further consent events accepted (terminal)"

  - entity: Evaluation
    state_field: assessment_status
    initial_state: PENDING_ASSIGNMENT
    terminal_states: [REPORT_FINAL, CANCELLED]
    note: "Dimension 1 of 2. Evolves independently of compliance_status; a REPORT_FINAL evaluation may still be BREACHED."
    transitions:
      - from: PENDING_ASSIGNMENT
        to: ASSIGNED
        trigger: "POST /psych-services/evaluations/{evaluation_id}/assign"
        actor: PsychServicesSupervisor
        preconditions:
          - "expected_evaluation_version == evaluation.version (§1.2.1 assign-stale-evaluation)"
          - "assessment_status IN {PENDING_ASSIGNMENT, ASSIGNED}"
          - "Referral(referral_id).status IN {CONSENTED, CONSENT_WAIVED}"
          - "when psychologist_id supplied: that Psychologist.status == ACTIVE, Referral.school_id IN psychologist.assigned_school_ids, language certification satisfied when Referral.bilingual_evaluation_required, credential scope satisfied, and open_case_points + evaluation.caseload_points <= weekly_capacity_points"
          - "when psychologist_id omitted: calculations.psychologist_assignment_rank_score yields a non-empty candidate pool"
        side_effects:
          - "sets psychologist_id (supplied id, or the selector winner)"
          - "reruns calculations.psychologist_open_case_points and calculations.caseload_pressure_index for the newly assigned Psychologist (open_case_points, caseload_status, both pressure_index fields)"
          - "increments Evaluation.version by 1"
      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /psych-services/evaluations/{evaluation_id}/assign (reassignment supersedes the prior assignment)"
        actor: PsychServicesSupervisor
        preconditions:
          - "expected_evaluation_version == evaluation.version"
          - "the resolved psychologist_id differs from the current psychologist_id"
          - "all eligibility preconditions of PENDING_ASSIGNMENT -> ASSIGNED hold for the incoming psychologist"
        side_effects:
          - "increments reassignment_count by 1"
          - "reruns calculations.psychologist_open_case_points and calculations.caseload_pressure_index for BOTH the outgoing and the incoming Psychologist — the outgoing loses exactly evaluation.caseload_points and the incoming gains exactly the same, conserving the district total (see §1.3 caseload_points_conservation)"
          - "increments Evaluation.version by 1"
      - from: ASSIGNED
        to: IN_TESTING
        trigger: "POST /psych-services/evaluations/{evaluation_id}/testing-start"
        actor: SchoolPsychologist
        preconditions:
          - "X-User-ID == evaluation.psychologist_id"
          - "assessment_status == ASSIGNED"
          - "Referral(referral_id).status IN {CONSENTED, CONSENT_WAIVED}"
          - "AssessmentInstrument(instrument_id).license_status == ACTIVE and a ScoringLicenseSeat with status == ASSIGNED exists for (instrument_id, X-User-ID)"
          - "when evaluation.interpreter_required: at least one InterpreterSession of this Evaluation has status IN {SCHEDULED, COMPLETED}"
          - "AssessmentInstrument.protocol_stock_count >= protocol_units_per_administration * len(evaluation_domains)"
        side_effects:
          - "sets testing_instrument_id = instrument_id"
          - "sets protocol_units_consumed = protocol_units_per_administration * len(evaluation_domains) and debits AssessmentInstrument.protocol_stock_count by the same amount"
      - from: IN_TESTING
        to: SCORED
        trigger: "POST /psych-services/evaluations/{evaluation_id}/scores"
        actor: SchoolPsychologist
        preconditions:
          - "X-User-ID == evaluation.psychologist_id"
          - "assessment_status == IN_TESTING"
        side_effects:
          - "sets score_summary"
      - from: SCORED
        to: REPORT_DRAFTED
        trigger: "POST /psych-services/evaluations/{evaluation_id}/report-draft"
        actor: SchoolPsychologist
        preconditions:
          - "X-User-ID == evaluation.psychologist_id"
          - "assessment_status == SCORED"
        side_effects:
          - "sets report_narrative and report_drafted_by_psychologist_id = X-User-ID"
      - from: REPORT_DRAFTED
        to: REPORT_FINAL
        trigger: "POST /psych-services/evaluations/{evaluation_id}/report-review with decision=APPROVE"
        actor: SchoolPsychologist
        preconditions:
          - "assessment_status == REPORT_DRAFTED"
          - "X-User-ID != evaluation.report_drafted_by_psychologist_id (segregation of duties)"
          - "the reviewing Psychologist exists and status == ACTIVE"
        side_effects:
          - "cascade L1: assessment_status -> REPORT_FINAL (the evaluation leaves the open-caseload window)"
          - "cascade L2 (caused by L1): calculations.psychologist_open_case_points reruns for evaluation.psychologist_id, dropping open_case_points by exactly evaluation.caseload_points"
          - "cascade L3 (caused by L2): caseload_status and both pressure_index fields are re-derived from the new open_case_points"
        note: "Peer review is the only path to REPORT_FINAL; the drafter can never self-approve."
      - from: REPORT_DRAFTED
        to: SCORED
        trigger: "POST /psych-services/evaluations/{evaluation_id}/report-review with decision=RETURN"
        actor: SchoolPsychologist
        preconditions:
          - "assessment_status == REPORT_DRAFTED"
          - "X-User-ID != evaluation.report_drafted_by_psychologist_id"
        side_effects:
          - "clears report_narrative and report_drafted_by_psychologist_id (draft must be re-authored)"
        note: "Revision cycle: SCORED -> REPORT_DRAFTED -> SCORED may repeat without limit."
      - from: ASSIGNED
        to: PENDING_ASSIGNMENT
        trigger: "system, on POST /psych-services/psychologists/{psychologist_id}/leave"
        actor: system
        preconditions:
          - "evaluation.psychologist_id == the psychologist going on leave"
          - "assessment_status IN {ASSIGNED, IN_TESTING, SCORED, REPORT_DRAFTED}"
        side_effects:
          - "clears psychologist_id, increments reassignment_count by 1"
          - "cascade (caused by this unassignment): every InterpreterSession of this Evaluation with status == SCHEDULED -> CANCELLED with cancellation_reason = PSYCHOLOGIST_UNAVAILABLE"
      - from: IN_TESTING
        to: PENDING_ASSIGNMENT
        trigger: "system, on POST /psych-services/psychologists/{psychologist_id}/leave"
        actor: system
        preconditions:
          - "evaluation.psychologist_id == the psychologist going on leave"
        side_effects:
          - "identical to ASSIGNED -> PENDING_ASSIGNMENT; protocol_units_consumed is NOT refunded"
      - from: SCORED
        to: PENDING_ASSIGNMENT
        trigger: "system, on POST /psych-services/psychologists/{psychologist_id}/leave"
        actor: system
        preconditions:
          - "evaluation.psychologist_id == the psychologist going on leave"
        side_effects:
          - "identical to ASSIGNED -> PENDING_ASSIGNMENT"
      - from: REPORT_DRAFTED
        to: PENDING_ASSIGNMENT
        trigger: "system, on POST /psych-services/psychologists/{psychologist_id}/leave"
        actor: system
        preconditions:
          - "evaluation.psychologist_id == the psychologist going on leave"
        side_effects:
          - "identical to ASSIGNED -> PENDING_ASSIGNMENT; report_drafted_by_psychologist_id is retained so the returning draft still cannot be self-approved"
      - from: PENDING_ASSIGNMENT
        to: CANCELLED
        trigger: "system, on consent event CONSENT_WITHDRAWN"
        actor: system
        preconditions:
          - "Referral(referral_id).status transitions to CONSENT_WITHDRAWN"
        side_effects:
          - "compliance_status -> WAIVED"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "system, on consent event CONSENT_WITHDRAWN"
        actor: system
        preconditions:
          - "Referral(referral_id).status transitions to CONSENT_WITHDRAWN"
        side_effects:
          - "compliance_status -> WAIVED; calculations.psychologist_open_case_points reruns for psychologist_id"
      - from: IN_TESTING
        to: CANCELLED
        trigger: "system, on consent event CONSENT_WITHDRAWN"
        actor: system
        preconditions:
          - "Referral(referral_id).status transitions to CONSENT_WITHDRAWN"
        side_effects:
          - "compliance_status -> WAIVED; calculations.psychologist_open_case_points reruns for psychologist_id"
      - from: SCORED
        to: CANCELLED
        trigger: "system, on consent event CONSENT_WITHDRAWN"
        actor: system
        preconditions:
          - "Referral(referral_id).status transitions to CONSENT_WITHDRAWN"
        side_effects:
          - "compliance_status -> WAIVED; calculations.psychologist_open_case_points reruns for psychologist_id"
      - from: REPORT_DRAFTED
        to: CANCELLED
        trigger: "system, on consent event CONSENT_WITHDRAWN"
        actor: system
        preconditions:
          - "Referral(referral_id).status transitions to CONSENT_WITHDRAWN"
        side_effects:
          - "compliance_status -> WAIVED; calculations.psychologist_open_case_points reruns for psychologist_id"

  - entity: Evaluation
    state_field: compliance_status
    initial_state: ON_TRACK
    terminal_states: [COMPLIANT_CLOSED, BREACH_CLOSED_REMEDIED, WAIVED]
    note: "Dimension 2 of 2. Only system actors move it: the compliance run, the exclusion-approval cascade, the meeting hold, the remedy approval, and consent withdrawal."
    transitions:
      - from: ON_TRACK
        to: AT_RISK
        trigger: "system, on POST /psych-services/compliance-runs"
        actor: system
        preconditions:
          - "assessment_status NOT IN {REPORT_FINAL, CANCELLED}"
          - "0 <= days_remaining <= AT_RISK_WINDOW_DAYS"
        side_effects:
          - "reruns calculations.caseload_pressure_index for evaluation.psychologist_id (urgency weight rises from 1.0 to 1.5)"
      - from: ON_TRACK
        to: BREACHED
        trigger: "system, on POST /psych-services/compliance-runs"
        actor: system
        preconditions:
          - "assessment_status NOT IN {REPORT_FINAL, CANCELLED}"
          - "days_remaining < 0"
          - "no TimelineBreach with status IN {DETECTED, REMEDY_PROPOSED, REMEDY_APPROVED} exists for this Evaluation"
        side_effects:
          - "creates one TimelineBreach with status DETECTED, breach_days = -days_remaining, severity, minutes_breach_day_basis and minutes_missed_service_basis all frozen at detection"
          - "reruns calculations.caseload_pressure_index for evaluation.psychologist_id (urgency weight rises to 2.0)"
      - from: AT_RISK
        to: BREACHED
        trigger: "system, on POST /psych-services/compliance-runs"
        actor: system
        preconditions:
          - "assessment_status NOT IN {REPORT_FINAL, CANCELLED}"
          - "days_remaining < 0"
          - "no TimelineBreach with status IN {DETECTED, REMEDY_PROPOSED, REMEDY_APPROVED} exists for this Evaluation"
        side_effects:
          - "identical to ON_TRACK -> BREACHED"
      - from: AT_RISK
        to: ON_TRACK
        trigger: "system, on POST /psych-services/timeline-exclusions/{exclusion_id}/decision with decision=APPROVE, or on POST /psych-services/compliance-runs"
        actor: system
        preconditions:
          - "days_remaining > AT_RISK_WINDOW_DAYS after the exclusion credit is applied"
        side_effects:
          - "reruns calculations.caseload_pressure_index for evaluation.psychologist_id"
      - from: BREACHED
        to: AT_RISK
        trigger: "system, on POST /psych-services/timeline-exclusions/{exclusion_id}/decision with decision=APPROVE"
        actor: system
        preconditions:
          - "0 <= days_remaining <= AT_RISK_WINDOW_DAYS after the exclusion credit is applied"
        side_effects:
          - "cascade L4 (caused by the compliance recovery): the Evaluation's TimelineBreach with status IN {DETECTED, REMEDY_PROPOSED} -> VACATED, remedy_minutes_awarded -> 0"
          - "reruns calculations.caseload_pressure_index for evaluation.psychologist_id"
        note: "Cyclic: BREACHED may be left and re-entered as exclusions are approved and the clock keeps running."
      - from: BREACHED
        to: ON_TRACK
        trigger: "system, on POST /psych-services/timeline-exclusions/{exclusion_id}/decision with decision=APPROVE"
        actor: system
        preconditions:
          - "days_remaining > AT_RISK_WINDOW_DAYS after the exclusion credit is applied"
        side_effects:
          - "identical to BREACHED -> AT_RISK, including breach vacation"
      - from: ON_TRACK
        to: COMPLIANT_CLOSED
        trigger: "system, on POST /psych-services/eligibility-meetings/{meeting_id}/hold"
        actor: system
        preconditions:
          - "assessment_status == REPORT_FINAL"
          - "days_remaining >= 0 at the moment of the hold"
        side_effects:
          - "cascade: Referral(referral_id).status -> COMPLETED"
      - from: AT_RISK
        to: COMPLIANT_CLOSED
        trigger: "system, on POST /psych-services/eligibility-meetings/{meeting_id}/hold"
        actor: system
        preconditions:
          - "assessment_status == REPORT_FINAL"
          - "days_remaining >= 0 at the moment of the hold"
        side_effects:
          - "cascade: Referral(referral_id).status -> COMPLETED"
      - from: BREACHED
        to: BREACH_CLOSED_REMEDIED
        trigger: "system, on POST /psych-services/timeline-breaches/{breach_id}/approve-remedy"
        actor: system
        preconditions:
          - "the breach belongs to this Evaluation and its status == REMEDY_PROPOSED"
        side_effects:
          - "reruns calculations.caseload_pressure_index for evaluation.psychologist_id"
      - from: ON_TRACK
        to: WAIVED
        trigger: "system, on consent event CONSENT_WITHDRAWN"
        actor: system
        preconditions:
          - "Referral(referral_id).status transitions to CONSENT_WITHDRAWN"
        side_effects: ["the clock stops; compliance runs skip WAIVED evaluations"]
      - from: AT_RISK
        to: WAIVED
        trigger: "system, on consent event CONSENT_WITHDRAWN"
        actor: system
        preconditions:
          - "Referral(referral_id).status transitions to CONSENT_WITHDRAWN"
        side_effects: ["the clock stops; compliance runs skip WAIVED evaluations"]
      - from: BREACHED
        to: WAIVED
        trigger: "system, on consent event CONSENT_WITHDRAWN"
        actor: system
        preconditions:
          - "Referral(referral_id).status transitions to CONSENT_WITHDRAWN"
        side_effects:
          - "the Evaluation's TimelineBreach with status IN {DETECTED, REMEDY_PROPOSED} -> VACATED, remedy_minutes_awarded -> 0"

  - entity: TimelineExclusion
    state_field: status
    initial_state: CLAIMED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: CLAIMED
        to: APPROVED
        trigger: "POST /psych-services/timeline-exclusions/{exclusion_id}/decision with decision=APPROVE"
        actor: PsychServicesSupervisor
        preconditions:
          - "status == CLAIMED"
          - "Evaluation(evaluation_id).compliance_status NOT IN {COMPLIANT_CLOSED, BREACH_CLOSED_REMEDIED, WAIVED}"
          - "calculations.exclusion_day_credit yields days_credited >= 1"
        side_effects:
          - "cascade L1: sets days_credited, decided_by_user_id, decided_at"
          - "cascade L2 (caused by L1): Evaluation.credited_exclusion_days, statutory_due_date, elapsed_statutory_days and days_remaining are recomputed by calculations.evaluation_timeline_clock"
          - "cascade L3 (caused by L2): Evaluation.compliance_status is re-derived from the new days_remaining (BREACHED -> AT_RISK / ON_TRACK when the credit pulls the clock back inside the window)"
          - "cascade L4 (caused by L3 leaving BREACHED): the Evaluation's TimelineBreach with status IN {DETECTED, REMEDY_PROPOSED} -> VACATED and remedy_minutes_awarded -> 0"
      - from: CLAIMED
        to: REJECTED
        trigger: "POST /psych-services/timeline-exclusions/{exclusion_id}/decision with decision=REJECT"
        actor: PsychServicesSupervisor
        preconditions:
          - "status == CLAIMED"
        side_effects:
          - "sets decided_by_user_id, decided_at; days_credited stays 0 and the Evaluation clock is untouched"

  - entity: ProtocolOrder
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [CANCELLED, RECEIVED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "system, at POST /psych-services/protocol-orders when total_cost_cents <= AUTO_APPROVE_THRESHOLD_CENTS"
        actor: system
        preconditions:
          - "total_cost_cents <= AUTO_APPROVE_THRESHOLD_CENTS (inclusive)"
        side_effects:
          - "sets auto_approved = true; no decided_by_user_id is recorded"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /psych-services/protocol-orders/{order_id}/decision with decision=APPROVE"
        actor: DistrictAdmin
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "sets decided_by_user_id = X-User-ID"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /psych-services/protocol-orders/{order_id}/decision with decision=CANCEL"
        actor: DistrictAdmin
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "sets decided_by_user_id = X-User-ID; instrument stock untouched"
      - from: APPROVED
        to: RECEIVED
        trigger: "POST /psych-services/protocol-orders/{order_id}/receive"
        actor: PsychServicesSupervisor
        preconditions:
          - "status == APPROVED"
          - "received_quantity <= quantity_requested"
        side_effects:
          - "sets received_quantity"
          - "credits AssessmentInstrument.protocol_stock_count by received_quantity"

  - entity: ScoringLicenseSeat
    state_field: status
    initial_state: ASSIGNED
    terminal_states: [RELEASED]
    transitions:
      - from: ASSIGNED
        to: RELEASED
        trigger: "POST /psych-services/assessment-instruments/{instrument_id}/license-seats/{seat_id}/release"
        actor: PsychServicesSupervisor
        preconditions:
          - "status == ASSIGNED"
        side_effects:
          - "sets released_at; AssessmentInstrument.license_seats_free is re-derived (+1), conserving license_seat_total (see §1.3 license_seat_conservation)"

  - entity: InterpreterSession
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "system, on POST /psych-services/compliance-runs"
        actor: system
        preconditions:
          - "session_end_at <= current logical clock instant"
        side_effects:
          - "no field other than status / updated_at / version changes; a COMPLETED session still occupies its interval on the psychologist calendar"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system, on POST /psych-services/psychologists/{psychologist_id}/leave (via the evaluation unassignment) or on consent event CONSENT_WITHDRAWN"
        actor: system
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "sets cancellation_reason = PSYCHOLOGIST_UNAVAILABLE (leave cascade) or CONSENT_WITHDRAWN (consent cascade)"
          - "the interval stops occupying the psychologist calendar, so a later booking over the same window succeeds"

  - entity: EligibilityMeeting
    state_field: status
    initial_state: PROPOSED
    terminal_states: [HELD, SUPERSEDED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: NOTICED
        trigger: "POST /psych-services/eligibility-meetings/{meeting_id}/notice"
        actor: IntakeCoordinator
        preconditions:
          - "status IN {PROPOSED, RESCHEDULE_REQUESTED}"
          - "(scheduled_start_at date - current clock date) in days >= PARENT_NOTICE_LEAD_DAYS"
        side_effects:
          - "sets parent_notice_sent_at = current clock instant and notice_lead_days = the calendar-day difference"
      - from: RESCHEDULE_REQUESTED
        to: NOTICED
        trigger: "POST /psych-services/eligibility-meetings/{meeting_id}/notice"
        actor: IntakeCoordinator
        preconditions:
          - "status IN {PROPOSED, RESCHEDULE_REQUESTED}"
          - "(scheduled_start_at date - current clock date) in days >= PARENT_NOTICE_LEAD_DAYS"
        side_effects:
          - "re-issues the notice: parent_notice_sent_at and notice_lead_days are overwritten for the new date"
        note: "Cyclic: NOTICED -> RESCHEDULE_REQUESTED -> NOTICED, bounded by MAX_RESCHEDULES."
      - from: NOTICED
        to: RESCHEDULE_REQUESTED
        trigger: "POST /psych-services/eligibility-meetings/{meeting_id}/reschedule-request"
        actor: IntakeCoordinator
        preconditions:
          - "status == NOTICED"
          - "reschedule_count < MAX_RESCHEDULES"
          - "the new interval clears the hosting School's closed-interval capacity check"
        side_effects:
          - "overwrites scheduled_start_at / scheduled_end_at with the requested interval"
          - "increments reschedule_count by 1; clears parent_notice_sent_at and notice_lead_days (a fresh notice is mandatory)"
      - from: NOTICED
        to: HELD
        trigger: "POST /psych-services/eligibility-meetings/{meeting_id}/hold"
        actor: PsychServicesSupervisor
        preconditions:
          - "status == NOTICED"
          - "Evaluation(evaluation_id).assessment_status == REPORT_FINAL"
          - "current clock instant >= scheduled_start_at"
        side_effects:
          - "sets held_at = current clock instant"
          - "cascade L1: Evaluation.compliance_status -> COMPLIANT_CLOSED when days_remaining >= 0 (otherwise the evaluation stays BREACHED and the remedy path applies)"
          - "cascade L2 (caused by L1): Referral(evaluation.referral_id).status -> COMPLETED"
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system, at POST /psych-services/eligibility-meetings when a newer meeting is created for the same Evaluation"
        actor: system
        preconditions:
          - "status IN {PROPOSED, NOTICED, RESCHEDULE_REQUESTED}"
        side_effects:
          - "the superseded interval stops occupying the hosting School's capacity"
      - from: NOTICED
        to: SUPERSEDED
        trigger: "system, at POST /psych-services/eligibility-meetings when a newer meeting is created for the same Evaluation"
        actor: system
        preconditions:
          - "status IN {PROPOSED, NOTICED, RESCHEDULE_REQUESTED}"
        side_effects:
          - "the superseded interval stops occupying the hosting School's capacity"
      - from: RESCHEDULE_REQUESTED
        to: SUPERSEDED
        trigger: "system, at POST /psych-services/eligibility-meetings when a newer meeting is created for the same Evaluation"
        actor: system
        preconditions:
          - "status IN {PROPOSED, NOTICED, RESCHEDULE_REQUESTED}"
        side_effects:
          - "the superseded interval stops occupying the hosting School's capacity"
      - from: PROPOSED
        to: CANCELLED
        trigger: "system, on consent event CONSENT_WITHDRAWN"
        actor: system
        preconditions: ["Referral status transitions to CONSENT_WITHDRAWN"]
        side_effects: ["the interval stops occupying the hosting School's capacity"]
      - from: NOTICED
        to: CANCELLED
        trigger: "system, on consent event CONSENT_WITHDRAWN"
        actor: system
        preconditions: ["Referral status transitions to CONSENT_WITHDRAWN"]
        side_effects: ["the interval stops occupying the hosting School's capacity"]
      - from: RESCHEDULE_REQUESTED
        to: CANCELLED
        trigger: "system, on consent event CONSENT_WITHDRAWN"
        actor: system
        preconditions: ["Referral status transitions to CONSENT_WITHDRAWN"]
        side_effects: ["the interval stops occupying the hosting School's capacity"]

  - entity: TimelineBreach
    state_field: status
    initial_state: DETECTED
    terminal_states: [REMEDY_APPROVED, VACATED]
    note: "Branching: DETECTED forks to REMEDY_PROPOSED (remedy path, ends REMEDY_APPROVED) or VACATED (exclusion/consent path), with disjoint side-effect sets."
    transitions:
      - from: DETECTED
        to: REMEDY_PROPOSED
        trigger: "POST /psych-services/timeline-breaches/{breach_id}/propose-remedy"
        actor: ComplianceOfficer
        preconditions:
          - "status == DETECTED"
          - "remedy_minutes_awarded (basis minutes + additional_minutes) <= REMEDY_MINUTES_CAP"
        side_effects:
          - "sets remedy_basis, additional_minutes, corrective_action_note, proposed_by_user_id"
          - "sets remedy_minutes_awarded from calculations.compensatory_minutes for the chosen basis plus additional_minutes"
      - from: REMEDY_PROPOSED
        to: REMEDY_APPROVED
        trigger: "POST /psych-services/timeline-breaches/{breach_id}/approve-remedy"
        actor: DistrictAdmin
        preconditions:
          - "status == REMEDY_PROPOSED"
        side_effects:
          - "sets approved_by_user_id"
          - "cascade: Evaluation(evaluation_id).compliance_status BREACHED -> BREACH_CLOSED_REMEDIED"
      - from: DETECTED
        to: VACATED
        trigger: "system, on exclusion approval that pulls days_remaining back to >= 0, or on consent event CONSENT_WITHDRAWN"
        actor: system
        preconditions:
          - "status IN {DETECTED, REMEDY_PROPOSED}"
          - "Evaluation.compliance_status left BREACHED"
        side_effects:
          - "sets remedy_minutes_awarded = 0; the breach no longer counts against the district"
      - from: REMEDY_PROPOSED
        to: VACATED
        trigger: "system, on exclusion approval that pulls days_remaining back to >= 0, or on consent event CONSENT_WITHDRAWN"
        actor: system
        preconditions:
          - "status IN {DETECTED, REMEDY_PROPOSED}"
          - "Evaluation.compliance_status left BREACHED"
        side_effects:
          - "sets remedy_minutes_awarded = 0, discarding the proposed award"

  - entity: Psychologist
    state_field: status
    initial_state: ACTIVE
    terminal_states: [ON_LEAVE]
    transitions:
      - from: ACTIVE
        to: ON_LEAVE
        trigger: "POST /psych-services/psychologists/{psychologist_id}/leave"
        actor: DistrictAdmin
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "cascade L1: status -> ON_LEAVE; the psychologist leaves the selector candidate pool"
          - "cascade L2 (caused by L1): every Evaluation with psychologist_id == this and assessment_status IN {ASSIGNED, IN_TESTING, SCORED, REPORT_DRAFTED} -> PENDING_ASSIGNMENT with psychologist_id cleared and reassignment_count incremented"
          - "cascade L3 (caused by L2): every InterpreterSession of each such Evaluation with status == SCHEDULED -> CANCELLED with cancellation_reason = PSYCHOLOGIST_UNAVAILABLE"
          - "cascade L4 (caused by L2): calculations.psychologist_open_case_points and calculations.caseload_pressure_index rerun for this Psychologist, driving open_case_points to 0, caseload_status to BALANCED and both pressure_index fields to 0.00"
          - "ScoringLicenseSeats held by this psychologist are NOT released (licences follow the employee, not the caseload)"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on Evaluation.version only
# =============================================================================
concurrency_rules:
  - rule_id: assign-stale-evaluation
    parent_entity: Evaluation
    write_endpoint: "POST /psych-services/evaluations/{evaluation_id}/assign"
    occ_field: "expected_evaluation_version"
    description: |
      Assigning an evaluator against an Evaluation whose version has advanced since the client last read it
      is rejected with 412. Reassignment legitimately supersedes the prior assignment under §1.2
      (ASSIGNED -> ASSIGNED), so a stale writer would otherwise silently move a case that another supervisor
      has already re-routed, or route on a caseload snapshot the exclusion/compliance cascades have already
      invalidated.
    error_id: ERR_STALE_EVALUATION_VERSION
    http_status: 412
  - rule_id: meeting-create-stale-evaluation
    parent_entity: Evaluation
    write_endpoint: "POST /psych-services/eligibility-meetings"
    occ_field: "expected_evaluation_version"
    description: |
      Creating an EligibilityMeeting for an Evaluation whose version has advanced since the client last read
      it is rejected with 412. A newly created meeting legitimately supersedes any prior PROPOSED / NOTICED /
      RESCHEDULE_REQUESTED meeting for the same Evaluation, so a stale view would silently discard a meeting
      whose parent notice has already gone out.
    error_id: ERR_STALE_EVALUATION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: evaluation_timeline_clock
    trigger: >-
      On Evaluation creation (Referral consent event CONSENT_RECEIVED / CONSENT_WAIVED), on every
      TimelineExclusion CLAIMED -> APPROVED transition, on POST /psych-services/compliance-runs, and on every
      read of an Evaluation (the elapsed/remaining fields are clock-relative).
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is PINNED. The dependency looks circular — the credit window depends on the due
      # date and the due date depends on the credit — so the resolution below is normative:
      #   step 1: base_due_date          = clock_start_date + STATUTORY_EVAL_DAYS calendar days
      #   step 2: per-exclusion credit   = calculations.exclusion_day_credit, whose intersection window is
      #                                    [clock_start_date, base_due_date] from step 1 — NEVER the
      #                                    already-extended statutory_due_date
      #   step 3: credited_exclusion_days = min( sum(days_credited of APPROVED exclusions, ordered by
      #                                          created_at ASC), floor(STATUTORY_EVAL_DAYS * EXCLUSION_CAP_PCT) )
      #                                    -> the aggregate cap is a share of the BASE 60-day window, not of
      #                                       the extended window
      #   step 4: statutory_due_date     = base_due_date + credited_exclusion_days calendar days
      #   step 5: elapsed_statutory_days = max(0, days_between(clock_start_date, current_clock_date)
      #                                            - credited_exclusion_days)
      #   step 6: days_remaining         = STATUTORY_EVAL_DAYS - elapsed_statutory_days
      #   step 7: compliance posture (only the compliance run, the exclusion cascade, the hold and the
      #           remedy write it; see §1.2 Evaluation/compliance_status):
      #             days_remaining < 0                              -> BREACHED
      #             0 <= days_remaining <= AT_RISK_WINDOW_DAYS       -> AT_RISK
      #             days_remaining > AT_RISK_WINDOW_DAYS             -> ON_TRACK
      # days_between(a, b) = (b - a) in whole UTC calendar days, counting the start date as day 0.
      # All dates are UTC calendar dates; current_clock_date is the UTC date of the logical clock.
    input_set: >-
      Only TimelineExclusions of this Evaluation with status == APPROVED enter step 3; CLAIMED and REJECTED
      claims contribute 0. Evaluations with compliance_status IN {COMPLIANT_CLOSED, BREACH_CLOSED_REMEDIED,
      WAIVED} are skipped entirely by compliance runs (their stored day counts freeze at closure).
    constants:
      STATUTORY_EVAL_DAYS: 60
      AT_RISK_WINDOW_DAYS: 10
      EXCLUSION_CAP_PCT: 0.30
    precision: "integer days; no fractional days exist because every input is a calendar date"

  - name: exclusion_day_credit
    trigger: "POST /psych-services/timeline-exclusions/{exclusion_id}/decision with decision=APPROVE (and at claim time for days_claimed)"
    algorithm: interval_merge
    formula: |
      days_claimed  = (end_date - start_date) in days + 1            # inclusive both ends
      window        = [clock_start_date, base_due_date]              # step-1 base window, closed both ends
      overlap_start = max(start_date, clock_start_date)
      overlap_end   = min(end_date, base_due_date)
      overlap_days  = 0 if overlap_end < overlap_start else (overlap_end - overlap_start) + 1
      days_credited = min(overlap_days, PER_TYPE_CAP_DAYS[exclusion_type])
      # days_credited == 0 is rejected at approval time with ERR_EXCLUSION_ZERO_DAYS (§1.4 priority 21).
      # Overlapping exclusion claims are NOT merged: each APPROVED claim is credited on its own and the
      # aggregate cap in evaluation_timeline_clock step 3 is the only ceiling.
    input_set: "One TimelineExclusion at a time; the Evaluation supplies clock_start_date and base_due_date"
    constants:
      PER_TYPE_CAP_DAYS:
        BREAK_CLOSURE: 14
        PARENT_UNAVAILABLE: 10
        STUDENT_ABSENT_STREAK: 7
        TRANSFER_IN_TRANSIT: 5
    precision: "integer days"

  - name: evaluation_caseload_points
    trigger: "On Evaluation creation; the value is immutable afterwards (domains and referral_type are copied at creation)"
    algorithm: weighted_scoring
    formula: |
      caseload_points = BASE_POINTS
                      + (len(evaluation_domains) - 1) * EXTRA_DOMAIN_POINTS
                      + (INTERPRETER_POINTS if interpreter_required else 0)
                      + (INITIAL_TYPE_POINTS if referral_type == "INITIAL" else REEVAL_TYPE_POINTS)
    input_set: "Fields of the single Evaluation being created"
    constants:
      BASE_POINTS: 3
      EXTRA_DOMAIN_POINTS: 1
      INTERPRETER_POINTS: 2
      INITIAL_TYPE_POINTS: 2
      REEVAL_TYPE_POINTS: 1
    precision: "integer points"

  - name: psychologist_open_case_points
    trigger: >-
      On every transition that changes an Evaluation's psychologist_id or moves assessment_status into or out
      of {ASSIGNED, IN_TESTING, SCORED, REPORT_DRAFTED} — i.e. assign, report-review APPROVE, psychologist
      leave, and the consent-withdrawal cascade.
    algorithm: aggregation
    formula: |
      open_case_points = sum( e.caseload_points
                              for e in Evaluation
                              where e.psychologist_id == psychologist.id
                                and e.assessment_status IN {ASSIGNED, IN_TESTING, SCORED, REPORT_DRAFTED} )
      caseload_status  = "BALANCED" if open_case_points <  weekly_capacity_points
                    else "AT_CAP"   if open_case_points == weekly_capacity_points
                    else "OVER_CAP"
    input_set: >-
      Source entity Evaluation, filtered to the four open assessment statuses listed above; REPORT_FINAL and
      CANCELLED evaluations are excluded regardless of compliance_status. No time window applies (the whole
      table is swept). The sum is order-insensitive, so no tie-break is required; when two psychologists must
      be compared the comparison lives in psychologist_assignment_rank_score.
    constants: {}
    precision: "integer points; full recompute (never incremental) so cascades cannot drift"

  - name: caseload_pressure_index
    trigger: "Same triggers as psychologist_open_case_points, plus every compliance_status change on an Evaluation assigned to the psychologist"
    algorithm: weighted_scoring
    formula: |
      # Both variants sweep the SAME evaluation set as psychologist_open_case_points.
      urgency_weight(e) = BREACHED_WEIGHT if e.compliance_status == "BREACHED"
                     else AT_RISK_WEIGHT  if e.compliance_status == "AT_RISK"
                     else ON_TRACK_WEIGHT
      pressure_index_assigned_basis  = round_half_up( open_case_points / weekly_capacity_points, 2 )
      pressure_index_clock_weighted  = round_half_up( sum(e.caseload_points * urgency_weight(e))
                                                      / weekly_capacity_points, 2 )
      # Both are stored on Psychologist. They diverge whenever any open evaluation is AT_RISK or BREACHED.
    input_set: "Evaluations with psychologist_id == this and assessment_status IN {ASSIGNED, IN_TESTING, SCORED, REPORT_DRAFTED}"
    constants:
      ON_TRACK_WEIGHT: 1.0
      AT_RISK_WEIGHT: 1.5
      BREACHED_WEIGHT: 2.0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: ASSIGNED_BASIS
        when: "Reported on Psychologist.pressure_index_assigned_basis; the district's headcount-planning view"
        difference: "Every open evaluation weighs its raw caseload_points; timeline posture is ignored entirely"
      - name: CLOCK_WEIGHTED_BASIS
        when: "Reported on Psychologist.pressure_index_clock_weighted AND consumed by psychologist_assignment_rank_score"
        difference: >-
          Each open evaluation's points are multiplied by its compliance urgency weight (1.0 / 1.5 / 2.0), so a
          psychologist carrying one breached case can rank as more loaded than a colleague carrying more raw
          points. This is the variant that decides selection.

  - name: psychologist_assignment_rank_score
    trigger: "POST /psych-services/evaluations/{evaluation_id}/assign when psychologist_id is omitted"
    algorithm: weighted_scoring
    formula: |
      # (a) eligibility filter — candidate pool (every clause over declared fields, no fuzzy adjectives):
      candidates = [ p for p in Psychologist
                     where p.status == "ACTIVE"
                       and Referral(evaluation.referral_id).school_id IN p.assigned_school_ids
                       and ( Referral.bilingual_evaluation_required == false
                             or Referral.primary_language IN p.languages_certified )
                       and ( p.credential_type IN {"SSP", "PHD"}
                             or evaluation.referral_type == "REEVALUATION" )      # INTERN scope
                       and ( p.open_case_points + evaluation.caseload_points ) <= p.weekly_capacity_points ]
      # (b) ranking expression — LOWER is better; three inputs interacting non-linearly:
      breached_open_count(p)    = count(e for e in open evaluations of p where e.compliance_status == "BREACHED")
      same_school_open_count(p) = count(e for e in open evaluations of p
                                        where Referral(e.referral_id).school_id == Referral(evaluation.referral_id).school_id)
      rank_score(p) = round_half_up( p.pressure_index_clock_weighted
                                     + BREACH_PENALTY * max(0, breached_open_count(p) - 1)
                                     - CONTINUITY_BONUS * min(CONTINUITY_CAP, same_school_open_count(p)), 2 )
      # (c) tie-breaks, applied in order: rank_score ASC, then p.open_case_points ASC, then p.created_at ASC.
      #     Psychologist.id is NEVER a decision input.
      # (d) empty candidate pool -> ERR_NO_ELIGIBLE_PSYCHOLOGIST (409); the Evaluation stays PENDING_ASSIGNMENT
      #     and its version is NOT incremented.
    input_set: >-
      All Psychologist rows pass through filter (a); "open evaluations of p" means assessment_status IN
      {ASSIGNED, IN_TESTING, SCORED, REPORT_DRAFTED} with psychologist_id == p.id.
    constants:
      BREACH_PENALTY: 0.25
      CONTINUITY_BONUS: 0.10
      CONTINUITY_CAP: 2
    precision: "2 decimal places, round_half_up, on the rank score only"

  - name: compensatory_minutes
    trigger: "TimelineBreach creation (both variants frozen at detection) and POST /psych-services/timeline-breaches/{breach_id}/propose-remedy (award computed from the chosen basis)"
    algorithm: threshold
    formula: |
      severity = "MINOR"    if breach_days <= MINOR_MAX_DAYS
            else "MODERATE" if breach_days <= MODERATE_MAX_DAYS
            else "SEVERE"
      multiplier = SEVERITY_MULTIPLIER[severity]
      round5(x) = round_half_up(x / 5) * 5            # nearest 5 minutes, halves go up
      minutes_breach_day_basis     = round5( breach_days * DAILY_SERVICE_MINUTES * multiplier )
      minutes_missed_service_basis = round5( ceil(breach_days / 7) * WEEKLY_SERVICE_MINUTES * multiplier )
      remedy_minutes_awarded       = ( minutes_breach_day_basis if remedy_basis == "BREACH_DAY_BASIS"
                                       else minutes_missed_service_basis ) + additional_minutes
      # remedy_minutes_awarded > REMEDY_MINUTES_CAP -> ERR_REMEDY_MINUTES_EXCEED_CAP (§1.4 priority 31);
      # the value is never silently clamped.
    input_set: "The single TimelineBreach; breach_days is frozen at detection and never recomputed by later clock movement"
    constants:
      MINOR_MAX_DAYS: 5
      MODERATE_MAX_DAYS: 15
      SEVERITY_MULTIPLIER: { MINOR: 1.0, MODERATE: 1.25, SEVERE: 1.5 }
      DAILY_SERVICE_MINUTES: 30
      WEEKLY_SERVICE_MINUTES: 150
      REMEDY_MINUTES_CAP: 1800
    precision: "whole minutes, rounded to the nearest 5 with round_half_up"
    variants:
      - name: BREACH_DAY_BASIS
        when: "remedy_basis == BREACH_DAY_BASIS at proposal time"
        difference: "Charges the district one DAILY_SERVICE_MINUTES block per breached calendar day, then applies the severity multiplier"
      - name: MISSED_SERVICE_BASIS
        when: "remedy_basis == MISSED_SERVICE_BASIS at proposal time"
        difference: >-
          Charges whole missed service weeks — ceil(breach_days / 7) * WEEKLY_SERVICE_MINUTES — then applies the
          same multiplier. For breach_days == 8 / MODERATE this yields 375 minutes against the day basis's 300:
          the two bases are never reconciled, the proposal picks one and the award is final.

  - name: protocol_order_total_cost
    trigger: "POST /psych-services/protocol-orders"
    algorithm: tiered_pricing
    formula: |
      # Rounding order is PINNED. Each component is rounded HALF_UP to whole cents INDEPENDENTLY and only
      # then summed. Applying the percentages to a running total and rounding once at the end is WRONG and
      # produces a different total (e.g. 1799 c/unit, qty 30, rush: 52039 pinned vs 52041 sum-then-round).
      tier_multiplier = 1.00 if quantity_requested < TIER1_MIN_QTY
                   else 0.95 if quantity_requested < TIER2_MIN_QTY
                   else 0.90
      unit_price_cents       = round_half_up( instrument.protocol_unit_cost_cents * tier_multiplier )   # round 1
      base_cents             = unit_price_cents * quantity_requested                                   # exact
      contract_discount_cents = round_half_up( base_cents * DISTRICT_CONTRACT_DISCOUNT_PCT )            # round 2
      rush_surcharge_cents    = round_half_up( base_cents * RUSH_SURCHARGE_PCT ) if rush_flag else 0    # round 3
      handling_fee_cents      = SMALL_ORDER_HANDLING_FEE_CENTS if quantity_requested < TIER1_MIN_QTY else 0
      total_cost_cents        = base_cents - contract_discount_cents + rush_surcharge_cents + handling_fee_cents
      auto_approved           = total_cost_cents <= AUTO_APPROVE_THRESHOLD_CENTS          # inclusive boundary
      status                  = "APPROVED" if auto_approved else "SUBMITTED"
    input_set: "The single ProtocolOrder plus its AssessmentInstrument's protocol_unit_cost_cents"
    constants:
      TIER1_MIN_QTY: 25
      TIER2_MIN_QTY: 100
      DISTRICT_CONTRACT_DISCOUNT_PCT: 0.07
      RUSH_SURCHARGE_PCT: 0.085
      SMALL_ORDER_HANDLING_FEE_CENTS: 1250
      AUTO_APPROVE_THRESHOLD_CENTS: 40000
    precision: "integer cents; three independent round_half_up steps in the order above"

  - name: license_seat_conservation
    trigger: "Invariant re-derived after every ScoringLicenseSeat creation and every seat release"
    algorithm: aggregation
    formula: |
      license_seats_free(instrument) = instrument.license_seat_total
                                     - count( s for s in ScoringLicenseSeat
                                              where s.instrument_id == instrument.id and s.status == "ASSIGNED" )
      # INVARIANT (must hold after every request, including cascades):
      #   instrument.license_seat_total
      #     == count(seats with status == ASSIGNED) + instrument.license_seats_free
      # Forward action  : POST .../license-seats            -> seats_free - 1
      # Compensating    : POST .../license-seats/{id}/release -> seats_free + 1
      # A seat is never deleted, so the ASSIGNED + RELEASED population only grows; only ASSIGNED seats occupy.
    input_set: "ScoringLicenseSeat rows of one AssessmentInstrument, filtered to status == ASSIGNED"
    constants: {}
    precision: "integer seats"

  - name: caseload_points_conservation
    trigger: "Invariant re-derived after every assign (including reassignment), report-review APPROVE, psychologist leave and consent withdrawal"
    algorithm: aggregation
    formula: |
      district_open_points = sum( p.open_case_points for p in Psychologist )
      # INVARIANT (must hold after every request, including cascades):
      #   district_open_points
      #     == sum( e.caseload_points for e in Evaluation
      #             where e.psychologist_id != null
      #               and e.assessment_status IN {ASSIGNED, IN_TESTING, SCORED, REPORT_DRAFTED} )
      # Forward action : assign evaluation E to psychologist A  -> A.open_case_points + E.caseload_points
      # Compensating   : reassign E to psychologist B           -> A loses exactly E.caseload_points and B
      #                                                            gains exactly the same, so
      #                                                            district_open_points is unchanged.
      # Leave/withdrawal remove the points from BOTH sides of the identity simultaneously.
    input_set: "All Psychologist rows and all Evaluation rows in the four open assessment statuses"
    constants: {}
    precision: "integer points"

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The role in X-User-Role appears in the called endpoint's §1.5 roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: >-
      Request body shape: every required field present; enums within their declared value sets; integers
      non-negative where constrained; end instants strictly after start instants (session_end_at >
      session_start_at, scheduled_end_at > scheduled_start_at); end_date >= start_date on exclusions;
      requested_domains a non-empty duplicate-free subset of the four domains; prior_evaluation_id present
      exactly when referral_type == REEVALUATION
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"

  - priority: 4
    category: existence
    check: "Every id in the path resolves, validated left to right (instrument before seat, breach before remedy action)"
    error_id: "ERR_SCHOOL_NOT_FOUND | ERR_PSYCHOLOGIST_NOT_FOUND | ERR_REFERRAL_NOT_FOUND | ERR_EVALUATION_NOT_FOUND | ERR_INSTRUMENT_NOT_FOUND | ERR_SEAT_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_EXCLUSION_NOT_FOUND | ERR_MEETING_NOT_FOUND | ERR_BREACH_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 5
    category: existence
    check: >-
      Every FK supplied in the body resolves: Referral.school_id, Referral.prior_evaluation_id,
      Psychologist.assigned_school_ids elements, ProtocolOrder.instrument_id, ScoringLicenseSeat.psychologist_id,
      TimelineExclusion.evaluation_id, InterpreterSession.evaluation_id, EligibilityMeeting.evaluation_id and
      school_id, assign's psychologist_id, testing-start's instrument_id
    error_id: "ERR_SCHOOL_NOT_FOUND | ERR_PSYCHOLOGIST_NOT_FOUND | ERR_EVALUATION_NOT_FOUND | ERR_INSTRUMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints carrying FK fields"

  - priority: 6
    category: auth
    check: >-
      Ownership for entity_backed roles: when X-User-Role == SchoolPsychologist, X-User-ID MUST equal
      Evaluation.psychologist_id on testing-start, scores and report-draft, and MUST equal
      Evaluation.psychologist_id on POST /psych-services/timeline-exclusions. report-review deliberately
      does NOT require ownership (a peer reviews it).
    error_id: ERR_PSYCH_NOT_OWNER
    http_status: 403
    applies_to: "POST /evaluations/{id}/testing-start, /scores, /report-draft, POST /timeline-exclusions"

  - priority: 7
    category: state
    check: "expected_evaluation_version equals the Evaluation's current version (§1.2.1)"
    error_id: ERR_STALE_EVALUATION_VERSION
    http_status: 412
    applies_to: "POST /evaluations/{id}/assign, POST /eligibility-meetings"

  - priority: 8
    category: state
    check: >-
      The target entity is in a state the requested transition allows: Evaluation.assessment_status for
      assign / testing-start / scores / report-draft / report-review; Referral.status for consent events;
      TimelineExclusion.status == CLAIMED for decision; ProtocolOrder.status for decision / receive;
      EligibilityMeeting.status for notice / reschedule-request / hold; TimelineBreach.status for
      propose-remedy / approve-remedy; ScoringLicenseSeat.status == ASSIGNED for release; Psychologist.status
      == ACTIVE for leave
    error_id: "ERR_EVALUATION_STATE_INVALID | ERR_REFERRAL_STATE_INVALID | ERR_EXCLUSION_ALREADY_DECIDED | ERR_ORDER_STATE_INVALID | ERR_MEETING_STATE_INVALID | ERR_BREACH_STATE_INVALID | ERR_SEAT_STATE_INVALID | ERR_PSYCHOLOGIST_STATE_INVALID"
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 9
    category: state
    check: >-
      Cross-entity consent gate: the Evaluation's Referral.status IN {CONSENTED, CONSENT_WAIVED} before any
      evaluation work (assign, testing-start, scores, report-draft, report-review) or any exclusion claim is
      accepted
    error_id: ERR_CONSENT_NOT_ON_FILE
    http_status: 409
    applies_to: "POST /evaluations/{id}/assign, /testing-start, /scores, /report-draft, /report-review, POST /timeline-exclusions"

  - priority: 10
    category: state
    check: "Cross-entity report gate: EligibilityMeeting may only be held when its Evaluation.assessment_status == REPORT_FINAL"
    error_id: ERR_REPORT_NOT_FINAL
    http_status: 409
    applies_to: "POST /eligibility-meetings/{meeting_id}/hold"

  - priority: 11
    category: business_safety
    check: "Segregation of duties: the reviewing X-User-ID MUST differ from Evaluation.report_drafted_by_psychologist_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /evaluations/{evaluation_id}/report-review"

  - priority: 12
    category: business_safety
    check: >-
      Scoring-software licensing: AssessmentInstrument.license_status == ACTIVE (current clock date <=
      license_expires_on) AND a ScoringLicenseSeat with status == ASSIGNED exists for (instrument_id,
      X-User-ID)
    error_id: ERR_SCORING_LICENSE_INVALID
    http_status: 422
    applies_to: "POST /evaluations/{evaluation_id}/testing-start"

  - priority: 13
    category: business_safety
    check: >-
      Parent notice requirement: (scheduled_start_at UTC date - current clock UTC date) in days >=
      PARENT_NOTICE_LEAD_DAYS (10). Exactly 10 passes; 9 fails.
    error_id: ERR_NOTICE_LEAD_INSUFFICIENT
    http_status: 422
    applies_to: "POST /eligibility-meetings/{meeting_id}/notice"

  - priority: 14
    category: business_referential
    check: "Building coverage: Referral.school_id of the evaluation's referral MUST appear in the target Psychologist.assigned_school_ids"
    error_id: ERR_PSYCH_BUILDING_MISMATCH
    http_status: 422
    applies_to: "POST /evaluations/{evaluation_id}/assign (explicit psychologist_id only)"

  - priority: 15
    category: business_referential
    check: >-
      Bilingual coverage: when Referral.bilingual_evaluation_required == true, Referral.primary_language MUST
      appear in the target Psychologist.languages_certified
    error_id: ERR_LANGUAGE_CERT_MISSING
    http_status: 422
    applies_to: "POST /evaluations/{evaluation_id}/assign (explicit psychologist_id only)"

  - priority: 16
    category: business_referential
    check: "Credential scope: a Psychologist with credential_type == INTERN may only take Evaluations whose referral_type == REEVALUATION"
    error_id: ERR_INTERN_SCOPE_VIOLATION
    http_status: 422
    applies_to: "POST /evaluations/{evaluation_id}/assign (explicit psychologist_id only)"

  - priority: 17
    category: business_referential
    check: >-
      Interpreter support: when Evaluation.interpreter_required == true, at least one InterpreterSession of
      that Evaluation with status IN {SCHEDULED, COMPLETED} MUST exist before testing may start
    error_id: ERR_INTERPRETER_SESSION_MISSING
    http_status: 409
    applies_to: "POST /evaluations/{evaluation_id}/testing-start"

  - priority: 18
    category: business_temporal
    check: >-
      Psychologist calendar, HALF-OPEN interval semantics with a travel buffer. Let P = the psychologist of the
      new session's Evaluation and S = Referral(evaluation.referral_id).school_id. For every other
      InterpreterSession X with status IN {SCHEDULED, COMPLETED} whose evaluation's psychologist_id == P:
      buffer = 0 minutes when X's building equals S, else TRAVEL_BUFFER_MINUTES (15). Reject when
      [new.session_start_at - buffer, new.session_end_at + buffer) intersects [X.session_start_at,
      X.session_end_at). Touching endpoints inside the same building (prev.end == new.start) do NOT conflict.
    error_id: ERR_PSYCH_CALENDAR_CONFLICT
    http_status: 409
    applies_to: "POST /psych-services/interpreter-sessions"

  - priority: 19
    category: business_temporal
    check: >-
      School meeting capacity, CLOSED interval semantics with aggregate capacity. Count EligibilityMeetings OTHER
      THAN the one being written at the same school_id with status IN {PROPOSED, NOTICED,
      RESCHEDULE_REQUESTED, HELD} whose closed interval
      [scheduled_start_at, scheduled_end_at] intersects the requested closed interval — touching endpoints DO
      conflict. Reject when that count >= School.concurrent_meeting_capacity.
    error_id: ERR_SCHOOL_MEETING_CAPACITY_FULL
    http_status: 409
    applies_to: "POST /psych-services/eligibility-meetings, POST /eligibility-meetings/{meeting_id}/reschedule-request"

  - priority: 20
    category: business_temporal
    check: "Consent timestamps: effective_at MUST be <= the current logical clock instant (no back-dating into the future)"
    error_id: ERR_CONSENT_TIMESTAMP_FUTURE
    http_status: 422
    applies_to: "POST /psych-services/referrals/{referral_id}/consent-events"

  - priority: 21
    category: business_temporal
    check: "Exclusion credit: calculations.exclusion_day_credit MUST yield days_credited >= 1 for an APPROVE decision"
    error_id: ERR_EXCLUSION_ZERO_DAYS
    http_status: 422
    applies_to: "POST /psych-services/timeline-exclusions/{exclusion_id}/decision (decision=APPROVE only)"

  - priority: 22
    category: business_temporal
    check: "A meeting may only be recorded as held once the current clock instant is >= scheduled_start_at"
    error_id: ERR_MEETING_NOT_DUE
    http_status: 409
    applies_to: "POST /eligibility-meetings/{meeting_id}/hold"

  - priority: 23
    category: business_constraint
    check: "Reschedule ceiling: reschedule_count < MAX_RESCHEDULES (2) before a reschedule request is accepted"
    error_id: ERR_RESCHEDULE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /eligibility-meetings/{meeting_id}/reschedule-request"

  - priority: 24
    category: business_constraint
    check: "Consent-to-waive documentation: event_type == CONSENT_WAIVED is only accepted when Referral.referral_type == REEVALUATION and waiver_reason is a non-empty string"
    error_id: ERR_WAIVER_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /psych-services/referrals/{referral_id}/consent-events"

  - priority: 25
    category: business_constraint
    check: "School.building_code is unique across all Schools (case-sensitive exact match)"
    error_id: ERR_DUPLICATE_BUILDING_CODE
    http_status: 409
    applies_to: "POST /psych-services/schools"

  - priority: 26
    category: business_constraint
    check: "Licence seats: AssessmentInstrument.license_seats_free >= 1, and no ScoringLicenseSeat with status == ASSIGNED already exists for (instrument_id, psychologist_id)"
    error_id: ERR_LICENSE_SEATS_EXHAUSTED
    http_status: 409
    applies_to: "POST /psych-services/assessment-instruments/{instrument_id}/license-seats"

  - priority: 27
    category: business_constraint
    check: >-
      Caseload ceiling on explicit assignment: target.open_case_points + evaluation.caseload_points <=
      target.weekly_capacity_points. Landing exactly on the ceiling is allowed (caseload_status becomes
      AT_CAP); exceeding it by one point is rejected.
    error_id: ERR_PSYCH_CASELOAD_OVER_CAP
    http_status: 409
    applies_to: "POST /evaluations/{evaluation_id}/assign (explicit psychologist_id only)"

  - priority: 28
    category: business_constraint
    check: "Selector fallback: psychologist_assignment_rank_score's candidate pool is non-empty when psychologist_id is omitted"
    error_id: ERR_NO_ELIGIBLE_PSYCHOLOGIST
    http_status: 409
    applies_to: "POST /evaluations/{evaluation_id}/assign (selector mode only)"

  - priority: 29
    category: business_fiscal
    check: >-
      Protocol inventory: AssessmentInstrument.protocol_stock_count >= protocol_units_per_administration *
      len(evaluation_domains). Exact equality passes and drives stock to 0.
    error_id: ERR_PROTOCOL_STOCK_INSUFFICIENT
    http_status: 409
    applies_to: "POST /evaluations/{evaluation_id}/testing-start"

  - priority: 30
    category: business_fiscal
    check: "Receipt reconciliation: received_quantity >= 1 and <= ProtocolOrder.quantity_requested"
    error_id: ERR_RECEIPT_QUANTITY_EXCEEDS_ORDER
    http_status: 422
    applies_to: "POST /psych-services/protocol-orders/{order_id}/receive"

  - priority: 31
    category: business_fiscal
    check: "Compensatory award ceiling: basis minutes + additional_minutes <= REMEDY_MINUTES_CAP (1800)"
    error_id: ERR_REMEDY_MINUTES_EXCEED_CAP
    http_status: 422
    applies_to: "POST /psych-services/timeline-breaches/{breach_id}/propose-remedy"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------------------------------------------------------------- reference data
  - method: POST
    path: "/psych-services/schools"
    description: "Register a district building that hosts evaluations and eligibility meetings."
    roles: [DistrictAdmin]
    code: 201
    input: ["name", "building_code", "grade_band", "concurrent_meeting_capacity?", "enrollment_count?"]
    output: School
    side_effects:
      - "enforces building_code uniqueness (ERR_DUPLICATE_BUILDING_CODE)"

  - method: POST
    path: "/psych-services/psychologists"
    description: "Register a school psychologist with credential, language certifications and building coverage."
    roles: [DistrictAdmin]
    code: 201
    input: ["full_name", "employee_number", "credential_type", "languages_certified?", "assigned_school_ids", "weekly_capacity_points?"]
    output: Psychologist
    side_effects:
      - "validates every element of assigned_school_ids against School.id"
      - "initialises status = ACTIVE, open_case_points = 0, caseload_status = BALANCED, both pressure_index fields = 0.00"

  - method: POST
    path: "/psych-services/psychologists/{psychologist_id}/leave"
    description: "Place a psychologist on leave; runs the four-level unassignment cascade of §1.2 Psychologist."
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: Psychologist
    side_effects:
      - "status -> ON_LEAVE"
      - "every open Evaluation of this psychologist -> PENDING_ASSIGNMENT, psychologist_id cleared, reassignment_count incremented, Evaluation.version incremented"
      - "every SCHEDULED InterpreterSession of those Evaluations -> CANCELLED with cancellation_reason = PSYCHOLOGIST_UNAVAILABLE"
      - "reruns calculations.psychologist_open_case_points and calculations.caseload_pressure_index for this psychologist"

  - method: POST
    path: "/psych-services/assessment-instruments"
    description: "Add an assessment instrument with protocol inventory, unit price and scoring-software licence."
    roles: [DistrictAdmin]
    code: 201
    input: ["name", "instrument_code", "protocol_stock_count?", "protocol_units_per_administration?", "protocol_unit_cost_cents", "license_seat_total?", "license_expires_on", "supported_language_editions?"]
    output: AssessmentInstrument
    side_effects:
      - "derives license_seats_free = license_seat_total and license_status from the current clock date"

  - method: POST
    path: "/psych-services/assessment-instruments/{instrument_id}/license-seats"
    description: "Assign one scoring-software seat of this instrument to a psychologist."
    roles: [DistrictAdmin, PsychServicesSupervisor]
    code: 201
    input: ["psychologist_id"]
    output: ScoringLicenseSeat
    side_effects:
      - "decrements AssessmentInstrument.license_seats_free by 1 (calculations.license_seat_conservation)"
      - "rejects when license_seats_free == 0 or the psychologist already holds an ASSIGNED seat for this instrument"

  - method: POST
    path: "/psych-services/assessment-instruments/{instrument_id}/license-seats/{seat_id}/release"
    description: "Release a scoring-software seat back to the district pool."
    roles: [PsychServicesSupervisor, DistrictAdmin]
    code: 200
    input: []
    output: ScoringLicenseSeat
    side_effects:
      - "status -> RELEASED, sets released_at"
      - "increments AssessmentInstrument.license_seats_free by 1 (calculations.license_seat_conservation)"

  - method: POST
    path: "/psych-services/protocol-orders"
    description: "Order protocol booklets; prices the order via calculations.protocol_order_total_cost and auto-approves small orders."
    roles: [PsychServicesSupervisor, DistrictAdmin]
    code: 201
    input: ["instrument_id", "quantity_requested", "rush_flag?"]
    output: ProtocolOrder
    side_effects:
      - "computes unit_price_cents, base_cents, contract_discount_cents, rush_surcharge_cents, handling_fee_cents, total_cost_cents"
      - "sets auto_approved = true and status -> APPROVED when total_cost_cents <= AUTO_APPROVE_THRESHOLD_CENTS (inclusive), otherwise leaves status = SUBMITTED"
      - "does NOT touch AssessmentInstrument.protocol_stock_count (stock moves only on receipt)"

  - method: POST
    path: "/psych-services/protocol-orders/{order_id}/decision"
    description: "Approve or cancel a SUBMITTED protocol order (decision = APPROVE | CANCEL)."
    roles: [DistrictAdmin]
    code: 200
    input: ["decision"]
    output: ProtocolOrder
    side_effects:
      - "status -> APPROVED or CANCELLED; records decided_by_user_id = X-User-ID"

  - method: POST
    path: "/psych-services/protocol-orders/{order_id}/receive"
    description: "Record receipt of an APPROVED protocol order and credit protocol stock."
    roles: [PsychServicesSupervisor, DistrictAdmin]
    code: 200
    input: ["received_quantity"]
    output: ProtocolOrder
    side_effects:
      - "status -> RECEIVED, sets received_quantity"
      - "increments AssessmentInstrument.protocol_stock_count by received_quantity"

  # ---------------------------------------------------------------- referral intake and consent
  - method: POST
    path: "/psych-services/referrals"
    description: "Intake a referral raised by a building intervention team; the statutory clock does not start until a consent event arrives."
    roles: [IntakeCoordinator]
    code: 201
    input: ["school_id", "student_local_id", "referral_type", "prior_evaluation_id?", "primary_language?", "interpreter_required?", "bilingual_evaluation_required?", "requested_domains", "intervention_team_summary?"]
    output: Referral
    side_effects:
      - "status = INTAKE_RECEIVED; consent_received_at and active_evaluation_id stay null"
      - "requires prior_evaluation_id exactly when referral_type == REEVALUATION"

  - method: POST
    path: "/psych-services/referrals/{referral_id}/consent-events"
    description: >-
      Record a polymorphic consent event (event_type = CONSENT_RECEIVED | CONSENT_WAIVED | CONSENT_WITHDRAWN).
      CONSENT_RECEIVED / CONSENT_WAIVED start the statutory clock and create the Evaluation; CONSENT_WITHDRAWN
      runs the withdrawal cascade.
    roles: [IntakeCoordinator]
    code: 200
    input: ["event_type", "effective_at", "parent_signature_reference?", "waiver_reason?"]
    output: Referral
    side_effects:
      - "sets last_consent_event_type; CONSENT_RECEIVED/CONSENT_WAIVED set consent_received_at = effective_at and status -> CONSENTED / CONSENT_WAIVED"
      - "CONSENT_RECEIVED/CONSENT_WAIVED create the Evaluation (assessment_status = PENDING_ASSIGNMENT, compliance_status = ON_TRACK, clock_start_date = effective_at's UTC date, domains/interpreter_required/referral_type copied from the Referral) and set active_evaluation_id to it"
      - "CONSENT_WAIVED requires referral_type == REEVALUATION and a non-empty waiver_reason, and sets Evaluation.compliance_status = ON_TRACK with the same clock"
      - "CONSENT_WITHDRAWN sets status -> CONSENT_WITHDRAWN and cascades: Evaluation -> CANCELLED and compliance_status -> WAIVED, SCHEDULED InterpreterSessions -> CANCELLED (CONSENT_WITHDRAWN), non-terminal EligibilityMeetings -> CANCELLED, non-terminal TimelineBreaches -> VACATED"
      - "runs calculations.evaluation_timeline_clock for the new Evaluation"

  # ---------------------------------------------------------------- evaluation workflow
  - method: POST
    path: "/psych-services/evaluations/{evaluation_id}/assign"
    description: >-
      Assign or reassign the evaluator. When psychologist_id is omitted the server picks the winner via
      calculations.psychologist_assignment_rank_score; when supplied, all eligibility validations apply to
      that explicit target. OCC-guarded on Evaluation.version.
    roles: [PsychServicesSupervisor]
    code: 200
    input: ["expected_evaluation_version", "psychologist_id?"]
    output: Evaluation
    side_effects:
      - "assessment_status PENDING_ASSIGNMENT -> ASSIGNED, or ASSIGNED -> ASSIGNED when a reassignment supersedes the prior assignment (reassignment_count incremented)"
      - "sets psychologist_id; increments Evaluation.version by 1"
      - "reruns calculations.psychologist_open_case_points and calculations.caseload_pressure_index for the new (and, on reassignment, the previous) psychologist"

  - method: POST
    path: "/psych-services/evaluations/{evaluation_id}/testing-start"
    description: "Begin testing with a specific instrument; consumes protocol booklets and requires a valid scoring-software seat."
    roles: [SchoolPsychologist]
    code: 200
    input: ["instrument_id"]
    output: Evaluation
    side_effects:
      - "assessment_status ASSIGNED -> IN_TESTING; sets testing_instrument_id"
      - "sets protocol_units_consumed = protocol_units_per_administration * len(evaluation_domains) and debits AssessmentInstrument.protocol_stock_count by that amount"
      - "requires an ASSIGNED ScoringLicenseSeat for (instrument_id, X-User-ID) on an instrument whose license_status == ACTIVE"
      - "requires a SCHEDULED or COMPLETED InterpreterSession when Evaluation.interpreter_required"

  - method: POST
    path: "/psych-services/evaluations/{evaluation_id}/scores"
    description: "Record the scored protocol summary for an evaluation under test."
    roles: [SchoolPsychologist]
    code: 200
    input: ["score_summary"]
    output: Evaluation
    side_effects:
      - "assessment_status IN_TESTING -> SCORED; sets score_summary"

  - method: POST
    path: "/psych-services/evaluations/{evaluation_id}/report-draft"
    description: "Submit the evaluation report draft; records the drafting author for the segregation-of-duties check."
    roles: [SchoolPsychologist]
    code: 200
    input: ["report_narrative"]
    output: Evaluation
    side_effects:
      - "assessment_status SCORED -> REPORT_DRAFTED; sets report_narrative and report_drafted_by_psychologist_id = X-User-ID"

  - method: POST
    path: "/psych-services/evaluations/{evaluation_id}/report-review"
    description: "Peer-review the draft (decision = APPROVE | RETURN). APPROVE finalises the report; RETURN sends it back for rescoring."
    roles: [SchoolPsychologist, PsychServicesSupervisor]
    code: 200
    input: ["decision"]
    output: Evaluation
    side_effects:
      - "decision=APPROVE: assessment_status REPORT_DRAFTED -> REPORT_FINAL"
      - "decision=RETURN: assessment_status REPORT_DRAFTED -> SCORED, clears report_narrative and report_drafted_by_psychologist_id (cycle)"
      - "the reviewing X-User-ID must differ from report_drafted_by_psychologist_id"

  # ---------------------------------------------------------------- timeline exclusions
  - method: POST
    path: "/psych-services/timeline-exclusions"
    description: "Claim a permissible exclusion window against an evaluation's statutory clock."
    roles: [SchoolPsychologist]
    code: 201
    input: ["evaluation_id", "exclusion_type", "start_date", "end_date", "claim_note?"]
    output: TimelineExclusion
    side_effects:
      - "status = CLAIMED; sets days_claimed from the inclusive calendar span; days_credited stays 0"
      - "the acting psychologist must be the Evaluation's psychologist_id and the Referral must hold consent"

  - method: POST
    path: "/psych-services/timeline-exclusions/{exclusion_id}/decision"
    description: "Approve or reject an exclusion claim (decision = APPROVE | REJECT); approval re-runs the timeline cascade."
    roles: [PsychServicesSupervisor]
    code: 200
    input: ["decision"]
    output: TimelineExclusion
    side_effects:
      - "status -> APPROVED or REJECTED; sets decided_by_user_id and decided_at"
      - "APPROVE sets days_credited via calculations.exclusion_day_credit (rejected with ERR_EXCLUSION_ZERO_DAYS when it yields 0)"
      - "APPROVE cascades L2..L4: Evaluation clock fields recomputed, compliance_status re-derived, and any DETECTED / REMEDY_PROPOSED TimelineBreach -> VACATED when the evaluation leaves BREACHED"

  # ---------------------------------------------------------------- interpreter scheduling
  - method: POST
    path: "/psych-services/interpreter-sessions"
    description: "Book an interpreter-supported evaluation session on the assigned psychologist's calendar."
    roles: [IntakeCoordinator, PsychServicesSupervisor]
    code: 201
    input: ["evaluation_id", "language_code", "interpreter_name", "session_start_at", "session_end_at"]
    output: InterpreterSession
    side_effects:
      - "status = SCHEDULED; computes duration_minutes"
      - "runs the half-open psychologist-calendar check with a TRAVEL_BUFFER_MINUTES buffer for cross-building sessions"

  # ---------------------------------------------------------------- eligibility meetings
  - method: POST
    path: "/psych-services/eligibility-meetings"
    description: >-
      Propose an eligibility meeting for an evaluation at a hosting building. A newly created meeting
      supersedes any earlier non-terminal meeting of the same Evaluation. OCC-guarded on Evaluation.version.
    roles: [IntakeCoordinator, PsychServicesSupervisor]
    code: 201
    input: ["evaluation_id", "school_id", "scheduled_start_at", "scheduled_end_at", "expected_evaluation_version"]
    output: EligibilityMeeting
    side_effects:
      - "status = PROPOSED; reschedule_count = 0; parent_notice_sent_at and notice_lead_days null"
      - "every earlier EligibilityMeeting of the same Evaluation with status IN {PROPOSED, NOTICED, RESCHEDULE_REQUESTED} -> SUPERSEDED, freeing its capacity slot"
      - "increments Evaluation.version by 1"
      - "runs the closed-interval School capacity check against non-terminal meetings at school_id"

  - method: POST
    path: "/psych-services/eligibility-meetings/{meeting_id}/notice"
    description: "Issue (or re-issue) the statutory parent notice for a proposed or rescheduled meeting."
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: EligibilityMeeting
    side_effects:
      - "status PROPOSED | RESCHEDULE_REQUESTED -> NOTICED"
      - "sets parent_notice_sent_at = current clock instant and notice_lead_days = scheduled_start_at date - clock date"
      - "rejects with ERR_NOTICE_LEAD_INSUFFICIENT when that lead is < PARENT_NOTICE_LEAD_DAYS"

  - method: POST
    path: "/psych-services/eligibility-meetings/{meeting_id}/reschedule-request"
    description: "Move a noticed meeting to a new interval, voiding the previous parent notice."
    roles: [IntakeCoordinator]
    code: 200
    input: ["scheduled_start_at", "scheduled_end_at"]
    output: EligibilityMeeting
    side_effects:
      - "status NOTICED -> RESCHEDULE_REQUESTED; overwrites the interval; increments reschedule_count"
      - "clears parent_notice_sent_at and notice_lead_days"
      - "re-runs the closed-interval School capacity check; rejects at reschedule_count == MAX_RESCHEDULES"

  - method: POST
    path: "/psych-services/eligibility-meetings/{meeting_id}/hold"
    description: "Record that the eligibility meeting was held; closes the evaluation and the referral."
    roles: [PsychServicesSupervisor]
    code: 200
    input: []
    output: EligibilityMeeting
    side_effects:
      - "status NOTICED -> HELD; sets held_at = current clock instant"
      - "requires Evaluation.assessment_status == REPORT_FINAL and current clock >= scheduled_start_at"
      - "cascade: Evaluation.compliance_status -> COMPLIANT_CLOSED when days_remaining >= 0, then Referral.status -> COMPLETED"

  # ---------------------------------------------------------------- breach, remedy, compliance sweep
  - method: POST
    path: "/psych-services/timeline-breaches/{breach_id}/propose-remedy"
    description: "Propose compensatory services and corrective action for a detected timeline breach."
    roles: [ComplianceOfficer]
    code: 200
    input: ["remedy_basis", "additional_minutes?", "corrective_action_note"]
    output: TimelineBreach
    side_effects:
      - "status DETECTED -> REMEDY_PROPOSED; sets remedy_basis, additional_minutes, corrective_action_note, proposed_by_user_id"
      - "sets remedy_minutes_awarded = calculations.compensatory_minutes for the chosen basis + additional_minutes"
      - "rejects with ERR_REMEDY_MINUTES_EXCEED_CAP when that sum exceeds REMEDY_MINUTES_CAP"

  - method: POST
    path: "/psych-services/timeline-breaches/{breach_id}/approve-remedy"
    description: "Approve the proposed compensatory remedy, closing the breach."
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: TimelineBreach
    side_effects:
      - "status REMEDY_PROPOSED -> REMEDY_APPROVED; sets approved_by_user_id"
      - "cascade: Evaluation.compliance_status BREACHED -> BREACH_CLOSED_REMEDIED"

  - method: POST
    path: "/psych-services/compliance-runs"
    description: >-
      Run the district compliance sweep at the current logical clock: re-derives every open Evaluation's
      timeline fields and compliance_status, opens TimelineBreach records for newly breached evaluations, and
      completes InterpreterSessions whose end instant has passed.
    roles: [ComplianceOfficer, DistrictAdmin]
    code: 200
    input: []
    output: "{ run_at: datetime, evaluated_count: integer, at_risk_evaluation_ids: string[], breached_evaluation_ids: string[], breach_ids: string[], sessions_completed_count: integer }"
    side_effects:
      - "reruns calculations.evaluation_timeline_clock for every Evaluation whose compliance_status IN {ON_TRACK, AT_RISK, BREACHED}"
      - "compliance_status ON_TRACK -> AT_RISK when 0 <= days_remaining <= AT_RISK_WINDOW_DAYS, and (ON_TRACK | AT_RISK) -> BREACHED when days_remaining < 0"
      - "creates one TimelineBreach per newly BREACHED Evaluation (status DETECTED, breach_days frozen, severity and both compensatory-minutes variants computed); never creates a second breach for an Evaluation that already has a non-VACATED one"
      - "SCHEDULED InterpreterSessions whose session_end_at <= the clock -> COMPLETED"
      - "reruns calculations.caseload_pressure_index for every ACTIVE Psychologist (the CLOCK_WEIGHTED_BASIS variant depends on compliance_status)"

  - method: POST
    path: "/_clock/set_current_utc"
    description: >-
      Test-driving endpoint: set the server's logical UTC clock. Before any call the clock reads exactly
      2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time. All date arithmetic (statutory clock,
      licence expiry, notice lead, meeting due) reads this clock.
    roles: [DistrictAdmin, ComplianceOfficer, PsychServicesSupervisor, IntakeCoordinator, SchoolPsychologist]
    code: 200
    input: ["current_utc"]
    output: "{ current_utc: datetime }"
    side_effects:
