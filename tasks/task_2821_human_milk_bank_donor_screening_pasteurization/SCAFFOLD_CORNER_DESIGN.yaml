      - name: subsidy_program_exhausts_exactly_at_its_cap_and_then_behaves_two_different_ways
        claim_type: conditional_validation
        grounds:
          - validations[priority=80]
          - errors[ERR_SUBSIDY_PROGRAM_EXHAUSTED]
          - calculations.dispense_fee_allocation
          - entities.SubsidyProgram.fields.status
        distinguishing_aspect: "A 100 ml NICU fill on a 0.60 coverage program with a 288-cent cap consumes the cap exactly (uncapped subsidy 288 == headroom 288, so subsidy_capped is false) and flips the program to EXHAUSTED; the next prescription that carries subsidy_required true is refused with 402, while a prescription on the same exhausted program with subsidy_required false is filled at coverage 0 - subsidy 0 and payer_due equal to the whole 480-cent gross."
        test_recipe:
          setup:
            - "Clock 2026-08-10T10:05:00Z; donors DNR-0001..DNR-0003 each gave 1200 ml TERM at 20.0 expressed 2026-07-10, pool POOL-0001 committed at 3600 ml, run PAST-01 thermally PASSED with a 0 CFU culture by u-qa-1."
            - "1200 ml was bottled as lot 20260810-001-01 (12 x 100 ml) and u-qa-2 released it."
            - "Subsidy program SUB-0001 exists with coverage_pct 0.60 and annual_cap_cents 288, status OPEN, consumed_cents 0."
            - "Prescriptions on that program: RX-3001 (NICU_INPATIENT/CRITICAL, subsidy_required true, 200 ml), RX-3002 (NICU_INPATIENT/CRITICAL, subsidy_required true, 100 ml), RX-3003 (NICU_INPATIENT/STANDARD, subsidy_required false, 100 ml), all needed_by 2026-09-01."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
