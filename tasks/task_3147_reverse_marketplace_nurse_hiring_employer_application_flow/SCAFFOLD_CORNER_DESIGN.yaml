            - call: "POST /marketplace/_clock/set_current_utc"
              payload: { current_utc: "2026-09-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/placements/${placement_id}/terminate"
              payload: {}
              as: Employer
