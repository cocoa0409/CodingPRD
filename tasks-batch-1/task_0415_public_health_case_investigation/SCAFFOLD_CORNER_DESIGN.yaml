  # SECTION: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: contact_tracer_cannot_create_program
        claim_type: Exclusive Operation Denial
        grounds:
          - roles.JurisdictionAdmin.exclusive_operations
          - roles.ContactTracer
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
          - validations[priority=2]
        distinguishing_aspect: |
          peer_roles isolation: ContactTracer attempting POST /surveillance/programs (a
          JurisdictionAdmin-exclusive op) returns 403 ERR_INSUFFICIENT_PERMISSIONS.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /surveillance/programs"
              payload: { name: "Rogue PH" }
              as: ContactTracer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: case_investigator_cannot_request_jurisdiction_transfer
        claim_type: Exclusive Operation Denial
        grounds:
          - roles.EpiAnalyst.exclusive_operations
          - roles.CaseInvestigator
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
          - validations[priority=2]
        distinguishing_aspect: |
          peer_roles isolation across operational roles: CaseInvestigator attempting POST
          /surveillance/jurisdiction-transfers (EpiAnalyst-exclusive) returns 403
          ERR_INSUFFICIENT_PERMISSIONS — distinct from the config-role denial above.
        test_recipe:
          setup:
            - "Program P, condition COVID19, jurisdictions J1 and J2; case CI in J1 interviewed."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 2", fips_code: "06002" }
              as: JurisdictionAdmin
              captures: { j2: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1 }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
