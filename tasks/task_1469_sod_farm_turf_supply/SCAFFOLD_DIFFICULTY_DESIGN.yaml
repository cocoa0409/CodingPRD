# =============================================================================
# §1.8 Scaffold Difficulty Design — Sod Farm & Turf Supply
# Test Targeting Index: 9 rules x 2 instances = 18 instances.
# All literals precomputed by executing the §1.3 formulas against the pinned
# inputs below (PriceConfig defaults: slab 5, roll 10, pallets 100/50/20,
# rates 0.855/0.70/0.50, zones 1.20/1.80/2.60 per 500 sqft, capacity 4,
# card fee 2%, cash discount 3%, T1 6% @ turf>=2000 & pre>=4000,
# T2 15% @ turf>=8000 & pre>=15000).
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: order_total_tiered_ladder_vs_additive_flat
        grounds:
          - calculations.order_pricing_ladder
          - entities.Quote.fields.total_price
          - entities.Quote.fields.additive_total
        distinguishing_aspect: |
          Entity domain = quote/order MONEY. The authoritative tiered ladder
          (discount-then-fee) yields total_price 4633.76 while the informational
          additive-flat variant yields additive_total 5225.30 on IDENTICAL inputs
          (48 PREMIUM pallets, turf 4104.00, zone split 12/24/12, CARD) —
          divergence appears exactly when volume_tier > T0.
        test_recipe:
          setup:
            - "PriceConfig (defaults) is current; variety 'Tifway 419 Bermuda' exists; customer in freight_zone 2"
            - "Quote: delivery 2026-08-03, CARD, zones 12/24/12, one line {PREMIUM x48 pallets, no shortfall} -> turf 4104.00, freight 728.87, pre 4832.87, tier T1"
          setup_api_calls:
            - call: "POST /price-configs"
              payload: { name: "Std 2026" }
              as: FarmManager
              captures: { pc_id: $.data.id }
            - call: "POST /variety-configs"
              payload: { name: "Tifway 419 Bermuda" }
              as: FarmManager
              captures: { v_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Aria Nguyen", email: "aria@example.com", phone: "555-0101", freight_zone: 2, address: "12 Oak Ln" }
              as: SalesRep
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /quotes"
              payload:
                customer_id: "${c_id}"
                delivery_date: "2026-08-03"
                settlement_method: "CARD"
                z1_pallets: 12
                z2_pallets: 24
                z3_pallets: 12
                lines:
                  - { variety_id: "${v_id}", grade: "PREMIUM", pallet_count: 48, shortfall_slabs: 0, shortfall_rolls: 0 }
              as: SalesRep
              captures: { q_id: $.data.id }
          assert:
            - "Quote.${q_id}.turf_sqft == 4104.00"
            - "Quote.${q_id}.freight_amount == 728.87"
            - "Quote.${q_id}.pre_discount_subtotal == 4832.87"
            - "Quote.${q_id}.volume_tier == T1"
            - "Quote.${q_id}.volume_discount == 289.97"
            - "Quote.${q_id}.card_fee == 90.86"
            - "Quote.${q_id}.total_price == 4633.76"
            - "Quote.${q_id}.additive_total == 5225.30"
            - "Quote.${q_id}.additive_total != Quote.${q_id}.total_price"

      - name: delivery_window_cumulative_vs_strict
        grounds:
          - calculations.delivery_check_window
          - entities.DeliveryCheck.fields.in_window
          - entities.DeliveryCheck.fields.strict_in_window
        distinguishing_aspect: |
          Entity domain = DELIVERY COMPLIANCE (DeliveryCheck), not money. Same
          delivery history (chunks 500 + 400 sqft against baseline-derived
          threshold 855.00): the authoritative cumulative variant gives
          in_window=true while the strict per-delivery variant gives
          strict_in_window=false on the SAME check row.
        test_recipe:
          setup:
            - "Order for turf 1500.00 (lines: PREMIUM x6 pallets + STANDARD x29 pallets short 4 rolls; zones 18/17/0; CARD) is CONFIRMED with window 2026-08-03T08:00-10:00; allocated batches are the PRE 8-full (800), ST 12-full (600) and ST 20-full (1000) — selector ties break sellable_sqft ASC — all COMPLETE harvested 06:00-06:45 on 2026-08-03"
            - "First delivery accepted 500 sqft at 09:00, then check 1 (P=500 < 855 -> in_window false, flags the order), then top-up delivery accepted 400 sqft at 09:45 (delivered_sqft 900)"
            - "No payments recorded (B == 0); baseline_sqft == 1425.00; window_size == 855.00"
          setup_api_calls:
            - call: "POST /price-configs"
              payload: { name: "Std 2026" }
              as: FarmManager
            - call: "POST /variety-configs"
              payload: { name: "Tifway 419 Bermuda" }
              as: FarmManager
              captures: { v_id: $.data.id }
            - call: "POST /fields"
              payload: { name: "North 40", variety_id: "${v_id}", field_sqft: 40000, last_planted_at: "2026-05-01T00:00:00Z", mow_count: 4, last_mowed_at: "2026-07-31T06:00:00Z", soil_moisture_pct: 45, health_score: 82 }
              as: FarmManager
              captures: { f_id: $.data.id, f_v: $.data.version }
            - call: "POST /harvest-batches"
              payload: { field_id: "${f_id}", grade: "PREMIUM", pallet_count: 10, shortfall_slabs: 0, shortfall_rolls: 0, scheduled_date: "2026-08-03", expected_field_version: "${f_v}" }
              as: HarvestSupervisor
              captures: { b1_id: $.data.id }
            - call: "GET /fields/${f_id}"
              payload: {}
              as: FarmManager
              captures: { f_v2: $.data.version }
            - call: "POST /harvest-batches"
              payload: { field_id: "${f_id}", grade: "PREMIUM", pallet_count: 8, shortfall_slabs: 0, shortfall_rolls: 0, scheduled_date: "2026-08-03", expected_field_version: "${f_v2}" }
              as: HarvestSupervisor
            - call: "GET /fields/${f_id}"
              payload: {}
              as: FarmManager
              captures: { f_v3: $.data.version }
            - call: "POST /harvest-batches"
              payload: { field_id: "${f_id}", grade: "STANDARD", pallet_count: 20, shortfall_slabs: 0, shortfall_rolls: 0, scheduled_date: "2026-08-03", expected_field_version: "${f_v3}" }
              as: HarvestSupervisor
            - call: "GET /fields/${f_id}"
              payload: {}
              as: FarmManager
              captures: { f_v4: $.data.version }
            - call: "POST /harvest-batches"
              payload: { field_id: "${f_id}", grade: "STANDARD", pallet_count: 12, shortfall_slabs: 0, shortfall_rolls: 0, scheduled_date: "2026-08-03", expected_field_version: "${f_v4}" }
              as: HarvestSupervisor
            - call: "POST /customers"
              payload: { full_name: "Aria Nguyen", email: "aria@example.com", phone: "555-0101", freight_zone: 2, address: "12 Oak Ln" }
              as: SalesRep
              captures: { c_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: FarmManager
            - call: "POST /quotes"
              payload:
                customer_id: "${c_id}"
                delivery_date: "2026-08-03"
                settlement_method: "CARD"
                z1_pallets: 18
                z2_pallets: 17
                z3_pallets: 0
                lines:
                  - { variety_id: "${v_id}", grade: "PREMIUM", pallet_count: 6, shortfall_slabs: 0, shortfall_rolls: 0 }
                  - { variety_id: "${v_id}", grade: "STANDARD", pallet_count: 29, shortfall_slabs: 0, shortfall_rolls: 4 }
              as: SalesRep
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/accept"
              payload: {}
              as: SalesRep
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/confirm"
              payload: { delivery_window_start: "2026-08-03T08:00:00Z" }
              as: SalesRep
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:50:00Z" }
              as: FarmManager
            - call: "POST /harvest-batches/${b1_id}/complete"
              payload: { actual_harvest_start: "2026-08-03T06:00:00Z", actual_harvest_end: "2026-08-03T06:45:00Z" }
              as: HarvestSupervisor
            - call: "GET /harvest-batches?order_id=${o_id}"
              payload: {}
              as: FarmManager
              captures: { lb0: "$.data[0].id", lb1: "$.data[1].id", lb2: "$.data[2].id" }
            - call: "POST /harvest-batches/${lb0}/complete"
              payload: { actual_harvest_start: "2026-08-03T06:00:00Z", actual_harvest_end: "2026-08-03T06:45:00Z" }
              as: HarvestSupervisor
            - call: "POST /harvest-batches/${lb1}/complete"
              payload: { actual_harvest_start: "2026-08-03T06:00:00Z", actual_harvest_end: "2026-08-03T06:45:00Z" }
              as: HarvestSupervisor
            - call: "POST /harvest-batches/${lb2}/complete"
              payload: { actual_harvest_start: "2026-08-03T06:00:00Z", actual_harvest_end: "2026-08-03T06:45:00Z" }
              as: HarvestSupervisor
            - call: "POST /orders/${o_id}/dispatch"
              payload: {}
              as: FleetManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FarmManager
            - call: "POST /orders/${o_id}/mark-delivered"
              payload: { accepted_sqft: 500 }
              as: FleetManager
            - call: "POST /orders/${o_id}/delivery-checks"
              payload: {}
              as: SalesRep
              captures: { chk1_id: $.data.id, chk1_in: $.data.in_window }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:45:00Z" }
              as: FarmManager
            - call: "POST /orders/${o_id}/mark-delivered"
              payload: { accepted_sqft: 400 }
              as: FleetManager
          trigger:
            - call: "POST /orders/${o_id}/delivery-checks"
              payload: {}
              as: SalesRep
              captures: { chk_id: $.data.id }
          assert:
            - "DeliveryCheck.${chk1_id}.in_window == false  # check 1: 500 < 855.00 (order flagged)"
            - "DeliveryCheck.${chk_id}.check_index == 2"
            - "DeliveryCheck.${chk_id}.baseline_sqft == 1425.00"
            - "DeliveryCheck.${chk_id}.window_size == 855.00"
            - "DeliveryCheck.${chk_id}.delivered_cumulative == 900"
            - "DeliveryCheck.${chk_id}.in_window == true  # cumulative variant: 900 >= 855.00"
            - "DeliveryCheck.${chk_id}.strict_in_window == false  # strict variant: latest chunk 400 < 855.00"
            - "DeliveryCheck.${chk_id}.shortfall_sqft == 600"
            - "DeliveryCheck.${chk_id}.chargeable_after == 1013.83"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: pricing_ladder_multi_input_tier_branching
        grounds:
          - calculations.order_pricing_ladder
          - calculations.freight_cell
        distinguishing_aspect: |
          Mode (a) — a >= 3-input formula with non-linear interaction: volume
          tier branches on (turf_sqft, pre_discount_subtotal) jointly, freight is
          a piecewise cell of (total_pallets, zone split), and card_fee applies
          to the POST-discount gross. Straddle case: pre 4151.20 qualifies for
          T1 even though the post-discount gross 3902.13 falls back below 4000,
          because tier thresholds evaluate on PRE-discount values.
        test_recipe:
          setup:
            - "PriceConfig defaults current; variety exists; customer zone 2"
            - "Quote: 42 PREMIUM pallets full (turf 3591.00), zones 12/18/12 (d = 78.00 per 500 sqft), CARD"
          setup_api_calls:
            - call: "POST /price-configs"
              payload: { name: "Std 2026" }
              as: FarmManager
            - call: "POST /variety-configs"
              payload: { name: "Tifway 419 Bermuda" }
              as: FarmManager
              captures: { v_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Aria Nguyen", email: "aria@example.com", phone: "555-0101", freight_zone: 2, address: "12 Oak Ln" }
              as: SalesRep
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /quotes"
              payload:
                customer_id: "${c_id}"
                delivery_date: "2026-08-03"
                settlement_method: "CARD"
                z1_pallets: 12
                z2_pallets: 18
                z3_pallets: 12
                lines:
                  - { variety_id: "${v_id}", grade: "PREMIUM", pallet_count: 42, shortfall_slabs: 0, shortfall_rolls: 0 }
              as: SalesRep
              captures: { q_id: $.data.id }
          assert:
            - "Quote.${q_id}.turf_sqft == 3591.00"
            - "Quote.${q_id}.freight_amount == 560.20"
            - "Quote.${q_id}.pre_discount_subtotal == 4151.20"
            - "Quote.${q_id}.volume_tier == T1"
            - "Quote.${q_id}.volume_discount == 249.07"
            - "Quote.${q_id}.card_fee == 78.04"
            - "Quote.${q_id}.total_price == 3980.17"
            - "Quote.${q_id}.additive_total == 4488.28"

      - name: turf_contribution_per_line_rounding_order
        grounds:
          - calculations.turf_contribution
          - entities.Quote.fields.turf_sqft
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters and the scaffold pins
          the order: per-line round2 then sum gives turf_sqft 1350.91 for lines
          795 and 785 PREMIUM sqft (679.725->679.73 and 671.175->671.18);
          sum-then-round would give 1350.90. Distinct mode from the tier-branch
          instance above.
        test_recipe:
          setup:
            - "PriceConfig defaults current; variety exists; customer zone 1"
            - "Quote with two PREMIUM lines: 8 pallets short 1 slab (795 sqft) and 8 pallets short 3 slabs (785 sqft); zones 8/8/0"
          setup_api_calls:
            - call: "POST /price-configs"
              payload: { name: "Std 2026" }
              as: FarmManager
            - call: "POST /variety-configs"
              payload: { name: "Tifway 419 Bermuda" }
              as: FarmManager
              captures: { v_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Bo Lin", email: "bo@example.com", phone: "555-0102", freight_zone: 1, address: "4 Pine Ave" }
              as: SalesRep
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /quotes"
              payload:
                customer_id: "${c_id}"
                delivery_date: "2026-08-02"
                settlement_method: "CARD"
                z1_pallets: 8
                z2_pallets: 8
                z3_pallets: 0
                lines:
                  - { variety_id: "${v_id}", grade: "PREMIUM", pallet_count: 8, shortfall_slabs: 1, shortfall_rolls: 0 }
                  - { variety_id: "${v_id}", grade: "PREMIUM", pallet_count: 8, shortfall_slabs: 3, shortfall_rolls: 0 }
              as: SalesRep
              captures: { q_id: $.data.id }
          assert:
            - "Quote.${q_id}.turf_sqft == 1350.91"
            - "Quote.${q_id}.freight_amount == 64.84"
            - "Quote.${q_id}.pre_discount_subtotal == 1415.75"
            - "Quote.${q_id}.volume_tier == T0"
            - "Quote.${q_id}.card_fee == 28.32"
            - "Quote.${q_id}.total_price == 1444.07"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_dimensions_with_payment_reversion
        grounds:
          - state_machines.Order
          - calculations.order_balance_reconciliation
          - calculations.delivery_check_window
        distinguishing_aspect: |
          Order carries two INDEPENDENT state dimensions (status x
          payment_status): payment_status cycles PAID -> PENDING when a delivery
          check raises chargeable_amount above total_paid (1689.73 -> 1013.83 ->
          pay -> PAID -> check 2 raises chargeable to 1351.78 -> PENDING), and
          the dimensions join in the auto-transition INSTALLED + PAID -> CLOSED.
        test_recipe:
          setup:
            - "Order (turf 1500.00, total_price 1689.73, blended_rate 1.1265) DELIVERED with delivered_sqft 900 after one delivery; batches COMPLETE harvested 2026-08-03 06:00-06:45"
            - "Check 1: chargeable_amount 1013.83; payment of 1013.83 -> payment_status PAID"
          setup_api_calls:
            - call: "POST /price-configs"
              payload: { name: "Std 2026" }
              as: FarmManager
            - call: "POST /variety-configs"
              payload: { name: "Tifway 419 Bermuda" }
              as: FarmManager
              captures: { v_id: $.data.id }
            - call: "POST /fields"
              payload: { name: "North 40", variety_id: "${v_id}", field_sqft: 40000, last_planted_at: "2026-05-01T00:00:00Z", mow_count: 4, last_mowed_at: "2026-07-31T06:00:00Z", soil_moisture_pct: 45, health_score: 82 }
              as: FarmManager
              captures: { f_id: $.data.id, f_v: $.data.version }
            - call: "POST /harvest-batches"
              payload: { field_id: "${f_id}", grade: "PREMIUM", pallet_count: 10, shortfall_slabs: 0, shortfall_rolls: 0, scheduled_date: "2026-08-03", expected_field_version: "${f_v}" }
              as: HarvestSupervisor
              captures: { b1_id: $.data.id }
            - call: "GET /fields/${f_id}"
              payload: {}
              as: FarmManager
              captures: { f_v2: $.data.version }
            - call: "POST /harvest-batches"
              payload: { field_id: "${f_id}", grade: "PREMIUM", pallet_count: 8, shortfall_slabs: 0, shortfall_rolls: 0, scheduled_date: "2026-08-03", expected_field_version: "${f_v2}" }
              as: HarvestSupervisor
            - call: "GET /fields/${f_id}"
              payload: {}
              as: FarmManager
              captures: { f_v3: $.data.version }
            - call: "POST /harvest-batches"
              payload: { field_id: "${f_id}", grade: "STANDARD", pallet_count: 20, shortfall_slabs: 0, shortfall_rolls: 0, scheduled_date: "2026-08-03", expected_field_version: "${f_v3}" }
              as: HarvestSupervisor
            - call: "GET /fields/${f_id}"
              payload: {}
              as: FarmManager
              captures: { f_v4: $.data.version }
            - call: "POST /harvest-batches"
              payload: { field_id: "${f_id}", grade: "STANDARD", pallet_count: 12, shortfall_slabs: 0, shortfall_rolls: 0, scheduled_date: "2026-08-03", expected_field_version: "${f_v4}" }
              as: HarvestSupervisor
            - call: "POST /customers"
              payload: { full_name: "Aria Nguyen", email: "aria@example.com", phone: "555-0101", freight_zone: 2, address: "12 Oak Ln" }
              as: SalesRep
              captures: { c_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: FarmManager
            - call: "POST /quotes"
              payload:
                customer_id: "${c_id}"
                delivery_date: "2026-08-03"
                settlement_method: "CARD"
                z1_pallets: 18
                z2_pallets: 17
                z3_pallets: 0
                lines:
                  - { variety_id: "${v_id}", grade: "PREMIUM", pallet_count: 6, shortfall_slabs: 0, shortfall_rolls: 0 }
                  - { variety_id: "${v_id}", grade: "STANDARD", pallet_count: 29, shortfall_slabs: 0, shortfall_rolls: 4 }
              as: SalesRep
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/accept"
              payload: {}
              as: SalesRep
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/confirm"
              payload: { delivery_window_start: "2026-08-03T08:00:00Z" }
              as: SalesRep
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:50:00Z" }
              as: FarmManager
            - call: "GET /harvest-batches?order_id=${o_id}"
              payload: {}
              as: FarmManager
              captures: { lb0: "$.data[0].id", lb1: "$.data[1].id", lb2: "$.data[2].id" }
            - call: "POST /harvest-batches/${lb0}/complete"
              payload: { actual_harvest_start: "2026-08-03T06:00:00Z", actual_harvest_end: "2026-08-03T06:45:00Z" }
              as: HarvestSupervisor
            - call: "POST /harvest-batches/${lb1}/complete"
              payload: { actual_harvest_start: "2026-08-03T06:00:00Z", actual_harvest_end: "2026-08-03T06:45:00Z" }
              as: HarvestSupervisor
            - call: "POST /harvest-batches/${lb2}/complete"
              payload: { actual_harvest_start: "2026-08-03T06:00:00Z", actual_harvest_end: "2026-08-03T06:45:00Z" }
              as: HarvestSupervisor
            - call: "POST /orders/${o_id}/dispatch"
              payload: {}
              as: FleetManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FarmManager
            - call: "POST /orders/${o_id}/mark-delivered"
              payload: { accepted_sqft: 900 }
              as: FleetManager
            - call: "POST /orders/${o_id}/delivery-checks"
              payload: {}
              as: SalesRep
            - call: "POST /orders/${o_id}/payments"
              payload: { amount: 1013.83, method: "CARD" }
              as: SalesRep
          trigger:
            - call: "POST /orders/${o_id}/mark-delivered"
              payload: { accepted_sqft: 300 }
              as: FleetManager
            - call: "POST /orders/${o_id}/delivery-checks"
              payload: {}
              as: SalesRep
              captures: { chk2_id: $.data.id }
            - call: "GET /orders/${o_id}"
              payload: {}
              as: SalesRep
              captures: { o_ps: $.data.payment_status, o_due: $.data.amount_due }
          assert:
            - "DeliveryCheck.${chk2_id}.window_size == 1463.30"
            - "DeliveryCheck.${chk2_id}.in_window == false"
            - "DeliveryCheck.${chk2_id}.chargeable_after == 1351.78"
            - "Order.${o_id}.payment_status == PENDING  # reverted PAID -> PENDING"
            - "Order.${o_id}.amount_due == 337.95"
            - "Order.${o_id}.total_paid == 1013.83"
            - "Order.${o_id}.status == DELIVERED  # fulfillment dimension unaffected by payment reversion"

      - name: field_maturity_cycle_via_reseed
        grounds:
          - state_machines.FieldMaturity
          - state_machines.ReSeedPlan
          - calculations.maturity_classification
          - calculations.reseed_seed_requirement
        distinguishing_aspect: |
          FieldMaturity is CYCLIC (SEEDED->GROWING->READY->MATURE->OVERAGED and
          back to SEEDED via re-seed completion) — a different entity than Order
          and a different non-linear shape than Order's parallel dimensions. The
          reset restores maturity_state SEEDED, remaining_sqft 40000, mow_count 0.
        test_recipe:
          setup:
            - "Field planted 2025-10-01 (age 304 days at clock 2026-08-01 -> OVERAGED, since mature_max_days 240); no live batches; no orders"
            - "ReSeedPlan created (target 240.00 lbs), started"
          setup_api_calls:
            - call: "POST /price-configs"
              payload: { name: "Std 2026" }
              as: FarmManager
            - call: "POST /variety-configs"
              payload: { name: "Tifway 419 Bermuda" }
              as: FarmManager
              captures: { v_id: $.data.id }
            - call: "POST /fields"
              payload: { name: "South 12", variety_id: "${v_id}", field_sqft: 40000, last_planted_at: "2025-10-01T00:00:00Z", mow_count: 5, last_mowed_at: "2026-07-31T06:00:00Z", soil_moisture_pct: 45, health_score: 75 }
              as: FarmManager
              captures: { f_id: $.data.id }
