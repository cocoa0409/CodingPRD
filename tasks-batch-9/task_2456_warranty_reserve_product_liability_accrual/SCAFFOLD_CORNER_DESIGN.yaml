            - "After the second trigger call: SupplierRecovery.${rec_rz2_id}.status == WRITTEN_OFF and recognized_recovery_cents == 0"
            - "Supplier.${sup_rz_id}.written_off_recovery_cents == 1000000, closed_recovery_count == 2, realization_bps == 7500"
            - "Supplier.${sup_rz_id}.collectability_rating == HIGH — exactly 7500 bps holds the base rating, it does NOT downgrade to MEDIUM"
            - "Supplier.${sup_rz_id}.gross_asserted_recovery_cents == 5000000 and open_recovery_asset_cents == 0"

      - name: corner_rollforward_composes_all_six_disclosure_components
        claim_type: Correct Result
        grounds:
          - calculations.reserve_rollforward_disclosure
          - entities.ReserveRollforward
          - endpoints[POST /warranty/periods/{periodId}/rollforward]
        distinguishing_aspect: "One rollforward carries a POSTED accrual (2910000), an APPROVED field action booked to the same period (5350000), claims paid coded to that period_code (465600) and a zero beginning balance, so ending_balance_cents is exactly 7794400; the analog family's 6000000 of paid cost is coded to 2025-Q4 and is therefore excluded."
