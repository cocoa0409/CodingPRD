            - "the 2026-11-15 attempt returns 201 because the gap is 15 days"
            - "ReclassificationCase.${case_b_id}.pay_conversion_status == PENDING"
            - "ReclassificationCase.${case_b_id}.communication_status == NOT_STARTED"
            - "ReclassificationCase.${case_a_id}.effective_end_date == 2026-10-31 and pay_conversion_status == PENDING"
            - "exactly two ReclassificationCase rows exist for Position ${pos_id}"

      - name: reclassification_wave_capacity_rejects_the_third_intersecting_case_in_a_family
        grounds:
          - validations[priority=16]
          - errors.ERR_RECLASS_WAVE_CAPACITY_EXCEEDED
          - constants.MAX_CONCURRENT_RECLASS_PER_FAMILY
          - entities.ReclassificationCase.fields.pay_conversion_status
