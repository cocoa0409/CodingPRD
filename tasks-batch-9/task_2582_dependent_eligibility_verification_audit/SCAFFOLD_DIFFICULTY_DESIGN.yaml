              payload: { relationship_type: "STEPCHILD", phase: "AUDIT", acceptable_proof_types: ["BIRTH_CERTIFICATE", "MARRIAGE_CERTIFICATE"], min_accepted_documents: 1, affidavit_allowed: false, requires_recency_days: 365, auto_terminate_on_lapse: false }
