  - name: full_gross_up_state_tier_keyed_on_pre_gross_up_award_value
    grounds:
    - '§1.3 taxable_award_gross_up.formula (PINNED EVALUATION ORDER: state tier keyed on A, never on reported)'
    - §1.3 taxable_award_gross_up.constants (STATE_TIER_MID_BP 500, STATE_TIER_HIGH_BP 700, STATE_TIER_HIGH_FLOOR_CENTS
      1500000)
    - §1.5 POST /tax-award-reports
    - §1.3 taxable_award_base
    distinguishing_aspect: |-
      For a taxable base of 1366800 the state supplemental tier must be resolved from the pre-gross-up award value (1366800 < 1500000 -> 500 bp, combined_rate_bp 3465, reported_value_cents 2091507); resolving it from the grossed-up result (2091507 >= 1500000 -> 700 bp, reported_value_cents 2157537) is the circular ordering and must not occur.
