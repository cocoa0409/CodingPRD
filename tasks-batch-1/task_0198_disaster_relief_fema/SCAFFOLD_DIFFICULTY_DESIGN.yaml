  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_disbursement
        grounds:
          - validations[priority=5]
          - validations[priority=12]
          - errors[ERR_CASE_NOT_APPROVED]
          - errors[ERR_DISBURSEMENT_EXCEEDS_OBLIGATION]
        distinguishing_aspect: |
          ERROR-CATEGORY PAIR (state vs business_fiscal): a disbursement on a case
          still in ELIGIBILITY_PENDING with an amount that ALSO exceeds obligation
          fails BOTH the state check (priority 5) and the fiscal check (priority 12).
          The higher-priority state error ERR_CASE_NOT_APPROVED wins.
        test_recipe:
          setup:
            - "IhpCase in ELIGIBILITY_PENDING (created, NOT approved). There are no APPROVED line items and no obligation. The disbursement references the case id as a placeholder line_item_id and a huge amount; both the state and fiscal checks would fail."
