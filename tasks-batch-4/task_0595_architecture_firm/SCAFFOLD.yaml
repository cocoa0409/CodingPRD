scenario: "Architecture Firm Project Management: project phase (SD/DD/CD/CA) & milestone, fee (% of construction/hourly) & contract, drawing/RFI/submittal log, consultant coordination, time/expense & billing, code/permit review, change & additional service, construction-admin field report"
domain_name: architecture-firm
api_prefix: "/"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: hybrid
  # Peer entities linked by explicit FK fields in request bodies (flat creation
  # surface: POST /phases, POST /rfis, POST /invoices all carry their parent id
  # in the body), with a small number of sub-resource reads
  # (GET /projects/{projectId}/phases) used purely for FK reverse-reachability.

  state_machine_shape: cyclic
  # Submittal (RECEIVED -> UNDER_REVIEW -> REVISE_AND_RESUBMIT -> RECEIVED),
  # RFI (OPEN -> RETURNED_FOR_CLARIFICATION -> OPEN, bounded at 2 rounds),
  # PermitReview (SUBMITTED -> COMMENTS_ISSUED -> RESUBMITTED -> COMMENTS_ISSUED),
  # TimeEntry (SUBMITTED -> APPROVED -> SUBMITTED reversal),
  # plus Invoice parallel dimensions (status x payment_status) and
  # ChangeOrder branching (SUBMITTED -> {CLIENT_APPROVED, CLIENT_REJECTED}).

  relationship_patterns:
    - one_to_many          # Project -> Phase, Phase -> Drawing, Contract -> Invoice
    - cross_aggregate      # RFI -> Drawing, Expense -> Invoice, Submittal -> ConsultantFirm
    - polymorphic          # RFI.origin CONTRACTOR (drawing_id set) vs FIELD_REPORT (field_report_id set)

  role_model: segregation_of_duties
  # The actor who logged a TimeEntry may never approve it; the actor who
  # submitted a ChangeOrder may never execute it. Enforced on X-User-ID.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Staff member's full name.
      - name: title
        type: enum
        source: input
        description: Firm title.
        constraints: "one of PRINCIPAL, PROJECT_MANAGER, ARCHITECT, DESIGNER"
      - name: billing_rate_cents_per_hour
        type: integer
        source: input
        description: Rate charged to the client for this person's time, in cents per hour.
        constraints: "> 0"
      - name: cost_rate_cents_per_hour
        type: integer
        source: input
        description: Internal loaded cost of this person's time, in cents per hour.
        constraints: "> 0"
      - name: active
        type: boolean
        source: input
        description: Whether the staff member may be assigned new work.
        default: true

  - name: ConsultantFirm
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Consultant firm name.
      - name: discipline
        type: enum
        source: input
        description: Engineering discipline the firm covers.
        constraints: "one of STRUCTURAL, MEP, CIVIL, LANDSCAPE"
      - name: concurrent_review_capacity
        type: integer
        source: input
        description: >-
          Maximum number of this firm's Submittals that may hold overlapping
          review windows at once. Resource capacity for the closed-interval
          overlap rule (see validations priority 14).
        constraints: ">= 1"
      - name: status
        type: enum
        source: input
        description: Firm availability.
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED"

  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: project_number
        type: string
        source: input
        description: Firm-wide unique project number.
        constraints: "unique across all Projects"
      - name: name
        type: string
        source: input
        description: Project name.
      - name: client_rep_user_id
        type: string
        source: input
        description: >-
          Opaque X-User-ID of the ClientRep operator authorised to render client
          decisions on this project's ChangeOrders. Not an FK; never equals any
          entity id.
      - name: project_manager_staff_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the ProjectManager who owns this project."
      - name: status
        type: enum
        source: system
        description: Project lifecycle state.
        default: DRAFT
        constraints: "one of DRAFT, ACTIVE, SUSPENDED, CLOSED"
      - name: labor_budget_cents
        type: integer
        source: input
        description: Internal labor cost budget for the project, in cents.
        constraints: "> 0"
      - name: labor_cost_cents
        type: integer
        source: computed
        description: >-
          Sum of cost_cents over TimeEntries with status == APPROVED whose Phase
          belongs to this Project. Recomputed by calculations.project_labor_rollup.
        default: 0
      - name: approved_hours
        type: number
        source: computed
        description: >-
          Sum of hours over TimeEntries with status == APPROVED whose Phase belongs
          to this Project, rounded to 2 decimal places.
        default: 0
      - name: budget_posture
        type: enum
        source: computed
        description: >-
          OVER_BUDGET when labor_cost_cents >= labor_budget_cents, else WITHIN_BUDGET.
        default: WITHIN_BUDGET
        constraints: "one of WITHIN_BUDGET, OVER_BUDGET"
      - name: open_rfi_count
        type: integer
        source: computed
        description: >-
          Count of RFIs on this Project whose status IN {OPEN, RETURNED_FOR_CLARIFICATION}.
        default: 0
      - name: ca_posture
        type: enum
        source: computed
        description: >-
          DEFICIENT when open_rfi_count > 0, else CLEAR. Gates Phase completion.
        default: CLEAR
        constraints: "one of CLEAR, DEFICIENT"

  - name: Contract
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; exactly one Contract may exist per Project."
      - name: fee_basis
        type: enum
        source: input
        description: How the design fee is earned.
        constraints: "one of PERCENT_OF_CONSTRUCTION, HOURLY"
      - name: construction_cost_estimate_cents
        type: integer
        source: input
        description: Estimated construction cost in cents. Required when fee_basis == PERCENT_OF_CONSTRUCTION.
        default: 0
      - name: fee_rate_bp
        type: integer
        source: input
        description: Fee rate in basis points of construction cost. Required when fee_basis == PERCENT_OF_CONSTRUCTION.
        default: 0
      - name: not_to_exceed_cents
        type: integer
        source: input
        description: Hourly-fee ceiling in cents. Required when fee_basis == HOURLY.
        default: 0
      - name: review_clock_basis
        type: enum
        source: input
        description: >-
          Selects the submittal_review_due variant used to stamp Submittal.review_due_at.
        constraints: "one of CALENDAR_DAYS, BUSINESS_DAYS"
      - name: submittal_review_period_days
        type: integer
        source: input
        description: Number of days allowed for consultant submittal review.
        default: 14
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: Contract lifecycle state.
        default: DRAFT
        constraints: "one of DRAFT, EXECUTED, TERMINATED"
      - name: base_fee_cents
        type: integer
        source: computed
        description: >-
          PERCENT_OF_CONSTRUCTION -> round_half_up(construction_cost_estimate_cents *
          fee_rate_bp / 10000). HOURLY -> not_to_exceed_cents. Frozen at EXECUTED.
        default: 0
      - name: total_fee_cents
        type: integer
        source: computed
        description: >-
          base_fee_cents + sum of ChangeOrder.fee_delta_cents over ChangeOrders of this
          Contract whose status == EXECUTED.
        default: 0
      - name: earned_to_date_cents
        type: integer
        source: computed
        description: >-
          Output of calculations.contract_fee_earned (variant selected by fee_basis).
        default: 0
      - name: billed_fee_to_date_cents
        type: integer
        source: computed
        description: >-
          Sum of Invoice.fee_billed_cents over Invoices of this Contract whose
          status == ISSUED.
        default: 0
      - name: wip_balance_cents
        type: integer
        source: computed
        description: "earned_to_date_cents - billed_fee_to_date_cents. Never stored independently."
        default: 0

  - name: Phase
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id"
      - name: phase_code
        type: enum
        source: input
        description: Design phase code.
        constraints: "one of SD, DD, CD, CA; unique per project_id"
      - name: phase_order
        type: integer
        source: computed
        description: "Derived from phase_code via PHASE_ORDER = {SD:1, DD:2, CD:3, CA:4}."
      - name: weight_bp
        type: integer
        source: input
        description: Share of Contract.total_fee_cents allocated to this phase, in basis points.
        constraints: ">= 0 and <= 10000; the four phases of a project must sum to exactly 10000 at contract execution"
      - name: status
        type: enum
        source: system
        description: Phase lifecycle state.
        default: NOT_STARTED
        constraints: "one of NOT_STARTED, ACTIVE, ON_HOLD, COMPLETED"
      - name: percent_complete
        type: integer
        source: input
        description: Percent complete, set via PATCH /phases/{phaseId}; forced to 100 on COMPLETED.
        default: 0
        constraints: ">= 0 and <= 100"
      - name: fee_allocation_cents
        type: integer
        source: computed
        description: Output of calculations.phase_fee_allocation.
        default: 0
      - name: earned_cents
        type: integer
        source: computed
        description: "round_half_up(fee_allocation_cents * percent_complete / 100)."
        default: 0
      - name: milestone_name
        type: string
        source: input
        description: Name of the contractual milestone that closes this phase.
      - name: milestone_due_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant by which the milestone must be met.
      - name: milestone_status
        type: enum
        source: computed
        description: >-
          PENDING until the phase reaches COMPLETED; then MET when the logical clock at
          completion <= milestone_due_at, otherwise MISSED.
        default: PENDING
        constraints: "one of PENDING, MET, MISSED"
      - name: is_billing_milestone
        type: boolean
        source: input
        description: When false, this phase's earned_cents is excluded from invoice fee billing.
        default: true

  - name: Drawing
    parent: Phase
    common_fields: true
    fields:
      - name: phase_id
        type: string
        source: input
        description: "FK -> Phase.id"
      - name: sheet_number
        type: string
        source: input
        description: Sheet number in the drawing log.
        constraints: "unique per phase_id"
      - name: title
        type: string
        source: input
        description: Sheet title.
      - name: revision
        type: integer
        source: computed
        description: Increments by 1 each time the drawing is re-ISSUED after SUPERSEDED.
        default: 0
      - name: status
        type: enum
        source: system
        description: Drawing log state.
        default: IN_PROGRESS
        constraints: "one of IN_PROGRESS, ISSUED, SUPERSEDED"

  - name: TimeEntry
    parent: Phase
    common_fields: true
    fields:
      - name: phase_id
        type: string
        source: input
        description: "FK -> Phase.id; the Project is resolved as Phase.project_id."
      - name: staff_member_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the person whose timesheet this entry occupies."
      - name: start_utc
        type: datetime
        source: input
        description: Interval start (inclusive).
      - name: end_utc
        type: datetime
        source: input
        description: Interval end (exclusive).
        constraints: "must be strictly greater than start_utc"
      - name: hours
        type: number
        source: computed
        description: "(end_utc - start_utc) in seconds / 3600, rounded half-up to 2 decimal places."
      - name: billable
        type: boolean
        source: input
        description: Whether the hours may be charged to the client.
        default: true
      - name: cost_cents
        type: integer
        source: computed
        description: "round_half_up(hours * StaffMember.cost_rate_cents_per_hour)."
      - name: billable_cents
        type: integer
        source: computed
        description: "billable ? round_half_up(hours * StaffMember.billing_rate_cents_per_hour) : 0."
      - name: status
        type: enum
        source: system
        description: Timesheet approval state.
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, APPROVED, REJECTED"
      - name: approved_by_user_id
        type: string
        source: system
        description: >-
          X-User-ID of the actor who last APPROVED this entry. Opaque audit value, not an FK;
          null while status != APPROVED.

  - name: Expense
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id"
      - name: staff_member_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the person who incurred the expense."
      - name: category
        type: enum
        source: input
        description: Expense category.
        constraints: "one of TRAVEL, PRINTING, PERMIT_FEE, MODEL"
      - name: amount_cents
        type: integer
        source: input
        description: Raw expense amount in cents.
        constraints: "> 0"
      - name: reimbursable
        type: boolean
        source: input
        description: Whether the client reimburses this expense.
        default: true
      - name: markup_bp
        type: integer
        source: input
        description: Markup applied to reimbursable expenses, in basis points.
        default: 1000
        constraints: ">= 0 and <= 5000"
      - name: billable_cents
        type: integer
        source: computed
        description: "reimbursable ? round_half_up(amount_cents * (10000 + markup_bp) / 10000) : 0."
        default: 0
      - name: status
        type: enum
        source: system
        description: Expense approval state.
        default: SUBMITTED
        constraints: "one of SUBMITTED, APPROVED, REJECTED, BILLED"
      - name: invoice_id
        type: string
        source: system
        description: >-
          FK -> Invoice.id; set when the expense is swept onto an ISSUED invoice, cleared
          back to null when that invoice is VOIDed.

  - name: RFI
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id"
      - name: drawing_id
        type: string
        source: input
        description: >-
          FK -> Drawing.id; null for RFIs whose origin is FIELD_REPORT. When supplied, the
          Drawing must be in status ISSUED.
      - name: field_report_id
        type: string
        source: system
        description: >-
          FK -> FieldReport.id; set only on RFIs auto-created by a FieldReport cascade,
          null otherwise.
      - name: rfi_number
        type: integer
        source: computed
        description: >-
          Sequential per Project starting at 1, assigned in ascending created_at order of
          the Project's RFIs.
      - name: subject
        type: string
        source: input
        description: Question being asked.
      - name: origin
        type: enum
        source: system
        description: CONTRACTOR for client/contractor-raised RFIs; FIELD_REPORT for cascade-created ones.
        default: CONTRACTOR
        constraints: "one of CONTRACTOR, FIELD_REPORT"
      - name: impacts_fee
        type: boolean
        source: input
        description: Flags the RFI as a candidate trigger for an additional-service ChangeOrder.
        default: false
      - name: status
        type: enum
        source: system
        description: RFI log state.
        default: OPEN
        constraints: "one of OPEN, RETURNED_FOR_CLARIFICATION, ANSWERED, CLOSED, VOID"
      - name: clarification_rounds
        type: integer
        source: computed
        description: >-
          Increments by 1 on each OPEN -> RETURNED_FOR_CLARIFICATION transition; capped at
          MAX_CLARIFICATION_ROUNDS.
        default: 0
      - name: answer_text
        type: string
        source: system
        description: Answer supplied on the OPEN -> ANSWERED transition; null before that.
      - name: answered_at
        type: datetime
        source: system
        description: Logical-clock instant of the OPEN -> ANSWERED transition; null before that.

  - name: Submittal
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id"
      - name: consultant_firm_id
        type: string
        source: input
        description: "FK -> ConsultantFirm.id; the firm whose review capacity this submittal occupies."
      - name: spec_section
        type: string
        source: input
        description: Specification section under review.
      - name: revision_number
        type: integer
        source: computed
        description: Increments by 1 on each REVISE_AND_RESUBMIT -> RECEIVED transition.
        default: 0
      - name: status
        type: enum
        source: system
        description: Submittal review state.
        default: RECEIVED
        constraints: "one of RECEIVED, UNDER_REVIEW, REVISE_AND_RESUBMIT, APPROVED, APPROVED_AS_NOTED, REJECTED"
      - name: review_started_at
        type: datetime
        source: system
        description: Logical-clock instant of the RECEIVED -> UNDER_REVIEW transition; null before that.
      - name: review_due_at
        type: datetime
        source: computed
        description: Output of calculations.submittal_review_due; null until review starts.
      - name: review_notes
        type: string
        source: system
        description: Notes supplied with the review decision; null before a decision.

  - name: ChangeOrder
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id"
      - name: title
        type: string
        source: input
        description: Short description of the additional service or scope reduction.
      - name: co_type
        type: enum
        source: input
        description: Direction of the fee change.
        constraints: "one of ADDITIONAL_SERVICE, SCOPE_REDUCTION"
      - name: fee_delta_cents
        type: integer
        source: input
        description: >-
          Change to Contract.total_fee_cents. Must be > 0 when co_type == ADDITIONAL_SERVICE
          and < 0 when co_type == SCOPE_REDUCTION.
      - name: source_rfi_number
        type: integer
        source: input
        description: Informational RFI number that prompted this change order; not an FK.
      - name: status
        type: enum
        source: system
        description: Change-order lifecycle state.
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, CLIENT_APPROVED, CLIENT_REJECTED, EXECUTED, VOID"
      - name: submitted_by_user_id
        type: string
        source: system
        description: >-
          X-User-ID of the actor who performed DRAFT -> SUBMITTED. Opaque audit value, not an
          FK. The executor's X-User-ID must differ from it (segregation of duties).
      - name: executed_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who executed the change order; null before execution.
      - name: executed_at
        type: datetime
        source: system
        description: Logical-clock instant of execution; null before execution.

  - name: Invoice
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id"
      - name: period_end
        type: datetime
        source: input
        description: End of the billing period covered by this invoice.
      - name: status
        type: enum
        source: system
        description: Issuance dimension of the invoice's parallel state.
        default: DRAFT
        constraints: "one of DRAFT, ISSUED, VOID"
      - name: payment_status
        type: enum
        source: system
        description: >-
          Settlement dimension of the invoice's parallel state; evolves independently of status.
        default: UNPAID
        constraints: "one of UNPAID, PARTIALLY_PAID, PAID"
      - name: fee_billed_cents
        type: integer
        source: computed
        description: Design-fee portion of the invoice; step 1 of calculations.invoice_totals.
        default: 0
      - name: reimbursable_cents
        type: integer
        source: computed
        description: Marked-up reimbursable expense portion; step 2 of calculations.invoice_totals.
        default: 0
      - name: gross_cents
        type: integer
        source: computed
        description: "fee_billed_cents + reimbursable_cents; step 3 of calculations.invoice_totals."
        default: 0
      - name: retainage_bp
        type: integer
        source: computed
        description: Retainage tier in basis points; steps 4-5 of calculations.invoice_totals.
        default: 0
      - name: retainage_cents
        type: integer
        source: computed
        description: "round_half_up(gross_cents * retainage_bp / 10000); step 6 of calculations.invoice_totals."
        default: 0
      - name: net_due_cents
        type: integer
        source: computed
        description: "gross_cents - retainage_cents; step 7 of calculations.invoice_totals."
        default: 0
      - name: amount_paid_cents
        type: integer
        source: computed
        description: Running sum of payments recorded against this invoice.
        default: 0
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant of the DRAFT -> ISSUED transition; null before that.

  - name: PermitReview
    parent: Phase
    common_fields: true
    fields:
      - name: phase_id
        type: string
        source: input
        description: "FK -> Phase.id; must reference the project's CD phase."
      - name: jurisdiction_name
        type: string
        source: input
        description: Authority having jurisdiction.
      - name: permit_type
        type: enum
        source: input
        description: Permit being sought.
        constraints: "one of BUILDING, ZONING, FIRE"
      - name: status
        type: enum
        source: system
        description: Permit review state.
        default: PREPARING
        constraints: "one of PREPARING, SUBMITTED, COMMENTS_ISSUED, RESUBMITTED, APPROVED, REJECTED"
      - name: submission_round
        type: integer
        source: computed
        description: Increments by 1 on each transition into SUBMITTED or RESUBMITTED.
        default: 0
      - name: comment_count
        type: integer
        source: system
        description: Comment count supplied on the transition into COMMENTS_ISSUED.
        default: 0
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of APPROVED or REJECTED; null before a decision.

  - name: FieldReport
    parent: Project
    common_fields: false
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id"
      - name: staff_member_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the observer who made the site visit."
      - name: visit_date
        type: datetime
        source: input
        description: Site-visit instant.
      - name: weather
        type: string
        source: input
        description: Weather observed on site.
      - name: observations
        type: string
        source: input
        description: Narrative observations.
      - name: deficiency_count
        type: integer
        source: input
        description: >-
          Number of deficiencies observed. When >= 1 the system auto-creates one RFI with
          origin FIELD_REPORT (see state_machines.FieldReport).
        constraints: ">= 0"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Project
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "system event: the Project's Contract transitions DRAFT -> EXECUTED"
        actor: system
        preconditions:
          - "Project.status == DRAFT"
        side_effects:
          - "Project.status := ACTIVE"
          - "Project.updated_at refreshed; Project.version incremented by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /projects/{projectId}/state with to_status=SUSPENDED"
        actor: PrincipalArchitect
        preconditions:
          - "Project.status == ACTIVE"
        side_effects:
          - "Project.status := SUSPENDED"
          - "no cascade to Phases; Phase status is untouched"
        note: "While SUSPENDED, Invoice DRAFT -> ISSUED is rejected with ERR_PROJECT_NOT_ACTIVE."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /projects/{projectId}/state with to_status=ACTIVE"
        actor: PrincipalArchitect
        preconditions:
          - "Project.status == SUSPENDED"
        side_effects:
          - "Project.status := ACTIVE"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /projects/{projectId}/state with to_status=CLOSED"
        actor: PrincipalArchitect
        preconditions:
          - "Project.status == ACTIVE"
          - "every Phase of the Project has status IN {COMPLETED}"
          - "Project.open_rfi_count == 0"
        side_effects:
          - "Project.status := CLOSED"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /projects/{projectId}/state with to_status=CLOSED"
        actor: PrincipalArchitect
        preconditions:
          - "Project.status == SUSPENDED"
          - "every Phase of the Project has status IN {COMPLETED}"
          - "Project.open_rfi_count == 0"
        side_effects:
          - "Project.status := CLOSED"

  - entity: Contract
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /contracts/{contractId}/state with to_status=EXECUTED"
        actor: PrincipalArchitect
        preconditions:
          - "Contract.status == DRAFT"
          - "the Contract's Project has exactly 4 Phases, one per phase_code in {SD, DD, CD, CA}"
          - "sum of Phase.weight_bp over those 4 Phases == 10000, else ERR_PHASE_WEIGHTS_INVALID"
        side_effects:
          - "Contract.status := EXECUTED"
          - "Contract.base_fee_cents := round_half_up(construction_cost_estimate_cents * fee_rate_bp / 10000) when fee_basis == PERCENT_OF_CONSTRUCTION, else not_to_exceed_cents"
          - "Contract.total_fee_cents := base_fee_cents (no EXECUTED ChangeOrders exist yet)"
          - "run calculations.phase_fee_allocation -> writes Phase.fee_allocation_cents for all 4 Phases"
          - "run calculations.contract_fee_earned -> writes Contract.earned_to_date_cents; Contract.wip_balance_cents := earned_to_date_cents - billed_fee_to_date_cents"
          - "cascade: Project DRAFT -> ACTIVE"
          - "Contract.version incremented by 1"
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /contracts/{contractId}/state with to_status=TERMINATED"
        actor: PrincipalArchitect
        preconditions:
          - "Contract.status == EXECUTED"
          - "no Invoice of this Contract has status == DRAFT"
        side_effects:
          - "Contract.status := TERMINATED"
          - "Contract.version incremented by 1"

  - entity: Phase
    initial_state: NOT_STARTED
    terminal_states: [COMPLETED]
    transitions:
      - from: NOT_STARTED
        to: ACTIVE
        trigger: "POST /phases/{phaseId}/state with to_status=ACTIVE"
        actor: ProjectManager
        preconditions:
          - "Phase.status == NOT_STARTED"
          - "the Project's Contract.status == EXECUTED, else ERR_CONTRACT_NOT_EXECUTED (cross-entity: Phase depends on Contract)"
          - "when Phase.phase_code == CA: there exists a PermitReview pr with pr.phase_id IN {ids of this Project's Phases} and pr.status == APPROVED, else ERR_PERMIT_NOT_APPROVED (cross-entity: Phase depends on PermitReview)"
          - "when Phase.phase_order > 1: the sibling Phase with phase_order == this.phase_order - 1 has status == COMPLETED, else ERR_PHASE_ORDER_VIOLATION"
        side_effects:
          - "Phase.status := ACTIVE"
      - from: ACTIVE
        to: ON_HOLD
        trigger: "POST /phases/{phaseId}/state with to_status=ON_HOLD"
        actor: ProjectManager
        preconditions:
          - "Phase.status == ACTIVE"
        side_effects:
          - "Phase.status := ON_HOLD"
      - from: ON_HOLD
        to: ACTIVE
        trigger: "POST /phases/{phaseId}/state with to_status=ACTIVE"
        actor: ProjectManager
        preconditions:
          - "Phase.status == ON_HOLD"
          - "the Project's Contract.status == EXECUTED"
        side_effects:
          - "Phase.status := ACTIVE"
        note: "Cyclic: ACTIVE <-> ON_HOLD may repeat any number of times."
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /phases/{phaseId}/state with to_status=COMPLETED"
        actor: ProjectManager
        preconditions:
          - "Phase.status == ACTIVE"
          - "Project.ca_posture == CLEAR (i.e. Project.open_rfi_count == 0), else ERR_OPEN_RFIS_BLOCK_COMPLETION"
        side_effects:
          - "Phase.status := COMPLETED"
          - "Phase.percent_complete := 100"
          - "Phase.earned_cents := round_half_up(fee_allocation_cents * 100 / 100) == fee_allocation_cents"
          - "Phase.milestone_status := MET when the logical clock <= Phase.milestone_due_at, else MISSED"
          - "cascade: run calculations.contract_fee_earned -> Contract.earned_to_date_cents; then Contract.wip_balance_cents := earned_to_date_cents - billed_fee_to_date_cents; Contract.version incremented by 1"

  - entity: Drawing
    initial_state: IN_PROGRESS
    terminal_states: []
    transitions:
      - from: IN_PROGRESS
        to: ISSUED
        trigger: "POST /drawings/{drawingId}/state with to_status=ISSUED"
        actor: ProjectManager
        preconditions:
          - "Drawing.status == IN_PROGRESS"
          - "the Drawing's Phase.status IN {ACTIVE, COMPLETED}"
        side_effects:
          - "Drawing.status := ISSUED"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "POST /drawings/{drawingId}/state with to_status=SUPERSEDED"
        actor: ProjectManager
        preconditions:
          - "Drawing.status == ISSUED"
        side_effects:
          - "Drawing.status := SUPERSEDED"
      - from: SUPERSEDED
        to: ISSUED
        trigger: "POST /drawings/{drawingId}/state with to_status=ISSUED"
        actor: ProjectManager
        preconditions:
          - "Drawing.status == SUPERSEDED"
        side_effects:
          - "Drawing.status := ISSUED"
          - "Drawing.revision incremented by 1"
        note: "Cyclic: ISSUED <-> SUPERSEDED, bumping revision on each re-issue."

  - entity: TimeEntry
    initial_state: DRAFT
    terminal_states: [REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /time-entries/{timeEntryId}/state with to_status=SUBMITTED"
        actor: StaffArchitect
        preconditions:
          - "TimeEntry.status == DRAFT"
        side_effects:
          - "TimeEntry.status := SUBMITTED"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /time-entries/{timeEntryId}/state with to_status=APPROVED"
        actor: ProjectManager
        preconditions:
          - "TimeEntry.status == SUBMITTED"
          - "X-User-ID != TimeEntry.staff_member_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "TimeEntry.status := APPROVED; TimeEntry.approved_by_user_id := X-User-ID"
          - "cascade hop 1: run calculations.project_labor_rollup -> Project.approved_hours += TimeEntry.hours; Project.labor_cost_cents += TimeEntry.cost_cents"
          - "cascade hop 2: caused by the labor_cost_cents change, Project.budget_posture := OVER_BUDGET when labor_cost_cents >= labor_budget_cents, else WITHIN_BUDGET"
          - "cascade hop 3: caused by the approved-hours change, run calculations.contract_fee_earned -> Contract.earned_to_date_cents (the HOURLY variant reads APPROVED TimeEntries); then Contract.wip_balance_cents := earned_to_date_cents - billed_fee_to_date_cents; Contract.version incremented by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /time-entries/{timeEntryId}/state with to_status=REJECTED"
        actor: ProjectManager
        preconditions:
          - "TimeEntry.status == SUBMITTED"
          - "X-User-ID != TimeEntry.staff_member_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "TimeEntry.status := REJECTED"
          - "the entry stops occupying the staff member's timesheet interval (see validations priority 14)"
      - from: APPROVED
        to: SUBMITTED
        trigger: "POST /time-entries/{timeEntryId}/state with to_status=SUBMITTED"
        actor: ProjectManager
        preconditions:
          - "TimeEntry.status == APPROVED"
          - "no ISSUED Invoice exists on the Project's Contract whose fee_billed_cents drew on this entry, i.e. Contract.fee_basis == PERCENT_OF_CONSTRUCTION OR Contract.billed_fee_to_date_cents == 0, else ERR_INVALID_STATE"
        side_effects:
          - "TimeEntry.status := SUBMITTED; TimeEntry.approved_by_user_id := null"
          - "compensating cascade hop 1: Project.approved_hours -= TimeEntry.hours; Project.labor_cost_cents -= TimeEntry.cost_cents"
          - "compensating cascade hop 2: Project.budget_posture recomputed from the new labor_cost_cents"
          - "compensating cascade hop 3: Contract.earned_to_date_cents and Contract.wip_balance_cents recomputed; Contract.version incremented by 1"
        note: "Reversal edge; makes the machine cyclic (SUBMITTED -> APPROVED -> SUBMITTED)."

  - entity: Expense
    initial_state: SUBMITTED
    terminal_states: [REJECTED, BILLED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /expenses/{expenseId}/state with to_status=APPROVED"
        actor: ProjectManager
        preconditions:
          - "Expense.status == SUBMITTED"
          - "X-User-ID != Expense.staff_member_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "Expense.status := APPROVED"
          - "the expense becomes eligible for the next invoice's reimbursable sweep"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /expenses/{expenseId}/state with to_status=REJECTED"
        actor: ProjectManager
        preconditions:
          - "Expense.status == SUBMITTED"
          - "X-User-ID != Expense.staff_member_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "Expense.status := REJECTED"
      - from: APPROVED
        to: BILLED
        trigger: "system event: an Invoice on the same Project transitions DRAFT -> ISSUED"
        actor: system
        preconditions:
          - "Expense.status == APPROVED and Expense.invoice_id IS NULL"
          - "Expense.reimbursable == true"
        side_effects:
          - "Expense.status := BILLED; Expense.invoice_id := the issuing Invoice's id"
      - from: BILLED
        to: APPROVED
        trigger: "system event: the Invoice referenced by Expense.invoice_id transitions ISSUED -> VOID"
        actor: system
        preconditions:
          - "Expense.status == BILLED"
        side_effects:
          - "Expense.status := APPROVED; Expense.invoice_id := null"
        note: "Compensating edge, restoring the expense to the unbilled pool."

  - entity: RFI
    initial_state: OPEN
    terminal_states: [CLOSED, VOID]
    transitions:
      - from: OPEN
        to: RETURNED_FOR_CLARIFICATION
        trigger: "POST /rfis/{rfiId}/state with to_status=RETURNED_FOR_CLARIFICATION"
        actor: ProjectManager
        preconditions:
          - "RFI.status == OPEN"
          - "RFI.clarification_rounds < MAX_CLARIFICATION_ROUNDS, else ERR_MAX_CLARIFICATION_ROUNDS"
        side_effects:
          - "RFI.status := RETURNED_FOR_CLARIFICATION; RFI.clarification_rounds incremented by 1"
          - "Project.open_rfi_count unchanged (RETURNED_FOR_CLARIFICATION still counts as open)"
      - from: RETURNED_FOR_CLARIFICATION
        to: OPEN
        trigger: "POST /rfis/{rfiId}/state with to_status=OPEN"
        actor: StaffArchitect
        preconditions:
          - "RFI.status == RETURNED_FOR_CLARIFICATION"
        side_effects:
          - "RFI.status := OPEN"
        note: "Cyclic: OPEN <-> RETURNED_FOR_CLARIFICATION, bounded by MAX_CLARIFICATION_ROUNDS = 2."
      - from: OPEN
        to: ANSWERED
        trigger: "POST /rfis/{rfiId}/state with to_status=ANSWERED (answer_text required)"
        actor: ProjectManager
        preconditions:
          - "RFI.status == OPEN"
          - "answer_text is present and non-empty, else ERR_INVALID_REQUEST"
        side_effects:
          - "RFI.status := ANSWERED; RFI.answer_text := answer_text; RFI.answered_at := logical clock"
          - "cascade: run calculations.rfi_rollup -> Project.open_rfi_count decremented by 1; then Project.ca_posture := CLEAR when open_rfi_count == 0 else DEFICIENT"
      - from: ANSWERED
        to: CLOSED
        trigger: "POST /rfis/{rfiId}/state with to_status=CLOSED"
        actor: ProjectManager
        preconditions:
          - "RFI.status == ANSWERED"
        side_effects:
          - "RFI.status := CLOSED"
      - from: OPEN
        to: VOID
        trigger: "POST /rfis/{rfiId}/state with to_status=VOID"
        actor: ProjectManager
        preconditions:
          - "RFI.status == OPEN"
        side_effects:
          - "RFI.status := VOID"
          - "cascade: Project.open_rfi_count decremented by 1; Project.ca_posture recomputed"

  - entity: Submittal
    initial_state: RECEIVED
    terminal_states: [APPROVED, APPROVED_AS_NOTED, REJECTED]
    transitions:
      - from: RECEIVED
        to: UNDER_REVIEW
        trigger: "POST /submittals/{submittalId}/state with to_status=UNDER_REVIEW"
        actor: ProjectManager
        preconditions:
          - "Submittal.status == RECEIVED"
          - "the Project's Contract.status == EXECUTED, else ERR_CONTRACT_NOT_EXECUTED"
          - "the ConsultantFirm's closed review-window occupancy at the proposed window is below concurrent_review_capacity, else ERR_CONSULTANT_REVIEW_CAPACITY (see validations priority 14)"
        side_effects:
          - "Submittal.review_started_at := logical clock"
          - "Submittal.review_due_at := output of calculations.submittal_review_due (variant chosen by Contract.review_clock_basis)"
          - "Submittal.status := UNDER_REVIEW; the submittal now occupies the closed interval [review_started_at, review_due_at] on its ConsultantFirm"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /submittals/{submittalId}/state with to_status=APPROVED"
        actor: ProjectManager
        preconditions:
          - "Submittal.status == UNDER_REVIEW"
        side_effects:
          - "Submittal.status := APPROVED; Submittal.review_notes := review_notes"
          - "the submittal releases its review window on the ConsultantFirm"
      - from: UNDER_REVIEW
        to: APPROVED_AS_NOTED
        trigger: "POST /submittals/{submittalId}/state with to_status=APPROVED_AS_NOTED"
        actor: ProjectManager
        preconditions:
          - "Submittal.status == UNDER_REVIEW"
        side_effects:
          - "Submittal.status := APPROVED_AS_NOTED; Submittal.review_notes := review_notes"
          - "the submittal releases its review window on the ConsultantFirm"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /submittals/{submittalId}/state with to_status=REJECTED"
        actor: ProjectManager
        preconditions:
          - "Submittal.status == UNDER_REVIEW"
        side_effects:
          - "Submittal.status := REJECTED; Submittal.review_notes := review_notes"
          - "the submittal releases its review window on the ConsultantFirm"
      - from: UNDER_REVIEW
        to: REVISE_AND_RESUBMIT
        trigger: "POST /submittals/{submittalId}/state with to_status=REVISE_AND_RESUBMIT"
        actor: ProjectManager
        preconditions:
          - "Submittal.status == UNDER_REVIEW"
        side_effects:
          - "Submittal.status := REVISE_AND_RESUBMIT; Submittal.review_notes := review_notes"
          - "the submittal releases its review window on the ConsultantFirm (review_started_at and review_due_at are cleared to null)"
      - from: REVISE_AND_RESUBMIT
        to: RECEIVED
        trigger: "POST /submittals/{submittalId}/state with to_status=RECEIVED"
        actor: ConsultantRep
        preconditions:
          - "Submittal.status == REVISE_AND_RESUBMIT"
          - "X-User-ID == Submittal.consultant_firm_id, else ERR_NOT_OWNER"
        side_effects:
          - "Submittal.status := RECEIVED; Submittal.revision_number incremented by 1; Submittal.review_notes := null"
        note: "Cyclic: RECEIVED -> UNDER_REVIEW -> REVISE_AND_RESUBMIT -> RECEIVED, unbounded revision loop."

  - entity: ChangeOrder
    initial_state: DRAFT
    terminal_states: [CLIENT_REJECTED, VOID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /change-orders/{changeOrderId}/state with to_status=SUBMITTED"
        actor: ProjectManager
        preconditions:
          - "ChangeOrder.status == DRAFT"
          - "the Contract.status == EXECUTED, else ERR_CONTRACT_NOT_EXECUTED"
        side_effects:
          - "ChangeOrder.status := SUBMITTED; ChangeOrder.submitted_by_user_id := X-User-ID"
      - from: SUBMITTED
        to: CLIENT_APPROVED
        trigger: "POST /change-orders/{changeOrderId}/state with to_status=CLIENT_APPROVED"
        actor: ClientRep
        preconditions:
          - "ChangeOrder.status == SUBMITTED"
          - "X-User-ID == Project.client_rep_user_id of the Contract's Project, else ERR_NOT_OWNER"
        side_effects:
          - "ChangeOrder.status := CLIENT_APPROVED"
          - "no fee change yet; Contract.total_fee_cents is untouched until execution"
        note: "Branch A of the fork; side-effect set differs from branch B."
      - from: SUBMITTED
        to: CLIENT_REJECTED
        trigger: "POST /change-orders/{changeOrderId}/state with to_status=CLIENT_REJECTED"
        actor: ClientRep
        preconditions:
          - "ChangeOrder.status == SUBMITTED"
          - "X-User-ID == Project.client_rep_user_id of the Contract's Project, else ERR_NOT_OWNER"
        side_effects:
          - "ChangeOrder.status := CLIENT_REJECTED (terminal)"
          - "Contract.total_fee_cents, Phase.fee_allocation_cents and Contract.version are all left unchanged"
        note: "Branch B of the fork; terminal, no fee cascade ever fires."
      - from: CLIENT_APPROVED
        to: EXECUTED
        trigger: "POST /change-orders/{changeOrderId}/execute"
        actor: PrincipalArchitect
        preconditions:
          - "ChangeOrder.status == CLIENT_APPROVED"
          - "expected_contract_version == Contract.version, else ERR_STALE_CONTRACT_VERSION (concurrency_rules.change-order-execute-stale-contract)"
          - "X-User-ID != ChangeOrder.submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "ChangeOrder.status := EXECUTED; executed_by_user_id := X-User-ID; executed_at := logical clock"
          - "cascade hop 1: Contract.total_fee_cents := base_fee_cents + sum(fee_delta_cents of EXECUTED ChangeOrders) -- i.e. increases by this order's fee_delta_cents"
          - "cascade hop 2: caused by the total_fee_cents change, run calculations.phase_fee_allocation -> every Phase of the Project has fee_allocation_cents rewritten"
          - "cascade hop 3: caused by the fee_allocation_cents change, every Phase.earned_cents := round_half_up(fee_allocation_cents * percent_complete / 100)"
          - "cascade hop 4: caused by the Phase.earned_cents change, run calculations.contract_fee_earned -> Contract.earned_to_date_cents; then Contract.wip_balance_cents := earned_to_date_cents - billed_fee_to_date_cents"
          - "Contract.version incremented by 1"
      - from: EXECUTED
        to: VOID
        trigger: "POST /change-orders/{changeOrderId}/state with to_status=VOID"
        actor: PrincipalArchitect
        preconditions:
          - "ChangeOrder.status == EXECUTED"
          - "no Invoice of the Contract has status == ISSUED with issued_at >= ChangeOrder.executed_at, else ERR_INVALID_STATE"
        side_effects:
          - "ChangeOrder.status := VOID"
          - "compensating cascade: Contract.total_fee_cents recomputed (this order's fee_delta_cents drops out), Phase.fee_allocation_cents re-allocated, Phase.earned_cents recomputed, Contract.earned_to_date_cents and wip_balance_cents recomputed"
          - "Contract.version incremented by 1"
        note: "Compensating edge for the execute cascade; leaves the invariant total_fee_cents == base_fee_cents + sum(EXECUTED deltas) intact."

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{invoiceId}/state with to_status=ISSUED"
        actor: ProjectManager
        preconditions:
          - "Invoice.status == DRAFT"
          - "the Contract's Project.status == ACTIVE, else ERR_PROJECT_NOT_ACTIVE (cross-entity: Invoice depends on Project)"
          - "after recomputation, Invoice.gross_cents > 0, else ERR_ZERO_INVOICE_AMOUNT"
        side_effects:
          - "run calculations.invoice_totals again against current state (derived-field reconciliation); fee_billed_cents, reimbursable_cents, gross_cents, retainage_bp, retainage_cents, net_due_cents are all rewritten and then frozen"
          - "Invoice.status := ISSUED; Invoice.issued_at := logical clock"
          - "cascade: every Expense on the Project with status == APPROVED, reimbursable == true and invoice_id IS NULL transitions APPROVED -> BILLED with invoice_id := Invoice.id"
          - "cascade: Contract.billed_fee_to_date_cents += Invoice.fee_billed_cents; Contract.wip_balance_cents := earned_to_date_cents - billed_fee_to_date_cents; Contract.version incremented by 1"
      - from: ISSUED
        to: VOID
        trigger: "POST /invoices/{invoiceId}/state with to_status=VOID"
        actor: PrincipalArchitect
        preconditions:
          - "Invoice.status == ISSUED"
          - "Invoice.payment_status == UNPAID, else ERR_INVOICE_ALREADY_PAID (parallel-dimension coupling)"
        side_effects:
          - "Invoice.status := VOID"
          - "compensating cascade: Contract.billed_fee_to_date_cents -= Invoice.fee_billed_cents; Contract.wip_balance_cents := earned_to_date_cents - billed_fee_to_date_cents; Contract.earned_to_date_cents is NOT touched; Contract.version incremented by 1"
          - "compensating cascade: every Expense whose invoice_id == Invoice.id transitions BILLED -> APPROVED with invoice_id := null"
      - from: DRAFT
        to: VOID
        trigger: "POST /invoices/{invoiceId}/state with to_status=VOID"
        actor: PrincipalArchitect
        preconditions:
          - "Invoice.status == DRAFT"
        side_effects:
          - "Invoice.status := VOID"
          - "no ledger effect: the draft never touched Contract.billed_fee_to_date_cents"

  - entity: Invoice
    initial_state: UNPAID
    terminal_states: [PAID]
    note: >-
      Second, independent state dimension on the same Invoice row (parallel dimensions).
      payment_status advances on POST /invoices/{invoiceId}/payments and never changes the
      status dimension; status transitions never change payment_status.
    transitions:
      - from: UNPAID
        to: PARTIALLY_PAID
        trigger: "POST /invoices/{invoiceId}/payments"
        actor: PrincipalArchitect
        preconditions:
          - "Invoice.status == ISSUED, else ERR_INVALID_STATE"
          - "amount_cents > 0"
          - "Invoice.amount_paid_cents + amount_cents <= Invoice.net_due_cents, else ERR_OVERPAYMENT"
          - "Invoice.amount_paid_cents + amount_cents < Invoice.net_due_cents"
        side_effects:
          - "Invoice.amount_paid_cents += amount_cents"
          - "Invoice.payment_status := PARTIALLY_PAID"
      - from: UNPAID
        to: PAID
        trigger: "POST /invoices/{invoiceId}/payments"
        actor: PrincipalArchitect
        preconditions:
          - "Invoice.status == ISSUED"
          - "Invoice.amount_paid_cents + amount_cents == Invoice.net_due_cents"
        side_effects:
          - "Invoice.amount_paid_cents += amount_cents"
          - "Invoice.payment_status := PAID"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /invoices/{invoiceId}/payments"
        actor: PrincipalArchitect
        preconditions:
          - "Invoice.status == ISSUED"
          - "Invoice.amount_paid_cents + amount_cents == Invoice.net_due_cents"
        side_effects:
          - "Invoice.amount_paid_cents += amount_cents"
          - "Invoice.payment_status := PAID"
      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /invoices/{invoiceId}/payments"
        actor: PrincipalArchitect
        preconditions:
          - "Invoice.status == ISSUED"
          - "Invoice.amount_paid_cents + amount_cents < Invoice.net_due_cents"
        side_effects:
          - "Invoice.amount_paid_cents += amount_cents"
          - "Invoice.payment_status stays PARTIALLY_PAID"

  - entity: PermitReview
    initial_state: PREPARING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PREPARING
        to: SUBMITTED
        trigger: "POST /permit-reviews/{permitReviewId}/state with to_status=SUBMITTED"
        actor: ProjectManager
        preconditions:
          - "PermitReview.status == PREPARING"
          - "the referenced Phase.phase_code == CD and Phase.status == COMPLETED, else ERR_PERMIT_PHASE_NOT_READY"
        side_effects:
          - "PermitReview.status := SUBMITTED; submission_round incremented by 1"
      - from: SUBMITTED
        to: COMMENTS_ISSUED
        trigger: "POST /permit-reviews/{permitReviewId}/state with to_status=COMMENTS_ISSUED (comment_count required)"
        actor: ProjectManager
        preconditions:
          - "PermitReview.status == SUBMITTED"
        side_effects:
          - "PermitReview.status := COMMENTS_ISSUED; PermitReview.comment_count := comment_count"
      - from: COMMENTS_ISSUED
        to: RESUBMITTED
        trigger: "POST /permit-reviews/{permitReviewId}/state with to_status=RESUBMITTED"
        actor: ProjectManager
        preconditions:
          - "PermitReview.status == COMMENTS_ISSUED"
        side_effects:
          - "PermitReview.status := RESUBMITTED; submission_round incremented by 1"
      - from: RESUBMITTED
        to: COMMENTS_ISSUED
        trigger: "POST /permit-reviews/{permitReviewId}/state with to_status=COMMENTS_ISSUED (comment_count required)"
        actor: ProjectManager
        preconditions:
          - "PermitReview.status == RESUBMITTED"
        side_effects:
          - "PermitReview.status := COMMENTS_ISSUED; PermitReview.comment_count := comment_count"
        note: "Cyclic: COMMENTS_ISSUED <-> RESUBMITTED, any number of rounds."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /permit-reviews/{permitReviewId}/state with to_status=APPROVED"
        actor: ProjectManager
        preconditions:
          - "PermitReview.status == SUBMITTED"
        side_effects:
          - "PermitReview.status := APPROVED; decided_at := logical clock"
          - "the Project's CA Phase becomes eligible for NOT_STARTED -> ACTIVE"
      - from: RESUBMITTED
        to: APPROVED
        trigger: "POST /permit-reviews/{permitReviewId}/state with to_status=APPROVED"
        actor: ProjectManager
        preconditions:
          - "PermitReview.status == RESUBMITTED"
        side_effects:
          - "PermitReview.status := APPROVED; decided_at := logical clock"
      - from: RESUBMITTED
        to: REJECTED
        trigger: "POST /permit-reviews/{permitReviewId}/state with to_status=REJECTED"
        actor: ProjectManager
        preconditions:
          - "PermitReview.status == RESUBMITTED"
        side_effects:
          - "PermitReview.status := REJECTED; decided_at := logical clock"

  - entity: FieldReport
    initial_state: FILED
    terminal_states: [FILED]
    note: >-
      FieldReport is an append-only event (common_fields: false) with a single logical state.
      It has no update or delete surface; its interest is the creation cascade below.
    transitions:
      - from: NONE
        to: FILED
        trigger: "POST /field-reports"
        actor: StaffArchitect
        preconditions:
          - "the Project's CA Phase exists and has status == ACTIVE, else ERR_CA_PHASE_NOT_ACTIVE (cross-entity: FieldReport depends on Phase)"
          - "the Project.status == ACTIVE, else ERR_PROJECT_NOT_ACTIVE"
        side_effects:
          - "FieldReport row is created (id, created_at only)"
          - "cascade hop 1: when deficiency_count >= 1, the system creates exactly one RFI with project_id := FieldReport.project_id, drawing_id := null, field_report_id := FieldReport.id, origin := FIELD_REPORT, status := OPEN, impacts_fee := false, subject := 'Field deficiency follow-up', rfi_number := next sequential number for the Project"
          - "cascade hop 2: caused by the RFI insert, run calculations.rfi_rollup -> Project.open_rfi_count incremented by 1"
          - "cascade hop 3: caused by the open_rfi_count change, Project.ca_posture := DEFICIENT when open_rfi_count > 0"
          - "cascade hop 4: caused by ca_posture == DEFICIENT, every ACTIVE Phase of the Project is now barred from ACTIVE -> COMPLETED until the RFI is answered or voided"
          - "when deficiency_count == 0, no RFI is created and no counter moves"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: invoice-create-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /invoices"
    occ_field: "expected_contract_version"
    description: |
      Creating an Invoice against a Contract whose version has advanced since the client
      last observed it is rejected. A draft Invoice claims the Contract's entire unbilled
      WIP; a second draft written from a stale view of the Contract would legitimately
      claim the same WIP a second time, so the server requires the writer to prove it saw
      the Contract as of its current version.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

  - rule_id: change-order-execute-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /change-orders/{changeOrderId}/execute"
    occ_field: "expected_contract_version"
    description: |
      Executing a ChangeOrder against a Contract whose version has advanced since the
      client last observed it is rejected. Execution rewrites Contract.total_fee_cents and
      re-allocates every Phase's fee, so a writer holding a stale view of the Contract
      would base its fee arithmetic on a superseded total.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: time_entry_amounts
    trigger: "POST /time-entries (creation); values are frozen on the row thereafter"
    algorithm: aggregation
    formula: |
      duration_seconds = end_utc - start_utc
      hours            = round_half_up(duration_seconds / 3600, 2)          # 2 decimal places
      cost_cents       = round_half_up(hours * StaffMember.cost_rate_cents_per_hour)
      billable_cents   = billable ? round_half_up(hours * StaffMember.billing_rate_cents_per_hour) : 0
    input_set: "the single TimeEntry being created, joined to its StaffMember for the two rates"
    constants: {}
    precision: "hours to 2 decimal places, round_half_up; money to whole cents, round_half_up"

  - name: phase_fee_allocation
    trigger: >-
      Contract DRAFT -> EXECUTED; ChangeOrder CLIENT_APPROVED -> EXECUTED (cascade hop 2);
      ChangeOrder EXECUTED -> VOID (compensating cascade). Writes Phase.fee_allocation_cents.
    algorithm: waterfall_allocation
    formula: |
      # Combinatorial mode (b): nested rounding where the ORDER is pinned.
      # "Round each phase, then let the last phase absorb the remainder" is the ONLY
      # sanctioned order. "Sum the unrounded shares then round" is explicitly WRONG and
      # produces a different cent total (it can overshoot Contract.total_fee_cents).
      ordered_phases = the Project's Phases sorted by phase_order ASC   # SD=1, DD=2, CD=3, CA=4
      running = 0
      for p in ordered_phases[0 : len-1]:                 # every phase EXCEPT the last
          p.fee_allocation_cents = round_half_up(Contract.total_fee_cents * p.weight_bp / 10000)
          running += p.fee_allocation_cents
      last = ordered_phases[len-1]                         # highest phase_order (CA)
      last.fee_allocation_cents = Contract.total_fee_cents - running     # absorbs the remainder
      # invariant: sum(p.fee_allocation_cents) == Contract.total_fee_cents, exactly
      for p in ordered_phases:
          p.earned_cents = round_half_up(p.fee_allocation_cents * p.percent_complete / 100)
    input_set: >-
      All 4 Phases of the Contract's Project regardless of Phase.status (COMPLETED phases are
      re-allocated too, and their earned_cents recomputed at percent_complete == 100).
    constants:
      PHASE_ORDER: { SD: 1, DD: 2, CD: 3, CA: 4 }
    precision: "whole cents, round_half_up; remainder assigned to the highest phase_order"

  - name: contract_fee_earned
    trigger: >-
      Contract DRAFT -> EXECUTED; Phase ACTIVE -> COMPLETED; PATCH /phases/{phaseId}
      (percent_complete change); TimeEntry SUBMITTED -> APPROVED and APPROVED -> SUBMITTED;
      ChangeOrder execute/void cascades. Writes Contract.earned_to_date_cents and then
      Contract.wip_balance_cents := earned_to_date_cents - billed_fee_to_date_cents.
    algorithm: forward_looking
    formula: |
      # Dual variant: the SAME Phases and the SAME APPROVED TimeEntries feed both branches
      # and yield different earned_to_date_cents.
      if Contract.fee_basis == PERCENT_OF_CONSTRUCTION:
          earned_to_date_cents = sum over ALL 4 Phases of
              round_half_up(Phase.fee_allocation_cents * Phase.percent_complete / 100)
          # TimeEntries do not enter this branch at all.
      else:  # HOURLY
          hourly_raw = sum of TimeEntry.billable_cents over TimeEntries t where
                       t.status == APPROVED and Phase(t.phase_id).project_id == Contract.project_id
                       # billable == false entries contribute billable_cents == 0
          earned_to_date_cents = min(hourly_raw, Contract.not_to_exceed_cents)
          # Phase.percent_complete does not enter this branch at all.
    input_set: >-
      PERCENT_OF_CONSTRUCTION: all Phases of the Project, any status.
      HOURLY: TimeEntries with status == APPROVED only (DRAFT, SUBMITTED and REJECTED excluded).
    constants: {}
    precision: "whole cents, round_half_up"
    variants:
      - name: percent_of_construction
        when: "Contract.fee_basis == PERCENT_OF_CONSTRUCTION"
        difference: >-
          Earned value is driven by Phase completion against the allocated fee; approved labour
          is irrelevant to the fee (it only drives Project.labor_cost_cents).
      - name: hourly_with_not_to_exceed
        when: "Contract.fee_basis == HOURLY"
        difference: >-
          Earned value is driven by approved billable labour at each StaffMember's billing rate,
          hard-capped at not_to_exceed_cents; Phase completion is irrelevant to the fee.

  - name: submittal_review_due
    trigger: "Submittal RECEIVED -> UNDER_REVIEW. Writes Submittal.review_due_at."
    algorithm: interval_merge
    formula: |
      # Dual variant on the SCHEDULE domain (not the money domain).
      start = Submittal.review_started_at      # == the logical clock at the transition
      n     = Contract.submittal_review_period_days
      if Contract.review_clock_basis == CALENDAR_DAYS:
          review_due_at = start + n * 24 hours
      else:  # BUSINESS_DAYS
          cursor = start
          advanced = 0
          while advanced < n:
              cursor = cursor + 24 hours
              if weekday(cursor) not in WEEKEND:      # Saturday, Sunday
                  advanced += 1
          review_due_at = cursor                      # time-of-day preserved
    input_set: "the single Submittal being started, joined to its Project's Contract for the basis and period"
    constants:
      WEEKEND: [SATURDAY, SUNDAY]
      DEFAULT_SUBMITTAL_REVIEW_PERIOD_DAYS: 14
    precision: "exact ISO 8601 UTC instant, milliseconds preserved from review_started_at"
    variants:
      - name: calendar_days
        when: "Contract.review_clock_basis == CALENDAR_DAYS"
        difference: "Weekends are counted; 14 days from Monday 2026-06-01T09:00:00Z lands on 2026-06-15T09:00:00Z."
      - name: business_days
        when: "Contract.review_clock_basis == BUSINESS_DAYS"
        difference: "Weekends are skipped; 14 business days from Monday 2026-06-01T09:00:00Z lands on 2026-06-19T09:00:00Z."

  - name: invoice_totals
    trigger: >-
      POST /invoices (draft computation) and again on Invoice DRAFT -> ISSUED (derived-field
      reconciliation against current state, after which the seven fields are frozen).
    algorithm: tiered_pricing
    formula: |
      # Combinatorial mode (c): a circular-LOOKING dependency, pinned to this exact order.
      # net_due depends on retainage; retainage depends on the retainage tier; the tier is
      # keyed on the cumulative fee billed INCLUDING this invoice. Evaluate 1..7 strictly.
      #
      # 1) billable fee earned (variant-aware)
      if Contract.fee_basis == PERCENT_OF_CONSTRUCTION:
          eligible = Phases of the Project where is_billing_milestone == true
                     and percent_complete >= BILLING_THRESHOLD_PCT      # >= 50, NOT > 50
          billable_fee_earned = sum of Phase.earned_cents over eligible
          if eligible is empty: reject with ERR_BILLING_THRESHOLD_NOT_MET
      else:  # HOURLY
          billable_fee_earned = Contract.earned_to_date_cents           # already NTE-capped
      fee_billed_cents = billable_fee_earned - Contract.billed_fee_to_date_cents
      if fee_billed_cents < 0: fee_billed_cents = 0
      # 2) reimbursables
      reimbursable_cents = sum of Expense.billable_cents over Expenses e where
                           e.project_id == Contract.project_id and e.status == APPROVED
                           and e.reimbursable == true and e.invoice_id IS NULL
      # 3) gross
      gross_cents = fee_billed_cents + reimbursable_cents
      # 4) cumulative fee AFTER this invoice  <-- the circular-looking input
      cumulative_after_cents = Contract.billed_fee_to_date_cents + fee_billed_cents
      # 5) tier selection, integer arithmetic only
      ratio_bp = floor(cumulative_after_cents * 10000 / Contract.total_fee_cents)
      retainage_bp = RETAINAGE_TIER_1_BP if ratio_bp <= 5000
                     else RETAINAGE_TIER_2_BP if ratio_bp <= 9000
                     else RETAINAGE_TIER_3_BP
      # 6) retainage on the GROSS (fee + reimbursables), not on the fee alone
      retainage_cents = round_half_up(gross_cents * retainage_bp / 10000)
      # 7) net
      net_due_cents = gross_cents - retainage_cents
    input_set: >-
      Phases with is_billing_milestone == true and percent_complete >= 50 (PERCENT basis only);
      Expenses with status == APPROVED, reimbursable == true and invoice_id IS NULL; ISSUED
      Invoices of the Contract (via Contract.billed_fee_to_date_cents). DRAFT and VOID Invoices
      contribute nothing.
    constants:
      BILLING_THRESHOLD_PCT: 50
      RETAINAGE_TIER_1_BP: 1000
      RETAINAGE_TIER_2_BP: 500
      RETAINAGE_TIER_3_BP: 0
    precision: "whole cents, round_half_up; ratio_bp uses integer floor division"

  - name: project_labor_rollup
    trigger: >-
      TimeEntry SUBMITTED -> APPROVED (cascade hop 1) and APPROVED -> SUBMITTED (compensating
      cascade hop 1). Writes Project.approved_hours, Project.labor_cost_cents and
      Project.budget_posture.
    algorithm: threshold
    formula: |
      approved_hours    = sum of t.hours      over TimeEntries t where t.status == APPROVED
                          and Phase(t.phase_id).project_id == Project.id      # 2 decimal places
      labor_cost_cents  = sum of t.cost_cents over the same set
      budget_posture    = OVER_BUDGET if labor_cost_cents >= Project.labor_budget_cents
                          else WITHIN_BUDGET
      # Boundary: exactly equal flips to OVER_BUDGET (>=, not >).
    input_set: "TimeEntries with status == APPROVED only; DRAFT, SUBMITTED and REJECTED entries contribute nothing"
    constants: {}
    precision: "hours to 2 decimal places; money to whole cents"

  - name: rfi_rollup
    trigger: >-
      RFI creation (POST /rfis and the FieldReport cascade), RFI OPEN -> ANSWERED, RFI OPEN ->
      VOID. Writes Project.open_rfi_count and Project.ca_posture.
    algorithm: aggregation
    formula: |
      open_rfi_count = count of RFIs r where r.project_id == Project.id
                       and r.status IN {OPEN, RETURNED_FOR_CLARIFICATION}
      ca_posture     = DEFICIENT if open_rfi_count > 0 else CLEAR
      # Empty-set boundary: open_rfi_count == 0 is the ONLY value that yields CLEAR, and
      # CLEAR is required for Phase ACTIVE -> COMPLETED.
    input_set: "RFIs of the Project whose status IN {OPEN, RETURNED_FOR_CLARIFICATION}; ANSWERED, CLOSED and VOID are excluded"
    constants:
      MAX_CLARIFICATION_ROUNDS: 2
    precision: "integer count"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present; X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the caller's X-User-Role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every resource named by a path parameter exists, validated left to right"
    error_id: ERR_PROJECT_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_PHASE_NOT_FOUND | ERR_DRAWING_NOT_FOUND | ERR_TIME_ENTRY_NOT_FOUND | ERR_EXPENSE_NOT_FOUND | ERR_RFI_NOT_FOUND | ERR_SUBMITTAL_NOT_FOUND | ERR_CHANGE_ORDER_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_PERMIT_REVIEW_NOT_FOUND | ERR_FIELD_REPORT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: business_constraint
    check: >-
      request body shape: required fields present, types correct, enum members valid,
      numeric ranges respected (amount_cents > 0, weight_bp in [0,10000], percent_complete
      in [0,100], concurrent_review_capacity >= 1, end_utc > start_utc, answer_text non-empty
      when to_status == ANSWERED, comment_count present when to_status == COMMENTS_ISSUED)
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 5
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row"
    error_id: ERR_PROJECT_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_PHASE_NOT_FOUND | ERR_STAFF_NOT_FOUND | ERR_CONSULTANT_NOT_FOUND | ERR_DRAWING_NOT_FOUND
    http_status: 404
    applies_to: "POST /contracts, POST /phases, POST /drawings, POST /time-entries, POST /expenses, POST /rfis, POST /submittals, POST /change-orders, POST /invoices, POST /permit-reviews, POST /field-reports, POST /projects"

  - priority: 6
    category: auth
    check: >-
      ownership scoping. ProjectManager: Project.project_manager_staff_id == X-User-ID for
      every write touching that Project (ERR_NOT_PROJECT_MANAGER). StaffArchitect: the
      staff_member_id on the TimeEntry / Expense / FieldReport being created == X-User-ID
      (ERR_NOT_OWNER). ConsultantRep: Submittal.consultant_firm_id == X-User-ID
      (ERR_NOT_OWNER). ClientRep: Project.client_rep_user_id == X-User-ID (ERR_NOT_OWNER).
    error_id: ERR_NOT_PROJECT_MANAGER | ERR_NOT_OWNER
    http_status: 403
    applies_to: "all write endpoints other than POST /projects, POST /staff, POST /consultants, POST /_clock/set_current_utc"

  - priority: 7
    category: auth
    check: >-
      segregation of duties. TimeEntry SUBMITTED -> APPROVED|REJECTED and Expense SUBMITTED ->
      APPROVED|REJECTED: X-User-ID != the row's staff_member_id. ChangeOrder execute:
      X-User-ID != ChangeOrder.submitted_by_user_id.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /time-entries/{timeEntryId}/state, POST /expenses/{expenseId}/state, POST /change-orders/{changeOrderId}/execute"

  - priority: 8
    category: state
    check: "expected_contract_version equals the current Contract.version"
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /invoices, POST /change-orders/{changeOrderId}/execute"

  - priority: 9
    category: state
    check: "the requested transition is declared in the entity's state machine from its current state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all /state endpoints, POST /change-orders/{changeOrderId}/execute, POST /invoices/{invoiceId}/payments, PATCH /phases/{phaseId}"

  - priority: 10
    category: business_referential
    check: >-
      cross-entity state gates. Phase activation and ChangeOrder submission and Submittal
      review-start require Contract.status == EXECUTED (ERR_CONTRACT_NOT_EXECUTED). Invoice
      issuance and FieldReport creation require Project.status == ACTIVE (ERR_PROJECT_NOT_ACTIVE).
      FieldReport creation requires the Project's CA Phase to be ACTIVE (ERR_CA_PHASE_NOT_ACTIVE).
      RFI creation with a drawing_id requires Drawing.status == ISSUED (ERR_DRAWING_NOT_ISSUED).
      Submittal creation requires ConsultantFirm.status == ACTIVE (ERR_CONSULTANT_SUSPENDED).
    error_id: ERR_CONTRACT_NOT_EXECUTED | ERR_PROJECT_NOT_ACTIVE | ERR_CA_PHASE_NOT_ACTIVE | ERR_DRAWING_NOT_ISSUED | ERR_CONSULTANT_SUSPENDED
    http_status: 409
    applies_to: "POST /phases/{phaseId}/state, POST /invoices/{invoiceId}/state, POST /field-reports, POST /rfis, POST /submittals, POST /submittals/{submittalId}/state, POST /change-orders/{changeOrderId}/state"

  - priority: 11
    category: business_safety
    check: >-
      code/permit compliance. Activating the CA Phase requires an APPROVED PermitReview on one
      of the Project's Phases (ERR_PERMIT_NOT_APPROVED). Submitting a PermitReview requires its
      Phase to be the CD phase in status COMPLETED (ERR_PERMIT_PHASE_NOT_READY).
    error_id: ERR_PERMIT_NOT_APPROVED | ERR_PERMIT_PHASE_NOT_READY
    http_status: 409
    applies_to: "POST /phases/{phaseId}/state, POST /permit-reviews, POST /permit-reviews/{permitReviewId}/state"

  - priority: 12
    category: business_constraint
    check: >-
      structural constraints. Phase.phase_code unique per project (ERR_DUPLICATE_PHASE_CODE).
      Phase activation requires the phase_order-1 sibling to be COMPLETED
      (ERR_PHASE_ORDER_VIOLATION). Contract execution requires the 4 phase weight_bp values to
      sum to exactly 10000 (ERR_PHASE_WEIGHTS_INVALID). RFI may not be returned for
      clarification more than MAX_CLARIFICATION_ROUNDS times (ERR_MAX_CLARIFICATION_ROUNDS).
      Drawing.sheet_number unique per phase (ERR_DUPLICATE_SHEET_NUMBER). ChangeOrder
      fee_delta_cents sign must match co_type (ERR_FEE_DELTA_SIGN). Project.project_number
      unique firm-wide (ERR_DUPLICATE_PROJECT_NUMBER). One Contract per Project
      (ERR_CONTRACT_ALREADY_EXISTS).
    error_id: ERR_DUPLICATE_PHASE_CODE | ERR_PHASE_ORDER_VIOLATION | ERR_PHASE_WEIGHTS_INVALID | ERR_MAX_CLARIFICATION_ROUNDS | ERR_DUPLICATE_SHEET_NUMBER | ERR_FEE_DELTA_SIGN | ERR_DUPLICATE_PROJECT_NUMBER | ERR_CONTRACT_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /projects, POST /contracts, POST /contracts/{contractId}/state, POST /phases, POST /phases/{phaseId}/state, POST /drawings, POST /rfis/{rfiId}/state, POST /change-orders"

  - priority: 13
    category: business_referential
    check: >-
      open-item gate. Phase ACTIVE -> COMPLETED requires Project.ca_posture == CLEAR, i.e.
      Project.open_rfi_count == 0 (the empty-set boundary). Project -> CLOSED requires the same.
    error_id: ERR_OPEN_RFIS_BLOCK_COMPLETION
    http_status: 409
    applies_to: "POST /phases/{phaseId}/state, POST /projects/{projectId}/state"

  - priority: 14
    category: business_temporal
    check: >-
      resource interval occupancy.
      (A) StaffMember timesheet, HALF-OPEN [start_utc, end_utc), capacity 1: a new TimeEntry is
      rejected when another TimeEntry on the SAME staff_member_id with status IN
      {DRAFT, SUBMITTED, APPROVED} satisfies new.start_utc < other.end_utc AND
      other.start_utc < new.end_utc. Touching endpoints (new.start_utc == other.end_utc) do NOT
      collide. REJECTED entries release their interval. (ERR_TIME_ENTRY_OVERLAP)
      (B) ConsultantFirm review desk, CLOSED [review_started_at, review_due_at], aggregate
      capacity N == ConsultantFirm.concurrent_review_capacity: starting review on a Submittal is
      rejected when the count of that firm's OTHER Submittals with status == UNDER_REVIEW whose
      closed window satisfies new.start <= other.due AND other.start <= new.due is >= N.
      Touching endpoints (new.start == other.due) DO collide. (ERR_CONSULTANT_REVIEW_CAPACITY)
    error_id: ERR_TIME_ENTRY_OVERLAP | ERR_CONSULTANT_REVIEW_CAPACITY
    http_status: 409
    applies_to: "POST /time-entries, POST /submittals/{submittalId}/state"

  - priority: 15
    category: business_fiscal
    check: >-
      money gates. Creating a TimeEntry on a Project whose budget_posture == OVER_BUDGET is
      rejected (ERR_LABOR_BUDGET_EXCEEDED). Creating an Invoice on a PERCENT_OF_CONSTRUCTION
      Contract with no Phase satisfying is_billing_milestone == true and percent_complete >= 50
      is rejected (ERR_BILLING_THRESHOLD_NOT_MET). An Invoice whose computed gross_cents == 0 is
      rejected at creation and again at issuance (ERR_ZERO_INVOICE_AMOUNT). A payment whose
      amount would push amount_paid_cents above net_due_cents is rejected (ERR_OVERPAYMENT).
      Voiding an Invoice whose payment_status != UNPAID is rejected (ERR_INVOICE_ALREADY_PAID).
    error_id: ERR_LABOR_BUDGET_EXCEEDED | ERR_BILLING_THRESHOLD_NOT_MET | ERR_ZERO_INVOICE_AMOUNT | ERR_OVERPAYMENT | ERR_INVOICE_ALREADY_PAID
    http_status: 409
    applies_to: "POST /time-entries, POST /invoices, POST /invoices/{invoiceId}/state, POST /invoices/{invoiceId}/payments"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- StaffMember / ConsultantFirm -----------------------------------------
  - method: POST
    path: "/staff"
    description: "Register a staff member. The returned id is the X-User-ID a ProjectManager or StaffArchitect authenticates with."
    roles: [PrincipalArchitect]
    code: 201
    input: [full_name, title, billing_rate_cents_per_hour, cost_rate_cents_per_hour, "active?"]
    output: StaffMember
    side_effects: []

  - method: POST
    path: "/consultants"
    description: "Register a consultant firm. The returned id is the X-User-ID a ConsultantRep authenticates with."
    roles: [PrincipalArchitect]
    code: 201
    input: [name, discipline, concurrent_review_capacity, "status?"]
    output: ConsultantFirm
    side_effects: []

  # ---- Project ---------------------------------------------------------------
  - method: POST
    path: "/projects"
    description: "Create a project in DRAFT."
    roles: [PrincipalArchitect]
    code: 201
    input: [project_number, name, client_rep_user_id, project_manager_staff_id, labor_budget_cents]
    output: Project
    side_effects: ["Project.status := DRAFT; all computed counters initialised to 0/WITHIN_BUDGET/CLEAR"]

  - method: GET
    path: "/projects"
    description: "List projects. Filtering by project_manager_staff_id resolves the StaffMember -> Project reverse link."
    roles: [PrincipalArchitect, ProjectManager, StaffArchitect, ConsultantRep, ClientRep]
    code: 200
    input: ["project_manager_staff_id?", "status?", "limit?", "offset?"]
    output: Project[]
    side_effects: []

  - method: GET
    path: "/projects/{projectId}"
    description: "Fetch a project including its computed counters and postures."
    roles: [PrincipalArchitect, ProjectManager, StaffArchitect, ConsultantRep, ClientRep]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: POST
    path: "/projects/{projectId}/state"
    description: "Suspend, reactivate or close a project."
    roles: [PrincipalArchitect]
    code: 200
    input: [to_status]
    output: Project
    side_effects: ["Project state machine transition; increments Project.version by 1"]

  - method: GET
    path: "/projects/{id}/phases"
    description: "List the project's phases (reverse link for Phase.project_id)."
    roles: [PrincipalArchitect, ProjectManager, StaffArchitect, ConsultantRep, ClientRep]
    code: 200
    input: []
    output: Phase[]
    side_effects: []

  - method: GET
    path: "/projects/{id}/contract"
    description: "The project's contract as an array of length 0 or 1 (reverse link for Contract.project_id)."
    roles: [PrincipalArchitect, ProjectManager, StaffArchitect, ConsultantRep, ClientRep]
    code: 200
    input: []
    output: Contract[]
    side_effects: []

  # ---- Contract --------------------------------------------------------------
  - method: POST
    path: "/contracts"
    description: "Create the project's single contract in DRAFT."
    roles: [PrincipalArchitect]
    code: 201
    input: [project_id, fee_basis, review_clock_basis, "construction_cost_estimate_cents?", "fee_rate_bp?", "not_to_exceed_cents?", "submittal_review_period_days?"]
    output: Contract
    side_effects: ["Contract.status := DRAFT; base_fee_cents, total_fee_cents, earned_to_date_cents, billed_fee_to_date_cents, wip_balance_cents all 0"]

  - method: GET
    path: "/contracts/{contractId}"
    description: "Fetch a contract, including version (used to supply expected_contract_version) and the WIP ledger fields."
    roles: [PrincipalArchitect, ProjectManager, StaffArchitect, ConsultantRep, ClientRep]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: POST
    path: "/contracts/{contractId}/state"
    description: "Execute or terminate a contract."
    roles: [PrincipalArchitect]
    code: 200
    input: [to_status]
    output: Contract
    side_effects:
      - "on EXECUTED: computes base_fee_cents and total_fee_cents, runs calculations.phase_fee_allocation over all 4 Phases, runs calculations.contract_fee_earned, cascades Project DRAFT -> ACTIVE"
      - "increments Contract.version by 1"

  - method: GET
    path: "/contracts/{id}/change-orders"
    description: "List the contract's change orders (reverse link for ChangeOrder.contract_id)."
    roles: [PrincipalArchitect, ProjectManager, StaffArchitect, ConsultantRep, ClientRep]
    code: 200
    input: []
    output: ChangeOrder[]
    side_effects: []

  - method: GET
    path: "/contracts/{id}/invoices"
    description: "List the contract's invoices (reverse link for Invoice.contract_id)."
    roles: [PrincipalArchitect, ProjectManager, StaffArchitect, ConsultantRep, ClientRep]
    code: 200
    input: []
    output: Invoice[]
    side_effects: []

  # ---- Phase -----------------------------------------------------------------
  - method: POST
    path: "/phases"
    description: "Add one of the four design phases to a project."
    roles: [ProjectManager, PrincipalArchitect]
    code: 201
    input: [project_id, phase_code, weight_bp, milestone_name, milestone_due_at, "is_billing_milestone?"]
    output: Phase
    side_effects: ["phase_order derived from phase_code; status := NOT_STARTED; percent_complete := 0"]

  - method: GET
    path: "/phases/{phaseId}"
    description: "Fetch a phase with its fee allocation and earned value."
    roles: [PrincipalArchitect, ProjectManager, StaffArchitect, ConsultantRep, ClientRep]
    code: 200
    input: []
    output: Phase
    side_effects: []

  - method: PATCH
    path: "/phases/{phaseId}"
    description: "Update a phase's percent_complete."
    roles: [ProjectManager]
    code: 200
    input: [percent_complete]
    output: Phase
    side_effects:
      - "Phase.earned_cents := round_half_up(fee_allocation_cents * percent_complete / 100)"
      - "runs calculations.contract_fee_earned; rewrites Contract.earned_to_date_cents and wip_balance_cents; increments Contract.version by 1"

  - method: POST
    path: "/phases/{phaseId}/state"
    description: "Activate, hold or complete a phase."
    roles: [ProjectManager, PrincipalArchitect]
    code: 200
    input: [to_status]
    output: Phase
    side_effects:
      - "on COMPLETED: percent_complete := 100, earned_cents := fee_allocation_cents, milestone_status := MET|MISSED, contract earned/WIP recomputed, Contract.version incremented by 1"

  - method: GET
    path: "/phases/{id}/drawings"
    description: "List the phase's drawings (reverse link for Drawing.phase_id)."
    roles: [PrincipalArchitect, ProjectManager, StaffArchitect, ConsultantRep, ClientRep]
    code: 200
    input: []
    output: Drawing[]
    side_effects: []

  - method: GET
    path: "/phases/{id}/permit-reviews"
    description: "List the phase's permit reviews (reverse link for PermitReview.phase_id)."
    roles: [PrincipalArchitect, ProjectManager, StaffArchitect, ConsultantRep, ClientRep]
    code: 200
    input: []
    output: PermitReview[]
    side_effects: []

  # ---- Drawing ---------------------------------------------------------------
  - method: POST
    path: "/drawings"
    description: "Add a sheet to the drawing log."
    roles: [ProjectManager, StaffArchitect]
    code: 201
    input: [phase_id, sheet_number, title]
    output: Drawing
    side_effects: ["status := IN_PROGRESS; revision := 0"]

  - method: POST
    path: "/drawings/{drawingId}/state"
    description: "Issue or supersede a drawing."
    roles: [ProjectManager, StaffArchitect]
    code: 200
    input: [to_status]
    output: Drawing
    side_effects: ["on SUPERSEDED -> ISSUED: revision incremented by 1"]

  # ---- TimeEntry -------------------------------------------------------------
  - method: POST
    path: "/time-entries"
    description: "Log time against a phase. Rejected when the staff member's half-open timesheet interval collides, or when the project is OVER_BUDGET."
    roles: [StaffArchitect, ProjectManager]
    code: 201
    input: [phase_id, staff_member_id, start_utc, end_utc, "billable?"]
    output: TimeEntry
    side_effects: ["runs calculations.time_entry_amounts -> hours, cost_cents, billable_cents; status := DRAFT"]

  - method: GET
    path: "/time-entries"
    description: "List time entries (reverse link for TimeEntry.phase_id and TimeEntry.staff_member_id)."
    roles: [PrincipalArchitect, ProjectManager, StaffArchitect, ConsultantRep, ClientRep]
    code: 200
    input: ["phase_id?", "staff_member_id?", "status?", "limit?", "offset?"]
    output: TimeEntry[]
    side_effects: []

  - method: GET
    path: "/time-entries/{timeEntryId}"
    description: "Fetch a time entry."
    roles: [PrincipalArchitect, ProjectManager, StaffArchitect, ConsultantRep, ClientRep]
    code: 200
    input: []
    output: TimeEntry
    side_effects: []

  - method: POST
    path: "/time-entries/{timeEntryId}/state"
    description: "Submit, approve, reject, or reverse (APPROVED -> SUBMITTED) a time entry."
    roles: [StaffArchitect, ProjectManager, PrincipalArchitect]
    code: 200
    input: [to_status]
    output: TimeEntry
    side_effects:
      - "on APPROVED: Project.approved_hours and Project.labor_cost_cents increase; Project.budget_posture recomputed; Contract earned/WIP recomputed (HOURLY basis); Contract.version incremented by 1"
      - "on APPROVED -> SUBMITTED: all of the above reversed exactly; Contract.version incremented by 1"

  # ---- Expense ---------------------------------------------------------------
  - method: POST
    path: "/expenses"
    description: "Log a reimbursable or non-reimbursable expense."
    roles: [StaffArchitect, ProjectManager]
    code: 201
    input: [project_id, staff_member_id, category, amount_cents, "reimbursable?", "markup_bp?"]
    output: Expense
    side_effects: ["billable_cents computed from amount_cents and markup_bp; status := SUBMITTED"]

  - method: GET
    path: "/expenses"
    description: "List expenses (reverse link for Expense.project_id, Expense.staff_member_id and Expense.invoice_id)."
    roles: [PrincipalArchitect, ProjectManager, StaffArchitect, ConsultantRep, ClientRep]
    code: 200
    input: ["project_id?", "staff_member_id?", "invoice_id?", "status?", "limit?", "offset?"]
    output: Expense[]
    side_effects: []

  - method: GET
    path: "/expenses/{expenseId}"
    description: "Fetch an expense."
    roles: [PrincipalArchitect, ProjectManager, StaffArchitect, ConsultantRep, ClientRep]
    code: 200
    input: []
    output: Expense
    side_effects: []

  - method: POST
    path: "/expenses/{expenseId}/state"
    description: "Approve or reject an expense."
    roles: [ProjectManager, PrincipalArchitect]
    code: 200
    input: [to_status]
    output: Expense
    side_effects: ["on APPROVED: the expense joins the unbilled reimbursable pool for the next invoice"]

  # ---- RFI -------------------------------------------------------------------
  - method: POST
    path: "/rfis"
    description: "Open an RFI against the project, optionally citing an ISSUED drawing."
    roles: [StaffArchitect, ProjectManager]
    code: 201
    input: [project_id, subject, "drawing_id?", "impacts_fee?"]
    output: RFI
    side_effects:
      - "rfi_number assigned sequentially per project; status := OPEN; origin := CONTRACTOR"
      - "Project.open_rfi_count incremented by 1; Project.ca_posture := DEFICIENT"

  - method: GET
    path: "/rfis"
    description: "List RFIs (reverse link for RFI.project_id, RFI.drawing_id and RFI.field_report_id). Filtering by field_report_id is the only discovery channel for cascade-created RFIs."
    roles: [PrincipalArchitect, ProjectManager, StaffArchitect, ConsultantRep, ClientRep]
    code: 200
    input: ["project_id?", "drawing_id?", "field_report_id?", "status?", "limit?", "offset?"]
    output: RFI[]
    side_effects: []

  - method: GET
    path: "/rfis/{rfiId}"
    description: "Fetch an RFI."
    roles: [PrincipalArchitect, ProjectManager, StaffArchitect, ConsultantRep, ClientRep]
    code: 200
    input: []
    output: RFI
    side_effects: []

  - method: POST
    path: "/rfis/{rfiId}/state"
    description: "Return for clarification, re-open, answer, close or void an RFI."
    roles: [ProjectManager, StaffArchitect]
    code: 200
    input: [to_status, "answer_text?"]
    output: RFI
    side_effects:
      - "on RETURNED_FOR_CLARIFICATION: clarification_rounds incremented by 1 (capped at MAX_CLARIFICATION_ROUNDS = 2)"
      - "on ANSWERED or VOID: Project.open_rfi_count decremented by 1; Project.ca_posture recomputed"

  # ---- Submittal -------------------------------------------------------------
  - method: POST
    path: "/submittals"
    description: "A consultant firm lodges a submittal for review."
    roles: [ConsultantRep]
    code: 201
    input: [project_id, consultant_firm_id, spec_section]
    output: Submittal
    side_effects: ["status := RECEIVED; revision_number := 0"]

  - method: GET
    path: "/submittals"
    description: "List submittals (reverse link for Submittal.project_id and Submittal.consultant_firm_id)."
    roles: [PrincipalArchitect, ProjectManager, StaffArchitect, ConsultantRep, ClientRep]
    code: 200
    input: ["project_id?", "consultant_firm_id?", "status?", "limit?", "offset?"]
    output: Submittal[]
    side_effects: []

  - method: GET
    path: "/submittals/{submittalId}"
    description: "Fetch a submittal, including its computed review_due_at."
    roles: [PrincipalArchitect, ProjectManager, StaffArchitect, ConsultantRep, ClientRep]
    code: 200
    input: []
    output: Submittal
    side_effects: []

  - method: POST
    path: "/submittals/{submittalId}/state"
    description: "Start review (occupying the firm's closed review window), record a review decision, or resubmit after REVISE_AND_RESUBMIT."
    roles: [ProjectManager, ConsultantRep]
    code: 200
    input: [to_status, "review_notes?"]
    output: Submittal
    side_effects:
      - "on UNDER_REVIEW: review_started_at := logical clock; review_due_at := calculations.submittal_review_due"
      - "on any decision: the firm's review window is released"
      - "on REVISE_AND_RESUBMIT -> RECEIVED: revision_number incremented by 1"

  # ---- ChangeOrder -----------------------------------------------------------
  - method: POST
    path: "/change-orders"
    description: "Draft an additional service or scope reduction against the contract."
    roles: [ProjectManager, PrincipalArchitect]
    code: 201
    input: [contract_id, title, co_type, fee_delta_cents, "source_rfi_number?"]
    output: ChangeOrder
    side_effects: ["status := DRAFT; no fee effect"]

  - method: POST
    path: "/change-orders/{changeOrderId}/state"
    description: "Submit a change order, record the client's approve/reject decision, or void an executed one."
    roles: [ProjectManager, PrincipalArchitect, ClientRep]
    code: 200
    input: [to_status]
    output: ChangeOrder
    side_effects:
      - "on SUBMITTED: submitted_by_user_id := X-User-ID"
      - "on CLIENT_REJECTED: terminal, no fee cascade"
      - "on EXECUTED -> VOID: compensating fee cascade; Contract.version incremented by 1"

  - method: POST
    path: "/change-orders/{changeOrderId}/execute"
    description: "Execute a client-approved change order. Requires the contract version the caller last observed, and an actor different from the submitter."
    roles: [PrincipalArchitect]
    code: 200
    input: [expected_contract_version]
    output: ChangeOrder
    side_effects:
      - "Contract.total_fee_cents := base_fee_cents + sum of EXECUTED fee_delta_cents"
      - "re-runs calculations.phase_fee_allocation over all 4 Phases; rewrites Phase.earned_cents"
      - "re-runs calculations.contract_fee_earned; rewrites Contract.earned_to_date_cents and wip_balance_cents"
      - "increments Contract.version by 1"

  # ---- Invoice ---------------------------------------------------------------
  - method: POST
    path: "/invoices"
    description: "Draft an invoice against the contract's unbilled WIP. Requires the contract version the caller last observed."
    roles: [ProjectManager, PrincipalArchitect]
    code: 201
    input: [contract_id, period_end, expected_contract_version]
    output: Invoice
    side_effects:
      - "runs calculations.invoice_totals -> fee_billed_cents, reimbursable_cents, gross_cents, retainage_bp, retainage_cents, net_due_cents"
      - "status := DRAFT; payment_status := UNPAID"
      - "increments Contract.version by 1"

  - method: POST
    path: "/invoices/{invoiceId}/state"
    description: "Issue or void an invoice."
    roles: [ProjectManager, PrincipalArchitect]
    code: 200
    input: [to_status]
    output: Invoice
    side_effects:
      - "on ISSUED: invoice_totals recomputed and frozen; approved unbilled reimbursable Expenses become BILLED; Contract.billed_fee_to_date_cents increases; wip_balance_cents recomputed; Contract.version incremented by 1"
      - "on ISSUED -> VOID: all of the above reversed exactly; Contract.earned_to_date_cents untouched; Contract.version incremented by 1"

  - method: POST
    path: "/invoices/{invoiceId}/payments"
    description: "Record a client payment; advances the payment_status dimension only."
    roles: [PrincipalArchitect]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["amount_paid_cents += amount_cents; payment_status := PARTIALLY_PAID or PAID (PAID when amount_paid_cents == net_due_cents)"]

  # ---- PermitReview ----------------------------------------------------------
  - method: POST
    path: "/permit-reviews"
    description: "Open a permit/code review package against the project's CD phase."
    roles: [ProjectManager]
    code: 201
    input: [phase_id, jurisdiction_name, permit_type]
    output: PermitReview
    side_effects: ["status := PREPARING; submission_round := 0"]

  - method: POST
    path: "/permit-reviews/{permitReviewId}/state"
    description: "Submit, record comments, resubmit, approve or reject a permit review."
    roles: [ProjectManager]
    code: 200
    input: [to_status, "comment_count?"]
    output: PermitReview
    side_effects:
      - "on SUBMITTED or RESUBMITTED: submission_round incremented by 1"
      - "on APPROVED: the project's CA phase becomes eligible for activation"

  # ---- FieldReport -----------------------------------------------------------
  - method: POST
    path: "/field-reports"
    description: "File a construction-administration field report. deficiency_count >= 1 auto-creates an RFI."
    roles: [StaffArchitect, ProjectManager]
    code: 201
    input: [project_id, staff_member_id, visit_date, weather, observations, deficiency_count]
    output: FieldReport
    side_effects:
      - "when deficiency_count >= 1: one RFI is created (origin FIELD_REPORT, status OPEN) — discoverable only via GET /rfis?field_report_id=..."
      - "Project.open_rfi_count incremented by 1 and Project.ca_posture := DEFICIENT in that case"

  - method: GET
    path: "/field-reports"
    description: "List field reports (reverse link for FieldReport.project_id and FieldReport.staff_member_id)."
    roles: [PrincipalArchitect, ProjectManager, StaffArchitect, ConsultantRep, ClientRep]
    code: 200
    input: ["project_id?", "staff_member_id?", "limit?", "offset?"]
    output: FieldReport[]
    side_effects: []

  - method: GET
    path: "/field-reports/{fieldReportId}"
    description: "Fetch a field report. Immutable: no update or delete surface exists."
    roles: [PrincipalArchitect, ProjectManager, StaffArchitect, ConsultantRep, ClientRep]
    code: 200
    input: []
    output: FieldReport
    side_effects: []

  # ---- Test-driving endpoint --------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: >-
      Set the server's logical clock. Before the first call the logical clock reads exactly
      2026-05-01T00:00:00Z and never falls back to wall-clock time. Every timestamp the server
      stamps (Submittal.review_started_at / review_due_at, RFI.answered_at, Invoice.issued_at,
      ChangeOrder.executed_at, PermitReview.decided_at, Phase.milestone_status evaluation)
      reads this clock.
    roles: [PrincipalArchitect]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["logical clock repositioned; no entity is mutated"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the caller's role is not listed on the endpoint"
  - id: ERR_NOT_PROJECT_MANAGER
    http: 403
    condition: "a ProjectManager writes against a Project whose project_manager_staff_id != X-User-ID"
  - id: ERR_NOT_OWNER
    http: 403
    condition: "a StaffArchitect acts for another staff member, a ConsultantRep acts for another firm, or a ClientRep decides on a project whose client_rep_user_id != X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the actor approving a TimeEntry/Expense is its staff_member_id, or the actor executing a ChangeOrder is its submitted_by_user_id"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "referenced Project id does not exist"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "referenced Contract id does not exist"
  - id: ERR_PHASE_NOT_FOUND
    http: 404
    condition: "referenced Phase id does not exist"
  - id: ERR_STAFF_NOT_FOUND
    http: 404
    condition: "referenced StaffMember id does not exist"
  - id: ERR_CONSULTANT_NOT_FOUND
    http: 404
    condition: "referenced ConsultantFirm id does not exist"
  - id: ERR_DRAWING_NOT_FOUND
    http: 404
    condition: "referenced Drawing id does not exist"
  - id: ERR_TIME_ENTRY_NOT_FOUND
    http: 404
    condition: "referenced TimeEntry id does not exist"
  - id: ERR_EXPENSE_NOT_FOUND
    http: 404
    condition: "referenced Expense id does not exist"
  - id: ERR_RFI_NOT_FOUND
    http: 404
    condition: "referenced RFI id does not exist"
  - id: ERR_SUBMITTAL_NOT_FOUND
    http: 404
    condition: "referenced Submittal id does not exist"
  - id: ERR_CHANGE_ORDER_NOT_FOUND
    http: 404
    condition: "referenced ChangeOrder id does not exist"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "referenced Invoice id does not exist"
  - id: ERR_PERMIT_REVIEW_NOT_FOUND
    http: 404
    condition: "referenced PermitReview id does not exist"
  - id: ERR_FIELD_REPORT_NOT_FOUND
    http: 404
    condition: "referenced FieldReport id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, invalid enum member, or out-of-range numeric value"
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_contract_version does not equal the current Contract.version on POST /invoices or POST /change-orders/{changeOrderId}/execute"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition is not declared from the entity's current state"
  - id: ERR_CONTRACT_NOT_EXECUTED
    http: 409
    condition: "phase activation, change-order submission or submittal review-start attempted while Contract.status != EXECUTED"
  - id: ERR_PROJECT_NOT_ACTIVE
    http: 409
    condition: "invoice issuance or field-report filing attempted while Project.status != ACTIVE"
  - id: ERR_CA_PHASE_NOT_ACTIVE
    http: 409
    condition: "a field report is filed while the project's CA phase is not ACTIVE"
  - id: ERR_DRAWING_NOT_ISSUED
    http: 409
    condition: "an RFI cites a drawing whose status != ISSUED"
  - id: ERR_CONSULTANT_SUSPENDED
    http: 409
    condition: "a submittal is lodged for a ConsultantFirm whose status == SUSPENDED"
  - id: ERR_PERMIT_NOT_APPROVED
    http: 409
    condition: "the CA phase is activated while the project has no PermitReview in status APPROVED"
  - id: ERR_PERMIT_PHASE_NOT_READY
    http: 409
    condition: "a permit review is created against a non-CD phase, or submitted while its CD phase is not COMPLETED"
  - id: ERR_DUPLICATE_PROJECT_NUMBER
    http: 409
    condition: "project_number already used by another Project"
  - id: ERR_CONTRACT_ALREADY_EXISTS
    http: 409
    condition: "a second Contract is created for a Project that already has one"
  - id: ERR_DUPLICATE_PHASE_CODE
    http: 409
    condition: "phase_code already exists on the Project"
  - id: ERR_PHASE_WEIGHTS_INVALID
    http: 409
    condition: "at contract execution the Project does not have exactly 4 phases whose weight_bp sums to 10000"
  - id: ERR_PHASE_ORDER_VIOLATION
    http: 409
    condition: "a phase is activated while the phase with phase_order - 1 is not COMPLETED"
  - id: ERR_OPEN_RFIS_BLOCK_COMPLETION
    http: 409
    condition: "a phase is completed (or a project closed) while Project.open_rfi_count > 0"
  - id: ERR_MAX_CLARIFICATION_ROUNDS
    http: 409
    condition: "an RFI is returned for clarification when clarification_rounds already equals MAX_CLARIFICATION_ROUNDS (2)"
  - id: ERR_DUPLICATE_SHEET_NUMBER
    http: 409
    condition: "sheet_number already exists on the Phase"
  - id: ERR_FEE_DELTA_SIGN
    http: 409
    condition: "fee_delta_cents <= 0 for ADDITIONAL_SERVICE, or >= 0 for SCOPE_REDUCTION"
  - id: ERR_TIME_ENTRY_OVERLAP
    http: 409
    condition: "a new TimeEntry's half-open [start_utc, end_utc) interval strictly overlaps a non-REJECTED entry on the same staff_member_id"
  - id: ERR_CONSULTANT_REVIEW_CAPACITY
    http: 409
    condition: "starting a submittal review would give the ConsultantFirm more than concurrent_review_capacity overlapping closed review windows"
  - id: ERR_LABOR_BUDGET_EXCEEDED
    http: 409
    condition: "a TimeEntry is created on a Project whose budget_posture == OVER_BUDGET"
  - id: ERR_BILLING_THRESHOLD_NOT_MET
    http: 409
    condition: "an invoice is drafted on a PERCENT_OF_CONSTRUCTION contract with no billing-milestone phase at percent_complete >= 50"
  - id: ERR_ZERO_INVOICE_AMOUNT
    http: 409
    condition: "an invoice's computed gross_cents == 0 at draft or at issuance"
  - id: ERR_OVERPAYMENT
    http: 409
    condition: "a payment would push Invoice.amount_paid_cents above Invoice.net_due_cents"
  - id: ERR_INVOICE_ALREADY_PAID
    http: 409
    condition: "an ISSUED invoice with payment_status != UNPAID is voided"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PrincipalArchitect
    description: "Firm principal. Owns the master data, the contract ledger and the money surface."
    identity: opaque
    exclusive_operations:
      - "POST /staff"
      - "POST /consultants"
      - "POST /projects"
      - "POST /projects/{projectId}/state"
      - "POST /contracts"
      - "POST /contracts/{contractId}/state"
      - "POST /change-orders/{changeOrderId}/execute"
      - "POST /invoices/{invoiceId}/payments"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /phases (with ProjectManager)"
      - "POST /phases/{phaseId}/state (with ProjectManager)"
      - "POST /time-entries/{timeEntryId}/state (with StaffArchitect, ProjectManager)"
      - "POST /expenses/{expenseId}/state (with ProjectManager)"
      - "POST /change-orders (with ProjectManager)"
      - "POST /change-orders/{changeOrderId}/state (with ProjectManager, ClientRep)"
      - "POST /invoices (with ProjectManager)"
      - "POST /invoices/{invoiceId}/state (with ProjectManager)"
      - "all GET endpoints"

  - name: ProjectManager
    description: "The StaffMember named in Project.project_manager_staff_id. Runs the project's phases, logs, reviews and billing."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "PATCH /phases/{phaseId}"
      - "POST /permit-reviews"
      - "POST /permit-reviews/{permitReviewId}/state"
    shared_operations:
      - "POST /phases (with PrincipalArchitect)"
      - "POST /phases/{phaseId}/state (with PrincipalArchitect)"
      - "POST /drawings, POST /drawings/{drawingId}/state (with StaffArchitect)"
      - "POST /time-entries, POST /time-entries/{timeEntryId}/state (with StaffArchitect)"
      - "POST /expenses, POST /expenses/{expenseId}/state (with StaffArchitect, PrincipalArchitect)"
      - "POST /rfis, POST /rfis/{rfiId}/state (with StaffArchitect)"
      - "POST /submittals/{submittalId}/state (with ConsultantRep)"
      - "POST /change-orders, POST /change-orders/{changeOrderId}/state (with PrincipalArchitect, ClientRep)"
      - "POST /invoices, POST /invoices/{invoiceId}/state (with PrincipalArchitect)"
      - "POST /field-reports (with StaffArchitect)"
      - "all GET endpoints"
    note: >-
      Every ProjectManager write is scoped by Project.project_manager_staff_id == X-User-ID
      (ERR_NOT_PROJECT_MANAGER). A ProjectManager may never approve a TimeEntry or Expense whose
      staff_member_id == their own X-User-ID (ERR_SEGREGATION_OF_DUTIES) — a PrincipalArchitect
      must approve those.

  - name: StaffArchitect
    description: "A StaffMember producing work: time, expenses, drawings, RFIs and field reports."
    identity: "entity_backed:StaffMember"
    exclusive_operations: []
    shared_operations:
      - "POST /time-entries (own staff_member_id only), POST /time-entries/{timeEntryId}/state (DRAFT -> SUBMITTED only)"
      - "POST /expenses (own staff_member_id only)"
      - "POST /drawings, POST /drawings/{drawingId}/state"
      - "POST /rfis, POST /rfis/{rfiId}/state"
      - "POST /field-reports (own staff_member_id only)"
      - "all GET endpoints"

  - name: ConsultantRep
    description: "A ConsultantFirm lodging and revising submittals."
    identity: "entity_backed:ConsultantFirm"
    exclusive_operations:
      - "POST /submittals"
    shared_operations:
      - "POST /submittals/{submittalId}/state (REVISE_AND_RESUBMIT -> RECEIVED only; review decisions belong to ProjectManager)"
      - "all GET endpoints"

  - name: ClientRep
    description: "The client's representative, identified by Project.client_rep_user_id. Renders the client decision on change orders."
    identity: opaque
    exclusive_operations:
      - "POST /change-orders/{changeOrderId}/state with to_status IN {CLIENT_APPROVED, CLIENT_REJECTED}"
    shared_operations:
      - "all GET endpoints"
