  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: royalty_report_review_and_settlement_dimensions_advance_independently
        grounds:
          - state_machines.RoyaltyReport.review_status
          - state_machines.RoyaltyReport.settlement_status
          - entities.RoyaltyReport.fields.revision_no
          - entities.RoyaltyReport.fields.booked_amount_cents
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          RoyaltyReport carries two orthogonal state dimensions on one row and
          its review dimension has no terminal state at all
          (terminal_states: []): the ACCEPTED -> DISPUTED -> DRAFT -> SUBMITTED
          -> ACCEPTED loop can be walked repeatedly while settlement_status
          stays UNSETTLED, and the later settle advances only the settlement
          dimension. A linear reading of either dimension mispredicts the pair.
        test_recipe:
          setup:
            - "The royalty base chain: Variety with base_royalty_cents_per_plant 35 and regional_performance_index 0.00, Propagator, ACTIVE TIER_A PropagatorAgreement countersigned by officer-1, ACTIVE DOMESTIC ProductionQuota with allocated_units 20000."
            - "A TagOrder for 12000 units, ISSUED then RECONCILED with activated_units 12000."
            - "A DRAFT RoyaltyReport with one line item of reported_units 12000, which matches the tag activations exactly so no overrun penalty is ever raised and compliance_score stays 100."
            - "Logical clock still at its 2026-08-01T00:00:00Z default, so the report is never late."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Harbor Amber", species: "Malus domestica", breeder_code: "HA", royalty_basis_default: "PER_PLANT", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
