            - call: "POST /accreditation/rounding-sessions/${y4_rs}/deficiencies"
              payload: { standard_id: "${y4_s1}", description: "Sprinkler head obstruction 3", severity: "HIGH" }
              as: SafetyOfficer
            - call: "POST /accreditation/rounding-sessions/${y4_rs}/deficiencies"
              payload: { standard_id: "${y4_s1}", description: "Sprinkler head obstruction 4", severity: "HIGH" }
              as: SafetyOfficer
            - call: "POST /accreditation/rounding-sessions/${y4_rs}/deficiencies"
              payload: { standard_id: "${y4_s1}", description: "Sprinkler head obstruction 5", severity: "HIGH" }
              as: SafetyOfficer
            - call: "POST /accreditation/rounding-sessions/${y4_rs}/deficiencies"
              payload: { standard_id: "${y4_s1}", description: "Sprinkler head obstruction 6", severity: "HIGH" }
              as: SafetyOfficer
              captures: { y4_k6: $.data.id, y4_k6_pts: $.data.penalty_points }
          trigger:
            - call: "GET /accreditation/units/${y4_u}"
              as: AccreditationDirector
              captures: { y4_u_pts: $.data.open_deficiency_penalty_points, y4_u_posture: $.data.posture }
            - call: "GET /accreditation/units/${y4_u}/readiness"
              as: AccreditationDirector
              captures: { y4_base: $.data.base_score, y4_applied: $.data.penalty_points_applied, y4_score2: $.data.readiness_score, y4_band: $.data.readiness_band }
          assert:
            - "${y4_score} == 78.00 and ${y4_k6_pts} == 7 (SEVERITY_POINTS HIGH)"
            - "${y4_u_pts} == 42 (uncapped ledger) and ${y4_u_posture} == RESTRICTED (42 >= POSTURE_RESTRICT_POINTS 15)"
            - "${y4_base} == 78.00, ${y4_applied} == 40 (PENALTY_CAP), ${y4_score2} == 38.00 and ${y4_band} == NOT_READY"
            - "Removing one ticket by VERIFY would leave 35 points and score 43.00, so the cap is not a floor on the ledger"

      - name: scheduled_action_eligibility_flips_at_exact_predicted_open_date
        claim_type: scheduled_actions
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - state_machines.SurveyWindow.PROJECTED_to_ELIGIBLE
          - calculations.survey_window_prediction.formula
        distinguishing_aspect: "One day before predicted_open_date 2026-09-15 the clock sweep reports eligible_window_count 0 and the window is still PROJECTED; at exactly 2026-09-15 it reports 1 and the window is ELIGIBLE, so the boundary is inclusive and driven by the clock rather than by an explicit transition."
        test_recipe:
          setup:
            - "Survey CYCLE-2026 from prior_survey_end_date 2025-03-15, predicted_open_date 2026-09-15; clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /accreditation/survey-windows"
              payload: { cycle_label: "CYCLE-2026", prior_survey_end_date: "2025-03-15T00:00:00Z" }
              as: AccreditationDirector
              captures: { y5_sw: $.data.id, y5_open: $.data.predicted_open_date }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T23:59:59Z" }
              as: AccreditationDirector
              captures: { y5_e1: $.data.eligible_window_count }
            - call: "GET /accreditation/survey-windows/${y5_sw}"
              as: AccreditationDirector
              captures: { y5_ws1: $.data.window_state }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: AccreditationDirector
              captures: { y5_e2: $.data.eligible_window_count }
            - call: "GET /accreditation/survey-windows/${y5_sw}"
              as: AccreditationDirector
              captures: { y5_ws2: $.data.window_state }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: AccreditationDirector
              captures: { y5_e3: $.data.eligible_window_count }
          assert:
            - "${y5_open} == 2026-09-15T00:00:00.000Z"
            - "${y5_e1} == 0 and ${y5_ws1} == PROJECTED"
            - "${y5_e2} == 1 and ${y5_ws2} == ELIGIBLE"
            - "${y5_e3} == 0 - the count reports windows made eligible by THIS advance, and the window stays ELIGIBLE"

      - name: pagination_with_filtering_state_and_offset
        claim_type: pagination_with_filtering
        grounds:
          - endpoints[GET /accreditation/deficiency-tickets]
          - validations[priority=4]
        distinguishing_aspect: "With three LOW tickets of which one is IN_PROGRESS, state=OPEN plus limit 1 offset 1 returns total_count 2 (the filtered total, not 3) with exactly one row and has_more false."
        test_recipe:
          setup:
            - "Unit MED-18 with one ENVIRONMENT_OF_CARE session holding three LOW tickets; the first is moved to IN_PROGRESS."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "EC", name: "Environment of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { y6_ch: $.data.id }
            - call: "POST /accreditation/chapters/${y6_ch}/standards"
              payload: { standard_code: "EC.02.06.01", title: "Safe environment", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { y6_s1: $.data.id }
            - call: "POST /accreditation/units"
              payload: { name: "MED-18", unit_type: "MED_SURG", bed_count: 24 }
              as: AccreditationDirector
              captures: { y6_u: $.data.id }
            - call: "POST /accreditation/rounding-sessions"
              payload: { unit_id: "${y6_u}", round_type: "ENVIRONMENT_OF_CARE", window_start: "2026-08-01T08:00:00Z", window_end: "2026-08-01T12:00:00Z" }
              as: SafetyOfficer
              captures: { y6_rs: $.data.id }
            - call: "POST /accreditation/rounding-sessions/${y6_rs}/deficiencies"
              payload: { standard_id: "${y6_s1}", description: "Dust on supply vent", severity: "LOW" }
              as: SafetyOfficer
              captures: { y6_k1: $.data.id }
            - call: "POST /accreditation/rounding-sessions/${y6_rs}/deficiencies"
              payload: { standard_id: "${y6_s1}", description: "Cluttered equipment alcove", severity: "LOW" }
              as: SafetyOfficer
              captures: { y6_k2: $.data.id }
            - call: "POST /accreditation/rounding-sessions/${y6_rs}/deficiencies"
              payload: { standard_id: "${y6_s1}", description: "Expired signage", severity: "LOW" }
              as: SafetyOfficer
              captures: { y6_k3: $.data.id }
            - call: "POST /accreditation/deficiency-tickets/${y6_k1}/transition"
              payload: { action: "START_WORK", note: "Cleaning scheduled" }
              as: SafetyOfficer
              captures: { y6_k1_state: $.data.state }
          trigger:
            - call: "GET /accreditation/deficiency-tickets"
              payload: { state: "OPEN", limit: 1, offset: 1 }
              as: SafetyOfficer
              captures: { y6_row: "$.data[0].id", y6_row_state: "$.data[0].state" }
            - call: "GET /accreditation/deficiency-tickets"
              payload: { rounding_session_id: "${y6_rs}", severity: "LOW", limit: 10, offset: 0 }
              as: SafetyOfficer
              captures: { y6_first: "$.data[0].id" }
          assert:
            - "${y6_k1_state} == IN_PROGRESS"
            - "The filtered page returns total_count 2, has_more false, exactly one row, and ${y6_row} == ${y6_k3} with ${y6_row_state} == OPEN"
            - "The session-scoped call returns total_count 3 and ${y6_first} == ${y6_k1} (creation order, IN_PROGRESS included)"
            - "HospitalUnit.${y6_u}.open_deficiency_penalty_points == 3 (three LOW tickets, IN_PROGRESS still counted)"

      - name: cascading_side_effects_three_level_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / life_safety_escalation_cascades_to_tracer_abort
          rationale: "The ticket to unit-posture to tracer-abort chain, its ordering and the untouched IN_PROGRESS tracer are asserted there."

      - name: dual_variant_calculation_delta_on_switch
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: dual_variant_calc / unit_readiness_attested_vs_projected_penalty_set
          rationale: "Both variants on one data set and the exact delta between them are asserted there."

  # =========================================================================
  # Guide section 9 - Consistency model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: deficiency_creation_is_immediately_visible_everywhere
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.HospitalUnit.fields.open_deficiency_penalty_points
          - endpoints[GET /accreditation/units/{id}/readiness]
        distinguishing_aspect: "The creating response already carries due_at and penalty_points, and the very next reads - with no retry, sleep or second write - show the unit ledger at 7 and readiness at 71.00, so no denormalised field lags."
        test_recipe:
          setup:
            - "The 78.00 fixture on unit ICU-19 (chapter EC weight 100, tracer COMPLETED with 39 of 50) at clock 2026-08-10T09:00:00Z, no tickets yet."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "EC", name: "Environment of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { z1_ch: $.data.id }
            - call: "POST /accreditation/chapters/${z1_ch}/standards"
              payload: { standard_code: "EC.02.06.01", title: "Safe environment", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { z1_s1: $.data.id }
            - call: "POST /accreditation/chapters/${z1_ch}/standards"
              payload: { standard_code: "EC.02.05.01", title: "Utility systems", risk_tier: "INDIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { z1_s2: $.data.id }
            - call: "POST /accreditation/standards/${z1_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/units"
              payload: { name: "ICU-19", unit_type: "ICU", bed_count: 12 }
              as: AccreditationDirector
              captures: { z1_u: $.data.id, z1_u_v1: $.data.version }
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${z1_u}", chapter_id: "${z1_ch}", tracer_type: "PATIENT", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z", expected_unit_version: "${z1_u_v1}" }
              as: TracerSurveyor
              captures: { z1_t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/mock-tracers/${z1_t}/transition"
              payload: { action: "START" }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${z1_t}/observations"
              payload: { standard_id: "${z1_s1}", result: "COMPLIANT", weight: 39 }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${z1_t}/observations"
              payload: { standard_id: "${z1_s2}", result: "NON_COMPLIANT", weight: 11 }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${z1_t}/transition"
              payload: { action: "COMPLETE" }
              as: TracerSurveyor
            - call: "GET /accreditation/units/${z1_u}/readiness"
              as: AccreditationDirector
              captures: { z1_before: $.data.readiness_score, z1_band_before: $.data.readiness_band }
            - call: "POST /accreditation/rounding-sessions"
              payload: { unit_id: "${z1_u}", round_type: "LIFE_SAFETY", window_start: "2026-08-10T13:00:00Z", window_end: "2026-08-10T15:00:00Z" }
              as: SafetyOfficer
              captures: { z1_rs: $.data.id }
          trigger:
            - call: "POST /accreditation/rounding-sessions/${z1_rs}/deficiencies"
              payload: { standard_id: "${z1_s1}", description: "Sprinkler head obstruction", severity: "HIGH" }
              as: SafetyOfficer
              captures: { z1_k: $.data.id, z1_k_due: $.data.due_at, z1_k_pts: $.data.penalty_points, z1_k_acc: $.data.accelerated }
            - call: "GET /accreditation/units/${z1_u}"
              as: SafetyOfficer
              captures: { z1_u_pts: $.data.open_deficiency_penalty_points, z1_u_posture: $.data.posture }
            - call: "GET /accreditation/units/${z1_u}/readiness"
              as: SafetyOfficer
              captures: { z1_after: $.data.readiness_score, z1_applied: $.data.penalty_points_applied, z1_band_after: $.data.readiness_band }
          assert:
            - "${z1_before} == 78.00 and ${z1_band_before} == CONDITIONAL"
            - "${z1_k_pts} == 7, ${z1_k_acc} == false (band snapshot CONDITIONAL) and ${z1_k_due} == 2026-08-24T09:00:00.000Z (clock + 14 x 24h)"
            - "${z1_u_pts} == 7 and ${z1_u_posture} == OPEN on the first read after the write, with no retry"
            - "${z1_after} == 71.00, ${z1_applied} == 7 and ${z1_band_after} == AT_RISK in the same uninterrupted sequence"
