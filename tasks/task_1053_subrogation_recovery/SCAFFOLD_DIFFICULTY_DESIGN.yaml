            - call: "POST /subro/claims"
              payload: { carrier_id: "${carrier_id}", adverse_party_id: "${ap_id}", claim_reference: "CLM-14B", loss_date: "2026-05-01T00:00:00Z", paid_loss_cents: 2500000, deductible_cents: 500000, total_damages_cents: 4000000, statute_deadline: "2028-01-01T00:00:00Z" }
              as: CarrierUser
