          - entities.DeliveryAppointment.fields.window_start
          - entities.DeliveryAppointment.fields.window_end
        distinguishing_aspect: "Dock overlap uses half-open [start,end) geometric intersection with capacity 1 and adjacency allowed: appt2 08:00-10:00 exists, a 09:00-11:00 request intersects and is rejected with ERR_DOCK_DOUBLE_BOOKED — pure interval-intersection semantics on the Dock resource, distinct from the crew's buffer-gap semantics."
