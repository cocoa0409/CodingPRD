# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Breadth Coverage Index
# Task 2999 — Otolaryngology Practice, Allergy Testing & Balloon Sinuplasty
#
# The nine `section:` values and every `claim_type:` value below come from
# references/claim-extraction-guide.md; no category is invented here. Corners
# that §1.8 already probes in depth appear as `excluded_because:` stubs naming
# the covering `scaffold_difficulty_design` instance.
#
# Every chain starts from an empty database. The logical clock starts at exactly
# 2026-08-01T00:00:00Z and only POST /_clock/set_current_utc moves it. Every
# numeric literal in an `assert:` line was produced by executing the relevant
# calculations[].formula with its declared constants as code.
#
# Fixture user ids: u_admin_1/2 (PracticeAdmin), u_ent_1/2 (Otolaryngologist),
# u_nurse_1/2 (AllergyNurse), u_aud_1/2 (Audiologist), u_tech_1/2
# (SterileProcessingTech), u_liaison_1/2 (PayerLiaison).
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — ENTITIES
  # ===========================================================================
  - section: entities
    instances:

      - name: patient_creation_returns_all_declared_fields
        claim_type: creation
        grounds:
          - entities.Patient
          - endpoints[POST /patients]
          - calculations.patient_age_months
          - calculations.patient_anaphylaxis_risk_score
          - response_envelope.response_type
        distinguishing_aspect: "A single POST /patients with every optional input supplied returns 201 and a data object carrying all 17 declared Patient fields plus id/created_at/updated_at/version, with age_months 434 and risk_score 5 already computed in that same response."
        test_recipe:
          setup:
            - "Clock at its default 2026-08-01T00:00:00Z."
            - "One PayerPolicy created with defaults; no Patient rows exist."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Corner Mutual", plan_code: "ENTA-2999" }
              as: PracticeAdmin
              as_user_id: "u_admin_1"
              captures: { pol_id: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10191", full_name: "Dana Reyes", date_of_birth: "1990-05-20", epinephrine_on_file: true, prior_systemic_reaction_count: 0 }
              as: PracticeAdmin
              as_user_id: "u_admin_1"
              captures: { pat_id: $.data.id, pat_v: $.data.version }
          assert:
            - "HTTP 201 and response_type == \"object\""
            - "Patient.${pat_id}.version == 1, and id, created_at, updated_at are all present and non-null"
            - "Patient.${pat_id}.payer_policy_id == \"${pol_id}\", mrn == \"MRN-10191\", full_name == \"Dana Reyes\", date_of_birth == \"1990-05-20\""
            - "Patient.${pat_id}.age_months == 434"
            - "Patient.${pat_id}.risk_score == 5 and risk_score_variant == \"PROVISIONAL\""
            - "Patient.${pat_id}.supervision_tier == \"STANDARD\""
            - "Patient.${pat_id}.sensitized_antigen_count == 0 and dermatographism == false"
            - "Patient.${pat_id}.immunotherapy_escalation_step == 1 and immunotherapy_status == \"NONE\""
            - "Patient.${pat_id}.antihistamine_last_dose_at == null and last_dose_administered_at == null"

      - name: payer_policy_retrieval_returns_stored_configuration
        claim_type: retrieval
        grounds:
          - entities.PayerPolicy
          - endpoints[POST /payer-policies]
          - endpoints[GET /payer-policies/{policyId}]
        distinguishing_aspect: "GET /payer-policies/{policyId} echoes all 15 configuration inputs exactly as supplied — including the non-default covered_pct_bps 5000 and observation_floor_minutes 45 — and reports version 1 because a read performs no write."
        test_recipe:
          setup:
            - "One PayerPolicy created with every configuration field set away from its default."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Retrieval Health", plan_code: "ENTB-2999", requires_prior_auth: false, min_medical_management_days: 14, requires_ct_within_months: 6, min_documented_criteria: 2, max_balloon_devices: 4, covered_pct_bps: 5000, allergy_serum_covered: false, observation_floor_minutes: 45, device_trial_days: 60, restock_fee_bps: 2000, restock_fee_floor_cents: 20000, auth_validity_days: 30, appliance_covered: false }
              as: PracticeAdmin
              as_user_id: "u_admin_1"
              captures: { pol_id: $.data.id }
          trigger:
            - call: "GET /payer-policies/${pol_id}"
              payload: {}
              as: PayerLiaison
              as_user_id: "u_liaison_1"
          assert:
            - "HTTP 200 and response_type == \"object\""
            - "PayerPolicy.${pol_id}.payer_name == \"Retrieval Health\" and plan_code == \"ENTB-2999\""
            - "PayerPolicy.${pol_id}.requires_prior_auth == false, min_medical_management_days == 14, requires_ct_within_months == 6, min_documented_criteria == 2, max_balloon_devices == 4"
            - "PayerPolicy.${pol_id}.covered_pct_bps == 5000, allergy_serum_covered == false, observation_floor_minutes == 45"
            - "PayerPolicy.${pol_id}.device_trial_days == 60, restock_fee_bps == 2000, restock_fee_floor_cents == 20000, auth_validity_days == 30, appliance_covered == false"
            - "PayerPolicy.${pol_id}.version == 1 — the GET does not bump the version"

      - name: allergy_test_order_listing_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /allergy-test-orders]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With exactly 3 orders for one patient, limit 2 / offset 0 returns 2 items with total_count 3 and has_more true, and limit 2 / offset 2 returns the remaining 1 item with has_more false — total_count reports the filtered set, not the page."
        test_recipe:
          setup:
            - "One PayerPolicy, one adult Patient, three AllergyTestOrder rows in status ORDERED for that patient."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "List Mutual", plan_code: "ENTC-2999" }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10192", full_name: "Lee Ortiz", date_of_birth: "1988-03-04", epinephrine_on_file: true }
              as: PracticeAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /allergy-test-orders"
              payload: { patient_id: "${pat_id}", panel_code: "MOLD_12", method: "SKIN_PRICK" }
              as: AllergyNurse
              captures: { ord_a: $.data.id }
            - call: "POST /allergy-test-orders"
              payload: { patient_id: "${pat_id}", panel_code: "VENOM_5", method: "SKIN_PRICK" }
              as: AllergyNurse
              captures: { ord_b: $.data.id }
            - call: "POST /allergy-test-orders"
              payload: { patient_id: "${pat_id}", panel_code: "FOOD_24", method: "SERUM_IGE" }
              as: AllergyNurse
              captures: { ord_c: $.data.id }
          trigger:
            - call: "GET /allergy-test-orders?patient_id=${pat_id}&limit=2&offset=0"
              payload: {}
              as: PracticeAdmin
            - call: "GET /allergy-test-orders?patient_id=${pat_id}&limit=2&offset=2"
              payload: {}
              as: PracticeAdmin
            - call: "GET /allergy-test-orders?patient_id=${pat_id}&method=SERUM_IGE"
              payload: {}
              as: PracticeAdmin
          assert:
            - "First page: HTTP 200, response_type == \"array\", limit == 2, offset == 0, total_count == 3, has_more == true, and exactly 2 AllergyTestOrder items are returned"
            - "Second page: limit == 2, offset == 2, total_count == 3, has_more == false, and exactly 1 item is returned"
            - "The union of the two pages is exactly {${ord_a}, ${ord_b}, ${ord_c}} with no duplicates"
            - "method filter SERUM_IGE: total_count == 1 and the single item is ${ord_c}"

      - name: patient_not_found_on_unknown_id
        claim_type: not_found
        grounds:
          - errors.ERR_PATIENT_NOT_FOUND
          - validations[priority 4]
          - validations[priority 5]
        distinguishing_aspect: "An unknown patient id yields ERR_PATIENT_NOT_FOUND (404) both as a path parameter on GET /patients/{patientId} and as a body foreign key on POST /allergy-test-orders — the same error id from two different validation priorities."
        test_recipe:
          setup:
            - "Empty database except one PayerPolicy; no Patient row with the probed id exists."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Absent Mutual", plan_code: "ENTD-2999" }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
          trigger:
            - call: "GET /patients/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PracticeAdmin
            - call: "POST /allergy-test-orders"
              payload: { patient_id: "11111111-1111-4111-8111-111111111111", panel_code: "MOLD_12", method: "SKIN_PRICK" }
              as: AllergyNurse
          assert:
            - "The GET returns HTTP 404 with error.id == \"ERR_PATIENT_NOT_FOUND\" and response_type == \"error\""
            - "The POST returns HTTP 404 with error.id == \"ERR_PATIENT_NOT_FOUND\" (priority 5, body foreign key)"
            - "No AllergyTestOrder row is created: GET /allergy-test-orders returns total_count == 0"

      - name: allergy_test_order_missing_panel_code_is_invalid_request
        claim_type: required_fields
        grounds:
          - errors.ERR_INVALID_REQUEST
          - validations[priority 3]
          - endpoints[POST /allergy-test-orders]
          - endpoints[POST /supply-lots]
        distinguishing_aspect: "Omitting any input declared without a `?` suffix — panel_code on POST /allergy-test-orders, date_of_birth on POST /patients, expires_at on POST /supply-lots — is ERR_INVALID_REQUEST (400) and persists nothing."
        test_recipe:
          setup:
            - "One PayerPolicy and one adult Patient exist so that only the missing field can be at fault."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Shape Mutual", plan_code: "ENTE-2999" }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10193", full_name: "Ada Nunez", date_of_birth: "1979-11-02", epinephrine_on_file: true }
              as: PracticeAdmin
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /allergy-test-orders"
              payload: { patient_id: "${pat_id}", method: "SKIN_PRICK" }
              as: AllergyNurse
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10194", full_name: "No Birthday" }
              as: PracticeAdmin
            - call: "POST /supply-lots"
              payload: { item_type: "HEARING_AID", lot_number: "LOT-1010", quantity_received: 4 }
              as: PracticeAdmin
          assert:
            - "All three calls return HTTP 400 with error.id == \"ERR_INVALID_REQUEST\""
            - "GET /allergy-test-orders?patient_id=${pat_id} returns total_count == 0"
            - "GET /patients?payer_policy_id=${pol_id} returns total_count == 1 — MRN-10194 was never created"
            - "GET /supply-lots returns total_count == 0"

      - name: payer_policy_defaults_applied_when_omitted
        claim_type: defaults
        grounds:
          - entities.PayerPolicy.fields.requires_prior_auth
          - entities.PayerPolicy.fields.min_medical_management_days
          - entities.PayerPolicy.fields.covered_pct_bps
          - entities.PayerPolicy.fields.observation_floor_minutes
          - entities.PayerPolicy.fields.restock_fee_floor_cents
          - endpoints[POST /payer-policies]
        distinguishing_aspect: "A POST /payer-policies carrying only the two required inputs returns all thirteen optional fields at their declared defaults — requires_prior_auth true, min_medical_management_days 28, requires_ct_within_months 12, min_documented_criteria 3, max_balloon_devices 2, covered_pct_bps 8000, allergy_serum_covered true, observation_floor_minutes 20, device_trial_days 30, restock_fee_bps 1500, restock_fee_floor_cents 12500, auth_validity_days 90, appliance_covered true."
        test_recipe:
          setup:
            - "Empty database; clock at its default."
          setup_api_calls: []
          trigger:
            - call: "POST /payer-policies"
              payload: { payer_name: "Default Mutual", plan_code: "ENTF-2999" }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
          assert:
            - "HTTP 201 and PayerPolicy.${pol_id}.version == 1"
            - "PayerPolicy.${pol_id}.requires_prior_auth == true"
            - "PayerPolicy.${pol_id}.min_medical_management_days == 28 and requires_ct_within_months == 12 and min_documented_criteria == 3"
            - "PayerPolicy.${pol_id}.max_balloon_devices == 2 and covered_pct_bps == 8000 and allergy_serum_covered == true"
            - "PayerPolicy.${pol_id}.observation_floor_minutes == 20 and device_trial_days == 30"
            - "PayerPolicy.${pol_id}.restock_fee_bps == 1500 and restock_fee_floor_cents == 12500"
            - "PayerPolicy.${pol_id}.auth_validity_days == 90 and appliance_covered == true"

      - name: patient_age_months_is_computed_and_input_is_invalid_request
        claim_type: computed_fields
        grounds:
          - entities.Patient.fields.age_months
          - entities.Patient.fields.risk_score
          - calculations.patient_age_months
          - validations[priority 3]
        distinguishing_aspect: "Supplying age_months in the POST /patients body is an unknown field and returns 400; the same request without it returns 201 with age_months 26 derived from date_of_birth 2024-06-01 against the clock, and risk_score 23 = 5 base + 8 pediatric + 10 no-epinephrine."
        test_recipe:
          setup:
            - "Clock at its default 2026-08-01T00:00:00Z; one PayerPolicy exists."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Computed Mutual", plan_code: "ENTG-2999" }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10195", full_name: "Toddler One", date_of_birth: "2024-06-01", age_months: 60 }
              as: PracticeAdmin
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10195", full_name: "Toddler One", date_of_birth: "2024-06-01" }
              as: PracticeAdmin
              captures: { pat_id: $.data.id }
          assert:
            - "The first call returns HTTP 400 with error.id == \"ERR_INVALID_REQUEST\" — age_months is source: computed and is not a declared input"
            - "The second call returns HTTP 201 with Patient.${pat_id}.age_months == 26, not 60"
            - "Patient.${pat_id}.risk_score == 23 and risk_score_variant == \"PROVISIONAL\""
            - "Patient.${pat_id}.epinephrine_on_file == false (its own default) and supervision_tier == \"STANDARD\""
            - "GET /patients?payer_policy_id=${pol_id} returns total_count == 1"

      - name: supply_lot_system_fields_are_server_generated_and_input_is_invalid_request
        claim_type: system_fields
        grounds:
          - entities.SupplyLot.fields.status
          - entities.SupplyLot.fields.quantity_on_hand
          - endpoints[POST /supply-lots]
          - validations[priority 3]
        distinguishing_aspect: "status is source: system on SupplyLot, so sending status QUARANTINED in the create body returns 400; the accepted create stamps status ACTIVE, quantity_on_hand 6, reserved/consumed/wasted 0, available_quantity 6 and version 1 without any client input."
        test_recipe:
          setup:
            - "Empty database; clock at its default."
          setup_api_calls: []
          trigger:
            - call: "POST /supply-lots"
              payload: { item_type: "BALLOON_DEVICE", lot_number: "LOT-1011", quantity_received: 6, expires_at: "2027-06-30T00:00:00Z", status: "QUARANTINED" }
              as: PracticeAdmin
            - call: "POST /supply-lots"
              payload: { item_type: "BALLOON_DEVICE", lot_number: "LOT-1011", quantity_received: 6, expires_at: "2027-06-30T00:00:00Z" }
              as: PracticeAdmin
              captures: { lot_id: $.data.id }
          assert:
            - "The first call returns HTTP 400 with error.id == \"ERR_INVALID_REQUEST\""
            - "The second call returns HTTP 201 with SupplyLot.${lot_id}.status == \"ACTIVE\""
            - "SupplyLot.${lot_id}.quantity_on_hand == 6, quantity_reserved == 0, quantity_consumed == 0, quantity_wasted == 0, available_quantity == 6"
            - "SupplyLot.${lot_id}.id, created_at and updated_at are present and non-null, and version == 1"

      - name: reaction_event_is_immutable_and_has_no_version
        claim_type: immutability
        grounds:
          - entities.ReactionEvent
          - endpoints[POST /reaction-events]
          - endpoints[GET /reaction-events/{eventId}]
          - calculations.patient_anaphylaxis_risk_score
        distinguishing_aspect: "ReactionEvent declares common_fields: false, so its create and read responses carry occurred_at and recorded_by_user_id but no version field, §1.5 declares no update endpoint for it, and a grade-1 event leaves the order ADMINISTERED and the PROVISIONAL risk_score at 5."
        test_recipe:
          setup:
            - "One PayerPolicy, one adult Patient with epinephrine_on_file true, one MOLD_12 SKIN_PRICK order in status ADMINISTERED."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Immutable Mutual", plan_code: "ENTH-2999" }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10196", full_name: "Ken Vasquez", date_of_birth: "1982-02-09", epinephrine_on_file: true }
              as: PracticeAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /allergy-test-orders"
              payload: { patient_id: "${pat_id}", panel_code: "MOLD_12", method: "SKIN_PRICK" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { ord_id: $.data.id }
            - call: "POST /allergy-test-orders/${ord_id}/administer"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
          trigger:
            - call: "POST /reaction-events"
              payload: { allergy_test_order_id: "${ord_id}", systemic_grade: 1, local_wheal_mm: 12.0, onset_minutes: 10, epinephrine_given: false }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { evt_id: $.data.id }
            - call: "GET /reaction-events/${evt_id}"
              payload: {}
              as: Otolaryngologist
          assert:
            - "HTTP 201; ReactionEvent.${evt_id}.occurred_at == \"2026-08-01T00:00:00Z\" and recorded_by_user_id == \"u_nurse_1\""
            - "Neither the create response nor the GET response contains a version field for ReactionEvent — the entity declares common_fields: false"
            - "§1.5 declares no PATCH or action endpoint for ReactionEvent: the only writes are POST /reaction-events and the only reads are the two GETs"
            - "AllergyTestOrder.${ord_id}.status == \"ADMINISTERED\" — a grade-1 event does not abort the order"
            - "Patient.${pat_id}.risk_score == 5 and risk_score_variant == \"PROVISIONAL\" — grade 0 and 1 events contribute nothing"

      - name: patient_requires_existing_payer_policy_fk
        claim_type: parent_relationships
        grounds:
          - entities.Patient.fields.payer_policy_id
          - complexity_profile.entity_topology
          - errors.ERR_PAYER_POLICY_NOT_FOUND
          - endpoints[GET /patients]
        distinguishing_aspect: "The topology is flat, so Patient.payer_policy_id is enforced as a foreign key, not as a URL parent: the identical body resolves to 404 ERR_PAYER_POLICY_NOT_FOUND with an unknown policy id and to 201 with a stored one, and GET /patients?payer_policy_id= makes the link reverse-reachable."
        test_recipe:
          setup:
            - "One stored PayerPolicy; the probed policy id belongs to no row."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Fk Mutual", plan_code: "ENTI-2999" }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { payer_policy_id: "22222222-2222-4222-8222-222222222222", mrn: "MRN-10197", full_name: "Orphan Row", date_of_birth: "1975-07-07" }
              as: PracticeAdmin
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10197", full_name: "Orphan Row", date_of_birth: "1975-07-07" }
              as: PracticeAdmin
              captures: { pat_id: $.data.id }
            - call: "GET /patients?payer_policy_id=${pol_id}"
              payload: {}
              as: PracticeAdmin
          assert:
            - "The first call returns HTTP 404 with error.id == \"ERR_PAYER_POLICY_NOT_FOUND\""
            - "The second call returns HTTP 201 with Patient.${pat_id}.payer_policy_id == \"${pol_id}\""
            - "The filtered list returns total_count == 1 and its single item id == \"${pat_id}\""

      - name: allergy_test_order_rejects_undeclared_panel_code
        claim_type: type_constraints
        grounds:
          - entities.AllergyTestOrder.fields.panel_code
          - entities.AllergyTestOrder.fields.method
          - entities.AllergyTestOrder.fields.positive_antigen_count
          - entities.PayerPolicy.fields.covered_pct_bps
          - entities.PayerPolicy.fields.plan_code
          - validations[priority 3]
        distinguishing_aspect: "Four distinct shape-gate classes all return 400 ERR_INVALID_REQUEST: an undeclared enum member (panel_code ENV_12), an undeclared method, an integer above its declared range (covered_pct_bps 20000 against 0..10000), and a regex miss (plan_code \"bad code\")."
        test_recipe:
          setup:
            - "One PayerPolicy, one adult Patient, one MOLD_12 order in status ORDERED with antigen_count 12."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Type Mutual", plan_code: "ENTJ-2999" }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10198", full_name: "Range Probe", date_of_birth: "1991-01-19", epinephrine_on_file: true }
              as: PracticeAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /allergy-test-orders"
              payload: { patient_id: "${pat_id}", panel_code: "MOLD_12", method: "SKIN_PRICK" }
              as: AllergyNurse
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /allergy-test-orders"
              payload: { patient_id: "${pat_id}", panel_code: "ENV_12", method: "SKIN_PRICK" }
              as: AllergyNurse
            - call: "POST /allergy-test-orders"
              payload: { patient_id: "${pat_id}", panel_code: "ENV_36", method: "PATCH_TEST" }
              as: AllergyNurse
            - call: "POST /allergy-test-orders/${ord_id}/readings"
              payload: { positive_antigen_count: 13 }
              as: AllergyNurse
            - call: "POST /payer-policies"
              payload: { payer_name: "Out Of Range", plan_code: "ENTK-2999", covered_pct_bps: 20000 }
              as: PracticeAdmin
            - call: "POST /payer-policies"
              payload: { payer_name: "Bad Code", plan_code: "bad code" }
              as: PracticeAdmin
          assert:
            - "All five calls return HTTP 400 with error.id == \"ERR_INVALID_REQUEST\""
            - "The readings call is rejected at priority 3 for positive_antigen_count 13 > antigen_count 12, never reaching the priority 7 state check, and AllergyTestOrder.${ord_id}.status is still \"ORDERED\""
            - "GET /payer-policies/${pol_id} still reports version 1 and GET /allergy-test-orders?patient_id=${pat_id} still reports total_count == 1"

  # ===========================================================================
  # SECTION 2 — STATE MACHINES
  # ===========================================================================
  - section: state_machines
    instances:

      - name: sinuplasty_case_starts_in_draft_with_undetermined_candidacy
        claim_type: initial_state
        grounds:
          - state_machines.SinuplastyCase.initial_state
          - entities.SinuplastyCase.fields.candidacy_status
          - entities.SinuplastyCase.fields.planned_device_count
          - entities.SinuplastyCase.fields.evaluation_variant
          - endpoints[POST /sinuplasty-cases]
        distinguishing_aspect: "A freshly created SinuplastyCase is DRAFT with candidacy_status UNDETERMINED, revision_round 0 and authorized_device_count 0, while planned_device_count is already 4 (two sinuses x BILATERAL) and evaluation_variant is already POLICY_STRICT from the plan's requires_prior_auth true."
        test_recipe:
          setup:
