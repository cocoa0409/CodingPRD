          - endpoints[GET /cte/credential-attainments]
        distinguishing_aspect: |
          CredentialAttainment is declared common_fields: false, so the persisted row exposes no version field and §1.5
          declares no PATCH or DELETE for it; the only way to record a different fact is a new row, and a repeat of the
          same (student_id, credential_id) pair is rejected rather than overwriting.
        test_recipe:
          setup:
            - "Empty database. The logical clock is pinned to its startup default 2026-08-01T00:00:00Z."
