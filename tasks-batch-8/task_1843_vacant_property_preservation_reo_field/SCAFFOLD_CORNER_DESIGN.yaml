scaffold_corner_design:
  - section: entities
    instances:
      - name: work_order_create_defaults_and_system_fields
        claim_type: creation
        grounds:
          - "entities.WorkOrder"
          - "state_machines.WorkOrder.initial_state"
        distinguishing_aspect: "Direct creation yields ISSUED status, source DIRECT, rework_count 0, version 1, servicer_id copied from the property, and item_code mapped SECURING -> LOCK_CHANGE."
        test_recipe:
          setup: ["Servicer and FHA/LOCK_CHANGE allowable exist; property P active"]
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer T", code: "SVCT" }, as: VendorAdmin, captures: { sv: $.data.id } }
            - { call: "POST /preservation/investor-allowables", payload: { investor_type: "FHA", item_code: "LOCK_CHANGE", max_per_occurrence_cents: 20000, max_occurrences_per_calendar_year: 4, aggregate_cap_cents_per_property_year: 80000, requires_bid_over_cents: 999999, effective_from: "2026-01-01" }, as: VendorAdmin }
            - { call: "POST /preservation/properties", payload: { servicer_id: "${sv}", address_line1: "1 Test St", municipality_code: "COL", state_code: "OH", zip: "43215", investor_type: "FHA", lot_size_sqft: 5000, heating_system: "FORCED_AIR", fixture_count: 5 }, as: VendorAdmin, captures: { p: $.data.id } }
          trigger:
            - { call: "POST /preservation/work-orders", payload: { property_id: "${p}", order_type: "SECURING", due_date: "2026-08-10" }, as: Servicer, as_user_id: "${sv}", captures: { wo_status: $.data.status, wo_source: $.data.source, wo_rework: $.data.rework_count, wo_v: $.data.version, wo_svc: $.data.servicer_id, wo_item: $.data.item_code, wo_cap: $.data.allowable_cap_cents } }
          assert:
            - "wo_status == ISSUED and wo_source == DIRECT"
            - "wo_rework == 0 and wo_v == 1"
            - "wo_svc == ${sv} and wo_item == LOCK_CHANGE and wo_cap == 20000"

      - name: property_computed_fields_on_create
        claim_type: computed_fields
        grounds:
          - "entities.Property.fields.condition_score"
          - "entities.Property.fields.compliance_posture"
          - "entities.Property.fields.occupancy_status"
        distinguishing_aspect: "A fresh property reports condition_score 100, compliance_posture CLEAR, occupancy_status UNKNOWN regardless of any client-sent values for those fields."
        test_recipe:
          setup: ["Servicer exists"]
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer U", code: "SVCU" }, as: VendorAdmin, captures: { sv: $.data.id } }
          trigger:
            - { call: "POST /preservation/properties", payload: { servicer_id: "${sv}", address_line1: "2 Test Ave", municipality_code: "COL", state_code: "OH", zip: "43215", investor_type: "FNMA", lot_size_sqft: 6000, heating_system: "NONE", fixture_count: 3 }, as: VendorAdmin, captures: { score: $.data.condition_score, posture: $.data.compliance_posture, occ: $.data.occupancy_status } }
          assert:
            - "score == 100 and posture == CLEAR and occ == UNKNOWN"

      - name: servicer_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "endpoints.get_servicer"
        distinguishing_aspect: "GET with a well-formed but nonexistent servicer UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /preservation/servicers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: VendorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND with http 404"

      - name: investor_allowable_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.InvestorAllowable.fields.max_per_occurrence_cents"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required max_per_occurrence_cents on allowable creation returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["VendorAdmin context only"]
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VendorAdmin }
          trigger:
            - { call: "POST /preservation/investor-allowables", payload: { investor_type: "FHA", item_code: "GRASS_CUT", max_occurrences_per_calendar_year: 20, aggregate_cap_cents_per_property_year: 60000, requires_bid_over_cents: 999999, effective_from: "2026-01-01" }, as: VendorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST with http 400"

      - name: photo_evidence_two_subjects_rejected
        claim_type: type_constraints
        grounds:
          - "entities.PhotoEvidence.fields.work_order_id"
          - "validations[priority=4]"
        distinguishing_aspect: "Photo evidence carrying two subject FKs (work_order_id and damage_report_id) violates the exactly-one-subject rule -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Property P with a damage report dr"]
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer V", code: "SVCV" }, as: VendorAdmin, captures: { sv: $.data.id } }
            - { call: "POST /preservation/crews", payload: { name: "Crew 18", crew_code: "CR18" }, as: VendorAdmin, captures: { cr: $.data.id } }
            - { call: "POST /preservation/investor-allowables", payload: { investor_type: "FHA", item_code: "INSPECTION", max_per_occurrence_cents: 5000, max_occurrences_per_calendar_year: 30, aggregate_cap_cents_per_property_year: 100000, requires_bid_over_cents: 999999, effective_from: "2026-01-01" }, as: VendorAdmin }
            - { call: "POST /preservation/properties", payload: { servicer_id: "${sv}", address_line1: "3 Test Rd", municipality_code: "COL", state_code: "OH", zip: "43215", investor_type: "FHA", lot_size_sqft: 5000, heating_system: "NONE", fixture_count: 4 }, as: VendorAdmin, captures: { p: $.data.id } }
            - { call: "POST /preservation/work-orders", payload: { property_id: "${p}", order_type: "INSPECTION", due_date: "2026-08-09" }, as: Servicer, as_user_id: "${sv}", captures: { wo: $.data.id } }
            - { call: "POST /preservation/damage-reports", payload: { property_id: "${p}", damage_type: "STORM", severity: "MINOR", is_interior: false, description: "gutter loose" }, as: FieldCrew, as_user_id: "${cr}", captures: { dr: $.data.id } }
          trigger:
            - { call: "POST /preservation/photo-evidence", payload: { work_order_id: "${wo}", damage_report_id: "${dr}", category: "BEFORE", taken_at: "2026-08-02T09:00:00Z", content_hash: "v_x1" }, as: FieldCrew, as_user_id: "${cr}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST — exactly one subject FK allowed"

      - name: expense_line_locked_after_invoice_submit
        claim_type: invalid_transition
        grounds:
          - "state_machines.Invoice.DRAFT_to_SUBMITTED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Adding an expense line to a SUBMITTED invoice is rejected with ERR_INVALID_STATE; lines are only accepted while DRAFT."
        test_recipe:
          setup: ["Completed GRASS_CUT work order with invoice submitted (one 1000 line)"]
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer W", code: "SVCW" }, as: VendorAdmin, captures: { sv: $.data.id } }
            - { call: "POST /preservation/crews", payload: { name: "Crew 19", crew_code: "CR19" }, as: VendorAdmin, captures: { cr: $.data.id } }
            - { call: "POST /preservation/investor-allowables", payload: { investor_type: "FHA", item_code: "GRASS_CUT", max_per_occurrence_cents: 3000, max_occurrences_per_calendar_year: 20, aggregate_cap_cents_per_property_year: 60000, requires_bid_over_cents: 999999, effective_from: "2026-01-01" }, as: VendorAdmin }
            - { call: "POST /preservation/properties", payload: { servicer_id: "${sv}", address_line1: "4 Test Ct", municipality_code: "COL", state_code: "OH", zip: "43215", investor_type: "FHA", lot_size_sqft: 5000, heating_system: "FORCED_AIR", fixture_count: 5 }, as: VendorAdmin, captures: { p: $.data.id } }
            - { call: "POST /preservation/work-orders", payload: { property_id: "${p}", order_type: "GRASS_CUT", due_date: "2026-08-08" }, as: Servicer, as_user_id: "${sv}", captures: { wo: $.data.id } }
            - { call: "POST /preservation/work-orders/${wo}/assign", payload: { crew_id: "${cr}", scheduled_date: "2026-08-02" }, as: Dispatcher }
            - { call: "POST /preservation/work-orders/${wo}/start", payload: {}, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/photo-evidence", payload: { work_order_id: "${wo}", category: "BEFORE", taken_at: "2026-08-02T09:00:00Z", content_hash: "w_b" }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/photo-evidence", payload: { work_order_id: "${wo}", category: "AFTER", taken_at: "2026-08-02T10:00:00Z", content_hash: "w_a" }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/work-orders/${wo}/submit", payload: { submitted_cost_cents: 1000 }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/work-orders/${wo}/approve", payload: {}, as: QualityReviewer }
            - { call: "POST /preservation/work-orders/${wo}/complete", payload: {}, as: QualityReviewer }
            - { call: "GET /preservation/invoices?work_order_id=${wo}", as: VendorAdmin, captures: { inv: $.data.0.id } }
            - { call: "POST /preservation/invoices/${inv}/lines", payload: { item_code: "GRASS_CUT", quantity: 1, unit_price_cents: 1000 }, as: VendorAdmin }
            - { call: "POST /preservation/invoices/${inv}/submit", payload: {}, as: VendorAdmin }
          trigger:
            - { call: "POST /preservation/invoices/${inv}/lines", payload: { item_code: "GRASS_CUT", quantity: 1, unit_price_cents: 500 }, as: VendorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE — invoice no longer DRAFT"

  - section: state_machines
    instances:
      - name: inspection_record_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Inspection.SCHEDULED_to_COMPLETED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Recording findings on an already-COMPLETED inspection is rejected; record is not idempotent."
        test_recipe:
          setup: ["Inspection completed once with VACANT"]
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer X", code: "SVCX" }, as: VendorAdmin, captures: { sv: $.data.id } }
            - { call: "POST /preservation/crews", payload: { name: "Crew 20", crew_code: "CR20" }, as: VendorAdmin, captures: { cr: $.data.id } }
            - { call: "POST /preservation/properties", payload: { servicer_id: "${sv}", address_line1: "5 Test Ln", municipality_code: "COL", state_code: "OH", zip: "43215", investor_type: "FHA", lot_size_sqft: 5000, heating_system: "NONE", fixture_count: 4 }, as: VendorAdmin, captures: { p: $.data.id } }
            - { call: "POST /preservation/inspections", payload: { property_id: "${p}", due_date: "2026-08-02" }, as: VendorAdmin, captures: { ins: $.data.id } }
            - { call: "POST /preservation/inspections/${ins}/record", payload: { occupancy_determination: "VACANT", interior_access: false, personal_property_present: false }, as: FieldCrew, as_user_id: "${cr}" }
          trigger:
            - { call: "POST /preservation/inspections/${ins}/record", payload: { occupancy_determination: "VACANT", interior_access: false, personal_property_present: false }, as: FieldCrew, as_user_id: "${cr}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE — COMPLETED is terminal for record"

      - name: work_order_cancel_from_completed_returns_invalid_state
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.WorkOrder.terminal_states"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A COMPLETED work order cannot be cancelled; terminal lockdown returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["GRASS_CUT work order driven to COMPLETED"]
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer Y", code: "SVCY" }, as: VendorAdmin, captures: { sv: $.data.id } }
            - { call: "POST /preservation/crews", payload: { name: "Crew 21", crew_code: "CR21" }, as: VendorAdmin, captures: { cr: $.data.id } }
            - { call: "POST /preservation/investor-allowables", payload: { investor_type: "FHA", item_code: "GRASS_CUT", max_per_occurrence_cents: 3000, max_occurrences_per_calendar_year: 20, aggregate_cap_cents_per_property_year: 60000, requires_bid_over_cents: 999999, effective_from: "2026-01-01" }, as: VendorAdmin }
            - { call: "POST /preservation/properties", payload: { servicer_id: "${sv}", address_line1: "6 Test Dr", municipality_code: "COL", state_code: "OH", zip: "43215", investor_type: "FHA", lot_size_sqft: 5000, heating_system: "FORCED_AIR", fixture_count: 5 }, as: VendorAdmin, captures: { p: $.data.id } }
            - { call: "POST /preservation/work-orders", payload: { property_id: "${p}", order_type: "GRASS_CUT", due_date: "2026-08-08" }, as: Servicer, as_user_id: "${sv}", captures: { wo: $.data.id } }
            - { call: "POST /preservation/work-orders/${wo}/assign", payload: { crew_id: "${cr}", scheduled_date: "2026-08-02" }, as: Dispatcher }
            - { call: "POST /preservation/work-orders/${wo}/start", payload: {}, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/photo-evidence", payload: { work_order_id: "${wo}", category: "BEFORE", taken_at: "2026-08-02T09:00:00Z", content_hash: "y_b" }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/photo-evidence", payload: { work_order_id: "${wo}", category: "AFTER", taken_at: "2026-08-02T10:00:00Z", content_hash: "y_a" }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/work-orders/${wo}/submit", payload: { submitted_cost_cents: 1000 }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/work-orders/${wo}/approve", payload: {}, as: QualityReviewer }
            - { call: "POST /preservation/work-orders/${wo}/complete", payload: {}, as: QualityReviewer }
          trigger:
            - { call: "POST /preservation/work-orders/${wo}/cancel", payload: { reason: "too late" }, as: Servicer, as_user_id: "${sv}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE — COMPLETED is terminal"

      - name: registration_activate_twice_returns_invalid_state
        claim_type: idempotency
        grounds:
          - "state_machines.MunicipalRegistration.PENDING_to_ACTIVE"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Second activate on an ACTIVE registration fails with ERR_INVALID_STATE; activate is not idempotent."
        test_recipe:
          setup: ["Registration activated once"]
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer Z", code: "SVCZ" }, as: VendorAdmin, captures: { sv: $.data.id } }
            - { call: "POST /preservation/properties", payload: { servicer_id: "${sv}", address_line1: "7 Test Pl", municipality_code: "COL", state_code: "OH", zip: "43215", investor_type: "FHA", lot_size_sqft: 5000, heating_system: "NONE", fixture_count: 4 }, as: VendorAdmin, captures: { p: $.data.id } }
            - { call: "POST /preservation/registrations", payload: { property_id: "${p}", municipality_code: "COL", registration_number: "REG-Z1", fee_cents: 25000, valid_from: "2026-08-01", valid_to: "2027-02-01" }, as: VendorAdmin, captures: { r: $.data.id } }
            - { call: "POST /preservation/registrations/${r}/activate", payload: {}, as: VendorAdmin }
          trigger:
            - { call: "POST /preservation/registrations/${r}/activate", payload: {}, as: VendorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE — already ACTIVE"

      - name: personal_property_initial_state_in_hold
        claim_type: initial_state
        grounds:
          - "state_machines.PersonalPropertyDisposition.initial_state"
          - "calculations.hold_period"
        distinguishing_aspect: "A new disposition starts IN_HOLD with documented_date == clock date and hold_until_date == documented_date + 30 for OH."
        test_recipe:
          setup: ["Property P in OH; clock 2026-08-01"]
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer AA", code: "SVAA" }, as: VendorAdmin, captures: { sv: $.data.id } }
            - { call: "POST /preservation/crews", payload: { name: "Crew 22", crew_code: "CR22" }, as: VendorAdmin, captures: { cr: $.data.id } }
            - { call: "POST /preservation/properties", payload: { servicer_id: "${sv}", address_line1: "8 Test Way", municipality_code: "COL", state_code: "OH", zip: "43215", investor_type: "FHA", lot_size_sqft: 5000, heating_system: "NONE", fixture_count: 4 }, as: VendorAdmin, captures: { p: $.data.id } }
          trigger:
            - { call: "POST /preservation/personal-property-dispositions", payload: { property_id: "${p}", description: "sofa and boxes", valuation_cents: 12000 }, as: FieldCrew, as_user_id: "${cr}", captures: { st: $.data.status, dd: $.data.documented_date, hu: $.data.hold_until_date } }
          assert:
            - "st == IN_HOLD"
            - "dd == 2026-08-01 and hu == 2026-08-31 (OH 30-day hold)"

      - name: bid_withdraw_then_submit_returns_invalid_state
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.Bid.DRAFT_to_WITHDRAWN"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A WITHDRAWN bid is terminally locked; submitting it returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Damage report BID_REQUESTED with a DRAFT bid withdrawn by its crew"]
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer AB", code: "SVAB" }, as: VendorAdmin, captures: { sv: $.data.id } }
            - { call: "POST /preservation/crews", payload: { name: "Crew 23", crew_code: "CR23" }, as: VendorAdmin, captures: { cr: $.data.id } }
            - { call: "POST /preservation/properties", payload: { servicer_id: "${sv}", address_line1: "9 Test Ter", municipality_code: "COL", state_code: "OH", zip: "43215", investor_type: "FHA", lot_size_sqft: 5000, heating_system: "NONE", fixture_count: 4 }, as: VendorAdmin, captures: { p: $.data.id } }
            - { call: "POST /preservation/damage-reports", payload: { property_id: "${p}", damage_type: "THEFT", severity: "MINOR", is_interior: false, description: "copper piping gone" }, as: FieldCrew, as_user_id: "${cr}", captures: { dr: $.data.id } }
            - { call: "POST /preservation/damage-reports/${dr}/triage", payload: {}, as: VendorAdmin }
            - { call: "POST /preservation/damage-reports/${dr}/request-bids", payload: {}, as: VendorAdmin, captures: { dr_v: $.data.version } }
            - { call: "POST /preservation/damage-reports/${dr}/bids", payload: { amount_cents: 40000, expected_damage_report_version: "${dr_v}" }, as: FieldCrew, as_user_id: "${cr}", captures: { b: $.data.id } }
            - { call: "POST /preservation/bids/${b}/withdraw", payload: {}, as: FieldCrew, as_user_id: "${cr}" }
          trigger:
            - { call: "POST /preservation/bids/${b}/submit", payload: {}, as: FieldCrew, as_user_id: "${cr}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE — WITHDRAWN is terminal"

      - name: recurring_plan_resume_after_end_returns_invalid_state
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.RecurringServicePlan.terminal_states"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "ENDED plans cannot resume; ERR_INVALID_STATE."
        test_recipe:
          setup: ["Plan ended"]
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer AC", code: "SVAC" }, as: VendorAdmin, captures: { sv: $.data.id } }
            - { call: "POST /preservation/properties", payload: { servicer_id: "${sv}", address_line1: "10 Test Cir", municipality_code: "COL", state_code: "OH", zip: "43215", investor_type: "FHA", lot_size_sqft: 5000, heating_system: "NONE", fixture_count: 4 }, as: VendorAdmin, captures: { p: $.data.id } }
            - { call: "POST /preservation/recurring-plans", payload: { property_id: "${p}", service_type: "GRASS_CUT", season_start_md: "04-01", season_end_md: "10-31", interval_days: 14, max_per_season: 6 }, as: VendorAdmin, captures: { plan: $.data.id } }
            - { call: "POST /preservation/recurring-plans/${plan}/end", payload: {}, as: VendorAdmin }
          trigger:
            - { call: "POST /preservation/recurring-plans/${plan}/resume", payload: {}, as: VendorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE — ENDED is terminal"

      - name: violation_cure_happy_path
        claim_type: valid_transition
        grounds:
          - "state_machines.CodeViolation.OPEN_to_CURE_IN_PROGRESS"
          - "state_machines.CodeViolation.CURE_IN_PROGRESS_to_CURE_SUBMITTED"
          - "state_machines.CodeViolation.CURE_SUBMITTED_to_VERIFIED_CLOSED"
          - "state_machines.CodeViolation.CURE_SUBMITTED_to_CURE_IN_PROGRESS"
        distinguishing_aspect: "Full cure lifecycle including one municipal rejection loop: start-cure -> work -> submit-cure -> reject-cure -> resubmit -> verify closes the violation and freezes the fine."
        test_recipe:
          setup:
            - "Property P with ACTIVE registration for COL; MAJOR violation (deadline 2026-08-20, daily fine 1000, cap 50000); CODE_CURE work order completed once"
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer AD", code: "SVAD" }, as: VendorAdmin, captures: { sv: $.data.id } }
            - { call: "POST /preservation/crews", payload: { name: "Crew 24", crew_code: "CR24" }, as: VendorAdmin, captures: { cr: $.data.id } }
