# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-reference of SCAFFOLD.yaml sections 1.1-1.7 against the nine Difficulty
# Rules. Every ground resolves into SCAFFOLD.yaml; deleting this file changes no
# declared behaviour, only the auditability of test coverage.
#
# Shared fixture vocabulary used by the chains below (all opaque X-User-IDs):
#   Physician u-phys-1 / u-phys-2, Dietitian u-rd-1 / u-rd-2, DietClerk u-clerk-1,
#   TrayAide u-aide-1 / u-aide-2, NutritionManager u-mgr-1.
# The logical clock starts at 2026-08-01T00:00:00Z on a fresh server.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: malnutrition_score_diverges_by_assessment_variant
        grounds:
          - calculations.malnutrition_risk_score
          - entities.NutritionConsult.fields.assessment_variant
          - entities.NutritionConsult.fields.malnutrition_risk_score
          - entities.NutritionConsult.fields.risk_tier
          - state_machines.NutritionConsult.ASSIGNED_to_ASSESSED
        distinguishing_aspect: |
          This dual-variant sits on the NutritionConsult clinical-assessment domain: identical
          anthropometrics (weight_loss_pct 16.0, intake_pct 40.0, bmi 23.0, albumin_g_dl 3.6)
          score 71.00 / HIGH under SCREENING but 52.50 / MODERATE under COMPREHENSIVE, because
          adding the albumin term at weight 0.20 dilutes the weight-loss term from 0.50 to 0.35.
        test_recipe:
          setup:
            - "One ward and one admitted patient exist."
            - "Two NutritionConsults exist for that patient, both raised by u-phys-1 and both in status ASSIGNED to u-rd-1."
          setup_api_calls:
            - call: "POST /nutrition/wards"
              payload: { name: "Ward 5 East", code: "W5E", tray_line_capacity_per_window: 20, delivery_lead_minutes: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { w_id: $.data.id }
            - call: "POST /nutrition/patients"
              payload: { ward_id: "${w_id}", mrn: "MRN-1001", full_name: "Ada Kern", age_years: 71 }
              as: DietClerk
              as_user_id: "u-clerk-1"
              captures: { p_id: $.data.id }
            - call: "POST /nutrition/nutrition-consults"
              payload: { patient_id: "${p_id}", reason_code: "WEIGHT_LOSS", acuity: "ROUTINE" }
              as: Physician
              as_user_id: "u-phys-1"
              captures: { c1_id: $.data.id }
            - call: "POST /nutrition/nutrition-consults/${c1_id}/assign"
              payload: { dietitian_user_id: "u-rd-1" }
              as: Dietitian
              as_user_id: "u-rd-1"
            - call: "POST /nutrition/nutrition-consults"
              payload: { patient_id: "${p_id}", reason_code: "WEIGHT_LOSS_RECHECK", acuity: "ROUTINE" }
              as: Physician
              as_user_id: "u-phys-1"
              captures: { c2_id: $.data.id }
            - call: "POST /nutrition/nutrition-consults/${c2_id}/assign"
              payload: { dietitian_user_id: "u-rd-1" }
              as: Dietitian
              as_user_id: "u-rd-1"
          trigger:
            - call: "POST /nutrition/nutrition-consults/${c1_id}/assess"
              payload: { assessment_variant: "SCREENING", weight_loss_pct: 16.0, intake_pct: 40.0, bmi: 23.0 }
              as: Dietitian
              as_user_id: "u-rd-1"
            - call: "POST /nutrition/nutrition-consults/${c2_id}/assess"
              payload: { assessment_variant: "COMPREHENSIVE", weight_loss_pct: 16.0, intake_pct: 40.0, bmi: 23.0, albumin_g_dl: 3.6 }
              as: Dietitian
              as_user_id: "u-rd-1"
          assert:
            - "NutritionConsult.${c1_id}.malnutrition_risk_score == 71.00"
            - "NutritionConsult.${c1_id}.risk_tier == HIGH"
            - "NutritionConsult.${c2_id}.malnutrition_risk_score == 52.50"
            - "NutritionConsult.${c2_id}.risk_tier == MODERATE"
            - "NutritionConsult.${c1_id}.malnutrition_risk_score != NutritionConsult.${c2_id}.malnutrition_risk_score"
            - "NutritionConsult.${c2_id}.albumin_g_dl == 3.6 and NutritionConsult.${c1_id}.albumin_g_dl == null"

      - name: production_forecast_diverges_by_variant_on_same_ward
        grounds:
          - calculations.production_forecast_trays
          - entities.MealPeriod.fields.forecast_variant
          - entities.MealPeriod.fields.forecast_tray_count
          - entities.MealPeriod.fields.forecast_cost_cents
          - state_machines.MealPeriod.PLANNED_to_FORECAST_LOCKED
        distinguishing_aspect: |
          This dual-variant sits on the MealPeriod production-planning domain, a different entity
          domain from the NutritionConsult scoring instance: with three admitted non-NPO patients
          and no CLOSED history, ROLLING_AVERAGE falls back to the ward tray-line capacity and
          forecasts 20 trays / 23000 cents while CENSUS_BASED forecasts CEIL(3 * 0.85) = 3 trays
          / 3450 cents on the very same ward and service date.
        test_recipe:
          setup:
            - "One ward W5E with tray_line_capacity_per_window 20 exists and is ACTIVE."
            - "Three patients are ADMITTED on that ward, none under an NPO hold, so active_patient_census is 3."
            - "Two PLANNED MealPeriods exist on that ward for 2026-08-02 with non-overlapping windows: LUNCH and DINNER."
            - "No MealPeriod on that ward has ever reached CLOSED, so the ROLLING_AVERAGE history set is empty."
          setup_api_calls:
            - call: "POST /nutrition/wards"
              payload: { name: "Ward 5 East", code: "W5E", tray_line_capacity_per_window: 20, delivery_lead_minutes: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { w_id: $.data.id }
            - call: "POST /nutrition/patients"
              payload: { ward_id: "${w_id}", mrn: "MRN-2001", full_name: "Ada Kern", age_years: 71 }
              as: DietClerk
              as_user_id: "u-clerk-1"
              captures: { p1_id: $.data.id }
            - call: "POST /nutrition/patients"
              payload: { ward_id: "${w_id}", mrn: "MRN-2002", full_name: "Ben Oduya", age_years: 64 }
              as: DietClerk
              as_user_id: "u-clerk-1"
              captures: { p2_id: $.data.id }
            - call: "POST /nutrition/patients"
              payload: { ward_id: "${w_id}", mrn: "MRN-2003", full_name: "Cara Lind", age_years: 58 }
              as: DietClerk
              as_user_id: "u-clerk-1"
              captures: { p3_id: $.data.id }
            - call: "POST /nutrition/meal-periods"
              payload: { ward_id: "${w_id}", period_code: "LUNCH", service_date: "2026-08-02", order_cutoff_at: "2026-08-02T10:30:00Z", window_start_at: "2026-08-02T11:30:00Z", window_end_at: "2026-08-02T13:00:00Z", production_capacity_trays: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { mp_lunch_id: $.data.id }
            - call: "POST /nutrition/meal-periods"
              payload: { ward_id: "${w_id}", period_code: "DINNER", service_date: "2026-08-02", order_cutoff_at: "2026-08-02T16:30:00Z", window_start_at: "2026-08-02T17:30:00Z", window_end_at: "2026-08-02T19:00:00Z", production_capacity_trays: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { mp_dinner_id: $.data.id }
          trigger:
            - call: "POST /nutrition/meal-periods/${mp_lunch_id}/lock-forecast"
              payload: { forecast_variant: "ROLLING_AVERAGE" }
              as: NutritionManager
              as_user_id: "u-mgr-1"
            - call: "POST /nutrition/meal-periods/${mp_dinner_id}/lock-forecast"
              payload: { forecast_variant: "CENSUS_BASED" }
              as: NutritionManager
              as_user_id: "u-mgr-1"
          assert:
            - "MealPeriod.${mp_lunch_id}.forecast_variant == ROLLING_AVERAGE"
            - "MealPeriod.${mp_lunch_id}.forecast_tray_count == 20"
            - "MealPeriod.${mp_lunch_id}.forecast_cost_cents == 23000"
            - "MealPeriod.${mp_dinner_id}.forecast_variant == CENSUS_BASED"
            - "MealPeriod.${mp_dinner_id}.forecast_tray_count == 3"
            - "MealPeriod.${mp_dinner_id}.forecast_cost_cents == 3450"
            - "MealPeriod.${mp_lunch_id}.forecast_variance_pct == -100.00"
            - "MealPeriod.${mp_dinner_id}.forecast_variance_pct == -100.00"
            - "Ward.${w_id}.active_patient_census == 3"

  - rule_id: combinatorial_formula
    instances:
      - name: effective_envelope_layers_two_rules_patient_floor_and_npo_override
        grounds:
          - calculations.effective_diet_envelope
          - entities.DietOrder.fields.effective_sodium_cap_mg
          - entities.DietOrder.fields.effective_texture_level
          - entities.DietOrder.fields.effective_liquid_level
          - entities.DietOrder.fields.forbidden_tag_codes_effective
          - state_machines.DietOrder.PENDING_COSIGN_to_ACTIVE
        distinguishing_aspect: |
          Mode (a) - a five-input formula (two TherapeuticDietRules, the prescription, the patient
          floor and the NPO branch) with nested min over nullable ceilings, argmax over two ordinal
          ladders, and a conditional branch on Patient.npo_status whose NPO_CLEAR_LIQUIDS arm is
          NON-monotonic: it pins effective_liquid_level DOWN to THIN even though the ordinal max of
          the prescription and the patient floor is MODERATELY_THICK.
        test_recipe:
          setup:
            - "Rules RENAL_2G_NA (sodium 700, potassium 600, forbids HIGH_FAT) and CARB_MOD (sodium 1200, carb 45.0) are ACTIVE."
            - "Patient has texture_level MINCED_MOIST and liquid_level MODERATELY_THICK."
            - "An ACTIVE ProcedureHold with npo_kind NPO_CLEAR_LIQUIDS covers the patient, so Patient.npo_status == NPO_CLEAR_LIQUIDS."
            - "A DietOrder in PENDING_COSIGN references both rules with texture_level REGULAR and liquid_level THIN."
          setup_api_calls:
            - call: "POST /nutrition/wards"
              payload: { name: "Ward 5 East", code: "W5E", tray_line_capacity_per_window: 20, delivery_lead_minutes: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { w_id: $.data.id }
            - call: "POST /nutrition/diet-rules"
              payload: { diet_code: "RENAL_2G_NA", display_name: "Renal 2g Sodium", precedence_rank: 10, max_sodium_mg_per_meal: 700, max_potassium_mg_per_meal: 600, forbidden_tag_codes: ["HIGH_FAT"], requires_dietitian_cosign: true }
              as: Dietitian
              as_user_id: "u-rd-1"
              captures: { r_renal_id: $.data.id }
            - call: "POST /nutrition/diet-rules"
              payload: { diet_code: "CARB_MOD", display_name: "Carbohydrate Modified", precedence_rank: 20, max_sodium_mg_per_meal: 1200, max_carb_g_per_meal: 45.0, requires_dietitian_cosign: false }
              as: Dietitian
              as_user_id: "u-rd-1"
              captures: { r_carb_id: $.data.id }
            - call: "POST /nutrition/patients"
              payload: { ward_id: "${w_id}", mrn: "MRN-3001", full_name: "Ada Kern", age_years: 71, texture_level: "MINCED_MOIST", liquid_level: "MODERATELY_THICK" }
              as: DietClerk
              as_user_id: "u-clerk-1"
              captures: { p_id: $.data.id }
            - call: "POST /nutrition/procedure-holds"
              payload: { patient_id: "${p_id}", procedure_code: "ENDO-01", npo_kind: "NPO_CLEAR_LIQUIDS", hold_start_at: "2026-08-02T06:00:00Z", hold_end_at: "2026-08-02T14:00:00Z" }
              as: Physician
              as_user_id: "u-phys-1"
              captures: { hold_id: $.data.id }
            - call: "POST /nutrition/procedure-holds/${hold_id}/activate"
              payload: {}
              as: Physician
              as_user_id: "u-phys-1"
            - call: "POST /nutrition/diet-orders"
              payload: { patient_id: "${p_id}", primary_diet_rule_id: "${r_renal_id}", secondary_diet_rule_id: "${r_carb_id}", texture_level: "REGULAR", liquid_level: "THIN" }
              as: Physician
              as_user_id: "u-phys-1"
              captures: { do_id: $.data.id }
            - call: "POST /nutrition/diet-orders/${do_id}/submit"
              payload: {}
              as: Physician
              as_user_id: "u-phys-1"
          trigger:
            - call: "POST /nutrition/diet-orders/${do_id}/cosign"
              payload: {}
              as: Dietitian
              as_user_id: "u-rd-1"
          assert:
            - "DietOrder.${do_id}.status == ACTIVE"
            - "DietOrder.${do_id}.effective_sodium_cap_mg == 700"
            - "DietOrder.${do_id}.effective_potassium_cap_mg == 600"
            - "DietOrder.${do_id}.effective_carb_cap_g == 15.0"
            - "DietOrder.${do_id}.effective_texture_level == LIQUIDISED"
            - "DietOrder.${do_id}.effective_liquid_level == THIN"
            - "DietOrder.${do_id}.forbidden_tag_codes_effective == [\"HIGH_FAT\"]"
            - "Patient.${p_id}.npo_status == NPO_CLEAR_LIQUIDS"

      - name: tray_cost_rounds_per_line_before_summing
        grounds:
          - calculations.meal_order_food_cost
          - calculations.meal_order_nutrient_totals
          - entities.MealOrderLine.fields.line_cost_cents
          - entities.MealOrder.fields.food_cost_cents
          - endpoints[POST /nutrition/meal-orders]
        distinguishing_aspect: |
          Mode (b) - nested rounding whose order changes the answer. Three lines each land on a
          .6 cent fraction after the waste factor, so rounding at the line and then summing gives
          184 + 346 + 211 = 741, while the rejected sum-then-round reading gives ROUND(739.8) = 740.
          A different axis from the mode (a) envelope instance, which has no rounding at all.
          Uses the CENSUS_BASED forecast lock only as scaffolding; the assertion is on cents.
        test_recipe:
          setup:
            - "Rule REGULAR_STD is ACTIVE with every ceiling null and requires_dietitian_cosign true."
            - "Menu items DES-PUD (110 cents, PUREED, COLD), SUP-ORS (260 cents, LIQUIDISED, COLD) and SOU-BRO (135 cents, LIQUIDISED, HOT) are ACTIVE."
            - "Patient has texture_level PUREED and no documented allergens, so the tray's effective_texture_level is PUREED and the prep surcharge is 60 cents per unit."
            - "An ACTIVE DietOrder pinned to REGULAR_STD exists for the patient."
            - "A PLANNED LUNCH MealPeriod for 2026-08-02 exists with capacity 20 and the clock reads 2026-08-02T09:00:00Z, before the 10:30 cutoff."
          setup_api_calls:
            - call: "POST /nutrition/wards"
              payload: { name: "Ward 5 East", code: "W5E", tray_line_capacity_per_window: 20, delivery_lead_minutes: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { w_id: $.data.id }
            - call: "POST /nutrition/diet-rules"
              payload: { diet_code: "REGULAR_STD", display_name: "Regular", precedence_rank: 90, requires_dietitian_cosign: true }
              as: Dietitian
              as_user_id: "u-rd-1"
              captures: { r_std_id: $.data.id }
            - call: "POST /nutrition/menu-items"
              payload: { item_code: "DES-PUD", display_name: "Vanilla Pudding", sodium_mg: 150, potassium_mg: 210, carb_g: 22.0, protein_g: 3.0, unit_cost_cents: 110, texture_level: "PUREED", service_temp_class: "COLD", allergen_codes: ["MILK"] }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { mi_pud_id: $.data.id }
            - call: "POST /nutrition/menu-items"
              payload: { item_code: "SUP-ORS", display_name: "Oral Supplement", sodium_mg: 200, potassium_mg: 300, carb_g: 30.0, protein_g: 16.0, unit_cost_cents: 260, texture_level: "LIQUIDISED", service_temp_class: "COLD", liquid_level: "MILDLY_THICK", allergen_codes: ["MILK"] }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { mi_sup_id: $.data.id }
            - call: "POST /nutrition/menu-items"
              payload: { item_code: "SOU-BRO", display_name: "Clear Broth", sodium_mg: 760, potassium_mg: 180, carb_g: 3.0, protein_g: 4.0, unit_cost_cents: 135, texture_level: "LIQUIDISED", service_temp_class: "HOT", liquid_level: "THIN" }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { mi_bro_id: $.data.id }
            - call: "POST /nutrition/patients"
              payload: { ward_id: "${w_id}", mrn: "MRN-4001", full_name: "Ada Kern", age_years: 71, texture_level: "PUREED" }
              as: DietClerk
              as_user_id: "u-clerk-1"
              captures: { p_id: $.data.id }
            - call: "POST /nutrition/diet-orders"
              payload: { patient_id: "${p_id}", primary_diet_rule_id: "${r_std_id}", texture_level: "REGULAR", liquid_level: "THIN" }
              as: Physician
              as_user_id: "u-phys-1"
              captures: { do_id: $.data.id }
            - call: "POST /nutrition/diet-orders/${do_id}/submit"
              payload: {}
              as: Physician
              as_user_id: "u-phys-1"
            - call: "POST /nutrition/diet-orders/${do_id}/cosign"
              payload: {}
              as: Dietitian
              as_user_id: "u-rd-1"
              captures: { do_v: $.data.version }
            - call: "POST /nutrition/meal-periods"
              payload: { ward_id: "${w_id}", period_code: "LUNCH", service_date: "2026-08-02", order_cutoff_at: "2026-08-02T10:30:00Z", window_start_at: "2026-08-02T11:30:00Z", window_end_at: "2026-08-02T13:00:00Z", production_capacity_trays: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { mp_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:00:00Z" }
              as: NutritionManager
              as_user_id: "u-mgr-1"
          trigger:
            - call: "POST /nutrition/meal-orders"
              payload: { patient_id: "${p_id}", meal_period_id: "${mp_id}", diet_order_id: "${do_id}", expected_diet_order_version: "${do_v}", lines: [ { menu_item_id: "${mi_pud_id}", quantity: 1 }, { menu_item_id: "${mi_sup_id}", quantity: 1 }, { menu_item_id: "${mi_bro_id}", quantity: 1 } ] }
              as: DietClerk
              as_user_id: "u-clerk-1"
              captures: { mo_id: $.data.id }
          assert:
            - "MealOrder.${mo_id}.effective_texture_level == PUREED"
            - "MealOrder.${mo_id}.food_cost_cents == 741"
            - "MealOrder.${mo_id}.food_cost_cents != 740"
            - "the MealOrderLine rows returned by GET /nutrition/meal-order-lines?meal_order_id=${mo_id} carry line_cost_cents 184, 346 and 211"
            - "MealOrder.${mo_id}.total_sodium_mg == 1110"
            - "MealOrder.${mo_id}.total_potassium_mg == 690"
            - "MealOrder.${mo_id}.total_carb_g == 55.0"
            - "MealOrder.${mo_id}.total_protein_g == 23.0"
            - "MealOrder.${mo_id}.requires_hot_probe == true and MealOrder.${mo_id}.requires_cold_probe == true"

      - name: period_cost_rollup_tier_keyed_on_subtotal_not_on_gross
        grounds:
          - calculations.meal_period_cost_rollup
          - entities.MealPeriod.fields.period_overhead_cents
          - entities.MealPeriod.fields.period_bulk_discount_cents
          - entities.MealPeriod.fields.period_total_cost_cents
          - state_machines.MealOrder.PENDING_VALIDATION_to_VALIDATED
        distinguishing_aspect: |
          Mode (c) - a circular-looking dependency pinned by evaluation order. A single validated
          tray of 5 x SUP-ORS commits 1728 cents, which sits in tier A because the tier is keyed on
          the STEP-1 subtotal; overhead is ROUND(1728 * 0.180) = 311, gross 2039, discount 0, total
          2039. The rejected reading that keys the tier on the gross (2039 >= 2000, tier B) would
          produce overhead 259, gross 1987, discount 40 and total 1947.
        test_recipe:
          setup:
            - "Rule REGULAR_STD is ACTIVE with every ceiling null."
            - "Menu item SUP-ORS costs 260 cents and is LIQUIDISED."
            - "Patient has texture_level PUREED, giving a 60 cent per-unit prep surcharge."
            - "An ACTIVE DietOrder on REGULAR_STD exists and a PLANNED LUNCH MealPeriod with capacity 20 and no cost ceiling exists."
            - "A PENDING_VALIDATION MealOrder of 5 x SUP-ORS exists with food_cost_cents 1728 and the period has committed nothing yet."
          setup_api_calls:
            - call: "POST /nutrition/wards"
              payload: { name: "Ward 5 East", code: "W5E", tray_line_capacity_per_window: 20, delivery_lead_minutes: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { w_id: $.data.id }
            - call: "POST /nutrition/diet-rules"
              payload: { diet_code: "REGULAR_STD", display_name: "Regular", precedence_rank: 90, requires_dietitian_cosign: true }
              as: Dietitian
              as_user_id: "u-rd-1"
              captures: { r_std_id: $.data.id }
            - call: "POST /nutrition/menu-items"
              payload: { item_code: "SUP-ORS", display_name: "Oral Supplement", sodium_mg: 200, potassium_mg: 300, carb_g: 30.0, protein_g: 16.0, unit_cost_cents: 260, texture_level: "LIQUIDISED", service_temp_class: "COLD", liquid_level: "MILDLY_THICK", allergen_codes: ["MILK"] }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { mi_sup_id: $.data.id }
            - call: "POST /nutrition/patients"
              payload: { ward_id: "${w_id}", mrn: "MRN-5001", full_name: "Ada Kern", age_years: 71, texture_level: "PUREED" }
              as: DietClerk
              as_user_id: "u-clerk-1"
              captures: { p_id: $.data.id }
            - call: "POST /nutrition/diet-orders"
              payload: { patient_id: "${p_id}", primary_diet_rule_id: "${r_std_id}", texture_level: "REGULAR", liquid_level: "THIN" }
              as: Physician
              as_user_id: "u-phys-1"
              captures: { do_id: $.data.id }
            - call: "POST /nutrition/diet-orders/${do_id}/submit"
              payload: {}
              as: Physician
              as_user_id: "u-phys-1"
            - call: "POST /nutrition/diet-orders/${do_id}/cosign"
              payload: {}
              as: Dietitian
              as_user_id: "u-rd-1"
              captures: { do_v: $.data.version }
            - call: "POST /nutrition/meal-periods"
              payload: { ward_id: "${w_id}", period_code: "LUNCH", service_date: "2026-08-02", order_cutoff_at: "2026-08-02T10:30:00Z", window_start_at: "2026-08-02T11:30:00Z", window_end_at: "2026-08-02T13:00:00Z", production_capacity_trays: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { mp_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:00:00Z" }
              as: NutritionManager
              as_user_id: "u-mgr-1"
            - call: "POST /nutrition/meal-orders"
              payload: { patient_id: "${p_id}", meal_period_id: "${mp_id}", diet_order_id: "${do_id}", expected_diet_order_version: "${do_v}", lines: [ { menu_item_id: "${mi_sup_id}", quantity: 5 } ] }
              as: DietClerk
              as_user_id: "u-clerk-1"
              captures: { mo_id: $.data.id }
          trigger:
