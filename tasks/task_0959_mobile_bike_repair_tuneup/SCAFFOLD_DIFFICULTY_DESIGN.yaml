          trigger:
            - { call: "POST /v1/service-requests/${req_id}/part-usages", payload: { part_id: "${part_a}", quantity: 3, action: "RESERVE" }, as: Mechanic, as_user_id: "${mech_id}", captures: { oh1: $.data.on_hand, rv1: $.data.reserved } }
            - { call: "POST /v1/service-requests/${req_id}/part-usages", payload: { part_id: "${part_a}", quantity: 1, action: "RESERVE" }, as: Mechanic, as_user_id: "${mech_id}", captures: { err2: $.data.error_id } }
          assert:
            - "RESERVE 3 of exactly 3 available: 200, on_hand == 3, reserved == 3 (zero headroom is legal)"
            - "RESERVE 1 more: ERR_STOCK_INSUFFICIENT (409)"

  - rule_id: cross_entity_state_dependency
