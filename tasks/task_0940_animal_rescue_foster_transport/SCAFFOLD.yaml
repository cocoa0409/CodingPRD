scenario: "940. Animal Rescue & Foster/Transport Network: intake & transport (rescue leg), foster application & home-check, foster placement & medical, adoption application & match, transport-relay coordination, donation & sponsorship, return/RTO, live-release outcome"
domain_name: "animal-rescue-foster-transport"
api_prefix: "/rescue"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: posture_driven
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - conditional_feature_flags

  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

  notes: |
    Nineteen entities form a graph, not a tree: an Animal is simultaneously
    referenced by IntakeRecord, HoldRecord, FosterPlacement, ManifestEntry,
    AdoptionApplication, Adoption, OutcomeRecord and Contribution, while Litter
    is self-referential through Litter.dam_animal_id -> Animal.id and
    Animal.litter_id -> Litter.id. Five ordered global write gates sit above the
    ordinary validation ladder and pre-empt it, so the observable error for a
    request that violates several rules is decided by gate order, not by which
    business rule "feels" most specific.

# ---------------------------------------------------------------------------
# Global constants — EVERY named constant used anywhere in this scaffold has a
# declared value here. Enum members are not constants and are not listed.
# ---------------------------------------------------------------------------
global_constants:
  CLOCK_DEFAULT_UTC: "2026-05-01T00:00:00Z"

  STRAY_HOLD_STRAY_IDENTIFIABLE_DAYS: 7
  STRAY_HOLD_STRAY_UNIDENTIFIABLE_DAYS: 3
  STRAY_HOLD_OWNER_SURRENDER_DAYS: 0
  STRAY_HOLD_CONFISCATE_DAYS: 10
  STRAY_HOLD_TRANSFER_IN_DAYS: 1
  STRAY_HOLD_RETURN_DAYS: 0

  HOME_CHECK_VALID_DAYS: 180

  CVI_WINDOW_DAYS_DOG: 30
  CVI_WINDOW_DAYS_CAT: 15
  CVI_WINDOW_DAYS_OTHER: 10
  RABIES_MIN_AGE_WEEKS: 12

  FOSTER_SLOT_COST_INDIVIDUAL: 1
  FOSTER_SLOT_COST_NURSING_UNIT: 2

  CRATE_UNITS_SMALL: 1
  CRATE_UNITS_MEDIUM: 2
  CRATE_UNITS_LARGE: 3
  CRATE_UNITS_LITTER_GROUPED: 2
  DRIVER_TURNAROUND_BUFFER_MINUTES: 60

  BASE_RECLAIM_FEE_CENTS: 4500
  IMPOUND_TIER1_MAX_DAYS: 3
  IMPOUND_TIER2_MAX_DAYS: 7
  IMPOUND_TIER1_PER_DAY_CENTS: 1500
  IMPOUND_TIER2_PER_DAY_CENTS: 2500
  IMPOUND_TIER3_PER_DAY_CENTS: 4000
  REPEAT_OFFENSE_MULTIPLIER_NONE: 1.0
  REPEAT_OFFENSE_MULTIPLIER_SECOND: 1.5
  REPEAT_OFFENSE_MULTIPLIER_THIRD_PLUS: 2.0
  RECLAIM_WAIVER_TOTAL_THRESHOLD_CENTS: 20000
  RECLAIM_HARDSHIP_WAIVER_CENTS: 2000

  ADOPTION_BASE_FEE_DOG_CENTS: 25000
  ADOPTION_BASE_FEE_CAT_CENTS: 12500
  ADOPTION_BASE_FEE_OTHER_CENTS: 6000
  SENIOR_WAIVER_AGE_MONTHS: 84
  SENIOR_WAIVER_PCT: 0.60
  LONG_STAY_WAIVER_DAYS: 120
  LONG_STAY_WAIVER_PCT: 0.50

  ALTERATION_MIN_AGE_WEEKS: 16
  ALTERATION_DEPOSIT_FLAT_CENTS: 15000
  ALTERATION_DEPOSIT_PER_WEEK_CENTS: 1200
  ALTERATION_DEPOSIT_SCALED_FLOOR_CENTS: 6000
  ALTERATION_DEPOSIT_SCALED_CAP_CENTS: 18000

  RETURN_WINDOW_FULL_DAYS: 14
  RETURN_WINDOW_PARTIAL_DAYS: 30
  RETURN_REFUND_PCT_FULL: 1.00
  RETURN_REFUND_PCT_PARTIAL: 0.50
  RETURN_REFUND_PCT_NONE: 0.00

  MEDICAL_ADMIN_OVERHEAD_PCT: 0.08
  MAX_ADOPTION_APPLICATION_ATTEMPTS: 3
  PARTNER_COMMITMENT_DEFAULT_TTL_DAYS: 60
  LIVE_RELEASE_RATE_PRECISION_DP: 4

  AGE_DAYS_PER_MONTH: 30
  AGE_DAYS_PER_WEEK: 7

  PAGINATION_DEFAULT_LIMIT: 10
  PAGINATION_MIN_LIMIT: 1
  PAGINATION_MAX_LIMIT: 100

# ---------------------------------------------------------------------------
# Ordered global write gates. These are evaluated in the order below, AFTER
# authentication / authorization / body validation / existence, and BEFORE any
# state-machine precondition, OCC check, or business rule. A gate that fires
# pre-empts every ordinary ladder rung below it. Each gate's scope is declared
# explicitly and asymmetrically so that no gate makes a later gate dead.
# ---------------------------------------------------------------------------
write_gates:
  - gate_order: 1
    gate_id: records_freeze_gate
    ladder_priority: 12
    condition: "Organization.records_freeze_active == true on the organization that owns the target resource (Animal.current_organization_id, or the organization reached through the target's animal)."
    scope: "Every POST / PATCH / DELETE under /rescue except POST /rescue/organizations/{id}/records-freeze and POST /rescue/_clock/set_current_utc. GET endpoints are never gated."
    error_id: ERR_RECORDS_FROZEN
  - gate_order: 2
    gate_id: outcome_closed_gate
    ladder_priority: 13
    condition: "The target Animal has an OutcomeRecord whose reversed_at is null (Animal.lifecycle_status == OUTCOME_CLOSED)."
    scope: "POST /rescue/animals/{id}/intake-records, POST /rescue/animals/{id}/holds, POST /rescue/animals/{id}/medical-records, POST /rescue/animals/{id}/health-certificates, POST /rescue/foster-placements, POST /rescue/transport-legs/{id}/manifest-entries, POST /rescue/adoption-applications, POST /rescue/adoptions, POST /rescue/animals/{id}/outcomes, POST /rescue/intake-records/{id}/reclaim, PATCH /rescue/animals/{id}/restrictions, POST /rescue/animals/{id}/identification."
    error_id: ERR_ANIMAL_OUTCOME_CLOSED
  - gate_order: 3
    gate_id: legal_hold_gate
    ladder_priority: 14
    condition: "A HoldRecord with hold_type == LEGAL and status == ACTIVE exists for the target Animal."
    scope: "Transport and disposition writes only: POST /rescue/transport-legs/{id}/manifest-entries, POST /rescue/transport-legs/{id}/depart (evaluated per manifested animal), POST /rescue/adoptions, POST /rescue/foster-placements/{id}/transfer, POST /rescue/intake-records/{id}/reclaim, POST /rescue/animals/{id}/outcomes when outcome_type is ADOPTION or TRANSFER_OUT or RETURN_TO_OWNER."
    error_id: ERR_LEGAL_HOLD_ACTIVE
  - gate_order: 4
    gate_id: medical_hold_gate
    ladder_priority: 15
    condition: "A HoldRecord with hold_type == MEDICAL and status == ACTIVE exists for the target Animal."
    scope: "POST /rescue/adoptions and POST /rescue/foster-placements/{id}/transfer ONLY. A MEDICAL hold never blocks POST /rescue/intake-records/{id}/reclaim and never blocks transport."
    error_id: ERR_MEDICAL_HOLD_ACTIVE
  - gate_order: 5
    gate_id: behavioral_hold_gate
    ladder_priority: 16
    condition: "A HoldRecord with hold_type == BEHAVIORAL and status == ACTIVE exists for the target Animal."
    scope: "POST /rescue/adoptions ONLY. A BEHAVIORAL hold never blocks transport, foster transfer, or reclaim."
    error_id: ERR_BEHAVIORAL_HOLD_ACTIVE

# ---------------------------------------------------------------------------
# Conservation invariants. Each is also declared as a calculation in §1.3 so
# that design-file `grounds:` entries resolve to a named element.
# ---------------------------------------------------------------------------
conservation_invariants:
  - invariant_id: intake_outcome_count_conservation
    calculation: intake_outcome_conservation
    conserved_quantity: "count of custody episodes"
    formula: "count(IntakeRecord where status != VOIDED) == count(OutcomeRecord where reversed_at == null) + count(Animal where lifecycle_status IN {IN_CUSTODY, IN_TRANSIT, STRANDED})"
  - invariant_id: contribution_money_conservation
    calculation: restricted_fund_conservation
    conserved_quantity: "donated cents"
    formula: "for every Contribution: amount_cents == applied_cents + released_cents + available_cents"
  - invariant_id: foster_slot_conservation
    calculation: foster_capacity_conservation
    conserved_quantity: "foster home slots"
    formula: "FosterHome.consumed_dog_slots + FosterHome.consumed_cat_slots == sum over FosterPlacement(status == ACTIVE, foster_home_id == home.id) of foster_slot_consumption"
  - invariant_id: partner_slot_conservation
    calculation: partner_commitment_slot_conservation
    conserved_quantity: "partner transfer slots"
    formula: "PartnerCommitment.slots_total == PartnerCommitment.slots_drawn + PartnerCommitment.slots_released + PartnerCommitment.slots_open"
  - invariant_id: leg_crate_slot_conservation
    calculation: leg_crate_slot_conservation
    conserved_quantity: "crate units on a leg"
    formula: "TransportLeg.used_crate_units == sum over ManifestEntry(transport_leg_id == leg.id, status IN {ASSIGNED, LOADED, DELIVERED}) of crate_units"
  - invariant_id: adoption_fee_component_conservation
    calculation: adoption_fee_component_conservation
    conserved_quantity: "adoption fee cents"
    formula: "Adoption.base_fee_cents == Adoption.sponsorship_applied_cents + Adoption.waiver_applied_cents + Adoption.adopter_charged_cents"

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Organization
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Legal name of the shelter or partner rescue."
      - name: org_type
        type: enum
        source: input
        description: "Whether this organization holds animals or receives transfers."
        constraints: "one of SHELTER, PARTNER_RESCUE"
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code; drives the interstate CVI requirement on transport legs."
        constraints: "exactly 2 uppercase letters"
      - name: default_methodology
        type: enum
        source: input
        default: SAC
        description: "Default live-release methodology used when GET /rescue/reports/live-release-rate omits methodology."
        constraints: "one of SAC, ASILOMAR"
      - name: records_freeze_active
        type: boolean
        source: system
        default: false
        description: "When true the records_freeze_gate blocks every write on this organization's resources."
      - name: records_freeze_reason
        type: string
        source: system
        default: null
        description: "Reason text supplied by the most recent records-freeze call; null when never frozen."
      - name: freeze_status
        type: enum
        source: computed
        default: UNFROZEN
        description: "State-machine mirror of records_freeze_active."
        constraints: "one of UNFROZEN, FROZEN"
      - name: unrestricted_balance_cents
        type: integer
        source: computed
        default: 0
        description: "Running unrestricted cash position: increased by UNRESTRICTED contributions and by released designated credit, decreased by medical admin overhead and by unfunded medical cost."
      - name: restricted_balance_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of available_cents over Contribution rows whose restriction_category != UNRESTRICTED and whose status is RECEIVED or PARTIALLY_APPLIED."
      - name: open_commitment_slots_total
        type: integer
        source: computed
        default: 0
        description: "Sum of slots_open over PartnerCommitment rows whose organization_id is this organization and whose status is OPEN or PARTIALLY_DRAWN."

  - name: Person
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Person's full name."
      - name: email
        type: string
        source: input
        description: "Contact email; must contain '@'."
      - name: youngest_child_age_years
        type: integer
        source: input
        default: 99
        description: "Age in whole years of the youngest child resident in the household; 99 means no resident children."
        constraints: ">= 0"
      - name: resident_cat_count
        type: integer
        source: input
        default: 0
        description: "Number of cats already living in the household."
        constraints: ">= 0"
      - name: resident_dog_count
        type: integer
        source: input
        default: 0
        description: "Number of dogs already living in the household."
        constraints: ">= 0"
      - name: housing_type
        type: enum
        source: input
        default: HOUSE
        description: "Declared housing type, matched against Animal.restriction_housing_types_excluded."
        constraints: "one of APARTMENT, CONDO, HOUSE, FARM"
      - name: has_fenced_yard
        type: boolean
        source: input
        default: false
        description: "Whether the household has a fenced yard."
      - name: hardship_certified
        type: boolean
        source: input
        default: false
        description: "Whether the person carries a certified financial-hardship status, a precondition of the reclaim hardship waiver."
      - name: driver_license_number
        type: string
        source: input
        default: null
        description: "Commercial driver licence identifier; required before the person may be named as TransportLeg.driver_person_id."
      - name: reclaim_history_count
        type: integer
        source: computed
        default: 0
        description: "Count of OutcomeRecord rows with outcome_type == RETURN_TO_OWNER, counterparty_person_id == this person and reversed_at == null. Read BEFORE the current reclaim is written, so the first reclaim sees 0."

  - name: Animal
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Shelter name of the animal."
      - name: species
        type: enum
        source: input
        description: "Species; selects the CVI window variant and the adoption base fee variant."
        constraints: "one of DOG, CAT, OTHER"
      - name: size_class
        type: enum
        source: input
        description: "Crate size class; selects the per-animal crate unit cost."
        constraints: "one of SMALL, MEDIUM, LARGE"
      - name: weight_lb
        type: number
        source: input
        description: "Body weight in pounds, used by the transport leg weight capacity check."
        constraints: "> 0"
      - name: date_of_birth
        type: datetime
        source: input
        description: "ISO 8601 UTC birth date; age_weeks and age_months derive from it against the logical clock."
      - name: temperament
        type: enum
        source: input
        default: UNKNOWN
        description: "Temperament classification used by the transport species/temperament compatibility rule."
        constraints: "one of SOCIAL, REACTIVE, UNKNOWN"
      - name: microchip_id
        type: string
        source: input
        default: null
        description: "Microchip or tag identifier; presence at intake makes the animal identifiable."
      - name: identifiable
        type: boolean
        source: computed
        default: false
        description: "True when microchip_id is non-null. Selects the STRAY hold-length variant."
      - name: litter_id
        type: string
        source: input
        default: null
        description: "FK -> Litter.id; nullable. Non-null when the animal is a littermate."
      - name: current_organization_id
        type: string
        source: input
        description: "FK -> Organization.id; the organization currently holding legal custody, and the organization whose records_freeze_active gates writes on this animal."
      - name: current_foster_home_id
        type: string
        source: computed
        default: null
        description: "FK -> FosterHome.id; nullable. Set when a FosterPlacement for this animal becomes ACTIVE, cleared when it leaves ACTIVE."
      - name: current_intake_record_id
        type: string
        source: computed
        default: null
        description: "FK -> IntakeRecord.id; nullable. The single IntakeRecord for this animal whose status is OPEN."
      - name: lifecycle_status
        type: enum
        source: computed
        default: PRE_INTAKE
        description: "Custody lifecycle axis."
        constraints: "one of PRE_INTAKE, IN_CUSTODY, IN_TRANSIT, STRANDED, OUTCOME_CLOSED"
      - name: alteration_status
        type: enum
        source: computed
        default: NOT_ALTERED
        description: "Spay/neuter compliance axis. ALTERED is written by completing a SPAY_NEUTER medical record; DEFERRED_DEPOSIT is written by an adoption that assesses a deferred-alteration deposit."
        constraints: "one of NOT_ALTERED, ALTERED, DEFERRED_DEPOSIT"
      - name: rabies_vaccinated_at
        type: datetime
        source: computed
        default: null
        description: "completed_at of the most recent COMPLETED MedicalRecord with procedure_type == VACCINE_RABIES; null when never vaccinated."
      - name: restriction_no_children_under_years
        type: integer
        source: input
        default: 0
        description: "Placement restriction: the youngest resident child must be at least this many years old. 0 disables the restriction."
        constraints: ">= 0"
      - name: restriction_no_cats
        type: boolean
        source: input
        default: false
        description: "Placement restriction: household must contain zero resident cats."
      - name: restriction_no_dogs
        type: boolean
        source: input
        default: false
        description: "Placement restriction: household must contain zero resident dogs."
      - name: restriction_requires_fenced_yard
        type: boolean
        source: input
        default: false
        description: "Placement restriction: household must have a fenced yard."
      - name: restriction_housing_types_excluded
        type: array
        source: input
        default: []
        description: "Placement restriction: array of housing_type enum members that may not adopt or foster this animal."
        constraints: "each element one of APARTMENT, CONDO, HOUSE, FARM"
      - name: current_hub_code
        type: string
        source: computed
        default: null
        description: "Hub code where the animal is physically located while lifecycle_status is STRANDED; null otherwise."
      - name: age_weeks
        type: integer
        source: computed
        description: "floor(floor((clock_now - date_of_birth) / 24h) / AGE_DAYS_PER_WEEK)."
      - name: age_months
        type: integer
        source: computed
        description: "floor(floor((clock_now - date_of_birth) / 24h) / AGE_DAYS_PER_MONTH)."
      - name: length_of_stay_days
        type: integer
        source: computed
        default: 0
        description: "floor((clock_now - current open IntakeRecord.intake_datetime) / 24h); 0 when lifecycle_status is PRE_INTAKE."

  - name: Litter
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: "Human label for the litter, e.g. 'Maple litter'."
      - name: dam_animal_id
        type: string
        source: input
        default: null
        description: "FK -> Animal.id; nullable. The nursing dam. Self-referential seam: the dam is itself an Animal whose litter_id is null."
      - name: transport_basis
        type: enum
        source: computed
        default: GROUPED
        description: "Selects the litter transport-unit variant. GROUPED keeps littermates on one leg at a flat crate cost; SPLIT_APPROVED bills each littermate individually and permits separate legs."
        constraints: "one of GROUPED, SPLIT_APPROVED"
      - name: split_approved_at
        type: datetime
        source: computed
        default: null
        description: "Clock instant at which split approval was granted; null while transport_basis is GROUPED."
      - name: member_count
        type: integer
        source: computed
        default: 0
        description: "Count of Animal rows whose litter_id is this litter."

  - name: IntakeRecord
    parent: Animal
    common_fields: true
    fields:
      - name: animal_id
        type: string
        source: input
        description: "FK -> Animal.id; the animal taken into custody by this episode."
      - name: source_person_id
        type: string
        source: input
        default: null
        description: "FK -> Person.id; nullable. The surrendering owner, the finder, or the owner of record for a stray."
      - name: intake_type
        type: enum
        source: input
        description: "Legal basis of the intake; selects the base stray-hold length."
        constraints: "one of STRAY, OWNER_SURRENDER, CONFISCATE, TRANSFER_IN, RETURN"
      - name: intake_datetime
        type: datetime
        source: input
        description: "ISO 8601 UTC instant custody began; the origin of both the hold clock and the impound clock."
      - name: impound_billing_basis
        type: enum
        source: input
        default: CALENDAR_DAY
        description: "Selects the impound billable-day variant used if this episode ends in a reclaim."
        constraints: "one of CALENDAR_DAY, OVERNIGHT"
      - name: identifiable_at_intake
        type: boolean
        source: computed
        default: false
        description: "Snapshot of Animal.identifiable at the moment this record was created; selects the STRAY hold-length variant."
      - name: hold_days
        type: integer
        source: computed
        description: "Result of stray_hold_expiry's day selection for this record."
      - name: hold_expires_at
        type: datetime
        source: computed
        description: "intake_datetime + hold_days * 24h."
      - name: hold_status
        type: enum
        source: computed
        default: HOLD_ACTIVE
        description: "Monotone hold axis. Becomes HOLD_EXPIRED the first time the logical clock reaches hold_expires_at and NEVER returns to HOLD_ACTIVE."
        constraints: "one of HOLD_ACTIVE, HOLD_EXPIRED"
      - name: status
        type: enum
        source: computed
        default: OPEN
        description: "Custody-episode axis. CLOSED when an OutcomeRecord is written for this episode; VOIDED when that outcome is later reversed by an adopter return and the episode is superseded."
        constraints: "one of OPEN, CLOSED, VOIDED"
      - name: reclaim_base_fee_cents
        type: integer
        source: computed
        default: null
        description: "BASE_RECLAIM_FEE_CENTS captured at reclaim time; null until reclaimed."
      - name: impound_billable_days
        type: integer
        source: computed
        default: null
        description: "Billable days computed by the impound variant selected by impound_billing_basis; null until reclaimed."
      - name: impound_subtotal_cents
        type: integer
        source: computed
        default: null
        description: "Tiered impound charge before the repeat-offense multiplier; null until reclaimed."
      - name: repeat_offense_multiplier
        type: number
        source: computed
        default: null
        description: "Multiplier selected from Person.reclaim_history_count; null until reclaimed."
      - name: hardship_waiver_cents
        type: integer
        source: computed
        default: null
        description: "RECLAIM_HARDSHIP_WAIVER_CENTS when the hardship waiver applied, else 0; null until reclaimed."
      - name: reclaim_total_cents
        type: integer
        source: computed
        default: null
        description: "Final amount owed by the reclaiming owner; null until reclaimed."

  - name: HoldRecord
    parent: Animal
    common_fields: true
    fields:
      - name: animal_id
        type: string
        source: input
        description: "FK -> Animal.id; the animal the hold restrains."
      - name: hold_type
        type: enum
        source: input
        description: "Which of the three independent hold axes this record occupies."
        constraints: "one of MEDICAL, BEHAVIORAL, LEGAL"
      - name: reason
        type: string
        source: input
        description: "Free-text justification recorded for audit."
      - name: status
        type: enum
        source: computed
        default: ACTIVE
        description: "Hold axis."
        constraints: "one of ACTIVE, RELEASED"
      - name: released_at
        type: datetime
        source: computed
        default: null
        description: "Clock instant the hold was released; null while ACTIVE."
      - name: released_by_user_id
        type: string
        source: computed
        default: null
        description: "X-User-ID of the actor that released the hold; null while ACTIVE."

  - name: FosterHome
    parent: null
    common_fields: true
    fields:
      - name: person_id
        type: string
        source: input
        description: "FK -> Person.id; the foster parent who owns this home."
      - name: label
        type: string
        source: input
        description: "Human label for the home."
      - name: dog_slot_capacity
        type: integer
        source: input
        default: 0
        description: "Maximum concurrent dog slots this home may consume."
        constraints: ">= 0"
      - name: cat_slot_capacity
        type: integer
        source: input
        default: 0
        description: "Maximum concurrent cat slots this home may consume."
        constraints: ">= 0"
      - name: max_headcount
        type: integer
        source: input
        description: "Maximum concurrent animal head count across all species."
        constraints: ">= 1"
      - name: accepts_cats
        type: boolean
        source: input
        default: true
        description: "Home-check derived restriction: false marks a no-cats household."
      - name: min_child_age_years
        type: integer
        source: input
        default: 99
        description: "Age in whole years of the youngest child in the fostering household; 99 means no resident children."
        constraints: ">= 0"
      - name: has_fenced_yard
        type: boolean
        source: input
        default: false
        description: "Home-check derived restriction: whether the home has a fenced yard."
      - name: consumed_dog_slots
        type: integer
        source: computed
        default: 0
        description: "Sum of foster_slot_consumption over ACTIVE FosterPlacement rows in this home whose animal species is DOG."
      - name: consumed_cat_slots
        type: integer
        source: computed
        default: 0
        description: "Sum of foster_slot_consumption over ACTIVE FosterPlacement rows in this home whose animal species is CAT or OTHER."
      - name: consumed_headcount
        type: integer
        source: computed
        default: 0
        description: "Sum of foster_headcount_consumption over ACTIVE FosterPlacement rows in this home."
      - name: capacity_status
        type: enum
        source: computed
        default: OPEN
        description: "Derived capacity axis; FULL when neither species has a free slot or the head count is at max_headcount."
        constraints: "one of OPEN, FULL"

  - name: FosterApplication
    parent: null
    common_fields: true
    fields:
      - name: person_id
        type: string
        source: input
        description: "FK -> Person.id; the applicant foster parent."
      - name: foster_home_id
        type: string
        source: input
        description: "FK -> FosterHome.id; the home this application covers."
      - name: species_requested
        type: enum
        source: input
        description: "Species the applicant is applying to foster."
        constraints: "one of DOG, CAT, OTHER"
      - name: application_status
        type: enum
        source: computed
        default: SUBMITTED
        description: "Axis 1 of the parallel pair. Independent of home_check_status."
        constraints: "one of SUBMITTED, APPROVED, SUSPENDED, DECLINED, WITHDRAWN"
      - name: home_check_status
        type: enum
        source: computed
        default: NOT_SCHEDULED
        description: "Axis 2 of the parallel pair. Independent of application_status."
        constraints: "one of NOT_SCHEDULED, PASSED, FAILED, LAPSED"
      - name: home_check_passed_at
        type: datetime
        source: computed
        default: null
        description: "Clock instant of the most recent PASSED home check; null when never passed."
      - name: home_check_expires_at
        type: datetime
        source: computed
        default: null
        description: "home_check_passed_at + HOME_CHECK_VALID_DAYS * 24h; null when never passed."
      - name: decided_by_user_id
        type: string
        source: computed
        default: null
        description: "X-User-ID of the actor that approved or declined the application."

  - name: FosterPlacement
    parent: null
    common_fields: true
    fields:
      - name: animal_id
        type: string
        source: input
        description: "FK -> Animal.id; the animal being placed."
      - name: foster_home_id
        type: string
        source: input
        description: "FK -> FosterHome.id; the receiving home."
      - name: foster_application_id
        type: string
        source: input
        description: "FK -> FosterApplication.id; the approved application authorising this placement."
      - name: litter_id
        type: string
        source: input
        default: null
        description: "FK -> Litter.id; nullable. Required when count_basis is NURSING_UNIT."
      - name: predecessor_placement_id
        type: string
        source: computed
        default: null
        description: "FK -> FosterPlacement.id; nullable. Set on the successor placement created by a foster-to-foster transfer."
      - name: count_basis
        type: enum
        source: input
        default: INDIVIDUAL
        description: "Selects the foster capacity consumption variant. NURSING_UNIT means a dam plus her whole litter."
        constraints: "one of INDIVIDUAL, NURSING_UNIT"
      - name: slot_consumption
        type: integer
        source: computed
        description: "Slots this placement consumes while ACTIVE, per foster_slot_consumption."
      - name: headcount_consumption
        type: integer
        source: computed
        description: "Heads this placement consumes while ACTIVE, per foster_headcount_consumption."
      - name: status
        type: enum
        source: computed
        default: PROPOSED
        description: "Placement lifecycle axis."
        constraints: "one of PROPOSED, ACTIVE, ENDED, CANCELLED, TRANSFERRED, CONVERTED_TO_ADOPTION"
      - name: started_at
        type: datetime
        source: computed
        default: null
        description: "Clock instant the placement became ACTIVE; null while PROPOSED."
      - name: ended_at
        type: datetime
        source: computed
        default: null
        description: "Clock instant the placement left ACTIVE; null while PROPOSED or ACTIVE."
      - name: end_reason
        type: enum
        source: computed
        default: null
        description: "Why the placement ended."
        constraints: "one of RETURNED_TO_SHELTER, TRANSFERRED_OUT, ADOPTED, ANIMAL_OUTCOME_CLOSED, CANCELLED_BEFORE_START"

  - name: MedicalRecord
    parent: Animal
    common_fields: true
    fields:
      - name: animal_id
        type: string
        source: input
        description: "FK -> Animal.id; the patient."
      - name: procedure_type
        type: enum
        source: input
        description: "Kind of veterinary work; SPAY_NEUTER completion sets Animal.alteration_status to ALTERED and VACCINE_RABIES completion sets Animal.rabies_vaccinated_at."
        constraints: "one of EXAM, VACCINE_RABIES, SPAY_NEUTER, TREATMENT"
      - name: expense_category
        type: enum
        source: input
        description: "Expense bucket a restricted contribution must match to fund this record."
        constraints: "one of MEDICAL, SPAY_NEUTER, VACCINE"
      - name: cost_cents
        type: integer
        source: input
        description: "Gross cost of the procedure."
        constraints: ">= 0"
      - name: funding_required
        type: boolean
        source: input
        default: false
        description: "Conditional flag. When true, completion draws restricted or unrestricted contributions and fails if they are insufficient. When false, completion charges the whole cost to Organization.unrestricted_balance_cents without drawing contributions."
      - name: scheduled_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the procedure is scheduled for."
      - name: completed_at
        type: datetime
        source: computed
        default: null
        description: "Clock instant of completion; null while ORDERED."
      - name: status
        type: enum
        source: computed
        default: ORDERED
        description: "Medical record axis."
        constraints: "one of ORDERED, COMPLETED"
      - name: funded_contribution_ids
        type: array
        source: computed
        default: []
        description: "Ordered list of Contribution identifiers drawn by this record, in draw order. Not a foreign key field."
      - name: funded_amount_cents
        type: integer
        source: computed
        default: 0
        description: "Total cents drawn from contributions by this record."
      - name: admin_overhead_cents
        type: integer
        source: computed
        default: 0
        description: "Administrative overhead, computed per draw line at MEDICAL_ADMIN_OVERHEAD_PCT and rounded per line before summing."

  - name: HealthCertificate
    parent: Animal
    common_fields: true
    fields:
      - name: animal_id
        type: string
        source: input
        description: "FK -> Animal.id; the certified animal."
      - name: issued_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the accredited veterinarian issued the certificate."
      - name: destination_state
        type: string
        source: input
        description: "Two-letter US state code the certificate authorises movement into."
        constraints: "exactly 2 uppercase letters"
      - name: vet_license_number
        type: string
        source: input
        description: "Accredited veterinarian licence identifier."
      - name: window_days
        type: integer
        source: computed
        description: "Species-selected validity window: CVI_WINDOW_DAYS_DOG, CVI_WINDOW_DAYS_CAT or CVI_WINDOW_DAYS_OTHER."
      - name: expires_at
        type: datetime
        source: computed
        description: "issued_at + window_days * 24h."
      - name: status
        type: enum
        source: computed
        default: VALID
        description: "Certificate axis; EXPIRED is written the first time a departure check observes clock_now > expires_at."
        constraints: "one of VALID, EXPIRED"

  - name: TransportRun
    parent: null
    common_fields: true
    fields:
      - name: origin_organization_id
        type: string
        source: input
        description: "FK -> Organization.id; the organization dispatching the run."
      - name: partner_commitment_id
        type: string
        source: input
        default: null
        description: "FK -> PartnerCommitment.id; nullable. Required when purpose is TRANSFER_OUT."
      - name: run_type
        type: enum
        source: input
        description: "RESCUE_LEG is a single field-pickup leg; RELAY is a multi-leg chain with driver handoffs at hubs."
        constraints: "one of RESCUE_LEG, RELAY"
      - name: purpose
        type: enum
        source: input
        default: INTAKE_TRANSPORT
        description: "INTAKE_TRANSPORT moves animals into the network; TRANSFER_OUT delivers them to a partner rescue and draws that partner's commitment slots at run start."
        constraints: "one of INTAKE_TRANSPORT, TRANSFER_OUT"
      - name: origin_hub_code
        type: string
        source: input
        description: "Hub code the first leg departs from."
      - name: destination_hub_code
        type: string
        source: input
        description: "Hub code the final leg arrives at."
      - name: status
        type: enum
        source: computed
        default: PLANNED
        description: "Run axis."
        constraints: "one of PLANNED, IN_PROGRESS, COMPLETED, ABORTED, CANCELLED"
      - name: slots_drawn
        type: integer
        source: computed
        default: 0
        description: "Partner commitment slots this run currently holds; zero unless purpose is TRANSFER_OUT and status is IN_PROGRESS or COMPLETED."
      - name: started_at
        type: datetime
        source: computed
        default: null
        description: "Clock instant the run started; null while PLANNED."
      - name: aborted_at
        type: datetime
        source: computed
        default: null
        description: "Clock instant the run aborted; null unless status is ABORTED."

  - name: TransportLeg
    parent: TransportRun
    common_fields: true
    fields:
      - name: transport_run_id
        type: string
        source: input
        description: "FK -> TransportRun.id; the run this leg belongs to."
      - name: driver_person_id
        type: string
        source: input
        description: "FK -> Person.id; the assigned driver. The person must have a non-null driver_license_number."
      - name: sequence_no
        type: integer
        source: input
        description: "1-based position within the run. Legs depart in ascending sequence_no."
        constraints: ">= 1, unique within transport_run_id"
      - name: origin_hub_code
        type: string
        source: input
        description: "Hub code this leg departs from."
      - name: destination_hub_code
        type: string
        source: input
        description: "Hub code this leg arrives at; the handoff point for the next leg."
      - name: scheduled_depart_at
        type: datetime
        source: input
        description: "ISO 8601 UTC scheduled departure; the instant CVI validity is evaluated against."
      - name: scheduled_arrive_at
        type: datetime
        source: input
        description: "ISO 8601 UTC scheduled arrival; must be strictly after scheduled_depart_at."
      - name: crate_capacity_units
        type: integer
        source: input
        description: "Crate-slot capacity of the vehicle on this leg."
        constraints: ">= 1"
      - name: weight_capacity_lb
        type: number
        source: input
        description: "Total live-weight capacity of the vehicle on this leg."
        constraints: "> 0"
      - name: crosses_state_line
        type: boolean
        source: input
        default: false
        description: "When true every manifested animal needs a VALID HealthCertificate at scheduled_depart_at."
      - name: destination_state_code
        type: string
        source: input
        default: null
        description: "Two-letter US state code the leg enters. Required when crosses_state_line is true; the certificate check matches HealthCertificate.destination_state against exactly this value."
        constraints: "exactly 2 uppercase letters when crosses_state_line is true"
      - name: species_policy
        type: enum
        source: input
        default: ANY
        description: "Compatibility policy enforced over the leg's manifest."
        constraints: "one of DOGS_ONLY, CATS_ONLY, MIXED_SEGREGATED, ANY"
      - name: used_crate_units
        type: integer
        source: computed
        default: 0
        description: "Sum of crate_units over ManifestEntry rows on this leg whose status is ASSIGNED, LOADED or DELIVERED."
      - name: used_weight_lb
        type: number
        source: computed
        default: 0
        description: "Sum of Animal.weight_lb over ManifestEntry rows on this leg whose status is ASSIGNED, LOADED or DELIVERED."
      - name: status
        type: enum
        source: computed
        default: SCHEDULED
        description: "Leg axis."
        constraints: "one of SCHEDULED, DEPARTED, ARRIVED, ABORTED, INVALIDATED"
      - name: departed_at
        type: datetime
        source: computed
        default: null
        description: "Clock instant of actual departure; null while SCHEDULED."
      - name: arrived_at
        type: datetime
        source: computed
        default: null
        description: "Clock instant of actual arrival; null until ARRIVED."

  - name: ManifestEntry
    parent: TransportLeg
    common_fields: true
    fields:
      - name: transport_leg_id
        type: string
        source: input
        description: "FK -> TransportLeg.id; the leg carrying the animal."
      - name: animal_id
        type: string
        source: input
        description: "FK -> Animal.id; the carried animal."
      - name: crate_units
        type: integer
        source: computed
        description: "Crate units this entry consumes, per litter_transport_units when the animal belongs to a GROUPED litter, otherwise per size_class."
      - name: is_litter_anchor
        type: boolean
        source: computed
        default: false
        description: "True on the first entry of a GROUPED litter on a leg; that anchor entry carries the whole litter's CRATE_UNITS_LITTER_GROUPED cost and its littermates carry 0."
      - name: status
        type: enum
        source: computed
        default: ASSIGNED
        description: "Manifest axis; STRANDED entries may be re-assigned onto a replacement leg."
        constraints: "one of ASSIGNED, LOADED, DELIVERED, BUMPED, STRANDED"
      - name: stranded_at_hub_code
        type: string
        source: computed
        default: null
        description: "Hub code the animal was stranded at; null unless status is STRANDED."

  - name: AdoptionApplication
    parent: null
    common_fields: true
    fields:
      - name: animal_id
        type: string
        source: input
        description: "FK -> Animal.id; the animal applied for."
      - name: applicant_person_id
        type: string
        source: input
        description: "FK -> Person.id; the applicant, whose declared household is matched against the animal's restrictions."
      - name: attempt_count
        type: integer
        source: computed
        default: 1
        description: "How many times this application has been submitted, including the original. Capped at MAX_ADOPTION_APPLICATION_ATTEMPTS."
      - name: status
        type: enum
        source: computed
        default: SUBMITTED
        description: "Application axis with a capped resubmission loop."
        constraints: "one of SUBMITTED, APPROVED, DECLINED, AUTO_DECLINED, FINALIZED"
      - name: screened_by_user_id
        type: string
        source: computed
        default: null
        description: "X-User-ID of the actor that screened this application. The finalizing actor must be a different user."
      - name: screened_at
        type: datetime
        source: computed
        default: null
        description: "Clock instant of the most recent screening decision."
      - name: decline_reason
        type: enum
        source: computed
        default: null
        description: "Why the application was declined. A household mismatch is NOT a member here: that check rejects the create at priority 24, so no row ever exists carrying it."
        constraints: "one of COUNSELOR_DECISION, SUPERSEDED_BY_FINALIZED_SIBLING"

  - name: Adoption
    parent: null
    common_fields: true
    fields:
      - name: adoption_application_id
        type: string
        source: input
        description: "FK -> AdoptionApplication.id; the approved application being finalized."
      - name: animal_id
        type: string
        source: computed
        description: "FK -> Animal.id; copied from the application at finalize time."
      - name: adopter_person_id
        type: string
        source: computed
        description: "FK -> Person.id; copied from the application at finalize time."
      - name: credit_application_order
        type: enum
        source: input
        default: CREDIT_FIRST
        description: "Selects the fee waterfall variant: whether sponsorship credit is applied before or after the promotional waiver."
        constraints: "one of CREDIT_FIRST, WAIVER_FIRST"
      - name: refund_basis
        type: enum
        source: input
        default: FEE_PAID
        description: "Selects the return refund variant: FEE_PAID refunds only adopter cash, FEE_ASSESSED additionally restores a proportional share of applied sponsorship credit."
        constraints: "one of FEE_PAID, FEE_ASSESSED"
      - name: deposit_basis
        type: enum
        source: input
        default: FLAT
        description: "Selects the deferred-alteration deposit variant when the animal is under ALTERATION_MIN_AGE_WEEKS."
        constraints: "one of FLAT, AGE_SCALED"
      - name: base_fee_cents
        type: integer
        source: computed
        description: "Species-selected base adoption fee."
      - name: waiver_kind
        type: enum
        source: computed
        default: NONE
        description: "Which single promotional waiver applied; only the larger of the applicable waivers is used, never both."
        constraints: "one of NONE, SENIOR, LONG_STAY"
      - name: waiver_applied_cents
        type: integer
        source: computed
        default: 0
        description: "Cents removed by the promotional waiver under the selected waterfall variant."
      - name: sponsorship_applied_cents
        type: integer
        source: computed
        default: 0
        description: "Cents of designated sponsorship credit consumed under the selected waterfall variant."
      - name: adopter_charged_cents
        type: integer
        source: computed
        default: 0
        description: "Cents the adopter owes for the animal, excluding any deferred-alteration deposit."
      - name: residual_credit_cents
        type: integer
        source: computed
        default: 0
        description: "Eligible sponsorship credit left unconsumed by the waterfall; released to unrestricted funds by the ADOPTION outcome cascade rather than refunded to the adopter."
      - name: alteration_deposit_cents
        type: integer
        source: computed
        default: 0
        description: "Refundable deferred-alteration deposit assessed when the animal is under ALTERATION_MIN_AGE_WEEKS; 0 otherwise."
      - name: alteration_deposit_refunded_cents
        type: integer
        source: computed
        default: 0
        description: "Deposit refunded on proof of alteration."
      - name: adopter_paid_cents
        type: integer
        source: computed
        default: 0
        description: "Cash received from the adopter so far, deposit included."
      - name: refund_issued_cents
        type: integer
        source: computed
        default: 0
        description: "Cash refunded to the adopter on return."
      - name: credit_restored_cents
        type: integer
        source: computed
        default: 0
        description: "Sponsorship credit restored to its Contribution on return; always 0 under refund_basis FEE_PAID."
      - name: finalized_at
        type: datetime
        source: computed
        description: "Clock instant the adoption was finalized; the origin of the return window."
      - name: returned_at
        type: datetime
        source: computed
        default: null
        description: "Clock instant the adopter returned the animal; null unless status is RETURNED."
      - name: finalized_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the finalizing actor; must differ from the application's screened_by_user_id."
      - name: status
        type: enum
        source: computed
        default: FINALIZED
        description: "Adoption lifecycle axis, parallel to fee_status."
        constraints: "one of FINALIZED, RETURNED"
      - name: fee_status
        type: enum
        source: computed
        default: UNPAID
        description: "Money axis, parallel to status and advancing independently of it."
        constraints: "one of UNPAID, PARTIALLY_PAID, PAID, REFUNDED_PARTIAL, REFUNDED_FULL"

  - name: OutcomeRecord
    parent: Animal
    common_fields: true
    fields:
      - name: animal_id
        type: string
        source: input
        description: "FK -> Animal.id; the animal whose custody episode closed."
      - name: intake_record_id
        type: string
        source: computed
        description: "FK -> IntakeRecord.id; the episode this outcome closes."
      - name: adoption_id
        type: string
        source: computed
        default: null
        description: "FK -> Adoption.id; nullable. Set when outcome_type is ADOPTION or FOSTER_TO_ADOPT."
      - name: partner_commitment_id
        type: string
        source: input
        default: null
        description: "FK -> PartnerCommitment.id; nullable. Required when outcome_type is TRANSFER_OUT."
      - name: counterparty_person_id
        type: string
        source: input
        default: null
        description: "FK -> Person.id; nullable. The adopter for ADOPTION or the reclaiming owner for RETURN_TO_OWNER."
      - name: outcome_type
        type: enum
        source: input
        description: "Live outcomes are ADOPTION, FOSTER_TO_ADOPT, TRANSFER_OUT and RETURN_TO_OWNER; the rest are non-live."
        constraints: "one of ADOPTION, FOSTER_TO_ADOPT, TRANSFER_OUT, RETURN_TO_OWNER, EUTHANASIA_MEDICAL, EUTHANASIA_BEHAVIORAL, EUTHANASIA_OWNER_REQUESTED, DIED_IN_CARE, LOST_IN_CARE"
      - name: is_live_release
        type: boolean
        source: computed
        description: "True for ADOPTION, FOSTER_TO_ADOPT, TRANSFER_OUT and RETURN_TO_OWNER."
      - name: recorded_at
        type: datetime
        source: computed
        description: "Clock instant the outcome was recorded; the date used by the live-release window filter."
      - name: reversed_at
        type: datetime
        source: computed
        default: null
        description: "Clock instant the outcome was reversed by an adoption return; null while the outcome stands."
      - name: reversal_reason
        type: enum
        source: computed
        default: null
        description: "Why the outcome was reversed."
        constraints: "one of ADOPTER_RETURN"

  - name: Contribution
    parent: null
    common_fields: true
    fields:
      - name: donor_person_id
        type: string
        source: input
        description: "FK -> Person.id; the donor."
      - name: designated_animal_id
        type: string
        source: input
        default: null
        description: "FK -> Animal.id; nullable. Sponsorship designated to one specific animal."
      - name: designated_program
        type: enum
        source: input
        default: NONE
        description: "Program designation used when the gift is not animal-specific."
        constraints: "one of NONE, ADOPTION_FEE_ASSISTANCE, TRANSPORT_FUND, MEDICAL_FUND"
      - name: restriction_category
        type: enum
        source: input
        default: UNRESTRICTED
        description: "Expense category this money may be drawn against. UNRESTRICTED may fund any expense category."
        constraints: "one of UNRESTRICTED, MEDICAL, SPAY_NEUTER, VACCINE, TRANSPORT"
      - name: donor_reference
        type: string
        source: input
        description: "Donor-supplied reference string; the final tie-break in every contribution ordering rule."
      - name: amount_cents
        type: integer
        source: input
        description: "Gift amount."
        constraints: "> 0"
      - name: applied_cents
        type: integer
        source: computed
        default: 0
        description: "Cents consumed by adoption fee waterfalls and medical funding draws."
      - name: released_cents
        type: integer
        source: computed
        default: 0
        description: "Cents released to Organization.unrestricted_balance_cents because the designated animal left the system."
      - name: available_cents
        type: integer
        source: computed
        description: "amount_cents - applied_cents - released_cents."
      - name: status
        type: enum
        source: computed
        default: RECEIVED
        description: "Contribution axis."
        constraints: "one of RECEIVED, PARTIALLY_APPLIED, FULLY_APPLIED, RELEASED"
      - name: redesignation_count
        type: integer
        source: computed
        default: 0
        description: "How many times the designation has been changed; each redesignate call increments it."

  - name: PartnerCommitment
    parent: Organization
    common_fields: true
    fields:
      - name: organization_id
        type: string
        source: input
        description: "FK -> Organization.id; the partner rescue offering the slots."
      - name: species
        type: enum
        source: input
        description: "Species the commitment covers; every animal on a drawing run must match."
        constraints: "one of DOG, CAT, OTHER"
      - name: slots_total
        type: integer
        source: input
        description: "Total slots pledged."
        constraints: ">= 1"
      - name: expires_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant after which unused slots may no longer be drawn."
      - name: slots_drawn
        type: integer
        source: computed
        default: 0
        description: "Slots currently held by IN_PROGRESS or COMPLETED transfer-out runs."
      - name: slots_released
        type: integer
        source: computed
        default: 0
        description: "Slots permanently forfeited by expiry; set by the expire sweep."
      - name: slots_open
        type: integer
        source: computed
        description: "slots_total - slots_drawn - slots_released."
      - name: status
        type: enum
        source: computed
        default: OPEN
        description: "Commitment axis; PARTIALLY_DRAWN returns to OPEN when a run aborts and gives its slots back."
        constraints: "one of OPEN, PARTIALLY_DRAWN, EXHAUSTED, EXPIRED"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table — 18 status axes across 14 entities, 13 of them
# non-linear (cycle, parallel axis, or branching fork with divergent effects).
# ---------------------------------------------------------------------------
state_machines:
  - entity: Organization
    state_field: freeze_status
    shape: cyclic
    initial_state: UNFROZEN
    terminal_states: []
    transitions:
      - from: UNFROZEN
        to: FROZEN
        trigger: "POST /rescue/organizations/{id}/records-freeze with freeze_active true"
        actor: PlatformAdmin
        preconditions: ["freeze_status == UNFROZEN", "reason is a non-empty string"]
        side_effects:
          - "sets records_freeze_active true and records_freeze_reason to the supplied reason"
          - "increments Organization.version by 1"
      - from: FROZEN
        to: UNFROZEN
        trigger: "POST /rescue/organizations/{id}/records-freeze with freeze_active false"
        actor: PlatformAdmin
        preconditions: ["freeze_status == FROZEN"]
        side_effects:
          - "sets records_freeze_active false; records_freeze_reason retains the last reason"
          - "increments Organization.version by 1"
        note: "Cyclic: an organization may be frozen and unfrozen repeatedly."

  - entity: Animal
    state_field: lifecycle_status
    shape: cyclic
    initial_state: PRE_INTAKE
    terminal_states: []
    transitions:
      - from: PRE_INTAKE
        to: IN_CUSTODY
        trigger: "POST /rescue/animals/{id}/intake-records"
        actor: IntakeOfficer
        preconditions: ["no IntakeRecord for this animal has status OPEN"]
        side_effects:
          - "creates the IntakeRecord in hold_status HOLD_ACTIVE and status OPEN"
          - "sets Animal.identifiable from microchip_id and copies it to IntakeRecord.identifiable_at_intake"
          - "sets Animal.current_intake_record_id to the new record"
          - "increments Animal.version by 1"
      - from: IN_CUSTODY
        to: IN_TRANSIT
        trigger: "POST /rescue/transport-legs/{id}/depart"
        actor: Driver
        preconditions: ["a ManifestEntry for this animal on the departing leg has status ASSIGNED"]
        side_effects:
          - "sets the animal's ManifestEntry on that leg to LOADED"
          - "clears Animal.current_hub_code"
          - "increments Animal.version by 1"
      - from: IN_TRANSIT
        to: IN_CUSTODY
        trigger: "POST /rescue/transport-legs/{id}/arrive"
        actor: Driver
        preconditions: ["the arriving leg is the highest sequence_no leg of its run"]
        side_effects:
          - "sets the animal's ManifestEntry on that leg to DELIVERED"
          - "sets Animal.current_organization_id to the run's destination organization when purpose is INTAKE_TRANSPORT"
          - "increments Animal.version by 1"
      - from: IN_TRANSIT
        to: STRANDED
        trigger: "system: cascade hop 3 of the leg-abort chain"
        actor: system
        preconditions: ["a ManifestEntry for this animal moved LOADED -> STRANDED"]
        side_effects:
          - "sets Animal.current_hub_code to the aborted leg's origin_hub_code"
          - "cascade hop 4: the animal's TransportRun moves IN_PROGRESS -> ABORTED"
          - "increments Animal.version by 1"
      - from: STRANDED
        to: IN_TRANSIT
        trigger: "POST /rescue/transport-legs/{id}/depart on a replacement leg"
        actor: Driver
        preconditions: ["a ManifestEntry for this animal on the replacement leg has status ASSIGNED"]
        side_effects:
          - "sets that ManifestEntry to LOADED and clears Animal.current_hub_code"
          - "increments Animal.version by 1"
        note: "Cycle: STRANDED -> IN_TRANSIT -> STRANDED is reachable any number of times."
      - from: IN_CUSTODY
        to: OUTCOME_CLOSED
        trigger: "POST /rescue/animals/{id}/outcomes, or the outcome cascade fired by POST /rescue/adoptions, or POST /rescue/intake-records/{id}/reclaim"
        actor: IntakeOfficer
        preconditions: ["Animal.lifecycle_status == IN_CUSTODY", "the animal's current IntakeRecord.status == OPEN"]
        side_effects:
          - "creates the OutcomeRecord and sets IntakeRecord.status to CLOSED"
          - "ends any ACTIVE FosterPlacement for this animal with end_reason ANIMAL_OUTCOME_CLOSED, which recomputes the home's consumed slots and capacity_status"
          - "cascade: every Contribution with designated_animal_id == this animal and available_cents > 0 moves to RELEASED, which raises Organization.unrestricted_balance_cents"
          - "increments Animal.version by 1"
      - from: OUTCOME_CLOSED
        to: IN_CUSTODY
        trigger: "POST /rescue/adoptions/{id}/return"
        actor: AdoptionCounselor
        preconditions: ["the animal's standing OutcomeRecord has outcome_type ADOPTION or FOSTER_TO_ADOPT and reversed_at == null"]
        side_effects:
          - "sets the OutcomeRecord.reversed_at and reversal_reason ADOPTER_RETURN"
          - "moves the superseded IntakeRecord CLOSED -> VOIDED"
          - "creates a new IntakeRecord with intake_type RETURN, hold_days STRAY_HOLD_RETURN_DAYS and hold_status HOLD_EXPIRED"
          - "sets Animal.current_intake_record_id to the new record"
          - "increments Animal.version by 1"
        note: "Cycle: the animal re-enters intake under a different intake_type while its prior live-release outcome is reversed."

  - entity: IntakeRecord
    state_field: hold_status
    shape: linear_monotone
    initial_state: HOLD_ACTIVE
    terminal_states: [HOLD_EXPIRED]
    transitions:
      - from: HOLD_ACTIVE
        to: HOLD_ACTIVE
        trigger: "POST /rescue/animals/{id}/identification with extend_stray_hold true"
        actor: IntakeOfficer
        preconditions:
          - "hold_status == HOLD_ACTIVE"
          - "intake_type == STRAY"
          - "identifiable_at_intake == false"
        side_effects:
          - "sets Animal.microchip_id and Animal.identifiable true"
          - "sets IntakeRecord.identifiable_at_intake true and recomputes hold_days to STRAY_HOLD_STRAY_IDENTIFIABLE_DAYS, moving hold_expires_at later"
          - "increments IntakeRecord.version by 1"
      - from: HOLD_ACTIVE
        to: HOLD_EXPIRED
        trigger: "system: any request that reads or writes this record while clock_now >= hold_expires_at"
        actor: system
        preconditions: ["clock_now >= hold_expires_at"]
        side_effects:
          - "sets hold_status HOLD_EXPIRED permanently"
        note: "Monotone: HOLD_EXPIRED is terminal on this axis. No later event — including a microchip registration or a quarantine extension on a different clock — may return the record to HOLD_ACTIVE."

  - entity: IntakeRecord
    state_field: status
    shape: linear
    initial_state: OPEN
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "system: an OutcomeRecord is written for this episode"
        actor: system
        preconditions: ["status == OPEN"]
        side_effects:
          - "stamps OutcomeRecord.intake_record_id with this record"
          - "increments IntakeRecord.version by 1"
      - from: CLOSED
        to: VOIDED
        trigger: "system: the OutcomeRecord that closed this episode was reversed by POST /rescue/adoptions/{id}/return"
        actor: system
        preconditions: ["status == CLOSED", "the closing OutcomeRecord now has a non-null reversed_at"]
        side_effects:
          - "removes the superseded episode from intake_outcome_conservation so the newly created RETURN episode replaces it one-for-one"
          - "increments IntakeRecord.version by 1"
        note: "VOIDED is the compensating half of the return: exactly one non-VOIDED episode remains for the animal, so the conservation identity is preserved."

  - entity: HoldRecord
    state_field: status
    shape: linear
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /rescue/holds/{id}/release"
        actor: IntakeOfficer
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "sets released_at to clock_now and released_by_user_id to the acting X-User-ID"
          - "the corresponding write gate stops firing for this animal"
          - "increments HoldRecord.version by 1"

  - entity: FosterHome
    state_field: capacity_status
    shape: cyclic
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system: a FosterPlacement becomes ACTIVE and exhausts the last free slot or the last free head"
        actor: system
        preconditions: ["after recomputation consumed_dog_slots == dog_slot_capacity AND consumed_cat_slots == cat_slot_capacity, OR consumed_headcount == max_headcount"]
        side_effects: ["increments FosterHome.version by 1"]
      - from: FULL
        to: OPEN
        trigger: "system: an ACTIVE FosterPlacement ends, is transferred, or converts to adoption"
        actor: system
        preconditions: ["after recomputation at least one species slot and at least one head remain free"]
        side_effects: ["increments FosterHome.version by 1"]
        note: "Cyclic: capacity_status oscillates with placement churn."

  - entity: FosterApplication
    state_field: application_status
    shape: cyclic
    initial_state: SUBMITTED
    terminal_states: [DECLINED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /rescue/foster-applications/{id}/decision with decision APPROVE"
        actor: FosterCoordinator
        preconditions: ["application_status == SUBMITTED"]
        side_effects:
          - "sets decided_by_user_id to the acting X-User-ID"
          - "increments FosterApplication.version by 1"
        note: "Approval does NOT touch home_check_status; the two axes advance independently."
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /rescue/foster-applications/{id}/decision with decision DECLINE"
        actor: FosterCoordinator
        preconditions: ["application_status == SUBMITTED"]
        side_effects: ["sets decided_by_user_id", "increments FosterApplication.version by 1"]
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /rescue/foster-applications/{id}/status-change with action SUSPEND"
        actor: FosterCoordinator
        preconditions: ["application_status == APPROVED"]
        side_effects: ["increments FosterApplication.version by 1"]
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /rescue/foster-applications/{id}/status-change with action RESUME"
        actor: FosterCoordinator
        preconditions: ["application_status == SUSPENDED"]
        side_effects: ["increments FosterApplication.version by 1"]
        note: "Cycle: APPROVED -> SUSPENDED -> APPROVED may repeat."
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /rescue/foster-applications/{id}/status-change with action WITHDRAW"
        actor: FosterParent
        preconditions: ["application_status == APPROVED", "acting X-User-ID == FosterApplication.person_id"]
        side_effects: ["increments FosterApplication.version by 1"]

  - entity: FosterApplication
    state_field: home_check_status
    shape: cyclic_parallel
    initial_state: NOT_SCHEDULED
    terminal_states: []
    transitions:
      - from: NOT_SCHEDULED
        to: PASSED
        trigger: "POST /rescue/foster-applications/{id}/home-check with result PASS"
        actor: FosterCoordinator
        preconditions: ["home_check_status == NOT_SCHEDULED or FAILED or LAPSED"]
        side_effects:
          - "sets home_check_passed_at to checked_at and home_check_expires_at to checked_at + HOME_CHECK_VALID_DAYS * 24h"
          - "increments FosterApplication.version by 1"
      - from: NOT_SCHEDULED
        to: FAILED
        trigger: "POST /rescue/foster-applications/{id}/home-check with result FAIL"
        actor: FosterCoordinator
        preconditions: ["home_check_status == NOT_SCHEDULED or PASSED or LAPSED"]
        side_effects: ["clears home_check_passed_at and home_check_expires_at", "increments FosterApplication.version by 1"]
      - from: PASSED
        to: LAPSED
        trigger: "system: any request that reads or writes this application while clock_now > home_check_expires_at"
        actor: system
        preconditions: ["home_check_status == PASSED", "clock_now > home_check_expires_at"]
        side_effects: ["blocks new FosterPlacement creation against this application"]
      - from: LAPSED
        to: PASSED
        trigger: "POST /rescue/foster-applications/{id}/home-check with result PASS"
        actor: FosterCoordinator
        preconditions: ["home_check_status == LAPSED"]
        side_effects:
          - "resets home_check_passed_at and home_check_expires_at from the new checked_at"
          - "increments FosterApplication.version by 1"
        note: "Cycle: a re-check resets the clock. This axis runs fully in parallel with application_status — an APPROVED application can sit at LAPSED, and a SUSPENDED application can sit at PASSED."
      - from: FAILED
        to: PASSED
        trigger: "POST /rescue/foster-applications/{id}/home-check with result PASS"
        actor: FosterCoordinator
        preconditions: ["home_check_status == FAILED"]
        side_effects: ["sets home_check_passed_at and home_check_expires_at", "increments FosterApplication.version by 1"]

  - entity: FosterPlacement
    state_field: status
    shape: branching
    initial_state: PROPOSED
    terminal_states: [ENDED, CANCELLED, TRANSFERRED, CONVERTED_TO_ADOPTION]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /rescue/foster-placements/{id}/activate"
        actor: FosterCoordinator
        preconditions:
          - "status == PROPOSED"
          - "the linked FosterApplication has application_status == APPROVED and home_check_status == PASSED"
          - "the home still has free slots and heads for this placement's consumption"
        side_effects:
          - "sets started_at, Animal.current_foster_home_id and recomputes the home's consumed slots, consumed headcount and capacity_status"
          - "increments FosterPlacement.version by 1"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /rescue/foster-placements/{id}/end with reason CANCELLED_BEFORE_START"
        actor: FosterCoordinator
        preconditions: ["status == PROPOSED"]
        side_effects: ["sets ended_at and end_reason", "increments FosterPlacement.version by 1"]
      - from: ACTIVE
        to: ENDED
        trigger: "POST /rescue/foster-placements/{id}/end with reason RETURNED_TO_SHELTER, or the animal-outcome cascade"
        actor: FosterCoordinator
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "sets ended_at and end_reason, clears Animal.current_foster_home_id"
          - "recomputes the home's consumed slots, consumed headcount and capacity_status"
          - "increments FosterPlacement.version by 1"
      - from: ACTIVE
        to: TRANSFERRED
        trigger: "POST /rescue/foster-placements/{id}/transfer"
        actor: FosterCoordinator
        preconditions: ["status == ACTIVE", "no ACTIVE MEDICAL HoldRecord on the animal", "the destination application is APPROVED with a PASSED home check"]
        side_effects:
          - "sets ended_at and end_reason TRANSFERRED_OUT on this placement"
          - "creates a successor FosterPlacement in status ACTIVE with predecessor_placement_id set to this placement"
          - "recomputes both homes' consumed slots, headcount and capacity_status"
          - "increments FosterPlacement.version by 1"
        note: "Branch with a divergent side-effect set: TRANSFERRED creates a successor row, ENDED does not."
      - from: ACTIVE
        to: CONVERTED_TO_ADOPTION
        trigger: "POST /rescue/adoptions when the application's animal has an ACTIVE placement in the adopter's own foster home"
        actor: AdoptionCounselor
        preconditions: ["status == ACTIVE", "the adopter is the foster home's person_id"]
        side_effects:
          - "sets ended_at and end_reason ADOPTED, clears Animal.current_foster_home_id"
          - "the OutcomeRecord written by the adoption carries outcome_type FOSTER_TO_ADOPT rather than ADOPTION"
          - "increments FosterPlacement.version by 1"
        note: "Foster-to-adopt: the placement ends but the animal never returns to the shelter."

  - entity: MedicalRecord
    state_field: status
    shape: linear
    initial_state: ORDERED
    terminal_states: [COMPLETED]
    transitions:
      - from: ORDERED
        to: COMPLETED
        trigger: "POST /rescue/medical-records/{id}/complete"
        actor: Veterinarian
        preconditions: ["status == ORDERED", "when funding_required is true the eligible contribution pool covers cost_cents"]
        side_effects:
          - "sets completed_at to clock_now"
          - "when procedure_type == SPAY_NEUTER sets Animal.alteration_status ALTERED"
          - "when procedure_type == VACCINE_RABIES sets Animal.rabies_vaccinated_at to completed_at"
          - "when funding_required is true draws contributions in the pinned order, raising each Contribution.applied_cents and lowering available_cents, and charges per-line admin overhead to Organization.unrestricted_balance_cents"
          - "when funding_required is false lowers Organization.unrestricted_balance_cents by cost_cents and draws nothing"
          - "increments MedicalRecord.version by 1"

  - entity: HealthCertificate
    state_field: status
    shape: linear
    initial_state: VALID
    terminal_states: [EXPIRED]
    transitions:
      - from: VALID
        to: EXPIRED
        trigger: "system: any read or write that observes clock_now > expires_at"
        actor: system
        preconditions: ["clock_now > expires_at"]
        side_effects:
          - "sets status EXPIRED; the certificate can no longer authorise an interstate departure"
        note: "A certificate that expires mid-relay does not mutate any leg. Legs already ARRIVED keep their status; every remaining leg carrying that animal is simply rejected at its own departure check with ERR_CVI_EXPIRED until a fresh certificate is issued."

  - entity: TransportRun
    state_field: status
    shape: branching
    initial_state: PLANNED
    terminal_states: [COMPLETED, ABORTED, CANCELLED]
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /rescue/transport-runs/{id}/start"
        actor: TransportDispatcher
        preconditions:
          - "status == PLANNED"
          - "at least one TransportLeg exists on the run"
          - "when purpose == TRANSFER_OUT the linked PartnerCommitment is not EXPIRED, every manifested animal's species equals the commitment species, and slots_open >= the run's distinct manifested animal count"
        side_effects:
          - "when purpose == TRANSFER_OUT sets slots_drawn to the distinct manifested animal count, raises PartnerCommitment.slots_drawn by the same amount, lowers slots_open, and moves the commitment OPEN -> PARTIALLY_DRAWN or -> EXHAUSTED"
          - "recomputes Organization.open_commitment_slots_total for the partner organization"
          - "sets started_at to clock_now"
          - "increments TransportRun.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /rescue/transport-runs/{id}/abort while the run has not started"
        actor: TransportDispatcher
        preconditions: ["status == PLANNED"]
        side_effects:
          - "moves every SCHEDULED leg of the run to INVALIDATED and every ASSIGNED ManifestEntry to BUMPED"
          - "increments TransportRun.version by 1"
        note: "Branch: an unstarted run cancels without ever touching partner slots, so its side-effect set differs from ABORTED."
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /rescue/transport-legs/{id}/arrive on the highest sequence_no leg"
        actor: Driver
        preconditions: ["status == IN_PROGRESS", "every leg of the run is ARRIVED"]
        side_effects:
          - "sets every LOADED ManifestEntry on the final leg to DELIVERED"
          - "increments TransportRun.version by 1"
      - from: IN_PROGRESS
        to: ABORTED
        trigger: "POST /rescue/transport-runs/{id}/abort, or cascade hop 4 when an animal on the run becomes STRANDED"
        actor: TransportDispatcher
        preconditions: ["status == IN_PROGRESS"]
        side_effects:
          - "sets aborted_at to clock_now"
          - "moves every SCHEDULED leg of the run to INVALIDATED"
          - "cascade hop 5: when purpose == TRANSFER_OUT returns slots_drawn to the PartnerCommitment, lowering slots_drawn and raising slots_open, and moves the commitment EXHAUSTED -> PARTIALLY_DRAWN or PARTIALLY_DRAWN -> OPEN"
          - "cascade hop 6: recomputes Organization.open_commitment_slots_total on the partner organization"
          - "increments TransportRun.version by 1"

  - entity: TransportLeg
    state_field: status
    shape: branching
    initial_state: SCHEDULED
    terminal_states: [ARRIVED, ABORTED, INVALIDATED]
    transitions:
      - from: SCHEDULED
        to: DEPARTED
        trigger: "POST /rescue/transport-legs/{id}/depart"
        actor: Driver
        preconditions:
          - "status == SCHEDULED"
          - "the parent TransportRun.status == IN_PROGRESS"
          - "every leg of the same run with a lower sequence_no has status ARRIVED"
          - "when crosses_state_line is true every manifested animal has a HealthCertificate whose status is VALID at scheduled_depart_at and whose rabies precondition holds"
          - "no manifested animal has an ACTIVE LEGAL HoldRecord"
        side_effects:
          - "sets departed_at to clock_now, moves every ASSIGNED ManifestEntry on the leg to LOADED, and moves each carried Animal IN_CUSTODY -> IN_TRANSIT or STRANDED -> IN_TRANSIT"
          - "increments TransportLeg.version by 1"
      - from: DEPARTED
        to: ARRIVED
        trigger: "POST /rescue/transport-legs/{id}/arrive"
        actor: Driver
        preconditions: ["status == DEPARTED"]
        side_effects:
          - "sets arrived_at to clock_now"
          - "on the highest sequence_no leg moves every LOADED ManifestEntry to DELIVERED, returns each animal to IN_CUSTODY and moves the run IN_PROGRESS -> COMPLETED"
          - "on an intermediate leg the animals stay IN_TRANSIT awaiting the next leg's departure"
          - "increments TransportLeg.version by 1"
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /rescue/transport-legs/{id}/abort"
        actor: TransportDispatcher
        preconditions: ["status == SCHEDULED"]
        side_effects:
          - "moves every ASSIGNED ManifestEntry on this leg to BUMPED; no animal is stranded because none was loaded"
          - "increments TransportLeg.version by 1"
        note: "Branch: aborting before departure bumps, aborting after departure strands. The two branches have disjoint side-effect sets."
      - from: DEPARTED
        to: ABORTED
        trigger: "POST /rescue/transport-legs/{id}/abort"
        actor: TransportDispatcher
        preconditions: ["status == DEPARTED"]
        side_effects:
          - "cascade hop 2: every LOADED ManifestEntry on this leg moves to STRANDED with stranded_at_hub_code set to the leg's origin_hub_code"
          - "cascade hop 3: each stranded entry moves its Animal IN_TRANSIT -> STRANDED and sets Animal.current_hub_code"
          - "cascade hop 4: the stranding of an animal moves the parent TransportRun IN_PROGRESS -> ABORTED"
          - "cascade hop 5: the run abort returns the drawn slots to the PartnerCommitment"
          - "cascade hop 6: the commitment change recomputes Organization.open_commitment_slots_total"
          - "increments TransportLeg.version by 1"
      - from: SCHEDULED
        to: INVALIDATED
        trigger: "system: the parent TransportRun moved to ABORTED or CANCELLED"
        actor: system
        preconditions: ["status == SCHEDULED"]
        side_effects:
          - "the leg can never depart; its ASSIGNED entries move to BUMPED"
        note: "Only a run abort or cancel invalidates a leg. An expired certificate never mutates a leg — it just blocks that leg's own departure."

  - entity: ManifestEntry
    state_field: status
    shape: cyclic
    initial_state: ASSIGNED
    terminal_states: [DELIVERED, BUMPED]
    transitions:
      - from: ASSIGNED
        to: LOADED
        trigger: "POST /rescue/transport-legs/{id}/depart"
        actor: Driver
        preconditions: ["status == ASSIGNED", "the leg moved SCHEDULED -> DEPARTED"]
        side_effects: ["increments ManifestEntry.version by 1"]
      - from: LOADED
        to: DELIVERED
        trigger: "POST /rescue/transport-legs/{id}/arrive"
        actor: Driver
        preconditions: ["status == LOADED"]
        side_effects: ["increments ManifestEntry.version by 1"]
      - from: ASSIGNED
        to: BUMPED
        trigger: "DELETE /rescue/manifest-entries/{id}, or a leg abort or invalidation before departure"
        actor: TransportDispatcher
        preconditions: ["status == ASSIGNED"]
        side_effects:
          - "lowers TransportLeg.used_crate_units and used_weight_lb by this entry's contribution"
          - "increments ManifestEntry.version by 1 and increments TransportLeg.version by 1"
      - from: LOADED
        to: STRANDED
        trigger: "system: cascade hop 2 of the leg-abort chain"
        actor: system
        preconditions: ["status == LOADED", "the carrying leg moved DEPARTED -> ABORTED"]
        side_effects:
          - "sets stranded_at_hub_code"
          - "cascade hop 3: moves the Animal IN_TRANSIT -> STRANDED"
      - from: STRANDED
        to: ASSIGNED
        trigger: "POST /rescue/transport-legs/{id}/manifest-entries re-manifesting the same animal onto a replacement leg"
        actor: TransportDispatcher
        preconditions: ["the animal has a STRANDED entry", "the replacement leg's origin_hub_code equals the animal's current_hub_code"]
        side_effects:
          - "the old STRANDED entry stays STRANDED for audit and a new entry is created in ASSIGNED on the replacement leg"
          - "raises the replacement leg's used_crate_units and used_weight_lb"
        note: "Cycle: an animal may be stranded and re-manifested repeatedly."

  - entity: AdoptionApplication
    state_field: status
    shape: cyclic_capped
    initial_state: SUBMITTED
    terminal_states: [AUTO_DECLINED, FINALIZED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /rescue/adoption-applications/{id}/screen with decision APPROVE"
        actor: AdoptionCounselor
        preconditions: ["status == SUBMITTED"]
        side_effects:
          - "sets screened_by_user_id to the acting X-User-ID and screened_at to clock_now"
          - "increments AdoptionApplication.version by 1"
        note: "Screening is permitted while the animal's stray hold is still HOLD_ACTIVE; only finalization is blocked by the hold."
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /rescue/adoption-applications/{id}/screen with decision DECLINE"
        actor: AdoptionCounselor
        preconditions: ["status == SUBMITTED"]
        side_effects:
          - "sets decline_reason COUNSELOR_DECISION, screened_by_user_id and screened_at"
          - "increments AdoptionApplication.version by 1"
      - from: DECLINED
        to: SUBMITTED
        trigger: "POST /rescue/adoption-applications/{id}/resubmit"
        actor: Adopter
        preconditions:
          - "status == DECLINED"
          - "attempt_count < MAX_ADOPTION_APPLICATION_ATTEMPTS"
          - "acting X-User-ID == applicant_person_id"
        side_effects:
          - "increments attempt_count by 1, clears decline_reason, screened_by_user_id and screened_at"
          - "increments AdoptionApplication.version by 1"
        note: "Capped cycle: the third submission is the last; a fourth is rejected with ERR_APPLICATION_ATTEMPT_LIMIT."
      - from: APPROVED
        to: FINALIZED
        trigger: "POST /rescue/adoptions"
        actor: AdoptionCounselor
        preconditions:
          - "status == APPROVED"
          - "the finalizing X-User-ID differs from screened_by_user_id"
        side_effects:
          - "creates the Adoption, runs the fee waterfall and writes the OutcomeRecord"
          - "moves every other AdoptionApplication on the same animal whose status is SUBMITTED or APPROVED to AUTO_DECLINED with decline_reason SUPERSEDED_BY_FINALIZED_SIBLING"
          - "increments AdoptionApplication.version by 1"
      - from: SUBMITTED
        to: AUTO_DECLINED
        trigger: "system: a sibling application on the same animal was finalized"
        actor: system
        preconditions: ["status == SUBMITTED"]
        side_effects: ["sets decline_reason SUPERSEDED_BY_FINALIZED_SIBLING"]
      - from: APPROVED
        to: AUTO_DECLINED
        trigger: "system: a sibling application on the same animal was finalized"
        actor: system
        preconditions: ["status == APPROVED"]
        side_effects: ["sets decline_reason SUPERSEDED_BY_FINALIZED_SIBLING"]

  - entity: Adoption
    state_field: status
    shape: parallel
    initial_state: FINALIZED
    terminal_states: [RETURNED]
    transitions:
      - from: FINALIZED
        to: RETURNED
        trigger: "POST /rescue/adoptions/{id}/return"
        actor: AdoptionCounselor
        preconditions:
          - "status == FINALIZED"
          - "clock_now <= finalized_at + RETURN_WINDOW_PARTIAL_DAYS * 24h"
        side_effects:
          - "cascade hop 1: sets returned_at, refund_issued_cents and credit_restored_cents per the selected refund variant, and advances fee_status on the parallel money axis"
          - "cascade hop 2: sets the standing OutcomeRecord.reversed_at and reversal_reason ADOPTER_RETURN, removing it from the live-release numerator"
          - "cascade hop 3: the reversal voids the superseded IntakeRecord and creates a new IntakeRecord with intake_type RETURN"
          - "cascade hop 4: the new intake record moves the Animal OUTCOME_CLOSED -> IN_CUSTODY and repoints Animal.current_intake_record_id"
          - "increments Adoption.version by 1"

  - entity: Adoption
    state_field: fee_status
    shape: parallel
    initial_state: UNPAID
    terminal_states: [REFUNDED_FULL]
    transitions:
      - from: UNPAID
        to: PARTIALLY_PAID
        trigger: "POST /rescue/adoptions/{id}/payment"
        actor: Adopter
        preconditions: ["adopter_paid_cents + amount_cents < adopter_charged_cents + alteration_deposit_cents"]
        side_effects: ["raises adopter_paid_cents", "increments Adoption.version by 1"]
      - from: UNPAID
        to: PAID
        trigger: "POST /rescue/adoptions/{id}/payment"
        actor: Adopter
        preconditions: ["adopter_paid_cents + amount_cents >= adopter_charged_cents + alteration_deposit_cents"]
        side_effects: ["raises adopter_paid_cents", "increments Adoption.version by 1"]
        note: "Parallel axis: fee_status may reach PAID while status is still FINALIZED, and status may reach RETURNED while fee_status is still UNPAID."
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /rescue/adoptions/{id}/payment"
        actor: Adopter
        preconditions: ["adopter_paid_cents + amount_cents >= adopter_charged_cents + alteration_deposit_cents"]
        side_effects: ["raises adopter_paid_cents", "increments Adoption.version by 1"]
      - from: PAID
        to: REFUNDED_PARTIAL
        trigger: "POST /rescue/adoptions/{id}/return with a refund percentage below 1.00"
        actor: AdoptionCounselor
        preconditions: ["refund_issued_cents > 0", "refund_issued_cents < adopter_paid_cents"]
        side_effects: ["increments Adoption.version by 1"]
      - from: PAID
        to: REFUNDED_FULL
        trigger: "POST /rescue/adoptions/{id}/return within RETURN_WINDOW_FULL_DAYS"
        actor: AdoptionCounselor
        preconditions: ["refund_issued_cents == adopter_paid_cents", "adopter_paid_cents > 0"]
        side_effects: ["increments Adoption.version by 1"]

  - entity: Contribution
    state_field: status
    shape: branching
    initial_state: RECEIVED
    terminal_states: [FULLY_APPLIED, RELEASED]
    transitions:
      - from: RECEIVED
        to: RECEIVED
        trigger: "POST /rescue/contributions/{id}/redesignate"
        actor: FinanceOfficer
        preconditions: ["status == RECEIVED", "applied_cents == 0"]
        side_effects:
          - "replaces designated_animal_id, designated_program and restriction_category, and increments redesignation_count"
          - "increments Contribution.version by 1"
        note: "Self-loop: redesignation is only legal before any cent has been applied."
      - from: RECEIVED
        to: PARTIALLY_APPLIED
        trigger: "system: an adoption fee waterfall or a medical funding draw consumes part of the gift"
        actor: system
        preconditions: ["0 < applied_cents < amount_cents"]
        side_effects: ["lowers available_cents by the drawn amount"]
      - from: PARTIALLY_APPLIED
        to: FULLY_APPLIED
        trigger: "system: a later draw consumes the remainder"
        actor: system
        preconditions: ["applied_cents == amount_cents"]
        side_effects: ["sets available_cents to 0"]
      - from: RECEIVED
        to: FULLY_APPLIED
        trigger: "system: a single draw consumes the whole gift"
        actor: system
        preconditions: ["applied_cents == amount_cents"]
        side_effects: ["sets available_cents to 0"]
      - from: RECEIVED
        to: RELEASED
        trigger: "system: the designated animal's OutcomeRecord closes its custody episode"
        actor: system
        preconditions: ["designated_animal_id is not null", "available_cents > 0"]
        side_effects:
          - "moves available_cents into released_cents and raises Organization.unrestricted_balance_cents by the same amount"
      - from: PARTIALLY_APPLIED
        to: RELEASED
        trigger: "system: the designated animal's OutcomeRecord closes its custody episode"
        actor: system
        preconditions: ["designated_animal_id is not null", "available_cents > 0"]
        side_effects:
          - "moves the residual available_cents into released_cents and raises Organization.unrestricted_balance_cents"
        note: "Branch: a designated gift ends either FULLY_APPLIED (all cents spent) or RELEASED (residual returned), never both."

  - entity: PartnerCommitment
    state_field: status
    shape: cyclic
    initial_state: OPEN
    terminal_states: [EXPIRED]
    transitions:
      - from: OPEN
        to: PARTIALLY_DRAWN
        trigger: "POST /rescue/transport-runs/{id}/start on a TRANSFER_OUT run"
        actor: TransportDispatcher
        preconditions: ["0 < slots_drawn < slots_total"]
        side_effects: ["lowers slots_open", "recomputes Organization.open_commitment_slots_total"]
      - from: OPEN
        to: EXHAUSTED
        trigger: "POST /rescue/transport-runs/{id}/start on a TRANSFER_OUT run consuming every slot"
        actor: TransportDispatcher
        preconditions: ["slots_drawn == slots_total"]
        side_effects: ["sets slots_open to 0", "recomputes Organization.open_commitment_slots_total"]
      - from: PARTIALLY_DRAWN
        to: EXHAUSTED
        trigger: "POST /rescue/transport-runs/{id}/start on a further TRANSFER_OUT run"
        actor: TransportDispatcher
        preconditions: ["slots_drawn == slots_total"]
        side_effects: ["sets slots_open to 0"]
      - from: PARTIALLY_DRAWN
        to: OPEN
        trigger: "system: a drawing run aborts and returns its slots"
        actor: system
        preconditions: ["slots_drawn == 0 after the return"]
        side_effects: ["raises slots_open back to slots_total", "recomputes Organization.open_commitment_slots_total"]
        note: "Cycle: draw and release move the commitment back and forth between OPEN and PARTIALLY_DRAWN."
      - from: EXHAUSTED
        to: PARTIALLY_DRAWN
        trigger: "system: one of several drawing runs aborts"
        actor: system
        preconditions: ["0 < slots_drawn < slots_total after the return"]
        side_effects: ["raises slots_open"]
      - from: OPEN
        to: EXPIRED
        trigger: "POST /rescue/partner-commitments/expire-sweep"
        actor: TransportDispatcher
        preconditions: ["clock_now > expires_at", "status == OPEN"]
        side_effects:
          - "moves slots_open into slots_released and sets slots_open to 0"
          - "recomputes Organization.open_commitment_slots_total"
      - from: PARTIALLY_DRAWN
        to: EXPIRED
        trigger: "POST /rescue/partner-commitments/expire-sweep"
        actor: TransportDispatcher
        preconditions: ["clock_now > expires_at", "status == PARTIALLY_DRAWN"]
        side_effects:
          - "moves the remaining slots_open into slots_released and sets slots_open to 0; already drawn slots stay drawn"

concurrency_rules:
  - rule_id: adoption-finalize-stale-animal
    parent_entity: Animal
    write_endpoint: "POST /rescue/adoptions"
    occ_field: "expected_animal_version"
    description: |
      Finalizing an adoption against an Animal whose version has advanced since
      the counselor last observed it is rejected with a stale-version error.
      Several applications may legitimately stand APPROVED on one animal and any
      of them may legitimately be finalized, so a second finalize is not covered
      by a state precondition on the animal alone; the OCC check on
      Animal.version is what decides which finalize is authoritative.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: manifest-add-stale-leg
    parent_entity: TransportLeg
    write_endpoint: "POST /rescue/transport-legs/{id}/manifest-entries"
    occ_field: "expected_leg_version"
    description: |
      Adding an animal to a leg whose version has advanced since the dispatcher
      last read its remaining crate and weight capacity is rejected. Two
      dispatchers may each legitimately add a different animal to the same leg,
      so no state precondition covers the second write; the OCC check on
      TransportLeg.version pins the capacity view the request was computed from.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: placement-create-stale-foster-home
    parent_entity: FosterHome
    write_endpoint: "POST /rescue/foster-placements"
    occ_field: "expected_foster_home_version"
    description: |
      Creating a placement against a FosterHome whose version has advanced since
      the coordinator last read its free slots is rejected. Multiple placements
      into one home are legitimate, so the second create is not covered by a
      state precondition; the OCC check on FosterHome.version pins the capacity
      view the request was computed from.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table — 32 rules, 10 of them dual-variant where the
# variant is selected by a declared enum or boolean on the row, never by a
# magic constant.
# ---------------------------------------------------------------------------
calculations:
  - name: animal_age_derivation
    trigger: "Read on any endpoint returning Animal, and every age-sensitive check"
    algorithm: aggregation
    formula: |
      elapsed_days = floor((clock_now - Animal.date_of_birth) / 24h)
      age_weeks    = floor(elapsed_days / AGE_DAYS_PER_WEEK)
      age_months   = floor(elapsed_days / AGE_DAYS_PER_MONTH)
    input_set: "The single Animal row and the logical clock."
    constants:
      AGE_DAYS_PER_WEEK: 7
      AGE_DAYS_PER_MONTH: 30
    precision: "integer, floor"
    note: "Ages are derived from whole elapsed days divided by fixed day counts. Calendar-month and leap-year arithmetic is deliberately NOT used, so no derivation depends on the calendar."

  - name: stray_hold_expiry
    trigger: "POST /rescue/animals/{id}/intake-records, and POST /rescue/animals/{id}/identification with extend_stray_hold true"
    algorithm: threshold
    formula: |
      if intake_type == STRAY:
          hold_days = STRAY_HOLD_STRAY_IDENTIFIABLE_DAYS if identifiable_at_intake
                      else STRAY_HOLD_STRAY_UNIDENTIFIABLE_DAYS
      elif intake_type == OWNER_SURRENDER: hold_days = STRAY_HOLD_OWNER_SURRENDER_DAYS
      elif intake_type == CONFISCATE:      hold_days = STRAY_HOLD_CONFISCATE_DAYS
      elif intake_type == TRANSFER_IN:     hold_days = STRAY_HOLD_TRANSFER_IN_DAYS
      elif intake_type == RETURN:          hold_days = STRAY_HOLD_RETURN_DAYS
      hold_expires_at = intake_datetime + hold_days * 24h
    input_set: "The IntakeRecord being written and its identifiable_at_intake snapshot."
    constants:
      STRAY_HOLD_STRAY_IDENTIFIABLE_DAYS: 7
      STRAY_HOLD_STRAY_UNIDENTIFIABLE_DAYS: 3
      STRAY_HOLD_OWNER_SURRENDER_DAYS: 0
      STRAY_HOLD_CONFISCATE_DAYS: 10
      STRAY_HOLD_TRANSFER_IN_DAYS: 1
      STRAY_HOLD_RETURN_DAYS: 0
    precision: "whole days; hold_expires_at is an exact ISO 8601 instant"
    variants:
      - name: identifiable_stray
        when: "intake_type == STRAY and identifiable_at_intake == true"
        difference: "hold runs 7 days so the microchipped owner has a longer reclaim window"
      - name: unidentifiable_stray
        when: "intake_type == STRAY and identifiable_at_intake == false"
        difference: "hold runs 3 days; the same intake_datetime yields a hold_expires_at four days earlier"

  - name: hold_status_derivation
    trigger: "Any read or write touching an IntakeRecord"
    algorithm: threshold
    formula: |
      if hold_status == HOLD_EXPIRED: return HOLD_EXPIRED           # monotone latch
      return HOLD_EXPIRED if clock_now >= hold_expires_at else HOLD_ACTIVE
    input_set: "The IntakeRecord row and the logical clock."
    constants: {}
    precision: "boundary is inclusive: clock_now exactly equal to hold_expires_at yields HOLD_EXPIRED"
    note: "Monotone latch. Once HOLD_EXPIRED has been written it is never recomputed to HOLD_ACTIVE, even if a later microchip registration would have produced a longer hold_days."

  - name: impound_billable_days
    trigger: "POST /rescue/intake-records/{id}/reclaim"
    algorithm: chronological
    formula: |
      if impound_billing_basis == CALENDAR_DAY:
          days = count of distinct UTC calendar dates in
                 [date(intake_datetime), date(clock_now)] inclusive
      else:  # OVERNIGHT
          days = max(1, floor((clock_now - intake_datetime) / 24h))
    input_set: "The IntakeRecord being reclaimed and the logical clock at reclaim time."
    constants: {}
    precision: "integer days, minimum 1"
    variants:
      - name: calendar_day_basis
        when: "IntakeRecord.impound_billing_basis == CALENDAR_DAY"
        difference: "every calendar date touched is billed, so a stay from 09:00 on day 1 to 14:00 on day 6 bills 6 days"
      - name: overnight_basis
        when: "IntakeRecord.impound_billing_basis == OVERNIGHT"
        difference: "only whole 24h nights are billed, so the same stay bills 5 days"

  - name: impound_tiered_subtotal
    trigger: "POST /rescue/intake-records/{id}/reclaim, immediately after impound_billable_days"
    algorithm: tiered_pricing
    formula: |
      t1 = min(days, IMPOUND_TIER1_MAX_DAYS)
      t2 = min(max(days - IMPOUND_TIER1_MAX_DAYS, 0), IMPOUND_TIER2_MAX_DAYS - IMPOUND_TIER1_MAX_DAYS)
      t3 = max(days - IMPOUND_TIER2_MAX_DAYS, 0)
      impound_subtotal_cents = t1 * IMPOUND_TIER1_PER_DAY_CENTS
                             + t2 * IMPOUND_TIER2_PER_DAY_CENTS
                             + t3 * IMPOUND_TIER3_PER_DAY_CENTS
    input_set: "The billable day count from impound_billable_days."
    constants:
      IMPOUND_TIER1_MAX_DAYS: 3
      IMPOUND_TIER2_MAX_DAYS: 7
      IMPOUND_TIER1_PER_DAY_CENTS: 1500
      IMPOUND_TIER2_PER_DAY_CENTS: 2500
      IMPOUND_TIER3_PER_DAY_CENTS: 4000
    precision: "whole cents; marginal tiering, not average rate"

  - name: repeat_offense_multiplier_selection
    trigger: "POST /rescue/intake-records/{id}/reclaim"
    algorithm: threshold
    formula: |
      n = Person.reclaim_history_count of the reclaiming person, read BEFORE this reclaim is written
      multiplier = REPEAT_OFFENSE_MULTIPLIER_NONE       if n == 0
                   REPEAT_OFFENSE_MULTIPLIER_SECOND     if n == 1
                   REPEAT_OFFENSE_MULTIPLIER_THIRD_PLUS if n >= 2
    input_set: "OutcomeRecord rows with outcome_type RETURN_TO_OWNER, counterparty_person_id == the reclaiming person and reversed_at == null."
    constants:
      REPEAT_OFFENSE_MULTIPLIER_NONE: 1.0
      REPEAT_OFFENSE_MULTIPLIER_SECOND: 1.5
      REPEAT_OFFENSE_MULTIPLIER_THIRD_PLUS: 2.0
    precision: "exact decimal multiplier"

  - name: reclaim_total_with_hardship_waiver
    trigger: "POST /rescue/intake-records/{id}/reclaim, after the three inputs above"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is PINNED. The waiver is keyed on the PRE-waiver total,
      # which itself depends on the multiplier applied to the impound subtotal.
      # Step 1 multiplier is applied to the impound subtotal ONLY (never to the
      # base reclaim fee), and is rounded before the base fee is added.
      step1 = round_half_up(impound_subtotal_cents * repeat_offense_multiplier)
      step2 = BASE_RECLAIM_FEE_CENTS + step1                    # pre-waiver total
      step3 = RECLAIM_HARDSHIP_WAIVER_CENTS
              if (step2 >= RECLAIM_WAIVER_TOTAL_THRESHOLD_CENTS and Person.hardship_certified)
              else 0
      reclaim_total_cents = max(0, step2 - step3)
    input_set: "The reclaiming Person and the IntakeRecord being closed."
    constants:
      BASE_RECLAIM_FEE_CENTS: 4500
      RECLAIM_WAIVER_TOTAL_THRESHOLD_CENTS: 20000
      RECLAIM_HARDSHIP_WAIVER_CENTS: 2000
    precision: "whole cents, round_half_up at step1 only"
    note: "Circular-looking: the waiver is a function of the total, and the total is a function of the waiver. The pinned order resolves it — the waiver test reads step2, never reclaim_total_cents. Boundary is inclusive at RECLAIM_WAIVER_TOTAL_THRESHOLD_CENTS."

  - name: adoption_base_fee
    trigger: "POST /rescue/adoptions"
    algorithm: threshold
    formula: |
      base_fee_cents = ADOPTION_BASE_FEE_DOG_CENTS   if Animal.species == DOG
                       ADOPTION_BASE_FEE_CAT_CENTS   if Animal.species == CAT
                       ADOPTION_BASE_FEE_OTHER_CENTS if Animal.species == OTHER
    input_set: "The adopted Animal row."
    constants:
      ADOPTION_BASE_FEE_DOG_CENTS: 25000
      ADOPTION_BASE_FEE_CAT_CENTS: 12500
      ADOPTION_BASE_FEE_OTHER_CENTS: 6000
    precision: "whole cents"
    variants:
      - name: dog_fee
        when: "Animal.species == DOG"
        difference: "25000 cents"
      - name: cat_or_other_fee
        when: "Animal.species == CAT or OTHER"
        difference: "12500 or 6000 cents, so an identical waterfall over identical sponsorship produces a different adopter charge"

  - name: adoption_waiver_selection
    trigger: "POST /rescue/adoptions, before the waterfall"
    algorithm: threshold
    formula: |
      senior_ok    = Animal.age_months >= SENIOR_WAIVER_AGE_MONTHS
      long_stay_ok = Animal.length_of_stay_days >= LONG_STAY_WAIVER_DAYS
      candidates   = {SENIOR: SENIOR_WAIVER_PCT if senior_ok} + {LONG_STAY: LONG_STAY_WAIVER_PCT if long_stay_ok}
      waiver_kind  = the candidate with the strictly larger pct; NONE when candidates is empty
      waiver_pct   = pct of waiver_kind, else 0.00
    input_set: "The adopted Animal and its current open IntakeRecord."
    constants:
      SENIOR_WAIVER_AGE_MONTHS: 84
      LONG_STAY_WAIVER_DAYS: 120
      SENIOR_WAIVER_PCT: 0.60
      LONG_STAY_WAIVER_PCT: 0.50
    precision: "exact decimal percentage"
    note: "Waivers never stack. SENIOR_WAIVER_PCT and LONG_STAY_WAIVER_PCT are distinct values so the selection never ties; when both apply SENIOR wins. Boundaries are inclusive (>=)."

  - name: adoption_sponsorship_pool
    trigger: "POST /rescue/adoptions, before the waterfall"
    algorithm: aggregation
    formula: |
      eligible = Contribution rows where
                   status IN {RECEIVED, PARTIALLY_APPLIED}
               AND available_cents > 0
               AND ( designated_animal_id == Adoption.animal_id
                     OR designated_program == ADOPTION_FEE_ASSISTANCE )
      draw order (all three keys, applied in sequence):
        1. rows with designated_animal_id == Adoption.animal_id come before program-designated rows
        2. created_at ASC
        3. donor_reference ASC (lexicographic)
      available_credit_cents = sum(available_cents over eligible)
    input_set: "Contribution rows only; no other entity contributes to the pool."
    constants: {}
    precision: "whole cents"
    note: "Selector is fully pinned: eligibility filter, two ranking keys and a lexicographic final tie-break. Entity ids never participate. When eligible is empty available_credit_cents is 0 and the waterfall proceeds with sponsorship_applied_cents 0."

  - name: adoption_fee_waterfall
    trigger: "POST /rescue/adoptions"
    algorithm: waterfall_allocation
    formula: |
      if credit_application_order == CREDIT_FIRST:
          sponsorship_applied_cents = min(base_fee_cents, available_credit_cents)
          remaining                 = base_fee_cents - sponsorship_applied_cents
          waiver_applied_cents      = round_half_up(remaining * waiver_pct)
          adopter_charged_cents     = remaining - waiver_applied_cents
      else:  # WAIVER_FIRST
          waiver_applied_cents      = round_half_up(base_fee_cents * waiver_pct)
          after_waiver              = base_fee_cents - waiver_applied_cents
          sponsorship_applied_cents = min(after_waiver, available_credit_cents)
          adopter_charged_cents     = after_waiver - sponsorship_applied_cents
      residual_credit_cents = available_credit_cents - sponsorship_applied_cents
    input_set: "base_fee_cents from adoption_base_fee, waiver_pct from adoption_waiver_selection, available_credit_cents from adoption_sponsorship_pool."
    constants: {}
    precision: "whole cents, round_half_up once per branch"
    variants:
      - name: credit_first
        when: "Adoption.credit_application_order == CREDIT_FIRST"
        difference: "credit absorbs the fee before the waiver shrinks it, so the waiver acts on a smaller base and the adopter still owes something"
      - name: waiver_first
        when: "Adoption.credit_application_order == WAIVER_FIRST"
        difference: "the waiver shrinks the fee first, so a large waiver can drop the fee below the available credit — the adopter owes nothing and a strictly positive residual_credit_cents appears"
    note: |
      Non-monotone step: a LARGER waiver under WAIVER_FIRST reduces
      sponsorship_applied_cents, which raises residual_credit_cents. The residual
      is NEVER refunded to the adopter and NEVER applied beyond the fee; it stays
      on the Contribution until the ADOPTION outcome cascade releases it into
      Organization.unrestricted_balance_cents.

  - name: adoption_fee_component_conservation
    trigger: "Every successful POST /rescue/adoptions"
    algorithm: aggregation
    formula: |
      base_fee_cents == sponsorship_applied_cents + waiver_applied_cents + adopter_charged_cents
    input_set: "The single Adoption row just written."
    constants: {}
    precision: "exact integer identity; the deferred-alteration deposit is tracked separately and is not part of this identity"

  - name: alteration_deposit_amount
    trigger: "POST /rescue/adoptions when Animal.alteration_status != ALTERED and Animal.age_weeks < ALTERATION_MIN_AGE_WEEKS"
    algorithm: threshold
    formula: |
      if deposit_basis == FLAT:
          alteration_deposit_cents = ALTERATION_DEPOSIT_FLAT_CENTS
      else:  # AGE_SCALED
          raw = (ALTERATION_MIN_AGE_WEEKS - Animal.age_weeks) * ALTERATION_DEPOSIT_PER_WEEK_CENTS
          alteration_deposit_cents = min(max(raw, ALTERATION_DEPOSIT_SCALED_FLOOR_CENTS),
                                         ALTERATION_DEPOSIT_SCALED_CAP_CENTS)
    input_set: "The adopted Animal's age_weeks and the Adoption's deposit_basis."
    constants:
      ALTERATION_MIN_AGE_WEEKS: 16
      ALTERATION_DEPOSIT_FLAT_CENTS: 15000
      ALTERATION_DEPOSIT_PER_WEEK_CENTS: 1200
      ALTERATION_DEPOSIT_SCALED_FLOOR_CENTS: 6000
      ALTERATION_DEPOSIT_SCALED_CAP_CENTS: 18000
    precision: "whole cents"
    variants:
      - name: flat_deposit
        when: "Adoption.deposit_basis == FLAT"
        difference: "always 15000 cents regardless of how young the animal is"
      - name: age_scaled_deposit
        when: "Adoption.deposit_basis == AGE_SCALED"
        difference: "1200 cents per week short of 16 weeks, clamped to [6000, 18000]; a 12-week animal yields 6000 (floor binds) and a newborn yields 18000 (cap binds)"

  - name: return_refund_amount
    trigger: "POST /rescue/adoptions/{id}/return"
    algorithm: threshold
    formula: |
      elapsed_days = floor((clock_now - Adoption.finalized_at) / 24h)
      pct = RETURN_REFUND_PCT_FULL    if elapsed_days <= RETURN_WINDOW_FULL_DAYS
            RETURN_REFUND_PCT_PARTIAL if elapsed_days <= RETURN_WINDOW_PARTIAL_DAYS
            RETURN_REFUND_PCT_NONE    otherwise
      refund_issued_cents = round_half_up(Adoption.adopter_paid_cents * pct)
      if refund_basis == FEE_ASSESSED:
          credit_restored_cents = round_half_up(Adoption.sponsorship_applied_cents * pct)
      else:
          credit_restored_cents = 0
    input_set: "The Adoption row and the logical clock."
    constants:
      RETURN_WINDOW_FULL_DAYS: 14
      RETURN_WINDOW_PARTIAL_DAYS: 30
      RETURN_REFUND_PCT_FULL: 1.00
      RETURN_REFUND_PCT_PARTIAL: 0.50
      RETURN_REFUND_PCT_NONE: 0.00
    precision: "whole cents, round_half_up"
    variants:
      - name: fee_paid_basis
        when: "Adoption.refund_basis == FEE_PAID"
        difference: "only adopter cash is refunded; the sponsoring Contribution keeps its applied_cents and its available_cents does not move"
      - name: fee_assessed_basis
        when: "Adoption.refund_basis == FEE_ASSESSED"
        difference: "the same cash refund is issued AND a proportional share of sponsorship_applied_cents is returned to the Contribution, raising its available_cents and possibly moving it FULLY_APPLIED -> PARTIALLY_APPLIED"
    note: "Beyond RETURN_WINDOW_PARTIAL_DAYS the return itself is rejected with ERR_RETURN_WINDOW_CLOSED, so RETURN_REFUND_PCT_NONE is only ever reached at the exact boundary handling and is retained for completeness of the tier table."

  - name: live_release_rate
    trigger: "GET /rescue/reports/live-release-rate"
    algorithm: aggregation
    formula: |
      pool = OutcomeRecord rows where reversed_at == null
             AND date(recorded_at) >= from_date AND date(recorded_at) <= to_date
             AND (organization_id filter omitted OR the animal's current_organization_id matches)
      live       = count(pool where outcome_type IN {ADOPTION, FOSTER_TO_ADOPT, TRANSFER_OUT, RETURN_TO_OWNER})
      non_live   = count(pool where outcome_type IN {EUTHANASIA_MEDICAL, EUTHANASIA_BEHAVIORAL,
                                                     EUTHANASIA_OWNER_REQUESTED, DIED_IN_CARE, LOST_IN_CARE})
      owner_req  = count(pool where outcome_type == EUTHANASIA_OWNER_REQUESTED)
      if methodology == SAC:       denominator = live + non_live
      else:  # ASILOMAR            denominator = live + non_live - owner_req
      live_release_rate = null if denominator == 0
                          else round_half_up(live / denominator, LIVE_RELEASE_RATE_PRECISION_DP)
    input_set: "OutcomeRecord rows in the inclusive date window whose reversed_at is null. Reversed outcomes leave both numerator and denominator."
    constants:
      LIVE_RELEASE_RATE_PRECISION_DP: 4
    precision: "4 decimal places, round_half_up; null when the window is empty"
    variants:
      - name: sac_methodology
        when: "methodology == SAC"
        difference: "owner-requested euthanasia stays in the denominator, depressing the rate"
      - name: asilomar_methodology
        when: "methodology == ASILOMAR"
        difference: "owner-requested euthanasia is removed from the denominator entirely, so identical data yields a strictly higher rate whenever owner_req > 0"

  - name: foster_slot_consumption
    trigger: "POST /rescue/foster-placements and POST /rescue/foster-placements/{id}/activate"
    algorithm: threshold
    formula: |
      slot_consumption = FOSTER_SLOT_COST_INDIVIDUAL   if count_basis == INDIVIDUAL
                         FOSTER_SLOT_COST_NURSING_UNIT if count_basis == NURSING_UNIT
      species bucket: DOG animals consume dog slots; CAT and OTHER animals consume cat slots
    input_set: "The FosterPlacement row and its animal's species."
    constants:
      FOSTER_SLOT_COST_INDIVIDUAL: 1
      FOSTER_SLOT_COST_NURSING_UNIT: 2
    precision: "integer slots"
    variants:
      - name: individual_basis
        when: "FosterPlacement.count_basis == INDIVIDUAL"
        difference: "one animal costs one slot"
      - name: nursing_unit_basis
        when: "FosterPlacement.count_basis == NURSING_UNIT"
        difference: "a dam plus her whole litter costs a flat 2 slots however many littermates there are, so slots and heads diverge"

  - name: foster_headcount_consumption
    trigger: "POST /rescue/foster-placements and POST /rescue/foster-placements/{id}/activate"
    algorithm: aggregation
    formula: |
      headcount_consumption = 1                      if count_basis == INDIVIDUAL
                              1 + Litter.member_count if count_basis == NURSING_UNIT
    input_set: "The FosterPlacement row and, for NURSING_UNIT, its Litter.member_count."
    constants: {}
    precision: "integer heads"
    note: "Deliberately not proportional to slot_consumption: a NURSING_UNIT costs 2 slots but 1 + member_count heads, so a home can be slot-open and head-full simultaneously."

  - name: foster_home_capacity_status
    trigger: "Any change to a FosterPlacement's status"
    algorithm: aggregation
    formula: |
      consumed_dog_slots  = sum(slot_consumption over ACTIVE placements in this home whose animal species == DOG)
      consumed_cat_slots  = sum(slot_consumption over ACTIVE placements in this home whose animal species IN {CAT, OTHER})
      consumed_headcount  = sum(headcount_consumption over ACTIVE placements in this home)
      dog_free = dog_slot_capacity - consumed_dog_slots
      cat_free = cat_slot_capacity - consumed_cat_slots
      head_free = max_headcount - consumed_headcount
      capacity_status = OPEN if (dog_free > 0 or cat_free > 0) and head_free > 0 else FULL
    input_set: "FosterPlacement rows with status == ACTIVE only; PROPOSED, ENDED, CANCELLED, TRANSFERRED and CONVERTED_TO_ADOPTION rows are excluded."
    constants: {}
    precision: "integer"

  - name: foster_capacity_conservation
    trigger: "Every FosterPlacement status change"
    algorithm: aggregation
    formula: |
      FosterHome.consumed_dog_slots + FosterHome.consumed_cat_slots
        == sum over FosterPlacement(status == ACTIVE, foster_home_id == home.id) of slot_consumption
    input_set: "ACTIVE FosterPlacement rows for the home."
    constants: {}
    precision: "exact integer identity"

  - name: litter_transport_units
    trigger: "POST /rescue/transport-legs/{id}/manifest-entries"
    algorithm: threshold
    formula: |
      per_animal_units = CRATE_UNITS_SMALL  if size_class == SMALL
                         CRATE_UNITS_MEDIUM if size_class == MEDIUM
                         CRATE_UNITS_LARGE  if size_class == LARGE
      if Animal.litter_id is null or Litter.transport_basis == SPLIT_APPROVED:
          crate_units      = per_animal_units
          is_litter_anchor = false
      else:  # GROUPED
          if no other ManifestEntry for this litter exists on this leg with status IN {ASSIGNED, LOADED, DELIVERED}:
              crate_units = CRATE_UNITS_LITTER_GROUPED ; is_litter_anchor = true
          else:
              crate_units = 0 ; is_litter_anchor = false
    input_set: "The animal being manifested, its Litter, and the leg's existing manifest entries."
    constants:
      CRATE_UNITS_SMALL: 1
      CRATE_UNITS_MEDIUM: 2
      CRATE_UNITS_LARGE: 3
      CRATE_UNITS_LITTER_GROUPED: 2
    precision: "integer crate units"
    variants:
      - name: grouped_litter
        when: "Litter.transport_basis == GROUPED"
        difference: "the whole litter costs a flat 2 crate units on one leg and littermates may not be split across legs"
      - name: split_approved_litter
        when: "Litter.transport_basis == SPLIT_APPROVED"
        difference: "each littermate is billed at its own size_class cost and may ride a different leg; four SMALL littermates cost 4 units instead of 2"

  - name: leg_crate_slot_conservation
    trigger: "Every ManifestEntry create, bump, strand or delivery"
    algorithm: aggregation
    formula: |
      TransportLeg.used_crate_units ==
        sum(crate_units over ManifestEntry where transport_leg_id == leg.id
            and status IN {ASSIGNED, LOADED, DELIVERED})
    input_set: "ManifestEntry rows on the leg; BUMPED and STRANDED rows are excluded."
    constants: {}
    precision: "exact integer identity"

  - name: leg_weight_utilization
    trigger: "POST /rescue/transport-legs/{id}/manifest-entries"
    algorithm: aggregation
    formula: |
      used_weight_lb = sum(Animal.weight_lb over ManifestEntry on this leg
                           with status IN {ASSIGNED, LOADED, DELIVERED})
      accept only if used_weight_lb + candidate.weight_lb <= TransportLeg.weight_capacity_lb
    input_set: "ManifestEntry rows on the leg and their animals' weight_lb."
    constants: {}
    precision: "2 decimal places, round_half_up; the capacity comparison is inclusive"
    note: "Weight is counted per animal even for GROUPED littermates whose crate_units are 0, so the weight axis and the crate axis fail independently."

  - name: leg_species_compatibility
    trigger: "POST /rescue/transport-legs/{id}/manifest-entries"
    algorithm: constraint_propagation
    formula: |
      manifest = existing entries on the leg with status IN {ASSIGNED, LOADED} plus the candidate
      if species_policy == DOGS_ONLY:  every animal.species must be DOG
      if species_policy == CATS_ONLY:  every animal.species must be CAT
      if species_policy == MIXED_SEGREGATED:
          reject if any REACTIVE animal shares the leg with an animal of a different species
      if species_policy == ANY:
          reject if the manifest would contain two or more REACTIVE animals
    input_set: "The leg's manifest and each animal's species and temperament."
    constants: {}
    precision: "boolean predicate"

  - name: cvi_validity_window
    trigger: "POST /rescue/animals/{id}/health-certificates, and re-evaluated at POST /rescue/transport-legs/{id}/depart"
    algorithm: threshold
    formula: |
      window_days = CVI_WINDOW_DAYS_DOG   if Animal.species == DOG
                    CVI_WINDOW_DAYS_CAT   if Animal.species == CAT
                    CVI_WINDOW_DAYS_OTHER if Animal.species == OTHER
      expires_at  = issued_at + window_days * 24h
      valid_at(t) = (t <= expires_at)
    input_set: "The HealthCertificate row and its animal's species. When several certificates exist for one animal and one destination state, the governing one is the row with the greatest issued_at, tie-broken by the greatest created_at."
    constants:
      CVI_WINDOW_DAYS_DOG: 30
      CVI_WINDOW_DAYS_CAT: 15
      CVI_WINDOW_DAYS_OTHER: 10
    precision: "exact instants; the expiry comparison is inclusive at expires_at"
    variants:
      - name: dog_window
        when: "Animal.species == DOG"
        difference: "30-day window"
      - name: cat_or_other_window
        when: "Animal.species == CAT or OTHER"
        difference: "15 or 10 days, so a certificate issued on the same date for a cat expires halfway through a dog's window and can lapse mid-relay while the dog's is still valid"

  - name: rabies_age_eligibility
    trigger: "POST /rescue/transport-legs/{id}/depart when crosses_state_line is true"
    algorithm: threshold
    formula: |
      require Animal.rabies_vaccinated_at is not null
      vaccination_age_weeks = floor(floor((rabies_vaccinated_at - date_of_birth) / 24h) / AGE_DAYS_PER_WEEK)
      require vaccination_age_weeks >= RABIES_MIN_AGE_WEEKS
    input_set: "The animal's date_of_birth and rabies_vaccinated_at."
    constants:
      RABIES_MIN_AGE_WEEKS: 12
      AGE_DAYS_PER_WEEK: 7
    precision: "integer weeks; boundary inclusive at 12"

  - name: driver_interval_conflict
    trigger: "POST /rescue/transport-runs/{id}/transport-legs"
    algorithm: interval_merge
    formula: |
      candidate = [scheduled_depart_at, scheduled_arrive_at)
      for every existing TransportLeg with the same driver_person_id and status IN {SCHEDULED, DEPARTED}:
          occupied = [existing.scheduled_depart_at,
                      existing.scheduled_arrive_at + DRIVER_TURNAROUND_BUFFER_MINUTES minutes)
          reject if candidate overlaps occupied
      overlap test on half-open intervals: a.start < b.end AND b.start < a.end
    input_set: "TransportLeg rows with the same driver whose status is SCHEDULED or DEPARTED; ARRIVED, ABORTED and INVALIDATED legs never conflict."
    constants:
      DRIVER_TURNAROUND_BUFFER_MINUTES: 60
    precision: "minute resolution; half-open intervals, so a candidate starting exactly at occupied.end is accepted"
    note: "Exclusive occupancy with an asymmetric buffer appended to the END of each existing leg only. A candidate ending exactly when an existing leg starts is accepted; a candidate starting exactly 60 minutes after an existing arrival is accepted, at 59 minutes it is rejected."

  - name: home_check_expiry
    trigger: "Any read or write touching a FosterApplication"
    algorithm: threshold
    formula: |
      if home_check_status == PASSED and clock_now > home_check_expires_at:
          home_check_status = LAPSED
      home_check_expires_at = home_check_passed_at + HOME_CHECK_VALID_DAYS * 24h
    input_set: "The FosterApplication row and the logical clock."
    constants:
      HOME_CHECK_VALID_DAYS: 180
    precision: "exact instants; the check is still current at exactly home_check_expires_at (strict > for lapsing)"
    note: "Not monotone: a re-check moves LAPSED back to PASSED and resets the clock. Contrast with hold_status_derivation, which latches."

  - name: medical_cost_funding_allocation
    trigger: "POST /rescue/medical-records/{id}/complete when funding_required is true"
    algorithm: waterfall_allocation
    formula: |
      eligible = Contribution rows where
                   status IN {RECEIVED, PARTIALLY_APPLIED}
               AND available_cents > 0
               AND ( restriction_category == MedicalRecord.expense_category
                     OR restriction_category == UNRESTRICTED )
               AND ( designated_animal_id is null
                     OR designated_animal_id == MedicalRecord.animal_id )
      draw order: created_at ASC, then amount_cents DESC, then donor_reference ASC
      if sum(available_cents over eligible) < cost_cents: reject, draw nothing
      remaining = cost_cents
      for each contribution in draw order while remaining > 0:
          line = min(contribution.available_cents, remaining)
          contribution.applied_cents += line ; remaining -= line
          # ROUNDING ORDER IS PINNED: overhead is rounded PER DRAW LINE and only
          # then summed. Summing first and rounding once produces a different
          # total and is wrong.
          admin_overhead_cents += round_half_up(line * MEDICAL_ADMIN_OVERHEAD_PCT)
      funded_amount_cents = cost_cents
      Organization.unrestricted_balance_cents -= admin_overhead_cents
    input_set: "Contribution rows matching the expense category or UNRESTRICTED, not designated to a different animal."
    constants:
      MEDICAL_ADMIN_OVERHEAD_PCT: 0.08
    precision: "whole cents; round_half_up applied once per draw line, never once on the total"
    note: "Combinatorial mode (b): with three draw lines of 3333, 3333 and 3334 cents the per-line overhead is 267 + 267 + 267 = 801, while rounding the 10000-cent total once gives 800."

  - name: restricted_fund_conservation
    trigger: "Every contribution draw, release or restoration"
    algorithm: aggregation
    formula: |
      for every Contribution: amount_cents == applied_cents + released_cents + available_cents
      Organization.restricted_balance_cents ==
        sum(available_cents over Contribution where restriction_category != UNRESTRICTED
            and status IN {RECEIVED, PARTIALLY_APPLIED})
    input_set: "All Contribution rows for the organization."
    constants: {}
    precision: "exact integer identity"

  - name: organization_balance_derivation
    trigger: "Read on GET /rescue/organizations/{id}, and after every contribution or medical mutation"
    algorithm: aggregation
    formula: |
      unrestricted_balance_cents =
          sum(available_cents over Contribution where restriction_category == UNRESTRICTED
              and status IN {RECEIVED, PARTIALLY_APPLIED})
        + sum(released_cents over every Contribution)
        - sum(admin_overhead_cents over MedicalRecord where status == COMPLETED)
        - sum(cost_cents over MedicalRecord where status == COMPLETED and funding_required == false)
      restricted_balance_cents =
          sum(available_cents over Contribution where restriction_category != UNRESTRICTED
              and status IN {RECEIVED, PARTIALLY_APPLIED})
    input_set: "All Contribution rows and all COMPLETED MedicalRecord rows for the organization."
    constants: {}
    precision: "whole cents; the balance may go negative when unfunded medical cost exceeds cash on hand"

  - name: partner_commitment_slot_conservation
    trigger: "Every commitment draw, release or expire sweep"
    algorithm: aggregation
    formula: |
      PartnerCommitment.slots_total == slots_drawn + slots_released + slots_open
      Organization.open_commitment_slots_total ==
        sum(slots_open over PartnerCommitment where organization_id == org.id
            and status IN {OPEN, PARTIALLY_DRAWN})
    input_set: "PartnerCommitment rows for the organization."
    constants: {}
    precision: "exact integer identity"

  - name: partner_commitment_draw
    trigger: "POST /rescue/transport-runs/{id}/start when purpose == TRANSFER_OUT"
    algorithm: aggregation
    formula: |
      needed = count of distinct animal_id over ManifestEntry rows on this run's legs
               with status IN {ASSIGNED, LOADED}
      require clock_now <= PartnerCommitment.expires_at
      require every such animal's species == PartnerCommitment.species
      require PartnerCommitment.slots_open >= needed
      slots_drawn += needed ; slots_open -= needed
    input_set: "ManifestEntry rows on the run's legs and the linked PartnerCommitment."
    constants:
      PARTNER_COMMITMENT_DEFAULT_TTL_DAYS: 60
    precision: "integer slots; the slots_open comparison is inclusive"

  - name: adoption_match_evaluation
    trigger: "POST /rescue/adoption-applications"
    algorithm: constraint_propagation
    formula: |
      Criteria are evaluated in this PINNED order and the FIRST failure is reported:
        1. children : Person.youngest_child_age_years >= Animal.restriction_no_children_under_years
        2. cats     : Animal.restriction_no_cats == false OR Person.resident_cat_count == 0
        3. dogs     : Animal.restriction_no_dogs == false OR Person.resident_dog_count == 0
        4. fence    : Animal.restriction_requires_fenced_yard == false OR Person.has_fenced_yard == true
        5. housing  : Person.housing_type NOT IN Animal.restriction_housing_types_excluded
      All five must hold; any failure yields ERR_HOUSEHOLD_MISMATCH.
    input_set: "One Animal row and one Person row."
    constants: {}
    precision: "boolean predicate; criterion 1 is inclusive (>=), so a 6-year-old exactly satisfies a no-children-under-6 restriction"

  - name: foster_restriction_evaluation
    trigger: "POST /rescue/foster-placements"
    algorithm: constraint_propagation
    formula: |
      Criteria are evaluated in this PINNED order and the FIRST failure is reported:
        1. cats-in-home : Animal.species != CAT OR FosterHome.accepts_cats == true
        2. children     : FosterHome.min_child_age_years >= Animal.restriction_no_children_under_years
        3. fence        : Animal.restriction_requires_fenced_yard == false OR FosterHome.has_fenced_yard == true
    input_set: "One Animal row and one FosterHome row."
    constants: {}
    precision: "boolean predicate; criterion 2 is inclusive (>=)"

  - name: adoption_application_attempt_count
    trigger: "POST /rescue/adoption-applications/{id}/resubmit"
    algorithm: threshold
    formula: |
      require AdoptionApplication.attempt_count < MAX_ADOPTION_APPLICATION_ATTEMPTS
      attempt_count += 1
    input_set: "The single AdoptionApplication row."
    constants:
      MAX_ADOPTION_APPLICATION_ATTEMPTS: 3
    precision: "integer; the third submission is permitted, the fourth is not"

  - name: animal_length_of_stay
    trigger: "Read on any endpoint returning Animal, and adoption_waiver_selection"
    algorithm: aggregation
    formula: |
      length_of_stay_days = 0 if Animal.current_intake_record_id is null
                            else floor((clock_now - IntakeRecord.intake_datetime) / 24h)
    input_set: "The animal's single OPEN IntakeRecord."
    constants: {}
    precision: "integer days, floor"

  - name: intake_outcome_conservation
    trigger: "Every OutcomeRecord write and every outcome reversal"
    algorithm: aggregation
    formula: |
      count(IntakeRecord where status != VOIDED)
        == count(OutcomeRecord where reversed_at == null)
         + count(Animal where lifecycle_status IN {IN_CUSTODY, IN_TRANSIT, STRANDED})
    input_set: "All IntakeRecord, OutcomeRecord and Animal rows."
    constants: {}
    precision: "exact integer identity"
    note: "A return both reverses an outcome (numerator -1) and creates a new intake episode (+1 on the left), so the identity is preserved across the compensating pair."

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table — ONE global priority ladder, 45 distinct rungs.
# Rungs 12-16 are the ordered write gates declared in `write_gates:` above and
# pre-empt every rung below them within their declared scope.
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the eleven role names declared in the RBAC matrix."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "The acting role appears in the endpoint's roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "When the acting role is entity_backed, X-User-ID resolves to an existing row of the backing entity (Person for Driver, FosterParent and Adopter; Organization for PartnerRescue)."
    error_id: ERR_PERSON_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints reachable by Driver, FosterParent, Adopter or PartnerRescue"

  - priority: 5
    category: auth
    check: "An entity_backed actor may only act on resources it owns: Driver on TransportLeg.driver_person_id, FosterParent on FosterApplication.person_id and FosterHome.person_id, Adopter on AdoptionApplication.applicant_person_id and Adoption.adopter_person_id, PartnerRescue on PartnerCommitment.organization_id."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints reachable by Driver, FosterParent, Adopter or PartnerRescue"

  - priority: 6
    category: business_constraint
    check: "Request body parses as JSON, every required input field for the endpoint is present, and every field has the declared JSON type."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST, PATCH and DELETE endpoints"

  - priority: 7
    category: business_constraint
    check: |
      Every enum-typed input field carries a declared member of its enum. This
      rung routes EXACTLY these fields and no others:
      Organization.org_type, Organization.default_methodology,
      Person.housing_type, Animal.species, Animal.size_class,
      Animal.temperament, each element of Animal.restriction_housing_types_excluded,
      IntakeRecord.intake_type, IntakeRecord.impound_billing_basis,
      HoldRecord.hold_type, FosterApplication.species_requested,
      FosterPlacement.count_basis, MedicalRecord.procedure_type,
      MedicalRecord.expense_category, TransportRun.run_type,
      TransportRun.purpose, TransportLeg.species_policy,
      Adoption.credit_application_order, Adoption.refund_basis,
      Adoption.deposit_basis, OutcomeRecord.outcome_type,
      Contribution.designated_program, Contribution.restriction_category,
      PartnerCommitment.species, the `decision` field on the two decision
      endpoints, the `result` field on the home-check endpoint, the `action`
      field on the foster-application status-change endpoint, the `reason` field
      on the placement-end endpoint, and the `methodology` query parameter on the
      live-release report. No other field routes to ERR_INVALID_ENUM; every other
      malformed value routes to ERR_VALIDATION at priority 6 or 8.
    error_id: ERR_INVALID_ENUM
    http_status: 400
    applies_to: "all endpoints accepting any of the listed fields"

  - priority: 8
    category: business_constraint
    check: "Numeric and format constraints hold: cents and counts are >= 0, amount_cents > 0, weight_lb > 0, crate_capacity_units >= 1, sequence_no >= 1, max_headcount >= 1, slots_total >= 1, state codes are exactly two uppercase letters, email contains '@', datetimes parse as ISO 8601 UTC, and scheduled_arrive_at is strictly after scheduled_depart_at."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST and PATCH endpoints"

  - priority: 9
    category: business_constraint
    check: "Pagination parameters are within bounds: limit between PAGINATION_MIN_LIMIT and PAGINATION_MAX_LIMIT inclusive, offset >= 0."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 10
    category: existence
    check: |
      Every resource named in the path exists, validated left to right. The
      error_id is fixed by this closed entity map and by nothing else:
      Organization -> ERR_ORGANIZATION_NOT_FOUND;
      Person -> ERR_PERSON_NOT_FOUND;
      Animal -> ERR_ANIMAL_NOT_FOUND;
      Litter -> ERR_LITTER_NOT_FOUND;
      IntakeRecord -> ERR_INTAKE_RECORD_NOT_FOUND;
      HoldRecord -> ERR_HOLD_NOT_FOUND;
      FosterHome -> ERR_FOSTER_HOME_NOT_FOUND;
      FosterApplication -> ERR_FOSTER_APPLICATION_NOT_FOUND;
      FosterPlacement -> ERR_FOSTER_PLACEMENT_NOT_FOUND;
      MedicalRecord and HealthCertificate -> ERR_MEDICAL_RESOURCE_NOT_FOUND;
      TransportRun, TransportLeg and ManifestEntry -> ERR_TRANSPORT_RESOURCE_NOT_FOUND;
      AdoptionApplication, Adoption and OutcomeRecord -> ERR_ADOPTION_RESOURCE_NOT_FOUND;
      Contribution and PartnerCommitment -> ERR_FUNDING_RESOURCE_NOT_FOUND.
    error_id: ERR_ANIMAL_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 11
    category: existence
    check: "Every foreign key in the request body resolves to an existing row, validated in the order the fields are listed in the endpoint's input. The error_id comes from the same closed entity map declared at priority 10."
    error_id: ERR_PERSON_NOT_FOUND
    http_status: 404
    applies_to: "all POST and PATCH endpoints carrying foreign keys"

  - priority: 12
    category: state
    check: "GATE 1 — records_freeze_gate: the owning Organization has records_freeze_active == false."
    error_id: ERR_RECORDS_FROZEN
    http_status: 409
    applies_to: "every POST, PATCH and DELETE under /rescue except POST /rescue/organizations/{id}/records-freeze and POST /rescue/_clock/set_current_utc"

  - priority: 13
    category: state
    check: "GATE 2 — outcome_closed_gate: the target Animal has no OutcomeRecord with reversed_at == null."
    error_id: ERR_ANIMAL_OUTCOME_CLOSED
    http_status: 409
    applies_to: "the endpoint list declared in write_gates[gate_order=2].scope"

  - priority: 14
    category: state
    check: "GATE 3 — legal_hold_gate: no ACTIVE HoldRecord with hold_type LEGAL exists on the target Animal."
    error_id: ERR_LEGAL_HOLD_ACTIVE
    http_status: 409
    applies_to: "the endpoint list declared in write_gates[gate_order=3].scope"

  - priority: 15
    category: state
    check: "GATE 4 — medical_hold_gate: no ACTIVE HoldRecord with hold_type MEDICAL exists on the target Animal."
    error_id: ERR_MEDICAL_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /rescue/adoptions and POST /rescue/foster-placements/{id}/transfer only"

  - priority: 16
    category: state
    check: "GATE 5 — behavioral_hold_gate: no ACTIVE HoldRecord with hold_type BEHAVIORAL exists on the target Animal."
    error_id: ERR_BEHAVIORAL_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /rescue/adoptions only"

  - priority: 17
    category: state
    check: "The supplied expected_<parent>_version equals the parent entity's current version."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /rescue/adoptions, POST /rescue/transport-legs/{id}/manifest-entries, POST /rescue/foster-placements"

  - priority: 18
    category: state
    check: "The target entity's own state machine declares a transition from its current state for this trigger. EXCLUDES POST /rescue/animals/{id}/identification, whose hold-axis precondition is checked at priority 21 instead — otherwise that rung would be unreachable."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints except POST /rescue/animals/{id}/identification"

  - priority: 19
    category: state
    check: "Cross-entity parent state: the parent TransportRun.status == IN_PROGRESS before a leg may depart or arrive, and == PLANNED before a leg may be added."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /rescue/transport-runs/{id}/transport-legs, POST /rescue/transport-legs/{id}/depart, POST /rescue/transport-legs/{id}/arrive"

  - priority: 20
    category: state
    check: "Cross-entity application state: the linked FosterApplication has application_status == APPROVED and species_requested equal to the animal's species."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /rescue/foster-placements, POST /rescue/foster-placements/{id}/activate, POST /rescue/foster-placements/{id}/transfer"

  - priority: 21
    category: state
    check: "Monotone hold latch: a stray-hold extension may only be applied while the animal's current IntakeRecord.hold_status is HOLD_ACTIVE. Once HOLD_EXPIRED has been latched the extension is refused and the hold clock is not moved."
    error_id: ERR_HOLD_ALREADY_EXPIRED
    http_status: 409
    applies_to: "POST /rescue/animals/{id}/identification with extend_stray_hold true"

  - priority: 22
    category: auth
    check: "Segregation of duties: the X-User-ID finalizing an adoption differs from the AdoptionApplication.screened_by_user_id that approved it."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /rescue/adoptions"

  - priority: 23
    category: state
    check: "The animal's current IntakeRecord.hold_status is HOLD_EXPIRED. Screening an application during the hold is permitted; only finalization is blocked."
    error_id: ERR_STRAY_HOLD_NOT_EXPIRED
    http_status: 409
    applies_to: "POST /rescue/adoptions"

  - priority: 24
    category: business_safety
    check: "adoption_match_evaluation passes: the applicant's declared household satisfies all five of the animal's placement restrictions, evaluated in the pinned criterion order."
    error_id: ERR_HOUSEHOLD_MISMATCH
    http_status: 422
    applies_to: "POST /rescue/adoption-applications"

  - priority: 25
    category: business_safety
    check: "foster_restriction_evaluation passes: the receiving home satisfies the animal's cats, children and fence restrictions, evaluated in the pinned criterion order."
    error_id: ERR_FOSTER_RESTRICTION_VIOLATION
    http_status: 422
    applies_to: "POST /rescue/foster-placements, POST /rescue/foster-placements/{id}/transfer"

  - priority: 26
    category: business_safety
    check: "leg_species_compatibility passes for the leg's manifest including the candidate animal."
    error_id: ERR_SPECIES_INCOMPATIBLE_LEG
    http_status: 422
    applies_to: "POST /rescue/transport-legs/{id}/manifest-entries"

  - priority: 27
    category: business_safety
    check: "rabies_age_eligibility passes for every manifested animal on an interstate leg."
    error_id: ERR_RABIES_AGE_NOT_MET
    http_status: 422
    applies_to: "POST /rescue/transport-legs/{id}/depart when the leg's crosses_state_line is true"

  - priority: 28
    category: business_safety
    check: "Alteration compliance: the animal is ALTERED, or it is under ALTERATION_MIN_AGE_WEEKS so a deferred deposit may be assessed. An unaltered animal at or over 16 weeks cannot be adopted out."
    error_id: ERR_ALTERATION_REQUIRED
    http_status: 422
    applies_to: "POST /rescue/adoptions"

  - priority: 29
    category: business_referential
    check: "The linked FosterApplication's home_check_status is PASSED and clock_now <= home_check_expires_at. NOT_SCHEDULED, FAILED and LAPSED all fail this rung."
    error_id: ERR_HOME_CHECK_NOT_CURRENT
    http_status: 409
    applies_to: "POST /rescue/foster-placements, POST /rescue/foster-placements/{id}/activate, POST /rescue/foster-placements/{id}/transfer"

  - priority: 30
    category: business_referential
    check: "adoption_application_attempt_count permits another submission: attempt_count < MAX_ADOPTION_APPLICATION_ATTEMPTS."
    error_id: ERR_APPLICATION_ATTEMPT_LIMIT
    http_status: 409
    applies_to: "POST /rescue/adoption-applications/{id}/resubmit"

  - priority: 31
    category: business_referential
    check: "Littermate grouping: when the candidate animal belongs to a Litter whose transport_basis is GROUPED, no littermate may already sit on a different leg of any run with status ASSIGNED or LOADED."
    error_id: ERR_LITTER_SPLIT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /rescue/transport-legs/{id}/manifest-entries"

  - priority: 32
    category: business_referential
    check: "Every distinct manifested animal's species equals the linked PartnerCommitment.species."
    error_id: ERR_PARTNER_SPECIES_MISMATCH
    http_status: 422
    applies_to: "POST /rescue/transport-runs/{id}/start when purpose is TRANSFER_OUT"

  - priority: 33
    category: business_referential
    check: "Every explicitly named funding Contribution has restriction_category equal to the MedicalRecord.expense_category or equal to UNRESTRICTED, and is not designated to a different animal."
    error_id: ERR_RESTRICTED_FUND_CATEGORY_MISMATCH
    http_status: 422
    applies_to: "POST /rescue/medical-records/{id}/complete when funding_contribution_ids is supplied"

  - priority: 34
    category: business_temporal
    check: "On an interstate leg every manifested animal has at least one HealthCertificate whose destination_state equals the leg's destination_state_code. The governing certificate for that animal is the one with the greatest issued_at among those matching the destination_state_code, tie-broken by the greatest created_at."
    error_id: ERR_CVI_REQUIRED
    http_status: 422
    applies_to: "POST /rescue/transport-legs/{id}/depart when crosses_state_line is true"

  - priority: 35
    category: business_temporal
    check: "cvi_validity_window holds at the leg's scheduled_depart_at for the governing certificate of every manifested animal: scheduled_depart_at <= governing_certificate.expires_at. An older, already-expired certificate for the same animal and state does not fail this rung once a newer one governs."
    error_id: ERR_CVI_EXPIRED
    http_status: 409
    applies_to: "POST /rescue/transport-legs/{id}/depart when crosses_state_line is true"

  - priority: 36
    category: business_temporal
    check: "Relay sequencing: every leg of the same run with a lower sequence_no has status ARRIVED before this leg may depart."
    error_id: ERR_LEG_SEQUENCE_VIOLATION
    http_status: 409
    applies_to: "POST /rescue/transport-legs/{id}/depart"

  - priority: 37
    category: business_temporal
    check: "driver_interval_conflict finds no overlap between the candidate leg's half-open interval and any SCHEDULED or DEPARTED leg of the same driver extended by DRIVER_TURNAROUND_BUFFER_MINUTES."
    error_id: ERR_DRIVER_LEG_OVERLAP
    http_status: 409
    applies_to: "POST /rescue/transport-runs/{id}/transport-legs"

  - priority: 38
    category: business_temporal
    check: "The return is inside the outer return window: clock_now <= finalized_at + RETURN_WINDOW_PARTIAL_DAYS * 24h."
    error_id: ERR_RETURN_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /rescue/adoptions/{id}/return"

  - priority: 39
    category: business_temporal
    check: "The linked PartnerCommitment has not expired: clock_now <= expires_at and status != EXPIRED."
    error_id: ERR_PARTNER_COMMITMENT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /rescue/transport-runs/{id}/start when purpose is TRANSFER_OUT"

  - priority: 40
    category: business_constraint
    check: "leg crate capacity: used_crate_units + candidate crate_units <= crate_capacity_units."
    error_id: ERR_LEG_CRATE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /rescue/transport-legs/{id}/manifest-entries"

  - priority: 41
    category: business_constraint
    check: "leg_weight_utilization: used_weight_lb + candidate weight_lb <= weight_capacity_lb."
    error_id: ERR_LEG_WEIGHT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /rescue/transport-legs/{id}/manifest-entries"

  - priority: 42
    category: business_constraint
    check: "Foster species slot capacity: consumed slots in the animal's species bucket plus this placement's slot_consumption <= that bucket's capacity."
    error_id: ERR_FOSTER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /rescue/foster-placements, POST /rescue/foster-placements/{id}/activate, POST /rescue/foster-placements/{id}/transfer"

  - priority: 43
    category: business_constraint
    check: "Foster head count: consumed_headcount plus this placement's headcount_consumption <= max_headcount."
    error_id: ERR_FOSTER_HEADCOUNT_EXCEEDED
    http_status: 409
    applies_to: "POST /rescue/foster-placements, POST /rescue/foster-placements/{id}/activate, POST /rescue/foster-placements/{id}/transfer"

  - priority: 44
    category: business_fiscal
    check: "partner_commitment_draw: PartnerCommitment.slots_open >= the run's distinct manifested animal count."
    error_id: ERR_PARTNER_COMMITMENT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /rescue/transport-runs/{id}/start when purpose is TRANSFER_OUT"

  - priority: 45
    category: business_fiscal
    check: "medical_cost_funding_allocation: the eligible contribution pool covers cost_cents in full."
    error_id: ERR_INSUFFICIENT_RESTRICTED_FUNDS
    http_status: 409
    applies_to: "POST /rescue/medical-records/{id}/complete when funding_required is true"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table — 84 endpoints.
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: "/rescue/organizations"
    description: "Register a shelter or partner rescue."
    roles: [PlatformAdmin]
    code: 201
    input: [name, org_type, state_code, "default_methodology?"]
    output: Organization
    side_effects: ["initialises freeze_status UNFROZEN and all balances to 0"]

  - method: GET
    path: "/rescue/organizations/{id}"
    description: "Read one organization including its freeze posture and fund balances."
    roles: [PlatformAdmin, FinanceOfficer, TransportDispatcher, PartnerRescue]
    code: 200
    input: []
    output: Organization
    side_effects: []

  - method: POST
    path: "/rescue/organizations/{id}/records-freeze"
    description: "Raise or lift the records freeze that gates every write on this organization's resources."
    roles: [PlatformAdmin]
    code: 200
    input: [freeze_active, "reason?"]
    output: Organization
    side_effects: ["moves freeze_status UNFROZEN <-> FROZEN", "increments Organization.version by 1"]

  - method: POST
    path: "/rescue/persons"
    description: "Create a person: owner, adopter, foster parent, driver or donor."
    roles: [PlatformAdmin, IntakeOfficer, FosterCoordinator, AdoptionCounselor]
    code: 201
    input: [full_name, email, "youngest_child_age_years?", "resident_cat_count?", "resident_dog_count?", "housing_type?", "has_fenced_yard?", "hardship_certified?", "driver_license_number?"]
    output: Person
    side_effects: ["initialises reclaim_history_count to 0"]

  - method: GET
    path: "/rescue/persons/{id}"
    description: "Read one person including the derived reclaim_history_count."
    roles: [PlatformAdmin, IntakeOfficer, FosterCoordinator, AdoptionCounselor, FinanceOfficer, TransportDispatcher]
    code: 200
    input: []
    output: Person
    side_effects: []

  - method: POST
    path: "/rescue/animals"
    description: "Register an animal before intake. The animal starts in lifecycle_status PRE_INTAKE."
    roles: [PlatformAdmin, IntakeOfficer]
    code: 201
    input: [name, species, size_class, weight_lb, date_of_birth, current_organization_id, "temperament?", "microchip_id?", "litter_id?", "restriction_no_children_under_years?", "restriction_no_cats?", "restriction_no_dogs?", "restriction_requires_fenced_yard?", "restriction_housing_types_excluded?"]
    output: Animal
    side_effects: ["sets identifiable from microchip_id", "raises Litter.member_count when litter_id is supplied"]

  - method: GET
    path: "/rescue/animals/{id}"
    description: "Read one animal with derived age_weeks, age_months and length_of_stay_days."
    roles: [PlatformAdmin, IntakeOfficer, FosterCoordinator, AdoptionCounselor, TransportDispatcher, Veterinarian, FinanceOfficer, Driver, FosterParent, Adopter, PartnerRescue]
    code: 200
    input: []
    output: Animal
    side_effects: ["latches IntakeRecord.hold_status to HOLD_EXPIRED when the clock has passed hold_expires_at"]

  - method: GET
    path: "/rescue/animals"
    description: "List animals with filters."
    roles: [PlatformAdmin, IntakeOfficer, FosterCoordinator, AdoptionCounselor, TransportDispatcher, Veterinarian]
    code: 200
    input: ["species?", "lifecycle_status?", "litter_id?", "current_organization_id?", "current_foster_home_id?", "current_intake_record_id?", "limit?", "offset?"]
    output: Animal[]
    side_effects: []

  - method: PATCH
    path: "/rescue/animals/{id}/restrictions"
    description: "Update the animal's placement restrictions after a behaviour evaluation."
    roles: [PlatformAdmin, IntakeOfficer, AdoptionCounselor]
    code: 200
    input: ["restriction_no_children_under_years?", "restriction_no_cats?", "restriction_no_dogs?", "restriction_requires_fenced_yard?", "restriction_housing_types_excluded?"]
    output: Animal
    side_effects: ["increments Animal.version by 1"]

  - method: POST
    path: "/rescue/animals/{id}/identification"
    description: "Record a microchip or tag. With extend_stray_hold true the stray hold is recomputed to the identifiable length, but only while the hold is still HOLD_ACTIVE."
    roles: [PlatformAdmin, IntakeOfficer]
    code: 200
    input: [microchip_id, extend_stray_hold]
    output: Animal
    side_effects:
      - "sets microchip_id and identifiable true"
      - "when extend_stray_hold is true and the current IntakeRecord is STRAY and HOLD_ACTIVE, recomputes hold_days and hold_expires_at"
      - "increments Animal.version by 1"

  - method: GET
    path: "/rescue/animals/{id}/eligibility"
    description: "Computed read: the five ordered write gates evaluated against this animal, plus the stray hold posture."
    roles: [PlatformAdmin, IntakeOfficer, FosterCoordinator, AdoptionCounselor, TransportDispatcher]
    code: 200
    input: []
    output: { animal_id: string, lifecycle_status: string, stray_hold_status: string, stray_hold_expires_at: string, records_freeze_active: boolean, outcome_closed: boolean, legal_hold_active: boolean, medical_hold_active: boolean, behavioral_hold_active: boolean, adoption_blocked_by: string, transport_blocked_by: string, foster_transfer_blocked_by: string }
    side_effects: []

  - method: POST
    path: "/rescue/litters"
    description: "Create a litter grouping."
    roles: [PlatformAdmin, IntakeOfficer]
    code: 201
    input: [label, "dam_animal_id?"]
    output: Litter
    side_effects: ["initialises transport_basis GROUPED and member_count 0"]

  - method: GET
    path: "/rescue/litters/{id}"
    description: "Read one litter."
    roles: [PlatformAdmin, IntakeOfficer, TransportDispatcher, FosterCoordinator]
    code: 200
    input: []
    output: Litter
    side_effects: []

  - method: GET
    path: "/rescue/litters"
    description: "List litters, optionally by dam."
    roles: [PlatformAdmin, IntakeOfficer, TransportDispatcher, FosterCoordinator]
    code: 200
    input: ["dam_animal_id?", "transport_basis?", "limit?", "offset?"]
    output: Litter[]
    side_effects: []

  - method: POST
    path: "/rescue/litters/{id}/split-approval"
    description: "Approve splitting the litter across transport legs; switches transport_basis to SPLIT_APPROVED."
    roles: [PlatformAdmin, TransportDispatcher]
    code: 200
    input: [approved_reason]
    output: Litter
    side_effects: ["sets transport_basis SPLIT_APPROVED and split_approved_at", "increments Litter.version by 1"]

  - method: POST
    path: "/rescue/animals/{id}/intake-records"
    description: "Take the animal into custody and open a custody episode."
    roles: [PlatformAdmin, IntakeOfficer]
    code: 201
    input: [intake_type, intake_datetime, "source_person_id?", "impound_billing_basis?"]
    output: IntakeRecord
    side_effects:
      - "runs stray_hold_expiry to set hold_days and hold_expires_at"
      - "moves Animal PRE_INTAKE -> IN_CUSTODY and sets Animal.current_intake_record_id"
      - "increments Animal.version by 1"

  - method: GET
    path: "/rescue/intake-records/{id}"
    description: "Read one custody episode including the derived hold posture and any reclaim charges."
    roles: [PlatformAdmin, IntakeOfficer, AdoptionCounselor, FinanceOfficer]
    code: 200
    input: []
    output: IntakeRecord
    side_effects: ["latches hold_status to HOLD_EXPIRED when the clock has passed hold_expires_at"]

  - method: GET
    path: "/rescue/intake-records"
    description: "List custody episodes with filters."
    roles: [PlatformAdmin, IntakeOfficer, AdoptionCounselor, FinanceOfficer]
    code: 200
    input: ["animal_id?", "source_person_id?", "intake_type?", "status?", "hold_status?", "limit?", "offset?"]
    output: IntakeRecord[]
    side_effects: []

  - method: POST
    path: "/rescue/intake-records/{id}/reclaim"
    description: "Return a stray to its original owner, charging the tiered impound fee with the repeat-offense multiplier and the hardship waiver."
    roles: [PlatformAdmin, IntakeOfficer]
    code: 201
    input: [reclaiming_person_id]
    output: OutcomeRecord
    side_effects:
      - "runs impound_billable_days, impound_tiered_subtotal, repeat_offense_multiplier_selection and reclaim_total_with_hardship_waiver, writing all five fee fields onto the IntakeRecord"
      - "creates the OutcomeRecord with outcome_type RETURN_TO_OWNER and counterparty_person_id"
      - "closes the IntakeRecord and moves the Animal IN_CUSTODY -> OUTCOME_CLOSED"
      - "raises the reclaiming Person.reclaim_history_count by 1"
      - "increments Animal.version by 1"

  - method: POST
    path: "/rescue/animals/{id}/holds"
    description: "Impose a medical, behavioural or legal hold on the animal."
    roles: [PlatformAdmin, IntakeOfficer, Veterinarian]
    code: 201
    input: [hold_type, reason]
    output: HoldRecord
    side_effects: ["activates the corresponding write gate for this animal"]

  - method: GET
    path: "/rescue/holds/{id}"
    description: "Read one hold."
    roles: [PlatformAdmin, IntakeOfficer, Veterinarian, AdoptionCounselor, TransportDispatcher]
    code: 200
    input: []
    output: HoldRecord
    side_effects: []

  - method: GET
    path: "/rescue/holds"
    description: "List holds with filters."
    roles: [PlatformAdmin, IntakeOfficer, Veterinarian, AdoptionCounselor, TransportDispatcher]
    code: 200
    input: ["animal_id?", "hold_type?", "status?", "limit?", "offset?"]
    output: HoldRecord[]
    side_effects: []

  - method: POST
    path: "/rescue/holds/{id}/release"
    description: "Release an active hold."
    roles: [PlatformAdmin, IntakeOfficer, Veterinarian]
    code: 200
    input: []
    output: HoldRecord
    side_effects: ["sets released_at and released_by_user_id", "deactivates the corresponding write gate", "increments HoldRecord.version by 1"]

  - method: POST
    path: "/rescue/foster-homes"
    description: "Register a foster home with its species slot capacities and home-check derived restrictions."
    roles: [PlatformAdmin, FosterCoordinator]
    code: 201
    input: [person_id, label, max_headcount, "dog_slot_capacity?", "cat_slot_capacity?", "accepts_cats?", "min_child_age_years?", "has_fenced_yard?"]
    output: FosterHome
    side_effects: ["initialises capacity_status OPEN and all consumption counters to 0"]

  - method: GET
    path: "/rescue/foster-homes/{id}"
    description: "Read one foster home including live consumption counters."
    roles: [PlatformAdmin, FosterCoordinator, FosterParent]
    code: 200
    input: []
    output: FosterHome
    side_effects: []

  - method: GET
    path: "/rescue/foster-homes"
    description: "List foster homes with filters."
    roles: [PlatformAdmin, FosterCoordinator]
    code: 200
    input: ["person_id?", "capacity_status?", "limit?", "offset?"]
    output: FosterHome[]
    side_effects: []

  - method: POST
    path: "/rescue/foster-applications"
    description: "Submit a foster application. The application axis and the home-check axis start independently at SUBMITTED and NOT_SCHEDULED."
    roles: [PlatformAdmin, FosterCoordinator, FosterParent]
    code: 201
    input: [person_id, foster_home_id, species_requested]
    output: FosterApplication
    side_effects: []

  - method: GET
    path: "/rescue/foster-applications/{id}"
    description: "Read one foster application with both parallel status axes."
    roles: [PlatformAdmin, FosterCoordinator, FosterParent]
    code: 200
    input: []
    output: FosterApplication
    side_effects: ["lapses home_check_status from PASSED to LAPSED when the clock has passed home_check_expires_at"]

  - method: GET
    path: "/rescue/foster-applications"
    description: "List foster applications, filterable on either axis independently."
    roles: [PlatformAdmin, FosterCoordinator]
    code: 200
    input: ["person_id?", "foster_home_id?", "application_status?", "home_check_status?", "limit?", "offset?"]
    output: FosterApplication[]
    side_effects: []

  - method: POST
    path: "/rescue/foster-applications/{id}/decision"
    description: "Approve or decline the application. Touches only the application axis."
    roles: [PlatformAdmin, FosterCoordinator]
    code: 200
    input: [decision]
    output: FosterApplication
    side_effects: ["sets decided_by_user_id", "increments FosterApplication.version by 1"]

  - method: POST
    path: "/rescue/foster-applications/{id}/home-check"
    description: "Record a home-check result. Touches only the home-check axis and resets its 180-day clock on a pass."
    roles: [PlatformAdmin, FosterCoordinator]
    code: 200
    input: [result, checked_at]
    output: FosterApplication
    side_effects: ["sets home_check_passed_at and home_check_expires_at on a pass", "increments FosterApplication.version by 1"]

  - method: POST
    path: "/rescue/foster-applications/{id}/status-change"
    description: "Suspend, resume or withdraw an approved application."
    roles: [PlatformAdmin, FosterCoordinator, FosterParent]
    code: 200
    input: [action]
    output: FosterApplication
    side_effects: ["moves application_status along the SUSPEND / RESUME cycle or to WITHDRAWN", "increments FosterApplication.version by 1"]

  - method: POST
    path: "/rescue/foster-placements"
    description: "Propose a foster placement. Carries the OCC guard on the receiving home's version."
    roles: [PlatformAdmin, FosterCoordinator]
    code: 201
    input: [animal_id, foster_home_id, foster_application_id, expected_foster_home_version, "count_basis?", "litter_id?"]
    output: FosterPlacement
    side_effects:
      - "computes slot_consumption and headcount_consumption"
      - "increments FosterHome.version by 1"

  - method: GET
    path: "/rescue/foster-placements/{id}"
    description: "Read one placement."
    roles: [PlatformAdmin, FosterCoordinator, FosterParent]
    code: 200
    input: []
    output: FosterPlacement
    side_effects: []

  - method: GET
    path: "/rescue/foster-placements"
    description: "List placements with filters."
    roles: [PlatformAdmin, FosterCoordinator, FosterParent]
    code: 200
    input: ["animal_id?", "foster_home_id?", "foster_application_id?", "litter_id?", "predecessor_placement_id?", "status?", "limit?", "offset?"]
    output: FosterPlacement[]
    side_effects: []

  - method: POST
    path: "/rescue/foster-placements/{id}/activate"
    description: "Activate a proposed placement, consuming the home's slots and heads."
    roles: [PlatformAdmin, FosterCoordinator]
    code: 200
    input: []
    output: FosterPlacement
    side_effects:
      - "sets started_at and Animal.current_foster_home_id"
      - "recomputes the home's consumed slots, consumed headcount and capacity_status"
      - "increments FosterPlacement.version by 1 and FosterHome.version by 1"

  - method: POST
    path: "/rescue/foster-placements/{id}/end"
    description: "End or cancel a placement. The client-supplied reason accepts only RETURNED_TO_SHELTER and CANCELLED_BEFORE_START; TRANSFERRED_OUT, ADOPTED and ANIMAL_OUTCOME_CLOSED are written by the system on the transfer, foster-to-adopt and outcome paths and are rejected here with ERR_INVALID_ENUM."
    roles: [PlatformAdmin, FosterCoordinator]
    code: 200
    input: [reason]
    output: FosterPlacement
    side_effects:
      - "sets ended_at and end_reason, clears Animal.current_foster_home_id"
      - "recomputes the home's counters and capacity_status"
      - "increments FosterPlacement.version by 1"

  - method: POST
    path: "/rescue/foster-placements/{id}/transfer"
    description: "Foster-to-foster transfer. Blocked by an ACTIVE MEDICAL hold, which never blocks reclaim."
    roles: [PlatformAdmin, FosterCoordinator]
    code: 201
    input: [destination_foster_home_id, destination_foster_application_id]
    output: FosterPlacement
    side_effects:
      - "moves this placement ACTIVE -> TRANSFERRED and creates the successor placement in ACTIVE with predecessor_placement_id set"
      - "recomputes both homes' counters and capacity_status"
      - "increments FosterPlacement.version by 1"

  - method: POST
    path: "/rescue/animals/{id}/medical-records"
    description: "Order a veterinary procedure."
    roles: [PlatformAdmin, Veterinarian]
    code: 201
    input: [procedure_type, expense_category, cost_cents, scheduled_at, "funding_required?"]
    output: MedicalRecord
    side_effects: []

  - method: GET
    path: "/rescue/medical-records/{id}"
    description: "Read one medical record including its funding draw trail."
    roles: [PlatformAdmin, Veterinarian, FinanceOfficer]
    code: 200
    input: []
    output: MedicalRecord
    side_effects: []

  - method: GET
    path: "/rescue/medical-records"
    description: "List medical records with filters."
    roles: [PlatformAdmin, Veterinarian, FinanceOfficer]
    code: 200
    input: ["animal_id?", "procedure_type?", "status?", "limit?", "offset?"]
    output: MedicalRecord[]
    side_effects: []

  - method: POST
    path: "/rescue/medical-records/{id}/complete"
    description: "Complete the procedure. When funding_required is true this draws contributions in the pinned order and charges per-line admin overhead."
    roles: [PlatformAdmin, Veterinarian]
    code: 200
    input: ["funding_contribution_ids?"]
    output: MedicalRecord
    side_effects:
      - "sets completed_at, and Animal.alteration_status or Animal.rabies_vaccinated_at by procedure_type"
      - "runs medical_cost_funding_allocation when funding_required is true, raising Contribution.applied_cents and lowering Organization.unrestricted_balance_cents by admin_overhead_cents"
      - "increments MedicalRecord.version by 1 and Animal.version by 1"

  - method: POST
    path: "/rescue/animals/{id}/health-certificates"
    description: "Issue a certificate of veterinary inspection with a species-specific validity window."
    roles: [PlatformAdmin, Veterinarian]
    code: 201
    input: [issued_at, destination_state, vet_license_number]
    output: HealthCertificate
    side_effects: ["runs cvi_validity_window to set window_days and expires_at"]

  - method: GET
    path: "/rescue/health-certificates/{id}"
    description: "Read one certificate."
    roles: [PlatformAdmin, Veterinarian, TransportDispatcher, Driver]
    code: 200
    input: []
    output: HealthCertificate
    side_effects: []

  - method: GET
    path: "/rescue/health-certificates"
    description: "List certificates with filters."
    roles: [PlatformAdmin, Veterinarian, TransportDispatcher, Driver]
    code: 200
    input: ["animal_id?", "status?", "destination_state?", "limit?", "offset?"]
    output: HealthCertificate[]
    side_effects: []

  - method: POST
    path: "/rescue/transport-runs"
    description: "Plan a rescue leg or a multi-leg relay."
    roles: [PlatformAdmin, TransportDispatcher]
    code: 201
    input: [origin_organization_id, run_type, origin_hub_code, destination_hub_code, "purpose?", "partner_commitment_id?"]
    output: TransportRun
    side_effects: []

  - method: GET
    path: "/rescue/transport-runs/{id}"
    description: "Read one run."
    roles: [PlatformAdmin, TransportDispatcher, Driver, PartnerRescue]
    code: 200
    input: []
    output: TransportRun
    side_effects: []

  - method: GET
    path: "/rescue/transport-runs"
    description: "List runs with filters."
    roles: [PlatformAdmin, TransportDispatcher, PartnerRescue]
    code: 200
    input: ["origin_organization_id?", "partner_commitment_id?", "run_type?", "purpose?", "status?", "limit?", "offset?"]
    output: TransportRun[]
    side_effects: []

  - method: POST
    path: "/rescue/transport-runs/{id}/start"
    description: "Start the run. A TRANSFER_OUT run draws the partner's commitment slots here."
    roles: [PlatformAdmin, TransportDispatcher]
    code: 200
    input: []
    output: TransportRun
    side_effects:
      - "runs partner_commitment_draw when purpose is TRANSFER_OUT, raising PartnerCommitment.slots_drawn and lowering slots_open"
      - "recomputes Organization.open_commitment_slots_total"
      - "increments TransportRun.version by 1"

  - method: POST
    path: "/rescue/transport-runs/{id}/abort"
    description: "Abort or cancel the run, invalidating its remaining legs and returning any drawn partner slots."
    roles: [PlatformAdmin, TransportDispatcher]
    code: 200
    input: ["reason?"]
    output: TransportRun
    side_effects:
      - "moves every SCHEDULED leg to INVALIDATED and every ASSIGNED entry to BUMPED"
      - "returns slots_drawn to the PartnerCommitment and recomputes Organization.open_commitment_slots_total"
      - "increments TransportRun.version by 1"

  - method: POST
    path: "/rescue/transport-runs/{id}/transport-legs"
    description: "Add a leg to a planned run, checked against the driver's interval occupancy."
    roles: [PlatformAdmin, TransportDispatcher]
    code: 201
    input: [driver_person_id, sequence_no, origin_hub_code, destination_hub_code, scheduled_depart_at, scheduled_arrive_at, crate_capacity_units, weight_capacity_lb, "crosses_state_line?", "destination_state_code?", "species_policy?"]
    output: TransportLeg
    side_effects: ["runs driver_interval_conflict against the driver's existing legs", "increments TransportRun.version by 1"]

  - method: GET
    path: "/rescue/transport-legs/{id}"
    description: "Read one leg including live crate and weight utilisation."
    roles: [PlatformAdmin, TransportDispatcher, Driver]
    code: 200
    input: []
    output: TransportLeg
    side_effects: []

  - method: GET
    path: "/rescue/transport-legs"
    description: "List legs with filters."
    roles: [PlatformAdmin, TransportDispatcher, Driver]
    code: 200
    input: ["transport_run_id?", "driver_person_id?", "status?", "limit?", "offset?"]
    output: TransportLeg[]
    side_effects: []

  - method: POST
    path: "/rescue/transport-legs/{id}/depart"
    description: "Depart the leg. Enforces relay sequencing, CVI validity and the legal-hold gate per manifested animal."
    roles: [PlatformAdmin, TransportDispatcher, Driver]
    code: 200
    input: []
    output: TransportLeg
    side_effects:
      - "moves ASSIGNED entries to LOADED and each carried animal to IN_TRANSIT"
      - "increments TransportLeg.version by 1 and each Animal.version by 1"

  - method: POST
    path: "/rescue/transport-legs/{id}/arrive"
    description: "Arrive the leg, releasing the handoff gate for the next leg."
    roles: [PlatformAdmin, TransportDispatcher, Driver]
    code: 200
    input: []
    output: TransportLeg
    side_effects:
      - "on the final leg moves LOADED entries to DELIVERED, returns animals to IN_CUSTODY and completes the run"
      - "increments TransportLeg.version by 1"

  - method: POST
    path: "/rescue/transport-legs/{id}/abort"
    description: "Abort a leg. Before departure this bumps; after departure it strands and cascades through five further entities."
    roles: [PlatformAdmin, TransportDispatcher]
    code: 200
    input: ["reason?"]
    output: TransportLeg
    side_effects:
      - "hop 2: LOADED entries become STRANDED"
      - "hop 3: each stranded entry moves its Animal to STRANDED"
      - "hop 4: the stranding aborts the parent TransportRun"
      - "hop 5: the run abort returns partner commitment slots"
      - "hop 6: the commitment change recomputes Organization.open_commitment_slots_total"
      - "increments TransportLeg.version by 1"

  - method: POST
    path: "/rescue/transport-legs/{id}/manifest-entries"
    description: "Manifest an animal onto a leg. Carries the OCC guard on the leg's version and enforces crate, weight, species and litter rules."
    roles: [PlatformAdmin, TransportDispatcher]
    code: 201
    input: [animal_id, expected_leg_version]
    output: ManifestEntry
    side_effects:
      - "runs litter_transport_units to set crate_units and is_litter_anchor"
      - "raises TransportLeg.used_crate_units and used_weight_lb"
      - "increments TransportLeg.version by 1"

  - method: GET
    path: "/rescue/manifest-entries/{id}"
    description: "Read one manifest entry."
    roles: [PlatformAdmin, TransportDispatcher, Driver]
    code: 200
    input: []
    output: ManifestEntry
    side_effects: []

  - method: GET
    path: "/rescue/manifest-entries"
    description: "List manifest entries with filters."
    roles: [PlatformAdmin, TransportDispatcher, Driver]
    code: 200
    input: ["transport_leg_id?", "animal_id?", "status?", "limit?", "offset?"]
    output: ManifestEntry[]
    side_effects: []

  - method: DELETE
    path: "/rescue/manifest-entries/{id}"
    description: "Bump an assigned animal off a leg, releasing its crate and weight."
    roles: [PlatformAdmin, TransportDispatcher]
    code: 200
    input: []
    output: ManifestEntry
    side_effects: ["moves the entry ASSIGNED -> BUMPED", "lowers TransportLeg.used_crate_units and used_weight_lb", "increments TransportLeg.version by 1"]

  - method: POST
    path: "/rescue/adoption-applications"
    description: "Submit an adoption application. The applicant's declared household is matched against the animal's placement restrictions at submission."
    roles: [PlatformAdmin, AdoptionCounselor, Adopter]
    code: 201
    input: [animal_id, applicant_person_id]
    output: AdoptionApplication
    side_effects: ["runs adoption_match_evaluation", "initialises attempt_count to 1"]

  - method: GET
    path: "/rescue/adoption-applications/{id}"
    description: "Read one adoption application."
    roles: [PlatformAdmin, AdoptionCounselor, Adopter]
    code: 200
    input: []
    output: AdoptionApplication
    side_effects: []

  - method: GET
    path: "/rescue/adoption-applications"
    description: "List adoption applications with filters."
    roles: [PlatformAdmin, AdoptionCounselor]
    code: 200
    input: ["animal_id?", "applicant_person_id?", "status?", "limit?", "offset?"]
    output: AdoptionApplication[]
    side_effects: []

  - method: POST
    path: "/rescue/adoption-applications/{id}/screen"
    description: "Screen the application. Permitted while the animal's stray hold is still active; records the screening actor for the segregation-of-duties check."
    roles: [PlatformAdmin, AdoptionCounselor]
    code: 200
    input: [decision]
    output: AdoptionApplication
    side_effects: ["sets screened_by_user_id and screened_at", "increments AdoptionApplication.version by 1"]

  - method: POST
    path: "/rescue/adoption-applications/{id}/resubmit"
    description: "Resubmit a declined application, capped at MAX_ADOPTION_APPLICATION_ATTEMPTS submissions."
    roles: [PlatformAdmin, Adopter]
    code: 200
    input: []
    output: AdoptionApplication
    side_effects: ["increments attempt_count", "clears screened_by_user_id and screened_at", "increments AdoptionApplication.version by 1"]

  - method: POST
    path: "/rescue/adoptions"
    description: "Finalize an approved application. Runs the fee waterfall, assesses any deferred-alteration deposit, writes the outcome and auto-declines the sibling applications. Carries the OCC guard on the animal's version."
    roles: [PlatformAdmin, AdoptionCounselor]
    code: 201
    input: [adoption_application_id, expected_animal_version, "credit_application_order?", "refund_basis?", "deposit_basis?"]
    output: Adoption
    side_effects:
      - "runs adoption_base_fee, adoption_waiver_selection, adoption_sponsorship_pool, adoption_fee_waterfall and alteration_deposit_amount"
      - "raises Contribution.applied_cents for each drawn sponsorship line"
      - "hop 2: creates the OutcomeRecord (ADOPTION, or FOSTER_TO_ADOPT when the adopter fosters the animal) and closes the IntakeRecord"
      - "hop 3: releases every designated Contribution with residual available_cents"
      - "hop 4: raises Organization.unrestricted_balance_cents by the released amount"
      - "moves sibling applications to AUTO_DECLINED"
      - "increments Animal.version by 1"

  - method: GET
    path: "/rescue/adoptions/{id}"
    description: "Read one adoption with the full fee breakdown on both parallel axes."
    roles: [PlatformAdmin, AdoptionCounselor, FinanceOfficer, Adopter]
    code: 200
    input: []
    output: Adoption
    side_effects: []

  - method: GET
    path: "/rescue/adoptions"
    description: "List adoptions with filters."
    roles: [PlatformAdmin, AdoptionCounselor, FinanceOfficer]
    code: 200
    input: ["adoption_application_id?", "animal_id?", "adopter_person_id?", "status?", "fee_status?", "limit?", "offset?"]
    output: Adoption[]
    side_effects: []

  - method: POST
    path: "/rescue/adoptions/{id}/payment"
    description: "Record an adopter payment against the charge plus any deferred-alteration deposit."
    roles: [PlatformAdmin, FinanceOfficer, Adopter]
    code: 200
    input: [amount_cents]
    output: Adoption
    side_effects: ["raises adopter_paid_cents and advances fee_status on the parallel money axis", "increments Adoption.version by 1"]

  - method: POST
    path: "/rescue/adoptions/{id}/return"
    description: "Adopter returns the animal. Reverses the live-release outcome and re-enters the animal under a RETURN intake."
    roles: [PlatformAdmin, AdoptionCounselor]
    code: 200
    input: ["reason?"]
    output: Adoption
    side_effects:
      - "hop 1: runs return_refund_amount, setting refund_issued_cents and credit_restored_cents and advancing fee_status"
      - "hop 2: reverses the standing OutcomeRecord"
      - "hop 3: the reversal voids the superseded IntakeRecord and creates a new IntakeRecord with intake_type RETURN"
      - "hop 4: the new episode moves the Animal OUTCOME_CLOSED -> IN_CUSTODY"
      - "increments Adoption.version by 1 and Animal.version by 1"

  - method: POST
    path: "/rescue/adoptions/{id}/alteration-proof"
    description: "Redeem the refundable deferred-alteration deposit on proof of surgery."
    roles: [PlatformAdmin, Veterinarian, AdoptionCounselor]
    code: 200
    input: [proof_reference]
    output: Adoption
    side_effects: ["sets alteration_deposit_refunded_cents and moves Animal.alteration_status DEFERRED_DEPOSIT -> ALTERED", "increments Adoption.version by 1 and Animal.version by 1"]

  - method: POST
    path: "/rescue/animals/{id}/outcomes"
    description: "Record a live or non-live outcome directly, closing the custody episode."
    roles: [PlatformAdmin, IntakeOfficer]
    code: 201
    input: [outcome_type, "partner_commitment_id?", "counterparty_person_id?"]
    output: OutcomeRecord
    side_effects:
      - "closes the IntakeRecord and moves the Animal to OUTCOME_CLOSED"
      - "ends any ACTIVE FosterPlacement and recomputes the home's counters"
      - "releases every designated Contribution with residual available_cents, raising Organization.unrestricted_balance_cents"
      - "increments Animal.version by 1"

  - method: GET
    path: "/rescue/outcomes/{id}"
    description: "Read one outcome record."
    roles: [PlatformAdmin, IntakeOfficer, AdoptionCounselor, FinanceOfficer]
    code: 200
    input: []
    output: OutcomeRecord
    side_effects: []

  - method: GET
    path: "/rescue/outcomes"
    description: "List outcome records with filters."
    roles: [PlatformAdmin, IntakeOfficer, AdoptionCounselor, FinanceOfficer]
    code: 200
    input: ["animal_id?", "intake_record_id?", "adoption_id?", "partner_commitment_id?", "counterparty_person_id?", "outcome_type?", "limit?", "offset?"]
    output: OutcomeRecord[]
    side_effects: []

  - method: GET
    path: "/rescue/reports/live-release-rate"
    description: "Computed read: the live-release rate over an inclusive date window under the selected methodology."
    roles: [PlatformAdmin, IntakeOfficer, FinanceOfficer]
    code: 200
    input: [from_date, to_date, "methodology?", "organization_id?"]
    output: { methodology: string, from_date: string, to_date: string, live_outcome_count: integer, non_live_outcome_count: integer, owner_requested_euthanasia_count: integer, denominator: integer, live_release_rate: number }
    side_effects: []

  - method: POST
    path: "/rescue/contributions"
    description: "Record a donation or an animal-designated sponsorship."
    roles: [PlatformAdmin, FinanceOfficer]
    code: 201
    input: [donor_person_id, amount_cents, donor_reference, "designated_animal_id?", "designated_program?", "restriction_category?"]
    output: Contribution
    side_effects: ["sets available_cents to amount_cents", "raises Organization.unrestricted_balance_cents when restriction_category is UNRESTRICTED, otherwise restricted_balance_cents"]

  - method: GET
    path: "/rescue/contributions/{id}"
    description: "Read one contribution with its applied, released and available split."
    roles: [PlatformAdmin, FinanceOfficer]
    code: 200
    input: []
    output: Contribution
    side_effects: []

  - method: GET
    path: "/rescue/contributions"
    description: "List contributions with filters."
    roles: [PlatformAdmin, FinanceOfficer]
    code: 200
    input: ["donor_person_id?", "designated_animal_id?", "designated_program?", "restriction_category?", "status?", "limit?", "offset?"]
    output: Contribution[]
    side_effects: []

  - method: POST
    path: "/rescue/contributions/{id}/redesignate"
    description: "Redesignate an unapplied gift to a different animal, program or restriction category."
    roles: [PlatformAdmin, FinanceOfficer]
    code: 200
    input: ["designated_animal_id?", "designated_program?", "restriction_category?"]
    output: Contribution
    side_effects: ["increments redesignation_count", "recomputes Organization.restricted_balance_cents", "increments Contribution.version by 1"]

  - method: POST
    path: "/rescue/partner-commitments"
    description: "Register a partner rescue's open transfer commitment for a species."
    roles: [PlatformAdmin, TransportDispatcher]
    code: 201
    input: [organization_id, species, slots_total, expires_at]
    output: PartnerCommitment
    side_effects: ["sets slots_open to slots_total", "raises Organization.open_commitment_slots_total"]

  - method: GET
    path: "/rescue/partner-commitments/{id}"
    description: "Read one commitment with its slot ledger."
    roles: [PlatformAdmin, TransportDispatcher, PartnerRescue]
    code: 200
    input: []
    output: PartnerCommitment
    side_effects: []

  - method: GET
    path: "/rescue/partner-commitments"
    description: "List commitments with filters."
    roles: [PlatformAdmin, TransportDispatcher, PartnerRescue]
    code: 200
    input: ["organization_id?", "species?", "status?", "limit?", "offset?"]
    output: PartnerCommitment[]
    side_effects: []

  - method: POST
    path: "/rescue/partner-commitments/expire-sweep"
    description: "Ops-run checkpoint: expire every commitment whose expires_at has passed, forfeiting its unused slots."
    roles: [PlatformAdmin, TransportDispatcher]
    code: 200
    input: []
    output: "{ expired_count: integer, expired_commitment_ids: string[], slots_forfeited: integer }"
    side_effects: ["moves each stale commitment to EXPIRED, shifting slots_open into slots_released", "recomputes Organization.open_commitment_slots_total"]

  - method: POST
    path: "/rescue/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call the clock reads exactly CLOCK_DEFAULT_UTC 2026-05-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["re-derives every clock-dependent status on next read: hold_status latching, home-check lapsing and certificate expiry"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog — 48 codes.
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role outside the RBAC matrix."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed on the endpoint, or an entity_backed actor acted on a resource it does not own."
  - id: ERR_VALIDATION
    http: 400
    condition: "Malformed body, missing required field, wrong JSON type, out-of-range number, malformed state code, email or ISO 8601 timestamp, arrive-before-depart, or out-of-bounds pagination parameters."
  - id: ERR_INVALID_ENUM
    http: 400
    condition: "An enum-typed field listed in the closed iff-list at validation priority 7 carries a value outside its declared members."

  - id: ERR_ORGANIZATION_NOT_FOUND
    http: 404
    condition: "organization_id in path or body names no Organization."
  - id: ERR_PERSON_NOT_FOUND
    http: 404
    condition: "A person identifier in path or body — person_id, source_person_id, donor_person_id, applicant_person_id, driver_person_id, reclaiming_person_id, counterparty_person_id — names no Person, or an entity_backed actor's X-User-ID names no Person."
  - id: ERR_ANIMAL_NOT_FOUND
    http: 404
    condition: "An animal identifier in path or body names no Animal."
  - id: ERR_LITTER_NOT_FOUND
    http: 404
    condition: "litter_id in path or body names no Litter."
  - id: ERR_INTAKE_RECORD_NOT_FOUND
    http: 404
    condition: "An intake record identifier names no IntakeRecord, or the animal has no OPEN custody episode where one is required."
  - id: ERR_HOLD_NOT_FOUND
    http: 404
    condition: "A hold identifier names no HoldRecord."
  - id: ERR_FOSTER_HOME_NOT_FOUND
    http: 404
    condition: "foster_home_id or destination_foster_home_id names no FosterHome."
  - id: ERR_FOSTER_APPLICATION_NOT_FOUND
    http: 404
    condition: "foster_application_id or destination_foster_application_id names no FosterApplication."
  - id: ERR_FOSTER_PLACEMENT_NOT_FOUND
    http: 404
    condition: "A placement identifier names no FosterPlacement."
  - id: ERR_MEDICAL_RESOURCE_NOT_FOUND
    http: 404
    condition: "A medical record or health certificate identifier names no such row."
  - id: ERR_TRANSPORT_RESOURCE_NOT_FOUND
    http: 404
    condition: "A transport run, transport leg or manifest entry identifier names no such row."
  - id: ERR_ADOPTION_RESOURCE_NOT_FOUND
    http: 404
    condition: "An adoption application, adoption or outcome record identifier names no such row."
  - id: ERR_FUNDING_RESOURCE_NOT_FOUND
    http: 404
    condition: "A contribution or partner commitment identifier names no such row."

  - id: ERR_RECORDS_FROZEN
    http: 409
    condition: "GATE 1: the owning Organization has records_freeze_active true and the request is a write other than the freeze toggle or the clock endpoint."
  - id: ERR_ANIMAL_OUTCOME_CLOSED
    http: 409
    condition: "GATE 2: the target Animal already carries an OutcomeRecord whose reversed_at is null."
  - id: ERR_LEGAL_HOLD_ACTIVE
    http: 409
    condition: "GATE 3: an ACTIVE LEGAL hold blocks this transport or disposition write."
  - id: ERR_MEDICAL_HOLD_ACTIVE
    http: 409
    condition: "GATE 4: an ACTIVE MEDICAL hold blocks adoption finalization or foster-to-foster transfer. It never blocks reclaim or transport."
  - id: ERR_BEHAVIORAL_HOLD_ACTIVE
    http: 409
    condition: "GATE 5: an ACTIVE BEHAVIORAL hold blocks adoption finalization only."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "The supplied expected_animal_version, expected_leg_version or expected_foster_home_version does not equal the parent's current version."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "No transition is declared from the target's current state for this trigger, or a cross-entity parent or application state precondition fails."
  - id: ERR_HOLD_ALREADY_EXPIRED
    http: 409
    condition: "A stray-hold extension was requested on a custody episode whose hold_status has already latched to HOLD_EXPIRED."
  - id: ERR_STRAY_HOLD_NOT_EXPIRED
    http: 409
    condition: "Adoption finalization was attempted while the animal's current custody episode is still HOLD_ACTIVE."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID finalizing an adoption equals the AdoptionApplication.screened_by_user_id."
  - id: ERR_ALTERATION_REQUIRED
    http: 422
    condition: "Adoption finalization was attempted on an animal at or over ALTERATION_MIN_AGE_WEEKS whose alteration_status is not ALTERED."
  - id: ERR_HOUSEHOLD_MISMATCH
    http: 422
    condition: "adoption_match_evaluation failed on one of its five pinned criteria."
  - id: ERR_APPLICATION_ATTEMPT_LIMIT
    http: 409
    condition: "A resubmission was attempted after MAX_ADOPTION_APPLICATION_ATTEMPTS submissions."
  - id: ERR_HOME_CHECK_NOT_CURRENT
    http: 409
    condition: "The linked foster application's home_check_status is NOT_SCHEDULED, FAILED or LAPSED when a placement operation required a current pass."
  - id: ERR_FOSTER_CAPACITY_EXCEEDED
    http: 409
    condition: "The receiving home has too few free slots in the animal's species bucket."
  - id: ERR_FOSTER_HEADCOUNT_EXCEEDED
    http: 409
    condition: "The receiving home has slots free but too few free heads for this placement's headcount_consumption."
  - id: ERR_FOSTER_RESTRICTION_VIOLATION
    http: 422
    condition: "foster_restriction_evaluation failed on cats, children or fence."
  - id: ERR_LEG_CRATE_CAPACITY_EXCEEDED
    http: 409
    condition: "used_crate_units plus the candidate's crate_units would exceed the leg's crate_capacity_units."
  - id: ERR_LEG_WEIGHT_CAPACITY_EXCEEDED
    http: 409
    condition: "used_weight_lb plus the candidate's weight_lb would exceed the leg's weight_capacity_lb."
  - id: ERR_SPECIES_INCOMPATIBLE_LEG
    http: 422
    condition: "leg_species_compatibility rejected the candidate under the leg's species_policy."
  - id: ERR_LEG_SEQUENCE_VIOLATION
    http: 409
    condition: "A leg tried to depart while a lower-sequence leg of the same run had not reached ARRIVED."
  - id: ERR_DRIVER_LEG_OVERLAP
    http: 409
    condition: "The candidate leg's interval overlaps an existing SCHEDULED or DEPARTED leg of the same driver, extended by DRIVER_TURNAROUND_BUFFER_MINUTES."
  - id: ERR_CVI_REQUIRED
    http: 422
    condition: "An interstate leg tried to depart carrying an animal with no health certificate for the destination state."
  - id: ERR_CVI_EXPIRED
    http: 409
    condition: "An interstate leg's scheduled_depart_at is after a manifested animal's certificate expires_at."
  - id: ERR_RABIES_AGE_NOT_MET
    http: 422
    condition: "A manifested animal on an interstate leg has no rabies vaccination, or was vaccinated before RABIES_MIN_AGE_WEEKS."
  - id: ERR_LITTER_SPLIT_NOT_APPROVED
    http: 409
    condition: "A littermate of a GROUPED litter was manifested onto a leg while a sibling already sits on a different leg."
  - id: ERR_PARTNER_COMMITMENT_UNAVAILABLE
    http: 409
    condition: "The linked partner commitment has expired, or has fewer open slots than the run's distinct manifested animal count."
  - id: ERR_PARTNER_SPECIES_MISMATCH
    http: 422
    condition: "A manifested animal's species differs from the linked partner commitment's species."
  - id: ERR_RESTRICTED_FUND_CATEGORY_MISMATCH
    http: 422
    condition: "An explicitly named funding contribution's restriction_category matches neither the medical record's expense_category nor UNRESTRICTED, or it is designated to a different animal."
  - id: ERR_INSUFFICIENT_RESTRICTED_FUNDS
    http: 409
    condition: "The eligible contribution pool does not cover the medical record's cost_cents in full."
  - id: ERR_RETURN_WINDOW_CLOSED
    http: 409
    condition: "An adoption return was attempted more than RETURN_WINDOW_PARTIAL_DAYS after finalization."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix — segregation of duties: the counselor who screens an
# adoption application may not be the actor who finalizes it.
# ---------------------------------------------------------------------------
roles:
  - name: PlatformAdmin
    description: "Superset operator; may perform every operation in the API."
    identity: "opaque"
    exclusive_operations:
      - "POST /rescue/organizations"
      - "POST /rescue/organizations/{id}/records-freeze"
      - "POST /rescue/_clock/set_current_utc"
    shared_operations:
      - "every other endpoint in §1.5"
    note: "PlatformAdmin is not exempt from segregation of duties: an admin that screened an application still cannot finalize its adoption."

  - name: IntakeOfficer
    description: "Takes animals into custody, manages holds, records outcomes and processes owner reclaims."
    identity: "opaque"
    exclusive_operations:
      - "POST /rescue/animals/{id}/intake-records"
      - "POST /rescue/animals/{id}/identification"
      - "POST /rescue/intake-records/{id}/reclaim"
      - "POST /rescue/animals/{id}/outcomes"
    shared_operations:
      - "POST /rescue/animals"
      - "PATCH /rescue/animals/{id}/restrictions"
      - "POST /rescue/litters"
      - "POST /rescue/animals/{id}/holds"
      - "POST /rescue/holds/{id}/release"
      - "POST /rescue/persons"
      - "all animal, litter, intake, hold and outcome reads"

  - name: FosterCoordinator
    description: "Owns the foster pipeline: homes, applications, home checks and placements."
    identity: "opaque"
    exclusive_operations:
      - "POST /rescue/foster-homes"
      - "POST /rescue/foster-applications/{id}/decision"
      - "POST /rescue/foster-applications/{id}/home-check"
      - "POST /rescue/foster-placements"
      - "POST /rescue/foster-placements/{id}/activate"
      - "POST /rescue/foster-placements/{id}/end"
      - "POST /rescue/foster-placements/{id}/transfer"
    shared_operations:
      - "POST /rescue/foster-applications"
      - "POST /rescue/foster-applications/{id}/status-change"
      - "POST /rescue/persons"
      - "all foster and animal reads"

  - name: AdoptionCounselor
    description: "Screens adoption applications and finalizes or reverses adoptions."
    identity: "opaque"
    exclusive_operations:
      - "POST /rescue/adoption-applications/{id}/screen"
      - "POST /rescue/adoptions"
      - "POST /rescue/adoptions/{id}/return"
    shared_operations:
      - "POST /rescue/adoption-applications"
      - "POST /rescue/adoptions/{id}/alteration-proof"
      - "PATCH /rescue/animals/{id}/restrictions"
      - "POST /rescue/persons"
      - "all adoption, animal, intake and hold reads"

  - name: TransportDispatcher
    description: "Plans runs and legs, manifests animals, aborts runs and legs, and administers partner commitments."
    identity: "opaque"
    exclusive_operations:
      - "POST /rescue/transport-runs"
      - "POST /rescue/transport-runs/{id}/start"
      - "POST /rescue/transport-runs/{id}/abort"
      - "POST /rescue/transport-runs/{id}/transport-legs"
      - "POST /rescue/transport-legs/{id}/abort"
      - "POST /rescue/transport-legs/{id}/manifest-entries"
      - "DELETE /rescue/manifest-entries/{id}"
      - "POST /rescue/partner-commitments"
      - "POST /rescue/partner-commitments/expire-sweep"
      - "POST /rescue/litters/{id}/split-approval"
    shared_operations:
      - "POST /rescue/transport-legs/{id}/depart"
      - "POST /rescue/transport-legs/{id}/arrive"
      - "all transport, animal, litter, certificate and commitment reads"

  - name: Driver
    description: "Drives one leg of a run; may depart and arrive only the legs assigned to them."
    identity: "entity_backed:Person"
    exclusive_operations: []
    shared_operations:
      - "POST /rescue/transport-legs/{id}/depart"
      - "POST /rescue/transport-legs/{id}/arrive"
      - "transport, animal, certificate and manifest reads"
    note: "X-User-ID must equal TransportLeg.driver_person_id for the leg being acted on."

  - name: Veterinarian
    description: "Orders and completes medical work and issues health certificates."
    identity: "opaque"
    exclusive_operations:
      - "POST /rescue/animals/{id}/medical-records"
      - "POST /rescue/medical-records/{id}/complete"
      - "POST /rescue/animals/{id}/health-certificates"
    shared_operations:
      - "POST /rescue/animals/{id}/holds"
      - "POST /rescue/holds/{id}/release"
      - "POST /rescue/adoptions/{id}/alteration-proof"
      - "medical, certificate, animal and hold reads"

  - name: FinanceOfficer
    description: "Records contributions, redesignates unapplied gifts and takes adopter payments."
    identity: "opaque"
    exclusive_operations:
      - "POST /rescue/contributions"
      - "POST /rescue/contributions/{id}/redesignate"
    shared_operations:
      - "POST /rescue/adoptions/{id}/payment"
      - "contribution, adoption, medical, organization, person, intake and outcome reads"
      - "GET /rescue/reports/live-release-rate"

  - name: FosterParent
    description: "Applies to foster and reads their own home, applications and placements."
    identity: "entity_backed:Person"
    exclusive_operations: []
    shared_operations:
      - "POST /rescue/foster-applications"
      - "POST /rescue/foster-applications/{id}/status-change"
      - "own foster home, application and placement reads"
      - "GET /rescue/animals/{id}"
    note: "X-User-ID must equal FosterApplication.person_id or FosterHome.person_id."

  - name: Adopter
    description: "Applies to adopt, resubmits a declined application and pays the adoption fee."
    identity: "entity_backed:Person"
    exclusive_operations: []
    shared_operations:
      - "POST /rescue/adoption-applications"
      - "POST /rescue/adoption-applications/{id}/resubmit"
      - "POST /rescue/adoptions/{id}/payment"
      - "own application and adoption reads"
      - "GET /rescue/animals/{id}"
    note: "X-User-ID must equal AdoptionApplication.applicant_person_id or Adoption.adopter_person_id."

  - name: PartnerRescue
    description: "A partner organization that reads its own commitments and the runs drawing on them."
    identity: "entity_backed:Organization"
    exclusive_operations: []
    shared_operations:
      - "GET /rescue/partner-commitments/{id}"
      - "GET /rescue/partner-commitments"
      - "GET /rescue/transport-runs/{id}"
      - "GET /rescue/transport-runs"
      - "GET /rescue/organizations/{id}"
      - "GET /rescue/animals/{id}"
    note: "X-User-ID must equal PartnerCommitment.organization_id for commitment reads."

