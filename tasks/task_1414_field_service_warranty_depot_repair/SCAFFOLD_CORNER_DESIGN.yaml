            - { call: "POST /depot/loaner-units", as: DepotManager, payload: { asset_tag: "LU-C", model_id: "${mdl}", condition_grade: "C", deposit_value_cents: 10000 }, captures: { lu_c: $.data.id } }
            - { call: "POST /depot/loaner-units", as: DepotManager, payload: { asset_tag: "LU-A", model_id: "${mdl}", condition_grade: "A", deposit_value_cents: 10000 }, captures: { lu_a: $.data.id } }
            - { call: "POST /depot/loaner-units", as: DepotManager, payload: { asset_tag: "LU-B", model_id: "${mdl}", condition_grade: "B", deposit_value_cents: 10000 }, captures: { lu_b: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead", service_option: "LOANER" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
          trigger:
            - { call: "POST /depot/rmas/${rma}/loaner-reservations", as: IntakeAgent, payload: { start_date: "2026-08-01", end_date: "2026-08-20" }, captures: { res: $.data.id, picked: $.data.loaner_unit_id } }
          assert:
            - "LoanerReservation.${res}.loaner_unit_id == ${lu_a} (earliest created eligible; LU-C excluded by grade)"
            - "LoanerUnit.${lu_a}.status == RESERVED"

      - name: loaner_auto_select_empty_pool_rejected
        claim_type: correct_result
        grounds: [calculations.loaner_unit_selector, "errors[ERR_LOANER_UNAVAILABLE]"]
        distinguishing_aspect: "Empty eligible pool (only a grade C unit exists) makes the selector fall back to ERR_LOANER_UNAVAILABLE (409)."
