        claim_type: side_effect_execution
        grounds: [state_machines.Job.BOOKED_to_CLEARED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / job_cleared_gate_permit_and_survey
          rationale: "The aggregate BOOKED -> CLEARED re-evaluation (permit alone insufficient; permit+survey PASS sufficient) is asserted by the named §1.8 instance."

