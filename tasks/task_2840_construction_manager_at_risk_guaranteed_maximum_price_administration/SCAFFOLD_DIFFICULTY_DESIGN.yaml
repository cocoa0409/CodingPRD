  - rule_id: transitive_cascade
    instances:
      - name: subcontractor_default_five_level_cascade_to_held_cost_reports
        grounds:
          - state_machines.Subcontract.DEFAULT_NOTICED_to_TERMINATED_FOR_DEFAULT
          - state_machines.WorkPackage.AWARDED_to_REPROCUREMENT
          - state_machines.CostReport.OPEN_to_RECONCILIATION_HELD
          - state_machines.CmarProject.OPEN_to_CONSTRAINED
          - calculations.default_replacement_exposure
          - calculations.contingency_posture_derivation
          - calculations.buyout_savings_tracking
          - calculations.gmp_price_conservation
        distinguishing_aspect: |
          A single TERMINATE_FOR_DEFAULT call propagates five levels - Subcontract exposure ->
          WorkPackage reprocurement and awarded_amount rewrite -> a POSTED CONSTRUCTION
          ContingencyDraw of 225000.00 -> contingency_posture OPEN to CONSTRAINED at 0.0625 ->
          every OPEN CostReport moved to RECONCILIATION_HELD - and the already-RECONCILED
          cost report is provably NOT touched, so the fifth level is state-filtered rather
          than blanket.
        test_recipe:
          setup:
            - "one CmarProject 'Northgate Transit Center' with gmp_status EXECUTED at gmp_amount 3702611.20, construction_contingency_original 240000.00 and remaining 240000.00, owner_contingency_remaining 100000.00, contingency_posture OPEN, contingency_drawn_to_cost_total 0.00"
            - "one WorkPackage 02-EARTHWORK, budget_amount 2000000.00, procurement_status AWARDED, awarded_amount 1900000.00, committed_amount 1900000.00"
            - "one Subcontract at contract_amount 1900000.00, paid_to_date 400000.00, contract_status DEFAULT_NOTICED"
            - "one CostReport RECONCILED covering [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z) with one line"
            - "one CostReport OPEN covering [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z) with one line"
