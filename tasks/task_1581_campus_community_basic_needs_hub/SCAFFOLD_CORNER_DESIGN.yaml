# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — Campus & Community Basic Needs Hub
# §1.9 Coverage Index for non-Difficulty claims (breadth probe).
# Sections/claim_types follow references/claim-extraction-guide.md.
# Logical clock default before any set_current_utc call: 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Section: entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: client_create_student_with_five_credits_returns_400
        claim_type: type_constraints
        grounds: ["entities.Client.fields.enrolled_credits", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "population_type ENROLLED_STUDENT with enrolled_credits 3 violates the >= 6 constraint; rejected before any state change."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { alias_name: "u", contact_channel: "EMAIL", population_type: "ENROLLED_STUDENT", enrolled_credits: 3 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "400 ERR_INVALID_REQUEST"
            - "no Client row created (subsequent GET /clients as staff shows total_count == 0)"

      - name: client_create_defaults_applied
        claim_type: defaults
        grounds: ["entities.Client.fields.enrolled_credits", "entities.Client.fields.status"]
        distinguishing_aspect: "COMMUNITY_RESIDENT creation omitting enrolled_credits persists 0, status INTAKE_PENDING, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { alias_name: "d", contact_channel: "NONE", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { cid: $.data.id, credits: $.data.enrolled_credits, st: $.data.status, ver: $.data.version }
          assert:
            - "enrolled_credits == 0 (default applied)"
            - "status == INTAKE_PENDING (initial state)"
            - "version == 1 and id is a bare UUID (no type prefix)"

      - name: client_get_nonexistent_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "A well-formed but absent UUID on GET /clients/{cid} yields 404 ERR_NOT_FOUND after auth/role pass."
        test_recipe:
          setup: ["IntakeCoordinator staff exists"]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
              captures: { coord_id: $.data.id }
          trigger:
            - call: "GET /clients/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { err: $.data.error_id }
          assert:
            - "404 ERR_NOT_FOUND"

      - name: line_item_points_pinned_at_add_time
        claim_type: computed_fields
        grounds: ["entities.VisitLineItem.fields.points_charged"]
        distinguishing_aspect: "A line added at point_cost 10 keeps points_charged 20 even after the item's point_cost is patched to 15 — later price changes never retro-edit pinned lines."
        test_recipe:
          setup:
            - "ACTIVE client hh=1; PantryStaff; item cost 10 stock 10; one CHECKED_IN visit with 2 units"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "P Pa", email: "pantry@hub.test", staff_role: "PANTRY_STAFF" }
              as: HubAdmin
              captures: { ps_id: $.data.id }
            - call: "POST /clients"
              payload: { alias_name: "p", contact_channel: "EMAIL", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /clients/${c_id}/assessments"
              payload: { household_size: 1, monthly_income_cents: 50000, housing_status: "STABLE", dependents_under_18: 0, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 1, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { a_id: $.data.id }
            - call: "POST /clients/${c_id}/assessments/${a_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients/${c_id}/assessments/${a_id}/verify"
              payload: { expected_client_version: "${c_v}" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /pantry-items"
              payload: { item_name: "Tuna", category: "SHELF_STABLE", point_cost: 10, quantity_on_hand: 10, reorder_threshold: 0, per_visit_limit: 5 }
              as: HubAdmin
              captures: { i_id: $.data.id, i_v: $.data.version }
            - call: "POST /clients/${c_id}/pantry-visits"
              payload: {}
              as: PantryStaff
              as_user_id: "${ps_id}"
              captures: { v_id: $.data.id }
            - call: "POST /pantry-visits/${v_id}/line-items"
              payload: { item_id: "${i_id}", quantity: 2 }
              as: PantryStaff
              as_user_id: "${ps_id}"
              captures: { li_id: $.data.id, li_pts: $.data.points_charged }
          trigger:
            - call: "PATCH /pantry-items/${i_id}"
              payload: { point_cost: 15, expected_item_version: "${i_v}" }
              as: HubAdmin
            - call: "GET /visit-line-items"
              payload: { visit_id: "${v_id}" }
              as: PantryStaff
              as_user_id: "${ps_id}"
              captures: { li_after: "$.data[0].points_charged" }
          assert:
            - "at add time: points_charged == 20 (2 x 10)"
            - "after PATCH to point_cost 15: line still reports points_charged == 20"
            - "visit provisional_points remains 20 (checkout will charge 20, not 30)"

      - name: staff_duplicate_email_rejected
        claim_type: violation_to_error
        grounds: ["entities.StaffMember.fields.email", "errors[ERR_DUPLICATE_STAFF_EMAIL]"]
        distinguishing_aspect: "Second StaffMember with an existing email -> 409 ERR_DUPLICATE_STAFF_EMAIL."
        test_recipe:
          setup: ["one staff member with email coord@hub.test"]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
          trigger:
            - call: "POST /staff"
              payload: { full_name: "C Other", email: "coord@hub.test", staff_role: "PANTRY_STAFF" }
              as: HubAdmin
              captures: { err: $.data.error_id }
          assert:
            - "409 ERR_DUPLICATE_STAFF_EMAIL"

  # ---------------------------------------------------------------------------
  # Section: state_machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: assessment_double_submit_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.IntakeAssessment.DRAFT_to_SUBMITTED", "errors[ERR_ASSESSMENT_NOT_EDITABLE]"]
        distinguishing_aspect: "Second submit on an already-SUBMITTED assessment fails; the frozen income_ratio/eligibility_band from the first submit are unchanged."
        test_recipe:
          setup: ["IntakeCoordinator; client with one assessment already SUBMITTED (income 163100 -> ratio 1.2996, band FULL)"]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /clients"
              payload: { alias_name: "ds", contact_channel: "EMAIL", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/assessments"
              payload: { household_size: 1, monthly_income_cents: 163100, housing_status: "STABLE", dependents_under_18: 0, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 0, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { a_id: $.data.id }
            - call: "POST /clients/${c_id}/assessments/${a_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
          trigger:
            - call: "POST /clients/${c_id}/assessments/${a_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { err: $.data.error_id }
            - call: "GET /assessments"
              payload: { client_id: "${c_id}" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { band: "$.data[0].eligibility_band", st: "$.data[0].status" }
          assert:
            - "409 ERR_ASSESSMENT_NOT_EDITABLE"
            - "assessment remains SUBMITTED with eligibility_band FULL and income_ratio 1.2996 (no side effects re-fired)"

      - name: verify_returned_assessment_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.IntakeAssessment.SUBMITTED_to_VERIFIED", "errors[ERR_ASSESSMENT_NOT_EDITABLE]"]
        distinguishing_aspect: "Verify is admitted only from SUBMITTED; a RETURNED assessment rejects verify even with a correct expected_client_version."
        test_recipe:
          setup: ["IntakeCoordinator; client assessment SUBMITTED then RETURNED with notes"]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /clients"
              payload: { alias_name: "vr", contact_channel: "EMAIL", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /clients/${c_id}/assessments"
              payload: { household_size: 2, monthly_income_cents: 100000, housing_status: "COST_BURDENED", dependents_under_18: 1, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 2, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { a_id: $.data.id }
            - call: "POST /clients/${c_id}/assessments/${a_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients/${c_id}/assessments/${a_id}/return"
              payload: { return_notes: "missing income proof" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
          trigger:
            - call: "POST /clients/${c_id}/assessments/${a_id}/verify"
              payload: { expected_client_version: "${c_v}" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { err: $.data.error_id }
          assert:
            - "409 ERR_ASSESSMENT_NOT_EDITABLE (RETURNED does not admit verify)"
            - "assessment remains RETURNED with return_notes 'missing income proof'"

      - name: assessment_revision_loop_return_to_draft_to_verified
        claim_type: valid_transition
        grounds: ["state_machines.IntakeAssessment.RETURNED_to_DRAFT", "state_machines.IntakeAssessment.SUBMITTED_to_VERIFIED"]
        distinguishing_aspect: "The RETURNED -> DRAFT -> SUBMITTED -> VERIFIED loop closes: revise overwrites household_size in place, resubmit recomputes the band, and verify then succeeds — one assessment row cycles without creating a new one."
        test_recipe:
          setup: ["IntakeCoordinator; assessment RETURNED after submit (hh=2, income 100000)"]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /clients"
              payload: { alias_name: "rl", contact_channel: "EMAIL", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /clients/${c_id}/assessments"
              payload: { household_size: 2, monthly_income_cents: 100000, housing_status: "COST_BURDENED", dependents_under_18: 1, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 2, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { a_id: $.data.id }
            - call: "POST /clients/${c_id}/assessments/${a_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients/${c_id}/assessments/${a_id}/return"
              payload: { return_notes: "verify household" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
          trigger:
            - call: "POST /clients/${c_id}/assessments/${a_id}/revise"
              payload: { household_size: 1 }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { st1: $.data.status, hh1: $.data.household_size, band1: $.data.eligibility_band }
            - call: "POST /clients/${c_id}/assessments/${a_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { band2: $.data.eligibility_band, ratio2: $.data.income_ratio }
            - call: "POST /clients/${c_id}/assessments/${a_id}/verify"
              payload: { expected_client_version: "${c_v}" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { st3: $.data.status, exp3: $.data.expires_at }
          assert:
            - "revise: status DRAFT, household_size == 1, eligibility_band null (cleared)"
            - "resubmit: income_ratio recomputed on hh=1 -> 0.7968, band FULL (0.7968 <= 1.30)"
            - "verify succeeds after the loop: status VERIFIED, expires_at == 2027-08-01T00:00:00.000Z (verified at the 2026-08-01T00:00:00Z default clock + 365 days)"
            - "client is now ACTIVE"

      - name: terminal_disbursed_grant_rejects_all_actions
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.EmergencyGrantApplication", "errors[ERR_GRANT_NOT_REVIEWABLE]"]
        distinguishing_aspect: "A DISBURSED application rejects withdraw, deny, and request-info alike with ERR_GRANT_NOT_REVIEWABLE; fund counters stay put."
        test_recipe:
          setup:
            - "ACTIVE client; GrantReviewer; fund 500000; application DISBURSED 100000 (disbursed by HubAdmin admin-9 != reviewer)"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "R Re", email: "rev@hub.test", staff_role: "GRANT_REVIEWER" }
              as: HubAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /clients"
              payload: { alias_name: "td", contact_channel: "EMAIL", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /clients/${c_id}/assessments"
              payload: { household_size: 1, monthly_income_cents: 50000, housing_status: "STABLE", dependents_under_18: 0, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 1, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { a_id: $.data.id }
            - call: "POST /clients/${c_id}/assessments/${a_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients/${c_id}/assessments/${a_id}/verify"
              payload: { expected_client_version: "${c_v}" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /grant-funds"
              payload: { fund_name: "FY26-t", fiscal_year: 2026, allocated_cents: 500000 }
              as: HubAdmin
              captures: { f_id: $.data.id, f_v: $.data.version }
            - call: "POST /clients/${c_id}/grant-applications"
              payload: { fund_id: "${f_id}", category: "MEDICAL", requested_cents: 100000, hardship_statement: "rx" }
              as: Client
              as_user_id: "${c_id}"
              captures: { g_id: $.data.id }
            - call: "POST /grant-applications/${g_id}/submit"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /grant-applications/${g_id}/begin-review"
              payload: {}
              as: GrantReviewer
              as_user_id: "${rev_id}"
            - call: "POST /grant-applications/${g_id}/approve"
              payload: { expected_fund_version: "${f_v}" }
              as: GrantReviewer
              as_user_id: "${rev_id}"
            - call: "POST /grant-applications/${g_id}/disburse"
              payload: {}
              as: HubAdmin
              as_user_id: "admin-9"
          trigger:
            - call: "POST /grant-applications/${g_id}/withdraw"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /grant-applications/${g_id}/deny"
              payload: { decision_rationale: "too late" }
              as: GrantReviewer
              as_user_id: "${rev_id}"
              captures: { err2: $.data.error_id }
            - call: "GET /grant-funds/${f_id}"
              as: GrantReviewer
              as_user_id: "${rev_id}"
              captures: { disb: $.data.disbursed_cents }
          assert:
            - "withdraw -> 409 ERR_GRANT_NOT_REVIEWABLE"
            - "deny -> 409 ERR_GRANT_NOT_REVIEWABLE"
            - "GrantFund.${f_id}.disbursed_cents still == 100000 (terminal lockdown, no drift)"

      - name: suspend_auto_voids_open_visit_and_blocks_checkin
        claim_type: side_effect_execution
        grounds: ["state_machines.Client.ACTIVE_to_SUSPENDED", "state_machines.PantryVisit.CHECKED_IN_to_VOIDED"]
        distinguishing_aspect: "Suspending a client with an open visit voids that visit as a cascade: stock untouched (never checked out), provisional points discarded, and post-reinstate check-in is not blocked by the voided visit (VOIDED excluded from the 168h count)."
        test_recipe:
          setup:
            - "ACTIVE client hh=1; PantryStaff; item cost 10 stock 10; one CHECKED_IN visit with a 1-unit line"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "P Pa", email: "pantry@hub.test", staff_role: "PANTRY_STAFF" }
              as: HubAdmin
              captures: { ps_id: $.data.id }
            - call: "POST /clients"
              payload: { alias_name: "sv", contact_channel: "EMAIL", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /clients/${c_id}/assessments"
              payload: { household_size: 1, monthly_income_cents: 50000, housing_status: "STABLE", dependents_under_18: 0, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 1, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { a_id: $.data.id }
            - call: "POST /clients/${c_id}/assessments/${a_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients/${c_id}/assessments/${a_id}/verify"
              payload: { expected_client_version: "${c_v}" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /pantry-items"
              payload: { item_name: "Soup", category: "SHELF_STABLE", point_cost: 10, quantity_on_hand: 10, reorder_threshold: 0, per_visit_limit: 5 }
              as: HubAdmin
              captures: { i_id: $.data.id }
            - call: "POST /clients/${c_id}/pantry-visits"
              payload: {}
              as: PantryStaff
              as_user_id: "${ps_id}"
              captures: { v_id: $.data.id }
            - call: "POST /pantry-visits/${v_id}/line-items"
              payload: { item_id: "${i_id}", quantity: 1 }
              as: PantryStaff
              as_user_id: "${ps_id}"
          trigger:
            - call: "POST /clients/${c_id}/suspend"
              payload: {}
              as: HubAdmin
              captures: { c_status: $.data.status }
            - call: "GET /pantry-visits"
              payload: { client_id: "${c_id}" }
              as: PantryStaff
              as_user_id: "${ps_id}"
              captures: { v_status: "$.data[0].status" }
            - call: "POST /clients/${c_id}/pantry-visits"
              payload: {}
              as: PantryStaff
              as_user_id: "${ps_id}"
              captures: { blocked: $.data.error_id }
            - call: "POST /clients/${c_id}/reinstate"
              payload: {}
              as: HubAdmin
            - call: "POST /clients/${c_id}/pantry-visits"
              payload: {}
              as: PantryStaff
              as_user_id: "${ps_id}"
              captures: { v2_id: $.data.id, v2_status: $.data.status }
          assert:
            - "suspend: client SUSPENDED; visit ${v_id} auto-VOIDED"
            - "check-in while SUSPENDED -> 409 ERR_CLIENT_NOT_ACTIVE"
            - "after reinstate: check-in succeeds (${v2_status} == CHECKED_IN) — the voided visit holds no frequency slot"
            - "item quantity_on_hand == 10 throughout (visit never checked out)"

      - name: two_no_show_strikes_restrict_third_booking
        claim_type: side_effect_execution
        grounds: ["state_machines.ShelterStay.RESERVED_to_NO_SHOW", "entities.Client.fields.shelter_restricted", "errors[ERR_SHELTER_RESTRICTED]"]
        distinguishing_aspect: "Each swept no-show recomputes shelter_no_show_count_90d; at the second strike shelter_restricted flips true and the next stay creation fails with ERR_SHELTER_RESTRICTED — an accumulated-strike gate, not a per-request rule."
        test_recipe:
          setup:
            - "Shelter-eligible ACTIVE client (HOMELESS); ShelterCoordinator; bed B1"
            - "Stay 1 RESERVED check_in 2026-08-02; swept at 2026-08-04 (NO_SHOW, strike 1)"
            - "Stay 2 RESERVED check_in 2026-08-05; swept at 2026-08-07 (NO_SHOW, strike 2)"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "S Sh", email: "shelter@hub.test", staff_role: "SHELTER_COORDINATOR" }
              as: HubAdmin
              captures: { sc_id: $.data.id }
            - call: "POST /clients"
              payload: { alias_name: "ns", contact_channel: "NONE", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /clients/${c_id}/assessments"
              payload: { household_size: 1, monthly_income_cents: 0, housing_status: "HOMELESS", dependents_under_18: 0, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 6, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { a_id: $.data.id }
            - call: "POST /clients/${c_id}/assessments/${a_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients/${c_id}/assessments/${a_id}/verify"
              payload: { expected_client_version: "${c_v}" }
              as: IntakeCoordinator
