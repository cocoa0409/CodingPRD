  # --- Orders ---
  - method: POST
    path: "/nabs/orders"
    description: "Create empty DRAFT order"
    roles: [Member, ShopStaff]
    code: 201
    input: ["member_id", "channel", "ship_to_state_code?", "loyalty_points_redeemed?", "applied_club_subscription_id?"]
    output: Order
