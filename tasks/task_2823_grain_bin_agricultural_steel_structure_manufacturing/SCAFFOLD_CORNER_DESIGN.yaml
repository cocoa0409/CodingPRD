            - call: "POST /engineers"
              payload: { name: "Dana Author", license_number: "PE-1001", licensed_jurisdiction_codes: ["IA-CENTRAL", "NE-WEST", "CA-VALLEY"] }
              as: PlantAdmin
              captures: { eng_a_id: $.data.id }
            - call: "POST /dealers"
              payload: { name: "Alpha Grain Systems", region_code: "NE-01", jurisdiction_id: "${j_ns_id}", credit_limit_cents: 900000000, program_tier: "BASE", staging_slots: 2, high_cube_access: true }
              as: PlantAdmin
              captures: { dlr_a_id: $.data.id }
            - call: "POST /dealers"
              payload: { name: "Pinnacle Bin Supply", region_code: "NE-02", jurisdiction_id: "${j_ns_id}", credit_limit_cents: 900000000, program_tier: "PREFERRED", staging_slots: 2, high_cube_access: false }
              as: PlantAdmin
              captures: { dlr_p_id: $.data.id }
            - call: "POST /installation-crews"
              payload: { dealer_id: "${dlr_a_id}", crew_name: "Alpha Erectors", certification_tier: "T3", certified_until: "2027-12-31T00:00:00Z" }
              as: PlantAdmin
              captures: { crew_a_id: $.data.id, crew_a_max: $.data.max_diameter_m }
            - call: "POST /installation-crews"
              payload: { dealer_id: "${dlr_p_id}", crew_name: "Pinnacle Erectors", certification_tier: "T3", certified_until: "2027-12-31T00:00:00Z" }
              as: PlantAdmin
              captures: { crew_p_id: $.data.id }
            - call: "POST /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", jurisdiction_id: "${j_ns_id}", grain_profile_id: "${gp_corn_id}", coating_spec_id: "${cs_g115_id}", diameter_m: 12.0, eave_height_m: 9.6, roof_pitch_deg: 30, design_wind_speed_mph: 105, moisture_pct: 14.0, design_method: "ASD" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr_a_id}", bin_design_id: "${d1_id}", order_season: "OFFSEASON", aeration_package: "NONE", unload_system: "GRAVITY" }
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { oa1_id: $.data.id }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr_a_id}", bin_design_id: "${d1_id}", order_season: "OFFSEASON", aeration_package: "NONE", unload_system: "GRAVITY" }
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { oa2_id: $.data.id }
          trigger:
            - call: "POST /dealer-orders/${oa1_id}/assign-crew"
              payload: { installation_crew_id: "${crew_p_id}" }
