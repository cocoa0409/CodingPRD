              payload: { course_id: "${course_id}", title: "L1", order_index: 1 }
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${course_id}/enroll"
              payload: { learner_id: "${learner_id}" }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_id}/refund"
              payload: {}
              as: Learner
              as_user_id: "${learner_id}"
            - call: "GET /instructors/${inst_id}"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { lifetime: $.data.lifetime_earned_cents }
          assert:
            - "Instructor.${inst_id}.lifetime_earned_cents == 0 after the refund (== its pre-sale value; SALE+REFUND net 0)"
            - "Instructor.${inst_id}.pending_balance_cents == 0 and payout_balance_cents == 0 after the refund"

      - name: coupon_redeem_refund_conserves_redeemed_count
        grounds:
          - state_machines.Enrollment.ACTIVE_to_REFUNDED
          - state_machines.Coupon.EXHAUSTED_to_ACTIVE
          - entities.Coupon.fields.redeemed_count
        distinguishing_aspect: |
          Conserved quantity = Coupon.redeemed_count (a DIFFERENT conserved type from
          monetary lifetime_earned). Redeem (+1) followed by the compensating refund (-1)
          leaves redeemed_count at its pre-redemption value 0, pinned as
          redeemed_count == count(non-REFUNDED enrollments that redeemed this coupon).
        test_recipe:
          setup:
            - "PUBLISHED course; ACTIVE coupon max_redemptions=3 redeemed_count 0; learner enrolls redeeming it (redeemed_count 1) at clock 2026-06-01."
          setup_api_calls:
            - call: "POST /instructors"
              payload: { display_name: "Inst R", email: "instr@x.com", revenue_share_pct: 0.50 }
              as: Anonymous
              captures: { inst_id: $.data.id }
            - call: "POST /learners"
              payload: { full_name: "Xia", email: "xia@x.com" }
              as: Anonymous
              captures: { learner_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "Cons", list_price_cents: 5000, refund_window_days: 30 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", order_index: 1 }
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /coupons"
              payload: { instructor_id: "${inst_id}", course_id: "${course_id}", code: "THREE", discount_type: "FLAT", discount_value: 1000, max_redemptions: 3, valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { coupon_id: $.data.id }
            - call: "POST /courses/${course_id}/enroll"
              payload: { learner_id: "${learner_id}", coupon_code: "THREE" }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_id}/refund"
              payload: {}
              as: Learner
              as_user_id: "${learner_id}"
            - call: "GET /coupons/${coupon_id}"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { redeemed: $.data.redeemed_count }
          assert:
            - "Coupon.${coupon_id}.redeemed_count == 0 after the refund (== its pre-redemption value; redeem +1 then refund -1)"
            - "Coupon.${coupon_id}.status == ACTIVE (was never EXHAUSTED here; remains redeemable)"
