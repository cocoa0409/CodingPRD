          assert:
            - "setup produced data.candidate_count == 1 and QualityControlReview.${review_id}.status == OPEN with selection_reason == SAMPLE_QUOTA"
            - "first decide (BASIC reviewer ${rec_c_id}): HTTP 403 with data.error_id == ERR_QC_CREDENTIAL_REQUIRED, and QualityControlReview.${review_id}.status is still OPEN with reviewer_recruiter_id null"
            - "second decide (QC_CERTIFIED reviewer ${rec_b_id}): HTTP 200, QualityControlReview.${review_id}.status == PASSED, reviewer_recruiter_id == ${rec_b_id}, decided_on == 2026-08-01T00:00:00Z"
            - "second decide: CertificateOfEligibility.${coe_id}.status == QC_PASSED and correction_round_count is still 0"
            - "third decide: HTTP 409 with data.error_id == ERR_QC_REVIEW_ALREADY_DECIDED"
            - "after the third decide QualityControlReview.${review_id}.status is still PASSED, discrepancy_codes is still empty and decided_on is still ${decided_on_1}"
            - "after the third decide CertificateOfEligibility.${coe_id}.status is still QC_PASSED, not RETURNED_FOR_CORRECTION"

      - name: corner_assignment_close_and_activate_guard_the_assignment_state
        claim_type: Error triggerability
        grounds:
          - errors[ERR_ASSIGNMENT_INVALID_STATE]
          - validations[priority 6 ERR_ASSIGNMENT_INVALID_STATE]
          - state_machines.RecruiterAssignment.terminal_states
          - endpoints[POST /mep/recruiter-assignments/{assignment_id}/close]
          - endpoints[POST /mep/recruiter-assignments/{assignment_id}/activate]
        distinguishing_aspect: "One error code guards three distinct state mistakes on the same row: closing a PLANNED assignment with outcome COMPLETED (which requires ACTIVE) is refused, cancelling it from PLANNED succeeds, and both a second close and an activate against the now-CANCELLED row are refused - with the area's PRIMARY slot counter returning to 0 exactly once."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea with recruiter_capacity 3 and peak season 2026-06-01..2026-09-30"
            - "one ACTIVE Recruiter"
            - "one PLANNED PRIMARY RecruiterAssignment spanning 2026-05-01..2026-10-31"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Rosa Aguilar", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
            - call: "GET /mep/areas/${area_id}"
              payload: {}
              as: StateProgramAdmin
              captures: { area_v1: $.data.version }
            - call: "POST /mep/recruiter-assignments"
              payload: { recruiter_id: "${rec_a_id}", area_id: "${area_id}", coverage_role: "PRIMARY", starts_on: "2026-05-01", ends_on: "2026-10-31", expected_area_version: "${area_v1}" }
              as: StateProgramAdmin
              captures: { asg_id: $.data.id, asg_status: $.data.status }
          trigger:
            - call: "POST /mep/recruiter-assignments/${asg_id}/close"
              payload: { outcome: "COMPLETED" }
              as: StateProgramAdmin
            - call: "POST /mep/recruiter-assignments/${asg_id}/close"
              payload: { outcome: "CANCELLED", cancelled_reason: "Recruiter reassigned before the season opened." }
              as: StateProgramAdmin
              captures: { closed_status: $.data.status, closed_reason: $.data.cancelled_reason }
            - call: "POST /mep/recruiter-assignments/${asg_id}/close"
              payload: { outcome: "CANCELLED", cancelled_reason: "Second attempt." }
              as: StateProgramAdmin
            - call: "POST /mep/recruiter-assignments/${asg_id}/activate"
              payload: {}
              as: StateProgramAdmin
          assert:
            - "before the trigger RecruiterAssignment.${asg_id}.status == PLANNED and AgriculturalArea.${area_id}.assigned_primary_slots_used == 1"
            - "first close (outcome COMPLETED from PLANNED): HTTP 409 with data.error_id == ERR_ASSIGNMENT_INVALID_STATE, status still PLANNED and assigned_primary_slots_used still 1"
            - "second close (outcome CANCELLED from PLANNED): HTTP 200, RecruiterAssignment.${asg_id}.status == CANCELLED with cancelled_reason == 'Recruiter reassigned before the season opened.'"
            - "second close: AgriculturalArea.${area_id}.assigned_primary_slots_used == 0 and Recruiter.${rec_a_id}.active_assignment_count == 0"
            - "third close: HTTP 409 with data.error_id == ERR_ASSIGNMENT_INVALID_STATE and cancelled_reason is still the first reason, not 'Second attempt.'"
            - "activate from CANCELLED: HTTP 409 with data.error_id == ERR_ASSIGNMENT_INVALID_STATE"
            - "after both refusals AgriculturalArea.${area_id}.assigned_primary_slots_used is still 0 - the counter was released exactly once"

      - name: corner_closed_plan_refuses_activate_and_a_second_close
        claim_type: Error triggerability
        grounds:
