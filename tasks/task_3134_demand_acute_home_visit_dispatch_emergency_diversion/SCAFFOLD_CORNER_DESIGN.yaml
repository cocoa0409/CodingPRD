# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task: task_3134_demand_acute_home_visit_dispatch_emergency_diversion
#
# Breadth probe over §1.1–§1.7 claims not already covered by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Each section uses the claim_types from
# references/claim-extraction-guide.md. Corners already exercised by §1.8
# appear as `excluded_because:` stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: market_create_returns_system_fields_and_default_active
        claim_type: Creation
        grounds:
          - entities.MarketCoverageArea
          - endpoints.POST_/dh/markets
        distinguishing_aspect: "Market created with is_active omitted defaults to true; response carries server-minted id, created_at, updated_at, version=1, and open_visit_count initialized to 0."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z; empty DB."]
          setup_api_calls:
            - call: "POST /dh/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /dh/markets"
              payload: { market_code: "ATL-NE", display_name: "Atlanta NE", polygon_geojson: "{\"type\":\"Polygon\",\"coordinates\":[[[-84.6,33.6],[-84.2,33.6],[-84.2,34.0],[-84.6,34.0],[-84.6,33.6]]]}", response_window_minutes_urgent: 60, response_window_minutes_standard: 240 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
          assert:
            - "HTTP 201 and response_type == object"
            - "MarketCoverageArea.${mkt_id}.is_active == true (default applied)"
            - "MarketCoverageArea.${mkt_id}.open_visit_count == 0"
            - "MarketCoverageArea.${mkt_id}.version == 1"
            - "meta.api_request_id present"

      - name: patient_get_returns_stored_fields_unchanged
        claim_type: Retrieval
        grounds:
          - entities.Patient
          - endpoints.GET_/dh/patients/{id}
        distinguishing_aspect: "Every Patient field round-trips via GET exactly as posted, including the optional comorbidity_count when supplied."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /dh/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dh/patients"
              payload: { full_name: "Quentin Q", date_of_birth: "1975-11-30", payer_code: "BCBS-TX", member_id: "M2000", pcp_name: "Dr. W", pcp_npi: "1231231234", comorbidity_count: 4, home_address_geo: "{\"type\":\"Point\",\"coordinates\":[-97.0,33.0]}" }
              as: TriageNurse
              captures: { patient_id: $.data.id }
          trigger:
            - call: "GET /dh/patients/${patient_id}"
              payload: {}
              as: TriageNurse
          assert:
            - "HTTP 200"
            - "Patient.${patient_id}.full_name == 'Quentin Q'"
            - "Patient.${patient_id}.payer_code == 'BCBS-TX'"
            - "Patient.${patient_id}.comorbidity_count == 4"
            - "Patient.${patient_id}.pcp_npi == '1231231234'"

      - name: markets_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/dh/markets
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three markets on file, limit=2&offset=0 returns 2 rows with total_count==3 and has_more==true; offset=2 returns 1 row with has_more==false."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z; three markets created."]
          setup_api_calls:
            - call: "POST /dh/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dh/markets"
              payload: { market_code: "M1", display_name: "M1", polygon_geojson: "{}", response_window_minutes_urgent: 60, response_window_minutes_standard: 240 }
              as: PlatformAdmin
            - call: "POST /dh/markets"
              payload: { market_code: "M2", display_name: "M2", polygon_geojson: "{}", response_window_minutes_urgent: 60, response_window_minutes_standard: 240 }
              as: PlatformAdmin
            - call: "POST /dh/markets"
              payload: { market_code: "M3", display_name: "M3", polygon_geojson: "{}", response_window_minutes_urgent: 60, response_window_minutes_standard: 240 }
              as: PlatformAdmin
          trigger:
            - call: "GET /dh/markets"
              payload: { limit: 2, offset: 0 }
              as: Dispatcher
          assert:
            - "response_type == array, total_count == 3, has_more == true, rows == 2"
            - "GET /dh/markets?limit=2&offset=2 returns 1 row, total_count == 3, has_more == false"

      - name: market_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/dh/markets/{id}
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "Syntactically valid but unallocated UUID produces 404 ERR_NOT_FOUND, not a generic 400."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z; no markets."]
          setup_api_calls:
            - call: "POST /dh/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /dh/markets/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP 404 and error_id == ERR_NOT_FOUND"
            - "response_type == error, data carries error_id and message"

      - name: visit_request_create_missing_chief_complaint_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.VisitRequest.fields.chief_complaint
          - errors.ERR_INVALID_REQUEST
          - validations[priority=26]
        distinguishing_aspect: "chief_complaint is a required input with no default; omitting it returns 400 ERR_INVALID_REQUEST before any state or business check runs."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z; one market and one patient exist."]
          setup_api_calls:
            - call: "POST /dh/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dh/markets"
              payload: { market_code: "DFW-N", display_name: "DFW N", polygon_geojson: "{\"type\":\"Polygon\",\"coordinates\":[[[-97.5,32.5],[-96.5,32.5],[-96.5,33.5],[-97.5,33.5],[-97.5,32.5]]]}", response_window_minutes_urgent: 60, response_window_minutes_standard: 240 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /dh/patients"
              payload: { full_name: "Rita R", date_of_birth: "1990-01-01", payer_code: "AETNA", member_id: "M3000", pcp_name: "Dr. X", pcp_npi: "9999999991", home_address_geo: "{\"type\":\"Point\",\"coordinates\":[-97.0,33.0]}" }
              as: TriageNurse
              captures: { patient_id: $.data.id }
          trigger:
            - call: "POST /dh/visit-requests"
              payload: { patient_id: "${patient_id}", market_id: "${mkt_id}", requestor_role: "PATIENT" }
              as: TriageNurse
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /dh/patients/${patient_id}/visit-requests returns 0 rows"

      - name: patient_create_omitting_comorbidity_count_defaults_to_zero
        claim_type: Defaults
        grounds:
          - entities.Patient.fields.comorbidity_count
        distinguishing_aspect: "comorbidity_count has default 0; omitting it stores 0, not null. The default feeds acuity scoring (0 comorbidity points)."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /dh/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /dh/patients"
              payload: { full_name: "Sam S", date_of_birth: "1990-01-01", payer_code: "AETNA", member_id: "M3001", pcp_name: "Dr. X", pcp_npi: "9999999992", home_address_geo: "{\"type\":\"Point\",\"coordinates\":[-97.0,33.0]}" }
              as: TriageNurse
              captures: { patient_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Patient.${patient_id}.comorbidity_count == 0"

      - name: visit_request_acuity_band_computed_at_triage_submit
        claim_type: Computed Fields
        grounds:
          - entities.VisitRequest.fields.acuity_band
          - calculations.acuity_score
        distinguishing_aspect: "acuity_band is source=computed — never client-supplied. If the intake POST includes acuity_band='URGENT' it is ignored; the field is null until triage submission."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z; market + patient exist."]
          setup_api_calls:
            - call: "POST /dh/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dh/markets"
              payload: { market_code: "DFW-N", display_name: "DFW N", polygon_geojson: "{\"type\":\"Polygon\",\"coordinates\":[[[-97.5,32.5],[-96.5,32.5],[-96.5,33.5],[-97.5,33.5],[-97.5,32.5]]]}", response_window_minutes_urgent: 60, response_window_minutes_standard: 240 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /dh/patients"
              payload: { full_name: "Tess T", date_of_birth: "1980-01-01", payer_code: "AETNA", member_id: "M4000", pcp_name: "Dr. X", pcp_npi: "9999999993", comorbidity_count: 0, home_address_geo: "{\"type\":\"Point\",\"coordinates\":[-97.0,33.0]}" }
              as: TriageNurse
              captures: { patient_id: $.data.id }
          trigger:
            - call: "POST /dh/visit-requests"
              payload: { patient_id: "${patient_id}", market_id: "${mkt_id}", requestor_role: "PATIENT", chief_complaint: "stub toe" }
              as: TriageNurse
              captures: { vr_id: $.data.id }
          assert:
            - "VisitRequest.${vr_id}.acuity_band is null at INTAKE"
            - "VisitRequest.${vr_id}.status == INTAKE"
            - "VisitRequest.${vr_id}.sla_deadline_at is null"
            - "VisitRequest.${vr_id}.sla_breached == false"

      - name: requestor_role_enum_rejection
        claim_type: Type Constraints
        grounds:
          - entities.VisitRequest.fields.requestor_role
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "requestor_role must be one of PATIENT|PAYER|PROVIDER|FACILITY; 'CAREGIVER' returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z; market + patient."]
          setup_api_calls:
            - call: "POST /dh/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dh/markets"
              payload: { market_code: "DFW-N", display_name: "DFW N", polygon_geojson: "{}", response_window_minutes_urgent: 60, response_window_minutes_standard: 240 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /dh/patients"
              payload: { full_name: "Uma U", date_of_birth: "1990-01-01", payer_code: "AETNA", member_id: "M5000", pcp_name: "Dr. X", pcp_npi: "9999999994", home_address_geo: "{\"type\":\"Point\",\"coordinates\":[-97.0,33.0]}" }
              as: TriageNurse
              captures: { patient_id: $.data.id }
          trigger:
            - call: "POST /dh/visit-requests"
              payload: { patient_id: "${patient_id}", market_id: "${mkt_id}", requestor_role: "CAREGIVER", chief_complaint: "headache" }
              as: TriageNurse
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP 400 and error_id == ERR_INVALID_REQUEST"

      - name: formulary_entry_requires_valid_parent_contract
        claim_type: Parent Relationships
        grounds:
          - entities.FormularyEntry.fields.payer_contract_id
          - errors.ERR_FK_NOT_FOUND
        distinguishing_aspect: "Formulary entry create under a non-existent payer contract id is a 404 (existence check on path id) — never creates an orphaned entry."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z; no contracts."]
          setup_api_calls:
            - call: "POST /dh/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /dh/payer-contracts/00000000-0000-4000-8000-000000000000/formulary-entries"
              payload: { drug_code: "IVF-NS-1L", max_units_per_visit: 3, requires_physician_preauth: false, unit_price_cents: 3000 }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP 404 and error_id == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: triage_submit_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.TriageAssessment
          - errors.ERR_TRIAGE_NOT_DRAFT
        distinguishing_aspect: "After a triage submission the assessment is in a terminal outcome; a second submit call is rejected with ERR_TRIAGE_NOT_DRAFT."
        test_recipe:
          setup: ["Visit driven to TRIAGED via APPROPRIATE triage."]
          setup_api_calls:
            - call: "POST /dh/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dh/markets"
              payload: { market_code: "DFW-N", display_name: "DFW N", polygon_geojson: "{}", response_window_minutes_urgent: 60, response_window_minutes_standard: 240 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /dh/patients"
              payload: { full_name: "Vic V", date_of_birth: "1980-01-01", payer_code: "AETNA", member_id: "M6000", pcp_name: "Dr. X", pcp_npi: "9999999995", home_address_geo: "{\"type\":\"Point\",\"coordinates\":[-97.0,33.0]}" }
              as: TriageNurse
              captures: { patient_id: $.data.id }
            - call: "POST /dh/visit-requests"
              payload: { patient_id: "${patient_id}", market_id: "${mkt_id}", requestor_role: "PATIENT", chief_complaint: "fever" }
              as: TriageNurse
              captures: { vr_id: $.data.id }
            - call: "POST /dh/visit-requests/${vr_id}/triage-assessments"
              payload: { heart_rate: 100, systolic_bp: 120, spo2_pct: 97, is_chest_pain: false, is_stroke_signs: false, is_severe_trauma: false, is_altered_mental_status: false }
              as: TriageNurse
              captures: { trg_id: $.data.id }
            - call: "POST /dh/triage-assessments/${trg_id}/submit"
              payload: { outcome: "APPROPRIATE" }
              as: TriageNurse
          trigger:
            - call: "POST /dh/triage-assessments/${trg_id}/submit"
              payload: { outcome: "APPROPRIATE" }
              as: TriageNurse
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_TRIAGE_NOT_DRAFT"
            - "TriageAssessment.${trg_id}.outcome == APPROPRIATE (unchanged)"

      - name: dispatch_accept_from_arrived_returns_dispatch_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.DispatchAssignment
          - errors.ERR_DISPATCH_INVALID_STATE
        distinguishing_aspect: "An ARRIVED dispatch cannot be re-accepted; the accept action only fires from OFFERED."
        test_recipe:
          setup: ["Visit driven to ON_SCENE; dispatch is ARRIVED."]
          setup_api_calls:
            - call: "POST /dh/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dh/markets"
              payload: { market_code: "DFW-N", display_name: "DFW N", polygon_geojson: "{}", response_window_minutes_urgent: 60, response_window_minutes_standard: 240 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /dh/patients"
              payload: { full_name: "Wen W", date_of_birth: "1980-01-01", payer_code: "AETNA", member_id: "M7000", pcp_name: "Dr. X", pcp_npi: "9999999996", comorbidity_count: 0, home_address_geo: "{\"type\":\"Point\",\"coordinates\":[-97.0,33.0]}" }
              as: TriageNurse
              captures: { patient_id: $.data.id }
            - call: "POST /dh/care-teams"
              payload: { market_id: "${mkt_id}", app_user_id: "app-W", tech_user_id: "tech-W", supervising_physician_user_id: "md-W", skill_tags: ["POCT"] }
              as: Dispatcher
              captures: { team_id: $.data.id }
            - call: "POST /dh/care-teams/${team_id}/go-available"
              payload: {}
              as: Dispatcher
            - call: "POST /dh/vehicle-shifts"
              payload: { care_team_id: "${team_id}", market_id: "${mkt_id}", vehicle_plate: "TX-W", window_start: "2026-09-15T08:00:00Z", window_end: "2026-09-15T20:00:00Z" }
              as: Dispatcher
              captures: { shift_id: $.data.id }
            - call: "POST /dh/vehicle-shifts/${shift_id}/start"
              payload: {}
              as: Dispatcher
            - call: "POST /dh/visit-requests"
              payload: { patient_id: "${patient_id}", market_id: "${mkt_id}", requestor_role: "PATIENT", chief_complaint: "fever" }
              as: TriageNurse
              captures: { vr_id: $.data.id, vr_v0: $.data.version }
            - call: "POST /dh/visit-requests/${vr_id}/triage-assessments"
              payload: { heart_rate: 130, systolic_bp: 95, spo2_pct: 92, is_chest_pain: false, is_stroke_signs: false, is_severe_trauma: false, is_altered_mental_status: false }
              as: TriageNurse
              captures: { trg_id: $.data.id }
            - call: "POST /dh/triage-assessments/${trg_id}/submit"
              payload: { outcome: "APPROPRIATE" }
              as: TriageNurse
            - call: "POST /dh/visit-requests/${vr_id}/dispatch-offers"
              payload: { expected_visit_request_version: "${vr_v0}" }
              as: Dispatcher
              captures: { da_id: $.data.id }
            - call: "POST /dh/dispatch-assignments/${da_id}/accept"
              payload: {}
              as: CareTeamMember
              as_user_id: "app-W"
            - call: "POST /dh/dispatch-assignments/${da_id}/arrive"
              payload: {}
              as: CareTeamMember
              as_user_id: "app-W"
          trigger:
            - call: "POST /dh/dispatch-assignments/${da_id}/accept"
              payload: {}
              as: CareTeamMember
              as_user_id: "app-W"
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_DISPATCH_INVALID_STATE"
            - "DispatchAssignment.${da_id}.status == ARRIVED (unchanged)"

      - name: terminal_visit_request_blocks_further_transitions
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.VisitRequest
        distinguishing_aspect: "EMS_DIVERTED is terminal; a follow-up dispatch-offer on the diverted visit returns ERR_VR_INVALID_STATE."
        test_recipe:
          setup: ["Visit driven to EMS_DIVERTED via red-flag triage."]
          setup_api_calls:
            - call: "POST /dh/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dh/markets"
              payload: { market_code: "DFW-N", display_name: "DFW N", polygon_geojson: "{}", response_window_minutes_urgent: 60, response_window_minutes_standard: 240 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /dh/patients"
              payload: { full_name: "Xena X", date_of_birth: "1980-01-01", payer_code: "AETNA", member_id: "M8000", pcp_name: "Dr. X", pcp_npi: "9999999997", home_address_geo: "{\"type\":\"Point\",\"coordinates\":[-97.0,33.0]}" }
              as: TriageNurse
              captures: { patient_id: $.data.id }
            - call: "POST /dh/visit-requests"
              payload: { patient_id: "${patient_id}", market_id: "${mkt_id}", requestor_role: "PATIENT", chief_complaint: "crushing chest pain" }
              as: TriageNurse
              captures: { vr_id: $.data.id, vr_v0: $.data.version }
            - call: "POST /dh/visit-requests/${vr_id}/triage-assessments"
              payload: { heart_rate: 130, systolic_bp: 90, spo2_pct: 90, is_chest_pain: true, is_stroke_signs: false, is_severe_trauma: false, is_altered_mental_status: false }
              as: TriageNurse
              captures: { trg_id: $.data.id }
            - call: "POST /dh/triage-assessments/${trg_id}/submit"
              payload: { outcome: "EMERGENCY_DIVERTED" }
              as: TriageNurse
          trigger:
            - call: "POST /dh/visit-requests/${vr_id}/dispatch-offers"
              payload: { expected_visit_request_version: "${vr_v0}" }
              as: Dispatcher
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_VR_INVALID_STATE"
            - "VisitRequest.${vr_id}.status == EMS_DIVERTED (unchanged)"

      - name: encounter_cascade_creates_claim_and_monitoring_checkins
        claim_type: side_effect_execution
        grounds:
          - state_machines.VisitRequest.ON_SCENE_to_DISPOSITIONED
          - state_machines.OnSiteEncounter.DISPOSITION_REVIEW_to_DISCHARGED_HOME
        distinguishing_aspect: "Discharge disposition triggers the full side-effect chain: encounter ends, claim auto-created, two monitoring check-ins scheduled, dispatch completes, care team decrements."
        test_recipe:
          setup: ["Visit driven to DISPOSITION_REVIEW with zero diagnostic orders."]
          setup_api_calls:
            - call: "POST /dh/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dh/markets"
              payload: { market_code: "DFW-N", display_name: "DFW N", polygon_geojson: "{}", response_window_minutes_urgent: 60, response_window_minutes_standard: 240 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /dh/payer-contracts"
              payload: { payer_code: "AETNA", market_id: "${mkt_id}", urgent_base_rate_cents: 40000, standard_base_rate_cents: 25000, place_of_service_modifier_pct: 0.85, max_claim_cents: 1000000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /dh/payer-contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /dh/patients"
              payload: { full_name: "Yara Y", date_of_birth: "1980-01-01", payer_code: "AETNA", member_id: "M9000", pcp_name: "Dr. X", pcp_npi: "9999999998", comorbidity_count: 1, home_address_geo: "{\"type\":\"Point\",\"coordinates\":[-97.0,33.0]}" }
              as: TriageNurse
              captures: { patient_id: $.data.id }
            - call: "POST /dh/care-teams"
              payload: { market_id: "${mkt_id}", app_user_id: "app-Y", tech_user_id: "tech-Y", supervising_physician_user_id: "md-Y", skill_tags: ["POCT"] }
              as: Dispatcher
              captures: { team_id: $.data.id }
            - call: "POST /dh/care-teams/${team_id}/go-available"
              payload: {}
