          assert:
            - "Loan.${loan_id}.status == CHARGED_OFF and days_delinquent == 120"
            - "SecuritizationPool.${pool_id}.allocated_principal_cents == 0 — the 5000000 added at placement is exactly subtracted by the compensating charge-off"
            - "SecuritizationPool.${pool_id}.status == OPEN and target_principal_cents == 100000000 (unchanged)"
            - "a ServicingEvent CHARGE_OFF_REPORTED exists with amount_cents == outstanding_principal_cents + late_fee_accrued_cents at charge-off time"

      - name: partner_funded_balance_conserved_across_payoff
        grounds:
          - state_machines.Loan.CURRENT_to_PAID_OFF
          - entities.Partner.fields.funded_balance_cents
        distinguishing_aspect: |
          Conserved quantity (different from the pool case): Partner
          funded_balance_cents equals the sum of principal over held loans in
          CURRENT/DELINQUENT/CHARGED_OFF. Funding adds principal; the compensating
          full payoff moves the loan to PAID_OFF — a status outside the counted set —
          so funded_balance_cents returns to exactly 0, while outstanding_principal
          and the loan's own version reflect the payment waterfall having run.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Model ACTIVE (bureau-only; bureau 575 -> score 50)."
            - "Bank B ACTIVE, box TX, score [0,1000], amounts [100000,10000000], APR 12.0, cap 10."
