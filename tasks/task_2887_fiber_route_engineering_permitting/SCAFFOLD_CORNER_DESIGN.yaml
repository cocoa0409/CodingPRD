  # ===========================================================================
  # 2 — state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: walkout_submit_moves_open_to_submitted
        claim_type: Valid Transition
        grounds:
          - state_machines.FieldWalkout.transitions.OPEN_to_SUBMITTED
          - endpoints[POST /walkouts/{id}/submit]
        distinguishing_aspect: "POST /walkouts/{id}/submit on an OPEN walkout carrying one PoleObservation returns 200 with status SUBMITTED, review_round still 0 and the segment still engineering_status DRAFT."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route in PLANNING with one RouteSegment (400 feet, URBAN_PAVED)"
            - "one OPEN FieldWalkout on that segment with one grade-B PoleObservation"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Dock Street", municipality_code: "MUN-014", length_feet: 400, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-20" }
              as: RouteEngineer
              captures: { seg_id: $.data.id }
            - call: "POST /walkouts"
              payload: { segment_id: "${seg_id}", walked_on: "2026-08-11", obstruction_count: 1, conduit_available_confirmed: true, surveyor_note: "one obstruction at the culvert" }
              as: FieldSurveyor
              captures: { wo_id: $.data.id, wo_version: $.data.version }
            - call: "POST /pole-observations"
              payload: { walkout_id: "${wo_id}", pole_tag: "P-001", pole_owner: "TELCO", condition_grade: "B", available_vertical_clearance_in: 45, existing_attachment_count: 2 }
              as: FieldSurveyor
          trigger:
            - call: "POST /walkouts/${wo_id}/submit"
              payload: {}
              as: FieldSurveyor
          assert:
            - "response HTTP status is 200 and FieldWalkout.${wo_id}.status == SUBMITTED"
            - "FieldWalkout.${wo_id}.review_round == 0 and reviewed_by_user_id == null and rejection_reason == null"
            - "FieldWalkout.${wo_id}.worst_pole_condition_grade == B and make_ready_flagged_pole_count == 0"
            - "RouteSegment.${seg_id}.engineering_status == DRAFT and accepted_obstruction_count == 0, because only review with ACCEPTED advances the segment"
            - "FieldWalkout.${wo_id}.version == ${wo_version} + 1"

      - name: walkout_review_on_an_open_walkout_returns_invalid_walkout_state
        claim_type: Invalid Transitions
        grounds:
          - validations[priority=11]
          - errors[ERR_INVALID_WALKOUT_STATE]
          - state_machines.FieldWalkout.transitions.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: "Review is only defined from SUBMITTED: reviewing a walkout still OPEN returns 409 ERR_INVALID_WALKOUT_STATE and does not advance the segment to WALKED."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route in PLANNING with one RouteSegment (400 feet, URBAN_PAVED)"
            - "one OPEN FieldWalkout on that segment with one grade-B PoleObservation; it has NOT been submitted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Dock Street", municipality_code: "MUN-014", length_feet: 400, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-20" }
              as: RouteEngineer
              captures: { seg_id: $.data.id }
