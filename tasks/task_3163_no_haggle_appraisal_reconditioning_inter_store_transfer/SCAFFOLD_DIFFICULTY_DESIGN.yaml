# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3163_no_haggle_appraisal_reconditioning_inter_store_transfer
#
# Depth probe: 9 Difficulty Rules x 2 instances = 18 instances.
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 and is replayable from
# empty-DB via the structured setup_api_calls chains below.
#
# Shared setup vocabulary used across instances (each instance spells its own
# chain out in full; this comment is documentation only):
#   S_PHX  : Store PHX-01, region WEST, retail_threshold_pct 0.20
#   S_DAL  : Store DAL-01, region CENTRAL   (adjacent band to WEST)
#   S_MIA  : Store MIA-01, region EAST      (cross-country band from WEST)
#   CUST1  : CustomerAccount, credit 720, income 9,000,000
#   MGR1   : Associate role_kind MANAGER at S_PHX (acts as StoreManager)
#   MGR2   : Associate role_kind MANAGER at S_DAL
#   AP1    : Associate role_kind APPRAISER at S_PHX
#   IN1    : Associate role_kind INSPECTOR at S_PHX
#   SA1    : Associate role_kind SALES at S_PHX
#   FM1    : Associate role_kind FINANCE at S_PHX
#   V_A    : Vehicle VIN "VINAAAAAAAAAAAAAAAA" — book 2,000,000, year 2022,
#            odo 30,000 -> provisional offer 1,680,000; inspection lines
#            100,000 + 50,000 approved -> est 150,000 -> RETAIL grade B,
#            final offer 1,605,000, initial list price 1,797,600
#   V_B    : Vehicle VIN "VINBBBBBBBBBBBBBBBB" — book 800,000, year 2020,
#            odo 95,000 -> provisional = final = 285,500, grade A
#   V_C    : Vehicle VIN "VINCCCCCCCCCCCCCCCCC" — book 1,000,000, year 2018,
#            odo 140,000 -> provisional 294,000; est 100,000 > threshold
#            58,800 -> WHOLESALE; reserves 900,000 / 810,000 / 729,000
#   Clock  : default 2026-09-01T00:00:00Z; current_year 2026
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: appraisal_provisional_vs_final_offer_diverge
        grounds:
          - calculations.appraisal_offer_value
          - entities.Appraisal.fields.provisional_offer_cents
          - entities.Appraisal.fields.final_offer_cents
          - state_machines.Appraisal.PENDING_INSPECTION_to_ACTIVE
        distinguishing_aspect: "Entity domain Appraisal: identical book/age/mileage inputs yield provisional_offer_cents 1,680,000 at creation but final_offer_cents 1,605,000 after the inspection closes, the 75,000 delta being exactly half the 150,000 estimated repair total."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Store PHX (WEST, threshold 0.20). AP1 (APPRAISER), IN1 (INSPECTOR). CUST1. V_A INTAKE at PHX."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/stores"
              payload: { store_code: "PHX-01", display_name: "Phoenix", region: "WEST" }
              as: PlatformAdmin
              captures: { s_phx: $.data.id }
            - call: "POST /v1/customers"
              payload: { full_name: "Customer One", email: "c1@x.com", credit_score: 720, stated_annual_income_cents: 9000000 }
              as: PlatformAdmin
              captures: { cust1: $.data.id }
            - call: "POST /v1/associates"
              payload: { display_name: "Appraiser One", store_id: "${s_phx}", role_kind: "APPRAISER" }
              as: PlatformAdmin
              captures: { ap1: $.data.id }
            - call: "POST /v1/associates"
              payload: { display_name: "Inspector One", store_id: "${s_phx}", role_kind: "INSPECTOR" }
              as: PlatformAdmin
              captures: { in1: $.data.id }
            - call: "POST /v1/associates"
              payload: { display_name: "Manager One", store_id: "${s_phx}", role_kind: "MANAGER" }
              as: PlatformAdmin
              captures: { mgr1: $.data.id }
            - call: "POST /v1/vehicles"
              payload: { vin: "VINAAAAAAAAAAAAAAAA", make: "Honda", model: "Accord", model_year: 2022, odometer_miles: 30000, book_value_cents: 2000000, current_store_id: "${s_phx}" }
              as: StoreManager
              as_user_id: "${mgr1}"
              captures: { veh_a: $.data.id }
            - call: "POST /v1/appraisals"
              payload: { vehicle_id: "${veh_a}", customer_id: "${cust1}", appraiser_id: "${ap1}" }
              as: Appraiser
              as_user_id: "${ap1}"
              captures: { appr_a: $.data.id }
          trigger:
            - call: "POST /v1/vehicles/${veh_a}/inspections"
              payload: { inspector_id: "${in1}" }
              as: ReconditioningInspector
              as_user_id: "${in1}"
              captures: { insp_a: $.data.id }
            - call: "POST /v1/inspections/${insp_a}/line-items"
              payload: { category: "MECHANICAL", cost_cents: 100000 }
              as: ReconditioningInspector
              as_user_id: "${in1}"
              captures: { li_a1: $.data.id }
            - call: "POST /v1/inspections/${insp_a}/line-items"
              payload: { category: "BODY", cost_cents: 50000 }
              as: ReconditioningInspector
              as_user_id: "${in1}"
              captures: { li_a2: $.data.id }
            - call: "POST /v1/inspections/${insp_a}/line-items/${li_a1}/approve"
              payload: {}
              as: ReconditioningInspector
              as_user_id: "${in1}"
            - call: "POST /v1/inspections/${insp_a}/line-items/${li_a2}/approve"
              payload: {}
              as: ReconditioningInspector
              as_user_id: "${in1}"
            - call: "POST /v1/inspections/${insp_a}/complete"
              payload: {}
              as: ReconditioningInspector
              as_user_id: "${in1}"
            - call: "GET /v1/appraisals/${appr_a}"
              payload: {}
              as: Appraiser
              as_user_id: "${ap1}"
          assert:
            - "Appraisal.${appr_a}.provisional_offer_cents == 1680000"
            - "Appraisal.${appr_a}.final_offer_cents == 1605000"
            - "Appraisal.${appr_a}.final_offer_cents == Appraisal.${appr_a}.provisional_offer_cents - 75000"
            - "Appraisal.${appr_a}.status == ACTIVE"
            - "Appraisal.${appr_a}.valid_until == \"2026-09-08T00:00:00Z\""

      - name: auction_reserve_standard_vs_relist_diverge
        grounds:
          - calculations.auction_reserve_price
          - state_machines.AuctionLot.LISTED_to_UNSOLD
          - state_machines.AuctionLot.UNSOLD_to_LISTED
        distinguishing_aspect: "Entity domain AuctionLot: the same vehicle's round-1 reserve is 900,000 (book-value formula 85% x 1,000,000 + 50% x 100,000 recon recovery) while the round-2 relist reserve is 810,000 (90% decay of the prior reserve), a 90,000 divergence from two valid algorithms over the same vehicle."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. V_C at PHX: book 1,000,000, year 2018, odo 140,000; inspection est 100,000 exceeds threshold 58,800 -> WHOLESALE; vehicle WHOLESALE_PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/stores"
              payload: { store_code: "PHX-01", display_name: "Phoenix", region: "WEST" }
              as: PlatformAdmin
              captures: { s_phx: $.data.id }
            - call: "POST /v1/customers"
              payload: { full_name: "Customer One", email: "c1@x.com", credit_score: 720, stated_annual_income_cents: 9000000 }
              as: PlatformAdmin
              captures: { cust1: $.data.id }
            - call: "POST /v1/associates"
              payload: { display_name: "Appraiser One", store_id: "${s_phx}", role_kind: "APPRAISER" }
              as: PlatformAdmin
              captures: { ap1: $.data.id }
            - call: "POST /v1/associates"
              payload: { display_name: "Inspector One", store_id: "${s_phx}", role_kind: "INSPECTOR" }
              as: PlatformAdmin
              captures: { in1: $.data.id }
            - call: "POST /v1/associates"
              payload: { display_name: "Manager One", store_id: "${s_phx}", role_kind: "MANAGER" }
              as: PlatformAdmin
              captures: { mgr1: $.data.id }
            - call: "POST /v1/vehicles"
              payload: { vin: "VINCCCCCCCCCCCCCCCCC", make: "Ford", model: "F-150", model_year: 2018, odometer_miles: 140000, book_value_cents: 1000000, current_store_id: "${s_phx}" }
              as: StoreManager
              as_user_id: "${mgr1}"
              captures: { veh_c: $.data.id }
            - call: "POST /v1/appraisals"
              payload: { vehicle_id: "${veh_c}", customer_id: "${cust1}", appraiser_id: "${ap1}" }
              as: Appraiser
              as_user_id: "${ap1}"
            - call: "POST /v1/vehicles/${veh_c}/inspections"
              payload: { inspector_id: "${in1}" }
              as: ReconditioningInspector
              as_user_id: "${in1}"
              captures: { insp_c: $.data.id }
            - call: "POST /v1/inspections/${insp_c}/line-items"
              payload: { category: "SAFETY", cost_cents: 100000 }
              as: ReconditioningInspector
              as_user_id: "${in1}"
              captures: { li_c1: $.data.id }
            - call: "POST /v1/inspections/${insp_c}/line-items/${li_c1}/approve"
              payload: {}
              as: ReconditioningInspector
              as_user_id: "${in1}"
            - call: "POST /v1/inspections/${insp_c}/complete"
              payload: {}
              as: ReconditioningInspector
              as_user_id: "${in1}"
          trigger:
            - call: "POST /v1/auction-lots"
              payload: { vehicle_id: "${veh_c}" }
              as: AuctionManager
              captures: { lot1: $.data.id }
            - call: "POST /v1/auction-lots/${lot1}/close"
              payload: { hammer_price_cents: 800000 }
              as: AuctionManager
            - call: "POST /v1/auction-lots"
              payload: { vehicle_id: "${veh_c}" }
              as: AuctionManager
              captures: { lot2: $.data.id }
          assert:
            - "AuctionLot.${lot1}.reserve_price_cents == 900000"
            - "AuctionLot.${lot1}.status == UNSOLD (hammer 800000 < reserve 900000)"
            - "AuctionLot.${lot2}.reserve_price_cents == 810000"
            - "AuctionLot.${lot2}.auction_round == 2"
            - "AuctionLot.${lot1}.reserve_price_cents - AuctionLot.${lot2}.reserve_price_cents == 90000"
            - "Vehicle.${veh_c}.lifecycle_status == AT_AUCTION"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: repricing_per_event_rounding_composes
        grounds:
          - calculations.algorithmic_repricing
          - entities.PricingEvent
        distinguishing_aspect: "Mode (b) nested rounding: three sequential markdown events each re-round from the current price (1,797,600 -> 1,743,672 -> 1,656,488 -> floored to 1,605,000), which differs from a single cumulative 1,797,600 x 0.97 x 0.95 x 0.92 computation (1,523,967 unrounded-then-floored path disagrees on intermediate cents)."
        test_recipe:
          setup:
            - "Clock 2026-09-01. V_A fully retail-listed at PHX with list price 1,797,600 (book 2,000,000, year 2022, odo 30,000, est repairs 150,000, final offer 1,605,000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/stores"
              payload: { store_code: "PHX-01", display_name: "Phoenix", region: "WEST" }
              as: PlatformAdmin
              captures: { s_phx: $.data.id }
            - call: "POST /v1/customers"
              payload: { full_name: "Customer One", email: "c1@x.com", credit_score: 720, stated_annual_income_cents: 9000000 }
              as: PlatformAdmin
              captures: { cust1: $.data.id }
            - call: "POST /v1/associates"
              payload: { display_name: "Appraiser One", store_id: "${s_phx}", role_kind: "APPRAISER" }
              as: PlatformAdmin
              captures: { ap1: $.data.id }
            - call: "POST /v1/associates"
              payload: { display_name: "Inspector One", store_id: "${s_phx}", role_kind: "INSPECTOR" }
              as: PlatformAdmin
              captures: { in1: $.data.id }
            - call: "POST /v1/associates"
              payload: { display_name: "Manager One", store_id: "${s_phx}", role_kind: "MANAGER" }
              as: PlatformAdmin
              captures: { mgr1: $.data.id }
            - call: "POST /v1/vehicles"
              payload: { vin: "VINAAAAAAAAAAAAAAAA", make: "Honda", model: "Accord", model_year: 2022, odometer_miles: 30000, book_value_cents: 2000000, current_store_id: "${s_phx}" }
              as: StoreManager
              as_user_id: "${mgr1}"
              captures: { veh_a: $.data.id }
            - call: "POST /v1/appraisals"
              payload: { vehicle_id: "${veh_a}", customer_id: "${cust1}", appraiser_id: "${ap1}" }
              as: Appraiser
              as_user_id: "${ap1}"
            - call: "POST /v1/vehicles/${veh_a}/inspections"
              payload: { inspector_id: "${in1}" }
              as: ReconditioningInspector
              as_user_id: "${in1}"
              captures: { insp_a: $.data.id }
            - call: "POST /v1/inspections/${insp_a}/line-items"
              payload: { category: "MECHANICAL", cost_cents: 100000 }
              as: ReconditioningInspector
              as_user_id: "${in1}"
              captures: { li_a1: $.data.id }
            - call: "POST /v1/inspections/${insp_a}/line-items"
              payload: { category: "BODY", cost_cents: 50000 }
              as: ReconditioningInspector
              as_user_id: "${in1}"
              captures: { li_a2: $.data.id }
            - call: "POST /v1/inspections/${insp_a}/line-items/${li_a1}/approve"
              payload: {}
              as: ReconditioningInspector
              as_user_id: "${in1}"
            - call: "POST /v1/inspections/${insp_a}/line-items/${li_a2}/approve"
              payload: {}
              as: ReconditioningInspector
              as_user_id: "${in1}"
            - call: "POST /v1/inspections/${insp_a}/complete"
              payload: {}
              as: ReconditioningInspector
              as_user_id: "${in1}"
            - call: "POST /v1/vehicles/${veh_a}/list"
              payload: {}
              as: StoreManager
              as_user_id: "${mgr1}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /v1/vehicles/${veh_a}"
              payload: {}
              as: StoreManager
              as_user_id: "${mgr1}"
              captures: { v_a_ver1: $.data.version }
            - call: "POST /v1/vehicles/${veh_a}/pricing-events"
              payload: { expected_vehicle_version: "${v_a_ver1}" }
              as: StoreManager
              as_user_id: "${mgr1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /v1/vehicles/${veh_a}"
              payload: {}
              as: StoreManager
              as_user_id: "${mgr1}"
              captures: { v_a_ver2: $.data.version }
            - call: "POST /v1/vehicles/${veh_a}/pricing-events"
              payload: { expected_vehicle_version: "${v_a_ver2}" }
              as: StoreManager
              as_user_id: "${mgr1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /v1/vehicles/${veh_a}"
              payload: {}
              as: StoreManager
              as_user_id: "${mgr1}"
              captures: { v_a_ver3: $.data.version }
            - call: "POST /v1/vehicles/${veh_a}/pricing-events"
              payload: { expected_vehicle_version: "${v_a_ver3}" }
              as: StoreManager
              as_user_id: "${mgr1}"
              captures: { pe3: $.data.new_price_cents }
            - call: "GET /v1/vehicles/${veh_a}/pricing-events"
              payload: {}
              as: StoreManager
              as_user_id: "${mgr1}"
          assert:
            - "pricing events after the INITIAL_LISTING are new_price_cents 1743672, 1656488, 1605000 in chronological order"
            - "PricingEvent[1].days_in_inventory_at_event == 30 and trigger_kind == SCHEDULED_MARKDOWN"
            - "PricingEvent[2].days_in_inventory_at_event == 45"
            - "PricingEvent[3].days_in_inventory_at_event == 60"
            - "third event new_price_cents == 1605000 (floor at Appraisal final_offer_cents; unfloored value would be 1523969)"
            - "Vehicle.${veh_a}.current_list_price_cents == 1605000"

      - name: transfer_fee_lane_band_expedite_surcharge
        grounds:
          - calculations.transfer_shipping_fee
          - entities.TransferRequest.fields.shipping_fee_cents
        distinguishing_aspect: "Mode (a) combinatorial formula: fee selects a 3-way lane band by region pair, conditionally multiplies by 1.5 for expedited, and conditionally adds a 20,000 surcharge for model_year >= 2025 — expedited cross-country 2025 vehicle prices at 155,000 while the same lane non-expedited prices at 110,000."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Stores PHX (WEST) and MIA (EAST). A RETAIL_LISTED 2025 vehicle (book 2,000,000, odo 5,000, no repair lines -> grade A) at PHX, list price computed from final offer 1,920,000 -> list 2,150,400."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/stores"
              payload: { store_code: "PHX-01", display_name: "Phoenix", region: "WEST" }
              as: PlatformAdmin
              captures: { s_phx: $.data.id }
            - call: "POST /v1/stores"
              payload: { store_code: "MIA-01", display_name: "Miami", region: "EAST" }
              as: PlatformAdmin
              captures: { s_mia: $.data.id }
            - call: "POST /v1/customers"
              payload: { full_name: "Customer One", email: "c1@x.com", credit_score: 720, stated_annual_income_cents: 9000000 }
              as: PlatformAdmin
              captures: { cust1: $.data.id }
            - call: "POST /v1/customers"
              payload: { full_name: "Customer Two", email: "c2@x.com", credit_score: 700, stated_annual_income_cents: 8000000 }
              as: PlatformAdmin
              captures: { cust2: $.data.id }
            - call: "POST /v1/associates"
              payload: { display_name: "Appraiser One", store_id: "${s_phx}", role_kind: "APPRAISER" }
              as: PlatformAdmin
              captures: { ap1: $.data.id }
            - call: "POST /v1/associates"
              payload: { display_name: "Inspector One", store_id: "${s_phx}", role_kind: "INSPECTOR" }
              as: PlatformAdmin
              captures: { in1: $.data.id }
            - call: "POST /v1/associates"
              payload: { display_name: "Manager One", store_id: "${s_phx}", role_kind: "MANAGER" }
              as: PlatformAdmin
              captures: { mgr1: $.data.id }
            - call: "POST /v1/vehicles"
              payload: { vin: "VINDDDDDDDDDDDDDDDD", make: "Tesla", model: "Model 3", model_year: 2025, odometer_miles: 5000, book_value_cents: 2000000, current_store_id: "${s_phx}" }
              as: StoreManager
              as_user_id: "${mgr1}"
              captures: { veh_d: $.data.id }
            - call: "POST /v1/appraisals"
              payload: { vehicle_id: "${veh_d}", customer_id: "${cust1}", appraiser_id: "${ap1}" }
              as: Appraiser
              as_user_id: "${ap1}"
            - call: "POST /v1/vehicles/${veh_d}/inspections"
              payload: { inspector_id: "${in1}" }
              as: ReconditioningInspector
              as_user_id: "${in1}"
              captures: { insp_d: $.data.id }
            - call: "POST /v1/inspections/${insp_d}/complete"
              payload: {}
              as: ReconditioningInspector
              as_user_id: "${in1}"
            - call: "POST /v1/vehicles/${veh_d}/list"
              payload: {}
              as: StoreManager
              as_user_id: "${mgr1}"
          trigger:
            - call: "GET /v1/vehicles/${veh_d}"
              payload: {}
              as: StoreManager
              as_user_id: "${mgr1}"
              captures: { veh_d_v: $.data.version }
            - call: "POST /v1/transfer-requests"
              payload: { vehicle_id: "${veh_d}", customer_id: "${cust2}", to_store_id: "${s_mia}", expedited: true, expected_vehicle_version: "${veh_d_v}" }
              as: Customer
              as_user_id: "${cust2}"
              captures: { tr_d: $.data.id }
          assert:
            - "TransferRequest.${tr_d}.shipping_fee_cents == 155000"
            - "TransferRequest.${tr_d}.status == REQUESTED"
            - "TransferRequest.${tr_d}.from_store_id == ${s_phx}"
            - "Vehicle.${veh_d}.hold_status == TRANSFER_HOLD"

      - name: return_waterfall_pinned_evaluation_order
        grounds:
          - calculations.return_reversal_waterfall
          - state_machines.ReturnRequest.APPROVED_to_SETTLED
        distinguishing_aspect: "Mode (c) pinned evaluation order: mileage deduction (20,000) is subtracted from gross_refund BEFORE the lender-reversal bucket is capped, so a financed 1,512,100 due yields refund_total 1,492,100 routed entirely to LENDER_REVERSAL with REFUND_PAYABLE 0 and an independent COMMISSION_CLAWBACK of -25,000."
        test_recipe:
          setup:
            - "Clock 2026-09-01. V_A RETAIL_LISTED at 1,797,600. CUST1 trade-in V_B with ACTIVE appraisal final offer 285,500. Sale completed 2026-09-01 with financing ACCEPTED (amount_due 1,512,100). Return opened with odometer 30,800 (400 miles over cap -> 20,000 deduction)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/stores"
              payload: { store_code: "PHX-01", display_name: "Phoenix", region: "WEST" }
              as: PlatformAdmin
              captures: { s_phx: $.data.id }
            - call: "POST /v1/customers"
              payload: { full_name: "Customer One", email: "c1@x.com", credit_score: 720, stated_annual_income_cents: 9000000 }
              as: PlatformAdmin
              captures: { cust1: $.data.id }
            - call: "POST /v1/associates"
              payload: { display_name: "Appraiser One", store_id: "${s_phx}", role_kind: "APPRAISER" }
              as: PlatformAdmin
              captures: { ap1: $.data.id }
            - call: "POST /v1/associates"
              payload: { display_name: "Inspector One", store_id: "${s_phx}", role_kind: "INSPECTOR" }
              as: PlatformAdmin
              captures: { in1: $.data.id }
            - call: "POST /v1/associates"
              payload: { display_name: "Manager One", store_id: "${s_phx}", role_kind: "MANAGER" }
              as: PlatformAdmin
              captures: { mgr1: $.data.id }
            - call: "POST /v1/associates"
              payload: { display_name: "Sales One", store_id: "${s_phx}", role_kind: "SALES" }
              as: PlatformAdmin
              captures: { sa1: $.data.id }
            - call: "POST /v1/associates"
              payload: { display_name: "Finance One", store_id: "${s_phx}", role_kind: "FINANCE" }
              as: PlatformAdmin
              captures: { fm1: $.data.id }
