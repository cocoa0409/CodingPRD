            - { call: "POST /grain/temperature-readings", payload: { bin_id: "${bin_pp}", recorded_at: "2026-08-05T10:00:00Z", ambient_temp_f: 60.0, cable_temps_f: [90.0], insect_activity: false }, as: SiteManager }
