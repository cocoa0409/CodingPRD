            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_id}", driver_id: "${driver_id}", vehicle_plate: "PLT-15B", axle_count: 5, gross_weight_lbs: 86000, heaviest_axle_lbs: 21000, hazmat_placarded: false }, as: Screener, captures: { screening_b_id: "$.data.id" } }
            - { call: "POST /inspections", payload: { screening_id: "${screening_b_id}", bay_id: "${bay_id}", level: "LEVEL_I", scheduled_start: "2026-03-02T11:00:00Z", scheduled_end: "2026-03-02T12:00:00Z" }, as: Inspector, captures: { inspection_b_id: "$.data.id" } }
            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_id}", driver_id: "${driver_id}", vehicle_plate: "PLT-15C", axle_count: 5, gross_weight_lbs: 86000, heaviest_axle_lbs: 21000, hazmat_placarded: false }, as: Screener, captures: { screening_c_id: "$.data.id" } }
