  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: schedule_slot_overlap_with_min_gap_buffer
        grounds:
          - validations[priority=11]
          - entities.Channel.fields.min_publish_gap_minutes
          - entities.ScheduleSlot.fields.slot_start_utc
          - entities.ScheduleSlot.fields.duration_minutes
        distinguishing_aspect: |
          Channel interval semantics with a min_publish_gap_minutes BUFFER: a slot at
          09:30 (after a [09:00,09:15) slot) is rejected because the 30-minute gap buffer
          requires the next start >= 09:45; the buffer extends beyond the half-open window.
        test_recipe:
          setup:
            - "ACTIVE client, LIVE channel min_publish_gap_minutes=30, with one RESERVED ScheduleSlot at 2026-03-10T09:00Z duration 15 (a SCHEDULED ContentItem)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "GapCo", account_manager_id: "am-1" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /retainer-packages"
              payload: { client_id: "${cid}", tier: "GROWTH", monthly_retainer_fee_cents: 300000, monthly_boost_budget_cents: 0, monthly_post_quota: 10, included_channels: 1 }
              as: AccountManager
              captures: { pkg: $.data.id }
            - call: "POST /retainer-packages/${pkg}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /channels"
              payload: { client_id: "${cid}", platform: "FACEBOOK", handle: "@gapco", min_publish_gap_minutes: 30 }
              as: AccountManager
              captures: { ch: $.data.id }
            - call: "POST /channels/${ch}/connect"
              payload: {}
              as: AccountManager
            - call: "POST /channels/${ch}/go-live"
              payload: {}
              as: AccountManager
            - call: "POST /clients/${cid}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /content-items"
              payload: { client_id: "${cid}", author_id: "cc-1", title: "G1", body: "b" }
              as: ContentCreator
              captures: { ci1: $.data.id }
            - call: "POST /content-targets"
              payload: { content_item_id: "${ci1}", channel_id: "${ch}" }
              as: ContentCreator
            - call: "POST /content-items/${ci1}/submit"
              payload: {}
              as: ContentCreator
            - call: "POST /content-items/${ci1}/approve"
              payload: {}
              as: Approver
            - call: "POST /content-items/${ci1}/schedule"
              payload: { channel_id: "${ch}", slot_start_utc: "2026-03-10T09:00:00Z", duration_minutes: 15 }
              as: AccountManager
            - call: "POST /content-items"
              payload: { client_id: "${cid}", author_id: "cc-1", title: "G2", body: "b" }
              as: ContentCreator
              captures: { ci2: $.data.id }
            - call: "POST /content-targets"
              payload: { content_item_id: "${ci2}", channel_id: "${ch}" }
              as: ContentCreator
            - call: "POST /content-items/${ci2}/submit"
              payload: {}
              as: ContentCreator
            - call: "POST /content-items/${ci2}/approve"
              payload: {}
              as: Approver
          trigger:
            - call: "POST /content-items/${ci2}/schedule"
              payload: { channel_id: "${ch}", slot_start_utc: "2026-03-10T09:30:00Z", duration_minutes: 15 }
              as: AccountManager
              captures: { err: $.data.error_id }
            - call: "POST /content-items/${ci2}/schedule"
              payload: { channel_id: "${ch}", slot_start_utc: "2026-03-10T09:45:00Z", duration_minutes: 15 }
              as: AccountManager
              captures: { st: $.data.status }
          assert:
            - "Schedule at 09:30 (gap 15min < 30min buffer) returns HTTP 409 error_id == ERR_SLOT_OVERLAP"
            - "Schedule at 09:45 (gap exactly 30min) succeeds; ContentItem.${ci2}.status == SCHEDULED"

      - name: boost_daily_cap_capacity_window_overlap
        grounds:
          - validations[priority=12]
          - entities.BoostCampaign.fields.daily_cap_cents
          - calculations.boost_pacing_status
        distinguishing_aspect: |
          Different resource (BoostCampaign daily budget capacity) and different interval
          semantics (an aggregate per-day CAPACITY window, not a time-geometry overlap):
          two same-day spends 30000+30000 against daily_cap 50000 collide because their
          aggregate (60000) exceeds the day's capacity, distinct from slot adjacency arithmetic.
        test_recipe:
          setup:
            - "RUNNING BoostCampaign reserved=200000, daily_cap_cents=50000, with 30000 already spent into the day-0 bucket (one record-spend of 30000 at spend_day_index 0)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "DayCapCo", account_manager_id: "am-1" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /retainer-packages"
              payload: { client_id: "${cid}", tier: "SCALE", monthly_retainer_fee_cents: 400000, monthly_boost_budget_cents: 1000000, monthly_post_quota: 10, included_channels: 1 }
              as: AccountManager
