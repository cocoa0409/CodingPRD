      - name: work_order_completion_bubbles_the_project_to_rent_ready
        claim_type: bubble_up
        grounds:
          - state_machines.RenovationProject.IN_PROGRESS_to_RENT_READY
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
        excluded_because:
          difficulty_instance: work_order_completion_cascades_four_hops_to_slot_unblock_and_realized_yield
          rationale: |
            The bubble-up claim (last non-terminal work order COMPLETED -> project RENT_READY) is the
            first hop of that difficulty instance's four-hop chain, which additionally asserts the
            home leaving RENOVATING, the BLOCKED_BY_POSTURE slots returning to AVAILABLE and the
            realized yield rewrite. A standalone corner test would re-run the identical setup and
            assert a strict subset of its assertions.

      - name: home_asset_and_occupancy_dimensions_are_independent
        claim_type: parallel
        grounds:
          - state_machines.Home.asset_status
          - state_machines.Home.occupancy_status
        excluded_because:
          difficulty_instance: home_asset_and_occupancy_dimensions_advance_independently
          rationale: |
            That difficulty instance is exactly this claim at full strength: it drives the two Home
            dimensions through PIPELINE/ACQUIRED/RENOVATING/STABILIZED against VACANT/RESERVED/
            OCCUPIED and asserts the combined state plus the posture that depends only on the asset
            dimension. Duplicating it as a corner case adds no independent signal.

      - name: lease_execute_is_guarded_by_home_posture
        claim_type: guarded_transitions
        grounds:
          - state_machines.Lease.DRAFT_to_EXECUTED
          - validations[V502]
        excluded_because:
          difficulty_instance: lease_execution_requires_home_posture_open_not_restricted
          rationale: |
            The cross-entity guard "DRAFT -> EXECUTED only if the home's posture is exactly OPEN" is
            the whole subject of that difficulty instance, which walks the same lease through
            RESTRICTED (refused) and OPEN (accepted) on one fixture. A corner variant would only
            re-assert the refusal half.

      - name: work_order_void_is_a_clean_compensation
        claim_type: compensation
        grounds:
          - state_machines.WorkOrder.PENDING_DISPATCH_to_VOIDED
          - state_machines.RenovationProject.committed_cost_cents
        excluded_because:
          difficulty_instance: work_order_void_restores_project_budget_ledger_exactly
          rationale: |
            Reversal-without-drift on committed_cost_cents and budget_remaining_cents is measured
            there to the cent, including the follow-up create that succeeds only if the reversal was
            exact. A corner-level compensation test would assert the same two numbers.

      - name: lease_void_frees_the_home_for_a_new_applicant
        claim_type: cross_entity
        grounds:
          - state_machines.Lease.DRAFT_to_VOIDED
          - state_machines.Home.occupancy_status.RESERVED_to_VACANT
        excluded_because:
          difficulty_instance: lease_void_returns_home_occupancy_to_vacant_for_reuse
          rationale: |
            That instance already proves the void cascade by consuming its effect - a second prospect
            successfully screens on the freed home - which strictly dominates asserting
            occupancy_status == VACANT on its own.

      - name: underwriting_revision_loop_terminates
        claim_type: cyclic
        grounds:
          - state_machines.UnderwritingCase.SUBMITTED_to_REVISION_REQUESTED
          - validations[V356]
        excluded_because:
          difficulty_instance: underwriting_case_revision_cycle_bounded_at_two_rounds
          rationale: |
            The loop-termination condition (revision_round reaching 2 turns the third
            REQUEST_REVISION into ERR_REVISION_LIMIT_EXCEEDED) is the entire point of that difficulty
            instance, which also asserts the counter after each pass. A corner test cannot show the
            bound without reproducing it.

      - name: tax_appeal_acceptance_cascade
        claim_type: cascade_down
        grounds:
          - state_machines.ComplianceObligation.RESOLUTION_SUBMITTED_to_RESOLVED
          - calculations.tax_appeal_savings
        excluded_because:
          difficulty_instance: tax_appeal_acceptance_cascades_four_hops_to_disposition_flag
          rationale: |
            Accepting a PROPERTY_TAX_APPEAL resolution rewrites the obligation money group, the
            home's assessed value, the case's realized yield and finally disposition_flagged; that
            difficulty instance asserts all four hops with pre-computed literals, so a corner
            cascade_down test would be a truncated copy.

