      - name: earned_premium_reconciles_on_every_read
        claim_type: derived_field_reconciliation
        grounds: [calculations.earned_premium_reconciliation]
        distinguishing_aspect: "GET policy recomputes earned_premium_cents against the current clock: with base 90155 (daily exactly 247) and a downgrade-to-zero endorsement at day 273, the read at day 303 returns exactly 7410 = 30*247 + 30*0."
        test_recipe:
          setup: ["CC_I policy bound with exposure 730 (tier 1.30; base = round_half_up(100*730*1.3*0.95) = 90155, daily exactly 247); downgrade endorsement 730 -> 0 effective day 273; clock advanced to day 303."]
