            - "CommissionLedgerEntry.${entry_initial_id}.amount_cents == ${amount_after_finalize}"
            - "the second finalize returns 409 with error_id == ERR_LEDGER_ENTRY_NOT_PROVISIONAL"
            - "CommissionLedgerEntry.${entry_initial_id}.version == ${version_after_finalize}, so nothing changed"
            - "Agency.${agency_id}.commission_balance_cents is unchanged across the whole trigger"

      - name: reconciliation_cannot_reconcile_with_a_nonzero_variance
        claim_type: Valid Transition
        grounds:
          - state_machines.CarrierReconciliation.transitions.OPEN_to_RECONCILED
          - errors.ERR_RECONCILIATION_VARIANCE_NONZERO
          - errors.ERR_RECONCILIATION_VARIANCE_ZERO
        distinguishing_aspect: "The two OPEN exits are exact complements: reconcile requires variance_cents == 0 and dispute requires variance_cents != 0, so with a carrier-reported total of 5000 against an internal total of 3600 the reconcile edge is unreachable at 1400.00 and the dispute edge is reachable — and neither error_id can be produced by the other's state."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain through *cc_enroll, then an OPEN reconciliation at 2026-10 with a carrier-reported total of 5000."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_call
            - *cc_connect
            - *cc_complete
            - *cc_enroll
            - &cc_recon
              call: "POST /carrier-reconciliations"
              payload: { carrier_id: "${carrier_a_id}", period_month: "2026-10", carrier_reported_total_cents: 5000, internal_total_variant: "PROVISIONAL" }
              as: DirectorOfSales
              captures: { recon_id: $.data.id }
          trigger:
            - call: "POST /carrier-reconciliations/${recon_id}/reconcile"
              payload: {}
              as: DirectorOfSales
              captures: { error_reconcile: $.data.error_id }
            - call: "POST /carrier-reconciliations/${recon_id}/dispute"
              payload: { dispute_note: "Carrier under-reported the renewal block" }
              as: DirectorOfSales
          assert:
            - "the reconcile attempt returns 409 with error_reconcile == ERR_RECONCILIATION_VARIANCE_NONZERO"
            - "the dispute returns 200 and CarrierReconciliation.${recon_id}.status == DISPUTED"
            - "CarrierReconciliation.${recon_id}.internal_total_cents == 3600.00 and variance_cents == 1400.00"
            - "POST /carrier-reconciliations/${recon_id}/reopen returns 200 and status == OPEN"
            - "POST /carrier-reconciliations/${recon_id}/level-recognize returns 409 ERR_CARRIER_REPORTED_TOTAL_PRESENT, because a reported total is already present"

      - name: coaching_assignment_created_without_a_complaint_is_manual_and_due_in_fourteen_days
