        grounds:
          - calculations.ring_occupancy_overlap
          - errors.ERR_RING_BLOCK_OVERLAP
          - validations.priority_24
        excluded_because:
          difficulty_instance: ring_occupancy_half_open_adjacency_allowed
          rationale: "That instance already pins the half-open geometry from both sides - a block starting exactly at the incumbent's block_end_at is accepted and one minute earlier is ERR_RING_BLOCK_OVERLAP - which is the whole adjacency claim for this calculation."
      - name: judge_rest_buffer_is_a_closed_interval
        claim_type: interval_merge
        grounds:
          - calculations.judge_rest_separation
          - errors.ERR_JUDGE_REST_BUFFER_VIOLATION
          - validations.priority_25
        excluded_because:
          difficulty_instance: judge_rest_buffer_closed_interval_and_daily_dog_capacity
          rationale: "The contrast that matters is that the same adjacency which is legal for ring occupancy is a violation for a judge, and that a gap of exactly JUDGE_REST_BUFFER_MINUTES passes; that instance already exercises both boundaries against the ring geometry."
      - name: the_two_points_scales_diverge_on_the_same_class
        claim_type: variant_divergence
        grounds:
          - calculations.championship_points_award.variants
          - entities.Show.fields.championship_points_scale
          - entities.ShowClass.fields.counted_dog_count
        excluded_because:
          difficulty_instance: championship_points_scale_a_versus_scale_b_on_dog_totals
          rationale: "That instance runs the identical entry population under SCALE_A and SCALE_B and asserts the counted_dog_count, base_points and dog-total delta on both sides, which is the divergence claim in full."
      - name: the_fee_variant_is_chosen_by_the_operation_not_the_entry
        claim_type: variant_selection
        grounds:
          - calculations.entry_fee_assessment.variants
          - entities.Entry.fields.fee_basis
          - entities.Show.fields.fee_assessment_delta_cents
        excluded_because:
          difficulty_instance: entry_fee_provisional_versus_final_on_show_ledger
          rationale: "That instance already shows the provisional variant at confirmation and the final variant at close-entries flipping fee_basis and rewriting the ledger, so the selection claim is covered by construction."
      - name: switching_to_the_final_variant_reconciles_the_ledger_delta
        claim_type: reconciliation
        grounds:
          - calculations.entry_fee_assessment.reconciliation
          - calculations.withdrawal_refund_settlement
          - entities.Show.fields.fee_assessment_delta_cents
        excluded_because:
          difficulty_instance: refund_retention_tier_keyed_on_pre_refund_ledger
          rationale: "The reconciliation corner is the pre-refund tier basis and the negative delta it produces; that instance pins both the retention tier and the resulting fee_collected_cents, so a breadth copy would restate the same arithmetic."
