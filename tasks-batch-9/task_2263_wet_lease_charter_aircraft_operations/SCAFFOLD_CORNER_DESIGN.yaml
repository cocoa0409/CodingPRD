          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Lessee credit_limit_usd_cents 2400000, ACTIVE lease on G-ACMI with no legs."
            - "The 2026-09 period is closed and SETTLED by an ISSUED FINAL invoice of 2400000, so the balance is 2400000."
