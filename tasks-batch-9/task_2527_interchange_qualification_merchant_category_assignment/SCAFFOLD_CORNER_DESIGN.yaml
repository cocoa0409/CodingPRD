              as: NetworkAdmin
            - call: "POST /mcc-definitions"
              payload: { mcc_code: "5812", description: "Eating Places", business_type_key: "RESTAURANT", program_eligibility: [], requires_documentation: false, high_risk: false }
              as: NetworkAdmin
            - call: "POST /rate-programs"
              payload: { program_code: "STANDARD_FALLBACK", name: "Standard", category: "STANDARD", eligible_mcc_codes: ["5411", "5812"], base_rate_bps: 254, per_item_fee_cents: 10, requires_data_elements: [], max_clearing_delay_hours: 720 }
              as: NetworkAdmin
            - call: "POST /merchants"
              payload: { legal_name: "Corner Grocer", business_type_key: "GROCERY", acquirer_id: "${acq_id}", home_country_code: "US" }
