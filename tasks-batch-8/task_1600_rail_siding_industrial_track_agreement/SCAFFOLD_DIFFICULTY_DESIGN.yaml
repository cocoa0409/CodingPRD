            - call: "POST /liability-claims"
              payload: { agreement_id: "${agr_id}", claimant_name: "J. Doe", incident_date: "2026-08-02", claim_amount_cents: 60000 }
              as: RailroadContractsManager
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /agreements/${agr_id}/renewal-offer"
              as: RailroadContractsManager
              captures: { err_blocked: $.data.error_id }
            - call: "POST /liability-claims/${claim_id}/apportion"
              payload: { shipper_fault_pct: 50 }
              as: RailroadContractsManager
            - call: "POST /liability-claims/${claim_id}/accept"
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
            - call: "POST /agreements/${agr_id}/renewal-offer"
              as: RailroadContractsManager
              captures: { st_offered: $.data.status }
          assert:
            - "err_blocked == ERR_OPEN_CLAIMS_BLOCK_RENEWAL while the claim is FILED"
            - "st_offered == RENEWAL_OFFERED once the claim is ACCEPTED (terminal, excluded from the open set)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: possession_half_open_adjacency_and_overlap
        grounds:
          - validations[priority=10]
          - errors[ERR_POSSESSION_OVERLAP]
          - entities.ServiceOrder.fields.start_hour
        distinguishing_aspect: |
          Interval semantics: exclusive half-open [start_hour, end_hour) on possession-type
          ServiceOrder windows over the segment-date resource — back-to-back windows
          (08:00-12:00 then 12:00-14:00) touch but do NOT overlap, while 11:00-13:00
          intersects both and is rejected.
        test_recipe:
          setup:
            - "ACTIVE agreement A; segment 'Siding A' IN_SERVICE"
            - "Two MAINTENANCE_POSSESSION orders already exist on 2026-08-05: 08:00-12:00 and 12:00-14:00 (adjacency accepted)"
          setup_api_calls:
            - call: "POST /agreements"
              payload: { shipper_name: "Acme Chemical Co", shipper_user_id: "shipper-user-1", facility_name: "Acme Baton Rouge Plant", term_start_date: "2026-08-01", term_end_date: "2027-07-31", renewal_notice_days: 90, renewal_term_months: 12, shipper_cost_share_pct: 40, liability_cap_cents: 100000, shipper_indemnity_default_pct: 50, free_time_hours: 48, demurrage_base_rate_cents: 7500, demurrage_escalated_rate_cents: 15000, storage_rate_per_car_month_cents: 10012, inspection_cadence_days: 90, removal_period_days: 90, removal_penalty_per_day_cents: 5000, service_days_of_week: ["MON", "WED", "FRI"], max_switches_per_day: 1 }
              as: RailroadContractsManager
              captures: { agr_id: $.data.id }
            - call: "POST /agreements/${agr_id}/submit"
              as: RailroadContractsManager
            - call: "POST /agreements/${agr_id}/countersign"
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
            - call: "POST /segments"
              payload: { agreement_id: "${agr_id}", segment_name: "Siding A", length_feet: 1200, storage_capacity_cars: 3 }
              as: RailroadEngineer
              captures: { seg_id: $.data.id }
            - call: "POST /service-orders"
              payload: { agreement_id: "${agr_id}", segment_id: "${seg_id}", order_type: "MAINTENANCE_POSSESSION", service_date: "2026-08-05", start_hour: 8, end_hour: 12 }
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
              captures: { poss1: $.data.id }
            - call: "POST /service-orders"
              payload: { agreement_id: "${agr_id}", segment_id: "${seg_id}", order_type: "MAINTENANCE_POSSESSION", service_date: "2026-08-05", start_hour: 12, end_hour: 14 }
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
              captures: { poss2_status: $.data.status }
          trigger:
            - call: "POST /service-orders"
              payload: { agreement_id: "${agr_id}", segment_id: "${seg_id}", order_type: "MAINTENANCE_POSSESSION", service_date: "2026-08-05", start_hour: 11, end_hour: 13 }
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
              captures: { err: $.data.error_id }
          assert:
            - "poss2_status == REQUESTED (half-open adjacency: 12:00 end touching 12:00 start is allowed)"
            - "err == ERR_POSSESSION_OVERLAP for 11:00-13:00 (overlaps both the 08:00-12:00 and 12:00-14:00 windows)"

      - name: storage_aggregate_capacity_overlap
        grounds:
          - validations[priority=10]
          - errors[ERR_STORAGE_CAPACITY_EXCEEDED]
          - entities.StoragePlacement.fields.status
        distinguishing_aspect: |
          Different resource entity (StoragePlacement, not ServiceOrder) and different
          interval semantics: storage intervals are open-ended and mutually overlapping
          placements are LEGAL up to the segment's aggregate capacity — the conflict is
          cardinality-at-a-point (4th concurrent placement rejected), not pairwise
          half-open exclusion.
        test_recipe:
          setup:
            - "ACTIVE agreement A; segment 'Siding A' with storage_capacity_cars 3"
            - "Three STORED placements all placed 2026-08-01 (all time-overlapping, all legal)"
          setup_api_calls:
            - call: "POST /agreements"
              payload: { shipper_name: "Acme Chemical Co", shipper_user_id: "shipper-user-1", facility_name: "Acme Baton Rouge Plant", term_start_date: "2026-08-01", term_end_date: "2027-07-31", renewal_notice_days: 90, renewal_term_months: 12, shipper_cost_share_pct: 40, liability_cap_cents: 100000, shipper_indemnity_default_pct: 50, free_time_hours: 48, demurrage_base_rate_cents: 7500, demurrage_escalated_rate_cents: 15000, storage_rate_per_car_month_cents: 10012, inspection_cadence_days: 90, removal_period_days: 90, removal_penalty_per_day_cents: 5000, service_days_of_week: ["MON", "WED", "FRI"], max_switches_per_day: 1 }
              as: RailroadContractsManager
              captures: { agr_id: $.data.id }
            - call: "POST /agreements/${agr_id}/submit"
              as: RailroadContractsManager
            - call: "POST /agreements/${agr_id}/countersign"
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
            - call: "POST /segments"
              payload: { agreement_id: "${agr_id}", segment_name: "Siding A", length_feet: 1200, storage_capacity_cars: 3 }
              as: RailroadEngineer
              captures: { seg_id: $.data.id }
            - call: "POST /storage-placements"
              payload: { segment_id: "${seg_id}", car_mark: "STGX801", placed_date: "2026-08-01" }
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
            - call: "POST /storage-placements"
              payload: { segment_id: "${seg_id}", car_mark: "STGX802", placed_date: "2026-08-01" }
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
            - call: "POST /storage-placements"
              payload: { segment_id: "${seg_id}", car_mark: "STGX803", placed_date: "2026-08-01" }
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
          trigger:
            - call: "POST /storage-placements"
              payload: { segment_id: "${seg_id}", car_mark: "STGX804", placed_date: "2026-08-01" }
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
              captures: { err: $.data.error_id }
          assert:
            - "Three mutually time-overlapping placements all succeeded (aggregate semantics: overlap itself is not a conflict)"
            - "err == ERR_STORAGE_CAPACITY_EXCEEDED for the 4th concurrent placement"

  - rule_id: compensating_invariant
    instances:
      - name: construction_payment_refund_invariant
        grounds:
          - calculations.construction_cost_share
          - entities.ConstructionProject.fields.amount_paid_cents
          - entities.ConstructionProject.fields.outstanding_share_cents
        distinguishing_aspect: |
          Conserved quantity: money. The forward action (settle +100000) paired with its
          compensating action (settle -100000 refund) leaves amount_paid_cents and
          outstanding_share_cents exactly as before, and the pinned invariant
          amount_paid_cents + outstanding_share_cents == shipper_final_share_cents holds
          at every intermediate step.
        test_recipe:
          setup:
            - "ACTIVE agreement A; project COMPLETED with shipper_final_share_cents 180000, amount_paid_cents 0, outstanding_share_cents 180000"
          setup_api_calls:
            - call: "POST /agreements"
              payload: { shipper_name: "Acme Chemical Co", shipper_user_id: "shipper-user-1", facility_name: "Acme Baton Rouge Plant", term_start_date: "2026-08-01", term_end_date: "2027-07-31", renewal_notice_days: 90, renewal_term_months: 12, shipper_cost_share_pct: 40, liability_cap_cents: 100000, shipper_indemnity_default_pct: 50, free_time_hours: 48, demurrage_base_rate_cents: 7500, demurrage_escalated_rate_cents: 15000, storage_rate_per_car_month_cents: 10012, inspection_cadence_days: 90, removal_period_days: 90, removal_penalty_per_day_cents: 5000, service_days_of_week: ["MON", "WED", "FRI"], max_switches_per_day: 1 }
              as: RailroadContractsManager
              captures: { agr_id: $.data.id }
            - call: "POST /agreements/${agr_id}/submit"
              as: RailroadContractsManager
            - call: "POST /agreements/${agr_id}/countersign"
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
            - call: "POST /construction-projects"
              payload: { agreement_id: "${agr_id}", project_name: "North Siding Extension", estimated_cost_cents: 500000 }
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
              captures: { proj_id: $.data.id }
            - call: "POST /construction-projects/${proj_id}/submit-spec"
              payload: { rail_weight_lb_per_yard: 115, tie_material: "CONCRETE", ballast_depth_inches: 12 }
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
            - call: "POST /construction-projects/${proj_id}/approve-spec"
              as: RailroadEngineer
            - call: "POST /construction-projects/${proj_id}/complete"
              payload: { actual_cost_cents: 450000 }
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
          trigger:
            - call: "POST /construction-projects/${proj_id}/settle"
              payload: { payment_cents: 100000 }
              as: RailroadContractsManager
              captures: { paid_mid: $.data.amount_paid_cents, out_mid: $.data.outstanding_share_cents }
            - call: "POST /construction-projects/${proj_id}/settle"
              payload: { payment_cents: -100000 }
              as: RailroadContractsManager
              captures: { paid_end: $.data.amount_paid_cents, out_end: $.data.outstanding_share_cents }
          assert:
            - "After +100000: paid_mid == 100000 and out_mid == 80000 (sum 180000 == final share)"
            - "After compensating -100000: paid_end == 0 and out_end == 180000 (pre-payment state restored, zero drift)"
            - "ConstructionProject.${proj_id}.status == COMPLETED (not SETTLED; outstanding != 0)"

      - name: storage_place_release_count_invariant
        grounds:
          - entities.TrackSegment.fields.stored_car_count
          - state_machines.StoragePlacement.STORED_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity: physical car count (different type than money). Place (+1)
          paired with release (-1) returns segment.stored_car_count to its prior value;
          the pinned invariant stored_car_count == count(placements with status STORED)
          holds before, between, and after the pair.
        test_recipe:
          setup:
            - "ACTIVE agreement A; segment 'Siding A' capacity 3, stored_car_count 0, no placements"
          setup_api_calls:
            - call: "POST /agreements"
              payload: { shipper_name: "Acme Chemical Co", shipper_user_id: "shipper-user-1", facility_name: "Acme Baton Rouge Plant", term_start_date: "2026-08-01", term_end_date: "2027-07-31", renewal_notice_days: 90, renewal_term_months: 12, shipper_cost_share_pct: 40, liability_cap_cents: 100000, shipper_indemnity_default_pct: 50, free_time_hours: 48, demurrage_base_rate_cents: 7500, demurrage_escalated_rate_cents: 15000, storage_rate_per_car_month_cents: 10012, inspection_cadence_days: 90, removal_period_days: 90, removal_penalty_per_day_cents: 5000, service_days_of_week: ["MON", "WED", "FRI"], max_switches_per_day: 1 }
              as: RailroadContractsManager
              captures: { agr_id: $.data.id }
            - call: "POST /agreements/${agr_id}/submit"
              as: RailroadContractsManager
            - call: "POST /agreements/${agr_id}/countersign"
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
            - call: "POST /segments"
              payload: { agreement_id: "${agr_id}", segment_name: "Siding A", length_feet: 1200, storage_capacity_cars: 3 }
              as: RailroadEngineer
              captures: { seg_id: $.data.id, count0: $.data.stored_car_count }
          trigger:
            - call: "POST /storage-placements"
              payload: { segment_id: "${seg_id}", car_mark: "STGX901", placed_date: "2026-08-01" }
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
              captures: { pl_id: $.data.id }
            - call: "GET /segments/${seg_id}"
              as: RailroadEngineer
              captures: { count1: $.data.stored_car_count }
            - call: "POST /storage-placements/${pl_id}/release"
              payload: { released_date: "2026-08-10" }
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
            - call: "GET /segments/${seg_id}"
              as: RailroadEngineer
              captures: { count2: $.data.stored_car_count }
          assert:
            - "count0 == 0 (initially == number of STORED placements)"
            - "count1 == 1 (== number of STORED placements after place)"
            - "count2 == 0 (place+release pair conserved the count; no drift)"
