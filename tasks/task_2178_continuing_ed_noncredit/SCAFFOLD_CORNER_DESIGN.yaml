        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "validations[priority=5]", "errors[ERR_OFFERING_NOT_FOUND]", "errors[ERR_LEARNER_NOT_FOUND]", "errors[ERR_ACCOUNT_NOT_FOUND]", "errors[ERR_COMPLETION_RECORD_NOT_FOUND]", "errors[ERR_REQUEST_NOT_FOUND]", "errors[ERR_INSTRUCTOR_NOT_FOUND]"]
