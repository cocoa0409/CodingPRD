            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-28", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { cl_id: $.data.id, cl_v: $.data.version } }
            - { call: "POST /coverage-verifications", payload: { claim_id: "${cl_id}", expected_claim_version: "${cl_v}" }, as: ClaimsAdjuster, captures: { cv_id: $.data.id } }
            - { call: "POST /coverage-verifications/${cv_id}/decide", payload: { decision: "VERIFIED", rental_eligible: true, loss_of_use_eligible: true }, as: ClaimsAdjuster }
            - { call: "POST /repair-orders", payload: { claim_id: "${cl_id}", estimated_completion_date: "2026-08-14", labor_hours_estimate: 12 }, as: RepairShop, as_user_id: "${shop_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /repair-orders/${ro_id}/approve", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /repair-orders/${ro_id}/start", payload: {}, as: RepairShop, as_user_id: "${shop_id}" }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { cl_v3: $.data.version } }
            - { call: "POST /rental-reservations", payload: { claim_id: "${cl_id}", rental_partner_id: "${rp_id}", repair_order_id: "${ro_id}", vehicle_class: "STANDARD", pickup_date: "2026-08-05", authorized_return_date: "2026-08-15", expected_claim_version: "${cl_v3}" }, as: RentalDeskAgent, captures: { res_id: $.data.id } }
            - { call: "POST /rental-reservations/${res_id}/authorize", payload: {}, as: RentalDeskAgent }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rental-reservations/${res_id}/activate", payload: {}, as: RentalPartner, as_user_id: "${rp_id}" }
            - { call: "POST /repair-orders/${ro_id}/milestones", payload: { milestone_type: "DELAY_REPORTED", new_estimated_completion_date: "2026-08-25" }, as: RepairShop, as_user_id: "${shop_id}", captures: { ms1: $.data.id } }
            - { call: "GET /rental-reservations/${res_id}", payload: {}, as: RentalDeskAgent, captures: { res_v1: $.data.version } }
            - { call: "POST /extension-requests", payload: { reservation_id: "${res_id}", milestone_id: "${ms1}", requested_additional_days: 10, expected_reservation_version: "${res_v1}" }, as: RentalDeskAgent, captures: { er1: $.data.id } }
          trigger:
            - { call: "POST /extension-requests/${er1}/approve", payload: {}, as: ClaimsAdjuster, captures: { g1: $.data.granted_days } }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { tot: $.data.authorized_days_total } }
            - { call: "POST /repair-orders/${ro_id}/milestones", payload: { milestone_type: "DELAY_REPORTED", new_estimated_completion_date: "2026-08-30" }, as: RepairShop, as_user_id: "${shop_id}", captures: { ms2: $.data.id } }
            - { call: "GET /rental-reservations/${res_id}", payload: {}, as: RentalDeskAgent, captures: { res_v2: $.data.version } }
            - { call: "POST /extension-requests", payload: { reservation_id: "${res_id}", milestone_id: "${ms2}", requested_additional_days: 1, expected_reservation_version: "${res_v2}" }, as: RentalDeskAgent, captures: { err: $.data.error_id } }
          assert:
            - "ExtensionRequest.${er1}.granted_days == 10 — granted in full although it lands authorized_days_total EXACTLY at the cap"
            - "Claim.authorized_days_total == 20 == coverage_duration_cap_days (boundary value is allowed, <= semantics)"
            - "Second extension create with cap_remaining == 0 -> error_id == ERR_DURATION_CAP_EXHAUSTED"

      - name: invoice_rate_at_limit_exactly_payable
        grounds:
          - calculations.audited_charge_final
          - calculations.invoice_auto_adjudication
        distinguishing_aspect: |
          Metric = money threshold on the invoice endpoints (distinct from the
          day-count cap and from the zero-count recovery boundary): a billed
          daily rate EXACTLY equal to the 6000 coverage limit is fully payable
          (cap uses min, so equality keeps the whole rate), while a rate one
          cent over (6001) is audited down to the same 32400 — equality vs +1
          cent is the test target.
        test_recipe:
          setup:
            - "Partner with economy_rate 6000 == claim limit 6000; reservation ECONOMY 2026-08-05..2026-08-10 (5 days), RETURNED"
          setup_api_calls:
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
            - { call: "POST /repair-shops", payload: { shop_name: "Ace Auto Body", shop_code: "SHOP-1" }, as: SystemAdmin, captures: { shop_id: $.data.id } }
            - { call: "POST /rental-partners", payload: { partner_name: "RentCo", partner_code: "RC-L", economy_rate_cents: 6000, standard_rate_cents: 6000, premium_rate_cents: 9000, economy_capacity: 2, standard_capacity: 1, premium_capacity: 1 }, as: SystemAdmin, captures: { rp_id: $.data.id } }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-28", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { cl_id: $.data.id, cl_v: $.data.version } }
            - { call: "POST /coverage-verifications", payload: { claim_id: "${cl_id}", expected_claim_version: "${cl_v}" }, as: ClaimsAdjuster, captures: { cv_id: $.data.id } }
            - { call: "POST /coverage-verifications/${cv_id}/decide", payload: { decision: "VERIFIED", rental_eligible: true, loss_of_use_eligible: true }, as: ClaimsAdjuster }
            - { call: "POST /repair-orders", payload: { claim_id: "${cl_id}", estimated_completion_date: "2026-08-14", labor_hours_estimate: 12 }, as: RepairShop, as_user_id: "${shop_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /repair-orders/${ro_id}/approve", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /repair-orders/${ro_id}/start", payload: {}, as: RepairShop, as_user_id: "${shop_id}" }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { cl_v3: $.data.version } }
            - { call: "POST /rental-reservations", payload: { claim_id: "${cl_id}", rental_partner_id: "${rp_id}", repair_order_id: "${ro_id}", vehicle_class: "ECONOMY", pickup_date: "2026-08-05", authorized_return_date: "2026-08-10", expected_claim_version: "${cl_v3}" }, as: RentalDeskAgent, captures: { res_id: $.data.id } }
            - { call: "POST /rental-reservations/${res_id}/authorize", payload: {}, as: RentalDeskAgent }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rental-reservations/${res_id}/activate", payload: {}, as: RentalPartner, as_user_id: "${rp_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rental-reservations/${res_id}/return", payload: {}, as: RentalPartner, as_user_id: "${rp_id}" }
          trigger:
            - { call: "POST /invoices", payload: { reservation_id: "${res_id}", invoice_number: "INV-EQ", period_start: "2026-08-05", period_end: "2026-08-10", daily_rate_cents: 6000, tax_cents: 2400, fees_cents: 0 }, as: RentalPartner, as_user_id: "${rp_id}", captures: { inv1: $.data.id, st1: $.data.status, aud1: $.data.audited_payable_cents } }
            - { call: "POST /invoices", payload: { reservation_id: "${res_id}", invoice_number: "INV-GT", period_start: "2026-08-05", period_end: "2026-08-10", daily_rate_cents: 6001, tax_cents: 2401, fees_cents: 0 }, as: RentalPartner, as_user_id: "${rp_id}", captures: { inv2: $.data.id, st2: $.data.status } }
            - { call: "POST /invoices/${inv2}/audit-decision", payload: { decision: "ADJUST_TO_AUTHORIZED" }, as: ClaimsAdjuster, captures: { aud2: $.data.audited_payable_cents } }
          assert:
            - "Invoice INV-EQ (rate == limit 6000): status == AUTO_APPROVED, audited_payable_cents == 32400 (5 x (6000 + 480)) — full rate payable at the boundary"
            - "Invoice INV-GT (rate == limit + 1 cent = 6001): status == MANUAL_REVIEW at ingestion (rate != snapshot)"
            - "After ADJUST_TO_AUTHORIZED: audited_payable_cents == 32400 — the +1 cent buys the partner nothing (day charge capped at min(6001, 6000) basis from the snapshot)"

      - name: return_zero_unnecessary_days_no_case
        grounds:
          - calculations.unnecessary_rental_days_assessment
          - state_machines.RecoveryCase
        distinguishing_aspect: |
          Metric = zero-count/empty-set boundary on the return endpoint
          (distinct from day-cap and money-threshold metrics): returning exactly
          at grace_end (completion 08-14 + RETURN_GRACE_DAYS 1 = 08-15) yields
          unnecessary_days == 0 and NO RecoveryCase may be created — the empty
          set is the observable.
        test_recipe:
          setup:
            - "Base fixture; repair completed at clock 2026-08-14; return executed at clock 2026-08-15 (exactly the grace boundary)"
          setup_api_calls:
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
