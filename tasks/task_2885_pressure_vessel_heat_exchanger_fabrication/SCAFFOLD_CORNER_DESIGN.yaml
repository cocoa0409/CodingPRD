            - call: "POST /wps/${wps_a}/qualify"
              payload: {}
              as: WeldingEngineer
              as_user_id: "${we1_id}"
            - call: "POST /wps"
              payload: { wps_number: "WPS-131", process: "SAW", base_metal_p_number: 1, filler_f_number: 6, thickness_min_in: 0.2500, thickness_max_in: 2.0000, position: "1G", pwht_required: false, preheat_min_f: 50, supporting_pqr_number: "PQR-131" }
              as: WeldingEngineer
              as_user_id: "${we1_id}"
