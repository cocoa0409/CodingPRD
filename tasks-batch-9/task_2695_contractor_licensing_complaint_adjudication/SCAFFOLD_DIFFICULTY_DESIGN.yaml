  - rule_id: cross_entity_state_dependency
    instances:

      - name: citation_issuance_blocked_until_its_investigation_is_substantiated
        grounds:
          - validations[priority=22]
          - errors[ERR_INVESTIGATION_NOT_SUBSTANTIATED]
          - state_machines.Investigation.OPEN_to_SUBSTANTIATED
          - state_machines.Investigation.OPEN_to_UNSUBSTANTIATED
          - endpoints[POST /licensing/citations]
        distinguishing_aspect: |
          Entity pair Citation -> Investigation: the write target is a Citation but the gate reads a
          different entity's status. OPEN is refused and the terminal UNSUBSTANTIATED is refused too
          (so the check is not merely "is the investigation still open"), and the identical request
          succeeds the moment the same investigation reaches SUBSTANTIATED with a severity.
        test_recipe:
          setup:
            - "clock at 2026-08-01, a C-20 classification with mediation_required false, and one licence on it"
            - "at clock 2026-09-01 two complaints are screened ACCEPTED; each screens straight to INVESTIGATION"
            - "investigation OPENCASE stays OPEN; investigation DEADCASE is closed UNSUBSTANTIATED"
            - "inv-11 is the assigned investigator on both, so ERR_NOT_ASSIGNED_INVESTIGATOR (priority 45) never preempts"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/trade-classifications"
