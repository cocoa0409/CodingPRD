            - call: "POST /cca/products/${prod_std}/adopt"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/authority/activate"
              payload: {}
              as: BoardDirector
            - call: "GET /cca/authority"
              payload: {}
              as: BoardDirector
              captures: { auth_v: '$.data[0].version' }
            - call: "POST /cca/supply-contracts"
              payload: { counterparty: "Solaris Energy LLC", contract_type: "PPA", delivery_start: "2026-01-01T00:00:00Z", delivery_end: "2027-01-01T00:00:00Z", capacity_mw: 20.0, total_mwh: 87600, price_dollars_per_mwh: 50.0, rps_eligible_pct: 1.0, vintage_year: 2026 }
              as: PortfolioManager
              captures: { contract_c1: $.data.id }
            - call: "POST /cca/supply-contracts/${contract_c1}/execute"
