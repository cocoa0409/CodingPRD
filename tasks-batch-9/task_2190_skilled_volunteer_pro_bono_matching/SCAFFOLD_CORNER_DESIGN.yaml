        distinguishing_aspect: "Volunteer lifecycle control is exclusively the ProgramManager's; the ScopingSpecialist who consumes volunteers through matching cannot vet, pause or reactivate them. The 403 must arrive before any state reasoning about a PENDING_VETTING volunteer (priority 2 beats priority 31+)."
