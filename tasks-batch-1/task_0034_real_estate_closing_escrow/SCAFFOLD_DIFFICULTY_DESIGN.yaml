scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1: dual_variant_calc — different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: title_premium_variant_standard_vs_lender_concurrent
        grounds:
          - calculations.title_insurance_premium
          - state_machines.TitleSearch.RESOLVED
          - state_machines.WireInstruction.PROVIDED_to_VERIFIED
        distinguishing_aspect: |
          Identical PurchaseAgreement (purchase_price_cents=50000000) and TitleSearch (RESOLVED,
          clean) yields premium_cents=205000 under variant=standard (no LENDER wire) versus
          premium_cents=174250 under variant=lender_concurrent (a non-REJECTED LENDER WireInstruction
          exists at issuance time). The dual-variant target entity is TitleInsurancePolicy — a
          different entity domain from instance 2's Disbursement waterfall.
        test_recipe:
          setup:
            - "Clock pinned at 2026-06-01T00:00:00Z."
            - "Two EscrowOfficer User rows (eo1, eo2) and one TitleAgent (ta1) exist."
            - "Two PurchaseAgreement rows, both with purchase_price_cents=50000000, activated to ACTIVE."
            - "Each agreement has one TitleSearch in RESOLVED with has_material_defect=false."
            - "Agreement A has no LENDER WireInstruction; agreement B has a PROVIDED LENDER WireInstruction."
          setup_api_calls:
            - call: "POST /users"
              payload: { full_name: "Compliance Root", role: "ComplianceOfficer" }
              as: ComplianceOfficer
              as_user_id: "bootstrap"
              captures: { co_id: $.data.id }
            - call: "POST /users"
              payload: { full_name: "Escrow Officer 1", role: "EscrowOfficer" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { eo1_id: $.data.id }
            - call: "POST /users"
              payload: { full_name: "Title Agent 1", role: "TitleAgent" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { ta1_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
            - call: "POST /purchase-agreements"
              payload: { buyer_name: "Alice A", seller_name: "Bob A", property_address: "1 Pine St", purchase_price_cents: 50000000, earnest_money_required_cents: 1000000, scheduled_closing_date: "2026-08-01T00:00:00Z" }
              as: EscrowOfficer
              as_user_id: "${eo1_id}"
              captures: { agr_a_id: $.data.id, agr_a_v: $.data.version }
            - call: "POST /purchase-agreements/${agr_a_id}/activate"
              payload: {}
              as: EscrowOfficer
              as_user_id: "${eo1_id}"
            - call: "POST /title-searches"
              payload: { agreement_id: "${agr_a_id}" }
              as: TitleAgent
              as_user_id: "${ta1_id}"
              captures: { ts_a_id: $.data.id }
            - call: "POST /title-searches/${ts_a_id}/complete"
              payload: { defects: [] }
              as: TitleAgent
              as_user_id: "${ta1_id}"
            - call: "POST /title-searches/${ts_a_id}/resolve"
              payload: {}
              as: TitleAgent
              as_user_id: "${ta1_id}"
              captures: { ts_a_v: $.data.version }
            - call: "POST /purchase-agreements"
              payload: { buyer_name: "Alice B", seller_name: "Bob B", property_address: "2 Pine St", purchase_price_cents: 50000000, earnest_money_required_cents: 1000000, scheduled_closing_date: "2026-08-01T00:00:00Z" }
              as: EscrowOfficer
              as_user_id: "${eo1_id}"
              captures: { agr_b_id: $.data.id }
            - call: "POST /purchase-agreements/${agr_b_id}/activate"
              payload: {}
              as: EscrowOfficer
              as_user_id: "${eo1_id}"
            - call: "POST /title-searches"
              payload: { agreement_id: "${agr_b_id}" }
              as: TitleAgent
              as_user_id: "${ta1_id}"
              captures: { ts_b_id: $.data.id }
            - call: "POST /title-searches/${ts_b_id}/complete"
              payload: { defects: [] }
              as: TitleAgent
              as_user_id: "${ta1_id}"
            - call: "POST /title-searches/${ts_b_id}/resolve"
              payload: {}
              as: TitleAgent
              as_user_id: "${ta1_id}"
              captures: { ts_b_v: $.data.version }
            - call: "POST /wire-instructions"
              payload: { agreement_id: "${agr_b_id}", party: "LENDER", beneficiary_bank_name: "Acme Bank", beneficiary_account_last4: "1234", routing_number: "021000021" }
              as: EscrowOfficer
              as_user_id: "${eo1_id}"
          trigger:
            - call: "POST /title-insurance-policies"
              payload: { title_search_id: "${ts_a_id}", expected_title_search_version: "${ts_a_v}" }
              as: TitleAgent
              as_user_id: "${ta1_id}"
              captures: { policy_a_id: $.data.id, policy_a_premium: $.data.premium_cents }
            - call: "POST /title-insurance-policies"
              payload: { title_search_id: "${ts_b_id}", expected_title_search_version: "${ts_b_v}" }
              as: TitleAgent
              as_user_id: "${ta1_id}"
              captures: { policy_b_id: $.data.id, policy_b_premium: $.data.premium_cents }
          assert:
            - "TitleInsurancePolicy.${policy_a_id}.premium_cents == 205000"
            - "TitleInsurancePolicy.${policy_b_id}.premium_cents == 174250"
            - "TitleInsurancePolicy.${policy_a_id}.coverage_amount_cents == 50000000"
            - "TitleInsurancePolicy.${policy_b_id}.coverage_amount_cents == 50000000"

      - name: disbursement_waterfall_standard_vs_exchange_routed
        grounds:
          - calculations.disbursement_waterfall
          - state_machines.PurchaseAgreement.CLEARED_TO_CLOSE_to_CLOSED
          - validations[priority=17]
        distinguishing_aspect: |
          Identical attempted Disbursement (purpose=SELLER_PROCEEDS, amount_cents=40000000) on
          two otherwise identical escrow flows produces a successful QUEUED row when
          PurchaseAgreement.exchange_account_id is null (variant=standard) and ERR_EXCHANGE_ROUTING_REQUIRED
          (422) when exchange_account_id is non-null (variant=exchange_routed). The dual-variant
          target entity is Disbursement — different from instance 1's TitleInsurancePolicy domain.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z."
            - "Two PurchaseAgreements activated to ACTIVE, each with its own EscrowAccount."
            - "Agreement S has no exchange_account_id; agreement E has exchange_account_id pointing to a fresh ExchangeAccount."
            - "Both escrows have a LOCKED SELLER WireInstruction available for disbursement routing."
          setup_api_calls:
            - call: "POST /users"
              payload: { full_name: "CO", role: "ComplianceOfficer" }
              as: ComplianceOfficer
              as_user_id: "bootstrap"
              captures: { co_id: $.data.id }
            - call: "POST /users"
              payload: { full_name: "EO Alpha", role: "EscrowOfficer" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { eo_a_id: $.data.id }
            - call: "POST /users"
              payload: { full_name: "EO Beta",  role: "EscrowOfficer" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { eo_b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
            - call: "POST /exchange-accounts"
              payload: { taxpayer_name: "Seller E", qualified_intermediary_name: "QI Corp", relinquished_closing_date: "2026-06-01T00:00:00Z" }
              as: EscrowOfficer
              as_user_id: "${eo_a_id}"
              captures: { ea_id: $.data.id }
            - call: "POST /purchase-agreements"
              payload: { buyer_name: "B-S", seller_name: "S-S", property_address: "1 Std Ln", purchase_price_cents: 50000000, earnest_money_required_cents: 1000000, scheduled_closing_date: "2026-08-01T00:00:00Z" }
              as: EscrowOfficer
              as_user_id: "${eo_a_id}"
              captures: { agr_s_id: $.data.id }
            - call: "POST /purchase-agreements"
              payload: { buyer_name: "B-E", seller_name: "S-E", property_address: "2 Exc Ln", purchase_price_cents: 50000000, earnest_money_required_cents: 1000000, scheduled_closing_date: "2026-08-01T00:00:00Z", exchange_account_id: "${ea_id}" }
              as: EscrowOfficer
              as_user_id: "${eo_a_id}"
              captures: { agr_e_id: $.data.id }
            - call: "POST /purchase-agreements/${agr_s_id}/activate"
              payload: {}
              as: EscrowOfficer
              as_user_id: "${eo_a_id}"
            - call: "POST /purchase-agreements/${agr_e_id}/activate"
              payload: {}
              as: EscrowOfficer
              as_user_id: "${eo_a_id}"
            - call: "GET /escrow-accounts"
              payload: { agreement_id: "${agr_s_id}" }
              as: EscrowOfficer
              as_user_id: "${eo_a_id}"
              captures: { esc_s_id: "$.data[0].id" }
            - call: "GET /escrow-accounts"
              payload: { agreement_id: "${agr_e_id}" }
              as: EscrowOfficer
              as_user_id: "${eo_a_id}"
              captures: { esc_e_id: "$.data[0].id" }
            # Seller wire for S agreement (verified and locked)
            - call: "POST /wire-instructions"
              payload: { agreement_id: "${agr_s_id}", party: "SELLER", beneficiary_bank_name: "Bank S", beneficiary_account_last4: "0001", routing_number: "021000021" }
              as: EscrowOfficer
              as_user_id: "${eo_a_id}"
              captures: { wi_s_id: $.data.id }
            - call: "POST /wire-instructions/${wi_s_id}/callback-verify"
              payload: { verifier_id: "${eo_a_id}", voice_callback_reference: "VC-001" }
              as: EscrowOfficer
              as_user_id: "${eo_a_id}"
            - call: "POST /wire-instructions/${wi_s_id}/lock"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${co_id}"
            # Seller wire for E agreement (would receive proceeds, but exchange routing required)
            - call: "POST /wire-instructions"
              payload: { agreement_id: "${agr_e_id}", party: "SELLER", beneficiary_bank_name: "Bank E", beneficiary_account_last4: "0002", routing_number: "021000021" }
              as: EscrowOfficer
              as_user_id: "${eo_a_id}"
              captures: { wi_e_id: $.data.id }
            - call: "POST /wire-instructions/${wi_e_id}/callback-verify"
              payload: { verifier_id: "${eo_a_id}", voice_callback_reference: "VC-002" }
              as: EscrowOfficer
              as_user_id: "${eo_a_id}"
            - call: "POST /wire-instructions/${wi_e_id}/lock"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${co_id}"
          trigger:
            - call: "POST /disbursements"
              payload: { escrow_account_id: "${esc_s_id}", wire_instruction_id: "${wi_s_id}", purpose: "SELLER_PROCEEDS", amount_cents: 40000000 }
              as: EscrowOfficer
              as_user_id: "${eo_a_id}"
              captures: { disb_s_id: $.data.id, disb_s_status: $.data.status }
            - call: "POST /disbursements"
              payload: { escrow_account_id: "${esc_e_id}", wire_instruction_id: "${wi_e_id}", purpose: "SELLER_PROCEEDS", amount_cents: 40000000 }
              as: EscrowOfficer
              as_user_id: "${eo_a_id}"
          assert:
            - "Disbursement.${disb_s_id}.status == QUEUED"
            - "trigger[1].response.status_code == 422"
            - "trigger[1].response.data.error_id == ERR_EXCHANGE_ROUTING_REQUIRED"

  # ---------------------------------------------------------------------------
  # Rule 2: combinatorial_formula — different modes from {(a),(b),(c)}
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: title_premium_per_tier_rounding_order_mode_b
        grounds:
          - calculations.title_insurance_premium
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The scaffold pins per-tier ROUND_HALF_UP
          THEN sum, with no secondary rounding on the sum. A price of $1,200,000 (120000000 cents)
          straddles all four tiers, exercising the per-slice rounding path; the literal
          premium_cents=440000 (= 45000 + 160000 + 175000 + 60000) is well-defined ONLY because
          the rounding order is pinned. A "sum then round once" implementation would also produce
          440000 on this clean input — but the pinning is what the test verifies via slice
          contribution structure.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z."
            - "One EscrowOfficer, one TitleAgent, one PurchaseAgreement at purchase_price_cents=120000000, ACTIVE."
            - "One RESOLVED clean TitleSearch on that agreement."
            - "No LENDER WireInstruction exists (variant=standard applies)."
          setup_api_calls:
            - call: "POST /users"
              payload: { full_name: "CO", role: "ComplianceOfficer" }
              as: ComplianceOfficer
              as_user_id: "bootstrap"
              captures: { co_id: $.data.id }
            - call: "POST /users"
              payload: { full_name: "EO", role: "EscrowOfficer" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { eo_id: $.data.id }
            - call: "POST /users"
              payload: { full_name: "TA", role: "TitleAgent" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { ta_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
            - call: "POST /purchase-agreements"
              payload: { buyer_name: "B", seller_name: "S", property_address: "1 Big St", purchase_price_cents: 120000000, earnest_money_required_cents: 1000000, scheduled_closing_date: "2026-08-01T00:00:00Z" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { agr_id: $.data.id }
            - call: "POST /purchase-agreements/${agr_id}/activate"
              payload: {}
              as: EscrowOfficer
              as_user_id: "${eo_id}"
            - call: "POST /title-searches"
              payload: { agreement_id: "${agr_id}" }
              as: TitleAgent
              as_user_id: "${ta_id}"
              captures: { ts_id: $.data.id }
            - call: "POST /title-searches/${ts_id}/complete"
              payload: { defects: [] }
              as: TitleAgent
              as_user_id: "${ta_id}"
            - call: "POST /title-searches/${ts_id}/resolve"
              payload: {}
              as: TitleAgent
              as_user_id: "${ta_id}"
              captures: { ts_v: $.data.version }
          trigger:
            - call: "POST /title-insurance-policies"
              payload: { title_search_id: "${ts_id}", expected_title_search_version: "${ts_v}" }
              as: TitleAgent
              as_user_id: "${ta_id}"
              captures: { policy_id: $.data.id }
          assert:
            - "TitleInsurancePolicy.${policy_id}.premium_cents == 440000"
            - "TitleInsurancePolicy.${policy_id}.coverage_amount_cents == 120000000"

      - name: clear_to_close_six_input_predicate_mode_a
        grounds:
          - state_machines.PurchaseAgreement.UNDER_CONTRACT_to_CLEARED_TO_CLOSE
          - validations[priority=11]
          - validations[priority=14]
          - validations[priority=15]
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs and non-linear interaction. The
          clear-to-close precondition is the conjunction of six independent predicates
          across five entities (TitleSearch status & has_material_defect, TitleInsurancePolicy
          status, CCRReview.buyer_acknowledged, ClosingDisclosure.status, ALL WireInstruction.status,
          clock vs earliest_consummation_at). Each input is necessary; the formula evaluates
          ALL six and rejects on the first false. This is a non-linear conjunction over
          state attributes on different entity rows (different mode from instance 1's
          numeric per-tier rounding).
        test_recipe:
          setup:
            - "Clock pinned at 2026-06-15T00:00:00Z."
            - "Two PurchaseAgreements both in UNDER_CONTRACT with identical setup EXCEPT:"
            - "Agreement A: all six predicates true at trigger time (should succeed)."
            - "Agreement B: identical except clock has not yet crossed earliest_consummation_at (one predicate false; should fail)."
          setup_api_calls:
            - call: "POST /users"
              payload: { full_name: "CO", role: "ComplianceOfficer" }
              as: ComplianceOfficer
              as_user_id: "bootstrap"
              captures: { co_id: $.data.id }
            - call: "POST /users"
              payload: { full_name: "EO", role: "EscrowOfficer" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { eo_id: $.data.id }
            - call: "POST /users"
              payload: { full_name: "EO2", role: "EscrowOfficer" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { eo2_id: $.data.id }
            - call: "POST /users"
              payload: { full_name: "TA", role: "TitleAgent" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { ta_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
            # Agreement A (will succeed)
            - call: "POST /purchase-agreements"
              payload: { buyer_name: "BA", seller_name: "SA", property_address: "1 A St", purchase_price_cents: 50000000, earnest_money_required_cents: 1000000, scheduled_closing_date: "2026-08-01T00:00:00Z" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { agr_a_id: $.data.id, agr_a_v1: $.data.version }
            - call: "POST /purchase-agreements/${agr_a_id}/activate"
              payload: {}
              as: EscrowOfficer
              as_user_id: "${eo_id}"
            - call: "GET /escrow-accounts"
              payload: { agreement_id: "${agr_a_id}" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { esc_a_id: "$.data[0].id" }
            - call: "POST /earnest-money-deposits"
              payload: { escrow_account_id: "${esc_a_id}", amount_cents: 1000000, depositor_role: "BUYER" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { emd_a_id: $.data.id }
            - call: "POST /earnest-money-deposits/${emd_a_id}/confirm"
              payload: { confirmation_reference: "BANK-A1" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
            - call: "GET /purchase-agreements/${agr_a_id}"
              payload: {}
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { agr_a_v: $.data.version }
            - call: "POST /title-searches"
              payload: { agreement_id: "${agr_a_id}" }
              as: TitleAgent
              as_user_id: "${ta_id}"
              captures: { ts_a_id: $.data.id }
            - call: "POST /title-searches/${ts_a_id}/complete"
              payload: { defects: [] }
              as: TitleAgent
              as_user_id: "${ta_id}"
            - call: "POST /title-searches/${ts_a_id}/resolve"
              payload: {}
              as: TitleAgent
              as_user_id: "${ta_id}"
              captures: { ts_a_v: $.data.version }
            - call: "POST /title-insurance-policies"
              payload: { title_search_id: "${ts_a_id}", expected_title_search_version: "${ts_a_v}" }
              as: TitleAgent
              as_user_id: "${ta_id}"
            - call: "POST /ccr-reviews"
              payload: { agreement_id: "${agr_a_id}", hoa_name: "Sunny HOA", restrictions_summary: "pets allowed", buyer_acknowledged: true }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
            - call: "POST /closing-disclosures"
              payload: { agreement_id: "${agr_a_id}", expected_agreement_version: "${agr_a_v}", cd_apr_bps: 600, cd_total_loan_amount_cents: 40000000, cd_monthly_payment_cents: 250000, cd_product_type: "FIXED", cd_prepayment_penalty: false }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { cd_a_id: $.data.id }
            - call: "POST /closing-disclosures/${cd_a_id}/deliver"
              payload: {}
              as: EscrowOfficer
              as_user_id: "${eo_id}"
            - call: "POST /wire-instructions"
              payload: { agreement_id: "${agr_a_id}", party: "BUYER", beneficiary_bank_name: "Bank A", beneficiary_account_last4: "1111", routing_number: "021000021" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { wi_a_buyer: $.data.id }
            - call: "POST /wire-instructions/${wi_a_buyer}/callback-verify"
              payload: { verifier_id: "${eo_id}", voice_callback_reference: "VC-A1" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
            - call: "POST /wire-instructions/${wi_a_buyer}/lock"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${co_id}"
            - call: "POST /wire-instructions"
              payload: { agreement_id: "${agr_a_id}", party: "SELLER", beneficiary_bank_name: "Bank A", beneficiary_account_last4: "1112", routing_number: "021000021" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { wi_a_seller: $.data.id }
            - call: "POST /wire-instructions/${wi_a_seller}/callback-verify"
              payload: { verifier_id: "${eo2_id}", voice_callback_reference: "VC-A2" }
              as: EscrowOfficer
              as_user_id: "${eo2_id}"
            - call: "POST /wire-instructions/${wi_a_seller}/lock"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${co_id}"
            - call: "POST /_clock/advance"
              payload: { seconds: 259200 }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
            - call: "POST /closing-disclosures/${cd_a_id}/acknowledge"
              payload: {}
              as: EscrowOfficer
              as_user_id: "${eo_id}"
          trigger:
            - call: "POST /purchase-agreements/${agr_a_id}/clear-to-close"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { agr_a_status: $.data.status }
          assert:
            - "PurchaseAgreement.${agr_a_id}.status == CLEARED_TO_CLOSE"

  # ---------------------------------------------------------------------------
  # Rule 3: non_linear_state_machine — different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: closing_disclosure_branch_reissue_then_acknowledge
        grounds:
          - state_machines.ClosingDisclosure.DRAFT_to_DELIVERED
          - state_machines.ClosingDisclosure.DELIVERED_to_REISSUED
          - state_machines.ClosingDisclosure.REISSUED_to_ACKNOWLEDGED
        distinguishing_aspect: |
          ClosingDisclosure has a fork: from DELIVERED the next state may be either
          REISSUED (material change branch) or ACKNOWLEDGED (timer-elapsed branch). The
          two branches carry divergent side-effects: REISSUED re-stamps issued_at and
          earliest_consummation_at; ACKNOWLEDGED stamps acknowledged_at and freezes the row.
          This is branching (fork) on the same entity, distinct from instance 2's
          cyclic/branching pattern on a different entity (PurchaseAgreement terminate from two
          from-states with different compensating side-effects).
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z."
            - "Agreement A is UNDER_CONTRACT with a DELIVERED ClosingDisclosure (issued_at=2026-06-01T00:00:00Z, earliest_consummation_at=2026-06-04T00:00:00Z)."
          setup_api_calls:
            - call: "POST /users"
              payload: { full_name: "CO", role: "ComplianceOfficer" }
