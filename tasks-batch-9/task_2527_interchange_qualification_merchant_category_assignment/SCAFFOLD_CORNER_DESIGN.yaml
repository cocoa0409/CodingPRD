        distinguishing_aspect: "For a 20000-cent utility record carrying AUTH_CODE and CUSTOMER_ACCOUNT_REF with clearing_timestamp equal to auth_timestamp, the UTILITY program's amortised cost of 38 bps beats STANDARD's 259 bps, so the record qualifies for exactly 75 cents (0 bps ad valorem plus the 75-cent flat fee)."
