  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role fails authentication before anything else, even on a valid endpoint."
        test_recipe:
          setup: ["empty system"]
          setup_api_calls: []
          trigger:
            - { call: "POST /glass/device-makers", payload: { name: "Acme Devices", region: "US" }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED with http 401 (no X-User-Role / X-User-ID headers sent)"

      - name: device_maker_cannot_create_tank_returns_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "POST /glass/tanks allows only CapacityPlanner; the DeviceMaker role is rejected before existence checks."
        test_recipe:
          setup: ["one device maker exists (for a valid X-User-ID)"]
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Acme Devices", region: "US" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
          trigger:
            - { call: "POST /glass/tanks", payload: { commitment_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", capacity_units_per_day: 100 }, as: DeviceMaker, as_user_id: "${m_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE with http 403 (role check precedes the 404 that the bogus commitment_id would otherwise produce)"

      - name: draft_program_blocks_composition_create_nda_required
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_NDA_REQUIRED]"]
        distinguishing_aspect: "Confidentiality gate: compositions cannot be created while the program is DRAFT."
        test_recipe:
          setup: ["program created, NDA not executed"]
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Acme Devices", region: "US" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m_id}", name: "Eagle", primary_market: "CONSUMER_ELECTRONICS" }, as: ProgramManager, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /glass/compositions", payload: { program_id: "${p_id}", composition_code: "GX-100", complexity_multiplier: 1.0 }, as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NDA_REQUIRED with http 403"

      - name: sign_by_other_maker_returns_ownership_mismatch
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_OWNERSHIP_MISMATCH]"]
        distinguishing_aspect: "Only the owning device maker (X-User-ID == commitment.device_maker_id) may sign; another maker is rejected."
        test_recipe:
          setup: ["two makers; program and PROPOSED commitment belong to maker 1"]
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Acme Devices", region: "US" }, as: PlatformAdmin, captures: { m1_id: $.data.id } }
            - { call: "POST /glass/device-makers", payload: { name: "Beta Devices", region: "EU" }, as: PlatformAdmin, captures: { m2_id: $.data.id } }
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m1_id}", name: "Eagle", primary_market: "CONSUMER_ELECTRONICS" }, as: ProgramManager, captures: { p_id: $.data.id } }
            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-001" }, as: ProgramManager }
            - { call: "GET /glass/programs/${p_id}", as: ProgramManager, captures: { p_v: $.data.version } }
            - { call: "POST /glass/commitments", payload: { program_id: "${p_id}", committed_units: 5000, required_units: 5000, prepayment_cents: 2500000, expected_program_version: "${p_v}" }, as: ProgramManager, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /glass/commitments/${c_id}/sign", as: DeviceMaker, as_user_id: "${m2_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_OWNERSHIP_MISMATCH with http 403; commitment stays PROPOSED"

      - name: same_user_countersign_and_confirm_returns_segregation_error
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties: the finance actor's X-User-ID must differ from countersigned_by, even across different roles; a distinct finance user then succeeds."
        test_recipe:
          setup: ["commitment SIGNED; countersigned by user ops-77"]
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Acme Devices", region: "US" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m_id}", name: "Eagle", primary_market: "CONSUMER_ELECTRONICS" }, as: ProgramManager, captures: { p_id: $.data.id } }
            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-001" }, as: ProgramManager }
            - { call: "GET /glass/programs/${p_id}", as: ProgramManager, captures: { p_v: $.data.version } }
            - { call: "POST /glass/commitments", payload: { program_id: "${p_id}", committed_units: 5000, required_units: 5000, prepayment_cents: 2500000, expected_program_version: "${p_v}" }, as: ProgramManager, captures: { c_id: $.data.id } }
            - { call: "POST /glass/commitments/${c_id}/sign", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/commitments/${c_id}/countersign", as: CapacityPlanner, as_user_id: "ops-77" }
          trigger:
            - { call: "POST /glass/commitments/${c_id}/confirm-prepayment", as: FinanceController, as_user_id: "ops-77", captures: { err: $.data.error_id } }
            - { call: "POST /glass/commitments/${c_id}/confirm-prepayment", as: FinanceController, as_user_id: "fin-01", captures: { c_status: $.data.status } }
          assert:
            - "first confirm: error_id == ERR_SEGREGATION_OF_DUTIES with http 403 (same person may not countersign and confirm)"
            - "second confirm by a different finance user: status == SECURED, coverage_tier == TIER_A"

      - name: nonexistent_commitment_sign_returns_not_found_before_state
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=6]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Existence (priority 4) pre-empts state checks: signing a random commitment id yields 404, never a state error."
        test_recipe:
          setup: ["one device maker exists"]
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Acme Devices", region: "US" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
          trigger:
            - { call: "POST /glass/commitments/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/sign", as: DeviceMaker, as_user_id: "${m_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND with http 404"

      - name: overlapping_report_period_returns_error_until_disputed
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_REPORT_PERIOD_OVERLAP]", "state_machines.UsageReport.SUBMITTED_to_DISPUTED"]
        distinguishing_aspect: "A second report overlapping a SUBMITTED one is rejected; after the first is DISPUTED, the identical period is accepted (supersession)."
        test_recipe:
          setup: ["license ACTIVE with marketing APPROVED; report 1 SUBMITTED for [2027-01-01, 2027-03-31]"]
