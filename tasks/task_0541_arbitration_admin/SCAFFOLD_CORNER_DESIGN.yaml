  # ===========================================================================
  # Section 5 — Endpoints (action_endpoint / computed_read)
  # ===========================================================================
  - section: endpoints
    instances:

      - name: neutral_roster_transition_to_suspended
        claim_type: action_endpoint
        grounds:
          - entities.Neutral.fields.roster_status
        distinguishing_aspect: |
          POST /neutrals/{id}/transition with roster_status SUSPENDED moves the neutral from ACTIVE
          to SUSPENDED.
        test_recipe:
          setup:
            - "One ACTIVE rostered neutral."
          setup_api_calls:
            - call: "POST /neutrals"
              payload: { full_name: "Susp Target", neutral_type: "ARBITRATOR", hourly_rate_cents: 50000 }
              as: CaseAdministrator
              captures: { n_id: $.data.id }
          trigger:
            - call: "POST /neutrals/${n_id}/transition"
              payload: { roster_status: "SUSPENDED" }
              as: CaseAdministrator
          assert:
            - "response.status == 200"
            - "Neutral.${n_id}.roster_status == SUSPENDED"

      - name: pay_deposit_updates_case_paid_deposit_computed_read
        claim_type: computed_read
        grounds:
          - entities.Case.fields.paid_deposit_cents
          - entities.Case.fields.deposit_balance_cents
        distinguishing_aspect: |
          After POST /deposits/{id}/pay for 100000, GET /cases/{id} reflects paid_deposit_cents
          100000 and deposit_balance_cents 100000.
        test_recipe:
          setup:
            - "A FILED case with a party pA and a REQUESTED 100000 deposit."
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "PaidRead", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 100 }
              as: CaseAdministrator
              captures: { pA: $.data.id }
            - call: "POST /deposits"
              payload: { case_id: "${c_id}", amount_cents: 100000 }
              as: CaseAdministrator
              captures: { dep: $.data.id }
            - call: "POST /deposits/${dep}/pay"
              as: Party
              as_user_id: "${pA}"
          trigger:
            - call: "GET /cases/${c_id}"
              as: CaseAdministrator
          assert:
            - "response.status == 200"
            - "Case.${c_id}.paid_deposit_cents == 100000"
            - "Case.${c_id}.deposit_balance_cents == 100000"

      - name: list_fee_charges_filtered_by_neutral_reverse_fk
        claim_type: computed_read
        grounds:
          - entities.FeeCharge.fields.neutral_id
        distinguishing_aspect: |
          GET /fee-charges?neutral_id=... returns the posted fee charge whose neutral_id matches,
          exercising the FeeCharge.neutral_id reverse FK filter.
        test_recipe:
          setup:
            - "An appointed HEARING case (rate 50000) with a PAID 500000 deposit and one POSTED 4h fee charge."
          setup_api_calls:
            - call: "POST /neutrals"
              payload: { full_name: "Fc N", neutral_type: "ARBITRATOR", hourly_rate_cents: 50000 }
              as: CaseAdministrator
              captures: { n_id: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "FcCase", claim_amount_cents: 2000000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 50 }
              as: CaseAdministrator
              captures: { pA: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "RESPONDENT", display_name: "B", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { cv_sel: $.data.version }
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n_id}", expected_case_version: "${cv_sel}" }
              as: CaseAdministrator
              captures: { cand: $.data.id }
            - call: "POST /candidates/${cand}/disclose"
              payload: { disclosure_text: "none", has_conflict: false }
              as: Neutral
              as_user_id: "${n_id}"
            - call: "POST /candidates/${cand}/transition"
              payload: { to_status: "CLEARED" }
              as: CaseAdministrator
            - call: "GET /cases/${c_id}"
              as: CaseAdministrator
              captures: { cv_pre: $.data.version }
            - call: "POST /cases/${c_id}/appoint"
              payload: { expected_case_version: "${cv_pre}" }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "HEARING" }
              as: CaseAdministrator
            - call: "POST /deposits"
              payload: { case_id: "${c_id}", amount_cents: 500000 }
              as: CaseAdministrator
              captures: { dep: $.data.id }
            - call: "POST /deposits/${dep}/pay"
              as: Party
              as_user_id: "${pA}"
            - call: "GET /cases/${c_id}"
              as: CaseAdministrator
              captures: { cv_fee: $.data.version }
            - call: "POST /cases/${c_id}/fee-charges"
              payload: { neutral_id: "${n_id}", hours: 4, expected_case_version: "${cv_fee}" }
              as: CaseAdministrator
              captures: { fc: $.data.id }
          trigger:
            - call: "GET /fee-charges"
              payload: { neutral_id: "${n_id}" }
              as: CaseAdministrator
          assert:
            - "response.status == 200"
            - "response.data contains FeeCharge ${fc}"
            - "FeeCharge ${fc} in the list has amount_cents == 200000"

  # ===========================================================================
  # Section 6 — Errors (error_triggerable; stubs for §1.8-covered errors)
  # ===========================================================================
  - section: errors
    instances:

      - name: disclose_by_suspended_neutral_not_active_corner
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NEUTRAL_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / disclose_blocked_when_neutral_suspended
          rationale: "ERR_NEUTRAL_NOT_ACTIVE on disclosure by a SUSPENDED neutral is asserted by the named §1.8 instance."

      - name: hearing_case_overlap_error_corner
        claim_type: error_triggerable
        grounds:
          - errors[ERR_HEARING_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / case_hearing_overlap_half_open
          rationale: "ERR_HEARING_OVERLAP for half-open interval collision on one case is asserted by the named §1.8 instance."

      - name: neutral_buffer_unavailable_error_corner
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NEUTRAL_UNAVAILABLE]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / neutral_buffer_conflict_across_cases
          rationale: "ERR_NEUTRAL_UNAVAILABLE for a sub-30-minute buffer across cases is asserted by the named §1.8 instance."

      - name: hearing_notice_too_short_error_corner
        claim_type: error_triggerable
        grounds:
          - errors[ERR_HEARING_NOTICE_TOO_SHORT]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / hearing_notice_precedes_overlap
          rationale: "ERR_HEARING_NOTICE_TOO_SHORT for an under-noticed hearing is asserted by the named §1.8 instance."

      - name: fee_charge_state_invalid_error_corner
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / hearing_blocked_when_case_not_appointed
          rationale: "ERR_INVALID_STATE for a cross-entity state gate is asserted by the named §1.8 instance (also covered by local invalid-transition corners)."

  # ===========================================================================
  # Section 7 — RBAC (cannot_perform / can_perform; peer_roles)
  # ===========================================================================
  - section: rbac
    instances:

      - name: party_cannot_file_case
        claim_type: cannot_perform
        grounds:
          - roles.Party
          - roles.CaseAdministrator
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          POST /cases is a CaseAdministrator exclusive; a Party attempting it gets 403
          ERR_UNAUTHORIZED.
        test_recipe:
          setup:
            - "Empty DB; a Party identity."
          setup_api_calls: []
          trigger:
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "PartyFile", claim_amount_cents: 500000, panel_size: 1 }
              as: Party
              as_user_id: "00000000-0000-0000-0000-000000000001"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.error_id == ERR_UNAUTHORIZED"

      - name: party_cannot_disclose_candidate
        claim_type: cannot_perform
        grounds:
          - roles.Neutral
          - roles.Party
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          POST /candidates/{id}/disclose is a Neutral exclusive; a Party attempting it gets 403
          ERR_UNAUTHORIZED.
        test_recipe:
          setup:
            - "Empty DB; a Party identity acting on a candidate id."
          setup_api_calls: []
          trigger:
            - call: "POST /candidates/00000000-0000-0000-0000-000000000000/disclose"
              payload: { disclosure_text: "x", has_conflict: false }
              as: Party
              as_user_id: "00000000-0000-0000-0000-000000000001"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.error_id == ERR_UNAUTHORIZED"

      - name: admin_cannot_create_ranking
        claim_type: cannot_perform
        grounds:
          - roles.Party
          - roles.CaseAdministrator
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          POST /rankings is a Party exclusive; a CaseAdministrator attempting it gets 403
          ERR_UNAUTHORIZED.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /rankings"
              payload: { candidate_id: "00000000-0000-0000-0000-000000000000", party_id: "00000000-0000-0000-0000-000000000002", action: "RANK", rank_value: 1 }
              as: CaseAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.error_id == ERR_UNAUTHORIZED"

      - name: neutral_cannot_pay_deposit
        claim_type: cannot_perform
        grounds:
          - roles.Party
          - roles.Neutral
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          POST /deposits/{id}/pay is a Party exclusive; a Neutral attempting it gets 403
          ERR_UNAUTHORIZED.
        test_recipe:
          setup:
            - "Empty DB; a Neutral identity acting on a deposit id."
          setup_api_calls: []
          trigger:
            - call: "POST /deposits/00000000-0000-0000-0000-000000000000/pay"
              as: Neutral
              as_user_id: "00000000-0000-0000-0000-000000000003"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.error_id == ERR_UNAUTHORIZED"

      - name: party_cannot_withdraw_another_partys_ranking
        claim_type: cannot_perform
        grounds:
          - roles.Party
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          A Party may only withdraw its own ranking (X-User-ID == Ranking.party_id); party B
          withdrawing party A's ranking gets 403 ERR_UNAUTHORIZED.
        test_recipe:
          setup:
            - "A SELECTION case; party A holds an ACTIVE ranking on a candidate; party B is a distinct party."
          setup_api_calls:
            - call: "POST /neutrals"
              payload: { full_name: "Own N", neutral_type: "ARBITRATOR", hourly_rate_cents: 40000 }
              as: CaseAdministrator
              captures: { n_id: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "OwnCase", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 50 }
              as: CaseAdministrator
              captures: { pA: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "RESPONDENT", display_name: "B", share_pct: 50 }
              as: CaseAdministrator
              captures: { pB: $.data.id }
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { cv_sel: $.data.version }
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n_id}", expected_case_version: "${cv_sel}" }
              as: CaseAdministrator
              captures: { cand: $.data.id }
            - call: "POST /rankings"
              payload: { candidate_id: "${cand}", party_id: "${pA}", action: "RANK", rank_value: 5 }
              as: Party
              as_user_id: "${pA}"
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /rankings/${r1}/withdraw"
              as: Party
              as_user_id: "${pB}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.error_id == ERR_UNAUTHORIZED"

      - name: neutral_cannot_disclose_another_neutrals_candidate
        claim_type: cannot_perform
        grounds:
          - roles.Neutral
          - state_machines.Candidate.PROPOSED_to_DISCLOSED
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          A Neutral may only disclose its own candidacy (X-User-ID == Candidate.neutral_id);
          neutral n2 disclosing n1's candidate gets 403 ERR_UNAUTHORIZED.
        test_recipe:
          setup:
            - "A SELECTION case with a PROPOSED candidate for neutral n1; a second neutral n2 exists."
          setup_api_calls:
            - call: "POST /neutrals"
              payload: { full_name: "N1", neutral_type: "ARBITRATOR", hourly_rate_cents: 40000 }
              as: CaseAdministrator
              captures: { n1: $.data.id }
            - call: "POST /neutrals"
              payload: { full_name: "N2", neutral_type: "ARBITRATOR", hourly_rate_cents: 40000 }
              as: CaseAdministrator
              captures: { n2: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "DiscOwn", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "RESPONDENT", display_name: "B", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { cv_sel: $.data.version }
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n1}", expected_case_version: "${cv_sel}" }
              as: CaseAdministrator
              captures: { cand: $.data.id }
          trigger:
            - call: "POST /candidates/${cand}/disclose"
              payload: { disclosure_text: "not mine", has_conflict: false }
              as: Neutral
              as_user_id: "${n2}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.error_id == ERR_UNAUTHORIZED"

      - name: unknown_role_returns_unauthenticated
        claim_type: cannot_perform
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          A request whose X-User-Role is not a known role returns 401 ERR_UNAUTHENTICATED.
        test_recipe:
          setup:
            - "One ARBITRATION case exists."
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "AuthCase", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /cases/${c_id}"
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.error_id == ERR_UNAUTHENTICATED"

      - name: neutral_can_read_case_shared_get
        claim_type: can_perform
        grounds:
          - roles.Neutral
          - roles.CaseAdministrator
        distinguishing_aspect: |
          GET /cases/{id} is a shared read; a Neutral can retrieve a case (200) even though case
          mutations are CaseAdministrator-only.
        test_recipe:
          setup:
            - "One ARBITRATION case and one rostered neutral."
          setup_api_calls:
            - call: "POST /neutrals"
              payload: { full_name: "Reader N", neutral_type: "ARBITRATOR", hourly_rate_cents: 50000 }
              as: CaseAdministrator
              captures: { n_id: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "SharedRead", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /cases/${c_id}"
              as: Neutral
              as_user_id: "${n_id}"
          assert:
            - "response.status == 200"
            - "Case.${c_id}.title == SharedRead"

  # ===========================================================================
  # Section 8 — Cross-Cutting Complexity Layers (optimistic_concurrency;
  #   cascading / dual-variant stubs)
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: add_candidate_stale_case_version_returns_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[candidate-add-stale-case]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          After one candidate add bumps Case.version, a second add still carrying the pre-add
          expected_case_version is rejected with 412 ERR_STALE_VERSION.
        test_recipe:
          setup:
            - "A SELECTION case; the client observed the version before adding candidate 1."
          setup_api_calls:
            - call: "POST /neutrals"
              payload: { full_name: "N1", neutral_type: "ARBITRATOR", hourly_rate_cents: 40000 }
              as: CaseAdministrator
              captures: { n1: $.data.id }
            - call: "POST /neutrals"
              payload: { full_name: "N2", neutral_type: "ARBITRATOR", hourly_rate_cents: 40000 }
              as: CaseAdministrator
              captures: { n2: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "StaleCand", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "RESPONDENT", display_name: "B", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { cv_sel: $.data.version }
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n1}", expected_case_version: "${cv_sel}" }
              as: CaseAdministrator
          trigger:
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n2}", expected_case_version: "${cv_sel}" }
              as: CaseAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.error_id == ERR_STALE_VERSION"

      - name: post_fee_charge_stale_case_version_returns_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[fee-charge-stale-case]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          After one fee charge bumps Case.version, a second charge still carrying the pre-charge
          expected_case_version is rejected with 412 ERR_STALE_VERSION (before any fiscal check).
        test_recipe:
          setup:
            - "An appointed HEARING case (rate 50000) with a PAID 500000 deposit; version observed before charge 1."
          setup_api_calls:
            - call: "POST /neutrals"
              payload: { full_name: "Sf N", neutral_type: "ARBITRATOR", hourly_rate_cents: 50000 }
              as: CaseAdministrator
              captures: { n_id: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "StaleFee", claim_amount_cents: 2000000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 50 }
              as: CaseAdministrator
              captures: { pA: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "RESPONDENT", display_name: "B", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { cv_sel: $.data.version }
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n_id}", expected_case_version: "${cv_sel}" }
              as: CaseAdministrator
              captures: { cand: $.data.id }
            - call: "POST /candidates/${cand}/disclose"
              payload: { disclosure_text: "none", has_conflict: false }
              as: Neutral
              as_user_id: "${n_id}"
            - call: "POST /candidates/${cand}/transition"
              payload: { to_status: "CLEARED" }
              as: CaseAdministrator
            - call: "GET /cases/${c_id}"
              as: CaseAdministrator
              captures: { cv_pre: $.data.version }
            - call: "POST /cases/${c_id}/appoint"
              payload: { expected_case_version: "${cv_pre}" }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "HEARING" }
              as: CaseAdministrator
            - call: "POST /deposits"
              payload: { case_id: "${c_id}", amount_cents: 500000 }
              as: CaseAdministrator
              captures: { dep: $.data.id }
            - call: "POST /deposits/${dep}/pay"
              as: Party
              as_user_id: "${pA}"
            - call: "GET /cases/${c_id}"
              as: CaseAdministrator
              captures: { cv_fee: $.data.version }
            - call: "POST /cases/${c_id}/fee-charges"
              payload: { neutral_id: "${n_id}", hours: 1, expected_case_version: "${cv_fee}" }
              as: CaseAdministrator
          trigger:
            - call: "POST /cases/${c_id}/fee-charges"
              payload: { neutral_id: "${n_id}", hours: 1, expected_case_version: "${cv_fee}" }
              as: CaseAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.error_id == ERR_STALE_VERSION"

      - name: candidate_add_increments_case_version
        claim_type: optimistic_concurrency
        grounds:
          - entities.Case.fields.version
          - concurrency_rules[candidate-add-stale-case]
        distinguishing_aspect: |
          A successful POST /cases/{id}/candidates with the current expected_case_version increments
          Case.version by exactly 1.
        test_recipe:
          setup:
            - "A SELECTION case; the current version captured just before the add."
          setup_api_calls:
            - call: "POST /neutrals"
              payload: { full_name: "Inc N", neutral_type: "ARBITRATOR", hourly_rate_cents: 40000 }
              as: CaseAdministrator
              captures: { n_id: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "IncCase", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "RESPONDENT", display_name: "B", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { cv_sel: $.data.version }
          trigger:
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n_id}", expected_case_version: "${cv_sel}" }
              as: CaseAdministrator
          assert:
            - "response.status == 201"
            - "Case.${c_id}.version == ${cv_sel} + 1"

      # ---- §1.8-covered corners (stubs) ----
      - name: appeal_grant_cascade_end_to_end_corner
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_GRANTED
          - state_machines.Award.ISSUED_to_VACATED
          - state_machines.Case.AWARD_ISSUED_to_HEARING
        excluded_because:
          difficulty_instance: transitive_cascade / appeal_grant_vacates_award_reverts_case_restores_balance
          rationale: "The 3-level appeal-grant cascade with balance restoration is asserted end-to-end by the named §1.8 instance."

      - name: filing_vs_final_dual_variant_corner
        claim_type: dual_variant_calculation
        grounds:
          - calculations.filing_fee
          - calculations.final_admin_fee
        excluded_because:
          difficulty_instance: dual_variant_calc / filing_fee_provisional_vs_final_admin_fee
          rationale: "The dual-variant provisional-vs-final admin fee is asserted by the named §1.8 instance."

  # ===========================================================================
  # Section 9 — Consistency Model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: deposit_pay_immediately_reflected_in_pay_response
        claim_type: immediate
        grounds:
          - state_machines.Deposit.REQUESTED_to_PAID
          - entities.Deposit.fields.status
          - entities.Deposit.fields.paid_at
        distinguishing_aspect: |
          The POST /deposits/{id}/pay response itself already shows status PAID and a non-null
          paid_at — the mutation is visible in the same request (immediate consistency).
        test_recipe:
          setup:
            - "A FILED case with a party pA and a REQUESTED 100000 deposit; clock 2026-06-05."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: CaseAdministrator
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "ImmDep", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 100 }
              as: CaseAdministrator
              captures: { pA: $.data.id }
            - call: "POST /deposits"
              payload: { case_id: "${c_id}", amount_cents: 100000 }
              as: CaseAdministrator
              captures: { dep: $.data.id }
          trigger:
            - call: "POST /deposits/${dep}/pay"
              as: Party
              as_user_id: "${pA}"
          assert:
            - "response.status == 200"
            - "Deposit.${dep}.status == PAID"
            - "Deposit.${dep}.paid_at == 2026-06-05T00:00:00Z"
