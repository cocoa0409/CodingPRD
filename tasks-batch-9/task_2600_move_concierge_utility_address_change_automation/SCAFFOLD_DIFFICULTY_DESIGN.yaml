  - rule_id: non_linear_state_machine
    instances:
      - name: utility_order_parallel_credit_and_provision_dimensions
        grounds:
          - state_machines.UtilityOrder.DRAFT_to_SCHEDULED
          - state_machines.UtilityOrder.SCHEDULED_to_ACTIVE_SERVICE
          - state_machines.UtilityOrder.PENDING_CHECK_to_DEPOSIT_DUE
          - state_machines.UtilityOrder.DEPOSIT_DUE_to_DEPOSIT_PAID
          - validations[priority=8]
        distinguishing_aspect: |
          UtilityOrder carries TWO independent state dimensions on one row (provision_status and
          credit_status): the row sits in the combined state SCHEDULED + DEPOSIT_DUE, a rejected activation
          moves neither dimension, paying the deposit advances only credit_status, and only then does
          activation advance only provision_status — the two dimensions never advance together.
