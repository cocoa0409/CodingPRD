  - rule_id: compensating_invariant
    instances:
      - name: lead_pool_conserved_across_assign_and_return
        grounds:
          - entities.Distributor.fields.lead_pool_available
          - state_machines.LeadAssignment.ASSIGNED_to_RETURNED
        distinguishing_aspect: |
          Conserved quantity: lead count. For the distributor,
          lead_pool_available + count(LeadAssignment status ASSIGNED) ==
          lead_pool_total before and after any sequence of assign/return pairs.
        test_recipe:
          setup:
            - "BRONZE contractor with ACTIVE cert; distributor pool_total 2 covering T1 and T2"
          setup_api_calls:
            - { call: "POST /program/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /program/contractors", payload: { legal_name: "Pool Co", license_number: "LIC-PL", license_expiry: "2035-01-01", insurance_expiry: "2035-01-01", territory_codes: ["T1", "T2"] }, as: ProgramAdmin, captures: { cpl_id: $.data.id } }
            - { call: "POST /program/training-courses", payload: { title: "Basics", credits: 4, validity_months: 36 }, as: ProgramAdmin, captures: { course_id: $.data.id } }
            - { call: "POST /program/training-enrollments", payload: { contractor_id: "${cpl_id}", course_id: "${course_id}" }, as: ProgramAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /program/training-enrollments/${enr_id}/complete", payload: { completed_at: "2026-09-01" }, as: ProgramAdmin }
            - { call: "POST /program/certifications", payload: { contractor_id: "${cpl_id}", tier: "BRONZE" }, as: Contractor, as_user_id: "${cpl_id}", captures: { cert_id: $.data.id } }
            - { call: "POST /program/certifications/${cert_id}/verify", payload: { decision: "APPROVE" }, as: ProgramAdmin }
            - { call: "POST /program/distributors", payload: { name: "Dist Pool", territory_codes: ["T1", "T2"], lead_pool_total: 2 }, as: ProgramAdmin, captures: { dist_id: $.data.id } }
          trigger:
            - { call: "GET /program/distributors/${dist_id}", payload: {}, as: ProgramAdmin, captures: { avail0: $.data.lead_pool_available } }
            - { call: "POST /program/lead-assignments", payload: { distributor_id: "${dist_id}", contractor_id: "${cpl_id}", territory_code: "T1", required_tier: "BRONZE", start_date: "2026-10-01", end_date: "2026-11-01" }, as: Distributor, as_user_id: "${dist_id}", captures: { lead1: $.data.id } }
            - { call: "GET /program/distributors/${dist_id}", payload: {}, as: ProgramAdmin, captures: { avail1: $.data.lead_pool_available } }
            - { call: "POST /program/lead-assignments/${lead1}/return", payload: {}, as: Distributor, as_user_id: "${dist_id}" }
            - { call: "GET /program/distributors/${dist_id}", payload: {}, as: ProgramAdmin, captures: { avail2: $.data.lead_pool_available } }
          assert:
            - "lead_pool_available == 2 before any assignment"
            - "lead_pool_available == 1 after the assign (2 - 1 ASSIGNED)"
            - "lead_pool_available == 2 after the return (assign + return conserves the pool; available + ASSIGNED count == lead_pool_total at every step)"

      - name: contractor_liability_conserved_across_adjudicate_and_reopen
        grounds:
          - calculations.remedy_split
          - state_machines.WarrantyClaim.RESOLVED_to_EVIDENCE_REVIEW
        distinguishing_aspect: |
          Conserved quantity: money on the contractor liability ledger. Adjudicating
          an INSTALLATION_ERROR claim adds contractor_liability_cents to
          outstanding_liability_cents; reopening the claim reverses exactly that
          amount, returning outstanding_liability_cents to its pre-adjudication
          value — a different conserved quantity type than the lead-count invariant.
        test_recipe:
          setup:
            - "BRONZE contractor, QUALIFYING_SYSTEM registration activated 2026-09-10 (4 x 25000 GAF lines), claim filed 2027-09-10 with labor 10000 and 2 photos; filing_workmanship_score snapshot is 100 (factor 1.00)"
          setup_api_calls:
