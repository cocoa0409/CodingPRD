# LessonEntry has no state machine: append-only log (common_fields: false).

# =============================================================================
# §1.2.1 Concurrency Rules (true races only; OCC on Program.version)
# =============================================================================
concurrency_rules:
  - rule_id: charter-approve-stale-program
    parent_entity: Program
    write_endpoint: "POST /charters/{id}/decide"
    occ_field: "expected_program_version"
    description: |
      Approving (or returning) a Charter while holding a stale Program version is
      rejected. This captures the case where another charter decision has advanced
      Program.version since the client last observed it — under product semantics a
      second SUBMITTED charter may legitimately be approved afterwards (superseding
      the first), so a stale view must be rejected explicitly via OCC.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
  - rule_id: baseline-approve-stale-program
    parent_entity: Program
    write_endpoint: "POST /baselines/{id}/decide"
    occ_field: "expected_program_version"
    description: |
      Approving (or returning) a Baseline while holding a stale Program version is
      rejected. This captures the case where another baseline decision has advanced
      Program.version since the client last observed it — a second SUBMITTED
      baseline may legitimately be approved afterwards (superseding the first and
      rewriting program budget fields), so a stale view must be rejected via OCC.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: risk_exposure_score
    trigger: "RiskEntry creation and every assess call"
    algorithm: threshold
    formula: |
      exposure_cents = round_half_up(probability_pct * impact_cents / 100)
      Landing status on assess:
        if exposure_cents >= ESCALATION_THRESHOLD_CENTS -> ESCALATED (from IDENTIFIED/MONITORING; stays ESCALATED from ESCALATED)
        else -> ASSESSED (from IDENTIFIED), MONITORING (from MONITORING), MONITORING (de-escalation from ESCALATED)
    input_set: "The single RiskEntry being created or assessed"
    constants:
      ESCALATION_THRESHOLD_CENTS: 50000000   # $500,000.00
    precision: "integer cents, round_half_up"

  - name: contingency_pool_recompute
    trigger: "Baseline approval; drawdown create/commit/draw/release; change order approve/void; risk realize"
    algorithm: aggregation
    formula: |
      reserved  = sum(amount_cents) over ContingencyDrawdown of program with status == RESERVED
      committed = sum(amount_cents) over ContingencyDrawdown of program with status == COMMITTED
      drawn     = sum(amount_cents) over ContingencyDrawdown of program with status == DRAWN
      available = contingency_total_cents - reserved - committed - drawn
      INVARIANT (conserved quantity): contingency_total_cents == reserved + committed + drawn + available at all times
    input_set: "All ContingencyDrawdown rows of the program in any status"
    precision: "integer cents"

  - name: contingency_posture_derivation
    trigger: "Every run of contingency_pool_recompute"
    algorithm: threshold
    formula: |
      if contingency_total_cents == 0: posture = CRITICAL
      else:
        ratio = contingency_available_cents / contingency_total_cents
        if ratio >= WATCH_FLOOR:   posture = NORMAL
        elif ratio >= CRITICAL_FLOOR: posture = WATCH
        else:                      posture = CRITICAL
      Boundary semantics: floors are inclusive (>=). ratio exactly 0.30 -> NORMAL; exactly 0.10 -> WATCH.
    input_set: "Program pool fields only"
    constants:
      WATCH_FLOOR: 0.30
      CRITICAL_FLOOR: 0.10
    precision: "ratio compared in exact integer arithmetic: available*100 >= floor_pct*total (no float rounding)"

  - name: contract_commitment_rollup
    trigger: "Contract execute; ChangeOrder approval (link 1); ChangeOrder void (compensation link 1)"
    algorithm: aggregation
    formula: |
      current_commitment_cents =
          awarded_amount_cents
        + sum(amount_cents) over ChangeOrders of this contract with status == APPROVED
        - sum(amount_cents) over ChangeOrders of this contract with status == VOID
      (VOID change orders were APPROVED when voided, so the pair nets to zero.)
      INVARIANT (conserved quantity): an approve followed by its void leaves current_commitment_cents unchanged.
    input_set: "All ChangeOrders of the contract in status APPROVED or VOID"
    precision: "integer cents"

  - name: change_order_cost_code_distribution
    trigger: "ChangeOrder approval (computed into allocated_lines)"
    algorithm: waterfall_allocation
    formula: |
      Let the APPROVED baseline's lines be L[1..n] with amounts a[i]; W = sum(a[i]).
      For CO amount A:
        exact[i] = A * a[i] / W                (exact rational)
        share[i] = round_half_up(exact[i])     # per-line rounding FIRST
        delta = A - sum(share[i])
        if delta != 0:
          # remainder goes to a single line, chosen deterministically:
          # delta > 0: line with the largest fractional part of exact[i]
          # delta < 0: line with the smallest fractional part of exact[i]
          # ties broken by cost_code ascending (lexicographic); never by id
          adjust that line's share by delta
      allocated_lines = [{cost_code: L[i].cost_code, allocated_cents: share[i]}]
      PINNED ROUNDING ORDER: per-line round_half_up FIRST, then single-line remainder adjustment.
      ("sum then round" of partial allocations is a different, forbidden order.)
    input_set: "Lines of the program's currently APPROVED Baseline"
    precision: "integer cents, round_half_up per line"

  - name: cost_to_complete_forecast
    trigger: "OwnerReport creation; OwnerReport submit/resubmit; system refresh of DRAFT reports on any pool/posture/commitment cascade"
    algorithm: forward_looking
    formula: |
      EVALUATION ORDER (pinned, resolves the apparent pool<->posture<->forecast circularity):
        step 1: run contingency_pool_recompute (pool fields exclude all pending change orders)
        step 2: run contingency_posture_derivation on the step-1 pool
        step 3: compute both EAC variants using the step-2 posture
      Shared inputs:
        committed = sum(current_commitment_cents) over Contracts with status == EXECUTED
        estimated = sum over Contracts with status == SOLICITED of solicitation_estimate_cents
                  + sum over Contracts with status == UNDER_NEGOTIATION of solicitation_estimate_cents
                  + sum over Contracts with status == COUNTERED of latest_counter_amount_cents
        risk exposures considered: RiskEntries with status in {ASSESSED, MITIGATING, MONITORING, ESCALATED}
          (IDENTIFIED excluded as unassessed; REALIZED and CLOSED excluded)
        pending_co = sum(amount_cents) over ChangeOrders with status in {UNDER_REVIEW, RECOMMEND_APPROVAL, RECOMMEND_REJECTION}
          (DRAFT excluded: not yet submitted)
      Variant COMMITMENT_BASED (optimistic book-of-record):
        eac = committed + estimated + sum(exposure_cents)    # full exposure, multiplier 1.0 for every considered status
      Variant TREND_BASED (risk-adjusted):
        weighted_exposure = sum over considered risks of exposure_cents * MULTIPLIER(status)
          MULTIPLIER: ESCALATED 1.00, MONITORING 0.50, MITIGATING 0.35, ASSESSED 0.25
        pending_allowance = pending_co * (1.00 if posture == CRITICAL else 0.50)
        eac_raw = committed + estimated + weighted_exposure + pending_allowance
        eac = max(eac_raw, committed)    # floor: EAC never below already-committed value
      budget_variance_commitment_cents = current_budget_cents - eac_commitment_based_cents
      budget_variance_trend_cents      = current_budget_cents - eac_trend_based_cents
    input_set: "Contracts in {SOLICITED, UNDER_NEGOTIATION, COUNTERED, EXECUTED}; RiskEntries in {ASSESSED, MITIGATING, MONITORING, ESCALATED}; ChangeOrders in {UNDER_REVIEW, RECOMMEND_APPROVAL, RECOMMEND_REJECTION}; Program pool + posture"
    precision: "integer cents; multipliers applied as exact rational arithmetic before final round_half_up"
    variants:
      - name: COMMITMENT_BASED
        when: "Always computed into OwnerReport.eac_commitment_based_cents"
        difference: "Full (unweighted) risk exposure; no pending-CO allowance; no floor"
      - name: TREND_BASED
        when: "Always computed into OwnerReport.eac_trend_based_cents"
        difference: "Status-weighted risk exposure; pending-CO allowance keyed on posture; floored at committed"

  - name: move_in_readiness
    trigger: "OccupancyPlan mark-ready; MoveInWave complete; MoveInWave cancel"
    algorithm: weighted_scoring
    formula: |
      Consider the plan's MoveInWaves with status in {SCHEDULED, CONFIRMED, COMPLETE} (CANCELLED excluded).
      done(w) = 1 if w.status == COMPLETE else 0
      Variant UNWEIGHTED:
        readiness_unweighted_pct = round_half_up(100 * sum(done) / count, 2)  (0.00 when count == 0)
      Variant WEIGHTED:
        readiness_weighted_pct = round_half_up(100 * sum(done(w)*criticality_weight) / sum(criticality_weight), 2)
        (0.00 when no considered waves)
    input_set: "MoveInWaves of the plan with status != CANCELLED"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: UNWEIGHTED
        when: "Computed into OccupancyPlan.readiness_unweighted_pct"
        difference: "Every wave counts equally"
      - name: WEIGHTED
        when: "Computed into OccupancyPlan.readiness_weighted_pct"
        difference: "Waves weighted by criticality_weight"

  - name: engagement_daily_load
    trigger: "EngagementItem schedule (validation support)"
    algorithm: aggregation
    formula: |
      Let D = UTC calendar date of the candidate engagement's scheduled_start.
      load = sum(duration_minutes) over the group's SCHEDULED engagements whose scheduled_start UTC date == D
      reject if load + candidate.duration_minutes > ENGAGEMENT_DAILY_CAP_MINUTES
      Boundary: load + duration exactly == cap is ALLOWED (cap is inclusive).
    input_set: "The candidate engagement's StakeholderGroup and its SCHEDULED engagements"
    constants:
      ENGAGEMENT_DAILY_CAP_MINUTES: 360
    precision: "whole minutes"

  - name: dock_occupancy_conflict
    trigger: "MoveInWave creation; MoveInWave confirm (re-check)"
    algorithm: interval_merge
    formula: |
      Candidate wave W on dock resource R. Consider all waves W' with
      W'.dock_resource == R, W'.occupancy_plan.program_id == W.program_id,
      W'.status in {SCHEDULED, CONFIRMED} (CANCELLED/COMPLETE-free: COMPLETE still counts until freed?
      No — COMPLETE waves no longer occupy the dock; only SCHEDULED and CONFIRMED occupy).
      Half-open occupation [move_start, move_end) extended by a turnover buffer on the end:
        occupied(W') = [W'.move_start, W'.move_end + TURNOVER_BUFFER_HOURS)
      conflict iff W.move_start < occupied_end(W') AND W'.move_start < W.move_end + TURNOVER_BUFFER_HOURS
      Boundary: a wave starting exactly at the prior wave's move_end + TURNOVER_BUFFER_HOURS is ALLOWED
      (strict < comparison); one minute earlier conflicts.
    input_set: "Non-terminal occupying waves (SCHEDULED, CONFIRMED) on the same dock_resource within the same program"
    constants:
      TURNOVER_BUFFER_HOURS: 2
    precision: "minute resolution"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first match wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers must both be present and non-empty; X-User-Role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "X-User-Role must be authorized for the endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Request body shape: required fields present, types match, enum values valid, amounts positive integers, scheduled_end > scheduled_start / move_end > move_start"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"
  - priority: 4
    category: existence
    check: "Resource ids in path must exist (left-to-right); then body-supplied FK ids must exist"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_CHARTER_NOT_FOUND | ERR_BASELINE_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_CHANGE_ORDER_NOT_FOUND | ERR_RISK_ENTRY_NOT_FOUND | ERR_DRAWDOWN_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_STAKEHOLDER_GROUP_NOT_FOUND | ERR_ENGAGEMENT_NOT_FOUND | ERR_OCCUPANCY_PLAN_NOT_FOUND | ERR_WAVE_NOT_FOUND | ERR_CLOSEOUT_ITEM_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids or body FK ids"
  - priority: 5
    category: state
    check: "Target and parent entities must be in a state from which the requested transition exists (state machine from-state); program lifecycle gates (e.g. ACTIVE-only creation); posture gate on change-order submit"
    error_id: "ERR_INVALID_TRANSITION | ERR_PROGRAM_NOT_ACTIVE | ERR_NO_APPROVED_CHARTER | ERR_NO_APPROVED_BASELINE | ERR_CONTRACT_NOT_EXECUTED | ERR_OPEN_CHANGE_ORDERS_EXIST | ERR_PROGRAM_HAS_OPEN_ITEMS | ERR_CLOSEOUT_INCOMPLETE | ERR_LESSON_ENTRIES_REQUIRED | ERR_CONTINGENCY_POSTURE_CRITICAL | ERR_PLAN_NOT_READY | ERR_PLAN_NOT_ACCEPTING_WAVES | ERR_OPEN_WAVES_EXIST"
    http_status: 409
    applies_to: "state transition endpoints and state-gated creations"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: contract executor must differ from negotiator_user_id; CO decider must differ from recommended_by_user_id; report accepter must differ from submitted_by_user_id; closeout verifier must differ from submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /contracts/{id}/execute, POST /change-orders/{id}/decide, POST /owner-reports/{id}/accept, POST /closeout-items/{id}/verify"
  - priority: 7
    category: business_referential
    check: "Body FKs must be co-resident in the same program (wave's stakeholder_group must belong to the plan's program); CO supersedes_id must reference an UNDER_REVIEW change order on the same contract"
    error_id: "ERR_CROSS_PROGRAM_REFERENCE | ERR_SUPERSEDES_TARGET_INVALID"
    http_status: 409
    applies_to: "POST /move-in-waves, POST /change-orders"
  - priority: 8
    category: business_temporal
    check: "Interval occupation checks: dock overlap (half-open + 2h turnover buffer) on wave create/confirm; engagement closed-interval overlap (touching endpoints conflict) then daily cap (inclusive 360 minutes) on engagement schedule"
    error_id: "ERR_DOCK_OVERLAP | ERR_ENGAGEMENT_OVERLAP | ERR_ENGAGEMENT_DAILY_CAP_EXCEEDED"
    http_status: 409
    applies_to: "POST /move-in-waves, POST /move-in-waves/{id}/confirm, POST /engagements/{id}/schedule"
  - priority: 9
    category: business_constraint
    check: "Uniqueness: at most one OwnerReport per (program_id, period)"
    error_id: ERR_DUPLICATE_REPORT_PERIOD
    http_status: 409
    applies_to: "POST /owner-reports"
  - priority: 10
    category: business_fiscal
    check: "Fiscal limits: awarded_amount_cents <= uncommitted budget on execute; drawdown amount_cents <= contingency_available_cents on manual reserve; CO amount_cents <= contingency_available_cents on approve; actual_loss_cents <= contingency_available_cents on realize; rebaseline may not undercut outstanding pool commitments"
    error_id: "ERR_AWARD_EXCEEDS_BUDGET | ERR_CONTINGENCY_EXCEEDED | ERR_BASELINE_UNDERCUTS_COMMITMENTS"
    http_status: 402
    applies_to: "POST /contracts/{id}/execute, POST /contingency-drawdowns, POST /change-orders/{id}/decide, POST /risk-entries/{id}/realize, POST /baselines/{id}/decide"

# =============================================================================
# §1.5 API Endpoint Table (80 endpoints, flat topology)
# All list endpoints accept optional limit/offset pagination params in addition
# to the filter inputs listed. All roles may call all GET endpoints.
# =============================================================================
endpoints:
  # --- Program ---
  - { method: POST, path: "/programs", description: "Create a program (status CHARTERING; pool fields 0; posture CRITICAL until a baseline is approved)", roles: [OwnerRepPM], code: 201, input: [program_name, owner_organization], output: Program, side_effects: [] }
  - { method: GET, path: "/programs", description: "List programs", roles: [OwnerRepPM, OwnerRepExecutive, Owner], code: 200, input: ["status?", "limit?", "offset?"], output: "Program[]", side_effects: [] }
  - { method: GET, path: "/programs/{id}", description: "Get one program (pool fields, posture, version)", roles: [OwnerRepPM, OwnerRepExecutive, Owner], code: 200, input: [], output: Program, side_effects: [] }
  - { method: POST, path: "/programs/{id}/activate", description: "CHARTERING -> ACTIVE; requires approved charter + approved baseline", roles: [OwnerRepPM], code: 200, input: [], output: Program, side_effects: ["status -> ACTIVE", "increments Program.version by 1"] }
  - { method: POST, path: "/programs/{id}/begin-closing", description: "ACTIVE -> CLOSING; zero-open-items gate", roles: [OwnerRepPM], code: 200, input: [], output: Program, side_effects: ["status -> CLOSING", "increments Program.version by 1"] }
  - { method: POST, path: "/programs/{id}/close", description: "CLOSING -> CLOSED; closeout + lessons gates", roles: [Owner], code: 200, input: [], output: Program, side_effects: ["status -> CLOSED", "increments Program.version by 1"] }
  - { method: POST, path: "/programs/{id}/reopen", description: "CLOSING -> ACTIVE", roles: [OwnerRepPM], code: 200, input: [], output: Program, side_effects: ["status -> ACTIVE", "increments Program.version by 1"] }

  # --- Charter ---
  - { method: POST, path: "/charters", description: "Create DRAFT charter (version_no = max existing for program + 1); program must be CHARTERING or ACTIVE", roles: [OwnerRepPM], code: 201, input: [program_id, objectives, scope_statement], output: Charter, side_effects: ["increments Program.version by 1"] }
  - { method: GET, path: "/charters", description: "List charters (filterable)", roles: [OwnerRepPM, OwnerRepExecutive, Owner], code: 200, input: ["program_id?", "status?", "limit?", "offset?"], output: "Charter[]", side_effects: [] }
  - { method: GET, path: "/charters/{id}", description: "Get one charter", roles: [OwnerRepPM, OwnerRepExecutive, Owner], code: 200, input: [], output: Charter, side_effects: [] }
  - { method: POST, path: "/charters/{id}/submit", description: "DRAFT -> SUBMITTED", roles: [OwnerRepPM], code: 200, input: [], output: Charter, side_effects: ["submitted_by_user_id := X-User-ID", "increments Program.version by 1"] }
  - { method: POST, path: "/charters/{id}/decide", description: "Owner decision: APPROVE (supersedes prior APPROVED charter) or RETURN; OCC on Program.version", roles: [Owner], code: 200, input: [decision, expected_program_version, "return_note?"], output: Charter, side_effects: ["on APPROVE: prior APPROVED charter -> SUPERSEDED; Program.approved_charter_id updated", "increments Program.version by 1"] }
  - { method: POST, path: "/charters/{id}/revise", description: "RETURNED -> DRAFT with optional field replacement", roles: [OwnerRepPM], code: 200, input: ["objectives?", "scope_statement?"], output: Charter, side_effects: ["increments Program.version by 1"] }

  # --- Baseline ---
  - { method: POST, path: "/baselines", description: "Create DRAFT baseline (version_no per program); lines must sum to total_budget_cents; program CHARTERING or ACTIVE", roles: [OwnerRepPM], code: 201, input: [program_id, total_budget_cents, contingency_total_cents, target_finish_date, lines], output: Baseline, side_effects: ["increments Program.version by 1"] }
  - { method: GET, path: "/baselines", description: "List baselines (filterable)", roles: [OwnerRepPM, OwnerRepExecutive, Owner], code: 200, input: ["program_id?", "status?", "limit?", "offset?"], output: "Baseline[]", side_effects: [] }
  - { method: GET, path: "/baselines/{id}", description: "Get one baseline", roles: [OwnerRepPM, OwnerRepExecutive, Owner], code: 200, input: [], output: Baseline, side_effects: [] }
  - { method: POST, path: "/baselines/{id}/submit", description: "DRAFT -> SUBMITTED", roles: [OwnerRepPM], code: 200, input: [], output: Baseline, side_effects: ["submitted_by_user_id := X-User-ID", "increments Program.version by 1"] }
  - { method: POST, path: "/baselines/{id}/decide", description: "Owner decision: APPROVE (supersedes prior approved baseline; rewrites program budget + pool; recomputes posture; refreshes DRAFT reports) or RETURN; OCC on Program.version; fiscal undercut check", roles: [Owner], code: 200, input: [decision, expected_program_version, "return_note?"], output: Baseline, side_effects: ["on APPROVE: prior APPROVED baseline -> SUPERSEDED; Program budget/contingency fields set; pool recompute; posture recompute; DRAFT report refresh", "increments Program.version by 1"] }
  - { method: POST, path: "/baselines/{id}/revise", description: "RETURNED -> DRAFT with optional field replacement", roles: [OwnerRepPM], code: 200, input: ["total_budget_cents?", "contingency_total_cents?", "target_finish_date?", "lines?"], output: Baseline, side_effects: ["increments Program.version by 1"] }

  # --- Contract ---
  - { method: POST, path: "/contracts", description: "Create contract in SOLICITED; program must be ACTIVE", roles: [OwnerRepPM], code: 201, input: [program_id, vendor_name, contract_type, solicitation_estimate_cents], output: Contract, side_effects: [] }
  - { method: GET, path: "/contracts", description: "List contracts (filterable)", roles: [OwnerRepPM, OwnerRepExecutive, Owner], code: 200, input: ["program_id?", "status?", "limit?", "offset?"], output: "Contract[]", side_effects: [] }
  - { method: GET, path: "/contracts/{id}", description: "Get one contract", roles: [OwnerRepPM, OwnerRepExecutive, Owner], code: 200, input: [], output: Contract, side_effects: [] }
  - { method: POST, path: "/contracts/{id}/begin-negotiation", description: "SOLICITED -> UNDER_NEGOTIATION; captures negotiator_user_id", roles: [OwnerRepPM], code: 200, input: [], output: Contract, side_effects: ["negotiator_user_id := X-User-ID"] }
  - { method: POST, path: "/contracts/{id}/counter", description: "Negotiation round: UNDER_NEGOTIATION -> COUNTERED or COUNTERED -> UNDER_NEGOTIATION; records counter amount, increments negotiation_rounds", roles: [OwnerRepPM], code: 200, input: [counter_amount_cents], output: Contract, side_effects: ["latest_counter_amount_cents updated", "negotiation_rounds += 1"] }
  - { method: POST, path: "/contracts/{id}/execute", description: "UNDER_NEGOTIATION|COUNTERED -> EXECUTED; SoD vs negotiator; fiscal uncommitted-budget check", roles: [OwnerRepExecutive], code: 200, input: [awarded_amount_cents], output: Contract, side_effects: ["awarded_amount_cents set", "current_commitment_cents := awarded_amount_cents", "executed_by_user_id := X-User-ID"] }
  - { method: POST, path: "/contracts/{id}/complete", description: "EXECUTED -> COMPLETED; requires no open change orders", roles: [OwnerRepPM], code: 200, input: [], output: Contract, side_effects: [] }

  # --- ChangeOrder ---
  - { method: POST, path: "/change-orders", description: "Create DRAFT change order against a contract; program_id derived from contract; optional supersedes_id auto-rejects an UNDER_REVIEW predecessor on the same contract", roles: [OwnerRepPM], code: 201, input: [contract_id, title, reason, amount_cents, "supersedes_id?"], output: ChangeOrder, side_effects: ["if supersedes_id present: predecessor -> REJECTED with superseded_by_id set"] }
  - { method: GET, path: "/change-orders", description: "List change orders (filterable; supersedes_id finds successors of a CO, superseded_by_id finds the predecessor of a CO, linked_drawdown_id finds the CO funded by a drawdown)", roles: [OwnerRepPM, OwnerRepExecutive, Owner], code: 200, input: ["program_id?", "contract_id?", "supersedes_id?", "superseded_by_id?", "linked_drawdown_id?", "status?", "limit?", "offset?"], output: "ChangeOrder[]", side_effects: [] }
  - { method: GET, path: "/change-orders/{id}", description: "Get one change order", roles: [OwnerRepPM, OwnerRepExecutive, Owner], code: 200, input: [], output: ChangeOrder, side_effects: [] }
  - { method: POST, path: "/change-orders/{id}/submit", description: "DRAFT -> UNDER_REVIEW; requires contract EXECUTED and posture != CRITICAL", roles: [OwnerRepPM], code: 200, input: [], output: ChangeOrder, side_effects: [] }
  - { method: POST, path: "/change-orders/{id}/request-revision", description: "UNDER_REVIEW -> DRAFT (revision loop)", roles: [OwnerRepPM], code: 200, input: [revision_note], output: ChangeOrder, side_effects: ["revision_note set"] }
  - { method: POST, path: "/change-orders/{id}/recommend", description: "UNDER_REVIEW -> RECOMMEND_APPROVAL or RECOMMEND_REJECTION", roles: [OwnerRepPM], code: 200, input: [recommendation, analysis_note], output: ChangeOrder, side_effects: ["recommended_by_user_id := X-User-ID"] }
  - { method: POST, path: "/change-orders/{id}/decide", description: "Owner decision from either RECOMMEND_* state: APPROVE (runs 4-link cascade: commitment -> auto COMMITTED drawdown -> pool/posture -> DRAFT report refresh; computes allocated_lines) or REJECT; SoD vs recommender", roles: [Owner], code: 200, input: [decision], output: ChangeOrder, side_effects: ["on APPROVE: full approval cascade (see state machine)", "decided_by_user_id := X-User-ID"] }
  - { method: POST, path: "/change-orders/{id}/void", description: "APPROVED -> VOID; full compensation cascade (commitment debit reversed, linked drawdown RELEASED, pool/posture recompute, DRAFT report refresh)", roles: [Owner], code: 200, input: [void_reason], output: ChangeOrder, side_effects: ["compensation cascade (see state machine)"] }

  # --- RiskEntry ---
  - { method: POST, path: "/risk-entries", description: "Create risk in IDENTIFIED; exposure_cents computed immediately; program must be ACTIVE", roles: [OwnerRepPM], code: 201, input: [program_id, title, category, probability_pct, impact_cents], output: RiskEntry, side_effects: ["exposure_cents computed"] }
  - { method: GET, path: "/risk-entries", description: "List risk register entries (filterable; linked_drawdown_id finds the risk funded by a drawdown)", roles: [OwnerRepPM, OwnerRepExecutive, Owner], code: 200, input: ["program_id?", "status?", "linked_drawdown_id?", "limit?", "offset?"], output: "RiskEntry[]", side_effects: [] }
  - { method: GET, path: "/risk-entries/{id}", description: "Get one risk entry", roles: [OwnerRepPM, OwnerRepExecutive, Owner], code: 200, input: [], output: RiskEntry, side_effects: [] }
  - { method: POST, path: "/risk-entries/{id}/assess", description: "Assess/re-assess: updates probability+impact, recomputes exposure, lands ASSESSED/ESCALATED/MONITORING per threshold and current state", roles: [OwnerRepPM], code: 200, input: [probability_pct, impact_cents], output: RiskEntry, side_effects: ["exposure_cents recomputed", "status per threshold rule"] }
  - { method: POST, path: "/risk-entries/{id}/mitigate", description: "ASSESSED|ESCALATED -> MITIGATING", roles: [OwnerRepPM], code: 200, input: [mitigation_plan], output: RiskEntry, side_effects: ["mitigation_plan set"] }
  - { method: POST, path: "/risk-entries/{id}/monitor", description: "MITIGATING -> MONITORING", roles: [OwnerRepPM], code: 200, input: [], output: RiskEntry, side_effects: [] }
  - { method: POST, path: "/risk-entries/{id}/realize", description: "ESCALATED|MONITORING -> REALIZED; fiscal check; auto-creates COMMITTED drawdown; pool/posture recompute; DRAFT report refresh", roles: [OwnerRepPM], code: 200, input: [actual_loss_cents], output: RiskEntry, side_effects: ["realization cascade (see state machine)"] }
  - { method: POST, path: "/risk-entries/{id}/close", description: "ASSESSED|MITIGATING|MONITORING -> CLOSED", roles: [OwnerRepPM], code: 200, input: [], output: RiskEntry, side_effects: [] }

  # --- ContingencyDrawdown ---
  - { method: POST, path: "/contingency-drawdowns", description: "Manual reserve: create drawdown in RESERVED (source MANUAL_RESERVE); amount must be <= contingency_available_cents (equality allowed: exact drain to zero succeeds)", roles: [OwnerRepPM], code: 201, input: [program_id, purpose, amount_cents], output: ContingencyDrawdown, side_effects: ["Program.reserved += amount; available -= amount", "posture recompute", "DRAFT report refresh"] }
  - { method: GET, path: "/contingency-drawdowns", description: "List drawdowns (filterable by program, linked risk, linked change order, status)", roles: [OwnerRepPM, OwnerRepExecutive, Owner], code: 200, input: ["program_id?", "risk_entry_id?", "change_order_id?", "status?", "limit?", "offset?"], output: "ContingencyDrawdown[]", side_effects: [] }
  - { method: GET, path: "/contingency-drawdowns/{id}", description: "Get one drawdown", roles: [OwnerRepPM, OwnerRepExecutive, Owner], code: 200, input: [], output: ContingencyDrawdown, side_effects: [] }
  - { method: POST, path: "/contingency-drawdowns/{id}/commit", description: "RESERVED -> COMMITTED (reserved -> committed)", roles: [OwnerRepPM], code: 200, input: [], output: ContingencyDrawdown, side_effects: ["pool recompute", "posture recompute", "DRAFT report refresh"] }
  - { method: POST, path: "/contingency-drawdowns/{id}/draw", description: "COMMITTED -> DRAWN (committed -> drawn)", roles: [OwnerRepPM], code: 200, input: [], output: ContingencyDrawdown, side_effects: ["pool recompute", "posture recompute", "DRAFT report refresh"] }
  - { method: POST, path: "/contingency-drawdowns/{id}/release", description: "RESERVED|COMMITTED -> RELEASED (returns amount to available)", roles: [OwnerRepPM], code: 200, input: [], output: ContingencyDrawdown, side_effects: ["pool recompute", "posture recompute", "DRAFT report refresh"] }

  # --- OwnerReport ---
  - { method: POST, path: "/owner-reports", description: "Create monthly owner report in DRAFT for a period; computes both EAC variants, variances, posture + baseline snapshots from current state; unique (program_id, period); program must be ACTIVE", roles: [OwnerRepPM], code: 201, input: [program_id, period], output: OwnerReport, side_effects: ["forecast fields computed (calculations.cost_to_complete_forecast)"] }
  - { method: GET, path: "/owner-reports", description: "List owner reports (filterable)", roles: [OwnerRepPM, OwnerRepExecutive, Owner], code: 200, input: ["program_id?", "status?", "period?", "limit?", "offset?"], output: "OwnerReport[]", side_effects: [] }
  - { method: GET, path: "/owner-reports/{id}", description: "Get one owner report", roles: [OwnerRepPM, OwnerRepExecutive, Owner], code: 200, input: [], output: OwnerReport, side_effects: [] }
  - { method: POST, path: "/owner-reports/{id}/submit", description: "DRAFT|RETURNED -> SUBMITTED; recomputes then freezes forecast fields", roles: [OwnerRepPM], code: 200, input: [], output: OwnerReport, side_effects: ["forecast recompute + freeze", "submitted_by_user_id := X-User-ID"] }
  - { method: POST, path: "/owner-reports/{id}/accept", description: "SUBMITTED -> ACCEPTED; SoD vs submitter; snapshot permanently frozen", roles: [Owner], code: 200, input: [], output: OwnerReport, side_effects: ["accepted_by_user_id + accepted_at set"] }
  - { method: POST, path: "/owner-reports/{id}/return", description: "SUBMITTED -> RETURNED (revision loop)", roles: [Owner], code: 200, input: [return_note], output: OwnerReport, side_effects: ["return_note set"] }

  # --- StakeholderGroup ---
  - { method: POST, path: "/stakeholder-groups", description: "Create stakeholder/user group; program must be ACTIVE", roles: [OwnerRepPM], code: 201, input: [program_id, group_name, group_type, contact_email], output: StakeholderGroup, side_effects: [] }
  - { method: GET, path: "/stakeholder-groups", description: "List stakeholder groups (filterable)", roles: [OwnerRepPM, OwnerRepExecutive, Owner], code: 200, input: ["program_id?", "group_type?", "limit?", "offset?"], output: "StakeholderGroup[]", side_effects: [] }
  - { method: GET, path: "/stakeholder-groups/{id}", description: "Get one stakeholder group", roles: [OwnerRepPM, OwnerRepExecutive, Owner], code: 200, input: [], output: StakeholderGroup, side_effects: [] }

  # --- EngagementItem ---
  - { method: POST, path: "/engagements", description: "Create engagement in PROPOSED against a group; program_id derived from group; no overlap check until schedule", roles: [OwnerRepPM], code: 201, input: [stakeholder_group_id, title, scheduled_start, scheduled_end], output: EngagementItem, side_effects: ["duration_minutes computed"] }
  - { method: GET, path: "/engagements", description: "List engagements (filterable)", roles: [OwnerRepPM, OwnerRepExecutive, Owner], code: 200, input: ["program_id?", "stakeholder_group_id?", "status?", "limit?", "offset?"], output: "EngagementItem[]", side_effects: [] }
  - { method: GET, path: "/engagements/{id}", description: "Get one engagement", roles: [OwnerRepPM, OwnerRepExecutive, Owner], code: 200, input: [], output: EngagementItem, side_effects: [] }
  - { method: POST, path: "/engagements/{id}/schedule", description: "PROPOSED -> SCHEDULED; closed-interval overlap (touching endpoints conflict) then inclusive 360-minute daily cap per group per UTC date", roles: [OwnerRepPM], code: 200, input: [], output: EngagementItem, side_effects: [] }
  - { method: POST, path: "/engagements/{id}/complete", description: "SCHEDULED -> HELD", roles: [OwnerRepPM], code: 200, input: [], output: EngagementItem, side_effects: [] }
  - { method: POST, path: "/engagements/{id}/cancel", description: "PROPOSED|SCHEDULED -> CANCELLED; frees slot and daily-cap minutes", roles: [OwnerRepPM], code: 200, input: [], output: EngagementItem, side_effects: [] }

  # --- OccupancyPlan ---
  - { method: POST, path: "/occupancy-plans", description: "Create occupancy plan in PLANNING; program must be CHARTERING or ACTIVE", roles: [OwnerRepPM], code: 201, input: [program_id, plan_name, target_move_month], output: OccupancyPlan, side_effects: [] }
  - { method: GET, path: "/occupancy-plans", description: "List occupancy plans (filterable)", roles: [OwnerRepPM, OwnerRepExecutive, Owner], code: 200, input: ["program_id?", "status?", "limit?", "offset?"], output: "OccupancyPlan[]", side_effects: [] }
  - { method: GET, path: "/occupancy-plans/{id}", description: "Get one occupancy plan (includes readiness scores)", roles: [OwnerRepPM, OwnerRepExecutive, Owner], code: 200, input: [], output: OccupancyPlan, side_effects: [] }
  - { method: POST, path: "/occupancy-plans/{id}/coordinate", description: "PLANNING -> COORDINATING; also READY -> COORDINATING (re-plan loop)", roles: [OwnerRepPM], code: 200, input: [], output: OccupancyPlan, side_effects: [] }
  - { method: POST, path: "/occupancy-plans/{id}/mark-ready", description: "COORDINATING -> READY; requires an APPROVED baseline; computes both readiness variants", roles: [OwnerRepPM], code: 200, input: [], output: OccupancyPlan, side_effects: ["readiness scores computed (calculations.move_in_readiness)"] }
  - { method: POST, path: "/occupancy-plans/{id}/execute", description: "READY -> EXECUTING", roles: [OwnerRepPM], code: 200, input: [], output: OccupancyPlan, side_effects: [] }
  - { method: POST, path: "/occupancy-plans/{id}/complete", description: "EXECUTING -> COMPLETE; all waves must be terminal", roles: [OwnerRepPM], code: 200, input: [], output: OccupancyPlan, side_effects: [] }

  # --- MoveInWave ---
  - { method: POST, path: "/move-in-waves", description: "Create wave in SCHEDULED; program_id derived from plan; plan must be COORDINATING/READY/EXECUTING; group must belong to plan's program; dock half-open+buffer overlap check", roles: [OwnerRepPM], code: 201, input: [occupancy_plan_id, stakeholder_group_id, wave_name, dock_resource, move_start, move_end, criticality_weight], output: MoveInWave, side_effects: ["dock occupation recorded"] }
  - { method: GET, path: "/move-in-waves", description: "List waves (filterable by plan, group, program, status)", roles: [OwnerRepPM, OwnerRepExecutive, Owner], code: 200, input: ["occupancy_plan_id?", "stakeholder_group_id?", "program_id?", "status?", "limit?", "offset?"], output: "MoveInWave[]", side_effects: [] }
  - { method: GET, path: "/move-in-waves/{id}", description: "Get one wave", roles: [OwnerRepPM, OwnerRepExecutive, Owner], code: 200, input: [], output: MoveInWave, side_effects: [] }
  - { method: POST, path: "/move-in-waves/{id}/confirm", description: "SCHEDULED -> CONFIRMED; plan must be READY or EXECUTING; dock overlap re-check", roles: [OwnerRepPM], code: 200, input: [], output: MoveInWave, side_effects: [] }
  - { method: POST, path: "/move-in-waves/{id}/complete", description: "CONFIRMED -> COMPLETE; frees dock; recomputes plan readiness", roles: [OwnerRepPM], code: 200, input: [], output: MoveInWave, side_effects: ["plan readiness recompute"] }
  - { method: POST, path: "/move-in-waves/{id}/cancel", description: "SCHEDULED|CONFIRMED -> CANCELLED; frees dock; recomputes plan readiness", roles: [OwnerRepPM], code: 200, input: [], output: MoveInWave, side_effects: ["plan readiness recompute"] }

  # --- CloseoutItem ---
  - { method: POST, path: "/closeout-items", description: "Create closeout checklist item in OPEN; program must be ACTIVE or CLOSING", roles: [OwnerRepPM], code: 201, input: [program_id, item_type, title], output: CloseoutItem, side_effects: [] }
  - { method: GET, path: "/closeout-items", description: "List closeout items (filterable)", roles: [OwnerRepPM, OwnerRepExecutive, Owner], code: 200, input: ["program_id?", "item_type?", "status?", "limit?", "offset?"], output: "CloseoutItem[]", side_effects: [] }
  - { method: GET, path: "/closeout-items/{id}", description: "Get one closeout item", roles: [OwnerRepPM, OwnerRepExecutive, Owner], code: 200, input: [], output: CloseoutItem, side_effects: [] }
  - { method: POST, path: "/closeout-items/{id}/submit", description: "OPEN -> SUBMITTED", roles: [OwnerRepPM], code: 200, input: [], output: CloseoutItem, side_effects: ["submitted_by_user_id := X-User-ID"] }
  - { method: POST, path: "/closeout-items/{id}/verify", description: "SUBMITTED -> VERIFIED; SoD vs submitter", roles: [OwnerRepExecutive], code: 200, input: [], output: CloseoutItem, side_effects: ["verified_by_user_id := X-User-ID"] }
  - { method: POST, path: "/closeout-items/{id}/reject", description: "SUBMITTED -> OPEN (rework loop)", roles: [OwnerRepExecutive], code: 200, input: [rejection_note], output: CloseoutItem, side_effects: ["rejection_note set"] }

  # --- LessonEntry (append-only) ---
  - { method: POST, path: "/lesson-entries", description: "Append a lessons-learned entry; program must be ACTIVE or CLOSING; entries are immutable (no update/delete)", roles: [OwnerRepPM], code: 201, input: [program_id, category, lesson_text, recommendation], output: LessonEntry, side_effects: [] }
  - { method: GET, path: "/lesson-entries", description: "List lesson entries (filterable)", roles: [OwnerRepPM, OwnerRepExecutive, Owner], code: 200, input: ["program_id?", "category?", "limit?", "offset?"], output: "LessonEntry[]", side_effects: [] }
  - { method: GET, path: "/lesson-entries/{id}", description: "Get one lesson entry (read-only; entries remain immutable)", roles: [OwnerRepPM, OwnerRepExecutive, Owner], code: 200, input: [], output: LessonEntry, side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog (40 codes)
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-Role or X-User-ID header missing/empty, or role not declared" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Authenticated role is not in the endpoint's roles list" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum member, non-positive amount, or end <= start time range" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "program id does not exist" }
  - { id: ERR_CHARTER_NOT_FOUND, http: 404, condition: "charter id does not exist" }
  - { id: ERR_BASELINE_NOT_FOUND, http: 404, condition: "baseline id does not exist" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "contract id does not exist" }
  - { id: ERR_CHANGE_ORDER_NOT_FOUND, http: 404, condition: "change order id does not exist" }
  - { id: ERR_RISK_ENTRY_NOT_FOUND, http: 404, condition: "risk entry id does not exist" }
  - { id: ERR_DRAWDOWN_NOT_FOUND, http: 404, condition: "contingency drawdown id does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "owner report id does not exist" }
  - { id: ERR_STAKEHOLDER_GROUP_NOT_FOUND, http: 404, condition: "stakeholder group id does not exist" }
  - { id: ERR_ENGAGEMENT_NOT_FOUND, http: 404, condition: "engagement id does not exist" }
  - { id: ERR_OCCUPANCY_PLAN_NOT_FOUND, http: 404, condition: "occupancy plan id does not exist" }
  - { id: ERR_WAVE_NOT_FOUND, http: 404, condition: "move-in wave id does not exist" }
  - { id: ERR_CLOSEOUT_ITEM_NOT_FOUND, http: 404, condition: "closeout item id does not exist" }
  - { id: ERR_INVALID_TRANSITION, http: 409, condition: "Entity is not in a state from which the requested transition exists (covers wrong from-state, terminal lockdown, and lifecycle gates without a dedicated code)" }
  - { id: ERR_PROGRAM_NOT_ACTIVE, http: 409, condition: "Operation requires the program to be ACTIVE" }
  - { id: ERR_NO_APPROVED_CHARTER, http: 409, condition: "Program activation requires an APPROVED charter" }
  - { id: ERR_NO_APPROVED_BASELINE, http: 409, condition: "Program activation or plan mark-ready requires an APPROVED baseline" }
  - { id: ERR_CONTRACT_NOT_EXECUTED, http: 409, condition: "Change-order submit requires the contract to be EXECUTED" }
  - { id: ERR_OPEN_CHANGE_ORDERS_EXIST, http: 409, condition: "Contract completion blocked by change orders in non-terminal states" }
  - { id: ERR_PROGRAM_HAS_OPEN_ITEMS, http: 409, condition: "begin-closing blocked: non-terminal contracts, change orders, risks, drawdowns, or reports exist" }
  - { id: ERR_CLOSEOUT_INCOMPLETE, http: 409, condition: "Program close blocked: not all closeout items are VERIFIED" }
  - { id: ERR_LESSON_ENTRIES_REQUIRED, http: 409, condition: "Program close blocked: no lesson entries recorded" }
  - { id: ERR_CONTINGENCY_POSTURE_CRITICAL, http: 409, condition: "Change-order submit blocked while program contingency posture is CRITICAL" }
  - { id: ERR_PLAN_NOT_READY, http: 409, condition: "Wave confirm requires the occupancy plan to be READY or EXECUTING" }
  - { id: ERR_PLAN_NOT_ACCEPTING_WAVES, http: 409, condition: "Wave creation requires the occupancy plan to be COORDINATING, READY, or EXECUTING" }
  - { id: ERR_OPEN_WAVES_EXIST, http: 409, condition: "Plan completion blocked: waves still in SCHEDULED or CONFIRMED" }
  - { id: ERR_DUPLICATE_REPORT_PERIOD, http: 409, condition: "An owner report already exists for this (program_id, period)" }
  - { id: ERR_CROSS_PROGRAM_REFERENCE, http: 409, condition: "Body-supplied FK references an entity belonging to a different program (e.g. wave's stakeholder group not in the plan's program)" }
  - { id: ERR_SUPERSEDES_TARGET_INVALID, http: 409, condition: "supersedes_id does not reference an UNDER_REVIEW change order on the same contract" }
  - { id: ERR_DOCK_OVERLAP, http: 409, condition: "Wave collides with an occupying wave on the same dock under half-open + 2h turnover-buffer semantics" }
  - { id: ERR_ENGAGEMENT_OVERLAP, http: 409, condition: "Engagement collides with another SCHEDULED engagement of the same group under closed-interval semantics (touching endpoints conflict)" }
  - { id: ERR_ENGAGEMENT_DAILY_CAP_EXCEEDED, http: 409, condition: "Group's SCHEDULED minutes for the UTC date would exceed 360 (cap is inclusive: exactly 360 allowed)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same X-User-ID on both sides of a segregated step (negotiator/executor, recommender/decider, submitter/accepter, submitter/verifier)" }
  - { id: ERR_AWARD_EXCEEDS_BUDGET, http: 402, condition: "awarded_amount_cents exceeds program budget remaining after existing EXECUTED commitments" }
  - { id: ERR_CONTINGENCY_EXCEEDED, http: 402, condition: "Requested draw/reserve/loss exceeds contingency_available_cents" }
  - { id: ERR_BASELINE_UNDERCUTS_COMMITMENTS, http: 402, condition: "Rebaseline approval would set contingency_total below outstanding reserved+committed+drawn" }
  - { id: ERR_STALE_PROGRAM_VERSION, http: 412, condition: "expected_program_version does not match the program's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix (all roles opaque; every request carries X-User-Role + X-User-ID)
# =============================================================================
roles:
  - name: OwnerRepPM
    description: "Owner's-representative project manager: prepares and manages all program artifacts, negotiates contracts, recommends change orders, manages risk register, drawdowns, stakeholder coordination, occupancy, closeout preparation"
    identity: "opaque"
    exclusive_operations:
      - "POST /programs, /programs/{id}/activate, /programs/{id}/begin-closing, /programs/{id}/reopen"
      - "POST /charters, /charters/{id}/submit, /charters/{id}/revise"
      - "POST /baselines, /baselines/{id}/submit, /baselines/{id}/revise"
      - "POST /contracts, /contracts/{id}/begin-negotiation, /contracts/{id}/counter, /contracts/{id}/complete"
      - "POST /change-orders, /change-orders/{id}/submit, /change-orders/{id}/request-revision, /change-orders/{id}/recommend"
      - "POST /risk-entries and all /risk-entries/{id}/* actions"
      - "POST /contingency-drawdowns and all /contingency-drawdowns/{id}/* actions"
      - "POST /owner-reports, /owner-reports/{id}/submit"
      - "POST /stakeholder-groups, /engagements and engagement actions"
      - "POST /occupancy-plans and plan actions, /move-in-waves and wave actions"
      - "POST /closeout-items, /closeout-items/{id}/submit"
      - "POST /lesson-entries"
    shared_operations:
      - "All GET endpoints (shared with OwnerRepExecutive and Owner)"
  - name: OwnerRepExecutive
    description: "Owner's-representative executive: executes negotiated contracts and verifies/rejects closeout items (segregated from preparers)"
    identity: "opaque"
    exclusive_operations:
      - "POST /contracts/{id}/execute"
      - "POST /closeout-items/{id}/verify, /closeout-items/{id}/reject"
    shared_operations:
      - "All GET endpoints"
  - name: Owner
    description: "The owner: decides charters, baselines, and change orders; accepts or returns owner reports; closes the program"
    identity: "opaque"
    exclusive_operations:
      - "POST /charters/{id}/decide, /baselines/{id}/decide"
      - "POST /change-orders/{id}/decide, /change-orders/{id}/void"
      - "POST /owner-reports/{id}/accept, /owner-reports/{id}/return"
      - "POST /programs/{id}/close"
    shared_operations:
      - "All GET endpoints"




