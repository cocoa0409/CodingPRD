              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {e_id1: "$.data.error_id"}
            - call: "POST /project-actions"
              payload: {proponent_id: "00000000-0000-4000-8000-000000000000", action_name: "Filed For Nobody", action_type: "NON_FEDERAL", footprint_acres: 40.00, county_code: "06037", construction_start_date: "2027-01-01", construction_end_date: "2027-12-31"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {e_id2: "$.data.error_id"}
            - call: "GET /project-actions/${action_id}"
              payload: {}
              as: Proponent
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: {e_id3: "$.data.error_id"}
            - call: "POST /project-actions"
              payload: {proponent_id: "${proponent_b_id}", action_name: "Rival Own Action", action_type: "NON_FEDERAL", footprint_acres: 40.00, county_code: "06037", construction_start_date: "2027-01-01", construction_end_date: "2027-12-31"}
              as: Proponent
              as_user_id: "${proponent_b_id}"
              captures: {b_action_id: "$.data.id"}
          assert:
            - "${e_id1} == 'ERR_NOT_RESOURCE_OWNER' at 403: the body names a real but different proponent, and priority 5 binds the body to the header"
            - "${e_id2} == 'ERR_PROPONENT_NOT_FOUND' at 404: an unresolvable body foreign key falls through to priority 6 instead"
            - "${e_id3} == 'ERR_NOT_RESOURCE_OWNER' at 403 — an X-User-ID naming no Proponent row is an ownership failure, never a 401, because the header WAS supplied"
            - "the fourth trigger returns 201: proponent B may open its own action, so the refusals are about the identity pairing and not about the payload"
            - "GET /project-actions?proponent_id=${proponent_b_id} then reports total_count == 1 and GET /project-actions?proponent_id=${proponent_id} still reports total_count == 1"

  # ==========================================================================
  # From Cross-Cutting Complexity Layers — optimistic_concurrency,
  # cascading_side_effects, dual_variant_calculation, rate_threshold_triggers.
  # ==========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_expected_hcp_version_is_412_on_every_commitment_write
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[mitigation-commitment-create-stale-hcp]
          - errors["ERR_STALE_HCP_VERSION"]
          - entities.HabitatConservationPlan.fields.version
        distinguishing_aspect: >-
          The token is the PLAN's version, so it is invalidated by any write to the
          plan — not merely by another commitment. A funding assurance recorded
          between the caller's read and its commitment write is enough to make the
          held version stale, which is exactly the situation the rule exists for:
          the caller would otherwise size its contribution against a superseded
          endowment_required_cents.
        test_recipe:
          setup:
            - "Canonical fixture up to a DRAFT plan (version 1 as created), then one 45.01-unit bank commitment, which rewrites the endowment aggregates and takes the plan to version 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /species"
              payload: {scientific_name: "Gopherus agassizii", common_name: "Desert tortoise", listing_status: "ENDANGERED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.40, recovery_unit_population: 4000, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {species_e_id: "$.data.id"}
            - call: "POST /species/${species_e_id}/critical-habitat-units"
              payload: {unit_code: "CHU-1", acres: 500.00, county_code: "06037", designation_status: "FINAL", primary_constituent_elements: ["burrow substrate", "forage cover"]}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {chu1_id: "$.data.id"}
            - call: "POST /species"
              payload: {scientific_name: "Vireo bellii pusillus", common_name: "Least Bell's vireo", listing_status: "THREATENED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.25, recovery_unit_population: 9000, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {species_t_id: "$.data.id"}
            - call: "POST /conservation-banks"
              payload: {bank_name: "Mojave Habitat Bank", covered_species_id: "${species_e_id}", service_area_county_codes: ["06037"], credit_price_cents: 250000, credits_total_minted: 500.00}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {bank_id: "$.data.id"}
            - call: "POST /proponents"
              payload: {org_name: "Sunrise Logistics Park LLC", contact_email: "permits@sunrise-park.example", is_federal_agency: false}
              as: Anonymous
              captures: {proponent_id: "$.data.id"}
            - call: "POST /project-actions"
              payload: {proponent_id: "${proponent_id}", action_name: "Sunrise Park Phase I", action_type: "NON_FEDERAL", footprint_acres: 200.00, county_code: "06037", construction_start_date: "2027-01-01", construction_end_date: "2027-12-31"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {action_id: "$.data.id"}
            - call: "POST /project-actions/${action_id}/presence-determinations"
              payload: {species_id: "${species_e_id}", method: "FIELD_SURVEY", detection_result: "DETECTED", habitat_overlap_acres: 10.00, critical_habitat_unit_id: "${chu1_id}", survey_window_start: "2026-05-04", survey_window_end: "2026-05-08"}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /project-actions/${action_id}/presence-determinations"
              payload: {species_id: "${species_t_id}", method: "DATABASE_QUERY", detection_result: "DETECTED", habitat_overlap_acres: 7.35}
              as: Proponent
              as_user_id: "${proponent_id}"
