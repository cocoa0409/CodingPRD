            - "PremiumAllocation.${alloc_id}.status == PROVISIONAL (returned to pre-dispute state)"

      - name: collateral_post_verify_preserves_total_admitted_assets
        grounds:
          - state_machines.FrontingArrangement.TERMS_AGREED_to_COLLATERAL_POSTED
          - entities.CaptiveEntity.fields.admitted_assets
          - entities.CollateralPosting.fields.effective_value_cents
          - entities.FrontingArrangement.fields.collateral_posted_cents
        distinguishing_aspect: |
          Conserved quantity: CaptiveEntity.admitted_assets consistency.
          When collateral is posted and verified, admitted_assets increases by exactly
          the effective_value_cents of the collateral. When fronting is terminated and
          collateral released, admitted_assets decreases by exactly the same amount.
          The invariant: admitted_assets before posting == admitted_assets after
          posting + release cycle. Different conserved quantity from governance_score.
