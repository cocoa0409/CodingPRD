      - name: confirming_fixed_route_competency_flips_the_same_trip_check_to_denied
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/determinations/{id}/trip-eligibility-check
          - calculations.trip_by_trip_eligibility_evaluation
          - state_machines.TravelTrainingReferral.ENROLLED_to_COMPLETED
        distinguishing_aspect: "The identical trip-check payload returns two different answers across a travel-training completion: while fixed_route_competency_confirmed is false the COGNITIVE_UNFAMILIAR_ROUTE condition is satisfied and the trip is eligible, and once a score of 85 sets the flag on BOTH the applicant and the issued determination the same unfamiliar-route request is denied with NO_CONDITION_MET even though evaluated_condition_count is still 1."
        test_recipe:
          setup:
            - "CHAIN to an ISSUED CONDITIONAL determination at clock 2026-08-05T09:30:00Z with a single COGNITIVE_UNFAMILIAR_ROUTE condition; issuance auto-creates the referral"
