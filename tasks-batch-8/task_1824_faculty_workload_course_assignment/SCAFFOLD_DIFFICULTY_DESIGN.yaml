# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index (task 1824)
# 9 Difficulty Rules x 2 instances each = 18 instances.
# Every setup_api_calls / trigger entry replays against SCAFFOLD.yaml §1.5.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: assignment_credit_provisional_vs_census_final
        grounds:
          - calculations.assignment_credit_units
          - entities.Assignment.fields.credit_units
          - entities.Assignment.fields.final_credit_units
        distinguishing_aspect: |
          Entity domain Assignment: the SAME section (CS-301 ONLINE, base 3.0,
          premium 0.5) yields provisional credit_units 3.5 at enrolled_count 35,
          but census_final 4.5 after enrollment rises to 42 (>= threshold 40,
          +1.0 bonus) — two valid readings of "credit value" diverge and the
          LoadSheet flips basis from 3.5 to 4.5 at close-census.
        test_recipe:
          setup:
            - "Term 2026-FA OPEN (start 2026-08-24, census 2026-09-07, default policy: lecture_multiplier 1.0, online_premium 0.5, large_class_threshold 40, bonus 1.0)"
            - "Course CS-301 LECTURE base_credits 3; faculty Anna qualified for CS-301"
            - "Section 01 ONLINE cap 60, enrollment synced to 35; assignment CONFIRMED for Anna (credit_units snapshot 3.5)"
          setup_api_calls:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_id: "$.data.id" } }
            - { call: "POST /workload-terms/${t_id}/transition", payload: { to_state: "OPEN" }, as: DepartmentChair }
            - { call: "POST /courses", payload: { course_code: "CS-301", title: "Algorithms", course_type: "LECTURE", base_credits: 3, default_enrollment_cap: 30, allowed_modalities: ["IN_PERSON", "ONLINE"] }, as: DepartmentChair, captures: { c1_id: "$.data.id" } }
            - { call: "POST /faculty-members", payload: { full_name: "Anna Aho", email: "anna@x.edu", rank: "ASSOCIATE_PROFESSOR", base_salary_cents: 9000000 }, as: DepartmentChair, captures: { f1_id: "$.data.id" } }
            - { call: "POST /qualifications", payload: { faculty_id: "${f1_id}", course_id: "${c1_id}", expires_on: "2027-01-15" }, as: DepartmentChair }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "01", modality: "ONLINE", meeting_day: "MON", start_minute: 540, end_minute: 600, enrollment_cap: 60 }, as: DepartmentChair, captures: { s1_id: "$.data.id", s1_v: "$.data.version" } }
            - { call: "POST /course-sections/${s1_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair }
            - { call: "POST /course-sections/${s1_id}/enrollment-sync", payload: { enrolled_count: 35, expected_section_version: "${s1_v}" }, as: Registrar, captures: { s1_v2: "$.data.version" } }
            - { call: "POST /assignments", payload: { section_id: "${s1_id}", faculty_id: "${f1_id}" }, as: DepartmentChair, captures: { a1_id: "$.data.id" } }
            - { call: "POST /assignments/${a1_id}/transition", payload: { to_state: "CONFIRMED" }, as: FacultyMember, as_user_id: "${f1_id}" }
          trigger:
            - { call: "POST /course-sections/${s1_id}/enrollment-sync", payload: { enrolled_count: 42, expected_section_version: "${s1_v2}" }, as: Registrar }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-07T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /workload-terms/${t_id}/close-census", payload: {}, as: DepartmentChair }
            - { call: "GET /assignments/${a1_id}", as: DepartmentChair }
            - { call: "GET /load-sheets", payload: { term_id: "${t_id}", faculty_id: "${f1_id}" }, as: DepartmentChair }
          assert:
            - "Assignment.${a1_id}.credit_units == 3.5 (provisional snapshot at enrolled_count 35: 3.0 + 0.5, no large-class bonus)"
            - "Assignment.${a1_id}.final_credit_units == 4.5 (census enrollment 42 >= 40 adds 1.0 bonus)"
            - "LoadSheet(term ${t_id}, faculty ${f1_id}).teaching_credits == 4.5 after close-census (final basis preferred over provisional 3.5)"

      - name: release_buyout_salary_prorate_vs_flat_rate
        grounds:
          - calculations.release_buyout_value
          - entities.ReleaseTimeGrant.fields.buyout_value_cents
        distinguishing_aspect: |
          Entity domain ReleaseTimeGrant (different from the Assignment credit
          variant): identical credits_released 3.0 for the same faculty yields
          buyout 1125000 cents under SALARY_PRORATE (RESEARCH_BUYOUT) but
          240000 cents under FLAT_RATE (ADMINISTRATIVE).
        test_recipe:
          setup:
            - "Term OPEN; faculty Anna base_salary_cents 9000000, base_load_credits 12 (flat_release_rate_cents default 80000, TERMS_PER_YEAR 2)"
          setup_api_calls:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_id: "$.data.id" } }
            - { call: "POST /workload-terms/${t_id}/transition", payload: { to_state: "OPEN" }, as: DepartmentChair }
            - { call: "POST /faculty-members", payload: { full_name: "Anna Aho", email: "anna@x.edu", rank: "ASSOCIATE_PROFESSOR", base_salary_cents: 9000000 }, as: DepartmentChair, captures: { f1_id: "$.data.id" } }
            - { call: "POST /release-time-grants", payload: { term_id: "${t_id}", faculty_id: "${f1_id}", grant_type: "RESEARCH_BUYOUT", credits_released: 3, start_date: "2026-08-24", end_date: "2026-10-16" }, as: DepartmentChair, captures: { g1_id: "$.data.id" } }
            - { call: "POST /release-time-grants", payload: { term_id: "${t_id}", faculty_id: "${f1_id}", grant_type: "ADMINISTRATIVE", credits_released: 3, start_date: "2026-10-17", end_date: "2026-12-11" }, as: DepartmentChair, captures: { g2_id: "$.data.id" } }
          trigger:
            - { call: "POST /release-time-grants/${g1_id}/transition", payload: { to_state: "APPROVED" }, as: DeanOffice }
            - { call: "POST /release-time-grants/${g2_id}/transition", payload: { to_state: "APPROVED" }, as: DeanOffice }
            - { call: "GET /release-time-grants/${g1_id}", as: DepartmentChair }
            - { call: "GET /release-time-grants/${g2_id}", as: DepartmentChair }
            - { call: "GET /load-sheets", payload: { term_id: "${t_id}", faculty_id: "${f1_id}" }, as: DepartmentChair }
          assert:
            - "ReleaseTimeGrant.${g1_id}.buyout_value_cents == 1125000 (round_half_up(9000000 * 3 / (12 * 2)))"
            - "ReleaseTimeGrant.${g2_id}.buyout_value_cents == 240000 (3 * 80000)"
            - "LoadSheet(term ${t_id}, faculty ${f1_id}).release_credits == 6.0"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: overload_credits_nested_max_with_release
        grounds:
          - calculations.load_sheet_recompute
          - entities.LoadSheet.fields.overload_credits
          - entities.LoadSheet.fields.effective_obligation_credits
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — two nested max()
          clamps plus status-conditional input sets (only PROPOSED/CONFIRMED
          assignments, only APPROVED grants): teaching 12.0, base 12, release 3.0
          -> obligation max(0, 12-3)=9 -> overload max(0, 12-9)=3.0.
        test_recipe:
          setup:
            - "Term OPEN default policy; CS-301 LECTURE 3.0; Anna qualified; four IN_PERSON sections (MON-THU 09:00-10:00) each SCHEDULED with a PROPOSED assignment for Anna"
            - "RESEARCH_BUYOUT grant 3.0 credits APPROVED for Anna"
          setup_api_calls:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_id: "$.data.id" } }
            - { call: "POST /workload-terms/${t_id}/transition", payload: { to_state: "OPEN" }, as: DepartmentChair }
            - { call: "POST /courses", payload: { course_code: "CS-301", title: "Algorithms", course_type: "LECTURE", base_credits: 3, default_enrollment_cap: 30, allowed_modalities: ["IN_PERSON", "ONLINE"] }, as: DepartmentChair, captures: { c1_id: "$.data.id" } }
            - { call: "POST /faculty-members", payload: { full_name: "Anna Aho", email: "anna@x.edu", rank: "ASSOCIATE_PROFESSOR", base_salary_cents: 9000000 }, as: DepartmentChair, captures: { f1_id: "$.data.id" } }
            - { call: "POST /qualifications", payload: { faculty_id: "${f1_id}", course_id: "${c1_id}", expires_on: "2027-01-15" }, as: DepartmentChair }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "01", modality: "IN_PERSON", meeting_day: "MON", start_minute: 540, end_minute: 600 }, as: DepartmentChair, captures: { s1_id: "$.data.id" } }
            - { call: "POST /course-sections/${s1_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair }
            - { call: "POST /assignments", payload: { section_id: "${s1_id}", faculty_id: "${f1_id}" }, as: DepartmentChair }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "02", modality: "IN_PERSON", meeting_day: "TUE", start_minute: 540, end_minute: 600 }, as: DepartmentChair, captures: { s2_id: "$.data.id" } }
            - { call: "POST /course-sections/${s2_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair }
            - { call: "POST /assignments", payload: { section_id: "${s2_id}", faculty_id: "${f1_id}" }, as: DepartmentChair }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "03", modality: "IN_PERSON", meeting_day: "WED", start_minute: 540, end_minute: 600 }, as: DepartmentChair, captures: { s3_id: "$.data.id" } }
            - { call: "POST /course-sections/${s3_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair }
            - { call: "POST /assignments", payload: { section_id: "${s3_id}", faculty_id: "${f1_id}" }, as: DepartmentChair }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "04", modality: "IN_PERSON", meeting_day: "THU", start_minute: 540, end_minute: 600 }, as: DepartmentChair, captures: { s4_id: "$.data.id" } }
            - { call: "POST /course-sections/${s4_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair }
            - { call: "POST /assignments", payload: { section_id: "${s4_id}", faculty_id: "${f1_id}" }, as: DepartmentChair }
            - { call: "POST /release-time-grants", payload: { term_id: "${t_id}", faculty_id: "${f1_id}", grant_type: "RESEARCH_BUYOUT", credits_released: 3, start_date: "2026-08-24", end_date: "2026-12-11" }, as: DepartmentChair, captures: { g1_id: "$.data.id" } }
            - { call: "POST /release-time-grants/${g1_id}/transition", payload: { to_state: "APPROVED" }, as: DeanOffice }
          trigger:
            - { call: "GET /load-sheets", payload: { term_id: "${t_id}", faculty_id: "${f1_id}" }, as: DepartmentChair }
          assert:
            - "LoadSheet(term ${t_id}, faculty ${f1_id}).teaching_credits == 12.0 (4 x 3.0, PROPOSED assignments included)"
            - "LoadSheet.release_credits == 3.0"
            - "LoadSheet.effective_obligation_credits == 9.0 (max(0, 12 - 3))"
            - "LoadSheet.overload_credits == 3.0 (max(0, 12 - 9))"
            - "LoadSheet.underload_credits == 0.0"

      - name: credit_units_per_component_rounding_order
        grounds:
          - calculations.assignment_credit_units
        distinguishing_aspect: |
          Mode (b) nested rounding (different mode from the max-clamp instance):
          scaffold pins round-each-component-to-2dp-THEN-sum; with lab_multiplier
          0.333 and online_premium_credits 0.555 the pinned order yields
          0.67 + 0.56 = 1.23, while sum-then-round would yield
          round(0.666 + 0.555) = 1.22.
        test_recipe:
          setup:
            - "Term created DRAFT; policy PATCHed while DRAFT to lab_multiplier 0.333, online_premium_credits 0.555; then OPEN"
            - "Course DA-210L LAB base_credits 2; Anna qualified; section 01 ONLINE SCHEDULED (enrolled 0 < threshold 40)"
          setup_api_calls:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_id: "$.data.id", t_v: "$.data.version" } }
            - { call: "PATCH /workload-terms/${t_id}", payload: { expected_term_version: "${t_v}", lab_multiplier: 0.333, online_premium_credits: 0.555 }, as: DepartmentChair }
            - { call: "POST /workload-terms/${t_id}/transition", payload: { to_state: "OPEN" }, as: DepartmentChair }
            - { call: "POST /courses", payload: { course_code: "DA-210L", title: "Data Lab", course_type: "LAB", base_credits: 2, default_enrollment_cap: 40, allowed_modalities: ["IN_PERSON", "ONLINE"] }, as: DepartmentChair, captures: { c3_id: "$.data.id" } }
            - { call: "POST /faculty-members", payload: { full_name: "Anna Aho", email: "anna@x.edu", rank: "ASSOCIATE_PROFESSOR", base_salary_cents: 9000000 }, as: DepartmentChair, captures: { f1_id: "$.data.id" } }
            - { call: "POST /qualifications", payload: { faculty_id: "${f1_id}", course_id: "${c3_id}", expires_on: "2027-01-15" }, as: DepartmentChair }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c3_id}", section_number: "01", modality: "ONLINE", meeting_day: "MON", start_minute: 540, end_minute: 600 }, as: DepartmentChair, captures: { s1_id: "$.data.id" } }
            - { call: "POST /course-sections/${s1_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair }
          trigger:
            - { call: "POST /assignments", payload: { section_id: "${s1_id}", faculty_id: "${f1_id}" }, as: DepartmentChair, captures: { a1_id: "$.data.id", a1_credits: "$.data.credit_units" } }
          assert:
            - "Assignment.${a1_id}.credit_units == 1.23 (per-component rounding: round(2*0.333)=0.67 + round(0.555)=0.56)"
            - "credit_units != 1.22 (the sum-then-round result round(0.666+0.555, 2))"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: term_open_lock_open_cycle
        grounds:
          - state_machines.WorkloadTerm.OPEN_to_LOCKED
          - state_machines.WorkloadTerm.LOCKED_to_OPEN
        distinguishing_aspect: |
          WorkloadTerm has a cycle (OPEN -> LOCKED -> OPEN), not a linear
          pipeline: assignment creation is rejected while LOCKED and succeeds
          again after the unlock revert.
        test_recipe:
          setup:
            - "Term OPEN; CS-301; Anna qualified; section 01 SCHEDULED (MON 09:00-10:00)"
          setup_api_calls:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_id: "$.data.id" } }
            - { call: "POST /workload-terms/${t_id}/transition", payload: { to_state: "OPEN" }, as: DepartmentChair }
            - { call: "POST /courses", payload: { course_code: "CS-301", title: "Algorithms", course_type: "LECTURE", base_credits: 3, default_enrollment_cap: 30, allowed_modalities: ["IN_PERSON", "ONLINE"] }, as: DepartmentChair, captures: { c1_id: "$.data.id" } }
            - { call: "POST /faculty-members", payload: { full_name: "Anna Aho", email: "anna@x.edu", rank: "ASSOCIATE_PROFESSOR", base_salary_cents: 9000000 }, as: DepartmentChair, captures: { f1_id: "$.data.id" } }
            - { call: "POST /qualifications", payload: { faculty_id: "${f1_id}", course_id: "${c1_id}", expires_on: "2027-01-15" }, as: DepartmentChair }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "01", modality: "IN_PERSON", meeting_day: "MON", start_minute: 540, end_minute: 600 }, as: DepartmentChair, captures: { s1_id: "$.data.id" } }
            - { call: "POST /course-sections/${s1_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair }
            - { call: "POST /workload-terms/${t_id}/transition", payload: { to_state: "LOCKED" }, as: DepartmentChair }
          trigger:
            - { call: "POST /assignments", payload: { section_id: "${s1_id}", faculty_id: "${f1_id}" }, as: DepartmentChair, captures: { lock_err: "$.data.error_id" } }
            - { call: "POST /workload-terms/${t_id}/transition", payload: { to_state: "OPEN" }, as: DepartmentChair, captures: { t_after: "$.data.status" } }
            - { call: "POST /assignments", payload: { section_id: "${s1_id}", faculty_id: "${f1_id}" }, as: DepartmentChair, captures: { a1_id: "$.data.id", a1_status: "$.data.status" } }
          assert:
            - "Assignment create while LOCKED fails with ${lock_err} == ERR_INVALID_TERM_STATE"
            - "After unlock, WorkloadTerm.${t_id}.status == OPEN (cycle back, not a new state)"
            - "Assignment.${a1_id}.status == PROPOSED (create succeeds again after revert)"

      - name: section_staffed_demote_cycle
        grounds:
          - state_machines.CourseSection.SCHEDULED_to_STAFFED
          - state_machines.CourseSection.STAFFED_to_SCHEDULED
          - state_machines.Assignment.PROPOSED_to_CONFIRMED
          - state_machines.Assignment.CONFIRMED_to_RESCINDED
        distinguishing_aspect: |
          CourseSection (different entity from WorkloadTerm) cycles
          SCHEDULED -> STAFFED -> SCHEDULED purely as a bubble-up function of
          child Assignment state: confirm staffs it, rescind demotes it.
        test_recipe:
          setup:
            - "Term OPEN; CS-301; Anna qualified; section 01 SCHEDULED; assignment A1 PROPOSED for Anna; logical clock at default 2026-08-01 (23 days before start -> not late)"
          setup_api_calls:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_id: "$.data.id" } }
            - { call: "POST /workload-terms/${t_id}/transition", payload: { to_state: "OPEN" }, as: DepartmentChair }
            - { call: "POST /courses", payload: { course_code: "CS-301", title: "Algorithms", course_type: "LECTURE", base_credits: 3, default_enrollment_cap: 30, allowed_modalities: ["IN_PERSON", "ONLINE"] }, as: DepartmentChair, captures: { c1_id: "$.data.id" } }
            - { call: "POST /faculty-members", payload: { full_name: "Anna Aho", email: "anna@x.edu", rank: "ASSOCIATE_PROFESSOR", base_salary_cents: 9000000 }, as: DepartmentChair, captures: { f1_id: "$.data.id" } }
            - { call: "POST /qualifications", payload: { faculty_id: "${f1_id}", course_id: "${c1_id}", expires_on: "2027-01-15" }, as: DepartmentChair }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "01", modality: "IN_PERSON", meeting_day: "MON", start_minute: 540, end_minute: 600 }, as: DepartmentChair, captures: { s1_id: "$.data.id" } }
            - { call: "POST /course-sections/${s1_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair }
            - { call: "POST /assignments", payload: { section_id: "${s1_id}", faculty_id: "${f1_id}" }, as: DepartmentChair, captures: { a1_id: "$.data.id" } }
          trigger:
            - { call: "POST /assignments/${a1_id}/transition", payload: { to_state: "CONFIRMED" }, as: FacultyMember, as_user_id: "${f1_id}" }
            - { call: "GET /course-sections/${s1_id}", as: DepartmentChair, captures: { s_after_confirm: "$.data.status" } }
            - { call: "POST /assignments/${a1_id}/transition", payload: { to_state: "RESCINDED" }, as: DepartmentChair }
            - { call: "GET /course-sections/${s1_id}", as: DepartmentChair, captures: { s_after_rescind: "$.data.status" } }
            - { call: "GET /assignments/${a1_id}", as: DepartmentChair, captures: { a1_final_status: "$.data.status", a1_stipend: "$.data.stipend_cents" } }
            - { call: "GET /load-sheets", payload: { term_id: "${t_id}", faculty_id: "${f1_id}" }, as: DepartmentChair }
          assert:
            - "Section status after confirm == STAFFED (${s_after_confirm})"
            - "Section status after rescind == SCHEDULED (${s_after_rescind}) — auto-demote, cycling back"
            - "Assignment.${a1_id}.status == RESCINDED and stipend_cents == 0 (clock 2026-08-01 is 23 days before start, not late)"
            - "LoadSheet(term ${t_id}, faculty ${f1_id}).teaching_credits == 0.0"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: late_section_cancel_cascade
        grounds:
          - state_machines.CourseSection.STAFFED_to_CANCELLED
          - state_machines.Assignment.CONFIRMED_to_CANCELLED
          - state_machines.OverloadRequest.CHAIR_ENDORSED_to_WITHDRAWN
          - calculations.late_cancel_stipend
          - calculations.comp_budget_ledger
        distinguishing_aspect: |
          Depth-3 chain from ONE trigger (section cancel): section STAFFED ->
          CANCELLED mutates Assignment (link 1 -> CANCELLED + stipend), whose
          credit removal mutates the LoadSheet (link 2 -> teaching 14.0 -> 10.5,
          overload 2.0 -> 0), whose overload drop mutates the OverloadRequest
          (link 3 -> auto-WITHDRAWN). Each link is caused by the previous link.
        test_recipe:
          setup:
            - "Term OPEN; CS-301; Anna qualified; four ONLINE sections (MON-THU 09:00-10:00) each with a CONFIRMED assignment -> teaching 4 x 3.5 = 14.0, overload 2.0"
            - "OverloadRequest for Anna CHAIR_ENDORSED (snapshot overload 2.0, comp 300000)"
            - "Logical clock 2026-08-11T00:00:00Z (13 days before start -> late window)"
          setup_api_calls:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_id: "$.data.id" } }
            - { call: "POST /workload-terms/${t_id}/transition", payload: { to_state: "OPEN" }, as: DepartmentChair }
            - { call: "POST /courses", payload: { course_code: "CS-301", title: "Algorithms", course_type: "LECTURE", base_credits: 3, default_enrollment_cap: 30, allowed_modalities: ["IN_PERSON", "ONLINE"] }, as: DepartmentChair, captures: { c1_id: "$.data.id" } }
            - { call: "POST /faculty-members", payload: { full_name: "Anna Aho", email: "anna@x.edu", rank: "ASSOCIATE_PROFESSOR", base_salary_cents: 9000000 }, as: DepartmentChair, captures: { f1_id: "$.data.id" } }
            - { call: "POST /qualifications", payload: { faculty_id: "${f1_id}", course_id: "${c1_id}", expires_on: "2027-01-15" }, as: DepartmentChair }
