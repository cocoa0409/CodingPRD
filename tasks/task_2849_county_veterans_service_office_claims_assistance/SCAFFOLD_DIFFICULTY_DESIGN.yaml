  # =====================================================================
  # RULE 7 — cross_entity_state_dependency
  # Three instances over three DIFFERENT entity pairs:
  #   Claim                     <- DischargeDocument verification state
  #   Veteran assignment        <- Representative accreditation + caseload
  #   StateBenefitApplication   <- Veteran.combined_rating_pct
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: claim_creation_blocked_while_discharge_document_is_discrepancy_held_and_allowed_after_verification
        grounds:
          - validations[priority=43]
          - state_machines.DischargeDocument.PENDING_VERIFICATION_to_DISCREPANCY_HELD
          - state_machines.DischargeDocument.DISCREPANCY_HELD_to_PENDING_VERIFICATION
          - errors[ERR_DISCHARGE_NOT_VERIFIED]
          - entities.Veteran.discharge_doc_status
        distinguishing_aspect: |
          Whether a Claim may be created is decided entirely by the state of a DIFFERENT entity, the
          veteran's DischargeDocument: while that document sits in DISCREPANCY_HELD the veteran's derived
          discharge_doc_status is DISCREPANCY_HELD and POST /cvso/claims is refused with
          ERR_DISCHARGE_NOT_VERIFIED even though every field of the claim request is valid; the identical
          request succeeds once the document has been resubmitted with corrected dates and VERIFIED. An
          implementation that reads only the claim payload, or that caches discharge_doc_status at veteran
          creation, gets one of the two outcomes wrong.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "rep_a ACTIVE COUNTY_CVSO."
            - "Veteran vet whose service_end_date is 2005-09-10."
            - "DischargeDocument doc submitted with claimed_service_end 2004-06-30, which contradicts the veteran record, then held: status DISCREPANCY_HELD and Veteran.discharge_doc_status DISCREPANCY_HELD."
            - "ACTIVE PowerOfAttorney poa designating rep_a - a POA may be executed before verification, so poa_id is available for the claim request."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-171", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
