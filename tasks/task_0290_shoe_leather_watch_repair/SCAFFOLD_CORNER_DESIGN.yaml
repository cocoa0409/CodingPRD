              payload: { ticket_id: "${tkt_id}", item_category: "SHOE", description: "shoe", condition_grade: "GOOD" }
              as: FrontDeskClerk
              captures: { item_shoe: $.data.id }
            - call: "POST /service-lines"
              payload: { ticket_id: "${tkt_id}", ticket_item_id: "${item_shoe}", service_type_id: "${st_shoe}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { line_a: $.data.id }
            - call: "POST /estimates"
              payload: { ticket_id: "${tkt_id}", authored_by_technician_id: "${tech_id}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { est_id: $.data.id }
            - call: "PATCH /repair-tickets/${tkt_id}"
              payload: { assigned_technician_id: "${tech_id}" }
              as: FrontDeskClerk
              captures: { tkt_v_new: $.data.version }
          trigger:
            - call: "POST /estimates/${est_id}/present"
              payload: { expected_ticket_version: "${tkt_v_new} - 1" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "data.error_id == ERR_STALE_TICKET_VERSION"
            - "RepairTicket.${tkt_id}.repair_status == INTAKE"

