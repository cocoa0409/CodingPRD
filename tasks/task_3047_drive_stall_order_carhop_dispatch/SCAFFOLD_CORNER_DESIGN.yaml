# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_3047_drive_stall_order_carhop_dispatch
#
# Breadth probe: claims §1.8 does not already exercise. Common setup chains are
# factored as YAML anchors for reuse.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: location_create_returns_defaults_and_posture
        claim_type: Creation
        grounds:
          - entities.Location
          - endpoints.POST_/locations
        distinguishing_aspect: "A location created with code/name/timezone/stall_capacity returns 201 with weather_mode NORMAL, rush_index 0, stalls_available == stall_capacity, lane_posture OPEN, version 1."
        test_recipe:
          setup: ["Logical clock at default 2026-09-01T00:00:00Z. Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /locations"
              payload: { code: "TST-001", name: "Test", timezone: "America/Chicago", stall_capacity: 5 }
              as: PlatformAdmin
              captures: { l_id: $.data.id }
          assert:
            - "status 201; Location.${l_id}.weather_mode == NORMAL, rush_index == 0, stalls_available == 5, lane_posture == OPEN, version == 1"
            - "response carries non-null id, created_at, updated_at"
      - name: menu_item_retire_then_add_line_rejected
        claim_type: violation_to_error
        grounds:
          - entities.MenuItem.fields.status
          - errors[ERR_MENU_ITEM_RETIRED]
        distinguishing_aspect: "Retiring a menu item then adding it to a DRAFT order line is rejected with ERR_MENU_ITEM_RETIRED (catalog constraint, priority 9)."
        test_recipe:
          setup:
            - "Location L (capacity 2), stall 1; menu item created then retired; DRAFT order via check-in."
          setup_api_calls:
            - &k_loc
              call: "POST /locations"
              payload: { code: "CRN-01", name: "Corner 01", timezone: "America/Chicago", stall_capacity: 2 }
              as: PlatformAdmin
              captures: { loc_id: $.data.id, loc_v: $.data.version }
            - &k_st
              call: "POST /locations/${loc_id}/service-targets"
              payload: { channel: "STALL_INTERCOM", weather_mode: "NORMAL", target_seconds: 600 }
              as: PlatformAdmin
            - &k_stall
              call: "POST /locations/${loc_id}/stalls"
              payload: { stall_number: 1, kind: "STALL" }
              as: PlatformAdmin
              captures: { stall_id: $.data.id }
            - &k_item_retire
              call: "POST /menu-items"
              payload: { sku: "RET-1", name: "Retired", category: "FOOD", base_price_cents: 500, size_scheme: "NONE" }
              as: PlatformAdmin
              captures: { ret_item: $.data.id }
            - call: "POST /menu-items/${ret_item}/retire"
              payload: {}
              as: PlatformAdmin
            - &k_checkin
              call: "POST /locations/${loc_id}/stalls/${stall_id}/checkin"
              payload: { expected_location_version: "${loc_v}" }
              as: ShiftManager
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /locations/${loc_id}/orders/${ord_id}/lines"
              payload: { menu_item_id: "${ret_item}", quantity: 1 }
              as: ShiftManager
              captures: { err: $.data.error_id }
          assert:
            - "status 409 and error_id == ERR_MENU_ITEM_RETIRED"
      - name: size_required_for_drink_sizes_item
        claim_type: violation_to_error
        grounds:
          - entities.OrderLine.fields.size_option_code
          - errors[ERR_SIZE_REQUIRED]
        distinguishing_aspect: "Adding a DRINK_SIZES item without a size_option_code is rejected with ERR_SIZE_REQUIRED (422), distinct from generic validation."
        test_recipe:
          setup: ["Location L, stall 1; a DRINK_SIZES drink; DRAFT order."]
          setup_api_calls:
            - *k_loc
            - *k_st
            - *k_stall
            - call: "POST /menu-items"
              payload: { sku: "SIZED", name: "Sized Drink", category: "DRINK", base_price_cents: 300, size_scheme: "DRINK_SIZES" }
              as: PlatformAdmin
              captures: { sized_item: $.data.id }
            - *k_checkin
          trigger:
            - call: "POST /locations/${loc_id}/orders/${ord_id}/lines"
              payload: { menu_item_id: "${sized_item}", quantity: 1 }
              as: ShiftManager
              captures: { err2: $.data.error_id }
          assert:
            - "status 422 and error_id == ERR_SIZE_REQUIRED"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: terminal_cancelled_order_rejects_place
        claim_type: invalid_transition
        grounds:
          - state_machines.Order
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A CANCELLED order is terminal; placing it again returns ERR_INVALID_STATE with no side effects."
        test_recipe:
          setup: ["Location L, stall 1; DRAFT order created then cancelled while DRAFT."]
          setup_api_calls:
            - *k_loc
            - *k_st
            - *k_stall
            - *k_checkin
            - call: "POST /locations/${loc_id}/orders/${ord_id}/cancel"
              payload: {}
              as: ShiftManager
          trigger:
            - call: "POST /locations/${loc_id}/orders/${ord_id}/place"
              payload: {}
              as: ShiftManager
              captures: { err3: $.data.error_id }
          assert:
            - "status 409 and error_id == ERR_INVALID_STATE"
            - "Order.${ord_id}.status remains CANCELLED"
      - name: deliver_out_of_run_position_order_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Order.OUT_FOR_DELIVERY_to_DELIVERED
          - errors[ERR_RUN_SEQUENCE_VIOLATION]
        distinguishing_aspect: "On a two-order run, delivering the run_position-2 order before the run_position-1 order is rejected with ERR_RUN_SEQUENCE_VIOLATION."
        test_recipe:
          setup:
            - "Location L, stalls 1 and 2; two captured READY orders staged on one run (positions 1 and 2), run departed."
          setup_api_calls:
            - *k_loc
            - *k_st
            - *k_stall
            - call: "POST /locations/${loc_id}/stalls"
              payload: { stall_number: 2, kind: "STALL" }
              as: PlatformAdmin
              captures: { stall2_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "FD-2", name: "F2", category: "FOOD", base_price_cents: 500, size_scheme: "NONE" }
              as: PlatformAdmin
              captures: { f2: $.data.id }
            - call: "POST /locations/${loc_id}/carhops"
              payload: { name: "Hop X", zone: "NORTH", on_shift: true, max_trays: 3 }
              as: ShiftManager
              captures: { hop_id: $.data.id, hop_v: $.data.version }
            - *k_checkin
            - call: "POST /locations/${loc_id}/orders/${ord_id}/lines"
              payload: { menu_item_id: "${f2}", quantity: 1 }
              as: ShiftManager
            - call: "POST /locations/${loc_id}/orders/${ord_id}/place"
              payload: {}
              as: ShiftManager
            - call: "POST /locations/${loc_id}/orders/${ord_id}/start_preparation"
              payload: {}
              as: KitchenStaff
            - call: "POST /locations/${loc_id}/orders/${ord_id}/mark_ready"
              payload: {}
              as: KitchenStaff
            - call: "POST /locations/${loc_id}/orders/${ord_id}/authorize_payment"
              payload: {}
              as: ShiftManager
            - call: "POST /locations/${loc_id}/orders/${ord_id}/capture_payment"
              payload: {}
              as: ShiftManager
            - call: "GET /locations/${loc_id}/stalls/${stall2_id}"
              payload: {}
              as: ShiftManager
            - call: "GET /locations/${loc_id}"
              payload: {}
              as: ShiftManager
              captures: { loc_v2: $.data.version }
            - call: "POST /locations/${loc_id}/stalls/${stall2_id}/checkin"
              payload: { expected_location_version: "${loc_v2}" }
              as: ShiftManager
              captures: { ord2_id: $.data.id }
            - call: "POST /locations/${loc_id}/orders/${ord2_id}/lines"
              payload: { menu_item_id: "${f2}", quantity: 1 }
              as: ShiftManager
            - call: "POST /locations/${loc_id}/orders/${ord2_id}/place"
              payload: {}
              as: ShiftManager
            - call: "POST /locations/${loc_id}/orders/${ord2_id}/start_preparation"
              payload: {}
              as: KitchenStaff
            - call: "POST /locations/${loc_id}/orders/${ord2_id}/mark_ready"
              payload: {}
              as: KitchenStaff
            - call: "POST /locations/${loc_id}/orders/${ord2_id}/authorize_payment"
              payload: {}
              as: ShiftManager
            - call: "POST /locations/${loc_id}/orders/${ord2_id}/capture_payment"
              payload: {}
              as: ShiftManager
            - call: "POST /locations/${loc_id}/delivery-runs"
              payload: { carhop_id: "${hop_id}", expected_carhop_version: "${hop_v}", order_ids: ["${ord_id}", "${ord2_id}"] }
              as: ShiftManager
              captures: { run_id: $.data.id }
            - call: "POST /locations/${loc_id}/delivery-runs/${run_id}/depart"
              payload: {}
              as: Carhop
              as_user_id: "${hop_id}"
          trigger:
            - call: "POST /locations/${loc_id}/delivery-runs/${run_id}/orders/${ord2_id}/deliver"
              payload: {}
              as: Carhop
              as_user_id: "${hop_id}"
              captures: { err4: $.data.error_id }
          assert:
            - "status 409 and error_id == ERR_RUN_SEQUENCE_VIOLATION (position 2 before position 1)"
            - "Order.${ord2_id}.status remains OUT_FOR_DELIVERY"

  # ===========================================================================
  - section: calculations
    instances:
      - name: metrics_rollup_empty_set_returns_nulls
        claim_type: Correct Result
        grounds:
          - calculations.timing_metrics_rollup
          - endpoints.GET_/locations/{locationId}/metrics
        distinguishing_aspect: "With zero DELIVERED orders, count_delivered == 0, both means null, on_time_rate null (empty-set edge of the aggregation)."
        test_recipe:
          setup: ["Location L with no orders."]
          setup_api_calls:
            - *k_loc
          trigger:
            - call: "GET /locations/${loc_id}/metrics"
              payload: {}
              as: ShiftManager
          assert:
            - "count_delivered == 0, count_late == 0, avg_checkout_to_ready_seconds is null, on_time_rate is null"
      - name: stall_availability_congestion_boundary
        claim_type: Correct Result
        grounds:
          - calculations.stall_availability
        distinguishing_aspect: "Capacity 10: stalls_available == 2 is CONGESTED (2 <= ceil(10*0.2)=2); stalls_available == 3 is OPEN — the <= boundary on the congestion fraction."
        test_recipe:
          setup: ["Location capacity 10; occupy 8 stalls so stalls_available == 2 (CONGESTED); occupy 7 so 3 (OPEN)."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { code: "CRN-CAP", name: "Cap", timezone: "America/Chicago", stall_capacity: 10 }
              as: PlatformAdmin
              captures: { cap_loc: $.data.id }
          trigger:
            - call: "GET /locations/${cap_loc}"
              payload: {}
              as: ShiftManager
          assert:
            - "stalls_available == 10 and lane_posture == OPEN initially"
            - "CONGESTED boundary: stalls_available == 2 triggers CONGESTED, == 3 stays OPEN (enumerated by full occupancy chain in implementation tests)"

  # ===========================================================================
  - section: validations
    instances:
      - name: unauthenticated_request_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role header is rejected 401 ERR_UNAUTHENTICATED before any role check."
        test_recipe:
          setup: ["Location L exists."]
          setup_api_calls:
            - *k_loc
          trigger:
            - call: "GET /locations/${loc_id}"
              payload: {}
              as: ShiftManager
              captures: { err5: $.data.error_id }
          assert:
            - "When auth headers are stripped the response is 401 ERR_UNAUTHENTICATED (priority 1 precedes all)"
      - name: wrong_role_forbidden_on_admin_endpoint
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "A ShiftManager calling POST /locations (PlatformAdmin-only) is rejected 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /locations"
              payload: { code: "X", name: "X", timezone: "America/Chicago", stall_capacity: 1 }
              as: ShiftManager
              captures: { err6: $.data.error_id }
          assert:
            - "status 403 and error_id == ERR_FORBIDDEN (ShiftManager lacks PlatformAdmin exclusive op)"
      - name: stale_version_occ_on_checkin
        claim_type: Violation → Error
        grounds:
          - concurrency_rules[stall-checkin-stale-location]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "A check-in carrying a stale expected_location_version (one behind after a weather change) is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Location L (version bumped once by a weather change); stall 1 IDLE."]
          setup_api_calls:
            - *k_loc
            - *k_stall
            - call: "POST /locations/${loc_id}/weather"
              payload: { weather_mode: "HEAT_ADVISORY" }
              as: ShiftManager
          trigger:
            - call: "POST /locations/${loc_id}/stalls/${stall_id}/checkin"
              payload: { expected_location_version: "${loc_v}" }
              as: ShiftManager
              captures: { err7: $.data.error_id }
          assert:
            - "status 412 and error_id == ERR_STALE_VERSION (${loc_v} is one behind after weather bumped version)"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: order_list_filters_by_status_and_paginates
        claim_type: Listing
        grounds:
          - endpoints.GET_/locations/{locationId}/orders
          - response_envelope.pagination_fields
        distinguishing_aspect: "Filtering orders by status and paginating with limit/offset returns total_count over the filtered set and has_more flags."
        test_recipe:
          setup: ["Location L with 3 DRAFT orders (three check-ins on stalls 1,2,3)."]
          setup_api_calls:
            - *k_loc
            - *k_st
            - *k_stall
          trigger:
            - call: "GET /locations/${loc_id}/orders"
              payload: { status: "DRAFT", limit: 2, offset: 0 }
              as: ShiftManager
          assert:
            - "response_type == array; pagination fields limit/offset/total_count/has_more present"
            - "total_count counts the filtered DRAFT set, has_more reflects remaining pages"
      - name: get_nonexistent_order_returns_404
        claim_type: Not Found
        grounds:
          - endpoints.GET_/locations/{locationId}/orders/{orderId}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET on a well-formed but nonexistent order id within a real location returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Location L exists."]
          setup_api_calls:
            - *k_loc
          trigger:
            - call: "GET /locations/${loc_id}/orders/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ShiftManager
              captures: { err8: $.data.error_id }
          assert:
            - "status 404 and error_id == ERR_NOT_FOUND"

  # ===========================================================================
  - section: errors
    instances:
      - name: empty_order_place_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_EMPTY_ORDER]
        distinguishing_aspect: "Placing an order with zero lines returns ERR_EMPTY_ORDER (409)."
        test_recipe:
          setup: ["Location L, stall 1, DRAFT order via check-in, no lines."]
          setup_api_calls:
            - *k_loc
            - *k_st
            - *k_stall
            - *k_checkin
          trigger:
            - call: "POST /locations/${loc_id}/orders/${ord_id}/place"
              payload: {}
              as: ShiftManager
              captures: { err9: $.data.error_id }
          assert:
            - "status 409 and error_id == ERR_EMPTY_ORDER"
      - name: no_service_target_blocks_place
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NO_SERVICE_TARGET]
        distinguishing_aspect: "Placing an order for a channel with no ACTIVE ServiceTargetProfile (and no NORMAL fallback) returns ERR_NO_SERVICE_TARGET."
        test_recipe:
          setup: ["Location L with NO service target profiles; stall 1; DRAFT order with one line."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { code: "CRN-NST", name: "NoST", timezone: "America/Chicago", stall_capacity: 2 }
              as: PlatformAdmin
              captures: { nst_loc: $.data.id, nst_v: $.data.version }
            - call: "POST /menu-items"
              payload: { sku: "NST-F", name: "F", category: "FOOD", base_price_cents: 500, size_scheme: "NONE" }
              as: PlatformAdmin
              captures: { nst_item: $.data.id }
            - call: "POST /locations/${nst_loc}/stalls"
              payload: { stall_number: 1, kind: "STALL" }
              as: PlatformAdmin
              captures: { nst_stall: $.data.id }
            - call: "POST /locations/${nst_loc}/stalls/${nst_stall}/checkin"
              payload: { expected_location_version: "${nst_v}" }
              as: ShiftManager
              captures: { nst_ord: $.data.id }
            - call: "POST /locations/${nst_loc}/orders/${nst_ord}/lines"
              payload: { menu_item_id: "${nst_item}", quantity: 1 }
              as: ShiftManager
          trigger:
            - call: "POST /locations/${nst_loc}/orders/${nst_ord}/place"
              payload: {}
              as: ShiftManager
              captures: { err10: $.data.error_id }
          assert:
            - "status 409 and error_id == ERR_NO_SERVICE_TARGET"

  # ===========================================================================
  - section: rbac
    instances:
      - name: kitchen_staff_cannot_create_offers
        claim_type: "role denial"
        grounds:
          - roles[KitchenStaff]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "KitchenStaff is limited to the preparation pipeline; creating an offer (ShiftManager/PlatformAdmin op) is denied 403."
        test_recipe:
          setup: ["Location L exists."]
          setup_api_calls:
            - *k_loc
          trigger:
            - call: "POST /locations/${loc_id}/offers"
              payload: { code: "O", kind: "PROMO", discount_type: "PERCENT_OFF_ORDER", discount_value: 10, window_start_local: "00:00", window_end_local: "23:59", app_only: false }
              as: KitchenStaff
              captures: { err11: $.data.error_id }
          assert:
            - "status 403 and error_id == ERR_FORBIDDEN"
      - name: carhop_cannot_settle_tip
        claim_type: "role denial"
        grounds:
          - roles[Carhop]
          - roles[ShiftManager]
        distinguishing_aspect: "Tip settlement is ShiftManager-exclusive; a Carhop attempting settle is denied 403 (hierarchical_override: managers settle, carhops do not)."
        test_recipe:
          setup: ["Location L with a RECORDED tip record; a carhop."]
          setup_api_calls:
            - *k_loc
          trigger:
            - call: "POST /locations/${loc_id}/tip-records/00000000-0000-0000-0000-000000000000/settle"
              payload: {}
              as: Carhop
              as_user_id: "00000000-0000-0000-0000-000000000001"
              captures: { err12: $.data.error_id }
          assert:
            - "status 403 and error_id == ERR_FORBIDDEN (Carhop lacks ShiftManager exclusive settle op)"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: weather_heat_advisory_blocks_patio_checkin
        claim_type: conditional_feature_flags
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.Stall.IDLE_to_OCCUPIED
        distinguishing_aspect: "HEAT_ADVISORY weather mode (location-level flag) changes check-in behavior for PATIO stalls only: drive-in stalls still admit, patio stalls reject with ERR_STALL_WEATHER_CLOSED."
        test_recipe:
          setup: ["Location L HEAT_ADVISORY; patio stall P IDLE, drive-in stall S IDLE."]
          setup_api_calls:
            - *k_loc
            - call: "POST /locations/${loc_id}/stalls"
              payload: { stall_number: 9, kind: "PATIO" }
              as: PlatformAdmin
              captures: { patio9: $.data.id }
            - call: "POST /locations/${loc_id}/weather"
              payload: { weather_mode: "HEAT_ADVISORY" }
              as: ShiftManager
            - call: "GET /locations/${loc_id}"
              payload: {}
              as: ShiftManager
              captures: { loc_v_h: $.data.version }
          trigger:
            - call: "POST /locations/${loc_id}/stalls/${patio9}/checkin"
              payload: { expected_location_version: "${loc_v_h}" }
              as: ShiftManager
              captures: { err13: $.data.error_id }
          assert:
            - "status 409 and error_id == ERR_STALL_WEATHER_CLOSED (weather flag gates patio only)"
      - name: app_only_offer_rejected_for_intercom_guest
        claim_type: conditional_feature_flags
        grounds:
          - calculations.offer_application
          - errors[ERR_APP_ONLY]
        distinguishing_aspect: "An app_only offer explicitly supplied on a STALL_INTERCOM guest order (no app_user customer) is rejected with ERR_APP_ONLY / ERR_OFFER_NOT_APPLICABLE."
        test_recipe:
          setup: ["Location L; app_only PROMO offer; stall 1 DRAFT intercom guest order with one line."]
          setup_api_calls:
            - *k_loc
            - *k_st
            - *k_stall
            - call: "POST /locations/${loc_id}/offers"
              payload: { code: "APPONLY", kind: "APP_ONLY", discount_type: "PERCENT_OFF_ORDER", discount_value: 25, window_start_local: "00:00", window_end_local: "23:59", app_only: true }
              as: PlatformAdmin
            - call: "POST /menu-items"
              payload: { sku: "AO-F", name: "F", category: "FOOD", base_price_cents: 500, size_scheme: "NONE" }
              as: PlatformAdmin
              captures: { ao_item: $.data.id }
            - *k_checkin
            - call: "POST /locations/${loc_id}/orders/${ord_id}/lines"
              payload: { menu_item_id: "${ao_item}", quantity: 1 }
              as: ShiftManager
          trigger:
            - call: "POST /locations/${loc_id}/orders/${ord_id}/place"
              payload: { offer_code: "APPONLY" }
              as: ShiftManager
              captures: { err14: $.data.error_id }
          assert:
            - "status 409 and error_id IN {ERR_APP_ONLY, ERR_OFFER_NOT_APPLICABLE} (app-only offer not applicable to intercom guest)"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: capture_immediately_reflects_wallet_and_tip
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.tip_resolution
        distinguishing_aspect: "Under immediate consistency, the capture_payment response itself reflects tip_cents, total_tendered_cents, and the wallet debit in the same request — no read-after-delay."
        test_recipe:
          setup: ["Location L; customer with wallet 300c and default tip 0; DRIVE_THRU order total 500c, authorized."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { code: "CRN-CONS", name: "Cons", timezone: "America/Chicago", stall_capacity: 2 }
              as: PlatformAdmin
              captures: { cons_loc: $.data.id }
            - call: "POST /locations/${cons_loc}/service-targets"
              payload: { channel: "DRIVE_THRU", weather_mode: "NORMAL", target_seconds: 300 }
              as: PlatformAdmin
            - call: "POST /menu-items"
              payload: { sku: "C-F", name: "F", category: "FOOD", base_price_cents: 500, size_scheme: "NONE" }
              as: PlatformAdmin
              captures: { c_item: $.data.id }
            - call: "POST /customers"
              payload: { email: "w@x.com", display_name: "W", stored_tip_default_pct: 0 }
              as: PlatformAdmin
              captures: { c_cust: $.data.id }
            - call: "POST /customers/${c_cust}/wallet/adjust"
              payload: { delta_cents: 300, reason: "seed" }
              as: ShiftManager
            - call: "POST /locations/${cons_loc}/orders"
              payload: { channel: "DRIVE_THRU", customer_id: "${c_cust}" }
              as: ShiftManager
              captures: { c_ord: $.data.id }
            - call: "POST /locations/${cons_loc}/orders/${c_ord}/lines"
              payload: { menu_item_id: "${c_item}", quantity: 1 }
              as: ShiftManager
            - call: "POST /locations/${cons_loc}/orders/${c_ord}/authorize_payment"
              payload: {}
              as: ShiftManager
          trigger:
            - call: "POST /locations/${cons_loc}/orders/${c_ord}/capture_payment"
              payload: {}
              as: ShiftManager
              captures: { tendered: $.data.total_tendered_cents }
          assert:
            - "response payment_status == CAPTURED and total_tendered_cents == 500 in the same request"
