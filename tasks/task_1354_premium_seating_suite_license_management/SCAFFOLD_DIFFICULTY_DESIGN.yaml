  # ---------------------------------------------------------------------------
  # Rule 5: priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: execute_draft_with_credit_hold_returns_state_error
        grounds:
          - validations[priority=7]
          - validations[priority=23]
          - state_machines.LicenseAgreement.PENDING_EXECUTION_to_ACTIVE
        distinguishing_aspect: |
          Error-category pair state x business_fiscal: the agreement is in DRAFT
          (state violation, priority 7) AND the account is on credit HOLD (fiscal
          violation, priority 23). The state error ERR_INVALID_STATE_TRANSITION must
          win because priority 7 < 23.
        test_recipe:
          setup:
            - "Venue, GOLD suite, S1 PUBLISHED, account ACTIVE but credit HOLD (manual invoice due 2026-08-10 unpaid, clock 2026-09-15 -> 36 days past due)"
            - "Agreement created and left in DRAFT (never submitted)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/venues", payload: { name: "Metro Stadium", address: "1 Arena Way", default_catering_cutoff_hours: 72 }, as: StadiumAdmin, captures: { v: $.data.id } }
            - { call: "POST /api/suites", payload: { venue_id: "${v}", suite_code: "G-101", tier: GOLD, capacity_seats: 20, base_annual_fee_cents: 12000000, f_b_minimum_cents: 4000000 }, as: StadiumAdmin, captures: { su: $.data.id } }
            - { call: "POST /api/seasons", payload: { venue_id: "${v}", label: "2026-27", starts_on: "2026-09-01T00:00:00Z", ends_on: "2027-02-15T00:00:00Z", renewal_window_opens_on: "2026-12-01T00:00:00Z", renewal_window_closes_on: "2027-01-15T00:00:00Z" }, as: StadiumAdmin, captures: { s1: $.data.id } }
            - { call: "POST /api/seasons/${s1}/publish", payload: {}, as: StadiumAdmin }
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Corp", account_type: CORPORATE, tax_id: "T-100", billing_email: "ap@acme.example" }, as: PremiumSalesRep, captures: { ac: $.data.id } }
            - { call: "POST /api/accounts/${ac}/set_status", payload: { target_status: "ACTIVE" }, as: FinanceController }
            - { call: "POST /api/invoices", payload: { account_id: "${ac}", lines: [ { description: "Deposit", quantity: 1, unit_price_cents: 500000 } ], due_on: "2026-08-10T00:00:00Z" }, as: FinanceController, captures: { invm: $.data.id } }
            - { call: "POST /api/invoices/${invm}/issue", payload: {}, as: FinanceController }
            - { call: "POST /api/agreements", payload: { suite_id: "${su}", account_id: "${ac}", start_season_id: "${s1}", term_seasons: 1, base_annual_fee_cents: 12000000, escalator_bp: 300, f_b_minimum_cents: 4000000 }, as: PremiumSalesRep, captures: { ag: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: StadiumAdmin }
          trigger:
            - { call: "POST /api/agreements/${ag}/execute", payload: {}, as: AccountHolder, as_user_id: "${ac}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (state, priority 7), NOT ERR_ACCOUNT_CREDIT_HOLD (business_fiscal, priority 23), even though both hold"

      - name: place_order_bad_body_past_cutoff_returns_constraint_error
        grounds:
          - validations[priority=6]
          - validations[priority=10]
        distinguishing_aspect: |
          Error-category pair business_constraint x business_temporal (different pair
          from the state x fiscal instance): the order body violates the capacity
          constraint (guest_count 25 > suite capacity 20, priority 6) AND the catering
          cutoff has passed (clock 2026-09-08 > cutoff 2026-09-07T17:00Z, priority 10).
          ERR_INVALID_REQUEST must win because priority 6 < 10.
        test_recipe:
          setup:
            - "Venue, GOLD suite cap 20, S1 PUBLISHED with REGULAR E1 2026-09-10T17:00Z, account ACTIVE with ACTIVE agreement, clock 2026-09-08 (past the 72h cutoff)"
          setup_api_calls:
