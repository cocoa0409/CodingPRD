            - { call: "POST /midway/weather-observations", payload: { operating_day_id: "${day_id}", wind_speed_mph: 27 }, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/rides/${ride_id}/resume", payload: {}, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/weather-observations", payload: { operating_day_id: "${day_id}", wind_speed_mph: 45 }, as: FairManager, as_user_id: "${sup_id}" }
