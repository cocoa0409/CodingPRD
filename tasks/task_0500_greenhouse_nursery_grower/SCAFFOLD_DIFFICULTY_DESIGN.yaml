              payload: { event_type: "SCOUTING", dead_observed: 200 }
              as: ProductionTech
            - call: "GET /nursery/batches/${batch_id}"
              payload: {}
              as: ProductionTech
              captures: { st: $.data.status, cc: $.data.cull_count }
          assert:
            - "After cumulative dead reaches 500 (300+200), shrink_pct == 0.50 (inclusive >=) triggers auto-cull"
