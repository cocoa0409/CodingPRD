# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# FOG Ordinance Compliance Program. 9 rules x 2 instances = 18 instances.
# All literal assert values were computed by executing the §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: interceptor_sizing_provisional_vs_measured
        grounds:
          - calculations.interceptor_required_capacity
          - entities.GreaseInterceptor.fields.required_min_capacity_gal
          - entities.GreaseInterceptor.fields.sizing_method
        distinguishing_aspect: |
          Same establishment profile, two valid sizing algorithms: the provisional
          profile formula yields 495 gal while the measured-flow variant
          (20 gpm x 30 retention minutes) yields 600 gal — different results for
          identical profile inputs. Entity domain: GreaseInterceptor sizing
          (distinct from the Establishment compliance domain of the sibling instance).
        test_recipe:
          setup:
            - "HIGH_GREASE establishment (seats 200, fryers 3, no charbroiler): provisional requirement = max(50, 200*2 + 3*15 + 0 + 50) = 495 gal"
            - "two interceptors proposed for it: I1 without measured flow, I2 with measured_flow_gpm = 20"
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Twin Grill", street_address: "1 Main St", seating_capacity: 200, fryer_count: 3, has_charbroiler: false, cuisine_profile: HIGH_GREASE }
              as: ProgramAdmin
              captures: { est_id: $.data.id }
            - call: "POST /interceptors"
              payload: { establishment_id: "${est_id}", nominal_capacity_gal: 600 }
              as: ProgramAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /interceptors"
              payload: { establishment_id: "${est_id}", nominal_capacity_gal: 700, measured_flow_gpm: 20 }
              as: ProgramAdmin
              captures: { i2_id: $.data.id }
          trigger:
            - call: "POST /interceptors/${i1_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /interceptors/${i2_id}/approve"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "GreaseInterceptor.${i1_id}.required_min_capacity_gal == 495"
            - "GreaseInterceptor.${i1_id}.sizing_method == PROVISIONAL"
            - "GreaseInterceptor.${i2_id}.required_min_capacity_gal == 600"
            - "GreaseInterceptor.${i2_id}.sizing_method == MEASURED"
            - "495 != 600 — same Establishment profile fields, different approved minimums"

      - name: pumping_delinquency_forward_vs_chronological
        grounds:
          - calculations.pumping_delinquency
          - entities.Establishment.fields.pumping_overdue
          - entities.Establishment.fields.missed_pump_windows
        distinguishing_aspect: |
          Same compliance data, two valid delinquency algorithms on the
          Establishment domain: the forward-looking variant resets its baseline
          on the latest VERIFIED pump (overdue == false) while the chronological
          window replay still counts the missed first window
          (missed_pump_windows == 1). Distinct entity domain from the
          interceptor-sizing sibling instance.
        test_recipe:
          setup:
            - "HIGH establishment created at 2026-01-01T00:00:00Z (risk table frequency 90 days); ACTIVE interceptor; PERMITTED hauler"
            - "one VERIFIED manifest with pump_date 2026-06-25T00:00:00Z (falls in window W2 [2026-04-01, 2026-06-30); window W1 [2026-01-01, 2026-04-01) is empty)"
            - "logical clock advanced to 2026-08-14T00:00:00Z; sweep executed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /establishments"
              payload: { name: "Divergence Diner", street_address: "2 Elm St", seating_capacity: 200, fryer_count: 3, has_charbroiler: false, cuisine_profile: HIGH_GREASE }
              as: ProgramAdmin
              captures: { est_id: $.data.id }
            - call: "POST /interceptors"
              payload: { establishment_id: "${est_id}", nominal_capacity_gal: 600 }
              as: ProgramAdmin
              captures: { int_id: $.data.id }
            - call: "POST /interceptors/${int_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /interceptors/${int_id}/commission"
              payload: {}
              as: Inspector
            - call: "POST /haulers"
              payload: { name: "Haul Co", permit_number: "PN-1", insurance_expires_on: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { hauler_id: $.data.id }
            - call: "POST /haulers/${hauler_id}/permit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /pump-manifests"
              payload: { establishment_id: "${est_id}", interceptor_id: "${int_id}", hauler_id: "${hauler_id}", pump_date: "2026-06-25T00:00:00Z", pumped_volume_gal: 2000 }
              as: FseContact
              as_user_id: "${est_id}"
              captures: { man_id: $.data.id }
            - call: "POST /disposal-records"
              payload: { hauler_id: "${hauler_id}", manifest_id: "${man_id}", disposed_volume_gal: 2000, disposal_site_name: "Site A", disposed_at: "2026-06-25T12:00:00Z" }
              as: HaulerAdmin
              as_user_id: "${hauler_id}"
            - call: "POST /pump-manifests/${man_id}/verify"
              payload: {}
              as: Inspector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sweeps/run"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "GET /establishments/${est_id}"
              as: ProgramAdmin
          assert:
            - "Establishment.${est_id}.pumping_overdue == false  (baseline 2026-06-25 + 90d = 2026-09-23 > 2026-08-14)"
            - "Establishment.${est_id}.missed_pump_windows == 1  (W1 [2026-01-01, 2026-04-01) empty; W2 satisfied by 2026-06-25 pump; W3 ends 2026-09-28, not yet elapsed)"
            - "Establishment.${est_id}.compliance_status == COMPLIANT"

  - rule_id: combinatorial_formula
    instances:
      - name: cost_share_per_share_rounding_with_remainder
        grounds:
          - calculations.cost_share_apportionment
          - entities.BlockageEvent.fields.contributions
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-share THEN
          largest-weight remainder reconciliation. total 10001 cents at weights
          33/33/34 yields 3300/3300/3401; the alternative sum-then-round order
          would leave 3400 on the third contributor — the rounding order changes
          the cents.
        test_recipe:
          setup:
            - "three establishments A, B, C registered (creation order A, B, C)"
            - "one blockage event in REPORTED state"
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Cafe A", street_address: "10 A St", seating_capacity: 10, fryer_count: 0, cuisine_profile: LOW_GREASE }
              as: ProgramAdmin
              captures: { ea: $.data.id }
            - call: "POST /establishments"
              payload: { name: "Cafe B", street_address: "11 B St", seating_capacity: 10, fryer_count: 0, cuisine_profile: LOW_GREASE }
              as: ProgramAdmin
              captures: { eb: $.data.id }
            - call: "POST /establishments"
              payload: { name: "Cafe C", street_address: "12 C St", seating_capacity: 10, fryer_count: 0, cuisine_profile: LOW_GREASE }
              as: ProgramAdmin
              captures: { ec: $.data.id }
            - call: "POST /blockage-events"
              payload: { location_description: "Main St sewer segment 7" }
              as: Inspector
              captures: { blk: $.data.id }
          trigger:
            - call: "POST /blockage-events/${blk}/assess"
              payload: { total_cleanup_cost_cents: 10001, contributions: [ { establishment_id: "${ea}", weight_percent: 33 }, { establishment_id: "${eb}", weight_percent: 33 }, { establishment_id: "${ec}", weight_percent: 34 } ] }
              as: Inspector
          assert:
            - "BlockageEvent.${blk}.contributions[establishment_id==${ea}].share_cents == 3300  (round_half_up(10001*33/100) = round_half_up(3300.33))"
            - "BlockageEvent.${blk}.contributions[establishment_id==${eb}].share_cents == 3300"
            - "BlockageEvent.${blk}.contributions[establishment_id==${ec}].share_cents == 3401  (3400 + remainder 1 assigned to the largest weight 34)"
            - "sum of share_cents == 10001 (remainder fully reconciled)"
            - "BlockageEvent.${blk}.status == ASSESSED"

      - name: risk_score_capped_weighted_classification
        grounds:
          - calculations.risk_classification
          - entities.Establishment.fields.risk_score
          - entities.Establishment.fields.risk_class
        distinguishing_aspect: |
          Mode (a) combinatorial formula: 3+ inputs with non-linear interaction —
          nested min() caps on capacity and equipment terms plus a cuisine-profile
          branch. seats 900 / fryers 5 / charbroiler / MEDIUM cuisine gives
          min(40,90) + min(30,60) + 20 = 90; the uncapped linear sum would be 170,
          so the caps change the result. Different mode from the sibling
          rounding-order instance.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Cap City BBQ", street_address: "9 Cap Ave", seating_capacity: 900, fryer_count: 5, has_charbroiler: true, cuisine_profile: MEDIUM_GREASE }
              as: ProgramAdmin
              captures: { est_id: $.data.id }
          trigger:
            - call: "GET /establishments/${est_id}"
              as: ProgramAdmin
          assert:
            - "Establishment.${est_id}.risk_score == 90  (min(40, 900*0.1)=40 + min(30, 5*10+10)=30 + MEDIUM_GREASE 20)"
            - "Establishment.${est_id}.risk_class == HIGH  (90 >= 70)"
            - "Establishment.${est_id}.pumping_frequency_days == 90"

  - rule_id: non_linear_state_machine
    instances:
      - name: variance_info_request_cycle
        grounds:
          - state_machines.VarianceRequest.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.VarianceRequest.INFO_REQUESTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          VarianceRequest cycles UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW
          and the loop is repeatable (two full iterations observed) before a
          terminal decision — a cyclic machine on VarianceRequest, distinct from
          the Hauler permit cycle of the sibling instance.
        test_recipe:
          setup:
            - "LOW establishment; one PUMPING_FREQUENCY variance request in UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Rural Kitchen", street_address: "3 Oak Rd", seating_capacity: 10, fryer_count: 0, cuisine_profile: LOW_GREASE }
              as: ProgramAdmin
              captures: { est_id: $.data.id }
            - call: "POST /variance-requests"
              payload: { establishment_id: "${est_id}", scope: "PUMPING_FREQUENCY", requested_frequency_days: 400, justification: "rural low-grease operation", effective_from: "2027-01-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z" }
              as: FseContact
              as_user_id: "${est_id}"
              captures: { var_id: $.data.id }
          trigger:
            - call: "POST /variance-requests/${var_id}/request-info"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /variance-requests/${var_id}/provide-info"
              payload: { justification: "updated docs: grease audit attached" }
              as: FseContact
              as_user_id: "${est_id}"
            - call: "POST /variance-requests/${var_id}/request-info"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /variance-requests/${var_id}/provide-info"
              payload: { justification: "second packet: historical manifests" }
              as: FseContact
              as_user_id: "${est_id}"
            - call: "POST /variance-requests/${var_id}/deny"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "VarianceRequest.${var_id} visited INFO_REQUESTED twice and returned to UNDER_REVIEW twice (cycle, not one-way pipeline)"
            - "VarianceRequest.${var_id}.justification == 'second packet: historical manifests' after the second provide-info"
            - "VarianceRequest.${var_id}.status == DENIED and decided_at set after deny"

      - name: hauler_permit_suspension_cycle
        grounds:
          - state_machines.Hauler.PERMITTED_to_SUSPENDED
          - state_machines.Hauler.SUSPENDED_to_PERMITTED
          - entities.Hauler.fields.mismatch_count
        distinguishing_aspect: |
          Hauler cycles PERMITTED -> SUSPENDED -> PERMITTED and reinstatement
          resets mismatch_count from 1 to 0 — a cyclic machine with a counter
          reset on Hauler, distinct from the VarianceRequest info cycle.
        test_recipe:
          setup:
            - "HIGH establishment with an ACTIVE interceptor; hauler PERMITTED"
            - "one manifest rejected with DISPOSAL_MISMATCH so mismatch_count == 1"
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Cycle Cafe", street_address: "4 Pine St", seating_capacity: 200, fryer_count: 3, has_charbroiler: false, cuisine_profile: HIGH_GREASE }
              as: ProgramAdmin
              captures: { est_id: $.data.id }
            - call: "POST /interceptors"
              payload: { establishment_id: "${est_id}", nominal_capacity_gal: 600 }
              as: ProgramAdmin
              captures: { int_id: $.data.id }
            - call: "POST /interceptors/${int_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /interceptors/${int_id}/commission"
              payload: {}
              as: Inspector
            - call: "POST /haulers"
              payload: { name: "Cycle Haul", permit_number: "PN-CYC", insurance_expires_on: "2027-06-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { hauler_id: $.data.id }
            - call: "POST /haulers/${hauler_id}/permit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /pump-manifests"
              payload: { establishment_id: "${est_id}", interceptor_id: "${int_id}", hauler_id: "${hauler_id}", pump_date: "2026-08-01T00:00:00Z", pumped_volume_gal: 1500 }
              as: FseContact
              as_user_id: "${est_id}"
              captures: { man_id: $.data.id }
            - call: "POST /pump-manifests/${man_id}/reject"
              payload: { reason_code: "DISPOSAL_MISMATCH" }
              as: Inspector
          trigger:
            - call: "POST /haulers/${hauler_id}/suspend"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /haulers/${hauler_id}/reinstate"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /haulers/${hauler_id}"
              as: ProgramAdmin
          assert:
            - "Hauler.${hauler_id} traversed APPLIED -> PERMITTED -> SUSPENDED -> PERMITTED (cycle)"
            - "Hauler.${hauler_id}.mismatch_count == 0 after reinstate (was 1 before suspend)"
            - "Hauler.${hauler_id}.status == PERMITTED"

  - rule_id: transitive_cascade
    instances:
      - name: manifest_rejection_suspends_hauler_and_orphans_manifests
        grounds:
          - state_machines.PumpManifest.SUBMITTED_to_REJECTED
          - state_machines.Hauler.PERMITTED_to_SUSPENDED
          - entities.Hauler.fields.mismatch_count
        distinguishing_aspect: |
          Depth-3 cascade triggered by a manifest rejection: reject ->
          hauler.mismatch_count += 1 -> (threshold 3) hauler auto-SUSPENDED ->
          every still-SUBMITTED manifest of that hauler auto-REJECTED. Each hop
          is caused by the previous mutation; the orphan manifest M4 is never
          touched by the inspector. Different trigger from the sweep instance.
        test_recipe:
          setup:
            - "two HIGH establishments E1, E2 each with an ACTIVE interceptor (nominal 600 >= required 495)"
            - "hauler H PERMITTED"
            - "four SUBMITTED manifests: M1 (E1, 2026-08-01), M2 (E1, 2026-08-02), M3 (E2, 2026-08-01), M4 (E2, 2026-08-02) — distinct pump_dates per interceptor"
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "E1 Diner", street_address: "20 First St", seating_capacity: 200, fryer_count: 3, has_charbroiler: false, cuisine_profile: HIGH_GREASE }
              as: ProgramAdmin
              captures: { e1: $.data.id }
            - call: "POST /establishments"
              payload: { name: "E2 Diner", street_address: "21 Second St", seating_capacity: 200, fryer_count: 3, has_charbroiler: false, cuisine_profile: HIGH_GREASE }
              as: ProgramAdmin
              captures: { e2: $.data.id }
            - call: "POST /interceptors"
              payload: { establishment_id: "${e1}", nominal_capacity_gal: 600 }
              as: ProgramAdmin
              captures: { i1: $.data.id }
            - call: "POST /interceptors/${i1}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /interceptors/${i1}/commission"
              payload: {}
              as: Inspector
            - call: "POST /interceptors"
              payload: { establishment_id: "${e2}", nominal_capacity_gal: 600 }
              as: ProgramAdmin
              captures: { i2: $.data.id }
            - call: "POST /interceptors/${i2}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /interceptors/${i2}/commission"
              payload: {}
              as: Inspector
            - call: "POST /haulers"
              payload: { name: "Cascade Haul", permit_number: "PN-CAS", insurance_expires_on: "2027-06-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { h: $.data.id }
            - call: "POST /haulers/${h}/permit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /pump-manifests"
              payload: { establishment_id: "${e1}", interceptor_id: "${i1}", hauler_id: "${h}", pump_date: "2026-08-01T00:00:00Z", pumped_volume_gal: 1500 }
              as: FseContact
              as_user_id: "${e1}"
              captures: { m1: $.data.id }
            - call: "POST /pump-manifests"
              payload: { establishment_id: "${e1}", interceptor_id: "${i1}", hauler_id: "${h}", pump_date: "2026-08-02T00:00:00Z", pumped_volume_gal: 1500 }
              as: FseContact
              as_user_id: "${e1}"
              captures: { m2: $.data.id }
            - call: "POST /pump-manifests"
              payload: { establishment_id: "${e2}", interceptor_id: "${i2}", hauler_id: "${h}", pump_date: "2026-08-01T00:00:00Z", pumped_volume_gal: 1500 }
              as: FseContact
              as_user_id: "${e2}"
              captures: { m3: $.data.id }
            - call: "POST /pump-manifests"
              payload: { establishment_id: "${e2}", interceptor_id: "${i2}", hauler_id: "${h}", pump_date: "2026-08-02T00:00:00Z", pumped_volume_gal: 1500 }
              as: FseContact
              as_user_id: "${e2}"
              captures: { m4: $.data.id }
          trigger:
            - call: "POST /pump-manifests/${m1}/reject"
              payload: { reason_code: "DISPOSAL_MISMATCH" }
              as: Inspector
            - call: "POST /pump-manifests/${m2}/reject"
              payload: { reason_code: "DISPOSAL_MISMATCH" }
              as: Inspector
            - call: "POST /pump-manifests/${m3}/reject"
              payload: { reason_code: "DISPOSAL_MISMATCH" }
              as: Inspector
            - call: "GET /haulers/${h}"
              as: ProgramAdmin
            - call: "GET /pump-manifests/${m4}"
              as: Inspector
          assert:
            - "Hauler.${h}.mismatch_count == 3 after the third rejection"
            - "Hauler.${h}.status == SUSPENDED (auto-transition at threshold 3 — no suspend endpoint was called)"
            - "PumpManifest.${m4}.status == REJECTED and PumpManifest.${m4}.reject_reason == HAULER_SUSPENDED (orphan cascade hop: M4 was never directly rejected)"

      - name: sweep_escalation_suspends_establishment_and_denies_variances
        grounds:
          - state_machines.Violation.NOTICED_to_CITATION
          - state_machines.Establishment.transitions
          - state_machines.VarianceRequest.UNDER_REVIEW_to_DENIED
        distinguishing_aspect: |
          Depth-3 cascade triggered by the compliance sweep: sweep escalates an
          overdue NOTICED violation -> CITATION; the CITATION mutation recomputes
          the establishment posture -> SUSPENDED; entering SUSPENDED auto-denies
          the establishment's open VarianceRequest. Different trigger (sweep) and
          different chain (violation/posture/variance) from the manifest-reject
          instance.
        test_recipe:
          setup:
            - "HIGH establishment with an open (UNDER_REVIEW) INTERCEPTOR_SIZE variance created while COMPLIANT"
            - "a failing inspection at the default clock 2026-08-01T00:00:00Z (2 MAJOR + 5 MINOR = 31 deductions -> score 69, severity MAJOR, cure_deadline 2026-08-15T00:00:00Z)"
            - "clock advanced to exactly 2026-08-15T00:00:00Z"
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Sweep Bistro", street_address: "30 Third St", seating_capacity: 200, fryer_count: 3, has_charbroiler: false, cuisine_profile: HIGH_GREASE }
              as: ProgramAdmin
              captures: { est_id: $.data.id }
            - call: "POST /variance-requests"
              payload: { establishment_id: "${est_id}", scope: "INTERCEPTOR_SIZE", justification: "space constraints", effective_from: "2027-01-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z" }
              as: FseContact
              as_user_id: "${est_id}"
              captures: { var_id: $.data.id }
            - call: "POST /inspections"
              payload: { establishment_id: "${est_id}", items: [ { category: "GREASE_TRAP_MAINTENANCE", severity: "MAJOR" }, { category: "RECORD_KEEPING", severity: "MAJOR" }, { category: "BMP_PRACTICES", severity: "MINOR" }, { category: "BMP_PRACTICES", severity: "MINOR" }, { category: "STRUCTURAL", severity: "MINOR" }, { category: "STRUCTURAL", severity: "MINOR" }, { category: "RECORD_KEEPING", severity: "MINOR" } ] }
              as: Inspector
            - call: "GET /violations?establishment_id=${est_id}&status=NOTICED"
              as: Inspector
              captures: { viol_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /sweeps/run"
              payload: {}
              as: ProgramAdmin
              captures: { esc_ids: $.data.escalated_violation_ids }
            - call: "GET /violations/${viol_id}"
              as: Inspector
            - call: "GET /establishments/${est_id}"
              as: ProgramAdmin
            - call: "GET /variance-requests/${var_id}"
              as: ComplianceOfficer
          assert:
            - "sweep response escalated_violation_ids contains ${viol_id}"
            - "Violation.${viol_id}.status == CITATION and Violation.${viol_id}.fine_cents == 50000 (MAJOR)"
            - "Establishment.${est_id}.compliance_status == SUSPENDED (posture recompute caused by the CITATION mutation)"
            - "VarianceRequest.${var_id}.status == DENIED (auto-denied by the SUSPENDED cascade — no deny endpoint was called)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: verify_manifest_safety_beats_referential
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_HAULER_NOT_PERMITTED]
          - errors[ERR_INTERCEPTOR_MISMATCH]
        distinguishing_aspect: |
          Error-category pair business_safety (priority 9) vs business_referential
          (priority 10): the manifest's hauler is SUSPENDED AND its interceptor
          belongs to another establishment — both fail; the safety error must win.
          Different category pair from the state-vs-temporal sibling.
        test_recipe:
          setup:
            - "EA (HIGH) with ACTIVE interceptor IA; EB (LOW, seats 10) with ACTIVE interceptor IB (nominal 50 >= required 50)"
            - "hauler H PERMITTED"
            - "manifest M for EA naming EB's interceptor IB (mismatch not checked at create)"
            - "H suspended after M was created"
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "EA Grill", street_address: "40 A Ave", seating_capacity: 200, fryer_count: 3, has_charbroiler: false, cuisine_profile: HIGH_GREASE }
              as: ProgramAdmin
              captures: { ea: $.data.id }
            - call: "POST /interceptors"
              payload: { establishment_id: "${ea}", nominal_capacity_gal: 600 }
              as: ProgramAdmin
              captures: { ia: $.data.id }
            - call: "POST /interceptors/${ia}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /interceptors/${ia}/commission"
