              as: ShopAdmin
              captures: { std_id: $.data.id }
            - call: "POST /shop/core-units"
              payload: { customer_id: "${cust_id}", clearance_standard_id: "${std_id}", serial_no: "SN-EDG-3", rebuild_count: 0, declared_condition_grade: "GRADE_B" }
              as: ShopAdmin
              captures: { core_id: $.data.id }
            - call: "POST /shop/rebuild-orders"
