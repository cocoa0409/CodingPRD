      - name: occ_work_item_estimate_stale_then_fresh
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[work-item-estimate-stale]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on WorkItem.version: a fresh estimate (expected version from the create response) succeeds and bumps version 1 -> 2; replaying the same stale expected version is then rejected 412 ERR_STALE_VERSION — two strictly sequential requests."
        test_recipe:
          setup: ["turnaround PLANNING; work item W1 PROPOSED with version 1 (captured from create response)"]
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-OCC1", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 500000, contingency_budget_cents: 100000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "Anchor", system_area: "A", work_type: "CORRECTIVE", risk_class: "A", estimated_hours: 10, estimated_cost_cents: 10000 }, as: Planner, captures: { w1_id: "$.data.id", w_v: "$.data.version" } }
          trigger:
            - { call: "POST /work-items/${w1_id}/estimate", payload: { estimated_hours: 12, estimated_cost_cents: 12000, risk_class: "B", expected_work_item_version: "${w_v}" }, as: Planner, captures: { v2: "$.data.version", st: "$.data.status" } }
            - { call: "POST /work-items/${w1_id}/estimate", payload: { estimated_hours: 14, estimated_cost_cents: 14000, risk_class: "C", expected_work_item_version: "${w_v}" }, as: Planner, captures: { err: "$.data.error_id" } }
          assert:
            - "first estimate -> 200 with version == 2 (fresh expected version accepted; version bumped)"
            - "second estimate with the now-stale expected version -> 412 ERR_STALE_VERSION; item keeps estimated_hours 12"

      - name: occ_laydown_reservation_stale_area
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[laydown-reservation-stale-area]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on LayDownArea.version: reservation R1 created against area version 1 succeeds and bumps the area to 2; a second reservation still carrying expected version 1 is rejected 412 even though capacity would admit it."
        test_recipe:
          setup: ["turnaround SCOPE_FROZEN; lay-down area A (capacity 500, version 1 captured)"]
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-OCC2", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 500000, contingency_budget_cents: 100000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "Anchor", system_area: "A", work_type: "CORRECTIVE", risk_class: "A", estimated_hours: 10, estimated_cost_cents: 10000 }, as: Planner }
            - { call: "POST /turnarounds/${t_id}/freeze-scope", payload: { scope_cutoff_count: 1 }, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/laydown-areas", payload: { name: "North Laydown", capacity_sqm: 500 }, as: TurnaroundManager, captures: { a_id: "$.data.id", a_v: "$.data.version" } }
          trigger:
            - { call: "POST /laydown-areas/${a_id}/reservations", payload: { material_description: "R1", area_sqm: 120, window_from: "2026-06-10T00:00:00Z", window_until: "2026-06-20T00:00:00Z", expected_laydown_area_version: "${a_v}" }, as: Planner, captures: { r1_id: "$.data.id" } }
            - { call: "POST /laydown-areas/${a_id}/reservations", payload: { material_description: "R2", area_sqm: 100, window_from: "2026-06-10T00:00:00Z", window_until: "2026-06-20T00:00:00Z", expected_laydown_area_version: "${a_v}" }, as: Planner, captures: { err: "$.data.error_id" } }
            - { call: "GET /laydown-areas/${a_id}", payload: {}, as: Planner, captures: { a_v2: "$.data.version", occ: "$.data.occupied_sqm" } }
          assert:
            - "R1 -> 201; R2 with the stale expected version -> 412 ERR_STALE_VERSION"
            - "LayDownArea.version == 2 and occupied_sqm == 120 (the rejected reservation left no trace)"

      - name: cascading_side_effects_chain
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: permit_revoke_hold_slip_posture_cascade
          rationale: "The depth-3 permit-revoke chain (plus the depth-2 authorize chain in discovery_authorize_committed_posture_cascade) is asserted link-by-link in §1.8."

      - name: dual_variant_layer
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: eac_provisional_diverges_from_committed_on_turnaround_cost
          rationale: "Both dual-variant calculations (EAC on Turnaround; fatigue on Worker in fatigue_penalty_rejects_worker_hours_ledger_admits) are asserted with literal divergent outcomes in §1.8."

  - section: consistency_model
    instances:
      - name: immediate_consistency_after_ledger_write
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        excluded_because:
          difficulty_instance: report_approve_then_void_restores_money_ledger
          rationale: "That instance reads back Turnaround.reported_cost_cents immediately after approve and after void, asserting the synchronously-updated values 74800 and 0."

  - section: errors
    instances:
      - name: dependency_cycle_and_self_loop_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DEPENDENCY_CYCLE]", endpoints: "POST /work-items/{id}/dependencies"]
        distinguishing_aspect: "The DAG guard fires on both a two-node cycle (X->M then M->X) and a self-loop (X->X) with the same error."
        test_recipe:
          setup: ["turnaround PLANNING; PROPOSED items X and M with dependency X -> M already stored"]
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-CYC2", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 500000, contingency_budget_cents: 100000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "X", system_area: "A", work_type: "CORRECTIVE", risk_class: "A", estimated_hours: 10, estimated_cost_cents: 10000 }, as: Planner, captures: { x_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "M", system_area: "A", work_type: "CORRECTIVE", risk_class: "B", estimated_hours: 20, estimated_cost_cents: 20000 }, as: Planner, captures: { m_id: "$.data.id" } }
            - { call: "POST /work-items/${m_id}/dependencies", payload: { predecessor_work_item_id: "${x_id}", lag_hours: 0 }, as: Planner }
          trigger:
            - { call: "POST /work-items/${x_id}/dependencies", payload: { predecessor_work_item_id: "${m_id}", lag_hours: 0 }, as: Planner, captures: { err1: "$.data.error_id" } }
            - { call: "POST /work-items/${x_id}/dependencies", payload: { predecessor_work_item_id: "${x_id}", lag_hours: 0 }, as: Planner, captures: { err2: "$.data.error_id" } }
          assert:
            - "M -> X rejected with ERR_DEPENDENCY_CYCLE (409): X already reaches M transitively"
            - "X -> X rejected with ERR_DEPENDENCY_CYCLE (409): self-loop counts as a cycle"

