            - "Supporter.${sup1_id}.sms_consent_state == REVOKED"
            - "Supporter.${sup1_id}.phone_consent_state == REVOKED"
            - "Supporter.${sup1_id}.suppressed == false"
            - "Supporter.${sup1_id}.consent_event_count == 5"

