      - name: safety_beats_constraint_when_certifying_an_underbonded_unassumed_sale
        grounds:
          - validations[priority=9]
          - validations[priority=12]
          - errors[ERR_4204_BOND_INSUFFICIENT]
          - errors[ERR_4204_OBLIGATION_NOT_ASSUMED]
          - calculations.required_sale_of_assets_bond
        distinguishing_aspect: |
          Category pair `business_safety` (priority 9) versus `business_constraint` (priority 12) — a
          third distinct pair: the sale posts a 0-cent bond against a required_bond_cents of
          30000000 AND declares buyer_assumes_contribution_obligation false, so the response must be
          ERR_4204_BOND_INSUFFICIENT with HTTP 422 and never ERR_4204_OBLIGATION_NOT_ASSUMED.
        test_recipe:
          setup:
            - "Plan, a seller controlled group and a buyer controlled group."
            - "Seller employer with three single-year CERTIFIED records: 2023 20000000 cents, 2024 25000000 cents, 2025 30000000 cents, so the three-year average is 25000000 and the most recent year 30000000."
            - "Asset sale closing 2026-02-01 in plan year 2026 with purchase_price_cents 300000000, bond_amount_cents 0 and buyer_assumes_contribution_obligation false, so required_bond_cents is min(max(25000000, 30000000), 300000000) == 30000000."
            - "Clock left at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Southwest Teamsters Pension Plan", industry: "TRUCKING", allocation_method: "ROLLING_5", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
