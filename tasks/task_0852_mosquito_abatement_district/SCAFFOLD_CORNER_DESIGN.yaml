          - errors[ERR_INVENTORY_NEGATIVE]
        distinguishing_aspect: "A -200.0 ml adjustment against 100.00 ml on hand returns ERR_INVENTORY_NEGATIVE (422) and leaves both on_hand_ml and received_total_ml untouched, while a -40.0 ml adjustment succeeds and moves both to 60.00."
        test_recipe:
          setup:
            - "One PesticideProduct with received_total_ml 100.00 and nothing committed or applied."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
