# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# 9 rule_ids × 2 instances = 18 instances.
#
# Shared clock default is 2026-01-01T00:00:00Z; instances set the clock to
# 2026-06-01T00:00:00Z so a DOB of 2000-01-01 proves age 26 (>=21) and IDs
# expiring 2030-01-01 are valid.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_settled_total_diverge_on_bonded_line
        grounds:
          - calculations.provisional_order_total
          - calculations.settled_order_total
          - calculations.line_excise
          - state_machines.Order.AUTHORIZED_to_CAPTURED
          - entities.Order.fields.provisional_total_cents
          - entities.Order.fields.settled_total_cents
        distinguishing_aspect: "Same Order, two algorithms on the ORDER cost domain: provisional (excise=0, tax on discounted subtotal) yields 27349; settled (real bonded excise 480 added then taxed) yields 27864 — a 515-cent divergence proving the two variants differ on identical inputs."
        test_recipe:
          setup:
            - "Clock 2026-06-01. Age-verified customer in CA."
            - "Product WINE bottle 750ml; vintage price 5000c, case_pack 6; one BONDED lot qty 6, excise 80c/unit; vintage RELEASED."
            - "POS order with one line qty 6 (a full case): provisional_total computed at submit, settled at capture."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /customers/register"
              payload: { email: "dv1@x.com", full_name: "DV One", date_of_birth: "2000-01-01", ship_state_code: "CA" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /id-scans"
              payload: { customer_id: "${cust}", id_state_code: "CA", id_expiry_date: "2030-01-01", scanned_dob: "2000-01-01" }
              as: Customer
              as_user_id: "${cust}"
              captures: { scan: $.data.id }
            - call: "POST /id-scans/${scan}/verify"
              payload: {}
              as: StoreAssociate
            - call: "POST /products"
              payload: { sku: "DV-W-1", name: "DV Wine", category: "WINE", container_type: "BOTTLE", bottle_volume_ml: 750, abv_pct: 13.50 }
              as: Admin
              captures: { prod: $.data.id }
            - call: "POST /products/${prod}/vintages"
              payload: { vintage_year: 2019, list_price_cents: 5000, case_pack_size: 6 }
              as: Admin
              captures: { vint: $.data.id }
            - call: "POST /vintages/${vint}/lots"
              payload: { tax_status: "BONDED", qty_on_hand: 6, excise_band_cents_per_unit: 80 }
              as: ComplianceOfficer
            - call: "POST /vintages/${vint}/release"
              payload: {}
              as: Admin
            - call: "POST /orders"
              payload: { customer_id: "${cust}", channel: "POS" }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/lines"
              payload: { vintage_id: "${vint}", qty: 6 }
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /orders/${ord}"
              as: Customer
              as_user_id: "${cust}"
              captures: { ov: $.data.version }
            - call: "POST /orders/${ord}/submit"
              payload: { expected_order_version: "${ov}" }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /orders/${ord}/authorize-payment"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /orders/${ord}/capture-payment"
              payload: {}
              as: StoreAssociate
          assert:
            - "Order.${ord}.provisional_total_cents == 27349"
            - "Order.${ord}.settled_total_cents == 27864"
            - "Order.${ord}.settled_total_cents - Order.${ord}.provisional_total_cents == 515"

      - name: customer_compliance_score_vs_order_cost_independent_domains
        grounds:
          - calculations.customer_compliance_status
          - calculations.provisional_order_total
          - entities.Customer.fields.compliance_status
          - state_machines.IdScan.PENDING_to_REJECTED
        distinguishing_aspect: "Dual-variant logic lives on a DIFFERENT entity domain than rule dual_variant_calc instance 1: this is integer risk SCORING on Customer (age + rejected-scan + grace contributions -> CLEAR/WATCH/BLOCKED), not cents accounting on Order."
        test_recipe:
          setup:
            - "Clock 2026-06-01. Customer registered but age NOT verified; one REJECTED IdScan on file."
            - "Score = 2 (unverified-age) + 1 (rejected scan) = 3 -> BLOCKED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /customers/register"
              payload: { email: "dv2@x.com", full_name: "DV Two", date_of_birth: "2000-01-01", ship_state_code: "CA" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /id-scans"
              payload: { customer_id: "${cust}", id_state_code: "CA", id_expiry_date: "2018-01-01", scanned_dob: "2000-01-01" }
              as: StoreAssociate
              captures: { scan: $.data.id }
            - call: "POST /id-scans/${scan}/reject"
              payload: { reject_reason: "EXPIRED" }
              as: StoreAssociate
          trigger:
            - call: "GET /customers/${cust}"
              as: ComplianceOfficer
              captures: { cs: $.data.compliance_status }
          assert:
            - "Customer.${cust}.compliance_status == BLOCKED"
            - "Customer.${cust}.age_verified == false"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: case_discount_mixed_and_full_three_input_nonlinear
        grounds:
          - calculations.case_discount
          - entities.Order.fields.discount_cents
          - state_machines.Order.CART_to_SUBMITTED
        distinguishing_aspect: "Mode (a): >=3 inputs (per-line qty, case_pack_size, list_price) with non-linear interaction — full-case units earn 0.15 while mixed units earn 0.10 only once total units reach the 12-unit tier; mixed_value below threshold earns 0."
        test_recipe:
          setup:
            - "Clock 2026-06-01. Age-verified CA customer."
            - "Vintage A price 2000c pack 6; Vintage B price 1000c pack 12. Lots TAXED qty 20 each, excise 0."
            - "POS order: line A qty 8 (6 full + 2 mixed), line B qty 6 (0 full + 6 mixed). total_units 14 >= 12 -> mixed rate 0.10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /customers/register"
              payload: { email: "cf1@x.com", full_name: "CF One", date_of_birth: "2000-01-01", ship_state_code: "CA" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /id-scans"
              payload: { customer_id: "${cust}", id_state_code: "CA", id_expiry_date: "2030-01-01", scanned_dob: "2000-01-01" }
              as: Customer
              as_user_id: "${cust}"
              captures: { scan: $.data.id }
            - call: "POST /id-scans/${scan}/verify"
              payload: {}
              as: StoreAssociate
            - call: "POST /products"
              payload: { sku: "CF-A", name: "CF A", category: "WINE", container_type: "BOTTLE", bottle_volume_ml: 750, abv_pct: 13.00 }
              as: Admin
              captures: { pA: $.data.id }
            - call: "POST /products/${pA}/vintages"
              payload: { vintage_year: 2020, list_price_cents: 2000, case_pack_size: 6 }
              as: Admin
              captures: { vA: $.data.id }
            - call: "POST /vintages/${vA}/lots"
              payload: { tax_status: "TAXED", qty_on_hand: 20, excise_band_cents_per_unit: 0 }
              as: Admin
            - call: "POST /vintages/${vA}/release"
              payload: {}
              as: Admin
            - call: "POST /products"
              payload: { sku: "CF-B", name: "CF B", category: "WINE", container_type: "BOTTLE", bottle_volume_ml: 750, abv_pct: 12.00 }
              as: Admin
              captures: { pB: $.data.id }
            - call: "POST /products/${pB}/vintages"
              payload: { vintage_year: 2020, list_price_cents: 1000, case_pack_size: 12 }
              as: Admin
              captures: { vB: $.data.id }
            - call: "POST /vintages/${vB}/lots"
              payload: { tax_status: "TAXED", qty_on_hand: 20, excise_band_cents_per_unit: 0 }
              as: Admin
            - call: "POST /vintages/${vB}/release"
              payload: {}
              as: Admin
            - call: "POST /orders"
              payload: { customer_id: "${cust}", channel: "POS" }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/lines"
              payload: { vintage_id: "${vA}", qty: 8 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /orders/${ord}/lines"
              payload: { vintage_id: "${vB}", qty: 6 }
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /orders/${ord}"
              as: Customer
              as_user_id: "${cust}"
              captures: { ov: $.data.version }
          trigger:
            - call: "POST /orders/${ord}/submit"
              payload: { expected_order_version: "${ov}" }
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "Order.${ord}.discount_cents == 2800"
            - "Order.${ord}.provisional_total_cents == 20592"

      - name: case_discount_rounding_per_component_then_sum_order_pinned
        grounds:
          - calculations.case_discount
          - entities.Order.fields.discount_cents
          - state_machines.Order.CART_to_SUBMITTED
        distinguishing_aspect: "Mode (b): nested-rounding order. round(full_value*0.15)+round(mixed_value*0.10) = 122+21 = 143, whereas sum-then-round of 121.5+20.5 = round(142.0) = 142 — the scaffold pins per-component-then-sum, so the correct discount is 143, not 142."
        test_recipe:
          setup:
            - "Clock 2026-06-01. Age-verified CA customer."
            - "A price 85c pack 6 qty 6 (full_value 510); B price 205c pack 12 qty 1 (mixed_value 205); C price 50c pack 6 qty 6 (full_value 300). total 13 >=12."
            - "full_value=810 -> 810*0.15=121.5; mixed_value=205 -> 205*0.10=20.5. per-component 122+21=143."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /customers/register"
              payload: { email: "cf2@x.com", full_name: "CF Two", date_of_birth: "2000-01-01", ship_state_code: "CA" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /id-scans"
              payload: { customer_id: "${cust}", id_state_code: "CA", id_expiry_date: "2030-01-01", scanned_dob: "2000-01-01" }
              as: Customer
              as_user_id: "${cust}"
              captures: { scan: $.data.id }
            - call: "POST /id-scans/${scan}/verify"
              payload: {}
              as: StoreAssociate
            - call: "POST /products"
              payload: { sku: "CF-RA", name: "RA", category: "WINE", container_type: "BOTTLE", bottle_volume_ml: 750, abv_pct: 13.00 }
              as: Admin
              captures: { pA: $.data.id }
            - call: "POST /products/${pA}/vintages"
              payload: { vintage_year: 2021, list_price_cents: 85, case_pack_size: 6 }
              as: Admin
              captures: { vA: $.data.id }
            - call: "POST /vintages/${vA}/lots"
              payload: { tax_status: "TAXED", qty_on_hand: 20, excise_band_cents_per_unit: 0 }
              as: Admin
            - call: "POST /vintages/${vA}/release"
              payload: {}
              as: Admin
            - call: "POST /products"
              payload: { sku: "CF-RB", name: "RB", category: "WINE", container_type: "BOTTLE", bottle_volume_ml: 750, abv_pct: 12.00 }
              as: Admin
              captures: { pB: $.data.id }
            - call: "POST /products/${pB}/vintages"
              payload: { vintage_year: 2021, list_price_cents: 205, case_pack_size: 12 }
              as: Admin
              captures: { vB: $.data.id }
            - call: "POST /vintages/${vB}/lots"
              payload: { tax_status: "TAXED", qty_on_hand: 20, excise_band_cents_per_unit: 0 }
              as: Admin
            - call: "POST /vintages/${vB}/release"
              payload: {}
              as: Admin
            - call: "POST /products"
              payload: { sku: "CF-RC", name: "RC", category: "WINE", container_type: "BOTTLE", bottle_volume_ml: 750, abv_pct: 11.00 }
              as: Admin
              captures: { pC: $.data.id }
            - call: "POST /products/${pC}/vintages"
              payload: { vintage_year: 2021, list_price_cents: 50, case_pack_size: 6 }
              as: Admin
              captures: { vC: $.data.id }
            - call: "POST /vintages/${vC}/lots"
              payload: { tax_status: "TAXED", qty_on_hand: 20, excise_band_cents_per_unit: 0 }
              as: Admin
            - call: "POST /vintages/${vC}/release"
              payload: {}
              as: Admin
            - call: "POST /orders"
              payload: { customer_id: "${cust}", channel: "POS" }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/lines"
              payload: { vintage_id: "${vA}", qty: 6 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /orders/${ord}/lines"
              payload: { vintage_id: "${vB}", qty: 1 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /orders/${ord}/lines"
              payload: { vintage_id: "${vC}", qty: 6 }
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /orders/${ord}"
              as: Customer
              as_user_id: "${cust}"
              captures: { ov: $.data.version }
          trigger:
            - call: "POST /orders/${ord}/submit"
              payload: { expected_order_version: "${ov}" }
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "Order.${ord}.discount_cents == 143"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_payment_and_fulfillment_dimensions_evolve_independently
        grounds:
          - state_machines.Order.CART_to_SUBMITTED
          - state_machines.Order.UNPAID_to_AUTHORIZED
          - state_machines.Order.AUTHORIZED_to_CAPTURED
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: "Order carries two parallel state dimensions on one row: fulfillment_status reaches SUBMITTED while payment_status independently walks UNPAID->AUTHORIZED->CAPTURED — neither dimension's transition is the other's trigger."
        test_recipe:
          setup:
            - "Clock 2026-06-01. Age-verified CA customer, TAXED vintage released, lot qty 10."
            - "Order submitted (fulfillment SUBMITTED), then payment authorized then captured."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /customers/register"
              payload: { email: "nl1@x.com", full_name: "NL One", date_of_birth: "2000-01-01", ship_state_code: "CA" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /id-scans"
              payload: { customer_id: "${cust}", id_state_code: "CA", id_expiry_date: "2030-01-01", scanned_dob: "2000-01-01" }
              as: Customer
              as_user_id: "${cust}"
              captures: { scan: $.data.id }
            - call: "POST /id-scans/${scan}/verify"
              payload: {}
              as: StoreAssociate
            - call: "POST /products"
              payload: { sku: "NL-1", name: "NL", category: "WINE", container_type: "BOTTLE", bottle_volume_ml: 750, abv_pct: 13.00 }
              as: Admin
              captures: { prod: $.data.id }
            - call: "POST /products/${prod}/vintages"
              payload: { vintage_year: 2020, list_price_cents: 3000, case_pack_size: 6 }
              as: Admin
              captures: { vint: $.data.id }
            - call: "POST /vintages/${vint}/lots"
              payload: { tax_status: "TAXED", qty_on_hand: 10, excise_band_cents_per_unit: 0 }
              as: Admin
            - call: "POST /vintages/${vint}/release"
              payload: {}
              as: Admin
            - call: "POST /orders"
              payload: { customer_id: "${cust}", channel: "POS" }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/lines"
              payload: { vintage_id: "${vint}", qty: 2 }
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /orders/${ord}"
              as: Customer
              as_user_id: "${cust}"
              captures: { ov: $.data.version }
            - call: "POST /orders/${ord}/submit"
              payload: { expected_order_version: "${ov}" }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /orders/${ord}/authorize-payment"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /orders/${ord}/capture-payment"
              payload: {}
              as: StoreAssociate
          assert:
            - "Order.${ord}.fulfillment_status == SUBMITTED"
            - "Order.${ord}.payment_status == CAPTURED"

      - name: special_order_cyclic_quote_counter_revision_loop
        grounds:
          - state_machines.SpecialOrder.QUOTED_to_COUNTERED
          - state_machines.SpecialOrder.COUNTERED_to_QUOTED
          - entities.SpecialOrder.fields.round_count
          - entities.SpecialOrder.fields.status
        distinguishing_aspect: "SpecialOrder is cyclic on a DIFFERENT entity than the Order parallel machine: QUOTED->COUNTERED->QUOTED forms a revision loop, and round_count increments each counter, returning to QUOTED after the loop."
        test_recipe:
          setup:
            - "Clock 2026-06-01. CA customer with a REQUESTED special order, quoted once, countered once (round_count 1), re-quoted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /customers/register"
              payload: { email: "nl2@x.com", full_name: "NL Two", date_of_birth: "2000-01-01", ship_state_code: "CA" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${cust}", description: "1990 rare port", requested_qty: 2 }
              as: Customer
              as_user_id: "${cust}"
              captures: { so: $.data.id }
            - call: "POST /special-orders/${so}/quote"
              payload: { quoted_unit_price_cents: 9000 }
              as: StoreAssociate
            - call: "POST /special-orders/${so}/counter"
              payload: { customer_counter_price_cents: 7000 }
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /special-orders/${so}/quote"
              payload: { quoted_unit_price_cents: 8000 }
              as: StoreAssociate
          assert:
            - "SpecialOrder.${so}.status == QUOTED"
            - "SpecialOrder.${so}.round_count == 1"
            - "SpecialOrder.${so}.quoted_unit_price_cents == 8000"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: capture_bonded_withdrawal_line_to_bonded_lot_to_taxed_lot_depth3
        grounds:
          - state_machines.Order.AUTHORIZED_to_CAPTURED
          - calculations.line_excise
          - entities.InventoryLot.fields.qty_on_hand
          - entities.OrderLine.fields.lot_id
          - entities.OrderLine.fields.line_excise_cents
        distinguishing_aspect: "Depth-3 cascade triggered by capture-payment: capture mutates the OrderLine (sets line_excise) -> that withdrawal decrements the BONDED lot's qty_on_hand -> which in turn mints/credits a TAXED lot for the same vintage; each hop is caused by the prior hop, not the original action."
        test_recipe:
          setup:
            - "Clock 2026-06-01. Age-verified CA customer; BONDED lot qty 4 excise 60c/unit; vintage released."
            - "POS order line qty 4, submitted and authorized."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /customers/register"
              payload: { email: "tc1@x.com", full_name: "TC One", date_of_birth: "2000-01-01", ship_state_code: "CA" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /id-scans"
              payload: { customer_id: "${cust}", id_state_code: "CA", id_expiry_date: "2030-01-01", scanned_dob: "2000-01-01" }
              as: Customer
              as_user_id: "${cust}"
              captures: { scan: $.data.id }
            - call: "POST /id-scans/${scan}/verify"
              payload: {}
              as: StoreAssociate
            - call: "POST /products"
              payload: { sku: "TC-1", name: "TC", category: "SPIRITS", container_type: "BOTTLE", bottle_volume_ml: 750, abv_pct: 40.00 }
              as: Admin
              captures: { prod: $.data.id }
            - call: "POST /products/${prod}/vintages"
              payload: { vintage_year: 2018, list_price_cents: 4000, case_pack_size: 6 }
              as: Admin
              captures: { vint: $.data.id }
            - call: "POST /vintages/${vint}/lots"
              payload: { tax_status: "BONDED", qty_on_hand: 4, excise_band_cents_per_unit: 60 }
              as: ComplianceOfficer
              captures: { blot: $.data.id }
            - call: "POST /vintages/${vint}/release"
              payload: {}
              as: Admin
            - call: "POST /orders"
              payload: { customer_id: "${cust}", channel: "POS" }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/lines"
              payload: { vintage_id: "${vint}", qty: 4 }
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /orders/${ord}"
              as: Customer
              as_user_id: "${cust}"
              captures: { ov: $.data.version }
            - call: "POST /orders/${ord}/submit"
              payload: { expected_order_version: "${ov}" }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /orders/${ord}/authorize-payment"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /orders/${ord}/capture-payment"
              payload: {}
              as: StoreAssociate
          assert:
            - "InventoryLot.${blot}.qty_on_hand == 0"
            - "InventoryLot.${blot}.qty_reserved == 0"
            - "Order.${ord}.settled_total_cents > Order.${ord}.provisional_total_cents"

      - name: shipment_return_cancels_order_releases_reservation_depth2
        grounds:
          - state_machines.Shipment.DISPATCHED_to_RETURNED
          - state_machines.Order.SUBMITTED_to_CANCELLED
          - entities.InventoryLot.fields.qty_reserved
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: "Depth-2 cascade from a DIFFERENT trigger (shipment return, not capture): shipment RETURNED -> owning Order fulfillment CANCELLED via compensation -> that order-cancel releases the line reservation and restores qty_reserved; the second hop is caused by the order-cancel, not by the return directly."
        test_recipe:
          setup:
