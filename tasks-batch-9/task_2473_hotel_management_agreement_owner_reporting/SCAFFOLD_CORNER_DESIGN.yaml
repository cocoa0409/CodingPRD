  # =========================================================================
  # Cross-cutting complexity layers
  # =========================================================================
  - section: cross-cutting complexity layers
    instances:
      - name: budget_create_rejects_a_stale_expected_agreement_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[budget-revision-stale-agreement]
          - errors[ERR_STALE_AGREEMENT_VERSION]
        distinguishing_aspect: "A version captured before an intervening budget create is stale by the time it is used, so the second create returns ERR_STALE_AGREEMENT_VERSION with HTTP 412; refreshing the version makes the identical body succeed."
        test_recipe:
          setup:
            - "One ACTIVE agreement at version 2, with the client holding that version."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Stale Budget Hotel", owner_entity_name: "Stale Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000 }
              as: PlatformAdmin
              captures: { sb_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${sb_agr}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { sb_v2: $.data.version }
          trigger:
            - call: "POST /hotel-management/agreements/${sb_agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 300000000, budgeted_operating_expenses_cents: 200000000, expected_agreement_version: "${sb_v2}" }
              as: HotelManagerOps
              captures: { sb_bud1: $.data.id }
            - call: "POST /hotel-management/agreements/${sb_agr}/budgets"
              payload: { fiscal_year: 2027, budgeted_revenue_cents: 320000000, budgeted_operating_expenses_cents: 210000000, expected_agreement_version: "${sb_v2}" }
              as: HotelManagerOps
              captures: { sb_err: $.data.error_id }
            - call: "GET /hotel-management/agreements/${sb_agr}"
              payload: {}
              as: HotelManagerOps
              captures: { sb_v3: $.data.version }
            - call: "POST /hotel-management/agreements/${sb_agr}/budgets"
              payload: { fiscal_year: 2027, budgeted_revenue_cents: 320000000, budgeted_operating_expenses_cents: 210000000, expected_agreement_version: "${sb_v3}" }
              as: HotelManagerOps
              captures: { sb_bud2: $.data.id }
          assert:
            - "the first create returns HTTP 201 and advances ManagementAgreement.${sb_agr}.version"
            - "the replay with the now-stale ${sb_v2} returns HTTP 412 with error.error_id == ERR_STALE_AGREEMENT_VERSION"
            - "immediately after the 412, GET /hotel-management/budgets with fiscal_year 2027 returns pagination.total_count == 0 — the rejected create wrote nothing"
            - "the refreshed ${sb_v3} is exactly one greater than ${sb_v2} and the identical body then returns HTTP 201 with OperatingBudget.${sb_bud2}.fiscal_year == 2027"
            - "a version far in the future is equally stale-rejected: only exact equality passes"

      - name: annual_true_up_rejects_a_stale_expected_agreement_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[true-up-stale-agreement]
          - errors[ERR_STALE_AGREEMENT_VERSION]
        distinguishing_aspect: "The second declared OCC rule guards the true-up: a version captured before the budget create is refused with HTTP 412, and the refreshed version produces the FINAL accrual exactly once."
        test_recipe:
          setup:
            - "One ACTIVE agreement whose version was read at activation, then advanced by a budget create."
            - "An APPROVED FY2026 budget and one FINANCIAL-ACCEPTED (2026, 9) package with agop 20220000."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Stale True Up Hotel", owner_entity_name: "Stale TU Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000, ffe_reserve_pct: 0, working_capital_floor_cents: 0, initial_working_capital_cents: 0 }
              as: PlatformAdmin
              captures: { su_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${su_agr}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { su_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${su_agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 300000000, budgeted_operating_expenses_cents: 200000000, expected_agreement_version: "${su_v2}" }
              as: HotelManagerOps
              captures: { su_bud: $.data.id }
            - call: "POST /hotel-management/budgets/${su_bud}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/budgets/${su_bud}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/agreements/${su_agr}/report-packages"
              payload: { fiscal_year: 2026, period_month: 9, rooms_revenue_cents: 20000000, fnb_revenue_cents: 5000000, other_revenue_cents: 1000000, operating_expenses_cents: 5000000, closing_cash_available_cents: 0 }
              as: HotelManagerOps
              captures: { su_pkg: $.data.id }
            - call: "POST /hotel-management/report-packages/${su_pkg}/submit"
              payload: {}
              as: HotelManagerOps
            - call: "POST /hotel-management/report-packages/${su_pkg}/owner-review"
              payload: { dimension: "FINANCIAL", decision: "ACCEPT" }
              as: OwnerRep
              as_user_id: "u-owner-1"
          trigger:
            - call: "POST /hotel-management/agreements/${su_agr}/annual-true-up"
              payload: { fiscal_year: 2026, expected_agreement_version: "${su_v2}" }
              as: HotelManagerOps
              captures: { su_err: $.data.error_id }
            - call: "GET /hotel-management/agreements/${su_agr}"
              payload: {}
              as: HotelManagerOps
              captures: { su_v3: $.data.version }
            - call: "POST /hotel-management/agreements/${su_agr}/annual-true-up"
              payload: { fiscal_year: 2026, expected_agreement_version: "${su_v3}" }
              as: HotelManagerOps
              captures: { su_accr: $.data.true_up_accrual_id }
          assert:
            - "the stale run returns HTTP 412 with error.error_id == ERR_STALE_AGREEMENT_VERSION"
            - "GET /hotel-management/report-packages/${su_pkg}/fee-accruals with variant FINAL returns pagination.total_count == 0 after the 412"
            - "the refreshed run returns HTTP 200 with true_up_delta_cents == -939000 and a non-null ${su_accr}"
            - "the FINAL accrual list then reports pagination.total_count == 1 — the true-up posts once, not twice"
            - "both OCC rules use the same occ_field name expected_agreement_version and the same 412 code, but each guards its own endpoint"

      - name: agreement_version_increments_only_on_parent_touching_writes
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[budget-revision-stale-agreement]
          - entities.ManagementAgreement.version
        distinguishing_aspect: "The version counter advances on activation, on budget create and on the true-up, but budget submit, budget decision, package create and package submit leave it untouched, so a client can hold a version across those writes."
        test_recipe:
          setup:
            - "One agreement created and then driven through a full monthly cycle, reading the version after each step."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Version Walk Hotel", owner_entity_name: "Walk Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000, ffe_reserve_pct: 0, working_capital_floor_cents: 0, initial_working_capital_cents: 0 }
              as: PlatformAdmin
              captures: { vw_agr: $.data.id, vw_v1: $.data.version }
            - call: "POST /hotel-management/agreements/${vw_agr}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { vw_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${vw_agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 300000000, budgeted_operating_expenses_cents: 200000000, expected_agreement_version: "${vw_v2}" }
              as: HotelManagerOps
              captures: { vw_bud: $.data.id }
            - call: "POST /hotel-management/budgets/${vw_bud}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/budgets/${vw_bud}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/agreements/${vw_agr}/report-packages"
              payload: { fiscal_year: 2026, period_month: 9, rooms_revenue_cents: 20000000, fnb_revenue_cents: 5000000, other_revenue_cents: 1000000, operating_expenses_cents: 5000000, closing_cash_available_cents: 0 }
              as: HotelManagerOps
              captures: { vw_pkg: $.data.id }
            - call: "POST /hotel-management/report-packages/${vw_pkg}/submit"
              payload: {}
              as: HotelManagerOps
            - call: "POST /hotel-management/report-packages/${vw_pkg}/owner-review"
              payload: { dimension: "FINANCIAL", decision: "ACCEPT" }
              as: OwnerRep
              as_user_id: "u-owner-1"
          trigger:
            - call: "GET /hotel-management/agreements/${vw_agr}"
              payload: {}
              as: AssetManager
              captures: { vw_v3: $.data.version }
            - call: "POST /hotel-management/agreements/${vw_agr}/annual-true-up"
              payload: { fiscal_year: 2026, expected_agreement_version: "${vw_v3}" }
              as: HotelManagerOps
            - call: "GET /hotel-management/agreements/${vw_agr}"
              payload: {}
              as: AssetManager
              captures: { vw_v4: $.data.version }
          assert:
            - "${vw_v1} == 1 at creation and ${vw_v2} == 2 after activation"
            - "${vw_v3} == 3 — the budget create advanced the counter once, and the submit, decision, package create, package submit and owner-review did not touch it"
            - "${vw_v4} == 4 after the true-up, the only other version-advancing write in the cycle"
            - "the true-up succeeded with the version read after all four intervening non-parent writes, proving they are not OCC-relevant"
            - "GET /hotel-management/agreements/${vw_agr} carries created_at, updated_at and version on every read"

      - name: centralized_cap_resets_for_each_reporting_period
        claim_type: rate_threshold_triggers
        grounds:
          - validations[priority=44]
          - errors[ERR_CENTRALIZED_CAP_EXCEEDED]
          - calculations.centralized_charge_allocation
        distinguishing_aspect: "The centralized cap is a per-period cumulative threshold: each of two periods absorbs its own 300000 under its own 390000 ceiling, and only a third charge that pushes one period's cumulative total to 400000 is refused."
        test_recipe:
          setup:
            - "One ACTIVE agreement with centralized_services_cap_pct 0.015 and an APPROVED FY2026 budget."
            - "Two packages, (2026, 9) and (2026, 10), each with gross revenue 26000000, so each period's cap is 390000."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Cap Reset Hotel", owner_entity_name: "Cap Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000, centralized_services_cap_pct: 0.015 }
              as: PlatformAdmin
              captures: { cr_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${cr_agr}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { cr_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${cr_agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 300000000, budgeted_operating_expenses_cents: 200000000, expected_agreement_version: "${cr_v2}" }
              as: HotelManagerOps
              captures: { cr_bud: $.data.id }
            - call: "POST /hotel-management/budgets/${cr_bud}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/budgets/${cr_bud}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/agreements/${cr_agr}/report-packages"
              payload: { fiscal_year: 2026, period_month: 9, rooms_revenue_cents: 20000000, fnb_revenue_cents: 5000000, other_revenue_cents: 1000000, operating_expenses_cents: 5000000, closing_cash_available_cents: 0 }
              as: HotelManagerOps
              captures: { cr_pkg9: $.data.id }
            - call: "POST /hotel-management/agreements/${cr_agr}/report-packages"
              payload: { fiscal_year: 2026, period_month: 10, rooms_revenue_cents: 20000000, fnb_revenue_cents: 5000000, other_revenue_cents: 1000000, operating_expenses_cents: 5000000, closing_cash_available_cents: 0 }
              as: HotelManagerOps
              captures: { cr_pkg10: $.data.id }
          trigger:
            - call: "POST /hotel-management/report-packages/${cr_pkg9}/centralized-charges"
              payload: { service_code: "RESERVATIONS", allocation_basis: "GROSS_REVENUE", pool_amount_cents: 6000000, hotel_basis_share: 0.05 }
              as: HotelManagerOps
              captures: { cr_c9: $.data.id }
            - call: "POST /hotel-management/report-packages/${cr_pkg10}/centralized-charges"
              payload: { service_code: "RESERVATIONS", allocation_basis: "GROSS_REVENUE", pool_amount_cents: 6000000, hotel_basis_share: 0.05 }
              as: HotelManagerOps
              captures: { cr_c10: $.data.id }
            - call: "POST /hotel-management/report-packages/${cr_pkg9}/centralized-charges"
              payload: { service_code: "MARKETING", allocation_basis: "GROSS_REVENUE", pool_amount_cents: 2000000, hotel_basis_share: 0.05, allow_deferral: false }
              as: HotelManagerOps
              captures: { cr_err: $.data.error_id }
            - call: "POST /hotel-management/report-packages/${cr_pkg9}/centralized-charges"
              payload: { service_code: "MARKETING", allocation_basis: "GROSS_REVENUE", pool_amount_cents: 2000000, hotel_basis_share: 0.05, allow_deferral: true, supporting_detail_provided: true }
              as: HotelManagerOps
              captures: { cr_c9b: $.data.id }
          assert:
            - "both RESERVATIONS charges return HTTP 201 with allocated_amount_cents == 300000 and deferred_amount_cents == 0 — the same service code is legal once per period"
            - "the hard-capped MARKETING charge returns HTTP 422 with error.error_id == ERR_CENTRALIZED_CAP_EXCEEDED because 300000 + 100000 exceeds the 390000 period cap"
            - "the deferral-tolerant retry returns HTTP 201 with CentralizedServiceCharge.${cr_c9b}.requested_amount_cents == 100000, allocated_amount_cents == 90000 and deferred_amount_cents == 10000"
            - "MonthlyReportPackage.${cr_pkg9}.allocated_centralized_cents == 390000, exactly the cap, while ${cr_pkg10} stands at 300000 — the ceiling is per period, never cumulative across the year"
            - "a further charge of any size on ${cr_pkg9} with allow_deferral false is refused, while ${cr_pkg10} still has 90000 of headroom"

