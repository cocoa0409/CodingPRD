              as: PortfolioManager
              captures: { ag4_id: $.data.id, ag4_v: $.data.version }
            - call: "POST /mgmt/agreements/${ag4_id}/activate"
              payload: { expected_agreement_version: "${ag4_v}" }
              as: PortfolioManager
            - call: "POST /mgmt/properties/${p4_id}/onboardings"
              payload: { prior_manager_name: "PriorCo", takeover_date: "2025-12-01T00:00:00Z", deposits_received_cents: 0, prepaid_rent_cents: 0, delinquency_cents: 0 }
              as: PortfolioManager
              captures: { ob4_id: $.data.id }
            - call: "POST /mgmt/properties/${p4_id}/residents"
              payload: { unit_label: "401", full_name: "Res Four", lease_end_date: "2027-11-30T00:00:00Z" }
              as: PropertyAccountant
              captures: { r4_id: $.data.id }
            - call: "POST /mgmt/onboardings/${ob4_id}/verify_resident_data"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob4_id}/import_ledger"
