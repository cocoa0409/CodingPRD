  - rule_id: compensating_invariant
    instances:
      - name: parts_inventory_units_conserved_across_posting_and_work_order_cancel
        conserved_quantity: "physical units of a catalog part"
        grounds:
          - calculations.parts_inventory_conservation
          - state_machines.WorkOrder.IN_PROGRESS_to_CANCELLED
          - entities.PartCatalogItem.fields.on_hand_qty
          - entities.PartsConsumptionEntry.fields.status
          - derivation_ladder.L55
        distinguishing_aspect: |
          Conserved quantity is PHYSICAL UNITS: on_hand_qty plus the sum of POSTED
          consumption quantities equals 20 before the posting (20 + 0), during the
          posting (17 + 3) and after the compensating cancellation (20 + 0), with zero
          drift.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T09:00:00Z, advanced to 2026-06-01T12:00:00Z before work starts."
            - "One account, property, well, JOURNEYMAN technician and one CONTROL part costing 3000 cents with exactly 20 units on hand."
            - "An emergency ticket diagnosed CONTROL_FAILURE with a 20000-cent estimate, founding a work order that is scheduled and started."
            - "Three units are posted against the IN_PROGRESS work order."
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
