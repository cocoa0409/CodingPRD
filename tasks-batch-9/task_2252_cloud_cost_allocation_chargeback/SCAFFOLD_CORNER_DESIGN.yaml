        - name: tag_compliance_weights_are_summed_over_the_mandatory_subset_only
          claim_type: Constants Applied
          grounds: "§1.3 tag_compliance_evaluation with DIMENSION_WEIGHT team 40, environment 35, application 25, and mandatory_weight computed over the policy's own dimension list rather than over all three."
          distinguishing_aspect: "The policy demands only team and application, so the denominator is 65, not 100 — a two-decimal non-terminating quotient (25 / 65) that also exercises round_half_up. The BLOCKING policy also drives the TAG_REJECTED -> SUBMITTED retag cycle, so the score is recomputed on a second pass."
