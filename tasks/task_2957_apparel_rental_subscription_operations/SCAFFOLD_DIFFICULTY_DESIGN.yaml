            - "after the release GET /rental-units?style_id={style_id}&size=M reports total_count == 2 with both rows at availability_state == IN_STOCK and condition_state == FLOOR_READY"
            - "the formerly allocated unit reports turns_completed == 0, realized_revenue_cents == 0 and occupied_until_date == null, so the compensation left no residue"
            - "the member reports units_out_count == 0 and swaps_used_current_month == 0"
      - name: member_fee_balance_and_waiver_coverage_restored_by_overturned_dispute
        grounds:
          - "1.3 calculation member_fee_balance_invariant with DELINQUENCY_THRESHOLD_CENTS 15000"
          - "1.1 FeeLedgerEntry kinds DAMAGE_FEE, WAIVER_CREDIT and DISPUTE_REVERSAL with balance_after_cents"
          - "1.5 POST /damage-claims/{claim_id}/charge, disputes and dispute-resolution with resolution OVERTURNED"
          - "1.1 Member.outstanding_fee_cents and waiver_coverage_used_cents"
          - "1.2 DamageClaim CHARGED to DISPUTED to DISMISSED"
        distinguishing_aspect: >-
          Two quantities are conserved here and both must return to their pre-charge values: the member's signed
          ledger balance and the consumed waiver coverage. The charge posts a DAMAGE_FEE of 19200 and a WAIVER_CREDIT
          of -10000, leaving outstanding_fee_cents 9200 with waiver_coverage_used_cents 10000; the OVERTURNED verdict
          posts a single DISPUTE_REVERSAL of -9200 so the three amounts sum to exactly 0 and the coverage is released.
          The ledger is append-only, so the invariant is checked through the balance_after_cents chain 19200, 9200, 0
          rather than by mutation - an implementation that edits or deletes the original entries fails the total_count
          assertion even if the final balance looks right.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "plan SIG4 with waiver_coverage_cents 10000, two certified technicians, style AUR-GOWN-01 (retail_price_cents 48000) and one grade-A size-M unit"
            - "member on SIG4 created with waiver_active true, waiver_coverage_used_cents 0 and outstanding_fee_cents 0"
            - "one turn is completed to inbound receipt (received 2026-08-18, exactly on the grace date so no late fee is posted) and inspected NONE soil / SEVERE damage / condition_grade_after B"
            - "the assessment yields residual_value_cents 19200, gross_fee_cents 19200, waiver_applied_cents 10000 and net_fee_cents 9200, and it consumes the whole coverage"
            - "the dispute is filed while the clock is still 2026-08-18, inside the DISPUTE_WINDOW_DAYS 7 window after charged_at"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /membership-plans"
              payload: { code: "SIG4", name: "Signature 4", item_slots: 3, monthly_fee_cents: 10000, monthly_swaps_allowed: 2, shipping_cadence_days: 7, waiver_monthly_fee_cents: 1800, waiver_coverage_cents: 10000 }
              as: PlatformAdmin
              captures: { plan_sig4_id: "$.data.id" }
            - call: "POST /technicians"
              payload: { employee_code: "T-INSP-1", full_name: "Ivo Sandoval", repair_certified: true, photography_certified: true, status: "ACTIVE" }
              as: PlatformAdmin
              captures: { tech_insp_id: "$.data.id" }
            - call: "POST /technicians"
              payload: { employee_code: "T-REP-2", full_name: "Marta Lindqvist", repair_certified: true, photography_certified: true, status: "ACTIVE" }
              as: PlatformAdmin
              captures: { tech_rep_id: "$.data.id" }
            - call: "POST /styles"
              payload: { style_code: "AUR-GOWN-01", brand: "Aurelia", category: "GOWN", retail_price_cents: 48000, acquisition_cost_cents: 21000, size_run: ["S", "M", "L"], expected_rental_turns_per_unit: 12, planned_eol_value_cents: 9000, forecast_monthly_requests: 8, avg_rental_days: 6, planned_depth_units: 3 }
              as: InventoryPlanner
              captures: { style_gown_id: "$.data.id" }
            - call: "POST /styles/${style_gown_id}/rental-units"
              payload: { unit_code: "AUR-GOWN-01-M-001", size: "M", acquisition_cost_cents: 21000, condition_grade: "A" }
              as: InventoryPlanner
              captures: { unit1_id: "$.data.id" }
            - call: "POST /members"
              payload: { membership_plan_id: "${plan_sig4_id}", email: "nora@example.com", full_name: "Nora Ellery", waiver_active: true, preferred_categories: ["GOWN", "DRESS"], size_profile: "M" }
              as: PlatformAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /reservations"
              payload: { style_id: "${style_gown_id}", requested_size: "M", requested_start_date: "2026-08-10", requested_end_date: "2026-08-16" }
              as: Member
              as_user_id: "${member_id}"
              captures: { res1_id: "$.data.id" }
            - call: "POST /shipments"
              payload: { reservation_id: "${res1_id}", direction: "OUTBOUND", planned_ship_date: "2026-08-08", carrier_reference: "OUT-2026-08-08" }
              as: WarehouseTech
              as_user_id: "${tech_insp_id}"
              captures: { ship_out1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shipments/${ship_out1_id}/dispatch"
              payload: { carrier_reference: "OUT-2026-08-08" }
              as: WarehouseTech
              as_user_id: "${tech_insp_id}"
            - call: "POST /shipments/${ship_out1_id}/delivery"
              payload: {}
              as: WarehouseTech
              as_user_id: "${tech_insp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-16T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /reservations/${res1_id}/return-initiation"
              payload: { planned_ship_date: "2026-08-16", carrier_reference: "IN-2026-08-16" }
              as: Member
              as_user_id: "${member_id}"
              captures: { ship_in1_id: "$.data.id" }
            - call: "POST /shipments/${ship_in1_id}/dispatch"
              payload: { carrier_reference: "IN-2026-08-16" }
              as: WarehouseTech
              as_user_id: "${tech_insp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-18T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shipments/${ship_in1_id}/receipt"
              payload: {}
              as: WarehouseTech
              as_user_id: "${tech_insp_id}"
            - call: "GET /reverse-logistics-jobs"
              payload: { reservation_id: "${res1_id}" }
              as: WarehouseTech
              as_user_id: "${tech_insp_id}"
              captures: { job1_id: "$.data[0].id" }
            - call: "POST /reverse-logistics-jobs/${job1_id}/inspections"
              payload: { soil_level: "NONE", damage_severity: "SEVERE", condition_grade_after: "B", biohazard_flag: false, notes: "post-turn inspection" }
              as: WarehouseTech
              as_user_id: "${tech_insp_id}"
            - call: "GET /damage-claims"
              payload: { reservation_id: "${res1_id}" }
              as: ClaimsAdjuster
              captures: { claim1_id: "$.data[0].id" }
            - call: "POST /damage-claims/${claim1_id}/assessment"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /damage-claims/${claim1_id}/charge"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /fee-ledger-entries"
              payload: { member_id: "${member_id}" }
              as: ClaimsAdjuster
            - call: "POST /damage-claims/${claim1_id}/disputes"
              payload: { dispute_reason: "the garment was returned in the condition it arrived in" }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /damage-claims/${claim1_id}/dispute-resolution"
              payload: { resolution: "OVERTURNED" }
              as: ClaimsAdjuster
            - call: "GET /fee-ledger-entries"
              payload: { member_id: "${member_id}" }
              as: ClaimsAdjuster
            - call: "GET /members/${member_id}"
              payload: {}
              as: ClaimsAdjuster
          assert:
            - "the assessed claim reports gross_fee_cents == 19200, waiver_applied_cents == 10000 and net_fee_cents == 9200, and the member reports waiver_coverage_used_cents == 10000"
            - "the charge moves the claim to CHARGED and the first ledger read reports total_count == 2: a DAMAGE_FEE DEBIT of 19200 with balance_after_cents 19200 and a WAIVER_CREDIT CREDIT of -10000 with balance_after_cents 9200"
            - "after the charge the member reports outstanding_fee_cents == 9200 and status == ACTIVE, because 9200 is below DELINQUENCY_THRESHOLD_CENTS 15000"
            - "the dispute moves the claim to DISPUTED with dispute_round == 1 and is accepted because the clock is inside the 7-day window after charged_at"
            - "the OVERTURNED verdict moves the claim to state == DISMISSED with resolution == OVERTURNED and net_fee_cents == 0"
            - "the second ledger read reports total_count == 3, the third entry being a DISPUTE_REVERSAL CREDIT of -9200 with balance_after_cents == 0"
            - "the three amount_cents values sum to exactly 0 (19200 - 10000 - 9200) and the balance_after_cents chain reads 19200, 9200, 0, so the append-only ledger reconciles without drift"
            - "the member finally reports outstanding_fee_cents == 0, waiver_coverage_used_cents == 0 and status == ACTIVE, so both conserved quantities are back at their pre-charge values"
