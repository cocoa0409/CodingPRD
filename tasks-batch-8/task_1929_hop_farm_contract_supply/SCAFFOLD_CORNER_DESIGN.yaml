          assert:
            - "captured err == ERR_EMPTY_DELIVERY"

      - name: pay_blocked_plan_not_complete
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PLAN_NOT_COMPLETE]
          - state_machines.InsuranceClaim.APPROVED_to_PAID
        distinguishing_aspect: "Pay while the plan is still HARVESTING -> ERR_PLAN_NOT_COMPLETE; claim stays APPROVED."
        test_recipe:
          setup: ["plan HARVESTING; claim APPROVED (filed at GROWING, reviewed and approved by adjuster-9)"]
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CASCADE", planned_acreage: 40 }, as: FarmManager, captures: { p_id: $.data.id } }
            - { call: "POST /api/planting-plans/${p_id}/approve", payload: {}, as: FarmManager }
            - { call: "POST /api/insurance-claims", payload: { planting_plan_id: "${p_id}", price_election_cents_per_lb: 300 }, as: FarmManager, as_user_id: "grower-1", captures: { claim_id: $.data.id } }
            - { call: "POST /api/planting-plans/${p_id}/open-harvest", payload: {}, as: FarmManager }
            - { call: "POST /api/insurance-claims/${claim_id}/begin-review", payload: {}, as: InsuranceAdjuster, as_user_id: "adjuster-9" }
            - { call: "POST /api/insurance-claims/${claim_id}/decide", payload: { outcome: "APPROVED" }, as: InsuranceAdjuster, as_user_id: "adjuster-9" }
          trigger:
            - { call: "POST /api/insurance-claims/${claim_id}/pay", payload: {}, as: InsuranceAdjuster, as_user_id: "adjuster-9", captures: { err: $.data.error_id } }
            - { call: "GET /api/insurance-claims/${claim_id}", payload: {}, as: InsuranceAdjuster, captures: { st: $.data.status } }
