        excluded_because:
          difficulty_instance: cross_entity_state_dependency / issued_credit_can_only_land_on_a_different_later_cycle
          rationale: "That §1.8 instance already asserts both ends of the CreditMemo graph edge — cycle_id on the issuing cycle and applied_to_cycle_id on the consuming one — plus the balance movement between them."

  - section: state_machines
