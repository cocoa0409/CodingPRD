            - { call: "POST /uro/commitments", payload: { plan_id: "${plb}", window_start: "2027-05-02T00:00:00Z", window_end: "2027-05-15T00:00:00Z", committed_work_days: 8, phase_dependency: "AFTER_GRADING", joint_trench_slot_id: "${jt1}" }, as: UtilityOwnerRep, as_user_id: "${o1}", captures: { scb: $.data.id } }
            - { call: "POST /uro/commitments", payload: { plan_id: "${plc}", window_start: "2027-05-03T00:00:00Z", window_end: "2027-05-14T00:00:00Z", committed_work_days: 8, phase_dependency: "AFTER_GRADING", joint_trench_slot_id: "${jt1}" }, as: UtilityOwnerRep, as_user_id: "${o1}" }
          assert:
            - "Occupant 1's window equals the slot opening exactly and was admitted: JointTrenchSlot.${jt1}.occupant_count == 1 and status == OPEN"
            - "The first trigger call returns 422 with error_id ERR_TRENCH_WINDOW_NOT_CONTAINED: window_end 2027-05-16 is one day past trench_open_end, and containment is inclusive"
            - "The second trigger call returns 201 even though its window overlaps occupant 1's window: overlap between occupants of the same trench is permitted by design"
            - "JointTrenchSlot.${jt1}.occupant_count == 2 and JointTrenchSlot.${jt1}.status == FULL"
            - "The third trigger call returns 409 with error_id ERR_TRENCH_SLOT_AT_CAPACITY, although its window [2027-05-03, 2027-05-14] is strictly inside the slot opening"
            - "JointTrenchSlot.${jt1}.occupant_count == 2 (the rejected bookings did not consume capacity)"
            - "ScheduleCommitment.${scb}.joint_trench_slot_id == ${jt1}"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_after_execute_restores_the_committed_reimbursement_ledger_to_the_cent
        grounds:
          - state_machines.ReimbursementAgreement.EXECUTED_to_VOIDED
          - calculations.project_committed_reimbursement_ledger
          - entities.Project.fields.total_committed_reimbursement_cents
          - calculations.project_clearance_posture
        distinguishing_aspect: |
          Conserved quantity: Project.total_committed_reimbursement_cents, a money ledger. Execute
          moves it 0 -> 29070000 and void must move it back to exactly 0, not to a residue and not by
          re-summing a stale cache; the derived clearance_posture must also return to its
          pre-execution value, and the voided agreement keeps its own state_share_cents so the
          reversal is a filter change, not a data erasure.
        test_recipe:
          setup:
            - "Base chain to an APPROVED plan 40000000 / 32000000 / 1.25 for a private ELECTRIC owner at 12.5 percent indirect, conflict share 100, project authority 100000000."
            - "Agreement created at not_to_exceed_cents 45000000 with state_share_cents 29070000 and circulated."
          setup_api_calls:
            - { call: "POST /uro/projects", payload: { name: "SR-14 Widening Section 7", route_designation: "SR-14", letting_date: "2027-01-15T00:00:00Z", construction_start_date: "2027-03-01T00:00:00Z", construction_end_date: "2028-06-30T00:00:00Z", row_acquisition_year: 1975, reimbursement_authority_cents: 100000000, contract_daily_overhead_cents: 250000 }, as: ProgramAdmin, captures: { p1: $.data.id } }
            - { call: "POST /uro/utility-owners", payload: { legal_name: "Cascade Electric Cooperative", utility_type: "ELECTRIC", is_public_agency: false, indirect_cost_rate_pct: 12.5 }, as: ProgramAdmin, captures: { o1: $.data.id } }
            - { call: "POST /uro/facilities", payload: { owner_id: "${o1}", facility_type: "BURIED_ELECTRIC", station_begin: 100.0, station_end: 140.0, offset_ft: 12.5, depth_in: 48, material: "PVC duct bank", installed_year: 1968, occupancy_basis: "PRIVATE_EASEMENT", record_source: "AS_BUILT" }, as: UtilityCoordinator, captures: { f1: $.data.id } }
            - { call: "POST /uro/conflicts", payload: { project_id: "${p1}", facility_id: "${f1}", conflict_station: 120.0, clearance_deficiency_in: 18 }, as: UtilityCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /uro/conflicts/${c1}/set-resolution", payload: { resolution_type: "RELOCATE" }, as: UtilityCoordinator }
            - { call: "POST /uro/prior-rights", payload: { conflict_id: "${c1}", claimed_basis: "PRIVATE_EASEMENT", narrative: "Recorded private easement predating right-of-way acquisition." }, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1", captures: { d1: $.data.id } }
            - { call: "POST /uro/prior-rights/${d1}/submit-for-review", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1" }
            - { call: "POST /uro/prior-rights/${d1}/issue", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1" }
            - { call: "GET /uro/conflicts/${c1}", payload: {}, as: UtilityCoordinator, captures: { c1v: $.data.version } }
            - { call: "POST /uro/relocation-plans", payload: { conflict_id: "${c1}", expected_conflict_version: "${c1v}", estimated_cost_cents: 40000000, replacement_in_kind_cost_cents: 32000000, proposed_capacity_ratio: 1.25, work_days: 11 }, as: UtilityOwnerRep, as_user_id: "${o1}", captures: { pl1: $.data.id } }
            - { call: "POST /uro/permits", payload: { conflict_id: "${c1}", permit_type: "ENCROACHMENT_PERMIT", expires_on: "2028-12-31T00:00:00Z" }, as: UtilityCoordinator, captures: { pm1: $.data.id } }
            - { call: "POST /uro/permits/${pm1}/decide", payload: { decision: "GRANT" }, as: UtilityCoordinator }
            - { call: "POST /uro/relocation-plans/${pl1}/start-review", payload: {}, as: UtilityCoordinator }
            - { call: "POST /uro/relocation-plans/${pl1}/approve", payload: {}, as: UtilityCoordinator }
            - { call: "GET /uro/relocation-plans/${pl1}", payload: {}, as: AgreementOfficer, captures: { pl1v: $.data.version } }
            - { call: "POST /uro/agreements", payload: { plan_id: "${pl1}", expected_plan_version: "${pl1v}", not_to_exceed_cents: 45000000 }, as: AgreementOfficer, as_user_id: "officer-1", captures: { a1: $.data.id, a1_share: $.data.state_share_cents } }
            - { call: "POST /uro/agreements/${a1}/circulate", payload: {}, as: AgreementOfficer, as_user_id: "officer-1" }
            - { call: "GET /uro/projects/${p1}", payload: {}, as: ProgramAdmin, captures: { ledger_before: $.data.total_committed_reimbursement_cents, posture_before: $.data.clearance_posture } }
          trigger:
            - { call: "POST /uro/agreements/${a1}/execute", payload: {}, as: AgreementOfficer, as_user_id: "officer-1" }
            - { call: "GET /uro/projects/${p1}", payload: {}, as: ProgramAdmin, captures: { ledger_mid: $.data.total_committed_reimbursement_cents, posture_mid: $.data.clearance_posture } }
            - { call: "POST /uro/agreements/${a1}/void", payload: { void_reason: "Owner withdrew from the joint relocation; agreement voided before billing." }, as: AgreementOfficer, as_user_id: "officer-1", captures: { exec_after: $.data.execution_status, settle_after: $.data.settlement_status } }
          assert:
            - "Before: Project.${p1}.total_committed_reimbursement_cents == 0 and Project.${p1}.clearance_posture == CLEARANCE_PENDING"
            - "After execute: Project.${p1}.total_committed_reimbursement_cents == 29070000"
            - "After void: Project.${p1}.total_committed_reimbursement_cents == 0 (restored exactly, no residue)"
            - "After void: Project.${p1}.clearance_posture == CLEARANCE_PENDING (the pre-execution value)"
            - "ReimbursementAgreement.${a1}.execution_status == VOIDED and settlement_status == VOIDED_OUT"
            - "ReimbursementAgreement.${a1}.state_share_cents == 29070000 (the agreement keeps its computed figures; only its ledger membership changed)"
            - "Project.${p1}.estimated_state_liability_cents == 25600000 (the forward estimate is unaffected by the void)"

      - name: withdraw_allocation_restores_compensable_delay_days_and_owner_liability
        grounds:
          - state_machines.DelayClaim.ALLOCATED_to_UNDER_ANALYSIS
          - calculations.delay_claim_allocation
          - calculations.project_aggregate_compensable_delay
          - entities.UtilityOwner.fields.assessed_delay_liability_cents
          - entities.Project.fields.aggregate_compensable_delay_days
        distinguishing_aspect: |
          Different conserved quantities - Project.aggregate_compensable_delay_days (a day count) and
          UtilityOwner.assessed_delay_liability_cents (a liability in cents) - reversed by a different
          compensating action. compensable_days stays 3 on the claim after withdrawal, so the
          aggregate must fall to 0 through the ALLOCATED membership filter rather than by zeroing the
          claim's own analysis, while allocated_to_owner_cents and allocated_to_state_cents do reset.
        test_recipe:
          setup:
            - "Base chain to an APPROVED plan and a commitment for [2027-04-05, 2027-04-20] with contract_daily_overhead_cents 250000 on the project."
            - "The clock is advanced to 2027-04-28 and the commitment is reported complete, so it becomes BREACHED with late_days 8 (one strike only, no reimbursement hold)."
            - "A contractor delay claim of claimed_days 12 and claimed_amount_cents 3600000 is filed and analysed with delay_cause UTILITY_OWNER, giving net_late 3, compensable_days 3, implied rate 300000 capped to the 250000 project overhead, gross 750000."
          setup_api_calls:
            - { call: "POST /uro/projects", payload: { name: "SR-14 Widening Section 9", route_designation: "SR-14", letting_date: "2027-01-15T00:00:00Z", construction_start_date: "2027-03-01T00:00:00Z", construction_end_date: "2028-06-30T00:00:00Z", row_acquisition_year: 1975, reimbursement_authority_cents: 100000000, contract_daily_overhead_cents: 250000 }, as: ProgramAdmin, captures: { p1: $.data.id } }
            - { call: "POST /uro/utility-owners", payload: { legal_name: "Cascade Electric Cooperative", utility_type: "ELECTRIC", is_public_agency: false, indirect_cost_rate_pct: 12.5 }, as: ProgramAdmin, captures: { o1: $.data.id } }
            - { call: "POST /uro/facilities", payload: { owner_id: "${o1}", facility_type: "BURIED_ELECTRIC", station_begin: 100.0, station_end: 140.0, offset_ft: 12.5, depth_in: 48, material: "PVC duct bank", installed_year: 1968, occupancy_basis: "PRIVATE_EASEMENT", record_source: "AS_BUILT" }, as: UtilityCoordinator, captures: { f1: $.data.id } }
            - { call: "POST /uro/conflicts", payload: { project_id: "${p1}", facility_id: "${f1}", conflict_station: 120.0, clearance_deficiency_in: 18 }, as: UtilityCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /uro/conflicts/${c1}/set-resolution", payload: { resolution_type: "RELOCATE" }, as: UtilityCoordinator }
            - { call: "POST /uro/prior-rights", payload: { conflict_id: "${c1}", claimed_basis: "PRIVATE_EASEMENT", narrative: "Recorded private easement predating right-of-way acquisition." }, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1", captures: { d1: $.data.id } }
            - { call: "POST /uro/prior-rights/${d1}/submit-for-review", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1" }
            - { call: "POST /uro/prior-rights/${d1}/issue", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1" }
            - { call: "GET /uro/conflicts/${c1}", payload: {}, as: UtilityCoordinator, captures: { c1v: $.data.version } }
            - { call: "POST /uro/relocation-plans", payload: { conflict_id: "${c1}", expected_conflict_version: "${c1v}", estimated_cost_cents: 40000000, replacement_in_kind_cost_cents: 32000000, proposed_capacity_ratio: 1.25, work_days: 11 }, as: UtilityOwnerRep, as_user_id: "${o1}", captures: { pl1: $.data.id } }
            - { call: "POST /uro/permits", payload: { conflict_id: "${c1}", permit_type: "ENCROACHMENT_PERMIT", expires_on: "2028-12-31T00:00:00Z" }, as: UtilityCoordinator, captures: { pm1: $.data.id } }
            - { call: "POST /uro/permits/${pm1}/decide", payload: { decision: "GRANT" }, as: UtilityCoordinator }
            - { call: "POST /uro/relocation-plans/${pl1}/start-review", payload: {}, as: UtilityCoordinator }
            - { call: "POST /uro/relocation-plans/${pl1}/approve", payload: {}, as: UtilityCoordinator }
            - { call: "POST /uro/commitments", payload: { plan_id: "${pl1}", window_start: "2027-04-05T00:00:00Z", window_end: "2027-04-20T00:00:00Z", committed_work_days: 11, phase_dependency: "BEFORE_PAVING" }, as: UtilityOwnerRep, as_user_id: "${o1}", captures: { sc1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-04-28T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /uro/commitments/${sc1}/report-complete", payload: { completion_note: "Relocation finished eight days after the committed window." }, as: UtilityOwnerRep, as_user_id: "${o1}", captures: { sc1_status: $.data.status, sc1_late: $.data.late_days } }
            - { call: "POST /uro/delay-claims", payload: { project_id: "${p1}", commitment_id: "${sc1}", contractor_name: "Ridgeline Constructors", claimed_days: 12, claimed_amount_cents: 3600000 }, as: ConstructionEngineer, captures: { dc1: $.data.id } }
            - { call: "POST /uro/delay-claims/${dc1}/analyze", payload: { delay_cause: "UTILITY_OWNER" }, as: ConstructionEngineer, captures: { dc1_comp: $.data.compensable_days, dc1_rate: $.data.daily_rate_cents } }
            - { call: "GET /uro/projects/${p1}", payload: {}, as: ProgramAdmin, captures: { days_before: $.data.aggregate_compensable_delay_days } }
            - { call: "GET /uro/utility-owners/${o1}", payload: {}, as: ProgramAdmin, captures: { liability_before: $.data.assessed_delay_liability_cents } }
          trigger:
            - { call: "POST /uro/delay-claims/${dc1}/allocate", payload: {}, as: ConstructionEngineer, captures: { owner_cents: $.data.allocated_to_owner_cents, state_cents: $.data.allocated_to_state_cents } }
            - { call: "GET /uro/projects/${p1}", payload: {}, as: ProgramAdmin, captures: { days_mid: $.data.aggregate_compensable_delay_days } }
            - { call: "POST /uro/delay-claims/${dc1}/withdraw-allocation", payload: { withdrawal_reason: "Cause re-opened after the contractor produced new float records." }, as: ConstructionEngineer, captures: { dc1_status_after: $.data.status } }
          assert:
            - "ScheduleCommitment.${sc1}.status == BREACHED and late_days == 8"
            - "After analyze: DelayClaim.${dc1}.compensable_days == 3 (8 late days less the 5-day contractual float) and daily_rate_cents == 250000 (the 300000 implied rate capped at the project overhead)"
            - "Before allocate: Project.${p1}.aggregate_compensable_delay_days == 0 and UtilityOwner.${o1}.assessed_delay_liability_cents == 0"
            - "After allocate: DelayClaim.${dc1}.allocated_to_owner_cents == 750000 and allocated_to_state_cents == 0"
            - "After allocate: Project.${p1}.aggregate_compensable_delay_days == 3 and UtilityOwner.${o1}.assessed_delay_liability_cents == 750000"
            - "After withdraw-allocation: DelayClaim.${dc1}.status == UNDER_ANALYSIS, allocated_to_owner_cents == 0 and allocated_to_state_cents == 0"
            - "After withdraw-allocation: Project.${p1}.aggregate_compensable_delay_days == 0 and UtilityOwner.${o1}.assessed_delay_liability_cents == 0 (both restored exactly)"
            - "DelayClaim.${dc1}.compensable_days is still 3 and daily_rate_cents is still 250000: the analysis survives, only the allocation is reversed"
