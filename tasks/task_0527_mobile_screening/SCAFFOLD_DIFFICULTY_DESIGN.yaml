  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_temporal_overlap_on_booking
        grounds:
          - validations[priority=6]
          - validations[priority=11]
        distinguishing_aspect: "Category pair state (priority 6, ERR_INVALID_STATE) vs business_temporal (priority 11, ERR_SLOT_OVERLAP): booking against a non-PUBLISHED (DRAFT) event with an overlapping slot must return the higher-priority ERR_INVALID_STATE-class check first — booking on a DRAFT event fails because the event is not PUBLISHED before slot geometry is evaluated."
        test_recipe:
          setup:
            - "One DRAFT (unpublished) blood-panel event; one ACTIVE participant. Booking targets the unpublished event with any slot."
          setup_api_calls:
            - { call: "POST /mobile-units", payload: { name: "Van B", modality: "BLOOD_PANEL", daily_capacity: 10 }, as: ProgramManager, captures: { unit_id: $.data.id } }
            - { call: "POST /sponsors", payload: { name: "Acme", sponsor_type: "EMPLOYER", viewer_user_id: "sv1" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "BLOOD_PANEL", site_label: "L1", event_date: "2026-06-11", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { event_id: $.data.id } }
            - { call: "POST /participants", payload: { full_name: "P1", date_of_birth: "1980-01-01", pay_type: "SELF_PAY" }, as: ProgramManager, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${p1}", slot_start_min: 540, slot_duration_min: 30 }, as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: safety_blocked_vs_constraint_full_on_booking
        grounds:
          - validations[priority=9]
          - validations[priority=12]
        distinguishing_aspect: "Category pair business_safety (priority 9, ERR_PARTICIPANT_BLOCKED) vs business_constraint (priority 12, ERR_EVENT_FULL): a BLOCKED participant booking onto a full event returns the higher-priority ERR_PARTICIPANT_BLOCKED, not ERR_EVENT_FULL."
        test_recipe:
          setup:
            - "One PUBLISHED blood-panel event on a daily_capacity=1 unit already at booked_count=1 (full); one BLOCKED participant (no_show_strikes>=3)."
