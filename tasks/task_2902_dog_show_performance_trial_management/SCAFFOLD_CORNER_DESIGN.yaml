      - name: heat_index_at_exactly_the_amber_floor_stops_being_green
        claim_type: threshold
        grounds:
          - calculations.heat_advisory_evaluation
          - entities.Show.fields.current_advisory_level
          - entities.Show.fields.current_heat_index_c
          - endpoints[POST /dog-shows/shows/{id}/temperature-readings]
        distinguishing_aspect: "The advisory comparison is >=, so the pair 25.9 and 26.0 straddles ADVISORY_AMBER_MIN_C by one tenth: the lower reading is the only way GREEN is ever written, and the higher one must flip to AMBER without reaching RED."
        test_recipe:
          setup:
            - "Show Autumn Classic is APPROVED and indoor; no reading has been taken, so current_advisory_level is null."
            - "At 65 percent humidity the third HUMIDITY_ADJUSTMENT_TABLE row applies (+3.0 C), so 22.9 gives 25.9 and 23.0 gives exactly 26.0."
          setup_api_calls:
            - call: "POST /dog-shows/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SanctionOfficer
              as_user_id: "so-alpha"
            - call: "POST /dog-shows/clubs"
              payload: { name: "Northshore Kennel Club", club_code: "NSKC", region_code: "NE", annual_event_allowance: 2 }
              as: SanctionOfficer
              as_user_id: "so-alpha"
              captures: { club_id: $.data.id }
            - call: "POST /dog-shows/handlers"
              payload: { handler_name: "Ada Vance", member_number: "M-1001", region_code: "NE" }
              as: SanctionOfficer
              as_user_id: "so-alpha"
              captures: { h1_id: $.data.id }
            - call: "POST /dog-shows/judges"
              payload: { judge_number: "J-77", full_name: "Rex Calder", approved_breed_group_codes: ["SPORTING"], approved_performance_disciplines: ["OBEDIENCE"], home_region_code: "NE", max_daily_dog_count: 175 }
              as: SanctionOfficer
              as_user_id: "so-alpha"
              captures: { j1_id: $.data.id, j1_v: $.data.version }
            - call: "POST /dog-shows/shows"
              payload: { club_id: "${club_id}", show_name: "Autumn Classic", show_date: "2026-09-12", show_type: "CONFORMATION", venue_name: "Northshore Park", outdoor_venue: false, entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T23:59:59Z", max_total_entries: 100, championship_points_scale: "SCALE_A" }
              as: ClubOfficer
              as_user_id: "${club_id}"
              captures: { show_id: $.data.id }
            - call: "POST /dog-shows/shows/${show_id}/submit"
              payload: {}
              as: ClubOfficer
              as_user_id: "${club_id}"
            - call: "POST /dog-shows/shows/${show_id}/approve"
              payload: {}
              as: SanctionOfficer
              as_user_id: "so-alpha"
          trigger:
            - call: "POST /dog-shows/shows/${show_id}/temperature-readings"
              payload: { recorded_temp_c: 22.9, relative_humidity_pct: 65 }
              as: ShowSecretary
            - call: "POST /dog-shows/shows/${show_id}/temperature-readings"
              payload: { recorded_temp_c: 23.0, relative_humidity_pct: 65 }
              as: ShowSecretary
          assert:
            - "First call: HTTP 200 with Show.current_heat_index_c == 25.9 and Show.current_advisory_level == GREEN"
            - "Show.temperature_reading_count == 1 after the first call"
            - "Second call: HTTP 200 with Show.current_heat_index_c == 26.0 and Show.current_advisory_level == AMBER"
            - "Show.temperature_reading_count == 2 and Show.status is still APPROVED"
