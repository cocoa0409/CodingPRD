              as: NumberingAdministrator
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "555", thousands_digit: 3, contaminated_count: 0 }
              as: NumberingAdministrator
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "555", thousands_digit: 4, contaminated_count: 0 }
              as: NumberingAdministrator
            - call: "POST /numbering/utilization-filings"
              payload: { carrier_id: "${a_id}", rate_center_id: "${rc_id}", reporting_period: "2026-H1", numbers_assigned: 1300, numbers_intermediate: 0, numbers_reserved: 0, numbers_aging: 0, numbers_administrative: 0, blocks_held_at_period_end: 2, forecast_quarters: [3000, 3000, 0, 0] }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
              captures: { f_id: "$.data.id" }
            - call: "POST /numbering/utilization-filings/${f_id}/submissions"
              payload: {}
              as: CarrierRepresentative
              as_user_id: "${a_id}"
            - call: "GET /numbering/rate-centers/${rc_id}"
              payload: {}
              as: NumberingAdministrator
              captures: { rc_v: "$.data.version" }
            - call: "POST /numbering/allocation-requests"
              payload: { carrier_id: "${a_id}", rate_center_id: "${rc_id}", request_type: "GROWTH", requested_block_count: 3, justification: "three growth blocks for a 6000-number forecast", expected_rate_center_version: "${rc_v}" }
              as: CarrierRepresentative
