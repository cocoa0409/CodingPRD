      - name: overlapping_run_against_an_exclusive_skid_is_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=47]
          - errors[ERR_TEST_BAY_EXCLUSIVE_CONFLICT]
          - entities.Skid.fields.requires_exclusive_bay
        distinguishing_aspect: |
          requires_exclusive_bay is derived from the package's code stamp, so the ASME_U filtration
          skid claims the whole bay: its 12:00-20:00 window overlaps the disinfection skid's
          08:00-16:00 booking and the request is refused with ERR_TEST_BAY_EXCLUSIVE_CONFLICT (409) at
          priority 47 - the bay's 20000.0 sf capacity would easily hold 1200 + 5400 sf, so the capacity
          rule at priority 48 is never the answer, and the incumbent booking keeps its 576000 reserved
          footprint-minutes.
