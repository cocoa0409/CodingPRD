  - rule_id: priority_pair_validation_conflict
    instances:
      - name: dispatch_by_account_owner_forbidden_role_beats_not_found
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_FORBIDDEN_ROLE]
          - errors[ERR_ROUTE_RUN_NOT_FOUND]
        distinguishing_aspect: |
          Category pair auth (rung 2) versus existence (rung 3): an AccountOwner dispatching a
          RouteRun id that does not exist gets ERR_FORBIDDEN_ROLE, never ERR_ROUTE_RUN_NOT_FOUND,
          because the role gate is evaluated before any path id is resolved.
        test_recipe:
          setup:
            - "One ACTIVE Account exists so the AccountOwner header carries a real entity id."
            - "No RouteRun exists at all."
          setup_api_calls:
            - call: "POST /sharpening/accounts"
              payload: { name: "Blue Fork Kitchen", account_type: "RESTAURANT", zone_code: "ZONE_N", contact_email: "ops@bluefork.test", billing_mode: "PER_VISIT" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /sharpening/route-runs/11111111-2222-4333-8444-555555555555/dispatch"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "error_id == ERR_FORBIDDEN_ROLE"
            - "error_id != ERR_ROUTE_RUN_NOT_FOUND"

      - name: suspended_account_beats_credit_limit_on_submit
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - calculations.subscription_proration
          - calculations.account_outstanding_balance
          - state_machines.Account.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Category pair state (rung 9, ERR_ACCOUNT_SUSPENDED) versus business_fiscal (rung 11,
          ERR_CREDIT_LIMIT_BLOCKED): the account is simultaneously SUSPENDED and 19627 cents over a
          zero credit limit, and submit must answer with ERR_ACCOUNT_SUSPENDED because the account
          gate sits two rungs above the credit gate.
        test_recipe:
          setup:
            - "An Account with credit_limit_cents 0 carrying a DRAFT ServiceRequest that already holds one CHEF_KNIFE item."
            - "An ACTIVE MONTHLY Subscription on BLADE_BASIC anchored 2026-06-01, upgraded to WEEKLY, which mints a DRAFT Invoice holding a +18300 PRORATION_CREDIT line."
            - "That invoice issued, so outstanding_balance_cents is 19627, well above the zero credit limit."
            - "The account then suspended."
          setup_api_calls:
            - call: "POST /sharpening/item-class-specs"
              payload: { item_class: "CHEF_KNIFE", bevel_angle_degrees: 20, base_service_minutes: 6, list_price_cents: 900, required_certification: "NONE", price_tier: "TIER_1", min_locker_size: "SMALL", loaner_eligible: true }
              as: PlatformAdmin
              captures: { spec_chef: $.data.id }
            - call: "POST /sharpening/plan-tiers"
              payload: { code: "BLADE_BASIC", monthly_fee_cents: 12000, included_items_per_cycle: 1, overage_discount_pct: 0.15, allowed_cadences: ["WEEKLY", "BIWEEKLY", "MONTHLY"] }
              as: PlatformAdmin
              captures: { tier: $.data.id }
            - call: "POST /sharpening/accounts"
              payload: { name: "Blue Fork Kitchen", account_type: "RESTAURANT", zone_code: "ZONE_N", contact_email: "ops@bluefork.test", billing_mode: "PER_VISIT", credit_limit_cents: 0 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /sharpening/service-requests"
              payload: { account_id: "${acct}", channel: "VAN_ROUTE", requested_date: "2026-05-01" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { sr: $.data.id }
            - call: "POST /sharpening/service-requests/${sr}/items"
              payload: { item_class_spec_id: "${spec_chef}", item_class: "CHEF_KNIFE", declared_damage_tier: "ROUTINE_HONE" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { item: $.data.id }
            - call: "POST /sharpening/subscriptions"
              payload: { account_id: "${acct}", plan_tier_id: "${tier}", cadence: "MONTHLY", anchor_date: "2026-06-01" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { sub: $.data.id, sub_v: $.data.version }
            - call: "POST /sharpening/subscriptions/${sub}/cadence"
              payload: { cadence: "WEEKLY", expected_subscription_version: "${sub_v}" }
              as: AccountOwner
              as_user_id: "${acct}"
            - call: "GET /sharpening/invoices"
              payload: { account_id: "${acct}", status: "DRAFT" }
              as: BillingClerk
              captures: { draft_inv: "$.data[0].id" }
            - call: "POST /sharpening/invoices/${draft_inv}/issue"
              payload: {}
              as: BillingClerk
            - call: "POST /sharpening/accounts/${acct}/suspend"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /sharpening/service-requests/${sr}/submit"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_ACCOUNT_SUSPENDED"
            - "error_id != ERR_CREDIT_LIMIT_BLOCKED"
            - "Invoice.${draft_inv}.taxable_subtotal_cents == 18300"
            - "Invoice.${draft_inv}.tax_cents == 1327"
            - "Invoice.${draft_inv}.total_cents == 19627"
            - "Account.${acct}.outstanding_balance_cents == 19627"
            - "ServiceRequest.${sr}.status == DRAFT"

