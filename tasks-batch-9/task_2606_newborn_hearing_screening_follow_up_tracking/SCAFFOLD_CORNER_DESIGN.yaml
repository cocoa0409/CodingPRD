              payload: { infant_id: "${iei_id}", facility_id: "${bh_id}", performed_by_provider_id: "${s1_id}", encounter_type: "BIRTH_ADMISSION", method: "AABR", performed_at: "2026-08-01T04:00:00Z", left_ear_result: "REFER", right_ear_result: "REFER" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
            - call: "GET /follow-up-episodes"
              payload: { infant_id: "${iei_id}" }
              as: ProgramAdmin
              captures: { ep_rescreen_id: "$.data[0].id" }
            - call: "GET /infants/${iei_id}"
              payload: {}
              as: ProgramAdmin
              captures: { iei_v: "$.data.version" }
            - call: "POST /follow-up-episodes"
              payload: { infant_id: "${iei_id}", episode_type: "DIAGNOSTIC", expected_infant_version: "${iei_v}", supersedes_episode_id: "${ep_rescreen_id}" }
              as: Navigator
              as_user_id: "${n1_id}"
              captures: { ep_diag_id: "$.data.id" }
            - call: "POST /diagnostic-evaluations"
              payload: { infant_id: "${iei_id}", episode_id: "${ep_diag_id}", facility_id: "${ac_id}", performed_by_provider_id: "${a1_id}", evaluation_datetime: "2026-08-01T05:00:00Z", method: "DIAGNOSTIC_ABR" }
              as: Audiologist
              as_user_id: "${a1_id}"
              captures: { ev_id: "$.data.id" }
            - call: "POST /diagnostic-evaluations/${ev_id}/submit"
              payload: { left_ear_threshold_db: 80, right_ear_threshold_db: 80, outcome: "BILATERAL_LOSS" }
              as: Audiologist
              as_user_id: "${a1_id}"
            - call: "POST /diagnostic-evaluations/${ev_id}/attest"
              payload: { decision: "ACCEPT" }
              as: Audiologist
              as_user_id: "${a2_id}"
          trigger:
            - call: "POST /diagnostic-evaluations/${ev_id}/finalize"
              payload: {}
              as: Audiologist
              as_user_id: "${a1_id}"
            - call: "GET /ei-referrals"
              payload: { infant_id: "${iei_id}" }
              as: ProgramAdmin
              captures: { ref_id: "$.data[0].id" }
          assert:
            - "Facility.${e1_id}.penalty_points_balance == 18 and reporting_compliance_status == SUSPENDED, so it is outside the {COMPLIANT, WATCH} candidate filter"
            - "GET /ei-referrals?infant_id=${iei_id} returns total_count == 1 and EarlyInterventionReferral.${ref_id}.ei_program_facility_id == ${e2_id} (statewide tier), status == PENDING, referred_at == 2026-08-01T06:00:00Z"
            - "DiagnosticEvaluation.${ev_id}.status == FINALIZED_LOSS; FollowUpEpisode.${ep_diag_id}.status == RESOLVED_DIAGNOSED with closure_reason DIAGNOSIS_CONFIRMED"
            - "Infant.${iei_id}.screening_status == DIAGNOSED_LOSS and intervention_status == REFERRED"
            - "GET /navigation-tasks?infant_id=${iei_id} returns total_count == 1 with task_type EI_LINKAGE, status OPEN, assigned_provider_id ${n1_id}, units_reserved 2; Facility.${bh_id}.navigation_budget_units_remaining == 38"

      - name: performance_score_rounding_precision_covered_by_difficulty_design
        claim_type: precision
        grounds:
          - calculations.facility_performance_score.precision
        excluded_because:
          difficulty_instance: performance_score_pinned_rounding_order_63_33_not_63_34
          rationale: "The 4-dp component / 2-dp final ROUND_HALF_UP order is pinned and asserted there against the alternative that rounds each weighted product first; a second precision probe would restate it."

      - name: diagnostic_benchmark_threshold_covered_by_difficulty_design
        claim_type: threshold
        grounds:
          - calculations.milestone_timeliness_status
        excluded_because:
          difficulty_instance: diagnostic_benchmark_day_90_on_time_day_91_late
          rationale: "The inclusive 90-day boundary is probed at day 90 and day 91 there, which is exactly the threshold-1 / threshold / threshold+1 claim for this rule."

      - name: penalty_tier_boundaries_covered_by_difficulty_design
        claim_type: tiered_pricing
        grounds:
          - calculations.reporting_penalty_assessment
        excluded_because:
          difficulty_instance: penalty_tier_keyed_on_pre_surcharge_total_assessed_6_balance_12
          rationale: "The surcharge tier boundary and the marginal-vs-total question (tier keyed on the pre-surcharge total, surcharge applied to base only) are both settled there."

      - name: performance_variant_divergence_covered_by_difficulty_design
        claim_type: variant_divergence
        grounds:
          - calculations.facility_performance_score.variants
        excluded_because:
          difficulty_instance: facility_performance_cohort_vs_encounter_basis_diverge_45_vs_70
          rationale: "Identical rows producing 45.00 on the cohort basis and 70.00 on the encounter basis is the divergence-plus-delta claim in full."

      - name: age_basis_variant_selection_covered_by_difficulty_design
        claim_type: variant_selection
        grounds:
          - calculations.infant_age_basis.variants
        excluded_because:
          difficulty_instance: diagnostic_timeliness_applied_vs_chronological_basis_on_one_row
          rationale: "That instance shows the applied basis being selected for the clinical timeliness field and the chronological basis for the federal-comparability field on the same row, which is the variant-selection claim."

      - name: variant_reconciliation_covered_by_difficulty_design
        claim_type: reconciliation
        grounds:
          - calculations.facility_performance_score.variants
        excluded_because:
          difficulty_instance: facility_performance_cohort_vs_encounter_basis_diverge_45_vs_70
          rationale: "No variant switch exists in this scaffold — both variants are stored side by side on the Facility and never replace one another, so there is no ledger delta to apply; the side-by-side reconciliation of the two stored scores is asserted in that instance."

  - section: validations
    instances:
      - name: slot_ending_before_it_starts_returns_invalid_window
        claim_type: violation_to_error
        grounds:
          - validations.priority_30_window_sanity
          - errors.ERR_INVALID_WINDOW
          - endpoints.POST_clinic_slots
        distinguishing_aspect: "The window-sanity rule fires on ends_at == starts_at as well as ends_at < starts_at: both are 422 ERR_INVALID_WINDOW because the slot window is half-open and a zero-length window can hold no appointment."
        test_recipe:
          setup:
            - "AC1 (AUDIOLOGY_CLINIC, R1) with audiologist A1; clock 2026-08-01T06:00:00Z."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "AC1", facility_type: "AUDIOLOGY_CLINIC", region_code: "R1" }
              as: ProgramAdmin
              captures: { ac_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${ac_id}", provider_type: "AUDIOLOGIST", full_name: "A1", region_code: "R1" }
              as: ProgramAdmin
              captures: { a1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /clinic-slots"
              payload: { facility_id: "${ac_id}", provider_id: "${a1_id}", starts_at: "2026-08-05T09:00:00Z", ends_at: "2026-08-05T08:00:00Z", slot_type: "RESCREEN" }
              as: ProgramAdmin
              captures: { err_backwards: "$.data.error_id" }
            - call: "POST /clinic-slots"
              payload: { facility_id: "${ac_id}", provider_id: "${a1_id}", starts_at: "2026-08-05T09:00:00Z", ends_at: "2026-08-05T09:00:00Z", slot_type: "RESCREEN" }
              as: ProgramAdmin
              captures: { err_zero: "$.data.error_id" }
          assert:
            - "Backwards window: HTTP 422 with data.error_id == ERR_INVALID_WINDOW"
            - "Zero-length window: HTTP 422 with data.error_id == ERR_INVALID_WINDOW"
            - "GET /clinic-slots?provider_id=${a1_id} returns total_count == 0"

      - name: adjacent_reporting_periods_touching_at_the_boundary_are_both_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_31_period_overlap
          - validations.priority_30_window_sanity
          - endpoints.POST_reporting_periods
        distinguishing_aspect: "The period window is half-open, so September starting exactly when August ends satisfies the overlap rule: both periods are created 201 and neither is rejected, which is the pass-side twin of ERR_PERIOD_OVERLAP."
        test_recipe:
          setup:
            - "Empty database with the clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /reporting-periods"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", submission_due_datetime: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              captures: { aug_id: "$.data.id" }
            - call: "POST /reporting-periods"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", submission_due_datetime: "2026-10-05T00:00:00Z" }
              as: ProgramAdmin
              captures: { sep_id: "$.data.id" }
          assert:
            - "Both calls return HTTP 201"
            - "ReportingPeriod.${aug_id}.status == OPEN, closed_at == null, facilities_assessed_count == 0"
            - "ReportingPeriod.${sep_id}.period_start == 2026-09-01T00:00:00Z and status == OPEN — sharing the instant with August's exclusive period_end is not an overlap"

      - name: forbidden_role_outranks_a_missing_required_field
        claim_type: priority_ordering
        grounds:
          - validations.priority_2_role_check
          - validations.priority_3_ERR_INVALID_REQUEST
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "One request violates both the role rule (priority 2) and the schema rule (priority 3); the response must be 403 ERR_FORBIDDEN_ROLE, never 400 ERR_INVALID_REQUEST, because evaluation stops at the first failing row."
        test_recipe:
          setup:
            - "Empty database with the clock at its default; a ProgramAuditor attempts facility creation, which is a ProgramAdmin exclusive operation, and also omits region_code."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /facilities"
              payload: { name: "Rogue Facility", facility_type: "BIRTH_HOSPITAL" }
              as: ProgramAuditor
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 403 with data.error_id == ERR_FORBIDDEN_ROLE (not 400 ERR_INVALID_REQUEST despite the missing region_code)"
            - "No Facility row is created"

      - name: invalid_pagination_outranks_the_unknown_parent_facility
        claim_type: priority_conflict
        grounds:
          - validations.priority_4_pagination
          - validations.priority_5_path_existence
          - errors.ERR_INVALID_PAGINATION
        distinguishing_aspect: "A wide-gap conflict on a read path: limit 0 (priority 4) and an unknown facility id (priority 5) are both wrong, and the answer is 400 ERR_INVALID_PAGINATION rather than 404 ERR_FACILITY_NOT_FOUND — pagination is screened before the path id is resolved."
        test_recipe:
          setup:
            - "One real facility exists so the endpoint is otherwise exercisable, but the request targets a different, unknown id."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "AC1", facility_type: "AUDIOLOGY_CLINIC", region_code: "R1" }
              as: ProgramAdmin
              captures: { ac_id: "$.data.id" }
          trigger:
            - call: "GET /facilities/00000000-0000-4000-8000-0000000000aa/providers"
              payload: { limit: 0, offset: 0 }
              as: ProgramAdmin
              captures: { err_both: "$.data.error_id" }
            - call: "GET /facilities/00000000-0000-4000-8000-0000000000aa/providers"
              payload: { limit: 10, offset: 0 }
              as: ProgramAdmin
              captures: { err_only_path: "$.data.error_id" }
            - call: "GET /facilities/${ac_id}/providers"
              payload: { limit: 10, offset: -1 }
              as: ProgramAdmin
              captures: { err_only_page: "$.data.error_id" }
          assert:
            - "Both violated: HTTP 400 with data.error_id == ERR_INVALID_PAGINATION"
            - "Only the path wrong: HTTP 404 with data.error_id == ERR_FACILITY_NOT_FOUND"
            - "Only pagination wrong (negative offset on a real facility): HTTP 400 with data.error_id == ERR_INVALID_PAGINATION"

      - name: encounter_performed_at_before_birth_or_after_the_clock_is_rejected
        claim_type: temporal_validation
        grounds:
          - validations.priority_27_event_instant_range
          - errors.ERR_TIMESTAMP_OUT_OF_RANGE
        distinguishing_aspect: "The event instant must lie inside the closed interval [birth_datetime, logical clock]: one hour before birth and one hour after the clock are both 422 ERR_TIMESTAMP_OUT_OF_RANGE, while an instant inside the interval is accepted on the same infant."
        test_recipe:
          setup:
            - "BH1 (BIRTH_HOSPITAL, R1) with screener S1; INPATIENT infant born 2026-08-01T00:00:00Z; clock 2026-08-01T06:00:00Z."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "BH1", facility_type: "BIRTH_HOSPITAL", region_code: "R1" }
              as: ProgramAdmin
              captures: { bh_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${bh_id}", provider_type: "SCREENER", full_name: "S1", region_code: "R1" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ProgramAdmin
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-01T00:00:00Z", birth_setting: "INPATIENT", gestational_age_weeks: 39, guardian_name: "G-TM", guardian_contact_phone: "5554701" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { itm_id: "$.data.id" }
          trigger:
            - call: "POST /screening-encounters"
              payload: { infant_id: "${itm_id}", facility_id: "${bh_id}", performed_by_provider_id: "${s1_id}", encounter_type: "BIRTH_ADMISSION", method: "OAE", performed_at: "2026-07-31T23:00:00Z", left_ear_result: "PASS", right_ear_result: "PASS" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { err_before: "$.data.error_id" }
            - call: "POST /screening-encounters"
              payload: { infant_id: "${itm_id}", facility_id: "${bh_id}", performed_by_provider_id: "${s1_id}", encounter_type: "BIRTH_ADMISSION", method: "OAE", performed_at: "2026-08-01T07:00:00Z", left_ear_result: "PASS", right_ear_result: "PASS" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { err_after: "$.data.error_id" }
            - call: "POST /screening-encounters"
              payload: { infant_id: "${itm_id}", facility_id: "${bh_id}", performed_by_provider_id: "${s1_id}", encounter_type: "BIRTH_ADMISSION", method: "OAE", performed_at: "2026-08-01T06:00:00Z", left_ear_result: "PASS", right_ear_result: "PASS" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { enc_ok: "$.data.id" }
          assert:
            - "Before birth: HTTP 422 with data.error_id == ERR_TIMESTAMP_OUT_OF_RANGE"
            - "After the clock: HTTP 422 with data.error_id == ERR_TIMESTAMP_OUT_OF_RANGE"
            - "Exactly at the clock: HTTP 201 with ScreeningEncounter.${enc_ok}.age_days_at_encounter == 0 and overall_result == PASS"
            - "Infant.${itm_id}.screening_status == PASSED and GET /screening-encounters?infant_id=${itm_id} returns total_count == 1"

      - name: three_two_unit_tasks_exhaust_a_five_unit_facility_budget
        claim_type: aggregate_validation
        grounds:
          - validations.priority_40_navigation_budget
          - calculations.navigation_units_cost
          - errors.ERR_NAVIGATION_BUDGET_EXHAUSTED
        distinguishing_aspect: "Each task costs an individually affordable 2 units, but the third one collectively exceeds the facility's 5-unit budget: the first two succeed (remaining 3, then 1) and the third is refused 409 ERR_NAVIGATION_BUDGET_EXHAUSTED with the budget left untouched at 1."
        test_recipe:
          setup:
            - "BH1 (BIRTH_HOSPITAL, R1) created with navigation_budget_units_total 5, screener S1; AC1 (AUDIOLOGY_CLINIC, R1) with navigator N1 (max_open_tasks 5); one INPATIENT infant with interpreter_required false; clock 2026-08-01T06:00:00Z."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "BH1", facility_type: "BIRTH_HOSPITAL", region_code: "R1", navigation_budget_units_total: 5 }
              as: ProgramAdmin
              captures: { bh_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${bh_id}", provider_type: "SCREENER", full_name: "S1", region_code: "R1" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /facilities"
              payload: { name: "AC1", facility_type: "AUDIOLOGY_CLINIC", region_code: "R1" }
              as: ProgramAdmin
              captures: { ac_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${ac_id}", provider_type: "NAVIGATOR", full_name: "N1", region_code: "R1", max_open_tasks: 5 }
              as: ProgramAdmin
              captures: { n1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ProgramAdmin
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-01T00:00:00Z", birth_setting: "INPATIENT", gestational_age_weeks: 39, guardian_name: "G-AG", guardian_contact_phone: "5554801" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { iag_id: "$.data.id" }
          trigger:
            - call: "POST /navigation-tasks"
              payload: { infant_id: "${iag_id}", task_type: "OUTREACH_CALL", assigned_provider_id: "${n1_id}" }
              as: Navigator
              as_user_id: "${n1_id}"
              captures: { ta_id: "$.data.id" }
            - call: "POST /navigation-tasks"
              payload: { infant_id: "${iag_id}", task_type: "APPOINTMENT_NAVIGATION", assigned_provider_id: "${n1_id}" }
              as: Navigator
              as_user_id: "${n1_id}"
              captures: { tb_id: "$.data.id" }
            - call: "POST /navigation-tasks"
              payload: { infant_id: "${iag_id}", task_type: "OUTREACH_CALL", assigned_provider_id: "${n1_id}" }
              as: Navigator
              as_user_id: "${n1_id}"
              captures: { err_budget: "$.data.error_id" }
          assert:
            - "First task: 201 with units_reserved == 2 and Facility.${bh_id}.navigation_budget_units_remaining == 3"
            - "Second task: 201 with units_reserved == 2 and Facility.${bh_id}.navigation_budget_units_remaining == 1"
            - "Third task: HTTP 409 with data.error_id == ERR_NAVIGATION_BUDGET_EXHAUSTED (operator-initiated tasks are rejected, never created with units_reserved 0)"
            - "Facility.${bh_id}.navigation_budget_units_remaining is still 1 and GET /navigation-tasks?infant_id=${iag_id} returns total_count == 2"
            - "Conservation holds: 1 remaining + 2 + 2 reserved == navigation_budget_units_total 5"

      - name: home_visit_window_is_required_only_for_home_visit_tasks
        claim_type: conditional_validation
        grounds:
          - validations.priority_3_ERR_INVALID_REQUEST
          - entities.NavigationTask.fields.visit_starts_at
          - calculations.navigation_units_cost.constants.HOME_VISIT_UNITS
        distinguishing_aspect: "The visit-window rule is an iff conditioned on task_type: HOME_VISIT without a window is 400, OUTREACH_CALL with a window is also 400, and HOME_VISIT with a window is 201 costing 2 + 4 = 6 units."
        test_recipe:
          setup:
            - "BH1 (BIRTH_HOSPITAL, R1) with screener S1; AC1 (AUDIOLOGY_CLINIC, R1) with navigator N1; one INPATIENT infant; clock 2026-08-01T06:00:00Z."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "BH1", facility_type: "BIRTH_HOSPITAL", region_code: "R1" }
              as: ProgramAdmin
              captures: { bh_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${bh_id}", provider_type: "SCREENER", full_name: "S1", region_code: "R1" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /facilities"
              payload: { name: "AC1", facility_type: "AUDIOLOGY_CLINIC", region_code: "R1" }
              as: ProgramAdmin
              captures: { ac_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${ac_id}", provider_type: "NAVIGATOR", full_name: "N1", region_code: "R1" }
              as: ProgramAdmin
              captures: { n1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ProgramAdmin
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-01T00:00:00Z", birth_setting: "INPATIENT", gestational_age_weeks: 39, guardian_name: "G-CV", guardian_contact_phone: "5554901" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { icv_id: "$.data.id" }
          trigger:
            - call: "POST /navigation-tasks"
              payload: { infant_id: "${icv_id}", task_type: "HOME_VISIT", assigned_provider_id: "${n1_id}" }
              as: Navigator
              as_user_id: "${n1_id}"
              captures: { err_missing_window: "$.data.error_id" }
            - call: "POST /navigation-tasks"
              payload: { infant_id: "${icv_id}", task_type: "OUTREACH_CALL", visit_starts_at: "2026-08-02T09:00:00Z", visit_ends_at: "2026-08-02T10:00:00Z", assigned_provider_id: "${n1_id}" }
              as: Navigator
              as_user_id: "${n1_id}"
              captures: { err_extra_window: "$.data.error_id" }
            - call: "POST /navigation-tasks"
              payload: { infant_id: "${icv_id}", task_type: "HOME_VISIT", visit_starts_at: "2026-08-02T09:00:00Z", visit_ends_at: "2026-08-02T10:00:00Z", assigned_provider_id: "${n1_id}" }
              as: Navigator
              as_user_id: "${n1_id}"
              captures: { hv_id: "$.data.id" }
          assert:
            - "HOME_VISIT without a window: HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "OUTREACH_CALL carrying a window: HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "HOME_VISIT with a window: HTTP 201 with NavigationTask.${hv_id}.units_reserved == 6 (2 base + 4 home visit) and status == OPEN"
            - "Facility.${bh_id}.navigation_budget_units_remaining == 34 and GET /navigation-tasks?infant_id=${icv_id} returns total_count == 1"

      - name: slot_type_check_runs_only_after_the_episode_row_is_resolved
        claim_type: cascading_validation
        grounds:
          - validations.priority_22_slot_type
          - validations.priority_6_body_foreign_keys
          - errors.ERR_SLOT_TYPE_MISMATCH
        distinguishing_aspect: "The slot_type rule cannot be evaluated until the episode has been fetched and its episode_type read, so the same wrong-typed slot yields ERR_EPISODE_NOT_FOUND when the episode_id is unknown and ERR_SLOT_TYPE_MISMATCH once the episode resolves — check ordering is observable from one pair of calls."
        test_recipe:
          setup:
            - "BH1/AC1 registry with screener S1, audiologist A1 and navigator N1; INPATIENT infant screened BIRTH_ADMISSION REFER then moved to a DIAGNOSTIC episode (benchmark 90); one RESCREEN-typed slot on 2026-08-05."
