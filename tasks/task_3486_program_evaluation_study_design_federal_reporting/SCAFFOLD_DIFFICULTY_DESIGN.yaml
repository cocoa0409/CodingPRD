# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: design_plan_power_rct_vs_qed_variants
        grounds:
          - calculations.required_sample_size
          - entities.DesignPlan.fields.n_per_arm
          - entities.DesignPlan.fields.required_total_n
        distinguishing_aspect: |
          Identical inputs (mde 0.5, cluster_size 10, icc 0.05, attrition_rate 0.15) on the
          same study: the randomized variant (design_type RCT) yields n_per_arm 107 /
          required_total_n 214, while the quasi_experimental variant (design_type QED_DID)
          yields 155 / 310 — variant selection alone changes the power result. This instance
          sits in the DesignPlan domain; the sibling instance sits in the Study domain.
        test_recipe:
          setup:
            - "An ACTIVE contract and a DESIGN study with no sites"
          setup_api_calls:
            - call: "POST /evaluation/contracts"
              payload: { agency_code: "ACF-OPRE", title: "Coaching Evaluation", award_amount_cents: 90000000, deliverable_report_count: 1 }
              as: AgencyOfficer
              as_user_id: "ao-1"
              captures: { contract_id: $.data.id }
            - call: "POST /evaluation/contracts/${contract_id}/studies"
              payload: { title: "Coaching Impact Study", research_question: "Does coaching raise employment?" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { study_id: $.data.id, study_v: $.data.version }
            - call: "POST /evaluation/studies/${study_id}/design-plans"
              payload: { design_type: "RCT", mde: 0.5, cluster_size: 10, icc: 0.05, attrition_rate: 0.15, expected_study_version: "${study_v}" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { plan_rct_id: $.data.id }
            - call: "GET /evaluation/studies/${study_id}"
              as: PrincipalInvestigator
              captures: { study_v2: $.data.version }
          trigger:
            - call: "POST /evaluation/studies/${study_id}/design-plans"
              payload: { design_type: "QED_DID", mde: 0.5, cluster_size: 10, icc: 0.05, attrition_rate: 0.15, expected_study_version: "${study_v2}" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { plan_qed_id: $.data.id }
          assert:
            - "DesignPlan.${plan_rct_id}.n_per_arm == 107"
            - "DesignPlan.${plan_rct_id}.required_total_n == 214"
            - "DesignPlan.${plan_qed_id}.n_per_arm == 155"
            - "DesignPlan.${plan_qed_id}.required_total_n == 310"
            - "DesignPlan.${plan_rct_id}.status == SUPERSEDED (superseded by the QED revision)"

      - name: feasibility_committed_vs_pipeline_variants
        grounds:
          - calculations.recruitment_feasibility_projection
          - entities.Study.fields.committed_projected_n
          - entities.Study.fields.pipeline_projected_n
          - entities.Study.fields.sample_adequacy
        distinguishing_aspect: |
          The same site roster read two ways diverges: committed_only counts only
          RECRUITED/ACTIVE capacity (60) while the pipeline variant adds
          floor(capacity * yield) per CONTACTED site (270). The adequacy gate follows only
          the pipeline variant: withdrawing the RECRUITED site drops pipeline to 210 < 214
          and flips sample_adequacy to UNDERPOWERED even though both variants changed.
        test_recipe:
          setup:
            - "Study with site A RECRUITED capacity 60, sites B and C CONTACTED capacity 300 each, and a DRAFT RCT design plan requiring 214"
          setup_api_calls:
            - call: "POST /evaluation/contracts"
              payload: { agency_code: "ACF-OPRE", title: "Coaching Evaluation", award_amount_cents: 90000000, deliverable_report_count: 1 }
              as: AgencyOfficer
              as_user_id: "ao-1"
              captures: { contract_id: $.data.id }
            - call: "POST /evaluation/contracts/${contract_id}/studies"
              payload: { title: "Coaching Impact Study", research_question: "Does coaching raise employment?" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { study_id: $.data.id }
            - call: "POST /evaluation/studies/${study_id}/sites"
              payload: { name: "Site A", max_participants: 60 }
              as: StudyDirector
              as_user_id: "sd-1"
              captures: { site_a: $.data.id }
            - call: "POST /evaluation/sites/${site_a}/outreach"
              payload: { outcome: "CONTACTED" }
              as: StudyDirector
              as_user_id: "sd-1"
            - call: "POST /evaluation/sites/${site_a}/sign-mou"
              as: StudyDirector
              as_user_id: "sd-1"
            - call: "POST /evaluation/studies/${study_id}/sites"
              payload: { name: "Site B", max_participants: 300 }
              as: StudyDirector
              as_user_id: "sd-1"
              captures: { site_b: $.data.id }
            - call: "POST /evaluation/sites/${site_b}/outreach"
              payload: { outcome: "CONTACTED" }
              as: StudyDirector
              as_user_id: "sd-1"
            - call: "POST /evaluation/studies/${study_id}/sites"
              payload: { name: "Site C", max_participants: 300 }
              as: StudyDirector
              as_user_id: "sd-1"
              captures: { site_c: $.data.id }
            - call: "POST /evaluation/sites/${site_c}/outreach"
              payload: { outcome: "CONTACTED" }
              as: StudyDirector
              as_user_id: "sd-1"
            - call: "GET /evaluation/studies/${study_id}"
              as: PrincipalInvestigator
              captures: { study_v: $.data.version, committed_pre: $.data.committed_projected_n, pipeline_pre: $.data.pipeline_projected_n }
            - call: "POST /evaluation/studies/${study_id}/design-plans"
              payload: { design_type: "RCT", mde: 0.5, cluster_size: 10, icc: 0.05, attrition_rate: 0.15, expected_study_version: "${study_v}" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /evaluation/sites/${site_a}/withdraw"
              payload: { reason: "Site lost funding" }
              as: StudyDirector
              as_user_id: "sd-1"
          assert:
            - "Before withdraw: Study.${study_id}.committed_projected_n == 60 and pipeline_projected_n == 270 (60 + floor(300*0.35) + floor(300*0.35))"
            - "Before withdraw: Study.${study_id}.sample_adequacy == ADEQUATE (270 >= required_total_n 214)"
            - "After withdraw: Study.${study_id}.committed_projected_n == 0 and pipeline_projected_n == 210"
            - "After withdraw: Study.${study_id}.sample_adequacy == UNDERPOWERED (210 < 214)"
            - "Site.${site_a}.status == WITHDRAWN"

  - rule_id: combinatorial_formula
    instances:
      - name: sample_size_cluster_icc_interaction
        grounds:
          - calculations.required_sample_size
          - entities.DesignPlan.fields.icc
          - entities.DesignPlan.fields.cluster_size
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — the design effect
          1 + (cluster_size - 1) * icc multiplies the z-score term before the attrition
          division, so changing only icc from 0.00 to 0.05 moves per-arm n from 74 to 107;
          no single-input linear rule reproduces this.
        test_recipe:
          setup:
            - "An ACTIVE contract and a DESIGN study with no sites"
          setup_api_calls:
            - call: "POST /evaluation/contracts"
              payload: { agency_code: "ACF-OPRE", title: "Coaching Evaluation", award_amount_cents: 90000000 }
              as: AgencyOfficer
              as_user_id: "ao-1"
              captures: { contract_id: $.data.id }
            - call: "POST /evaluation/contracts/${contract_id}/studies"
              payload: { title: "Coaching Impact Study", research_question: "Does coaching raise employment?" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { study_id: $.data.id, study_v: $.data.version }
            - call: "POST /evaluation/studies/${study_id}/design-plans"
              payload: { design_type: "RCT", mde: 0.5, cluster_size: 10, icc: 0.0, attrition_rate: 0.15, expected_study_version: "${study_v}" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { plan_icc0: $.data.id }
            - call: "GET /evaluation/studies/${study_id}"
              as: PrincipalInvestigator
              captures: { study_v2: $.data.version }
          trigger:
            - call: "POST /evaluation/studies/${study_id}/design-plans"
              payload: { design_type: "RCT", mde: 0.5, cluster_size: 10, icc: 0.05, attrition_rate: 0.15, expected_study_version: "${study_v2}" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { plan_icc5: $.data.id }
          assert:
            - "DesignPlan.${plan_icc0}.n_per_arm == 74 (design effect 1.0; raw 62.72 / 0.85 -> ceil 74)"
            - "DesignPlan.${plan_icc0}.required_total_n == 148"
            - "DesignPlan.${plan_icc5}.n_per_arm == 107 (design effect 1.45; raw 90.944 / 0.85 -> ceil 107)"
            - "DesignPlan.${plan_icc5}.required_total_n == 214"

      - name: burden_rounding_per_record_then_sum
        grounds:
          - calculations.participant_burden_total
          - entities.ResponseRecord.fields.billed_minutes
          - entities.Participant.fields.burden_total_minutes
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — each record's billed_minutes is
          round_half_up'd to integer minutes BEFORE summing. Two SITE_VISIT records of 45
          minutes and one SURVEY record of 45 minutes total 56+56+45 = 157; the rejected
          sum-then-round order would give round_half_up(157.5) = 158.
        test_recipe:
          setup:
            - "Study in DATA_COLLECTION with site A ACTIVE, participant P1 CONSENTED, an OPEN SITE_VISIT wave and an OPEN SURVEY wave (windows 2026-10-01..2026-11-01, clock at 2026-10-15)"
          setup_api_calls:
            - call: "POST /evaluation/contracts"
              payload: { agency_code: "ACF-OPRE", title: "Coaching Evaluation", award_amount_cents: 90000000 }
              as: AgencyOfficer
              as_user_id: "ao-1"
              captures: { contract_id: $.data.id }
            - call: "POST /evaluation/contracts/${contract_id}/studies"
              payload: { title: "Coaching Impact Study", research_question: "Does coaching raise employment?" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { study_id: $.data.id }
            - call: "POST /evaluation/studies/${study_id}/sites"
              payload: { name: "Site A", max_participants: 60 }
              as: StudyDirector
              as_user_id: "sd-1"
              captures: { site_a: $.data.id }
            - call: "POST /evaluation/sites/${site_a}/outreach"
              payload: { outcome: "CONTACTED" }
              as: StudyDirector
              as_user_id: "sd-1"
            - call: "POST /evaluation/sites/${site_a}/sign-mou"
              as: StudyDirector
              as_user_id: "sd-1"
            - call: "POST /evaluation/studies/${study_id}/sites"
              payload: { name: "Site B", max_participants: 300 }
              as: StudyDirector
              as_user_id: "sd-1"
              captures: { site_b: $.data.id }
            - call: "POST /evaluation/sites/${site_b}/outreach"
              payload: { outcome: "CONTACTED" }
              as: StudyDirector
              as_user_id: "sd-1"
            - call: "POST /evaluation/studies/${study_id}/sites"
              payload: { name: "Site C", max_participants: 300 }
              as: StudyDirector
              as_user_id: "sd-1"
              captures: { site_c: $.data.id }
            - call: "POST /evaluation/sites/${site_c}/outreach"
              payload: { outcome: "CONTACTED" }
              as: StudyDirector
              as_user_id: "sd-1"
            - call: "GET /evaluation/studies/${study_id}"
              as: PrincipalInvestigator
              captures: { study_v: $.data.version }
            - call: "POST /evaluation/studies/${study_id}/design-plans"
              payload: { design_type: "RCT", mde: 0.5, cluster_size: 10, icc: 0.05, attrition_rate: 0.15, expected_study_version: "${study_v}" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { plan_id: $.data.id }
            - call: "POST /evaluation/design-plans/${plan_id}/submit"
              as: PrincipalInvestigator
              as_user_id: "pi-1"
            - call: "POST /evaluation/design-plans/${plan_id}/agency-decision"
              payload: { decision: "APPROVED" }
              as: AgencyOfficer
              as_user_id: "ao-1"
            - call: "POST /evaluation/studies/${study_id}/irb-protocols"
              payload: { title: "Protocol P1", estimated_burden_minutes: 300 }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { irb_id: $.data.id }
            - call: "POST /evaluation/irb-protocols/${irb_id}/submit"
              as: PrincipalInvestigator
              as_user_id: "pi-1"
            - call: "POST /evaluation/irb-protocols/${irb_id}/decision"
              payload: { decision: "APPROVED", approval_start: "2026-09-01T00:00:00Z", approval_end: "2027-09-01T00:00:00Z" }
              as: IRBReviewer
              as_user_id: "irb-1"
            - call: "POST /evaluation/sites/${site_a}/activate"
              as: StudyDirector
              as_user_id: "sd-1"
            - call: "POST /evaluation/sites/${site_a}/participants"
              payload: { external_ref: "P001" }
              as: StudyDirector
              as_user_id: "sd-1"
              captures: { p1: $.data.id }
            - call: "POST /evaluation/participants/${p1}/consent"
              payload: { consent_form_version: 1 }
              as: Participant
              as_user_id: "${p1}"
            - call: "POST /evaluation/studies/${study_id}/waves"
              payload: { wave_type: "SITE_VISIT", site_id: "${site_a}", open_at: "2026-10-01T00:00:00Z", close_at: "2026-11-01T00:00:00Z" }
              as: DataManager
              as_user_id: "dm-1"
              captures: { wave_v: $.data.id }
            - call: "POST /evaluation/studies/${study_id}/waves"
              payload: { wave_type: "SURVEY", open_at: "2026-10-01T00:00:00Z", close_at: "2026-11-01T00:00:00Z" }
              as: DataManager
              as_user_id: "dm-1"
              captures: { wave_s: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /evaluation/waves/${wave_v}/open"
              as: DataManager
              as_user_id: "dm-1"
            - call: "POST /evaluation/waves/${wave_s}/open"
              as: DataManager
              as_user_id: "dm-1"
          trigger:
            - call: "POST /evaluation/waves/${wave_v}/records"
              payload: { participant_id: "${p1}", instrument_minutes: 45, payload_ref: "visit-1" }
              as: DataManager
              as_user_id: "dm-1"
              captures: { rec1: $.data.id, rec1_billed: $.data.billed_minutes }
            - call: "POST /evaluation/waves/${wave_v}/records"
              payload: { participant_id: "${p1}", instrument_minutes: 45, payload_ref: "visit-2" }
              as: DataManager
              as_user_id: "dm-1"
              captures: { rec2_billed: $.data.billed_minutes }
            - call: "POST /evaluation/waves/${wave_s}/records"
              payload: { participant_id: "${p1}", instrument_minutes: 45, payload_ref: "survey-1" }
              as: DataManager
              as_user_id: "dm-1"
              captures: { rec3_billed: $.data.billed_minutes }
          assert:
            - "First SITE_VISIT record billed_minutes == 56 (round_half_up(45 * 1.25) = round_half_up(56.25))"
            - "Second SITE_VISIT record billed_minutes == 56"
            - "SURVEY record billed_minutes == 45 (45 * 1.0)"
            - "Participant.${p1}.burden_total_minutes == 157 (per-record rounding; the sum-then-round order would produce 158)"

  - rule_id: non_linear_state_machine
    instances:
      - name: design_plan_revision_cycle
        grounds:
          - state_machines.DesignPlan.SUBMITTED_to_RETURNED_FOR_REVISION
          - state_machines.DesignPlan.RETURNED_FOR_REVISION_to_DRAFT
          - state_machines.DesignPlan.AGENCY_APPROVED_to_LOCKED
        distinguishing_aspect: |
          DesignPlan runs a cyclic revision loop (SUBMITTED -> RETURNED_FOR_REVISION ->
          DRAFT -> SUBMITTED -> AGENCY_APPROVED -> LOCKED) with revision_number incrementing
          per loop — not a linear pipeline. The sibling cyclic instance is on DataCollectionWave.
        test_recipe:
          setup:
            - "Study with sites A RECRUITED (60), B and C CONTACTED (300 each) so the feasibility gate passes (pipeline 270 >= 214)"
          setup_api_calls:
            - call: "POST /evaluation/contracts"
              payload: { agency_code: "ACF-OPRE", title: "Coaching Evaluation", award_amount_cents: 90000000 }
              as: AgencyOfficer
              as_user_id: "ao-1"
              captures: { contract_id: $.data.id }
            - call: "POST /evaluation/contracts/${contract_id}/studies"
              payload: { title: "Coaching Impact Study", research_question: "Does coaching raise employment?" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { study_id: $.data.id }
            - call: "POST /evaluation/studies/${study_id}/sites"
              payload: { name: "Site A", max_participants: 60 }
              as: StudyDirector
              as_user_id: "sd-1"
              captures: { site_a: $.data.id }
            - call: "POST /evaluation/sites/${site_a}/outreach"
              payload: { outcome: "CONTACTED" }
              as: StudyDirector
              as_user_id: "sd-1"
            - call: "POST /evaluation/sites/${site_a}/sign-mou"
              as: StudyDirector
              as_user_id: "sd-1"
            - call: "POST /evaluation/studies/${study_id}/sites"
              payload: { name: "Site B", max_participants: 300 }
              as: StudyDirector
              as_user_id: "sd-1"
              captures: { site_b: $.data.id }
            - call: "POST /evaluation/sites/${site_b}/outreach"
              payload: { outcome: "CONTACTED" }
              as: StudyDirector
              as_user_id: "sd-1"
            - call: "POST /evaluation/studies/${study_id}/sites"
              payload: { name: "Site C", max_participants: 300 }
              as: StudyDirector
              as_user_id: "sd-1"
              captures: { site_c: $.data.id }
            - call: "POST /evaluation/sites/${site_c}/outreach"
              payload: { outcome: "CONTACTED" }
              as: StudyDirector
              as_user_id: "sd-1"
            - call: "GET /evaluation/studies/${study_id}"
              as: PrincipalInvestigator
              captures: { study_v: $.data.version }
            - call: "POST /evaluation/studies/${study_id}/design-plans"
              payload: { design_type: "RCT", mde: 0.5, cluster_size: 10, icc: 0.05, attrition_rate: 0.15, expected_study_version: "${study_v}" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { plan_id: $.data.id }
            - call: "POST /evaluation/design-plans/${plan_id}/submit"
              as: PrincipalInvestigator
              as_user_id: "pi-1"
            - call: "POST /evaluation/design-plans/${plan_id}/agency-decision"
              payload: { decision: "RETURNED" }
              as: AgencyOfficer
              as_user_id: "ao-1"
          trigger:
            - call: "POST /evaluation/design-plans/${plan_id}/revise"
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { rev_after: $.data.revision_number }
            - call: "POST /evaluation/design-plans/${plan_id}/submit"
              as: PrincipalInvestigator
              as_user_id: "pi-1"
            - call: "POST /evaluation/design-plans/${plan_id}/agency-decision"
              payload: { decision: "APPROVED" }
              as: AgencyOfficer
              as_user_id: "ao-1"
              captures: { final_status: $.data.status }
          assert:
            - "After revise: DesignPlan.${plan_id}.status == DRAFT and revision_number == 2"
            - "After second approval: DesignPlan.${plan_id}.status == LOCKED (site A already RECRUITED, so approval auto-locks)"
            - "Study.${study_id}.status == RECRUITMENT (auto-advanced when the plan locked)"

      - name: wave_suspend_resume_cycle_on_irb_expiry
        grounds:
          - state_machines.DataCollectionWave.OPEN_to_SUSPENDED
          - state_machines.DataCollectionWave.SUSPENDED_to_OPEN
          - state_machines.IRBProtocol.APPROVED_to_EXPIRED
          - state_machines.IRBProtocol.EXPIRED_to_SUBMITTED
        distinguishing_aspect: |
          DataCollectionWave runs an OPEN -> SUSPENDED -> OPEN cycle driven by the IRB
          protocol's APPROVED -> EXPIRED -> SUBMITTED -> APPROVED loop; quarantined records
          are not auto-restored on resume. Different entity than the DesignPlan sibling.
        test_recipe:
          setup:
            - "Study in DATA_COLLECTION with one OPEN SURVEY wave (window 2026-10-01..2028-06-01) holding one RECEIVED record; IRB window [2026-09-01, 2027-09-01)"
          setup_api_calls:
            - call: "POST /evaluation/contracts"
              payload: { agency_code: "ACF-OPRE", title: "Coaching Evaluation", award_amount_cents: 90000000 }
              as: AgencyOfficer
              as_user_id: "ao-1"
              captures: { contract_id: $.data.id }
            - call: "POST /evaluation/contracts/${contract_id}/studies"
              payload: { title: "Coaching Impact Study", research_question: "Does coaching raise employment?" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { study_id: $.data.id }
            - call: "POST /evaluation/studies/${study_id}/sites"
              payload: { name: "Site A", max_participants: 60 }
              as: StudyDirector
              as_user_id: "sd-1"
              captures: { site_a: $.data.id }
            - call: "POST /evaluation/sites/${site_a}/outreach"
              payload: { outcome: "CONTACTED" }
              as: StudyDirector
              as_user_id: "sd-1"
            - call: "POST /evaluation/sites/${site_a}/sign-mou"
              as: StudyDirector
              as_user_id: "sd-1"
            - call: "POST /evaluation/studies/${study_id}/sites"
              payload: { name: "Site B", max_participants: 300 }
              as: StudyDirector
              as_user_id: "sd-1"
              captures: { site_b: $.data.id }
            - call: "POST /evaluation/sites/${site_b}/outreach"
              payload: { outcome: "CONTACTED" }
              as: StudyDirector
              as_user_id: "sd-1"
            - call: "POST /evaluation/studies/${study_id}/sites"
              payload: { name: "Site C", max_participants: 300 }
              as: StudyDirector
              as_user_id: "sd-1"
              captures: { site_c: $.data.id }
            - call: "POST /evaluation/sites/${site_c}/outreach"
              payload: { outcome: "CONTACTED" }
              as: StudyDirector
              as_user_id: "sd-1"
            - call: "GET /evaluation/studies/${study_id}"
              as: PrincipalInvestigator
              captures: { study_v: $.data.version }
            - call: "POST /evaluation/studies/${study_id}/design-plans"
              payload: { design_type: "RCT", mde: 0.5, cluster_size: 10, icc: 0.05, attrition_rate: 0.15, expected_study_version: "${study_v}" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { plan_id: $.data.id }
            - call: "POST /evaluation/design-plans/${plan_id}/submit"
              as: PrincipalInvestigator
              as_user_id: "pi-1"
            - call: "POST /evaluation/design-plans/${plan_id}/agency-decision"
              payload: { decision: "APPROVED" }
              as: AgencyOfficer
              as_user_id: "ao-1"
            - call: "POST /evaluation/studies/${study_id}/irb-protocols"
              payload: { title: "Protocol P1", estimated_burden_minutes: 300 }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { irb_id: $.data.id }
