  - rule_id: cross_entity_state_dependency
    instances:
      - name: walk_in_blocked_while_clinic_limited_but_appointment_admitted
        grounds:
          - state_machines.Clinic.OPEN_to_LIMITED
          - state_machines.QueueEntry.transitions[initial]
          - validations[priority=16]
          - errors[ERR_WALK_IN_SUSPENDED]
          - entities.Clinic.fields.min_clinicians_required
        distinguishing_aspect: |
          Entity pair QueueEntry ↔ Clinic: nothing about the walk-in payload is invalid — the
          SAME payload succeeds once a second clinician is on duty. Only the OTHER entity's
          open_status LIMITED (on_duty_clinician_count 1 < min_clinicians_required 2) rejects it,
          and LIMITED is deliberately partial: an APPOINTMENT with the same clinic and complaint
          is admitted in the same state.
