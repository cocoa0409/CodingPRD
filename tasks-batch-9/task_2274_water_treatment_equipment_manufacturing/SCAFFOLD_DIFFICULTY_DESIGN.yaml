            - "the full single-stage delivery chain driven to Project.status SERVICE_ACTIVE"
            - "one ACTIVE ServiceAgreement with reserve_funded_cents 12200000"
            - "one CONSUMABLE draw of quantity 3 at catalog_unit_cost_cents 500000 and invoiced_unit_cost_cents 480000, so accrual_amount_cents 1830000 and settled_amount_cents 1533600"
