      - name: corner_facility_capacity_is_exercised_at_its_peak_overlap_boundary
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FACILITY_CAPACITY_EXCEEDED]
          - calculations.facility_overlap_exposure
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / facility_capacity_uses_peak_overlap_and_admits_adjacent_handoffs"
          rationale: "That instance already drives ERR_FACILITY_CAPACITY_EXCEEDED at the exact peak-overlap boundary across two policies and shows the adjacent-handoff pass, which is strictly stronger than a single-assignment over-capacity check."

      - name: corner_hot_work_buffer_conflict_is_detected_at_the_one_second_shortfall
        claim_type: violation_to_error
        grounds:
          - errors[ERR_TESTING_WINDOW_CONFLICT]
          - calculations.testing_window_separation
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / testing_window_hot_work_buffer_is_symmetric_and_rejects_a_one_second_shortfall"
          rationale: "The symmetric 24-hour buffer is already probed one second short and exactly at the boundary there; repeating a coarser overlap case here would add no discriminating power."

      - name: corner_testing_allocation_demands_an_approved_notice_over_the_loss_date
        claim_type: violation_to_error
        grounds:
          - errors[ERR_TESTING_NOTICE_REQUIRED]
          - validations[priority 97].ERR_TESTING_NOTICE_REQUIRED
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / testing_commissioning_allocation_requires_approved_notice_covering_the_loss_date"
          rationale: "That instance walks SCHEDULED, REJECTED and APPROVED notices against a fixed loss_date, covering both the error and its satisfaction path."

      - name: corner_payment_to_a_foreign_payee_is_refused_before_the_reserve_ceiling
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PAYEE_NOT_ON_POLICY]
          - validations[priority 100].ERR_PAYEE_NOT_ON_POLICY
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / payee_referential_check_outranks_reserve_ceiling_and_rejects_payment"
          rationale: "The referential check is already isolated there against a simultaneously violated reserve ceiling, which subsumes the plain wrong-payee case."

