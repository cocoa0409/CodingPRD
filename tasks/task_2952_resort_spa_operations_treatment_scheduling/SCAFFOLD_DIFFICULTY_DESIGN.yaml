              payload: {}
              as: SpaCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T17:00:00.000Z" }
              as: SpaDirector
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: SpaCoordinator
            - call: "PATCH /treatment-rooms/${room_id}"
              payload: { status: "MAINTENANCE" }
              as: SpaDirector
          trigger:
            - call: "POST /appointments/${appt_id}/cancel"
              payload: { cancel_reason: "hydro circulator failure" }
              as: SpaCoordinator
          assert:
            - "before the trigger Guest.${guest_id}.folio_balance_cents == 50504 and GET /appointments/${appt_id}/folio-charges returns exactly 1 row (TREATMENT 50504)"
            - "before the trigger Appointment.${appt_id}.clearance_status == BLOCKED with clearance_block_reason == ROOM_UNAVAILABLE (this is what makes the CHECKED_IN abort legal under priority 10)"
            - "the trigger returns 200 with schedule_status == CANCELLED and cancellation_charge_cents == 0"
            - "the PROVISIONAL SettlementRecord's status == REVERSED and its computed money fields are frozen at folio_total_cents 50504 (nothing is edited in place)"
            - "a new FolioCharge{kind: REVERSAL, amount_cents: -50504} exists, so GET /appointments/${appt_id}/folio-charges returns exactly 2 rows in posted_at ASC order"
            - "Guest.${guest_id}.folio_balance_cents == 0 and equals the exact arithmetic sum of the guest's FolioCharge.amount_cents values (50504 + -50504)"
            - "Guest.${guest_id}.late_cancel_count == 0, no_show_strikes == 0 and booking_privilege == OPEN — the facility-caused abort is not held against the guest"
            - "no LATE_CANCEL FolioCharge row exists and the TREATMENT row is still present and unmodified"

      - name: book_cancel_rebook_cancel_returns_minute_ledgers_to_zero
        grounds:
          - entities.TreatmentRoom.fields.booked_minutes_total
          - entities.Therapist.fields.assigned_minutes_total
          - state_machines.Appointment.schedule_status.NEW_to_REQUESTED
          - state_machines.Appointment.schedule_status.REQUESTED_to_CANCELLED
          - calculations.room_utilization_and_margin
          - endpoints.GET_/reports/room-utilization
          - endpoints.POST_/appointments/{id}/cancel
        distinguishing_aspect: |
          The conserved quantities are MINUTES on two different aggregates
          (TreatmentRoom.booked_minutes_total including turnover, and
          Therapist.assigned_minutes_total excluding it), and they are driven up
          and down twice — book, cancel, rebook the same slot, cancel again —
          so any double-decrement or missed-decrement drift accumulates and shows
          up as a negative or non-zero ledger. The reconciliation is then cross-
          checked against the utilization report, which must report 0 occupied
          minutes and exactly 0.00 utilization for the day. The other instance in
          this rule conserves money on a single guest folio.
        test_recipe:
          setup:
            - "HYDRO90 (90 min) / HYDRO-1 (turnover 30, 4000c/h) / SENIOR therapist fixture"
            - "PLATINUM guest with a SCREENED_CLEAR intake and consent 2026.1"
            - "logical clock at 2026-08-03T09:00:00.000Z for both bookings, then 2026-08-09T17:00:00.000Z so both cancellations fall in the free band"
