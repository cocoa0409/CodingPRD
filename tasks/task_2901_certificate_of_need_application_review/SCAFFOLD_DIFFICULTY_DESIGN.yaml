  - rule_id: boundary_precision_check
    instances:

      - name: occupancy_tier_boundary_at_exactly_high_volume_threshold
        grounds:
          - calculations.cycle_need_methodology
          - entities.StatePlanFormula.fields.high_volume_bed_threshold
          - entities.BatchingCycle.fields.unmet_bed_need_at_open
          - endpoints[POST /batching-cycles]
        distinguishing_aspect: |
          Numeric `>=` threshold crossing on the metric provisional_required_beds at the
          POST /batching-cycles endpoint: population 54750 yields exactly 100.0000, which
          satisfies `>= 100` and selects 0.85 (final 89, unmet 19), while population 54748
          yields 99.9963, misses the threshold and selects 0.75 (final 100, unmet 30) — a
          two-person demographic difference moves the pool by 11 beds.
        test_recipe:
          setup:
            - "Two planning areas share one ACUTE_CARE_BEDS formula (use_rate_per_1000 100.0, ALOS 5.0, base 0.75, high 0.85, high_volume_bed_threshold 100)."
            - "HSA-NORTH has population_projection 54750 and existing_licensed_beds 70; HSA-SOUTH has population_projection 54748 and existing_licensed_beds 70."
            - "Distinct planning areas are used so the review-window exclusivity rule (priority 23) does not apply between the two cycles."
          setup_api_calls:
            - call: "POST /health-service-areas"
              payload: { code: "HSA-NORTH", name: "North Planning Area", population_projection: 54750, existing_licensed_beds: 70 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hsa_north_id: $.data.id }
            - call: "POST /health-service-areas"
              payload: { code: "HSA-SOUTH", name: "South Planning Area", population_projection: 54748, existing_licensed_beds: 70 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hsa_south_id: $.data.id }
            - call: "POST /state-plan-formulas"
              payload: { service_type: "ACUTE_CARE_BEDS", effective_from_date: "2026-01-01", use_rate_per_1000: 100.0, average_length_of_stay_days: 5.0, base_target_occupancy_rate: 0.75, high_volume_target_occupancy_rate: 0.85, high_volume_bed_threshold: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { formula_id: $.data.id }
          trigger:
            - call: "POST /batching-cycles"
              payload: { hsa_id: "${hsa_north_id}", formula_id: "${formula_id}", service_type: "ACUTE_CARE_BEDS", loi_deadline_at: "2026-08-10T00:00:00Z", application_deadline_at: "2026-08-20T00:00:00Z", comment_period_closes_at: "2026-08-25T00:00:00Z", intervention_deadline_at: "2026-08-28T00:00:00Z", completeness_deadline_at: "2026-09-05T00:00:00Z", decision_deadline_at: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { cycle_north_id: $.data.id }
            - call: "POST /batching-cycles"
              payload: { hsa_id: "${hsa_south_id}", formula_id: "${formula_id}", service_type: "ACUTE_CARE_BEDS", loi_deadline_at: "2026-08-10T00:00:00Z", application_deadline_at: "2026-08-20T00:00:00Z", comment_period_closes_at: "2026-08-25T00:00:00Z", intervention_deadline_at: "2026-08-28T00:00:00Z", completeness_deadline_at: "2026-09-05T00:00:00Z", decision_deadline_at: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { cycle_south_id: $.data.id }
          assert:
            - "BatchingCycle.${cycle_north_id}.provisional_required_beds == 100.0000"
            - "BatchingCycle.${cycle_north_id}.selected_target_occupancy_rate == 0.85"
            - "BatchingCycle.${cycle_north_id}.required_beds_final == 89"
            - "BatchingCycle.${cycle_north_id}.unmet_bed_need_at_open == 19"
            - "BatchingCycle.${cycle_south_id}.projected_patient_days == 27374.0000"
            - "BatchingCycle.${cycle_south_id}.provisional_required_beds == 99.9963"
            - "BatchingCycle.${cycle_south_id}.selected_target_occupancy_rate == 0.75"
            - "BatchingCycle.${cycle_south_id}.required_beds_final == 100"
            - "BatchingCycle.${cycle_south_id}.unmet_bed_need_at_open == 30"

      - name: comparative_decision_on_empty_candidate_set_yields_no_eligible_applications
        grounds:
          - validations[priority=27]
          - errors[ERR_NO_ELIGIBLE_APPLICATIONS]
          - calculations.need_allocation_waterfall
          - endpoints[POST /batching-cycles/{id}/comparative-decision]
          - state_machines.BatchingCycle.COMPARATIVE_REVIEW_to_DECIDED
        distinguishing_aspect: |
          Zero-cardinality boundary on a different metric and a different endpoint from the
          first instance: the candidate set of a cycle in COMPARATIVE_REVIEW is empty (no
          application was ever filed), so POST /batching-cycles/{id}/comparative-decision
          must return ERR_NO_ELIGIBLE_APPLICATIONS (422) instead of decorating an empty
          waterfall with a DECIDED status.
        test_recipe:
          setup:
            - "Cycle 1 in HSA-NORTH has unmet_bed_need_at_open 19 and has been advanced OPEN_FOR_LOI -> OPEN_FOR_APPLICATIONS -> COMPLETENESS_WINDOW -> COMPARATIVE_REVIEW."
            - "No letter of intent and no application was ever filed into the cycle, so the candidate set is empty and no intervention or hearing gate applies."
          setup_api_calls:
            - call: "POST /health-service-areas"
              payload: { code: "HSA-NORTH", name: "North Planning Area", population_projection: 54750, existing_licensed_beds: 70 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hsa_id: $.data.id }
            - call: "POST /state-plan-formulas"
              payload: { service_type: "ACUTE_CARE_BEDS", effective_from_date: "2026-01-01", use_rate_per_1000: 100.0, average_length_of_stay_days: 5.0, base_target_occupancy_rate: 0.75, high_volume_target_occupancy_rate: 0.85, high_volume_bed_threshold: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { formula_id: $.data.id }
            - call: "POST /batching-cycles"
              payload: { hsa_id: "${hsa_id}", formula_id: "${formula_id}", service_type: "ACUTE_CARE_BEDS", loi_deadline_at: "2026-08-10T00:00:00Z", application_deadline_at: "2026-08-20T00:00:00Z", comment_period_closes_at: "2026-08-25T00:00:00Z", intervention_deadline_at: "2026-08-28T00:00:00Z", completeness_deadline_at: "2026-09-05T00:00:00Z", decision_deadline_at: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { cycle_id: $.data.id }
            - call: "POST /batching-cycles/${cycle_id}/advance"
              payload: { to_status: "OPEN_FOR_APPLICATIONS" }
              as: IntakeAnalyst
              as_user_id: "intake-1"
            - call: "POST /batching-cycles/${cycle_id}/advance"
              payload: { to_status: "COMPLETENESS_WINDOW" }
              as: IntakeAnalyst
              as_user_id: "intake-1"
            - call: "POST /batching-cycles/${cycle_id}/advance"
              payload: { to_status: "COMPARATIVE_REVIEW" }
              as: IntakeAnalyst
              as_user_id: "intake-1"
          trigger:
            - call: "POST /batching-cycles/${cycle_id}/comparative-decision"
              payload: { decision_note: "Attempted decision on an empty batch" }
              as: DecisionOfficer
              as_user_id: "officer-1"
              captures: { empty_set_error: $.data.error_id }
          assert:
            - "${empty_set_error} == ERR_NO_ELIGIBLE_APPLICATIONS"
            - "HTTP status == 422"
            - "BatchingCycle.${cycle_id}.status == COMPARATIVE_REVIEW"
            - "BatchingCycle.${cycle_id}.unallocated_bed_need == 19"
            - "BatchingCycle.${cycle_id}.unmet_bed_need_at_open == 19"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: application_submit_requires_cycle_open_for_applications
        grounds:
          - state_machines.Application.DRAFT_to_SUBMITTED
          - state_machines.BatchingCycle.OPEN_FOR_LOI_to_OPEN_FOR_APPLICATIONS
          - validations[priority=8]
          - errors[ERR_APPLICATION_NOT_SUBMITTABLE]
        distinguishing_aspect: |
          Entity pair Application -> BatchingCycle: the application is a perfectly valid DRAFT
          owned by the caller, and the only thing that decides the outcome is the *other*
          entity's status — OPEN_FOR_LOI rejects with ERR_APPLICATION_NOT_SUBMITTABLE, and the
          identical call succeeds once the cycle reaches OPEN_FOR_APPLICATIONS.
        test_recipe:
          setup:
            - "Cycle 1 in HSA-NORTH is freshly created, so its status is the initial OPEN_FOR_LOI."
            - "Applicant Northside has filed a letter of intent and a DRAFT application in that cycle."
            - "The logical clock is 2026-08-01T00:00:00Z, well inside every filing window, so no temporal rule can fire."
          setup_api_calls:
            - call: "POST /health-service-areas"
              payload: { code: "HSA-NORTH", name: "North Planning Area", population_projection: 54750, existing_licensed_beds: 70 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hsa_id: $.data.id }
            - call: "POST /state-plan-formulas"
              payload: { service_type: "ACUTE_CARE_BEDS", effective_from_date: "2026-01-01", use_rate_per_1000: 100.0, average_length_of_stay_days: 5.0, base_target_occupancy_rate: 0.75, high_volume_target_occupancy_rate: 0.85, high_volume_bed_threshold: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { formula_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Northside Hospital", organization_type: "HOSPITAL", contact_email: "filings@northside.example" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { appl_a_id: $.data.id }
            - call: "POST /batching-cycles"
              payload: { hsa_id: "${hsa_id}", formula_id: "${formula_id}", service_type: "ACUTE_CARE_BEDS", loi_deadline_at: "2026-08-10T00:00:00Z", application_deadline_at: "2026-08-20T00:00:00Z", comment_period_closes_at: "2026-08-25T00:00:00Z", intervention_deadline_at: "2026-08-28T00:00:00Z", completeness_deadline_at: "2026-09-05T00:00:00Z", decision_deadline_at: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { cycle_id: $.data.id, cycle_status_at_creation: $.data.status }
            - call: "POST /letters-of-intent"
              payload: { applicant_id: "${appl_a_id}", hsa_id: "${hsa_id}", batching_cycle_id: "${cycle_id}", service_type: "ACUTE_CARE_BEDS", project_description: "12-bed acute care expansion", capital_cost_cents: 800000000, bed_delta: 12 }
              as: Applicant
              as_user_id: "${appl_a_id}"
              captures: { loi_a_id: $.data.id }
            - call: "POST /applications"
              payload: { loi_id: "${loi_a_id}", requested_bed_count: 12, projected_capital_cost_cents: 800000000, narrative: "Northside 12-bed acute care application", partial_award_acceptable: false }
              as: Applicant
              as_user_id: "${appl_a_id}"
              captures: { app_a_id: $.data.id, app_status_at_creation: $.data.status }
          trigger:
            - call: "POST /applications/${app_a_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${appl_a_id}"
              captures: { blocked_error: $.data.error_id }
            - call: "POST /batching-cycles/${cycle_id}/advance"
              payload: { to_status: "OPEN_FOR_APPLICATIONS" }
              as: IntakeAnalyst
              as_user_id: "intake-1"
            - call: "POST /applications/${app_a_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${appl_a_id}"
              captures: { submitted_status: $.data.status }
          assert:
            - "${cycle_status_at_creation} == OPEN_FOR_LOI"
            - "${app_status_at_creation} == DRAFT"
            - "${blocked_error} == ERR_APPLICATION_NOT_SUBMITTABLE"
            - "HTTP status of the first submit == 409"
            - "Application.${app_a_id}.status == DRAFT immediately after the rejected submit"
            - "${submitted_status} == SUBMITTED"
            - "HTTP status of the second submit == 200"
            - "BatchingCycle.${cycle_id}.status == OPEN_FOR_APPLICATIONS"

      - name: intervention_grant_denied_when_target_application_withdrawn
        grounds:
          - state_machines.Intervention.REQUESTED_to_GRANTED
          - state_machines.Application.DEEMED_COMPLETE_to_WITHDRAWN
          - validations[priority=11]
          - errors[ERR_APPLICATION_NOT_IN_COMPLETENESS_REVIEW]
        distinguishing_aspect: |
          A different entity pair from the first instance — Intervention -> Application: the
          intervention itself is still REQUESTED and inside its intervention_deadline_at
          window, so its own state is decidable, yet the GRANT must fail with
          ERR_APPLICATION_NOT_IN_COMPLETENESS_REVIEW purely because the targeted application
          moved to WITHDRAWN, a status outside {SUBMITTED, COMPLETENESS_REVIEW, INCOMPLETE,
          DEEMED_COMPLETE}.
        test_recipe:
          setup:
            - "Cycle 1 is OPEN_FOR_APPLICATIONS with intervention_deadline_at 2026-08-28T00:00:00Z; the clock stays at 2026-08-01T00:00:00Z."
            - "Northside submitted application A; competitor Lakeview filed an intervention against it, so the intervention is REQUESTED."
            - "Northside then withdrew application A, so A.status is WITHDRAWN while the intervention row is untouched."
          setup_api_calls:
            - call: "POST /health-service-areas"
              payload: { code: "HSA-NORTH", name: "North Planning Area", population_projection: 54750, existing_licensed_beds: 70 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hsa_id: $.data.id }
            - call: "POST /state-plan-formulas"
              payload: { service_type: "ACUTE_CARE_BEDS", effective_from_date: "2026-01-01", use_rate_per_1000: 100.0, average_length_of_stay_days: 5.0, base_target_occupancy_rate: 0.75, high_volume_target_occupancy_rate: 0.85, high_volume_bed_threshold: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { formula_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Northside Hospital", organization_type: "HOSPITAL", contact_email: "filings@northside.example" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { appl_a_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Lakeview Medical", organization_type: "HOSPITAL", contact_email: "filings@lakeview.example" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { appl_b_id: $.data.id }
            - call: "POST /batching-cycles"
              payload: { hsa_id: "${hsa_id}", formula_id: "${formula_id}", service_type: "ACUTE_CARE_BEDS", loi_deadline_at: "2026-08-10T00:00:00Z", application_deadline_at: "2026-08-20T00:00:00Z", comment_period_closes_at: "2026-08-25T00:00:00Z", intervention_deadline_at: "2026-08-28T00:00:00Z", completeness_deadline_at: "2026-09-05T00:00:00Z", decision_deadline_at: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { cycle_id: $.data.id }
            - call: "POST /letters-of-intent"
              payload: { applicant_id: "${appl_a_id}", hsa_id: "${hsa_id}", batching_cycle_id: "${cycle_id}", service_type: "ACUTE_CARE_BEDS", project_description: "12-bed acute care expansion", capital_cost_cents: 800000000, bed_delta: 12 }
              as: Applicant
              as_user_id: "${appl_a_id}"
              captures: { loi_a_id: $.data.id }
            - call: "POST /applications"
              payload: { loi_id: "${loi_a_id}", requested_bed_count: 12, projected_capital_cost_cents: 800000000, narrative: "Northside 12-bed acute care application", partial_award_acceptable: false }
              as: Applicant
              as_user_id: "${appl_a_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /batching-cycles/${cycle_id}/advance"
              payload: { to_status: "OPEN_FOR_APPLICATIONS" }
              as: IntakeAnalyst
              as_user_id: "intake-1"
            - call: "POST /applications/${app_a_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${appl_a_id}"
            - call: "POST /interventions"
              payload: { application_id: "${app_a_id}", affected_party_applicant_id: "${appl_b_id}", grounds: "Lakeview serves the same census tracts and would lose volume", requested_hearing: false }
              as: Applicant
              as_user_id: "${appl_b_id}"
              captures: { intervention_id: $.data.id, intervention_status_at_filing: $.data.status }
            - call: "POST /applications/${app_a_id}/withdraw"
              payload: { reason: "Board deferred the capital project" }
              as: Applicant
              as_user_id: "${appl_a_id}"
              captures: { withdrawn_status: $.data.status }
          trigger:
            - call: "POST /interventions/${intervention_id}/decide"
              payload: { decision: "GRANT" }
              as: IntakeAnalyst
              as_user_id: "intake-1"
              captures: { dependency_error: $.data.error_id }
          assert:
            - "${intervention_status_at_filing} == REQUESTED"
            - "${withdrawn_status} == WITHDRAWN"
            - "${dependency_error} == ERR_APPLICATION_NOT_IN_COMPLETENESS_REVIEW"
            - "HTTP status == 409"
            - "${dependency_error} != ERR_INTERVENTION_ALREADY_DECIDED"
            - "Intervention.${intervention_id}.status == REQUESTED"
            - "Intervention.${intervention_id}.decided_by_user_id == null"

  - rule_id: resource_temporal_overlap
    instances:

      - name: hearing_room_half_open_buffered_interval_conflict
        grounds:
          - validations[priority=22]
          - errors[ERR_HEARING_ROOM_CONFLICT]
          - entities.HearingRoom.fields.setup_buffer_minutes
          - entities.PublicHearing.fields.occupancy_start_at
          - endpoints[POST /public-hearings]
        distinguishing_aspect: |
          Resource entity HearingRoom with HALF-OPEN buffered occupancy
          [scheduled_start_at - setup_buffer_minutes, scheduled_end_at): a booking that starts
          exactly when the incumbent ends is still rejected because its 60-minute setup buffer
          reaches back into the incumbent, while a booking whose buffered start equals the
          incumbent's end succeeds — touching at an endpoint is legal.
        test_recipe:
          setup:
            - "Hearing room BOARD-A has setup_buffer_minutes 60."
            - "Hearing H1 for cycle 1 is SCHEDULED 2026-08-26T09:00:00Z to 2026-08-26T11:00:00Z, so it occupies [08:00, 11:00)."
          setup_api_calls:
            - call: "POST /health-service-areas"
              payload: { code: "HSA-NORTH", name: "North Planning Area", population_projection: 54750, existing_licensed_beds: 70 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hsa_id: $.data.id }
            - call: "POST /state-plan-formulas"
              payload: { service_type: "ACUTE_CARE_BEDS", effective_from_date: "2026-01-01", use_rate_per_1000: 100.0, average_length_of_stay_days: 5.0, base_target_occupancy_rate: 0.75, high_volume_target_occupancy_rate: 0.85, high_volume_bed_threshold: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { formula_id: $.data.id }
            - call: "POST /batching-cycles"
              payload: { hsa_id: "${hsa_id}", formula_id: "${formula_id}", service_type: "ACUTE_CARE_BEDS", loi_deadline_at: "2026-08-10T00:00:00Z", application_deadline_at: "2026-08-20T00:00:00Z", comment_period_closes_at: "2026-08-25T00:00:00Z", intervention_deadline_at: "2026-08-28T00:00:00Z", completeness_deadline_at: "2026-09-05T00:00:00Z", decision_deadline_at: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { cycle_id: $.data.id }
            - call: "POST /hearing-rooms"
              payload: { name: "BOARD-A", seating_capacity: 120, setup_buffer_minutes: 60 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { room_id: $.data.id }
            - call: "POST /public-hearings"
              payload: { batching_cycle_id: "${cycle_id}", hearing_room_id: "${room_id}", scheduled_start_at: "2026-08-26T09:00:00Z", scheduled_end_at: "2026-08-26T11:00:00Z" }
              as: IntakeAnalyst
              as_user_id: "intake-1"
              captures: { hearing_1_id: $.data.id, hearing_1_occupancy_start: $.data.occupancy_start_at, hearing_1_status: $.data.status }
          trigger:
            - call: "POST /public-hearings"
              payload: { batching_cycle_id: "${cycle_id}", hearing_room_id: "${room_id}", scheduled_start_at: "2026-08-26T11:00:00Z", scheduled_end_at: "2026-08-26T12:00:00Z" }
              as: IntakeAnalyst
              as_user_id: "intake-1"
              captures: { overlap_error: $.data.error_id }
            - call: "POST /public-hearings"
              payload: { batching_cycle_id: "${cycle_id}", hearing_room_id: "${room_id}", scheduled_start_at: "2026-08-26T12:00:00Z", scheduled_end_at: "2026-08-26T13:00:00Z" }
              as: IntakeAnalyst
              as_user_id: "intake-1"
              captures: { hearing_3_id: $.data.id, hearing_3_occupancy_start: $.data.occupancy_start_at }
          assert:
            - "${hearing_1_occupancy_start} == 2026-08-26T08:00:00Z"
            - "${hearing_1_status} == SCHEDULED"
            - "${overlap_error} == ERR_HEARING_ROOM_CONFLICT"
            - "HTTP status of the 11:00-12:00 booking == 409"
            - "the rejected booking's buffered interval was [2026-08-26T10:00:00Z, 2026-08-26T12:00:00Z), which intersects [08:00, 11:00)"
            - "HTTP status of the 12:00-13:00 booking == 201"
            - "${hearing_3_occupancy_start} == 2026-08-26T11:00:00Z"
            - "PublicHearing.${hearing_3_id}.status == SCHEDULED"
            - "GET /public-hearings?hearing_room_id=${room_id} returns total_count 2"

      - name: batching_cycle_review_window_closed_interval_conflict
        grounds:
          - validations[priority=23]
          - errors[ERR_CYCLE_WINDOW_OVERLAP]
          - entities.BatchingCycle.fields.application_deadline_at
          - entities.BatchingCycle.fields.decision_deadline_at
          - endpoints[POST /batching-cycles]
        distinguishing_aspect: |
          A different resource entity (BatchingCycle, the planning-area/service-type review
          slot) with the opposite interval semantics from the hearing-room instance: the review
          window [application_deadline_at, decision_deadline_at] is CLOSED, so sharing the
          single instant 2026-09-30T00:00:00Z is already a conflict, and only moving the new
          cycle one second later clears it.
        test_recipe:
          setup:
            - "Cycle 1 for HSA-NORTH / ACUTE_CARE_BEDS occupies the closed review window [2026-08-20T00:00:00Z, 2026-09-30T00:00:00Z] and is still OPEN_FOR_LOI (status != CLOSED)."
            - "The second cycle uses the same hsa_id and the same service_type, so the exclusivity rule applies."
          setup_api_calls:
            - call: "POST /health-service-areas"
              payload: { code: "HSA-NORTH", name: "North Planning Area", population_projection: 54750, existing_licensed_beds: 70 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hsa_id: $.data.id }
            - call: "POST /state-plan-formulas"
              payload: { service_type: "ACUTE_CARE_BEDS", effective_from_date: "2026-01-01", use_rate_per_1000: 100.0, average_length_of_stay_days: 5.0, base_target_occupancy_rate: 0.75, high_volume_target_occupancy_rate: 0.85, high_volume_bed_threshold: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { formula_id: $.data.id }
            - call: "POST /batching-cycles"
              payload: { hsa_id: "${hsa_id}", formula_id: "${formula_id}", service_type: "ACUTE_CARE_BEDS", loi_deadline_at: "2026-08-10T00:00:00Z", application_deadline_at: "2026-08-20T00:00:00Z", comment_period_closes_at: "2026-08-25T00:00:00Z", intervention_deadline_at: "2026-08-28T00:00:00Z", completeness_deadline_at: "2026-09-05T00:00:00Z", decision_deadline_at: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { cycle_1_id: $.data.id, cycle_1_status: $.data.status }
          trigger:
            - call: "POST /batching-cycles"
              payload: { hsa_id: "${hsa_id}", formula_id: "${formula_id}", service_type: "ACUTE_CARE_BEDS", loi_deadline_at: "2026-09-25T00:00:00Z", application_deadline_at: "2026-09-30T00:00:00Z", comment_period_closes_at: "2026-10-05T00:00:00Z", intervention_deadline_at: "2026-10-10T00:00:00Z", completeness_deadline_at: "2026-10-15T00:00:00Z", decision_deadline_at: "2026-10-31T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { window_error: $.data.error_id }
            - call: "POST /batching-cycles"
              payload: { hsa_id: "${hsa_id}", formula_id: "${formula_id}", service_type: "ACUTE_CARE_BEDS", loi_deadline_at: "2026-09-25T00:00:00Z", application_deadline_at: "2026-09-30T00:00:01Z", comment_period_closes_at: "2026-10-05T00:00:00Z", intervention_deadline_at: "2026-10-10T00:00:00Z", completeness_deadline_at: "2026-10-15T00:00:00Z", decision_deadline_at: "2026-10-31T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { cycle_2_id: $.data.id, cycle_2_status: $.data.status }
          assert:
            - "${cycle_1_status} == OPEN_FOR_LOI"
            - "${window_error} == ERR_CYCLE_WINDOW_OVERLAP"
            - "HTTP status of the 2026-09-30T00:00:00Z attempt == 409"
            - "${window_error} != ERR_INVALID_CYCLE_WINDOW"
            - "HTTP status of the 2026-09-30T00:00:01Z attempt == 201"
            - "${cycle_2_status} == OPEN_FOR_LOI"
            - "BatchingCycle.${cycle_2_id}.application_deadline_at == 2026-09-30T00:00:01Z"
            - "BatchingCycle.${cycle_2_id}.unmet_bed_need_at_open == 19"
            - "GET /batching-cycles?hsa_id=${hsa_id} returns total_count 2"

  - rule_id: compensating_invariant
    instances:

      - name: bed_need_conservation_across_award_and_appeal_release
        grounds:
          - calculations.need_allocation_waterfall
          - entities.BatchingCycle.fields.unmet_bed_need_at_open
          - entities.BatchingCycle.fields.unallocated_bed_need
          - state_machines.Application.COMPARATIVE_REVIEW_to_APPROVED
          - state_machines.Application.APPROVED_to_DENIED
          - state_machines.Appeal.HEARD_to_REVERSED
        distinguishing_aspect: |
          Conserved quantity #1 — bed need: for every cycle,
          `unmet_bed_need_at_open == unallocated_bed_need + SUM(allocated_bed_count of its
          applications)` must hold both after the award (7 + 12 == 19) and after the appeal
          reversal releases the award (19 + 0 == 19), so the release is an exact compensation
          of the award rather than a fresh recomputation of need.
        test_recipe:
          setup:
            - "Cycle 1 in HSA-NORTH opened with unmet_bed_need_at_open 19 and unallocated_bed_need 19."
            - "Application A (12 beds) is the only candidate; it received two score sheets and was APPROVED by the comparative decision at 2026-09-10T00:00:00Z, leaving unallocated_bed_need 7."
            - "No certificate is issued in this scenario, so the release path touches only the cycle and the application."
            - "Northside appealed its own approval at 2026-10-01T00:00:00Z (appeal_window_closes_at is 2026-10-10T00:00:00Z) and the appeal was advanced FILED -> BRIEFING -> HEARD."
          setup_api_calls:
            - call: "POST /health-service-areas"
              payload: { code: "HSA-NORTH", name: "North Planning Area", population_projection: 54750, existing_licensed_beds: 70 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hsa_id: $.data.id }
            - call: "POST /state-plan-formulas"
              payload: { service_type: "ACUTE_CARE_BEDS", effective_from_date: "2026-01-01", use_rate_per_1000: 100.0, average_length_of_stay_days: 5.0, base_target_occupancy_rate: 0.75, high_volume_target_occupancy_rate: 0.85, high_volume_bed_threshold: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { formula_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Northside Hospital", organization_type: "HOSPITAL", contact_email: "filings@northside.example" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { appl_a_id: $.data.id }
            - call: "POST /batching-cycles"
              payload: { hsa_id: "${hsa_id}", formula_id: "${formula_id}", service_type: "ACUTE_CARE_BEDS", loi_deadline_at: "2026-08-10T00:00:00Z", application_deadline_at: "2026-08-20T00:00:00Z", comment_period_closes_at: "2026-08-25T00:00:00Z", intervention_deadline_at: "2026-08-28T00:00:00Z", completeness_deadline_at: "2026-09-05T00:00:00Z", decision_deadline_at: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { cycle_id: $.data.id, need_at_open: $.data.unmet_bed_need_at_open, pool_at_open: $.data.unallocated_bed_need }
            - call: "POST /letters-of-intent"
              payload: { applicant_id: "${appl_a_id}", hsa_id: "${hsa_id}", batching_cycle_id: "${cycle_id}", service_type: "ACUTE_CARE_BEDS", project_description: "12-bed acute care expansion", capital_cost_cents: 800000000, bed_delta: 12 }
              as: Applicant
              as_user_id: "${appl_a_id}"
              captures: { loi_a_id: $.data.id }
            - call: "POST /applications"
              payload: { loi_id: "${loi_a_id}", requested_bed_count: 12, projected_capital_cost_cents: 800000000, narrative: "Northside 12-bed acute care application", partial_award_acceptable: false }
              as: Applicant
              as_user_id: "${appl_a_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /batching-cycles/${cycle_id}/advance"
              payload: { to_status: "OPEN_FOR_APPLICATIONS" }
              as: IntakeAnalyst
              as_user_id: "intake-1"
            - call: "POST /applications/${app_a_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${appl_a_id}"
            - call: "POST /batching-cycles/${cycle_id}/advance"
              payload: { to_status: "COMPLETENESS_WINDOW" }
              as: IntakeAnalyst
              as_user_id: "intake-1"
            - call: "POST /applications/${app_a_id}/deem-complete"
              payload: {}
              as: IntakeAnalyst
              as_user_id: "intake-1"
            - call: "POST /batching-cycles/${cycle_id}/advance"
              payload: { to_status: "COMPARATIVE_REVIEW" }
              as: IntakeAnalyst
              as_user_id: "intake-1"
            - call: "GET /applications/${app_a_id}"
              as: ReviewAnalyst
              as_user_id: "rev-1"
              captures: { v_a1: $.data.version }
            - call: "POST /score-sheets"
              payload: { application_id: "${app_a_id}", need_conformity_score: 88, financial_feasibility_score: 75, cost_containment_score: 70, access_underserved_score: 90, quality_record_score: 60, expected_application_version: "${v_a1}", narrative: "reviewer 1 on A" }
              as: ReviewAnalyst
              as_user_id: "rev-1"
            - call: "GET /applications/${app_a_id}"
              as: ReviewAnalyst
              as_user_id: "rev-2"
              captures: { v_a2: $.data.version }
            - call: "POST /score-sheets"
              payload: { application_id: "${app_a_id}", need_conformity_score: 91, financial_feasibility_score: 80, cost_containment_score: 65, access_underserved_score: 85, quality_record_score: 62, expected_application_version: "${v_a2}", narrative: "reviewer 2 on A" }
              as: ReviewAnalyst
              as_user_id: "rev-2"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /batching-cycles/${cycle_id}/comparative-decision"
              payload: { decision_note: "Cycle 1 comparative decision" }
              as: DecisionOfficer
              as_user_id: "officer-1"
            - call: "GET /batching-cycles/${cycle_id}"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pool_after_award: $.data.unallocated_bed_need }
            - call: "GET /applications/${app_a_id}"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { allocated_after_award: $.data.allocated_bed_count, status_after_award: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /appeals"
              payload: { application_id: "${app_a_id}", appellant_applicant_id: "${appl_a_id}", grounds: "The award ignored the applicant's own withdrawal of two bed units" }
              as: Applicant
              as_user_id: "${appl_a_id}"
              captures: { appeal_id: $.data.id }
            - call: "POST /appeals/${appeal_id}/advance"
              payload: { to_status: "BRIEFING" }
              as: AppealBoardMember
              as_user_id: "board-1"
            - call: "POST /appeals/${appeal_id}/advance"
              payload: { to_status: "HEARD" }
              as: AppealBoardMember
              as_user_id: "board-1"
          trigger:
            - call: "POST /appeals/${appeal_id}/decide"
              payload: { disposition: "REVERSED", rationale: "Award vacated; the beds return to the cycle pool" }
              as: AppealBoardMember
              as_user_id: "board-1"
              captures: { appeal_disposition_status: $.data.status }
          assert:
            - "${need_at_open} == 19 and ${pool_at_open} == 19 (invariant holds at open: 19 + 0 == 19)"
            - "${status_after_award} == APPROVED"
            - "${allocated_after_award} == 12"
            - "${pool_after_award} == 7 (invariant holds after the award: 7 + 12 == 19)"
            - "${appeal_disposition_status} == REVERSED"
            - "Application.${app_a_id}.status == DENIED"
            - "Application.${app_a_id}.denial_reason == APPEAL_REVERSED"
            - "Application.${app_a_id}.allocated_bed_count == 0"
            - "BatchingCycle.${cycle_id}.unallocated_bed_need == 19 (invariant holds after the release: 19 + 0 == 19)"
            - "BatchingCycle.${cycle_id}.unmet_bed_need_at_open == 19 (the conserved total never moves)"
            - "HealthServiceArea.${hsa_id}.approved_unimplemented_beds == 0"
            - "HealthServiceArea.${hsa_id}.existing_licensed_beds == 70"

      - name: capital_authorization_conservation_across_issue_and_lapse
        grounds:
          - entities.HealthServiceArea.fields.capital_authorization_committed_cents
          - entities.Certificate.fields.approved_expenditure_limit_cents
          - endpoints[POST /certificates]
          - endpoints[POST /certificates/run-lapse-sweep]
          - state_machines.Certificate.ISSUED_to_LAPSED
        distinguishing_aspect: |
          A different conserved quantity from the first instance — committed capital dollars,
          not beds: `HealthServiceArea.capital_authorization_committed_cents` must equal the sum
          of approved_expenditure_limit_cents over certificates whose lifecycle_status is in
          {ISSUED, IMPLEMENTED, SUSPENDED}. Issuance charges 1000000000 and the milestone lapse
          must credit exactly the same amount back to zero, with the bed pool and the applicant
          strike moving in the same sweep.
        test_recipe:
          setup:
            - "Application A (12 beds) was APPROVED at 2026-09-10T00:00:00Z; its appeal window closed at 2026-10-10T00:00:00Z."
            - "At 2026-10-11T00:00:00Z certificate A was issued with approved_expenditure_limit_cents 1000000000, implementation_milestone_date 2027-06-30 and required_completion_pct_at_milestone 25."
            - "No progress report was ever filed, so latest_completion_pct stays 0, and the clock is then moved to 2027-07-01T00:00:00Z, one day past the milestone."
