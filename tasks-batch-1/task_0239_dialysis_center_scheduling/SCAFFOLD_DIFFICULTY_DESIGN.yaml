              as: Nephrologist
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/activate"
              payload: {}
              as: Nephrologist
            # ---- session 1: 2026-06-01 MWF -> COMPLETED (C) ----
            - call: "POST /sessions"
              payload: { patient_id: "${pid}", order_id: "${oid}", station_id: "${sid}", shift_id: "${shmwf}", service_date: "2026-06-01", expected_patient_version: "${pv0}" }
              as: Scheduler
              captures: { s1: $.data.id }
            - call: "POST /sessions/${s1}/check-in"
              payload: {}
              as: Scheduler
            - call: "POST /sessions/${s1}/complete"
              payload: {}
              as: Scheduler
            - call: "GET /patients/${pid}"
              payload: {}
              as: Scheduler
              captures: { pv1: $.data.version }
            # ---- session 2: 2026-06-02 TTHS -> COMPLETED (C) ----
            - call: "POST /sessions"
