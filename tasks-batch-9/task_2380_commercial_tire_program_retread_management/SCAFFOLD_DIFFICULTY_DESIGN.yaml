              as: TireTechnician
              captures: { err: $.data.error_id }
            - call: "POST /tire-assets/${asset_id}/mount"
              payload: { vehicle_id: "${veh_id}", position: "DRIVE", mounted_at: "2026-08-03T09:00:00Z", odometer_at_mount: 12000, tread_depth_at_mount_32nds: 5 }
              as: TireTechnician
              captures: { err2: $.data.error_id }
          assert:
            - "the first mount returns 422 with error_id ERR_TREAD_BELOW_POLICY_MINIMUM, NOT ERR_BRAND_NOT_APPROVED — equality with the minimum is a violation because the check is strictly greater"
            - "the second mount (tread 5, safety satisfied) returns 422 with error_id ERR_BRAND_NOT_APPROVED, proving the referential violation was present in the first request too"
            - "TireAsset.${asset_id}.status == IN_INVENTORY and vehicle_id == null after both rejections"

      - name: auth_beats_existence_on_inspect_returns_403_not_404
        grounds:
          - validations.priority_2_auth
          - validations.priority_3_existence
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_CASING_NOT_FOUND
          - rbac.CasingInspector
        distinguishing_aspect: |
          Category pair (auth, existence): priority 2 versus priority 3. A PlantScheduler
          addresses a casing id that does not exist. Role rejection must precede path
          resolution, so the response is 403 ERR_UNAUTHORIZED and the caller learns nothing
          about which ids exist; the control call with the correct role on the same bogus id
          returns 404, proving the id really was unresolvable.
        test_recipe:
          setup:
            - "one real casing collected so a genuine version value is available for the OCC field"
            - "the literal id 00000000-0000-0000-0000-000000000000 is never created by any call in this recipe"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Authline Commercial", location_code: "ALC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-1616", scrap_permit_expires_on: "2027-12-31" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Sentinel Cartage", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/tire-policies"
              payload: { position: "DRIVE", target_pressure_psi: 100, pressure_tolerance_pct: 0.10, min_tread_depth_32nds: 4, pull_point_32nds: 6, max_retread_count: 3, approved_brands: ["Bridgestone"], new_tire_tread_depth_32nds: 24, casing_spec_code: "ANY" }
              as: DealerAdmin
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-1717", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 125 }
              as: DealerAdmin
              captures: { casing_id: $.data.id }
            - call: "POST /casings/${casing_id}/collect"
              payload: { collected_at_location_id: "${loc_id}" }
              as: TireTechnician
              captures: { casing_v: $.data.version }
          trigger:
            - call: "POST /casings/00000000-0000-0000-0000-000000000000/inspect"
              payload: { grade: "A", expected_casing_version: "${casing_v}" }
              as: PlantScheduler
              captures: { err: $.data.error_id }
            - call: "POST /casings/00000000-0000-0000-0000-000000000000/inspect"
              payload: { grade: "A", expected_casing_version: "${casing_v}" }
              as: CasingInspector
              as_user_id: "inspector-1"
              captures: { err2: $.data.error_id }
          assert:
            - "the first trigger returns 403 with error_id ERR_UNAUTHORIZED (PlantScheduler is not in the endpoint's roles), NOT 404"
            - "the second trigger returns 404 with error_id ERR_CASING_NOT_FOUND, proving the path id was unresolvable in both requests"
            - "Casing.${casing_id} is untouched: status == COLLECTED, inspection_grade == null, no CasingCreditEntry exists"

  # ===================================================================
  # RULE 6 — Boundary / precision checks (different metrics, distinct endpoints)
  # ===================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: manifest_capacity_exact_weight_boundary
        grounds:
          - calculations.scrap_manifest_totals
          - endpoints.POST_/scrap-manifests/{manifest_id}/lines
          - entities.ScrapManifest.fields.hauler_capacity_lbs
          - errors.ERR_MANIFEST_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          METRIC: cumulative gross WEIGHT in pounds against hauler_capacity_lbs, on the
          manifest-lines endpoint. Two 125-lb casings land the load exactly ON 250 lbs and
          are accepted because the gate is strictly greater; a 1-lb third casing takes the
          load to 251 and is refused. The equality point is the accepted side.
        test_recipe:
          setup:
            - "a DRAFT manifest with hauler_capacity_lbs 250"
            - "three REJECTED casings weighing 125, 125 and 1 lbs, each graded REJECT at inspection"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Weighbridge Commercial", location_code: "WBC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-1818", scrap_permit_expires_on: "2027-12-31" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Bluestone Bulk", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/tire-policies"
              payload: { position: "DRIVE", target_pressure_psi: 100, pressure_tolerance_pct: 0.10, min_tread_depth_32nds: 4, pull_point_32nds: 6, max_retread_count: 3, approved_brands: ["Bridgestone"], new_tire_tread_depth_32nds: 24, casing_spec_code: "ANY" }
              as: DealerAdmin
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-2001", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 125 }
              as: DealerAdmin
              captures: { cas1_id: $.data.id }
            - call: "POST /casings/${cas1_id}/collect"
              payload: { collected_at_location_id: "${loc_id}" }
              as: TireTechnician
              captures: { cas1_v: $.data.version }
            - call: "POST /casings/${cas1_id}/inspect"
              payload: { grade: "REJECT", expected_casing_version: "${cas1_v}" }
              as: CasingInspector
              as_user_id: "inspector-1"
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-2002", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 125 }
              as: DealerAdmin
              captures: { cas2_id: $.data.id }
            - call: "POST /casings/${cas2_id}/collect"
              payload: { collected_at_location_id: "${loc_id}" }
              as: TireTechnician
              captures: { cas2_v: $.data.version }
            - call: "POST /casings/${cas2_id}/inspect"
              payload: { grade: "REJECT", expected_casing_version: "${cas2_v}" }
              as: CasingInspector
              as_user_id: "inspector-1"
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-2003", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 1 }
              as: DealerAdmin
              captures: { cas3_id: $.data.id }
            - call: "POST /casings/${cas3_id}/collect"
              payload: { collected_at_location_id: "${loc_id}" }
              as: TireTechnician
              captures: { cas3_v: $.data.version }
            - call: "POST /casings/${cas3_id}/inspect"
              payload: { grade: "REJECT", expected_casing_version: "${cas3_v}" }
              as: CasingInspector
              as_user_id: "inspector-1"
            - call: "POST /service-locations/${loc_id}/scrap-manifests"
              payload: { hauler_permit_number: "HAUL-88", hauler_capacity_lbs: 250 }
              as: ComplianceOfficer
              as_user_id: "officer-signer"
              captures: { man_id: $.data.id }
          trigger:
            - call: "POST /scrap-manifests/${man_id}/lines"
              payload: { casing_id: "${cas1_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-signer"
            - call: "POST /scrap-manifests/${man_id}/lines"
              payload: { casing_id: "${cas2_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-signer"
            - call: "POST /scrap-manifests/${man_id}/lines"
              payload: { casing_id: "${cas3_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-signer"
              captures: { err: $.data.error_id }
          assert:
            - "after the first line: ScrapManifest.${man_id}.tire_count == 1 and total_weight_lbs == 125"
            - "the second line succeeds: tire_count == 2 and total_weight_lbs == 250, exactly equal to hauler_capacity_lbs — the equality point is ACCEPTED"
            - "the third line returns 422 with error_id ERR_MANIFEST_CAPACITY_EXCEEDED because 251 > 250"
            - "after the rejection: tire_count == 2, total_weight_lbs == 250, and Casing.${cas3_id}.scrap_manifest_id == null"

      - name: manifest_empty_set_signing_boundary
        grounds:
          - calculations.scrap_manifest_totals
          - endpoints.POST_/scrap-manifests/{manifest_id}/sign
          - errors.ERR_MANIFEST_EMPTY
          - entities.ScrapManifest.fields.tire_count
        distinguishing_aspect: |
          METRIC: SET CARDINALITY (line count zero versus one) at the signing endpoint — a
          different metric and a different endpoint from the weight boundary above. The empty
          aggregate is not silently signable: a manifest whose tire_count is 0 is refused,
          and adding a single line flips the same request to success.
        test_recipe:
          setup:
            - "a DRAFT manifest with no lines at all"
            - "one REJECTED casing available to add afterwards"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Emptyset Commercial", location_code: "ESC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-1919", scrap_permit_expires_on: "2027-12-31" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Nightjar Transport", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/tire-policies"
              payload: { position: "DRIVE", target_pressure_psi: 100, pressure_tolerance_pct: 0.10, min_tread_depth_32nds: 4, pull_point_32nds: 6, max_retread_count: 3, approved_brands: ["Bridgestone"], new_tire_tread_depth_32nds: 24, casing_spec_code: "ANY" }
              as: DealerAdmin
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-2101", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 130 }
              as: DealerAdmin
              captures: { casing_id: $.data.id }
            - call: "POST /casings/${casing_id}/collect"
              payload: { collected_at_location_id: "${loc_id}" }
              as: TireTechnician
              captures: { casing_v: $.data.version }
            - call: "POST /casings/${casing_id}/inspect"
              payload: { grade: "REJECT", expected_casing_version: "${casing_v}" }
              as: CasingInspector
              as_user_id: "inspector-1"
            - call: "POST /service-locations/${loc_id}/scrap-manifests"
              payload: { hauler_permit_number: "HAUL-99", hauler_capacity_lbs: 4000 }
              as: ComplianceOfficer
              as_user_id: "officer-signer"
              captures: { man_id: $.data.id }
          trigger:
            - call: "POST /scrap-manifests/${man_id}/sign"
              payload: { signed_at: "2026-08-10T09:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-signer"
              captures: { err: $.data.error_id }
            - call: "POST /scrap-manifests/${man_id}/lines"
              payload: { casing_id: "${casing_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-signer"
            - call: "POST /scrap-manifests/${man_id}/sign"
              payload: { signed_at: "2026-08-10T09:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-signer"
          assert:
            - "the first sign returns 422 with error_id ERR_MANIFEST_EMPTY while tire_count == 0"
            - "after the rejection ScrapManifest.${man_id}.status is still DRAFT and signed_at == null"
            - "the second sign (tire_count == 1, total_weight_lbs == 130) returns 200 and ScrapManifest.${man_id}.status == SIGNED"
            - "cardinality 1 is therefore the first signable size — the boundary sits between 0 and 1, not at some weight threshold"

      - name: retread_slot_cooldown_exact_minute_boundary
        grounds:
          - calculations.retread_slot_feasibility
          - endpoints.POST_/retread-jobs
          - entities.RetreadLine.fields.cure_cooldown_minutes
          - entities.RetreadLine.fields.booked_minutes
          - errors.ERR_RETREAD_SLOT_CONFLICT
        distinguishing_aspect: |
          METRIC: MINUTES on a half-open time interval extended by a cure cooldown, at the
          job-creation endpoint. The occupied span is [08:00, 12:30) — the 12:00 end plus 30
          cooldown minutes. A candidate starting at 12:29 overlaps by one minute and is
          refused; a candidate starting at exactly 12:30 touches the boundary and is
          accepted. One minute separates the two outcomes.
        test_recipe:
          setup:
            - "a line with cure_cooldown_minutes 30 carrying one SCHEDULED job across 2026-09-01T08:00..12:00Z (booked_minutes 270 = 240 + 30)"
            - "a second casing collected and graded A, ready to be scheduled"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Cooldown Plant", location_code: "CDP", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-2020", scrap_permit_expires_on: "2027-12-31", is_retread_plant: true }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Alder Freight", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/tire-policies"
              payload: { position: "DRIVE", target_pressure_psi: 100, pressure_tolerance_pct: 0.10, min_tread_depth_32nds: 4, pull_point_32nds: 6, max_retread_count: 3, approved_brands: ["Bridgestone"], new_tire_tread_depth_32nds: 24, casing_spec_code: "ANY" }
              as: DealerAdmin
            - call: "POST /service-locations/${loc_id}/retread-lines"
              payload: { line_code: "L1", cure_cooldown_minutes: 30 }
              as: DealerAdmin
              captures: { line_id: $.data.id }
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-2201", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 125 }
              as: DealerAdmin
              captures: { casA_id: $.data.id }
            - call: "POST /casings/${casA_id}/collect"
              payload: { collected_at_location_id: "${loc_id}" }
              as: TireTechnician
              captures: { casA_v: $.data.version }
            - call: "POST /casings/${casA_id}/inspect"
              payload: { grade: "A", expected_casing_version: "${casA_v}" }
              as: CasingInspector
              as_user_id: "inspector-1"
            - call: "POST /retread-jobs"
              payload: { casing_id: "${casA_id}", retread_line_id: "${line_id}", tread_design_code: "TD-1", scheduled_start_at: "2026-09-01T08:00:00Z", scheduled_end_at: "2026-09-01T12:00:00Z" }
              as: PlantScheduler
              captures: { jobA_id: $.data.id }
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-2202", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 125 }
              as: DealerAdmin
              captures: { casB_id: $.data.id }
            - call: "POST /casings/${casB_id}/collect"
              payload: { collected_at_location_id: "${loc_id}" }
              as: TireTechnician
              captures: { casB_v: $.data.version }
            - call: "POST /casings/${casB_id}/inspect"
              payload: { grade: "A", expected_casing_version: "${casB_v}" }
              as: CasingInspector
              as_user_id: "inspector-1"
          trigger:
            - call: "POST /retread-jobs"
              payload: { casing_id: "${casB_id}", retread_line_id: "${line_id}", tread_design_code: "TD-1", scheduled_start_at: "2026-09-01T12:29:00Z", scheduled_end_at: "2026-09-01T14:29:00Z" }
              as: PlantScheduler
              captures: { err: $.data.error_id }
            - call: "POST /retread-jobs"
              payload: { casing_id: "${casB_id}", retread_line_id: "${line_id}", tread_design_code: "TD-1", scheduled_start_at: "2026-09-01T12:30:00Z", scheduled_end_at: "2026-09-01T14:30:00Z" }
              as: PlantScheduler
              captures: { jobB_id: $.data.id }
          assert:
            - "before the triggers: RetreadLine.${line_id}.booked_minutes == 270 (240 slot minutes + 30 cooldown minutes)"
            - "the 12:29 candidate returns 409 with error_id ERR_RETREAD_SLOT_CONFLICT and leaves booked_minutes == 270"
            - "the 12:30 candidate returns 201 — the half-open interval makes the touching instant free"
            - "after acceptance RetreadLine.${line_id}.booked_minutes == 420 (270 + 120 + 30) and Casing.${casB_id}.status == RETREAD_QUEUED"

      - name: sla_response_equality_counts_as_met
        grounds:
          - calculations.road_service_response_and_pricing
          - endpoints.POST_/road-service-calls/{call_id}/complete
          - entities.RoadServiceCall.fields.sla_met
          - entities.RoadServiceCall.fields.sla_credit_cents
        distinguishing_aspect: |
          METRIC: RESPONSE MINUTES against a commitment, at the call-completion endpoint. A
          NORMAL call's commitment is 120 + 60 grace = 180 minutes and the technician arrives
          at exactly 180 minutes. Because the comparison is <=, equality counts as MET, so
          sla_credit_cents is 0 and invoice_total_cents equals gross_cents (49000) rather
          than being cut by 20%.
        test_recipe:
          setup:
            - "a location committed to 120 response minutes and NO national agreement, so the NORMAL grace branch and the default labour rate both apply"
            - "a NORMAL call reported at 2026-08-05T12:00:00Z, dispatched 12:05Z (daytime, so no after-hours multiplier), 100 dispatch miles"
            - "arrival at exactly 2026-08-05T15:00:00Z — 180 minutes to the second"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Equality Commercial", location_code: "EQC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-2121", scrap_permit_expires_on: "2027-12-31" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Marlin Distribution", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/vehicles"
              payload: { unit_number: "T-44", vehicle_type: "TRACTOR", current_odometer_miles: 60000 }
              as: DealerAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /service-locations/${loc_id}/technicians"
              payload: { name: "Lena Q", certification_level: "LEVEL_2" }
              as: DealerAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /road-service-calls"
              payload: { fleet_account_id: "${fleet_id}", vehicle_id: "${veh_id}", service_location_id: "${loc_id}", priority: "NORMAL", complaint: "Trailer tire low", reported_at: "2026-08-05T12:00:00Z" }
              as: DispatchCoordinator
              captures: { call_id: $.data.id }
            - call: "POST /road-service-calls/${call_id}/dispatch"
              payload: { dispatched_at: "2026-08-05T12:05:00Z", dispatch_miles: 100, technician_id: "${tech_id}" }
              as: DispatchCoordinator
            - call: "POST /road-service-calls/${call_id}/arrive"
              payload: { arrived_at: "2026-08-05T15:00:00Z" }
              as: TireTechnician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /road-service-calls/${call_id}/complete"
              payload: { closed_at: "2026-08-05T16:00:00Z", labor_hours: 1.0 }
              as: TireTechnician
              as_user_id: "${tech_id}"
          assert:
            - "RoadServiceCall.${call_id}.committed_response_minutes == 180 and actual_response_minutes == 180"
            - "RoadServiceCall.${call_id}.sla_met == true — equality is MET, not missed"
            - "RoadServiceCall.${call_id}.gross_cents == 49000 (9500 + 11000 labour + 28500 mileage, no surcharge)"
            - "RoadServiceCall.${call_id}.sla_credit_cents == 0 and invoice_total_cents == 49000 (a one-second-later arrival would have produced 9800 of credit)"

  # ===================================================================
  # RULE 7 — Cross-entity state dependencies (four distinct entity pairs)
  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: retread_job_creation_depends_on_retread_line_state
        grounds:
          - validations.priority_32_business_constraint
          - errors.ERR_LINE_DOWN
          - state_machines.RetreadLine.AVAILABLE_to_DOWN
          - state_machines.Casing.INSPECTED_to_RETREAD_QUEUED
        distinguishing_aspect: |
          ENTITY PAIR (RetreadJob depends on RetreadLine): whether a job may be created is
          decided by the state of a DIFFERENT entity — the production line. The casing is
          perfectly eligible and the slot is completely free, yet a DOWN line refuses the
          job; returning the line to AVAILABLE makes the byte-identical request succeed.
        test_recipe:
          setup:
            - "one plant with a single retread line, taken DOWN for maintenance"
            - "one casing collected and graded A on a fleet with a DRIVE policy"
            - "the line has no jobs at all, so no temporal rule can fire"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Downline Plant", location_code: "DLP", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-2222", scrap_permit_expires_on: "2027-12-31", is_retread_plant: true }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Pinnacle Carriers", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/tire-policies"
              payload: { position: "DRIVE", target_pressure_psi: 100, pressure_tolerance_pct: 0.10, min_tread_depth_32nds: 4, pull_point_32nds: 6, max_retread_count: 3, approved_brands: ["Bridgestone"], new_tire_tread_depth_32nds: 24, casing_spec_code: "ANY" }
              as: DealerAdmin
            - call: "POST /service-locations/${loc_id}/retread-lines"
              payload: { line_code: "L1", cure_cooldown_minutes: 30 }
              as: DealerAdmin
              captures: { line_id: $.data.id }
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-2301", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 125 }
              as: DealerAdmin
              captures: { casing_id: $.data.id }
            - call: "POST /casings/${casing_id}/collect"
