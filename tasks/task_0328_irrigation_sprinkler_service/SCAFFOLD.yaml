# =============================================================================
# task_0328_irrigation_sprinkler_service — SCAFFOLD (§1.0–§1.7)
# Irrigation & Sprinkler Service field-operations API
# Difficulty: Expert
# =============================================================================

scenario: |
  Irrigation & Sprinkler Service: zone/system inventory & map, install/repair quote,
  seasonal start-up & winterization (blowout), controller programming, leak/head repair
  work order, recurring maintenance plan, backflow test, route scheduling.

domain_name: irrigation-sprinkler-service

# Flat topology: all collections live at the top level and reference each other by
# FK in the request body / query string (no nested URL ownership chain). The empty
# api_prefix is deliberate — peer resources are siblings, not children of one root.
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency        # OCC on Route.version when stops are scheduled
    - cascading_side_effects        # system decommission / backflow certification chains
    - dual_variant_calculation      # quote estimate vs final; provisional vs assessed winter risk
    - derived_field_reconciliation  # System.committed_cost_cents, Route.stops_used, Property.compliance_status

  entity_topology: flat
  state_machine_shape: parallel       # WorkOrder carries two independent state dimensions
  relationship_patterns:
    - one_to_many                     # Property→IrrigationSystem→Zone, Route→RouteStop
    - cross_aggregate                 # RouteStop references WorkOrder across aggregates
  role_model: peer_roles              # Dispatcher / Technician / Customer / BackflowTester
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
