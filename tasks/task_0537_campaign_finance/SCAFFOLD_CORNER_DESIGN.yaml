          trigger_note: "query committee_id=${cid}&min_amount_cents=100000"
          assert:
            - "results include only the 200000 contribution; the 5000 one is filtered out"

      - name: report_period_reverse_list
        claim_type: Computed read
        grounds: [entities.Report.fields.period_id, endpoints]
        distinguishing_aspect: "GET /disclosure/reporting-periods/{id}/reports returns reports covering that period (reverse-FK reachability)."
        test_recipe:
          setup: ["a DRAFT report on a period"]
          setup_api_calls:
            - call: "POST /disclosure/committees"
              payload: { name: "PRco", committee_type: "CANDIDATE", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
            - call: "POST /disclosure/reporting-periods"
              payload: { jurisdiction: "CA", election_cycle: "2026", period_label: "Q1", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", filing_deadline: "2026-04-15T00:00:00Z" }
              as: RegulatorAuditor
              captures: { pid: $.data.id }
            - call: "GET /disclosure/committees/${cid}"
              as: Treasurer
              captures: { cv: $.data.version }
            - call: "POST /disclosure/committees/${cid}/reports"
              payload: { period_id: "${pid}", expected_committee_version: "${cv}" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { rid: $.data.id }
          trigger:
            - call: "GET /disclosure/reporting-periods/${pid}/reports"
              as: PublicViewer
          assert:
            - "response_type == array; the report ${rid} appears in the list"

  # ===================================================================
  - section: rbac
    instances:
      - name: public_viewer_cannot_register_committee
        claim_type: Unauthorized Operation
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "PublicViewer POSTing a committee -> ERR_UNAUTHORIZED (read-only role)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /disclosure/committees"
              payload: { name: "X", committee_type: "PAC", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: PublicViewer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED; HTTP 403"

      - name: treasurer_cannot_approve_committee
        claim_type: Unauthorized Operation
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Approve is RegulatorAuditor-exclusive; a Treasurer calling it -> ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["committee PENDING"]
          setup_api_calls:
            - call: "POST /disclosure/committees"
              payload: { name: "AppCo", committee_type: "PAC", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: Treasurer
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED; HTTP 403"

      - name: lobbyregistrant_cannot_void_contribution
        claim_type: Unauthorized Operation
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Contribution void is RegulatorAuditor-exclusive; a LobbyRegistrant calling it -> ERR_UNAUTHORIZED (peer-role isolation)."
        test_recipe:
          setup: ["committee ACTIVE with one RECORDED contribution"]
          setup_api_calls:
            - call: "POST /disclosure/committees"
              payload: { name: "VoidCo", committee_type: "PAC", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
            - call: "POST /disclosure/committees/${cid}/contributions"
              payload: { contributor_ref: "r1", contributor_name: "Ann", contributor_type: "INDIVIDUAL", amount_cents: 5000, contribution_date: "2026-02-15T00:00:00Z" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { con: $.data.id }
          trigger:
            - call: "POST /disclosure/contributions/${con}/void"
              payload: {}
              as: LobbyRegistrant
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED; HTTP 403"

      - name: regulator_cannot_file_report
        claim_type: Unauthorized Operation
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Filing is Treasurer-exclusive; a RegulatorAuditor calling file -> ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["a DRAFT report on a CLOSED period"]
          setup_api_calls:
            - call: "POST /disclosure/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: RegulatorAuditor
            - call: "POST /disclosure/committees"
              payload: { name: "FileCo", committee_type: "CANDIDATE", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
            - call: "POST /disclosure/reporting-periods"
              payload: { jurisdiction: "CA", election_cycle: "2026", period_label: "Q1", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", filing_deadline: "2026-04-15T00:00:00Z" }
              as: RegulatorAuditor
              captures: { pid: $.data.id }
            - call: "POST /disclosure/reporting-periods/${pid}/close"
              payload: {}
              as: RegulatorAuditor
            - call: "GET /disclosure/committees/${cid}"
              as: Treasurer
              captures: { cv: $.data.version }
            - call: "POST /disclosure/committees/${cid}/reports"
              payload: { period_id: "${pid}", expected_committee_version: "${cv}" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /disclosure/reports/${rid}/file"
              payload: {}
              as: RegulatorAuditor
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED; HTTP 403"

      - name: committee_create_missing_headers_unauthenticated
        claim_type: Unauthorized Operation
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Request with no X-User-Role / X-User-ID headers -> ERR_UNAUTHENTICATED (401), before any authorization check."
        test_recipe:
          setup: ["empty DB; request sent with NO auth headers"]
          setup_api_calls: []
          trigger:
            - call: "POST /disclosure/committees"
              payload: { name: "X", committee_type: "PAC", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: PublicViewer
              captures: { err: $.data.error_id }
          assert:
            - "with auth headers omitted the response is err == ERR_UNAUTHENTICATED; HTTP 401"

  # ===================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_report_create_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[report-create-stale-committee]", endpoints]
        distinguishing_aspect: "POST report with expected_committee_version equal to the committee's current version succeeds (201, DRAFT)."
        test_recipe:
          setup: ["committee ACTIVE; an OPEN period"]
          setup_api_calls:
            - call: "POST /disclosure/committees"
              payload: { name: "OccOk", committee_type: "CANDIDATE", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
            - call: "POST /disclosure/reporting-periods"
              payload: { jurisdiction: "CA", election_cycle: "2026", period_label: "Q1", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", filing_deadline: "2026-04-15T00:00:00Z" }
              as: RegulatorAuditor
              captures: { pid: $.data.id }
            - call: "GET /disclosure/committees/${cid}"
              as: Treasurer
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /disclosure/committees/${cid}/reports"
              payload: { period_id: "${pid}", expected_committee_version: "${cv}" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { rid: $.data.id, st: $.data.status }
          assert:
            - "report created; st == DRAFT"

      - name: occ_report_create_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[report-create-stale-committee]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A second report create reusing the pre-first-create committee version is rejected with ERR_STALE_VERSION (412) because the first create advanced committee.version."
        test_recipe:
          setup: ["committee ACTIVE; an OPEN period; committee version captured once"]
          setup_api_calls:
            - call: "POST /disclosure/committees"
              payload: { name: "OccStale", committee_type: "CANDIDATE", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
            - call: "POST /disclosure/reporting-periods"
              payload: { jurisdiction: "CA", election_cycle: "2026", period_label: "Q1", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", filing_deadline: "2026-04-15T00:00:00Z" }
              as: RegulatorAuditor
              captures: { pid: $.data.id }
            - call: "GET /disclosure/committees/${cid}"
              as: Treasurer
              captures: { cv: $.data.version }
            - call: "POST /disclosure/committees/${cid}/reports"
              payload: { period_id: "${pid}", expected_committee_version: "${cv}" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { rid1: $.data.id }
          trigger:
            - call: "POST /disclosure/committees/${cid}/reports"
              payload: { period_id: "${pid}", expected_committee_version: "${cv}" }
              as: Treasurer
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION; HTTP 412 (first create bumped committee.version, so ${cv} is now stale)"

      - name: version_increments_on_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Committee.fields.version, state_machines.Committee.PENDING_to_ACTIVE]
        distinguishing_aspect: "Committee.version starts at 1 on create and becomes 2 after approve (increments by 1 per mutation)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /disclosure/committees"
              payload: { name: "VerCo", committee_type: "PAC", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
              captures: { v2: $.data.version }
          assert:
            - "v1 == 1; v2 == 2"

      - name: late_file_cascade_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.Report.DRAFT_to_FILED]
        excluded_because:
          difficulty_instance: late_file_penalty_solvency_cascade
          rationale: "The multi-hop late-file -> penalty -> committee-solvency cascade is the named §1.8 transitive_cascade instance."

  # ===================================================================
  - section: consistency_model
    instances:
      - name: contribution_receipts_immediately_visible
        claim_type: immediate
        grounds: [entities.Committee.fields.total_receipts_cents, endpoints]
        distinguishing_aspect: "Committee.total_receipts_cents reflects a just-created contribution in the very next GET (immediate consistency)."
        test_recipe:
          setup: ["committee ACTIVE"]
          setup_api_calls:
            - call: "POST /disclosure/committees"
              payload: { name: "ImmCo", committee_type: "PAC", election_cycle: "2026", jurisdiction: "CA", treasurer_name: "T" }
              as: Treasurer
              captures: { cid: $.data.id }
            - call: "POST /disclosure/committees/${cid}/approve"
              payload: {}
              as: RegulatorAuditor
            - call: "POST /disclosure/committees/${cid}/contributions"
              payload: { contributor_ref: "r1", contributor_name: "Ann", contributor_type: "INDIVIDUAL", amount_cents: 7000, contribution_date: "2026-02-15T00:00:00Z" }
              as: Treasurer
              as_user_id: "${cid}"
          trigger:
            - call: "GET /disclosure/committees/${cid}"
              as: Treasurer
              captures: { tr: $.data.total_receipts_cents }
          assert:
            - "tr == 7000 immediately after the contribution create"
