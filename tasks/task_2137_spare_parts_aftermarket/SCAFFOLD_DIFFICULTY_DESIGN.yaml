              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { pa_id: $.data.id }
            - call: "POST /aftermarket/parts"
              payload: { part_number: "NEW-1", description: "Replacement filter", unit_cost_cents: 1400, lead_time_days: 30, weight_kg: 1.0 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { pb_id: $.data.id }
            - call: "POST /aftermarket/part-applicabilities"
              payload: { part_id: "${pa_id}", model_id: "${m_id}", effective_from_build_revision: 200, effective_to_build_revision: 300, qty_per_unit: 1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "POST /aftermarket/parts/${pa_id}/supersede"
              payload: { successor_part_id: "${pb_id}" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "POST /aftermarket/work-orders"
              payload: { installed_unit_id: "${u_id}", work_type: "SCHEDULED_MAINTENANCE", downtime_priority: "PLANNED" }
              as: DealerUser
              as_user_id: "${d_id}"
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /aftermarket/work-orders/${wo_id}/part-lines"
              payload: { part_id: "${pa_id}", qty_requested: 1 }
              as: DealerUser
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 422"
            - "response data.error_id == ERR_PART_NOT_APPLICABLE"
            - "response data.error_id != ERR_PART_SUPERSEDED"
            - "Part.${pa_id}.lifecycle_state == SUPERSEDED and superseded_by_part_id == ${pb_id} (the referential violation really was present)"
            - "GET /aftermarket/work-order-part-lines?work_order_id=${wo_id} returns total_count == 0"

