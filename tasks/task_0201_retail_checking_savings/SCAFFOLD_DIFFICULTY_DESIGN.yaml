              payload: { legal_name: "Lost Owner", date_of_birth: "1970-01-01", tax_id_last4: "7070", country_of_residence: "US" }
              as: Teller
              captures: { cust_e: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${cust_e}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { app_e: $.data.id }
            - call: "POST /applications/${app_e}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
            - call: "POST /applications/${app_e}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { acct_e: $.data.opened_account_id }
            - call: "POST /accounts/${acct_e}/transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 40000 }
              as: AccountHolder
              as_user_id: "${cust_e}"
            - call: "POST /accounts/${acct_e}/stop-payments"
              payload: { check_number: "7001", max_amount_cents: 5000, expires_on: "2099-01-01" }
              as: AccountHolder
              as_user_id: "${cust_e}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /accounts/${acct_e}/run-dormancy-scan"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /accounts/${acct_e}/run-escheat-sweep"
              payload: {}
              as: ComplianceOfficer
              captures: { swept_status: $.data.status }
          assert:
            - "GET /accounts/${acct_e} -> Account.status == ESCHEATED"
            - "GET /accounts/${acct_e}/escheat-events -> exactly one EscheatEvent with swept_amount_cents == 40000"
            - "GET /accounts/${acct_e} -> Account.ledger_balance_cents == 0"
            - "GET /accounts/${acct_e}/stop-payments -> the check 7001 stop has status == EXPIRED"
            - "GET /accounts/${acct_e}/transactions -> includes one ESCHEAT_SWEEP transaction of amount_cents 40000"

