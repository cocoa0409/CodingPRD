      - name: over_short_case_lifecycle_gates_drawer_close
        claim_type: valid_transition
        grounds: [state_machines.OverShortCase, state_machines.TellerDrawer.OUT_OF_BALANCE_to_CLOSED, "errors[ERR_OVER_SHORT_UNRESOLVED]"]
        distinguishing_aspect: "The full case lifecycle OPEN -> UNDER_INVESTIGATION -> RESOLVED is exercised, and the parent drawer cannot close (ERR_OVER_SHORT_UNRESOLVED) until the case reaches RESOLVED."
        test_recipe:
          setup:
            - "Branch B (threshold 1000); teller T; drawer with one 50000 deposit, counted 49000 (variance -1000, exactly at threshold -> case created; below 2x so the teller is NOT suspended)"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/accounts"
              payload: { owner_name: "A", balance_cents: 0 }
