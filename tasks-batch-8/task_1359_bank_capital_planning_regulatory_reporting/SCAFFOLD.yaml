scenario: |
  Bank Capital Planning & Regulatory Reporting (bank finance & regulatory reporting):
  capital ratio calculation & risk-weighted asset computation, capital plan & stress
  scenario projection, dividend/buyback capacity & regulatory approval, call report
  preparation & edit resolution, filing deadlines & amendment process, subordinated
  debt/issuance planning, prompt-corrective-action thresholds monitoring, internal
  capital adequacy documentation.

domain_name: bank-capital-planning
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation   # distribution capacity is a competed pool
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - scheduled_deferred_actions
    - optimistic_concurrency
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Bank
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Bank legal name" }
      - { name: charter_id, type: string, source: input, description: "Unique charter identifier (unique across banks)" }
      - { name: rwa_methodology, type: enum, source: input, default: "STANDARDIZED", description: "STANDARDIZED | ADVANCED — which RWA approach is the primary baseline; ADVANCED requires supervisory approval" }
      - { name: is_advanced_approaches_bank, type: boolean, source: computed, description: "true iff rwa_methodology == ADVANCED; gates supplementary leverage ratio and parallel-run rules" }
      - { name: pca_bucket, type: enum, source: computed, description: "WELL_CAPITALIZED | ADEQUATELY_CAPITALIZED | UNDERCAPITALIZED | SIGNIFICANTLY_UNDERCAPITALIZED | CRITICALLY_UNDERCAPITALIZED — derived from latest accepted call report ratios" }
      - { name: pca_bucket_as_of_period_id, type: string, source: computed, description: "FK -> ReportingPeriod.id; period whose accepted call report set the current pca_bucket (null if none accepted yet)" }
      - { name: mdba_cents, type: integer, source: computed, description: "Maximum Distributable Amount (cents) currently available given stress capital buffer and PCA posture; recomputed on every ratio/buffer change" }
      - { name: pending_distribution_cents, type: integer, source: computed, description: "Sum of distribution_amount_cents over CapitalDistributionRequest in state APPROVED_NOT_EXECUTED for this bank" }
      - { name: stressed_capital_buffer_bps, type: integer, source: computed, description: "Stress capital buffer in basis points (1 bp = 0.01%); null until first CapitalPlan reaches EFFECTIVE" }
      - { name: supervisory_status, type: enum, source: system, default: "NORMAL", description: "NORMAL | UNDER_LETTER | UNDER_MOU — supervisory posture; escalated on late filings, PCA breaches, plan objections" }

  - name: ReportingPeriod
    parent: Bank
    common_fields: true
    fields:
      - { name: bank_id, type: string, source: system, description: "FK -> Bank.id; owning bank" }
      - { name: period_end_date, type: string, source: input, description: "ISO date YYYY-MM-DD for quarter end (e.g., 2026-06-30)" }
      - { name: period_year, type: integer, source: input, description: "Calendar year of the period (e.g., 2026)" }
      - { name: period_quarter, type: enum, source: input, description: "Q1 | Q2 | Q3 | Q4" }
      - { name: filing_due_at, type: datetime, source: computed, description: "Filing deadline = period_end_date + FILING_LAG_DAYS (35 days for Q1/Q2/Q3, 40 days for Q4) at 17:00:00Z" }
      - { name: late_filing, type: boolean, source: computed, description: "true iff the first SUBMITTED transition on the bank's CallReport for this period occurred strictly after filing_due_at" }
      - { name: status, type: enum, source: system, description: "OPEN → FILING_DUE → SUBMITTED → ACCEPTED → AMENDMENT_OPEN → RE_SUBMITTED → RE_ACCEPTED → CLOSED" }

  - name: CapitalInstrument
    parent: Bank
    common_fields: true
    fields:
      - { name: bank_id, type: string, source: system, description: "FK -> Bank.id; owning bank" }
      - { name: instrument_class, type: enum, source: input, description: "CET1 | AT1 | T2 — capital tier classification" }
      - { name: instrument_subtype, type: enum, source: input, description: "COMMON_STOCK | PREFERRED | TRUST_PREFERRED | SUBORDINATED_DEBT | OTHER" }
      - { name: outstanding_amount_cents, type: integer, source: input, description: "Face amount outstanding in cents; positive" }
      - { name: issuance_date, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: maturity_date, type: string, source: input, description: "ISO date YYYY-MM-DD; required for SUBORDINATED_DEBT, optional otherwise" }
      - { name: contractual_rate_bps, type: integer, source: input, description: "Coupon or dividend rate in basis points per annum; 0 for COMMON_STOCK" }
      - { name: regulatory_capital_cents, type: integer, source: computed, description: "Amount countable toward regulatory capital for a given period after applying caps and amortization; recomputed per period" }
      - { name: t2_haircut_pct, type: integer, source: computed, description: "Amortization haircut percentage applied to SUBORDINATED_DEBT instruments within 5 years of maturity (0,20,40,60,80,100)" }
      - { name: status, type: enum, source: system, description: "OUTSTANDING | CALLED | MATURED | REDEEMED" }

  - name: RiskExposure
    parent: Bank
    common_fields: true
    fields:
      - { name: bank_id, type: string, source: system, description: "FK -> Bank.id; owning bank" }
      - { name: reporting_period_id, type: string, source: input, description: "FK -> ReportingPeriod.id; the period this exposure is measured as of" }
      - { name: exposure_class, type: enum, source: input, description: "SOVEREIGN | CORPORATE | RETAIL_MORTGAGE | RETAIL_OTHER | CRE | HVCRE | EQUITY | SECURITIZATION | OPERATIONAL_RISK | MARKET_RISK" }
      - { name: exposure_at_default_cents, type: integer, source: input, description: "EAD in cents; non-negative" }
      - { name: risk_weight_bps, type: integer, source: input, description: "Risk weight in basis points; e.g., 10000 = 100%. Validated against exposure_class allowable band" }
      - { name: obligor_grade, type: enum, source: input, description: "INVESTMENT_GRADE | NON_INVESTMENT_GRADE | DEFAULT — used for HVCRE / advanced-approach PD term" }
      - { name: collateral_haircut_bps, type: integer, source: input, default: 0, description: "Haircut on collateral in bps; reduces EAD for ADVANCED approach only" }
      - { name: rwa_cents_standardized, type: integer, source: computed, description: "EAD * risk_weight_bps / 10000, computed at exposure record time under STANDARDIZED rules" }
      - { name: rwa_cents_advanced, type: integer, source: computed, description: "EAD-adjusted-for-collateral * risk_weight_bps / 10000 * ADVANCED_MULTIPLIER, computed under ADVANCED rules" }

  - name: CapitalPlan
    parent: Bank
    common_fields: true
    fields:
      - { name: bank_id, type: string, source: system, description: "FK -> Bank.id; owning bank" }
      - { name: plan_year, type: integer, source: input, description: "Plan horizon year (e.g., 2026)" }
      - { name: baseline_period_id, type: string, source: input, description: "FK -> ReportingPeriod.id; period whose ACCEPTED call report seeds the plan's baseline capital position" }
      - { name: baseline_cet1_cents, type: integer, source: computed, description: "CET1 from baseline period's accepted call report" }
      - { name: baseline_t1_cents, type: integer, source: computed, description: "Tier 1 from baseline period's accepted call report" }
      - { name: baseline_total_capital_cents, type: integer, source: computed, description: "Total capital from baseline period's accepted call report" }
      - { name: baseline_rwa_cents, type: integer, source: computed, description: "RWA from baseline period's accepted call report (methodology-appropriate variant)" }
      - { name: projected_cet1_bps_9q, type: integer, source: computed, description: "Min CET1 ratio in bps across 9 projected quarters under base case; null until projections computed" }
      - { name: stressed_min_cet1_bps_9q, type: integer, source: computed, description: "Min CET1 ratio in bps across 9 projected quarters under ACTIVE stress scenario; null until stress run computed" }
      - { name: proposed_distributions_cents, type: integer, source: computed, description: "Sum of distribution_amount_cents over all CapitalDistributionRequest rows attached to this plan (any non-REJECTED, non-WITHDRAWN state)" }
      - { name: stress_scenario_id, type: string, source: input, description: "FK -> StressScenario.id; the scenario this plan uses for stress projections" }
      - { name: status, type: enum, source: system, description: "DRAFT → BOARD_REVIEW → SUBMITTED → SUPERVISORY_REVIEW → APPROVED | OBJECTED → EFFECTIVE | SUPERSEDED" }

  - name: StressScenario
    parent: Bank
    common_fields: true
    fields:
      - { name: bank_id, type: string, source: system, description: "FK -> Bank.id; owning bank" }
      - { name: scenario_code, type: string, source: input, description: "Unique per bank among non-RETIRED scenarios" }
      - { name: gdp_shock_bps, type: integer, source: input, description: "Peak-to-trough real GDP change in bps (negative for contraction)" }
      - { name: unemployment_peak_bps, type: integer, source: input, description: "Peak unemployment rate in bps" }
      - { name: hpi_shock_bps, type: integer, source: input, description: "House price index change in bps" }
      - { name: cre_price_shock_bps, type: integer, source: input, description: "Commercial real estate price change in bps" }
      - { name: market_shock_bps, type: integer, source: input, description: "Equity market shock in bps" }
      - { name: projected_pre_tax_loss_cents, type: integer, source: computed, description: "Computed 9-quarter cumulative pre-tax loss under this scenario applied to the bank's exposure inventory" }
      - { name: status, type: enum, source: system, description: "DRAFT → ACTIVE → RETIRED" }

  - name: CallReport
    parent: ReportingPeriod
    common_fields: true
    fields:
      - { name: reporting_period_id, type: string, source: system, description: "FK -> ReportingPeriod.id; the period this call report covers" }
      - { name: bank_id, type: string, source: system, description: "FK -> Bank.id; denormalized owner bank" }
      - { name: amendment_sequence, type: integer, source: system, default: 0, description: "0 for original filing, increments per amendment" }
      - { name: supersedes_call_report_id, type: string, source: system, description: "FK -> CallReport.id; self-referential — the prior report this one amends (null for amendment_sequence == 0)" }
      - { name: cet1_cents, type: integer, source: computed, description: "Common Equity Tier 1 capital in cents, from qualifying CET1 CapitalInstrument rows" }
      - { name: tier1_cents, type: integer, source: computed, description: "Tier 1 = CET1 + qualifying AT1 (after AT1 cap)" }
      - { name: total_capital_cents, type: integer, source: computed, description: "Total = Tier 1 + qualifying T2 (after T2 cap and amortization haircuts)" }
      - { name: rwa_cents, type: integer, source: computed, description: "Risk-weighted assets in cents, using the bank's methodology variant" }
      - { name: rwa_standardized_cents, type: integer, source: computed, description: "RWA under STANDARDIZED variant (always computed, even for ADVANCED banks, for floor comparison)" }
      - { name: rwa_advanced_cents, type: integer, source: computed, description: "RWA under ADVANCED variant (always computed; used by ADVANCED banks and by standardized banks as disclosure)" }
      - { name: cet1_ratio_bps, type: integer, source: computed, description: "floor(cet1_cents * 10000 / rwa_cents); null when rwa_cents == 0" }
      - { name: tier1_ratio_bps, type: integer, source: computed, description: "floor(tier1_cents * 10000 / rwa_cents); null when rwa_cents == 0" }
      - { name: total_ratio_bps, type: integer, source: computed, description: "floor(total_capital_cents * 10000 / rwa_cents); null when rwa_cents == 0" }
      - { name: leverage_ratio_bps, type: integer, source: computed, description: "floor(tier1_cents * 10000 / total_exposure_cents); null when total_exposure_cents == 0" }
      - { name: total_exposure_cents, type: integer, source: computed, description: "Sum of exposure_at_default_cents over RiskExposure rows for the period, methodology-independent" }
      - { name: edit_failures_open_count, type: integer, source: computed, description: "Count of EditException rows on this report in state OPEN" }
      - { name: edit_failures_total_count, type: integer, source: computed, description: "Count of all EditException rows on this report (any state)" }
      - { name: submitted_at, type: datetime, source: system, description: "Timestamp of SUBMITTED transition (null until submitted)" }
      - { name: accepted_at, type: datetime, source: system, description: "Timestamp of ACCEPTED transition (null until accepted)" }
      - { name: status, type: enum, source: system, description: "DRAFT → PREPARED → EDITS_OUTSTANDING → VALIDATED → SUBMITTED → ACCEPTED | AMENDED_SUPERSEDED" }

  - name: EditException
    parent: CallReport
    common_fields: true
    fields:
      - { name: call_report_id, type: string, source: system, description: "FK -> CallReport.id; the report this edit applies to" }
      - { name: edit_code, type: string, source: input, description: "Regulator edit-check code (e.g., EDIT_RWA_MISMATCH, EDIT_RATIO_ROUNDING)" }
      - { name: severity, type: enum, source: input, description: "FATAL | QUALITY | INFORMATIONAL" }
      - { name: description, type: string, source: input, description: "Human-readable edit-check failure description" }
      - { name: resolution_note, type: string, source: input, description: "Resolution text; required on RESOLVE transition when severity != INFORMATIONAL" }
      - { name: status, type: enum, source: system, description: "OPEN → RESOLVED | EXPLAINED" }

  - name: CapitalDistributionRequest
    parent: Bank
    common_fields: true
    fields:
      - { name: bank_id, type: string, source: system, description: "FK -> Bank.id; owning bank" }
      - { name: capital_plan_id, type: string, source: input, description: "FK -> CapitalPlan.id; the plan this distribution is part of" }
      - { name: reporting_period_id, type: string, source: input, description: "FK -> ReportingPeriod.id; the period in which the distribution would be paid" }
      - { name: distribution_kind, type: enum, source: input, description: "DIVIDEND | BUYBACK" }
      - { name: distribution_amount_cents, type: integer, source: input, description: "Proposed amount in cents; positive" }
      - { name: proposed_payment_date, type: string, source: input, description: "ISO date YYYY-MM-DD; must fall within reporting_period_id's quarter and be >= today" }
      - { name: capacity_reserved_cents, type: integer, source: computed, description: "Capacity this request has reserved against bank.mdba_cents at approval time" }
      - { name: executed_amount_cents, type: integer, source: system, default: 0, description: "Amount actually paid out upon EXECUTE transition" }
      - { name: status, type: enum, source: system, description: "PROPOSED → APPROVED_NOT_EXECUTED → EXECUTED | REJECTED | WITHDRAWN | EXPIRED" }

  - name: SubordinatedDebtIssuance
    parent: Bank
    common_fields: true
    fields:
      - { name: bank_id, type: string, source: system, description: "FK -> Bank.id; owning bank" }
      - { name: proposed_amount_cents, type: integer, source: input, description: "Face amount of new T2 debt to issue; positive" }
      - { name: proposed_rate_bps, type: integer, source: input, description: "Coupon in bps; positive" }
      - { name: maturity_years, type: integer, source: input, description: "Term in years; must be >= 5 to be T2-eligible at issuance" }
      - { name: target_settlement_date, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: t2_capacity_headroom_cents, type: integer, source: computed, description: "T2 cap headroom at approval time = 2% of RWA minus current outstanding T2; recomputed on every capital mutation" }
      - { name: capital_instrument_id, type: string, source: system, description: "FK -> CapitalInstrument.id; the instrument row created upon SETTLED transition (null until settled)" }
      - { name: status, type: enum, source: system, description: "PROPOSED → APPROVED → PRICED → SETTLED | WITHDRAWN" }

  - name: PCAThresholdEvent
    parent: Bank
    common_fields: false
    fields:
      - { name: bank_id, type: string, source: system, description: "FK -> Bank.id; owning bank" }
      - { name: call_report_id, type: string, source: system, description: "FK -> CallReport.id; the accepted report that triggered the threshold check" }
      - { name: metric, type: enum, source: system, description: "CET1 | TIER1 | TOTAL | LEVERAGE" }
      - { name: ratio_bps_observed, type: integer, source: system, description: "Ratio at the moment of the check, in basis points" }
      - { name: bucket_before, type: enum, source: system, description: "PCA bucket before this event" }
      - { name: bucket_after, type: enum, source: system, description: "PCA bucket after this event" }
      - { name: breached, type: boolean, source: system, description: "true iff bucket_after is a stricter bucket than bucket_before" }

  - name: ICAAPDocument
    parent: Bank
    common_fields: true
    fields:
      - { name: bank_id, type: string, source: system, description: "FK -> Bank.id; owning bank" }
      - { name: document_year, type: integer, source: input, description: "Year this ICAAP covers" }
      - { name: governing_capital_plan_id, type: string, source: input, description: "FK -> CapitalPlan.id; the plan this ICAAP documents (must be EFFECTIVE at APPROVAL time)" }
      - { name: sections, type: array, source: input, description: "Array of { section_code, content }; required sections: GOVERNANCE, RISK_APPETITE, CAPITAL_ADEQUACY, STRESS_TESTING, DISTRIBUTION_POLICY" }
      - { name: board_attested_by_user_id, type: string, source: system, description: "X-User-ID of the BoardApprover who attested; set on ATTEST transition" }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID of the CapitalAnalyst who prepared; set at creation — segregation-of-duties anchor" }
      - { name: status, type: enum, source: system, description: "DRAFT → REVIEW → ATTESTED → FILED | SUPERSEDED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ReportingPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FILING_DUE
        trigger: "system clock advancing past period_end_date (auto via /_clock/set_current_utc)"
        actor: system
        preconditions:
          - "current_utc > period_end_date"
        side_effects:
          - "Update Bank.supervisory_status = UNDER_LETTER if current_utc > filing_due_at and no CallReport in SUBMITTED/ACCEPTED state for this period"

      - from: FILING_DUE
        to: SUBMITTED
        trigger: "POST /banks/{bankId}/reporting-periods/{periodId}/call-reports/{reportId}/submit (first successful submit)"
        actor: CapitalAnalyst
        preconditions:
          - "CallReport.status == VALIDATED"
          - "CallReport.edit_failures_open_count == 0 (FATAL edits only block; QUALITY edits may be EXPLAINED)"
        side_effects:
          - "Set CallReport.submitted_at"
          - "If current_utc > filing_due_at: ReportingPeriod.late_filing = true and Bank.supervisory_status = UNDER_LETTER"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /banks/{bankId}/reporting-periods/{periodId}/call-reports/{reportId}/accept (regulator acknowledgement)"
        actor: RegulatorReviewer
        preconditions:
          - "CallReport.status == SUBMITTED"
          - "All EditException rows on this report are in {RESOLVED, EXPLAINED}"
        side_effects:
          - "Set CallReport.accepted_at"
          - "Compute PCA bucket for Bank from the accepted ratios"
          - "For each of {CET1, TIER1, TOTAL, LEVERAGE} where the new bucket differs from Bank.pca_bucket: insert PCAThresholdEvent"
          - "Recompute Bank.mdba_cents = max(0, min(stress_buffer_capacity, pca_capacity)) using new ratios"
          - "Recompute every CapitalDistributionRequest.capacity_reserved_cents for this bank that is in APPROVED_NOT_EXECUTED; EXPIRED those whose reserved > new capacity"
          - "Recompute t2_capacity_headroom_cents on every SubordinatedDebtIssuance in {PROPOSED, APPROVED, PRICED} for this bank"
          - "For each CapitalPlan in {DRAFT, BOARD_REVIEW} whose baseline_period_id == this period: refresh baseline_* fields"
          - "Increments Bank.version by 1"

      - from: ACCEPTED
        to: AMENDMENT_OPEN
        trigger: "POST /banks/{bankId}/reporting-periods/{periodId}/call-reports/{reportId}/open_amendment"
        actor: CapitalAnalyst
        preconditions:
          - "ReportingPeriod.status == ACCEPTED"
          - "No other ReportingPeriod for the same bank with period_end_date > this period's period_end_date is in CLOSED state (cannot reopen history deeper than open book)"
        side_effects:
          - "Create a new CallReport with amendment_sequence = prior.amendment_sequence + 1 and supersedes_call_report_id = prior.id, status = DRAFT"
          - "Prior CallReport status → AMENDED_SUPERSEDED"

      - from: AMENDMENT_OPEN
        to: RE_SUBMITTED
        trigger: "POST /banks/{bankId}/reporting-periods/{periodId}/call-reports/{reportId}/submit (submit amended report)"
        actor: CapitalAnalyst
        preconditions:
          - "Newest CallReport.status == VALIDATED"
          - "Newest CallReport.edit_failures_open_count == 0"
        side_effects:
          - "Set newest CallReport.submitted_at"

      - from: RE_SUBMITTED
        to: RE_ACCEPTED
        trigger: "POST /banks/{bankId}/reporting-periods/{periodId}/call-reports/{reportId}/accept (accept amendment)"
        actor: RegulatorReviewer
        preconditions:
          - "Newest CallReport.status == SUBMITTED"
        side_effects:
          - "Recompute PCA bucket for Bank from amended ratios (may upgrade or downgrade)"
          - "Insert PCAThresholdEvent rows for any bucket changes"
          - "Recompute Bank.mdba_cents"
          - "For every CapitalPlan whose baseline_period_id == this period AND status != SUPERSEDED: refresh baseline_* and recompute projected/stressed values; if any projected ratio falls below the applicable floor → transition CapitalPlan to SUPERSEDED"
          - "For every CapitalDistributionRequest attached to a CapitalPlan that just became SUPERSEDED: transition to WITHDRAWN with capacity released back to bank.mdba_cents"
          - "Increments Bank.version by 1"

      - from: RE_ACCEPTED
        to: CLOSED
        trigger: "POST /banks/{bankId}/reporting-periods/{periodId}/close"
        actor: CapitalAnalyst
        preconditions:
          - "ReportingPeriod.status == RE_ACCEPTED"
          - "No other ReportingPeriod for the same bank with smaller period_end_date is in non-CLOSED state (periods must close in chronological order)"
        side_effects: []

      - from: ACCEPTED
        to: CLOSED
        trigger: "POST /banks/{bankId}/reporting-periods/{periodId}/close"
        actor: CapitalAnalyst
        preconditions:
          - "ReportingPeriod.status == ACCEPTED"
          - "No other ReportingPeriod for the same bank with smaller period_end_date is in non-CLOSED state"
        side_effects: []

  - entity: CallReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED, AMENDED_SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PREPARED
        trigger: "POST /banks/{bankId}/reporting-periods/{periodId}/call-reports/{reportId}/prepare"
        actor: CapitalAnalyst
        preconditions:
          - "At least one RiskExposure row exists for this reporting_period_id (else ERR_NO_EXPOSURES)"
        side_effects:
          - "Recompute cet1_cents, tier1_cents, total_capital_cents from qualifying CapitalInstrument rows"
          - "Recompute rwa_cents_standardized and rwa_cents_advanced from RiskExposure rows for the period"
          - "Pick rwa_cents per bank.rwa_methodology"
          - "Recompute ratio fields (cet1_ratio_bps, tier1_ratio_bps, total_ratio_bps, leverage_ratio_bps)"
          - "Run edit checks; for each failed check, insert EditException with severity per rule; set edit_failures_open_count"

      - from: PREPARED
        to: EDITS_OUTSTANDING
        trigger: "system (auto-transition when edit_failures_open_count > 0 after prepare)"
        actor: system
        preconditions:
          - "edit_failures_open_count > 0"
        side_effects: []

      - from: PREPARED
        to: VALIDATED
        trigger: "system (auto-transition when edit_failures_open_count == 0 after prepare)"
        actor: system
        preconditions:
          - "edit_failures_open_count == 0"
        side_effects: []

      - from: EDITS_OUTSTANDING
        to: VALIDATED
        trigger: "system (auto-transition when the last OPEN EditException transitions to RESOLVED or EXPLAINED)"
        actor: system
        preconditions:
          - "edit_failures_open_count == 0"
        side_effects: []

      - from: VALIDATED
        to: SUBMITTED
        trigger: "POST /banks/{bankId}/reporting-periods/{periodId}/call-reports/{reportId}/submit"
        actor: CapitalAnalyst
        preconditions:
          - "Segregation of duties: X-User-ID of submitter must NOT equal the prepared_by_user_id captured on the report (set on first prepare)"
          - "If ReportingPeriod.status == OPEN: also verify reporting period is still open"
        side_effects:
          - "Set submitted_at to current_utc"
          - "ReportingPeriod.late_filing = (current_utc > filing_due_at)"
          - "If late: Bank.supervisory_status = UNDER_LETTER"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /banks/{bankId}/reporting-periods/{periodId}/call-reports/{reportId}/accept"
        actor: RegulatorReviewer
        preconditions:
          - "All EditException rows are in {RESOLVED, EXPLAINED}"
        side_effects:
          - "Set accepted_at"
          - "Trigger ReportingPeriod transitions and cascades defined there"

      - from: ACCEPTED
        to: AMENDED_SUPERSEDED
        trigger: "system (when an amendment CallReport is created against the same period)"
        actor: system
        preconditions: []
        side_effects:
          - "New CallReport row created with amendment_sequence incremented"

  - entity: EditException
    initial_state: OPEN
    terminal_states: [RESOLVED, EXPLAINED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /banks/{bankId}/reporting-periods/{periodId}/call-reports/{reportId}/edit-exceptions/{editId}/resolve"
        actor: CapitalAnalyst
        preconditions:
          - "If severity != INFORMATIONAL: resolution_note must be non-empty (else ERR_EDIT_NOTE_REQUIRED)"
          - "CallReport.status in {PREPARED, EDITS_OUTSTANDING}"
        side_effects:
          - "Decrement CallReport.edit_failures_open_count"
          - "If resulting count == 0 and CallReport.status == EDITS_OUTSTANDING: auto-transition CallReport to VALIDATED"

      - from: OPEN
        to: EXPLAINED
        trigger: "POST /banks/{bankId}/reporting-periods/{periodId}/call-reports/{reportId}/edit-exceptions/{editId}/explain"
        actor: CapitalAnalyst
        preconditions:
          - "severity must be QUALITY (FATAL edits cannot be EXPLAINED — must be RESOLVED; INFORMATIONAL edits may be either)"
          - "resolution_note must be non-empty"
        side_effects:
          - "Decrement CallReport.edit_failures_open_count"
          - "If resulting count == 0 and CallReport.status == EDITS_OUTSTANDING: auto-transition to VALIDATED"

  - entity: CapitalPlan
    initial_state: DRAFT
    terminal_states: [EFFECTIVE, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: BOARD_REVIEW
        trigger: "POST /banks/{bankId}/capital-plans/{planId}/submit_board"
        actor: CapitalAnalyst
        preconditions:
          - "baseline_period_id's ReportingPeriod.status in {ACCEPTED, RE_ACCEPTED, CLOSED}"
          - "stress_scenario_id's StressScenario.status == ACTIVE"
          - "Bank has no other CapitalPlan in {BOARD_REVIEW, SUBMITTED, SUPERVISORY_REVIEW, APPROVED} (single in-flight plan invariant)"
        side_effects:
          - "Compute baseline_* fields from baseline period's accepted call report"
          - "Compute projected_cet1_bps_9q (base case) and stressed_min_cet1_bps_9q (under stress_scenario)"

      - from: BOARD_REVIEW
        to: SUBMITTED
        trigger: "POST /banks/{bankId}/capital-plans/{planId}/board_approve"
        actor: BoardApprover
        preconditions:
          - "Segregation of duties: BoardApprover X-User-ID must NOT equal the CapitalAnalyst X-User-ID who called submit_board (captured as prepared_by on plan)"
          - "proposed_distributions_cents <= bank.mdba_cents + sum of T2 capacity headroom across APPROVED SubordinatedDebtIssuance rows (else ERR_PLAN_DISTRIBUTION_EXCEEDS_CAPACITY)"
        side_effects: []

      - from: SUBMITTED
        to: SUPERVISORY_REVIEW
        trigger: "POST /banks/{bankId}/capital-plans/{planId}/submit_regulator"
        actor: CapitalAnalyst
        preconditions:
          - "All CapitalDistributionRequest rows attached to this plan are in {PROPOSED, APPROVED_NOT_EXECUTED}"
        side_effects: []

      - from: SUPERVISORY_REVIEW
        to: APPROVED
        trigger: "POST /banks/{bankId}/capital-plans/{planId}/regulator_approve"
        actor: RegulatorReviewer
        preconditions:
          - "stressed_min_cet1_bps_9q >= PCA_ADEQUATE_CET1_BPS + applicable SCB buffer (else ERR_PLAN_FAILED_STRESS_FLOOR)"
        side_effects:
          - "Set bank.stressed_capital_buffer_bps = max(PCA_ADEQUATE_CET1_BPS, stressed_min_cet1_bps_9q) - PCA_ADEQUATE_CET1_BPS"

      - from: SUPERVISORY_REVIEW
        to: OBJECTED
        trigger: "POST /banks/{bankId}/capital-plans/{planId}/regulator_object"
        actor: RegulatorReviewer
        preconditions: []
        side_effects:
          - "Bank.supervisory_status = UNDER_MOU"
          - "For each CapitalDistributionRequest attached to this plan in {PROPOSED, APPROVED_NOT_EXECUTED}: transition to REJECTED; release capacity back to bank.mdba_cents"
          - "CapitalPlan transitions back to DRAFT on next analyst edit (implicit re-open via amend action)"

      - from: OBJECTED
        to: DRAFT
        trigger: "POST /banks/{bankId}/capital-plans/{planId}/amend"
        actor: CapitalAnalyst
        preconditions: []
        side_effects:
          - "Increments CapitalPlan.version by 1"

      - from: APPROVED
        to: EFFECTIVE
        trigger: "system (auto-transition on first day of plan_year-01-01)"
        actor: system
        preconditions:
          - "current_utc >= plan_year-01-01T00:00:00Z"
        side_effects:
          - "Bank.mdba_cents recomputed using the now-active stressed_capital_buffer_bps"

      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (when a newer CapitalPlan for the same bank reaches APPROVED, or when an amended call report shifts baseline below the floor per amendment cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "For each CapitalDistributionRequest attached: transition to WITHDRAWN"

      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system (when a newer CapitalPlan for the same bank reaches EFFECTIVE, or on adverse amendment cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "For each CapitalDistributionRequest attached: transition to WITHDRAWN; release capacity"

  - entity: StressScenario
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /banks/{bankId}/stress-scenarios/{scenarioId}/activate"
        actor: CapitalAnalyst
        preconditions:
          - "Bank must have fewer than MAX_ACTIVE_SCENARIOS (=2) scenarios in ACTIVE state (else ERR_SCENARIO_LIMIT)"
        side_effects:
          - "Compute projected_pre_tax_loss_cents for this scenario against the bank's current RiskExposure inventory"

      - from: ACTIVE
        to: RETIRED
        trigger: "POST /banks/{bankId}/stress-scenarios/{scenarioId}/retire"
        actor: CapitalAnalyst
        preconditions:
          - "No CapitalPlan in {BOARD_REVIEW, SUBMITTED, SUPERVISORY_REVIEW, APPROVED} references this scenario (else ERR_SCENARIO_IN_USE)"
        side_effects: []

  - entity: CapitalDistributionRequest
    initial_state: PROPOSED
    terminal_states: [EXECUTED, REJECTED, WITHDRAWN, EXPIRED]
    transitions:
      - from: PROPOSED
        to: APPROVED_NOT_EXECUTED
        trigger: "POST /banks/{bankId}/distribution-requests/{requestId}/approve"
        actor: CapitalAnalyst
        preconditions:
          - "Attached CapitalPlan.status == APPROVED"
          - "proposed_payment_date >= current_utc date portion"
          - "bank.mdba_cents - bank.pending_distribution_cents >= distribution_amount_cents (capacity check; else ERR_DISTRIBUTION_EXCEEDS_MDBA)"
          - "bank.pca_bucket in {WELL_CAPITALIZED, ADEQUATELY_CAPITALIZED} (else ERR_PCA_BLOCKS_DISTRIBUTION)"
        side_effects:
          - "capacity_reserved_cents = distribution_amount_cents"
          - "bank.pending_distribution_cents += distribution_amount_cents"
          - "Increments Bank.version by 1"

      - from: APPROVED_NOT_EXECUTED
        to: EXECUTED
        trigger: "POST /banks/{bankId}/distribution-requests/{requestId}/execute"
        actor: CapitalAnalyst
        preconditions:
          - "current_utc >= proposed_payment_date (else ERR_DISTRIBUTION_NOT_YET_PAYABLE)"
          - "current_utc <= proposed_payment_date + DISTRIBUTION_WINDOW_DAYS (=10) (else auto-EXPIRED rule applies)"
          - "bank.pca_bucket in {WELL_CAPITALIZED, ADEQUATELY_CAPITALIZED} at execution time (re-check)"
        side_effects:
          - "executed_amount_cents = distribution_amount_cents"
          - "bank.pending_distribution_cents -= distribution_amount_cents"
          - "bank.mdba_cents -= distribution_amount_cents (capacity consumed, not just reserved)"
          - "Increments Bank.version by 1"

      - from: PROPOSED
        to: REJECTED
        trigger: "POST /banks/{bankId}/distribution-requests/{requestId}/reject"
        actor: CapitalAnalyst
        preconditions: []
        side_effects: []

      - from: APPROVED_NOT_EXECUTED
        to: WITHDRAWN
        trigger: "POST /banks/{bankId}/distribution-requests/{requestId}/withdraw OR cascade from CapitalPlan becoming SUPERSEDED"
        actor: CapitalAnalyst | system
        preconditions: []
        side_effects:
          - "bank.pending_distribution_cents -= capacity_reserved_cents"
          - "capacity_reserved_cents = 0"

      - from: APPROVED_NOT_EXECUTED
        to: EXPIRED
        trigger: "system (auto when current_utc > proposed_payment_date + DISTRIBUTION_WINDOW_DAYS)"
        actor: system
        preconditions: []
        side_effects:
          - "bank.pending_distribution_cents -= capacity_reserved_cents"
          - "capacity_reserved_cents = 0"

  - entity: SubordinatedDebtIssuance
    initial_state: PROPOSED
    terminal_states: [SETTLED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /banks/{bankId}/sub-debt-issuances/{issuanceId}/approve"
        actor: CapitalAnalyst
        preconditions:
          - "maturity_years >= 5 (else ERR_MATURITY_TOO_SHORT)"
          - "proposed_amount_cents <= t2_capacity_headroom_cents (T2 cap = 2% of RWA minus current T2; else ERR_T2_CAP_EXCEEDED)"
          - "Bank.pca_bucket in {WELL_CAPITALIZED, ADEQUATELY_CAPITALIZED} (else ERR_PCA_BLOCKS_ISSUANCE)"
        side_effects:
          - "Recompute t2_capacity_headroom_cents at approval"

      - from: APPROVED
        to: PRICED
        trigger: "POST /banks/{bankId}/sub-debt-issuances/{issuanceId}/price"
        actor: CapitalAnalyst
        preconditions: []
        side_effects: []

      - from: PRICED
        to: SETTLED
        trigger: "POST /banks/{bankId}/sub-debt-issuances/{issuanceId}/settle"
        actor: CapitalAnalyst
        preconditions:
          - "current_utc >= target_settlement_date"
          - "Re-verify T2 cap at settlement: proposed_amount_cents <= recomputed t2_capacity_headroom_cents (else ERR_T2_CAP_EXCEEDED; capacity may have shrunk since approval)"
        side_effects:
          - "Create CapitalInstrument row with instrument_class=T2, instrument_subtype=SUBORDINATED_DEBT, outstanding_amount_cents=proposed_amount_cents, contractual_rate_bps=proposed_rate_bps, issuance_date=current_utc date, maturity_date=current_utc + maturity_years"
          - "Set capital_instrument_id"
          - "Increments Bank.version by 1"

      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /banks/{bankId}/sub-debt-issuances/{issuanceId}/withdraw"
        actor: CapitalAnalyst
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /banks/{bankId}/sub-debt-issuances/{issuanceId}/withdraw"
        actor: CapitalAnalyst
        preconditions: []
        side_effects: []

  - entity: CapitalInstrument
    initial_state: OUTSTANDING
    terminal_states: [CALLED, MATURED, REDEEMED]
    transitions:
      - from: OUTSTANDING
        to: CALLED
        trigger: "POST /banks/{bankId}/capital-instruments/{instrumentId}/call"
        actor: CapitalAnalyst
        preconditions:
          - "instrument_subtype in {PREFERRED, TRUST_PREFERRED, SUBORDINATED_DEBT} (COMMON_STOCK cannot be called)"
          - "For SUBORDINATED_DEBT: bank.pca_bucket in {WELL_CAPITALIZED, ADEQUATELY_CAPITALIZED} AND post-call T2 still satisfies T2 cap (else ERR_PCA_BLOCKS_REDEMPTION)"
        side_effects:
          - "Recompute bank.mdba_cents"
          - "Recompute t2_capacity_headroom_cents on all open SubordinatedDebtIssuance rows"

      - from: OUTSTANDING
        to: MATURED
        trigger: "system (auto when current_utc >= maturity_date for SUBORDINATED_DEBT)"
        actor: system
        preconditions: []
        side_effects:
          - "outstanding_amount_cents remains for historical record; regulatory_capital_cents → 0"

      - from: OUTSTANDING
        to: REDEEMED
        trigger: "POST /banks/{bankId}/capital-instruments/{instrumentId}/redeem"
        actor: CapitalAnalyst
        preconditions:
          - "Same eligibility as CALLED"
        side_effects:
          - "Same side effects as CALLED"

  - entity: ICAAPDocument
    initial_state: DRAFT
    terminal_states: [FILED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: REVIEW
        trigger: "POST /banks/{bankId}/icaap-documents/{docId}/submit_review"
        actor: CapitalAnalyst
        preconditions:
          - "governing_capital_plan_id's CapitalPlan.status in {APPROVED, EFFECTIVE} (else ERR_PLAN_NOT_FINAL)"
          - "All 5 required sections present in sections array (else ERR_SECTION_MISSING)"
        side_effects:
          - "Capture prepared_by_user_id from X-User-ID"

      - from: REVIEW
        to: ATTESTED
        trigger: "POST /banks/{bankId}/icaap-documents/{docId}/attest"
        actor: BoardApprover
        preconditions:
          - "Segregation of duties: BoardApprover X-User-ID must NOT equal prepared_by_user_id"
        side_effects:
          - "Set board_attested_by_user_id"

      - from: ATTESTED
        to: FILED
        trigger: "POST /banks/{bankId}/icaap-documents/{docId}/file"
        actor: CapitalAnalyst
        preconditions:
          - "governing CapitalPlan.status == EFFECTIVE at file time (else ERR_PLAN_NOT_FINAL)"
        side_effects:
          - "Any prior ICAAPDocument for same bank with status == FILED transitions to SUPERSEDED"

      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (when a newer ICAAPDocument for the same bank reaches FILED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: REVIEW
        to: SUPERSEDED
        trigger: "system (when a newer ICAAPDocument for the same bank reaches FILED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ATTESTED
        to: SUPERSEDED
        trigger: "system (when a newer ICAAPDocument for the same bank reaches FILED)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: distribution-approve-stale-bank
    parent_entity: Bank
    write_endpoint: "POST /banks/{bankId}/distribution-requests/{requestId}/approve"
    occ_field: expected_bank_version
    description: |
      Approving a CapitalDistributionRequest against a Bank whose version has
      advanced since the client last observed it is rejected with ERR_STALE_VERSION.
      Bank.version is bumped by every capacity-affecting mutation (any other
      distribution approval, execution, withdrawal, expiry, PCA bucket change,
      instrument call/redeem, sub-debt settlement, plan amendment cascade), so a
      stale expected_bank_version implies the client has an out-of-date view of
      mdba_cents or pending_distribution_cents and the capacity arithmetic the
      approval decision relied on is no longer trustworthy.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: sub-debt-approve-stale-bank
    parent_entity: Bank
    write_endpoint: "POST /banks/{bankId}/sub-debt-issuances/{issuanceId}/approve"
    occ_field: expected_bank_version
    description: |
      Approving a SubordinatedDebtIssuance against a Bank whose version has
      advanced since the client last observed it is rejected with ERR_STALE_VERSION.
      T2 capacity headroom is derived from RWA and outstanding T2, both of which
      move when other approvals or settlements land — a stale view means the
      2%-of-RWA cap arithmetic the client used is no longer the server's.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: capital-plan-submit-stale-bank
    parent_entity: Bank
    write_endpoint: "POST /banks/{bankId}/capital-plans/{planId}/submit_regulator"
    occ_field: expected_bank_version
    description: |
      Submitting a CapitalPlan to the regulator against a Bank whose version has
      advanced since the client last observed it is rejected with ERR_STALE_VERSION.
      Between board_approve and submit_regulator, another mutation may have changed
      mdba_cents, the PCA bucket, or the stressed capital buffer, any of which
      invalidates the plan's capacity representation to the regulator.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: icaap-file-stale-bank
    parent_entity: Bank
    write_endpoint: "POST /banks/{bankId}/icaap-documents/{docId}/file"
    occ_field: expected_bank_version
    description: |
      Filing an ICAAPDocument against a Bank whose version has advanced since the
      client last observed it is rejected with ERR_STALE_VERSION. The ICAAP
      references a specific EFFECTIVE CapitalPlan; if a bank-level mutation has
      superseded that plan or refreshed its baseline, the document being filed
      describes a state the bank no longer occupies.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: rwa_standardized
    trigger: "call report prepare; exposure add/remove on the period"
    algorithm: aggregation
    formula: |
      rwa_standardized_cents = Σ over RiskExposure rows where reporting_period_id == period
        of (exposure_at_default_cents * risk_weight_bps) / 10000
      Integer division; per-line round-down (floor), then sum. DO NOT sum then divide.
    input_set: "All RiskExposure rows for the reporting_period_id, regardless of exposure_class or obligor_grade"
    constants:
      BPS_DENOMINATOR: 10000
    precision: "integer cents, per-line floor then sum"
    variants:
      - name: base
        when: "always"
        difference: "Ignores collateral_haircut_bps entirely; uses raw EAD"

  - name: rwa_advanced
    trigger: "call report prepare; exposure add/remove on the period"
    algorithm: aggregation
    formula: |
      For each RiskExposure row:
        effective_ead_cents = floor(exposure_at_default_cents * (10000 - collateral_haircut_bps) / 10000)
        rwa_line_cents = floor(effective_ead_cents * risk_weight_bps / 10000 * ADVANCED_MULTIPLIER_BPS / 10000)
      rwa_advanced_cents = Σ rwa_line_cents
      Round per-line to integer cents (floor), then sum.
    input_set: "All RiskExposure rows for the reporting_period_id"
    constants:
      BPS_DENOMINATOR: 10000
      ADVANCED_MULTIPLIER_BPS: 10600  # 1.06 scaling factor for advanced approaches (PD/LGD conservatism add-on)
    precision: "integer cents, per-line floor then sum"
    variants:
      - name: base
        when: "always"
        difference: "Applies collateral haircut and 1.06 multiplier; produces different result from standardized for identical inputs"

  - name: rwa_selected
    trigger: "call report prepare"
    algorithm: aggregation
    formula: |
      If bank.rwa_methodology == STANDARDIZED: rwa_cents = rwa_standardized_cents
      If bank.rwa_methodology == ADVANCED:
        # Collins floor: advanced RWA cannot fall below 100% of standardized
        rwa_cents = max(rwa_advanced_cents, rwa_standardized_cents)
    input_set: "Uses outputs of rwa_standardized and rwa_advanced"
    constants: {}
    precision: "integer cents"

  - name: cet1_tier1_total_capital
    trigger: "call report prepare"
    algorithm: aggregation
    formula: |
      cet1_cents = Σ regulatory_capital_cents over CapitalInstrument rows
                   where bank_id == bank AND status == OUTSTANDING AND instrument_class == CET1
      at1_raw = Σ regulatory_capital_cents over CapitalInstrument rows
                where status == OUTSTANDING AND instrument_class == AT1
      # AT1 cap: AT1 cannot exceed 1.5% of RWA when T1 minimum is being computed (regulatory cap)
      at1_cap_cents = floor(rwa_cents * 150 / 10000)   # 1.5% of RWA
      at1_counted = min(at1_raw, at1_cap_cents)
      tier1_cents = cet1_cents + at1_counted
      t2_raw = Σ regulatory_capital_cents over CapitalInstrument rows
               where status == OUTSTANDING AND instrument_class == T2
      # T2 cap: T2 cannot exceed 2% of RWA; ALSO T2 cannot exceed 100% of CET1
      t2_cap_pct_cents = floor(rwa_cents * 200 / 10000)   # 2% of RWA
      t2_cap_cet1_cents = cet1_cents                       # 100% of CET1
      t2_counted = min(t2_raw, t2_cap_pct_cents, t2_cap_cet1_cents)
      total_capital_cents = tier1_cents + t2_counted
    input_set: "CapitalInstrument rows with status == OUTSTANDING; rwa_cents from rwa_selected"
    constants:
      AT1_CAP_BPS_OF_RWA: 150
      T2_CAP_BPS_OF_RWA: 200
    precision: "integer cents, floor on cap arithmetic"

  - name: t2_amortization_haircut
    trigger: "call report prepare; system clock advance across year boundaries"
    algorithm: decay_function
    formula: |
      For each CapitalInstrument where instrument_subtype == SUBORDINATED_DEBT AND status == OUTSTANDING:
        years_to_maturity = floor((maturity_date - period_end_date) / 365.25)   # computed against the period's end date
        if years_to_maturity >= 5:  t2_haircut_pct = 0
        elif years_to_maturity == 4: t2_haircut_pct = 20
        elif years_to_maturity == 3: t2_haircut_pct = 40
        elif years_to_maturity == 2: t2_haircut_pct = 60
        elif years_to_maturity == 1: t2_haircut_pct = 80
        else:                        t2_haircut_pct = 100  # less than 1 year
        regulatory_capital_cents = floor(outstanding_amount_cents * (100 - t2_haircut_pct) / 100)
    input_set: "SUBORDINATED_DEBT CapitalInstrument rows; non-sub-debt rows: regulatory_capital_cents = outstanding_amount_cents"
    constants: {}
    precision: "integer cents; year bucketing uses 365.25 day divisor"

  - name: capital_ratios_bps
    trigger: "call report prepare"
    algorithm: aggregation
    formula: |
      If rwa_cents == 0:
        cet1_ratio_bps = null
        tier1_ratio_bps = null
        total_ratio_bps = null
      Else:
        cet1_ratio_bps   = floor(cet1_cents * 10000 / rwa_cents)
        tier1_ratio_bps  = floor(tier1_cents * 10000 / rwa_cents)
        total_ratio_bps  = floor(total_capital_cents * 10000 / rwa_cents)
      If total_exposure_cents == 0:
        leverage_ratio_bps = null
      Else:
        leverage_ratio_bps = floor(tier1_cents * 10000 / total_exposure_cents)
    input_set: "Outputs of cet1_tier1_total_capital, rwa_selected; total_exposure_cents = Σ exposure_at_default_cents over the period's RiskExposure rows"
    constants:
      BPS_DENOMINATOR: 10000
    precision: "integer bps, floor; null when denominator == 0"

  - name: pca_bucket_classification
    trigger: "call report accept (both original and amendment)"
    algorithm: threshold
    formula: |
      For each metric, classify against thresholds (in bps):
        CET1:   WELL >= 650;  ADEQUATE >= 450;  UNDER >= 400;  SIGNIFICANT >= 300;  else CRITICAL
        TIER1:  WELL >= 800;  ADEQUATE >= 600;  UNDER >= 500;  SIGNIFICANT >= 400;  else CRITICAL
        TOTAL:  WELL >= 1000; ADEQUATE >= 800;  UNDER >= 700;  SIGNIFICANT >= 600;  else CRITICAL
        LEVERAGE: WELL >= 500; ADEQUATE >= 400; UNDER >= 350; SIGNIFICANT >= 300; else CRITICAL
      # Boundary: the comparison is >=, NOT >. A ratio exactly at the threshold qualifies for the higher bucket.
      bank.pca_bucket = the STRICTEST (worst) bucket across the four metrics.
      Bucket ordering (best → worst): WELL_CAPITALIZED, ADEQUATELY_CAPITALIZED, UNDERCAPITALIZED, SIGNIFICANTLY_UNDERCAPITALIZED, CRITICALLY_UNDERCAPITALIZED
    input_set: "cet1_ratio_bps, tier1_ratio_bps, total_ratio_bps, leverage_ratio_bps from the accepted call report"
    constants:
      PCA_WELL_CET1_BPS: 650
      PCA_ADEQUATE_CET1_BPS: 450
      PCA_UNDER_CET1_BPS: 400
      PCA_SIGNIFICANT_CET1_BPS: 300
      PCA_WELL_TIER1_BPS: 800
      PCA_ADEQUATE_TIER1_BPS: 600
      PCA_UNDER_TIER1_BPS: 500
      PCA_SIGNIFICANT_TIER1_BPS: 400
      PCA_WELL_TOTAL_BPS: 1000
      PCA_ADEQUATE_TOTAL_BPS: 800
      PCA_UNDER_TOTAL_BPS: 700
      PCA_SIGNIFICANT_TOTAL_BPS: 600
      PCA_WELL_LEVERAGE_BPS: 500
      PCA_ADEQUATE_LEVERAGE_BPS: 400
      PCA_UNDER_LEVERAGE_BPS: 350
      PCA_SIGNIFICANT_LEVERAGE_BPS: 300
    precision: "integer bps comparisons; threshold inclusive (>=)"

  - name: stress_capital_buffer
    trigger: "capital plan regulator_approve"
    algorithm: forward_looking
    formula: |
      # Project 9 quarters of capital depletion under the plan's stress scenario.
      # Loss for quarter q: pre_tax_loss_q = projected_pre_tax_loss_cents * quarter_weight_q
      # quarter_weight profile (in bps; sums to exactly 10000):
      #   Q1: 800, Q2: 1000, Q3: 1200, Q4: 1400, Q5: 1300, Q6: 1200, Q7: 1100, Q8: 1100, Q9: 900
      # Tax offset: 21% reduction on cumulative losses
      # Dividend add-back: continue planned distributions from the plan for all 9 quarters
      # Net income add-back: assume 0 for stress floor conservatism
      # stressed_min_cet1_bps_9q = min over q in 1..9 of:
      #   floor( (baseline_cet1_cents - cumulative_after_tax_loss_q - cumulative_distributions_q) * 10000
      #          / (baseline_rwa_cents * rwa_growth_q) )
      # rwa_growth_q = 10000 + STRESS_RWA_GROWTH_BPS_PER_QUARTER * q
      # After-tax loss: cumulative_pre_tax_loss_q * (10000 - TAX_RATE_BPS) / 10000
      # Final SCB: max(PCA_ADEQUATE_CET1_BPS + 250, floor((baseline_cet1_ratio_bps - stressed_min_cet1_bps_9q)))
      # SCB floor: 250 bps (2.5%) minimum regardless of stress performance
    input_set: "Baseline capital plan fields, stress scenario projected_pre_tax_loss_cents, planned distributions"
    constants:
      TAX_RATE_BPS: 2100   # 21% tax
      STRESS_RWA_GROWTH_BPS_PER_QUARTER: 50   # 0.5% per quarter RWA growth under stress
      SCB_FLOOR_BPS: 250   # 2.5% minimum SCB
    precision: "integer bps; per-quarter floor on ratio computation"

  - name: stress_loss_projection
    trigger: "stress scenario activate; capital plan compute"
    algorithm: forward_looking
    formula: |
      # Projected 9-quarter pre-tax loss given scenario shocks and bank exposure inventory
      # Loss rate per exposure class (bps of EAD) under the given scenario:
      #   CORPORATE:            base_loss_bps = 200 + (|gdp_shock_bps| * 30) / 1000
      #   CRE:                  base_loss_bps = 150 + (|cre_price_shock_bps| * 25) / 1000
      #   HVCRE:                base_loss_bps = 300 + (|cre_price_shock_bps| * 40) / 1000
      #   RETAIL_MORTGAGE:      base_loss_bps = 100 + (|hpi_shock_bps| * 20) / 1000
      #   RETAIL_OTHER:         base_loss_bps = 250 + (unemployment_peak_bps * 15) / 1000
      #   SOVEREIGN:            base_loss_bps = 0
      #   EQUITY:               base_loss_bps = 500 + (|market_shock_bps| * 50) / 1000
      #   SECURITIZATION:       base_loss_bps = 300 + (|gdp_shock_bps| * 20) / 1000 + (|hpi_shock_bps| * 10) / 1000
      #   OPERATIONAL_RISK:     base_loss_bps = 50 (flat)
      #   MARKET_RISK:          base_loss_bps = 100 + (|market_shock_bps| * 30) / 1000
      # obligor_grade multiplier: DEFAULT = 3x, NON_INVESTMENT_GRADE = 2x, INVESTMENT_GRADE = 1x
      # loss_per_exposure = floor(ead_cents * base_loss_bps * grade_multiplier / 10000)
      # projected_pre_tax_loss_cents = Σ loss_per_exposure over ALL RiskExposure rows for the bank
      #   across all ReportingPeriods with status in {OPEN, FILING_DUE} (current-inventory proxy)
    input_set: "All RiskExposure rows for the bank whose ReportingPeriod.status in {OPEN, FILING_DUE}"
    constants: {}
    precision: "integer cents, floor per exposure"

  - name: maximum_distributable_amount
    trigger: "any PCA bucket change, SCB change, distribution approve/execute/withdraw/expire, capital instrument call/redeem, sub-debt settle"
    algorithm: waterfall_allocation
    formula: |
      # MDBA is the smaller of (i) PCA capacity and (ii) stress-buffer capacity
      # PCA capacity (only when bucket in {WELL, ADEQUATE}; else 0):
      #   headroom_bps = min(cet1_ratio_bps, tier1_ratio_bps, total_ratio_bps, leverage_ratio_bps) - applicable_floor_bps
      #   where applicable_floor_bps = PCA_ADEQUATE_*_BPS for the metric achieving the min
      #   pca_capacity_cents = max(0, headroom_bps * rwa_cents / 10000)
      # Stress-buffer capacity:
      #   buffer_headroom_bps = stressed_min_cet1_bps_9q - (PCA_ADEQUATE_CET1_BPS + stressed_capital_buffer_bps)
      #   stress_capacity_cents = max(0, buffer_headroom_bps * rwa_cents / 10000)
      # mdba_cents = max(0, min(pca_capacity_cents, stress_capacity_cents) - pending_distribution_cents)
      # If pca_bucket in {UNDERCAPITALIZED, SIGNIFICANTLY_UNDERCAPITALIZED, CRITICALLY_UNDERCAPITALIZED}: mdba_cents = 0
      # If no CapitalPlan in EFFECTIVE state: stress_capacity_cents = 0 (treated as binding)
    input_set: "Latest accepted call report ratios, EFFECTIVE capital plan, pending distributions"
    constants: {}
    precision: "integer cents"

  - name: t2_capacity_headroom
    trigger: "sub-debt propose/approve/settle; any RWA recomputation; any T2 instrument call/redeem/mature"
    algorithm: aggregation
    formula: |
      t2_outstanding_cents = Σ regulatory_capital_cents over CapitalInstrument rows
                             where bank_id == bank AND status == OUTSTANDING AND instrument_class == T2
      t2_cap_cents = floor(rwa_cents_latest * 200 / 10000)   # 2% of latest accepted RWA
      t2_headroom_cents = max(0, t2_cap_cents - t2_outstanding_cents)
      # rwa_cents_latest is the rwa_cents from the bank's most recently ACCEPTED call report;
      # null (treated as 0) if no accepted report exists.
    input_set: "CapitalInstrument rows; latest accepted CallReport.rwa_cents"
    constants:
      T2_CAP_BPS_OF_RWA: 200
    precision: "integer cents"

  - name: edit_check_rwa_mismatch
    trigger: "call report prepare"
    algorithm: aggregation
    formula: |
      # Recompute RWA from scratch; if it diverges from the stored rwa_cents by > 1 cent → EDIT_RWA_MISMATCH (FATAL)
      # Also: if methodology is ADVANCED and rwa_advanced_cents < rwa_standardized_cents → EDIT_FLOOR_VIOLATION (FATAL)
      # Also: if any ratio bps disagrees with recomputation by > 1 bp → EDIT_RATIO_ROUNDING (QUALITY)
    input_set: "Current call report fields and source rows"
    constants: {}
    precision: "1 cent tolerance for RWA; 1 bp tolerance for ratios"

  - name: filing_deadline_computation
    trigger: "reporting period creation"
    algorithm: chronological
    formula: |
      filing_due_at = period_end_date + FILING_LAG_DAYS days, at 17:00:00Z
      FILING_LAG_DAYS = 35 for Q1/Q2/Q3, 40 for Q4
    input_set: "ReportingPeriod.period_end_date and period_quarter"
    constants:
      FILING_LAG_Q1_Q2_Q3_DAYS: 35
      FILING_LAG_Q4_DAYS: 40
    precision: "datetime to the second"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles list"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path-templated id resolves to an existing entity, validated left-to-right (bank → period → report → child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: business_referential
    check: "FK references in request body resolve to entities owned by the same bank (e.g., stress_scenario_id belongs to this bank; capital_plan_id belongs to this bank)"
    error_id: ERR_CROSS_BANK_REFERENCE
    http_status: 422
    applies_to: "endpoints with FK payloads (capital-plan create, distribution create, icaap create, exposure create)"

  - priority: 5
    category: state
    check: "Target entity is in a state where the requested transition is permitted (per §1.2)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: business_safety
    check: "PCA posture gating: bank.pca_bucket in {WELL_CAPITALIZED, ADEQUATELY_CAPITALIZED} required for distribution approve/execute, sub-debt approve, instrument call/redeem"
    error_id: ERR_PCA_BLOCKS_DISTRIBUTION
    http_status: 409
    applies_to: "POST distribution-requests/{id}/approve, POST distribution-requests/{id}/execute, POST sub-debt-issuances/{id}/approve, POST capital-instruments/{id}/call, POST capital-instruments/{id}/redeem"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: submitter/attester X-User-ID must differ from the preparer X-User-ID captured earlier in the same workflow"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 409
    applies_to: "POST call-reports/{id}/submit, POST capital-plans/{id}/board_approve, POST icaap-documents/{id}/attest"

  - priority: 8
    category: business_constraint
    check: "Uniqueness and exclusivity invariants: at most one non-terminal CapitalPlan in flight per bank; at most MAX_ACTIVE_SCENARIOS active StressScenarios per bank; scenario_code unique among non-RETIRED"
    error_id: ERR_INVARIANT_VIOLATION
    http_status: 409
    applies_to: "capital-plan create + submit_board, stress-scenario create + activate"

  - priority: 9
    category: business_temporal
    check: "Time-window checks: proposed_payment_date within quarter and >= today; distribution execute within [payment_date, payment_date+10d]; period close in chronological order; sub-debt maturity_years >= 5"
    error_id: ERR_TEMPORAL_VIOLATION
    http_status: 409
    applies_to: "distribution create/execute, period close, sub-debt propose"

  - priority: 10
    category: business_fiscal
    check: "Capacity checks: distribution approval amount <= mdba - pending; sub-debt approval amount <= t2_headroom; plan board_approve proposed_distributions <= mdba + approved sub-debt headroom"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "distribution approve, sub-debt approve, capital-plan board_approve"

  - priority: 11
    category: business_constraint
    check: "Edit-exception gate: call report cannot transition to SUBMITTED with edit_failures_open_count > 0; cannot ACCEPT with any non-terminal EditException"
    error_id: ERR_UNRESOLVED_EDITS
    http_status: 409
    applies_to: "call-reports submit, call-reports accept"

  - priority: 12
    category: business_constraint
    check: "FATAL EditException cannot be EXPLAINED — must be RESOLVED; QUALITY may be either; resolution_note required for non-INFORMATIONAL"
    error_id: ERR_EDIT_NOTE_REQUIRED
    http_status: 422
    applies_to: "edit-exceptions resolve, edit-exceptions explain"

  - priority: 13
    category: business_temporal
    check: "Amendment gate: cannot open amendment on a period if a later period for the same bank is already CLOSED"
    error_id: ERR_AMENDMENT_LOCKED
    http_status: 409
    applies_to: "call-reports open_amendment"

  - priority: 14
    category: business_constraint
    check: "Plan-floor check: regulator_approve requires stressed_min_cet1_bps_9q >= PCA_ADEQUATE_CET1_BPS + applicable SCB"
    error_id: ERR_PLAN_FAILED_STRESS_FLOOR
    http_status: 409
    applies_to: "capital-plans regulator_approve"

  - priority: 15
    category: business_referential
    check: "ICAAP requires governing CapitalPlan in APPROVED or EFFECTIVE at submit_review, EFFECTIVE at file"
    error_id: ERR_PLAN_NOT_FINAL
    http_status: 409
    applies_to: "icaap-documents submit_review, icaap-documents file"

  - priority: 16
    category: business_constraint
    check: "Required ICAAP sections present: GOVERNANCE, RISK_APPETITE, CAPITAL_ADEQUACY, STRESS_TESTING, DISTRIBUTION_POLICY"
    error_id: ERR_SECTION_MISSING
    http_status: 422
    applies_to: "icaap-documents submit_review"

  - priority: 17
    category: business_constraint
    check: "RiskExposure.risk_weight_bps within the allowable band for its exposure_class; collateral_haircut_bps in [0, 10000]; EAD > 0"
    error_id: ERR_INVALID_RISK_PARAMETER
    http_status: 422
    applies_to: "exposures create"

  - priority: 18
    category: business_constraint
    check: "Common-stock CapitalInstrument cannot be CALLED or REDEEMED"
    error_id: ERR_INSTRUMENT_NOT_CALLABLE
    http_status: 409
    applies_to: "capital-instruments call, capital-instruments redeem"

  - priority: 19
    category: state
    check: "OCC: expected_bank_version must equal Bank.version at the time of the write"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "distribution approve, sub-debt approve, capital-plan submit_regulator, icaap file"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- System / test-driving ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the server's logical clock. Default time before any call is 2026-08-01T00:00:00Z; the clock NEVER falls back to wall-clock. Drives period FILING_DUE transitions, late-filing detection, distribution expiry, sub-debt maturity haircuts, plan EFFECTIVE activation, and scenario retirement."
    roles: [SystemOperator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "Advance logical clock to to_iso8601 (must be monotonically non-decreasing)"
      - "Fire time-triggered transitions: ReportingPeriod OPEN→FILING_DUE, CapitalPlan APPROVED→EFFECTIVE, CapitalDistributionRequest APPROVED_NOT_EXECUTED→EXPIRED, CapitalInstrument SUBORDINATED_DEBT OUTSTANDING→MATURED"
      - "Recompute derived fields affected by time (late_filing, supervisory_status, t2_haircut_pct)"

  - method: GET
    path: "/_clock/current_utc"
    description: "Read current logical clock time."
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: []
    output: "{ current_utc: string }"
    side_effects: []

  # --- Bank ---
  - method: POST
    path: "/banks"
    description: "Create a Bank"
    roles: [SystemOperator]
    code: 201
    input: ["legal_name", "charter_id", "rwa_methodology?"]
    output: Bank
    side_effects: ["Initialize pca_bucket = ADEQUATELY_CAPITALIZED (default until first accepted report); mdba_cents = 0; pending_distribution_cents = 0; supervisory_status = NORMAL"]

  - method: GET
    path: "/banks/{bankId}"
    description: "Get a Bank"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: []
    output: Bank
    side_effects: []

  - method: GET
    path: "/banks"
    description: "List Banks"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "charter_id?"]
    output: "Bank[]"
    side_effects: []

  # --- ReportingPeriod ---
  - method: POST
    path: "/banks/{bankId}/reporting-periods"
    description: "Create a ReportingPeriod"
    roles: [CapitalAnalyst]
    code: 201
    input: [period_end_date, period_year, period_quarter]
    output: ReportingPeriod
    side_effects: ["Compute filing_due_at per filing_deadline_computation; status = OPEN"]

  - method: GET
    path: "/banks/{bankId}/reporting-periods/{periodId}"
    description: "Get a ReportingPeriod"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: []
    output: ReportingPeriod
    side_effects: []

  - method: GET
    path: "/banks/{bankId}/reporting-periods"
    description: "List ReportingPeriods for a bank"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "status?", "period_year?"]
    output: "ReportingPeriod[]"
    side_effects: []

  - method: POST
    path: "/banks/{bankId}/reporting-periods/{periodId}/close"
    description: "Close a ReportingPeriod (books-closed)"
    roles: [CapitalAnalyst]
    code: 200
    input: []
    output: ReportingPeriod
    side_effects: ["status → CLOSED; enforce chronological close order"]

  # --- CapitalInstrument ---
  - method: POST
    path: "/banks/{bankId}/capital-instruments"
    description: "Create a CapitalInstrument (e.g., issue CET1/AT1/T2)"
    roles: [CapitalAnalyst]
    code: 201
    input: ["instrument_class", "instrument_subtype", "outstanding_amount_cents", "issuance_date", "maturity_date?", "contractual_rate_bps"]
    output: CapitalInstrument
    side_effects: ["status = OUTSTANDING; recompute regulatory_capital_cents via t2_amortization_haircut; increments Bank.version by 1"]

  - method: GET
    path: "/banks/{bankId}/capital-instruments/{instrumentId}"
    description: "Get a CapitalInstrument"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: []
    output: CapitalInstrument
    side_effects: []

  - method: GET
    path: "/banks/{bankId}/capital-instruments"
    description: "List CapitalInstruments"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "instrument_class?", "status?"]
    output: "CapitalInstrument[]"
    side_effects: []

  - method: POST
    path: "/banks/{bankId}/capital-instruments/{instrumentId}/call"
    description: "Call a callable CapitalInstrument"
    roles: [CapitalAnalyst]
    code: 200
    input: []
    output: CapitalInstrument
    side_effects: ["status → CALLED; recompute mdba_cents and t2_headroom across open sub-debt proposals; increments Bank.version by 1"]

  - method: POST
    path: "/banks/{bankId}/capital-instruments/{instrumentId}/redeem"
    description: "Redeem a CapitalInstrument"
    roles: [CapitalAnalyst]
    code: 200
    input: []
    output: CapitalInstrument
    side_effects: ["status → REDEEMED; recompute mdba_cents and t2_headroom; increments Bank.version by 1"]

  # --- RiskExposure ---
  - method: POST
    path: "/banks/{bankId}/reporting-periods/{periodId}/risk-exposures"
    description: "Create a RiskExposure for a period"
    roles: [CapitalAnalyst]
    code: 201
    input: ["reporting_period_id", "exposure_class", "exposure_at_default_cents", "risk_weight_bps", "obligor_grade", "collateral_haircut_bps?"]
    output: RiskExposure
    side_effects: ["Compute rwa_cents_standardized and rwa_cents_advanced per line; period must be in {OPEN, FILING_DUE}"]

  - method: GET
    path: "/banks/{bankId}/reporting-periods/{periodId}/risk-exposures/{exposureId}"
    description: "Get a RiskExposure"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: []
    output: RiskExposure
    side_effects: []

  - method: GET
    path: "/banks/{bankId}/reporting-periods/{periodId}/risk-exposures"
    description: "List RiskExposures for a period"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "exposure_class?", "obligor_grade?"]
    output: "RiskExposure[]"
    side_effects: []

  - method: GET
    path: "/banks/{bankId}/risk-exposures"
    description: "Filtered list of RiskExposures across periods"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "reporting_period_id?", "exposure_class?"]
    output: "RiskExposure[]"
    side_effects: []

  # --- CallReport ---
  - method: POST
    path: "/banks/{bankId}/reporting-periods/{periodId}/call-reports"
    description: "Create a draft CallReport for a period (amendment_sequence = 0 if first, else prior+1)"
    roles: [CapitalAnalyst]
    code: 201
    input: []
    output: CallReport
    side_effects: ["status = DRAFT; if ReportingPeriod already has an ACCEPTED report, this creates an amendment row with supersedes_call_report_id set"]

  - method: GET
    path: "/banks/{bankId}/reporting-periods/{periodId}/call-reports/{reportId}"
    description: "Get a CallReport"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: []
    output: CallReport
    side_effects: []

  - method: GET
    path: "/banks/{bankId}/reporting-periods/{periodId}/call-reports"
    description: "List CallReports for a period (all amendments)"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "CallReport[]"
    side_effects: []

  - method: GET
    path: "/banks/{bankId}/call-reports"
    description: "Filtered list of CallReports across periods"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "reporting_period_id?", "status?"]
    output: "CallReport[]"
    side_effects: []

  - method: POST
    path: "/banks/{bankId}/reporting-periods/{periodId}/call-reports/{reportId}/prepare"
    description: "Run RWA / capital / ratio / edit-check computations"
    roles: [CapitalAnalyst]
    code: 200
    input: []
    output: CallReport
    side_effects: ["Compute capital stacks, both RWA variants, ratios, run edit checks, create EditException rows, capture prepared_by_user_id; transitions to PREPARED → (VALIDATED | EDITS_OUTSTANDING)"]

  - method: POST
    path: "/banks/{bankId}/reporting-periods/{periodId}/call-reports/{reportId}/submit"
    description: "Submit a validated call report"
    roles: [CapitalAnalyst]
    code: 200
    input: []
    output: CallReport
    side_effects: ["status → SUBMITTED; set submitted_at; check late_filing; segregation-of-duties check; increments Bank.version by 1"]

  - method: POST
    path: "/banks/{bankId}/reporting-periods/{periodId}/call-reports/{reportId}/accept"
    description: "Regulator accepts a submitted report"
    roles: [RegulatorReviewer]
    code: 200
    input: []
    output: CallReport
    side_effects: ["status → ACCEPTED; PCA bucket recompute; PCAThresholdEvent insertion; mdba recompute; cascade into plans, distribution requests, sub-debt headrooms; increments Bank.version by 1"]

  - method: POST
    path: "/banks/{bankId}/reporting-periods/{periodId}/call-reports/{reportId}/open_amendment"
    description: "Open an amendment on an accepted period"
    roles: [CapitalAnalyst]
    code: 200
    input: []
    output: CallReport
    side_effects: ["Prior report → AMENDED_SUPERSEDED; new DRAFT report created with amendment_sequence incremented"]

  # --- EditException ---
  - method: GET
    path: "/banks/{bankId}/reporting-periods/{periodId}/call-reports/{reportId}/edit-exceptions"
    description: "List EditExceptions on a report"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "status?", "severity?"]
    output: "EditException[]"
    side_effects: []

  - method: GET
    path: "/banks/{bankId}/reporting-periods/{periodId}/call-reports/{reportId}/edit-exceptions/{editId}"
    description: "Get an EditException"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: []
    output: EditException
    side_effects: []

  - method: POST
    path: "/banks/{bankId}/reporting-periods/{periodId}/call-reports/{reportId}/edit-exceptions/{editId}/resolve"
    description: "Resolve an edit exception"
    roles: [CapitalAnalyst]
    code: 200
    input: [resolution_note]
    output: EditException
    side_effects: ["status → RESOLVED; decrement edit_failures_open_count; may auto-transition report to VALIDATED"]

  - method: POST
    path: "/banks/{bankId}/reporting-periods/{periodId}/call-reports/{reportId}/edit-exceptions/{editId}/explain"
    description: "Explain a QUALITY or INFORMATIONAL edit"
    roles: [CapitalAnalyst]
    code: 200
    input: [resolution_note]
    output: EditException
    side_effects: ["status → EXPLAINED; decrement edit_failures_open_count; FATAL edits rejected with ERR_INVALID_STATE_TRANSITION"]

  # --- StressScenario ---
  - method: POST
    path: "/banks/{bankId}/stress-scenarios"
    description: "Create a StressScenario"
    roles: [CapitalAnalyst]
    code: 201
    input: [scenario_code, gdp_shock_bps, unemployment_peak_bps, hpi_shock_bps, cre_price_shock_bps, market_shock_bps]
    output: StressScenario
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/banks/{bankId}/stress-scenarios/{scenarioId}"
    description: "Get a StressScenario"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: []
    output: StressScenario
    side_effects: []

  - method: GET
    path: "/banks/{bankId}/stress-scenarios"
    description: "List StressScenarios"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "StressScenario[]"
    side_effects: []

  - method: POST
    path: "/banks/{bankId}/stress-scenarios/{scenarioId}/activate"
    description: "Activate a stress scenario"
    roles: [CapitalAnalyst]
    code: 200
    input: []
    output: StressScenario
    side_effects: ["status → ACTIVE; compute projected_pre_tax_loss_cents"]

  - method: POST
    path: "/banks/{bankId}/stress-scenarios/{scenarioId}/retire"
    description: "Retire a stress scenario"
    roles: [CapitalAnalyst]
    code: 200
    input: []
    output: StressScenario
    side_effects: ["status → RETIRED; blocked if any in-flight plan references it"]

  # --- CapitalPlan ---
  - method: POST
    path: "/banks/{bankId}/capital-plans"
    description: "Create a CapitalPlan"
    roles: [CapitalAnalyst]
    code: 201
    input: [plan_year, baseline_period_id, stress_scenario_id]
    output: CapitalPlan
    side_effects: ["status = DRAFT; baseline_* fields populated from baseline period's accepted report"]

  - method: GET
    path: "/banks/{bankId}/capital-plans/{planId}"
    description: "Get a CapitalPlan"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: []
    output: CapitalPlan
    side_effects: []

  - method: GET
    path: "/banks/{bankId}/capital-plans"
    description: "List CapitalPlans"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "status?", "plan_year?"]
    output: "CapitalPlan[]"
    side_effects: []

  - method: POST
    path: "/banks/{bankId}/capital-plans/{planId}/submit_board"
    description: "Submit plan for board review"
    roles: [CapitalAnalyst]
    code: 200
    input: []
    output: CapitalPlan
    side_effects: ["status → BOARD_REVIEW; compute projected_cet1_bps_9q and stressed_min_cet1_bps_9q; capture prepared_by_user_id"]

  - method: POST
    path: "/banks/{bankId}/capital-plans/{planId}/board_approve"
    description: "Board approves plan"
    roles: [BoardApprover]
    code: 200
    input: []
    output: CapitalPlan
    side_effects: ["status → SUBMITTED; segregation-of-duties check vs prepared_by"]

  - method: POST
    path: "/banks/{bankId}/capital-plans/{planId}/submit_regulator"
    description: "Submit plan to regulator"
    roles: [CapitalAnalyst]
    code: 200
    input: [expected_bank_version]
    output: CapitalPlan
    side_effects: ["status → SUPERVISORY_REVIEW; OCC check on Bank.version; increments Bank.version by 1"]

  - method: POST
    path: "/banks/{bankId}/capital-plans/{planId}/regulator_approve"
    description: "Regulator approves plan"
    roles: [RegulatorReviewer]
    code: 200
    input: []
    output: CapitalPlan
    side_effects: ["status → APPROVED; set stressed_capital_buffer_bps on bank; auto-transition to EFFECTIVE on plan_year-01-01; increments Bank.version by 1"]

  - method: POST
    path: "/banks/{bankId}/capital-plans/{planId}/regulator_object"
    description: "Regulator objects to plan"
    roles: [RegulatorReviewer]
    code: 200
    input: []
    output: CapitalPlan
    side_effects: ["status → OBJECTED; supervisory_status = UNDER_MOU; attached distribution requests → REJECTED; increments Bank.version by 1"]

  - method: POST
    path: "/banks/{bankId}/capital-plans/{planId}/amend"
    description: "Analyst amends an objected plan"
    roles: [CapitalAnalyst]
    code: 200
    input: []
    output: CapitalPlan
    side_effects: ["status → DRAFT; increments plan.version by 1"]

  # --- CapitalDistributionRequest ---
  - method: POST
    path: "/banks/{bankId}/distribution-requests"
    description: "Propose a dividend or buyback"
    roles: [CapitalAnalyst]
    code: 201
    input: [capital_plan_id, reporting_period_id, distribution_kind, distribution_amount_cents, proposed_payment_date]
    output: CapitalDistributionRequest
    side_effects: ["status = PROPOSED; plan must be in {DRAFT, BOARD_REVIEW, SUBMITTED, SUPERVISORY_REVIEW, APPROVED}"]

  - method: GET
    path: "/banks/{bankId}/distribution-requests/{requestId}"
    description: "Get a distribution request"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: []
    output: CapitalDistributionRequest
    side_effects: []

  - method: GET
    path: "/banks/{bankId}/distribution-requests"
    description: "List distribution requests"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "capital_plan_id?", "status?", "distribution_kind?"]
    output: "CapitalDistributionRequest[]"
    side_effects: []

  - method: POST
    path: "/banks/{bankId}/distribution-requests/{requestId}/approve"
    description: "Approve a distribution request"
    roles: [CapitalAnalyst]
    code: 200
    input: [expected_bank_version]
    output: CapitalDistributionRequest
    side_effects: ["status → APPROVED_NOT_EXECUTED; reserve capacity; increments Bank.version by 1"]

  - method: POST
    path: "/banks/{bankId}/distribution-requests/{requestId}/execute"
    description: "Execute (pay) an approved distribution"
    roles: [CapitalAnalyst]
    code: 200
    input: []
    output: CapitalDistributionRequest
    side_effects: ["status → EXECUTED; consume capacity; PCA re-check; increments Bank.version by 1"]

  - method: POST
    path: "/banks/{bankId}/distribution-requests/{requestId}/reject"
    description: "Reject a proposed distribution"
    roles: [CapitalAnalyst]
    code: 200
    input: []
    output: CapitalDistributionRequest
    side_effects: ["status → REJECTED"]

  - method: POST
    path: "/banks/{bankId}/distribution-requests/{requestId}/withdraw"
    description: "Withdraw an approved distribution"
    roles: [CapitalAnalyst]
    code: 200
    input: []
    output: CapitalDistributionRequest
    side_effects: ["status → WITHDRAWN; release capacity; increments Bank.version by 1"]

  # --- SubordinatedDebtIssuance ---
  - method: POST
    path: "/banks/{bankId}/sub-debt-issuances"
    description: "Propose a T2 sub-debt issuance"
    roles: [CapitalAnalyst]
    code: 201
    input: [proposed_amount_cents, proposed_rate_bps, maturity_years, target_settlement_date]
    output: SubordinatedDebtIssuance
    side_effects: ["status = PROPOSED; compute initial t2_capacity_headroom_cents"]

  - method: GET
    path: "/banks/{bankId}/sub-debt-issuances/{issuanceId}"
    description: "Get a sub-debt issuance"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: []
    output: SubordinatedDebtIssuance
    side_effects: []

  - method: GET
    path: "/banks/{bankId}/sub-debt-issuances"
    description: "List sub-debt issuances"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "SubordinatedDebtIssuance[]"
    side_effects: []

  - method: POST
    path: "/banks/{bankId}/sub-debt-issuances/{issuanceId}/approve"
    description: "Approve a sub-debt issuance"
    roles: [CapitalAnalyst]
    code: 200
    input: [expected_bank_version]
    output: SubordinatedDebtIssuance
    side_effects: ["status → APPROVED; OCC check; T2 cap check; PCA gate; increments Bank.version by 1"]

  - method: POST
    path: "/banks/{bankId}/sub-debt-issuances/{issuanceId}/price"
    description: "Price an approved issuance"
    roles: [CapitalAnalyst]
    code: 200
    input: []
    output: SubordinatedDebtIssuance
    side_effects: ["status → PRICED"]

  - method: POST
    path: "/banks/{bankId}/sub-debt-issuances/{issuanceId}/settle"
    description: "Settle a priced issuance (creates CapitalInstrument)"
    roles: [CapitalAnalyst]
    code: 200
    input: []
    output: SubordinatedDebtIssuance
    side_effects: ["status → SETTLED; create CapitalInstrument; recompute T2 cap; increments Bank.version by 1"]

  - method: POST
    path: "/banks/{bankId}/sub-debt-issuances/{issuanceId}/withdraw"
    description: "Withdraw an issuance"
    roles: [CapitalAnalyst]
    code: 200
    input: []
    output: SubordinatedDebtIssuance
    side_effects: ["status → WITHDRAWN"]

  # --- PCAThresholdEvent ---
  - method: GET
    path: "/banks/{bankId}/pca-threshold-events"
    description: "List PCA threshold events for the bank"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "metric?", "breached?"]
    output: "PCAThresholdEvent[]"
    side_effects: []

  - method: GET
    path: "/banks/{bankId}/pca-threshold-events/{eventId}"
    description: "Get a PCA threshold event"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: []
    output: PCAThresholdEvent
    side_effects: []

  # --- ICAAPDocument ---
  - method: POST
    path: "/banks/{bankId}/icaap-documents"
    description: "Create an ICAAP document"
    roles: [CapitalAnalyst]
    code: 201
    input: [document_year, governing_capital_plan_id, sections]
    output: ICAAPDocument
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/banks/{bankId}/icaap-documents/{docId}"
    description: "Get an ICAAP document"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: []
    output: ICAAPDocument
    side_effects: []

  - method: GET
    path: "/banks/{bankId}/icaap-documents"
    description: "List ICAAP documents"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "status?", "document_year?"]
    output: "ICAAPDocument[]"
    side_effects: []

  - method: POST
    path: "/banks/{bankId}/icaap-documents/{docId}/submit_review"
    description: "Submit ICAAP for review"
    roles: [CapitalAnalyst]
    code: 200
    input: []
    output: ICAAPDocument
    side_effects: ["status → REVIEW; capture prepared_by_user_id"]

  - method: POST
    path: "/banks/{bankId}/icaap-documents/{docId}/attest"
    description: "Board attests ICAAP"
    roles: [BoardApprover]
    code: 200
    input: []
    output: ICAAPDocument
    side_effects: ["status → ATTESTED; set board_attested_by_user_id; segregation-of-duties check"]

  - method: POST
    path: "/banks/{bankId}/icaap-documents/{docId}/file"
    description: "File an attested ICAAP"
    roles: [CapitalAnalyst]
    code: 200
    input: [expected_bank_version]
    output: ICAAPDocument
    side_effects: ["status → FILED; supersedes prior FILED documents; OCC check; increments Bank.version by 1"]

  # =========================================================================
  # Flat (top-level) reverse-reachability GETs — every FK in §1.1 has both a
  # single-resource GET (/<collection>/{id}) AND a filtered list GET
  # (/<collection>?<fk_field>=...) at the top level. These complement the
  # nested paths above and are the canonical discovery channel for FK children.
  # =========================================================================

  # --- ReportingPeriod (child of Bank) ---
  - method: GET
    path: "/reporting-periods/{periodId}"
    description: "Flat single-resource GET on ReportingPeriod"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: []
    output: ReportingPeriod
    side_effects: []

  - method: GET
    path: "/reporting-periods"
    description: "Filtered list of ReportingPeriods"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "bank_id?", "status?", "period_year?"]
    output: "ReportingPeriod[]"
    side_effects: []

  # --- CapitalInstrument (child of Bank) ---
  - method: GET
    path: "/capital-instruments/{instrumentId}"
    description: "Flat single-resource GET on CapitalInstrument"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: []
    output: CapitalInstrument
    side_effects: []

  - method: GET
    path: "/capital-instruments"
    description: "Filtered list of CapitalInstruments"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "bank_id?", "instrument_class?", "status?"]
    output: "CapitalInstrument[]"
    side_effects: []

  # --- RiskExposure (child of Bank + ReportingPeriod) ---
  - method: GET
    path: "/risk-exposures/{exposureId}"
    description: "Flat single-resource GET on RiskExposure"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: []
    output: RiskExposure
    side_effects: []

  - method: GET
    path: "/risk-exposures"
    description: "Filtered list of RiskExposures (covers bank_id and reporting_period_id FKs)"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "bank_id?", "reporting_period_id?", "exposure_class?", "obligor_grade?"]
    output: "RiskExposure[]"
    side_effects: []

  # --- CapitalPlan (child of Bank, refs ReportingPeriod + StressScenario) ---
  - method: GET
    path: "/capital-plans/{planId}"
    description: "Flat single-resource GET on CapitalPlan"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: []
    output: CapitalPlan
    side_effects: []

  - method: GET
    path: "/capital-plans"
    description: "Filtered list of CapitalPlans"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "bank_id?", "baseline_period_id?", "stress_scenario_id?", "status?", "plan_year?"]
    output: "CapitalPlan[]"
    side_effects: []

  # --- StressScenario (child of Bank) ---
  - method: GET
    path: "/stress-scenarios/{scenarioId}"
    description: "Flat single-resource GET on StressScenario"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: []
    output: StressScenario
    side_effects: []

  - method: GET
    path: "/stress-scenarios"
    description: "Filtered list of StressScenarios"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "bank_id?", "status?"]
    output: "StressScenario[]"
    side_effects: []

  # --- CallReport (child of ReportingPeriod + Bank, self-FK supersedes_call_report_id) ---
  - method: GET
    path: "/call-reports/{reportId}"
    description: "Flat single-resource GET on CallReport"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: []
    output: CallReport
    side_effects: []

  - method: GET
    path: "/call-reports"
    description: "Filtered list of CallReports"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "bank_id?", "reporting_period_id?", "supersedes_call_report_id?", "status?"]
    output: "CallReport[]"
    side_effects: []

  # --- EditException (child of CallReport) ---
  - method: GET
    path: "/edit-exceptions/{editId}"
    description: "Flat single-resource GET on EditException"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: []
    output: EditException
    side_effects: []

  - method: GET
    path: "/edit-exceptions"
    description: "Filtered list of EditExceptions"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "call_report_id?", "status?", "severity?"]
    output: "EditException[]"
    side_effects: []

  # --- CapitalDistributionRequest (child of Bank + CapitalPlan + ReportingPeriod) ---
  - method: GET
    path: "/distribution-requests/{requestId}"
    description: "Flat single-resource GET on CapitalDistributionRequest"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: []
    output: CapitalDistributionRequest
    side_effects: []

  - method: GET
    path: "/distribution-requests"
    description: "Filtered list of CapitalDistributionRequests"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "bank_id?", "capital_plan_id?", "reporting_period_id?", "status?", "distribution_kind?"]
    output: "CapitalDistributionRequest[]"
    side_effects: []

  # --- SubordinatedDebtIssuance (child of Bank, refs CapitalInstrument) ---
  - method: GET
    path: "/sub-debt-issuances/{issuanceId}"
    description: "Flat single-resource GET on SubordinatedDebtIssuance"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: []
    output: SubordinatedDebtIssuance
    side_effects: []

  - method: GET
    path: "/sub-debt-issuances"
    description: "Filtered list of SubordinatedDebtIssuances"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "bank_id?", "capital_instrument_id?", "status?"]
    output: "SubordinatedDebtIssuance[]"
    side_effects: []

  # --- PCAThresholdEvent (child of Bank + CallReport) ---
  - method: GET
    path: "/pca-threshold-events/{eventId}"
    description: "Flat single-resource GET on PCAThresholdEvent"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: []
    output: PCAThresholdEvent
    side_effects: []

  - method: GET
    path: "/pca-threshold-events"
    description: "Filtered list of PCAThresholdEvents"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "bank_id?", "call_report_id?", "metric?", "breached?"]
    output: "PCAThresholdEvent[]"
    side_effects: []

  # --- ICAAPDocument (child of Bank + CapitalPlan) ---
  - method: GET
    path: "/icaap-documents/{docId}"
    description: "Flat single-resource GET on ICAAPDocument"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: []
    output: ICAAPDocument
    side_effects: []

  - method: GET
    path: "/icaap-documents"
    description: "Filtered list of ICAAPDocuments"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "bank_id?", "governing_capital_plan_id?", "status?", "document_year?"]
    output: "ICAAPDocument[]"
    side_effects: []

  # --- Bank filtered list with pca_bucket_as_of_period_id FK coverage ---
  # Bank.pca_bucket_as_of_period_id -> ReportingPeriod.id is a back-reference
  # from the parent onto its child. Reverse-reachability here means: given a
  # ReportingPeriod id, find Banks whose pca_bucket_as_of_period_id matches.
  - method: GET
    path: "/banks"
    description: "List Banks (extended with FK reverse-reachability filter)"
    roles: [SystemOperator, CapitalAnalyst, RegulatorReviewer, BoardApprover, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "charter_id?", "pca_bucket_as_of_period_id?"]
    output: "Bank[]"
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role valid but not authorized for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-templated id does not resolve to an existing entity within the parent scope" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Body malformed, required field missing, or value fails primitive type check" }
  - { id: ERR_INVALID_ENUM_VALUE, http: 422, condition: "Enum field contains value outside the declared set (e.g., exposure_class, period_quarter, instrument_class)" }
  - { id: ERR_INVALID_RISK_PARAMETER, http: 422, condition: "risk_weight_bps outside the allowable band for the exposure_class, or collateral_haircut_bps outside [0, 10000], or EAD <= 0" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Target entity is in a state where the requested transition is not permitted" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_bank_version does not match current Bank.version (OCC)" }
  - { id: ERR_CROSS_BANK_REFERENCE, http: 422, condition: "FK in request body refers to an entity owned by a different bank" }
  - { id: ERR_PCA_BLOCKS_DISTRIBUTION, http: 409, condition: "PCA bucket in {UNDERCAPITALIZED, SIGNIFICANTLY_UNDERCAPITALIZED, CRITICALLY_UNDERCAPITALIZED} blocks distribution approval/execution or instrument redemption" }
  - { id: ERR_PCA_BLOCKS_ISSUANCE, http: 409, condition: "PCA bucket blocks new sub-debt issuance approval" }
  - { id: ERR_PCA_BLOCKS_REDEMPTION, http: 409, condition: "PCA bucket or post-call T2 cap blocks instrument call/redeem" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 409, condition: "Submitter/attester X-User-ID equals the preparer X-User-ID captured earlier in the workflow" }
  - { id: ERR_INVARIANT_VIOLATION, http: 409, condition: "Single in-flight CapitalPlan violated, scenario_code collision, or active-scenario limit exceeded" }
  - { id: ERR_SCENARIO_LIMIT, http: 409, condition: "Bank already has MAX_ACTIVE_SCENARIOS (=2) scenarios in ACTIVE state" }
  - { id: ERR_SCENARIO_IN_USE, http: 409, condition: "StressScenario cannot be retired while referenced by an in-flight CapitalPlan" }
  - { id: ERR_TEMPORAL_VIOLATION, http: 409, condition: "Time-window violation: payment_date outside quarter, execute outside window, period close out of chronological order, maturity < 5 years" }
  - { id: ERR_MATURITY_TOO_SHORT, http: 409, condition: "Sub-debt maturity_years < 5" }
  - { id: ERR_T2_CAP_EXCEEDED, http: 409, condition: "Sub-debt approval or settlement would exceed 2% of RWA T2 cap" }
  - { id: ERR_DISTRIBUTION_EXCEEDS_MDBA, http: 409, condition: "Distribution approval would exceed mdba_cents - pending_distribution_cents" }
  - { id: ERR_DISTRIBUTION_NOT_YET_PAYABLE, http: 409, condition: "current_utc < proposed_payment_date at execute time" }
  - { id: ERR_PLAN_DISTRIBUTION_EXCEEDS_CAPACITY, http: 409, condition: "Plan's proposed distributions exceed mdba + approved sub-debt headroom at board_approve" }
  - { id: ERR_PLAN_FAILED_STRESS_FLOOR, http: 409, condition: "stressed_min_cet1_bps_9q < PCA_ADEQUATE_CET1_BPS + SCB at regulator_approve" }
  - { id: ERR_PLAN_NOT_FINAL, http: 409, condition: "ICAAP references a CapitalPlan not in APPROVED/EFFECTIVE (submit_review) or not EFFECTIVE (file)" }
  - { id: ERR_SECTION_MISSING, http: 422, condition: "ICAAP missing one or more required sections" }
  - { id: ERR_UNRESOLVED_EDITS, http: 409, condition: "Call report has open EditException rows blocking submit or accept" }
  - { id: ERR_EDIT_NOTE_REQUIRED, http: 422, condition: "resolution_note missing or empty for non-INFORMATIONAL edit" }
  - { id: ERR_AMENDMENT_LOCKED, http: 409, condition: "Cannot open amendment: a later ReportingPeriod for the same bank is already CLOSED" }
  - { id: ERR_NO_EXPOSURES, http: 409, condition: "Cannot prepare call report: no RiskExposure rows exist for the period" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "Generic capacity check failure (used by distribution approve / sub-debt approve / plan board_approve)" }
  - { id: ERR_INSTRUMENT_NOT_CALLABLE, http: 409, condition: "COMMON_STOCK instrument cannot be called or redeemed" }
  - { id: ERR_DUPLICATE_CHARTER_ID, http: 409, condition: "Bank with this charter_id already exists" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SystemOperator
    description: "Operational superuser; owns the logical clock and bank creation. Read-all on business entities."
    identity: opaque
    exclusive_operations:
      - "POST /banks"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /* (all read endpoints)"

  - name: CapitalAnalyst
    description: "Bank finance analyst; prepares call reports, drafts capital plans, proposes distributions, manages sub-debt lifecycle, prepares ICAAP"
    identity: opaque
    exclusive_operations:
      - "POST /banks/{id}/reporting-periods"
      - "POST /banks/{id}/capital-instruments"
      - "POST /banks/{id}/reporting-periods/{pid}/risk-exposures"
      - "POST /banks/{id}/reporting-periods/{pid}/call-reports"
      - "POST /banks/{id}/reporting-periods/{pid}/call-reports/{rid}/prepare"
      - "POST /banks/{id}/reporting-periods/{pid}/call-reports/{rid}/submit"
      - "POST /banks/{id}/reporting-periods/{pid}/call-reports/{rid}/open_amendment"
      - "POST /banks/{id}/reporting-periods/{pid}/call-reports/{rid}/edit-exceptions/{eid}/resolve"
      - "POST /banks/{id}/reporting-periods/{pid}/call-reports/{rid}/edit-exceptions/{eid}/explain"
      - "POST /banks/{id}/reporting-periods/{pid}/close"
      - "POST /banks/{id}/capital-instruments/{iid}/call"
