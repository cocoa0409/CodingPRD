            - call: "POST /farm-network/farms"
              payload: { name: "Oakhurst Pastures", region: "IA", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: NetworkManager
              captures: { f_id: $.data.id }
