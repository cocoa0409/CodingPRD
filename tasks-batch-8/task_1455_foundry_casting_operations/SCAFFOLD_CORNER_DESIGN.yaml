  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_sample_with_stale_heat_version_rejected
        claim_type: stale_version_conflict
        grounds: ["concurrency_rules[heat-sample-stale-heat]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on MeltHeat.version: after a successful sample advances version 2->3, a second sample submitted with the previously observed version 2 is rejected 412; the client must re-read and resubmit with the fresh version."
        test_recipe:
          setup: ["Heat CHARGING with 1000 kg charged (version 2)"]
          setup_api_calls:
            - { call: "POST /api/foundries", payload: { name: "F1" }, as: FoundryAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /api/equipment", payload: { foundry_id: "${f_id}", kind: "FURNACE", label: "Cupola-1", daily_tap_capacity_kg: 5000 }, as: FoundryAdmin, captures: { furn_id: $.data.id } }
            - { call: "POST /api/heats", payload: { foundry_id: "${f_id}", furnace_id: "${furn_id}", alloy_grade: "GJS-400-15", chemistry_spec: { elements: { C: { min: 3.2, max: 3.6 } } } }, as: MeltSupervisor, captures: { heat_id: $.data.id, heat_v: $.data.version } }
            - { call: "POST /api/heats/${heat_id}/charges", payload: { expected_heat_version: "${heat_v}", additions: [ { source: "VIRGIN", weight_kg: 1000, composition: { C: 3.40 } } ] }, as: MeltSupervisor, captures: { heat_v2: $.data.version } }
          trigger:
            - { call: "POST /api/heats/${heat_id}/samples", payload: { expected_heat_version: "${heat_v2}", reading: { C: 3.40 } }, as: Spectrographer, as_user_id: "spectro_1", captures: { ok: $.data.status } }
            - { call: "POST /api/heats/${heat_id}/samples", payload: { expected_heat_version: "${heat_v2}", reading: { C: 3.41 } }, as: Spectrographer, as_user_id: "spectro_2", captures: { err: $.data.error_id } }
          assert:
            - "First sample (expected version == 2, current) succeeds: CERTIFIED"
            - "Second sample carrying the stale version 2 is rejected: error_id == ERR_STALE_VERSION, http 412"
            - "Heat reading remains {C: 3.40} (stale writer's 3.41 never applied)"

      - name: occ_run_ops_with_stale_foundry_version_rejected
        claim_type: stale_version_conflict
        grounds: ["concurrency_rules[run-ops-stale-foundry]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Foundry.version: a run-ops carrying the version observed before a prior run-ops advanced the epoch is rejected 412."
        test_recipe:
          setup: ["Foundry at version 1 observed as f_v"]
          setup_api_calls:
            - { call: "POST /api/foundries", payload: { name: "F1" }, as: FoundryAdmin, captures: { f_id: $.data.id, f_v: $.data.version } }
          trigger:
            - { call: "POST /api/foundries/${f_id}/run-ops", payload: { expected_foundry_version: "${f_v}" }, as: FoundryAdmin, captures: { ok: $.data.ops_run_index } }
            - { call: "POST /api/foundries/${f_id}/run-ops", payload: { expected_foundry_version: "${f_v}" }, as: FoundryAdmin, captures: { err: $.data.error_id } }
          assert:
            - "First run-ops succeeds (ops_run_index == 1, version advanced to 2)"
            - "Second run-ops with the stale observed version 1 rejected: error_id == ERR_STALE_VERSION (412)"

      - name: cascading_side_effects_end_to_end
        claim_type: cascade_chain
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: "transitive_cascade / scrap_disposition_cascade_depth4"
          rationale: "The depth-4 SCRAP cascade and depth-3 sand quarantine cascade are asserted hop-by-hop in §1.8."

      - name: dual_variant_calculation_layer
        claim_type: variant_divergence
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: "dual_variant_calc / scrap_credit_provisional_vs_final_reconciles_lot"
          rationale: "Both dual-variant pairs (scrap credit; warranty credit) are asserted with literal divergent values in §1.8."

      - name: ops_run_checkpoint_layer
        claim_type: checkpoint_semantics
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / melt_heat_correction_cycle"
          rationale: "Checkpoint effects (cooling advance, slot expiry, heat pour-out, posture recompute) are asserted in state_machines corner instances run_ops_expires_stale_booked_slot and run_ops_cools_mold_at_exact_cooling_boundary."

