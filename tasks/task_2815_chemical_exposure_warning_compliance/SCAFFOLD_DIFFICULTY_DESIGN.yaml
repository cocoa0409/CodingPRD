            - "L0: ListedChemical.${chem_bpa}.safe_harbor_level_ug_per_day == 5.0 and revision_count == 1 and status == LISTED"
            - "L1: ExposureAssessment.${asmt_1}.daily_exposure_ug == 0.5 (unchanged), margin_ratio == 0.1, result == BELOW_SAFE_HARBOR, status == SUPERSEDED"
            - "L2: WarningDetermination.${det_1}.status == REVOKED"
            - "L3: WarningPlacement.${plc_1}.status == NON_COMPLIANT"
            - "L4: WarningDetermination.${det_1}.covered_channel_count == 0 and Product.${prod_1}.compliance_posture == EXPOSURE_UNKNOWN"

      - name: reformulation_verification_cascades_three_levels
        grounds:
          - state_machines.ReformulationProject.IN_PROGRESS_to_VERIFICATION
          - state_machines.MaterialChemical.VERIFIED_to_DECLARED
          - calculations.total_listed_chemical_load_ug
          - entities.ReformulationProject.fields.reduction_pct
          - validations[priority=58]
        distinguishing_aspect: |
          Cascade originates in a project row and travels the opposite direction from the registry
          case - downward into the bill of materials and back up: the link is rewritten from a
          VERIFIED lab value of 40.0 ppm to a DECLARED 4.0 ppm (losing its LAB_TESTED basis and its
          lab fields), which drops the product load from 10.000 to 1.000 ug, supersedes the FINAL
          assessment and revokes the warning, and only then is reduction_pct 90.00 stamped on the
          project.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED with MADL 0.5 ug/day."
            - "RM-100's Bisphenol A link is VERIFIED on measurement_basis LAB_TESTED with lab_result_ppm 40.0 and lab_loq_ppm 1.0; the material's disclosure_status is VERIFIED."
