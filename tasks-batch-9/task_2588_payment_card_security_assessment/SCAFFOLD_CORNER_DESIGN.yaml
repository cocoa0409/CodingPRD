            - "revise returns HTTP 200: RocReport.${roc_id}.status == DRAFTING, revision_count == 1, Engagement.${eng_id}.status == FIELDWORK and posture back to OPEN"
            - "The final attempt returns HTTP 422 with ${err_already_exists} == ERR_ROC_ALREADY_EXISTS - not ERR_INVALID_ENGAGEMENT_STATE, because FIELDWORK does permit the transition"
            - "GET /rocs?engagement_id=${eng_id} returns total_count 1 throughout and roc_version_label is still 'v1.0' - the refused call did not relabel the row"

