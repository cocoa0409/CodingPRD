            - call: "POST /alerts/zones"
              payload: { zone_code: "ZDLB", name: "Deadline Zone B", office_id: "${dl_off_b}", lat_min: 0.0, lat_max: 0.1, lon_min: 0.2, lon_max: 0.3, surveyed_area_sq_km: 123.21, population_tier: "LOW", coastal: false }
              as: PlatformAdmin
              captures: { dl_zb: $.data.id }
            - call: "POST /alerts/forecasters"
              payload: { office_id: "${dl_off_a}", full_name: "Drew A", employee_code: "EMP-DL", level: "SENIOR" }
              as: PlatformAdmin
              captures: { dl_fc: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alerts/products"
              payload: { product_level: "WATCH", hazard_type: "SEVERE_THUNDERSTORM", issuing_office_id: "${dl_off_a}", zone_ids: ["${dl_za}", "${dl_zb}"], effective_from: "2026-09-01T12:00:00Z", expires_at: "2026-09-01T20:00:00Z" }
              as: Forecaster
              as_user_id: "${dl_fc}"
              captures: { dl_w: $.data.id }
            - call: "POST /alerts/products/${dl_w}/submit-coordination"
              payload: {}
