  - section: validations
    instances:
      - name: reversed_and_equal_pour_cost_periods_return_invalid_period
        claim_type: Violation → Error
        grounds:
          - validations[priority 18].ERR_INVALID_PERIOD
          - validations[priority 63].ERR_NO_REVENUE_IN_PERIOD
        distinguishing_aspect: >-
          The window check is strict, so period_start == period_end is as invalid as a reversed pair,
          and because priority 18 sits above priority 63 a reversed window on a venue with no ledger
          history must answer ERR_INVALID_PERIOD rather than ERR_NO_REVENUE_IN_PERIOD. A well-formed
          but empty window then reaches 63, proving the two rules are ordered rather than merged.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z."
            - "One venue with no lots, no slots and no DepletionEntry rows at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/venues"
              payload: { name: "Harbor Room", venue_code: "HRB", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 } }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v1_id: $.data.id }
          trigger:
            - call: "GET /beverage-program/venues/${v1_id}/pour-cost-report"
              payload: { period_start: "2026-09-04T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: Controller
              as_user_id: "ctl-001"
            - call: "GET /beverage-program/venues/${v1_id}/pour-cost-report"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: Controller
              as_user_id: "ctl-001"
            - call: "GET /beverage-program/venues/${v1_id}/pour-cost-report"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-02T00:00:00Z" }
              as: Controller
              as_user_id: "ctl-001"
            - call: "POST /beverage-program/venues/${v1_id}/pour-cost-runs"
              payload: { period_start: "2026-09-04T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
          assert:
            - "the reversed window returns 422 with error_id ERR_INVALID_PERIOD, not ERR_NO_REVENUE_IN_PERIOD, even though the venue has no revenue either"
            - "the equal-bounds window also returns 422 ERR_INVALID_PERIOD — the check is strict \"<\", not \"<=\""
            - "the well-formed empty window returns 422 ERR_NO_REVENUE_IN_PERIOD, showing rule 63 is reachable once rule 18 is satisfied"
            - "the reversed window on POST /venues/{venue_id}/pour-cost-runs returns the same 422 ERR_INVALID_PERIOD — the rule is shared by both period consumers"
            - "no VarianceInvestigation was created and Venue.${v1_id}.last_pour_cost_run_at is still null after all four rejected or empty calls"
      - name: pagination_limit_and_offset_boundaries_on_distributor_listing
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority 15].ERR_INVALID_PAGINATION
          - endpoints["GET /beverage-program/distributors"]
        distinguishing_aspect: >-
          The declared range is limit 1..100 and offset >= 0, so limit 100 and offset 0 must succeed
          while limit 101, limit 0 and offset -1 must all be refused with the same error_id. The
          inclusive upper bound is the part an implementation typically gets wrong by rejecting 100.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z (default)."
            - "Two registered distributors."
          setup_api_calls:
            - call: "POST /beverage-program/distributors"
              payload: { name: "Coastal Selections", license_number: "LIC-0001", allocation_tier: "A" }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { d1_id: $.data.id }
            - call: "POST /beverage-program/distributors"
              payload: { name: "Inland Cellars", license_number: "LIC-0002", allocation_tier: "B" }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { d2_id: $.data.id }
          trigger:
            - call: "GET /beverage-program/distributors"
              payload: { limit: 100, offset: 0 }
              as: Controller
              as_user_id: "ctl-001"
            - call: "GET /beverage-program/distributors"
              payload: { limit: 1, offset: 1 }
              as: Controller
              as_user_id: "ctl-001"
            - call: "GET /beverage-program/distributors"
              payload: { limit: 101 }
              as: Controller
              as_user_id: "ctl-001"
            - call: "GET /beverage-program/distributors"
              payload: { limit: 0 }
              as: Controller
              as_user_id: "ctl-001"
            - call: "GET /beverage-program/distributors"
              payload: { offset: -1 }
              as: Controller
              as_user_id: "ctl-001"
          assert:
            - "limit 100 / offset 0 returns 200 with 2 rows, total_count 2 and has_more false — 100 is inside the range"
            - "limit 1 / offset 1 returns 200 with exactly 1 row, total_count 2 and has_more false (offset 1 + 1 row covers the 2 rows)"
            - "limit 101 returns 400 ERR_INVALID_PAGINATION"
            - "limit 0 returns 400 ERR_INVALID_PAGINATION — the lower bound is 1, not 0"
            - "offset -1 returns 400 ERR_INVALID_PAGINATION"
