      - name: compliance_leg_order_puts_overboarded_ahead_of_ownership_shortfall
        claim_type: correct_result
        grounds:
          - calculations.director_compliance_status
          - state_machines.Director.COMPLIANT_to_OVERBOARDED
          - entities.Director.fields.compliance_status
        distinguishing_aspect: |
          The leg order is fixed and first match wins. A director on four public boards satisfies
          external_public_board_count + 1 > 4 and also carries a FINALIZED award with ownership_compliant
          false past its five-year grace, yet must report OVERBOARDED; only after one directorship is ended
          - dropping the count to 3, where 3 + 1 == 4 is not greater than the limit - does the same director
          fall through to OWNERSHIP_SHORTFALL. The education leg is unreachable because the clock is
          2026-08-01, before the 2026-12-31 deadline.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 with default max_public_boards_default 4, ownership_grace_years 5 and ownership_multiple 5.0."
            - "One SEATED director appointed 2019-01-01, holding only 100 shares, on four public outside boards."
            - "A DRAFT full-year 2026 compensation award for that director."
