            - call: "POST /storm-events"
              payload: { name: "Moderate", severity: "MODERATE", forecast_start_at: "2026-02-10T00:00:00Z", forecast_end_at: "2026-02-12T00:00:00Z" }
              as: DispatchSupervisor
