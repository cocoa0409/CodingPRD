            - "i_status == REMOVED and bid_status == NOT_AWARDED (declared cancel fan-out)"
            - "n_status == DELINQUENT (cancel does NOT touch the referenced notice)"
            - "err == ERR_INVALID_BATCH_STATE (no transitions leave CANCELLED)"

      - name: returned_application_resubmit_cycle
        claim_type: valid_transition
        grounds:
          - state_machines.CostShareApplication.SUBMITTED_to_RETURNED
          - state_machines.CostShareApplication.RETURNED_to_SUBMITTED
          - state_machines.CostShareApplication.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          The revision cycle RETURNED -> SUBMITTED is traversable by the owning
          owner and the application remains decidable afterwards: RETURN ->
          resubmit -> SUBMITTED -> APPROVE lands APPROVED with
          approval_expires_at = approved_at + 60 days (2026-09-30T00:00:00Z at
          the default clock).
        test_recipe:
          setup:
            - "OPEN cycle; owner/parcel/defect; notice issued; application created (SUBMITTED)"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { cycle_year: 2026, window_start_date: "2026-01-01", window_end_date: "2026-12-31", appropriation_cents: 10000000 }, as: ProgramCoordinator, captures: { cycle_id: "$.data.id" } }
            - { call: "POST /property-owners", payload: { full_name: "Joy Jojoba", mailing_address: "61 Jojoba St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-S11", owner_id: "${owner_id}", street_address: "61 Jojoba St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-S11-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 20 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /cost-share-applications", payload: { notice_id: "${notice_id}", parcel_id: "${parcel_id}", cycle_id: "${cycle_id}", estimated_qty_sqft: 50 }, as: PropertyOwner, as_user_id: "${owner_id}", captures: { app_id: "$.data.id" } }
          trigger:
            - { call: "POST /cost-share-applications/${app_id}/decision", payload: { outcome: "RETURN", reviewer_note: "photo missing" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { r1: "$.data.review_status" } }
            - { call: "POST /cost-share-applications/${app_id}/resubmit", as: PropertyOwner, as_user_id: "${owner_id}", captures: { r2: "$.data.review_status" } }
            - { call: "POST /cost-share-applications/${app_id}/decision", payload: { outcome: "APPROVE" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { r3: "$.data.review_status", approved: "$.data.approved_at", expires: "$.data.approval_expires_at" } }
          assert:
            - "r1 == RETURNED then r2 == SUBMITTED (revision loop traversed)"
            - "r3 == APPROVED and approved == 2026-08-01T00:00:00Z and expires == 2026-09-30T00:00:00Z (approved_at + 60 days)"

      - name: inspection_pass_executes_side_effects
        claim_type: side_effect_execution
        grounds:
          - state_machines.RepairNotice.ISSUED_to_COMPLIANT
          - state_machines.Defect.UNDER_REPAIR_to_VERIFIED
          - state_machines.SidewalkSegment.UNDER_NOTICE_to_RESTORED
          - "endpoints.POST /repair-notices/{id}/inspections"
        distinguishing_aspect: |
          A PASS inspection by a non-recorder inspector lands every declared side
          effect: notice ISSUED -> COMPLIANT, covered defect UNDER_REPAIR ->
          VERIFIED, segment UNDER_NOTICE -> RESTORED once open_defect_count hits
          0, and an InspectionRecord is appended.
        test_recipe:
          setup:
            - "owner/parcel/segment with one defect; notice issued (defect UNDER_REPAIR, segment UNDER_NOTICE)"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Kip Karoo", mailing_address: "62 Karoo St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-S12", owner_id: "${owner_id}", street_address: "62 Karoo St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-S12-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 20 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
          trigger:
            - { call: "POST /repair-notices/${notice_id}/inspections", payload: { result: "PASS", notes: "work accepted" }, as: Inspector, as_user_id: "insp-2", captures: { rec_id: "$.data.id", rec_notice: "$.data.notice_id" } }
            - { call: "GET /repair-notices/${notice_id}", as: ProgramCoordinator, captures: { n_status: "$.data.status" } }
            - { call: "GET /defects/${defect_id}", as: ProgramCoordinator, captures: { d_status: "$.data.status" } }
            - { call: "GET /segments/${segment_id}", as: ProgramCoordinator, captures: { s_status: "$.data.status", s_odc: "$.data.open_defect_count" } }
          assert:
            - "rec_id is present and rec_notice == notice_id (record appended)"
            - "n_status == COMPLIANT"
            - "d_status == VERIFIED"
            - "s_status == RESTORED and s_odc == 0"

      - name: inspection_fail_before_deadline_records_only
        claim_type: precondition_enforcement
        grounds:
          - state_machines.RepairNotice.ISSUED_to_DELINQUENT
          - "endpoints.POST /repair-notices/{id}/inspections"
          - "endpoints.GET /repair-notices/{id}/inspections"
        distinguishing_aspect: |
          The FAIL -> DELINQUENT transition is gated on logical clock >
          compliance_deadline; a FAIL recorded before the deadline appends only
          the InspectionRecord (201) and leaves notice ISSUED and defect
          UNDER_REPAIR, and a later PASS still completes the notice.
        test_recipe:
          setup:
            - "owner/parcel/segment/defect; notice issued at default clock (deadline 2026-09-15T00:00:00Z); clock at 2026-08-10 (before deadline)"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Liv Linden", mailing_address: "63 Linden St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-S13", owner_id: "${owner_id}", street_address: "63 Linden St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-S13-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 20 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /repair-notices/${notice_id}/inspections", payload: { result: "FAIL", notes: "not started" }, as: Inspector, as_user_id: "insp-2", captures: { rec_result: "$.data.result" } }
            - { call: "GET /repair-notices/${notice_id}", as: ProgramCoordinator, captures: { n_status: "$.data.status" } }
            - { call: "GET /defects/${defect_id}", as: ProgramCoordinator, captures: { d_status: "$.data.status" } }
            - { call: "POST /repair-notices/${notice_id}/inspections", payload: { result: "PASS" }, as: Inspector, as_user_id: "insp-2" }
            - { call: "GET /repair-notices/${notice_id}/inspections", as: ProgramCoordinator, captures: { recs: "$.data" } }
          assert:
            - "rec_result == FAIL (record persisted with 201)"
            - "n_status == ISSUED and d_status == UNDER_REPAIR (no delinquency before the deadline)"
            - "len(recs) == 2 after the follow-up PASS (append-only log)"

      - name: lien_satisfaction_closes_notice
        claim_type: bubble_up
        grounds:
          - state_machines.LienCase.RECORDED_to_SATISFIED
          - state_machines.RepairNotice.LIENED_to_CLOSED
          - entities.PropertyParcel.fields.delinquency_flag
        distinguishing_aspect: |
          A single payment covering the full outstanding (550000 = principal
          550000 + interest 0 at day 0) drives the bubble-up: lien -> SATISFIED,
          the linked notice LIENED -> CLOSED, and the parcel delinquency_flag
          recomputes to false.
        test_recipe:
          setup:
            - "lien chain: notice swept, city-repair batch awarded and verified, lien created (actual 500000, principal 550000) and RECORDED at clock 2026-09-22 (day 0)"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Mel Mulberry", mailing_address: "64 Mulberry St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-S14", owner_id: "${owner_id}", street_address: "64 Mulberry St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-S14-1", length_ft: 10, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "VERTICAL_SEPARATION", measured_offset_inches: 0.75, area_sqft: 50 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /delinquency-sweeps", as: ProgramCoordinator }
            - { call: "POST /bid-batches", payload: { neighborhood_code: "NB-S14", work_window_start: "2026-09-21", work_window_end: "2026-10-05", bid_deadline: "2026-09-21T00:00:00Z" }, as: ProgramCoordinator, captures: { batch_id: "$.data.id" } }
            - { call: "POST /batch-work-items", payload: { batch_id: "${batch_id}", notice_id: "${notice_id}", scope_sqft: 50, engineer_unit_rate_cents: 1300 }, as: ProgramCoordinator, captures: { item_id: "$.data.id" } }
            - { call: "POST /bid-batches/${batch_id}/seal", as: ProgramCoordinator, captures: { batch_v: "$.data.version" } }
            - { call: "POST /contractors", payload: { company_name: "Acme Paving", license_number: "L-001", insurance_valid_until: "2026-12-31" }, as: ProgramCoordinator, captures: { contractor_id: "$.data.id" } }
            - { call: "POST /bids", payload: { batch_id: "${batch_id}", unit_rate_cents: 1100, ramp_flat_fee_cents: 0, expected_batch_version: "${batch_v}" }, as: Contractor, as_user_id: "${contractor_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-22T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /bid-batches/${batch_id}/award", as: ProgramCoordinator }
            - { call: "POST /bid-batches/${batch_id}/start-work", as: ProgramCoordinator }
            - { call: "POST /batch-work-items/${item_id}/complete", as: Contractor, as_user_id: "${contractor_id}" }
            - { call: "POST /batch-work-items/${item_id}/verify", as: Inspector, as_user_id: "insp-2" }
            - { call: "POST /lien-cases", payload: { notice_id: "${notice_id}", actual_repair_cost_cents: 500000 }, as: FinanceOfficer, as_user_id: "fin-1", captures: { lien_id: "$.data.id", principal: "$.data.owner_principal_cents" } }
            - { call: "POST /lien-cases/${lien_id}/record", as: FinanceOfficer, as_user_id: "fin-1" }
          trigger:
            - { call: "POST /lien-cases/${lien_id}/payments", payload: { amount_cents: 550000 }, as: PropertyOwner, as_user_id: "${owner_id}", captures: { l_status: "$.data.status", l_out: "$.data.outstanding_balance_cents", l_prin: "$.data.principal_remaining_cents" } }
            - { call: "GET /repair-notices/${notice_id}", as: ProgramCoordinator, captures: { n_status: "$.data.status" } }
            - { call: "GET /parcels/${parcel_id}", as: ProgramCoordinator, captures: { flag: "$.data.delinquency_flag" } }
