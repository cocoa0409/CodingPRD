          - state_machines.CleanRoomGrant.APPROVED_to_REVOKED
        distinguishing_aspect: |
          Category pair state vs business_safety: a query on a REVOKED grant
          whose result would also fall below MIN_CELL_SIZE fails with the
          state error ERR_GRANT_NOT_QUERYABLE, never reaching suppression
          evaluation.
        test_recipe:
