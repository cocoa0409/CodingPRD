            - "The Alternative A call returns 200 with screening_status == SCREENED_IN despite feasibility_score 35.00"
            - "ProposedAction.${act_id}.alternatives_screened_in_count == 1"

      - name: corner_error_alternative_stale_rejects_decision_selection
        claim_type: violation_to_error
        grounds: [errors.ERR_ALTERNATIVE_STALE, state_machines.Alternative.SCREENED_IN_to_STALE]
        distinguishing_aspect: "Staleness is a distinct refusal from a plain reference mismatch: Alternative B was SCREENED_IN and is untouched in the request, but adopting a second purpose and need statement pinned it to a superseded statement, so selecting it returns ERR_ALTERNATIVE_STALE."
        test_recipe:
          setup:
            - "The ERO-1 Ridgeline action had statement v1 ADOPTED and Alternative B SCREENED_IN against it."
            - "A second statement v2 has since been adopted, superseding v1."
          setup_api_calls:
            - *k_office
            - *k_action
            - *k_screen1
            - *k_adj_cleared
            - *k_classify
            - *k_pn1
            - *k_scope1
            - *k_get_act_v
            - *k_adopt
            - *k_alt_b
            - *k_screen_alt_b
            - call: "POST /proposed-actions/${act_id}/purpose-need-statements"
              payload: { purpose_text: "Reduce hazardous fuel loading and restore stand structure", need_text: "Revised fire behaviour modelling widens the treatment need", goal_codes: ["ACCESS", "SAFETY"] }
              as: NepaCoordinator
              captures: { pn2_id: $.data.id }
            - call: "GET /proposed-actions/${act_id}"
              payload: {}
              as: NepaCoordinator
              captures: { act_v2: $.data.version }
            - call: "POST /purpose-need-statements/${pn2_id}/adopt"
              payload: { expected_action_version: "${act_v2}" }
              as: ReviewingOfficial
          trigger:
            - call: "POST /decisions"
