  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: claim_validate_requires_settlement_claims_phase
        grounds:
          - state_machines.Claim.SUBMITTED_to_VALIDATED
          - state_machines.Settlement.NOTICE_OPEN_to_CLAIMS_OPEN
          - entities.Settlement.fields.status
        distinguishing_aspect: |
          Entity pair Claim->Settlement: a Claim may only transition SUBMITTED->
          VALIDATED while its owning Settlement.status is CLAIMS_OPEN or
          CLAIMS_CLOSED. (This instance establishes the dependency exists; the
          DISTRIBUTING/posture negative path is its corner counterpart.)
        test_recipe:
          setup:
            - "CLAIMS_OPEN settlement, one member, one SUBMITTED claim."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements"
              payload: { case_caption: "In re Dep1", gross_fund_cents: 100000, attorney_fee_cents: 0, admin_cost_cents: 0, distribution_method: "PRO_RATA", claim_filing_deadline: "2026-03-01T00:00:00Z", objection_deadline: "2026-02-01T00:00:00Z", cy_pres_floor_cents: 0 }
              as: SettlementAdmin
              captures: { s_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-notice"
              payload: {}
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/class-members"
              payload: { full_name: "M", email: "m@x.com", tin_on_file: true }
              as: ClaimsAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-claims"
              payload: {}
              as: SettlementAdmin
            - call: "POST /claims"
              payload: { settlement_id: "${s_id}", class_member_id: "${m_id}", claimed_loss_cents: 5000 }
              as: ClaimsAdministrator
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /claims/${c_id}/validate"
              payload: { recognized_loss_cents: 5000 }
              as: ClaimsReviewer
          assert:
            - "Claim.${c_id}.status == VALIDATED (settlement was CLAIMS_OPEN)"
            - "Claim.${c_id}.recognized_loss_cents == 5000"

      - name: optout_finalize_requires_member_has_no_active_claim
        grounds:
          - state_machines.OptOutRequest.REQUESTED_to_EFFECTIVE
          - validations[priority=11]
          - entities.Claim.fields.status
        distinguishing_aspect: |
          Entity pair OptOutRequest->Claim (a different pair from Claim->Settlement):
          an OptOutRequest may only transition REQUESTED->EFFECTIVE when the member
          has no non-REJECTED Claim; a member with a SUBMITTED claim blocks finalize
          with ERR_MEMBER_HAS_CLAIM.
        test_recipe:
          setup:
            - "CLAIMS_OPEN settlement, one member with a SUBMITTED claim AND a REQUESTED opt-out."
          setup_api_calls:
