          - errors[ERR_TOWER_NOT_FOUND]
        distinguishing_aspect: |
          BackhaulCircuit declares parent Tower, so a body FK pointing at an unused Tower id is
          refused at priority 6 with 404 ERR_TOWER_NOT_FOUND before any uniqueness check on
          circuit_ref runs - the same circuit_ref is still free afterwards.
        test_recipe:
          setup:
