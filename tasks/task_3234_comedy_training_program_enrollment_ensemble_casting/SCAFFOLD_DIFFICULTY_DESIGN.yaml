# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3234_comedy_training_program_enrollment_ensemble_casting
#
# Depth probe. 9 difficulty rules × 2 instances each = 18 instances.
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and replay-checks
# against §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (≥ 2 instances; different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: placement_credit_audition_bypass_vs_portfolio_review
        grounds:
          - calculations.placement_credit_variant
          - entities.PlacementEvaluation.fields.variant
          - entities.PlacementEvaluation.fields.prior_institution
        distinguishing_aspect: |
          Two PlacementEvaluations with identical target_level produce divergent
          decisions purely because of the variant selector: AUDITION_BYPASS
          (recognized institution) grants with portfolio_score=0; PORTFOLIO_REVIEW
          (unrecognized institution) denies with the same portfolio_score=0.
          The variant operates on the PlacementEvaluation entity domain.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Level L1 (no bypass flag) and L2 (allows_placement_bypass=true) exist. Two students s1 and s2."
          setup_api_calls:
            - &clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - &lvl1
              call: "POST /curriculum-levels"
              payload: { code: "L1", title: "Level 1", track: "IMPROV", sequence_index: 0, allows_placement_bypass: false }
              as: ProgramDirector
              captures: { lvl1_id: $.data.id }
            - &lvl2
              call: "POST /curriculum-levels"
              payload: { code: "L2", title: "Level 2", track: "IMPROV", sequence_index: 1, requires_level_code: "L1", allows_placement_bypass: true }
              as: ProgramDirector
              captures: { lvl2_id: $.data.id }
            - &stu1
              call: "POST /students"
              payload: { full_name: "Alice Bypass", email: "alice@x.com" }
              as: Registrar
              captures: { s1_id: $.data.id }
            - &stu2
              call: "POST /students"
              payload: { full_name: "Bob Portfolio", email: "bob@x.com" }
              as: Registrar
              captures: { s2_id: $.data.id }
            - &pe1
              call: "POST /placement-evaluations"
              payload: { student_id: "${s1_id}", target_level_id: "${lvl2_id}", track: "IMPROV", prior_institution: "UCB", portfolio_score: 0 }
              as: PlacementOfficer
              captures: { pe1_id: $.data.id }
            - &pe2
              call: "POST /placement-evaluations"
              payload: { student_id: "${s2_id}", target_level_id: "${lvl2_id}", track: "IMPROV", prior_institution: "Unknown School", portfolio_score: 0 }
              as: PlacementOfficer
              captures: { pe2_id: $.data.id }
            - call: "POST /placement-evaluations/${pe1_id}/begin-review"
              payload: {}
              as: PlacementOfficer
            - call: "POST /placement-evaluations/${pe2_id}/begin-review"
              payload: {}
              as: PlacementOfficer
          trigger:
            - call: "POST /placement-evaluations/${pe1_id}/grant"
              payload: {}
              as: PlacementOfficer
            - call: "POST /placement-evaluations/${pe2_id}/deny"
              payload: {}
              as: PlacementOfficer
          assert:
            - "PlacementEvaluation.${pe1_id}.variant == AUDITION_BYPASS"
            - "PlacementEvaluation.${pe1_id}.decision == GRANTED"
            - "PlacementEvaluation.${pe2_id}.variant == PORTFOLIO_REVIEW"
            - "PlacementEvaluation.${pe2_id}.decision == DENIED"
            - "Student.${s1_id}.placement_credit_codes contains \"L1\" and \"L2\""
            - "Student.${s2_id}.placement_credit_codes is empty"

      - name: tuition_refund_early_drop_vs_late_drop
        grounds:
          - calculations.tuition_refund
          - entities.TuitionInvoice.fields.refunded_cents
          - state_machines.Enrollment.CONFIRMED_to_DROPPED_EARLY
          - state_machines.Enrollment.CONFIRMED_to_DROPPED_LATE
        distinguishing_aspect: |
          Two identical invoices ($100.00 paid) produce divergent refund amounts
          purely because of which variant of tuition_refund fires: EARLY_DROP
          (current_utc <= drop_deadline) refunds 100% = $100.00; LATE_DROP with
          elapsed_fraction in [0.50, 0.75) refunds 25% = $25.00. The variant
          operates on the TuitionInvoice entity domain (distinct from
          PlacementEvaluation in the sibling instance).
        test_recipe:
          setup:
            - "Term 2027-Winter from 2027-01-05 to 2027-03-15 (69 days), drop_deadline 2027-01-12. Level L1, section capacity 4, tuition 10000 cents. Two students enrolled and confirmed with $100.00 paid each."
          setup_api_calls:
            - *clock
            - *lvl1
            - &term
              call: "POST /terms"
              payload: { name: "Winter 2027", start_utc: "2027-01-05T00:00:00Z", end_utc: "2027-03-15T00:00:00Z", drop_deadline_utc: "2027-01-12T00:00:00Z" }
              as: ProgramDirector
              captures: { term_id: $.data.id }
            - &instr
              call: "POST /instructors"
              payload: { display_name: "Teach", home_track: "IMPROV", certified_tracks: ["IMPROV"], max_weekly_hours: 20 }
              as: ProgramDirector
              captures: { instr_id: $.data.id }
            - call: "POST /terms/${term_id}/open-scheduling"
              payload: {}
              as: ProgramDirector
            - &sec
              call: "POST /sections"
              payload: { term_id: "${term_id}", level_id: "${lvl1_id}", instructor_id: "${instr_id}", capacity: 4, tuition_cents: 10000, weekly_hours: 3 }
              as: ProgramDirector
              captures: { sec_id: $.data.id, sec_v: $.data.version }
            - call: "POST /terms/${term_id}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - *stu1
            - *stu2
            - &enr1
              call: "POST /enrollments"
              payload: { student_id: "${s1_id}", section_id: "${sec_id}", expected_section_version: "${sec_v}" }
              as: Registrar
              captures: { enr1_id: $.data.id }
            - &sec_v_after_e1
              call: "GET /sections/${sec_id}"
              payload: {}
              as: Registrar
              captures: { sec_v1: $.data.version }
            - &enr2
              call: "POST /enrollments"
              payload: { student_id: "${s2_id}", section_id: "${sec_id}", expected_section_version: "${sec_v1}" }
              as: Registrar
              captures: { enr2_id: $.data.id }
            - call: "POST /enrollments/${enr1_id}/confirm"
              payload: {}
              as: Registrar
            - call: "POST /enrollments/${enr2_id}/confirm"
              payload: {}
              as: Registrar
            - &inv_list
              call: "GET /tuition-invoices"
              payload: { enrollment_id: "${enr1_id}" }
              as: FinanceOfficer
              captures: { inv1_id: "$.data[0].id" }
            - &inv2_list
              call: "GET /tuition-invoices"
              payload: { enrollment_id: "${enr2_id}" }
              as: FinanceOfficer
              captures: { inv2_id: "$.data[0].id" }
            - call: "POST /tuition-invoices/${inv1_id}/pay"
              payload: { amount_cents: 10000 }
              as: FinanceOfficer
            - call: "POST /tuition-invoices/${inv2_id}/pay"
              payload: { amount_cents: 10000 }
              as: FinanceOfficer
          trigger:
            # Drop enrollment 1 EARLY (clock <= drop_deadline 2027-01-12)
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-10T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /enrollments/${enr1_id}/drop"
              payload: {}
              as: Registrar
            # Advance clock so elapsed_fraction = (2027-02-20 - 2027-01-05) / 69 ≈ 0.667 -> LATE_DROP tier 0.25
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-20T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /enrollments/${enr2_id}/drop"
              payload: {}
              as: Registrar
          assert:
            - "Enrollment.${enr1_id}.status == DROPPED_EARLY"
            - "Enrollment.${enr2_id}.status == DROPPED_LATE"
            - "TuitionInvoice.${inv1_id}.status == REFUNDED"
            - "TuitionInvoice.${inv1_id}.refunded_cents == 10000"
            - "TuitionInvoice.${inv2_id}.status == REFUNDED"
            - "TuitionInvoice.${inv2_id}.refunded_cents == 2500"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (≥ 2 instances; different modes a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: ensemble_composite_score_weighted_multi_input
        grounds:
          - calculations.ensemble_composite_score
          - entities.Audition.fields.rubric_scores
          - entities.Audition.fields.composite_score
        distinguishing_aspect: |
          Mode (a): 4-input weighted formula with non-linear tiered interaction —
          missing dimensions contribute 0 (conditional branch on input presence),
          the 0.4/0.25/0.2/0.15 weights select non-uniform contribution tiers,
          and the score is rounded half_up at exactly 2 decimal places. Audition
          with scores {scene_work:8, characters:7, musicality:9, game:6} yields
          0.4*8 + 0.25*7 + 0.2*9 + 0.15*6 = 3.2+1.75+1.8+0.9 = 7.65; another
          with missing `game` (defaults 0) yields 6.75.
        test_recipe:
          setup:
            - "Two students s1, s2. Two SCHEDULED auditions a1 (full rubric) and a2 (missing game dimension)."
          setup_api_calls:
            - *clock
            - *stu1
            - *stu2
            - &aud1
              call: "POST /auditions"
              payload: { student_id: "${s1_id}", target_kind: "ENSEMBLE", rubric_scores: { scene_work: 8, characters: 7, musicality: 9, game: 6 } }
              as: CastingDirector
              captures: { a1_id: $.data.id }
            - &aud2
              call: "POST /auditions"
              payload: { student_id: "${s2_id}", target_kind: "ENSEMBLE", rubric_scores: { scene_work: 8, characters: 7, musicality: 9 } }
              as: CastingDirector
              captures: { a2_id: $.data.id }
          trigger:
            - call: "POST /auditions/${a1_id}/evaluate"
              payload: {}
              as: CastingDirector
            - call: "POST /auditions/${a2_id}/evaluate"
              payload: {}
              as: CastingDirector
          assert:
            - "Audition.${a1_id}.composite_score == 7.65"
            - "Audition.${a2_id}.composite_score == 6.75"
            - "Audition.${a1_id}.outcome == EVALUATED"
            - "Audition.${a2_id}.outcome == EVALUATED"

      - name: tuition_balance_evaluation_order_circular
        grounds:
          - calculations.tuition_balance
          - entities.TuitionInvoice.fields.amount_due_cents
          - entities.TuitionInvoice.fields.scholarship_applied_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — amount_due = base - scholarship
          - paid + refund, but scholarship_applied depends on which invoices are
          outstanding, which depends on amount_due. The scaffold pins evaluation
          order: (1) FIFO scholarship disbursement by award.created_at, (2)
          paid subtraction, (3) refund adjustment. Invoice for $50.00 with one
          $20.00 NEED_BASED award and one $15.00 DIVERSITY award ends with
          scholarship_applied=3500 (FIFO by award creation), amount_due=1500.
        test_recipe:
          setup:
            - "Student s1 with two AWARDED scholarships: NEED_BASED $20 (created first), DIVERSITY $15 (created second). Level L1, section sec with tuition_cents=5000, enrollment confirmed."
          setup_api_calls:
            - *clock
            - *lvl1
            - *term
            - *instr
            - call: "POST /terms/${term_id}/open-scheduling"
              payload: {}
              as: ProgramDirector
            - &sec2
              call: "POST /sections"
              payload: { term_id: "${term_id}", level_id: "${lvl1_id}", instructor_id: "${instr_id}", capacity: 4, tuition_cents: 5000, weekly_hours: 3 }
              as: ProgramDirector
              captures: { sec2_id: $.data.id, sec2_v: $.data.version }
            - call: "POST /terms/${term_id}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - *stu1
            - &sch1
              call: "POST /scholarships"
              payload: { student_id: "${s1_id}", kind: "NEED_BASED", amount_cents: 2000 }
              as: FinanceOfficer
              captures: { sch1_id: $.data.id }
            - &sch2
              call: "POST /scholarships"
              payload: { student_id: "${s1_id}", kind: "DIVERSITY", amount_cents: 1500 }
              as: FinanceOfficer
              captures: { sch2_id: $.data.id }
            - call: "POST /scholarships/${sch1_id}/award"
              payload: {}
              as: FinanceOfficer
            - call: "POST /scholarships/${sch2_id}/award"
              payload: {}
              as: FinanceOfficer
            - &enr
              call: "POST /enrollments"
              payload: { student_id: "${s1_id}", section_id: "${sec2_id}", expected_section_version: "${sec2_v}" }
              as: Registrar
              captures: { enr_id: $.data.id }
          trigger:
            - call: "GET /tuition-invoices"
              payload: { enrollment_id: "${enr_id}" }
              as: FinanceOfficer
              captures: { inv_id: "$.data[0].id" }
          assert:
            - "TuitionInvoice.${inv_id}.base_amount_cents == 5000"
            - "TuitionInvoice.${inv_id}.scholarship_applied_cents == 3500"
            - "TuitionInvoice.${inv_id}.amount_due_cents == 1500"
            - "ScholarshipAward.${sch1_id}.disbursed_cents == 2000"
            - "ScholarshipAward.${sch2_id}.disbursed_cents == 1500"
            - "ScholarshipAward.${sch1_id}.status == DISBURSED"
            - "ScholarshipAward.${sch2_id}.status == DISBURSED"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (≥ 2 instances; different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: placement_evaluation_appeal_cycle
        grounds:
          - state_machines.PlacementEvaluation.DENIED_to_APPEALED
          - state_machines.PlacementEvaluation.APPEALED_to_UNDER_REVIEW
        distinguishing_aspect: |
          PlacementEvaluation has a cycle DENIED → APPEALED → UNDER_REVIEW →
          GRANTED, exercised by an appeal path. The cycle distinguishes this
          from a linear SUBMITTED → ... → GRANTED pipeline; without it the
          appeal transition would have to recreate state.
        test_recipe:
          setup:
            - "Student s2 with PORTFOLIO_REVIEW evaluation (portfolio_score=40, below threshold 70) initially DENIED."
          setup_api_calls:
            - *clock
            - *lvl1
            - *lvl2
            - *stu2
            - &pe_appeal
              call: "POST /placement-evaluations"
              payload: { student_id: "${s2_id}", target_level_id: "${lvl2_id}", track: "IMPROV", prior_institution: "Unknown School", portfolio_score: 40 }
              as: PlacementOfficer
              captures: { pe_a_id: $.data.id }
            - call: "POST /placement-evaluations/${pe_a_id}/begin-review"
              payload: {}
              as: PlacementOfficer
            - call: "POST /placement-evaluations/${pe_a_id}/deny"
              payload: {}
              as: PlacementOfficer
          trigger:
            - call: "POST /placement-evaluations/${pe_a_id}/appeal"
              payload: {}
              as: Student
              as_user_id: "${s2_id}"
            - call: "POST /placement-evaluations/${pe_a_id}/begin-review"
              payload: {}
              as: PlacementOfficer
          assert:
            - "after appeal: PlacementEvaluation.${pe_a_id}.decision == APPEALED"
            - "after begin-review: PlacementEvaluation.${pe_a_id}.decision == UNDER_REVIEW"
            - "a second begin-review on an UNDER_REVIEW evaluation returns ERR_INVALID_STATE"

      - name: enrollment_branching_with_revert_via_waitlist_promotion
        grounds:
          - state_machines.Enrollment.WAITLISTED_to_REGISTERED
          - state_machines.Enrollment.CONFIRMED_to_DROPPED_EARLY
          - calculations.seat_allocation
        distinguishing_aspect: |
          Enrollment has branching paths REGISTERED → CONFIRMED → DROPPED_EARLY
          vs REGISTERED → WAITLISTED → REGISTERED (revert). The revert is driven
          by seat_allocation when a CONFIRMED neighbor drops, demonstrating
          sibling-state-dependent transitions on the Enrollment entity (distinct
          from PlacementEvaluation in the sibling instance).
        test_recipe:
          setup:
            - "Section with capacity=1. s1 enrolled CONFIRMED. s2 attempted enroll → WAITLISTED. Clock before drop_deadline."
          setup_api_calls:
            - *clock
            - *lvl1
            - *term
            - *instr
            - call: "POST /terms/${term_id}/open-scheduling"
              payload: {}
              as: ProgramDirector
            - &sec_cap1
              call: "POST /sections"
              payload: { term_id: "${term_id}", level_id: "${lvl1_id}", instructor_id: "${instr_id}", capacity: 1, tuition_cents: 10000, weekly_hours: 3 }
              as: ProgramDirector
              captures: { sec_c1_id: $.data.id, sec_c1_v: $.data.version }
            - call: "POST /terms/${term_id}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - *stu1
            - *stu2
            - &enr_a
              call: "POST /enrollments"
              payload: { student_id: "${s1_id}", section_id: "${sec_c1_id}", expected_section_version: "${sec_c1_v}" }
              as: Registrar
              captures: { enr_a_id: $.data.id }
            - call: "POST /enrollments/${enr_a_id}/confirm"
              payload: {}
              as: Registrar
            - &sec_c1_v_after
              call: "GET /sections/${sec_c1_id}"
              payload: {}
              as: Registrar
              captures: { sec_c1_v2: $.data.version }
            - &enr_b
              call: "POST /enrollments"
              payload: { student_id: "${s2_id}", section_id: "${sec_c1_id}", expected_section_version: "${sec_c1_v2}" }
              as: Registrar
              captures: { enr_b_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_a_id}/drop"
              payload: {}
              as: Registrar
          assert:
            - "before drop: Enrollment.${enr_b_id}.status == WAITLISTED"
            - "after drop: Enrollment.${enr_a_id}.status == DROPPED_EARLY"
            - "after drop: Enrollment.${enr_b_id}.status == REGISTERED (promoted by seat_allocation)"
            - "after drop: CourseSection.${sec_c1_id}.enrolled_count == 0"
            - "after drop: CourseSection.${sec_c1_id}.waitlist_count == 0"

  # ===========================================================================
  # Rule 4 — transitive_cascade (≥ 2 instances; different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: term_close_cascade_section_enrollment_student
        grounds:
          - state_machines.Term.IN_SESSION_to_CLOSED
          - state_machines.CourseSection.RUNNING_to_COMPLETED
          - state_machines.Enrollment.COMPLETED_to_CREDITED
          - entities.Student.fields.is_alumni
        distinguishing_aspect: |
          Depth-3 cascade from POST /terms/{id}/close: Term closes → CourseSection
          RUNNING → COMPLETED → Enrollment COMPLETED → CREDITED (because
          level.showcase_required=false) → Student.completed_level_codes updated
          AND Student.is_alumni flips to true. Each hop is caused by the prior
          hop's mutation, not by the original POST.
        test_recipe:
          setup:
            - "Term in IN_SESSION. Section RUNNING (capacity == enrolled_count == 1). Enrollment CONFIRMED. Level L1 with showcase_required=false."
          setup_api_calls:
            - *clock
            - *lvl1
            - *term
            - *instr
            - call: "POST /terms/${term_id}/open-scheduling"
              payload: {}
              as: ProgramDirector
            - *sec_cap1
            - call: "POST /terms/${term_id}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - *stu1
            - *enr_a
            - call: "POST /enrollments/${enr_a_id}/confirm"
              payload: {}
              as: Registrar
            - call: "POST /terms/${term_id}/start-session"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /terms/${term_id}/close"
              payload: {}
              as: ProgramDirector
          assert:
            - "Term.${term_id}.status == CLOSED"
            - "CourseSection.${sec_c1_id}.status == COMPLETED"
            - "Enrollment.${enr_a_id}.status == CREDITED"
            - "Student.${s1_id}.completed_level_codes contains \"L1\""
            - "Student.${s1_id}.is_alumni == true"

      - name: showcase_stage_cascade_enrollment_credit_alumni
        grounds:
          - state_machines.ShowcaseEvent.SCHEDULED_to_STAGED
          - state_machines.Enrollment.COMPLETED_to_CREDITED
          - entities.Student.fields.completed_level_codes
          - entities.VenueSlot.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from POST /showcases/{id}/stage with grade PASS:
          ShowcaseEvent SCHEDULED → STAGED → triggers Enrollment COMPLETED →
          CREDITED (with completed_level_codes updated and is_alumni flipped)
          AND VenueSlot RESERVED → BOOKED. Distinct trigger from the sibling
          (POST /terms/close).
        test_recipe:
          setup:
            - "Level L1S with showcase_required=true. Term CLOSED, section COMPLETED, enrollment COMPLETED. ShowcaseEvent SCHEDULED on a RESERVED VenueSlot."
          setup_api_calls:
            - *clock
            - &lvl1s
              call: "POST /curriculum-levels"
              payload: { code: "L1S", title: "Level 1 Showcase", track: "IMPROV", sequence_index: 0, showcase_required: true }
              as: ProgramDirector
              captures: { lvl1s_id: $.data.id }
            - *term
            - *instr
            - call: "POST /terms/${term_id}/open-scheduling"
              payload: {}
              as: ProgramDirector
            - &sec_l1s
              call: "POST /sections"
              payload: { term_id: "${term_id}", level_id: "${lvl1s_id}", instructor_id: "${instr_id}", capacity: 1, tuition_cents: 10000, weekly_hours: 3 }
              as: ProgramDirector
              captures: { sec_l1s_id: $.data.id, sec_l1s_v: $.data.version }
            - call: "POST /terms/${term_id}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - *stu1
            - &enr_l1s
              call: "POST /enrollments"
              payload: { student_id: "${s1_id}", section_id: "${sec_l1s_id}", expected_section_version: "${sec_l1s_v}" }
              as: Registrar
              captures: { enr_l1s_id: $.data.id }
            - call: "POST /enrollments/${enr_l1s_id}/confirm"
              payload: {}
              as: Registrar
            - call: "POST /terms/${term_id}/start-session"
              payload: {}
              as: ProgramDirector
            - call: "POST /terms/${term_id}/close"
              payload: {}
              as: ProgramDirector
            # Closing auto-created a ShowcaseEvent in PLANNED status; find it
            - &sc_list
              call: "GET /showcases"
              payload: { level_id: "${lvl1s_id}", term_id: "${term_id}" }
              as: ProgramDirector
              captures: { sc_id: "$.data[0].id" }
            - &vs
              call: "POST /venue-slots"
              payload: { venue_name: "Mainstage", start_utc: "2027-04-01T19:00:00Z", end_utc: "2027-04-01T21:00:00Z", capacity: 200 }
              as: ProgramDirector
              captures: { vs_id: $.data.id }
            - &sc_manual
              call: "POST /showcases"
              payload: { level_id: "${lvl1s_id}", term_id: "${term_id}", venue_slot_id: "${vs_id}", performer_enrollment_ids: ["${enr_l1s_id}"] }
              as: ProgramDirector
              captures: { sc_man_id: $.data.id }
            - call: "POST /showcases/${sc_man_id}/schedule"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /showcases/${sc_man_id}/stage"
              payload: { grade_by_enrollment: { "${enr_l1s_id}": "PASS" } }
              as: ProgramDirector
          assert:
            - "ShowcaseEvent.${sc_man_id}.status == STAGED"
            - "VenueSlot.${vs_id}.status == BOOKED"
            - "Enrollment.${enr_l1s_id}.status == CREDITED"
            - "Student.${s1_id}.completed_level_codes contains \"L1S\""
            - "Student.${s1_id}.is_alumni == true"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (≥ 2 instances; different pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_prerequisite_enroll_into_terminal_section
        grounds:
          - validations.priority_4_state
          - validations.priority_6_business_safety
          - errors.ERR_INVALID_STATE
          - errors.ERR_PREREQUISITE_NOT_MET
        distinguishing_aspect: |
          Category pair `state` (priority 4) vs `business_safety` (priority 6):
          enrolling into a CANCELLED section while ALSO lacking the level's
          prerequisites must return ERR_INVALID_STATE (priority 4 wins), not
          ERR_PREREQUISITE_NOT_MET (priority 6).
        test_recipe:
          setup:
            - "Section CANCELLED. Student has no L1 credit."
          setup_api_calls:
            - *clock
            - *lvl1
            - *lvl2
            - *term
            - *instr
            - call: "POST /terms/${term_id}/open-scheduling"
              payload: {}
              as: ProgramDirector
            - &sec_cxl
              call: "POST /sections"
              payload: { term_id: "${term_id}", level_id: "${lvl2_id}", instructor_id: "${instr_id}", capacity: 2, tuition_cents: 10000, weekly_hours: 3 }
              as: ProgramDirector
              captures: { sec_cxl_id: $.data.id, sec_cxl_v: $.data.version }
            - call: "POST /sections/${sec_cxl_id}/cancel"
              payload: {}
              as: ProgramDirector
            - *stu1
          trigger:
            - call: "POST /enrollments"
              payload: { student_id: "${s1_id}", section_id: "${sec_cxl_id}", expected_section_version: "${sec_cxl_v}" }
              as: Registrar
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409"
            - "error_id == ERR_INVALID_STATE (state beats business_safety)"
            - "error_id != ERR_PREREQUISITE_NOT_MET"
            - "error_id != ERR_STALE_VERSION"

      - name: prerequisite_vs_section_full_enroll_blocks
        grounds:
          - validations.priority_6_business_safety
          - validations.priority_11_business_fiscal
          - errors.ERR_PREREQUISITE_NOT_MET
          - errors.ERR_SECTION_FULL
        distinguishing_aspect: |
          Category pair `business_safety` (priority 6) vs `business_fiscal`
          (priority 11): student without L1 credit attempts to enroll into a
          FULL L2 section → must return ERR_PREREQUISITE_NOT_MET (priority 6
          wins), not ERR_SECTION_FULL.
        test_recipe:
          setup:
            - "L2 section OPEN with enrolled_count == capacity. Student s2 has no L1 credit."
          setup_api_calls:
            - *clock
            - *lvl1
            - *lvl2
            - *term
            - *instr
            - call: "POST /terms/${term_id}/open-scheduling"
              payload: {}
              as: ProgramDirector
            - *sec_cap1
            - call: "POST /terms/${term_id}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - *stu1
            - *stu2
            # Fill the L2 section with s1 (who has placement credit for L2 → L1 covered)
            - &pe_l2
              call: "POST /placement-evaluations"
              payload: { student_id: "${s1_id}", target_level_id: "${lvl2_id}", track: "IMPROV", prior_institution: "UCB", portfolio_score: 0 }
              as: PlacementOfficer
              captures: { pe_l2_id: $.data.id }
            - call: "POST /placement-evaluations/${pe_l2_id}/begin-review"
              payload: {}
              as: PlacementOfficer
            - call: "POST /placement-evaluations/${pe_l2_id}/grant"
              payload: {}
              as: PlacementOfficer
            - &sec_cap1_v
              call: "GET /sections/${sec_c1_id}"
              payload: {}
              as: Registrar
              captures: { sec_cap1_v_now: $.data.version }
            - &enr_x
              call: "POST /enrollments"
              payload: { student_id: "${s1_id}", section_id: "${sec_c1_id}", expected_section_version: "${sec_cap1_v_now}" }
              as: Registrar
              captures: { enr_x_id: $.data.id }
            - call: "POST /enrollments/${enr_x_id}/confirm"
              payload: {}
              as: Registrar
            - &sec_cap1_v2
              call: "GET /sections/${sec_c1_id}"
              payload: {}
              as: Registrar
              captures: { sec_cap1_v_after: $.data.version }
          trigger:
            - call: "POST /enrollments"
              payload: { student_id: "${s2_id}", section_id: "${sec_c1_id}", expected_section_version: "${sec_cap1_v_after}" }
              as: Registrar
              captures: { err_id2: $.data.error_id }
          assert:
            - "the response status is 422"
            - "error_id == ERR_PREREQUISITE_NOT_MET (priority 6 beats priority 11)"
            - "error_id != ERR_SECTION_FULL"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (≥ 2 instances; different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: drop_deadline_boundary_at_exactly_deadline
        grounds:
          - calculations.tuition_refund
          - validations.priority_5_business_temporal
          - state_machines.Enrollment.CONFIRMED_to_DROPPED_EARLY
        distinguishing_aspect: |
          Numeric threshold boundary: current_utc == drop_deadline_utc must be
          treated as EARLY (refund 100%, <= semantics). One microsecond after
          must become LATE. Metric: timestamp comparison; endpoint:
          POST /enrollments/{id}/drop.
        test_recipe:
          setup:
            - "Enrollment CONFIRMED, paid 10000. Clock set to exactly Term.drop_deadline_utc."
          setup_api_calls:
            - *clock
            - *lvl1
            - *term
            - *instr
            - call: "POST /terms/${term_id}/open-scheduling"
              payload: {}
              as: ProgramDirector
            - *sec_cap1
            - call: "POST /terms/${term_id}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - *stu1
            - *enr_a
            - call: "POST /enrollments/${enr_a_id}/confirm"
              payload: {}
              as: Registrar
            - *inv_list
            - call: "POST /tuition-invoices/${inv1_id}/pay"
              payload: { amount_cents: 10000 }
              as: FinanceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-12T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /enrollments/${enr_a_id}/drop"
              payload: {}
              as: Registrar
          assert:
            - "Enrollment.${enr_a_id}.status == DROPPED_EARLY (boundary is INCLUSIVE of deadline)"
            - "TuitionInvoice.${inv1_id}.refunded_cents == 10000"

      - name: section_capacity_boundary_full_at_exactly_capacity
        grounds:
          - entities.CourseSection.fields.capacity
          - calculations.seat_allocation
          - errors.ERR_SECTION_FULL
        distinguishing_aspect: |
          Empty-set / count boundary: enrolled_count == capacity (not
          capacity+1) marks the section full. Attempting a REGISTERED→CONFIRMED
          when enrolled_count == capacity must be rejected. Metric: integer
          count equality; endpoint: POST /enrollments/{id}/confirm (distinct
          endpoint from the sibling).
        test_recipe:
          setup:
            - "Section capacity=1, s1 already CONFIRMED. s2 REGISTERED (was admitted before section filled)."
          setup_api_calls:
            - *clock
            - *lvl1
            - *term
            - *instr
            - call: "POST /terms/${term_id}/open-scheduling"
              payload: {}
              as: ProgramDirector
            - *sec_cap1
            - call: "POST /terms/${term_id}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - *stu1
            - *stu2
            - *enr_a
            - *sec_c1_v_after
            - *enr_b
            - call: "POST /enrollments/${enr_a_id}/confirm"
              payload: {}
              as: Registrar
            # Promote s2 from WAITLISTED to REGISTERED by dropping s1, then re-register s1
            - call: "POST /enrollments/${enr_a_id}/drop"
              payload: {}
              as: Registrar
            # Now s2 is REGISTERED. Re-enroll s1 (will go REGISTERED since section has vacancy).
            - &sec_c1_v3
              call: "GET /sections/${sec_c1_id}"
              payload: {}
              as: Registrar
              captures: { sec_c1_v_final: $.data.version }
            - &enr_a2
              call: "POST /enrollments"
              payload: { student_id: "${s1_id}", section_id: "${sec_c1_id}", expected_section_version: "${sec_c1_v_final}" }
              as: Registrar
              captures: { enr_a2_id: $.data.id }
            # Confirm s2 first to fill the section
            - call: "POST /enrollments/${enr_b_id}/confirm"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /enrollments/${enr_a2_id}/confirm"
              payload: {}
              as: Registrar
              captures: { err_full: $.data.error_id }
          assert:
            - "the response status is 409"
            - "error_id == ERR_SECTION_FULL"
            - "CourseSection.${sec_c1_id}.enrolled_count == 1 (capacity exactly reached)"
            - "Enrollment.${enr_a2_id}.status == REGISTERED (unchanged)"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (≥ 2 instances; different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: term_open_enrollment_gates_section_draft_to_open
        grounds:
          - state_machines.Term.SCHEDULING_to_ENROLLMENT_OPEN
          - state_machines.CourseSection.DRAFT_to_OPEN
          - entities.CourseSection.fields.instructor_id
        distinguishing_aspect: |
          Entity pair Term × CourseSection: Term cannot leave SCHEDULING while
          any non-CANCELLED section has instructor_id null. Cross-entity gate
          of the parent on child state.
        test_recipe:
          setup:
            - "Term SCHEDULING. Section sec_a with instructor, section sec_b without instructor."
          setup_api_calls:
            - *clock
            - *lvl1
            - *term
            - *instr
            - call: "POST /terms/${term_id}/open-scheduling"
              payload: {}
              as: ProgramDirector
            - &sec_a
              call: "POST /sections"
              payload: { term_id: "${term_id}", level_id: "${lvl1_id}", instructor_id: "${instr_id}", capacity: 2, tuition_cents: 10000, weekly_hours: 3 }
              as: ProgramDirector
              captures: { sec_a_id: $.data.id }
            - &sec_b
              call: "POST /sections"
              payload: { term_id: "${term_id}", level_id: "${lvl1_id}", capacity: 2, tuition_cents: 10000, weekly_hours: 3 }
              as: ProgramDirector
              captures: { sec_b_id: $.data.id }
          trigger:
            - call: "POST /terms/${term_id}/open-enrollment"
              payload: {}
              as: ProgramDirector
              captures: { err_unstaff: $.data.error_id }
          assert:
            - "the response status is 409"
            - "error_id == ERR_SECTION_UNSTAFFED"
            - "Term.${term_id}.status == SCHEDULING (unchanged)"
            - "CourseSection.${sec_a_id}.status == DRAFT (unchanged)"

      - name: ensemble_lock_cast_gates_on_venue_slot_booked
        grounds:
          - state_machines.EnsembleCast.CASTING_to_REHEARSING
          - entities.VenueSlot.fields.status
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          Entity pair EnsembleCast × VenueSlot: lock-cast requires the opening
          night's VenueSlot to be in BOOKED state (not RESERVED, not AVAILABLE).
          Cross-entity gate of cast transition on slot state (distinct pair
          from the sibling).
        test_recipe:
          setup:
            - "EnsembleCast in CASTING with cast_size=1 understudy_slots=0. principal_ids has 1 student (already cast). VenueSlot is RESERVED (not BOOKED)."
          setup_api_calls:
            - *clock
            - *vs
            - &cast
              call: "POST /ensemble-casts"
              payload: { revue_title: "Revue X", venue_slot_id: "${vs_id}", cast_size: 1, understudy_slots: 0, source_policy: "OPEN_CALL" }
              as: CastingDirector
              captures: { cast_id: $.data.id }
            - *stu1
            - &aud_e
              call: "POST /auditions"
              payload: { student_id: "${s1_id}", target_kind: "ENSEMBLE", ensemble_cast_id: "${cast_id}", rubric_scores: { scene_work: 9, characters: 9, musicality: 9, game: 9 } }
              as: CastingDirector
              captures: { aud_e_id: $.data.id }
            - call: "POST /auditions/${aud_e_id}/evaluate"
              payload: {}
              as: CastingDirector
            - call: "POST /ensemble-casts/${cast_id}/open-casting"
              payload: {}
              as: CastingDirector
            - call: "POST /ensemble-casts/${cast_id}/cast"
              payload: {}
              as: CastingDirector
            - &cast_v
              call: "GET /ensemble-casts/${cast_id}"
              payload: {}
              as: CastingDirector
              captures: { cast_v_now: $.data.version }
          trigger:
            - call: "POST /ensemble-casts/${cast_id}/lock-cast"
              payload: { expected_cast_version: "${cast_v_now}" }
              as: CastingDirector
              captures: { err_state: $.data.error_id }
          assert:
            - "the response status is 409"
            - "error_id == ERR_INVALID_STATE"
            - "EnsembleCast.${cast_id}.status == CASTING (unchanged)"
            - "VenueSlot.${vs_id}.status == AVAILABLE (no showcase scheduled it; lock requires BOOKED)"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (≥ 2 instances; different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: venue_slot_half_open_adjacency_allowed
        grounds:
          - calculations.showcase_slot_allocation
          - entities.VenueSlot.fields.start_utc
          - entities.VenueSlot.fields.end_utc
        distinguishing_aspect: |
          Half-open interval semantics on VenueSlot: [start, end). Two slots on
          the same venue where a.end_utc == b.start_utc do NOT conflict, but
          a.end_utc > b.start_utc DO conflict. Adjacent bookings allowed,
          overlapping rejected. Distinct interval semantic from the sibling
          (turnover buffer).
        test_recipe:
          setup:
            - "VenueSlot A: 19:00–21:00 on Mainstage. VenueSlot B (to create): 21:00–23:00 same venue (adjacent — should succeed). VenueSlot C (to create): 20:30–22:00 same venue (overlap — should fail)."
          setup_api_calls:
            - *clock
            - &vs_a
              call: "POST /venue-slots"
              payload: { venue_name: "Mainstage", start_utc: "2027-04-01T19:00:00Z", end_utc: "2027-04-01T21:00:00Z", capacity: 200 }
              as: ProgramDirector
              captures: { vs_a_id: $.data.id }
            # Reserve slot A by scheduling a showcase on it (necessary because conflict check is on RESERVED/BOOKED slots only)
            - *lvl1
            - *term
            - &sc_a
              call: "POST /showcases"
              payload: { level_id: "${lvl1_id}", term_id: "${term_id}", venue_slot_id: "${vs_a_id}", performer_enrollment_ids: [] }
              as: ProgramDirector
              captures: { sc_a_id: $.data.id }
            - call: "POST /showcases/${sc_a_id}/schedule"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /venue-slots"
              payload: { venue_name: "Mainstage", start_utc: "2027-04-01T21:00:00Z", end_utc: "2027-04-01T23:00:00Z", capacity: 200 }
              as: ProgramDirector
              captures: { vs_b_id: $.data.id }
            - call: "POST /venue-slots"
              payload: { venue_name: "Mainstage", start_utc: "2027-04-01T20:30:00Z", end_utc: "2027-04-01T22:00:00Z", capacity: 200 }
              as: ProgramDirector
              captures: { err_ovl: $.data.error_id }
          assert:
            - "adjacent slot creation succeeds (VenueSlot.${vs_b_id} exists)"
            - "overlapping slot creation returns 409 with error_id == ERR_VENUE_SLOT_CONFLICT"

      - name: venue_slot_turnover_buffer_gap_rule
        grounds:
          - calculations.showcase_slot_allocation
          - errors.ERR_VENUE_SLOT_CONFLICT
        distinguishing_aspect: |
          Turnover-buffer interval semantics (distinct from half-open adjacency):
          even when two slots are disjoint, if 0 < gap < MIN_TURNOVER_MINUTES
          (30) on the same venue, the second is rejected. A 15-minute gap
          conflicts; a 45-minute gap succeeds; a 30-minute gap succeeds (>= not >).
        test_recipe:
          setup:
            - "Slot A 19:00–21:00 BOOKED on Mainstage. Three candidate slots: B 21:15–22:00 (15-min gap, FAIL), C 21:45–22:30 (45-min gap, OK), D 21:30–22:30 (30-min gap, OK at boundary)."
          setup_api_calls:
            - *clock
            - *vs_a
            - *lvl1
            - *term
            - *sc_a
            - call: "POST /showcases/${sc_a_id}/schedule"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /venue-slots"
              payload: { venue_name: "Mainstage", start_utc: "2027-04-01T21:15:00Z", end_utc: "2027-04-01T22:00:00Z", capacity: 200 }
              as: ProgramDirector
              captures: { err_gap: $.data.error_id }
            - call: "POST /venue-slots"
              payload: { venue_name: "Mainstage", start_utc: "2027-04-01T21:45:00Z", end_utc: "2027-04-01T22:30:00Z", capacity: 200 }
              as: ProgramDirector
              captures: { vs_c_id: $.data.id }
            - call: "POST /venue-slots"
              payload: { venue_name: "Mainstage", start_utc: "2027-04-01T21:30:00Z", end_utc: "2027-04-01T22:30:00Z", capacity: 200 }
              as: ProgramDirector
              captures: { err_30: $.data.error_id }
          assert:
            - "15-minute gap rejected: error_id == ERR_VENUE_SLOT_CONFLICT"
            - "45-minute gap accepted: VenueSlot.${vs_c_id} exists"
            - "30-minute gap rejected because C is now RESERVED and C.start - A.end = 45; but D.start - A.end = 30 >= 30 (should succeed against A), however D conflicts with C via half-open: D.start 21:30 < C.end 22:30 AND C.start 21:45 < D.end 22:30 → ERR_VENUE_SLOT_CONFLICT"

  # ===========================================================================
  # Rule 9 — compensating_invariant (≥ 2 instances; different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: enrollment_confirm_drop_conserves_enrolled_count
        grounds:
          - entities.CourseSection.fields.enrolled_count
          - state_machines.Enrollment.REGISTERED_to_CONFIRMED
          - state_machines.Enrollment.CONFIRMED_to_DROPPED_EARLY
        distinguishing_aspect: |
          Conserved quantity: CourseSection.enrolled_count. Invariant:
          confirm(X) then drop(X) leaves enrolled_count unchanged from pre-confirm.
          Section starts with enrolled_count=0; confirm → 1; drop → 0. The
          pair of compensating actions restores the global count exactly.
        test_recipe:
          setup:
            - "Section capacity 4, enrolled_count=0. Student s1 REGISTERED."
          setup_api_calls:
            - *clock
            - *lvl1
            - *term
            - *instr
            - call: "POST /terms/${term_id}/open-scheduling"
              payload: {}
              as: ProgramDirector
            - *sec
            - call: "POST /terms/${term_id}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - *stu1
            - *enr1
          trigger:
            - call: "POST /enrollments/${enr1_id}/confirm"
              payload: {}
              as: Registrar
            - &sec_after_confirm
              call: "GET /sections/${sec_id}"
              payload: {}
              as: Registrar
              captures: { count_after_confirm: $.data.enrolled_count }
            - call: "POST /enrollments/${enr1_id}/drop"
              payload: {}
              as: Registrar
            - &sec_after_drop
              call: "GET /sections/${sec_id}"
              payload: {}
              as: Registrar
              captures: { count_after_drop: $.data.enrolled_count }
          assert:
            - "initial CourseSection.${sec_id}.enrolled_count == 0"
            - "after confirm: enrolled_count == 1"
            - "after drop: enrolled_count == 0"
            - "conserved: count_after_drop == initial enrolled_count"

      - name: tuition_invoice_pay_refund_conserves_cash_total
        grounds:
          - entities.TuitionInvoice.fields.paid_cents
          - entities.TuitionInvoice.fields.refunded_cents
          - calculations.tuition_refund
        distinguishing_aspect: |
          Conserved quantity: paid_cents - refunded_cents (net cash retained by
          the school) on an EARLY_DROP. Invariant: pay(P) then drop-before-
          deadline yields refunded == P and paid - refunded == 0. Distinct
          conserved quantity from enrolled_count in the sibling.
        test_recipe:
          setup:
            - "Enrollment CONFIRMED with $100 paid. Clock before drop_deadline."
          setup_api_calls:
            - *clock
            - *lvl1
            - *term
            - *instr
            - call: "POST /terms/${term_id}/open-scheduling"
              payload: {}
              as: ProgramDirector
            - *sec_cap1
            - call: "POST /terms/${term_id}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - *stu1
            - *enr_a
            - call: "POST /enrollments/${enr_a_id}/confirm"
              payload: {}
              as: Registrar
            - *inv_list
            - call: "POST /tuition-invoices/${inv1_id}/pay"
              payload: { amount_cents: 10000 }
              as: FinanceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-10T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /enrollments/${enr_a_id}/drop"
              payload: {}
              as: Registrar
          assert:
            - "TuitionInvoice.${inv1_id}.paid_cents == 10000"
            - "TuitionInvoice.${inv1_id}.refunded_cents == 10000"
            - "conserved: paid_cents - refunded_cents == 0"
            - "TuitionInvoice.${inv1_id}.status == REFUNDED"
