              captures: { cyc_approved: $.data.status }
          trigger:
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "ACTIVATE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
              captures: { e_pending_code: $.data.error_id }
            - call: "POST /chargemaster/change-requests"
              payload: { department_id: "${dept}", charge_item_id: "${item}", request_type: "PRICE_CHANGE", justification: "Contrast supply cost increase for imaging", proposed_cost_basis_cents: 150000 }
              as: DepartmentManager
              as_user_id: "mgr_cath"
              captures: { cr: $.data.id, cr_proj: $.data.projected_gross_charge_cents }
            - call: "POST /chargemaster/change-requests/${cr}/decisions"
              payload: { decision: "REVIEW", decision_note: "Invoice verified" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
            - call: "POST /chargemaster/change-requests/${cr}/approve"
              payload: { expected_charge_item_version: "${v4}", decision_note: "Approved" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
              captures: { cr_approved: $.data.status, pinned: $.data.pinned_charge_item_version }
            - call: "POST /chargemaster/code-update-cycles/${cycle}/lifecycle"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { e_open_request: $.data.error_id }
            - call: "POST /chargemaster/change-requests/${cr}/implement"
              payload: { implementation_note: "Applying approved cost basis" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
              captures: { cr_implemented: $.data.status }
            - call: "GET /chargemaster/charge-items/${item}"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { cost_impl: $.data.cost_basis_cents, gross_impl: $.data.gross_charge_cents, price_impl: $.data.price_status }
            - call: "POST /chargemaster/code-update-cycles/${cycle}/lifecycle"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { cyc_activated: $.data.status, applied: $.data.applied_entry_count }
            - call: "GET /chargemaster/code-update-entries/${entry}"
              payload: {}
              as: ComplianceOfficer
              captures: { entry_applied: $.data.status, prior_gross: $.data.prior_gross_charge_cents, prior_code: $.data.prior_code_value }
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "ACTIVATE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
              captures: { e_price_not_current: $.data.error_id }
          assert:
            - "${gross0} == 240000, ${life4} == APPROVED, ${price4} == PRICED_CURRENT and ${v4} == 4"
            - "${entry_status} == MAPPED, ${entry_target} == ${item} and ${carried} == 240000 (new_revenue_code_id is null, so the carry leaves the price unchanged)"
            - "${cyc_approved} == CROSSWALK_APPROVED and Facility.${fac}.chargemaster_posture == RESTRICTED"
            - "${e_pending_code} == ERR_ITEM_PENDING_CODE_UPDATE with HTTP 409 (priority 47) — the item is APPROVED and PRICED_CURRENT, so nothing lower is reached"
            - "${cr_proj} == 360000 (cost 150000 lands in the 50000 tier at 24000 bp; floor 60000, cap 990000)"
            - "${cr_approved} == APPROVED and ${pinned} == 5 (approval bumped the item to version 5 and pinned the post-bump value)"
            - "${e_open_request} == ERR_ITEM_HAS_OPEN_REQUEST with HTTP 409 — the same error id now guards the CYCLE because an APPROVED request targets a MAPPED entry's item"
            - "CodeUpdateCycle.${cycle}.status == CROSSWALK_APPROVED after the rejected activation"
            - "${cr_implemented} == IMPLEMENTED"
            - "${cost_impl} == 150000, ${gross_impl} == 360000 and ${price_impl} == PRICED_CURRENT"
            - "${cyc_activated} == ACTIVATED and ${applied} == 1 (the request no longer blocks the cycle)"
            - "${entry_applied} == APPLIED, ${prior_code} == 93470 and ${prior_gross} == 360000 (the snapshot is taken at activation, after the implement)"
            - "ChargeItem.${item}.code_value == 93470A and ChargeItem.${item}.gross_charge_cents == 240000 — the carry frozen at MAP time overwrites the implemented 360000"
            - "ChargeItem.${item}.price_status == PRICE_STALE and ChargeItem.${item}.last_code_cycle_id == ${cycle}"
            - "${e_price_not_current} == ERR_ITEM_PRICE_NOT_CURRENT with HTTP 409 — priority 47 is now satisfied, so the next rank down (priority 49) takes over"
            - "Facility.${fac}.active_item_count == 0 and Facility.${fac}.stale_price_item_count == 0 (the stale item is APPROVED, not ACTIVE)"
            - "Facility.${fac}.chargemaster_posture == OPEN (the cycle left the MAPPING / CROSSWALK_APPROVED window)"
  - section: rbac
    instances:
      - name: each_role_exercises_its_own_exclusive_operations_end_to_end
        claim_type: role_permissions
        grounds:
          - rbac[SystemAdmin.exclusive_operations]
          - rbac[RevenueIntegrityAnalyst.exclusive_operations]
          - rbac[PricingCommitteeApprover.exclusive_operations]
          - rbac[ComplianceOfficer.exclusive_operations]
          - rbac[ContractManager.exclusive_operations]
          - rbac[DepartmentManager.exclusive_operations]
        distinguishing_aspect: "The positive half of the RBAC table: one uninterrupted run in which all six roles each perform their own exclusive operations in the order the domain requires (admin reference data, analyst pricing, manager request, approver decision and activation, contract manager payer terms, compliance officer transparency build) so that no denial in the sibling instances can be explained away as a broken happy path."
        test_recipe:
          setup:
            - "Empty system at clock 2026-09-01T00:00:00Z. No entity exists yet; every object below is created by the role that exclusively owns its endpoint."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001", rounding_mode: "NEAREST_CENT" }
              as: SystemAdmin
              captures: { fac: $.data.id, fac_v: $.data.version }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory", requires_hcpcs: false, allowed_code_types: ["CPT"], pricing_class: "PROCEDURE" }
              as: SystemAdmin
              captures: { rc300: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac}", name: "Cardiac Cath Lab", cost_center_code: "CC-100", manager_user_id: "mgr_cath" }
              as: SystemAdmin
              captures: { dept: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac}", revenue_code_id: "${rc300}", pricing_method: "COST_PLUS_MARKUP", effective_from: "2026-01-01T00:00:00Z", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 32000 }, { min_cost_basis_cents: 50000, markup_bp: 24000 }] }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
              captures: { rule: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac}", department_id: "${dept}", revenue_code_id: "${rc300}", cdm_number: "CDM-1001", description: "CARDIAC CATH BASIC", code_type: "CPT", code_value: "93458", cost_basis_cents: 100000, medicare_rate_cents: 50000, market_p75_cents: 900000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
              captures: { item: $.data.id }
            - call: "POST /chargemaster/charge-items/${item}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
              captures: { gross: $.data.gross_charge_cents, pstat: $.data.price_status }
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
              captures: { pending: $.data.lifecycle_status }
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "APPROVE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
              captures: { approved: $.data.lifecycle_status }
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "ACTIVATE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
              captures: { active: $.data.lifecycle_status, item_v: $.data.version }
            - call: "POST /chargemaster/change-requests"
              payload: { department_id: "${dept}", charge_item_id: "${item}", request_type: "PRICE_CHANGE", justification: "Cost basis rose after the vendor contract renewal", proposed_cost_basis_cents: 150000 }
              as: DepartmentManager
              as_user_id: "mgr_cath"
              captures: { cr: $.data.id, cr_status: $.data.status }
            - call: "POST /chargemaster/change-requests/${cr}/decisions"
              payload: { decision: "REVIEW", decision_note: "Cost documentation attached and verified" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_2"
              captures: { reviewed: $.data.status }
            - call: "POST /chargemaster/change-requests/${cr}/decisions"
              payload: { decision: "APPROVE", decision_note: "Committee approved the new cost basis" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
              captures: { cr_approved: $.data.status }
            - call: "POST /chargemaster/payer-contracts"
              payload: { facility_id: "${fac}", payer_code: "BCBS", product_line: "COMMERCIAL", reimbursement_method: "PERCENT_OF_CHARGE", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2027-08-31T23:59:59Z", percent_of_charge_bp: 6000, renegotiation_notice_days: 30, trailing_units: 100 }
              as: ContractManager
              as_user_id: "cm_1"
              captures: { contract: $.data.id, c_status: $.data.status }
            - call: "POST /chargemaster/transparency-files"
              payload: { facility_id: "${fac}", file_format: "CSV", expected_facility_version: "${fac_v}" }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { file: $.data.id, f_status: $.data.status }
          assert:
            - "every call above returns 2xx"
            - "${gross} == 240000 and ${pstat} == PRICED_CURRENT"
            - "${pending} == PENDING_REVIEW, ${approved} == APPROVED, ${active} == ACTIVE and ${item_v} == 5"
            - "${cr_status} == SUBMITTED, ${reviewed} == REVIEWED and ${cr_approved} == APPROVED"
            - "${c_status} == ACTIVE"
            - "${f_status} == BUILDING"

      - name: analyst_cannot_approve_and_approver_cannot_author_and_admin_cannot_decide
