      - name: a_blocked_clearance_item_overrides_the_score_ladder_and_undecided_items_score_zero
        claim_type: correct_result
        grounds:
          - calculations.clearance_risk_score
          - entities.ClearanceItem.fields.risk_weight
          - entities.ClearanceReview.fields.posture
          - errors.ERR_CLEARANCE_BLOCKED
        distinguishing_aspect: |
          The posture ladder is ordered, not numeric: a single BLOCKED item of the cheapest type (NAME,
          weight 5 * 4 = 20) forces posture BLOCKED even though 20 is below both the escalation score 30
          and the CONDITIONAL band, while the still-SUBMITTED DEPICTION item contributes 0 to the sum and
          leaves decided_item_count at 1 of 2. The episode inherits BLOCKED and the lock is refused with
          ERR_CLEARANCE_BLOCKED rather than ERR_CLEARANCE_NOT_CLEARED.
        test_recipe:
          setup:
            - "Review CR on the APPROVED A1 (EP1 READY) holds IT1 (DEPICTION, weight 25) and IT2 (NAME, weight 5), both SUBMITTED."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_W2
            - *C_SE
            - *C_AW1
            - *C_AW2
            - *C_RM
            - *C_OPEN
            - *C_S1
            - *C_ACC1
            - *C_GRV
            - *C_S2
            - *C_ACC2
            - *C_ACTIVATE
            - *C_EP1
            - *C_A1
            - *C_MLIST
            - *C_D1
            - *C_D2
            - *C_D3
            - *C_APP1
            - *C_CR
            - *C_IT1
            - *C_IT2
          trigger:
            - call: "POST /clearance-items/${it2}/decide"
              payload: { decision: "BLOCKED" }
              as: LegalCounsel
            - call: "POST /episodes/${ep1}/lock-for-production"
              payload: {}
              as: StudioExecutive
          assert:
            - "ClearanceItem.${it2}.risk_weight == 20 (NAME 5 * the BLOCKED multiplier 4) and ClearanceItem.${it1}.risk_weight == 25, its unmultiplied catalogue weight, because it is still SUBMITTED"
            - "ClearanceReview.${cr}.risk_score == 20: only decided items enter the sum"
            - "ClearanceReview.${cr}.decided_item_count == 1, item_count == 2 and posture == BLOCKED - the BLOCKED branch precedes the ESCALATED (> 30) and CONDITIONAL (> 0) branches"
            - "Episode.${ep1}.clearance_posture == BLOCKED and script_readiness == READY"
            - "Trigger call 2 returns 409 ERR_CLEARANCE_BLOCKED (not ERR_CLEARANCE_NOT_CLEARED) and Episode.${ep1}.locked_at == null"
            - "Season.${se}.ready_script_count == 0, coverage_gap == 1 and coverage_posture == AT_RISK"

