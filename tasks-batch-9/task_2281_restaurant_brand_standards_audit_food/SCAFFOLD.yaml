scenario: "2281. Restaurant Brand Standards Audit & Food Safety Assessment (Steritech): audit calendar with announced and unannounced visit mix, scoring rubric weighting critical violations against total points, corrective action assignment with photo evidence and due dates, repeat-violation escalation and franchisee agreement consequences, auditor calibration and shadow-audit reliability scoring, dispute/appeal of a scored item with evidence review, cross-location trend reporting and brand risk index, integration of health-department inspection results into the composite score"
domain_name: "restaurant-brand-standards-audit"
api_prefix: ""

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Multi-party negotiation"
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Brand
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Restaurant brand trade name"
        constraints: "1-120 chars, required"
      - name: brand_code
        type: string
        source: input
        description: "Short brand identifier used on audit paperwork"
        constraints: "2-8 chars, uppercase alphanumeric, globally unique"
      - name: unannounced_min_ratio_pct
        type: integer
        source: input
        description: "Minimum share of a location's rolling audit calendar that must be UNANNOUNCED visits"
        default: 40
        constraints: "0-100"
      - name: brand_risk_index
        type: number
        source: computed
        description: "Cross-location brand risk index; see calculations.brand_risk_index"
        default: 0.00
        constraints: "0.00-100.00, 2dp"
      - name: brand_risk_tier
        type: enum
        source: computed
        description: "Tier derived from brand_risk_index"
        default: "BASELINE"
        constraints: "BASELINE | ELEVATED | SEVERE"
      - name: location_count
        type: integer
        source: computed
        description: "Number of Locations referencing this Brand"
        default: 0
      - name: default_location_count
        type: integer
        source: computed
        description: "Number of Locations whose franchise_agreement_status is not GOOD_STANDING"
        default: 0

  - name: Franchisee
    parent: null
    common_fields: true
    fields:
      - name: brand_id
        type: string
        source: input
        description: "FK -> Brand.id; the brand this franchisee operates under"
      - name: legal_name
        type: string
        source: input
        description: "Franchisee legal entity name"
        constraints: "1-160 chars, required"
      - name: contact_email
        type: string
        source: input
        description: "Corrective-action notification address"
        constraints: "must contain '@'"
      - name: agreement_signed_at
        type: datetime
        source: input
        description: "Date the franchise agreement was executed"
      - name: open_default_location_count
        type: integer
        source: computed
        description: "Count of this franchisee's Locations whose franchise_agreement_status is not GOOD_STANDING"
        default: 0
      - name: termination_recommended
        type: boolean
        source: computed
        description: "True when any of this franchisee's Locations reached TERMINATION_RECOMMENDED"
        default: false

  - name: Auditor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Auditor name"
        constraints: "1-120 chars, required"
      - name: employee_code
        type: string
        source: input
        description: "Auditor staff code"
        constraints: "3-12 chars, globally unique"
      - name: status
        type: enum
        source: computed
        description: "Certification lifecycle state; see state_machines.Auditor"
        default: "PROVISIONAL"
        constraints: "PROVISIONAL | CERTIFIED | SUSPENDED"
      - name: certification_period_start
        type: datetime
        source: computed
        description: "Logical clock instant of the most recent certification; null while PROVISIONAL"
        default: null
      - name: reliability_score
        type: number
        source: computed
        description: "Shadow-audit reliability score; see calculations.auditor_reliability_score"
        default: 70.00
        constraints: "0.00-100.00, 2dp"
      - name: suspension_reason
        type: enum
        source: computed
        description: "Why the auditor was suspended; null unless status is SUSPENDED"
        default: null
        constraints: "RELIABILITY_BELOW_FLOOR | MANUAL_REVIEW"
      - name: finalized_visit_count
        type: integer
        source: computed
        description: "Number of AuditVisits by this auditor that reached FINALIZED"
        default: 0

  - name: Location
    parent: null
    common_fields: true
    fields:
      - name: brand_id
        type: string
        source: input
        description: "FK -> Brand.id"
      - name: franchisee_id
        type: string
        source: input
        description: "FK -> Franchisee.id; must reference a Franchisee whose brand_id equals this Location's brand_id"
      - name: store_number
        type: string
        source: input
        description: "Store identifier on brand signage"
        constraints: "3-16 chars, unique within brand_id"
      - name: region_code
        type: enum
        source: input
        description: "Operating region used in trend reporting"
        constraints: "NORTHEAST | SOUTHEAST | MIDWEST | WEST"
      - name: standing_score
        type: number
        source: computed
        description: "Recency-weighted standing score across FINALIZED visits; see calculations.location_standing_score"
        default: 0.00
        constraints: "0.00-100.00, 2dp"
      - name: latest_grade
        type: enum
        source: computed
        description: "Grade of the most recent FINALIZED visit; null when none"
        default: null
        constraints: "PASS | CONDITIONAL | FAIL"
      - name: open_corrective_action_count
        type: integer
        source: computed
        description: "CorrectiveActions at this location in ASSIGNED, SUBMITTED, REJECTED, or OVERDUE"
        default: 0
      - name: repeat_violation_count
        type: integer
        source: computed
        description: "Distinct rubric items scored as critical violations in 2+ FINALIZED visits within 365 days; see calculations.location_repeat_violation_count"
        default: 0
      - name: escalation_level
        type: integer
        source: computed
        description: "Net franchise-agreement escalation level derived from the EscalationEvent ledger"
        default: 0
        constraints: ">= 0"
      - name: franchise_agreement_status
        type: enum
        source: computed
        description: "Agreement consequence derived from escalation_level; see calculations.location_agreement_status"
        default: "GOOD_STANDING"
        constraints: "GOOD_STANDING | NOTICE_OF_DEFAULT | CURE_PERIOD | TERMINATION_RECOMMENDED"
      - name: cure_period_started_at
        type: datetime
        source: computed
        description: "Logical clock instant the location entered CURE_PERIOD; null otherwise"
        default: null

  - name: RubricVersion
    parent: null
    common_fields: true
    fields:
      - name: brand_id
        type: string
        source: input
        description: "FK -> Brand.id"
      - name: supersedes_rubric_version_id
        type: string
        source: input
        description: "FK -> RubricVersion.id; nullable self-reference to the rubric version this one replaces"
        default: null
      - name: version_label
        type: string
        source: input
        description: "Human rubric label, e.g. RV-2026.1"
        constraints: "unique within brand_id"
      - name: effective_from
        type: datetime
        source: input
        description: "Earliest scheduled_start_at a visit may have to use this rubric"
      - name: total_points
        type: integer
        source: input
        description: "Declared total points of the rubric"
        constraints: "1-1000; at publish must equal the sum of its RubricItem.max_points"
      - name: status
        type: enum
        source: computed
        description: "Rubric lifecycle; see state_machines.RubricVersion"
        default: "DRAFT"
        constraints: "DRAFT | PUBLISHED | RETIRED"
      - name: published_at
        type: datetime
        source: computed
        description: "Logical clock instant of publication; null while DRAFT"
        default: null
      - name: item_count
        type: integer
        source: computed
        description: "Number of RubricItems attached"
        default: 0
      - name: critical_item_count
        type: integer
        source: computed
        description: "Number of attached RubricItems with is_critical true"
        default: 0

  - name: RubricItem
    parent: RubricVersion
    common_fields: false
    fields:
      - name: rubric_version_id
        type: string
        source: input
        description: "FK -> RubricVersion.id"
      - name: item_code
        type: string
        source: input
        description: "Rubric line-item code"
        constraints: "unique within rubric_version_id"
      - name: section
        type: enum
        source: input
        description: "Scoring section this item rolls up to"
        constraints: "FOOD_SAFETY | BRAND_STANDARDS | FACILITY"
      - name: max_points
        type: integer
        source: input
        description: "Maximum points obtainable on this item"
        constraints: "1-100"
      - name: is_critical
        type: boolean
        source: input
        description: "Critical food-safety item; a violation here drives penalty points and escalation"
        default: false
      - name: display_order
        type: integer
        source: input
        description: "Deterministic ordering of items within a section"
        constraints: "1-999, unique within rubric_version_id"

  - name: AuditVisit
    parent: null
    common_fields: true
    fields:
      - name: location_id
        type: string
        source: input
        description: "FK -> Location.id"
      - name: auditor_id
        type: string
        source: input
        description: "FK -> Auditor.id; the auditor who will score the visit"
      - name: rubric_version_id
        type: string
        source: input
        description: "FK -> RubricVersion.id; must be PUBLISHED at visit creation"
      - name: shadow_of_visit_id
        type: string
        source: input
        description: "FK -> AuditVisit.id; nullable self-reference set only when visit_type is SHADOW"
        default: null
      - name: linked_health_inspection_id
        type: string
        source: computed
        description: "FK -> HealthInspection.id; the health inspection selected into the FINAL composite at finalize; null when none eligible"
        default: null
      - name: visit_type
        type: enum
        source: input
        description: "Calendar visit class"
        constraints: "ANNOUNCED | UNANNOUNCED | SHADOW"
      - name: scheduled_start_at
        type: datetime
        source: input
        description: "Planned visit window start (inclusive)"
      - name: scheduled_end_at
        type: datetime
        source: input
        description: "Planned visit window end (exclusive)"
        constraints: "must be strictly after scheduled_start_at"
      - name: announced_notice_hours
        type: number
        source: computed
        description: "Hours between creation-time logical clock and scheduled_start_at; null for UNANNOUNCED and SHADOW"
        default: null
      - name: status
        type: enum
        source: computed
        description: "Visit lifecycle; see state_machines.AuditVisit"
        default: "SCHEDULED"
        constraints: "SCHEDULED | IN_PROGRESS | SUBMITTED | FINALIZED | VOIDED"
      - name: started_at
        type: datetime
        source: computed
        description: "Logical clock instant of start"
        default: null
      - name: submitted_at
        type: datetime
        source: computed
        description: "Logical clock instant of submit"
        default: null
      - name: finalized_at
        type: datetime
        source: computed
        description: "Logical clock instant of finalize"
        default: null
      - name: food_safety_percent
        type: number
        source: computed
        description: "Section percent for FOOD_SAFETY; see calculations.visit_section_percent"
        default: null
        constraints: "0.00-100.00, 2dp"
      - name: brand_standards_percent
        type: number
        source: computed
        description: "Section percent for BRAND_STANDARDS; see calculations.visit_section_percent"
        default: null
      - name: facility_percent
        type: number
        source: computed
        description: "Section percent for FACILITY; see calculations.visit_section_percent"
        default: null
      - name: critical_violation_count
        type: integer
        source: computed
        description: "Number of effective critical violations on this visit"
        default: 0
      - name: critical_penalty_points
        type: number
        source: computed
        description: "Penalty subtracted from the weighted score; see calculations.critical_penalty_points"
        default: 0.00
      - name: health_component_percent
        type: number
        source: computed
        description: "Percent contribution of the selected HealthInspection; null until a FINAL composite selects one"
        default: null
      - name: composite_score
        type: number
        source: computed
        description: "Composite visit score; see calculations.visit_composite_score"
        default: null
        constraints: "0.00-100.00, 2dp"
      - name: composite_variant
        type: enum
        source: computed
        description: "Which composite variant produced composite_score"
        default: null
        constraints: "PROVISIONAL | FINAL"
      - name: grade
        type: enum
        source: computed
        description: "Grade derived from composite_score and critical_violation_count; see calculations.visit_grade"
        default: null
        constraints: "PASS | CONDITIONAL | FAIL"
      - name: rescore_count
        type: integer
        source: computed
        description: "Number of accepted rescore operations while SUBMITTED"
        default: 0
      - name: void_reason
        type: enum
        source: computed
        description: "Why the visit was voided"
        default: null
        constraints: "AUDITOR_SUSPENDED | RUBRIC_DEFECT | SCHEDULING_ERROR"

  - name: ScoredItem
    parent: AuditVisit
    common_fields: true
    fields:
      - name: visit_id
        type: string
        source: input
        description: "FK -> AuditVisit.id"
      - name: rubric_item_id
        type: string
        source: input
        description: "FK -> RubricItem.id; must belong to the visit's rubric_version_id"
      - name: points_awarded
        type: integer
        source: input
        description: "Points granted on this item"
        constraints: "0 <= points_awarded <= RubricItem.max_points"
      - name: original_points_awarded
        type: integer
        source: computed
        description: "Points recorded at first scoring; never changes"
      - name: amended_points_awarded
        type: integer
        source: computed
        description: "Points substituted by a dispute amendment; null unless status is AMENDED"
        default: null
      - name: effective_points_awarded
        type: integer
        source: computed
        description: "amended_points_awarded when status is AMENDED, else points_awarded"
      - name: is_violation
        type: boolean
        source: computed
        description: "True when effective_points_awarded < RubricItem.max_points"
        default: false
      - name: severity
        type: enum
        source: computed
        description: "CRITICAL when the RubricItem is_critical and is_violation, STANDARD when is_violation only, NONE otherwise"
        default: "NONE"
        constraints: "NONE | STANDARD | CRITICAL"
      - name: status
        type: enum
        source: computed
        description: "Scored-item dispute lifecycle; see state_machines.ScoredItem"
        default: "SCORED"
        constraints: "SCORED | UNDER_DISPUTE | AMENDED | UPHELD"
      - name: note
        type: string
        source: input
        description: "Auditor observation text"
        default: null
        constraints: "0-500 chars"

  - name: CorrectiveAction
    parent: null
    common_fields: true
    fields:
      - name: scored_item_id
        type: string
        source: input
        description: "FK -> ScoredItem.id; the violation being corrected"
      - name: location_id
        type: string
        source: computed
        description: "FK -> Location.id; copied from the scored item's visit"
      - name: assigned_franchisee_id
        type: string
        source: computed
        description: "FK -> Franchisee.id; copied from the location at assignment"
      - name: severity
        type: enum
        source: computed
        description: "Copied from the scored item's severity at assignment; drives due_at"
        constraints: "STANDARD | CRITICAL"
      - name: due_at
        type: datetime
        source: computed
        description: "Deadline; see calculations.corrective_action_due_at"
      - name: status
        type: enum
        source: computed
        description: "Corrective-action lifecycle; see state_machines.CorrectiveAction"
        default: "ASSIGNED"
        constraints: "ASSIGNED | SUBMITTED | VERIFIED | REJECTED | OVERDUE | ESCALATED | VOIDED"
      - name: submission_count
        type: integer
        source: computed
        description: "Number of franchisee submissions"
        default: 0
      - name: rejection_count
        type: integer
        source: computed
        description: "Number of auditor rejections"
        default: 0
      - name: evidence_photo_count
        type: integer
        source: computed
        description: "EvidencePhotos attached to this corrective action"
        default: 0
      - name: submitted_at
        type: datetime
        source: computed
        description: "Logical clock instant of the most recent submission"
        default: null
      - name: verified_at
        type: datetime
        source: computed
        description: "Logical clock instant of verification"
        default: null
      - name: escalated_at
        type: datetime
        source: computed
        description: "Logical clock instant of escalation"
        default: null

  - name: EvidencePhoto
    parent: null
    common_fields: false
    fields:
      - name: corrective_action_id
        type: string
        source: input
        description: "FK -> CorrectiveAction.id; nullable, mutually exclusive with dispute_id"
        default: null
      - name: dispute_id
        type: string
        source: input
        description: "FK -> Dispute.id; nullable, mutually exclusive with corrective_action_id"
        default: null
      - name: file_uri
        type: string
        source: input
        description: "Storage locator of the photo"
        constraints: "must start with 's3://'"
      - name: captured_at
        type: datetime
        source: input
        description: "When the photo was taken; must not be after the logical clock"
      - name: caption
        type: string
        source: input
        description: "Short description"
        default: null
        constraints: "0-200 chars"
      - name: uploaded_by_role
        type: enum
        source: system
        description: "Role of the uploading caller"
        constraints: "Franchisee | Auditor"

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - name: scored_item_id
        type: string
        source: input
        description: "FK -> ScoredItem.id; the appealed line item"
      - name: filed_by_franchisee_id
        type: string
        source: computed
        description: "FK -> Franchisee.id; the acting franchisee at filing"
      - name: reviewer_auditor_id
        type: string
        source: computed
        description: "FK -> Auditor.id; the calibration reviewer who first acted on the dispute; null while unclaimed"
        default: null
      - name: requested_points
        type: integer
        source: input
        description: "Points the franchisee argues the item deserves"
        constraints: "must exceed the scored item's points_awarded and not exceed the rubric item's max_points"
      - name: reason
        type: string
        source: input
        description: "Appeal narrative"
        constraints: "10-1000 chars"
      - name: status
        type: enum
        source: computed
        description: "Dispute lifecycle; see state_machines.Dispute"
        default: "FILED"
        constraints: "FILED | INFO_REQUESTED | EVIDENCE_REVIEW | UPHELD | AMENDED | WITHDRAWN"
      - name: info_request_count
        type: integer
        source: computed
        description: "Number of additional-information rounds already requested"
        default: 0
      - name: resolution_points
        type: number
        source: computed
        description: "Points granted by the resolution; null until resolved"
        default: null
      - name: filed_at
        type: datetime
        source: computed
        description: "Logical clock instant of filing"
      - name: resolved_at
        type: datetime
        source: computed
        description: "Logical clock instant of resolution or withdrawal"
        default: null

  - name: HealthInspection
    parent: null
    common_fields: true
    fields:
      - name: location_id
        type: string
        source: input
        description: "FK -> Location.id"
      - name: authority_name
        type: string
        source: input
        description: "Health department that performed the inspection"
        constraints: "1-120 chars"
      - name: inspection_date
        type: datetime
        source: input
        description: "Inspection instant; must not be after the logical clock"
      - name: points_scored
        type: integer
        source: input
        description: "Points the health department awarded"
        constraints: "0 <= points_scored <= points_possible"
      - name: points_possible
        type: integer
        source: input
        description: "Maximum points on the health department's scale"
        constraints: "1-1000"
      - name: letter_grade
        type: enum
        source: input
        description: "Posted letter grade"
        constraints: "A | B | C | FAIL"
      - name: status
        type: enum
        source: computed
        description: "RECORDED inspections are eligible for composite selection; DISREGARDED ones are excluded"
        default: "RECORDED"
        constraints: "RECORDED | DISREGARDED"
      - name: disregard_reason
        type: enum
        source: computed
        description: "Why the inspection was excluded"
        default: null
        constraints: "SUPERSEDED_BY_REINSPECTION | WRONG_LOCATION | DATA_ERROR"

  - name: CalibrationRecord
    parent: null
    common_fields: false
    fields:
      - name: shadow_visit_id
        type: string
        source: input
        description: "FK -> AuditVisit.id; the SHADOW visit performed by the calibration reviewer"
      - name: primary_visit_id
        type: string
        source: computed
        description: "FK -> AuditVisit.id; the shadow visit's shadow_of_visit_id target"
      - name: auditor_id
        type: string
        source: computed
        description: "FK -> Auditor.id; the primary visit's auditor, whose reliability this record adjusts"
      - name: reviewer_auditor_id
        type: string
        source: computed
        description: "FK -> Auditor.id; the shadow visit's auditor acting as calibration reviewer"
      - name: variance_points
        type: number
        source: computed
        description: "Absolute composite gap between shadow and primary; see calculations.calibration_variance_and_delta"
      - name: reliability_delta
        type: number
        source: computed
        description: "Signed reliability adjustment implied by the variance band"
      - name: band
        type: enum
        source: computed
        description: "Variance band"
        constraints: "EXCELLENT | ACCEPTABLE | MARGINAL | UNACCEPTABLE"
      - name: recorded_at
        type: datetime
        source: system
        description: "Logical clock instant the record was written"

  - name: EscalationEvent
    parent: null
    common_fields: false
    fields:
      - name: location_id
        type: string
        source: system
        description: "FK -> Location.id"
      - name: corrective_action_id
        type: string
        source: system
        description: "FK -> CorrectiveAction.id; nullable, set when the event originates from a corrective action"
        default: null
      - name: audit_visit_id
        type: string
        source: system
        description: "FK -> AuditVisit.id; nullable, set when the event originates from a visit finalize or void"
        default: null
      - name: event_type
        type: enum
        source: system
        description: "Ledger entry kind"
        constraints: "REPEAT_CRITICAL | OVERDUE_CRITICAL | CURE_ACCEPTED | VOID_REVERSAL"
      - name: level_delta
        type: integer
        source: computed
        description: "+1 for REPEAT_CRITICAL and OVERDUE_CRITICAL, -1 for CURE_ACCEPTED and VOID_REVERSAL"
      - name: resulting_escalation_level
        type: integer
        source: computed
        description: "Location.escalation_level immediately after applying this entry"
      - name: resulting_agreement_status
        type: enum
        source: computed
        description: "Location.franchise_agreement_status immediately after applying this entry"
        constraints: "GOOD_STANDING | NOTICE_OF_DEFAULT | CURE_PERIOD | TERMINATION_RECOMMENDED"
      - name: occurred_at
        type: datetime
        source: system
        description: "Logical clock instant of the event"

state_machines:
  - entity: AuditVisit
    initial_state: SCHEDULED
    terminal_states: [FINALIZED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /audit-visits/{id}/start"
        actor: Auditor
        preconditions:
          - "acting Auditor.id equals visit.auditor_id"
          - "the visit's Auditor.status is CERTIFIED"
          - "logical clock is at or after scheduled_start_at minus 60 minutes"
          - "the visit's RubricVersion.status is PUBLISHED or RETIRED"
        side_effects:
          - "sets started_at to the logical clock"
        note: "A SUSPENDED auditor's SCHEDULED visits remain SCHEDULED and are blocked here with ERR_AUDITOR_SUSPENDED."
      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: "POST /audit-visits/{id}/submit"
        actor: Auditor
        preconditions:
          - "acting Auditor.id equals visit.auditor_id"
          - "every RubricItem of the visit's rubric_version_id with is_critical true has a ScoredItem"
        side_effects:
          - "sets submitted_at to the logical clock"
          - "computes food_safety_percent, brand_standards_percent, facility_percent per calculations.visit_section_percent (unscored non-critical items contribute 0 awarded points against their max_points)"
          - "computes critical_violation_count and critical_penalty_points"
          - "computes composite_score with the PROVISIONAL variant and sets composite_variant to PROVISIONAL"
          - "computes grade per calculations.visit_grade"
        note: "No health-department component participates in a PROVISIONAL composite."
      - from: SUBMITTED
        to: SUBMITTED
        trigger: "POST /audit-visits/{id}/rescore"
        actor: Auditor
        preconditions:
          - "acting Auditor.id equals visit.auditor_id"
          - "expected_visit_version matches AuditVisit.version"
          - "rescore_count is less than 2"
          - "no ScoredItem of this visit is UNDER_DISPUTE"
        side_effects:
          - "overwrites points_awarded on the named ScoredItem and leaves original_points_awarded untouched"
          - "increments rescore_count by 1"
          - "recomputes section percents, critical_violation_count, critical_penalty_points, PROVISIONAL composite_score, and grade"
          - "increments AuditVisit.version by 1"
        note: "Self-loop: the cyclic edge of this machine."
      - from: SUBMITTED
        to: FINALIZED
        trigger: "POST /audit-visits/{id}/finalize"
        actor: BrandAdmin
        preconditions:
          - "no ScoredItem of this visit is UNDER_DISPUTE"
          - "the visit is not a SHADOW visit, or its shadow_of_visit_id target is already FINALIZED"
        side_effects:
          - "sets finalized_at to the logical clock"
          - "selects the eligible HealthInspection per calculations.health_component_percent and stores it in linked_health_inspection_id"
          - "recomputes composite_score with the FINAL variant and sets composite_variant to FINAL"
          - "recomputes grade"
          - "increments Auditor.finalized_visit_count by 1"
          - "creates one CorrectiveAction per violating ScoredItem and raises Location.open_corrective_action_count by that count"
          - "recomputes Location.standing_score, latest_grade, and repeat_violation_count"
          - "appends one REPEAT_CRITICAL EscalationEvent for each rubric item that this visit pushed to a second critical violation within 365 days, which itself raises Location.escalation_level and re-derives franchise_agreement_status"
          - "the Location changes then recompute Franchisee.open_default_location_count, Franchisee.termination_recommended, Brand.default_location_count, and Brand.brand_risk_index"
      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /audit-visits/{id}/void"
        actor: BrandAdmin
        preconditions:
          - "void_reason is provided"
        side_effects:
          - "sets void_reason"
        note: "Branch 1 of the void fork: nothing was scored, so no downstream recompute occurs."
      - from: IN_PROGRESS
        to: VOIDED
        trigger: "POST /audit-visits/{id}/void, or system cascade when the visit's Auditor is suspended"
        actor: BrandAdmin | system
        preconditions:
          - "void_reason is provided"
        side_effects:
          - "sets void_reason"
          - "deletes no ScoredItem, but every ScoredItem of this visit stops contributing to any calculation"
        note: "Branch 2 of the void fork."
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /audit-visits/{id}/void"
        actor: BrandAdmin
        preconditions:
          - "void_reason is provided"
          - "no ScoredItem of this visit is UNDER_DISPUTE"
        side_effects:
          - "sets void_reason"
          - "clears composite_score, composite_variant, and grade to null"
        note: "Branch 3 of the void fork: only PROVISIONAL numbers existed, so no Location field moves."
      - from: FINALIZED
        to: VOIDED
        trigger: "POST /audit-visits/{id}/void"
        actor: BrandAdmin
        preconditions:
          - "void_reason is provided"
          - "no ScoredItem of this visit is UNDER_DISPUTE"
          - "no CorrectiveAction created by this visit is VERIFIED"
        side_effects:
          - "sets void_reason and clears composite_score, composite_variant, grade, and health_component_percent to null"
          - "decrements Auditor.finalized_visit_count by 1"
          - "transitions every non-terminal CorrectiveAction created by this visit to VOIDED, each of which lowers Location.open_corrective_action_count by 1"
          - "appends one VOID_REVERSAL EscalationEvent per EscalationEvent this visit had appended, which itself lowers Location.escalation_level and re-derives franchise_agreement_status"
          - "recomputes Location.standing_score, latest_grade, repeat_violation_count and then Brand.brand_risk_index"
        note: "Branch 4 of the void fork: the compensating branch; see calculations and the compensating invariants in §1.8."

  - entity: ScoredItem
    initial_state: SCORED
    terminal_states: [AMENDED, UPHELD]
    transitions:
      - from: SCORED
        to: UNDER_DISPUTE
        trigger: "POST /disputes"
        actor: Franchisee
        preconditions:
          - "the parent AuditVisit is FINALIZED"
          - "no other Dispute on this ScoredItem is in FILED, INFO_REQUESTED, or EVIDENCE_REVIEW"
        side_effects:
          - "the item stops being eligible for finalize, rescore, and void operations on its visit"
      - from: UNDER_DISPUTE
        to: SCORED
        trigger: "POST /disputes/{id}/withdraw"
        actor: Franchisee
        preconditions:
          - "the acting Franchisee.id equals Dispute.filed_by_franchisee_id"
        side_effects:
          - "the item becomes disputable again"
        note: "Cycle edge: SCORED -> UNDER_DISPUTE -> SCORED."
      - from: UNDER_DISPUTE
        to: AMENDED
        trigger: "POST /disputes/{id}/resolve with outcome AMENDED"
        actor: CalibrationReviewer
        preconditions:
          - "the Dispute is EVIDENCE_REVIEW"
          - "granted_points differs from points_awarded"
        side_effects:
          - "sets amended_points_awarded and recomputes effective_points_awarded, is_violation, and severity"
          - "the recomputed severity then recomputes the parent AuditVisit's section percents, critical_violation_count, critical_penalty_points, FINAL composite_score, and grade"
          - "the visit recompute then recomputes Location.standing_score, latest_grade, and repeat_violation_count"
          - "when severity drops out of CRITICAL, the non-terminal CorrectiveAction on this item transitions to VOIDED, which itself lowers Location.open_corrective_action_count and appends a VOID_REVERSAL EscalationEvent when that action had escalated"
          - "the Location changes then recompute Brand.brand_risk_index"
      - from: UNDER_DISPUTE
        to: UPHELD
        trigger: "POST /disputes/{id}/resolve with outcome UPHELD"
        actor: CalibrationReviewer
        preconditions:
          - "the Dispute is EVIDENCE_REVIEW"
        side_effects:
          - "leaves points_awarded, the visit composite, and every Location field unchanged"

  - entity: CorrectiveAction
    initial_state: ASSIGNED
    terminal_states: [VERIFIED, VOIDED]
    transitions:
      - from: ASSIGNED
        to: SUBMITTED
        trigger: "POST /corrective-actions/{id}/submit"
        actor: Franchisee
        preconditions:
          - "acting Franchisee.id equals assigned_franchisee_id"
          - "evidence_photo_count is at least 1"
        side_effects:
          - "increments submission_count by 1 and sets submitted_at to the logical clock"
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /corrective-actions/{id}/verify with outcome ACCEPTED"
        actor: Auditor
        preconditions:
          - "the acting auditor is CERTIFIED"
        side_effects:
          - "sets verified_at to the logical clock"
          - "decrements Location.open_corrective_action_count by 1"
          - "recomputes Brand.brand_risk_index"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /corrective-actions/{id}/verify with outcome REJECTED"
        actor: Auditor
        preconditions:
          - "the acting auditor is CERTIFIED"
          - "rejection_reason is provided"
        side_effects:
          - "increments rejection_count by 1"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /corrective-actions/{id}/submit"
        actor: Franchisee
        preconditions:
          - "acting Franchisee.id equals assigned_franchisee_id"
          - "evidence_photo_count is at least 1"
        side_effects:
          - "increments submission_count by 1 and sets submitted_at to the logical clock"
        note: "Cycle edge: SUBMITTED -> REJECTED -> SUBMITTED."
      - from: ASSIGNED
        to: OVERDUE
        trigger: "POST /overdue-sweeps"
        actor: BrandAdmin
        preconditions:
          - "logical clock is strictly after due_at"
        side_effects:
          - "when severity is CRITICAL the action immediately continues OVERDUE -> ESCALATED"
      - from: REJECTED
        to: OVERDUE
        trigger: "POST /overdue-sweeps"
        actor: BrandAdmin
        preconditions:
          - "logical clock is strictly after due_at"
        side_effects:
          - "when severity is CRITICAL the action immediately continues OVERDUE -> ESCALATED"
      - from: OVERDUE
        to: ESCALATED
        trigger: "system cascade from the OVERDUE transition when severity is CRITICAL"
        actor: system
        preconditions:
          - "severity is CRITICAL"
        side_effects:
          - "sets escalated_at to the logical clock"
          - "lowers Location.open_corrective_action_count by 1, because an ESCALATED action leaves the open remediation pool for the franchise-agreement track"
          - "appends an OVERDUE_CRITICAL EscalationEvent, which itself raises Location.escalation_level and re-derives Location.franchise_agreement_status"
          - "the Location change then recomputes Franchisee.open_default_location_count, Franchisee.termination_recommended, Brand.default_location_count, and Brand.brand_risk_index"
      - from: OVERDUE
        to: SUBMITTED
        trigger: "POST /corrective-actions/{id}/submit"
        actor: Franchisee
        preconditions:
          - "acting Franchisee.id equals assigned_franchisee_id"
          - "severity is STANDARD"
          - "evidence_photo_count is at least 1"
        side_effects:
          - "increments submission_count by 1 and sets submitted_at to the logical clock"
        note: "Late cure is only available for STANDARD severity; a CRITICAL action has already left OVERDUE for ESCALATED."
      - from: ESCALATED
        to: VOIDED
        trigger: "system cascade from a dispute amendment or a FINALIZED visit void"
        actor: system
        preconditions:
          - "the originating ScoredItem is AMENDED out of CRITICAL severity, or the originating AuditVisit is being voided"
        side_effects:
          - "appends a VOID_REVERSAL EscalationEvent, which itself lowers Location.escalation_level and re-derives franchise_agreement_status"
      - from: ASSIGNED
        to: VOIDED
        trigger: "system cascade from a dispute amendment or a FINALIZED visit void"
        actor: system
        preconditions:
          - "the originating ScoredItem is AMENDED out of violation, or the originating AuditVisit is being voided"
        side_effects:
          - "decrements Location.open_corrective_action_count by 1"

  - entity: Dispute
    initial_state: FILED
    terminal_states: [UPHELD, AMENDED, WITHDRAWN]
    transitions:
      - from: FILED
        to: INFO_REQUESTED
        trigger: "POST /disputes/{id}/request-info"
        actor: CalibrationReviewer
        preconditions:
          - "the acting auditor is CERTIFIED and is not the scoring auditor of the disputed visit"
          - "info_request_count is less than 2"
        side_effects:
          - "increments info_request_count by 1"
          - "sets reviewer_auditor_id to the acting auditor when it is null"
      - from: FILED
        to: EVIDENCE_REVIEW
        trigger: "POST /disputes/{id}/supplement"
        actor: Franchisee
        preconditions:
          - "acting Franchisee.id equals filed_by_franchisee_id"
          - "at least one EvidencePhoto references this dispute"
        side_effects: []
      - from: INFO_REQUESTED
        to: EVIDENCE_REVIEW
        trigger: "POST /disputes/{id}/supplement"
        actor: Franchisee
        preconditions:
          - "acting Franchisee.id equals filed_by_franchisee_id"
          - "at least one EvidencePhoto references this dispute"
        side_effects: []
      - from: EVIDENCE_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /disputes/{id}/request-info"
        actor: CalibrationReviewer
        preconditions:
          - "the acting auditor is not the scoring auditor of the disputed visit"
          - "info_request_count is less than 2"
        side_effects:
          - "increments info_request_count by 1"
        note: "Cycle edge: EVIDENCE_REVIEW -> INFO_REQUESTED -> EVIDENCE_REVIEW, capped at 2 rounds."
      - from: EVIDENCE_REVIEW
        to: AMENDED
        trigger: "POST /disputes/{id}/resolve with outcome AMENDED"
        actor: CalibrationReviewer
        preconditions:
          - "the acting auditor is not the scoring auditor of the disputed visit"
          - "granted_points is between the scored item's points_awarded (exclusive) and the rubric item's max_points (inclusive)"
        side_effects:
          - "sets resolution_points and resolved_at"
          - "drives the ScoredItem UNDER_DISPUTE -> AMENDED transition and its cascade"
      - from: EVIDENCE_REVIEW
        to: UPHELD
        trigger: "POST /disputes/{id}/resolve with outcome UPHELD"
        actor: CalibrationReviewer
        preconditions:
          - "the acting auditor is not the scoring auditor of the disputed visit"
        side_effects:
          - "sets resolution_points to the scored item's points_awarded and sets resolved_at"
          - "drives the ScoredItem UNDER_DISPUTE -> UPHELD transition"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /disputes/{id}/withdraw"
        actor: Franchisee
        preconditions:
          - "acting Franchisee.id equals filed_by_franchisee_id"
        side_effects:
          - "sets resolved_at and returns the ScoredItem to SCORED"
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /disputes/{id}/withdraw"
        actor: Franchisee
        preconditions:
          - "acting Franchisee.id equals filed_by_franchisee_id"
        side_effects:
          - "sets resolved_at and returns the ScoredItem to SCORED"
      - from: EVIDENCE_REVIEW
        to: WITHDRAWN
        trigger: "POST /disputes/{id}/withdraw"
        actor: Franchisee
        preconditions:
          - "acting Franchisee.id equals filed_by_franchisee_id"
        side_effects:
          - "sets resolved_at and returns the ScoredItem to SCORED"

  - entity: Auditor
    initial_state: PROVISIONAL
    terminal_states: []
    transitions:
      - from: PROVISIONAL
        to: CERTIFIED
        trigger: "POST /auditors/{id}/certify"
        actor: BrandAdmin
        preconditions:
          - "reliability_score is at least 70.00"
        side_effects:
          - "sets certification_period_start to the logical clock and clears suspension_reason"
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /auditors/{id}/suspend, or system cascade when a CalibrationRecord drops reliability_score below 60.00"
        actor: BrandAdmin | system
        preconditions:
          - "the auditor is CERTIFIED"
        side_effects:
          - "sets suspension_reason to MANUAL_REVIEW for the endpoint path and RELIABILITY_BELOW_FLOOR for the cascade path"
          - "voids every IN_PROGRESS AuditVisit of this auditor with void_reason AUDITOR_SUSPENDED"
          - "leaves SCHEDULED visits untouched; they are blocked at start with ERR_AUDITOR_SUSPENDED"
      - from: PROVISIONAL
        to: SUSPENDED
        trigger: "POST /auditors/{id}/suspend"
        actor: BrandAdmin
        preconditions: []
        side_effects:
          - "sets suspension_reason to MANUAL_REVIEW"
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /auditors/{id}/certify"
        actor: BrandAdmin
        preconditions:
          - "reliability_score is at least 70.00"
        side_effects:
          - "resets certification_period_start to the logical clock and clears suspension_reason"
        note: "Cycle edge: CERTIFIED -> SUSPENDED -> CERTIFIED; the reset also restarts the CERTIFICATION_REVIEW reliability window."

  - entity: RubricVersion
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /rubric-versions/{id}/publish"
        actor: BrandAdmin
        preconditions:
          - "item_count is at least 1"
          - "critical_item_count is at least 1"
          - "the sum of its RubricItem.max_points equals total_points"
          - "each of FOOD_SAFETY, BRAND_STANDARDS, and FACILITY has at least one RubricItem"
        side_effects:
          - "sets published_at to the logical clock"
          - "when supersedes_rubric_version_id is set and that version is PUBLISHED, transitions it to RETIRED"
      - from: PUBLISHED
        to: RETIRED
        trigger: "system cascade when a successor RubricVersion is published"
        actor: system
        preconditions:
          - "the successor names this version in supersedes_rubric_version_id"
        side_effects:
          - "existing AuditVisits keep their pinned rubric_version_id and continue to score against it"
          - "new AuditVisits may no longer reference this version"

  - entity: Location
    initial_state: GOOD_STANDING
    terminal_states: []
    transitions:
      - from: GOOD_STANDING
        to: NOTICE_OF_DEFAULT
        trigger: "system cascade when the EscalationEvent ledger drives escalation_level to 1"
        actor: system
        preconditions:
          - "escalation_level becomes exactly 1"
        side_effects:
          - "recomputes Franchisee.open_default_location_count and Brand.default_location_count"
      - from: NOTICE_OF_DEFAULT
        to: CURE_PERIOD
        trigger: "system cascade when the EscalationEvent ledger drives escalation_level to 2"
        actor: system
        preconditions:
          - "escalation_level becomes exactly 2"
        side_effects:
          - "sets cure_period_started_at to the logical clock"
      - from: CURE_PERIOD
        to: TERMINATION_RECOMMENDED
        trigger: "system cascade when the EscalationEvent ledger drives escalation_level to 3 or more"
        actor: system
        preconditions:
          - "escalation_level becomes at least 3"
        side_effects:
          - "sets Franchisee.termination_recommended to true"
      - from: CURE_PERIOD
        to: NOTICE_OF_DEFAULT
        trigger: "POST /locations/{id}/cure-acceptance"
        actor: BrandAdmin
        preconditions:
          - "franchise_agreement_status is CURE_PERIOD"
          - "open_corrective_action_count is 0"
        side_effects:
          - "appends a CURE_ACCEPTED EscalationEvent, which itself lowers escalation_level by 1 and re-derives franchise_agreement_status"
          - "clears cure_period_started_at"
        note: "Cycle edge: NOTICE_OF_DEFAULT -> CURE_PERIOD -> NOTICE_OF_DEFAULT."
      - from: NOTICE_OF_DEFAULT
        to: GOOD_STANDING
        trigger: "POST /locations/{id}/cure-acceptance"
        actor: BrandAdmin
        preconditions:
          - "franchise_agreement_status is NOTICE_OF_DEFAULT"
          - "open_corrective_action_count is 0"
        side_effects:
          - "appends a CURE_ACCEPTED EscalationEvent, which itself lowers escalation_level to 0 and re-derives franchise_agreement_status"
          - "recomputes Franchisee.open_default_location_count, Brand.default_location_count, and Brand.brand_risk_index"

concurrency_rules:
  - rule_id: rubric-version-create-stale-brand
    parent_entity: Brand
    write_endpoint: "POST /rubric-versions"
    occ_field: "expected_brand_version"
    description: |
      Creating a RubricVersion against a Brand whose version has advanced since
      the client last observed it is rejected as stale. A new rubric version may
      legitimately supersede the brand's current one, so a writer holding an
      out-of-date view of the brand must re-read before drafting.
    error_id: ERR_STALE_BRAND_VERSION
    http_status: 412
  - rule_id: visit-rescore-stale-visit
    parent_entity: AuditVisit
    write_endpoint: "POST /audit-visits/{id}/rescore"
    occ_field: "expected_visit_version"
    description: |
      Rescoring a SUBMITTED visit whose version has advanced since the client
      last read it is rejected as stale. A rescore legitimately overwrites the
      points on a scored item, so a writer whose view of the visit predates an
      earlier accepted rescore must re-read the visit first.
    error_id: ERR_STALE_VISIT_VERSION
    http_status: 412

calculations:
  - name: visit_section_percent
    trigger: "On POST /audit-visits/{id}/submit, POST /audit-visits/{id}/rescore, POST /audit-visits/{id}/finalize, and on a dispute amendment that changes a ScoredItem"
    algorithm: weighted_scoring
    formula: |
      For each section S in [FOOD_SAFETY, BRAND_STANDARDS, FACILITY]:
        items(S) = every RubricItem of the visit's rubric_version_id whose section == S,
                   taken in display_order ASC
        for each item i in items(S):
            awarded_i = effective_points_awarded of the ScoredItem for i, or 0 when no
                        ScoredItem exists for i (non-critical items may be left unscored)
            # PINNED ORDER (mode b): round EACH item's percent to 2dp FIRST
            item_pct_i = ROUND_HALF_UP(awarded_i / RubricItem.max_points * 100, 2)
        section_percent(S) = ROUND_HALF_UP(SUM(item_pct_i) / COUNT(items(S)), 2)
      # The forbidden alternative order is ROUND(SUM(awarded)/SUM(max_points)*100, 2);
      # it yields a different number and, through the composite, a different grade.
    input_set: "RubricItems of the visit's pinned rubric_version_id and the visit's ScoredItems; VOIDED visits compute nothing"
    constants:
      SECTION_WEIGHT_FOOD_SAFETY: 0.50
      SECTION_WEIGHT_BRAND_STANDARDS: 0.30
      SECTION_WEIGHT_FACILITY: 0.20
    precision: "2 decimal places, round_half_up, per item and again per section"

  - name: visit_rubric_percent
    trigger: "Immediately after visit_section_percent, on the same operations"
    algorithm: weighted_scoring
    formula: |
      rubric_percent = ROUND_HALF_UP(
          0.50 * food_safety_percent
        + 0.30 * brand_standards_percent
        + 0.20 * facility_percent, 2)
    input_set: "The three section percents of this visit"
    constants:
      SECTION_WEIGHT_FOOD_SAFETY: 0.50
      SECTION_WEIGHT_BRAND_STANDARDS: 0.30
      SECTION_WEIGHT_FACILITY: 0.20
    precision: "2 decimal places, round_half_up"

  - name: critical_penalty_points
    trigger: "Immediately after visit_rubric_percent, on the same operations"
    algorithm: threshold
    formula: |
      critical_violation_count = COUNT of ScoredItems of this visit whose severity == CRITICAL
      critical_penalty_points =
          0.00  when critical_violation_count == 0
          5.00  when critical_violation_count == 1
         12.00  when critical_violation_count == 2
         25.00  when critical_violation_count >= 3
      base_score = MAX(0.00, ROUND_HALF_UP(rubric_percent - critical_penalty_points, 2))
    input_set: "ScoredItems of this visit whose RubricItem.is_critical is true and whose effective_points_awarded is below max_points"
    constants:
      PENALTY_ONE: 5.00
      PENALTY_TWO: 12.00
      PENALTY_THREE_OR_MORE: 25.00
      SCORE_FLOOR: 0.00
    precision: "2 decimal places, round_half_up"

  - name: health_component_percent
    trigger: "On POST /audit-visits/{id}/finalize, before the FINAL composite is computed"
    algorithm: chronological
    formula: |
      window_start = visit.scheduled_start_at
      eligible = HealthInspections H where
            H.location_id == visit.location_id
        AND H.status == RECORDED
        AND H.inspection_date <= window_start
        AND H.inspection_date >= window_start - 180 days
      if eligible is empty:
          linked_health_inspection_id = null
          health_component_percent   = null
      else:
          selected = eligible ordered by inspection_date DESC, then created_at DESC, take first
          raw_pct  = ROUND_HALF_UP(selected.points_scored / selected.points_possible * 100, 2)
          cap      = 100.00 for letter_grade A or B, 79.00 for C, 0.00 for FAIL
          health_component_percent = MIN(raw_pct, cap)
          linked_health_inspection_id = selected.id
    input_set: "RECORDED HealthInspections of the visit's location dated in the 180-day lookback ending at the visit's scheduled_start_at; DISREGARDED inspections are excluded"
    constants:
      LOOKBACK_DAYS: 180
      CAP_GRADE_C: 79.00
      CAP_GRADE_FAIL: 0.00
    precision: "2 decimal places, round_half_up"

  - name: visit_composite_score
    trigger: "On submit and rescore (PROVISIONAL) and on finalize and dispute amendment (FINAL)"
    algorithm: weighted_scoring
    formula: |
      PROVISIONAL: composite = ROUND_HALF_UP(0.60 * base_score + 0.40 * food_safety_percent, 2)
      FINAL:       composite = ROUND_HALF_UP(0.45 * base_score
                                           + 0.30 * food_safety_percent
                                           + 0.25 * health_component_percent, 2)
      When health_component_percent is null at finalize, the FINAL variant falls back to
      the PROVISIONAL weight set (0.60 / 0.40) but composite_variant is still FINAL.
    input_set: "base_score and food_safety_percent of this visit, plus the selected HealthInspection for the FINAL variant"
    constants:
      PROVISIONAL_WEIGHT_BASE: 0.60
      PROVISIONAL_WEIGHT_FOOD_SAFETY: 0.40
      FINAL_WEIGHT_BASE: 0.45
      FINAL_WEIGHT_FOOD_SAFETY: 0.30
      FINAL_WEIGHT_HEALTH: 0.25
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "Computed at submit and at every rescore, while the visit is SUBMITTED"
        difference: "Ignores health-department data entirely and re-weights the rubric base at 0.60 with food safety at 0.40"
      - name: FINAL
        when: "Computed at finalize and recomputed after a dispute amendment on a FINALIZED visit"
        difference: "Admits the selected HealthInspection at 0.25 and dilutes the rubric base to 0.45 and food safety to 0.30, so identical scored items yield a different composite and can yield a different grade"

  - name: visit_grade
    trigger: "Immediately after any composite computation"
    algorithm: threshold
    formula: |
      if critical_violation_count >= 2: grade = FAIL          # override wins over the score bands
      elif composite_score >= 90.00:   grade = PASS
      elif composite_score >= 80.00:   grade = CONDITIONAL
      else:                            grade = FAIL
    input_set: "composite_score and critical_violation_count of this visit"
    constants:
      PASS_THRESHOLD: 90.00
      CONDITIONAL_THRESHOLD: 80.00
      CRITICAL_FAIL_COUNT: 2
    precision: "Comparisons are inclusive at the threshold (>=)"

  - name: location_standing_score
    trigger: "On visit finalize, visit void, dispute amendment, and cure acceptance"
    algorithm: decay_function
    formula: |
      visits = FINALIZED AuditVisits of this location, visit_type != SHADOW,
               ordered by finalized_at DESC, then created_at DESC, take at most 3
      if visits is empty:
          standing_score = 0.00; latest_grade = null; RETURN
      weights = [0.50, 0.30, 0.20] truncated to COUNT(visits)
      renormalized w_k = weights[k] / SUM(weights)
      base = ROUND_HALF_UP(SUM(w_k * visits[k].composite_score), 2)
      # EVALUATION ORDER IS PINNED (mode c): the penalty tier is keyed off the
      # PRE-penalty base, never off the post-penalty standing score.
      per_unit = 0.50 when base >= 90.00
                 1.00 when base >= 80.00
                 2.00 otherwise
      standing_score = MAX(0.00, ROUND_HALF_UP(base - per_unit * repeat_violation_count, 2))
      latest_grade   = visits[0].grade
    input_set: "The three most recent FINALIZED non-SHADOW visits of the location; VOIDED, SUBMITTED, IN_PROGRESS, and SCHEDULED visits are excluded"
    constants:
      RECENCY_WEIGHT_1: 0.50
      RECENCY_WEIGHT_2: 0.30
      RECENCY_WEIGHT_3: 0.20
      PENALTY_PER_UNIT_HIGH_BASE: 0.50
      PENALTY_PER_UNIT_MID_BASE: 1.00
      PENALTY_PER_UNIT_LOW_BASE: 2.00
    precision: "2 decimal places, round_half_up; renormalized weights are carried at full precision and rounded once"

  - name: location_repeat_violation_count
    trigger: "On visit finalize, visit void, and dispute amendment"
    algorithm: aggregation
    formula: |
      window_start = logical_clock - 365 days
      visits = FINALIZED AuditVisits of this location with finalized_at >= window_start
      for each rubric_item_id R:
          hits(R) = COUNT of DISTINCT visits in `visits` holding a ScoredItem on R with severity == CRITICAL
      repeat_violation_count = COUNT of R where hits(R) >= 2
    input_set: "FINALIZED visits of the location inside the trailing 365 days; rubric items are matched by rubric_item_id, so the same item code in a superseding RubricVersion is a different item"
    constants:
      LOOKBACK_DAYS: 365
      REPEAT_THRESHOLD: 2
    precision: "Integer count"

  - name: corrective_action_due_at
    trigger: "On POST /audit-visits/{id}/finalize, once per violating ScoredItem"
    algorithm: threshold
    formula: |
      due_at = visit.finalized_at + 72 hours  when severity == CRITICAL
      due_at = visit.finalized_at + 14 days   when severity == STANDARD
    input_set: "ScoredItems of the finalized visit whose is_violation is true"
    constants:
      CRITICAL_DUE_HOURS: 72
      STANDARD_DUE_DAYS: 14
    precision: "Whole seconds, ISO 8601 UTC"

  - name: calibration_variance_and_delta
    trigger: "On POST /calibration-records"
    algorithm: threshold
    formula: |
      variance_points = ROUND_HALF_UP(ABS(shadow_visit.composite_score
                                        - primary_visit.composite_score), 2)
      band / reliability_delta =
          variance_points <=  2.00 -> EXCELLENT,    +4.00
          variance_points <=  5.00 -> ACCEPTABLE,   +1.00
          variance_points <= 10.00 -> MARGINAL,     -3.00
          otherwise                -> UNACCEPTABLE, -8.00
    input_set: "The SHADOW visit and the visit named by its shadow_of_visit_id; both must have a non-null composite_score"
    constants:
      BAND_EXCELLENT_MAX: 2.00
      BAND_ACCEPTABLE_MAX: 5.00
      BAND_MARGINAL_MAX: 10.00
      DELTA_EXCELLENT: 4.00
      DELTA_ACCEPTABLE: 1.00
      DELTA_MARGINAL: -3.00
      DELTA_UNACCEPTABLE: -8.00
    precision: "2 decimal places, round_half_up; band comparisons are inclusive at the upper bound"

  - name: auditor_reliability_score
    trigger: "On POST /calibration-records (ROLLING) and on POST /auditors/{id}/certify (CERTIFICATION_REVIEW)"
    algorithm: decay_function
    formula: |
      ROLLING:
        records = CalibrationRecords with auditor_id == this auditor,
                  ordered by recorded_at DESC, then created_at DESC, take at most 3
        decay   = [1.00, 0.60, 0.30]
        score   = CLAMP(0.00, 100.00,
                        ROUND_HALF_UP(70.00 + SUM(decay[k] * records[k].reliability_delta), 2))
      CERTIFICATION_REVIEW:
        records = CalibrationRecords with auditor_id == this auditor and
                  recorded_at >= auditor.certification_period_start (all of them, no cap)
        score   = CLAMP(0.00, 100.00,
                        ROUND_HALF_UP(70.00 + SUM(records[k].reliability_delta), 2))
      After the ROLLING recompute, a CERTIFIED auditor whose score < 60.00 is suspended
      with suspension_reason RELIABILITY_BELOW_FLOOR.
    input_set: "CalibrationRecords naming this auditor as the audited party (auditor_id), never as reviewer_auditor_id"
    constants:
      BASELINE_SCORE: 70.00
      DECAY_1: 1.00
      DECAY_2: 0.60
      DECAY_3: 0.30
      ROLLING_WINDOW_SIZE: 3
      SUSPENSION_FLOOR: 60.00
      CERTIFICATION_FLOOR: 70.00
    precision: "2 decimal places, round_half_up, clamped to [0.00, 100.00]"
    variants:
      - name: ROLLING
        when: "Recomputed on every new CalibrationRecord and stored on Auditor.reliability_score"
        difference: "Only the three newest records count and they are decay-weighted 1.00 / 0.60 / 0.30"
      - name: CERTIFICATION_REVIEW
        when: "Evaluated by POST /auditors/{id}/certify against the CERTIFICATION_FLOOR"
        difference: "Every record since certification_period_start counts at full weight and none are dropped, so the certification gate can read a materially different number than the stored rolling score"

  - name: brand_risk_index
    trigger: "On visit finalize, visit void, dispute amendment, corrective-action verify, corrective-action escalation, and cure acceptance"
    algorithm: aggregation
    formula: |
      rated = Locations of this brand whose latest_grade is not null
      if rated is empty:
          brand_risk_index = 0.00; brand_risk_tier = BASELINE; RETURN
      avg_standing  = ROUND_HALF_UP(SUM(rated.standing_score) / COUNT(rated), 2)
      deficit       = 100.00 - avg_standing
      open_critical = COUNT of CorrectiveActions of this brand with severity == CRITICAL
                      and status in [ASSIGNED, SUBMITTED, REJECTED, OVERDUE, ESCALATED]
      crit_part     = MIN(40.00,  6.00 * open_critical)
      default_part  = MIN(30.00, 10.00 * brand.default_location_count)
      fail_part     = 15.00 when any rated Location.latest_grade == FAIL else 0.00
      brand_risk_index = MIN(100.00,
          ROUND_HALF_UP(0.60 * deficit + crit_part + default_part + fail_part, 2))
      brand_risk_tier  = SEVERE   when brand_risk_index >= 60.00
                         ELEVATED when brand_risk_index >= 35.00
                         BASELINE otherwise
    input_set: "Locations of the brand that have at least one FINALIZED visit; unrated locations neither raise nor dilute the index"
    constants:
      DEFICIT_WEIGHT: 0.60
      CRITICAL_UNIT: 6.00
      CRITICAL_CAP: 40.00
      DEFAULT_UNIT: 10.00
      DEFAULT_CAP: 30.00
      FAIL_GRADE_SURCHARGE: 15.00
      INDEX_CAP: 100.00
      TIER_SEVERE: 60.00
      TIER_ELEVATED: 35.00
    precision: "2 decimal places, round_half_up"

  - name: location_agreement_status
    trigger: "On every EscalationEvent append"
    algorithm: projection
    formula: |
      events = EscalationEvents of this location ordered by occurred_at ASC, then created_at ASC
      escalation_level = MAX(0, SUM over events of event.level_delta) where
          level_delta = +1 for REPEAT_CRITICAL and OVERDUE_CRITICAL
          level_delta = -1 for CURE_ACCEPTED and VOID_REVERSAL
      franchise_agreement_status =
          GOOD_STANDING           when escalation_level == 0
          NOTICE_OF_DEFAULT       when escalation_level == 1
          CURE_PERIOD             when escalation_level == 2
          TERMINATION_RECOMMENDED when escalation_level >= 3
    input_set: "The full append-only EscalationEvent ledger of the location; the ledger is never pruned"
    constants:
      LEVEL_NOTICE: 1
      LEVEL_CURE: 2
      LEVEL_TERMINATION: 3
    precision: "Integer level; the level floor is 0"

  - name: location_unannounced_ratio_pct
    trigger: "On POST /audit-visits, before the visit is persisted"
    algorithm: aggregation
    formula: |
      pivot  = candidate.scheduled_start_at
      window = [pivot - 182 days, pivot + 182 days]   # inclusive on both ends, centered
      calendar = AuditVisits of the candidate's location with
            visit_type in [ANNOUNCED, UNANNOUNCED]
        AND status in [SCHEDULED, IN_PROGRESS, SUBMITTED, FINALIZED]
        AND scheduled_start_at inside window
      total_count       = COUNT(calendar) + 1                              # candidate included
      unannounced_count = COUNT(calendar where visit_type == UNANNOUNCED)
                          + (1 when candidate.visit_type == UNANNOUNCED else 0)
      ratio_pct = ROUND_HALF_UP(unannounced_count / total_count * 100, 2)
      Creation is rejected when ratio_pct < brand.unannounced_min_ratio_pct.
      SHADOW visits never enter the calendar mix on either side of the fraction.
    input_set: "Non-VOIDED, non-SHADOW visits of the location inside the centered 364-day window, plus the candidate itself"
    constants:
      WINDOW_HALF_WIDTH_DAYS: 182
      ANNOUNCED_NOTICE_HOURS: 72
    precision: "2 decimal places, round_half_up; the comparison against the brand minimum is inclusive (ratio_pct >= minimum passes)"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The acting role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every id in the URL path exists, validated left to right"
    error_id: "ERR_BRAND_NOT_FOUND | ERR_FRANCHISEE_NOT_FOUND | ERR_AUDITOR_NOT_FOUND | ERR_LOCATION_NOT_FOUND | ERR_RUBRIC_VERSION_NOT_FOUND | ERR_VISIT_NOT_FOUND | ERR_SCORED_ITEM_NOT_FOUND | ERR_CORRECTIVE_ACTION_NOT_FOUND | ERR_DISPUTE_NOT_FOUND | ERR_HEALTH_INSPECTION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 4
    category: auth
    check: "For entity_backed roles, X-User-ID resolves to an existing instance of the backing entity"
    error_id: ERR_ACTING_IDENTITY_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints whose roles include Auditor, CalibrationReviewer, or Franchisee"
  - priority: 5
    category: auth
    check: "The acting entity owns the target resource: Auditor.id equals visit.auditor_id, or Franchisee.id equals the corrective action's assigned_franchisee_id, or Franchisee.id equals the dispute's filed_by_franchisee_id, or Franchisee.id equals the location's franchisee_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /audit-visits/{id}/start, POST /audit-visits/{id}/submit, POST /audit-visits/{id}/rescore, POST /audit-visits/{id}/scored-items, POST /corrective-actions/{id}/submit, POST /disputes, POST /disputes/{id}/supplement, POST /disputes/{id}/withdraw, POST /evidence-photos"
  - priority: 6
    category: business_constraint
    check: "Request body is well formed: required fields present, types correct, enums in range, integers within declared bounds, pagination limit between 1 and 100 and offset at least 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 7
    category: existence
    check: "Every foreign key in the request body references an existing row"
    error_id: "ERR_BRAND_NOT_FOUND | ERR_FRANCHISEE_NOT_FOUND | ERR_AUDITOR_NOT_FOUND | ERR_LOCATION_NOT_FOUND | ERR_RUBRIC_VERSION_NOT_FOUND | ERR_RUBRIC_ITEM_NOT_FOUND | ERR_VISIT_NOT_FOUND | ERR_SCORED_ITEM_NOT_FOUND | ERR_CORRECTIVE_ACTION_NOT_FOUND | ERR_DISPUTE_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints carrying foreign keys"
  - priority: 8
    category: state
    check: "The target resource is in a state the requested transition permits, per the matching §1.2 machine"
    error_id: "ERR_INVALID_VISIT_STATE | ERR_INVALID_CORRECTIVE_ACTION_STATE | ERR_INVALID_DISPUTE_STATE | ERR_INVALID_RUBRIC_STATE | ERR_INVALID_AUDITOR_STATE | ERR_NO_ESCALATION_TO_CURE"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 9
    category: state
    check: "A new AuditVisit references a RubricVersion whose status is PUBLISHED"
    error_id: ERR_RUBRIC_VERSION_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /audit-visits"
  - priority: 10
    category: state
    check: "expected_brand_version equals the Brand's current version"
    error_id: ERR_STALE_BRAND_VERSION
    http_status: 412
    applies_to: "POST /rubric-versions"
  - priority: 11
    category: state
    check: "expected_visit_version equals the AuditVisit's current version"
    error_id: ERR_STALE_VISIT_VERSION
    http_status: 412
    applies_to: "POST /audit-visits/{id}/rescore"
  - priority: 12
    category: business_safety
    check: "The auditor bound to the operation is not SUSPENDED"
    error_id: ERR_AUDITOR_SUSPENDED
    http_status: 409
    applies_to: "POST /audit-visits, POST /audit-visits/{id}/start, POST /corrective-actions/{id}/verify, POST /disputes/{id}/request-info, POST /disputes/{id}/resolve, POST /calibration-records"
  - priority: 13
    category: business_safety
    check: "The auditor bound to the operation is CERTIFIED (a PROVISIONAL auditor may not score, verify, or review)"
    error_id: ERR_AUDITOR_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /audit-visits/{id}/start, POST /corrective-actions/{id}/verify, POST /disputes/{id}/request-info, POST /disputes/{id}/resolve"
  - priority: 14
    category: business_safety
    check: "Segregation of duties: the acting CalibrationReviewer is not the auditor who scored the disputed visit, and the auditor of a SHADOW visit is not the auditor of its shadow_of_visit_id target"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /disputes/{id}/request-info, POST /disputes/{id}/resolve, POST /audit-visits, POST /calibration-records"
  - priority: 15
    category: business_safety
    check: "No ScoredItem of the visit is UNDER_DISPUTE"
    error_id: ERR_UNRESOLVED_DISPUTE
    http_status: 409
    applies_to: "POST /audit-visits/{id}/finalize, POST /audit-visits/{id}/rescore, POST /audit-visits/{id}/void"
  - priority: 16
    category: business_referential
    check: "A Location's franchisee_id references a Franchisee whose brand_id equals the Location's brand_id"
    error_id: ERR_FRANCHISEE_BRAND_MISMATCH
    http_status: 422
    applies_to: "POST /locations"
  - priority: 17
    category: business_referential
    check: "A ScoredItem's rubric_item_id belongs to the visit's pinned rubric_version_id"
    error_id: ERR_RUBRIC_ITEM_NOT_IN_VISIT_RUBRIC
    http_status: 422
    applies_to: "POST /audit-visits/{id}/scored-items"
  - priority: 18
    category: business_referential
    check: "shadow_of_visit_id is present exactly when visit_type is SHADOW"
    error_id: ERR_SHADOW_LINK_MISMATCH
    http_status: 422
    applies_to: "POST /audit-visits"
  - priority: 19
    category: business_referential
    check: "A SHADOW visit's target is a non-SHADOW visit at the same location using the same rubric_version_id and is not itself VOIDED"
    error_id: ERR_SHADOW_TARGET_INVALID
    http_status: 422
    applies_to: "POST /audit-visits"
  - priority: 20
    category: business_referential
    check: "An EvidencePhoto carries exactly one of corrective_action_id and dispute_id"
    error_id: ERR_EVIDENCE_TARGET_AMBIGUOUS
    http_status: 422
    applies_to: "POST /evidence-photos"
  - priority: 21
    category: business_referential
    check: "A CalibrationRecord's shadow visit has visit_type SHADOW, a non-null shadow_of_visit_id, and both visits carry a non-null composite_score"
    error_id: ERR_CALIBRATION_INPUTS_INCOMPLETE
    http_status: 422
    applies_to: "POST /calibration-records"
  - priority: 22
    category: business_temporal
    check: "scheduled_end_at is strictly after scheduled_start_at"
    error_id: ERR_INVALID_VISIT_WINDOW
    http_status: 422
    applies_to: "POST /audit-visits"
  - priority: 23
    category: business_temporal
    check: "An ANNOUNCED visit is scheduled at least 72 hours ahead of the logical clock (announced_notice_hours >= 72.00 passes)"
    error_id: ERR_ANNOUNCED_NOTICE_TOO_SHORT
    http_status: 422
    applies_to: "POST /audit-visits"
  - priority: 24
    category: business_temporal
    check: "The rubric version's effective_from is at or before scheduled_start_at"
    error_id: ERR_RUBRIC_NOT_EFFECTIVE
    http_status: 422
    applies_to: "POST /audit-visits"
  - priority: 25
    category: business_temporal
    check: "captured_at and inspection_date are not after the logical clock"
    error_id: ERR_TIMESTAMP_IN_FUTURE
    http_status: 422
    applies_to: "POST /evidence-photos, POST /health-inspections"
  - priority: 26
    category: business_temporal
    check: "Pairwise auditor occupation: the candidate half-open interval [scheduled_start_at, scheduled_end_at) does not intersect any non-VOIDED visit of the same auditor expanded by a 60-minute travel buffer on both ends"
    error_id: ERR_AUDITOR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /audit-visits"
  - priority: 27
    category: business_temporal
    check: "Aggregate location capacity: at most 2 non-VOIDED UNANNOUNCED visits may have scheduled_start_at inside the closed 14-day window centered on the candidate's scheduled_start_at (candidate counted)"
    error_id: ERR_LOCATION_VISIT_WINDOW_QUOTA
    http_status: 409
    applies_to: "POST /audit-visits"
  - priority: 28
    category: business_temporal
    check: "A visit may start no earlier than 60 minutes before scheduled_start_at"
    error_id: ERR_VISIT_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /audit-visits/{id}/start"
  - priority: 29
    category: business_constraint
    check: "The resulting unannounced ratio is at least the brand's unannounced_min_ratio_pct"
    error_id: ERR_UNANNOUNCED_MIX_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /audit-visits"
  - priority: 30
    category: business_constraint
    check: "points_awarded is between 0 and the RubricItem's max_points inclusive"
    error_id: ERR_POINTS_EXCEED_MAX
    http_status: 422
    applies_to: "POST /audit-visits/{id}/scored-items, POST /audit-visits/{id}/rescore"
  - priority: 31
    category: business_constraint
    check: "The rubric item has not already been scored on this visit"
    error_id: ERR_ITEM_ALREADY_SCORED
    http_status: 409
    applies_to: "POST /audit-visits/{id}/scored-items"
  - priority: 32
    category: business_constraint
    check: "Every critical RubricItem of the visit's rubric has a ScoredItem before submit"
    error_id: ERR_CRITICAL_ITEMS_UNSCORED
    http_status: 422
    applies_to: "POST /audit-visits/{id}/submit"
  - priority: 33
    category: business_constraint
    check: "rescore_count is below 2"
    error_id: ERR_RESCORE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /audit-visits/{id}/rescore"
  - priority: 34
    category: business_constraint
    check: "The sum of RubricItem.max_points equals total_points at publish"
    error_id: ERR_RUBRIC_TOTAL_MISMATCH
    http_status: 422
    applies_to: "POST /rubric-versions/{id}/publish"
  - priority: 35
    category: business_constraint
    check: "At publish the rubric holds at least one critical item and at least one item in each of FOOD_SAFETY, BRAND_STANDARDS, and FACILITY"
    error_id: ERR_RUBRIC_SECTION_INCOMPLETE
    http_status: 422
    applies_to: "POST /rubric-versions/{id}/publish"
  - priority: 36
    category: business_constraint
    check: "requested_points and granted_points are strictly above the scored item's points_awarded and at most the rubric item's max_points"
    error_id: ERR_DISPUTE_POINTS_INVALID
    http_status: 422
    applies_to: "POST /disputes, POST /disputes/{id}/resolve"
  - priority: 37
    category: business_constraint
    check: "No other Dispute on this ScoredItem is in FILED, INFO_REQUESTED, or EVIDENCE_REVIEW"
    error_id: ERR_DISPUTE_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /disputes"
  - priority: 38
    category: business_constraint
    check: "info_request_count is below 2"
    error_id: ERR_INFO_REQUEST_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /disputes/{id}/request-info"
  - priority: 39
    category: business_constraint
    check: "At least one EvidencePhoto is attached before a corrective action is submitted or a dispute is supplemented"
    error_id: ERR_EVIDENCE_REQUIRED
    http_status: 422
    applies_to: "POST /corrective-actions/{id}/submit, POST /disputes/{id}/supplement"
  - priority: 40
    category: business_constraint
    check: "A CRITICAL corrective action may not be cured after it left OVERDUE for ESCALATED"
    error_id: ERR_LATE_CURE_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /corrective-actions/{id}/submit"
  - priority: 41
    category: business_constraint
    check: "Cure acceptance requires open_corrective_action_count of 0"
    error_id: ERR_OPEN_CORRECTIVE_ACTIONS
    http_status: 409
    applies_to: "POST /locations/{id}/cure-acceptance"
  - priority: 42
    category: business_constraint
    check: "Certification requires the CERTIFICATION_REVIEW reliability score to be at least 70.00"
    error_id: ERR_RELIABILITY_BELOW_FLOOR
    http_status: 409
    applies_to: "POST /auditors/{id}/certify"
  - priority: 43
    category: business_constraint
    check: "A FINALIZED visit may not be voided once any CorrectiveAction it created is VERIFIED"
    error_id: ERR_VERIFIED_ACTION_BLOCKS_VOID
    http_status: 409
    applies_to: "POST /audit-visits/{id}/void"
  - priority: 44
    category: business_constraint
    check: "Only one CalibrationRecord may exist per shadow visit"
    error_id: ERR_CALIBRATION_ALREADY_RECORDED
    http_status: 409
    applies_to: "POST /calibration-records"
  - priority: 45
    category: business_constraint
    check: "brand_code, employee_code, and store_number (within brand) are unique"
    error_id: ERR_DUPLICATE_RESOURCE_CODE
    http_status: 409
    applies_to: "POST /brands, POST /auditors, POST /locations"
  - priority: 46
    category: business_constraint
    check: "version_label is unique within brand_id, and item_code and display_order are unique within rubric_version_id"
    error_id: ERR_DUPLICATE_RUBRIC_ENTRY
    http_status: 409
    applies_to: "POST /rubric-versions, POST /rubric-versions/{id}/rubric-items"

endpoints:
  - method: POST
    path: "/brands"
    description: "Register a restaurant brand"
    roles: [BrandAdmin]
    code: 201
    input: [name, brand_code, "unannounced_min_ratio_pct?"]
    output: Brand
    side_effects: ["initializes brand_risk_index to 0.00 and brand_risk_tier to BASELINE"]
  - method: GET
    path: "/brands/{id}"
    description: "Read a brand including its current risk index and version"
    roles: [BrandAdmin, ComplianceIntegrator]
    code: 200
    input: []
    output: Brand
    side_effects: []
  - method: GET
    path: "/brands/{id}/risk-index"
    description: "Computed read of the cross-location brand risk index and its components"
    roles: [BrandAdmin]
    code: 200
    input: []
    output:
      brand_id: string
      brand_risk_index: number
      brand_risk_tier: string
      average_standing_score: number
      rated_location_count: integer
      open_critical_action_count: integer
      default_location_count: integer
      fail_grade_surcharge_applied: boolean
    side_effects: ["recomputes calculations.brand_risk_index on read and persists the result on Brand"]
  - method: POST
    path: "/franchisees"
