            - "LaneAssignment.${l2}.status == OFFERED (unchanged)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: escrow_cap_exact_cent_reach
        grounds:
          - calculations.escrow_credit_on_finalize
          - entities.EscrowAccount.fields.balance_cents
          - state_machines.EscrowAccount.ACCUMULATING_to_FULL
        distinguishing_aspect: |
          Metric = escrow cents at the cap boundary (>= semantics): with cap 40001 the
          third weekly credit truncates to exactly 1 cent (balance 40001 -> FULL),
          and a fourth finalize credits 0. Endpoint under test: settlement finalize.
        test_recipe:
          setup:
            - "ACTIVE lease (weekly 65000, escrow 20000/wk, cap 40001); W1, W2 finalized (balance 40000, still ACCUMULATING)"
            - "W3, W4 issued in sequence"
          setup_api_calls:
            - { call: "POST /lease-program/owner-operators", payload: { legal_name: "Pat Owner", cdl_number: "CDL-BP1" }, as: LeaseAdmin, captures: { op: $.data.id } }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "W9", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d1: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d1}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "OPERATING_AUTHORITY", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d2: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d2}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "INSURANCE_CERTIFICATE", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d3: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d3}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/trucks", payload: { vin: "VIN-BP1", year: 2023, make: "Kenworth", model: "T680", odometer_current: 50000, powertrain_warranty_expires_on: "2027-01-01", powertrain_warranty_mileage_limit: 100000 }, as: LeaseAdmin, captures: { truck: $.data.id } }
            - { call: "POST /lease-program/lease-agreements", payload: { owner_operator_id: "${op}", truck_id: "${truck}", start_date: "2026-08-03", term_weeks: 52, weekly_payment_cents: 65000, escrow_weekly_contribution_cents: 20000, escrow_cap_cents: 40001, buyout_base_price_cents: 4500000, min_revenue_guarantee_weekly_cents: 150000 }, as: LeaseAdmin, captures: { lease: $.data.id } }
