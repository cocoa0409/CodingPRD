              captures: { case_id: $.data.id }
            - call: "POST /api/hearings"
              payload: { case_id: "${case_id}", courtroom_code: "DEPT-3", scheduled_start: "2026-07-02T09:00:00Z", scheduled_end: "2026-07-02T10:00:00Z" }
              as: Clerk
              captures: { h1_id: $.data.id }
            - call: "POST /api/hearings"
              payload: { case_id: "${case_id}", courtroom_code: "DEPT-3", scheduled_start: "2026-07-02T10:00:00Z", scheduled_end: "2026-07-02T11:00:00Z" }
              as: Clerk
              captures: { h2_id: $.data.id, h2_status: $.data.status }
          trigger:
            - call: "POST /api/hearings"
              payload: { case_id: "${case_id}", courtroom_code: "DEPT-3", scheduled_start: "2026-07-02T09:30:00Z", scheduled_end: "2026-07-02T10:30:00Z" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
