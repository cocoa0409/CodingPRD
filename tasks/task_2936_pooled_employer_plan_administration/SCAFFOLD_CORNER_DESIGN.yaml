            - call: "GET /pep/adopting-employers/${emp_p_id}"
              as: AdoptingEmployer
              as_user_id: "${emp_p_id}"
            - call: "GET /pep/plan-documents/${plan_id}"
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
            - call: "GET /pep/payroll-batches/${batch_id}/remittance-deposits"
              payload: { limit: 10, offset: 0 }
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
            - call: "GET /pep/plan-documents/${plan_id}"
              as: RegulatorOps
          assert:
            - "the post response itself already carries deposit_status POSTED, timeliness_status TIMELY, business_days_elapsed 5, late_by_business_days 0 and posted_at equal to the logical clock 2026-08-10T00:00:00Z — the caller needs no follow-up read to learn the outcome"
            - "the immediately following batch read shows status REMITTED with deposit_due_date 2026-08-12 and deposit_rule SMALL_PLAN_7_BUSINESS_DAY unchanged from creation"
            - "the immediately following employer read shows account_balance_cents 8500000 and adoption_status still ACTIVE with contribution_hold false: a timely deposit triggers no suspension"
            - "the immediately following plan read shows total_assets_cents 8500000, aggregate_receivable_cents 0 and contribution_control_delta_cents 0, all in the same call — no aggregate is left to a later sweep"
            - "the deposit listing under the batch returns total_count 1 and has_more false, and its single element is field-for-field identical to the post response's data object"
            - "the second plan read, by a different role, returns the same figures and the same version as the first: reads do not recompute or advance anything"

      - name: corner_consistency_writes_are_visible_at_once_across_roles_and_listings
        claim_type: behavior_defined
        grounds:
          - complexity_profile.consistency_model
          - response_envelope.pagination_fields
          - state_machines.AdoptingEmployer
        distinguishing_aspect: "Immediate consistency has to hold across readers, not just for the writer: a row created by one role appears in another role's listing on the very next call, and a derived counter on the parent moves in the same instant as the child transition that causes it. Interleaving two employers makes the counters observable — the plan's active_employer_count changes on the first approve and again on the second, never in a batch afterwards — and the paginated listing's total_count tracks each write with no lag."
        test_recipe:
          setup:
            - "Plan 001 ACTIVE with no employers yet; two employers are then admitted and approved one at a time, with reads interleaved by a different role after each write."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegulatorOps
            - call: "POST /pep/plan-providers"
              payload: { legal_name: "Meridian Pooled Plan Services LLC", ein: "410000001", fidelity_bond_amount_cents: 100000000 }
              as: RegulatorOps
              captures: { ppp_id: $.data.id }
            - call: "POST /pep/plan-providers/${ppp_id}/register"
              payload: { registration_effective_date: "2026-08-03" }
              as: RegulatorOps
            - call: "POST /pep/plan-documents"
              payload: { pooled_plan_provider_id: "${ppp_id}", plan_name: "Meridian PEP", plan_number: "001", plan_year_end_date: "2026-12-31", base_eligibility_min_age: 21, base_eligibility_service_months: 12, base_vesting_schedule: "CLIFF_3YR", base_match_formula_code: "SAFE_HARBOR_BASIC" }
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /pep/service-providers"
              payload: { plan_document_id: "${plan_id}", legal_name: "Northgate Recordkeeping Inc", provider_type: "RECORDKEEPER", revenue_sharing_bps: 25, direct_fee_cents_per_participant: 40000 }
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
              captures: { rk_id: $.data.id }
            - call: "POST /pep/service-providers"
              payload: { plan_document_id: "${plan_id}", legal_name: "Harborline Trust Company", provider_type: "TRUSTEE", revenue_sharing_bps: 0, direct_fee_cents_per_participant: 20000 }
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
              captures: { tr_id: $.data.id }
            - call: "GET /pep/plan-documents/${plan_id}"
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
              captures: { plan_v1: $.data.version }
            - call: "POST /pep/fiduciary-role-allocations"
              payload: { plan_document_id: "${plan_id}", service_provider_id: "${rk_id}", fiduciary_role: "NAMED_FIDUCIARY_3_16", effective_from: "2026-08-03", effective_to: "2026-12-31", expected_plan_document_version: "${plan_v1}" }
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
              captures: { alloc_nf_id: $.data.id }
            - call: "POST /pep/fiduciary-role-allocations/${alloc_nf_id}/acknowledge"
              payload: { acknowledgment_statement: "Northgate accepts the ERISA 3(16) named fiduciary function." }
              as: ServiceProvider
              as_user_id: "${rk_id}"
            - call: "GET /pep/plan-documents/${plan_id}"
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
              captures: { plan_v2: $.data.version }
            - call: "POST /pep/fiduciary-role-allocations"
              payload: { plan_document_id: "${plan_id}", service_provider_id: "${tr_id}", fiduciary_role: "TRUSTEE_403A", effective_from: "2026-08-03", effective_to: "2026-12-31", expected_plan_document_version: "${plan_v2}" }
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
              captures: { alloc_tr_id: $.data.id }
            - call: "POST /pep/fiduciary-role-allocations/${alloc_tr_id}/acknowledge"
              payload: { acknowledgment_statement: "Harborline accepts the ERISA 403(a) trustee function." }
              as: ServiceProvider
              as_user_id: "${tr_id}"
            - call: "POST /pep/plan-documents/${plan_id}/activate"
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
          trigger:
            - call: "POST /pep/adopting-employers"
              payload: { plan_document_id: "${plan_id}", legal_name: "Palisade Machining LLC", ein: "420000041", election_window_close_date: "2026-09-30", participant_count: 13, hce_count: 3, nhce_count: 10, benefiting_hce_count: 3, benefiting_nhce_count: 9, hce_avg_deferral_pct: 6.00, nhce_avg_deferral_pct: 4.00 }
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
              captures: { emp_p_id: $.data.id, emp_p_v1: $.data.version }
            - call: "GET /pep/plan-documents/${plan_id}/adopting-employers"
              payload: { limit: 10, offset: 0 }
              as: RegulatorOps
            - call: "GET /pep/plan-documents/${plan_id}"
              as: IndependentAuditor
            - call: "POST /pep/plan-design-elections"
              payload: { adopting_employer_id: "${emp_p_id}", eligibility_min_age: 21, eligibility_service_months: 12, vesting_schedule: "CLIFF_3YR", match_formula_code: "SAFE_HARBOR_BASIC", expected_adopting_employer_version: "${emp_p_v1}" }
              as: AdoptingEmployer
              as_user_id: "${emp_p_id}"
              captures: { elec_p_id: $.data.id }
            - call: "POST /pep/plan-design-elections/${elec_p_id}/submit"
              payload: { signatory_name: "J. Palisade" }
              as: AdoptingEmployer
              as_user_id: "${emp_p_id}"
            - call: "POST /pep/plan-design-elections/${elec_p_id}/approve"
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
            - call: "GET /pep/plan-documents/${plan_id}"
              as: RegulatorOps
            - call: "POST /pep/adopting-employers"
              payload: { plan_document_id: "${plan_id}", legal_name: "Quarry Fabrication Inc", ein: "420000042", election_window_close_date: "2026-09-30", participant_count: 15, hce_count: 4, nhce_count: 11, benefiting_hce_count: 4, benefiting_nhce_count: 11, hce_avg_deferral_pct: 5.00, nhce_avg_deferral_pct: 4.00 }
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
              captures: { emp_q_id: $.data.id, emp_q_v1: $.data.version }
            - call: "GET /pep/plan-documents/${plan_id}"
              as: RegulatorOps
            - call: "POST /pep/plan-design-elections"
              payload: { adopting_employer_id: "${emp_q_id}", eligibility_min_age: 21, eligibility_service_months: 12, vesting_schedule: "CLIFF_3YR", match_formula_code: "SAFE_HARBOR_BASIC", expected_adopting_employer_version: "${emp_q_v1}" }
              as: AdoptingEmployer
              as_user_id: "${emp_q_id}"
              captures: { elec_q_id: $.data.id }
            - call: "POST /pep/plan-design-elections/${elec_q_id}/submit"
              payload: { signatory_name: "R. Quarry" }
              as: AdoptingEmployer
              as_user_id: "${emp_q_id}"
            - call: "POST /pep/plan-design-elections/${elec_q_id}/approve"
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
            - call: "GET /pep/plan-documents/${plan_id}"
              as: IndependentAuditor
            - call: "GET /pep/plan-documents/${plan_id}/adopting-employers"
              payload: { limit: 10, offset: 0 }
              as: RegulatorOps
          assert:
            - "the employer created by the PooledPlanProvider is present in RegulatorOps's very next listing with total_count 1 and has_more false"
            - "the plan read by the IndependentAuditor at that point already shows participant_count 13 and cumulative_enrolled_participant_count 13 while active_employer_count is still 0: admission counts participants, approval counts employers"
            - "the approve response advances the election to APPROVED, and the next plan read shows active_employer_count 1 in the same instant — the counter is not deferred to a later call"
            - "admitting Quarry immediately moves participant_count to 28 without touching active_employer_count, which is still 1 until its election is approved"
            - "after the second approve the plan shows active_employer_count 2, participant_count 28, headcount_control_delta 0 and audit_required false, all readable by a third role on the next call"
            - "the final listing returns total_count 2 with both employers in adoption_status ACTIVE, and the version of each row equals the number of transitions it has undergone: no read introduced an extra bump"
