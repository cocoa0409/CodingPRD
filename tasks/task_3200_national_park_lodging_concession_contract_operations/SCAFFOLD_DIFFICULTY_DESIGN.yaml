      - name: housing_unit_bed_pool_aggregate_capacity_not_interval
        grounds:
          - calculations.housing_bed_capacity
          - entities.EmployeeHousingUnit.fields.bed_count
        distinguishing_aspect: |
          Resource EmployeeHousingUnit with AGGREGATE-COUNT semantics, not
          geometric interval overlap: two hires with disjoint date ranges in
          the SAME season still each consume one of bed_count slots for the
          whole season (no time-sliced reuse) — different interval semantics
          than reservation per-night half-open windows.
        test_recipe:
          setup:
            - "ACTIVE contract; season; one unit bed_count 1. Hire HA occupies June; hire HB would occupy August only (disjoint from HA) but the pool counts occupancy per season, not per night."
          setup_api_calls:
            - &hu_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SystemTestHarness
            - &hu_contract
              call: "POST /contracts"
              payload: { park_code: "YELL", contract_number: "YELL-015", term_months: 120, start_date: "2027-01-01T00:00:00Z", franchise_fee_rate: 0.0385, employee_housing_capacity: 100, lsi_annual_schedule_type: "LINEAR", environmental_plan_due_day_of_year: 60 }
              as: AgencyContractingOfficer
              captures: { c_id: $.data.id }
            - &hu_l1
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "LODGING" }
              as: AgencyContractingOfficer
              captures: { sl_l: $.data.id }
            - &hu_l2
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "FOOD" }
              as: AgencyContractingOfficer
            - &hu_l3
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "RETAIL" }
              as: AgencyContractingOfficer
            - &hu_l4
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "TOURS" }
              as: AgencyContractingOfficer
            - &hu_season
              call: "POST /contracts/${c_id}/seasons"
              payload: { year: 2027, open_date: "2027-06-01T00:00:00Z", close_date: "2027-09-01T00:00:00Z", lottery_open_date: "2026-12-01T00:00:00Z", lottery_window_hours: 72 }
              as: ConcessionerOpsManager
              captures: { s_id: $.data.id }
            - &hu_activate
              call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: ConcessionerOpsManager
            - &hu_unit
              call: "POST /contracts/${c_id}/housing-units"
              payload: { unit_code: "DORM-D1", bed_count: 1 }
              as: ConcessionerHRManager
              captures: { u1: $.data.id }
            - &hu_ha
              call: "POST /contracts/${c_id}/seasonal-hires"
              payload: { season_id: "${s_id}", service_line_id: "${sl_l}", employee_ref: "emp-june", housing_unit_id: "${u1}", arrival_date: "2027-06-01T00:00:00Z", departure_date: "2027-06-30T00:00:00Z", needs_transport: false }
              as: ConcessionerHRManager
              captures: { h_a: $.data.id }
          trigger:
            - call: "POST /contracts/${c_id}/seasonal-hires"
              payload: { season_id: "${s_id}", service_line_id: "${sl_l}", employee_ref: "emp-aug", housing_unit_id: "${u1}", arrival_date: "2027-08-01T00:00:00Z", departure_date: "2027-08-31T00:00:00Z", needs_transport: false }
              as: ConcessionerHRManager
              captures: { err: $.data.error_id }
            - call: "POST /contracts/${c_id}/seasonal-hires/${h_a}/terminate"
              payload: { reason: "season over early" }
              as: ConcessionerHRManager
            - call: "POST /contracts/${c_id}/seasonal-hires"
              payload: { season_id: "${s_id}", service_line_id: "${sl_l}", employee_ref: "emp-aug", housing_unit_id: "${u1}", arrival_date: "2027-08-01T00:00:00Z", departure_date: "2027-08-31T00:00:00Z", needs_transport: false }
              as: ConcessionerHRManager
              captures: { h_b: $.data.id }
          assert:
            - "while HA is HIRED, the disjoint-date hire is rejected: err == ERR_HOUSING_FULL — season-level aggregate capacity ignores date disjointness"
            - "only after HA leaves occupancy (TERMINATED) does HB succeed (${h_b} created)"
            - "contrast with reservations: beds are a count pool, not a per-night interval resource"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: housing_bed_occupancy_conserved_across_hire_and_terminate
        grounds:
          - calculations.housing_bed_capacity
          - state_machines.SeasonalHire.HIRED_to_TERMINATED
        distinguishing_aspect: |
          Conserved quantity: occupied_beds(unit, season). Invariant:
          create(hire) then terminate(hire) leaves occupied_beds unchanged
          (net zero) — formally, occupied_beds(after create then terminate)
          == occupied_beds(before). Compensating action: terminate.
        test_recipe:
          setup:
            - "ACTIVE contract; season; unit bed_count 3; two hires already HIRED (occupied = 2)."
          setup_api_calls:
            - &ci_clock
              call: "POST /_clock/set_current_utc"
