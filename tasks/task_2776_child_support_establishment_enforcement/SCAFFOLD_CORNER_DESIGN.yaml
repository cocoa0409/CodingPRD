            - call: "POST /child-support/orders/${orderr3}/deviation-findings"
              payload: { decision: "APPROVE" }
              as: SupervisingAttorney
              as_user_id: "user-sod-2"
              captures: { ord_st: "$.data.status", ord_mon: "$.data.monthly_obligation_cents", ord_by: "$.data.drafted_by_user_id", ord_appr: "$.data.findings_approved_by_user_id" }
            - call: "POST /child-support/orders/${orderr3}/charges"
              payload: { charge_type: "ARREARS_JUDGMENT", period_start_date: "2026-08-01", period_end_date: "2026-09-01", due_date: "2026-08-15", amount_cents: 150000 }
              as: FinanceOfficer
            - call: "POST /child-support/cases/${caser3}/enforcement-actions"
              payload: { action_type: "CREDIT_BUREAU_REPORT" }
              as: CaseWorker
              as_user_id: "user-sod-3"
              captures: { act: "$.data.id", act_by: "$.data.proposed_by_user_id", act_cert: "$.data.arrears_certified_snapshot_cents" }
            - call: "POST /child-support/enforcement-actions/${act}/notice"
              payload: {}
              as: CaseWorker
              as_user_id: "user-sod-3"
              captures: { act_st1: "$.data.status" }
            - call: "POST /child-support/enforcement-actions/${act}/contest"
              payload: { contest_grounds: "INABILITY_TO_PAY" }
              as: NoncustodialParty
              as_user_id: "${ncpr3}"
              captures: { act_st2: "$.data.status" }
            - call: "POST /child-support/enforcement-actions/${act}/review-decision"
              payload: { review_decision: "UPHOLD" }
              as: SupervisingAttorney
              as_user_id: "user-sod-3"
              captures: { e_sod2: "$.data.error_id" }
            - call: "POST /child-support/enforcement-actions/${act}/review-decision"
              payload: { review_decision: "UPHOLD" }
              as: SupervisingAttorney
              as_user_id: "user-sod-4"
              captures: { act_st3: "$.data.status", act_dec: "$.data.review_decision", act_rev: "$.data.review_decided_by_user_id", act_remedy: "$.data.remedy_applied" }
            - call: "GET /child-support/participants/${ncpr3}"
              as: CaseWorker
              captures: { ncp_cbr: "$.data.credit_bureau_reported" }
          assert:
            - "${gr3} == 75000 and ${dev_st} == PENDING_DEVIATION_FINDINGS  # abs(67500 - 75000) * 100 == 750000 == 75000 * 10, so the request sits exactly on the floor"
            - "HTTP 403 and ${e_sod1} == ERR_SEGREGATION_OF_DUTIES  # user-sod-1 holds the SupervisingAttorney role here and is still refused, because drafted_by_user_id is user-sod-1"
            - "${ord_st} == ENTERED and ${ord_mon} == 67500 and ${ord_by} == user-sod-1 and ${ord_appr} == user-sod-2  # a different user id under the same role is accepted"
            - "${act_by} == user-sod-3 and ${act_cert} == 150000  # the charge is due 2026-08-15 and the clock is 2026-08-01, so no interest has accrued"
            - "${act_st1} == NOTICE_SENT and ${act_st2} == CONTESTED"
            - "HTTP 403 and ${e_sod2} == ERR_SEGREGATION_OF_DUTIES  # the second segregation point compares X-User-ID against proposed_by_user_id on a different entity"
            - "${act_st3} == ACTIVE and ${act_dec} == UPHOLD and ${act_rev} == user-sod-4 and ${act_remedy} == true"
            - "${ncp_cbr} == true  # upholding the contest applies the remedy flag on the Participant"

  # ====================================================================
  # Table 8 - Cross-cutting complexity layers. §1.0 declares four layers:
  # dual_variant_calculation, cascading_side_effects, rate_threshold_triggers
  # and optimistic_concurrency. The two layers whose corner behaviour is not
  # already the whole subject of a §1.8 instance are exercised here; the other
  # two are stubbed against their §1.8 owners.
  # ====================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_tokens_are_invalidated_by_side_effects_of_unrelated_writes
        claim_type: optimistic_concurrency
        grounds:
          - "complexity_profile.complexity_layers[optimistic_concurrency]"
          - "concurrency_rules[iwo-issue-stale-order]"
          - "concurrency_rules[compromise-create-stale-case]"
          - "validations[priority 9]"
          - "errors[ERR_STALE_ORDER_VERSION]"
          - "errors[ERR_STALE_CASE_VERSION]"
          - "endpoints[POST /child-support/orders/{order_id}/withholding-orders]"
          - "endpoints[POST /child-support/cases/{case_id}/compromise-offers]"
        distinguishing_aspect: >
          Both guarded writes are refused by a token the caller read correctly,
          because a DIFFERENT endpoint moved the parent in between: a charge posting
          bumps the order, and a payment posting bumps the case. The sharper half is
          that the guarded write bumps its own parent too, so the very token that
          was just accepted for the first IWO is stale for the second one - and the
          second IWO then succeeds on a re-read, which proves the 412 is a version
          comparison and not a one-IWO-per-order rule. A refused write itself leaves
          the version untouched, so each version advances by exactly one per
          accepted write and a retry after a re-read always converges.
        test_recipe:
          setup:
            - "Empty database. Clock pinned to 2026-08-01T00:00:00Z."
            - "CP 200000 and NCP 300000 VERIFIED_WAGE_RECORD, supports_second_family false; ENTERED order at monthly_obligation_cents 75000."
            - "Two MN employers, both remittance_fee_cents 0; EMPLOYER_STATE_CAPS[MN] is null so the federal 0.60 governs."
            - "Each IWO is issued at reported_disposable_income_cents 150000: cap floor(150000 * 0.60) == 90000 and requested 75000 + round_half_up(75000 * 0.20) == 90000, so each withholds 90000."
            - "The aggregate rule allows both: sum(reported_disposable) 300000 * min(ccpa_cap_pct) 0.60 == 180000 and the two withholdings sum to exactly 180000."
            - "After the two IWOs an ARREARS_JUDGMENT of 150000 is posted, so arrears_principal_cents is 225000; a 1000 DIRECT_PAY then lands in waterfall bucket 1 (the CURRENT_SUPPORT period 2026-08-01..2026-09-01 contains the received_at date) and leaves 224000."
            - "compromise_risk_tier is MEDIUM, not HIGH, so the offer is not blocked: arrears_component floor(224000 * 100 / 900000) == 24, payment_history_component 100 - floor(1000 * 100 / 225000) == 100, delinquency 0 (both IWOs NOT_DUE), so the compromise variant scores round_half_up((25*24 + 40*100)/100) == 46."
