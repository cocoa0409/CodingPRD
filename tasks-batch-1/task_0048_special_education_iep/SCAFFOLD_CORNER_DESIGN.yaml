          difficulty_instance: non_linear_state_machine / iep_cycle_active_amendment_active
          rationale: "OCC stale-version on open-amendment is exercised in the §1.8 IEP-cycle instance; a dedicated stale case is in the cross-cutting section below."

  # =========================================================================
  - section: rbac
    instances:
      - name: parent_cannot_register_student
        claim_type: role_denied
        grounds:
          - roles
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "POST /students as Parent (an exclusive SpecialEdAdmin op) returns ERR_FORBIDDEN (403)."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /students"
              payload: { full_name: "X", date_of_birth: "2014-01-01", grade_level: 6 }
              as: Parent
              as_user_id: "par_1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "response error_id == ERR_FORBIDDEN"

      - name: casemanager_cannot_finalize_evaluation
