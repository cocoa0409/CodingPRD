  # ===================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: volume_discount_tier_at_exactly_1_5m_subtotal
        grounds:
          - calculations.firm_quote_total
          - entities.Quote.fields.firm_total_cents
        distinguishing_aspect: |
          Numeric threshold on POST /quotes/{id}/issue: subtotal exactly 1500000 triggers the 5% tier (>= boundary):
          PAINT/160lf/40d gives subtotal 1500000, discount 75000, firm 1425000; 160lf/39d gives subtotal 1498500 (<1.5M),
          discount 0, firm 1498500. The >= edge is the distinguishing point.
        test_recipe:
          setup:
            - "A COMPLETED Measure linear_feet=160, door_count=40, finish_code=PAINT; a PAINT DRAFT Quote (no add-ons)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "h11@x.com", full_name: "H Eleven", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { cust11: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust11}", address_line: "11 Kitchen Way" }
              as: SalesRep
              captures: { proj11: $.data.id }
            - call: "POST /projects/${proj11}/measures"
              payload: { scheduled_for: "2026-04-02T15:00:00Z" }
              as: SalesRep
              captures: { meas11: $.data.id }
            - call: "POST /projects/${proj11}/measures/${meas11}/complete"
              payload: { linear_feet: 160, door_count: 40, door_style: "SHAKER", finish_code: "PAINT" }
              as: SalesRep
            - call: "POST /projects/${proj11}/quotes"
              payload: { measure_id: "${meas11}", scope: "PAINT" }
              as: SalesRep
              captures: { q11: $.data.id }
          trigger:
            - call: "POST /quotes/${q11}/issue"
              payload: {}
              as: SalesRep
              captures: { firm11: $.data.firm_total_cents }
          assert:
            - "Quote.${q11}.firm_total_cents == 1425000"

      - name: empty_addons_total_is_zero_on_issue
        grounds:
          - calculations.firm_quote_total
          - entities.Quote.fields.addons_total_cents
          - entities.AddOn.fields.status
        distinguishing_aspect: |
          Empty-collection edge on a different metric/endpoint: a Quote with zero APPROVED AddOns (one AddOn exists
          but is REMOVED) has addons_total_cents == 0 at issue, so firm equals the discounted subtotal alone (715000).
          This is a zero-count collection edge, distinct from the numeric >= threshold above.
        test_recipe:
          setup:
            - "A REFACE/WOOD_VENEER DRAFT Quote (lf=25,d=18); one HARDWARE AddOn proposed then REMOVED (none APPROVED)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "h12@x.com", full_name: "H Twelve", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { cust12: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust12}", address_line: "12 Kitchen Way" }
              as: SalesRep
              captures: { proj12: $.data.id }
            - call: "POST /projects/${proj12}/measures"
              payload: { scheduled_for: "2026-04-02T15:00:00Z" }
              as: SalesRep
              captures: { meas12: $.data.id }
            - call: "POST /projects/${proj12}/measures/${meas12}/complete"
              payload: { linear_feet: 25, door_count: 18, door_style: "SHAKER", finish_code: "WOOD_VENEER" }
              as: SalesRep
            - call: "POST /projects/${proj12}/quotes"
              payload: { measure_id: "${meas12}", scope: "REFACE" }
              as: SalesRep
              captures: { q12: $.data.id }
            - call: "POST /quotes/${q12}/addons"
              payload: { kind: "HARDWARE", unit_price_cents: 850, quantity: 24 }
              as: SalesRep
              captures: { ad12: $.data.id }
            - call: "POST /addons/${ad12}/remove"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /quotes/${q12}/issue"
              payload: {}
              as: SalesRep
              captures: { addons12: $.data.addons_total_cents, firm12: $.data.firm_total_cents }
          assert:
            - "Quote.${q12}.addons_total_cents == 0"
            - "Quote.${q12}.firm_total_cents == 715000"

