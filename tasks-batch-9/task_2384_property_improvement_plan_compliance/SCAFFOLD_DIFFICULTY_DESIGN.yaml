            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "GUEST_FACING", standards_reference: "GF-1.1.1", brand_estimated_cost_cents: 1000000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { gf_id: $.data.id }
            - call: "POST /pip/plans/${plan_id}/issue"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/disputes"
              payload: { plan_id: "${plan_id}", item_id: "${gf_id}", dispute_basis: "STANDARDS_APPLICABILITY", claimed_cost_cents: 0 }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { dispute_id: $.data.id }
          trigger:
            - call: "POST /pip/disputes/${dispute_id}/resolve"
              payload: { resolution: "REMOVE", panel_decision_note: "The clause does not apply to this asset class; the item is struck from scope." }
              as: BrandManager
