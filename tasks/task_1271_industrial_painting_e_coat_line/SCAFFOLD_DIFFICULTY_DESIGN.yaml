            - "VocPermit.${perm1}.used_kg == 3.212 (2.240 + 0.440 purge + 0.532 adjustment)"
            - "VocPermit.${perm1}.status == EXCEEDED, not CLOSED (3.212 > 3.000) — hop 3 of the cascade fired"

      - name: titration_out_of_range_cascade_blocks_slot_start
        grounds:
          - state_machines.PretreatmentStage.IN_RANGE_to_OUT_OF_RANGE
          - state_machines.PaintLine.RUNNING_to_CHEM_HOLD
