              payload: { seniority_score: 5 }
              as: Worker
              as_user_id: "${wb}"
              captures: { bid_b: $.data.id }
            - call: "POST /locations/${loc}/shifts/${s}/award"
              payload: { bid_id: "${bid_a}", expected_shift_version: "${sv}" }
