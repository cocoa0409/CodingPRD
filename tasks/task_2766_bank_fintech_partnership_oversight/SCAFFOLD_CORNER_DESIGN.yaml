            - *q_dr_a_pass
            - *q_pa_read_passed
            - *q_agr_a
            - *q_agr_a_submit
            - *q_agr_a_execute
            - *q_res_a_read
            - *q_res_fund_312500
            - *q_go_live_a
            - *q_fbo_a_read
            - *q_fbo_seed_8100000
          trigger:
            - call: "GET /oversight/partners/${pa_id}"
              payload: {}
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { row_posture: $.data.oversight_posture, row_tier: $.data.capability_tier, row_rate: $.data.complaint_rate_bps, row_conc: $.data.concentration_ratio_pct, row_req: $.data.required_reserve_cents, row_short: $.data.reserve_shortfall_cents, row_streak: $.data.consecutive_shortfall_cycles, row_growth: $.data.growth_breach_count, row_var: $.data.unreconciled_variance_cents, row_sanc: $.data.open_sanctions_alert_count, row_v: $.data.version }
            - call: "GET /oversight/partners/${pa_id}/oversight-summary"
              payload: {}
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { s_partner: $.data.partner_id, s_posture: $.data.oversight_posture, s_tier: $.data.capability_tier, s_rate: $.data.complaint_rate_bps, s_conc: $.data.concentration_ratio_pct, s_root: $.data.group_root_partner_id, s_group: $.data.group_balance_cents, s_bank: $.data.bank_total_fbo_balance_cents, s_req: $.data.required_reserve_cents, s_short: $.data.reserve_shortfall_cents, s_streak: $.data.consecutive_shortfall_cycles, s_growth: $.data.growth_breach_count, s_var: $.data.unreconciled_variance_cents, s_sanc: $.data.open_sanctions_alert_count, s_cause: $.data.systemic_root_cause_code, s_cycle: $.data.last_closed_cycle_index }
            - call: "GET /oversight/partners/${pa_id}"
              payload: {}
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { row_v2: $.data.version }
          assert:
            - "s_partner == ${pa_id} and the summary carries exactly the sixteen declared keys and no entity common fields (no id, created_at, updated_at or version)"
            - "s_posture == row_posture == HEIGHTENED, s_req == row_req == 506250 and s_short == row_short == 193750"
            - "s_tier == row_tier, s_rate == row_rate == 0, s_streak == row_streak == 0, s_growth == row_growth == 0, s_var == row_var == 0 and s_sanc == row_sanc == 0"
            - "s_conc == row_conc == 100.00 — Partner A is the only holder of end-user custody in the bank, so its own group is 100 percent of the total"
            - "s_root == ${pa_id}, s_group == 8100000 and s_bank == 8100000"
            - "s_cause is null and s_cycle == 0 — no complaint has a root cause and no cycle has closed"
            - "row_v2 == row_v — neither GET incremented version, so no read path persists a recompute"

      - name: creates_return_201_actions_return_200_and_every_response_carries_the_fixed_envelope
        claim_type: Standard CRUD
        grounds:
          - response_envelope.success
          - response_envelope.error
          - endpoints.POST_/oversight/partners
          - endpoints.POST_/oversight/diligence-reviews/{id}/submit
        distinguishing_aspect: "Status codes are per-endpoint declarations, not a per-method convention: POST /oversight/partners is 201 while POST /oversight/diligence-reviews/{id}/submit and POST /oversight/partners/{id}/account-census are 200 despite both being POSTs, and POST /_clock/set_current_utc is 200 with a bare projection rather than an entity. Every one of them still wraps its body in the same meta plus response_type plus data envelope, and errors switch response_type to the literal string error."
        test_recipe:
          setup:
            - "Nothing beyond a running service."
          setup_api_calls:
            - *q_clock
          trigger:
            - call: "POST /oversight/partners"
              payload: { legal_name: "Envelope Probe Inc", business_model: "LENDING", funding_stage: "SEED", months_runway: 12, disclosed_complaints_per_10k: 0.00, end_user_account_count: 0 }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { env_pid: $.data.id, env_created: $.data.created_at, env_updated: $.data.updated_at, env_v: $.data.version }
            - call: "POST /oversight/diligence-reviews"
              payload: { partner_id: "${env_pid}", review_type: "INITIAL", business_model_score: 60, funding_score: 60, compliance_capability_score: 60, complaint_history_score: 60, expected_partner_version: "${env_v}" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { env_dr: $.data.id, env_dr_status: $.data.status }
            - call: "POST /oversight/diligence-reviews/${env_dr}/submit"
              payload: { submission_note: "Submitted for envelope and status-code checking." }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { env_dr_status2: $.data.status, env_dr_v: $.data.version }
            - call: "GET /oversight/partners/${env_pid}"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { env_get_id: $.data.id }
            - call: "GET /oversight/partners/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { env_err: $.data.error_id, env_msg: $.data.message }
          assert:
            - "the partner create returns HTTP 201 with response_type == object; env_created == env_updated == 2026-08-01T00:00:00Z (the logical clock, not wall time) and env_v == 1"
            - "the diligence create returns HTTP 201 and env_dr_status == DRAFT"
            - "the submit returns HTTP 200 — a POST action on an existing row, and env_dr_status2 == SUBMITTED with env_dr_v == 2"
            - "the single GET returns HTTP 200 with env_get_id == env_pid and response_type == object"
            - "list GETs return response_type == array with the four pagination fields alongside data"
            - "the not-found GET returns HTTP 404 with response_type == error, env_err == ERR_PARTNER_NOT_FOUND and a non-empty env_msg — and no other top-level keys beyond meta, response_type and data"

      - name: every_child_collection_is_reachable_from_its_parent_id_through_a_declared_filter
        claim_type: Cross-reference link
        grounds:
          - endpoints.GET_/oversight/diligence-reviews
          - endpoints.GET_/oversight/custody-accounts
          - endpoints.GET_/oversight/marketing-reviews
          - endpoints.GET_/oversight/partners
          - complexity_profile.entity_topology
        distinguishing_aspect: "The topology is flat, so there is not one nested sub-resource URL in the whole API: every foreign key must be traversable through a filtered list instead. This instance walks every FK in §1.1 from the parent id and requires the child back, including the self-referential Partner.parent_partner_id and the 1:1-shaped custody pair that still returns an array."
        test_recipe:
          setup:
            - "Partner A CONTRACTED with a child partner A-sub attached via parent_partner_id, one diligence review, one agreement, one marketing review, both custody accounts, one settlement batch, one complaint, one alert and (after termination) one wind-down plan."
