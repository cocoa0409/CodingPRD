            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9050", project_name: "Ladder Reach", installed_capacity_mw: 12.0, base_annual_generation_mwh: 250000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/sites"
              payload: { project_id: "${proj}", site_code: "S1", river_mile: 1.0 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { site: $.data.id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans"
              payload: { project_id: "${proj}", plan_title: "Study Plan 1" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { plan: $.data.id }
            - call: "POST /relicensing/studies"
              payload: { study_plan_id: "${plan}", site_id: "${site}", resource_category: "WATER_QUALITY", study_title: "Dissolved oxygen monitoring", fieldwork_window_start: "2026-09-01", fieldwork_window_end: "2026-10-01" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { study: $.data.id, rv0: $.data.review_status }
            - call: "POST /relicensing/study-plans/${plan}/submit"
              payload: { submission_note: "plan for review" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/parties"
              payload: { project_id: "${proj}", party_name: "State Fish Agency", party_type: "AGENCY", has_conditioning_authority: true, vote_weight: 1, contact_user_id: "u_agency" }
              as: Regulator
            - call: "POST /relicensing/study-plans/${plan}/determination"
              payload: { determination: "APPROVE" }
              as: AgencyReviewer
              as_user_id: "u_agency"
              captures: { plan_status: $.data.status }
            - call: "GET /relicensing/projects/${proj}"
              payload: {}
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { pv1: $.data.version, wqc0: $.data.wqc_status }
          trigger:
            - call: "POST /relicensing/applications"
              payload: { project_id: "${proj}", application_type: "ORIGINAL_RELICENSE", expected_project_version: "${pv1}", filing_note: "too early" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { err_study: $.data.error_id }
            - call: "POST /relicensing/studies/${study}/fieldwork"
              payload: { action: "START" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/studies/${study}/fieldwork"
              payload: { action: "COMPLETE" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/studies/${study}/report"
              payload: { report_note: "DO monitoring report" }
              as: Licensee
              as_user_id: "u_lic_report"
            - call: "POST /relicensing/studies/${study}/review-decision"
              payload: { decision: "ACCEPT" }
              as: AgencyReviewer
              as_user_id: "u_agency"
              captures: { rv1: $.data.review_status }
            - call: "GET /relicensing/projects/${proj}"
              payload: {}
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { pv2: $.data.version }
            - call: "POST /relicensing/applications"
              payload: { project_id: "${proj}", application_type: "ORIGINAL_RELICENSE", expected_project_version: "${pv2}", filing_note: "still too early" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { err_wqc: $.data.error_id }
            - call: "POST /relicensing/water-quality-certifications"
              payload: { project_id: "${proj}", certifying_agency_name: "State DEQ" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "GET /relicensing/projects/${proj}"
              payload: {}
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { pv3: $.data.version }
            - call: "POST /relicensing/applications"
              payload: { project_id: "${proj}", application_type: "ORIGINAL_RELICENSE", expected_project_version: "${pv3}", filing_note: "relicense application" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { fs: $.data.filing_status, pinned_plan: $.data.pinned_study_plan_id }
            - call: "GET /relicensing/projects/${proj}"
              payload: {}
              as: Regulator
              captures: { stage: $.data.stage }
          assert:
            - "${rv0} == NOT_SUBMITTED, ${plan_status} == APPROVED and ${wqc0} == NONE"
            - "${err_study} == ERR_STUDY_NOT_ACCEPTED with HTTP 409 (the approved plan carries a study that is not ACCEPTED)"
            - "${rv1} == ACCEPTED"
            - "${err_wqc} == ERR_WQC_STATE_INVALID with HTTP 409 (wqc_status is still NONE, the next rung of the ladder)"
            - "the third filing returns HTTP 201 with ${fs} == FILED and ${pinned_plan} == the approved plan id"
            - "${stage} == APPLICATION_FILED"

      - name: support_threshold_not_met_on_an_execute_tally
