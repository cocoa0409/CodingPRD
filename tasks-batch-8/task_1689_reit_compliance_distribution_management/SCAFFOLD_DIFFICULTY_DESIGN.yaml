scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dividend_characterization_waterfall_vs_pro_rata
        grounds:
          - calculations.calc_dividend_characterization
          - entities.DividendDeclaration.fields.ordinary_cents
          - entities.DividendDeclaration.fields.capital_gain_cents
        distinguishing_aspect: |
          Same inputs (amount 800000, current_ep_balance 600000, capital-gain pool 400000)
          produce different characterization under the two variants: WATERFALL yields
          ordinary 600000 / capital gain 200000, while PRO_RATA yields ordinary 480000 /
          capital gain 320000. Entity domain: DividendDeclaration.
        test_recipe:
          setup:
            - "Reit R1 exists, ACTIVE, with current_ep_balance_cents == 600000 (one POSTED TAXABLE_INCOME adjustment of 600000)"
            - "DistributionRequirement for (R1, 2026) POSTED with taxable_income_cents 1000000 and net_capital_gain_cents 400000 (so the capital-gain pool is 400000)"
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "DV REIT", ticker: "DVRE", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id, reit_v: $.data.version }
            - call: "POST /reit-compliance/quarters"
              payload: { reit_id: "${reit_id}", label: "2026-Q1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: ComplianceOfficer
              captures: { q1_id: $.data.id }
            - call: "POST /reit-compliance/ep-adjustments"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}", kind: "TAXABLE_INCOME", amount_cents: 600000, effective_date: "2026-02-01", expected_reit_version: "${reit_v}" }
              as: TaxDirector
              captures: { adj_id: $.data.id }
            - call: "POST /reit-compliance/ep-adjustments/${adj_id}/post"
              payload: {}
              as: TaxDirector
            - call: "POST /reit-compliance/distribution-requirements"
              payload: { reit_id: "${reit_id}", taxable_year: 2026, taxable_income_cents: 1000000, net_capital_gain_cents: 400000 }
              as: ComplianceOfficer
              captures: { req_id: $.data.id }
            - call: "POST /reit-compliance/distribution-requirements/${req_id}/post"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "GET /reit-compliance/reits/${reit_id}/dividend-characterization-preview"
              payload: { amount_cents: 800000, taxable_year: 2026, mode: "WATERFALL" }
              as: TaxDirector
              captures: { w_ordinary: $.data.ordinary_cents, w_cg: $.data.capital_gain_cents, w_roc: $.data.return_of_capital_cents }
            - call: "GET /reit-compliance/reits/${reit_id}/dividend-characterization-preview"
              payload: { amount_cents: 800000, taxable_year: 2026, mode: "PRO_RATA" }
              as: TaxDirector
              captures: { p_ordinary: $.data.ordinary_cents, p_cg: $.data.capital_gain_cents, p_roc: $.data.return_of_capital_cents }
          assert:
            - "WATERFALL preview: ordinary_cents == 600000, capital_gain_cents == 200000, return_of_capital_cents == 0"
            - "PRO_RATA preview: ordinary_cents == 480000, capital_gain_cents == 320000, return_of_capital_cents == 0"
            - "w_ordinary != p_ordinary (identical inputs, divergent outputs)"

      - name: ep_balance_current_vs_frozen_year_end
        grounds:
          - calculations.calc_ep_balance
          - entities.Reit.fields.current_ep_balance_cents
        distinguishing_aspect: |
          Same adjustment ledger yields a different E&P balance under the two variants:
          the current view replays all POSTED adjustments (550000) while the frozen
          year-end view as_of 2026-12-31 excludes the 2027-01-15 FEDERAL_TAX accrual
          (600000). Entity domain: Reit / EpAdjustment (distinct from the
          DividendDeclaration domain of the sibling instance).
        test_recipe:
          setup:
            - "Reit R1 ACTIVE; quarters 2026-Q1 and 2027-Q1 exist and are OPEN"
            - "POSTED adjustments: TAXABLE_INCOME +500000 (effective 2026-01-10, Q1-2026), DISALLOWED_DEDUCTION +100000 (effective 2026-03-31, Q1-2026), FEDERAL_TAX 50000 (effective 2027-01-15, Q1-2027)"
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "EP REIT", ticker: "EPRE", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id, reit_v: $.data.version }
            - call: "POST /reit-compliance/quarters"
              payload: { reit_id: "${reit_id}", label: "2026-Q1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: ComplianceOfficer
              captures: { q26_id: $.data.id }
            - call: "POST /reit-compliance/quarters"
              payload: { reit_id: "${reit_id}", label: "2027-Q1", period_start: "2027-01-01", period_end: "2027-03-31" }
              as: ComplianceOfficer
              captures: { q27_id: $.data.id }
            - call: "GET /reit-compliance/reits/${reit_id}"
              payload: {}
              as: TaxDirector
              captures: { reit_v2: $.data.version }
            - call: "POST /reit-compliance/ep-adjustments"
              payload: { reit_id: "${reit_id}", quarter_id: "${q26_id}", kind: "TAXABLE_INCOME", amount_cents: 500000, effective_date: "2026-01-10", expected_reit_version: "${reit_v2}" }
              as: TaxDirector
              captures: { adj1_id: $.data.id }
            - call: "POST /reit-compliance/ep-adjustments/${adj1_id}/post"
              payload: {}
              as: TaxDirector
            - call: "GET /reit-compliance/reits/${reit_id}"
              payload: {}
              as: TaxDirector
              captures: { reit_v3: $.data.version }
            - call: "POST /reit-compliance/ep-adjustments"
              payload: { reit_id: "${reit_id}", quarter_id: "${q26_id}", kind: "DISALLOWED_DEDUCTION", amount_cents: 100000, effective_date: "2026-03-31", expected_reit_version: "${reit_v3}" }
              as: TaxDirector
              captures: { adj2_id: $.data.id }
            - call: "POST /reit-compliance/ep-adjustments/${adj2_id}/post"
              payload: {}
              as: TaxDirector
            - call: "GET /reit-compliance/reits/${reit_id}"
              payload: {}
              as: TaxDirector
              captures: { reit_v4: $.data.version }
            - call: "POST /reit-compliance/ep-adjustments"
              payload: { reit_id: "${reit_id}", quarter_id: "${q27_id}", kind: "FEDERAL_TAX", amount_cents: 50000, effective_date: "2027-01-15", expected_reit_version: "${reit_v4}" }
              as: TaxDirector
              captures: { adj3_id: $.data.id }
            - call: "POST /reit-compliance/ep-adjustments/${adj3_id}/post"
              payload: {}
              as: TaxDirector
          trigger:
            - call: "GET /reit-compliance/reits/${reit_id}/ep-balance"
              payload: {}
              as: TaxDirector
              captures: { bal_current: $.data.ep_balance_cents }
            - call: "GET /reit-compliance/reits/${reit_id}/ep-balance"
              payload: { as_of: "2026-12-31" }
              as: TaxDirector
              captures: { bal_frozen: $.data.ep_balance_cents }
          assert:
            - "current variant: ep_balance_cents == 550000"
            - "frozen year-end variant as_of 2026-12-31: ep_balance_cents == 600000"
            - "bal_current != bal_frozen — the late-accruing FEDERAL_TAX is included only in the current view"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: prohibited_transaction_three_input_branch
        grounds:
          - calculations.calc_prohibited_transaction
          - entities.AssetSale.fields.is_prohibited
          - entities.AssetSale.fields.prohibited_tax_cents
        distinguishing_aspect: |
          Mode (a): a formula with three inputs (is_dealer_inventory,
          holding_period_months, gain sign) and non-linear conditional branching —
          dealer inventory sold at 19 months with a gain is prohibited (tax = 100%
          of gain = 700000), while the same asset sold at 25 months is safe (tax 0),
          and a dealer sale at 19 months with zero/negative gain carries tax 0.
        test_recipe:
          setup:
            - "Reit R1 ACTIVE with two dealer-inventory assets: A1 acquired 2025-01-01 (sale date 2026-08-01 -> holding_period_months == 19), A2 acquired 2025-01-01 (sale date 2027-02-01 -> 25 months)"
            - "Sale S1 on A1: price 2000000, basis 1300000 (gain 700000); Sale S2 on A2: price 2000000, basis 1300000"
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "PT REIT", ticker: "PTRE", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id }
            - call: "POST /reit-compliance/asset-holdings"
              payload: { reit_id: "${reit_id}", asset_name: "Dealer Condo A", asset_class: "REAL_ESTATE", held_by_trs: false, is_dealer_inventory: true, acquisition_date: "2025-01-01", value_cents: 1300000 }
              as: ComplianceOfficer
              captures: { a1_id: $.data.id }
            - call: "POST /reit-compliance/asset-holdings"
              payload: { reit_id: "${reit_id}", asset_name: "Dealer Condo B", asset_class: "REAL_ESTATE", held_by_trs: false, is_dealer_inventory: true, acquisition_date: "2025-01-01", value_cents: 1300000 }
              as: ComplianceOfficer
              captures: { a2_id: $.data.id }
            - call: "POST /reit-compliance/asset-sales"
              payload: { reit_id: "${reit_id}", asset_holding_id: "${a1_id}", sale_price_cents: 2000000, basis_cents: 1300000, sale_date: "2026-08-01" }
              as: ComplianceOfficer
              captures: { s1_id: $.data.id }
            - call: "POST /reit-compliance/asset-sales"
              payload: { reit_id: "${reit_id}", asset_holding_id: "${a2_id}", sale_price_cents: 2000000, basis_cents: 1300000, sale_date: "2027-02-01" }
              as: ComplianceOfficer
              captures: { s2_id: $.data.id }
          trigger:
            - call: "POST /reit-compliance/asset-sales/${s1_id}/analyze"
              payload: {}
              as: ComplianceOfficer
              captures: { s1_tax: $.data.prohibited_tax_cents, s1_months: $.data.holding_period_months }
            - call: "POST /reit-compliance/asset-sales/${s2_id}/analyze"
              payload: {}
              as: ComplianceOfficer
              captures: { s2_tax: $.data.prohibited_tax_cents, s2_months: $.data.holding_period_months }
          assert:
            - "S1: holding_period_months == 19, is_prohibited == true, prohibited_tax_cents == 700000 (100% of the 700000 gain)"
            - "S2: holding_period_months == 25, is_prohibited == false, prohibited_tax_cents == 0"
            - "same dealer flag and same gain, different month input -> different tax: branch interaction is non-linear"

      - name: dividend_characterization_pinned_evaluation_order
        grounds:
          - calculations.calc_dividend_characterization
          - calculations.calc_ep_balance
          - entities.Reit.fields.current_ep_balance_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — the ordinary bucket depends on
          current_ep_balance_cents, yet declaring a dividend debits that same balance;
          and the capital-gain pool depends on capital_gain_cents already taken by
          sibling declarations. The pinned order (ordinary against live E&P -> debit ->
          capital gain against remaining pool) makes a three-dividend chain
          determinate: 250000 -> (250000,0,0); then 100000 -> (50000,50000,0);
          then 80000 -> (0,80000,0).
        test_recipe:
          setup:
            - "Reit R1 ACTIVE with current_ep_balance_cents == 300000 (one POSTED TAXABLE_INCOME adjustment of 300000)"
            - "DistributionRequirement for (R1, 2026) POSTED with taxable_income_cents 1000000, net_capital_gain_cents 200000 (required 720000; capital-gain pool 200000)"
            - "Three dividends created, approved, and declared in order: D1 250000, D2 100000, D3 80000 — all taxable_year 2026"
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "ORD REIT", ticker: "ORDR", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id, reit_v: $.data.version }
            - call: "POST /reit-compliance/quarters"
              payload: { reit_id: "${reit_id}", label: "2026-Q1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: ComplianceOfficer
              captures: { q1_id: $.data.id }
            - call: "POST /reit-compliance/ep-adjustments"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}", kind: "TAXABLE_INCOME", amount_cents: 300000, effective_date: "2026-01-15", expected_reit_version: "${reit_v}" }
              as: TaxDirector
              captures: { adj_id: $.data.id }
            - call: "POST /reit-compliance/ep-adjustments/${adj_id}/post"
              payload: {}
              as: TaxDirector
            - call: "POST /reit-compliance/distribution-requirements"
              payload: { reit_id: "${reit_id}", taxable_year: 2026, taxable_income_cents: 1000000, net_capital_gain_cents: 200000 }
              as: ComplianceOfficer
              captures: { req_id: $.data.id }
            - call: "POST /reit-compliance/distribution-requirements/${req_id}/post"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /reit-compliance/reits/${reit_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { rv1: $.data.version }
            - call: "POST /reit-compliance/dividend-declarations"
              payload: { reit_id: "${reit_id}", taxable_year: 2026, amount_cents: 250000, declaration_date: "2026-03-01", record_date: "2026-03-10", payable_date: "2026-03-20", expected_reit_version: "${rv1}" }
              as: ComplianceOfficer
              captures: { d1_id: $.data.id }
            - call: "POST /reit-compliance/dividend-declarations/${d1_id}/approve"
              payload: {}
              as: BoardDirector
              as_user_id: "director-1"
            - call: "POST /reit-compliance/dividend-declarations/${d1_id}/declare"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { d1_ord: $.data.ordinary_cents, d1_cg: $.data.capital_gain_cents, d1_roc: $.data.return_of_capital_cents }
            - call: "GET /reit-compliance/reits/${reit_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { rv2: $.data.version }
            - call: "POST /reit-compliance/dividend-declarations"
              payload: { reit_id: "${reit_id}", taxable_year: 2026, amount_cents: 100000, declaration_date: "2026-03-02", record_date: "2026-03-11", payable_date: "2026-03-21", expected_reit_version: "${rv2}" }
              as: ComplianceOfficer
              captures: { d2_id: $.data.id }
            - call: "POST /reit-compliance/dividend-declarations/${d2_id}/approve"
              payload: {}
              as: BoardDirector
              as_user_id: "director-1"
            - call: "POST /reit-compliance/dividend-declarations/${d2_id}/declare"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { d2_ord: $.data.ordinary_cents, d2_cg: $.data.capital_gain_cents, d2_roc: $.data.return_of_capital_cents }
            - call: "GET /reit-compliance/reits/${reit_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { rv3: $.data.version }
            - call: "POST /reit-compliance/dividend-declarations"
              payload: { reit_id: "${reit_id}", taxable_year: 2026, amount_cents: 80000, declaration_date: "2026-03-03", record_date: "2026-03-12", payable_date: "2026-03-22", expected_reit_version: "${rv3}" }
              as: ComplianceOfficer
              captures: { d3_id: $.data.id }
            - call: "POST /reit-compliance/dividend-declarations/${d3_id}/approve"
              payload: {}
              as: BoardDirector
              as_user_id: "director-1"
          trigger:
            - call: "POST /reit-compliance/dividend-declarations/${d3_id}/declare"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { d3_ord: $.data.ordinary_cents, d3_cg: $.data.capital_gain_cents, d3_roc: $.data.return_of_capital_cents }
            - call: "GET /reit-compliance/reits/${reit_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ep_after: $.data.current_ep_balance_cents }
          assert:
            - "D1: ordinary_cents == 250000, capital_gain_cents == 0, return_of_capital_cents == 0 (E&P 300000 -> 50000)"
            - "D2: ordinary_cents == 50000 (clamped by remaining E&P), capital_gain_cents == 50000, return_of_capital_cents == 0"
            - "D3: ordinary_cents == 0 (E&P exhausted), capital_gain_cents == 80000 (pool 200000 - 50000 = 150000), return_of_capital_cents == 0"
            - "after all three declares: Reit.current_ep_balance_cents == 0"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: disclosure_reject_revision_cycle
        grounds:
          - state_machines.ComplianceDisclosure.SUBMITTED_to_DRAFT
          - state_machines.ComplianceDisclosure.DRAFT_to_SUBMITTED
          - entities.ComplianceDisclosure.fields.revision_count
        distinguishing_aspect: |
          Cyclic machine on ComplianceDisclosure: DRAFT -> SUBMITTED -> DRAFT ->
          SUBMITTED -> APPROVED. The reject transition loops the entity back to DRAFT
          and increments revision_count; the loop can repeat and still terminate at
          APPROVED. (Distinct entity from the sibling branching instance.)
        test_recipe:
          setup:
            - "Reit R1 ACTIVE; quarter 2026-Q1 with passing income data (RENTS 800000, MORTGAGE_INTEREST 150000, NON_QUALIFYING 50000); IncomeTestReport locked LOCKED"
            - "ComplianceDisclosure X of type INCOME_TEST referencing the locked report, submitted by officer-1"
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "CYC REIT", ticker: "CYCR", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id }
            - call: "POST /reit-compliance/quarters"
              payload: { reit_id: "${reit_id}", label: "2026-Q1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: ComplianceOfficer
              captures: { q1_id: $.data.id }
            - call: "POST /reit-compliance/income-items"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}", income_class: "RENTS", amount_cents: 800000, source_is_trs: false, accrued_at: "2026-02-01" }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/income-items"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}", income_class: "MORTGAGE_INTEREST", amount_cents: 150000, source_is_trs: false, accrued_at: "2026-02-15" }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/income-items"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}", income_class: "NON_QUALIFYING", amount_cents: 50000, source_is_trs: false, accrued_at: "2026-03-01" }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/income-test-reports"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}" }
              as: ComplianceOfficer
              captures: { itr_id: $.data.id }
            - call: "POST /reit-compliance/income-test-reports/${itr_id}/lock"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /reit-compliance/compliance-disclosures"
              payload: { reit_id: "${reit_id}", disclosure_type: "INCOME_TEST", reference_id: "${itr_id}", title: "Q1 income test", body: "75% and 95% results" }
              as: ComplianceOfficer
              captures: { disc_id: $.data.id }
            - call: "POST /reit-compliance/compliance-disclosures/${disc_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /reit-compliance/compliance-disclosures/${disc_id}/reject"
              payload: {}
              as: BoardDirector
              as_user_id: "director-9"
            - call: "POST /reit-compliance/compliance-disclosures/${disc_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /reit-compliance/compliance-disclosures/${disc_id}/approve"
              payload: {}
              as: BoardDirector
              as_user_id: "director-9"
              captures: { final_status: $.data.status, rev_count: $.data.revision_count }
          assert:
            - "after reject: ComplianceDisclosure.${disc_id}.status == DRAFT and revision_count == 1 (looped back, not terminal)"
            - "after resubmit and approve: status == APPROVED and revision_count == 1"
            - "cycle executed: DRAFT -> SUBMITTED -> DRAFT -> SUBMITTED -> APPROVED"

      - name: dividend_branching_void_vs_declare_side_effects
        grounds:
          - state_machines.DividendDeclaration.APPROVED_to_DECLARED
          - state_machines.DividendDeclaration.APPROVED_to_VOID
          - entities.DividendDeclaration.fields.status
        distinguishing_aspect: |
          Branching machine on DividendDeclaration: from APPROVED the fork goes to
          DECLARED (E&P debited, requirement ledger-synced) or to VOID (no fiscal
          side effects at all). Two APPROVED dividends of 100000 each take divergent
          branches; only the DECLARED branch moves current_ep_balance_cents.
          (Distinct entity from the cyclic ComplianceDisclosure instance.)
        test_recipe:
          setup:
            - "Reit R1 ACTIVE with current_ep_balance_cents == 500000; requirement (2026) POSTED with taxable_income 1000000, net_capital_gain 0 (required 900000)"
            - "Two dividends D1 and D2 of 100000 each, both APPROVED"
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "BR REIT", ticker: "BRRE", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id, reit_v: $.data.version }
            - call: "POST /reit-compliance/quarters"
              payload: { reit_id: "${reit_id}", label: "2026-Q1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: ComplianceOfficer
              captures: { q1_id: $.data.id }
            - call: "POST /reit-compliance/ep-adjustments"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}", kind: "TAXABLE_INCOME", amount_cents: 500000, effective_date: "2026-01-15", expected_reit_version: "${reit_v}" }
              as: TaxDirector
              captures: { adj_id: $.data.id }
            - call: "POST /reit-compliance/ep-adjustments/${adj_id}/post"
              payload: {}
              as: TaxDirector
            - call: "POST /reit-compliance/distribution-requirements"
              payload: { reit_id: "${reit_id}", taxable_year: 2026, taxable_income_cents: 1000000, net_capital_gain_cents: 0 }
              as: ComplianceOfficer
              captures: { req_id: $.data.id }
            - call: "POST /reit-compliance/distribution-requirements/${req_id}/post"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /reit-compliance/reits/${reit_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { rv1: $.data.version }
            - call: "POST /reit-compliance/dividend-declarations"
              payload: { reit_id: "${reit_id}", taxable_year: 2026, amount_cents: 100000, declaration_date: "2026-03-01", record_date: "2026-03-10", payable_date: "2026-03-20", expected_reit_version: "${rv1}" }
              as: ComplianceOfficer
              captures: { d1_id: $.data.id }
            - call: "POST /reit-compliance/dividend-declarations/${d1_id}/approve"
              payload: {}
              as: BoardDirector
              as_user_id: "director-1"
            - call: "GET /reit-compliance/reits/${reit_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { rv2: $.data.version }
            - call: "POST /reit-compliance/dividend-declarations"
              payload: { reit_id: "${reit_id}", taxable_year: 2026, amount_cents: 100000, declaration_date: "2026-03-02", record_date: "2026-03-11", payable_date: "2026-03-21", expected_reit_version: "${rv2}" }
              as: ComplianceOfficer
              captures: { d2_id: $.data.id }
            - call: "POST /reit-compliance/dividend-declarations/${d2_id}/approve"
              payload: {}
              as: BoardDirector
              as_user_id: "director-1"
          trigger:
            - call: "POST /reit-compliance/dividend-declarations/${d1_id}/declare"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { d1_ord: $.data.ordinary_cents }
            - call: "POST /reit-compliance/dividend-declarations/${d2_id}/void"
              payload: {}
              as: ComplianceOfficer
              captures: { d2_status: $.data.status }
            - call: "GET /reit-compliance/reits/${reit_id}"
              payload: {}
