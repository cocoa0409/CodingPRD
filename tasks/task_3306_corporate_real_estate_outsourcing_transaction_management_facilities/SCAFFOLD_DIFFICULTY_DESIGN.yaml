- rule_id: compensating_invariant
  instances:
  - name: commission_credit_ledger_conserves_under_apply
    grounds:
    - calculations.commission_credit_nets_fee
    - validations[priority=23]
    - errors[ERR_FEE_ACCRUAL_LOCKED]
    - entities.PortfolioAccount.fields.fee_ledger_credit_cents
    distinguishing_aspect: fee_ledger_credit_cents reads 6350000.00 before the credit application, while the application is in flight and after it, so the forward apply action conserves this named currency quantity exactly.
    test_recipe:
      setup:
      - PortfolioAccount ACTIVE, portfolio_sqft 400000, ENTERPRISE tier, no pre-existing commission records
      - Lease L1 EXECUTED so the execution-created THIRD_PARTY record carries credit_amount_cents 1850000.00
      - AccountFeeAccrual AC1 for 2026-Q3 base_fee_cents 3000000 OPEN
      - CommissionRecord RXR THIRD_PARTY base_rent 30000000 pct 0.15 accrual 2026-07-01 -> 4500000.00
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: Highline
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: ENTERPRISE
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/accounts/${acc}/assignments
        payload:
          assignee_name: Dana Director
          assignment_role: APPROVAL_AUTHORITY
          approval_level: ACCOUNT_EXECUTIVE
        as: AccountExecutive
        as_user_id: ${acc}
        captures:
          auth: $.data.id
      - call: POST /api/leases
        payload:
          account_id: ${acc}
          property_address: 1 Market St
          market_code: SFO
          leased_sqft: 40000
          base_rent_cents_per_year: 74000000
          lease_start_date: '2026-10-01T00:00:00Z'
          lease_end_date: '2027-10-01T00:00:00Z'
        as: TransactionManager
        captures:
          L1: $.data.id
      - call: POST /api/transaction-requests
        payload:
          account_id: ${acc}
          lease_id: ${L1}
          request_type: RENEWAL
          prior_rent_cents_per_year: 74000000
          proposed_rent_cents_per_year: 68000000
          requested_term_months: 60
          third_party_commission_cents: 1850000
        as: TransactionManager
        captures:
          T1: $.data.id
      - call: POST /api/transaction-requests/${T1}/submit
        payload: {}
        as: TransactionManager
      - call: POST /api/transaction-requests/${T1}/decide
        payload:
          decision: APPROVE
          level: ACCOUNT_EXECUTIVE
        as: ApprovalAuthority
        as_user_id: ${auth}
      - call: POST /api/broker-engagements
        payload:
          account_id: ${acc}
          transaction_request_id: ${T1}
          market_code: SFO
          broker_name: Pat Senior
          licensed_in_market: true
          broker_class: SENIOR
        as: TransactionManager
        captures:
          eng: $.data.id
      - call: POST /api/broker-engagements/${eng}/assign
        payload: {}
        as: TransactionManager
      - call: POST /api/broker-engagements/${eng}/execute
        payload: {}
        as: TransactionManager
      - call: POST /api/leases/${L1}/execute
        payload: {}
        as: TransactionManager
      - call: POST /api/commission-records
        payload:
          account_id: ${acc}
          commission_source: THIRD_PARTY
          base_rent_cents: 30000000
          commission_pct: 0.15
          accrual_date: '2026-07-01T00:00:00Z'
        as: AccountExecutive
        captures:
          RXR: $.data.id
      - call: POST /api/fee-accruals
        payload:
          account_id: ${acc}
          period: 2026-Q3
          base_fee_cents: 3000000
        as: AccountExecutive
        captures:
          acr: $.data.id
      trigger:
      - call: GET /api/accounts/${acc}
        as: AccountExecutive
        captures:
          l0: $.data.fee_ledger_credit_cents
      - call: POST /api/lease-executions/${acr}/apply
        payload: {}
        as: TransactionManager
        captures:
          sc: $.data.credit_application_state
      - call: GET /api/accounts/${acc}
        as: AccountExecutive
        captures:
          l2: $.data.fee_ledger_credit_cents
      assert:
      - ${l0} == 6350000.00
      - ${l2} == 6350000.00
      - ${l2} == ${l0}
      - AccountFeeAccrual.${acr}.applied_credit_cents == 6350000.00
      - AccountFeeAccrual.${acr}.credit_application_state == CREDITED
      - ${sc} == CREDITED
  - name: broker_pool_conserves_under_engagement_termination
