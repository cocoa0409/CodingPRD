            - { call: "POST /residency-programs/duty-hour-logs/${l15}/attest", payload: {}, as: Resident, as_user_id: "${res}" }
            - { call: "POST /residency-programs/duty-hour-logs", payload: { resident_id: "${res}", started_at: "2026-08-28T00:00:00Z", ended_at: "2026-08-28T20:00:00Z" }, as: Resident, as_user_id: "${res}", captures: { l16: "$.data.id" } }
