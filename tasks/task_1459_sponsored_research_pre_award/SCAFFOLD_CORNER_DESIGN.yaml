              captures: { err: $.data.error_id }
            - { call: "POST /pre-award/compliance-reviews/${rev_id}/request-info", payload: { question: "disclosure?" }, as: ComplianceOfficer }
            - { call: "POST /pre-award/compliance-reviews/${rev_id}/respond", payload: { response_note: "disclosed", disclosure_complete: true }, as: PI, as_user_id: "${pi_id}" }
            - { call: "POST /pre-award/compliance-reviews/${rev_id}/approve", payload: {}, as: ComplianceOfficer, captures: { st: $.data.status } }
          assert:
            - "err == ERR_COI_DISCLOSURE_INCOMPLETE"
            - "st == APPROVED after disclosure supplied via respond"

