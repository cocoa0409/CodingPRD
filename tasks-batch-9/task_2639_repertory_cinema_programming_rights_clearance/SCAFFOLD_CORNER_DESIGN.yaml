      - name: second_member_with_the_same_email_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=31]
          - errors[ERR_MEMBER_EMAIL_TAKEN]
          - entities.Member.email
        distinguishing_aspect: |
          Uniqueness is scoped by status - a PENDING or ACTIVE holder blocks the address - so the rule must
          be evaluated against the existing row's state rather than against a bare unique index on the column.
          It fails if the second create succeeds, or if it is rejected with a 400 rather than the declared 409.
        test_recipe:
          setup:
            - "One member already exists with email ada@example.com and no donation, so its status is PENDING."
            - "A PENDING holder is inside the blocking status set, so the address is taken even though the membership was never activated."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Ada Wells", email: "ada@example.com", join_date: "2026-07-01" }
              as: BoxOfficeManager
              captures: { m_id: $.data.id }
          trigger:
