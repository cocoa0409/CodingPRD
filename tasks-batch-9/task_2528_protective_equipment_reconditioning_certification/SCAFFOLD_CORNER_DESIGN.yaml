            - call: "POST /approved-parts"
              payload: { model_spec_id: "${model_abs_id}", part_number: "PN-ABS-LINER", component_code: "LINER", oem_approved: true, unit_price_cents: 3100, received_qty: 6 }
              as: PlantManager
              captures: { part_other_id: $.data.id }
            - *k_ship1
            - *k_count1
            - *k_unit1
            - *k_accept1
            - *k_ident18
            - *k_disasm
            - *k_insp_ok
            - *k_bench
            - *k_cal
            - *k_test1
            - *k_impacts_repair
            - &k_determine_repair
              call: "POST /shell-tests/${t1_id}/determine"
