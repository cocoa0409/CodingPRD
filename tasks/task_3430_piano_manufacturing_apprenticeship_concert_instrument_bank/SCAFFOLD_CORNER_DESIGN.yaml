            - { call: "POST /piano-works/skill-endorsements", payload: { apprentice_id: "${apr}", operation_type: RIM_BENDING }, as: WorkshopManager, captures: { en1: $.data.id } }
            - { call: "POST /piano-works/skill-endorsements/${en1}/log-hours", payload: { hours: 600, supervising_craftsman_id: "${cr_rim}" }, as: Apprentice, as_user_id: "${apr}" }
