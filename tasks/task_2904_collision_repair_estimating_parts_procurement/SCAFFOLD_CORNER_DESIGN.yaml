            - "HTTP 404 with data.error_id == ERR_REPAIR_ORDER_NOT_FOUND"
            - "POST /repair-orders with customer_id 00000000-0000-4000-8000-000000000404 returns ERR_CUSTOMER_NOT_FOUND, and with insurer_id absent returns ERR_INSURER_NOT_FOUND"
            - "GET /estimate-lines/00000000-0000-4000-8000-000000000404 returns ERR_ESTIMATE_LINE_NOT_FOUND; GET /supplements/... returns ERR_SUPPLEMENT_NOT_FOUND; GET /parts-lines/... returns ERR_PARTS_LINE_NOT_FOUND; GET /procedure-records/... returns ERR_PROCEDURE_RECORD_NOT_FOUND; GET /parts-vendors/... returns ERR_PARTS_VENDOR_NOT_FOUND; GET /stalls/... returns ERR_STALL_NOT_FOUND; GET /stage-assignments/... returns ERR_STAGE_ASSIGNMENT_NOT_FOUND"
            - "POST /repair-orders/${ro_1}/estimate-lines with damage_line_id ${dl_other} returns ERR_DAMAGE_LINE_NOT_FOUND - the row exists but hangs off ${ro_2}"
            - "POST /procedure-records/${pr_id}/calibration-schedule with bay_id 00000000-0000-4000-8000-000000000404 returns ERR_CALIBRATION_BAY_NOT_FOUND"
            - "every one of the twelve responses carries HTTP 404 and a distinct data.error_id"

      - name: malformed_windows_enums_and_bounds_are_rejected
        claim_type: triggerability
        grounds:
          - errors.ERR_INVALID_WINDOW
          - errors.ERR_INVALID_ENUM_VALUE
          - errors.ERR_INVALID_REQUEST
          - validations.priority_8
          - validations.priority_9
        distinguishing_aspect: >-
          Three 400 codes sit side by side on the same endpoints and must stay distinguishable: a window
          whose end is not strictly after its start is ERR_INVALID_WINDOW, an out-of-vocabulary enum is
          ERR_INVALID_ENUM_VALUE, and a violated numeric bound or unknown field is ERR_INVALID_REQUEST.
          The zero-length window is the sharp case - it parses perfectly and is still refused.
        test_recipe:
          setup:
            - "A BODY stall and a locked order advanced to PARTS_STAGED, so stage-assignment booking is legal."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Sky Fen", phone: "555-1043", email: "sky@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "CRNR-43", name: "Cornerstone Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 } }
              as: ShopAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /stalls"
              payload: { name: "Body L", stall_type: "BODY" }
              as: ShopAdmin
              captures: { stall_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", insurer_id: "${ins_id}", claim_number: "CLM-90049", vehicle_vin: "1HGCV1F30LA090049", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000, deductible_cents: 25000 }
              as: ShopAdmin
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/teardown-findings"
              payload: { panel_code: "LT-DOOR", severity: "MODERATE" }
              as: Estimator
              as_user_id: "est-100"
              captures: { dl1: $.data.id }
            - call: "POST /repair-orders/${ro_id}/estimate-lines"
              payload: { damage_line_id: "${dl1}", operation_code: "BDY-1", labor_type: "BODY", guide_hours: 4.5 }
              as: Estimator
              as_user_id: "est-100"
            - call: "POST /repair-orders/${ro_id}/blueprint"
              payload: {}
              as: Estimator
              as_user_id: "est-100"
            - call: "POST /repair-orders/${ro_id}/estimate/lock"
              payload: {}
              as: Estimator
              as_user_id: "est-100"
            - call: "POST /repair-orders/${ro_id}/stage-advance"
              payload: { to_stage: "PARTS_STAGED" }
              as: Technician
              as_user_id: "tech-100"
          trigger:
            - call: "POST /repair-orders/${ro_id}/stage-assignments"
              payload: { stall_id: "${stall_id}", stage: "REPAIR", window_start: "2026-08-01T08:00:00Z", window_end: "2026-08-01T08:00:00Z" }
              as: Technician
              as_user_id: "tech-100"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_WINDOW; the reversed pair 12:00 -> 08:00 and the unparsable string \"2026-08-01 08:00\" give the same code"
            - "the same call with stage \"PAINTING\" returns HTTP 400 ERR_INVALID_ENUM_VALUE, and GET /parts-lines?procurement_status=SHIPPED does too"
            - "the same call with an extra field rush true returns HTTP 400 ERR_INVALID_REQUEST"
            - "POST /repair-orders/${ro_id}/estimate-lines with guide_hours 0 returns ERR_INVALID_REQUEST, as does POST /parts-vendors with discount_pct 1.0 and POST /repair-orders/${ro_id}/qc-inspections with post_scan_dtc_count -1"
            - "Stall.${stall_id}.booked_minutes is still 0 after every refusal"

      - name: parts_negotiation_missteps_are_rejected
        claim_type: triggerability
        grounds:
          - errors.ERR_COUNTER_NOT_LOWER
          - errors.ERR_VENDOR_MISMATCH
          - errors.ERR_PART_TYPE_NOT_OFFERED
          - errors.ERR_PARTS_LINE_STATE
          - validations.priority_77
        distinguishing_aspect: >-
          The four refusals of the negotiation loop are mutually exclusive and all reachable: a counter
          at or above the standing quote (ERR_COUNTER_NOT_LOWER), a revised quote from a different
          supplier (ERR_VENDOR_MISMATCH), a quote for a part type the supplier does not carry
          (ERR_PART_TYPE_NOT_OFFERED), and accepting a price while the line sits at COUNTERED
          (ERR_PARTS_LINE_STATE, the 409 of the pair).
