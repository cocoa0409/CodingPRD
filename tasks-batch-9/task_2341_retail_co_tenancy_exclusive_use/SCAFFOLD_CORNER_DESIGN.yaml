          occupancy_grace_days: 30
        as: PropertyManager
        as_user_id: pm-1
        captures:
          err: $.data.error_id
      assert:
      - response.http_status == 401
      - response.data.error_id == ERR_UNAUTHENTICATED
      - response.data.error_id != ERR_UNAUTHORIZED
      - GET /centers returns total_count == 0
