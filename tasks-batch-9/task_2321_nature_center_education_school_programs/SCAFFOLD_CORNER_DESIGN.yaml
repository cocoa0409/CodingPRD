      - name: material_publish_is_not_idempotent_and_the_repeat_is_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.CurriculumMaterial.DRAFT_to_PUBLISHED
          - validations.priority_14
          - errors.ERR_INVALID_MATERIAL_STATE
        distinguishing_aspect: |
          The second publish is byte-identical to the first, so an implementation that treats the
          action as idempotent would answer 200 and leave no trace; the design instead demands a
          409 and — critically — that the row's version does not move, which distinguishes a real
          refusal from a no-op write.
