# =============================================================================
# Task 1987 — Tenant Screening Service (tenant screening bureau)
# PRD Benchmark Seed Tables (SCAFFOLD.yaml — §1.0 through §1.7)
# =============================================================================

scenario: |
  1987. Tenant Screening Service (tenant screening bureau): application intake & identity verification, credit/eviction/criminal search per jurisdictional restrictions, income verification & rent-to-income ratio scoring, adverse action notice with reasons & dispute rights, source-of-income & fair housing compliance rules, portable screening report acceptance, co-signer/guarantor evaluation, screening criteria disclosure & consistency audit

domain_name: tenant-screening
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit     # FCRA-style adverse action, dispute rights, jurisdictional suppression, fair housing
  secondary_archetype: workflow_orchestration  # intake -> identity -> searches -> scoring -> decision -> adverse action -> dispute
  complexity_layers:
    - dual_variant_calculation            # SOI-adjusted vs standard ratio; independent vs combined guarantor qualification
    - cascading_side_effects              # dispute correction cascade; landlord suspension cascade
    - optimistic_concurrency              # OCC on Landlord.version for criteria publish
    - rate_threshold_triggers             # identity evidence threshold, ratio thresholds, lookback cutoffs
  entity_topology: flat                   # peer entities joined by foreign keys; no nested URL ownership
  state_machine_shape: cyclic             # report dispute/redelivery loop; identity retry loop; branching elsewhere
  relationship_patterns:
    - one_to_many                         # landlord -> criteria/applications; application -> records/guarantors
    - cross_aggregate                     # disputes reference reports; notices reference applications; portable reuse crosses applications
    - self_referential                    # ScreeningReport.source_report_id (portable copies)
  role_model: segregation_of_duties       # dispute reinvestigator must differ from originating screener
  consistency_model: immediate            # all mutations atomic and visible in the same response

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Landlord
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Landlord / property-manager legal name" }
      - { name: contact_email, type: string, source: input, description: "Billing contact email" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED", constraints: "ACTIVE | SUSPENDED" }
      - { name: fee_balance_cents, type: integer, source: computed, default: 0, description: "Running ledger: sum of screening fees charged minus refunds issued; mutated by record-searches charge, portable-submit charge, and withdraw/suspension refunds" }
      - { name: suspended_at, type: datetime, source: system, description: "Logical-clock timestamp of suspension; null while ACTIVE", default: null }

  - name: JurisdictionRule
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "2-letter US state code the rule governs" }
      - { name: criminal_lookback_years, type: integer, source: input, description: "Criminal records older than this are suppressed; 0 = criminal search prohibited entirely", constraints: ">= 0" }
      - { name: eviction_lookback_years, type: integer, source: input, description: "Eviction records older than this are suppressed", constraints: ">= 0" }
      - { name: source_of_income_protected, type: boolean, source: input, description: "When true, rent-to-income scoring uses the SOI-adjusted variant (voucher share excluded from rent)" }
      - { name: portable_report_acceptance_required, type: boolean, source: input, description: "When true, landlords must accept valid portable reports regardless of criteria" }
      - { name: max_screening_fee_cents, type: integer, source: input, required: false, description: "Jurisdiction fee cap; omitted/null = no cap", default: null }
      - { name: effective_from, type: datetime, source: input, description: "Half-open window start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, required: false, description: "Half-open window end (exclusive); omitted/null = open-ended", default: null }

  - name: ScreeningCriteria
    parent: null
    common_fields: true
    fields:
      - { name: landlord_id, type: string, source: system, description: "FK -> Landlord.id; set from the acting Landlord's X-User-ID at creation" }
      - { name: name, type: string, source: input, description: "Criteria set label" }
      - { name: disclosure_summary, type: string, source: input, description: "Public disclosure text of the criteria shown to applicants (criteria disclosure requirement)" }
      - { name: min_credit_score, type: integer, source: input, description: "Minimum acceptable credit score (inclusive)" }
      - { name: income_multiplier, type: number, source: input, description: "Required verified income as a multiple of monthly rent, e.g. 3.0" }
      - { name: guarantor_policy, type: enum, source: input, description: "INDEPENDENT_ONLY | COMBINED_ALLOWED", constraints: "INDEPENDENT_ONLY | COMBINED_ALLOWED" }
      - { name: guarantor_income_multiplier, type: number, source: input, description: "Standalone guarantor income multiple used by the INDEPENDENT_ONLY variant, e.g. 4.0" }
      - { name: accepts_portable_reports, type: boolean, source: input, description: "Whether this criteria set voluntarily accepts portable screening reports" }
      - { name: accepts_voucher_income, type: boolean, source: input, description: "Whether voucher holders are considered; gates the SOI-adjusted ratio variant" }
      - { name: effective_from, type: datetime, source: input, description: "Closed effective window start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, required: false, description: "Closed effective window end (inclusive); omitted/null = open-ended", default: null }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PUBLISHED | ARCHIVED", constraints: "DRAFT | PUBLISHED | ARCHIVED" }
      - { name: published_at, type: datetime, source: system, description: "Logical-clock timestamp of publication; null until PUBLISHED", default: null }

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Applicant legal name" }
      - { name: dob, type: datetime, source: input, description: "Date of birth" }
      - { name: email, type: string, source: input, description: "Applicant contact email" }
      - { name: ssn_last4, type: string, source: input, description: "Last four SSN digits", constraints: "exactly 4 digits" }
      - { name: residence_state, type: string, source: input, description: "2-letter state of current residence" }

  - name: ScreeningApplication
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id" }
      - { name: landlord_id, type: string, source: system, description: "FK -> Landlord.id; set from the acting Landlord's X-User-ID at creation" }
      - { name: criteria_id, type: string, source: system, description: "FK -> ScreeningCriteria.id; pinned at submit to the PUBLISHED criteria whose closed window contains the submit clock; null until then", default: null }
      - { name: portable_report_id, type: string, source: input, required: false, description: "FK -> ScreeningReport.id; when set, the application reuses a portable report instead of a fresh bureau search", default: null }
      - { name: unit_state_code, type: string, source: input, description: "2-letter state of the rental unit; drives jurisdictional rules" }
      - { name: monthly_rent_cents, type: integer, source: input, description: "Monthly rent of the unit in cents", constraints: "> 0" }
      - { name: stated_monthly_income_cents, type: integer, source: input, description: "Applicant-declared monthly income in cents", constraints: ">= 0" }
      - { name: voucher_monthly_amount_cents, type: integer, source: input, required: false, default: 0, description: "Monthly voucher/subsidy amount in cents (source-of-income input)" }
      - { name: consent_signed_at, type: datetime, source: system, description: "Logical-clock time the applicant signed the screening consent; null until consent", default: null }
      - { name: identity_status, type: enum, source: system, default: UNVERIFIED, description: "Parallel state dimension: UNVERIFIED | VERIFIED | FAILED", constraints: "UNVERIFIED | VERIFIED | FAILED" }
      - { name: identity_attempts, type: integer, source: system, default: 0, description: "Count of identity verification attempts; max 3" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | SCREENING | SCORED | APPROVED | DENIED | WITHDRAWN | CANCELLED", constraints: "DRAFT | SUBMITTED | SCREENING | SCORED | APPROVED | DENIED | WITHDRAWN | CANCELLED" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock time of submission; null until SUBMITTED", default: null }
      - { name: credit_score, type: integer, source: system, description: "Bureau credit score from the search feed (or copied from the portable source report); null until search", default: null }
      - { name: verified_income_cents, type: integer, source: system, description: "Snapshot of the IncomeVerification's verified amount taken at score; null when FAILED or unscored", default: null }
      - { name: affordability_passes, type: boolean, source: system, description: "Result of rent_to_income_ratio at score time; null until scored", default: null }
      - { name: eviction_included_count, type: integer, source: system, description: "Snapshot of INCLUDED eviction records at score time; refreshed on dispute-correction recompute", default: null }
      - { name: criminal_included_count, type: integer, source: system, description: "Snapshot of INCLUDED criminal records at score time; refreshed on dispute-correction recompute", default: null }
      - { name: recommendation, type: enum, source: system, description: "RECOMMEND_APPROVE | RECOMMEND_CONDITIONAL | RECOMMEND_DENY; null until scored", default: null, constraints: "RECOMMEND_APPROVE | RECOMMEND_CONDITIONAL | RECOMMEND_DENY" }
      - { name: decision, type: enum, source: system, description: "Landlord's actual decision: APPROVE | DENY; null until decided", default: null, constraints: "APPROVE | DENY" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock decision time; null until decided", default: null }
      - { name: requires_reconsideration, type: boolean, source: system, default: false, description: "Set true when a dispute correction flips the recommendation away from RECOMMEND_DENY after a DENY decision" }
      - { name: fee_charged_cents, type: integer, source: system, default: 0, description: "Screening fee charged for this application (historical record; not decremented by refunds)" }

  - name: ScreeningReport
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> ScreeningApplication.id" }
      - { name: is_portable_copy, type: boolean, source: system, default: false, description: "True when created by copying a portable report at submit" }
      - { name: source_report_id, type: string, source: system, description: "FK -> ScreeningReport.id; set on portable copies, null on original reports", default: null }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | DELIVERED | UNDER_DISPUTE | AMENDED | RE_DELIVERED | VOIDED", constraints: "DRAFT | DELIVERED | UNDER_DISPUTE | AMENDED | RE_DELIVERED | VOIDED" }
      - { name: originating_screener_id, type: string, source: system, description: "X-User-ID of the Screener who ran the search; portable copies inherit the source's originator; used by segregation-of-duties checks", default: null }
      - { name: credit_score, type: integer, source: system, description: "Credit score carried by this report" }
      - { name: included_record_count, type: integer, source: computed, default: 0, description: "Invariant: equals the number of ScreeningRecord rows of this report with status INCLUDED" }
      - { name: delivered_at, type: datetime, source: system, description: "First delivery time; null until DELIVERED", default: null }
      - { name: last_delivered_at, type: datetime, source: system, description: "Refreshed on every delivery/re-delivery; anchors the 30-day dispute window and portable validity", default: null }

  - name: ScreeningRecord
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: system, description: "FK -> ScreeningReport.id" }
      - { name: record_type, type: enum, source: input, description: "EVICTION | CRIMINAL", constraints: "EVICTION | CRIMINAL" }
      - { name: jurisdiction_state_code, type: string, source: input, description: "State where the record was filed" }
      - { name: record_date, type: datetime, source: input, description: "Filing date of the public record" }
      - { name: description, type: string, source: input, description: "Free-text record description" }
      - { name: status, type: enum, source: system, description: "INCLUDED | SUPPRESSED | DISPUTED | REMOVED", constraints: "INCLUDED | SUPPRESSED | DISPUTED | REMOVED" }
      - { name: suppression_reason, type: enum, source: system, description: "LOOKBACK_EXPIRED | SEARCH_PROHIBITED; null unless SUPPRESSED", default: null, constraints: "LOOKBACK_EXPIRED | SEARCH_PROHIBITED" }

  - name: IncomeVerification
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> ScreeningApplication.id; at most one IncomeVerification per application" }
      - { name: employer_name, type: string, source: input, description: "Employer name being verified" }
      - { name: verified_monthly_income_cents, type: integer, source: system, description: "Verified monthly income set on VERIFIED resolution; null otherwise", default: null }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | VERIFIED | FAILED", constraints: "PENDING | VERIFIED | FAILED" }
      - { name: failure_reason, type: string, source: system, description: "Reason recorded on FAILED; cleared by retry", default: null }

  - name: Guarantor
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> ScreeningApplication.id" }
      - { name: full_name, type: string, source: input, description: "Guarantor legal name" }
      - { name: stated_monthly_income_cents, type: integer, source: input, description: "Guarantor-declared monthly income in cents" }
      - { name: verified_monthly_income_cents, type: integer, source: system, description: "Verified income recorded at evaluation", default: null }
      - { name: credit_score, type: integer, source: system, description: "Guarantor credit score recorded at evaluation", default: null }
      - { name: qualification_policy_used, type: enum, source: system, description: "INDEPENDENT_ONLY | COMBINED_ALLOWED — the variant actually applied from the pinned criteria", default: null, constraints: "INDEPENDENT_ONLY | COMBINED_ALLOWED" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | APPROVED | DECLINED", constraints: "PENDING | APPROVED | DECLINED" }

  - name: AdverseActionNotice
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> ScreeningApplication.id" }
      - { name: reason_codes, type: array, source: system, description: "Ordered enum codes; must be non-empty and grounded in report/application data at issue time", constraints: "members of CREDIT_SCORE_BELOW_MINIMUM | RENT_TO_INCOME_BELOW_REQUIRED | INCOME_UNVERIFIABLE | EVICTION_RECORD | CRIMINAL_RECORD" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ISSUED | RESCINDED", constraints: "DRAFT | ISSUED | RESCINDED" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock issue time; null until ISSUED", default: null }
      - { name: dispute_deadline, type: datetime, source: computed, description: "= issued_at + DISPUTE_WINDOW_DAYS (30 days); null until ISSUED", default: null }
      - { name: rescinded_at, type: datetime, source: system, description: "Logical-clock rescind time; null until RESCINDED", default: null }

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: system, description: "FK -> ScreeningReport.id" }
      - { name: applicant_id, type: string, source: system, description: "FK -> Applicant.id; set from the acting Applicant's X-User-ID" }
      - { name: disputed_record_ids, type: array, source: input, description: "ScreeningRecord ids being challenged; must all belong to the report" }
      - { name: reason_text, type: string, source: input, description: "Applicant's free-text dispute explanation" }
      - { name: status, type: enum, source: system, default: FILED, description: "FILED | UNDER_REINVESTIGATION | RESOLVED_UPHELD | RESOLVED_CORRECTED", constraints: "FILED | UNDER_REINVESTIGATION | RESOLVED_UPHELD | RESOLVED_CORRECTED" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock filing time" }
      - { name: reinvestigation_deadline, type: datetime, source: computed, description: "= filed_at + REINVESTIGATION_SLA_DAYS (30 days)" }
      - { name: reinvestigator_screener_id, type: string, source: system, description: "X-User-ID of the Screener who started reinvestigation; null until then", default: null }
      - { name: resolved_at, type: datetime, source: system, description: "Logical-clock resolution time; null until resolved", default: null }
      - { name: resolution_notes, type: string, source: system, description: "Notes recorded at resolution", default: null }

  - name: ConsistencyAuditRun
    parent: null
    common_fields: false   # immutable event record: id + created_at only
    fields:
      - { name: landlord_id, type: string, source: system, description: "FK -> Landlord.id" }
      - { name: run_at, type: datetime, source: system, description: "Logical-clock time of the audit run" }
      - { name: applications_examined, type: integer, source: system, description: "Count of the landlord's applications with status APPROVED or DENIED" }
      - { name: inconsistencies_found, type: integer, source: system, description: "Count of decision/recommendation mismatches" }
      - { name: inconsistent_application_ids, type: array, source: system, description: "Ids of mismatched applications, ordered by application created_at ASC" }
      - { name: deviation_rate, type: number, source: system, description: "= inconsistencies_found / applications_examined, 4 decimal places round_half_up; 0 when examined == 0" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: ScreeningApplication
    field: status
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED, WITHDRAWN, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/applications/{id}/submit"
        actor: Landlord
        preconditions:
          - "Application in DRAFT (other non-terminal states -> ERR_INVALID_APPLICATION_STATE; terminal states -> ERR_APPLICATION_TERMINAL)"
          - "Exactly one ScreeningCriteria of this landlord with status PUBLISHED whose CLOSED window [effective_from, effective_to] contains the current logical clock; otherwise ERR_NO_PUBLISHED_CRITERIA"
          - "If portable_report_id set: the report exists (ERR_NOT_FOUND); the report's application's applicant_id equals this application's applicant_id and report.status IN {DELIVERED, RE_DELIVERED} (ERR_PORTABLE_REPORT_INVALID); clock <= report.last_delivered_at + PORTABLE_VALIDITY_DAYS, inclusive (ERR_PORTABLE_REPORT_EXPIRED); jurisdiction rule covering unit_state_code has portable_report_acceptance_required == true OR the pinned criteria.accepts_portable_reports == true (ERR_PORTABLE_REPORT_NOT_ACCEPTED)"
        side_effects:
          - "criteria_id pinned to the selected PUBLISHED criteria; submitted_at = clock"
          - "If portable_report_id set: create a ScreeningReport (is_portable_copy=true, source_report_id=portable_report_id, status DRAFT) copying the source report's ScreeningRecord rows, re-running record_suppression_sweep under THIS application's unit_state_code at the submission clock; originating_screener_id inherited from the source report; credit_score copied"
          - "If portable_report_id set: fee_charged_cents = PORTABLE_FLAT_FEE_CENTS and landlord.fee_balance_cents += PORTABLE_FLAT_FEE_CENTS"

      - from: SUBMITTED
        to: SCREENING
        trigger: "POST /api/applications/{id}/record-searches"
        actor: Screener
        preconditions:
          - "Application in SUBMITTED (other non-terminal -> ERR_INVALID_APPLICATION_STATE; terminal -> ERR_APPLICATION_TERMINAL)"
          - "portable_report_id IS NULL (portable applications never run a bureau search -> ERR_PORTABLE_SEARCH_FORBIDDEN)"
          - "consent_signed_at IS NOT NULL (ERR_CONSENT_REQUIRED — checked before identity)"
          - "identity_status == VERIFIED (ERR_IDENTITY_NOT_VERIFIED)"
        side_effects:
          - "Create ScreeningReport (status DRAFT, originating_screener_id = X-User-ID, credit_score from input)"
          - "Create one ScreeningRecord per input record entry, preserving input array order; run record_suppression_sweep for the unit state's rule at the current clock"
          - "report.included_record_count recomputed (count of INCLUDED records)"
          - "fee = screening_fee(unit_state_code); application.fee_charged_cents += fee; landlord.fee_balance_cents += fee"

      - from: SCREENING
        to: SCORED
        trigger: "POST /api/applications/{id}/score"
        actor: Screener
        preconditions:
          - "Application in SCREENING (other non-terminal -> ERR_INVALID_APPLICATION_STATE; terminal -> ERR_APPLICATION_TERMINAL)"
          - "The application's IncomeVerification exists and has status IN {VERIFIED, FAILED} (missing or PENDING -> ERR_INCOME_VERIFICATION_UNRESOLVED)"
        side_effects:
          - "verified_income_cents = income verification's verified_monthly_income_cents (null if FAILED)"
          - "affordability_passes computed via rent_to_income_ratio (variant per jurisdiction SOI flag and criteria.accepts_voucher_income)"
          - "eviction_included_count / criminal_included_count snapshotted from the report's INCLUDED records"
          - "recommendation computed via screening_recommendation decision table"

      - from: SCORED
        to: APPROVED
        trigger: "POST /api/applications/{id}/decide {decision: APPROVE}"
        actor: Landlord
        preconditions:
          - "Application in SCORED (other non-terminal -> ERR_INVALID_APPLICATION_STATE; terminal -> ERR_APPLICATION_TERMINAL)"
          - "The application's report has status IN {DELIVERED, RE_DELIVERED} (ERR_INVALID_REPORT_STATE)"
        side_effects:
          - "decision = APPROVE; decided_at = clock"

      - from: SCORED
        to: DENIED
        trigger: "POST /api/applications/{id}/decide {decision: DENY}"
        actor: Landlord
        preconditions:
          - "Application in SCORED (other non-terminal -> ERR_INVALID_APPLICATION_STATE; terminal -> ERR_APPLICATION_TERMINAL)"
          - "The application's report has status IN {DELIVERED, RE_DELIVERED} (ERR_INVALID_REPORT_STATE)"
        side_effects:
          - "decision = DENY; decided_at = clock"
          - "Create AdverseActionNotice (status DRAFT) with reason_codes derived in pinned order: CREDIT_SCORE_BELOW_MINIMUM if credit_score < criteria.min_credit_score; EVICTION_RECORD if eviction_included_count > 0; CRIMINAL_RECORD if criminal_included_count > 0; INCOME_UNVERIFIABLE if the income verification is FAILED; RENT_TO_INCOME_BELOW_REQUIRED if affordability_passes == false and income was VERIFIED"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /api/applications/{id}/withdraw"
        actor: "Landlord | Applicant"
        preconditions:
          - "Application in DRAFT | SUBMITTED | SCREENING | SCORED (terminal -> ERR_APPLICATION_TERMINAL)"
        side_effects:
          - "If a ScreeningReport exists with status DRAFT: report -> VOIDED"
          - "If fee_charged_cents > 0 AND the application's report has never been delivered (delivered_at IS NULL): refund fee_charged_cents to landlord.fee_balance_cents (charge + refund nets to zero)"
          - "Reports already DELIVERED/RE_DELIVERED/UNDER_DISPUTE/AMENDED keep their state"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /api/applications/{id}/withdraw"
        actor: "Landlord | Applicant"
        preconditions:
          - "Application in DRAFT | SUBMITTED | SCREENING | SCORED (terminal -> ERR_APPLICATION_TERMINAL)"
        side_effects:
          - "If a ScreeningReport exists with status DRAFT: report -> VOIDED"
          - "If fee_charged_cents > 0 AND the application's report has never been delivered (delivered_at IS NULL): refund fee_charged_cents to landlord.fee_balance_cents"
      - from: SCREENING
        to: WITHDRAWN
        trigger: "POST /api/applications/{id}/withdraw"
        actor: "Landlord | Applicant"
        preconditions:
          - "Application in DRAFT | SUBMITTED | SCREENING | SCORED (terminal -> ERR_APPLICATION_TERMINAL)"
        side_effects:
          - "If a ScreeningReport exists with status DRAFT: report -> VOIDED"
          - "If fee_charged_cents > 0 AND the application's report has never been delivered (delivered_at IS NULL): refund fee_charged_cents to landlord.fee_balance_cents"
      - from: SCORED
        to: WITHDRAWN
        trigger: "POST /api/applications/{id}/withdraw"
        actor: "Landlord | Applicant"
        preconditions:
          - "Application in DRAFT | SUBMITTED | SCREENING | SCORED (terminal -> ERR_APPLICATION_TERMINAL)"
        side_effects:
          - "If a ScreeningReport exists with status DRAFT: report -> VOIDED"
          - "If fee_charged_cents > 0 AND the application's report has never been delivered (delivered_at IS NULL): refund fee_charged_cents to landlord.fee_balance_cents"

      - from: DRAFT
        to: CANCELLED
        trigger: "system (landlord suspension cascade from POST /api/landlords/{id}/suspend)"
        actor: system
        preconditions:
          - "Application belongs to the suspended landlord and is in DRAFT | SUBMITTED | SCREENING | SCORED"
        side_effects:
          - "If the application's report has status DRAFT: report -> VOIDED (which itself triggers the fee refund below)"
          - "If fee_charged_cents > 0 AND the report was never delivered (delivered_at IS NULL): refund fee_charged_cents to landlord.fee_balance_cents"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "system (landlord suspension cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "If the application's report has status DRAFT: report -> VOIDED"
          - "If fee_charged_cents > 0 AND the report was never delivered: refund fee_charged_cents to landlord.fee_balance_cents"
      - from: SCREENING
        to: CANCELLED
        trigger: "system (landlord suspension cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "If the application's report has status DRAFT: report -> VOIDED"
          - "If fee_charged_cents > 0 AND the report was never delivered: refund fee_charged_cents to landlord.fee_balance_cents"
      - from: SCORED
        to: CANCELLED
        trigger: "system (landlord suspension cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "If the application's report has status DRAFT: report -> VOIDED"
          - "If fee_charged_cents > 0 AND the report was never delivered: refund fee_charged_cents to landlord.fee_balance_cents"

  - entity: ScreeningApplication
    field: identity_status
    initial_state: UNVERIFIED
    terminal_states: [VERIFIED]
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /api/applications/{id}/verify-identity (evidence_score >= IDENTITY_PASS_THRESHOLD 70)"
        actor: Screener
        preconditions:
          - "Application status IN {DRAFT, SUBMITTED} (SCREENING/SCORED -> ERR_INVALID_APPLICATION_STATE; terminal -> ERR_APPLICATION_TERMINAL)"
          - "identity_attempts < MAX_IDENTITY_ATTEMPTS (3) (ERR_IDENTITY_ATTEMPTS_EXHAUSTED)"
        side_effects: ["identity_attempts += 1; application.status is NOT touched (independent dimension)"]
      - from: UNVERIFIED
        to: FAILED
        trigger: "POST /api/applications/{id}/verify-identity (evidence_score < 70)"
        actor: Screener
        preconditions:
          - "Application status IN {DRAFT, SUBMITTED}"
          - "identity_attempts < 3 (ERR_IDENTITY_ATTEMPTS_EXHAUSTED)"
        side_effects: ["identity_attempts += 1"]
      - from: FAILED
        to: VERIFIED
        trigger: "POST /api/applications/{id}/verify-identity (evidence_score >= 70)"
        actor: Screener
        preconditions:
          - "Application status IN {DRAFT, SUBMITTED}"
          - "identity_attempts < 3 (ERR_IDENTITY_ATTEMPTS_EXHAUSTED)"
        side_effects: ["identity_attempts += 1"]
      - from: FAILED
        to: FAILED
        trigger: "POST /api/applications/{id}/verify-identity (evidence_score < 70; retry self-loop)"
        actor: Screener
        preconditions:
          - "Application status IN {DRAFT, SUBMITTED}"
          - "identity_attempts < 3 (ERR_IDENTITY_ATTEMPTS_EXHAUSTED)"
        side_effects: ["identity_attempts += 1"]
        note: "VERIFIED is terminal for this dimension: verify-identity on a VERIFIED application -> ERR_INVALID_APPLICATION_STATE"

  - entity: ScreeningReport
    field: status
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: DELIVERED
        trigger: "POST /api/reports/{id}/deliver"
        actor: Screener
        preconditions:
          - "Report in DRAFT (else ERR_INVALID_REPORT_STATE)"
          - "Report's application has status SCORED (else ERR_INVALID_APPLICATION_STATE)"
        side_effects: ["delivered_at = last_delivered_at = clock"]
      - from: AMENDED
        to: RE_DELIVERED
        trigger: "POST /api/reports/{id}/deliver"
        actor: Screener
        preconditions:
          - "Report in AMENDED (else ERR_INVALID_REPORT_STATE)"
          - "Report's application has status SCORED | APPROVED | DENIED (else ERR_INVALID_APPLICATION_STATE)"
        side_effects: ["last_delivered_at = clock (delivered_at preserved)"]
      - from: DELIVERED
        to: UNDER_DISPUTE
        trigger: "system (dispute filed via POST /api/reports/{id}/disputes)"
        actor: system
        preconditions: []
        side_effects:
          - "Each ScreeningRecord in the dispute's disputed_record_ids: INCLUDED -> DISPUTED"
          - "included_record_count recomputed"
      - from: RE_DELIVERED
        to: UNDER_DISPUTE
        trigger: "system (dispute filed via POST /api/reports/{id}/disputes — second and later disputes re-enter the loop)"
        actor: system
        preconditions: []
        side_effects:
          - "Each ScreeningRecord in the dispute's disputed_record_ids: INCLUDED -> DISPUTED"
          - "included_record_count recomputed"
      - from: UNDER_DISPUTE
        to: AMENDED
        trigger: "system (dispute resolved CORRECTED via POST /api/disputes/{id}/resolve)"
        actor: system
        preconditions: []
        side_effects:
          - "Each disputed ScreeningRecord: DISPUTED -> REMOVED"
          - "included_record_count recomputed"
          - "Cascade hop 3: the report's ScreeningApplication re-runs screening_recommendation with refreshed included counts (eviction_included_count / criminal_included_count re-snapshotted; verified_income_cents and affordability_passes NOT recomputed)"
          - "Cascade hop 4: if recommendation changes from RECOMMEND_DENY to RECOMMEND_APPROVE or RECOMMEND_CONDITIONAL, set application.requires_reconsideration = true"
      - from: UNDER_DISPUTE
        to: RE_DELIVERED
        trigger: "system (dispute resolved UPHELD via POST /api/disputes/{id}/resolve)"
        actor: system
        preconditions: []
        side_effects:
          - "Each disputed ScreeningRecord: DISPUTED -> INCLUDED"
          - "included_record_count recomputed (invariant: restored to the pre-dispute value)"
          - "last_delivered_at = clock (fresh dispute window)"
      - from: DRAFT
        to: VOIDED
        trigger: "system (application withdrawn or landlord-suspension cascade)"
        actor: system
        preconditions: []
        side_effects: ["Records keep their statuses; report excluded from portable-report and dispute eligibility"]

  - entity: Dispute
    field: status
    initial_state: FILED
    terminal_states: [RESOLVED_UPHELD, RESOLVED_CORRECTED]
    transitions:
      - from: FILED
        to: UNDER_REINVESTIGATION
        trigger: "POST /api/disputes/{id}/start-reinvestigation"
        actor: Screener
        preconditions:
          - "Dispute in FILED (else ERR_INVALID_DISPUTE_STATE)"
          - "X-User-ID != report.originating_screener_id (segregation of duties -> ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["reinvestigator_screener_id = X-User-ID"]
      - from: UNDER_REINVESTIGATION
        to: RESOLVED_UPHELD
        trigger: "POST /api/disputes/{id}/resolve {outcome: UPHELD}"
        actor: Screener
        preconditions:
          - "Dispute in UNDER_REINVESTIGATION (else ERR_INVALID_DISPUTE_STATE)"
          - "X-User-ID == reinvestigator_screener_id (ERR_NOT_REINVESTIGATOR)"
          - "clock <= reinvestigation_deadline (ERR_REINVESTIGATION_OVERDUE)"
        side_effects:
          - "resolved_at = clock; resolution_notes recorded"
          - "Report: UNDER_DISPUTE -> RE_DELIVERED (records DISPUTED -> INCLUDED; included_record_count restored; last_delivered_at refreshed)"
      - from: UNDER_REINVESTIGATION
        to: RESOLVED_CORRECTED
        trigger: "POST /api/disputes/{id}/resolve {outcome: CORRECTED}"
        actor: Screener
        preconditions:
          - "Dispute in UNDER_REINVESTIGATION (else ERR_INVALID_DISPUTE_STATE)"
          - "X-User-ID == reinvestigator_screener_id (ERR_NOT_REINVESTIGATOR)"
          - "clock <= reinvestigation_deadline (ERR_REINVESTIGATION_OVERDUE)"
        side_effects:
          - "resolved_at = clock; resolution_notes recorded"
          - "Cascade: disputed records DISPUTED -> REMOVED; report UNDER_DISPUTE -> AMENDED with included_record_count recomputed; application recommendation recomputed; requires_reconsideration set when the recommendation flips away from RECOMMEND_DENY"

  - entity: IncomeVerification
    field: status
    initial_state: PENDING
    terminal_states: [VERIFIED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /api/income-verifications/{id}/resolve {outcome: VERIFIED, verified_monthly_income_cents}"
        actor: Screener
        preconditions: ["Status PENDING (else ERR_INVALID_INCOME_VERIFICATION_STATE)"]
        side_effects: ["verified_monthly_income_cents recorded"]
      - from: PENDING
        to: FAILED
        trigger: "POST /api/income-verifications/{id}/resolve {outcome: FAILED, failure_reason}"
        actor: Screener
        preconditions: ["Status PENDING (else ERR_INVALID_INCOME_VERIFICATION_STATE)"]
        side_effects: ["failure_reason recorded"]
      - from: FAILED
        to: PENDING
        trigger: "POST /api/income-verifications/{id}/retry"
        actor: Screener
        preconditions: ["Status FAILED (else ERR_INVALID_INCOME_VERIFICATION_STATE)"]
        side_effects: ["failure_reason cleared; verified_monthly_income_cents cleared to null"]

  - entity: Guarantor
    field: status
    initial_state: PENDING
    terminal_states: [APPROVED, DECLINED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /api/guarantors/{id}/evaluate (qualifies under guarantor_qualification)"
        actor: Screener
        preconditions:
          - "Guarantor in PENDING (else ERR_INVALID_GUARANTOR_STATE)"
          - "Application status IN {DRAFT, SUBMITTED, SCREENING, SCORED} (terminal -> ERR_APPLICATION_TERMINAL)"
        side_effects: ["verified_monthly_income_cents and credit_score recorded; qualification_policy_used = pinned criteria's guarantor_policy"]
      - from: PENDING
        to: DECLINED
        trigger: "POST /api/guarantors/{id}/evaluate (does not qualify under guarantor_qualification)"
        actor: Screener
        preconditions:
          - "Guarantor in PENDING (else ERR_INVALID_GUARANTOR_STATE)"
          - "Application status IN {DRAFT, SUBMITTED, SCREENING, SCORED} (terminal -> ERR_APPLICATION_TERMINAL)"
        side_effects: ["verified_monthly_income_cents and credit_score recorded; qualification_policy_used = pinned criteria's guarantor_policy"]

  - entity: AdverseActionNotice
    field: status
    initial_state: DRAFT
    terminal_states: [RESCINDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /api/adverse-action-notices/{id}/issue"
        actor: Landlord
        preconditions:
          - "Notice in DRAFT (else ERR_INVALID_NOTICE_STATE)"
          - "Effective reason_codes (request override if provided, else the draft's derived codes) MUST be non-empty and every code MUST be grounded in the application's current data (ERR_UNGROUNDED_ADVERSE_REASON): CREDIT_SCORE_BELOW_MINIMUM requires credit_score < criteria.min_credit_score; EVICTION_RECORD requires eviction_included_count > 0; CRIMINAL_RECORD requires criminal_included_count > 0; INCOME_UNVERIFIABLE requires the income verification FAILED; RENT_TO_INCOME_BELOW_REQUIRED requires affordability_passes == false with VERIFIED income"
        side_effects: ["issued_at = clock; dispute_deadline = issued_at + 30 days"]
      - from: ISSUED
        to: RESCINDED
        trigger: "POST /api/adverse-action-notices/{id}/rescind"
        actor: Landlord
        preconditions: ["Notice in ISSUED (else ERR_INVALID_NOTICE_STATE)"]
        side_effects: ["rescinded_at = clock"]

  - entity: ScreeningCriteria
    field: status
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/criteria/{id}/publish"
        actor: Landlord
        preconditions:
          - "Criteria in DRAFT (else ERR_INVALID_CRITERIA_STATE)"
          - "OCC: expected_landlord_version == landlord.version (ERR_STALE_VERSION)"
          - "Closed effective window [effective_from, effective_to] MUST NOT overlap any other PUBLISHED criteria of the same landlord; touching endpoints conflict because both endpoints are inclusive (ERR_CRITERIA_WINDOW_OVERLAP)"
        side_effects: ["published_at = clock; landlord.version += 1"]
      - from: DRAFT
        to: ARCHIVED
        trigger: "POST /api/criteria/{id}/archive"
        actor: Landlord
        preconditions: ["Criteria in DRAFT or PUBLISHED (else ERR_INVALID_CRITERIA_STATE)"]
        side_effects: ["Applications already pinned to this criteria continue to be evaluated against it"]
      - from: PUBLISHED
        to: ARCHIVED
        trigger: "POST /api/criteria/{id}/archive"
        actor: Landlord
        preconditions: ["Criteria in DRAFT or PUBLISHED (else ERR_INVALID_CRITERIA_STATE)"]
        side_effects: ["Applications already pinned to this criteria continue to be evaluated against it"]

# =============================================================================
# Concurrency Rules (§1.2.1 — OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: criteria-publish-stale-landlord
    parent_entity: Landlord
    write_endpoint: "POST /api/criteria/{id}/publish"
    occ_field: expected_landlord_version
    description: |
      Publishing a ScreeningCriteria against a Landlord whose version has advanced
      since the client last observed it is rejected. The window-conflict evaluation
      must run against the landlord's latest criteria set, and every successful
      publish advances landlord.version, so a publish carrying a previously observed
      version is acting on a stale view of that set.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: rent_to_income_ratio
    trigger: "POST /api/applications/{id}/score"
    algorithm: threshold
    formula: |
      applicable_rent_cents = monthly_rent_cents                                  (standard variant)
      pass_threshold_cents = round_half_up(criteria.income_multiplier * applicable_rent_cents)
      affordability_passes = (verified_income_cents IS NOT NULL) AND (verified_income_cents >= pass_threshold_cents)
      The >= comparison is INCLUSIVE: income exactly equal to the threshold passes.
    input_set: "The application, its pinned ScreeningCriteria, the JurisdictionRule covering unit_state_code at the current clock (if any), and the resolved IncomeVerification"
    constants: {}
    precision: "integer cents; round_half_up applied to the multiplier product"
    variants:
      - name: soi_adjusted
        when: "JurisdictionRule.source_of_income_protected == true AND voucher_monthly_amount_cents > 0 AND criteria.accepts_voucher_income == true"
        difference: "applicable_rent_cents = monthly_rent_cents - voucher_monthly_amount_cents (only the tenant's share of rent is tested); if the result is <= 0, affordability_passes = true automatically"

  - name: guarantor_qualification
    trigger: "POST /api/guarantors/{id}/evaluate"
    algorithm: threshold
    formula: |
      applicant_verified = the application's IncomeVerification.verified_monthly_income_cents if its status == VERIFIED, else 0
      Variant selected by the pinned criteria's guarantor_policy:
        INDEPENDENT_ONLY: qualifies = guarantor.verified_monthly_income_cents >= round_half_up(criteria.guarantor_income_multiplier * application.monthly_rent_cents)
        COMBINED_ALLOWED: qualifies = (applicant_verified + guarantor.verified_monthly_income_cents) >= round_half_up(criteria.income_multiplier * application.monthly_rent_cents)
      Inclusive >=: equality qualifies. Guarantor credit_score is recorded but not part of the threshold.
    input_set: "The guarantor, its application, the pinned ScreeningCriteria, the application's IncomeVerification"
    constants: {}
    precision: "integer cents; round_half_up applied to the multiplier product"
    variants:
      - name: independent_only
        when: "criteria.guarantor_policy == INDEPENDENT_ONLY"
        difference: "guarantor income alone must meet the higher guarantor_income_multiplier threshold; applicant income is ignored"
      - name: combined_allowed
        when: "criteria.guarantor_policy == COMBINED_ALLOWED"
        difference: "applicant + guarantor verified incomes are pooled against the lower income_multiplier threshold — identical incomes can flip DECLINED to APPROVED"

  - name: screening_recommendation
    trigger: "POST /api/applications/{id}/score; re-run on dispute resolution CORRECTED"
    algorithm: threshold
    formula: |
      Decision table — evaluate in pinned order, first matching branch wins:
        1. credit_score < criteria.min_credit_score                                -> RECOMMEND_DENY
        2. eviction_included_count > 0                                             -> RECOMMEND_DENY
        3. criminal_included_count > 0                                             -> RECOMMEND_DENY
        4. affordability_passes == true                                            -> RECOMMEND_APPROVE
        5. EXISTS Guarantor of this application with status == APPROVED            -> RECOMMEND_CONDITIONAL
        6. otherwise                                                               -> RECOMMEND_DENY
      On dispute-correction re-run, included counts are refreshed from the report;
      verified_income_cents and affordability_passes keep their score-time values.
    input_set: "application.credit_score, pinned criteria, report records with status INCLUDED, IncomeVerification outcome, guarantor statuses"
    constants: {}
    precision: "not numeric; branch order is normative"
    variants: []

  - name: screening_fee
    trigger: "POST /api/applications/{id}/record-searches (full search); POST /api/applications/{id}/submit with portable_report_id (flat fee)"
    algorithm: tiered_pricing
    formula: |
      Executed search types: CREDIT (always), EVICTION (always), CRIMINAL (only when the unit state's
      criminal_lookback_years > 0 — a prohibited search is not executed and not charged).
      Per-type surcharge = round_half_up(SURCHARGE_RATE * BASE_FEE_CENTS)
      computed_fee = BASE_FEE_CENTS + sum of the per-type surcharges
      fee = min(jurisdiction.max_screening_fee_cents, computed_fee) when a covering rule has a non-null cap;
            otherwise fee = computed_fee. The cap binds inclusively (computed == cap -> fee == cap).
      ROUNDING ORDER IS PINNED: round each surcharge component to integer cents FIRST, then sum, then cap.
      (Summing raw fractional surcharges and rounding once would give 3438 for three searches; the pinned
      order gives 3439.)
      Portable applications: fee = PORTABLE_FLAT_FEE_CENTS, no surcharges, no cap.
    input_set: "The application, the JurisdictionRule covering unit_state_code at the current clock (if any)"
    constants:
      BASE_FEE_CENTS: 2500
      SURCHARGE_RATE: 0.125
      PORTABLE_FLAT_FEE_CENTS: 1000
    precision: "integer cents; round_half_up per component, then sum, then cap"
    variants: []

  - name: record_suppression_sweep
    trigger: "record creation inside POST /api/applications/{id}/record-searches; portable-copy creation inside POST /api/applications/{id}/submit"
    algorithm: threshold
    formula: |
      Rule lookup: the JurisdictionRule with state_code == unit_state_code and
      effective_from <= clock < effective_to (null effective_to = open-ended). If none exists, use
      CRIMINAL_LOOKBACK_DEFAULT and EVICTION_LOOKBACK_DEFAULT and criminal search is allowed.
      For each ScreeningRecord:
        record_type == CRIMINAL and criminal_lookback_years == 0 -> SUPPRESSED, suppression_reason = SEARCH_PROHIBITED
        else record_date < (calendar date of clock minus lookback_years for its type) -> SUPPRESSED, suppression_reason = LOOKBACK_EXPIRED
        else -> INCLUDED
      Boundary is pinned: suppression is STRICTLY-OLDER-THAN; a record dated exactly on the cutoff stays INCLUDED.
    input_set: "The report's ScreeningRecord rows and the covering JurisdictionRule (or defaults)"
    constants:
      CRIMINAL_LOOKBACK_DEFAULT: 7
      EVICTION_LOOKBACK_DEFAULT: 7
    precision: "calendar-date comparison"
    variants: []

  - name: compliance_windows
    trigger: "dispute filing; adverse action issue; portable submit; dispute resolve"
    algorithm: threshold
    formula: |
      AdverseActionNotice.dispute_deadline = issued_at + DISPUTE_WINDOW_DAYS
      Dispute filing window on a report: clock <= report.last_delivered_at + DISPUTE_WINDOW_DAYS (INCLUSIVE; exactly at the deadline is allowed)
      Dispute.reinvestigation_deadline = filed_at + REINVESTIGATION_SLA_DAYS; resolving when clock > deadline -> ERR_REINVESTIGATION_OVERDUE (exactly at the deadline is allowed)
      Portable validity at submit: clock <= source_report.last_delivered_at + PORTABLE_VALIDITY_DAYS (INCLUSIVE)
    input_set: "The report / notice / dispute being checked and the logical clock"
    constants:
      DISPUTE_WINDOW_DAYS: 30
      REINVESTIGATION_SLA_DAYS: 30
      PORTABLE_VALIDITY_DAYS: 30
    precision: "datetime comparison, inclusive upper bound"
    variants: []

  - name: consistency_audit
    trigger: "POST /api/landlords/{id}/consistency-audits"
    algorithm: aggregation
    formula: |
      examined = all ScreeningApplication rows with landlord_id == landlord AND status IN {APPROVED, DENIED},
                 ordered by created_at ASC for the ids list
      An application is INCONSISTENT iff:
        (decision == APPROVE AND recommendation == RECOMMEND_DENY) OR
        (decision == DENY   AND recommendation == RECOMMEND_APPROVE)
      RECOMMEND_CONDITIONAL is consistent with both APPROVE and DENY.
      deviation_rate = round_half_up(inconsistencies_found / applications_examined, 4); examined == 0 -> deviation_rate = 0
    input_set: "The landlord's decided applications with their stored recommendation and decision"
    constants: {}
    precision: "deviation_rate: 4 decimal places, round_half_up"
    variants: []

  - name: identity_verification_threshold
    trigger: "POST /api/applications/{id}/verify-identity"
    algorithm: threshold
    formula: |
      evidence_score >= IDENTITY_PASS_THRESHOLD -> identity_status = VERIFIED, else FAILED.
      Inclusive boundary: exactly 70 verifies. Each call increments identity_attempts;
      attempts >= MAX_IDENTITY_ATTEMPTS reject with ERR_IDENTITY_ATTEMPTS_EXHAUSTED before scoring.
    input_set: "The application's identity dimension and the evidence_score input"
    constants:
      IDENTITY_PASS_THRESHOLD: 70
      MAX_IDENTITY_ATTEMPTS: 3
    precision: "integer comparison"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The role in X-User-Role must be permitted on the endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Resource ids in the path (validated left-to-right) and body-referenced ids (applicant_id, portable_report_id) must exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 4
    category: auth
    check: "Entity-backed ownership: Landlord's X-User-ID must equal the resource's landlord_id (criteria, applications, guarantors, notices); Applicant's X-User-ID must equal the owning application's applicant_id (consent, withdraw, dispute filing). Reads by Landlord/Applicant are likewise ownership-scoped. ComplianceAdmin and Screener are unrestricted."
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "all endpoints when the caller is an entity-backed role (Landlord, Applicant)"
  - priority: 5
    category: state
    check: "OCC: expected_landlord_version must equal the landlord's current version (criteria publish only)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/criteria/{id}/publish"
  - priority: 6
    category: state
    check: "Resource from-state must match the endpoint's required state (terminal application states yield ERR_APPLICATION_TERMINAL, other wrong states yield the resource's ERR_INVALID_*_STATE); record-searches on a portable application yields ERR_PORTABLE_SEARCH_FORBIDDEN"
    error_id: "ERR_APPLICATION_TERMINAL / ERR_INVALID_APPLICATION_STATE / ERR_INVALID_CRITERIA_STATE / ERR_INVALID_REPORT_STATE / ERR_INVALID_DISPUTE_STATE / ERR_INVALID_INCOME_VERIFICATION_STATE / ERR_INVALID_GUARANTOR_STATE / ERR_INVALID_NOTICE_STATE / ERR_PORTABLE_SEARCH_FORBIDDEN"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: state
    check: "Cross-entity state: landlord must be ACTIVE when creating applications (ERR_LANDLORD_SUSPENDED); scoring requires the application's IncomeVerification resolved (ERR_INCOME_VERIFICATION_UNRESOLVED); decide requires the report DELIVERED or RE_DELIVERED (ERR_INVALID_REPORT_STATE); guarantor/income-verification creation and guarantor evaluation require the application non-terminal (ERR_APPLICATION_TERMINAL)"
    error_id: "ERR_LANDLORD_SUSPENDED / ERR_INCOME_VERIFICATION_UNRESOLVED / ERR_INVALID_REPORT_STATE / ERR_APPLICATION_TERMINAL"
    http_status: 409
    applies_to: "POST /api/applications; POST /api/applications/{id}/score; POST /api/applications/{id}/decide; POST /api/applications/{id}/guarantors; POST /api/applications/{id}/income-verifications; POST /api/guarantors/{id}/evaluate"
  - priority: 8
    category: business_safety
    check: "Compliance gates, in this order: consent before search (ERR_CONSENT_REQUIRED); identity verified before search (ERR_IDENTITY_NOT_VERIFIED); reinvestigator differs from report originator (ERR_SEGREGATION_OF_DUTIES); resolver is the assigned reinvestigator (ERR_NOT_REINVESTIGATOR); adverse-action reasons non-empty and grounded (ERR_UNGROUNDED_ADVERSE_REASON)"
    error_id: "ERR_CONSENT_REQUIRED / ERR_IDENTITY_NOT_VERIFIED / ERR_SEGREGATION_OF_DUTIES / ERR_NOT_REINVESTIGATOR / ERR_UNGROUNDED_ADVERSE_REASON"
    http_status: 422
    applies_to: "record-searches; dispute start/resolve; notice issue"
  - priority: 9
    category: business_temporal
    check: "Clock-relative windows: dispute filing within last_delivered_at + 30 days (ERR_DISPUTE_WINDOW_CLOSED); portable report age <= 30 days (ERR_PORTABLE_REPORT_EXPIRED); dispute resolution by reinvestigation_deadline (ERR_REINVESTIGATION_OVERDUE)"
    error_id: "ERR_DISPUTE_WINDOW_CLOSED / ERR_PORTABLE_REPORT_EXPIRED / ERR_REINVESTIGATION_OVERDUE"
    http_status: 422
    applies_to: "POST /api/reports/{id}/disputes; POST /api/applications/{id}/submit; POST /api/disputes/{id}/resolve"
  - priority: 10
    category: business_constraint
    check: "Structural constraints: jurisdiction-rule half-open window overlap per state (ERR_RULE_WINDOW_OVERLAP); criteria closed-window overlap per landlord among PUBLISHED (ERR_CRITERIA_WINDOW_OVERLAP); at most one IncomeVerification per application (ERR_INCOME_VERIFICATION_EXISTS); a covering PUBLISHED criteria window must exist at submit (ERR_NO_PUBLISHED_CRITERIA); portable report same-applicant and DELIVERED/RE_DELIVERED (ERR_PORTABLE_REPORT_INVALID); portable acceptance via jurisdiction mandate or criteria (ERR_PORTABLE_REPORT_NOT_ACCEPTED); identity attempts < 3 (ERR_IDENTITY_ATTEMPTS_EXHAUSTED)"
    error_id: "ERR_RULE_WINDOW_OVERLAP / ERR_CRITERIA_WINDOW_OVERLAP / ERR_INCOME_VERIFICATION_EXISTS / ERR_NO_PUBLISHED_CRITERIA / ERR_PORTABLE_REPORT_INVALID / ERR_PORTABLE_REPORT_NOT_ACCEPTED / ERR_IDENTITY_ATTEMPTS_EXHAUSTED"
    http_status: 409
    applies_to: "jurisdiction-rule create; criteria publish; income-verification create; application submit; verify-identity"
  - priority: 11
    category: business_referential
    check: "Every id in disputed_record_ids must belong to the dispute's report"
    error_id: ERR_RECORD_NOT_ON_REPORT
    http_status: 422
    applies_to: "POST /api/reports/{id}/disputes"
  - priority: 12
    category: business_fiscal
    check: "No blocking fiscal validations: the jurisdiction fee cap is applied as a min() inside screening_fee, never as a rejection"
    error_id: "none"
    http_status: 422
    applies_to: "n/a (documentation row)"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving / clock ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock used by every time-dependent rule. Server startup default (before any set call): 2026-08-01T00:00:00Z; the logical clock NEVER falls back to wall-clock time."
    roles: [ComplianceAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock := to_iso8601"]

  # --- Landlords ---
  - method: POST
    path: "/api/landlords"
    description: "Create a landlord (bureau client)"
    roles: [ComplianceAdmin]
    code: 201
    input: [name, contact_email]
    output: Landlord
    side_effects: ["status = ACTIVE; fee_balance_cents = 0; version = 1"]
  - method: GET
    path: "/api/landlords/{id}"
    description: "Get a landlord (includes version for OCC and fee_balance_cents)"
    roles: [ComplianceAdmin, Screener, Landlord, Applicant]
    code: 200
    input: []
    output: Landlord
    side_effects: []
  - method: POST
    path: "/api/landlords/{id}/suspend"
    description: "Suspend a landlord; cascades: every non-terminal application -> CANCELLED, its DRAFT report -> VOIDED, undelivered-report fees refunded to fee_balance_cents"
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: Landlord
    side_effects: ["status = SUSPENDED; suspended_at = clock; application/report/refund cascade per state machine"]

  # --- Jurisdiction rules ---
  - method: POST
    path: "/api/jurisdiction-rules"
    description: "Create a jurisdiction rule; half-open [effective_from, effective_to) windows for the same state_code must not overlap (adjacency allowed)"
    roles: [ComplianceAdmin]
    code: 201
    input: [state_code, criminal_lookback_years, eviction_lookback_years, source_of_income_protected, portable_report_acceptance_required, "max_screening_fee_cents?", effective_from, "effective_to?"]
    output: JurisdictionRule
    side_effects: []
  - method: GET
    path: "/api/jurisdiction-rules"
    description: "List jurisdiction rules, optionally filtered by state_code; ordered by created_at ASC"
    roles: [ComplianceAdmin, Screener, Landlord, Applicant]
    code: 200
    input: ["state_code?"]
    output: "JurisdictionRule[]"
    side_effects: []

  # --- Screening criteria ---
  - method: POST
    path: "/api/criteria"
    description: "Create a screening criteria set in DRAFT; landlord_id is set from the acting Landlord's X-User-ID"
    roles: [Landlord]
    code: 201
    input: [name, disclosure_summary, min_credit_score, income_multiplier, guarantor_policy, guarantor_income_multiplier, accepts_portable_reports, accepts_voucher_income, effective_from, "effective_to?"]
    output: ScreeningCriteria
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/api/criteria"
    description: "List criteria, optionally filtered by landlord_id and/or status; ordered by created_at ASC"
    roles: [ComplianceAdmin, Screener, Landlord, Applicant]
    code: 200
    input: ["landlord_id?", "status?"]
    output: "ScreeningCriteria[]"
    side_effects: []
  - method: GET
    path: "/api/criteria/{id}"
    description: "Get one criteria set (the disclosure document for applicants)"
    roles: [ComplianceAdmin, Screener, Landlord, Applicant]
    code: 200
    input: []
    output: ScreeningCriteria
    side_effects: []
  - method: POST
    path: "/api/criteria/{id}/publish"
    description: "Publish a DRAFT criteria set; OCC-guarded by expected_landlord_version; closed-window overlap with other PUBLISHED criteria of the same landlord is rejected"
    roles: [Landlord]
    code: 200
    input: [expected_landlord_version]
    output: ScreeningCriteria
    side_effects: ["status = PUBLISHED; published_at = clock; increments Landlord.version by 1"]
  - method: POST
    path: "/api/criteria/{id}/archive"
    description: "Archive a DRAFT or PUBLISHED criteria set; pinned applications keep evaluating against it"
    roles: [Landlord]
    code: 200
    input: []
    output: ScreeningCriteria
    side_effects: ["status = ARCHIVED"]

  # --- Applicants ---
  - method: POST
    path: "/api/applicants"
    description: "Register an applicant (bureau intake)"
    roles: [Screener]
    code: 201
    input: [full_name, dob, email, ssn_last4, residence_state]
    output: Applicant
    side_effects: []

  # --- Applications ---
  - method: POST
    path: "/api/applications"
    description: "Create a screening application in DRAFT; landlord_id is set from the acting Landlord's X-User-ID; landlord must be ACTIVE"
    roles: [Landlord]
    code: 201
    input: [applicant_id, unit_state_code, monthly_rent_cents, stated_monthly_income_cents, "voucher_monthly_amount_cents?", "portable_report_id?"]
    output: ScreeningApplication
    side_effects: ["status = DRAFT; identity_status = UNVERIFIED"]
  - method: GET
    path: "/api/applications"
    description: "List applications with optional filters; ordered by created_at ASC; Landlord callers are scoped to their own landlord_id, Applicant callers to their own applicant_id"
    roles: [ComplianceAdmin, Screener, Landlord, Applicant]
    code: 200
    input: ["landlord_id?", "applicant_id?", "criteria_id?", "portable_report_id?", "status?", "limit?", "offset?"]
    output: "ScreeningApplication[]"
    side_effects: []
  - method: GET
    path: "/api/applications/{id}"
    description: "Get one application"
    roles: [ComplianceAdmin, Screener, Landlord, Applicant]
    code: 200
    input: []
    output: ScreeningApplication
    side_effects: []
  - method: POST
    path: "/api/applications/{id}/consent"
    description: "Applicant signs the FCRA screening consent; consent_signed_at = logical clock"
    roles: [Applicant]
    code: 200
    input: []
    output: ScreeningApplication
    side_effects: ["consent_signed_at = clock"]
  - method: POST
    path: "/api/applications/{id}/verify-identity"
    description: "Identity verification attempt on the identity_status dimension; evidence_score >= 70 verifies; max 3 attempts; only while application is DRAFT or SUBMITTED"
    roles: [Screener]
    code: 200
    input: [method, evidence_score]
    output: ScreeningApplication
    side_effects: ["identity_attempts += 1; identity_status per identity_verification_threshold"]
  - method: POST
    path: "/api/applications/{id}/submit"
    description: "Submit a DRAFT application; pins the covering PUBLISHED criteria; portable applications get a re-swept portable-copy report and the flat fee"
    roles: [Landlord]
    code: 200
    input: []
    output: ScreeningApplication
    side_effects: ["status = SUBMITTED; criteria pinned; portable copy + flat fee when portable_report_id set"]
  - method: POST
    path: "/api/applications/{id}/record-searches"
    description: "Run the bureau record search (credit + eviction + criminal as permitted); creates the ScreeningReport and its ScreeningRecord rows with the suppression sweep applied; charges the screening fee"
    roles: [Screener]
    code: 201
    input: [credit_score, records]
    output: ScreeningReport
    side_effects: ["status -> SCREENING; report + records created; screening_fee charged to landlord"]
  - method: POST
    path: "/api/applications/{id}/withdraw"
    description: "Withdraw a non-terminal application; voids an undelivered DRAFT report and refunds the fee if the report was never delivered"
    roles: [Landlord, Applicant]
    code: 200
    input: ["reason?"]
    output: ScreeningApplication
    side_effects: ["status = WITHDRAWN; conditional report void + fee refund"]
  - method: POST
    path: "/api/applications/{id}/score"
    description: "Score a SCREENING application: snapshots income and record counts, computes affordability and the recommendation"
    roles: [Screener]
    code: 200
    input: []
    output: ScreeningApplication
    side_effects: ["status = SCORED; verified_income_cents, affordability_passes, included counts, recommendation computed"]
  - method: POST
    path: "/api/applications/{id}/decide"
    description: "Landlord records the decision; DENY auto-creates a DRAFT adverse-action notice with derived reason codes"
    roles: [Landlord]
    code: 200
    input: [decision]
    output: ScreeningApplication
    side_effects: ["status = APPROVED | DENIED; decided_at = clock; DRAFT AdverseActionNotice on DENY"]

  # --- Guarantors ---
  - method: POST
    path: "/api/applications/{id}/guarantors"
    description: "Add a guarantor/co-signer to a non-terminal application"
    roles: [Landlord]
    code: 201
    input: [full_name, stated_monthly_income_cents]
    output: Guarantor
    side_effects: ["status = PENDING"]
  - method: GET
    path: "/api/guarantors"
    description: "List guarantors, optionally filtered by application_id; ordered by created_at ASC"
    roles: [ComplianceAdmin, Screener, Landlord, Applicant]
    code: 200
    input: ["application_id?"]
    output: "Guarantor[]"
    side_effects: []
  - method: GET
    path: "/api/guarantors/{id}"
    description: "Get one guarantor"
    roles: [ComplianceAdmin, Screener, Landlord, Applicant]
    code: 200
    input: []
    output: Guarantor
    side_effects: []
  - method: POST
    path: "/api/guarantors/{id}/evaluate"
    description: "Evaluate a guarantor under the pinned criteria's guarantor_policy -> APPROVED or DECLINED"
    roles: [Screener]
    code: 200
    input: [verified_monthly_income_cents, credit_score]
    output: Guarantor
    side_effects: ["status per guarantor_qualification; qualification_policy_used recorded"]

  # --- Income verification ---
  - method: POST
    path: "/api/applications/{id}/income-verifications"
    description: "Start income verification for a non-terminal application; at most one per application"
    roles: [Screener]
    code: 201
    input: [employer_name]
    output: IncomeVerification
    side_effects: ["status = PENDING"]
  - method: GET
    path: "/api/income-verifications"
    description: "List income verifications, optionally filtered by application_id"
    roles: [ComplianceAdmin, Screener, Landlord, Applicant]
    code: 200
    input: ["application_id?"]
    output: "IncomeVerification[]"
    side_effects: []
  - method: GET
    path: "/api/income-verifications/{id}"
    description: "Get one income verification"
    roles: [ComplianceAdmin, Screener, Landlord, Applicant]
    code: 200
    input: []
    output: IncomeVerification
    side_effects: []
  - method: POST
    path: "/api/income-verifications/{id}/resolve"
    description: "Resolve a PENDING verification: VERIFIED (requires verified_monthly_income_cents) or FAILED (requires failure_reason)"
    roles: [Screener]
    code: 200
    input: [outcome, "verified_monthly_income_cents?", "failure_reason?"]
    output: IncomeVerification
    side_effects: ["status per outcome"]
  - method: POST
    path: "/api/income-verifications/{id}/retry"
    description: "Re-open a FAILED verification back to PENDING, clearing failure data"
    roles: [Screener]
    code: 200
    input: []
    output: IncomeVerification
    side_effects: ["status = PENDING; failure_reason and verified_monthly_income_cents cleared"]

  # --- Reports & records ---
  - method: GET
    path: "/api/reports"
    description: "List reports, optionally filtered by application_id or source_report_id; ordered by created_at ASC"
    roles: [ComplianceAdmin, Screener, Landlord, Applicant]
    code: 200
    input: ["application_id?", "source_report_id?"]
    output: "ScreeningReport[]"
    side_effects: []
  - method: GET
    path: "/api/reports/{id}"
    description: "Get one report"
    roles: [ComplianceAdmin, Screener, Landlord, Applicant]
    code: 200
    input: []
    output: ScreeningReport
    side_effects: []
  - method: POST
    path: "/api/reports/{id}/deliver"
    description: "Deliver a DRAFT report (-> DELIVERED) or re-deliver an AMENDED report (-> RE_DELIVERED); refreshes last_delivered_at"
    roles: [Screener]
    code: 200
    input: []
    output: ScreeningReport
    side_effects: ["status transition; delivered_at / last_delivered_at stamped"]
  - method: GET
    path: "/api/records"
    description: "List screening records, optionally filtered by report_id; ordered by creation sequence (input array order of the originating record-searches call)"
    roles: [ComplianceAdmin, Screener, Landlord, Applicant]
    code: 200
    input: ["report_id?"]
    output: "ScreeningRecord[]"
    side_effects: []
  - method: GET
    path: "/api/records/{id}"
    description: "Get one screening record"
    roles: [ComplianceAdmin, Screener, Landlord, Applicant]
    code: 200
    input: []
    output: ScreeningRecord
    side_effects: []

  # --- Disputes ---
  - method: POST
    path: "/api/reports/{id}/disputes"
    description: "Applicant disputes report records; requires report DELIVERED/RE_DELIVERED, within the 30-day window, all records on this report; flips report to UNDER_DISPUTE and records to DISPUTED"
    roles: [Applicant]
    code: 201
    input: [disputed_record_ids, reason_text]
    output: Dispute
    side_effects: ["status = FILED; filed_at = clock; reinvestigation_deadline computed; report -> UNDER_DISPUTE; records -> DISPUTED"]
  - method: GET
    path: "/api/disputes"
    description: "List disputes, optionally filtered by report_id or applicant_id; ordered by created_at ASC"
    roles: [ComplianceAdmin, Screener, Landlord, Applicant]
    code: 200
    input: ["report_id?", "applicant_id?"]
    output: "Dispute[]"
    side_effects: []
  - method: GET
    path: "/api/disputes/{id}"
    description: "Get one dispute"
    roles: [ComplianceAdmin, Screener, Landlord, Applicant]
    code: 200
    input: []
    output: Dispute
    side_effects: []
  - method: POST
    path: "/api/disputes/{id}/start-reinvestigation"
    description: "Open reinvestigation on a FILED dispute; the reinvestigator must differ from the report's originating screener (segregation of duties)"
    roles: [Screener]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status = UNDER_REINVESTIGATION; reinvestigator_screener_id = X-User-ID"]
  - method: POST
    path: "/api/disputes/{id}/resolve"
    description: "Resolve a dispute (UPHELD restores records and re-delivers; CORRECTED removes records, amends the report, and recomputes the application's recommendation); only the assigned reinvestigator may resolve, before the reinvestigation deadline"
    roles: [Screener]
    code: 200
    input: [outcome, resolution_notes]
    output: Dispute
    side_effects: ["status = RESOLVED_UPHELD | RESOLVED_CORRECTED; report/record/application cascade per state machine"]

  # --- Adverse action notices ---
  - method: GET
    path: "/api/adverse-action-notices"
    description: "List adverse action notices, optionally filtered by application_id; ordered by created_at ASC"
    roles: [ComplianceAdmin, Screener, Landlord, Applicant]
    code: 200
    input: ["application_id?"]
    output: "AdverseActionNotice[]"
    side_effects: []
  - method: GET
    path: "/api/adverse-action-notices/{id}"
    description: "Get one adverse action notice"
    roles: [ComplianceAdmin, Screener, Landlord, Applicant]
    code: 200
    input: []
    output: AdverseActionNotice
    side_effects: []
  - method: POST
    path: "/api/adverse-action-notices/{id}/issue"
    description: "Issue a DRAFT notice to the applicant; optional reason_codes override; every reason must be grounded in the application's current data"
    roles: [Landlord]
    code: 200
    input: ["reason_codes?"]
    output: AdverseActionNotice
    side_effects: ["status = ISSUED; issued_at = clock; dispute_deadline = issued_at + 30 days"]
  - method: POST
    path: "/api/adverse-action-notices/{id}/rescind"
    description: "Rescind an ISSUED notice (e.g., after a dispute correction flips the recommendation)"
    roles: [Landlord]
    code: 200
    input: []
    output: AdverseActionNotice
    side_effects: ["status = RESCINDED; rescinded_at = clock"]

  # --- Consistency audit ---
  - method: POST
    path: "/api/landlords/{id}/consistency-audits"
    description: "Run a consistency audit over the landlord's decided applications against their pinned recommendations; creates an immutable ConsistencyAuditRun"
    roles: [ComplianceAdmin]
    code: 201
    input: []
    output: ConsistencyAuditRun
    side_effects: ["consistency_audit calculation; ConsistencyAuditRun persisted"]
  - method: GET
    path: "/api/landlords/{id}/consistency-audits"
    description: "List a landlord's audit runs; ordered by created_at ASC"
    roles: [ComplianceAdmin, Screener, Landlord, Applicant]
    code: 200
    input: []
    output: "ConsistencyAuditRun[]"
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role in X-User-Role is not permitted on this endpoint" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Entity-backed caller does not own the target resource (landlord_id / applicant_id mismatch)" }
  # --- Existence / input ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist (path ids left-to-right, then body ids)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, type mismatch, or out-of-range scalar" }
  # --- Concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_landlord_version does not match the landlord's current version (criteria publish OCC)" }
  # --- State ---
  - { id: ERR_APPLICATION_TERMINAL, http: 409, condition: "Application is in a terminal state (APPROVED | DENIED | WITHDRAWN | CANCELLED)" }
  - { id: ERR_INVALID_APPLICATION_STATE, http: 409, condition: "Application is in a non-terminal state that does not permit this operation" }
  - { id: ERR_INVALID_CRITERIA_STATE, http: 409, condition: "Criteria not in the required state (publish needs DRAFT; archive needs DRAFT or PUBLISHED)" }
  - { id: ERR_INVALID_REPORT_STATE, http: 409, condition: "Report not in the required state (deliver needs DRAFT or AMENDED; dispute filing needs DELIVERED or RE_DELIVERED; decide needs the report DELIVERED or RE_DELIVERED)" }
  - { id: ERR_INVALID_DISPUTE_STATE, http: 409, condition: "Dispute not in the required state (start needs FILED; resolve needs UNDER_REINVESTIGATION)" }
  - { id: ERR_INVALID_INCOME_VERIFICATION_STATE, http: 409, condition: "Income verification not in the required state (resolve needs PENDING; retry needs FAILED)" }
  - { id: ERR_INVALID_GUARANTOR_STATE, http: 409, condition: "Guarantor not in PENDING" }
  - { id: ERR_INVALID_NOTICE_STATE, http: 409, condition: "Notice not in the required state (issue needs DRAFT; rescind needs ISSUED)" }
  - { id: ERR_LANDLORD_SUSPENDED, http: 409, condition: "Landlord is SUSPENDED; new applications are rejected" }
  - { id: ERR_INCOME_VERIFICATION_UNRESOLVED, http: 409, condition: "Scoring requires the application's income verification to be VERIFIED or FAILED" }
  # --- Business safety (compliance) ---
  - { id: ERR_CONSENT_REQUIRED, http: 422, condition: "Applicant consent is required before any bureau record search" }
  - { id: ERR_IDENTITY_NOT_VERIFIED, http: 422, condition: "Applicant identity must be VERIFIED before any bureau record search" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The reinvestigating screener must differ from the report's originating screener" }
  - { id: ERR_NOT_REINVESTIGATOR, http: 403, condition: "Only the assigned reinvestigator may resolve the dispute" }
  - { id: ERR_UNGROUNDED_ADVERSE_REASON, http: 422, condition: "Adverse action reason codes must be non-empty and each grounded in the application's current data" }
  # --- Business temporal ---
  - { id: ERR_DISPUTE_WINDOW_CLOSED, http: 422, condition: "Dispute filed after report.last_delivered_at + 30 days" }
  - { id: ERR_PORTABLE_REPORT_EXPIRED, http: 422, condition: "Portable report older than 30 days at submit" }
  - { id: ERR_REINVESTIGATION_OVERDUE, http: 422, condition: "Dispute resolution attempted after reinvestigation_deadline" }
  # --- Business constraint ---
  - { id: ERR_RULE_WINDOW_OVERLAP, http: 409, condition: "Half-open effective window overlaps another rule for the same state_code" }
  - { id: ERR_CRITERIA_WINDOW_OVERLAP, http: 409, condition: "Closed effective window overlaps another PUBLISHED criteria of the same landlord (touching endpoints conflict)" }
  - { id: ERR_INCOME_VERIFICATION_EXISTS, http: 409, condition: "An income verification already exists for this application" }
  - { id: ERR_NO_PUBLISHED_CRITERIA, http: 409, condition: "No PUBLISHED criteria of the landlord covers the submission clock time" }
  - { id: ERR_PORTABLE_REPORT_INVALID, http: 422, condition: "Portable report belongs to a different applicant or is not DELIVERED/RE_DELIVERED" }
  - { id: ERR_PORTABLE_REPORT_NOT_ACCEPTED, http: 422, condition: "Neither the jurisdiction mandate nor the pinned criteria accepts portable reports" }
  - { id: ERR_PORTABLE_SEARCH_FORBIDDEN, http: 409, condition: "Portable applications reuse the copied report and never run a bureau search" }
  - { id: ERR_IDENTITY_ATTEMPTS_EXHAUSTED, http: 409, condition: "Identity verification attempt limit (3) reached" }
  # --- Business referential ---
  - { id: ERR_RECORD_NOT_ON_REPORT, http: 422, condition: "A disputed_record_ids entry does not belong to the dispute's report" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: ComplianceAdmin
    description: "Bureau compliance administrator: manages landlords, jurisdiction rules, the logical clock, and consistency audits"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
      - "POST /api/landlords"
      - "POST /api/landlords/{id}/suspend"
      - "POST /api/jurisdiction-rules"
      - "POST /api/landlords/{id}/consistency-audits"
    shared_operations:
      - "All GET endpoints (unrestricted read)"
  - name: Screener
    description: "Bureau operations screener: registers applicants, verifies identity, runs searches, scores, delivers reports, manages income verifications, evaluates guarantors, reinvestigates disputes"
    identity: opaque
    exclusive_operations:
      - "POST /api/applicants"
      - "POST /api/applications/{id}/verify-identity"
      - "POST /api/applications/{id}/record-searches"
      - "POST /api/applications/{id}/score"
      - "POST /api/applications/{id}/income-verifications"
      - "POST /api/income-verifications/{id}/resolve"
      - "POST /api/income-verifications/{id}/retry"
      - "POST /api/guarantors/{id}/evaluate"
      - "POST /api/reports/{id}/deliver"
      - "POST /api/disputes/{id}/start-reinvestigation"
      - "POST /api/disputes/{id}/resolve"
    shared_operations:
      - "All GET endpoints (unrestricted read)"
  - name: Landlord
    description: "Landlord / property manager client of the bureau: owns criteria, applications, guarantors, decisions, and adverse action notices"
    identity: "entity_backed:Landlord"
    exclusive_operations:
      - "POST /api/criteria"
      - "POST /api/criteria/{id}/publish"
      - "POST /api/criteria/{id}/archive"
      - "POST /api/applications"
      - "POST /api/applications/{id}/submit"
      - "POST /api/applications/{id}/decide"
      - "POST /api/applications/{id}/guarantors"
