# =============================================================================
# task_2343 — Sports Performance Testing & Training Facility
# Athlete performance training center: intake + movement screening, testing
# batteries with normative comparison, periodized program design, group session
# scheduling with coach-to-athlete ratios and station rotation, return-to-sport
# progressions with medical clearance, team contracts with schools/clubs,
# membership packages with expiration and no-show policy, staff certification /
# CEU / liability insurance compliance.
# =============================================================================

scenario: |
  2343. Sports Performance Testing & Training Facility (athlete performance training center):
  athlete intake with movement screening, injury history and performance testing battery,
  program design by sport, position and competitive calendar with periodization, group training
  scheduling with coach-to-athlete ratios and equipment station rotation, testing cadence with
  normative comparison and progress reporting to athletes and parents, return-to-sport
  progressions coordinated with medical providers and clearance documentation, team contracts
  with schools and clubs including travel training and off-site sessions, membership and package
  sales with session expiration and no-show policies, staff certification, continuing education
  and liability insurance

domain_name: sports-performance-facility

# Flat topology: every entity is a peer top-level collection linked by foreign keys.
# There is no single owning aggregate root, so the API prefix is the server root.
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency        # OCC on GroupSession.version and TrainingProgram.version
    - cascading_side_effects        # credential lapse chain, no-show/suspension chain
    - dual_variant_calculation      # intake-vs-reassessment risk, raw-vs-maturity-adjusted norms
    - ops_run_checkpoint            # logical clock advance sweeps clearance + package expiry

  entity_topology: flat
  state_machine_shape: parallel     # Athlete: membership_status x training_clearance; plus cyclic RTS / package / certification machines

  relationship_patterns:
    - one_to_many                   # Athlete -> TestSession / MembershipPackage / InjuryRecord
    - many_to_many                  # Enrollment junction (Athlete x GroupSession), assigned_staff (StaffMember x GroupSession)
    - self_referential              # ProgramBlock.predecessor_block_id chains the periodization blocks
    - cross_aggregate               # TeamContract funds Enrollments on GroupSessions of linked Athletes
    - polymorphic                   # ClearanceDocument.document_type targets an Athlete hold or an RTS stage

  role_model: segregation_of_duties  # medical clearance signer != performance staff; stage-test administrator != stage-decision submitter
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Athlete
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Athlete legal name", constraints: "1..120 chars" }
      - { name: date_of_birth, type: string, source: input, description: "Birth date, YYYY-MM-DD; drives age band selection", constraints: "must be strictly before the current logical date" }
      - { name: sport, type: enum, source: input, description: "Primary sport", constraints: "BASKETBALL | SOCCER | BASEBALL | VOLLEYBALL | TRACK" }
      - { name: position, type: string, source: input, description: "Position label used for normative cohort lookup", constraints: "1..40 chars, upper snake case e.g. GUARD, MIDFIELDER" }
      - { name: guardian_email, type: string, source: input, description: "Parent/guardian contact; required when age_years < 18 at creation", default: null }
      - { name: maturity_offset_months, type: integer, source: input, description: "Biological-vs-chronological maturity offset in months; |value| >= 12 selects the maturity_adjusted_variant of performance_composite_percentile", default: 0, constraints: "-36..36" }
      - { name: team_contract_id, type: string, source: system, description: "FK -> TeamContract.id; null until POST /team-contracts/{id}/athletes links the athlete", default: null }
      - { name: membership_status, type: enum, source: system, description: "PENDING_INTAKE | ACTIVE | SUSPENDED", default: "PENDING_INTAKE" }
      - { name: training_clearance, type: enum, source: system, description: "SCREEN_PENDING | CLEARED | RESTRICTED | MEDICAL_HOLD", default: "SCREEN_PENDING" }
      - { name: injury_risk_score, type: number, source: computed, description: "Latest movement_screen_risk_score output, 2 decimals", default: null }
      - { name: screen_count, type: integer, source: computed, description: "Count of FINALIZED TestSession rows with battery_type == MOVEMENT_SCREEN for this athlete", default: 0 }
      - { name: age_years, type: integer, source: computed, description: "floor((current logical date - date_of_birth) days / 365.25)" }
      - { name: last_composite_percentile, type: number, source: computed, description: "composite_percentile of the most recent FINALIZED PERFORMANCE_BATTERY TestSession (finalized_at DESC, tie-break created_at DESC)", default: null }
      - { name: last_performance_test_at, type: datetime, source: computed, description: "finalized_at of that same TestSession", default: null }
      - { name: next_test_due_on, type: string, source: computed, description: "date(last_performance_test_at) + TEST_CADENCE_DAYS; null while last_performance_test_at is null", default: null }
      - { name: attended_count, type: integer, source: computed, description: "Count of Enrollment rows with status == ATTENDED", default: 0 }
      - { name: no_show_count, type: integer, source: computed, description: "Count of Enrollment rows with status == NO_SHOW", default: 0 }
      - { name: no_show_strikes, type: integer, source: computed, description: "Rolling strike counter; +1 per NO_SHOW, reset to 0 on reinstate", default: 0 }
      - { name: readiness_index, type: number, source: computed, description: "athlete_readiness_index output, 2 decimals, evaluated against the current logical clock on every read and on every enrollment attempt" }

  - name: InjuryRecord
    parent: null
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id" }
      - { name: body_region, type: enum, source: input, description: "KNEE | SHOULDER | ANKLE | HIP | LUMBAR | ELBOW" }
      - { name: severity, type: enum, source: input, description: "MILD | MODERATE | SEVERE" }
      - { name: occurred_on, type: string, source: input, description: "Injury date YYYY-MM-DD", constraints: "<= current logical date" }
      - { name: rts_required, type: boolean, source: input, description: "True when a return-to-sport progression must be completed before unrestricted training", default: false }
      - { name: status, type: enum, source: system, description: "ACTIVE_REHAB | RESOLVED", default: "ACTIVE_REHAB" }

  - name: TestSession
    parent: null
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id" }
      - { name: battery_type, type: enum, source: input, description: "MOVEMENT_SCREEN | PERFORMANCE_BATTERY", constraints: "immutable after creation" }
      - { name: administered_by_staff_id, type: string, source: system, description: "FK -> StaffMember.id; copied from X-User-ID of the Coach that created the session" }
      - { name: rts_plan_id, type: string, source: system, description: "FK -> ReturnToSportPlan.id; set by POST /rts-plans/{id}/stage-test", default: null }
      - { name: results, type: array, source: system, description: "Appended metric rows [{metric_code, value, side}]; only writable while status == DRAFT" }
      - { name: result_count, type: integer, source: computed, description: "Number of rows in results", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED", default: "DRAFT" }
      - { name: age_years_at_test, type: integer, source: computed, description: "Athlete age_years evaluated at finalize time; null while DRAFT", default: null }
      - { name: effective_age_years, type: integer, source: computed, description: "age_years_at_test + round_half_up(maturity_offset_months / 12) when the maturity_adjusted_variant applies, else age_years_at_test", default: null }
      - { name: metric_percentiles, type: array, source: computed, description: "[{metric_code, percentile, norm_band_matched}] produced at finalize for PERFORMANCE_BATTERY", default: null }
      - { name: composite_percentile, type: number, source: computed, description: "performance_composite_percentile output, 1 decimal; null for MOVEMENT_SCREEN", default: null }
      - { name: risk_score, type: number, source: computed, description: "movement_screen_risk_score output, 2 decimals; null for PERFORMANCE_BATTERY", default: null }
      - { name: asymmetry_points, type: integer, source: computed, description: "abs(SL_HOP_L value - SL_HOP_R value) for MOVEMENT_SCREEN; null otherwise", default: null }
      - { name: variant_applied, type: enum, source: computed, description: "INTAKE_SCREEN | REASSESSMENT_SCREEN | RAW_NORM | MATURITY_ADJUSTED; null while DRAFT", default: null }
      - { name: finalized_at, type: datetime, source: system, description: "Logical clock instant of finalize", default: null }

  - name: TrainingProgram
    parent: null
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id" }
      - { name: sport, type: enum, source: input, description: "BASKETBALL | SOCCER | BASEBALL | VOLLEYBALL | TRACK; must equal Athlete.sport at creation" }
      - { name: position, type: string, source: input, description: "Position the program is designed for; must equal Athlete.position at creation" }
      - { name: competition_start_date, type: string, source: input, description: "First day of the competitive calendar, YYYY-MM-DD" }
      - { name: competition_end_date, type: string, source: input, description: "Last day of the competitive calendar, YYYY-MM-DD", constraints: "> competition_start_date" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | ARCHIVED", default: "DRAFT" }
      - { name: block_count, type: integer, source: computed, description: "Number of ProgramBlock rows with this training_program_id", default: 0 }
      - { name: total_weeks, type: integer, source: computed, description: "max(ProgramBlock.end_week) - min(ProgramBlock.start_week) + 1 over this program's blocks; 0 when block_count == 0", default: 0 }
      - { name: planned_load_units, type: number, source: computed, description: "program_planned_load output, 2 decimals", default: 0 }
      - { name: pinned_block_versions, type: array, source: system, description: "[{program_block_id, pinned_version}] snapshot written at activation", default: null }
      - { name: activated_at, type: datetime, source: system, description: "Logical clock instant of activation", default: null }

  - name: ProgramBlock
    parent: TrainingProgram
    common_fields: true
    fields:
      - { name: training_program_id, type: string, source: system, description: "FK -> TrainingProgram.id; taken from the path" }
      - { name: predecessor_block_id, type: string, source: input, description: "FK -> ProgramBlock.id; null for the root block of the chain", default: null }
      - { name: phase, type: enum, source: input, description: "GENERAL_PREP | SPECIFIC_PREP | COMPETITION | TAPER | TRANSITION" }
      - { name: start_week, type: integer, source: input, description: "1-based inclusive first week of the block", constraints: ">= 1" }
      - { name: end_week, type: integer, source: input, description: "Inclusive last week of the block", constraints: ">= start_week" }
      - { name: target_intensity_pct, type: integer, source: input, description: "Prescribed intensity as % of 1RM equivalent", constraints: "40..100" }
      - { name: weekly_volume_units, type: number, source: input, description: "Prescribed weekly volume load units", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "PLANNED | PINNED", default: "PLANNED" }
      - { name: sequence_index, type: integer, source: computed, description: "0 for the root block, predecessor.sequence_index + 1 otherwise" }

  - name: GroupSession
    parent: null
    common_fields: true
    fields:
      - { name: start_at, type: datetime, source: input, description: "Session start instant, ISO 8601 UTC" }
      - { name: end_at, type: datetime, source: input, description: "Session end instant; occupancy interval is half-open [start_at, end_at)", constraints: "> start_at" }
      - { name: site_code, type: enum, source: input, description: "ONSITE | OFFSITE" }
      - { name: offsite_location, type: string, source: input, description: "Travel-training venue label; required when site_code == OFFSITE, must be null when ONSITE", default: null }
      - { name: station_count, type: integer, source: input, description: "Number of equipment stations used in the rotation", constraints: "1..12" }
      - { name: phase_focus, type: enum, source: input, description: "GENERAL_PREP | SPECIFIC_PREP | COMPETITION | TRANSITION" }
      - { name: max_athletes, type: integer, source: input, description: "Roster capacity; RESERVED enrollments beyond this become WAITLISTED", constraints: "1..40" }
      - { name: team_contract_id, type: string, source: input, description: "FK -> TeamContract.id; set when the session is delivered under a school/club contract", default: null }
      - { name: assigned_staff, type: array, source: system, description: "[{staff_member_id, coach_role}] where coach_role is LEAD | ASSISTANT" }
      - { name: compliant_coach_count, type: integer, source: computed, description: "Count of assigned_staff rows whose StaffMember.credential_status != LAPSED", default: 0 }
      - { name: athlete_units, type: number, source: computed, description: "coach_ratio_requirement intermediate: weighted sum of enrolled athlete units, 1 decimal", default: 0 }
      - { name: required_coach_count, type: integer, source: computed, description: "coach_ratio_requirement output", default: 1 }
      - { name: reserved_count, type: integer, source: computed, description: "Count of Enrollment rows with status == RESERVED", default: 0 }
      - { name: waitlisted_count, type: integer, source: computed, description: "Count of Enrollment rows with status == WAITLISTED", default: 0 }
      - { name: attended_count, type: integer, source: computed, description: "Count of Enrollment rows with status == ATTENDED", default: 0 }
      - { name: no_show_count, type: integer, source: computed, description: "Count of Enrollment rows with status == NO_SHOW", default: 0 }
      - { name: session_status, type: enum, source: system, description: "SCHEDULED | ROSTER_LOCKED | IN_PROGRESS | COMPLETED | CANCELED", default: "SCHEDULED" }
      - { name: staffing_status, type: enum, source: system, description: "STAFF_PENDING | STAFFED | UNDERSTAFFED", default: "STAFF_PENDING" }
      - { name: billed_rate_cents, type: integer, source: system, description: "Per-slot contract rate snapshot written at completion by team_contract_session_rate; null until COMPLETED, cleared on void", default: null }
      - { name: rate_tier_applied, type: enum, source: system, description: "TIER_1 | TIER_2 | TIER_3 snapshot written at completion; cleared on void", default: null }
      - { name: delivered_slots_at_completion, type: integer, source: system, description: "Count of TEAM_CONTRACT-funded ATTENDED/NO_SHOW enrollments snapshotted at completion; cleared on void", default: null }
      - { name: cancel_reason, type: string, source: input, description: "Free-text reason recorded by POST /group-sessions/{id}/cancel", default: null }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id" }
      - { name: group_session_id, type: string, source: input, description: "FK -> GroupSession.id" }
      - { name: funding_preference, type: enum, source: input, description: "ANY | PACKAGE_ONLY | DROP_IN_OK; PACKAGE_ONLY forbids the DROP_IN waterfall bucket", default: "ANY" }
      - { name: funding_source, type: enum, source: system, description: "TEAM_CONTRACT | MEMBERSHIP_PACKAGE | DROP_IN | UNFUNDED (WAITLISTED rows are UNFUNDED)", default: "UNFUNDED" }
      - { name: membership_package_id, type: string, source: system, description: "FK -> MembershipPackage.id; set only when funding_source == MEMBERSHIP_PACKAGE", default: null }
      - { name: charge_cents, type: integer, source: system, description: "Out-of-pocket amount from session_charge_allocation; 0 for contract/package funding", default: 0 }
      - { name: status, type: enum, source: system, description: "RESERVED | WAITLISTED | ATTENDED | NO_SHOW | LATE_CANCEL | CANCELED", default: "RESERVED" }
      - { name: cancel_reason, type: enum, source: system, description: "ATHLETE_REQUEST | SESSION_CANCELED | ATHLETE_SUSPENDED | FUNDING_UNAVAILABLE; null unless status IN {CANCELED, LATE_CANCEL}", default: null }
      - { name: station_number, type: integer, source: computed, description: "1-based station assigned by the rotation rule at roster lock; cleared to null when the session reverts to SCHEDULED", default: null }
      - { name: no_show_fee_cents, type: integer, source: computed, description: "no_show_fee output, integer cents; 0 unless status == NO_SHOW", default: 0 }
      - { name: strike_index_at_no_show, type: integer, source: system, description: "Athlete.no_show_strikes value after this no-show was counted; drives the fee multiplier", default: null }
      - { name: promoted_from_waitlist, type: boolean, source: system, description: "True when the row reached RESERVED via waitlist promotion", default: false }

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Staff legal name" }
      - { name: role_title, type: enum, source: input, description: "HEAD_COACH | PERFORMANCE_COACH | INTERN" }
      - { name: liability_insurance_expires_on, type: string, source: input, description: "Liability insurance expiry date YYYY-MM-DD; evaluated live against the logical clock" }
      - { name: credential_status, type: enum, source: computed, description: "LAPSED when lapsed_certification_count >= 1 OR liability_insurance_expires_on < current logical date OR valid_certification_count == 0; else EXPIRING when any Certification.status == EXPIRING; else COMPLIANT" }
      - { name: valid_certification_count, type: integer, source: computed, description: "Count of Certification rows with status IN {VALID, EXPIRING}", default: 0 }
      - { name: lapsed_certification_count, type: integer, source: computed, description: "Count of Certification rows with status == LAPSED", default: 0 }
      - { name: ceu_credits_earned_total, type: integer, source: computed, description: "Sum of Certification.ceu_credits_earned across this staff member's certifications", default: 0 }
      - { name: last_credential_review_at, type: datetime, source: system, description: "Logical clock instant of the last credential review", default: null }

  - name: Certification
    parent: StaffMember
    common_fields: true
    fields:
      - { name: staff_member_id, type: string, source: input, description: "FK -> StaffMember.id" }
      - { name: cert_code, type: enum, source: input, description: "CSCS | USAW | CPR_AED | SCCC" }
      - { name: issued_on, type: string, source: input, description: "Issue date YYYY-MM-DD" }
      - { name: expires_on, type: string, source: input, description: "Expiry date YYYY-MM-DD", constraints: "> issued_on" }
      - { name: ceu_credits_required, type: integer, source: input, description: "Continuing-education credits required for renewal", default: 6, constraints: "0..40" }
      - { name: ceu_credits_earned, type: integer, source: system, description: "Credits recorded on the most recent renewal", default: 0 }
      - { name: status, type: enum, source: system, description: "VALID | EXPIRING | LAPSED", default: "VALID" }
      - { name: renewal_count, type: integer, source: system, description: "Number of successful renewals", default: 0 }

  - name: MembershipPackage
    parent: null
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id" }
      - { name: sessions_purchased, type: integer, source: input, description: "Session credits sold", constraints: "1..100" }
      - { name: price_cents, type: integer, source: input, description: "Amount paid for the package", constraints: ">= 0" }
      - { name: expires_on, type: string, source: input, description: "Contractual expiry date YYYY-MM-DD before freeze credit" }
      - { name: frozen_days_total, type: integer, source: system, description: "Accumulated frozen days credited back to the expiry date", default: 0 }
      - { name: frozen_at, type: datetime, source: system, description: "Logical clock instant of the current freeze; null when not FROZEN", default: null }
      - { name: effective_expires_on, type: string, source: computed, description: "expires_on + frozen_days_total days" }
      - { name: sessions_remaining, type: integer, source: system, description: "Credits still available to reserve", default: null }
      - { name: sessions_reserved, type: integer, source: system, description: "Credits held by RESERVED enrollments", default: 0 }
      - { name: sessions_consumed, type: integer, source: system, description: "Credits consumed by ATTENDED enrollments", default: 0 }
      - { name: sessions_forfeited, type: integer, source: system, description: "Credits lost to NO_SHOW, LATE_CANCEL and expiry sweeps", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | FROZEN | DEPLETED | EXPIRED", default: "ACTIVE" }

  - name: TeamContract
    parent: null
    common_fields: true
    fields:
      - { name: organization_name, type: string, source: input, description: "School or club name" }
      - { name: organization_type, type: enum, source: input, description: "SCHOOL | CLUB" }
      - { name: contracted_sessions, type: integer, source: input, description: "Total athlete session slots purchased by the organization", constraints: "1..500" }
      - { name: base_rate_cents, type: integer, source: input, description: "Undiscounted per-slot rate", constraints: ">= 0" }
      - { name: offsite_allowance, type: integer, source: input, description: "Maximum number of OFFSITE (travel-training) slots the contract may fund", default: 0, constraints: ">= 0" }
      - { name: term_start, type: string, source: input, description: "Contract term start date YYYY-MM-DD" }
      - { name: term_end, type: string, source: input, description: "Contract term end date YYYY-MM-DD", constraints: "> term_start" }
      - { name: sessions_available, type: integer, source: system, description: "Slots not yet reserved or delivered", default: null }
      - { name: sessions_reserved, type: integer, source: system, description: "Slots held by RESERVED contract-funded enrollments", default: 0 }
      - { name: sessions_delivered, type: integer, source: system, description: "Slots consumed by completed sessions (ATTENDED or NO_SHOW)", default: 0 }
      - { name: offsite_sessions_used, type: integer, source: system, description: "Contract-funded slots on OFFSITE sessions (reserved or delivered)", default: 0 }
      - { name: billed_amount_cents, type: integer, source: system, description: "Cumulative billed amount; sum over COMPLETED contract-linked GroupSessions of billed_rate_cents * delivered_slots_at_completion", default: 0 }
      - { name: rate_tier, type: enum, source: computed, description: "TIER_1 when sessions_delivered < 2, TIER_2 when 2 <= sessions_delivered < 5, TIER_3 when sessions_delivered >= 5" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | CLOSED", default: "DRAFT" }

  - name: ReturnToSportPlan
    parent: null
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id" }
      - { name: injury_record_id, type: string, source: input, description: "FK -> InjuryRecord.id; the record must have rts_required == true and status == ACTIVE_REHAB" }
      - { name: target_stage_count, type: integer, source: input, description: "Number of progression stages before medical review", default: 4, constraints: "3..5" }
      - { name: current_stage, type: integer, source: system, description: "1-based active stage", default: 1 }
      - { name: stage_attempts, type: integer, source: system, description: "Failed attempts at the current stage; reset to 0 on stage advance", default: 0 }
      - { name: total_failed_attempts, type: integer, source: computed, description: "Cumulative failed stage attempts across all stages", default: 0 }
      - { name: active_stage_test_id, type: string, source: system, description: "FK -> TestSession.id; the stage test currently under decision, null outside STAGE_TESTING", default: null }
      - { name: status, type: enum, source: system, description: "STAGE_ACTIVE | STAGE_TESTING | MEDICAL_REVIEW | CLEARED | ABORTED", default: "STAGE_ACTIVE" }
      - { name: cleared_at, type: datetime, source: system, description: "Logical clock instant the plan reached CLEARED", default: null }

  - name: ClearanceDocument
    parent: null
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id" }
      - { name: rts_plan_id, type: string, source: input, description: "FK -> ReturnToSportPlan.id; required for STAGE_CLEARANCE and FULL_RELEASE, must be null for MEDICAL_HOLD_RELEASE", default: null }
      - { name: document_type, type: enum, source: input, description: "STAGE_CLEARANCE | FULL_RELEASE | MEDICAL_HOLD_RELEASE" }
      - { name: stage_number, type: integer, source: input, description: "Stage the clearance authorises; required when document_type == STAGE_CLEARANCE, must be null otherwise", default: null }
      - { name: expires_on, type: string, source: input, description: "Clearance validity end date YYYY-MM-DD" }
      - { name: provider_license_id, type: string, source: system, description: "Medical provider licence recorded at signing", default: null }
      - { name: signed_at, type: datetime, source: system, description: "Logical clock instant of signing", default: null }
      - { name: status, type: enum, source: system, description: "PENDING | SIGNED | EXPIRED | REVOKED", default: "PENDING" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # --- Athlete dimension 1 of 2 (parallel dimensions on one entity) ----------
  - entity: Athlete
    field: membership_status
    initial_state: PENDING_INTAKE
    terminal_states: []
    note: "Evolves independently of training_clearance; both dimensions gate enrollment separately."
    transitions:
      - from: PENDING_INTAKE
        to: ACTIVE
        trigger: "POST /test-sessions/{test_session_id}/finalize with battery_type == MOVEMENT_SCREEN"
        actor: Coach
        preconditions:
          - "TestSession.status == DRAFT"
          - "TestSession.athlete_id == this athlete"
          - "Athlete.membership_status == PENDING_INTAKE"
        side_effects:
          - "Athlete.screen_count += 1"
          - "Athlete.injury_risk_score = movement_screen_risk_score output"
          - "Athlete.training_clearance moves out of SCREEN_PENDING per the training_clearance machine"
          - "Athlete.readiness_index recomputed"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /enrollments/{enrollment_id}/no-show (system, when Athlete.no_show_strikes reaches NO_SHOW_SUSPENSION_THRESHOLD)"
        actor: system
        preconditions:
          - "Athlete.membership_status == ACTIVE"
          - "Athlete.no_show_strikes == 3 after the strike increment of this no-show"
        side_effects:
          - "Every Enrollment of this athlete with status == RESERVED on a GroupSession whose start_at > current logical clock transitions to CANCELED with cancel_reason = ATHLETE_SUSPENDED"
          - "Each such cancellation refunds its funding source (MembershipPackage: sessions_reserved -= 1, sessions_remaining += 1; TeamContract: sessions_reserved -= 1, sessions_available += 1, and offsite_sessions_used -= 1 when that session had site_code == OFFSITE)"
          - "Each freed roster slot triggers waitlist promotion on its GroupSession per station_rotation_assignment's sibling rule waitlist_promotion"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /athletes/{athlete_id}/suspend"
        actor: PerformanceDirector
        preconditions:
          - "Athlete.membership_status == ACTIVE"
        side_effects:
          - "Same forward cancellation + refund + waitlist-promotion chain as the system-driven suspension"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /athletes/{athlete_id}/reinstate"
        actor: PerformanceDirector
        preconditions:
          - "Athlete.membership_status == SUSPENDED"
        side_effects:
          - "Athlete.no_show_strikes = 0 (no_show_count is NOT reset — it keeps feeding athlete_readiness_index)"
          - "Athlete.readiness_index recomputed"

  # --- Athlete dimension 2 of 2 --------------------------------------------
  - entity: Athlete
    field: training_clearance
    initial_state: SCREEN_PENDING
    terminal_states: []
    transitions:
      - from: SCREEN_PENDING
        to: CLEARED
        trigger: "POST /test-sessions/{test_session_id}/finalize with battery_type == MOVEMENT_SCREEN"
        actor: Coach
        preconditions:
          - "movement_screen_risk_score output < RISK_RESTRICTION_THRESHOLD (12.00)"
        side_effects: ["Athlete.injury_risk_score written"]
      - from: SCREEN_PENDING
        to: RESTRICTED
        trigger: "POST /test-sessions/{test_session_id}/finalize with battery_type == MOVEMENT_SCREEN"
        actor: Coach
        preconditions:
          - "movement_screen_risk_score output >= RISK_RESTRICTION_THRESHOLD (12.00)"
        side_effects: ["Athlete.injury_risk_score written"]
      - from: CLEARED
        to: RESTRICTED
        trigger: "POST /test-sessions/{test_session_id}/finalize with battery_type == MOVEMENT_SCREEN (reassessment) OR POST /rts-plans"
        actor: Coach | MedicalProvider
        preconditions:
          - "For a reassessment screen: risk_score >= 12.00"
          - "For RTS plan creation: no precondition beyond plan creation succeeding"
        side_effects:
          - "Athlete.injury_risk_score written on the screen path"
          - "On the RTS path the athlete may only enroll in GENERAL_PREP or TRANSITION sessions and needs a SIGNED stage clearance"
      - from: RESTRICTED
        to: CLEARED
        trigger: "POST /test-sessions/{test_session_id}/finalize with battery_type == MOVEMENT_SCREEN (reassessment) OR POST /rts-plans/{rts_plan_id}/stage-decision reaching CLEARED"
        actor: Coach
        preconditions:
          - "For a reassessment screen: risk_score < 12.00 AND the athlete has no ReturnToSportPlan with status IN {STAGE_ACTIVE, STAGE_TESTING, MEDICAL_REVIEW}"
          - "For the RTS path: the plan reached status CLEARED"
        side_effects:
          - "On the RTS path: the plan's InjuryRecord.status becomes RESOLVED and Athlete.readiness_index loses the RTS_PENALTY"
      - from: CLEARED
        to: MEDICAL_HOLD
        trigger: "POST /athletes/{athlete_id}/medical-hold"
        actor: MedicalProvider
        preconditions: ["Athlete.training_clearance IN {CLEARED, RESTRICTED}"]
        side_effects:
          - "Every Enrollment of this athlete with status IN {RESERVED, WAITLISTED} on a GroupSession whose start_at > current logical clock transitions to CANCELED with cancel_reason = ATHLETE_SUSPENDED, refunding its funding source"
      - from: RESTRICTED
        to: MEDICAL_HOLD
        trigger: "POST /athletes/{athlete_id}/medical-hold"
        actor: MedicalProvider
        preconditions: ["Athlete.training_clearance IN {CLEARED, RESTRICTED}"]
        side_effects:
          - "Same forward cancellation + refund chain as the CLEARED -> MEDICAL_HOLD transition"
      - from: MEDICAL_HOLD
        to: CLEARED
        trigger: "POST /clearance-documents/{clearance_document_id}/sign with document_type == MEDICAL_HOLD_RELEASE"
        actor: MedicalProvider
        preconditions:
          - "ClearanceDocument.status == PENDING"
          - "Athlete.injury_risk_score < 12.00 OR Athlete.injury_risk_score IS NULL"
        side_effects: ["Athlete.readiness_index recomputed"]
      - from: MEDICAL_HOLD
        to: RESTRICTED
        trigger: "POST /clearance-documents/{clearance_document_id}/sign with document_type == MEDICAL_HOLD_RELEASE"
        actor: MedicalProvider
        preconditions:
          - "ClearanceDocument.status == PENDING"
          - "Athlete.injury_risk_score >= 12.00"
        side_effects: ["Athlete.readiness_index recomputed"]

  # --- GroupSession dimension 1 of 2 ---------------------------------------
  - entity: GroupSession
    field: session_status
    initial_state: SCHEDULED
    terminal_states: [CANCELED]
    transitions:
      - from: SCHEDULED
        to: ROSTER_LOCKED
        trigger: "POST /group-sessions/{group_session_id}/lock-roster"
        actor: Coach | PerformanceDirector
        preconditions:
          - "GroupSession.session_status == SCHEDULED"
          - "GroupSession.staffing_status == STAFFED"
          - "GroupSession.reserved_count >= 1"
        side_effects:
          - "station_rotation_assignment writes Enrollment.station_number for every RESERVED enrollment"
          - "Increments GroupSession.version by 1"
      - from: ROSTER_LOCKED
        to: SCHEDULED
        trigger: "system (staffing_status becomes UNDERSTAFFED as a consequence of a StaffMember credential lapse)"
        actor: system
        preconditions:
          - "GroupSession.session_status == ROSTER_LOCKED"
          - "GroupSession.compliant_coach_count < GroupSession.required_coach_count"
        side_effects:
          - "Enrollment.station_number cleared to null for every RESERVED enrollment on this session"
      - from: ROSTER_LOCKED
        to: IN_PROGRESS
        trigger: "POST /group-sessions/{group_session_id}/start"
        actor: Coach
        preconditions:
          - "GroupSession.session_status == ROSTER_LOCKED"
          - "GroupSession.staffing_status == STAFFED"
          - "current logical clock >= GroupSession.start_at"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /group-sessions/{group_session_id}/complete"
        actor: Coach
        preconditions:
          - "GroupSession.session_status == IN_PROGRESS"
        side_effects:
          - "Every Enrollment still RESERVED transitions to NO_SHOW, each running the full no-show cascade"
          - "Every Enrollment still WAITLISTED transitions to CANCELED with cancel_reason = SESSION_CANCELED"
          - "When team_contract_id is set: team_contract_session_rate writes GroupSession.billed_rate_cents, rate_tier_applied and delivered_slots_at_completion, then TeamContract.sessions_reserved -= delivered_slots_at_completion, sessions_delivered += delivered_slots_at_completion, billed_amount_cents += billed_rate_cents * delivered_slots_at_completion"
          - "When TeamContract.sessions_delivered == contracted_sessions after the update, TeamContract.status becomes CLOSED"
      - from: COMPLETED
        to: IN_PROGRESS
        trigger: "POST /group-sessions/{group_session_id}/void-completion"
        actor: PerformanceDirector
        preconditions:
          - "GroupSession.session_status == COMPLETED"
          - "No Enrollment on this session has status == NO_SHOW"
        side_effects:
          - "Every Enrollment with status == ATTENDED reverts to RESERVED; Athlete.attended_count -= 1 for each; MembershipPackage.sessions_consumed -= 1 and sessions_reserved += 1 for package-funded rows"
          - "When team_contract_id is set: TeamContract.sessions_delivered -= delivered_slots_at_completion, sessions_reserved += delivered_slots_at_completion, billed_amount_cents -= billed_rate_cents * delivered_slots_at_completion using the stored snapshots (never a recomputed rate)"
          - "TeamContract.status reverts from CLOSED to ACTIVE when sessions_delivered < contracted_sessions"
          - "GroupSession.billed_rate_cents, rate_tier_applied and delivered_slots_at_completion cleared to null"
      - from: SCHEDULED
        to: CANCELED
        trigger: "POST /group-sessions/{group_session_id}/cancel"
        actor: PerformanceDirector
        preconditions: ["GroupSession.session_status IN {SCHEDULED, ROSTER_LOCKED}"]
        side_effects:
          - "Every Enrollment with status IN {RESERVED, WAITLISTED} transitions to CANCELED with cancel_reason = SESSION_CANCELED and its funding is refunded; no strike and no fee is charged"
      - from: ROSTER_LOCKED
        to: CANCELED
        trigger: "POST /group-sessions/{group_session_id}/cancel"
        actor: PerformanceDirector
        preconditions: ["GroupSession.session_status IN {SCHEDULED, ROSTER_LOCKED}"]
        side_effects:
          - "Same refund chain as SCHEDULED -> CANCELED, plus Enrollment.station_number cleared to null"

  # --- GroupSession dimension 2 of 2 ---------------------------------------
  - entity: GroupSession
    field: staffing_status
    initial_state: STAFF_PENDING
    terminal_states: []
    note: "Derived from compliant_coach_count vs required_coach_count; evolves independently of session_status. Over-staffing is explicitly permitted: assigning a further compliant coach to an already STAFFED session is a valid self-transition that only bumps compliant_coach_count and version, and is never rejected as an invalid state."
    transitions:
      - from: STAFF_PENDING
        to: STAFFED
        trigger: "POST /group-sessions/{group_session_id}/coaches"
        actor: PerformanceDirector
        preconditions: ["compliant_coach_count >= required_coach_count after the assignment"]
        side_effects: ["Increments GroupSession.version by 1"]
      - from: STAFF_PENDING
        to: UNDERSTAFFED
        trigger: "POST /group-sessions/{group_session_id}/coaches"
        actor: PerformanceDirector
        preconditions: ["compliant_coach_count >= 1 AND compliant_coach_count < required_coach_count after the assignment"]
        side_effects: ["Increments GroupSession.version by 1"]
      - from: STAFFED
        to: UNDERSTAFFED
        trigger: "POST /enrollments (athlete_units growth raises required_coach_count) OR system (assigned StaffMember credential_status becomes LAPSED)"
        actor: system
        preconditions: ["compliant_coach_count < required_coach_count"]
        side_effects:
          - "When session_status == ROSTER_LOCKED it reverts to SCHEDULED and station numbers are cleared"
      - from: STAFFED
        to: STAFFED
        trigger: "POST /group-sessions/{group_session_id}/coaches (deliberate over-staffing)"
        actor: PerformanceDirector
        preconditions: ["compliant_coach_count >= required_coach_count already, and remains so after the assignment"]
        side_effects: ["Increments GroupSession.version by 1"]
      - from: UNDERSTAFFED
        to: STAFFED
        trigger: "POST /group-sessions/{group_session_id}/coaches OR POST /certifications/{certification_id}/renew restoring an assigned staff member"
        actor: PerformanceDirector
        preconditions: ["compliant_coach_count >= required_coach_count"]
        side_effects: []

  # --- Enrollment ----------------------------------------------------------
  - entity: Enrollment
    field: status
    initial_state: RESERVED
    terminal_states: [NO_SHOW, LATE_CANCEL, CANCELED]
    note: "Initial state is WAITLISTED instead of RESERVED when POST /enrollments carries request_waitlist == true AND either reserved_count == max_athletes or the coach-ratio check would fail; WAITLISTED rows run no funding allocation."
    transitions:
      - from: WAITLISTED
        to: RESERVED
        trigger: "system (waitlist promotion after a RESERVED slot is freed)"
        actor: system
        preconditions:
          - "GroupSession.session_status IN {SCHEDULED, ROSTER_LOCKED}"
          - "GroupSession.reserved_count < max_athletes"
          - "session_charge_allocation resolves a funding bucket for this enrollment"
        side_effects:
          - "promoted_from_waitlist = true; funding_source / membership_package_id / charge_cents written by session_charge_allocation"
          - "Increments GroupSession.version by 1"
      - from: WAITLISTED
        to: CANCELED
        trigger: "system (waitlist promotion attempted but session_charge_allocation found no bucket) OR POST /enrollments/{enrollment_id}/cancel"
        actor: system | Athlete | Guardian | FrontDesk
        preconditions: ["Enrollment.status == WAITLISTED"]
        side_effects:
          - "cancel_reason = FUNDING_UNAVAILABLE on the promotion path, ATHLETE_REQUEST on the explicit path"
          - "On the promotion path the next WAITLISTED enrollment in created_at ASC order is attempted"
      - from: RESERVED
        to: ATTENDED
        trigger: "POST /enrollments/{enrollment_id}/attend"
        actor: Coach
        preconditions:
          - "Enrollment.status == RESERVED"
          - "GroupSession.session_status == IN_PROGRESS"
        side_effects:
          - "Athlete.attended_count += 1; Athlete.readiness_index recomputed"
          - "MembershipPackage.sessions_reserved -= 1 and sessions_consumed += 1 when funding_source == MEMBERSHIP_PACKAGE"
      - from: RESERVED
        to: NO_SHOW
        trigger: "POST /enrollments/{enrollment_id}/no-show OR system (POST /group-sessions/{group_session_id}/complete sweeping leftover RESERVED rows)"
        actor: Coach | FrontDesk | system
        preconditions:
          - "Enrollment.status == RESERVED"
          - "GroupSession.session_status IN {IN_PROGRESS, COMPLETED}"
        side_effects:
          - "no_show_fee written by no_show_fee; strike_index_at_no_show recorded"
          - "MembershipPackage.sessions_reserved -= 1 and sessions_forfeited += 1 when funding_source == MEMBERSHIP_PACKAGE"
          - "Athlete.no_show_count += 1 and Athlete.no_show_strikes += 1; because the strike counter reached NO_SHOW_SUSPENSION_THRESHOLD the athlete's membership_status machine fires ACTIVE -> SUSPENDED, whose own side effects cancel the athlete's future RESERVED enrollments and those cancellations in turn promote waitlisted athletes"
          - "Athlete.readiness_index recomputed"
      - from: RESERVED
        to: CANCELED
        trigger: "POST /enrollments/{enrollment_id}/cancel at least LATE_CANCEL_WINDOW_HOURS before GroupSession.start_at"
        actor: Athlete | Guardian | FrontDesk
        preconditions:
          - "Enrollment.status == RESERVED"
          - "GroupSession.session_status IN {SCHEDULED, ROSTER_LOCKED}"
          - "(GroupSession.start_at - current logical clock) >= 24 hours"
        side_effects:
          - "cancel_reason = ATHLETE_REQUEST"
          - "Funding refunded: MembershipPackage.sessions_reserved -= 1 and sessions_remaining += 1 (status DEPLETED reverts to ACTIVE); TeamContract.sessions_reserved -= 1 and sessions_available += 1 (and offsite_sessions_used -= 1 for OFFSITE sessions)"
          - "station_number cleared to null; the freed slot triggers waitlist promotion"
          - "Increments GroupSession.version by 1"
      - from: RESERVED
        to: LATE_CANCEL
        trigger: "POST /enrollments/{enrollment_id}/cancel less than LATE_CANCEL_WINDOW_HOURS before GroupSession.start_at"
        actor: Athlete | Guardian | FrontDesk
        preconditions:
          - "Enrollment.status == RESERVED"
          - "GroupSession.session_status IN {SCHEDULED, ROSTER_LOCKED}"
          - "(GroupSession.start_at - current logical clock) < 24 hours"
        side_effects:
          - "cancel_reason = ATHLETE_REQUEST; the session credit is forfeited: MembershipPackage.sessions_reserved -= 1 and sessions_forfeited += 1; TeamContract.sessions_reserved -= 1 and sessions_delivered += 1"
          - "No strike is recorded and no_show_fee_cents stays 0"
          - "The freed slot triggers waitlist promotion"
      - from: ATTENDED
        to: RESERVED
        trigger: "POST /group-sessions/{group_session_id}/void-completion"
        actor: PerformanceDirector
        preconditions: ["GroupSession.session_status == COMPLETED", "No Enrollment on the session has status == NO_SHOW"]
        side_effects: ["Athlete.attended_count -= 1; package counters reversed"]

  # --- MembershipPackage ---------------------------------------------------
  - entity: MembershipPackage
    field: status
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /membership-packages/{membership_package_id}/freeze"
        actor: FrontDesk | PerformanceDirector
        preconditions: ["MembershipPackage.status == ACTIVE"]
        side_effects: ["frozen_at = current logical clock; the package leaves the session_charge_allocation candidate pool"]
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /membership-packages/{membership_package_id}/unfreeze"
        actor: FrontDesk | PerformanceDirector
        preconditions: ["MembershipPackage.status == FROZEN"]
        side_effects:
          - "frozen_days_total += ceil((current logical clock - frozen_at) / 86400 seconds); frozen_at = null"
          - "effective_expires_on recomputed by package_effective_expiry"
      - from: ACTIVE
        to: DEPLETED
        trigger: "POST /enrollments (system, when the reservation consumes the last remaining credit)"
        actor: system
        preconditions: ["sessions_remaining == 0 after the decrement"]
        side_effects: []
      - from: DEPLETED
        to: ACTIVE
        trigger: "POST /enrollments/{enrollment_id}/cancel at least 24 hours ahead, or a suspension/session-cancel refund"
        actor: system
        preconditions: ["sessions_remaining >= 1 after the refund"]
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc (system sweep, effective_expires_on < new logical date)"
        actor: system
        preconditions: ["MembershipPackage.status IN {ACTIVE, FROZEN, DEPLETED}", "effective_expires_on < date(new logical clock)"]
        side_effects:
          - "sessions_forfeited += sessions_remaining; sessions_remaining = 0 (the conservation identity is preserved)"
      - from: FROZEN
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc (system sweep)"
        actor: system
        preconditions: ["effective_expires_on < date(new logical clock)"]
        side_effects: ["sessions_forfeited += sessions_remaining; sessions_remaining = 0"]
      - from: DEPLETED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc (system sweep)"
        actor: system
        preconditions: ["effective_expires_on < date(new logical clock)"]
        side_effects: []

  # --- Certification -------------------------------------------------------
  - entity: Certification
    field: status
    initial_state: VALID
    terminal_states: []
    note: "Certification lapse is NOT swept by the clock: it is only re-evaluated by POST /certifications and POST /staff-members/{id}/credential-review. Liability insurance, by contrast, is evaluated live."
    transitions:
      - from: VALID
        to: EXPIRING
        trigger: "POST /staff-members/{staff_member_id}/credential-review"
        actor: PerformanceDirector
        preconditions: ["0 <= (expires_on - date(current logical clock)) <= 30 days"]
        side_effects: ["StaffMember.credential_status recomputed to EXPIRING when no certification is LAPSED"]
      - from: VALID
        to: LAPSED
        trigger: "POST /staff-members/{staff_member_id}/credential-review"
        actor: PerformanceDirector
        preconditions: ["expires_on < date(current logical clock)"]
        side_effects:
          - "Because this certification lapsed, StaffMember.lapsed_certification_count += 1 and StaffMember.credential_status becomes LAPSED"
          - "Because credential_status became LAPSED, the staff member is removed from assigned_staff of every GroupSession with session_status IN {SCHEDULED, ROSTER_LOCKED} and start_at > current logical clock, lowering compliant_coach_count"
          - "Because compliant_coach_count dropped below required_coach_count, each affected session's staffing_status becomes UNDERSTAFFED"
          - "Because staffing_status became UNDERSTAFFED, each affected ROSTER_LOCKED session reverts to SCHEDULED and its RESERVED enrollments have station_number cleared to null"
      - from: EXPIRING
        to: LAPSED
        trigger: "POST /staff-members/{staff_member_id}/credential-review"
        actor: PerformanceDirector
        preconditions: ["expires_on < date(current logical clock)"]
        side_effects: ["Same downstream chain as VALID -> LAPSED"]
      - from: LAPSED
        to: VALID
        trigger: "POST /certifications/{certification_id}/renew"
        actor: PerformanceDirector
        preconditions:
          - "Certification.status IN {VALID, EXPIRING, LAPSED}"
          - "ceu_credits_earned >= ceu_credits_required"
          - "new_expires_on > date(current logical clock)"
        side_effects:
          - "expires_on = new_expires_on; renewal_count += 1; ceu_credits_earned recorded"
          - "StaffMember.credential_status recomputed (LAPSED -> COMPLIANT when no other certification is LAPSED and insurance is live)"
      - from: EXPIRING
        to: VALID
        trigger: "POST /certifications/{certification_id}/renew"
        actor: PerformanceDirector
        preconditions: ["ceu_credits_earned >= ceu_credits_required", "new_expires_on - date(current logical clock) > 30 days"]
        side_effects: ["renewal_count += 1; StaffMember.credential_status recomputed"]

  # --- ReturnToSportPlan (cyclic) -----------------------------------------
  - entity: ReturnToSportPlan
    field: status
    initial_state: STAGE_ACTIVE
    terminal_states: [CLEARED, ABORTED]
    note: "STAGE_ACTIVE -> STAGE_TESTING -> STAGE_ACTIVE is a revision loop that can repeat per stage and across stages. RTS_MAX_STAGE_ATTEMPTS is 2: the first FAIL at a stage returns the plan to STAGE_ACTIVE, the second FAIL at that same stage sends it to MEDICAL_REVIEW."
    transitions:
      - from: STAGE_ACTIVE
        to: STAGE_TESTING
        trigger: "POST /rts-plans/{rts_plan_id}/stage-test"
        actor: Coach
        preconditions:
          - "ReturnToSportPlan.status == STAGE_ACTIVE"
          - "The acting StaffMember (X-User-ID) has credential_status != LAPSED"
        side_effects:
          - "A new TestSession is created with battery_type PERFORMANCE_BATTERY, status DRAFT, athlete_id = plan.athlete_id, rts_plan_id = plan id and administered_by_staff_id = the acting X-User-ID"
          - "active_stage_test_id = the new TestSession.id"
      - from: STAGE_TESTING
        to: STAGE_ACTIVE
        trigger: "POST /rts-plans/{rts_plan_id}/stage-decision with decision == PASS and current_stage < target_stage_count"
        actor: MedicalProvider
        preconditions:
          - "ReturnToSportPlan.status == STAGE_TESTING"
          - "TestSession(active_stage_test_id).status == FINALIZED"
          - "X-User-ID != TestSession.administered_by_staff_id of active_stage_test_id"
          - "A ClearanceDocument exists with rts_plan_id == plan id, document_type == STAGE_CLEARANCE, stage_number == current_stage, status == SIGNED and expires_on >= date(current logical clock)"
        side_effects:
          - "current_stage += 1; stage_attempts = 0; active_stage_test_id = null"
      - from: STAGE_TESTING
        to: STAGE_ACTIVE
        trigger: "POST /rts-plans/{rts_plan_id}/stage-decision with decision == FAIL and stage_attempts + 1 < RTS_MAX_STAGE_ATTEMPTS (2)"
        actor: MedicalProvider
        preconditions:
          - "ReturnToSportPlan.status == STAGE_TESTING"
          - "TestSession(active_stage_test_id).status == FINALIZED"
          - "X-User-ID != TestSession.administered_by_staff_id of active_stage_test_id"
        side_effects:
          - "stage_attempts += 1; total_failed_attempts += 1; current_stage unchanged; active_stage_test_id = null"
      - from: STAGE_TESTING
        to: MEDICAL_REVIEW
        trigger: "POST /rts-plans/{rts_plan_id}/stage-decision with decision == PASS at current_stage == target_stage_count, OR decision == FAIL when stage_attempts + 1 == RTS_MAX_STAGE_ATTEMPTS (2)"
        actor: MedicalProvider
        preconditions:
          - "ReturnToSportPlan.status == STAGE_TESTING"
          - "TestSession(active_stage_test_id).status == FINALIZED"
          - "X-User-ID != TestSession.administered_by_staff_id of active_stage_test_id"
          - "On the PASS path only: a SIGNED, unexpired STAGE_CLEARANCE for current_stage exists"
        side_effects:
          - "active_stage_test_id = null; on the FAIL path stage_attempts += 1 and total_failed_attempts += 1"
      - from: MEDICAL_REVIEW
        to: CLEARED
        trigger: "POST /clearance-documents/{clearance_document_id}/sign with document_type == FULL_RELEASE"
        actor: MedicalProvider
        preconditions:
          - "ReturnToSportPlan.status == MEDICAL_REVIEW"
          - "ClearanceDocument.rts_plan_id == plan id AND status == PENDING"
        side_effects:
          - "cleared_at = current logical clock"
          - "Because the plan reached CLEARED, its InjuryRecord.status becomes RESOLVED"
          - "Because the injury resolved and no other plan is open, Athlete.training_clearance moves RESTRICTED -> CLEARED"
          - "Because the athlete is no longer in an open RTS progression, Athlete.readiness_index is recomputed without RTS_PENALTY"
      - from: STAGE_ACTIVE
        to: ABORTED
        trigger: "POST /rts-plans/{rts_plan_id}/abort"
        actor: MedicalProvider | PerformanceDirector
        preconditions: ["ReturnToSportPlan.status IN {STAGE_ACTIVE, STAGE_TESTING, MEDICAL_REVIEW}"]
        side_effects:
          - "Athlete.training_clearance set to MEDICAL_HOLD; every RESERVED/WAITLISTED future enrollment of the athlete is CANCELED with cancel_reason = ATHLETE_SUSPENDED and refunded"
      - from: MEDICAL_REVIEW
        to: ABORTED
        trigger: "POST /rts-plans/{rts_plan_id}/abort"
        actor: MedicalProvider | PerformanceDirector
        preconditions: ["ReturnToSportPlan.status IN {STAGE_ACTIVE, STAGE_TESTING, MEDICAL_REVIEW}"]
        side_effects: ["Same chain as STAGE_ACTIVE -> ABORTED"]

  # --- ClearanceDocument ---------------------------------------------------
  - entity: ClearanceDocument
    field: status
    initial_state: PENDING
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: PENDING
        to: SIGNED
        trigger: "POST /clearance-documents/{clearance_document_id}/sign"
        actor: MedicalProvider
        preconditions:
          - "ClearanceDocument.status == PENDING"
          - "expires_on >= date(current logical clock)"
        side_effects:
          - "signed_at = current logical clock; provider_license_id recorded"
          - "document_type == MEDICAL_HOLD_RELEASE drives the Athlete.training_clearance machine out of MEDICAL_HOLD"
          - "document_type == FULL_RELEASE drives the linked ReturnToSportPlan MEDICAL_REVIEW -> CLEARED"
      - from: SIGNED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc (system sweep, expires_on < new logical date)"
        actor: system
        preconditions: ["ClearanceDocument.status == SIGNED", "expires_on < date(new logical clock)"]
        side_effects: ["Stage-clearance gating for the linked athlete starts failing with ERR_CLEARANCE_EXPIRED"]
      - from: SIGNED
        to: REVOKED
        trigger: "POST /clearance-documents/{clearance_document_id}/revoke"
        actor: MedicalProvider
        preconditions: ["ClearanceDocument.status IN {PENDING, SIGNED}"]
        side_effects:
          - "Every Enrollment of the athlete with status IN {RESERVED, WAITLISTED} on a GroupSession with start_at > current logical clock is CANCELED with cancel_reason = ATHLETE_SUSPENDED and refunded, when the athlete has an open ReturnToSportPlan"
      - from: PENDING
        to: REVOKED
        trigger: "POST /clearance-documents/{clearance_document_id}/revoke"
        actor: MedicalProvider
        preconditions: ["ClearanceDocument.status IN {PENDING, SIGNED}"]
        side_effects: []

  # --- TrainingProgram -----------------------------------------------------
  - entity: TrainingProgram
    field: status
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /training-programs/{training_program_id}/activate"
        actor: PerformanceDirector
        preconditions:
          - "TrainingProgram.status == DRAFT"
          - "block_count >= 2"
          - "Exactly one ProgramBlock has predecessor_block_id == null and the blocks form a single chain with no branch and no cycle"
          - "For every non-root block: start_week == predecessor.end_week + 1"
          - "At least one block has phase == COMPETITION"
          - "Athlete.training_clearance != MEDICAL_HOLD"
        side_effects:
          - "Every ProgramBlock of this program moves PLANNED -> PINNED and pinned_block_versions snapshots each block id with its current version"
          - "activated_at = current logical clock; planned_load_units written by program_planned_load"
          - "Because this program became ACTIVE, any other TrainingProgram of the same athlete with status == ACTIVE is ARCHIVED"
      - from: ACTIVE
        to: ARCHIVED
        trigger: "system (another TrainingProgram for the same athlete is activated)"
        actor: system
        preconditions: ["TrainingProgram.status == ACTIVE"]
        side_effects: ["pinned_block_versions retained as the historical record"]

  # --- TeamContract --------------------------------------------------------
  - entity: TeamContract
    field: status
    initial_state: DRAFT
    terminal_states: []
    note: "CLOSED is auto-derived from the delivered counter rather than terminal: a void-completion that lowers sessions_delivered below contracted_sessions reopens the contract to ACTIVE."
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /team-contracts/{team_contract_id}/activate"
        actor: PerformanceDirector
        preconditions:
          - "TeamContract.status == DRAFT"
          - "term_end > date(current logical clock)"
        side_effects: ["sessions_available = contracted_sessions"]
      - from: ACTIVE
        to: CLOSED
        trigger: "system (POST /group-sessions/{group_session_id}/complete raising sessions_delivered to contracted_sessions)"
        actor: system
        preconditions: ["sessions_delivered == contracted_sessions"]
        side_effects: ["The contract leaves the session_charge_allocation candidate pool"]
      - from: CLOSED
        to: ACTIVE
        trigger: "POST /group-sessions/{group_session_id}/void-completion lowering sessions_delivered below contracted_sessions"
        actor: PerformanceDirector
        preconditions: ["sessions_delivered < contracted_sessions after the reversal"]
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: coach-assign-stale-session
    parent_entity: GroupSession
    write_endpoint: "POST /group-sessions/{group_session_id}/coaches"
    occ_field: "expected_group_session_version"
    description: |
      Assigning a coach to a GroupSession whose version has advanced since the client last
      observed it is rejected. Adding a second, different coach is legitimate product
      behaviour, so this is not covered by any state precondition: the guard exists because
      the client's view of assigned_staff, required_coach_count and staffing_status is stale
      once any earlier assignment, enrollment or roster lock has advanced the session version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: block-add-stale-program
    parent_entity: TrainingProgram
    write_endpoint: "POST /training-programs/{training_program_id}/blocks"
    occ_field: "expected_training_program_version"
    description: |
      Appending a ProgramBlock to a TrainingProgram whose version has advanced since the
      client last read it is rejected. Appending another block is legitimate while the
      program is DRAFT, but the new block's start_week must equal its predecessor's
      end_week + 1, so a stale view of the chain would silently create a week gap or overlap.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: movement_screen_risk_score
    trigger: "POST /test-sessions/{test_session_id}/finalize when battery_type == MOVEMENT_SCREEN; writes TestSession.risk_score, TestSession.asymmetry_points, TestSession.variant_applied and Athlete.injury_risk_score"
    algorithm: weighted_scoring
    formula: |
      # Required metric codes, each scored 0..3 (integer):
      #   OH_SQUAT, HURDLE_STEP, INLINE_LUNGE, SL_HOP_L, SL_HOP_R
      raw_total       = sum(value of the five required metric rows)          # 0..15
      asymmetry_points= abs(value(SL_HOP_L) - value(SL_HOP_R))               # 0..3
      deficit         = SCREEN_MAX_SCORE - raw_total + ASYMMETRY_WEIGHT * asymmetry_points
      # history_multiplier depends on the variant (see variants below)
      risk_score      = round_half_up(
                          min(RISK_SCORE_CEILING, max(0, deficit * history_multiplier)), 2)
      # Clearance side effect (threshold is inclusive on the RESTRICTED side):
      #   risk_score >= RISK_RESTRICTION_THRESHOLD -> Athlete.training_clearance = RESTRICTED
      #   risk_score <  RISK_RESTRICTION_THRESHOLD -> Athlete.training_clearance = CLEARED
    input_set: "Exactly the five required MOVEMENT_SCREEN metric rows of this TestSession; rows with any other metric_code are rejected at append time. active_rehab_count = count of InjuryRecord rows for this athlete with status == ACTIVE_REHAB at finalize time."
    constants:
      SCREEN_MAX_SCORE: 15
      ASYMMETRY_WEIGHT: 2.0
      INJURY_HISTORY_STEP: 0.15
      INJURY_HISTORY_CAP: 1.45
      RISK_SCORE_CEILING: 30.00
      RISK_RESTRICTION_THRESHOLD: 12.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: intake_screen_variant
        when: "Athlete.screen_count == 0 at finalize time (the intake screen)"
        difference: "history_multiplier is forced to 1.00 — the intake screen scores movement quality only, because injury history is captured separately during intake and is not yet weighted"
      - name: reassessment_screen_variant
        when: "Athlete.screen_count >= 1 at finalize time"
        difference: "history_multiplier = min(INJURY_HISTORY_CAP, 1 + INJURY_HISTORY_STEP * active_rehab_count), so identical screen scores yield a strictly higher risk_score (and can cross the RESTRICTED threshold) once ACTIVE_REHAB injuries exist"

  - name: performance_composite_percentile
    trigger: "POST /test-sessions/{test_session_id}/finalize when battery_type == PERFORMANCE_BATTERY; writes TestSession.metric_percentiles, composite_percentile, age_years_at_test, effective_age_years, variant_applied and Athlete.last_composite_percentile / last_performance_test_at / next_test_due_on"
    algorithm: tiered_pricing
    formula: |
      age_years_at_test = floor((date(finalize clock) - Athlete.date_of_birth) days / 365.25)
      # variant selects the age used for the normative band lookup (see variants)
      band = NORM_TABLE row with sport == Athlete.sport
                              AND position == Athlete.position
                              AND age_band_min <= lookup_age <= age_band_max
      # per-metric percentile, piecewise-linear through the p50 / p90 anchors
      for each result row whose metric_code is present in `band`:
        if direction == HIGHER_BETTER:
          pct_raw = P50_ANCHOR + P90_SPAN * (value - p50) / (p90 - p50)
        else:  # LOWER_BETTER
          pct_raw = P50_ANCHOR + P90_SPAN * (p50 - value) / (p50 - p90)
        percentile = round_half_up(clamp(pct_raw, PERCENTILE_FLOOR, PERCENTILE_CEILING), 1)
      # ROUNDING ORDER IS PINNED: each metric percentile is rounded to 1 decimal BEFORE the
      # weighted sum; the weighted sum is then rounded to 1 decimal exactly once.
      present_weight_sum = sum(METRIC_WEIGHTS[m] for m in matched metrics)
      composite_percentile = round_half_up(
          sum(percentile[m] * METRIC_WEIGHTS[m] for m in matched metrics) / present_weight_sum, 1)
      # Unmatched metrics are EXCLUDED and the weights are renormalised over matched metrics.
      # Zero result rows            -> ERR_NO_TEST_RESULTS
      # Zero matched metrics        -> ERR_NORM_BAND_UNAVAILABLE
    input_set: "Result rows of this TestSession whose metric_code IN {CMJ_CM, SPRINT_10M_S, IMTP_N}; a metric contributes only when a NORM_TABLE row matches (sport, position, lookup_age, metric_code)."
    constants:
      P50_ANCHOR: 50
      P90_SPAN: 40
      PERCENTILE_FLOOR: 1.0
      PERCENTILE_CEILING: 99.0
      METRIC_WEIGHTS: { CMJ_CM: 0.40, SPRINT_10M_S: 0.35, IMTP_N: 0.25 }
      MATURITY_OFFSET_TRIGGER_MONTHS: 12
      TEST_CADENCE_DAYS: 56
      NORM_TABLE: |
        # sport | position | age_band_min..max | metric | p50 | p90 | direction
        BASKETBALL | GUARD      | 13..14 | CMJ_CM       | 34.0 | 42.0 | HIGHER_BETTER
        BASKETBALL | GUARD      | 13..14 | SPRINT_10M_S | 1.85 | 1.69 | LOWER_BETTER
        BASKETBALL | GUARD      | 13..14 | IMTP_N       | 1400 | 1900 | HIGHER_BETTER
        BASKETBALL | GUARD      | 15..16 | CMJ_CM       | 40.0 | 50.0 | HIGHER_BETTER
        BASKETBALL | GUARD      | 15..16 | SPRINT_10M_S | 1.78 | 1.62 | LOWER_BETTER
        BASKETBALL | GUARD      | 15..16 | IMTP_N       | 1700 | 2300 | HIGHER_BETTER
        BASKETBALL | GUARD      | 17..18 | CMJ_CM       | 45.0 | 56.0 | HIGHER_BETTER
        BASKETBALL | GUARD      | 17..18 | SPRINT_10M_S | 1.72 | 1.56 | LOWER_BETTER
        BASKETBALL | GUARD      | 17..18 | IMTP_N       | 2000 | 2650 | HIGHER_BETTER
        SOCCER     | MIDFIELDER | 15..16 | CMJ_CM       | 36.0 | 45.0 | HIGHER_BETTER
        SOCCER     | MIDFIELDER | 15..16 | SPRINT_10M_S | 1.80 | 1.64 | LOWER_BETTER
        SOCCER     | MIDFIELDER | 15..16 | IMTP_N       | 1600 | 2150 | HIGHER_BETTER
        # any (sport, position, age, metric) outside this table has no band
    precision: "Per-metric percentile 1 decimal round_half_up, then composite 1 decimal round_half_up"
    variants:
      - name: raw_norm_variant
        when: "abs(Athlete.maturity_offset_months) < MATURITY_OFFSET_TRIGGER_MONTHS"
        difference: "lookup_age = age_years_at_test; effective_age_years == age_years_at_test; variant_applied = RAW_NORM"
      - name: maturity_adjusted_variant
        when: "abs(Athlete.maturity_offset_months) >= MATURITY_OFFSET_TRIGGER_MONTHS"
        difference: "lookup_age = age_years_at_test + round_half_up(maturity_offset_months / 12, 0), so identical raw metric values are scored against a different age band and produce a different composite_percentile; variant_applied = MATURITY_ADJUSTED"

  - name: athlete_readiness_index
    trigger: "Recomputed on TestSession finalize, on Enrollment ATTENDED / NO_SHOW, on ReturnToSportPlan status change, on Athlete reinstate, and evaluated live against the logical clock on every Athlete read and on every POST /enrollments attempt"
    algorithm: decay_function
    formula: |
      base = Athlete.last_composite_percentile if not null else READINESS_BASE_DEFAULT
      days_since = floor((current logical clock - Athlete.last_performance_test_at) / 86400 seconds)
                   , or 0 when last_performance_test_at IS NULL
      decay_points = min(DECAY_CAP, DECAY_POINTS_PER_DAY * max(0, days_since - DECAY_GRACE_DAYS))
      if (Athlete.attended_count + Athlete.no_show_count) == 0:
        attendance_adjust = 0.0
      else:
        attendance_rate    = Athlete.attended_count / (Athlete.attended_count + Athlete.no_show_count)
        attendance_adjust  = round_half_up(ATTENDANCE_SCALE * (attendance_rate - ATTENDANCE_TARGET), 1)
      rts_penalty = RTS_PENALTY if the athlete has a ReturnToSportPlan with
                    status IN {STAGE_ACTIVE, STAGE_TESTING, MEDICAL_REVIEW} else 0.0
      readiness_index = round_half_up(
          clamp(base - decay_points + attendance_adjust - rts_penalty, 0, 100), 2)
      # Gate: POST /enrollments on a GroupSession with phase_focus == COMPETITION requires
      #       readiness_index >= COMPETITION_READINESS_MIN (inclusive).
    input_set: "Athlete counters plus the single most recent FINALIZED PERFORMANCE_BATTERY TestSession (finalized_at DESC, tie-break created_at DESC); open RTS plans are those with status IN {STAGE_ACTIVE, STAGE_TESTING, MEDICAL_REVIEW}"
    constants:
      READINESS_BASE_DEFAULT: 50.0
      DECAY_GRACE_DAYS: 30
      DECAY_POINTS_PER_DAY: 0.5
      DECAY_CAP: 20.0
      ATTENDANCE_TARGET: 0.80
      ATTENDANCE_SCALE: 10
      RTS_PENALTY: 15.0
      COMPETITION_READINESS_MIN: 60.00
    precision: "2 decimal places, round_half_up; attendance_adjust rounded to 1 decimal first"

  - name: coach_ratio_requirement
    trigger: "Recomputed on POST /enrollments, on Enrollment status change, on POST /group-sessions/{id}/coaches, and on any change to an assigned StaffMember.credential_status; writes GroupSession.athlete_units, required_coach_count, compliant_coach_count and staffing_status"
    algorithm: threshold
    formula: |
      # per-athlete weighting (first matching branch wins)
      unit(a) = UNIT_RTS       if a has a ReturnToSportPlan with status IN {STAGE_ACTIVE, STAGE_TESTING, MEDICAL_REVIEW}
              = UNIT_U12       else if a.age_years <= U12_AGE_MAX
              = UNIT_STANDARD  otherwise
      athlete_units      = round_half_up(sum(unit(a) for each Enrollment on this session
                                            with status IN {RESERVED, ATTENDED}), 1)
      base_ratio         = RATIO_ONSITE if site_code == ONSITE else RATIO_OFFSITE
      ratio_requirement  = ceil(athlete_units / base_ratio)
      station_requirement= ceil(station_count / STATIONS_PER_COACH)
      required_coach_count = max(1, ratio_requirement, station_requirement)
      compliant_coach_count = count of assigned_staff rows whose StaffMember.credential_status != LAPSED
      staffing_status    = STAFF_PENDING  if compliant_coach_count == 0 and assigned_staff is empty
                         = UNDERSTAFFED   if compliant_coach_count < required_coach_count
                         = STAFFED        otherwise
      # Enrollment gate: a POST /enrollments whose resulting required_coach_count would exceed
      # the session's current compliant_coach_count is rejected with ERR_COACH_RATIO_EXCEEDED.
    input_set: "Enrollment rows on this GroupSession with status IN {RESERVED, ATTENDED} (WAITLISTED, NO_SHOW, LATE_CANCEL and CANCELED rows are excluded); assigned_staff rows of this session"
    constants:
      RATIO_ONSITE: 8
      RATIO_OFFSITE: 4
      UNIT_STANDARD: 1.0
      UNIT_U12: 1.5
      UNIT_RTS: 2.5
      U12_AGE_MAX: 12
      STATIONS_PER_COACH: 3
    precision: "athlete_units 1 decimal round_half_up; counts are integers (ceil)"

  - name: session_charge_allocation
    trigger: "POST /enrollments when the enrollment enters RESERVED, and on waitlist promotion; writes Enrollment.funding_source, membership_package_id and charge_cents"
    algorithm: waterfall_allocation
    formula: |
      # Bucket 1 — team contract (ordered first, always preferred when eligible)
      if Athlete.team_contract_id IS NOT NULL
         AND TeamContract.status == ACTIVE
         AND TeamContract.sessions_available >= 1
         AND date(GroupSession.start_at) BETWEEN TeamContract.term_start AND TeamContract.term_end
         AND (GroupSession.site_code == ONSITE
              OR TeamContract.offsite_sessions_used < TeamContract.offsite_allowance):
        funding_source = TEAM_CONTRACT; charge_cents = 0
        TeamContract.sessions_available -= 1; TeamContract.sessions_reserved += 1
        if GroupSession.site_code == OFFSITE: TeamContract.offsite_sessions_used += 1
      # Bucket 2 — membership package (explicit selector)
      else:
        candidates = MembershipPackage rows with athlete_id == Athlete.id
                       AND status == ACTIVE
                       AND sessions_remaining >= 1
                       AND effective_expires_on >= date(GroupSession.start_at)
        ranking    = effective_expires_on ASC, tie-break created_at ASC
        if candidates is non-empty:
          pick     = first candidate under `ranking`
          funding_source = MEMBERSHIP_PACKAGE; membership_package_id = pick.id; charge_cents = 0
          pick.sessions_remaining -= 1; pick.sessions_reserved += 1
          if pick.sessions_remaining == 0: pick.status = DEPLETED
      # Bucket 3 — drop-in cash
        else:
          if Enrollment.funding_preference == PACKAGE_ONLY: reject with ERR_NO_SESSION_CREDIT
          funding_source = DROP_IN
          charge_cents = DROP_IN_RATE_CENTS
                         + (OFFSITE_SURCHARGE_CENTS if site_code == OFFSITE else 0)
      # WAITLISTED enrollments run no allocation: funding_source = UNFUNDED, charge_cents = 0.
      # An eligible contract with an exhausted offsite allowance does NOT fall through for
      # OFFSITE sessions when funding_preference == PACKAGE_ONLY and no package qualifies:
      # the request is rejected with ERR_OFFSITE_ALLOWANCE_EXHAUSTED before bucket 2 when the
      # athlete is contract-linked, the contract is ACTIVE and the session is OFFSITE.
    input_set: "The athlete's linked TeamContract (status ACTIVE only) and MembershipPackage rows with status == ACTIVE; FROZEN, DEPLETED and EXPIRED packages are excluded from the candidate pool"
    constants:
      DROP_IN_RATE_CENTS: 4500
      OFFSITE_SURCHARGE_CENTS: 1500
    precision: "integer cents"
    variants:
      - name: reservation_allocation
        when: "POST /enrollments creates a RESERVED enrollment"
        difference: "Allocation runs against the clock and package state at request time"
      - name: promotion_allocation
        when: "A WAITLISTED enrollment is promoted after a slot is freed"
        difference: "Allocation runs against the state at promotion time; failure demotes the row to CANCELED with cancel_reason = FUNDING_UNAVAILABLE instead of returning an error to any client"

  - name: no_show_fee
    trigger: "Enrollment RESERVED -> NO_SHOW (explicit endpoint or completion sweep); writes Enrollment.no_show_fee_cents and strike_index_at_no_show"
    algorithm: threshold
    formula: |
      strike_index = Athlete.no_show_strikes AFTER this no-show's increment
      multiplier   = NO_SHOW_MULTIPLIERS[strike_index] with strike_index >= 4 using the 4+ entry
      no_show_fee_cents = round_half_up(
          NO_SHOW_LIST_PRICE_CENTS * NO_SHOW_FEE_PCT * multiplier, 0)   # integer cents
      # LATE_CANCEL never charges a fee (no_show_fee_cents stays 0) and never records a strike.
    input_set: "The single Enrollment being marked NO_SHOW, plus the athlete's post-increment strike counter"
    constants:
      NO_SHOW_LIST_PRICE_CENTS: 4500
      NO_SHOW_FEE_PCT: 0.275
      NO_SHOW_MULTIPLIERS: { 1: 1.0, 2: 1.0, 3: 1.5, "4+": 2.0 }
      NO_SHOW_SUSPENSION_THRESHOLD: 3
    precision: "0 decimal places (integer cents), round_half_up"

  - name: no_show_fee_statement_total
    trigger: "GET /athletes/{athlete_id}/progress-report; writes the response field no_show_fee_total_cents"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: each Enrollment.no_show_fee_cents was rounded to whole cents
      # at the moment of its NO_SHOW transition; the statement SUMS THOSE PERSISTED INTEGERS.
      no_show_fee_total_cents = sum(e.no_show_fee_cents
                                    for e in Enrollment where athlete_id == this athlete
                                                          AND status == NO_SHOW)
      # The rejected alternative — recomputing each line unrounded
      # (NO_SHOW_LIST_PRICE_CENTS * NO_SHOW_FEE_PCT * multiplier), summing, and rounding once —
      # is explicitly NOT the contract: two strike-multiplier-1.0 lines are 1237.5 cents each,
      # so per-line rounding totals 2476 while sum-then-round totals 2475.
    input_set: "Enrollment rows for this athlete with status == NO_SHOW (LATE_CANCEL and CANCELED rows never contribute); no time window filter — the statement is lifetime-to-date"
    constants: {}
    precision: "integer cents; per-line rounding already applied, statement performs no further rounding"

  - name: team_contract_session_rate
    trigger: "POST /group-sessions/{group_session_id}/complete when GroupSession.team_contract_id IS NOT NULL; writes GroupSession.billed_rate_cents, rate_tier_applied, delivered_slots_at_completion and TeamContract.billed_amount_cents / sessions_delivered / sessions_reserved"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED (this formula looks circular: the tier is keyed on the
      # delivered counter that this very completion increments).
      # STEP 1 — snapshot the counter BEFORE any increment:
      delivered_before = TeamContract.sessions_delivered            # read once
      # STEP 2 — choose the tier from that snapshot:
      tier = TIER_1 if delivered_before < CONTRACT_TIER_BREAKPOINT_1
           = TIER_2 if CONTRACT_TIER_BREAKPOINT_1 <= delivered_before < CONTRACT_TIER_BREAKPOINT_2
           = TIER_3 otherwise
      # STEP 3 — one rate for the whole completion (NOT re-tiered per slot):
      billed_rate_cents = round_half_up(
          TeamContract.base_rate_cents * TIER_MULTIPLIERS[tier]
          * (1 + OFFSITE_PREMIUM_PCT if GroupSession.site_code == OFFSITE else 1), 0)
      # STEP 4 — count the slots this completion delivers:
      delivered_slots_at_completion = count(Enrollment on this session
          with funding_source == TEAM_CONTRACT AND status IN {ATTENDED, NO_SHOW})
      # STEP 5 — only now advance the counters:
      TeamContract.sessions_reserved  -= delivered_slots_at_completion
      TeamContract.sessions_delivered += delivered_slots_at_completion
      TeamContract.billed_amount_cents += billed_rate_cents * delivered_slots_at_completion
      # Void reversal MUST use the stored billed_rate_cents / delivered_slots_at_completion
      # snapshots. Recomputing the rate at void time drifts whenever intervening completions
      # moved the tier.
    input_set: "Enrollment rows on this GroupSession with funding_source == TEAM_CONTRACT and status IN {ATTENDED, NO_SHOW}; LATE_CANCEL rows were already counted as delivered at cancel time and are excluded here"
    constants:
      CONTRACT_TIER_BREAKPOINT_1: 2
      CONTRACT_TIER_BREAKPOINT_2: 5
      TIER_MULTIPLIERS: { TIER_1: 1.00, TIER_2: 0.92, TIER_3: 0.85 }
      OFFSITE_PREMIUM_PCT: 0.20
    precision: "0 decimal places (integer cents), round_half_up"

  - name: package_effective_expiry
    trigger: "MembershipPackage creation, POST /membership-packages/{id}/unfreeze, and the POST /_clock/set_current_utc expiry sweep; writes MembershipPackage.effective_expires_on"
    algorithm: chronological
    formula: |
      # frozen_days_total accumulates in unfreeze order; a partial day counts as a full day.
      on unfreeze: frozen_days_total += ceil((unfreeze_clock - frozen_at) / 86400 seconds)
      effective_expires_on = date(expires_on) + frozen_days_total days
      # Clock sweep (runs on every POST /_clock/set_current_utc, in this pinned order):
      #   1. SIGNED ClearanceDocument rows with expires_on < new date -> EXPIRED
      #   2. MembershipPackage rows with status IN {ACTIVE, FROZEN, DEPLETED}
      #      and effective_expires_on < new date -> EXPIRED,
      #      forfeiting the remainder (sessions_forfeited += sessions_remaining; remaining = 0)
      #   3. Certification rows are deliberately NOT swept — they lapse only via
      #      POST /staff-members/{staff_member_id}/credential-review
    input_set: "The single MembershipPackage; sweep step 2 scans all packages with status IN {ACTIVE, FROZEN, DEPLETED}, processed in created_at ASC order"
    constants: {}
    precision: "whole days; ceil on the freeze duration"

  - name: program_planned_load
    trigger: "POST /training-programs/{training_program_id}/activate; writes TrainingProgram.planned_load_units and total_weeks"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round each block's contribution to 2 decimals, then sum.
      block_load(b)      = round_half_up(b.weekly_volume_units
                                        * (b.end_week - b.start_week + 1)
                                        * (b.target_intensity_pct / 100), 2)
      planned_load_units = sum(block_load(b) for b in blocks, iterated in sequence_index ASC)
      total_weeks        = max(end_week) - min(start_week) + 1
    input_set: "All ProgramBlock rows of this TrainingProgram, ordered by sequence_index ASC (root block first)"
    constants: {}
    precision: "2 decimal places, round_half_up per block then summed"

  - name: station_rotation_assignment
    trigger: "POST /group-sessions/{group_session_id}/lock-roster; writes Enrollment.station_number for every RESERVED enrollment"
    algorithm: chronological
    formula: |
      ordered = Enrollment rows on this session with status == RESERVED,
                sorted by created_at ASC (no other tie-break is needed: created_at is
                stamped with millisecond precision and never reused within a session)
      for i, e in enumerate(ordered):        # i is 0-based
        e.station_number = 1 + (i mod GroupSession.station_count)
    input_set: "RESERVED enrollments only; WAITLISTED rows receive no station and keep station_number == null"
    constants: {}
    precision: "integer station index in 1..station_count"

  - name: waitlist_promotion
    trigger: "Any event that frees a RESERVED slot on a GroupSession with session_status IN {SCHEDULED, ROSTER_LOCKED}: enrollment cancel, late cancel, suspension cascade, or medical-hold cascade"
    algorithm: chronological
    formula: |
      while GroupSession.reserved_count < GroupSession.max_athletes:
        candidates = Enrollment rows on this session with status == WAITLISTED
        if candidates is empty: stop
        pick = candidate with the smallest created_at (ASC ordering, earliest first)
        run session_charge_allocation for pick
        if allocation succeeded:
          pick.status = RESERVED; pick.promoted_from_waitlist = true; stop
        else:
          pick.status = CANCELED; pick.cancel_reason = FUNDING_UNAVAILABLE; continue
      # At most one enrollment is promoted per freed slot; funding failures do not consume the
      # slot and the loop proceeds to the next candidate in created_at ASC order.
    input_set: "WAITLISTED enrollments on the affected GroupSession only"
    constants: {}
    precision: "n/a"

  - name: progress_report_delta
    trigger: "GET /athletes/{athlete_id}/progress-report"
    algorithm: aggregation
    formula: |
      finalized = TestSession rows with athlete_id == this athlete
                    AND battery_type == PERFORMANCE_BATTERY AND status == FINALIZED,
                  sorted by finalized_at DESC, tie-break created_at DESC
      composite_percentile_current  = finalized[0].composite_percentile  (null when none)
      composite_percentile_previous = finalized[1].composite_percentile  (null when fewer than 2)
      delta_percentile_points = round_half_up(current - previous, 1)     (null when either is null)
      tests_included_count    = len(finalized)
      attendance_rate_pct     = round_half_up(
          100 * attended_count / (attended_count + no_show_count), 1)  (null when denominator 0)
      test_overdue = (Athlete.next_test_due_on IS NOT NULL
                      AND date(current logical clock) > Athlete.next_test_due_on)
      normative_cohort = "<sport>/<position>/<age_band_min>-<age_band_max>" of the band used by
                         finalized[0], or null when no test has been finalized
    input_set: "FINALIZED PERFORMANCE_BATTERY sessions only — DRAFT sessions and MOVEMENT_SCREEN sessions never enter the ordering"
    constants:
      TEST_CADENCE_DAYS: 56
    precision: "1 decimal place, round_half_up"

# =============================================================================
# 1.4 Validation Rules (ordered — lower priority number is evaluated first)
# =============================================================================
# The ladder is global and total. When two rules are violated by the same request, the rule with
# the smaller `priority` produces the response and the other is never reported.
validations:

  # --- 1. authentication -----------------------------------------------------
  - priority: 1
    category: auth
    rule: "Every endpoint except POST /_clock/set_current_utc requires the X-User-Role header; a missing or unrecognised X-User-Role value is rejected before any other check"
    error_id: ERR_UNAUTHENTICATED
    applies_to: "all endpoints"

  # --- 2. authorization ------------------------------------------------------
  - priority: 2
    category: role
    rule: "The X-User-Role value must appear in the endpoint's `roles` list in §1.5; role is checked before the path id is looked up, so an unauthorised caller cannot probe for entity existence"
    error_id: ERR_UNAUTHORIZED
    applies_to: "all endpoints"

  # --- 3. path existence -----------------------------------------------------
  - priority: 3
    category: existence
    rule: "Every {id} path parameter must resolve to an existing row of its entity; the entity-specific ERR_*_NOT_FOUND is returned (Athlete, InjuryRecord, TestSession, TrainingProgram, ProgramBlock, GroupSession, Enrollment, StaffMember, Certification, MembershipPackage, TeamContract, RtsPlan, ClearanceDocument)"
    error_id: ERR_ATHLETE_NOT_FOUND
    applies_to: "all endpoints with a path parameter"

  # --- 4. body foreign keys --------------------------------------------------
  - priority: 4
    category: existence
    rule: "Every foreign-key value supplied in a request body must resolve to an existing row of the referenced entity, checked in the field order declared by the endpoint's `input`; the referenced entity's ERR_*_NOT_FOUND is returned"
    error_id: ERR_ATHLETE_NOT_FOUND
    applies_to: "POST /injury-records, POST /test-sessions, POST /training-programs, POST /training-programs/{training_program_id}/blocks, POST /group-sessions, POST /group-sessions/{group_session_id}/coaches, POST /enrollments, POST /certifications, POST /membership-packages, POST /team-contracts/{team_contract_id}/athletes, POST /rts-plans, POST /clearance-documents"

  # --- 5. schema, enum and range --------------------------------------------
  - priority: 5
    category: schema
    rule: "All required input fields must be present and every value must satisfy its declared type, enum domain and numeric range: station_count 1..12, max_athletes 1..40, target_intensity_pct 40..105, start_week >= 1, end_week >= start_week, target_stage_count 3..5, sessions_purchased >= 1, contracted_sessions >= 1, offsite_allowance >= 0, movement-screen metric values 0..3, price/rate cents >= 0, stage_number >= 1"
    error_id: ERR_INVALID_REQUEST
    applies_to: "all endpoints with a request body"
  - priority: 5
    category: schema
    rule: "GroupSession.end_at must be strictly after start_at, TeamContract.term_end must be on or after term_start, Certification.expires_on must be after issued_on, and MembershipPackage.expires_on must be on or after the current logical date"
    error_id: ERR_INVALID_REQUEST
    applies_to: "POST /group-sessions, POST /team-contracts, POST /certifications, POST /membership-packages"
  - priority: 5
    category: schema
    rule: "site_code == OFFSITE requires a non-empty offsite_location; site_code == ONSITE requires offsite_location to be absent or null"
    error_id: ERR_INVALID_REQUEST
    applies_to: "POST /group-sessions"
  - priority: 5
    category: schema
    rule: "A MOVEMENT_SCREEN result append must carry exactly the five metric codes OH_SQUAT, HURDLE_STEP, INLINE_LUNGE, SL_HOP_L, SL_HOP_R with no duplicates; a PERFORMANCE_BATTERY append accepts only CMJ_CM, SPRINT_10M_S and IMTP_N with no duplicates"
    error_id: ERR_INVALID_REQUEST
    applies_to: "POST /test-sessions/{test_session_id}/results"
  - priority: 5
    category: schema
    rule: "POST /_clock/set_current_utc must supply an RFC3339 UTC instant; a value earlier than the current logical clock is rejected with ERR_CLOCK_REWIND_FORBIDDEN (the clock is monotonic, equal values are accepted as a no-op sweep)"
    error_id: ERR_CLOCK_REWIND_FORBIDDEN
    applies_to: "POST /_clock/set_current_utc"

  # --- 6. ownership scope ----------------------------------------------------
  - priority: 6
    category: ownership
    rule: "For X-User-Role IN {Athlete, Guardian} the X-User-ID must equal the athlete_id targeted by the request (directly, or via the parent chain of the addressed TestSession / Enrollment / MembershipPackage / RtsPlan / ClearanceDocument / TrainingProgram); Guardian additionally requires the target athlete's age_years < 18 and a non-null guardian_email"
    error_id: ERR_ATHLETE_SCOPE_VIOLATION
    applies_to: "GET /athletes/{athlete_id}, GET /athletes/{athlete_id}/progress-report, POST /enrollments, POST /enrollments/{enrollment_id}/cancel, GET /test-sessions/{test_session_id}, GET /membership-packages/{membership_package_id}, GET /rts-plans/{rts_plan_id}, GET /clearance-documents/{clearance_document_id}"

  # --- 7. optimistic concurrency --------------------------------------------
  - priority: 7
    category: concurrency
    rule: "expected_group_session_version must equal the addressed GroupSession's current version; the check runs after schema validation and before every state and business check so that a caller working from a stale read is told to re-read rather than being given a business error computed from state it has not seen"
    error_id: ERR_STALE_VERSION
    applies_to: "POST /group-sessions/{group_session_id}/coaches"
  - priority: 7
    category: concurrency
    rule: "expected_training_program_version must equal the addressed TrainingProgram's current version"
    error_id: ERR_STALE_VERSION
    applies_to: "POST /training-programs/{training_program_id}/blocks"

  # --- 8. state --------------------------------------------------------------
  - priority: 8
    category: state
    rule: "The addressed entity must be in a state from which the requested transition is declared in §1.2; a request against a terminal state returns ERR_ALREADY_TERMINAL and any other undeclared source state returns ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    applies_to: "all action endpoints"
  - priority: 8
    category: state
    rule: "An Athlete with membership_status == SUSPENDED cannot be the subject of a new Enrollment, TestSession, TrainingProgram activation or MembershipPackage purchase; the suspension is reported before any funding, ratio, safety or temporal evaluation"
    error_id: ERR_ATHLETE_SUSPENDED
    applies_to: "POST /enrollments, POST /test-sessions, POST /training-programs/{training_program_id}/activate, POST /membership-packages"
  - priority: 8
    category: state
    rule: "A GroupSession must be SCHEDULED to accept coach assignment, roster lock or cancellation, ROSTER_LOCKED to be started, IN_PROGRESS to be completed, and COMPLETED to have its completion voided"
    error_id: ERR_INVALID_STATE
    applies_to: "POST /group-sessions/{group_session_id}/coaches, POST /group-sessions/{group_session_id}/lock-roster, POST /group-sessions/{group_session_id}/start, POST /group-sessions/{group_session_id}/complete, POST /group-sessions/{group_session_id}/void-completion, POST /group-sessions/{group_session_id}/cancel"
  - priority: 8
    category: state
    rule: "A TestSession must be DRAFT to accept result rows or to be finalized; appending results to a FINALIZED session returns ERR_ALREADY_TERMINAL"
    error_id: ERR_ALREADY_TERMINAL
    applies_to: "POST /test-sessions/{test_session_id}/results, POST /test-sessions/{test_session_id}/finalize"
  - priority: 8
    category: state
    rule: "A MembershipPackage must be ACTIVE to be frozen and FROZEN to be unfrozen; an EXPIRED package is terminal"
    error_id: ERR_INVALID_STATE
    applies_to: "POST /membership-packages/{membership_package_id}/freeze, POST /membership-packages/{membership_package_id}/unfreeze"
  - priority: 8
    category: state
    rule: "An Enrollment must be RESERVED to be attended, marked no-show or cancelled; a WAITLISTED enrollment may only be cancelled"
    error_id: ERR_INVALID_STATE
    applies_to: "POST /enrollments/{enrollment_id}/attend, POST /enrollments/{enrollment_id}/no-show, POST /enrollments/{enrollment_id}/cancel"
  - priority: 8
    category: state
    rule: "An athlete may hold at most one Enrollment per GroupSession in a non-terminal or attended state (RESERVED, WAITLISTED, ATTENDED, NO_SHOW); a repeat POST is rejected"
    error_id: ERR_DUPLICATE_ENROLLMENT
    applies_to: "POST /enrollments"
  - priority: 8
    category: state
    rule: "A ReturnToSportPlan must be STAGE_ACTIVE to open a stage test, STAGE_TESTING to receive a stage decision, and non-terminal to be aborted"
    error_id: ERR_INVALID_STATE
    applies_to: "POST /rts-plans/{rts_plan_id}/stage-test, POST /rts-plans/{rts_plan_id}/stage-decision, POST /rts-plans/{rts_plan_id}/abort"

  # --- 9. segregation of duties ---------------------------------------------
  - priority: 9
    category: segregation_of_duties
    rule: "The X-User-ID recording a stage decision must differ from the administered_by_staff_id of the stage TestSession being judged: the coach who ran the test cannot clear the athlete off it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    applies_to: "POST /rts-plans/{rts_plan_id}/stage-decision"
  - priority: 9
    category: segregation_of_duties
    rule: "The X-User-ID signing a ClearanceDocument must differ from the administered_by_staff_id of the TestSession referenced by the plan's active stage, and a MedicalProvider cannot sign a document they also revoked earlier in the same plan"
    error_id: ERR_SEGREGATION_OF_DUTIES
    applies_to: "POST /clearance-documents/{clearance_document_id}/sign"

  # --- 10. business safety — athlete ----------------------------------------
  - priority: 10
    category: business_safety
    rule: "An Athlete with training_clearance == SCREEN_PENDING cannot be enrolled in any GroupSession, and cannot have a PERFORMANCE_BATTERY TestSession opened: the movement screen must be finalized first"
    error_id: ERR_MOVEMENT_SCREEN_REQUIRED
    applies_to: "POST /enrollments, POST /test-sessions"
  - priority: 10
    category: business_safety
    rule: "An Athlete with training_clearance == MEDICAL_HOLD cannot be enrolled in any GroupSession regardless of funding, ratio or readiness"
    error_id: ERR_ATHLETE_MEDICAL_HOLD
    applies_to: "POST /enrollments"
  - priority: 10
    category: business_safety
    rule: "A stage-decision of PASS requires a ClearanceDocument for this plan with document_type == STAGE_CLEARANCE, stage_number == the plan's current_stage and status == SIGNED; this safety gate is evaluated before any staffing, ratio or scheduling constraint on the same request"
    error_id: ERR_STAGE_CLEARANCE_MISSING
    applies_to: "POST /rts-plans/{rts_plan_id}/stage-decision"
  - priority: 10
    category: business_safety
    rule: "A ClearanceDocument whose expires_on is earlier than the current logical date cannot satisfy any clearance requirement and cannot be signed"
    error_id: ERR_CLEARANCE_EXPIRED
    applies_to: "POST /clearance-documents/{clearance_document_id}/sign, POST /rts-plans/{rts_plan_id}/stage-decision"

  # --- 11. business safety — staff ------------------------------------------
  - priority: 11
    category: business_safety
    rule: "A StaffMember with credential_status == LAPSED, or whose liability_insurance_expires_on is earlier than the current logical date, cannot be assigned to a GroupSession or administer a TestSession; the credential defect is reported before any scheduling-overlap or travel-buffer check on the same request"
    error_id: ERR_STAFF_CREDENTIAL_LAPSED
    applies_to: "POST /group-sessions/{group_session_id}/coaches, POST /test-sessions"
  - priority: 11
    category: business_safety
    rule: "A Certification renewal requires ceu_credits_earned >= ceu_credits_required at the moment of renewal"
    error_id: ERR_CEU_REQUIREMENT_NOT_MET
    applies_to: "POST /certifications/{certification_id}/renew"

  # --- 12. business constraint ----------------------------------------------
  - priority: 12
    category: business_constraint
    rule: "A new RESERVED Enrollment must not push required_coach_count above the session's current compliant_coach_count; when the ratio would break, the athlete is only admitted as WAITLISTED if request_waitlist == true, otherwise the request is rejected"
    error_id: ERR_COACH_RATIO_EXCEEDED
    applies_to: "POST /enrollments"
  - priority: 12
    category: business_constraint
    rule: "Enrolling in a GroupSession with phase_focus == COMPETITION requires the athlete's live readiness_index >= COMPETITION_READINESS_MIN (60.00, inclusive)"
    error_id: ERR_READINESS_BELOW_THRESHOLD
    applies_to: "POST /enrollments"
  - priority: 12
    category: business_constraint
    rule: "An Athlete with training_clearance == RESTRICTED may only be enrolled in sessions whose phase_focus IN {GENERAL_PREP, TRANSITION}; COMPETITION, SPECIFIC_PREP and TAPER sessions are refused"
    error_id: ERR_RESTRICTED_PHASE_NOT_PERMITTED
    applies_to: "POST /enrollments"
  - priority: 12
    category: business_constraint
    rule: "Program blocks must form one unbroken chain: the first block has predecessor_block_id == null and start_week == 1; every later block must reference an existing sibling block of the same program (any status) as predecessor, must be the only block referencing it, and must have start_week == predecessor.end_week + 1; a program cannot be activated with zero blocks. Blocks are created PLANNED and only reach PINNED at activation, so the predecessor's status is never part of this check"
    error_id: ERR_PROGRAM_BLOCK_SEQUENCE_INVALID
    applies_to: "POST /training-programs/{training_program_id}/blocks, POST /training-programs/{training_program_id}/activate"
  - priority: 12
    category: business_constraint
    rule: "A GroupSession roster cannot be locked while staffing_status != STAFFED"
    error_id: ERR_COACH_RATIO_EXCEEDED
    applies_to: "POST /group-sessions/{group_session_id}/lock-roster"
  - priority: 12
    category: business_constraint
    rule: "reserved_count must never exceed max_athletes; a request that would overfill the session is rejected unless request_waitlist == true, in which case the row is created WAITLISTED. The capacity check runs BEFORE the coach-ratio check, because capacity is a fixed property of the session while the ratio depends on who else is enrolled"
    error_id: ERR_SESSION_FULL
    applies_to: "POST /enrollments"

  # --- 13. business temporal ------------------------------------------------
  - priority: 13
    category: business_temporal
    rule: "A StaffMember cannot be assigned to two GroupSessions whose [start_at, end_at] intervals overlap as closed intervals; sessions that merely touch at an endpoint at the same site_code and offsite_location do not conflict"
    error_id: ERR_STAFF_SCHEDULE_CONFLICT
    applies_to: "POST /group-sessions/{group_session_id}/coaches"
  - priority: 13
    category: business_temporal
    rule: "Consecutive assignments of the same StaffMember at different locations (differing site_code, or both OFFSITE with differing offsite_location) require a gap of at least TRAVEL_BUFFER_MINUTES (30) between the earlier end_at and the later start_at"
    error_id: ERR_TRAVEL_BUFFER_VIOLATION
    applies_to: "POST /group-sessions/{group_session_id}/coaches"
  - priority: 13
    category: business_temporal
    rule: "An Athlete cannot hold two RESERVED or WAITLISTED enrollments in GroupSessions whose [start_at, end_at) half-open intervals overlap; back-to-back sessions are permitted"
    error_id: ERR_ATHLETE_SCHEDULE_CONFLICT
    applies_to: "POST /enrollments"
  - priority: 13
    category: business_temporal
    rule: "At most FACILITY_MAX_CONCURRENT_ONSITE (3) non-canceled ONSITE GroupSessions may have overlapping [start_at, end_at) intervals; the limit is aggregate across all contracts and athletes"
    error_id: ERR_SITE_CONCURRENCY_EXCEEDED
    applies_to: "POST /group-sessions"
  - priority: 13
    category: business_temporal
    rule: "Enrollment is closed once the session's start_at is at or before the current logical clock, and roster lock is refused after start_at"
    error_id: ERR_ENROLLMENT_WINDOW_CLOSED
    applies_to: "POST /enrollments, POST /group-sessions/{group_session_id}/lock-roster"

  # --- 14. business referential ---------------------------------------------
  - priority: 14
    category: business_referential
    rule: "Finalizing a PERFORMANCE_BATTERY requires at least one result row whose metric_code resolves to a NORM_TABLE band for the athlete's (sport, position, lookup_age); when result rows exist but no band matches, ERR_NORM_BAND_UNAVAILABLE is returned"
    error_id: ERR_NORM_BAND_UNAVAILABLE
    applies_to: "POST /test-sessions/{test_session_id}/finalize"
  - priority: 14
    category: business_referential
    rule: "Finalizing any TestSession requires result_count >= 1; an empty session cannot be finalized"
    error_id: ERR_NO_TEST_RESULTS
    applies_to: "POST /test-sessions/{test_session_id}/finalize"
  - priority: 14
    category: business_referential
    rule: "A GroupSession may reference a TeamContract only while that contract is ACTIVE, and an athlete may be linked to a contract only while it is ACTIVE"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    applies_to: "POST /group-sessions, POST /team-contracts/{team_contract_id}/athletes"
  - priority: 14
    category: business_referential
    rule: "A ReturnToSportPlan requires an InjuryRecord of the same athlete with rts_required == true and status == ACTIVE_REHAB, and at most one non-terminal plan may exist per injury record"
    error_id: ERR_INVALID_STATE
    applies_to: "POST /rts-plans"
  - priority: 14
    category: business_referential
    rule: "Voiding a completion is refused when any Enrollment on the session was marked NO_SHOW, because the strike counters and no-show fees already assessed against the athletes cannot be unwound"
    error_id: ERR_VOID_BLOCKED_BY_NO_SHOW
    applies_to: "POST /group-sessions/{group_session_id}/void-completion"

  # --- 15. business fiscal --------------------------------------------------
  - priority: 15
    category: business_fiscal
    rule: "When funding_preference == PACKAGE_ONLY and neither an eligible TeamContract slot nor an eligible ACTIVE MembershipPackage with sessions_remaining >= 1 exists, the enrollment is refused rather than charged as a drop-in"
    error_id: ERR_NO_SESSION_CREDIT
    applies_to: "POST /enrollments"
  - priority: 15
    category: business_fiscal
    rule: "A MembershipPackage whose effective_expires_on is earlier than the session date cannot fund the enrollment, and an EXPIRED package can never be selected. When the athlete owns at least one MembershipPackage but every candidate is rejected solely on date grounds (effective_expires_on < session date) or is already EXPIRED, and no other bucket may be used, this rule fires in preference to ERR_NO_SESSION_CREDIT, which is reserved for an athlete who owns no package at all"
    error_id: ERR_PACKAGE_EXPIRED
    applies_to: "POST /enrollments"
  - priority: 15
    category: business_fiscal
    rule: "A contract-linked athlete cannot consume a contract slot for an OFFSITE session once offsite_sessions_used has reached offsite_allowance"
    error_id: ERR_OFFSITE_ALLOWANCE_EXHAUSTED
    applies_to: "POST /enrollments"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- test-driving: logical clock ------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock. The startup default is exactly 2026-08-01T00:00:00Z and the logical clock NEVER falls back to real wall-clock time. The clock is monotonic: a value earlier than the current logical clock is rejected. Every successful call runs the expiry sweep in the pinned order of package_effective_expiry — SIGNED ClearanceDocument rows first, then MembershipPackage rows in created_at ASC — and deliberately never touches Certification rows."
    roles: [PerformanceDirector, Coach, MedicalProvider, FrontDesk]
    code: 200
    input: [current_utc]
    output: { current_utc: string, clearance_documents_expired_count: integer, packages_expired_count: integer }
    side_effects:
      - "SIGNED ClearanceDocument rows with expires_on < new logical date -> EXPIRED"
      - "MembershipPackage rows with status IN {ACTIVE, FROZEN, DEPLETED} and effective_expires_on < new logical date -> EXPIRED; sessions_forfeited += sessions_remaining; sessions_remaining = 0"
      - "Certification.status is NOT recalculated (only POST /staff-members/{staff_member_id}/credential-review does that)"

  # --- Athlete ---------------------------------------------------------------
  - method: POST
    path: "/athletes"
    description: "Registers an athlete for intake. membership_status starts PENDING_INTAKE and training_clearance starts SCREEN_PENDING, so the athlete cannot be enrolled until a MOVEMENT_SCREEN TestSession is finalized."
    roles: [FrontDesk, PerformanceDirector]
    code: 201
    input: [full_name, date_of_birth, sport, position, "guardian_email?", "maturity_offset_months?"]
    output: Athlete
    side_effects:
      - "age_years derived from date_of_birth against the current logical date"
      - "readiness_index initialised from athlete_readiness_index with base READINESS_BASE_DEFAULT"
  - method: GET
    path: "/athletes/{athlete_id}"
    description: "Reads one athlete. readiness_index is recomputed live against the logical clock on every read, so decay is visible without any write."
    roles: [PerformanceDirector, Coach, MedicalProvider, FrontDesk, Athlete, Guardian]
    code: 200
    input: []
    output: Athlete
    side_effects: []
  - method: GET
    path: "/athletes"
    description: "Lists athletes with filtering and offset pagination; also the reverse-reachability channel for Athlete.team_contract_id."
    roles: [PerformanceDirector, Coach, MedicalProvider, FrontDesk]
    code: 200
    input: ["sport?", "membership_status?", "training_clearance?", "team_contract_id?", "limit?", "offset?"]
    output: Athlete[]
    side_effects: []
  - method: POST
    path: "/athletes/{athlete_id}/suspend"
    description: "Suspends an athlete's membership administratively (the same transition the third no-show strike triggers automatically)."
    roles: [PerformanceDirector]
    code: 200
    input: [reason]
    output: Athlete
    side_effects:
      - "membership_status ACTIVE -> SUSPENDED"
      - "every RESERVED or WAITLISTED Enrollment of this athlete on a GroupSession with session_status IN {SCHEDULED, ROSTER_LOCKED} -> CANCELED with cancel_reason = ATHLETE_SUSPENDED"
      - "each cancellation refunds its funding source (package credit restored, contract slot restored) and triggers waitlist_promotion on the affected session"
      - "coach_ratio_requirement recomputed on every affected GroupSession"
  - method: POST
    path: "/athletes/{athlete_id}/reinstate"
    description: "Lifts a suspension and resets the strike counter to zero, so the next no-show is charged at multiplier 1.0 again."
    roles: [PerformanceDirector]
    code: 200
    input: []
    output: Athlete
    side_effects:
      - "membership_status SUSPENDED -> ACTIVE"
      - "no_show_strikes reset to 0 (no_show_count is NOT reset, so attendance_rate and the fee statement keep the history)"
      - "athlete_readiness_index recomputed"
  - method: POST
    path: "/athletes/{athlete_id}/medical-hold"
    description: "Places an athlete on medical hold; only a MedicalProvider may do this and only a signed MEDICAL_HOLD_RELEASE ClearanceDocument lifts it."
    roles: [MedicalProvider]
    code: 200
    input: [hold_reason]
    output: Athlete
    side_effects:
      - "training_clearance CLEARED or RESTRICTED -> MEDICAL_HOLD"
      - "every RESERVED or WAITLISTED Enrollment on future SCHEDULED or ROSTER_LOCKED sessions -> CANCELED with cancel_reason = MEDICAL_HOLD, refunding its funding source and triggering waitlist_promotion"
  - method: GET
    path: "/athletes/{athlete_id}/progress-report"
    description: "Computed read for athlete and parent reporting: current vs previous composite percentile, the delta, the normative cohort used, live readiness, attendance and the lifetime no-show fee statement."
    roles: [PerformanceDirector, Coach, Athlete, Guardian]
    code: 200
    input: []
    output: { athlete_id: string, composite_percentile_current: number, composite_percentile_previous: number, delta_percentile_points: number, tests_included_count: integer, normative_cohort: string, readiness_index: number, attendance_rate_pct: number, no_show_fee_total_cents: integer, test_overdue: boolean, next_test_due_on: string }
    side_effects: []

  # --- InjuryRecord ----------------------------------------------------------
  - method: POST
    path: "/injury-records"
    description: "Records an injury from history intake or a new incident. rts_required == true makes the record eligible to anchor a ReturnToSportPlan."
    roles: [MedicalProvider, PerformanceDirector]
    code: 201
    input: [athlete_id, body_region, severity, occurred_on, rts_required]
    output: InjuryRecord
    side_effects:
      - "status set to ACTIVE_REHAB"
      - "the athlete's next reassessment screen will apply the reassessment_screen_variant history multiplier while this record stays ACTIVE_REHAB"
  - method: GET
    path: "/injury-records/{injury_record_id}"
    description: "Reads one injury record."
    roles: [PerformanceDirector, Coach, MedicalProvider, Athlete, Guardian]
    code: 200
    input: []
    output: InjuryRecord
    side_effects: []
  - method: GET
    path: "/injury-records"
    description: "Lists injury records; reverse-reachability channel for InjuryRecord.athlete_id."
    roles: [PerformanceDirector, Coach, MedicalProvider]
    code: 200
    input: ["athlete_id?", "status?", "limit?", "offset?"]
    output: InjuryRecord[]
    side_effects: []
  - method: POST
    path: "/injury-records/{injury_record_id}/resolve"
    description: "Marks rehab complete; removes the record from the reassessment history multiplier and from the RTS unit weighting."
    roles: [MedicalProvider]
    code: 200
    input: []
    output: InjuryRecord
    side_effects:
      - "status ACTIVE_REHAB -> RESOLVED"
      - "athlete_readiness_index recomputed"

  # --- TestSession -----------------------------------------------------------
  - method: POST
    path: "/test-sessions"
    description: "Opens a DRAFT test session. administered_by_staff_id is copied from X-User-ID, so the acting Coach must be a StaffMember with a non-LAPSED credential_status and unexpired liability insurance."
    roles: [Coach]
    code: 201
    input: [athlete_id, battery_type]
    output: TestSession
    side_effects: []
  - method: POST
    path: "/test-sessions/{test_session_id}/results"
    description: "Appends metric rows to a DRAFT session. `results` is an array of {metric_code, value, side}. MOVEMENT_SCREEN requires exactly the five screen codes; PERFORMANCE_BATTERY accepts any non-empty subset of CMJ_CM, SPRINT_10M_S and IMTP_N."
    roles: [Coach]
    code: 200
    input: [results]
    output: TestSession
    side_effects:
      - "results replaced by the submitted rows; result_count updated"
  - method: POST
    path: "/test-sessions/{test_session_id}/finalize"
    description: "Finalizes a DRAFT session, running movement_screen_risk_score for MOVEMENT_SCREEN or performance_composite_percentile for PERFORMANCE_BATTERY, and propagating to the athlete."
    roles: [Coach]
    code: 200
    input: []
    output: TestSession
    side_effects:
      - "status DRAFT -> FINALIZED; finalized_at stamped from the logical clock"
      - "MOVEMENT_SCREEN: risk_score, asymmetry_points and variant_applied written; Athlete.injury_risk_score updated; Athlete.screen_count += 1; Athlete.training_clearance set to RESTRICTED when risk_score >= RISK_RESTRICTION_THRESHOLD else CLEARED; Athlete.membership_status PENDING_INTAKE -> ACTIVE on the first finalized screen"
      - "PERFORMANCE_BATTERY: metric_percentiles, composite_percentile, age_years_at_test, effective_age_years and variant_applied written; Athlete.last_composite_percentile, last_performance_test_at set; Athlete.next_test_due_on = date(finalized_at) + TEST_CADENCE_DAYS"
      - "athlete_readiness_index recomputed"
      - "when the session's rts_plan_id is set, the plan's active_stage_test_id is unchanged but the plan becomes eligible for a stage decision"
  - method: GET
    path: "/test-sessions/{test_session_id}"
    description: "Reads one test session including its result rows and computed percentiles."
    roles: [PerformanceDirector, Coach, MedicalProvider, Athlete, Guardian]
    code: 200
    input: []
    output: TestSession
    side_effects: []
  - method: GET
    path: "/test-sessions"
    description: "Lists test sessions; reverse-reachability channel for TestSession.athlete_id, administered_by_staff_id and rts_plan_id."
    roles: [PerformanceDirector, Coach, MedicalProvider]
    code: 200
    input: ["athlete_id?", "battery_type?", "status?", "administered_by_staff_id?", "rts_plan_id?", "limit?", "offset?"]
    output: TestSession[]
    side_effects: []

  # --- TrainingProgram / ProgramBlock ---------------------------------------
  - method: POST
    path: "/training-programs"
    description: "Creates a DRAFT periodized program for one athlete against a competitive calendar window."
    roles: [PerformanceDirector, Coach]
    code: 201
    input: [athlete_id, sport, position, competition_start_date, competition_end_date]
    output: TrainingProgram
    side_effects: []
  - method: GET
    path: "/training-programs/{training_program_id}"
    description: "Reads one program including its version, block_count and planned_load_units."
    roles: [PerformanceDirector, Coach, Athlete, Guardian]
    code: 200
    input: []
    output: TrainingProgram
    side_effects: []
  - method: GET
    path: "/training-programs"
    description: "Lists programs; reverse-reachability channel for TrainingProgram.athlete_id."
    roles: [PerformanceDirector, Coach]
    code: 200
    input: ["athlete_id?", "status?", "limit?", "offset?"]
    output: TrainingProgram[]
    side_effects: []
  - method: POST
    path: "/training-programs/{training_program_id}/blocks"
    description: "Appends the next periodization block to a DRAFT program. expected_training_program_version must match the program's current version, because the block chain is validated against the tail the caller last observed."
    roles: [PerformanceDirector, Coach]
    code: 201
    input: [expected_training_program_version, phase, start_week, end_week, target_intensity_pct, weekly_volume_units, "predecessor_block_id?"]
    output: ProgramBlock
    side_effects:
      - "block created with status PLANNED and sequence_index = TrainingProgram.block_count (0-based)"
      - "increments TrainingProgram.version by 1"
      - "TrainingProgram.block_count += 1; total_weeks recomputed; pinned_block_versions stays null until activation"
  - method: POST
    path: "/training-programs/{training_program_id}/activate"
    description: "Activates a DRAFT program, computing its planned load and archiving any previously ACTIVE program for the same athlete."
    roles: [PerformanceDirector]
    code: 200
    input: []
    output: TrainingProgram
    side_effects:
      - "status DRAFT -> ACTIVE; activated_at stamped"
      - "program_planned_load computes planned_load_units and total_weeks"
      - "any other ACTIVE TrainingProgram for the same athlete -> ARCHIVED"
      - "increments TrainingProgram.version by 1"
  - method: GET
    path: "/program-blocks/{program_block_id}"
    description: "Reads one periodization block."
    roles: [PerformanceDirector, Coach, Athlete, Guardian]
    code: 200
    input: []
    output: ProgramBlock
    side_effects: []
  - method: GET
    path: "/program-blocks"
    description: "Lists blocks; reverse-reachability channel for ProgramBlock.training_program_id and the self-referential predecessor_block_id."
    roles: [PerformanceDirector, Coach]
    code: 200
    input: ["training_program_id?", "predecessor_block_id?", "phase?", "limit?", "offset?"]
    output: ProgramBlock[]
    side_effects: []

  # --- GroupSession ----------------------------------------------------------
  - method: POST
    path: "/group-sessions"
    description: "Schedules a group training session. [start_at, end_at) is half-open for athlete conflict detection and the facility concurrency cap; station_count drives the equipment-station rotation and the station-derived coach requirement."
    roles: [PerformanceDirector, FrontDesk]
    code: 201
    input: [start_at, end_at, site_code, station_count, phase_focus, max_athletes, "offsite_location?", "team_contract_id?"]
    output: GroupSession
    side_effects:
      - "session_status SCHEDULED, staffing_status STAFF_PENDING"
      - "coach_ratio_requirement computes required_coach_count from station_count alone (athlete_units == 0)"
  - method: GET
    path: "/group-sessions/{group_session_id}"
    description: "Reads one session including version, staffing counters and billing snapshot fields."
    roles: [PerformanceDirector, Coach, FrontDesk, Athlete, Guardian]
    code: 200
    input: []
    output: GroupSession
    side_effects: []
  - method: GET
    path: "/group-sessions"
    description: "Lists sessions in a time window; reverse-reachability channel for GroupSession.team_contract_id."
    roles: [PerformanceDirector, Coach, FrontDesk]
    code: 200
    input: ["site_code?", "session_status?", "staffing_status?", "team_contract_id?", "from_at?", "to_at?", "limit?", "offset?"]
    output: GroupSession[]
    side_effects: []
  - method: POST
    path: "/group-sessions/{group_session_id}/coaches"
    description: "Assigns a coach to a SCHEDULED session under optimistic concurrency on the session's version. The credential gate is evaluated before the scheduling-overlap and travel-buffer gates."
    roles: [PerformanceDirector, FrontDesk]
    code: 200
    input: [staff_member_id, expected_group_session_version]
    output: GroupSession
    side_effects:
      - "staff_member_id appended to assigned_staff"
      - "increments GroupSession.version by 1"
      - "coach_ratio_requirement recomputed: compliant_coach_count and staffing_status updated (STAFF_PENDING -> STAFFED or UNDERSTAFFED; UNDERSTAFFED -> STAFFED)"
  - method: POST
    path: "/group-sessions/{group_session_id}/lock-roster"
    description: "Locks the roster and assigns equipment stations. Requires staffing_status == STAFFED and a start_at still in the future."
    roles: [PerformanceDirector, Coach, FrontDesk]
    code: 200
    input: []
    output: GroupSession
    side_effects:
      - "session_status SCHEDULED -> ROSTER_LOCKED"
      - "station_rotation_assignment writes station_number on every RESERVED Enrollment in created_at ASC order"
      - "increments GroupSession.version by 1"
  - method: POST
    path: "/group-sessions/{group_session_id}/start"
    description: "Starts a ROSTER_LOCKED session; enrollments can no longer be created or cancelled."
    roles: [Coach]
    code: 200
    input: []
    output: GroupSession
    side_effects:
      - "session_status ROSTER_LOCKED -> IN_PROGRESS"
      - "increments GroupSession.version by 1"
  - method: POST
    path: "/group-sessions/{group_session_id}/complete"
    description: "Completes an IN_PROGRESS session: sweeps leftover RESERVED enrollments to NO_SHOW, then bills the team contract using team_contract_session_rate with the delivered counter read BEFORE the increment."
    roles: [Coach]
    code: 200
    input: []
    output: GroupSession
    side_effects:
      - "every remaining RESERVED Enrollment -> NO_SHOW in created_at ASC order, each running no_show_fee and incrementing Athlete.no_show_strikes / no_show_count (a third strike suspends the athlete)"
      - "session_status IN_PROGRESS -> COMPLETED"
      - "team_contract_session_rate writes billed_rate_cents, rate_tier_applied and delivered_slots_at_completion as immutable snapshots, and advances TeamContract.sessions_reserved / sessions_delivered / billed_amount_cents"
      - "TeamContract -> CLOSED when sessions_delivered reaches contracted_sessions"
      - "MembershipPackage.sessions_reserved decremented and sessions_consumed incremented for every package-funded ATTENDED or NO_SHOW enrollment"
      - "increments GroupSession.version by 1"
  - method: POST
    path: "/group-sessions/{group_session_id}/void-completion"
    description: "Reverses an erroneous completion. The reversal MUST use the stored billed_rate_cents and delivered_slots_at_completion snapshots rather than recomputing the tier, otherwise the contract's billed_amount_cents drifts whenever an intervening completion moved the rate tier. Refused when any enrollment on the session was marked NO_SHOW."
    roles: [PerformanceDirector]
    code: 200
    input: [void_reason]
    output: GroupSession
    side_effects:
      - "session_status COMPLETED -> IN_PROGRESS"
      - "every ATTENDED Enrollment -> RESERVED"
      - "TeamContract.billed_amount_cents -= billed_rate_cents * delivered_slots_at_completion; sessions_delivered -= delivered_slots_at_completion; sessions_reserved += delivered_slots_at_completion"
      - "TeamContract CLOSED -> ACTIVE when sessions_delivered falls below contracted_sessions"
      - "MembershipPackage.sessions_consumed decremented and sessions_reserved incremented for every package-funded enrollment restored"
      - "billed_rate_cents, rate_tier_applied and delivered_slots_at_completion cleared to null"
      - "increments GroupSession.version by 1"
  - method: POST
    path: "/group-sessions/{group_session_id}/cancel"
    description: "Cancels a SCHEDULED or ROSTER_LOCKED session and refunds every held enrollment."
    roles: [PerformanceDirector, FrontDesk]
    code: 200
    input: [cancel_reason]
    output: GroupSession
    side_effects:
      - "session_status -> CANCELED (terminal)"
      - "every RESERVED or WAITLISTED Enrollment -> CANCELED with cancel_reason = SESSION_CANCELED, restoring package credits (DEPLETED -> ACTIVE where applicable) and contract slots including offsite_sessions_used"
      - "increments GroupSession.version by 1"

  # --- Enrollment ------------------------------------------------------------
  - method: POST
    path: "/enrollments"
    description: "Enrolls an athlete in a group session, running session_charge_allocation's waterfall (team contract -> membership package -> drop-in). funding_preference defaults to ANY; request_waitlist defaults to false, and when true a capacity or coach-ratio breach produces a WAITLISTED row instead of an error."
    roles: [FrontDesk, Coach, Athlete, Guardian]
    code: 201
    input: [athlete_id, group_session_id, "funding_preference?", "request_waitlist?"]
    output: Enrollment
    side_effects:
      - "status RESERVED (or WAITLISTED); session_charge_allocation writes funding_source, membership_package_id and charge_cents for RESERVED rows only"
      - "GroupSession.reserved_count or waitlisted_count incremented"
      - "coach_ratio_requirement recomputed: athlete_units, required_coach_count and staffing_status (STAFFED -> UNDERSTAFFED when the growth outruns the assigned coaches)"
      - "MembershipPackage credit moved from sessions_remaining to sessions_reserved, or TeamContract slot moved from sessions_available to sessions_reserved (plus offsite_sessions_used for OFFSITE)"
      - "MembershipPackage ACTIVE -> DEPLETED when the last remaining credit is consumed"
  - method: GET
    path: "/enrollments/{enrollment_id}"
    description: "Reads one enrollment including funding_source, charge_cents, station_number and any no-show fee."
    roles: [PerformanceDirector, Coach, FrontDesk, Athlete, Guardian]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: GET
    path: "/enrollments"
    description: "Lists enrollments; reverse-reachability channel for Enrollment.athlete_id, group_session_id and membership_package_id."
    roles: [PerformanceDirector, Coach, FrontDesk]
    code: 200
    input: ["athlete_id?", "group_session_id?", "membership_package_id?", "status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []
  - method: POST
    path: "/enrollments/{enrollment_id}/cancel"
    description: "Cancels a held enrollment. At or before LATE_CANCEL_WINDOW_HOURS (24) before start_at the row becomes CANCELED and the credit is refunded; inside the window it becomes LATE_CANCEL, the credit is consumed and no fee is charged."
    roles: [FrontDesk, Athlete, Guardian]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "status -> CANCELED (refund path) or LATE_CANCEL (forfeit path)"
      - "CANCELED restores the funding source: MembershipPackage.sessions_reserved -> sessions_remaining (DEPLETED -> ACTIVE when applicable), or TeamContract.sessions_reserved -> sessions_available plus offsite_sessions_used decrement"
      - "LATE_CANCEL moves the credit to sessions_consumed, or counts the contract slot as delivered"
      - "GroupSession.reserved_count decremented; coach_ratio_requirement recomputed"
      - "waitlist_promotion runs on the freed slot"
  - method: POST
    path: "/enrollments/{enrollment_id}/attend"
    description: "Marks attendance for a RESERVED enrollment on an IN_PROGRESS session."
    roles: [Coach]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "status RESERVED -> ATTENDED; GroupSession.attended_count += 1"
      - "Athlete.attended_count += 1; athlete_readiness_index recomputed"
  - method: POST
    path: "/enrollments/{enrollment_id}/no-show"
    description: "Marks a RESERVED enrollment as a no-show on an IN_PROGRESS session, charging the escalating no-show fee and advancing the strike ladder."
    roles: [Coach]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "status RESERVED -> NO_SHOW; GroupSession.no_show_count += 1"
      - "Athlete.no_show_count += 1; Athlete.no_show_strikes += 1; strike_index_at_no_show recorded"
      - "no_show_fee writes no_show_fee_cents from the post-increment strike multiplier"
      - "Athlete.membership_status ACTIVE -> SUSPENDED when no_show_strikes reaches NO_SHOW_SUSPENSION_THRESHOLD, cascading the suspension cancellations described on POST /athletes/{athlete_id}/suspend"
      - "athlete_readiness_index recomputed"

  # --- StaffMember / Certification ------------------------------------------
  - method: POST
    path: "/staff-members"
    description: "Registers a coaching staff member. credential_status starts COMPLIANT with zero certifications; liability insurance expiry is evaluated live against the logical clock, unlike certification status which is persisted."
    roles: [PerformanceDirector]
    code: 201
    input: [full_name, role_title, liability_insurance_expires_on]
    output: StaffMember
    side_effects: []
  - method: GET
    path: "/staff-members/{staff_member_id}"
    description: "Reads one staff member including persisted credential_status and certification counters."
    roles: [PerformanceDirector, Coach, FrontDesk]
    code: 200
    input: []
    output: StaffMember
    side_effects: []
  - method: GET
    path: "/staff-members"
    description: "Lists staff members."
    roles: [PerformanceDirector, Coach, FrontDesk]
    code: 200
    input: ["credential_status?", "limit?", "offset?"]
    output: StaffMember[]
    side_effects: []
  - method: POST
    path: "/staff-members/{staff_member_id}/credential-review"
    description: "The ONLY operation that recalculates Certification.status against the logical clock and re-derives StaffMember.credential_status. Advancing the clock alone never lapses a certification, so persisted credential state can legitimately lag the clock until a review runs."
    roles: [PerformanceDirector]
    code: 200
    input: []
    output: StaffMember
    side_effects:
      - "each Certification of this staff member is re-evaluated in created_at ASC order: expires_on < today -> LAPSED; today <= expires_on <= today + 30 days -> EXPIRING; otherwise VALID"
      - "valid_certification_count, lapsed_certification_count and ceu_credits_earned_total recomputed; last_credential_review_at stamped"
      - "credential_status = LAPSED when lapsed_certification_count >= 1, else EXPIRING when any certification is EXPIRING, else COMPLIANT"
      - "when credential_status becomes LAPSED, the staff member is removed from assigned_staff on every GroupSession with session_status IN {SCHEDULED, ROSTER_LOCKED}; each affected session recomputes coach_ratio_requirement, may drop STAFFED -> UNDERSTAFFED, and a ROSTER_LOCKED session reverts to SCHEDULED with every RESERVED Enrollment.station_number cleared to null"
  - method: POST
    path: "/certifications"
    description: "Records a professional certification for a staff member. ceu_credits_required defaults to 6."
    roles: [PerformanceDirector]
    code: 201
    input: [staff_member_id, cert_code, issued_on, expires_on, "ceu_credits_required?"]
    output: Certification
    side_effects:
      - "status set to VALID; StaffMember.valid_certification_count += 1"
  - method: GET
    path: "/certifications/{certification_id}"
    description: "Reads one certification."
    roles: [PerformanceDirector, Coach]
    code: 200
    input: []
    output: Certification
    side_effects: []
  - method: GET
    path: "/certifications"
    description: "Lists certifications; reverse-reachability channel for Certification.staff_member_id."
    roles: [PerformanceDirector, Coach]
    code: 200
    input: ["staff_member_id?", "status?", "cert_code?", "limit?", "offset?"]
    output: Certification[]
    side_effects: []
  - method: POST
    path: "/certifications/{certification_id}/ceu-credits"
    description: "Logs continuing-education credits against a certification; renewal is blocked until ceu_credits_earned reaches ceu_credits_required."
    roles: [PerformanceDirector, Coach]
    code: 200
    input: [credits]
    output: Certification
    side_effects:
      - "ceu_credits_earned += credits; StaffMember.ceu_credits_earned_total += credits"
  - method: POST
    path: "/certifications/{certification_id}/renew"
    description: "Renews an EXPIRING or LAPSED certification once the CEU requirement is met, and immediately re-derives the owning staff member's credential_status."
    roles: [PerformanceDirector]
    code: 200
    input: [new_expires_on]
    output: Certification
    side_effects:
      - "status EXPIRING or LAPSED -> VALID; expires_on = new_expires_on; renewal_count += 1; ceu_credits_earned reset to 0"
      - "StaffMember counters and credential_status re-derived exactly as in credential-review"
      - "when credential_status returns to COMPLIANT, every GroupSession the staff member is still assigned to recomputes coach_ratio_requirement and may move UNDERSTAFFED -> STAFFED"

  # --- MembershipPackage -----------------------------------------------------
  - method: POST
    path: "/membership-packages"
    description: "Sells a session package to an athlete. sessions_remaining starts at sessions_purchased and effective_expires_on starts equal to expires_on."
    roles: [FrontDesk]
    code: 201
    input: [athlete_id, sessions_purchased, price_cents, expires_on]
    output: MembershipPackage
    side_effects:
      - "status ACTIVE; sessions_remaining = sessions_purchased; reserved / consumed / forfeited = 0; frozen_days_total = 0"
  - method: GET
    path: "/membership-packages/{membership_package_id}"
    description: "Reads one package including the four-way credit ledger and effective_expires_on."
    roles: [PerformanceDirector, FrontDesk, Athlete, Guardian]
    code: 200
    input: []
    output: MembershipPackage
    side_effects: []
  - method: GET
    path: "/membership-packages"
    description: "Lists packages; reverse-reachability channel for MembershipPackage.athlete_id."
    roles: [PerformanceDirector, FrontDesk]
    code: 200
    input: ["athlete_id?", "status?", "limit?", "offset?"]
    output: MembershipPackage[]
    side_effects: []
  - method: POST
    path: "/membership-packages/{membership_package_id}/freeze"
    description: "Freezes an ACTIVE package; a FROZEN package is excluded from the funding candidate pool."
    roles: [FrontDesk]
    code: 200
    input: []
    output: MembershipPackage
    side_effects:
      - "status ACTIVE -> FROZEN; frozen_at stamped from the logical clock"
  - method: POST
    path: "/membership-packages/{membership_package_id}/unfreeze"
    description: "Unfreezes a FROZEN package and extends its effective expiry by the frozen duration, rounded up to whole days."
    roles: [FrontDesk]
    code: 200
    input: []
    output: MembershipPackage
    side_effects:
      - "status FROZEN -> ACTIVE; frozen_at cleared"
      - "package_effective_expiry adds ceil(frozen duration in days) to frozen_days_total and recomputes effective_expires_on"

  # --- TeamContract ----------------------------------------------------------
  - method: POST
    path: "/team-contracts"
    description: "Creates a DRAFT team contract with a school or club. sessions_available starts at contracted_sessions."
    roles: [PerformanceDirector]
    code: 201
    input: [organization_name, organization_type, contracted_sessions, base_rate_cents, offsite_allowance, term_start, term_end]
    output: TeamContract
    side_effects:
      - "status DRAFT; sessions_available = contracted_sessions; reserved / delivered / offsite_sessions_used / billed_amount_cents = 0; rate_tier = TIER_1"
  - method: GET
    path: "/team-contracts/{team_contract_id}"
    description: "Reads one contract including the slot ledger, rate_tier and billed_amount_cents."
    roles: [PerformanceDirector, FrontDesk]
    code: 200
    input: []
    output: TeamContract
    side_effects: []
  - method: GET
    path: "/team-contracts"
    description: "Lists contracts."
    roles: [PerformanceDirector, FrontDesk]
    code: 200
    input: ["organization_type?", "status?", "limit?", "offset?"]
    output: TeamContract[]
    side_effects: []
  - method: POST
    path: "/team-contracts/{team_contract_id}/activate"
    description: "Activates a DRAFT contract so its slots become spendable and its sessions billable."
    roles: [PerformanceDirector]
    code: 200
    input: []
    output: TeamContract
    side_effects:
      - "status DRAFT -> ACTIVE"
  - method: POST
    path: "/team-contracts/{team_contract_id}/athletes"
    description: "Links a roster athlete to an ACTIVE contract so contract slots become the first bucket of the funding waterfall."
    roles: [PerformanceDirector, FrontDesk]
    code: 200
    input: [athlete_id]
    output: Athlete
    side_effects:
      - "Athlete.team_contract_id set to this contract"

  # --- ReturnToSportPlan -----------------------------------------------------
  - method: POST
    path: "/rts-plans"
    description: "Opens a return-to-sport progression against an ACTIVE_REHAB injury record that requires RTS. Opening a plan restricts the athlete's training clearance and applies the readiness penalty."
    roles: [MedicalProvider]
    code: 201
    input: [athlete_id, injury_record_id, target_stage_count]
    output: ReturnToSportPlan
    side_effects:
      - "status STAGE_ACTIVE; current_stage = 1; stage_attempts = 0; total_failed_attempts = 0"
      - "Athlete.training_clearance CLEARED -> RESTRICTED"
      - "athlete_readiness_index recomputed with the RTS_PENALTY applied; the athlete's UNIT_RTS weighting now applies to coach_ratio_requirement on every session they hold"
  - method: GET
    path: "/rts-plans/{rts_plan_id}"
    description: "Reads one plan including current_stage, stage_attempts and active_stage_test_id."
    roles: [PerformanceDirector, Coach, MedicalProvider, Athlete, Guardian]
    code: 200
    input: []
    output: ReturnToSportPlan
    side_effects: []
  - method: GET
    path: "/rts-plans"
    description: "Lists plans; reverse-reachability channel for ReturnToSportPlan.athlete_id, injury_record_id and active_stage_test_id."
    roles: [PerformanceDirector, Coach, MedicalProvider]
    code: 200
    input: ["athlete_id?", "injury_record_id?", "status?", "active_stage_test_id?", "limit?", "offset?"]
    output: ReturnToSportPlan[]
    side_effects: []
  - method: POST
    path: "/rts-plans/{rts_plan_id}/stage-test"
    description: "Opens the stage criterion test for the plan's current stage. Returns the created DRAFT PERFORMANCE_BATTERY TestSession, whose administered_by_staff_id is the acting Coach's X-User-ID — the same identity that is then barred from judging it."
    roles: [Coach]
    code: 201
    input: []
    output: TestSession
    side_effects:
      - "plan status STAGE_ACTIVE -> STAGE_TESTING; active_stage_test_id set to the new session"
      - "TestSession created with battery_type PERFORMANCE_BATTERY, status DRAFT and rts_plan_id set to this plan"
  - method: POST
    path: "/rts-plans/{rts_plan_id}/stage-decision"
    description: "Records the medical decision on the plan's active stage test, which must already be FINALIZED. `decision` is PASS or FAIL. A PASS requires a SIGNED, unexpired STAGE_CLEARANCE document for the current stage, and the acting X-User-ID must differ from the stage test's administered_by_staff_id. RTS_MAX_STAGE_ATTEMPTS is 2."
    roles: [MedicalProvider]
    code: 200
    input: [decision]
    output: ReturnToSportPlan
    side_effects:
      - "PASS below the final stage: current_stage += 1; stage_attempts reset to 0; status STAGE_TESTING -> STAGE_ACTIVE; active_stage_test_id cleared"
      - "PASS at the final stage: status STAGE_TESTING -> MEDICAL_REVIEW"
      - "FAIL below RTS_MAX_STAGE_ATTEMPTS (2): stage_attempts += 1; total_failed_attempts += 1; status STAGE_TESTING -> STAGE_ACTIVE"
      - "FAIL reaching RTS_MAX_STAGE_ATTEMPTS (2): total_failed_attempts += 1; status STAGE_TESTING -> MEDICAL_REVIEW"
      - "athlete_readiness_index recomputed"
  - method: POST
    path: "/rts-plans/{rts_plan_id}/abort"
    description: "Abandons a return-to-sport progression; the athlete stays RESTRICTED."
    roles: [MedicalProvider]
    code: 200
    input: [abort_reason]
    output: ReturnToSportPlan
    side_effects:
      - "status -> ABORTED (terminal); active_stage_test_id cleared"
      - "the RTS readiness penalty and the UNIT_RTS weighting stop applying; every GroupSession the athlete holds recomputes coach_ratio_requirement"

  # --- ClearanceDocument -----------------------------------------------------
  - method: POST
    path: "/clearance-documents"
    description: "Creates a PENDING clearance document from a medical provider: a per-stage STAGE_CLEARANCE, a FULL_RELEASE that closes an RTS plan, or a MEDICAL_HOLD_RELEASE that lifts a medical hold."
    roles: [MedicalProvider]
    code: 201
    input: [athlete_id, rts_plan_id, document_type, stage_number, expires_on]
    output: ClearanceDocument
    side_effects:
      - "status PENDING"
  - method: GET
    path: "/clearance-documents/{clearance_document_id}"
    description: "Reads one clearance document."
    roles: [PerformanceDirector, Coach, MedicalProvider, Athlete, Guardian]
    code: 200
    input: []
    output: ClearanceDocument
    side_effects: []
  - method: GET
    path: "/clearance-documents"
    description: "Lists clearance documents; reverse-reachability channel for ClearanceDocument.athlete_id and rts_plan_id."
    roles: [PerformanceDirector, Coach, MedicalProvider]
    code: 200
    input: ["athlete_id?", "rts_plan_id?", "status?", "document_type?", "limit?", "offset?"]
    output: ClearanceDocument[]
    side_effects: []
  - method: POST
    path: "/clearance-documents/{clearance_document_id}/sign"
    description: "Signs a PENDING document. The signer's X-User-ID is stored as provider_license_id and must differ from the administered_by_staff_id of the plan's active stage test. An already-expired expires_on is refused."
    roles: [MedicalProvider]
    code: 200
    input: [provider_license_id]
    output: ClearanceDocument
    side_effects:
      - "status PENDING -> SIGNED; signed_at stamped"
      - "document_type FULL_RELEASE: the referenced plan MEDICAL_REVIEW -> CLEARED, cleared_at stamped, Athlete.training_clearance RESTRICTED -> CLEARED, the anchoring InjuryRecord -> RESOLVED, and the RTS readiness penalty stops applying"
      - "document_type MEDICAL_HOLD_RELEASE: Athlete.training_clearance MEDICAL_HOLD -> CLEARED when injury_risk_score < RISK_RESTRICTION_THRESHOLD, else -> RESTRICTED"
      - "document_type STAGE_CLEARANCE: no state change; the document becomes the precondition a PASS stage-decision at that stage_number requires"
  - method: POST
    path: "/clearance-documents/{clearance_document_id}/revoke"
    description: "Revokes a PENDING or SIGNED document, withdrawing the clearance it carried."
    roles: [MedicalProvider]
    code: 200
    input: [revoke_reason]
    output: ClearanceDocument
    side_effects:
      - "status -> REVOKED (terminal)"
      - "a revoked STAGE_CLEARANCE no longer satisfies the PASS precondition for its stage_number"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:

  # --- authentication / authorization ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header missing or not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The caller's role is not listed in the endpoint's roles set in §1.5"
  - id: ERR_ATHLETE_SCOPE_VIOLATION
    http: 403
    condition: "An Athlete or Guardian caller addressed a resource that does not belong to the athlete identified by X-User-ID, or a Guardian acted for an athlete who is 18 or older or has no guardian_email on file"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID equals the administered_by_staff_id of the stage TestSession being judged or cleared — the coach who ran the criterion test cannot decide or sign off on it"

  # --- not found -------------------------------------------------------------
  - id: ERR_ATHLETE_NOT_FOUND
    http: 404
    condition: "athlete_id in the path or body does not resolve to an Athlete"
  - id: ERR_INJURY_RECORD_NOT_FOUND
    http: 404
    condition: "injury_record_id does not resolve to an InjuryRecord"
  - id: ERR_TEST_SESSION_NOT_FOUND
    http: 404
    condition: "test_session_id does not resolve to a TestSession"
  - id: ERR_TRAINING_PROGRAM_NOT_FOUND
    http: 404
    condition: "training_program_id does not resolve to a TrainingProgram"
  - id: ERR_PROGRAM_BLOCK_NOT_FOUND
    http: 404
    condition: "program_block_id or predecessor_block_id does not resolve to a ProgramBlock"
  - id: ERR_GROUP_SESSION_NOT_FOUND
    http: 404
    condition: "group_session_id does not resolve to a GroupSession"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "enrollment_id does not resolve to an Enrollment"
  - id: ERR_STAFF_MEMBER_NOT_FOUND
    http: 404
    condition: "staff_member_id, or the X-User-ID of an acting Coach, does not resolve to a StaffMember"
  - id: ERR_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "certification_id does not resolve to a Certification"
  - id: ERR_MEMBERSHIP_PACKAGE_NOT_FOUND
    http: 404
    condition: "membership_package_id does not resolve to a MembershipPackage"
  - id: ERR_TEAM_CONTRACT_NOT_FOUND
    http: 404
    condition: "team_contract_id does not resolve to a TeamContract"
  - id: ERR_RTS_PLAN_NOT_FOUND
    http: 404
    condition: "rts_plan_id does not resolve to a ReturnToSportPlan"
  - id: ERR_CLEARANCE_DOCUMENT_NOT_FOUND
    http: 404
    condition: "clearance_document_id does not resolve to a ClearanceDocument"

  # --- schema ----------------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "A required input field is absent, or a value violates its type, enum domain, range, or an intra-body ordering rule (end_at <= start_at, end_week < start_week, term_end < term_start, expires_on <= issued_on, OFFSITE without offsite_location, duplicate or out-of-domain metric codes)"
  - id: ERR_CLOCK_REWIND_FORBIDDEN
    http: 422
    condition: "POST /_clock/set_current_utc supplied an instant earlier than the current logical clock"

  # --- concurrency -----------------------------------------------------------
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_group_session_version or expected_training_program_version does not match the parent's current version, meaning the caller is acting on a view of the parent that has since changed"

  # --- state -----------------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The addressed entity's current state has no declared transition for the requested trigger (and is not a terminal state)"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "The addressed entity is in a terminal state (Enrollment NO_SHOW / LATE_CANCEL / CANCELED, TestSession FINALIZED, GroupSession CANCELED, MembershipPackage EXPIRED, ReturnToSportPlan CLEARED / ABORTED, ClearanceDocument EXPIRED / REVOKED, TrainingProgram ARCHIVED)"
  - id: ERR_ATHLETE_SUSPENDED
    http: 409
    condition: "The subject athlete's membership_status is SUSPENDED, so no enrollment, test session, program activation or package purchase may be created for them"
  - id: ERR_DUPLICATE_ENROLLMENT
    http: 409
    condition: "The athlete already holds an Enrollment in RESERVED, WAITLISTED, ATTENDED or NO_SHOW state on this GroupSession"

  # --- business safety -------------------------------------------------------
  - id: ERR_MOVEMENT_SCREEN_REQUIRED
    http: 422
    condition: "The athlete's training_clearance is still SCREEN_PENDING — no MOVEMENT_SCREEN TestSession has been finalized, so no training or performance testing may be scheduled"
  - id: ERR_ATHLETE_MEDICAL_HOLD
    http: 422
    condition: "The athlete's training_clearance is MEDICAL_HOLD and only a signed MEDICAL_HOLD_RELEASE can lift it"
  - id: ERR_STAGE_CLEARANCE_MISSING
    http: 422
    condition: "A PASS stage decision was attempted without a SIGNED, unrevoked STAGE_CLEARANCE ClearanceDocument for the plan's current_stage"
  - id: ERR_CLEARANCE_EXPIRED
    http: 422
    condition: "The ClearanceDocument's expires_on is earlier than the current logical date, so it can neither be signed nor satisfy a clearance requirement"
  - id: ERR_STAFF_CREDENTIAL_LAPSED
    http: 422
    condition: "The staff member's persisted credential_status is LAPSED, or their liability_insurance_expires_on is earlier than the current logical date, so they may not be assigned to a session or administer a test"
  - id: ERR_CEU_REQUIREMENT_NOT_MET
    http: 422
    condition: "A certification renewal was attempted while ceu_credits_earned < ceu_credits_required"

  # --- business constraint ---------------------------------------------------
  - id: ERR_SESSION_FULL
    http: 422
    condition: "reserved_count already equals max_athletes and the request did not ask for a waitlist placement"
  - id: ERR_COACH_RATIO_EXCEEDED
    http: 422
    condition: "The resulting required_coach_count from coach_ratio_requirement would exceed the session's compliant_coach_count (on enrollment), or the roster was locked while staffing_status != STAFFED"
  - id: ERR_READINESS_BELOW_THRESHOLD
    http: 422
    condition: "Enrollment in a COMPETITION-phase session was attempted with a live readiness_index below COMPETITION_READINESS_MIN (60.00)"
  - id: ERR_RESTRICTED_PHASE_NOT_PERMITTED
    http: 422
    condition: "A RESTRICTED athlete was enrolled in a session whose phase_focus is not GENERAL_PREP or TRANSITION"
  - id: ERR_PROGRAM_BLOCK_SEQUENCE_INVALID
    http: 422
    condition: "A program block would break the unbroken week chain (wrong start_week for its predecessor, missing or foreign predecessor, a first block not starting at week 1), or a program with zero blocks was activated"

  # --- business temporal -----------------------------------------------------
  - id: ERR_STAFF_SCHEDULE_CONFLICT
    http: 409
    condition: "The staff member is already assigned to another GroupSession whose [start_at, end_at] closed interval overlaps this one"
  - id: ERR_TRAVEL_BUFFER_VIOLATION
    http: 409
    condition: "Consecutive assignments at different locations leave less than TRAVEL_BUFFER_MINUTES (30) between the earlier end_at and the later start_at"
  - id: ERR_ATHLETE_SCHEDULE_CONFLICT
    http: 409
    condition: "The athlete already holds a RESERVED or WAITLISTED enrollment in a GroupSession whose [start_at, end_at) half-open interval overlaps this one"
  - id: ERR_SITE_CONCURRENCY_EXCEEDED
    http: 409
    condition: "The new ONSITE session would make more than FACILITY_MAX_CONCURRENT_ONSITE (3) non-canceled ONSITE sessions overlap at the same instant"
  - id: ERR_ENROLLMENT_WINDOW_CLOSED
    http: 409
    condition: "The session's start_at is at or before the current logical clock, so enrollment and roster locking are closed"

  # --- business referential --------------------------------------------------
  - id: ERR_NORM_BAND_UNAVAILABLE
    http: 422
    condition: "No NORM_TABLE row matches the athlete's (sport, position, lookup_age) for any submitted metric, so no percentile can be computed"
  - id: ERR_NO_TEST_RESULTS
    http: 422
    condition: "Finalize was attempted on a TestSession with result_count == 0"
  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 422
    condition: "A GroupSession or athlete link referenced a TeamContract whose status is not ACTIVE"
  - id: ERR_VOID_BLOCKED_BY_NO_SHOW
    http: 409
    condition: "Void-completion was attempted on a session where at least one Enrollment was marked NO_SHOW, whose strike counters and assessed fees cannot be unwound"

  # --- business fiscal -------------------------------------------------------
  - id: ERR_NO_SESSION_CREDIT
    http: 402
    condition: "funding_preference == PACKAGE_ONLY but no eligible contract slot and no eligible ACTIVE package with sessions_remaining >= 1 exists"
  - id: ERR_PACKAGE_EXPIRED
    http: 402
    condition: "The only candidate package's effective_expires_on precedes the session date, or the package is already EXPIRED"
  - id: ERR_OFFSITE_ALLOWANCE_EXHAUSTED
    http: 402
    condition: "A contract-linked athlete attempted an OFFSITE session after offsite_sessions_used reached offsite_allowance"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:

  - name: PerformanceDirector
    description: "Facility director: owns the roster, the coaching staff and their credentials, team contracts, program activation, and the corrective void-completion authority. Cannot administer tests, cannot make medical decisions, and cannot enrol athletes."
    identity: "opaque"
    exclusive_operations:
      - "POST /athletes/{athlete_id}/suspend"
      - "POST /athletes/{athlete_id}/reinstate"
      - "POST /training-programs/{training_program_id}/activate"
      - "POST /group-sessions/{group_session_id}/void-completion"
      - "POST /staff-members"
      - "POST /staff-members/{staff_member_id}/credential-review"
      - "POST /certifications"
      - "POST /certifications/{certification_id}/renew"
      - "POST /team-contracts"
      - "POST /team-contracts/{team_contract_id}/activate"
    shared_operations:
      - "POST /athletes (with FrontDesk)"
      - "POST /injury-records (with MedicalProvider)"
      - "POST /training-programs and POST /training-programs/{training_program_id}/blocks (with Coach)"
      - "POST /group-sessions, POST /group-sessions/{group_session_id}/coaches, /lock-roster, /cancel (with FrontDesk and Coach)"
      - "POST /team-contracts/{team_contract_id}/athletes (with FrontDesk)"
      - "POST /certifications/{certification_id}/ceu-credits (with Coach)"
      - "POST /_clock/set_current_utc (with all operator roles)"
      - "all GET reads across the facility"

  - name: Coach
    description: "Credentialed coaching staff. Administers test sessions and runs sessions on the floor. Every Coach call carries X-User-ID equal to a StaffMember id, which is what makes both the credential gate and the segregation-of-duties gate on RTS stage decisions enforceable."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /test-sessions"
      - "POST /test-sessions/{test_session_id}/results"
      - "POST /test-sessions/{test_session_id}/finalize"
      - "POST /group-sessions/{group_session_id}/start"
      - "POST /group-sessions/{group_session_id}/complete"
      - "POST /enrollments/{enrollment_id}/attend"
      - "POST /enrollments/{enrollment_id}/no-show"
      - "POST /rts-plans/{rts_plan_id}/stage-test"
    shared_operations:
      - "POST /training-programs and POST /training-programs/{training_program_id}/blocks (with PerformanceDirector)"
      - "POST /group-sessions/{group_session_id}/lock-roster (with PerformanceDirector and FrontDesk)"
      - "POST /enrollments (with FrontDesk, Athlete and Guardian)"
      - "POST /certifications/{certification_id}/ceu-credits (with PerformanceDirector)"
      - "POST /_clock/set_current_utc (with all operator roles)"
      - "athlete, session, program, test, certification and clearance reads"

  - name: MedicalProvider
    description: "External or affiliated medical provider. Sole authority over injury records, medical holds, return-to-sport progressions and clearance documentation. Cannot administer performance tests, so the provider judging a stage is structurally separable from the coach who tested it."
    identity: "opaque"
    exclusive_operations:
      - "POST /athletes/{athlete_id}/medical-hold"
      - "POST /injury-records/{injury_record_id}/resolve"
      - "POST /rts-plans"
      - "POST /rts-plans/{rts_plan_id}/stage-decision"
      - "POST /rts-plans/{rts_plan_id}/abort"
      - "POST /clearance-documents"
      - "POST /clearance-documents/{clearance_document_id}/sign"
      - "POST /clearance-documents/{clearance_document_id}/revoke"
    shared_operations:
      - "POST /injury-records (with PerformanceDirector)"
      - "POST /_clock/set_current_utc (with all operator roles)"
      - "athlete, injury, test-session, RTS plan and clearance reads"

  - name: FrontDesk
    description: "Reception and sales desk: registers athletes, sells and freezes packages, schedules sessions, links contract athletes and books enrollments. No clinical, credentialing or floor-execution authority."
    identity: "opaque"
    exclusive_operations:
      - "POST /membership-packages"
      - "POST /membership-packages/{membership_package_id}/freeze"
      - "POST /membership-packages/{membership_package_id}/unfreeze"
    shared_operations:
      - "POST /athletes (with PerformanceDirector)"
      - "POST /group-sessions, POST /group-sessions/{group_session_id}/coaches, /lock-roster, /cancel (with PerformanceDirector and Coach)"
      - "POST /enrollments and POST /enrollments/{enrollment_id}/cancel (with Athlete and Guardian)"
      - "POST /team-contracts/{team_contract_id}/athletes (with PerformanceDirector)"
      - "POST /_clock/set_current_utc (with all operator roles)"
      - "athlete, session, enrollment, package and contract reads"

  - name: Athlete
    description: "The athlete acting for themselves. X-User-ID is the athlete's own id; every read and write is scoped to that id by the ownership rule at validation priority 6."
    identity: "entity_backed:Athlete"
    exclusive_operations: []
    shared_operations:
      - "POST /enrollments and POST /enrollments/{enrollment_id}/cancel (with FrontDesk, Coach and Guardian)"
      - "GET /athletes/{athlete_id} and GET /athletes/{athlete_id}/progress-report, restricted to their own id"
      - "reads of their own test sessions, injury records, enrollments, packages, programs, RTS plans and clearance documents"

  - name: Guardian
    description: "Parent or guardian of a minor athlete. X-User-ID is the MINOR ATHLETE's id, not a separate guardian id, so the ownership rule is the same comparison as for the Athlete role; the role additionally requires the target athlete to be under 18 with a guardian_email on file, which is what makes a Guardian call on an adult athlete a scope violation rather than a mere authorization failure."
    identity: "entity_backed:Athlete"
    exclusive_operations: []
    shared_operations:
      - "POST /enrollments and POST /enrollments/{enrollment_id}/cancel (with FrontDesk, Coach and Athlete)"
      - "GET /athletes/{athlete_id} and GET /athletes/{athlete_id}/progress-report for the minor they represent"
      - "reads of the minor's test sessions, injury records, enrollments, packages, programs, RTS plans and clearance documents"

