              as: ShiftCoordinator
              captures: { status_after_2: $.data.status, nsc: $.data.lifetime_no_show_count }
          assert:
            - "after 1 no-show Volunteer.${vol_id}.status == ACTIVE"
            - "after 2 no-shows Volunteer.${vol_id}.status == SUSPENDED"
            - "Volunteer.${vol_id}.lifetime_no_show_count == 2"

      - name: stub_occ_signup_create_stale_shift
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[signup-create-stale-shift]
        excluded_because:
          difficulty_instance: shift_capacity_last_seat_full_at_equality
          rationale: "The signup-create OCC version advance is exercised within the capacity-boundary §1.8 instance; the stale-version 412 path is separately covered by occ_stale_shift_version_on_group_allocate in §1.9."

  # ===========================================================================
  - section: consistency_model
    instances:
