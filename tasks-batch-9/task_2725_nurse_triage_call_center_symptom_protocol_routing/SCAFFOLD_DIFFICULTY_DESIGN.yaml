        grounds:
          - entities.ProtocolAssessment.fields.status
          - state_machines.Disposition.AUTHORIZED_to_VOIDED
          - state_machines.CallbackTask.PENDING_to_CANCELLED
          - entities.Nurse.fields.pending_high_risk_count
          - calculations.nurse_load_conservation
          - entities.Practice.fields.open_callback_count
        distinguishing_aspect: "One re-assessment call must ripple four levels deep — assessment SUPERSEDED, disposition VOIDED, callback CANCELLED, Practice.open_callback_count back to 0, Nurse.pending_high_risk_count back to 0 and intake_eligibility back to ON_ROTATION, and TriageCall.requires_warm_transfer back to false — while leaving Nurse.active_call_load at 1 because the call itself is still open."
