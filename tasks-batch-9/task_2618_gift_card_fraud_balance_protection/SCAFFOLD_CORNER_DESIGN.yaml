          - calculations.hold_capacity_check
        distinguishing_aspect: "Advancing the clock past hold_expires_at is what fires ACTIVE→EXPIRED: the clock call reports expired_hold_count 1, held_amount_cents drops from 4000 to 0, disposition stays null (nobody settled it), and the freed capacity lets a subsequent hold for the full 10000 succeed."
        test_recipe:
          setup:
            - "One RetailStore, one INTACT CardRack, one ACTIVE PHYSICAL GiftCard with face value 10000 cents."
            - "One ACTIVE RedemptionHold of 4000 cents over 2026-08-01T00:00:00Z..2026-08-01T06:00:00Z. Logical clock still at 2026-08-01T00:00:00Z."
