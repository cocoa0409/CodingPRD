            - { call: "POST /pilot-training/training-classes/${cls}/open", payload: {}, as: TrainingCoordinator }
            - { call: "GET /pilot-training/training-classes/${cls}", payload: {}, as: TrainingCoordinator, captures: { v1: $.data.version } }
            - { call: "POST /pilot-training/enrollments", payload: { applicant_id: "${ap1}", training_class_id: "${cls}", expected_training_class_version: "${v1}" }, as: TrainingCoordinator, captures: { en1: $.data.id } }
            - { call: "POST /pilot-training/enrollments/${en1}/confirm", payload: {}, as: TrainingCoordinator }
            - { call: "GET /pilot-training/training-classes/${cls}", payload: {}, as: TrainingCoordinator, captures: { v2: $.data.version, conf_base: $.data.confirmed_count, act_base: $.data.active_enrollment_count } }
            - { call: "POST /pilot-training/enrollments", payload: { applicant_id: "${ap2}", training_class_id: "${cls}", expected_training_class_version: "${v2}" }, as: TrainingCoordinator, captures: { en2: $.data.id } }
