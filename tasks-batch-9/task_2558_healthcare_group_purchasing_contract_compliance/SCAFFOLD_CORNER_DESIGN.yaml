      - name: tiered_pricing_boundaries_across_discount_exception_and_floor
        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: tier_discount_local_exception_and_floor_clamp_interaction
          rationale: "That §1.8 combinatorial-formula instance walks the full (discount tier) x (exception present) x (floor binding) cube on one item, including the marginal-vs-average trap and the case where the floor overrides both the tier discount and the requested exception price — the tiered_pricing boundary claim in full."

      - name: dual_variant_compliance_divergence_on_identical_rows
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: compliance_preliminary_versus_final_same_period
          rationale: "The §1.8 dual-variant instance measures then finalizes the same measurement over the same rows and asserts both variant results and their delta, driven by the PARTIALLY_LOADED-file and UNMATCHED-spend differences between the two status sets."

      - name: dual_variant_selection_by_contract_share_basis
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: admin_fee_pool_accrual_basis_versus_collected_basis
          rationale: "That §1.8 instance shows Contract.share_basis alone selecting which distribute hop is legal and which pool the holdback ladder is keyed on, with both variants computed over identical purchase data — the variant-selection claim for the only other dual-variant calculation."

      - name: dual_variant_reconciliation_when_preliminary_becomes_final
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: compliance_preliminary_versus_final_same_period
          rationale: "The same §1.8 instance carries the reconciliation half: preliminary_compliance_pct is preserved as the audit trail while the FINAL figure is the one written onto Commitment.last_final_compliance_pct and used to retier, so the ledger effect of the variant switch is already asserted."

      - name: waterfall_remainder_cent_allocation_between_two_members
        claim_type: waterfall_allocation
        excluded_because:
          difficulty_instance: holdback_ladder_keyed_on_gross_pool_before_member_share
          rationale: "That §1.8 instance computes the two-member waterfall on a 58617-cent member pool with weights 4750000 and 1900000, asserting floors 41869 + 16747, the single remainder cent going to the 0.714 fractional part, the resulting 41869 / 16748 shares and member_share_total_cents == member_pool_cents — the first-bucket, remainder and conservation claims together."

  # ─────────────────────────────────────────────────────────────────────────
  # §1.9 VALIDATIONS — the 24-row priority ladder of §1.4, its satisfaction
  # side, and the pattern rows (cross-entity, temporal, aggregate,
  # conditional, cascading). The three declared §1.4.1 priority conflicts are
  # excluded to §1.8.
  # ─────────────────────────────────────────────────────────────────────────
  - section: validations
    instances:

      - name: election_at_the_exact_tier_volume_floor_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=22]
          - errors.ERR_COMMITTED_VOLUME_BELOW_TIER
          - endpoints[POST /gpo/commitments]
        distinguishing_aspect: "The fiscal floor is `committed_volume_units >= min_committed_volume_units`, so electing TIER_1 with exactly 2000 units against a 2000-unit floor is a 201 and not a 409. The neighbouring 1999 is the rejection, which pins the comparison as inclusive rather than strict."
        test_recipe:
          setup: ["ACTIVE contract C-FLR on the full three-tier ladder (TIER_1 floor 2000 units / 80.00 pct); two ACTIVE members M-1 and M-2."]
          setup_api_calls:
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-FLR", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 }, { tier_code: "TIER_1", min_committed_volume_units: 2000, min_compliance_pct: 80.00, discount_bps: 800 }, { tier_code: "TIER_2", min_committed_volume_units: 5000, min_compliance_pct: 90.00, discount_bps: 1500 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 } ] }
              as: ContractManager
              captures: { c1: $.data.id }
            - call: "POST /gpo/contracts/${c1}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/members"
              payload: { member_code: "M-1", name: "Riverbend Regional Hospital", aggregation_group_code: "AGG-NORTH", item_master: [ { member_item_number: "MI-1", description: "Suture 3-0", units_per_uom: 1 } ] }
              as: ContractManager
              captures: { m1: $.data.id }
            - call: "POST /gpo/members"
              payload: { member_code: "M-2", name: "Lakeside Surgical Center", aggregation_group_code: "AGG-NORTH", item_master: [ { member_item_number: "MI-1", description: "Suture 3-0", units_per_uom: 1 } ] }
              as: ContractManager
              captures: { m2: $.data.id }
          trigger:
            - call: "POST /gpo/commitments"
              payload: { member_id: "${m1}", contract_id: "${c1}", elected_tier_code: "TIER_1", committed_volume_units: 2000, effective_from: "2026-08-01" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { k1: $.data.id, es: $.data.election_status, ls: $.data.lop_status, cv: $.data.committed_volume_units, ct: $.data.current_tier_code }
            - call: "POST /gpo/commitments"
              payload: { member_id: "${m2}", contract_id: "${c1}", elected_tier_code: "TIER_1", committed_volume_units: 1999, effective_from: "2026-08-01" }
              as: MemberMaterialsManager
              as_user_id: "${m2}"
              captures: { e2: $.data.error_id }
          assert:
            - "the first call returns 201 with ${es} == ELECTED, ${ls} == NOT_ISSUED, ${cv} == 2000 and ${ct} == null"
            - "${e2} == ERR_COMMITTED_VOLUME_BELOW_TIER with HTTP 409 — one unit below the floor is the rejection"
            - "electing TIER_1 does not set current_tier_code: only lop countersign does that"
            - "Contract.${c1}.active_commitment_count is still 0 after both calls"

      - name: unauthenticated_beats_role_which_beats_not_found_returns_401
        claim_type: priority_ordering
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=4]
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "One request violates three rules at once — no X-User-ID, a role the endpoint does not list, and a contract_id that matches nothing — and the ladder is walked strictly top-down: 401 first, then 403 once the header is supplied, then 404 once the role is right. The resource is never looked up while authentication or authorisation is still failing."
        test_recipe:
          setup: ["No fixtures are required; the target contract_id is deliberately unknown."]
          setup_api_calls: []
          trigger:
            - call: "POST /gpo/contracts/00000000-0000-4000-8000-0000000000ff/activate"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: ""
              captures: { e1: $.data.error_id }
            - call: "POST /gpo/contracts/00000000-0000-4000-8000-0000000000ff/activate"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "U-OPS-1"
              captures: { e2: $.data.error_id }
            - call: "POST /gpo/contracts/00000000-0000-4000-8000-0000000000ff/activate"
              payload: {}
              as: ContractManager
              as_user_id: "U-CM-1"
              captures: { e3: $.data.error_id }
          assert:
            - "${e1} == ERR_UNAUTHENTICATED with HTTP 401 — the missing or empty X-User-ID header outranks everything"
            - "${e2} == ERR_ROLE_NOT_PERMITTED with HTTP 403 — POST /gpo/contracts/{contract_id}/activate lists only ContractManager"
            - "${e3} == ERR_CONTRACT_NOT_FOUND with HTTP 404 — existence is only tested once auth passes"
            - "none of the three responses leaks whether the contract exists"
            - "POST /gpo/_clock/set_current_utc is the sole endpoint exempt from the X-User-ID requirement"

      - name: cross_reference_against_a_delisted_item_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - errors.ERR_CONTRACT_ITEM_NOT_ACTIVE
          - entities.ContractItem.fields.status
          - endpoints[POST /gpo/item-cross-references]
        distinguishing_aspect: "The proposal's legality depends on a different entity's state: the same request body is accepted against an ACTIVE ContractItem and refused against a DELISTED one. Delisting is not a delete — the item still resolves, so the answer is ERR_CONTRACT_ITEM_NOT_ACTIVE (409) and not ERR_CONTRACT_ITEM_NOT_FOUND (404)."
        test_recipe:
          setup: ["ACTIVE contract C-DLS with two items V-1 (left ACTIVE) and V-2 (delisted); member M-1 whose item_master carries MI-1 and MI-2."]
          setup_api_calls:
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-DLS", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 } ] }
              as: ContractManager
              captures: { c1: $.data.id }
            - call: "POST /gpo/contracts/${c1}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/contracts/${c1}/items"
              payload: { vendor_item_number: "V-1", item_description: "Suture 3-0 absorbable", uom: "EA", units_per_uom: 1, base_price_cents: 10000, floor_price_cents: 8200, requires_evidence: false }
              as: ContractManager
              captures: { i1: $.data.id }
            - call: "POST /gpo/contracts/${c1}/items"
              payload: { vendor_item_number: "V-2", item_description: "Mesh graft 10x10", uom: "EA", units_per_uom: 1, base_price_cents: 5000, floor_price_cents: 4000, requires_evidence: false }
              as: ContractManager
              captures: { i2: $.data.id }
            - call: "POST /gpo/contract-items/${i2}/delist"
              payload: { reason: "supplier discontinued the SKU" }
              as: ContractManager
              captures: { s2: $.data.status }
            - call: "POST /gpo/members"
              payload: { member_code: "M-1", name: "Riverbend Regional Hospital", aggregation_group_code: "AGG-NORTH", item_master: [ { member_item_number: "MI-1", description: "Suture 3-0", units_per_uom: 1 }, { member_item_number: "MI-2", description: "Mesh graft", units_per_uom: 1 } ] }
              as: ContractManager
              captures: { m1: $.data.id }
          trigger:
            - call: "POST /gpo/item-cross-references"
              payload: { member_id: "${m1}", contract_item_id: "${i2}", member_item_number: "MI-2", match_type: "EXACT", conversion_factor: 1.0 }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { e1: $.data.error_id }
            - call: "POST /gpo/item-cross-references"
              payload: { member_id: "${m1}", contract_item_id: "${i1}", member_item_number: "MI-1", match_type: "EXACT", conversion_factor: 1.0 }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { x1: $.data.id, xs: $.data.status }
            - call: "POST /gpo/item-cross-references"
              payload: { member_id: "${m1}", contract_item_id: "${i1}", member_item_number: "MI-9", match_type: "SUBSTITUTE", conversion_factor: 1.0 }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { e3: $.data.error_id }
          assert:
            - "${s2} == DELISTED after the delist call, and GET /gpo/contract-items/${i2} still returns 200"
            - "${e1} == ERR_CONTRACT_ITEM_NOT_ACTIVE with HTTP 409 — a delisted item is present but unusable"
            - "the identical shape against the ACTIVE item returns 201 with ${xs} == PROPOSED"
            - "${e3} == ERR_MEMBER_ITEM_NOT_IN_MASTER — MI-9 is absent from Member.${m1}.item_master, and this check runs after the item-state check"

      - name: activation_window_outside_the_contract_term_is_rejected
