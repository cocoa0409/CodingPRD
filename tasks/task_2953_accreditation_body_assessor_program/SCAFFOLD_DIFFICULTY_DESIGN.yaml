  - rule_id: cross_entity_state_dependency
    instances:
      - name: team_confirm_requires_an_unexpired_granted_qualification
        entity_pair: "TeamAssignment depends on AssessorQualification"
        grounds:
          - state_machines.TeamAssignment.PROPOSED_to_CONFIRMED
          - state_machines.AssessorQualification.GRANTED_to_EXPIRED
          - validations.priority_11_ERR_QUALIFICATION_NOT_GRANTED
        distinguishing_aspect: |
          The TeamAssignment transition is gated on the state of a completely different entity, and
          the gate is evaluated lazily against the logical clock: the qualification is still stored as
          GRANTED with expires_on 2030-08-09, but at clock date 2030-08-10 the confirm request must
          first drive that qualification GRANTED -> EXPIRED, decrement the assessor's
          granted_qualification_count, and then reject itself with ERR_QUALIFICATION_NOT_GRANTED. The
          assignment and the application must be left untouched even though a different entity was
          mutated by the same request.
        test_recipe:
          setup:
            - "Clock 2026-08-10; one PUBLISHED scheme; one organization."
            - "One INTERNAL assessor with a GRANTED LEAD_ASSESSOR qualification (granted_on 2026-08-10, expires_on 2030-08-09) who has been screened, so qualification_status is QUALIFIED and impartiality_status is SCREENED."
            - "A PROPOSED LEAD_ASSESSOR TeamAssignment for that assessor on the organization's INITIAL cycle, which is therefore still SUBMITTED."
            - "The clock is then moved to 2030-08-10, one day past expires_on."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: SchemeManager
