          - validations[priority=11]
        distinguishing_aspect: |
          Listing a ticket that is already LISTED (not HELD) at an over-cap price violates the state
          precondition (priority 5) and the resale cap fiscal check (priority 11); ERR_INVALID_STATE
          wins — a state vs business_fiscal pairing distinct from the safety/constraint pair above.
        test_recipe:
          setup:
            - "Fan E holds a VALID ticket already LISTED at 11000 (cap is 21000); a second listing attempt is made at over-cap 99000."
          setup_api_calls:
