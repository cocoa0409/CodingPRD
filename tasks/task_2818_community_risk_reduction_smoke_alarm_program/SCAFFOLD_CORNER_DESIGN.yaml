              as: RiskAnalyst
              captures: { z2_id: $.data.id }
            - call: "POST /crr/households"
              payload: { zone_id: "${z_id}", address_line: "12 Birch Row", occupant_count: 2, sleeping_areas_count: 1, storeys: 1 }
              as: CanvassCoordinator
              captures: { hh_id: $.data.id }
            - call: "POST /crr/crews"
              payload: { crew_code: "CREW-B1", member_count: 2, certification_level: "ADVANCED", max_daily_minutes: 480 }
              as: ProgramAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /crr/partners"
              payload: { org_name: "Firesafe Trust", org_type: "NONPROFIT", contact_email: "grants@firesafe.example", agreement_signed: true }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /crr/grants"
              payload: { partner_id: "${p_id}", grant_code: "G-UNIT-1", authorized_cents: 500000, period_start_date: "2026-07-01", period_end_date: "2026-12-31", allowed_device_types: ["SMOKE_10YR"], unit_rate_cents_by_type: { SMOKE_10YR: 2195 }, reimbursement_basis: "UNIT_RATE", reimbursement_pct: 87.5, indirect_rate_pct: 12.5, match_pct: 20.0 }
              as: GrantOfficer
              captures: { g_id: $.data.id }
            - call: "POST /crr/zones/${z_id}/fire-incidents"
              payload: { incident_number: "INC-2026-0001", occurred_at: "2026-07-04T02:10:00Z", working_alarm_present: false, injuries: 1 }
              as: RiskAnalyst
              captures: { fi_id: $.data.id }
          trigger:
            - call: "POST /crr/crews"
              payload: { crew_code: "CREW-B1", member_count: 3, certification_level: "BASIC", max_daily_minutes: 300 }
              as: ProgramAdmin
              captures: { e_crew: $.data.error_id }
            - call: "POST /crr/grants"
              payload: { partner_id: "${p_id}", grant_code: "G-UNIT-1", authorized_cents: 100000, period_start_date: "2027-01-01", period_end_date: "2027-06-30", allowed_device_types: ["CO_ALARM"], unit_rate_cents_by_type: { CO_ALARM: 3495 }, reimbursement_basis: "ACTUAL_COST", reimbursement_pct: 90.0, indirect_rate_pct: 10.0, match_pct: 25.0 }
              as: GrantOfficer
              captures: { e_grant: $.data.error_id }
            - call: "POST /crr/zones/${z2_id}/fire-incidents"
              payload: { incident_number: "INC-2026-0001", occurred_at: "2026-07-09T04:00:00Z", working_alarm_present: true }
              as: RiskAnalyst
              captures: { e_incident: $.data.error_id }
            - call: "POST /crr/households"
              payload: { zone_id: "${z_id}", address_line: "12 Birch Row", occupant_count: 5, sleeping_areas_count: 3, storeys: 2 }
              as: CanvassCoordinator
              captures: { e_address: $.data.error_id }
            - call: "POST /crr/households"
              payload: { zone_id: "${z2_id}", address_line: "12 Birch Row", occupant_count: 5, sleeping_areas_count: 3, storeys: 2 }
              as: CanvassCoordinator
              captures: { ok_hh: $.data.id }
          assert:
            - "${e_crew} == ERR_CREW_CODE_TAKEN with status 409"
            - "${e_grant} == ERR_GRANT_CODE_TAKEN with status 409 (a non-overlapping period does not rescue a duplicate code)"
            - "${e_incident} == ERR_INCIDENT_NUMBER_TAKEN with status 409 (incident_number is global, not per zone)"
            - "${e_address} == ERR_DUPLICATE_HOUSEHOLD_ADDRESS with status 409"
            - "the control leg returns 201: Household.${ok_hh}.zone_id == ${z2_id} and Household.${ok_hh}.address_line == 12 Birch Row"
            - "GET /crr/households returns total_count 2 (the original plus the control)"
            - "GET /crr/grants returns total_count 1 and PartnerGrant.${g_id}.status == DRAFT"
            - "GET /crr/zones/${z_id}/fire-incidents returns total_count 1 and FireIncident.${fi_id}.incident_number == INC-2026-0001"
            - "GET /crr/zones/${z2_id}/fire-incidents returns total_count 0"
            - "Crew.${crew_id}.certification_level == ADVANCED (the rejected duplicate did not overwrite it)"

      - name: route_planned_for_an_unassessed_zone_returns_zone_not_targetable
        claim_type: error_triggerability
        excluded_because:
          difficulty_instance: route_creation_depends_on_riskzone_assessment_state
          rationale: "That §1.8 cross_entity_state_dependency instance already triggers ERR_ZONE_NOT_TARGETABLE on POST /crr/routes against an UNASSESSED zone and then succeeds on the same zone after assessment."

