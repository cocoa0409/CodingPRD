  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: vehicle_in_fleet_blocked_by_grandparent_plan_not_locked
        grounds:
          - state_machines[Vehicle.fleet_status]
          - state_machines[FleetPlan]
          - validations[priority 10 ERR_PLAN_NOT_LOCKED]
          - endpoints[POST /fleet/vehicles/{vehicle_id}/in-fleet]
        distinguishing_aspect: |
          The gate here is TWO levels up the ownership chain: in-fleeting a vehicle reads
          the FleetPlan behind the vehicle's PurchaseAllocation, and the vehicle's own
          parent allocation is in a perfectly permitted state (PARTIALLY_INFLEETED) when
          the call is refused. The blocking plan state is also produced by the system's own
          bubble-up cascade rather than by a client call, so an implementation that only
          checks the immediate parent, or that caches the plan status at allocation time,
          passes every local check and still must fail.
        test_recipe:
          setup:
            - "Plan P has planned_unit_count 3 and is LOCKED. Allocation A1 (2 units, created while posture was OPEN) and allocation A2 (2 units, created while fill_ratio_bp was 6666) both sit under it."
            - "Vehicles VA and VB belong to A1; vehicles VC and VD belong to A2."
            - "VA and VC are already IN_SERVICE, so A1 and A2 are both PARTIALLY_INFLEETED and the plan's in_fleeted_unit_count is 2, one short of planned_unit_count."
            - "VB has REGISTRATION and LICENSING COMPLETED and a PENDING PREPARATION task; completing it will push A1 to INFLEETED and the plan to CLOSED."
            - "VD is untouched in ON_ORDER under the still-PARTIALLY_INFLEETED A2, and ATL stays ACTIVE throughout, so no other precondition of in-fleet is violated."
            - "PREPARATION tasks are spread one per calendar date (VA 01-07, VB 01-08, VC 01-09) to stay inside ATL's prep_capacity_per_day of 2."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
