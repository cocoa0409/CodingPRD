# =============================================================================
# Task 1815 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: run_charge_estimate_vs_final
        grounds:
          - calculations.estimated_run_charge
          - calculations.final_run_charge
          - entities.ProductionRun.fields.estimated_charge_cents
          - entities.ProductionRun.fields.final_charge_cents
        distinguishing_aspect: |
          Same run data priced by two valid algorithms on the ProductionRun fiscal
          domain: the estimate variant bills max(planned_units, min_run) with planned
          packaging, the final variant bills max(actual_units, min_run) with actual
          packaging consumption; with planned 2000 and actual 1800 they diverge by
          exactly 84400 cents.
        test_recipe:
          setup:
            - "Customer c1 (credit 100000000, disposition CUSTOMER); ACIDIFIED formula f1 (allergen NONE, min_run 1000, rate 120) with pepper CUSTOMER_SUPPLIED 0.5/unit (5000 consigned) and vinegar COPACKER_SUPPLIED 0.8/unit @300; trial passed; letter rev1 (max_ph 4.2, max_aw 0.9) ACTIVE so f1 is APPROVED; kettle k1; bottle b1 @50 x100000; cap cp1 @12 x100000; label lab1 APPROVED"
            - "Run r1: planned 2000, 2026-09-10T08:00-16:00Z, requires 1 bottle + 1 cap per unit"
          setup_api_calls:
            - { call: "POST /copack/customers", payload: { brand_name: "Acme Foods", contact_email: "ops@acme.example", credit_limit_cents: 100000000, default_disposition_owner: "CUSTOMER" }, as: OpsAdmin, captures: { c1: "$.data.id"} }
            - { call: "POST /copack/formulas", payload: { customer_id: "${c1}", product_name: "Ghost Pepper Sauce", sku_code: "GPS-001", process_category: "ACIDIFIED", allergen_class: "NONE", min_run_units: 1000, unit_rate_cents: 120 }, as: OpsAdmin, captures: { f1: "$.data.id"} }
            - { call: "POST /copack/ingredient-supplies", payload: { formula_id: "${f1}", ingredient_name: "Ghost pepper mash", sourcing_mode: "CUSTOMER_SUPPLIED", quantity_per_unit: 0.5 }, as: OpsAdmin, captures: { s1: "$.data.id"} }
            - { call: "POST /copack/ingredient-supplies", payload: { formula_id: "${f1}", ingredient_name: "White vinegar", sourcing_mode: "COPACKER_SUPPLIED", quantity_per_unit: 0.8, unit_cost_cents: 300 }, as: OpsAdmin, captures: { s2: "$.data.id"} }
            - { call: "POST /copack/ingredient-supplies/${s1}/receive", payload: { quantity: 5000 }, as: OpsAdmin }
            - { call: "POST /copack/pilot-cells", payload: { cell_name: "Pilot-1", max_batch_units: 5000 }, as: OpsAdmin, captures: { pc1: "$.data.id"} }
            - { call: "POST /copack/scale-up-trials", payload: { formula_id: "${f1}", pilot_cell_id: "${pc1}", batch_size_units: 500, scheduled_start: "2026-09-01T08:00:00Z", scheduled_end: "2026-09-01T12:00:00Z" }, as: OpsAdmin, captures: { t1: "$.data.id"} }
            - { call: "POST /copack/scale-up-trials/${t1}/record-results", payload: { passed: true, yield_units: 480 }, as: OpsAdmin }
            - { call: "POST /copack/process-authority-letters", payload: { formula_id: "${f1}", formula_revision: 1, authority_name: "Dr. Rosa Kim", letter_number: "PAL-1001", max_ph: 4.2, max_water_activity: 0.9 }, as: ProcessAuthority, captures: { l1: "$.data.id"} }
            - { call: "POST /copack/process-authority-letters/${l1}/activate", payload: {}, as: ProcessAuthority }
            - { call: "POST /copack/kettle-lines", payload: { line_name: "Kettle-1", capacity_units: 100000 }, as: OpsAdmin, captures: { k1: "$.data.id"} }
            - { call: "POST /copack/packaging-components", payload: { component_name: "12oz woozy bottle", component_type: "BOTTLE", unit_cost_cents: 50, initial_on_hand_units: 100000 }, as: OpsAdmin, captures: { b1: "$.data.id"} }
            - { call: "POST /copack/packaging-components", payload: { component_name: "38mm cap", component_type: "CAP", unit_cost_cents: 12, initial_on_hand_units: 100000 }, as: OpsAdmin, captures: { cp1: "$.data.id"} }
            - { call: "POST /copack/label-approvals", payload: { formula_id: "${f1}", label_version: "v1", brand_display_name: "Acme", net_quantity_statement: "12 fl oz", allergen_declaration: "NONE" }, as: OpsAdmin, captures: { lab1: "$.data.id"} }
            - { call: "POST /copack/label-approvals/${lab1}/submit", payload: {}, as: OpsAdmin }
            - { call: "POST /copack/label-approvals/${lab1}/review", payload: { approved: true }, as: QAReviewer }
            - { call: "POST /copack/production-runs", payload: { formula_id: "${f1}", kettle_line_id: "${k1}", planned_units: 2000, scheduled_start: "2026-09-10T08:00:00Z", scheduled_end: "2026-09-10T16:00:00Z", packaging_requirements: [ { component_id: "${b1}", quantity_per_unit: 1 }, { component_id: "${cp1}", quantity_per_unit: 1 } ] }, as: OpsAdmin, captures: { r1: "$.data.id"} }
          trigger:
            - { call: "POST /copack/production-runs/${r1}/confirm", payload: {}, as: OpsAdmin }
            - { call: "GET /copack/production-runs/${r1}", payload: {}, as: OpsAdmin, captures: { est: "$.data.estimated_charge_cents"} }
            - { call: "POST /copack/production-runs/${r1}/complete", payload: { actual_units_produced: 1800, measured_ph: 4.1, measured_water_activity: 0.88 }, as: OpsAdmin }
            - { call: "GET /copack/production-runs/${r1}", payload: {}, as: OpsAdmin, captures: { fin: "$.data.final_charge_cents"} }
            - { call: "GET /copack/customers/${c1}", payload: {}, as: OpsAdmin, captures: { outstanding: "$.data.outstanding_billed_cents"} }
          assert:
            - "ProductionRun.${r1}.estimated_charge_cents == 859000  (2000*120 + 15000 + 0.8*2000*300 + 2000*50 + 2000*12)"
            - "ProductionRun.${r1}.final_charge_cents == 774600  (1800*120 + 15000 + 0.8*1800*300 + 1800*50 + 1800*12)"
            - "859000 - 774600 == 84400 divergence between variants on identical run"
            - "CustomerAccount.${c1}.outstanding_billed_cents == 774600 after complete replaces estimate"
            - "ProductionRun.${r1}.status == COMPLETED (4.1 <= 4.2 and 0.88 < 0.9: no auto-hold)"

      - name: hold_deviation_letter_vs_statutory
        grounds:
          - calculations.hold_deviation_metrics
          - entities.QualityHold.fields.letter_deviation
          - entities.QualityHold.fields.statutory_margin
        distinguishing_aspect: |
          On the QualityHold food-safety domain the same measured pH 4.5 feeds two
          valid metrics: letter_deviation = 4.5 - 4.2 = +0.30 against the contracted
          scheduled process, statutory_margin = 4.6 - 4.5 = +0.10 against the absolute
          ceiling — different value, different sign convention, different entity domain
          than the run-charge dual variant.
        test_recipe:
          setup:
            - "Chain A: customer c1, ACIDIFIED formula f1 (NONE, min 1000, rate 120) with supplies and 5000 consigned pepper, trial passed, letter rev1 (4.2 / 0.9) ACTIVE, kettle k1, bottle b1, cap cp1, label APPROVED; run r1 planned 2000 confirmed"
          setup_api_calls:
            - { call: "POST /copack/customers", payload: { brand_name: "Acme Foods", contact_email: "ops@acme.example", credit_limit_cents: 100000000, default_disposition_owner: "CUSTOMER" }, as: OpsAdmin, captures: { c1: "$.data.id"} }
            - { call: "POST /copack/formulas", payload: { customer_id: "${c1}", product_name: "Ghost Pepper Sauce", sku_code: "GPS-001", process_category: "ACIDIFIED", allergen_class: "NONE", min_run_units: 1000, unit_rate_cents: 120 }, as: OpsAdmin, captures: { f1: "$.data.id"} }
            - { call: "POST /copack/ingredient-supplies", payload: { formula_id: "${f1}", ingredient_name: "Ghost pepper mash", sourcing_mode: "CUSTOMER_SUPPLIED", quantity_per_unit: 0.5 }, as: OpsAdmin, captures: { s1: "$.data.id"} }
            - { call: "POST /copack/ingredient-supplies", payload: { formula_id: "${f1}", ingredient_name: "White vinegar", sourcing_mode: "COPACKER_SUPPLIED", quantity_per_unit: 0.8, unit_cost_cents: 300 }, as: OpsAdmin }
            - { call: "POST /copack/ingredient-supplies/${s1}/receive", payload: { quantity: 5000 }, as: OpsAdmin }
            - { call: "POST /copack/pilot-cells", payload: { cell_name: "Pilot-1", max_batch_units: 5000 }, as: OpsAdmin, captures: { pc1: "$.data.id"} }
            - { call: "POST /copack/scale-up-trials", payload: { formula_id: "${f1}", pilot_cell_id: "${pc1}", batch_size_units: 500, scheduled_start: "2026-09-01T08:00:00Z", scheduled_end: "2026-09-01T12:00:00Z" }, as: OpsAdmin, captures: { t1: "$.data.id"} }
            - { call: "POST /copack/scale-up-trials/${t1}/record-results", payload: { passed: true, yield_units: 480 }, as: OpsAdmin }
            - { call: "POST /copack/process-authority-letters", payload: { formula_id: "${f1}", formula_revision: 1, authority_name: "Dr. Rosa Kim", letter_number: "PAL-1001", max_ph: 4.2, max_water_activity: 0.9 }, as: ProcessAuthority, captures: { l1: "$.data.id"} }
            - { call: "POST /copack/process-authority-letters/${l1}/activate", payload: {}, as: ProcessAuthority }
            - { call: "POST /copack/kettle-lines", payload: { line_name: "Kettle-1", capacity_units: 100000 }, as: OpsAdmin, captures: { k1: "$.data.id"} }
            - { call: "POST /copack/packaging-components", payload: { component_name: "12oz woozy bottle", component_type: "BOTTLE", unit_cost_cents: 50, initial_on_hand_units: 100000 }, as: OpsAdmin, captures: { b1: "$.data.id"} }
            - { call: "POST /copack/packaging-components", payload: { component_name: "38mm cap", component_type: "CAP", unit_cost_cents: 12, initial_on_hand_units: 100000 }, as: OpsAdmin, captures: { cp1: "$.data.id"} }
            - { call: "POST /copack/production-runs", payload: { formula_id: "${f1}", kettle_line_id: "${k1}", planned_units: 2000, scheduled_start: "2026-09-10T08:00:00Z", scheduled_end: "2026-09-10T16:00:00Z", packaging_requirements: [ { component_id: "${b1}", quantity_per_unit: 1 }, { component_id: "${cp1}", quantity_per_unit: 1 } ] }, as: OpsAdmin, captures: { r1: "$.data.id"} }
            - { call: "POST /copack/production-runs/${r1}/confirm", payload: {}, as: OpsAdmin }
          trigger:
            - { call: "POST /copack/production-runs/${r1}/complete", payload: { actual_units_produced: 2000, measured_ph: 4.5, measured_water_activity: 0.88 }, as: OpsAdmin }
            - { call: "GET /copack/quality-holds", payload: { production_run_id: "${r1}" }, as: QAReviewer, captures: { h_dev: "$.data[0].letter_deviation", h_margin: "$.data[0].statutory_margin", h_reason: "$.data[0].reason_category"} }
            - { call: "GET /copack/production-runs/${r1}", payload: {}, as: OpsAdmin, captures: { r_status: "$.data.status"} }
          assert:
            - "auto-created QualityHold.reason_category == PH_DEVIATION (4.5 > 4.2 letter limit)"
            - "QualityHold.letter_deviation == 0.3 (measured_ph - letter.max_ph, round_half_up 2dp)"
            - "QualityHold.statutory_margin == 0.1 (4.6 - measured_ph)"
            - "QualityHold.disposition_owner == CUSTOMER (copied from customer default)"
            - "ProductionRun.${r1}.status == ON_HOLD"

  - rule_id: combinatorial_formula
    instances:
      - name: changeover_fee_allergen_conditional
        grounds:
          - calculations.changeover_fee
          - entities.ProductionRun.fields.changeover_fee_cents
        distinguishing_aspect: |
          Mode (a) combinatorial formula: >= 3 inputs (predecessor selector over
          occupancy states and window ends, both formulas' allergen_class, fee branch)
          with non-linear interaction — a state-filtered argmax predecessor lookup
          whose allergen comparison flips the fee between 15000 and 75000.
        test_recipe:
          setup:
            - "Customer c1 credit 100000000; formula fN (ACID, allergen NUT, min 500, rate 200, salt COPACKER 0.1/unit @50) auto-APPROVED via passed trial; ACIDIFIED formula f1 (NONE, min 1000, rate 120, pepper consigned 5000, vinegar 0.8 @300) APPROVED via letter rev1 (4.2/0.9); kettle k1; bottle b1 @50 x100000"
            - "Run rN on k1: fN, planned 1000, 2026-09-10T06:00-10:00Z, no packaging — confirmed first"
            - "Run rA on k1: f1, planned 2000, 2026-09-10T14:00-18:00Z (gap exactly 4h), 1 bottle/unit"
          setup_api_calls:
            - { call: "POST /copack/customers", payload: { brand_name: "Acme Foods", contact_email: "ops@acme.example", credit_limit_cents: 100000000, default_disposition_owner: "CUSTOMER" }, as: OpsAdmin, captures: { c1: "$.data.id"} }
            - { call: "POST /copack/formulas", payload: { customer_id: "${c1}", product_name: "Nut Pesto", sku_code: "NP-001", process_category: "ACID", allergen_class: "NUT", min_run_units: 500, unit_rate_cents: 200 }, as: OpsAdmin, captures: { fN: "$.data.id"} }
            - { call: "POST /copack/ingredient-supplies", payload: { formula_id: "${fN}", ingredient_name: "Sea salt", sourcing_mode: "COPACKER_SUPPLIED", quantity_per_unit: 0.1, unit_cost_cents: 50 }, as: OpsAdmin }
            - { call: "POST /copack/pilot-cells", payload: { cell_name: "Pilot-1", max_batch_units: 5000 }, as: OpsAdmin, captures: { pc1: "$.data.id"} }
            - { call: "POST /copack/scale-up-trials", payload: { formula_id: "${fN}", pilot_cell_id: "${pc1}", batch_size_units: 300, scheduled_start: "2026-09-02T08:00:00Z", scheduled_end: "2026-09-02T10:00:00Z" }, as: OpsAdmin, captures: { tN: "$.data.id"} }
            - { call: "POST /copack/scale-up-trials/${tN}/record-results", payload: { passed: true, yield_units: 290 }, as: OpsAdmin }
            - { call: "POST /copack/formulas", payload: { customer_id: "${c1}", product_name: "Ghost Pepper Sauce", sku_code: "GPS-001", process_category: "ACIDIFIED", allergen_class: "NONE", min_run_units: 1000, unit_rate_cents: 120 }, as: OpsAdmin, captures: { f1: "$.data.id"} }
            - { call: "POST /copack/ingredient-supplies", payload: { formula_id: "${f1}", ingredient_name: "Ghost pepper mash", sourcing_mode: "CUSTOMER_SUPPLIED", quantity_per_unit: 0.5 }, as: OpsAdmin, captures: { s1: "$.data.id"} }
            - { call: "POST /copack/ingredient-supplies", payload: { formula_id: "${f1}", ingredient_name: "White vinegar", sourcing_mode: "COPACKER_SUPPLIED", quantity_per_unit: 0.8, unit_cost_cents: 300 }, as: OpsAdmin }
            - { call: "POST /copack/ingredient-supplies/${s1}/receive", payload: { quantity: 5000 }, as: OpsAdmin }
            - { call: "POST /copack/scale-up-trials", payload: { formula_id: "${f1}", pilot_cell_id: "${pc1}", batch_size_units: 500, scheduled_start: "2026-09-01T08:00:00Z", scheduled_end: "2026-09-01T12:00:00Z" }, as: OpsAdmin, captures: { t1: "$.data.id"} }
            - { call: "POST /copack/scale-up-trials/${t1}/record-results", payload: { passed: true, yield_units: 480 }, as: OpsAdmin }
            - { call: "POST /copack/process-authority-letters", payload: { formula_id: "${f1}", formula_revision: 1, authority_name: "Dr. Rosa Kim", letter_number: "PAL-1001", max_ph: 4.2, max_water_activity: 0.9 }, as: ProcessAuthority, captures: { l1: "$.data.id"} }
            - { call: "POST /copack/process-authority-letters/${l1}/activate", payload: {}, as: ProcessAuthority }
            - { call: "POST /copack/kettle-lines", payload: { line_name: "Kettle-1", capacity_units: 100000 }, as: OpsAdmin, captures: { k1: "$.data.id"} }
            - { call: "POST /copack/packaging-components", payload: { component_name: "12oz woozy bottle", component_type: "BOTTLE", unit_cost_cents: 50, initial_on_hand_units: 100000 }, as: OpsAdmin, captures: { b1: "$.data.id"} }
            - { call: "POST /copack/production-runs", payload: { formula_id: "${fN}", kettle_line_id: "${k1}", planned_units: 1000, scheduled_start: "2026-09-10T06:00:00Z", scheduled_end: "2026-09-10T10:00:00Z", packaging_requirements: [] }, as: OpsAdmin, captures: { rN: "$.data.id"} }
            - { call: "POST /copack/production-runs/${rN}/confirm", payload: {}, as: OpsAdmin }
            - { call: "POST /copack/production-runs", payload: { formula_id: "${f1}", kettle_line_id: "${k1}", planned_units: 2000, scheduled_start: "2026-09-10T14:00:00Z", scheduled_end: "2026-09-10T18:00:00Z", packaging_requirements: [ { component_id: "${b1}", quantity_per_unit: 1 } ] }, as: OpsAdmin, captures: { rA: "$.data.id"} }
          trigger:
            - { call: "POST /copack/production-runs/${rA}/confirm", payload: {}, as: OpsAdmin }
            - { call: "GET /copack/production-runs/${rN}", payload: {}, as: OpsAdmin, captures: { fee_n: "$.data.changeover_fee_cents"} }
            - { call: "GET /copack/production-runs/${rA}", payload: {}, as: OpsAdmin, captures: { fee_a: "$.data.changeover_fee_cents", est_a: "$.data.estimated_charge_cents"} }
          assert:
            - "ProductionRun.${rN}.changeover_fee_cents == 15000 (no predecessor: candidate set empty -> STANDARD)"
            - "ProductionRun.${rA}.changeover_fee_cents == 75000 (predecessor rN ends 10:00 <= 14:00; NUT != NONE -> allergen switch)"
            - "ProductionRun.${rA}.estimated_charge_cents == 895000 (2000*120 + 75000 + 0.8*2000*300 + 2000*50)"
            - "ProductionRun.${rA}.status == CONFIRMED (4h gap satisfies the 4h allergen buffer)"

      - name: per_line_rounding_then_sum_order
        grounds:
          - calculations.estimated_run_charge
        distinguishing_aspect: |
          Mode (b) combinatorial formula: nested rounding order is pinned —
          round_half_up each extended ingredient line to whole cents, THEN sum. Two
          lines at 0.05 * 10 * 5 = 2.5 cents each round to 3 + 3 = 6; the forbidden
          sum-then-round order yields round(5.0) = 5 — a one-cent observable delta.
        test_recipe:
          setup:
            - "Customer cR credit 100000000; formula fR (ACID, NONE, min_run 10, rate 0) with two COPACKER_SUPPLIED lines u1,u2 each 0.05/unit @5 cents; trial passed (auto-APPROVED, ACID); kettle k1"
            - "Run rR: planned 10, no packaging requirements"
          setup_api_calls:
            - { call: "POST /copack/customers", payload: { brand_name: "Round Co", contact_email: "r@x.example", credit_limit_cents: 100000000 }, as: OpsAdmin, captures: { cR: "$.data.id"} }
            - { call: "POST /copack/formulas", payload: { customer_id: "${cR}", product_name: "Rounding Sauce", sku_code: "RS-001", process_category: "ACID", allergen_class: "NONE", min_run_units: 10, unit_rate_cents: 0 }, as: OpsAdmin, captures: { fR: "$.data.id"} }
            - { call: "POST /copack/ingredient-supplies", payload: { formula_id: "${fR}", ingredient_name: "Spice A", sourcing_mode: "COPACKER_SUPPLIED", quantity_per_unit: 0.05, unit_cost_cents: 5 }, as: OpsAdmin, captures: { u1: "$.data.id"} }
            - { call: "POST /copack/ingredient-supplies", payload: { formula_id: "${fR}", ingredient_name: "Spice B", sourcing_mode: "COPACKER_SUPPLIED", quantity_per_unit: 0.05, unit_cost_cents: 5 }, as: OpsAdmin, captures: { u2: "$.data.id"} }
            - { call: "POST /copack/pilot-cells", payload: { cell_name: "Pilot-1", max_batch_units: 5000 }, as: OpsAdmin, captures: { pc1: "$.data.id"} }
            - { call: "POST /copack/scale-up-trials", payload: { formula_id: "${fR}", pilot_cell_id: "${pc1}", batch_size_units: 10, scheduled_start: "2026-09-01T08:00:00Z", scheduled_end: "2026-09-01T09:00:00Z" }, as: OpsAdmin, captures: { tR: "$.data.id"} }
            - { call: "POST /copack/scale-up-trials/${tR}/record-results", payload: { passed: true, yield_units: 10 }, as: OpsAdmin }
            - { call: "POST /copack/kettle-lines", payload: { line_name: "Kettle-1", capacity_units: 100000 }, as: OpsAdmin, captures: { k1: "$.data.id"} }
            - { call: "POST /copack/production-runs", payload: { formula_id: "${fR}", kettle_line_id: "${k1}", planned_units: 10, scheduled_start: "2026-09-10T08:00:00Z", scheduled_end: "2026-09-10T09:00:00Z", packaging_requirements: [] }, as: OpsAdmin, captures: { rR: "$.data.id"} }
          trigger:
            - { call: "POST /copack/production-runs/${rR}/confirm", payload: {}, as: OpsAdmin }
            - { call: "GET /copack/production-runs/${rR}", payload: {}, as: OpsAdmin, captures: { est: "$.data.estimated_charge_cents"} }
          assert:
            - "ProductionRun.${rR}.estimated_charge_cents == 15006 (base 0 + changeover 15000 + round(2.5)=3 + round(2.5)=3)"
            - "sum-then-round order would yield 15005; pinned per-line order yields 15006"

  - rule_id: non_linear_state_machine
    instances:
      - name: formula_trial_failure_revision_loop
        grounds:
          - state_machines.Formula.DRAFT_to_IN_TRIAL
          - state_machines.Formula.IN_TRIAL_to_DRAFT
          - state_machines.Formula.IN_TRIAL_to_TRIAL_PASSED
        distinguishing_aspect: |
          Cyclic machine on Formula: DRAFT -> IN_TRIAL -> DRAFT on trial failure,
          then DRAFT -> IN_TRIAL -> TRIAL_PASSED on retrial; the loop leaves
          revision unchanged (still 1) — only reformulate bumps revision.
        test_recipe:
          setup:
            - "Customer c1; ACIDIFIED formula f1 (NONE, min 1000, rate 120); pilot cell pc1; first trial t1 will fail, second trial t2 passes"
          setup_api_calls:
            - { call: "POST /copack/customers", payload: { brand_name: "Acme Foods", contact_email: "ops@acme.example", credit_limit_cents: 100000000 }, as: OpsAdmin, captures: { c1: "$.data.id"} }
            - { call: "POST /copack/formulas", payload: { customer_id: "${c1}", product_name: "Ghost Pepper Sauce", sku_code: "GPS-001", process_category: "ACIDIFIED", allergen_class: "NONE", min_run_units: 1000, unit_rate_cents: 120 }, as: OpsAdmin, captures: { f1: "$.data.id"} }
            - { call: "POST /copack/pilot-cells", payload: { cell_name: "Pilot-1", max_batch_units: 5000 }, as: OpsAdmin, captures: { pc1: "$.data.id"} }
            - { call: "POST /copack/scale-up-trials", payload: { formula_id: "${f1}", pilot_cell_id: "${pc1}", batch_size_units: 500, scheduled_start: "2026-09-01T08:00:00Z", scheduled_end: "2026-09-01T12:00:00Z" }, as: OpsAdmin, captures: { t1: "$.data.id"} }
            - { call: "POST /copack/scale-up-trials/${t1}/record-results", payload: { passed: false, yield_units: 0 }, as: OpsAdmin }
            - { call: "GET /copack/formulas/${f1}", payload: {}, as: OpsAdmin, captures: { st_mid: "$.data.status", rev_mid: "$.data.revision"} }
            - { call: "POST /copack/scale-up-trials", payload: { formula_id: "${f1}", pilot_cell_id: "${pc1}", batch_size_units: 500, scheduled_start: "2026-09-02T08:00:00Z", scheduled_end: "2026-09-02T12:00:00Z" }, as: OpsAdmin, captures: { t2: "$.data.id"} }
          trigger:
            - { call: "POST /copack/scale-up-trials/${t2}/record-results", payload: { passed: true, yield_units: 450 }, as: OpsAdmin }
            - { call: "GET /copack/formulas/${f1}", payload: {}, as: OpsAdmin, captures: { st_end: "$.data.status", rev_end: "$.data.revision"} }
          assert:
            - "ScaleUpTrial.${t1}.status == FAILED"
            - "Formula.${f1}.status == DRAFT after trial failure (loop back)"
            - "Formula.${f1}.revision == 1 after the failure loop (revision untouched)"
            - "Formula.${f1}.status == TRIAL_PASSED after retrial passes (ACIDIFIED still needs a letter)"
            - "ScaleUpTrial.${t2}.status == PASSED"

      - name: run_hold_rework_cycle
        grounds:
          - state_machines.ProductionRun.COMPLETED_to_ON_HOLD
