scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_customer_applies_declared_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Customer.fields.kyc_tier
          - entities.Customer.fields.watchlist_hit
          - entities.Customer.fields.preservation_hold_active
        distinguishing_aspect: "A Customer created with only legal_name and tin_last4 comes back 201 with kyc_tier TIER_2, watchlist_hit false, preservation_hold_active false, open_fraud_case_count 0, version 1 and a bare UUID id carrying no type prefix."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /deposit-fraud/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsAdmin
              as_user_id: "ops-1"
          trigger:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Minimal Depositor", tin_last4: "0001" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_min: "$.data.id", tier_min: "$.data.kyc_tier", watch_min: "$.data.watchlist_hit", ver_min: "$.data.version" }
          assert:
            - "HTTP status is 201"
            - "${tier_min} == TIER_2"
            - "${watch_min} == false"
            - "${ver_min} == 1"
            - "${cust_min} matches the bare UUID form 8-4-4-4-12 with no prefix before the first hyphen group"
            - "GET /deposit-fraud/customers/${cust_min} returns preservation_hold_active == false and open_fraud_case_count == 0"

      - name: create_customer_without_legal_name_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=10]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required legal_name from POST /deposit-fraud/customers returns 400 ERR_INVALID_REQUEST and persists nothing."
        test_recipe:
          setup:
            - "Empty database, logical clock at its default."
          setup_api_calls:
            - call: "POST /deposit-fraud/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsAdmin
              as_user_id: "ops-1"
          trigger:
            - call: "POST /deposit-fraud/customers"
              payload: { tin_last4: "0002" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { err_missing_name: "$.data.error_id" }
          assert:
            - "${err_missing_name} == ERR_INVALID_REQUEST with HTTP 400"
            - "The response envelope has response_type == error and data carries both error_id and message"

      - name: unknown_ids_on_every_path_collection_return_their_own_not_found_error
        claim_type: Not Found
        grounds:
          - validations[priority=5]
          - errors[ERR_CUSTOMER_NOT_FOUND]
          - errors[ERR_ACCOUNT_NOT_FOUND]
          - errors[ERR_FUNDING_SOURCE_NOT_FOUND]
          - errors[ERR_DEPOSIT_ITEM_NOT_FOUND]
          - errors[ERR_CHECK_HOLD_NOT_FOUND]
          - errors[ERR_REVIEW_NOT_FOUND]
          - errors[ERR_FRAUD_CASE_NOT_FOUND]
          - errors[ERR_CHARGE_OFF_NOT_FOUND]
          - errors[ERR_SUBPOENA_NOT_FOUND]
          - errors[ERR_BSA_REFERRAL_NOT_FOUND]
        distinguishing_aspect: "Each collection reports its OWN 404 code for an unknown path id rather than a shared generic not-found error."
        test_recipe:
          setup:
            - "Empty database, logical clock at its default. Every id below is a syntactically valid UUID that matches no stored row."
          setup_api_calls:
            - call: "POST /deposit-fraud/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsAdmin
              as_user_id: "ops-1"
          trigger:
            - call: "GET /deposit-fraud/customers/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { e_cust: "$.data.error_id" }
            - call: "GET /deposit-fraud/accounts/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { e_acct: "$.data.error_id" }
            - call: "POST /deposit-fraud/funding-sources/33333333-3333-4333-8333-333333333333/resend"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { e_fs: "$.data.error_id" }
            - call: "GET /deposit-fraud/deposit-items/44444444-4444-4444-8444-444444444444"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { e_item: "$.data.error_id" }
            - call: "GET /deposit-fraud/check-holds/55555555-5555-4555-8555-555555555555"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { e_hold: "$.data.error_id" }
            - call: "GET /deposit-fraud/hold-override-reviews/66666666-6666-4666-8666-666666666666"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { e_rev: "$.data.error_id" }
            - call: "GET /deposit-fraud/fraud-cases/77777777-7777-4777-8777-777777777777"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { e_case: "$.data.error_id" }
            - call: "GET /deposit-fraud/charge-offs/88888888-8888-4888-8888-888888888888"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { e_co: "$.data.error_id" }
            - call: "GET /deposit-fraud/subpoenas/99999999-9999-4999-8999-999999999999"
              payload: {}
              as: LegalCounsel
              as_user_id: "counsel-1"
              captures: { e_sub: "$.data.error_id" }
            - call: "POST /deposit-fraud/bsa-referrals/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa/submit"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { e_ref: "$.data.error_id" }
          assert:
            - "${e_cust} == ERR_CUSTOMER_NOT_FOUND with HTTP 404"
            - "${e_acct} == ERR_ACCOUNT_NOT_FOUND with HTTP 404"
            - "${e_fs} == ERR_FUNDING_SOURCE_NOT_FOUND with HTTP 404"
            - "${e_item} == ERR_DEPOSIT_ITEM_NOT_FOUND with HTTP 404"
            - "${e_hold} == ERR_CHECK_HOLD_NOT_FOUND with HTTP 404"
            - "${e_rev} == ERR_REVIEW_NOT_FOUND with HTTP 404"
            - "${e_case} == ERR_FRAUD_CASE_NOT_FOUND with HTTP 404"
            - "${e_co} == ERR_CHARGE_OFF_NOT_FOUND with HTTP 404"
            - "${e_sub} == ERR_SUBPOENA_NOT_FOUND with HTTP 404"
            - "${e_ref} == ERR_BSA_REFERRAL_NOT_FOUND with HTTP 404"

      - name: create_account_with_unrecognised_customer_id_returns_customer_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=12]
          - errors[ERR_CUSTOMER_NOT_FOUND]
          - entities.DepositAccount.fields.customer_id
        distinguishing_aspect: "Body-borne foreign keys are validated as strictly as path ids: an unknown customer_id on POST /deposit-fraud/accounts returns 404 ERR_CUSTOMER_NOT_FOUND, not 400."
        test_recipe:
          setup:
            - "Empty database, logical clock at its default."
          setup_api_calls:
            - call: "POST /deposit-fraud/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsAdmin
              as_user_id: "ops-1"
          trigger:
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { err_parent: "$.data.error_id" }
          assert:
            - "${err_parent} == ERR_CUSTOMER_NOT_FOUND with HTTP 404"

      - name: deposit_account_lifecycle_and_balance_inputs_are_ignored_input_ignored
        claim_type: System Fields
        grounds:
          - entities.DepositAccount.fields.lifecycle_status
          - entities.DepositAccount.fields.ledger_balance_cents
          - entities.DepositAccount.fields.risk_score
        distinguishing_aspect: "System- and computed-source fields supplied by the client on POST /deposit-fraud/accounts are ignored: the account still comes back PENDING_FUNDING with ledger_balance_cents 0 and a server-computed risk_score."
        test_recipe:
          setup:
            - "One Customer with kyc_tier TIER_2 and watchlist_hit false."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Ignored Fields Depositor", tin_last4: "0003", kyc_tier: "TIER_2", watchlist_hit: false }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_ign: "$.data.id" }
          trigger:
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_ign}", product_type: "CHECKING", open_channel: "BRANCH", lifecycle_status: "ACTIVE", ledger_balance_cents: 999999, risk_score: 1 }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_ign: "$.data.id", life_ign: "$.data.lifecycle_status", ledger_ign: "$.data.ledger_balance_cents", score_ign: "$.data.risk_score" }
          assert:
            - "${life_ign} == PENDING_FUNDING"
            - "${ledger_ign} == 0"
            - "${score_ign} == 45, the PROVISIONAL_AT_OPEN value for TIER_2 (15) plus funding NONE (30) plus BRANCH (0)"
            - "GET /deposit-fraud/accounts/${acct_ign} returns risk_band == ELEVATED and version == 1"

      - name: account_link_confidence_out_of_range_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - validations[priority=10]
          - entities.AccountLink.fields.confidence_bps
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "confidence_bps is constrained to 0..10000; a value of 10001 returns 400 ERR_INVALID_REQUEST and creates no AccountLink."
        test_recipe:
          setup:
            - "One Customer with two DepositAccounts."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Range Check Depositor", tin_last4: "0004" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_rng: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_rng}", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_rng1: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_rng}", product_type: "SAVINGS", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_rng2: "$.data.id" }
          trigger:
            - call: "POST /deposit-fraud/account-links"
              payload: { from_account_id: "${acct_rng1}", to_account_id: "${acct_rng2}", link_type: "SHARED_DEVICE", confidence_bps: 10001 }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { err_range: "$.data.error_id" }
          assert:
            - "${err_range} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /deposit-fraud/accounts/${acct_rng1}/links returns total_count == 0"

      - name: customer_accounts_listing_paginates_with_limit_and_offset
        claim_type: Listing
        grounds:
          - entities.DepositAccount.fields.customer_id
          - entities.Customer.fields.legal_name
        distinguishing_aspect: "GET /deposit-fraud/customers/{id}/accounts honours limit and offset and reports total_count 3 with has_more true on the first page of size 2."
        test_recipe:
          setup:
            - "One Customer owning exactly three DepositAccounts, all still PENDING_FUNDING."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Paginated Depositor", tin_last4: "0005" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_pag: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_pag}", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_pag}", product_type: "SAVINGS", open_channel: "ONLINE" }
              as: OperationsAdmin
              as_user_id: "ops-1"
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_pag}", product_type: "MONEY_MARKET", open_channel: "MOBILE" }
              as: OperationsAdmin
              as_user_id: "ops-1"
          trigger:
            - call: "GET /deposit-fraud/customers/${cust_pag}/accounts"
              payload: { limit: 2, offset: 0 }
              as: FraudAnalyst
              as_user_id: "analyst-1"
            - call: "GET /deposit-fraud/customers/${cust_pag}/accounts"
              payload: { limit: 2, offset: 2 }
              as: FraudAnalyst
              as_user_id: "analyst-1"
            - call: "GET /deposit-fraud/customers/${cust_pag}/accounts"
              payload: { lifecycle_status: "ACTIVE" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
          assert:
            - "The first page returns 2 items with total_count == 3 and has_more == true"
            - "The second page returns 1 item with total_count == 3 and has_more == false"
            - "The lifecycle_status == ACTIVE filter returns total_count == 0 and an empty data array"

      - name: deposit_item_computed_credit_split_and_account_held_amount_agree
        claim_type: Computed Fields
        grounds:
          - entities.DepositItem.fields.immediate_credit_cents
          - entities.DepositItem.fields.held_cents
          - entities.DepositAccount.fields.held_amount_cents
          - calculations.check_hold_schedule
        distinguishing_aspect: "For a 30000-cent CHECK the computed split is immediate_credit_cents 22500 and held_cents 7500, and the account's computed held_amount_cents equals the sum over ACTIVE holds, namely 7500."
        test_recipe:
          setup:
            - "One ACTIVE DepositAccount at the default clock."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Split Depositor", tin_last4: "0006" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_split: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_split}", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_split: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_split}/funding-sources"
              payload: { source_type: "EXTERNAL_ACH", routing_last4: "1001" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { fs_split: "$.data.id", md_split: "$.data.micro_deposit_cents" }
            - call: "POST /deposit-fraud/funding-sources/${fs_split}/verification-attempts"
              payload: { micro_deposit_cents: "${md_split}" }
              as: OperationsAdmin
              as_user_id: "ops-1"
          trigger:
            - call: "POST /deposit-fraud/accounts/${acct_split}/deposit-items"
              payload: { item_type: "CHECK", amount_cents: 30000 }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { item_split: "$.data.id", imm_split: "$.data.immediate_credit_cents", held_split: "$.data.held_cents", status_split: "$.data.status" }
          assert:
            - "${imm_split} == 22500"
            - "${held_split} == 7500"
            - "${status_split} == PENDING"
            - "GET /deposit-fraud/deposit-items/${item_split} returns settled_at == null and return_reason == null"
            - "GET /deposit-fraud/accounts/${acct_split} returns held_amount_cents == 7500, ledger_balance_cents == 30000 and available_balance_cents == 22500"
            - "GET /deposit-fraud/deposit-items/${item_split}/holds returns exactly one CheckHold with status ACTIVE and held_amount_cents == 7500"

  # =========================================================================
  # State machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: funding_source_is_micro_deposit_sent_on_creation_never_observably_declared
        claim_type: Initial State
        grounds:
          - state_machines.FundingSource.DECLARED_to_MICRO_DEPOSIT_SENT
          - entities.FundingSource.fields.verification_status
          - entities.FundingSource.fields.micro_deposit_cents
        distinguishing_aspect: "The DECLARED -> MICRO_DEPOSIT_SENT auto-transition fires inside the creation request, so the 201 body already reads MICRO_DEPOSIT_SENT with attempt_count 0 and a minted micro_deposit_cents between 1 and 99."
        test_recipe:
          setup:
            - "One Customer and one PENDING_FUNDING DepositAccount."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Auto Transition Depositor", tin_last4: "0007" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_auto: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_auto}", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_auto: "$.data.id" }
          trigger:
            - call: "POST /deposit-fraud/accounts/${acct_auto}/funding-sources"
              payload: { source_type: "EXTERNAL_ACH", routing_last4: "1002" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { fs_auto: "$.data.id", vs_auto: "$.data.verification_status", md_auto: "$.data.micro_deposit_cents", att_auto: "$.data.attempt_count" }
          assert:
            - "${vs_auto} == MICRO_DEPOSIT_SENT"
            - "${att_auto} == 0"
            - "${md_auto} is an integer with 1 <= value <= 99"
            - "GET /deposit-fraud/accounts/${acct_auto}/funding-sources returns exactly one row whose verification_status is MICRO_DEPOSIT_SENT and total_attempt_count == 0"
            - "GET /deposit-fraud/accounts/${acct_auto} returns lifecycle_status == PENDING_FUNDING and risk_score == 35, the REFRESHED score with funding_state PENDING"

      - name: funding_source_resend_loops_back_to_micro_deposit_sent_with_a_fresh_secret
        claim_type: cyclic
        grounds:
          - state_machines.FundingSource.MICRO_DEPOSIT_SENT_to_FAILED_ATTEMPT
          - state_machines.FundingSource.FAILED_ATTEMPT_to_MICRO_DEPOSIT_SENT
          - entities.FundingSource.fields.attempt_count
          - entities.FundingSource.fields.total_attempt_count
        distinguishing_aspect: "The retry loop MICRO_DEPOSIT_SENT -> FAILED_ATTEMPT -> MICRO_DEPOSIT_SENT resets attempt_count to 0 while leaving total_attempt_count at 1, and the newly minted secret verifies the source and activates the account."
        test_recipe:
          setup:
            - "One PENDING_FUNDING DepositAccount with one FundingSource in MICRO_DEPOSIT_SENT."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Retry Loop Depositor", tin_last4: "0008" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_retry: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_retry}", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_retry: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_retry}/funding-sources"
              payload: { source_type: "EXTERNAL_ACH", routing_last4: "1003" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { fs_retry: "$.data.id" }
          trigger:
            - call: "POST /deposit-fraud/funding-sources/${fs_retry}/verification-attempts"
              payload: { micro_deposit_cents: 0 }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { vs_failed: "$.data.verification_status", att_failed: "$.data.attempt_count", tot_failed: "$.data.total_attempt_count" }
            - call: "POST /deposit-fraud/funding-sources/${fs_retry}/resend"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { vs_resent: "$.data.verification_status", att_resent: "$.data.attempt_count", tot_resent: "$.data.total_attempt_count", md_resent: "$.data.micro_deposit_cents" }
            - call: "POST /deposit-fraud/funding-sources/${fs_retry}/verification-attempts"
              payload: { micro_deposit_cents: "${md_resent}" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { vs_verified: "$.data.verification_status" }
          assert:
            - "${vs_failed} == FAILED_ATTEMPT and the HTTP status is 200, not an error status"
            - "${att_failed} == 1 and ${tot_failed} == 1"
            - "${vs_resent} == MICRO_DEPOSIT_SENT"
            - "${att_resent} == 0 and ${tot_resent} == 1"
            - "${vs_verified} == VERIFIED"
            - "GET /deposit-fraud/accounts/${acct_retry} returns lifecycle_status == ACTIVE, risk_score == 15, risk_band == STANDARD and risk_score_basis == REFRESHED"

      - name: funding_source_blocks_after_the_lifetime_attempt_budget_is_exhausted
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.FundingSource.FAILED_ATTEMPT_to_BLOCKED
          - validations[priority=40]
          - errors[ERR_FUNDING_INVALID_STATE]
        distinguishing_aspect: "The fifth mismatched attempt drives verification_status to BLOCKED because total_attempt_count + 1 reaches FUNDING_MAX_TOTAL_ATTEMPTS 5, and every further attempt or resend returns 409 ERR_FUNDING_INVALID_STATE."
        test_recipe:
          setup:
            - "One PENDING_FUNDING DepositAccount with one FundingSource in MICRO_DEPOSIT_SENT and total_attempt_count 0."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Blocked Funding Depositor", tin_last4: "0009" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_blk: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_blk}", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_blk: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_blk}/funding-sources"
              payload: { source_type: "EXTERNAL_ACH", routing_last4: "1004" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { fs_blk: "$.data.id" }
            - call: "POST /deposit-fraud/funding-sources/${fs_blk}/verification-attempts"
              payload: { micro_deposit_cents: 0 }
              as: OperationsAdmin
              as_user_id: "ops-1"
            - call: "POST /deposit-fraud/funding-sources/${fs_blk}/verification-attempts"
              payload: { micro_deposit_cents: 0 }
              as: OperationsAdmin
              as_user_id: "ops-1"
            - call: "POST /deposit-fraud/funding-sources/${fs_blk}/verification-attempts"
              payload: { micro_deposit_cents: 0 }
              as: OperationsAdmin
              as_user_id: "ops-1"
            - call: "POST /deposit-fraud/funding-sources/${fs_blk}/verification-attempts"
              payload: { micro_deposit_cents: 0 }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { vs_fourth: "$.data.verification_status", tot_fourth: "$.data.total_attempt_count" }
          trigger:
