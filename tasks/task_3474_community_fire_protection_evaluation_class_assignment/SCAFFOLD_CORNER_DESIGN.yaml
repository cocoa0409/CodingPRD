  # ---------------------------------------------------------------------------
  # Calculations
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: flow_normalization_certify_literal_1810
        claim_type: correct_result
        grounds: [calculations.flow_normalization, entities.FlowTest.fields.flow_at_20psi_gpm]
        distinguishing_aspect: "Qm 1000 at static 80 / residual 60 normalizes to exactly 1810 gpm at 20 psi (factor 3^0.54), and the certification cascades the value onto hydrant and system aggregates."
        test_recipe:
          setup: ["community in FIELD_VERIFICATION with one hydrant and one SUBMITTED test"]
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "Norman", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/water-supply-systems?community_id=${c_id}", as: EvaluationCoordinator, captures: { sys_id: "$.data[0].id" } }
            - { call: "POST /ppc/hydrants", payload: { system_id: "${sys_id}", location_descriptor: "H1" }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { h1: $.data.id } }
            - { call: "POST /ppc/flow-tests", payload: { system_id: "${sys_id}", hydrant_id: "${h1}", test_date: "2026-08-15", static_psi: 80, residual_psi: 60, measured_flow_gpm: 1000 }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { t1: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/flow-tests/${t1}/transition", payload: { target_state: "WITNESSED" }, as: FieldAnalyst, as_user_id: "analyst-1" }
          trigger:
            - { call: "POST /ppc/flow-tests/${t1}/transition", payload: { target_state: "CERTIFIED" }, as: FieldAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /ppc/hydrants/${h1}", as: FieldAnalyst }
            - { call: "GET /ppc/water-supply-systems/${sys_id}", as: FieldAnalyst }
          assert:
            - "FlowTest.${t1}.flow_at_20psi_gpm == 1810"
            - "Hydrant.${h1}.max_flow_gpm == 1810 and last_certified_test_date == 2026-08-15"
            - "WaterSupplySystem.${sys_id}.active_certified_flow_gpm == 1810 and creditworthy_hydrant_count == 1"

      - name: comms_alarm_threshold_60_vs_61
        claim_type: constants_applied
        grounds: [calculations.comms_points]
        distinguishing_aspect: "avg alarm handling of exactly 60 seconds earns 4 points; 61 seconds earns 2 — the ALARM_FAST_SECONDS boundary is inclusive."
        test_recipe:
          setup: ["community in SCORING with comms attested at 60s (sheet1), then re-attested at 61s (sheet2)"]
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "Dispatchburg", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
