      - name: holdback_refused_when_the_condition_standard_is_met
        claim_type: violation_error
        grounds:
          - errors.ERR_STANDARD_MET_NO_HOLDBACK
          - calculations.reversion_condition_score
          - state_machines.ReversionAssessment.INSPECTED_to_HOLDBACK_APPLIED
        distinguishing_aspect: |
          Scores of 90/90/90 under SHELL_CONDITION weight to 5400 + 2700 + 900 = 9000 bps, comfortably
          over the 7000 passing mark, so deficiency_bps is 0 and the holdback route must be closed
          entirely - not merely capped at a zero holdback. Closing straight from INSPECTED then refunds
          the whole 5000000 deposit and reverts the lease.
        test_recipe:
          setup:
            - "A lease expired by the sweep, whose auto-created assessment has been inspected at 90/90/90 by am-1."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
