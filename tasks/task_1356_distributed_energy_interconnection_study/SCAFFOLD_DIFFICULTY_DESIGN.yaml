  - rule_id: compensating_invariant
    instances:
      - name: committed_mw_create_withdraw_conservation
        grounds:
          - calculations.committed_mw_reconciliation
          - calculations.queue_position_assignment_and_compaction
        distinguishing_aspect: |
          Conserved quantity is cluster MW: creating a project debits and withdrawing it
          credits the same capacity_mw, so ClusterGroup.committed_mw after the pair equals
          its value before the pair, and always equals the sum over non-withdrawn members.
        test_recipe:
          setup:
            - "FORMING cluster capacity 200 MW, no members"
          setup_api_calls:
            - call: "POST /interconnection/developers"
              payload: { legal_name: "Acme Renewables LLC", contact_email: "queue@acme.example", developer_type: "IPP" }
              as: QueueAdministrator
              captures: { dev_id: $.data.id }
            - call: "POST /interconnection/cluster-groups"
              payload: { name: "Cluster 2026-A", region: "WEST", application_window_open: "2026-08-01T00:00:00Z", application_window_close: "2026-09-01T00:00:00Z", capacity_mw: 200 }
              as: QueueAdministrator
              captures: { cg_id: $.data.id }
          trigger:
            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "P1", technology: "SOLAR", capacity_mw: 10, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-1" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "P2", technology: "SOLAR", capacity_mw: 20, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-2" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p2_id: $.data.id }
            - call: "GET /interconnection/cluster-groups/${cg_id}"
              as: QueueAdministrator
              captures: { committed_mid: $.data.committed_mw }
            - call: "POST /interconnection/projects/${p1_id}/withdraw"
              as: Developer
              as_user_id: "${dev_id}"
            - call: "GET /interconnection/cluster-groups/${cg_id}"
              as: QueueAdministrator
              captures: { committed_end: $.data.committed_mw }
            - call: "GET /interconnection/projects/${p2_id}"
              as: QueueAdministrator
              captures: { p2_pos: $.data.queue_position }
          assert:
            - "${committed_mid} == 30 (10 + 20)"
            - "${committed_end} == 20: create(P1,+10) then withdraw(P1,-10) leaves the quantity unchanged relative to before the pair (0 -> 20 via P2 alone)"
            - "ClusterGroup.committed_mw == sum of capacity_mw over non-withdrawn members == 20 (P2 only)"
            - "Project.${p1_id}.status == WITHDRAWN and ${p2_pos} == null (P2 never queued, so no compaction applies to it)"

      - name: study_cost_total_conserved_across_withdrawal_reallocation
        grounds:
          - calculations.study_cost_allocation
        distinguishing_aspect: |
          Conserved quantity is study cost cents (different from cluster MW): a member
          withdrawal followed by reallocation must keep sum(allocated_cents over all of
          the study's CostShare rows) == total_cost_cents exactly — the withdrawn project's
          500000-cent share is redistributed, not dropped.
        test_recipe:
          setup:
            - "P1 10 MW, P2 20 MW, P3 30 MW STUDY_COMPLETE under study total_cost_cents 1200000; FINAL shares 300000/400000/500000 (sum 1200000)"
          setup_api_calls:
            - call: "POST /interconnection/developers"
              payload: { legal_name: "Acme Renewables LLC", contact_email: "queue@acme.example", developer_type: "IPP" }
              as: QueueAdministrator
              captures: { dev_id: $.data.id }
            - call: "POST /interconnection/cluster-groups"
