      - name: performance_index_unchanged_when_contract_terminated
        grounds:
          - state_machines.Award.PROTESTED_to_VACATED
          - state_machines.Contract.ACTIVE_to_TERMINATED
          - calculations.vendor_performance_index
        distinguishing_aspect: |
          Conserved quantity = VendorRegistration.performance_index, an aggregate over non-TERMINATED contracts.
          When an award is SUSTAINED and the contract goes TERMINATED, any CPARS on it is excluded — the index
          equals the mean over the vendor's remaining non-TERMINATED contracts only (a different conserved
          quantity than the integer-cents obligation).
        test_recipe:
          setup:
            - "A vendor with one CLOSED contract carrying CPARS VERY_GOOD (index 85.00); separately wins a second contract that is later TERMINATED via a sustained protest with its own CPARS SATISFACTORY filed before termination."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ContractingOfficer
            - call: "POST /vendors"
              payload: { legal_name: "PerfVendor", uei: "PERF00000001", employee_count: 30, registration_expires_at: "2027-01-01T00:00:00Z" }
              as: Vendor
              captures: { v_id: $.data.id }
            - call: "POST /vendors/${v_id}/activate"
              payload: {}
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /vendors"
              payload: { legal_name: "RivalVendor", uei: "RIVL00000001", employee_count: 30, registration_expires_at: "2027-01-01T00:00:00Z" }
              as: Vendor
              captures: { riv_id: $.data.id }
            - call: "POST /vendors/${riv_id}/activate"
              payload: {}
              as: Vendor
              as_user_id: "${riv_id}"
            # ---- First contract -> CLOSED with VERY_GOOD ----
            - call: "POST /solicitations"
              payload: { title: "Perf Sol A", vehicle_type: "RFP", set_aside_type: "NONE", naics_size_threshold: 500, open_at: "2026-02-01T00:00:00Z", close_at: "2026-02-05T00:00:00Z" }
              as: ContractingOfficer
              captures: { solA: $.data.id }
            - call: "POST /solicitations/${solA}/factors"
              payload: { name: "Technical", kind: "TECHNICAL", weight: 1.0 }
              as: ContractingOfficer
              captures: { fA_t: $.data.id }
            - call: "POST /solicitations/${solA}/factors"
              payload: { name: "Price", kind: "PRICE", weight: 0.0 }
              as: ContractingOfficer
              captures: { fA_p: $.data.id }
            - call: "POST /solicitations/${solA}/open"
              payload: {}
              as: ContractingOfficer
            - call: "POST /proposals"
              payload: { solicitation_id: "${solA}", vendor_id: "${v_id}", total_price_cents: 40000000 }
              as: Vendor
              as_user_id: "${v_id}"
              captures: { pA: $.data.id }
            - call: "POST /proposals/${pA}/scores"
              payload: { factor_id: "${fA_t}", raw_score: 90 }
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /proposals/${pA}/scores"
              payload: { factor_id: "${fA_p}", raw_score: 100 }
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /proposals/${pA}/submit"
              payload: {}
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-05T00:00:00Z" }
              as: ContractingOfficer
            - call: "POST /solicitations/${solA}/close"
              payload: {}
              as: ContractingOfficer
            - call: "POST /proposals/${pA}/begin-evaluation"
              payload: {}
              as: ContractingOfficer
            - call: "POST /proposals/${pA}/score"
              payload: {}
              as: ContractingOfficer
            - call: "POST /solicitations/${solA}/finalize-evaluation"
              payload: {}
              as: ContractingOfficer
              as_user_id: "co_chair_A"
              captures: { solA_v: $.data.version }
            - call: "POST /awards"
              payload: { solicitation_id: "${solA}", proposal_id: "${pA}", expected_solicitation_version: "${solA_v}" }
              as: ContractingOfficer
              as_user_id: "co_award_A"
              captures: { awA: $.data.id }
            - call: "POST /contracts"
              payload: { award_id: "${awA}", contract_type: "FFP", base_value_cents: 40000000 }
              as: ContractingOfficer
              captures: { ctrA: $.data.id }
            - call: "POST /contracts/${ctrA}/cpars"
              payload: { rating: "VERY_GOOD" }
              as: ContractingOfficer
            - call: "POST /contracts/${ctrA}/complete"
              payload: {}
              as: ContractingOfficer
            - call: "POST /contracts/${ctrA}/closeout"
              payload: {}
              as: ContractingOfficer
            # ---- Second contract -> TERMINATED via sustained protest ----
            - call: "POST /solicitations"
              payload: { title: "Perf Sol B", vehicle_type: "RFP", set_aside_type: "NONE", naics_size_threshold: 500, open_at: "2026-02-01T00:00:00Z", close_at: "2026-02-05T00:00:00Z" }
              as: ContractingOfficer
              captures: { solB: $.data.id }
            - call: "POST /solicitations/${solB}/factors"
              payload: { name: "Technical", kind: "TECHNICAL", weight: 1.0 }
              as: ContractingOfficer
              captures: { fB_t: $.data.id }
            - call: "POST /solicitations/${solB}/factors"
              payload: { name: "Price", kind: "PRICE", weight: 0.0 }
              as: ContractingOfficer
              captures: { fB_p: $.data.id }
            - call: "POST /solicitations/${solB}/open"
              payload: {}
              as: ContractingOfficer
            - call: "POST /proposals"
              payload: { solicitation_id: "${solB}", vendor_id: "${v_id}", total_price_cents: 30000000 }
              as: Vendor
              as_user_id: "${v_id}"
              captures: { pB_win: $.data.id }
            - call: "POST /proposals/${pB_win}/scores"
              payload: { factor_id: "${fB_t}", raw_score: 95 }
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /proposals/${pB_win}/scores"
              payload: { factor_id: "${fB_p}", raw_score: 100 }
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /proposals/${pB_win}/submit"
              payload: {}
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /proposals"
              payload: { solicitation_id: "${solB}", vendor_id: "${riv_id}", total_price_cents: 35000000 }
              as: Vendor
              as_user_id: "${riv_id}"
              captures: { pB_riv: $.data.id }
            - call: "POST /proposals/${pB_riv}/scores"
              payload: { factor_id: "${fB_t}", raw_score: 80 }
              as: Vendor
              as_user_id: "${riv_id}"
            - call: "POST /proposals/${pB_riv}/scores"
              payload: { factor_id: "${fB_p}", raw_score: 100 }
              as: Vendor
              as_user_id: "${riv_id}"
            - call: "POST /proposals/${pB_riv}/submit"
              payload: {}
              as: Vendor
              as_user_id: "${riv_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-05T00:00:00Z" }
              as: ContractingOfficer
            - call: "POST /solicitations/${solB}/close"
              payload: {}
              as: ContractingOfficer
            - call: "POST /proposals/${pB_win}/begin-evaluation"
              payload: {}
              as: ContractingOfficer
            - call: "POST /proposals/${pB_win}/score"
              payload: {}
              as: ContractingOfficer
            - call: "POST /proposals/${pB_riv}/begin-evaluation"
              payload: {}
              as: ContractingOfficer
            - call: "POST /proposals/${pB_riv}/score"
              payload: {}
              as: ContractingOfficer
            - call: "POST /solicitations/${solB}/finalize-evaluation"
              payload: {}
              as: ContractingOfficer
              as_user_id: "co_chair_B"
              captures: { solB_v: $.data.version }
            - call: "POST /awards"
              payload: { solicitation_id: "${solB}", proposal_id: "${pB_win}", expected_solicitation_version: "${solB_v}" }
              as: ContractingOfficer
              as_user_id: "co_award_B"
              captures: { awB: $.data.id }
            - call: "POST /contracts"
              payload: { award_id: "${awB}", contract_type: "FFP", base_value_cents: 30000000 }
              as: ContractingOfficer
              captures: { ctrB: $.data.id }
            - call: "POST /contracts/${ctrB}/cpars"
              payload: { rating: "SATISFACTORY" }
              as: ContractingOfficer
            - call: "POST /protests"
              payload: { award_id: "${awB}", protester_vendor_id: "${riv_id}", grounds: "improper award" }
              as: Vendor
              as_user_id: "${riv_id}"
              captures: { protB: $.data.id }
            - call: "POST /protests/${protB}/begin-review"
              payload: {}
              as: ContractingOfficer
          trigger:
            - call: "POST /protests/${protB}/resolve"
              payload: { outcome: "SUSTAINED" }
              as: ContractingOfficer
            - call: "GET /vendors/${v_id}"
              payload: {}
              as: ContractingOfficer
              captures: { pi: $.data.performance_index }
          assert:
            - "Contract.${ctrB}.lifecycle_status == TERMINATED"
            - "VendorRegistration.${v_id}.performance_index == 85.00 (only the non-TERMINATED CLOSED contract's VERY_GOOD=85 counts; the TERMINATED contract's SATISFACTORY=70 is excluded)"
