            - call: "POST /care/care-plans"
              payload: { client_id: "${cli}", source_assessment_id: "${asm}", expected_client_version: "${cli_fresh}", goals: ["Adult day program"] }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { err_state: $.data.error_id }
          assert:
            - "${cli_fresh} == ${cli_stale} + 1 — the capacity determination bumped Client.version"
            - "The stale-version call returns HTTP 412 with data.error_id == \"ERR_STALE_CLIENT_VERSION\", not the 409 assessment error"
            - "The fresh-version call returns HTTP 409 with data.error_id == \"ERR_ASSESSMENT_NOT_ACCEPTED\" (the source assessment is still SUBMITTED)"
            - "No CarePlan row exists: GET /care/care-plans?client_id=${cli} returns an empty data array"
            - "Client.${cli}.version is unchanged by the two rejected calls and equals ${cli_fresh}"

      - name: coi_gate_outranks_retainer_floor_then_floor_is_inclusive
        claim_type: cascading_validation
        grounds:
          - validations[priority 51].ERR_COI_NOT_ACKNOWLEDGED
          - validations[priority 75].ERR_RETAINER_INSUFFICIENT
          - state_machines.ServiceAuthorization.coi_status
          - endpoints[POST /care/service-authorizations/{authorizationId}/coi-events]
        distinguishing_aspect: "Authorizing a referred vendor's coverage surfaces the priority-51 COI error while coi_status is PENDING_DISCLOSURE or DISCLOSED, then the priority-75 retainer error at 49999 cents, and finally succeeds at exactly the 50000-cent floor."
        test_recipe:
          setup:
            - "CareManager Dana, supervisor Iris, billing admin, Client Sasha with retainer_floor_cents omitted (default 50000) and a zero retainer balance."
            - "Surrogate contact Tor (POA_FINANCIAL), vendor Southgate with has_referral_relationship true, ACCEPTED assessment, ACTIVE care plan, one PROPOSED authorization whose coi_status is PENDING_DISCLOSURE."
