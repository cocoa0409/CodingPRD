        test_recipe:
          setup: ["agency with slush_capacity 1; agent; author"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency IP", commission_pct: 0.15, slush_capacity: 1 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
