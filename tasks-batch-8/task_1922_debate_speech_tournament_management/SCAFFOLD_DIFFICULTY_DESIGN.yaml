            - "Pairing.${p2} still has no ballot persisted from the rejected creates (GET /ballots?pairing_id=${p2} total_count == 0)"
  # ---------------------------------------------------------------- rule 7 ---
  - rule_id: cross_entity_state_dependency
    instances:
      - name: tournament_lock_gated_by_school_obligation
        grounds:
          - state_machines.Tournament.REGISTRATION_OPEN_to_REGISTRATION_LOCKED
          - state_machines.School.REGISTERED_to_CONFIRMED
          - entities.School.fields.obligation_status
          - entities.School.fields.shortfall_rounds
        distinguishing_aspect: |
          Entity pair Tournament <- School: the Tournament lock transition is gated on the
          aggregate state of every School (CONFIRMED and obligation SATISFIED). Distinct
          pair from the Ballot <- Pairing instance. A school with an uncovered obligation
          cannot confirm, and the tournament cannot lock while it is unconfirmed.
        test_recipe:
          setup:
            - "Tournament (prelim_round_count 4) with DEBATE/CX/VARSITY division; school Alpha with 2 confirmed entries (obligation 4) and no judge yet; school Beta with 1 confirmed entry (obligation 4) and no judge; clock at 2026-08-10 (lock window reached)."
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "Districts LG", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z", prelim_round_count: 4, entry_fee_cents: 2500 }, as: TournamentDirector, captures: { t: $.data.id } }
            - { call: "POST /divisions", payload: { tournament_id: "${t}", event_type: "DEBATE", event_code: "CX", division: "VARSITY" }, as: TournamentDirector, captures: { d: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Alpha" }, as: TournamentDirector, captures: { s_a: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Beta" }, as: TournamentDirector, captures: { s_b: $.data.id } }
            - { call: "POST /tournaments/${t}/open-registration", as: TournamentDirector }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "A-One" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { e_a1: $.data.id } }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "A-Two" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { e_a2: $.data.id } }
            - { call: "POST /entries/${e_a1}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /entries/${e_a2}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /entries", payload: { school_id: "${s_b}", division_id: "${d}", competitor_name: "B-One" }, as: SchoolCoach, as_user_id: "${s_b}", captures: { e_b1: $.data.id } }
            - { call: "POST /entries/${e_b1}/confirm", as: SchoolCoach, as_user_id: "${s_b}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: TournamentDirector }
          trigger:
            - { call: "POST /schools/${s_a}/confirm", as: SchoolCoach, as_user_id: "${s_a}", captures: { err1: $.data.error_id } }
            - { call: "POST /judges", payload: { tournament_id: "${t}", school_id: "${s_a}", name: "J-Alpha" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { j_a: $.data.id } }
            - { call: "POST /judges/${j_a}/commit", payload: { commitment_rounds: 4 }, as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /schools/${s_a}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "GET /tournaments/${t}", as: TournamentDirector, captures: { t_v: $.data.version } }
            - { call: "POST /tournaments/${t}/lock-registration", payload: { expected_tournament_version: "${t_v}" }, as: TournamentDirector, captures: { err2: $.data.error_id } }
            - { call: "GET /schools/${s_a}", as: SchoolCoach, as_user_id: "${s_a}" }
          assert:
            - "first school confirm rejected with ERR_SCHOOL_OBLIGATION_DEFICIENT (shortfall_rounds == 4 > 0)"
            - "after committing a 4-round judge: School.${s_a}.shortfall_rounds == 0, obligation_status == SATISFIED, confirm succeeds (status == CONFIRMED)"
            - "tournament lock rejected with ERR_SCHOOLS_NOT_LOCK_READY because School.${s_b} is still REGISTERED (its obligation is also DEFICIENT, so it could not confirm)"
            - "Tournament.${t}.status still == REGISTRATION_OPEN"

      - name: ballot_submit_gated_by_pairing_release
        grounds:
          - state_machines.Ballot.DRAFT_to_SUBMITTED
          - state_machines.Pairing.STAFFED_to_BALLOT_RELEASED
          - entities.Pairing.fields.status
        distinguishing_aspect: |
          Entity pair Ballot <- Pairing (distinct from Tournament <- School): a ballot may
          be created while its pairing is STAFFED, but DRAFT -> SUBMITTED is rejected until
          the pairing reaches BALLOT_RELEASED via the round's open-ballots cascade.
        test_recipe:
          setup:
            - "Tournament (prelim_round_count 2) with DEBATE/CX/VARSITY division; schools Alpha, Beta with 1 confirmed entry each; school Epsilon with 1 committed judge; all CONFIRMED; locked; round 1 paired (A1,B1); pairing staffed (room + judge J-Epsilon-1) but round NOT opened for ballots (pairing still STAFFED)."
