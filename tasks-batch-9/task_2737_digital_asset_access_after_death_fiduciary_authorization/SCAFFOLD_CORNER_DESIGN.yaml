            - "${a_sub_class0} == LICENSE_TERMINATES_AT_DEATH and ${a_sub_reason0} == CATEGORY_SUBSCRIPTION_LICENCE"
            - "${run_gross} == 240000 and ${run_included} == 2 (vault-1 200000 + points-1 40000; sub-1 excluded)"
            - "${v_appraised} == 200000 and ${v_access} == CATALOG_DISCLOSED"
            - "${v_class_after_patch} == TRANSFERABLE and ${v_version_b} == ${v_version_a} (the PATCH touches no asset row)"
            - "${v_class1} == LICENSE_TERMINATES_AT_DEATH, ${v_reason1} == PROVIDER_LICENCE_TERMINATES (rule 3)"
            - "${v_appraised1} == 200000 and ${v_access1} == CATALOG_DISCLOSED and ${v_version_c} == ${v_version_b} + 1"
            - "${pts_class1} == TRANSFERABLE and ${pts_reason1} == TRANSFERABLE_PROPERTY (the licence flag reaches CLOUD_STORAGE only)"
