            - call: "POST /bureau/submissions"
              payload: { insurer_id: "${ins_id}", plan_id: "${plan_id}", period_start: "2025-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z", record_count: 5, written_premium_cents: 50000 }
              as: InsurerUser
              as_user_id: "${ins_id}"
          assert:
