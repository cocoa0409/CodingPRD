  # ===========================================================================
  # SECTION 8 — cross_cutting_complexity_layers
  # (complexity_profile.complexity_layers = rate_threshold_triggers,
  #  cascading_side_effects, optimistic_concurrency, derived_field_reconciliation)
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: layer_rate_cumulative_threshold_exactly_at_suspension_boundary
        claim_type: rate_threshold_triggers
        grounds: ["calculations.ladder_rung_selection", "calculations.violation_points"]
        distinguishing_aspect: "With suspension_points_threshold 7, a second 14000 MARKETPLACE breach worth 4 points takes the ledger to exactly 7 and the inclusive >= comparison selects SUSPENSION, not WARNING."
        test_recipe:
          setup: ["Policy MAP-2026-E published with suspension_points_threshold 7 and termination_points_threshold 12; product SKU-LADDER-1 at floor 15000; reseller Ladder Retail AUTHORIZED on MARKETPLACE; one WARNING already issued for a 3-point breach so the ledger stands at 3."]
          setup_api_calls:
            - *CLK0801
            - &POLE
              call: "POST /pricing-policies"
              payload: { policy_code: "MAP-2026-E", suspension_points_threshold: 7, termination_points_threshold: 12, cure_window_days: 10, suspension_cooling_off_days: 14 }
              as: BrandChannelManager
              captures: { pole: $.data.id }
            - &POLESUB
              call: "POST /pricing-policies/${pole}/submit-review"
              payload: {}
              as: BrandChannelManager
            - &POLEDEC
              call: "POST /pricing-policies/${pole}/review-decision"
              payload: { decision: "APPROVE_FOR_PUBLICATION" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - &POLEPUB
              call: "POST /pricing-policies/${pole}/publish"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - &PRODE
              call: "POST /products"
              payload: { sku: "SKU-LADDER-1", name: "Ladder Probe", msrp_cents: 20000, standard_map_floor_cents: 15000, governing_policy_id: "${pole}" }
              as: BrandChannelManager
              captures: { prode: $.data.id }
            - &RESLAD
              call: "POST /resellers"
              payload: { legal_name: "Ladder Retail LLC", contact_email: "ops@ladder.example", primary_channel: "MARKETPLACE" }
              as: BrandChannelManager
              captures: { resl: $.data.id }
            - &AGRLAD
              call: "POST /reseller-agreements"
              payload: { reseller_id: "${resl}", policy_id: "${pole}", permitted_channels: ["MARKETPLACE"], quality_obligations: ["AUTHENTICITY_LABELING"], term_ends_at: "2027-06-30T00:00:00Z" }
              as: BrandChannelManager
              captures: { agrl: $.data.id }
            - &AGRLADSEND
              call: "POST /reseller-agreements/${agrl}/send"
              payload: {}
              as: BrandChannelManager
            - &AGRLADSIGN
              call: "POST /reseller-agreements/${agrl}/respond"
              payload: { decision: "COUNTERSIGN", non_negotiation_acknowledged: true }
              as: Reseller
              as_user_id: "${resl}"
            - &AGRLADACT
              call: "POST /reseller-agreements/${agrl}/activate"
              payload: {}
              as: BrandChannelManager
            - *CLK0820
            - &OBSL1
              call: "POST /price-observations"
              payload: { product_id: "${prode}", channel: "MARKETPLACE", seller_display_name: "Ladder Store", listing_url: "https://mkt.example/l/lad1", listed_price_cents: 14000, observed_at: "2026-08-17T00:00:00Z", evidence_hash: "1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b", matched_reseller_id: "${resl}" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { obsl1: $.data.id }
            - &OBSL1EVAL
              call: "POST /price-observations/${obsl1}/evaluate"
              payload: {}
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { viol1: $.data.violation_id }
            - &GETRESLV1
              call: "GET /resellers/${resl}"
              payload: {}
              as: BrandChannelManager
              captures: { rlv1: $.data.version }
            - &NOTL1
              call: "POST /enforcement-notices"
              payload: { reseller_id: "${resl}", violation_id: "${viol1}", delivery_channel: "EMAIL", expected_reseller_version: "${rlv1}" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { notl1: $.data.id }
            - &OBSL2
              call: "POST /price-observations"
              payload: { product_id: "${prode}", channel: "MARKETPLACE", seller_display_name: "Ladder Store", listing_url: "https://mkt.example/l/lad2", listed_price_cents: 14000, observed_at: "2026-08-18T00:00:00Z", evidence_hash: "1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b", matched_reseller_id: "${resl}" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { obsl2: $.data.id }
            - &OBSL2EVAL
              call: "POST /price-observations/${obsl2}/evaluate"
              payload: {}
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { viol2: $.data.violation_id }
            - &GETRESLV2
              call: "GET /resellers/${resl}"
              payload: {}
              as: BrandChannelManager
              captures: { rlv2: $.data.version }
          trigger:
            - call: "POST /enforcement-notices"
              payload: { reseller_id: "${resl}", violation_id: "${viol2}", delivery_channel: "EMAIL", expected_reseller_version: "${rlv2}", rung: "SUSPENSION", suspension_starts_at: "2026-09-01T00:00:00Z", suspension_ends_at: "2026-09-10T00:00:00Z" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { notl2: $.data.id, rung: $.data.rung, ap: $.data.assessed_points, cum: $.data.cumulative_points_at_issue }
          assert:
            - "HTTP 201"
            - "${ap} == 4"
            - "${cum} == 7"
            - "${rung} == 'SUSPENSION'"
            - "Reseller.${resl}.violation_points_total == 7"
            - "Reseller.${resl}.authorization_status == SUSPENDED"

      - name: layer_rate_cumulative_threshold_one_point_below_suspension
        claim_type: rate_threshold_triggers
        grounds: ["calculations.ladder_rung_selection"]
        distinguishing_aspect: "The same 3 + 4 = 7 point ledger stays on WARNING when the policy sets suspension_points_threshold to 8, proving the boundary is the threshold value itself rather than a nearby heuristic."
