scaffold_difficulty_design:

  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: waste_planned_vs_actual_diverges_on_production_run
        grounds:
          - calculations.waste_reconciliation
          - calculations.waste_totals
          - state_machines.ProductionRun.RUNNING_to_PENDING_QA
          - endpoints./copack/production-runs/{id}/summary
        distinguishing_aspect: |
          Dual-variant on the ProductionRun domain: planned_waste (scrap_factor over
          planned_units) and actual_waste (consumed minus material embodied in actual
          good units) compute DIFFERENT numbers for the same run — across the ALMOND
          (30.000) and POUCH (10.000) lines, planned_waste_total == 10.000 and
          actual_waste_total == 40.000 when good=90 of planned=100.
        test_recipe:
          setup:
            - "Customer ACME (owns_components=false); component ALMOND on_hand 500 via one lot exp 2026-12-31"
            - "Recipe GRAN APPROVED: target 200g, tol 5%, shelf 90d; one INGREDIENT BomLine ALMOND qty_per_unit=2 scrap=5%, one PACKAGING BomLine"
            - "ProductionRun planned_units=100 on Line A + Day Crew; STARTED at 2026-06-01T08:00:00Z then COMPLETED at 10:00:00Z with good=90 scrapped=10"
          setup_api_calls:
            - call: "POST /copack/customers"
              payload: { name: "Acme Foods", code: "ACME", owns_components: false }
              as: Receiver
              captures: { cust_id: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cust_id}", sku: "ALMOND", name: "Roasted Almonds", kind: "INGREDIENT", allergens: ["TREENUT"] }
              as: Receiver
              captures: { comp_almond_id: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cust_id}", sku: "POUCH", name: "Stand-up Pouch", kind: "PACKAGING" }
              as: Receiver
              captures: { comp_pouch_id: $.data.id }
            - call: "POST /copack/components/${comp_almond_id}/lots"
              payload: { supplier_lot_code: "SL-ALM-1", received_qty: 500, expiration_date: "2026-12-31T00:00:00Z" }
              as: Receiver
            - call: "POST /copack/components/${comp_pouch_id}/lots"
              payload: { supplier_lot_code: "SL-POU-1", received_qty: 1000, expiration_date: "2027-12-31T00:00:00Z" }
              as: Receiver
            - call: "POST /copack/recipes"
              payload: { customer_id: "${cust_id}", name: "Granola Bars", target_fill_weight_g: 200, fill_tolerance_pct: 5, shelf_life_days: 90 }
              as: Scheduler
              captures: { recipe_id: $.data.id, recipe_v0: $.data.version }
            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${comp_almond_id}", qty_per_unit: 2, scrap_factor_pct: 5, expected_recipe_version: "${recipe_v0}" }
              as: Scheduler
              captures: { recipe_v1: $.data.version }
            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${comp_pouch_id}", qty_per_unit: 1, scrap_factor_pct: 0, expected_recipe_version: "${recipe_v1}" }
              as: Scheduler
            - call: "POST /copack/recipes/${recipe_id}/submit"
              payload: {}
              as: Scheduler
            - call: "POST /copack/recipes/${recipe_id}/approve"
              payload: {}
              as: QAInspector
            - call: "POST /copack/production-lines"
              payload: { name: "Line A", rated_units_per_hour: 50, changeover_minutes: 30 }
              as: Scheduler
              captures: { line_id: $.data.id, line_v0: $.data.version }
            - call: "POST /copack/crews"
              payload: { name: "Day Crew", rest_buffer_minutes: 15 }
              as: Scheduler
              captures: { crew_id: $.data.id }
            - call: "POST /copack/production-runs"
              payload: { recipe_id: "${recipe_id}", line_id: "${line_id}", crew_id: "${crew_id}", planned_units: 100, scheduled_start: "2026-06-01T08:00:00Z" }
              as: Scheduler
              captures: { run_id: $.data.id }
            - call: "POST /copack/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: Scheduler
            - call: "POST /copack/production-runs/${run_id}/start"
              payload: { expected_line_version: "${line_v0}" }
              as: Scheduler
            - call: "POST /copack/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: Scheduler
          trigger:
            - call: "POST /copack/production-runs/${run_id}/complete"
              payload: { actual_units_good: 90, actual_units_scrapped: 10 }
              as: Scheduler
            - call: "GET /copack/production-runs/${run_id}/summary"
              payload: {}
              as: Scheduler
              captures: { planned: $.data.planned_waste_total, actual: $.data.actual_waste_total }
          assert:
            - "summary.planned_waste_total == 10.000"
            - "summary.actual_waste_total == 40.000"
            - "summary.planned_waste_total != summary.actual_waste_total"

      - name: inventory_available_vs_physical_diverges_on_component
        grounds:
          - calculations.inventory_on_hand
          - state_machines.ProductionRun.PENDING_QA_to_QUARANTINED
          - entities.Component.fields.on_hand_qty
          - state_machines.ComponentLot.AVAILABLE_to_QUARANTINED
        distinguishing_aspect: |
          Dual-variant on the Component domain (different entity than waste on
          ProductionRun): available_on_hand counts only AVAILABLE lots while
          physical_on_hand also counts QUARANTINED lots. After a run is
          quarantined, Component.on_hand_qty (available variant) drops below the
          physical total still on the floor.
        test_recipe:
          setup:
            - "Component ALMOND with two AVAILABLE lots remaining 150 + 200 = 350 on_hand; one run consumed 210 (FEFO) then was COMPLETED and QUARANTINED"
          setup_api_calls:
            - call: "POST /copack/customers"
              payload: { name: "Acme Foods", code: "ACME", owns_components: false }
              as: Receiver
              captures: { cust_id: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cust_id}", sku: "ALMOND", name: "Roasted Almonds", kind: "INGREDIENT", allergens: ["TREENUT"] }
              as: Receiver
              captures: { comp_almond_id: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cust_id}", sku: "POUCH", name: "Pouch", kind: "PACKAGING" }
              as: Receiver
              captures: { comp_pouch_id: $.data.id }
            - call: "POST /copack/components/${comp_almond_id}/lots"
              payload: { supplier_lot_code: "ALM-A", received_qty: 150, expiration_date: "2026-07-01T00:00:00Z" }
              as: Receiver
            - call: "POST /copack/components/${comp_almond_id}/lots"
              payload: { supplier_lot_code: "ALM-B", received_qty: 200, expiration_date: "2026-08-01T00:00:00Z" }
              as: Receiver
            - call: "POST /copack/components/${comp_pouch_id}/lots"
              payload: { supplier_lot_code: "POU-A", received_qty: 1000, expiration_date: "2027-01-01T00:00:00Z" }
              as: Receiver
            - call: "POST /copack/recipes"
              payload: { customer_id: "${cust_id}", name: "Granola", target_fill_weight_g: 200, fill_tolerance_pct: 5, shelf_life_days: 90 }
              as: Scheduler
              captures: { recipe_id: $.data.id, recipe_v0: $.data.version }
            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${comp_almond_id}", qty_per_unit: 2, scrap_factor_pct: 5, expected_recipe_version: "${recipe_v0}" }
              as: Scheduler
              captures: { recipe_v1: $.data.version }
            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${comp_pouch_id}", qty_per_unit: 1, expected_recipe_version: "${recipe_v1}" }
              as: Scheduler
            - call: "POST /copack/recipes/${recipe_id}/submit"
              payload: {}
              as: Scheduler
            - call: "POST /copack/recipes/${recipe_id}/approve"
              payload: {}
              as: QAInspector
            - call: "POST /copack/production-lines"
              payload: { name: "Line A", rated_units_per_hour: 50 }
              as: Scheduler
              captures: { line_id: $.data.id, line_v0: $.data.version }
            - call: "POST /copack/crews"
              payload: { name: "Day Crew" }
              as: Scheduler
              captures: { crew_id: $.data.id }
            - call: "POST /copack/production-runs"
              payload: { recipe_id: "${recipe_id}", line_id: "${line_id}", crew_id: "${crew_id}", planned_units: 100, scheduled_start: "2026-06-01T08:00:00Z" }
              as: Scheduler
              captures: { run_id: $.data.id }
            - call: "POST /copack/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: Scheduler
            - call: "POST /copack/production-runs/${run_id}/start"
              payload: { expected_line_version: "${line_v0}" }
              as: Scheduler
            - call: "POST /copack/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: Scheduler
            - call: "POST /copack/production-runs/${run_id}/complete"
              payload: { actual_units_good: 95, actual_units_scrapped: 5 }
              as: Scheduler
            - call: "POST /copack/production-runs/${run_id}/checkweigh-samples"
              payload: { measured_weight_g: 200 }
              as: QAInspector
          trigger:
            - call: "POST /copack/production-runs/${run_id}/quarantine"
              payload: {}
              as: QAInspector
            - call: "GET /copack/components/${comp_almond_id}"
              payload: {}
              as: Scheduler
              captures: { on_hand: $.data.on_hand_qty }
          assert:
            - "Component.${comp_almond_id}.on_hand_qty == 0.000 (available variant: both consumed lots ALM-A and ALM-B are now QUARANTINED, no AVAILABLE lot remains)"
            - "physical_on_hand variant (AVAILABLE+QUARANTINED) == 140.000 (ALM-B still holds 140 remaining though quarantined); the two variants diverge by 140.000"

  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: material_consumption_three_inputs_fefo_tiered_draw
        grounds:
          - calculations.material_consumption
          - state_machines.ProductionRun.SCHEDULED_to_RUNNING
          - entities.BomLine.fields.scrap_factor_pct
          - endpoints./copack/production-runs/{id}/lot-consumptions
        distinguishing_aspect: |
          Mode (a) non-linear: required_qty = round(qty_per_unit*(1+scrap/100)*planned_units)
          combines THREE inputs (qty_per_unit=2, scrap=5%, planned=100 -> 210.000) and
          then a FEFO min(lot.remaining, residual) selection across tiered lots — draw
          150 from the 2026-07-01 lot (DEPLETED), 60 from the 2026-08-01 lot.
        test_recipe:
          setup:
            - "Component ALMOND with lot ALM-A 150 (exp 2026-07-01) and ALM-B 200 (exp 2026-08-01); recipe needs 210 scrap-inflated"
          setup_api_calls:
            - call: "POST /copack/customers"
              payload: { name: "Acme", code: "ACME", owns_components: false }
              as: Receiver
              captures: { cust_id: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cust_id}", sku: "ALMOND", name: "Almonds", kind: "INGREDIENT" }
              as: Receiver
              captures: { comp_id: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cust_id}", sku: "POUCH", name: "Pouch", kind: "PACKAGING" }
              as: Receiver
              captures: { pouch_id: $.data.id }
            - call: "POST /copack/components/${comp_id}/lots"
              payload: { supplier_lot_code: "ALM-A", received_qty: 150, expiration_date: "2026-07-01T00:00:00Z" }
              as: Receiver
              captures: { lot_a_id: $.data.id }
            - call: "POST /copack/components/${comp_id}/lots"
              payload: { supplier_lot_code: "ALM-B", received_qty: 200, expiration_date: "2026-08-01T00:00:00Z" }
              as: Receiver
              captures: { lot_b_id: $.data.id }
            - call: "POST /copack/components/${pouch_id}/lots"
              payload: { supplier_lot_code: "POU-A", received_qty: 1000, expiration_date: "2027-01-01T00:00:00Z" }
              as: Receiver
            - call: "POST /copack/recipes"
              payload: { customer_id: "${cust_id}", name: "Granola", target_fill_weight_g: 200, fill_tolerance_pct: 5, shelf_life_days: 90 }
              as: Scheduler
              captures: { recipe_id: $.data.id, recipe_v0: $.data.version }
            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${comp_id}", qty_per_unit: 2, scrap_factor_pct: 5, expected_recipe_version: "${recipe_v0}" }
              as: Scheduler
              captures: { recipe_v1: $.data.version, bom_almond_id: $.data.id }
            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${pouch_id}", qty_per_unit: 1, expected_recipe_version: "${recipe_v1}" }
              as: Scheduler
            - call: "POST /copack/recipes/${recipe_id}/submit"
              payload: {}
              as: Scheduler
            - call: "POST /copack/recipes/${recipe_id}/approve"
              payload: {}
              as: QAInspector
            - call: "POST /copack/production-lines"
              payload: { name: "Line A", rated_units_per_hour: 50 }
              as: Scheduler
              captures: { line_id: $.data.id, line_v0: $.data.version }
            - call: "POST /copack/crews"
              payload: { name: "Day Crew" }
              as: Scheduler
              captures: { crew_id: $.data.id }
            - call: "POST /copack/production-runs"
              payload: { recipe_id: "${recipe_id}", line_id: "${line_id}", crew_id: "${crew_id}", planned_units: 100, scheduled_start: "2026-06-01T08:00:00Z" }
              as: Scheduler
              captures: { run_id: $.data.id }
            - call: "POST /copack/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: Scheduler
          trigger:
            - call: "POST /copack/production-runs/${run_id}/start"
              payload: { expected_line_version: "${line_v0}" }
              as: Scheduler
            - call: "GET /copack/component-lots/${lot_a_id}"
              payload: {}
              as: Scheduler
              captures: { lot_a_rem: $.data.remaining_qty, lot_a_status: $.data.status }
            - call: "GET /copack/component-lots/${lot_b_id}"
              payload: {}
              as: Scheduler
              captures: { lot_b_rem: $.data.remaining_qty }
          assert:
            - "ComponentLot.${lot_a_id}.remaining_qty == 0.000"
            - "ComponentLot.${lot_a_id}.status == DEPLETED"
            - "ComponentLot.${lot_b_id}.remaining_qty == 140.000"

      - name: waste_totals_round_per_line_then_sum
        grounds:
          - calculations.waste_totals
          - calculations.waste_reconciliation
          - endpoints./copack/production-runs/{id}/summary
        distinguishing_aspect: |
          Mode (b) nested rounding: the pinned order is round-each-bom-line-to-3dp THEN
          sum (NOT sum-then-round). With three lines whose per-line actual waste are
          ALMOND 30.000, OIL 2.500, POUCH 10.000, actual_waste_total == 42.500. This is
          a different combinatorial mode than material_consumption's mode-(a) FEFO draw.
        test_recipe:
          setup:
            - "Recipe with INGREDIENT BomLines ALMOND qty 2 scrap 5% and OIL qty 0.25 scrap 0%, plus PACKAGING POUCH qty 1; planned 100, good 90"
          setup_api_calls:
            - call: "POST /copack/customers"
              payload: { name: "Acme", code: "ACME", owns_components: false }
              as: Receiver
              captures: { cust_id: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cust_id}", sku: "ALMOND", name: "Almonds", kind: "INGREDIENT" }
              as: Receiver
              captures: { comp_alm: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cust_id}", sku: "OIL", name: "Oil", kind: "INGREDIENT" }
              as: Receiver
              captures: { comp_oil: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cust_id}", sku: "POUCH", name: "Pouch", kind: "PACKAGING" }
              as: Receiver
              captures: { comp_pouch: $.data.id }
            - call: "POST /copack/components/${comp_alm}/lots"
              payload: { supplier_lot_code: "ALM-1", received_qty: 500, expiration_date: "2026-12-31T00:00:00Z" }
              as: Receiver
            - call: "POST /copack/components/${comp_oil}/lots"
              payload: { supplier_lot_code: "OIL-1", received_qty: 100, expiration_date: "2026-12-31T00:00:00Z" }
              as: Receiver
            - call: "POST /copack/components/${comp_pouch}/lots"
              payload: { supplier_lot_code: "POU-1", received_qty: 1000, expiration_date: "2027-12-31T00:00:00Z" }
              as: Receiver
            - call: "POST /copack/recipes"
              payload: { customer_id: "${cust_id}", name: "Granola", target_fill_weight_g: 200, fill_tolerance_pct: 5, shelf_life_days: 90 }
              as: Scheduler
              captures: { recipe_id: $.data.id, rv0: $.data.version }
            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${comp_alm}", qty_per_unit: 2, scrap_factor_pct: 5, expected_recipe_version: "${rv0}" }
              as: Scheduler
              captures: { rv1: $.data.version }
            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${comp_oil}", qty_per_unit: 0.25, scrap_factor_pct: 0, expected_recipe_version: "${rv1}" }
              as: Scheduler
              captures: { rv2: $.data.version }
            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${comp_pouch}", qty_per_unit: 1, expected_recipe_version: "${rv2}" }
              as: Scheduler
            - call: "POST /copack/recipes/${recipe_id}/submit"
              payload: {}
              as: Scheduler
            - call: "POST /copack/recipes/${recipe_id}/approve"
              payload: {}
              as: QAInspector
            - call: "POST /copack/production-lines"
              payload: { name: "Line A", rated_units_per_hour: 50 }
              as: Scheduler
              captures: { line_id: $.data.id, lv0: $.data.version }
            - call: "POST /copack/crews"
              payload: { name: "Day Crew" }
              as: Scheduler
              captures: { crew_id: $.data.id }
            - call: "POST /copack/production-runs"
              payload: { recipe_id: "${recipe_id}", line_id: "${line_id}", crew_id: "${crew_id}", planned_units: 100, scheduled_start: "2026-06-01T08:00:00Z" }
              as: Scheduler
              captures: { run_id: $.data.id }
            - call: "POST /copack/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: Scheduler
            - call: "POST /copack/production-runs/${run_id}/start"
              payload: { expected_line_version: "${lv0}" }
              as: Scheduler
            - call: "POST /copack/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: Scheduler
            - call: "POST /copack/production-runs/${run_id}/complete"
              payload: { actual_units_good: 90, actual_units_scrapped: 10 }
              as: Scheduler
          trigger:
            - call: "GET /copack/production-runs/${run_id}/summary"
              payload: {}
              as: Scheduler
              captures: { actual_total: $.data.actual_waste_total }
          assert:
            - "summary.actual_waste_total == 42.500"

  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: recipe_revision_cycle_rejected_back_to_draft
        grounds:
          - state_machines.Recipe.PENDING_APPROVAL_to_REJECTED
          - state_machines.Recipe.REJECTED_to_DRAFT
          - state_machines.Recipe.DRAFT_to_PENDING_APPROVAL
        distinguishing_aspect: |
          Cyclic shape on Recipe: DRAFT -> PENDING_APPROVAL -> REJECTED -> DRAFT loops
          back; after revise the recipe is editable again and re-submittable, proving a
          non-linear (cycle) machine distinct from any linear pipeline.
        test_recipe:
          setup:
            - "Recipe submitted then REJECTED by QA"
          setup_api_calls:
            - call: "POST /copack/customers"
              payload: { name: "Acme", code: "ACME" }
              as: Receiver
              captures: { cust_id: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cust_id}", sku: "ALMOND", name: "Almonds", kind: "INGREDIENT" }
              as: Receiver
              captures: { comp_id: $.data.id }
            - call: "POST /copack/components"
              payload: { customer_id: "${cust_id}", sku: "POUCH", name: "Pouch", kind: "PACKAGING" }
              as: Receiver
              captures: { pouch_id: $.data.id }
            - call: "POST /copack/recipes"
              payload: { customer_id: "${cust_id}", name: "Granola", target_fill_weight_g: 200, fill_tolerance_pct: 5, shelf_life_days: 90 }
              as: Scheduler
              captures: { recipe_id: $.data.id, rv0: $.data.version }
            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${comp_id}", qty_per_unit: 2, expected_recipe_version: "${rv0}" }
              as: Scheduler
              captures: { rv1: $.data.version }
            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${pouch_id}", qty_per_unit: 1, expected_recipe_version: "${rv1}" }
              as: Scheduler
            - call: "POST /copack/recipes/${recipe_id}/submit"
              payload: {}
              as: Scheduler
            - call: "POST /copack/recipes/${recipe_id}/reject"
              payload: {}
              as: QAInspector
          trigger:
            - call: "POST /copack/recipes/${recipe_id}/revise"
              payload: {}
              as: Scheduler
              captures: { status_after_revise: $.data.status }
            - call: "POST /copack/recipes/${recipe_id}/submit"
              payload: {}
              as: Scheduler
              captures: { status_after_resubmit: $.data.status }
          assert:
            - "Recipe.${recipe_id}.status == DRAFT after revise"
            - "Recipe.${recipe_id}.status == PENDING_APPROVAL after resubmit"

      - name: production_run_qa_fork_release_vs_quarantine
        grounds:
          - state_machines.ProductionRun.PENDING_QA_to_RELEASED
          - state_machines.ProductionRun.PENDING_QA_to_QUARANTINED
          - entities.ProductionRun.fields.fg_expiration_date
        distinguishing_aspect: |
          Branching fork on ProductionRun (different entity than Recipe): PENDING_QA
          forks to RELEASED (sets fg_expiration_date, lots stay AVAILABLE) versus
          QUARANTINED (no fg_expiration, lots forced QUARANTINED) — divergent
          side-effect sets per branch.
        test_recipe:
          setup:
            - "Two runs each reach PENDING_QA from the same recipe/line; one released, one quarantined"
          setup_api_calls:
            - call: "POST /copack/customers"
              payload: { name: "Acme", code: "ACME" }
