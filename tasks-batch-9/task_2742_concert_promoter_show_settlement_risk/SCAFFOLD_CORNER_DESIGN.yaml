            - call: "POST /markets"
              payload: { name: "Conditional Market", region_code: "CN", guarantee_exposure_limit_cents: 5000000 }
              as: RiskOfficer
              captures: { cc_mk_id: $.data.id }
            - call: "POST /artists"
