              as: SamplingTechnician
              captures: { a1_id: "$.data.id" }
            - call: "POST /samples"
              payload: { entry_point_id: "${ep2_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q2", collected_at: "2026-05-11T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-B1" }
              as: SamplingTechnician
              captures: { b1_id: "$.data.id" }
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q2", collected_at: "2026-05-15T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-A2" }
              as: SamplingTechnician
              captures: { a2_id: "$.data.id" }
            - call: "POST /samples"
              payload: { entry_point_id: "${ep2_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q2", collected_at: "2026-05-16T08:00:00.000Z", protocol: "COMPOSITE", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-B2" }
              as: SamplingTechnician
              captures: { b2_id: "$.data.id" }
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q2", collected_at: "2026-05-20T08:00:00.000Z", protocol: "COMPOSITE", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-A3" }
              as: SamplingTechnician
              captures: { a3_id: "$.data.id" }
          trigger:
            - call: "GET /samples?entry_point_id=${ep_id}&limit=2&offset=0"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /samples?entry_point_id=${ep_id}&limit=2&offset=2"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { page2_first: "$.data[0].id" }
            - call: "GET /samples?entry_point_id=${ep_id}&limit=2&offset=4"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "GET /samples with no filter returns total_count == 5"
            - "The first filtered page returns HTTP 200 with exactly 2 rows, total_count == 3 and has_more == true"
            - "The second filtered page returns exactly 1 row, total_count == 3 and has_more == false"
            - "The third filtered page returns 0 rows, total_count == 3 and has_more == false — an offset past the end is not an error"
            - "Every returned row has entry_point_id == ${ep_id}; neither ${b1_id} nor ${b2_id} appears on any page"
            - "The three filtered rows across both pages are exactly ${a1_id}, ${a2_id} and ${a3_id} with no repeats, ordered by created_at ascending"

      - name: the_triggered_posture_band_opens_at_exactly_one_half_of_the_mcl
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.compliance_posture_derivation
          - entities.EntryPoint.fields.compliance_posture
          - entities.EntryPoint.fields.consecutive_qualifying_quarters
          - entities.Contaminant.fields.trigger_level_ng_per_l
        distinguishing_aspect: "Two entry points differ by a single hundredth of a nanogram: 2.00 ng/L against a 4.00 MCL gives a ratio of exactly 0.5000 and lands inside the TRIGGERED band, while 1.99 gives 0.4975 and stays COMPLIANT. The same pair also straddles the qualifying-quarter rule in the opposite direction, because a value equal to the 2.00 trigger level does not qualify while 1.99 does — one boundary is inclusive and the other exclusive, on the same two numbers."
        test_recipe:
          setup:
            - "PFOA has MCL 4.00 and trigger_level 2.00, so the TRIGGERED band opens at a ratio of 0.5000 which is a compliance value of exactly 2.00."
            - "EPTDS-06 has one accepted 2026Q2 result at exactly 2.00 ng/L; EPTDS-07 has one accepted 2026Q2 result at 1.99 ng/L. Both use detection limit 1.00, so neither value is censored."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00 }
