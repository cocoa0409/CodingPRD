  - section: calculations
    instances:
      - name: license_copyleft_clause_wins_over_noncommercial
        claim_type: correct_result
        grounds:
          - calculations.license_reuse_permission_class
          - entities.LicenseTerm.fields.reuse_permission_class
        distinguishing_aspect: "The ladder is first-match-wins in a fixed order: share_alike=true reaches the COPYLEFT clause before the NONCOMMERCIAL fallback, so a share-alike non-commercial licence classifies as COPYLEFT and never as NONCOMMERCIAL."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "No licence exists yet"
          setup_api_calls:
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortalAdmin
          trigger:
            - call: "POST /open-data/licenses"
              payload: { code: "CC-BY-NC-SA-4.0", name: "Attribution NonCommercial ShareAlike 4.0", attribution_required: true, commercial_use_allowed: false, share_alike: true }
              as: PortalAdmin
          assert:
            - "Response is 201 with response.data.reuse_permission_class == COPYLEFT"
            - "response.data.reuse_permission_class is NOT NONCOMMERCIAL even though commercial_use_allowed == false"
            - "response.data.attribution_required == true, commercial_use_allowed == false, share_alike == true"

      - name: license_noncommercial_fallback_when_no_clause_matches
        claim_type: constraint_propagation
        grounds:
          - calculations.license_reuse_permission_class
        distinguishing_aspect: "With attribution_required=false, commercial_use_allowed=false and share_alike=false no clause of the ladder matches, so the else branch must apply and produce NONCOMMERCIAL rather than the UNRESTRICTED that the two false flags might suggest."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "No licence exists yet"
          setup_api_calls:
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortalAdmin
          trigger:
            - call: "POST /open-data/licenses"
              payload: { code: "CITY-INTERNAL-1.0", name: "City Internal Reuse Only", attribution_required: false, commercial_use_allowed: false, share_alike: false }
              as: PortalAdmin
          assert:
            - "Response is 201 with response.data.reuse_permission_class == NONCOMMERCIAL"
            - "response.data.reuse_permission_class is NOT UNRESTRICTED (clause 1 requires commercial_use_allowed == true)"

      - name: request_demand_signal_sums_snapshotted_vote_weights
        claim_type: aggregation
        grounds:
          - calculations.request_demand_signal
          - entities.DatasetRequest.fields.weighted_vote_total
          - entities.DatasetRequest.fields.demand_signal
        distinguishing_aspect: "Each vote stores the caster's vote_weight at cast time; two weight-2 members give weighted_vote_total 4 and demand_signal min(100, 5*4) = 20.00, and the running total is correct after each individual add (2 then 4)."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "Two registered members, each with reputation 50.00 and vote_weight 2"
            - "One OPEN DatasetRequest with no votes"
          setup_api_calls:
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortalAdmin
            - call: "POST /open-data/members/register"
              payload: { email: "ana@civic.example", display_name: "Ana Reuser", organization: "Civic Data Lab" }
              as: Anonymous
              captures: { mem_a_id: "$.data.id" }
            - call: "POST /open-data/members/register"
              payload: { email: "ben@civic.example", display_name: "Ben Mapper", organization: "Civic Data Lab" }
              as: Anonymous
              captures: { mem_b_id: "$.data.id" }
            - call: "POST /open-data/dataset-requests"
              payload: { requester_member_id: "${mem_a_id}", title: "Signal timing plans", rationale: "Needed to audit corridor delays" }
              as: CommunityMember
              as_user_id: "${mem_a_id}"
              captures: { req_id: "$.data.id" }
          trigger:
            - call: "POST /open-data/dataset-requests/${req_id}/votes"
              payload: { member_id: "${mem_a_id}" }
              as: CommunityMember
              as_user_id: "${mem_a_id}"
            - call: "POST /open-data/dataset-requests/${req_id}/votes"
              payload: { member_id: "${mem_b_id}" }
              as: CommunityMember
              as_user_id: "${mem_b_id}"
          assert:
            - "Before any vote DatasetRequest.${req_id}.weighted_vote_total == 0 and demand_signal == 0.00"
            - "After the first vote weighted_vote_total == 2 and demand_signal == 10.00"
            - "After the second vote weighted_vote_total == 4 and demand_signal == 20.00"
            - "DatasetRequest.${req_id}.votes has 2 entries and each stored weight == 2"
            - "DatasetRequest.${req_id}.status is still OPEN (votes alone do not transition the request)"

