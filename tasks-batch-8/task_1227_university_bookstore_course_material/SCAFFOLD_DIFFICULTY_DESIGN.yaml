scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: buyback_needs_vs_wholesale_same_copy
        grounds:
          - calculations.buyback_offer_price
          - entities.BuybackTicket.fields.pricing_variant
        distinguishing_aspect: |
          Same title, same condition, same clock position: the first copy prices NEEDS_BASED
          (round_half_up(0.50 * 10000) = 5000) while the demand quota is open, and an identical
          second copy prices WHOLESALE (2200) once the quota is consumed — dual-variant pricing
          on the BuybackTicket domain.
        test_recipe:
          setup:
            - "Term T1 (2026-FALL) driven to BUYBACK_OPEN; clock 2026-12-15T12:00:00Z inside its buyback window"
            - "Term T2 (2027-SPRING) holds an APPROVED adoption of the title with qty_used_requested = 1 (quota 1)"
            - "Wholesale quote GOOD 2200 active [2026-12-01, 2027-01-15)"
          setup_api_calls:
            - { call: "POST /bookstore/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /bookstore/terms", payload: { code: "2026-FALL", length_weeks: 16, registration_open_at: "2026-06-01T00:00:00Z", price_posting_deadline_at: "2026-06-01T00:00:00Z", adoption_deadline_at: "2026-06-15T23:59:59Z", aid_charge_window_start_at: "2026-08-01T00:00:00Z", aid_charge_window_end_at: "2026-09-15T23:59:59Z", add_drop_return_deadline_at: "2026-09-08T23:59:59Z", census_at: "2026-09-10T00:00:00Z", ia_opt_out_deadline_at: "2026-09-09T23:59:59Z", buyback_window_start_at: "2026-12-10T00:00:00Z", buyback_window_end_at: "2026-12-20T23:59:59Z", buy_budget_cents: 100000000 }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /bookstore/terms", payload: { code: "2027-SPRING", length_weeks: 16, registration_open_at: "2026-10-15T00:00:00Z", price_posting_deadline_at: "2026-11-01T00:00:00Z", adoption_deadline_at: "2026-11-15T23:59:59Z", aid_charge_window_start_at: "2027-01-05T00:00:00Z", aid_charge_window_end_at: "2027-02-15T23:59:59Z", add_drop_return_deadline_at: "2027-02-01T23:59:59Z", census_at: "2027-02-03T00:00:00Z", ia_opt_out_deadline_at: "2027-02-02T23:59:59Z", buyback_window_start_at: "2027-05-01T00:00:00Z", buyback_window_end_at: "2027-05-10T23:59:59Z", buy_budget_cents: 100000000 }, as: PlatformAdmin, captures: { t2: $.data.id } }
            - { call: "POST /bookstore/publishers", payload: { name: "Penguin" }, as: PlatformAdmin, captures: { pub: $.data.id } }
            - { call: "POST /bookstore/publishers/${pub}/agreements", payload: { start_date: "2026-01-01", end_date: "2027-06-30", discount_pct: 0.10, digital_discount_pct: 0.25, commission_pct: 0.08 }, as: PlatformAdmin }
            - { call: "POST /bookstore/titles", payload: { isbn: "9780000000001", publisher_id: "${pub}", list_price_cents: 10000, has_new: true, has_used: true, has_rental: true, has_digital: true }, as: PlatformAdmin, captures: { tit: $.data.id, tit_v: $.data.version } }
            - { call: "POST /bookstore/faculty", payload: { full_name: "Prof Ada", email: "ada@uni.edu" }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /bookstore/sections", payload: { term_id: "${t2}", faculty_id: "${fac}", course_code: "CS101", section_code: "01", enrollment_capacity: 30, ia_enabled: false }, as: PlatformAdmin, captures: { sec2: $.data.id } }
            - { call: "POST /bookstore/terms/${t2}/open-adoption", payload: {}, as: PlatformAdmin }
            - { call: "POST /bookstore/sections/${sec2}/open", payload: {}, as: PlatformAdmin, captures: { sec2_v: $.data.version } }
            - { call: "POST /bookstore/adoptions", payload: { section_id: "${sec2}", title_id: "${tit}", qty_new_requested: 0, qty_used_requested: 1, qty_rental_requested: 0, qty_digital_requested: 0, posted_price_cents: 9000, expected_section_version: "${sec2_v}" }, as: Faculty, as_user_id: "${fac}", captures: { ado2: $.data.id } }
            - { call: "POST /bookstore/adoptions/${ado2}/submit", payload: {}, as: Faculty, as_user_id: "${fac}" }
            - { call: "POST /bookstore/adoptions/${ado2}/start-review", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/adoptions/${ado2}/approve", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/terms/${t1}/open-adoption", payload: {}, as: PlatformAdmin }
            - { call: "POST /bookstore/terms/${t1}/close-adoption", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/terms/${t1}/open-sales", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /bookstore/terms/${t1}/run-census-billing", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/terms/${t1}/open-buyback", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/titles/${tit}/wholesale-quotes", payload: { condition: "GOOD", price_cents: 2200, effective_from: "2026-12-01T00:00:00Z", effective_to: "2027-01-15T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /bookstore/_clock/set_current_utc", payload: { to_iso8601: "2026-12-15T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /bookstore/students", payload: { full_name: "Stu One", email: "stu1@uni.edu", awarded_aid_cents: 100000 }, as: PlatformAdmin, captures: { stu: $.data.id } }
          trigger:
            - { call: "POST /bookstore/buyback-tickets", payload: { title_id: "${tit}", condition: "GOOD", upcoming_term_id: "${t2}", expected_title_version: "${tit_v}" }, as: Student, as_user_id: "${stu}", captures: { tk1: $.data.id } }
            - { call: "POST /bookstore/buyback-tickets/${tk1}/accept", payload: {}, as: Student, as_user_id: "${stu}" }
            - { call: "GET /bookstore/titles/${tit}", payload: {}, as: BookstoreManager, captures: { tit_v2: $.data.version } }
            - { call: "POST /bookstore/buyback-tickets", payload: { title_id: "${tit}", condition: "GOOD", upcoming_term_id: "${t2}", expected_title_version: "${tit_v2}" }, as: Student, as_user_id: "${stu}", captures: { tk2: $.data.id } }
          assert:
            - "BuybackTicket.${tk1}.pricing_variant == NEEDS_BASED"
            - "BuybackTicket.${tk1}.quoted_price_cents == 5000"
            - "BuybackTicket.${tk2}.pricing_variant == WHOLESALE"
            - "BuybackTicket.${tk2}.quoted_price_cents == 2200"

      - name: refund_within_window_vs_manager_override
        grounds:
          - calculations.order_line_refund
          - state_machines.OrderLine.FULFILLED_to_RETURNED
        distinguishing_aspect: |
          Identical USED line data (7500 aid-tendered): a return inside the add/drop window refunds
          7500, while a return after the deadline under manager override refunds
          round_half_up(0.80 * 7500) = 6000 — dual-variant refunds on the OrderLine domain,
          a different entity domain than buyback pricing.
        test_recipe:
          setup:
            - "Term T1 in SALES_OPEN; adoption APPROVED with posted_price_cents 8000; title initial_used_stock_qty 2"
            - "Two orders A and B each with one USED line (unit 7500, aid-tendered 7500); clock 2026-08-20 inside aid window and add/drop window"
          setup_api_calls:
            - { call: "POST /bookstore/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /bookstore/terms", payload: { code: "2026-FALL", length_weeks: 16, registration_open_at: "2026-06-01T00:00:00Z", price_posting_deadline_at: "2026-06-01T00:00:00Z", adoption_deadline_at: "2026-06-15T23:59:59Z", aid_charge_window_start_at: "2026-08-01T00:00:00Z", aid_charge_window_end_at: "2026-09-15T23:59:59Z", add_drop_return_deadline_at: "2026-09-08T23:59:59Z", census_at: "2026-09-10T00:00:00Z", ia_opt_out_deadline_at: "2026-09-09T23:59:59Z", buyback_window_start_at: "2026-12-10T00:00:00Z", buyback_window_end_at: "2026-12-20T23:59:59Z", buy_budget_cents: 100000000 }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /bookstore/publishers", payload: { name: "Penguin" }, as: PlatformAdmin, captures: { pub: $.data.id } }
            - { call: "POST /bookstore/publishers/${pub}/agreements", payload: { start_date: "2026-01-01", end_date: "2027-06-30", discount_pct: 0.10, digital_discount_pct: 0.25, commission_pct: 0.08 }, as: PlatformAdmin }
            - { call: "POST /bookstore/titles", payload: { isbn: "9780000000002", publisher_id: "${pub}", list_price_cents: 10000, has_new: true, has_used: true, has_rental: true, has_digital: true, initial_used_stock_qty: 2 }, as: PlatformAdmin, captures: { tit: $.data.id } }
            - { call: "POST /bookstore/faculty", payload: { full_name: "Prof Ada", email: "ada@uni.edu" }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /bookstore/students", payload: { full_name: "Stu One", email: "stu1@uni.edu", awarded_aid_cents: 100000 }, as: PlatformAdmin, captures: { stu: $.data.id } }
            - { call: "POST /bookstore/sections", payload: { term_id: "${t1}", faculty_id: "${fac}", course_code: "CS101", section_code: "01", enrollment_capacity: 30, ia_enabled: false }, as: PlatformAdmin, captures: { sec1: $.data.id } }
            - { call: "POST /bookstore/terms/${t1}/open-adoption", payload: {}, as: PlatformAdmin }
            - { call: "POST /bookstore/sections/${sec1}/open", payload: {}, as: PlatformAdmin, captures: { sec1_v: $.data.version } }
            - { call: "POST /bookstore/adoptions", payload: { section_id: "${sec1}", title_id: "${tit}", qty_new_requested: 0, qty_used_requested: 2, qty_rental_requested: 0, qty_digital_requested: 0, posted_price_cents: 8000, expected_section_version: "${sec1_v}" }, as: Faculty, as_user_id: "${fac}", captures: { ado1: $.data.id } }
            - { call: "POST /bookstore/adoptions/${ado1}/submit", payload: {}, as: Faculty, as_user_id: "${fac}" }
            - { call: "POST /bookstore/adoptions/${ado1}/start-review", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/adoptions/${ado1}/approve", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/terms/${t1}/close-adoption", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/terms/${t1}/open-sales", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /bookstore/orders", payload: { term_id: "${t1}", lines: [ { adoption_id: "${ado1}", format: "USED", qty: 1 } ] }, as: Student, as_user_id: "${stu}", captures: { ordA: $.data.id } }
            - { call: "POST /bookstore/orders", payload: { term_id: "${t1}", lines: [ { adoption_id: "${ado1}", format: "USED", qty: 1 } ] }, as: Student, as_user_id: "${stu}", captures: { ordB: $.data.id } }
            - { call: "GET /bookstore/orders/${ordA}/lines", payload: {}, as: BookstoreManager, captures: { lineA: "$.data[0].id" } }
            - { call: "GET /bookstore/orders/${ordB}/lines", payload: {}, as: BookstoreManager, captures: { lineB: "$.data[0].id" } }
          trigger:
            - { call: "POST /bookstore/orders/${ordA}/lines/${lineA}/return", payload: {}, as: Student, as_user_id: "${stu}" }
            - { call: "POST /bookstore/_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /bookstore/orders/${ordB}/lines/${lineB}/return", payload: { override: true }, as: BookstoreManager }
          assert:
            - "OrderLine.${lineA}.aid_refunded_cents == 7500"
            - "OrderLine.${lineB}.aid_refunded_cents == 6000"
            - "Order.${ordA}.refund_total_cents == 7500"
            - "Order.${ordB}.refund_total_cents == 6000"
            - "Student.${stu}.aid_balance_cents == 98500"

  - rule_id: combinatorial_formula
    instances:
      - name: shelf_price_format_tier_and_posted_cap
        grounds:
          - calculations.shelf_price_resolution
        distinguishing_aspect: |
          Mode (a) combinatorial: five inputs (format, list_price_cents, term.length_weeks,
          agreement.digital_discount_pct, adoption.posted_price_cents) interact through a tiered
          branch (rental 50% at 16 weeks) and a nested min() against the posted-price cap —
          NEW computes 10000 but is capped to 7000 while USED/RENTAL/DIGITAL land at
          7500/5000/7500.
        test_recipe:
          setup:
            - "Term T1 (length_weeks 16) in SALES_OPEN; APPROVED adoption posted_price_cents 7000; title list 10000 with stock new 5, used 5, rental 5; agreement digital_discount_pct 0.25; clock 2026-08-20"
          setup_api_calls:
            - { call: "POST /bookstore/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /bookstore/terms", payload: { code: "2026-FALL", length_weeks: 16, registration_open_at: "2026-06-01T00:00:00Z", price_posting_deadline_at: "2026-06-01T00:00:00Z", adoption_deadline_at: "2026-06-15T23:59:59Z", aid_charge_window_start_at: "2026-08-01T00:00:00Z", aid_charge_window_end_at: "2026-09-15T23:59:59Z", add_drop_return_deadline_at: "2026-09-08T23:59:59Z", census_at: "2026-09-10T00:00:00Z", ia_opt_out_deadline_at: "2026-09-09T23:59:59Z", buyback_window_start_at: "2026-12-10T00:00:00Z", buyback_window_end_at: "2026-12-20T23:59:59Z", buy_budget_cents: 100000000 }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /bookstore/publishers", payload: { name: "Penguin" }, as: PlatformAdmin, captures: { pub: $.data.id } }
            - { call: "POST /bookstore/publishers/${pub}/agreements", payload: { start_date: "2026-01-01", end_date: "2027-06-30", discount_pct: 0.10, digital_discount_pct: 0.25, commission_pct: 0.08 }, as: PlatformAdmin }
            - { call: "POST /bookstore/titles", payload: { isbn: "9780000000003", publisher_id: "${pub}", list_price_cents: 10000, has_new: true, has_used: true, has_rental: true, has_digital: true, initial_new_stock_qty: 5, initial_used_stock_qty: 5, initial_rental_stock_qty: 5 }, as: PlatformAdmin, captures: { tit: $.data.id } }
            - { call: "POST /bookstore/faculty", payload: { full_name: "Prof Ada", email: "ada@uni.edu" }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /bookstore/students", payload: { full_name: "Stu One", email: "stu1@uni.edu", awarded_aid_cents: 100000 }, as: PlatformAdmin, captures: { stu: $.data.id } }
            - { call: "POST /bookstore/sections", payload: { term_id: "${t1}", faculty_id: "${fac}", course_code: "CS101", section_code: "01", enrollment_capacity: 30, ia_enabled: false }, as: PlatformAdmin, captures: { sec1: $.data.id } }
            - { call: "POST /bookstore/terms/${t1}/open-adoption", payload: {}, as: PlatformAdmin }
            - { call: "POST /bookstore/sections/${sec1}/open", payload: {}, as: PlatformAdmin, captures: { sec1_v: $.data.version } }
            - { call: "POST /bookstore/adoptions", payload: { section_id: "${sec1}", title_id: "${tit}", qty_new_requested: 5, qty_used_requested: 5, qty_rental_requested: 5, qty_digital_requested: 5, posted_price_cents: 7000, expected_section_version: "${sec1_v}" }, as: Faculty, as_user_id: "${fac}", captures: { ado1: $.data.id } }
            - { call: "POST /bookstore/adoptions/${ado1}/submit", payload: {}, as: Faculty, as_user_id: "${fac}" }
            - { call: "POST /bookstore/adoptions/${ado1}/start-review", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/adoptions/${ado1}/approve", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/terms/${t1}/close-adoption", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/terms/${t1}/open-sales", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /bookstore/orders", payload: { term_id: "${t1}", lines: [ { adoption_id: "${ado1}", format: "NEW", qty: 1 }, { adoption_id: "${ado1}", format: "USED", qty: 1 }, { adoption_id: "${ado1}", format: "RENTAL", qty: 1 }, { adoption_id: "${ado1}", format: "DIGITAL", qty: 1 } ] }, as: Student, as_user_id: "${stu}", captures: { ord: $.data.id } }
          assert:
            - "GET /bookstore/orders/${ord}/lines (request order) unit_price_cents == [7000, 7500, 5000, 7500]"
            - "Order.${ord}.total_cents == 27000"
            - "Order.${ord}.aid_tendered_cents == 27000"
            - "Order.${ord}.card_tendered_cents == 0"

      - name: buyplan_tier_projection_evaluation_order
        grounds:
          - calculations.buyplan_landed_cost
          - state_machines.BuyPlan.DRAFT_to_COMMITTED
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the discount tier depends on projected cumulative
          committed units which include this plan, while the plan cost depends on the tier —
          pinned order (units -> tier -> unit cost -> total) gives plan2 landed cost
          50 * round_half_up(10000 * 0.88) = 440000, whereas per-plan tiering would give 450000.
          Different mode than shelf_price_resolution's mode (a).
        test_recipe:
          setup:
            - "Term T1 ADOPTION_OPEN; agreement discount_pct 0.10; title list 10000; two APPROVED adoptions (sec1, sec2) of the same title, each with a BuyPlan DRAFT"
          setup_api_calls:
            - { call: "POST /bookstore/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /bookstore/terms", payload: { code: "2026-FALL", length_weeks: 16, registration_open_at: "2026-06-01T00:00:00Z", price_posting_deadline_at: "2026-06-01T00:00:00Z", adoption_deadline_at: "2026-06-15T23:59:59Z", aid_charge_window_start_at: "2026-08-01T00:00:00Z", aid_charge_window_end_at: "2026-09-15T23:59:59Z", add_drop_return_deadline_at: "2026-09-08T23:59:59Z", census_at: "2026-09-10T00:00:00Z", ia_opt_out_deadline_at: "2026-09-09T23:59:59Z", buyback_window_start_at: "2026-12-10T00:00:00Z", buyback_window_end_at: "2026-12-20T23:59:59Z", buy_budget_cents: 100000000 }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /bookstore/publishers", payload: { name: "Penguin" }, as: PlatformAdmin, captures: { pub: $.data.id } }
            - { call: "POST /bookstore/publishers/${pub}/agreements", payload: { start_date: "2026-01-01", end_date: "2027-06-30", discount_pct: 0.10, digital_discount_pct: 0.25, commission_pct: 0.08 }, as: PlatformAdmin }
            - { call: "POST /bookstore/titles", payload: { isbn: "9780000000004", publisher_id: "${pub}", list_price_cents: 10000, has_new: true, has_used: false, has_rental: false, has_digital: false }, as: PlatformAdmin, captures: { tit: $.data.id } }
            - { call: "POST /bookstore/faculty", payload: { full_name: "Prof Ada", email: "ada@uni.edu" }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /bookstore/sections", payload: { term_id: "${t1}", faculty_id: "${fac}", course_code: "CS101", section_code: "01", enrollment_capacity: 30, ia_enabled: false }, as: PlatformAdmin, captures: { sec1: $.data.id } }
            - { call: "POST /bookstore/sections", payload: { term_id: "${t1}", faculty_id: "${fac}", course_code: "CS102", section_code: "01", enrollment_capacity: 30, ia_enabled: false }, as: PlatformAdmin, captures: { sec2: $.data.id } }
            - { call: "POST /bookstore/terms/${t1}/open-adoption", payload: {}, as: PlatformAdmin }
            - { call: "POST /bookstore/sections/${sec1}/open", payload: {}, as: PlatformAdmin, captures: { sec1_v: $.data.version } }
            - { call: "POST /bookstore/sections/${sec2}/open", payload: {}, as: PlatformAdmin, captures: { sec2_v: $.data.version } }
            - { call: "POST /bookstore/adoptions", payload: { section_id: "${sec1}", title_id: "${tit}", qty_new_requested: 60, qty_used_requested: 0, qty_rental_requested: 0, qty_digital_requested: 0, posted_price_cents: 10000, expected_section_version: "${sec1_v}" }, as: Faculty, as_user_id: "${fac}", captures: { ado1: $.data.id } }
            - { call: "POST /bookstore/adoptions/${ado1}/submit", payload: {}, as: Faculty, as_user_id: "${fac}" }
            - { call: "POST /bookstore/adoptions/${ado1}/start-review", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/adoptions/${ado1}/approve", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/adoptions", payload: { section_id: "${sec2}", title_id: "${tit}", qty_new_requested: 50, qty_used_requested: 0, qty_rental_requested: 0, qty_digital_requested: 0, posted_price_cents: 10000, expected_section_version: "${sec2_v}" }, as: Faculty, as_user_id: "${fac}", captures: { ado2: $.data.id } }
            - { call: "POST /bookstore/adoptions/${ado2}/submit", payload: {}, as: Faculty, as_user_id: "${fac}" }
            - { call: "POST /bookstore/adoptions/${ado2}/start-review", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/adoptions/${ado2}/approve", payload: {}, as: BookstoreManager }
            - { call: "GET /bookstore/adoptions/${ado1}/buy-plan", payload: {}, as: BookstoreManager, captures: { bp1: "$.data[0].id" } }
            - { call: "GET /bookstore/adoptions/${ado2}/buy-plan", payload: {}, as: BookstoreManager, captures: { bp2: "$.data[0].id" } }
            - { call: "PATCH /bookstore/buy-plans/${bp1}", payload: { qty_new: 60, qty_used: 0, qty_rental: 0, qty_digital: 0 }, as: BookstoreManager, captures: { bp1_v: $.data.version } }
            - { call: "PATCH /bookstore/buy-plans/${bp2}", payload: { qty_new: 50, qty_used: 0, qty_rental: 0, qty_digital: 0 }, as: BookstoreManager, captures: { bp2_v: $.data.version } }
          trigger:
            - { call: "POST /bookstore/buy-plans/${bp1}/commit", payload: { expected_buy_plan_version: "${bp1_v}" }, as: BookstoreManager }
            - { call: "POST /bookstore/buy-plans/${bp2}/commit", payload: { expected_buy_plan_version: "${bp2_v}" }, as: BookstoreManager }
          assert:
            - "BuyPlan.${bp1}.tier_bonus_applied == false"
            - "BuyPlan.${bp1}.landed_cost_cents == 540000"
            - "BuyPlan.${bp2}.tier_bonus_applied == true"
            - "BuyPlan.${bp2}.discount_pct_applied == 0.12"
            - "BuyPlan.${bp2}.landed_cost_cents == 440000"
  - rule_id: non_linear_state_machine
    instances:
      - name: adoption_revision_cycle
        grounds:
          - state_machines.Adoption.RETURNED_to_DRAFT
          - state_machines.Adoption.DRAFT_to_SUBMITTED
