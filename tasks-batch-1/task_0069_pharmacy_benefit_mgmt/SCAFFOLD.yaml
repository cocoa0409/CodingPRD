scenario: "69. Pharmacy Benefit Management (PBM): formulary tiering, Step Therapy, prior authorization, Copay Card, 90-day mail order, Specialty Pharmacy, rebate clawback"
domain_name: pharmacy-benefit-management
api_prefix: /pbm

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Compliance / audit
  complexity_layers:
    - Optimistic concurrency
    - Cascading side effects
    - Dual-variant calculation
    - Rate / threshold triggers

  entity_topology: flat
  # Peer entities (Member, Plan, FormularyDrug, Claim, PriorAuthorization,
  # CopayCard, StepTherapyProtocol, RebateAgreement, RebateAccrual) linked by
  # foreign keys; no nesting in URL paths. Claim is the central ledger row that
  # references Member + FormularyDrug and drives accumulator + rebate side
  # effects across the other entities.

  state_machine_shape: branching
  # PriorAuthorization branches APPROVE-or-DENY from PENDING_REVIEW, and a
  # denied PA can be APPEALED back into review (revert), so the PA machine is
  # branching-with-revert. Claim has a parallel pair of dimensions
  # (adjudication_status × rebate_status) that evolve independently on the
  # same row.

  relationship_patterns:
    - one_to_many   # Member 1:* Claim ; BenefitPlan 1:* Member
    - flat_references  # Claim -> FormularyDrug, Claim -> CopayCard (nullable)
    - cross_aggregate  # Claim adjudication reads Member accumulators + Plan config + PA state

  role_model: segregation_of_duties
  # A PharmacistReviewer who SUBMITS a PriorAuthorization may not be the
  # MedicalDirector who APPROVES/DENIES it; clinical approval is segregated
  # from intake. PharmacyProvider adjudicates claims; PlanAdmin configures
  # plans/formulary/rebates.

  consistency_model: immediate
  # Every accumulator debit, rebate accrual, and copay-card draw is applied
  # atomically within the adjudicating request.

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: BenefitPlan
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Plan display name
      - name: plan_year
        type: integer
        source: input
        description: Calendar benefit year (e.g., 2026); accumulators reset per year
      - name: deductible_cents
        type: integer
        source: input
        description: Annual individual deductible in cents; member pays 100% until met
        constraints: ">= 0"
      - name: oop_max_cents
        type: integer
        source: input
        description: Annual out-of-pocket maximum in cents; member pays 0 after met
        constraints: ">= deductible_cents"
      - name: tier_copay_cents
        type: object
        source: input
        description: >
          Map tier label -> flat member copay in cents after deductible is met,
          for retail 30-day fills. Keys MUST be exactly TIER_1, TIER_2, TIER_3,
          SPECIALTY. Example { "TIER_1": 1000, "TIER_2": 3500, "TIER_3": 7000,
          "SPECIALTY": 25000 }.
        constraints: "all four keys required; values >= 0"
      - name: mail_order_copay_multiplier
        type: number
        source: input
        description: >
          Multiplier applied to a single 30-day tier copay to price a 90-day
          mail-order fill (e.g., 2.0 = pay 2 copays for a 90-day supply).
        default: 2.0
        constraints: "> 0"
      - name: specialty_requires_specialty_pharmacy
        type: boolean
        source: input
        description: >
          When true, a claim for a FormularyDrug with is_specialty=true is
          rejected unless pharmacy_type=SPECIALTY on the claim.
        default: true
      - name: status
        type: enum
        source: system
        description: Plan lifecycle; ACTIVE on create, ARCHIVED after archive
        default: ACTIVE
        constraints: "one of ACTIVE, ARCHIVED"

  - name: FormularyDrug
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: FK -> BenefitPlan.id; the plan whose formulary lists this drug
      - name: ndc
        type: string
        source: input
        description: National Drug Code identifier string
      - name: drug_name
        type: string
        source: input
        description: Display name of the drug
      - name: tier
        type: enum
        source: input
        description: Formulary tier
        constraints: "one of TIER_1, TIER_2, TIER_3, SPECIALTY"
      - name: ingredient_cost_cents
        type: integer
        source: input
        description: Plan-allowed ingredient cost in cents for a 30-day supply
        constraints: "> 0"
      - name: is_specialty
        type: boolean
        source: input
        description: Whether the drug is a specialty product
        default: false
      - name: pa_required
        type: boolean
        source: input
        description: Whether an APPROVED PriorAuthorization is required to adjudicate
        default: false
      - name: step_therapy_protocol_id
        type: string
        source: input
        description: >
          FK -> StepTherapyProtocol.id; null when this drug has no step-therapy
          gate. When set, the member must have a prior PAID claim for one of the
          protocol's first-line NDCs (or an APPROVED PA that overrides step).
        default: null
      - name: rebate_per_fill_cents
        type: integer
        source: input
        description: >
          Manufacturer rebate accrued to the plan per PAID 30-day-equivalent fill
          of this drug, in cents. 90-day fills accrue 3x.
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: ACTIVE on create; INACTIVE after delisting (soft removal)
        default: ACTIVE
        constraints: "one of ACTIVE, INACTIVE"

  - name: StepTherapyProtocol
    parent: null
    common_fields: false
    fields:
      - name: plan_id
        type: string
        source: input
        description: FK -> BenefitPlan.id; the plan this protocol belongs to
      - name: name
        type: string
        source: input
        description: Protocol display name
      - name: first_line_ndcs
        type: array
        source: input
        description: >
          List of NDC strings that satisfy the step requirement. A member
          satisfies the protocol when they hold >=1 PAID Claim for a
          FormularyDrug whose ndc is in this list.
        constraints: "non-empty array of strings"

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: FK -> BenefitPlan.id; the plan that adjudicates this member's claims
      - name: full_name
        type: string
        source: input
        description: Member full name
      - name: deductible_met_cents
        type: integer
        source: computed
        description: >
          Sum of member-paid amounts that count toward the deductible, derived
          per acc_deductible_met from this member's PAID claims. Recomputed on
          every claim adjudication and reversal. Starts at 0.
        default: 0
      - name: oop_met_cents
        type: integer
        source: computed
        description: >
          Sum of member out-of-pocket spend counting toward the OOP maximum,
          derived per acc_oop_met. Recomputed on every claim adjudication and
          reversal. Starts at 0.
        default: 0
      - name: status
        type: enum
        source: system
        description: ACTIVE on create; TERMINATED after termination (no new claims)
        default: ACTIVE
        constraints: "one of ACTIVE, TERMINATED"

  - name: PriorAuthorization
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: FK -> Member.id; the member the PA covers
      - name: formulary_drug_id
        type: string
        source: input
        description: FK -> FormularyDrug.id; the drug the PA authorizes
      - name: submitted_by_user_id
        type: string
        source: system
        description: >
          X-User-ID of the PharmacistReviewer who submitted the PA; persisted so
          the segregation-of-duties check can reject self-approval.
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the MedicalDirector who approved or denied; null until decided
        default: null
      - name: overrides_step_therapy
        type: boolean
        source: input
        description: When true, an APPROVED PA also satisfies any step-therapy gate on the drug
        default: false
      - name: status
        type: enum
        source: system
        description: PA review lifecycle
        default: PENDING_REVIEW
        constraints: "one of PENDING_REVIEW, APPROVED, DENIED, APPEALED, EXPIRED"
      - name: approved_quantity_remaining
        type: integer
        source: system
        description: >
          Number of PAID fills still authorized by this PA. Set to authorized_fills
          on APPROVE; decremented by 1 on each PAID claim that consumes it; the PA
          auto-transitions to EXPIRED when it reaches 0.
        default: 0
      - name: authorized_fills
        type: integer
        source: input
        description: Total fills the PA authorizes once approved
        constraints: ">= 1"
      - name: valid_through_date
        type: datetime
        source: input
        description: >
          ISO 8601 date-time (UTC) through which an APPROVED PA may be consumed.
          A claim's fill_date must be STRICTLY BEFORE valid_through_date — the
          window is half-open [PA decided, valid_through_date): a fill exactly at
          valid_through_date is rejected (PA window is exclusive at the upper end).

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: FK -> Member.id; the member submitting the claim
      - name: formulary_drug_id
        type: string
        source: input
        description: FK -> FormularyDrug.id; the drug being dispensed
      - name: copay_card_id
        type: string
        source: input
        description: >
          FK -> CopayCard.id; optional manufacturer copay card applied to reduce
          member out-of-pocket. Null when no card is used.
        default: null
      - name: days_supply
        type: integer
        source: input
        description: Days of supply dispensed; MUST be exactly 30 or 90
        constraints: "one of 30, 90"
      - name: pharmacy_type
        type: enum
        source: input
        description: Dispensing channel
        constraints: "one of RETAIL, MAIL_ORDER, SPECIALTY"
      - name: prior_auth_id
        type: string
        source: input
        description: >
          FK -> PriorAuthorization.id; the APPROVED PA consumed by this claim when
          the drug has pa_required=true. Null otherwise.
        default: null
      - name: fill_date
        type: datetime
        source: system
        description: >
          ISO 8601 UTC timestamp the claim was filled; stamped from the server
          clock (set via POST /_clock/set, default 1970-01-01T00:00:00.000Z if
          never set). Defines the start of this fill's supply window.
      - name: supply_end_date
        type: datetime
        source: computed
        description: >
          fill_date + days_supply days. The supply window is half-open
          [fill_date, supply_end_date): a new same-member+same-drug fill whose
          fill_date is < an existing PAID fill's supply_end_date is a refill-too-
          soon overlap (see ERR_REFILL_TOO_SOON). A fill exactly AT a prior
          window's supply_end_date is allowed (adjacency, not overlap).
      - name: gross_cost_cents
        type: integer
        source: computed
        description: Plan-allowed ingredient cost for this fill, per calc_gross_cost
        default: 0
      - name: member_pay_cents
        type: integer
        source: computed
        description: Member responsibility before copay-card assistance, per calc_member_pay
        default: 0
      - name: copay_card_paid_cents
        type: integer
        source: computed
        description: Portion of member_pay covered by the copay card, per calc_copay_card_draw
        default: 0
      - name: plan_paid_cents
        type: integer
        source: computed
        description: "Plan responsibility: gross_cost_cents - member_pay_cents"
        default: 0
      - name: adjudication_status
        type: enum
        source: system
        description: Adjudication dimension of the claim
        default: SUBMITTED
        constraints: "one of SUBMITTED, PAID, REVERSED, REJECTED"
      - name: rebate_status
        type: enum
        source: system
        description: >
          Rebate dimension, independent of adjudication_status. ACCRUED when a
          RebateAccrual is created on PAID; CLAWED_BACK when the claim is reversed
          after rebate finalization; NONE when no rebate applies.
        default: NONE
        constraints: "one of NONE, ACCRUED, CLAWED_BACK"

  - name: CopayCard
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: FK -> Member.id; the member the card belongs to
      - name: formulary_drug_id
        type: string
        source: input
        description: FK -> FormularyDrug.id; the drug the card subsidizes
      - name: max_benefit_cents
        type: integer
        source: input
        description: Lifetime card benefit cap in cents
        constraints: "> 0"
      - name: benefit_used_cents
        type: integer
        source: computed
        description: >
          Total drawn from the card across PAID claims, per calc_copay_card_draw.
          Recomputed on adjudication and reversal. Starts at 0.
        default: 0
      - name: status
        type: enum
        source: system
        description: ACTIVE on create; EXHAUSTED when benefit_used_cents == max_benefit_cents
        default: ACTIVE
        constraints: "one of ACTIVE, EXHAUSTED"

  - name: RebateAgreement
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: FK -> BenefitPlan.id; the plan that earns rebates under this agreement
      - name: manufacturer_name
        type: string
        source: input
        description: Manufacturer party to the agreement
      - name: clawback_pct
        type: number
        source: input
        description: >
          Fraction of an accrued rebate that the manufacturer reclaims when the
          underlying claim is reversed after the accrual is FINALIZED (0..1).
        default: 1.0
        constraints: "0 <= clawback_pct <= 1"

  - name: RebateAccrual
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: FK -> Claim.id; the PAID claim that generated this accrual
      - name: rebate_agreement_id
        type: string
        source: input
        description: FK -> RebateAgreement.id; the agreement crediting the rebate
      - name: accrued_cents
        type: integer
        source: computed
        description: Provisional rebate credited at PAID time, per calc_rebate_accrual
        default: 0
      - name: clawback_cents
        type: integer
        source: computed
        description: >
          Amount reclaimed when the claim is reversed after finalization, per
          calc_rebate_clawback. 0 while status is PROVISIONAL.
        default: 0
      - name: status
        type: enum
        source: system
        description: >
          PROVISIONAL on create; FINALIZED after the plan-admin finalize sweep;
          CLAWED_BACK after a reversal of the underlying claim post-finalization.
        default: PROVISIONAL
        constraints: "one of PROVISIONAL, FINALIZED, CLAWED_BACK"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PriorAuthorization
    initial_state: PENDING_REVIEW
    terminal_states: [EXPIRED]
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /prior-authorizations/{id}/decide with decision=APPROVE"
        actor: MedicalDirector
        preconditions:
          - "PA.status == PENDING_REVIEW"
          - "X-User-ID != PA.submitted_by_user_id (segregation of duties)"
        side_effects:
          - "set PA.decided_by_user_id = X-User-ID"
          - "set PA.approved_quantity_remaining = PA.authorized_fills"
          - "increments PriorAuthorization.version by 1"
      - from: PENDING_REVIEW
        to: DENIED
        trigger: "POST /prior-authorizations/{id}/decide with decision=DENY"
        actor: MedicalDirector
        preconditions:
          - "PA.status == PENDING_REVIEW"
          - "X-User-ID != PA.submitted_by_user_id (segregation of duties)"
        side_effects:
          - "set PA.decided_by_user_id = X-User-ID"
          - "increments PriorAuthorization.version by 1"
      - from: DENIED
        to: APPEALED
        trigger: "POST /prior-authorizations/{id}/appeal"
        actor: PharmacistReviewer
        preconditions:
          - "PA.status == DENIED"
        side_effects:
          - "clear PA.decided_by_user_id = null"
          - "increments PriorAuthorization.version by 1"
        note: "Revert edge — a denied PA loops back toward review."
      - from: APPEALED
        to: APPROVED
        trigger: "POST /prior-authorizations/{id}/decide with decision=APPROVE"
        actor: MedicalDirector
        preconditions:
          - "PA.status == APPEALED"
          - "X-User-ID != PA.submitted_by_user_id (segregation of duties)"
        side_effects:
          - "set PA.decided_by_user_id = X-User-ID"
          - "set PA.approved_quantity_remaining = PA.authorized_fills"
          - "increments PriorAuthorization.version by 1"
      - from: APPEALED
        to: DENIED
        trigger: "POST /prior-authorizations/{id}/decide with decision=DENY"
        actor: MedicalDirector
        preconditions:
          - "PA.status == APPEALED"
          - "X-User-ID != PA.submitted_by_user_id (segregation of duties)"
        side_effects:
          - "set PA.decided_by_user_id = X-User-ID"
          - "increments PriorAuthorization.version by 1"
      - from: APPROVED
        to: EXPIRED
        trigger: "system: a PAID claim consumes the last authorized fill"
        actor: system
        preconditions:
          - "PA.approved_quantity_remaining == 0 after decrement"
        side_effects:
          - "increments PriorAuthorization.version by 1"
        note: "Auto-transition on accumulator exhaustion."

  - entity: Claim
    initial_state: SUBMITTED
    terminal_states: [REJECTED]
    transitions:
      - from: SUBMITTED
        to: PAID
        trigger: "POST /claims (adjudication runs inline on submit and succeeds)"
        actor: PharmacyProvider
        preconditions:
          - "Member.status == ACTIVE"
          - "FormularyDrug.status == ACTIVE"
          - "BenefitPlan.status == ACTIVE"
          - "if FormularyDrug.pa_required: prior_auth_id references an APPROVED PA for the same member+drug with approved_quantity_remaining >= 1"
          - "if FormularyDrug.step_therapy_protocol_id set: step satisfied per calc_step_satisfied"
          - "if FormularyDrug.is_specialty and Plan.specialty_requires_specialty_pharmacy: pharmacy_type == SPECIALTY"
          - "if pharmacy_type == MAIL_ORDER: days_supply == 90"
          - "if prior_auth_id set: fill_date < PA.valid_through_date (half-open window, upper bound exclusive)"
          - "no existing PAID same-member+drug claim has supply_end_date > this fill_date (refill-too-soon; adjacency allowed)"
        side_effects:
          - "stamp fill_date = server clock; compute supply_end_date = fill_date + days_supply days"
          - "compute gross_cost_cents (calc_gross_cost), member_pay_cents (calc_member_pay), copay_card_paid_cents (calc_copay_card_draw), plan_paid_cents"
          - "recompute Member.deductible_met_cents (acc_deductible_met) and Member.oop_met_cents (acc_oop_met)"
          - "if copay_card_id set: recompute CopayCard.benefit_used_cents; set CopayCard.status=EXHAUSTED when it equals max_benefit_cents"
          - "if prior_auth_id set: decrement PA.approved_quantity_remaining by 1; PA auto-EXPIRES at 0 (cascade)"
          - "if FormularyDrug.rebate_per_fill_cents > 0 and a RebateAgreement exists for the plan: create RebateAccrual (calc_rebate_accrual); set Claim.rebate_status=ACCRUED"
          - "set adjudication_status=PAID"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /claims (adjudication runs inline and a business rule fails)"
        actor: PharmacyProvider
        preconditions:
          - "any §1.4 business validation for claim adjudication fails"
        side_effects:
          - "set adjudication_status=REJECTED; no accumulator, copay-card, PA, or rebate side effects fire"
        note: "Rejected claims are terminal and persist as an audit record."
      - from: PAID
        to: REVERSED
        trigger: "POST /claims/{id}/reverse"
        actor: PharmacyProvider
        preconditions:
          - "Claim.adjudication_status == PAID"
        side_effects:
          - "recompute Member.deductible_met_cents and Member.oop_met_cents excluding this claim (acc_deductible_met / acc_oop_met)"
          - "if copay_card_id set: recompute CopayCard.benefit_used_cents excluding this claim; if it drops below max_benefit_cents set CopayCard.status=ACTIVE"
          - "if prior_auth_id set and PA not EXPIRED-and-consumed-elsewhere: increment PA.approved_quantity_remaining by 1 (restore the consumed fill)"
          - "if a RebateAccrual exists for this claim: if its status==PROVISIONAL delete it and set Claim.rebate_status=NONE; if its status==FINALIZED set clawback (calc_rebate_clawback), set accrual.status=CLAWED_BACK and Claim.rebate_status=CLAWED_BACK"
          - "set adjudication_status=REVERSED"

  - entity: RebateAccrual
    initial_state: PROVISIONAL
    terminal_states: [CLAWED_BACK]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /plans/{id}/finalize-rebates"
        actor: PlanAdmin
        preconditions:
          - "RebateAccrual.status == PROVISIONAL"
          - "underlying Claim.adjudication_status == PAID"
        side_effects:
          - "set RebateAccrual.status=FINALIZED"
          - "increments RebateAccrual.version by 1"
        note: "Sweep finalizes all PROVISIONAL accruals for PAID claims under the plan."
      - from: FINALIZED
        to: CLAWED_BACK
        trigger: "system: underlying Claim transitions PAID->REVERSED"
        actor: system
        preconditions:
          - "RebateAccrual.status == FINALIZED"
        side_effects:
          - "set RebateAccrual.clawback_cents (calc_rebate_clawback)"
          - "set Claim.rebate_status=CLAWED_BACK"
          - "increments RebateAccrual.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: pa-decide-stale-version
    parent_entity: PriorAuthorization
    write_endpoint: "POST /prior-authorizations/{id}/decide"
    occ_field: "expected_prior_authorization_version"
    description: |
      Deciding a PriorAuthorization whose version has advanced since the
      MedicalDirector last observed it is rejected. This captures the case
      where the PA was appealed and re-decided (legitimately advancing the
      version) and the current director's view of the PA is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: rebate-finalize-stale-plan-version
    parent_entity: BenefitPlan
    write_endpoint: "POST /plans/{id}/finalize-rebates"
    occ_field: "expected_benefit_plan_version"
    description: |
      Running the rebate-finalization sweep against a BenefitPlan whose version
      has advanced since the PlanAdmin last observed it is rejected. This
      captures the case where the plan's formulary or rebate configuration was
      edited (legitimately advancing the version) so the sweep would finalize
      against a stale rebate basis.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: calc_gross_cost
    trigger: "Claim adjudication on POST /claims (SUBMITTED->PAID)"
    algorithm: tiered_pricing
    formula: |
      # Plan-allowed ingredient cost scaled by days supply.
      # ingredient_cost_cents is the allowed 30-day amount.
      if days_supply == 30:
          gross_cost_cents = FormularyDrug.ingredient_cost_cents
      elif days_supply == 90:
          gross_cost_cents = FormularyDrug.ingredient_cost_cents * 3
    input_set: "the single FormularyDrug referenced by the claim"
    precision: "integer cents, exact"

  - name: calc_member_pay
    trigger: "Claim adjudication on POST /claims (SUBMITTED->PAID), after calc_gross_cost"
    algorithm: waterfall_allocation
    formula: |
      # Forward-looking member responsibility BEFORE copay-card assistance.
      # Evaluation order is fixed: deductible bucket first, then copay bucket,
      # then the OOP-max ceiling clamps the running total.
      #
      # remaining_deductible and remaining_oop are read from the member's CURRENT
      # accumulator fields (deductible_met_cents, oop_met_cents) BEFORE this claim.
      remaining_deductible = max(0, Plan.deductible_cents - Member.deductible_met_cents)
      remaining_oop        = max(0, Plan.oop_max_cents     - Member.oop_met_cents)

      # 1. Deductible phase: member pays gross up to remaining_deductible.
      ded_portion = min(gross_cost_cents, remaining_deductible)
      post_ded    = gross_cost_cents - ded_portion

      # 2. Copay phase on the post-deductible remainder. The copay is a FLAT
      #    per-fill amount selected from Plan.tier_copay_cents[FormularyDrug.tier],
      #    multiplied by mail_order_copay_multiplier ONLY when
      #    pharmacy_type == MAIL_ORDER (a 90-day mail fill = multiplier copays).
      base_copay = Plan.tier_copay_cents[FormularyDrug.tier]
      if pharmacy_type == "MAIL_ORDER":
          copay = round_half_up(base_copay * Plan.mail_order_copay_multiplier)
      else:
          copay = base_copay
      # The member never pays copay on dollars still inside the deductible:
      copay_portion = min(copay, post_ded)

      member_pay_uncapped = ded_portion + copay_portion

      # 3. OOP-max ceiling clamps total member spend for the year.
      member_pay_cents = min(member_pay_uncapped, remaining_oop)
    input_set: "this claim's gross cost; member's pre-claim accumulators; plan config"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents, round_half_up on the multiplier step only"
    variants:
      - name: retail_30
        when: "pharmacy_type in {RETAIL, SPECIALTY} and days_supply==30"
        difference: "copay = base tier copay, no multiplier"
      - name: mail_order_90
        when: "pharmacy_type==MAIL_ORDER and days_supply==90"
        difference: "copay = round_half_up(base tier copay * mail_order_copay_multiplier)"

  - name: calc_copay_card_draw
    trigger: "Claim adjudication on POST /claims (SUBMITTED->PAID), after calc_member_pay"
    algorithm: waterfall_allocation
    formula: |
      # The manufacturer copay card pays down member_pay, capped by the card's
      # REMAINING benefit. Card benefit_used_cents reflects PAID claims only.
      if copay_card_id is null:
          copay_card_paid_cents = 0
      else:
          card_remaining = CopayCard.max_benefit_cents - CopayCard.benefit_used_cents
          copay_card_paid_cents = min(member_pay_cents, card_remaining)
      # IMPORTANT: copay-card dollars do NOT reduce the amounts already applied
      # to deductible_met_cents / oop_met_cents — those use member_pay_cents
      # (the "true out-of-pocket" / accumulator-eligible figure) computed BEFORE
      # card assistance. See acc_deductible_met / acc_oop_met.
    input_set: "this claim's member_pay_cents; the referenced card's remaining benefit"
    precision: "integer cents, exact"

  - name: acc_deductible_met
    trigger: "Member accumulator recompute on Claim PAID and on Claim REVERSED"
    algorithm: aggregation
    formula: |
      # Chronological running sum over the member's PAID claims, processed in
      # created_at ASC order (tie-break: created_at ASC, then nothing else —
      # created_at is unique per claim in this benchmark's test data).
      # The deductible-eligible portion of each claim is the ded_portion that
      # calc_member_pay computed for it: min(gross_cost_at_claim, remaining_
      # deductible_at_that_point). We re-derive it by replaying claims in order.
      deductible_met_cents = 0
      for c in member.claims where adjudication_status == PAID order by created_at ASC:
          rem_ded = max(0, Plan.deductible_cents - deductible_met_cents)
          ded_portion = min(c.gross_cost_cents, rem_ded)
          deductible_met_cents += ded_portion
      # On REVERSED recompute, the reversed claim is excluded from the set, so
      # the running sum is rebuilt without it (chronological, NOT a simple
      # subtraction — later claims' ded_portion may shift).
    input_set: "member's PAID claims only, ordered by created_at ASC"
    precision: "integer cents, exact"
    variants:
      - name: on_adjudication
        when: "a new claim just turned PAID"
        difference: "the new claim is included in the chronological replay"
      - name: on_reversal
        when: "an existing PAID claim just turned REVERSED"
        difference: "the reversed claim is excluded; downstream claims' deductible portions are recomputed from the shifted baseline"

  - name: acc_oop_met
    trigger: "Member accumulator recompute on Claim PAID and on Claim REVERSED"
    algorithm: aggregation
    formula: |
      # Out-of-pocket counts the member's OWN spend (member_pay_cents), NOT the
      # portion paid by the copay card. Chronological running sum over PAID
      # claims in created_at ASC order, clamped at oop_max_cents.
      oop_met_cents = 0
      for c in member.claims where adjudication_status == PAID order by created_at ASC:
          true_oop = c.member_pay_cents - c.copay_card_paid_cents
          oop_met_cents = min(Plan.oop_max_cents, oop_met_cents + true_oop)
    input_set: "member's PAID claims only, ordered by created_at ASC"
    precision: "integer cents, exact"

  - name: calc_rebate_accrual
    trigger: "Claim PAID side effect, when rebate_per_fill_cents>0 and a RebateAgreement exists for the plan"
    algorithm: threshold
    formula: |
      # 30-day-equivalent multiplier: a 90-day fill accrues 3x the per-fill rebate.
      fills_equiv = 1 if days_supply == 30 else 3
      accrued_cents = FormularyDrug.rebate_per_fill_cents * fills_equiv
    input_set: "the claim's drug and days_supply; the plan's RebateAgreement"
    precision: "integer cents, exact"
    variants:
      - name: provisional
        when: "RebateAccrual.status == PROVISIONAL (created at PAID time)"
        difference: "accrued_cents is the credited estimate; deletable on early reversal with NO clawback"
      - name: finalized
        when: "RebateAccrual.status == FINALIZED (after finalize sweep)"
        difference: "the same accrued_cents is locked; a later reversal triggers calc_rebate_clawback instead of deletion"

  - name: calc_rebate_clawback
    trigger: "RebateAccrual FINALIZED->CLAWED_BACK, when its claim is reversed after finalization"
    algorithm: threshold
    formula: |
      clawback_cents = round_half_up(RebateAccrual.accrued_cents * RebateAgreement.clawback_pct)
    input_set: "the finalized accrual and its agreement's clawback_pct"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents, round_half_up"

  - name: calc_step_satisfied
    trigger: "Claim adjudication precondition when FormularyDrug.step_therapy_protocol_id is set"
    algorithm: aggregation
    formula: |
      # The member satisfies the step gate when EITHER:
      #   (a) an APPROVED PA on prior_auth_id has overrides_step_therapy == true, OR
      #   (b) the member holds >=1 PAID Claim for a FormularyDrug whose ndc is in
      #       protocol.first_line_ndcs.
      protocol = StepTherapyProtocol[FormularyDrug.step_therapy_protocol_id]
      if prior_auth_id set and PA.status == APPROVED and PA.overrides_step_therapy:
          satisfied = true
      else:
          paid_first_line = count(
              Claim where member_id == this.member_id
                        and adjudication_status == PAID
                        and FormularyDrug(Claim.formulary_drug_id).ndc in protocol.first_line_ndcs)
          satisfied = paid_first_line >= 1
    input_set: "member's PAID claims; the drug's protocol first_line_ndcs; optional overriding PA"
    precision: "boolean"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist (validated left-to-right: member, drug, plan, PA, copay_card)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"

  - priority: 4
    category: state
    check: "Target resource is in a state that permits the requested transition (e.g., PA PENDING_REVIEW/APPEALED to decide; Claim PAID to reverse; accrual PROVISIONAL to finalize)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "decide, appeal, reverse, finalize-rebates"

  - priority: 5
    category: business_safety
    check: "Segregation of duties: on PA decide, X-User-ID != PA.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /prior-authorizations/{id}/decide"

  - priority: 6
    category: state
    check: "On POST /claims, Member.status==ACTIVE and FormularyDrug.status==ACTIVE and BenefitPlan.status==ACTIVE"
    error_id: ERR_INACTIVE_RESOURCE
    http_status: 409
    applies_to: "POST /claims"

  - priority: 7
    category: business_constraint
    check: "Claim days_supply is exactly 30 or 90; if pharmacy_type==MAIL_ORDER then days_supply==90"
    error_id: ERR_INVALID_DAYS_SUPPLY
    http_status: 422
    applies_to: "POST /claims"

  - priority: 8
    category: business_safety
    check: "If FormularyDrug.is_specialty and Plan.specialty_requires_specialty_pharmacy then claim.pharmacy_type==SPECIALTY"
    error_id: ERR_SPECIALTY_PHARMACY_REQUIRED
    http_status: 422
    applies_to: "POST /claims"

  - priority: 9
    category: business_safety
    check: "If FormularyDrug.pa_required then prior_auth_id references an APPROVED PA for the same member+drug with approved_quantity_remaining>=1"
    error_id: ERR_PA_REQUIRED
    http_status: 422
    applies_to: "POST /claims"

  - priority: 10
    category: business_temporal
    check: >
      If prior_auth_id is set, the claim's fill_date must fall inside the PA's
      validity window [PA decided, valid_through_date): fill_date strictly less
      than valid_through_date (upper bound EXCLUSIVE — a fill exactly at
      valid_through_date is rejected).
    error_id: ERR_PA_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /claims"

  - priority: 11
    category: business_safety
    check: "If FormularyDrug.step_therapy_protocol_id set, calc_step_satisfied must be true"
    error_id: ERR_STEP_THERAPY_NOT_MET
    http_status: 422
    applies_to: "POST /claims"

  - priority: 12
    category: business_temporal
    check: >
      Refill-too-soon: the claim's fill_date must NOT be strictly before the
      supply_end_date of any existing PAID claim for the same member+drug. The
      supply window is half-open [fill_date, supply_end_date); a new fill_date
      equal to a prior window's supply_end_date is allowed (adjacency), one
      strictly inside it is rejected.
    error_id: ERR_REFILL_TOO_SOON
    http_status: 422
    applies_to: "POST /claims"

  - priority: 13
    category: business_referential
    check: "If copay_card_id set, the card belongs to the same member and the same formulary_drug as the claim, and card.status==ACTIVE"
    error_id: ERR_COPAY_CARD_INVALID
    http_status: 422
    applies_to: "POST /claims"

  - priority: 14
    category: business_constraint
    check: "OCC: expected_<parent>_version matches the parent's current version on guarded write endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /prior-authorizations/{id}/decide, POST /plans/{id}/finalize-rebates"

  - priority: 15
    category: business_constraint
    check: "Required body fields present and well-typed; enums within allowed sets; numeric fields satisfy declared constraints"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- BenefitPlan ----
  - method: POST
    path: "/pbm/plans"
    description: "Create a benefit plan"
    roles: [PlanAdmin]
    code: 201
    input: ["name", "plan_year", "deductible_cents", "oop_max_cents", "tier_copay_cents", "mail_order_copay_multiplier?", "specialty_requires_specialty_pharmacy?"]
    output: BenefitPlan
    side_effects: ["plan created with status=ACTIVE, version=1"]
  - method: GET
    path: "/pbm/plans/{id}"
    description: "Fetch a plan"
    roles: [PlanAdmin, PharmacyProvider, MedicalDirector, PharmacistReviewer]
    code: 200
    input: []
    output: BenefitPlan
    side_effects: []
  - method: GET
    path: "/pbm/plans"
    description: "List plans"
    roles: [PlanAdmin, PharmacyProvider, MedicalDirector, PharmacistReviewer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: BenefitPlan[]
    side_effects: []
  - method: POST
    path: "/pbm/plans/{id}/archive"
    description: "Archive a plan (sets status=ARCHIVED)"
    roles: [PlanAdmin]
    code: 200
    input: []
    output: BenefitPlan
    side_effects: ["set status=ARCHIVED; increments BenefitPlan.version by 1"]
  - method: POST
    path: "/pbm/plans/{id}/finalize-rebates"
    description: "Finalize all PROVISIONAL rebate accruals for PAID claims under the plan"
    roles: [PlanAdmin]
    code: 200
    input: [expected_benefit_plan_version]
    output: "{ finalized_count: integer, finalized_accrual_ids: string[] }"
    side_effects:
      - "each matching RebateAccrual PROVISIONAL->FINALIZED"
      - "increments BenefitPlan.version by 1"

  # ---- FormularyDrug ----
  - method: POST
    path: "/pbm/formulary-drugs"
    description: "Add a drug to a plan's formulary"
    roles: [PlanAdmin]
    code: 201
    input: ["plan_id", "ndc", "drug_name", "tier", "ingredient_cost_cents", "is_specialty?", "pa_required?", "step_therapy_protocol_id?", "rebate_per_fill_cents?"]
    output: FormularyDrug
    side_effects: ["drug created with status=ACTIVE"]
  - method: GET
    path: "/pbm/formulary-drugs/{id}"
    description: "Fetch a formulary drug"
    roles: [PlanAdmin, PharmacyProvider, MedicalDirector, PharmacistReviewer]
    code: 200
    input: []
    output: FormularyDrug
    side_effects: []
  - method: GET
    path: "/pbm/formulary-drugs"
    description: "List formulary drugs, optionally filtered by plan"
    roles: [PlanAdmin, PharmacyProvider, MedicalDirector, PharmacistReviewer]
    code: 200
    input: ["plan_id?", "step_therapy_protocol_id?", "limit?", "offset?"]
    output: FormularyDrug[]
    side_effects: []
  - method: POST
    path: "/pbm/formulary-drugs/{id}/delist"
    description: "Delist a drug (sets status=INACTIVE)"
    roles: [PlanAdmin]
    code: 200
    input: []
    output: FormularyDrug
    side_effects: ["set status=INACTIVE"]

  # ---- StepTherapyProtocol ----
  - method: POST
    path: "/pbm/step-therapy-protocols"
    description: "Create a step-therapy protocol"
    roles: [PlanAdmin]
    code: 201
    input: [plan_id, name, first_line_ndcs]
    output: StepTherapyProtocol
    side_effects: ["protocol created"]
  - method: GET
    path: "/pbm/step-therapy-protocols/{id}"
    description: "Fetch a protocol"
    roles: [PlanAdmin, PharmacyProvider, MedicalDirector, PharmacistReviewer]
    code: 200
    input: []
    output: StepTherapyProtocol
    side_effects: []
  - method: GET
    path: "/pbm/step-therapy-protocols"
    description: "List protocols, optionally filtered by plan"
    roles: [PlanAdmin, PharmacyProvider, MedicalDirector, PharmacistReviewer]
    code: 200
    input: ["plan_id?", "limit?", "offset?"]
    output: StepTherapyProtocol[]
    side_effects: []

  # ---- Member ----
  - method: POST
    path: "/pbm/members"
    description: "Enroll a member in a plan"
    roles: [PlanAdmin]
    code: 201
    input: [plan_id, full_name]
    output: Member
    side_effects: ["member created with status=ACTIVE, deductible_met_cents=0, oop_met_cents=0"]
  - method: GET
    path: "/pbm/members/{id}"
    description: "Fetch a member (includes live accumulators)"
    roles: [PlanAdmin, PharmacyProvider, MedicalDirector, PharmacistReviewer]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: GET
    path: "/pbm/members"
    description: "List members, optionally filtered by plan"
    roles: [PlanAdmin, PharmacyProvider, MedicalDirector, PharmacistReviewer]
    code: 200
    input: ["plan_id?", "limit?", "offset?"]
    output: Member[]
    side_effects: []
  - method: POST
    path: "/pbm/members/{id}/terminate"
    description: "Terminate a member (sets status=TERMINATED)"
    roles: [PlanAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["set status=TERMINATED"]

  # ---- PriorAuthorization ----
  - method: POST
    path: "/pbm/prior-authorizations"
    description: "Submit a prior authorization request (intake)"
    roles: [PharmacistReviewer]
    code: 201
    input: ["member_id", "formulary_drug_id", "authorized_fills", "valid_through_date", "overrides_step_therapy?"]
    output: PriorAuthorization
    side_effects: ["PA created PENDING_REVIEW; submitted_by_user_id = X-User-ID"]
  - method: GET
    path: "/pbm/prior-authorizations/{id}"
    description: "Fetch a PA"
    roles: [PlanAdmin, PharmacyProvider, MedicalDirector, PharmacistReviewer]
    code: 200
    input: []
    output: PriorAuthorization
    side_effects: []
  - method: GET
    path: "/pbm/prior-authorizations"
    description: "List PAs, optionally filtered by member or drug"
    roles: [PlanAdmin, PharmacyProvider, MedicalDirector, PharmacistReviewer]
    code: 200
    input: ["member_id?", "formulary_drug_id?", "status?", "limit?", "offset?"]
    output: PriorAuthorization[]
    side_effects: []
  - method: POST
    path: "/pbm/prior-authorizations/{id}/decide"
    description: "Approve or deny a PA (clinical decision)"
    roles: [MedicalDirector]
    code: 200
    input: [decision, expected_prior_authorization_version]
    output: PriorAuthorization
    side_effects:
      - "decision=APPROVE: PENDING_REVIEW/APPEALED -> APPROVED; set approved_quantity_remaining=authorized_fills; set decided_by_user_id"
      - "decision=DENY: PENDING_REVIEW/APPEALED -> DENIED; set decided_by_user_id"
      - "increments PriorAuthorization.version by 1"
  - method: POST
    path: "/pbm/prior-authorizations/{id}/appeal"
    description: "Appeal a denied PA back into review"
    roles: [PharmacistReviewer]
    code: 200
    input: []
    output: PriorAuthorization
    side_effects: ["DENIED -> APPEALED; clear decided_by_user_id; increments PriorAuthorization.version by 1"]

  # ---- Claim ----
  - method: POST
    path: "/pbm/claims"
    description: "Submit and inline-adjudicate a pharmacy claim"
    roles: [PharmacyProvider]
    code: 201
    input: ["member_id", "formulary_drug_id", "days_supply", "pharmacy_type", "prior_auth_id?", "copay_card_id?"]
    output: Claim
    side_effects:
      - "adjudicate inline: SUBMITTED->PAID on success (compute costs; recompute member accumulators; draw copay card; consume PA; accrue rebate) or SUBMITTED->REJECTED on business-rule failure"
  - method: GET
    path: "/pbm/claims/{id}"
    description: "Fetch a claim"
    roles: [PlanAdmin, PharmacyProvider, MedicalDirector, PharmacistReviewer]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: GET
    path: "/pbm/claims"
    description: "List claims, optionally filtered by member, drug, copay card, or PA"
    roles: [PlanAdmin, PharmacyProvider, MedicalDirector, PharmacistReviewer]
    code: 200
    input: ["member_id?", "formulary_drug_id?", "copay_card_id?", "prior_auth_id?", "adjudication_status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []
  - method: POST
    path: "/pbm/claims/{id}/reverse"
    description: "Reverse a PAID claim and unwind its side effects"
    roles: [PharmacyProvider]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "PAID->REVERSED; recompute member accumulators excluding this claim; restore copay-card benefit and PA fill; delete provisional rebate or claw back finalized rebate"

  # ---- CopayCard ----
  - method: POST
    path: "/pbm/copay-cards"
    description: "Issue a manufacturer copay card to a member for a drug"
    roles: [PlanAdmin]
    code: 201
    input: [member_id, formulary_drug_id, max_benefit_cents]
    output: CopayCard
    side_effects: ["card created ACTIVE, benefit_used_cents=0"]
  - method: GET
    path: "/pbm/copay-cards/{id}"
    description: "Fetch a copay card"
    roles: [PlanAdmin, PharmacyProvider, MedicalDirector, PharmacistReviewer]
    code: 200
    input: []
    output: CopayCard
    side_effects: []
  - method: GET
    path: "/pbm/copay-cards"
    description: "List copay cards, optionally filtered by member or drug"
    roles: [PlanAdmin, PharmacyProvider, MedicalDirector, PharmacistReviewer]
    code: 200
    input: ["member_id?", "formulary_drug_id?", "limit?", "offset?"]
    output: CopayCard[]
    side_effects: []

  # ---- RebateAgreement ----
  - method: POST
    path: "/pbm/rebate-agreements"
    description: "Create a manufacturer rebate agreement for a plan"
    roles: [PlanAdmin]
    code: 201
    input: ["plan_id", "manufacturer_name", "clawback_pct?"]
    output: RebateAgreement
    side_effects: ["agreement created"]
  - method: GET
    path: "/pbm/rebate-agreements/{id}"
    description: "Fetch a rebate agreement"
    roles: [PlanAdmin, PharmacyProvider, MedicalDirector, PharmacistReviewer]
    code: 200
    input: []
    output: RebateAgreement
    side_effects: []
  - method: GET
    path: "/pbm/rebate-agreements"
    description: "List rebate agreements, optionally filtered by plan"
    roles: [PlanAdmin, PharmacyProvider, MedicalDirector, PharmacistReviewer]
    code: 200
    input: ["plan_id?", "limit?", "offset?"]
    output: RebateAgreement[]
    side_effects: []

  # ---- RebateAccrual ----
  - method: GET
    path: "/pbm/rebate-accruals/{id}"
    description: "Fetch a rebate accrual"
    roles: [PlanAdmin, PharmacyProvider, MedicalDirector, PharmacistReviewer]
    code: 200
    input: []
    output: RebateAccrual
    side_effects: []
  - method: GET
    path: "/pbm/rebate-accruals"
    description: "List rebate accruals, optionally filtered by claim or agreement"
    roles: [PlanAdmin, PharmacyProvider, MedicalDirector, PharmacistReviewer]
    code: 200
    input: ["claim_id?", "rebate_agreement_id?", "status?", "limit?", "offset?"]
    output: RebateAccrual[]
    side_effects: []

  # ---- Test-driving endpoint (clock) ----
  - method: POST
    path: "/pbm/_clock/set"
    description: "Set the server clock used to stamp Claim.fill_date and to evaluate PA validity windows"
    roles: [PlanAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["server clock set to to_iso8601; subsequent POST /claims stamp fill_date from it"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing X-User-Role or X-User-ID header"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for the operation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource (member, drug, plan, PA, copay card, accrual) does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state that permits the requested transition"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "On PA decide, the deciding user is the same user who submitted the PA"
  - id: ERR_INACTIVE_RESOURCE
    http: 409
    condition: "Claim references a TERMINATED member, INACTIVE drug, or ARCHIVED plan"
  - id: ERR_INVALID_DAYS_SUPPLY
    http: 422
    condition: "days_supply not in {30,90}, or MAIL_ORDER with days_supply != 90"
  - id: ERR_SPECIALTY_PHARMACY_REQUIRED
    http: 422
    condition: "Specialty drug under a plan requiring specialty pharmacy, but pharmacy_type != SPECIALTY"
  - id: ERR_PA_REQUIRED
    http: 422
    condition: "Drug requires PA but no APPROVED PA with remaining fills is referenced for this member+drug"
  - id: ERR_STEP_THERAPY_NOT_MET
    http: 422
    condition: "Step-therapy gate not satisfied and no overriding APPROVED PA"
  - id: ERR_PA_WINDOW_EXPIRED
    http: 422
    condition: "Claim fill_date is at or after the referenced PA's valid_through_date (window upper bound is exclusive)"
  - id: ERR_REFILL_TOO_SOON
    http: 422
    condition: "Claim fill_date is strictly before an existing PAID same-member+drug fill's supply_end_date"
  - id: ERR_COPAY_CARD_INVALID
    http: 422
    condition: "Copay card does not match the claim's member+drug, or card is EXHAUSTED"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing/ill-typed body field, out-of-range value, or invalid enum"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlanAdmin
    description: "Configures plans, formulary, protocols, members, copay cards, rebate agreements; runs the rebate-finalize sweep"
    identity: opaque
    exclusive_operations:
      - "POST /plans"
      - "POST /plans/{id}/archive"
      - "POST /plans/{id}/finalize-rebates"
      - "POST /formulary-drugs"
      - "POST /formulary-drugs/{id}/delist"
      - "POST /step-therapy-protocols"
      - "POST /members"
      - "POST /members/{id}/terminate"
      - "POST /copay-cards"
      - "POST /rebate-agreements"
    shared_operations:
      - "all GET endpoints"

  - name: PharmacistReviewer
    description: "Intakes prior-authorization requests and appeals denials; cannot decide PAs (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /prior-authorizations"
      - "POST /prior-authorizations/{id}/appeal"
    shared_operations:
      - "all GET endpoints"

  - name: MedicalDirector
    description: "Approves or denies prior authorizations; may not decide a PA they themselves submitted"
    identity: opaque
    exclusive_operations:
      - "POST /prior-authorizations/{id}/decide"
    shared_operations:
      - "all GET endpoints"

  - name: PharmacyProvider
    description: "Submits and reverses pharmacy claims (adjudication)"
    identity: opaque
    exclusive_operations:
      - "POST /claims"
      - "POST /claims/{id}/reverse"
    shared_operations:
      - "all GET endpoints"
