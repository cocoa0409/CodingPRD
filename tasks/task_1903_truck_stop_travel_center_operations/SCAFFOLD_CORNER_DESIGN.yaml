            - { call: "GET /shifts/${shift_id}", payload: {}, as: ShiftManager, as_user_id: "sm-2", captures: { shift_expected: "$.data.expected_cash_cents" } }
            - { call: "GET /registers/${reg_id}", payload: {}, as: ShiftManager, as_user_id: "sm-2", captures: { reg_posture: "$.data.posture" } }
          assert:
            - "vendor loop: WAITING_VENDOR then back to IN_PROGRESS"
            - "parts_total_cents == 87599 (2 x 41500 + 1 x 4599)"
            - "labor_total_cents == 18750 (1.5 x 12500)"
            - "environmental_fee_cents == 300 (2 tire units x 150)"
            - "shop_supplies_cents == 2628 (round_half_up(87599 x 0.03) = round_half_up(2627.97))"
            - "invoice_total_cents == 109277"
            - "bay returns to IDLE at complete-work"
            - "close: WO CLOSED + PAID; shift expected_cash_cents == 129277; register posture == NEEDS_DROP (129277 > 5 x 20000)"

      - name: sm_scale_settle_requires_gross_and_tare
        claim_type: precondition_enforcement
