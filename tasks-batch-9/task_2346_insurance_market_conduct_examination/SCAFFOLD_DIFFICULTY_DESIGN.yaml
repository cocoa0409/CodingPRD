              captures: { summary_sustained: "$.data.sustained_criticism_count", summary_agg: "$.data.aggregate_restitution_cents", summary_units: "$.data.penalty_units_total", summary_tier_total: "$.data.tiered_order_total_cents" }
            - call: "GET /market-conduct/insurers/${aurora_id}"
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { pending_enforcement: "$.data.pending_enforcement_exam_count" }
          assert:
            - "Criticism.${c1_id}.status == SUSTAINED and Criticism.${c2_id}.status == WITHDRAWN, both with finalized_by_user_id 22222222-2222-2222-2222-222222222222"
            - "Examination.${exam_id}.pending_restitution_cents == 0 (both criticisms drained the pool)"
            - "Examination.${exam_id}.aggregate_restitution_cents == 20132000, NOT 20182333 - the withdrawn exposure is released, never transferred"
            - "Examination.${exam_id}.sustained_criticism_count == 1 and open_criticism_count == 0"
            - "Examination.${exam_id}.penalty_units_total == 12: the 4 penalty_units carried on the WITHDRAWN criticism are ignored by the ledger even though the field is stored on the row"
            - "Examination.${exam_id}.status == NEGOTIATION and Insurer.${aurora_id}.pending_enforcement_exam_count == 1"
            - "exposure-summary reports sustained_criticism_count 1, aggregate_restitution_cents 20132000, penalty_units_total 12, tiered_penalty_gross_cents 1507920, tiered_cooperation_credit_pct 0.05, tiered_penalty_net_cents 1432524 and tiered_order_total_cents 21564524"
            - "exposure-summary reports per_violation_penalty_gross_cents 300000, per_violation_cooperation_credit_pct 0.05, per_violation_penalty_net_cents 285000 and per_violation_order_total_cents 20417000"
            - "Both figures are computed from the SUSTAINED criticism alone, so the withdrawn 50333 and its 4 units never reach the penalty pipeline"
