      - name: missing_x_user_role_header_unauthenticated
        claim_type: missing_credentials
        grounds:
          - validations[priority 10 ERR_UNAUTHENTICATED]
          - endpoints[GET /ccs/storage-projects/{id}]
        distinguishing_aspect: |
          The identity headers are checked before anything else, so a read that every one of the five
          roles is allowed to perform still fails with 401 ERR_UNAUTHENTICATED when X-User-Role is
          absent, ahead of the priority-40 existence check that the valid project id would have passed.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' in DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
          trigger:
            - call: "GET /ccs/storage-projects/${proj_id}"
              payload: {}
              as: "(X-User-Role header omitted)"
          assert:
            - "the trigger call returns HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "the response body carries no project payload"
            - "StorageProject.${proj_id}.version == 1"

      - name: certify_closure_by_the_permit_technical_reviewer_forbidden
        claim_type: segregation_of_duties
        grounds:
          - validations[priority 22 ERR_SEGREGATION_OF_DUTIES]
          - endpoints[POST /ccs/storage-projects/{id}/certify-closure]
          - entities.InjectionWellPermit.fields.technical_reviewer_user_id
        distinguishing_aspect: |
          The reviewer who took the permit into technical review is barred from certifying the same
          project's closure, and the priority-22 duty check fires ahead of both the priority-56 state
          check that the PERMITTING project would trip and the priority-73 attestation check, so the
          answer is 403 ERR_SEGREGATION_OF_DUTIES with non_endangerment_demonstrated still false.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' in PERMITTING with aor_radius_km 3.0"
            - "permit ALPHA-1 in TECHNICAL_REVIEW with technical_reviewer_user_id reviewer-2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /ccs/geologic-models"
              payload: { project_id: "${proj_id}", expected_project_version: "${proj_v0}", model_label: "M1-DET", injection_zone_top_depth_m: 1800, injection_zone_thickness_m: 50, seal_thickness_m: 60, capillary_entry_pressure_psi: 900, p10_seal_thickness_m: 30, p10_capillary_entry_pressure_psi: 700, reservoir_pressure_psi: 3000, fracture_pressure_psi: 4500, permeability_md: 200, porosity_fraction: 0.20, assessment_variant: "DETERMINISTIC" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { model_id: $.data.id }
            - call: "POST /ccs/geologic-models/${model_id}/run-plume-simulation"
              payload: { injection_years: 20 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/geologic-models/${model_id}/submit"
              payload: { submission_note: "initial site characterization" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/geologic-models/${model_id}/review"
              payload: { decision: "ACCEPT", review_note: "seal integrity acceptable" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-1"
            - call: "POST /ccs/geologic-models/${model_id}/finalize-aor"
              payload: {}
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/injection-well-permits"
              payload: { project_id: "${proj_id}", geologic_model_id: "${model_id}", well_name: "ALPHA-1", casing_program: "LONG_STRING_CEMENTED_TO_SURFACE", corrosion_resistant_material: true, tubing_packer_installed: true, requested_injection_pressure_psi: 4000 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { permit_id: $.data.id }
            - call: "POST /ccs/injection-well-permits/${permit_id}/submit"
              payload: { submission_note: "Class VI application" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/injection-well-permits/${permit_id}/review"
              payload: { decision: "BEGIN_TECHNICAL_REVIEW", review_note: "assigned to reviewer-2" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-2"
              captures: { permit_state: $.data.permit_status, tech_reviewer: $.data.technical_reviewer_user_id }
          trigger:
            - call: "POST /ccs/storage-projects/${proj_id}/certify-closure"
              payload: { non_endangerment_demonstrated: true, closure_note: "attempting closure" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-2"
          assert:
            - "${permit_state} == TECHNICAL_REVIEW"
            - "${tech_reviewer} == reviewer-2"
            - "the trigger call returns HTTP 403 with error_id ERR_SEGREGATION_OF_DUTIES"
            - "StorageProject.${proj_id}.status == PERMITTING"
            - "StorageProject.${proj_id}.closure_status == NOT_REQUESTED"
            - "StorageProject.${proj_id}.non_endangerment_demonstrated == false"
            - "StorageProject.${proj_id}.closure_certified_by_user_id == null"

      - name: independent_verifier_reads_the_project_the_landowner_can_also_read
        claim_type: shared_operations
        grounds:
          - rbac.IndependentVerifier
          - rbac.Landowner
          - endpoints[GET /ccs/storage-projects/{id}]
        distinguishing_aspect: |
          The project read is the one endpoint open to all five roles, so the verifier and the landowner,
          neither of whom may write anything on the project, both get 200 with the same derived values,
          which distinguishes a read grant from the write grants their roles lack.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' in DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
