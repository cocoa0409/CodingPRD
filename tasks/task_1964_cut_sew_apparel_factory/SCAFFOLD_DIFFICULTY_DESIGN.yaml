          - errors[ERR_TECH_PACK_NOT_APPROVED]
        distinguishing_aspect: |
          Pair ProductionOrder x TechPack: plan is gated on the CANDIDATE pack's state —
          PENDING_APPROVAL (submitted, never reviewed) is rejected with
          ERR_TECH_PACK_NOT_APPROVED; only the APPROVED state unlocks pinning.
