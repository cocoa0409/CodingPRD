        distinguishing_aspect: "Settling and recognizing a sponsorship moves HostCommunityRecord.recognition_funded_cents from 0 to 94500 and HostCommunityRecord.ledger_gap_cents from 20000 to negative 74500, and voiding the settlement returns both to exactly their pre-recognize values, conserving the recognition allocation."
