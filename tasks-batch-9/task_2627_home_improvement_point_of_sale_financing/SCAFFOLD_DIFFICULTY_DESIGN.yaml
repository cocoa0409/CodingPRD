# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2627 — Home Improvement Point-of-Sale Financing
#
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.6 only. Deleting this file
# leaves the declared behaviour identical; it only makes coverage harder to audit.
#
# Canonical fixture used by most chains (all money integer cents, all rates bps):
#   TradeRule ROOFING      : max_ticket 5000000, holdback 500 bps,
#                            max_precompletion_release 7000 bps,
#                            velocity_cap 15000000, cert required, min_license 6 mo
#   PromotionPlan DI12-ROOF: DEFERRED_INTEREST, 12 mo, 2699/2699 bps,
#                            merchant_discount 525 bps, ticket 100000..5000000,
#                            disclosure template "DI-2026.2"
#   Merchant               : Summit Roofing LLC / ROOFING / TX
#   MerchantLicense        : TX-RCF-88120, 2026-01-01 -> 2027-06-30 (VERIFIED)
#   Enrollment             : 2026-08-01 .. 2026-12-31, negotiated_discount 449 bps
#   Consumer               : Dana Ruiz, income 9600000, FICO 742 (tier T2)
#   Application            : ticket 3500000 -> APPROVED, limit 4320000, dti 3646 bps
#   Project                : contract 3500000; milestones 3000 / 4000 / 3000 bps
#   Startup clock default  : 2026-08-01T00:00:00Z
#   Operator ids           : pa-1 (ProgramAdmin), uw-1 (ProgramUnderwriter),
#                            ra-1 (RiskAnalyst), sa-1 / sa-2 (ServicingAgent)
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: draw_provisional_versus_final_settlement_divergence
        grounds:
          - calculations.draw_settlement_economics
          - calculations.holdback_reserve_target
          - entities.FundingDraw.fields.provisional_net_settlement_cents
          - entities.FundingDraw.fields.net_settlement_cents
          - entities.FundingDraw.fields.effective_discount_bps
          - state_machines.FundingDraw.REQUESTED_to_SETTLED
        distinguishing_aspect: |
          This instance's dual variant lives in the merchant-settlement money domain on
          FundingDraw: the provisional variant prices the draw at the PLAN discount rate
          with a flat TradeRule holdback, the final variant prices the same funded cents at
          the NEGOTIATED rate plus speed surcharge and through the six-step reserve-target
          holdback, so provisional_net_settlement_cents (897544) and net_settlement_cents
          (907646) differ by exactly 10102 cents on one row.
        test_recipe:
          setup:
            - "Program configured: TradeRule ROOFING and PromotionPlan DI12-ROOF exist."
            - "Merchant Summit Roofing LLC is APPROVED with a VERIFIED ROOFING/TX license."
            - "An ACTIVE promotion enrollment carries negotiated_discount_bps 449 (plan rate is 525)."
            - "Consumer Dana Ruiz has an ACTIVATED application and a PROMO_ACTIVE LoanAccount with credit_limit_cents 4320000."
            - "Project contract_amount_cents 3500000 with milestone 1 at 3000 bps VERIFIED, so max_fundable_now_cents == 1050000."
            - "The merchant has zero prior SETTLED draws, so risk_tier is STANDARD (unseasoned) and holdback_reserve_cents is 0."
            - "Logical clock sits at the 2026-08-01T00:00:00Z startup default."
          setup_api_calls:
            - call: "POST /trade-rules"
              payload: { trade_type: "ROOFING", max_ticket_cents: 5000000, holdback_pct_bps: 500, max_precompletion_release_bps: 7000, velocity_cap_cents: 15000000, requires_completion_certificate: true, min_license_months: 6 }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /promotion-plans"
              payload: { code: "DI12-ROOF", promotion_type: "DEFERRED_INTEREST", promo_term_months: 12, deferred_apr_bps: 2699, post_promo_apr_bps: 2699, merchant_discount_bps: 525, min_ticket_cents: 100000, max_ticket_cents: 5000000, disclosure_template_version: "DI-2026.2", allowed_trade_types: ["ROOFING", "GENERAL_REMODEL"] }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { plan_id: "$.data.id" }
            - call: "POST /merchants"
              payload: { legal_name: "Summit Roofing LLC", trade_type: "ROOFING", state_code: "TX", contact_email: "ops@summitroof.example" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { merch_id: "$.data.id" }
            - call: "POST /merchants/${merch_id}/licenses"
              payload: { trade_type: "ROOFING", license_number: "TX-RCF-88120", state_code: "TX", effective_from: "2026-01-01", expires_on: "2027-06-30" }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { lic_id: "$.data.id" }
            - call: "POST /merchants/${merch_id}/licenses/${lic_id}/verification"
              payload: { outcome: "VERIFIED", verification_note: "State board record matched" }
              as: ProgramUnderwriter
              as_user_id: "uw-1"
            - call: "POST /merchants/${merch_id}/enrollment-submission"
              payload: { attestation_ref: "ATT-2026-0801" }
              as: Merchant
              as_user_id: "${merch_id}"
            - call: "POST /merchants/${merch_id}/enrollment-decision"
              payload: { decision: "APPROVE", decision_note: "Licence verified, 10 whole months of coverage" }
              as: ProgramUnderwriter
              as_user_id: "uw-1"
            - call: "POST /merchants/${merch_id}/promotion-enrollments"
              payload: { promotion_plan_id: "${plan_id}", window_start_date: "2026-08-01", window_end_date: "2026-12-31", negotiated_discount_bps: 449 }
              as: ProgramUnderwriter
              as_user_id: "uw-1"
              captures: { enr_id: "$.data.id" }
            - call: "POST /consumers"
              payload: { full_name: "Dana Ruiz", ssn_last4: "4417", annual_income_cents: 9600000, fico_score: 742, state_code: "TX" }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { cons_id: "$.data.id" }
            - call: "POST /credit-applications"
              payload: { merchant_id: "${merch_id}", consumer_id: "${cons_id}", promotion_plan_id: "${plan_id}", project_amount_cents: 3500000 }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { app_id: "$.data.id" }
            - call: "POST /credit-applications/${app_id}/disclosure-delivery"
              payload: { disclosure_template_version: "DI-2026.2" }
              as: Merchant
              as_user_id: "${merch_id}"
            - call: "POST /credit-applications/${app_id}/disclosure-acknowledgement"
              payload: { consumer_signature_ref: "SIG-DANA-1" }
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /credit-applications/${app_id}/acceptance"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "GET /loan-accounts?application_id=${app_id}"
              as: ServicingAgent
              as_user_id: "sa-1"
              captures: { loan_id: "$.data[0].id" }
            - call: "POST /projects"
              payload: { application_id: "${app_id}", scope_description: "Full roof replacement, 32 squares", contract_amount_cents: 3500000 }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { proj_id: "$.data.id" }
            - call: "POST /projects/${proj_id}/milestones"
              payload: { sequence_no: 1, name: "Tear-off and deck inspection", release_pct_bps: 3000, requires_consumer_signoff: true }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { ms1_id: "$.data.id" }
            - call: "POST /projects/${proj_id}/milestones/${ms1_id}/claim"
              payload: { evidence_ref: "PHOTO-TEAROFF-1" }
              as: Merchant
              as_user_id: "${merch_id}"
            - call: "POST /projects/${proj_id}/milestones/${ms1_id}/verification"
              payload: { outcome: "VERIFY" }
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "GET /loan-accounts/${loan_id}"
              as: ServicingAgent
              as_user_id: "sa-1"
              captures: { loan_v1: "$.data.version" }
          trigger:
            - call: "POST /funding-draws"
              payload: { loan_account_id: "${loan_id}", project_milestone_id: "${ms1_id}", requested_amount_cents: 1000050, settlement_speed: "NEXT_DAY", expected_loan_account_version: "${loan_v1}" }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { draw1_id: "$.data.id" }
            - call: "POST /funding-draws/${draw1_id}/settlement"
              payload: { decision: "SETTLE" }
              as: ServicingAgent
              as_user_id: "sa-1"
          assert:
            - "FundingDraw.${draw1_id}.funded_amount_cents == 1000050"
            - "PROVISIONAL variant at creation: FundingDraw.${draw1_id}.provisional_discount_cents == 52503"
            - "PROVISIONAL variant at creation: FundingDraw.${draw1_id}.provisional_holdback_cents == 50003"
            - "PROVISIONAL variant at creation: FundingDraw.${draw1_id}.provisional_net_settlement_cents == 897544"
            - "FINAL variant at settlement: FundingDraw.${draw1_id}.effective_discount_bps == 449"
            - "FINAL variant at settlement: FundingDraw.${draw1_id}.volume_tier_credit_bps == 0"
            - "FINAL variant at settlement: FundingDraw.${draw1_id}.merchant_discount_cents == 52402"
            - "FINAL variant at settlement: FundingDraw.${draw1_id}.holdback_withheld_cents == 40002"
            - "FINAL variant at settlement: FundingDraw.${draw1_id}.net_settlement_cents == 907646"
            - "Variant divergence is non-zero on all three components: 52503 != 52402, 50003 != 40002, 897544 != 907646"
            - "Reconciliation delta paid to the merchant at settlement == 907646 - 897544 == 10102"
            - "Merchant.${merch_id}.holdback_reserve_cents == 40002"
            - "Merchant.${merch_id}.holdback_target_cents == 40002"
            - "Merchant.${merch_id}.reserve_coverage_bps == 10000"
            - "Merchant.${merch_id}.funded_volume_cents == 1000050"
            - "LoanAccount.${loan_id}.principal_balance_cents == 1000050"

      - name: loan_promo_satisfied_versus_capitalized_payoff_divergence
        grounds:
          - calculations.deferred_interest_accrual
          - entities.LoanAccount.fields.promo_payoff_cents
          - entities.LoanAccount.fields.standard_payoff_cents
          - entities.LoanAccount.fields.waived_interest_cents
          - state_machines.LoanAccount.PROMO_ACTIVE_to_PROMO_SATISFIED
        distinguishing_aspect: |
          This instance's dual variant lives in the CONSUMER-interest domain on LoanAccount,
          not in the merchant-settlement domain of FundingDraw: the promo_satisfied variant
          forgives the entire deferred accrual (promo_payoff_cents 2400050) while the
          promo_expired_capitalized variant charges it (standard_payoff_cents 3004935 on the
          same row at the same instant), a 604885-cent divergence driven by whether principal
          reaches zero on or before promo_expires_on.
        test_recipe:
          setup:
            - "Same program, merchant, enrollment and consumer fixture as draw_provisional_versus_final_settlement_divergence."
            - "Application ACTIVATED on 2026-08-01, so LoanAccount.promo_expires_on == 2027-08-01 and apr_bps == 2699."
            - "Project 3500000 with milestone 1 at 3000 bps and milestone 2 at 4000 bps, both VERIFIED."
            - "Draw 1 of 1000050 settled on 2026-08-10 (first_funding_on)."
            - "Draw 2 of 1400000 settled on 2026-09-05, so principal_balance_cents == 2400050."
            - "No expiration sweep has run, so promo_status is still PROMO_ACTIVE."
          setup_api_calls:
            - call: "POST /trade-rules"
              payload: { trade_type: "ROOFING", max_ticket_cents: 5000000, holdback_pct_bps: 500, max_precompletion_release_bps: 7000, velocity_cap_cents: 15000000, requires_completion_certificate: true, min_license_months: 6 }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /promotion-plans"
              payload: { code: "DI12-ROOF", promotion_type: "DEFERRED_INTEREST", promo_term_months: 12, deferred_apr_bps: 2699, post_promo_apr_bps: 2699, merchant_discount_bps: 525, min_ticket_cents: 100000, max_ticket_cents: 5000000, disclosure_template_version: "DI-2026.2", allowed_trade_types: ["ROOFING", "GENERAL_REMODEL"] }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { plan_id: "$.data.id" }
            - call: "POST /merchants"
              payload: { legal_name: "Summit Roofing LLC", trade_type: "ROOFING", state_code: "TX", contact_email: "ops@summitroof.example" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { merch_id: "$.data.id" }
            - call: "POST /merchants/${merch_id}/licenses"
              payload: { trade_type: "ROOFING", license_number: "TX-RCF-88120", state_code: "TX", effective_from: "2026-01-01", expires_on: "2027-06-30" }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { lic_id: "$.data.id" }
            - call: "POST /merchants/${merch_id}/licenses/${lic_id}/verification"
              payload: { outcome: "VERIFIED", verification_note: "State board record matched" }
              as: ProgramUnderwriter
              as_user_id: "uw-1"
            - call: "POST /merchants/${merch_id}/enrollment-submission"
              payload: { attestation_ref: "ATT-2026-0801" }
              as: Merchant
              as_user_id: "${merch_id}"
            - call: "POST /merchants/${merch_id}/enrollment-decision"
              payload: { decision: "APPROVE", decision_note: "Licence verified" }
              as: ProgramUnderwriter
              as_user_id: "uw-1"
            - call: "POST /merchants/${merch_id}/promotion-enrollments"
              payload: { promotion_plan_id: "${plan_id}", window_start_date: "2026-08-01", window_end_date: "2026-12-31", negotiated_discount_bps: 449 }
              as: ProgramUnderwriter
              as_user_id: "uw-1"
            - call: "POST /consumers"
              payload: { full_name: "Dana Ruiz", ssn_last4: "4417", annual_income_cents: 9600000, fico_score: 742, state_code: "TX" }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { cons_id: "$.data.id" }
            - call: "POST /credit-applications"
              payload: { merchant_id: "${merch_id}", consumer_id: "${cons_id}", promotion_plan_id: "${plan_id}", project_amount_cents: 3500000 }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { app_id: "$.data.id" }
            - call: "POST /credit-applications/${app_id}/disclosure-delivery"
              payload: { disclosure_template_version: "DI-2026.2" }
              as: Merchant
              as_user_id: "${merch_id}"
            - call: "POST /credit-applications/${app_id}/disclosure-acknowledgement"
              payload: { consumer_signature_ref: "SIG-DANA-1" }
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /credit-applications/${app_id}/acceptance"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "GET /loan-accounts?application_id=${app_id}"
              as: ServicingAgent
              as_user_id: "sa-1"
              captures: { loan_id: "$.data[0].id" }
            - call: "POST /projects"
              payload: { application_id: "${app_id}", scope_description: "Full roof replacement, 32 squares", contract_amount_cents: 3500000 }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { proj_id: "$.data.id" }
            - call: "POST /projects/${proj_id}/milestones"
              payload: { sequence_no: 1, name: "Tear-off and deck inspection", release_pct_bps: 3000, requires_consumer_signoff: true }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { ms1_id: "$.data.id" }
            - call: "POST /projects/${proj_id}/milestones"
              payload: { sequence_no: 2, name: "Shingle installation", release_pct_bps: 4000, requires_consumer_signoff: true }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { ms2_id: "$.data.id" }
            - call: "POST /projects/${proj_id}/milestones/${ms1_id}/claim"
              payload: { evidence_ref: "PHOTO-TEAROFF-1" }
              as: Merchant
              as_user_id: "${merch_id}"
            - call: "POST /projects/${proj_id}/milestones/${ms1_id}/verification"
              payload: { outcome: "VERIFY" }
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ServicingAgent
              as_user_id: "sa-1"
            - call: "GET /loan-accounts/${loan_id}"
              as: ServicingAgent
              as_user_id: "sa-1"
              captures: { loan_v1: "$.data.version" }
            - call: "POST /funding-draws"
              payload: { loan_account_id: "${loan_id}", project_milestone_id: "${ms1_id}", requested_amount_cents: 1000050, settlement_speed: "NEXT_DAY", expected_loan_account_version: "${loan_v1}" }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { draw1_id: "$.data.id" }
            - call: "POST /funding-draws/${draw1_id}/settlement"
              payload: { decision: "SETTLE" }
              as: ServicingAgent
              as_user_id: "sa-1"
            - call: "POST /projects/${proj_id}/milestones/${ms2_id}/claim"
              payload: { evidence_ref: "PHOTO-SHINGLE-1" }
              as: Merchant
              as_user_id: "${merch_id}"
            - call: "POST /projects/${proj_id}/milestones/${ms2_id}/verification"
              payload: { outcome: "VERIFY" }
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: ServicingAgent
              as_user_id: "sa-1"
            - call: "GET /loan-accounts/${loan_id}"
              as: ServicingAgent
              as_user_id: "sa-1"
              captures: { loan_v2: "$.data.version" }
            - call: "POST /funding-draws"
              payload: { loan_account_id: "${loan_id}", project_milestone_id: "${ms2_id}", requested_amount_cents: 1400000, settlement_speed: "STANDARD_3DAY", expected_loan_account_version: "${loan_v2}" }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { draw2_id: "$.data.id" }
            - call: "POST /funding-draws/${draw2_id}/settlement"
              payload: { decision: "SETTLE" }
              as: ServicingAgent
              as_user_id: "sa-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-08-01T00:00:00Z" }
              as: ServicingAgent
              as_user_id: "sa-1"
            - call: "GET /loan-accounts/${loan_id}"
              as: ServicingAgent
              as_user_id: "sa-1"
            - call: "POST /payments"
              payload: { loan_account_id: "${loan_id}", amount_cents: 2400050 }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { pay_id: "$.data.id" }
          assert:
            - "At trigger step 2 (clock 2027-08-01, promo still ACTIVE): LoanAccount.${loan_id}.principal_balance_cents == 2400050"
            - "At trigger step 2: LoanAccount.${loan_id}.accrued_deferred_interest_cents == 604885"
            - "At trigger step 2: promo_satisfied variant value LoanAccount.${loan_id}.promo_payoff_cents == 2400050"
            - "At trigger step 2: promo_expired_capitalized variant value LoanAccount.${loan_id}.standard_payoff_cents == 3004935"
            - "At trigger step 2: the two variants diverge by exactly 3004935 - 2400050 == 604885"
            - "At trigger step 2: LoanAccount.${loan_id}.deferred_interest_at_risk_cents == 604885"
            - "At trigger step 2: LoanAccount.${loan_id}.capitalized_interest_cents == 0 and waived_interest_cents == 0"
            - "After trigger step 3: Payment.${pay_id}.applied_to_capitalized_interest_cents == 0"
            - "After trigger step 3: Payment.${pay_id}.applied_to_principal_cents == 2400050"
            - "After trigger step 3: Payment.${pay_id}.resulting_principal_balance_cents == 0"
            - "After trigger step 3: LoanAccount.${loan_id}.promo_status == PROMO_SATISFIED"
            - "After trigger step 3: LoanAccount.${loan_id}.balance_status == PAID_OFF"
            - "After trigger step 3: LoanAccount.${loan_id}.waived_interest_cents == 604885"
            - "After trigger step 3: LoanAccount.${loan_id}.accrued_deferred_interest_cents == 0 and deferred_interest_at_risk_cents == 0"

  # ===========================================================================
  # RULE 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: settlement_discount_component_wise_rounding_order_pinned
        grounds:
          - calculations.draw_settlement_economics
          - entities.FundingDraw.fields.merchant_discount_cents
          - entities.MerchantPromotionEnrollment.fields.negotiated_discount_bps
          - entities.FundingDraw.fields.settlement_speed
        distinguishing_aspect: |
          MODE (b) — nested rounding where the order matters: on funded 1000050 cents the
          pinned component-wise composition (round 449 bps, round 75 bps, round the volume
          credit, then add/subtract) yields merchant_discount_cents 52402, while the rejected
          mode-b alternative of collapsing the rates to 524 bps before a single rounding
          yields 52403 — a one-cent, order-only divergence with no tiered branch involved.
        test_recipe:
          setup:
            - "Program, APPROVED merchant, ACTIVE enrollment with negotiated_discount_bps 449 and PromotionPlan.merchant_discount_bps 525."
            - "ACTIVATED application and PROMO_ACTIVE LoanAccount for Consumer Dana Ruiz."
            - "Project 3500000 with milestone 1 at 3000 bps VERIFIED, so max_fundable_now_cents == 1050000."
            - "Merchant has zero prior SETTLED draws, so trailing-90-day volume excluding this draw is 0 and volume_tier_credit_bps resolves to 0."
            - "Logical clock at the 2026-08-01T00:00:00Z startup default."
          setup_api_calls:
            - call: "POST /trade-rules"
              payload: { trade_type: "ROOFING", max_ticket_cents: 5000000, holdback_pct_bps: 500, max_precompletion_release_bps: 7000, velocity_cap_cents: 15000000, requires_completion_certificate: true, min_license_months: 6 }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /promotion-plans"
              payload: { code: "DI12-ROOF", promotion_type: "DEFERRED_INTEREST", promo_term_months: 12, deferred_apr_bps: 2699, post_promo_apr_bps: 2699, merchant_discount_bps: 525, min_ticket_cents: 100000, max_ticket_cents: 5000000, disclosure_template_version: "DI-2026.2", allowed_trade_types: ["ROOFING", "GENERAL_REMODEL"] }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { plan_id: "$.data.id" }
            - call: "POST /merchants"
              payload: { legal_name: "Summit Roofing LLC", trade_type: "ROOFING", state_code: "TX", contact_email: "ops@summitroof.example" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { merch_id: "$.data.id" }
            - call: "POST /merchants/${merch_id}/licenses"
              payload: { trade_type: "ROOFING", license_number: "TX-RCF-88120", state_code: "TX", effective_from: "2026-01-01", expires_on: "2027-06-30" }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { lic_id: "$.data.id" }
            - call: "POST /merchants/${merch_id}/licenses/${lic_id}/verification"
              payload: { outcome: "VERIFIED", verification_note: "State board record matched" }
              as: ProgramUnderwriter
              as_user_id: "uw-1"
            - call: "POST /merchants/${merch_id}/enrollment-submission"
              payload: { attestation_ref: "ATT-2026-0801" }
              as: Merchant
              as_user_id: "${merch_id}"
            - call: "POST /merchants/${merch_id}/enrollment-decision"
              payload: { decision: "APPROVE", decision_note: "Licence verified" }
              as: ProgramUnderwriter
              as_user_id: "uw-1"
            - call: "POST /merchants/${merch_id}/promotion-enrollments"
