  - rule_id: cross_entity_state_dependency
    instances:
      - name: movement_create_requires_active_lease
        grounds:
          - state_machines.Movement.NOMINATED_to_SCHEDULED
          - validations[priority=7]
        distinguishing_aspect: |
          Entity pair Movement -> LeaseAgreement: movement creation is gated on
          the linked lease being ACTIVE; a DRAFT lease (never activated) rejects
          with ERR_LEASE_NOT_ACTIVE even though the movement payload itself is
          well-formed.
        test_recipe:
          setup:
            - "Customer, DIESEL tank, DOCK resource all valid"
            - "Lease left in DRAFT (no allocation, never activated)"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Atlas Commodities", contact_email: "ops@atlas.example" }, as: TerminalManager, captures: { c_id: $.data.id } }
            - { call: "POST /tanks", payload: { tank_code: "T-1301", product_grade: "DIESEL", capacity_bbl: 100000, heel_bbl: 0 }, as: TerminalOperator, captures: { t_id: $.data.id } }
            - { call: "POST /lease-agreements", payload: { customer_id: "${c_id}", product_grade: "DIESEL", committed_capacity_bbl: 50000, min_monthly_throughput_bbl: 100, throughput_fee_per_bbl: 0.50, shortfall_fee_per_bbl: 0.50, loss_allowance_pct: 0.005, excess_loss_rate_per_bbl: 50.00, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CustomerRep, as_user_id: "${c_id}", captures: { l_id: $.data.id } }
          trigger:
            - { call: "POST /movements", payload: { lease_id: "${l_id}", tank_id: "${t_id}", direction: "RECEIPT", mode: "VESSEL", product_grade: "DIESEL", declared_volume_bbl: 100, window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T12:00:00Z" }, as: Scheduler, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_LEASE_NOT_ACTIVE"
            - "no Movement row is created (GET /movements?lease_id=${l_id} returns empty array)"

      - name: certify_requires_sample_passed
        grounds:
          - state_machines.CustodyTransfer.PROVISIONAL_to_CERTIFIED
          - validations[priority=16]
        distinguishing_aspect: |
          Entity pair CustodyTransfer -> QualitySample (different pair than the
          Movement -> LeaseAgreement dependency): certification is gated on the
          movement's sample lab_result; a PENDING sample rejects with
          ERR_QUALITY_NOT_PASSED even though the custody transfer itself is in
          the correct from-state PROVISIONAL.
        test_recipe:
          setup:
            - "COMPLETED movement with PROVISIONAL custody transfer (declared 100, gauges 0->100 @60F)"
            - "Sample collected but lab result still PENDING"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Blue Ridge Oil", contact_email: "lab@blueridge.example" }, as: TerminalManager, captures: { c_id: $.data.id } }
            - { call: "POST /tanks", payload: { tank_code: "T-1401", product_grade: "DIESEL", capacity_bbl: 100000, heel_bbl: 0 }, as: TerminalOperator, captures: { t_id: $.data.id } }
            - { call: "POST /lease-agreements", payload: { customer_id: "${c_id}", product_grade: "DIESEL", committed_capacity_bbl: 50000, min_monthly_throughput_bbl: 100, throughput_fee_per_bbl: 0.50, shortfall_fee_per_bbl: 0.50, loss_allowance_pct: 0.005, excess_loss_rate_per_bbl: 50.00, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CustomerRep, as_user_id: "${c_id}", captures: { l_id: $.data.id } }
            - { call: "POST /lease-agreements/${l_id}/allocations", payload: { tank_id: "${t_id}", allocated_bbl: 20000, period_start: "2026-01-01", period_end: "2026-12-31" }, as: TerminalOperator, captures: { a_id: $.data.id } }
            - { call: "POST /tank-allocations/${a_id}/activate", payload: {}, as: TerminalOperator }
            - { call: "POST /lease-agreements/${l_id}/activate", payload: {}, as: TerminalManager }
            - { call: "POST /terminal-resources", payload: { resource_code: "DOCK-14", resource_type: "DOCK" }, as: TerminalOperator, captures: { r_id: $.data.id } }
            - { call: "POST /movements", payload: { lease_id: "${l_id}", tank_id: "${t_id}", direction: "RECEIPT", mode: "VESSEL", product_grade: "DIESEL", declared_volume_bbl: 100, window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T12:00:00Z" }, as: Scheduler, captures: { m_id: $.data.id } }
            - { call: "POST /movements/${m_id}/schedule", payload: { resource_id: "${r_id}" }, as: Scheduler }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T08:00:00Z" }, as: TerminalManager }
            - { call: "POST /movements/${m_id}/arrive", payload: {}, as: Scheduler }
            - { call: "POST /movements/${m_id}/gauge-tickets", payload: { ticket_type: "OPENING", observed_volume_bbl: 0, observed_temp_f: 60, observed_at: "2026-05-10T08:05:00Z" }, as: Gauger, as_user_id: "gauger-1" }
            - { call: "POST /movements/${m_id}/start", payload: {}, as: Scheduler }
            - { call: "POST /movements/${m_id}/gauge-tickets", payload: { ticket_type: "CLOSING", observed_volume_bbl: 100, observed_temp_f: 60, observed_at: "2026-05-10T10:00:00Z" }, as: Gauger, as_user_id: "gauger-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:05:00Z" }, as: TerminalManager }
            - { call: "POST /movements/${m_id}/complete", payload: {}, as: Scheduler }
            - { call: "POST /movements/${m_id}/samples", payload: { sample_type: "FIRST_FOOT" }, as: QualityInspector, as_user_id: "qi-1", captures: { s_id: $.data.id } }
            - { call: "GET /movements/${m_id}/custody-transfers", payload: {}, as: TerminalManager, captures: { ct_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /custody-transfers/${ct_id}/certify", payload: {}, as: TerminalManager, as_user_id: "tm-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_QUALITY_NOT_PASSED"
            - "CustodyTransfer.${ct_id}.status remains PROVISIONAL"

  - rule_id: resource_temporal_overlap
    instances:
      - name: dock_window_adjacency_allowed_overlap_rejected
        grounds:
          - calculations.resource_window_occupation
          - validations[priority=24]
        distinguishing_aspect: |
          Half-open interval semantics on TerminalResource (DOCK): a movement
          starting exactly at the predecessor's window_end is ADJACENT and legal,
          while one straddling both neighbours is rejected ERR_WINDOW_CONFLICT —
          adjacency (end == start) is not a conflict.
        test_recipe:
          setup:
            - "ACTIVE lease with ACTIVE allocation 20000; DOCK resource capacity 1"
            - "Movement A occupies [08:00, 12:00); movement B nominates [12:00, 16:00); movement C nominates [11:00, 13:00)"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Great Lakes Terminal", contact_email: "dock@glt.example" }, as: TerminalManager, captures: { c_id: $.data.id } }
            - { call: "POST /tanks", payload: { tank_code: "T-1501", product_grade: "DIESEL", capacity_bbl: 100000, heel_bbl: 0 }, as: TerminalOperator, captures: { t_id: $.data.id } }
            - { call: "POST /lease-agreements", payload: { customer_id: "${c_id}", product_grade: "DIESEL", committed_capacity_bbl: 50000, min_monthly_throughput_bbl: 100, throughput_fee_per_bbl: 0.50, shortfall_fee_per_bbl: 0.50, loss_allowance_pct: 0.005, excess_loss_rate_per_bbl: 50.00, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CustomerRep, as_user_id: "${c_id}", captures: { l_id: $.data.id } }
            - { call: "POST /lease-agreements/${l_id}/allocations", payload: { tank_id: "${t_id}", allocated_bbl: 20000, period_start: "2026-01-01", period_end: "2026-12-31" }, as: TerminalOperator, captures: { a_id: $.data.id } }
            - { call: "POST /tank-allocations/${a_id}/activate", payload: {}, as: TerminalOperator }
            - { call: "POST /lease-agreements/${l_id}/activate", payload: {}, as: TerminalManager }
            - { call: "POST /terminal-resources", payload: { resource_code: "DOCK-15", resource_type: "DOCK" }, as: TerminalOperator, captures: { r_id: $.data.id } }
            - { call: "POST /movements", payload: { lease_id: "${l_id}", tank_id: "${t_id}", direction: "RECEIPT", mode: "VESSEL", product_grade: "DIESEL", declared_volume_bbl: 100, window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T12:00:00Z" }, as: Scheduler, captures: { ma_id: $.data.id } }
            - { call: "POST /movements/${ma_id}/schedule", payload: { resource_id: "${r_id}" }, as: Scheduler }
            - { call: "POST /movements", payload: { lease_id: "${l_id}", tank_id: "${t_id}", direction: "RECEIPT", mode: "VESSEL", product_grade: "DIESEL", declared_volume_bbl: 100, window_start: "2026-05-10T12:00:00Z", window_end: "2026-05-10T16:00:00Z" }, as: Scheduler, captures: { mb_id: $.data.id } }
            - { call: "POST /movements/${mb_id}/schedule", payload: { resource_id: "${r_id}" }, as: Scheduler }
            - { call: "POST /movements", payload: { lease_id: "${l_id}", tank_id: "${t_id}", direction: "RECEIPT", mode: "VESSEL", product_grade: "DIESEL", declared_volume_bbl: 100, window_start: "2026-05-10T11:00:00Z", window_end: "2026-05-10T13:00:00Z" }, as: Scheduler, captures: { mc_id: $.data.id } }
          trigger:
            - { call: "POST /movements/${mc_id}/schedule", payload: { resource_id: "${r_id}" }, as: Scheduler, captures: { err: $.data.error_id } }
            - { call: "GET /movements/${ma_id}", payload: {}, as: Scheduler }
            - { call: "GET /movements/${mb_id}", payload: {}, as: Scheduler }
          assert:
            - "Movement.${ma_id}.status == SCHEDULED"
            - "Movement.${mb_id}.status == SCHEDULED (adjacent start == 12:00 == A.window_end is allowed)"
            - "err == ERR_WINDOW_CONFLICT (C straddles both occupied windows)"
            - "Movement.${mc_id}.status remains NOMINATED"

      - name: tank_allocation_aggregate_capacity_overlap
        grounds:
          - calculations.allocation_capacity_sweep
          - validations[priority=27]
        distinguishing_aspect: |
          Aggregate-capacity semantics on Tank with CLOSED date ranges (different
          entity and different interval semantics than the half-open dock
          windows): overlapping allocations may coexist while their summed
          allocated_bbl <= working_capacity_bbl (189900); the second allocation
          hits the boundary exactly (100000 + 89900 == 189900, allowed) and a
          further 1-bbl overlap is rejected ERR_ALLOCATION_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Two leases L1 and L2 on the same 200000-bbl DIESEL tank (working_capacity_bbl 189900, heel 100)"
            - "L1 allocation 100000 bbl ACTIVE over 2026-05-01..2026-07-31"
            - "L2 allocation 89900 bbl over 2026-06-01..2026-08-31 (overlap June-July sums to exactly the cap)"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Lakeshore Chemical", contact_email: "lease@lakeshore.example" }, as: TerminalManager, captures: { c1_id: $.data.id } }
            - { call: "POST /customers", payload: { name: "Prairie Fuels", contact_email: "lease@prairie.example" }, as: TerminalManager, captures: { c2_id: $.data.id } }
            - { call: "POST /tanks", payload: { tank_code: "T-1601", product_grade: "DIESEL", capacity_bbl: 200000, heel_bbl: 100 }, as: TerminalOperator, captures: { t_id: $.data.id } }
            - { call: "POST /lease-agreements", payload: { customer_id: "${c1_id}", product_grade: "DIESEL", committed_capacity_bbl: 150000, min_monthly_throughput_bbl: 100, throughput_fee_per_bbl: 0.50, shortfall_fee_per_bbl: 0.50, loss_allowance_pct: 0.005, excess_loss_rate_per_bbl: 50.00, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CustomerRep, as_user_id: "${c1_id}", captures: { l1_id: $.data.id } }
            - { call: "POST /lease-agreements/${l1_id}/allocations", payload: { tank_id: "${t_id}", allocated_bbl: 100000, period_start: "2026-05-01", period_end: "2026-07-31" }, as: TerminalOperator, captures: { a1_id: $.data.id } }
            - { call: "POST /tank-allocations/${a1_id}/activate", payload: {}, as: TerminalOperator }
            - { call: "POST /lease-agreements/${l1_id}/activate", payload: {}, as: TerminalManager }
            - { call: "POST /lease-agreements", payload: { customer_id: "${c2_id}", product_grade: "DIESEL", committed_capacity_bbl: 120000, min_monthly_throughput_bbl: 100, throughput_fee_per_bbl: 0.50, shortfall_fee_per_bbl: 0.50, loss_allowance_pct: 0.005, excess_loss_rate_per_bbl: 50.00, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CustomerRep, as_user_id: "${c2_id}", captures: { l2_id: $.data.id } }
            - { call: "POST /lease-agreements/${l2_id}/allocations", payload: { tank_id: "${t_id}", allocated_bbl: 89900, period_start: "2026-06-01", period_end: "2026-08-31" }, as: TerminalOperator, captures: { a2_id: $.data.id } }
            - { call: "POST /tank-allocations/${a2_id}/activate", payload: {}, as: TerminalOperator }
            - { call: "POST /lease-agreements/${l2_id}/activate", payload: {}, as: TerminalManager }
          trigger:
            - { call: "POST /lease-agreements/${l2_id}/allocations", payload: { tank_id: "${t_id}", allocated_bbl: 1, period_start: "2026-06-01", period_end: "2026-06-30" }, as: TerminalOperator, captures: { err: $.data.error_id } }
            - { call: "GET /tank-allocations/${a2_id}", payload: {}, as: TerminalOperator }
          assert:
            - "TankAllocation.${a2_id}.status == ACTIVE (boundary sum 189900 == working_capacity_bbl allowed)"
            - "err == ERR_ALLOCATION_CAPACITY_EXCEEDED (189901 > 189900 on overlapping June dates)"

  - rule_id: compensating_invariant
    instances:
      - name: certify_then_void_leaves_inventory_unchanged
        grounds:
          - calculations.tank_inventory_reconciliation
          - state_machines.CustodyTransfer.CERTIFIED_to_VOID
        distinguishing_aspect: |
          Conserved quantity: physical certified barrels in the tank. The forward
          action (certify, +500) paired with its compensating action (void) MUST
          leave Tank.current_inventory_bbl identical to the pre-certify value
          (0), per the pinned conservation formula over {CERTIFIED, DISPUTED}
          transfers excluding VOID.
        test_recipe:
          setup:
            - "ACTIVE lease; fresh tank (current_inventory_bbl == 0)"
            - "COMPLETED RECEIPT movement, custody transfer certified at 500 bbl (gauges 0->500 @60F, sg 0.85)"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Cascade Energy", contact_email: "audit@cascade.example" }, as: TerminalManager, captures: { c_id: $.data.id } }
            - { call: "POST /tanks", payload: { tank_code: "T-1701", product_grade: "DIESEL", capacity_bbl: 100000, heel_bbl: 0 }, as: TerminalOperator, captures: { t_id: $.data.id } }
            - { call: "POST /lease-agreements", payload: { customer_id: "${c_id}", product_grade: "DIESEL", committed_capacity_bbl: 50000, min_monthly_throughput_bbl: 100, throughput_fee_per_bbl: 0.50, shortfall_fee_per_bbl: 0.50, loss_allowance_pct: 0.005, excess_loss_rate_per_bbl: 50.00, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CustomerRep, as_user_id: "${c_id}", captures: { l_id: $.data.id } }
            - { call: "POST /lease-agreements/${l_id}/allocations", payload: { tank_id: "${t_id}", allocated_bbl: 20000, period_start: "2026-01-01", period_end: "2026-12-31" }, as: TerminalOperator, captures: { a_id: $.data.id } }
            - { call: "POST /tank-allocations/${a_id}/activate", payload: {}, as: TerminalOperator }
            - { call: "POST /lease-agreements/${l_id}/activate", payload: {}, as: TerminalManager }
            - { call: "POST /terminal-resources", payload: { resource_code: "DOCK-17", resource_type: "DOCK" }, as: TerminalOperator, captures: { r_id: $.data.id } }
            - { call: "POST /movements", payload: { lease_id: "${l_id}", tank_id: "${t_id}", direction: "RECEIPT", mode: "VESSEL", product_grade: "DIESEL", declared_volume_bbl: 500, window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T12:00:00Z" }, as: Scheduler, captures: { m_id: $.data.id } }
            - { call: "POST /movements/${m_id}/schedule", payload: { resource_id: "${r_id}" }, as: Scheduler }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T08:00:00Z" }, as: TerminalManager }
            - { call: "POST /movements/${m_id}/arrive", payload: {}, as: Scheduler }
            - { call: "POST /movements/${m_id}/gauge-tickets", payload: { ticket_type: "OPENING", observed_volume_bbl: 0, observed_temp_f: 60, observed_at: "2026-05-10T08:05:00Z" }, as: Gauger, as_user_id: "gauger-1" }
            - { call: "POST /movements/${m_id}/start", payload: {}, as: Scheduler }
            - { call: "POST /movements/${m_id}/gauge-tickets", payload: { ticket_type: "CLOSING", observed_volume_bbl: 500, observed_temp_f: 60, observed_at: "2026-05-10T10:00:00Z" }, as: Gauger, as_user_id: "gauger-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:05:00Z" }, as: TerminalManager }
            - { call: "POST /movements/${m_id}/complete", payload: {}, as: Scheduler }
            - { call: "POST /movements/${m_id}/samples", payload: { sample_type: "INLINE" }, as: QualityInspector, as_user_id: "qi-1", captures: { s_id: $.data.id } }
            - { call: "POST /quality-samples/${s_id}/record-result", payload: { lab_result: "PASSED", specific_gravity: 0.85 }, as: QualityInspector, as_user_id: "qi-2" }
            - { call: "GET /movements/${m_id}/custody-transfers", payload: {}, as: TerminalManager, captures: { ct_id: "$.data[0].id" } }
            - { call: "POST /custody-transfers/${ct_id}/certify", payload: {}, as: TerminalManager, as_user_id: "tm-1" }
            - { call: "GET /tanks/${t_id}", payload: {}, as: TerminalManager, captures: { inv_after_certify: $.data.current_inventory_bbl } }
          trigger:
            - { call: "POST /custody-transfers/${ct_id}/void", payload: {}, as: TerminalManager }
            - { call: "GET /tanks/${t_id}", payload: {}, as: TerminalManager }
          assert:
            - "inv_after_certify == 500 (certify added exactly the certified volume)"
            - "after void: Tank.${t_id}.current_inventory_bbl == 0 (compensating action restored the conserved quantity)"
            - "CustodyTransfer.${ct_id}.status == VOID"

      - name: activate_then_release_leaves_reserved_capacity_unchanged
        grounds:
          - entities.LeaseAgreement.fields.reserved_capacity_bbl
          - state_machines.TankAllocation.RESERVED_to_ACTIVE
          - state_machines.TankAllocation.ACTIVE_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity: commercially reserved barrels per lease (different
          conserved quantity than physical inventory). The forward action
          (allocation activate, +10000) paired with its compensating action
          (release) MUST leave LeaseAgreement.reserved_capacity_bbl identical to
          the pre-activate value (0).
        test_recipe:
          setup:
            - "Customer and DRAFT lease; tank with working capacity 189900; allocation 10000 bbl in RESERVED"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Frontier Oil", contact_email: "capacity@frontier.example" }, as: TerminalManager, captures: { c_id: $.data.id } }
            - { call: "POST /tanks", payload: { tank_code: "T-1801", product_grade: "DIESEL", capacity_bbl: 200000, heel_bbl: 100 }, as: TerminalOperator, captures: { t_id: $.data.id } }
            - { call: "POST /lease-agreements", payload: { customer_id: "${c_id}", product_grade: "DIESEL", committed_capacity_bbl: 100000, min_monthly_throughput_bbl: 100, throughput_fee_per_bbl: 0.50, shortfall_fee_per_bbl: 0.50, loss_allowance_pct: 0.005, excess_loss_rate_per_bbl: 50.00, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CustomerRep, as_user_id: "${c_id}", captures: { l_id: $.data.id } }
            - { call: "POST /lease-agreements/${l_id}/allocations", payload: { tank_id: "${t_id}", allocated_bbl: 10000, period_start: "2026-01-01", period_end: "2026-12-31" }, as: TerminalOperator, captures: { a_id: $.data.id } }
            - { call: "GET /lease-agreements/${l_id}", payload: {}, as: TerminalManager, captures: { reserved_before: $.data.reserved_capacity_bbl } }
          trigger:
            - { call: "POST /tank-allocations/${a_id}/activate", payload: {}, as: TerminalOperator }
            - { call: "GET /lease-agreements/${l_id}", payload: {}, as: TerminalManager, captures: { reserved_mid: $.data.reserved_capacity_bbl } }
            - { call: "POST /tank-allocations/${a_id}/release", payload: {}, as: TerminalOperator }
            - { call: "GET /lease-agreements/${l_id}", payload: {}, as: TerminalManager }
          assert:
            - "reserved_before == 0"
            - "reserved_mid == 10000"
            - "after release: LeaseAgreement.${l_id}.reserved_capacity_bbl == 0 (invariant restored)"
            - "TankAllocation.${a_id}.status == RELEASED"
