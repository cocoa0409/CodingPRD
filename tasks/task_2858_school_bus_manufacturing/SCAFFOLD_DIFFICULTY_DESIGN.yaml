  - rule_id: priority_pair_validation_conflict
    instances:

      - name: submit_reports_solicitation_not_open_over_price_cap_exceeded
        grounds:
          - validations[priority=22]
          - validations[priority=63]
          - errors[ERR_SOLICITATION_NOT_OPEN]
          - errors[ERR_PRICE_CAP_EXCEEDED]
