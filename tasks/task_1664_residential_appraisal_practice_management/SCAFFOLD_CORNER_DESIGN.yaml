              as: ClientUser
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
            - call: "GET /appraisal/revision-requests/${rr1}"
              as: FirmAdmin
              captures: { rr1_status: $.data.status }
          assert:
            - "first create with the observed version succeeded (captured ${rr1})"
            - "second create with the now-stale version -> error_id ERR_STALE_ORDER_VERSION, HTTP 412 (captured ${err})"
            - "rr1 remains OPEN (no supersede happened; captured ${rr1_status})"

      - name: occ_stale_client_version_on_schedule_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[fee-schedule-create-stale-client]", "errors[ERR_STALE_CLIENT_VERSION]"]
        distinguishing_aspect: "Two sequential fee-schedule creates carrying the version observed at client creation: first succeeds (Client.version 1 -> 2), second with the stale version -> 412 ERR_STALE_CLIENT_VERSION."
        test_recipe:
          setup: ["client created; version 1 captured"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FirmAdmin }
            - call: "POST /appraisal/clients"
              payload: { name: "C", client_type: AMC, contact_email: "c@x.example", default_turn_time_days: 7 }
              as: FirmAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
          trigger:
            - call: "POST /appraisal/fee-schedules"
              payload: { client_id: "${c_id}", complexity_tier: STANDARD, base_fee_cents: 45000, rush_multiplier_bps: 1500, revision_fee_cents: 15000, effective_from: "2026-07-01T00:00:00Z", expected_client_version: "${c_v}" }
              as: FirmAdmin
              captures: { fs1: $.data.id }
            - call: "POST /appraisal/fee-schedules"
              payload: { client_id: "${c_id}", complexity_tier: COMPLEX, base_fee_cents: 60000, rush_multiplier_bps: 1500, revision_fee_cents: 15000, effective_from: "2026-07-01T00:00:00Z", expected_client_version: "${c_v}" }
