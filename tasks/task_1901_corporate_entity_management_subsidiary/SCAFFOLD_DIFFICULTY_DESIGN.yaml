      - name: qualification_requires_good_standing
        grounds:
          - validations[priority=6]
          - calculations.compliance_posture_derivation
          - state_machines.AnnualFiling.SCHEDULED_to_OVERDUE
        distinguishing_aspect: |
          Entity pair ForeignQualification x LegalEntity: qualification
          creation is gated on the OWNING ENTITY's derived compliance_posture
          == GOOD_STANDING. Once the entity's own filings flip OVERDUE (clock
          2027-01-05, past due 2026-12-31 but within grace+30, so DELINQUENT
          not SUSPENDED), the same request that would have succeeded at the
          default clock is rejected with ERR_POSTURE_NOT_GOOD_STANDING.
        test_recipe:
          setup:
            - "J1, AG1, ACTIVE entity E1; J3 jurisdiction and agent AG3; AA3 covers (E1, J3)"
            - "AUTHORIZE_QUALIFICATION resolution for J3 ADOPTED at the default clock (posture GOOD_STANDING)"
            - "logical clock advanced to 2027-01-05 and swept: E1's period-2026 filings are OVERDUE -> posture DELINQUENT"
