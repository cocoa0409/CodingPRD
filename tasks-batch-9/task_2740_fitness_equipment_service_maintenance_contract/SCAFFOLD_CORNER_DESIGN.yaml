      - name: draining_the_last_refurbished_unit_only_obsoletes_an_announced_part
        claim_type: conditional action
        grounds:
          - endpoints[POST /fleetcare/parts/{partId}/inventory-adjustments]
          - state_machines[PartCatalogEntry].transitions[END_OF_SUPPORT_ANNOUNCED->OBSOLETE]
          - entities.Equipment.fields.support_status
        distinguishing_aspect: "The same stock adjustment has two different meanings: driving an ACTIVE part's refurbished bucket to zero leaves it ACTIVE and touches no equipment, while driving an END_OF_SUPPORT_ANNOUNCED critical spare's bucket to zero completes the slide to OBSOLETE and flips every unit of the model from END_OF_SUPPORT_ANNOUNCED to UNSUPPORTED."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00:00Z; club NORTH, unit e1 (installed 2024-03-01, 500 usage hours, health 93.50), ACTIVE GOLD/FULL contract."
            - "Part p1 is a critical spare with 1 refurbished unit and has already been declared end-of-support, so it is END_OF_SUPPORT_ANNOUNCED and e1 is END_OF_SUPPORT_ANNOUNCED."
            - "Part p2 is a non-critical ACTIVE part on the same model, also with 1 refurbished unit and no declaration."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-OB-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/parts", payload: { model_id: "${model_id}", part_number: "MOTOR-CTRL", category: "ELECTRONIC", unit_price_cents: 90000, is_critical_spare: true, initial_on_hand_qty: 0, initial_refurb_qty: 1 }, as: PartsPlanner, captures: { p1_id: "$.data.id" } }
            - { call: "POST /fleetcare/parts", payload: { model_id: "${model_id}", part_number: "SIDE-RAIL", category: "COSMETIC", unit_price_cents: 4000, is_critical_spare: false, initial_on_hand_qty: 0, initial_refurb_qty: 1 }, as: PartsPlanner, captures: { p2_id: "$.data.id" } }
            - { call: "POST /fleetcare/parts/${p1_id}/declare-end-of-support", as: PartsPlanner, captures: { p1_announced: "$.data.lifecycle_status" } }
          trigger:
            - { call: "POST /fleetcare/parts/${p2_id}/inventory-adjustments", payload: { new_qty_delta: 0, refurb_qty_delta: -1 }, as: PartsPlanner, captures: { p2_state: "$.data.lifecycle_status", p2_refurb: "$.data.refurb_on_hand_qty" } }
            - { call: "GET /fleetcare/equipment/${e1_id}", as: PartsPlanner, captures: { sup_mid: "$.data.support_status" } }
            - { call: "POST /fleetcare/parts/${p1_id}/inventory-adjustments", payload: { new_qty_delta: 0, refurb_qty_delta: -1 }, as: PartsPlanner, captures: { p1_state: "$.data.lifecycle_status", p1_refurb: "$.data.refurb_on_hand_qty" } }
            - { call: "GET /fleetcare/equipment/${e1_id}", as: PartsPlanner, captures: { sup_final: "$.data.support_status", health_final: "$.data.health_score", repl_final: "$.data.replacement_recommended" } }
          assert:
            - "${p1_announced} == 'END_OF_SUPPORT_ANNOUNCED' (one refurbished unit still on the shelf)"
            - "${p2_state} == 'ACTIVE' with ${p2_refurb} == 0 — an undeclared part does not obsolete itself by running out of stock"
            - "${sup_mid} == 'END_OF_SUPPORT_ANNOUNCED' — the p2 adjustment cascaded nowhere"
            - "${p1_state} == 'OBSOLETE' with ${p1_refurb} == 0 and eos_declared_at unchanged from the declaration"
            - "${sup_final} == 'UNSUPPORTED' — the announced critical spare's exhaustion completes the cascade"
            - "${health_final} == 93.50 and ${repl_final} == false — 93.50 clears even the relaxed 60.00 threshold"
            - "ServiceContract.${c_id}.obsolete_unit_count == 1, replacement_candidate_count == 0 and fleet_renewal_risk == 'LOW'"

      - name: technician_crud_round_trip_with_filters_and_a_paging_window
        claim_type: Standard CRUD
        grounds:
          - endpoints[POST /fleetcare/technicians]
          - endpoints[GET /fleetcare/technicians/{technicianId}]
          - endpoints[GET /fleetcare/technicians]
          - response_envelope.pagination_fields
        distinguishing_aspect: "Create, read-by-id and list are exercised on one entity that has no update or delete endpoint: three filters (region_code, duty_status, is_safety_inspector) each narrow the same three rows differently, and a limit/offset window reports total_count over the whole filtered set rather than over the page."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00:00Z. Technicians are created in order: T1 (NORTH, TREADMILL, not an inspector), T2 (NORTH, TREADMILL, is_safety_inspector true), T3 (SOUTH, BIKE, not an inspector). T1 is then switched OFF_DUTY."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id", t1_duty: "$.data.duty_status", t1_insp: "$.data.is_safety_inspector", t1_max: "$.data.max_committed_minutes", t1_committed: "$.data.committed_minutes" } }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Ravi Shah", region_code: "NORTH", skill_categories: ["TREADMILL"], is_safety_inspector: true, max_committed_minutes: 600 }, as: ServiceCoordinator, captures: { t2_id: "$.data.id" } }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Alba Ncube", region_code: "SOUTH", skill_categories: ["BIKE"] }, as: ContractAdministrator, captures: { t3_id: "$.data.id" } }
            - { call: "POST /fleetcare/technicians/${t1_id}/duty-status", payload: { duty_status: "OFF_DUTY" }, as: ServiceCoordinator }
          trigger:
            - { call: "GET /fleetcare/technicians/${t2_id}", as: FieldTechnician, as_user_id: "${t2_id}", captures: { r_name: "$.data.full_name", r_region: "$.data.region_code", r_insp: "$.data.is_safety_inspector", r_max: "$.data.max_committed_minutes", r_duty: "$.data.duty_status" } }
            - { call: "GET /fleetcare/technicians", payload: { region_code: "NORTH" }, as: ServiceCoordinator, captures: { f1_first: "$.data[0].id", f1_second: "$.data[1].id" } }
            - { call: "GET /fleetcare/technicians", payload: { region_code: "NORTH", duty_status: "ON_DUTY" }, as: ServiceCoordinator, captures: { f2_first: "$.data[0].id" } }
            - { call: "GET /fleetcare/technicians", payload: { is_safety_inspector: true }, as: SafetyInspector, as_user_id: "${t2_id}", captures: { f3_first: "$.data[0].id" } }
            - { call: "GET /fleetcare/technicians", payload: { limit: 1, offset: 1 }, as: ContractAdministrator, captures: { pg_first: "$.data[0].id" } }
          assert:
            - "creation defaults are applied: ${t1_duty} == 'ON_DUTY', ${t1_insp} == false, ${t1_max} == 480 and ${t1_committed} == 0"
            - "${r_name} == 'Ravi Shah', ${r_region} == 'NORTH', ${r_insp} == true, ${r_max} == 600 and ${r_duty} == 'ON_DUTY' — the read returns exactly what was stored"
            - "the region_code filter returns total_count 2 with ${f1_first} == ${t1_id} and ${f1_second} == ${t2_id} in created_at ASC order"
            - "the region + duty filter returns total_count 1 with ${f2_first} == ${t2_id} (T1 is OFF_DUTY)"
            - "the inspector filter returns total_count 1 with ${f3_first} == ${t2_id}"
            - "the paging window returns exactly one row, ${pg_first} == ${t2_id}, with limit 1, offset 1, total_count 3 and has_more true"
            - "Technician exposes no update or delete endpoint, so the created rows can only be mutated through duty-status"

  # ---------------------------------------------------------------------------
  # errors: Table 6 defines no claim-type rows of its own; it requires only that
  # every catalogue code be triggerable somewhere. The single instance below
  # pins the envelope shape per HTTP status class. Coverage audit for all 62
  # codes is recorded in the trailing comment block at the end of this file.
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_replies_use_the_declared_envelope_at_every_status_class
        claim_type: error_triggerable
        grounds:
          - response_envelope.error
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_ROLE_FORBIDDEN
          - errors.ERR_CLUB_NOT_FOUND
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_STALE_CONTRACT_VERSION
          - errors.ERR_CONTRACT_INVALID_STATE
          - errors.ERR_USAGE_REGRESSION
        distinguishing_aspect: "Seven failures spanning 401, 403, 404, 400, 412, 409 and 422 all come back in the identical error envelope — response_type 'error' with data holding exactly error_id and message and nothing else — so no status class is allowed its own bespoke body shape."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00:00Z; club NORTH with unit e1 (500 usage hours) and an ACTIVE GOLD/FULL contract at version 2."
            - "The first trigger below is issued with both the X-User-Role and X-User-ID headers omitted entirely; the second is issued as ClubManager, a role absent from the club-creation endpoint's roles list."
            - "The unknown-id literal is 00000000-0000-4000-8000-000000000000."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-EV-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
          trigger:
            - { call: "GET /fleetcare/clubs/${club_id}", as: ContractAdministrator, captures: { e401: "$.data.error_id", m401: "$.data.message" } }
            - { call: "POST /fleetcare/clubs", payload: { name: "Rogue Club", region_code: "NORTH" }, as: ClubManager, as_user_id: "${club_id}", captures: { e403: "$.data.error_id" } }
            - { call: "GET /fleetcare/clubs/00000000-0000-4000-8000-000000000000", as: ContractAdministrator, captures: { e404: "$.data.error_id" } }
            - { call: "POST /fleetcare/clubs", payload: { name: "Nameless Region" }, as: ContractAdministrator, captures: { e400: "$.data.error_id" } }
            - { call: "GET /fleetcare/contracts/${c_id}", as: ContractAdministrator, captures: { occ_ver_g: "$.data.version" } }
            - { call: "POST /fleetcare/contracts/${c_id}/renewal-quotes", payload: { expected_contract_version: "${occ_ver_g} - 1" }, as: ContractAdministrator, captures: { e412: "$.data.error_id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator, captures: { e409: "$.data.error_id" } }
            - { call: "POST /fleetcare/equipment/${e1_id}/usage-readings", payload: { usage_hours: 1 }, as: ServiceCoordinator, captures: { e422: "$.data.error_id" } }
          assert:
            - "${e401} == 'ERR_UNAUTHENTICATED' with HTTP 401 when both identity headers are absent, and the same 401 is returned for X-User-Role values outside the six declared roles"
            - "${e403} == 'ERR_ROLE_FORBIDDEN' with HTTP 403 — the role check runs before anything the body says"
            - "${e404} == 'ERR_CLUB_NOT_FOUND' with HTTP 404"
            - "${e400} == 'ERR_INVALID_REQUEST' with HTTP 400 for the missing required region_code"
            - "${e412} == 'ERR_STALE_CONTRACT_VERSION' with HTTP 412 and ServiceContract.${c_id}.status is still 'ACTIVE' at version 2"
            - "${e409} == 'ERR_CONTRACT_INVALID_STATE' with HTTP 409 — activate needs DRAFT"
            - "${e422} == 'ERR_USAGE_REGRESSION' with HTTP 422 and Equipment.${e1_id}.usage_hours is still 500.00"
            - "every one of the seven bodies has response_type 'error', a data object whose only keys are error_id and message, ${m401} non-empty, and a meta block carrying api_request_id and api_request_timestamp"
            - "no successful side effect was produced by any of the seven requests"

  - section: rbac
    instances:
      - name: each_roles_exclusive_operations_are_closed_to_the_other_five
        claim_type: exclusive_operations
        grounds:
          - roles.ContractAdministrator.exclusive_operations
          - roles.ServiceCoordinator.exclusive_operations
          - roles.PartsPlanner.exclusive_operations
          - roles.FieldTechnician.exclusive_operations
          - roles.SafetyInspector.exclusive_operations
          - roles.ClubManager.exclusive_operations
          - validations[priority 2 ERR_ROLE_FORBIDDEN]
        distinguishing_aspect: "Seven cross-role attempts, one per role's signature operation, all fail with ERR_ROLE_FORBIDDEN — and because the role gate sits at priority 2 it fires even when the path id does not exist at all, so none of them can be mistaken for a 404."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00:00Z; a single club NORTH exists so the closing control call can succeed."
            - "Every refusal below is aimed at the unknown-id literal 00000000-0000-4000-8000-000000000000 to prove the role gate outranks the not-found gate."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
          trigger:
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ClubManager, as_user_id: "${club_id}", captures: { r_cm_contract: "$.data.error_id" } }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "00000000-0000-4000-8000-000000000000", equipment_id: "00000000-0000-4000-8000-000000000000", window_start: "2026-08-16T09:00:00Z", window_end: "2026-08-16T11:00:00Z" }, as: ContractAdministrator, captures: { r_ca_visit: "$.data.error_id" } }
            - { call: "POST /fleetcare/service-calls/00000000-0000-4000-8000-000000000000/dispatch", payload: { start_at: "2026-08-16T09:00:00Z" }, as: FieldTechnician, as_user_id: "00000000-0000-4000-8000-000000000000", captures: { r_ft_dispatch: "$.data.error_id" } }
            - { call: "POST /fleetcare/contracts/00000000-0000-4000-8000-000000000000/activate", as: PartsPlanner, captures: { r_pp_activate: "$.data.error_id" } }
            - { call: "POST /fleetcare/downtime-events/00000000-0000-4000-8000-000000000000/waive", payload: { waive_reason: "goodwill" }, as: SafetyInspector, as_user_id: "00000000-0000-4000-8000-000000000000", captures: { r_si_waive: "$.data.error_id" } }
            - { call: "POST /fleetcare/preventive-visits/00000000-0000-4000-8000-000000000000/safety-doc/certify", as: ServiceCoordinator, captures: { r_sc_certify: "$.data.error_id" } }
            - { call: "POST /fleetcare/renewal-quotes/00000000-0000-4000-8000-000000000000/accept", as: ContractAdministrator, captures: { r_ca_accept: "$.data.error_id" } }
            - { call: "POST /fleetcare/parts/00000000-0000-4000-8000-000000000000/inventory-adjustments", payload: { new_qty_delta: 1, refurb_qty_delta: 0 }, as: ServiceCoordinator, captures: { r_sc_stock: "$.data.error_id" } }
          assert:
            - "${r_cm_contract} == 'ERR_ROLE_FORBIDDEN' with HTTP 403 — contract creation is ContractAdministrator-only"
            - "${r_ca_visit} == 'ERR_ROLE_FORBIDDEN' — preventive-visit scheduling is ServiceCoordinator-only even for the administrator"
            - "${r_ft_dispatch} == 'ERR_ROLE_FORBIDDEN' and ${r_pp_activate} == 'ERR_ROLE_FORBIDDEN'"
            - "${r_si_waive} == 'ERR_ROLE_FORBIDDEN' — credit waiving is ContractAdministrator-only"
            - "${r_sc_certify} == 'ERR_ROLE_FORBIDDEN' — certification is SafetyInspector-only"
            - "${r_ca_accept} == 'ERR_ROLE_FORBIDDEN' — only the club may accept or decline its renewal quote"
            - "${r_sc_stock} == 'ERR_ROLE_FORBIDDEN' — stock adjustments are PartsPlanner-only"
            - "every one of the eight refusals is 403 with ERR_ROLE_FORBIDDEN, never 404 and never ERR_INVALID_REQUEST, even though six of them name ids that do not exist"

      - name: shared_operations_accept_either_holder_without_a_handoff
        claim_type: shared_operations
        grounds:
          - roles.ClubManager.shared_operations
          - roles.ServiceCoordinator.shared_operations
          - roles.ContractAdministrator.shared_operations
          - roles.PartsPlanner.shared_operations
          - roles.FieldTechnician.shared_operations
        distinguishing_aspect: "The four shared operations are exercised by both of their holders and, critically, crosswise: the call the club manager filed is cancelled by the coordinator and the call the coordinator filed is cancelled by the club manager, so authority attaches to the role list and not to whoever created the row."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00:00Z; club NORTH, units e1 and e2, ACTIVE GOLD/FULL contract, technician T1 (NORTH, TREADMILL)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
