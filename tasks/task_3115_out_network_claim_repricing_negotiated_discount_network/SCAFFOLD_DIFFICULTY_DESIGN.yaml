          assert:
            - "ProviderAppeal.${ap_i_id}.status == RE_REVIEWED_ADJUSTED"
            - "GET /claims/${claim_i_id}/determinations returns 2 rows"
            - "exactly one determination is ACTIVE with supersedes_determination_id == ${det_i_id}"
            - "RepricingDetermination.${det_i_id}.status == SUPERSEDED"
            - "Claim.${claim_i_id}.allowed_amount_cents == 44000"
            - "Claim.${claim_i_id}.payer_liability_cents == 39000"
            - "Claim.${claim_i_id}.savings_cents == 21000"
            - "Claim.${claim_i_id}.version == ${claim_i_v} + 1"

      - name: settlement_execution_cascades_claim_settled_then_case_settled
        grounds:
          - state_machines.SettlementAgreement.PENDING_SIGNATURES_to_EXECUTED
          - state_machines.Claim.PRICED_to_SETTLED
          - state_machines.NegotiationCase.ACCEPTED_to_SETTLED
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (second settlement signature,
          not an appeal resolve): (1) EXECUTED signature fires Claim PRICED ->
          SETTLED with the settled amount and a superseding NEGOTIATED
          determination; (2) the claim transition's resolution settles the parent
