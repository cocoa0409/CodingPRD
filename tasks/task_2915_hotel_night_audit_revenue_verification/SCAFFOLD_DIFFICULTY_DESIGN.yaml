              as_user_id: "u_fd_1"
            - call: "POST /night-audit/folios/${db2_id}/check-out"
              payload: { business_date_id: "${bd1_id}" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/folios/${db3_id}/check-out"
              payload: { business_date_id: "${bd1_id}" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/post-room-and-tax"
