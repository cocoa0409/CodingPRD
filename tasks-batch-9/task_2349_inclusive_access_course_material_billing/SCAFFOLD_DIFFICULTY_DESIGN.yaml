          Categories state (48) versus business_temporal (77), 29 priority points apart: with the
          clock at 2026-09-06 the opt-out window (2026-09-04T23:59:59.999Z) is already shut, so the
          same request returns ERR_OPT_OUT_WINDOW_CLOSED while the term is OPEN and flips to
          ERR_TERM_BILLING_LOCKED the instant the term locks - the temporal violation is masked, not
          resolved.
