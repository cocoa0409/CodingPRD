scaffold_corner_design:
  - section: entities
    instances:
      - name: client_create_success_and_defaults
        claim_type: creation
        grounds: [entities.Client, endpoints.POST_/retail-reset/clients]
        distinguishing_aspect: "POST with required fields returns 201 with server-minted UUID id, status defaulting to ACTIVE, version 1, created_at stamped from the logical clock."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /retail-reset/clients"
              payload: { name: "New Client", billing_model: "PER_STORE", per_store_rate_cents: 3000 }
              as: ProjectManager
              captures: { cid: "$.data.id" }
          trigger:
            - call: "GET /retail-reset/clients/${cid}"
              payload: {}
              as: ProjectManager
          assert:
            - "Client.${cid}.status == ACTIVE"
            - "Client.${cid}.version == 1"
            - "Client.${cid}.id matches UUID format without type prefix"
      - name: client_create_missing_name_rejected
        claim_type: required_fields
        grounds: [entities.Client.fields.name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field name yields ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /retail-reset/clients"
              payload: { billing_model: "PER_STORE", per_store_rate_cents: 3000 }
              as: ProjectManager
          assert:
            - "response error_id == ERR_INVALID_REQUEST (400)"
      - name: rep_create_invalid_employment_type_rejected
        claim_type: type_constraints
        grounds: [entities.FieldRep.fields.employment_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "employment_type outside {W2, C1099} yields ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /retail-reset/reps"
              payload: { full_name: "Bad Rep", employment_type: "SEASONAL", home_base_commute_miles: 5, mileage_rate_cents: 67, travel_minute_rate_cents: 40, mileage_policy: "HOME_BASED" }
              as: PayrollAdmin
          assert:
            - "response error_id == ERR_INVALID_REQUEST (400)"
      - name: entity_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "endpoints.GET_/retail-reset/projects/{id}"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /retail-reset/projects/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ProjectManager
          assert:
            - "response error_id == ERR_NOT_FOUND (404)"
      - name: project_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, endpoints.GET_/retail-reset/projects]
        distinguishing_aspect: "List endpoint returns limit/offset/total_count/has_more with defaults limit=10, offset=0."
        test_recipe:
          setup:
            - "one client with 3 projects"
          setup_api_calls:
            - call: "POST /retail-reset/clients"
              payload: { name: "Page Client", billing_model: "PER_STORE", per_store_rate_cents: 3000 }
              as: ProjectManager
              captures: { cid: "$.data.id" }
            - call: "POST /retail-reset/projects"
              payload: { client_id: "${cid}", title: "P1", scope_type: "AUDIT" }
              as: ProjectManager
            - call: "POST /retail-reset/projects"
              payload: { client_id: "${cid}", title: "P2", scope_type: "RESET" }
              as: ProjectManager
            - call: "POST /retail-reset/projects"
              payload: { client_id: "${cid}", title: "P3", scope_type: "NEW_ITEM_CUTOVER" }
              as: ProjectManager
          trigger:
            - call: "GET /retail-reset/projects?limit=2&offset=0"
              payload: {}
              as: ProjectManager
          assert:
            - "response contains pagination fields limit, offset, total_count, has_more"
            - "total_count == 3 and has_more == true when limit=2&offset=0"
      - name: photo_evidence_immutable_no_version
        claim_type: immutability
        grounds: [entities.PhotoEvidence]
        distinguishing_aspect: "PhotoEvidence declares common_fields: false — response carries id and created_at but no version and no updated_at, and no update endpoint exists in §1.5."
        test_recipe:
          setup:
            - "rep ON_SITE with a checked-in visit"
          setup_api_calls:
            - call: "POST /retail-reset/clients"
              payload: { name: "Imm Client", billing_model: "PER_STORE", per_store_rate_cents: 3500 }
              as: ProjectManager
              captures: { client_id: "$.data.id" }
            - call: "POST /retail-reset/reps"
              payload: { full_name: "Imm Rep", employment_type: "W2", home_base_commute_miles: 5, mileage_rate_cents: 67, travel_minute_rate_cents: 40, mileage_policy: "HOME_BASED" }
              as: PayrollAdmin
              captures: { rep_id: "$.data.id" }
            - call: "POST /retail-reset/stores"
              payload: { store_number: "IM1", name: "Imm Store", address: "30 Elm", timezone: "America/Chicago" }
              as: ProjectManager
              captures: { store_id: "$.data.id" }
            - call: "POST /retail-reset/projects"
              payload: { client_id: "${client_id}", title: "Imm Proj", scope_type: "AUDIT" }
              as: ProjectManager
              captures: { project_id: "$.data.id", project_ver: "$.data.version" }
            - call: "POST /retail-reset/project-stores"
              payload: { project_id: "${project_id}", store_id: "${store_id}", due_date: "2026-08-20" }
              as: ProjectManager
              captures: { ps_id: "$.data.id" }
            - call: "POST /retail-reset/projects/${project_id}/scope"
              payload: { expected_project_version: "${project_ver} + 1" }
              as: ProjectManager
            - call: "POST /retail-reset/assignments"
              payload: { project_id: "${project_id}", project_store_id: "${ps_id}", rep_id: "${rep_id}", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T11:00:00Z" }
              as: ProjectManager
              captures: { asg_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:30:00Z" }
              as: ProjectManager
            - call: "POST /retail-reset/assignments/${asg_id}/check-in"
              payload: {}
              as: FieldRep
              as_user_id: "${rep_id}"
              captures: { visit_id: "$.data.id" }
          trigger:
            - call: "POST /retail-reset/store-visits/${visit_id}/photos"
              payload: { photo_type: "BEFORE", image_url: "https://img/x.jpg", captured_at: "2026-08-05T09:35:00Z" }
              as: FieldRep
              as_user_id: "${rep_id}"
              captures: { photo: "$.data" }
          assert:
            - "PhotoEvidence response has id and created_at"
            - "PhotoEvidence response has no version field"
      - name: project_store_computed_count_after_verify
        claim_type: computed_fields
        grounds: [entities.Project.fields.completed_store_count, calculations.invoice_total]
        distinguishing_aspect: "completed_store_count recomputes from 0 to 1 upon the only visit's verification."
        test_recipe:
          setup:
            - "one-store PER_STORE project; visit SUBMITTED with photos"
          setup_api_calls:
            - call: "POST /retail-reset/clients"
              payload: { name: "CC Client", billing_model: "PER_STORE", per_store_rate_cents: 3500 }
              as: ProjectManager
              captures: { client_id: "$.data.id" }
            - call: "POST /retail-reset/reps"
              payload: { full_name: "CC Rep", employment_type: "W2", home_base_commute_miles: 5, mileage_rate_cents: 67, travel_minute_rate_cents: 40, mileage_policy: "HOME_BASED" }
              as: PayrollAdmin
              captures: { rep_id: "$.data.id" }
            - call: "POST /retail-reset/stores"
              payload: { store_number: "CC1", name: "CC Store", address: "31 Elm", timezone: "America/Chicago" }
              as: ProjectManager
              captures: { store_id: "$.data.id" }
            - call: "POST /retail-reset/projects"
              payload: { client_id: "${client_id}", title: "CC Proj", scope_type: "AUDIT" }
              as: ProjectManager
              captures: { project_id: "$.data.id", project_ver: "$.data.version" }
            - call: "POST /retail-reset/project-stores"
              payload: { project_id: "${project_id}", store_id: "${store_id}", due_date: "2026-08-20" }
              as: ProjectManager
              captures: { ps_id: "$.data.id" }
            - call: "POST /retail-reset/projects/${project_id}/scope"
              payload: { expected_project_version: "${project_ver} + 1" }
              as: ProjectManager
            - call: "POST /retail-reset/assignments"
              payload: { project_id: "${project_id}", project_store_id: "${ps_id}", rep_id: "${rep_id}", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T11:00:00Z" }
              as: ProjectManager
              captures: { asg_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:30:00Z" }
              as: ProjectManager
            - call: "POST /retail-reset/assignments/${asg_id}/check-in"
              payload: {}
              as: FieldRep
              as_user_id: "${rep_id}"
              captures: { visit_id: "$.data.id" }
            - call: "POST /retail-reset/store-visits/${visit_id}/photos"
              payload: { photo_type: "BEFORE", image_url: "https://img/b.jpg", captured_at: "2026-08-05T09:31:00Z" }
              as: FieldRep
              as_user_id: "${rep_id}"
            - call: "POST /retail-reset/store-visits/${visit_id}/photos"
              payload: { photo_type: "AFTER", image_url: "https://img/a.jpg", captured_at: "2026-08-05T10:29:00Z" }
              as: FieldRep
              as_user_id: "${rep_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:30:00Z" }
              as: ProjectManager
            - call: "POST /retail-reset/assignments/${asg_id}/check-out"
              payload: {}
              as: FieldRep
              as_user_id: "${rep_id}"
          trigger:
            - call: "POST /retail-reset/store-visits/${visit_id}/verify"
              payload: {}
              as: ProjectManager
            - call: "GET /retail-reset/projects/${project_id}"
              payload: {}
              as: ProjectManager
          assert:
            - "Project.${project_id}.completed_store_count == 1"

