          Pair RecordBook -> Volunteer (a different entity pair than instance 1): a RecordBook can
          only transition UNDER_REVIEW->APPROVED when the acting Volunteer entity has
          screening_status == CLEARED. An UNDER_REVIEW book stays unapproved when the reviewer is
          PENDING, even though the book is in a valid from-state.
        test_recipe:
