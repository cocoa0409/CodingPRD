            - "case 1 (Ada) occupies room A over [14:00, 15:00): procedure 20 ends 14:20, turnover 40 runs to 15:00"
            - "case 2 (Bell) starts 14:20, exactly when the patient of case 1 leaves the room but the room is mid-turnover"
            - "case 3 (Bell) starts 15:00, when turnover has finished"
            - "the two urologists differ so ERR_PROVIDER_DOUBLE_BOOKED at priority 59 can never fire"
