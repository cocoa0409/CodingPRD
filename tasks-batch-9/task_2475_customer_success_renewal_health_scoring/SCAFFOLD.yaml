scenario: |
  Generate task harder than expert level!

  2475. Customer Success Renewal & Health Scoring (software customer success organization): health score
  model construction from product usage, support tickets, executive engagement and outcome attainment,
  segmentation into high-touch, low-touch and digital coverage with capacity-based assignment, onboarding
  milestone tracking with time-to-value measurement and intervention triggers, risk identification with
  save plays, executive escalation and remediation commitments, renewal forecasting with likelihood
  categories and finance reconciliation, expansion opportunity identification and handoff rules with the
  sales team, churn root cause analysis and win-back campaigns, customer advisory board and reference
  program participation

domain_name: customer-success-renewal-health-scoring
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # graph: Account, Csm, SavePlay, EscalationCase and ExpansionOpportunity form a
  # many-to-many / cross-aggregate reference web (CoverageAssignment is a true
  # junction between Account and Csm; ExpansionOpportunity and CoverageAssignment
  # both carry self-referential edges). No URL nesting expresses ownership except
  # for the strictly-owned child collections.

  state_machine_shape: parallel
  # RenewalForecast carries two independent state axes on the same row
  # (cs_state: DRAFT->SUBMITTED->LOCKED with a SUBMITTED->DRAFT revision edge,
  # finance_state: PENDING->RECONCILED|VARIANCE_FLAGGED with a
  # VARIANCE_FLAGGED->PENDING edge). EscalationCase (COMMITTED<->DISPUTED),
  # Account (CHURNED->WIN_BACK_TARGETED->ADOPTING), AdvocacyEnrollment
  # (ACTIVE<->SUSPENDED) and ExpansionOpportunity (REJECTED->RECYCLED spawning a
  # fresh IDENTIFIED row) add cyclic shapes; CoverageAssignment adds a branching
  # QUEUED->{COMMITTED, PREEMPTED} fork with divergent side-effect sets.

  relationship_patterns:
    - one_to_many        # Account -> AccountSignal / OutcomeGoal / OnboardingMilestone / ...
    - many_to_many       # Account <-> Csm through CoverageAssignment
    - self_referential   # ExpansionOpportunity.recycled_from_opportunity_id, CoverageAssignment.superseded_by_assignment_id
    - cross_aggregate    # EscalationCase.save_play_id, ExecutiveEngagement.sponsor_contact_id, SavePlay.owner_csm_id
    - polymorphic        # AccountSignal.signal_kind selects which field subset is populated and which calculation consumes the row

  role_model: segregation_of_duties
  # The CsExecutive who ACCEPTs a RemediationCommitment may not be the actor who
  # DELIVERs it; the CsmUser who owns a SavePlay may not sign the escalation off.
  # Layered on top of peer-role resource ownership (FinanceAnalyst owns the
  # finance axis of RenewalForecast, SalesAccountExecutive owns the expansion
  # accept/reject decision, AdvocacyManager owns AdvocacyEnrollment).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Customer account display name.
        constraints: "1..120 characters"
      - name: arr_cents
        type: integer
        source: input
        description: Annual recurring revenue in integer cents.
        constraints: ">= 0"
      - name: segment_band
        type: enum
        source: input
        description: Commercial band that drives coverage floors, TTV targets, finance top-down rate and reference-call cap.
        constraints: "ENTERPRISE | MIDMARKET | SMB"
      - name: contract_start_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the current term began; baseline for contractual_ttv_days."
      - name: contract_end_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the current term ends; drives days_to_renewal in calculations.renewal_likelihood."
      - name: lifecycle_state
        type: enum
        source: system
        default: ONBOARDING
        description: Account lifecycle state machine value.
        constraints: "ONBOARDING | ADOPTING | STEADY | AT_RISK | RENEWED | CHURNED | WIN_BACK_TARGETED | ARCHIVED"
      - name: adoption_index
        type: number
        source: computed
        default: 0.00
        description: Recency-weighted trailing-three-period product adoption index; output of calculations.adoption_index.
        constraints: "0.00..100.00, 2 decimal places"
      - name: support_risk_penalty
        type: number
        source: computed
        default: 0.00
        description: Capped support penalty points; output of calculations.support_risk_penalty.
        constraints: "0.00..45.00"
      - name: exec_engagement_score
        type: number
        source: computed
        default: 0.00
        description: Executive-engagement component score; output of calculations.exec_engagement_score.
        constraints: "0.00..100.00"
      - name: outcome_attainment_index
        type: number
        source: computed
        default: 0.00
        description: Weight-normalised outcome attainment; output of calculations.outcome_attainment_index.
        constraints: "0.00..100.00"
      - name: snapshot_health_score
        type: number
        source: computed
        default: 0.00
        description: "Point-in-time health score (snapshot_health variant of calculations.account_health_score); the ONLY input to health_tier."
        constraints: "0.00..100.00"
      - name: trended_health_score
        type: number
        source: computed
        default: 0.00
        description: "Trailing-trend health score (trended_health variant of calculations.account_health_score); the ONLY health input to renewal_likelihood and qualification_score."
        constraints: "0.00..100.00"
      - name: health_tier
        type: enum
        source: computed
        default: RED
        description: Tier derived from snapshot_health_score by calculations.account_health_score.
        constraints: "RED | AMBER | GREEN"
      - name: coverage_tier
        type: enum
        source: computed
        default: UNASSIGNED
        description: Coverage segmentation output of calculations.coverage_tier_assignment.
        constraints: "HIGH_TOUCH | LOW_TOUCH | DIGITAL | UNASSIGNED"
      - name: coverage_posture
        type: enum
        source: computed
        default: RESTRICTED
        description: Derived gating posture; output of calculations.coverage_posture_derivation.
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: assigned_csm_id
        type: string
        source: computed
        default: null
        description: "FK -> Csm.id; set when a CoverageAssignment for this account reaches COMMITTED, cleared when that assignment leaves COMMITTED."
      - name: open_save_play_count
        type: integer
        source: computed
        default: 0
        description: Count of SavePlay rows for this account in state ACTIVE.
        constraints: ">= 0"
      - name: ttv_breach_flag
        type: boolean
        source: computed
        default: false
        description: Intervention trigger raised by POST /_ops/daily-sweep when an ONBOARDING account exceeds its TTV target; cleared by lifecycle action WAIVE_TTV_BREACH.
      - name: contractual_ttv_days
        type: integer
        source: computed
        default: null
        description: contractual_ttv variant of calculations.time_to_value_days; null until the GO_LIVE milestone is COMPLETED.
      - name: activation_ttv_days
        type: integer
        source: computed
        default: null
        description: activation_ttv variant of calculations.time_to_value_days; null until both KICKOFF and FIRST_VALUE are COMPLETED.
      - name: renewal_likelihood
        type: enum
        source: computed
        default: AT_RISK
        description: Likelihood category output of calculations.renewal_likelihood.
        constraints: "COMMIT | UPSIDE | AT_RISK | OMIT"
      - name: churn_root_cause_code
        type: enum
        source: input
        default: null
        description: Root cause recorded on the CHURN lifecycle action; required for WIN_BACK_TARGET eligibility.
        constraints: "PRODUCT_GAP | PRICE | SPONSOR_CHURN | POOR_ONBOARDING | SUPPORT_QUALITY | MERGER_ACQUISITION"
      - name: win_back_offer_bp
        type: integer
        source: input
        default: null
        description: Win-back campaign discount offer in basis points, recorded on the WIN_BACK_TARGET lifecycle action.
        constraints: "0..5000"
      - name: remediation_credit_outstanding_cents
        type: integer
        source: computed
        default: 0
        description: Conserved quantity for calculations.remediation_credit_conservation; equals the sum of RemediationCommitment.credit_cents in state ACCEPTED across all EscalationCase rows of this account.
        constraints: ">= 0"
      - name: remediation_credit_settled_cents
        type: integer
        source: computed
        default: 0
        description: Cumulative final_credit_cents settled by RESOLVED EscalationCase rows of this account.
        constraints: ">= 0"
      - name: reference_calls_cap
        type: integer
        source: computed
        description: "Per-enrollment reference-call ceiling derived from segment_band: ENTERPRISE 6, MIDMARKET 4, SMB 2."
        constraints: "6 | 4 | 2"

  - name: Csm
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Customer Success Manager display name.
      - name: coverage_specialty
        type: enum
        source: input
        description: The single coverage tier this CSM may be assigned accounts for.
        constraints: "HIGH_TOUCH | LOW_TOUCH | DIGITAL"
      - name: capacity_units_total
        type: integer
        source: input
        description: Total weighted load units this CSM can hold.
        constraints: "1..200"
      - name: capacity_units_committed
        type: integer
        source: computed
        default: 0
        description: Conserved quantity for calculations.coverage_capacity_conservation; equals the sum of CoverageAssignment.load_units where csm_id equals this Csm.id and state equals COMMITTED.
        constraints: ">= 0"
      - name: capacity_units_available
        type: integer
        source: computed
        description: capacity_units_total minus capacity_units_committed; the ranking key of calculations.csm_selection.
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: Availability status; only ACTIVE CSMs enter the calculations.csm_selection candidate set.
        constraints: "ACTIVE | ON_LEAVE | OFFBOARDED"

  - name: CoverageAssignment
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the covered account."
      - name: csm_id
        type: string
        source: system
        description: "FK -> Csm.id; taken from the request when csm_id is supplied, otherwise chosen by calculations.csm_selection."
      - name: coverage_tier
        type: enum
        source: system
        description: Immutable snapshot of Account.coverage_tier at creation time; the assignment is priced against this value even if the account is later re-segmented.
        constraints: "HIGH_TOUCH | LOW_TOUCH | DIGITAL"
      - name: load_units
        type: integer
        source: computed
        description: Weighted capacity cost; output of calculations.coverage_load_units, frozen at creation.
        constraints: "1..20"
      - name: state
        type: enum
        source: system
        default: QUEUED
        description: Assignment state machine value.
        constraints: "QUEUED | COMMITTED | RELEASED | PREEMPTED"
      - name: committed_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant the assignment entered COMMITTED.
      - name: released_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant the assignment entered RELEASED or PREEMPTED.
      - name: release_reason
        type: string
        source: input
        default: null
        description: Free-text reason recorded on POST /coverage-assignments/{id}/release.
      - name: superseded_by_assignment_id
        type: string
        source: system
        default: null
        description: "FK -> CoverageAssignment.id; set on the PREEMPTED row to point at the newer assignment for the same account that superseded it."

  - name: AccountSignal
    parent: Account
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; owning account (taken from the path)."
      - name: signal_kind
        type: enum
        source: input
        description: Polymorphic discriminator selecting which field subset is populated and which calculation consumes the row.
        constraints: "USAGE_PERIOD | SUPPORT_TICKET"
      - name: period_end_date
        type: string
        source: input
        default: null
        description: "Usage period close date (YYYY-MM-DD); required when signal_kind is USAGE_PERIOD, must be null otherwise."
      - name: weekly_active_users
        type: integer
        source: input
        default: null
        description: Weekly active users in the period; required when signal_kind is USAGE_PERIOD.
        constraints: ">= 0"
      - name: licensed_seats
        type: integer
        source: input
        default: null
        description: Licensed seats in the period; required when signal_kind is USAGE_PERIOD.
        constraints: ">= 0"
      - name: feature_depth_pct
        type: number
        source: input
        default: null
        description: Percentage of licensed feature surface exercised in the period; required when signal_kind is USAGE_PERIOD.
        constraints: "0.00..100.00"
      - name: seat_utilisation_pct
        type: number
        source: computed
        default: null
        description: Per-row seat utilisation computed by calculations.adoption_index; null for SUPPORT_TICKET rows.
      - name: usage_row_index
        type: number
        source: computed
        default: null
        description: Per-row blended usage index computed and rounded by calculations.adoption_index; null for SUPPORT_TICKET rows.
      - name: ticket_severity
        type: enum
        source: input
        default: null
        description: Support ticket severity; required when signal_kind is SUPPORT_TICKET.
        constraints: "S1 | S2 | S3 | S4"
      - name: opened_at
        type: datetime
        source: input
        default: null
        description: Ticket open instant; required when signal_kind is SUPPORT_TICKET and used for the trailing-90-day window.
      - name: resolved_at
        type: datetime
        source: input
        default: null
        description: Ticket resolution instant; null while the ticket is open.
      - name: breached_sla
        type: boolean
        source: input
        default: false
        description: Whether the ticket breached its response SLA; adds SLA_BREACH_POINTS in calculations.support_risk_penalty.
      - name: csat_score
        type: integer
        source: input
        default: null
        description: Post-resolution CSAT; scores of 1 or 2 add LOW_CSAT_POINTS in calculations.support_risk_penalty.
        constraints: "1..5"
      - name: penalty_points
        type: integer
        source: computed
        default: null
        description: Per-row uncapped penalty points computed by calculations.support_risk_penalty; null for USAGE_PERIOD rows.

  - name: SponsorContact
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; owning account (taken from the path)."
      - name: full_name
        type: string
        source: input
        description: Sponsor display name.
      - name: seniority
        type: enum
        source: input
        description: Seniority band; selects the per-engagement bonus in calculations.exec_engagement_score.
        constraints: "CXO | VP | DIRECTOR | MANAGER"
      - name: is_economic_buyer
        type: boolean
        source: input
        description: Whether this sponsor is the account's economic buyer.
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: Sponsor status; DEPARTED removes the sponsor from every eligibility set.
        constraints: "ACTIVE | DEPARTED"

  - name: ExecutiveEngagement
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; owning account (taken from the path)."
      - name: sponsor_contact_id
        type: string
        source: input
        description: "FK -> SponsorContact.id; the sponsor whose calendar the engagement occupies; must belong to the same account."
      - name: engagement_type
        type: enum
        source: input
        description: Engagement format.
        constraints: "QBR | EBR | EXEC_SYNC"
      - name: start_at
        type: datetime
        source: input
        description: Half-open interval start (inclusive) on the sponsor's calendar.
      - name: end_at
        type: datetime
        source: input
        description: Half-open interval end (exclusive) on the sponsor's calendar.
      - name: state
        type: enum
        source: system
        default: SCHEDULED
        description: Engagement state machine value.
        constraints: "SCHEDULED | HELD | NO_SHOW | CANCELLED"
      - name: outcome_recorded_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant the outcome was recorded.

  - name: OutcomeGoal
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; owning account (taken from the path)."
      - name: title
        type: string
        source: input
        description: Business outcome the customer committed to.
      - name: target_value
        type: number
        source: input
        description: Target metric value.
        constraints: "> 0"
      - name: actual_value
        type: number
        source: input
        default: 0
        description: Latest observed metric value, set by POST /outcome-goals/{id}/progress.
        constraints: ">= 0"
      - name: weight_bp
        type: integer
        source: input
        description: Weight in basis points; the sum of weight_bp over the account's non-WAIVED goals may not exceed 10000.
        constraints: "1..10000"
      - name: status
        type: enum
        source: system
        default: DEFINED
        description: Goal state machine value; only IN_PROGRESS, ATTAINED and MISSED enter calculations.outcome_attainment_index.
        constraints: "DEFINED | IN_PROGRESS | ATTAINED | MISSED | WAIVED"
      - name: attainment_pct
        type: number
        source: computed
        default: 0.00
        description: Per-goal attainment rounded to 2 decimals by calculations.outcome_attainment_index before aggregation.
        constraints: "0.00..100.00"

  - name: OnboardingMilestone
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; owning account (taken from the path)."
      - name: milestone_code
        type: enum
        source: input
        description: Milestone identity; unique per account.
        constraints: "KICKOFF | DATA_INTEGRATION | FIRST_VALUE | GO_LIVE"
      - name: sequence_index
        type: integer
        source: input
        description: Ordering index; a milestone may only be COMPLETED when every milestone of the same account with a strictly lower sequence_index is in state COMPLETED or WAIVED.
        constraints: "1..4"
      - name: due_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the milestone is due."
      - name: completed_date
        type: string
        source: input
        default: null
        description: "Calendar date (YYYY-MM-DD) supplied on the COMPLETE action."
      - name: state
        type: enum
        source: system
        default: PENDING
        description: Milestone state machine value.
        constraints: "PENDING | OVERDUE | BLOCKED | COMPLETED | WAIVED"
      - name: days_late
        type: integer
        source: computed
        default: null
        description: "completed_date minus due_date in whole days, floored at 0; computed on the COMPLETE action."

  - name: SavePlay
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the at-risk account."
      - name: owner_csm_id
        type: string
        source: input
        description: "FK -> Csm.id; the CSM accountable for running the play; must be in status ACTIVE."
      - name: risk_code
        type: enum
        source: input
        description: Identified risk driver.
        constraints: "ADOPTION_DECLINE | SUPPORT_ESCALATION | SPONSOR_LOSS | OUTCOME_MISS | BUDGET_PRESSURE"
      - name: play_type
        type: enum
        source: input
        description: Intervention pattern.
        constraints: "EXEC_ALIGNMENT | ENABLEMENT_SPRINT | COMMERCIAL_CONCESSION | TECHNICAL_REMEDIATION"
      - name: window_start_date
        type: string
        source: input
        description: "Closed-interval first calendar day (YYYY-MM-DD) the play occupies on the account."
      - name: window_end_date
        type: string
        source: input
        description: "Closed-interval last calendar day (YYYY-MM-DD, inclusive) the play occupies on the account."
      - name: state
        type: enum
        source: system
        default: DRAFT
        description: Save play state machine value.
        constraints: "DRAFT | ACTIVE | SUCCEEDED | FAILED | ABANDONED"
      - name: outcome_note
        type: string
        source: input
        default: null
        description: Free-text note recorded on SUCCEED, FAIL or ABANDON.

  - name: EscalationCase
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the escalated account."
      - name: save_play_id
        type: string
        source: input
        description: "FK -> SavePlay.id; the play being escalated; must reference a SavePlay whose account_id equals this case's account_id."
      - name: severity
        type: enum
        source: input
        description: Escalation severity; selects ESCALATION_BASE_CREDIT_BP in calculations.escalation_settlement_credit.
        constraints: "CRITICAL | HIGH | MEDIUM"
      - name: summary
        type: string
        source: input
        description: Executive-facing summary.
      - name: state
        type: enum
        source: system
        default: OPEN
        description: Escalation state machine value; COMMITTED and DISPUTED form a negotiation cycle.
        constraints: "OPEN | COMMITTED | DISPUTED | RESOLVED | WITHDRAWN"
      - name: remediation_round
        type: integer
        source: system
        default: 1
        description: Negotiation round counter; incremented every time the case re-enters DISPUTED.
        constraints: ">= 1"
      - name: final_credit_cents
        type: integer
        source: computed
        default: null
        description: Settlement credit computed by calculations.escalation_settlement_credit on RESOLVE.

  - name: RemediationCommitment
    parent: EscalationCase
    common_fields: true
    fields:
      - name: escalation_case_id
        type: string
        source: input
        description: "FK -> EscalationCase.id; owning case (taken from the path)."
      - name: description
        type: string
        source: input
        description: What the vendor commits to deliver.
      - name: due_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the commitment must be DELIVERED by; POST /_ops/daily-sweep breaches ACCEPTED commitments past this date."
      - name: credit_cents
        type: integer
        source: input
        description: Goodwill credit attached to the commitment; may not exceed COMMITMENT_CREDIT_CAP_BP of the account's arr_cents.
        constraints: ">= 0"
      - name: state
        type: enum
        source: system
        default: PROPOSED
        description: Commitment state machine value.
        constraints: "PROPOSED | ACCEPTED | REJECTED | DELIVERED | BREACHED | WITHDRAWN"
      - name: round_index
        type: integer
        source: system
        description: The owning case's remediation_round at creation time.
        constraints: ">= 1"
      - name: accepted_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the CsExecutive who performed ACCEPT; compared against the DELIVER actor for segregation of duties.
      - name: delivered_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the actor who performed DELIVER.

  - name: RenewalForecast
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; forecast subject."
      - name: fiscal_period
        type: string
        source: input
        description: Fiscal period label; unique per account across rows whose cs_state is DRAFT, SUBMITTED or LOCKED.
        constraints: "matches ^20[0-9]{2}Q[1-4]$"
      - name: cs_amount_cents
        type: integer
        source: input
        default: null
        description: Customer-success bottom-up renewal amount; when omitted at creation it is filled by the cs_bottom_up variant of calculations.renewal_forecast_amounts.
        constraints: ">= 0"
      - name: finance_amount_cents
        type: integer
        source: input
        default: null
        description: Finance top-down renewal amount; when omitted on RECONCILE it is filled by the finance_top_down variant of calculations.renewal_forecast_amounts.
        constraints: ">= 0"
      - name: variance_cents
        type: integer
        source: computed
        default: null
        description: finance_amount_cents minus cs_amount_cents, computed on RECONCILE.
      - name: likelihood_category
        type: enum
        source: computed
        description: Snapshot of Account.renewal_likelihood taken at creation; drives the cs_bottom_up weight.
        constraints: "COMMIT | UPSIDE | AT_RISK | OMIT"
      - name: cs_state
        type: enum
        source: system
        default: DRAFT
        description: Customer-success axis of the parallel state machine.
        constraints: "DRAFT | SUBMITTED | LOCKED"
      - name: finance_state
        type: enum
        source: system
        default: PENDING
        description: Finance axis of the parallel state machine, evolving independently of cs_state.
        constraints: "PENDING | RECONCILED | VARIANCE_FLAGGED"
      - name: submitted_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant cs_state last entered SUBMITTED.
      - name: reconciled_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant finance_state last left PENDING.

  - name: ExpansionOpportunity
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the account the expansion sits on."
      - name: recycled_from_opportunity_id
        type: string
        source: system
        default: null
        description: "FK -> ExpansionOpportunity.id; set on the successor row created by the RECYCLE action."
      - name: estimated_value_cents
        type: integer
        source: input
        description: Estimated incremental ARR in cents.
        constraints: "> 0"
      - name: source_signal
        type: enum
        source: input
        description: Which signal surfaced the opportunity.
        constraints: "SEAT_SATURATION | FEATURE_DEPTH | EXEC_REQUEST | OUTCOME_OVERACHIEVEMENT"
      - name: qualification_score
        type: number
        source: computed
        description: Output of calculations.expansion_qualification_score, frozen at creation.
        constraints: "0.00..100.00"
      - name: state
        type: enum
        source: system
        default: IDENTIFIED
        description: Opportunity state machine value.
        constraints: "IDENTIFIED | HANDED_OFF | ACCEPTED | REJECTED | RECYCLED | EXPIRED"
      - name: handoff_ae_user_id
        type: string
        source: input
        default: null
        description: Opaque X-User-ID of the SalesAccountExecutive the opportunity was handed to.
      - name: rejection_reason
        type: string
        source: input
        default: null
        description: Reason recorded on the REJECT action.
      - name: identified_at
        type: datetime
        source: system
        description: Logical-clock instant of creation; POST /_ops/daily-sweep expires IDENTIFIED rows older than OPPORTUNITY_STALE_DAYS.

  - name: AdvocacyEnrollment
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; owning account (taken from the path)."
      - name: program_type
        type: enum
        source: input
        description: Advocacy program; unique per account across rows whose state is not REVOKED.
        constraints: "CAB | REFERENCE"
      - name: state
        type: enum
        source: system
        default: NOMINATED
        description: Enrollment state machine value; ACTIVE and SUSPENDED form a cycle driven by health_tier.
        constraints: "NOMINATED | APPROVED | ACTIVE | SUSPENDED | GRADUATED | REVOKED"
      - name: reference_calls_used
        type: integer
        source: computed
        default: 0
        description: Count of LOG_REFERENCE_CALL actions accepted on this enrollment.
        constraints: ">= 0"
      - name: reference_calls_cap
        type: integer
        source: computed
        description: Snapshot of Account.reference_calls_cap at creation; LOG_REFERENCE_CALL is rejected once reference_calls_used equals this value.
      - name: last_reference_call_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the most recent accepted reference call.

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Account
    initial_state: ONBOARDING
    terminal_states: [ARCHIVED]
    note: |
      Cyclic lifecycle. CHURNED -> WIN_BACK_TARGETED -> ADOPTING closes the
      win-back loop; RENEWED -> STEADY closes the renewal loop; STEADY <-> AT_RISK
      oscillates with health_tier. Every transition ends by re-running
      calculations.coverage_posture_derivation.
    transitions:
      - from: ONBOARDING
        to: ADOPTING
        trigger: "system, evaluated at the end of POST /onboarding-milestones/{id}/transition"
        actor: system
        preconditions:
          - "every OnboardingMilestone of the account is in state COMPLETED or WAIVED"
          - "the account has at least one OnboardingMilestone"
        side_effects:
          - "recompute Account.contractual_ttv_days and Account.activation_ttv_days per calculations.time_to_value_days"
          - "set Account.ttv_breach_flag = false"
          - "recompute Account.coverage_posture per calculations.coverage_posture_derivation"
          - "increment Account.version by 1 and refresh Account.updated_at"
      - from: ADOPTING
        to: STEADY
        trigger: "system, evaluated at the end of POST /accounts/{id}/health-recompute"
        actor: system
        preconditions:
          - "Account.health_tier == GREEN"
          - "Account.open_save_play_count == 0"
        side_effects:
          - "recompute Account.renewal_likelihood per calculations.renewal_likelihood"
          - "recompute Account.coverage_posture per calculations.coverage_posture_derivation"
      - from: ADOPTING
        to: AT_RISK
        trigger: "system, evaluated at the end of POST /accounts/{id}/health-recompute"
        actor: system
        preconditions:
          - "Account.health_tier == RED"
        side_effects:
          - "recompute Account.renewal_likelihood per calculations.renewal_likelihood"
          - "set every AdvocacyEnrollment of the account whose state == ACTIVE to SUSPENDED"
          - "recompute Account.coverage_posture per calculations.coverage_posture_derivation"
      - from: STEADY
        to: AT_RISK
        trigger: "system, evaluated at the end of POST /accounts/{id}/health-recompute"
        actor: system
        preconditions:
          - "Account.health_tier == RED"
        side_effects:
          - "recompute Account.renewal_likelihood per calculations.renewal_likelihood"
          - "set every AdvocacyEnrollment of the account whose state == ACTIVE to SUSPENDED"
          - "recompute Account.coverage_posture per calculations.coverage_posture_derivation"
      - from: AT_RISK
        to: STEADY
        trigger: "system, evaluated at the end of POST /accounts/{id}/health-recompute"
        actor: system
        preconditions:
          - "Account.health_tier == GREEN"
          - "Account.open_save_play_count == 0"
          - "no EscalationCase of the account is in state OPEN, COMMITTED or DISPUTED"
        side_effects:
          - "recompute Account.renewal_likelihood per calculations.renewal_likelihood"
          - "recompute Account.coverage_posture per calculations.coverage_posture_derivation"
      - from: STEADY
        to: RENEWED
        trigger: "POST /accounts/{id}/lifecycle {action: RENEW}"
        actor: CsOpsAdmin
        preconditions:
          - "at least one RenewalForecast of the account has cs_state == LOCKED"
          - "Account.coverage_posture != FROZEN"
        side_effects:
          - "set every ExpansionOpportunity of the account whose state == IDENTIFIED and whose identified_at is older than the clock by more than OPPORTUNITY_STALE_DAYS to EXPIRED"
          - "recompute Account.coverage_posture per calculations.coverage_posture_derivation"
      - from: AT_RISK
        to: RENEWED
        trigger: "POST /accounts/{id}/lifecycle {action: RENEW}"
        actor: CsOpsAdmin
        preconditions:
          - "at least one RenewalForecast of the account has cs_state == LOCKED"
          - "Account.coverage_posture != FROZEN"
        side_effects:
          - "recompute Account.coverage_posture per calculations.coverage_posture_derivation"
      - from: RENEWED
        to: STEADY
        trigger: "PATCH /accounts/{id} with contract_end_date strictly after the current contract_end_date"
        actor: CsOpsAdmin
        preconditions:
          - "new contract_end_date > Account.contract_end_date"
        side_effects:
          - "recompute Account.renewal_likelihood per calculations.renewal_likelihood"
          - "recompute Account.coverage_posture per calculations.coverage_posture_derivation"
        note: "Closes the renewal cycle STEADY -> RENEWED -> STEADY."
      - from: ONBOARDING
        to: CHURNED
        trigger: "POST /accounts/{id}/lifecycle {action: CHURN}"
        actor: CsOpsAdmin
        preconditions:
          - "churn_root_cause_code is supplied"
        side_effects:
          - "set Account.churn_root_cause_code from the request"
          - "set every CoverageAssignment of the account whose state == COMMITTED to RELEASED (which decrements Csm.capacity_units_committed and may promote a QUEUED assignment)"
          - "set every CoverageAssignment of the account whose state == QUEUED to PREEMPTED"
          - "set every OnboardingMilestone of the account whose state is PENDING, OVERDUE or BLOCKED to WAIVED"
          - "recompute Account.coverage_posture per calculations.coverage_posture_derivation (yields FROZEN)"
      - from: ADOPTING
        to: CHURNED
        trigger: "POST /accounts/{id}/lifecycle {action: CHURN}"
        actor: CsOpsAdmin
        preconditions:
          - "churn_root_cause_code is supplied"
        side_effects:
          - "set Account.churn_root_cause_code from the request"
          - "set every CoverageAssignment of the account whose state == COMMITTED to RELEASED"
          - "recompute Account.renewal_likelihood per calculations.renewal_likelihood (yields OMIT)"
          - "recompute Account.coverage_posture per calculations.coverage_posture_derivation (yields FROZEN)"
      - from: STEADY
        to: CHURNED
        trigger: "POST /accounts/{id}/lifecycle {action: CHURN}"
        actor: CsOpsAdmin
        preconditions:
          - "churn_root_cause_code is supplied"
        side_effects:
          - "set Account.churn_root_cause_code from the request"
          - "set every CoverageAssignment of the account whose state == COMMITTED to RELEASED"
          - "recompute Account.renewal_likelihood per calculations.renewal_likelihood (yields OMIT)"
          - "recompute Account.coverage_posture per calculations.coverage_posture_derivation (yields FROZEN)"
      - from: AT_RISK
        to: CHURNED
        trigger: "POST /accounts/{id}/lifecycle {action: CHURN}"
        actor: CsOpsAdmin
        preconditions:
          - "churn_root_cause_code is supplied"
        side_effects:
          - "set Account.churn_root_cause_code from the request"
          - "set every CoverageAssignment of the account whose state == COMMITTED to RELEASED"
          - "set every SavePlay of the account whose state == ACTIVE to ABANDONED and decrement Account.open_save_play_count accordingly"
          - "set every AdvocacyEnrollment of the account whose state is NOMINATED, APPROVED, ACTIVE or SUSPENDED to REVOKED"
          - "recompute Account.renewal_likelihood per calculations.renewal_likelihood (yields OMIT)"
          - "recompute Account.coverage_posture per calculations.coverage_posture_derivation (yields FROZEN)"
      - from: CHURNED
        to: WIN_BACK_TARGETED
        trigger: "POST /accounts/{id}/lifecycle {action: WIN_BACK_TARGET}"
        actor: CsOpsAdmin
        preconditions:
          - "Account.churn_root_cause_code IN {PRODUCT_GAP, PRICE, SPONSOR_CHURN, POOR_ONBOARDING, SUPPORT_QUALITY}"
          - "win_back_offer_bp is supplied"
        side_effects:
          - "set Account.win_back_offer_bp from the request"
          - "set Account.coverage_tier = DIGITAL per calculations.coverage_tier_assignment"
          - "recompute Account.coverage_posture per calculations.coverage_posture_derivation (stays FROZEN)"
        note: "MERGER_ACQUISITION is the one root cause that bars a win-back campaign."
      - from: WIN_BACK_TARGETED
        to: ADOPTING
        trigger: "POST /accounts/{id}/lifecycle {action: REACTIVATE}"
        actor: CsOpsAdmin
        preconditions:
          - "new_contract_end_date is supplied and is strictly after the logical clock date"
        side_effects:
          - "set Account.contract_end_date = new_contract_end_date and Account.contract_start_date = the logical clock date"
          - "clear Account.churn_root_cause_code and Account.win_back_offer_bp to null"
          - "recompute Account.renewal_likelihood per calculations.renewal_likelihood"
          - "recompute Account.coverage_posture per calculations.coverage_posture_derivation"
        note: "Closes the win-back cycle CHURNED -> WIN_BACK_TARGETED -> ADOPTING."
      - from: WIN_BACK_TARGETED
        to: ARCHIVED
        trigger: "POST /accounts/{id}/lifecycle {action: ARCHIVE}"
        actor: CsOpsAdmin
        preconditions:
          - "no ExpansionOpportunity of the account is in state IDENTIFIED or HANDED_OFF"
        side_effects:
          - "set every AdvocacyEnrollment of the account whose state is NOMINATED, APPROVED, ACTIVE or SUSPENDED to REVOKED"
          - "recompute Account.coverage_posture per calculations.coverage_posture_derivation (stays FROZEN)"
      - from: ONBOARDING
        to: ONBOARDING
        trigger: "POST /accounts/{id}/lifecycle {action: WAIVE_TTV_BREACH}"
        actor: CsOpsAdmin
        preconditions:
          - "Account.ttv_breach_flag == true"
        side_effects:
          - "set Account.ttv_breach_flag = false"
          - "recompute Account.coverage_posture per calculations.coverage_posture_derivation (leaves FROZEN)"
          - "because coverage_posture left FROZEN, set every OnboardingMilestone of the account whose state == BLOCKED to PENDING"

  - entity: CoverageAssignment
    initial_state: QUEUED
    terminal_states: [RELEASED, PREEMPTED]
    note: |
      Branching fork at creation: the same POST lands in QUEUED and then either
      auto-promotes to COMMITTED (capacity fits) or stays QUEUED, with divergent
      side-effect sets. PREEMPTED is the supersede branch.
    transitions:
      - from: QUEUED
        to: COMMITTED
        trigger: "system, evaluated at the end of POST /coverage-assignments and at the end of POST /coverage-assignments/{id}/release for the released assignment's Csm"
        actor: system
        preconditions:
          - "Csm.status == ACTIVE"
          - "Csm.capacity_units_total - Csm.capacity_units_committed >= CoverageAssignment.load_units"
        side_effects:
          - "increment Csm.capacity_units_committed by CoverageAssignment.load_units and recompute Csm.capacity_units_available"
          - "set CoverageAssignment.committed_at = logical clock"
          - "set Account.assigned_csm_id = CoverageAssignment.csm_id"
          - "recompute Account.coverage_posture per calculations.coverage_posture_derivation"
      - from: QUEUED
        to: PREEMPTED
        trigger: "system, evaluated at the end of POST /coverage-assignments when a newer assignment is created for the same account"
        actor: system
        preconditions:
          - "a newer CoverageAssignment row exists for the same account_id"
        side_effects:
          - "set CoverageAssignment.superseded_by_assignment_id = the newer assignment id"
          - "set CoverageAssignment.released_at = logical clock"
      - from: COMMITTED
        to: PREEMPTED
        trigger: "system, evaluated at the end of POST /coverage-assignments when a newer assignment is created for the same account"
        actor: system
        preconditions:
          - "a newer CoverageAssignment row exists for the same account_id"
        side_effects:
          - "decrement Csm.capacity_units_committed by CoverageAssignment.load_units and recompute Csm.capacity_units_available"
          - "set CoverageAssignment.superseded_by_assignment_id = the newer assignment id and released_at = logical clock"
          - "clear Account.assigned_csm_id to null"
      - from: COMMITTED
        to: RELEASED
        trigger: "POST /coverage-assignments/{id}/release"
        actor: CsOpsAdmin
        preconditions:
          - "CoverageAssignment.state == COMMITTED"
        side_effects:
          - "LINK 1: set CoverageAssignment.state = RELEASED, released_at = logical clock, release_reason from the request"
          - "LINK 2: because the assignment left COMMITTED, decrement Csm.capacity_units_committed by CoverageAssignment.load_units and recompute Csm.capacity_units_available"
          - "LINK 3: because Csm.capacity_units_available rose, promote the QUEUED CoverageAssignment of that same csm_id with the lowest created_at whose load_units <= the new capacity_units_available from QUEUED to COMMITTED (skip when no QUEUED row fits)"
          - "LINK 4: because that second assignment entered COMMITTED, set its Account.assigned_csm_id = csm_id and recompute that Account.coverage_posture per calculations.coverage_posture_derivation"
          - "clear the released assignment's own Account.assigned_csm_id to null and recompute that Account.coverage_posture (yields RESTRICTED when no COMMITTED assignment remains)"

  - entity: OnboardingMilestone
    initial_state: PENDING
    terminal_states: [COMPLETED, WAIVED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /onboarding-milestones/{id}/transition {action: COMPLETE}"
        actor: CsmUser
        preconditions:
          - "Account.coverage_posture != FROZEN"
          - "every OnboardingMilestone of the same account with a strictly lower sequence_index is in state COMPLETED or WAIVED"
          - "completed_date is supplied"
        side_effects:
          - "set OnboardingMilestone.completed_date and days_late = max(0, completed_date - due_date in whole days)"
          - "recompute Account.contractual_ttv_days and Account.activation_ttv_days per calculations.time_to_value_days"
          - "evaluate the Account ONBOARDING -> ADOPTING transition"
      - from: OVERDUE
        to: COMPLETED
        trigger: "POST /onboarding-milestones/{id}/transition {action: COMPLETE}"
        actor: CsmUser
        preconditions:
          - "Account.coverage_posture != FROZEN"
          - "every OnboardingMilestone of the same account with a strictly lower sequence_index is in state COMPLETED or WAIVED"
          - "completed_date is supplied"
        side_effects:
          - "set OnboardingMilestone.completed_date and days_late = max(0, completed_date - due_date in whole days)"
          - "recompute Account.contractual_ttv_days and Account.activation_ttv_days per calculations.time_to_value_days"
          - "evaluate the Account ONBOARDING -> ADOPTING transition"
      - from: PENDING
        to: OVERDUE
        trigger: "POST /_ops/daily-sweep"
        actor: system
        preconditions:
          - "OnboardingMilestone.due_date < the logical clock date"
        side_effects:
          - "no field other than state, updated_at and version changes on the milestone"
      - from: PENDING
        to: BLOCKED
        trigger: "system, whenever calculations.coverage_posture_derivation moves the owning Account.coverage_posture to FROZEN"
        actor: system
        preconditions:
          - "Account.coverage_posture == FROZEN"
          - "Account.lifecycle_state == ONBOARDING"
        side_effects:
          - "no field other than state, updated_at and version changes on the milestone"
      - from: OVERDUE
        to: BLOCKED
        trigger: "system, whenever calculations.coverage_posture_derivation moves the owning Account.coverage_posture to FROZEN"
        actor: system
        preconditions:
          - "Account.coverage_posture == FROZEN"
          - "Account.lifecycle_state == ONBOARDING"
        side_effects:
          - "no field other than state, updated_at and version changes on the milestone"
      - from: BLOCKED
        to: PENDING
        trigger: "system, whenever calculations.coverage_posture_derivation moves the owning Account.coverage_posture out of FROZEN"
        actor: system
        preconditions:
          - "Account.coverage_posture != FROZEN"
        side_effects:
          - "no field other than state, updated_at and version changes on the milestone"
      - from: PENDING
        to: WAIVED
        trigger: "POST /onboarding-milestones/{id}/transition {action: WAIVE}"
        actor: CsOpsAdmin
        preconditions: []
        side_effects:
          - "evaluate the Account ONBOARDING -> ADOPTING transition"
      - from: OVERDUE
        to: WAIVED
        trigger: "POST /onboarding-milestones/{id}/transition {action: WAIVE}"
        actor: CsOpsAdmin
        preconditions: []
        side_effects:
          - "evaluate the Account ONBOARDING -> ADOPTING transition"
      - from: BLOCKED
        to: WAIVED
        trigger: "POST /onboarding-milestones/{id}/transition {action: WAIVE}"
        actor: CsOpsAdmin
        preconditions: []
        side_effects:
          - "evaluate the Account ONBOARDING -> ADOPTING transition"

  - entity: SavePlay
    initial_state: DRAFT
    terminal_states: [SUCCEEDED, FAILED, ABANDONED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /save-plays/{id}/transition {action: ACTIVATE}"
        actor: CsmUser
        preconditions:
          - "Account.health_tier IN {RED, AMBER}"
          - "Csm.status == ACTIVE for SavePlay.owner_csm_id"
          - "no calendar day in [window_start_date, window_end_date] is already covered by MAX_CONCURRENT_SAVE_PLAYS SavePlay rows of the same account in state ACTIVE"
        side_effects:
          - "increment Account.open_save_play_count by 1"
          - "recompute Account.coverage_posture per calculations.coverage_posture_derivation (yields RESTRICTED)"
      - from: ACTIVE
        to: SUCCEEDED
        trigger: "POST /save-plays/{id}/transition {action: SUCCEED}"
        actor: CsmUser
        preconditions:
          - "no EscalationCase referencing this SavePlay is in state OPEN, COMMITTED or DISPUTED"
        side_effects:
          - "decrement Account.open_save_play_count by 1"
          - "recompute Account.renewal_likelihood per calculations.renewal_likelihood"
          - "recompute Account.coverage_posture per calculations.coverage_posture_derivation"
      - from: ACTIVE
        to: FAILED
        trigger: "POST /save-plays/{id}/transition {action: FAIL}, or system as LINK 3 of the EscalationCase COMMITTED -> DISPUTED cascade"
        actor: CsmUser | system
        preconditions:
          - "SavePlay.state == ACTIVE"
        side_effects:
          - "decrement Account.open_save_play_count by 1"
          - "subtract SAVE_FAILURE_PENALTY from Account.snapshot_health_score and Account.trended_health_score, clamped at 0.00, and re-derive Account.health_tier"
          - "recompute Account.renewal_likelihood per calculations.renewal_likelihood"
          - "recompute Account.coverage_posture per calculations.coverage_posture_derivation"
      - from: DRAFT
        to: ABANDONED
        trigger: "POST /save-plays/{id}/transition {action: ABANDON}"
        actor: CsmUser
        preconditions: []
        side_effects:
          - "no capacity or posture change (a DRAFT play was never counted in open_save_play_count)"
      - from: ACTIVE
        to: ABANDONED
        trigger: "POST /save-plays/{id}/transition {action: ABANDON}, or system as a side effect of the Account AT_RISK -> CHURNED transition"
        actor: CsmUser | system
        preconditions:
          - "no EscalationCase referencing this SavePlay is in state OPEN, COMMITTED or DISPUTED"
        side_effects:
          - "decrement Account.open_save_play_count by 1"
          - "recompute Account.coverage_posture per calculations.coverage_posture_derivation"

  - entity: EscalationCase
    initial_state: OPEN
    terminal_states: [RESOLVED, WITHDRAWN]
    note: "COMMITTED -> DISPUTED -> COMMITTED is a true negotiation cycle; each traversal increments remediation_round."
    transitions:
      - from: OPEN
        to: COMMITTED
        trigger: "POST /escalation-cases/{id}/transition {action: COMMIT}"
        actor: CsExecutive
        preconditions:
          - "the account has a SponsorContact with is_economic_buyer == true and status == ACTIVE"
          - "at least one RemediationCommitment of this case has state == ACCEPTED and round_index == EscalationCase.remediation_round"
        side_effects:
          - "recompute Account.coverage_posture per calculations.coverage_posture_derivation"
      - from: DISPUTED
        to: COMMITTED
        trigger: "POST /escalation-cases/{id}/transition {action: COMMIT}"
        actor: CsExecutive
        preconditions:
          - "the account has a SponsorContact with is_economic_buyer == true and status == ACTIVE"
          - "at least one RemediationCommitment of this case has state == ACCEPTED and round_index == EscalationCase.remediation_round"
        side_effects:
          - "recompute Account.coverage_posture per calculations.coverage_posture_derivation"
        note: "Closes the negotiation cycle; the ACCEPTED commitment must belong to the current round, so a stale round-1 commitment cannot re-commit round 2."
      - from: COMMITTED
        to: DISPUTED
        trigger: "system, as LINK 2 of the RemediationCommitment ACCEPTED -> BREACHED cascade fired by POST /_ops/daily-sweep"
        actor: system
        preconditions:
          - "a RemediationCommitment of this case just entered BREACHED"
        side_effects:
          - "LINK 2: increment EscalationCase.remediation_round by 1"
          - "LINK 3: because the case entered DISPUTED, set the referenced SavePlay from state ACTIVE to FAILED"
          - "LINK 4: because the SavePlay entered FAILED, decrement Account.open_save_play_count by 1, subtract SAVE_FAILURE_PENALTY from Account.snapshot_health_score and Account.trended_health_score (clamped at 0.00), re-derive Account.health_tier and recompute Account.coverage_posture"
      - from: COMMITTED
        to: RESOLVED
        trigger: "POST /escalation-cases/{id}/transition {action: RESOLVE}"
        actor: CsExecutive
        preconditions:
          - "every RemediationCommitment of this case is in state DELIVERED, REJECTED or WITHDRAWN"
          - "at least one RemediationCommitment of this case is in state DELIVERED"
        side_effects:
          - "compute EscalationCase.final_credit_cents per calculations.escalation_settlement_credit"
          - "increment Account.remediation_credit_settled_cents by EscalationCase.final_credit_cents"
          - "decrement Account.remediation_credit_outstanding_cents by the sum of credit_cents over this case's DELIVERED commitments, preserving calculations.remediation_credit_conservation"
          - "recompute Account.coverage_posture per calculations.coverage_posture_derivation"
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /escalation-cases/{id}/transition {action: WITHDRAW}"
        actor: CsExecutive
        preconditions: []
        side_effects:
          - "set every RemediationCommitment of this case whose state is PROPOSED or ACCEPTED to WITHDRAWN"
          - "decrement Account.remediation_credit_outstanding_cents by the sum of credit_cents over the commitments that left ACCEPTED, preserving calculations.remediation_credit_conservation"
          - "recompute Account.coverage_posture per calculations.coverage_posture_derivation"
      - from: COMMITTED
        to: WITHDRAWN
        trigger: "POST /escalation-cases/{id}/transition {action: WITHDRAW}"
        actor: CsExecutive
        preconditions: []
        side_effects:
          - "set every RemediationCommitment of this case whose state is PROPOSED or ACCEPTED to WITHDRAWN"
          - "decrement Account.remediation_credit_outstanding_cents by the sum of credit_cents over the commitments that left ACCEPTED, preserving calculations.remediation_credit_conservation"
          - "recompute Account.coverage_posture per calculations.coverage_posture_derivation"
      - from: DISPUTED
        to: WITHDRAWN
        trigger: "POST /escalation-cases/{id}/transition {action: WITHDRAW}"
        actor: CsExecutive
        preconditions: []
        side_effects:
          - "set every RemediationCommitment of this case whose state is PROPOSED or ACCEPTED to WITHDRAWN"
          - "decrement Account.remediation_credit_outstanding_cents by the sum of credit_cents over the commitments that left ACCEPTED, preserving calculations.remediation_credit_conservation"
          - "recompute Account.coverage_posture per calculations.coverage_posture_derivation"

  - entity: RemediationCommitment
    initial_state: PROPOSED
    terminal_states: [REJECTED, DELIVERED, BREACHED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /remediation-commitments/{id}/transition {action: ACCEPT}"
        actor: CsExecutive
        preconditions:
          - "EscalationCase.state IN {OPEN, DISPUTED}"
          - "RemediationCommitment.round_index == EscalationCase.remediation_round"
        side_effects:
          - "set RemediationCommitment.accepted_by_user_id = the acting X-User-ID"
          - "increment Account.remediation_credit_outstanding_cents by RemediationCommitment.credit_cents, preserving calculations.remediation_credit_conservation"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /remediation-commitments/{id}/transition {action: REJECT}"
        actor: CsExecutive
        preconditions:
          - "EscalationCase.state IN {OPEN, DISPUTED}"
        side_effects:
          - "no change to Account.remediation_credit_outstanding_cents (a PROPOSED commitment was never counted)"
      - from: ACCEPTED
        to: DELIVERED
        trigger: "POST /remediation-commitments/{id}/transition {action: DELIVER}"
        actor: CsmUser
        preconditions:
          - "EscalationCase.state == COMMITTED"
          - "the acting X-User-ID differs from RemediationCommitment.accepted_by_user_id (segregation of duties)"
        side_effects:
          - "set RemediationCommitment.delivered_by_user_id = the acting X-User-ID"
          - "Account.remediation_credit_outstanding_cents is unchanged (DELIVERED credit stays outstanding until the case RESOLVEs)"
      - from: ACCEPTED
        to: BREACHED
        trigger: "POST /_ops/daily-sweep"
        actor: system
        preconditions:
          - "RemediationCommitment.due_date < the logical clock date"
          - "EscalationCase.state == COMMITTED"
        side_effects:
          - "LINK 1: set RemediationCommitment.state = BREACHED"
          - "LINK 2: because the commitment breached, drive the owning EscalationCase COMMITTED -> DISPUTED and increment its remediation_round by 1"
          - "decrement Account.remediation_credit_outstanding_cents by RemediationCommitment.credit_cents, preserving calculations.remediation_credit_conservation"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "system, as a side effect of any EscalationCase transition into WITHDRAWN"
        actor: system
        preconditions:
          - "the owning EscalationCase just entered WITHDRAWN"
        side_effects: []
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "system, as a side effect of any EscalationCase transition into WITHDRAWN"
        actor: system
        preconditions:
          - "the owning EscalationCase just entered WITHDRAWN"
        side_effects:
          - "decrement Account.remediation_credit_outstanding_cents by RemediationCommitment.credit_cents, preserving calculations.remediation_credit_conservation"

  - entity: RenewalForecast
    initial_state: "cs_state=DRAFT, finance_state=PENDING"
    terminal_states: ["cs_state=LOCKED, finance_state=RECONCILED"]
    note: |
      PARALLEL state dimensions on one row. cs_state and finance_state advance
      independently and are owned by different roles; the only coupling is the
      pair of preconditions listed on each transition.
    transitions:
      - from: "cs_state=DRAFT"
        to: "cs_state=SUBMITTED"
        trigger: "POST /renewal-forecasts/{id}/submit"
        actor: CsmUser
        preconditions:
          - "at least one CoverageAssignment of the account is in state COMMITTED"
          - "RenewalForecast.cs_amount_cents is not null"
        side_effects:
          - "set RenewalForecast.submitted_at = logical clock"
          - "finance_state is untouched"
      - from: "cs_state=SUBMITTED"
        to: "cs_state=DRAFT"
        trigger: "POST /renewal-forecasts/{id}/submit with the forecast already in finance_state VARIANCE_FLAGGED"
        actor: CsmUser
        preconditions:
          - "RenewalForecast.finance_state == VARIANCE_FLAGGED"
        side_effects:
          - "recompute RenewalForecast.cs_amount_cents with the cs_bottom_up variant of calculations.renewal_forecast_amounts using the account's current renewal_likelihood"
          - "set RenewalForecast.finance_state = PENDING and variance_cents = null"
        note: "Revision loop; the cs axis returns to DRAFT and the finance axis is reset to PENDING."
      - from: "cs_state=SUBMITTED"
        to: "cs_state=LOCKED"
        trigger: "POST /renewal-forecasts/{id}/reconcile {action: LOCK}"
        actor: FinanceAnalyst
        preconditions:
          - "RenewalForecast.finance_state == RECONCILED"
        side_effects:
          - "the forecast becomes immutable; further submit and reconcile calls are rejected"
      - from: "finance_state=PENDING"
        to: "finance_state=RECONCILED"
        trigger: "POST /renewal-forecasts/{id}/reconcile {action: RECONCILE}"
        actor: FinanceAnalyst
        preconditions:
          - "RenewalForecast.cs_state == SUBMITTED"
          - "abs(variance_cents) * 10000 <= VARIANCE_TOLERANCE_BP * cs_amount_cents"
        side_effects:
          - "set RenewalForecast.finance_amount_cents (from the request, or from the finance_top_down variant of calculations.renewal_forecast_amounts when omitted)"
          - "set RenewalForecast.variance_cents = finance_amount_cents - cs_amount_cents and reconciled_at = logical clock"
      - from: "finance_state=PENDING"
        to: "finance_state=VARIANCE_FLAGGED"
        trigger: "POST /renewal-forecasts/{id}/reconcile {action: RECONCILE}"
        actor: FinanceAnalyst
        preconditions:
          - "RenewalForecast.cs_state == SUBMITTED"
          - "abs(variance_cents) * 10000 > VARIANCE_TOLERANCE_BP * cs_amount_cents"
        side_effects:
          - "set RenewalForecast.finance_amount_cents, variance_cents and reconciled_at as above"
          - "cs_state is untouched, so the row sits at cs_state=SUBMITTED, finance_state=VARIANCE_FLAGGED until the CSM revises"
      - from: "finance_state=VARIANCE_FLAGGED"
        to: "finance_state=PENDING"
        trigger: "POST /renewal-forecasts/{id}/submit (the cs revision edge)"
        actor: CsmUser
        preconditions:
          - "RenewalForecast.finance_state == VARIANCE_FLAGGED"
        side_effects:
          - "set RenewalForecast.variance_cents = null and finance_amount_cents = null"

  - entity: ExecutiveEngagement
    initial_state: SCHEDULED
    terminal_states: [HELD, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /executive-engagements/{id}/outcome {outcome: HELD}"
        actor: CsmUser
        preconditions:
          - "the logical clock is at or after ExecutiveEngagement.start_at"
        side_effects:
          - "set outcome_recorded_at = logical clock"
          - "recompute Account.exec_engagement_score, then both variants of calculations.account_health_score, then Account.health_tier and Account.coverage_posture"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /executive-engagements/{id}/outcome {outcome: NO_SHOW}"
        actor: CsmUser
        preconditions:
          - "the logical clock is at or after ExecutiveEngagement.end_at"
        side_effects:
          - "set outcome_recorded_at = logical clock"
          - "recompute Account.exec_engagement_score, then both variants of calculations.account_health_score, then Account.health_tier and Account.coverage_posture"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /executive-engagements/{id}/outcome {outcome: CANCELLED}"
        actor: CsmUser
        preconditions: []
        side_effects:
          - "the interval is released from the sponsor's calendar, so a later engagement may occupy the same window"
          - "CANCELLED engagements are excluded from calculations.exec_engagement_score"

  - entity: OutcomeGoal
    initial_state: DEFINED
    terminal_states: [ATTAINED, MISSED, WAIVED]
    transitions:
      - from: DEFINED
        to: IN_PROGRESS
        trigger: "POST /outcome-goals/{id}/progress {status: IN_PROGRESS}"
        actor: CsmUser
        preconditions:
          - "Account.lifecycle_state NOT IN {CHURNED, ARCHIVED}"
        side_effects:
          - "set OutcomeGoal.actual_value from the request and attainment_pct per calculations.outcome_attainment_index"
          - "recompute Account.outcome_attainment_index and both variants of calculations.account_health_score"
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /outcome-goals/{id}/progress {status: IN_PROGRESS}"
        actor: CsmUser
        preconditions:
          - "Account.lifecycle_state NOT IN {CHURNED, ARCHIVED}"
        side_effects:
          - "set OutcomeGoal.actual_value from the request and attainment_pct per calculations.outcome_attainment_index"
          - "recompute Account.outcome_attainment_index and both variants of calculations.account_health_score"
      - from: IN_PROGRESS
        to: ATTAINED
        trigger: "POST /outcome-goals/{id}/progress {status: ATTAINED}"
        actor: CsmUser
        preconditions:
          - "actual_value >= target_value"
        side_effects:
          - "set attainment_pct = 100.00 and recompute Account.outcome_attainment_index and both health variants"
      - from: IN_PROGRESS
        to: MISSED
        trigger: "POST /outcome-goals/{id}/progress {status: MISSED}"
        actor: CsmUser
        preconditions: []
        side_effects:
          - "recompute Account.outcome_attainment_index and both health variants"
      - from: DEFINED
        to: WAIVED
        trigger: "POST /outcome-goals/{id}/progress {status: WAIVED}"
        actor: CsmUser
        preconditions: []
        side_effects:
          - "the goal leaves the calculations.outcome_attainment_index input set and its weight_bp leaves the weight denominator"
      - from: IN_PROGRESS
        to: WAIVED
        trigger: "POST /outcome-goals/{id}/progress {status: WAIVED}"
        actor: CsmUser
        preconditions: []
        side_effects:
          - "the goal leaves the calculations.outcome_attainment_index input set and its weight_bp leaves the weight denominator"

  - entity: ExpansionOpportunity
    initial_state: IDENTIFIED
    terminal_states: [ACCEPTED, RECYCLED, EXPIRED]
    note: "REJECTED -> RECYCLED spawns a fresh IDENTIFIED successor row, closing a cycle through a self-referential edge."
    transitions:
      - from: IDENTIFIED
        to: HANDED_OFF
        trigger: "POST /expansion-opportunities/{id}/transition {action: HANDOFF}"
        actor: CsmUser
        preconditions:
          - "Account.coverage_posture == OPEN"
          - "Account.health_tier IN {AMBER, GREEN}"
          - "ExpansionOpportunity.qualification_score >= EXPANSION_HANDOFF_FLOOR"
          - "handoff_ae_user_id is supplied"
        side_effects:
          - "set ExpansionOpportunity.handoff_ae_user_id from the request"
      - from: HANDED_OFF
        to: ACCEPTED
        trigger: "POST /expansion-opportunities/{id}/transition {action: ACCEPT}"
        actor: SalesAccountExecutive
        preconditions:
          - "the acting X-User-ID equals ExpansionOpportunity.handoff_ae_user_id"
        side_effects: []
      - from: HANDED_OFF
        to: REJECTED
        trigger: "POST /expansion-opportunities/{id}/transition {action: REJECT}"
        actor: SalesAccountExecutive
        preconditions:
          - "the acting X-User-ID equals ExpansionOpportunity.handoff_ae_user_id"
          - "rejection_reason is supplied"
        side_effects:
          - "set ExpansionOpportunity.rejection_reason from the request"
      - from: REJECTED
        to: RECYCLED
        trigger: "POST /expansion-opportunities/{id}/transition {action: RECYCLE}"
        actor: CsmUser
        preconditions:
          - "Account.coverage_posture != FROZEN"
        side_effects:
          - "create a new ExpansionOpportunity for the same account in state IDENTIFIED with recycled_from_opportunity_id = this row's id, the same estimated_value_cents and source_signal, identified_at = logical clock, and qualification_score freshly computed per calculations.expansion_qualification_score"
      - from: IDENTIFIED
        to: EXPIRED
        trigger: "POST /_ops/daily-sweep, or as a side effect of the Account STEADY -> RENEWED transition"
        actor: system
        preconditions:
          - "the logical clock is more than OPPORTUNITY_STALE_DAYS days after ExpansionOpportunity.identified_at"
        side_effects: []

  - entity: AdvocacyEnrollment
    initial_state: NOMINATED
    terminal_states: [GRADUATED, REVOKED]
    transitions:
      - from: NOMINATED
        to: APPROVED
        trigger: "POST /advocacy-enrollments/{id}/transition {action: APPROVE}"
        actor: AdvocacyManager
        preconditions:
          - "Account.health_tier == GREEN"
          - "Account.coverage_posture == OPEN"
        side_effects: []
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /advocacy-enrollments/{id}/transition {action: ACTIVATE}"
        actor: AdvocacyManager
        preconditions:
          - "Account.health_tier IN {AMBER, GREEN}"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /advocacy-enrollments/{id}/transition {action: SUSPEND}, or system as a side effect of any Account transition into AT_RISK"
        actor: AdvocacyManager | system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /advocacy-enrollments/{id}/transition {action: ACTIVATE}"
        actor: AdvocacyManager
        preconditions:
          - "Account.health_tier IN {AMBER, GREEN}"
        side_effects: []
        note: "Closes the ACTIVE <-> SUSPENDED cycle."
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /advocacy-enrollments/{id}/transition {action: LOG_REFERENCE_CALL}"
        actor: AdvocacyManager
        preconditions:
          - "AdvocacyEnrollment.program_type == REFERENCE"
          - "AdvocacyEnrollment.reference_calls_used < AdvocacyEnrollment.reference_calls_cap"
        side_effects:
          - "increment AdvocacyEnrollment.reference_calls_used by 1 and set last_reference_call_at = logical clock"
      - from: ACTIVE
        to: GRADUATED
        trigger: "POST /advocacy-enrollments/{id}/transition {action: GRADUATE}"
        actor: AdvocacyManager
        preconditions:
          - "AdvocacyEnrollment.reference_calls_used >= 1 when program_type == REFERENCE"
        side_effects: []
      - from: NOMINATED
        to: REVOKED
        trigger: "POST /advocacy-enrollments/{id}/transition {action: REVOKE}, or system as a side effect of Account AT_RISK -> CHURNED or WIN_BACK_TARGETED -> ARCHIVED"
        actor: AdvocacyManager | system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: REVOKED
        trigger: "POST /advocacy-enrollments/{id}/transition {action: REVOKE}, or system as a side effect of Account AT_RISK -> CHURNED or WIN_BACK_TARGETED -> ARCHIVED"
        actor: AdvocacyManager | system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /advocacy-enrollments/{id}/transition {action: REVOKE}, or system as a side effect of Account AT_RISK -> CHURNED or WIN_BACK_TARGETED -> ARCHIVED"
        actor: AdvocacyManager | system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /advocacy-enrollments/{id}/transition {action: REVOKE}, or system as a side effect of Account AT_RISK -> CHURNED or WIN_BACK_TARGETED -> ARCHIVED"
        actor: AdvocacyManager | system
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent entity's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: coverage-assignment-create-stale-account
    parent_entity: Account
    write_endpoint: "POST /coverage-assignments"
    occ_field: "expected_account_version"
    description: |
      Creating a CoverageAssignment against an Account whose version has advanced
      since the client last observed it is rejected. A create is legitimately
      allowed to supersede the account's prior COMMITTED or QUEUED assignment (the
      re-segmentation path drives the prior row to PREEMPTED), so a second create
      cannot be turned away by a state precondition; the stale-version check is
      what stops a writer whose view of the account's coverage_tier, health_tier
      and arr_cents predates the change that produced the current assignment.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

  - rule_id: remediation-commitment-create-stale-case
    parent_entity: EscalationCase
    write_endpoint: "POST /escalation-cases/{id}/remediation-commitments"
    occ_field: "expected_escalation_case_version"
    description: |
      Proposing a RemediationCommitment against an EscalationCase whose version
      has advanced since the client last observed it is rejected. Multiple
      PROPOSED commitments per round are legitimate, so a second proposal is not
      blocked by any state precondition; the stale-version check is what stops an
      executive whose view of remediation_round predates a breach-driven
      COMMITTED -> DISPUTED move from attaching a commitment to the wrong round.
    error_id: ERR_STALE_ESCALATION_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules
# All money is integer cents. All non-integer arithmetic uses Decimal with
# ROUND_HALF_UP. Score fields carry exactly 2 decimal places.
# =============================================================================
calculations:
  - name: seat_utilisation_pct
    entity: AccountSignal
    algorithm_type: threshold
    output_field: seat_utilisation_pct
    trigger: "POST /accounts/{id}/signals with signal_kind == USAGE_PERIOD"
    input_set: "the submitted row only"
    formula: |
      if licensed_seats == 0:
          seat_utilisation_pct = 0.00
      else:
          seat_utilisation_pct = round2(min(100.00, 100 * weekly_active_users / licensed_seats))
    constants: {}
    rounding: "ROUND_HALF_UP to 2 decimal places, clamped at 100.00 so over-provisioned WAU cannot exceed the ceiling"
    worked_example: "weekly_active_users=90, licensed_seats=100 -> min(100.00, 90.00) = 90.00"

  - name: usage_row_index
    entity: AccountSignal
    algorithm_type: weighted_scoring
    output_field: usage_row_index
    trigger: "POST /accounts/{id}/signals with signal_kind == USAGE_PERIOD"
    input_set: "the submitted row only"
    formula: |
      usage_row_index = round2(W_SEAT * seat_utilisation_pct + W_DEPTH * feature_depth_pct)
    constants:
      W_SEAT: 0.60
      W_DEPTH: 0.40
    rounding: "ROUND_HALF_UP to 2 decimal places; the two weights sum to exactly 1.00 so the index shares the 0.00..100.00 range of its inputs"
    worked_example: |
      (weekly_active_users=90, licensed_seats=100, feature_depth_pct=80.00)
        -> seat_utilisation_pct = 90.00
        -> 0.60 * 90.00 + 0.40 * 80.00 = 54.00 + 32.00 = 86.00
      (60, 100, 50.00) -> 0.60*60.00 + 0.40*50.00 = 56.00
      (40, 100, 30.00) -> 0.60*40.00 + 0.40*30.00 = 36.00

  - name: adoption_index
    entity: Account
    algorithm_type: decay_function
    output_field: adoption_index
    trigger: "POST /accounts/{id}/signals (USAGE_PERIOD rows) and POST /accounts/{id}/health-recompute"
    input_set: |
      The three most recent AccountSignal rows of the account with signal_kind == USAGE_PERIOD,
      ordered by period_end_date DESC with created_at ASC as the only tie-break. SUPPORT_TICKET
      rows are excluded. Rows beyond the third-most-recent are excluded entirely.
    formula: |
      rows = the input set, indexed 0 = newest .. k-1 = oldest, k = min(3, count)
      if k == 0:
          adoption_index = 0.00
      else:
          adoption_index = round2( sum(RECENCY_WEIGHTS[i] * rows[i].usage_row_index for i in 0..k-1)
                                   / sum(RECENCY_WEIGHTS[i] for i in 0..k-1) )
    constants:
      RECENCY_WEIGHTS: [0.50, 0.30, 0.20]
      ADOPTION_WINDOW_ROWS: 3
    rounding: |
      Renormalising by the weights actually used (not by 1.00) is what makes a
      one-row or two-row account comparable to a three-row account. Single
      ROUND_HALF_UP to 2 decimal places, applied once after the division.
    worked_example: |
      Three rows, newest first: 86.00, 56.00, 36.00
        numerator   = 0.50*86.00 + 0.30*56.00 + 0.20*36.00 = 43.00 + 16.80 + 7.20 = 67.00
        denominator = 0.50 + 0.30 + 0.20 = 1.00
        adoption_index = 67.00
      One row, 40.00: numerator = 0.50*40.00 = 20.00, denominator = 0.50
        adoption_index = round2(20.00 / 0.50) = 40.00

  - name: support_row_penalty_points
    entity: AccountSignal
    algorithm_type: aggregation
    output_field: penalty_points
    trigger: "POST /accounts/{id}/signals with signal_kind == SUPPORT_TICKET"
    input_set: "the submitted row only"
    formula: |
      penalty_points = SEVERITY_POINTS[ticket_severity]
                     + (SLA_BREACH_POINTS if breached_sla else 0)
                     + (LOW_CSAT_POINTS if csat_score is not null and csat_score <= LOW_CSAT_THRESHOLD else 0)
    constants:
      SEVERITY_POINTS: { S1: 12, S2: 7, S3: 3, S4: 1 }
      SLA_BREACH_POINTS: 5
      LOW_CSAT_POINTS: 4
      LOW_CSAT_THRESHOLD: 2
    rounding: "integer arithmetic only"
    worked_example: "S1 + breached_sla + csat_score=2 -> 12 + 5 + 4 = 21; S1 alone -> 12; S3 with csat_score=3 -> 3"

  - name: support_risk_penalty
    entity: Account
    algorithm_type: threshold
    output_field: support_risk_penalty
    trigger: "POST /accounts/{id}/signals (SUPPORT_TICKET rows) and POST /accounts/{id}/health-recompute"
    input_set: |
      AccountSignal rows of the account with signal_kind == SUPPORT_TICKET whose opened_at lies in
      the half-open window (logical_clock - SUPPORT_WINDOW_DAYS days, logical_clock]. Rows opened
      exactly SUPPORT_WINDOW_DAYS days before the clock are OUT; rows opened exactly at the clock
      are IN. USAGE_PERIOD rows are excluded.
    formula: |
      raw_points = sum(penalty_points over the input set)
      support_risk_penalty = min(SUPPORT_PENALTY_CAP, raw_points) rendered with 2 decimal places
      support_component = 100.00 - support_risk_penalty     # the S term of account_health_score
    constants:
      SUPPORT_WINDOW_DAYS: 90
      SUPPORT_PENALTY_CAP: 45.00
    rounding: "the cap is applied after summation, never per row; the result carries 2 decimal places"
    worked_example: |
      Five S1 tickets, none breaching SLA, no csat: raw_points = 5 * 12 = 60
        support_risk_penalty = min(45.00, 60) = 45.00
        support_component    = 100.00 - 45.00 = 55.00
      No tickets in window: raw_points = 0 -> support_risk_penalty = 0.00, support_component = 100.00

  - name: exec_engagement_score
    entity: Account
    algorithm_type: weighted_scoring
    output_field: exec_engagement_score
    trigger: "POST /executive-engagements/{id}/outcome, PATCH /sponsor-contacts/{id}, POST /accounts/{id}/health-recompute"
    input_set: |
      ExecutiveEngagement rows of the account whose state is HELD or NO_SHOW and whose start_at lies
      in the half-open window (logical_clock - EXEC_WINDOW_DAYS days, logical_clock]. SCHEDULED and
      CANCELLED engagements are excluded. Seniority comes from the joined SponsorContact.seniority
      as it stands at evaluation time.
    formula: |
      senior_credit = min(EXEC_SENIOR_CREDIT_CAP,
                          EXEC_SENIOR_POINTS * count(HELD rows whose sponsor seniority in {CXO, VP}))
      junior_credit = min(EXEC_JUNIOR_CREDIT_CAP,
                          EXEC_JUNIOR_POINTS * count(HELD rows whose sponsor seniority in {DIRECTOR, MANAGER}))
      no_show_debit = EXEC_NO_SHOW_DEBIT * count(NO_SHOW rows)          # uncapped
      buyer_debit   = EXEC_NO_BUYER_DEBIT if the account has no SponsorContact with
                      is_economic_buyer == true and status == ACTIVE, else 0.00
      exec_engagement_score = clamp(0.00, 100.00,
                                    EXEC_BASE + senior_credit + junior_credit
                                    - no_show_debit - buyer_debit)
    constants:
      EXEC_BASE: 50.00
      EXEC_SENIOR_POINTS: 15.00
      EXEC_JUNIOR_POINTS: 5.00
      EXEC_SENIOR_CREDIT_CAP: 45.00
      EXEC_JUNIOR_CREDIT_CAP: 15.00
      EXEC_NO_SHOW_DEBIT: 20.00
      EXEC_NO_BUYER_DEBIT: 25.00
      EXEC_WINDOW_DAYS: 180
    rounding: "the two credit caps are independent; clamping to [0.00, 100.00] happens once, last"
    worked_example: |
      No engagements at all and no ACTIVE economic buyer:
        50.00 + 0.00 + 0.00 - 0.00 - 25.00 = 25.00
      No engagements, one ACTIVE economic buyer:
        50.00 - 0.00 = 50.00
      One HELD QBR with a CXO sponsor who is the ACTIVE economic buyer:
        50.00 + 15.00 = 65.00
      Four HELD CXO engagements (senior credit would be 60.00) and an ACTIVE buyer:
        50.00 + min(45.00, 60.00) = 95.00

  - name: outcome_attainment_index
    entity: Account
    algorithm_type: weighted_scoring
    output_field: outcome_attainment_index
    trigger: "POST /accounts/{id}/outcome-goals, POST /outcome-goals/{id}/progress, POST /accounts/{id}/health-recompute"
    input_set: |
      OutcomeGoal rows of the account whose status is DEFINED, IN_PROGRESS, ATTAINED or MISSED.
      WAIVED goals are excluded from BOTH the numerator and the weight denominator.
    formula: |
      per goal g in the input set:
          g.attainment_pct = round2(min(100.00, 100 * g.actual_value / g.target_value))
      total_weight_bp = sum(g.weight_bp over the input set)
      if the input set is empty:
          outcome_attainment_index = OUTCOME_EMPTY_SUBSTITUTE
      else:
          # PINNED ORDER: round each goal's weighted contribution to 2 dp FIRST,
          # then sum the rounded contributions, then round the sum once more.
          contribution(g) = round2(g.attainment_pct * g.weight_bp / total_weight_bp)
          outcome_attainment_index = round2(sum(contribution(g) over the input set))
    constants:
      OUTCOME_EMPTY_SUBSTITUTE: 60.00
      MAX_TOTAL_WEIGHT_BP: 10000
    rounding: |
      Rounding per contribution BEFORE aggregation is mandatory and is observably
      different from aggregating first. Aggregating the unrounded products and
      rounding once at the end produces a different index for the same goals.
    worked_example: |
      Goal A: weight_bp=9000, target_value=3, actual_value=1
        attainment_pct = round2(100 * 1 / 3) = round2(33.3333..) = 33.33
        contribution   = round2(33.33 * 9000 / 10000) = round2(29.997) = 30.00
      Goal B: weight_bp=1000, target_value=3, actual_value=2
        attainment_pct = round2(100 * 2 / 3) = round2(66.6666..) = 66.67
        contribution   = round2(66.67 * 1000 / 10000) = round2(6.667) = 6.67
      outcome_attainment_index = round2(30.00 + 6.67) = 36.67
      (Aggregating first would give round2(29.997 + 6.667) = round2(36.664) = 36.66 -- WRONG.)

      Single goal weight_bp=10000, target_value=100, actual_value=14
        attainment_pct = 14.00, contribution = round2(14.00 * 10000/10000) = 14.00, index = 14.00

  - name: account_health_score
    entity: Account
    algorithm_type: weighted_scoring
    output_field: "snapshot_health_score, trended_health_score, health_tier"
    trigger: "POST /accounts (initial computation), POST /accounts/{id}/health-recompute, and every calculation trigger listed on adoption_index / support_risk_penalty / exec_engagement_score / outcome_attainment_index"
    input_set: "the account's four component scores, recomputed in the order adoption -> support -> exec -> outcome before either variant is evaluated"
    variants:
      - name: snapshot_health
        applies_when: "always; written to Account.snapshot_health_score and used to derive Account.health_tier"
        description: |
          Point-in-time view. The adoption term A is the usage_row_index of the
          SINGLE most recent USAGE_PERIOD row (period_end_date DESC, created_at ASC
          tie-break), or 0.00 when the account has no USAGE_PERIOD row.
      - name: trended_health
        applies_when: "always; written to Account.trended_health_score and used by renewal_likelihood and expansion_qualification_score"
        description: |
          Trailing view. The adoption term A is Account.adoption_index, i.e. the
          recency-weighted mean over the trailing three USAGE_PERIOD rows.
    formula: |
      S = 100.00 - Account.support_risk_penalty
      E = Account.exec_engagement_score
      O = Account.outcome_attainment_index

      A_snapshot = usage_row_index of the most recent USAGE_PERIOD row, else 0.00
      A_trended  = Account.adoption_index

      score(A) = round2(W_ADOPTION * A + W_SUPPORT * S + W_EXEC * E + W_OUTCOME * O)

      snapshot_health_score = score(A_snapshot)
      trended_health_score  = score(A_trended)

      # health_tier is derived from the SNAPSHOT variant only
      health_tier = RED   if snapshot_health_score <  TIER_AMBER_FLOOR
                    AMBER if TIER_AMBER_FLOOR <= snapshot_health_score < TIER_GREEN_FLOOR
                    GREEN if snapshot_health_score >= TIER_GREEN_FLOOR

      # SavePlay failure applies a transient debit on top of the stored scores;
      # it is overwritten by the next health-recompute.
      on SavePlay ACTIVE -> FAILED:
          snapshot_health_score = max(0.00, snapshot_health_score - SAVE_FAILURE_PENALTY)
          trended_health_score  = max(0.00, trended_health_score  - SAVE_FAILURE_PENALTY)
          health_tier re-derived from the debited snapshot_health_score
    constants:
      W_ADOPTION: 0.35
      W_SUPPORT: 0.25
      W_EXEC: 0.15
      W_OUTCOME: 0.25
      TIER_AMBER_FLOOR: 50.00
      TIER_GREEN_FLOOR: 75.00
      SAVE_FAILURE_PENALTY: 5.00
    rounding: |
      The four weights sum to exactly 1.00. Each variant is rounded once, after the
      whole weighted sum. Tier floors are INCLUSIVE lower bounds: exactly 50.00 is
      AMBER (not RED) and exactly 75.00 is GREEN (not AMBER).
    worked_example: |
      (a) Freshly created account, no signals, no sponsors, no goals:
          A_snapshot = 0.00, A_trended = 0.00, S = 100.00,
          E = 25.00 (base 50.00 minus the 25.00 no-ACTIVE-economic-buyer debit),
          O = 60.00 (OUTCOME_EMPTY_SUBSTITUTE)
          score = 0.35*0.00 + 0.25*100.00 + 0.15*25.00 + 0.25*60.00
                = 0.00 + 25.00 + 3.75 + 15.00 = 43.75
          snapshot_health_score = 43.75, trended_health_score = 43.75, health_tier = RED

      (b) Three USAGE_PERIOD rows with usage_row_index 36.00, 56.00, 86.00
          (86.00 newest), still no sponsors / tickets / goals:
          A_snapshot = 86.00 -> snapshot = 0.35*86.00 + 43.75 = 30.10 + 43.75 = 73.85 (AMBER)
          A_trended  = 67.00 -> trended  = 0.35*67.00 + 43.75 = 23.45 + 43.75 = 67.20 (AMBER)
          VARIANT DELTA = 73.85 - 67.20 = 6.65

      (c) Tier boundary: A_snapshot = 40.00, S = 100.00, E = 50.00 (one ACTIVE
          economic buyer, no engagements), O = 14.00 (single goal 14/100):
          score = 14.00 + 25.00 + 7.50 + 3.50 = 50.00 -> AMBER (exactly at the floor)
          Drop the goal to 13/100 so O = 13.00:
          score = 14.00 + 25.00 + 7.50 + 3.25 = 49.75 -> RED

      (d) Support cap case, A_snapshot = 86.00, five S1 tickets so S = 55.00,
          E = 25.00, O = 60.00:
          score = 30.10 + 13.75 + 3.75 + 15.00 = 62.60 (AMBER)

  - name: coverage_tier_assignment
    entity: Account
    algorithm_type: threshold
    output_field: coverage_tier
    trigger: "POST /accounts/{id}/segmentation"
    input_set: "Account.lifecycle_state, Account.arr_cents, Account.segment_band, Account.health_tier"
    formula: |
      # first matching clause wins; the order below is normative
      if lifecycle_state in {CHURNED, WIN_BACK_TARGETED, ARCHIVED}:
          coverage_tier = DIGITAL
      elif arr_cents >= HIGH_TOUCH_ARR_FLOOR or (segment_band == ENTERPRISE and health_tier == RED):
          coverage_tier = HIGH_TOUCH
      elif arr_cents >= LOW_TOUCH_ARR_FLOOR or health_tier == RED:
          coverage_tier = LOW_TOUCH
      else:
          coverage_tier = DIGITAL
    constants:
      HIGH_TOUCH_ARR_FLOOR: 25000000
      LOW_TOUCH_ARR_FLOOR: 5000000
    rounding: "integer cent comparisons; both floors are inclusive"
    worked_example: |
      arr_cents=30000000, ENTERPRISE, AMBER, STEADY   -> HIGH_TOUCH (arr floor)
      arr_cents= 3000000, ENTERPRISE, RED,   ADOPTING -> HIGH_TOUCH (risk escalation clause)
      arr_cents= 6000000, MIDMARKET,  GREEN, STEADY   -> LOW_TOUCH
      arr_cents=  900000, SMB,        RED,   ADOPTING -> LOW_TOUCH (health_tier == RED clause)
      arr_cents=  900000, SMB,        GREEN, STEADY   -> DIGITAL
      arr_cents=30000000, ENTERPRISE, GREEN, CHURNED  -> DIGITAL (lifecycle clause wins over arr)

  - name: coverage_load_units
    entity: CoverageAssignment
    algorithm_type: tiered_pricing
    output_field: load_units
    trigger: "POST /coverage-assignments"
    input_set: "the account's coverage_tier, segment_band, health_tier and arr_cents as they stand when the assignment row is created"
    formula: |
      raw = round2(BASE_UNITS[account.coverage_tier]
                   * SEGMENT_MULTIPLIER[account.segment_band]
                   * RISK_MULTIPLIER[account.health_tier])
            + ARR_SURCHARGE(account.arr_cents)

      ARR_SURCHARGE(arr) = 4 if arr >= 100000000
                           2 if arr >=  25000000
                           1 if arr >=   5000000
                           0 otherwise

      load_units = min(LOAD_UNITS_CEILING, max(LOAD_UNITS_FLOOR, ceil(raw)))
    constants:
      BASE_UNITS: { HIGH_TOUCH: 9, LOW_TOUCH: 5, DIGITAL: 2 }
      SEGMENT_MULTIPLIER: { ENTERPRISE: 1.50, MIDMARKET: 1.00, SMB: 0.50 }
      RISK_MULTIPLIER: { RED: 1.25, AMBER: 1.10, GREEN: 1.00 }
      LOAD_UNITS_FLOOR: 1
      LOAD_UNITS_CEILING: 20
    rounding: |
      FOUR interacting dimensions (coverage tier, commercial segment, health tier,
      ARR band) and exactly ONE ceil, taken after the two multipliers have been
      applied and the integer ARR surcharge added. Applying ceil to the
      base x segment product before multiplying by RISK_MULTIPLIER is a different
      and WRONG function. Clamping happens after the ceil, not before it.
    worked_example: |
      HIGH_TOUCH, ENTERPRISE, AMBER, arr_cents=30000000:
        round2(9 * 1.50 * 1.10) = round2(14.85) = 14.85
        ARR_SURCHARGE(30000000) = 2
        raw = 16.85 -> ceil = 17 -> clamp -> load_units = 17
        (Ceiling the 13.50 sub-product first gives 14 * 1.10 = 15.40, + 2 = 17.40,
         ceil = 18 -- WRONG.)
      Flip health_tier to RED only: round2(9*1.50*1.25) = 16.88, raw = 18.88 -> 19
      Flip health_tier to GREEN only: round2(9*1.50*1.00) = 13.50, raw = 15.50 -> 16
      Flip segment to MIDMARKET only: round2(9*1.00*1.10) = 9.90, raw = 11.90 -> 12
      Flip coverage_tier to LOW_TOUCH only: round2(5*1.50*1.10) = 8.25, raw = 10.25 -> 11
      Flip arr_cents to 6000000 only: surcharge 1, raw = 15.85 -> 16
      Ceiling clamp: HIGH_TOUCH, ENTERPRISE, RED, arr_cents=150000000
        round2(16.875) = 16.88, surcharge 4, raw = 20.88, ceil = 21 -> clamped to 20
      Floor clamp: DIGITAL, SMB, GREEN, arr_cents=100000
        round2(2*0.50*1.00) = 1.00, surcharge 0, raw = 1.00 -> 1

  - name: csm_selection
    entity: CoverageAssignment
    algorithm_type: topological
    output_field: csm_id
    trigger: "POST /coverage-assignments when csm_id is omitted"
    input_set: |
      Csm rows with status == ACTIVE and coverage_specialty == account.coverage_tier.
      ON_LEAVE and OFFBOARDED CSMs are excluded, as are CSMs whose specialty does not
      match the account's current coverage_tier.
    formula: |
      eligible = the input set
      if eligible is empty: raise ERR_NO_ELIGIBLE_CSM
      rank eligible by (capacity_units_available DESC, created_at ASC)
      csm_id = the first ranked row's id
      # An explicitly supplied csm_id bypasses ranking but must still satisfy the
      # eligibility predicate, otherwise ERR_NO_ELIGIBLE_CSM.
    constants: {}
    rounding: "not applicable; created_at ASC is the only tie-break and Csm.id is never used to break ties"
    worked_example: |
      HIGH_TOUCH account. Csm P (ACTIVE, HIGH_TOUCH, available 17), Csm Q (ACTIVE,
      HIGH_TOUCH, available 17, created later), Csm R (ACTIVE, LOW_TOUCH, available 40):
        R is excluded on specialty; P and Q tie at 17; P wins on the earlier created_at.

  - name: coverage_posture_derivation
    entity: Account
    algorithm_type: constraint_propagation
    output_field: coverage_posture
    trigger: "every Account lifecycle transition, every CoverageAssignment state change, every SavePlay state change, every EscalationCase state change, POST /accounts/{id}/health-recompute and POST /_ops/daily-sweep"
    input_set: "Account.lifecycle_state, Account.ttv_breach_flag, Account.open_save_play_count, the account's EscalationCase states, the account's CoverageAssignment states"
    formula: |
      # first matching clause wins; the order below is normative
      if lifecycle_state in {CHURNED, WIN_BACK_TARGETED, ARCHIVED}
         or (lifecycle_state == ONBOARDING and ttv_breach_flag == true):
          coverage_posture = FROZEN
      elif open_save_play_count > 0
           or any EscalationCase of the account is in state OPEN, COMMITTED or DISPUTED
           or no CoverageAssignment of the account is in state COMMITTED:
          coverage_posture = RESTRICTED
      else:
          coverage_posture = OPEN

      # propagation: after the posture is written,
      #   posture became FROZEN  and lifecycle_state == ONBOARDING
      #     -> every OnboardingMilestone in PENDING or OVERDUE moves to BLOCKED
      #   posture left FROZEN
      #     -> every OnboardingMilestone in BLOCKED moves back to PENDING
      # The propagation runs at most once per derivation and reaches a fixed point
      # because milestone states do not feed back into the posture clauses.
    constants: {}
    rounding: "not applicable"
    worked_example: |
      ONBOARDING, ttv_breach_flag=false, 0 save plays, no escalations, no COMMITTED
      assignment -> RESTRICTED (third RESTRICTED clause).
      Same account after a COMMITTED assignment lands -> OPEN.
      Same account after a SavePlay activates -> RESTRICTED (open_save_play_count = 1).
      Same account after the daily sweep raises ttv_breach_flag -> FROZEN, and its
      PENDING milestones become BLOCKED.

  - name: time_to_value_days
    entity: Account
    algorithm_type: chronological
    output_field: "contractual_ttv_days, activation_ttv_days, ttv_breach_flag"
    trigger: "POST /onboarding-milestones/{id}/transition, the Account ONBOARDING -> ADOPTING transition, and POST /_ops/daily-sweep for the breach flag"
    input_set: "the account's OnboardingMilestone rows with milestone_code KICKOFF and GO_LIVE, plus Account.contract_start_date"
    variants:
      - name: contractual_ttv
        applies_when: "written to Account.contractual_ttv_days; this is the variant compared against TTV_TARGET_DAYS for reporting"
        description: "Measured from the commercial start of the term, so integration delays that precede kickoff are counted against the vendor."
      - name: activation_ttv
        applies_when: "written to Account.activation_ttv_days; this is the variant used to grade CSM execution"
        description: "Measured from the kickoff milestone's completion, so pre-kickoff customer-side delay is excluded."
    formula: |
      go_live = the account's OnboardingMilestone with milestone_code == GO_LIVE
      kickoff = the account's OnboardingMilestone with milestone_code == KICKOFF

      contractual_ttv_days = (go_live.completed_date - Account.contract_start_date) in whole days
                             if go_live.state == COMPLETED, else null
      activation_ttv_days  = (go_live.completed_date - kickoff.completed_date) in whole days
                             if go_live.state == COMPLETED and kickoff.state == COMPLETED, else null

      # intervention trigger, evaluated by the daily sweep
      elapsed = (logical_clock_date - Account.contract_start_date) in whole days
      ttv_breach_flag = true  if lifecycle_state == ONBOARDING and elapsed > TTV_TARGET_DAYS[segment_band]
                        false if lifecycle_state != ONBOARDING
    constants:
      TTV_TARGET_DAYS: { ENTERPRISE: 90, MIDMARKET: 60, SMB: 30 }
    rounding: "whole-day differences on calendar dates; a WAIVED GO_LIVE leaves both variants null"
    worked_example: |
      contract_start_date 2026-01-01, KICKOFF completed 2026-01-20, GO_LIVE completed 2026-03-20:
        contractual_ttv_days = 78
        activation_ttv_days  = 59
        VARIANT DELTA = 19 days, exactly the pre-kickoff lag
      ENTERPRISE account still ONBOARDING with contract_start_date 2026-01-01 and the
      clock at 2026-05-01: elapsed = 120 > 90 -> ttv_breach_flag = true

  - name: renewal_likelihood
    entity: Account
    algorithm_type: forward_looking
    output_field: renewal_likelihood
    trigger: "POST /accounts/{id}/health-recompute, every Account lifecycle transition, every SavePlay terminal transition"
    input_set: "Account.lifecycle_state, Account.trended_health_score, Account.open_save_play_count, Account.contract_end_date and the logical clock"
    formula: |
      days_to_renewal = (Account.contract_end_date - logical_clock_date) in whole days
      if lifecycle_state in {CHURNED, WIN_BACK_TARGETED, ARCHIVED}:
          renewal_likelihood = OMIT
      elif trended_health_score >= LIKELIHOOD_COMMIT_FLOOR and open_save_play_count == 0:
          renewal_likelihood = COMMIT
      elif trended_health_score >= LIKELIHOOD_UPSIDE_FLOOR and days_to_renewal > LIKELIHOOD_NEAR_TERM_DAYS:
          renewal_likelihood = UPSIDE
      else:
          renewal_likelihood = AT_RISK
    constants:
      LIKELIHOOD_COMMIT_FLOOR: 75.00
      LIKELIHOOD_UPSIDE_FLOOR: 60.00
      LIKELIHOOD_NEAR_TERM_DAYS: 60
    rounding: "score floors are inclusive; the day threshold is strict (exactly 60 days out is NOT upside)"
    worked_example: |
      trended 67.20, 0 open plays, contract_end_date 2026-12-31, clock 2026-08-01
        days_to_renewal = 152 > 60 -> UPSIDE
      trended 67.20, contract_end_date 2026-09-30, clock 2026-08-01
        days_to_renewal = 60, not > 60 -> AT_RISK
      trended 43.75 -> AT_RISK (below the upside floor)
      lifecycle CHURNED -> OMIT regardless of score

  - name: renewal_forecast_amounts
    entity: RenewalForecast
    algorithm_type: projection
    output_field: "cs_amount_cents, finance_amount_cents, likelihood_category"
    trigger: "POST /renewal-forecasts, the cs revision edge of POST /renewal-forecasts/{id}/submit, and POST /renewal-forecasts/{id}/reconcile"
    input_set: "Account.arr_cents, Account.renewal_likelihood, Account.segment_band"
    variants:
      - name: cs_bottom_up
        applies_when: "POST /renewal-forecasts with cs_amount_cents omitted, and on every SUBMITTED -> DRAFT revision edge"
        description: "The CS organisation's own number: ARR weighted by the account's current renewal_likelihood."
      - name: finance_top_down
        applies_when: "POST /renewal-forecasts/{id}/reconcile with finance_amount_cents omitted"
        description: "Finance's number: ARR weighted by a flat segment retention rate that ignores account-level health entirely."
    formula: |
      likelihood_category = Account.renewal_likelihood at the moment the forecast row is written

      # cs_bottom_up
      cs_amount_cents = round_half_up(Account.arr_cents * CS_LIKELIHOOD_WEIGHT[likelihood_category])

      # finance_top_down
      finance_amount_cents = round_half_up(Account.arr_cents * FINANCE_SEGMENT_RATE[Account.segment_band])
    constants:
      CS_LIKELIHOOD_WEIGHT: { COMMIT: 0.95, UPSIDE: 0.70, AT_RISK: 0.35, OMIT: 0.00 }
      FINANCE_SEGMENT_RATE: { ENTERPRISE: 0.90, MIDMARKET: 0.80, SMB: 0.65 }
    rounding: "ROUND_HALF_UP to whole cents on each variant independently"
    worked_example: |
      arr_cents=30000000, renewal_likelihood=AT_RISK, segment_band=ENTERPRISE:
        cs_bottom_up      = round_half_up(30000000 * 0.35) = 10500000
        finance_top_down  = round_half_up(30000000 * 0.90) = 27000000
        VARIANT DELTA = 16500000 cents
      Same ARR with renewal_likelihood=COMMIT:
        cs_bottom_up = 28500000, finance_top_down still 27000000 (delta -1500000)

  - name: forecast_variance_reconciliation
    entity: RenewalForecast
    algorithm_type: threshold
    output_field: "variance_cents, finance_state"
    trigger: "POST /renewal-forecasts/{id}/reconcile"
    input_set: "RenewalForecast.cs_amount_cents and the finance_amount_cents established by this call"
    formula: |
      variance_cents = finance_amount_cents - cs_amount_cents
      # integer cross-multiplication only; never divide, never use floats
      if abs(variance_cents) * 10000 > VARIANCE_TOLERANCE_BP * cs_amount_cents:
          finance_state = VARIANCE_FLAGGED
      else:
          finance_state = RECONCILED
    constants:
      VARIANCE_TOLERANCE_BP: 500
    rounding: |
      Strict `>`: a variance of exactly VARIANCE_TOLERANCE_BP of the CS number
      RECONCILES. The comparison is done by cross-multiplication so no rounding
      is introduced. variance_cents keeps its sign.
    worked_example: |
      cs_amount_cents=10500000, finance_amount_cents=27000000
        variance_cents = 16500000; 16500000 * 10000 = 165000000000
        500 * 10500000 = 5250000000; 165000000000 > 5250000000 -> VARIANCE_FLAGGED
      cs_amount_cents=10500000, finance_amount_cents=11025000
        variance_cents = 525000; 525000 * 10000 = 5250000000
        500 * 10500000 = 5250000000; not > -> RECONCILED (exactly at 5.00%)
      cs_amount_cents=10500000, finance_amount_cents=11025001
        variance_cents = 525001 -> 5250010000 > 5250000000 -> VARIANCE_FLAGGED

  - name: escalation_settlement_credit
    entity: EscalationCase
    algorithm_type: waterfall_allocation
    output_field: final_credit_cents
    trigger: "the EscalationCase COMMITTED -> RESOLVED transition"
    input_set: "Account.arr_cents, EscalationCase.severity, and the credit_cents of this case's RemediationCommitment rows in state DELIVERED (PROPOSED, ACCEPTED, REJECTED, BREACHED and WITHDRAWN rows are excluded)"
    formula: |
      base_credit        = round_half_up(Account.arr_cents * ESCALATION_BASE_CREDIT_BP[severity] / 10000)
      commitment_total   = sum(credit_cents over this case's DELIVERED commitments)
      pre_reduction_total = base_credit + commitment_total

      # PINNED: the discount tier is selected from the PRE-REDUCTION total, and the
      # reduction is then applied to that same pre-reduction total. The tier is never
      # re-selected from the reduced figure and never selected from base_credit alone.
      tier_bp = SETTLEMENT_TIER_2_BP if pre_reduction_total >= SETTLEMENT_TIER_2_FLOOR_CENTS
                SETTLEMENT_TIER_1_BP if pre_reduction_total >= SETTLEMENT_TIER_1_FLOOR_CENTS
                0                    otherwise

      reduction          = round_half_up(pre_reduction_total * tier_bp / 10000)
      final_credit_cents = pre_reduction_total - reduction
    constants:
      ESCALATION_BASE_CREDIT_BP: { CRITICAL: 300, HIGH: 150, MEDIUM: 50 }
      SETTLEMENT_TIER_2_FLOOR_CENTS: 1000000
      SETTLEMENT_TIER_2_BP: 2000
      SETTLEMENT_TIER_1_FLOOR_CENTS: 250000
      SETTLEMENT_TIER_1_BP: 1000
    rounding: "ROUND_HALF_UP to whole cents, once on base_credit and once on reduction; three interacting dimensions (severity band, delivered-commitment total, discount tier)"
    worked_example: |
      arr_cents=30000000, severity=HIGH, one DELIVERED commitment of 600000:
        base_credit         = round_half_up(30000000 * 150 / 10000) = 450000
        commitment_total    = 600000
        pre_reduction_total = 1050000
        tier_bp             = 2000 (1050000 >= 1000000)
        reduction           = round_half_up(1050000 * 2000 / 10000) = 210000
        final_credit_cents  = 840000
      Selecting the tier from base_credit alone would give tier_bp = 1000,
      reduction = 105000 and final_credit_cents = 945000 -- WRONG.
      With no DELIVERED commitment: pre_reduction_total = 450000, tier_bp = 1000,
      reduction = 45000, final_credit_cents = 405000.

  - name: expansion_qualification_score
    entity: ExpansionOpportunity
    algorithm_type: weighted_scoring
    output_field: qualification_score
    trigger: "POST /expansion-opportunities and the REJECTED -> RECYCLED transition that spawns a successor row"
    input_set: "Account.trended_health_score, Account.adoption_index, Account.arr_cents at the moment the opportunity row is written"
    formula: |
      arr_term = min(100.00, round2(100 * Account.arr_cents / EXPANSION_ARR_NORMALISER))
      qualification_score = round2(  W_QUAL_HEALTH   * Account.trended_health_score
                                   + W_QUAL_ADOPTION * Account.adoption_index
                                   + W_QUAL_ARR      * arr_term)
    constants:
      W_QUAL_HEALTH: 0.50
      W_QUAL_ADOPTION: 0.30
      W_QUAL_ARR: 0.20
      EXPANSION_ARR_NORMALISER: 50000000
      EXPANSION_HANDOFF_FLOOR: 65.00
    rounding: |
      The score uses trended_health_score, NEVER snapshot_health_score. arr_term is
      rounded to 2 dp before weighting and clamped at 100.00. The handoff floor is
      an inclusive lower bound, so exactly 65.00 qualifies.
    worked_example: |
      trended_health_score=67.20, adoption_index=67.00, arr_cents=30000000:
        arr_term = min(100.00, round2(60.00)) = 60.00
        0.50*67.20 + 0.30*67.00 + 0.20*60.00 = 33.60 + 20.10 + 12.00 = 65.70
        65.70 >= 65.00 -> eligible for handoff
      Using snapshot_health_score 73.85 instead would give 69.03 -- WRONG variant.

  - name: save_play_window_capacity
    entity: SavePlay
    algorithm_type: interval_merge
    output_field: "not stored; gates the SavePlay DRAFT -> ACTIVE transition"
    trigger: "POST /save-plays/{id}/transition {action: ACTIVATE}"
    input_set: "SavePlay rows of the same account_id in state ACTIVE. DRAFT, SUCCEEDED, FAILED and ABANDONED plays are excluded, as are plays of other accounts."
    formula: |
      # CLOSED INCLUSIVE calendar-day intervals [window_start_date, window_end_date]
      overlaps(a, b) = a.window_start_date <= b.window_end_date
                       and a.window_end_date >= b.window_start_date
      for each calendar day d in [candidate.window_start_date, candidate.window_end_date]:
          if count(ACTIVE plays of the account whose interval contains d) >= MAX_CONCURRENT_SAVE_PLAYS:
              raise ERR_SAVE_PLAY_WINDOW_CAPACITY
    constants:
      MAX_CONCURRENT_SAVE_PLAYS: 2
    rounding: |
      Day granularity, closed at both ends, so two plays that merely touch
      (one ends 2026-08-10, the next starts 2026-08-10) DO overlap on that day.
      This is an AGGREGATE limit: the third concurrent play is the one rejected.
    worked_example: |
      Account with ACTIVE plays [2026-08-01, 2026-08-10] and [2026-08-05, 2026-08-20].
      Candidate [2026-08-10, 2026-08-15]: day 2026-08-10 is already covered by both
      -> count 2 >= 2 -> ERR_SAVE_PLAY_WINDOW_CAPACITY.
      Candidate [2026-08-11, 2026-08-15]: only the second play covers those days
      -> count 1 < 2 -> activation succeeds.

  - name: engagement_window_conflict
    entity: ExecutiveEngagement
    algorithm_type: interval_merge
    output_field: "not stored; gates POST /accounts/{id}/executive-engagements"
    trigger: "POST /accounts/{id}/executive-engagements"
    input_set: "ExecutiveEngagement rows with the SAME sponsor_contact_id whose state is SCHEDULED or HELD, across every account. NO_SHOW and CANCELLED rows are excluded and their windows are free for reuse."
    formula: |
      # HALF-OPEN minute intervals [start_at, end_at) plus a symmetric travel buffer
      conflict(new, existing) = new.start_at <  existing.end_at   + EXEC_BUFFER_MINUTES
                               and new.end_at   >  existing.start_at - EXEC_BUFFER_MINUTES
      if any existing row conflicts: raise ERR_ENGAGEMENT_WINDOW_CONFLICT
    constants:
      EXEC_BUFFER_MINUTES: 30
    rounding: |
      Half-open intervals mean a new engagement starting exactly at
      existing.end_at + EXEC_BUFFER_MINUTES does NOT conflict, while one minute
      earlier does. The buffer is applied to the EXISTING row's bounds on both sides.
    worked_example: |
      Existing SCHEDULED engagement for sponsor X: 2026-08-10T14:00:00Z .. 15:00:00Z.
      Candidate 15:15:00Z .. 16:00:00Z: 15:15 < 15:30 and 16:00 > 13:30 -> CONFLICT.
      Candidate 15:30:00Z .. 16:30:00Z: 15:30 < 15:30 is false -> no conflict.
      Candidate 13:00:00Z .. 13:30:00Z: 13:00 < 15:30 and 13:30 > 13:30 is false -> no conflict.

  - name: csm_capacity_conservation
    entity: Csm
    algorithm_type: aggregation
    output_field: "capacity_units_committed, capacity_units_available"
    trigger: "every CoverageAssignment state change (create, auto-promotion to COMMITTED, release, preemption)"
    input_set: "CoverageAssignment rows with this csm_id in state COMMITTED. QUEUED, RELEASED and PREEMPTED rows contribute nothing."
    formula: |
      # COMPENSATING INVARIANT -- must hold after EVERY write, with no drift
      Csm.capacity_units_committed == sum(load_units over CoverageAssignment rows
                                          where csm_id == this csm and state == COMMITTED)
      Csm.capacity_units_available == Csm.capacity_units_total - Csm.capacity_units_committed
      # and the admission test for entering COMMITTED
      capacity_units_available >= candidate.load_units       # inclusive: an exact fit is admitted
    constants: {}
    rounding: "integer units only; capacity_units_available may reach exactly 0 but never goes negative"
    worked_example: |
      capacity_units_total=17, no assignments: committed=0, available=17.
      A 17-unit assignment COMMITs: committed=17, available=0 (exact fit admitted).
      A second 1-unit assignment stays QUEUED: committed unchanged at 17.
      Releasing the first: committed=0, available=17, then the QUEUED 1-unit row is
      promoted: committed=1, available=16. Sum of COMMITTED load_units = 1. Invariant holds.

  - name: remediation_credit_conservation
    entity: Account
    algorithm_type: aggregation
    output_field: "remediation_credit_outstanding_cents, remediation_credit_settled_cents"
    trigger: "every RemediationCommitment state change and every EscalationCase transition into RESOLVED or WITHDRAWN"
    input_set: "RemediationCommitment rows whose owning EscalationCase belongs to this account"
    formula: |
      # COMPENSATING INVARIANT -- must hold after EVERY write, with no drift
      remediation_credit_outstanding_cents ==
          sum(c.credit_cents for c in the account's commitments
              where c.state in {ACCEPTED, DELIVERED}
                and c.escalation_case.state in {OPEN, COMMITTED, DISPUTED})
      remediation_credit_settled_cents ==
          sum(case.final_credit_cents for case in the account's EscalationCase rows
              where case.state == RESOLVED)
      # Consequence: withdrawing a case or breaching a commitment must reverse the
      # exact amount that was added when the commitment was ACCEPTED, so a
      # propose -> accept -> withdraw round trip returns outstanding to its prior value.
    constants: {}
    rounding: "integer cents; both counters are >= 0 at all times"
    worked_example: |
      Start: outstanding=0, settled=0.
      Commitment of 600000 ACCEPTED: outstanding=600000.
      Same commitment DELIVERED: outstanding stays 600000 (still owed to the customer).
      Case RESOLVED with final_credit_cents=840000: outstanding=0, settled=840000.
      Alternative branch -- case WITHDRAWN instead: outstanding returns to 0,
      settled stays 0, and no drift remains.

  - name: reference_calls_cap_derivation
    entity: Account
    algorithm_type: threshold
    output_field: "Account.reference_calls_cap, AdvocacyEnrollment.reference_calls_cap"
    trigger: "POST /accounts (sets the account cap) and POST /accounts/{id}/advocacy-enrollments (copies it onto the enrollment)"
    input_set: "Account.segment_band"
    formula: |
      Account.reference_calls_cap = REFERENCE_CALLS_CAP[segment_band]
      # the enrollment snapshots the account cap at creation time and is NOT
      # retroactively changed when the account's segment_band later changes
      AdvocacyEnrollment.reference_calls_cap = Account.reference_calls_cap at creation
      # LOG_REFERENCE_CALL admission test
      reference_calls_used < reference_calls_cap      # strict: the cap-th call is the last allowed
    constants:
      REFERENCE_CALLS_CAP: { ENTERPRISE: 6, MIDMARKET: 4, SMB: 2 }
    rounding: "integer counts"
    worked_example: |
      SMB account -> cap 2. A REFERENCE enrollment logs call 1 (used=1 < 2 -> ok),
      call 2 (used=2, and 1 < 2 held before the increment -> ok), call 3 rejected
      because 2 < 2 is false -> ERR_REFERENCE_CALL_CAP_REACHED.

# =============================================================================
# 1.4 Validation Rules  (strict priority ladder; lower `priority` wins)
# Every write endpoint evaluates these rules in ascending priority order and
# returns the FIRST violated rule's error. No rule is ever skipped because a
# later rule also fires.
# =============================================================================
validations:
  - priority: 1
    category: auth
    rule: "The X-User-ID header is present and non-empty, and the X-Role header names a role declared in §1.7."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "every endpoint"

  - priority: 2
    category: auth
    rule: "The acting role appears in the endpoint's `roles` list in §1.5."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "every endpoint"

  - priority: 3
    category: existence
    rule: "Every entity addressed by a path parameter exists."
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"
    note: "Path existence is resolved outermost-first: for POST /escalation-cases/{id}/remediation-commitments the case is checked before the body."

  - priority: 4
    category: existence
    rule: "Every entity referenced by a request-body foreign key exists (account_id, csm_id, sponsor_contact_id, save_play_id, owner_csm_id)."
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /coverage-assignments, POST /save-plays, POST /escalation-cases, POST /renewal-forecasts, POST /expansion-opportunities, POST /accounts/{id}/executive-engagements"

  - priority: 5
    category: business_constraint
    rule: "Request body satisfies the endpoint's declared schema: all required fields present, enum values in range, integers non-negative where §1.1 says so, dates ISO YYYY-MM-DD, datetimes ISO 8601 UTC, limit in 1..100, offset >= 0, and the conditional requirements of POST /accounts/{id}/lifecycle (CHURN needs churn_root_cause_code, WIN_BACK_TARGET needs win_back_offer_bp, REACTIVATE needs new_contract_end_date, HANDOFF needs handoff_ae_user_id, REJECT needs rejection_reason, COMPLETE needs completed_date). Fields whose §1.1 source is system or computed are ignored when supplied."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "every endpoint that accepts a body or query parameters"

  - priority: 6
    category: business_constraint
    rule: "For POST /accounts/{id}/executive-engagements, end_at is strictly after start_at. For POST /save-plays, window_end_date is on or after window_start_date. For POST /accounts, contract_end_date is strictly after contract_start_date."
    error_id: ERR_INVALID_ENGAGEMENT_INTERVAL
    http_status: 400
    applies_to: "POST /accounts/{id}/executive-engagements, POST /save-plays, POST /accounts"

  - priority: 7
    category: auth
    rule: "For POST /expansion-opportunities/{id}/transition with action ACCEPT or REJECT, the acting X-User-ID equals ExpansionOpportunity.handoff_ae_user_id."
    error_id: ERR_NOT_HANDOFF_OWNER
    http_status: 403
    applies_to: "POST /expansion-opportunities/{id}/transition"

  - priority: 8
    category: auth
    rule: "For POST /remediation-commitments/{id}/transition with action DELIVER, the acting X-User-ID differs from RemediationCommitment.accepted_by_user_id (segregation of duties)."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /remediation-commitments/{id}/transition"

  - priority: 9
    category: state
    rule: "expected_account_version equals the referenced Account's current version. See §1.2.1 coverage-assignment-create-stale-account."
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /coverage-assignments"

  - priority: 10
    category: state
    rule: "expected_escalation_case_version equals the path EscalationCase's current version. See §1.2.1 remediation-commitment-create-stale-case."
    error_id: ERR_STALE_ESCALATION_VERSION
    http_status: 412
    applies_to: "POST /escalation-cases/{id}/remediation-commitments"

  - priority: 11
    category: state
    rule: "The Account's lifecycle_state permits the requested lifecycle action per the §1.2 Account transition table (for example REACTIVATE is only valid from WIN_BACK_TARGETED, WIN_BACK_TARGET only from CHURNED, WAIVE_TTV_BREACH only from ONBOARDING with ttv_breach_flag true, and RENEW requires a LOCKED RenewalForecast)."
    error_id: ERR_ACCOUNT_LIFECYCLE_INVALID
    http_status: 409
    applies_to: "POST /accounts/{id}/lifecycle"

  - priority: 12
    category: state
    rule: "The requested action is an edge out of the entity's current state in §1.2, including the rule that no edge leaves a terminal state and that a RenewalForecast with cs_state LOCKED accepts neither submit nor reconcile."
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "POST /onboarding-milestones/{id}/transition, POST /save-plays/{id}/transition, POST /escalation-cases/{id}/transition, POST /remediation-commitments/{id}/transition, POST /expansion-opportunities/{id}/transition, POST /advocacy-enrollments/{id}/transition, POST /executive-engagements/{id}/outcome, POST /outcome-goals/{id}/progress, POST /renewal-forecasts/{id}/submit, POST /renewal-forecasts/{id}/reconcile, POST /coverage-assignments/{id}/release"

  - priority: 13
    category: state
    rule: "The owning Account's coverage_posture is not FROZEN."
    error_id: ERR_COVERAGE_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /accounts/{id}/outcome-goals, POST /accounts/{id}/executive-engagements, POST /accounts/{id}/onboarding-milestones, POST /onboarding-milestones/{id}/transition (COMPLETE only), POST /expansion-opportunities, POST /expansion-opportunities/{id}/transition, POST /accounts/{id}/advocacy-enrollments, POST /renewal-forecasts, POST /save-plays"

  - priority: 14
    category: state
    rule: "The owning Account's coverage_posture is OPEN (not RESTRICTED)."
    error_id: ERR_COVERAGE_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "POST /expansion-opportunities/{id}/transition (HANDOFF only), POST /advocacy-enrollments/{id}/transition (APPROVE only)"

  - priority: 15
    category: state
    rule: "The Account's coverage_tier is not UNASSIGNED, i.e. POST /accounts/{id}/segmentation has run at least once."
    error_id: ERR_COVERAGE_TIER_UNASSIGNED
    http_status: 409
    applies_to: "POST /coverage-assignments"

  - priority: 16
    category: state
    rule: "For POST /renewal-forecasts/{id}/reconcile, the forecast's cs_state is SUBMITTED."
    error_id: ERR_FORECAST_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /renewal-forecasts/{id}/reconcile"

  - priority: 17
    category: business_safety
    rule: "The SponsorContact involved in the operation has status ACTIVE, and where the operation requires executive cover the account has a SponsorContact with is_economic_buyer true and status ACTIVE."
    error_id: ERR_SPONSOR_DEPARTED
    http_status: 422
    applies_to: "POST /accounts/{id}/executive-engagements, POST /escalation-cases/{id}/transition (COMMIT only)"

  - priority: 18
    category: business_safety
    rule: "The Account's health_tier is in the set the operation requires: {RED, AMBER} to activate a SavePlay, {AMBER, GREEN} to hand off an ExpansionOpportunity or activate an AdvocacyEnrollment, {GREEN} to approve an AdvocacyEnrollment."
    error_id: ERR_HEALTH_TIER_INELIGIBLE
    http_status: 422
    applies_to: "POST /save-plays/{id}/transition (ACTIVATE only), POST /expansion-opportunities/{id}/transition (HANDOFF only), POST /advocacy-enrollments/{id}/transition (APPROVE and ACTIVATE)"

  - priority: 19
    category: business_temporal
    rule: "The new engagement window does not conflict with any SCHEDULED or HELD engagement of the same sponsor_contact_id under calculations.engagement_window_conflict."
    error_id: ERR_ENGAGEMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /accounts/{id}/executive-engagements"

  - priority: 20
    category: business_temporal
    rule: "Activating the SavePlay does not push any calendar day in its window past MAX_CONCURRENT_SAVE_PLAYS ACTIVE plays for the account, per calculations.save_play_window_capacity."
    error_id: ERR_SAVE_PLAY_WINDOW_CAPACITY
    http_status: 409
    applies_to: "POST /save-plays/{id}/transition (ACTIVATE only)"

  - priority: 21
    category: business_temporal
    rule: "For POST /accounts/{id}/lifecycle with action REACTIVATE, new_contract_end_date is strictly after the logical clock date. For PATCH /accounts/{id}, a supplied contract_end_date is strictly after the logical clock date."
    error_id: ERR_CONTRACT_END_IN_PAST
    http_status: 422
    applies_to: "POST /accounts/{id}/lifecycle, PATCH /accounts/{id}"

  - priority: 22
    category: business_constraint
    rule: "For POST /onboarding-milestones/{id}/transition with action COMPLETE, every OnboardingMilestone of the same account with a strictly lower sequence_index is already COMPLETED or WAIVED."
    error_id: ERR_MILESTONE_SEQUENCE_VIOLATION
    http_status: 422
    applies_to: "POST /onboarding-milestones/{id}/transition"

  - priority: 23
    category: business_constraint
    rule: "milestone_code and sequence_index are each unique within the account across non-WAIVED milestones."
    error_id: ERR_MILESTONE_CODE_DUPLICATE
    http_status: 409
    applies_to: "POST /accounts/{id}/onboarding-milestones"

  - priority: 24
    category: business_constraint
    rule: "fiscal_period is unique per account across RenewalForecast rows."
    error_id: ERR_FORECAST_PERIOD_DUPLICATE
    http_status: 409
    applies_to: "POST /renewal-forecasts"

  - priority: 25
    category: business_referential
    rule: "Cross-aggregate references belong to the same account: SavePlay.owner_csm_id must be an existing Csm, EscalationCase.save_play_id must reference a SavePlay whose account_id equals the case's account_id, and ExecutiveEngagement.sponsor_contact_id must reference a SponsorContact whose account_id equals the path account."
    error_id: ERR_CROSS_ACCOUNT_REFERENCE
    http_status: 422
    applies_to: "POST /escalation-cases, POST /accounts/{id}/executive-engagements"

  - priority: 26
    category: business_referential
    rule: "For POST /escalation-cases/{id}/transition with action COMMIT, at least one RemediationCommitment of the case is in state ACCEPTED with round_index equal to the case's current remediation_round. For action RESOLVE, every commitment is DELIVERED, REJECTED or WITHDRAWN and at least one is DELIVERED."
    error_id: ERR_NO_ACCEPTED_COMMITMENT
    http_status: 422
    applies_to: "POST /escalation-cases/{id}/transition"

  - priority: 27
    category: business_constraint
    rule: "For POST /expansion-opportunities/{id}/transition with action HANDOFF, qualification_score >= EXPANSION_HANDOFF_FLOOR (65.00, inclusive)."
    error_id: ERR_QUALIFICATION_SCORE_TOO_LOW
    http_status: 422
    applies_to: "POST /expansion-opportunities/{id}/transition"

  - priority: 28
    category: business_fiscal
    rule: "The sum of weight_bp over the account's non-WAIVED OutcomeGoal rows, including the row being created, does not exceed MAX_TOTAL_WEIGHT_BP (10000)."
    error_id: ERR_WEIGHT_TOTAL_INVALID
    http_status: 422
    applies_to: "POST /accounts/{id}/outcome-goals"

  - priority: 29
    category: business_fiscal
    rule: "credit_cents does not exceed COMMITMENT_CREDIT_CAP_BP (1000) of the owning Account's arr_cents, i.e. credit_cents * 10000 <= 1000 * arr_cents."
    error_id: ERR_CREDIT_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /escalation-cases/{id}/remediation-commitments"

  - priority: 30
    category: business_fiscal
    rule: "calculations.csm_selection yields a non-empty eligible pool, and an explicitly supplied csm_id satisfies status == ACTIVE and coverage_specialty == account.coverage_tier."
    error_id: ERR_NO_ELIGIBLE_CSM
    http_status: 409
    applies_to: "POST /coverage-assignments"

  - priority: 31
    category: business_fiscal
    rule: "PATCH /csms/{id} may not lower capacity_units_total below the CSM's current capacity_units_committed, because that would break calculations.csm_capacity_conservation."
    error_id: ERR_CSM_CAPACITY_EXHAUSTED
    http_status: 409
    applies_to: "PATCH /csms/{id}"
    note: |
      A POST /coverage-assignments whose load_units exceed the selected CSM's
      capacity_units_available is NOT an error: the assignment is created in QUEUED
      and waits for a release. Only a capacity reduction that would make the
      invariant unsatisfiable is rejected.

  - priority: 32
    category: business_fiscal
    rule: "For POST /advocacy-enrollments/{id}/transition with action LOG_REFERENCE_CALL, program_type is REFERENCE and reference_calls_used < reference_calls_cap."
    error_id: ERR_REFERENCE_CALL_CAP_REACHED
    http_status: 409
    applies_to: "POST /advocacy-enrollments/{id}/transition"

# =============================================================================
# 1.5 Endpoint Table
# api_prefix is "" so every path below is the complete route.
# =============================================================================
endpoints:
  # --- Account -------------------------------------------------------------
  - id: E1
    method: POST
    path: /accounts
    roles: [CsOpsAdmin]
    input: [name, arr_cents, segment_band, contract_start_date, contract_end_date]
    output: Account
    side_effects:
      - "lifecycle_state = ONBOARDING, coverage_tier = UNASSIGNED, assigned_csm_id = null"
      - "reference_calls_cap set per calculations.reference_calls_cap_derivation"
      - "all four component scores computed, then both variants of calculations.account_health_score and health_tier (a bare new account lands on 43.75 / RED)"
      - "renewal_likelihood computed per calculations.renewal_likelihood"
      - "coverage_posture computed per calculations.coverage_posture_derivation (yields RESTRICTED: no COMMITTED assignment)"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_INVALID_ENGAGEMENT_INTERVAL]

  - id: E2
    method: GET
    path: /accounts/{id}
    roles: [CsmUser, CsOpsAdmin, CsExecutive, FinanceAnalyst, SalesAccountExecutive, AdvocacyManager]
    input: []
    output: Account
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ACCOUNT_NOT_FOUND]

  - id: E3
    method: GET
    path: /accounts
    roles: [CsmUser, CsOpsAdmin, CsExecutive, FinanceAnalyst, SalesAccountExecutive, AdvocacyManager]
    input: ["assigned_csm_id?", "health_tier?", "coverage_tier?", "lifecycle_state?", "renewal_likelihood?", "limit?", "offset?"]
    output: "Account[]"
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - id: E4
    method: PATCH
    path: /accounts/{id}
    roles: [CsOpsAdmin]
    input: ["name?", "arr_cents?", "segment_band?", "contract_end_date?"]
    output: Account
    side_effects:
      - "changing arr_cents or segment_band leaves coverage_tier untouched until POST /accounts/{id}/segmentation runs again"
      - "changing segment_band re-derives Account.reference_calls_cap but never rewrites existing AdvocacyEnrollment.reference_calls_cap snapshots"
      - "extending contract_end_date from lifecycle_state RENEWED drives the Account RENEWED -> STEADY transition"
      - "renewal_likelihood recomputed per calculations.renewal_likelihood"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ACCOUNT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_CONTRACT_END_IN_PAST]

  - id: E5
    method: POST
    path: /accounts/{id}/lifecycle
    roles: [CsOpsAdmin]
    input: [action, "churn_root_cause_code?", "win_back_offer_bp?", "new_contract_end_date?"]
    output: Account
    side_effects:
      - "runs the §1.2 Account transition matching `action` with all of its listed side effects"
      - "action is one of RENEW, CHURN, WIN_BACK_TARGET, REACTIVATE, ARCHIVE, WAIVE_TTV_BREACH"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ACCOUNT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_ACCOUNT_LIFECYCLE_INVALID, ERR_CONTRACT_END_IN_PAST]

  - id: E6
    method: POST
