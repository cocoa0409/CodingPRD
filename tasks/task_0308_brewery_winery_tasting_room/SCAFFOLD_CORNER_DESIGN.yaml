            - call: "POST /wineries"
              payload: { name: "Iso Co", ttb_permit_number: "ISO-1", home_state_code: "CA" }
              as: ComplianceOfficer
              captures: { w: $.data.id }
            - call: "POST /batches"
              payload: { winery_id: "${w}", lot_code: "L1", beverage_class: "WINE", volume_in_gallons: 100, abv_percent: 13.5 }
              as: CellarManager
              captures: { b: $.data.id }
            - call: "POST /products"
              payload: { winery_id: "${w}", source_batch_id: "${b}", sku: "S1", vintage_year: 2024, bottle_volume_ml: 750, list_price_cents: 5000 }
              as: CellarManager
              captures: { p: $.data.id, pv0: $.data.version }
            - call: "POST /batches/${b}/transitions"
              payload: { action: "BEGIN_AGING" }
              as: CellarManager
            - call: "POST /batches/${b}/transitions"
              payload: { action: "OPEN_BOTTLING" }
              as: CellarManager
            - call: "POST /batches/${b}/bottling-runs"
              payload: { product_id: "${p}", requested_bottles: 10 }
              as: CellarManager
            - call: "POST /products/${p}/transitions"
              payload: { action: "ACTIVATE", expected_product_version: "${pv0}" }
              as: CellarManager
              captures: { pv1: $.data.version }
            - call: "POST /releases"
              payload: { winery_id: "${w}", product_id: "${p}", pool_bottles: 6, per_member_cap: 6, opens_at: "2026-06-01T00:00:00Z", closes_at: "2026-07-01T00:00:00Z" }
              as: CellarManager
              captures: { r: $.data.id, rv0: $.data.version }
          trigger:
            - call: "POST /releases/${r}/transitions"
              payload: { action: "OPEN_RELEASE", expected_release_version: "${rv0}", expected_product_version: "${pv1}" }
              as: TastingRoomStaff
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403; data.error_id == ERR_FORBIDDEN"

      - name: missing_auth_headers_unauthenticated
        claim_type: role_denied
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID returns ERR_UNAUTHENTICATED 401; modeled here as an Anonymous create attempt."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /wineries"
              payload: { name: "Anon Co", ttb_permit_number: "AN-1", home_state_code: "CA" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 401; data.error_id == ERR_UNAUTHENTICATED"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_winery_version_on_reinstate
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[winery-transition-stale-winery]", "errors[ERR_STALE_WINERY_VERSION]"]
        distinguishing_aspect: "After a SUSPEND advances Winery.version from 1 to 2, a second transition still carrying expected_winery_version=1 (the pre-suspend value) is rejected ERR_STALE_WINERY_VERSION 412."
        test_recipe:
          setup: ["An ACTIVE winery; SUSPEND it once (version 1 -> 2)."]
          setup_api_calls:
            - call: "POST /wineries"
              payload: { name: "Occ Co", ttb_permit_number: "OC-1", home_state_code: "CA" }
              as: ComplianceOfficer
              captures: { w: $.data.id, wv0: $.data.version }
            - call: "POST /wineries/${w}/transitions"
              payload: { action: "SUSPEND", expected_winery_version: "${wv0}" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /wineries/${w}/transitions"
              payload: { action: "REINSTATE", expected_winery_version: "${wv0}" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412; data.error_id == ERR_STALE_WINERY_VERSION (wv0 is stale after the SUSPEND bumped version)"

      - name: occ_release_open_stale_product_covered
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[release-open-stale-product]"]
        excluded_because:
          difficulty_instance: combinatorial_formula / shipment_pricing_kicker_then_cap_mode_a
          rationale: "Product-version OCC on release-open is exercised in the happy path of multiple §1.8 setups (OPEN_RELEASE with captured pv1); the stale variant is asserted explicitly here only for Winery."

      - name: derived_winery_excise_reconciles_after_two_runs
        claim_type: derived_field_reconciliation
        grounds: [entities.Winery.fields.excise_tax_owed_cents, calculations.excise_accrual]
        distinguishing_aspect: "Two WINE tier1 bottling runs of 100x750ml each accrue 2120c apiece; winery.excise_tax_owed_cents reconciles to 4240c (sum across runs)."
        test_recipe:
          setup: ["A WINE batch in BOTTLING with a DRAFT product; two bottling runs of 100 bottles."]
          setup_api_calls:
            - call: "POST /wineries"
              payload: { name: "Rc Co", ttb_permit_number: "RC-1", home_state_code: "CA" }
              as: ComplianceOfficer
              captures: { w: $.data.id }
            - call: "POST /batches"
              payload: { winery_id: "${w}", lot_code: "L1", beverage_class: "WINE", volume_in_gallons: 100, abv_percent: 13.5 }
              as: CellarManager
              captures: { b: $.data.id }
            - call: "POST /products"
              payload: { winery_id: "${w}", source_batch_id: "${b}", sku: "S1", vintage_year: 2024, bottle_volume_ml: 750, list_price_cents: 5000 }
              as: CellarManager
              captures: { p: $.data.id }
            - call: "POST /batches/${b}/transitions"
              payload: { action: "BEGIN_AGING" }
              as: CellarManager
            - call: "POST /batches/${b}/transitions"
              payload: { action: "OPEN_BOTTLING" }
              as: CellarManager
          trigger:
            - call: "POST /batches/${b}/bottling-runs"
              payload: { product_id: "${p}", requested_bottles: 100 }
              as: CellarManager
            - call: "POST /batches/${b}/bottling-runs"
              payload: { product_id: "${p}", requested_bottles: 100 }
              as: CellarManager
          assert:
            - "Winery.${w}.excise_tax_owed_cents == 4240 (2120 + 2120)"

      - name: distribution_ship_removes_inventory_cascade
        claim_type: cascading_side_effects
        grounds: [state_machines.DistributionOrder.SUBMITTED_to_SHIPPED, entities.Product.fields.on_hand_bottles]
        distinguishing_aspect: "SHIP on a SUBMITTED distribution order of 1 case (12 bottles) removes 12 from Product.on_hand_bottles (50 -> 38) and books a DISTRIBUTION_REMOVAL ledger entry."
        test_recipe:
          setup: ["ACTIVE product with 50 on-hand; a SUBMITTED distribution order of 1 case."]
          setup_api_calls:
            - call: "POST /wineries"
              payload: { name: "Ds Co", ttb_permit_number: "DSX-1", home_state_code: "CA" }
              as: ComplianceOfficer
              captures: { w: $.data.id }
            - call: "POST /batches"
              payload: { winery_id: "${w}", lot_code: "L1", beverage_class: "WINE", volume_in_gallons: 100, abv_percent: 13.5 }
              as: CellarManager
              captures: { b: $.data.id }
            - call: "POST /products"
              payload: { winery_id: "${w}", source_batch_id: "${b}", sku: "S1", vintage_year: 2024, bottle_volume_ml: 750, list_price_cents: 5000 }
              as: CellarManager
              captures: { p: $.data.id, pv0: $.data.version }
            - call: "POST /batches/${b}/transitions"
              payload: { action: "BEGIN_AGING" }
              as: CellarManager
            - call: "POST /batches/${b}/transitions"
              payload: { action: "OPEN_BOTTLING" }
              as: CellarManager
            - call: "POST /batches/${b}/bottling-runs"
              payload: { product_id: "${p}", requested_bottles: 50 }
              as: CellarManager
            - call: "POST /products/${p}/transitions"
              payload: { action: "ACTIVATE", expected_product_version: "${pv0}" }
              as: CellarManager
            - call: "POST /distribution-orders"
              payload: { winery_id: "${w}", product_id: "${p}", retailer_license_number: "RET-2", dest_state_code: "CA", case_count: 1 }
              as: ComplianceOfficer
              captures: { d: $.data.id }
            - call: "POST /distribution-orders/${d}/transitions"
              payload: { action: "SUBMIT" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /distribution-orders/${d}/transitions"
              payload: { action: "SHIP" }
              as: ComplianceOfficer
          assert:
            - "DistributionOrder.${d}.status == SHIPPED; Product.${p}.on_hand_bottles == 38"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_inventory_visible_in_same_read
        claim_type: immediate
        grounds: [entities.Product.fields.on_hand_bottles, state_machines.ProductionBatch.BOTTLING_to_BOTTLING]
        distinguishing_aspect: "Under immediate consistency a bottling run's inventory mint is visible on the very next GET /products/{id} (no lag): on_hand_bottles == 30 immediately."
        test_recipe:
          setup: ["A WINE batch in BOTTLING with a DRAFT product; one bottling run of 30."]
          setup_api_calls:
            - call: "POST /wineries"
              payload: { name: "Im Co", ttb_permit_number: "IM-1", home_state_code: "CA" }
              as: ComplianceOfficer
              captures: { w: $.data.id }
            - call: "POST /batches"
              payload: { winery_id: "${w}", lot_code: "L1", beverage_class: "WINE", volume_in_gallons: 100, abv_percent: 13.5 }
              as: CellarManager
              captures: { b: $.data.id }
            - call: "POST /products"
              payload: { winery_id: "${w}", source_batch_id: "${b}", sku: "S1", vintage_year: 2024, bottle_volume_ml: 750, list_price_cents: 5000 }
              as: CellarManager
              captures: { p: $.data.id }
            - call: "POST /batches/${b}/transitions"
              payload: { action: "BEGIN_AGING" }
              as: CellarManager
            - call: "POST /batches/${b}/transitions"
              payload: { action: "OPEN_BOTTLING" }
              as: CellarManager
            - call: "POST /batches/${b}/bottling-runs"
              payload: { product_id: "${p}", requested_bottles: 30 }
              as: CellarManager
          trigger:
            - call: "GET /products/${p}"
              payload: {}
              as: CellarManager
          assert:
            - "Product.${p}.on_hand_bottles == 30 (visible immediately in the same read)"
