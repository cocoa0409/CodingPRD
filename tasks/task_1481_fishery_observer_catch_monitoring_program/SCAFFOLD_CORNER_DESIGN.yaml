              captures: { v1_id: $.data.id }
            - call: "POST /observer-program/vessels"
              payload: { operator_id: "${op_id}", fishery_id: "${fish_id}", vessel_name: "FV Cc2", permit_number: "PERMIT-CC-2", home_port: "Kodiak", length_ft: 55, gear_type: "TRAWL" }
              as: VesselOperator
              as_user_id: "${op_id}"
              captures: { v2_id: $.data.id }
            - call: "PATCH /observer-program/vessels/${v1_id}"
              payload: { status: "ACTIVE" }
              as: ProgramAdmin
            - call: "PATCH /observer-program/vessels/${v2_id}"
              payload: { status: "ACTIVE" }
              as: ProgramAdmin
            - call: "POST /observer-program/coverage-plans"
              payload: { fishery_id: "${fish_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-31T00:00:00Z", projected_fleet_effort_days: 200, projected_em_effort_days: 0 }
              as: ProgramCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /observer-program/coverage-plans/${plan_id}/publish"
              payload: {}
              as: ProgramCoordinator
              captures: { plan_v: $.data.version }
            - call: "POST /observer-program/coverage-plans/${plan_id}/selection-runs"
              payload: { notice_response_deadline: "2026-09-05T00:00:00Z", expected_coverage_plan_version: "${plan_v}" }
              as: ProgramCoordinator
            - call: "GET /observer-program/selection-notices"
              payload: { coverage_plan_id: "${plan_id}", vessel_id: "${v1_id}" }
              as: ProgramCoordinator
              captures: { n1_id: "$.data[0].id" }
            - call: "GET /observer-program/selection-notices"
              payload: { coverage_plan_id: "${plan_id}", vessel_id: "${v2_id}" }
              as: ProgramCoordinator
              captures: { n2_id: "$.data[0].id" }
            - call: "POST /observer-program/selection-notices/${n1_id}/accept"
              payload: {}
              as: VesselOperator
              as_user_id: "${op_id}"
              captures: { n1_v: $.data.version }
            - call: "POST /observer-program/selection-notices/${n2_id}/accept"
              payload: {}
              as: VesselOperator
              as_user_id: "${op_id}"
              captures: { n2_v: $.data.version }
          trigger:
            - call: "POST /observer-program/deployments"
              payload: { selection_notice_id: "${n1_id}", observer_id: "${obs_id}", scheduled_departure_date: "2026-09-10T00:00:00Z", scheduled_return_date: "2026-09-29T00:00:00Z", expected_selection_notice_version: "${n1_v}" }
              as: ProgramCoordinator
              captures: { d_ok: $.data.id, d_ok_planned: $.data.planned_sea_days }
            - call: "POST /observer-program/deployments"
              payload: { selection_notice_id: "${n2_id}", observer_id: "${obs_id}", scheduled_departure_date: "2026-10-10T00:00:00Z", scheduled_return_date: "2026-10-30T00:00:00Z", expected_selection_notice_version: "${n2_v}" }
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
