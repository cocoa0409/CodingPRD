            - call: "POST /order-lines/${lid}/proofs/${pid}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${oid}/price"
              payload: {}
              as: ShopStaff
              captures: { ov: $.data.version }
          trigger:
            - call: "POST /orders/${oid}/confirm"
              payload: { expected_order_version: "${ov} - 1" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_STALE_VERSION (412)"
            - "Order.${oid}.production_status == PRICED"

      - name: receive_stock_clears_low_stock_flag
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.component_available
          - entities.Component.fields.low_stock
        distinguishing_aspect: "A component on_hand 0, reorder_point 2 has low_stock=true; receiving 5 units -> available_qty 5, low_stock=false."
        test_recipe:
          setup: ["Component on_hand 0, reorder_point 2 (low_stock true)."]
          setup_api_calls:
            - call: "POST /components"
              payload: { code: "EC-39", name: "Base", on_hand_qty: 0, reorder_point: 2 }
              as: ShopManager
              captures: { comp_id: $.data.id }
          trigger:
            - call: "POST /components/${comp_id}/receive"
              payload: { received_qty: 5 }
              as: ShopManager
          assert:
            - "Component.${comp_id}.on_hand_qty == 5"
            - "Component.${comp_id}.available_qty == 5"
            - "Component.${comp_id}.low_stock == false"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: confirm_changes_visible_in_same_response_immediate
        claim_type: immediate
        grounds:
          - state_machines.Order.PRICED_to_CONFIRMED
          - entities.Order.fields.invoice_total_cents
        distinguishing_aspect: "The confirm response body itself already shows production_status=CONFIRMED and the locked invoice_total_cents (immediate consistency, no re-read needed)."
        test_recipe:
          setup: ["A PRICED order with line subtotal 4000, STANDARD (no rush, no promo)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: Anonymous
            - call: "POST /rush-policies"
              payload: { name: "std", expedited_surcharge_pct: 0.25, rush_surcharge_pct: 0.50, rush_min_business_days: 1, active: true }
              as: ShopManager
            - call: "POST /components"
              payload: { code: "EC-40", name: "Base", on_hand_qty: 10 }
              as: ShopManager
              captures: { comp_id: $.data.id }
            - call: "POST /catalog-products"
              payload: { sku: "EP-40", name: "Plaque", product_type: "PLAQUE", base_price_cents: 4000, engraving_price_per_char_cents: 0, logo_setup_fee_cents: 0, standard_lead_days: 3, bom: [{ component_id: "${comp_id}", qty_per_unit: 1 }] }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "e40@x.com", full_name: "E Forty" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_level: "STANDARD", due_date: "2026-07-15T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/lines"
              payload: { catalog_product_id: "${prod_id}", quantity: 1 }
