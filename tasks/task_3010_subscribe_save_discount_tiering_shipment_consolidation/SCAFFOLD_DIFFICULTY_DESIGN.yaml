              payload: { product_id: "${i1_prod}", region: "US-WEST" }
              as: PlatformAdmin
              captures: { i1_pl: $.data.id }
            - call: "POST /sns/inventory-placements/${i1_pl}/receive"
              payload: { units: 50 }
              as: PlatformAdmin
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${i1_cust}", product_id: "${i1_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${i1_cust}"
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${i1_cust}", product_id: "${i1_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${i1_cust}"
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${i1_cust}", product_id: "${i1_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${i1_cust}"
            - call: "POST /sns/ops/generate-plans"
              payload: { delivery_month: "2026-09" }
              as: PlatformAdmin
              captures: { i1_plan: "$.data[0].id" }
            - call: "POST /sns/delivery-plans/${i1_plan}/lock"
              payload: {}
              as: Customer
              as_user_id: "${i1_cust}"
            - call: "POST /sns/delivery-plans/${i1_plan}/ship"
              payload: {}
              as: PlatformAdmin
            - call: "POST /sns/delivery-plans/${i1_plan}/mark-delivered"
              payload: {}
              as: PlatformAdmin
            - call: "GET /sns/delivery-plans/${i1_plan}/lines"
              payload: {}
              as: Customer
              as_user_id: "${i1_cust}"
              captures: { i1_line: "$.data[0].id" }
            - call: "POST /sns/delivery-plans/${i1_plan}/damage-claims"
              payload: { damaged_line_ids: ["${i1_line}"] }
              as: Customer
              as_user_id: "${i1_cust}"
              captures: { i1_claim: $.data.id }
          trigger:
            - call: "POST /sns/damage-claims/${i1_claim}/review"
              payload: { decision: "APPROVE_REFUND" }
              as: SupportAgent
          assert:
            - "DamageClaim.${i1_claim}.claim_status == COMPLETED and claim_refund_cents == 950"
            - "PlanLine.${i1_line}.line_status == REFUNDED"
            - "DeliveryPlan.${i1_plan}.refunded_total_cents == 950"
            - "DeliveryPlan.${i1_plan}.gross_line_total_cents == 2850"
            - "invariant holds: 2 * 950 (SHIPPED) + 950 (refunded) == 2850 == gross_line_total_cents"

      - name: inventory_conservation_across_receive_lock_ship_reship
        grounds:
          - calculations.inventory_conservation
          - entities.InventoryPlacement.fields.on_hand_units
          - entities.InventoryPlacement.fields.reserved_units
          - entities.InventoryPlacement.fields.shipped_units
        distinguishing_aspect: |
          Conserved quantity: physical units (not money). Receive 10; lock
          reserves 4 (6/4/0); ship releases them (6/0/4); a reship dispatch moves
          4 more from on-hand (2/0/8) — at every stage
          on_hand + reserved + shipped == received_total == 10 exactly.
        test_recipe:
          setup:
            - "Logical clock default. Customer, product price 1000, placement received 10 units."
            - "One subscription qty 4; plan generated and locked (reserve 4), shipped (4 shipped), delivered; damage claim APPROVE_RESHIP for the line."
          setup_api_calls:
            - *d1_clock
            - &i2_cust
              call: "POST /sns/customers"
              payload: { email: "ci2@x.com", full_name: "Ci Two", region: "US-WEST", preferred_delivery_day: 10 }
