# =============================================================================
# PRD Benchmark Scaffold — Yoga & Pilates Studio (Mindbody-powered)
# Difficulty: Expert
# =============================================================================

scenario: |
  Yoga & Pilates Studio (Mindbody-powered): class schedule & reformer/mat capacity,
  membership/class-pack & auto-renew, reservation & waitlist auto-promote,
  late-cancel/no-show fee, intro offer & new-student, teacher & room scheduling,
  workshop/teacher-training, freeze/rollover

domain_name: yoga-pilates-studio
api_prefix: /

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota / allocation
  secondary_archetype: temporal windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions          # logical clock; late-cancel window, freeze windows, ops-run promotion

  entity_topology: flat
  # Peer entities linked by FK (Member, Teacher, Room, ClassSession, Reservation,
  # Entitlement, Workshop, Enrollment, FeeCharge, IntroOffer). No nesting in URL paths.

  state_machine_shape: parallel
  # Reservation has a cyclic waitlist loop (WAITLISTED <-> BOOKED). Entitlement carries
  # parallel state dimensions (lifecycle_status x freeze_status). ClassSession is compound
  # (capacity posture derived from children). Enrollment is branching (apply -> {confirmed, waitlisted} -> ...).

  relationship_patterns:
    - one_to_many                # Member -> Reservation, Member -> Entitlement, ClassSession -> Reservation
    - cross_aggregate            # Reservation references ClassSession AND Entitlement AND Member
    - self_referential           # ClassSession.recurrence_parent_id references another ClassSession

  role_model: peer_roles
  # Member owns own reservations/entitlements; Instructor owns own taught sessions;
  # StudioManager configures schedule, rooms, offers, runs ops; opaque ops role.

  consistency_model: immediate

# =============================================================================
# Studio-wide constants (pinned; referenced by §1.2 / §1.3 / §1.4)
# =============================================================================
studio_constants:
  CYCLE_LENGTH_DAYS: 30                 # MEMBERSHIP billing cycle length
  DAYS_PER_MONTH: 30                    # daily-rate denominator for renewal proration
  LATE_CANCEL_WINDOW_HOURS: 12          # cancel at/after start_utc - 12h is LATE
  LATE_CANCEL_BASE_CENTS: 1500          # base late-cancel fee
  NO_SHOW_BASE_CENTS: 2500              # base no-show fee
  REPEAT_OFFENDER_TIER1: 2              # >= 2 prior strikes -> +25% surcharge
  REPEAT_OFFENDER_TIER2: 4              # >= 4 prior strikes -> +50% surcharge
  SURCHARGE_TIER1_PCT: 0.25
  SURCHARGE_TIER2_PCT: 0.50
  NO_SHOW_SUSPEND_THRESHOLD: 3          # no_show_strike_count >= 3 -> account SUSPENDED
  STRIKE_WINDOW_DAYS: 90               # rolling window after which strikes reset on ops run
  FREEZE_MAX_DAYS_PER_CYCLE: 21         # max cumulative FROZEN days per cycle
  WORKSHOP_BUFFER_MINUTES: 30           # required clear buffer on each side of a workshop in a room

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Login email; unique across Members" }
      - { name: full_name, type: string, source: input, description: "Member display name" }
      - { name: home_studio_state, type: string, source: input, description: "Two-letter state code, e.g. CA" }
      - { name: is_new_student, type: boolean, source: computed, description: "True until the member completes a first BOOKED reservation that transitions to ATTENDED, or redeems an intro offer; gates IntroOffer eligibility", default: true }
      - { name: lifetime_attended_count, type: integer, source: computed, description: "Count of this member's Reservations in ATTENDED state; drives is_new_student flip", default: 0 }
      - { name: no_show_strike_count, type: integer, source: computed, description: "Rolling count of NO_SHOW reservations in the current strike window; resets via ops run", default: 0 }
      - { name: account_status, type: enum, source: computed, description: "ACTIVE | SUSPENDED. SUSPENDED blocks new reservations", default: "ACTIVE", constraints: "ACTIVE | SUSPENDED" }
      - { name: outstanding_fee_cents, type: integer, source: computed, description: "Sum of FeeCharge.amount_cents for this member whose status==UNPAID", default: 0 }

  - name: Room
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Room name, e.g. Reformer Studio A" }
      - { name: room_type, type: enum, source: input, description: "REFORMER (equipment stations) | MAT (open floor)", constraints: "REFORMER | MAT" }
      - { name: station_capacity, type: integer, source: input, description: "Hard physical capacity: number of reformer stations (REFORMER) or mat spots (MAT)", constraints: ">= 1" }
      - { name: status, type: enum, source: computed, description: "OPEN | CLOSED. CLOSED rooms cannot host newly scheduled sessions", default: "OPEN", constraints: "OPEN | CLOSED" }

  - name: Teacher
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Teacher display name" }
      - { name: certifications, type: array, source: input, description: "Array of discipline strings the teacher may lead, e.g. [VINYASA, REFORMER]" }
      - { name: status, type: enum, source: computed, description: "ACTIVE | INACTIVE. INACTIVE teachers cannot be assigned to new sessions", default: "ACTIVE", constraints: "ACTIVE | INACTIVE" }

  - name: IntroOffer
    parent: null
    common_fields: true
    # Configuration entity: the studio's published intro/new-student promotion templates.
    fields:
      - { name: name, type: string, source: input, description: "Offer label, e.g. 'Two Weeks Unlimited'" }
      - { name: price_cents, type: integer, source: input, description: "Promotional price an INTRO entitlement costs", constraints: ">= 0" }
      - { name: credits_total, type: integer, source: input, description: "Credits granted by this intro offer (-1 = unlimited within the window)", constraints: ">= -1" }
      - { name: window_days, type: integer, source: input, description: "Validity window length in days from purchase; sets the INTRO entitlement cycle_end", constraints: ">= 1" }
      - { name: status, type: enum, source: computed, description: "ACTIVE | RETIRED. Only ACTIVE offers may be redeemed into new INTRO entitlements", default: "ACTIVE", constraints: "ACTIVE | RETIRED" }

  - name: ClassSession
    parent: null
    common_fields: true
    fields:
      - { name: room_id, type: string, source: input, description: "FK -> Room.id; the room hosting this session" }
      - { name: teacher_id, type: string, source: input, description: "FK -> Teacher.id; the assigned teacher" }
      - { name: recurrence_parent_id, type: string, source: input, description: "FK -> ClassSession.id; null for standalone sessions, else points at the template session this instance was cloned from", default: null }
      - { name: discipline, type: enum, source: input, description: "VINYASA | YIN | REFORMER | MAT_PILATES; must be in teacher.certifications", constraints: "VINYASA | YIN | REFORMER | MAT_PILATES" }
      - { name: start_utc, type: datetime, source: input, description: "Session start (ISO 8601 UTC)" }
      - { name: end_utc, type: datetime, source: input, description: "Session end (ISO 8601 UTC); must be after start_utc" }
      - { name: published_capacity, type: integer, source: input, description: "Bookable spots advertised; must be <= room.station_capacity", constraints: ">= 1" }
      - { name: waitlist_capacity, type: integer, source: input, description: "Maximum number of reservations allowed to be in WAITLISTED state on this session", default: 5, constraints: ">= 0" }
      - { name: status, type: enum, source: computed, description: "SCHEDULED | OPEN | FULL | IN_PROGRESS | COMPLETED | CANCELLED", default: "SCHEDULED", constraints: "SCHEDULED | OPEN | FULL | IN_PROGRESS | COMPLETED | CANCELLED" }
      - { name: booked_count, type: integer, source: computed, description: "Count of Reservations on this session in BOOKED or CHECKED_IN state", default: 0 }
      - { name: waitlisted_count, type: integer, source: computed, description: "Count of Reservations on this session in WAITLISTED state", default: 0 }

  - name: Entitlement
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the owning member" }
      - { name: kind, type: enum, source: input, description: "MEMBERSHIP (recurring, unlimited or capped per cycle) | CLASS_PACK (fixed credit bundle) | INTRO (single-window new-student offer)", constraints: "MEMBERSHIP | CLASS_PACK | INTRO" }
      - { name: intro_offer_id, type: string, source: input, description: "FK -> IntroOffer.id; required when kind==INTRO (the redeemed offer template), null otherwise", default: null }
      - { name: price_cents, type: integer, source: input, description: "Purchase price in cents", constraints: ">= 0" }
      - { name: credits_total, type: integer, source: input, description: "Total bookable credits granted at purchase; for unlimited MEMBERSHIP set to -1 (sentinel = unlimited)", constraints: ">= -1" }
      - { name: credits_used, type: integer, source: computed, description: "Credits consumed by BOOKED/CHECKED_IN/ATTENDED reservations charged to this entitlement", default: 0 }
      - { name: credits_remaining, type: integer, source: computed, description: "credits_total - credits_used for finite packs; -1 (unlimited) for unlimited MEMBERSHIP", default: 0 }
      - { name: cycle_start_utc, type: datetime, source: input, description: "Start of the current billing/validity cycle" }
      - { name: cycle_end_utc, type: datetime, source: computed, description: "End of the current cycle; auto-renew clones forward from here for MEMBERSHIP" }
      - { name: auto_renew, type: boolean, source: input, description: "If true, a MEMBERSHIP auto-renews at cycle_end via ops run", default: false }
      - { name: rollover_cap, type: integer, source: input, description: "Max credits a CLASS_PACK/MEMBERSHIP may carry into the next cycle on renewal; excess is forfeited", default: 0, constraints: ">= 0" }
      - { name: lifecycle_status, type: enum, source: computed, description: "PENDING | ACTIVE | EXPIRED | CANCELLED — lifecycle dimension", default: "PENDING", constraints: "PENDING | ACTIVE | EXPIRED | CANCELLED" }
      - { name: freeze_status, type: enum, source: computed, description: "UNFROZEN | FROZEN — independent freeze dimension; FROZEN extends cycle_end on thaw", default: "UNFROZEN", constraints: "UNFROZEN | FROZEN" }
      - { name: frozen_at_utc, type: datetime, source: computed, description: "Clock time the current freeze began; null when UNFROZEN", default: null }
      - { name: frozen_days_consumed, type: integer, source: computed, description: "Cumulative days this entitlement has spent FROZEN; counts against FREEZE_MAX_DAYS_PER_CYCLE", default: 0 }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the booking member" }
      - { name: class_session_id, type: string, source: input, description: "FK -> ClassSession.id; the session being booked" }
      - { name: entitlement_id, type: string, source: input, description: "FK -> Entitlement.id; the entitlement charged for this booking" }
      - { name: status, type: enum, source: computed, description: "BOOKED | WAITLISTED | CHECKED_IN | ATTENDED | CANCELLED_EARLY | CANCELLED_LATE | NO_SHOW", default: "BOOKED", constraints: "BOOKED | WAITLISTED | CHECKED_IN | ATTENDED | CANCELLED_EARLY | CANCELLED_LATE | NO_SHOW" }
      - { name: waitlist_position, type: integer, source: computed, description: "1-based queue position while WAITLISTED; null otherwise; promotion is strictly by ascending position", default: null }
      - { name: credit_charged, type: boolean, source: computed, description: "True once a credit was debited from the entitlement for this reservation", default: false }
      - { name: booked_at_utc, type: datetime, source: system, description: "Logical-clock time the reservation entered BOOKED (or WAITLISTED); drives waitlist ordering and late-cancel window" }

  - name: FeeCharge
    parent: null
    common_fields: false
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the charged member" }
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; the reservation that triggered the fee" }
      - { name: fee_type, type: enum, source: system, description: "LATE_CANCEL | NO_SHOW", constraints: "LATE_CANCEL | NO_SHOW" }
      - { name: amount_cents, type: integer, source: system, description: "Computed fee amount in cents (see fee_assessment calculation)" }
      - { name: status, type: enum, source: computed, description: "UNPAID | PAID | WAIVED", default: "UNPAID", constraints: "UNPAID | PAID | WAIVED" }

  - name: Workshop
    parent: null
    common_fields: true
    fields:
      - { name: room_id, type: string, source: input, description: "FK -> Room.id; the room hosting the workshop" }
      - { name: lead_teacher_id, type: string, source: input, description: "FK -> Teacher.id; the lead teacher" }
      - { name: title, type: string, source: input, description: "Workshop title" }
      - { name: kind, type: enum, source: input, description: "WORKSHOP (single event) | TEACHER_TRAINING (multi-day cohort)", constraints: "WORKSHOP | TEACHER_TRAINING" }
      - { name: start_utc, type: datetime, source: input, description: "Workshop start (ISO 8601 UTC)" }
      - { name: end_utc, type: datetime, source: input, description: "Workshop end (ISO 8601 UTC); must be after start_utc" }
      - { name: seat_capacity, type: integer, source: input, description: "Total enrollable seats; must be <= room.station_capacity", constraints: ">= 1" }
      - { name: deposit_cents, type: integer, source: input, description: "Non-refundable deposit charged at enrollment confirmation", constraints: ">= 0" }
      - { name: price_cents, type: integer, source: input, description: "Full workshop price in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: computed, description: "DRAFT | OPEN | FULL | CLOSED | CANCELLED", default: "DRAFT", constraints: "DRAFT | OPEN | FULL | CLOSED | CANCELLED" }
      - { name: confirmed_seat_count, type: integer, source: computed, description: "Count of Enrollments in CONFIRMED state", default: 0 }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the enrolling member" }
      - { name: workshop_id, type: string, source: input, description: "FK -> Workshop.id; the workshop" }
      - { name: status, type: enum, source: computed, description: "APPLIED | CONFIRMED | WAITLISTED | WITHDRAWN | CANCELLED_BY_STUDIO", default: "APPLIED", constraints: "APPLIED | CONFIRMED | WAITLISTED | WITHDRAWN | CANCELLED_BY_STUDIO" }
      - { name: deposit_paid_cents, type: integer, source: computed, description: "Deposit captured at confirmation; non-refundable on member withdrawal, refundable on studio cancellation", default: 0 }
      - { name: balance_due_cents, type: integer, source: computed, description: "price_cents - deposit_paid_cents while CONFIRMED; 0 otherwise", default: 0 }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # --- ClassSession: compound (capacity posture derived from child reservations) ---
  - entity: ClassSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /class-sessions/{id}/publish"
        actor: StudioManager
        preconditions:
          - "session.status == SCHEDULED"
          - "room.status == OPEN"
          - "teacher.status == ACTIVE"
          - "session.discipline IN teacher.certifications"
          - "no other non-CANCELLED ClassSession on the same room_id overlaps [start_utc, end_utc) (half-open)"
        side_effects:
          - "set status = OPEN; bookings now permitted"
      - from: OPEN
        to: FULL
        trigger: "system: booked_count reaches published_capacity"
        actor: system
        preconditions: ["booked_count == published_capacity"]
        side_effects: ["set status = FULL; further bookings route to waitlist"]
      - from: FULL
        to: OPEN
        trigger: "system: a BOOKED reservation cancels and no waitlist promotion fills the freed seat"
        actor: system
        preconditions: ["booked_count < published_capacity", "waitlisted_count == 0"]
        side_effects: ["set status = OPEN"]
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /class-sessions/{id}/start"
        actor: StudioManager
        preconditions: ["session.status IN {OPEN, FULL}", "logical clock >= start_utc"]
        side_effects: ["set status = IN_PROGRESS; check-in window opens; new bookings rejected"]
      - from: FULL
        to: IN_PROGRESS
        trigger: "POST /class-sessions/{id}/start"
        actor: StudioManager
        preconditions: ["session.status IN {OPEN, FULL}", "logical clock >= start_utc"]
        side_effects: ["set status = IN_PROGRESS; check-in window opens"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /class-sessions/{id}/complete"
        actor: StudioManager
        preconditions: ["session.status == IN_PROGRESS"]
        side_effects:
          - "every Reservation still in CHECKED_IN -> ATTENDED (credit_charged stays true; member.lifetime_attended_count += 1; member.is_new_student may flip to false)"
          - "every Reservation still in BOOKED -> NO_SHOW (cascade: a FeeCharge(NO_SHOW) is created; member.no_show_strike_count += 1; entitlement credit is NOT refunded)"
          - "every Reservation still in WAITLISTED -> CANCELLED_EARLY (no credit was charged; nothing to refund)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /class-sessions/{id}/cancel"
        actor: StudioManager
        preconditions: ["session.status IN {SCHEDULED, OPEN, FULL}"]
        side_effects: ["set status = CANCELLED"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /class-sessions/{id}/cancel"
        actor: StudioManager
        preconditions: ["session.status IN {SCHEDULED, OPEN, FULL}"]
        side_effects:
          - "every BOOKED/WAITLISTED/CHECKED_IN Reservation -> CANCELLED_EARLY (studio-initiated)"
          - "cascade: each refunded reservation that had credit_charged==true returns its credit to its entitlement (entitlement.credits_used -= 1); no late-cancel/no-show fee is assessed for studio cancellation"
      - from: FULL
        to: CANCELLED
        trigger: "POST /class-sessions/{id}/cancel"
        actor: StudioManager
        preconditions: ["session.status IN {SCHEDULED, OPEN, FULL}"]
        side_effects:
          - "every BOOKED/WAITLISTED/CHECKED_IN Reservation -> CANCELLED_EARLY"
          - "cascade: credit-charged reservations refund their credit to the owning entitlement"

  # --- Reservation: cyclic waitlist loop (WAITLISTED <-> BOOKED) + branching outcomes ---
  - entity: Reservation
    initial_state: BOOKED
    terminal_states: [ATTENDED, CANCELLED_EARLY, CANCELLED_LATE, NO_SHOW]
    transitions:
      - from: BOOKED
        to: WAITLISTED
        trigger: "POST /reservations (when session is FULL at booking time)"
        actor: Member
        preconditions: ["session.status == FULL", "session.waitlisted_count < session.waitlist_capacity"]
        note: "Initial create lands directly in WAITLISTED; modeled as BOOKED->WAITLISTED for the state graph."
        side_effects:
          - "assign waitlist_position = session.waitlisted_count + 1"
          - "credit is HELD: entitlement.credits_used += 1; credit_charged = true (held until promotion or cancel)"
      - from: WAITLISTED
        to: BOOKED
        trigger: "system: auto-promote when a BOOKED seat frees (cancel or session capacity increase) or ops run"
        actor: system
        preconditions: ["session.booked_count < session.published_capacity", "this reservation has the lowest waitlist_position among WAITLISTED on the session"]
        side_effects:
          - "set status = BOOKED; waitlist_position = null; credit remains charged"
          - "every remaining WAITLISTED reservation on the session decrements waitlist_position by 1 (cascade: re-pack the queue)"
      - from: BOOKED
        to: WAITLISTED
        trigger: "system: session capacity reduced below booked_count demotes the highest-position BOOKED holders"
        actor: system
        preconditions: ["session.booked_count > session.published_capacity", "this reservation is the most-recently-booked over-capacity holder (latest booked_at_utc; tie-break created_at ASC)"]
        side_effects: ["set status = WAITLISTED; assign waitlist_position at the head of the queue (position 1, existing waitlist shifts down)"]
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /reservations/{id}/check-in"
        actor: Member
        preconditions: ["reservation.status == BOOKED", "session.status == IN_PROGRESS"]
        side_effects: ["set status = CHECKED_IN"]
      - from: CHECKED_IN
        to: ATTENDED
        trigger: "system: session completes"
        actor: system
        preconditions: ["session.status transitioning to COMPLETED"]
        side_effects: ["member.lifetime_attended_count += 1; if lifetime_attended_count >= 1 then member.is_new_student = false"]
      - from: BOOKED
        to: NO_SHOW
        trigger: "system: session completes with reservation still BOOKED"
        actor: system
        preconditions: ["session.status transitioning to COMPLETED", "reservation.status == BOOKED"]
        side_effects:
          - "create FeeCharge(fee_type=NO_SHOW, status=UNPAID); member.outstanding_fee_cents += amount_cents"
          - "member.no_show_strike_count += 1 (cascade: if no_show_strike_count >= NO_SHOW_SUSPEND_THRESHOLD then member.account_status = SUSPENDED)"
          - "credit is forfeited (not refunded)"
      - from: BOOKED
        to: CANCELLED_EARLY
        trigger: "POST /reservations/{id}/cancel (outside the late window)"
        actor: Member
        preconditions: ["reservation.status == BOOKED", "logical clock < session.start_utc - LATE_CANCEL_WINDOW_HOURS"]
        side_effects:
          - "refund credit: entitlement.credits_used -= 1; credit_charged = false"
          - "cascade: auto-promote the head of this session's waitlist (WAITLISTED->BOOKED), which re-packs remaining waitlist positions; if the promoted res fills the last open seat the session returns to FULL"
      - from: WAITLISTED
        to: CANCELLED_EARLY
        trigger: "POST /reservations/{id}/cancel"
        actor: Member
        preconditions: ["reservation.status == WAITLISTED"]
        side_effects:
          - "refund held credit: entitlement.credits_used -= 1; credit_charged = false"
          - "cascade: every WAITLISTED reservation behind this one decrements waitlist_position by 1"
      - from: BOOKED
        to: CANCELLED_LATE
        trigger: "POST /reservations/{id}/cancel (inside the late window)"
        actor: Member
        preconditions: ["reservation.status == BOOKED", "logical clock >= session.start_utc - LATE_CANCEL_WINDOW_HOURS", "session.status IN {OPEN, FULL}"]
        side_effects:
          - "create FeeCharge(fee_type=LATE_CANCEL, status=UNPAID); member.outstanding_fee_cents += amount_cents"
          - "credit is forfeited (NOT refunded) on a late cancel"
          - "cascade: auto-promote the head of this session's waitlist (WAITLISTED->BOOKED) into the freed seat and re-pack remaining positions"

  # --- Entitlement: parallel dimensions (lifecycle_status x freeze_status) ---
  - entity: Entitlement
    initial_state: PENDING
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /entitlements/{id}/activate"
        actor: StudioManager
        preconditions: ["lifecycle_status == PENDING", "logical clock >= cycle_start_utc"]
        side_effects: ["set lifecycle_status = ACTIVE; entitlement becomes chargeable for reservations"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: ops run finds logical clock >= cycle_end_utc and (auto_renew==false OR kind != MEMBERSHIP)"
        actor: system
        preconditions: ["lifecycle_status == ACTIVE", "freeze_status == UNFROZEN", "logical clock >= cycle_end_utc"]
        side_effects: ["set lifecycle_status = EXPIRED; unused finite credits are forfeited (not rolled unless renewed)"]
      - from: ACTIVE
        to: ACTIVE
        trigger: "system: ops run renews an auto_renew MEMBERSHIP at cycle_end"
        actor: system
        preconditions: ["lifecycle_status == ACTIVE", "freeze_status == UNFROZEN", "kind == MEMBERSHIP", "auto_renew == true", "logical clock >= cycle_end_utc"]
        note: "Self-loop renewal — cyclic. Cycle advances; rollover applies."
        side_effects:
          - "advance cycle_start_utc = old cycle_end_utc; cycle_end_utc = new cycle_start + CYCLE_LENGTH_DAYS"
          - "rollover: carry min(credits_remaining, rollover_cap) credits into the new cycle, reset credits_used so credits_remaining = credits_total + carried; excess forfeited"
          - "frozen_days_consumed reset to 0 for the new cycle"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /entitlements/{id}/cancel"
        actor: Member
        preconditions: ["lifecycle_status == ACTIVE"]
        side_effects: ["set lifecycle_status = CANCELLED; auto_renew = false; future reservations against it are rejected; existing BOOKED reservations are unaffected"]
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /entitlements/{id}/freeze"
        actor: Member
        preconditions: ["lifecycle_status == ACTIVE", "freeze_status == UNFROZEN", "frozen_days_consumed < FREEZE_MAX_DAYS_PER_CYCLE"]
        note: "freeze_status dimension flips independently of lifecycle_status."
        side_effects: ["set freeze_status = FROZEN; frozen_at_utc = logical clock; new reservations against this entitlement are rejected while FROZEN"]
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /entitlements/{id}/thaw"
        actor: Member
        preconditions: ["lifecycle_status == ACTIVE", "freeze_status == FROZEN"]
        note: "Thaw extends the cycle by the frozen duration (freeze/rollover)."
        side_effects:
          - "let frozen_days = ceil((clock - frozen_at_utc) / 1 day), capped so frozen_days_consumed + frozen_days <= FREEZE_MAX_DAYS_PER_CYCLE"
          - "cycle_end_utc += frozen_days (days); frozen_days_consumed += frozen_days; freeze_status = UNFROZEN; frozen_at_utc = null"

  # --- Workshop: branching (DRAFT->OPEN->{FULL}->CLOSED) with cancellation fork ---
  - entity: Workshop
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /workshops/{id}/publish"
        actor: StudioManager
        preconditions:
          - "workshop.status == DRAFT"
          - "room.status == OPEN"
          - "lead_teacher.status == ACTIVE"
          - "no non-CANCELLED Workshop on the same room overlaps [start_utc, end_utc) AND no non-CANCELLED ClassSession on the same room overlaps [start_utc, end_utc) (buffer-inclusive: a WORKSHOP_BUFFER_MINUTES gap is required on each side)"
        side_effects: ["set status = OPEN; enrollments accepted"]
      - from: OPEN
        to: FULL
        trigger: "system: confirmed_seat_count reaches seat_capacity"
        actor: system
        preconditions: ["confirmed_seat_count == seat_capacity"]
        side_effects: ["set status = FULL; new APPLIED enrollments route to WAITLISTED"]
      - from: FULL
        to: OPEN
        trigger: "system: a CONFIRMED enrollment withdraws and a waitlisted enrollment cannot fill it"
        actor: system
        preconditions: ["confirmed_seat_count < seat_capacity"]
        side_effects: ["set status = OPEN"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /workshops/{id}/close"
        actor: StudioManager
        preconditions: ["workshop.status IN {OPEN, FULL}", "logical clock >= end_utc"]
        side_effects: ["set status = CLOSED; remaining APPLIED/WAITLISTED enrollments -> WITHDRAWN"]
      - from: FULL
        to: CLOSED
        trigger: "POST /workshops/{id}/close"
        actor: StudioManager
        preconditions: ["workshop.status IN {OPEN, FULL}", "logical clock >= end_utc"]
        side_effects: ["set status = CLOSED"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /workshops/{id}/cancel"
        actor: StudioManager
        preconditions: ["workshop.status IN {DRAFT, OPEN, FULL}"]
        side_effects: ["set status = CANCELLED"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /workshops/{id}/cancel"
        actor: StudioManager
        preconditions: ["workshop.status IN {DRAFT, OPEN, FULL}"]
        side_effects:
          - "every CONFIRMED Enrollment -> CANCELLED_BY_STUDIO (cascade: deposit_paid_cents refunded to member; member.outstanding_fee_cents unaffected)"
          - "every APPLIED/WAITLISTED Enrollment -> CANCELLED_BY_STUDIO (no deposit was captured)"

  # --- Enrollment: branching apply -> {CONFIRMED, WAITLISTED} -> terminal ---
  - entity: Enrollment
    initial_state: APPLIED
    terminal_states: [WITHDRAWN, CANCELLED_BY_STUDIO]
    transitions:
      - from: APPLIED
        to: CONFIRMED
        trigger: "POST /enrollments/{id}/confirm"
        actor: Member
        preconditions: ["enrollment.status == APPLIED", "workshop.status == OPEN", "workshop.confirmed_seat_count < workshop.seat_capacity"]
        side_effects:
          - "capture deposit: deposit_paid_cents = workshop.deposit_cents; balance_due_cents = workshop.price_cents - deposit_cents"
          - "workshop.confirmed_seat_count += 1 (cascade: if reaches seat_capacity, workshop -> FULL)"
      - from: APPLIED
        to: WAITLISTED
        trigger: "POST /enrollments/{id}/confirm (when workshop FULL)"
        actor: Member
        preconditions: ["enrollment.status == APPLIED", "workshop.status == FULL"]
        side_effects: ["set status = WAITLISTED; no deposit captured"]
      - from: WAITLISTED
        to: CONFIRMED
        trigger: "system: a CONFIRMED enrollment withdraws, freeing a seat"
        actor: system
        preconditions: ["workshop.confirmed_seat_count < workshop.seat_capacity", "this enrollment is the earliest-created WAITLISTED on the workshop (created_at ASC)"]
        side_effects: ["capture deposit; balance_due_cents recomputed; workshop.confirmed_seat_count += 1"]
      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/withdraw"
        actor: Member
        preconditions: ["enrollment.status == CONFIRMED"]
        side_effects:
          - "deposit_paid_cents is NOT refunded (member-initiated withdrawal); balance_due_cents = 0"
          - "workshop.confirmed_seat_count -= 1 (cascade: auto-promote earliest WAITLISTED enrollment to CONFIRMED, capturing its deposit; if none, workshop FULL -> OPEN)"
      - from: APPLIED
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/withdraw"
        actor: Member
        preconditions: ["enrollment.status == APPLIED"]
        side_effects: ["set status = WITHDRAWN; no deposit involved"]
      - from: WAITLISTED
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/withdraw"
        actor: Member
        preconditions: ["enrollment.status == WAITLISTED"]
        side_effects: ["set status = WITHDRAWN; no deposit involved"]

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: reservation-create-stale-session
    parent_entity: ClassSession
    write_endpoint: "POST /reservations"
    occ_field: "expected_class_session_version"
    description: |
      Booking a Reservation against a ClassSession whose version has advanced
      since the client last observed it is rejected. The last open seat is a
      finite resource: another writer may have just booked it (legitimately
      moving the session OPEN->FULL and bumping its version), so the current
      writer's view of remaining capacity is stale. The OCC check rejects the
      booking when the supplied expected version no longer matches.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: enrollment-confirm-stale-workshop
    parent_entity: Workshop
    write_endpoint: "POST /enrollments/{id}/confirm"
    occ_field: "expected_workshop_version"
    description: |
      Confirming an Enrollment against a Workshop whose version has advanced
      since the client last read it is rejected. The last confirmable seat is
      finite; another writer may have just confirmed it (moving the workshop
      OPEN->FULL and bumping version). When the supplied expected version no
      longer matches the workshop's current version, the confirm is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  # (Rule 1 dual-variant instance A — fee accounting on a Reservation/Member)
  - name: fee_assessment
    trigger: "Reservation BOOKED->CANCELLED_LATE (late cancel) and Reservation BOOKED->NO_SHOW (session complete)"
    algorithm: threshold
    formula: |
      base = (fee_type == NO_SHOW) ? NO_SHOW_BASE_CENTS : LATE_CANCEL_BASE_CENTS
      # Repeat-offender surcharge keyed on the member's strike tier:
      #   strikes_before_this = member.no_show_strike_count measured BEFORE this event increments it
      if strikes_before_this >= REPEAT_OFFENDER_TIER2:        # >= 4
        surcharge = base * SURCHARGE_TIER2_PCT                 # +50%
      elif strikes_before_this >= REPEAT_OFFENDER_TIER1:      # >= 2
        surcharge = base * SURCHARGE_TIER1_PCT                 # +25%
      else:
        surcharge = 0
      # Intro/new-student grace: a member still flagged is_new_student pays no late/no-show fee
      if member.is_new_student == true:
        amount_cents = 0
      else:
        amount_cents = round_half_up(base + surcharge)        # to whole cents
    input_set: "Single Reservation event; member.no_show_strike_count read at the instant before its increment; member.is_new_student read at event time"
    constants:
      LATE_CANCEL_BASE_CENTS: 1500
      NO_SHOW_BASE_CENTS: 2500
      REPEAT_OFFENDER_TIER1: 2
      REPEAT_OFFENDER_TIER2: 4
      SURCHARGE_TIER1_PCT: 0.25
      SURCHARGE_TIER2_PCT: 0.50
    precision: "whole cents, round_half_up"
    variants:
      - name: late_cancel_assessment
        when: "BOOKED->CANCELLED_LATE inside LATE_CANCEL_WINDOW_HOURS"
        difference: "base = LATE_CANCEL_BASE_CENTS; the strikes_before_this tier still uses no_show_strike_count even though a late cancel itself does not increment no_show_strike_count"
      - name: no_show_assessment
        when: "BOOKED->NO_SHOW at session completion"
        difference: "base = NO_SHOW_BASE_CENTS; this event DOES increment no_show_strike_count after the amount is read"

  # (Rule 1 dual-variant instance B — entitlement valuation/refund on an Entitlement, a different entity domain)
  - name: entitlement_refund_value
    trigger: "Reservation cancellation paths and ClassSession cancellation cascade compute the credit value returned to an Entitlement"
    algorithm: aggregation
    formula: |
      # Two valid valuations of the same cancelled reservation produce DIFFERENT results:
      #   PROVISIONAL (member-facing display, used at early-cancel time): refund 1 whole credit.
      #   FINAL (studio reconciliation at ops run / studio-initiated cancel): refund the
      #     pro-rated cash value of the credit so the member's pack value is conserved.
      provisional_credits_refunded = 1
      # final cash value of one credit on a finite pack:
      if entitlement.credits_total > 0:
        per_credit_cents = round_half_up(entitlement.price_cents / entitlement.credits_total)
      else:
        per_credit_cents = 0        # unlimited membership: credits are not cash-valued
      final_refund_cents = per_credit_cents       # studio-cancel refunds cash, member-cancel refunds the credit
    input_set: "One Entitlement (price_cents, credits_total) plus the cancellation context (member vs studio initiated)"
    constants: {}
    precision: "whole cents, round_half_up; credits are integer"
    variants:
      - name: provisional_credit_refund
        when: "Member early-cancels a Reservation (BOOKED->CANCELLED_EARLY / WAITLISTED->CANCELLED_EARLY)"
        difference: "returns exactly 1 credit to credits_used; no cash moves"
      - name: final_cash_refund
        when: "Studio cancels the ClassSession (cascade), refunding cash value instead of credit"
        difference: "returns round_half_up(price_cents / credits_total) cents per affected reservation; for unlimited memberships (credits_total == -1) the cash refund is 0"

  # (Rule 2 mode (b) — nested rounding where order matters: pinned order = per-line then sum)
  - name: membership_renewal_proration
    trigger: "Entitlement ACTIVE->ACTIVE auto-renew at cycle_end via ops run, when the renewal spans a mid-cycle price change"
    algorithm: tiered_pricing
    formula: |
      # A renewal may straddle two price segments (old monthly rate, new monthly rate) within
      # the renewing cycle. Charge is computed PER SEGMENT then summed (round-per-segment, THEN sum):
      #   segment_charge[i] = round_half_up(segment_days[i] * daily_rate[i])
      #   renewal_total_cents = sum_i segment_charge[i]
      # This is DISTINCT from sum-then-round; the scaffold PINS round-per-segment-then-sum.
      daily_rate[i] = monthly_rate_cents[i] / DAYS_PER_MONTH
      # rollover credit value is applied as a credit AFTER the cash total is computed (evaluation order pinned):
      net_charge_cents = renewal_total_cents
    input_set: "Renewing MEMBERSHIP Entitlement; ordered price segments within the new cycle (each: segment_days, monthly_rate_cents)"
    constants:
      DAYS_PER_MONTH: 30
      CYCLE_LENGTH_DAYS: 30
    precision: "whole cents, round_half_up PER SEGMENT, then integer-sum the segment charges"
    variants:
      - name: single_segment_renewal
        when: "no price change spans the renewal cycle"
        difference: "one segment; segment_days = CYCLE_LENGTH_DAYS"
      - name: split_segment_renewal
        when: "a price change date falls strictly inside the renewal cycle"
        difference: "two segments; each rounded independently then summed — differs from sum-then-round by up to 1 cent"

  # (Rule 2 mode (a) — formula with >=3 inputs, nested min/max + conditional branch on entity state)
  - name: bookable_capacity_resolution
    trigger: "POST /reservations evaluates whether a booking lands BOOKED, WAITLISTED, or is rejected"
    algorithm: threshold
    formula: |
      # >=3 inputs (session capacity, room capacity, current bookings) with nested min/max:
      effective_capacity = min(session.published_capacity, room.station_capacity)
      open_seats = max(0, effective_capacity - session.booked_count)
      if session.status == IN_PROGRESS or session.status in {COMPLETED, CANCELLED}:
        reject ERR_SESSION_NOT_BOOKABLE
      elif open_seats >= 1:
        outcome = BOOKED
      elif session.waitlisted_count < session.waitlist_capacity:
        outcome = WAITLISTED
      else:
        reject ERR_WAITLIST_FULL
    input_set: "Target ClassSession + its Room; counts read at booking time"
    constants: {}
    precision: "integer seat counts"
    variants:
      - name: capacity_clamped_by_room
        when: "published_capacity > room.station_capacity (e.g. after a room downgrade)"
        difference: "effective_capacity is clamped to room.station_capacity, so fewer seats are bookable than advertised"
      - name: capacity_from_session
        when: "published_capacity <= room.station_capacity"
        difference: "effective_capacity == published_capacity"

  # (Supports Rule 6 boundary on a time window + threshold; cyclic strike reset)
  - name: late_cancel_window_check
    trigger: "POST /reservations/{id}/cancel classifies the cancel as EARLY vs LATE"
    algorithm: threshold
    formula: |
      cutoff = session.start_utc - LATE_CANCEL_WINDOW_HOURS hours
      if logical_clock < cutoff:
        classification = EARLY        # strictly before cutoff
      else:
        classification = LATE         # at or after cutoff (>= boundary is LATE)
    input_set: "One Reservation's session.start_utc and the current logical clock"
    constants:
      LATE_CANCEL_WINDOW_HOURS: 12
    precision: "instant comparison; boundary instant (clock == cutoff) classifies as LATE"
    variants:
      - name: exact_boundary_is_late
        when: "logical_clock == session.start_utc - 12h exactly"
        difference: "classified LATE (>= cutoff), so a fee is assessed at the exact boundary instant"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc which still requires StudioManager"
  - priority: 2
    category: auth
    check: "Acting role is permitted to perform this operation per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every referenced resource id in the path/body exists (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all id-bearing endpoints"
  - priority: 4
    category: existence
    check: "Acting Member/Instructor owns the resource they target (X-User-ID matches the resource's owning FK)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "member/instructor-scoped writes (reservation cancel/check-in, entitlement freeze/thaw/cancel, enrollment confirm/withdraw)"
  - priority: 5
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: state
    check: "OCC: supplied expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /reservations, POST /enrollments/{id}/confirm"
  - priority: 7
    category: business_safety
    check: "Member account_status is ACTIVE (not SUSPENDED) before accepting a new reservation or enrollment"
    error_id: ERR_MEMBER_SUSPENDED
    http_status: 409
    applies_to: "POST /reservations, POST /enrollments"
  - priority: 8
    category: business_referential
    check: "The charged Entitlement belongs to the booking Member, is lifecycle ACTIVE, and freeze_status UNFROZEN"
    error_id: ERR_ENTITLEMENT_NOT_USABLE
    http_status: 409
    applies_to: "POST /reservations"
  - priority: 9
    category: business_constraint
    check: "Intro/new-student offer: an INTRO entitlement may only be purchased while member.is_new_student == true, must reference an ACTIVE IntroOffer via intro_offer_id, and at most one INTRO per member"
    error_id: ERR_INTRO_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /entitlements (kind=INTRO)"
  - priority: 10
    category: business_constraint
    check: "ClassSession discipline must be in the assigned teacher's certifications and teacher must be ACTIVE at publish"
    error_id: ERR_TEACHER_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /class-sessions/{id}/publish"
  - priority: 11
    category: business_temporal
    check: "Publishing a ClassSession or Workshop must not create a room time-overlap with another non-CANCELLED occupation (half-open for sessions; buffer-inclusive for workshops)"
    error_id: ERR_ROOM_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /class-sessions/{id}/publish, POST /workshops/{id}/publish"
  - priority: 12
    category: business_temporal
    check: "A teacher may not be assigned to two overlapping non-CANCELLED occupations (ClassSession or Workshop) at publish time"
    error_id: ERR_TEACHER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /class-sessions/{id}/publish, POST /workshops/{id}/publish"
  - priority: 13
    category: business_constraint
    check: "published_capacity must be <= room.station_capacity at session creation/publish; seat_capacity <= room.station_capacity at workshop publish"
    error_id: ERR_CAPACITY_EXCEEDS_ROOM
    http_status: 422
    applies_to: "POST /class-sessions, POST /class-sessions/{id}/publish, POST /workshops/{id}/publish"
  - priority: 14
    category: business_fiscal
    check: "Charging a finite Entitlement requires credits_remaining >= 1 (unlimited MEMBERSHIP exempt)"
    error_id: ERR_NO_CREDITS_REMAINING
    http_status: 409
    applies_to: "POST /reservations"
  - priority: 15
    category: business_constraint
    check: "Waitlist must have room: waitlisted_count < waitlist_capacity when a full session is booked"
    error_id: ERR_WAITLIST_FULL
    http_status: 409
    applies_to: "POST /reservations"
  - priority: 16
    category: business_constraint
    check: "Freeze cap: frozen_days_consumed < FREEZE_MAX_DAYS_PER_CYCLE before a new freeze is permitted"
    error_id: ERR_FREEZE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /entitlements/{id}/freeze"
  - priority: 17
    category: business_temporal
    check: "Booking is only permitted before the session starts (logical clock < session.start_utc) and session not IN_PROGRESS/terminal"
    error_id: ERR_SESSION_NOT_BOOKABLE
    http_status: 409
    applies_to: "POST /reservations"
  - priority: 18
    category: business_constraint
    check: "Request body field types/enums valid and required fields present"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all writes"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Members ----
  - method: POST
    path: "/members"
    description: "Register a member."
    roles: [StudioManager]
    code: 201
    input: [email, full_name, home_studio_state]
    output: Member
    side_effects: ["is_new_student=true; account_status=ACTIVE"]
  - method: GET
    path: "/members/{id}"
    description: "Fetch a member."
    roles: [StudioManager, Member]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: GET
    path: "/members"
    description: "List members (paginated)."
    roles: [StudioManager]
    code: 200
    input: ["email?", "account_status?", "limit?", "offset?"]
    output: Member[]
    side_effects: []
  - method: GET
    path: "/members/{id}/reservations"
    description: "List a member's reservations (reverse-reachability for Reservation.member_id)."
    roles: [StudioManager, Member]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []
  - method: GET
    path: "/members/{id}/entitlements"
    description: "List a member's entitlements (reverse-reachability for Entitlement.member_id)."
    roles: [StudioManager, Member]
    code: 200
    input: ["kind?", "lifecycle_status?", "limit?", "offset?"]
    output: Entitlement[]
    side_effects: []
  - method: GET
    path: "/members/{id}/fee-charges"
    description: "List a member's fee charges (reverse-reachability for FeeCharge.member_id)."
    roles: [StudioManager, Member]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FeeCharge[]
    side_effects: []
  - method: GET
    path: "/members/{id}/enrollments"
    description: "List a member's workshop enrollments (reverse-reachability for Enrollment.member_id)."
    roles: [StudioManager, Member]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  # ---- Rooms ----
  - method: POST
    path: "/rooms"
    description: "Create a room."
    roles: [StudioManager]
    code: 201
    input: [name, room_type, station_capacity]
    output: Room
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/rooms/{id}"
    description: "Fetch a room."
    roles: [StudioManager, Member, Instructor]
    code: 200
    input: []
    output: Room
    side_effects: []
  - method: PATCH
    path: "/rooms/{id}"
    description: "Update a room (station_capacity downgrade can demote over-capacity BOOKED reservations on its published sessions)."
    roles: [StudioManager]
    code: 200
    input: ["name?", "station_capacity?", "status?", expected_room_version]
    output: Room
    side_effects:
      - "increments Room.version by 1"
      - "if station_capacity reduced below a published session's booked_count, cascade: demote the latest-booked over-capacity BOOKED reservations to WAITLISTED (Reservation BOOKED->WAITLISTED)"
  - method: GET
    path: "/rooms/{id}/class-sessions"
    description: "List sessions hosted by a room (reverse-reachability for ClassSession.room_id)."
    roles: [StudioManager, Member, Instructor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ClassSession[]
    side_effects: []
  - method: GET
    path: "/rooms/{id}/workshops"
    description: "List workshops hosted by a room (reverse-reachability for Workshop.room_id)."
    roles: [StudioManager, Member, Instructor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Workshop[]
    side_effects: []

  # ---- Teachers ----
  - method: POST
    path: "/teachers"
    description: "Create a teacher."
    roles: [StudioManager]
    code: 201
    input: [full_name, certifications]
    output: Teacher
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/teachers/{id}"
    description: "Fetch a teacher."
    roles: [StudioManager, Member, Instructor]
    code: 200
    input: []
    output: Teacher
    side_effects: []
  - method: GET
    path: "/teachers/{id}/class-sessions"
    description: "List sessions assigned to a teacher (reverse-reachability for ClassSession.teacher_id)."
    roles: [StudioManager, Member, Instructor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ClassSession[]
    side_effects: []
  - method: GET
    path: "/teachers/{id}/workshops"
    description: "List workshops led by a teacher (reverse-reachability for Workshop.lead_teacher_id)."
    roles: [StudioManager, Member, Instructor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Workshop[]
    side_effects: []

  # ---- Intro Offers (configuration) ----
  - method: POST
    path: "/intro-offers"
    description: "Create an intro/new-student offer template."
    roles: [StudioManager]
    code: 201
    input: [name, price_cents, credits_total, window_days]
    output: IntroOffer
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/intro-offers/{id}"
    description: "Fetch an intro offer."
    roles: [StudioManager, Member]
    code: 200
    input: []
    output: IntroOffer
    side_effects: []
  - method: GET
    path: "/intro-offers"
    description: "List intro offers."
    roles: [StudioManager, Member]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: IntroOffer[]
    side_effects: []
  - method: GET
    path: "/intro-offers/{id}/entitlements"
    description: "List INTRO entitlements redeemed from an offer (reverse-reachability for Entitlement.intro_offer_id)."
    roles: [StudioManager, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: Entitlement[]
    side_effects: []

  # ---- Class Sessions ----
  - method: POST
    path: "/class-sessions"
    description: "Create a class session (SCHEDULED). recurrence_parent_id optional self-reference to clone schedule template."
    roles: [StudioManager]
    code: 201
    input: [room_id, teacher_id, discipline, start_utc, end_utc, published_capacity, "waitlist_capacity?", "recurrence_parent_id?"]
    output: ClassSession
    side_effects: ["status=SCHEDULED"]
  - method: GET
    path: "/class-sessions/{id}"
    description: "Fetch a session with derived booked_count/waitlisted_count."
    roles: [StudioManager, Member, Instructor]
    code: 200
    input: []
    output: ClassSession
    side_effects: []
  - method: GET
    path: "/class-sessions"
    description: "List sessions (filter by room/teacher/status)."
    roles: [StudioManager, Member, Instructor]
    code: 200
    input: ["room_id?", "teacher_id?", "recurrence_parent_id?", "status?", "limit?", "offset?"]
    output: ClassSession[]
    side_effects: []
  - method: POST
    path: "/class-sessions/{id}/publish"
    description: "Publish a SCHEDULED session to OPEN (validates room/teacher availability + capacity)."
    roles: [StudioManager]
    code: 200
    input: []
    output: ClassSession
    side_effects: ["status SCHEDULED->OPEN"]
  - method: POST
    path: "/class-sessions/{id}/start"
    description: "Mark a session IN_PROGRESS; opens the check-in window."
    roles: [StudioManager]
    code: 200
    input: []
    output: ClassSession
    side_effects: ["status {OPEN,FULL}->IN_PROGRESS"]
  - method: POST
    path: "/class-sessions/{id}/complete"
    description: "Complete an IN_PROGRESS session; settles all reservations (CHECKED_IN->ATTENDED, BOOKED->NO_SHOW, WAITLISTED->CANCELLED_EARLY)."
    roles: [StudioManager]
    code: 200
    input: []
    output: ClassSession
    side_effects: ["reservation settlement cascade; no-show fees; member strike/suspend cascade"]
  - method: POST
    path: "/class-sessions/{id}/cancel"
    description: "Cancel a session; refunds credits to entitlements for affected reservations (final cash refund variant)."
    roles: [StudioManager]
    code: 200
    input: []
    output: ClassSession
    side_effects: ["reservation cancel cascade with credit refund"]
  - method: GET
    path: "/class-sessions/{id}/reservations"
    description: "List reservations on a session (reverse-reachability for Reservation.class_session_id)."
    roles: [StudioManager, Member, Instructor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  # ---- Entitlements ----
  - method: POST
    path: "/entitlements"
    description: "Purchase an entitlement (MEMBERSHIP/CLASS_PACK/INTRO). INTRO gated by new-student eligibility."
    roles: [StudioManager, Member]
    code: 201
    input: [member_id, kind, price_cents, credits_total, cycle_start_utc, "auto_renew?", "rollover_cap?", "intro_offer_id?"]
    output: Entitlement
    side_effects: ["lifecycle_status=PENDING; cycle_end_utc = cycle_start_utc + CYCLE_LENGTH_DAYS"]
  - method: GET
    path: "/entitlements/{id}"
    description: "Fetch an entitlement with derived credits_remaining/freeze fields."
    roles: [StudioManager, Member]
    code: 200
    input: []
    output: Entitlement
    side_effects: []
  - method: POST
    path: "/entitlements/{id}/activate"
    description: "Activate a PENDING entitlement to ACTIVE."
    roles: [StudioManager]
    code: 200
    input: []
    output: Entitlement
    side_effects: ["lifecycle_status PENDING->ACTIVE"]
  - method: POST
    path: "/entitlements/{id}/freeze"
    description: "Freeze an ACTIVE entitlement (freeze/rollover); rejects new bookings while FROZEN."
    roles: [Member, StudioManager]
    code: 200
    input: []
    output: Entitlement
    side_effects: ["freeze_status UNFROZEN->FROZEN; frozen_at_utc set"]
  - method: POST
    path: "/entitlements/{id}/thaw"
    description: "Thaw a FROZEN entitlement; extends cycle_end by frozen duration."
    roles: [Member, StudioManager]
    code: 200
    input: []
    output: Entitlement
    side_effects: ["freeze_status FROZEN->UNFROZEN; cycle_end_utc extended; frozen_days_consumed increased"]
  - method: POST
    path: "/entitlements/{id}/cancel"
    description: "Cancel an ACTIVE entitlement; disables auto-renew."
    roles: [Member, StudioManager]
    code: 200
    input: []
    output: Entitlement
    side_effects: ["lifecycle_status ACTIVE->CANCELLED; auto_renew=false"]

  # ---- Reservations ----
  - method: POST
    path: "/reservations"
    description: "Book a session. Lands BOOKED, WAITLISTED, or rejected per bookable_capacity_resolution. OCC on the session."
    roles: [Member, StudioManager]
    code: 201
    input: [member_id, class_session_id, entitlement_id, expected_class_session_version]
    output: Reservation
    side_effects:
      - "increments ClassSession.version by 1"
      - "charge/hold 1 credit on the entitlement; set status BOOKED or WAITLISTED; may transition session OPEN->FULL"
  - method: GET
    path: "/reservations/{id}"
    description: "Fetch a reservation."
    roles: [StudioManager, Member]
    code: 200
    input: []
    output: Reservation
    side_effects: []
  - method: GET
    path: "/reservations"
    description: "List reservations filtered by member/session/entitlement (reverse-reachability for Reservation.entitlement_id)."
    roles: [StudioManager, Member]
    code: 200
    input: ["member_id?", "class_session_id?", "entitlement_id?", "status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []
  - method: POST
    path: "/reservations/{id}/check-in"
    description: "Member checks in to an IN_PROGRESS session (BOOKED->CHECKED_IN)."
    roles: [Member, StudioManager]
    code: 200
    input: []
    output: Reservation
    side_effects: ["status BOOKED->CHECKED_IN"]
  - method: POST
    path: "/reservations/{id}/cancel"
    description: "Cancel a reservation; EARLY (credit refund + waitlist promote) or LATE (fee + forfeit). WAITLISTED cancel re-packs the queue."
    roles: [Member, StudioManager]
    code: 200
    input: []
    output: Reservation
    side_effects: ["status -> CANCELLED_EARLY|CANCELLED_LATE; fee/refund/promotion cascades"]

  # ---- Workshops ----
  - method: POST
    path: "/workshops"
    description: "Create a workshop/teacher-training (DRAFT)."
    roles: [StudioManager]
    code: 201
    input: [room_id, lead_teacher_id, title, kind, start_utc, end_utc, seat_capacity, deposit_cents, price_cents]
    output: Workshop
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/workshops/{id}"
    description: "Fetch a workshop."
    roles: [StudioManager, Member, Instructor]
    code: 200
    input: []
    output: Workshop
    side_effects: []
  - method: GET
    path: "/workshops"
    description: "List workshops (filter by room/teacher/status)."
    roles: [StudioManager, Member, Instructor]
    code: 200
    input: ["room_id?", "lead_teacher_id?", "status?", "limit?", "offset?"]
    output: Workshop[]
    side_effects: []
  - method: POST
    path: "/workshops/{id}/publish"
    description: "Publish DRAFT workshop to OPEN (room buffer + teacher availability checks)."
    roles: [StudioManager]
    code: 200
    input: []
    output: Workshop
    side_effects: ["status DRAFT->OPEN"]
  - method: POST
    path: "/workshops/{id}/close"
    description: "Close an OPEN/FULL workshop after end_utc; withdraws lingering applicants."
    roles: [StudioManager]
    code: 200
    input: []
    output: Workshop
    side_effects: ["status {OPEN,FULL}->CLOSED"]
  - method: POST
    path: "/workshops/{id}/cancel"
    description: "Cancel a workshop; refunds confirmed deposits."
    roles: [StudioManager]
    code: 200
    input: []
    output: Workshop
    side_effects: ["status ->CANCELLED; deposit refund cascade"]
  - method: GET
    path: "/workshops/{id}/enrollments"
    description: "List enrollments on a workshop (reverse-reachability for Enrollment.workshop_id)."
    roles: [StudioManager, Member, Instructor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  # ---- Enrollments ----
  - method: POST
    path: "/enrollments"
    description: "Apply to a workshop (APPLIED)."
    roles: [Member, StudioManager]
    code: 201
    input: [member_id, workshop_id]
    output: Enrollment
    side_effects: ["status=APPLIED"]
  - method: GET
    path: "/enrollments/{id}"
    description: "Fetch an enrollment."
    roles: [StudioManager, Member]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: POST
    path: "/enrollments/{id}/confirm"
    description: "Confirm an APPLIED enrollment (captures deposit; OCC on the workshop). Routes to WAITLISTED if workshop FULL."
    roles: [Member, StudioManager]
    code: 200
    input: [expected_workshop_version]
    output: Enrollment
    side_effects: ["increments Workshop.version by 1; status APPLIED->CONFIRMED|WAITLISTED; deposit capture; may move workshop OPEN->FULL"]
  - method: POST
    path: "/enrollments/{id}/withdraw"
    description: "Member withdraws an enrollment; CONFIRMED forfeits deposit and auto-promotes a waitlisted enrollment."
    roles: [Member, StudioManager]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status ->WITHDRAWN; confirmed-seat decrement + waitlist promote cascade"]

  # ---- Fee Charges ----
  - method: GET
    path: "/fee-charges/{id}"
    description: "Fetch a fee charge."
    roles: [StudioManager, Member]
    code: 200
    input: []
    output: FeeCharge
    side_effects: []
  - method: GET
    path: "/fee-charges"
    description: "List fee charges filtered by member/reservation (reverse-reachability for FeeCharge.reservation_id)."
    roles: [StudioManager, Member]
    code: 200
    input: ["member_id?", "reservation_id?", "status?", "limit?", "offset?"]
    output: FeeCharge[]
    side_effects: []
  - method: POST
    path: "/fee-charges/{id}/settle"
    description: "Settle (PAY) or WAIVE a fee charge; reduces member.outstanding_fee_cents."
    roles: [StudioManager]
    code: 200
    input: [resolution]
    output: FeeCharge
    side_effects: ["status UNPAID->PAID|WAIVED; member.outstanding_fee_cents decremented"]

  # ---- Ops + Clock (test-driving / operator surface) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock to any ISO-8601 UTC instant. Server startup default is 2026-01-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock."
    roles: [StudioManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["advances logical clock; does NOT auto-run ops"]
  - method: POST
    path: "/_ops/run"
    description: "Run the periodic ops sweep at the current logical clock: expire entitlements past cycle_end, auto-renew eligible memberships (rollover), reset no_show_strike_count windows, promote eligible waitlists, and reset frozen_days_consumed on renewal."
    roles: [StudioManager]
    code: 200
    input: []
    output: null
    side_effects:
      - "Entitlement ACTIVE->EXPIRED for non-renewing past-cycle entitlements"
      - "Entitlement ACTIVE->ACTIVE auto-renew + rollover for eligible memberships"
      - "Member.no_show_strike_count reset to 0 for members whose oldest NO_SHOW is older than STRIKE_WINDOW_DAYS"
      - "increments processed entitlements' version by 1"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Acting Member/Instructor does not own the targeted resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad type, or invalid enum value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: supplied expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_MEMBER_SUSPENDED, http: 409, condition: "Member account_status is SUSPENDED; new reservations/enrollments blocked" }
  - { id: ERR_ENTITLEMENT_NOT_USABLE, http: 409, condition: "Charged entitlement is not owned by the member, not ACTIVE, or FROZEN" }
  - { id: ERR_NO_CREDITS_REMAINING, http: 409, condition: "Finite entitlement has credits_remaining < 1" }
  - { id: ERR_INTRO_NOT_ELIGIBLE, http: 409, condition: "INTRO purchased by a non-new-student or member already holds an INTRO entitlement" }
  - { id: ERR_TEACHER_NOT_CERTIFIED, http: 409, condition: "Session discipline not in teacher.certifications or teacher INACTIVE at publish" }
  - { id: ERR_ROOM_DOUBLE_BOOKED, http: 409, condition: "Publishing would overlap another non-CANCELLED room occupation (session half-open / workshop buffer-inclusive)" }
  - { id: ERR_TEACHER_DOUBLE_BOOKED, http: 409, condition: "Publishing would overlap another non-CANCELLED occupation for the same teacher" }
  - { id: ERR_CAPACITY_EXCEEDS_ROOM, http: 422, condition: "published_capacity/seat_capacity exceeds room.station_capacity" }
  - { id: ERR_WAITLIST_FULL, http: 409, condition: "Full session's waitlisted_count already equals waitlist_capacity" }
  - { id: ERR_SESSION_NOT_BOOKABLE, http: 409, condition: "Session is IN_PROGRESS/COMPLETED/CANCELLED or clock is past start_utc" }
  - { id: ERR_FREEZE_LIMIT_REACHED, http: 409, condition: "frozen_days_consumed already at FREEZE_MAX_DAYS_PER_CYCLE" }
  - { id: ERR_ROOM_CLOSED, http: 409, condition: "Cannot publish a session/workshop into a CLOSED room" }
  - { id: ERR_ENTITLEMENT_FROZEN, http: 409, condition: "Cannot freeze an already-FROZEN entitlement or thaw an UNFROZEN one" }
  - { id: ERR_END_BEFORE_START, http: 422, condition: "end_utc <= start_utc on a session or workshop" }
  - { id: ERR_FEE_ALREADY_RESOLVED, http: 409, condition: "Settling a FeeCharge that is already PAID or WAIVED" }
  - { id: ERR_VERSION_REQUIRED, http: 422, condition: "Required expected_<parent>_version field absent from an OCC-guarded write" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StudioManager
    description: "Operator: configures rooms/teachers/schedule/offers, runs ops, settles fees, sets the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /members"
      - "POST /rooms"
      - "PATCH /rooms/{id}"
      - "POST /teachers"
      - "POST /intro-offers"
      - "POST /class-sessions"
      - "POST /class-sessions/{id}/publish"
      - "POST /class-sessions/{id}/start"
      - "POST /class-sessions/{id}/complete"
      - "POST /class-sessions/{id}/cancel"
      - "POST /entitlements/{id}/activate"
      - "POST /workshops"
      - "POST /workshops/{id}/publish"
      - "POST /workshops/{id}/close"
      - "POST /workshops/{id}/cancel"
      - "POST /fee-charges/{id}/settle"
      - "POST /_clock/set_current_utc"
      - "POST /_ops/run"
    shared_operations:
      - "GET endpoints"
      - "POST /entitlements"
      - "POST /entitlements/{id}/freeze"
      - "POST /entitlements/{id}/thaw"
      - "POST /entitlements/{id}/cancel"
      - "POST /reservations"
      - "POST /reservations/{id}/check-in"
      - "POST /reservations/{id}/cancel"
      - "POST /enrollments"
      - "POST /enrollments/{id}/confirm"
      - "POST /enrollments/{id}/withdraw"
  - name: Member
    description: "A studio customer acting on own entitlements, reservations, and enrollments."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "GET /members/{id} (own)"
      - "GET /members/{id}/reservations (own)"
      - "GET /members/{id}/entitlements (own)"
      - "GET /members/{id}/fee-charges (own)"
      - "GET /members/{id}/enrollments (own)"
      - "GET catalog reads (rooms, teachers, class-sessions, workshops)"
      - "POST /entitlements (own, kind in {MEMBERSHIP, CLASS_PACK, INTRO})"
      - "POST /entitlements/{id}/freeze (own)"
      - "POST /entitlements/{id}/thaw (own)"
      - "POST /entitlements/{id}/cancel (own)"
      - "POST /reservations (own)"
      - "POST /reservations/{id}/check-in (own)"
      - "POST /reservations/{id}/cancel (own)"
      - "POST /enrollments (own)"
      - "POST /enrollments/{id}/confirm (own)"
      - "POST /enrollments/{id}/withdraw (own)"
  - name: Instructor
    description: "A teacher; read-only access to their own taught sessions/workshops and studio catalog."
    identity: "entity_backed:Teacher"
    exclusive_operations: []
    shared_operations:
      - "GET /teachers/{id} (own)"
      - "GET /teachers/{id}/class-sessions (own)"
      - "GET /teachers/{id}/workshops (own)"
      - "GET catalog reads (rooms, class-sessions, workshops)"
