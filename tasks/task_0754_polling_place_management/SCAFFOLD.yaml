    side_effects: []
  - method: POST
    path: "/elections/{id}/open-voting"
    description: "Open the election-day voting window."
    roles: [ElectionAdmin]
    code: 200
    input: []
    output: Election
    side_effects: ["status PLANNING -> VOTING_OPEN", "increments Election.version by 1"]
  - method: POST
    path: "/elections/{id}/close-voting"
    description: "Close voting; cascades place close -> shift check-out -> payroll."
    roles: [ElectionAdmin]
    code: 200
    input: []
    output: Election
    side_effects: ["status VOTING_OPEN -> VOTING_CLOSED", "cascade closes OPEN places", "increments Election.version by 1"]

  - method: POST
    path: "/polling-places"
    description: "Create a polling place under an election."
    roles: [ElectionAdmin]
    code: 201
    input: [election_id, name, address, min_workers_required, staffing_capacity, station_capacity, "wheelchair_accessible?", "accessible_parking?", "ada_voting_stations?"]
