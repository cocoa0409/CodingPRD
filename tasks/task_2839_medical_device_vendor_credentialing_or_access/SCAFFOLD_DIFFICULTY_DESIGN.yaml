      - name: spd_bay_capacity_rejects_buffered_touching_occupation
        grounds:
          - validations.priority_29_ERR_SPD_BAY_CAPACITY_EXCEEDED
          - calculations.spd_bay_occupation
          - calculations.loaner_delivery_deadline
          - entities.Facility.fields.spd_bay_count
          - entities.LoanerSet.fields.spd_occupation_start_utc
          - entities.LoanerSet.fields.spd_occupation_end_utc
          - global_constants.SPD_BAY_BUFFER_MINUTES
        distinguishing_aspect: |
          The opposite interval semantics from the badge-window instance, on a shared aggregate
          resource rather than a single holder: SPD occupation is a CLOSED interval, the existing set
          is widened by SPD_BAY_BUFFER_MINUTES on both sides, and the capacity ceiling is
          Facility.spd_bay_count instead of one. The two raw occupations [04:00, 10:00] and
          [10:00, 16:00] merely touch — legal under half-open semantics with no buffer — but the
          buffered existing interval [03:30, 10:30] collides, and with spd_bay_count 1 the count of 1
          already reaches capacity, so the registration is refused with 409.
