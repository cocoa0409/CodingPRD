          - errors[ERR_OWNER_SUSPENDED]
          - calculations.owner_penalty_accrual
        distinguishing_aspect: >-
          The owner gate sits at priority 30, BELOW the document checks: the
          listing has all five inspection zones and three VERIFIED statutory
          documents, so 28 and 29 pass and the only remaining objection is the
          owner's SUSPENDED status at 12 penalty points — the listing must stay
          DRAFT rather than reaching IN_REVIEW.
        test_recipe:
          setup: >-
            Canonical listing fully documented and verified but not yet
            submitted, and the owner carries a +12 penalty adjustment.
          setup_api_calls:
