      - name: oral_history_two_independent_state_axes_advance_separately
        grounds:
          - state_machines.OralHistoryInterview#consent_status
          - state_machines.OralHistoryInterview#transcription_status
          - calculations.interview_release_state
          - entities.OralHistoryInterview.fields.release_state
        distinguishing_aspect: |
          Two parallel state dimensions on one entity that advance without touching each
          other, plus a single join point. Transcription reaches REVIEWED while consent
          is still PENDING (release_state stays WITHHELD, proving the axes are truly
          independent), signing consent alone then flips release_state to
          RESEARCH_ROOM_ONLY without any transcription event, and only the final APPROVE
          reads BOTH axes to reach PUBLIC. Unlike the AccessRequest loop no state is
          revisited, and unlike the DeaccessionProposal fork-join there is no merged
          state — the machine is genuinely two-dimensional.
        test_recipe:
          setup:
            - "A processed Accession holding one OralHistoryInterview created with embargo_until omitted (null), so consent_status == PENDING, transcription_status == NOT_STARTED, release_state == WITHHELD."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "OH-01", retention_years: 25, disposition_action: "TRANSFER", legal_citation: "Oral History Policy 1.3", min_appraisal_score_for_permanent: 60.00 }
