              payload: { servicer_account_id: "${acct_s_id}", fulfillment_mode: "WILL_CALL", pickup_branch_id: "${branch_a_id}", purchase_order_ref: "PO-4011" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /part-orders/${order_id}/lines"
              payload: { requested_part_id: "${part_p1_id}", quantity: 2, expected_part_order_version: "${order_v0}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { line_1_id: $.data.id }
          trigger:
            - call: "POST /part-orders/${order_id}/lines"
              payload: { requested_part_id: "${part_p1_id}", quantity: 1, expected_part_order_version: "${order_v0}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { err_stale_order: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_ORDER_VERSION"
            - "${order_v0} == 1"
            - "PartOrder.${order_id}.version == 2"
            - "PartOrder.${order_id}.subtotal_cents == 20798"
            - "GET /order-lines?part_order_id=${order_id} returns len(response.data) == 1"

      - name: stale_expected_part_version_on_supersession_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[supersession-set-stale-part]
          - validations[priority_23]
          - errors[ERR_STALE_PART_VERSION]
        distinguishing_aspect: "The first supersession write moves Part.version 1 -> 2, so a second supersession replaying the version-1 token returns 412 ERR_STALE_PART_VERSION before any referential check runs, and superseded_by_part_id still points at P_B."
        test_recipe:
          setup:
            - "Three WHIRLPOOL MECHANICAL parts: P_A 12000, P_B 12500, P_C 13000."
            - "P_A -> P_B has already been recorded with P_A's version-1 token, so P_A is SUPERSEDED at version 2."
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP-B", oem_code: "WHIRLPOOL", description: "Drain pump rev B", category: "MECHANICAL", list_price_cents: 12500, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_b_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP-C", oem_code: "WHIRLPOOL", description: "Drain pump rev C", category: "MECHANICAL", list_price_cents: 13000, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_c_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP-A", oem_code: "WHIRLPOOL", description: "Drain pump rev A", category: "MECHANICAL", list_price_cents: 12000, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_a_id: $.data.id, part_a_v1: $.data.version }
            - call: "POST /parts/${part_a_id}/supersession"
              payload: { superseded_by_part_id: "${part_b_id}", expected_part_version: "${part_a_v1}" }
              as: PricingAdmin
              captures: { part_a_v2: $.data.version }
          trigger:
            - call: "POST /parts/${part_a_id}/supersession"
              payload: { superseded_by_part_id: "${part_c_id}", expected_part_version: "${part_a_v1}" }
              as: PricingAdmin
              captures: { err_stale_part: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_PART_VERSION"
            - "${part_a_v1} == 1"
            - "${part_a_v2} == 2"
            - "Part.${part_a_id}.version == 2"
            - "Part.${part_a_id}.superseded_by_part_id == ${part_b_id}"
            - "Part.${part_a_id}.lifecycle_status == SUPERSEDED"

      - name: delinquency_hold_fires_one_penalty_past_the_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.servicer_delinquency_score
          - state_machines.ServicerAccount.transitions.ACTIVE_to_CREDIT_HOLD
          - endpoints.POST_/servicer-accounts/{id}/tier-review
          - entities.ServicerAccount.fields.delinquency_score
        distinguishing_aspect: "The lifetime score is a cumulative threshold with a strict < test: at exactly DELINQUENCY_HOLD_THRESHOLD (80 - 2*20 == 40, cert bonus 0 after revocation) tier-review leaves the account ACTIVE, and one further denied claim (score 20) flips it to CREDIT_HOLD."
        test_recipe:
          setup:
            - "GOLD tier; Branch STL with will_call_enabled true; Part P1 MECHANICAL 12999 (unit 10399, cert_level_required NONE)."
            - "NET_30 account with credit_limit_cents 10000000, holding a BASIC WHIRLPOOL certification used only to get the claims submitted."
            - "InventoryRecord (STL, P1) on_hand 10; a WILL_CALL order with three 1-unit lines is credit-approved, allocated and fulfilled on 2026-08-01 (subtotal 31197)."
            - "Three warranty claims (one per line) are submitted; two are then DENIED by the OEM."
            - "The certification is revoked so effective_cert_count is 0 and the cert bonus is 0, making the lifetime score exactly 80 - 40 == 40."
            - "A first tier-review confirms 40 is NOT below the threshold; the third claim is then denied, taking the score to 20."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
              as: PricingAdmin
              captures: { tier_gold_id: $.data.id }
            - call: "POST /branches"
              payload: { code: "STL", name: "St Louis DC", region_code: "MW", will_call_enabled: true, cutoff_hour_utc: 20, overnight_surcharge_cents: 300 }
              as: PlatformAdmin
              captures: { branch_a_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP", oem_code: "WHIRLPOOL", description: "Drain pump assembly", category: "MECHANICAL", list_price_cents: 12999, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_p1_id: $.data.id }
            - call: "POST /servicer-accounts"
              payload: { business_name: "Ace Appliance Repair", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 10000000, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_s_id: $.data.id }
            - call: "POST /technician-certifications"
              payload: { servicer_account_id: "${acct_s_id}", technician_name: "R. Diaz", oem_code: "WHIRLPOOL", cert_level: "BASIC", training_completed_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: WarrantyAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /inventory-records"
              payload: { branch_id: "${branch_a_id}", part_id: "${part_p1_id}", on_hand_units: 10, reorder_point: 2 }
              as: BranchCounterRep
              as_user_id: "${branch_a_id}"
              captures: { inv_a_p1_id: $.data.id }
            - call: "POST /part-orders"
              payload: { servicer_account_id: "${acct_s_id}", fulfillment_mode: "WILL_CALL", pickup_branch_id: "${branch_a_id}", purchase_order_ref: "PO-4012" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /part-orders/${order_id}/lines"
              payload: { requested_part_id: "${part_p1_id}", quantity: 1, expected_part_order_version: "${order_v0}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { line_1_id: $.data.id }
            - call: "GET /part-orders/${order_id}"
              payload: {}
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { order_v_after_line1: $.data.version }
            - call: "POST /part-orders/${order_id}/lines"
              payload: { requested_part_id: "${part_p1_id}", quantity: 1, expected_part_order_version: "${order_v_after_line1}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { line_2_id: $.data.id }
            - call: "GET /part-orders/${order_id}"
              payload: {}
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { order_v_after_line2: $.data.version }
            - call: "POST /part-orders/${order_id}/lines"
              payload: { requested_part_id: "${part_p1_id}", quantity: 1, expected_part_order_version: "${order_v_after_line2}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { line_3_id: $.data.id }
            - call: "POST /part-orders/${order_id}/credit-decision"
              payload: { decision: "APPROVE", decision_note: "inside limit" }
              as: CreditManager
              as_user_id: "cm-user-1"
            - call: "POST /part-orders/${order_id}/allocate"
              payload: {}
              as: BranchCounterRep
              as_user_id: "${branch_a_id}"
            - call: "POST /part-orders/${order_id}/fulfill"
              payload: { tracking_ref: "WILLCALL-4012" }
              as: BranchCounterRep
              as_user_id: "${branch_a_id}"
            - call: "POST /warranty-claims"
              payload: { servicer_account_id: "${acct_s_id}", order_line_id: "${line_1_id}", defect_code: "PUMP-SEIZED", appliance_model_number: "WTW5000DW1" }
              as: WarrantyAdmin
              captures: { claim_1_id: $.data.id }
            - call: "POST /warranty-claims/${claim_1_id}/submit"
              payload: { oem_reference: "WP-4012-1" }
              as: WarrantyAdmin
            - call: "POST /warranty-claims"
              payload: { servicer_account_id: "${acct_s_id}", order_line_id: "${line_2_id}", defect_code: "PUMP-LEAK", appliance_model_number: "WTW5000DW1" }
              as: WarrantyAdmin
              captures: { claim_2_id: $.data.id }
            - call: "POST /warranty-claims/${claim_2_id}/submit"
              payload: { oem_reference: "WP-4012-2" }
              as: WarrantyAdmin
            - call: "POST /warranty-claims"
              payload: { servicer_account_id: "${acct_s_id}", order_line_id: "${line_3_id}", defect_code: "PUMP-NOISE", appliance_model_number: "WTW5000DW1" }
              as: WarrantyAdmin
              captures: { claim_3_id: $.data.id }
            - call: "POST /warranty-claims/${claim_3_id}/submit"
              payload: { oem_reference: "WP-4012-3" }
              as: WarrantyAdmin
            - call: "POST /warranty-claims/${claim_1_id}/oem-response"
              payload: { outcome: "DENY", oem_reference: "WP-4012-1", oem_note: "no defect found" }
              as: WarrantyAdmin
            - call: "POST /warranty-claims/${claim_2_id}/oem-response"
              payload: { outcome: "DENY", oem_reference: "WP-4012-2", oem_note: "installer damage" }
              as: WarrantyAdmin
            - call: "POST /technician-certifications/${cert_id}/revoke"
              payload: { revocation_reason: "technician left the business" }
              as: WarrantyAdmin
            - call: "POST /servicer-accounts/${acct_s_id}/tier-review"
              payload: {}
              as: CreditManager
              captures: { score_at_threshold: $.data.delinquency_score }
            - call: "POST /warranty-claims/${claim_3_id}/oem-response"
              payload: { outcome: "DENY", oem_reference: "WP-4012-3", oem_note: "outside coverage" }
              as: WarrantyAdmin
          trigger:
            - call: "POST /servicer-accounts/${acct_s_id}/tier-review"
              payload: {}
              as: CreditManager
          assert:
            - "response.status == 200"
            - "${score_at_threshold} == 40"
            - "the first tier-review left ServicerAccount.${acct_s_id}.account_status == ACTIVE"
            - "ServicerAccount.${acct_s_id}.delinquency_score == 20"
            - "ServicerAccount.${acct_s_id}.account_status == CREDIT_HOLD"
            - "ServicerAccount.${acct_s_id}.pricing_tier_id == ${tier_gold_id}"
            - "TechnicianCertification.${cert_id}.is_effective == false"
            - "PartOrder.${order_id}.fulfillment_status == FULFILLED"
            - "PartOrder.${order_id}.settlement_status == INVOICED"

      - name: publish_cascade_runs_four_levels_deep
        claim_type: cascading_side_effects
        grounds:
          - state_machines.PriceFile.transitions.DRAFT_to_PUBLISHED
        excluded_because:
          difficulty_instance: transitive_cascade / price_file_publish_obsoletes_part_holds_order_and_moves_exposure
          rationale: "That §1.8 instance asserts all four hops of the publish cascade end-to-end, including the recomputed credit exposure."

      - name: quoted_versus_invoiced_pricing_variants_diverge
        claim_type: dual_variant_calculation
        grounds:
          - calculations.order_line_pricing
        excluded_because:
          difficulty_instance: dual_variant_calc / order_pricing_quoted_at_order_date_vs_invoiced_at_ship_date
          rationale: "That §1.8 instance asserts both variants and the 7200-cent reconciliation delta."

