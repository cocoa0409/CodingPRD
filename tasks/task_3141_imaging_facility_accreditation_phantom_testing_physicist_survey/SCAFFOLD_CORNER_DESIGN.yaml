        payload:
          facility_id: ${fac_id}
          person_name: Ravi Menon
          personnel_role: INTERPRETING_PHYSICIAN
          credential_number: RAD-3001
          ce_credit_hours: 40.0
          required_ce_hours: 40.0
          credential_expires_on: '2027-12-31T00:00:00Z'
        as: AccreditationBody
      trigger:
      - call: GET /accreditation/qualifications?facility_id=${fac_id}&personnel_role=MEDICAL_PHYSICIST&limit=1&offset=0
        payload: {}
        as: Any
      - call: GET /accreditation/qualifications?facility_id=${fac_id}&limit=100&offset=0
        payload: {}
        as: Any
      assert:
      - the filtered listing reports total_count 1 and has_more false with one row whose credential_number == PHYS-2001
      - the unfiltered listing reports total_count 3
      - every row carries the four pagination fields limit, offset, total_count and has_more
      - a request with limit 0 is rejected because the declared minimum is 1
      - roles Any may read the listing while a role not declaring it cannot
  - name: facility_read_of_an_unknown_id_returns_not_found
    claim_type: Not Found
    grounds:
    - endpoints.GET_/accreditation/facilities/{facility_id}
    - errors.ERR_FACILITY_NOT_FOUND
    - validations[priority=3]
    distinguishing_aspect: GET of a well-formed but unknown facility id returns 404 with ERR_FACILITY_NOT_FOUND and an error-typed envelope, never a 200 with an empty object.
    test_recipe:
      setup:
      - Logical clock at its default 2026-09-01T00:00:00Z. Empty database.
      setup_api_calls: []
      trigger:
      - call: GET /accreditation/facilities/00000000-0000-4000-8000-000000000001
        payload: {}
        as: Any
        captures:
          error_id: $.data.error_id
      assert:
      - the response status is 404 and response_type is error
      - error_id == ERR_FACILITY_NOT_FOUND
      - data.message is a non-empty string
      - meta.api_request_id and meta.api_request_timestamp are present on the error envelope
      - GET /accreditation/facilities?limit=10&offset=0 reports total_count 0
  - name: modality_unit_create_requires_the_facility_foreign_key_to_resolve
    claim_type: Parent Relationships
    grounds:
    - entities.ModalityUnit.fields.facility_id
    - validations[priority=3]
    - errors.ERR_FACILITY_NOT_FOUND
    - complexity_profile.entity_topology
    distinguishing_aspect: The flat topology puts facility_id in the request body; a unit posted against an unknown facility id is rejected 404 with ERR_FACILITY_NOT_FOUND and no unit row is persisted.
    test_recipe:
      setup:
      - Logical clock at its default 2026-09-01T00:00:00Z. One facility exists.
      setup_api_calls:
      - call: POST /accreditation/facilities
        payload:
          name: Northgate Imaging Center
          state_code: CT
          facility_type: IMAGING_CENTER
        as: FacilityAdmin
        captures:
          fac_id: $.data.id
      - call: GET /accreditation/facilities/${fac_id}
        payload: {}
        as: Any
        captures:
          fv: $.data.version
      trigger:
      - call: POST /accreditation/modality-units
        payload:
          facility_id: 00000000-0000-4000-8000-000000000009
          modality_code: CT
          unit_label: CT-1
          expected_facility_version: ${fv}
        as: FacilityAdmin
        captures:
          error_id: $.data.error_id
      assert:
      - the create returns 404 and error_id == ERR_FACILITY_NOT_FOUND
      - GET /accreditation/modality-units?facility_id=${fac_id} returns 0 rows
      - Facility.${fac_id}.enrolled_unit_count == 0
      - Facility.${fac_id}.version is unchanged at ${fv}
      - the error envelope carries error_id and message and no data object with unit fields
- section: state_machines
  section_name: State machines
  instances:
  - name: facility_register_from_already_enrolled_returns_invalid_state
    claim_type: Invalid Transitions
    grounds:
    - state_machines.Facility.PENDING_to_ENROLLED
    - errors.ERR_INVALID_STATE
    - validations[priority=4]
    distinguishing_aspect: 'A facility already ENROLLED cannot be registered again: the second register call is rejected 409 ERR_INVALID_STATE with payer_participation_status and accreditation_currency left untouched.'
    test_recipe:
      setup:
      - Logical clock 2026-09-05T00:00:00Z.
      - Facility Northgate Imaging Center (CT) is ENROLLED with accreditation_currency PROVISIONAL, payer_participation_status ACTIVE and registry_credit_cents 500000.
      - ModalityUnit CT-1 (CT) is ENROLLED with EquipmentItem SN-CT-0001 ACTIVE.
      - PersonnelQualification TECH-1001 (TECHNOLOGIST) and PHYS-2001 (MEDICAL_PHYSICIST) are VERIFIED.
