          trigger:
            - call: "POST /transactions/${txn_id}/void"
              payload: {}
              as: RegisterClerk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "err == ERR_TRANSACTION_NOT_OPEN"

      - name: approve_already_approved_return_rejected
        claim_type: Idempotency
        grounds:
          - 'validations[priority=6]'
          - 'errors[ERR_RETURN_NOT_PENDING]'
          - 'state_machines.Return.PENDING_to_APPROVED'
        distinguishing_aspect: "Approving an already-APPROVED return returns ERR_RETURN_NOT_PENDING (409) — second approve is rejected."
        test_recipe:
          setup:
            - "ACTIVE BASIC member; FINALIZED txn (P qty 1); a receipted return already APPROVED."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-APPR2", list_price_cents: 10000, member_price_cents: 8000 }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "Appr2 Mem" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: RegisterClerk
            - call: "POST /transactions/${txn_id}/finalize"
              payload: {}
              as: RegisterClerk
            - call: "POST /returns"
              payload: { membership_id: "${m_id}", product_id: "${prod_id}", qty: 1, transaction_id: "${txn_id}" }
              as: ServiceDeskClerk
              captures: { ret_id: $.data.id }
            - call: "POST /returns/${ret_id}/approve"
              payload: {}
              as: ServiceDeskClerk
          trigger:
            - call: "POST /returns/${ret_id}/approve"
              payload: {}
              as: ServiceDeskClerk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "err == ERR_RETURN_NOT_PENDING"

      - name: revoke_already_revoked_card_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - 'validations[priority=6]'
          - 'errors[ERR_CARD_NOT_ACTIVE]'
          - 'state_machines.HouseholdCard.terminal_states'
        distinguishing_aspect: "Revoking an already-REVOKED card returns ERR_CARD_NOT_ACTIVE (409) — REVOKED is terminal."
        test_recipe:
          setup:
            - "ACTIVE BASIC member with one card already REVOKED."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "RevTerm Mem" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /household-cards"
              payload: { membership_id: "${m_id}", cardholder_name: "Spouse", card_kind: "INCLUDED" }
              as: Member
              as_user_id: "${m_id}"
              captures: { card_id: $.data.id }
            - call: "POST /household-cards/${card_id}/revoke"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /household-cards/${card_id}/revoke"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "err == ERR_CARD_NOT_ACTIVE"

      - name: signup_payment_on_active_membership_purpose_mismatch
        claim_type: Precondition Enforcement
        grounds:
          - 'errors[ERR_PAYMENT_PURPOSE_MISMATCH]'
          - 'endpoints."POST /payments"'
          - 'state_machines.Membership.PENDING_PAYMENT_to_ACTIVE'
        distinguishing_aspect: "A SIGNUP payment against an already-ACTIVE membership returns ERR_PAYMENT_PURPOSE_MISMATCH (409)."
        test_recipe:
          setup:
            - "ACTIVE BASIC member (already paid signup)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "PMis Mem" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "err == ERR_PAYMENT_PURPOSE_MISMATCH"

      # --- Excluded (covered by §1.8) ---
      - name: membership_cyclic_renew_and_reinstate_loops
        claim_type: Valid Transition
        grounds:
          - 'state_machines.Membership.ACTIVE_to_ACTIVE'
          - 'state_machines.Membership.EXPIRED_to_ACTIVE'
        excluded_because:
          difficulty_instance: membership_cyclic_renew_reinstate_loop
          rationale: "ACTIVE→ACTIVE renew self-loop and EXPIRED→ACTIVE reinstatement are exercised by the named §1.8 non_linear_state_machine instance."
      - name: transaction_finalize_vs_void_branch
        claim_type: Side Effect Execution
        grounds:
          - 'state_machines.Transaction.OPEN_to_FINALIZED'
          - 'state_machines.Transaction.OPEN_to_VOIDED'
        excluded_because:
          difficulty_instance: transaction_branching_finalize_vs_void
          rationale: "Divergent side-effect sets (FINALIZED creates ACCRUAL, VOID none) are asserted by the named §1.8 instance."
      - name: cancel_active_membership_cascade
        claim_type: Compensation
        grounds:
          - 'state_machines.Membership.ACTIVE_to_CANCELLED'
          - 'state_machines.HouseholdCard.ACTIVE_to_REVOKED'
        excluded_because:
          difficulty_instance: cancel_cascade_depth3_fee_ledger_cards
          rationale: "Cancel transition + FeeEvent/EXPIRY/card-revoke cascade is the named §1.8 transitive_cascade instance."
      - name: return_approve_reversal_cascade
        claim_type: Cross-entity
        grounds:
          - 'state_machines.Return.PENDING_to_APPROVED'
          - 'entities.TransactionLine.fields.returned_qty'
        excluded_because:
          difficulty_instance: return_approve_cascade_depth3_reversal_qty_membership
          rationale: "Approve → REVERSAL → returned_qty bump → reward recompute is the named §1.8 transitive_cascade instance."
      - name: finalize_accrues_executive_reward
        claim_type: Side Effect Execution
        grounds:
          - 'state_machines.Transaction.OPEN_to_FINALIZED'
          - 'calculations.transaction_reward_accrual'
        excluded_because:
          difficulty_instance: reward_accrual_capped_vs_uncapped_on_membership
          rationale: "Finalize ACCRUAL side-effect and capped/uncapped accrual are exercised by the named §1.8 dual_variant_calc instance."

  # ===========================================================================
  # SECTION: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: line_discount_instant_only_no_rebate
        claim_type: Correct Result
        grounds:
          - 'calculations.line_discounted_amount'
          - 'entities.TransactionLine.fields.line_instant_savings_cents'
        distinguishing_aspect: "With only an INSTANT_SAVINGS 1000/unit active and no rebate, a qty=2 line at member 8000 yields line_instant_savings_cents==2000, line_rebate_cents==0, net contribution 14000."
        test_recipe:
          setup:
            - "BASIC ACTIVE member; product member 8000 with INSTANT_SAVINGS 1000/unit active at clock; OPEN transaction; clock at 2026-04-01 (inside window)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-ISONLY", list_price_cents: 10000, member_price_cents: 8000 }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /instant-savings"
              payload: { product_id: "${prod_id}", kind: "INSTANT_SAVINGS", amount_cents: 1000, window_start_utc: "2026-03-01T00:00:00Z", window_end_utc: "2026-12-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "ISonly Mem" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_id: $.data.id }
          trigger:
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 2 }
              as: RegisterClerk
              captures: { line_id: $.data.id }
          assert:
            - "TransactionLine.${line_id}.line_instant_savings_cents == 2000"
            - "TransactionLine.${line_id}.line_rebate_cents == 0"
            - "Transaction.${txn_id}.net_cents == 14000"

      - name: instant_saving_max_units_caps_discounted_units
        claim_type: Constants Applied
        grounds:
          - 'calculations.line_discounted_amount'
          - 'entities.InstantSaving.fields.max_units'
        distinguishing_aspect: "An INSTANT_SAVINGS 1000/unit with max_units=2 applied to a qty=5 line discounts only 2 units (2000), not 5."
        test_recipe:
          setup:
            - "BASIC ACTIVE member; product member 8000 with INSTANT_SAVINGS 1000/unit max_units=2 active; OPEN transaction; clock at 2026-04-01."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-MAXU", list_price_cents: 10000, member_price_cents: 8000 }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /instant-savings"
              payload: { product_id: "${prod_id}", kind: "INSTANT_SAVINGS", amount_cents: 1000, window_start_utc: "2026-03-01T00:00:00Z", window_end_utc: "2026-12-01T00:00:00Z", max_units: 2 }
              as: ClubAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "MaxU Mem" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_id: $.data.id }
          trigger:
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 5 }
              as: RegisterClerk
              captures: { line_id: $.data.id }
          assert:
            - "TransactionLine.${line_id}.line_instant_savings_cents == 2000"

      - name: basic_member_accrues_zero_reward
        claim_type: Input Set Filtering
        grounds:
          - 'calculations.transaction_reward_accrual'
          - 'entities.MembershipPlan.fields.tier'
          - 'state_machines.Transaction.OPEN_to_FINALIZED'
        distinguishing_aspect: "A BASIC plan finalizes a reward_eligible transaction and accrues 0 (tier != EXECUTIVE branch)."
        test_recipe:
          setup:
            - "BASIC ACTIVE member; reward_eligible product member 8000; FINALIZED txn qty 5."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-BASICR", list_price_cents: 10000, member_price_cents: 8000, reward_eligible: true }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "BasicR Mem" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
