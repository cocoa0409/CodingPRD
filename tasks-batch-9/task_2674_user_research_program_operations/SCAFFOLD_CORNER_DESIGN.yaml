# §1.9 Scaffold Corner Design - breadth probe for task_2674_user_research_program_operations.
# Walks references/claim-extraction-guide.md section by section against §1.1-§1.7 of SCAFFOLD.yaml.
# Every logical clock is pinned at 2026-08-01T00:00:00Z unless a call advances it.
# Operator ids are stable across instances: u_stake_1 (Stakeholder), u_stake_2 (second Stakeholder),
# u_res_1 / u_res_2 (Researcher), u_lead_1 (ResearchLead), u_priv_1 (PrivacyOfficer),
# u_ops_1 (ResearchOpsAdmin).
scaffold_corner_design:
  - section: entities
    instances:
      - name: roadmap_decision_creation_returns_all_declared_fields
        claim_type: Creation
        grounds:
          - entities.RoadmapDecision
          - endpoints[POST /roadmap-decisions]
        distinguishing_aspect: "A decision created with the four required inputs comes back 201 with the system and computed fields already materialised - status OPEN, evidence_confidence 0.00, locked_at null, version 1."
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
          trigger:
            - call: "POST /roadmap-decisions"
              payload: { title: "Rebuild the onboarding checklist", reversibility: "IRREVERSIBLE", decision_deadline: "2026-09-30T00:00:00Z", impacted_user_count: 12000 }
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { dec_id: $.data.id }
          assert:
            - "HTTP 201 with response_type == object and data.id a UUID with no type prefix"
            - "data.title == Rebuild the onboarding checklist, reversibility == IRREVERSIBLE, decision_deadline == 2026-09-30T00:00:00Z, impacted_user_count == 12000"
            - "data.status == OPEN, data.evidence_confidence == 0.00, data.locked_at == null"
            - "data.version == 1 and data.created_at == data.updated_at == 2026-08-01T00:00:00.000Z"
            - "meta.api_request_id and meta.api_request_timestamp are present on the envelope"
      - name: research_request_retrieval_returns_stored_and_default_fields
        claim_type: Retrieval
        grounds:
          - entities.ResearchRequest
          - endpoints[GET /research-requests/{id}]
        distinguishing_aspect: "GET on a freshly created request returns exactly what was stored plus the untriaged defaults: status SUBMITTED, priority_score null, recommended_method null, revision_round 0."
        test_recipe:
          setup:
            - "One OPEN decision"
            - "One SUBMITTED request against it, created by u_stake_1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
            - call: "POST /roadmap-decisions"
              payload: { title: "Checklist rebuild", reversibility: "REVERSIBLE", decision_deadline: "2026-10-01T00:00:00Z", impacted_user_count: 4000 }
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { dec_id: $.data.id }
            - call: "POST /research-requests"
              payload: { roadmap_decision_id: "${dec_id}", question: "Where do admins stall in the checklist?", question_type: "DISCOVERY", evidence_gap: "PARTIAL" }
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { req_id: $.data.id }
          trigger:
            - call: "GET /research-requests/${req_id}"
              payload: {}
              as: ResearchLead
              as_user_id: "u_lead_1"
          assert:
            - "HTTP 200 with data.id == ${req_id} and data.roadmap_decision_id == ${dec_id}"
            - "data.question == Where do admins stall in the checklist?, question_type == DISCOVERY, evidence_gap == PARTIAL"
            - "data.requester_user_id == u_stake_1, taken from the creating call's X-User-ID and not from the body"
            - "data.status == SUBMITTED, priority_score == null, recommended_method == null, approved_method == null"
            - "data.revision_round == 0, triage_reason == null, triaged_at == null, version == 1"
      - name: studies_list_filters_by_execution_status_and_paginates
        claim_type: Listing
        grounds:
          - endpoints[GET /studies]
          - response_envelope.pagination_fields
        distinguishing_aspect: "The list endpoint applies the execution_status filter before pagination and reports total_count / has_more for the filtered set, not for the whole table."
        test_recipe:
          setup:
            - "One pool and two approved requests under one decision"
            - "Two studies on the same pool, both PLANNED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
            - call: "POST /roadmap-decisions"
              payload: { title: "Reporting revamp", reversibility: "REVERSIBLE", decision_deadline: "2026-10-01T00:00:00Z", impacted_user_count: 4000 }
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { dec_id: $.data.id }
            - call: "POST /research-requests"
              payload: { roadmap_decision_id: "${dec_id}", question: "How are reports shared today?", question_type: "DISCOVERY", evidence_gap: "PARTIAL" }
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { req_1: $.data.id }
            - call: "POST /research-requests"
              payload: { roadmap_decision_id: "${dec_id}", question: "How are reports archived today?", question_type: "DISCOVERY", evidence_gap: "PARTIAL" }
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { req_2: $.data.id }
            - call: "POST /research-requests/${req_1}/triage"
              payload: { outcome: "APPROVED" }
              as: ResearchLead
              as_user_id: "u_lead_1"
            - call: "POST /research-requests/${req_2}/triage"
              payload: { outcome: "APPROVED" }
              as: ResearchLead
              as_user_id: "u_lead_1"
            - call: "POST /participant-pools"
              payload: { name: "Reporting pool", pool_type: "CUSTOMER_LIST", contact_cap_per_window: 2, contact_window_days: 30, incentive_budget_cents: 50000 }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
              captures: { pool_id: $.data.id }
            - call: "POST /studies"
              payload: { research_request_id: "${req_1}", participant_pool_id: "${pool_id}", method: "INTERVIEW", target_participant_count: 2, screening_criteria: { required_segment: "POWER_USER", required_locale: "en-US", target_answers: ["A1"], disqualifying_answers: ["X9"] }, incentive_amount_cents: 4000, fielding_start: "2026-08-03T00:00:00Z", fielding_end: "2026-08-10T00:00:00Z" }
              as: Researcher
              as_user_id: "u_res_1"
              captures: { s1_id: $.data.id }
            - call: "POST /studies"
              payload: { research_request_id: "${req_2}", participant_pool_id: "${pool_id}", method: "INTERVIEW", target_participant_count: 2, screening_criteria: { required_segment: "POWER_USER", required_locale: "en-US", target_answers: ["A1"], disqualifying_answers: ["X9"] }, incentive_amount_cents: 4000, fielding_start: "2026-08-11T00:00:00Z", fielding_end: "2026-08-18T00:00:00Z" }
              as: Researcher
              as_user_id: "u_res_1"
              captures: { s2_id: $.data.id }
          trigger:
            - call: "GET /studies?participant_pool_id=${pool_id}&execution_status=PLANNED&limit=1&offset=0"
              payload: {}
              as: Stakeholder
              as_user_id: "u_stake_1"
            - call: "GET /studies?participant_pool_id=${pool_id}&execution_status=FIELDING"
              payload: {}
              as: Stakeholder
              as_user_id: "u_stake_1"
          assert:
            - "The first call returns HTTP 200 with response_type == array, exactly 1 row, total_count == 2, has_more == true, limit == 1, offset == 0"
            - "The returned row is one of ${s1_id} / ${s2_id} and both studies have execution_status == PLANNED"
            - "The second call returns 0 rows with total_count == 0 and has_more == false"
      - name: unknown_resource_ids_return_their_own_not_found_errors
        claim_type: Not Found
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - validations[priority=7]
          - validations[priority=8]
          - validations[priority=9]
          - validations[priority=10]
          - validations[priority=11]
          - validations[priority=12]
          - validations[priority=13]
          - validations[priority=14]
          - validations[priority=15]
          - validations[priority=16]
          - validations[priority=17]
        distinguishing_aspect: "Each of the thirteen entities answers with its own 404 error_id rather than a shared generic code, and the path id is validated before anything else in the ladder except authentication and authorisation."
        test_recipe:
          setup:
            - "Empty database except the logical clock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
          trigger:
            - call: "GET /roadmap-decisions/aaaaaaaa-0000-4000-8000-000000000001"
              payload: {}
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { e1: $.data.error_id }
            - call: "GET /research-requests/aaaaaaaa-0000-4000-8000-000000000002"
              payload: {}
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { e2: $.data.error_id }
            - call: "GET /participant-pools/aaaaaaaa-0000-4000-8000-000000000003"
              payload: {}
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
              captures: { e3: $.data.error_id }
            - call: "GET /participants/aaaaaaaa-0000-4000-8000-000000000004"
              payload: {}
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
              captures: { e4: $.data.error_id }
            - call: "GET /studies/aaaaaaaa-0000-4000-8000-000000000005"
              payload: {}
              as: Researcher
              as_user_id: "u_res_1"
              captures: { e5: $.data.error_id }
            - call: "GET /recruitments/aaaaaaaa-0000-4000-8000-000000000006"
              payload: {}
              as: Researcher
              as_user_id: "u_res_1"
              captures: { e6: $.data.error_id }
            - call: "GET /consent-records/aaaaaaaa-0000-4000-8000-000000000007"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "u_priv_1"
              captures: { e7: $.data.error_id }
            - call: "GET /artifacts/aaaaaaaa-0000-4000-8000-000000000008"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "u_priv_1"
              captures: { e8: $.data.error_id }
            - call: "GET /themes/aaaaaaaa-0000-4000-8000-000000000009"
              payload: {}
              as: Researcher
              as_user_id: "u_res_1"
              captures: { e9: $.data.error_id }
            - call: "GET /findings/aaaaaaaa-0000-4000-8000-00000000000a"
              payload: {}
              as: Researcher
              as_user_id: "u_res_1"
              captures: { e10: $.data.error_id }
            - call: "DELETE /evidence-links/aaaaaaaa-0000-4000-8000-00000000000b"
              payload: {}
              as: Researcher
              as_user_id: "u_res_1"
              captures: { e11: $.data.error_id }
            - call: "GET /readouts/aaaaaaaa-0000-4000-8000-00000000000c"
              payload: {}
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { e12: $.data.error_id }
            - call: "POST /follow-ups/aaaaaaaa-0000-4000-8000-00000000000d/complete"
              payload: {}
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { e13: $.data.error_id }
          assert:
            - "Every call returns HTTP 404 with response_type == error and a human-readable data.message"
            - "error_ids in order: ERR_DECISION_NOT_FOUND, ERR_REQUEST_NOT_FOUND, ERR_POOL_NOT_FOUND, ERR_PARTICIPANT_NOT_FOUND, ERR_STUDY_NOT_FOUND, ERR_RECRUITMENT_NOT_FOUND"
            - "then ERR_CONSENT_NOT_FOUND, ERR_ARTIFACT_NOT_FOUND, ERR_THEME_NOT_FOUND, ERR_FINDING_NOT_FOUND, ERR_EVIDENCE_LINK_NOT_FOUND, ERR_READOUT_NOT_FOUND, ERR_FOLLOW_UP_NOT_FOUND"
            - "No entity row is created by any of the thirteen calls"
      - name: study_creation_missing_required_fielding_end_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints[POST /studies]
          - validations[priority=18]
        distinguishing_aspect: "A missing required body field is a 400 ERR_INVALID_REQUEST that outranks every business rule; the request is rejected before the method / approved_method comparison at priority 40 runs."
        test_recipe:
          setup:
            - "One APPROVED request whose approved_method is INTERVIEW, and one pool"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
            - call: "POST /roadmap-decisions"
              payload: { title: "Export flow", reversibility: "REVERSIBLE", decision_deadline: "2026-10-01T00:00:00Z", impacted_user_count: 4000 }
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { dec_id: $.data.id }
            - call: "POST /research-requests"
              payload: { roadmap_decision_id: "${dec_id}", question: "How do analysts export?", question_type: "DISCOVERY", evidence_gap: "PARTIAL" }
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { req_id: $.data.id }
            - call: "POST /research-requests/${req_id}/triage"
              payload: { outcome: "APPROVED" }
              as: ResearchLead
              as_user_id: "u_lead_1"
            - call: "POST /participant-pools"
              payload: { name: "Export pool", pool_type: "CUSTOMER_LIST", contact_cap_per_window: 2, contact_window_days: 30, incentive_budget_cents: 50000 }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
              captures: { pool_id: $.data.id }
          trigger:
            - call: "POST /studies"
              payload: { research_request_id: "${req_id}", participant_pool_id: "${pool_id}", method: "SURVEY", target_participant_count: 2, screening_criteria: { required_segment: "POWER_USER", required_locale: "en-US", target_answers: ["A1"], disqualifying_answers: ["X9"] }, incentive_amount_cents: 4000, fielding_start: "2026-08-03T00:00:00Z" }
              as: Researcher
              as_user_id: "u_res_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST and a message naming fielding_end"
            - "The mismatched method SURVEY is never reported: ERR_METHOD_NOT_APPROVED at priority 40 is not reached because priority 18 fires first"
            - "No Study row is created and ResearchRequest.${req_id}.status is still APPROVED"
      - name: participant_creation_applies_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Participant
          - endpoints[POST /participant-pools/{id}/participants]
        distinguishing_aspect: "A participant created with only its four inputs starts ELIGIBLE with every counter at zero and last_contacted_at null, and the pool's participant_count is re-derived in the same request."
        test_recipe:
          setup:
            - "One empty pool"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
            - call: "POST /participant-pools"
              payload: { name: "Defaults pool", pool_type: "INTERNAL_DOGFOOD", contact_cap_per_window: 2, contact_window_days: 30, incentive_budget_cents: 30000 }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
              captures: { pool_id: $.data.id }
          trigger:
            - call: "POST /participant-pools/${pool_id}/participants"
              payload: { external_ref: "P-900", segment: "POWER_USER", locale: "en-US", pii_on_file: true }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
              captures: { p_id: $.data.id }
            - call: "GET /participant-pools/${pool_id}"
              payload: {}
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
          assert:
            - "HTTP 201 with data.pool_id == ${pool_id}, external_ref == P-900, segment == POWER_USER, locale == en-US, pii_on_file == true"
            - "data.status == ELIGIBLE, contacts_in_window == 0, no_show_strikes == 0, last_contacted_at == null"
            - "ParticipantPool.${pool_id}.participant_count == 1 and suppressed_participant_count == 0 in the follow-up read"
            - "ParticipantPool.${pool_id}.incentive_reserved_cents == 0, incentive_paid_cents == 0, incentive_available_cents == 30000 and status == OPEN"
      - name: request_creation_extra_priority_score_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.ResearchRequest.fields.priority_score
          - calculations.request_priority_score
        distinguishing_aspect: "priority_score is source: computed and is only written by triage; a client-supplied value in the create body is ignored, and the field stays null until the ResearchLead triages the request."
        test_recipe:
          setup:
            - "One OPEN decision with 12000 impacted users and a deadline 2026-09-30"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
            - call: "POST /roadmap-decisions"
              payload: { title: "Guided setup", reversibility: "IRREVERSIBLE", decision_deadline: "2026-09-30T00:00:00Z", impacted_user_count: 12000 }
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { dec_id: $.data.id }
          trigger:
            - call: "POST /research-requests"
              payload: { roadmap_decision_id: "${dec_id}", question: "What makes setup feel long?", question_type: "DISCOVERY", evidence_gap: "FULL", priority_score: 99.99, status: "APPROVED" }
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { req_id: $.data.id }
            - call: "POST /research-requests/${req_id}/triage"
              payload: { outcome: "APPROVED" }
              as: ResearchLead
              as_user_id: "u_lead_1"
          assert:
            - "The create call returns HTTP 201 with data.priority_score == null and data.status == SUBMITTED - both supplied values are discarded"
            - "The triage call returns data.priority_score == 75.00: 40.00 IRREVERSIBLE + 25.00 FULL + 10.00 reach, urgency multiplier 1.00 at 60 days"
            - "data.recommended_method == INTERVIEW and data.approved_method == INTERVIEW"
            - "data.triaged_at == 2026-08-01T00:00:00.000Z and data.version == 2"
      - name: participant_pool_system_fields_are_server_minted_and_client_input_ignored
        claim_type: System Fields
        grounds:
          - entities.ParticipantPool
          - complexity_profile.consistency_model
        distinguishing_aspect: "id, created_at, updated_at and version are minted by the server: a create body carrying them is accepted only for its declared inputs, and version starts at 1 regardless."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
          trigger:
            - call: "POST /participant-pools"
              payload: { name: "System field pool", pool_type: "EXTERNAL_PANEL", contact_cap_per_window: 3, contact_window_days: 45, incentive_budget_cents: 80000, version: 7, id: "aaaaaaaa-0000-4000-8000-0000000000ff" }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
              captures: { pool_id: $.data.id }
          assert:
            - "HTTP 201 with data.id != aaaaaaaa-0000-4000-8000-0000000000ff - the server mints its own UUID"
            - "data.version == 1, not 7"
            - "data.created_at == data.updated_at == 2026-08-01T00:00:00.000Z, taken from the logical clock"
            - "data.name == System field pool, pool_type == EXTERNAL_PANEL, contact_cap_per_window == 3, contact_window_days == 45, incentive_budget_cents == 80000"
      - name: study_creation_with_unknown_method_enum_is_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Study.fields.method
          - validations[priority=18]
        distinguishing_aspect: "Enum membership and the fielding-window ordering are both priority-18 concerns: an unknown method value and an inverted window each return ERR_INVALID_REQUEST rather than a business error."
        test_recipe:
          setup:
            - "One APPROVED request (approved_method INTERVIEW) and one pool"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
            - call: "POST /roadmap-decisions"
              payload: { title: "Search relevance", reversibility: "REVERSIBLE", decision_deadline: "2026-10-01T00:00:00Z", impacted_user_count: 4000 }
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { dec_id: $.data.id }
            - call: "POST /research-requests"
              payload: { roadmap_decision_id: "${dec_id}", question: "How do users search?", question_type: "DISCOVERY", evidence_gap: "PARTIAL" }
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { req_id: $.data.id }
            - call: "POST /research-requests/${req_id}/triage"
              payload: { outcome: "APPROVED" }
              as: ResearchLead
              as_user_id: "u_lead_1"
            - call: "POST /participant-pools"
              payload: { name: "Search pool", pool_type: "CUSTOMER_LIST", contact_cap_per_window: 2, contact_window_days: 30, incentive_budget_cents: 50000 }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
              captures: { pool_id: $.data.id }
          trigger:
            - call: "POST /studies"
              payload: { research_request_id: "${req_id}", participant_pool_id: "${pool_id}", method: "FOCUS_GROUP", target_participant_count: 2, screening_criteria: { required_segment: "POWER_USER", required_locale: "en-US", target_answers: ["A1"], disqualifying_answers: ["X9"] }, incentive_amount_cents: 4000, fielding_start: "2026-08-03T00:00:00Z", fielding_end: "2026-08-10T00:00:00Z" }
              as: Researcher
              as_user_id: "u_res_1"
              captures: { err1: $.data.error_id }
            - call: "POST /studies"
              payload: { research_request_id: "${req_id}", participant_pool_id: "${pool_id}", method: "INTERVIEW", target_participant_count: 2, screening_criteria: { required_segment: "POWER_USER", required_locale: "en-US", target_answers: ["A1"], disqualifying_answers: ["X9"] }, incentive_amount_cents: 4000, fielding_start: "2026-08-10T00:00:00Z", fielding_end: "2026-08-03T00:00:00Z" }
              as: Researcher
              as_user_id: "u_res_1"
              captures: { err2: $.data.error_id }
          assert:
            - "The unknown method FOCUS_GROUP returns HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "The inverted window (fielding_end before fielding_start) also returns HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "No Study row exists after either call and ResearchRequest.${req_id}.status is still APPROVED, never IN_STUDY"
      - name: participant_creation_under_unknown_pool_returns_pool_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Participant.parent
          - validations[priority=7]
        distinguishing_aspect: "Participant is a child of ParticipantPool, so an unknown parent in the path is a 404 on the parent's own error code, not a 400 on the child's body."
        test_recipe:
          setup:
            - "Empty database except the logical clock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
