  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: visit_inprogress_reverts_to_scheduled
        grounds:
          - state_machines.Visit.IN_PROGRESS_to_SCHEDULED
          - entities.Visit.fields.status
          - entities.Visit.fields.clock_in_at
        distinguishing_aspect: |
          Visit is cyclic on the Visit entity: a RESET on an IN_PROGRESS visit returns status to
          SCHEDULED and clears clock_in_at to null — a backward edge no linear pipeline allows.
        test_recipe:
          setup:
            - "One IN_PROGRESS visit (clocked in but not out) for an ACTIVE match/client/published plan."
          setup_api_calls:
            - call: "POST /agencies"
