        grounds: [state_machines.Enrollment.RESERVED_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Confirming a reservation while the section is still OPEN_FOR_ENROLLMENT rather than MIN_ENROLLMENT_MET must be rejected with ERR_INVALID_STATE and must not draw down the learner's confirmation credit."
        test_recipe:
          setup:
            - "Teacher ada is ACTIVE; a PUBLISHED listing has one OPEN section with min_learners 2"
            - "Learner ln_1 holds a RESERVED enrollment and a FAMILY-tier credit balance of 12000"
            - "The logical clock reads 2026-09-01T00:00:00Z, the server default"
