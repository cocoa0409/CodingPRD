              as: LegalCounsel
              as_user_id: "${legal_id}"
              expect_error: { http: 409, error_id: ERR_INVALID_STATE }
            - call: "POST /disclosure/documents/${script_id}/transitions"
              payload: { action: "APPROVE" }
              as: LegalCounsel
              as_user_id: "${legal_id}"
              captures: { script_status_2: $.data.status }
            - call: "GET /disclosure/documents/${script_id}/qa-items"
              payload: { limit: 10, offset: 0 }
              as: InvestorRelations
              as_user_id: "${ir_id}"
          assert:
            - "${gate_initial} == CLEARED"
            - "${q_low_status} == DRAFT and ${gate_after_low} == CLEARED"
            - "${q_sh_status} == BLOCKED and ${gate_after_sh} == CLEARED"
            - "${q_high_status} == BLOCKED and ${gate_after_high} == BLOCKED"
            - "${script_status_1} == IN_REVIEW"
            - "the first APPROVE returns 409 ERR_QA_ITEM_UNCLEARED"
            - "${q_high_status_2} == CLEARED and ${q_high_note} == \"Counsel approved wording: refer to the disclosed inquiry and decline to quantify.\" and ${gate_after_clear} == CLEARED"
            - "the replayed clear returns 409 ERR_INVALID_STATE"
            - "${script_status_2} == APPROVED"
            - "the closing question list returns exactly 3 rows with total_count == 3, QandAItem.${q_low_id}.status == DRAFT and QandAItem.${q_sh_id}.status == BLOCKED"
          notes: |
            The script is APPROVED with one DRAFT and one BLOCKED question still attached. That is the
            declared semantics, not an oversight: entities.DraftDocument.qa_gate_status is BLOCKED only
            while a risk_tier == HIGH question is un-CLEARED, and the requires_safe_harbor question is
            handled by §1.4 priority 23 — which this script satisfies because safe_harbor_present is true.
            An implementation that treats every non-CLEARED question as a blocker never reaches APPROVED.

      - name: readiness_read_lists_the_blocking_gates_in_priority_order_and_shrinks_as_they_are_cleared
        claim_type: computed_read
        grounds:
          - endpoints[GET /disclosure/reporting-cycles/{id}/readiness]
          - calculations.cycle_milestone_slack
          - calculations.statutory_deadline_resolution
          - validations[priority=13]
          - validations[priority=28]
          - validations[priority=33]
          - validations[priority=44]
        distinguishing_aspect: |
          Every derived field of the readiness projection is checked against a hand-computed value, and the
          three list fields are checked as ORDERED sequences: missing_milestone_kinds in MILESTONE_ORDER,
          unsigned_cert_types in the form_type's declared order, and blocking_error_ids in ascending §1.4
          priority. The claim that the first element of blocking_error_ids is exactly what the transition
          returns is then verified by actually attempting DECLARE_FILING_READY and matching the code. The
          read is taken twice: after assessing the open event away and adding the FILING milestone the
          blocking list shrinks from four codes to two, missing_milestone_kinds drops FILING while keeping
          REVIEW, and BOTH slack variants fall from 7/5 to 1/1 because the newly added FILING milestone
          joins the open set and becomes the minimum. A projection that caches or that recomputes only on
          write fails the second read.
        test_recipe:
          setup:
            - "An adopted charter with a FINANCE and a LEGAL voting seat (exactly min_quorum_count), and a FY2026-Q2 cycle moved to CLOSE_OPEN with ONLY a CLOSE milestone."
            - "One UNASSESSED MaterialEvent of magnitude 300000 against a 10000000 materiality base, so severity_score is 3.00 and the event is below the 5.00 reportable floor."
            - "No OfficerCertification and no SubCertificationRequest exist on the cycle."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Q2 Disclosure Committee Charter", version_label: "2026.1", min_quorum_count: 2, required_functions: ["FINANCE", "LEGAL"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Owen Legal", function: "LEGAL", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { legal_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-01T00:00:00Z", planned_end_utc: "2026-08-03T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "OPEN_CLOSE" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/material-events"
              payload: { category: "LITIGATION_JUDGMENT", occurred_utc: "2026-07-20T09:00:00Z", discovered_utc: "2026-07-21T09:00:00Z", magnitude_amount: 300000, description: "Adverse first-instance judgment in the supplier dispute." }
              as: ComplianceAdmin
              captures: { event_id: $.data.id, event_sev: $.data.severity_score, event_status: $.data.assessment_status }
          trigger:
            - call: "GET /disclosure/reporting-cycles/${cycle_id}/readiness"
              payload: {}
              as: Controller
              as_user_id: "${fin_id}"
              captures: { a_cycle: $.data.cycle_id, a_status: $.data.cycle_status, a_stage: $.data.restatement_stage, a_deadline: $.data.statutory_deadline_utc, a_target: $.data.internal_target_utc, a_cal: $.data.min_slack_days_calendar, a_bus: $.data.min_slack_days_business, a_weight: $.data.total_assigned_scope_weight, a_cov: $.data.certification_coverage_pct, a_events: $.data.open_material_event_count, a_def: $.data.unresolved_deficiency_weight, a_missing: $.data.missing_milestone_kinds, a_unsigned: $.data.unsigned_cert_types, a_blocking: $.data.blocking_error_ids, a_eligible: $.data.filing_ready_eligible }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "DECLARE_FILING_READY" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
              expect_error: { http: 409, error_id: ERR_INVALID_STATE }
            - call: "POST /disclosure/material-events/${event_id}/transitions"
              payload: { action: "ASSESS", determination: "NOT_REPORTABLE" }
              as: LegalCounsel
              as_user_id: "${legal_id}"
              captures: { event_status_2: $.data.assessment_status, event_deadline: $.data.current_report_deadline_utc }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "FILING", planned_start_utc: "2026-08-09T00:00:00Z", planned_end_utc: "2026-08-09T06:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { filing_ms_id: $.data.id, filing_ms_cal: $.data.slack_calendar_days, filing_ms_bus: $.data.slack_business_days }
            - call: "GET /disclosure/reporting-cycles/${cycle_id}/readiness"
              payload: {}
              as: Controller
              as_user_id: "${fin_id}"
              captures: { b_cal: $.data.min_slack_days_calendar, b_bus: $.data.min_slack_days_business, b_events: $.data.open_material_event_count, b_missing: $.data.missing_milestone_kinds, b_unsigned: $.data.unsigned_cert_types, b_blocking: $.data.blocking_error_ids, b_eligible: $.data.filing_ready_eligible }
          assert:
            - "${event_sev} == 3.00 and ${event_status} == UNASSESSED"
            - "${a_cycle} == \"${cycle_id}\" and ${a_status} == CLOSE_OPEN and ${a_stage} == NONE"
            - "${a_deadline} == \"2026-08-10T17:30:00Z\" and ${a_target} == \"2026-08-05T17:30:00Z\""
            - "${a_cal} == 7 and ${a_bus} == 5"
            - "${a_weight} == 0.00 and ${a_cov} == 0.00 and ${a_events} == 1 and ${a_def} == 0.00"
            - "${a_missing} == [\"REVIEW\", \"FILING\"]"
            - "${a_unsigned} == [\"CEO_302\", \"CFO_302\"]"
            - "${a_blocking} == [\"ERR_INVALID_STATE\", \"ERR_OPEN_MATERIAL_EVENT\", \"ERR_MILESTONE_MISSING\", \"ERR_CERTIFICATIONS_INCOMPLETE\"] and ${a_eligible} == false"
            - "the DECLARE_FILING_READY attempt returns 409 ERR_INVALID_STATE, matching the first element of the blocking list"
            - "${event_status_2} == NOT_REPORTABLE and ${event_deadline} == null"
            - "${filing_ms_cal} == 1 and ${filing_ms_bus} == 1"
            - "${b_cal} == 1 and ${b_bus} == 1 and ${b_events} == 0"
            - "${b_missing} == [\"REVIEW\"]"
            - "${b_unsigned} == [\"CEO_302\", \"CFO_302\"]"
            - "${b_blocking} == [\"ERR_INVALID_STATE\", \"ERR_CERTIFICATIONS_INCOMPLETE\"] and ${b_eligible} == false"
          notes: |
            Slack arithmetic on the first read: the CLOSE milestone is the only row in {PLANNED,
            IN_PROGRESS}; calendar slack is floor_whole_days(2026-08-10T17:30:00Z - 2026-08-03T00:00:00Z)
            = floor(7 days 17.5 h) = 7, and business slack counts 2026-08-04, 05, 06, 07 and 10 — five
            days, since 2026-08-08 is a Saturday and 2026-08-09 a Sunday — for 5. On the second read the
            FILING milestone joins the open set at 1/1 and becomes the minimum on both variants.
            The FILING milestone is admitted with no buffer check because its predecessor kind in
            MILESTONE_ORDER is CERTIFICATION and the cycle has no CERTIFICATION milestone, so §1.3
            milestone_window_conflict RULE B is skipped entirely.
            missing_milestone_kinds keeps REVIEW on both reads: OPEN_CERTIFICATION still lies ahead of
            this cycle and §1.4 priority 33 requires a REVIEW milestone for it.

      - name: officer_certification_link_validates_both_ends_left_to_right_and_then_binds_the_seat
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /disclosure/officer-certifications]
          - validations[priority=7]
          - validations[priority=14]
          - validations[priority=16]
          - validations[priority=17]
          - errors[ERR_CYCLE_NOT_FOUND]
          - errors[ERR_MEMBER_NOT_FOUND]
          - errors[ERR_MEMBER_CHARTER_MISMATCH]
          - errors[ERR_MEMBER_SEAT_INVALID]
          - errors[ERR_DUPLICATE_CERTIFICATION]
        distinguishing_aspect: |
          The endpoint links a ReportingCycle to a CommitteeMember, and every way that link can be wrong is
          probed in one chain, including the ORDER in which the two ends are resolved: a request whose
          cycle_id AND officer_member_id are both unknown reports ERR_CYCLE_NOT_FOUND, because §1.4
          priority 7 resolves body foreign keys in the order the §1.5 `input:` list declares them
          ([cycle_id, officer_member_id, cert_type]). Beyond existence, the link must be same-charter
          (ERR_MEMBER_CHARTER_MISMATCH) and the seat must be usable AND flagged as an officer
          (ERR_MEMBER_SEAT_INVALID for a non-officer and for a RECUSED officer), and the (cycle, cert_type)
          pair must be unique (ERR_DUPLICATE_CERTIFICATION even when the second request names a DIFFERENT
          officer). The successful link is then read back through the list filter on both ends at once.
        test_recipe:
          setup:
            - "Two adopted charters. Charter A holds a FINANCE voting non-officer, a LEGAL voting non-officer and two FINANCE officers, one of which is later RECUSED. Charter B holds two FINANCE officers of its own."
            - "One FY2026-Q2 cycle on charter A, left in PLANNING: §1.2 admits OfficerCertification creation from every cycle status except ABANDONED, so no milestone or cycle transition is needed."
