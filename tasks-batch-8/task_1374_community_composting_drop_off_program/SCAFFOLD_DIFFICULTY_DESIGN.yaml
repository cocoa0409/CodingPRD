  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: drop_event_parallel_credit_and_verification_dims
        grounds:
          - state_machines.DropEvent
          - entities.DropEvent.fields.credit_state
          - entities.DropEvent.fields.verification_state
        distinguishing_aspect: |
          DropEvent has two independent state dimensions on one entity:
          verification_state (PENDING_AUDIT / FLAGGED_CONTAMINATED / ACCEPTED
          / REJECTED) × credit_state (UNCREDITED / PROVISIONALLY_CREDITED /
          FINALLY_CREDITED / REVOKED). A contamination report flips
          verification_state while credit_state remains UNCREDITED — the two
          axes evolve independently.
        test_recipe:
          setup:
            - "Program ACTIVE; site OPERATIONAL with agreement and material; participant with grant"
            - "Drop d created: verification_state=PENDING_AUDIT, credit_state=UNCREDITED"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P5", fiscal_year: 2026 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites"
              payload: { name: "S1", address: "1 A St", capacity_kg: 10000 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /programs/${prog_id}/host-agreements"
              payload: { site_id: "${site_id}", host_name: "H", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
