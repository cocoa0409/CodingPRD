  - section: errors
    instances:
      - name: corner_auth_gate_errors_are_three_distinct_codes_and_statuses
        claim_type: Error triggerable
        grounds: ["validations[priority=1]", "validations[priority=2]", "validations[priority=3]", "errors[ERR_MISSING_AUTH_HEADERS]", "errors[ERR_UNKNOWN_ROLE]", "errors[ERR_ACTOR_IDENTITY_UNKNOWN]", "roles[LegalCounsel]", "endpoints[POST /addenda/{addendum_id}/approve]"]
        distinguishing_aspect: "The three header-level failures are graded and must not collapse into one code: absent headers are 401 ERR_MISSING_AUTH_HEADERS, a syntactically present but undeclared role is 401 ERR_UNKNOWN_ROLE, and a declared entity_backed role whose X-User-ID does not resolve to a LegalReviewer row is 403 ERR_ACTOR_IDENTITY_UNKNOWN -- and all three fire before the path-existence check at priority 5, so they surface even when the addendum id is perfectly valid."
        test_recipe:
          setup: ["Jurisdiction CA, one active LegalReviewer, one PolicyDocument with a DRAFT version carrying one DRAFT CA addendum."]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 5, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"] }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
            - { call: "POST /legal-reviewers", payload: { jurisdiction_id: "${j_ca}", full_name: "Reviewer CA", bar_number: "CA-1001", concurrent_review_limit: 3 }, as: HRComplianceAdmin, captures: { r_ca: "$.data.id" } }
            - { call: "POST /policy-documents", payload: { title: "Code of Conduct 2026", category: "CODE_OF_CONDUCT" }, as: PolicyAuthor, captures: { d1: "$.data.id", d1v: "$.data.version" } }
            - { call: "POST /policy-documents/${d1}/versions", payload: { body_text: "S1 S2", section_count: 2, required_jurisdiction_ids: ["${j_ca}"], expected_policy_document_version: "${d1v}" }, as: PolicyAuthor, captures: { v1: "$.data.id" } }
            - { call: "POST /policy-versions/${v1}/addenda", payload: { jurisdiction_id: "${j_ca}", body_text: "CA addendum" }, as: PolicyAuthor, captures: { a1: "$.data.id" } }
          trigger:
            - { call: "POST /addenda/${a1}/approve", payload: {}, as: LegalCounsel, as_user_id: "00000000-0000-0000-0000-000000000000" }
            - { call: "POST /addenda/${a1}/approve", payload: {}, as: LegalCounsel, as_user_id: "${r_ca}" }
          assert:
            - "the first trigger call returns http_status == 403 with error.error_id == ERR_ACTOR_IDENTITY_UNKNOWN"
            - "the same POST /addenda/${a1}/approve request sent with no X-User-Role and no X-User-ID header returns http_status == 401 with error.error_id == ERR_MISSING_AUTH_HEADERS"
            - "the same request sent with X-User-Role: GeneralCounselIntern (a role absent from the six declared roles) returns http_status == 401 with error.error_id == ERR_UNKNOWN_ROLE"
            - "each of those three failures leaves JurisdictionAddendum.${a1}.status == DRAFT and approved_by_reviewer_id == null"
            - "the second trigger call returns http_status == 200 with JurisdictionAddendum.${a1}.status == APPROVED and approved_by_reviewer_id == ${r_ca}"
            - "every error body carries the declared envelope shape with error.error_id and error.message"
      - name: corner_body_foreign_keys_on_link_endpoints_must_resolve
        claim_type: Error triggerable
        grounds: ["validations[priority=6]", "errors[ERR_REFERENCED_ENTITY_NOT_FOUND]", "endpoints[POST /release-packages/{release_package_id}/items]", "endpoints[POST /policy-versions/{policy_version_id}/addenda]", "endpoints[POST /policy-versions/{policy_version_id}/legal-reviews]"]
        distinguishing_aspect: "Link-creating endpoints take their second endpoint in the body, so each must validate it: an unknown policy_version_id on the item link, an unknown jurisdiction_id on the addendum link and an unknown reviewer_id on the review link all answer ERR_REFERENCED_ENTITY_NOT_FOUND at 404 while the resolvable path parent proves the 404 is about the body, not the URL."
        test_recipe:
          setup: ["Jurisdiction CA, one PolicyDocument with a DRAFT version, and one DRAFT ReleasePackage."]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 5, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"] }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
            - { call: "POST /policy-documents", payload: { title: "Code of Conduct 2026", category: "CODE_OF_CONDUCT" }, as: PolicyAuthor, captures: { d1: "$.data.id", d1v: "$.data.version" } }
            - { call: "POST /policy-documents/${d1}/versions", payload: { body_text: "S1 S2", section_count: 2, required_jurisdiction_ids: ["${j_ca}"], expected_policy_document_version: "${d1v}" }, as: PolicyAuthor, captures: { v1: "$.data.id" } }
            - { call: "POST /release-packages", payload: { name: "P1", effective_date: "2026-09-01T00:00:00Z", scope_jurisdiction_ids: ["${j_ca}"] }, as: HRComplianceAdmin, captures: { p1: "$.data.id" } }
          trigger:
            - { call: "POST /release-packages/${p1}/items", payload: { policy_version_id: "00000000-0000-0000-0000-000000000000" }, as: HRComplianceAdmin }
            - { call: "POST /policy-versions/${v1}/addenda", payload: { jurisdiction_id: "00000000-0000-0000-0000-000000000000", body_text: "Ghost addendum" }, as: PolicyAuthor }
            - { call: "POST /policy-versions/${v1}/legal-reviews", payload: { jurisdiction_id: "${j_ca}", reviewer_id: "00000000-0000-0000-0000-000000000000", due_at: "2026-08-20T00:00:00Z" }, as: PolicyAuthor }
          assert:
            - "all three trigger calls return http_status == 404 with error.error_id == ERR_REFERENCED_ENTITY_NOT_FOUND"
            - "none of them returns ERR_RESOURCE_NOT_FOUND, because every path id resolved"
            - "GET /release-items?release_package_id=${p1} returns 0 rows"
            - "GET /addenda?policy_version_id=${v1} returns 0 rows"
            - "GET /legal-reviews?policy_version_id=${v1} returns 0 rows"
            - "ReleasePackage.${p1}.status == DRAFT and PolicyVersion.${v1}.status == DRAFT"
      - name: corner_reviewer_authorization_is_per_review_and_per_jurisdiction
        claim_type: Error triggerable
        grounds: ["validations[priority=10]", "validations[priority=11]", "errors[ERR_NOT_ASSIGNED_REVIEWER]", "errors[ERR_REVIEWER_JURISDICTION_MISMATCH]", "roles[LegalCounsel]", "endpoints[POST /legal-reviews/{legal_review_id}/start]", "endpoints[POST /addenda/{addendum_id}/approve]"]
        distinguishing_aspect: "Holding the LegalCounsel role is not authorization by itself and the two refusals have different scopes: a CA reviewer who is not this review's reviewer_id is refused with ERR_NOT_ASSIGNED_REVIEWER, while a NY reviewer is refused on a CA addendum with ERR_REVIEWER_JURISDICTION_MISMATCH; the correctly assigned CA reviewer then succeeds on both."
        test_recipe:
          setup: ["Jurisdictions CA and NY; CA reviewers r1 and r2 and NY reviewer r_ny; one PolicyDocument with a DRAFT version carrying a DRAFT CA addendum and a REQUESTED LegalReview assigned to r1."]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 5, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"] }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
            - { call: "POST /jurisdictions", payload: { state_code: "NY", display_name: "New York", min_legal_review_days: 5, ack_deadline_days: 30, retention_years: 7, required_language_codes: ["en"] }, as: HRComplianceAdmin, captures: { j_ny: "$.data.id" } }
            - { call: "POST /legal-reviewers", payload: { jurisdiction_id: "${j_ca}", full_name: "Reviewer One", bar_number: "CA-1001", concurrent_review_limit: 3 }, as: HRComplianceAdmin, captures: { r1: "$.data.id" } }
            - { call: "POST /legal-reviewers", payload: { jurisdiction_id: "${j_ca}", full_name: "Reviewer Two", bar_number: "CA-1002", concurrent_review_limit: 3 }, as: HRComplianceAdmin, captures: { r2: "$.data.id" } }
            - { call: "POST /legal-reviewers", payload: { jurisdiction_id: "${j_ny}", full_name: "Reviewer NY", bar_number: "NY-2001", concurrent_review_limit: 3 }, as: HRComplianceAdmin, captures: { r_ny: "$.data.id" } }
            - { call: "POST /policy-documents", payload: { title: "Code of Conduct 2026", category: "CODE_OF_CONDUCT" }, as: PolicyAuthor, captures: { d1: "$.data.id", d1v: "$.data.version" } }
            - { call: "POST /policy-documents/${d1}/versions", payload: { body_text: "S1 S2", section_count: 2, required_jurisdiction_ids: ["${j_ca}"], expected_policy_document_version: "${d1v}" }, as: PolicyAuthor, captures: { v1: "$.data.id" } }
            - { call: "POST /policy-versions/${v1}/addenda", payload: { jurisdiction_id: "${j_ca}", body_text: "CA addendum" }, as: PolicyAuthor, captures: { a1: "$.data.id" } }
            - { call: "POST /policy-versions/${v1}/legal-reviews", payload: { jurisdiction_id: "${j_ca}", reviewer_id: "${r1}", due_at: "2026-08-20T00:00:00Z" }, as: PolicyAuthor, captures: { lr1: "$.data.id" } }
            - { call: "POST /policy-versions/${v1}/submit-for-review", payload: {}, as: PolicyAuthor }
          trigger:
            - { call: "POST /legal-reviews/${lr1}/start", payload: {}, as: LegalCounsel, as_user_id: "${r2}" }
            - { call: "POST /addenda/${a1}/approve", payload: {}, as: LegalCounsel, as_user_id: "${r_ny}" }
            - { call: "POST /addenda/${a1}/approve", payload: {}, as: LegalCounsel, as_user_id: "${r1}" }
            - { call: "POST /legal-reviews/${lr1}/start", payload: {}, as: LegalCounsel, as_user_id: "${r1}" }
          assert:
            - "the first trigger call returns http_status == 403 with error.error_id == ERR_NOT_ASSIGNED_REVIEWER"
            - "the second trigger call returns http_status == 403 with error.error_id == ERR_REVIEWER_JURISDICTION_MISMATCH"
            - "after those two failures LegalReview.${lr1}.status == REQUESTED and JurisdictionAddendum.${a1}.status == DRAFT"
            - "the third trigger call returns http_status == 200 with JurisdictionAddendum.${a1}.approved_by_reviewer_id == ${r1}"
            - "the fourth trigger call returns http_status == 200 with LegalReview.${lr1}.status == IN_PROGRESS"
            - "LegalReview.${lr1}.reviewer_id == ${r1} and round_no == 1"
      - name: corner_only_the_assignee_or_an_attesting_admin_may_acknowledge
        claim_type: Error triggerable
        grounds: ["validations[priority=9]", "validations[priority=30]", "errors[ERR_NOT_ASSIGNMENT_OWNER]", "roles[Employee]", "roles[HRComplianceAdmin]", "endpoints[POST /acknowledgments]"]
        distinguishing_aspect: "Ownership is checked against the assignment, not the role: a second Employee with a perfectly valid identity cannot acknowledge someone else's assignment (403 ERR_NOT_ASSIGNMENT_OWNER), yet HRComplianceAdmin may capture the very same assignment with method ATTESTED because the jurisdiction sets proxy_ack_permitted true -- so the resulting Acknowledgment.employee_id is copied from the assignment, never from the actor."
        test_recipe:
          setup: ["Jurisdiction CA with esign_permitted true and proxy_ack_permitted true (required language en, min_legal_review_days 5, ack_deadline_days 30); employees e1 and e2, both ACTIVE with preferred_language_code en; an APPROVED PolicyVersion with approved CA addendum, CA LegalReview decided APPROVE at the 2026-08-01 clock and a PUBLISHED en Translation; ReleasePackage effective 2026-09-01 released at the 2026-09-01 clock with both assignments delivered."]
