  # =========================================================================
  # RULE 3 — non-linear state machines on DIFFERENT entities
  #   instance 1: ConformanceAssessment revision cycle with a bounded loop
  #   instance 2: LabelGrant's two independent status dimensions
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: assessment_deficiency_revision_cycle
        grounds:
          - state_machines.ConformanceAssessment.transitions.UNDER_REVIEW_to_DEFICIENT
          - state_machines.ConformanceAssessment.transitions.DEFICIENT_to_UNDER_REVIEW
          - state_machines.ConformanceAssessment.transitions.UNDER_REVIEW_to_REJECTED_on_exhausted_rounds
          - entities.ConformanceAssessment.fields.deficiency_round
          - entities.ProgramTier.fields.max_deficiency_rounds
          - validations.priority_22_ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: |
          The assessment loops UNDER_REVIEW -> DEFICIENT -> UNDER_REVIEW twice and the SAME trigger
          (decide DEFICIENT) resolves to a different target state the third time: with
          max_deficiency_rounds 2, round 3 lands in REJECTED instead of DEFICIENT, so the machine is a
          bounded cycle whose exit is decided by an accumulated counter, not by the request.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "TIER_1 self-attestation tier with max_deficiency_rounds 2."
            - "ELIGIBLE SMART_SPEAKER category on TIER_1 and the five-criterion catalogue."
            - "One SMALL manufacturer with one ELIGIBLE speaker product."
            - "An UNDER_REVIEW assessment on that product with all five responses declared conformant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /labeling/program-tiers"
              payload: { tier_code: "TIER_1", required_route: "SELF_ATTESTATION", label_validity_days: 365, min_overall_score: 80.80, unverified_weight_factor: 0.60, issuance_base_fee_cents: 40000, max_deficiency_rounds: 2 }
              as: ProgramAdministrator
              captures: { tier1_id: $.data.id }
            - call: "POST /labeling/device-categories"
              payload: { category_code: "SMART_SPEAKER", display_name: "Smart Speaker", eligibility_status: "ELIGIBLE", program_tier_id: "${tier1_id}", min_support_period_days: 730 }
              as: ProgramAdministrator
              captures: { cat_speaker_id: $.data.id }
            - call: "POST /labeling/security-criteria"
              payload: { criteria: [ { criterion_code: "AUTH-1", practice_area: "AUTHENTICATION", weight: 60, requires_lab_verification: true, criterion_text: "Unique per-device credentials or forced change at first use" }, { criterion_code: "AUTH-2", practice_area: "AUTHENTICATION", weight: 40, requires_lab_verification: false, criterion_text: "Brute-force resistant authentication with lockout" }, { criterion_code: "UPD-1", practice_area: "SOFTWARE_UPDATE", weight: 100, requires_lab_verification: true, criterion_text: "Signed automatic security updates for the declared support period" }, { criterion_code: "DATA-1", practice_area: "DATA_PROTECTION", weight: 100, requires_lab_verification: false, criterion_text: "Personal data encrypted in transit and at rest" }, { criterion_code: "VDP-1", practice_area: "VULN_DISCLOSURE", weight: 100, requires_lab_verification: false, criterion_text: "Published vulnerability disclosure policy with monitored contact" } ] }
              as: ProgramAdministrator
              captures: { crit_auth1_id: "$.data[0].id", crit_auth2_id: "$.data[1].id", crit_upd1_id: "$.data[2].id", crit_data1_id: "$.data[3].id", crit_vdp1_id: "$.data[4].id" }
            - call: "POST /labeling/manufacturers"
              payload: { legal_name: "Northwind Devices LLC", contact_email: "compliance@northwind.example", enterprise_class: "SMALL", annual_us_revenue_cents: 250000000 }
              as: ProgramAdministrator
              captures: { mfr_small_id: $.data.id }
            - call: "POST /labeling/products"
              payload: { manufacturer_id: "${mfr_small_id}", device_category_id: "${cat_speaker_id}", model_name: "Northwind Speaker S1", sku: "NW-SPK-S1", firmware_version: "1.0.0", declared_support_period_end: "2030-01-01T00:00:00Z", update_policy_disclosed: true, retail_units_shipped: 12000 }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
              captures: { prod_speaker_id: $.data.id, prod_speaker_v: $.data.version }
            - call: "POST /labeling/products/${prod_speaker_id}/assessments"
              payload: { expected_product_version: "${prod_speaker_v}" }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
              captures: { asmt_cycle_id: $.data.id }
            - call: "POST /labeling/assessments/${asmt_cycle_id}/responses"
              payload: { responses: [ { criterion_id: "${crit_auth1_id}", self_declared_conformant: true, evidence_ref: "EV-AUTH1" }, { criterion_id: "${crit_auth2_id}", self_declared_conformant: true, evidence_ref: "EV-AUTH2" }, { criterion_id: "${crit_upd1_id}", self_declared_conformant: true, evidence_ref: "EV-UPD1" }, { criterion_id: "${crit_data1_id}", self_declared_conformant: true, evidence_ref: "EV-DATA1" }, { criterion_id: "${crit_vdp1_id}", self_declared_conformant: true, evidence_ref: "EV-VDP1" } ] }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
            - call: "POST /labeling/assessments/${asmt_cycle_id}/submit"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
          trigger:
            - call: "POST /labeling/assessments/${asmt_cycle_id}/decide"
              payload: { decision: "DEFICIENT", reviewer_note: "Round 1: evidence for AUTH-1 is not traceable to a build." }
              as: ConformityReviewer
              as_user_id: "reviewer-1"
            - call: "POST /labeling/assessments/${asmt_cycle_id}/resubmit"
              payload: { resubmission_note: "Round 1 remediation: attached signed build manifest." }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
            - call: "POST /labeling/assessments/${asmt_cycle_id}/decide"
              payload: { decision: "DEFICIENT", reviewer_note: "Round 2: update cadence still undocumented." }
              as: ConformityReviewer
              as_user_id: "reviewer-2"
            - call: "POST /labeling/assessments/${asmt_cycle_id}/resubmit"
              payload: { resubmission_note: "Round 2 remediation: cadence documented." }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
            - call: "POST /labeling/assessments/${asmt_cycle_id}/decide"
              payload: { decision: "DEFICIENT", reviewer_note: "Round 3: remediation still incomplete." }
              as: ConformityReviewer
              as_user_id: "reviewer-3"
            - call: "POST /labeling/assessments/${asmt_cycle_id}/resubmit"
              payload: { resubmission_note: "Attempted fourth revision after the loop terminated." }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
          assert:
            - "the first decide DEFICIENT leaves ConformanceAssessment.${asmt_cycle_id}.status == DEFICIENT with deficiency_round == 1 and last_deficiency_by_user_id == reviewer-1"
            - "the first resubmit returns ConformanceAssessment.${asmt_cycle_id}.status == UNDER_REVIEW with deficiency_round still 1"
            - "the second decide DEFICIENT leaves status == DEFICIENT with deficiency_round == 2 and last_deficiency_by_user_id == reviewer-2"
            - "the third decide DEFICIENT returns 201 but resolves to ConformanceAssessment.${asmt_cycle_id}.status == REJECTED, NOT DEFICIENT"
            - "ConformanceAssessment.${asmt_cycle_id}.deficiency_round == 3"
            - "ConformanceAssessment.${asmt_cycle_id}.last_deficiency_by_user_id == reviewer-3"
            - "ConformanceAssessment.${asmt_cycle_id}.decided_overall_score == 80.80 (recomputed by each resubmit, never changed by the deficiency notices)"
            - "the trailing resubmit on the REJECTED assessment -> ERR_INVALID_ASSESSMENT_STATE (409)"

      - name: label_grant_parallel_status_dimensions
        grounds:
          - state_machines.LabelGrant.grant_status
          - state_machines.LabelGrant.registry_publication_status
          - state_machines.LabelGrant.transitions.PUBLISHED_to_WITHHELD
          - state_machines.LabelGrant.transitions.WITHHELD_to_PUBLISHED
          - entities.RegistryEntry.fields.published_at
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          LabelGrant carries two independent state dimensions. A WITHHELD publication decision moves
          registry_publication_status PUBLISHED -> WITHHELD while grant_status stays ACTIVE and no
          display authorization is withdrawn, and the WITHHELD -> PUBLISHED re-entry leaves
          RegistryEntry.published_at at its ORIGINAL instant even though the clock has moved — a
