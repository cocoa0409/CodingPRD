# =============================================================================
# §1.9 Scaffold Corner Design — Child Device Monitoring (Bark-like)
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: family_creation_defaults_applied
        claim_type: defaults
        grounds: [entities.FamilyAccount.fields.subscription_tier, entities.FamilyAccount.fields.analysis_variant, entities.FamilyAccount.fields.device_limit]
        distinguishing_aspect: "POST /api/families omitting tier/variant gets STANDARD + LEXICAL_V1; device_limit == 5; billing period is [now, now+30d)."
        test_recipe:
          setup: ["Empty DB; default clock 2026-09-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/families"
              payload: { family_name: "Fam Def", primary_contact_email: "def@x.com", primary_parent_name: "Pat Def" }
              as: PlatformAdmin
              captures: { fam_def: $.data.id }
          assert:
            - "FamilyAccount.${fam_def}.subscription_tier == STANDARD"
            - "FamilyAccount.${fam_def}.analysis_variant == LEXICAL_V1"
            - "FamilyAccount.${fam_def}.device_limit == 5"
            - "FamilyAccount.${fam_def}.account_status == ACTIVE"
            - "FamilyAccount.${fam_def}.billing_period_start == 2026-09-01T00:00:00Z"
            - "FamilyAccount.${fam_def}.billing_period_end == 2026-10-01T00:00:00Z"
            - "FamilyAccount.${fam_def}.device_count == 0"

      - name: family_creation_auto_creates_primary_parent
        claim_type: creation
        grounds: [entities.ParentMember.fields.is_primary, endpoints.POST_/api/families]
        distinguishing_aspect: "Creating a family auto-creates exactly one ParentMember with is_primary=true, discoverable via the parents sub-resource."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam PP", primary_contact_email: "pp@x.com", primary_parent_name: "Pat PP" }
              as: PlatformAdmin
              captures: { fam_pp: $.data.id }
          trigger:
            - call: "GET /api/families/${fam_pp}/parents"
              as: PlatformAdmin
              captures: { par_pp: $.data.0.id }
          assert:
            - "Exactly 1 ParentMember returned"
            - "ParentMember.${par_pp}.is_primary == true"
            - "ParentMember.${par_pp}.display_name == 'Pat PP'"
            - "ParentMember.${par_pp}.member_status == ACTIVE"

      - name: child_age_band_computed_from_clock
        claim_type: computed_fields
        grounds: [entities.ChildProfile.fields.age_band, calculations.age_band_derivation]
        distinguishing_aspect: "age_band is computed from birth_year against the clock year (2026): 2020 -> CHILD_9_UNDER, 2014 -> PRETEEN_10_12, 2012 -> TEEN_13_15, 2009 -> OLDER_TEEN_16_17."
        test_recipe:
          setup: ["Family exists"]
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam AB", primary_contact_email: "ab@x.com", primary_parent_name: "Pat AB" }
              as: PlatformAdmin
              captures: { fam_ab: $.data.id }
            - call: "GET /api/families/${fam_ab}/parents"
              as: PlatformAdmin
              captures: { par_ab: $.data.0.id }
          trigger:
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_ab}", display_name: "C6", birth_year: 2020 }
              as: Parent
              as_user_id: "${par_ab}"
              captures: { c6: $.data.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_ab}", display_name: "C12", birth_year: 2014 }
              as: Parent
              as_user_id: "${par_ab}"
              captures: { c12: $.data.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_ab}", display_name: "C14", birth_year: 2012 }
              as: Parent
              as_user_id: "${par_ab}"
              captures: { c14: $.data.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_ab}", display_name: "C17", birth_year: 2009 }
              as: Parent
              as_user_id: "${par_ab}"
              captures: { c17: $.data.id }
          assert:
            - "ChildProfile.${c6}.age_band == CHILD_9_UNDER"
            - "ChildProfile.${c12}.age_band == PRETEEN_10_12"
            - "ChildProfile.${c14}.age_band == TEEN_13_15"
            - "ChildProfile.${c17}.age_band == OLDER_TEEN_16_17"

      - name: child_create_with_adult_birth_year_returns_400
        claim_type: violation_to_error
        grounds: [calculations.age_band_derivation, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "birth_year 2000 yields age 26 (>17) at the 2026 clock and is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Family exists"]
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam AD", primary_contact_email: "ad@x.com", primary_parent_name: "Pat AD" }
              as: PlatformAdmin
              captures: { fam_ad: $.data.id }
            - call: "GET /api/families/${fam_ad}/parents"
              as: PlatformAdmin
              captures: { par_ad: $.data.0.id }
          trigger:
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_ad}", display_name: "Adult", birth_year: 2000 }
              as: Parent
              as_user_id: "${par_ad}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"

      - name: child_create_missing_birth_year_returns_400
        claim_type: required_fields
        grounds: [entities.ChildProfile.fields.birth_year, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "birth_year is a required input; omitting it fails before any entity is created."
        test_recipe:
          setup: ["Family exists"]
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam RQ", primary_contact_email: "rq@x.com", primary_parent_name: "Pat RQ" }
              as: PlatformAdmin
              captures: { fam_rq: $.data.id }
            - call: "GET /api/families/${fam_rq}/parents"
              as: PlatformAdmin
              captures: { par_rq: $.data.0.id }
          trigger:
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_rq}", display_name: "NoYear" }
              as: Parent
              as_user_id: "${par_rq}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"

      - name: connection_starts_awaiting_consent
        claim_type: creation
        grounds: [entities.ServiceConnection.fields.consent_status, state_machines.ServiceConnection]
        distinguishing_aspect: "A new ServiceConnection is AWAITING_CONSENT, not ACTIVE, regardless of inputs."
        test_recipe:
          setup: ["Family with child"]
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam CN", primary_contact_email: "cn@x.com", primary_parent_name: "Pat CN" }
              as: PlatformAdmin
              captures: { fam_cn: $.data.id }
            - call: "GET /api/families/${fam_cn}/parents"
              as: PlatformAdmin
              captures: { par_cn: $.data.0.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_cn}", display_name: "Kid CN", birth_year: 2012 }
              as: Parent
              as_user_id: "${par_cn}"
              captures: { child_cn: $.data.id }
          trigger:
            - call: "POST /api/children/${child_cn}/connections"
              payload: { service_type: "EMAIL", external_handle: "kidcn@mail", credential_token: "tok-cn" }
              as: Parent
              as_user_id: "${par_cn}"
              captures: { conn_cn: $.data.id }
          assert:
            - "ServiceConnection.${conn_cn}.consent_status == AWAITING_CONSENT"

      - name: credential_token_never_serialized
        claim_type: computed_fields
        grounds: [entities.ServiceConnection.fields.credential_token]
        distinguishing_aspect: "The connection response never echoes credential_token — it is write-only."
        test_recipe:
          setup: ["Family with child"]
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam CT", primary_contact_email: "ct@x.com", primary_parent_name: "Pat CT" }
              as: PlatformAdmin
              captures: { fam_ct: $.data.id }
            - call: "GET /api/families/${fam_ct}/parents"
              as: PlatformAdmin
              captures: { par_ct: $.data.0.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_ct}", display_name: "Kid CT", birth_year: 2012 }
              as: Parent
              as_user_id: "${par_ct}"
              captures: { child_ct: $.data.id }
          trigger:
            - call: "POST /api/children/${child_ct}/connections"
              payload: { service_type: "SOCIAL", external_handle: "kidct@social", credential_token: "supersecret" }
              as: Parent
              as_user_id: "${par_ct}"
              captures: { conn_ct: $.data.id }
            - call: "GET /api/connections/${conn_ct}"
              as: Parent
              as_user_id: "${par_ct}"
          assert:
            - "Neither create nor GET response contains credential_token or the value 'supersecret'"

      - name: get_child_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "A well-formed but nonexistent child UUID returns ERR_NOT_FOUND with 404."
        test_recipe:
          setup: ["Family with parent"]
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam NF", primary_contact_email: "nf@x.com", primary_parent_name: "Pat NF" }
              as: PlatformAdmin
              captures: { fam_nf: $.data.id }
            - call: "GET /api/families/${fam_nf}/parents"
              as: PlatformAdmin
              captures: { par_nf: $.data.0.id }
          trigger:
            - call: "GET /api/children/11111111-2222-4333-8444-555555555555"
              as: Parent
              as_user_id: "${par_nf}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, HTTP 404"

  - section: state_machines
    instances:
      - name: alert_created_in_delivered_initial_state
        claim_type: initial_state
        grounds: [state_machines.Alert]
        distinguishing_aspect: "Alerts are born DELIVERED (notification dispatched synchronously at creation), not NEW or PENDING."
        test_recipe:
          setup: ["Family, child, paired device, ACTIVE connection"]
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam IS", primary_contact_email: "is@x.com", primary_parent_name: "Pat IS" }
              as: PlatformAdmin
              captures: { fam_is: $.data.id }
            - call: "GET /api/families/${fam_is}/parents"
              as: PlatformAdmin
              captures: { par_is: $.data.0.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_is}", display_name: "Kid IS", birth_year: 2012 }
              as: Parent
              as_user_id: "${par_is}"
              captures: { child_is: $.data.id }
            - call: "POST /api/children/${child_is}/devices/pair"
              payload: { platform: "ANDROID", nickname: "IS-1" }
              as: Parent
              as_user_id: "${par_is}"
              captures: { dev_is: $.data.id }
            - call: "POST /api/children/${child_is}/connections"
              payload: { service_type: "MESSAGING", external_handle: "kidis@msg", credential_token: "tok-is" }
              as: Parent
              as_user_id: "${par_is}"
              captures: { conn_is: $.data.id }
            - call: "POST /api/connections/${conn_is}/state"
              payload: { to_status: "ACTIVE" }
              as: Parent
              as_user_id: "${par_is}"
          trigger:
            - call: "POST /api/content-items"
              payload:
                service_connection_id: "${conn_is}"
                occurred_at: "2026-09-01T00:00:00Z"
                direction: "INBOUND"
                thread_depth: 1
                signals: [ { category: "BULLYING", weight: 40 } ]
                raw_text: "initial state item"
              as: DeviceAgent
              as_user_id: "${dev_is}"
              captures: { alert_is: $.data.alert_id }
            - call: "GET /api/alerts/${alert_is}"
              as: Parent
              as_user_id: "${par_is}"
          assert:
            - "Alert.${alert_is}.alert_status == DELIVERED"
            - "ChildProfile.${child_is}.open_alert_count == 1"

      - name: alert_acknowledge_from_resolved_returns_409
        claim_type: invalid_transition
        grounds: [state_machines.Alert, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "RESOLVED -> ACKNOWLEDGED is not a declared transition (only RESOLVED -> REOPENED); rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Family, child, device, ACTIVE connection; MODERATE alert ACKNOWLEDGED then RESOLVED"]
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam IT", primary_contact_email: "it@x.com", primary_parent_name: "Pat IT" }
              as: PlatformAdmin
              captures: { fam_it: $.data.id }
            - call: "GET /api/families/${fam_it}/parents"
              as: PlatformAdmin
              captures: { par_it: $.data.0.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_it}", display_name: "Kid IT", birth_year: 2012 }
              as: Parent
              as_user_id: "${par_it}"
              captures: { child_it: $.data.id }
            - call: "POST /api/children/${child_it}/devices/pair"
              payload: { platform: "ANDROID", nickname: "IT-1" }
              as: Parent
              as_user_id: "${par_it}"
              captures: { dev_it: $.data.id }
            - call: "POST /api/children/${child_it}/connections"
              payload: { service_type: "MESSAGING", external_handle: "kidit@msg", credential_token: "tok-it" }
              as: Parent
              as_user_id: "${par_it}"
              captures: { conn_it: $.data.id }
            - call: "POST /api/connections/${conn_it}/state"
              payload: { to_status: "ACTIVE" }
              as: Parent
              as_user_id: "${par_it}"
            - call: "POST /api/content-items"
              payload:
                service_connection_id: "${conn_it}"
                occurred_at: "2026-09-01T00:00:00Z"
                direction: "INBOUND"
                thread_depth: 1
                signals: [ { category: "BULLYING", weight: 40 } ]
                raw_text: "invalid transition item"
              as: DeviceAgent
              as_user_id: "${dev_it}"
              captures: { alert_it: $.data.alert_id }
            - call: "POST /api/alerts/${alert_it}/state"
              payload: { to_status: "ACKNOWLEDGED" }
              as: Parent
              as_user_id: "${par_it}"
            - call: "POST /api/alerts/${alert_it}/state"
              payload: { to_status: "RESOLVED" }
              as: Parent
              as_user_id: "${par_it}"
          trigger:
            - call: "POST /api/alerts/${alert_it}/state"
              payload: { to_status: "ACKNOWLEDGED" }
              as: Parent
              as_user_id: "${par_it}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409"
            - "Alert.${alert_it}.alert_status remains RESOLVED"

      - name: archived_child_blocks_connection_create_returns_409
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ChildProfile, "errors[ERR_CHILD_ARCHIVED]", "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "ARCHIVED is terminal for ChildProfile: connection creation on an archived child fails with ERR_CHILD_ARCHIVED."
        test_recipe:
          setup: ["Family with child archived via PATCH"]
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam AR", primary_contact_email: "ar@x.com", primary_parent_name: "Pat AR" }
              as: PlatformAdmin
              captures: { fam_ar: $.data.id }
            - call: "GET /api/families/${fam_ar}/parents"
              as: PlatformAdmin
              captures: { par_ar: $.data.0.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_ar}", display_name: "Kid AR", birth_year: 2012 }
              as: Parent
              as_user_id: "${par_ar}"
              captures: { child_ar: $.data.id, child_ar_v: $.data.version }
            - call: "PATCH /api/children/${child_ar}"
              payload: { profile_status: "ARCHIVED", expected_child_version: "${child_ar_v}" }
              as: Parent
              as_user_id: "${par_ar}"
          trigger:
            - call: "POST /api/children/${child_ar}/connections"
              payload: { service_type: "EMAIL", external_handle: "kidar@mail", credential_token: "tok-ar" }
              as: Parent
              as_user_id: "${par_ar}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_CHILD_ARCHIVED, HTTP 409"

      - name: archive_cascades_connections_to_revoked
        claim_type: cascade_down
        grounds: [state_machines.ChildProfile.ACTIVE_to_ARCHIVED, state_machines.ServiceConnection]
        distinguishing_aspect: "Archiving a child revokes all non-REVOKED connections (AWAITING_CONSENT, ACTIVE, PAUSED all -> REVOKED) as a cascade-down side effect."
        test_recipe:
          setup: ["Family, child with two connections: one ACTIVE, one AWAITING_CONSENT"]
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam AC", primary_contact_email: "ac@x.com", primary_parent_name: "Pat AC" }
              as: PlatformAdmin
              captures: { fam_ac: $.data.id }
            - call: "GET /api/families/${fam_ac}/parents"
              as: PlatformAdmin
              captures: { par_ac: $.data.0.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_ac}", display_name: "Kid AC", birth_year: 2012 }
              as: Parent
              as_user_id: "${par_ac}"
              captures: { child_ac: $.data.id, child_ac_v: $.data.version }
            - call: "POST /api/children/${child_ac}/connections"
              payload: { service_type: "MESSAGING", external_handle: "kidac@msg", credential_token: "tok-ac1" }
              as: Parent
              as_user_id: "${par_ac}"
              captures: { conn_ac1: $.data.id }
            - call: "POST /api/connections/${conn_ac1}/state"
              payload: { to_status: "ACTIVE" }
              as: Parent
              as_user_id: "${par_ac}"
            - call: "POST /api/children/${child_ac}/connections"
              payload: { service_type: "EMAIL", external_handle: "kidac@mail", credential_token: "tok-ac2" }
              as: Parent
              as_user_id: "${par_ac}"
              captures: { conn_ac2: $.data.id }
          trigger:
            - call: "PATCH /api/children/${child_ac}"
              payload: { profile_status: "ARCHIVED", expected_child_version: "${child_ac_v}" }
              as: Parent
              as_user_id: "${par_ac}"
            - call: "GET /api/connections/${conn_ac1}"
              as: Parent
              as_user_id: "${par_ac}"
            - call: "GET /api/connections/${conn_ac2}"
              as: Parent
              as_user_id: "${par_ac}"
          assert:
            - "ServiceConnection.${conn_ac1}.consent_status == REVOKED"
            - "ServiceConnection.${conn_ac2}.consent_status == REVOKED"
            - "ChildProfile.${child_ac}.profile_status == ARCHIVED"

      - name: escalation_invalid_step_open_to_closed_returns_409
        claim_type: invalid_transition
        grounds: [state_machines.EscalationCase, "errors[ERR_INVALID_ESCALATION_STEP]"]
        distinguishing_aspect: "OPEN -> CLOSED is not a declared escalation transition (OPEN advances only via system guidance issuance); rejected with ERR_INVALID_ESCALATION_STEP."
        test_recipe:
          setup: ["SEVERE alert with EscalationCase OPEN (alert not yet acknowledged)"]
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam ES", primary_contact_email: "es@x.com", primary_parent_name: "Pat ES" }
              as: PlatformAdmin
              captures: { fam_es: $.data.id }
            - call: "GET /api/families/${fam_es}/parents"
              as: PlatformAdmin
              captures: { par_es: $.data.0.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_es}", display_name: "Kid ES", birth_year: 2012 }
              as: Parent
              as_user_id: "${par_es}"
              captures: { child_es: $.data.id }
            - call: "POST /api/children/${child_es}/devices/pair"
              payload: { platform: "ANDROID", nickname: "ES-1" }
              as: Parent
              as_user_id: "${par_es}"
              captures: { dev_es: $.data.id }
            - call: "POST /api/children/${child_es}/connections"
              payload: { service_type: "MESSAGING", external_handle: "kides@msg", credential_token: "tok-es" }
              as: Parent
              as_user_id: "${par_es}"
              captures: { conn_es: $.data.id }
            - call: "POST /api/connections/${conn_es}/state"
              payload: { to_status: "ACTIVE" }
              as: Parent
              as_user_id: "${par_es}"
            - call: "POST /api/content-items"
              payload:
                service_connection_id: "${conn_es}"
                occurred_at: "2026-09-01T00:00:00Z"
                direction: "INBOUND"
                thread_depth: 1
                signals: [ { category: "SELF_HARM", weight: 90 } ]
                raw_text: "severe escalation item"
              as: DeviceAgent
              as_user_id: "${dev_es}"
              captures: { alert_es: $.data.alert_id }
            - call: "GET /api/escalation-cases"
              payload: { alert_id: "${alert_es}" }
              as: Parent
              as_user_id: "${par_es}"
              captures: { case_es: $.data.0.id }
          trigger:
            - call: "POST /api/escalation-cases/${case_es}/state"
              payload: { to_status: "CLOSED" }
              as: Parent
              as_user_id: "${par_es}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_ESCALATION_STEP, HTTP 409"
            - "EscalationCase.${case_es}.case_status remains OPEN"

  - section: calculations
    instances:
      - name: low_severity_content_suppressed_no_alert
        claim_type: input_set_filtering
        grounds: [calculations.alert_severity_classification, entities.ContentItem.fields.alert_created]
        distinguishing_aspect: "score 10 (< 30) classifies LOW and is suppressed: alert_created == false, alert_id == null, and no Alert row exists for the child."
        test_recipe:
          setup: ["Family, child (TEEN_13_15, STANDARD), device, ACTIVE connection"]
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam LS", primary_contact_email: "ls@x.com", primary_parent_name: "Pat LS" }
              as: PlatformAdmin
              captures: { fam_ls: $.data.id }
            - call: "GET /api/families/${fam_ls}/parents"
              as: PlatformAdmin
              captures: { par_ls: $.data.0.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_ls}", display_name: "Kid LS", birth_year: 2012 }
              as: Parent
              as_user_id: "${par_ls}"
              captures: { child_ls: $.data.id }
            - call: "POST /api/children/${child_ls}/devices/pair"
              payload: { platform: "ANDROID", nickname: "LS-1" }
              as: Parent
              as_user_id: "${par_ls}"
              captures: { dev_ls: $.data.id }
            - call: "POST /api/children/${child_ls}/connections"
              payload: { service_type: "MESSAGING", external_handle: "kidls@msg", credential_token: "tok-ls" }
              as: Parent
              as_user_id: "${par_ls}"
              captures: { conn_ls: $.data.id }
            - call: "POST /api/connections/${conn_ls}/state"
              payload: { to_status: "ACTIVE" }
              as: Parent
              as_user_id: "${par_ls}"
          trigger:
            - call: "POST /api/content-items"
              payload:
                service_connection_id: "${conn_ls}"
                occurred_at: "2026-09-01T00:00:00Z"
                direction: "INBOUND"
                thread_depth: 1
                signals: [ { category: "EXPLICIT", weight: 10 } ]
