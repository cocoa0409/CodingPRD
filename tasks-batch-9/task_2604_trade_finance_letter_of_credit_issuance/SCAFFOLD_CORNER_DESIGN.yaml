      - name: amendment_acceptance_ledger_sync_reconciles_credit_and_facility
        claim_type: ledger_sync
        grounds:
          - state_machines.Amendment.PENDING_CONSENT_to_ACCEPTED
          - state_machines.DocumentaryCredit.AMENDMENT_PENDING_to_ISSUED
          - calculations.amendment_consent_requirement
          - calculations.issuance_charges.variants.amendment_recharge
          - endpoints.POST_/amendments/{id}/consent
        distinguishing_aspect: |
          A consented decrease from 10000000 to 8000000 re-derives the credit
          ledger downward (max_drawable 8000000, chargeable_utilisation 8025000)
          while total_charge_cents STAYS 25000 - the commission is not re-priced.
          The allocation is re-cut rather than edited: the old row goes RELEASED
          with released_cents 10025000 and a fresh AMENDED_DECREASE row opens
          with allocated_cents 8000000 and charge_cents 32500 (the retained 25000
          plus the 7500 amendment fee), so the facility settles at 8032500 -
          deliberately 7500 more than the credit's own
          chargeable_utilisation_cents. Before/after reconcile: 10025000 ->
          8032500 is a 1992500 give-back.
