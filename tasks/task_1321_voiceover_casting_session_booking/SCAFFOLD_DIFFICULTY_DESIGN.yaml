scaffold_difficulty_design:
  # ==================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ==================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: buyout_quote_vs_final_on_project
        grounds:
          - calculations.buyout_quote
          - calculations.buyout_final
        distinguishing_aspect: |
          The buyout has two variants (quote vs final) on the PROJECT entity;
          quote uses UNION_SCALE 65000 with no per-line-item rounding, final uses
          talent.base_session_fee_cents with union multiplier and per-line-item
          rounding. For a NON_UNION talent with base 60000, BROADCAST, 2 spots,
          term=null, quote=195000 while final=153000 — different numbers for the
          same project.
        test_recipe:
          setup:
            - "Client C exists"
            - "Talent T exists, NON_UNION, base_session_fee_cents=60000"
            - "Project P for C, usage_type=BROADCAST, spots_count=2, term_months=null, audition_deadline in future"
            - "P opened to CASTING (buyout_quote computed)"
            - "T submitted SelfAudition on P"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/clients"
              payload: { company_name: "Acme", contact_email: "c@acme.com", billing_email: "b@acme.com" }
              as: CastingDirector
              captures: { client_id: $.data.id }
            - call: "POST /api/talents"
              payload: { stage_name: "Vox", email: "v@t.com", voice_profile: "MALE_DEEP", languages: ["en"], union_status: "NON_UNION", base_session_fee_cents: 60000 }
              as: CastingDirector
              captures: { talent_id: $.data.id }
            - call: "POST /api/projects"
              payload: { client_id: "${client_id}", title: "Spots", product_category: "AUTOMOTIVE", usage_type: "BROADCAST", spots_count: 2, brief_text: "b", audition_deadline: "2026-08-10T00:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { project_id: $.data.id }
            - call: "POST /api/projects/${project_id}/open_casting"
              payload: {}
              as: CastingDirector
            - call: "POST /api/projects/${project_id}/self_auditions"
              payload: { talent_id: "${talent_id}", audio_file_url: "https://x/a.mp3" }
              as: Talent
              as_user_id: "${talent_id}"
              captures: { aud_id: $.data.id }
          trigger:
            - call: "POST /api/projects/${project_id}/select_talent"
              payload: { self_audition_id: "${aud_id}" }
              as: Client
              as_user_id: "${client_id}"
          assert:
            - "Project.buyout_quote_cents == 195000"
            - "Project.buyout_final_cents == 153000"
            - "Project.buyout_quote_cents != Project.buyout_final_cents"

      - name: session_fee_provisional_vs_final_on_session
        grounds:
          - calculations.session_fee_provisional_vs_final
        distinguishing_aspect: |
          Session fee has two variants on the SESSION entity (different entity
          domain from buyout). Provisional rounds duration up to 15-min blocks,
          no patch surcharge. Final uses actual elapsed time with 5-min
          granularity and applies a 25% patch surcharge. For a 45-min
          directed-patch session at studio rate 20000 cents/hr with 50 actual
          elapsed minutes: provisional=15000, final=20834.
        test_recipe:
          setup:
            - "Client, talent (UNION, base 80000), project CAST with selected talent, studio with has_directed_patch=true and hourly_rate_cents=20000"
            - "Session kind=PRIMARY, directed_patch=true, duration_minutes=45, start_at=2026-08-02T10:00:00Z, CONFIRMED"
            - "Clock advanced to 2026-08-02T10:50:00Z (50 minutes elapsed — past end_at 10:45)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/clients"
              payload: { company_name: "Acme", contact_email: "c@acme.com", billing_email: "b@acme.com" }
              as: CastingDirector
              captures: { client_id: $.data.id }
            - call: "POST /api/talents"
              payload: { stage_name: "Vox", email: "v@t.com", voice_profile: "MALE_DEEP", languages: ["en"], union_status: "UNION", base_session_fee_cents: 80000 }
              as: CastingDirector
              captures: { talent_id: $.data.id }
            - call: "POST /api/studios"
              payload: { studio_name: "S1", location: "LA", has_directed_patch: true, hourly_rate_cents: 20000, operating_tz: "America/Los_Angeles" }
              as: CastingDirector
              captures: { studio_id: $.data.id }
            - call: "POST /api/projects"
              payload: { client_id: "${client_id}", title: "P", product_category: "TECH", usage_type: "DIGITAL", spots_count: 1, brief_text: "b", audition_deadline: "2026-08-10T00:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { project_id: $.data.id }
            - call: "POST /api/projects/${project_id}/open_casting"
              payload: {}
              as: CastingDirector
            - call: "POST /api/projects/${project_id}/self_auditions"
              payload: { talent_id: "${talent_id}", audio_file_url: "https://x/a.mp3" }
              as: Talent
              as_user_id: "${talent_id}"
              captures: { aud_id: $.data.id }
            - call: "POST /api/projects/${project_id}/select_talent"
              payload: { self_audition_id: "${aud_id}" }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /api/projects/${project_id}/sessions"
              payload: { studio_id: "${studio_id}", session_kind: "PRIMARY", directed_patch: true, start_at: "2026-08-02T10:00:00Z", duration_minutes: 45 }
              as: CastingDirector
              captures: { session_id: $.data.id }
            - call: "POST /api/sessions/${session_id}/confirm"
              payload: {}
              as: CastingDirector
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T10:50:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/sessions/${session_id}/complete"
              payload: {}
              as: StudioEngineer
          assert:
            - "Session.status == COMPLETED"
            - "provisional fee at booking was 15000 (45 min rounds up to 45 in 15-min blocks → 45/60*20000=15000)"
            - "final billed amount == 20834 (elapsed 50 → billed 50; 50/60*20000=16666.67→round_half_up=16667; *1.25=20833.75→round_half_up=20834)"
            - "provisional != final"

  # ==================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ==================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: agent_commission_tiered_waterfall
        grounds:
          - calculations.agent_commission
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs and non-linear interaction — tiered
          rate selection keyed on buyout_final_cents crossed with union_status
          producing 5 distinct percentage outcomes (10/15/20/8/13/18 floored at
          5%). For UNION talent with buyout 400000, commission=8% → 32000.
        test_recipe:
          setup:
            - "Client C; Talent T UNION base 200000; Project usage_type=BROADCAST spots_count=1"
            - "buyout_final = 200000 * 2.50 * 1.00 = 500000 — exactly at Tier1/Tier2 boundary"
            - "Boundary is inclusive: 500000 falls in Tier2 (>= 500000)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/clients"
              payload: { company_name: "Acme", contact_email: "c@acme.com", billing_email: "b@acme.com" }
              as: CastingDirector
              captures: { client_id: $.data.id }
            - call: "POST /api/talents"
              payload: { stage_name: "Vox", email: "v@t.com", voice_profile: "MALE_DEEP", languages: ["en"], union_status: "UNION", base_session_fee_cents: 200000 }
              as: CastingDirector
              captures: { talent_id: $.data.id }
            - call: "POST /api/projects"
              payload: { client_id: "${client_id}", title: "P", product_category: "TECH", usage_type: "BROADCAST", spots_count: 1, brief_text: "b", audition_deadline: "2026-08-10T00:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { project_id: $.data.id }
            - call: "POST /api/projects/${project_id}/open_casting"
              payload: {}
              as: CastingDirector
            - call: "POST /api/projects/${project_id}/self_auditions"
              payload: { talent_id: "${talent_id}", audio_file_url: "https://x/a.mp3" }
              as: Talent
              as_user_id: "${talent_id}"
              captures: { aud_id: $.data.id }
          trigger:
            - call: "POST /api/projects/${project_id}/select_talent"
              payload: { self_audition_id: "${aud_id}" }
              as: Client
              as_user_id: "${client_id}"
          assert:
            - "Project.buyout_final_cents == 500000"
            - "UsageTerms.agent_commission_cents == 65000"
            - "UsageTerms.talent_payout_cents == 435000"

      - name: buyout_final_per_line_item_rounding
        grounds:
          - calculations.buyout_final
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — round per line item
          then sum is pinned. For NON_UNION talent base 33333, TERM 7 months,
          3 spots: line1=round(33333*1.7*0.85)=48166, line2=round(48166.0*0.4)=19266,
          total=67432. A sum-then-round order would give 67431 — one cent
          different. The scaffold pins per-line-item-then-sum.
        test_recipe:
          setup:
            - "Client C; Talent T NON_UNION base_session_fee_cents=33333"
            - "Project usage_type=TERM, term_months=7, spots_count=3"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/clients"
              payload: { company_name: "Acme", contact_email: "c@acme.com", billing_email: "b@acme.com" }
              as: CastingDirector
              captures: { client_id: $.data.id }
            - call: "POST /api/talents"
              payload: { stage_name: "Vox", email: "v@t.com", voice_profile: "MALE_DEEP", languages: ["en"], union_status: "NON_UNION", base_session_fee_cents: 33333 }
              as: CastingDirector
              captures: { talent_id: $.data.id }
            - call: "POST /api/projects"
              payload: { client_id: "${client_id}", title: "P", product_category: "TECH", usage_type: "TERM", term_months: 7, spots_count: 3, brief_text: "b", audition_deadline: "2026-08-10T00:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { project_id: $.data.id }
            - call: "POST /api/projects/${project_id}/open_casting"
              payload: {}
              as: CastingDirector
            - call: "POST /api/projects/${project_id}/self_auditions"
              payload: { talent_id: "${talent_id}", audio_file_url: "https://x/a.mp3" }
              as: Talent
              as_user_id: "${talent_id}"
              captures: { aud_id: $.data.id }
          trigger:
            - call: "POST /api/projects/${project_id}/select_talent"
              payload: { self_audition_id: "${aud_id}" }
              as: Client
              as_user_id: "${client_id}"
          assert:
            - "Project.buyout_final_cents == 67432"

  # ==================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ==================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: project_delivered_to_cast_cycle
        grounds:
          - state_machines.Project.DELIVERED_to_CAST
        distinguishing_aspect: |
          Project has a cyclic DELIVERED → CAST revision loop (cyclic shape).
          Reverting allows a retake session to be scheduled; no other entity
          in this scaffold has a cycle on Project.
        test_recipe:
          setup:
            - "Full pipeline: project CAST → session COMPLETED → delivery created (status=DELIVERED)"
            - "Clock is at delivered_at + 24h (within 72h revision window)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/clients"
              payload: { company_name: "Acme", contact_email: "c@acme.com", billing_email: "b@acme.com" }
              as: CastingDirector
              captures: { client_id: $.data.id }
            - call: "POST /api/talents"
              payload: { stage_name: "Vox", email: "v@t.com", voice_profile: "MALE_DEEP", languages: ["en"], union_status: "UNION", base_session_fee_cents: 80000 }
              as: CastingDirector
              captures: { talent_id: $.data.id }
            - call: "POST /api/studios"
              payload: { studio_name: "S1", location: "LA", has_directed_patch: false, hourly_rate_cents: 20000, operating_tz: "America/Los_Angeles" }
              as: CastingDirector
              captures: { studio_id: $.data.id }
            - call: "POST /api/projects"
              payload: { client_id: "${client_id}", title: "P", product_category: "TECH", usage_type: "DIGITAL", spots_count: 1, brief_text: "b", audition_deadline: "2026-08-10T00:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { project_id: $.data.id }
            - call: "POST /api/projects/${project_id}/open_casting"
              payload: {}
              as: CastingDirector
            - call: "POST /api/projects/${project_id}/self_auditions"
              payload: { talent_id: "${talent_id}", audio_file_url: "https://x/a.mp3" }
              as: Talent
              as_user_id: "${talent_id}"
              captures: { aud_id: $.data.id }
            - call: "POST /api/projects/${project_id}/select_talent"
              payload: { self_audition_id: "${aud_id}" }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /api/projects/${project_id}/sessions"
              payload: { studio_id: "${studio_id}", session_kind: "PRIMARY", directed_patch: false, start_at: "2026-08-02T10:00:00Z", duration_minutes: 60 }
              as: CastingDirector
              captures: { session_id: $.data.id }
            - call: "POST /api/sessions/${session_id}/confirm"
              payload: {}
              as: CastingDirector
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sessions/${session_id}/complete"
              payload: {}
              as: StudioEngineer
            - call: "POST /api/projects/${project_id}/deliveries"
              payload: { session_id: "${session_id}", file_url: "https://x/mix.wav" }
              as: StudioEngineer
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T11:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/projects/${project_id}/request_revision"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          assert:
            - "Project.status == CAST"
            - "Delivery.revision_requested == true"

      - name: self_audition_branching_shortlist_or_reject
        grounds:
          - state_machines.SelfAudition
        distinguishing_aspect: |
          SelfAudition has a branching fork shape: SUBMITTED can go to
          SHORTLISTED or REJECTED, and SHORTLISTED can still be REJECTED —
          divergent side-effect sets per branch. Different entity than Project.
        test_recipe:
          setup:
            - "Project in CASTING; three auditions A (SUBMITTED), B (SUBMITTED), C (SUBMITTED)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/clients"
              payload: { company_name: "Acme", contact_email: "c@acme.com", billing_email: "b@acme.com" }
              as: CastingDirector
              captures: { client_id: $.data.id }
            - call: "POST /api/talents"
              payload: { stage_name: "T1", email: "t1@x.com", voice_profile: "MALE_DEEP", languages: ["en"], union_status: "UNION", base_session_fee_cents: 80000 }
              as: CastingDirector
              captures: { t1_id: $.data.id }
            - call: "POST /api/talents"
              payload: { stage_name: "T2", email: "t2@x.com", voice_profile: "FEMALE_LIGHT", languages: ["en"], union_status: "UNION", base_session_fee_cents: 80000 }
              as: CastingDirector
              captures: { t2_id: $.data.id }
            - call: "POST /api/talents"
              payload: { stage_name: "T3", email: "t3@x.com", voice_profile: "NONBINARY", languages: ["en"], union_status: "UNION", base_session_fee_cents: 80000 }
              as: CastingDirector
              captures: { t3_id: $.data.id }
            - call: "POST /api/projects"
              payload: { client_id: "${client_id}", title: "P", product_category: "TECH", usage_type: "DIGITAL", spots_count: 1, brief_text: "b", audition_deadline: "2026-08-10T00:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { project_id: $.data.id }
            - call: "POST /api/projects/${project_id}/open_casting"
              payload: {}
              as: CastingDirector
            - call: "POST /api/projects/${project_id}/self_auditions"
              payload: { talent_id: "${t1_id}", audio_file_url: "https://x/1.mp3" }
              as: Talent
              as_user_id: "${t1_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /api/projects/${project_id}/self_auditions"
              payload: { talent_id: "${t2_id}", audio_file_url: "https://x/2.mp3" }
              as: Talent
              as_user_id: "${t2_id}"
              captures: { a2_id: $.data.id }
            - call: "POST /api/projects/${project_id}/self_auditions"
              payload: { talent_id: "${t3_id}", audio_file_url: "https://x/3.mp3" }
              as: Talent
              as_user_id: "${t3_id}"
              captures: { a3_id: $.data.id }
          trigger:
            - call: "POST /api/self_auditions/${a1_id}/shortlist"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /api/self_auditions/${a2_id}/reject"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /api/projects/${project_id}/select_talent"
              payload: { self_audition_id: "${a1_id}" }
              as: Client
              as_user_id: "${client_id}"
          assert:
            - "SelfAudition.${a1_id}.status == SELECTED"
            - "SelfAudition.${a2_id}.status == REJECTED"
            - "SelfAudition.${a3_id}.status == REJECTED"

  # ==================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ==================================================================
  - rule_id: transitive_cascade
    instances:
      - name: project_cancel_cascades_depth3
        grounds:
          - state_machines.Project.transitions
          - state_machines.ConflictExclusion
        distinguishing_aspect: |
          Depth-3 chain originating from POST /projects/{id}/cancel: Project →
          ConflictExclusion(RELEASED) → Talent.active_conflict_categories
          recomputed → affects future select_talent eligibility. Different
          trigger than the delivery chain.
        test_recipe:
          setup:
            - "Project P with exclusivity_required=true in CAST (ConflictExclusion ACTIVE on talent)"
            - "P cancelled"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/clients"
              payload: { company_name: "Acme", contact_email: "c@acme.com", billing_email: "b@acme.com" }
              as: CastingDirector
              captures: { client_id: $.data.id }
            - call: "POST /api/talents"
              payload: { stage_name: "Vox", email: "v@t.com", voice_profile: "MALE_DEEP", languages: ["en"], union_status: "UNION", base_session_fee_cents: 80000 }
              as: CastingDirector
              captures: { talent_id: $.data.id }
            - call: "POST /api/projects"
              payload: { client_id: "${client_id}", title: "P", product_category: "AUTOMOTIVE", usage_type: "TERM", term_months: 12, spots_count: 1, exclusivity_required: true, brief_text: "b", audition_deadline: "2026-08-10T00:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { project_id: $.data.id, p_ver: $.data.version }
            - call: "POST /api/projects/${project_id}/open_casting"
              payload: {}
              as: CastingDirector
            - call: "POST /api/projects/${project_id}/self_auditions"
              payload: { talent_id: "${talent_id}", audio_file_url: "https://x/a.mp3" }
              as: Talent
              as_user_id: "${talent_id}"
              captures: { aud_id: $.data.id }
            - call: "POST /api/projects/${project_id}/select_talent"
              payload: { self_audition_id: "${aud_id}" }
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /api/projects/${project_id}"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { p_ver_pre_cancel: $.data.version }
          trigger:
            - call: "POST /api/projects/${project_id}/cancel"
              payload: { expected_project_version: "${p_ver_pre_cancel}" }
              as: Client
              as_user_id: "${client_id}"
          assert:
            - "Project.status == CANCELLED"
            - "ConflictExclusion for (talent, AUTOMOTIVE) has status == RELEASED"
            - "Talent.active_conflict_categories does not contain AUTOMOTIVE"

      - name: delivery_triggers_invoice_and_window_chain
        grounds:
          - state_machines.Project.IN_SESSION_to_DELIVERED
          - state_machines.Invoice
        distinguishing_aspect: |
          Depth-2 chain originating from POST /projects/{id}/deliveries:
          Project DELIVERED → BUYOUT Invoice PENDING + SESSION_FEE Invoice
          PENDING created → on close, invoices → ISSUED with issued_at set.
          Different trigger than cancel chain.
        test_recipe:
          setup:
            - "Project with one COMPLETED PRIMARY session, no delivery yet"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/clients"
              payload: { company_name: "Acme", contact_email: "c@acme.com", billing_email: "b@acme.com" }
              as: CastingDirector
              captures: { client_id: $.data.id }
            - call: "POST /api/talents"
              payload: { stage_name: "Vox", email: "v@t.com", voice_profile: "MALE_DEEP", languages: ["en"], union_status: "UNION", base_session_fee_cents: 80000 }
              as: CastingDirector
              captures: { talent_id: $.data.id }
            - call: "POST /api/studios"
              payload: { studio_name: "S1", location: "LA", has_directed_patch: false, hourly_rate_cents: 20000, operating_tz: "America/Los_Angeles" }
              as: CastingDirector
              captures: { studio_id: $.data.id }
            - call: "POST /api/projects"
              payload: { client_id: "${client_id}", title: "P", product_category: "TECH", usage_type: "DIGITAL", spots_count: 1, brief_text: "b", audition_deadline: "2026-08-10T00:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { project_id: $.data.id }
            - call: "POST /api/projects/${project_id}/open_casting"
              payload: {}
              as: CastingDirector
            - call: "POST /api/projects/${project_id}/self_auditions"
