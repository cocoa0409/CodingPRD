          setup:
            - "An OPEN work order from a non-emergency quote: TRAP line qty2@6000, TRAP line qty1@5000, EXCLUSION qty1@9000 (provisional 26000). One trap (the qty2 TRAP line) is SET so its line becomes performed; nothing else performed."
