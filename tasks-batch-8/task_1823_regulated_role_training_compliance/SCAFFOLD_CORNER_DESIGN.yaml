        distinguishing_aspect: "Expiry boundary is INCLUSIVE (now >= expires_at): a sweep at exactly expires_at moves the assignment to EXPIRED and creates the RECURRENCE assignment for the VALIDITY_CYCLE requirement."
        test_recipe:
          setup:
            - "Regulator REG-EXP (CALENDAR); curriculum CUR-EXP ACTIVE (validity_months 1, NONE, 80)"
