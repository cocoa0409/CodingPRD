# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine Difficulty Rules from §0.5, two instances each = 18 instances.
# Every literal below was computed against the formulas in SCAFFOLD.yaml §1.3.
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: offer_fee_ladder_compound_versus_simple_variant_divergence
        grounds:
          - calculations.offer_projected_total_fee
          - entities.Offer.fields.year_rate_schedule_compound_cents
          - entities.Offer.fields.projected_total_fee_cents
          - entities.CarriageAgreement.fields.contract_year_rate_schedule_cents
          - state_machines.Offer.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          This instance exercises the dual variant on the OFFER/AGREEMENT FEE domain: the same
          base 250 / escalator 700bp / 36-month offer yields the compound ladder [250, 268, 287]
          when quoted during negotiation and the simple ladder [250, 268, 285] once executed, a
          2,400,000-cent whole-term divergence caused solely by whether year N escalates off the
          rounded year N-1 rate or off the unrounded base.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z startup default"
            - "One CBS station WXYZ with an ACTIVE affiliation permitting BROADCAST_BASIC and EXPANDED_BASIC, digital and streaming grantable, out-of-home not grantable"
            - "One CABLE distributor with BILLED_HOUSEHOLDS measurement and 240000 video households"
            - "A filed RETRANS_CONSENT election for the 2027-2029 cycle with a live negotiation"
            - "One subscriber report for period 2027-01 with 100000 reported subscribers and no free trials, so the billable basis is exactly 100000"
            - "One station-group offer at 250 cents, 700bp escalator, 36-month term, accepted into a carriage agreement"
          setup_api_calls:
            - call: "POST /retrans/stations"
              payload: { call_sign: "WXYZ", market_code: "SEA", dma_rank: 12, market_tv_households: 1800000, network_affiliation: "CBS" }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { st_id: "$.data.id" }
            - call: "POST /retrans/stations/${st_id}/affiliation-agreements"
              payload: { network_name: "CBS", term_end_utc: "2032-01-01T00:00:00Z", reverse_comp_floor_per_sub_cents: 90, split_premium_bp: 500, permitted_tiers: ["BROADCAST_BASIC", "EXPANDED_BASIC"], digital_rights_grantable: true, ooh_rights_grantable: false, streaming_rights_grantable: true }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { aff_id: "$.data.id" }
            - call: "POST /retrans/distributors"
              payload: { name: "Cascade Cable", distributor_type: "CABLE", subscriber_measurement_method: "BILLED_HOUSEHOLDS", video_household_count: 240000 }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { dist_id: "$.data.id" }
            - call: "POST /retrans/elections"
              payload: { station_id: "${st_id}", distributor_id: "${dist_id}", cycle_label: "2027-2029", election_type: "RETRANS_CONSENT", requested_tier: "EXPANDED_BASIC", incumbent_expiry_utc: "2027-01-01T00:00:00Z", incumbent_rate_per_sub_cents: 220 }
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
              captures: { el_id: "$.data.id" }
            - call: "POST /retrans/elections/${el_id}/file"
              payload: {}
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
            - call: "GET /retrans/elections/${el_id}/negotiations"
              payload: {}
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { neg_id: "$.data[0].id" }
            - call: "POST /retrans/subscriber-reports"
              payload: { station_id: "${st_id}", period_label: "2027-01", period_start_utc: "2027-01-01T00:00:00Z", period_end_utc: "2027-02-01T00:00:00Z", reported_subscriber_count: 100000, excluded_free_trial_count: 0 }
              as: DistributorRep
              as_user_id: "${dist_id}"
              captures: { rep_id: "$.data.id" }
            - call: "POST /retrans/negotiations/${neg_id}/offers"
              payload: { subscriber_report_id: "${rep_id}", base_rate_per_sub_cents: 250, escalator_bp_per_year: 700, term_months: 36, tier: "EXPANDED_BASIC", penetration_commitment_bp: 4200, includes_digital_rights: true, includes_ooh_rights: false, includes_streaming_rights: true }
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
              captures: { off_id: "$.data.id", off_total: "$.data.projected_total_fee_cents" }
            - call: "GET /retrans/negotiations/${neg_id}"
              payload: {}
              as: GroupCounsel
              as_user_id: "counsel-1"
              captures: { neg_v: "$.data.version" }
          trigger:
            - call: "POST /retrans/offers/${off_id}/accept"
              payload: { expected_negotiation_version: "${neg_v}", effective_start_utc: "2027-01-01T00:00:00Z", effective_end_utc: "2030-01-01T00:00:00Z" }
              as: GroupCounsel
              as_user_id: "counsel-1"
              captures: { agr_id: "$.data.id" }
            - call: "GET /retrans/agreements/${agr_id}/fee-projection"
              payload: {}
              as: GroupCounsel
              as_user_id: "counsel-1"
          assert:
            - "Offer.${off_id}.projection_basis_subscribers == 100000"
            - "Offer.${off_id}.year_rate_schedule_compound_cents == [250, 268, 287]"
            - "Offer.${off_id}.projected_total_fee_cents == 966000000"
            - "CarriageAgreement.${agr_id}.contract_year_rate_schedule_cents == [250, 268, 285]"
            - "CarriageAgreement.${agr_id}.current_year_rate_per_sub_cents == 250"
            - "GET /retrans/agreements/${agr_id}/fee-projection returns compound_total_fee_cents == 966000000"
            - "GET /retrans/agreements/${agr_id}/fee-projection returns simple_total_fee_cents == 963600000"
            - "GET /retrans/agreements/${agr_id}/fee-projection returns divergence_cents == 2400000"
            - "GET /retrans/agreements/${agr_id}/fee-projection returns year_rate_schedule_simple_cents == [250, 268, 285]"

      - name: subscriber_basis_as_reported_versus_audited_variant_divergence
        grounds:
          - calculations.subscriber_basis_determination
          - calculations.reverse_compensation_split
          - entities.SubscriberReport.fields.as_reported_basis
          - entities.SubscriberReport.fields.billable_subscriber_basis
          - entities.FeeSettlement.fields.basis_variant
          - state_machines.FeeSettlement.ISSUED_to_TRUED_UP
        distinguishing_aspect: |
          This instance exercises the dual variant on the SUBSCRIBER-REPORT BASIS domain, a
          different calculation and a different entity pair from the fee-ladder instance: the
          same report yields as_reported_basis 100000 and billable_subscriber_basis 106000 once
          a +6000 audit finding is substantiated, and switching a settlement from AS_REPORTED to
          AUDITED moves net_retained_cents from 11,250,000 to 11,925,000 (delta 675,000).
        test_recipe:
          setup:
            - "The full chain of offer_fee_ladder_compound_versus_simple_variant_divergence, carried through network approval and execution by a second counsel"
            - "One settlement issued for period 2027-01 against the AS_REPORTED basis of 100000"
            - "Clock advanced to 2027-03-01, still inside the report's audit window which closes 2027-07-31"
            - "One audit finding asserting +6000 undercounted subscribers, substantiated by compliance"
          setup_api_calls:
            - call: "POST /retrans/stations"
              payload: { call_sign: "WXYZ", market_code: "SEA", dma_rank: 12, market_tv_households: 1800000, network_affiliation: "CBS" }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { st_id: "$.data.id" }
            - call: "POST /retrans/stations/${st_id}/affiliation-agreements"
              payload: { network_name: "CBS", term_end_utc: "2032-01-01T00:00:00Z", reverse_comp_floor_per_sub_cents: 90, split_premium_bp: 500, permitted_tiers: ["BROADCAST_BASIC", "EXPANDED_BASIC"], digital_rights_grantable: true, ooh_rights_grantable: false, streaming_rights_grantable: true }
              as: CarriageAdmin
              as_user_id: "admin-1"
            - call: "POST /retrans/distributors"
              payload: { name: "Cascade Cable", distributor_type: "CABLE", subscriber_measurement_method: "BILLED_HOUSEHOLDS", video_household_count: 240000 }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { dist_id: "$.data.id" }
            - call: "POST /retrans/elections"
              payload: { station_id: "${st_id}", distributor_id: "${dist_id}", cycle_label: "2027-2029", election_type: "RETRANS_CONSENT", requested_tier: "EXPANDED_BASIC", incumbent_expiry_utc: "2027-01-01T00:00:00Z", incumbent_rate_per_sub_cents: 220 }
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
              captures: { el_id: "$.data.id" }
            - call: "POST /retrans/elections/${el_id}/file"
              payload: {}
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
            - call: "GET /retrans/elections/${el_id}/negotiations"
              payload: {}
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { neg_id: "$.data[0].id" }
            - call: "POST /retrans/subscriber-reports"
              payload: { station_id: "${st_id}", period_label: "2027-01", period_start_utc: "2027-01-01T00:00:00Z", period_end_utc: "2027-02-01T00:00:00Z", reported_subscriber_count: 100000, excluded_free_trial_count: 0 }
              as: DistributorRep
              as_user_id: "${dist_id}"
              captures: { rep_id: "$.data.id" }
            - call: "POST /retrans/negotiations/${neg_id}/offers"
              payload: { subscriber_report_id: "${rep_id}", base_rate_per_sub_cents: 250, escalator_bp_per_year: 700, term_months: 36, tier: "EXPANDED_BASIC", penetration_commitment_bp: 4200, includes_digital_rights: true, includes_ooh_rights: false, includes_streaming_rights: true }
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
              captures: { off_id: "$.data.id" }
            - call: "GET /retrans/negotiations/${neg_id}"
              payload: {}
              as: GroupCounsel
              as_user_id: "counsel-1"
              captures: { neg_v: "$.data.version" }
            - call: "POST /retrans/offers/${off_id}/accept"
              payload: { expected_negotiation_version: "${neg_v}", effective_start_utc: "2027-01-01T00:00:00Z", effective_end_utc: "2030-01-01T00:00:00Z" }
              as: GroupCounsel
              as_user_id: "counsel-1"
              captures: { agr_id: "$.data.id" }
            - call: "POST /retrans/agreements/${agr_id}/network-approval"
              payload: { decision: "APPROVE", decision_note: "Rights scope within affiliation grant" }
              as: NetworkRepresentative
              as_user_id: "netrep-1"
            - call: "POST /retrans/agreements/${agr_id}/execute"
              payload: { execution_note: "Countersigned by second counsel" }
              as: GroupCounsel
              as_user_id: "counsel-2"
            - call: "POST /retrans/agreements/${agr_id}/fee-settlements"
              payload: { period_label: "2027-01", period_start_utc: "2027-01-01T00:00:00Z", period_end_utc: "2027-02-01T00:00:00Z", subscriber_report_id: "${rep_id}" }
              as: GroupCounsel
              as_user_id: "counsel-1"
              captures: { set_id: "$.data.id", set_net_as_reported: "$.data.net_retained_cents" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: CarriageAdmin
              as_user_id: "admin-1"
            - call: "POST /retrans/subscriber-reports/${rep_id}/audit-findings"
              payload: { adjustment_subscribers: 6000, basis_note: "Bulk-billed MDU accounts omitted from the distributor feed" }
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
              captures: { find_id: "$.data.id" }
            - call: "POST /retrans/audit-findings/${find_id}/resolve"
              payload: { resolution: "SUBSTANTIATED", resolution_note: "Sampling confirms the omission" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
          trigger:
            - call: "POST /retrans/fee-settlements/${set_id}/true-up"
              payload: { true_up_note: "Re-settled against the audited basis" }
              as: GroupCounsel
              as_user_id: "counsel-1"
          assert:
            - "SubscriberReport.${rep_id}.as_reported_basis == 100000"
            - "SubscriberReport.${rep_id}.billable_subscriber_basis == 106000"
            - "SubscriberReport.${rep_id}.adjusted_subscriber_count == 106000"
            - "SubscriberReport.${rep_id}.audit_adjustment_subscribers == 6000"
            - "FeeSettlement.${set_id}.basis_variant == AUDITED"
            - "FeeSettlement.${set_id}.billable_subscriber_basis_snapshot == 106000"
            - "FeeSettlement.${set_id}.gross_fee_cents == 26500000"
            - "FeeSettlement.${set_id}.reverse_comp_cents == 14575000"
            - "FeeSettlement.${set_id}.penetration_penalty_cents == 0"
            - "FeeSettlement.${set_id}.net_retained_cents == 11925000"
            - "${set_net_as_reported} == 11250000 and the AUDITED re-settlement raises it by exactly 675000"
            - "FeeSettlement.${set_id}.true_up_required == false"
            - "CarriageAgreement.${agr_id}.lifetime_net_retained_cents == 11925000"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: offer_ladder_rounding_order_round_each_year_then_multiply
        grounds:
          - calculations.offer_projected_total_fee
          - entities.Offer.fields.year_rate_schedule_compound_cents
          - entities.Offer.fields.projected_total_fee_cents
          - entities.Offer.fields.term_months
        distinguishing_aspect: |
          Mode (b) — a nested computation whose result depends on WHERE rounding happens: with base
          250, escalator 700bp, a 30-month term (year_months [12, 12, 6]) and basis 100000, rounding
          each year's rate to whole cents before multiplying gives exactly 793,800,000, whereas
          carrying unrounded rates 250 / 267.5 / 286.225 through the multiplication and rounding the
          term total once gives 792,735,000 — a 1,065,000-cent spread from rounding order alone.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z startup default"
            - "One CBS station with an ACTIVE affiliation permitting EXPANDED_BASIC"
            - "One CABLE distributor with 240000 video households"
            - "A filed RETRANS_CONSENT election with a live negotiation"
            - "One subscriber report for 2027-01 with 100000 reported subscribers, so the projection basis is 100000"
          setup_api_calls:
            - call: "POST /retrans/stations"
              payload: { call_sign: "WXYZ", market_code: "SEA", dma_rank: 12, market_tv_households: 1800000, network_affiliation: "CBS" }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { st_id: "$.data.id" }
            - call: "POST /retrans/stations/${st_id}/affiliation-agreements"
              payload: { network_name: "CBS", term_end_utc: "2032-01-01T00:00:00Z", reverse_comp_floor_per_sub_cents: 90, split_premium_bp: 500, permitted_tiers: ["BROADCAST_BASIC", "EXPANDED_BASIC"], digital_rights_grantable: true, ooh_rights_grantable: false, streaming_rights_grantable: true }
              as: CarriageAdmin
              as_user_id: "admin-1"
            - call: "POST /retrans/distributors"
              payload: { name: "Cascade Cable", distributor_type: "CABLE", subscriber_measurement_method: "BILLED_HOUSEHOLDS", video_household_count: 240000 }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { dist_id: "$.data.id" }
            - call: "POST /retrans/elections"
              payload: { station_id: "${st_id}", distributor_id: "${dist_id}", cycle_label: "2027-2029", election_type: "RETRANS_CONSENT", requested_tier: "EXPANDED_BASIC", incumbent_expiry_utc: "2027-01-01T00:00:00Z", incumbent_rate_per_sub_cents: 220 }
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
              captures: { el_id: "$.data.id" }
            - call: "POST /retrans/elections/${el_id}/file"
              payload: {}
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
            - call: "GET /retrans/elections/${el_id}/negotiations"
              payload: {}
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { neg_id: "$.data[0].id" }
            - call: "POST /retrans/subscriber-reports"
              payload: { station_id: "${st_id}", period_label: "2027-01", period_start_utc: "2027-01-01T00:00:00Z", period_end_utc: "2027-02-01T00:00:00Z", reported_subscriber_count: 100000, excluded_free_trial_count: 0 }
              as: DistributorRep
              as_user_id: "${dist_id}"
              captures: { rep_id: "$.data.id" }
          trigger:
            - call: "POST /retrans/negotiations/${neg_id}/offers"
              payload: { subscriber_report_id: "${rep_id}", base_rate_per_sub_cents: 250, escalator_bp_per_year: 700, term_months: 30, tier: "EXPANDED_BASIC", penetration_commitment_bp: 4200, includes_digital_rights: true, includes_ooh_rights: false, includes_streaming_rights: true }
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
              captures: { off_id: "$.data.id" }
          assert:
            - "Offer.${off_id}.year_rate_schedule_compound_cents == [250, 268, 287]"
            - "Offer.${off_id}.projected_total_fee_cents == 793800000"
            - "Offer.${off_id}.projected_total_fee_cents != 792735000 (the value produced by rounding only the term total)"
            - "Offer.${off_id}.projected_total_fee_cents != 792600000 (the SIMPLE_ANNUAL total for the same inputs)"
            - "Offer.${off_id}.round_number == 1"
            - "Negotiation.${neg_id}.status == AWAITING_DISTRIBUTOR_RESPONSE"

      - name: reverse_comp_split_tier_keys_on_pre_credit_rate_not_on_net
        grounds:
          - calculations.reverse_compensation_split
          - calculations.penetration_shortfall_penalty
          - entities.FeeSettlement.fields.reverse_comp_split_bp
          - entities.FeeSettlement.fields.rights_credit_cents
          - entities.AffiliationAgreement.fields.split_premium_bp
          - state_machines.RightsDispute.RAISED_to_RESOLVED_EXCLUDED
        distinguishing_aspect: |
          Mode (c) — the split tier looks self-referential because the tier decides the network's
          share which decides what the station nets, and the formula pins the resolution: the tier
          keys on the PRE-CREDIT per-subscriber rate of 310 cents (tier 5500 + 500 premium, capped
          at 6000) and never on the post-credit base of 272 cents per subscriber, which would have
          selected 5500 bp and left the station 12,276,000 instead of the correct 10,912,000.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z startup default"
            - "One CBS station whose ACTIVE affiliation carries split_premium_bp 500 and a 90-cent per-subscriber reverse-comp floor"
            - "One CABLE distributor with 240000 video households"
            - "An EXECUTED carriage agreement whose accepted offer is 310 cents / 700bp / 36 months including digital and streaming rights"
            - "The STREAMING rights definition disputed and already resolved EXCLUDED, so a 1200bp rights credit applies"
            - "No settlement issued yet"
          setup_api_calls:
            - call: "POST /retrans/stations"
              payload: { call_sign: "WXYZ", market_code: "SEA", dma_rank: 12, market_tv_households: 1800000, network_affiliation: "CBS" }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { st_id: "$.data.id" }
            - call: "POST /retrans/stations/${st_id}/affiliation-agreements"
              payload: { network_name: "CBS", term_end_utc: "2032-01-01T00:00:00Z", reverse_comp_floor_per_sub_cents: 90, split_premium_bp: 500, permitted_tiers: ["BROADCAST_BASIC", "EXPANDED_BASIC"], digital_rights_grantable: true, ooh_rights_grantable: false, streaming_rights_grantable: true }
              as: CarriageAdmin
              as_user_id: "admin-1"
            - call: "POST /retrans/distributors"
              payload: { name: "Cascade Cable", distributor_type: "CABLE", subscriber_measurement_method: "BILLED_HOUSEHOLDS", video_household_count: 240000 }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { dist_id: "$.data.id" }
            - call: "POST /retrans/elections"
              payload: { station_id: "${st_id}", distributor_id: "${dist_id}", cycle_label: "2027-2029", election_type: "RETRANS_CONSENT", requested_tier: "EXPANDED_BASIC", incumbent_expiry_utc: "2027-01-01T00:00:00Z", incumbent_rate_per_sub_cents: 220 }
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
              captures: { el_id: "$.data.id" }
            - call: "POST /retrans/elections/${el_id}/file"
              payload: {}
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
            - call: "GET /retrans/elections/${el_id}/negotiations"
              payload: {}
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { neg_id: "$.data[0].id" }
            - call: "POST /retrans/subscriber-reports"
              payload: { station_id: "${st_id}", period_label: "2027-01", period_start_utc: "2027-01-01T00:00:00Z", period_end_utc: "2027-02-01T00:00:00Z", reported_subscriber_count: 100000, excluded_free_trial_count: 0 }
              as: DistributorRep
              as_user_id: "${dist_id}"
              captures: { rep_id: "$.data.id" }
            - call: "POST /retrans/negotiations/${neg_id}/offers"
              payload: { subscriber_report_id: "${rep_id}", base_rate_per_sub_cents: 310, escalator_bp_per_year: 700, term_months: 36, tier: "EXPANDED_BASIC", penetration_commitment_bp: 4200, includes_digital_rights: true, includes_ooh_rights: false, includes_streaming_rights: true }
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
              captures: { off_id: "$.data.id" }
            - call: "GET /retrans/negotiations/${neg_id}"
              payload: {}
              as: GroupCounsel
              as_user_id: "counsel-1"
              captures: { neg_v: "$.data.version" }
            - call: "POST /retrans/offers/${off_id}/accept"
              payload: { expected_negotiation_version: "${neg_v}", effective_start_utc: "2027-01-01T00:00:00Z", effective_end_utc: "2030-01-01T00:00:00Z" }
              as: GroupCounsel
              as_user_id: "counsel-1"
              captures: { agr_id: "$.data.id" }
            - call: "POST /retrans/agreements/${agr_id}/network-approval"
              payload: { decision: "APPROVE", decision_note: "Digital and streaming within grant" }
              as: NetworkRepresentative
              as_user_id: "netrep-1"
            - call: "POST /retrans/agreements/${agr_id}/execute"
              payload: { execution_note: "Countersigned by second counsel" }
              as: GroupCounsel
              as_user_id: "counsel-2"
            - call: "POST /retrans/agreements/${agr_id}/rights-disputes"
              payload: { disputed_term: "STREAMING", claimed_definition: "In-home authenticated app delivery only, excluding standalone virtual tiers" }
              as: DistributorRep
              as_user_id: "${dist_id}"
              captures: { disp_id: "$.data.id" }
            - call: "POST /retrans/rights-disputes/${disp_id}/resolve"
              payload: { resolution: "EXCLUDED", resolution_note: "Streaming carve-out sustained" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
          trigger:
            - call: "POST /retrans/agreements/${agr_id}/fee-settlements"
              payload: { period_label: "2027-01", period_start_utc: "2027-01-01T00:00:00Z", period_end_utc: "2027-02-01T00:00:00Z", subscriber_report_id: "${rep_id}" }
              as: GroupCounsel
              as_user_id: "counsel-1"
              captures: { set_id: "$.data.id" }
