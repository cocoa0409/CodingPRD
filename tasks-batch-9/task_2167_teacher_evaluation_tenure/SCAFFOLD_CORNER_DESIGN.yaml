            - "EvaluationCycle.${cyc_id}.status == SCHEDULING"

      - name: tenure_decision_by_the_recommender_is_rejected_then_a_second_admin_grants
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_TENURE_STATE_INVALID]
          - state_machines.Educator.PROBATIONARY_to_RECOMMENDED
          - state_machines.Educator.RECOMMENDED_to_TENURED
          - entities.Educator.fields.tenure_recommended_by_user_id
        distinguishing_aspect: "Deciding before a recommendation exists is a state violation (409); deciding with the same X-User-ID that issued the recommendation is a segregation-of-duties violation (403); only a second HrAdmin operator can move the educator RECOMMENDED to TENURED."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z; policy requiring 1 formal and 0 informal observations, tenure_required_years 3, tenure_min_consecutive_effective 1, evidence_min_artifacts 2."
