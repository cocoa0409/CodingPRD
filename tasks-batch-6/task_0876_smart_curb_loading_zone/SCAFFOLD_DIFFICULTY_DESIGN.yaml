            - { call: "POST /curb/reservations", payload: { permit_id: "${permit_b}", zone_id: "${z3}", start_utc: "2026-06-01T08:00:00Z", end_utc: "2026-06-01T08:45:00Z" }, as: Permittee, as_user_id: "${pm_id}", captures: { rb: $.data.id } }
