  - section: errors
    instances:
      - name: every_entity_family_has_its_own_not_found_code
        claim_type: triggerable
        grounds:
          - errors.ERR_PLAN_NOT_FOUND
          - errors.ERR_STRATEGY_NOT_FOUND
          - errors.ERR_WINDOW_NOT_FOUND
          - errors.ERR_ELECTION_NOT_FOUND
          - errors.ERR_QUOTE_NOT_FOUND
          - errors.ERR_AUDIT_NOT_FOUND
          - errors.ERR_TRANSFER_NOT_FOUND
          - errors.ERR_EXPERT_NOT_FOUND
          - errors.ERR_COMPLAINT_NOT_FOUND
          - errors.ERR_INSURER_NOT_FOUND
        distinguishing_aspect: |
          Ten addressable families, ten distinct 404 codes: the path id decides the
          code, and a request that is malformed in the body as well must still resolve
          the id first (the audit resolution below carries a valid body, the transfer
          review a valid one too, so nothing masks the 404). A shared generic
          ERR_NOT_FOUND fails this instance ten times over.
        test_recipe:
          setup:
            - "empty database with the clock pinned at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Regulator
              as_user_id: "regulator-01"
          trigger:
            - call: "GET /prt/plans/11111111-0000-4000-8000-000000000001"
              payload: {}
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
            - call: "POST /prt/strategies/11111111-0000-4000-8000-000000000002/submission"
              payload: {}
              as: Actuary
              as_user_id: "actuary-01"
            - call: "POST /prt/lump-sum-windows/11111111-0000-4000-8000-000000000003/opening"
              payload: {}
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "GET /prt/elections/11111111-0000-4000-8000-000000000004"
              payload: {}
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "GET /prt/quotes/11111111-0000-4000-8000-000000000005"
              payload: {}
              as: PlanFiduciary
              as_user_id: "fiduciary-01"
            - call: "POST /prt/benefit-audits/11111111-0000-4000-8000-000000000006/resolution"
              payload: { resolution: "ACCEPT_AS_IS" }
              as: Actuary
              as_user_id: "actuary-01"
            - call: "POST /prt/asset-transfers/11111111-0000-4000-8000-000000000007/insurer-review"
              payload: { insurer_decision: "ACCEPT" }
              as: InsurerRep
              as_user_id: "insurer-rep-01"
            - call: "GET /prt/independent-experts/11111111-0000-4000-8000-000000000008"
              payload: {}
              as: PlanFiduciary
              as_user_id: "fiduciary-01"
            - call: "GET /prt/complaints/11111111-0000-4000-8000-000000000009"
              payload: {}
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "GET /prt/insurers/11111111-0000-4000-8000-00000000000a"
              payload: {}
              as: Regulator
              as_user_id: "regulator-01"
          assert:
            - "the ten calls return 404 with error_id ERR_PLAN_NOT_FOUND, ERR_STRATEGY_NOT_FOUND, ERR_WINDOW_NOT_FOUND, ERR_ELECTION_NOT_FOUND, ERR_QUOTE_NOT_FOUND, ERR_AUDIT_NOT_FOUND, ERR_TRANSFER_NOT_FOUND, ERR_EXPERT_NOT_FOUND, ERR_COMPLAINT_NOT_FOUND and ERR_INSURER_NOT_FOUND respectively"
            - "every response has response_type == error with a non-empty message and no data payload beyond the error envelope"
            - "no rows exist in any table afterwards — a 404 write attempt creates nothing"

      - name: expert_with_a_disclosed_conflict_cannot_be_engaged
        claim_type: triggerable
        grounds:
          - errors.ERR_EXPERT_CONFLICT_DISCLOSED
          - state_machines.IndependentExpert.INDEPENDENCE_REVIEW_to_DISQUALIFIED
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: |
          A disclosed conflict is disqualifying, not advisory: proposing the expert
          succeeds (the disclosure is data, not a violation), and it is the ENGAGE
          decision that must be refused with ERR_EXPERT_CONFLICT_DISCLOSED while
          DISQUALIFY on the very same row succeeds. The proposer is also barred from
          reviewing, and that 403 is checked before the conflict 409.
        test_recipe:
          setup:
            - "one plan and one proposed expert carrying conflict_disclosed true"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
            - call: "POST /prt/plans"
              payload: { sponsor_name: "Ashcroft Machining", plan_name: "Ashcroft Salaried Plan", plan_ein: "231004556", total_liability_cents: 100000000, plan_assets_cents: 92000000, service_cost_cents: 3000000, interest_cost_cents: 9000000, unrecognized_actuarial_loss_cents: 4000000, discount_rate_bps: 500 }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
              captures: { plan_id: $.data.id }
            - call: "POST /prt/plans/${plan_id}/independent-experts"
              payload: { expert_firm_name: "Halloway Actuarial Partners", engagement_scope: "SAFEST_AVAILABLE_REVIEW", conflict_disclosed: true }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
              captures: { expert_id: $.data.id, expert_state: $.data.expert_status, proposer: $.data.proposed_by_user_id }
          trigger:
            - call: "POST /prt/independent-experts/${expert_id}/independence-review"
              payload: { review_decision: "ENGAGE" }
              as: PlanFiduciary
              as_user_id: "sponsor-treasury-01"
            - call: "POST /prt/independent-experts/${expert_id}/independence-review"
              payload: { review_decision: "ENGAGE" }
              as: PlanFiduciary
              as_user_id: "fiduciary-01"
            - call: "POST /prt/independent-experts/${expert_id}/opinion"
              payload: { safest_available_opinion: "AFFIRMATIVE" }
              as: IndependentExpertUser
              as_user_id: "${expert_id}"
            - call: "POST /prt/independent-experts/${expert_id}/independence-review"
              payload: { review_decision: "DISQUALIFY" }
              as: PlanFiduciary
              as_user_id: "fiduciary-01"
              captures: { final_state: $.data.expert_status }
          assert:
            - "the proposal itself returns 201 with expert_status == INDEPENDENCE_REVIEW and conflict_disclosed == true"
            - "the review attempted by the proposer wearing the PlanFiduciary role returns 403 ERR_SEGREGATION_OF_DUTIES — the identity check precedes the conflict check"
            - "the independent reviewer's ENGAGE returns 409 ERR_EXPERT_CONFLICT_DISCLOSED and the expert is still INDEPENDENCE_REVIEW"
            - "the opinion attempt returns 409 ERR_EXPERT_NOT_ENGAGED because the expert never reached ENGAGED"
            - "DISQUALIFY returns 200 with expert_status == DISQUALIFIED and reviewed_by_user_id == fiduciary-01"

      - name: quote_answer_errors_split_live_from_terminal_and_check_identity
        claim_type: triggerable
        grounds:
          - errors.ERR_QUOTE_NOT_REQUESTED
          - errors.ERR_QUOTE_STATE_INVALID
          - errors.ERR_IDENTITY_MISMATCH
          - state_machines.AnnuityQuote.REQUESTED_to_SUBMITTED
        distinguishing_aspect: |
          Three different refusals share one endpoint. A foreign insurer answering
          someone else's quote is ERR_IDENTITY_MISMATCH and that check runs before the
          body check, so a submission with no premium from the wrong insurer still
          yields the identity error. Answering a live-but-answered quote (SUBMITTED) is
          ERR_QUOTE_NOT_REQUESTED, while answering a terminal one (DECLINED) is
          ERR_QUOTE_STATE_INVALID — an implementation that collapses the two fails.
        test_recipe:
          setup:
            - "a QUOTING tranche with two registered insurers and one quote requested from each"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
