              as: BillingClerk
              captures: { batch_t2_v3: $.data.version }
          trigger:
            - call: "POST /bpo/payout-batches/${batch_t2}/approve"
              payload: { expected_batch_version: "${batch_t2_v3}" }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (DISBURSED is terminal)"
            - "PayoutBatch.${batch_t2}.status remains DISBURSED"

      - name: qc_verdict_approve_with_defects_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ValuationOrder.QC_REVIEW_to_ACCEPTED
