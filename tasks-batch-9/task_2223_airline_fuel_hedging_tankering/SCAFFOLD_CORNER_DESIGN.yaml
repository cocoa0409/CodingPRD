      - name: size_with_empty_matched_set_returns_422_no_forecast_basis
        claim_type: correct_result
        grounds:
          - calculations.consumption_basis_gallons
          - validations[priority=26]
          - errors[ERR_NO_FORECAST_BASIS]
          - state_machines.HedgeProgram.transitions
        distinguishing_aspect: |
          The empty-input-set boundary of the aggregation is an error, not a zero
          basis: a program whose route_groups is [LATAM] while the only PUBLISHED
          forecast is DOMESTIC_SHORT is refused with 422 ERR_NO_FORECAST_BASIS and
          stays DRAFT, rather than moving to SIZING with consumption_basis_gallons 0
          (which would make every coverage percentage 0.00 and pass every ceiling).
        test_recipe:
          setup:
            - "One ACTIVE HedgePolicy, one PUBLISHED DOMESTIC_SHORT forecast, and one DRAFT HedgeProgram whose route_groups is [LATAM]."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-CORNER", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 5.00, max_single_counterparty_pct: 100.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY", "WIDEBODY", "REGIONAL"] }
