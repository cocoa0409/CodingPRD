            - "after setup: DefaultNotice.${notice_id}.lessee_cure_deadline == 2026-08-31T00:00:00Z and mortgagee_cure_deadline == 2026-09-30T00:00:00Z"
            - "after trigger[1]: notice status == LESSEE_CURE_LAPSED and Lease.${lease_id}.rent_status is still BASE_ONLY - phase 3 did not flag this lease REVALUATION_DUE because that transition requires lease_status ACTIVE and the lease is IN_DEFAULT"
            - "after trigger[3]: notice status == MORTGAGEE_CURE_LAPSED and LeaseholdMortgage.${m1_id}.status is still NOTICE_SERVED"
            - "after trigger[4] level 1: Lease.${lease_id}.lease_status == TERMINATED and rent_status == FROZEN; DefaultNotice status == TERMINATION_EFFECTED with terminated_by_user_id 'am-1'"
            - "after trigger[4] level 2: TransferRequest.${sub_id}.status == TERMINATED_BY_REVERSION, PercentageRentStatement.${stmt_id}.status == VOID, EstoppelCertificate.${cert_id}.status == REVOKED, LeaseholdMortgage.${m1_id}.status == NEW_LEASE_ELIGIBLE with new_lease_election_deadline == 2026-10-31T00:00:00Z"
            - "after trigger[4] level 3: Lease.${lease_id}.percentage_rent_sublease_base_cents == 0 and GET /portfolio/leases/${lease_id}/rent-summary reports active_sublease_count 0"
