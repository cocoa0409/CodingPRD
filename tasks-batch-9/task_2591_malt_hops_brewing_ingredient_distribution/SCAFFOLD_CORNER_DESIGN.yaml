      - name: contracts_cannot_be_written_once_the_program_leaves_open
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=11]
          - errors.ERR_PROGRAM_NOT_OPEN
          - state_machines.CropYearProgram
        distinguishing_aspect: "Contract writing is gated on the program being exactly OPEN, so it stops at HARVEST_REPORTED — not only at SETTLED — which is what prevents a desk from selling poundage against a crop whose yield is already known."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer; Citra; an OPEN 2026 program with no contracts, so the harvest report allocates nothing and the program can settle immediately."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Closed Program Brewing", brewery_license_no: "BR-1026", credit_terms_days: 30, credit_limit_cents: 9000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { cp_id: $.data.id }
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2026, contract_open_date: "2026-01-15T00:00:00Z", harvest_report_due_date: "2026-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { cp_prog_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { cp_citra_id: $.data.id }
          trigger:
            - call: "POST /crop-year-programs/${cp_prog_id}/report-harvest"
              payload: { harvest_yield_pct: 95.00, reported_note: "no contracts on the book" }
              as: AllocationManager
              captures: { cp_status_reported: $.data.status, cp_pool: $.data.allocatable_pool_lbs }
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${cp_id}", variety_id: "${cp_citra_id}", crop_year_program_id: "${cp_prog_id}", contract_type: "FIXED_CROP_YEAR", contracted_lbs: 5000, price_per_lb_cents: 250.00, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-12-31T00:00:00Z" }
              as: AllocationManager
              captures: { cp_err_reported: $.data.error_id }
            - call: "POST /crop-year-programs/${cp_prog_id}/settle"
              payload: { settlement_note: "nothing outstanding" }
              as: AllocationManager
              captures: { cp_status_settled: $.data.status }
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${cp_id}", variety_id: "${cp_citra_id}", crop_year_program_id: "${cp_prog_id}", contract_type: "SPOT_HOLD", contracted_lbs: 1000, price_per_lb_cents: 250.00, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-12-31T00:00:00Z" }
              as: AllocationManager
              captures: { cp_err_settled: $.data.error_id }
          assert:
            - "${cp_status_reported} == HARVEST_REPORTED with ${cp_pool} == 0 and total_contracted_lbs == 0"
            - "contract against a HARVEST_REPORTED program: HTTP 409 with ${cp_err_reported} == ERR_PROGRAM_NOT_OPEN"
            - "${cp_status_settled} == SETTLED — settlement is unobstructed because no contract is CARRY_FORWARD_PENDING"
            - "contract against a SETTLED program: HTTP 409 with ${cp_err_settled} == ERR_PROGRAM_NOT_OPEN"
            - "CropYearProgram.${cp_prog_id}.settled_at == 2026-08-01T00:00:00Z and no HopContract row exists for the program"

      - name: requested_ship_date_must_sit_inside_the_closed_delivery_window
        claim_type: Temporal validation
        grounds:
          - validations[priority=27]
          - errors.ERR_SHIP_DATE_OUTSIDE_DELIVERY_WINDOW
          - entities.HopContract.fields.delivery_window_end
        distinguishing_aspect: "The window is a CLOSED interval checked at confirm rather than at line creation, so a ship date one day before the window is refused after the line was happily accepted, while a ship date landing exactly on delivery_window_end confirms."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Certified brewer with credit_limit_cents 9000000; OPEN 2026 program; Citra; a 5000 lb FIXED_CROP_YEAR contract at 250.00 with window 2026-09-01 .. 2026-12-31."
            - "Order EARLY requests 2026-08-31 and order EDGE requests 2026-12-31; both carry one 1000 lb CONTRACT line."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Delivery Window Brewing", brewery_license_no: "BR-1027", credit_terms_days: 30, credit_limit_cents: 9000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
