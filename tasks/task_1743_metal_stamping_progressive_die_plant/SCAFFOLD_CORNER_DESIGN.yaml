      - name: planner_cannot_record_audit
        claim_type: role_denial
        grounds: ["roles.ProductionPlanner", "roles.QualityEngineer"]
        distinguishing_aspect: "ProductionPlanner recording an audit result is denied (segregation of quality duties)."
        test_recipe:
          setup: ["press + PENDING audit"]
          setup_api_calls:
            - call: "POST /api/presses"
              payload: { press_code: "PR-RBAC", tonnage: 500, bed_width_mm: 2500, strokes_per_min: 40 }
