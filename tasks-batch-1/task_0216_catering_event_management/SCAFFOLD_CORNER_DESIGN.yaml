scaffold_corner_design:

  # =====================================================================
  # Entities
  # =====================================================================
  - section: entities
    instances:
      - name: create_client_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Client, endpoints]
        distinguishing_aspect: "POST /catering/clients with required fields returns 201 and a Client whose status defaults to ACTIVE, tax_exempt to false, gratuity_policy to INCLUDED, version to 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /catering/clients"
              payload: { company_name: "Acme", billing_email: "a@x.com" }
              as: CateringAdmin
              captures: { cli_id: $.data.id }
          assert:
            - "Client.${cli_id}.status == ACTIVE"
            - "Client.${cli_id}.tax_exempt == false"
            - "Client.${cli_id}.gratuity_policy == INCLUDED"
            - "Client.${cli_id}.version == 1"

      - name: get_order_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Order, endpoints]
        distinguishing_aspect: "GET /catering/orders/{id} returns the order with both lifecycle_status=DRAFT and settlement_status=UNBILLED for a freshly created order."
        test_recipe:
          setup: ["A draft order exists."]
          setup_api_calls:
            - call: "POST /catering/packages"
              payload: { name: "Gala", per_head_cents: 5000, min_headcount: 1, lead_time_hours: 24 }
              as: CateringAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /catering/venues"
              payload: { name: "Hall", tax_rate_bps: 875, service_fee_bps: 2000, max_overlapping_events: 5 }
              as: CateringAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /catering/clients"
              payload: { company_name: "Acme", billing_email: "a@x.com" }
              as: CateringAdmin
              captures: { cli_id: $.data.id }
            - call: "POST /catering/orders"
              payload: { client_id: "${cli_id}", package_id: "${pkg_id}", venue_id: "${venue_id}", booked_headcount: 80, event_start: "2026-09-01T17:00:00Z", event_end: "2026-09-01T22:00:00Z" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "GET /catering/orders/${ord_id}"
              payload: {}
              as: SalesCoordinator
          assert:
            - "Order.${ord_id}.lifecycle_status == DRAFT"
            - "Order.${ord_id}.settlement_status == UNBILLED"

      - name: list_packages_returns_paginated_envelope
        claim_type: Listing
        grounds: [entities.EventPackage, endpoints]
        distinguishing_aspect: "GET /catering/packages returns a paginated array with meta envelope and pagination fields total_count and has_more."
        test_recipe:
          setup: ["Two packages exist."]
          setup_api_calls:
            - call: "POST /catering/packages"
              payload: { name: "Gala", per_head_cents: 5000, min_headcount: 1, lead_time_hours: 24 }
              as: CateringAdmin
            - call: "POST /catering/packages"
              payload: { name: "Brunch", per_head_cents: 3000, min_headcount: 1, lead_time_hours: 12 }
              as: CateringAdmin
          trigger:
            - call: "GET /catering/packages"
              payload: {}
              as: SalesCoordinator
          assert:
            - "response_type == array"
            - "total_count == 2 and has_more == false"

      - name: get_order_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Order, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /catering/orders/{id} with a random non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /catering/orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SalesCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: create_order_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Order, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /catering/orders omitting required booked_headcount returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A package, venue, client exist."]
          setup_api_calls:
            - call: "POST /catering/packages"
              payload: { name: "Gala", per_head_cents: 5000, min_headcount: 1, lead_time_hours: 24 }
              as: CateringAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /catering/venues"
              payload: { name: "Hall", tax_rate_bps: 875, service_fee_bps: 2000, max_overlapping_events: 5 }
              as: CateringAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /catering/clients"
              payload: { company_name: "Acme", billing_email: "a@x.com" }
              as: CateringAdmin
              captures: { cli_id: $.data.id }
          trigger:
            - call: "POST /catering/orders"
              payload: { client_id: "${cli_id}", package_id: "${pkg_id}", venue_id: "${venue_id}", event_start: "2026-09-01T17:00:00Z", event_end: "2026-09-01T22:00:00Z" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: client_tax_exempt_default_applied_when_omitted
        claim_type: Defaults
        grounds: [entities.Client.fields.tax_exempt]
        distinguishing_aspect: "Omitting tax_exempt on POST /catering/clients yields tax_exempt == false (the declared default)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /catering/clients"
              payload: { company_name: "Beta", billing_email: "b@x.com" }
              as: CateringAdmin
              captures: { cli_id: $.data.id }
          assert:
            - "Client.${cli_id}.tax_exempt == false"

      - name: order_id_and_version_are_system_generated_input_ignored
        claim_type: System Fields
        grounds: [entities.Order.fields.id, entities.Order.fields.version]
        distinguishing_aspect: "Server mints Order.id (UUID, no prefix) and sets version=1; client-supplied id/version in the body are ignored (id is not echoed from input)."
        test_recipe:
          setup: ["A package, venue, client exist."]
          setup_api_calls:
            - call: "POST /catering/packages"
              payload: { name: "Gala", per_head_cents: 5000, min_headcount: 1, lead_time_hours: 24 }
              as: CateringAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /catering/venues"
              payload: { name: "Hall", tax_rate_bps: 875, service_fee_bps: 2000, max_overlapping_events: 5 }
              as: CateringAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /catering/clients"
              payload: { company_name: "Acme", billing_email: "a@x.com" }
              as: CateringAdmin
              captures: { cli_id: $.data.id }
          trigger:
            - call: "POST /catering/orders"
              payload: { client_id: "${cli_id}", package_id: "${pkg_id}", venue_id: "${venue_id}", booked_headcount: 80, event_start: "2026-09-01T17:00:00Z", event_end: "2026-09-01T22:00:00Z" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { ord_id: $.data.id }
          assert:
            - "Order.${ord_id}.version == 1"
            - "Order.${ord_id}.lifecycle_status == DRAFT"

      - name: add_on_invalid_kind_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.AddOnLine.fields.kind, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /catering/orders/{id}/add-ons with kind='CATERING' (not in {DELIVERY,SETUP,STAFFING}) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A draft order exists."]
          setup_api_calls:
            - call: "POST /catering/packages"
              payload: { name: "Gala", per_head_cents: 5000, min_headcount: 1, lead_time_hours: 24 }
              as: CateringAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /catering/venues"
              payload: { name: "Hall", tax_rate_bps: 875, service_fee_bps: 2000, max_overlapping_events: 5 }
              as: CateringAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /catering/clients"
              payload: { company_name: "Acme", billing_email: "a@x.com" }
              as: CateringAdmin
              captures: { cli_id: $.data.id }
            - call: "POST /catering/orders"
              payload: { client_id: "${cli_id}", package_id: "${pkg_id}", venue_id: "${venue_id}", booked_headcount: 80, event_start: "2026-09-01T17:00:00Z", event_end: "2026-09-01T22:00:00Z" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /catering/orders/${ord_id}/add-ons"
              payload: { kind: "CATERING", unit_cents: 5000, quantity: 1 }
              as: Client
              as_user_id: "${cli_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: ledger_entry_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.DepositLedgerEntry]
        distinguishing_aspect: "DepositLedgerEntry has common_fields:false — it carries only id and created_at (no version, no update endpoint); the ledger is append-only and entries are never mutated."
        test_recipe:
          setup: ["A confirmed order has one DEPOSIT_HOLD ledger entry."]
          setup_api_calls:
            - call: "POST /catering/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CateringAdmin
            - call: "POST /catering/packages"
              payload: { name: "Gala", per_head_cents: 5000, min_headcount: 1, lead_time_hours: 24 }
              as: CateringAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /catering/venues"
              payload: { name: "Hall", tax_rate_bps: 875, service_fee_bps: 2000, max_overlapping_events: 5 }
              as: CateringAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /catering/clients"
              payload: { company_name: "Acme", billing_email: "a@x.com" }
              as: CateringAdmin
              captures: { cli_id: $.data.id }
            - call: "POST /catering/orders"
              payload: { client_id: "${cli_id}", package_id: "${pkg_id}", venue_id: "${venue_id}", booked_headcount: 80, event_start: "2026-09-01T17:00:00Z", event_end: "2026-09-01T22:00:00Z" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { ord_id: $.data.id, ord_v: $.data.version }
            - call: "POST /catering/orders/${ord_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: SalesCoordinator
          trigger:
            - call: "GET /catering/orders/${ord_id}/ledger"
              payload: {}
              as: SalesCoordinator
          assert:
            - "ledger list has exactly 1 entry of entry_type DEPOSIT_HOLD"
            - "each ledger entry exposes id and created_at but no version field"

      - name: create_order_with_nonexistent_package_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Order.fields.package_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /catering/orders referencing a non-existent package_id returns ERR_NOT_FOUND (404); FK existence validated."
        test_recipe:
          setup: ["A venue and client exist; package_id is random."]
          setup_api_calls:
            - call: "POST /catering/venues"
              payload: { name: "Hall", tax_rate_bps: 875, service_fee_bps: 2000, max_overlapping_events: 5 }
              as: CateringAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /catering/clients"
              payload: { company_name: "Acme", billing_email: "a@x.com" }
              as: CateringAdmin
              captures: { cli_id: $.data.id }
          trigger:
            - call: "POST /catering/orders"
              payload: { client_id: "${cli_id}", package_id: "11111111-1111-4111-8111-111111111111", venue_id: "${venue_id}", booked_headcount: 80, event_start: "2026-09-01T17:00:00Z", event_end: "2026-09-01T22:00:00Z" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: order_event_end_before_start_returns_validation_window
        claim_type: Type Constraints
        grounds: [entities.Order.fields.event_end, "errors[ERR_VALIDATION_WINDOW]"]
        distinguishing_aspect: "POST /catering/orders with event_end <= event_start returns ERR_VALIDATION_WINDOW (422)."
        test_recipe:
          setup: ["A package, venue, client exist."]
          setup_api_calls:
            - call: "POST /catering/packages"
              payload: { name: "Gala", per_head_cents: 5000, min_headcount: 1, lead_time_hours: 24 }
              as: CateringAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /catering/venues"
              payload: { name: "Hall", tax_rate_bps: 875, service_fee_bps: 2000, max_overlapping_events: 5 }
              as: CateringAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /catering/clients"
              payload: { company_name: "Acme", billing_email: "a@x.com" }
              as: CateringAdmin
              captures: { cli_id: $.data.id }
          trigger:
            - call: "POST /catering/orders"
              payload: { client_id: "${cli_id}", package_id: "${pkg_id}", venue_id: "${venue_id}", booked_headcount: 80, event_start: "2026-09-01T22:00:00Z", event_end: "2026-09-01T17:00:00Z" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION_WINDOW"

  # =====================================================================
  # State machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: confirm_from_already_confirmed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Order.DRAFT_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Confirming an order already in lifecycle CONFIRMED returns ERR_INVALID_STATE; no second deposit hold, no second staffing reservation."
        test_recipe:
          setup: ["A confirmed order."]
          setup_api_calls:
            - call: "POST /catering/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CateringAdmin
            - call: "POST /catering/packages"
              payload: { name: "Gala", per_head_cents: 5000, min_headcount: 1, lead_time_hours: 24 }
              as: CateringAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /catering/venues"
              payload: { name: "Hall", tax_rate_bps: 875, service_fee_bps: 2000, max_overlapping_events: 5 }
              as: CateringAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /catering/clients"
              payload: { company_name: "Acme", billing_email: "a@x.com" }
              as: CateringAdmin
              captures: { cli_id: $.data.id }
            - call: "POST /catering/orders"
              payload: { client_id: "${cli_id}", package_id: "${pkg_id}", venue_id: "${venue_id}", booked_headcount: 80, event_start: "2026-09-01T17:00:00Z", event_end: "2026-09-01T22:00:00Z" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { ord_id: $.data.id, ord_v: $.data.version }
            - call: "POST /catering/orders/${ord_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: SalesCoordinator
              captures: { ord_v2: $.data.version }
          trigger:
            - call: "POST /catering/orders/${ord_id}/confirm"
              payload: { expected_order_version: "${ord_v2}" }
              as: SalesCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Order.${ord_id}.lifecycle_status == CONFIRMED"

      - name: new_order_starts_in_draft_and_unbilled
        claim_type: Initial State
        grounds: [entities.Order.fields.lifecycle_status, entities.Order.fields.settlement_status]
        distinguishing_aspect: "A newly created Order initializes lifecycle_status=DRAFT and settlement_status=UNBILLED (both initial states of the two parallel dimensions)."
        test_recipe:
          setup: ["A package, venue, client exist."]
          setup_api_calls:
            - call: "POST /catering/packages"
              payload: { name: "Gala", per_head_cents: 5000, min_headcount: 1, lead_time_hours: 24 }
              as: CateringAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /catering/venues"
              payload: { name: "Hall", tax_rate_bps: 875, service_fee_bps: 2000, max_overlapping_events: 5 }
              as: CateringAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /catering/clients"
              payload: { company_name: "Acme", billing_email: "a@x.com" }
              as: CateringAdmin
              captures: { cli_id: $.data.id }
          trigger:
            - call: "POST /catering/orders"
              payload: { client_id: "${cli_id}", package_id: "${pkg_id}", venue_id: "${venue_id}", booked_headcount: 80, event_start: "2026-09-01T17:00:00Z", event_end: "2026-09-01T22:00:00Z" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { ord_id: $.data.id }
          assert:
            - "Order.${ord_id}.lifecycle_status == DRAFT"
            - "Order.${ord_id}.settlement_status == UNBILLED"

      - name: cancel_from_cancelled_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Order.DRAFT_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an order already in terminal CANCELLED returns ERR_INVALID_STATE; no transitions leave a terminal state."
        test_recipe:
          setup: ["A draft order cancelled."]
          setup_api_calls:
            - call: "POST /catering/packages"
              payload: { name: "Gala", per_head_cents: 5000, min_headcount: 1, lead_time_hours: 24 }
              as: CateringAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /catering/venues"
              payload: { name: "Hall", tax_rate_bps: 875, service_fee_bps: 2000, max_overlapping_events: 5 }
              as: CateringAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /catering/clients"
              payload: { company_name: "Acme", billing_email: "a@x.com" }
              as: CateringAdmin
              captures: { cli_id: $.data.id }
            - call: "POST /catering/orders"
              payload: { client_id: "${cli_id}", package_id: "${pkg_id}", venue_id: "${venue_id}", booked_headcount: 80, event_start: "2026-09-01T17:00:00Z", event_end: "2026-09-01T22:00:00Z" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { ord_id: $.data.id, ord_v: $.data.version }
            - call: "POST /catering/orders/${ord_id}/cancel"
              payload: { expected_order_version: "${ord_v}" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { ord_v2: $.data.version }
          trigger:
            - call: "POST /catering/orders/${ord_id}/cancel"
              payload: { expected_order_version: "${ord_v2}" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Order.${ord_id}.lifecycle_status == CANCELLED"

      - name: deliver_leg_marks_route_closed_when_all_delivered
        claim_type: Side Effect Execution
        grounds: [state_machines.DeliveryLeg.DISPATCHED_to_DELIVERED, calculations.route_posture, entities.ServiceRoute.fields.posture]
        distinguishing_aspect: "Delivering the only leg on a route transitions the route posture to CLOSED (all legs DELIVERED); dispatched_leg_count remains 1 (DELIVERED counts)."
        test_recipe:
          setup: ["Guaranteed order, route cap 3, single leg dispatched."]
          setup_api_calls:
            - call: "POST /catering/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CateringAdmin
            - call: "POST /catering/packages"
              payload: { name: "Gala", per_head_cents: 5000, min_headcount: 1, lead_time_hours: 24 }
              as: CateringAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /catering/venues"
              payload: { name: "Hall", tax_rate_bps: 875, service_fee_bps: 2000, max_overlapping_events: 5 }
              as: CateringAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /catering/routes"
              payload: { route_date: "2026-09-01T00:00:00Z", vehicle_capacity_legs: 3 }
              as: CateringAdmin
              captures: { route_id: $.data.id }
            - call: "POST /catering/clients"
              payload: { company_name: "Acme", billing_email: "a@x.com" }
              as: CateringAdmin
              captures: { cli_id: $.data.id }
            - call: "POST /catering/orders"
              payload: { client_id: "${cli_id}", package_id: "${pkg_id}", venue_id: "${venue_id}", booked_headcount: 80, event_start: "2026-09-01T17:00:00Z", event_end: "2026-09-01T22:00:00Z" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { ord_id: $.data.id, ord_v: $.data.version }
            - call: "POST /catering/orders/${ord_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: SalesCoordinator
              captures: { ord_v2: $.data.version }
            - call: "POST /catering/orders/${ord_id}/guarantee"
              payload: { expected_order_version: "${ord_v2}", guaranteed_headcount: 80 }
              as: SalesCoordinator
            - call: "POST /catering/delivery-legs"
              payload: { order_id: "${ord_id}", route_id: "${route_id}", window_start: "2026-09-01T15:00:00Z", window_end: "2026-09-01T16:00:00Z" }
              as: SalesCoordinator
              captures: { leg_id: $.data.id }
            - call: "GET /catering/routes/${route_id}"
              payload: {}
              as: EventCaptain
              captures: { route_v: $.data.version }
            - call: "POST /catering/delivery-legs/${leg_id}/dispatch"
              payload: { expected_route_version: "${route_v}" }
              as: EventCaptain
              captures: { route_v2: $.data.version }
          trigger:
            - call: "POST /catering/delivery-legs/${leg_id}/deliver"
              payload: { expected_route_version: "${route_v2}" }
              as: EventCaptain
          assert:
            - "DeliveryLeg.${leg_id}.stop_status == DELIVERED"
            - "ServiceRoute.${route_id}.posture == CLOSED"
            - "ServiceRoute.${route_id}.dispatched_leg_count == 1"

      - name: dispatch_second_call_idempotency_rejected
        claim_type: Idempotency
        grounds: [state_machines.DeliveryLeg.PLANNED_to_DISPATCHED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Dispatching a leg already DISPATCHED returns ERR_INVALID_STATE; dispatched_leg_count is not double-incremented."
        test_recipe:
          setup: ["Guaranteed order, route cap 3, one leg already dispatched."]
          setup_api_calls:
            - call: "POST /catering/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
