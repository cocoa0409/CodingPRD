              as: PlantManager
              captures: { r_id: $.data.id }
            - { call: "POST /plant/recipes/${r_id}/components", payload: { component_name: "Sauce", component_type: "RAW_INGREDIENT", quantity_per_base_batch: 50, unit_of_measure: "KG" }, as: PlantManager }
            - { call: "POST /plant/recipes/${r_id}/approve", payload: {}, as: PlantManager }
            - call: "POST /plant/production-orders"
              payload: { recipe_id: "${r_id}", pack_format: "RETAIL", units_planned: 6000 }
              as: ProductionPlanner
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /plant/production-orders/${o_id}/batches"
              payload: { units_planned: 6000, expected_order_version: "${o_v}" }
              as: ProductionPlanner
              captures: { b_id: $.data.id }
            - { call: "POST /plant/production-batches/${b_id}/kit", payload: {}, as: LineOperator }
            - { call: "POST /plant/packaging-lines", payload: { line_code: "L-1", line_type: "TRAY", rate_units_per_minute: 100, supported_film_type: "TRAY_FILM" }, as: PlantManager, captures: { l_id: $.data.id } }
            - { call: "POST /plant/packaging-lines", payload: { line_code: "L-2", line_type: "TRAY", rate_units_per_minute: 100, supported_film_type: "TRAY_FILM" }, as: PlantManager, captures: { l2_id: $.data.id } }
            - { call: "POST /plant/film-lots", payload: { film_type: "TRAY_FILM", rolls_received: 10, meters_per_roll: 1000 }, as: PlantManager, captures: { f_id: $.data.id } }
            - { call: "POST /plant/film-lots", payload: { film_type: "TRAY_FILM", rolls_received: 10, meters_per_roll: 1000 }, as: PlantManager, captures: { f2_id: $.data.id } }
            - { call: "POST /plant/packaging-lines/${l_id}/runs", payload: { batch_id: "${b_id}", film_lot_id: "${f_id}", planned_start: "2026-08-03T08:00:00Z", units_planned: 600 }, as: ProductionPlanner }
            - { call: "POST /plant/packaging-lines/${l2_id}/runs", payload: { batch_id: "${b_id}", film_lot_id: "${f_id}", planned_start: "2026-08-03T08:00:00Z", units_planned: 600 }, as: ProductionPlanner }
            - { call: "POST /plant/packaging-lines/${l_id}/runs", payload: { batch_id: "${b_id}", film_lot_id: "${f2_id}", planned_start: "2026-08-03T08:21:00Z", units_planned: 600 }, as: ProductionPlanner }
          trigger:
            - call: "GET /plant/line-runs?film_lot_id=${f_id}"
              payload: {}
              as: ProductionPlanner
            - call: "GET /plant/line-runs?batch_id=${b_id}"
              payload: {}
              as: ProductionPlanner
          assert:
            - "filter film_lot_id == F: total_count == 2"
            - "filter batch_id == B: total_count == 3"

  # ============================================================ errors
  - section: errors
    instances:
      - name: every_error_is_triggerable
        claim_type: violation_to_error
        grounds: [errors]
        distinguishing_aspect: "All 33 catalog errors are exercised across §1.8 and §1.9: auth (UNAUTHENTICATED/FORBIDDEN_ROLE/SEGREGATION/CROSS_CUSTOMER), shape/existence/OCC, per-entity state errors, safety (CCP/film quarantine), temporal (window conflicts, expiry), constraints (capacity, min load, formats, film, storage, temperature, cases, recipe BOM), and fiscal (complaint units)."
        excluded_because:
          difficulty_instance: release_rejected_lot_state_beats_safety
          rationale: "Coverage is distributed: each error id has at least one dedicated trigger instance in §1.8 or §1.9 (see grounds references throughout); no single test needed."

  # ============================================================ cross-cutting layers
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_on_batch_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[batch-create-stale-order]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Batch creation carries expected_order_version: after a first batch advances the order to version 2, a second create still carrying version 1 is rejected 412; retrying with the fresh version succeeds."
        test_recipe:
          setup: ["APPROVED recipe; order O (version 1)"]
          setup_api_calls:
            - call: "POST /plant/recipes"
              payload: { name: "R-OCC1", product_style: "ENTREE", base_batch_yield_units: 1000, portion_weight_g: 340, shelf_life_days: 365 }
              as: PlantManager
              captures: { r_id: $.data.id }
            - { call: "POST /plant/recipes/${r_id}/components", payload: { component_name: "Sauce", component_type: "RAW_INGREDIENT", quantity_per_base_batch: 50, unit_of_measure: "KG" }, as: PlantManager }
            - { call: "POST /plant/recipes/${r_id}/approve", payload: {}, as: PlantManager }
            - call: "POST /plant/production-orders"
              payload: { recipe_id: "${r_id}", pack_format: "RETAIL", units_planned: 12000 }
              as: ProductionPlanner
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /plant/production-orders/${o_id}/batches"
              payload: { units_planned: 6000, expected_order_version: "${o_v}" }
              as: ProductionPlanner
              captures: { b1_id: $.data.id }
          trigger:
            - call: "POST /plant/production-orders/${o_id}/batches"
              payload: { units_planned: 6000, expected_order_version: "${o_v}" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
            - call: "GET /plant/production-orders/${o_id}"
              payload: {}
              as: ProductionPlanner
              captures: { o_v2: $.data.version }
            - call: "POST /plant/production-orders/${o_id}/batches"
              payload: { units_planned: 6000, expected_order_version: "${o_v2}" }
              as: ProductionPlanner
              captures: { b2_id: $.data.id }
          assert:
            - "stale expected_order_version (1, after the order advanced to 2): ERR_STALE_VERSION, http 412"
            - "fresh expected_order_version == ${o_v2} (2): batch created"
            - "order version increments by exactly 1 per successful batch creation"

      - name: occ_stale_version_on_cycle_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[cycle-create-stale-batch]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Cycle creation OCC-checks the batch: the version captured at batch creation (1) is stale after kit/cook advance it to 3, so the create is rejected 412; the fresh version succeeds."
        test_recipe:
          setup: ["batch B created (version 1 captured), then kitted and cooked (version now 3); cell FC-1"]
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /plant/recipes"
              payload: { name: "R-OCC2", product_style: "ENTREE", base_batch_yield_units: 1000, portion_weight_g: 340, shelf_life_days: 365 }
              as: PlantManager
              captures: { r_id: $.data.id }
            - { call: "POST /plant/recipes/${r_id}/components", payload: { component_name: "Sauce", component_type: "RAW_INGREDIENT", quantity_per_base_batch: 50, unit_of_measure: "KG" }, as: PlantManager }
            - { call: "POST /plant/recipes/${r_id}/approve", payload: {}, as: PlantManager }
            - call: "POST /plant/production-orders"
              payload: { recipe_id: "${r_id}", pack_format: "RETAIL", units_planned: 6000 }
              as: ProductionPlanner
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /plant/production-orders/${o_id}/batches"
              payload: { units_planned: 6000, expected_order_version: "${o_v}" }
              as: ProductionPlanner
              captures: { b_id: $.data.id, b_v_stale: $.data.version }
            - { call: "POST /plant/production-batches/${b_id}/kit", payload: {}, as: LineOperator }
            - { call: "POST /plant/production-batches/${b_id}/cook", payload: { cooked_mass_kg: 1550 }, as: LineOperator }
            - { call: "POST /plant/freezer-cells", payload: { cell_code: "FC-1", capacity_kg: 2000, min_load_kg: 200, pull_down_kg_per_hour: 400, sanitation_minutes: 30 }, as: PlantManager, captures: { c_id: $.data.id } }
          trigger:
            - call: "POST /plant/production-batches/${b_id}/freezing-cycles"
              payload: { cell_id: "${c_id}", load_kg: 1600, entry_temp_c: 5, planned_start: "2026-08-02T00:00:00Z", expected_batch_version: "${b_v_stale}" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
            - call: "GET /plant/production-batches/${b_id}"
              payload: {}
              as: ProductionPlanner
              captures: { b_v_now: $.data.version }
            - call: "POST /plant/production-batches/${b_id}/freezing-cycles"
              payload: { cell_id: "${c_id}", load_kg: 1600, entry_temp_c: 5, planned_start: "2026-08-02T00:00:00Z", expected_batch_version: "${b_v_now}" }
              as: ProductionPlanner
              captures: { cy_id: $.data.id }
          assert:
            - "stale expected_batch_version (1 vs current 3): ERR_STALE_VERSION, http 412"
            - "fresh version: cycle created; batch version advances to 4"

      - name: cascading_side_effects_layer
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: ccp_fail_cascade_depth3
          rationale: "The N-level cascade claim is exercised end-to-end by the named §1.8 instance (FAIL -> hold -> run cancel -> film release)."

      - name: rate_threshold_layer
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile.complexity_layers, calculations.complaint_contagion]
        excluded_because:
          difficulty_instance: complaint_count_exactly_three_quarantines
          rationale: "Threshold boundary (exactly 3; >= semantics) is asserted in the named §1.8 instance; the recipe-rate threshold is asserted in complaint_valid_contagion_cascade."

      - name: dual_variant_layer
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: shelf_life_provisional_vs_final_expiry
          rationale: "Both dual-variant calculations are asserted in §1.8 (expiry variant + billing variant)."

  # ============================================================ consistency model
  - section: consistency_model
    instances:
      - name: immediate_consistency_read_after_write
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: the cook response itself carries status COOKED and cooked_mass_kg, and a subsequent GET reflects the same values with version advanced by exactly 1 per mutation."
        test_recipe:
          setup: ["batch B KITTED"]
          setup_api_calls:
            - call: "POST /plant/recipes"
              payload: { name: "R-Cons", product_style: "ENTREE", base_batch_yield_units: 1000, portion_weight_g: 340, shelf_life_days: 365 }
              as: PlantManager
              captures: { r_id: $.data.id }
            - { call: "POST /plant/recipes/${r_id}/components", payload: { component_name: "Sauce", component_type: "RAW_INGREDIENT", quantity_per_base_batch: 50, unit_of_measure: "KG" }, as: PlantManager }
            - { call: "POST /plant/recipes/${r_id}/approve", payload: {}, as: PlantManager }
            - call: "POST /plant/production-orders"
              payload: { recipe_id: "${r_id}", pack_format: "RETAIL", units_planned: 6000 }
              as: ProductionPlanner
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /plant/production-orders/${o_id}/batches"
              payload: { units_planned: 6000, expected_order_version: "${o_v}" }
              as: ProductionPlanner
              captures: { b_id: $.data.id }
            - { call: "POST /plant/production-batches/${b_id}/kit", payload: {}, as: LineOperator }
          trigger:
            - call: "POST /plant/production-batches/${b_id}/cook"
              payload: { cooked_mass_kg: 1550 }
              as: LineOperator
              captures: { st: $.data.status, mass: $.data.cooked_mass_kg, v: $.data.version }
            - call: "GET /plant/production-batches/${b_id}"
              payload: {}
              as: ProductionPlanner
              captures: { st2: $.data.status, v2: $.data.version }
          assert:
            - "cook response: status == COOKED, cooked_mass_kg == 1550, version == 3 (create 1, kit 2, cook 3)"
            - "GET afterwards returns identical status and version (no lag, no reconciliation pass)"
