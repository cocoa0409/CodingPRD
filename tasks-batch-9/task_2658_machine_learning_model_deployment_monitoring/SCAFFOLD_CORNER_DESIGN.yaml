      - name: duplicate_semver_is_scoped_to_the_model
        claim_type: Violation → Error
        grounds:
          - validations.priority_51
          - errors.ERR_DUPLICATE_SEMVER
          - entities.ModelVersion.fields.semver
        distinguishing_aspect: |
          The uniqueness scope is (model_id, semver), not global: the SAME semver string is rejected on
          the same model and accepted on a different one. Because the check sits at priority 51, a
          duplicate semver on a nonexistent model still returns 404 first, which pins the ordering
          between existence and constraint checks.
