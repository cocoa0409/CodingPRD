  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: chlorine_input_priority_70_beats_expired_burn_test_priority_80
        grounds: >
          §1.4 declares priority 70 chlorine_input_within_permit -> ERR_CHLORINE_INPUT_EXCEEDED and
          priority 80 burn_test_authorization_valid -> ERR_BURN_TEST_EXPIRED, and the §1.4 conflict
          note names this exact pair. Both conditions are true for a single fuel-charge call once
          the RDF authorization has aged past its valid_days and the charge would push the run's
          chlorine input to 522.00 kg against a 500.00 kg permit.
        distinguishing_aspect: >
          An implementation that validates authorization freshness before the chlorine aggregate
          returns ERR_BURN_TEST_EXPIRED (422). The correct answer is ERR_CHLORINE_INPUT_EXCEEDED,
          because 70 < 80. Both are 422s with different error_ids, so only the ordering
          distinguishes them.
        test_recipe:
          setup: >
            RDF-1 is authorized to 35.00% TSR with valid_days 30, adjudicated on 2026-08-01. The
            clock then moves to 2026-09-15, 45 days later, so the authorization is expired. A run
            whose window covers that date is lit and charged with 90.00 t of coal (18.00 kg of
            chlorine). The trigger charges 63.00 t of RDF: 504.00 kg more chlorine (522.00 total,
            over the 500.00 permit) at a TSR of 31.82% (inside the permit's 35.00, so only the
            expiry and the chlorine rules are violated).
          setup_api_calls:
            - { call: "POST /cement-ops/plants", as: PlantAdmin, payload: { name: "Ash Grove West", region_code: "US-MW", permit_nox_kg_per_tonne_clinker_cap: 1.20, permit_annual_nox_budget_kg: 2000000, permit_max_tsr_pct: 35.00, permit_max_chlorine_kg_per_run: 500.00, peak_season_months: [5, 6, 7, 8, 9], clinker_free_lime_max_pct: 1.50 }, captures: { plant: "$.data.id" } }
            - { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "LS-1", category: "LIMESTONE", cao_pct: 52.0, sio2_pct: 3.5, al2o3_pct: 1.0, fe2o3_pct: 0.5, so3_pct: 0.05, moisture_pct: 2.0, cost_per_tonne: 8.00 }, captures: { ls: "$.data.id" } }
            - { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "CL-1", category: "CLAY", cao_pct: 1.0, sio2_pct: 60.0, al2o3_pct: 18.0, fe2o3_pct: 7.0, so3_pct: 0.10, moisture_pct: 12.0, cost_per_tonne: 12.00 }, captures: { cl: "$.data.id" } }
            - { call: "POST /cement-ops/fuels", as: EnvironmentalOfficer, payload: { code: "COAL-1", category: "COAL", lhv_gj_per_tonne: 27.00, nox_kg_per_gj: 0.35, co2_kg_per_gj: 96.0, chlorine_pct: 0.02 }, captures: { coal: "$.data.id" } }
            - { call: "POST /cement-ops/fuels", as: EnvironmentalOfficer, payload: { code: "RDF-1", category: "RDF", lhv_gj_per_tonne: 18.00, nox_kg_per_gj: 0.22, co2_kg_per_gj: 40.0, chlorine_pct: 0.80, is_alternative: true }, captures: { rdf: "$.data.id" } }
            - { call: "POST /cement-ops/burn-tests", as: EnvironmentalOfficer, payload: { plant_id: "${plant}", fuel_id: "${rdf}", requested_max_tsr_pct: 35.00, valid_days: 30 }, captures: { bt: "$.data.id" } }
            - { call: "POST /cement-ops/burn-tests/${bt}/start", as: LabTechnician, payload: {} }
            - { call: "POST /cement-ops/burn-tests/${bt}/record-result", as: LabTechnician, payload: { measured_chlorine_pct: 0.80, measured_nox_kg_per_gj: 0.22, stack_compliant: true } }
            - { call: "POST /cement-ops/burn-tests/${bt}/adjudicate", as: EnvironmentalOfficer, payload: { decision: "AUTHORIZED", authorized_max_tsr_pct: 35.00, decision_reason: "stack test passed" }, captures: { valid_until: "$.data.valid_until" } }
            - { call: "POST /cement-ops/kilns", as: PlantAdmin, payload: { plant_id: "${plant}", code: "K1", nominal_shc_gj_per_tonne: 3.60, cooldown_buffer_hours: 12, reline_due_hours: 4000 }, captures: { k1: "$.data.id" } }
            - { call: "POST /cement-ops/silos", as: PlantAdmin, payload: { plant_id: "${plant}", code: "SC1", material_kind: "CLINKER", capacity_tonnes: 20000.00, draw_rate_tonnes_per_hour: 300.00 }, captures: { sc1: "$.data.id" } }
            - { call: "POST /cement-ops/raw-mix-designs", as: ProcessEngineer, payload: { plant_id: "${plant}", code: "D2", target_lsf: 97.00, target_sm: 2.40, target_am: 2.45, components: [{ raw_material_id: "${ls}", mass_fraction_pct: 82.00 }, { raw_material_id: "${cl}", mass_fraction_pct: 18.00 }] }, captures: { d2: "$.data.id" } }
            - { call: "POST /cement-ops/raw-mix-designs/${d2}/submit", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/raw-mix-designs/${d2}/approve", as: QualityManager, payload: {}, captures: { d2_v: "$.data.version" } }
            - { call: "POST /cement-ops/blended-piles", as: ProcessEngineer, payload: { plant_id: "${plant}", raw_mix_design_id: "${d2}", pile_code: "PA", expected_raw_mix_design_version: "${d2_v}" }, captures: { pa: "$.data.id" } }
            - { call: "POST /cement-ops/blended-piles/${pa}/additions", as: ProcessEngineer, payload: { raw_material_id: "${ls}", tonnes_as_received: 2510.19, moisture_pct: 2.0 } }
            - { call: "POST /cement-ops/blended-piles/${pa}/additions", as: ProcessEngineer, payload: { raw_material_id: "${cl}", tonnes_as_received: 613.65, moisture_pct: 12.0 } }
            - { call: "POST /cement-ops/blended-piles/${pa}/seal", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/_clock/set_current_utc", as: PlantAdmin, payload: { to_iso8601: "2026-09-15T00:00:00Z" } }
            - { call: "POST /cement-ops/kiln-runs", as: KilnOperator, payload: { kiln_id: "${k1}", blended_pile_id: "${pa}", clinker_silo_id: "${sc1}", window_start: "2026-09-15T00:00:00Z", window_end: "2026-09-16T00:00:00Z" }, captures: { r2: "$.data.id" } }
            - { call: "POST /cement-ops/kiln-runs/${r2}/light", as: KilnOperator, payload: {} }
            - { call: "POST /cement-ops/kiln-runs/${r2}/fuel-charges", as: KilnOperator, payload: { fuel_id: "${coal}", tonnes: 90.00 }, captures: { cl_before: "$.data.chlorine_input_kg" } }
          trigger:
            - { call: "POST /cement-ops/kiln-runs/${r2}/fuel-charges", as: KilnOperator, payload: { fuel_id: "${rdf}", tonnes: 63.00 }, captures: { err: "$.data.error_id" } }
          assert:
            - "the burn test reads status AUTHORIZED with valid_from 2026-08-01T00:00:00Z and valid_until 2026-08-31T00:00:00Z, and the clock is 2026-09-15T00:00:00Z, so priority 80 is violated"
            - "after the coal charge chlorine_input_kg is 18.00 and gross_energy_gj is 2430.00"
            - "the trigger returns 422 with error_id ERR_CHLORINE_INPUT_EXCEEDED, NOT ERR_BURN_TEST_EXPIRED"
            - "the refused arithmetic: chlorine would be 522.00 kg against permit_max_chlorine_kg_per_run 500.00, while tsr_pct would be 31.82 (1134.00 / 3564.00), inside the 35.00 permit"
            - "the run is unchanged: one fuel charge, chlorine_input_kg 18.00, tsr_pct 0.00"
            - "charging 40.00 t of RDF instead (338.00 kg chlorine total, under the permit) surfaces the lower-priority ERR_BURN_TEST_EXPIRED, proving both rules are live"

      - name: silo_blocked_priority_62_beats_insufficient_clinker_priority_103
        grounds: >
          §1.4 declares priority 62 clinker_silo_open_for_draw -> ERR_SILO_BLOCKED and priority 103
          clinker_availability_covers_draw -> ERR_INSUFFICIENT_CLINKER, named as a conflicting pair
          in §1.4. A batch created against a BLOCKED clinker silo for more tonnes than it holds
          violates both.
        distinguishing_aspect: >
          An implementation that checks the arithmetic (700.00 > 583.78) before the silo state
          returns ERR_INSUFFICIENT_CLINKER (409). The correct answer is ERR_SILO_BLOCKED (409), and
          both are 409s, so the status code cannot be used to tell the two implementations apart.
        test_recipe:
          setup: >
            SC1 holds 583.78 t of RELEASED clinker and is then blocked by ADMIN1 for a bin scan. The
            silo version is re-read after the PATCH so the OCC guard is satisfied and cannot mask
            the conflict.
          setup_api_calls:
            - { call: "POST /cement-ops/plants", as: PlantAdmin, payload: { name: "Ash Grove West", region_code: "US-MW", permit_nox_kg_per_tonne_clinker_cap: 1.20, permit_annual_nox_budget_kg: 2000000, permit_max_tsr_pct: 35.00, permit_max_chlorine_kg_per_run: 500.00, peak_season_months: [5, 6, 7, 8, 9], clinker_free_lime_max_pct: 1.50 }, captures: { plant: "$.data.id" } }
