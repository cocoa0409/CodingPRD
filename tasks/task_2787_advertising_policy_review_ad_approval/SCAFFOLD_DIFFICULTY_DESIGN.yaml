              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${fin_id}", confidence: 0.30, matched_snippet: "personal loan" }], expected_ad_creative_version: "${crp_v}" }
              as: PolicyAdmin
              captures: { run_part_id: "$.data.id" }
            - call: "GET /ad-policy/review-tasks"
              payload: { ad_creative_id: "${cr_part_id}" }
              as: PolicyAdmin
              captures: { task_part_id: "$.data[0].id" }
            - call: "GET /ad-policy/review-tasks"
              payload: { ad_creative_id: "${cr_full_id}" }
              as: PolicyAdmin
          assert:
            - "ScreeningRun.${run_full_id}.outcome == AUTO_APPROVED and AdCreative.${cr_full_id}.review_status == AUTO_APPROVED"
            - "GET /ad-policy/review-tasks filtered by cr_full returns total_count == 0"
            - "ScreeningRun.${run_part_id}.outcome == ROUTED_MANUAL and AdCreative.${cr_part_id}.review_status == PENDING_MANUAL_REVIEW, from step 2d and nothing else"
            - "Both runs have provisional_risk_score == 0.00 because the 0.30 decision is below the 0.40 manual threshold, so the divergence cannot come from the score"
            - "Both ClassifierDecision rows have disposition BELOW_THRESHOLD and assessed_points == 2.88"
            - "ReviewTask.${task_part_id}.primary_policy_rule_id == null"
            - "ReviewTask.${task_part_id}.queue == STANDARD, not the rule's REGULATED_CERT default, because no decision qualified"
            - "ReviewTask.${task_part_id}.sla_deadline_at == 2026-08-03T00:00:00Z, using DEFAULT_SLA_HOURS 48 rather than the rule's 72"
            - "ReviewTask.${task_part_id}.priority_score == 40.00 (30.00 STANDARD base + max(0.00, 0.00) + 10.00 verification gap)"
            - "AdCreative.${cr_full_id}.serving_eligible == false with blocking_reason_codes == [DESTINATION_NOT_CLEARED] only, since its review axis is approved but no destination check has run"

      - name: limited_approval_depends_on_certification_row_state_and_collapses_on_revocation
        grounds:
          - state_machines.Certification.status.ACTIVE_to_REVOKED
          - state_machines.AdCreative.review_status.APPROVED_LIMITED_to_PENDING_MANUAL_REVIEW
          - calculations.certification_coverage
          - calculations.creative_risk_score
          - validations[priority=70].ERR_CERTIFICATION_MISSING
        distinguishing_aspect: |
          Entity pair AdCreative x Certification (a different pair from AdCreative x
          Advertiser). The creative's review state is a function of a row it does not own:
          revoking the pinned certification drags an APPROVED_LIMITED creative back to
          PENDING_MANUAL_REVIEW, clears approved_under_certification_id and
          limited_country_codes, mints a fresh REGULATED_CERT task, and restores
          risk_score_final from 0.00 to 7.20 by withdrawing the 8.00 coverage credit. The
          same APPROVE_WITH_LIMITS request that worked minutes earlier now fails, while a
          plain APPROVE still succeeds because coverage is only demanded for retained
          limited countries.
        test_recipe:
          setup:
            - "Rule ALC_SPIRITS (RESTRICTED, weight 6.00, requires_certification true, requires_disclaimer true, auto 0.90, manual 0.55, sla 48, default_queue REGULATED_CERT) with a US override RESTRICTED_CERT_REQUIRED, requires_license true, requires_disclaimer true, severity_multiplier 1.50."
            - "One advertiser with both verification axes VERIFIED, holding one certification for ALC_SPIRITS issued in US valid 2026-07-01T00:00:00Z to 2026-12-01T00:00:00Z (ACTIVE at the 2026-08-01 clock)."
            - "One reviewer with queue_specialties [REGULATED_CERT], country_authorizations [US], max_concurrent_claims 2."
            - "One creative declaring ALC_SPIRITS, targeting US only, disclaimer present, screened at confidence 0.80 into PENDING_MANUAL_REVIEW with risk_score_provisional 7.20."
            - "The reviewer claims the task and approves with limits for US, so the creative is APPROVED_LIMITED, pinned to the certification, with risk_score_final 0.00."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "ALC_SPIRITS", title: "Alcohol - spirits", category_class: "RESTRICTED", base_severity_weight: 6.00, requires_certification: true, requires_disclaimer: true, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.55, review_sla_hours: 48, default_queue: "REGULATED_CERT" }
              as: PolicyAdmin
              captures: { alc_id: "$.data.id" }
            - call: "POST /ad-policy/policy-rules/${alc_id}/country-overrides"
              payload: { country_code: "US", disposition: "RESTRICTED_CERT_REQUIRED", requires_license: true, requires_disclaimer: true, severity_multiplier: 1.50 }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Marrow Creek Distillery", country_code: "US", industry_code: "ALCOHOL" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED", evidence_ref: "kyc-2026-0093" }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "BUSINESS_STANDING", outcome: "VERIFIED", evidence_ref: "reg-2026-0093" }
              as: PolicyAdmin
            - call: "POST /ad-policy/certifications"
              payload: { advertiser_id: "${adv_id}", policy_rule_id: "${alc_id}", license_number: "ABC-US-2026-7781", issuing_country_code: "US", valid_from: "2026-07-01T00:00:00Z", valid_until: "2026-12-01T00:00:00Z" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cert_id: "$.data.id" }
            - call: "POST /ad-policy/reviewers"
              payload: { display_name: "Rev Regulated US", queue_specialties: ["REGULATED_CERT"], country_authorizations: ["US"], max_concurrent_claims: 2 }
              as: PolicyAdmin
              captures: { rev_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Bourbon flight tasting", body_text: "Book a bourbon flight tasting at our distillery.", declared_category_codes: ["ALC_SPIRITS"], target_country_codes: ["US"], landing_page_url: "https://www.marrowcreek.example/flight", display_url: "https://www.marrowcreek.example/flight", disclaimer_text: "Drink responsibly. 21+" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${alc_id}", confidence: 0.80, matched_snippet: "bourbon flight" }], expected_ad_creative_version: "${cr_v}" }
              as: PolicyAdmin
            - call: "GET /ad-policy/review-tasks"
              payload: { ad_creative_id: "${cr_id}" }
              as: PolicyAdmin
              captures: { t1_id: "$.data[0].id" }
            - call: "POST /ad-policy/review-tasks/${t1_id}/claim"
              payload: {}
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "POST /ad-policy/review-tasks/${t1_id}/decision"
              payload: { resolution: "APPROVE_WITH_LIMITS", limited_country_codes: ["US"], note: "Licensed in US." }
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "GET /ad-policy/ad-creatives/${cr_id}"
              payload: {}
              as: PolicyAdmin
          trigger:
            - call: "POST /ad-policy/certifications/${cert_id}/revoke"
              payload: { revocation_reason: "State board suspended the license pending audit." }
              as: PolicyAdmin
            - call: "GET /ad-policy/ad-creatives/${cr_id}"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/review-tasks"
              payload: { ad_creative_id: "${cr_id}", status: "QUEUED" }
              as: PolicyAdmin
              captures: { t2_id: "$.data[0].id" }
            - call: "POST /ad-policy/review-tasks/${t2_id}/claim"
              payload: {}
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "POST /ad-policy/review-tasks/${t2_id}/decision"
              payload: { resolution: "APPROVE_WITH_LIMITS", limited_country_codes: ["US"], note: "Retrying the limited approval." }
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "POST /ad-policy/review-tasks/${t2_id}/decision"
              payload: { resolution: "APPROVE", note: "Approving without country limits." }
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "GET /ad-policy/ad-creatives/${cr_id}"
              payload: {}
              as: PolicyAdmin
          assert:
            - "Before the trigger: AdCreative.${cr_id}.review_status == APPROVED_LIMITED, approved_under_certification_id == ${cert_id}, limited_country_codes == [US], risk_score_final == 0.00"
            - "After the revoke: Certification.${cert_id}.status == REVOKED with revocation_reason recorded"
            - "After the revoke: AdCreative.${cr_id}.review_status == PENDING_MANUAL_REVIEW, approved_under_certification_id == null, limited_country_codes == []"
            - "After the revoke: AdCreative.${cr_id}.risk_score_final == 7.20, the 8.00 coverage credit withdrawn, while risk_score_provisional stays 7.20"
            - "After the revoke: exactly 2 ReviewTask rows exist for the creative; ${t1_id} is RESOLVED and ${t2_id} is QUEUED with queue == REGULATED_CERT and cycle_count == 0"
            - "The APPROVE_WITH_LIMITS retry returns 422 with error_id ERR_CERTIFICATION_MISSING because the revoked row is excluded from the candidate set"
            - "The plain APPROVE returns 200: AdCreative.${cr_id}.review_status == AUTO_APPROVED, limited_country_codes == [], approved_under_certification_id == null"
            - "After the plain APPROVE: ReviewTask.${t2_id}.status == RESOLVED with resolution APPROVE and Reviewer.${rev_id}.claimed_task_count == 0"
            - "AdCreative.${cr_id}.risk_score_final == 7.20 after the approval, unchanged by it"

  - rule_id: resource_temporal_overlap
    instances:
      - name: certification_half_open_intervals_reject_overlap_but_accept_both_adjacencies
        grounds:
          - validations[priority=76].ERR_CERTIFICATION_INTERVAL_OVERLAP
          - calculations.certification_coverage
          - state_machines.Certification.status.SUBMITTED_to_ACTIVE
          - endpoints.POST_/ad-policy/certifications
        distinguishing_aspect: |
          Resource entity Certification, contended per (advertiser_id, policy_rule_id,
          issuing_country_code) triple, with HALF-OPEN interval semantics: two intervals
          collide only when new.valid_from < existing.valid_until AND existing.valid_from <
          new.valid_until. Adjacency at either endpoint is therefore legal — a window
          ending exactly where another begins is accepted at both the left and the right
          edge — while a window straddling the shared boundary is rejected. Changing only
          issuing_country_code makes the very same straddling interval legal, proving the
          contention key is the triple and not the advertiser.
        test_recipe:
          setup:
            - "Rule GAMBLING_ONLINE (RESTRICTED, weight 4.00, requires_certification true, auto 0.88, manual 0.35, sla 48, default_queue REGULATED_CERT) with a US override RESTRICTED_CERT_REQUIRED, requires_license true, severity_multiplier 1.20."
            - "One advertiser; the logical clock stays at its 2026-08-01T00:00:00Z default throughout."
            - "Certification cert1 for (advertiser, GAMBLING_ONLINE, US) valid 2026-08-01T00:00:00Z to 2026-09-01T00:00:00Z is created first and activates immediately because the clock sits on its inclusive valid_from."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "GAMBLING_ONLINE", title: "Online gambling", category_class: "RESTRICTED", base_severity_weight: 4.00, requires_certification: true, confidence_auto_disapprove_threshold: 0.88, confidence_manual_threshold: 0.35, review_sla_hours: 48, default_queue: "REGULATED_CERT" }
              as: PolicyAdmin
              captures: { gam_id: "$.data.id" }
            - call: "POST /ad-policy/policy-rules/${gam_id}/country-overrides"
              payload: { country_code: "US", disposition: "RESTRICTED_CERT_REQUIRED", requires_license: true, severity_multiplier: 1.20 }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Tidewater Gaming Ltd", country_code: "US", industry_code: "GAMING" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/certifications"
              payload: { advertiser_id: "${adv_id}", policy_rule_id: "${gam_id}", license_number: "GAM-US-2026-0001", issuing_country_code: "US", valid_from: "2026-08-01T00:00:00Z", valid_until: "2026-09-01T00:00:00Z" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cert1_id: "$.data.id" }
          trigger:
            - call: "POST /ad-policy/certifications"
              payload: { advertiser_id: "${adv_id}", policy_rule_id: "${gam_id}", license_number: "GAM-US-2026-0002", issuing_country_code: "US", valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-10-01T00:00:00Z" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cert2_id: "$.data.id" }
            - call: "POST /ad-policy/certifications"
              payload: { advertiser_id: "${adv_id}", policy_rule_id: "${gam_id}", license_number: "GAM-US-2026-0003", issuing_country_code: "US", valid_from: "2026-07-01T00:00:00Z", valid_until: "2026-08-01T00:00:00Z" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cert3_id: "$.data.id" }
            - call: "POST /ad-policy/certifications"
              payload: { advertiser_id: "${adv_id}", policy_rule_id: "${gam_id}", license_number: "GAM-US-2026-0004", issuing_country_code: "US", valid_from: "2026-08-15T00:00:00Z", valid_until: "2026-09-15T00:00:00Z" }
              as: Advertiser
              as_user_id: "${adv_id}"
            - call: "POST /ad-policy/certifications"
              payload: { advertiser_id: "${adv_id}", policy_rule_id: "${gam_id}", license_number: "GAM-SE-2026-0005", issuing_country_code: "SE", valid_from: "2026-08-15T00:00:00Z", valid_until: "2026-09-15T00:00:00Z" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cert5_id: "$.data.id" }
            - call: "GET /ad-policy/certifications"
              payload: { advertiser_id: "${adv_id}", policy_rule_id: "${gam_id}" }
              as: PolicyAdmin
          assert:
            - "Certification.${cert1_id}.status == ACTIVE because valid_from 2026-08-01T00:00:00Z is inclusive and the clock equals it"
            - "cert2, abutting cert1 on the right at 2026-09-01T00:00:00Z, is accepted with 201 and status SUBMITTED (its valid_from is still in the future)"
            - "Certification.${cert3_id} abutting cert1 on the left at 2026-08-01T00:00:00Z is accepted with 201 and status SUBMITTED, because the clock is not strictly inside its half-open window"
            - "The fourth call, valid 2026-08-15 to 2026-09-15 for the same (advertiser, rule, US) triple, returns 409 with error_id ERR_CERTIFICATION_INTERVAL_OVERLAP because it straddles both cert1 and cert2"
            - "Certification.${cert5_id}, the same straddling interval but issued in SE, is accepted with 201, proving the contention key is (advertiser_id, policy_rule_id, issuing_country_code)"
            - "GET /ad-policy/certifications filtered by advertiser and rule returns total_count == 4 ordered by valid_from ASC: the 2026-07-01 row, the 2026-08-01 row, then the two 2026-08-15 and 2026-09-01 rows"
            - "Exactly one of those rows has status ACTIVE, namely ${cert1_id}"

      - name: enforcement_cooldown_closed_blackout_window_rejects_action_at_its_final_instant
        grounds:
          - validations[priority=78].ERR_ENFORCEMENT_COOLDOWN_CONFLICT
          - calculations.enforcement_severity_index
          - concurrency_rules.manual-enforcement-stale-advertiser
          - state_machines.EnforcementAction.status.ACTIVE_to_SUPERSEDED
          - state_machines.Advertiser.account_status
        distinguishing_aspect: |
          A different resource entity (the advertiser's enforcement timeline, contended
          across EnforcementAction rows) with opposite interval semantics: the blackout
          [effective_from, effective_until + 72h] is CLOSED at both ends, unlike the
          half-open certification window. A manual action at exactly the final instant
          2026-08-13T00:00:00Z is refused, and one second later the identical request
          succeeds. The prior action is still ACTIVE while its effective_until has already
          passed, because expiry is sweep-driven, and the whole ladder runs with
          violation_points_raw 0.00, proving account_status is derived from the action rows
          and not from the points balance.
        test_recipe:
          setup:
            - "One advertiser with no creatives, no notices and no ledger entries."
            - "A manual WARNING is minted at the 2026-08-01T00:00:00Z default clock with an explicit effective_until of 2026-08-10T00:00:00Z, so its blackout window closes at 2026-08-13T00:00:00Z inclusive (72 cooldown hours)."
            - "expected_advertiser_version for every manual action is captured from a preceding GET /ad-policy/advertisers/{advertiser_id}."
            - "The clock is advanced to exactly 2026-08-13T00:00:00Z, the final instant of the blackout, and POST /ad-policy/_policy-sweeps/run is never called."
          setup_api_calls:
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Kestrel Direct Marketing", country_code: "US", industry_code: "RETAIL" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "GET /ad-policy/advertisers/${adv_id}"
              payload: {}
              as: PolicyAdmin
              captures: { adv_v0: "$.data.version" }
            - call: "POST /ad-policy/advertisers/${adv_id}/enforcement-actions"
              payload: { action_type: "WARNING", trigger_reason: "Manual integrity warning after a partner audit.", effective_until: "2026-08-10T00:00:00Z", expected_advertiser_version: "${adv_v0}" }
              as: PolicyAdmin
              captures: { act1_id: "$.data.id" }
            - call: "POST /ad-policy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T00:00:00Z" }
              as: PolicyAdmin
            - call: "GET /ad-policy/advertisers/${adv_id}"
              payload: {}
              as: PolicyAdmin
              captures: { adv_v1: "$.data.version" }
          trigger:
            - call: "POST /ad-policy/advertisers/${adv_id}/enforcement-actions"
              payload: { action_type: "RESTRICTION", trigger_reason: "Escalating to a restriction at the blackout boundary.", expected_advertiser_version: "${adv_v1}" }
              as: PolicyAdmin
            - call: "POST /ad-policy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T00:00:01Z" }
              as: PolicyAdmin
            - call: "GET /ad-policy/advertisers/${adv_id}"
              payload: {}
              as: PolicyAdmin
              captures: { adv_v2: "$.data.version" }
            - call: "POST /ad-policy/advertisers/${adv_id}/enforcement-actions"
              payload: { action_type: "RESTRICTION", trigger_reason: "Escalating to a restriction one second after the blackout.", expected_advertiser_version: "${adv_v2}" }
              as: PolicyAdmin
              captures: { act2_id: "$.data.id" }
            - call: "GET /ad-policy/advertisers/${adv_id}"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/enforcement-actions"
              payload: { advertiser_id: "${adv_id}" }
              as: PolicyAdmin
          assert:
            - "EnforcementAction.${act1_id}.origin == MANUAL, effective_from == 2026-08-01T00:00:00Z, effective_until == 2026-08-10T00:00:00Z, severity_index_at_issue == 0.00"
            - "Before the trigger: EnforcementAction.${act1_id}.status == ACTIVE and Advertiser.${adv_id}.account_status == WARNED, even though the clock has passed effective_until, because no sweep has run"
            - "Before the trigger: ${adv_v1} == ${adv_v0} + 1 (only the action creation bumped the advertiser version)"
            - "The first trigger call returns 409 with error_id ERR_ENFORCEMENT_COOLDOWN_CONFLICT: 2026-08-13T00:00:00Z is the inclusive right edge of [2026-08-01T00:00:00Z, 2026-08-13T00:00:00Z]"
            - "${adv_v2} == ${adv_v1}, confirming the rejected call wrote nothing"
            - "The second trigger call returns 201 at 2026-08-13T00:00:01Z with EnforcementAction.${act2_id}.action_type == RESTRICTION, origin == MANUAL, status == ACTIVE, effective_from == 2026-08-13T00:00:01Z"
            - "EnforcementAction.${act2_id}.effective_until == 2026-10-12T00:00:01Z, the ENFORCEMENT_DURATION_DAYS default of 60 days applied because effective_until was omitted"
            - "EnforcementAction.${act2_id}.prior_action_id == ${act1_id} and EnforcementAction.${act1_id}.status == SUPERSEDED"
            - "Advertiser.${adv_id}.account_status == RESTRICTED while violation_points_raw == 0.00, violation_points_decayed == 0.00 and zero ViolationLedgerEntry rows exist"
            - "GET /ad-policy/enforcement-actions filtered by the advertiser returns total_count == 2"

  - rule_id: compensating_invariant
    instances:
      - name: granted_appeal_conserves_the_violation_point_balance_back_to_zero
        grounds:
          - state_machines.Appeal.status.SUBMITTED_to_GRANTED
          - state_machines.DisapprovalNotice.status.APPEALED_to_APPEAL_GRANTED
          - state_machines.EnforcementAction.status.ACTIVE_to_LIFTED
          - calculations.advertiser_violation_points
          - entities.ViolationLedgerEntry.fields.balance_after
        distinguishing_aspect: |
          Conserved quantity: the advertiser's violation-point balance. The ledger is
          append-only, so the reversal is a compensating entry of exactly -19.20 rather than
          a deletion; entry_index stays contiguous at 1 and 2, balance_after walks
          19.20 -> 0.00, and every derived figure (violation_points_raw,
          violation_points_decayed, severity_index) returns to its pre-disapproval value
          with no drift. The WARNING is LIFTED rather than deleted and account_status
          returns to ACTIVE, while the creative is reinstated to PENDING_MANUAL_REVIEW with
          a fresh task. A destructive implementation that removes the original entry would
          break the contiguous entry_index and lose the audit trail.
        test_recipe:
          setup:
            - "Rule WEAPONS_FIREARMS (PROHIBITED, weight 12.00, auto 0.90, manual 0.50, sla 24) with overrides SE BLOCKED 2.00 and US RESTRICTED_CERT_REQUIRED 1.00."
            - "One advertiser and one reviewer (queue_specialties [STANDARD], country_authorizations [SE, US], max_concurrent_claims 2)."
            - "One creative declaring WEAPONS_FIREARMS and targeting SE and US, submitted and screened at confidence 0.95."
            - "Because SE is BLOCKED the run auto-disapproves: the notice is system-issued with decided_by_reviewer_id null (so the reviewer below is not adjudicating their own decision), assessed_points 19.20, and the resulting severity_index 19.20 mints a WARNING that puts the account in WARNED."
            - "The advertiser appeals inside the 72-hour window at the 2026-08-01 clock."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "WEAPONS_FIREARMS", title: "Weapons and firearms", category_class: "PROHIBITED", base_severity_weight: 12.00, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.50, review_sla_hours: 24, default_queue: "STANDARD" }
              as: PolicyAdmin
              captures: { wpn_id: "$.data.id" }
            - call: "POST /ad-policy/policy-rules/${wpn_id}/country-overrides"
              payload: { country_code: "SE", disposition: "BLOCKED", severity_multiplier: 2.00 }
              as: PolicyAdmin
            - call: "POST /ad-policy/policy-rules/${wpn_id}/country-overrides"
              payload: { country_code: "US", disposition: "RESTRICTED_CERT_REQUIRED", requires_license: true, severity_multiplier: 1.00 }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Ridgeline Sporting Goods", country_code: "US", industry_code: "SPORTING_GOODS" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/reviewers"
              payload: { display_name: "Rev Appeals Desk", queue_specialties: ["STANDARD"], country_authorizations: ["SE", "US"], max_concurrent_claims: 2 }
              as: PolicyAdmin
              captures: { rev_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Hunting season prep", body_text: "Hunting season prep with rifles, optics and cases.", declared_category_codes: ["WEAPONS_FIREARMS"], target_country_codes: ["SE", "US"], landing_page_url: "https://www.ridgeline.example/prep", display_url: "https://www.ridgeline.example/prep" }
              as: Advertiser
