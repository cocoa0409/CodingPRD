              payload: { measure_code: "HP-HVAC-01", measure_name: "Ducted air-source heat pump", category: "HVAC", unit_incentive_cents: 800000, measure_cap_cents: 800000, combined_cap_group: "HVAC_GROUP", sort_order: 10, required_panel_capacity_amps: 200, qualifies_as_appliance_anchor: true }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/measure-catalog-items"
              payload: { measure_code: "HP-DUCT-01", measure_name: "Duct sealing and static-pressure correction", category: "HVAC", unit_incentive_cents: 200000, measure_cap_cents: 200000, combined_cap_group: "HVAC_GROUP", sort_order: 20, required_panel_capacity_amps: 100, prerequisite_measure_code: "HP-HVAC-01" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Small Panel", email: "smallpanel@example.com", service_address_line1: "170 Small St", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/income-verifications"
              payload: { annual_household_income_cents: 8000000, county_median_income_cents: 10000000, household_size_attested: 4 }
              as: Applicant
              as_user_id: "${hh_id}"
              captures: { iv_id: $.data.id }
            - call: "POST /income-verifications/${iv_id}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /contractors"
              payload: { program_id: "${prog_id}", business_name: "Cascading Mechanical", license_number: "MC-9901", license_expires_on: "2027-06-30", insurance_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ctr_id: $.data.id }
            - call: "POST /contractors/${ctr_id}/enrollment-decision"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
          trigger:
            - call: "GET /households/${hh_id}"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { hh_v: $.data.version }
            - call: "POST /assessments"
              payload: { household_id: "${hh_id}", contractor_id: "${ctr_id}", assessed_panel_amps: 100, expected_household_version: "${hh_v}", measures: [ { measure_code: "HP-HVAC-01", proposed_quantity: 1, estimated_cost_cents: 1000000 }, { measure_code: "HP-DUCT-01", proposed_quantity: 1, estimated_cost_cents: 300000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { asm_id: $.data.id }
            - call: "GET /assessments/${asm_id}/eligible-measures"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /assessments/${asm_id}/approve"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
              captures: { err_no_measures: $.data.error_id }
          assert:
            - "Trigger call 2 returns 201: an assessment with zero qualifying measures may still be RECORDED — the gate is on approval, not on creation"
            - "Trigger call 3 returns HP-HVAC-01 at evaluation_order 1 with qualified == false and disqualification_reason == PANEL_CAPACITY_INSUFFICIENT (200 > 100)"
            - "Trigger call 3 returns HP-DUCT-01 at evaluation_order 2 with qualified == false and disqualification_reason == PREREQUISITE_MISSING — NOT PANEL_CAPACITY_INSUFFICIENT, since its own requirement of 100 A is met"
            - "Assessment.${asm_id}.qualified_measure_count == 0 and estimated_total_incentive_cents == 0"
            - "Trigger call 4 returns 409 with data.error_id == \"ERR_NO_ELIGIBLE_MEASURES\" and Assessment.${asm_id}.status is still PENDING_REVIEW"
            - "Had HP-HVAC-01 survived Stage D, HP-DUCT-01 would have qualified; the ordering of the stages is therefore load-bearing, not cosmetic"

      - name: extension_request_inside_and_outside_the_temporal_window
        claim_type: temporal_validation
        grounds:
          - calculations.reservation_extension_expiry
          - errors.ERR_EXTENSION_WINDOW_NOT_OPEN
          - validations.priority_18
        excluded_because:
          difficulty_instance: boundary_precision_check / extension_window_inclusive_lower_bound_and_day_limits
          rationale: "That §1.8 instance walks the clock across the extension window's inclusive lower bound, tests one day before it (ERR_EXTENSION_WINDOW_NOT_OPEN), the max_extension_days ceiling and the max_extensions_per_reservation ceiling, which is the full temporal-validation claim for this scaffold."

      - name: state_gate_outranks_the_fiscal_gate_on_reservation
        claim_type: priority_conflict
        grounds:
          - validation_priority_conflicts
          - validations.priority_8
          - validations.priority_22
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_gate_beats_budget_exhaustion_on_reservation
          rationale: "Both declared §1.4 priority pairs are already driven by §1.8: priority 8 vs priority 22 on POST /rebate-projects/{id}/reservations by that instance, and priority 11 vs priority 13 on POST /rebate-projects by installer_fitness_beats_measure_set_coherence_on_project_create."

  # ===========================================================================
  - section: endpoints
    instances:

      - name: contractor_create_read_and_program_scoped_listing
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/contractors
          - endpoints.GET_/contractors/{id}
          - endpoints.GET_/programs/{id}/contractors
          - entities.Contractor.fields.crew_capacity
        distinguishing_aspect: |
          Contractor's CRUD surface is deliberately incomplete: create, read
          and a program-scoped list exist, but there is no PATCH and no DELETE
          anywhere in §1.5 — every mutation goes through
          /enrollment-decision or /suspension. The list endpoint also filters
          by status and paginates independently of the two other programs'
          contractors.
        test_recipe:
          setup:
            - "Two OPEN programs so the program-scoped list can be shown not to leak."
            - "Program A gets two contractors (one approved, one left PENDING_ENROLLMENT); program B gets one."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 CRUD A", state_code: "CO", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_a: $.data.id }
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 CRUD B", state_code: "CO", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_b: $.data.id }
            - call: "POST /programs/${prog_a}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_b}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /contractors"
              payload: { program_id: "${prog_a}", business_name: "Alpha Electrification", license_number: "MC-1201", license_expires_on: "2027-06-30", insurance_expires_on: "2027-05-31", crew_capacity: 3 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ctr_a1: $.data.id }
            - call: "POST /contractors"
              payload: { program_id: "${prog_a}", business_name: "Beta Electrification", license_number: "MC-1202", license_expires_on: "2027-06-30", insurance_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ctr_a2: $.data.id }
            - call: "POST /contractors"
              payload: { program_id: "${prog_b}", business_name: "Gamma Electrification", license_number: "MC-1203", license_expires_on: "2027-06-30", insurance_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ctr_b1: $.data.id }
            - call: "POST /contractors/${ctr_a1}/enrollment-decision"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "GET /contractors/${ctr_a1}"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_a1}"
            - call: "GET /programs/${prog_a}/contractors"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "GET /programs/${prog_a}/contractors?status=ENROLLED_ACTIVE"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "GET /programs/${prog_a}/contractors?limit=1&offset=1"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "GET /programs/${prog_b}/contractors"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
          assert:
            - "Trigger call 1 returns 201 echoing crew_capacity == 3; trigger call 2 omits crew_capacity and defaults it to 1"
            - "Trigger call 5 returns Contractor.${ctr_a1} with status == ENROLLED_ACTIVE, quality_score_rolling == 100, completed_inspection_count == 0 and version == 2 (create then enrollment decision)"
            - "Trigger call 6 returns total_count == 2 and has_more == false for program A"
            - "Trigger call 7 returns total_count == 1 containing only ${ctr_a1} — ${ctr_a2} is still PENDING_ENROLLMENT"
            - "Trigger call 8 returns exactly 1 item with total_count == 2 and has_more == false (offset 1 of 2)"
            - "Trigger call 9 returns total_count == 1 containing only ${ctr_b1} — no cross-program leakage"
            - "There is no PATCH /contractors/{id} and no DELETE /contractors/{id} in §1.5: business_name and license_number are set once at create time"

      - name: catalog_retirement_affects_new_assessments_not_pinned_projects
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/programs/{id}/measure-catalog-items/{item_id}/retirement
          - calculations.eligible_measure_qualification
          - entities.ProjectMeasure.fields.pinned_unit_incentive_cents
          - errors.ERR_MEASURE_CATALOG_ITEM_NOT_FOUND
        distinguishing_aspect: |
          Retirement is a forward-only action: it flips active to false so
          every NEW eligible-measure evaluation reports RETIRED_CATALOG_ITEM,
          while a project that already pinned the item keeps
          pinned_unit_incentive_cents 800000 and its provisional total. A
          retirement call with an unknown item_id returns 404
          ERR_MEASURE_CATALOG_ITEM_NOT_FOUND and changes nothing.
        test_recipe:
          setup:
            - "One OPEN program with catalog item HP-HVAC-01 (800000/800000, HVAC_GROUP, requires 200 A, anchor)."
            - "A LOW-tier household with a 200 A panel, an ENROLLED_ACTIVE contractor, an APPROVED assessment and a DRAFT project that pinned the item at 800000."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Retirement", state_code: "CO", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/measure-catalog-items"
              payload: { measure_code: "HP-HVAC-01", measure_name: "Ducted air-source heat pump", category: "HVAC", unit_incentive_cents: 800000, measure_cap_cents: 800000, combined_cap_group: "HVAC_GROUP", sort_order: 10, required_panel_capacity_amps: 200, qualifies_as_appliance_anchor: true }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { item_id: $.data.id }
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Retire Watch", email: "retire@example.com", service_address_line1: "180 Retire Rd", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 200 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/income-verifications"
              payload: { annual_household_income_cents: 8000000, county_median_income_cents: 10000000, household_size_attested: 4 }
              as: Applicant
              as_user_id: "${hh_id}"
              captures: { iv_id: $.data.id }
            - call: "POST /income-verifications/${iv_id}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /contractors"
              payload: { program_id: "${prog_id}", business_name: "Retirement Mechanical", license_number: "MC-1301", license_expires_on: "2027-06-30", insurance_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ctr_id: $.data.id }
            - call: "POST /contractors/${ctr_id}/enrollment-decision"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "GET /households/${hh_id}"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { hh_v1: $.data.version }
            - call: "POST /assessments"
              payload: { household_id: "${hh_id}", contractor_id: "${ctr_id}", assessed_panel_amps: 200, expected_household_version: "${hh_v1}", measures: [ { measure_code: "HP-HVAC-01", proposed_quantity: 1, estimated_cost_cents: 1000000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { asm1: $.data.id }
            - call: "POST /assessments/${asm1}/approve"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /rebate-projects"
              payload: { household_id: "${hh_id}", assessment_id: "${asm1}", contractor_id: "${ctr_id}", income_verification_id: "${iv_id}", estimated_project_cost_cents: 1000000, measures: [ { measure_code: "HP-HVAC-01", planned_quantity: 1, estimated_cost_cents: 1000000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/measure-catalog-items/00000000-0000-0000-0000-0000000000aa/retirement"
              payload: { retirement_note: "Typo in the item id" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { err_item_missing: $.data.error_id }
            - call: "POST /programs/${prog_id}/measure-catalog-items/${item_id}/retirement"
              payload: { retirement_note: "Superseded by the 2027 specification" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /programs/${prog_id}/measure-catalog-items?active=false"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "GET /households/${hh_id}"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { hh_v2: $.data.version }
            - call: "POST /assessments"
              payload: { household_id: "${hh_id}", contractor_id: "${ctr_id}", assessed_panel_amps: 200, expected_household_version: "${hh_v2}", measures: [ { measure_code: "HP-HVAC-01", proposed_quantity: 1, estimated_cost_cents: 1000000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { asm2: $.data.id }
            - call: "GET /assessments/${asm2}/eligible-measures"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "GET /rebate-projects/${proj_id}/measures"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
          assert:
            - "Trigger call 1 returns 404 with data.error_id == \"ERR_MEASURE_CATALOG_ITEM_NOT_FOUND\"; MeasureCatalogItem.${item_id}.active is still true afterwards"
            - "Trigger call 2 returns 200 with active == false"
            - "Trigger call 3 returns total_count == 1, and GET /programs/${prog_id}/measure-catalog-items?active=true returns total_count == 0"
            - "Trigger call 6 returns 1 row with qualified == false and disqualification_reason == RETIRED_CATALOG_ITEM; Assessment.${asm2}.qualified_measure_count == 0"
            - "Trigger call 7 still returns pinned_unit_incentive_cents == 800000, pinned_measure_cap_cents == 800000 and provisional_incentive_cents == 800000 for the pre-existing project, and RebateProject.${proj_id}.provisional_total_incentive_cents == 800000"
            - "Assessment.${asm1}.status == SUPERSEDED after trigger call 5 (the new assessment still supersedes the old one even though it qualifies nothing)"

      - name: installation_report_rejects_an_unknown_measure_code_atomically
        claim_type: bulk_action
        grounds:
          - endpoints.POST_/rebate-projects/{id}/installation
          - errors.ERR_MEASURE_NOT_ON_PROJECT
          - entities.ProjectMeasure.fields.verified_quantity
        distinguishing_aspect: |
          The installation report is an all-or-nothing bulk write over
          measure_results: a payload whose FIRST entry is a valid project line
          and whose SECOND names a measure that is not on the project is
          rejected in full, leaving the valid line's verified_quantity and
          actual_cost_cents null and the project still RESERVED — no partial
          application, no per-item success list.
        test_recipe:
          setup:
            - "One OPEN program with HP-HVAC-01 and WH-HPWH-01 in the catalog."
            - "A LOW-tier household, an ENROLLED_ACTIVE contractor, an APPROVED assessment proposing HP-HVAC-01 only, and a project RESERVED at 800000."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Bulk Install", state_code: "CO", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/measure-catalog-items"
              payload: { measure_code: "HP-HVAC-01", measure_name: "Ducted air-source heat pump", category: "HVAC", unit_incentive_cents: 800000, measure_cap_cents: 800000, combined_cap_group: "HVAC_GROUP", sort_order: 10, required_panel_capacity_amps: 200, qualifies_as_appliance_anchor: true }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/measure-catalog-items"
              payload: { measure_code: "WH-HPWH-01", measure_name: "Heat-pump water heater", category: "WATER_HEATING", unit_incentive_cents: 175000, measure_cap_cents: 175000, combined_cap_group: "WATER_GROUP", sort_order: 20, required_panel_capacity_amps: 150, qualifies_as_appliance_anchor: true }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Bulk Install", email: "bulk@example.com", service_address_line1: "190 Bulk Blvd", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 200 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/income-verifications"
              payload: { annual_household_income_cents: 8000000, county_median_income_cents: 10000000, household_size_attested: 4 }
              as: Applicant
              as_user_id: "${hh_id}"
              captures: { iv_id: $.data.id }
            - call: "POST /income-verifications/${iv_id}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /contractors"
              payload: { program_id: "${prog_id}", business_name: "Bulk Install Mechanical", license_number: "MC-1401", license_expires_on: "2027-06-30", insurance_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ctr_id: $.data.id }
            - call: "POST /contractors/${ctr_id}/enrollment-decision"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "GET /households/${hh_id}"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { hh_v: $.data.version }
            - call: "POST /assessments"
              payload: { household_id: "${hh_id}", contractor_id: "${ctr_id}", assessed_panel_amps: 200, expected_household_version: "${hh_v}", measures: [ { measure_code: "HP-HVAC-01", proposed_quantity: 1, estimated_cost_cents: 1000000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { asm_id: $.data.id }
            - call: "POST /assessments/${asm_id}/approve"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /rebate-projects"
              payload: { household_id: "${hh_id}", assessment_id: "${asm_id}", contractor_id: "${ctr_id}", income_verification_id: "${iv_id}", estimated_project_cost_cents: 1000000, measures: [ { measure_code: "HP-HVAC-01", planned_quantity: 1, estimated_cost_cents: 1000000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /rebate-projects/${proj_id}/submit"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /rebate-projects/${proj_id}/review"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-2"
              captures: { prog_v: $.data.version }
            - call: "POST /rebate-projects/${proj_id}/reservations"
              payload: { expected_program_version: "${prog_v}" }
              as: ProgramReviewer
              as_user_id: "reviewer-2"
              captures: { resv_id: $.data.id }
          trigger:
            - call: "POST /rebate-projects/${proj_id}/installation"
              payload: { install_start_date: "2026-08-10", install_end_date: "2026-08-20", installed_panel_amps: 200, actual_project_cost_cents: 1100000, measure_results: [ { measure_code: "HP-HVAC-01", verified_quantity: 1, actual_cost_cents: 700000 }, { measure_code: "WH-HPWH-01", verified_quantity: 1, actual_cost_cents: 400000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { err_not_on_project: $.data.error_id }
            - call: "GET /rebate-projects/${proj_id}/measures"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /rebate-projects/${proj_id}/installation"
              payload: { install_start_date: "2026-08-10", install_end_date: "2026-08-20", installed_panel_amps: 200, actual_project_cost_cents: 700000, measure_results: [ { measure_code: "HP-HVAC-01", verified_quantity: 1, actual_cost_cents: 700000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
          assert:
            - "Trigger call 1 returns 422 with data.error_id == \"ERR_MEASURE_NOT_ON_PROJECT\" naming WH-HPWH-01"
            - "Trigger call 2 shows the HP-HVAC-01 line untouched: install_status == PLANNED, verification_status == PENDING, verified_quantity == null and actual_cost_cents == null — the valid first entry was NOT applied"
            - "After trigger call 1: RebateProject.${proj_id}.status == RESERVED with install_start_date == null, install_end_date == null and actual_project_cost_cents == null"
            - "Trigger call 3 returns 200 with status == INSTALLED, actual_project_cost_cents == 700000 and the HP-HVAC-01 line at install_status == INSTALLED, verified_quantity == 1"
            - "Reservation.${resv_id}.reserved_amount_cents is still 800000 after both calls — installation never touches the reserved amount"

      - name: incentive_quote_is_a_side_effect_free_computed_read
        claim_type: computed_read
        grounds:
          - endpoints.GET_/rebate-projects/{id}/incentive-quote
          - calculations.measure_incentive_allocation
          - entities.RebateProject.fields.provisional_total_incentive_cents
        distinguishing_aspect: |
          The quote is derived, not stored twice: its total_incentive_cents
          equals the project's persisted provisional_total_incentive_cents and
          its per-line values equal each ProjectMeasure's
          provisional_incentive_cents, and calling it three times leaves
          RebateProject.version and every ProjectMeasure byte-identical. It also
          exposes the cap-diagnostic fields that no other endpoint reports.
        test_recipe:
          setup:
            - "One OPEN program with HP-HVAC-01 (800000/800000, HVAC_GROUP) and ENV-INS-01 (100000/100000, NONE, ENVELOPE, 0 A)."
            - "A LOW-tier household (share 1.00, cap 1400000), an ENROLLED_ACTIVE contractor, an APPROVED assessment proposing both measures and a DRAFT project with both lines (900000 provisional in total: 800000 + 100000)."
