            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:01Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/_sweeps/run", payload: {}, as: ComplianceAdmin }
            - { call: "GET /compliance/assignments/${a}/escalations", as: ComplianceAdmin, captures: { l3_id: "$.data[1].id", l3_lv: "$.data[1].level", l3_rcpt: "$.data[1].recipient_employee_id" } }
          trigger:
            - { call: "POST /compliance/escalations/${l3_id}/acknowledge", payload: {}, as: Manager, as_user_id: "${mgr}", captures: { err: "$.data.error_id" } }
            - { call: "POST /compliance/escalations/${l3_id}/acknowledge", payload: {}, as: ComplianceAdmin, captures: { ok_st: "$.data.status" } }
          assert:
            - "l3_lv == 3 and l3_rcpt == null (compliance-office queue; list ordered triggered_at ASC, level ASC so index 1 is the level-3 notice)"
