            - "${amt_850} == 100000: 799 - 850 == -51 and max(0, -51) == 0, so a customer APR above market NEVER produces a negative leg"
            - "every one of the four amounts uses rate_basis AS_SOLD_SNAPSHOT because no repricing exists on this program"
            - "MARKET_APR_BPS is 799 and appears nowhere in any request payload — it is a server-side constant"

