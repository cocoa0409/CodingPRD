        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_INSUFFICIENT_MATERIAL]"]
        distinguishing_aspect: "Requesting 4.000kg from a lot with 3.000kg available is the fiscal failure path (402), distinct from the state-vs-fiscal priority conflict covered in §1.8."
