              as: NetworkOperator
              captures: { p_id: $.data.id }
            - call: "POST /charging-ports/${p_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "COMMISSIONING" }
              as: NetworkOperator
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
            - call: "POST /outage-events"
              payload: { port_id: "${p_id}", fault_code: "OCPP-MIN-01", fault_class: "MINOR", detected_at: "2026-08-01T00:00:00Z" }
              as: NetworkOperator
              captures: { o_id: $.data.id }
            - call: "POST /outage-events/${o_id}/classify"
              payload: { fault_class: "MINOR" }
              as: NetworkOperator
            - call: "POST /maintenance-dispatches"
              payload: { outage_event_id: "${o_id}", port_id: "${p_id}", technician_user_id: "tech-1", technician_certification_class: "DCFC_BASIC", window_start_at: "2026-08-01T01:00:00Z", window_end_at: "2026-08-01T23:00:00Z" }
              as: NetworkOperator
              as_user_id: "op-1"
              captures: { d_id: $.data.id }
            - call: "POST /maintenance-dispatches/${d_id}/progress"
              payload: { event: "EN_ROUTE" }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /maintenance-dispatches/${d_id}/progress"
              payload: { event: "ARRIVE" }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: NetworkOperator
            - call: "POST /maintenance-dispatches/${d_id}/complete"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
          trigger:
            - call: "POST /outage-events/${o_id}/resolution-reviews"
              payload: { outcome: "VERIFY" }
              as: NetworkOperator
              as_user_id: "op-1"
              captures: { err: $.data.error_id }
            - call: "POST /outage-events/${o_id}/resolution-reviews"
              payload: { outcome: "VERIFY" }
              as: NetworkOperator
              as_user_id: "op-2"
          assert:
            - "call 1: HTTP status == 409 and data.error_id == \"ERR_SEGREGATION_OF_DUTIES\""
            - "after call 1: OutageEvent.${o_id}.state == RESOLVED and verified_by_user_id == null"
            - "call 2: HTTP status == 200, state == VERIFIED, verified_by_user_id == \"op-2\" — the same role, a different user"
            - "OutageEvent.${o_id}.dispatch_created_by_user_id == \"op-1\" throughout"
            - "Station.${st_id}.billable_downtime_minutes_lifetime == 360 at both observations"

