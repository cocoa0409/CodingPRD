  - section: consistency_model
    instances:
      - name: completion_invoice_immediately_visible
        claim_type: immediate_consistency
        grounds:
          - "calculations.invoice_total_cents"
        distinguishing_aspect: "Immediate consistency: the invoice fields computed by complete are visible identically in the complete response and a subsequent GET, with no lag."
        test_recipe:
          setup: ["Site (discount 0), vessel, technician; INSPECTION ticket crew 1 est 2 SCHEDULED and started."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "IC Site", state_code: "IA" }
              as: ServiceManager
              captures: { sic: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${sic}", name: "BIN-IC", vessel_kind: "BIN", capacity_tons: 50, material_name: "salt", reorder_point_pct: 30 }
              as: ServiceManager
              captures: { vic: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech I", weekly_capacity_hours: 40 }
              as: ServiceManager
              captures: { tti: $.data.id }
            - call: "POST /service-tickets"
              payload: { site_id: "${sic}", vessel_id: "${vic}", job_type: "INSPECTION", requires_entry: false, est_hours: 2, crew_size: 1 }
              as: ServiceManager
              captures: { tic: $.data.id }
            - call: "POST /service-tickets/${tic}/quote"
              payload: {}
              as: ServiceManager
            - call: "POST /service-tickets/${tic}/approve"
              payload: {}
              as: PlantOperator
              as_user_id: "${sic}"
            - call: "POST /service-tickets/${tic}/schedule"
              payload: { technician_id: "${tti}", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T10:00:00Z" }
              as: ServiceManager
            - call: "POST /service-tickets/${tic}/start"
              payload: {}
              as: Technician
              as_user_id: "${tti}"
          trigger:
            - call: "POST /service-tickets/${tic}/complete"
              payload: { actual_hours: 2, mileage_miles: 0, disposal_tons: 0 }
