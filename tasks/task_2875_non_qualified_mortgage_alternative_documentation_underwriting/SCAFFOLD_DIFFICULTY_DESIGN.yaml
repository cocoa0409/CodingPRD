            - call: "POST /valuation-orders/${vo_vv_s_id}/receive"
              payload: { appraised_value_cents: 49000000 }
              as: AppraisalReviewer
            - call: "GET /loan-files/${lf_vv_id}/appraisal-reviews"
              payload: {}
              as: AppraisalReviewer
              captures: { rev_vv_id: "$.data[0].id" }
          trigger:
            - call: "POST /valuation-orders/${vo_vv_s_id}/decision"
              payload: { decision: "ACCEPTED" }
              as: AppraisalReviewer
          assert:
            - "pre-trigger baseline: LoanFile.${lf_vv_id}.ltv_pct == 72.73, overlay_breach_codes == [OVL-LTV], unresolved_overlay_breach_count == 0, status == UNDERWRITING; ExceptionRequest.${exc_vv_id}.status == APPROVED with pinned_metric_value == 72.73"
            - "hop 1 - ValuationOrder.${vo_vv_s_id}.status == ACCEPTED"
            - "hop 2 - AppraisalReview.${rev_vv_id}.second_value_cents == 49000000, variance_pct == 12.24, second_valuation_status == SECOND_RECONCILED, primary_review_status == PRIMARY_ESCALATED, escalation_reason == VARIANCE_ABOVE_TOLERANCE, reconciled_value_cents == 49000000 (the LOWER value, not 55000000 and not the 52000000 average)"
            - "hop 3 - LoanFile.${lf_vv_id}.ltv_pct == 81.63 (40000000 * 100 / 49000000, single rounding)"
            - "hop 4 - ExceptionRequest.${exc_vv_id}.status == VOIDED because pinned_metric_value 72.73 no longer matches the live 81.63; LoanFile.${lf_vv_id}.unresolved_overlay_breach_count == 1 and overlay_breach_codes == [OVL-LTV]"
            - "hop 5 - LoanFile.${lf_vv_id}.status == SUSPENDED"
            - "LoanFile.${lf_vv_id}.second_valuation_required == true and dscr_ratio == 1.1960 (unchanged by the cascade; DSCR does not depend on value)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_error_beats_dti_ceiling_on_suspended_profit_and_loss_file
        grounds:
          - validations.priority_10
          - validations.priority_36
          - calculations.profit_and_loss_income
          - calculations.atr_determination
        distinguishing_aspect: |
          Pairs a `state` rule (priority 10, ERR_LOAN_FILE_STATE_INVALID, 409) against a
          `business_fiscal` rule (priority 36, ERR_DTI_ABOVE_PROGRAM_MAX, 422) on the same
          POST /loan-files/{id}/approve call. Both are violated simultaneously; the state
          error must win. Clearing conditions removes only the state violation and the same
          call then surfaces the fiscal error, proving the fiscal rule was evaluated second
          rather than not at all.
        test_recipe:
          setup:
            - "A PROFIT_AND_LOSS program with max_dti_pct 50.00, min_reserves_months 6 and min_residual_income_cents 250000."
            - "A self-employed borrower with 400000 cents of other monthly debt and 4000000 cents of verified liquid assets."
            - "A 60000000-cent fully amortizing first lien at 8.750 on a 75000000-cent primary residence, taxes 78000 and insurance 22000, so pitia_monthly_cents is 572020."
            - "An accepted profit-and-loss worksheet declaring 18333336 cents of net income over 12 months, so qualifying income is 1527778 and dti_pct is 63.62 - above the program's 50.00 ceiling."
