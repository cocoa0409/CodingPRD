          - entities.MortgageApplication.fields.silent_second_amount_cents
          - concurrency_rules[mortgage-approve-stale-program]
        distinguishing_aspect: |
          The gate is `subsidy_available_cents >= silent_second_amount_cents`,
          so equality must APPROVE and one cent less must REJECT. The pinned
          structure is derived by executing affordable_payment_structure on
          appraised_value_cents 15000000 and verified_annual_income_cents
          3000000 step by step: monthly_gross = floor(3000000/12) = 250000;
          tax_monthly = round_half_up(15000000 * 0.0125 / 12) = 15625;
          insurance_annual = max(60000, round(15000000 * 0.0035) = 52500) =
          60000 so insurance_monthly = 5000; escrow_monthly = 15625 + 5000 =
          20625; max_total = floor(250000 * 0.30) = 75000; affordable_pi =
          75000 - 20625 = 54375; the 360-month provisional principal 54375 *
          360 = 19575000 is >= 0.90 * 15000000 = 13500000, so the shorter
          240-month tier is selected; first_mortgage_principal =
          min(54375 * 240, 15000000) = 13050000; silent_second = 15000000 -
          13050000 = 1950000. The recipe probes just-outside (1949999) and
          just-inside (1950000) on the SAME endpoint by moving the pool one
          cent with a TOP_UP between the two attempts, and pins the resulting
          posture flip to SUBSIDY_RESTRICTED when available lands on exactly 0.
        test_recipe:
          setup:
            - "One AffiliateProgram with subsidy_pool_cents 1949999 - deliberately one cent short - status ACTIVE, program_posture OPEN, subsidy_committed_cents 0, subsidy_disbursed_cents 0."
