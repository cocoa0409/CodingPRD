  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: lender_damage_confirmation_cascades_five_levels_from_shipment_to_patron_block
        grounds:
          - state_machines.Shipment.IN_TRANSIT_to_CONFIRMED_DAMAGED
          - state_machines.LoanRecord.NO_CHARGE_to_DAMAGE_BILLED
          - state_machines.LoanRecord.RETURN_PREPARED_to_RETURNED_TO_LENDER
          - state_machines.IllRequest.RETURN_IN_TRANSIT_to_CLOSED_WITH_DAMAGE
          - entities.Patron.fields.damaged_count
          - entities.Patron.fields.unpaid_balance_cents
          - entities.Patron.fields.final_risk_score
          - entities.Patron.fields.status
          - entities.PatronNotification.fields.kind
          - calculations.patron_standing_score
        distinguishing_aspect: |
          Depth 5, triggered by POST /ill/shipments/{id}/lender-confirm: Shipment -> CONFIRMED_DAMAGED
          (1) drives LoanRecord.billing_status -> DAMAGE_BILLED with outstanding_cents 5500 (2), which
