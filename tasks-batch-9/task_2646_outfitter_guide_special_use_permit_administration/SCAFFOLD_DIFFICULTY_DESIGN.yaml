          successor states through a non-numeric predicate: a RENEWAL whose predecessor is COMPLIANT
          with a SATISFACTORY rating goes to DIRECT_AWARD_PENDING, while a RENEWAL whose predecessor
          has never been evaluated goes to PROSPECTUS_QUEUED because null is not a member of the
