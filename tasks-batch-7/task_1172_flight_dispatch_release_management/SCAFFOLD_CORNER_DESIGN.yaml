      - name: err_dispatcher_overloaded_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_DISPATCHER_OVERLOADED]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / dispatcher_workload_capacity_boundary
          rationale: "Asserted at the exact capacity boundary (count == max)."

      - name: err_invalid_state_and_no_active_shift_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE]", "errors[ERR_NO_ACTIVE_SHIFT]"]
