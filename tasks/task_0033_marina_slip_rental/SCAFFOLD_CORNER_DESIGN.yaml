      - name: waitlist_ineligible_when_tenant_has_no_active_lease_at_marina
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_WAITLIST_INELIGIBLE]
        distinguishing_aspect: "POST /transfer-waitlist where tenant has no ACTIVE lease at marina_id returns ERR_WAITLIST_INELIGIBLE."
        test_recipe:
          setup: ["Tenant has a RESERVED (not ACTIVE) lease only."]
