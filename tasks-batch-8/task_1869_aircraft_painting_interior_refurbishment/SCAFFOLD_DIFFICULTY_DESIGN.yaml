          bills 200,000 + 3 x 25,000 x 1.25 = 293,750.
        test_recipe:
          setup:
            - "Program in IN_WORK with a BOOKED booth window 2026-08-10T08:00->16:00 (8 scheduled hours) on a booth rated 25,000 cents/h"
          setup_api_calls:
            - { call: "POST /completion/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CenterAdmin }
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id } }
            - { call: "POST /completion/hangar-bays", payload: { name: "BAY-1", daily_rate_cents: 85000 }, as: CenterAdmin, captures: { bay_id: $.data.id } }
            - { call: "POST /completion/hangar-slots", payload: { bay_id: "${bay_id}", program_id: "${prog_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-22T00:00:00Z" }, as: ProgramManager, captures: { slot_id: $.data.id } }
            - { call: "POST /completion/programs/${prog_id}/advance", payload: { to_phase: "BOOKED" }, as: ProgramManager }
            - { call: "POST /completion/hangar-slots/${slot_id}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /completion/programs/${prog_id}/advance", payload: { to_phase: "INDUCTED" }, as: ProgramManager }
            - { call: "POST /completion/surface-assessments", payload: { program_id: "${prog_id}" }, as: ShopTechnician, captures: { asm_id: $.data.id } }
            - { call: "POST /completion/programs/${prog_id}/advance", payload: { to_phase: "SURFACE_REVIEW" }, as: ProgramManager }
            - { call: "POST /completion/surface-assessments/${asm_id}/decide", payload: { decision: "STRIP", corrosion_severity: "NONE" }, as: ShopTechnician }
            - { call: "POST /completion/paint-schemes", payload: { program_id: "${prog_id}", drawing_ref: "DWG-1869-A", painted_area_sqft: 2400, coat_count: 2, stripe_pct: 0.10 }, as: DesignLead, captures: { sch_id: $.data.id } }
            - { call: "POST /completion/paint-schemes/${sch_id}/submit", payload: {}, as: DesignLead }
            - { call: "GET /completion/programs/${prog_id}", as: ProgramManager, captures: { prog_v1: $.data.version } }
            - { call: "POST /completion/paint-schemes/${sch_id}/approve", payload: { expected_program_version: "${prog_v1}" }, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "POST /completion/paint-booths", payload: { name: "BOOTH-1", hourly_rate_cents: 25000, cure_buffer_hours: 6 }, as: CenterAdmin, captures: { booth_id: $.data.id } }
            - { call: "POST /completion/booth-bookings", payload: { booth_id: "${booth_id}", program_id: "${prog_id}", start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-10T16:00:00Z" }, as: ProgramManager, captures: { bk_id: $.data.id, sched_fee: $.data.scheduled_fee_cents } }
            - { call: "POST /completion/programs/${prog_id}/advance", payload: { to_phase: "IN_WORK" }, as: ProgramManager }
          trigger:
            - { call: "POST /completion/booth-bookings/${bk_id}/complete", payload: { actual_hours: 11 }, as: ShopTechnician, captures: { act_fee: $.data.actual_fee_cents } }
          assert:
            - "sched_fee == 200000 (8h x 25000)"
            - "act_fee == 293750 (8 x 25000 + 3 x 25000 x 1.25 = 200000 + 93750)"
            - "act_fee != sched_fee for the same booking — variant selected by lifecycle moment"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: paint_material_tiered_estimate_scuff_branch
        grounds:
          - calculations.paint_material_estimate
          - entities.RefurbProgram.fields.material_estimate_gallons
          - entities.RefurbProgram.fields.material_estimate_cost_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — area, coat_count,
          stripe_pct, an entity-state conditional branch (assessment decision
          STRIP vs SCUFF scales before ceil), and tiered average-rate selection.
          STRIP: ceil(13.714)=14 main + 1 accent = 15 gal at 18,500 = 277,500.
          SCUFF: ceil(13.714 x 0.85)=ceil(11.657)=12 + 1 = 13 gal at 18,500 =
          240,500. The branch interacts with ceil (13.714 x 0.85 crosses an
          integer boundary) — not a simple scaling.
        test_recipe:
          setup:
            - "Program with APPROVED scheme (2400 sqft, 2 coats, stripe 0.10); program inducted; first read before any assessment decision, second read after SCUFF decision"
          setup_api_calls:
            - { call: "POST /completion/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CenterAdmin }
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id, prog_v0: $.data.version } }
            - { call: "POST /completion/paint-schemes", payload: { program_id: "${prog_id}", drawing_ref: "DWG-1869-A", painted_area_sqft: 2400, coat_count: 2, stripe_pct: 0.10 }, as: DesignLead, captures: { sch_id: $.data.id } }
            - { call: "POST /completion/paint-schemes/${sch_id}/submit", payload: {}, as: DesignLead }
            - { call: "POST /completion/paint-schemes/${sch_id}/approve", payload: { expected_program_version: "${prog_v0}" }, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "GET /completion/programs/${prog_id}", as: ProgramManager, captures: { gal_strip: $.data.material_estimate_gallons, cost_strip: $.data.material_estimate_cost_cents } }
            - { call: "POST /completion/hangar-bays", payload: { name: "BAY-1", daily_rate_cents: 85000 }, as: CenterAdmin, captures: { bay_id: $.data.id } }
            - { call: "POST /completion/hangar-slots", payload: { bay_id: "${bay_id}", program_id: "${prog_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-22T00:00:00Z" }, as: ProgramManager, captures: { slot_id: $.data.id } }
            - { call: "POST /completion/programs/${prog_id}/advance", payload: { to_phase: "BOOKED" }, as: ProgramManager }
            - { call: "POST /completion/hangar-slots/${slot_id}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /completion/programs/${prog_id}/advance", payload: { to_phase: "INDUCTED" }, as: ProgramManager }
            - { call: "POST /completion/surface-assessments", payload: { program_id: "${prog_id}" }, as: ShopTechnician, captures: { asm_id: $.data.id } }
          trigger:
            - { call: "POST /completion/surface-assessments/${asm_id}/decide", payload: { decision: "SCUFF", corrosion_severity: "LIGHT" }, as: ShopTechnician }
            - { call: "GET /completion/programs/${prog_id}", as: ProgramManager, captures: { gal_scuff: $.data.material_estimate_gallons, cost_scuff: $.data.material_estimate_cost_cents } }
          assert:
            - "gal_strip == 15 and cost_strip == 277500 (ceil(2400x2/350)=14 + ceil(0.48)=1; 15 <= 20 -> tier1 18500)"
            - "gal_scuff == 13 and cost_scuff == 240500 (ceil(13.714... x 0.85) = ceil(11.657) = 12 + 1; 13 <= 20 -> tier1 18500)"
            - "the 0.85 factor is applied BEFORE ceil (applying after would give ceil(14x0.85)=12 then +1 = 13 same gallons but cost basis would differ for other fixtures — pinned order is ceil-after-scale)"

      - name: invoice_per_line_rounding_then_sum
        grounds:
          - calculations.invoice_line_totals
          - entities.Invoice.fields.lines
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned — each FINAL invoice line is
          rounded half-up to integer cents individually, then summed. Two
          discovery items at 333,333 each produce per-item handling lines of
          round(33,333.3)=33,333 (x2 = 66,666); the forbidden aggregate order
          round(666,666 x 0.10)=66,667 would make the total 7,106,170 instead
          of 7,106,169.
        test_recipe:
          setup:
            - "Program at READY_FOR_DELIVERY with two COMPLETED discovery items (actual 333,333 each), booth completed at exactly scheduled 8h (fee 200,000), no delay events (penalty 0), clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /completion/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CenterAdmin }
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id } }
            - { call: "POST /completion/hangar-bays", payload: { name: "BAY-1", daily_rate_cents: 85000 }, as: CenterAdmin, captures: { bay_id: $.data.id } }
            - { call: "POST /completion/hangar-slots", payload: { bay_id: "${bay_id}", program_id: "${prog_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-22T00:00:00Z" }, as: ProgramManager, captures: { slot_id: $.data.id } }
            - { call: "POST /completion/programs/${prog_id}/advance", payload: { to_phase: "BOOKED" }, as: ProgramManager }
            - { call: "POST /completion/hangar-slots/${slot_id}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /completion/programs/${prog_id}/advance", payload: { to_phase: "INDUCTED" }, as: ProgramManager }
            - { call: "POST /completion/discovery-items", payload: { program_id: "${prog_id}", description: "Wing-root corrosion blend-out" }, as: ShopTechnician, captures: { di1: $.data.id } }
            - { call: "POST /completion/discovery-items/${di1}/estimate", payload: { est_cost_cents: 300000, est_hours: 40 }, as: ProgramManager }
            - { call: "GET /completion/programs/${prog_id}", as: ProgramManager, captures: { prog_v1: $.data.version } }
            - { call: "POST /completion/discovery-items/${di1}/approve", payload: { expected_program_version: "${prog_v1}" }, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "POST /completion/discovery-items/${di1}/complete", payload: { actual_cost_cents: 333333 }, as: ShopTechnician }
            - { call: "POST /completion/discovery-items", payload: { program_id: "${prog_id}", description: "Fairing fastener replacement" }, as: ShopTechnician, captures: { di2: $.data.id } }
            - { call: "POST /completion/discovery-items/${di2}/estimate", payload: { est_cost_cents: 300000, est_hours: 40 }, as: ProgramManager }
            - { call: "GET /completion/programs/${prog_id}", as: ProgramManager, captures: { prog_v2: $.data.version } }
