              as: SlotCoordinator
              as_user_id: "usr-coord-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with data.error_id == \"ERR_CARRIER_NOT_FOUND\""
            - "Season.${season_id}.held_series_count == 0"

      - name: attach_slot_rejects_a_holding_whose_station_is_not_an_endpoint_of_the_leg
        claim_type: foreign_key_integrity
        grounds:
          - "validations.priority_59_ERR_SLOT_STATION_MISMATCH"
          - endpoints.POST_flight_legs_attach_slot
        distinguishing_aspect: |
          Cross-reference integrity is more than existence: both the SlotHolding and the FlightLeg
          exist and belong to the same carrier and season, but the holding sits at a coordinated station
          that is neither the leg's origin nor its destination, so the link must fail with
          ERR_SLOT_STATION_MISMATCH (422). A second coordinated station is required for this corner,
          which is exactly why the fixture creates DUS.
        test_recipe:
          setup:
