      - name: publication_version_validate_twice_second_call_rejected
        claim_type: idempotency
        grounds:
          - state_machines.PublicationVersion.review_DRAFT_to_VALIDATED
          - endpoints."POST /publication-versions/{id}/validate"
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          The editorial axis has no VALIDATED -> VALIDATED self-loop, so a second validate on the
          same version is refused with ERR_INVALID_STATE rather than silently re-stamping — and
          validated_by_user_id keeps the FIRST reviewer's id, which is what the segregation-of-duties
          gate later reads.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; SystemArea POWERTRAIN, Manufacturer ACME, VehicleModel AX7 exist"
            - "One Publication with one WITHHELD/DRAFT version"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /system-areas"
              payload: { code: "POWERTRAIN", name: "Powertrain", requires_calibration_doc: false, requires_security_credential: true }
              as: PlatformAdmin
              captures: { sa_pt_id: $.data.id }
            - call: "POST /manufacturers"
              payload: { name: "Acme Motors", oem_code: "ACME", region: "NA", independent_list_monthly_cents: 115000, independent_covered_system_count: 3, oem_dealer_monthly_cents: 100000, oem_dealer_covered_system_count: 4 }
