            - call: "POST /blood-bank/supplier-orders/${so2}/receive"
              payload: { units: [{ unit_number: "U-200", product_type: "FFP", abo_type: "A", rh_type: "NEG", volume_ml: 250, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-501", lot_number: "LOT-2", antigen_negative: [] }] }
