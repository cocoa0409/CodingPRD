              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_lim}/components"
              payload: { component_type: "REVENUE_PERCENT", unit: "PERCENT_BPS", rate_value: 2500, sequence: 2 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_lim}/activate"
              payload: {}
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers"
              payload: { legal_name: "Lila Limit", driver_type: "LEASED_OPERATOR", home_state: "TX", per_diem_elected: false }
              as: PayrollAdmin
              captures: { drv_lim: $.data.id }
            - call: "POST /driver-pay/drivers/${drv_lim}/assign-pay-package"
              payload: { pay_package_id: "${pkg_lim}" }
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers/${drv_lim}/status"
              payload: { new_status: "ACTIVE" }
              as: PayrollAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T09:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/advances"
              payload: { driver_id: "${drv_lim}", advance_type: "CASH_ADVANCE", amount_cents: 100000, installment_cents: 20000 }
              as: SettlementClerk
              captures: { adv_lima: $.data.id }
          trigger:
            - call: "POST /driver-pay/advances"
              payload: { driver_id: "${drv_lim}", advance_type: "FUEL_CARD", amount_cents: 60000, installment_cents: 15000 }
              as: SettlementClerk
              captures: { err_lim: $.data.error_id }
            - call: "POST /driver-pay/advances"
              payload: { driver_id: "${drv_lim}", advance_type: "FUEL_CARD", amount_cents: 50000, installment_cents: 15000 }
              as: SettlementClerk
              captures: { adv_limb: $.data.id }
          assert:
            - "the 60000 request returns HTTP 422 with error_id ERR_ADVANCE_LIMIT_EXCEEDED because 100000 + 60000 == 160000"
            - "immediately after it Driver.${drv_lim}.advance_outstanding_cents == 100000 and exactly 1 Advance row exists"
            - "the 50000 request returns HTTP 201 because 100000 + 50000 == 150000 does not exceed the limit"
            - "Advance.${adv_limb}.status == ISSUED and outstanding_cents == 50000 and recovered_cents == 0"
            - "Driver.${drv_lim}.advance_outstanding_cents == 150000"
      - name: documentation_is_required_only_for_detention_tarping_and_breakdown
