  - rule_id: boundary_precision_check
    instances:
      - name: order_fulfills_at_exact_quantity
        grounds:
          - calculations.order_fulfillment
          - state_machines.CustomerOrder.IN_PRODUCTION_to_FULFILLED
        distinguishing_aspect: |
          Boundary on a COUNT metric reached through POST /api/inspections/{id}/disposition: with
          quantity == 2, the first ACCEPT leaves the order IN_PRODUCTION (accepted_count 1 < 2) and
          the second ACCEPT flips it to FULFILLED at exact equality (accepted_count == quantity
          triggers; >= semantics, not >).
        test_recipe:
          setup:
            - "Order qty 2; pattern impressions 1; two molds poured on one slot producing castings C1, C2, both advanced to FINAL_INSPECTION"
