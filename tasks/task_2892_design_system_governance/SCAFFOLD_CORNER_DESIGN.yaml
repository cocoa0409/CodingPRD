              payload: { package_version: "1.0.0", token_compliance_ratio: 0.95 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { and_status: $.data.status }
            - call: "GET /design-system/components/${comp_id}"
              payload: {}
              as: DesignSystemLead
