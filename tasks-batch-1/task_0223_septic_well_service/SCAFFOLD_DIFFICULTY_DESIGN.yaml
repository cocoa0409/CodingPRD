              payload: { name: "Tina", shift_start_minute: 480, shift_end_minute: 1020 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /routes"
              payload: { technician_id: "${tech_id}", route_date: "2026-06-23" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", work_type: "PUMPING", scheduled_date: "2026-06-23", window_start_minute: 540, estimated_gallons: 500 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { measured_gallons: 500 }
              as: FieldTech
              as_user_id: "${tech_id}"
          assert:
            - "Route.${route_id}.booked_minutes == 0"
            - "WorkOrder.${wo_id}.status == COMPLETED"
