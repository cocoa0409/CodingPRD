            - "meta pagination: total_count == 3, has_more == true, limit == 2, offset == 0"

      - name: get_crew_returns_computed_booked_days
        claim_type: computed_read
        grounds: [entities.Crew.fields.booked_days, endpoints]
        distinguishing_aspect: "GET /api/crews/{id} returns the computed booked_days (0 for a crew with no scheduled jobs)."
        test_recipe:
          setup: ["A crew with no jobs"]
          setup_api_calls:
            - call: "POST /api/crews"
              payload: { name: "Crew C", region: "NE", is_certified_leaf_guard: true }
              as: Admin
              captures: { crew: "$.data.id" }
          trigger:
            - call: "GET /api/crews/${crew}"
              payload: {}
              as: Admin
              captures: { bd: "$.data.booked_days" }
          assert:
            - "bd == 0"

  # --------------------------------------------------------------- RBAC
  - section: rbac
    instances:
      - name: get_lead_unauthenticated_returns_401
        claim_type: role_denial
        grounds: ["errors[ERR_UNAUTHENTICATED]", "validations[priority=1]"]
        distinguishing_aspect: "A request with the X-User-Role header omitted returns ERR_UNAUTHENTICATED (401) before any resource lookup."
        test_recipe:
          setup: ["A lead exists"]
          setup_api_calls:
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "HO", address: "21 St", phone: "555-0021", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead: "$.data.id" }
          trigger:
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
          assert:
            - "With the X-User-Role header OMITTED, response is 401 ERR_UNAUTHENTICATED"

      - name: scheduler_cannot_create_quote_returns_403
        claim_type: role_denial
        grounds: ["errors[ERR_UNAUTHORIZED]", roles, "validations[priority=2]"]
        distinguishing_aspect: "POST /api/quotes as a Scheduler (not in the endpoint's roles [SalesRep, Admin]) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Product, rep, lead, appointment"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { name: "MicroMesh", category: "LEAF_GUARD", base_rate_cents_per_foot: 3000, available_colors: ["WHITE","COPPER"], premium_colors: ["COPPER"], color_surcharge_cents_per_foot: 500 }
              as: Admin
              captures: { pid: "$.data.id" }
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "HO", address: "22 St", phone: "555-0022", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Admin
              captures: { appt: "$.data.id" }
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
              captures: { lv: "$.data.version" }
          trigger:
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead}", appointment_id: "${appt}", sales_rep_id: "${rep}", product_id: "${pid}", color: "WHITE", estimated_linear_feet: 100, downspout_count: 0, discount_pct: 0, expected_lead_version: "${lv}" }
              as: Scheduler
          assert:
            - "HTTP 403 ERR_UNAUTHORIZED (Scheduler cannot author quotes)"

      - name: salesrep_cannot_schedule_job_returns_403
        claim_type: role_denial
        grounds: ["errors[ERR_UNAUTHORIZED]", roles]
        distinguishing_aspect: "POST /api/jobs/{id}/schedule as a SalesRep (not in [Scheduler, Admin]) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A PENDING job"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { name: "MicroMesh", category: "LEAF_GUARD", base_rate_cents_per_foot: 3000, available_colors: ["WHITE","COPPER"], premium_colors: ["COPPER"], color_surcharge_cents_per_foot: 500 }
              as: Admin
              captures: { pid: "$.data.id" }
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/crews"
              payload: { name: "Crew C", region: "NE", is_certified_leaf_guard: true }
              as: Admin
              captures: { crew: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "HO", address: "23 St", phone: "555-0023", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Admin
              captures: { appt: "$.data.id" }
            - call: "POST /api/appointments/${appt}/transition"
              payload: { to_status: "COMPLETED", measured_linear_feet: 210 }
              as: Admin
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
              captures: { lv: "$.data.version" }
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead}", appointment_id: "${appt}", sales_rep_id: "${rep}", product_id: "${pid}", color: "WHITE", estimated_linear_feet: 210, downspout_count: 0, discount_pct: 0, expected_lead_version: "${lv}" }
              as: Admin
              captures: { qid: "$.data.id" }
            - call: "POST /api/quotes/${qid}/present"
              payload: {}
              as: Admin
            - call: "POST /api/quotes/${qid}/transition"
              payload: { to_status: "ACCEPTED" }
              as: Admin
            - call: "GET /api/jobs"
              payload: { quote_id: "${qid}" }
              as: Admin
              captures: { jid: "$.data[0].id" }
          trigger:
            - call: "POST /api/jobs/${jid}/schedule"
              payload: { crew_id: "${crew}", install_date: "2026-06-10" }
              as: SalesRep
              as_user_id: "${rep}"
          assert:
            - "HTTP 403 ERR_UNAUTHORIZED (SalesRep cannot schedule installs)"

      - name: salesrep_cannot_act_on_other_reps_lead_returns_403
        claim_type: ownership
        grounds: ["errors[ERR_UNAUTHORIZED]", roles, entities.Lead.fields.sales_rep_id]
        distinguishing_aspect: "SalesRep acting with X-User-ID != the lead's sales_rep_id is denied ERR_UNAUTHORIZED (403) on POST /api/leads/{id}/transition (entity_backed ownership)."
        test_recipe:
          setup: ["Two reps repA and repB; a lead owned by repB"]
          setup_api_calls:
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { repA: "$.data.id" }
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep B", region: "NE" }
              as: Admin
              captures: { repB: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "HO", address: "24 St", phone: "555-0024", region: "NE", sales_rep_id: "${repB}" }
              as: Admin
              captures: { lead: "$.data.id" }
          trigger:
            - call: "POST /api/leads/${lead}/transition"
              payload: { to_status: "CONTACTED" }
              as: SalesRep
              as_user_id: "${repA}"
          assert:
            - "HTTP 403 ERR_UNAUTHORIZED (repA is not the owning rep repB)"

  # ------------------------------------- CROSS-CUTTING COMPLEXITY LAYERS
  - section: cross_cutting
    instances:
      - name: quote_create_stale_lead_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[quote-create-supersede-stale-lead]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a first quote-create advances Lead.version, a second create still carrying the pre-advance expected_lead_version is rejected 412 ERR_STALE_VERSION (two strictly sequential requests)."
        test_recipe:
          setup: ["A lead with an appointment; version observed before the first quote create"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { name: "MicroMesh", category: "LEAF_GUARD", base_rate_cents_per_foot: 3000, available_colors: ["WHITE","COPPER"], premium_colors: ["COPPER"], color_surcharge_cents_per_foot: 500 }
              as: Admin
              captures: { pid: "$.data.id" }
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "HO", address: "25 St", phone: "555-0025", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Admin
              captures: { appt: "$.data.id" }
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
              captures: { lv: "$.data.version" }
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead}", appointment_id: "${appt}", sales_rep_id: "${rep}", product_id: "${pid}", color: "WHITE", estimated_linear_feet: 100, downspout_count: 0, discount_pct: 0, expected_lead_version: "${lv}" }
              as: Admin
              captures: { q1: "$.data.id" }
          trigger:
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead}", appointment_id: "${appt}", sales_rep_id: "${rep}", product_id: "${pid}", color: "WHITE", estimated_linear_feet: 120, downspout_count: 0, discount_pct: 0, expected_lead_version: "${lv}" }
              as: Admin
          assert:
            - "First create succeeds and advances Lead.version (quote1 created, prior quote would be SUPERSEDED)"
            - "Second create carrying the stale expected_lead_version (${lv}) returns 412 ERR_STALE_VERSION"

      - name: quote_supersede_on_new_quote
        claim_type: cascading_side_effects
        grounds: [state_machines.Quote.DRAFT_to_SUPERSEDED, entities.Quote.fields.status]
        distinguishing_aspect: "Creating a second quote for a lead sets the prior DRAFT quote to SUPERSEDED (observed via GET on the first quote)."
        test_recipe:
          setup: ["A lead with one DRAFT quote"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { name: "MicroMesh", category: "LEAF_GUARD", base_rate_cents_per_foot: 3000, available_colors: ["WHITE","COPPER"], premium_colors: ["COPPER"], color_surcharge_cents_per_foot: 500 }
              as: Admin
              captures: { pid: "$.data.id" }
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "HO", address: "26 St", phone: "555-0026", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Admin
              captures: { appt: "$.data.id" }
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
              captures: { lv1: "$.data.version" }
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead}", appointment_id: "${appt}", sales_rep_id: "${rep}", product_id: "${pid}", color: "WHITE", estimated_linear_feet: 100, downspout_count: 0, discount_pct: 0, expected_lead_version: "${lv1}" }
              as: Admin
              captures: { q1: "$.data.id" }
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
              captures: { lv2: "$.data.version" }
          trigger:
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead}", appointment_id: "${appt}", sales_rep_id: "${rep}", product_id: "${pid}", color: "COPPER", estimated_linear_feet: 120, downspout_count: 0, discount_pct: 0, expected_lead_version: "${lv2}" }
              as: Admin
              captures: { q2: "$.data.id" }
            - call: "GET /api/quotes/${q1}"
              payload: {}
              as: Admin
              captures: { q1_status: "$.data.status" }
          assert:
            - "q1_status == SUPERSEDED (prior DRAFT quote superseded by the new quote)"

      - name: accept_cascade_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [state_machines.Quote.PRESENTED_to_ACCEPTED]
        excluded_because:
          difficulty_instance: transitive_cascade / accept_quote_cascade_depth3
          rationale: "The Job->Lead WON->Referral PAYABLE chain is asserted end-to-end in the named §1.8 instance."

      - name: tier_threshold_covered_by_boundary
        claim_type: rate_threshold_triggers
        grounds: [calculations.quote_pricing]
        excluded_because:
          difficulty_instance: boundary_precision_check / quote_tier_boundary_200ft
          rationale: "The >=200 ft tier crossing is asserted at 199/200 in the named §1.8 instance."

      - name: crew_days_input_set_filtering_covered
        claim_type: derived_field_reconciliation
        grounds: [calculations.crew_booked_days]
        excluded_because:
          difficulty_instance: compensating_invariant / crew_days_conserved_on_cancel
          rationale: "booked_days recompute over {SCHEDULED, IN_PROGRESS} is asserted (2 then 0) in the named §1.8 instance."

  # --------------------------------------------------------- CONSISTENCY
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_accept_cascade
        claim_type: immediate
        grounds: [state_machines.Lead.QUOTED_to_WON]
        excluded_because:
          difficulty_instance: transitive_cascade / accept_quote_cascade_depth3
          rationale: "The named §1.8 instance reads WON lead, PENDING job, and PAYABLE referral immediately after the accept in the same test (immediate consistency)."
