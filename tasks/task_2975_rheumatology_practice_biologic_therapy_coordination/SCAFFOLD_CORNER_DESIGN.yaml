            - call: "POST /patients"
              payload: { mrn: "RH0001", full_name: "Pat One", date_of_birth: "1975-04-12", diagnosis_code: "RA_SEROPOSITIVE", registry_consent: true }
              as: RegistryAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /screening-records"
              payload: { patient_id: "${pat_id}", screen_type: "TB_IGRA", result: "NEGATIVE", collected_at: "2026-07-20T00:00:00Z", resulted_at: "2026-07-21T00:00:00Z" }
