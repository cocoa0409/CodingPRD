            - { call: "POST /customers", payload: { name: "Mojave Water", account_number: "MW-920", credit_limit_cents: 99999999, warranty_terms_days: 365, pool_program: false }, as: ServiceManager, captures: { cust: $.data.id } }
            - { call: "POST /capacity-windows", payload: { label: "W1", window_start: "2026-06-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z", bay_hours_capacity: 1000 }, as: Planner, captures: { win: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "P-9201", equipment_class: "PUMP", manufacturer: "Flowserve", model: "M2", rated_flow_gpm: 500, test_standard: "API_610_PER_POINT" }, as: IntakeCoordinator, captures: { a1: $.data.id } }
