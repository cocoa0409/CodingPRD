            - call: "POST /players/${po2_id}/currency-accounts"
              payload: { currency_code: "HARD_GEM" }
              as: LiveOpsCommander
              captures: { po2_gem_id: $.data.id }
            - call: "POST /offers"
              payload: { season_id: "${season_id}", offer_type: "LIMITED_TIME", sku: "OWN_PACK", price_tier: "T1", list_price_minor: 300, line_items: [{ sku: "OWN_COINS", base_price_minor: 300, declared_value_minor: 400, granted_currency_code: "HARD_GEM", granted_amount_minor: 300 }], window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-20T00:00:00Z" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/submit"
              payload: {}
              as: EconomyDesigner
              as_user_id: "u_designer_1"
            - call: "POST /offers/${offer_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
            - call: "GET /seasons/${season_id}"
              payload: {}
              as: LiveOpsCommander
              captures: { season_v1: $.data.version }
            - call: "POST /offers/${offer_id}/publish"
              payload: { expected_season_version: "${season_v1}" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { offer_v1: $.data.version }
          trigger:
            - call: "GET /players/${po2_id}/pacing"
              payload: { variant: "REALIZED" }
              as: Player
              as_user_id: "${po1_id}"
              captures: { e1: $.data.error_id }
            - call: "GET /players/${po2_id}/currency-accounts"
              payload: { limit: 10, offset: 0 }
