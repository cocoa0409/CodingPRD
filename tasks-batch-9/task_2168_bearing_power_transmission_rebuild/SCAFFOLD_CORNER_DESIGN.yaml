  # ===========================================================================
  - section: rbac
    instances:

      - name: planner_cannot_receive_cores_or_post_credit_notes
        claim_type: exclusive_operation_denied
        grounds:
          - roles.ShopAdmin.exclusive_operations
          - validations[priority=2]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "Core receipt and ledger adjustments are ShopAdmin-exclusive: a Planner calling POST /shop/core-units or POST /shop/customers/{id}/credit-notes gets HTTP 403 ERR_ROLE_NOT_PERMITTED, and an Inspector gets the same on POST /shop/rebuild-orders/{id}/cancel."
        test_recipe:
          setup:
            - "One customer and one standard, so the forbidden calls would otherwise be well-formed."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { name: "Role Mill", account_code: "ROL-001" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /shop/customers/${cust_id}/assets"
              payload: { asset_tag: "ROL-01-GBX", criticality: "STANDARD", duty_class: "CONTINUOUS" }
              as: ShopAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /shop/clearance-standards"
              payload: { model_code: "SKF-22324-CCK", base_core_value_cents: 90000, max_rebuild_count: 3, warranty_hours: 8000, warranty_months: 18, cleanroom_required: false, required_feature_codes: ["BORE"], feature_bands: [{feature_code: "BORE", min_um: 40, max_um: 90, rework_extension_um: 15, deduction_pct: 0.10, weight: 0.40}] }
              as: ShopAdmin
              captures: { std_id: $.data.id }
            - call: "POST /shop/core-units"
              payload: { customer_id: "${cust_id}", clearance_standard_id: "${std_id}", serial_no: "SN-ROL-1", rebuild_count: 0, declared_condition_grade: "GRADE_B" }
              as: ShopAdmin
              captures: { core_id: $.data.id }
            - call: "POST /shop/rebuild-orders"
              payload: { customer_id: "${cust_id}", core_unit_id: "${core_id}", customer_asset_id: "${asset_id}", labor_hours: 4.0 }
              as: Planner
              captures: { order_id: $.data.id }
            - call: "GET /shop/customers/${cust_id}"
              as: ShopAdmin
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /shop/core-units"
              payload: { customer_id: "${cust_id}", clearance_standard_id: "${std_id}", serial_no: "SN-ROL-2", rebuild_count: 0, declared_condition_grade: "GRADE_B" }
              as: Planner
              captures: { e1: $.data.error_id }
            - call: "POST /shop/customers/${cust_id}/credit-notes"
              payload: { amount_cents: 1000, memo: "not my job", expected_customer_version: "${cv}" }
              as: Planner
              captures: { e2: $.data.error_id }
            - call: "POST /shop/rebuild-orders/${order_id}/cancel"
              payload: { cancel_reason: "not my job either" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { e3: $.data.error_id }
          assert:
            - "the Planner core receipt returns HTTP 403 with error_id == ERR_ROLE_NOT_PERMITTED"
            - "the Planner credit note returns HTTP 403 with error_id == ERR_ROLE_NOT_PERMITTED"
            - "the Inspector cancel returns HTTP 403 with error_id == ERR_ROLE_NOT_PERMITTED"
            - "GET /shop/core-units?customer_id=${cust_id} returns total_count == 1"
            - "Customer.${cust_id}.total_credit_balance_cents == 67500"
            - "RebuildOrder.${order_id}.work_status == DRAFT"

      - name: planner_cannot_use_the_inspector_only_submit_action
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=3]
          - errors[ERR_ACTION_NOT_PERMITTED_FOR_ROLE]
          - roles.Inspector.exclusive_operations
          - roles.ReliabilityEngineer.exclusive_operations
        distinguishing_aspect: "The action-role map is finer than the endpoint role list: a ShopAdmin may call inspections/advance but not with SUBMIT (Inspector-only), and an Inspector may call it but not with RETURN (ReliabilityEngineer or ShopAdmin only); both return 403 ERR_ACTION_NOT_PERMITTED_FOR_ROLE rather than ERR_ROLE_NOT_PERMITTED."
        test_recipe:
          setup:
            - "One DRAFT inspection with a linked reading and one BORE measurement, ready to submit."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { name: "Action Mill", account_code: "ACT-001" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /shop/customers/${cust_id}/assets"
              payload: { asset_tag: "ACT-01-GBX", criticality: "STANDARD", duty_class: "CONTINUOUS" }
              as: ShopAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /shop/clearance-standards"
              payload: { model_code: "SKF-22324-CCK", base_core_value_cents: 90000, max_rebuild_count: 3, warranty_hours: 8000, warranty_months: 18, cleanroom_required: false, required_feature_codes: ["BORE"], feature_bands: [{feature_code: "BORE", min_um: 40, max_um: 90, rework_extension_um: 15, deduction_pct: 0.10, weight: 0.40}] }
              as: ShopAdmin
              captures: { std_id: $.data.id }
            - call: "POST /shop/core-units"
              payload: { customer_id: "${cust_id}", clearance_standard_id: "${std_id}", serial_no: "SN-ACT-1", rebuild_count: 0, declared_condition_grade: "GRADE_B" }
              as: ShopAdmin
              captures: { core_id: $.data.id }
            - call: "POST /shop/rebuild-orders"
              payload: { customer_id: "${cust_id}", core_unit_id: "${core_id}", customer_asset_id: "${asset_id}", labor_hours: 4.0 }
              as: Planner
              captures: { order_id: $.data.id }
            - call: "POST /shop/vibration-readings"
              payload: { customer_asset_id: "${asset_id}", reading_at: "2026-08-02T06:00:00Z", overall_velocity_mm_s: 2.10, bpfo_amplitude_g: 0.30, bpfi_amplitude_g: 0.25, baseline_amplitude_g: 0.20 }
              as: ReliabilityEngineer
              captures: { vr_id: $.data.id }
            - call: "POST /shop/inspections"
              payload: { rebuild_order_id: "${order_id}", linked_vibration_reading_id: "${vr_id}" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { insp_id: $.data.id }
            - call: "POST /shop/inspections/${insp_id}/measurements"
              payload: { feature_code: "BORE", measured_um: 85 }
              as: Inspector
              as_user_id: "insp-1"
          trigger:
            - call: "POST /shop/inspections/${insp_id}/advance"
              payload: { action: "SUBMIT" }
              as: ShopAdmin
              as_user_id: "admin-1"
              captures: { e1: $.data.error_id }
            - call: "POST /shop/inspections/${insp_id}/advance"
              payload: { action: "SUBMIT" }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /shop/inspections/${insp_id}/advance"
              payload: { action: "RETURN", return_reason: "not my call" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { e2: $.data.error_id }
            - call: "POST /shop/inspections/${insp_id}/advance"
              payload: { action: "RETURN", return_reason: "re-shoot it" }
              as: ReliabilityEngineer
              as_user_id: "eng-1"
          assert:
            - "the ShopAdmin SUBMIT returns HTTP 403 with error_id == ERR_ACTION_NOT_PERMITTED_FOR_ROLE"
            - "the ShopAdmin SUBMIT error_id != ERR_ROLE_NOT_PERMITTED"
            - "the Inspector SUBMIT returns HTTP 200 with status == SUBMITTED and submitted_by_user_id == insp-1"
            - "the Inspector RETURN returns HTTP 403 with error_id == ERR_ACTION_NOT_PERMITTED_FOR_ROLE"
            - "the ReliabilityEngineer RETURN returns HTTP 200 with status == RETURNED"

      - name: customer_cannot_decide_another_customers_part_line
        claim_type: exclusive_operation_denied
        grounds:
          - validations[priority=7]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - roles.Customer.identity
        distinguishing_aspect: "Customer identity is entity_backed:Customer, so X-User-ID must equal the part line's order's customer_id: a decide call carrying the other account's id returns 403 ERR_NOT_RESOURCE_OWNER while the owning account's identical call succeeds."
