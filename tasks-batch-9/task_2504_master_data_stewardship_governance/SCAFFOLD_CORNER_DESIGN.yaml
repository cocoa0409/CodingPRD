            - call: "GET /mdm/quality-rules/${qr1_id}"
              as: Auditor
              captures: { g_threshold: $.data.threshold_pct, g_version: $.data.version }
          assert:
            - "${qr1_v1} == 1"
            - "HTTP 200, ${p_threshold} == 95.00, ${p_version} == 2"
            - "${p_weight} == 40, ${p_dim} == COMPLETENESS, ${p_sev} == HIGH, ${p_status} == ACTIVE - untouched by the partial update"
            - "${g_threshold} == 95.00 and ${g_version} == 2 - the write is durable"

