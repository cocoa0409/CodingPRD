  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # ---- Instance 1: depth>=3 — terminate -> appointment REVOKED -> bond EXONERATED & fiduciary count dec
      - name: tc_terminate_revokes_appointment_then_exonerates_bond
        grounds:
          - state_machines.GuardianshipCase.ACTIVE_to_TERMINATED
          - state_machines.Appointment.ACTIVE_to_REVOKED
          - state_machines.Bond.APPROVED_to_EXONERATED
          - entities.Fiduciary.fields.open_appointment_count
          - entities.RestrictedAccount.fields.status
        distinguishing_aspect: |
          Depth-3 chain from a single terminate trigger: case ACTIVE->TERMINATED (link 1) causes the
          Appointment ACTIVE->REVOKED (link 2), and that revocation itself causes the Appointment's
          Bond APPROVED->EXONERATED (link 3) plus Fiduciary.open_appointment_count 1->0; each link is
          caused by the prior link, not directly by terminate.
        test_recipe:
          setup:
            - "CONSERVATORSHIP case ACTIVE with a qualified fiduciary (open_appointment_count 1), APPROVED bond, OPEN restricted account, latest accounting APPROVED, no pending expenditures"
          setup_api_calls:
            - call: "POST /gc/protected-persons"
              payload: { full_name: "Term Ward", date_of_birth: "1945-08-08", annual_income_cents: 0, liquid_estate_cents: 8000000 }
