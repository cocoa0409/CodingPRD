              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artwork_id: $.data.id }
            - call: "POST /public-art/deaccession-cases"
              payload: { artwork_id: "${artwork_id}", criteria: ["REDUNDANT_TO_COLLECTION"], disposition: "SALE", disposition_target_ref: "AUCTION-HOUSE-7", comment_days: 7 }
              as: PublicArtManager
              as_user_id: "mgr-1"
              captures: { case_id: $.data.id }
            - call: "POST /public-art/deaccession-cases/${case_id}/advance"
              payload: { advance_note: "open the comment period" }
              as: PublicArtManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /public-art/deaccession-cases/${case_id}/advance"
              payload: {}
              as: PublicArtManager
              as_user_id: "mgr-1"
              captures: { e_comment: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: PublicArtManager
              as_user_id: "mgr-1"
            - call: "POST /public-art/deaccession-cases/${case_id}/advance"
              payload: { advance_note: "comment period closed" }
              as: PublicArtManager
              as_user_id: "mgr-1"
            - call: "POST /public-art/deaccession-cases/${case_id}/votes"
              payload: { ballot: "APPROVE", ballot_note: "I initiated this case" }
              as: PublicArtManager
              as_user_id: "mgr-1"
              captures: { e_initiator: $.data.error_id }
            - call: "POST /public-art/deaccession-cases/${case_id}/votes"
              payload: { ballot: "RECUSE" }
              as: PublicArtManager
              as_user_id: "mgr-1"
            - call: "POST /public-art/deaccession-cases/${case_id}/votes"
              payload: { ballot: "APPROVE" }
              as: ArtCommissionMember
              as_user_id: "acm-1"
            - call: "POST /public-art/deaccession-cases/${case_id}/votes"
              payload: { ballot: "DENY", ballot_note: "changed my mind" }
              as: ArtCommissionMember
              as_user_id: "acm-1"
              captures: { e_duplicate: $.data.error_id }
          assert:
            - "the first trigger returns 409 with error_id == ERR_PUBLIC_COMMENT_OPEN: the clock 2026-08-01 is before public_comment_closes_at 2026-08-08T00:00:00Z, and the case stays PUBLIC_COMMENT with public_comment_opens_on == 2026-08-01"
            - "the third trigger returns 200 with status == BOARD_REVIEW: the precondition is logical clock >= public_comment_closes_at, so the closing instant itself passes"
            - "the fourth trigger returns 409 with error_id == ERR_INITIATOR_CANNOT_VOTE and leaves approve_count == 0"
            - "the fifth trigger returns 200: the initiator's RECUSE ballot is accepted, giving recuse_count == 1"
            - "the seventh trigger returns 409 with error_id == ERR_DUPLICATE_BALLOT and deny_count stays 0 while approve_count == 1"
            - "the case is still BOARD_REVIEW with decision_ratio == null: only one non-RECUSE ballot exists and QUORUM_MIN_VOTES is 5, and RECUSE ballots never count toward quorum"

