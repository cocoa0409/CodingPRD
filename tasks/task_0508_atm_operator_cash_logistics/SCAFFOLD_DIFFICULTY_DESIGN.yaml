              payload: { legal_name: "M", commission_pct_bps: 1000, commission_flat_per_wd_cents: 10, commission_monthly_ceiling_cents: 50000 }
              as: PlatformAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "S", jurisdiction_code: "CA", site_merchant_id: "${sm_id}", route_id: "${route_id}", address: "1 C" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /atms"
              payload: { serial_no: "SN-NOFD", location_id: "${loc_id}", surcharge_cents: 100, note_denomination_cents: 2000 }
