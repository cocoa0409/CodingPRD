# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Infant & Child Sleep Consulting — 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: questionnaire_severity_provisional_vs_reviewed
        grounds:
          - calculations.assessment_severity_score
          - entities.IntakeQuestionnaire.fields.provisional_severity_score
          - entities.IntakeQuestionnaire.fields.reviewed_severity_score
        distinguishing_aspect: |
          Entity domain = intake questionnaire / child sleep assessment. The SAME
          answers object scores 69 under the provisional variant (answers only) and
          76 under the reviewed variant (adds adjustment_points +12 and the NEWBORN
          band modifier -5): 69 + 12 - 5 = 76.
        test_recipe:
          setup:
            - "Consultant and family exist; case in ASSESSMENT with a SUBMITTED questionnaire"
            - "child_birth_date 2026-05-01 vs clock 2026-08-01 -> child_age_months 3 -> NEWBORN (band modifier -5)"
            - "answers: night_wakings 4, night_feeds 2, bedtime_resistance_minutes 45, nap_total_minutes 60, no flags -> base 40+8+15+6 = 69"
          setup_api_calls:
            - call: "POST /sleep-consulting/consultants"
              payload: { full_name: "Dana Sleep", certification_no: "CERT-100", max_active_cases: 5 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /sleep-consulting/families"
              payload: { full_name: "Fam Alpha", email: "alpha@x.com" }
              as: Anonymous
              captures: { fam_id: $.data.id }
            - call: "POST /sleep-consulting/cases"
              payload: { family_id: "${fam_id}", consultant_id: "${cons_id}", child_birth_date: "2026-05-01", delivery_mode: "ONE_ON_ONE", guarantee_goal_night_wakings: 2 }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { case_id: $.data.id }
            - call: "POST /sleep-consulting/cases/${case_id}/questionnaire"
              payload: { answers: { night_wakings: 4, night_feeds: 2, bedtime_resistance_minutes: 45, nap_total_minutes: 60, medical_flags: false, preterm_birth: false } }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { q_id: $.data.id, prov_score: $.data.provisional_severity_score }
          trigger:
            - call: "POST /sleep-consulting/questionnaires/${q_id}/review"
              payload: { adjustment_points: 12, review_note: "colic suspected" }
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { rev_score: $.data.reviewed_severity_score }
          assert:
            - "IntakeQuestionnaire.${q_id}.provisional_severity_score == 69"
            - "IntakeQuestionnaire.${q_id}.reviewed_severity_score == 76"
            - "reviewed_severity_score != provisional_severity_score for identical answers (69 != 76)"
            - "IntakeQuestionnaire.${q_id}.status == REVIEWED and ClientCase.${case_id}.status == PLANNING"

      - name: package_price_new_vs_repeat_client
        grounds:
          - calculations.package_price_cents
          - entities.SupportPackage.fields.repeat_discount_cents
          - entities.ClientFamily.fields.is_repeat_client
        distinguishing_aspect: |
          Entity domain = package purchase pricing (money), distinct from the
          questionnaire-assessment domain of the sibling instance. Identical tier
          (STANDARD) and identical age band (NEWBORN) price at net 59850 for a new
          client but 59850 - round_half_up(59850*0.15)=8978 -> 50872 for a repeat
          client.
        test_recipe:
          setup:
            - "Family A is a new client whose case reached PLANNING; child NEWBORN at purchase"
            - "Family B completed a prior case (COMPLETED at 2026-08-15) and opened a second case that reached PLANNING; is_repeat_client == true"
          setup_api_calls:
            - call: "POST /sleep-consulting/consultants"
              payload: { full_name: "Dana Sleep", certification_no: "CERT-101", max_active_cases: 5 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /sleep-consulting/families"
              payload: { full_name: "Fam A", email: "a@x.com" }
              as: Anonymous
              captures: { fama_id: $.data.id }
            - call: "POST /sleep-consulting/cases"
              payload: { family_id: "${fama_id}", consultant_id: "${cons_id}", child_birth_date: "2026-05-01", delivery_mode: "ONE_ON_ONE", guarantee_goal_night_wakings: 2 }
              as: Parent
              as_user_id: "${fama_id}"
              captures: { casea_id: $.data.id }
            - call: "POST /sleep-consulting/cases/${casea_id}/questionnaire"
              payload: { answers: { night_wakings: 2, night_feeds: 1, bedtime_resistance_minutes: 30, nap_total_minutes: 120, medical_flags: false, preterm_birth: false } }
              as: Parent
              as_user_id: "${fama_id}"
              captures: { qa_id: $.data.id }
            - call: "POST /sleep-consulting/questionnaires/${qa_id}/review"
              payload: { adjustment_points: 0 }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /sleep-consulting/cases/${casea_id}/packages"
              payload: { tier: "STANDARD", kind: "INITIAL", starts_on: "2026-08-01" }
              as: Parent
              as_user_id: "${fama_id}"
              captures: { pkga_id: $.data.id, pkga_net: $.data.net_price_cents }
            - call: "POST /sleep-consulting/families"
              payload: { full_name: "Fam B", email: "b@x.com" }
              as: Anonymous
              captures: { famb_id: $.data.id }
            - call: "POST /sleep-consulting/cases"
              payload: { family_id: "${famb_id}", consultant_id: "${cons_id}", child_birth_date: "2026-05-01", delivery_mode: "ONE_ON_ONE", guarantee_goal_night_wakings: 2 }
              as: Parent
              as_user_id: "${famb_id}"
              captures: { caseb1_id: $.data.id }
            - call: "POST /sleep-consulting/cases/${caseb1_id}/questionnaire"
              payload: { answers: { night_wakings: 2, night_feeds: 1, bedtime_resistance_minutes: 30, nap_total_minutes: 120, medical_flags: false, preterm_birth: false } }
              as: Parent
              as_user_id: "${famb_id}"
              captures: { qb1_id: $.data.id }
            - call: "POST /sleep-consulting/questionnaires/${qb1_id}/review"
              payload: { adjustment_points: 0 }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "GET /sleep-consulting/cases/${caseb1_id}"
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { vb1: $.data.version }
            - call: "POST /sleep-consulting/cases/${caseb1_id}/plans"
              payload: { method: "GENTLE_NO_CRY", target_night_wake_count: 2, target_longest_stretch_minutes: 240, expected_case_version: "${vb1}" }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /sleep-consulting/cases/${caseb1_id}/packages"
              payload: { tier: "BASIC", kind: "INITIAL", starts_on: "2026-08-01" }
              as: Parent
              as_user_id: "${famb_id}"
            - call: "POST /sleep-consulting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /sleep-consulting/cases/${caseb1_id}/complete"
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /sleep-consulting/cases"
              payload: { family_id: "${famb_id}", consultant_id: "${cons_id}", child_birth_date: "2026-05-01", delivery_mode: "ONE_ON_ONE", guarantee_goal_night_wakings: 2 }
              as: Parent
              as_user_id: "${famb_id}"
              captures: { caseb2_id: $.data.id }
            - call: "POST /sleep-consulting/cases/${caseb2_id}/questionnaire"
              payload: { answers: { night_wakings: 2, night_feeds: 1, bedtime_resistance_minutes: 30, nap_total_minutes: 120, medical_flags: false, preterm_birth: false } }
              as: Parent
              as_user_id: "${famb_id}"
              captures: { qb2_id: $.data.id }
            - call: "POST /sleep-consulting/questionnaires/${qb2_id}/review"
              payload: { adjustment_points: 0 }
              as: Consultant
              as_user_id: "${cons_id}"
          trigger:
            - call: "POST /sleep-consulting/cases/${caseb2_id}/packages"
              payload: { tier: "STANDARD", kind: "INITIAL", starts_on: "2026-08-15" }
              as: Parent
              as_user_id: "${famb_id}"
              captures: { pkgb2_id: $.data.id, pkgb2_discount: $.data.repeat_discount_cents, pkgb2_net: $.data.net_price_cents }
          assert:
            - "SupportPackage.${pkga_id}.net_price_cents == 59850 (54900 + 4950 surcharge, new client, no discount)"
            - "ClientFamily.${famb_id}.is_repeat_client == true at second purchase"
            - "SupportPackage.${pkgb2_id}.gross_price_cents == 59850"
            - "SupportPackage.${pkgb2_id}.repeat_discount_cents == 8978"
            - "SupportPackage.${pkgb2_id}.net_price_cents == 50872"
            - "50872 != 59850: identical tier and age band diverge solely on the repeat-client variant"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: severity_score_multibranch_clamp
        grounds:
          - calculations.assessment_severity_score
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction. Exercises the nap-surplus
          max(0, ...) branch (nap_total 200 -> ceil((150-200)/15) = -3 clamped to 0),
          the floor(bedtime/3) term, the conditional medical penalty (-20), and the
          final clamp(0,100) lower bound: 10 + 4 + 3 + 0 - 20 = -3 -> clamped to 0.
        test_recipe:
          setup:
            - "Case in INTAKE; child birth 2026-03-15 -> INFANT at clock 2026-08-01 (band modifier 0, irrelevant here)"
            - "answers chosen to drive the formula through the max() branch and the lower clamp"
          setup_api_calls:
            - call: "POST /sleep-consulting/consultants"
              payload: { full_name: "Dana Sleep", certification_no: "CERT-102", max_active_cases: 5 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /sleep-consulting/families"
              payload: { full_name: "Fam M", email: "m@x.com" }
              as: Anonymous
              captures: { fam_id: $.data.id }
            - call: "POST /sleep-consulting/cases"
              payload: { family_id: "${fam_id}", consultant_id: "${cons_id}", child_birth_date: "2026-03-15", delivery_mode: "ONE_ON_ONE", guarantee_goal_night_wakings: 2 }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /sleep-consulting/cases/${case_id}/questionnaire"
              payload: { answers: { night_wakings: 1, night_feeds: 1, bedtime_resistance_minutes: 10, nap_total_minutes: 200, medical_flags: true, preterm_birth: false } }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { q_id: $.data.id }
          assert:
            - "IntakeQuestionnaire.${q_id}.provisional_severity_score == 0 (raw -3 clamped up to the 0 floor)"
            - "nap surplus branch contributed 0 (max(0, -3)); medical branch contributed -20; floor(10/3) contributed 3"

      - name: package_discount_rounding_order
        grounds:
          - calculations.package_price_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The scaffold pins
          round-the-discount-THEN-subtract: round_half_up(34850 * 0.15) =
          round_half_up(5227.5) = 5228, then 34850 - 5228 = 29622. The opposite
          order (subtract exact, round the remainder) yields 29623 — one cent apart.
        test_recipe:
          setup:
            - "Repeat family (one prior COMPLETED case) with a second case in PLANNING; child NEWBORN at purchase"
            - "BASIC tier: gross = 29900 + 4950 newborn surcharge = 34850"
          setup_api_calls:
            - call: "POST /sleep-consulting/consultants"
              payload: { full_name: "Dana Sleep", certification_no: "CERT-103", max_active_cases: 5 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /sleep-consulting/families"
              payload: { full_name: "Fam R", email: "r@x.com" }
              as: Anonymous
              captures: { fam_id: $.data.id }
            - call: "POST /sleep-consulting/cases"
              payload: { family_id: "${fam_id}", consultant_id: "${cons_id}", child_birth_date: "2026-05-01", delivery_mode: "ONE_ON_ONE", guarantee_goal_night_wakings: 2 }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { case1_id: $.data.id }
            - call: "POST /sleep-consulting/cases/${case1_id}/questionnaire"
              payload: { answers: { night_wakings: 2, night_feeds: 1, bedtime_resistance_minutes: 30, nap_total_minutes: 120, medical_flags: false, preterm_birth: false } }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { q1_id: $.data.id }
            - call: "POST /sleep-consulting/questionnaires/${q1_id}/review"
              payload: { adjustment_points: 0 }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "GET /sleep-consulting/cases/${case1_id}"
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { v1: $.data.version }
            - call: "POST /sleep-consulting/cases/${case1_id}/plans"
              payload: { method: "GENTLE_NO_CRY", target_night_wake_count: 2, target_longest_stretch_minutes: 240, expected_case_version: "${v1}" }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /sleep-consulting/cases/${case1_id}/packages"
              payload: { tier: "BASIC", kind: "INITIAL", starts_on: "2026-08-01" }
              as: Parent
              as_user_id: "${fam_id}"
            - call: "POST /sleep-consulting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /sleep-consulting/cases/${case1_id}/complete"
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /sleep-consulting/cases"
              payload: { family_id: "${fam_id}", consultant_id: "${cons_id}", child_birth_date: "2026-05-01", delivery_mode: "ONE_ON_ONE", guarantee_goal_night_wakings: 2 }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { case2_id: $.data.id }
            - call: "POST /sleep-consulting/cases/${case2_id}/questionnaire"
              payload: { answers: { night_wakings: 2, night_feeds: 1, bedtime_resistance_minutes: 30, nap_total_minutes: 120, medical_flags: false, preterm_birth: false } }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { q2_id: $.data.id }
            - call: "POST /sleep-consulting/questionnaires/${q2_id}/review"
              payload: { adjustment_points: 0 }
              as: Consultant
              as_user_id: "${cons_id}"
          trigger:
            - call: "POST /sleep-consulting/cases/${case2_id}/packages"
              payload: { tier: "BASIC", kind: "INITIAL", starts_on: "2026-08-15" }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { pkg2_id: $.data.id }
          assert:
            - "SupportPackage.${pkg2_id}.gross_price_cents == 34850"
            - "SupportPackage.${pkg2_id}.repeat_discount_cents == 5228 (discount rounded half-up BEFORE subtraction)"
            - "SupportPackage.${pkg2_id}.net_price_cents == 29622 (NOT 29623, which the opposite rounding order would produce)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: sleep_plan_adjustment_cycle
        grounds:
          - state_machines.SleepPlan.ACTIVE_to_NEEDS_ADJUSTMENT
          - state_machines.SleepPlan.NEEDS_ADJUSTMENT_to_ACTIVE
        distinguishing_aspect: |
          Entity = SleepPlan. Cyclic shape: the SAME plan instance loops
          ACTIVE -> NEEDS_ADJUSTMENT -> ACTIVE -> NEEDS_ADJUSTMENT across two
          regression reviews and one resume, without being superseded (plan id
          and plan_sequence unchanged throughout).
        test_recipe:
          setup:
            - "Case in ACTIVE_SUPPORT with one ACTIVE plan (plan_sequence 1)"
            - "Clock 2026-08-01 so log_date 2026-08-01 is submittable"
          setup_api_calls:
            - call: "POST /sleep-consulting/consultants"
              payload: { full_name: "Dana Sleep", certification_no: "CERT-104", max_active_cases: 5 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /sleep-consulting/families"
              payload: { full_name: "Fam C", email: "c@x.com" }
              as: Anonymous
              captures: { fam_id: $.data.id }
            - call: "POST /sleep-consulting/cases"
              payload: { family_id: "${fam_id}", consultant_id: "${cons_id}", child_birth_date: "2026-05-01", delivery_mode: "ONE_ON_ONE", guarantee_goal_night_wakings: 2 }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { case_id: $.data.id }
            - call: "POST /sleep-consulting/cases/${case_id}/questionnaire"
              payload: { answers: { night_wakings: 3, night_feeds: 1, bedtime_resistance_minutes: 30, nap_total_minutes: 120, medical_flags: false, preterm_birth: false } }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { q_id: $.data.id }
            - call: "POST /sleep-consulting/questionnaires/${q_id}/review"
              payload: { adjustment_points: 0 }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "GET /sleep-consulting/cases/${case_id}"
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { case_v: $.data.version }
            - call: "POST /sleep-consulting/cases/${case_id}/plans"
              payload: { method: "GENTLE_NO_CRY", target_night_wake_count: 2, target_longest_stretch_minutes: 240, expected_case_version: "${case_v}" }
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /sleep-consulting/cases/${case_id}/logs"
              payload: { log_date: "2026-08-01", night_wake_count: 6, longest_stretch_minutes: 90, nap_count: 2, nap_total_minutes: 120 }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { log1_id: $.data.id }
            - call: "POST /sleep-consulting/logs/${log1_id}/review"
              payload: { outcome: "REGRESSION", review_note: "wake spike" }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /sleep-consulting/plans/${plan_id}/resume"
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /sleep-consulting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /sleep-consulting/cases/${case_id}/logs"
              payload: { log_date: "2026-08-02", night_wake_count: 7, longest_stretch_minutes: 80, nap_count: 2, nap_total_minutes: 110 }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { log2_id: $.data.id }
          trigger:
            - call: "POST /sleep-consulting/logs/${log2_id}/review"
              payload: { outcome: "REGRESSION" }
              as: Consultant
              as_user_id: "${cons_id}"
          assert:
            - "SleepPlan.${plan_id}.status == NEEDS_ADJUSTMENT after the second regression review"
            - "SleepPlan.${plan_id}.plan_sequence == 1 and id unchanged: the cycle resumed the same plan (never SUPERSEDED)"
            - "Intermediate state after resume was ACTIVE (observed on the resume response)"
            - "ClientCase.${case_id}.status == NEEDS_ATTENTION"

      - name: client_case_completed_reopen_cycle
        grounds:
          - state_machines.ClientCase.ACTIVE_SUPPORT_to_COMPLETED
          - state_machines.ClientCase.COMPLETED_to_ACTIVE_SUPPORT
        distinguishing_aspect: |
          Entity = ClientCase (distinct from the SleepPlan cycle of the sibling
          instance). Branching + cyclic shape: ACTIVE_SUPPORT -> COMPLETED ->
          ACTIVE_SUPPORT via a FOLLOW_UP package purchase inside the 180-day
          window, and the repeat-client variant prices the follow-up package.
        test_recipe:
          setup:
            - "Case completed the full journey: plan created, BASIC package [2026-08-01, 2026-08-14] EXPIRED at clock 2026-08-15, case COMPLETED"
            - "child_birth_date 2026-04-10 -> INFANT at 2026-08-15 (no newborn surcharge)"
          setup_api_calls:
            - call: "POST /sleep-consulting/consultants"
              payload: { full_name: "Dana Sleep", certification_no: "CERT-105", max_active_cases: 5 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /sleep-consulting/families"
              payload: { full_name: "Fam D", email: "d@x.com" }
              as: Anonymous
              captures: { fam_id: $.data.id }
            - call: "POST /sleep-consulting/cases"
              payload: { family_id: "${fam_id}", consultant_id: "${cons_id}", child_birth_date: "2026-04-10", delivery_mode: "ONE_ON_ONE", guarantee_goal_night_wakings: 2 }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { case_id: $.data.id }
            - call: "POST /sleep-consulting/cases/${case_id}/questionnaire"
              payload: { answers: { night_wakings: 2, night_feeds: 1, bedtime_resistance_minutes: 30, nap_total_minutes: 120, medical_flags: false, preterm_birth: false } }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { q_id: $.data.id }
            - call: "POST /sleep-consulting/questionnaires/${q_id}/review"
              payload: { adjustment_points: 0 }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "GET /sleep-consulting/cases/${case_id}"
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { case_v: $.data.version }
            - call: "POST /sleep-consulting/cases/${case_id}/plans"
              payload: { method: "GENTLE_NO_CRY", target_night_wake_count: 2, target_longest_stretch_minutes: 240, expected_case_version: "${case_v}" }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /sleep-consulting/cases/${case_id}/packages"
              payload: { tier: "BASIC", kind: "INITIAL", starts_on: "2026-08-01" }
              as: Parent
              as_user_id: "${fam_id}"
            - call: "POST /sleep-consulting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /sleep-consulting/cases/${case_id}/complete"
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { completed_status: $.data.status }
          trigger:
            - call: "POST /sleep-consulting/cases/${case_id}/packages"
              payload: { tier: "BASIC", kind: "FOLLOW_UP", starts_on: "2026-08-15" }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { fu_pkg_id: $.data.id, fu_net: $.data.net_price_cents }
          assert:
            - "ClientCase.${case_id}.status == COMPLETED before the trigger (captured completed_status)"
            - "ClientCase.${case_id}.status == ACTIVE_SUPPORT after the FOLLOW_UP purchase (cycle reopened)"
            - "ClientFamily.${fam_id}.is_repeat_client == true"
            - "SupportPackage.${fu_pkg_id}.kind == FOLLOW_UP, repeat_discount_cents == 4485, net_price_cents == 25415"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depth >= 3 and >= 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: regression_review_cascade_depth3
        grounds:
          - state_machines.NightlySleepLog.PENDING_REVIEW_to_REVIEWED_REGRESSION
          - state_machines.SleepPlan.ACTIVE_to_NEEDS_ADJUSTMENT
          - state_machines.ClientCase.ACTIVE_SUPPORT_to_NEEDS_ATTENTION
          - entities.Consultant.fields.active_case_count
        distinguishing_aspect: |
          Trigger = POST /logs/{logId}/review (REGRESSION). Depth-3 causal chain:
          log -> REVIEWED_REGRESSION causes plan ACTIVE -> NEEDS_ADJUSTMENT (link 1),
          which causes case ACTIVE_SUPPORT -> NEEDS_ATTENTION (link 2), which removes
          the case from the consultant's ACTIVE_SUPPORT-only aggregation, recomputing
          active_case_count 1 -> 0 (link 3). Each link is caused by the previous one.
        test_recipe:
          setup:
            - "Consultant max_active_cases 5 with exactly one case in ACTIVE_SUPPORT (active_case_count == 1) and one ACTIVE plan"
          setup_api_calls:
            - call: "POST /sleep-consulting/consultants"
              payload: { full_name: "Dana Sleep", certification_no: "CERT-106", max_active_cases: 5 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /sleep-consulting/families"
              payload: { full_name: "Fam E", email: "e@x.com" }
              as: Anonymous
              captures: { fam_id: $.data.id }
            - call: "POST /sleep-consulting/cases"
              payload: { family_id: "${fam_id}", consultant_id: "${cons_id}", child_birth_date: "2026-05-01", delivery_mode: "ONE_ON_ONE", guarantee_goal_night_wakings: 2 }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { case_id: $.data.id }
            - call: "POST /sleep-consulting/cases/${case_id}/questionnaire"
              payload: { answers: { night_wakings: 3, night_feeds: 1, bedtime_resistance_minutes: 30, nap_total_minutes: 120, medical_flags: false, preterm_birth: false } }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { q_id: $.data.id }
            - call: "POST /sleep-consulting/questionnaires/${q_id}/review"
              payload: { adjustment_points: 0 }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "GET /sleep-consulting/cases/${case_id}"
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { case_v: $.data.version }
            - call: "POST /sleep-consulting/cases/${case_id}/plans"
              payload: { method: "GENTLE_NO_CRY", target_night_wake_count: 2, target_longest_stretch_minutes: 240, expected_case_version: "${case_v}" }
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { plan_id: $.data.id }
            - call: "GET /sleep-consulting/consultants/${cons_id}"
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { cnt_before: $.data.active_case_count }
            - call: "POST /sleep-consulting/cases/${case_id}/logs"
              payload: { log_date: "2026-08-01", night_wake_count: 6, longest_stretch_minutes: 90, nap_count: 2, nap_total_minutes: 120 }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { log_id: $.data.id }
          trigger:
            - call: "POST /sleep-consulting/logs/${log_id}/review"
              payload: { outcome: "REGRESSION" }
              as: Consultant
              as_user_id: "${cons_id}"
          assert:
            - "NightlySleepLog.${log_id}.review_status == REVIEWED_REGRESSION (trigger row)"
            - "SleepPlan.${plan_id}.status == NEEDS_ADJUSTMENT (link 1)"
            - "ClientCase.${case_id}.status == NEEDS_ATTENTION (link 2)"
            - "Consultant.${cons_id}.active_case_count == 0 after the cascade (link 3; was 1 before, captured cnt_before)"

      - name: refund_paid_cascade_depth2
        grounds:
          - state_machines.RefundRequest.APPROVED_to_PAID
          - state_machines.ClientCase.ACTIVE_SUPPORT_to_CLOSED_REFUNDED
          - state_machines.SupportPackage.ACTIVE_to_CLOSED_EARLY
        distinguishing_aspect: |
          Trigger = POST /refund-requests/{refundId}/pay — distinct from the log-review
          trigger of the sibling instance. Depth-2 chain: refund APPROVED -> PAID causes
          case ACTIVE_SUPPORT -> CLOSED_REFUNDED (link 1), which itself cancels the
          ACTIVE plan, closes the ACTIVE package (CLOSED_EARLY, entitlements frozen at
          0) and cancels the SCHEDULED session without entitlement release (link 2).
        test_recipe:
          setup:
            - "Case ACTIVE_SUPPORT; child NEWBORN; BASIC package ACTIVE (net 34850, 1 call)"
            - "One SCHEDULED session 2026-08-10T10:00-11:00Z consumed the single call (remaining_calls == 0)"
            - "Clock advanced to 2026-08-05 (> purchased_at + 48h) so PRO_RATA eligibility holds; 0 completed sessions and 0 messages -> amount 34850 > 0"
            - "Refund PRO_RATA REQUESTED and APPROVED (family credit +34850)"
          setup_api_calls:
            - call: "POST /sleep-consulting/consultants"
              payload: { full_name: "Dana Sleep", certification_no: "CERT-107", max_active_cases: 5 }
              as: PracticeAdmin
