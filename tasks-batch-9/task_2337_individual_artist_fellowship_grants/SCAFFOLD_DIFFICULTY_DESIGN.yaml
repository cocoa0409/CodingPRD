  # ===========================================================================
  # RULE 5 — priority_pair_validation_conflict
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: frozen_posture_p70_outranks_installment_not_due_p80
        grounds:
          - validations[priority=70]
          - validations[priority=80]
          - calculations.cycle_budget_posture
          - state_machines.PaymentInstallment.SCHEDULED_to_RELEASED
        distinguishing_aspect: |
          One unchanged release request must return ERR_CYCLE_POSTURE_FROZEN while both the
          posture and the due-date rules are violated, then ERR_INSTALLMENT_NOT_DUE once the
          breach is redacted, then 200 once the clock reaches the scheduled date — three
          distinct outcomes from the identical call, which is only possible when the checks run
          in declared priority order rather than in convenience order.
        test_recipe:
          setup:
            - "CycleMain award accepted with three SCHEDULED installments; installment 1 is scheduled 2027-01-01"
            - "The logical clock stays at 2026-10-16, so no installment is due yet"
          setup_api_calls:
