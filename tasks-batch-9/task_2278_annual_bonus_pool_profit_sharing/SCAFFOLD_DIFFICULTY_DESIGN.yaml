  - rule_id: combinatorial_formula
    instances:

      - name: five_input_funding_curve_lands_on_floor_multiplier
        grounds:
          - calculations.metric_achievement
          - calculations.company_achievement
          - calculations.bu_weighted_achievement
          - calculations.blended_achievement
          - calculations.funding_curve_multiplier
          - endpoints."POST /bonus-plans/{planId}/certification-decision"
        distinguishing_aspect: |
          Mode (a): one certification request folds five independent inputs
          (two metric actuals against their own three-point bands, two plan
          weights, one capped BU scorecard) through two piecewise functions
          and a weighted mean. The composition is non-proportional: REVENUE
          scores 50.00 while sitting exactly ON its threshold, EBITDA scores
          75.00 mid-band, and the 60.00 company / 100.00 BU / 100.00
          individual mix lands blended on 80.00 — the exact curve floor, so
          the multiplier is 0.5000 and not 0.0000. Any implementation that
          averages achievements unweighted (58.33), or that treats the
          threshold as exclusive (REVENUE 0.00 -> company 30.00 -> blended
          65.00 -> multiplier 0.0000), produces a different funded pool.
        test_recipe:
          setup:
            - "One unit, one plan (weights 50/30/20), L3 and L5 target rows, two metrics with different bands and weights 60.00 / 40.00, one pool, two participants (Ada L5 20,000,000 hired 2025-03-01; Ben L3 10,000,000 hired 2026-07-01)."
            - "REVENUE actual 900 == threshold_value; EBITDA actual 95 sits between threshold 90 and target 100; the BU scorecard is certified at 100.00; targets are assigned and the plan is submitted for certification."
          setup_api_calls:
            - call: "POST /business-units"
              payload: { unit_code: "EAST-A", name: "East Region A" }
              as: PlanAdmin
              captures: { east_id: "$.data.id" }
            - call: "POST /bonus-plans"
