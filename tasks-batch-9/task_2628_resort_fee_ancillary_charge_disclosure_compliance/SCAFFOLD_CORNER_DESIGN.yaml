      - name: higher_priority_rule_wins_when_two_are_violated
        claim_type: priority_conflict
        grounds:
          - validations[priority=10]
          - validations[priority=16]
        excluded_because:
          difficulty_instance: stale_property_version_outranks_property_not_active_on_program_create
          rationale: "That §1.8 priority_pair_validation_conflict instance violates priorities 10 and 16 in a single request, asserts the 412 ERR_STALE_PROPERTY_VERSION rather than the 409 ERR_PROPERTY_NOT_ACTIVE, and includes the control that proves the lower-priority rule is armed — the canonical priority-conflict claim."

      - name: publishing_into_an_occupied_effective_window_is_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=27]
          - errors[ERR_FEE_PROGRAM_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: fee_program_half_open_effective_interval_allows_exact_adjacency
          rationale: "The §1.8 resource_temporal_overlap instance already pins the half-open semantics on the property calendar: exact adjacency at 2026-12-01 is admitted, a one-second earlier effective_from is rejected with ERR_FEE_PROGRAM_PERIOD_OVERLAP, and only other PUBLISHED programs count as counterparts."

      - name: publish_is_blocked_by_the_properties_derived_posture
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=17]
          - errors[ERR_PROPERTY_DISCLOSURE_FROZEN]
        excluded_because:
          difficulty_instance: fee_program_publish_blocked_while_property_posture_is_non_compliant
          rationale: "That §1.8 cross_entity_state_dependency instance drives the whole cross-entity story — a FLAGGED profile makes the property NON_COMPLIANT, the publish returns ERR_PROPERTY_DISCLOSURE_FROZEN, and remediating the PROFILE (not the program) is what unblocks it — leaving no distinct corner for this validation."

