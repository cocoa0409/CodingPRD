            - "PriceChangeRequest.${pcr_id}.state is still PENDING_APPROVAL and applied_price_cents is null"
            - "MenuItem.${item_a_id}.zone_price_overrides is empty (the rejected APPLY had no partial effect)"

      - name: payment_noncompliance_beats_item_outside_published_bundle
        grounds:
          - validations.priority_18_ERR_PAYMENT_DEVICE_NON_COMPLIANT
          - validations.priority_31_ERR_ITEM_NOT_IN_PUBLISHED_BUNDLE
          - entities.Device.fields.payment_compliance_state
        distinguishing_aspect: |
          Pair P2: a `business_safety` rule at priority 18 versus a `business_referential`
          rule at priority 31 — a different category pair from P1 and P3. The kiosk never
          received a payment attestation (compliance_state UNATTESTED, which degrades but
          does not freeze the store) and the ordered item's category is outside the published
          slot, so both hold; only the compliance error may surface.
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A, cluster CL_WEST, store S001 (offset -300, local minute 720)."
            - "The published bundle's LUNCH slot covers ENTREE only, so DESSERT Item C is outside the snapshot even though it is stocked at S001."
            - "Kiosk K001 heartbeats all-true and caches the bundle, but NO payment attestation is posted, so compliance_state stays UNATTESTED and Store.content_posture is DEGRADED (not FROZEN)."
