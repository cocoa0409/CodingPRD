              payload: { chassis_id: "${ch}", expected_chassis_version: "${ch_v}" }
              as: ProductionScheduler
              as_user_id: "ps-1"
            - call: "POST /upfit/upfit-orders/${uo}/submit-engineering"
              payload: {}
              as: UpfitEngineer
              as_user_id: "eng-1"
            - call: "POST /upfit/upfit-orders/${uo}/release"
              payload: {}
              as: ProductionScheduler
              as_user_id: "ps-1"
          trigger:
            - call: "POST /upfit/upfit-orders/${uo}/cancel"
              payload: { reason: "customer cancelled the purchase order" }
              as: PlantAdmin
              as_user_id: "adm-1"
          assert:
            - "HTTP 200"
            - "UpfitOrder.${uo}.build_status == \"CANCELLED\""
            - "Chassis.${ch}.status == \"INSPECTED\" (not RECEIVED — the scale ticket survives)"
            - "Chassis.${ch}.allocated_upfit_order_id is null"
            - "Chassis.${ch}.measured_front_axle_weight_lb == 4905 and measured_rear_axle_weight_lb == 2755"
            - "EquipmentInstallation.${ei_lift}.status == \"REMOVED\""
            - "UpfitOrder.${uo}.committed_aux_amp_draw == 12 (the liftgate's 30 A dropped out with the removal; only the body remains)"
            - "Chassis.${ch}.ownership == \"CUSTOMER_ASSIGNED\" — allocation to a CUSTOMER_SPECIFIC order stamped it and the cancellation does not un-stamp it"

      - name: parallel_build_and_compliance_dimensions_move_independently
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.UpfitOrder.build_status
          - state_machines.UpfitOrder.compliance_status
        distinguishing_aspect: |
          The shape row for `parallel` demands that the two order dimensions advance without dragging
          each other and that the combined state stays coherent.
        excluded_because:
          difficulty_instance: order_build_and_compliance_dimensions_advance_independently
          rationale: |
            That §1.8 instance already walks the order through RELEASED/SCHEDULED/IN_BUILD while the
            compliance dimension independently climbs NOT_STARTED -> DESIGN_CERTIFIED ->
            MEASURED_CERTIFIED -> LABELED, asserting the full cross-product at each step. A separate
            corner test would restate it with weaker assertions.

      - name: four_hop_cascade_from_an_equipment_removal
        claim_type: Cascade down
        grounds:
          - state_machines.EquipmentInstallation.INSTALLED_to_REMOVED
          - state_machines.UpfitOrder.compliance_status.LABELED_to_DESIGN_CERTIFIED
          - state_machines.BuildSlot.CLOSED_to_IN_BUILD
        distinguishing_aspect: |
          Removing an installed item must propagate four hops: flow recompute, AS_MEASURED
          certification void, label void, and the BUILD_COMPLETE -> IN_BUILD slot reopen.
        excluded_because:
          difficulty_instance: equipment_remove_cascades_four_hops_to_slot_reopen
          rationale: |
            §1.8 owns this cascade end-to-end, including the ordering sensitivity (the label must be
            voided because the certification was voided, not directly) and the reopened slot's
            identity. Re-testing it here would duplicate a 25-call chain verbatim.

      - name: compensating_reversal_of_the_order_liability_ledger
        claim_type: Compensation
        grounds:
          - state_machines.WarrantyClaim.ADJUDICATED_to_DISPUTED
          - calculations.warranty_liability_split
        distinguishing_aspect: |
          A dispute is the undo of an adjudication: the order's three liability fields must return to
          their pre-adjudication values with no drift, while the claim keeps its own cents.
        excluded_because:
          difficulty_instance: warranty_cents_conservation_across_dispute_and_readjudication
          rationale: |
            §1.8 already asserts the full round trip (adjudicate -> dispute -> re-inspect ->
            re-adjudicate) with exact cents at every step and the invariant that the three shares sum
            to claim_cost_cents throughout.

      - name: ledger_sync_of_committed_flow_when_an_installation_leaves
        claim_type: Ledger sync
        grounds:
          - state_machines.EquipmentInstallation.PLANNED_to_REMOVED
          - entities.UpfitOrder.fields.committed_pto_flow_gpm
        distinguishing_aspect: |
          Every installation state change must resynchronise the ancestor order's committed flow, and
          the before/after values must reconcile against the waterfall.
        excluded_because:
          difficulty_instance: pto_flow_conservation_across_install_and_remove
          rationale: |
            §1.8 pins the conservation law across an install/remove pair, including the restamped
            allocated_flow_gpm of every surviving row, which subsumes a plain ledger-sync check.

      - name: guarded_measured_approval_requires_something_physically_on_the_truck
        claim_type: guarded transitions
        grounds:
          - state_machines.WeightCertification.DRAFT_to_APPROVED
          - state_machines.UpfitOrder.compliance_status.DESIGN_CERTIFIED_to_MEASURED_CERTIFIED
        distinguishing_aspect: |
          The guard is cross-entity: the certification may only be approved when the ORDER reports a
          mounted body or the order owns at least one INSTALLED/COMMISSIONED installation.
        excluded_because:
          difficulty_instance: measured_certification_approve_requires_body_installed
          rationale: |
            §1.8 drives exactly this guard, including the negative case where nothing is physically
            attached and the approval is refused with ERR_ORDER_INVALID_STATE.

  # =========================================================================
  # 3. From Table 3 (Calculations)
  # =========================================================================
  - section: calculations
    instances:

      - name: as_designed_certification_stamps_the_book_axle_split
        claim_type: Correct Result
        grounds:
          - calculations.axle_load_distribution
          - calculations.payload_capacity
          - entities.WeightCertification.fields.front_axle_load_lb
        distinguishing_aspect: |
          A fixture where ALL THREE payload candidates exist and the GVWR bucket is the binding one:
          the body sits at 182 in behind the front axle on a 200 in wheelbase, so 1911 lb of the
          2100 lb body lands on the rear axle and only 189 lb on the front. Moments are accumulated
          unrounded and rounded once per axle, so an implementation that rounds each item first
          drifts by a pound.
        test_recipe:
          setup:
            - "F550-DRW-84CA (curb 4820 / 2680, WB 200, GVWR 19500, front GAWR 7000, rear GAWR 14706) with SERVICE-11FT (2100 lb, cg 62 in, cargo cg 66 in) mounted at offset 120 in."
            - "The order is allocated to an inspected unit and submitted to engineering; no equipment is planned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /upfit/chassis-models"
              payload: { code: "F550-DRW-84CA", make: "FORD", gvwr_lb: 19500, front_gawr_lb: 7000, rear_gawr_lb: 14706, wheelbase_in: 200, cab_to_axle_in: 84, curb_front_axle_lb: 4820, curb_rear_axle_lb: 2680, max_aux_amp_draw: 60, electrical_bus: "J1939_CAN", pto_provision: "FULL", pto_max_flow_gpm: 18, body_builder_book_rev: "BBB-2026.1", incomplete_vehicle_document_rev: "IVD-2026.1" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { cm_a: "$.data.id" }
            - call: "POST /upfit/body-specs"
              payload: { code: "SERVICE-11FT", body_type: "SERVICE", weight_lb: 2100, cg_from_body_front_in: 62, cargo_cg_from_body_front_in: 66, length_in: 132, required_min_ca_in: 84, required_min_wheelbase_in: 189, aux_amp_draw: 12, requires_hydraulics: false, list_price_cents: 1450000 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { bs_svc: "$.data.id" }
            - call: "POST /upfit/customers"
              payload: { name: "Metro Fleet Services", account_code: "MFS-001", fleet_contact_email: "fleet@metro.example" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { cust: "$.data.id" }
            - call: "POST /upfit/build-configurations"
              payload: { config_code: "CFG-SVC-A", chassis_model_id: "${cm_a}", body_spec_id: "${bs_svc}", standardization_tier: "CUSTOM" }
              as: UpfitEngineer
              as_user_id: "eng-1"
              captures: { cfg: "$.data.id" }
            - call: "POST /upfit/build-configurations/${cfg}/publish"
              payload: {}
              as: UpfitEngineer
              as_user_id: "eng-1"
            - call: "POST /upfit/chassis"
              payload: { vin: "1FDUF5HT0CC30012", chassis_model_id: "${cm_a}", ownership: "POOL_STOCK", availability_date: "2026-08-05" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { ch: "$.data.id" }
            - call: "POST /upfit/chassis/${ch}/inspect"
              payload: { measured_front_axle_weight_lb: 4905, measured_rear_axle_weight_lb: 2755 }
              as: InstallTechnician
              as_user_id: "tech-1"
              captures: { ch_v: "$.data.version" }
            - call: "POST /upfit/upfit-orders"
              payload: { order_number: "UO-5016", order_type: "CUSTOMER_SPECIFIC", customer_id: "${cust}", build_configuration_id: "${cfg}", body_mount_offset_from_front_axle_in: 120 }
              as: ProductionScheduler
