# =============================================================================
# §1.9 Scaffold Corner Design — coverage index for the non-difficulty surface
# Task: task_2375_grocery_fuel_points_cross_banner
#
# Breadth probe over every claim declared by §1.1-§1.7 that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners already
# owned by §1.8 appear as `excluded_because:` stubs with no test_recipe.
# Shared bootstrap fragments are declared once as YAML anchors on their first
# use and reused by alias thereafter.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: banner_creation_stamps_every_declared_default_and_starts_active
        claim_type: Defaults
        grounds:
          - entities.Banner
          - endpoints.POST_/banners
        distinguishing_aspect: "A banner posted with only banner_code and name comes back 201 carrying all seventeen program defaults (1 point per dollar, 4x gift card, 2x pharmacy, 50 points per script, cap 8 across at most 2 promos, 100 points per 10-cent block capped at 100 cents off, 35 owned gallons, 100-point minimum, 500-point rollover cap, 3 transfers, LOT_FIFO, INSTANTANEOUS, threshold 60) with status ACTIVE and version 1."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - &cx_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - &cx_banner
              call: "POST /banners"
              payload: { banner_code: "CORE", name: "Corner Banner" }
              as: ProgramAdmin
              captures: { cb_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is \"object\""
            - "Banner.${cb_id}.base_points_per_dollar == 1 and gift_card_multiplier == 4 and pharmacy_multiplier == 2 and pharmacy_points_per_script == 50"
            - "Banner.${cb_id}.max_stacked_multiplier == 8 and max_stack_count == 2"
            - "Banner.${cb_id}.points_per_discount_block == 100 and cents_off_per_block == 10 and max_cents_off_per_gallon == 100"
            - "Banner.${cb_id}.owned_max_gallons_per_redemption == 35 and min_points_per_redemption == 100 and rollover_cap_points == 500 and max_transfers_per_cycle == 3"
            - "Banner.${cb_id}.expiry_basis == \"LOT_FIFO\" and fraud_scoring_mode == \"INSTANTANEOUS\" and freeze_threshold_score == 60"
            - "Banner.${cb_id}.status == \"ACTIVE\" and version == 1 and id, created_at, updated_at are non-null"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: banner_get_round_trips_every_overridden_program_parameter
        claim_type: Retrieval
        grounds:
          - entities.Banner
          - endpoints.GET_/banners/{id}
        distinguishing_aspect: "A banner created with all seventeen parameters overridden returns them byte-identically through GET, including the two mode enums, so no default silently overwrites a supplied value."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one fully overridden banner."
          setup_api_calls:
            - *cx_clock
            - call: "POST /banners"
              payload: { banner_code: "FULL", name: "Fully Configured Banner", base_points_per_dollar: 2, gift_card_multiplier: 6, pharmacy_multiplier: 3, pharmacy_points_per_script: 75, max_stacked_multiplier: 12, max_stack_count: 3, points_per_discount_block: 200, cents_off_per_block: 15, max_cents_off_per_gallon: 150, owned_max_gallons_per_redemption: 20, min_points_per_redemption: 200, rollover_cap_points: 1000, max_transfers_per_cycle: 5, expiry_basis: "CYCLE_SCOPED", fraud_scoring_mode: "TRAILING_WEIGHTED", freeze_threshold_score: 90 }
              as: ProgramAdmin
              captures: { cfull_id: $.data.id }
          trigger:
            - call: "GET /banners/${cfull_id}"
              payload: {}
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
          assert:
            - "the response status is 200"
            - "Banner.${cfull_id}.base_points_per_dollar == 2 and gift_card_multiplier == 6 and pharmacy_multiplier == 3 and pharmacy_points_per_script == 75"
            - "Banner.${cfull_id}.max_stacked_multiplier == 12 and max_stack_count == 3 and points_per_discount_block == 200 and cents_off_per_block == 15"
            - "Banner.${cfull_id}.expiry_basis == \"CYCLE_SCOPED\" and fraud_scoring_mode == \"TRAILING_WEIGHTED\" and freeze_threshold_score == 90"
            - "Banner.${cfull_id}.owned_max_gallons_per_redemption == 20 and min_points_per_redemption == 200 and rollover_cap_points == 1000 and max_transfers_per_cycle == 5"

      - name: sites_list_paginates_and_filters_by_banner_and_site_type
        claim_type: Listing
        grounds:
          - endpoints.GET_/sites
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With one grocery, one owned fuel centre and one partner station on the banner, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, offset=2 returns the last row with has_more false, and site_type=PARTNER_STATION narrows total_count to 1 — total_count always counts the filtered set, never the page."
        test_recipe:
          setup:
            - "Banner CORE with three sites of distinct types; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - &cx_grocery
              call: "POST /sites"
              payload: { banner_id: "${cb_id}", site_number: "G-100", site_type: "GROCERY" }
              as: ProgramAdmin
              captures: { cg_id: $.data.id }
            - &cx_fuel
              call: "POST /sites"
              payload: { banner_id: "${cb_id}", site_number: "F-100", site_type: "OWNED_FUEL_CENTER" }
              as: ProgramAdmin
              captures: { cf_id: $.data.id }
            - &cx_partner
              call: "POST /sites"
              payload: { banner_id: "${cb_id}", site_number: "P-100", site_type: "PARTNER_STATION", partner_code: "PTR-100", per_gallon_cap_cents: 30, max_gallons_per_redemption: 20 }
              as: ProgramAdmin
              captures: { cp_id: $.data.id }
          trigger:
            - call: "GET /sites"
              payload: { banner_id: "${cb_id}", limit: 2, offset: 0 }
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
            - call: "GET /sites"
              payload: { banner_id: "${cb_id}", limit: 2, offset: 2 }
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
            - call: "GET /sites"
              payload: { banner_id: "${cb_id}", site_type: "PARTNER_STATION" }
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
          assert:
            - "the first page has response_type \"array\", 2 data rows, meta.total_count == 3 and meta.has_more == true"
            - "the second page has 1 data row, meta.total_count == 3 and meta.has_more == false"
            - "the site_type=PARTNER_STATION page has 1 data row with meta.total_count == 1 and that row's id == \"${cp_id}\""
            - "every page echoes meta.limit and meta.offset as requested"

      - name: members_list_by_alt_id_supports_alternate_id_lookup_at_the_pump
        claim_type: Listing
        grounds:
          - endpoints.GET_/members
          - entities.Member.fields.alt_id
        distinguishing_aspect: "The pump's alternate-ID path is a filtered list, not a lookup by id: alt_id=6660000001 returns exactly the one matching member with total_count 1, while an alt_id nobody holds returns an empty array with total_count 0 and has_more false rather than a 404."
        test_recipe:
          setup:
            - "Banner CORE with members holding alt_id 6660000001 and 6660000002; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_fuel
            - &cx_member
              call: "POST /members"
              payload: { banner_id: "${cb_id}", alt_id: "6660000001", card_number: "4100000000000001", full_name: "Corner Member One" }
              as: ProgramAdmin
              captures: { cm_id: $.data.id }
            - call: "POST /members"
              payload: { banner_id: "${cb_id}", alt_id: "6660000002", card_number: "4100000000000002", full_name: "Corner Member Two" }
              as: ProgramAdmin
              captures: { cm2_id: $.data.id }
          trigger:
            - call: "GET /members"
              payload: { banner_id: "${cb_id}", alt_id: "6660000001" }
              as: PumpTerminal
              as_user_id: "${cf_id}"
            - call: "GET /members"
              payload: { banner_id: "${cb_id}", alt_id: "9999999999" }
              as: PumpTerminal
              as_user_id: "${cf_id}"
          assert:
            - "the first list has 1 data row whose id == \"${cm_id}\" and meta.total_count == 1"
            - "the second list has 0 data rows, meta.total_count == 0 and meta.has_more == false"
            - "the second list returns HTTP 200, not 404"

      - name: member_get_with_unknown_id_returns_member_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/members/{id}
          - errors[ERR_MEMBER_NOT_FOUND]
          - validations[priority=30]
        distinguishing_aspect: "A syntactically valid but unused UUID in the path answers 404 ERR_MEMBER_NOT_FOUND, and it does so even for the ProgramAdmin role, so existence is checked after authorisation and before anything else."
        test_recipe:
          setup:
            - "Banner CORE with one member on file; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_member
          trigger:
            - call: "GET /members/00000000-0000-4000-8000-000000000999"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { nf_err: $.data.error_id }
          assert:
            - "the response status is 404 and response_type is \"error\""
            - "${nf_err} == \"ERR_MEMBER_NOT_FOUND\""
            - "the existing Member.${cm_id} is untouched and still retrievable"

      - name: member_creation_missing_card_number_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Member
          - endpoints.POST_/members
          - validations[priority=25]
        distinguishing_aspect: "card_number carries no default, so omitting it from an otherwise complete member payload is refused with 400 ERR_INVALID_REQUEST and no Member row is created — the field is not silently defaulted to null."
        test_recipe:
          setup:
            - "Banner CORE on file; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
          trigger:
            - call: "POST /members"
              payload: { banner_id: "${cb_id}", alt_id: "6660000003", full_name: "Missing Card" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { req_err: $.data.error_id }
          assert:
            - "the response status is 400"
            - "${req_err} == \"ERR_INVALID_REQUEST\""
            - "GET /members?banner_id=${cb_id} returns meta total_count == 0"

      - name: site_creation_rejects_a_site_type_outside_the_declared_enum
        claim_type: Type Constraints
        grounds:
          - entities.Site.fields.site_type
          - validations[priority=25]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "site_type is closed to GROCERY, OWNED_FUEL_CENTER and PARTNER_STATION, so the plausible-looking value \"FUEL_CENTER\" is refused with 400 rather than coerced to OWNED_FUEL_CENTER."
        test_recipe:
          setup:
            - "Banner CORE on file; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
          trigger:
            - call: "POST /sites"
              payload: { banner_id: "${cb_id}", site_number: "X-100", site_type: "FUEL_CENTER" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { enum_err: $.data.error_id }
          assert:
            - "the response status is 400 and ${enum_err} == \"ERR_INVALID_REQUEST\""
            - "GET /sites?banner_id=${cb_id} returns meta total_count == 0"

      - name: purchase_transaction_rejects_an_empty_lines_array
        claim_type: Type Constraints
        grounds:
          - entities.PurchaseTransaction.fields.lines
          - validations[priority=25]
        distinguishing_aspect: "lines is constrained to 1..20 elements, so an empty array is a 400 ERR_INVALID_REQUEST at the request-shape gate — it is never accepted as a zero-point basket."
        test_recipe:
          setup:
            - "Banner CORE with cycles 2026-08 and 2026-09, grocery site and one member; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - &cx_aug
              call: "POST /point-cycles"
              payload: { banner_id: "${cb_id}", cycle_month: "2026-08", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-31T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { c_aug: $.data.id }
            - &cx_sep
              call: "POST /point-cycles"
              payload: { banner_id: "${cb_id}", cycle_month: "2026-09", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-30T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { c_sep: $.data.id }
            - *cx_grocery
            - *cx_member
          trigger:
            - call: "POST /purchase-transactions"
              payload: { member_id: "${cm_id}", site_id: "${cg_id}", transacted_at: "2026-08-01T00:00:00Z", lines: [] }
              as: StoreOperator
              as_user_id: "${cg_id}"
              captures: { lines_err: $.data.error_id }
          assert:
            - "the response status is 400 and ${lines_err} == \"ERR_INVALID_REQUEST\""
            - "GET /purchase-transactions?member_id=${cm_id} returns meta total_count == 0"

      - name: purchase_transaction_system_and_computed_fields_ignore_client_input
        claim_type: System Fields
        grounds:
          - entities.PurchaseTransaction.fields.gross_points_awarded
          - entities.PurchaseTransaction.fields.subtotal_cents
          - endpoints.POST_/purchase-transactions
        distinguishing_aspect: "A creation payload carrying extra id, subtotal_cents, gross_points_awarded and posting_status keys is answered with server-generated values instead: subtotal_cents is derived from the lines as 30000, gross_points_awarded is 0 while unposted, and posting_status is RECORDED regardless of what was sent."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site and one member; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_member
          trigger:
            - call: "POST /purchase-transactions"
              payload: { member_id: "${cm_id}", site_id: "${cg_id}", transacted_at: "2026-08-01T00:00:00Z", lines: [{ category: "GROCERY", amount_cents: 30000, quantity: 1 }] }
              as: StoreOperator
              as_user_id: "${cg_id}"
              captures: { ct_id: $.data.id }
          assert:
            - "the response status is 201"
            - "PurchaseTransaction.${ct_id}.subtotal_cents == 30000 (derived from the lines, not supplied)"
            - "PurchaseTransaction.${ct_id}.gross_points_awarded == 0 and line_points_breakdown == [] while unposted"
            - "PurchaseTransaction.${ct_id}.posting_status == \"RECORDED\" and accrual_status == \"NOT_ACCRUED\""
            - "PurchaseTransaction.${ct_id}.id is server-generated and differs from any client-supplied id, and created_at, updated_at and version are set by the system"
            - "Member.${cm_id}.available_points == 0 (recording alone awards nothing)"

      - name: point_ledger_entry_is_immutable_and_carries_no_version_field
        claim_type: Immutability
        grounds:
          - entities.PointLedgerEntry
          - endpoints.GET_/point-ledger-entries/{id}
        distinguishing_aspect: "PointLedgerEntry is declared with common_fields false: the accrual row exposes id, created_at, member_id, point_cycle_id, entry_type, points_delta, source_kind, source_id and lot_expires_at but no version and no updated_at, and the API offers no endpoint that mutates or deletes it."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site and a member holding one 300-point POSTED basket; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_member
            - &cx_basket
              call: "POST /purchase-transactions"
              payload: { member_id: "${cm_id}", site_id: "${cg_id}", transacted_at: "2026-08-01T00:00:00Z", lines: [{ category: "GROCERY", amount_cents: 30000, quantity: 1 }] }
              as: StoreOperator
              as_user_id: "${cg_id}"
              captures: { cbasket_id: $.data.id }
            - &cx_post
              call: "POST /purchase-transactions/${cbasket_id}/post"
              payload: {}
              as: StoreOperator
              as_user_id: "${cg_id}"
          trigger:
            - call: "GET /point-ledger-entries"
              payload: { member_id: "${cm_id}", entry_type: "ACCRUAL" }
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
          assert:
            - "the list has 1 data row with points_delta == 300, entry_type == \"ACCRUAL\" and source_kind == \"PURCHASE_TRANSACTION\""
            - "that row's source_id == \"${cbasket_id}\" and point_cycle_id == \"${c_aug}\""
            - "that row carries lot_expires_at == \"2026-09-30T23:59:59.999Z\", created_at and id"
            - "that row exposes no version field and no updated_at field"
            - "the endpoint catalogue declares no PATCH, PUT or DELETE for /point-ledger-entries"

      - name: household_link_creation_requires_both_referenced_parents_to_exist
        claim_type: Parent Relationships
        grounds:
          - entities.HouseholdLink.fields.household_id
          - entities.HouseholdLink.fields.member_id
          - validations[priority=32]
          - errors[ERR_HOUSEHOLD_NOT_FOUND]
        distinguishing_aspect: "Body references are existence-checked before anything else: an unknown household_id answers 404 ERR_HOUSEHOLD_NOT_FOUND and an unknown member_id answers 404 ERR_MEMBER_NOT_FOUND, and neither attempt leaves a HouseholdLink row behind."
        test_recipe:
          setup:
            - "Banner CORE with one household and one member; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_member
            - &cx_household
              call: "POST /households"
              payload: { banner_id: "${cb_id}", household_code: "HH-CORE-1" }
              as: LoyaltyAnalyst
              captures: { chh_id: $.data.id }
          trigger:
            - call: "POST /household-links"
              payload: { household_id: "00000000-0000-4000-8000-000000000888", member_id: "${cm_id}", link_role: "PRIMARY" }
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
              captures: { hh_nf_err: $.data.error_id }
            - call: "POST /household-links"
              payload: { household_id: "${chh_id}", member_id: "00000000-0000-4000-8000-000000000777", link_role: "PRIMARY" }
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
              captures: { mem_nf_err: $.data.error_id }
          assert:
            - "the first attempt returns 404 with ${hh_nf_err} == \"ERR_HOUSEHOLD_NOT_FOUND\""
            - "the second attempt returns 404 with ${mem_nf_err} == \"ERR_MEMBER_NOT_FOUND\""
            - "GET /household-links?household_id=${chh_id} returns meta total_count == 0"
            - "Household.${chh_id}.linked_member_count == 0"

      - name: household_creation_zeroes_every_derived_aggregate_and_starts_active
        claim_type: Defaults
        grounds:
          - entities.Household
          - endpoints.POST_/households
        distinguishing_aspect: "A brand-new household starts ACTIVE with frozen_reason and frozen_at null, fraud_score 0, linked_member_count 0, aggregate_available_points 0 and cross_banner_member_ids an empty array — every derived aggregate is initialised rather than left absent."
        test_recipe:
          setup:
            - "Banner CORE on file; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
          trigger:
            - call: "POST /households"
              payload: { banner_id: "${cb_id}", household_code: "HH-CORE-2" }
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
              captures: { chh2_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Household.${chh2_id}.status == \"ACTIVE\" and frozen_reason == null and frozen_at == null"
            - "Household.${chh2_id}.fraud_score == 0 and linked_member_count == 0 and aggregate_available_points == 0"
            - "Household.${chh2_id}.cross_banner_member_ids == []"
            - "Household.${chh2_id}.version == 1"

      - name: point_cycle_creation_starts_open_with_zeroed_close_metrics
        claim_type: Creation
        grounds:
          - entities.PointCycle
          - endpoints.POST_/point-cycles
          - state_machines.PointCycle
        distinguishing_aspect: "A cycle is born OPEN with closed_at null and expired_points_total, rolled_over_points_total and swept_member_count all 0, so the close metrics are readable before the sweep ever runs rather than absent until close."
        test_recipe:
          setup:
            - "Banner CORE on file; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
          trigger:
            - call: "POST /point-cycles"
              payload: { banner_id: "${cb_id}", cycle_month: "2026-11", opens_at: "2026-11-01T00:00:00Z", closes_at: "2026-11-30T23:59:59.999Z" }
              as: LoyaltySupervisor
              as_user_id: "sup-1"
              captures: { c_nov: $.data.id }
          assert:
            - "the response status is 201"
            - "PointCycle.${c_nov}.status == \"OPEN\" and closed_at == null"
            - "PointCycle.${c_nov}.expired_points_total == 0 and rolled_over_points_total == 0 and swept_member_count == 0"
            - "PointCycle.${c_nov}.cycle_month == \"2026-11\" and opens_at == \"2026-11-01T00:00:00Z\" and closes_at == \"2026-11-30T23:59:59.999Z\""

      - name: promo_event_creation_rejects_a_window_whose_start_is_not_before_its_end
        claim_type: Type Constraints
        grounds:
          - entities.PromoEvent.fields.starts_at
          - entities.PromoEvent.fields.ends_at
          - validations[priority=25]
        distinguishing_aspect: "The half-open window must be non-empty: starts_at equal to ends_at is refused with 400 ERR_INVALID_REQUEST, which is a request-shape failure at priority 25 and therefore distinct from the 409 window-conflict rule at priority 56."
        test_recipe:
          setup:
            - "Banner CORE on file; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
          trigger:
            - call: "POST /promo-events"
              payload: { banner_id: "${cb_id}", promo_code: "P_EMPTY", multiplier: 2, applies_to_categories: ["GROCERY"], starts_at: "2026-08-10T00:00:00Z", ends_at: "2026-08-10T00:00:00Z", stack_priority: 10 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { win_err: $.data.error_id }
          assert:
            - "the response status is 400 and ${win_err} == \"ERR_INVALID_REQUEST\""
            - "${win_err} != \"ERR_PROMO_WINDOW_CONFLICT\""
            - "GET /banners/${cb_id}/promo-events returns meta total_count == 0"

      - name: fraud_signal_creation_rejects_a_negative_severity_weight
        claim_type: Type Constraints
        grounds:
          - entities.FraudSignal.fields.severity_weight
          - validations[priority=25]
        distinguishing_aspect: "severity_weight is constrained to integers at or above zero, so -10 is a 400 at the shape gate and cannot be used to drive a household's fraud_score downwards."
        test_recipe:
          setup:
            - "Banner CORE with household HH-CORE-1; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_household
          trigger:
            - call: "POST /fraud-signals"
              payload: { household_id: "${chh_id}", signal_type: "ALT_ID_SHARING", severity_weight: -10 }
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
              captures: { sev_err: $.data.error_id }
          assert:
            - "the response status is 400 and ${sev_err} == \"ERR_INVALID_REQUEST\""
            - "GET /households/${chh_id}/fraud-signals returns meta total_count == 0"
            - "Household.${chh_id}.fraud_score == 0 and status == \"ACTIVE\""

      - name: cross_aggregate_link_associates_a_member_with_another_banners_household
        claim_type: Parent Relationships
        grounds:
          - entities.HouseholdLink
          - complexity_profile.relationship_patterns
          - entities.Household.fields.cross_banner_member_ids
        distinguishing_aspect: "The flat topology permits a HouseholdLink whose household and member sit under different banners, and activation is what publishes the member into the household's cross_banner_member_ids while leaving the member's own banner_id unchanged."
        test_recipe:
          setup:
            - "Banner CORE with member CM; a second banner ALT2 with household HH-ALT2; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_member
            - call: "POST /banners"
              payload: { banner_code: "ALT2", name: "Alternate Banner Two" }
              as: ProgramAdmin
              captures: { cb_alt_id: $.data.id }
            - call: "POST /households"
              payload: { banner_id: "${cb_alt_id}", household_code: "HH-ALT2-1" }
              as: LoyaltyAnalyst
              captures: { chh_alt_id: $.data.id }
            - call: "POST /household-links"
              payload: { household_id: "${chh_alt_id}", member_id: "${cm_id}", link_role: "SECONDARY" }
              as: LoyaltyAnalyst
              captures: { cl_alt_id: $.data.id }
          trigger:
            - call: "POST /household-links/${cl_alt_id}/activate"
              payload: {}
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
          assert:
            - "the response status is 200 and HouseholdLink.${cl_alt_id}.status == \"ACTIVE\""
            - "Household.${chh_alt_id}.linked_member_count == 1"
            - "Household.${chh_alt_id}.cross_banner_member_ids == [\"${cm_id}\"]"
            - "Member.${cm_id}.banner_id == \"${cb_id}\" (the member is not re-parented)"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: promo_event_is_born_scheduled_and_activation_moves_it_to_active
        claim_type: Initial State
        grounds:
          - state_machines.PromoEvent
          - endpoints.POST_/promo-events/{id}/activate
        distinguishing_aspect: "A promo is created SCHEDULED even when its window already contains the logical clock, and only POST /promo-events/{id}/activate moves it to ACTIVE — an unactivated promo never enters the multiplier stack, so an identical basket earns the base 300 points before activation."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site, member and a 2x GROCERY promo covering all of August; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_member
            - call: "POST /promo-events"
              payload: { banner_id: "${cb_id}", promo_code: "P_SCHED", multiplier: 2, applies_to_categories: ["GROCERY"], starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-09-01T00:00:00Z", stack_priority: 10 }
              as: ProgramAdmin
              captures: { csched_id: $.data.id }
            - *cx_basket
            - *cx_post
          trigger:
            - call: "POST /promo-events/${csched_id}/activate"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { promo_status: $.data.status }
          assert:
            - "PromoEvent.${csched_id}.status was \"SCHEDULED\" immediately after creation"
            - "PurchaseTransaction.${cbasket_id}.gross_points_awarded == 300 and applied_promo_event_ids == [] (posted while the promo was only SCHEDULED)"
            - "${promo_status} == \"ACTIVE\" and the activate call returned HTTP 200"
            - "Member.${cm_id}.available_points == 300"

      - name: fraud_signal_clear_is_not_idempotent_and_the_second_attempt_is_refused
        claim_type: Idempotency
        grounds:
          - state_machines.FraudSignal.OPEN_to_CLEARED
          - validations[priority=46]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "Clearing an OPEN signal succeeds once and drops the household's fraud_score to 0; replaying the same clear against the now-CLEARED signal is refused with 409 ERR_INVALID_STATE_TRANSITION rather than answering 200 a second time, and the score is not recomputed twice."
        test_recipe:
          setup:
            - "Banner CORE with household HH-CORE-1 carrying one OPEN signal of weight 30; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_household
            - call: "POST /fraud-signals"
              payload: { household_id: "${chh_id}", signal_type: "CROSS_BANNER_VELOCITY", severity_weight: 30 }
              as: LoyaltyAnalyst
              captures: { csig_id: $.data.id }
          trigger:
            - call: "POST /fraud-signals/${csig_id}/clear"
              payload: {}
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
              captures: { clear_status: $.data.status }
            - call: "POST /fraud-signals/${csig_id}/clear"
              payload: {}
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
              captures: { replay_err: $.data.error_id }
          assert:
            - "the first clear returned HTTP 200 with ${clear_status} == \"CLEARED\""
            - "the second clear returned HTTP 409 with ${replay_err} == \"ERR_INVALID_STATE_TRANSITION\""
            - "Household.${chh_id}.fraud_score == 0 and status == \"ACTIVE\""
            - "GET /households/${chh_id}/fraud-signals?status=OPEN returns meta total_count == 0"

      - name: cycle_begin_close_before_the_window_ends_is_refused_as_not_ended
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.PointCycle.OPEN_to_CLOSING
          - validations[priority=48]
          - errors[ERR_CYCLE_NOT_ENDED]
        distinguishing_aspect: "begin-close demands a logical clock strictly after closes_at: at 2026-08-01T00:00:00Z the August cycle answers 409 ERR_CYCLE_NOT_ENDED and stays OPEN, and the same call at 2026-09-01T00:00:00Z succeeds — the precondition is on the clock, not on cycle contents."
        test_recipe:
          setup:
            - "Banner CORE with cycles 2026-08 and 2026-09; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
          trigger:
            - call: "POST /point-cycles/${c_aug}/begin-close"
              payload: {}
              as: LoyaltySupervisor
              as_user_id: "sup-1"
              captures: { early_err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /point-cycles/${c_aug}/begin-close"
              payload: {}
              as: LoyaltySupervisor
              as_user_id: "sup-1"
              captures: { late_status: $.data.status }
          assert:
            - "the early attempt returned HTTP 409 with ${early_err} == \"ERR_CYCLE_NOT_ENDED\""
            - "PointCycle.${c_aug}.status was still \"OPEN\" after the early attempt"
            - "the attempt after the clock moved returned HTTP 200 with ${late_status} == \"CLOSING\""
            - "PointCycle.${c_aug}.closed_at is still null while CLOSING"

      - name: cycle_close_from_open_skips_the_closing_step_and_is_refused
        claim_type: Invalid Transitions
        grounds:
          - state_machines.PointCycle.CLOSING_to_CLOSED
          - validations[priority=46]
        distinguishing_aspect: "CLOSED is reachable only from CLOSING: closing a cycle that is still OPEN answers 409 ERR_INVALID_STATE_TRANSITION and writes no sweep, so the two-step close cannot be collapsed into one call."
        test_recipe:
          setup:
            - "Banner CORE with cycles 2026-08 and 2026-09, both OPEN; logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /point-cycles/${c_aug}/close"
              payload: {}
              as: LoyaltySupervisor
              as_user_id: "sup-1"
              captures: { skip_err: $.data.error_id }
          assert:
            - "the response status is 409 and ${skip_err} == \"ERR_INVALID_STATE_TRANSITION\""
            - "PointCycle.${c_aug}.status == \"OPEN\" and closed_at == null"
            - "PointCycle.${c_aug}.expired_points_total == 0 and swept_member_count == 0"

      - name: purchase_void_before_posting_reverses_nothing_and_writes_no_ledger_row
        claim_type: Valid Transition
        grounds:
          - state_machines.PurchaseTransaction.RECORDED_NOT_ACCRUED_to_VOIDED_NOT_ACCRUED
          - entities.PurchaseTransaction.fields.accrual_status
        distinguishing_aspect: "Voiding a RECORDED basket moves posting_status to VOIDED while accrual_status stays NOT_ACCRUED — there was never an ACCRUAL row, so no REVERSAL row is written and the member's balance stays at 0, unlike the POSTED-branch void."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site, member and one RECORDED 30000-cent basket; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_member
            - *cx_basket
          trigger:
            - call: "POST /purchase-transactions/${cbasket_id}/void"
              payload: {}
              as: StoreOperator
              as_user_id: "${cg_id}"
              captures: { void_posting: $.data.posting_status, void_accrual: $.data.accrual_status }
          assert:
            - "the response status is 200, ${void_posting} == \"VOIDED\" and ${void_accrual} == \"NOT_ACCRUED\""
            - "GET /point-ledger-entries?member_id=${cm_id} returns meta total_count == 0"
            - "Member.${cm_id}.available_points == 0 and lifetime_points == 0"

      - name: completing_a_voided_redemption_is_refused_from_a_terminal_authorization
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.FuelRedemption
          - validations[priority=46]
        distinguishing_aspect: "VOIDED is terminal on the authorization axis: after a void, POST /fuel-redemptions/{id}/complete answers 409 ERR_INVALID_STATE_TRANSITION, the settlement axis stays NOT_APPLICABLE and the released points remain in the member's balance."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site, owned fuel centre, a member holding 300 points and one AUTHORIZED redemption of 300 points that has been voided; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_fuel
            - *cx_member
            - *cx_basket
            - *cx_post
            - &cx_member_version
              call: "GET /members/${cm_id}"
              payload: {}
              as: PumpTerminal
              as_user_id: "${cf_id}"
              captures: { cmv: $.data.version }
            - &cx_redeem
              call: "POST /fuel-redemptions"
              payload: { member_id: "${cm_id}", site_id: "${cf_id}", alt_id_presented: "6660000001", points_committed: 300, expected_member_version: "${cmv}" }
              as: PumpTerminal
              as_user_id: "${cf_id}"
              captures: { cr_id: $.data.id }
            - call: "POST /fuel-redemptions/${cr_id}/void"
              payload: {}
              as: PumpTerminal
