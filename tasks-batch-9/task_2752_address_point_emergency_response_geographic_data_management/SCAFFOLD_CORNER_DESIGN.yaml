        distinguishing_aspect: "A report can be CERTIFIED (zero OPEN BLOCKING defects) and still be unsealable: five postal points that mismatch the postal city and sit below the confidence cutoff produce ten WARNING/INFO defects, quality 87.63 < 90.00, so the seal is 422 ERR_QC_SCORE_BELOW_THRESHOLD even though the record set is non-empty."
