              as: LegalAdvocate
              as_user_id: "${legal_id}"
            - call: "POST /protective-order-cases/${poc_id}/record-outcome"
              payload: { outcome: "DENIED" }
              as: LegalAdvocate
              as_user_id: "${legal_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T12:00:00Z" }
              as: AgencyAdmin
            - call: "POST /protective-order-cases/${poc_id}/file"
              payload: { filed_court: "County Family Court", hearing_start_utc: "2026-08-21T09:00:00Z", hearing_end_utc: "2026-08-21T10:00:00Z", accompanying_advocate_id: "${legal_id}" }
              as: LegalAdvocate
              as_user_id: "${legal_id}"
            - call: "POST /protective-order-cases/${poc_id}/record-outcome"
              payload: { outcome: "DENIED" }
              as: LegalAdvocate
              as_user_id: "${legal_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T12:00:00Z" }
              as: AgencyAdmin
            - call: "POST /protective-order-cases/${poc_id}/file"
              payload: { filed_court: "County Family Court", hearing_start_utc: "2026-08-22T09:00:00Z", hearing_end_utc: "2026-08-22T10:00:00Z", accompanying_advocate_id: "${legal_id}" }
              as: LegalAdvocate
              as_user_id: "${legal_id}"
              captures: { poc_status_before: "$.data.status", refile_before: "$.data.refile_count" }
          trigger:
            - call: "POST /protective-order-cases/${poc_id}/record-outcome"
              payload: { outcome: "DENIED" }
              as: LegalAdvocate
