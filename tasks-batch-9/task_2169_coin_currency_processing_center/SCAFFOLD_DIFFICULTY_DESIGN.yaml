              payload: { category: "COUNTERFEIT_SUSPECT" }
              as: ComplianceOfficer
              as_user_id: "u-cmp-1"
              captures: { suspect_lot_id: "$.data[0].id" }
            - call: "POST /cash-vault/counterfeit-reports"
              payload: { fitness_lot_id: "${suspect_lot_id}", serial_number: "FB12345678A", denomination_cents: 10000, note_count: 2 }
              as: ComplianceOfficer
              as_user_id: "u-cmp-1"
              captures: { report_id: $.data.id }
          trigger:
            - call: "POST /cash-vault/counterfeit-reports/${report_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-cmp-1"
          assert:
            - "CounterfeitReport.${report_id}.status == SUBMITTED"
            - "FitnessLot.${suspect_lot_id}.status == SEIZED"
            - "CountSession.${sess_id}.seized_face_value_cents == 20000"
            - "SealedBag.${bag_id}.seized_amount_cents == 20000"
            - "SealedBag.${bag_id}.settlement_amount_cents == 80000"
            - "SealedBag.${bag_id}.counted_amount_cents == 100000"
            - "DepositTicket.${ticket_id}.counted_total_cents == 80000"
            - "CustomerAccount.${acct_id}.counterfeit_incident_count == 1"
            - "CustomerAccount.${acct_id}.risk_score == 92.00"
            - "CustomerAccount.${acct_id}.risk_grade == A"

      - name: count_completion_cascades_session_to_bag_to_ticket_auto_advance
        grounds:
          - state_machines.CountSession.IN_PROGRESS_to_COMPLETED
          - state_machines.SealedBag.COUNTING_to_COUNTED
          - state_machines.DepositTicket.PROVISIONAL_CREDITED_to_SETTLEMENT_READY
          - entities.DepositTicket.fields.material_variance_open_count
        distinguishing_aspect: |
          Depth-3 cascade originating from a different trigger, POST /count-sessions/{id}/complete:
          completing the session drives the bag to COUNTED with its variance and fee written;
          because the bag became COUNTED the ticket's counted_total_cents, processing_fee_total_cents
          and material_variance_open_count are recomputed; because no bag remains outside
          {COUNTED, ADJUSTED} the ticket itself auto-advances PROVISIONAL_CREDITED -> SETTLEMENT_READY.
        test_recipe:
          setup:
            - "Vault CV-08 OPEN; CustomerAccount ACC-8001 tier PREMIUM; machine SORT-H CURRENCY_SORTER."
            - "Ticket MAN-801 with 1 bag S-8001 declared 102500, VAULT_RECEIVED, ticket VERIFIED then PROVISIONAL_CREDITED at 102500 (PREMIUM haircut 0)."
            - "Session for S-8001 is IN_PROGRESS with the bag OPENED and count_status COUNTING."
          setup_api_calls:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-08", name: "Cascade Advance Vault" }
              as: VaultManager
              as_user_id: "u-mgr-1"
