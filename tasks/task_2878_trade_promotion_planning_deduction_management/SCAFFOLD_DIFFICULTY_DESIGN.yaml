            - call: "POST /trade-marketing/budget-allocations"
              payload: { program_id: "${prog_id}", customer_id: "${cust_a_id}", brand_id: "${brand_id}", event_type: "SEASONAL", planned_amount: 100000.00, baseline_units: 40000, planned_incremental_units: 20000 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_a_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations/${alloc_a_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_a_v: $.data.version }
            - call: "POST /trade-marketing/budget-allocations"
              payload: { program_id: "${prog_id}", customer_id: "${cust_b_id}", brand_id: "${brand_id}", event_type: "SEASONAL", planned_amount: 100000.00, baseline_units: 40000, planned_incremental_units: 20000 }
              as: TradeMarketingDirector
