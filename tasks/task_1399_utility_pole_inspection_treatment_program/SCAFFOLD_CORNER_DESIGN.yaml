scaffold_corner_design:
  # ============================================================= entities
  - section: entities
    instances:
      - name: pole_creation_applies_defaults
        claim_type: creation_defaults
        grounds: [entities.Pole.fields.status, entities.Pole.fields.joint_use, entities.Pole.fields.attachment_count_declared, entities.Pole.fields.current_classification]
        distinguishing_aspect: "Creating a pole without optional fields yields status IN_SERVICE, joint_use false, attachment_count_declared 0, current_classification NONE, version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-DEF", species: LARCH, original_class: "2", install_date: "2001-05-01", gis_lat: 46.0, gis_lon: -121.0, gis_tag: "RURAL", height_ft: 35 }
              as: ProgramManager
              captures: { p_id: $.data.id, st: $.data.status, ju: $.data.joint_use, ac: $.data.attachment_count_declared, cc: $.data.current_classification, v: $.data.version }
          trigger: []
          assert:
            - "status == IN_SERVICE, joint_use == false, attachment_count_declared == 0"
            - "current_classification == NONE, current_remaining_strength_pct == null, open_treatment_count == 0"
            - "version == 1 and created_at == 2026-08-01T00:00:00Z (logical clock default)"

      - name: pole_create_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.Pole.fields.pole_number, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required pole_number is a 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /pole-program/poles"
              payload: { species: LARCH, original_class: "2", install_date: "2001-05-01", gis_lat: 46.0, gis_lon: -121.0, gis_tag: "RURAL", height_ft: 35 }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "response == 400 ERR_INVALID_REQUEST; no pole persisted"

      - name: pole_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Pole.fields.species, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "species OAK is outside the declared enum and rejected 400."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-IE", species: OAK, original_class: "2", install_date: "2001-05-01", gis_lat: 46.0, gis_lon: -121.0, gis_tag: "RURAL", height_ft: 35 }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "response == 400 ERR_INVALID_REQUEST"

      - name: pole_duplicate_number_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=8]", "errors[ERR_DUPLICATE_POLE_NUMBER]"]
        distinguishing_aspect: "Second pole with the same pole_number fails 409 ERR_DUPLICATE_POLE_NUMBER."
        test_recipe:
          setup: ["Pole P-DUP already registered"]
          setup_api_calls:
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-DUP", species: LARCH, original_class: "2", install_date: "2001-05-01", gis_lat: 46.0, gis_lon: -121.0, gis_tag: "RURAL", height_ft: 35 }
              as: ProgramManager
          trigger:
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-DUP", species: DOUGLAS_FIR, original_class: "1", install_date: "1999-01-01", gis_lat: 46.1, gis_lon: -121.1, gis_tag: "URBAN", height_ft: 45 }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "response == 409 ERR_DUPLICATE_POLE_NUMBER"

      - name: pole_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Pole.fields.status]
        distinguishing_aspect: "Client-supplied status/REPLACED in the create payload is ignored or rejected; the stored pole starts IN_SERVICE with server-stamped timestamps."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-SYS", species: LARCH, original_class: "2", install_date: "2001-05-01", gis_lat: 46.0, gis_lon: -121.0, gis_tag: "RURAL", height_ft: 35, status: "REPLACED" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "server rejects the unknown input field with 400 ERR_INVALID_REQUEST (system fields are not client-settable)"

      - name: crew_read_shows_default_scores
        claim_type: computed_fields
        grounds: [entities.ContractorCrew.fields.quality_score_lifetime, entities.ContractorCrew.fields.quality_score_rolling]
        distinguishing_aspect: "A crew with zero QA events reads back quality_score_lifetime == 100.00 and quality_score_rolling == 100.00 (empty-event default), counts 0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /pole-program/contractor-crews"
              payload: { crew_code: "CR-DEF", region: "SE" }
              as: ProgramManager
              captures: { cr_id: $.data.id }
          trigger:
            - call: "GET /pole-program/contractor-crews/${cr_id}"
              payload: {}
              as: ProgramManager
              captures: { lq: $.data.quality_score_lifetime, rq: $.data.quality_score_rolling, pc: $.data.qa_pass_count }
          assert:
            - "quality_score_lifetime == 100.00 and quality_score_rolling == 100.00"
            - "qa_pass_count == 0, qa_fail_count == 0, status == ACTIVE, current_cycle_billing_cents == 0"

      - name: snapshot_is_immutable_without_version
        claim_type: immutability
        grounds: [entities.BacklogSnapshot]
        distinguishing_aspect: "BacklogSnapshot declares common_fields false: the read payload carries id and created_at but no version/updated_at, and no update endpoint exists in §1.5."
        test_recipe:
          setup: ["budget, OPEN cycle with zero tasks, reconciled once so one snapshot exists"]
          setup_api_calls:
            - call: "POST /pole-program/budgets"
              payload: { fiscal_year: 2026, total_cents: 1000 }
              as: ProgramManager
              captures: { b_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles"
              payload: { year: 2026, cycle_length_years: 10, sample_pct: 0, strength_variant_policy: CONSERVATIVE }
              as: ProgramManager
              captures: { c_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles/${c_id}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /pole-program/inspection-cycles/${c_id}/reconcile"
              payload: { budget_id: "${b_id}" }
              as: ProgramManager
          trigger:
            - call: "GET /pole-program/backlog-snapshots"
              payload: { cycle_id: "${c_id}" }
              as: ProgramManager
              captures: { snap_id: "$.data[0].id", seq: "$.data[0].snapshot_seq" }
          assert:
            - "snapshot has snapshot_seq == 1, queued_count == 0, funded_count == 0"
            - "snapshot payload contains no version or updated_at key (append-only, common_fields false)"

      - name: fk_reverse_reachability_claims_under_order
        claim_type: parent_relationships
        grounds: [entities.WarrantyClaim.fields.treatment_order_id]
        distinguishing_aspect: "GET /treatment-work-orders/{id}/warranty-claims returns the child array (length 0 before any claim, 1 after filing) — the only discovery channel for cascade-free claim children."
        test_recipe:
          setup: ["pole, crew, VERIFIED PENTA_GEL order"]
          setup_api_calls:
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-FK", species: SOUTHERN_PINE, original_class: "3", install_date: "1990-01-01", gis_lat: 45.0, gis_lon: -122.0, gis_tag: "URBAN", height_ft: 40 }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /pole-program/contractor-crews"
              payload: { crew_code: "CR-FK", region: "NW" }
              as: ProgramManager
              captures: { cr_id: $.data.id }
            - call: "POST /pole-program/treatment-work-orders"
              payload: { pole_id: "${p_id}", product_code: PENTA_GEL, cost_cents: 21000 }
              as: ProgramManager
              captures: { o_id: $.data.id }
            - call: "POST /pole-program/treatment-work-orders/${o_id}/schedule"
              payload: { crew_id: "${cr_id}", work_start_date: "2026-08-10", work_end_date: "2026-08-12" }
              as: ProgramManager
            - call: "POST /pole-program/treatment-work-orders/${o_id}/apply"
              payload: {}
              as: Contractor
              as_user_id: "${cr_id}"
            - call: "POST /pole-program/treatment-work-orders/${o_id}/qa-review"
              payload: { decision: PASS }
              as: QAReviewer
              as_user_id: "qa-1"
          trigger:
            - call: "GET /pole-program/treatment-work-orders/${o_id}/warranty-claims"
              payload: {}
              as: ProgramManager
              captures: { n0: $.data }
            - call: "POST /pole-program/warranty-claims"
              payload: { treatment_order_id: "${o_id}", claim_reason: PRODUCT_FAILURE }
              as: ProgramManager
            - call: "GET /pole-program/treatment-work-orders/${o_id}/warranty-claims"
              payload: {}
              as: ProgramManager
              captures: { c1: "$.data[0].status" }
          assert:
            - "before filing: array length 0; after filing: array length 1 with status FILED"

      - name: task_create_bogus_pole_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_POLE_NOT_FOUND]", entities.InspectionTask.fields.pole_id]
        distinguishing_aspect: "Body FK existence: task creation with a non-resolving pole_id fails 404 ERR_POLE_NOT_FOUND."
        test_recipe:
          setup: ["OPEN cycle"]
          setup_api_calls:
            - call: "POST /pole-program/inspection-cycles"
              payload: { year: 2026, cycle_length_years: 10, sample_pct: 0, strength_variant_policy: CONSERVATIVE }
              as: ProgramManager
              captures: { c_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles/${c_id}/open"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "POST /pole-program/inspection-tasks"
              payload: { cycle_id: "${c_id}", pole_id: "00000000-0000-0000-0000-000000000000", due_window_start: "2026-08-10T00:00:00Z", due_window_end: "2026-08-20T00:00:00Z" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "response == 404 ERR_POLE_NOT_FOUND"

  # ============================================================= state_machines
  - section: state_machines
    instances:
      - name: reconcile_with_open_tasks_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.InspectionCycle.OPEN_to_RECONCILED, "errors[ERR_CYCLE_TASKS_OPEN]"]
        distinguishing_aspect: "Reconcile with tasks_terminal (0) < tasks_total (1) fails 409 ERR_CYCLE_TASKS_OPEN and leaves the cycle OPEN."
        test_recipe:
          setup: ["budget; cycle OPEN pct 0; one manual OPEN task"]
          setup_api_calls:
            - call: "POST /pole-program/budgets"
              payload: { fiscal_year: 2026, total_cents: 1000 }
              as: ProgramManager
              captures: { b_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles"
              payload: { year: 2026, cycle_length_years: 10, sample_pct: 0, strength_variant_policy: CONSERVATIVE }
              as: ProgramManager
              captures: { c_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles/${c_id}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-RO", species: LARCH, original_class: "2", install_date: "2001-05-01", gis_lat: 46.0, gis_lon: -121.0, gis_tag: "RURAL", height_ft: 35 }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /pole-program/inspection-tasks"
              payload: { cycle_id: "${c_id}", pole_id: "${p_id}", due_window_start: "2026-08-10T00:00:00Z", due_window_end: "2026-08-20T00:00:00Z" }
              as: ProgramManager
          trigger:
            - call: "POST /pole-program/inspection-cycles/${c_id}/reconcile"
              payload: { budget_id: "${b_id}" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "response == 409 ERR_CYCLE_TASKS_OPEN"
            - "cycle.status stays OPEN; no BacklogSnapshot created for the cycle"

      - name: qa_review_on_open_task_rejected
        claim_type: invalid_transition
        grounds: [state_machines.InspectionTask, "errors[ERR_TASK_NOT_SUBMITTED]"]
        distinguishing_aspect: "qa-review requires SUBMITTED; on an OPEN task it fails 409 ERR_TASK_NOT_SUBMITTED."
        test_recipe:
          setup: ["cycle OPEN pct 0; pole; manual task (OPEN)"]
          setup_api_calls:
            - call: "POST /pole-program/inspection-cycles"
              payload: { year: 2026, cycle_length_years: 10, sample_pct: 0, strength_variant_policy: CONSERVATIVE }
              as: ProgramManager
              captures: { c_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles/${c_id}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-QO", species: LARCH, original_class: "2", install_date: "2001-05-01", gis_lat: 46.0, gis_lon: -121.0, gis_tag: "RURAL", height_ft: 35 }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /pole-program/inspection-tasks"
              payload: { cycle_id: "${c_id}", pole_id: "${p_id}", due_window_start: "2026-08-10T00:00:00Z", due_window_end: "2026-08-20T00:00:00Z" }
              as: ProgramManager
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /pole-program/inspection-tasks/${t_id}/qa-review"
              payload: { decision: ACCEPT }
              as: QAReviewer
              as_user_id: "qa-1"
              captures: { err: $.data.error_id }
          assert:
            - "response == 409 ERR_TASK_NOT_SUBMITTED; task stays OPEN"

      - name: submit_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.InspectionTask.OPEN_to_SUBMITTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second submit on an already-SUBMITTED task fails 409 ERR_INVALID_STATE (idempotency-by-state)."
        test_recipe:
          setup: ["cycle OPEN; task already SUBMITTED once"]
          setup_api_calls:
            - call: "POST /pole-program/inspection-cycles"
              payload: { year: 2026, cycle_length_years: 10, sample_pct: 0, strength_variant_policy: CONSERVATIVE }
              as: ProgramManager
              captures: { c_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles/${c_id}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-2S", species: LARCH, original_class: "2", install_date: "2001-05-01", gis_lat: 46.0, gis_lon: -121.0, gis_tag: "RURAL", height_ft: 35 }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /pole-program/inspection-tasks"
              payload: { cycle_id: "${c_id}", pole_id: "${p_id}", due_window_start: "2026-08-10T00:00:00Z", due_window_end: "2026-08-20T00:00:00Z" }
              as: ProgramManager
              captures: { t_id: $.data.id }
            - call: "POST /pole-program/inspection-tasks/${t_id}/submit"
              payload:
                shell_thickness_in: 2.00
                sound_wood_pct: 90
                decay_pocket_depth_in: 0.0
                moisture_pct: 20
                photos: [ { photo_type: GROUNDLINE, url: "https://ev/g.jpg", taken_at: "2026-08-11T00:00:00Z" }, { photo_type: TAG, url: "https://ev/t.jpg", taken_at: "2026-08-11T00:00:00Z" } ]
              as: Inspector
              as_user_id: "insp-1"
          trigger:
            - call: "POST /pole-program/inspection-tasks/${t_id}/submit"
              payload:
                shell_thickness_in: 2.00
                sound_wood_pct: 90
                decay_pocket_depth_in: 0.0
                moisture_pct: 20
                photos: [ { photo_type: GROUNDLINE, url: "https://ev/g.jpg", taken_at: "2026-08-11T00:00:00Z" }, { photo_type: TAG, url: "https://ev/t.jpg", taken_at: "2026-08-11T00:00:00Z" } ]
              as: Inspector
              as_user_id: "insp-1"
              captures: { err: $.data.error_id }
          assert:
            - "response == 409 ERR_INVALID_STATE; the first submission's readings are unchanged"

      - name: rework_limit_escalates_to_terminal
        claim_type: valid_transition
        grounds: [state_machines.InspectionTask.SUBMITTED_to_ESCALATED]
        distinguishing_aspect: "Third REJECT decision (rework_count == 2 at decision time) routes to ESCALATED instead of the rework loop; a fourth qa-review then fails because ESCALATED is terminal."
        test_recipe:
          setup: ["cycle OPEN; task that has already been rejected twice (rework_count == 2), submitted a third time"]
          setup_api_calls:
            - call: "POST /pole-program/inspection-cycles"
              payload: { year: 2026, cycle_length_years: 10, sample_pct: 0, strength_variant_policy: CONSERVATIVE }
              as: ProgramManager
              captures: { c_id: $.data.id }
            - call: "POST /pole-program/inspection-cycles/${c_id}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-ESC", species: LARCH, original_class: "2", install_date: "2001-05-01", gis_lat: 46.0, gis_lon: -121.0, gis_tag: "RURAL", height_ft: 35 }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /pole-program/inspection-tasks"
              payload: { cycle_id: "${c_id}", pole_id: "${p_id}", due_window_start: "2026-08-10T00:00:00Z", due_window_end: "2026-08-20T00:00:00Z" }
              as: ProgramManager
              captures: { t_id: $.data.id }
            - call: "POST /pole-program/inspection-tasks/${t_id}/submit"
              payload:
                shell_thickness_in: 2.00
                sound_wood_pct: 90
                decay_pocket_depth_in: 0.0
                moisture_pct: 20
                photos: [ { photo_type: GROUNDLINE, url: "https://ev/g.jpg", taken_at: "2026-08-11T00:00:00Z" }, { photo_type: TAG, url: "https://ev/t.jpg", taken_at: "2026-08-11T00:00:00Z" } ]
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /pole-program/inspection-tasks/${t_id}/qa-review"
              payload: { decision: REJECT }
              as: QAReviewer
              as_user_id: "qa-1"
            - call: "POST /pole-program/inspection-tasks/${t_id}/submit"
              payload:
                shell_thickness_in: 2.00
                sound_wood_pct: 90
                decay_pocket_depth_in: 0.0
                moisture_pct: 20
                photos: [ { photo_type: GROUNDLINE, url: "https://ev/g.jpg", taken_at: "2026-08-11T00:00:00Z" }, { photo_type: TAG, url: "https://ev/t.jpg", taken_at: "2026-08-11T00:00:00Z" } ]
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /pole-program/inspection-tasks/${t_id}/qa-review"
              payload: { decision: REJECT }
              as: QAReviewer
              as_user_id: "qa-1"
            - call: "POST /pole-program/inspection-tasks/${t_id}/submit"
              payload:
                shell_thickness_in: 2.00
                sound_wood_pct: 90
                decay_pocket_depth_in: 0.0
                moisture_pct: 20
                photos: [ { photo_type: GROUNDLINE, url: "https://ev/g.jpg", taken_at: "2026-08-11T00:00:00Z" }, { photo_type: TAG, url: "https://ev/t.jpg", taken_at: "2026-08-11T00:00:00Z" } ]
              as: Inspector
              as_user_id: "insp-1"
          trigger:
            - call: "POST /pole-program/inspection-tasks/${t_id}/qa-review"
              payload: { decision: REJECT }
              as: QAReviewer
              as_user_id: "qa-1"
              captures: { st: $.data.status, rc: $.data.rework_count }
            - call: "POST /pole-program/inspection-tasks/${t_id}/qa-review"
              payload: { decision: ACCEPT }
              as: QAReviewer
              as_user_id: "qa-1"
              captures: { err: $.data.error_id }
          assert:
            - "third REJECT: status == ESCALATED (not REJECTED), rework_count == 3"
            - "fourth qa-review on the terminal task == 409 ERR_TASK_NOT_SUBMITTED"

      - name: defer_on_funded_order_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ReplacementWorkOrder.QUEUED_to_DEFERRED, "errors[ERR_ORDER_NOT_QUEUED]"]
        distinguishing_aspect: "defer requires QUEUED; on a FUNDED order it fails 409 ERR_ORDER_NOT_QUEUED and deferral_count stays 0."
        test_recipe:
          setup: ["budget 500000; pole; order funded"]
          setup_api_calls:
            - call: "POST /pole-program/budgets"
              payload: { fiscal_year: 2026, total_cents: 500000 }
              as: ProgramManager
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-DFR", species: LARCH, original_class: "2", install_date: "2001-05-01", gis_lat: 46.0, gis_lon: -121.0, gis_tag: "RURAL", height_ft: 35 }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /pole-program/replacement-work-orders"
              payload: { pole_id: "${p_id}", estimated_cost_cents: 200000 }
              as: ProgramManager
              captures: { o_id: $.data.id }
            - call: "POST /pole-program/replacement-work-orders/${o_id}/fund"
              payload: { budget_id: "${b_id}", expected_budget_version: "${b_v}" }
              as: ProgramManager
          trigger:
            - call: "POST /pole-program/replacement-work-orders/${o_id}/defer"
              payload: {}
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "response == 409 ERR_ORDER_NOT_QUEUED"
            - "order stays FUNDED with deferral_count == 0"

      - name: complete_on_queued_order_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ReplacementWorkOrder.FUNDED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "complete requires FUNDED; on a QUEUED order it fails 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["crew; pole; QUEUED order (never funded)"]
          setup_api_calls:
            - call: "POST /pole-program/contractor-crews"
              payload: { crew_code: "CR-CQ", region: "NW" }
              as: ProgramManager
              captures: { cr_id: $.data.id }
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-CQ", species: LARCH, original_class: "2", install_date: "2001-05-01", gis_lat: 46.0, gis_lon: -121.0, gis_tag: "RURAL", height_ft: 35 }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /pole-program/replacement-work-orders"
              payload: { pole_id: "${p_id}", estimated_cost_cents: 200000 }
              as: ProgramManager
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /pole-program/replacement-work-orders/${o_id}/complete"
              payload: { actual_cost_cents: 200000 }
              as: Contractor
              as_user_id: "${cr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response == 409 ERR_INVALID_STATE; pole.status unchanged"

