              captures: { oo1_id: $.data.id }
          trigger:
            - call: "POST /prescribers/${p_id}/opt-outs"
              payload: {}
              as: PrivacyOfficer
              captures: { err: $.data.error_id }
            - call: "POST /prescriber-opt-outs/${oo1_id}/reject"
              payload: {}
              as: PrivacyOfficer
            - call: "POST /prescribers/${p_id}/opt-outs"
              payload: { reason: "second attempt" }
              as: PrivacyOfficer
              captures: { oo2_id: $.data.id, st2: $.data.status }
          assert:
            - "second create while first is SUBMITTED fails with ERR_DUPLICATE_OPT_OUT (HTTP 409)"
            - "after rejecting the first, a new opt-out is created with status SUBMITTED"

      - name: batch_create_on_draft_agreement_rejected
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority=8]
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
          - state_machines.DataFeedBatch
        distinguishing_aspect: "Submitting a batch under a DRAFT (never activated) agreement fails with ERR_AGREEMENT_NOT_ACTIVE; no batch row is persisted."
        test_recipe:
          setup:
