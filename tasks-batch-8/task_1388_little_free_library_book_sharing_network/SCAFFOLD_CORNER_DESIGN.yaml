          assert:
            - "Rejected with error_id == ERR_INVALID_REQUEST (captured ${err}), HTTP 400"

  # ===========================================================================
  # Section 5 — Endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: bulk_items_partial_success_semantics
        claim_type: bulk_action
        grounds: ["entities.BookItem", "validations[priority=11]"]
        distinguishing_aspect: "Bulk intake is best-effort per item: a valid item is created while its sibling missing the required title is rejected; the response carries created_count == 1 and rejected == [ { index: 1, error_id: ERR_INVALID_REQUEST } ]."
        test_recipe:
          setup: ["RECEIVED PUBLIC_DROP batch"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/batches", payload: { source_type: "PUBLIC_DROP", region_code: "OR" }, as: HubCoordinator, as_user_id: "hub-1", captures: { batch: "$.data.id" } }
          trigger:
            - { call: "POST /library-network/batches/${batch}/items", payload: { items: [ { title: "Good Book", category: "FICTION", condition_grade: "A" }, { category: "FICTION", condition_grade: "B" } ] }, as: HubCoordinator, as_user_id: "hub-1", captures: { created: "$.data.created_count" } }
          assert:
            - "created_count == 1 (captured ${created})"
            - "rejected == [ { index: 1, error_id: ERR_INVALID_REQUEST } ]"
            - "GET /library-network/book-items?batch_id=${batch} returns exactly 1 item (title Good Book, status AVAILABLE)"

      - name: response_envelope_shape_for_success_and_error
        claim_type: response_envelope
        grounds: ["response_envelope"]
        distinguishing_aspect: "Every response carries meta.api_request_id + meta.api_request_timestamp and response_type; errors carry data.error_id and data.message."
        test_recipe:
          setup: ["Empty database (clock pinned)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "GET /library-network/boxes", payload: {}, as: Anonymous }
            - { call: "GET /library-network/boxes/00000000-0000-4000-8000-0000000000dd", payload: {}, as: Anonymous, captures: { err: "$.data.error_id" } }
          assert:
            - "Success response: response_type == array, data == [], meta.api_request_id present"
            - "Error response: response_type == error, data.error_id == ERR_BOX_NOT_FOUND (captured ${err}), data.message present, HTTP 404"

      - name: computed_box_counters_track_children
        claim_type: computed_read
        grounds: ["entities.LibraryBox.fields.open_high_maintenance_count", "calculations.box_listing_posture"]
        distinguishing_aspect: "Derived counters reconcile with child state changes: triaging a HIGH request raises open_high_maintenance_count to 1 and flips posture to FLAGGED; resolving returns both to LISTED/0."
        test_recipe:
          setup: ["ACTIVE LISTED box"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Counter Owner", email: "count@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/stewards/${stw}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes", payload: { steward_id: "${stw}", name: "Counter Box", latitude: 45.52, longitude: -122.68, capacity_books: 10, region_code: "OR" }, as: Steward, as_user_id: "${stw}", captures: { box: "$.data.id" } }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "CHARTERED" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes/${box}/inspections", payload: { result: "CONFIRMED" }, as: Moderator, as_user_id: "mod-1" }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "ACTIVE" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/maintenance-requests", payload: { box_id: "${box}", category: "VANDALISM", description: "Door spray-painted" }, as: Anonymous, captures: { mr: "$.data.id" } }
          trigger:
            - { call: "POST /library-network/maintenance-requests/${mr}/triage", payload: { severity: "HIGH", scheduled_date: "2026-08-02" }, as: Moderator, as_user_id: "mod-1" }
            - { call: "GET /library-network/boxes/${box}", payload: {}, as: NetworkAdmin, as_user_id: "admin-1", captures: { hi: "$.data.open_high_maintenance_count", post1: "$.data.listing_posture" } }
            - { call: "POST /library-network/maintenance-requests/${mr}/resolve", payload: { outcome: "RESOLVED" }, as: Moderator, as_user_id: "mod-1" }
            - { call: "GET /library-network/boxes/${box}", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
          assert:
            - "After triage: open_high_maintenance_count == 1 (captured ${hi}) and listing_posture == FLAGGED (captured ${post1})"
            - "After resolve: open_high_maintenance_count == 0 and listing_posture == LISTED"
            - "The REPORTED (untriaged) request never counted: posture stayed LISTED between report and triage"

      - name: inspection_not_found_suspends_box_and_delists
        claim_type: conditional_action
        grounds: ["entities.InspectionRecord.fields.result", "state_machines.LibraryBox.ACTIVE_to_SUSPENDED"]
        distinguishing_aspect: "A NOT_FOUND inspection on an ACTIVE box cascades to charter SUSPENDED and posture DELISTED (map accuracy enforcement); on a CHARTERED box it only records."
        test_recipe:
          setup: ["Two boxes: box_active (ACTIVE) and box_chartered (CHARTERED, never inspected-after-charter), owned by two stewards"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Map Owner A", email: "mapa@example.org", region_code: "OR" }, as: Anonymous, captures: { stw_a: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw_a}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw_a}" }
            - { call: "POST /library-network/stewards/${stw_a}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/stewards", payload: { full_name: "Map Owner B", email: "mapb@example.org", region_code: "OR" }, as: Anonymous, captures: { stw_b: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw_b}/training-completions", payload: { module_id: "${mod_ori}", score: 88 }, as: Steward, as_user_id: "${stw_b}" }
            - { call: "POST /library-network/stewards/${stw_b}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes", payload: { steward_id: "${stw_a}", name: "Active Map Box", latitude: 45.52, longitude: -122.68, capacity_books: 10, region_code: "OR" }, as: Steward, as_user_id: "${stw_a}", captures: { box_active: "$.data.id" } }
            - { call: "POST /library-network/boxes/${box_active}/status", payload: { target_status: "CHARTERED" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes/${box_active}/inspections", payload: { result: "CONFIRMED" }, as: Moderator, as_user_id: "mod-1" }
            - { call: "POST /library-network/boxes/${box_active}/status", payload: { target_status: "ACTIVE" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes", payload: { steward_id: "${stw_b}", name: "Chartered Map Box", latitude: 45.53, longitude: -122.69, capacity_books: 8, region_code: "OR" }, as: Steward, as_user_id: "${stw_b}", captures: { box_chartered: "$.data.id" } }
            - { call: "POST /library-network/boxes/${box_chartered}/status", payload: { target_status: "CHARTERED" }, as: NetworkAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /library-network/boxes/${box_active}/inspections", payload: { result: "NOT_FOUND", notes: "No box at listed coordinates" }, as: Moderator, as_user_id: "mod-1" }
            - { call: "GET /library-network/boxes/${box_active}", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes/${box_chartered}/inspections", payload: { result: "NOT_FOUND", notes: "Site empty" }, as: Moderator, as_user_id: "mod-1" }
            - { call: "GET /library-network/boxes/${box_chartered}", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
          assert:
            - "box_active: charter_status == SUSPENDED, listing_posture == DELISTED, suspended_at == 2026-08-01T00:00:00Z"
            - "box_chartered: charter_status remains CHARTERED and listing_posture remains UNLISTED (NOT_FOUND records only when not ACTIVE)"

      - name: inspection_failed_condition_spawns_maintenance_request
        claim_type: side_effect_execution
        grounds: ["entities.InspectionRecord.fields.result", "entities.MaintenanceRequest"]
        distinguishing_aspect: "A FAILED_CONDITION inspection auto-creates a MaintenanceRequest with category WEAR, status REPORTED, severity null for the same box."
        test_recipe:
          setup: ["ACTIVE LISTED box"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Failed Cond", email: "fc@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/stewards/${stw}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes", payload: { steward_id: "${stw}", name: "FC Box", latitude: 45.52, longitude: -122.68, capacity_books: 10, region_code: "OR" }, as: Steward, as_user_id: "${stw}", captures: { box: "$.data.id" } }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "CHARTERED" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes/${box}/inspections", payload: { result: "CONFIRMED" }, as: Moderator, as_user_id: "mod-1" }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "ACTIVE" }, as: NetworkAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /library-network/boxes/${box}/inspections", payload: { result: "FAILED_CONDITION", notes: "Shelf rotting" }, as: Moderator, as_user_id: "mod-1" }
            - { call: "GET /library-network/maintenance-requests?box_id=${box}", payload: {}, as: Moderator, as_user_id: "mod-1" }
          assert:
            - "Exactly one MaintenanceRequest exists for the box with category == WEAR, status == REPORTED, severity == null (spawned by the inspection)"

  # ===========================================================================
  # Section 6 — Errors (triggerability sweep for codes not covered elsewhere)
  # ===========================================================================
  - section: errors
    instances:
      - name: not_found_sweep_returns_entity_specific_404s
        claim_type: violation_to_error
        grounds: ["errors[ERR_STEWARD_NOT_FOUND]", "errors[ERR_BOX_NOT_FOUND]", "errors[ERR_DRIVE_NOT_FOUND]", "errors[ERR_BATCH_NOT_FOUND]", "errors[ERR_RUN_NOT_FOUND]", "errors[ERR_ALLOCATION_NOT_FOUND]", "errors[ERR_MAINTENANCE_NOT_FOUND]", "errors[ERR_COMPLAINT_NOT_FOUND]", "errors[ERR_MODULE_NOT_FOUND]", "errors[ERR_SCHOOL_NOT_FOUND]"]
        distinguishing_aspect: "Every entity family returns its own 404 error id on a missing resource; verified with random UUIDs on each single-GET."
        test_recipe:
          setup: ["Empty database (clock pinned)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "GET /library-network/stewards/00000000-0000-4000-8000-000000000001", payload: {}, as: NetworkAdmin, as_user_id: "admin-1", captures: { e1: "$.data.error_id" } }
            - { call: "GET /library-network/boxes/00000000-0000-4000-8000-000000000002", payload: {}, as: Anonymous, captures: { e2: "$.data.error_id" } }
            - { call: "GET /library-network/drives/00000000-0000-4000-8000-000000000003", payload: {}, as: NetworkAdmin, as_user_id: "admin-1", captures: { e3: "$.data.error_id" } }
            - { call: "GET /library-network/batches/00000000-0000-4000-8000-000000000004", payload: {}, as: NetworkAdmin, as_user_id: "admin-1", captures: { e4: "$.data.error_id" } }
            - { call: "GET /library-network/distribution-runs/00000000-0000-4000-8000-000000000005", payload: {}, as: NetworkAdmin, as_user_id: "admin-1", captures: { e5: "$.data.error_id" } }
            - { call: "GET /library-network/allocations/00000000-0000-4000-8000-000000000006", payload: {}, as: NetworkAdmin, as_user_id: "admin-1", captures: { e6: "$.data.error_id" } }
            - { call: "GET /library-network/maintenance-requests/00000000-0000-4000-8000-000000000007", payload: {}, as: NetworkAdmin, as_user_id: "admin-1", captures: { e7: "$.data.error_id" } }
            - { call: "GET /library-network/complaints/00000000-0000-4000-8000-000000000008", payload: {}, as: NetworkAdmin, as_user_id: "admin-1", captures: { e8: "$.data.error_id" } }
            - { call: "GET /library-network/training-modules/00000000-0000-4000-8000-000000000009", payload: {}, as: NetworkAdmin, as_user_id: "admin-1", captures: { e9: "$.data.error_id" } }
            - { call: "GET /library-network/schools/00000000-0000-4000-8000-000000000010", payload: {}, as: NetworkAdmin, as_user_id: "admin-1", captures: { e10: "$.data.error_id" } }
          assert:
            - "e1 == ERR_STEWARD_NOT_FOUND, e2 == ERR_BOX_NOT_FOUND, e3 == ERR_DRIVE_NOT_FOUND, e4 == ERR_BATCH_NOT_FOUND, e5 == ERR_RUN_NOT_FOUND (all captured, all HTTP 404)"
            - "e6 == ERR_ALLOCATION_NOT_FOUND, e7 == ERR_MAINTENANCE_NOT_FOUND, e8 == ERR_COMPLAINT_NOT_FOUND, e9 == ERR_MODULE_NOT_FOUND, e10 == ERR_SCHOOL_NOT_FOUND (all HTTP 404)"

      - name: complaint_and_report_rejected_for_non_public_box
        claim_type: violation_to_error
        grounds: ["errors[ERR_BOX_NOT_PUBLIC]", "validations[priority=9]"]
        distinguishing_aspect: "Public interactions require a public box: a complaint against a DRAFT box and a maintenance report against a DRAFT box both fail with ERR_BOX_NOT_PUBLIC (422)."
        test_recipe:
          setup: ["ACTIVE steward with a DRAFT box (never chartered)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Draft Owner", email: "draft@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/stewards/${stw}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes", payload: { steward_id: "${stw}", name: "Draft Box", latitude: 45.52, longitude: -122.68, capacity_books: 10, region_code: "OR" }, as: Steward, as_user_id: "${stw}", captures: { box: "$.data.id" } }
          trigger:
            - { call: "POST /library-network/complaints", payload: { box_id: "${box}", category: "OTHER", description: "Not on map" }, as: Anonymous, captures: { err1: "$.data.error_id" } }
            - { call: "POST /library-network/maintenance-requests", payload: { box_id: "${box}", category: "WEAR", description: "Too early" }, as: Anonymous, captures: { err2: "$.data.error_id" } }
          assert:
            - "Complaint against DRAFT box -> ERR_BOX_NOT_PUBLIC (captured ${err1})"
            - "Maintenance report against DRAFT box -> ERR_BOX_NOT_PUBLIC (captured ${err2})"

      - name: drive_intake_rejected_when_drive_not_open
        claim_type: violation_to_error
        grounds: ["errors[ERR_DRIVE_NOT_OPEN]", "validations[priority=5]"]
        distinguishing_aspect: "Item intake into a drive-linked batch requires the drive in status OPEN: while the drive is APPROVED (not yet swept to OPEN) intake fails with ERR_DRIVE_NOT_OPEN (409)."
        test_recipe:
          setup: ["Drive fully approved (linked batch exists) with window starting 2026-09-01; no sweep has run, so status is APPROVED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Not Open", email: "no@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/stewards/${stw}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/schools", payload: { name: "NO School", district_code: "D-14", contact_email: "no@school.edu", region_code: "OR", restricted_categories: [] }, as: NetworkAdmin, as_user_id: "admin-1", captures: { sch: "$.data.id" } }
            - { call: "POST /library-network/schools/${sch}/status", payload: { target_status: "ACTIVE" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/drives", payload: { school_id: "${sch}", goal_books: 5, starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-10-01T00:00:00Z" }, as: Steward, as_user_id: "${stw}", captures: { drv: "$.data.id" } }
            - { call: "POST /library-network/drives/${drv}/school-decision", payload: { decision: "APPROVE" }, as: SchoolLiaison, as_user_id: "${sch}" }
            - { call: "POST /library-network/drives/${drv}/network-decision", payload: { decision: "APPROVE" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "GET /library-network/batches?drive_id=${drv}", payload: {}, as: HubCoordinator, as_user_id: "hub-1", captures: { d_batch: "$.data[0].id" } }
          trigger:
            - { call: "POST /library-network/batches/${d_batch}/items", payload: { items: [ { title: "Early", category: "FICTION", condition_grade: "A" } ] }, as: HubCoordinator, as_user_id: "hub-1", captures: { err: "$.data.error_id" } }
          assert:
            - "Rejected with error_id == ERR_DRIVE_NOT_OPEN (captured ${err}), HTTP 409 — drive APPROVED is not OPEN"

      - name: error_plan_stale_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_PLAN_STALE]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / run_confirm_rejected_when_planned_box_flagged"
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_prerequisite_not_met_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_PREREQUISITE_NOT_MET]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / completion_rejected_without_prerequisite_pass"
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_drive_window_overlap_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_DRIVE_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / drive_window_half_open_overlap_rules"
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_inspection_too_soon_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSPECTION_TOO_SOON]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / inspection_minimum_gap_buffer_30_days"
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_content_policy_and_window_closed_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_CONTENT_POLICY_VIOLATION]", "errors[ERR_DRIVE_WINDOW_CLOSED]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / drive_item_intake_rejected_safety_priority_over_temporal"
          rationale: "Both error ids are asserted per-item in the named §1.8 instance."


  # ===========================================================================
  # Section 7 — RBAC
  # ===========================================================================
  - section: rbac
    instances:
      - name: role_check_fires_before_existence
        claim_type: rbac_denial
        grounds: ["roles", "validations[priority=2]", "validations[priority=3]"]
        distinguishing_aspect: "Authorization precedes existence: a Moderator calling the NetworkAdmin-only network-decision on a random drive id gets ERR_UNAUTHORIZED_ROLE, not ERR_DRIVE_NOT_FOUND; a HubCoordinator triaging a random complaint id gets ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["Empty database (clock pinned)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /library-network/drives/00000000-0000-4000-8000-0000000000ee/network-decision", payload: { decision: "APPROVE" }, as: Moderator, as_user_id: "mod-1", captures: { err1: "$.data.error_id" } }
            - { call: "POST /library-network/complaints/00000000-0000-4000-8000-0000000000ff/triage", payload: {}, as: HubCoordinator, as_user_id: "hub-1", captures: { err2: "$.data.error_id" } }
          assert:
            - "network-decision as Moderator -> ERR_UNAUTHORIZED_ROLE (captured ${err1}), HTTP 403"
            - "complaint triage as HubCoordinator -> ERR_UNAUTHORIZED_ROLE (captured ${err2}), HTTP 403"

      - name: school_liaison_forbidden_for_other_schools_drive
        claim_type: rbac_denial
        grounds: ["roles", "errors[ERR_FORBIDDEN_OWNERSHIP]"]
        distinguishing_aspect: "SchoolLiaison identity is entity-backed by School: the liaison of school A deciding a drive belonging to school B is rejected with ERR_FORBIDDEN_OWNERSHIP."
        test_recipe:
          setup: ["ACTIVE steward; ACTIVE schools A and B; drive PROPOSED for school B"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Liaison Tester", email: "lia@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/stewards/${stw}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/schools", payload: { name: "School A", district_code: "D-A", contact_email: "a@school.edu", region_code: "OR", restricted_categories: [] }, as: NetworkAdmin, as_user_id: "admin-1", captures: { sch_a: "$.data.id" } }
            - { call: "POST /library-network/schools/${sch_a}/status", payload: { target_status: "ACTIVE" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/schools", payload: { name: "School B", district_code: "D-B", contact_email: "b@school.edu", region_code: "OR", restricted_categories: [] }, as: NetworkAdmin, as_user_id: "admin-1", captures: { sch_b: "$.data.id" } }
            - { call: "POST /library-network/schools/${sch_b}/status", payload: { target_status: "ACTIVE" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/drives", payload: { school_id: "${sch_b}", goal_books: 5, starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-10-01T00:00:00Z" }, as: Steward, as_user_id: "${stw}", captures: { drv: "$.data.id" } }
          trigger:
            - { call: "POST /library-network/drives/${drv}/school-decision", payload: { decision: "APPROVE" }, as: SchoolLiaison, as_user_id: "${sch_a}", captures: { err: "$.data.error_id" } }
          assert:
            - "Rejected with error_id == ERR_FORBIDDEN_OWNERSHIP (captured ${err}), HTTP 403; drive remains PROPOSED with school_approval_status PENDING"


  # ===========================================================================
  # Section 8 — Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_distribution_run_create_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[distribution-run-create-stale-batch]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Creating a run with the batch version observed before a prior successful run create (which superseded nothing but bumped the version) is rejected: the second create carries expected_batch_version one behind and fails with ERR_STALE_VERSION (412); the first run stays DRAFT."
        test_recipe:
          setup: ["ACTIVE LISTED box; SORTED batch with 1 graded item (version 2); client observed version ${b_v} == 2"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "OCC Owner", email: "occ@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/stewards/${stw}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes", payload: { steward_id: "${stw}", name: "OCC Box", latitude: 45.52, longitude: -122.68, capacity_books: 10, region_code: "OR" }, as: Steward, as_user_id: "${stw}", captures: { box: "$.data.id" } }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "CHARTERED" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes/${box}/inspections", payload: { result: "CONFIRMED" }, as: Moderator, as_user_id: "mod-1" }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "ACTIVE" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/batches", payload: { source_type: "PUBLIC_DROP", region_code: "OR" }, as: HubCoordinator, as_user_id: "hub-1", captures: { batch: "$.data.id" } }
            - { call: "POST /library-network/batches/${batch}/items", payload: { items: [ { title: "OCC Book", category: "FICTION", condition_grade: "A" } ] }, as: HubCoordinator, as_user_id: "hub-1" }
            - { call: "POST /library-network/batches/${batch}/sort-complete", payload: {}, as: HubCoordinator, as_user_id: "hub-1", captures: { b_v: "$.data.version" } }
          trigger:
            - { call: "POST /library-network/batches/${batch}/distribution-runs", payload: { expected_batch_version: "${b_v}" }, as: HubCoordinator, as_user_id: "hub-1", captures: { run1: "$.data.id" } }
            - { call: "POST /library-network/batches/${batch}/distribution-runs", payload: { expected_batch_version: "${b_v}" }, as: HubCoordinator, as_user_id: "hub-1", captures: { err: "$.data.error_id" } }
            - { call: "GET /library-network/distribution-runs/${run1}", payload: {}, as: HubCoordinator, as_user_id: "hub-1" }
          assert:
            - "First create succeeds (run ${run1} DRAFT) and advances the batch version to ${b_v} + 1"
            - "Second create with the now-stale expected_batch_version ${b_v} is rejected with error_id == ERR_STALE_VERSION (captured ${err}), HTTP 412"
            - "DistributionRun.${run1}.status remains DRAFT (no supersede happened)"

      - name: occ_steward_patch_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[steward-profile-patch-stale]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A steward profile patch replayed with the pre-patch version is rejected with ERR_STALE_VERSION (412); the accepted patch advanced the version exactly once."
        test_recipe:
          setup: ["Registered steward; client captured version at registration"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/stewards", payload: { full_name: "Patch Me", email: "patch@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id", stw_v: "$.data.version" } }
          trigger:
            - { call: "PATCH /library-network/stewards/${stw}", payload: { full_name: "Patched Once", expected_steward_version: "${stw_v}" }, as: Steward, as_user_id: "${stw}" }
            - { call: "PATCH /library-network/stewards/${stw}", payload: { full_name: "Patched Twice", expected_steward_version: "${stw_v}" }, as: Steward, as_user_id: "${stw}", captures: { err: "$.data.error_id" } }
            - { call: "GET /library-network/stewards/${stw}", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
          assert:
            - "First patch succeeds (200)"
            - "Second patch with the stale expected_steward_version is rejected with error_id == ERR_STALE_VERSION (captured ${err}), HTTP 412"
            - "Steward.${stw}.full_name == Patched Once and version == 2"

      - name: sweep_idempotent_without_clock_change
        claim_type: ops_run_checkpoint
        grounds: ["entities.LibraryBox.fields.days_since_activity"]
        distinguishing_aspect: "The sweep epoch is idempotent: a first sweep at 180 days suspends the stale box; a second sweep with the same clock changes nothing and reports all-zero counts."
        test_recipe:
          setup: ["Box activated at 2026-08-01T00:00:00Z; clock at 2027-01-28T00:00:00Z; one sweep already executed (box suspended)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Idem Owner", email: "idem@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/stewards/${stw}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes", payload: { steward_id: "${stw}", name: "Idem Box", latitude: 45.52, longitude: -122.68, capacity_books: 10, region_code: "OR" }, as: Steward, as_user_id: "${stw}", captures: { box: "$.data.id" } }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "CHARTERED" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes/${box}/inspections", payload: { result: "CONFIRMED" }, as: Moderator, as_user_id: "mod-1" }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "ACTIVE" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-28T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/map/sweeps", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /library-network/map/sweeps", payload: {}, as: NetworkAdmin, as_user_id: "admin-1", captures: { z_susp: "$.data.suspended_box_count", z_dec: "$.data.decommissioned_box_count", z_open: "$.data.opened_drive_count", z_close: "$.data.closed_drive_count", z_exp: "$.data.expired_response_count", z_rec: "$.data.recycled_item_count" } }
          assert:
            - "Second sweep reports all-zero counts: suspended ${z_susp} == 0, decommissioned ${z_dec} == 0, opened ${z_open} == 0, closed ${z_close} == 0, expired ${z_exp} == 0, recycled ${z_rec} == 0"
            - "LibraryBox.${box}.charter_status remains SUSPENDED (no double transition)"

      - name: cascading_side_effects_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: ["state_machines.LibraryBox.FLAGGED_to_DELISTED"]
        excluded_because:
          difficulty_instance: "transitive_cascade / complaint_upheld_delist_recall_chain"
          rationale: "The N-level cascade (complaint -> box posture -> allocations -> items -> run bubble-up) is verified end-to-end by the named §1.8 instance; the compensation cascade by complaint_upheld_then_adjudicated_dismissed_compensates in this file."

      - name: dual_variant_layer_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds: ["calculations.recognition_points", "calculations.drive_fulfillment"]
        excluded_because:
          difficulty_instance: "dual_variant_calc / recognition_rolling_vs_lifetime_window_ageout"
          rationale: "Both dual-variant calculations (recognition rolling-vs-lifetime, drive gross-vs-net) are asserted in §1.8 rule dual_variant_calc instances."

  # ===========================================================================
  # Section 9 — Consistency Model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: reads_reflect_writes_immediately
        claim_type: immediate_consistency
        grounds: ["complexity_profile"]
        distinguishing_aspect: "Immediate consistency: a freshly chartered box read back in the next request already shows charter_status CHARTERED, charter_number CH-000001, and version advanced — no read-your-writes lag."
        test_recipe:
          setup: ["ACTIVE steward with a DRAFT box"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Consistency Owner", email: "cons@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/stewards/${stw}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes", payload: { steward_id: "${stw}", name: "Cons Box", latitude: 45.52, longitude: -122.68, capacity_books: 10, region_code: "OR" }, as: Steward, as_user_id: "${stw}", captures: { box: "$.data.id" } }
          trigger:
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "CHARTERED" }, as: NetworkAdmin, as_user_id: "admin-1", captures: { cn: "$.data.charter_number", v: "$.data.version" } }
            - { call: "GET /library-network/boxes/${box}", payload: {}, as: Anonymous }
          assert:
            - "Mutation response shows charter_number == CH-000001 (captured ${cn}) and version == 2 (captured ${v})"
            - "Immediate GET returns charter_status == CHARTERED, charter_number == CH-000001, listing_posture == UNLISTED, version == 2"
