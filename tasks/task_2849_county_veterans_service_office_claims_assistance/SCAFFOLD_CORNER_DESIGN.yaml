  - section: state_machines
    instances:
      - name: corner_representative_activation_moves_pending_to_active
        claim_type: valid_transition
        grounds:
          - state_machines.Representative[PENDING->ACTIVE]
          - endpoints[POST /cvso/representatives/{id}/accreditation]
        distinguishing_aspect: "ACTIVATE on a PENDING accreditation returns the row with accreditation_status ACTIVE, version 2 and caseload_weight recomputed to 0.0 for a representative that holds nothing yet."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "One Representative in PENDING."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-361", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep: $.data.id }
