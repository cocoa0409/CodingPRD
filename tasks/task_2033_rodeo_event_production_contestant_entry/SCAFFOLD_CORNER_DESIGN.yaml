      - call: POST /api/rodeo-events/${ev_id}/draws
        payload:
          go_round_number: 1
          expected_rodeo_event_version: ${ev_v}
        as: CommitteeAdmin
        captures:
          ok1: $.data.assigned_count
      - call: POST /api/rodeo-events/${ev_id}/draws
        payload:
          go_round_number: 1
          expected_rodeo_event_version: ${ev_v}
        as: CommitteeAdmin
