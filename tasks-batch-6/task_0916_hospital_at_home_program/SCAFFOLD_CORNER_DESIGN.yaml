          assert:
            - "DailyComplianceRecord.${cd_mg}.monitoring_lapse_minutes == 75"
            - "DailyComplianceRecord.${cd_mg}.monitoring_lapse_minutes != 105 (the unmerged sum is wrong)"
            - "GET /episodes/${ep_mg}/monitoring-lapses returns 3 rows with total_count == 3"

