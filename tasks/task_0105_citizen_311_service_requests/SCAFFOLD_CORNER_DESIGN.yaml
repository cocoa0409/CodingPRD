  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_canonical_version_on_cluster_create
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.cluster-create-stale-request, "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Creating a DuplicateCluster with expected_canonical_version one behind the canonical request's current version returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A canonical request created (version 1) then triaged (version advances to 2); a cluster create still carries the pre-triage version."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: SystemAdmin
            - call: "POST /departments"
              payload: { name: "Streets", backlog_threshold: 5 }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
