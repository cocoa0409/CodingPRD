            - "RelocationCase.${case_id}.total_committed_cents == 0 and total_released_cents == 135000 (hop 2: the booking's cancellation released its committed funds)"
            - "RelocationCase.${case_id}.total_paid_cents == 61000 (completed travel untouched)"
            - "RepaymentAgreement.${ra_id}.status == DRAFT and total_owed_cents == 45750 (hop 3: agreement seeded from the finalized paid ledger, months_remaining 18/24)"

      - name: cancel_case_release_depth2_cascade
