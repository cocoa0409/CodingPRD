            - { call: "POST /hazwaste/manifests", payload: { site_id: "${site_id}", transporter_id: "${transp_id}", tsdf_id: "${tsdf_id}", manifest_tracking_number: "MT-410", line_items: [{ waste_stream_id: "${stream_id}", container_id: "${cont_id}", quantity_kg: 100.0 }] }, as: WasteCoordinator, as_user_id: "wc-1", captures: { man_id: "$.data.id" } }
            - { call: "POST /hazwaste/manifests/${man_id}/ldr-notifications", payload: { treatment_standard_codes: ["TLV-01"], certification_statement: "certified" }, as: EHSManager }
            - { call: "POST /hazwaste/manifests/${man_id}/sign-generator", as: EHSManager, as_user_id: "mgr-9" }
