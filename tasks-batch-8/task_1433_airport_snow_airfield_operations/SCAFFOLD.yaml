# =============================================================================
# SCAFFOLD.yaml — Airport Snow & Airfield Operations
# §1.0–§1.7 seed tables (single source of truth)
# =============================================================================

scenario: |
  Airport Snow & Airfield Operations (airport operations department): snow plan
  activation & priority surface sequencing, runway condition assessment & field
  condition reporting, NOTAM issuance & rescission, chemical application rate &
  environmental limits, equipment readiness & operator staffing shifts, closure
  decision & airline coordination, friction measurement & braking action reports,
  event cost tracking

domain_name: airport-snow-airfield-operations
api_prefix: ""

# =============================================================================
# Complexity profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic   # AirfieldSurface + Notam cycles; SnowEvent parallel dimensions
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; FK links in bodies)
# =============================================================================
entities:
  - name: SnowEvent
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: event_code, type: string, source: input, description: "Unique operator code for the storm event, e.g. SNOW-2026-01", constraints: "unique across SnowEvent" }
      - { name: season_label, type: string, source: input, description: "Winter season label, e.g. 2025-2026" }
      - { name: chemical_limit_lbs, type: number, source: input, description: "Per-event environmental cap on total chemical dispensed, in lbs", constraints: "> 0" }
      - { name: budget_cents, type: integer, source: input, description: "Fiscal cap on projected event cost, in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "FORECAST | ACTIVATED | ESCALATED | STANDING_DOWN | CLOSED", default: FORECAST }
      - { name: closure_status, type: enum, source: system, description: "Parallel dimension: NONE | PROPOSED | RATIFIED | LIFTED", default: NONE }
      - { name: airline_acknowledged, type: boolean, source: system, description: "True once AirlineCoordinator acknowledges a PROPOSED closure", default: false }
      - { name: activated_at, type: datetime, source: system, description: "Set when ACTIVATE succeeds; null before" }
      - { name: estimated_cost_cents, type: integer, source: computed, description: "Provisional variant of event_cost_accrual: SCHEDULED shifts at planned hours + AUTHORIZED applications", default: 0 }
      - { name: actual_cost_cents, type: integer, source: computed, description: "Final variant of event_cost_accrual: COMPLETED shifts at worked_hours + DISPENSED applications", default: 0 }
      - { name: chemical_used_lbs, type: number, source: computed, description: "Sum of authorized_quantity_lbs over this event's DISPENSED applications", default: 0 }

  - name: AirfieldSurface
    parent: null
    common_fields: true
    fields:
      - { name: surface_code, type: string, source: input, description: "Unique surface code, e.g. RWY-09L", constraints: "unique across AirfieldSurface" }
      - { name: surface_type, type: enum, source: input, description: "RUNWAY | TAXIWAY | APRON" }
      - { name: length_ft, type: number, source: input, description: "Surface length in feet", constraints: "> 0" }
      - { name: width_ft, type: number, source: input, description: "Surface width in feet", constraints: "> 0" }
      - { name: area_sqft, type: number, source: computed, description: "length_ft x width_ft; any client-supplied value is ignored" }
      - { name: priority_rank, type: integer, source: input, description: "Clearing priority; lower ranks clear first; ties break by created_at ASC" }
      - { name: status, type: enum, source: system, description: "OPEN | RESTRICTED | CLOSED", default: OPEN }
      - { name: current_condition_code, type: integer, source: computed, description: "RCAM-like 0..6 code from the latest FILED ConditionReport; null when none", default: null }
      - { name: active_notam_count, type: integer, source: computed, description: "Count of Notam rows on this surface with status == ISSUED", default: 0 }

  - name: ConditionReport
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> SnowEvent.id; event the report is filed under" }
      - { name: surface_id, type: string, source: input, description: "FK -> AirfieldSurface.id; surface assessed" }
      - { name: contaminant_type, type: enum, source: input, description: "DRY | WET | DRY_SNOW | WET_SNOW | COMPACTED_SNOW | ICE | SLUSH | STANDING_WATER" }
      - { name: coverage_pct, type: integer, source: input, description: "Contaminant coverage percent", constraints: "0..100" }
      - { name: depth_inches, type: number, source: input, description: "Contaminant depth in inches", constraints: ">= 0" }
      - { name: observed_at, type: datetime, source: input, description: "Observation time; must be <= current logical clock" }
      - { name: condition_code, type: integer, source: computed, description: "Derived via condition_code_derivation (base table minus coverage/depth downgrade)" }
      - { name: status, type: enum, source: system, description: "FILED | SUPERSEDED", default: FILED }
      - { name: superseded_by_id, type: string, source: system, description: "Id of the newer ConditionReport that superseded this one; null while FILED", default: null }

  - name: FrictionAssessment
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> SnowEvent.id" }
      - { name: surface_id, type: string, source: input, description: "FK -> AirfieldSurface.id" }
      - { name: mu_value, type: number, source: input, description: "Measured friction coefficient", constraints: "0.00..1.00, two decimal places" }
      - { name: measured_at, type: datetime, source: input, description: "Measurement time; must be <= current logical clock" }
      - { name: braking_action, type: enum, source: computed, description: "GOOD | MEDIUM | MEDIUM_POOR | POOR | NIL via braking_action_from_mu thresholds" }
      - { name: status, type: enum, source: system, description: "REPORTED | SUPERSEDED", default: REPORTED }
      - { name: superseded_by_id, type: string, source: system, description: "Id of the newer FrictionAssessment that superseded this one; null while REPORTED", default: null }

  - name: Notam
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> SnowEvent.id" }
      - { name: surface_id, type: string, source: input, description: "FK -> AirfieldSurface.id" }
      - { name: notam_type, type: enum, source: input, description: "SURFACE_CONDITION | RUNWAY_CLOSURE | CHEMICAL_TREATMENT" }
      - { name: effective_from, type: datetime, source: input, description: "Closed-interval window start; must be < effective_until" }
      - { name: effective_until, type: datetime, source: input, description: "Closed-interval window end (inclusive)" }
      - { name: message, type: string, source: input, description: "Free-text NOTAM body" }
      - { name: source_assessment_id, type: string, source: input, description: "FK -> FrictionAssessment.id; optional evidence link", constraints: "optional" }
      - { name: source_report_id, type: string, source: input, description: "FK -> ConditionReport.id; optional evidence link", constraints: "optional" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | REISSUE_REQUIRED | RESCINDED", default: DRAFT }

  - name: ChemicalProduct
    parent: null
    common_fields: true
    fields:
      - { name: product_code, type: string, source: input, description: "Unique product code, e.g. NAAC-01", constraints: "unique across ChemicalProduct" }
      - { name: base_rate_lbs_per_1000sqft, type: number, source: input, description: "Baseline application rate per 1000 sqft", constraints: "> 0" }
      - { name: unit_cost_cents_per_lb, type: integer, source: input, description: "Product unit cost in cents per lb", constraints: ">= 0" }
      - { name: seasonal_limit_lbs, type: number, source: input, description: "Season-wide environmental cap for this product", constraints: "> 0" }
      - { name: seasonal_reserved_lbs, type: number, source: computed, description: "Sum of authorized_quantity_lbs over AUTHORIZED applications of this product", default: 0 }
      - { name: seasonal_dispensed_lbs, type: number, source: computed, description: "Sum of authorized_quantity_lbs over DISPENSED applications of this product", default: 0 }
      - { name: seasonal_available_lbs, type: number, source: computed, description: "seasonal_limit_lbs - seasonal_dispensed_lbs - seasonal_reserved_lbs" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CONSTRAINED; flips CONSTRAINED when seasonal_dispensed_lbs >= 90% of seasonal_limit_lbs", default: ACTIVE }

  - name: ChemicalApplication
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> SnowEvent.id" }
      - { name: surface_id, type: string, source: input, description: "FK -> AirfieldSurface.id" }
      - { name: product_id, type: string, source: input, description: "FK -> ChemicalProduct.id" }
      - { name: pavement_temp_f, type: number, source: input, description: "Pavement temperature in Fahrenheit at proposal time; drives the rate factor branch" }
      - { name: raw_quantity_lbs, type: number, source: computed, description: "Physics-driven planned quantity via chemical_application_quantity (1 decimal, round_half_up)" }
      - { name: authorized_quantity_lbs, type: number, source: computed, description: "min(raw_quantity_lbs, event_remaining_lbs, product_available_lbs) set at AUTHORIZE; null while PROPOSED", default: null }
      - { name: capped, type: boolean, source: computed, description: "True when authorized_quantity_lbs < raw_quantity_lbs at authorization", default: false }
      - { name: authorized_by, type: string, source: system, description: "X-User-ID of the MaintenanceLead who authorized; null while PROPOSED", default: null }
      - { name: line_cost_cents, type: integer, source: computed, description: "round_half_up(authorized_quantity_lbs x product.unit_cost_cents_per_lb); set at AUTHORIZE", default: 0 }
      - { name: status, type: enum, source: system, description: "PROPOSED | AUTHORIZED | DISPENSED | REJECTED | VOIDED", default: PROPOSED }

  - name: EquipmentUnit
    parent: null
    common_fields: true
    fields:
      - { name: unit_code, type: string, source: input, description: "Unique unit code, e.g. PLOW-01", constraints: "unique across EquipmentUnit" }
      - { name: unit_type, type: enum, source: input, description: "PLOW | BROOM | DEICER | BLOWER" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Operating cost rate in cents per hour", constraints: ">= 0" }
      - { name: readiness, type: enum, source: system, description: "READY | OUT_OF_SERVICE", default: READY }

  - name: OperatorShift
    parent: null
    common_fields: true
    fields:
      - { name: operator_code, type: string, source: input, description: "Operator identifier string; overlap checks are scoped per operator_code" }
      - { name: event_id, type: string, source: input, description: "FK -> SnowEvent.id; shift is staffed against this event" }
      - { name: equipment_unit_id, type: string, source: input, description: "FK -> EquipmentUnit.id; optional unit operated during the shift", constraints: "optional" }
      - { name: base_rate_cents_per_hour, type: integer, source: input, description: "Operator labor rate in cents per hour", constraints: ">= 0" }
      - { name: start_utc, type: datetime, source: input, description: "Half-open shift window start (inclusive)" }
      - { name: end_utc, type: datetime, source: input, description: "Half-open shift window end (exclusive); must be > start_utc" }
      - { name: worked_hours, type: number, source: input, description: "Actual hours worked; supplied at COMPLETE", constraints: "> 0; null until COMPLETED", default: null }
      - { name: line_cost_cents, type: integer, source: computed, description: "Labor line via event_cost_accrual using worked_hours; set at COMPLETE", default: 0 }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED", default: SCHEDULED }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SnowEvent
    field: status
    initial_state: FORECAST
    terminal_states: [CLOSED]
    transitions:
      - from: FORECAST
        to: ACTIVATED
        trigger: "POST /snow-events/{id}/event-actions (action=ACTIVATE)"
        actor: OpsController
        preconditions:
          - "At least 3 EquipmentUnit rows with readiness == READY exist (else ERR_EQUIPMENT_READINESS_SHORTFALL)"
        side_effects:
          - "activated_at set to current logical clock time"
          - "increments SnowEvent.version by 1"
      - from: ACTIVATED
        to: ESCALATED
        trigger: "POST /snow-events/{id}/event-actions (action=ESCALATE)"
        actor: OpsController
        preconditions: []
        side_effects: ["increments SnowEvent.version by 1"]
      - from: ESCALATED
        to: ACTIVATED
        trigger: "POST /snow-events/{id}/event-actions (action=DE_ESCALATE)"
        actor: OpsController
        preconditions: []
        side_effects: ["increments SnowEvent.version by 1"]
      - from: ACTIVATED
        to: STANDING_DOWN
        trigger: "POST /snow-events/{id}/event-actions (action=STAND_DOWN)"
        actor: OpsController
        preconditions:
          - "Every AirfieldSurface has status == OPEN (else ERR_SURFACE_NOT_CLEARED)"
        side_effects:
          - "closure_status RATIFIED -> LIFTED; closure_status PROPOSED -> NONE (airline_acknowledged reset to false)"
          - "increments SnowEvent.version by 1"
      - from: ESCALATED
        to: STANDING_DOWN
        trigger: "POST /snow-events/{id}/event-actions (action=STAND_DOWN)"
        actor: OpsController
        preconditions:
          - "Every AirfieldSurface has status == OPEN (else ERR_SURFACE_NOT_CLEARED)"
        side_effects:
          - "closure_status RATIFIED -> LIFTED; closure_status PROPOSED -> NONE (airline_acknowledged reset to false)"
          - "increments SnowEvent.version by 1"
      - from: STANDING_DOWN
        to: CLOSED
        trigger: "POST /snow-events/{id}/event-actions (action=CLOSE)"
        actor: OpsController
        preconditions:
          - "No Notam with this event_id has status == ISSUED (else ERR_ACTIVE_NOTAMS_REMAIN)"
        side_effects:
          - "actual_cost_cents frozen as the final event_cost_accrual reconciliation; estimated_cost_cents recomputed (0 once nothing remains SCHEDULED/AUTHORIZED)"
          - "increments SnowEvent.version by 1"

  - entity: SnowEvent
    field: closure_status
    initial_state: NONE
    terminal_states: [LIFTED]
    transitions:
      - from: NONE
        to: PROPOSED
        trigger: "POST /snow-events/{id}/closure-actions (action=PROPOSE)"
        actor: OpsController
        preconditions:
          - "SnowEvent.status IN {ACTIVATED, ESCALATED} (else ERR_INVALID_EVENT_STATE)"
        side_effects:
          - "airline_acknowledged set to false"
          - "increments SnowEvent.version by 1"
      - from: PROPOSED
        to: PROPOSED
        trigger: "POST /snow-events/{id}/closure-actions (action=ACKNOWLEDGE)"
        actor: AirlineCoordinator
        preconditions: []
        side_effects:
          - "airline_acknowledged set to true"
          - "increments SnowEvent.version by 1"
      - from: PROPOSED
        to: RATIFIED
        trigger: "POST /snow-events/{id}/closure-actions (action=RATIFY)"
        actor: OpsController
        preconditions:
          - "Every AirfieldSurface with surface_type == RUNWAY has status == CLOSED (else ERR_RUNWAYS_NOT_CLOSED)"
          - "airline_acknowledged == true (else ERR_AIRLINE_ACK_REQUIRED)"
        side_effects: ["increments SnowEvent.version by 1"]
      - from: RATIFIED
        to: LIFTED
        trigger: "system (side effect of event-actions STAND_DOWN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: NONE
        trigger: "system (side effect of event-actions STAND_DOWN)"
        actor: system
        preconditions: []
        side_effects: ["airline_acknowledged reset to false"]

  - entity: AirfieldSurface
    field: status
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "POST /airfield-surfaces/{id}/surface-actions (action=RESTRICT)"
        actor: OpsController
        preconditions:
          - "SnowEvent referenced by request event_id has status IN {ACTIVATED, ESCALATED} (else ERR_EVENT_NOT_ACTIVE)"
        side_effects: ["increments AirfieldSurface.version by 1"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /airfield-surfaces/{id}/surface-actions (action=CLOSE)"
        actor: OpsController
        preconditions:
          - "SnowEvent referenced by request event_id has status IN {ACTIVATED, ESCALATED} (else ERR_EVENT_NOT_ACTIVE)"
        side_effects:
          - "Cascade link 1: every ConditionReport on this surface with status == FILED becomes SUPERSEDED"
          - "Cascade link 2: each such supersession flips every ISSUED Notam whose source_report_id names that report to REISSUE_REQUIRED"
          - "Cascade link 3: each Notam flip to REISSUE_REQUIRED recomputes this surface's active_notam_count (counts status == ISSUED only)"
          - "increments AirfieldSurface.version by 1"
      - from: RESTRICTED
        to: CLOSED
        trigger: "POST /airfield-surfaces/{id}/surface-actions (action=CLOSE)"
        actor: OpsController
        preconditions:
          - "SnowEvent referenced by request event_id has status IN {ACTIVATED, ESCALATED} (else ERR_EVENT_NOT_ACTIVE)"
        side_effects:
          - "Cascade link 1: every ConditionReport on this surface with status == FILED becomes SUPERSEDED"
          - "Cascade link 2: each such supersession flips every ISSUED Notam whose source_report_id names that report to REISSUE_REQUIRED"
          - "Cascade link 3: each Notam flip to REISSUE_REQUIRED recomputes this surface's active_notam_count (counts status == ISSUED only)"
          - "increments AirfieldSurface.version by 1"
      - from: CLOSED
        to: RESTRICTED
        trigger: "POST /airfield-surfaces/{id}/surface-actions (action=REOPEN)"
        actor: OpsController
        preconditions:
          - "SnowEvent referenced by request event_id has status IN {ACTIVATED, ESCALATED} (else ERR_EVENT_NOT_ACTIVE)"
          - "Latest FrictionAssessment on this surface with status == REPORTED has braking_action IN {GOOD, MEDIUM}; if none exists or latest is MEDIUM_POOR/POOR/NIL -> ERR_REOPEN_FRICTION_TOO_LOW"
        side_effects: ["increments AirfieldSurface.version by 1"]
      - from: RESTRICTED
        to: OPEN
        trigger: "POST /airfield-surfaces/{id}/surface-actions (action=CLEAR)"
        actor: OpsController
        preconditions:
          - "SnowEvent referenced by request event_id has status IN {ACTIVATED, ESCALATED} (else ERR_EVENT_NOT_ACTIVE)"
        side_effects: ["increments AirfieldSurface.version by 1"]

  - entity: ConditionReport
    field: status
    initial_state: FILED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: FILED
        to: SUPERSEDED
        trigger: "system (a newer POST /condition-reports for the same (event_id, surface_id) succeeds)"
        actor: system
        preconditions: []
        side_effects:
          - "superseded_by_id set to the newer report's id"
          - "Every ISSUED Notam whose source_report_id == this report's id becomes REISSUE_REQUIRED"
          - "Each such Notam flip recomputes the surface's active_notam_count"

  - entity: FrictionAssessment
    field: status
    initial_state: REPORTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: REPORTED
        to: SUPERSEDED
        trigger: "system (a newer POST /friction-assessments for the same (event_id, surface_id) succeeds)"
        actor: system
        preconditions: []
        side_effects:
          - "superseded_by_id set to the newer assessment's id"
          - "Every ISSUED Notam whose source_assessment_id == this assessment's id becomes REISSUE_REQUIRED"
          - "Each such Notam flip recomputes the surface's active_notam_count"

  - entity: Notam
    field: status
    initial_state: DRAFT
    terminal_states: [RESCINDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /notams/{id}/notam-actions (action=ISSUE)"
        actor: OpsController
        preconditions:
          - "AirfieldSurface referenced by surface_id has status IN {RESTRICTED, CLOSED} (else ERR_INVALID_SURFACE_STATE)"
          - "If notam_type == SURFACE_CONDITION, the latest REPORTED FrictionAssessment on the surface (if any) must have braking_action NOT IN {POOR, NIL} (else ERR_UNSAFE_NOTAM_CONDITION)"
          - "Closed effective window [effective_from, effective_until] shares no instant with any other ISSUED Notam on the same surface with the same notam_type; touching endpoints count as overlap (else ERR_NOTAM_WINDOW_OVERLAP)"
        side_effects:
          - "AirfieldSurface.active_notam_count += 1"
          - "increments Notam.version by 1"
      - from: ISSUED
        to: REISSUE_REQUIRED
        trigger: "system (source ConditionReport or FrictionAssessment superseded)"
        actor: system
        preconditions: []
        side_effects:
          - "AirfieldSurface.active_notam_count -= 1 (REISSUE_REQUIRED rows are not counted)"
      - from: REISSUE_REQUIRED
        to: ISSUED
        trigger: "POST /notams/{id}/notam-actions (action=REISSUE, optional new effective_from/effective_until)"
        actor: OpsController
        preconditions:
          - "AirfieldSurface referenced by surface_id has status IN {RESTRICTED, CLOSED} (else ERR_INVALID_SURFACE_STATE)"
          - "If notam_type == SURFACE_CONDITION, the latest REPORTED FrictionAssessment on the surface (if any) must have braking_action NOT IN {POOR, NIL} (else ERR_UNSAFE_NOTAM_CONDITION)"
          - "Effective window (new values if supplied, else existing) shares no instant with any other ISSUED Notam on the same surface with the same notam_type under closed-interval semantics (else ERR_NOTAM_WINDOW_OVERLAP)"
        side_effects:
          - "AirfieldSurface.active_notam_count += 1"
          - "increments Notam.version by 1"
      - from: ISSUED
        to: RESCINDED
        trigger: "POST /notams/{id}/notam-actions (action=RESCIND)"
        actor: OpsController
        preconditions:
          - "AirfieldSurface referenced by surface_id has status == OPEN (else ERR_INVALID_SURFACE_STATE)"
        side_effects:
          - "AirfieldSurface.active_notam_count -= 1"
          - "increments Notam.version by 1"
      - from: REISSUE_REQUIRED
        to: RESCINDED
        trigger: "POST /notams/{id}/notam-actions (action=RESCIND)"
        actor: OpsController
        preconditions:
          - "AirfieldSurface referenced by surface_id has status == OPEN (else ERR_INVALID_SURFACE_STATE)"
        side_effects: ["increments Notam.version by 1"]

  - entity: ChemicalProduct
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: CONSTRAINED
        trigger: "system (a DISPENSE makes seasonal_dispensed_lbs >= 0.9 x seasonal_limit_lbs)"
        actor: system
        preconditions: []
        side_effects:
          - "Every ChemicalApplication on this product with status == PROPOSED becomes REJECTED"

  - entity: ChemicalApplication
    field: status
    initial_state: PROPOSED
    terminal_states: [DISPENSED, REJECTED, VOIDED]
    transitions:
      - from: PROPOSED
        to: AUTHORIZED
        trigger: "POST /chemical-applications/{id}/application-actions (action=AUTHORIZE)"
        actor: MaintenanceLead
        preconditions:
          - "SnowEvent referenced by event_id has status IN {ACTIVATED, ESCALATED} (else ERR_EVENT_NOT_ACTIVE)"
          - "ChemicalProduct referenced by product_id has status == ACTIVE (else ERR_PRODUCT_CONSTRAINED)"
          - "min(event_remaining_lbs, product_available_lbs) > 0 where event_remaining_lbs = event.chemical_limit_lbs - event.chemical_used_lbs - sum(authorized_quantity_lbs of AUTHORIZED applications on the event) and product_available_lbs = product.seasonal_available_lbs (else ERR_ENV_LIMIT_EXCEEDED)"
          - "event.estimated_cost_cents + round_half_up(min(raw_quantity_lbs, event_remaining_lbs, product_available_lbs) x product.unit_cost_cents_per_lb) <= event.budget_cents (else ERR_BUDGET_EXCEEDED)"
        side_effects:
          - "authorized_quantity_lbs = min(raw_quantity_lbs, event_remaining_lbs, product_available_lbs); capped = (authorized_quantity_lbs < raw_quantity_lbs)"
          - "line_cost_cents = round_half_up(authorized_quantity_lbs x product.unit_cost_cents_per_lb)"
          - "ChemicalProduct.seasonal_reserved_lbs += authorized_quantity_lbs (seasonal_available_lbs recomputed)"
          - "authorized_by = caller X-User-ID"
          - "SnowEvent.estimated_cost_cents recomputed (this application now contributes)"
          - "increments ChemicalApplication.version by 1"
      - from: AUTHORIZED
        to: DISPENSED
        trigger: "POST /chemical-applications/{id}/application-actions (action=DISPENSE)"
        actor: MaintenanceLead
        preconditions:
          - "Caller X-User-ID != authorized_by (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "ChemicalProduct.seasonal_reserved_lbs -= authorized_quantity_lbs; seasonal_dispensed_lbs += authorized_quantity_lbs; seasonal_available_lbs recomputed"
          - "SnowEvent.chemical_used_lbs += authorized_quantity_lbs"
          - "SnowEvent.actual_cost_cents recomputed; estimated_cost_cents recomputed (this application leaves the provisional input set)"
          - "Cascade link 1: the seasonal_dispensed_lbs mutation evaluates 0.9 x seasonal_limit_lbs"
          - "Cascade link 2: if the threshold is crossed, ChemicalProduct.status flips ACTIVE -> CONSTRAINED"
          - "Cascade link 3: that flip rejects every PROPOSED ChemicalApplication on this product"
          - "increments ChemicalApplication.version by 1"
      - from: AUTHORIZED
        to: VOIDED
        trigger: "POST /chemical-applications/{id}/application-actions (action=VOID)"
        actor: MaintenanceLead
        preconditions: []
        side_effects:
          - "ChemicalProduct.seasonal_reserved_lbs -= authorized_quantity_lbs; seasonal_available_lbs recomputed (compensates AUTHORIZE)"
          - "SnowEvent.estimated_cost_cents recomputed (this application leaves the provisional input set)"
          - "increments ChemicalApplication.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "system (ChemicalProduct flipped to CONSTRAINED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EquipmentUnit
    field: readiness
    initial_state: READY
    terminal_states: []
    transitions:
      - from: READY
        to: OUT_OF_SERVICE
        trigger: "POST /equipment-units/{id}/readiness-actions (action=TAKE_OUT_OF_SERVICE)"
        actor: MaintenanceLead
        preconditions: []
        side_effects: ["increments EquipmentUnit.version by 1"]
      - from: OUT_OF_SERVICE
        to: READY
        trigger: "POST /equipment-units/{id}/readiness-actions (action=RETURN_TO_SERVICE)"
        actor: MaintenanceLead
        preconditions: []
        side_effects: ["increments EquipmentUnit.version by 1"]

  - entity: OperatorShift
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /operator-shifts/{id}/shift-actions (action=COMPLETE, worked_hours)"
        actor: OpsController
        preconditions: []
        side_effects:
          - "line_cost_cents = round_half_up(min(worked_hours, 8) x base_rate_cents_per_hour + max(0, worked_hours - 8) x base_rate_cents_per_hour x 1.5)"
          - "SnowEvent.actual_cost_cents recomputed (this shift enters the final input set)"
          - "increments OperatorShift.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /operator-shifts/{id}/shift-actions (action=CANCEL)"
        actor: OpsController
        preconditions: []
        side_effects:
          - "SnowEvent.estimated_cost_cents recomputed (this shift leaves the provisional input set)"
          - "increments OperatorShift.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: report-create-stale-surface
    parent_entity: AirfieldSurface
    write_endpoint: "POST /condition-reports"
    occ_field: expected_surface_version
    description: |
      Creating a ConditionReport against an AirfieldSurface whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just filed a report (or taken a surface
      action) that legitimately supersedes the client's view of the surface's
      current condition.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: friction-create-stale-surface
    parent_entity: AirfieldSurface
    write_endpoint: "POST /friction-assessments"
    occ_field: expected_surface_version
    description: |
      Creating a FrictionAssessment against an AirfieldSurface whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just recorded a measurement that legitimately
      supersedes the client's view of the surface's braking action.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: braking_action_from_mu
    trigger: "POST /friction-assessments (on creation)"
    algorithm: threshold
    formula: |
      if mu_value >= GOOD_MIN: braking_action = GOOD
      elif mu_value >= MEDIUM_MIN: braking_action = MEDIUM
      elif mu_value >= MEDIUM_POOR_MIN: braking_action = MEDIUM_POOR
      elif mu_value >= POOR_MIN: braking_action = POOR
      else: braking_action = NIL
      Lower bounds are INCLUSIVE (mu == 0.36 is MEDIUM, not MEDIUM_POOR).
    input_set: "The new FrictionAssessment's mu_value only."
    constants:
      GOOD_MIN: 0.50
      MEDIUM_MIN: 0.36
      MEDIUM_POOR_MIN: 0.26
      POOR_MIN: 0.10
    precision: "mu_value is compared exactly at two decimal places"

  - name: chemical_application_quantity
    trigger: "POST /chemical-applications (raw variant at creation); application-actions AUTHORIZE (authorized variant)"
    algorithm: constraint_propagation
    formula: |
      # raw variant (physics-driven planned quantity)
      area_units = surface.area_sqft / 1000
      temp_factor = 1.25 if pavement_temp_f < TEMP_LOW_F
                    else 1.10 if TEMP_LOW_F <= pavement_temp_f <= TEMP_HIGH_F
                    else 1.00
      raw_quantity_lbs = round_half_up_1dp(area_units * product.base_rate_lbs_per_1000sqft * temp_factor)
      # authorized variant (environment-capped) at AUTHORIZE
      event_remaining_lbs = event.chemical_limit_lbs - event.chemical_used_lbs
                            - sum(authorized_quantity_lbs over AUTHORIZED applications on the event)
      product_available_lbs = product.seasonal_available_lbs
      authorized_quantity_lbs = min(raw_quantity_lbs, event_remaining_lbs, product_available_lbs)
      # boundary: authorization is INCLUSIVE — raw == available authorizes in full (capped=false)
    input_set: "The ChemicalApplication row, its AirfieldSurface, its ChemicalProduct, and its SnowEvent (AUTHORIZED/DISPENSED siblings feed the remaining pools)."
    constants:
      TEMP_LOW_F: 15
      TEMP_HIGH_F: 28
      FACTOR_COLD: 1.25
      FACTOR_COOL: 1.10
      FACTOR_WARM: 1.00
    precision: "raw_quantity_lbs rounded to 1 decimal place, round_half_up, BEFORE the min() comparisons"
    variants:
      - name: planned_raw
        when: "At creation (POST /chemical-applications)"
        difference: "Pure physics quantity: area x base rate x temperature factor; ignores all environmental caps"
      - name: authorized_capped
        when: "At AUTHORIZE"
        difference: "min(raw, event_remaining, product_available); diverges from planned_raw whenever either environmental cap binds (capped=true)"

  - name: event_cost_accrual
    trigger: "Recomputed whenever a shift or chemical application of the event changes status (create, AUTHORIZE, DISPENSE, VOID, COMPLETE, CANCEL) and at event CLOSE"
    algorithm: aggregation
    formula: |
      # Per-line rounding THEN sum (pinned order; sum-then-round is rejected):
      # shift labor line:
      #   h = planned hours (end_utc - start_utc) for SCHEDULED, worked_hours for COMPLETED
      #   labor_line_cents = round_half_up_cents(min(h,8) * base_rate_cents_per_hour
      #                      + max(0,h-8) * base_rate_cents_per_hour * OT_MULTIPLIER)
      # shift equipment line (only when equipment_unit_id is set):
      #   equip_line_cents = round_half_up_cents(h * unit.hourly_rate_cents)
      # chemical line:
      #   chem_line_cents = round_half_up_cents(authorized_quantity_lbs * product.unit_cost_cents_per_lb)
      estimated_cost_cents = sum of lines over shifts with status == SCHEDULED
                             plus applications with status == AUTHORIZED
      actual_cost_cents    = sum of lines over shifts with status == COMPLETED
                             plus applications with status == DISPENSED
      CANCELLED shifts and REJECTED/VOIDED applications are excluded from both variants.
    input_set: "OperatorShift and ChemicalApplication rows whose event_id == the SnowEvent; state filters per variant as above."
    constants:
      OT_MULTIPLIER: 1.5
      REGULAR_HOURS_CAP: 8
    precision: "Integer cents. Rounding order is pinned: round each line to cents with round_half_up FIRST, then sum the rounded lines."
    variants:
      - name: provisional_estimated
        when: "Live while the event is in flight"
        difference: "SCHEDULED shifts at planned (end_utc - start_utc) hours; AUTHORIZED applications"
      - name: final_actual
        when: "Accrues as work completes; frozen at event CLOSE"
        difference: "COMPLETED shifts at worked_hours; DISPENSED applications; identical records yield a different total whenever planned hours differ from worked hours"

  - name: condition_code_derivation
    trigger: "POST /condition-reports (on creation)"
    algorithm: threshold
    formula: |
      base = { DRY: 6, WET: 5, DRY_SNOW: 4, WET_SNOW: 3, COMPACTED_SNOW: 2,
               SLUSH: 2, STANDING_WATER: 2, ICE: 1 }[contaminant_type]
      if coverage_pct > 50 AND depth_inches >= 0.25: base = base - 1
      condition_code = max(0, base)
    input_set: "The new ConditionReport's contaminant_type, coverage_pct, depth_inches."
    constants:
      DOWNGRADE_COVERAGE_PCT: 50
      DOWNGRADE_DEPTH_IN: 0.25
    precision: "Integer code 0..6"

  - name: dispatch_order
    trigger: "GET /snow-events/{id}/dispatch-order"
    algorithm: aggregation
    formula: |
      eligible = AirfieldSurface rows with status IN {RESTRICTED, CLOSED}
      order by priority_rank ASC, tie-break created_at ASC
      empty eligible set -> empty array (no error)
    input_set: "All AirfieldSurface rows; only status IN {RESTRICTED, CLOSED} are eligible."
    constants: {}
    precision: "Deterministic total order; id is never used for ranking or tie-breaks"

  - name: seasonal_chemical_counters
    trigger: "ChemicalApplication AUTHORIZE / DISPENSE / VOID"
    algorithm: aggregation
    formula: |
      product.seasonal_reserved_lbs  = sum(authorized_quantity_lbs over AUTHORIZED applications of the product)
      product.seasonal_dispensed_lbs = sum(authorized_quantity_lbs over DISPENSED applications of the product)
      product.seasonal_available_lbs = seasonal_limit_lbs - seasonal_dispensed_lbs - seasonal_reserved_lbs
      event.chemical_used_lbs        = sum(authorized_quantity_lbs over DISPENSED applications of the event)
      Invariant (conserved quota): seasonal_dispensed_lbs + seasonal_reserved_lbs + seasonal_available_lbs
                                   == seasonal_limit_lbs at all times.
    input_set: "ChemicalApplication rows by product_id (product counters) or event_id (event counter); statuses as named."
    constants:
      CONSTRAINED_THRESHOLD_PCT: 0.9
    precision: "1 decimal place consistent with authorized_quantity_lbs"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and well-formed", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role is in the endpoint's roles list; for action endpoints the role must be permitted for the specific action (closure-actions ACKNOWLEDGE requires AirlineCoordinator; PROPOSE/RATIFY require OpsController)", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: business_constraint, check: "Request well-formedness: required fields present; enum membership valid; numeric ranges (mu_value 0.00..1.00; coverage_pct 0..100; depth_inches >= 0; worked_hours > 0; lengths > 0); effective_from < effective_until; start_utc < end_utc; observed_at / measured_at <= current logical clock", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path ids exist, then body FK references exist, validated left-to-right (event_id before surface_id before product_id before equipment_unit_id)", error_id: ERR_EVENT_NOT_FOUND, http_status: 404, applies_to: "all (per-resource variant: ERR_SURFACE_NOT_FOUND, ERR_REPORT_NOT_FOUND, ERR_ASSESSMENT_NOT_FOUND, ERR_NOTAM_NOT_FOUND, ERR_PRODUCT_NOT_FOUND, ERR_APPLICATION_NOT_FOUND, ERR_SHIFT_NOT_FOUND, ERR_EQUIPMENT_NOT_FOUND)" }
  - { priority: 5, category: state, check: "Entity state preconditions per §1.2: action listed for the current state; cross-entity state gates (event ACTIVATED/ESCALATED for reports/assessments/applications/shifts/surface actions; surface RESTRICTED/CLOSED for notam ISSUE; surface OPEN for notam RESCIND; application PROPOSED for AUTHORIZE / AUTHORIZED for DISPENSE/VOID; shift SCHEDULED for COMPLETE/CANCEL)", error_id: ERR_INVALID_EVENT_STATE, http_status: 409, applies_to: "action endpoints (per-entity variants: ERR_EVENT_NOT_ACTIVE, ERR_INVALID_SURFACE_STATE, ERR_INVALID_NOTAM_STATE, ERR_INVALID_APPLICATION_STATE, ERR_INVALID_SHIFT_STATE)" }
  - { priority: 6, category: state, check: "OCC: expected_surface_version equals the AirfieldSurface's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /condition-reports", "POST /friction-assessments"] }
  - { priority: 7, category: business_safety, check: "AUTHORIZE: ChemicalProduct.status == ACTIVE", error_id: ERR_PRODUCT_CONSTRAINED, http_status: 409, applies_to: ["POST /chemical-applications/{id}/application-actions"] }
  - { priority: 8, category: business_safety, check: "AUTHORIZE: min(event_remaining_lbs, product_available_lbs) > 0 (environmental caps, boundary inclusive at equality)", error_id: ERR_ENV_LIMIT_EXCEEDED, http_status: 422, applies_to: ["POST /chemical-applications/{id}/application-actions"] }
  - { priority: 9, category: business_safety, check: "Notam ISSUE/REISSUE with notam_type == SURFACE_CONDITION: latest REPORTED FrictionAssessment on the surface (if any) has braking_action NOT IN {POOR, NIL}", error_id: ERR_UNSAFE_NOTAM_CONDITION, http_status: 409, applies_to: ["POST /notams/{id}/notam-actions"] }
  - { priority: 10, category: business_safety, check: "Surface REOPEN: latest REPORTED FrictionAssessment exists and has braking_action IN {GOOD, MEDIUM}", error_id: ERR_REOPEN_FRICTION_TOO_LOW, http_status: 409, applies_to: ["POST /airfield-surfaces/{id}/surface-actions"] }
  - { priority: 11, category: business_safety, check: "DISPENSE: caller X-User-ID differs from authorized_by (segregation of duties)", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: ["POST /chemical-applications/{id}/application-actions"] }
  - { priority: 12, category: business_temporal, check: "OperatorShift create: half-open window [start_utc, end_utc) overlaps no other non-CANCELLED shift with the same operator_code; touching endpoints (end == start) are allowed", error_id: ERR_SHIFT_OVERLAP, http_status: 409, applies_to: ["POST /operator-shifts"] }
  - { priority: 13, category: business_temporal, check: "Notam ISSUE/REISSUE: closed window [effective_from, effective_until] shares no instant (touching endpoints DO count) with any ISSUED Notam on the same surface with the same notam_type", error_id: ERR_NOTAM_WINDOW_OVERLAP, http_status: 409, applies_to: ["POST /notams/{id}/notam-actions"] }
  - { priority: 14, category: business_constraint, check: "ACTIVATE: at least 3 EquipmentUnit rows with readiness == READY", error_id: ERR_EQUIPMENT_READINESS_SHORTFALL, http_status: 409, applies_to: ["POST /snow-events/{id}/event-actions"] }
  - { priority: 15, category: business_constraint, check: "STAND_DOWN: every AirfieldSurface has status == OPEN", error_id: ERR_SURFACE_NOT_CLEARED, http_status: 409, applies_to: ["POST /snow-events/{id}/event-actions"] }
  - { priority: 16, category: business_constraint, check: "CLOSE: no Notam on the event has status == ISSUED", error_id: ERR_ACTIVE_NOTAMS_REMAIN, http_status: 409, applies_to: ["POST /snow-events/{id}/event-actions"] }
  - { priority: 17, category: business_constraint, check: "RATIFY: every RUNWAY surface CLOSED, then airline_acknowledged == true", error_id: ERR_RUNWAYS_NOT_CLOSED, http_status: 409, applies_to: ["POST /snow-events/{id}/closure-actions"] }
  - { priority: 18, category: business_constraint, check: "RATIFY: airline_acknowledged == true (checked after the runway-closure rule)", error_id: ERR_AIRLINE_ACK_REQUIRED, http_status: 409, applies_to: ["POST /snow-events/{id}/closure-actions"] }
  - { priority: 19, category: business_fiscal, check: "AUTHORIZE: event.estimated_cost_cents + round_half_up(min(raw, event_remaining, product_available) x unit_cost_cents_per_lb) <= event.budget_cents", error_id: ERR_BUDGET_EXCEEDED, http_status: 422, applies_to: ["POST /chemical-applications/{id}/application-actions"] }
  - { priority: 20, category: business_constraint, check: "OperatorShift create with equipment_unit_id: the referenced unit has readiness == READY", error_id: ERR_EQUIPMENT_NOT_READY, http_status: 409, applies_to: ["POST /operator-shifts"] }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/snow-events", description: "Create a snow event shell (starts FORECAST)", roles: [OpsController], code: 201, input: [event_code, season_label, chemical_limit_lbs, budget_cents], output: SnowEvent, side_effects: [] }
  - { method: GET, path: "/snow-events", description: "List snow events", roles: [OpsController, AirlineCoordinator, SystemAdmin], code: 200, input: ["status?", "season_label?", "limit?", "offset?"], output: "SnowEvent[]", side_effects: [] }
  - { method: GET, path: "/snow-events/{id}", description: "Read one snow event (costs, statuses, version)", roles: [OpsController, AirlineCoordinator, SystemAdmin], code: 200, input: [], output: SnowEvent, side_effects: [] }
  - { method: POST, path: "/snow-events/{id}/event-actions", description: "Lifecycle action: ACTIVATE | ESCALATE | DE_ESCALATE | STAND_DOWN | CLOSE per the SnowEvent status machine", roles: [OpsController], code: 200, input: [action], output: SnowEvent, side_effects: ["per §1.2 SnowEvent status transitions incl. closure_status side effects and cost freeze at CLOSE"] }
  - { method: POST, path: "/snow-events/{id}/closure-actions", description: "Closure dimension action: PROPOSE | RATIFY (OpsController), ACKNOWLEDGE (AirlineCoordinator)", roles: [OpsController, AirlineCoordinator], code: 200, input: [action], output: SnowEvent, side_effects: ["per §1.2 SnowEvent closure_status transitions"] }
  - { method: GET, path: "/snow-events/{id}/dispatch-order", description: "Priority surface sequencing: eligible surfaces (status RESTRICTED or CLOSED) ordered by priority_rank ASC, created_at ASC", roles: [OpsController, MaintenanceLead], code: 200, input: [], output: "AirfieldSurface[]", side_effects: [] }
  - { method: GET, path: "/snow-events/{id}/cost-summary", description: "Dual-variant cost read", roles: [OpsController], code: 200, input: [], output: "{ estimated_cost_cents: integer, actual_cost_cents: integer, chemical_used_lbs: number }", side_effects: [] }

  - { method: POST, path: "/airfield-surfaces", description: "Register an airfield surface (configuration)", roles: [SystemAdmin], code: 201, input: [surface_code, surface_type, length_ft, width_ft, priority_rank], output: AirfieldSurface, side_effects: ["area_sqft computed"] }
  - { method: GET, path: "/airfield-surfaces", description: "List surfaces", roles: [OpsController, AirfieldInspector, MaintenanceLead, SystemAdmin], code: 200, input: ["status?", "surface_type?", "limit?", "offset?"], output: "AirfieldSurface[]", side_effects: [] }
  - { method: GET, path: "/airfield-surfaces/{id}", description: "Read one surface (status, current_condition_code, active_notam_count, version)", roles: [OpsController, AirfieldInspector, MaintenanceLead, SystemAdmin], code: 200, input: [], output: AirfieldSurface, side_effects: [] }
  - { method: POST, path: "/airfield-surfaces/{id}/surface-actions", description: "Surface status action: RESTRICT | CLOSE | REOPEN | CLEAR per the cyclic AirfieldSurface machine; CLOSE fires the supersede/NOTAM cascade", roles: [OpsController], code: 200, input: [action, event_id], output: AirfieldSurface, side_effects: ["per §1.2 AirfieldSurface transitions incl. cascade links 1-3; increments AirfieldSurface.version by 1"] }

  - { method: POST, path: "/condition-reports", description: "File a runway field condition report; supersedes the prior FILED report for the same (event_id, surface_id)", roles: [AirfieldInspector], code: 201, input: [event_id, surface_id, contaminant_type, coverage_pct, depth_inches, observed_at, expected_surface_version], output: ConditionReport, side_effects: ["condition_code computed", "prior FILED report SUPERSEDED with superseded_by_id", "ISSUED Notams sourced from the superseded report become REISSUE_REQUIRED", "surface.current_condition_code updated", "increments AirfieldSurface.version by 1"] }
  - { method: GET, path: "/condition-reports", description: "List condition reports (FK reverse-reachability for event_id, surface_id)", roles: [OpsController, AirfieldInspector], code: 200, input: ["event_id?", "surface_id?", "status?", "limit?", "offset?"], output: "ConditionReport[]", side_effects: [] }
  - { method: GET, path: "/condition-reports/{id}", description: "Read one condition report", roles: [OpsController, AirfieldInspector], code: 200, input: [], output: ConditionReport, side_effects: [] }

  - { method: POST, path: "/friction-assessments", description: "Record a friction measurement; braking_action derived from mu thresholds; supersedes the prior REPORTED assessment for the same (event_id, surface_id)", roles: [AirfieldInspector], code: 201, input: [event_id, surface_id, mu_value, measured_at, expected_surface_version], output: FrictionAssessment, side_effects: ["braking_action computed via braking_action_from_mu", "prior REPORTED assessment SUPERSEDED with superseded_by_id", "ISSUED Notams sourced from the superseded assessment become REISSUE_REQUIRED", "increments AirfieldSurface.version by 1"] }
  - { method: GET, path: "/friction-assessments", description: "List friction assessments (FK reverse-reachability for event_id, surface_id)", roles: [OpsController, AirfieldInspector], code: 200, input: ["event_id?", "surface_id?", "status?", "limit?", "offset?"], output: "FrictionAssessment[]", side_effects: [] }
  - { method: GET, path: "/friction-assessments/{id}", description: "Read one friction assessment", roles: [OpsController, AirfieldInspector], code: 200, input: [], output: FrictionAssessment, side_effects: [] }

  - { method: POST, path: "/notams", description: "Draft a NOTAM (starts DRAFT; window validated effective_from < effective_until)", roles: [OpsController], code: 201, input: [event_id, surface_id, notam_type, effective_from, effective_until, message, "source_assessment_id?", "source_report_id?"], output: Notam, side_effects: [] }
  - { method: POST, path: "/notams/{id}/notam-actions", description: "NOTAM action: ISSUE | REISSUE | RESCIND per the Notam machine; closed-interval overlap check on ISSUE/REISSUE", roles: [OpsController], code: 200, input: [action, "effective_from?", "effective_until?"], output: Notam, side_effects: ["per §1.2 Notam transitions incl. AirfieldSurface.active_notam_count +/- 1; increments Notam.version by 1"] }
  - { method: GET, path: "/notams", description: "List NOTAMs (FK reverse-reachability for event_id, surface_id, source_assessment_id, source_report_id)", roles: [OpsController, AirlineCoordinator], code: 200, input: ["event_id?", "surface_id?", "status?", "notam_type?", "source_assessment_id?", "source_report_id?", "limit?", "offset?"], output: "Notam[]", side_effects: [] }
  - { method: GET, path: "/notams/{id}", description: "Read one NOTAM", roles: [OpsController, AirlineCoordinator], code: 200, input: [], output: Notam, side_effects: [] }

  - { method: POST, path: "/chemical-products", description: "Register a chemical product with its environmental seasonal cap", roles: [SystemAdmin], code: 201, input: [product_code, base_rate_lbs_per_1000sqft, unit_cost_cents_per_lb, seasonal_limit_lbs], output: ChemicalProduct, side_effects: [] }
  - { method: GET, path: "/chemical-products", description: "List chemical products with seasonal counters", roles: [SystemAdmin, MaintenanceLead, OpsController], code: 200, input: ["product_code?", "status?", "limit?", "offset?"], output: "ChemicalProduct[]", side_effects: [] }
  - { method: GET, path: "/chemical-products/{id}", description: "Read one chemical product (counters, status)", roles: [SystemAdmin, MaintenanceLead, OpsController], code: 200, input: [], output: ChemicalProduct, side_effects: [] }

  - { method: POST, path: "/chemical-applications", description: "Propose a chemical application; raw_quantity_lbs computed from area x base rate x temperature factor", roles: [MaintenanceLead], code: 201, input: [event_id, surface_id, product_id, pavement_temp_f], output: ChemicalApplication, side_effects: ["raw_quantity_lbs computed via chemical_application_quantity (planned_raw variant)"] }
  - { method: POST, path: "/chemical-applications/{id}/application-actions", description: "Application action: AUTHORIZE | DISPENSE | VOID; AUTHORIZE applies environmental caps and budget gate; DISPENSE enforces segregation of duties and fires the CONSTRAINED cascade", roles: [MaintenanceLead], code: 200, input: [action], output: ChemicalApplication, side_effects: ["per §1.2 ChemicalApplication transitions incl. product counter updates and cascade links 1-3; increments ChemicalApplication.version by 1"] }
  - { method: GET, path: "/chemical-applications", description: "List chemical applications (FK reverse-reachability for event_id, surface_id, product_id)", roles: [MaintenanceLead, OpsController], code: 200, input: ["event_id?", "surface_id?", "product_id?", "status?", "limit?", "offset?"], output: "ChemicalApplication[]", side_effects: [] }
  - { method: GET, path: "/chemical-applications/{id}", description: "Read one chemical application", roles: [MaintenanceLead, OpsController], code: 200, input: [], output: ChemicalApplication, side_effects: [] }

  - { method: POST, path: "/equipment-units", description: "Register snow-removal equipment (starts READY)", roles: [SystemAdmin], code: 201, input: [unit_code, unit_type, hourly_rate_cents], output: EquipmentUnit, side_effects: [] }
  - { method: POST, path: "/equipment-units/{id}/readiness-actions", description: "Readiness action: TAKE_OUT_OF_SERVICE | RETURN_TO_SERVICE (cyclic)", roles: [MaintenanceLead], code: 200, input: [action], output: EquipmentUnit, side_effects: ["increments EquipmentUnit.version by 1"] }

  - { method: POST, path: "/operator-shifts", description: "Schedule an operator shift for an event; half-open overlap check per operator_code; optional equipment must be READY", roles: [OpsController], code: 201, input: [operator_code, event_id, base_rate_cents_per_hour, start_utc, end_utc, "equipment_unit_id?"], output: OperatorShift, side_effects: ["SnowEvent.estimated_cost_cents recomputed (shift enters provisional input set)"] }
  - { method: POST, path: "/operator-shifts/{id}/shift-actions", description: "Shift action: COMPLETE (with worked_hours) | CANCEL", roles: [OpsController], code: 200, input: [action, "worked_hours?"], output: OperatorShift, side_effects: ["per §1.2 OperatorShift transitions incl. line_cost_cents and event cost recompute; increments OperatorShift.version by 1"] }
  - { method: GET, path: "/operator-shifts", description: "List operator shifts (FK reverse-reachability for event_id, equipment_unit_id)", roles: [OpsController], code: 200, input: ["operator_code?", "event_id?", "equipment_unit_id?", "status?", "limit?", "offset?"], output: "OperatorShift[]", side_effects: [] }
  - { method: GET, path: "/operator-shifts/{id}", description: "Read one operator shift", roles: [OpsController], code: 200, input: [], output: OperatorShift, side_effects: [] }

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z before any set call; the logical clock NEVER falls back to wall-clock time. observed_at / measured_at shape checks compare against this clock."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint (or for this action on an action endpoint)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, invalid enum, out-of-range value, inverted window, or observed_at / measured_at ahead of the logical clock" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "SnowEvent id (path or event_id body field) does not exist" }
  - { id: ERR_SURFACE_NOT_FOUND, http: 404, condition: "AirfieldSurface id (path or surface_id body field) does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "ConditionReport id does not exist" }
  - { id: ERR_ASSESSMENT_NOT_FOUND, http: 404, condition: "FrictionAssessment id does not exist" }
  - { id: ERR_NOTAM_NOT_FOUND, http: 404, condition: "Notam id does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "ChemicalProduct id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "ChemicalApplication id does not exist" }
  - { id: ERR_SHIFT_NOT_FOUND, http: 404, condition: "OperatorShift id does not exist" }
  - { id: ERR_EQUIPMENT_NOT_FOUND, http: 404, condition: "EquipmentUnit id (path or equipment_unit_id body field) does not exist" }
  - { id: ERR_INVALID_EVENT_STATE, http: 409, condition: "event-actions / closure-actions action not valid for the SnowEvent's current status / closure_status (incl. CLOSED terminal lockdown)" }
  - { id: ERR_EVENT_NOT_ACTIVE, http: 409, condition: "Operation requires the referenced SnowEvent to be ACTIVATED or ESCALATED" }
  - { id: ERR_INVALID_SURFACE_STATE, http: 409, condition: "surface-actions action not valid for current surface status; or Notam ISSUE while surface OPEN; or Notam RESCIND while surface not OPEN" }
  - { id: ERR_INVALID_NOTAM_STATE, http: 409, condition: "notam-actions action not valid for the Notam's current status (e.g. RESCIND from DRAFT, ISSUE from ISSUED)" }
  - { id: ERR_INVALID_APPLICATION_STATE, http: 409, condition: "application-actions action not valid for the application's current status (e.g. DISPENSE from PROPOSED, VOID from DISPENSED)" }
  - { id: ERR_INVALID_SHIFT_STATE, http: 409, condition: "shift-actions action not valid for the shift's current status (e.g. COMPLETE twice)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_surface_version does not match the AirfieldSurface's current version (OCC)" }
  - { id: ERR_UNSAFE_NOTAM_CONDITION, http: 409, condition: "SURFACE_CONDITION Notam ISSUE/REISSUE while latest REPORTED braking action is POOR or NIL" }
  - { id: ERR_REOPEN_FRICTION_TOO_LOW, http: 409, condition: "Surface REOPEN without a latest REPORTED braking action of GOOD or MEDIUM" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "DISPENSE caller X-User-ID equals authorized_by (same user may not authorize and dispense)" }
  - { id: ERR_ENV_LIMIT_EXCEEDED, http: 422, condition: "AUTHORIZE when min(event_remaining_lbs, product_available_lbs) <= 0 (environmental pools exhausted)" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "Half-open shift window overlaps another non-CANCELLED shift for the same operator_code" }
  - { id: ERR_NOTAM_WINDOW_OVERLAP, http: 409, condition: "Closed NOTAM window shares an instant (incl. touching endpoints) with an ISSUED Notam of same surface and notam_type" }
  - { id: ERR_EQUIPMENT_READINESS_SHORTFALL, http: 409, condition: "ACTIVATE with fewer than 3 READY EquipmentUnits" }
  - { id: ERR_SURFACE_NOT_CLEARED, http: 409, condition: "STAND_DOWN while any AirfieldSurface is not OPEN" }
  - { id: ERR_ACTIVE_NOTAMS_REMAIN, http: 409, condition: "CLOSE while any Notam on the event is ISSUED" }
  - { id: ERR_RUNWAYS_NOT_CLOSED, http: 409, condition: "RATIFY while any RUNWAY surface is not CLOSED" }
  - { id: ERR_AIRLINE_ACK_REQUIRED, http: 409, condition: "RATIFY before the AirlineCoordinator has acknowledged the PROPOSED closure" }
  - { id: ERR_EQUIPMENT_NOT_READY, http: 409, condition: "OperatorShift create naming an equipment unit whose readiness is OUT_OF_SERVICE" }
  - { id: ERR_BUDGET_EXCEEDED, http: 422, condition: "AUTHORIZE would push estimated_cost_cents plus this application's line cost above budget_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OpsController
    description: "Airport operations duty officer: runs the snow plan, surface status, NOTAMs, closure coordination, staffing"
    identity: opaque
    exclusive_operations:
      - "POST /snow-events, POST /snow-events/{id}/event-actions"
      - "POST /snow-events/{id}/closure-actions (PROPOSE, RATIFY)"
      - "POST /airfield-surfaces/{id}/surface-actions"
      - "POST /notams, POST /notams/{id}/notam-actions"
      - "POST /operator-shifts, POST /operator-shifts/{id}/shift-actions"
      - "GET /snow-events/{id}/cost-summary"
    shared_operations:
      - "GET /snow-events*, GET /airfield-surfaces*, GET /condition-reports*, GET /friction-assessments*, GET /notams*, GET /chemical-products*, GET /chemical-applications*, GET /operator-shifts*, GET /snow-events/{id}/dispatch-order"
  - name: AirfieldInspector
    description: "Airfield safety inspector: files condition reports and friction assessments"
    identity: opaque
    exclusive_operations:
      - "POST /condition-reports"
      - "POST /friction-assessments"
    shared_operations:
      - "GET /airfield-surfaces*, GET /condition-reports*, GET /friction-assessments*"
  - name: MaintenanceLead
    description: "Snow fleet & chemicals lead: proposes/authorizes/dispenses/voids chemical applications, manages equipment readiness; the same X-User-ID may not both AUTHORIZE and DISPENSE one application"
    identity: opaque
    exclusive_operations:
      - "POST /chemical-applications, POST /chemical-applications/{id}/application-actions"
      - "POST /equipment-units/{id}/readiness-actions"
    shared_operations:
      - "GET /airfield-surfaces*, GET /chemical-products*, GET /chemical-applications*, GET /snow-events/{id}/dispatch-order"
  - name: AirlineCoordinator
    description: "Airline station coordination liaison: acknowledges proposed airfield closures; read-only on events and NOTAMs"
    identity: opaque
    exclusive_operations:
      - "POST /snow-events/{id}/closure-actions (ACKNOWLEDGE)"
    shared_operations:
      - "GET /snow-events*, GET /notams*"
  - name: SystemAdmin
    description: "Platform administrator: registers configuration (surfaces, products, equipment) and drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /airfield-surfaces"
      - "POST /chemical-products"
      - "POST /equipment-units"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /snow-events*, GET /airfield-surfaces*, GET /chemical-products*"
