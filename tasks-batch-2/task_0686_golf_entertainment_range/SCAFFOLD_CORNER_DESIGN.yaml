              payload: { expected_bay_version: "${bv} - 1" }
              as: Guest
              as_user_id: "${mid}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: occ_correct_bay_version_on_confirm_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reservation-confirm-stale-bay]
          - entities.Bay.fields.version
        distinguishing_aspect: "Confirming with the correct expected_bay_version succeeds, sets the reservation CONFIRMED, and increments Bay.version by 1."
        test_recipe:
          setup: ["Venue+Bay+Member(wallet 50000). HOLD reservation; bay version captured at bay create (1)."]
          setup_api_calls:
