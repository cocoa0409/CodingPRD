          setup:
            - "One edition with one OPEN event, registration opened at the startup clock, then the logical clock moved to 2026-09-25T00:00:00Z, which is at once past the 2026-08-25 deadline, past the 2026-09-10 start date and past the 2026-09-20 end date."
