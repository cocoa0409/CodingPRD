            - call: "POST /robotics/maintenance-plans/${mp_id}/meter-reading"
              payload: { current_operating_hours: 2100 }
              as: ServiceManager
              as_user_id: "${svc_id}"
              captures: { after_read_hud: $.data.hours_until_due }
            - call: "POST /robotics/maintenance-plans/${mp_id}/meter-reading"
              payload: { current_operating_hours: 3999 }
