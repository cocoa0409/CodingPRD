  # ---------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (2 instances, different category pairs)
  # ---------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: open_embargo_state_error_precedes_disclosure_safety
        grounds:
          - validations[priority=14]
          - validations[priority=20]
          - errors[ERR_CYCLE_NOT_CERTIFIED]
          - errors[ERR_DISCLOSURE_NOT_APPROVED]
        distinguishing_aspect: |
          Category pair (state vs business_safety): OPEN_EMBARGO on a release
          whose cycle was never CERTIFIED and whose disclosure is still PENDING
          violates both rule 14 and rule 20; the state-category error
          ERR_CYCLE_NOT_CERTIFIED (priority 14) must win over
          ERR_DISCLOSURE_NOT_APPROVED (priority 20).
        test_recipe:
          setup:
            - "Program CES; a September cycle exists but stays SCHEDULED (never opened, never certified)"
            - "Release created for the cycle with release_at 2026-10-01T13:30:00Z; disclosure never reviewed; logical clock advanced to the embargo window"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/programs", payload: { code: "CES", name: "Current Employment Statistics", sample_budget: 3, embargo_window_minutes: 30, annual_burden_budget_minutes: 500 }, as: ProgramAdmin }
            - { call: "POST /survey/survey-cycles", payload: { program_code: "CES", reference_month: "2026-09" }, as: ProgramAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /survey/release-events", payload: { cycle_id: "${cyc}", release_at: "2026-10-01T13:30:00Z" }, as: ReleaseManager, captures: { rel: $.data.id, rv1: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T13:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /survey/release-events/${rel}/advance", payload: { action: OPEN_EMBARGO, expected_release_version: "${rv1}" }, as: ReleaseManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CYCLE_NOT_CERTIFIED (state category wins) — NOT ERR_DISCLOSURE_NOT_APPROVED (business_safety), although both conditions hold"
            - "http status == 409"

      - name: contact_timing_precedes_burden_fiscal
        grounds:
          - validations[priority=27]
          - validations[priority=51]
          - errors[ERR_CONTACT_TOO_SOON]
          - errors[ERR_BURDEN_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Category pair (business_temporal vs business_fiscal): a second
          contact recorded 1 hour after the first AND pushing burden over the
          22-minute budget violates both rule 27 and rule 51; the temporal
          error ERR_CONTACT_TOO_SOON (priority 27) must win over
          ERR_BURDEN_BUDGET_EXCEEDED (priority 51).
        test_recipe:
          setup:
            - "Program CES with annual_burden_budget_minutes 22; frame frozen; E1,E2 report in September (accepted), E3 silent -> FollowUpCase opened at close"
            - "First contact of 20 minutes recorded at 2026-09-22T09:00:00Z (burden now 20 of 22)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/programs", payload: { code: "CES", name: "Current Employment Statistics", sample_budget: 3, embargo_window_minutes: 30, annual_burden_budget_minutes: 22 }, as: ProgramAdmin, captures: { prog_v: $.data.version } }
