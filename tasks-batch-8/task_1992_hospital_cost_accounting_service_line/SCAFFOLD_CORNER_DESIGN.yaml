            - "Before post: Case.total_direct_cost == 0 (derived fields not yet reconciled)"
            - "After post: Case.total_direct_cost == 19000.00 (base 9000 + implants 10000)"

      - name: pagination_limit_max_enforced
        claim_type: pagination_with_filtering
        grounds: [response_envelope]
        distinguishing_aspect: "limit above 100 is clamped/rejected per envelope defaults; limit=1 with 2+ records returns has_more=true."
        test_recipe:
          setup: ["Two physicians exist"]
          setup_api_calls:
            - call: "POST /cost-accounting/physicians"
              payload: { npi: "1000000001", full_name: "Dr. One", specialty: "Orthopedics" }
              as: FinanceController
            - call: "POST /cost-accounting/physicians"
              payload: { npi: "1000000002", full_name: "Dr. Two", specialty: "Cardiology" }
              as: FinanceController
          trigger:
            - call: "GET /cost-accounting/physicians"
              payload: { limit: 1, offset: 0 }
              as: FinanceController
          assert:
            - "response data has exactly 1 physician, total_count == 2, has_more == true"

  # ===========================================================================
  # Section 9: Consistency model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_rollup_visible_same_request_flow
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, entities.ServiceLine.fields.contribution_margin]
        distinguishing_aspect: "Immediate model: a GET issued right after post reflects the updated rollup without delay or separate sync call."
        test_recipe:
          setup: ["ORTHO TDABC factor 1.20 setup; case C with 4 activity lines (100/120/130/80) rev 30000"]
          setup_api_calls:
            - call: "POST /cost-accounting/service-lines"
              payload: { name: "Orthopedic Surgery", code: "ORTHO", base_direct_cost: 9000.00, budgeted_volume: 120 }
              as: FinanceController
              captures: { sl: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "OR Minutes", code: "ORMINS", cost_type: "INDIRECT", cost_behavior: "VARIABLE", allocated_cost: 12000.00, capacity_measure: "MINUTES", practical_capacity_minutes: 8000 }
              as: FinanceController
              captures: { cc: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Periop", code: "PERIOP", cost_type: "OVERHEAD", cost_behavior: "FIXED", allocated_cost: 7000.00, capacity_measure: "NONE" }
              as: FinanceController
              captures: { ccp: $.data.id }
            - call: "POST /cost-accounting/physicians"
              payload: { npi: "1000000001", full_name: "Dr. One", specialty: "Orthopedics" }
              as: FinanceController
              captures: { ph: $.data.id }
            - call: "POST /cost-accounting/drgs"
              payload: { drg_code: "470", description: "Major joint", target_cost: 750.00, base_rate: 30000.00 }
              as: FinanceController
              captures: { dg: $.data.id }
            - call: "POST /cost-accounting/cost-models"
              payload: { name: "M", service_line_id: "${sl}", allocation_basis: "TDABC", rate_factor: 1.20, overhead_cost_center_id: "${ccp}", effective_period: "2026-01" }
              as: CostAnalyst
              captures: { m: $.data.id }
            - call: "POST /cost-accounting/cost-models/${m}/approve"
              payload: {}
              as: FinanceController
              captures: { m_v: $.data.version }
            - call: "POST /cost-accounting/cases"
              payload: { service_line_id: "${sl}", physician_id: "${ph}", drg_id: "${dg}", cost_model_id: "${m}", period: "2026-08", expected_reimbursement: 30000.00 }
              as: CostAnalyst
              captures: { c: $.data.id }
            - call: "POST /cost-accounting/cases/${c}/activity-lines"
              payload: { cost_center_id: "${cc}", quantity: 100 }
              as: CostAnalyst
            - call: "POST /cost-accounting/cases/${c}/activity-lines"
              payload: { cost_center_id: "${cc}", quantity: 120 }
              as: CostAnalyst
            - call: "POST /cost-accounting/cases/${c}/activity-lines"
              payload: { cost_center_id: "${cc}", quantity: 130 }
              as: CostAnalyst
            - call: "POST /cost-accounting/cases/${c}/activity-lines"
              payload: { cost_center_id: "${cc}", quantity: 80 }
              as: CostAnalyst
          trigger:
            - call: "POST /cost-accounting/cases/${c}/post"
              payload: { expected_model_version: "${m_v}" }
              as: CostAnalyst
            - call: "GET /cost-accounting/service-lines/${sl}"
              payload: {}
              as: FinanceController
          assert:
            - "ServiceLine.total_direct_cost == 9774.00 and total_revenue == 30000.00 immediately (contribution_margin == 20226.00)"

