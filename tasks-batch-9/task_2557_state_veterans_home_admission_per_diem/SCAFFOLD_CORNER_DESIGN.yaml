      - name: calc_survey_immediate_jeopardy_overrides_numeric_band
        claim_type: constants_applied
        grounds:
          - calculations.survey_compliance_score
          - state_machines.CareUnit.CERTIFIED_to_DECERTIFIED
          - entities.CareUnit.fields.last_survey_compliance_score
        distinguishing_aspect: |
          The IMMEDIATE_JEOPARDY override is not a numeric artefact: a single ISOLATED x
          IMMEDIATE_JEOPARDY deficiency scores only 20, which is BELOW the decertify threshold 25
          and inside the CONDITIONAL band, yet the unit must land in DECERTIFIED/FROZEN - while a
          sibling unit scoring 11 from three lesser deficiencies lands in CONDITIONAL/RESTRICTED.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome with two CERTIFIED NURSING units (A and B), no residents, no claims."
            - "The logical clock stands at 2026-08-01T00:00:00Z so a survey_date of 2026-08-01 is not in the future."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Ironwood State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01" }
              as: StateProgramAdmin
              captures: { home_id: "$.data.id" }
            - call: "POST /svh/veterans-homes/${home_id}/care-units"
              payload: { unit_name: "Nursing A", care_level: "NURSING", licensed_bed_count: 4, out_of_service_bed_count: 0 }
              as: StateProgramAdmin
              captures: { ua_id: "$.data.id" }
            - call: "POST /svh/veterans-homes/${home_id}/care-units"
              payload: { unit_name: "Nursing B", care_level: "NURSING", licensed_bed_count: 4, out_of_service_bed_count: 0 }
              as: StateProgramAdmin
              captures: { ub_id: "$.data.id" }
          trigger:
            - call: "POST /svh/care-units/${ub_id}/survey-result"
              payload: { survey_date: "2026-08-01", deficiencies: [{ scope: "PATTERN", severity: "MINIMAL_HARM" }, { scope: "ISOLATED", severity: "MINIMAL" }, { scope: "WIDESPREAD", severity: "MINIMAL" }] }
              as: SurveyAgency
              captures: { b_score: "$.data.last_survey_compliance_score", b_cert: "$.data.certification_status", b_post: "$.data.operational_posture" }
            - call: "POST /svh/care-units/${ua_id}/survey-result"
              payload: { survey_date: "2026-08-01", deficiencies: [{ scope: "ISOLATED", severity: "IMMEDIATE_JEOPARDY" }] }
              as: SurveyAgency
              captures: { a_score: "$.data.last_survey_compliance_score", a_cert: "$.data.certification_status", a_post: "$.data.operational_posture" }
            - call: "GET /svh/veterans-homes/${home_id}"
              payload: {}
              as: StateProgramAdmin
              captures: { home_rec: "$.data.recognition_status", home_reason: "$.data.recognition_suspended_reason", home_decert: "$.data.decertified_unit_count", home_survey_date: "$.data.last_survey_date" }
          assert:
            - "b_score == 11"
            - "b_cert == CONDITIONAL"
            - "b_post == RESTRICTED"
            - "a_score == 20"
            - "a_cert == DECERTIFIED"
            - "a_post == FROZEN"
            - "home_rec == SUSPENDED"
            - "home_reason == UNIT_DECERTIFIED"
            - "home_decert == 1"
            - "home_survey_date == 2026-08-01"

