      - name: session_cancel_cascade_reaches_the_transport_run_counters
        grounds:
          - state_machines.ProgramSession.OPEN_to_CANCELLED
          - state_machines.Enrollment.CONFIRMED_to_WITHDRAWN
          - state_machines.TransportBooking.CONFIRMED_to_CANCELLED
          - state_machines.TransportRun.BOARDING_FULL_to_PLANNED
          - entities.TransportRun.fields.accessible_available
