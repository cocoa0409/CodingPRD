      - { name: member_id, type: string, source: system, description: "FK -> Member.id; owner of the subscription" }
      - { name: plan_id, type: string, source: system, description: "FK -> MembershipPlan.id; current plan" }
      - { name: status, type: enum, source: system, description: "Billing state", default: ACTIVE, constraints: "ACTIVE | FROZEN | CANCELLED" }
      - { name: court_credits_remaining, type: integer, source: computed, description: "Court credits left in the current period; never negative" }
      - { name: estimated_period_fee_cents, type: integer, source: computed, description: "Forward-looking projection of the current period fee assuming no freeze (equals plan.monthly_fee_cents at period open)" }
      - { name: freeze_count, type: integer, source: system, description: "Number of freezes performed over the subscription lifetime", default: 0 }
      - { name: current_period_start, type: datetime, source: system, description: "ISO 8601 UTC start of the current billing period" }
      - { name: current_period_end, type: datetime, source: system, description: "ISO 8601 UTC end (exclusive) of the current billing period; period length is 30 days" }
      - { name: frozen_at, type: datetime, source: system, description: "ISO 8601 UTC instant the subscription entered FROZEN this period; null when never frozen this period" }

  - name: Reservation
