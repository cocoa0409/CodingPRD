            - "Before the trigger: RouteStop.${stop_v1}.allocated_sqft_used == 8814 and power_amps_used == 573.0; all three rides are ASSIGNED-free, i.e. Ride.status == AVAILABLE while the allocations are only RESERVED"
            - "After the trigger: RouteStop.${stop_v1}.status == DARK"
            - "After the trigger: RideAllocation.${alloc_v1a}.status == RELEASED, ${alloc_v1b}.status == RELEASED, ${alloc_v1c}.status == RELEASED, each with released_at == 2026-08-01T00:00:00Z"
            - "LEDGER RESTORED: RouteStop.${stop_v1}.allocated_sqft_used == 0 and RouteStop.${stop_v1}.power_amps_used == 0.0"
            - "LEDGER RESTORED: the value is exactly 0, not 8814 - 6918 == 1896, so the reversal used the charged figures"
            - "Ride.${ride_v1a}.status == AVAILABLE, Ride.${ride_v1b}.status == AVAILABLE, Ride.${ride_v1c}.status == AVAILABLE"
            - "Route.${route_v1}.stop_count == 0, Route.${route_v1}.closed_stop_count == 1 and Route.${route_v1}.status == DRAFT"

      - name: crew_cancel_and_rebook_restores_the_labor_ledger_without_drift
        grounds:
          - state_machines.CrewAssignment.SCHEDULED_to_RELEASED
          - calculations.stop_labor_cost
          - entities.RouteStop.fields.labor_cost_provisional_cents
          - entities.Worker.fields.scheduled_hours_total
        distinguishing_aspect: |
          The conserved quantities are the LABOR ledgers and the compensation is exercised as a full round trip on one
          child rather than a parent-driven sweep: 44638 -> 20694 -> 44638 and 11.25 -> 0.0 -> 11.25. Because the two
          assignments round to different cents (23944 and 20694), a re-aggregation that summed unrounded products on
          the rebook would come back as 44637 instead of 44638, so the round trip detects drift that a single cancel
          cannot.
        test_recipe:
          setup:
            - "Jurisdiction OH with max_consecutive_work_days 6; Venue V1; Route R1 DRAFT with one PLANNED stop A."
            - "Worker A (PERMANENT, 1833 cents/hour) holds a SETUP shift 2026-09-01T06:00:00Z..17:15:00Z costing 23944; Worker B (SEASONAL_DOMESTIC, 1750 cents/hour) holds a TEARDOWN shift 2026-09-07T18:00:00Z..2026-09-08T04:30:00Z costing 20694."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, amusement_tax_pct: 6.5, permit_fee_cents: 50000, max_consecutive_work_days: 6 }
              as: PlatformAdmin
              captures: { jur_v2: $.data.id }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_v2}", name: "Franklin County Fairgrounds", city: "Columbus", lot_area_sqft: 100000, power_amps_available: 1200, expected_attendance: 20001, lot_surface: "GRAVEL", housing_pads_available: 4 }
              as: PlatformAdmin
              captures: { venue_v2c: $.data.id }
            - call: "POST /workers"
              payload: { full_name: "Dale Rigger", employment_type: "PERMANENT", hourly_rate_cents: 1833, certified_ride_classes: ["MAJOR", "FLAT"], housing_required: false }
              as: PlatformAdmin
              captures: { worker_v2a: $.data.id }
            - call: "POST /workers"
              payload: { full_name: "Marta Setzer", employment_type: "SEASONAL_DOMESTIC", hourly_rate_cents: 1750, certified_ride_classes: ["FLAT", "KIDDIE"], housing_required: false }
              as: PlatformAdmin
              captures: { worker_v2b: $.data.id }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_v2: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_v2}", venue_id: "${venue_v2c}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z" }
              as: RouteManager
              captures: { stop_v2: $.data.id }
            - call: "POST /crew-assignments"
              payload: { route_stop_id: "${stop_v2}", worker_id: "${worker_v2a}", crew_role: "SETUP", shift_start: "2026-09-01T06:00:00Z", shift_end: "2026-09-01T17:15:00Z" }
              as: LotBoss
              captures: { asg_v2a: $.data.id }
            - call: "POST /crew-assignments"
              payload: { route_stop_id: "${stop_v2}", worker_id: "${worker_v2b}", crew_role: "TEARDOWN", shift_start: "2026-09-07T18:00:00Z", shift_end: "2026-09-08T04:30:00Z" }
              as: LotBoss
              captures: { asg_v2b: $.data.id }
          trigger:
            - call: "POST /crew-assignments/${asg_v2a}/cancel"
              payload: {}
              as: LotBoss
            - call: "POST /crew-assignments"
              payload: { route_stop_id: "${stop_v2}", worker_id: "${worker_v2a}", crew_role: "SETUP", shift_start: "2026-09-01T06:00:00Z", shift_end: "2026-09-01T17:15:00Z" }
              as: LotBoss
              captures: { asg_v2c: $.data.id }
          assert:
            - "Before the trigger: RouteStop.${stop_v2}.labor_cost_provisional_cents == 44638, Worker.${worker_v2a}.scheduled_hours_total == 11.25, Worker.${worker_v2b}.scheduled_hours_total == 10.5"
            - "After trigger call 1: CrewAssignment.${asg_v2a}.status == RELEASED"
            - "COMPENSATED: RouteStop.${stop_v2}.labor_cost_provisional_cents == 20694 (exactly the surviving assignment's cost) and Worker.${worker_v2a}.scheduled_hours_total == 0.0"
            - "COMPENSATED: Worker.${worker_v2b}.scheduled_hours_total is still 10.5 — the cancel touched only the released worker's ledger"
            - "After trigger call 2: CrewAssignment.${asg_v2c}.cost_cents == 23944 and shift_hours == 11.25 (a fresh row; the RELEASED row is not revived)"
            - "NO DRIFT: RouteStop.${stop_v2}.labor_cost_provisional_cents == 44638 again, not 44637"
            - "NO DRIFT: Worker.${worker_v2a}.scheduled_hours_total == 11.25 again"
            - "GET /route-stops/${stop_v2}/crew-assignments returns 3 rows of which exactly 1 is RELEASED"

      - name: stop_cancel_reverses_the_route_guarantee_ledger_and_expires_permits
        grounds:
          - state_machines.RouteStop.CONFIRMED_to_DARK
          - state_machines.Contract.EXECUTED_to_TERMINATED
          - state_machines.PermitApplication.SUBMITTED_to_EXPIRED
          - entities.Route.fields.total_guaranteed_cents
          - entities.Route.fields.closed_stop_count
        distinguishing_aspect: |
          The conserved quantity is the ROUTE GUARANTEE ledger, and the compensation is CONDITIONAL on the contract's
          branch: because the contract is EXECUTED it routes to TERMINATED and Route.total_guaranteed_cents must fall
          900000 -> 0, whereas the sibling VOID branch (an unexecuted deal) leaves the ledger untouched because the
          guarantee was never added. The same cancel also expires the SUBMITTED permit and bumps closed_stop_count
          without moving the already-COMMITTED Route out of COMMITTED.
        test_recipe:
          setup:
            - "Jurisdiction OH; Venue V1; Route R1 sequenced then COMMITTED with one stop."
            - "Contract C1 EXECUTED with guarantee_cents 900000, so Route.total_guaranteed_cents is 900000 and the stop is CONFIRMED."
            - "One EVENT PermitApplication on that stop is SUBMITTED and undecided."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_v3: $.data.id }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_v3}", name: "Franklin County Fairgrounds", city: "Columbus", lot_area_sqft: 100000, power_amps_available: 1200, expected_attendance: 20001, lot_surface: "GRAVEL" }
              as: PlatformAdmin
              captures: { venue_v3c: $.data.id }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_v3: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_v3}", venue_id: "${venue_v3c}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z" }
              as: RouteManager
              captures: { stop_v3: $.data.id }
            - call: "POST /permit-applications"
              payload: { route_stop_id: "${stop_v3}", permit_type: "EVENT", valid_from: "2026-09-04T00:00:00Z", valid_until: "2026-09-08T00:00:00Z" }
              as: ComplianceClerk
              captures: { permit_v3: $.data.id }
            - call: "POST /permit-applications/${permit_v3}/submit"
              payload: {}
              as: ComplianceClerk
            - call: "POST /routes/${route_v3}/sequence"
              payload: {}
              as: RouteManager
            - call: "POST /contracts"
              payload: { route_stop_id: "${stop_v3}", counterparty_name: "Franklin County Agricultural Society", revenue_split_pct_operator: 65, guarantee_cents: 900000, ride_minimum_count: 0, exclusivity: "RIDES", settlement_basis: "GREATER_OF" }
              as: ContractNegotiator
              captures: { contract_v3: $.data.id }
            - call: "POST /contracts/${contract_v3}/send"
              payload: {}
              as: ContractNegotiator
              as_user_id: "user-negotiator-1"
            - call: "POST /routes/${route_v3}/commit"
              payload: {}
              as: RouteManager
            - call: "POST /contracts/${contract_v3}/execute"
              payload: {}
              as: GeneralManager
              as_user_id: "user-gm-1"
          trigger:
            - call: "POST /route-stops/${stop_v3}/cancel"
              payload: {}
              as: GeneralManager
          assert:
            - "Before the trigger: Route.${route_v3}.total_guaranteed_cents == 900000, Route.${route_v3}.stop_count == 1, closed_stop_count == 0, RouteStop.${stop_v3}.status == CONFIRMED, Contract.${contract_v3}.status == EXECUTED"
            - "After the trigger: RouteStop.${stop_v3}.status == DARK"
            - "CONDITIONAL BRANCH: Contract.${contract_v3}.status == TERMINATED (not VOID, because the deal had been executed)"
            - "LEDGER RESTORED: Route.${route_v3}.total_guaranteed_cents == 0"
            - "After the trigger: PermitApplication.${permit_v3}.status == EXPIRED"
            - "After the trigger: Route.${route_v3}.stop_count == 0 and Route.${route_v3}.closed_stop_count == 1"
            - "After the trigger: Route.${route_v3}.status == COMMITTED (the SEQUENCED -> DRAFT invalidation applies only to a route still in SEQUENCED)"
            - "Contract.${contract_v3}.guarantee_cents is still 900000: the ledger was compensated, the negotiated term was not rewritten"
