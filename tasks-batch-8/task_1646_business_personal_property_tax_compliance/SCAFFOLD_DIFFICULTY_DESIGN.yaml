  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: abatement_closed_year_interval_overlap
        grounds:
          - validations[priority=22]
          - entities.AbatementAgreement.fields.first_tax_year
          - errors[ERR_ABATEMENT_OVERLAP]
        distinguishing_aspect: |
          CLOSED (inclusive) year-interval semantics on the AbatementAgreement
          resource: an existing agreement [2027, 2031] conflicts with a new
          one whose first_tax_year == 2031 (shared endpoint year IS an
          intersection), while first_tax_year == 2032 is accepted — adjacency
          is allowed only strictly outside the inclusive end year.
        test_recipe:
          setup:
            - "Client C with asset AA in jurisdiction JY; existing abatement [2027, 2031] in ACTIVE"
          setup_api_calls:
            - call: "POST /bpp/clients"
              payload: { legal_name: "AbatCo", contact_email: "ab@x.com" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /bpp/operators"
              payload: { display_name: "Ann Analyst", operator_role: "TAX_ANALYST" }
              as: FirmAdmin
              captures: { op_an: $.data.id }
            - call: "POST /bpp/jurisdictions"
              payload: { county_name: "Abat County", state_code: "TX", base_deadline_mmdd: "04-15", max_extension_days: 30, late_penalty_pct_per_month: 2, max_late_penalty_pct: 10, penalty_base: "VALUE_BASE", tax_rate: 0.02, offered_exemption_types: ["FREEPORT"], max_exemption_pct: 50 }
              as: FirmAdmin
              captures: { j_y: $.data.id }
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_y}", asset_tag: "AA", category: "MACHINERY", acquisition_cost_cents: 800000, acquisition_date: "2026-01-05", in_service_date: "2026-01-10" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { a_a: $.data.id }
            - call: "POST /bpp/assets/${a_a}/abatements"
              payload: { first_tax_year: 2027, last_tax_year: 2031, abatement_pct: 50 }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { ab_1: $.data.id }
          trigger:
            - call: "POST /bpp/assets/${a_a}/abatements"
              payload: { first_tax_year: 2031, last_tax_year: 2035, abatement_pct: 25 }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { err: $.data.error_id }
            - call: "POST /bpp/assets/${a_a}/abatements"
              payload: { first_tax_year: 2032, last_tax_year: 2036, abatement_pct: 25 }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { ab_2: $.data.id }
          assert:
            - "First trigger: err == ERR_ABATEMENT_OVERLAP and HTTP status == 409 (shared year 2031 intersects the closed interval)"
            - "Second trigger: 201 created; AbatementAgreement.${ab_2}.agreement_status == ACTIVE (adjacent interval starting after the inclusive end is legal)"
            - "GET /bpp/assets/${a_a}/abatements returns 2 agreements"

      - name: exemption_half_open_date_interval_overlap
        grounds:
          - validations[priority=23]
          - entities.ExemptionApplication.fields.effective_date
          - errors[ERR_EXEMPTION_PERIOD_OVERLAP]
        distinguishing_aspect: |
          HALF-OPEN date-interval semantics on the ExemptionApplication
          resource — geometrically different from the closed year intervals of
          the abatement instance: an existing SUBMITTED certificate
          [2026-01-01, 2028-01-01) does NOT conflict with a new one effective
          exactly 2028-01-01 (touching endpoints are disjoint under half-open
          semantics), while effective 2027-12-31 intersects and is rejected.
        test_recipe:
          setup:
            - "Jurisdiction JZ (offers FREEPORT, max_exemption_pct 50); client C with asset AE"
            - "Existing FREEPORT application [2026-01-01, 2028-01-01) in SUBMITTED status"
          setup_api_calls:
            - call: "POST /bpp/clients"
              payload: { legal_name: "HalfCo", contact_email: "half@x.com" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /bpp/operators"
              payload: { display_name: "Ann Analyst", operator_role: "TAX_ANALYST" }
              as: FirmAdmin
              captures: { op_an: $.data.id }
            - call: "POST /bpp/jurisdictions"
              payload: { county_name: "Half County", state_code: "TX", base_deadline_mmdd: "04-15", max_extension_days: 30, late_penalty_pct_per_month: 2, max_late_penalty_pct: 10, penalty_base: "VALUE_BASE", tax_rate: 0.02, offered_exemption_types: ["FREEPORT"], max_exemption_pct: 50 }
              as: FirmAdmin
              captures: { j_z: $.data.id }
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_z}", asset_tag: "AE", category: "MACHINERY", acquisition_cost_cents: 800000, acquisition_date: "2025-01-05", in_service_date: "2025-01-10" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { a_e: $.data.id }
            - call: "POST /bpp/assets/${a_e}/exemption-applications"
              payload: { exemption_type: "FREEPORT", exemption_pct: 30, effective_date: "2026-01-01", expiration_date: "2028-01-01" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { x_1: $.data.id }
            - call: "POST /bpp/exemption-applications/${x_1}/submit"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
          trigger:
            - call: "POST /bpp/assets/${a_e}/exemption-applications"
              payload: { exemption_type: "FREEPORT", exemption_pct: 20, effective_date: "2028-01-01", expiration_date: "2029-01-01" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { x_2: $.data.id }
            - call: "POST /bpp/assets/${a_e}/exemption-applications"
              payload: { exemption_type: "FREEPORT", exemption_pct: 20, effective_date: "2027-12-31", expiration_date: "2028-12-31" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { err: $.data.error_id }
          assert:
            - "First trigger: 201 created (effective_date == prior expiration_date is disjoint under half-open semantics); ExemptionApplication.${x_2}.application_status == DRAFT"
            - "Second trigger: err == ERR_EXEMPTION_PERIOD_OVERLAP and HTTP status == 409 (2027-12-31 lies inside [2026-01-01, 2028-01-01))"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: dispose_reverse_conserves_rendition_total
        grounds:
          - state_machines.Asset.ACTIVE_to_DISPOSED
          - state_machines.Asset.DISPOSED_to_ACTIVE
          - calculations.rendition_total_aggregation
        distinguishing_aspect: |
          Conserved quantity: Rendition.total_assessed_value_cents ==
          sum(included lines). Forward action (dispose H1: 950000 -> 350000)
          paired with its compensating action (reverse: back to exactly 950000)
          leaves the rendition identical — no drift in the assessed total,
          inclusion flags, or exclusion reasons.
        test_recipe:
          setup:
            - "Jurisdiction JR2 (FULL_YEAR [80,70,60], de_minimis 0); client C with classified assets H1 cost 1000000 acq 2025-03-10 (600000) and H2 cost 500000 acq 2026-01-20 (350000)"
            - "Rendition 2027 DRAFT with generated lines; total 950000"
          setup_api_calls:
            - call: "POST /bpp/clients"
              payload: { legal_name: "InvCo", contact_email: "inv@x.com" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /bpp/operators"
              payload: { display_name: "Ann Analyst", operator_role: "TAX_ANALYST" }
              as: FirmAdmin
              captures: { op_an: $.data.id }
            - call: "POST /bpp/jurisdictions"
              payload: { county_name: "Inv County", state_code: "TX", base_deadline_mmdd: "04-15", max_extension_days: 30, late_penalty_pct_per_month: 2, max_late_penalty_pct: 10, penalty_base: "VALUE_BASE", tax_rate: 0.02, offered_exemption_types: ["FREEPORT"], max_exemption_pct: 50 }
              as: FirmAdmin
              captures: { j_r2: $.data.id }
            - call: "POST /bpp/class-rules"
              payload: { jurisdiction_id: "${j_r2}", category: "MACHINERY", is_taxable: true, depreciation_convention: "FULL_YEAR", percent_good_vector: [80, 70, 60], percent_good_floor_pct: 30, de_minimis_line_cents: 0 }
              as: FirmAdmin
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_r2}", asset_tag: "H1", category: "MACHINERY", acquisition_cost_cents: 1000000, acquisition_date: "2025-03-10", in_service_date: "2025-04-01" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { a_h1: $.data.id }
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_r2}", asset_tag: "H2", category: "MACHINERY", acquisition_cost_cents: 500000, acquisition_date: "2026-01-20", in_service_date: "2026-02-01" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { a_h2: $.data.id }
            - call: "POST /bpp/assets/${a_h1}/classify"
              payload: { taxable_classification: "TAXABLE" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/assets/${a_h2}/classify"
              payload: { taxable_classification: "TAXABLE" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/renditions"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_r2}", tax_year: 2027 }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { r_i: $.data.id }
            - call: "POST /bpp/renditions/${r_i}/generate-lines"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { tot_before: $.data.total_assessed_value_cents }
            - call: "POST /bpp/assets/${a_h1}/disposals"
              payload: { disposal_date: "2026-06-01", disposal_proceeds_cents: 10000 }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { d_h1: $.data.id }
            - call: "GET /bpp/renditions/${r_i}"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { tot_mid: $.data.total_assessed_value_cents }
          trigger:
            - call: "POST /bpp/disposals/${d_h1}/reverse"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
          assert:
            - "tot_before == 950000 and tot_mid == 350000"
            - "After reverse: Rendition.${r_i}.total_assessed_value_cents == 950000 == tot_before (conserved)"
            - "Rendition.${r_i} line for ${a_h1}: included == true and exclusion_reason == null and assessed_value_cents == 600000"
            - "Asset.${a_h1}.lifecycle_status == ACTIVE and disposed_date == null"
            - "DisposalRecord.${d_h1}.disposal_status == REVERSED"

      - name: schedule_cancel_conserves_bill_allocation
        grounds:
          - calculations.installment_split
          - state_machines.TaxBill
          - entities.TaxBill.fields.unscheduled_amount_cents
        distinguishing_aspect: |
          Conserved quantity (a different quantity than the rendition assessed
          total): TaxBill.validated_amount_cents == sum(non-CANCELLED
          installment amounts) + unscheduled_amount_cents. Forward action
          (payment-schedule with count 3 on 20000 -> [6668, 6666, 6666],
          unscheduled 0) paired with its compensating action (schedule cancel)
          restores unscheduled 20000 and payment_status UNSCHEDULED.
        test_recipe:
          setup:
            - "Jurisdiction JL (bill rate 0.025, FULL_YEAR [100,100], de_minimis 0); client C with classified asset cost 800000 acq 2026-01-05"
            - "Rendition 2027 FILED; notice 800000 ACCEPTED; bill billed 20000 VALIDATED MATCHED (validated_amount_cents 20000, unscheduled 20000)"
