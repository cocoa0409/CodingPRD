scaffold_corner_design:

  - section: entities
    instances:

      - name: corner_client_creation_returns_intake_status_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Client.fields.status
          - entities.Client.fields.capacity_determination
          - endpoints[POST /dmm/clients]
        distinguishing_aspect: "A newly created Client is HTTP 201 with status INTAKE, capacity_determination NOT_DETERMINED, version 1, and null activated_on and closed_on."
        test_recipe:
          setup:
            - "empty database, logical clock left at its default"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
          trigger:
            - call: "POST /dmm/clients"
              payload: { full_name: "Rosa Mendel", date_of_birth: "1941-03-08", intake_reference: "INT-C001" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { cl_id: $.data.id }
          assert:
            - "the response is HTTP 201"
            - "Client.${cl_id}.status == INTAKE"
            - "Client.${cl_id}.capacity_determination == NOT_DETERMINED"
            - "Client.${cl_id}.capacity_determined_on == null"
            - "Client.${cl_id}.activated_on == null"
            - "Client.${cl_id}.version == 1"

      - name: corner_client_get_with_unknown_uuid_returns_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=3]
          - errors[ERR_CLIENT_NOT_FOUND]
        distinguishing_aspect: "A GET against a well-formed but unused UUID returns ERR_CLIENT_NOT_FOUND with HTTP 404, distinguishing the Client-specific code from the generic ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
          trigger:
            - call: "GET /dmm/clients/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response is HTTP 404 with error_id ERR_CLIENT_NOT_FOUND"

      - name: corner_payment_missing_required_amount_cents_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=4]
          - errors[ERR_VALIDATION]
          - endpoints[POST /dmm/payments]
        distinguishing_aspect: "Omitting amount_cents, a required input with no default, returns ERR_VALIDATION at HTTP 422 before any gate or fiscal rung is evaluated."
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T09:00:00Z, one IN_FORCE bond, one ACTIVE client with an ACTIVE FULL_AGENCY authorization, one account, one payee and one 2026-06 budget line"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dmm/surety-bonds"
              payload: { carrier_name: "Atlas Surety", bond_number: "SB-2026-001", coverage_cents: 100000000, effective_date: "2026-01-01", expiry_date: "2026-12-31" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dmm/clients"
              payload: { full_name: "Rosa Mendel", date_of_birth: "1941-03-08", intake_reference: "INT-C003" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { cl_id: $.data.id }
            - call: "POST /dmm/clients/${cl_id}/capacity-determination"
              payload: { determination: "RETAINS_CAPACITY", determined_on: "2026-05-15" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/clients/${cl_id}/status-change"
              payload: { to_status: "ACTIVE" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/authorizations"
              payload: { client_id: "${cl_id}", scope_tier: "FULL_AGENCY", instrument_reference: "AGR-C003", effective_date: "2026-01-01", expiry_date: "2026-12-31" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { auth_id: $.data.id }
            - call: "POST /dmm/authorizations/${auth_id}/status"
              payload: { to_status: "ACTIVE" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/accounts"
              payload: { client_id: "${cl_id}", institution_name: "First Community Bank", account_label: "Operating", account_type: "CHECKING", opening_balance_cents: 5000000 }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { acct_id: $.data.id }
            - call: "POST /dmm/payees"
              payload: { client_id: "${cl_id}", payee_name: "City Power", payee_type: "RECURRING_BILLER", remittance_reference: "ACC-77" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { payee_id: $.data.id }
            - call: "POST /dmm/budget-categories"
              payload: { client_id: "${cl_id}", category_name: "UTILITIES", budget_month: "2026-06", allocation_cents: 300000 }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { cat_id: $.data.id }
            - call: "GET /dmm/accounts/${acct_id}"
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /dmm/payments"
              payload: { account_id: "${acct_id}", payee_id: "${payee_id}", authorization_id: "${auth_id}", budget_category_id: "${cat_id}", channel: "ACH", expected_account_version: "${acct_v}" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response is HTTP 422 with error_id ERR_VALIDATION"
            - "no Payment row exists for account ${acct_id}"

      - name: corner_payee_type_invalid_enum_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_ENUM]
          - entities.Payee.fields.payee_type
        distinguishing_aspect: "payee_type is on the closed enum list at priority 5, so a value outside RECURRING_BILLER, ESSENTIAL and DISCRETIONARY returns ERR_INVALID_ENUM, not ERR_VALIDATION."
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T09:00:00Z and one client on file"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dmm/clients"
              payload: { full_name: "Rosa Mendel", date_of_birth: "1941-03-08", intake_reference: "INT-C004" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /dmm/payees"
              payload: { client_id: "${cl_id}", payee_name: "City Power", payee_type: "UTILITY_VENDOR", remittance_reference: "ACC-77" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response is HTTP 422 with error_id ERR_INVALID_ENUM"

      - name: corner_payment_duplicate_override_defaults_to_false
        claim_type: Defaults
        grounds:
          - entities.Payment.fields.duplicate_override
          - validations[priority=19]
        distinguishing_aspect: "Omitting duplicate_override leaves it false, so the priority-19 buffer rule still applies; the field is not implicitly enabled."
        excluded_because:
          difficulty_instance: duplicate_payment_buffer_is_symmetric_and_inclusive_at_three_days
          rationale: "That instance omits duplicate_override on both creates and still gets ERR_DUPLICATE_PAYMENT_WINDOW, which is exactly the default-false assertion."

      - name: corner_ledger_entry_is_immutable_with_no_version_field
        claim_type: Immutability
        grounds:
          - entities.LedgerEntry
          - endpoints[GET /dmm/ledger-entries/{id}]
        distinguishing_aspect: "LedgerEntry declares common_fields false, so a read exposes id and created_at but no version and no updated_at, and §1.5 declares no endpoint that mutates one."
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T09:00:00Z, one ACTIVE client with one account, and one DEPOSIT adjustment of 250000 cents"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dmm/surety-bonds"
              payload: { carrier_name: "Atlas Surety", bond_number: "SB-2026-001", coverage_cents: 100000000, effective_date: "2026-01-01", expiry_date: "2026-12-31" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dmm/clients"
              payload: { full_name: "Rosa Mendel", date_of_birth: "1941-03-08", intake_reference: "INT-C006" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { cl_id: $.data.id }
            - call: "POST /dmm/clients/${cl_id}/capacity-determination"
              payload: { determination: "RETAINS_CAPACITY", determined_on: "2026-05-15" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/clients/${cl_id}/status-change"
              payload: { to_status: "ACTIVE" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/accounts"
              payload: { client_id: "${cl_id}", institution_name: "First Community Bank", account_label: "Operating", account_type: "CHECKING", opening_balance_cents: 5000000 }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { acct_id: $.data.id }
            - call: "POST /dmm/accounts/${acct_id}/adjustments"
              payload: { adjustment_type: "DEPOSIT", amount_cents: 250000, value_date: "2026-06-01", memo: "Social Security direct deposit." }
              as: BillPaySpecialist
              as_user_id: "u-spec"
          trigger:
            - call: "GET /dmm/ledger-entries"
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { entry_id: "$.data[0].id" }
          assert:
            - "exactly 1 LedgerEntry exists with entry_type DEPOSIT and amount_cents 250000"
            - "LedgerEntry.${entry_id} exposes id and created_at and carries no version field"
            - "LedgerEntry.${entry_id}.frozen == false"
            - "ClientAccount.${acct_id}.cleared_balance_cents == 5250000"
            - "ClientAccount.${acct_id}.available_balance_cents == 5250000"

      - name: corner_payments_list_pagination_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /dmm/payments]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /dmm/payments with limit 1 returns one row plus total_count 2 and has_more true, and offset 1 returns the second row with has_more false."
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T09:00:00Z, one IN_FORCE bond, one ACTIVE client with an account, two payees, a 2026-06 UTILITIES line of 300000 cents"
            - "two SCHEDULED ACH payments of 50000 and 60000 cents to the two different payees"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dmm/surety-bonds"
              payload: { carrier_name: "Atlas Surety", bond_number: "SB-2026-001", coverage_cents: 100000000, effective_date: "2026-01-01", expiry_date: "2026-12-31" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dmm/clients"
              payload: { full_name: "Rosa Mendel", date_of_birth: "1941-03-08", intake_reference: "INT-C007" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { cl_id: $.data.id }
            - call: "POST /dmm/clients/${cl_id}/capacity-determination"
              payload: { determination: "RETAINS_CAPACITY", determined_on: "2026-05-15" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/clients/${cl_id}/status-change"
              payload: { to_status: "ACTIVE" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/authorizations"
              payload: { client_id: "${cl_id}", scope_tier: "FULL_AGENCY", instrument_reference: "AGR-C007", effective_date: "2026-01-01", expiry_date: "2026-12-31" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { auth_id: $.data.id }
            - call: "POST /dmm/authorizations/${auth_id}/status"
              payload: { to_status: "ACTIVE" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/accounts"
              payload: { client_id: "${cl_id}", institution_name: "First Community Bank", account_label: "Operating", account_type: "CHECKING", opening_balance_cents: 5000000 }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { acct_id: $.data.id }
            - call: "POST /dmm/payees"
              payload: { client_id: "${cl_id}", payee_name: "City Power", payee_type: "RECURRING_BILLER", remittance_reference: "ACC-77" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { payee_1: $.data.id }
            - call: "POST /dmm/payees"
              payload: { client_id: "${cl_id}", payee_name: "Northside Gas", payee_type: "RECURRING_BILLER", remittance_reference: "NG-31" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { payee_2: $.data.id }
            - call: "POST /dmm/budget-categories"
              payload: { client_id: "${cl_id}", category_name: "UTILITIES", budget_month: "2026-06", allocation_cents: 300000 }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { cat_id: $.data.id }
            - call: "GET /dmm/accounts/${acct_id}"
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { acct_v1: $.data.version }
            - call: "POST /dmm/payments"
              payload: { account_id: "${acct_id}", payee_id: "${payee_1}", authorization_id: "${auth_id}", budget_category_id: "${cat_id}", amount_cents: 50000, channel: "ACH", expected_account_version: "${acct_v1}" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
            - call: "GET /dmm/accounts/${acct_id}"
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { acct_v2: $.data.version }
            - call: "POST /dmm/payments"
              payload: { account_id: "${acct_id}", payee_id: "${payee_2}", authorization_id: "${auth_id}", budget_category_id: "${cat_id}", amount_cents: 60000, channel: "ACH", expected_account_version: "${acct_v2}" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
          trigger:
            - call: "GET /dmm/payments"
              payload: { account_id: "${acct_id}", limit: 1, offset: 0 }
              as: FiduciaryManager
              as_user_id: "u-mgr"
          assert:
            - "the response data array has exactly 1 element"
            - "meta pagination reports total_count 2 and has_more true"
            - "a second call with offset 1 returns 1 element and has_more false"

  - section: state_machines
    instances:

      - name: corner_cancel_an_already_cancelled_payment_is_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Payment.settlement_status.SCHEDULED_to_CANCELLED
          - validations[priority=12]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CANCELLED is a terminal settlement state, so a second cancel returns ERR_INVALID_STATE and releases nothing a second time - the account's committed total stays at 0 rather than going negative."
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T09:00:00Z, one IN_FORCE bond, one ACTIVE client, one ACTIVE FULL_AGENCY authorization, one account with 5000000 cents"
            - "one ACH payment of 80000 cents that has already been cancelled once"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dmm/surety-bonds"
              payload: { carrier_name: "Atlas Surety", bond_number: "SB-2026-001", coverage_cents: 100000000, effective_date: "2026-01-01", expiry_date: "2026-12-31" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dmm/clients"
              payload: { full_name: "Rosa Mendel", date_of_birth: "1941-03-08", intake_reference: "INT-C010" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { cl_id: $.data.id }
            - call: "POST /dmm/clients/${cl_id}/capacity-determination"
              payload: { determination: "RETAINS_CAPACITY", determined_on: "2026-05-15" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/clients/${cl_id}/status-change"
              payload: { to_status: "ACTIVE" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/authorizations"
              payload: { client_id: "${cl_id}", scope_tier: "FULL_AGENCY", instrument_reference: "AGR-C010", effective_date: "2026-01-01", expiry_date: "2026-12-31" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { auth_id: $.data.id }
            - call: "POST /dmm/authorizations/${auth_id}/status"
              payload: { to_status: "ACTIVE" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/accounts"
              payload: { client_id: "${cl_id}", institution_name: "First Community Bank", account_label: "Operating", account_type: "CHECKING", opening_balance_cents: 5000000 }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { acct_id: $.data.id }
            - call: "POST /dmm/payees"
              payload: { client_id: "${cl_id}", payee_name: "City Power", payee_type: "RECURRING_BILLER", remittance_reference: "ACC-77" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { payee_id: $.data.id }
            - call: "POST /dmm/budget-categories"
              payload: { client_id: "${cl_id}", category_name: "UTILITIES", budget_month: "2026-06", allocation_cents: 300000 }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { cat_id: $.data.id }
            - call: "GET /dmm/accounts/${acct_id}"
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { acct_v: $.data.version }
            - call: "POST /dmm/payments"
              payload: { account_id: "${acct_id}", payee_id: "${payee_id}", authorization_id: "${auth_id}", budget_category_id: "${cat_id}", amount_cents: 80000, channel: "ACH", expected_account_version: "${acct_v}" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { pay_id: $.data.id }
            - call: "POST /dmm/payments/${pay_id}/cancel"
              payload: { reason: "Bill already paid." }
              as: BillPaySpecialist
              as_user_id: "u-spec"
          trigger:
            - call: "POST /dmm/payments/${pay_id}/cancel"
              payload: { reason: "Cancelling again by mistake." }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response is HTTP 409 with error_id ERR_INVALID_STATE"
            - "Payment.${pay_id}.settlement_status == CANCELLED"
            - "ClientAccount.${acct_id}.committed_disbursements_cents == 0"
            - "ClientAccount.${acct_id}.available_balance_cents == 5000000"
            - "BudgetCategory.${cat_id}.committed_cents == 0"

      - name: corner_executing_a_second_instrument_supersedes_the_first
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Authorization.ACTIVE_to_SUPERSEDED
          - state_machines.Authorization.DRAFT_to_ACTIVE
        distinguishing_aspect: "Executing a second DRAFT instrument for the same client moves the first from ACTIVE to SUPERSEDED without running the revocation cascade, so cascaded_payments_cancelled stays 0."
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T09:00:00Z"
            - "one ACTIVE client with one ACTIVE FULL_AGENCY authorization and a second DRAFT REP_PAYEE authorization"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dmm/clients"
              payload: { full_name: "Rosa Mendel", date_of_birth: "1941-03-08", intake_reference: "INT-C011" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { cl_id: $.data.id }
            - call: "POST /dmm/clients/${cl_id}/capacity-determination"
              payload: { determination: "LACKS_CAPACITY", determined_on: "2026-05-15" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/clients/${cl_id}/status-change"
              payload: { to_status: "ACTIVE" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/authorizations"
              payload: { client_id: "${cl_id}", scope_tier: "FULL_AGENCY", instrument_reference: "AGR-C011-A", effective_date: "2026-01-01", expiry_date: "2026-12-31" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { auth_1: $.data.id }
            - call: "POST /dmm/authorizations/${auth_1}/status"
              payload: { to_status: "ACTIVE" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/authorizations"
              payload: { client_id: "${cl_id}", scope_tier: "REP_PAYEE", instrument_reference: "AGR-C011-B", effective_date: "2026-06-01", expiry_date: "2027-05-31" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { auth_2: $.data.id }
          trigger:
            - call: "POST /dmm/authorizations/${auth_2}/status"
              payload: { to_status: "ACTIVE" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
          assert:
            - "Authorization.${auth_1}.status == SUPERSEDED"
            - "Authorization.${auth_1}.cascaded_payments_cancelled == 0"
            - "Authorization.${auth_1}.revoked_at == null"
            - "Authorization.${auth_2}.status == ACTIVE"
            - "Authorization.${auth_2}.executed_at == 2026-06-01T09:00:00.000Z"

      - name: corner_client_activation_without_capacity_determination_is_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Client.INTAKE_to_ACTIVE
          - validations[priority=12]
          - entities.Client.fields.capacity_determination
