# =============================================================================
# SCAFFOLD.yaml — task_1254_construction_materials_testing_special
# Construction Materials Testing & Special Inspection agency API
# =============================================================================

scenario: |
  generate task hard than expert level! 1254. Construction Materials Testing &
  Special Inspection (testing & inspection agency): inspection schedule tied to
  construction activities & statement of special inspections, technician dispatch
  & certification requirements, field test (concrete/soil/weld/bolt) results &
  reporting, nonconforming result notification & correction verification,
  laboratory sample tracking & break dates, inspector daily report to building
  official, discrepancy resolution with contractor/engineer, final compliance
  letter

domain_name: construction-materials-testing
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - polymorphic
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Project name" }
      - { name: permit_number, type: string, source: input, description: "Building permit number; unique across all projects" }
      - { name: jurisdiction, type: string, source: input, description: "Authority having jurisdiction (city/county)" }
      - { name: contractor_name, type: string, source: input, description: "General contractor of record" }
      - { name: building_official_name, type: string, source: input, description: "Building official who receives daily reports" }
      - { name: status, type: enum, source: system, description: "ACTIVE | COMPLETED — COMPLETED when letter_status == ISSUED", constraints: "ACTIVE | COMPLETED" }
      - { name: compliance_posture, type: enum, source: computed, description: "IN_PROGRESS | NONCONFORMANCE_OUTSTANDING | READY_FOR_LETTER | LETTER_ISSUED; derived per calculations.project_posture_derivation", constraints: "IN_PROGRESS | NONCONFORMANCE_OUTSTANDING | READY_FOR_LETTER | LETTER_ISSUED" }
      - { name: open_ncr_count, type: integer, source: computed, description: "Count of NonconformanceReport rows of this project with status in {OPEN, CORRECTION_SUBMITTED, ESCALATED}" }
      - { name: current_approved_ssi_id, type: string, source: system, description: "id of the SSIRevision currently APPROVED for this project; null until first approval" , constraints: "nullable" }
      - { name: letter_status, type: enum, source: system, description: "NONE | ISSUED | VOIDED", constraints: "NONE | ISSUED | VOIDED" }
      - { name: letter_issued_at, type: datetime, source: system, description: "Clock timestamp when the compliance letter was issued", constraints: "nullable" }
      - { name: letter_issued_by, type: string, source: system, description: "X-User-ID of the ProjectManager who issued the letter", constraints: "nullable" }
      - { name: letter_void_reason, type: string, source: system, description: "Reason recorded when the letter was voided", constraints: "nullable" }

  - name: SSIRevision
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: revision_number, type: integer, source: computed, description: "Per-project monotone revision number starting at 1, assigned at creation in created_at order" }
      - { name: specified_fc_psi, type: integer, source: input, description: "Specified concrete compressive strength f'c in psi (e.g. 4000)" }
      - { name: acceptance_method_concrete, type: enum, source: input, default: MOVING_AVERAGE, description: "Concrete acceptance algorithm variant", constraints: "MOVING_AVERAGE | INDIVIDUAL_SET" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | SUPERSEDED", constraints: "DRAFT | SUBMITTED | APPROVED | REJECTED | SUPERSEDED" }
      - { name: submitted_at, type: datetime, source: system, description: "Clock timestamp of submission", constraints: "nullable" }
      - { name: approved_at, type: datetime, source: system, description: "Clock timestamp of approval", constraints: "nullable" }

  - name: ScopeItem
    parent: SSIRevision
    common_fields: true
    fields:
      - { name: ssi_revision_id, type: string, source: system, description: "FK -> SSIRevision.id; owning revision (immutable snapshot line)" }
      - { name: test_method, type: enum, source: input, description: "Required test/inspection method", constraints: "CONCRETE_STRENGTH | SOIL_COMPACTION | WELD_VISUAL | BOLT_TENSION" }
      - { name: description, type: string, source: input, description: "Scope line description (e.g. 'footing concrete, pour #3')" }
      - { name: required_cert_level, type: integer, source: input, description: "Minimum technician certification level required to dispatch (1, 2, or 3)" }
      - { name: required_count, type: integer, source: input, description: "Number of conforming results required to satisfy this scope item (>= 1)" }
      - { name: is_structural, type: boolean, source: input, default: false, description: "True when failure of this item raises a STRUCTURAL-severity NCR" }
      - { name: proctor_method, type: enum, source: input, default: STANDARD, description: "Soil reference curve variant; only meaningful for SOIL_COMPACTION", constraints: "STANDARD | MODIFIED" }
      - { name: standard_max_density_pcf, type: number, source: input, description: "Standard-proctor maximum dry density (required for SOIL_COMPACTION)", constraints: "nullable for non-soil" }
      - { name: modified_max_density_pcf, type: number, source: input, description: "Modified-proctor maximum dry density (required for SOIL_COMPACTION)", constraints: "nullable for non-soil" }
      - { name: completed_count, type: integer, source: computed, description: "Live count of conforming, non-voided results linked to this item (field tests + reported lab samples) per calculations.scope_completion_update" }
      - { name: status, type: enum, source: system, description: "OPEN | SATISFIED — flips automatically when completed_count crosses required_count", constraints: "OPEN | SATISFIED" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Technician full name" }
      - { name: employee_code, type: string, source: input, description: "Unique agency employee code" }
      - { name: certifications, type: array, source: input, description: "Array of {method, level, expires_at}: method in {CONCRETE_STRENGTH, SOIL_COMPACTION, WELD_VISUAL, BOLT_TENSION}, level 1-3, expires_at ISO date; appended via POST /api/technicians/{id}/certifications" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE — set INACTIVE via deactivate endpoint", constraints: "ACTIVE | INACTIVE" }

  - name: InspectionAssignment
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: scope_item_id, type: string, source: input, description: "FK -> ScopeItem.id; must belong to the project's current APPROVED SSI revision at creation" }
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; dispatched inspector" }
      - { name: ssi_revision_id, type: string, source: system, description: "Pinned at creation to Project.current_approved_ssi_id (version-pinning: later revisions do not migrate this assignment)" }
      - { name: work_date, type: string, source: input, description: "Scheduled work date, ISO date YYYY-MM-DD" }
      - { name: start_time, type: string, source: input, description: "Window start, HH:MM 24h; half-open interval start" }
      - { name: end_time, type: string, source: input, description: "Window end, HH:MM 24h; must be after start_time; half-open interval end" }
      - { name: status, type: enum, source: system, description: "REQUESTED | DISPATCHED | COMPLETED | CANCELLED", constraints: "REQUESTED | DISPATCHED | COMPLETED | CANCELLED" }
      - { name: completion_note, type: string, source: system, description: "Note captured at completion", constraints: "nullable" }
      - { name: completed_at, type: datetime, source: system, description: "Clock timestamp of completion", constraints: "nullable" }
      - { name: covered_by_dir_id, type: string, source: system, description: "id of the DailyInspectionReport covering this assignment; null until a submitted report references it", constraints: "nullable" }

  - name: FieldTest
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> InspectionAssignment.id; must be DISPATCHED" }
      - { name: measured_values, type: object, source: input, description: "Method-specific measurements: SOIL_COMPACTION {field_dry_density_pcf}; WELD_VISUAL {defect_count}; BOLT_TENSION {bolts_tested, bolts_passed}" }
      - { name: test_method, type: enum, source: system, description: "Copied from the assignment's scope item at creation", constraints: "SOIL_COMPACTION | WELD_VISUAL | BOLT_TENSION" }
      - { name: technician_id, type: string, source: system, description: "Copied from assignment.technician_id (attribution for segregation of duties)" }
      - { name: project_id, type: string, source: system, description: "Copied from assignment.project_id (denormalized for NCR routing)" }
      - { name: result, type: enum, source: computed, description: "CONFORMING | NONCONFORMING per calculations.soil_compaction_evaluation or the weld/bolt evaluators", constraints: "CONFORMING | NONCONFORMING" }
      - { name: result_details, type: object, source: computed, description: "Evaluation audit payload, e.g. {relative_compaction_pct, threshold_pct, proctor_method} for soil" }
      - { name: status, type: enum, source: system, description: "RECORDED | VOIDED", constraints: "RECORDED | VOIDED" }

  - name: LabSample
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> InspectionAssignment.id; must be DISPATCHED; assignment scope item must be CONCRETE_STRENGTH" }
      - { name: lab_id, type: string, source: input, description: "FK -> Lab.id; testing laboratory that will break the set" }
      - { name: cast_at, type: datetime, source: input, description: "Datetime the cylinder set was cast in the field" }
      - { name: required_break_age_days, type: integer, source: input, description: "Required break age", constraints: "one of 7, 28, 56" }
      - { name: break_due_at, type: datetime, source: computed, description: "= cast_at + required_break_age_days" }
      - { name: break_scheduled_date, type: string, source: system, description: "ISO date the break is booked at the lab; must equal date(break_due_at)", constraints: "nullable until scheduled" }
      - { name: broken_at, type: datetime, source: system, description: "Actual break timestamp recorded at record-break", constraints: "nullable until broken" }
      - { name: cylinder_strengths_psi, type: array, source: input, description: "Measured cylinder strengths at record-break (array of >= 1 numbers)" }
      - { name: set_average_psi, type: integer, source: computed, description: "Per-set average rounded to the nearest 10 psi, round_half_up (calculations.concrete_set_average)" }
      - { name: age_at_break_hours, type: integer, source: computed, description: "round_half_up((broken_at - cast_at) in hours, 0 decimals)" }
      - { name: within_tolerance, type: boolean, source: computed, description: "|broken_at - break_due_at| <= tolerance hours per calculations.break_window_tolerance (inclusive boundary)" }
      - { name: flagged_out_of_tolerance, type: boolean, source: computed, description: "not within_tolerance; drives auto-NCR of severity MINOR" }
      - { name: break_result, type: enum, source: computed, description: "CONFORMING | NONCONFORMING per calculations.concrete_acceptance_evaluation", constraints: "CONFORMING | NONCONFORMING; null until reported" }
      - { name: status, type: enum, source: system, description: "CAST | BREAK_SCHEDULED | REPORTED | DISCARDED", constraints: "CAST | BREAK_SCHEDULED | REPORTED | DISCARDED" }

  - name: Lab
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Laboratory name" }
      - { name: lab_code, type: string, source: input, description: "Unique lab code" }
      - { name: daily_break_capacity, type: integer, source: input, description: "Maximum number of samples that may be break-scheduled per calendar day (>= 1)" }

  - name: NonconformanceReport
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; inherited from the source result's assignment" }
      - { name: ncr_number, type: string, source: computed, description: "Per-project sequential label NCR-0001, NCR-0002, ... assigned in created_at order" }
      - { name: source_type, type: enum, source: system, description: "FIELD_TEST | LAB_SAMPLE (polymorphic reference, no FK constraint)", constraints: "FIELD_TEST | LAB_SAMPLE" }
      - { name: source_id, type: string, source: system, description: "id of the FieldTest or LabSample that raised this NCR (polymorphic; resolve via source_type)" }
      - { name: scope_item_id, type: string, source: system, description: "Scope item reference copied from the source result's assignment (query via GET /api/projects/{id}/ncrs?scope_item_id=)" }
      - { name: description, type: string, source: system, description: "Auto-generated summary of the nonconformance" }
      - { name: severity, type: enum, source: computed, description: "STRUCTURAL when scope item is_structural else MAJOR; MINOR for out-of-tolerance breaks", constraints: "MINOR | MAJOR | STRUCTURAL" }
      - { name: detected_at, type: datetime, source: system, description: "Clock timestamp when the NCR was auto-created" }
      - { name: deadline_date, type: string, source: computed, description: "date(detected_at) + REMEDIATION_DAYS[severity] (MINOR 30, MAJOR 14, STRUCTURAL 7)" }
      - { name: rejection_count, type: integer, source: system, default: 0, description: "Number of times a submitted correction has been rejected" }
      - { name: correction_note, type: string, source: system, description: "Contractor's correction description", constraints: "nullable" }
      - { name: verified_by_technician_id, type: string, source: system, description: "Technician id (X-User-ID) that verified the correction; MUST differ from the source result's technician_id", constraints: "nullable" }
      - { name: evidence_field_test_id, type: string, source: system, description: "Optional conforming re-test evidence supplied at verification", constraints: "nullable" }
      - { name: escalation_score, type: integer, source: computed, description: "Last computed score per calculations.ncr_escalation_score (recomputed by run-daily-sweep)" }
      - { name: status, type: enum, source: system, description: "OPEN | CORRECTION_SUBMITTED | ESCALATED | VERIFIED", constraints: "OPEN | CORRECTION_SUBMITTED | ESCALATED | VERIFIED" }

  - name: DailyInspectionReport
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: technician_id, type: string, source: system, description: "Set from X-User-ID of the submitting Technician (attribution, not a navigable FK)" }
      - { name: report_date, type: string, source: input, description: "ISO date this daily report covers" }
      - { name: assignment_ids, type: array, source: input, description: "Completed assignments covered by this report; each must be COMPLETED, belong to this technician and project, have work_date == report_date, and not already be covered" }
      - { name: summary, type: string, source: input, description: "Narrative of work performed, conditions, observations" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACKNOWLEDGED", constraints: "SUBMITTED | ACKNOWLEDGED" }
      - { name: acknowledged_by, type: string, source: system, description: "X-User-ID of the acknowledging BuildingOfficial", constraints: "nullable" }

  - name: DiscrepancyTicket
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: scope_item_id, type: string, source: input, description: "Optional related scope item reference", constraints: "nullable" }
      - { name: raised_by_technician_id, type: string, source: system, description: "Set from X-User-ID of the raising Technician (attribution, not a navigable FK)" }
      - { name: subject, type: string, source: input, description: "Short discrepancy subject" }
      - { name: description, type: string, source: input, description: "Field condition that disagrees with contract documents" }
      - { name: routed_to, type: enum, source: input, description: "Which external party must respond", constraints: "CONTRACTOR | ENGINEER" }
      - { name: response_text, type: string, source: system, description: "Latest response from the routed party", constraints: "nullable" }
      - { name: round_count, type: integer, source: system, default: 1, description: "Negotiation round; incremented each time a response is rejected and the ticket reopens" }
      - { name: status, type: enum, source: system, description: "RAISED | RESPONSE_SUBMITTED | RESOLVED", constraints: "RAISED | RESPONSE_SUBMITTED | RESOLVED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SSIRevision
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/ssi-revisions/{id}/submit"
        actor: ProjectManager
        preconditions:
          - "revision has at least one scope item (ERR_INVALID_STATE)"
          - "project.status == ACTIVE (ERR_PROJECT_COMPLETED)"
        side_effects:
          - "submitted_at := clock now"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/ssi-revisions/{id}/approve"
        actor: EngineerOfRecord
        preconditions:
          - "expected_project_version == project.version (ERR_STALE_VERSION)"
          - "project.status == ACTIVE (ERR_PROJECT_COMPLETED)"
        side_effects:
          - "approved_at := clock now"
          - "prior APPROVED revision of same project (if any) -> SUPERSEDED"
          - "project.current_approved_ssi_id := this revision id"
          - "project.version += 1; project.compliance_posture recomputed"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/ssi-revisions/{id}/approve with decision=REJECT"
        actor: EngineerOfRecord
        preconditions:
          - "expected_project_version == project.version (ERR_STALE_VERSION)"
        side_effects:
          - "project.version += 1"

  - entity: InspectionAssignment
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: DISPATCHED
        trigger: "POST /api/assignments/{id}/dispatch"
        actor: ProjectManager
        preconditions:
          - "technician.status == ACTIVE (ERR_TECHNICIAN_INACTIVE)"
          - "technician holds a certification with method == scope item test_method (ERR_CERTIFICATION_MISSING)"
          - "that certification level >= scope item required_cert_level (ERR_CERTIFICATION_INSUFFICIENT)"
          - "that certification expires_at > work_date (ERR_CERTIFICATION_EXPIRED)"
          - "project.status == ACTIVE (ERR_PROJECT_COMPLETED)"
        side_effects: []
      - from: DISPATCHED
        to: REQUESTED
        trigger: "POST /api/assignments/{id}/cancel with requeue=true"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "technician window freed (assignment no longer occupies [start_time, end_time))"
        note: "Requeue loop — assignment returns to REQUESTED for re-dispatch"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /api/assignments/{id}/cancel"
        actor: ProjectManager
        preconditions: []
        side_effects: ["technician window freed"]
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /api/assignments/{id}/cancel"
        actor: ProjectManager
        preconditions: []
        side_effects: ["technician window freed"]
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /api/assignments/{id}/complete"
        actor: Technician
        preconditions:
          - "X-User-ID == assignment.technician_id (ERR_FORBIDDEN)"
          - "at least one FieldTest or LabSample exists for this assignment (ERR_NO_RESULT_RECORDED)"
        side_effects:
          - "completed_at := clock now; completion_note stored"
          - "project.compliance_posture recomputed (coverage gate input set changed)"

  - entity: FieldTest
    initial_state: RECORDED
    terminal_states: [VOIDED]
    transitions:
      - from: RECORDED
        to: RECORDED
        trigger: "system (result evaluation on creation)"
        actor: system
        preconditions: []
        side_effects:
          - "result := CONFORMING or NONCONFORMING per method evaluator"
          - "if CONFORMING: scope_item.completed_count += 1; if completed_count crosses required_count, scope_item.status -> SATISFIED; project.compliance_posture recomputed"
          - "if NONCONFORMING: auto-create NonconformanceReport (source_type=FIELD_TEST, severity=STRUCTURAL if scope item is_structural else MAJOR); project.open_ncr_count += 1; project.compliance_posture recomputed"
        note: "Result is computed synchronously inside POST /api/field-tests; state value RECORDED is unchanged, only the result field resolves"
      - from: RECORDED
        to: VOIDED
        trigger: "POST /api/field-tests/{id}/void"
        actor: ProjectManager
        preconditions:
          - "result == CONFORMING (ERR_TEST_NOT_VOIDABLE — a NONCONFORMING test may not be voided; its NCR must run to verification)"
        side_effects:
          - "scope_item.completed_count -= 1 (compensating action)"
          - "if completed_count drops below required_count: scope_item.status -> OPEN"
          - "project.compliance_posture recomputed"

  - entity: LabSample
    initial_state: CAST
    terminal_states: [REPORTED, DISCARDED]
    transitions:
      - from: CAST
        to: BREAK_SCHEDULED
        trigger: "POST /api/lab-samples/{id}/schedule-break"
        actor: LabAnalyst
        preconditions:
          - "break_scheduled_date == date(break_due_at) (ERR_BREAK_DATE_MISMATCH)"
          - "lab day load: count of samples at this lab with break_scheduled_date == requested date and status == BREAK_SCHEDULED must be < lab.daily_break_capacity (ERR_LAB_DAY_CAPACITY)"
        side_effects:
          - "lab day load for (lab_id, break_scheduled_date) += 1"
      - from: BREAK_SCHEDULED
        to: REPORTED
        trigger: "POST /api/lab-samples/{id}/record-break"
        actor: LabAnalyst
        preconditions: []
        side_effects:
          - "set_average_psi, age_at_break_hours, within_tolerance, flagged_out_of_tolerance computed"
          - "break_result computed per calculations.concrete_acceptance_evaluation"
          - "if break_result == CONFORMING: scope_item.completed_count += 1 (status may flip to SATISFIED); project.compliance_posture recomputed"
          - "if break_result == NONCONFORMING: auto-create NCR (source_type=LAB_SAMPLE, severity STRUCTURAL/MAJOR); project.open_ncr_count += 1; posture recomputed"
          - "if flagged_out_of_tolerance (regardless of break_result): auto-create a second NCR, severity MINOR; project.open_ncr_count += 1; posture recomputed"
      - from: CAST
        to: DISCARDED
        trigger: "POST /api/lab-samples/{id}/discard"
        actor: LabAnalyst
        preconditions: []
        side_effects: []

  - entity: NonconformanceReport
    initial_state: OPEN
    terminal_states: [VERIFIED]
    transitions:
      - from: OPEN
        to: CORRECTION_SUBMITTED
        trigger: "POST /api/ncrs/{id}/submit-correction"
        actor: Contractor
        preconditions: []
        side_effects: ["correction_note stored"]
      - from: ESCALATED
        to: CORRECTION_SUBMITTED
        trigger: "POST /api/ncrs/{id}/submit-correction"
        actor: Contractor
        preconditions: []
        side_effects: ["correction_note stored"]
      - from: CORRECTION_SUBMITTED
        to: VERIFIED
        trigger: "POST /api/ncrs/{id}/verify with outcome=VERIFIED"
        actor: Technician
        preconditions:
          - "X-User-ID != the source result's technician attribution — FieldTest.technician_id for FIELD_TEST sources, or the LabSample's assignment.technician_id for LAB_SAMPLE sources (segregation of duties, ERR_SEGREGATION_OF_DUTIES)"
          - "if evidence_field_test_id provided: it must reference a RECORDED FieldTest with result == CONFORMING on the same scope item (ERR_REFERENCE_MISMATCH)"
        side_effects:
          - "verified_by_technician_id := X-User-ID"
          - "project.open_ncr_count -= 1 (compensating action)"
          - "project.compliance_posture recomputed"
      - from: CORRECTION_SUBMITTED
        to: OPEN
        trigger: "POST /api/ncrs/{id}/verify with outcome=REJECTED"
        actor: Technician
        preconditions:
          - "X-User-ID != the source result's technician attribution (same rule as VERIFIED; ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "rejection_count += 1"
          - "correction_note cleared"
        note: "Correction cycle — NCR returns to OPEN for another remediation round"
      - from: OPEN
        to: ESCALATED
        trigger: "system (POST /api/ops/run-daily-sweep when escalation_score >= 70)"
        actor: system
        preconditions:
          - "escalation_score >= ESCALATION_THRESHOLD (70)"
        side_effects:
          - "project.compliance_posture recomputed"

  - entity: DailyInspectionReport
    initial_state: SUBMITTED
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /api/daily-reports/{id}/acknowledge"
        actor: BuildingOfficial
        preconditions: []
        side_effects: ["acknowledged_by := X-User-ID"]

  - entity: DiscrepancyTicket
    initial_state: RAISED
    terminal_states: [RESOLVED]
    transitions:
      - from: RAISED
        to: RESPONSE_SUBMITTED
        trigger: "POST /api/discrepancies/{id}/respond"
        actor: "Contractor when routed_to == CONTRACTOR; EngineerOfRecord when routed_to == ENGINEER (else ERR_DISCREPANCY_ROUTING)"
        preconditions:
          - "caller role matches routed_to (ERR_DISCREPANCY_ROUTING)"
        side_effects: ["response_text stored"]
      - from: RESPONSE_SUBMITTED
        to: RESOLVED
        trigger: "POST /api/discrepancies/{id}/resolve with outcome=ACCEPT"
        actor: Technician
        preconditions: []
        side_effects:
          - "project.compliance_posture recomputed (open discrepancy gate clears)"
      - from: RESPONSE_SUBMITTED
        to: RAISED
        trigger: "POST /api/discrepancies/{id}/resolve with outcome=REJECT"
        actor: Technician
        preconditions: []
        side_effects:
          - "round_count += 1; response_text cleared"
        note: "Negotiation loop — ticket reopens for another response round"

  - entity: Project
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /api/projects/{id}/issue-letter"
        actor: ProjectManager
        preconditions:
          - "compliance_posture == READY_FOR_LETTER (ERR_POSTURE_NOT_READY)"
          - "letter_status != ISSUED (ERR_LETTER_ALREADY_ISSUED)"
        side_effects:
          - "letter_status := ISSUED; letter_issued_at := clock now; letter_issued_by := X-User-ID"
          - "compliance_posture := LETTER_ISSUED"
      - from: COMPLETED
        to: ACTIVE
        trigger: "POST /api/projects/{id}/void-letter"
        actor: BuildingOfficial
        preconditions:
          - "letter_status == ISSUED (ERR_NO_LETTER_TO_VOID)"
        side_effects:
          - "letter_status := VOIDED; letter_void_reason stored"
          - "compliance_posture recomputed (returns to READY_FOR_LETTER or lower)"
        note: "Cyclic at project level — a voided letter returns the project to ACTIVE for remediation and possible re-issue"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: ssi-approve-stale-project
    parent_entity: Project
    write_endpoint: "POST /api/ssi-revisions/{id}/approve"
    occ_field: expected_project_version
    description: |
      Approving an SSI revision against a Project whose version has advanced
      since the client last observed it is rejected. Approval legitimately
      supersedes whatever revision is currently APPROVED, so a second approval
      grounded in a stale project view must fail with 412 rather than silently
      superseding a revision the approver never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: concrete_set_average
    trigger: "POST /api/lab-samples/{id}/record-break"
    algorithm: aggregation
    formula: |
      set_average_psi = round_half_up(mean(cylinder_strengths_psi) to nearest 10 psi)
      Rounding order is pinned: each set is averaged and rounded FIRST;
      downstream moving averages consume only these rounded set averages.
    input_set: "cylinder_strengths_psi of the sample being reported"
    precision: "nearest 10 psi, round_half_up (e.g. 4215 -> 4220, 4214.9 -> 4210)"
    constants:
      GRID_PSI: 10

  - name: concrete_acceptance_evaluation
    trigger: "POST /api/lab-samples/{id}/record-break (after concrete_set_average)"
    algorithm: threshold
    formula: |
      let fc = ssi_revision.specified_fc_psi of the revision pinned on the assignment
      let S = set_average_psi values of all REPORTED, non-discarded samples whose
              assignment pins the SAME scope item as this sample's assignment,
              ordered by break_due_at ASC then created_at ASC, INCLUDING this sample
      individual_floor = (fc <= 5000) ? fc - 500 : round_half_up(fc * 0.90)
      variant MOVING_AVERAGE:
        window = last min(3, |S|) entries of S
        moving_average_psi = round_half_up(mean(window) to nearest 10 psi)
        CONFORMING iff moving_average_psi >= fc AND every entry in window >= individual_floor
      variant INDIVIDUAL_SET:
        CONFORMING iff this sample's set_average_psi >= fc
    input_set: "REPORTED LabSamples on the same scope item (same pinned revision line); excludes DISCARDED samples"
    precision: "set averages and moving average rounded to nearest 10 psi, round_half_up, per-set rounding FIRST"
    constants:
      LOW_FC_FLOOR_OFFSET_PSI: 500
      HIGH_FC_FLOOR_RATIO: 0.90
      MOVING_WINDOW: 3
    variants:
      - name: moving_average
        when: "pinned ssi_revision.acceptance_method_concrete == MOVING_AVERAGE"
        difference: "judges on the rounded moving average of up to 3 consecutive set averages plus an individual-set floor; a below-f'c set can pass"
      - name: individual_set
        when: "pinned ssi_revision.acceptance_method_concrete == INDIVIDUAL_SET"
        difference: "judges the current set alone against f'c; identical cylinder data can flip the verdict"

  - name: soil_compaction_evaluation
    trigger: "POST /api/field-tests when scope item test_method == SOIL_COMPACTION"
    algorithm: threshold
    formula: |
      method = scope_item.proctor_method
      max_density = (method == STANDARD) ? scope_item.standard_max_density_pcf
                                         : scope_item.modified_max_density_pcf
      threshold = (method == STANDARD) ? 95.0 : 92.0
      relative_compaction_pct = round_half_up(100 * field_dry_density_pcf / max_density, 1 decimal)
      CONFORMING iff relative_compaction_pct >= threshold   (boundary: exactly at threshold PASSES)
    input_set: "single FieldTest measured_values.field_dry_density_pcf"
    precision: "1 decimal place, round_half_up; comparison is >= (95.0 passes, 94.9 fails)"
    constants:
      STANDARD_THRESHOLD_PCT: 95.0
      MODIFIED_THRESHOLD_PCT: 92.0
    variants:
      - name: standard_proctor
        when: "scope_item.proctor_method == STANDARD"
        difference: "denominator is standard_max_density_pcf, threshold 95.0"
      - name: modified_proctor
        when: "scope_item.proctor_method == MODIFIED"
        difference: "denominator is modified_max_density_pcf, threshold 92.0 — identical field density yields a different percentage and can flip the verdict"

  - name: simple_field_evaluators
    trigger: "POST /api/field-tests when scope item test_method in {WELD_VISUAL, BOLT_TENSION}"
    algorithm: threshold
    formula: |
      WELD_VISUAL:  CONFORMING iff measured_values.defect_count == 0
      BOLT_TENSION: CONFORMING iff measured_values.bolts_tested >= 1
                                 AND measured_values.bolts_passed == measured_values.bolts_tested
    input_set: "single FieldTest measured_values"

  - name: break_window_tolerance
    trigger: "POST /api/lab-samples/{id}/record-break"
    algorithm: threshold
    formula: |
      break_due_at = cast_at + required_break_age_days
      tolerance_hours = TOLERANCE_BY_AGE[required_break_age_days] (default 12 for other ages)
      delta_hours = abs(broken_at - break_due_at) in minutes / 60, compared exactly
      within_tolerance iff delta <= tolerance_hours   (inclusive: exactly at the limit is WITHIN)
      flagged_out_of_tolerance = not within_tolerance
    input_set: "single LabSample"
    constants:
      TOLERANCE_7_DAYS_HOURS: 6
      TOLERANCE_28_DAYS_HOURS: 24
      TOLERANCE_56_DAYS_HOURS: 48
      TOLERANCE_DEFAULT_HOURS: 12

  - name: ncr_escalation_score
    trigger: "POST /api/ops/run-daily-sweep (recomputed for every NCR with status OPEN)"
    algorithm: threshold
    formula: |
      days_open = (current clock date - date(detected_at)) in whole days, floor
      days_past_deadline = max(0, (current clock date - deadline_date) in whole days)
      if severity == STRUCTURAL and days_past_deadline > 0: score = 100
      else: score = min(100, SEVERITY_BASE[severity]
                             + 2 * days_open
                             + 3 * days_past_deadline
                             + 15 * rejection_count)
      if score >= ESCALATION_THRESHOLD: NCR transitions OPEN -> ESCALATED
    input_set: "NonconformanceReports with status == OPEN (CORRECTION_SUBMITTED and ESCALATED are not scored)"
    precision: "integer arithmetic; threshold comparison is >= (score exactly 70 escalates)"
    constants:
      SEVERITY_BASE_MINOR: 20
      SEVERITY_BASE_MAJOR: 40
      SEVERITY_BASE_STRUCTURAL: 60
      RATE_PER_DAY_OPEN: 2
      RATE_PER_DAY_OVERDUE: 3
      RATE_PER_REJECTION: 15
      ESCALATION_THRESHOLD: 70
      REMEDIATION_DAYS_MINOR: 30
      REMEDIATION_DAYS_MAJOR: 14
      REMEDIATION_DAYS_STRUCTURAL: 7

  - name: scope_completion_update
    trigger: "any FieldTest create/void and any LabSample record-break that changes a linked result's contribution"
    algorithm: aggregation
    formula: |
      scope_item.completed_count =
        count(FieldTest: assignment.scope_item_id == item.id AND status == RECORDED AND result == CONFORMING)
      + count(LabSample: assignment.scope_item_id == item.id AND status == REPORTED AND break_result == CONFORMING)
      if completed_count >= required_count: status = SATISFIED else status = OPEN   (>= boundary: exactly required_count SATISFIES)
    input_set: "results linked via InspectionAssignment.scope_item_id, any work_date, any technician"
    precision: "integer counts"

  - name: project_posture_derivation
    trigger: "any mutation to NCR status set, scope item status, DIR coverage, discrepancy status, or letter status"
    algorithm: aggregation
    formula: |
      evaluated in this exact order:
      1. if letter_status == ISSUED -> LETTER_ISSUED
      2. else if open_ncr_count > 0 -> NONCONFORMANCE_OUTSTANDING
      3. else if current_approved_ssi_id is not null
              AND every ScopeItem of that revision has status == SATISFIED
              AND count(DiscrepancyTicket of project with status in {RAISED, RESPONSE_SUBMITTED}) == 0
              AND every InspectionAssignment of project with status == COMPLETED has covered_by_dir_id != null
         -> READY_FOR_LETTER
      4. else -> IN_PROGRESS
      open_ncr_count = count(NonconformanceReport of project with status in {OPEN, CORRECTION_SUBMITTED, ESCALATED})
    input_set: "all NCRs, scope items of the current approved revision, discrepancies, and completed assignments of the project"

  - name: lab_day_load
    trigger: "POST /api/lab-samples/{id}/schedule-break"
    algorithm: aggregation
    formula: |
      load(lab_id, date) = count(LabSample: lab_id == lab_id AND break_scheduled_date == date
                                 AND status == BREAK_SCHEDULED)
      scheduling is rejected when load(lab_id, requested_date) >= lab.daily_break_capacity
      (boundary: load exactly == capacity rejects; capacity - 1 accepts)
    input_set: "LabSamples of the lab on the requested calendar date with status BREAK_SCHEDULED only (CAST/REPORTED/DISCARDED do not occupy a slot)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Caller role is in the endpoint's roles list; entity-backed ownership rules (Technician completing own assignment, segregation of duties on NCR verify, discrepancy routed role)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
    note: "SoD violations use ERR_SEGREGATION_OF_DUTIES and routing violations use ERR_DISCREPANCY_ROUTING, both at this priority"

  - priority: 3
    category: existence
    check: "Path identifiers exist, validated left-to-right (project, then ssi revision, then assignment/sample/test/report/ticket)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target resource is in a state that permits the operation; includes the global gate project.status == ACTIVE for mutations under a project, and letter_status != ISSUED for issue-letter"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all action endpoints
    note: "ERR_PROJECT_COMPLETED, ERR_LETTER_ALREADY_ISSUED, ERR_NO_LETTER_TO_VOID, ERR_TEST_NOT_VOIDABLE, ERR_NO_RESULT_RECORDED are the domain-specific state errors at this priority"

  - priority: 5
    category: business_safety
    check: "Technician fitness for dispatch: ACTIVE status, certification present for method, level sufficient, certification not expired as of work_date"
    error_id: "ERR_TECHNICIAN_INACTIVE / ERR_CERTIFICATION_MISSING / ERR_CERTIFICATION_INSUFFICIENT / ERR_CERTIFICATION_EXPIRED"
    http_status: 409
    applies_to: "POST /api/assignments/{id}/dispatch"

  - priority: 6
    category: business_temporal
    check: "Temporal occupancy: technician window overlap on create (half-open [start_time, end_time) on same work_date, statuses {REQUESTED, DISPATCHED}); break schedule date must equal date(break_due_at)"
    error_id: "ERR_TECHNICIAN_DOUBLE_BOOKED / ERR_BREAK_DATE_MISMATCH"
    http_status: 409
    applies_to: "POST /api/assignments, POST /api/lab-samples/{id}/schedule-break"

  - priority: 7
    category: business_constraint
    check: "Uniqueness and aggregate gates: permit_number unique; employee_code and lab_code unique; one DIR per (project_id, technician_id, report_date); issue-letter requires compliance_posture == READY_FOR_LETTER"
    error_id: "ERR_VALIDATION / ERR_DUPLICATE_DAILY_REPORT / ERR_POSTURE_NOT_READY"
    http_status: 409
    applies_to: "create endpoints, POST /api/daily-reports, POST /api/projects/{id}/issue-letter"

  - priority: 8
    category: business_referential
    check: "Cross-references must resolve within the same project: scope_item_id belongs to project's current APPROVED revision; assignment_ids in a DIR belong to the acting technician, this project, report_date == work_date, are COMPLETED, and have covered_by_dir_id == null; evidence_field_test_id on verify references a CONFORMING test on the same scope item"
    error_id: "ERR_REFERENCE_MISMATCH / ERR_SSI_NOT_APPROVED"
    http_status: 422
    applies_to: "POST /api/assignments, POST /api/daily-reports, POST /api/ncrs/{id}/verify"

  - priority: 9
    category: business_fiscal
    check: "Capacity: lab day load must be strictly below daily_break_capacity at schedule time"
    error_id: ERR_LAB_DAY_CAPACITY
    http_status: 409
    applies_to: "POST /api/lab-samples/{id}/schedule-break"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Project ---
  - method: POST
    path: "/api/projects"
    description: "Create a project. status=ACTIVE, compliance_posture=IN_PROGRESS, open_ncr_count=0, letter_status=NONE."
    roles: [AgencyAdmin]
    code: 201
    input: [name, permit_number, jurisdiction, contractor_name, building_official_name]
    output: Project
    side_effects: []

  - method: GET
    path: "/api/projects/{id}"
    description: "Get a project including computed posture, open_ncr_count, letter fields."
    roles: [AgencyAdmin, ProjectManager, EngineerOfRecord, Technician, LabAnalyst, Contractor, BuildingOfficial]
    code: 200
    input: []
    output: Project
    side_effects: []

  # --- SSI revisions ---
  - method: POST
    path: "/api/projects/{id}/ssi-revisions"
    description: "Create an SSI revision with its scope items atomically (scope_items is an array of scope-item input objects, min 1). revision_number assigned per-project in created_at order."
    roles: [ProjectManager]
    code: 201
    input: [specified_fc_psi, "acceptance_method_concrete?", scope_items]
    output: SSIRevision
    side_effects: ["creates ScopeItem children (status=OPEN, completed_count=0)"]

  - method: GET
    path: "/api/projects/{id}/ssi-revisions"
    description: "List SSI revisions of a project."
    roles: [AgencyAdmin, ProjectManager, EngineerOfRecord, Technician, LabAnalyst, Contractor, BuildingOfficial]
    code: 200
    input: ["status?"]
    output: SSIRevision[]
    side_effects: []

  - method: GET
    path: "/api/ssi-revisions/{id}"
    description: "Get one SSI revision."
    roles: [AgencyAdmin, ProjectManager, EngineerOfRecord, Technician, LabAnalyst, Contractor, BuildingOfficial]
    code: 200
    input: []
    output: SSIRevision
    side_effects: []

  - method: POST
    path: "/api/ssi-revisions/{id}/submit"
    description: "Submit a DRAFT revision to the engineer of record."
    roles: [ProjectManager]
    code: 200
    input: []
    output: SSIRevision
    side_effects: ["status DRAFT -> SUBMITTED; submitted_at := clock"]

  - method: POST
    path: "/api/ssi-revisions/{id}/approve"
    description: "Engineer decision on a SUBMITTED revision. decision=APPROVE approves and supersedes the project's prior APPROVED revision; decision=REJECT marks it REJECTED (terminal). OCC-guarded on the project version."
    roles: [EngineerOfRecord]
    code: 200
    input: [decision, expected_project_version]
    output: SSIRevision
    side_effects:
      - "on APPROVE: prior APPROVED revision -> SUPERSEDED; project.current_approved_ssi_id := this id; posture recomputed"
      - "increments Project.version by 1"

  - method: GET
    path: "/api/ssi-revisions/{id}/scope-items"
    description: "List scope items of a revision, ordered by created_at ASC (creation order of the scope_items array)."
    roles: [AgencyAdmin, ProjectManager, EngineerOfRecord, Technician, LabAnalyst, Contractor, BuildingOfficial]
    code: 200
    input: []
    output: ScopeItem[]
    side_effects: []

  # --- Technicians ---
  - method: POST
    path: "/api/technicians"
    description: "Create a technician (status=ACTIVE). certifications may be supplied as an array of {method, level, expires_at}."
    roles: [AgencyAdmin]
    code: 201
    input: [full_name, employee_code, "certifications?"]
    output: Technician
    side_effects: []

  - method: GET
    path: "/api/technicians/{id}"
    description: "Get a technician including certifications array."
    roles: [AgencyAdmin, ProjectManager, EngineerOfRecord, Technician, LabAnalyst, Contractor, BuildingOfficial]
    code: 200
    input: []
    output: Technician
    side_effects: []

  - method: POST
    path: "/api/technicians/{id}/certifications"
    description: "Append one certification to a technician."
    roles: [AgencyAdmin]
    code: 201
    input: [method, level, expires_at]
    output: Technician
    side_effects: ["certifications array extended"]

  - method: POST
    path: "/api/technicians/{id}/deactivate"
    description: "Deactivate a technician (status ACTIVE -> INACTIVE). Existing assignments keep their attribution."
    roles: [AgencyAdmin]
    code: 200
    input: []
    output: Technician
    side_effects: ["status := INACTIVE"]

  # --- Assignments ---
  - method: POST
    path: "/api/assignments"
    description: "Create an inspection assignment (status=REQUESTED). scope_item_id must belong to the project's current APPROVED SSI revision; ssi_revision_id is pinned at creation. Technician window overlap is checked (half-open [start_time, end_time) on the same work_date against REQUESTED/DISPATCHED assignments)."
    roles: [ProjectManager]
    code: 201
    input: [project_id, scope_item_id, technician_id, work_date, start_time, end_time]
    output: InspectionAssignment
    side_effects: ["occupies technician window while REQUESTED/DISPATCHED"]

  - method: GET
    path: "/api/assignments"
    description: "List assignments with optional filters."
    roles: [AgencyAdmin, ProjectManager, EngineerOfRecord, Technician, LabAnalyst, Contractor, BuildingOfficial]
    code: 200
    input: ["project_id?", "scope_item_id?", "technician_id?", "status?", "work_date?"]
    output: InspectionAssignment[]
    side_effects: []

  - method: GET
    path: "/api/assignments/{id}"
    description: "Get one assignment."
    roles: [AgencyAdmin, ProjectManager, EngineerOfRecord, Technician, LabAnalyst, Contractor, BuildingOfficial]
    code: 200
    input: []
    output: InspectionAssignment
    side_effects: []

  - method: POST
    path: "/api/assignments/{id}/dispatch"
    description: "Dispatch a REQUESTED assignment; enforces certification gate (method match, level >= required, expires_at > work_date) and technician ACTIVE."
    roles: [ProjectManager]
    code: 200
    input: []
    output: InspectionAssignment
    side_effects: ["status REQUESTED -> DISPATCHED"]

  - method: POST
    path: "/api/assignments/{id}/cancel"
    description: "Cancel an assignment from REQUESTED or DISPATCHED. requeue=true returns a DISPATCHED assignment to REQUESTED instead of cancelling."
    roles: [ProjectManager]
    code: 200
    input: ["requeue?"]
    output: InspectionAssignment
    side_effects: ["technician window freed"]

  - method: POST
    path: "/api/assignments/{id}/complete"
    description: "Technician completes own DISPATCHED assignment; requires at least one recorded FieldTest or LabSample."
    roles: [Technician]
    code: 200
    input: ["completion_note?"]
    output: InspectionAssignment
    side_effects: ["status -> COMPLETED; completed_at := clock; posture recomputed"]

  # --- Field tests ---
  - method: POST
    path: "/api/field-tests"
    description: "Record a field test on a DISPATCHED assignment (X-User-ID must equal assignment.technician_id). Result is computed synchronously; NONCONFORMING auto-creates an NCR."
    roles: [Technician]
    code: 201
    input: [assignment_id, measured_values]
    output: FieldTest
    side_effects:
      - "result computed per method evaluator"
      - "CONFORMING: scope_item.completed_count += 1 (may flip SATISFIED); posture recomputed"
      - "NONCONFORMING: NCR auto-created; project.open_ncr_count += 1; posture recomputed"

  - method: GET
    path: "/api/assignments/{id}/field-tests"
    description: "List field tests of an assignment."
    roles: [AgencyAdmin, ProjectManager, EngineerOfRecord, Technician, LabAnalyst, Contractor, BuildingOfficial]
    code: 200
    input: []
    output: FieldTest[]
    side_effects: []

  - method: POST
    path: "/api/field-tests/{id}/void"
    description: "Void a CONFORMING recorded test (compensating action: decrements completed_count, may reopen the scope item). NONCONFORMING tests are not voidable."
    roles: [ProjectManager]
    code: 200
    input: []
    output: FieldTest
    side_effects: ["status -> VOIDED; completed_count -= 1; scope item may flip to OPEN; posture recomputed"]

  # --- Lab samples ---
  - method: POST
    path: "/api/lab-samples"
    description: "Log a cast cylinder set on a DISPATCHED concrete assignment (X-User-ID must equal assignment.technician_id). break_due_at computed."
    roles: [Technician]
    code: 201
    input: [assignment_id, lab_id, cast_at, required_break_age_days]
    output: LabSample
    side_effects: ["status=CAST; break_due_at := cast_at + required_break_age_days"]

  - method: GET
    path: "/api/lab-samples/{id}"
    description: "Get one lab sample."
    roles: [AgencyAdmin, ProjectManager, EngineerOfRecord, Technician, LabAnalyst, Contractor, BuildingOfficial]
    code: 200
    input: []
    output: LabSample
    side_effects: []

  - method: GET
    path: "/api/assignments/{id}/lab-samples"
    description: "List lab samples collected on an assignment."
    roles: [AgencyAdmin, ProjectManager, EngineerOfRecord, Technician, LabAnalyst, Contractor, BuildingOfficial]
    code: 200
    input: []
    output: LabSample[]
    side_effects: []

  - method: POST
    path: "/api/lab-samples/{id}/schedule-break"
    description: "Book the break at the lab on the due date; enforces per-lab per-day capacity (aggregate day-bucket semantics)."
    roles: [LabAnalyst]
    code: 200
    input: [break_scheduled_date]
    output: LabSample
    side_effects: ["status CAST -> BREAK_SCHEDULED; lab day load += 1"]

  - method: POST
    path: "/api/lab-samples/{id}/record-break"
    description: "Record break results; computes set average (per-set 10-psi rounding first), tolerance flag, acceptance verdict; may auto-create NCR(s)."
    roles: [LabAnalyst]
    code: 200
    input: [broken_at, cylinder_strengths_psi]
    output: LabSample
    side_effects:
      - "status BREAK_SCHEDULED -> REPORTED; lab day load released"
      - "CONFORMING: completed_count += 1 (may flip SATISFIED); posture recomputed"
      - "NONCONFORMING: NCR auto-created; open_ncr_count += 1"
      - "flagged_out_of_tolerance: additional MINOR NCR auto-created; open_ncr_count += 1"

  - method: POST
    path: "/api/lab-samples/{id}/discard"
    description: "Discard a CAST sample that will never be broken (damaged in transit, mislabeled). Only valid from CAST."
    roles: [LabAnalyst]
    code: 200
    input: []
    output: LabSample
    side_effects: ["status CAST -> DISCARDED"]

  # --- Labs ---
  - method: POST
    path: "/api/labs"
    description: "Register a laboratory."
    roles: [AgencyAdmin]
    code: 201
    input: [name, lab_code, daily_break_capacity]
    output: Lab
    side_effects: []

  - method: GET
    path: "/api/labs/{id}"
    description: "Get a lab."
    roles: [AgencyAdmin, ProjectManager, EngineerOfRecord, Technician, LabAnalyst, Contractor, BuildingOfficial]
    code: 200
    input: []
    output: Lab
    side_effects: []

  - method: GET
    path: "/api/labs/{id}/lab-samples"
    description: "List samples at a lab, optionally filtered to one break day (lab day-load observation)."
    roles: [AgencyAdmin, ProjectManager, EngineerOfRecord, Technician, LabAnalyst, Contractor, BuildingOfficial]
    code: 200
    input: ["break_scheduled_date?"]
    output: LabSample[]
    side_effects: []

  # --- NCRs ---
  - method: GET
    path: "/api/projects/{id}/ncrs"
    description: "List NCRs of a project, ordered by created_at ASC (NCRs are created only by system cascades from nonconforming results)."
    roles: [AgencyAdmin, ProjectManager, EngineerOfRecord, Technician, LabAnalyst, Contractor, BuildingOfficial]
    code: 200
    input: ["status?", "severity?", "scope_item_id?"]
    output: NonconformanceReport[]
    side_effects: []

  - method: POST
    path: "/api/ncrs/{id}/submit-correction"
    description: "Contractor submits a correction for an OPEN or ESCALATED NCR."
    roles: [Contractor]
    code: 200
    input: [correction_note]
    output: NonconformanceReport
    side_effects: ["status -> CORRECTION_SUBMITTED"]

  - method: POST
    path: "/api/ncrs/{id}/verify"
    description: "Technician verifies (outcome=VERIFIED) or rejects (outcome=REJECTED) a submitted correction. Verifier must not be the technician whose result raised the NCR (segregation of duties). Optional evidence_field_test_id must reference a CONFORMING test on the same scope item."
    roles: [Technician]
    code: 200
    input: [outcome, "verification_note?", "evidence_field_test_id?"]
    output: NonconformanceReport
    side_effects:
      - "VERIFIED: verified_by set; open_ncr_count -= 1; posture recomputed"
      - "REJECTED: status -> OPEN; rejection_count += 1"

  # --- Daily inspection reports ---
  - method: POST
    path: "/api/daily-reports"
    description: "Technician submits the daily report to the building official (created directly in SUBMITTED). Covered assignments are marked covered_by_dir_id. One report per (project, technician, report_date)."
    roles: [Technician]
    code: 201
    input: [project_id, report_date, assignment_ids, summary]
    output: DailyInspectionReport
    side_effects: ["each referenced assignment.covered_by_dir_id := this report id; posture recomputed"]

  - method: GET
    path: "/api/projects/{id}/daily-reports"
    description: "List daily reports of a project."
    roles: [AgencyAdmin, ProjectManager, EngineerOfRecord, Technician, LabAnalyst, Contractor, BuildingOfficial]
    code: 200
    input: ["technician_id?", "report_date?"]
    output: DailyInspectionReport[]
    side_effects: []

  - method: POST
    path: "/api/daily-reports/{id}/acknowledge"
    description: "Building official acknowledges receipt of a daily report."
    roles: [BuildingOfficial]
    code: 200
    input: []
    output: DailyInspectionReport
    side_effects: ["status SUBMITTED -> ACKNOWLEDGED; acknowledged_by set"]

  # --- Discrepancies ---
  - method: POST
    path: "/api/discrepancies"
    description: "Technician raises a discrepancy against contract documents, routed to CONTRACTOR or ENGINEER."
    roles: [Technician]
    code: 201
    input: [project_id, subject, description, routed_to, "scope_item_id?"]
    output: DiscrepancyTicket
    side_effects: ["status=RAISED; posture recomputed (open discrepancy blocks READY_FOR_LETTER)"]

  - method: GET
    path: "/api/projects/{id}/discrepancies"
    description: "List discrepancies of a project."
    roles: [AgencyAdmin, ProjectManager, EngineerOfRecord, Technician, LabAnalyst, Contractor, BuildingOfficial]
    code: 200
    input: ["status?"]
    output: DiscrepancyTicket[]
    side_effects: []

  - method: POST
    path: "/api/discrepancies/{id}/respond"
    description: "Routed party responds: Contractor when routed_to=CONTRACTOR, EngineerOfRecord when routed_to=ENGINEER."
    roles: [Contractor, EngineerOfRecord]
    code: 200
    input: [response_text]
    output: DiscrepancyTicket
    side_effects: ["status RAISED -> RESPONSE_SUBMITTED"]

  - method: POST
    path: "/api/discrepancies/{id}/resolve"
    description: "Technician accepts (outcome=ACCEPT -> RESOLVED) or rejects (outcome=REJECT -> back to RAISED, round_count += 1) the response."
    roles: [Technician]
    code: 200
    input: [outcome]
    output: DiscrepancyTicket
    side_effects: ["ACCEPT: status -> RESOLVED, posture recomputed; REJECT: status -> RAISED, round_count += 1"]

  # --- Final compliance letter ---
  - method: POST
    path: "/api/projects/{id}/issue-letter"
    description: "Issue the final compliance letter. Requires compliance_posture == READY_FOR_LETTER; sets letter_status=ISSUED, status=COMPLETED."
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["letter fields set; status -> COMPLETED; posture -> LETTER_ISSUED"]

  - method: POST
    path: "/api/projects/{id}/void-letter"
    description: "Building official voids an issued letter; project returns to ACTIVE and posture is recomputed."
    roles: [BuildingOfficial]
    code: 200
    input: [void_reason]
    output: Project
    side_effects: ["letter_status -> VOIDED; status -> ACTIVE; posture recomputed"]

  # --- Ops / test-driving ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock (ISO8601). Server startup default is exactly 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [AgencyAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []

  - method: POST
    path: "/api/ops/run-daily-sweep"
    description: "Ops checkpoint: recomputes escalation_score for every OPEN NCR and escalates those with score >= 70."
    roles: [AgencyAdmin]
    code: 200
    input: []
    output: "{ escalated_ncr_ids: string[] }"
    side_effects: ["OPEN NCRs with score >= 70 -> ESCALATED; affected projects' posture recomputed"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed for this endpoint, or entity-backed ownership check failed (e.g. technician completing another technician's assignment)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path identifier does not exist (validated left-to-right)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing/invalid required field, bad enum value, malformed date/time, end_time <= start_time, duplicate permit_number/employee_code/lab_code at creation" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state permitting the operation (e.g. dispatch a CANCELLED assignment, acknowledge an ACKNOWLEDGED report, record-break on a CAST sample)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_project_version does not match the project's current version on SSI approval (OCC)" }
  - { id: ERR_PROJECT_COMPLETED, http: 409, condition: "Mutation under a project whose status is COMPLETED (letter issued)" }
  - { id: ERR_SSI_NOT_APPROVED, http: 422, condition: "Assignment creation when the project has no current APPROVED SSI revision" }
  - { id: ERR_REFERENCE_MISMATCH, http: 422, condition: "Cross-reference resolves outside the expected scope: scope item of another project/revision, DIR assignment of another technician/project/date, evidence test not CONFORMING or on another scope item" }
  - { id: ERR_TECHNICIAN_INACTIVE, http: 409, condition: "Dispatch or result entry references an INACTIVE technician" }
  - { id: ERR_CERTIFICATION_MISSING, http: 409, condition: "Technician holds no certification for the scope item's test_method" }
  - { id: ERR_CERTIFICATION_INSUFFICIENT, http: 409, condition: "Certification level below the scope item's required_cert_level" }
  - { id: ERR_CERTIFICATION_EXPIRED, http: 409, condition: "Certification expires_at is not after the assignment work_date" }
  - { id: ERR_TECHNICIAN_DOUBLE_BOOKED, http: 409, condition: "New window overlaps an existing REQUESTED/DISPATCHED assignment for the same technician on the same work_date (half-open intervals; adjacency allowed)" }
  - { id: ERR_NO_RESULT_RECORDED, http: 409, condition: "Completing an assignment with no recorded FieldTest and no LabSample" }
  - { id: ERR_TEST_NOT_VOIDABLE, http: 409, condition: "Voiding a FieldTest whose result is NONCONFORMING or whose status is already VOIDED" }
  - { id: ERR_BREAK_DATE_MISMATCH, http: 422, condition: "break_scheduled_date does not equal date(break_due_at)" }
  - { id: ERR_LAB_DAY_CAPACITY, http: 409, condition: "Lab day load already equals daily_break_capacity for the requested break date" }
  - { id: ERR_DUPLICATE_DAILY_REPORT, http: 409, condition: "A daily report already exists for (project_id, technician_id, report_date)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "NCR verify attempted by the technician whose result raised the NCR" }
  - { id: ERR_DISCREPANCY_ROUTING, http: 403, condition: "Discrepancy respond attempted by a role that does not match routed_to" }
  - { id: ERR_POSTURE_NOT_READY, http: 409, condition: "issue-letter attempted while compliance_posture != READY_FOR_LETTER" }
  - { id: ERR_LETTER_ALREADY_ISSUED, http: 409, condition: "issue-letter attempted while letter_status == ISSUED" }
  - { id: ERR_NO_LETTER_TO_VOID, http: 409, condition: "void-letter attempted while letter_status != ISSUED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AgencyAdmin
    description: "Agency back-office administrator; owns reference data and ops checkpoints."
    identity: opaque
    exclusive_operations:
      - "POST /api/projects"
      - "POST /api/technicians"
      - "POST /api/technicians/{id}/certifications"
      - "POST /api/technicians/{id}/deactivate"
      - "POST /api/labs"
      - "POST /api/_clock/set_current_utc"
      - "POST /api/ops/run-daily-sweep"
    shared_operations: ["All GET endpoints"]

  - name: ProjectManager
    description: "Agency project manager; owns the statement of special inspections lifecycle and the dispatch board."
    identity: opaque
    exclusive_operations:
      - "POST /api/projects/{id}/ssi-revisions"
      - "POST /api/ssi-revisions/{id}/submit"
      - "POST /api/assignments"
      - "POST /api/assignments/{id}/dispatch"
      - "POST /api/assignments/{id}/cancel"
      - "POST /api/field-tests/{id}/void"
      - "POST /api/projects/{id}/issue-letter"
    shared_operations: ["All GET endpoints"]

  - name: EngineerOfRecord
    description: "Structural engineer of record; approves SSI revisions and answers engineering discrepancies."
    identity: opaque
    exclusive_operations:
      - "POST /api/ssi-revisions/{id}/approve"
    shared_operations:
      - "All GET endpoints"
      - "POST /api/discrepancies/{id}/respond (only when routed_to == ENGINEER)"

  - name: Technician
    description: "Certified field inspector/technician; executes dispatches, records results, files daily reports, verifies corrections (never their own)."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /api/assignments/{id}/complete (own assignments only)"
      - "POST /api/field-tests"
      - "POST /api/lab-samples"
      - "POST /api/daily-reports"
      - "POST /api/discrepancies"
      - "POST /api/discrepancies/{id}/resolve"
      - "POST /api/ncrs/{id}/verify (segregation of duties enforced)"
    shared_operations: ["All GET endpoints"]

  - name: LabAnalyst
    description: "Laboratory analyst; schedules and records cylinder breaks."
    identity: opaque
    exclusive_operations:
      - "POST /api/lab-samples/{id}/schedule-break"
      - "POST /api/lab-samples/{id}/record-break"
      - "POST /api/lab-samples/{id}/discard"
    shared_operations: ["All GET endpoints"]

  - name: Contractor
    description: "General contractor; submits NCR corrections and answers contractor-routed discrepancies."
    identity: opaque
    exclusive_operations:
      - "POST /api/ncrs/{id}/submit-correction"
    shared_operations:
      - "All GET endpoints"
      - "POST /api/discrepancies/{id}/respond (only when routed_to == CONTRACTOR)"

  - name: BuildingOfficial
    description: "Authority-having-jurisdiction building official; acknowledges daily reports and may void an issued letter."
    identity: opaque
    exclusive_operations:
      - "POST /api/daily-reports/{id}/acknowledge"
      - "POST /api/projects/{id}/void-letter"
    shared_operations: ["All GET endpoints"]
