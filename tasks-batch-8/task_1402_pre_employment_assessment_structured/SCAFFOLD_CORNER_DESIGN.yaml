            - { call: "POST /talent/vendors", payload: { name: "Acme Assessments" }, as: TalentAssessmentAdmin, captures: { v: $.data.id } }
            - { call: "POST /talent/instruments", payload: { vendor_id: "${v}", code: "COG-A", instrument_type: "COGNITIVE_ABILITY", title: "Cognitive Battery A", max_score: 100, pass_floor: 40 }, as: TalentAssessmentAdmin, captures: { i: $.data.id } }
            - { call: "POST /talent/instruments/${i}/evidence", payload: { evidence_type: "CRITERION", title: "Criterion validity study", issuer: "IO Psych Lab", effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/evidence", payload: { evidence_type: "CONTENT", title: "Content validity study", issuer: "IO Psych Lab", effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/submit-validation-review", as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/validate", as: TalentAssessmentAdmin }
            - { call: "POST /talent/interview-guides", payload: { title: "Structured Guide v1", rubric_items: [{ competency_code: "COMM", weight: 0.6, scale_max: 5 }, { competency_code: "ANAL", weight: 0.4, scale_max: 5 }] }, as: TalentAssessmentAdmin, as_user_id: admin-1, captures: { g: $.data.id } }
            - { call: "POST /talent/interview-guides/${g}/pilot", as: TalentAssessmentAdmin, as_user_id: admin-1 }
            - { call: "POST /talent/interview-guides/${g}/approve", as: TalentAssessmentAdmin, as_user_id: admin-2 }
            - { call: "POST /talent/requisitions", payload: { title: "Senior Analyst", department: "Risk", openings_count: 2 }, as: HiringManager, as_user_id: hm-1, captures: { r: $.data.id } }
            - { call: "POST /talent/requisitions/${r}/cycles", payload: { instrument_id: "${i}", guide_id: "${g}", label: "Fall Cycle", administration_window_start: "2026-08-10T00:00:00Z", administration_window_end: "2026-08-20T00:00:00Z", max_sessions_per_day: 8 }, as: HiringManager, as_user_id: hm-1, captures: { cy: $.data.id } }
            - { call: "POST /talent/cycles/${cy}/activate", as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/interviewers", payload: { full_name: "Ivy One", email: "ivy1@x.com", department: "Risk" }, as: TalentAssessmentAdmin, captures: { iv1: $.data.id } }
            - { call: "POST /talent/interviewers/${iv1}/calibrations", payload: { guide_id: "${g}" }, as: TalentAssessmentAdmin, captures: { cal1: $.data.id } }
            - { call: "POST /talent/calibrations/${cal1}/certify", payload: { practice_score: 0.85 }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/candidates", payload: { external_ref: "C-1", full_name: "Cand One", email: "c1@x.com", group_code: "GROUP_A" }, as: HiringManager, as_user_id: hm-1, captures: { c1: $.data.id } }
            - { call: "POST /talent/cycles/${cy}/invitations", payload: { candidate_id: "${c1}" }, as: HiringManager, as_user_id: hm-1, captures: { a1: $.data.id } }
            - { call: "POST /talent/assessments/${a1}/schedule", payload: { scheduled_for: "2026-08-10T09:00:00Z" }, as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/assessments/${a1}/accommodation-requests", payload: { request_type: "EXTENDED_TIME", justification: "Candidate requires extended time due to documented need.", requested_extension_days: 2 }, as: Candidate, as_user_id: "${c1}", captures: { ar1: $.data.id } }
            - { call: "POST /talent/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/assessments/${a1}/start", as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/assessments/${a1}/complete", payload: { raw_score: 72 }, as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/cycles/${cy}/sessions", payload: { candidate_id: "${c1}", interviewer_id: "${iv1}", guide_id: "${g}", scheduled_start: "2026-08-14T10:00:00Z", scheduled_end: "2026-08-14T11:00:00Z" }, as: HiringManager, as_user_id: hm-1, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /talent/candidates/${c1}/withdraw", as: Candidate, as_user_id: "${c1}", captures: { cst: $.data.status } }
            - { call: "GET /talent/assessments/${a1}", as: HiringManager, as_user_id: hm-1, captures: { ast: $.data.admin_status, afb: $.data.feedback_status } }
            - { call: "GET /talent/sessions/${s1}", as: TalentAssessmentAdmin, captures: { sst: $.data.status, srn: $.data.cancellation_reason } }
            - { call: "GET /talent/accommodation-requests/${ar1}", as: ComplianceOfficer, captures: { arst: $.data.status } }
            - { call: "GET /talent/cycles/${cy}", as: ComplianceOfficer, captures: { cnt: $.data.active_candidate_count } }
            - { call: "GET /talent/interviewers/${iv1}", as: TalentAssessmentAdmin, captures: { mins: $.data.committed_minutes_total } }
            - { call: "POST /talent/cycles/${cy}/invitations", payload: { candidate_id: "${c1}" }, as: HiringManager, as_user_id: hm-1, captures: { err: $.data.error_id } }
          assert:
            - "candidate.status == WITHDRAWN"
            - "conditional cascade: a1 is COMPLETED (terminal) so it is NOT cancelled — admin_status stays COMPLETED and feedback_status stays NOT_SENT"
            - "s1 (still SCHEDULED) -> CANCELLED with cancellation_reason == CANDIDATE_WITHDRAWN; committed_minutes_total == 0"
            - "ar1 PENDING -> WITHDRAWN (cascade); cycle active_candidate_count == 1 (a1 terminal, never decremented)"
            - "re-inviting a withdrawn candidate: err == ERR_CANDIDATE_WITHDRAWN (409)"
