            - "SittingRequest.${req2_id}.status == CANCELLED with cancelled_reason == 'OWNER_SUSPENDED' (link 1)"
            - "SittingClaim.${claimF3_id}.status == REJECTED (link 2 — rejected by the request cancellation, not directly by the suspend)"
            - "SittingAssignment.${asg_id}.status == CANCELLED_BY_SITTER (sitter-side cascade link 1)"
            - "Member.${f2_id}.provisional_credit_hours == 0.00 (link 2 — reversal caused by the assignment cancellation)"
            - "Member.${f2_id}.credit_balance_hours == 10.00 and reliability_score == 50 (suspension cascade applies no late-cancel penalty)"

      - name: dispute_resolve_transitive_settlement_ledger_chain
        grounds:
          - state_machines.Dispute.transitions.MEDIATION_to_RESOLVED_DISMISSED
          - state_machines.SittingAssignment.transitions.DISPUTED_to_SETTLED
          - calculations.sitting_credit_settlement
          - calculations.member_credit_balance
