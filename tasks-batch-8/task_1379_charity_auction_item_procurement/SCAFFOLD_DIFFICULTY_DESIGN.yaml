  - rule_id: cross_entity_state_dependency
    instances:
      - name: bid_requires_event_bidding_open
        grounds:
          - state_machines.GalaEvent.CATALOGING_to_BIDDING_OPEN
          - errors[ERR_EVENT_PHASE_FORBIDDEN]
        distinguishing_aspect: |
          Pair Bid -> GalaEvent: the bundle is PUBLISHED (its own machine satisfied)
          yet the bid is rejected solely because the sibling event is still
          CATALOGING — the bid's valid next-state set depends on event phase.
        test_recipe:
          setup:
            - "Event in CATALOGING with one PUBLISHED bundle (FMV 40000, min_bid 12000); bidder br registered"
          setup_api_calls:
            - { call: "POST /gala-events", payload: { name: "Gala S", gala_date: "2026-11-20", bidding_opens_at: "2026-11-20T18:00:00Z", bidding_closes_at: "2026-11-20T22:00:00Z", min_bid_pct_bps: 3000, min_bid_increment_cents: 500, min_bid_floor_cents: 1000, bid_increment_tiers: [{up_to_cents: 100000, increment_cents: 2500}, {up_to_cents: 500000, increment_cents: 5000}, {up_to_cents: null, increment_cents: 10000}], ack_threshold_cents: 25000, solicitation_cooldown_days: 30, cert_validity_months: 12, cert_grace_days: 30 }, as: GalaAdmin, captures: { ev: "$.data.id" } }
