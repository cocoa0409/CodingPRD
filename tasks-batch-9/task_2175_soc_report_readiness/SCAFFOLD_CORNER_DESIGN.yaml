          setup_api_calls:
            - call: "POST /soc/engagements"
              payload: { client_name: "Frozen Boundary", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"] }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { eng: $.data.id, eng_v: $.data.version }
            - call: "POST /soc/system-descriptions"
