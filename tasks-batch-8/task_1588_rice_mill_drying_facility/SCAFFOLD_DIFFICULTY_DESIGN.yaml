  - rule_id: non_linear_state_machine
    instances:
      - name: lot_regrade_self_loop_cycle
        grounds:
          - state_machines.PaddyLot.GRADED_to_GRADED
          - calculations.grade_determination
        distinguishing_aspect: |
          PaddyLot has a cyclic self-loop (GRADED -> GRADED via regrade) — a
          non-linear machine on the lot entity; regrading with worse factors
          keeps status GRADED but moves grade US_NO_2 -> US_NO_3 and reprices
          the line from 498904 to 487066 cents.
        test_recipe:
          setup:
            - "Season INTAKE_OPEN; grower FARM-001; contract 400.00 cwt base 1500, adjustments US_NO_2 -25 / US_NO_3 -60"
            - "Contract lot net 363.00 cwt graded M 18.5 FM 0.4 DMG 0.4 BRK 2.0 -> US_NO_2, dry 338.24"
          setup_api_calls:
            - call: "POST /mill/seasons"
              payload: { name: "2026 Fall", intake_start_date: "2026-08-01", intake_end_date: "2026-10-31", spot_daily_cap: 2 }
              as: MillAdmin
              captures: { s_id: $.data.id }
