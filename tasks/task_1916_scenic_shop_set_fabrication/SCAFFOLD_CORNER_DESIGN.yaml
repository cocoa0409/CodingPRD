              as: Estimator
              captures: { bid_id: $.data.id }
            - call: "POST /scenic/bids/${bid_id}/submit"
              payload: {}
              as: Estimator
            - call: "POST /scenic/_clock/set-current-utc"
              payload: { to_iso8601: "2026-08-07T00:00:00Z" }
              as: ShopAdmin
          trigger:
            - call: "POST /scenic/bids/${bid_id}/accept"
              payload: {}
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { err: $.data.error_id }
          assert:
            - "fails with ERR_BID_EXPIRED (HTTP 409); Bid.${bid_id}.status == SUBMITTED (epoch has not run)"

      - name: run_epoch_expires_stale_bid_and_bumps_index
        claim_type: violation_to_error
        grounds:
          - state_machines.Bid.SUBMITTED_to_EXPIRED
          - 'endpoints["POST /scenic/shops/{shopId}/run-epoch"]'
        distinguishing_aspect: "The ops-run checkpoint applies the scheduled/deferred rule: at clock 2026-08-07 the SUBMITTED bid (valid_until 2026-08-06) flips to EXPIRED and epoch_index increments 0 -> 1; a fresh bid (validity 30) survives."
        test_recipe:
          setup: ["shop; two SUBMITTED bids for the same client: B1 validity 5 (expires), B2 validity 30 (survives); clock 2026-08-07"]
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
