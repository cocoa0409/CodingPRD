  - name: authorize_package_chain_mints_authorization_period_and_reanchors_assessment_findings
    grounds:
    - state_machines.AuthorizationPackage.UNDER_REVIEW_to_AUTHORIZED
    - state_machines.CloudServiceOffering.PACKAGE_SUBMITTED_to_AUTHORIZED
    - calculations.poam_remediation_deadline
    - entities.Authorization.fields.expires_at
    - entities.MonitoringPeriod.fields.scan_due_at
    distinguishing_aspect: One AUTHORIZE call propagates four links in order — Authorization row minted, offering driven to
      AUTHORIZED, the 2026-03 MonitoringPeriod auto-created, and the ASSESSMENT PoamItem re-anchored from detected_at 2026-03-01
      to authorized_at 2026-03-30 so deadline_at moves 2026-05-30T00:00:00Z -> 2026-06-28T00:00:00Z; the chain is entity-creation-driven,
