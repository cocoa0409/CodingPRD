            - "RevenueStatement.${stmt_id}.net_distributable_cents == 690000"

      - name: endpoint_ops_day_listing_pages_within_the_facility_filter
        claim_type: standard_crud
        grounds:
          - endpoints[GET /ops-days]
          - entities.OperationsDay.fields.facility_id
        distinguishing_aspect: >
          total_count reports the full filtered population (3) while the page honours
          limit 2 and reports has_more true - the count is not the page length.
        test_recipe:
          setup:
            - "Canonical plant with three OPEN days: 2026-08-03, 2026-08-04 and 2026-08-05."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /facilities"
              payload: { name: "Tulare Digester 1", digester_volume_m3: 6000.000, hydraulic_capacity_tonnes_per_day: 500.000, thermal_regime: "MESOPHILIC", target_temperature_c: 38.0, reserve_target_cents: 4000000, annual_debt_service_cents: 18000000, dscr_minimum: 1.250 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { facility_id: "$.data.id" }
            - call: "POST /ops-days"
              payload: { facility_id: "${facility_id}", ops_date: "2026-08-03" }
              as: ProjectOperator
              as_user_id: "u-ops"
              captures: { day1_id: "$.data.id" }
            - call: "POST /ops-days"
              payload: { facility_id: "${facility_id}", ops_date: "2026-08-04" }
              as: ProjectOperator
              as_user_id: "u-ops"
              captures: { day2_id: "$.data.id" }
            - call: "POST /ops-days"
              payload: { facility_id: "${facility_id}", ops_date: "2026-08-05" }
              as: ProjectOperator
              as_user_id: "u-ops"
              captures: { day3_id: "$.data.id" }
          trigger:
            - call: "GET /ops-days?facility_id=${facility_id}&limit=2&offset=0"
              payload: {}
              as: PipelineScheduler
              as_user_id: "u-sched"
          assert:
            - "HTTP status == 200"
            - "response_type == array"
            - "total_count == 3"
            - "returned item count == 2"
            - "has_more == true"
            - "OperationsDay.${day1_id}.status == OPEN"
            - "OperationsDay.${day1_id}.separation_recorded == false"
            - "OperationsDay.${day3_id}.gas_state == NOT_PRODUCED"

  - section: errors
    instances:
      - name: error_every_unknown_path_id_returns_its_own_not_found_code
        claim_type: error_triggerable
        grounds:
          - validations[priority=30]
          - errors[ERR_FACILITY_NOT_FOUND]
          - errors[ERR_DELIVERY_NOT_FOUND]
          - errors[ERR_OPS_DAY_NOT_FOUND]
          - errors[ERR_INTERCONNECT_NOT_FOUND]
          - errors[ERR_NOMINATION_NOT_FOUND]
          - errors[ERR_PATHWAY_NOT_FOUND]
          - errors[ERR_BATCH_NOT_FOUND]
          - errors[ERR_AUDIT_NOT_FOUND]
          - errors[ERR_APPLICATION_NOT_FOUND]
          - errors[ERR_STATEMENT_NOT_FOUND]
        distinguishing_aspect: >
          Each aggregate owns a distinct 404 code rather than sharing a generic one, so a
          single sweep over twelve detail reads with an unknown id must return twelve
          different error_id values at the same 404 status.
        test_recipe:
          setup:
            - "Empty database; no fixtures at all - the sweep only needs ids that resolve to nothing."
          setup_api_calls: []
          trigger:
            - call: "GET /dairies/9f000000-0000-4000-8000-000000000001"
              payload: {}
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { err_dairy: "$.data.error_id" }
            - call: "GET /facilities/9f000000-0000-4000-8000-000000000002"
              payload: {}
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { err_facility: "$.data.error_id" }
            - call: "GET /feedstock-agreements/9f000000-0000-4000-8000-000000000003"
              payload: {}
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { err_agreement: "$.data.error_id" }
            - call: "GET /feedstock-deliveries/9f000000-0000-4000-8000-000000000004"
              payload: {}
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { err_delivery: "$.data.error_id" }
            - call: "GET /ops-days/9f000000-0000-4000-8000-000000000005"
