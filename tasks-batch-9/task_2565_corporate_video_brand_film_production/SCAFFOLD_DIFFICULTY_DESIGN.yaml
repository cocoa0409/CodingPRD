            - "data.error_id != ERR_REVISION_ROUNDS_EXHAUSTED: Deliverable.${dlv_a}.consumed_review_rounds is 0 against round_entitlement 2"
            - "ChangeOrder.${co_b}.trigger_reason == DELIVERABLE_ADDED_AFTER_SCOPE_LOCK, additional_rounds_granted == 0, amount_cents == 713000"
            - "Before the decision Project.${proj}.review_gate == CHANGE_ORDER_PENDING; after it review_gate == OPEN"
            - "The second submit returns HTTP 200, DeliverableVersion.${ver_a1}.review_status == SUBMITTED with round_index == 1, and Deliverable.${dlv_a}.status == IN_REVIEW"
