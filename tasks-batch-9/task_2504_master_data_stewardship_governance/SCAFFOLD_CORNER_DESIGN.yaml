      - name: scorecard_basis_divergence_corner
        claim_type: Variant Divergence
        grounds:
          - calculations.domain_quality_scorecard.variants
        excluded_because:
          difficulty_instance: scorecard_provisional_vs_certified_denominator_divergence
          rationale: "Feeding one measurement set through both bases and showing the denominator-driven delta (89.29 versus 69.44) is precisely that §1.8 dual_variant_calc instance."

      - name: survivorship_variant_selection_corner
        claim_type: Variant Selection
        grounds:
          - calculations.master_record_survivorship_score.variants
        excluded_because:
          difficulty_instance: survivorship_source_priority_vs_score_priority_survivor_swap
          rationale: "Which variant governs is decided by how many candidates sit on the authoritative source, and that §1.8 instance drives both arms - SOURCE_PRIORITY keeping the lower-scoring authoritative record and SCORE_PRIORITY swapping the survivor."

      - name: weighted_score_rounding_accumulation_corner
        claim_type: weighted_scoring
        grounds:
          - calculations.domain_quality_scorecard.precision
        excluded_because:
          difficulty_instance: scorecard_rounds_per_rule_before_summation
          rationale: "The rounding-drift claim (round each rule's earned points first, then sum: 16.55 rather than 16.56) is the entire subject of that §1.8 combinatorial_formula instance."

      - name: freeze_window_adjacency_corner
        claim_type: interval_merge
        grounds:
          - calculations.freeze_window_geometry
        excluded_because:
          difficulty_instance: freeze_window_separation_exactly_72_hours_accepted
          rationale: "Inclusive-endpoint window geometry with the mandatory 72-hour separation - accepted at exactly 72 hours, rejected one second short - is covered in depth by that §1.8 boundary_precision_check instance."

      - name: posture_constraint_propagation_corner
        claim_type: constraint_propagation
        grounds:
          - calculations.domain_posture_recompute
        excluded_because:
          difficulty_instance: posture_multiplier_pinned_once_per_scorecard_run
          rationale: "The pinned evaluation order that keeps the posture/severity_weight dependency from feeding back on itself - one multiplier per request, one recompute after all findings exist - is that §1.8 combinatorial_formula instance."

  # =========================================================================
  - section: validations
    instances:
      - name: entity_backed_role_without_user_id_is_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations.priority_1_ERR_UNAUTHENTICATED
          - roles.DataSteward.identity
        distinguishing_aspect: "DataSteward is entity_backed:Steward, so a request that carries the role header but no X-User-ID cannot be resolved to a steward and must fail at priority 1 with 401 - not as a 403 entitlement failure and not by silently acting as an anonymous steward."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; domain CUSTOMER in DRAFT with an ACTIVE DATA_STEWARD assignment for Sam."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/domains"
              payload: { code: "CUSTOMER", name: "Customer Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 5 }
              as: GovernanceAdmin
              captures: { dom_id: $.data.id, dom_v1: $.data.version }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Sam Steward", email: "sam@mdm.test", certification_level: "SENIOR" }
              as: GovernanceAdmin
              captures: { std_id: $.data.id }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${std_id}", steward_role: "DATA_STEWARD", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v1}" }
              as: GovernanceAdmin
          trigger:
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${std_id}", rule_code: "QR1", dimension: "COMPLETENESS", weight_points: 40, threshold_pct: 90.00, severity: "HIGH" }
              as: DataSteward
              captures: { err: $.data.error_id }
          assert:
            - "the trigger is sent with X-User-Role: DataSteward and NO X-User-ID header (the recipe deliberately omits as_user_id)"
            - "HTTP 401 and ${err} == ERR_UNAUTHENTICATED"
            - "GET /mdm/quality-rules?domain_id=${dom_id} returns total_count == 0"

      - name: role_check_precedes_path_resource_existence
        claim_type: Priority Ordering
        grounds:
          - validations.priority_2_ERR_UNAUTHORIZED
          - validations.priority_3_ERR_DOMAIN_NOT_FOUND
        distinguishing_aspect: "Both a role violation (priority 2) and a missing path resource (priority 3) hold at once; the 403 must win, so an unauthorised caller learns nothing about which domain ids exist."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
          trigger:
            - call: "POST /mdm/domains/00000000-0000-0000-0000-000000000000/activate"
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 and ${err} == ERR_UNAUTHORIZED - not ERR_DOMAIN_NOT_FOUND, even though the domain genuinely does not exist"

      - name: body_schema_check_precedes_body_fk_existence
        claim_type: Priority conflict
        grounds:
          - validations.priority_4_ERR_INVALID_REQUEST
          - validations.priority_5_ERR_STEWARD_NOT_FOUND
        distinguishing_aspect: "One call violates priority 4 (dimension is not a declared enum member) and priority 5 (owner_steward_id names nobody) in one and the same request body; the priority-4 error must be returned, so the ladder cannot be implemented as 'resolve FKs first, then validate the body'."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; domain CUSTOMER in DRAFT with an ACTIVE DATA_STEWARD assignment for Sam."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/domains"
