# =============================================================================
# PRD-Bench Scaffold — §1.0–§1.7
# Task: task_2511_airline_catering_inflight_meal_production
# Difficulty band: beyond Expert (§0.4) — 15 entities, 67 endpoints, 44 errors,
# 12 calculations, 11 state machines, 3 OCC rules.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2511. Airline Catering & Inflight Meal Production (Gate Gourmet): flight schedule feed with
  passenger counts by cabin and meal specification, special meal order capture and last-minute
  change cutoffs, production planning across chill, hot and dry stores with HACCP steps, cart and
  equipment build with seal numbers and loading manifests, on-time delivery to the aircraft with
  slot windows and delay recovery, uplift reconciliation and unused meal disposition rules,
  bonded/international waste handling on arrival, airline audit, specification compliance and
  cost-per-passenger reporting

domain_name: airline-catering-inflight-production
api_prefix: ""          # flat peer collections at the root: /flights, /production-batches, /carts, …

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - version_pinning_on_approval

  entity_topology: graph
  # CartItem is a true many-to-many junction between Cart and ProductionBatch; DeliveryRun is
  # self-referential through recovery_of_run_id; UpliftRecord/WasteManifest/AuditFinding hang off
  # peer aggregates by FK rather than by URL nesting. No single ownership tree exists.

  state_machine_shape: parallel
  # Cart carries two independent axes (build_status × seal_status) on one row; ProductionBatch is
  # cyclic (IN_PRODUCTION → HACCP_HOLD → IN_PRODUCTION, bounded at 2 rework rounds);
  # DeliveryRun forks (DELIVERED | MISSED→RECOVERED) with divergent side-effect sets; Flight is
  # compound (auto-DEPARTED from its runs) with a revert edge (LOADED → PLANNED).

  relationship_patterns:
    - one_to_many          # Flight → ProductionBatch / Cart / LoadingManifest
    - many_to_many         # Cart ↔ ProductionBatch via CartItem
    - self_referential     # DeliveryRun.recovery_of_run_id -> DeliveryRun.id
    - cross_aggregate      # AuditFinding spans Airline and Flight; WasteManifest spans UpliftRecord

  role_model: segregation_of_duties
  # The LoadMaster user who sealed a cart may not be the LoadMaster user who issues the loading
  # manifest that pins that cart's seal; QA verdicts and production release are split across
  # QaOfficer and ProductionSupervisor.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Airline
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Airline customer legal name.
      - name: iata_code
        type: string
        source: input
        description: Two-letter IATA carrier code; unique across airlines.
        constraints: exactly 2 uppercase letters; uniqueness enforced case-sensitively
      - name: waste_regime
        type: enum
        source: input
        description: Arrival waste regime that governs unused-meal disposition and disposal method.
        constraints: one of {BONDED, DOMESTIC}
      - name: special_meal_cutoff_minutes
        type: integer
        source: input
        description: Minutes before Flight.revised_std_utc after which special meal capture and change are refused.
        default: 720
        constraints: 0 <= value <= 4320
      - name: cost_cap_per_pax_cents
        type: integer
        source: input
        description: Contractual ceiling on Flight.cost_per_pax_cents; enforced when cart items are added.
        constraints: ">= 1"
      - name: late_delivery_grace_minutes
        type: integer
        source: input
        description: Free minutes subtracted from DeliveryRun.lateness_minutes before penalty banding.
        default: 10
        constraints: 0 <= value <= 120
      - name: unused_recovery_rate_pct
        type: number
        source: input
        description: Percentage of the blended unit rate credited back for REUSE and DONATE units in the NET_CONSUMED variant.
        default: 30.00
        constraints: 0.00 <= value <= 100.00, two decimals
      - name: spec_deviation_tolerance_pct
        type: number
        source: input
        description: Deviation percentage at or above which uplift reconciliation raises a SPEC_DEVIATION finding.
        default: 5.00
        constraints: 0.00 <= value <= 100.00, two decimals
      - name: status
        type: enum
        source: system
        description: ACTIVE while the airline may be produced for; SUSPENDED once open findings reach OPEN_FINDING_SUSPEND_THRESHOLD.
        default: ACTIVE
        constraints: one of {ACTIVE, SUSPENDED}
      - name: open_finding_count
        type: integer
        source: computed
        description: Count of AuditFinding rows with airline_id == this Airline.id and status == OPEN.
        default: 0
      - name: penalty_accrued_cents
        type: integer
        source: computed
        description: Sum of AuditFinding.penalty_cents over findings with airline_id == this Airline.id and status == ACCEPTED.
        default: 0

  - name: MealSpecification
    parent: Airline
    common_fields: true
    fields:
      - name: airline_id
        type: string
        source: input
        description: FK -> Airline.id; the airline whose contract this specification belongs to.
      - name: spec_code
        type: string
        source: input
        description: Airline-facing specification code; unique per airline_id.
      - name: cabin
        type: enum
        source: input
        description: Cabin the specification serves.
        constraints: one of {FIRST, BUSINESS, ECONOMY}
      - name: meal_code
        type: enum
        source: input
        description: IATA meal code; STANDARD is the cabin's default tray, all others are special meals.
        constraints: one of {STANDARD, VGML, AVML, CHML, GFML}
      - name: storage_class
        type: enum
        source: input
        description: Primary production store the specification is built in.
        constraints: one of {CHILL, HOT, DRY}
      - name: portion_grams
        type: integer
        source: input
        description: Contracted edible portion weight per unit, used for specification compliance.
        constraints: ">= 1"
      - name: gross_weight_grams
        type: integer
        source: input
        description: Gross tray weight per unit including packaging; drives bonded waste mass.
        constraints: ">= 1"
      - name: unit_cost_cents
        type: integer
        source: input
        description: Contracted food cost per unit in cents, before overhead.
        constraints: ">= 1"
      - name: shelf_life_hours
        type: integer
        source: input
        description: Hours from production plan creation during which units of this specification may be released.
        constraints: ">= 1"
      - name: required_haccp_steps
        type: array
        source: input
        description: HACCP step codes that must each carry a latest PASS check before release.
        constraints: non-empty; each element one of {COOK_TEMP, CHILL_DOWN, HOLD_TEMP, BLAST_CHILL}; no duplicates
      - name: load_factor_pct
        type: number
        source: input
        description: Uplift buffer percentage applied only by the PROVISIONAL requirement variant.
        default: 0.00
        constraints: 0.00 <= value <= 25.00, two decimals
      - name: status
        type: enum
        source: input
        description: RETIRED specifications are skipped by production planning and refused for new special meal orders.
        default: ACTIVE
        constraints: one of {ACTIVE, RETIRED}

  - name: Flight
    parent: Airline
    common_fields: true
    fields:
      - name: airline_id
        type: string
        source: input
        description: FK -> Airline.id; the operating carrier taken from the schedule feed.
      - name: flight_number
        type: string
        source: input
        description: Carrier flight designator, e.g. "AN411".
      - name: service_date
        type: string
        source: input
        description: Local service date in YYYY-MM-DD form; unique together with airline_id and flight_number.
      - name: std_utc
        type: datetime
        source: input
        description: Scheduled time of departure from the feed, ISO 8601 UTC with three fractional digits.
      - name: tail_number
        type: string
        source: input
        description: Aircraft registration the equipment build is sized for.
      - name: station_code
        type: string
        source: input
        description: Three-letter catering station code; trucks and stands must share it.
      - name: pax_first
        type: integer
        source: input
        description: Booked passengers in FIRST from the latest feed message.
        default: 0
        constraints: ">= 0"
      - name: pax_business
        type: integer
        source: input
        description: Booked passengers in BUSINESS from the latest feed message.
        default: 0
        constraints: ">= 0"
      - name: pax_economy
        type: integer
        source: input
        description: Booked passengers in ECONOMY from the latest feed message.
        default: 0
        constraints: ">= 0"
      - name: total_pax
        type: integer
        source: computed
        description: pax_first + pax_business + pax_economy.
      - name: delay_minutes
        type: integer
        source: system
        description: Cumulative delay applied through POST /flights/{id}/delays.
        default: 0
      - name: revised_std_utc
        type: datetime
        source: computed
        description: std_utc plus delay_minutes; every slot and cutoff rule reads this, never std_utc.
      - name: special_meal_cutoff_utc
        type: datetime
        source: computed
        description: revised_std_utc minus Airline.special_meal_cutoff_minutes.
      - name: counts_locked_at
        type: datetime
        source: system
        description: Logical-clock instant at which lock-counts ran; null while SCHEDULED.
      - name: status
        type: enum
        source: system
        description: Flight lifecycle state.
        default: SCHEDULED
        constraints: one of {SCHEDULED, COUNTS_LOCKED, PLANNED, LOADED, DEPARTED, RECONCILED, CANCELLED}
      - name: production_hold
        type: boolean
        source: system
        description: Set true when the owning Airline is SUSPENDED while this flight is SCHEDULED or COUNTS_LOCKED; blocks production planning.
        default: false
      - name: units_planned_provisional
        type: integer
        source: computed
        description: PROVISIONAL variant of flight_meal_requirement, refreshed on create and on every pax-counts feed update.
        default: 0
      - name: units_planned
        type: integer
        source: computed
        description: FINAL variant of flight_meal_requirement, written once by production planning as the sum of ProductionBatch.planned_qty.
        default: 0
      - name: units_produced
        type: integer
        source: computed
        description: Sum of ProductionBatch.produced_qty over batches of this flight whose production_status is in {COMPLETED, RELEASED, DISPOSED}.
        default: 0
      - name: units_loaded
        type: integer
        source: computed
        description: Sum of CartItem.qty_units over items with status ACTIVE whose cart belongs to this flight.
        default: 0
      - name: units_scrapped
        type: integer
        source: computed
        description: Sum of ProductionBatch.scrapped_qty over all batches of this flight.
        default: 0
      - name: unit_balance
        type: integer
        source: computed
        description: units_produced minus units_loaded; the conserved quantity of the cart-item void/re-add invariant.
        default: 0
      - name: cost_per_pax_cents
        type: integer
        source: computed
        description: Output of cost_per_passenger_report; 0 while units_loaded == 0.
        default: 0

  - name: SpecialMealOrder
    parent: Flight
    common_fields: true
    fields:
      - name: flight_id
        type: string
        source: input
        description: FK -> Flight.id; the flight the passenger travels on.
      - name: meal_specification_id
        type: string
        source: input
        description: FK -> MealSpecification.id; the requested special meal specification, meal_code != STANDARD.
      - name: substitute_meal_specification_id
        type: string
        source: system
        description: FK -> MealSpecification.id; specification substituted by production, null until status becomes SUBSTITUTED.
      - name: passenger_ref
        type: string
        source: input
        description: Airline passenger name record reference.
      - name: seat_number
        type: string
        source: input
        description: Assigned seat; unique per flight_id across orders whose status is in {REQUESTED, CONFIRMED, SUBSTITUTED}.
      - name: cabin
        type: enum
        source: computed
        description: Copied from the requested MealSpecification.cabin at creation.
        constraints: one of {FIRST, BUSINESS, ECONOMY}
      - name: requested_at
        type: datetime
        source: system
        description: Logical-clock instant of capture; compared against Flight.special_meal_cutoff_utc at lock and after every delay.
      - name: status
        type: enum
        source: system
        description: Order lifecycle state; LATE_REJECTED is reversible because a delay moves the cutoff later.
        default: REQUESTED
        constraints: one of {REQUESTED, CONFIRMED, SUBSTITUTED, CANCELLED, LATE_REJECTED}

  - name: ProductionBatch
    parent: Flight
    common_fields: true
    fields:
      - name: flight_id
        type: string
        source: input
        description: FK -> Flight.id; the flight this batch is produced for.
      - name: meal_specification_id
        type: string
        source: input
        description: FK -> MealSpecification.id; the specification produced.
      - name: store_zone
        type: enum
        source: computed
        description: Store the batch was allocated to by production_plan_zone_allocation; equals the specification's storage_class unless is_overflow is true.
        constraints: one of {CHILL, HOT, DRY}
      - name: planned_qty
        type: integer
        source: computed
        description: Units allocated to this zone by production_plan_zone_allocation; always >= 1.
      - name: produced_qty
        type: integer
        source: system
        description: Units actually produced, written by POST /production-batches/{id}/complete.
        default: 0
      - name: scrapped_qty
        type: integer
        source: system
        description: planned_qty minus produced_qty at completion.
        default: 0
      - name: production_status
        type: enum
        source: system
        description: Batch lifecycle state; the HACCP_HOLD → IN_PRODUCTION edge is the rework cycle.
        default: PLANNED
        constraints: one of {PLANNED, IN_PRODUCTION, HACCP_HOLD, COMPLETED, RELEASED, REJECTED, DISPOSED}
      - name: haccp_rework_rounds
        type: integer
        source: system
        description: Times this batch re-entered IN_PRODUCTION from HACCP_HOLD; capped at HACCP_MAX_REWORK_ROUNDS.
        default: 0
      - name: haccp_risk_score
        type: number
        source: computed
        description: Output of haccp_risk_score; a reported food-safety metric clamped at 100.00, not itself a release gate.
        default: 0.00
      - name: release_deadline_utc
        type: datetime
        source: computed
        description: Output of batch_release_deadline; release and cart loading are refused once the logical clock passes it.
      - name: released_at
        type: datetime
        source: system
        description: Logical-clock instant of release; null until RELEASED.
      - name: released_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProductionSupervisor who released the batch.
      - name: is_overflow
        type: boolean
        source: computed
        description: True when the batch holds the fallback-zone remainder of its specification's requirement.
        default: false

  - name: HaccpCheck
    parent: ProductionBatch
    common_fields: false
    fields:
      - name: production_batch_id
        type: string
        source: input
        description: FK -> ProductionBatch.id; the batch the temperature reading belongs to.
      - name: step_code
        type: enum
        source: input
        description: HACCP step the reading was taken at.
        constraints: one of {COOK_TEMP, CHILL_DOWN, HOLD_TEMP, BLAST_CHILL}
      - name: measured_temp_c
        type: number
        source: input
        description: Probe reading in degrees Celsius, one decimal.
        constraints: -40.0 <= value <= 200.0
      - name: measured_at_utc
        type: datetime
        source: system
        description: Logical-clock instant at which the check was recorded.
      - name: verdict
        type: enum
        source: computed
        description: Output of haccp_check_verdict; never client-supplied.
        constraints: one of {PASS, FAIL}
      - name: sequence_no
        type: integer
        source: system
        description: 1-based per-batch monotonic counter used as the deterministic latest-check ordering key.
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the QaOfficer who recorded the reading.

  - name: Cart
    parent: Flight
    common_fields: true
    fields:
      - name: flight_id
        type: string
        source: input
        description: FK -> Flight.id; the flight the cart is built for.
      - name: cart_code
        type: string
        source: input
        description: Physical equipment code stencilled on the cart.
      - name: cart_type
        type: enum
        source: input
        description: Equipment type.
        constraints: one of {STD_HALF, STD_FULL, OVEN_RACK, DRY_BOX}
      - name: storage_class
        type: enum
        source: input
        description: Store class the cart may carry; must equal the store_zone of every batch loaded into it.
        constraints: one of {CHILL, HOT, DRY}
      - name: capacity_units
        type: integer
        source: input
        description: Maximum ACTIVE CartItem units the cart holds.
        constraints: 1 <= value <= 400
      - name: galley_position
        type: string
        source: input
        description: Target galley position on the aircraft, e.g. "G4-L".
      - name: build_status
        type: enum
        source: system
        description: Physical build axis, independent of seal_status.
        default: EMPTY
        constraints: one of {EMPTY, BUILDING, BUILT, LOADED, RETURNED}
      - name: seal_status
        type: enum
        source: system
        description: Security seal axis, independent of build_status.
        default: UNSEALED
        constraints: one of {UNSEALED, SEALED, BROKEN, RESEALED}
      - name: seal_number
        type: string
        source: system
        description: Seal currently fitted; unique across all carts that ever carried it.
      - name: seal_count
        type: integer
        source: system
        description: Number of seals fitted so far; 2 or more means the cart was resealed.
        default: 0
      - name: sealed_by_user_id
        type: string
        source: system
        description: X-User-ID of the LoadMaster who fitted the current seal; drives segregation of duties at manifest issue.
      - name: loaded_units
        type: integer
        source: computed
        description: Sum of qty_units over CartItem rows of this cart with status ACTIVE.
        default: 0

  - name: CartItem
    parent: Cart
    common_fields: true
    fields:
      - name: cart_id
        type: string
        source: input
        description: FK -> Cart.id; the cart the units were loaded into.
      - name: production_batch_id
        type: string
        source: input
        description: FK -> ProductionBatch.id; the batch the units came from.
      - name: qty_units
        type: integer
        source: input
        description: Units transferred from the batch into the cart.
        constraints: ">= 1"
      - name: meal_code
        type: enum
        source: computed
        description: Copied from the batch's MealSpecification.meal_code.
        constraints: one of {STANDARD, VGML, AVML, CHML, GFML}
      - name: status
        type: enum
        source: system
        description: VOID items are excluded from every unit and cost aggregate.
        default: ACTIVE
        constraints: one of {ACTIVE, VOID}
      - name: voided_at
        type: datetime
        source: system
        description: Logical-clock instant the item was voided; null while ACTIVE.

  - name: LoadingManifest
    parent: Flight
    common_fields: true
    fields:
      - name: flight_id
        type: string
        source: input
        description: FK -> Flight.id; the flight the manifest covers.
      - name: manifest_number
        type: string
        source: system
        description: "Deterministic label MFST-{Flight.flight_number}-{n}, n being the 1-based creation ordinal of manifests on this flight."
      - name: status
        type: enum
        source: system
        description: Manifest lifecycle state; AMENDED means the pinned snapshot no longer matches reality.
        default: DRAFT
        constraints: one of {DRAFT, ISSUED, AMENDED, VOID}
      - name: cart_seal_snapshot
        type: array
        source: computed
        description: "Pinned at issue: one object {cart_id, seal_number, cart_version, units} per Cart of the flight whose build_status is BUILT, ordered by Cart.created_at ASC."
      - name: total_units
        type: integer
        source: computed
        description: Sum of the units values in cart_seal_snapshot at issue; 0 while DRAFT.
        default: 0
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant of issue; null while DRAFT.
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the LoadMaster who issued the manifest.
      - name: amendment_count
        type: integer
        source: system
        description: Times the pinned snapshot was invalidated after issue.
        default: 0

  - name: Truck
    parent: null
    common_fields: true
    fields:
      - name: station_code
        type: string
        source: input
        description: Catering station the high-lift truck is based at.
      - name: registration
        type: string
        source: input
        description: Vehicle registration; unique per station_code.
      - name: buffer_minutes
        type: integer
        source: input
        description: Minimum turnaround gap required between two runs on this truck.
        default: 20
        constraints: 0 <= value <= 120
      - name: status
        type: enum
        source: input
        description: MAINTENANCE trucks cannot be reserved.
        default: ACTIVE
        constraints: one of {ACTIVE, MAINTENANCE}

  - name: Stand
    parent: null
    common_fields: true
    fields:
      - name: station_code
        type: string
        source: input
        description: Airport station the aircraft stand belongs to.
      - name: stand_code
        type: string
        source: input
        description: Stand designator; unique per station_code.
      - name: max_concurrent_runs
        type: integer
        source: input
        description: Number of catering runs that may occupy the stand at any single instant.
        default: 2
        constraints: 1 <= value <= 6
      - name: status
        type: enum
        source: input
        description: CLOSED stands cannot be reserved.
        default: ACTIVE
        constraints: one of {ACTIVE, CLOSED}

  - name: DeliveryRun
    parent: LoadingManifest
    common_fields: true
    fields:
      - name: loading_manifest_id
        type: string
        source: input
        description: FK -> LoadingManifest.id; the issued manifest the run delivers against.
      - name: truck_id
        type: string
        source: input
        description: FK -> Truck.id; the high-lift truck occupied for the window.
      - name: stand_id
        type: string
        source: input
        description: FK -> Stand.id; the aircraft stand occupied for the window.
      - name: recovery_of_run_id
        type: string
        source: system
        description: FK -> DeliveryRun.id; the MISSED run this run recovers, null for first-attempt runs.
      - name: window_start_utc
        type: datetime
        source: input
        description: Inclusive start of the delivery slot.
      - name: window_end_utc
        type: datetime
        source: input
        description: Slot end; exclusive for truck-buffer arithmetic and inclusive for stand-occupancy arithmetic.
      - name: status
        type: enum
        source: system
        description: Run lifecycle state; MISSED and DELIVERED are the two fork outcomes.
        default: RESERVED
        constraints: one of {RESERVED, RESCHEDULED, EN_ROUTE, AT_AIRCRAFT, DELIVERED, MISSED, RECOVERED, CANCELLED}
      - name: dispatched_at_utc
        type: datetime
        source: system
        description: Logical-clock instant of the DISPATCH event.
      - name: arrived_at_utc
        type: datetime
        source: system
        description: Logical-clock instant of the ARRIVE event.
      - name: delivered_at_utc
        type: datetime
        source: system
        description: Logical-clock instant of the DELIVER event.
      - name: lateness_minutes
        type: integer
        source: computed
        description: Output of delivery_lateness_penalty; 0 unless delivered after window_end_utc.
        default: 0
      - name: penalty_cents
        type: integer
        source: computed
        description: Output of delivery_lateness_penalty; MISSED runs carry the flat miss penalty instead.
        default: 0
      - name: miss_reason
        type: enum
        source: system
        description: Reason recorded with the MISS event, or SLOT_LOST when a delay cascade cancelled the slot.
        constraints: one of {SLOT_LOST, AIRCRAFT_NOT_READY, TRAFFIC, EQUIPMENT_FAILURE}

  - name: UpliftRecord
    parent: Flight
    common_fields: true
    fields:
      - name: flight_id
        type: string
        source: input
        description: FK -> Flight.id; the flight being reconciled.
      - name: lines
        type: array
        source: input
        description: "Submitted as [{meal_specification_id, consumed_units, returned_units}] and returned augmented with uplifted_units, line_gross_cents, reuse_units, donate_units and destroy_units, always ordered by MealSpecification.spec_code ASC."
      - name: uplifted_units
        type: integer
        source: computed
        description: Sum of ACTIVE CartItem.qty_units on the flight at the moment of reconciliation.
      - name: consumed_units
        type: integer
        source: computed
        description: Sum of the submitted consumed_units across lines.
      - name: returned_units
        type: integer
        source: computed
        description: Sum of the submitted returned_units across lines.
      - name: unused_units
        type: integer
        source: computed
        description: uplifted_units minus consumed_units; equals returned_units once the mismatch check passes.
      - name: gross_cost_cents
        type: integer
        source: computed
        description: GROSS_UPLIFTED variant of uplift_cost_reconciliation.
      - name: net_cost_cents
        type: integer
        source: computed
        description: NET_CONSUMED variant of uplift_cost_reconciliation; equals gross_cost_cents until dispositions are recorded.
      - name: handling_fee_cents
        type: integer
        source: computed
        description: Output of flight_billing_total, tiered on net_cost_cents only.
        default: 0
      - name: late_penalty_cents
        type: integer
        source: computed
        description: Sum of DeliveryRun.penalty_cents over runs of the flight's ISSUED or AMENDED manifest.
        default: 0
      - name: billing_total_cents
        type: integer
        source: computed
        description: Output of flight_billing_total.
        default: 0
      - name: cost_per_pax_cents
        type: integer
        source: computed
        description: Snapshot of Flight.cost_per_pax_cents at reconciliation.
        default: 0
      - name: spec_deviation_pct
        type: number
        source: computed
        description: Output of spec_compliance_deviation, the maximum per-specification deviation on the flight.
        default: 0.00
      - name: seal_mismatch_count
        type: integer
        source: computed
        description: Number of manifest snapshot entries whose seal_number is absent from the observed_seals list submitted with the uplift record; 0 when observed_seals is omitted.
        default: 0
      - name: status
        type: enum
        source: system
        description: Reconciliation lifecycle state.
        default: DRAFT
        constraints: one of {DRAFT, DISPOSITIONED, CLOSED}

  - name: WasteManifest
    parent: UpliftRecord
    common_fields: true
    fields:
      - name: uplift_record_id
        type: string
        source: input
        description: FK -> UpliftRecord.id; the dispositioned reconciliation whose destroy units this manifest covers.
      - name: regime
        type: enum
        source: computed
        description: Copied from the owning Airline.waste_regime at creation.
        constraints: one of {BONDED, DOMESTIC}
      - name: disposal_method
        type: enum
        source: input
        description: Disposal route; BONDED regime forbids LANDFILL.
        constraints: one of {INCINERATION, RENDERING, LANDFILL}
      - name: seal_number
        type: string
        source: input
        description: Customs seal fitted to the sealed waste; unique across waste manifests.
      - name: sealed_weight_grams
        type: integer
        source: computed
        description: Output of waste_manifest_mass; the conserved quantity of the waste-mass invariant.
      - name: status
        type: enum
        source: system
        description: Waste manifest lifecycle state.
        default: DRAFT
        constraints: one of {DRAFT, SEALED, DISPOSED, REJECTED}
      - name: rejection_reason
        type: string
        source: system
        description: Free text recorded with a REJECT transition; null otherwise.

  - name: AuditFinding
    parent: Airline
    common_fields: true
    fields:
      - name: airline_id
        type: string
        source: input
        description: FK -> Airline.id; the airline raising or charged with the finding.
      - name: flight_id
        type: string
        source: input
        description: FK -> Flight.id; the flight the finding is raised against.
      - name: finding_type
        type: enum
        source: input
        description: Audit category.
        constraints: one of {SPEC_DEVIATION, HACCP_BREACH, SEAL_MISMATCH, LATE_DELIVERY}
      - name: severity
        type: enum
        source: input
        description: Severity band driving the penalty multiplier.
        constraints: one of {MINOR, MAJOR, CRITICAL}
      - name: penalty_cents
        type: integer
        source: computed
        description: Output of audit_penalty; never client-supplied.
      - name: status
        type: enum
        source: system
        description: Finding lifecycle state; WITHDRAWN is the compensating end state of ACCEPTED.
        default: OPEN
        constraints: one of {OPEN, DISPUTED, ACCEPTED, WITHDRAWN}
      - name: source
        type: enum
        source: system
        description: SYSTEM when raised by a cascade, AIRLINE when raised through POST /audit-findings.
        constraints: one of {SYSTEM, AIRLINE}
      - name: evidence_ref
        type: string
        source: input
        description: Airline-side evidence reference; null for SYSTEM findings.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Flight
    initial_state: SCHEDULED
    terminal_states: [RECONCILED, CANCELLED]
    shape: compound_with_revert
    transitions:
      - from: SCHEDULED
        to: COUNTS_LOCKED
        trigger: "POST /flights/{id}/lock-counts"
        actor: ScheduleFeedOperator
        preconditions:
          - "Flight.status == SCHEDULED"
          - "Flight.total_pax >= 1"
        side_effects:
          - "sets Flight.counts_locked_at to the logical clock"
          - "every SpecialMealOrder of the flight with status REQUESTED and requested_at <= Flight.special_meal_cutoff_utc becomes CONFIRMED"
          - "every SpecialMealOrder of the flight with status REQUESTED and requested_at > Flight.special_meal_cutoff_utc becomes LATE_REJECTED"
          - "increments Flight.version by 1"
        note: "pax_first / pax_business / pax_economy become immutable from here; PATCH /flights/{id}/pax-counts is refused with ERR_FLIGHT_COUNTS_LOCKED."

      - from: COUNTS_LOCKED
        to: PLANNED
        trigger: "POST /flights/{id}/production-plan"
        actor: ProductionSupervisor
        preconditions:
          - "Flight.status == COUNTS_LOCKED"
          - "Airline.status == ACTIVE for Flight.airline_id"
          - "Flight.production_hold == false"
        side_effects:
          - "evaluates flight_meal_requirement in the FINAL variant"
          - "evaluates production_plan_zone_allocation and creates one ProductionBatch per (specification, zone) pair whose allocated quantity is >= 1, in allocation order"
          - "each created ProductionBatch gets store_zone, planned_qty, is_overflow and release_deadline_utc from batch_release_deadline"
          - "sets Flight.units_planned to the sum of the created ProductionBatch.planned_qty values; units_planned is written exactly once and is never recomputed afterwards"
          - "increments Flight.version by 1"
        note: "A flight whose FINAL requirement is 0 units (total_pax >= 1 but every matching specification RETIRED) still moves to PLANNED with units_planned == 0 and zero batches."

      - from: PLANNED
        to: LOADED
        trigger: "POST /loading-manifests/{id}/issue"
        actor: LoadMaster
        preconditions:
          - "Flight.status == PLANNED"
          - "LoadingManifest.status IN {DRAFT, AMENDED} and LoadingManifest.flight_id == Flight.id"
          - "every Cart with cart.flight_id == Flight.id and cart.loaded_units >= 1 has build_status == BUILT and seal_status IN {SEALED, RESEALED}"
          - "X-User-ID of the issuing LoadMaster differs from Cart.sealed_by_user_id of every cart entering the snapshot"
        side_effects:
          - "pins LoadingManifest.cart_seal_snapshot and total_units (version-pinning on approval)"
          - "sets LoadingManifest.status to ISSUED, issued_at to the logical clock and issued_by_user_id to the acting X-User-ID"
          - "sets Flight.status to LOADED"
          - "increments LoadingManifest.version and Flight.version by 1 each"

      - from: LOADED
        to: PLANNED
        trigger: "system — the flight's ISSUED LoadingManifest transitions to AMENDED"
        actor: system
        preconditions:
          - "the flight's LoadingManifest.status was ISSUED and the pinned snapshot no longer matches the carts"
        side_effects:
          - "sets Flight.status to PLANNED"
          - "increments Flight.version by 1"
        note: "This is the third hop of the HACCP rejection cascade and the third hop of the delay cascade."

      - from: LOADED
        to: DEPARTED
        trigger: "system — the last DeliveryRun of the flight's ISSUED manifest reaches a success-terminal state"
        actor: system
        preconditions:
          - "every DeliveryRun whose loading_manifest_id is the flight's ISSUED manifest has status IN {DELIVERED, RECOVERED, CANCELLED}"
          - "at least one such DeliveryRun has status DELIVERED"
        side_effects:
          - "every Cart of the flight with build_status BUILT becomes LOADED"
          - "increments Flight.version by 1"

      - from: DEPARTED
        to: RECONCILED
        trigger: "POST /flights/{id}/uplift-records"
        actor: ComplianceOfficer
        preconditions:
          - "Flight.status == DEPARTED"
          - "expected_flight_version equals Flight.version"
        side_effects:
          - "creates an UpliftRecord in DRAFT with lines, gross_cost_cents, net_cost_cents, handling_fee_cents, late_penalty_cents, billing_total_cents, cost_per_pax_cents, spec_deviation_pct and seal_mismatch_count"
          - "voids any earlier UpliftRecord of the flight still in DRAFT"
          - "when spec_deviation_pct >= Airline.spec_deviation_tolerance_pct, creates an AuditFinding of type SPEC_DEVIATION with source SYSTEM, severity from spec_compliance_deviation's severity band"
          - "when seal_mismatch_count >= 1, creates an AuditFinding of type SEAL_MISMATCH severity MAJOR with source SYSTEM"
          - "each AuditFinding creation increments Airline.open_finding_count by 1, which may drive Airline ACTIVE -> SUSPENDED"
          - "sets Flight.status to RECONCILED and increments Flight.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /flights/{id}/cancel"
        actor: ScheduleFeedOperator
        preconditions:
          - "Flight.status IN {SCHEDULED, COUNTS_LOCKED, PLANNED, LOADED}"
        side_effects:
          - "every SpecialMealOrder with status IN {REQUESTED, CONFIRMED} becomes CANCELLED"
          - "every ProductionBatch with production_status IN {PLANNED, IN_PRODUCTION, HACCP_HOLD, COMPLETED, RELEASED} becomes REJECTED with scrapped_qty set to planned_qty"
          - "every CartItem with status ACTIVE becomes VOID"
          - "every LoadingManifest with status IN {DRAFT, ISSUED, AMENDED} becomes VOID"
          - "every DeliveryRun with status IN {RESERVED, RESCHEDULED, EN_ROUTE, AT_AIRCRAFT} becomes CANCELLED with miss_reason SLOT_LOST"
          - "increments Flight.version by 1"
        note: "Same edge applies from COUNTS_LOCKED, PLANNED and LOADED; the side-effect set is identical."

      - from: COUNTS_LOCKED
        to: COUNTS_LOCKED
        trigger: "POST /flights/{id}/delays"
        actor: ScheduleFeedOperator
        preconditions:
          - "Flight.status IN {SCHEDULED, COUNTS_LOCKED, PLANNED, LOADED}"
          - "delay_minutes >= 1"
        side_effects:
          - "adds delay_minutes to Flight.delay_minutes and recomputes revised_std_utc and special_meal_cutoff_utc"
          - "every SpecialMealOrder with status LATE_REJECTED whose requested_at <= the recomputed special_meal_cutoff_utc becomes REQUESTED, and — when Flight.counts_locked_at is not null — is immediately re-evaluated to CONFIRMED in the same cascade"
          - "when the cumulative Flight.delay_minutes >= DELAY_RESLOT_THRESHOLD_MINUTES, every DeliveryRun of the flight with status IN {RESERVED, RESCHEDULED} has both window bounds shifted forward by the cumulative Flight.delay_minutes (not by this request's increment) and status set to RESCHEDULED; a shifted window that violates truck buffering or stand occupancy sets the run to CANCELLED with miss_reason SLOT_LOST instead"
          - "each RESCHEDULED or CANCELLED run whose loading_manifest_id points at an ISSUED manifest drives that manifest to AMENDED, which in turn drives Flight LOADED -> PLANNED"
          - "increments Flight.version by 1"
        note: "Flight.status itself is unchanged by a delay; the entry is listed as a self-edge so the cascade is documented on the state machine."

  - entity: SpecialMealOrder
    initial_state: REQUESTED
    terminal_states: [CANCELLED, SUBSTITUTED]
    shape: cyclic
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "system — POST /flights/{id}/lock-counts, or the delay cascade re-evaluating a reopened order"
        actor: system
        preconditions:
          - "SpecialMealOrder.requested_at <= Flight.special_meal_cutoff_utc"
          - "MealSpecification.status == ACTIVE for meal_specification_id"
        side_effects:
          - "the order becomes eligible for the FINAL requirement variant"
          - "increments SpecialMealOrder.version by 1"

      - from: REQUESTED
        to: LATE_REJECTED
        trigger: "system — POST /flights/{id}/lock-counts"
        actor: system
        preconditions:
          - "SpecialMealOrder.requested_at > Flight.special_meal_cutoff_utc"
        side_effects:
          - "the order is excluded from the FINAL requirement variant"
          - "increments SpecialMealOrder.version by 1"
        note: >
          POST /special-meal-orders itself refuses anything captured at or after the then-current
          cutoff (priority 110), so this edge is reachable only when the cutoff moves BACKWARDS
          between capture and lock. PATCH /flights/{id}/schedule is the single operation that can do
          that: it retimes a SCHEDULED flight earlier without re-evaluating any order.

      - from: LATE_REJECTED
        to: REQUESTED
        trigger: "system — POST /flights/{id}/delays moved special_meal_cutoff_utc later than requested_at"
        actor: system
        preconditions:
          - "SpecialMealOrder.requested_at <= the recomputed Flight.special_meal_cutoff_utc"
        side_effects:
          - "increments SpecialMealOrder.version by 1"
          - "when Flight.counts_locked_at is not null the order continues REQUESTED -> CONFIRMED in the same cascade"
        note: "This closes the REQUESTED -> LATE_REJECTED -> REQUESTED cycle; Flight.units_planned is NOT recomputed, so a reopened order after planning surfaces later as specification deviation."

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /special-meal-orders/{id}/changes with action CANCEL"
        actor: AirlineRep
        preconditions:
          - "SpecialMealOrder.status IN {REQUESTED, CONFIRMED}"
          - "Flight.status IN {SCHEDULED, COUNTS_LOCKED}"
          - "logical clock <= Flight.special_meal_cutoff_utc"
          - "X-User-ID == Flight.airline_id"
        side_effects:
          - "frees the seat_number for reuse"
          - "increments SpecialMealOrder.version by 1"
        note: "Same edge from CONFIRMED."

      - from: CONFIRMED
        to: SUBSTITUTED
        trigger: "POST /special-meal-orders/{id}/changes with action SUBSTITUTE"
        actor: ProductionSupervisor
        preconditions:
          - "SpecialMealOrder.status == CONFIRMED"
          - "Flight.status IN {COUNTS_LOCKED, PLANNED}"
          - "the substitute MealSpecification has status ACTIVE, the same airline_id and the same cabin as the original"
        side_effects:
          - "sets substitute_meal_specification_id"
          - "increments SpecialMealOrder.version by 1"

  - entity: ProductionBatch
    initial_state: PLANNED
    terminal_states: [REJECTED, DISPOSED]
    shape: cyclic
    transitions:
      - from: PLANNED
        to: IN_PRODUCTION
        trigger: "POST /production-batches/{id}/start"
        actor: ProductionSupervisor
        preconditions:
          - "ProductionBatch.production_status IN {PLANNED, HACCP_HOLD}"
          - "Flight.status == PLANNED"
          - "logical clock < ProductionBatch.release_deadline_utc"
        side_effects:
          - "increments ProductionBatch.version by 1"

      - from: IN_PRODUCTION
        to: HACCP_HOLD
        trigger: "system — POST /production-batches/{id}/haccp-checks produced verdict FAIL"
        actor: system
        preconditions:
          - "the recorded HaccpCheck.verdict == FAIL"
          - "the resulting fail_count for this batch is <= HACCP_MAX_FAILS"
        side_effects:
          - "recomputes haccp_risk_score"
          - "increments ProductionBatch.version by 1"

      - from: HACCP_HOLD
        to: IN_PRODUCTION
        trigger: "POST /production-batches/{id}/start"
        actor: ProductionSupervisor
        preconditions:
          - "ProductionBatch.production_status == HACCP_HOLD"
          - "logical clock < ProductionBatch.release_deadline_utc"
        side_effects:
          - "increments haccp_rework_rounds by 1 and recomputes haccp_risk_score"
          - "increments ProductionBatch.version by 1"
        note: >
          Rework cycle IN_PRODUCTION -> HACCP_HOLD -> IN_PRODUCTION. A restart is always permitted out
          of HACCP_HOLD; the allowance is enforced later, at release, so a twice-reworked batch can
          still be finished and inspected but can never be certified.

      - from: IN_PRODUCTION
        to: REJECTED
        trigger: "system — POST /production-batches/{id}/haccp-checks produced verdict FAIL whose resulting fail_count exceeds HACCP_MAX_FAILS"
        actor: system
        preconditions:
          - "the recorded HaccpCheck.verdict == FAIL"
          - "the resulting fail_count for this batch is > HACCP_MAX_FAILS; on the pinned ladder this is the third FAIL, at which point haccp_rework_rounds is exactly HACCP_MAX_REWORK_ROUNDS"
        side_effects:
          - "sets scrapped_qty to planned_qty and recomputes haccp_risk_score"
          - "recomputes Flight.units_produced, Flight.units_scrapped and Flight.unit_balance"
          - "creates an AuditFinding of type HACCP_BREACH severity CRITICAL with source SYSTEM, incrementing Airline.open_finding_count, which may drive Airline ACTIVE -> SUSPENDED"
          - "increments ProductionBatch.version by 1"
        note: >
          A batch rejected before release has never been loaded, because POST /carts/{id}/items refuses
          any batch whose production_status != RELEASED. There is therefore no cart, seal or manifest
          to unwind here; the loaded-food cascade lives on the RELEASED -> REJECTED edge below.

      - from: RELEASED
        to: REJECTED
        trigger: "system — POST /production-batches/{id}/haccp-checks produced verdict FAIL on a batch whose production_status == RELEASED (post-release re-inspection)"
        actor: system
        preconditions:
          - "ProductionBatch.production_status == RELEASED"
          - "the recorded HaccpCheck.verdict == FAIL; fail_count and haccp_rework_rounds are NOT consulted, because certified food that fails re-inspection is condemned on the first failure"
        side_effects:
          - "hop 1 — sets scrapped_qty to planned_qty, recomputes haccp_risk_score and recomputes Flight.units_produced, Flight.units_scrapped and Flight.unit_balance"
          - "hop 2 — every CartItem of this batch with status ACTIVE becomes VOID, which drives each affected Cart from build_status BUILT to BUILDING and from seal_status SEALED or RESEALED to BROKEN"
          - "hop 3 — each Cart whose seal_number is pinned in an ISSUED LoadingManifest.cart_seal_snapshot drives that manifest to AMENDED with amendment_count incremented"
          - "hop 4 — each AMENDED manifest drives its Flight from LOADED to PLANNED"
          - "creates an AuditFinding of type HACCP_BREACH severity CRITICAL with source SYSTEM, incrementing Airline.open_finding_count, which may drive Airline ACTIVE -> SUSPENDED"
          - "increments ProductionBatch.version by 1"
        note: >
          This is the four-hop cascade of the scaffold: batch -> cart items -> cart build and seal
          axes -> loading manifest -> flight. It is reachable only from RELEASED, because a cart item
          can only ever reference a RELEASED batch.

      - from: IN_PRODUCTION
        to: COMPLETED
        trigger: "POST /production-batches/{id}/complete"
        actor: ProductionSupervisor
        preconditions:
          - "ProductionBatch.production_status == IN_PRODUCTION"
          - "produced_qty <= ProductionBatch.planned_qty"
        side_effects:
          - "sets produced_qty and scrapped_qty = planned_qty - produced_qty"
          - "recomputes Flight.units_produced, Flight.units_scrapped and Flight.unit_balance"
          - "increments ProductionBatch.version by 1"

      - from: COMPLETED
        to: RELEASED
        trigger: "POST /production-batches/{id}/release"
        actor: ProductionSupervisor
        preconditions:
          - "ProductionBatch.production_status == COMPLETED"
          - "for every step in MealSpecification.required_haccp_steps, the HaccpCheck with the highest sequence_no for that (batch, step) pair exists and has verdict PASS"
          - "ProductionBatch.haccp_rework_rounds < HACCP_MAX_REWORK_ROUNDS"
          - "logical clock <= ProductionBatch.release_deadline_utc"
        side_effects:
          - "sets released_at to the logical clock and released_by_user_id to the acting X-User-ID"
          - "increments ProductionBatch.version by 1"

      - from: RELEASED
        to: DISPOSED
        trigger: "system — POST /uplift-records/{id}/dispositions recorded destroy_units >= 1 for this batch's specification"
        actor: system
        preconditions:
          - "ProductionBatch.production_status == RELEASED"
        side_effects:
          - "increments ProductionBatch.version by 1"

  - entity: Cart
    dimension: build_status
    initial_state: EMPTY
    terminal_states: [RETURNED]
    shape: parallel_dimension_1
    transitions:
      - from: EMPTY
        to: BUILDING
        trigger: "POST /carts/{id}/items"
        actor: LoadMaster
        preconditions:
          - "Cart.build_status IN {EMPTY, BUILDING}"
        side_effects:
          - "recomputes Cart.loaded_units and Flight.units_loaded, Flight.unit_balance and Flight.cost_per_pax_cents"
          - "increments Cart.version by 1"

      - from: BUILDING
        to: BUILT
        trigger: "POST /carts/{id}/build-completion"
        actor: LoadMaster
        preconditions:
          - "Cart.build_status == BUILDING"
          - "Cart.loaded_units >= 1"
        side_effects:
          - "increments Cart.version by 1"

      - from: BUILT
        to: BUILDING
        trigger: "system — an ACTIVE CartItem of this cart became VOID"
        actor: system
        preconditions:
          - "Cart.build_status == BUILT"
        side_effects:
          - "recomputes Cart.loaded_units, Flight.units_loaded and Flight.unit_balance"
          - "drives seal_status SEALED or RESEALED to BROKEN on the same row"
          - "increments Cart.version by 1"

      - from: BUILT
        to: LOADED
        trigger: "system — Flight LOADED -> DEPARTED"
        actor: system
        preconditions:
          - "Cart.build_status == BUILT"
        side_effects:
          - "increments Cart.version by 1"

      - from: LOADED
        to: RETURNED
        trigger: "system — POST /waste-manifests created for the flight's UpliftRecord"
        actor: system
        preconditions:
          - "Cart.build_status == LOADED"
        side_effects:
          - "drives seal_status SEALED or RESEALED to BROKEN on the same row"
          - "increments Cart.version by 1"

  - entity: Cart
    dimension: seal_status
    initial_state: UNSEALED
    terminal_states: []
    shape: parallel_dimension_2
    transitions:
      - from: UNSEALED
        to: SEALED
        trigger: "POST /carts/{id}/seals"
        actor: LoadMaster
        preconditions:
          - "Cart.build_status == BUILT"
          - "expected_cart_version equals Cart.version"
          - "seal_number is not held by any other Cart or WasteManifest"
          - "every CartItem of this cart with status ACTIVE references a ProductionBatch whose production_status == RELEASED"
        side_effects:
          - "sets seal_number, sealed_by_user_id and seal_count = 1"
          - "increments Cart.version by 1"

      - from: SEALED
        to: RESEALED
        trigger: "POST /carts/{id}/seals"
        actor: LoadMaster
        preconditions:
          - "Cart.build_status == BUILT"
          - "expected_cart_version equals Cart.version"
          - "seal_number is not held by any other Cart or WasteManifest"
        side_effects:
          - "replaces seal_number and sealed_by_user_id and increments seal_count by 1"
          - "when this cart is pinned in an ISSUED LoadingManifest.cart_seal_snapshot, drives that manifest to AMENDED, which drives its Flight from LOADED to PLANNED"
          - "increments Cart.version by 1"
        note: "A new seal legitimately supersedes the prior one, which is why this endpoint is OCC-guarded (§1.2.1)."

      - from: SEALED
        to: BROKEN
        trigger: "system — an ACTIVE CartItem was voided, or the flight's UpliftRecord produced a WasteManifest"
        actor: system
        preconditions:
          - "Cart.seal_status IN {SEALED, RESEALED}"
        side_effects:
          - "clears sealed_by_user_id and leaves seal_number in place for audit"
          - "increments Cart.version by 1"

      - from: BROKEN
        to: RESEALED
        trigger: "POST /carts/{id}/seals"
        actor: LoadMaster
        preconditions:
          - "Cart.build_status == BUILT"
          - "expected_cart_version equals Cart.version"
          - "seal_number is not held by any other Cart or WasteManifest"
        side_effects:
          - "sets a new seal_number and sealed_by_user_id and increments seal_count by 1"
          - "increments Cart.version by 1"

  - entity: LoadingManifest
    initial_state: DRAFT
    terminal_states: [VOID]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /loading-manifests/{id}/issue"
        actor: LoadMaster
        preconditions:
          - "LoadingManifest.status IN {DRAFT, AMENDED}"
          - "Flight.status == PLANNED"
          - "every Cart of the flight with loaded_units >= 1 has build_status == BUILT and seal_status IN {SEALED, RESEALED}"
          - "the acting X-User-ID differs from every snapshot cart's sealed_by_user_id"
        side_effects:
          - "pins cart_seal_snapshot and total_units, sets issued_at and issued_by_user_id"
          - "drives Flight PLANNED -> LOADED"
          - "increments LoadingManifest.version by 1"

      - from: ISSUED
        to: AMENDED
        trigger: "system — a pinned Cart's seal_number changed, or an ACTIVE CartItem in a pinned Cart was voided"
        actor: system
        preconditions:
          - "LoadingManifest.status == ISSUED"
        side_effects:
          - "increments amendment_count by 1"
          - "drives Flight LOADED -> PLANNED"
          - "increments LoadingManifest.version by 1"

      - from: AMENDED
        to: ISSUED
        trigger: "POST /loading-manifests/{id}/issue"
        actor: LoadMaster
        preconditions:
          - "same preconditions as DRAFT -> ISSUED"
        side_effects:
          - "re-pins cart_seal_snapshot and total_units against current cart state"
          - "drives Flight PLANNED -> LOADED"
          - "increments LoadingManifest.version by 1"
        note: "Closes the ISSUED -> AMENDED -> ISSUED cycle."

      - from: DRAFT
        to: VOID
        trigger: "system — POST /flights/{id}/loading-manifests created a newer manifest for the same flight"
        actor: system
        preconditions:
          - "LoadingManifest.status == DRAFT"
        side_effects:
          - "increments LoadingManifest.version by 1"

      - from: ISSUED
        to: VOID
        trigger: "system — POST /flights/{id}/cancel"
        actor: system
        preconditions:
          - "LoadingManifest.status IN {DRAFT, ISSUED, AMENDED}"
        side_effects:
          - "increments LoadingManifest.version by 1"

  - entity: DeliveryRun
    initial_state: RESERVED
    terminal_states: [DELIVERED, RECOVERED, CANCELLED]
    shape: branching_fork_join
    transitions:
      - from: RESERVED
        to: RESCHEDULED
        trigger: "system — POST /flights/{id}/delays with cumulative delay_minutes >= DELAY_RESLOT_THRESHOLD_MINUTES"
        actor: system
        preconditions:
          - "DeliveryRun.status IN {RESERVED, RESCHEDULED}"
          - "the shifted window still satisfies truck buffering and stand occupancy"
        side_effects:
          - "shifts window_start_utc and window_end_utc forward by Flight.delay_minutes"
          - "when the run's loading_manifest_id points at an ISSUED manifest, drives that manifest to AMENDED, which drives Flight LOADED -> PLANNED"
          - "increments DeliveryRun.version by 1"

      - from: RESERVED
        to: CANCELLED
        trigger: "system — the shifted delay window collides, or POST /flights/{id}/cancel"
        actor: system
        preconditions:
          - "DeliveryRun.status IN {RESERVED, RESCHEDULED, EN_ROUTE, AT_AIRCRAFT}"
        side_effects:
          - "sets miss_reason to SLOT_LOST"
          - "increments DeliveryRun.version by 1"

      - from: RESERVED
        to: EN_ROUTE
        trigger: "POST /delivery-runs/{id}/events with event_type DISPATCH"
        actor: LoadMaster
        preconditions:
          - "DeliveryRun.status IN {RESERVED, RESCHEDULED}"
          - "LoadingManifest.status == ISSUED"
          - "logical clock >= window_start_utc minus DISPATCH_LEAD_MINUTES"
        side_effects:
          - "sets dispatched_at_utc to the logical clock"
          - "increments DeliveryRun.version by 1"

      - from: EN_ROUTE
        to: AT_AIRCRAFT
        trigger: "POST /delivery-runs/{id}/events with event_type ARRIVE"
        actor: LoadMaster
        preconditions:
          - "DeliveryRun.status == EN_ROUTE"
        side_effects:
          - "sets arrived_at_utc to the logical clock"
          - "increments DeliveryRun.version by 1"

      - from: AT_AIRCRAFT
        to: DELIVERED
        trigger: "POST /delivery-runs/{id}/events with event_type DELIVER"
        actor: LoadMaster
        preconditions:
          - "DeliveryRun.status == AT_AIRCRAFT"
        side_effects:
          - "sets delivered_at_utc to the logical clock and evaluates delivery_lateness_penalty into lateness_minutes and penalty_cents"
          - "when penalty_cents >= 1, creates an AuditFinding of type LATE_DELIVERY severity MINOR with source SYSTEM, incrementing Airline.open_finding_count"
          - "when every DeliveryRun of the ISSUED manifest is in {DELIVERED, RECOVERED, CANCELLED} and at least one is DELIVERED, drives Flight LOADED -> DEPARTED"
          - "increments DeliveryRun.version by 1"
        note: "Success branch of the fork; the side-effect set differs from the MISSED branch."

      - from: EN_ROUTE
        to: MISSED
        trigger: "POST /delivery-runs/{id}/events with event_type MISS"
        actor: LoadMaster
        preconditions:
          - "DeliveryRun.status IN {EN_ROUTE, AT_AIRCRAFT}"
          - "miss_reason is supplied and is not SLOT_LOST"
        side_effects:
          - "sets penalty_cents to MISSED_FLAT_PENALTY_CENTS and leaves lateness_minutes at 0"
          - "creates an AuditFinding of type LATE_DELIVERY severity MAJOR with source SYSTEM, incrementing Airline.open_finding_count"
          - "does NOT advance the Flight, which stays LOADED until a recovery run delivers"
          - "increments DeliveryRun.version by 1"
        note: "Failure branch of the fork; no per-minute banding is applied."

      - from: MISSED
        to: RECOVERED
        trigger: "POST /delivery-runs/{id}/recovery-runs"
        actor: LoadMaster
        preconditions:
          - "DeliveryRun.status == MISSED"
          - "no other DeliveryRun already has recovery_of_run_id == this run's id"
        side_effects:
          - "creates a new DeliveryRun in RESERVED with recovery_of_run_id set to this run and the submitted window, revalidated against truck buffering and stand occupancy"
          - "increments DeliveryRun.version by 1"
        note: "Join point: the flight can only reach DEPARTED once the recovery run itself reaches DELIVERED."

  - entity: UpliftRecord
    initial_state: DRAFT
    terminal_states: [CLOSED]
    shape: linear
    transitions:
      - from: DRAFT
        to: DISPOSITIONED
        trigger: "POST /uplift-records/{id}/dispositions"
        actor: ComplianceOfficer
        preconditions:
          - "UpliftRecord.status == DRAFT"
          - "for every line, reuse_units + donate_units + destroy_units == that line's returned_units"
          - "when Airline.waste_regime == BONDED, every line has reuse_units == 0 and donate_units == 0"
        side_effects:
          - "writes reuse_units, donate_units and destroy_units onto each UpliftRecord.lines entry and recomputes net_cost_cents, handling_fee_cents and billing_total_cents"
          - "every ProductionBatch of the flight whose specification received destroy_units >= 1 moves RELEASED -> DISPOSED"
          - "increments UpliftRecord.version by 1"

      - from: DISPOSITIONED
        to: CLOSED
        trigger: "system — the flight's WasteManifest reached DISPOSED"
        actor: system
        preconditions:
          - "UpliftRecord.status == DISPOSITIONED"
        side_effects:
          - "increments UpliftRecord.version by 1"

  - entity: WasteManifest
    initial_state: DRAFT
    terminal_states: [DISPOSED, REJECTED]
    shape: branching
    transitions:
      - from: DRAFT
        to: SEALED
        trigger: "POST /waste-manifests/{id}/transitions with action SEAL"
        actor: ComplianceOfficer
        preconditions:
          - "WasteManifest.status == DRAFT"
          - "Flight.status == RECONCILED for the owning UpliftRecord's flight"
        side_effects:
          - "increments WasteManifest.version by 1"

      - from: SEALED
        to: DISPOSED
        trigger: "POST /waste-manifests/{id}/transitions with action DISPOSE"
        actor: ComplianceOfficer
        preconditions:
          - "WasteManifest.status == SEALED"
        side_effects:
          - "drives the owning UpliftRecord DISPOSITIONED -> CLOSED"
          - "increments WasteManifest.version by 1"

      - from: DRAFT
        to: REJECTED
        trigger: "POST /waste-manifests/{id}/transitions with action REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "WasteManifest.status IN {DRAFT, SEALED}"
          - "rejection_reason is supplied"
        side_effects:
          - "releases the seal_number for reuse by a replacement manifest"
          - "increments WasteManifest.version by 1"
        note: "A REJECTED manifest must be replaced; the replacement recomputes sealed_weight_grams from the same disposition lines and therefore reproduces the identical mass."

  - entity: AuditFinding
    initial_state: OPEN
    terminal_states: [WITHDRAWN]
    shape: branching_with_revert
    transitions:
      - from: OPEN
        to: DISPUTED
        trigger: "POST /audit-findings/{id}/resolution with action DISPUTE"
        actor: ComplianceOfficer
        preconditions:
          - "AuditFinding.status == OPEN"
        side_effects:
          - "decrements Airline.open_finding_count by 1, which may drive Airline SUSPENDED -> ACTIVE"
          - "increments AuditFinding.version by 1"

      - from: OPEN
        to: ACCEPTED
        trigger: "POST /audit-findings/{id}/resolution with action ACCEPT"
        actor: ComplianceOfficer
        preconditions:
          - "AuditFinding.status IN {OPEN, DISPUTED}"
        side_effects:
          - "adds AuditFinding.penalty_cents to Airline.penalty_accrued_cents"
          - "decrements Airline.open_finding_count by 1 when the prior status was OPEN, which may drive Airline SUSPENDED -> ACTIVE"
          - "increments AuditFinding.version by 1"

      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /audit-findings/{id}/resolution with action WITHDRAW"
        actor: AirlineRep
        preconditions:
          - "AuditFinding.status IN {OPEN, DISPUTED, ACCEPTED}"
          - "X-User-ID == AuditFinding.airline_id"
        side_effects:
          - "subtracts AuditFinding.penalty_cents from Airline.penalty_accrued_cents when the prior status was ACCEPTED"
          - "decrements Airline.open_finding_count by 1 when the prior status was OPEN"
          - "increments AuditFinding.version by 1"
        note: "Compensating edge: ACCEPT followed by WITHDRAW leaves Airline.penalty_accrued_cents at its pre-ACCEPT value exactly."

  - entity: Airline
    initial_state: ACTIVE
    terminal_states: []
    shape: cyclic
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system — an AuditFinding creation pushed open_finding_count to OPEN_FINDING_SUSPEND_THRESHOLD"
        actor: system
        preconditions:
          - "Airline.open_finding_count >= OPEN_FINDING_SUSPEND_THRESHOLD"
        side_effects:
          - "hop 3 — every Flight of this airline with status IN {SCHEDULED, COUNTS_LOCKED} has production_hold set to true, and each such Flight.version increments by 1"
          - "increments Airline.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "system — an AuditFinding left OPEN, dropping open_finding_count below OPEN_FINDING_SUSPEND_THRESHOLD"
        actor: system
        preconditions:
          - "Airline.open_finding_count < OPEN_FINDING_SUSPEND_THRESHOLD"
        side_effects:
          - "every Flight of this airline with production_hold == true has it cleared to false, and each such Flight.version increments by 1"
          - "increments Airline.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:

  - rule_id: manifest-create-stale-flight
    parent_entity: Flight
    write_endpoint: "POST /flights/{id}/loading-manifests"
    occ_field: "expected_flight_version"
    description: |
      Creating a LoadingManifest against a Flight whose version has advanced since the client last
      read it is rejected. A newly created manifest legitimately voids any manifest of the same
      flight still in DRAFT, so a writer holding a stale view of the flight would silently discard
      a draft it never saw.
    error_id: ERR_STALE_FLIGHT_VERSION
    http_status: 412

  - rule_id: uplift-create-stale-flight
    parent_entity: Flight
    write_endpoint: "POST /flights/{id}/uplift-records"
    occ_field: "expected_flight_version"
    description: |
      Creating an UpliftRecord against a Flight whose version has advanced since the client last
      read it is rejected. A new reconciliation supersedes any DRAFT UpliftRecord of the same
      flight, so the stale writer would overwrite counts derived from cart state it never observed.
    error_id: ERR_STALE_FLIGHT_VERSION
    http_status: 412

  - rule_id: seal-create-stale-cart
    parent_entity: Cart
    write_endpoint: "POST /carts/{id}/seals"
    occ_field: "expected_cart_version"
    description: |
      Fitting a seal on a Cart whose version has advanced since the client last read it is
      rejected. A new seal legitimately supersedes the prior one (SEALED -> RESEALED), so a writer
      working from a stale view would replace a seal number that is already pinned in a manifest
      snapshot it never observed.
    error_id: ERR_STALE_CART_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
# =============================================================================
calculations:

  - name: flight_meal_requirement
    entity: Flight
    algorithm_type: aggregation
    variants:
      - variant_id: PROVISIONAL
        applies_when: "Flight.status == SCHEDULED — read through GET /flights/{id}.units_planned_provisional"
        formula: |
          For each cabin C in the fixed order [FIRST, BUSINESS, ECONOMY]:
            spec(C) = the MealSpecification with airline_id == Flight.airline_id, cabin == C,
                      meal_code == STANDARD and status == ACTIVE
                      (when several qualify, the one with the lowest spec_code by ASCII ASC)
            when spec(C) does not exist -> cabin contributes 0
            cabin_units(C) = ceil(pax_of(C) * (1 + spec(C).load_factor_pct / 100))
          units_planned_provisional = sum over C of cabin_units(C)
        input_set: "MealSpecification rows with status == ACTIVE and meal_code == STANDARD; SpecialMealOrder rows are IGNORED entirely"
      - variant_id: FINAL
        applies_when: "POST /flights/{id}/production-plan — written to Flight.units_planned"
        formula: |
          confirmed(C) = count of SpecialMealOrder rows for this flight with status == CONFIRMED whose
                         effective specification's cabin == C, where the effective specification is
                         substitute_meal_specification_id when set and meal_specification_id otherwise
          For each cabin C in the fixed order [FIRST, BUSINESS, ECONOMY]:
            standard_units(C) = max(0, pax_of(C) - confirmed(C))     # NO load factor is applied
          special_units = one unit per CONFIRMED SpecialMealOrder, at its own effective specification
          units_planned = sum over C of standard_units(C) + count of CONFIRMED SpecialMealOrder rows
        input_set: "locked pax_first / pax_business / pax_economy plus SpecialMealOrder rows with status == CONFIRMED; LATE_REJECTED, CANCELLED, SUBSTITUTED-away and REQUESTED orders are excluded"
    differentiation: |
      The two variants differ on two independent axes at once: PROVISIONAL applies each
      specification's load_factor_pct spoilage uplift and ignores special meal orders entirely,
      while FINAL applies no load factor and substitutes one special tray for one standard tray in
      the ordering passenger's cabin. On the pinned Tier-L fixture (pax 7 / 23 / 181, three
      CONFIRMED ECONOMY VGML orders) PROVISIONAL yields 218 units and FINAL yields 211 units.
    constants:
      CABIN_ORDER: [FIRST, BUSINESS, ECONOMY]
    precision: "integer units; ceil() is applied per cabin, never to the total"
    reference: "state_machines.Flight.COUNTS_LOCKED_to_PLANNED"

  - name: production_plan_zone_allocation
    entity: ProductionBatch
    algorithm_type: waterfall_allocation
    formula: |
      Input is the FINAL requirement expanded into (specification, quantity) demand rows, visited in
      this total order: storage_class in [HOT, CHILL, DRY], then cabin in [FIRST, BUSINESS, ECONOMY],
      then spec_code ASCII ASC.
      Each zone Z starts with remaining(Z) = ZONE_CAPACITY[Z]. For each demand row D with
      specification S and quantity q:
        primary = S.storage_class
        take = min(q, remaining(primary)); allocate take to primary; remaining(primary) -= take
        overflow = q - take
        when overflow >= 1:
          fallback = OVERFLOW_CHAIN[primary]                      # HOT->CHILL, CHILL->DRY, DRY->none
          when fallback is none                       -> ERR_STORE_CAPACITY_EXCEEDED
          when S.shelf_life_hours < OVERFLOW_MIN_SHELF_LIFE_HOURS[primary]
                                                      -> ERR_STORE_CAPACITY_EXCEEDED
          take2 = min(overflow, remaining(fallback)); allocate take2 to fallback
          remaining(fallback) -= take2
          when overflow - take2 >= 1                   -> ERR_STORE_CAPACITY_EXCEEDED
      One ProductionBatch is created per (specification, zone) pair whose allocated quantity is >= 1,
      in visit order, with is_overflow == true exactly when zone != specification.storage_class.
    input_set: "the FINAL flight_meal_requirement demand rows for this flight only; other flights do not consume capacity"
    constants:
      ZONE_CAPACITY: { CHILL: 250, HOT: 120, DRY: 400 }
      OVERFLOW_CHAIN: { HOT: CHILL, CHILL: DRY }
      OVERFLOW_MIN_SHELF_LIFE_HOURS: { HOT: 24, CHILL: 72 }
    precision: "integer units; a zone whose allocated quantity is 0 produces no ProductionBatch row"
    reference: "endpoints.POST_/flights/{id}/production-plan"
    note: |
      The waterfall is strictly first-bucket-fills-first: with pax 8 / 24 / 300 and three CONFIRMED
      ECONOMY VGML orders the ECONOMY standard demand is 297 units, which fills CHILL to 250 and
      overflows 47 units into DRY (AN-Y-STD.shelf_life_hours == 72 >= 72, so the overflow is
      permitted); the 3 VGML units then find CHILL exhausted and also land in DRY.

  - name: batch_release_deadline
    entity: ProductionBatch
    algorithm_type: threshold
    formula: |
      release_deadline_utc = min(
        plan_created_at + MealSpecification.shelf_life_hours hours,
        Flight.revised_std_utc - SLOT_PREP_LEAD_MINUTES minutes,
        plan_created_at + ZONE_CUTOFF_HOURS[ProductionBatch.store_zone] hours
      )
      where plan_created_at is the logical clock at the moment
      POST /flights/{id}/production-plan ran. The three candidates are evaluated in the order listed
      and the earliest instant wins; ties keep the same instant, so the winner is unambiguous.
      release_deadline_utc is pinned at planning time and is NOT recomputed when a later
      POST /flights/{id}/delays moves revised_std_utc.
    input_set: "the batch's own specification and store_zone, plus the owning flight's revised_std_utc as it stood at planning time"
    constants:
      SLOT_PREP_LEAD_MINUTES: 90
      ZONE_CUTOFF_HOURS: { HOT: 4, CHILL: 72, DRY: 720 }
    precision: "whole seconds, UTC, rendered as ISO-8601 with a trailing Z"
    reference: "state_machines.ProductionBatch.COMPLETED_to_RELEASED"
    note: |
      Nested-minimum selection: which of the three candidates binds depends on the zone. For a HOT
      batch planned at 2026-09-15T04:00:00Z on a flight with revised_std_utc 2026-09-15T10:00:00Z,
      the shelf-life candidate is 08:00 (4h), the slot candidate is 08:30 (10:00 - 90min) and the
      zone candidate is 08:00 (HOT 4h) -> 2026-09-15T08:00:00Z. For a CHILL batch on the same plan
      the shelf-life candidate is 09-18T04:00 and the zone candidate is 09-18T04:00, so the slot
      candidate 08:30 binds instead -> 2026-09-15T08:30:00Z.

  - name: haccp_check_verdict
    entity: HaccpCheck
    algorithm_type: threshold
    formula: |
      verdict = PASS when the measured temperature satisfies the step's own comparison, else FAIL:
        COOK_TEMP    -> PASS iff measured_temp_c >= COOK_TEMP_MIN_C
        CHILL_DOWN   -> PASS iff measured_temp_c <= CHILL_DOWN_MAX_C
        HOLD_TEMP    -> PASS iff measured_temp_c <= HOLD_TEMP_MAX_C
        BLAST_CHILL  -> PASS iff measured_temp_c <= BLAST_CHILL_MAX_C
      sequence_no is assigned as 1 + the count of existing HaccpCheck rows for the same
      (production_batch_id, step_code) pair.
    input_set: "the single submitted measurement; earlier checks affect only sequence_no"
    constants:
      COOK_TEMP_MIN_C: 75.0
      CHILL_DOWN_MAX_C: 8.0
      HOLD_TEMP_MAX_C: 5.0
      BLAST_CHILL_MAX_C: 3.0
    precision: "one decimal place on measured_temp_c; comparisons are inclusive at the constant, so COOK_TEMP 75.0 is PASS and 74.9 is FAIL"
    reference: "state_machines.ProductionBatch.IN_PRODUCTION_to_HACCP_HOLD"

  - name: haccp_risk_score
    entity: ProductionBatch
    algorithm_type: weighted_scoring
    formula: |
      fail_count = number of HaccpCheck rows for this batch with verdict == FAIL
      haccp_risk_score = min(100.00,
                             HACCP_FAIL_WEIGHT * fail_count + HACCP_REWORK_WEIGHT * haccp_rework_rounds)
    input_set: "every HaccpCheck row of this batch regardless of step_code or sequence_no"
    constants:
      HACCP_FAIL_WEIGHT: 40.00
      HACCP_REWORK_WEIGHT: 15.00
      HACCP_MAX_FAILS: 2
      HACCP_MAX_REWORK_ROUNDS: 2
    precision: "two decimals, ROUND_HALF_UP, clamped at 100.00"
    reference: "state_machines.ProductionBatch.IN_PRODUCTION_to_HACCP_HOLD"
    note: |
      haccp_risk_score is a reported metric, not a release gate — release is gated on the latest
      per-step verdicts and on haccp_rework_rounds. Pinned ladder values: one FAIL with one completed
      rework round scores 40.00*1 + 15.00*1 == 55.00; two FAILs with two rework rounds score
      40.00*2 + 15.00*2 == 110.00, which the clamp reports as 100.00; the third FAIL, which rejects
      the batch, scores 40.00*3 + 15.00*2 == 150.00 and is likewise reported as 100.00.

  - name: uplift_cost_reconciliation
    entity: UpliftRecord
    algorithm_type: aggregation
    variants:
      - variant_id: GROSS_UPLIFTED
        applies_when: "POST /flights/{id}/uplift-records — written to UpliftRecord.gross_cost_cents"
        formula: |
          One line per CartItem with status == ACTIVE belonging to a Cart of this flight, ordered by
          CartItem.created_at ASC. For each line L:
            line_gross_cents = round_half_up(L.qty_units * spec(L).unit_cost_cents * (1 + OVERHEAD_RATE))
          gross_cost_cents = sum of line_gross_cents over all lines
          uplifted_units   = sum of L.qty_units
        input_set: "CartItem rows with status == ACTIVE only; VOID items contribute nothing"
      - variant_id: NET_CONSUMED
        applies_when: "POST /uplift-records/{id}/dispositions — written to UpliftRecord.net_cost_cents"
        formula: |
          weighted_rate_cents = round_half_up(gross_cost_cents / uplifted_units)     # rounded ONCE
          credit_basis_units  = sum over lines of (reuse_units + donate_units)        # destroy earns nothing
          credit_cents        = round_half_up(credit_basis_units * weighted_rate_cents
                                              * Airline.unused_recovery_rate_pct / 100)
          net_cost_cents      = gross_cost_cents - credit_cents
        input_set: "the same ACTIVE lines, now carrying reuse_units / donate_units / destroy_units"
    differentiation: |
      GROSS_UPLIFTED prices every uplifted unit at full overhead-loaded cost. NET_CONSUMED credits
      back only the units the airline may re-use or donate, at the blended rate, scaled by
      unused_recovery_rate_pct — so a BONDED airline, whose dispositions must be 100% DESTROY, can
      never diverge from GROSS_UPLIFTED, while an otherwise identical DOMESTIC airline does.
      On the pinned 180-unit ECONOMY fixture: gross_cost_cents == 292320 both times;
      BONDED (destroy 10) -> net_cost_cents == 292320, DOMESTIC (reuse 7, donate 3)
      -> credit_cents == 4872 and net_cost_cents == 287448.
    constants:
      OVERHEAD_RATE: 0.12
    precision: "integer cents; ROUND_HALF_UP applied per line, once when blending the rate, and once to the credit — never to intermediate products"
    reference: "state_machines.UpliftRecord.DRAFT_to_DISPOSITIONED"

  - name: cost_per_passenger_report
    entity: Flight
    algorithm_type: weighted_scoring
    formula: |
      item_gross_cents(I) = round_half_up(I.qty_units * spec(I).unit_cost_cents * (1 + OVERHEAD_RATE))
      for every CartItem I with status == ACTIVE belonging to a Cart of this flight, where spec(I) is
      the MealSpecification of I's ProductionBatch.
      For each cabin C in [FIRST, BUSINESS, ECONOMY]:
        cabin_cost_cents(C) = sum of item_gross_cents(I) over items whose spec(I).cabin == C,
                              taken in CartItem.created_at ASC order
        when pax_of(C) == 0 -> cabin C is excluded from both the numerator and the denominator
        cabin_cpp(C) = round_half_up(cabin_cost_cents(C) / pax_of(C))          # ROUND 1 — per cabin
      cost_per_pax_cents = round_half_up( sum over included C of (cabin_cpp(C) * pax_of(C))
                                          / total_pax )                        # ROUND 2 — once at the end
    input_set: "CartItem rows with status == ACTIVE only, grouped by their batch specification's cabin, plus the locked per-cabin pax counts; VOID items contribute 0"
    constants:
      CABIN_ORDER: [FIRST, BUSINESS, ECONOMY]
      OVERHEAD_RATE: 0.12
    precision: "integer cents; ROUND_HALF_UP is applied per item, then once per cabin and once to the weighted mean"
    reference: "endpoints.GET_/flights/{id}/cost-report"
    note: |
      Pinned rounding ORDER: rounding per cabin first and only then blending is NOT the same as
      dividing the total by total_pax. On the Tier-L fixture (pax 7 / 23 / 181, cabin costs
      32928 / 100464 / 294616, gross 428008) the per-cabin values are 4704 / 4368 / 1628 and the
      pinned result is cost_per_pax_cents == 2029, whereas round_half_up(428008 / 211) would give
      2028.

  - name: flight_billing_total
    entity: UpliftRecord
    algorithm_type: tiered_pricing
    formula: |
      Evaluation ORDER is fixed and the tier is keyed on net_cost_cents ONLY:
        step 1  handling_rate = HANDLING_TIERS band containing net_cost_cents
        step 2  handling_fee_cents = round_half_up(net_cost_cents * handling_rate)
        step 3  late_penalty_cents = sum of DeliveryRun.penalty_cents over every DeliveryRun of
                this flight's manifests, ordered by DeliveryRun.created_at ASC
        step 4  billing_total_cents = net_cost_cents + handling_fee_cents + late_penalty_cents
    input_set: "the UpliftRecord's own net_cost_cents plus every DeliveryRun of the flight in any status"
    constants:
      HANDLING_TIERS:
        - { min_cents: 0,      max_cents: 199999, rate: 0.09 }
        - { min_cents: 200000, max_cents: 499999, rate: 0.07 }
        - { min_cents: 500000, max_cents: null,   rate: 0.05 }
    precision: "integer cents, ROUND_HALF_UP; the flat rate of the containing band applies to the whole amount (average-rate tiering, not marginal)"
    reference: "state_machines.UpliftRecord.DRAFT_to_DISPOSITIONED"
    note: |
      Pinned evaluation ORDER: the band is keyed on net_cost_cents alone, before the late penalty is
      added, and is never re-selected afterwards. On the pinned 112-passenger BUSINESS fixture
      net_cost_cents == 489216 and late_penalty_cents == 11500, so the 0.07 band applies and gives
      handling_fee_cents == 34245 and billing_total_cents == 534961. Keying the band on
      net_cost_cents + late_penalty_cents (500716) would select the 0.05 band and give
      handling_fee_cents == 24461 and billing_total_cents == 525177.

  - name: delivery_lateness_penalty
    entity: DeliveryRun
    algorithm_type: tiered_pricing
    formula: |
      When the run reaches MISSED:
        lateness_minutes = 0
        penalty_cents    = MISSED_FLAT_PENALTY_CENTS          # no banding at all
      When the run reaches DELIVERED:
        lateness_minutes = max(0, ceil((delivered_at_utc - window_end_utc) / 60 seconds))
        billable_minutes = max(0, lateness_minutes - Airline.late_delivery_grace_minutes)
        penalty_cents    = MARGINAL banding of billable_minutes across LATENESS_BANDS, i.e.
                           each band prices only the minutes that fall inside it
    input_set: "the run's own delivered_at_utc and window_end_utc plus the owning Airline's grace"
    constants:
      MISSED_FLAT_PENALTY_CENTS: 750000
      LATENESS_BANDS:
        - { up_to_minutes: 30,   cents_per_minute: 250 }
        - { up_to_minutes: 60,   cents_per_minute: 400 }
        - { up_to_minutes: null, cents_per_minute: 600 }
    precision: "integer cents; ceil() on the minute conversion, so a single extra second counts as a whole late minute"
    reference: "state_machines.DeliveryRun.AT_AIRCRAFT_to_DELIVERED"
    note: |
      Marginal, not average: delivered at 2026-09-15T08:47:00Z against window_end_utc
      2026-09-15T08:00:00Z gives lateness_minutes == 47, billable_minutes == 37 with a 10-minute
      grace, and penalty_cents == 30*250 + 7*400 == 10300. Pricing all 37 minutes at the band the
      total lands in would instead give 14800.

  - name: spec_compliance_deviation
    entity: UpliftRecord
    algorithm_type: threshold
    formula: |
      For each MealSpecification S appearing in this flight's FINAL requirement:
        required(S)  = units of S in the FINAL flight_meal_requirement
        delivered(S) = sum of CartItem.qty_units over ACTIVE items referencing a ProductionBatch
                       whose meal_specification_id == S.id
        deviation(S) = round_half_up(abs(delivered(S) - required(S)) / required(S) * 100, 2)
      spec_deviation_pct = max over S of deviation(S), or 0.00 when the flight has no requirement
      A SPEC_DEVIATION AuditFinding is raised iff
      spec_deviation_pct >= Airline.spec_deviation_tolerance_pct, with severity from
      DEVIATION_SEVERITY_BANDS.
    input_set: "the flight's FINAL requirement rows versus its ACTIVE CartItem rows; VOID items and REJECTED batches contribute 0 delivered units"
    constants:
      DEVIATION_SEVERITY_BANDS:
        - { min_pct: 5.00,  max_pct: 9.99,  severity: MINOR }
        - { min_pct: 10.00, max_pct: 19.99, severity: MAJOR }
        - { min_pct: 20.00, max_pct: null,  severity: CRITICAL }
    precision: "two decimals, ROUND_HALF_UP; the band comparison is inclusive at min_pct, so exactly 5.00 is MINOR and exactly 10.00 is MAJOR"
    reference: "state_machines.Flight.DEPARTED_to_RECONCILED"
    note: |
      Boundary fixture: required 180, delivered 171 -> abs(171-180)/180*100 == 5.00 exactly, which is
      at the default tolerance and therefore DOES raise a MINOR finding; delivered 172 gives 4.44
      and raises nothing.

  - name: audit_penalty
    entity: AuditFinding
    algorithm_type: threshold
    formula: |
      penalty_cents = round_half_up(FINDING_BASE_CENTS[finding_type] * SEVERITY_MULTIPLIER[severity])
    input_set: "the finding's own finding_type and severity, fixed at creation and never re-derived"
    constants:
      FINDING_BASE_CENTS:
        SPEC_DEVIATION: 120000
        HACCP_BREACH: 500000
        SEAL_MISMATCH: 200000
        LATE_DELIVERY: 80000
      SEVERITY_MULTIPLIER: { MINOR: 1.0, MAJOR: 2.5, CRITICAL: 5.0 }
      OPEN_FINDING_SUSPEND_THRESHOLD: 3
    precision: "integer cents, ROUND_HALF_UP"
    reference: "state_machines.AuditFinding.OPEN_to_ACCEPTED"
    note: |
      Pinned values used by the fixtures: SPEC_DEVIATION MINOR == 120000, LATE_DELIVERY MINOR ==
      80000, LATE_DELIVERY MAJOR == 200000, SEAL_MISMATCH MAJOR == 500000, HACCP_BREACH CRITICAL
      == 2500000.

  - name: waste_manifest_mass
    entity: WasteManifest
    algorithm_type: aggregation
    formula: |
      sealed_weight_grams = sum over the owning UpliftRecord's lines of
                            (line.destroy_units * spec(line).gross_weight_grams)
      disposal_method must be a member of ALLOWED_DISPOSAL[Airline.waste_regime]; anything else is
      refused with ERR_BONDED_WASTE_DISPOSAL_INVALID.
    input_set: "the UpliftRecord lines' destroy_units only; reuse and donate units carry no disposal mass"
    constants:
      ALLOWED_DISPOSAL:
        BONDED: [INCINERATION]
        DOMESTIC: [INCINERATION, RENDERING, LANDFILL]
    precision: "integer grams; recomputed from the same immutable disposition lines, so a replacement manifest after a REJECT reproduces the identical value"
    reference: "state_machines.WasteManifest.DRAFT_to_SEALED"

# =============================================================================
# §1.4 Validation Rules — evaluated in ascending `priority`; the first violated
# rule short-circuits the request and nothing after it runs.
# =============================================================================
validations:

  - priority: 10
    category: auth
    rule: "X-User-ID header is present and names a known user."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "every endpoint except POST /_clock/set_current_utc"

  - priority: 20
    category: authz
    rule: "The acting user's role is listed in the endpoint's allowed roles."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "every endpoint"

  - priority: 30
    category: shape
    rule: >
      Request body parses, every required field is present, every field has the declared JSON type,
      every enum value is a declared member, every integer respects its declared bounds, and every
      ISO-8601 instant parses as UTC. Unknown fields are rejected.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "every endpoint with a request body or query parameters"

  - priority: 40
    category: path_existence
    rule: >
      Every {id} path segment resolves to an existing row, checked left to right. Flight ids raise
      ERR_FLIGHT_NOT_FOUND, ProductionBatch ids raise ERR_BATCH_NOT_FOUND, Cart ids raise
      ERR_CART_NOT_FOUND, every other entity raises ERR_RESOURCE_NOT_FOUND.
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 50
    category: ownership
    rule: >
      An AirlineRep may only read or write rows whose airline_id equals its own X-User-ID, resolved
      through the owning Flight or MealSpecification where the row has no direct airline_id.
    error_id: ERR_AIRLINE_SCOPE_VIOLATION
    http_status: 403
    applies_to: "every endpoint an AirlineRep may call"

  - priority: 60
    category: body_reference_existence
    rule: >
      Every id carried in the request body resolves to an existing row, checked in the field order
      declared by the endpoint's `input`.
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint whose body carries an id"

  - priority: 65
    category: concurrency
    rule: >
      Where the endpoint declares an expected_<parent>_version field, its value equals the parent
      row's current version. Flight mismatches raise ERR_STALE_FLIGHT_VERSION and Cart mismatches
      raise ERR_STALE_CART_VERSION.
    error_id: ERR_STALE_FLIGHT_VERSION
    http_status: 412
    applies_to: "POST /flights/{id}/loading-manifests, POST /flights/{id}/uplift-records, POST /carts/{id}/seals"

  - priority: 70
    category: state
    rule: >
      The target row is in a state from which the requested transition exists (§1.2). Flight raises
      ERR_INVALID_FLIGHT_STATE, ProductionBatch ERR_INVALID_BATCH_STATE, Cart
      ERR_INVALID_CART_STATE, DeliveryRun ERR_INVALID_RUN_STATE, every other entity
      ERR_INVALID_RESOURCE_STATE. Two specialisations of this rule share the same priority band:
      writing pax counts once Flight.status != SCHEDULED raises ERR_FLIGHT_COUNTS_LOCKED, and
      loading a cart item from a batch whose production_status != RELEASED raises
      ERR_BATCH_NOT_RELEASED; dispatching a run whose manifest is not ISSUED raises
      ERR_MANIFEST_NOT_ISSUED.
    error_id: ERR_INVALID_FLIGHT_STATE
    http_status: 409
    applies_to: "every state-advancing endpoint"

  - priority: 80
    category: business_safety
    rule: >
      Food-safety gates. On POST /production-batches/{id}/release these four checks run in this
      pinned order and the first failure short-circuits: (i) ERR_HACCP_STEP_MISSING when a step in
      MealSpecification.required_haccp_steps has no HaccpCheck at all; (ii) ERR_HACCP_HOLD_ACTIVE
      when the highest-sequence_no HaccpCheck of a required step has verdict FAIL; (iii)
      ERR_HACCP_REWORK_LIMIT when haccp_rework_rounds >= HACCP_MAX_REWORK_ROUNDS, because food that
      consumed its whole rework allowance can be finished and inspected but never certified; (iv)
      ERR_RELEASE_DEADLINE_PASSED when the logical clock is at or after release_deadline_utc.
      Starting a batch at or after release_deadline_utc also raises ERR_RELEASE_DEADLINE_PASSED, and
      so does loading cart items from such a batch.
    error_id: ERR_RELEASE_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /production-batches/{id}/start, /release, POST /carts/{id}/items"

  - priority: 85
    category: compliance_safety
    rule: >
      Segregation of duties and bonded-waste gates. The LoadMaster issuing a manifest must differ
      from Cart.sealed_by_user_id of every cart entering the snapshot (ERR_SEGREGATION_OF_DUTIES).
      A BONDED airline's dispositions must carry reuse_units == 0 and donate_units == 0
      (ERR_BONDED_REUSE_FORBIDDEN) and its waste manifests must use a disposal_method in
      ALLOWED_DISPOSAL.BONDED (ERR_BONDED_WASTE_DISPOSAL_INVALID). Planning production for a
      SUSPENDED airline, or for a Flight with production_hold == true, raises
      ERR_AIRLINE_SUSPENDED.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /loading-manifests/{id}/issue, POST /uplift-records/{id}/dispositions, POST /waste-manifests, POST /flights/{id}/production-plan"

  - priority: 90
    category: business_referential
    rule: >
      Cross-row coherence. A CartItem's batch store_zone must match the Cart's storage_class
      (ERR_STORAGE_CLASS_MISMATCH) and the batch's flight_id must match the Cart's flight_id
      (ERR_CART_FLIGHT_MISMATCH). A referenced MealSpecification must have status ACTIVE
      (ERR_SPEC_RETIRED) and must belong to the same airline as the flight
      (ERR_SPEC_AIRLINE_MISMATCH).
    error_id: ERR_STORAGE_CLASS_MISMATCH
    http_status: 422
    applies_to: "POST /carts/{id}/items, POST /special-meal-orders, POST /special-meal-orders/{id}/changes"

  - priority: 100
    category: business_constraint
    rule: >
      Capacity, uniqueness and conservation limits. Cart.loaded_units may not exceed
      Cart.capacity_units (ERR_CART_CAPACITY_EXCEEDED); zone allocation may not exceed ZONE_CAPACITY
      after the overflow chain (ERR_STORE_CAPACITY_EXCEEDED); seal_number is unique across Cart and
      WasteManifest (ERR_SEAL_NUMBER_DUPLICATE); seat_number is unique per flight among
      non-terminal SpecialMealOrder rows (ERR_DUPLICATE_SEAT_ORDER); produced_qty may not exceed
      planned_qty (ERR_PRODUCED_QTY_EXCEEDS_PLAN); an uplift's consumed_units + returned_units must
      equal uplifted_units (ERR_UPLIFT_UNITS_MISMATCH); each disposition line's
      reuse_units + donate_units + destroy_units must equal that line's returned_units
      (ERR_DISPOSITION_UNITS_MISMATCH).
    error_id: ERR_CART_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /carts, POST /carts/{id}/items, POST /carts/{id}/seals, POST /special-meal-orders, POST /production-batches/{id}/complete, POST /flights/{id}/production-plan, POST /flights/{id}/uplift-records, POST /uplift-records/{id}/dispositions, POST /waste-manifests"

  - priority: 110
    category: business_temporal
    rule: >
      Clock and window rules. Capturing or changing a special meal order at or after
      Flight.special_meal_cutoff_utc raises ERR_SPECIAL_MEAL_CUTOFF_PASSED. A delivery window must
      satisfy window_start_utc < window_end_utc (ERR_SLOT_WINDOW_INVALID) and must sit inside
      [revised_std_utc - SLOT_EARLIEST_LEAD_MINUTES, revised_std_utc - SLOT_LATEST_LEAD_MINUTES]
      (ERR_SLOT_OUTSIDE_FLIGHT_WINDOW). Truck occupancy is half-open with buffering: a run is
      refused when window_start_utc < (an existing run's window_end_utc + Truck.buffer_minutes) and
      window_end_utc > that run's window_start_utc (ERR_TRUCK_SLOT_CONFLICT). Stand occupancy is a
      closed interval with an aggregate limit: a run is refused when adding it would make more than
      Stand.max_concurrent_runs non-cancelled runs cover any common instant
      (ERR_STAND_CAPACITY_CONFLICT). A Truck in MAINTENANCE or a Stand CLOSED raises
      ERR_SLOT_RESOURCE_UNAVAILABLE.
    error_id: ERR_SPECIAL_MEAL_CUTOFF_PASSED
    http_status: 422
    applies_to: "POST /special-meal-orders, POST /special-meal-orders/{id}/changes, POST /delivery-runs, POST /delivery-runs/{id}/recovery-runs"
    constants:
      SLOT_EARLIEST_LEAD_MINUTES: 300
      SLOT_LATEST_LEAD_MINUTES: 45
      DISPATCH_LEAD_MINUTES: 60
      DELAY_RESLOT_THRESHOLD_MINUTES: 90

  - priority: 120
    category: business_fiscal
    rule: >
      Contractual money ceiling, checked last so that every safety, referential, capacity and
      temporal problem is reported first. Adding cart items whose resulting
      Flight.cost_per_pax_cents would exceed Airline.cost_cap_per_pax_cents raises
      ERR_COST_CAP_EXCEEDED.
    error_id: ERR_COST_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /carts/{id}/items"

priority_conflict_pairs:
  - endpoint: "POST /special-meal-orders"
    lower_priority: { priority: 70, error_id: ERR_FLIGHT_COUNTS_LOCKED }
    higher_priority_number: { priority: 110, error_id: ERR_SPECIAL_MEAL_CUTOFF_PASSED }
    note: >
      A request that both targets a COUNTS_LOCKED flight and arrives after the cutoff returns
      ERR_FLIGHT_COUNTS_LOCKED (priority 70), never ERR_SPECIAL_MEAL_CUTOFF_PASSED (priority 110).
  - endpoint: "POST /carts/{id}/items"
    lower_priority: { priority: 80, error_id: ERR_RELEASE_DEADLINE_PASSED }
    higher_priority_number: { priority: 100, error_id: ERR_CART_CAPACITY_EXCEEDED }
    note: >
      A request that both loads from a batch past its release deadline and overfills the cart
      returns ERR_RELEASE_DEADLINE_PASSED (priority 80).
  - endpoint: "POST /carts/{id}/items"
    lower_priority: { priority: 90, error_id: ERR_STORAGE_CLASS_MISMATCH }
    higher_priority_number: { priority: 120, error_id: ERR_COST_CAP_EXCEEDED }
    note: >
      A request that both loads a HOT batch into a CHILL cart and breaches the per-passenger cost
      cap returns ERR_STORAGE_CLASS_MISMATCH (priority 90).

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- logical clock -----------------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    roles: &ALL_ROLES [PlatformAdmin, ScheduleFeedOperator, AirlineRep, ProductionSupervisor, QaOfficer, LoadMaster, ComplianceOfficer]
    description: >
      Sets the deterministic logical clock that every temporal rule in this service reads. The
      service NEVER consults the wall clock. Before any call to this endpoint the logical clock
      default is 2026-08-01T00:00:00Z. Time only moves when this endpoint is called; it may move
      forward or backward.
    input: [current_utc]
    output: { current_utc: string }
    side_effects:
      - "no entity is mutated; subsequent requests read the new instant for cutoffs, deadlines, slot windows and lateness"
    errors: [ERR_INVALID_REQUEST]

  # --- airlines ----------------------------------------------------------
  - method: POST
    path: /airlines
    roles: [PlatformAdmin]
    description: Registers an airline customer and its contractual parameters.
    input: [name, iata_code, waste_regime, cost_cap_per_pax_cents, "special_meal_cutoff_minutes?", "late_delivery_grace_minutes?", "unused_recovery_rate_pct?", "spec_deviation_tolerance_pct?"]
    output: Airline
    side_effects:
      - "creates an Airline with status ACTIVE, open_finding_count 0, penalty_accrued_cents 0 and version 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: GET
    path: /airlines
    roles: *ALL_ROLES
    description: Lists airlines. An AirlineRep sees only its own airline.
    input: ["status?", "waste_regime?", "limit?", "offset?"]
    output: Airline[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: GET
    path: /airlines/{id}
    roles: *ALL_ROLES
    description: Reads one airline including its derived open_finding_count and penalty_accrued_cents.
    input: []
    output: Airline
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_AIRLINE_SCOPE_VIOLATION, ERR_RESOURCE_NOT_FOUND]

  # --- meal specifications ----------------------------------------------
  - method: POST
    path: /meal-specifications
    roles: [PlatformAdmin]
    description: Registers a meal specification under an airline contract.
    input: [airline_id, spec_code, cabin, meal_code, storage_class, portion_grams, gross_weight_grams, unit_cost_cents, shelf_life_hours, required_haccp_steps, "load_factor_pct?", "status?"]
    output: MealSpecification
    side_effects:
      - "creates a MealSpecification with status ACTIVE unless status was supplied"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_RESOURCE_NOT_FOUND]

  - method: PATCH
    path: /meal-specifications/{id}
    roles: [PlatformAdmin]
    description: Retires a specification or repricing its unit cost. Retiring never touches batches already planned.
    input: ["status?", "unit_cost_cents?", "load_factor_pct?"]
    output: MealSpecification
    side_effects:
      - "increments MealSpecification.version by 1"
      - "a RETIRED specification is excluded from future flight_meal_requirement evaluations but existing ProductionBatch rows keep their planned_qty"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_RESOURCE_NOT_FOUND]

  - method: GET
    path: /meal-specifications
    roles: *ALL_ROLES
    description: Lists specifications, filterable by owning airline, cabin, meal code, storage class and status.
    input: ["airline_id?", "cabin?", "meal_code?", "storage_class?", "status?", "limit?", "offset?"]
    output: MealSpecification[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: GET
    path: /meal-specifications/{id}
    roles: *ALL_ROLES
    description: Reads one meal specification.
    input: []
    output: MealSpecification
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_AIRLINE_SCOPE_VIOLATION, ERR_RESOURCE_NOT_FOUND]

  # --- trucks & stands ---------------------------------------------------
  - method: POST
    path: /trucks
    roles: [PlatformAdmin]
    description: Registers a high-lift catering truck at a station, with its inter-run buffer.
    input: [station_code, registration, "buffer_minutes?", "status?"]
    output: Truck
    side_effects:
      - "creates a Truck with buffer_minutes 20 and status ACTIVE unless supplied"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: PATCH
    path: /trucks/{id}
    roles: [PlatformAdmin]
    description: Takes a truck in or out of MAINTENANCE, or retunes its buffer.
    input: ["status?", "buffer_minutes?"]
    output: Truck
    side_effects:
      - "increments Truck.version by 1; existing DeliveryRun windows are not revalidated"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_RESOURCE_NOT_FOUND]

  - method: GET
    path: /trucks
    roles: *ALL_ROLES
    description: Lists trucks by station and status.
    input: ["station_code?", "status?", "limit?", "offset?"]
    output: Truck[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: GET
    path: /trucks/{id}
    roles: *ALL_ROLES
    description: Reads one truck.
    input: []
    output: Truck
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_RESOURCE_NOT_FOUND]

  - method: POST
    path: /stands
    roles: [PlatformAdmin]
    description: Registers an aircraft stand with its aggregate concurrent-run limit.
    input: [station_code, stand_code, "max_concurrent_runs?", "status?"]
    output: Stand
    side_effects:
      - "creates a Stand with max_concurrent_runs 2 and status ACTIVE unless supplied"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: PATCH
    path: /stands/{id}
    roles: [PlatformAdmin]
    description: Closes or reopens a stand, or changes its concurrent-run limit.
    input: ["status?", "max_concurrent_runs?"]
    output: Stand
    side_effects:
      - "increments Stand.version by 1; existing DeliveryRun windows are not revalidated"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_RESOURCE_NOT_FOUND]

  - method: GET
    path: /stands
    roles: *ALL_ROLES
    description: Lists stands by station and status.
    input: ["station_code?", "status?", "limit?", "offset?"]
    output: Stand[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: GET
    path: /stands/{id}
    roles: *ALL_ROLES
    description: Reads one stand.
    input: []
    output: Stand
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_RESOURCE_NOT_FOUND]

  # --- flights -----------------------------------------------------------
  - method: POST
    path: /flights
    roles: [ScheduleFeedOperator]
    description: Ingests one flight from the schedule feed with its per-cabin passenger counts.
    input: [airline_id, flight_number, service_date, std_utc, tail_number, station_code, "pax_first?", "pax_business?", "pax_economy?"]
    output: Flight
    side_effects:
      - "creates a Flight in SCHEDULED with total_pax, revised_std_utc == std_utc and special_meal_cutoff_utc == std_utc minus Airline.special_meal_cutoff_minutes"
      - "evaluates the PROVISIONAL flight_meal_requirement variant into units_planned_provisional"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_RESOURCE_NOT_FOUND]

  - method: PATCH
    path: /flights/{id}/pax-counts
    roles: [ScheduleFeedOperator]
    description: Applies a schedule-feed passenger-count refresh; refused once counts are locked.
    input: ["pax_first?", "pax_business?", "pax_economy?"]
    output: Flight
    side_effects:
      - "recomputes total_pax and re-evaluates units_planned_provisional"
      - "increments Flight.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_FLIGHT_NOT_FOUND, ERR_FLIGHT_COUNTS_LOCKED]

  - method: PATCH
    path: /flights/{id}/schedule
    roles: [ScheduleFeedOperator]
    description: >
      Applies a schedule-feed retime, the only operation that can move a flight EARLIER. Allowed
      solely while Flight.status == SCHEDULED, because the whole downstream plan is keyed on
      revised_std_utc; any later status raises ERR_INVALID_FLIGHT_STATE. Unlike
      POST /flights/{id}/delays this does NOT touch Flight.delay_minutes and does NOT re-evaluate
      SpecialMealOrder rows — outstanding orders are resolved once, at POST /flights/{id}/lock-counts,
      against whatever special_meal_cutoff_utc is current then. A retime that pulls the cutoff back
      behind an already-captured order is therefore exactly how a REQUESTED order becomes
      LATE_REJECTED.
    input: [std_utc]
    output: Flight
    side_effects:
      - "sets std_utc and recomputes revised_std_utc == std_utc plus Flight.delay_minutes"
      - "recomputes special_meal_cutoff_utc == revised_std_utc minus Airline.special_meal_cutoff_minutes"
      - "re-evaluates units_planned_provisional; leaves delay_minutes, units_planned and every SpecialMealOrder.status untouched"
      - "increments Flight.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_FLIGHT_NOT_FOUND, ERR_INVALID_FLIGHT_STATE]

  - method: POST
    path: /flights/{id}/lock-counts
    roles: [ScheduleFeedOperator]
    description: Freezes the passenger counts and resolves every outstanding special meal order against the cutoff.
    input: []
    output: Flight
    side_effects:
      - "SCHEDULED -> COUNTS_LOCKED and sets counts_locked_at"
      - "each REQUESTED SpecialMealOrder becomes CONFIRMED or LATE_REJECTED by comparing requested_at against special_meal_cutoff_utc"
      - "increments Flight.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_FLIGHT_NOT_FOUND, ERR_INVALID_FLIGHT_STATE, ERR_INVALID_REQUEST]

  - method: POST
    path: /flights/{id}/delays
    roles: [ScheduleFeedOperator]
    description: Records a departure delay and runs the delay-recovery cascade.
    input: [delay_minutes, "reason?"]
    output: Flight
    side_effects:
      - "adds delay_minutes to Flight.delay_minutes and recomputes revised_std_utc and special_meal_cutoff_utc"
      - "reopens LATE_REJECTED SpecialMealOrder rows whose requested_at now falls inside the cutoff"
      - "when the cumulative delay reaches DELAY_RESLOT_THRESHOLD_MINUTES, shifts every RESERVED or RESCHEDULED DeliveryRun window forward by delay_minutes and marks it RESCHEDULED, or CANCELLED with miss_reason SLOT_LOST when the shifted window collides"
      - "drives an ISSUED manifest to AMENDED and its Flight from LOADED back to PLANNED when any of its runs moved"
      - "does NOT recompute units_planned or any ProductionBatch.release_deadline_utc"
      - "increments Flight.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_FLIGHT_NOT_FOUND, ERR_INVALID_FLIGHT_STATE]

  - method: POST
    path: /flights/{id}/cancel
    roles: [ScheduleFeedOperator]
    description: Cancels a flight and unwinds every dependent row that is still non-terminal.
    input: ["reason?"]
    output: Flight
    side_effects:
      - "status -> CANCELLED"
      - "non-terminal SpecialMealOrder rows -> CANCELLED; non-terminal ProductionBatch rows -> REJECTED with scrapped_qty set to planned_qty; ACTIVE CartItem rows -> VOID; DRAFT, ISSUED and AMENDED LoadingManifest rows -> VOID; live DeliveryRun rows -> CANCELLED with miss_reason SLOT_LOST"
      - "already-terminal rows are left untouched"
      - "increments Flight.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_FLIGHT_NOT_FOUND, ERR_INVALID_FLIGHT_STATE, ERR_INVALID_REQUEST]

  - method: GET
    path: /flights
    roles: *ALL_ROLES
    description: Lists flights, filterable by airline, station, service date and status.
    input: ["airline_id?", "station_code?", "service_date?", "status?", "production_hold?", "limit?", "offset?"]
    output: Flight[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: GET
    path: /flights/{id}
    roles: *ALL_ROLES
    description: Reads one flight with every derived unit and cost field.
    input: []
    output: Flight
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_AIRLINE_SCOPE_VIOLATION, ERR_FLIGHT_NOT_FOUND]

  - method: GET
    path: /flights/{id}/cost-report
    roles: *ALL_ROLES
    description: >
      Computed read. Returns the cost_per_passenger_report breakdown for the flight — per-cabin cost
      and rounded per-cabin cost per passenger, then the weighted blend — plus the specification
      compliance deviation. Cabins with pax 0 are reported with cabin_pax 0 and are excluded from the
      blend.
    input: []
    output:
      flight_id: string
      total_pax: integer
      gross_cost_cents: integer
      cabin_breakdown: array
      cost_per_pax_cents: integer
      cost_cap_per_pax_cents: integer
      cap_breached: boolean
      spec_deviation_pct: number
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_AIRLINE_SCOPE_VIOLATION, ERR_FLIGHT_NOT_FOUND]

  # --- special meal orders ----------------------------------------------
  - method: POST
    path: /special-meal-orders
    roles: [AirlineRep]
    description: Captures a special meal order for one passenger before the change cutoff.
    input: [flight_id, meal_specification_id, passenger_ref, seat_number]
    output: SpecialMealOrder
    side_effects:
      - "creates a SpecialMealOrder in REQUESTED with requested_at set to the logical clock and cabin copied from the specification"
      - "does not change Flight.units_planned_provisional — the PROVISIONAL variant ignores special orders"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_AIRLINE_SCOPE_VIOLATION, ERR_INVALID_REQUEST, ERR_RESOURCE_NOT_FOUND, ERR_FLIGHT_COUNTS_LOCKED, ERR_SPEC_RETIRED, ERR_SPEC_AIRLINE_MISMATCH, ERR_DUPLICATE_SEAT_ORDER, ERR_SPECIAL_MEAL_CUTOFF_PASSED]

  - method: POST
    path: /special-meal-orders/{id}/changes
    roles: [AirlineRep, ProductionSupervisor]
    description: >
      Applies a last-minute change to a special meal order. CANCEL is the AirlineRep's operation and
      is refused at or after the cutoff; SUBSTITUTE is the ProductionSupervisor's operation and
      swaps in an equivalent specification in the same cabin.
    input: [action, "substitute_meal_specification_id?", "reason?"]
    output: SpecialMealOrder
    side_effects:
      - "CANCEL -> status CANCELLED and the seat_number becomes reusable"
      - "SUBSTITUTE -> status SUBSTITUTED with substitute_meal_specification_id set; the substituted specification is the one the FINAL requirement counts"
      - "increments SpecialMealOrder.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_AIRLINE_SCOPE_VIOLATION, ERR_INVALID_REQUEST, ERR_RESOURCE_NOT_FOUND, ERR_INVALID_RESOURCE_STATE, ERR_SPEC_RETIRED, ERR_SPEC_AIRLINE_MISMATCH, ERR_SPECIAL_MEAL_CUTOFF_PASSED]

  - method: GET
    path: /special-meal-orders
    roles: *ALL_ROLES
    description: Lists special meal orders, filterable by flight, requested specification, substituted specification and status.
    input: ["flight_id?", "meal_specification_id?", "substitute_meal_specification_id?", "status?", "seat_number?", "limit?", "offset?"]
    output: SpecialMealOrder[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: GET
    path: /special-meal-orders/{id}
    roles: *ALL_ROLES
    description: Reads one special meal order.
    input: []
    output: SpecialMealOrder
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_AIRLINE_SCOPE_VIOLATION, ERR_RESOURCE_NOT_FOUND]

  # --- production --------------------------------------------------------
  - method: POST
    path: /flights/{id}/production-plan
    roles: [ProductionSupervisor]
    description: >
      Runs the FINAL flight_meal_requirement and the production_plan_zone_allocation waterfall,
      materialising one ProductionBatch per (specification, zone) pair with a non-zero allocation.
      Returns the created batches in allocation order.
    input: []
    output: ProductionBatch[]
    side_effects:
      - "Flight COUNTS_LOCKED -> PLANNED and units_planned written once"
      - "creates ProductionBatch rows in PLANNED with store_zone, planned_qty, is_overflow and release_deadline_utc"
      - "increments Flight.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_FLIGHT_NOT_FOUND, ERR_INVALID_FLIGHT_STATE, ERR_AIRLINE_SUSPENDED, ERR_STORE_CAPACITY_EXCEEDED, ERR_INVALID_REQUEST]

  - method: POST
    path: /production-batches/{id}/start
    roles: [ProductionSupervisor]
    description: Starts or restarts production on a batch; a restart out of HACCP_HOLD consumes one rework round.
    input: []
    output: ProductionBatch
    side_effects:
      - "PLANNED -> IN_PRODUCTION, or HACCP_HOLD -> IN_PRODUCTION with haccp_rework_rounds incremented and haccp_risk_score recomputed"
      - "increments ProductionBatch.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_BATCH_NOT_FOUND, ERR_INVALID_BATCH_STATE, ERR_RELEASE_DEADLINE_PASSED, ERR_INVALID_REQUEST]

  - method: POST
    path: /production-batches/{id}/haccp-checks
    roles: [QaOfficer]
    description: >
      Records one HACCP temperature measurement against a batch whose production_status is
      IN_PRODUCTION or RELEASED; every other state raises ERR_INVALID_BATCH_STATE. The verdict is
      derived, never submitted. While IN_PRODUCTION a FAIL sends the batch to HACCP_HOLD until the
      rework allowance is exhausted; on a RELEASED batch a single FAIL condemns the food outright and
      heads the four-level rejection cascade.
    input: [step_code, measured_temp_c]
    output: HaccpCheck
    side_effects:
      - "creates an immutable HaccpCheck with verdict, sequence_no, measured_at_utc and recorded_by_user_id"
      - "recomputes ProductionBatch.haccp_risk_score"
      - "FAIL on an IN_PRODUCTION batch whose resulting fail_count <= HACCP_MAX_FAILS -> batch IN_PRODUCTION -> HACCP_HOLD"
      - "FAIL on an IN_PRODUCTION batch whose resulting fail_count > HACCP_MAX_FAILS (the third FAIL) -> batch -> REJECTED with scrapped_qty set to planned_qty and a HACCP_BREACH CRITICAL AuditFinding raised"
      - "FAIL on a RELEASED batch -> batch -> REJECTED, ACTIVE CartItem rows of the batch -> VOID, affected carts BUILT -> BUILDING and SEALED/RESEALED -> BROKEN, pinning manifest ISSUED -> AMENDED, that manifest's Flight LOADED -> PLANNED, and a HACCP_BREACH CRITICAL AuditFinding is raised"
      - "PASS never changes production_status"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_BATCH_NOT_FOUND, ERR_INVALID_BATCH_STATE, ERR_INVALID_REQUEST]

  - method: POST
    path: /production-batches/{id}/complete
    roles: [ProductionSupervisor]
    description: Closes production on a batch with the quantity actually produced.
    input: [produced_qty]
    output: ProductionBatch
    side_effects:
      - "IN_PRODUCTION -> COMPLETED with produced_qty stored and scrapped_qty set to planned_qty minus produced_qty"
      - "recomputes Flight.units_produced, Flight.units_scrapped and Flight.unit_balance"
      - "increments ProductionBatch.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_BATCH_NOT_FOUND, ERR_INVALID_BATCH_STATE, ERR_PRODUCED_QTY_EXCEEDS_PLAN, ERR_INVALID_REQUEST]

  - method: POST
    path: /production-batches/{id}/release
    roles: [ProductionSupervisor]
    description: Releases a completed batch to the cart-build floor once every required HACCP step passed.
    input: []
    output: ProductionBatch
    side_effects:
      - "COMPLETED -> RELEASED with released_at and released_by_user_id set"
      - "increments ProductionBatch.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_BATCH_NOT_FOUND, ERR_INVALID_BATCH_STATE, ERR_HACCP_STEP_MISSING, ERR_HACCP_HOLD_ACTIVE, ERR_HACCP_REWORK_LIMIT, ERR_RELEASE_DEADLINE_PASSED, ERR_INVALID_REQUEST]

  - method: GET
    path: /production-batches
    roles: *ALL_ROLES
    description: Lists production batches, filterable by flight, specification, store zone and status.
    input: ["flight_id?", "meal_specification_id?", "store_zone?", "production_status?", "is_overflow?", "limit?", "offset?"]
    output: ProductionBatch[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: GET
    path: /production-batches/{id}
    roles: *ALL_ROLES
    description: Reads one production batch including its derived haccp_risk_score and release_deadline_utc.
    input: []
    output: ProductionBatch
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_AIRLINE_SCOPE_VIOLATION, ERR_BATCH_NOT_FOUND]

  - method: GET
    path: /haccp-checks
    roles: *ALL_ROLES
    description: Lists HACCP checks, filterable by batch, step and verdict; ordered by sequence_no ASC within a batch.
    input: ["production_batch_id?", "step_code?", "verdict?", "limit?", "offset?"]
    output: HaccpCheck[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: GET
    path: /haccp-checks/{id}
    roles: *ALL_ROLES
    description: Reads one immutable HACCP check. There is no update or delete endpoint for this entity.
    input: []
    output: HaccpCheck
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_RESOURCE_NOT_FOUND]

  # --- carts, items, seals ----------------------------------------------
  - method: POST
    path: /carts
    roles: [LoadMaster]
    description: Registers an equipment cart for a flight in a given storage class.
    input: [flight_id, cart_code, cart_type, storage_class, capacity_units, "galley_position?"]
    output: Cart
    side_effects:
      - "creates a Cart with build_status EMPTY, seal_status UNSEALED, seal_count 0 and loaded_units 0"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_FLIGHT_NOT_FOUND, ERR_INVALID_FLIGHT_STATE]

  - method: POST
    path: /carts/{id}/items
    roles: [LoadMaster]
    description: >
      Loads units from a RELEASED batch into a cart. This is the endpoint where three validation
      priorities collide: the batch's release deadline (80), the batch/cart storage-class and flight
      coherence (90), the cart's capacity (100) and the airline's per-passenger cost cap (120).
    input: [production_batch_id, qty_units]
    output: CartItem
    side_effects:
      - "creates a CartItem in ACTIVE with meal_code copied from the batch's specification"
      - "Cart EMPTY -> BUILDING on the first ACTIVE item"
      - "recomputes Cart.loaded_units, Flight.units_loaded, Flight.unit_balance and Flight.cost_per_pax_cents"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_CART_NOT_FOUND, ERR_RESOURCE_NOT_FOUND, ERR_INVALID_CART_STATE, ERR_BATCH_NOT_RELEASED, ERR_RELEASE_DEADLINE_PASSED, ERR_STORAGE_CLASS_MISMATCH, ERR_CART_FLIGHT_MISMATCH, ERR_CART_CAPACITY_EXCEEDED, ERR_COST_CAP_EXCEEDED]

  - method: DELETE
    path: /carts/{id}/items/{cart_item_id}
    roles: [LoadMaster]
    description: Voids a loaded cart item. The row is never physically removed; it is marked VOID for audit.
    input: []
    output: CartItem
    side_effects:
      - "CartItem ACTIVE -> VOID with voided_at set"
      - "Cart BUILT -> BUILDING and seal_status SEALED or RESEALED -> BROKEN"
      - "a pinning ISSUED LoadingManifest -> AMENDED with amendment_count incremented, and its Flight LOADED -> PLANNED"
      - "recomputes Cart.loaded_units, Flight.units_loaded, Flight.unit_balance and Flight.cost_per_pax_cents; Flight.unit_balance returns to the value it held before the item was added"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_CART_NOT_FOUND, ERR_RESOURCE_NOT_FOUND, ERR_INVALID_RESOURCE_STATE, ERR_INVALID_REQUEST]

  - method: POST
    path: /carts/{id}/build-completion
    roles: [LoadMaster]
    description: Signs off the cart build. Moves only the build_status axis; seal_status is untouched.
    input: []
    output: Cart
    side_effects:
      - "Cart BUILDING -> BUILT with seal_status left exactly as it was"
      - "increments Cart.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_CART_NOT_FOUND, ERR_INVALID_CART_STATE, ERR_INVALID_REQUEST]

  - method: POST
    path: /carts/{id}/seals
    roles: [LoadMaster]
    description: >
      Fits a numbered security seal on a built cart. A new seal legitimately supersedes the previous
      one, so the call is guarded by expected_cart_version (§1.2.1 seal-create-stale-cart). Moves
      only the seal_status axis.
    input: [expected_cart_version, seal_number]
    output: Cart
    side_effects:
      - "UNSEALED -> SEALED with seal_count 1, or SEALED/BROKEN -> RESEALED with seal_count incremented"
      - "sets seal_number and sealed_by_user_id; build_status is left exactly as it was"
      - "a supersede on a cart pinned in an ISSUED manifest drives that manifest to AMENDED and its Flight LOADED -> PLANNED"
      - "increments Cart.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_CART_NOT_FOUND, ERR_STALE_CART_VERSION, ERR_INVALID_CART_STATE, ERR_BATCH_NOT_RELEASED, ERR_SEAL_NUMBER_DUPLICATE]

  - method: GET
    path: /carts
    roles: *ALL_ROLES
    description: Lists carts, filterable by flight, storage class and both state axes.
    input: ["flight_id?", "storage_class?", "cart_type?", "build_status?", "seal_status?", "limit?", "offset?"]
    output: Cart[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: GET
    path: /carts/{id}
    roles: *ALL_ROLES
    description: Reads one cart with both independent state axes and its seal history counter.
    input: []
    output: Cart
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_AIRLINE_SCOPE_VIOLATION, ERR_CART_NOT_FOUND]

  - method: GET
    path: /cart-items
    roles: *ALL_ROLES
    description: Lists cart items, filterable by cart, source batch and status; VOID items are included only when status is supplied.
    input: ["cart_id?", "production_batch_id?", "status?", "limit?", "offset?"]
    output: CartItem[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: GET
    path: /cart-items/{id}
    roles: *ALL_ROLES
    description: Reads one cart item.
    input: []
    output: CartItem
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_RESOURCE_NOT_FOUND]

  # --- loading manifests -------------------------------------------------
  - method: POST
    path: /flights/{id}/loading-manifests
    roles: [LoadMaster]
    description: >
      Opens a draft loading manifest for a flight. Guarded by expected_flight_version
      (§1.2.1 manifest-create-stale-flight) because a new draft voids any earlier draft of the same
      flight.
    input: [expected_flight_version]
    output: LoadingManifest
    side_effects:
      - "creates a LoadingManifest in DRAFT with manifest_number MFST-{flight_number}-{n}"
      - "any earlier LoadingManifest of the same flight still in DRAFT becomes VOID"
      - "increments Flight.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_FLIGHT_NOT_FOUND, ERR_STALE_FLIGHT_VERSION, ERR_INVALID_FLIGHT_STATE]

  - method: POST
    path: /loading-manifests/{id}/issue
    roles: [LoadMaster]
    description: >
      Issues (or re-issues) the manifest, pinning each cart's seal number and version into
      cart_seal_snapshot. Segregation of duties applies: the issuing user may not have sealed any
      cart in the snapshot.
    input: []
    output: LoadingManifest
    side_effects:
      - "DRAFT or AMENDED -> ISSUED, pinning cart_seal_snapshot ordered by Cart.created_at ASC and total_units"
      - "sets issued_at and issued_by_user_id"
      - "Flight PLANNED -> LOADED"
      - "increments LoadingManifest.version and Flight.version by 1 each"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_RESOURCE_NOT_FOUND, ERR_INVALID_RESOURCE_STATE, ERR_INVALID_FLIGHT_STATE, ERR_INVALID_CART_STATE, ERR_SEGREGATION_OF_DUTIES, ERR_INVALID_REQUEST]

  - method: GET
    path: /loading-manifests
    roles: *ALL_ROLES
    description: Lists loading manifests, filterable by flight and status.
    input: ["flight_id?", "status?", "limit?", "offset?"]
    output: LoadingManifest[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: GET
    path: /loading-manifests/{id}
    roles: *ALL_ROLES
    description: Reads one loading manifest including the pinned cart_seal_snapshot and amendment_count.
    input: []
    output: LoadingManifest
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_AIRLINE_SCOPE_VIOLATION, ERR_RESOURCE_NOT_FOUND]

  # --- delivery runs -----------------------------------------------------
  - method: POST
    path: /delivery-runs
    roles: [LoadMaster]
    description: >
      Reserves a truck and stand slot for delivering an issued manifest to the aircraft. Truck
      occupancy is half-open with a buffer; stand occupancy is a closed interval with an aggregate
      concurrency limit.
    input: [loading_manifest_id, truck_id, stand_id, window_start_utc, window_end_utc]
    output: DeliveryRun
    side_effects:
      - "creates a DeliveryRun in RESERVED with recovery_of_run_id null, lateness_minutes 0 and penalty_cents 0"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_RESOURCE_NOT_FOUND, ERR_MANIFEST_NOT_ISSUED, ERR_SLOT_WINDOW_INVALID, ERR_SLOT_OUTSIDE_FLIGHT_WINDOW, ERR_SLOT_RESOURCE_UNAVAILABLE, ERR_TRUCK_SLOT_CONFLICT, ERR_STAND_CAPACITY_CONFLICT]

  - method: POST
    path: /delivery-runs/{id}/events
    roles: [LoadMaster]
    description: >
      Advances a delivery run along the DISPATCH / ARRIVE / DELIVER success branch or the MISS
      failure branch. The two branches carry different side-effect sets: DELIVER applies the marginal
      lateness bands, MISS applies a flat penalty and never advances the flight.
    input: [event_type, "miss_reason?", "note?"]
    output: DeliveryRun
    side_effects:
      - "DISPATCH -> EN_ROUTE with dispatched_at_utc set"
      - "ARRIVE -> AT_AIRCRAFT with arrived_at_utc set"
      - "DELIVER -> DELIVERED with delivered_at_utc, lateness_minutes and banded penalty_cents; raises a LATE_DELIVERY MINOR AuditFinding when penalty_cents >= 1; drives Flight LOADED -> DEPARTED once every run of the ISSUED manifest is terminal with at least one DELIVERED, which also drives every BUILT Cart to LOADED"
      - "MISS -> MISSED with penalty_cents set to MISSED_FLAT_PENALTY_CENTS, lateness_minutes left at 0, miss_reason stored and a LATE_DELIVERY MAJOR AuditFinding raised; the Flight stays LOADED"
      - "increments DeliveryRun.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_RESOURCE_NOT_FOUND, ERR_INVALID_RUN_STATE, ERR_MANIFEST_NOT_ISSUED]

  - method: POST
    path: /delivery-runs/{id}/recovery-runs
    roles: [LoadMaster]
    description: Creates the recovery run for a MISSED run, revalidating the new window against truck and stand occupancy.
    input: [truck_id, stand_id, window_start_utc, window_end_utc]
    output: DeliveryRun
    side_effects:
      - "the MISSED run becomes RECOVERED"
      - "creates a new DeliveryRun in RESERVED with recovery_of_run_id set to the recovered run and the same loading_manifest_id"
      - "increments the recovered DeliveryRun.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_RESOURCE_NOT_FOUND, ERR_INVALID_RUN_STATE, ERR_SLOT_WINDOW_INVALID, ERR_SLOT_OUTSIDE_FLIGHT_WINDOW, ERR_SLOT_RESOURCE_UNAVAILABLE, ERR_TRUCK_SLOT_CONFLICT, ERR_STAND_CAPACITY_CONFLICT]

  - method: GET
    path: /delivery-runs
    roles: *ALL_ROLES
    description: Lists delivery runs, filterable by manifest, truck, stand, recovered run and status.
    input: ["loading_manifest_id?", "truck_id?", "stand_id?", "recovery_of_run_id?", "status?", "limit?", "offset?"]
    output: DeliveryRun[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: GET
    path: /delivery-runs/{id}
    roles: *ALL_ROLES
    description: Reads one delivery run with its slot window, timestamps, lateness and penalty.
    input: []
    output: DeliveryRun
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_AIRLINE_SCOPE_VIOLATION, ERR_RESOURCE_NOT_FOUND]

  # --- uplift reconciliation & waste -------------------------------------
  - method: POST
    path: /flights/{id}/uplift-records
    roles: [ComplianceOfficer]
    description: >
      Reconciles the uplift after departure. Guarded by expected_flight_version
      (§1.2.1 uplift-create-stale-flight). Computes the GROSS_UPLIFTED cost variant, the
      cost-per-passenger blend, the specification deviation and the seal mismatch count, and raises
      the SPEC_DEVIATION and SEAL_MISMATCH audit findings. `observed_seals` is the optional list of
      seal_number strings the ramp agent actually read off the returned carts; when it is omitted the
      manifest snapshot is taken as observed in full and seal_mismatch_count is 0.
    input: [expected_flight_version, lines, "observed_seals?"]
    output: UpliftRecord
    side_effects:
      - "creates an UpliftRecord in DRAFT with lines ordered by spec_code ASC and every derived money field populated"
      - "any earlier UpliftRecord of the flight still in DRAFT becomes VOID"
      - "Flight DEPARTED -> RECONCILED"
      - "raises a SPEC_DEVIATION AuditFinding when spec_deviation_pct >= Airline.spec_deviation_tolerance_pct and a SEAL_MISMATCH AuditFinding when seal_mismatch_count >= 1, each incrementing Airline.open_finding_count and possibly suspending the airline"
      - "increments Flight.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_FLIGHT_NOT_FOUND, ERR_RESOURCE_NOT_FOUND, ERR_STALE_FLIGHT_VERSION, ERR_INVALID_FLIGHT_STATE, ERR_UPLIFT_UNITS_MISMATCH]

  - method: POST
    path: /uplift-records/{id}/dispositions
    roles: [ComplianceOfficer]
    description: >
      Records the disposition of every returned unit as REUSE, DONATE or DESTROY and switches the
      cost calculation from GROSS_UPLIFTED to NET_CONSUMED. A BONDED airline may only DESTROY.
      `dispositions` is submitted as
      [{meal_specification_id, reuse_units, donate_units, destroy_units}] with exactly one entry per
      UpliftRecord.lines entry, matched on meal_specification_id.
    input: [dispositions]
    output: UpliftRecord
    side_effects:
      - "writes reuse_units, donate_units and destroy_units onto each line and recomputes net_cost_cents, handling_fee_cents and billing_total_cents"
      - "DRAFT -> DISPOSITIONED"
      - "every RELEASED ProductionBatch of the flight whose specification received destroy_units >= 1 becomes DISPOSED"
      - "increments UpliftRecord.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_RESOURCE_NOT_FOUND, ERR_INVALID_RESOURCE_STATE, ERR_BONDED_REUSE_FORBIDDEN, ERR_DISPOSITION_UNITS_MISMATCH]

  - method: GET
    path: /uplift-records
    roles: *ALL_ROLES
    description: Lists uplift records, filterable by flight and status.
    input: ["flight_id?", "status?", "limit?", "offset?"]
    output: UpliftRecord[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: GET
    path: /uplift-records/{id}
    roles: *ALL_ROLES
    description: Reads one uplift record with its lines and every derived money field.
    input: []
    output: UpliftRecord
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_AIRLINE_SCOPE_VIOLATION, ERR_RESOURCE_NOT_FOUND]

  - method: POST
    path: /waste-manifests
    roles: [ComplianceOfficer]
    description: >
      Raises the arrival waste manifest for the destroyed units. The regime is copied from the
      airline and constrains the permitted disposal_method; the mass is recomputed from the
      disposition lines, never submitted.
    input: [uplift_record_id, disposal_method, seal_number]
    output: WasteManifest
    side_effects:
      - "creates a WasteManifest in DRAFT with regime copied from the Airline and sealed_weight_grams from waste_manifest_mass"
      - "every LOADED Cart of the flight becomes RETURNED and its seal_status becomes BROKEN"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_RESOURCE_NOT_FOUND, ERR_INVALID_RESOURCE_STATE, ERR_BONDED_WASTE_DISPOSAL_INVALID, ERR_SEAL_NUMBER_DUPLICATE]

  - method: POST
    path: /waste-manifests/{id}/transitions
    roles: [ComplianceOfficer]
    description: Seals, disposes of or rejects an arrival waste manifest.
    input: [action, "rejection_reason?"]
    output: WasteManifest
    side_effects:
      - "SEAL -> SEALED"
      - "DISPOSE -> DISPOSED and drives the owning UpliftRecord DISPOSITIONED -> CLOSED"
      - "REJECT -> REJECTED with rejection_reason stored and seal_number released for reuse"
      - "increments WasteManifest.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_RESOURCE_NOT_FOUND, ERR_INVALID_RESOURCE_STATE]

  - method: GET
    path: /waste-manifests
    roles: *ALL_ROLES
    description: Lists waste manifests, filterable by uplift record, regime, disposal method and status.
    input: ["uplift_record_id?", "regime?", "disposal_method?", "status?", "limit?", "offset?"]
    output: WasteManifest[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: GET
    path: /waste-manifests/{id}
    roles: *ALL_ROLES
    description: Reads one waste manifest with its recomputed sealed_weight_grams.
    input: []
    output: WasteManifest
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_AIRLINE_SCOPE_VIOLATION, ERR_RESOURCE_NOT_FOUND]

  # --- audit -------------------------------------------------------------
  - method: POST
    path: /audit-findings
    roles: [AirlineRep, ComplianceOfficer]
    description: >
      Raises an audit finding manually. An AirlineRep may only raise findings against its own
      airline; the penalty is derived from finding_type and severity and can never be submitted.
    input: [airline_id, flight_id, finding_type, severity, "evidence_ref?"]
    output: AuditFinding
    side_effects:
      - "creates an AuditFinding in OPEN with source AIRLINE when raised by an AirlineRep and SYSTEM otherwise, and penalty_cents from audit_penalty"
      - "increments Airline.open_finding_count by 1, which drives Airline ACTIVE -> SUSPENDED at OPEN_FINDING_SUSPEND_THRESHOLD and sets production_hold on every SCHEDULED or COUNTS_LOCKED flight of that airline"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_AIRLINE_SCOPE_VIOLATION, ERR_INVALID_REQUEST, ERR_RESOURCE_NOT_FOUND, ERR_FLIGHT_NOT_FOUND]

  - method: POST
    path: /audit-findings/{id}/resolution
    roles: [ComplianceOfficer, AirlineRep]
    description: >
      Resolves an audit finding. DISPUTE and ACCEPT belong to the ComplianceOfficer; WITHDRAW belongs
      to the AirlineRep and compensates an earlier ACCEPT exactly.
    input: [action, "note?"]
    output: AuditFinding
    side_effects:
      - "DISPUTE -> DISPUTED and decrements Airline.open_finding_count"
      - "ACCEPT -> ACCEPTED, adds penalty_cents to Airline.penalty_accrued_cents and decrements open_finding_count when the prior status was OPEN"
      - "WITHDRAW -> WITHDRAWN and subtracts penalty_cents from Airline.penalty_accrued_cents when the prior status was ACCEPTED, leaving the airline's accrual exactly at its pre-ACCEPT value"
      - "a decrement that takes open_finding_count below OPEN_FINDING_SUSPEND_THRESHOLD drives Airline SUSPENDED -> ACTIVE and clears production_hold on that airline's flights"
      - "increments AuditFinding.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_AIRLINE_SCOPE_VIOLATION, ERR_INVALID_REQUEST, ERR_RESOURCE_NOT_FOUND, ERR_INVALID_RESOURCE_STATE]

  - method: GET
    path: /audit-findings
    roles: *ALL_ROLES
    description: Lists audit findings, filterable by airline, flight, type, severity, source and status.
    input: ["airline_id?", "flight_id?", "finding_type?", "severity?", "source?", "status?", "limit?", "offset?"]
    output: AuditFinding[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: GET
    path: /audit-findings/{id}
    roles: *ALL_ROLES
    description: Reads one audit finding with its derived penalty_cents.
    input: []
    output: AuditFinding
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_AIRLINE_SCOPE_VIOLATION, ERR_RESOURCE_NOT_FOUND]

# =============================================================================
# §1.6 Error Catalog — 44 codes; every code is reachable from §1.5
# =============================================================================
errors:

  # --- authentication & authorisation ------------------------------------
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    category: auth
    message: "X-User-ID header missing or unknown."
    triggered_by: "any endpoint except POST /_clock/set_current_utc, called without a resolvable X-User-ID"
  - error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    category: authz
    message: "Role is not permitted to perform this operation."
    triggered_by: "any endpoint called by a role outside its declared roles list"
  - error_id: ERR_AIRLINE_SCOPE_VIOLATION
    http_status: 403
    category: ownership
    message: "AirlineRep may only access rows belonging to its own airline."
    triggered_by: "an AirlineRep reading or writing a row whose resolved airline_id differs from its X-User-ID"
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    category: compliance_safety
    message: "The user who sealed a cart may not issue the manifest that pins it."
    triggered_by: "POST /loading-manifests/{id}/issue by the same LoadMaster who sealed a snapshot cart"

  # --- request shape -----------------------------------------------------
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    category: shape
    message: "Request body or query parameters failed schema validation."
    triggered_by: "missing required field, wrong JSON type, undeclared enum member, out-of-range integer, unparseable instant or unknown field on any endpoint"

  # --- existence ---------------------------------------------------------
  - error_id: ERR_FLIGHT_NOT_FOUND
    http_status: 404
    category: path_existence
    message: "No flight with the supplied id."
    triggered_by: "any endpoint whose path or body names a non-existent Flight"
  - error_id: ERR_BATCH_NOT_FOUND
    http_status: 404
    category: path_existence
    message: "No production batch with the supplied id."
    triggered_by: "any endpoint whose path names a non-existent ProductionBatch"
  - error_id: ERR_CART_NOT_FOUND
    http_status: 404
    category: path_existence
    message: "No cart with the supplied id."
    triggered_by: "any endpoint whose path names a non-existent Cart"
  - error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    category: path_existence
    message: "The referenced resource does not exist."
    triggered_by: "any endpoint naming a non-existent Airline, MealSpecification, SpecialMealOrder, HaccpCheck, CartItem, LoadingManifest, Truck, Stand, DeliveryRun, UpliftRecord, WasteManifest or AuditFinding"

  # --- optimistic concurrency -------------------------------------------
  - error_id: ERR_STALE_FLIGHT_VERSION
    http_status: 412
    category: concurrency
    message: "expected_flight_version does not match the flight's current version."
    triggered_by: "POST /flights/{id}/loading-manifests or POST /flights/{id}/uplift-records with a stale expected_flight_version"
  - error_id: ERR_STALE_CART_VERSION
    http_status: 412
    category: concurrency
    message: "expected_cart_version does not match the cart's current version."
    triggered_by: "POST /carts/{id}/seals with a stale expected_cart_version"

  # --- state -------------------------------------------------------------
  - error_id: ERR_INVALID_FLIGHT_STATE
    http_status: 409
    category: state
    message: "The flight is not in a state from which this operation is defined."
    triggered_by: "locking counts twice, planning a flight that is not COUNTS_LOCKED, reconciling a flight that is not DEPARTED, or cancelling a RECONCILED or CANCELLED flight"
  - error_id: ERR_INVALID_BATCH_STATE
    http_status: 409
    category: state
    message: "The production batch is not in a state from which this operation is defined."
    triggered_by: "starting a COMPLETED batch, completing a PLANNED batch, releasing an IN_PRODUCTION batch or recording a HACCP check on a REJECTED batch"
  - error_id: ERR_INVALID_CART_STATE
    http_status: 409
    category: state
    message: "The cart is not in a state from which this operation is defined."
    triggered_by: "signing off the build on an EMPTY cart, sealing a cart that is not BUILT, or loading items into a RETURNED cart"
  - error_id: ERR_INVALID_RUN_STATE
    http_status: 409
    category: state
    message: "The delivery run is not in a state from which this event is defined."
    triggered_by: "DELIVER on a RESERVED run, ARRIVE on a DELIVERED run, or creating a recovery run for a run that is not MISSED"
  - error_id: ERR_INVALID_RESOURCE_STATE
    http_status: 409
    category: state
    message: "The resource is not in a state from which this operation is defined."
    triggered_by: "issuing a VOID manifest, changing a CANCELLED special meal order, dispositioning a CLOSED uplift record, disposing of a DRAFT waste manifest or resolving a WITHDRAWN finding"
  - error_id: ERR_FLIGHT_COUNTS_LOCKED
    http_status: 409
    category: state
    message: "Passenger counts and special meal capture are closed for this flight."
    triggered_by: "PATCH /flights/{id}/pax-counts or POST /special-meal-orders once Flight.status is not SCHEDULED"
  - error_id: ERR_BATCH_NOT_RELEASED
    http_status: 409
    category: state
    message: "Units may only be loaded from a RELEASED batch."
    triggered_by: "POST /carts/{id}/items naming a batch that is not RELEASED, or sealing a cart holding an ACTIVE item from a batch that is not RELEASED"
  - error_id: ERR_MANIFEST_NOT_ISSUED
    http_status: 409
    category: state
    message: "The loading manifest must be ISSUED for this operation."
    triggered_by: "POST /delivery-runs against a DRAFT manifest, or DISPATCH on a run whose manifest fell back to AMENDED"

  # --- food-safety gates -------------------------------------------------
  - error_id: ERR_HACCP_STEP_MISSING
    http_status: 422
    category: business_safety
    message: "A required HACCP step has no recorded check."
    triggered_by: "POST /production-batches/{id}/release when a step in required_haccp_steps has no HaccpCheck at all"
  - error_id: ERR_HACCP_HOLD_ACTIVE
    http_status: 422
    category: business_safety
    message: "The latest check for a required HACCP step failed."
    triggered_by: "POST /production-batches/{id}/release when the highest-sequence_no HaccpCheck of a step in required_haccp_steps has verdict FAIL"
  - error_id: ERR_HACCP_REWORK_LIMIT
    http_status: 422
    category: business_safety
    message: "The batch has consumed its HACCP rework allowance and can no longer be certified."
    triggered_by: "POST /production-batches/{id}/release on a batch whose haccp_rework_rounds >= HACCP_MAX_REWORK_ROUNDS, with every required step's latest check PASSing"
  - error_id: ERR_RELEASE_DEADLINE_PASSED
    http_status: 422
    category: business_safety
    message: "The batch's release deadline has passed."
    triggered_by: "POST /production-batches/{id}/start or /release at or after release_deadline_utc, or POST /carts/{id}/items from a batch past its deadline"
  - error_id: ERR_BONDED_WASTE_DISPOSAL_INVALID
    http_status: 422
    category: compliance_safety
    message: "Disposal method is not permitted under the airline's waste regime."
    triggered_by: "POST /waste-manifests with disposal_method outside ALLOWED_DISPOSAL for the airline's regime"
  - error_id: ERR_BONDED_REUSE_FORBIDDEN
    http_status: 422
    category: compliance_safety
    message: "Bonded international waste may not be re-used or donated."
    triggered_by: "POST /uplift-records/{id}/dispositions with reuse_units or donate_units >= 1 for a BONDED airline"
  - error_id: ERR_AIRLINE_SUSPENDED
    http_status: 422
    category: compliance_safety
    message: "The airline is suspended or the flight is on production hold."
    triggered_by: "POST /flights/{id}/production-plan for a SUSPENDED airline or a flight with production_hold true"

  # --- cross-row coherence ----------------------------------------------
  - error_id: ERR_STORAGE_CLASS_MISMATCH
    http_status: 422
    category: business_referential
    message: "The batch's store zone does not match the cart's storage class."
    triggered_by: "POST /carts/{id}/items loading a HOT batch into a CHILL cart"
  - error_id: ERR_CART_FLIGHT_MISMATCH
    http_status: 422
    category: business_referential
    message: "The batch and the cart belong to different flights."
    triggered_by: "POST /carts/{id}/items naming a batch of another flight"
  - error_id: ERR_SPEC_RETIRED
    http_status: 422
    category: business_referential
    message: "The referenced meal specification is RETIRED."
    triggered_by: "POST /special-meal-orders or a SUBSTITUTE change naming a RETIRED specification"
  - error_id: ERR_SPEC_AIRLINE_MISMATCH
    http_status: 422
    category: business_referential
    message: "The meal specification belongs to a different airline, or to a different cabin than the order."
    triggered_by: "POST /special-meal-orders naming another airline's specification, or a SUBSTITUTE change to a different cabin"

  # --- capacity, uniqueness, conservation --------------------------------
  - error_id: ERR_CART_CAPACITY_EXCEEDED
    http_status: 422
    category: business_constraint
    message: "Loading these units would exceed the cart's capacity."
    triggered_by: "POST /carts/{id}/items where loaded_units + qty_units > capacity_units"
  - error_id: ERR_STORE_CAPACITY_EXCEEDED
    http_status: 422
    category: business_constraint
    message: "Zone capacity is exhausted and the overflow chain cannot absorb the remainder."
    triggered_by: "POST /flights/{id}/production-plan whose waterfall leaves unallocated units"
  - error_id: ERR_SEAL_NUMBER_DUPLICATE
    http_status: 422
    category: business_constraint
    message: "The seal number is already in use."
    triggered_by: "POST /carts/{id}/seals or POST /waste-manifests reusing a seal_number held by a live Cart or WasteManifest"
  - error_id: ERR_DUPLICATE_SEAT_ORDER
    http_status: 422
    category: business_constraint
    message: "A non-terminal special meal order already exists for this seat on this flight."
    triggered_by: "POST /special-meal-orders repeating a seat_number whose earlier order is still REQUESTED, CONFIRMED or LATE_REJECTED"
  - error_id: ERR_PRODUCED_QTY_EXCEEDS_PLAN
    http_status: 422
    category: business_constraint
    message: "produced_qty may not exceed planned_qty."
    triggered_by: "POST /production-batches/{id}/complete with produced_qty > planned_qty"
  - error_id: ERR_UPLIFT_UNITS_MISMATCH
    http_status: 422
    category: business_constraint
    message: "consumed_units plus returned_units must equal the units actually uplifted."
    triggered_by: "POST /flights/{id}/uplift-records whose submitted line totals do not reconcile against the ACTIVE cart items"
  - error_id: ERR_DISPOSITION_UNITS_MISMATCH
    http_status: 422
    category: business_constraint
    message: "reuse plus donate plus destroy must equal the line's returned units."
    triggered_by: "POST /uplift-records/{id}/dispositions whose line totals do not reconcile"

  # --- clock, windows and resources -------------------------------------
  - error_id: ERR_SPECIAL_MEAL_CUTOFF_PASSED
    http_status: 422
    category: business_temporal
    message: "The special meal change cutoff for this flight has passed."
    triggered_by: "POST /special-meal-orders or a CANCEL change at or after special_meal_cutoff_utc"
  - error_id: ERR_SLOT_WINDOW_INVALID
    http_status: 422
    category: business_temporal
    message: "window_start_utc must be strictly before window_end_utc."
    triggered_by: "POST /delivery-runs or POST /delivery-runs/{id}/recovery-runs with an empty or inverted window"
  - error_id: ERR_SLOT_OUTSIDE_FLIGHT_WINDOW
    http_status: 422
    category: business_temporal
    message: "The delivery window falls outside the flight's permitted slot band."
    triggered_by: "a window whose end is later than revised_std_utc minus SLOT_LATEST_LEAD_MINUTES, or whose start is earlier than revised_std_utc minus SLOT_EARLIEST_LEAD_MINUTES"
  - error_id: ERR_TRUCK_SLOT_CONFLICT
    http_status: 422
    category: business_temporal
    message: "The truck is already committed within its inter-run buffer."
    triggered_by: "a run whose window_start_utc falls before an existing run's window_end_utc plus Truck.buffer_minutes"
  - error_id: ERR_STAND_CAPACITY_CONFLICT
    http_status: 422
    category: business_temporal
    message: "The stand would exceed its concurrent-run limit."
    triggered_by: "a run that would make more than Stand.max_concurrent_runs non-cancelled runs cover a common instant, including a shared endpoint instant"
  - error_id: ERR_SLOT_RESOURCE_UNAVAILABLE
    http_status: 422
    category: business_temporal
    message: "The truck is in MAINTENANCE or the stand is CLOSED."
    triggered_by: "POST /delivery-runs or a recovery run naming a non-ACTIVE truck or stand"

  # --- money -------------------------------------------------------------
  - error_id: ERR_COST_CAP_EXCEEDED
    http_status: 422
    category: business_fiscal
    message: "The resulting cost per passenger would exceed the airline's contractual cap."
    triggered_by: "POST /carts/{id}/items whose resulting Flight.cost_per_pax_cents exceeds Airline.cost_cap_per_pax_cents"

# =============================================================================
# §1.7 RBAC Matrix — 7 roles; `identity:` is mandatory on every role
# =============================================================================
roles:

  - role: PlatformAdmin
    identity: opaque
    description: >
      Catering-network administrator. Owns reference data — airline contracts, meal specifications,
      trucks and stands — and nothing operational. Cannot ingest flights, plan production, build
      carts, deliver or reconcile.
    exclusive_operations:
      - "POST /airlines"
      - "POST /meal-specifications"
      - "PATCH /meal-specifications/{id}"
      - "POST /trucks"
      - "PATCH /trucks/{id}"
      - "POST /stands"
      - "PATCH /stands/{id}"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - role: ScheduleFeedOperator
    identity: opaque
    description: >
      Owns the schedule feed. Ingests flights and passenger counts, locks the counts, records delays
      and cancels flights. Cannot capture special meal orders, plan production or touch carts.
    exclusive_operations:
      - "POST /flights"
      - "PATCH /flights/{id}/pax-counts"
      - "PATCH /flights/{id}/schedule"
      - "POST /flights/{id}/lock-counts"
      - "POST /flights/{id}/delays"
      - "POST /flights/{id}/cancel"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - role: AirlineRep
    identity: "entity_backed:Airline"
    description: >
      The airline customer's own representative. X-User-ID IS the Airline.id, so every read and write
      is scoped to that airline and anything else raises ERR_AIRLINE_SCOPE_VIOLATION (priority 50).
      Captures and cancels special meal orders, raises findings against its own airline and withdraws
      findings it accepts responsibility for reversing.
    exclusive_operations:
      - "POST /special-meal-orders"
      - "POST /special-meal-orders/{id}/changes with action CANCEL"
      - "POST /audit-findings/{id}/resolution with action WITHDRAW"
    shared_operations:
      - "POST /audit-findings (shared with ComplianceOfficer; source is recorded as AIRLINE)"
      - "every GET endpoint, filtered to its own airline"
      - "POST /_clock/set_current_utc"

  - role: ProductionSupervisor
    identity: opaque
    description: >
      Runs the kitchen. Plans production, starts, completes and releases batches, and substitutes
      specifications for confirmed special meal orders. Cannot record HACCP verdicts — that split is
      the segregation of duties between production and quality.
    exclusive_operations:
      - "POST /flights/{id}/production-plan"
      - "POST /production-batches/{id}/start"
      - "POST /production-batches/{id}/complete"
      - "POST /production-batches/{id}/release"
      - "POST /special-meal-orders/{id}/changes with action SUBSTITUTE"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - role: QaOfficer
    identity: opaque
    description: >
      Food-safety quality officer. The only role permitted to record HACCP temperature measurements,
      and deliberately not permitted to release the batch those measurements gate.
    exclusive_operations:
      - "POST /production-batches/{id}/haccp-checks"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - role: LoadMaster
    identity: opaque
    description: >
      Owns cart build, sealing, manifesting and delivery to the aircraft. Segregation of duties
      applies WITHIN this role: the individual X-User-ID that sealed a cart may not issue the
      manifest that pins that cart's seal.
    exclusive_operations:
      - "POST /carts"
      - "POST /carts/{id}/items"
      - "DELETE /carts/{id}/items/{cart_item_id}"
      - "POST /carts/{id}/build-completion"
      - "POST /carts/{id}/seals"
      - "POST /flights/{id}/loading-manifests"
      - "POST /loading-manifests/{id}/issue"
      - "POST /delivery-runs"
      - "POST /delivery-runs/{id}/events"
      - "POST /delivery-runs/{id}/recovery-runs"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - role: ComplianceOfficer
    identity: opaque
    description: >
      Owns post-flight reconciliation, unused-meal disposition, bonded waste handling and the audit
      docket. Cannot build or seal carts, and cannot release production.
    exclusive_operations:
      - "POST /flights/{id}/uplift-records"
      - "POST /uplift-records/{id}/dispositions"
      - "POST /waste-manifests"
      - "POST /waste-manifests/{id}/transitions"
      - "POST /audit-findings/{id}/resolution with action DISPUTE or ACCEPT"
    shared_operations:
      - "POST /audit-findings (shared with AirlineRep; source is recorded as SYSTEM)"
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

segregation_of_duties:
  - rule: "The LoadMaster X-User-ID that appears in Cart.sealed_by_user_id for any cart entering a manifest snapshot may not be the X-User-ID issuing that manifest."
    enforced_at: "POST /loading-manifests/{id}/issue, validation priority 85"
    error_id: ERR_SEGREGATION_OF_DUTIES
  - rule: "HACCP verdicts are recorded only by QaOfficer while batch release is performed only by ProductionSupervisor, so no single role can both certify and release food."
    enforced_at: "POST /production-batches/{id}/haccp-checks and POST /production-batches/{id}/release, validation priority 20"
    error_id: ERR_FORBIDDEN_ROLE
