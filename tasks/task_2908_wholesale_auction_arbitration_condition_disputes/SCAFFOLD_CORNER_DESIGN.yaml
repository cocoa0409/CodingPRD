      - name: a_fee_payment_against_an_unknown_buyer_returns_buyer_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_BUYER_NOT_FOUND]
          - validations[priority 9 ERR_BUYER_NOT_FOUND]
        distinguishing_aspect: "The 404 on the unknown {id} is reported before the OCC comparison, so a deliberately wrong expected_buyer_version still yields ERR_BUYER_NOT_FOUND rather than 412."
        test_recipe:
          setup: ["One registered buyer, whose id is not the one used in the trigger."]
