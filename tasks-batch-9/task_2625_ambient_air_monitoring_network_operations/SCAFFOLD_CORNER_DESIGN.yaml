          assert:
            - "${o1} == PASS because round(5.004, 2) == 5.00 <= 5.0"
            - "${o2} == WARN because round(5.005, 2) == 5.01 > 5.0 and 5.01 <= 7.5"
            - "${o3} == WARN because 2.25 <= 1.5 * 1.5 == 2.25 inclusively"
            - "${o4} == FAIL because 2.26 > 2.25"
            - "Monitor.${mon_id}.last_span_check_at == 2026-01-04T00:00:00Z and last_zero_check_at == 2026-01-04T12:00:00Z - the FAIL did not advance the zero timestamp"
