          With the regulated ammonium-nitrate line routed to a CONTROLLED dome the priority-16 gate is
          satisfied and the create returns 201 with security_status PENDING (not EXEMPT, because the
          line is regulated) and allocation_status UNALLOCATED — the clearance dimension starts unset,
          it is not auto-granted by a compliant destination.
        test_recipe:
          setup:
            - "One plant, one train with an ACTIVE zero-hour charge, one APPROVED run PR-1 with target_ammonia_tons 5000."
            - "One REGULATED AMMONIUM_NITRATE product line (0.213 ammonia tons per ton, 46.255 conversion)."
            - "One AMMONIUM_NITRATE dome of capacity 20000 with security_class CONTROLLED."
