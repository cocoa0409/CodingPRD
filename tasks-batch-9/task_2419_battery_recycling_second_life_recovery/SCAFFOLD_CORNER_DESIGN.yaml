            - "${s2} == 75.00 as well: the raw 5000/200 == 25.0 points are clamped to CYCLE_PENALTY_CAP_POINTS 20.0, so the extra 1000 cycles change nothing"
            - "${g1} == B, ${g2} == B and ${d1} == SECOND_LIFE"
            - "${s3} == 73.40 == 80.0 - min(20.0, 1000/200) - (80.0-78.0)*0.8 == 80.0 - 5.0 - 1.6, with ${g3} == B and ${d3} == SECOND_LIFE"
            - "Module.${m1_id}.status == SECOND_LIFE_QUEUE, Module.${m2_id}.status == SECOND_LIFE_QUEUE and Module.${m3_id}.status == SECOND_LIFE_QUEUE with second_life_score mirroring each score"

      - name: grade_band_floors_are_inclusive_lower_bounds
