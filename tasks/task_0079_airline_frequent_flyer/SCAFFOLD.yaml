scenario: "79. Airline Frequent Flyer & Upgrade: segment accrual, Status Match, Tier annual threshold, priority upgrade waitlist, Award pricing (dynamic/fixed), companion certificate, points gifting, expiration"
domain_name: airline-frequent-flyer
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - selector_policy
    - scheduled_deferred_actions
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: peer_roles
  consistency_model: immediate
  notes: |
    Members earn redeemable Points and qualifying Segments by completing booked
    Segments. Qualifying Segments roll up to a Tier whose annual threshold gates
    benefits; a Status Match is a one-time accelerator. Award pricing is a
    pricing engine with two valid algorithms (dynamic vs fixed) keyed off the
    same fare data. Upgrade requests compete for a finite cabin pool through a
    priority-ranked waitlist (quota/allocation). Companion certificates and
    points gifting both move conserved Points/seat quantities and demand
    compensating-invariant accounting. Points expire on a rolling-activity clock.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Member contact email; unique across all members.
        constraints: required, unique, non-empty
      - name: full_name
        type: string
        source: input
        description: Member legal name printed on the loyalty account.
        constraints: required, non-empty
      - name: home_airport
        type: string
        source: input
        description: IATA 3-letter code of the member's home airport.
        constraints: required, exactly 3 uppercase letters
      - name: points_balance
        type: integer
        source: computed
        description: >-
          Current redeemable points. Increased by accrual on segment completion,
          status-match bonus, and inbound gifts; decreased by award redemptions,
          outbound gifts, and expiration sweeps. Floor 0.
        default: 0
        constraints: ">= 0; recomputed as sum of non-expired PointsLedger.delta"
      - name: qualifying_segments_ytd
        type: integer
        source: computed
        description: >-
          Count of qualifying segments flown in the current program year. Resets
          to 0 when the program year rolls over via the year-end run.
        default: 0
        constraints: ">= 0"
      - name: tier
        type: enum
        source: computed
        description: >-
          Derived loyalty tier. One of BASE, SILVER, GOLD, PLATINUM. Recomputed
          from qualifying_segments_ytd against TIER_THRESHOLDS, never lowered
          mid-year (see status_match_active and effective_tier).
        default: BASE
        constraints: "one of [BASE, SILVER, GOLD, PLATINUM]"
      - name: status_match_active
        type: boolean
        source: computed
        description: >-
          True while a granted StatusMatch is within its validity window. While
          true, effective_tier is floored at the matched tier.
        default: false
      - name: status_match_used
        type: boolean
        source: computed
        description: >-
          True once this member has ever consumed their single lifetime status
          match. Blocks any further StatusMatch grant.
        default: false
      - name: last_activity_at
        type: datetime
        source: computed
        description: >-
          Timestamp of the most recent points-earning or points-spending event.
          Drives rolling expiration (EXPIRY_MONTHS of inactivity).
        default: null
  - name: FlightSegment
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member who flew this segment."
        constraints: required
      - name: origin
        type: string
        source: input
        description: IATA origin airport code.
        constraints: required, exactly 3 uppercase letters
      - name: destination
        type: string
        source: input
        description: IATA destination airport code.
        constraints: "required, exactly 3 uppercase letters, != origin"
      - name: fare_class
        type: enum
        source: input
        description: >-
          Booking fare class. One of DISCOUNT, ECONOMY, BUSINESS, FIRST. Sets the
          accrual multiplier and qualifying eligibility.
        constraints: "one of [DISCOUNT, ECONOMY, BUSINESS, FIRST]"
      - name: distance_miles
        type: integer
        source: input
        description: Great-circle distance of the segment in miles.
        constraints: "required, >= 1"
      - name: base_fare_usd
        type: number
        source: input
        description: Paid base fare in USD; drives points accrual.
        constraints: "required, >= 0"
      - name: scheduled_departure
        type: datetime
        source: input
        description: ISO 8601 UTC scheduled departure instant.
        constraints: required
      - name: status
        type: enum
        source: computed
        description: >-
          Segment lifecycle. BOOKED -> FLOWN -> ACCRUED, or BOOKED -> CANCELLED.
        default: BOOKED
        constraints: "one of [BOOKED, FLOWN, ACCRUED, CANCELLED]"
      - name: is_qualifying
        type: boolean
        source: computed
        description: >-
          Whether this segment counts toward qualifying_segments_ytd. True iff
          fare_class is not DISCOUNT at accrual time.
        default: false
      - name: points_awarded
        type: integer
        source: computed
        description: >-
          Redeemable points minted to the member when this segment reached
          ACCRUED. 0 until accrued; frozen thereafter for compensation accounting.
        default: 0
  - name: AwardBooking
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; member redeeming points for this award."
        constraints: required
      - name: route_code
        type: string
        source: input
        description: Origin-destination route token, e.g. "SFO-NRT".
        constraints: required, non-empty
      - name: cabin
        type: enum
        source: input
        description: "Requested award cabin. One of ECONOMY, BUSINESS, FIRST."
        constraints: "one of [ECONOMY, BUSINESS, FIRST]"
      - name: pricing_mode
        type: enum
        source: input
        description: >-
          Which pricing algorithm to apply. DYNAMIC reads live demand load_factor;
          FIXED reads the published award chart. The two produce different point
          costs for identical inputs.
        constraints: "one of [DYNAMIC, FIXED]"
      - name: load_factor
        type: number
        source: input
        description: >-
          Live cabin demand fraction in [0,1] used only by DYNAMIC pricing.
          Required when pricing_mode == DYNAMIC; ignored otherwise.
        default: null
        constraints: "if present, 0 <= load_factor <= 1"
      - name: points_price
        type: integer
        source: computed
        description: >-
          Points debited from the member for this award, computed at REQUESTED
          time and pinned. Frozen at issuance; refunded verbatim on cancellation.
        default: 0
      - name: companion_certificate_id
        type: string
        source: input
        description: >-
          "FK -> CompanionCertificate.id; optional. When supplied, a companion
          seat is attached at a discounted points add-on."
        default: null
      - name: status
        type: enum
        source: computed
        description: >-
          Award lifecycle. QUOTED -> ISSUED -> (CANCELLED | FLOWN). QUOTED is a
          held price; ISSUED has debited points and reserved a seat.
        default: QUOTED
        constraints: "one of [QUOTED, ISSUED, CANCELLED, FLOWN]"
  - name: UpgradeRequest
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; member requesting the upgrade."
        constraints: required
      - name: flight_pool_id
        type: string
        source: input
        description: "FK -> FlightPool.id; the flight/cabin whose seats are contested."
        constraints: required
      - name: requested_at
        type: datetime
        source: system
        description: Server timestamp when the request joined the waitlist; tie-break key.
      - name: priority_score
        type: integer
        source: computed
        description: >-
          Waitlist rank key. Derived from member effective_tier and fare_class
          weight. Higher is better; ties broken by earlier requested_at.
        default: 0
      - name: status
        type: enum
        source: computed
        description: >-
          Upgrade lifecycle. WAITLISTED -> (CLEARED | DENIED | WITHDRAWN). CLEARED
          consumes a pool seat; DENIED is set by the clearing run when no seat is
          left.
        default: WAITLISTED
        constraints: "one of [WAITLISTED, CLEARED, DENIED, WITHDRAWN]"
  - name: FlightPool
    parent: null
    common_fields: true
    fields:
      - name: flight_number
        type: string
        source: input
        description: Operating flight number, e.g. "UA837".
        constraints: required, non-empty
      - name: departure_at
        type: datetime
        source: input
        description: ISO 8601 UTC scheduled departure; clearing run gates on this.
        constraints: required
      - name: premium_capacity
        type: integer
        source: input
        description: Total premium-cabin seats available for upgrade clearance.
        constraints: "required, >= 0"
      - name: seats_cleared
        type: integer
        source: computed
        description: >-
          Count of premium seats consumed by CLEARED upgrades. Invariant:
          seats_cleared + seats_remaining == premium_capacity.
        default: 0
        constraints: ">= 0; <= premium_capacity"
      - name: seats_remaining
        type: integer
        source: computed
        description: >-
          premium_capacity - seats_cleared. The finite pool the waitlist competes for.
        default: 0
      - name: cleared
        type: boolean
        source: computed
        description: True once the clearing run has executed for this pool.
        default: false
  - name: CompanionCertificate
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; certificate owner."
        constraints: required
      - name: valid_from
        type: datetime
        source: input
        description: ISO 8601 UTC start of the certificate validity window (inclusive).
        constraints: required
      - name: valid_until
        type: datetime
        source: input
        description: >-
          ISO 8601 UTC end of the certificate validity window (inclusive). The
          attached award's scheduled travel must fall within [valid_from, valid_until].
        constraints: "required, > valid_from"
      - name: status
        type: enum
        source: computed
        description: >-
          Certificate lifecycle. ISSUED -> (RESERVED | EXPIRED); RESERVED ->
          (REDEEMED | ISSUED). RESERVED holds it against a QUOTED/ISSUED award.
        default: ISSUED
        constraints: "one of [ISSUED, RESERVED, REDEEMED, EXPIRED]"
      - name: attached_award_id
        type: string
        source: computed
        description: "FK -> AwardBooking.id; the award currently holding this certificate, or null."
        default: null
  - name: PointsGift
    parent: null
    common_fields: true
    fields:
      - name: sender_id
        type: string
        source: input
        description: "FK -> Member.id; member sending points."
        constraints: required
      - name: recipient_id
        type: string
        source: input
        description: "FK -> Member.id; member receiving points. Must differ from sender_id."
        constraints: required
      - name: amount
        type: integer
        source: input
        description: Points transferred from sender to recipient.
        constraints: "required, >= 1"
      - name: status
        type: enum
        source: computed
        description: "Gift lifecycle. PENDING -> (SETTLED | REVERSED)."
        default: PENDING
        constraints: "one of [PENDING, SETTLED, REVERSED]"
  - name: StatusMatch
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; member granted the status match."
        constraints: required
      - name: rival_tier
        type: enum
        source: input
        description: >-
          Tier held at the rival airline being matched. One of SILVER, GOLD,
          PLATINUM. The granted matched_tier is one step below this rival_tier.
        constraints: "one of [SILVER, GOLD, PLATINUM]"
      - name: matched_tier
        type: enum
        source: computed
        description: >-
          The tier this member is floored at while the match is active. Derived
          one rung below rival_tier (SILVER->BASE? no: see calc).
        default: BASE
        constraints: "one of [BASE, SILVER, GOLD, PLATINUM]"
      - name: valid_until
        type: datetime
        source: input
        description: >-
          ISO 8601 UTC expiry of the match window (inclusive). After this instant
          the year-end / activity run deactivates the match.
        constraints: required
      - name: status
        type: enum
        source: computed
        description: "Match lifecycle. GRANTED -> EXPIRED."
        default: GRANTED
        constraints: "one of [GRANTED, EXPIRED]"
  - name: PointsLedger
    parent: null
    common_fields: false
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; account this ledger row belongs to."
        constraints: required
      - name: delta
        type: integer
        source: system
        description: >-
          Signed point movement. Positive for accrual/gift-in/match-bonus,
          negative for redemption/gift-out/expiry. Append-only.
        constraints: required, non-zero
      - name: reason
        type: enum
        source: system
        description: >-
          Why this row exists. One of ACCRUAL, REDEMPTION, REDEMPTION_REFUND,
          GIFT_OUT, GIFT_IN, STATUS_MATCH_BONUS, EXPIRY.
        constraints: "one of [ACCRUAL, REDEMPTION, REDEMPTION_REFUND, GIFT_OUT, GIFT_IN, STATUS_MATCH_BONUS, EXPIRY]"
      - name: source_type
        type: enum
        source: system
        description: >-
          Polymorphic origin entity type. One of FlightSegment, AwardBooking,
          PointsGift, StatusMatch, System.
        constraints: "one of [FlightSegment, AwardBooking, PointsGift, StatusMatch, System]"
      - name: source_id
        type: string
        source: system
        description: >-
          Polymorphic id of the originating entity (interpreted per source_type).
          Identity reference only; never a business-decision input.
        default: null
      - name: expires_at
        type: datetime
        source: system
        description: >-
          For positive ACCRUAL/GIFT_IN/BONUS rows, the instant this lot expires if
          the account stays inactive. Null for negative rows.
        default: null
  - name: ClockState
    parent: null
    common_fields: false
    fields:
      - name: current_utc
        type: datetime
        source: input
        description: >-
          The single mutable system clock the deterministic test harness advances.
          All expiry, validity-window, and year-roll checks read this value.
        constraints: required, ISO 8601 UTC
      - name: program_year
        type: integer
        source: computed
        description: >-
          The calendar year derived from current_utc; qualifying_segments_ytd is
          scoped to this value and reset when it advances.
        default: 0

state_machines:
  - entity: FlightSegment
    initial_state: BOOKED
    terminal_states: [ACCRUED, CANCELLED]
    transitions:
      - from: BOOKED
        to: FLOWN
        trigger: "POST /flight-segments/{id}/fly"
        actor: OperationsAgent
        preconditions:
          - "segment.status == BOOKED"
          - "clock.current_utc >= segment.scheduled_departure"
        side_effects:
          - "set flight_segment.status = FLOWN"
          - "increments FlightSegment.version by 1"
      - from: FLOWN
        to: ACCRUED
        trigger: "POST /flight-segments/{id}/accrue"
        actor: OperationsAgent
        preconditions:
          - "segment.status == FLOWN"
          - "referenced Member exists"
        side_effects:
          - "compute points_awarded via segment_accrual; set FlightSegment.points_awarded"
          - "set is_qualifying = (fare_class != DISCOUNT)"
          - "append PointsLedger row {delta:+points_awarded, reason:ACCRUAL, source_type:FlightSegment, expires_at: clock.current_utc + EXPIRY_MONTHS}"
          - "CASCADE L1: Member.points_balance += points_awarded; Member.last_activity_at = clock.current_utc"
          - "CASCADE L2: if is_qualifying, Member.qualifying_segments_ytd += 1, which re-evaluates tier via tier_recompute"
          - "CASCADE L3: tier_recompute may raise Member.tier, which raises effective_tier feeding any future UpgradeRequest.priority_score"
          - "increments FlightSegment.version by 1; increments Member.version by 1"
        note: "Primary depth-3 cascade: segment -> ledger/balance -> qualifying count -> tier."
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /flight-segments/{id}/cancel"
        actor: OperationsAgent
        preconditions:
          - "segment.status == BOOKED"
        side_effects:
          - "set flight_segment.status = CANCELLED"
          - "increments FlightSegment.version by 1"
        note: "Only pre-accrual segments may cancel; ACCRUED is terminal so points never need clawback here."

  - entity: AwardBooking
    initial_state: QUOTED
    terminal_states: [CANCELLED, FLOWN]
    transitions:
      - from: QUOTED
        to: ISSUED
        trigger: "POST /award-bookings/{id}/issue"
        actor: Member
        preconditions:
          - "award.status == QUOTED"
          - "acting member owns the award (X-User-ID == award.member_id)"
          - "Member.points_balance >= award.points_price"
          - "if companion_certificate_id set: certificate.status == RESERVED and attached_award_id == award.id"
        side_effects:
          - "append PointsLedger row {delta:-points_price, reason:REDEMPTION, source_type:AwardBooking}"
          - "CASCADE L1: Member.points_balance -= points_price; Member.last_activity_at = clock.current_utc"
          - "if certificate attached: CASCADE L2: certificate.status RESERVED -> REDEEMED"
          - "set award.status = ISSUED"
          - "increments AwardBooking.version by 1; increments Member.version by 1"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /award-bookings/{id}/cancel"
        actor: Member
        preconditions:
          - "award.status == QUOTED"
          - "acting member owns the award"
        side_effects:
          - "if certificate attached: certificate.status RESERVED -> ISSUED; clear attached_award_id"
          - "set award.status = CANCELLED"
          - "increments AwardBooking.version by 1"
        note: "QUOTED cancel never debited points, so no refund row is written."
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /award-bookings/{id}/cancel"
        actor: Member
        preconditions:
          - "award.status == ISSUED"
          - "acting member owns the award"
        side_effects:
          - "COMPENSATION: append PointsLedger row {delta:+points_price, reason:REDEMPTION_REFUND, source_type:AwardBooking} (exactly the debited amount)"
          - "CASCADE L1: Member.points_balance += points_price; Member.last_activity_at = clock.current_utc"
          - "if certificate attached: CASCADE L2: certificate.status REDEEMED -> ISSUED; clear attached_award_id (certificate becomes reusable)"
          - "set award.status = CANCELLED"
          - "increments AwardBooking.version by 1; increments Member.version by 1"
        note: "Compensating invariant: member points_balance returns to pre-issuance value; conserved quantity = points."
      - from: ISSUED
        to: FLOWN
        trigger: "POST /award-bookings/{id}/fly"
        actor: OperationsAgent
        preconditions:
          - "award.status == ISSUED"
          - "clock.current_utc >= award departure (route travel date)"
        side_effects:
          - "set award.status = FLOWN"
          - "increments AwardBooking.version by 1"
        note: "FLOWN is terminal; points consumption becomes permanent."

  - entity: UpgradeRequest
    initial_state: WAITLISTED
    terminal_states: [CLEARED, DENIED, WITHDRAWN]
    transitions:
      - from: WAITLISTED
        to: CLEARED
        trigger: "POST /flight-pools/{id}/clear-waitlist (system clearing run, per request)"
        actor: system
        preconditions:
          - "pool.seats_remaining > 0 at the moment this request is processed"
          - "request.status == WAITLISTED"
          - "pool.cleared == false before the run"
        side_effects:
          - "set request.status = CLEARED"
          - "CASCADE: FlightPool.seats_cleared += 1; FlightPool.seats_remaining -= 1"
          - "increments UpgradeRequest.version by 1; increments FlightPool.version by 1"
        note: "Clearing run sorts WAITLISTED requests by priority_score desc, then requested_at asc, then created_at asc; grants seats until pool exhausted."
      - from: WAITLISTED
        to: DENIED
        trigger: "POST /flight-pools/{id}/clear-waitlist (system clearing run, per request)"
        actor: system
        preconditions:
          - "pool.seats_remaining == 0 when this request is reached in priority order"
          - "request.status == WAITLISTED"
        side_effects:
          - "set request.status = DENIED"
          - "increments UpgradeRequest.version by 1"
      - from: WAITLISTED
        to: WITHDRAWN
        trigger: "POST /upgrade-requests/{id}/withdraw"
        actor: Member
        preconditions:
          - "request.status == WAITLISTED"
          - "acting member owns the request"
          - "pool.cleared == false"
        side_effects:
          - "set request.status = WITHDRAWN"
          - "increments UpgradeRequest.version by 1"

  - entity: CompanionCertificate
    initial_state: ISSUED
    terminal_states: [REDEEMED, EXPIRED]
    transitions:
      - from: ISSUED
        to: RESERVED
        trigger: "POST /award-bookings (create award with companion_certificate_id)"
        actor: Member
        preconditions:
          - "certificate.status == ISSUED"
          - "acting member owns the certificate"
          - "clock.current_utc within [valid_from, valid_until]"
        side_effects:
          - "set certificate.status = RESERVED; set attached_award_id = new award.id"
          - "increments CompanionCertificate.version by 1"
      - from: RESERVED
        to: REDEEMED
        trigger: "POST /award-bookings/{id}/issue (award the cert is attached to is issued)"
        actor: Member
        preconditions:
          - "certificate.status == RESERVED"
          - "attached award transitions QUOTED -> ISSUED"
        side_effects:
          - "set certificate.status = REDEEMED"
          - "increments CompanionCertificate.version by 1"
        note: "Driven by the AwardBooking issue cascade (cross-entity)."
      - from: RESERVED
        to: ISSUED
        trigger: "POST /award-bookings/{id}/cancel (attached award cancelled)"
        actor: Member
        preconditions:
          - "certificate.status == RESERVED"
          - "attached award transitions to CANCELLED"
        side_effects:
          - "set certificate.status = ISSUED; clear attached_award_id"
          - "increments CompanionCertificate.version by 1"
        note: "Compensation: certificate returns to the reusable pool."
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /_clock/advance (activity/expiry run detects valid_until passed)"
        actor: system
        preconditions:
          - "certificate.status == ISSUED"
          - "clock.current_utc > certificate.valid_until"
        side_effects:
          - "set certificate.status = EXPIRED"
          - "increments CompanionCertificate.version by 1"

  - entity: PointsGift
    initial_state: PENDING
    terminal_states: [SETTLED, REVERSED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /points-gifts/{id}/settle"
        actor: Member
        preconditions:
          - "gift.status == PENDING"
          - "acting member is the sender (X-User-ID == gift.sender_id)"
          - "sender.points_balance >= gift.amount"
        side_effects:
          - "append PointsLedger row {delta:-amount, reason:GIFT_OUT, source_type:PointsGift} on sender"
          - "CASCADE L1: sender.points_balance -= amount; sender.last_activity_at = clock.current_utc"
          - "CASCADE L2: append PointsLedger row {delta:+amount, reason:GIFT_IN, source_type:PointsGift, expires_at: clock.current_utc + EXPIRY_MONTHS} on recipient; recipient.points_balance += amount; recipient.last_activity_at = clock.current_utc"
          - "set gift.status = SETTLED"
          - "increments PointsGift.version by 1; increments sender.Member.version by 1; increments recipient.Member.version by 1"
        note: "Compensating invariant: sender debit exactly equals recipient credit; total program points conserved."
      - from: PENDING
        to: REVERSED
        trigger: "POST /points-gifts/{id}/reverse"
        actor: Member
        preconditions:
          - "gift.status == PENDING"
          - "acting member is the sender"
        side_effects:
          - "set gift.status = REVERSED"
          - "increments PointsGift.version by 1"
        note: "PENDING reverse moved no points, so no ledger rows are written."

  - entity: StatusMatch
    initial_state: GRANTED
    terminal_states: [EXPIRED]
    transitions:
      - from: GRANTED
        to: EXPIRED
        trigger: "POST /_clock/advance (activity/expiry run detects valid_until passed)"
        actor: system
        preconditions:
          - "match.status == GRANTED"
          - "clock.current_utc > match.valid_until"
        side_effects:
          - "set match.status = EXPIRED"
          - "CASCADE: Member.status_match_active = false; recompute effective_tier (may drop)"
          - "increments StatusMatch.version by 1; increments Member.version by 1"

  - entity: Member
    initial_state: BASE
    terminal_states: []
    transitions:
      - from: BASE
        to: SILVER_OR_HIGHER
        trigger: "system: tier_recompute during FlightSegment accrue cascade or status match grant"
        actor: system
        preconditions:
          - "qualifying_segments_ytd crosses a TIER_THRESHOLDS breakpoint, OR a StatusMatch grant floors effective_tier higher"
        side_effects:
          - "set Member.tier to highest threshold met; set status_match_active per active match"
          - "increments Member.version by 1"
        note: >-
          Tier is monotonic within a program year (never lowered by segment loss);
          only the year-end run can reset it downward. Parallel dimension:
          earned tier and status_match_active evolve independently and combine
          into effective_tier.
      - from: ANY_TIER
        to: BASE
        trigger: "POST /_clock/advance (year-end run when program_year advances)"
        actor: system
        preconditions:
          - "clock.program_year > Member-scoped program year of qualifying_segments_ytd"
        side_effects:
          - "reset Member.qualifying_segments_ytd = 0; recompute Member.tier from the now-empty count (floored by any still-active status match)"
          - "increments Member.version by 1"

concurrency_rules:
  - rule_id: upgrade-request-stale-pool
    parent_entity: FlightPool
    write_endpoint: "POST /upgrade-requests"
    occ_field: "expected_flightpool_version"
    description: |
      Creating an UpgradeRequest against a FlightPool whose version has advanced
      since the client last observed it is rejected; this captures the case where
      the clearing run (or another joiner) has already mutated the pool's seat
      accounting and the current writer's view of remaining seats is stale.
    error_id: ERR_STALE_POOL_VERSION
    http_status: 412
  - rule_id: gift-settle-stale-sender
    parent_entity: Member
    write_endpoint: "POST /points-gifts/{id}/settle"
    occ_field: "expected_member_version"
    description: |
      Settling a PointsGift against a sender Member whose version has advanced
      since the client last observed it is rejected; this captures the case where
      another debit (an award redemption or a prior gift settlement) has already
      lowered the sender's points_balance and the current writer's view of
      available points is stale.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412

calculations:
  - name: segment_accrual
    trigger: "FlightSegment FLOWN -> ACCRUED"
    algorithm: tiered_pricing
    formula: |
      # MODE (a): >=3 inputs with non-linear tiered/multiplier interaction.
      class_mult = FARE_CLASS_MULT[fare_class]          # DISCOUNT .5, ECONOMY 1, BUSINESS 1.5, FIRST 2
      tier_bonus_pct = TIER_BONUS_PCT[member.effective_tier]  # BASE 0, SILVER 25, GOLD 50, PLATINUM 100
      base_points = base_fare_usd * class_mult           # real-valued
      distance_floor = ceil(distance_miles * MIN_MILE_RATE)  # MIN_MILE_RATE = 0.5 pts/mile
      earned = max(base_points, distance_floor)          # non-linear floor
      points_awarded = round_half_up(earned * (1 + tier_bonus_pct/100))
    input_set: "single segment + member.effective_tier at accrual instant"
    constants:
      FARE_CLASS_MULT: { DISCOUNT: 0.5, ECONOMY: 1.0, BUSINESS: 1.5, FIRST: 2.0 }
      TIER_BONUS_PCT: { BASE: 0, SILVER: 25, GOLD: 50, PLATINUM: 100 }
      MIN_MILE_RATE: 0.5
    precision: "integer points, round_half_up at the final multiply"
    variants:
      - name: floor_dominates
        when: "base_fare_usd * class_mult < distance_floor"
        difference: "distance_floor wins the max(); cheap long-haul fares still earn mile-based minimum"
      - name: fare_dominates
        when: "base_fare_usd * class_mult >= distance_floor"
        difference: "fare-based points win; expensive short-haul earns on spend"
  - name: award_pricing
    trigger: "AwardBooking creation (QUOTED) — points_price pinned"
    algorithm: tiered_pricing
    formula: |
      # DUAL-VARIANT: same route+cabin inputs, two valid algorithms, different results.
      base_chart = AWARD_CHART[cabin]                    # ECONOMY 25000, BUSINESS 60000, FIRST 100000
      if pricing_mode == FIXED:
          cabin_price = base_chart                        # published chart, demand-insensitive
      else:  # DYNAMIC
          # load_factor in [0,1] scales between 0.8x and 1.6x of chart
          cabin_price = round_half_up(base_chart * (0.8 + 0.8 * load_factor))
      if companion_certificate_id present:
          companion_addon = round_half_up(cabin_price * COMPANION_ADDON_PCT/100)  # 50%
      else:
          companion_addon = 0
      points_price = cabin_price + companion_addon
    input_set: "route_code, cabin, pricing_mode, load_factor (DYNAMIC only), optional companion cert"
    constants:
      AWARD_CHART: { ECONOMY: 25000, BUSINESS: 60000, FIRST: 100000 }
      COMPANION_ADDON_PCT: 50
    precision: "integer points, round_half_up"
    variants:
      - name: dynamic
        when: "pricing_mode == DYNAMIC"
        difference: "price = chart * (0.8 + 0.8*load_factor); a load_factor of 0.5 yields 1.2x chart, diverging from FIXED for identical route/cabin"
      - name: fixed
        when: "pricing_mode == FIXED"
        difference: "price = chart exactly, independent of demand"
  - name: tier_recompute
    trigger: "after qualifying_segments_ytd changes, on status match grant/expiry, and on year-end reset"
    algorithm: threshold
    formula: |
      # MODE (c): circular-looking dependency pinned by explicit evaluation order.
      # earned_tier depends on count; effective_tier depends on earned_tier AND match;
      # accrual bonus depends on effective_tier; we pin order: count -> earned_tier ->
      # match floor -> effective_tier, computed BEFORE the segment being accrued counts.
      earned_tier = highest T in [BASE,SILVER,GOLD,PLATINUM]
                    such that qualifying_segments_ytd >= TIER_THRESHOLDS[T]
      match_floor = matched_tier if status_match_active else BASE
      effective_tier = max_rank(earned_tier, match_floor)
      # earned_tier never decreases within a program year (monotonic ratchet)
    input_set: "member.qualifying_segments_ytd, member.status_match_active, member.matched_tier"
    constants:
      TIER_THRESHOLDS: { BASE: 0, SILVER: 15, GOLD: 30, PLATINUM: 60 }
      TIER_RANK: { BASE: 0, SILVER: 1, GOLD: 2, PLATINUM: 3 }
    precision: "exact integer comparison; >= at each threshold"
    variants:
      - name: earned_only
        when: "no active status match"
        difference: "effective_tier == earned_tier from count alone"
      - name: match_floored
        when: "status_match_active and matched_tier outranks earned_tier"
        difference: "effective_tier floored up to matched_tier even with 0 qualifying segments"
  - name: upgrade_priority
    trigger: "UpgradeRequest creation; recomputed reference for clearing-run ranking"
    algorithm: weighted_scoring
    formula: |
      # MODE (a)-adjacent weighted score; ranking selector for the clearing run.
      priority_score = TIER_RANK[member.effective_tier] * 1000
                       + FARE_WEIGHT[booked_fare_class]      # DISCOUNT 0, ECONOMY 10, BUSINESS 20, FIRST 30
      # clearing run sort key: (priority_score desc, requested_at asc, created_at asc)
    input_set: "member.effective_tier at request time, booked fare class"
    constants:
      TIER_RANK: { BASE: 0, SILVER: 1, GOLD: 2, PLATINUM: 3 }
      FARE_WEIGHT: { DISCOUNT: 0, ECONOMY: 10, BUSINESS: 20, FIRST: 30 }
    precision: "exact integer; tie-break requested_at asc then created_at asc (never id)"
    variants:
      - name: tier_dominant
        when: "two requests differ in effective_tier"
        difference: "higher tier always ranks first regardless of fare weight (1000 gap exceeds max fare weight 30)"
      - name: tie_by_time
        when: "equal priority_score"
        difference: "earlier requested_at wins; if still equal, earlier created_at; id never consulted"
  - name: expiry_sweep
    trigger: "POST /_clock/advance activity/expiry run"
    algorithm: chronological
    formula: |
      # For each member: if clock.current_utc - last_activity_at > EXPIRY_MONTHS,
      # expire every positive ledger lot whose expires_at <= clock.current_utc,
      # processed oldest-expires_at first (created_at asc on ties), writing an
      # EXPIRY row of delta = -min(remaining_lot, member.points_balance) so balance floors at 0.
      for lot in positive_lots where expires_at <= now, ordered by (expires_at asc, created_at asc):
          burn = min(lot.delta, member.points_balance)
          append PointsLedger {delta:-burn, reason:EXPIRY, source_type:System}
          member.points_balance -= burn
    input_set: "member's positive PointsLedger lots with expires_at <= clock.current_utc"
    constants:
      EXPIRY_MONTHS: 18
    precision: "integer; balance floored at 0; order: expires_at asc then created_at asc"
    variants:
      - name: full_lot_expiry
        when: "member fully inactive past EXPIRY_MONTHS and lot.delta <= balance"
        difference: "entire lot burned"
      - name: capped_expiry
        when: "lot.delta > current balance (prior spend already reduced it)"
        difference: "burn capped at remaining balance; balance lands exactly at 0, never negative"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "acting role is permitted for this operation per RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "for entity_backed Member operations on own resource, X-User-ID equals the resource owner's member_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "issue/cancel/withdraw/settle/reverse on owned resources"
  - priority: 4
    category: existence
    check: "all path and FK referenced resources exist (Member, FlightSegment, AwardBooking, FlightPool, UpgradeRequest, CompanionCertificate, PointsGift, StatusMatch), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: state
    check: "target resource is in a state from which the requested transition is legal"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version"
    error_id: ERR_STALE_POOL_VERSION
    http_status: 412
    applies_to: "POST /upgrade-requests"
  - priority: 6
    category: state
    check: "OCC: expected_member_version matches the sender member's current version"
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412
    applies_to: "POST /points-gifts/{id}/settle"
  - priority: 7
    category: business_constraint
    check: "StatusMatch may not be granted if member.status_match_used == true (lifetime single use)"
    error_id: ERR_STATUS_MATCH_EXHAUSTED
    http_status: 409
    applies_to: "POST /status-matches"
  - priority: 8
    category: business_temporal
    check: "companion certificate validity window [valid_from, valid_until] must contain the award's intended travel and certificate must be ISSUED when attached"
    error_id: ERR_CERTIFICATE_NOT_VALID
    http_status: 422
    applies_to: "POST /award-bookings with companion_certificate_id"
  - priority: 9
    category: business_constraint
    check: "PointsGift recipient_id must differ from sender_id"
    error_id: ERR_GIFT_TO_SELF
    http_status: 422
    applies_to: "POST /points-gifts"
  - priority: 10
    category: business_temporal
    check: "FlightSegment may only be flown once clock.current_utc >= scheduled_departure"
    error_id: ERR_DEPARTURE_NOT_REACHED
    http_status: 422
    applies_to: "POST /flight-segments/{id}/fly"
  - priority: 11
    category: business_constraint
    check: "DYNAMIC award pricing requires a load_factor in [0,1]; FIXED must omit it"
    error_id: ERR_LOAD_FACTOR_REQUIRED
    http_status: 422
    applies_to: "POST /award-bookings"
  - priority: 12
    category: business_constraint
    check: "FlightPool clearing run may only run once per pool (cleared == false) and only at/after departure_at"
    error_id: ERR_POOL_ALREADY_CLEARED
    http_status: 409
    applies_to: "POST /flight-pools/{id}/clear-waitlist"
  - priority: 13
    category: business_fiscal
    check: "redemption/gift requires sufficient points: member.points_balance >= debit amount"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 422
    applies_to: "POST /award-bookings/{id}/issue, POST /points-gifts/{id}/settle"
  - priority: 14
    category: business_constraint
    check: "input field domain validation (enums, positive integers, IATA code shape, amount >= 1, distance >= 1)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

endpoints:
  - method: POST
    path: "/members"
    description: "Register a loyalty member."
    roles: [ProgramAdmin]
    code: 201
    input: [email, full_name, home_airport]
    output: Member
    side_effects: ["create Member at tier BASE, points_balance 0"]
  - method: GET
    path: "/members/{id}"
    description: "Fetch a member with computed balance, tier, effective_tier."
    roles: [ProgramAdmin, Member]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: GET
    path: "/members"
    description: "List members (paginated)."
    roles: [ProgramAdmin]
    code: 200
    input: ["limit?", "offset?", "tier?"]
    output: Member[]
    side_effects: []
  - method: GET
    path: "/members/{id}/ledger"
    description: "List a member's PointsLedger rows (reverse-reachability for PointsLedger.member_id)."
    roles: [ProgramAdmin, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: PointsLedger[]
    side_effects: []
  - method: GET
    path: "/members/{id}/segments"
    description: "List a member's FlightSegments (reverse-reachability for FlightSegment.member_id)."
    roles: [ProgramAdmin, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: FlightSegment[]
    side_effects: []
  - method: POST
    path: "/flight-segments"
    description: "Book a flight segment for a member."
    roles: [OperationsAgent]
    code: 201
    input: [member_id, origin, destination, fare_class, distance_miles, base_fare_usd, scheduled_departure]
    output: FlightSegment
    side_effects: ["create FlightSegment at BOOKED"]
  - method: GET
    path: "/flight-segments/{id}"
    description: "Fetch a flight segment."
    roles: [ProgramAdmin, OperationsAgent, Member]
    code: 200
    input: []
    output: FlightSegment
    side_effects: []
  - method: POST
    path: "/flight-segments/{id}/fly"
    description: "Mark a booked segment as flown."
    roles: [OperationsAgent]
    code: 200
    input: []
    output: FlightSegment
    side_effects: ["BOOKED -> FLOWN"]
  - method: POST
    path: "/flight-segments/{id}/accrue"
    description: "Accrue points and qualifying credit for a flown segment."
    roles: [OperationsAgent]
    code: 200
    input: []
    output: FlightSegment
    side_effects:
      - "FLOWN -> ACCRUED; run segment_accrual"
      - "depth-3 cascade: ledger/balance -> qualifying count -> tier_recompute"
  - method: POST
    path: "/flight-segments/{id}/cancel"
    description: "Cancel a booked segment."
    roles: [OperationsAgent]
    code: 200
    input: []
    output: FlightSegment
    side_effects: ["BOOKED -> CANCELLED"]
  - method: POST
    path: "/award-bookings"
    description: "Quote an award booking; pins points_price via award_pricing. Reserves a companion certificate if supplied."
    roles: [Member]
    code: 201
    input: [member_id, route_code, cabin, pricing_mode, "load_factor?", "companion_certificate_id?"]
    output: AwardBooking
    side_effects:
      - "create AwardBooking at QUOTED with pinned points_price"
      - "if companion_certificate_id: certificate ISSUED -> RESERVED, attached_award_id set"
  - method: GET
    path: "/award-bookings/{id}"
    description: "Fetch an award booking."
    roles: [ProgramAdmin, Member]
    code: 200
    input: []
    output: AwardBooking
    side_effects: []
  - method: GET
    path: "/award-bookings"
    description: "List award bookings, filterable by member_id (reverse-reachability for AwardBooking.member_id and companion_certificate_id)."
    roles: [ProgramAdmin, Member]
    code: 200
    input: ["member_id?", "companion_certificate_id?", "limit?", "offset?"]
    output: AwardBooking[]
    side_effects: []
  - method: POST
    path: "/award-bookings/{id}/issue"
    description: "Issue a quoted award: debit points, redeem any attached certificate."
    roles: [Member]
    code: 200
    input: []
    output: AwardBooking
    side_effects:
      - "QUOTED -> ISSUED; debit points_price (REDEMPTION); cascade balance"
      - "if cert attached: RESERVED -> REDEEMED"
  - method: POST
    path: "/award-bookings/{id}/cancel"
    description: "Cancel a quoted or issued award; refund points and release certificate if issued."
    roles: [Member]
    code: 200
    input: []
    output: AwardBooking
    side_effects:
      - "QUOTED -> CANCELLED (no refund) or ISSUED -> CANCELLED (REDEMPTION_REFUND, cert REDEEMED -> ISSUED)"
  - method: POST
    path: "/award-bookings/{id}/fly"
    description: "Mark an issued award as flown (terminal)."
    roles: [OperationsAgent]
    code: 200
    input: []
    output: AwardBooking
    side_effects: ["ISSUED -> FLOWN"]
  - method: POST
    path: "/flight-pools"
    description: "Create an upgrade pool for a flight with finite premium capacity."
    roles: [OperationsAgent]
    code: 201
    input: [flight_number, departure_at, premium_capacity]
    output: FlightPool
    side_effects: ["create FlightPool with seats_remaining = premium_capacity"]
  - method: GET
    path: "/flight-pools/{id}"
    description: "Fetch a flight pool with seat accounting."
    roles: [ProgramAdmin, OperationsAgent, Member]
    code: 200
    input: []
    output: FlightPool
    side_effects: []
  - method: GET
    path: "/flight-pools/{id}/upgrade-requests"
    description: "List upgrade requests for a pool (reverse-reachability for UpgradeRequest.flight_pool_id)."
    roles: [ProgramAdmin, OperationsAgent, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: UpgradeRequest[]
    side_effects: []
  - method: POST
    path: "/upgrade-requests"
    description: "Join a flight pool's upgrade waitlist; computes priority_score. OCC-guarded on pool version."
    roles: [Member]
    code: 201
    input: [member_id, flight_pool_id, booked_fare_class, expected_flightpool_version]
    output: UpgradeRequest
    side_effects:
      - "create UpgradeRequest at WAITLISTED; compute priority_score via upgrade_priority"
      - "increments FlightPool.version by 1"
  - method: GET
    path: "/upgrade-requests/{id}"
    description: "Fetch an upgrade request (reverse-reachability for UpgradeRequest.member_id via member_id filter on list)."
    roles: [ProgramAdmin, OperationsAgent, Member]
    code: 200
    input: []
    output: UpgradeRequest
    side_effects: []
  - method: GET
    path: "/upgrade-requests"
    description: "List upgrade requests filterable by member_id (reverse-reachability for UpgradeRequest.member_id)."
    roles: [ProgramAdmin, OperationsAgent, Member]
    code: 200
    input: ["member_id?", "flight_pool_id?", "limit?", "offset?"]
    output: UpgradeRequest[]
    side_effects: []
  - method: POST
    path: "/upgrade-requests/{id}/withdraw"
    description: "Withdraw a waitlisted upgrade request before clearing."
    roles: [Member]
    code: 200
    input: []
    output: UpgradeRequest
    side_effects: ["WAITLISTED -> WITHDRAWN"]
  - method: POST
    path: "/flight-pools/{id}/clear-waitlist"
    description: "Run the priority clearing for a pool: grant seats by rank until exhausted, deny the rest."
    roles: [OperationsAgent]
    code: 200
    input: []
    output: FlightPool
    side_effects:
      - "for each WAITLISTED request in (priority_score desc, requested_at asc, created_at asc): CLEARED while seats_remaining>0 else DENIED"
      - "set pool.cleared = true; update seats_cleared/seats_remaining"
  - method: POST
    path: "/companion-certificates"
    description: "Issue a companion certificate to a member with a validity window."
    roles: [ProgramAdmin]
    code: 201
    input: [member_id, valid_from, valid_until]
    output: CompanionCertificate
    side_effects: ["create CompanionCertificate at ISSUED"]
  - method: GET
    path: "/companion-certificates/{id}"
    description: "Fetch a companion certificate."
    roles: [ProgramAdmin, Member]
    code: 200
    input: []
    output: CompanionCertificate
    side_effects: []
  - method: GET
    path: "/companion-certificates"
    description: "List companion certificates filterable by member_id (reverse-reachability for CompanionCertificate.member_id and attached_award_id)."
    roles: [ProgramAdmin, Member]
    code: 200
    input: ["member_id?", "attached_award_id?", "limit?", "offset?"]
    output: CompanionCertificate[]
    side_effects: []
  - method: POST
    path: "/points-gifts"
    description: "Create a pending points gift from sender to recipient."
    roles: [Member]
    code: 201
    input: [sender_id, recipient_id, amount]
    output: PointsGift
    side_effects: ["create PointsGift at PENDING"]
  - method: GET
    path: "/points-gifts/{id}"
    description: "Fetch a points gift."
    roles: [ProgramAdmin, Member]
    code: 200
    input: []
    output: PointsGift
    side_effects: []
  - method: GET
    path: "/points-gifts"
    description: "List points gifts filterable by sender_id or recipient_id (reverse-reachability for both FKs)."
    roles: [ProgramAdmin, Member]
    code: 200
    input: ["sender_id?", "recipient_id?", "limit?", "offset?"]
    output: PointsGift[]
    side_effects: []
  - method: POST
    path: "/points-gifts/{id}/settle"
    description: "Settle a pending gift: debit sender, credit recipient. OCC-guarded on sender member version."
    roles: [Member]
    code: 200
    input: [expected_member_version]
    output: PointsGift
    side_effects:
      - "PENDING -> SETTLED; GIFT_OUT on sender, GIFT_IN on recipient"
      - "increments Member.version by 1"
  - method: POST
    path: "/points-gifts/{id}/reverse"
    description: "Reverse a pending gift."
    roles: [Member]
    code: 200
    input: []
    output: PointsGift
    side_effects: ["PENDING -> REVERSED"]
  - method: POST
    path: "/status-matches"
    description: "Grant a one-time lifetime status match to a member."
    roles: [ProgramAdmin]
    code: 201
    input: [member_id, rival_tier, valid_until]
    output: StatusMatch
    side_effects:
      - "create StatusMatch at GRANTED; compute matched_tier; set member.status_match_active=true, status_match_used=true; tier_recompute"
  - method: GET
    path: "/status-matches/{id}"
    description: "Fetch a status match."
    roles: [ProgramAdmin, Member]
    code: 200
    input: []
    output: StatusMatch
    side_effects: []
  - method: GET
    path: "/status-matches"
    description: "List status matches filterable by member_id (reverse-reachability for StatusMatch.member_id)."
    roles: [ProgramAdmin, Member]
    code: 200
    input: ["member_id?", "limit?", "offset?"]
    output: StatusMatch[]
    side_effects: []
  - method: POST
    path: "/_clock/advance"
    description: "Test-driving endpoint: set the system clock to a new UTC instant and run the activity/expiry/year-roll sweeps."
    roles: [ProgramAdmin]
    code: 200
    input: [current_utc]
    output: ClockState
    side_effects:
      - "set ClockState.current_utc; derive program_year"
      - "expiry_sweep across members; StatusMatch GRANTED -> EXPIRED past valid_until (member.status_match_active=false, tier_recompute)"
      - "CompanionCertificate ISSUED -> EXPIRED past valid_until"
      - "year-end run: if program_year advanced, reset qualifying_segments_ytd and tier_recompute"
  - method: GET
    path: "/_clock"
    description: "Read current system clock."
    roles: [ProgramAdmin, OperationsAgent, Member]
    code: 200
    input: []
    output: ClockState
    side_effects: []
  - method: POST
    path: "/_inject/points"
    description: "Test-driving endpoint: credit a member's points_balance directly (appends an ACCRUAL ledger lot expiring at clock + EXPIRY_MONTHS) to seed redemption/gift scenarios."
    roles: [ProgramAdmin]
    code: 200
    input: [member_id, amount]
    output: Member
    side_effects:
      - "append PointsLedger {delta:+amount, reason:ACCRUAL, source_type:System, expires_at: clock.current_utc + EXPIRY_MONTHS}"
      - "Member.points_balance += amount; Member.last_activity_at = clock.current_utc; increments Member.version by 1"
  - method: POST
    path: "/_inject/qualifying_segments"
    description: "Test-driving endpoint: set a member's qualifying_segments_ytd directly to seed tier-threshold boundary scenarios; runs tier_recompute."
    roles: [ProgramAdmin]
    code: 200
    input: [member_id, count]
    output: Member
    side_effects:
      - "set Member.qualifying_segments_ytd = count; run tier_recompute; increments Member.version by 1"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "role not permitted for this operation"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "acting member is not the owner of the targeted resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "referenced resource does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "resource is not in a state permitting the requested transition"
  - id: ERR_STALE_POOL_VERSION
    http: 412
    condition: "expected_flightpool_version does not match the pool's current version"
  - id: ERR_STALE_MEMBER_VERSION
    http: 412
    condition: "expected_member_version does not match the sender member's current version"
  - id: ERR_STATUS_MATCH_EXHAUSTED
    http: 409
    condition: "member has already consumed their lifetime status match"
  - id: ERR_CERTIFICATE_NOT_VALID
    http: 422
    condition: "companion certificate is not ISSUED or its validity window does not cover the award travel"
  - id: ERR_GIFT_TO_SELF
    http: 422
    condition: "points gift recipient equals sender"
  - id: ERR_DEPARTURE_NOT_REACHED
    http: 422
    condition: "attempt to fly a segment before its scheduled_departure relative to the clock"
  - id: ERR_LOAD_FACTOR_REQUIRED
    http: 422
    condition: "DYNAMIC award pricing missing load_factor, or FIXED pricing supplied load_factor, or load_factor out of [0,1]"
  - id: ERR_POOL_ALREADY_CLEARED
    http: 409
    condition: "clearing run invoked on an already-cleared pool, or before departure_at"
  - id: ERR_INSUFFICIENT_POINTS
    http: 422
    condition: "member points_balance is less than the required debit"
  - id: ERR_VALIDATION
    http: 400
    condition: "malformed input: bad enum, non-positive integer, bad IATA code, amount < 1, distance < 1, origin == destination, valid_until <= valid_from"
  - id: ERR_GIFT_AMOUNT_INVALID
    http: 422
    condition: "points gift amount is below the minimum of 1 (zero-amount edge)"
  - id: ERR_POOL_CAPACITY_INVALID
    http: 400
    condition: "flight pool premium_capacity is negative"
  - id: ERR_DUPLICATE_EMAIL
    http: 409
    condition: "member email already registered"
  - id: ERR_PAGINATION_INVALID
    http: 400
    condition: "limit/offset out of allowed bounds"

roles:
  - name: ProgramAdmin
    description: "Loyalty program operator: registers members, issues certificates, grants status matches, advances the clock."
    identity: opaque
    exclusive_operations:
      - "POST /members"
      - "POST /companion-certificates"
      - "POST /status-matches"
      - "POST /_clock/advance"
      - "GET /members (list all)"
    shared_operations:
      - "GET /members/{id}"
      - "GET reads across all resources"
  - name: OperationsAgent
    description: "Flight operations: books/flies/accrues/cancels segments, creates pools, runs upgrade clearing."
    identity: opaque
    exclusive_operations:
      - "POST /flight-segments"
      - "POST /flight-segments/{id}/fly"
      - "POST /flight-segments/{id}/accrue"
      - "POST /flight-segments/{id}/cancel"
      - "POST /flight-pools"
      - "POST /flight-pools/{id}/clear-waitlist"
      - "POST /award-bookings/{id}/fly"
    shared_operations:
      - "GET reads on segments, pools, upgrade requests"
  - name: Member
    description: "Loyalty member acting on their own awards, upgrades, gifts, and certificate-attached bookings."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /award-bookings (own)"
      - "POST /award-bookings/{id}/issue (own)"
      - "POST /award-bookings/{id}/cancel (own)"
      - "POST /upgrade-requests (own)"
      - "POST /upgrade-requests/{id}/withdraw (own)"
      - "POST /points-gifts (own as sender)"
      - "POST /points-gifts/{id}/settle (own as sender)"
      - "POST /points-gifts/{id}/reverse (own as sender)"
    shared_operations:
      - "GET own member, ledger, segments, awards, upgrade requests, certificates, gifts, status matches"
