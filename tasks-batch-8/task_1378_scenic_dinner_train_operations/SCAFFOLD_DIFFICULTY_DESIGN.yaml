scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 - dual_variant_calc: two dual-variant calculations on DIFFERENT
  # entity domains (seat availability on Excursion/CarAssignment vs galley
  # load on ProvisioningManifest).
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: seats_availability_committed_vs_conservative_gate
        grounds:
          - calculations.class_seat_availability
          - entities.Excursion.fields.coach_seats_available
          - validations[priority=10]
        distinguishing_aspect: |
          Same booking data, two variants on the SEAT-INVENTORY domain: the Excursion
          read exposes the committed variant (excludes HELD) while the booking-create
          gate uses the conservative variant (includes unexpired HELD), so the read
          shows 3 open seats at the exact moment an identical-seat create is rejected.
        test_recipe:
          setup:
            - "Published REGULAR excursion on 2026-10-15 with one COACH car, effective_capacity 3"
            - "One unexpired HELD booking, party_size 2, COACH (clock left at the 2026-08-01T00:00:00Z default, expires_at = created_at + 45min)"
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "LOC-1", stock_type: "LOCOMOTIVE", seat_capacity: 0, table_count: 0 }, as: Mechanic, captures: { loco: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "COACH-S", stock_type: "COACH_CAR", seat_capacity: 3, table_count: 0 }, as: Mechanic, captures: { coach: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "Seat Test", slot_id: "${slot}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex: "$.data.id" } }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${loco}", class_code: "LOCO", position: 1 }, as: Scheduler }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${coach}", class_code: "COACH", position: 2 }, as: Scheduler }
            - { call: "POST /railroad/crew-members", payload: { name: "Ed Eng", role: "ENGINEER", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_e: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Con Ida", role: "CONDUCTOR", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_c: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Hal Host", role: "CAR_HOST", is_volunteer: true }, as: CrewManager, captures: { cm_h: "$.data.id" } }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_e}", position: "ENGINEER" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_c}", position: "CONDUCTOR" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_h}", position: "CAR_HOST" }, as: CrewManager }
            - { call: "GET /railroad/excursions/${ex}", as: Scheduler, captures: { ex_v: "$.data.version" } }
            - { call: "POST /railroad/excursions/${ex}/events", payload: { event_type: "PUBLISH", expected_excursion_version: "${ex_v}" }, as: Scheduler }
            - { call: "POST /railroad/bookings", payload: { excursion_id: "${ex}", customer_email: "held@x.com", class_code: "COACH", party_size: 2 }, as: StationAgent, captures: { b_held: "$.data.id" } }
          trigger:
            - { call: "GET /railroad/excursions/${ex}", as: StationAgent, captures: { avail: "$.data.coach_seats_available" } }
            - { call: "POST /railroad/bookings", payload: { excursion_id: "${ex}", customer_email: "late@x.com", class_code: "COACH", party_size: 2 }, as: StationAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "committed variant read: ${avail} == 3 (HELD booking excluded from the Excursion field)"
            - "conservative variant gate: ${err} == ERR_CLASS_FULL (only 3 - 2 = 1 seat free once unexpired HELD is counted)"
            - "Booking.${b_held}.status remains HELD"
      - name: galley_load_net_vs_conservative_holiday
        grounds:
          - calculations.galley_load
          - entities.ProvisioningManifest.fields.galley_load_units
        distinguishing_aspect: |
          Same booking data, two variants on the FOOD-PROVISIONING domain (different
          entity domain from seat availability): REGULAR manifests use the net variant
          (HELD excluded) while HOLIDAY manifests use conservative_prep (unexpired HELD
          included), so identical manifests inputs yield galley_load_units 8 vs 14.
        test_recipe:
          setup:
            - "Two published excursions sharing stock and crew on different dates: REGULAR 2026-10-15 (surge 10000) and HOLIDAY 2026-10-16 (surge 12000), each with one DINING car (16 seats, 4 tables)"
            - "Each excursion has: CONFIRMED DINING party 1 EARLY, CONFIRMED DINING party 1 LATE, and an unexpired HELD DINING party 2 EARLY"
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot_r: "$.data.id" } }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-16", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot_h: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "LOC-1", stock_type: "LOCOMOTIVE", seat_capacity: 0, table_count: 0 }, as: Mechanic, captures: { loco: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "DIN-1", stock_type: "DINING_CAR", seat_capacity: 16, table_count: 4 }, as: Mechanic, captures: { din: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "Regular Run", slot_id: "${slot_r}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex_r: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "Holiday Run", slot_id: "${slot_h}", event_type: "HOLIDAY", surge_multiplier_bp: 12000 }, as: Scheduler, captures: { ex_h: "$.data.id" } }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex_r}", stock_id: "${loco}", class_code: "LOCO", position: 1 }, as: Scheduler }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex_r}", stock_id: "${din}", class_code: "DINING", position: 2 }, as: Scheduler }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex_h}", stock_id: "${loco}", class_code: "LOCO", position: 1 }, as: Scheduler }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex_h}", stock_id: "${din}", class_code: "DINING", position: 2 }, as: Scheduler }
            - { call: "POST /railroad/crew-members", payload: { name: "Ed Eng", role: "ENGINEER", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_e: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Con Ida", role: "CONDUCTOR", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_c: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Hal Host", role: "CAR_HOST", is_volunteer: true }, as: CrewManager, captures: { cm_h: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Chef Ana", role: "CHEF", is_volunteer: false }, as: CrewManager, captures: { cm_k: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Svr One", role: "SERVER", is_volunteer: false }, as: CrewManager, captures: { cm_s1: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Svr Two", role: "SERVER", is_volunteer: false }, as: CrewManager, captures: { cm_s2: "$.data.id" } }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex_r}", crew_member_id: "${cm_e}", position: "ENGINEER" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex_r}", crew_member_id: "${cm_c}", position: "CONDUCTOR" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex_r}", crew_member_id: "${cm_h}", position: "CAR_HOST" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex_r}", crew_member_id: "${cm_k}", position: "CHEF" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex_r}", crew_member_id: "${cm_s1}", position: "SERVER" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex_r}", crew_member_id: "${cm_s2}", position: "SERVER" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex_h}", crew_member_id: "${cm_e}", position: "ENGINEER" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex_h}", crew_member_id: "${cm_c}", position: "CONDUCTOR" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex_h}", crew_member_id: "${cm_h}", position: "CAR_HOST" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex_h}", crew_member_id: "${cm_k}", position: "CHEF" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex_h}", crew_member_id: "${cm_s1}", position: "SERVER" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex_h}", crew_member_id: "${cm_s2}", position: "SERVER" }, as: CrewManager }
            - { call: "GET /railroad/excursions/${ex_r}", as: Scheduler, captures: { exr_v: "$.data.version" } }
            - { call: "POST /railroad/excursions/${ex_r}/events", payload: { event_type: "PUBLISH", expected_excursion_version: "${exr_v}" }, as: Scheduler }
            - { call: "GET /railroad/excursions/${ex_h}", as: Scheduler, captures: { exh_v: "$.data.version" } }
            - { call: "POST /railroad/excursions/${ex_h}/events", payload: { event_type: "PUBLISH", expected_excursion_version: "${exh_v}" }, as: Scheduler }
            - { call: "POST /railroad/bookings", payload: { excursion_id: "${ex_r}", customer_email: "alice@x.com", class_code: "DINING", party_size: 1, dining_service: "EARLY" }, as: StationAgent, captures: { b_ra: "$.data.id" } }
            - { call: "POST /railroad/bookings/${b_ra}/events", payload: { event_type: "CONFIRM" }, as: StationAgent }
            - { call: "POST /railroad/bookings", payload: { excursion_id: "${ex_r}", customer_email: "bob@x.com", class_code: "DINING", party_size: 1, dining_service: "LATE" }, as: StationAgent, captures: { b_rb: "$.data.id" } }
            - { call: "POST /railroad/bookings/${b_rb}/events", payload: { event_type: "CONFIRM" }, as: StationAgent }
            - { call: "POST /railroad/bookings", payload: { excursion_id: "${ex_r}", customer_email: "carol@x.com", class_code: "DINING", party_size: 2, dining_service: "EARLY" }, as: StationAgent }
            - { call: "POST /railroad/bookings", payload: { excursion_id: "${ex_h}", customer_email: "alice@x.com", class_code: "DINING", party_size: 1, dining_service: "EARLY" }, as: StationAgent, captures: { b_ha: "$.data.id" } }
            - { call: "POST /railroad/bookings/${b_ha}/events", payload: { event_type: "CONFIRM" }, as: StationAgent }
            - { call: "POST /railroad/bookings", payload: { excursion_id: "${ex_h}", customer_email: "bob@x.com", class_code: "DINING", party_size: 1, dining_service: "LATE" }, as: StationAgent, captures: { b_hb: "$.data.id" } }
            - { call: "POST /railroad/bookings/${b_hb}/events", payload: { event_type: "CONFIRM" }, as: StationAgent }
            - { call: "POST /railroad/bookings", payload: { excursion_id: "${ex_h}", customer_email: "carol@x.com", class_code: "DINING", party_size: 2, dining_service: "EARLY" }, as: StationAgent }
          trigger:
            - { call: "GET /railroad/excursions/${ex_r}/provisioning-manifests", as: CateringManager, captures: { m_r_early: "$.data[0].early_diner_count", m_r_late: "$.data[0].late_diner_count", m_r_load: "$.data[0].galley_load_units" } }
            - { call: "GET /railroad/excursions/${ex_h}/provisioning-manifests", as: CateringManager, captures: { m_h_early: "$.data[0].early_diner_count", m_h_late: "$.data[0].late_diner_count", m_h_load: "$.data[0].galley_load_units" } }
          assert:
            - "net variant (REGULAR): ${m_r_early} == 1, ${m_r_late} == 1, ${m_r_load} == 8 (ceil(1*3*1.1) + ceil(1*3*1.1) = 4 + 4)"
            - "conservative_prep variant (HOLIDAY): ${m_h_early} == 3, ${m_h_late} == 1, ${m_h_load} == 14 (ceil(3*3*1.1) + 4 = 10 + 4)"
            - "identical booking mix, different galley_load_units: ${m_r_load} != ${m_h_load}"

  # =========================================================================
  # Rule 2 - combinatorial_formula: two combinatorial calculations in
  # DIFFERENT modes - (a) multi-input branch interaction vs (b) pinned
  # rounding order.
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fare_quote_class_branch_surge_party_max (mode a)
        grounds:
          - calculations.fare_quote
          - entities.Booking.fields.unit_fare_cents
        distinguishing_aspect: |
          Mode (a): fare_quote combines >= 3 inputs with non-linear interaction -
          a conditional branch on class_code, the HOLIDAY surge multiplier, party_size
          multiplication, and a max(0, ...) branch on the payment instrument; pinned
          inputs produce unit_fare_cents 20000 and total 40000.
        test_recipe:
          setup:
            - "Published HOLIDAY excursion on 2026-10-15, surge_multiplier_bp 13333, one DINING car (16 seats, 4 tables)"
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "LOC-1", stock_type: "LOCOMOTIVE", seat_capacity: 0, table_count: 0 }, as: Mechanic, captures: { loco: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "DIN-1", stock_type: "DINING_CAR", seat_capacity: 16, table_count: 4 }, as: Mechanic, captures: { din: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "Holiday Express", slot_id: "${slot}", event_type: "HOLIDAY", surge_multiplier_bp: 13333 }, as: Scheduler, captures: { ex: "$.data.id" } }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${loco}", class_code: "LOCO", position: 1 }, as: Scheduler }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${din}", class_code: "DINING", position: 2 }, as: Scheduler }
            - { call: "POST /railroad/crew-members", payload: { name: "Ed Eng", role: "ENGINEER", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_e: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Con Ida", role: "CONDUCTOR", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_c: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Hal Host", role: "CAR_HOST", is_volunteer: true }, as: CrewManager, captures: { cm_h: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Chef Ana", role: "CHEF", is_volunteer: false }, as: CrewManager, captures: { cm_k: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Svr One", role: "SERVER", is_volunteer: false }, as: CrewManager, captures: { cm_s1: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Svr Two", role: "SERVER", is_volunteer: false }, as: CrewManager, captures: { cm_s2: "$.data.id" } }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_e}", position: "ENGINEER" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_c}", position: "CONDUCTOR" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_h}", position: "CAR_HOST" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_k}", position: "CHEF" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_s1}", position: "SERVER" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_s2}", position: "SERVER" }, as: CrewManager }
            - { call: "GET /railroad/excursions/${ex}", as: Scheduler, captures: { ex_v: "$.data.version" } }
            - { call: "POST /railroad/excursions/${ex}/events", payload: { event_type: "PUBLISH", expected_excursion_version: "${ex_v}" }, as: Scheduler }
            - { call: "POST /railroad/bookings", payload: { excursion_id: "${ex}", customer_email: "dana@x.com", class_code: "DINING", party_size: 2, dining_service: "EARLY" }, as: StationAgent, captures: { b: "$.data.id" } }
          trigger:
            - { call: "POST /railroad/bookings/${b}/events", payload: { event_type: "CONFIRM" }, as: StationAgent, captures: { unit: "$.data.unit_fare_cents", total: "$.data.total_price_cents", paid: "$.data.paid_cents" } }
          assert:
            - "unit fare: round_half_up(15000 * 13333 / 10000) = round_half_up(19999.5) == 20000, captured ${unit} == 20000"
            - "total = unit * party_size: ${total} == 40000"
            - "standard payment branch: ${paid} == 40000"
            - "Booking.${b}.dining_table_number == 1 (selector assigned the lowest free table)"
      - name: galley_load_per_service_ceil_then_sum (mode b)
        grounds:
          - calculations.galley_load
        distinguishing_aspect: |
          Mode (b): galley_load pins a nested rounding order - ceil per dining service
          FIRST, then sum. With 1 EARLY and 1 LATE diner the pinned order yields
          ceil(3.3)+ceil(3.3) = 8, while the alternate sum-then-ceil order would
          yield ceil(6.6) = 7; the assertion separates the two orders.
        test_recipe:
          setup:
            - "Published REGULAR excursion on 2026-10-15 with one DINING car (16 seats, 4 tables)"
            - "One CONFIRMED DINING party 1 EARLY and one CONFIRMED DINING party 1 LATE"
