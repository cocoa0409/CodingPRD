              as_user_id: "auditor-1"
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "OPERATIONAL" }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
              captures: { e3: $.data.error_id }
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "DRAFT" }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
            - call: "GET /customer-complaints"
              payload: { station_id: "${st_id}", refund_state: "REVERSED" }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
          assert:
            - "the refund pinned at request time is refund_amount_cents == 200 (600 - round_half_up(10.000 x 40) - 0) and retained_amount_cents == 400"
            - "call 1: HTTP 403 ERR_UNAUTHORIZED — the auditor holds only the REVERSE leg of refund-ledger-actions; refund_state is still APPROVED and Station.${st_id}.refund_liability_cents == 0"
            - "call 2: HTTP 200, refund_state == SETTLED, refund_settled_at == \"2026-06-10T12:00:00Z\", Station.${st_id}.refund_liability_cents == 200"
            - "call 3: HTTP 403 ERR_UNAUTHORIZED — the support agent holds only SETTLE; refund_state is still SETTLED and the liability is still 200"
            - "call 4: HTTP 200, refund_state == REVERSED, refund_settled_at == null, refund_amount_cents == 0, retained_amount_cents == 600, Station.${st_id}.refund_liability_cents == 0"
            - "call 5: HTTP 403 ERR_UNAUTHORIZED — the auditor may send only target_status DRAFT on status-transitions; Station.${st_id}.status is still COMMISSIONING"
            - "call 6: HTTP 200, Station.${st_id}.status == DRAFT — the auditor's own leg of the same shared endpoint"
            - "call 7: exactly one row (${cc_id}), total_count == 1 — the refund dimension is filterable independently of the complaint's own state, which is still TRIAGED"

  # ===========================================================================
  # SECTION 8 — Cross-cutting complexity layers (§1.0.complexity_layers)
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_uptime_report_version_blocks_claim_creation_and_its_supersede
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[claim-create-stale-uptime-report]
          - endpoints[POST /reimbursement-claims]
          - errors[ERR_STALE_PARENT_VERSION]
        distinguishing_aspect: "Claim creation is a destructive write on a sibling: it drives any PENDING claim on the report to SUPERSEDED. A second filer holding the version it read at ACCEPT time would silently discard the first claim, so the stale version must 412 — and, crucially, the rejected call must not consume the report's version, so the refreshed retry succeeds and only then supersedes."
        test_recipe:
          setup:
            - "Logical clock walked 2026-05-01 -> 2026-07-15T00:00:00Z."
            - "HostSite / Station ST-1 OPERATIONAL / one CERTIFIED port DS-1 with no outages."
            - "UptimeReport 2026-06-01 .. 2026-07-01 taken to ACCEPTED (uptime_pct 100.00); its version at ACCEPT is captured as rp_ver."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 400.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-1", power_class: "DCFC_150", declared_port_count: 1 }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-1", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { p_id: $.data.id }
            - call: "POST /charging-ports/${p_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "COMMISSIONING" }
              as: NetworkOperator
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-15T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /uptime-reports"
              payload: { station_id: "${st_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: NetworkOperator
              captures: { rp_id: $.data.id }
            - call: "POST /uptime-reports/${rp_id}/compute-provisional"
              payload: {}
              as: NetworkOperator
            - call: "POST /uptime-reports/${rp_id}/finalize"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "auditor-1"
            - call: "POST /uptime-reports/${rp_id}/submit"
              payload: {}
              as: NetworkOperator
            - call: "POST /uptime-reports/${rp_id}/program-review"
              payload: { outcome: "ACCEPT" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { rp_ver: $.data.version }
            - call: "POST /reimbursement-claims"
              payload: { uptime_report_id: "${rp_id}", line_items: [{ port_id: "${p_id}", category: "OANDM", amount_cents: 1200 }], expected_uptime_report_version: "${rp_ver}" }
              as: NetworkOperator
              captures: { cl1_id: $.data.id }
          trigger:
            - call: "POST /reimbursement-claims"
              payload: { uptime_report_id: "${rp_id}", line_items: [{ port_id: "${p_id}", category: "NETWORK_FEES", amount_cents: 800 }], expected_uptime_report_version: "${rp_ver}" }
              as: NetworkOperator
              captures: { e1: $.data.error_id }
            - call: "GET /uptime-reports/${rp_id}"
              payload: {}
              as: NetworkOperator
              captures: { rp_ver2: $.data.version }
            - call: "POST /reimbursement-claims"
              payload: { uptime_report_id: "${rp_id}", line_items: [{ port_id: "${p_id}", category: "NETWORK_FEES", amount_cents: 800 }], expected_uptime_report_version: "${rp_ver2}" }
              as: NetworkOperator
              captures: { cl2_id: $.data.id }
            - call: "GET /uptime-reports/${rp_id}/reimbursement-claims"
              payload: { state: "PENDING" }
              as: ProgramAdministrator
            - call: "GET /stations/${st_id}/uptime-reports"
              payload: { state: "ACCEPTED" }
              as: ProgramAdministrator
          assert:
            - "after the first (setup) claim: ReimbursementClaim.${cl1_id}.state == PENDING, UptimeReport.${rp_id}.claim_count == 1 and the report's version is rp_ver + 1"
            - "call 1: HTTP 412 ERR_STALE_PARENT_VERSION — the filer's expected_uptime_report_version is one behind"
            - "call 1 changed nothing: claim_count is still 1, ReimbursementClaim.${cl1_id}.state is still PENDING, and UptimeReport.${rp_id}.version is unchanged, so ${rp_ver2} == rp_ver + 1"
            - "call 3: HTTP 201 — ReimbursementClaim.${cl2_id}.state == PENDING with requested_amount_cents == 800, ReimbursementClaim.${cl1_id}.state == SUPERSEDED, UptimeReport.${rp_id}.claim_count == 2 and version == rp_ver + 2"
            - "call 4: exactly one row (${cl2_id}), total_count == 1 — the superseded claim is filtered out but still listed with no filter (total_count == 2)"
            - "call 5: exactly one row (${rp_id}), total_count == 1 — the station's report is visible under its own nested listing in the ACCEPTED state"
            - "a literal expected_uptime_report_version in either call would be untestable — the value is only knowable from the captured response"

      - name: stale_spare_part_version_blocks_a_second_reservation_on_the_same_depot_row
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reservation-create-stale-spare-part]
          - endpoints[POST /part-reservations]
          - entities.SparePart.fields.unencumbered_qty
        distinguishing_aspect: "Two reservations on one part are both legal, so nothing in the state machine detects that the depot balance moved under the second writer — only the OCC field does. The refreshed retry then lands on the other side of the stock boundary: 6 of 10 are already reserved, so the second qty-6 reservation is admitted as BACKORDERED with expected_available_at = now + lead_time_days, not rejected."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "HostSite / Station ST-1 OPERATIONAL / one CERTIFIED port DS-1, one CLASSIFIED MAJOR outage, one CREATED dispatch."
            - "SparePart SP-1 (DISPENSER, lead_time_days 3) restocked to 10; the post-restock version is captured as sp_v1."
          setup_api_calls:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 400.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-1", power_class: "DCFC_150", declared_port_count: 1 }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-1", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { p_id: $.data.id }
            - call: "POST /charging-ports/${p_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "COMMISSIONING" }
              as: NetworkOperator
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
            - call: "POST /outage-events"
              payload: { port_id: "${p_id}", fault_code: "EVSE-MAJ-11", fault_class: "MAJOR", detected_at: "2026-08-01T00:00:00Z" }
              as: NetworkOperator
              captures: { o_id: $.data.id }
            - call: "POST /outage-events/${o_id}/classify"
              payload: { fault_class: "MAJOR" }
              as: NetworkOperator
            - call: "POST /maintenance-dispatches"
              payload: { outage_event_id: "${o_id}", port_id: "${p_id}", technician_user_id: "tech-1", technician_certification_class: "DCFC_BASIC", window_start_at: "2026-08-01T01:00:00Z", window_end_at: "2026-08-01T09:00:00Z" }
              as: NetworkOperator
              captures: { d_id: $.data.id }
            - call: "POST /spare-parts"
              payload: { part_number: "SP-1", part_class: "DISPENSER", lead_time_days: 3 }
              as: NetworkOperator
              captures: { sp_id: $.data.id }
            - call: "POST /spare-parts/${sp_id}/restock"
              payload: { qty: 10 }
              as: NetworkOperator
              captures: { sp_v1: $.data.version }
            - call: "POST /part-reservations"
              payload: { dispatch_id: "${d_id}", spare_part_id: "${sp_id}", qty: 6, expected_spare_part_version: "${sp_v1}" }
              as: NetworkOperator
              captures: { pr1_id: $.data.id }
          trigger:
            - call: "POST /part-reservations"
              payload: { dispatch_id: "${d_id}", spare_part_id: "${sp_id}", qty: 6, expected_spare_part_version: "${sp_v1}" }
              as: NetworkOperator
              captures: { e1: $.data.error_id }
            - call: "GET /spare-parts/${sp_id}"
              payload: {}
              as: NetworkOperator
              captures: { sp_v2: $.data.version }
            - call: "POST /part-reservations"
              payload: { dispatch_id: "${d_id}", spare_part_id: "${sp_id}", qty: 6, expected_spare_part_version: "${sp_v2}" }
              as: NetworkOperator
              captures: { pr2_id: $.data.id }
            - call: "GET /part-reservations"
              payload: { spare_part_id: "${sp_id}", state: "BACKORDERED" }
              as: NetworkOperator
          assert:
            - "after the setup reservation: PartReservation.${pr1_id}.state == RESERVED, SparePart.${sp_id}.on_hand_qty == 10, reserved_qty == 6, unencumbered_qty == 4, backordered_qty == 0, version == sp_v1 + 1"
            - "call 1: HTTP 412 ERR_STALE_PARENT_VERSION; no reservation row was created and every stock counter is unchanged, so ${sp_v2} == sp_v1 + 1"
            - "call 4: exactly one row (${pr2_id}), total_count == 1 — the RESERVED row ${pr1_id} is excluded by the state filter, and dropping the filter returns both"
            - "call 3: HTTP 201 with PartReservation.${pr2_id}.state == BACKORDERED because qty 6 > unencumbered_qty 4"
            - "PartReservation.${pr2_id}.expected_available_at == \"2026-08-04T00:00:00Z\" (2026-08-01T00:00:00Z + lead_time_days 3)"
            - "SparePart.${sp_id} after call 3: on_hand_qty == 10, reserved_qty == 6, backordered_qty == 6, unencumbered_qty == 4, version == sp_v1 + 2 — a backorder must not overdraw on_hand or shrink unencumbered_qty"

      - name: version_advances_on_accepted_writes_and_stands_still_on_rejected_ones
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers[optimistic_concurrency]
          - entities.HostSite.common_fields
          - entities.ChargingPort.common_fields
        distinguishing_aspect: "Version is the currency of both OCC rules, so it must move exactly once per accepted write and never on a rejected one — including on aggregate rows touched only as a side effect. The subtle case is the port PATCH that does not change any value: it is still an accepted write, so the port's version advances while the recomputed station score stays put."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "HostSite HS-1 and Station ST-1 (DRAFT) with one fully interoperable port DS-1, certified."
          setup_api_calls:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 400.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-1", power_class: "DCFC_150", declared_port_count: 1 }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-1", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { p_id: $.data.id }
            - call: "POST /charging-ports/${p_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
          trigger:
            - call: "PATCH /host-sites/${site_id}"
              payload: { committed_service_capacity_kw: 450.00 }
              as: NetworkOperator
            - call: "PATCH /host-sites/${site_id}"
              payload: { access_hours_mode: "RESTRICTED", access_open_minute: 1200, access_close_minute: 600 }
              as: NetworkOperator
              captures: { e1: $.data.error_id }
            - call: "PATCH /charging-ports/${p_id}"
              payload: { contactless_enabled: true }
              as: NetworkOperator
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "OPERATIONAL" }
              as: NetworkOperator
              captures: { e2: $.data.error_id }
          assert:
            - "at the start of the trigger: HostSite.${site_id}.version == 1, Station.${st_id}.version reflects the two port side effects (creation and certification), ChargingPort.${p_id}.version == 2"
            - "call 1: HTTP 200 and HostSite.${site_id}.version == 2"
            - "call 2: HTTP 422 ERR_INVALID_ACCESS_WINDOW and HostSite.${site_id}.version is still 2 with access_hours_mode still TWENTY_FOUR_SEVEN — a rejected PATCH must not consume a version"
            - "call 3: HTTP 200 — the flag was already true, but the write is accepted, so ChargingPort.${p_id}.version == 3 while Station.${st_id}.payment_interop_score stays 100.00"
            - "call 3 must not double-bump: ChargingPort.${p_id}.version advanced by exactly 1, not by 2 (one for the PATCH and one for the rescore)"
            - "call 4: HTTP 409 ERR_INVALID_STATE (DRAFT -> OPERATIONAL is not a declared transition) and Station.${st_id}.version is unchanged"

      - name: response_met_flips_on_the_minute_the_response_deadline_passes
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
          - calculations.dispatch_response_deadline
          - state_machines.MaintenanceDispatch.transitions.EN_ROUTE_to_ON_SITE
        distinguishing_aspect: "The response window is an instantaneous threshold evaluated once, at ARRIVE. Two identical CRITICAL dispatches on the same DCFC_350 station differ only in the minute of arrival: one lands exactly on response_deadline_at and must count as met (the comparison is <=), the other lands one minute later and must not. The deadline itself is the regulatory floor, since 240 x 0.5 == 120 == REGULATORY_FLOOR_MINUTES."
