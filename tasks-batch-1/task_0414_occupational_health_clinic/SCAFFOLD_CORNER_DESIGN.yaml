              payload: { employer_id: "${emp_id}", effective_date: "2026-01-01", panels: [ { panel_code: "DRUG_NON_DOT", required_for_job_category: "PACKER", price_cents: 8000, recheck_interval_days: 0 } ] }
              as: ClinicAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /clinic/protocols/${p1_id}/activate"
