      - name: retired_family_rejects_submit_from_terminal_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.FareFamily.terminal_states
          - state_machines.FareFamily.status.PUBLISHED_to_RETIRED
          - validations.priority_8
          - errors[ERR_FAMILY_STATE_INVALID]
        distinguishing_aspect: "RETIRED is the declared terminal_state of FareFamily.status, so a submit against a retired family is refused with ERR_FAMILY_STATE_INVALID and the family stays RETIRED - no path back to DRAFT exists."
        test_recipe:
          setup:
            - "family ECO_RET was published and then retired; it has no bookings at all"
          setup_api_calls:
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100" }
