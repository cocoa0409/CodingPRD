      - call: POST /vet/clinics/${c_id}/activate
        as: AccountManager
      - call: POST /vet/products
        payload:
          sku: CONS-B1
          product_name: Drape Pack
          manufacturer_code: GEN
          product_type: CONSUMABLE
          unit_price_cents: 10000
        as: SupplyChainPlanner
        captures:
          p_id: $.data.id
      - call: POST /vet/inventory-lots
        payload:
          product_id: ${p_id}
          lot_number: LOT-B1
          expiry_date: '2027-06-30'
          qty_on_hand: 5
        as: SupplyChainPlanner
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 6 Meadow Ln
          delivery_window_start: '2026-08-03T13:00:00Z'
          delivery_window_end: '2026-08-03T15:00:00Z'
          lines:
          - product_id: ${p_id}
            qty_requested: 5
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o1_id: $.data.id
      - call: POST /vet/orders/${o1_id}/submit
        as: ClinicBuyer
        as_user_id: ${c_id}
      - call: POST /vet/orders/${o1_id}/approve
        as: AccountManager
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 6 Meadow Ln
          delivery_window_start: '2026-08-04T13:00:00Z'
          delivery_window_end: '2026-08-04T15:00:00Z'
          lines:
          - product_id: ${p_id}
            qty_requested: 5
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o2_id: $.data.id
      - call: POST /vet/orders/${o2_id}/submit
        as: ClinicBuyer
        as_user_id: ${c_id}
      - call: POST /vet/orders/${o2_id}/approve
        as: AccountManager
        captures:
          o2_status: $.data.status
      - call: GET /vet/order-lines?order_id=${o2_id}
        as: AccountManager
        captures:
          l2_id: $.data[0].id
      trigger:
      - call: POST /vet/inventory-lots
        payload:
          product_id: ${p_id}
          lot_number: LOT-B2
          expiry_date: '2027-08-31'
          qty_on_hand: 10
        as: SupplyChainPlanner
        captures:
          lot_b2: $.data.id
      - call: GET /vet/orders/${o2_id}
        as: AccountManager
        captures:
          o2_after: $.data.status
      - call: GET /vet/order-lines/${l2_id}
        as: AccountManager
        captures:
          l2_st: $.data.status
          l2_lot: $.data.lot_id
      - call: GET /vet/order-lines/${l2_id}/backorder-lines
        as: AccountManager
        captures:
          bo_status: $.data[0].status
      assert:
      - O2 status after its own approve == BACKORDERED (allocation shortfall)
      - 'After LOT-B2 receipt: O2.status == APPROVED (system BACKORDERED -> APPROVED cycle)'
      - BackorderLine.status == FILLED and qty_open == 0
      - OrderLine(l2).status == ALLOCATED and lot_id == ${lot_b2} (LOT-B1 depleted, LOT-B2 covers)
  - name: authorization_suspend_reinstate_cycle
    grounds:
    - state_machines.ManufacturerAuthorization.APPROVED_to_SUSPENDED
    - state_machines.ManufacturerAuthorization.SUSPENDED_to_APPROVED
    distinguishing_aspect: 'ManufacturerAuthorization machine is CYCLIC (APPROVED -> SUSPENDED ->

      APPROVED reinstatement loop) on a different entity than the Order

      cycle; four writes advance version 1 -> 4 monotonically.

      '
    test_recipe:
      setup:
      - ACTIVE clinic C; authorization A (ZOETIS, 2026-01-01..2026-12-31) created and APPROVED
      setup_api_calls:
      - call: POST /vet/clinics
        payload:
          clinic_name: Clinic A
          license_number: LIC-A1
          ship_to_address: 7 Coral Dr
          credit_limit_cents: 5000000
          minimum_order_value_cents: 5000
          delivery_frequency_per_week: 5
          free_freight_threshold_cents: 100000
        as: AccountManager
        captures:
          c_id: $.data.id
      - call: POST /vet/clinics/${c_id}/activate
        as: AccountManager
      - call: POST /vet/manufacturer-authorizations
        payload:
          clinic_id: ${c_id}
          manufacturer_code: ZOETIS
          valid_from: '2026-01-01'
          valid_until: '2026-12-31'
          approved_ship_to_address: 7 Coral Dr
          quarterly_quantity_cap: 100
        as: ComplianceOfficer
        captures:
          a_id: $.data.id
      - call: POST /vet/manufacturer-authorizations/${a_id}/approve
        as: ComplianceOfficer
      trigger:
      - call: POST /vet/manufacturer-authorizations/${a_id}/suspend
        as: ComplianceOfficer
        captures:
          a_mid: $.data.status
      - call: POST /vet/manufacturer-authorizations/${a_id}/reinstate
        as: ComplianceOfficer
        captures:
          a_end: $.data.status
          a_ver: $.data.version
      assert:
      - status after suspend == SUSPENDED
      - status after reinstate == APPROVED (cycle completed)
      - version == 4 (create 1, approve 2, suspend 3, reinstate 4)
- rule_id: transitive_cascade
  instances:
  - name: cancel_release_refill_depth3_cascade
    grounds:
    - state_machines.Order.APPROVED_to_CANCELLED
    - calculations.backorder_allocation
    - state_machines.BackorderLine.OPEN_to_FILLED
    - state_machines.Order.BACKORDERED_to_APPROVED
    distinguishing_aspect: "Depth-3 chain from the order-CANCEL trigger: cancel O1 releases lot\nallocation (link 1); the freed availability runs backorder_allocation\nwhich FILLS O2's OPEN backorder and\
      \ ALLOCATES its line (link 2); the\nline fill recomputes parent O2 BACKORDERED -> APPROVED (link 3) \u2014\neach link caused by the previous mutation, not by the cancel itself.\n"
    test_recipe:
      setup:
      - ACTIVE clinic C; CONSUMABLE product (GEN, 10000c); lot L1 qty 5 fully allocated to O1 (APPROVED); O2 qty 5 BACKORDERED with the only OPEN backorder
      setup_api_calls:
      - call: POST /vet/clinics
        payload:
          clinic_name: Clinic C1
          license_number: LIC-C1
          ship_to_address: 8 Paddock Pl
          credit_limit_cents: 5000000
          minimum_order_value_cents: 5000
          delivery_frequency_per_week: 5
          free_freight_threshold_cents: 100000
        as: AccountManager
        captures:
          c_id: $.data.id
      - call: POST /vet/clinics/${c_id}/activate
        as: AccountManager
      - call: POST /vet/products
        payload:
          sku: CONS-C1
          product_name: Suture Box
          manufacturer_code: GEN
          product_type: CONSUMABLE
          unit_price_cents: 10000
        as: SupplyChainPlanner
        captures:
          p_id: $.data.id
      - call: POST /vet/inventory-lots
        payload:
          product_id: ${p_id}
          lot_number: LOT-C1
          expiry_date: '2027-06-30'
          qty_on_hand: 5
        as: SupplyChainPlanner
        captures:
          lot_id: $.data.id
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 8 Paddock Pl
          delivery_window_start: '2026-08-03T13:00:00Z'
          delivery_window_end: '2026-08-03T15:00:00Z'
          lines:
          - product_id: ${p_id}
            qty_requested: 5
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o1_id: $.data.id
      - call: POST /vet/orders/${o1_id}/submit
        as: ClinicBuyer
        as_user_id: ${c_id}
      - call: POST /vet/orders/${o1_id}/approve
        as: AccountManager
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 8 Paddock Pl
          delivery_window_start: '2026-08-04T13:00:00Z'
          delivery_window_end: '2026-08-04T15:00:00Z'
          lines:
          - product_id: ${p_id}
            qty_requested: 5
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o2_id: $.data.id
      - call: POST /vet/orders/${o2_id}/submit
        as: ClinicBuyer
        as_user_id: ${c_id}
      - call: POST /vet/orders/${o2_id}/approve
        as: AccountManager
      trigger:
      - call: POST /vet/orders/${o1_id}/cancel
        as: AccountManager
      - call: GET /vet/inventory-lots/${lot_id}
        as: AccountManager
        captures:
          lot_alloc: $.data.qty_allocated
          lot_avail: $.data.qty_available
      - call: GET /vet/orders/${o2_id}
        as: AccountManager
        captures:
          o2_status: $.data.status
      - call: GET /vet/order-lines?order_id=${o2_id}
        as: AccountManager
        captures:
          l2_status: $.data[0].status
          l2_lot: $.data[0].lot_id
      assert:
      - O1.status == CANCELLED (link 0 trigger)
      - "Lot LOT-C1 qty_allocated == 5 and qty_available == 0 after the cascade (released 5 re-taken by O2's fill \u2014 link 1 then link 2)"
      - O2's BackorderLine.status == FILLED with qty_open == 0 (link 2)
      - OrderLine(O2).status == ALLOCATED and lot_id == ${lot_id}
      - "O2.status == APPROVED (link 3 \u2014 caused by the line fill, not by the cancel)"
  - name: clock_sweep_expiry_depth3_cascade
    grounds:
    - state_machines.InventoryLot.AVAILABLE_to_EXPIRED
    - state_machines.OrderLine.ALLOCATED_to_BACKORDERED
    - state_machines.Order.APPROVED_to_BACKORDERED
    distinguishing_aspect: 'Depth-3 chain from a DIFFERENT trigger (clock advance, not order

      cancel): set_current_utc past expiry transitions the lot EXPIRED and

      releases its allocation (link 1); the release reverts the order line

      to BACKORDERED and mints a fresh OPEN BackorderLine (link 2); the

      line revert drops the parent order APPROVED -> BACKORDERED (link 3).

      '
    test_recipe:
      setup:
      - ACTIVE clinic C; CONSUMABLE product (GEN, 10000c); lot qty 4 expiry 2026-09-30; order qty 4 (window 2026-08-03) APPROVED and fully allocated from that lot; clock still 2026-08-01
      setup_api_calls:
      - call: POST /vet/clinics
        payload:
          clinic_name: Clinic C2
          license_number: LIC-C2
          ship_to_address: 9 Kennel Row
          credit_limit_cents: 5000000
          minimum_order_value_cents: 5000
          delivery_frequency_per_week: 5
          free_freight_threshold_cents: 100000
        as: AccountManager
        captures:
          c_id: $.data.id
      - call: POST /vet/clinics/${c_id}/activate
        as: AccountManager
      - call: POST /vet/products
        payload:
          sku: CONS-C2
          product_name: Catheter Case
          manufacturer_code: GEN
          product_type: CONSUMABLE
          unit_price_cents: 10000
        as: SupplyChainPlanner
        captures:
          p_id: $.data.id
      - call: POST /vet/inventory-lots
        payload:
          product_id: ${p_id}
          lot_number: LOT-C2
          expiry_date: '2026-09-30'
          qty_on_hand: 4
        as: SupplyChainPlanner
        captures:
          lot_id: $.data.id
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 9 Kennel Row
          delivery_window_start: '2026-08-03T13:00:00Z'
          delivery_window_end: '2026-08-03T15:00:00Z'
          lines:
          - product_id: ${p_id}
            qty_requested: 4
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o_id: $.data.id
      - call: POST /vet/orders/${o_id}/submit
        as: ClinicBuyer
        as_user_id: ${c_id}
      - call: POST /vet/orders/${o_id}/approve
        as: AccountManager
      trigger:
      - call: POST /vet/_clock/set_current_utc
        payload:
          to_iso8601: '2026-10-01T00:00:00Z'
        as: SystemAdmin
      - call: GET /vet/inventory-lots/${lot_id}
        as: AccountManager
        captures:
          lot_status: $.data.status
          lot_alloc: $.data.qty_allocated
      - call: GET /vet/order-lines?order_id=${o_id}
        as: AccountManager
        captures:
          l_status: $.data[0].status
          l_id: $.data[0].id
      - call: GET /vet/order-lines/${l_id}/backorder-lines
        as: AccountManager
        captures:
          bo_status: $.data[0].status
          bo_open: $.data[0].qty_open
      - call: GET /vet/orders/${o_id}
        as: AccountManager
        captures:
          o_status: $.data.status
      assert:
      - InventoryLot.status == EXPIRED and qty_allocated == 0 (link 1)
      - OrderLine.status == BACKORDERED with lot_id null; new BackorderLine OPEN with qty_open == 4 (link 2)
      - "Order.status == BACKORDERED (link 3 \u2014 caused by the line revert)"
      - InventoryLot.qty_on_hand == 4 (units never shipped; only the reservation was released)
- rule_id: priority_pair_validation_conflict
  instances:
  - name: approve_state_vs_safety_priority
    grounds:
    - validations[priority=4]
    - validations[priority=5]
    - errors[ERR_ORDER_INVALID_STATE]
    - errors[ERR_RX_AUTHORIZATION_REQUIRED]
    distinguishing_aspect: 'Category pair (state, business_safety): the approve call fails BOTH

      the order-state gate (order still DRAFT) and the Rx-authorization

      gate (no authorization exists); the state error

      ERR_ORDER_INVALID_STATE (priority 4) MUST win over

      ERR_RX_AUTHORIZATION_REQUIRED (priority 5).

      '
