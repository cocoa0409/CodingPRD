              payload: { client_id: "${c}", active_no_show_strikes: 2, last_no_show_at: "2026-04-10T00:00:00Z" }
              as: SalonManager
            - call: "POST /appointments"
              payload: { client_id: "${c}", technician_id: "${t}", station_id: "${st}", service_item_id: "${svc}", origin: "APPOINTMENT", start_at: "2026-04-11T13:00:00Z" }
              as: FrontDesk
              captures: { a: $.data.id }
          trigger:
            - call: "POST /appointments/${a}/confirm"
              payload: {}
              as: FrontDesk
              captures: { err_dep: $.data.error_id }
            - call: "POST /appointments/${a}/pay-deposit"
