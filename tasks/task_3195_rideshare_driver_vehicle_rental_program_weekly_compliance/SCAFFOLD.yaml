  - method: POST
    path: "/program/weeks/{id}/settle"
    description: "Close the mile cycle and bill the week, running the final renewal charge"
    roles: [ComplianceOfficer]
    code: 200
    input: [""]
    output: RentalWeek
    side_effects:
      - "weekly_renewal_charge final variant written into base, insurance, mileage_overage and platform_credit fields"
      - "damage_settlement_split recomputed into damage_charge_cents"
      - "payment_deadline and grace_deadline stamped"
  - method: POST
    path: "/program/weeks/{id}/payments"
    description: "Tender a weekly renewal payment and advance the week's independent payment dimension"
    roles: [SupportAgent, PlatformAdmin]
    code: 201
    input: ["amount_cents", "payment_outcome", "expected_amount_due_cents?"]
    output: RentalWeek
    side_effects:
      - "RentalPayment row recorded"
      - "payment dimension advances to PARTIAL, SETTLED or FAILED"
      - "week_status advances to PAID on full settlement"
      - "RentalAgreement.total_billed_cents credited on full settlement"
      - "recompute purchase_option_equity_credit"
  - method: POST
    path: "/program/weeks/{id}/grace-lapse"
    description: "Declare the week delinquent after the grace deadline"
    roles: [ComplianceOfficer]
    code: 200
    input: [""]
    output: RentalWeek
    side_effects:
      - "week_status -> DELINQUENT"
      - "payment_status -> FAILED"
      - "outstanding_delinquent_weeks recomputed for the agreement"
      - "RentalAgreementPosture transitions applied"
      - "RentalAgreement.agreement_status -> DELINQUENT"
  - method: POST
    path: "/program/weeks/{id}/waive"
    description: "Waive a non-settled week's amount due, blocking the accrual of equity for it"
    roles: [PlatformAdmin]
    code: 200
    input: [""]
    output: RentalWeek
    side_effects:
      - "week_status -> WAIVED"
      - "RentalAgreement.total_waived_cents increased"
      - "recompute outstanding_delinquent_weeks and purchase_option_equity_credit"
  - method: POST
    path: "/program/weeks/{id}/reopen"
    description: "Administratively reopen a delinquent week for re-metering while the agreement is only RESTRICTED"
    roles: [ComplianceOfficer]
    code: 200
    input: [""]
    output: RentalWeek
    side_effects:
      - "week_status -> OPEN"
      - "payment_status -> UNPAID"
      - "fresh payment_deadline and grace_deadline stamped"
      - "recompute outstanding_delinquent_weeks"
  - method: POST
    path: "/program/weeks/{id}/retry-payment"
    description: "Retry collection on a week whose previous tender failed"
    roles: [SupportAgent, PlatformAdmin]
    code: 200
    input: ["amount_cents", "payment_outcome"]
    output: RentalWeek
    side_effects: ["payment dimension FAILED -> UNPAID or SETTLED", "RentalPayment row recorded"]

  - method: POST
