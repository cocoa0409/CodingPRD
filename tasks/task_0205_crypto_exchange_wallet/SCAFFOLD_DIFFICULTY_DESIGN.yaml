              as: Trader
              as_user_id: "${acc_ce}"
          assert:
            - "Response status 409 and data.error_id == ERR_ADDRESS_NOT_ACTIVE (address still PENDING_HOLD within the 24h window)"

      - name: order_requires_account_active
        grounds:
          - validations[priority=6]
          - state_machines.Account.ACTIVE_to_FROZEN
          - entities.Account.fields.account_status
          - errors[ERR_ACCOUNT_FROZEN]
        distinguishing_aspect: |
          An Order can be placed only if its Account.account_status == ACTIVE; against a FROZEN
