scenario: |
  1950. Seafood Processing & Import Compliance (seafood processor/importer): raw material receipt with catch documentation, species verification & mislabeling prevention, HACCP for seafood hazards (histamine/parasite), import entry & FDA prior notice, foreign supplier verification program, yield conversion (round to fillet) & waste, cold chain/freezing record, allergen & country-of-origin labeling

domain_name: "seafood-processing-import-compliance"
api_prefix: "/seafood"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - version_pinning_on_approval
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (flat topology; all links via FK fields)
# =============================================================================
entities:
  - name: ForeignSupplier
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Supplier legal entity name" }
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 country of the foreign facility" }
      - { name: facility_registration_number, type: string, source: input, description: "FDA food facility registration number; unique across suppliers" }
      - { name: handles_histamine_susceptible_species, type: boolean, source: input, default: false, description: "Whether supplier ships scombrotoxin-forming species" }
      - { name: fsvp_status, type: enum, source: system, description: "FSVP posture", constraints: "PENDING_EVALUATION | APPROVED | REEVALUATION_DUE | SUSPENDED | REJECTED" }
      - { name: risk_score, type: number, source: computed, description: "Weighted risk score per supplier_risk_score calculation; null until first evaluation" }
      - { name: risk_tier, type: enum, source: computed, description: "LOW | MODERATE | HIGH; null until first evaluation", constraints: "LOW | MODERATE | HIGH" }
      - { name: open_corrective_action_count, type: integer, source: computed, default: 0, description: "Count of linked CorrectiveAction rows with status OPEN or INVESTIGATING" }
      - { name: total_species_mismatches, type: integer, source: system, default: 0, description: "Lifetime count of species mismatches traced to this supplier" }
      - { name: total_haccp_deviations, type: integer, source: system, default: 0, description: "Lifetime count of HACCP deviations traced to this supplier" }
      - { name: last_evaluation_period_end, type: datetime, source: system, description: "period_end of the most recent SupplierEvaluation; null before first" }
      - { name: next_evaluation_due, type: datetime, source: computed, description: "last_evaluation_period_end + tier interval (LOW 36mo, MODERATE 12mo, HIGH 3mo); null before first evaluation" }

  - name: SupplierEvaluation
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> ForeignSupplier.id; evaluation subject" }
      - { name: period_start, type: datetime, source: input, description: "Coverage window start (closed interval, inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Coverage window end (closed interval, inclusive); must be > period_start" }
      - { name: hazard_analysis_score, type: number, source: input, description: "0-100 hazard analysis adequacy score" }
      - { name: record_review_score, type: number, source: input, description: "0-100 records review score" }
      - { name: performance_score, type: number, source: input, description: "0-100 supplier performance score" }
      - { name: overall_score, type: number, source: computed, description: "round(0.5*hazard_analysis_score + 0.3*record_review_score + 0.2*performance_score, 2) half-up" }
      - { name: outcome, type: enum, source: computed, description: "overall_score >= 70 -> APPROVED; >= 50 -> CONDITIONAL; else REJECTED", constraints: "APPROVED | CONDITIONAL | REJECTED" }
      - { name: evaluated_by, type: string, source: system, description: "X-User-ID of the ComplianceManager who created the evaluation" }

  - name: ImportEntry
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> ForeignSupplier.id; FSVP supplier of record" }
      - { name: entry_number, type: string, source: input, description: "Customs entry number; unique" }
      - { name: species_declared, type: string, source: input, description: "Declared species code for the whole entry (uppercase token, e.g. TUNA)" }
      - { name: transport_mode, type: enum, source: input, description: "Arrival mode; drives prior-notice lead time", constraints: "VESSEL | AIR | ROAD" }
      - { name: scheduled_arrival, type: datetime, source: input, description: "Scheduled arrival at US port" }
      - { name: port_code, type: string, source: input, description: "Port of arrival code" }
      - { name: goods_value_cents, type: integer, source: input, description: "Declared customs value in cents; must be > 0" }
      - { name: freight_cost_cents, type: integer, source: input, description: "Freight cost in cents; must be >= 0" }
      - { name: duty_rate_pct, type: number, source: input, description: "Duty rate as decimal fraction of goods value (e.g. 0.03); >= 0" }
      - { name: total_weight_kg, type: number, source: input, description: "Declared gross weight kg; > 0" }
      - { name: prior_notice_filed_at, type: datetime, source: system, description: "Timestamp when prior notice was filed; null until filed" }
      - { name: prior_notice_confirmation, type: string, source: system, description: "Server-minted FDA prior notice confirmation number; null until filed" }
      - { name: entry_filed_at, type: datetime, source: system, description: "Timestamp when entry summary was filed; null until filed" }
      - { name: duty_cents, type: integer, source: computed, description: "round(goods_value_cents * duty_rate_pct, 0) half-up; computed on RELEASED" }
      - { name: allocatable_total_cents, type: integer, source: computed, description: "goods_value_cents + freight_cost_cents + duty_cents; computed on RELEASED" }
      - { name: status, type: enum, source: system, description: "Entry lifecycle", constraints: "DRAFT | PRIOR_NOTICE_FILED | ENTRY_FILED | RELEASED | DETAINED | REFUSED" }

  - name: ReceiptLot
    parent: null
    common_fields: true
    fields:
      - { name: import_entry_id, type: string, source: input, description: "FK -> ImportEntry.id; entry must be RELEASED at receipt time" }
      - { name: vessel_name, type: string, source: input, description: "Harvest vessel name (catch documentation)" }
      - { name: harvest_date, type: datetime, source: input, description: "Catch/harvest date" }
      - { name: catch_area_code, type: string, source: input, description: "FAO major fishing area code" }
      - { name: harvest_country_code, type: string, source: input, description: "ISO country code where harvested; drives COOL" }
      - { name: production_method, type: enum, source: input, description: "WILD or FARMED", constraints: "WILD | FARMED" }
      - { name: species_declared, type: string, source: input, description: "Species declared on catch documents" }
      - { name: species_verified, type: string, source: system, description: "Species confirmed by SpeciesVerification; null until verified" }
      - { name: grade, type: enum, source: input, description: "Receiving grade", constraints: "A | B | C" }
      - { name: quantity_received_kg, type: number, source: input, description: "Gross received weight kg; > 0; 3 decimal places" }
      - { name: ice_deduction_pct, type: number, source: input, default: 0, description: "Ice/glaze deduction percent 0-50" }
      - { name: quantity_accepted_kg, type: number, source: computed, description: "round(quantity_received_kg * (1 - ice_deduction_pct/100), 3) half-up" }
      - { name: consumed_kg, type: number, source: computed, default: 0, description: "Sum of BatchInputLot.quantity_kg rows referencing this lot" }
      - { name: remaining_kg, type: number, source: computed, description: "quantity_accepted_kg - consumed_kg; mass-balance invariant anchor" }
      - { name: receiving_temp_c, type: number, source: input, description: "Product temperature at receipt, Celsius" }
      - { name: freeze_protocol, type: enum, source: input, default: "NONE", description: "Parasite-destruction protocol required for this lot", constraints: "NONE | STANDARD | BLAST | COMBO" }
      - { name: freeze_compliant, type: boolean, source: computed, default: false, description: "True once freeze_protocol_compliance accumulation meets the protocol requirement; meaningless when freeze_protocol is NONE" }
      - { name: cumulative_abuse_minutes, type: integer, source: computed, default: 0, description: "Cumulative minutes with avg_temp_c > 4.4 across this lot's TemperatureLog rows (histamine-susceptible species)" }
      - { name: mislabel_flag, type: boolean, source: system, default: false, description: "True after a mismatch is resolved by relabeling to the verified species" }
      - { name: allocated_cost_cents, type: integer, source: computed, default: 0, description: "Share of entry allocatable_total_cents per entry_cost_allocation" }
      - { name: status, type: enum, source: system, description: "Lot lifecycle", constraints: "UNDER_INSPECTION | ACCEPTED | QUARANTINED | REJECTED | CONSUMED" }

  - name: SpeciesVerification
    parent: null
    common_fields: true
    fields:
      - { name: receipt_lot_id, type: string, source: input, description: "FK -> ReceiptLot.id; lot under verification" }
      - { name: test_method, type: enum, source: input, description: "Verification method", constraints: "DNA_BARCODING | SENSORY" }
      - { name: sample_size, type: integer, source: input, description: "Number of units sampled; > 0" }
      - { name: verified_species, type: string, source: input, description: "Species determined by the test" }
      - { name: is_match, type: boolean, source: computed, description: "verified_species == lot.species_declared (at creation time)" }
      - { name: resolution, type: enum, source: input, description: "Set by resolve action", constraints: "RELABEL_AS_VERIFIED | REJECT_LOT" }
      - { name: status, type: enum, source: system, description: "Verification lifecycle", constraints: "CONFIRMED | MISMATCH | RESOLVED_RELABELED | RESOLVED_REJECTED" }

  - name: ProcessingBatch
    parent: null
    common_fields: true
    fields:
      - { name: target_species, type: string, source: input, description: "Species all input lots must match" }
      - { name: product_form, type: enum, source: input, description: "Conversion form", constraints: "FILLET | LOIN | PORTION" }
      - { name: status, type: enum, source: system, description: "Batch lifecycle", constraints: "IN_PROCESS | COMPLETED | RECONCILED" }
      - { name: input_total_kg, type: number, source: computed, default: 0, description: "Sum of BatchInputLot.quantity_kg for this batch, 3 decimals" }
      - { name: provisional_output_kg, type: number, source: computed, description: "Sum of per-lot provisional contributions (each rounded to 3 decimals, then summed)" }
      - { name: actual_output_kg, type: number, source: input, description: "Measured finished weight kg; provided at complete" }
      - { name: trim_waste_kg, type: number, source: input, description: "Trim waste kg; provided at complete" }
      - { name: other_waste_kg, type: number, source: input, description: "Other waste kg; provided at complete" }
      - { name: yield_pct_provisional, type: number, source: computed, description: "round(100 * provisional_output_kg / input_total_kg, 2) half-up" }
      - { name: yield_pct_final, type: number, source: computed, description: "round(100 * actual_output_kg / input_total_kg, 2) half-up" }
      - { name: yield_variance_pct, type: number, source: computed, description: "round(yield_pct_final - yield_pct_provisional, 2)" }

  - name: BatchInputLot
    parent: null
    common_fields: true
    fields:
      - { name: processing_batch_id, type: string, source: input, description: "FK -> ProcessingBatch.id" }
      - { name: receipt_lot_id, type: string, source: input, description: "FK -> ReceiptLot.id; lot must be ACCEPTED" }
      - { name: quantity_kg, type: number, source: input, description: "Kg consumed from the lot; > 0; <= lot.remaining_kg; 3 decimals" }
      - { name: provisional_yield_kg, type: number, source: computed, description: "round(quantity_kg * BASE_YIELD[batch.product_form] * GRADE_FACTOR[lot.grade], 3) half-up" }

  - name: TemperatureLog
    parent: null
    common_fields: false
    fields:
      - { name: receipt_lot_id, type: string, source: input, description: "FK -> ReceiptLot.id; nullable but exactly one of receipt_lot_id / processing_batch_id required" }
      - { name: processing_batch_id, type: string, source: input, description: "FK -> ProcessingBatch.id; nullable but exactly one of receipt_lot_id / processing_batch_id required" }
      - { name: interval_start, type: datetime, source: input, description: "Interval start (half-open, inclusive)" }
      - { name: interval_end, type: datetime, source: input, description: "Interval end (half-open, exclusive); must be > interval_start" }
      - { name: core_temp_c, type: number, source: input, description: "Core product temperature Celsius during the interval" }
      - { name: avg_temp_c, type: number, source: input, description: "Average ambient/product temperature Celsius during the interval" }
      - { name: source, type: enum, source: input, description: "How the reading was captured", constraints: "CONTINUOUS_MONITOR | MANUAL_PROBE" }

  - name: HaccpMonitoringRecord
    parent: null
    common_fields: false
    fields:
      - { name: hazard_type, type: enum, source: input, description: "CCP hazard class", constraints: "HISTAMINE | PARASITE" }
      - { name: receipt_lot_id, type: string, source: input, description: "FK -> ReceiptLot.id; required (and batch id forbidden) when hazard_type = HISTAMINE" }
      - { name: processing_batch_id, type: string, source: input, description: "FK -> ProcessingBatch.id; required (and lot id forbidden) when hazard_type = PARASITE" }
      - { name: phase, type: enum, source: input, description: "SCREENING (rapid test) or CONFIRMATORY (composite lab analysis)", constraints: "SCREENING | CONFIRMATORY" }
      - { name: measured_value, type: number, source: input, description: "SCREENING: measured ppm (HISTAMINE) or parasite count (PARASITE); forbidden for CONFIRMATORY" }
      - { name: subsample_values, type: array, source: input, description: "CONFIRMATORY HISTAMINE: array of >= 3 subsample ppm values; forbidden otherwise" }
      - { name: measured_at, type: datetime, source: input, description: "When the measurement was taken" }
      - { name: verdict, type: enum, source: computed, description: "PASS | DEVIATION per histamine_verdict calculation", constraints: "PASS | DEVIATION" }
      - { name: corrective_action_id, type: string, source: system, description: "FK -> CorrectiveAction.id; auto-created CA when verdict is DEVIATION; null on PASS" }

  - name: CorrectiveAction
    parent: null
    common_fields: true
    fields:
      - { name: source_type, type: enum, source: input, description: "What raised the CA; MANUAL only via POST /seafood/corrective-actions, all other values system-set by auto-creation", constraints: "SPECIES_MISMATCH | HISTAMINE_DEVIATION | TEMPERATURE_ABUSE | YIELD_VARIANCE | MANUAL" }
      - { name: supplier_id, type: string, source: system, description: "FK -> ForeignSupplier.id; traced via lot.import_entry_id.supplier_id when lot-linked; null for batch-only CAs" }
      - { name: receipt_lot_id, type: string, source: system, description: "FK -> ReceiptLot.id; nullable" }
      - { name: processing_batch_id, type: string, source: system, description: "FK -> ProcessingBatch.id; nullable" }
      - { name: monitoring_record_id, type: string, source: system, description: "FK -> HaccpMonitoringRecord.id; nullable" }
      - { name: opened_by, type: string, source: system, description: "X-User-ID of the request that caused the deviation" }
      - { name: status, type: enum, source: system, description: "CA lifecycle", constraints: "OPEN | INVESTIGATING | RESOLVED | ESCALATED" }
      - { name: resolution_note, type: string, source: input, description: "Resolution rationale; provided at resolve" }
      - { name: closed_by, type: string, source: system, description: "X-User-ID of resolver; must differ from opened_by (segregation of duties)" }
      - { name: recall_id, type: string, source: system, description: "FK -> Recall.id; set on escalate; null otherwise" }

  - name: ProductLabel
    parent: null
    common_fields: true
    fields:
      - { name: market_name, type: string, source: input, description: "FDA acceptable market name" }
      - { name: scientific_name, type: string, source: input, description: "Latin binomial" }
      - { name: species, type: string, source: input, description: "Species code this label may be applied to" }
      - { name: production_method, type: enum, source: input, description: "WILD or FARMED declaration", constraints: "WILD | FARMED" }
      - { name: country_of_origin, type: string, source: input, description: "COOL country declaration text" }
      - { name: keep_frozen_statement, type: boolean, source: input, default: false, description: "Whether the keep-frozen handling statement is printed" }
      - { name: allergen_statement, type: string, source: computed, description: "\"Contains: Fish (<market_name>)\" — computed, input ignored" }
      - { name: supersedes_label_id, type: string, source: input, description: "FK -> ProductLabel.id; nullable; self-referential version chain" }
      - { name: status, type: enum, source: system, description: "Label lifecycle", constraints: "DRAFT | APPROVED | SUPERSEDED" }
      - { name: approved_at, type: datetime, source: system, description: "Approval timestamp; null until approved" }

  - name: FinishedProductLot
    parent: null
    common_fields: true
    fields:
      - { name: processing_batch_id, type: string, source: input, description: "FK -> ProcessingBatch.id; batch must be COMPLETED or RECONCILED" }
      - { name: net_weight_kg, type: number, source: input, description: "Packed net weight kg; > 0; 3 decimals" }
      - { name: product_label_id, type: string, source: system, description: "FK -> ProductLabel.id; set by apply-label; null while UNLABELED" }
      - { name: label_version_pinned, type: integer, source: system, description: "ProductLabel.version captured at apply-label time (version pinning)" }
      - { name: label_stale, type: boolean, source: computed, default: false, description: "True when the pinned label version no longer matches the label's current version (label superseded)" }
      - { name: allergen_statement, type: string, source: computed, description: "Copied from ProductLabel at apply-label" }
      - { name: country_of_origin, type: string, source: computed, description: "All batch input lots share one harvest_country_code -> that code; otherwise \"MIXED:\" + distinct codes sorted ascending joined with \"+\"" }
      - { name: status, type: enum, source: system, description: "Finished lot lifecycle", constraints: "UNLABELED | LABELED | RELEASED | RECALLED" }
      - { name: released_at, type: datetime, source: system, description: "Release timestamp; null until released" }

  - name: Recall
    parent: null
    common_fields: true
    fields:
      - { name: corrective_action_id, type: string, source: system, description: "FK -> CorrectiveAction.id; originating CA" }
      - { name: reason, type: string, source: input, description: "Recall reason; supplied on escalate" }
      - { name: scope_lot_ids, type: array, source: input, description: "FinishedProductLot ids in scope; supplied on escalate; must be non-empty" }
      - { name: status, type: enum, source: system, description: "Recall lifecycle", constraints: "INITIATED | NOTIFIED" }
      - { name: notified_at, type: datetime, source: system, description: "Notification timestamp; null until notified" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ForeignSupplier
    initial_state: PENDING_EVALUATION
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING_EVALUATION
        to: APPROVED
        trigger: "POST /seafood/supplier-evaluations with outcome APPROVED (overall_score >= 70)"
        actor: ComplianceManager
        preconditions: ["supplier.fsvp_status == PENDING_EVALUATION", "evaluation overall_score >= 70"]
        side_effects: ["supplier.last_evaluation_period_end := period_end", "recompute supplier.risk_score and risk_tier (supplier_risk_score)", "supplier.next_evaluation_due := period_end + tier interval (LOW 36mo | MODERATE 12mo | HIGH 3mo)", "increments ForeignSupplier.version by 1"]
      - from: PENDING_EVALUATION
        to: REJECTED
        trigger: "POST /seafood/supplier-evaluations with outcome REJECTED (overall_score < 50)"
        actor: ComplianceManager
        preconditions: ["supplier.fsvp_status == PENDING_EVALUATION", "evaluation overall_score < 50"]
        side_effects: ["recompute supplier.risk_score and risk_tier", "increments ForeignSupplier.version by 1"]
      - from: PENDING_EVALUATION
        to: PENDING_EVALUATION
        trigger: "POST /seafood/supplier-evaluations with outcome CONDITIONAL (50 <= overall_score < 70)"
        actor: ComplianceManager
        preconditions: ["supplier.fsvp_status == PENDING_EVALUATION"]
        side_effects: ["recompute supplier.risk_score and risk_tier", "increments ForeignSupplier.version by 1"]
        note: "CONDITIONAL does not approve a never-approved supplier"
      - from: APPROVED
        to: APPROVED
        trigger: "POST /seafood/supplier-evaluations with outcome APPROVED or CONDITIONAL (early re-certification)"
        actor: ComplianceManager
        preconditions: ["supplier.fsvp_status == APPROVED", "evaluation overall_score >= 50"]
        side_effects: ["supplier.last_evaluation_period_end := period_end", "recompute supplier.risk_score and risk_tier", "supplier.next_evaluation_due := period_end + tier interval", "increments ForeignSupplier.version by 1"]
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /seafood/supplier-evaluations with outcome REJECTED (failed re-certification)"
        actor: ComplianceManager
        preconditions: ["supplier.fsvp_status == APPROVED", "evaluation overall_score < 50"]
        side_effects: ["recompute supplier.risk_score and risk_tier", "increments ForeignSupplier.version by 1"]
      - from: APPROVED
        to: REEVALUATION_DUE
        trigger: "system sweep on POST /_clock/set_current_utc when current_utc >= supplier.next_evaluation_due"
        actor: system
        preconditions: ["supplier.fsvp_status == APPROVED", "next_evaluation_due != null", "current_utc >= next_evaluation_due"]
        side_effects: ["increments ForeignSupplier.version by 1"]
      - from: REEVALUATION_DUE
        to: APPROVED
        trigger: "POST /seafood/supplier-evaluations with outcome APPROVED or CONDITIONAL"
        actor: ComplianceManager
        preconditions: ["supplier.fsvp_status == REEVALUATION_DUE", "evaluation overall_score >= 50"]
        side_effects: ["supplier.last_evaluation_period_end := period_end", "recompute supplier.risk_score and risk_tier", "supplier.next_evaluation_due := period_end + tier interval", "increments ForeignSupplier.version by 1"]
      - from: REEVALUATION_DUE
        to: SUSPENDED
        trigger: "POST /seafood/supplier-evaluations with outcome REJECTED"
        actor: ComplianceManager
        preconditions: ["supplier.fsvp_status == REEVALUATION_DUE", "evaluation overall_score < 50"]
        side_effects: ["recompute supplier.risk_score and risk_tier", "increments ForeignSupplier.version by 1"]
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /seafood/suppliers/{id}/suspend"
        actor: ComplianceManager
        preconditions: ["supplier.fsvp_status == APPROVED"]
        side_effects: ["increments ForeignSupplier.version by 1"]
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /seafood/supplier-evaluations with outcome APPROVED"
        actor: ComplianceManager
        preconditions: ["supplier.fsvp_status == SUSPENDED", "evaluation overall_score >= 70"]
        side_effects: ["supplier.last_evaluation_period_end := period_end", "recompute supplier.risk_score and risk_tier", "supplier.next_evaluation_due := period_end + tier interval", "increments ForeignSupplier.version by 1"]

  - entity: ImportEntry
    initial_state: DRAFT
    terminal_states: [RELEASED, REFUSED]
    transitions:
      - from: DRAFT
        to: PRIOR_NOTICE_FILED
        trigger: "POST /seafood/import-entries/{id}/file-prior-notice"
        actor: ImportCoordinator
        preconditions: ["entry.status == DRAFT", "supplier.fsvp_status == APPROVED", "current_utc <= scheduled_arrival - PRIOR_NOTICE_LEAD_HOURS[transport_mode]"]
        side_effects: ["entry.prior_notice_filed_at := current_utc", "entry.prior_notice_confirmation := server-minted confirmation", "increments ImportEntry.version by 1"]
      - from: PRIOR_NOTICE_FILED
        to: ENTRY_FILED
        trigger: "POST /seafood/import-entries/{id}/file-entry"
        actor: ImportCoordinator
        preconditions: ["entry.status == PRIOR_NOTICE_FILED", "supplier.fsvp_status == APPROVED"]
        side_effects: ["entry.entry_filed_at := current_utc", "increments ImportEntry.version by 1"]
        note: "supplier approval is re-checked at entry filing; suspension between prior notice and entry blocks filing"
      - from: ENTRY_FILED
        to: RELEASED
        trigger: "POST /seafood/import-entries/{id}/fda-disposition with outcome RELEASED"
        actor: ImportCoordinator
        preconditions: ["entry.status == ENTRY_FILED"]
        side_effects: ["entry.duty_cents := round(goods_value_cents * duty_rate_pct, 0) half-up", "entry.allocatable_total_cents := goods_value_cents + freight_cost_cents + duty_cents", "run entry_cost_allocation over this entry's ACCEPTED receipt lots", "increments ImportEntry.version by 1"]
      - from: ENTRY_FILED
        to: DETAINED
        trigger: "POST /seafood/import-entries/{id}/fda-disposition with outcome DETAINED"
        actor: ImportCoordinator
        preconditions: ["entry.status == ENTRY_FILED"]
        side_effects: ["increments ImportEntry.version by 1"]
      - from: ENTRY_FILED
        to: REFUSED
        trigger: "POST /seafood/import-entries/{id}/fda-disposition with outcome REFUSED"
        actor: ImportCoordinator
        preconditions: ["entry.status == ENTRY_FILED"]
        side_effects: ["increments ImportEntry.version by 1"]
      - from: DETAINED
        to: RELEASED
        trigger: "POST /seafood/import-entries/{id}/fda-disposition with outcome RELEASED"
        actor: ImportCoordinator
        preconditions: ["entry.status == DETAINED"]
        side_effects: ["entry.duty_cents and allocatable_total_cents computed", "run entry_cost_allocation", "increments ImportEntry.version by 1"]
      - from: DETAINED
        to: REFUSED
        trigger: "POST /seafood/import-entries/{id}/fda-disposition with outcome REFUSED"
        actor: ImportCoordinator
        preconditions: ["entry.status == DETAINED"]
        side_effects: ["increments ImportEntry.version by 1"]

  - entity: ReceiptLot
    initial_state: UNDER_INSPECTION
    terminal_states: [REJECTED, CONSUMED]
    transitions:
      - from: UNDER_INSPECTION
        to: ACCEPTED
        trigger: "POST /seafood/receipt-lots/{id}/accept"
        actor: ReceivingInspector
        preconditions:
          - "lot.status == UNDER_INSPECTION"
          - "a SpeciesVerification for this lot exists with status CONFIRMED or RESOLVED_RELABELED"
          - "if lot.species_declared in HISTAMINE_SUSCEPTIBLE_SPECIES: a HaccpMonitoringRecord (HISTAMINE, this lot) with verdict PASS exists"
          - "lot.cumulative_abuse_minutes < ABUSE_LIMIT_MIN (240)"
          - "if lot.freeze_protocol != NONE: lot.freeze_compliant == true"
          - "no CorrectiveAction linked to this lot with status OPEN or INVESTIGATING"
        side_effects: ["run entry_cost_allocation over this entry's ACCEPTED lots (this lot now included)", "increments ReceiptLot.version by 1"]
      - from: UNDER_INSPECTION
        to: REJECTED
        trigger: "POST /seafood/receipt-lots/{id}/reject"
        actor: ReceivingInspector
        preconditions: ["lot.status == UNDER_INSPECTION"]
        side_effects: ["increments ReceiptLot.version by 1"]
      - from: UNDER_INSPECTION
        to: QUARANTINED
        trigger: "POST /seafood/receipt-lots/{id}/quarantine OR auto on species mismatch / HISTAMINE DEVIATION / abuse-limit crossing"
        actor: QualityAssuranceTech | system
        preconditions: ["lot.status == UNDER_INSPECTION"]
        side_effects: ["increments ReceiptLot.version by 1"]
      - from: ACCEPTED
        to: QUARANTINED
        trigger: "POST /seafood/receipt-lots/{id}/quarantine OR auto on late HISTAMINE DEVIATION / abuse-limit crossing"
        actor: QualityAssuranceTech | system
        preconditions: ["lot.status == ACCEPTED"]
        side_effects: ["run entry_cost_allocation over this entry's ACCEPTED lots (this lot now excluded)", "increments ReceiptLot.version by 1"]
      - from: QUARANTINED
        to: ACCEPTED
        trigger: "POST /seafood/receipt-lots/{id}/quarantine-release"
        actor: ComplianceManager
        preconditions:
          - "lot.status == QUARANTINED"
          - "no CorrectiveAction linked to this lot with status OPEN or INVESTIGATING"
          - "a SpeciesVerification for this lot exists with status CONFIRMED or RESOLVED_RELABELED"
          - "if lot.species_declared in HISTAMINE_SUSCEPTIBLE_SPECIES: a HaccpMonitoringRecord (HISTAMINE, this lot) with verdict PASS exists"
          - "lot.cumulative_abuse_minutes < ABUSE_LIMIT_MIN (240)"
          - "if lot.freeze_protocol != NONE: lot.freeze_compliant == true"
        side_effects: ["run entry_cost_allocation over this entry's ACCEPTED lots (this lot re-included)", "increments ReceiptLot.version by 1"]
      - from: QUARANTINED
        to: REJECTED
        trigger: "POST /seafood/species-verifications/{id}/resolve with resolution REJECT_LOT OR POST /seafood/receipt-lots/{id}/reject"
        actor: QualityAssuranceTech | ReceivingInspector
        preconditions: ["lot.status == QUARANTINED"]
        side_effects: ["increments ReceiptLot.version by 1"]
      - from: ACCEPTED
        to: CONSUMED
        trigger: "system auto-transition when remaining_kg reaches exactly 0 after a BatchInputLot add"
        actor: system
        preconditions: ["lot.status == ACCEPTED", "lot.remaining_kg == 0"]
        side_effects: ["increments ReceiptLot.version by 1"]

  - entity: SpeciesVerification
    initial_state: "CONFIRMED or MISMATCH (decided at creation by is_match)"
    terminal_states: [CONFIRMED, RESOLVED_RELABELED, RESOLVED_REJECTED]
    transitions:
      - from: "(creation)"
        to: CONFIRMED
        trigger: "POST /seafood/species-verifications with is_match == true"
        actor: ReceivingInspector
        preconditions: ["lot.status in {UNDER_INSPECTION, QUARANTINED}"]
        side_effects: ["lot.species_verified := verified_species", "increments ReceiptLot.version by 1"]
      - from: "(creation)"
        to: MISMATCH
        trigger: "POST /seafood/species-verifications with is_match == false"
        actor: ReceivingInspector
        preconditions: ["lot.status in {UNDER_INSPECTION, QUARANTINED}"]
        side_effects:
          - "link 1: lot transitions UNDER_INSPECTION|ACCEPTED -> QUARANTINED (if not already QUARANTINED); increments ReceiptLot.version by 1"
          - "link 2: the lot's quarantine-entry caused by this mismatch auto-creates a CorrectiveAction (source_type SPECIES_MISMATCH, receipt_lot_id := lot.id, supplier_id traced via lot.import_entry_id -> ImportEntry.supplier_id, opened_by := request X-User-ID, status OPEN)"
          - "link 3: that CorrectiveAction creation increments supplier.open_corrective_action_count by 1 and supplier.total_species_mismatches by 1, then recomputes supplier.risk_score and risk_tier; increments ForeignSupplier.version by 1"
      - from: MISMATCH
        to: RESOLVED_RELABELED
        trigger: "POST /seafood/species-verifications/{id}/resolve with resolution RELABEL_AS_VERIFIED"
        actor: QualityAssuranceTech
        preconditions: ["verification.status == MISMATCH", "lot.status == QUARANTINED"]
        side_effects: ["lot.species_declared := verified_species", "lot.species_verified := verified_species", "lot.mislabel_flag := true", "increments ReceiptLot.version by 1"]
        note: "lot remains QUARANTINED until the linked CA is RESOLVED and quarantine-release is called"
      - from: MISMATCH
        to: RESOLVED_REJECTED
        trigger: "POST /seafood/species-verifications/{id}/resolve with resolution REJECT_LOT"
        actor: QualityAssuranceTech
        preconditions: ["verification.status == MISMATCH", "lot.status == QUARANTINED"]
        side_effects: ["lot -> REJECTED", "increments ReceiptLot.version by 1"]

  - entity: ProcessingBatch
    initial_state: IN_PROCESS
    terminal_states: [RECONCILED]
    transitions:
      - from: IN_PROCESS
        to: COMPLETED
        trigger: "POST /seafood/processing-batches/{id}/complete"
        actor: ProcessingSupervisor
        preconditions: ["batch.status == IN_PROCESS", "batch has >= 1 BatchInputLot rows", "expected_batch_version == batch.version (OCC)"]
        side_effects:
          - "recompute input_total_kg, provisional_output_kg, yield_pct_provisional (provisional_yield_estimation)"
          - "set actual_output_kg, trim_waste_kg, other_waste_kg from payload; compute yield_pct_final and yield_variance_pct"
          - "if |yield_variance_pct| > YIELD_VARIANCE_TOLERANCE (5.0): auto-create CorrectiveAction (source_type YIELD_VARIANCE, processing_batch_id := batch.id, supplier_id := null, opened_by := request X-User-ID)"
          - "increments ProcessingBatch.version by 1"
      - from: COMPLETED
        to: IN_PROCESS
        trigger: "POST /seafood/processing-batches/{id}/reopen"
        actor: ProcessingSupervisor
        preconditions: ["batch.status == COMPLETED", "no FinishedProductLot of this batch has status RELEASED or RECALLED"]
        side_effects: ["increments ProcessingBatch.version by 1"]
      - from: COMPLETED
        to: RECONCILED
        trigger: "POST /seafood/processing-batches/{id}/reconcile"
        actor: ProcessingSupervisor
        preconditions:
          - "batch.status == COMPLETED"
          - "input_total_kg == actual_output_kg + trim_waste_kg + other_waste_kg (exact at 3 decimals)"
          - "if |yield_variance_pct| > 5.0: a CorrectiveAction (YIELD_VARIANCE, this batch) with status RESOLVED exists"
        side_effects: ["increments ProcessingBatch.version by 1"]

  - entity: CorrectiveAction
    initial_state: OPEN
    terminal_states: [ESCALATED]
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /seafood/corrective-actions/{id}/investigate"
        actor: ComplianceManager
        preconditions: ["ca.status == OPEN"]
        side_effects: ["increments CorrectiveAction.version by 1"]
      - from: RESOLVED
        to: INVESTIGATING
        trigger: "POST /seafood/corrective-actions/{id}/investigate (re-audit reopen)"
        actor: ComplianceManager
        preconditions: ["ca.status == RESOLVED"]
        side_effects: ["if ca.supplier_id != null: supplier.open_corrective_action_count += 1 and risk recompute", "increments CorrectiveAction.version by 1"]
      - from: INVESTIGATING
        to: RESOLVED
        trigger: "POST /seafood/corrective-actions/{id}/resolve"
        actor: ComplianceManager
        preconditions: ["ca.status == INVESTIGATING", "request X-User-ID != ca.opened_by (segregation of duties)"]
        side_effects: ["ca.closed_by := request X-User-ID", "ca.resolution_note := payload", "if ca.supplier_id != null: supplier.open_corrective_action_count -= 1 and risk recompute", "increments CorrectiveAction.version by 1"]
      - from: OPEN
        to: ESCALATED
        trigger: "POST /seafood/corrective-actions/{id}/escalate"
        actor: ComplianceManager
        preconditions: ["ca.status == OPEN", "scope_lot_ids non-empty", "every scope lot exists and has status != RECALLED"]
        side_effects:
          - "link 1: create Recall (corrective_action_id := ca.id, reason/scope from payload, status INITIATED); ca.recall_id := recall.id"
          - "link 2: the Recall creation transitions every in-scope FinishedProductLot with status != RECALLED to RECALLED; increments each lot's version by 1"
          - "if ca.supplier_id != null: supplier.open_corrective_action_count -= 1 and risk recompute (ESCALATED is no longer open)"
          - "increments CorrectiveAction.version by 1"
      - from: INVESTIGATING
        to: ESCALATED
        trigger: "POST /seafood/corrective-actions/{id}/escalate"
        actor: ComplianceManager
        preconditions: ["ca.status == INVESTIGATING", "scope_lot_ids non-empty", "every scope lot exists and has status != RECALLED"]
        side_effects: ["same recall creation and lot cascade as OPEN -> ESCALATED", "if ca.supplier_id != null: supplier.open_corrective_action_count -= 1 and risk recompute", "increments CorrectiveAction.version by 1"]

  - entity: ProductLabel
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /seafood/product-labels/{id}/approve"
        actor: ComplianceManager
        preconditions: ["label.status == DRAFT", "if supersedes_label_id != null: referenced label exists and has status APPROVED"]
        side_effects:
          - "label.approved_at := current_utc; increments ProductLabel.version by 1"
          - "if supersedes_label_id != null: superseded label -> SUPERSEDED (increments its version by 1)"
          - "every FinishedProductLot pinned to the superseded label: label_stale := true; increments each lot's version by 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system side-effect of approving a newer label whose supersedes_label_id references this label"
        actor: system
        preconditions: ["label.status == APPROVED"]
        side_effects: ["increments ProductLabel.version by 1"]

  - entity: FinishedProductLot
    initial_state: UNLABELED
    terminal_states: [RECALLED]
    transitions:
      - from: UNLABELED
        to: LABELED
        trigger: "POST /seafood/finished-product-lots/{id}/apply-label"
        actor: ProcessingSupervisor
        preconditions: ["lot.status == UNLABELED", "label.status == APPROVED", "label.species == batch.target_species"]
        side_effects: ["lot.product_label_id := label.id", "lot.label_version_pinned := label.version (pinned at apply time)", "lot.label_stale := false", "lot.allergen_statement := label.allergen_statement", "lot.country_of_origin computed from batch input lots' harvest_country_code", "increments FinishedProductLot.version by 1"]
      - from: LABELED
        to: LABELED
        trigger: "POST /seafood/finished-product-lots/{id}/apply-label (re-apply after staleness)"
        actor: ProcessingSupervisor
        preconditions: ["lot.status == LABELED", "lot.label_stale == true", "label.status == APPROVED", "label.species == batch.target_species"]
        side_effects: ["re-pin product_label_id and label_version_pinned to the new label.version", "label_stale := false", "refresh allergen_statement and country_of_origin", "increments FinishedProductLot.version by 1"]
      - from: LABELED
        to: RELEASED
        trigger: "POST /seafood/finished-product-lots/{id}/release"
        actor: ComplianceManager
        preconditions: ["lot.status == LABELED", "batch.status == RECONCILED", "lot.label_stale == false", "pinned label.status == APPROVED", "no CorrectiveAction linked to the batch with status OPEN or INVESTIGATING"]
        side_effects: ["lot.released_at := current_utc", "increments FinishedProductLot.version by 1"]
      - from: UNLABELED
        to: RECALLED
        trigger: "system side-effect of Recall creation covering this lot"
        actor: system
        preconditions: ["lot in recall.scope_lot_ids"]
        side_effects: ["increments FinishedProductLot.version by 1"]
      - from: LABELED
        to: RECALLED
        trigger: "system side-effect of Recall creation covering this lot"
        actor: system
        preconditions: ["lot in recall.scope_lot_ids"]
        side_effects: ["increments FinishedProductLot.version by 1"]
      - from: RELEASED
        to: RECALLED
        trigger: "system side-effect of Recall creation covering this lot"
        actor: system
        preconditions: ["lot in recall.scope_lot_ids"]
        side_effects: ["increments FinishedProductLot.version by 1"]

  - entity: Recall
    initial_state: INITIATED
    terminal_states: [NOTIFIED]
    transitions:
      - from: INITIATED
        to: NOTIFIED
        trigger: "POST /seafood/recalls/{id}/notify"
        actor: ComplianceManager
        preconditions: ["recall.status == INITIATED"]
        side_effects: ["recall.notified_at := current_utc", "increments Recall.version by 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: batch-complete-stale-version
    parent_entity: ProcessingBatch
    write_endpoint: "POST /seafood/processing-batches/{id}/complete"
    occ_field: "expected_batch_version"
    description: |
      Completing a ProcessingBatch whose version has advanced since the client
      last observed it is rejected. Completion computes yield from the batch's
      current input composition; an input addition that the client has not
      observed (which itself bumps batch.version) makes the client's expected
      version stale, so the completion must be rejected rather than computed
      over a composition the client never reviewed.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: supplier-evaluation-stale-version
    parent_entity: ForeignSupplier
    write_endpoint: "POST /seafood/supplier-evaluations"
    occ_field: "expected_supplier_version"
    description: |
      Creating a SupplierEvaluation against a ForeignSupplier whose version has
      advanced since the client last observed it is rejected. A new evaluation
      legitimately re-derives the supplier's FSVP posture and risk cadence;
      another mutation landing in between (e.g. a suspend or a prior
      evaluation, each of which bumps supplier.version) makes the current
      writer's view of the supplier stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: provisional_yield_estimation
    trigger: "on BatchInputLot create/delete and on POST /seafood/processing-batches/{id}/complete"
    algorithm: aggregation
    formula: |
      For each BatchInputLot row of the batch:
        contribution_i = round(quantity_kg * BASE_YIELD[batch.product_form] * GRADE_FACTOR[lot.grade], 3)   # round_half_up per lot FIRST
      provisional_output_kg = sum(contribution_i)                                                          # THEN sum (pinned order)
      input_total_kg = sum(quantity_kg)  (3 decimals)
      yield_pct_provisional = round(100 * provisional_output_kg / input_total_kg, 2)  # round_half_up
      Final variant (at complete):
        yield_pct_final = round(100 * actual_output_kg / input_total_kg, 2)
        yield_variance_pct = round(yield_pct_final - yield_pct_provisional, 2)
      Rounding order is pinned: per-lot contribution rounded to 3 decimals first,
      then summed. Sum-then-round is forbidden (produces different kg).
    input_set: "BatchInputLot rows of the batch (all; deletion removes the row from the set); lot.grade read from referenced ReceiptLot"
    constants:
      BASE_YIELD_FILLET: 0.42
      BASE_YIELD_LOIN: 0.55
      BASE_YIELD_PORTION: 0.48
      GRADE_FACTOR_A: 1.00
      GRADE_FACTOR_B: 0.95
      GRADE_FACTOR_C: 0.88
      YIELD_VARIANCE_TOLERANCE: 5.0
    precision: "kg: 3 decimal places, round_half_up; percents: 2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "before completion; modeled from species form/grade factors"
        difference: "uses BASE_YIELD * GRADE_FACTOR model; ignores measured output"
      - name: final
        when: "at/after completion; measured actual_output_kg"
        difference: "uses scale-measured actual_output_kg; identical inputs yield different pct than provisional"

  - name: histamine_verdict
    trigger: "on POST /seafood/haccp-monitoring-records with hazard_type HISTAMINE"
    algorithm: threshold
    formula: |
      SCREENING phase (measured_value required):
        verdict = DEVIATION if measured_value >= CRITICAL_LIMIT_PPM else PASS
      CONFIRMATORY phase (subsample_values required, >= 3):
        avg = round(mean(subsample_values), 2)  # round_half_up
        verdict = PASS if (avg < CRITICAL_LIMIT_PPM and max(subsample_values) < SUBSAMPLE_CEILING_PPM) else DEVIATION
      On verdict == DEVIATION: auto-create CorrectiveAction (source_type
      HISTAMINE_DEVIATION, monitoring_record_id := this record, receipt_lot_id
      := record lot, supplier_id traced via lot.import_entry_id, opened_by :=
      request X-User-ID); lot UNDER_INSPECTION|ACCEPTED -> QUARANTINED;
      supplier.total_haccp_deviations += 1; supplier.open_corrective_action_count
      += 1; risk recompute.
    input_set: "the single monitoring record being created; lot referenced by receipt_lot_id"
    constants:
      CRITICAL_LIMIT_PPM: 50.0
      SUBSAMPLE_CEILING_PPM: 100.0
      MIN_SUBSAMPLES: 3
    precision: "ppm inputs 1 decimal; composite average 2 decimals, round_half_up"
    variants:
      - name: screening
        when: "phase == SCREENING; rapid single-value test"
        difference: "single measured_value compared against 50.0 ppm; >= is deviation"
      - name: confirmatory
        when: "phase == CONFIRMATORY; composite lab analysis"
        difference: "average of >= 3 subsamples must be < 50.0 AND every subsample < 100.0; same lot can fail screening yet pass confirmatory"

  - name: freeze_protocol_compliance
    trigger: "on POST /seafood/temperature-logs for a ReceiptLot with freeze_protocol != NONE"
    algorithm: constraint_propagation
    formula: |
      Intervals are half-open [interval_start, interval_end); overlap rejected
      elsewhere. Accumulate only minutes where core_temp_c <= threshold:
        STANDARD: threshold -20.0, required_minutes = 168 * 60
        BLAST:    threshold -35.0, required_minutes = 15 * 60
        COMBO:    phase 1 — minutes with core_temp_c <= -35.0 must total >= 4 * 60;
                  phase 2 — only intervals whose interval_start >= end of the first
                  interval that reached <= -35.0 count; minutes with core_temp_c
                  <= -20.0 must total >= 24 * 60. Both phases must pass.
      Intervals above the threshold contribute 0 minutes (accumulation PAUSES;
      it does NOT reset). freeze_compliant := true once required minutes met.
      Evaluation order pinned: per-interval qualifying minutes first (conditional
      on protocol branch), then sum, then compare >= required.
    input_set: "all TemperatureLog rows with receipt_lot_id == lot.id, ordered by interval_start ASC (tie: created_at ASC)"
    constants:
      STANDARD_THRESHOLD_C: -20.0
      STANDARD_REQUIRED_MINUTES: 10080
      BLAST_THRESHOLD_C: -35.0
      BLAST_REQUIRED_MINUTES: 900
      COMBO_BLAST_MIN_MINUTES: 240
      COMBO_HOLD_THRESHOLD_C: -20.0
      COMBO_HOLD_REQUIRED_MINUTES: 1440
    precision: "whole minutes"

  - name: temperature_abuse_exposure
    trigger: "on POST /seafood/temperature-logs for a ReceiptLot whose species_declared is in HISTAMINE_SUSCEPTIBLE_SPECIES"
    algorithm: threshold
    formula: |
      For each TemperatureLog of the lot: if avg_temp_c > ABUSE_THRESHOLD_C,
      minutes = (interval_end - interval_start) in whole minutes, else 0.
      cumulative_abuse_minutes = sum(minutes). On crossing: if
      cumulative_abuse_minutes >= ABUSE_LIMIT_MIN and the lot is not already
      quarantined/rejected: auto-create CorrectiveAction (source_type
      TEMPERATURE_ABUSE, opened_by := request X-User-ID) and transition lot
      UNDER_INSPECTION|ACCEPTED -> QUARANTINED; supplier counters and risk
      recompute as in histamine_verdict. Boundary: exactly 240 blocks accept
      (>= is over the limit).
    input_set: "all TemperatureLog rows with receipt_lot_id == lot.id, ordered by interval_start ASC (tie: created_at ASC)"
    constants:
      ABUSE_THRESHOLD_C: 4.4
      ABUSE_LIMIT_MIN: 240
      HISTAMINE_SUSCEPTIBLE_SPECIES: ["TUNA", "MAHI_MAHI", "MACKEREL", "SARDINE", "ANCHOVY", "BLUEFISH"]
    precision: "whole minutes"

  - name: supplier_risk_score
    trigger: "on SupplierEvaluation create, on CorrectiveAction open/resolve/reopen/escalate, on species mismatch, on HACCP deviation"
    algorithm: weighted_scoring
    formula: |
      eval_component = 100 - latest_evaluation.overall_score   (0 until first evaluation; score null before that)
      open_penalty = min(open_corrective_action_count * 10, 100)
      history_penalty = min(total_species_mismatches * 25 + total_haccp_deviations * 15, 100)
      risk_score = round(W_EVAL * eval_component + W_OPEN * open_penalty + W_HISTORY * history_penalty, 2)  # round_half_up
      risk_tier: risk_score < 30 -> LOW; 30 <= risk_score < 70 -> MODERATE; risk_score >= 70 -> HIGH
      Tier interval for next_evaluation_due: LOW 36 months, MODERATE 12 months, HIGH 3 months.
      Boundary: exactly 70.00 is HIGH; exactly 30.00 is MODERATE.
    input_set: "the supplier's latest SupplierEvaluation (by period_end, tie: created_at ASC), its CA counters and lifetime deviation counters"
    constants:
      W_EVAL: 0.40
      W_OPEN: 0.30
      W_HISTORY: 0.30
      TIER_LOW_MAX: 30.0
      TIER_MODERATE_MAX: 70.0
      LOW_INTERVAL_MONTHS: 36
      MODERATE_INTERVAL_MONTHS: 12
      HIGH_INTERVAL_MONTHS: 3
    precision: "2 decimal places, round_half_up"

  - name: entry_cost_allocation
    trigger: "on ImportEntry -> RELEASED, on ReceiptLot -> ACCEPTED, on ReceiptLot ACCEPTED -> QUARANTINED, on ReceiptLot QUARANTINED -> ACCEPTED"
    algorithm: waterfall_allocation
    formula: |
      allocatable_total_cents = goods_value_cents + freight_cost_cents + duty_cents  (computed at RELEASE)
      Eligible set: this entry's ReceiptLot rows with status == ACCEPTED.
      For each eligible lot: share_i = quantity_accepted_kg / sum(quantity_accepted_kg of eligible lots)
        floor_i = floor(allocatable_total_cents * share_i)
      remainder = allocatable_total_cents - sum(floor_i)
      Distribute +1 cent to the first `remainder` lots ordered by:
        share_i DESC, tie: quantity_accepted_kg DESC, tie: created_at ASC   (never id)
      allocated_cost_cents := floor_i (+1 if selected). Re-runs fully recompute;
      the eligible set changing (quarantine/release/accept) re-allocates the SAME
      total over the new set.
      Invariant: sum(allocated_cost_cents over eligible lots) == allocatable_total_cents.
      If the eligible set is empty, all allocations are 0.
    input_set: "ReceiptLot rows of the entry with status == ACCEPTED"
    constants: {}
    precision: "integer cents; shares computed at full precision, floor for base allocation"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins when a
# request violates several rules)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a known role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is listed in the endpoint's roles", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path resource ids exist, validated left-to-right", error_id: "ERR_*_NOT_FOUND (resource-specific)", http_status: 404, applies_to: "all" }
  - { priority: 4, category: existence, check: "body-referenced FK ids exist (supplier_id, import_entry_id, receipt_lot_id, processing_batch_id, product_label_id, scope_lot_ids members)", error_id: "ERR_*_NOT_FOUND (resource-specific)", http_status: 404, applies_to: "create/action endpoints with FK payloads" }
  - { priority: 5, category: business_constraint, check: "required fields present, types correct, enum membership, numeric ranges (quantity > 0, scores 0-100, ice_deduction_pct 0-50, subsample_values >= 3 for CONFIRMATORY, scope_lot_ids non-empty)", error_id: ERR_VALIDATION_FAILED, http_status: 400, applies_to: "all write endpoints" }
  - { priority: 6, category: state, check: "target resource is in a from-state of the requested transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: state, check: "receipt creation requires import entry status == RELEASED", error_id: ERR_ENTRY_NOT_RELEASED, http_status: 409, applies_to: ["POST /seafood/receipt-lots"] }
  - { priority: 8, category: state, check: "batch input requires lot.status == ACCEPTED", error_id: ERR_LOT_NOT_ACCEPTED, http_status: 409, applies_to: ["POST /seafood/processing-batches/{id}/inputs"] }
  - { priority: 9, category: business_safety, check: "HISTAMINE-susceptible lot accept requires an existing PASS HISTAMINE record for the lot", error_id: ERR_HISTAMINE_CRITICAL_LIMIT, http_status: 422, applies_to: ["POST /seafood/receipt-lots/{id}/accept"] }
  - { priority: 10, category: business_safety, check: "accept requires cumulative_abuse_minutes < 240", error_id: ERR_TEMPERATURE_ABUSE_EXCEEDED, http_status: 422, applies_to: ["POST /seafood/receipt-lots/{id}/accept"] }
  - { priority: 11, category: business_safety, check: "accept with freeze_protocol != NONE requires freeze_compliant == true", error_id: ERR_FREEZE_PROTOCOL_NOT_MET, http_status: 422, applies_to: ["POST /seafood/receipt-lots/{id}/accept"] }
  - { priority: 12, category: business_safety, check: "batch input species check: (lot.species_verified if set else lot.species_declared) must equal batch.target_species", error_id: ERR_SPECIES_MISMATCH, http_status: 422, applies_to: ["POST /seafood/processing-batches/{id}/inputs"] }
  - { priority: 13, category: business_referential, check: "file-prior-notice and file-entry require supplier.fsvp_status == APPROVED at time of call", error_id: ERR_SUPPLIER_NOT_APPROVED, http_status: 422, applies_to: ["POST /seafood/import-entries/{id}/file-prior-notice", "POST /seafood/import-entries/{id}/file-entry"] }
  - { priority: 14, category: business_referential, check: "apply-label requires label.status == APPROVED", error_id: ERR_LABEL_NOT_APPROVED, http_status: 409, applies_to: ["POST /seafood/finished-product-lots/{id}/apply-label"] }
  - { priority: 15, category: business_referential, check: "release requires lot.label_stale == false", error_id: ERR_LABEL_STALE, http_status: 409, applies_to: ["POST /seafood/finished-product-lots/{id}/release"] }
  - { priority: 16, category: business_referential, check: "release and quarantine-release require no OPEN/INVESTIGATING CorrectiveAction linked to the batch (release) or the lot (quarantine-release); lot accept also requires no open lot-linked CA", error_id: ERR_OPEN_CORRECTIVE_ACTIONS, http_status: 422, applies_to: ["POST /seafood/finished-product-lots/{id}/release", "POST /seafood/receipt-lots/{id}/quarantine-release", "POST /seafood/receipt-lots/{id}/accept"] }
  - { priority: 17, category: business_temporal, check: "prior notice must be filed with current_utc <= scheduled_arrival - lead hours (VESSEL 8h, AIR 4h, ROAD 2h); equality passes", error_id: ERR_PRIOR_NOTICE_WINDOW_MISSED, http_status: 422, applies_to: ["POST /seafood/import-entries/{id}/file-prior-notice"] }
  - { priority: 18, category: business_temporal, check: "SupplierEvaluation coverage windows are CLOSED intervals [period_start, period_end]; a new evaluation whose period intersects any existing evaluation's period for the same supplier (shared boundary day counts as overlap) is rejected", error_id: ERR_EVALUATION_PERIOD_OVERLAP, http_status: 422, applies_to: ["POST /seafood/supplier-evaluations"] }
  - { priority: 19, category: business_temporal, check: "TemperatureLog intervals per subject are HALF-OPEN [start, end); a new interval overlapping an existing one for the same subject is rejected, but adjacency (new start == existing end) is allowed", error_id: ERR_TEMPERATURE_INTERVAL_OVERLAP, http_status: 422, applies_to: ["POST /seafood/temperature-logs"] }
  - { priority: 20, category: business_constraint, check: "batch input quantity_kg <= lot.remaining_kg", error_id: ERR_INSUFFICIENT_LOT_REMAINING, http_status: 422, applies_to: ["POST /seafood/processing-batches/{id}/inputs"] }
  - { priority: 21, category: business_constraint, check: "complete requires >= 1 input row", error_id: ERR_BATCH_HAS_NO_INPUTS, http_status: 422, applies_to: ["POST /seafood/processing-batches/{id}/complete"] }
  - { priority: 22, category: business_constraint, check: "reconcile requires input_total_kg == actual_output_kg + trim_waste_kg + other_waste_kg (exact, 3 decimals)", error_id: ERR_MASS_IMBALANCE, http_status: 422, applies_to: ["POST /seafood/processing-batches/{id}/reconcile"] }
  - { priority: 23, category: business_constraint, check: "reconcile with |yield_variance_pct| > 5.0 requires a RESOLVED YIELD_VARIANCE CorrectiveAction for the batch", error_id: ERR_YIELD_VARIANCE_EXCEEDED, http_status: 422, applies_to: ["POST /seafood/processing-batches/{id}/reconcile"] }
  - { priority: 24, category: business_constraint, check: "sum of net_weight_kg over a batch's finished lots must be <= batch.actual_output_kg (equality allowed)", error_id: ERR_FINISHED_WEIGHT_EXCEEDS_OUTPUT, http_status: 422, applies_to: ["POST /seafood/finished-product-lots"] }
  - { priority: 25, category: business_constraint, check: "resolve requires caller X-User-ID != ca.opened_by (segregation of duties)", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: ["POST /seafood/corrective-actions/{id}/resolve"] }
  - { priority: 26, category: business_constraint, check: "exactly one of receipt_lot_id / processing_batch_id set on temperature-logs; hazard-subject pairing (HISTAMINE -> lot only, PARASITE -> batch only) on monitoring records", error_id: ERR_AMBIGUOUS_SUBJECT, http_status: 400, applies_to: ["POST /seafood/temperature-logs", "POST /seafood/haccp-monitoring-records"] }
  - { priority: 27, category: state, check: "OCC: expected_batch_version == batch.version (complete); expected_supplier_version == supplier.version (create evaluation)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /seafood/processing-batches/{id}/complete", "POST /seafood/supplier-evaluations"] }
  - { priority: 28, category: business_constraint, check: "POST /seafood/corrective-actions requires source_type == MANUAL and at least one of receipt_lot_id / processing_batch_id", error_id: ERR_VALIDATION_FAILED, http_status: 400, applies_to: ["POST /seafood/corrective-actions"] }
  - { priority: 29, category: business_referential, check: "accept and quarantine-release require a SpeciesVerification for the lot with status CONFIRMED or RESOLVED_RELABELED", error_id: ERR_VERIFICATION_REQUIRED, http_status: 422, applies_to: ["POST /seafood/receipt-lots/{id}/accept", "POST /seafood/receipt-lots/{id}/quarantine-release"] }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Foreign suppliers & FSVP ---
  - method: POST
    path: "/seafood/suppliers"
    description: "Register a foreign supplier (starts PENDING_EVALUATION)"
    roles: [ComplianceManager]
    code: 201
    input: [legal_name, country_code, facility_registration_number, "handles_histamine_susceptible_species?"]
    output: ForeignSupplier
    side_effects: ["fsvp_status := PENDING_EVALUATION", "counters zeroed", "version := 1"]
  - method: GET
    path: "/seafood/suppliers/{id}"
    description: "Fetch one supplier with computed risk fields"
    roles: [ImportCoordinator, ReceivingInspector, QualityAssuranceTech, ProcessingSupervisor, ComplianceManager]
    code: 200
    input: []
    output: ForeignSupplier
    side_effects: []
  - method: POST
    path: "/seafood/suppliers/{id}/suspend"
    description: "Suspend an APPROVED supplier (blocks new prior notices / entry filings)"
    roles: [ComplianceManager]
    code: 200
    input: []
    output: ForeignSupplier
    side_effects: ["fsvp_status APPROVED -> SUSPENDED", "increments ForeignSupplier.version by 1"]
  - method: POST
    path: "/seafood/supplier-evaluations"
    description: "Record a periodic FSVP evaluation; drives supplier posture transitions (OCC on supplier version)"
    roles: [ComplianceManager]
    code: 201
    input: [supplier_id, expected_supplier_version, period_start, period_end, hazard_analysis_score, record_review_score, performance_score]
    output: SupplierEvaluation
    side_effects: ["computes overall_score and outcome", "applies the matching ForeignSupplier transition", "recomputes supplier risk_score/risk_tier/next_evaluation_due", "increments ForeignSupplier.version by 1"]
  - method: GET
    path: "/seafood/supplier-evaluations/{id}"
    description: "Fetch one evaluation"
    roles: [ImportCoordinator, ReceivingInspector, QualityAssuranceTech, ProcessingSupervisor, ComplianceManager]
    code: 200
    input: []
    output: SupplierEvaluation
    side_effects: []
  - method: GET
    path: "/seafood/supplier-evaluations"
    description: "List evaluations; filter by supplier_id; paginated"
    roles: [ImportCoordinator, ReceivingInspector, QualityAssuranceTech, ProcessingSupervisor, ComplianceManager]
    code: 200
    input: ["supplier_id?", "limit?", "offset?"]
    output: SupplierEvaluation[]
    side_effects: []

  # --- Import entries & FDA prior notice ---
  - method: POST
    path: "/seafood/import-entries"
    description: "Create an import entry in DRAFT"
    roles: [ImportCoordinator]
    code: 201
    input: [supplier_id, entry_number, species_declared, transport_mode, scheduled_arrival, port_code, goods_value_cents, freight_cost_cents, duty_rate_pct, total_weight_kg]
    output: ImportEntry
    side_effects: ["status := DRAFT", "version := 1"]
  - method: GET
    path: "/seafood/import-entries/{id}"
    description: "Fetch one entry with computed duty/allocation totals"
    roles: [ImportCoordinator, ReceivingInspector, QualityAssuranceTech, ProcessingSupervisor, ComplianceManager]
    code: 200
    input: []
    output: ImportEntry
    side_effects: []
  - method: GET
    path: "/seafood/import-entries"
    description: "List entries; filter by supplier_id and/or status; paginated"
    roles: [ImportCoordinator, ReceivingInspector, QualityAssuranceTech, ProcessingSupervisor, ComplianceManager]
    code: 200
    input: ["supplier_id?", "status?", "limit?", "offset?"]
    output: ImportEntry[]
    side_effects: []
  - method: POST
    path: "/seafood/import-entries/{id}/file-prior-notice"
    description: "File FDA prior notice (supplier must be APPROVED; lead-time window enforced; equality passes)"
    roles: [ImportCoordinator]
    code: 200
    input: []
    output: ImportEntry
    side_effects: ["status DRAFT -> PRIOR_NOTICE_FILED", "mints prior_notice_confirmation", "increments ImportEntry.version by 1"]
  - method: POST
    path: "/seafood/import-entries/{id}/file-entry"
    description: "File the customs entry summary (supplier approval re-checked)"
    roles: [ImportCoordinator]
    code: 200
    input: []
    output: ImportEntry
    side_effects: ["status PRIOR_NOTICE_FILED -> ENTRY_FILED", "increments ImportEntry.version by 1"]
  - method: POST
    path: "/seafood/import-entries/{id}/fda-disposition"
    description: "Record FDA disposition: RELEASED | DETAINED | REFUSED (DETAINED may later be RELEASED or REFUSED)"
    roles: [ImportCoordinator]
    code: 200
    input: [outcome]
    output: ImportEntry
    side_effects: ["status transition per outcome", "on RELEASED: computes duty_cents + allocatable_total_cents and runs entry_cost_allocation", "increments ImportEntry.version by 1"]

  # --- Receipt lots & catch documentation ---
  - method: POST
    path: "/seafood/receipt-lots"
    description: "Receive a raw-material lot against a RELEASED entry (catch documentation captured)"
    roles: [ReceivingInspector]
    code: 201
    input: [import_entry_id, vessel_name, harvest_date, catch_area_code, harvest_country_code, production_method, species_declared, grade, quantity_received_kg, "ice_deduction_pct?", receiving_temp_c, "freeze_protocol?"]
    output: ReceiptLot
    side_effects: ["status := UNDER_INSPECTION", "computes quantity_accepted_kg and remaining_kg", "version := 1"]
  - method: GET
    path: "/seafood/receipt-lots/{id}"
    description: "Fetch one lot with computed cold-chain/yield/allocation fields"
    roles: [ImportCoordinator, ReceivingInspector, QualityAssuranceTech, ProcessingSupervisor, ComplianceManager]
    code: 200
    input: []
    output: ReceiptLot
    side_effects: []
  - method: GET
    path: "/seafood/receipt-lots"
    description: "List lots; filter by import_entry_id and/or status; paginated"
    roles: [ImportCoordinator, ReceivingInspector, QualityAssuranceTech, ProcessingSupervisor, ComplianceManager]
    code: 200
    input: ["import_entry_id?", "status?", "limit?", "offset?"]
    output: ReceiptLot[]
    side_effects: []
  - method: POST
    path: "/seafood/receipt-lots/{id}/accept"
    description: "Accept a lot after inspection (verification, histamine, abuse, freeze, open-CA gates)"
    roles: [ReceivingInspector]
    code: 200
    input: []
    output: ReceiptLot
    side_effects: ["status UNDER_INSPECTION -> ACCEPTED", "runs entry_cost_allocation", "increments ReceiptLot.version by 1"]
  - method: POST
    path: "/seafood/receipt-lots/{id}/reject"
    description: "Reject a lot (UNDER_INSPECTION or QUARANTINED -> REJECTED)"
    roles: [ReceivingInspector]
    code: 200
    input: [reason]
    output: ReceiptLot
    side_effects: ["status -> REJECTED", "increments ReceiptLot.version by 1"]
  - method: POST
    path: "/seafood/receipt-lots/{id}/quarantine"
    description: "Place a hold on a lot (UNDER_INSPECTION or ACCEPTED -> QUARANTINED)"
    roles: [QualityAssuranceTech]
    code: 200
    input: [reason]
    output: ReceiptLot
    side_effects: ["status -> QUARANTINED", "if previously ACCEPTED: runs entry_cost_allocation with lot excluded", "increments ReceiptLot.version by 1"]
  - method: POST
    path: "/seafood/receipt-lots/{id}/quarantine-release"
    description: "Release a quarantined lot to ACCEPTED (requires all linked CAs resolved)"
    roles: [ComplianceManager]
    code: 200
    input: []
    output: ReceiptLot
    side_effects: ["status QUARANTINED -> ACCEPTED", "runs entry_cost_allocation with lot re-included", "increments ReceiptLot.version by 1"]

  # --- Species verification & mislabeling ---
  - method: POST
    path: "/seafood/species-verifications"
    description: "Record a species verification result; mismatch cascades to quarantine + corrective action"
    roles: [ReceivingInspector]
    code: 201
    input: [receipt_lot_id, test_method, sample_size, verified_species]
    output: SpeciesVerification
    side_effects: ["computes is_match", "CONFIRMED: sets lot.species_verified", "MISMATCH: lot -> QUARANTINED, auto-creates CorrectiveAction, supplier counters + risk recompute (3-link cascade)"]
  - method: GET
    path: "/seafood/species-verifications/{id}"
    description: "Fetch one verification"
    roles: [ImportCoordinator, ReceivingInspector, QualityAssuranceTech, ProcessingSupervisor, ComplianceManager]
    code: 200
    input: []
    output: SpeciesVerification
    side_effects: []
  - method: GET
    path: "/seafood/species-verifications"
    description: "List verifications; filter by receipt_lot_id; paginated"
    roles: [ImportCoordinator, ReceivingInspector, QualityAssuranceTech, ProcessingSupervisor, ComplianceManager]
    code: 200
    input: ["receipt_lot_id?", "limit?", "offset?"]
    output: SpeciesVerification[]
    side_effects: []
  - method: POST
    path: "/seafood/species-verifications/{id}/resolve"
    description: "Resolve a mismatch: RELABEL_AS_VERIFIED (relabel lot to verified species) or REJECT_LOT"
    roles: [QualityAssuranceTech]
    code: 200
    input: [resolution]
    output: SpeciesVerification
    side_effects: ["RELABEL_AS_VERIFIED: lot.species_declared := verified_species, species_verified set, mislabel_flag := true", "REJECT_LOT: lot -> REJECTED"]

  # --- Processing batches, inputs, yield ---
  - method: POST
    path: "/seafood/processing-batches"
    description: "Open a processing batch (starts IN_PROCESS)"
    roles: [ProcessingSupervisor]
    code: 201
    input: [target_species, product_form]
    output: ProcessingBatch
    side_effects: ["status := IN_PROCESS", "version := 1"]
  - method: GET
    path: "/seafood/processing-batches/{id}"
    description: "Fetch one batch with computed yield fields"
    roles: [ImportCoordinator, ReceivingInspector, QualityAssuranceTech, ProcessingSupervisor, ComplianceManager]
    code: 200
    input: []
    output: ProcessingBatch
    side_effects: []
  - method: POST
    path: "/seafood/processing-batches/{id}/inputs"
    description: "Consume kg from an ACCEPTED lot into the batch (species gate, remaining-kg gate)"
    roles: [ProcessingSupervisor]
    code: 201
    input: [receipt_lot_id, quantity_kg]
    output: BatchInputLot
    side_effects: ["lot.consumed_kg += quantity_kg; lot.remaining_kg recomputed", "if remaining_kg == 0: lot ACCEPTED -> CONSUMED", "recomputes batch input_total_kg and provisional_output_kg", "increments ReceiptLot.version by 1", "increments ProcessingBatch.version by 1"]
  - method: DELETE
    path: "/seafood/batch-input-lots/{id}"
    description: "Remove a batch input (compensating action; restores lot remaining_kg; allowed while batch IN_PROCESS)"
    roles: [ProcessingSupervisor]
    code: 200
    input: []
    output: BatchInputLot
    side_effects: ["lot.consumed_kg -= quantity_kg", "if lot was CONSUMED and remaining_kg > 0: lot CONSUMED -> ACCEPTED", "recomputes batch totals", "increments ReceiptLot.version by 1", "increments ProcessingBatch.version by 1"]
  - method: GET
    path: "/seafood/batch-input-lots/{id}"
    description: "Fetch one batch input row"
    roles: [ImportCoordinator, ReceivingInspector, QualityAssuranceTech, ProcessingSupervisor, ComplianceManager]
    code: 200
    input: []
    output: BatchInputLot
    side_effects: []
  - method: GET
    path: "/seafood/batch-input-lots"
    description: "List batch input rows; filter by processing_batch_id and/or receipt_lot_id; paginated"
    roles: [ImportCoordinator, ReceivingInspector, QualityAssuranceTech, ProcessingSupervisor, ComplianceManager]
    code: 200
    input: ["processing_batch_id?", "receipt_lot_id?", "limit?", "offset?"]
    output: BatchInputLot[]
    side_effects: []
  - method: POST
    path: "/seafood/processing-batches/{id}/complete"
    description: "Complete the batch with measured output/waste (OCC on batch version)"
    roles: [ProcessingSupervisor]
    code: 200
    input: [expected_batch_version, actual_output_kg, trim_waste_kg, other_waste_kg]
    output: ProcessingBatch
    side_effects: ["computes provisional vs final yield + variance", "auto-creates YIELD_VARIANCE CorrectiveAction when |variance| > 5.0", "increments ProcessingBatch.version by 1"]
  - method: POST
    path: "/seafood/processing-batches/{id}/reopen"
    description: "Reopen a COMPLETED batch for rework (blocked once any finished lot is RELEASED/RECALLED)"
    roles: [ProcessingSupervisor]
    code: 200
    input: []
    output: ProcessingBatch
    side_effects: ["status COMPLETED -> IN_PROCESS", "increments ProcessingBatch.version by 1"]
  - method: POST
    path: "/seafood/processing-batches/{id}/reconcile"
    description: "Lock the batch (mass balance + variance gates)"
    roles: [ProcessingSupervisor]
    code: 200
    input: []
    output: ProcessingBatch
    side_effects: ["status COMPLETED -> RECONCILED", "increments ProcessingBatch.version by 1"]

  # --- Cold chain / freezing records ---
  - method: POST
    path: "/seafood/temperature-logs"
    description: "Append a temperature interval (exactly one subject; half-open overlap rule; recomputes freeze/abuse accumulations)"
    roles: [ReceivingInspector, QualityAssuranceTech]
    code: 201
    input: ["receipt_lot_id?", "processing_batch_id?", interval_start, interval_end, core_temp_c, avg_temp_c, source]
    output: TemperatureLog
    side_effects: ["recomputes lot.cumulative_abuse_minutes; on crossing >= 240 auto-creates TEMPERATURE_ABUSE CA and quarantines lot", "recomputes lot.freeze_compliant per freeze_protocol_compliance"]
  - method: GET
    path: "/seafood/temperature-logs/{id}"
    description: "Fetch one temperature log"
    roles: [ImportCoordinator, ReceivingInspector, QualityAssuranceTech, ProcessingSupervisor, ComplianceManager]
    code: 200
    input: []
    output: TemperatureLog
    side_effects: []
  - method: GET
    path: "/seafood/temperature-logs"
    description: "List temperature logs; filter by receipt_lot_id and/or processing_batch_id; paginated"
    roles: [ImportCoordinator, ReceivingInspector, QualityAssuranceTech, ProcessingSupervisor, ComplianceManager]
    code: 200
    input: ["receipt_lot_id?", "processing_batch_id?", "limit?", "offset?"]
    output: TemperatureLog[]
    side_effects: []

  # --- HACCP monitoring ---
  - method: POST
    path: "/seafood/haccp-monitoring-records"
    description: "Record a CCP monitoring result (HISTAMINE on lots, PARASITE on batches); DEVIATION auto-creates CA and quarantines lot"
    roles: [QualityAssuranceTech]
    code: 201
    input: [hazard_type, "receipt_lot_id?", "processing_batch_id?", phase, "measured_value?", "subsample_values?", measured_at]
    output: HaccpMonitoringRecord
    side_effects: ["computes verdict per histamine_verdict (PARASITE: DEVIATION iff measured_value >= 1)", "on DEVIATION: auto-creates CorrectiveAction (opened_by := request X-User-ID); lot UNDER_INSPECTION|ACCEPTED -> QUARANTINED; supplier counters + risk recompute"]
  - method: GET
    path: "/seafood/haccp-monitoring-records/{id}"
    description: "Fetch one monitoring record"
    roles: [ImportCoordinator, ReceivingInspector, QualityAssuranceTech, ProcessingSupervisor, ComplianceManager]
    code: 200
    input: []
    output: HaccpMonitoringRecord
    side_effects: []
  - method: GET
    path: "/seafood/haccp-monitoring-records"
    description: "List monitoring records; filter by receipt_lot_id, processing_batch_id, hazard_type, corrective_action_id; paginated"
    roles: [ImportCoordinator, ReceivingInspector, QualityAssuranceTech, ProcessingSupervisor, ComplianceManager]
    code: 200
    input: ["receipt_lot_id?", "processing_batch_id?", "hazard_type?", "corrective_action_id?", "limit?", "offset?"]
    output: HaccpMonitoringRecord[]
    side_effects: []

  # --- Corrective actions ---
  - method: POST
    path: "/seafood/corrective-actions"
    description: "Manually open a corrective action (compliance audit finding); source_type must be MANUAL; at least one of receipt_lot_id / processing_batch_id required"
    roles: [ComplianceManager]
    code: 201
    input: [source_type, "receipt_lot_id?", "processing_batch_id?", reason]
    output: CorrectiveAction
    side_effects: ["status := OPEN", "opened_by := request X-User-ID", "supplier_id traced via lot.import_entry_id when lot-linked", "if supplier-linked: supplier.open_corrective_action_count += 1 and risk recompute", "version := 1"]
  - method: GET
    path: "/seafood/corrective-actions/{id}"
    description: "Fetch one corrective action"
    roles: [ImportCoordinator, ReceivingInspector, QualityAssuranceTech, ProcessingSupervisor, ComplianceManager]
    code: 200
    input: []
    output: CorrectiveAction
    side_effects: []
  - method: GET
    path: "/seafood/corrective-actions"
    description: "List corrective actions; filter by supplier_id, receipt_lot_id, processing_batch_id, monitoring_record_id, recall_id, status; paginated"
    roles: [ImportCoordinator, ReceivingInspector, QualityAssuranceTech, ProcessingSupervisor, ComplianceManager]
    code: 200
    input: ["supplier_id?", "receipt_lot_id?", "processing_batch_id?", "monitoring_record_id?", "recall_id?", "status?", "limit?", "offset?"]
    output: CorrectiveAction[]
    side_effects: []
  - method: POST
    path: "/seafood/corrective-actions/{id}/investigate"
    description: "Move OPEN -> INVESTIGATING; also reopens RESOLVED -> INVESTIGATING (re-audit)"
    roles: [ComplianceManager]
    code: 200
    input: []
    output: CorrectiveAction
    side_effects: ["status transition", "on reopen from RESOLVED: supplier.open_corrective_action_count += 1 and risk recompute", "increments CorrectiveAction.version by 1"]
  - method: POST
    path: "/seafood/corrective-actions/{id}/resolve"
    description: "Resolve an INVESTIGATING CA; resolver must differ from opened_by (segregation of duties)"
    roles: [ComplianceManager]
    code: 200
    input: [resolution_note]
    output: CorrectiveAction
    side_effects: ["status INVESTIGATING -> RESOLVED", "closed_by := request X-User-ID", "supplier.open_corrective_action_count -= 1 and risk recompute when supplier-linked", "increments CorrectiveAction.version by 1"]
  - method: POST
    path: "/seafood/corrective-actions/{id}/escalate"
    description: "Escalate a CA to a recall: creates Recall (INITIATED) and recalls all in-scope finished lots"
    roles: [ComplianceManager]
    code: 200
    input: [reason, scope_lot_ids]
    output: CorrectiveAction
    side_effects: ["creates Recall; ca.recall_id set", "every in-scope FinishedProductLot -> RECALLED", "supplier.open_corrective_action_count -= 1 when supplier-linked", "increments CorrectiveAction.version by 1"]

  # --- Labeling (allergen + COOL) ---
  - method: POST
    path: "/seafood/product-labels"
    description: "Draft a product label (allergen statement computed)"
    roles: [ComplianceManager]
    code: 201
    input: [market_name, scientific_name, species, production_method, country_of_origin, "keep_frozen_statement?", "supersedes_label_id?"]
    output: ProductLabel
    side_effects: ["status := DRAFT", "allergen_statement := 'Contains: Fish (<market_name>)'", "version := 1"]
  - method: GET
    path: "/seafood/product-labels/{id}"
    description: "Fetch one label"
    roles: [ImportCoordinator, ReceivingInspector, QualityAssuranceTech, ProcessingSupervisor, ComplianceManager]
    code: 200
    input: []
    output: ProductLabel
    side_effects: []
  - method: GET
    path: "/seafood/product-labels"
    description: "List labels; filter by supersedes_label_id and/or status; paginated"
    roles: [ImportCoordinator, ReceivingInspector, QualityAssuranceTech, ProcessingSupervisor, ComplianceManager]
    code: 200
    input: ["supersedes_label_id?", "status?", "limit?", "offset?"]
    output: ProductLabel[]
    side_effects: []
  - method: POST
    path: "/seafood/product-labels/{id}/approve"
    description: "Approve a DRAFT label; supersedes the referenced label and marks pinned lots stale"
    roles: [ComplianceManager]
    code: 200
    input: []
    output: ProductLabel
    side_effects: ["status DRAFT -> APPROVED", "approved_at := current_utc", "superseded label -> SUPERSEDED", "lots pinned to superseded label: label_stale := true"]

  # --- Finished product lots ---
  - method: POST
    path: "/seafood/finished-product-lots"
    description: "Create a packed finished lot from a COMPLETED/RECONCILED batch (aggregate net-weight gate)"
    roles: [ProcessingSupervisor]
    code: 201
    input: [processing_batch_id, net_weight_kg]
    output: FinishedProductLot
    side_effects: ["status := UNLABELED", "version := 1"]
  - method: GET
    path: "/seafood/finished-product-lots/{id}"
    description: "Fetch one finished lot"
    roles: [ImportCoordinator, ReceivingInspector, QualityAssuranceTech, ProcessingSupervisor, ComplianceManager]
    code: 200
    input: []
    output: FinishedProductLot
    side_effects: []
  - method: GET
    path: "/seafood/finished-product-lots"
    description: "List finished lots; filter by processing_batch_id, product_label_id, status; paginated"
    roles: [ImportCoordinator, ReceivingInspector, QualityAssuranceTech, ProcessingSupervisor, ComplianceManager]
    code: 200
    input: ["processing_batch_id?", "product_label_id?", "status?", "limit?", "offset?"]
    output: FinishedProductLot[]
    side_effects: []
  - method: POST
    path: "/seafood/finished-product-lots/{id}/apply-label"
    description: "Apply (or re-apply) an APPROVED label; pins the label version and computes allergen/COO"
    roles: [ProcessingSupervisor]
    code: 200
    input: [product_label_id]
    output: FinishedProductLot
    side_effects: ["status -> LABELED", "pins label_version_pinned := label.version", "computes country_of_origin from batch input lots", "increments FinishedProductLot.version by 1"]
  - method: POST
    path: "/seafood/finished-product-lots/{id}/release"
    description: "Release a labeled lot for commerce (batch reconciled, label fresh, no open batch CA)"
    roles: [ComplianceManager]
    code: 200
    input: []
    output: FinishedProductLot
    side_effects: ["status LABELED -> RELEASED", "released_at := current_utc", "increments FinishedProductLot.version by 1"]

  # --- Recalls ---
  - method: GET
    path: "/seafood/recalls/{id}"
    description: "Fetch one recall"
    roles: [ImportCoordinator, ReceivingInspector, QualityAssuranceTech, ProcessingSupervisor, ComplianceManager]
    code: 200
    input: []
    output: Recall
    side_effects: []
  - method: GET
    path: "/seafood/recalls"
    description: "List recalls; filter by corrective_action_id; paginated"
    roles: [ImportCoordinator, ReceivingInspector, QualityAssuranceTech, ProcessingSupervisor, ComplianceManager]
    code: 200
    input: ["corrective_action_id?", "limit?", "offset?"]
    output: Recall[]
    side_effects: []
  - method: POST
    path: "/seafood/recalls/{id}/notify"
    description: "Mark the recall as notified (terminal)"
    roles: [ComplianceManager]
    code: 200
    input: []
    output: Recall
    side_effects: ["status INITIATED -> NOTIFIED", "notified_at := current_utc", "increments Recall.version by 1"]

  # --- Test-driving endpoint (logical clock) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; the server MUST NOT fall back to wall-clock time. Sweep side effect: APPROVED suppliers whose next_evaluation_due <= current_utc transition to REEVALUATION_DUE."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["sets logical clock", "runs supplier re-evaluation-due sweep"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or role unknown" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Authenticated role not in the endpoint's allowed roles" }
  - { id: ERR_VALIDATION_FAILED, http: 400, condition: "Required field missing, type/enum/range violation (e.g. quantity <= 0, score > 100, CONFIRMATORY with < 3 subsamples, empty scope_lot_ids)" }
  - { id: ERR_SUPPLIER_NOT_FOUND, http: 404, condition: "Supplier id in path or body does not exist" }
  - { id: ERR_IMPORT_ENTRY_NOT_FOUND, http: 404, condition: "Import entry id does not exist" }
  - { id: ERR_RECEIPT_LOT_NOT_FOUND, http: 404, condition: "Receipt lot id does not exist" }
  - { id: ERR_PROCESSING_BATCH_NOT_FOUND, http: 404, condition: "Processing batch id does not exist" }
  - { id: ERR_BATCH_INPUT_NOT_FOUND, http: 404, condition: "Batch input row id does not exist" }
  - { id: ERR_SPECIES_VERIFICATION_NOT_FOUND, http: 404, condition: "Species verification id does not exist" }
  - { id: ERR_PRODUCT_LABEL_NOT_FOUND, http: 404, condition: "Product label id does not exist" }
  - { id: ERR_FINISHED_LOT_NOT_FOUND, http: 404, condition: "Finished product lot id does not exist (including members of scope_lot_ids)" }
  - { id: ERR_CORRECTIVE_ACTION_NOT_FOUND, http: 404, condition: "Corrective action id does not exist" }
  - { id: ERR_RECALL_NOT_FOUND, http: 404, condition: "Recall id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a from-state of the requested transition (incl. terminal-state lockdown and batch-not-RECONCILED on release)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC mismatch: expected_batch_version != batch.version or expected_supplier_version != supplier.version" }
  - { id: ERR_ENTRY_NOT_RELEASED, http: 409, condition: "Receipt creation against an entry whose status is not RELEASED" }
  - { id: ERR_LOT_NOT_ACCEPTED, http: 409, condition: "Batch input referencing a lot whose status is not ACCEPTED" }
  - { id: ERR_SUPPLIER_NOT_APPROVED, http: 422, condition: "Prior notice or entry filing while supplier.fsvp_status != APPROVED" }
  - { id: ERR_PRIOR_NOTICE_WINDOW_MISSED, http: 422, condition: "current_utc is after scheduled_arrival minus lead hours (VESSEL 8h, AIR 4h, ROAD 2h)" }
  - { id: ERR_EVALUATION_PERIOD_OVERLAP, http: 422, condition: "New evaluation's closed period intersects an existing evaluation's closed period for the same supplier (shared boundary day = overlap)" }
  - { id: ERR_TEMPERATURE_INTERVAL_OVERLAP, http: 422, condition: "New half-open temperature interval overlaps an existing interval for the same subject (adjacency allowed)" }
  - { id: ERR_AMBIGUOUS_SUBJECT, http: 400, condition: "Both or neither of receipt_lot_id / processing_batch_id set, or hazard_type paired with the wrong subject kind" }
  - { id: ERR_HISTAMINE_CRITICAL_LIMIT, http: 422, condition: "Accept of a histamine-susceptible lot without an existing PASS HISTAMINE record" }
  - { id: ERR_TEMPERATURE_ABUSE_EXCEEDED, http: 422, condition: "Accept with cumulative_abuse_minutes >= 240" }
  - { id: ERR_FREEZE_PROTOCOL_NOT_MET, http: 422, condition: "Accept with freeze_protocol != NONE while freeze_compliant is false" }
  - { id: ERR_SPECIES_MISMATCH, http: 422, condition: "Batch input whose lot species (verified if set, else declared) != batch.target_species" }
  - { id: ERR_LABEL_NOT_APPROVED, http: 409, condition: "apply-label referencing a label not in APPROVED status" }
  - { id: ERR_LABEL_STALE, http: 409, condition: "Release while lot.label_stale is true (pinned label version superseded)" }
  - { id: ERR_OPEN_CORRECTIVE_ACTIONS, http: 422, condition: "Release/quarantine-release/accept while an OPEN or INVESTIGATING CA is linked to the batch or lot" }
  - { id: ERR_VERIFICATION_REQUIRED, http: 422, condition: "Accept or quarantine-release without a CONFIRMED or RESOLVED_RELABELED species verification for the lot" }
  - { id: ERR_INSUFFICIENT_LOT_REMAINING, http: 422, condition: "Batch input quantity_kg > lot.remaining_kg" }
  - { id: ERR_BATCH_HAS_NO_INPUTS, http: 422, condition: "Complete a batch with zero input rows" }
  - { id: ERR_MASS_IMBALANCE, http: 422, condition: "Reconcile while input_total_kg != actual_output_kg + trim_waste_kg + other_waste_kg (exact at 3 decimals)" }
  - { id: ERR_YIELD_VARIANCE_EXCEEDED, http: 422, condition: "Reconcile with |yield_variance_pct| > 5.0 and no RESOLVED YIELD_VARIANCE CA for the batch" }
  - { id: ERR_FINISHED_WEIGHT_EXCEEDS_OUTPUT, http: 422, condition: "Sum of finished lots' net_weight_kg would exceed batch.actual_output_kg (equality allowed)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Resolve called by the same X-User-ID recorded as opened_by" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ImportCoordinator
    description: "FSVP importer of record's operations staff; files prior notice, entries, FDA dispositions"
    identity: opaque
    exclusive_operations:
      - "POST /seafood/import-entries"
      - "POST /seafood/import-entries/{id}/file-prior-notice"
      - "POST /seafood/import-entries/{id}/file-entry"
      - "POST /seafood/import-entries/{id}/fda-disposition"
    shared_operations: ["all GET endpoints"]
  - name: ReceivingInspector
    description: "Receiving dock inspector; captures catch documentation, accepts/rejects lots, records species verifications and receiving temperatures"
    identity: opaque
    exclusive_operations:
      - "POST /seafood/receipt-lots"
      - "POST /seafood/receipt-lots/{id}/accept"
      - "POST /seafood/receipt-lots/{id}/reject"
      - "POST /seafood/species-verifications"
    shared_operations: ["all GET endpoints", "POST /seafood/temperature-logs"]
  - name: QualityAssuranceTech
    description: "QA technician; HACCP monitoring records, quarantine holds, mismatch resolution, temperature logs"
    identity: opaque
    exclusive_operations:
      - "POST /seafood/haccp-monitoring-records"
      - "POST /seafood/receipt-lots/{id}/quarantine"
      - "POST /seafood/species-verifications/{id}/resolve"
    shared_operations: ["all GET endpoints", "POST /seafood/temperature-logs"]
  - name: ProcessingSupervisor
    description: "Processing floor supervisor; runs batches, inputs, completion, reconciliation, finished lots, label application"
    identity: opaque
    exclusive_operations:
      - "POST /seafood/processing-batches"
      - "POST /seafood/processing-batches/{id}/inputs"
      - "DELETE /seafood/batch-input-lots/{id}"
      - "POST /seafood/processing-batches/{id}/complete"
      - "POST /seafood/processing-batches/{id}/reopen"
      - "POST /seafood/processing-batches/{id}/reconcile"
      - "POST /seafood/finished-product-lots"
      - "POST /seafood/finished-product-lots/{id}/apply-label"
    shared_operations: ["all GET endpoints"]
  - name: ComplianceManager
    description: "Compliance manager; FSVP program, supplier posture, labels, corrective actions, recalls, regulatory release"
    identity: opaque
    exclusive_operations:
      - "POST /seafood/suppliers"
      - "POST /seafood/suppliers/{id}/suspend"
      - "POST /seafood/supplier-evaluations"
      - "POST /seafood/receipt-lots/{id}/quarantine-release"
      - "POST /seafood/corrective-actions"
      - "POST /seafood/corrective-actions/{id}/investigate"
      - "POST /seafood/corrective-actions/{id}/resolve"
      - "POST /seafood/corrective-actions/{id}/escalate"
      - "POST /seafood/product-labels"
      - "POST /seafood/product-labels/{id}/approve"
      - "POST /seafood/finished-product-lots/{id}/release"
      - "POST /seafood/recalls/{id}/notify"
    shared_operations: ["all GET endpoints"]
  - name: PlatformAdmin
    description: "Test-driving operator; logical clock only"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: []
