  - rule_id: non_linear_state_machine
    instances:
      - name: item_lifecycle_cycles_active_broken_consolidation_pending_active
        grounds:
          - state_machines[Item].transitions
          - calculations.assortment_health_derivation
          - calculations.assortment_remedy_selection
          - entities.Item.fields.lifecycle_state
          - entities.Item.fields.broken_store_count
        distinguishing_aspect: |
          The Item lifecycle is not a ladder: SKU-1001 is created ACTIVE, falls to BROKEN when position
          0101 opens with two empty CORE sizes, is driven to CONSOLIDATION_PENDING by an operator action,
          and returns to ACTIVE only when the consolidation transfer is physically RECEIVED and
          broken_store_count reaches 0 - so ACTIVE is entered twice by two different mechanisms while
          MARKDOWN, the only terminal state, is never touched.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE with stores 0101(A,URBAN,freight 41.00,sell-through 6500), 0102(B,URBAN,freight 38.00,5800), 0103(C,SUBURBAN,freight 42.00,4200)"
            - "Shelf plans effective 2026-07-01 open-ended: 0101 capacity 48 / pmin 12, 0102 capacity 24 / pmin 8, 0103 capacity 15 / pmin 8"
            - "SizeProfile TOP-4SZ = S 2000 / M 3500 / L 3000 / XL 1500 with core_size_min_share_bp 1500, so all four sizes are CORE; SKU-1001 retail 36.50"
            - "Positions: 0101 holds 4 units (S 0, M 3, L 1, XL 0) with min 12 / max 48 -> LOW + BROKEN; 0102 holds 30 units (S 8, M 10, L 8, XL 4) with min 8 / max 24 -> OVERSTOCK + COMPLETE; 0103 holds 5 units (S 1, M 2, L 1, XL 1) with min 4 / max 20 -> IN_STOCK + COMPLETE"
            - "No transfer or receipt exists yet; the only degraded position is 0101 (S and XL both at 0)"
