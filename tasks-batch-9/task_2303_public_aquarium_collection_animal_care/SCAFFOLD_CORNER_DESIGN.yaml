      - CollectionPlanEntry.status == DRAFT
      - CollectionPlanEntry.approved_by_user_id == null and CollectionPlanEntry.approved_at == null
      - CollectionPlanEntry.superseded_by_entry_id == null
      - CollectionPlanEntry.suspension_reason == null
      - CollectionPlanEntry.planned_count == 2 and CollectionPlanEntry.sustainability_requirement == GREEN_ONLY
