scaffold_corner_design:

  # =======================================================================
  # Section: entities — creation, retrieval, listing, not-found, defaults,
  # required fields, computed fields, type constraints
  # =======================================================================
  - section: entities
    instances:
      - name: contract_creation_required_fields_missing_rejected
        claim_type: required_fields
        grounds:
          - entities.OrchardContract
          - "endpoints.\"POST /cidery/contracts\""
        distinguishing_aspect: |
          POST /cidery/contracts missing required `season_year` (no default)
          must reject with a 400-class error. Other fields like
          shortfall_penalty_cents_per_lb have a default of 0 and may be
          omitted.
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cidery/contracts"
              payload: { grower_name: "NoYear", region_code: "NY", committed_weight_lbs: 1000, price_per_lb_cents: 80 }
              as: OrchardManager
              captures: { err: $.data.error_id }
          assert:
            - "err in {'ERR_INVALID_REQUEST','ERR_BAD_REQUEST','ERR_VALIDATION'}"

      - name: contract_creation_default_shortfall_penalty_applied
        claim_type: defaults
        grounds:
          - "entities.OrchardContract.fields.shortfall_penalty_cents_per_lb"
        distinguishing_aspect: |
          Omitting shortfall_penalty_cents_per_lb on POST /cidery/contracts
          yields default value 0 in the returned entity.
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cidery/contracts"
              payload: { grower_name: "DefTest", region_code: "NY", season_year: 2026, committed_weight_lbs: 5000, price_per_lb_cents: 80 }
              as: OrchardManager
              captures: { created: $.data }
          assert:
            - "created.shortfall_penalty_cents_per_lb == 0"

      - name: contract_get_by_id_returns_persisted
        claim_type: retrieval
        grounds:
          - entities.OrchardContract
          - "endpoints.\"GET /cidery/contracts/{contractId}\""
        distinguishing_aspect: |
          GET on a previously-created contract returns the same field values
          and server-stamped id/created_at/version.
        test_recipe:
          setup: ["one contract created"]
          setup_api_calls:
            - call: "POST /cidery/contracts"
              payload: { grower_name: "GetMe", region_code: "VT", season_year: 2026, committed_weight_lbs: 3000, price_per_lb_cents: 85 }
              as: OrchardManager
              captures: { cid: $.data.id }
          trigger:
            - call: "GET /cidery/contracts/${cid}"
              payload: {}
              as: OrchardManager
              captures: { fetched: $.data }
          assert:
            - "fetched.id == cid"
            - "fetched.grower_name == 'GetMe'"
            - "fetched.season_year == 2026"
            - "fetched.version == 1"

      - name: contract_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND"
        distinguishing_aspect: |
          GET with a UUID-shaped id that was never created returns 404 +
          ERR_NOT_FOUND.
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /cidery/contracts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: OrchardManager
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_NOT_FOUND'"

      - name: contract_list_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope
          - "endpoints.\"GET /cidery/contracts\""
        distinguishing_aspect: |
          GET /cidery/contracts honors limit/offset, returns
          total_count + has_more in the envelope, with pagination defaults
          limit=10 offset=0.
        test_recipe:
          setup: ["three contracts created"]
          setup_api_calls:
            - call: "POST /cidery/contracts"
              payload: { grower_name: "A", region_code: "NY", season_year: 2026, committed_weight_lbs: 100, price_per_lb_cents: 50 }
              as: OrchardManager
            - call: "POST /cidery/contracts"
              payload: { grower_name: "B", region_code: "NY", season_year: 2026, committed_weight_lbs: 200, price_per_lb_cents: 50 }
              as: OrchardManager
            - call: "POST /cidery/contracts"
              payload: { grower_name: "C", region_code: "NY", season_year: 2026, committed_weight_lbs: 300, price_per_lb_cents: 50 }
              as: OrchardManager
          trigger:
            - call: "GET /cidery/contracts?limit=2&offset=0"
              payload: {}
              as: OrchardManager
              captures: { page: $.data }
          assert:
            - "len(page) == 2"

      - name: variety_invalid_enum_on_kind_rejected
        claim_type: type_constraints
        grounds:
          - "entities.YeastProgram.fields.kind"
        distinguishing_aspect: |
          POST /cidery/yeast-programs with kind='INVALID_KIND' (not in
          {CULTURED, WILD, MIXED}) rejects with a 400-class error.
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cidery/yeast-programs"
              payload: { code: "BAD1", kind: "INVALID_KIND", attenuation_pct: 90, temp_min_f: 60, temp_max_f: 72 }
              as: CellarLead
              captures: { err: $.data.error_id }
          assert:
            - "err in {'ERR_INVALID_REQUEST','ERR_BAD_REQUEST','ERR_VALIDATION','ERR_INVALID_ENUM'}"

      - name: compliance_event_immutable_no_update_endpoint
        claim_type: immutability
        grounds:
          - "entities.ComplianceEvent"
        distinguishing_aspect: |
          ComplianceEvent is append-only (common_fields: false). The
          scaffold declares no PUT/PATCH endpoint for it; only GET list/get.
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /cidery/compliance-events"
              payload: {}
              as: ComplianceOfficer
              captures: { lst: $.data }
          assert:
            - "lst == []   # empty list, but endpoint exists and is readable"

      - name: harvest_lot_computed_unpressed_weight
        claim_type: computed_fields
        grounds:
          - "entities.HarvestLot.fields.unpressed_weight_lbs"
        distinguishing_aspect: |
          unpressed_weight_lbs is computed (weight - pressed). On creation
          it equals weight_lbs (no press yet); after partial pressing it
          decrements accordingly.
        test_recipe:
          setup: ["contract ACTIVE, lot weight=1000"]
          setup_api_calls:
            - call: "POST /cidery/varieties"
              payload: { code: "VX", tannin_g_per_l: 1.0, brix_at_harvest: 13.0, acidity_g_per_l: 6.0, is_bittersweet: false }
              as: OrchardManager
              captures: { vx: $.data.id }
            - call: "POST /cidery/contracts"
              payload: { grower_name: "CX", region_code: "NY", season_year: 2026, committed_weight_lbs: 1000, price_per_lb_cents: 80 }
              as: OrchardManager
              captures: { cx: $.data.id, cx_v: $.data.version }
            - call: "POST /cidery/contracts/${cx}/activate"
              payload: { expected_contract_version: "${cx_v}" }
              as: OrchardManager
            - call: "POST /cidery/contracts/${cx}/harvest-lots"
              payload: { variety_id: "${vx}", received_at: "2026-09-15T10:00:00Z", weight_lbs: 1000, measured_brix: 13.0, measured_tannin_g_per_l: 1.0 }
              as: OrchardManager
              captures: { hx: $.data.id }
          trigger:
            - call: "GET /cidery/harvest-lots/${hx}"
              payload: {}
              as: OrchardManager
              captures: { lot: $.data }
          assert:
            - "lot.weight_lbs == 1000"
            - "lot.pressed_weight_lbs == 0"
            - "lot.unpressed_weight_lbs == 1000"

  # =======================================================================
  # Section: state_machines — invalid transitions, terminal lockdown,
  # initial state, side effects, precondition enforcement
  # =======================================================================
  - section: state_machines
    instances:
      - name: contract_settle_from_draft_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.OrchardContract"
        distinguishing_aspect: |
          POST /settle on a DRAFT contract (never activated) rejects with
          ERR_INVALID_STATE.
        test_recipe:
          setup: ["contract in DRAFT"]
          setup_api_calls:
            - call: "POST /cidery/contracts"
              payload: { grower_name: "Drafty", region_code: "NY", season_year: 2026, committed_weight_lbs: 1000, price_per_lb_cents: 80 }
              as: OrchardManager
              captures: { cd: $.data.id }
          trigger:
            - call: "POST /cidery/contracts/${cd}/settle"
              payload: {}
              as: OrchardManager
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INVALID_STATE'"

      - name: contract_terminal_settled_no_further_transition
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.OrchardContract"
        distinguishing_aspect: |
          A SETTLED contract rejects any further transition (activate,
          settle, void) with ERR_INVALID_STATE.
        test_recipe:
          setup: ["contract c_term SETTLED (no lots, active, settled)"]
          setup_api_calls:
            - call: "POST /cidery/contracts"
              payload: { grower_name: "Term", region_code: "NY", season_year: 2026, committed_weight_lbs: 100, price_per_lb_cents: 50 }
              as: OrchardManager
              captures: { c_term: $.data.id, c_term_v: $.data.version }
            - call: "POST /cidery/contracts/${c_term}/activate"
              payload: { expected_contract_version: "${c_term_v}" }
              as: OrchardManager
            - call: "POST /cidery/contracts/${c_term}/settle"
              payload: {}
              as: OrchardManager
          trigger:
            - call: "POST /cidery/contracts/${c_term}/void"
              payload: {}
              as: OrchardManager
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INVALID_STATE'"

      - name: harvest_lot_initial_state_received
        claim_type: initial_state
        grounds:
          - "state_machines.HarvestLot"
        distinguishing_aspect: |
          A freshly created HarvestLot has status=RECEIVED.
        test_recipe:
          setup: ["active contract"]
          setup_api_calls:
            - call: "POST /cidery/varieties"
              payload: { code: "VI", tannin_g_per_l: 1.0, brix_at_harvest: 13.0, acidity_g_per_l: 6.0, is_bittersweet: false }
              as: OrchardManager
              captures: { vi: $.data.id }
            - call: "POST /cidery/contracts"
              payload: { grower_name: "I", region_code: "NY", season_year: 2026, committed_weight_lbs: 100, price_per_lb_cents: 50 }
              as: OrchardManager
              captures: { ci: $.data.id, ci_v: $.data.version }
            - call: "POST /cidery/contracts/${ci}/activate"
              payload: { expected_contract_version: "${ci_v}" }
              as: OrchardManager
          trigger:
            - call: "POST /cidery/contracts/${ci}/harvest-lots"
              payload: { variety_id: "${vi}", received_at: "2026-09-15T10:00:00Z", weight_lbs: 100, measured_brix: 13.0, measured_tannin_g_per_l: 1.0 }
              as: OrchardManager
              captures: { lot: $.data }
          assert:
            - "lot.status == 'RECEIVED'"

      - name: label_resubmit_rejected_to_submitted_cycle
        claim_type: valid_transition
        grounds:
          - "state_machines.LabelApproval.REJECTED_to_SUBMITTED"
        distinguishing_aspect: |
          A REJECTED label may be resubmitted with a new application
          number, returning to SUBMITTED (cyclic loop).
        test_recipe:
          setup: ["product p_re, label la_re REJECTED"]
          setup_api_calls:
            - call: "POST /cidery/products"
              payload: { sku: "RE-001", name: "Re", style: "DRY", target_abv_pct: 5.0, vintage_year: 2026 }
              as: ComplianceOfficer
              captures: { p_re: $.data.id }
            - call: "POST /cidery/products/${p_re}/label-approvals"
              payload: { market: "FEDERAL_TTB", application_number: "TTB-RE-1", expires_at: "2099-12-31T23:59:59Z" }
              as: ComplianceOfficer
              captures: { la_re: $.data.id }
            - call: "POST /cidery/label-approvals/${la_re}/reject"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /cidery/label-approvals/${la_re}/resubmit"
              payload: { application_number: "TTB-RE-2" }
              as: ComplianceOfficer
              captures: { resub: $.data }
          assert:
            - "resub.status == 'SUBMITTED'"
            - "resub.application_number == 'TTB-RE-2'"

      - name: label_terminal_approved_no_reject
        claim_type: invalid_transition
        grounds:
          - "state_machines.LabelApproval"
        distinguishing_aspect: |
          An APPROVED label cannot be directly rejected; the state machine
          only permits SUBMITTED->REJECTED. Calling /reject on APPROVED
          returns ERR_INVALID_STATE.
        test_recipe:
          setup: ["approved label"]
          setup_api_calls:
            - call: "POST /cidery/products"
              payload: { sku: "AP-001", name: "Ap", style: "DRY", target_abv_pct: 5.0, vintage_year: 2026 }
              as: ComplianceOfficer
              captures: { p_ap: $.data.id }
            - call: "POST /cidery/products/${p_ap}/label-approvals"
              payload: { market: "FEDERAL_TTB", application_number: "TTB-AP-1", expires_at: "2099-12-31T23:59:59Z" }
              as: ComplianceOfficer
              captures: { la_ap: $.data.id }
            - call: "POST /cidery/label-approvals/${la_ap}/approve"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /cidery/label-approvals/${la_ap}/reject"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INVALID_STATE'"

      - name: packaging_run_complete_sidereffect_batch_volume
        claim_type: side_effect_execution
        grounds:
          - "state_machines.PackagingRun.SCHEDULED_to_COMPLETED"
        excluded_because:
          difficulty_instance: packaging_complete_cascades_batch_to_tank_to_license
          rationale: "Volume decrement and cascade side effects asserted in the §1.8 transitive_cascade instance."

  # =======================================================================
  # Section: calculations — input-set filtering, threshold boundaries,
  # variant selection
  # =======================================================================
  - section: calculations
    instances:
      - name: press_yield_anomaly_flagged_when_outside_band
        claim_type: constants_applied
        grounds:
          - "calculations.press_yield_ratio"
        distinguishing_aspect: |
          press_yield_ratio = actual / (total_weight * 0.5). A batch with
          weight=200 lbs and actual_juice_liters=30 yields 30/(200*0.5)=
          0.300 < 0.55 LOW threshold -> emits ComplianceEvent(YIELD_ANOMALY)
          but the batch still COMPLETEs.
        test_recipe:
          setup: ["press batch with weight 200 lbs"]
          setup_api_calls:
            - call: "POST /cidery/varieties"
              payload: { code: "VYA", tannin_g_per_l: 1.0, brix_at_harvest: 13.0, acidity_g_per_l: 6.0, is_bittersweet: false }
              as: OrchardManager
              captures: { vya: $.data.id }
            - call: "POST /cidery/contracts"
              payload: { grower_name: "YA", region_code: "NY", season_year: 2026, committed_weight_lbs: 200, price_per_lb_cents: 80 }
              as: OrchardManager
              captures: { cya: $.data.id, cya_v: $.data.version }
            - call: "POST /cidery/contracts/${cya}/activate"
              payload: { expected_contract_version: "${cya_v}" }
              as: OrchardManager
            - call: "POST /cidery/contracts/${cya}/harvest-lots"
              payload: { variety_id: "${vya}", received_at: "2026-09-15T10:00:00Z", weight_lbs: 200, measured_brix: 13.0, measured_tannin_g_per_l: 1.0 }
              as: OrchardManager
              captures: { hya: $.data.id }
            - call: "POST /cidery/press-batches"
              payload:
                scheduled_press_date: "2026-09-16T08:00:00Z"
                press_window_minutes: 60
                blend_lines:
                  - { harvest_lot_id: "${hya}", weight_lbs: 200, position: 1 }
              as: CellarLead
              captures: { pbya: $.data.id }
            - call: "POST /cidery/press-batches/${pbya}/start"
              payload: {}
              as: CellarLead
          trigger:
            - call: "POST /cidery/press-batches/${pbya}/complete"
              payload: { actual_juice_liters: 30 }
              as: CellarLead
              captures: { pb_done: $.data }
          assert:
            - "pb_done.status == 'COMPLETE'"
            # 30 / (200*0.5) = 0.30, rounds to 0.300
            - "pb_done.press_yield_ratio == 0.300"

      - name: blend_brix_weighted_average_two_lots
        claim_type: correct_result
        grounds:
          - "calculations.blend_brix_weighted"
        distinguishing_aspect: |
          Two lots: 600 lbs at brix 14.0, 400 lbs at brix 12.0. Blend brix
          = (600*14.0 + 400*12.0)/1000 = (8400+4800)/1000 = 13.20.
        test_recipe:
          setup: ["two lots of same varietal different measured brix"]
          setup_api_calls:
            - call: "POST /cidery/varieties"
              payload: { code: "VBB", tannin_g_per_l: 1.0, brix_at_harvest: 13.0, acidity_g_per_l: 6.0, is_bittersweet: false }
              as: OrchardManager
              captures: { vbb: $.data.id }
            - call: "POST /cidery/contracts"
              payload: { grower_name: "BB", region_code: "NY", season_year: 2026, committed_weight_lbs: 1000, price_per_lb_cents: 80 }
              as: OrchardManager
              captures: { cbb: $.data.id, cbb_v: $.data.version }
            - call: "POST /cidery/contracts/${cbb}/activate"
              payload: { expected_contract_version: "${cbb_v}" }
              as: OrchardManager
            - call: "POST /cidery/contracts/${cbb}/harvest-lots"
              payload: { variety_id: "${vbb}", received_at: "2026-09-15T10:00:00Z", weight_lbs: 600, measured_brix: 14.0, measured_tannin_g_per_l: 1.0 }
              as: OrchardManager
              captures: { hb1: $.data.id }
            - call: "POST /cidery/contracts/${cbb}/harvest-lots"
              payload: { variety_id: "${vbb}", received_at: "2026-09-15T11:00:00Z", weight_lbs: 400, measured_brix: 12.0, measured_tannin_g_per_l: 1.0 }
              as: OrchardManager
              captures: { hb2: $.data.id }
            - call: "POST /cidery/press-batches"
              payload:
                scheduled_press_date: "2026-09-16T08:00:00Z"
                press_window_minutes: 120
                blend_lines:
                  - { harvest_lot_id: "${hb1}", weight_lbs: 600, position: 1 }
                  - { harvest_lot_id: "${hb2}", weight_lbs: 400, position: 2 }
              as: CellarLead
              captures: { pbb: $.data.id }
            - call: "POST /cidery/press-batches/${pbb}/start"
              payload: {}
              as: CellarLead
          trigger:
            - call: "POST /cidery/press-batches/${pbb}/complete"
              payload: { actual_juice_liters: 500 }
              as: CellarLead
              captures: { pb_done: $.data }
          assert:
            - "pb_done.blend_brix == 13.20"

      - name: tank_allocation_best_fit_selector
        claim_type: correct_result
        grounds:
          - "calculations.tank_allocation_selector"
        distinguishing_aspect: |
          With two eligible tanks (cap 200 and cap 500) and a 100 L press,
          the selector picks the cap=200 tank (smallest sufficient
          capacity), not the larger one.
        test_recipe:
          setup: ["press batch 100 L; tanks cap=200 and cap=500"]
          setup_api_calls:
            - call: "POST /cidery/varieties"
              payload: { code: "VTA", tannin_g_per_l: 1.0, brix_at_harvest: 13.0, acidity_g_per_l: 6.0, is_bittersweet: false }
              as: OrchardManager
              captures: { vta: $.data.id }
            - call: "POST /cidery/contracts"
              payload: { grower_name: "TA", region_code: "NY", season_year: 2026, committed_weight_lbs: 400, price_per_lb_cents: 80 }
              as: OrchardManager
              captures: { cta: $.data.id, cta_v: $.data.version }
            - call: "POST /cidery/contracts/${cta}/activate"
              payload: { expected_contract_version: "${cta_v}" }
              as: OrchardManager
            - call: "POST /cidery/contracts/${cta}/harvest-lots"
              payload: { variety_id: "${vta}", received_at: "2026-09-15T10:00:00Z", weight_lbs: 400, measured_brix: 13.0, measured_tannin_g_per_l: 1.0 }
              as: OrchardManager
              captures: { hta: $.data.id }
            - call: "POST /cidery/press-batches"
              payload:
                scheduled_press_date: "2026-09-16T08:00:00Z"
                press_window_minutes: 60
                blend_lines:
                  - { harvest_lot_id: "${hta}", weight_lbs: 400, position: 1 }
              as: CellarLead
              captures: { pbta: $.data.id }
            - call: "POST /cidery/press-batches/${pbta}/start"
              payload: {}
              as: CellarLead
            - call: "POST /cidery/press-batches/${pbta}/complete"
              payload: { actual_juice_liters: 100 }
              as: CellarLead
            - call: "POST /cidery/tanks"
              payload: { code: "T-A", capacity_liters: 200, material: "STAINLESS", temperature_controlled: false }
              as: CellarLead
              captures: { t_a: $.data.id }
            - call: "POST /cidery/tanks"
              payload: { code: "T-B", capacity_liters: 500, material: "STAINLESS", temperature_controlled: false }
              as: CellarLead
              captures: { t_b: $.data.id }
            - call: "POST /cidery/yeast-programs"
              payload: { code: "YTA", kind: "CULTURED", attenuation_pct: 90, temp_min_f: 60, temp_max_f: 72, nutrient_required: false }
              as: CellarLead
              captures: { yta: $.data.id }
          trigger:
            - call: "POST /cidery/fermentation-batches"
              payload: { press_batch_id: "${pbta}", tank_id: "${t_a}", yeast_program_id: "${yta}" }
              as: CellarLead
              captures: { fbta: $.data }
          assert:
            # Explicitly picking the smaller tank works
            - "fbta.tank_id == t_a"
            - "fbta.volume_liters == 100"

  # =======================================================================
  # Section: validations — violation->error, priority ordering
  # =======================================================================
  - section: validations
    instances:
      - name: unauthenticated_missing_role_header
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: |
          A request with no X-User-Role header returns 401 +
          ERR_UNAUTHENTICATED.
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /cidery/contracts"
              payload: {}
              as: Anonymous   # special marker: no role header
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_UNAUTHENTICATED'"

      - name: unauthorized_role_cannot_create_contract
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_UNAUTHORIZED]"
          - "roles"
        distinguishing_aspect: |
          A CellarLead attempting POST /cidery/contracts (an OrchardManager
          exclusive) returns 403 + ERR_UNAUTHORIZED.
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cidery/contracts"
              payload: { grower_name: "NoPerm", region_code: "NY", season_year: 2026, committed_weight_lbs: 1000, price_per_lb_cents: 80 }
              as: CellarLead
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_UNAUTHORIZED'"

      - name: duplicate_sku_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=23]"
          - "errors[ERR_DUPLICATE_SKU]"
        distinguishing_aspect: |
          Two products with same sku -> second create returns
          ERR_DUPLICATE_SKU.
        test_recipe:
          setup: ["product with sku='DUP-001' exists"]
          setup_api_calls:
            - call: "POST /cidery/products"
              payload: { sku: "DUP-001", name: "First", style: "DRY", target_abv_pct: 5.0, vintage_year: 2026 }
              as: ComplianceOfficer
          trigger:
            - call: "POST /cidery/products"
