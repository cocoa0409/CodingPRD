      - name: invoice_requires_accepted_delivery
        grounds:
          - state_machines.Invoice.DRAFT (creation precondition)
          - state_machines.Delivery.CHECKED_IN
          - errors[ERR_DELIVERY_NOT_ACCEPTED]
        distinguishing_aspect: |
          Entity pair Invoice->Delivery: invoice creation against a delivery
