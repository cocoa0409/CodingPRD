            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
              payload: { name: "Deny Market", region_code: "DN", guarantee_exposure_limit_cents: 5000000 }
