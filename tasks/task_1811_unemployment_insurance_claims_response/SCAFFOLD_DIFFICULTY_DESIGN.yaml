        grounds:
          - state_machines.ChargeProtest.UNDER_REVIEW_to_SUSTAINED
          - state_machines.ChargeLineItem.PROTESTED_to_REVERSED
          - state_machines.ChargeStatement.AUDIT_COMPLETE_to_RECONCILED
          - state_machines.ExperienceRatingModel.FINALIZED_to_SUPERSEDED
        distinguishing_aspect: |
          Depth-4 chain: protest sustain -> line REVERSED (which itself decrements
          statement total, claim charged_amount, and re-credits the employer reserve)
          -> reconcile (enabled only after the reversal) accrues protest_credits ->
          employer's FINALIZED rating models SUPERSEDED by input invalidation. Each
          hop is caused by the previous link, not by the original sustain call.
        test_recipe:
          setup:
            - "Employer (reserve 0 -> -500000 after the line posts, back to 0 at reversal) with a FINALIZED OFFICIAL model; statement with one line 500000 cents protested on DUPLICATE_LINE basis (score 65); protest UNDER_REVIEW; statement AUDIT_COMPLETE"
