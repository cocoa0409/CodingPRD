              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_SUBSCRIBER_LINE_VERSION"
            - "SubscriberLine.${line}.version == 3"
            - "Account.${acct}.promo_credited_cents == 32000"
      - name: scheduled_migration_cutover_waits_for_the_clock
        claim_type: scheduled_actions
        grounds:
