    path: "/api/facilities/{id}/decommission"
    description: "Client decommissions a site; removed from certificate scopes (empty scope suspends an ACTIVE certificate)"
    roles: [ClientContact]
    code: 200
    input: []
    output: Facility
    side_effects: ["scope shrink on DRAFT/ACTIVE/SUSPENDED certificates; ACTIVE certificate with empty resulting scope -> SUSPENDED"]

  # --- EquipmentLine ---
  - method: POST
    path: "/api/equipment-lines"
    description: "Register a production line (dedication UNASSESSED, kosherization NONE)"
    roles: [ClientContact, AccountManager]
    code: 201
    input: [facility_id, designation]
    output: EquipmentLine
    side_effects: []
  - method: GET
    path: "/api/equipment-lines/{id}"
    description: "Get one equipment line"
    roles: [AgencyAdmin, AccountManager, CertificationReviewer, FieldSupervisor, CertificateOfficer, ClientContact]
    code: 200
    input: []
    output: EquipmentLine
    side_effects: []
  - method: GET
    path: "/api/facilities/{id}/equipment-lines"
    description: "List a facility's equipment lines"
    roles: [AgencyAdmin, AccountManager, CertificationReviewer, FieldSupervisor, CertificateOfficer, ClientContact]
    code: 200
    input: ["limit?", "offset?"]
    output: "EquipmentLine[]"
    side_effects: []
  - method: POST
    path: "/api/equipment-lines/{id}/assess"
    description: "Set dedication_status to DEDICATED or SHARED (SHARED with kosherization_state NONE becomes EXPIRED)"
    roles: [CertificationReviewer]
    code: 200
    input: [dedication_status]
    output: EquipmentLine
    side_effects: ["SHARED from NONE: kosherization_state -> EXPIRED"]
  - method: POST
    path: "/api/equipment-lines/{id}/kosherization-events"
    description: "Record a kosherization event: kosherization_state -> VALID, valid_until = now + 72h; facility must be APPROVED"
    roles: [FieldSupervisor]
    code: 201
    input: []
    output: EquipmentLine
    side_effects: ["kosherized_valid_until = current_utc + 72h"]
  - method: POST
    path: "/api/equipment-lines/{id}/report-compromise"
    description: "Report a compromise (non-certified run / contamination): kosherization_state -> COMPROMISED"
    roles: [FieldSupervisor]
    code: 200
    input: []
    output: EquipmentLine
    side_effects: ["kosherized_valid_until = null"]

  # --- Ingredient ---
  - method: POST
    path: "/api/ingredients"
    description: "Submit an ingredient dossier (SUBMITTED)"
    roles: [ClientContact]
    code: 201
    input: [client_id, name, manufacturer, source_category, "has_species_documentation?"]
    output: Ingredient
    side_effects: []
  - method: GET
    path: "/api/ingredients"
    description: "List ingredients"
    roles: [AgencyAdmin, AccountManager, CertificationReviewer, FieldSupervisor, CertificateOfficer, ClientContact]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: "Ingredient[]"
    side_effects: []
  - method: GET
    path: "/api/ingredients/{id}"
    description: "Get one ingredient"
    roles: [AgencyAdmin, AccountManager, CertificationReviewer, FieldSupervisor, CertificateOfficer, ClientContact]
    code: 200
    input: []
    output: Ingredient
    side_effects: []
  - method: GET
    path: "/api/ingredients/{id}/product-usages"
    description: "List ProductIngredient junctions referencing this ingredient"
    roles: [AgencyAdmin, AccountManager, CertificationReviewer, FieldSupervisor, CertificateOfficer, ClientContact]
    code: 200
    input: ["limit?", "offset?"]
    output: "ProductIngredient[]"
    side_effects: []
  - method: POST
    path: "/api/ingredients/{id}/start-review"
    description: "SUBMITTED -> UNDER_REVIEW"
    roles: [CertificationReviewer]
    code: 200
    input: []
    output: Ingredient
    side_effects: []
  - method: POST
    path: "/api/ingredients/{id}/approve"
    description: "UNDER_REVIEW -> APPROVED; ANIMAL requires species documentation; re-approval runs the junction/product/certificate compensation cascade"
    roles: [CertificationReviewer]
    code: 200
    input: []
    output: Ingredient
    side_effects: ["PENDING_REAPPROVAL junctions -> ACTIVE -> products REVIEW_HOLD release -> FROZEN certificate entries -> INCLUDED -> scope_status/count recompute"]
  - method: POST
    path: "/api/ingredients/{id}/reject"
    description: "UNDER_REVIEW -> REJECTED; PENDING_REAPPROVAL junctions -> BLOCKED"
    roles: [CertificationReviewer]
    code: 200
    input: []
    output: Ingredient
    side_effects: ["PENDING_REAPPROVAL junctions -> BLOCKED"]
  - method: POST
    path: "/api/ingredients/{id}/change-notices"
    description: "Client files a change notification on an APPROVED ingredient: -> CHANGE_PENDING with the 4-hop freeze cascade"
    roles: [ClientContact]
    code: 201
    input: [change_summary]
    output: Ingredient
    side_effects: ["junctions ACTIVE->PENDING_REAPPROVAL; products CERTIFIABLE->REVIEW_HOLD; certificate entries INCLUDED->FROZEN; certificates scope_status->PARTIAL_FROZEN, active_product_count recomputed"]
  - method: POST
    path: "/api/ingredients/{id}/resubmit"
    description: "CHANGE_PENDING -> UNDER_REVIEW"
    roles: [ClientContact]
    code: 200
    input: []
    output: Ingredient
    side_effects: []

  # --- Product / ProductIngredient ---
