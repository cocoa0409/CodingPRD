# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# task_1101_film_distribution_theatrical_booking
#
# Enumerative coverage of every testable claim NOT already covered by §1.8.
# Sections per claim-extraction-guide.md: entities / state_machines /
# calculations / validations / endpoints / errors / rbac / layers / consistency.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities (creation, defaults, computed, system, enum, not-found, list)
  # ===========================================================================
  - section: entities
    instances:
      - name: distributor_creation_applies_system_defaults
        claim_type: defaults
        grounds:
          - entities.Distributor.fields.week_epoch
          - entities.Distributor.fields.logical_clock_utc
          - entities.Distributor.fields.lifecycle_posture
        distinguishing_aspect: "Distributor creation stamps week_epoch=0, lifecycle_posture=ACTIVE, logical_clock_utc=2026-05-01T00:00:00Z — all system defaults; client input for these fields is ignored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Distro Co", territory: "US" }
              as: PlatformAdmin
              captures: { did: $.data.id, week_epoch: $.data.week_epoch, posture: $.data.lifecycle_posture, clock: $.data.logical_clock_utc }
          trigger:
            - call: "GET /distributors/${did}"
              payload: {}
              as: Auditor
          assert:
            - "week_epoch == 0"
            - "lifecycle_posture == ACTIVE"
            - "logical_clock_utc == '2026-05-01T00:00:00Z' (server startup default)"

      - name: film_computed_fields_derive_correctly
        claim_type: computed_field_correctness
        grounds:
          - entities.Film.fields.screens_committed
          - entities.Film.fields.theatrical_window_end
        distinguishing_aspect: "Film.theatrical_window_end = target_release_date + 90 days; screens_committed starts at 0 and tracks only ACCEPTED/IN_PLAY/HELD_OVER agreements."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "D", territory: "US" }
              as: PlatformAdmin
              captures: { did: $.data.id }
            - call: "POST /distributors/${did}/films"
              payload: { title: "F", genre: "NARRATIVE", runtime_minutes: 100, rating: "R", release_pattern: "LIMITED", target_release_date: "2026-05-01T00:00:00Z", min_screens_for_wide: 0 }
              as: Booker
              captures: { fid: $.data.id, screens: $.data.screens_committed, window_end: $.data.theatrical_window_end }
          trigger:
            - call: "GET /distributors/${did}/films/${fid}"
              payload: {}
              as: Auditor
          assert:
            - "screens_committed == 0 at creation"
            - "theatrical_window_end == '2026-07-30T00:00:00Z' (2026-05-01 + 90 days)"

      - name: film_invalid_genre_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Film.fields.genre
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Invalid enum value for genre (e.g. 'WESTERN') is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Distributor exists"]
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "D", territory: "US" }
              as: PlatformAdmin
              captures: { did: $.data.id }
          trigger:
            - call: "POST /distributors/${did}/films"
              payload: { title: "F", genre: "WESTERN", runtime_minutes: 100, rating: "R", release_pattern: "LIMITED", target_release_date: "2026-05-01T00:00:00Z", min_screens_for_wide: 0 }
              as: Booker
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: film_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - entities.Film.fields.title
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /films without title (required input field) is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Distributor exists"]
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "D", territory: "US" }
              as: PlatformAdmin
              captures: { did: $.data.id }
          trigger:
            - call: "POST /distributors/${did}/films"
              payload: { genre: "NARRATIVE", runtime_minutes: 100, rating: "R", release_pattern: "LIMITED", target_release_date: "2026-05-01T00:00:00Z", min_screens_for_wide: 0 }
              as: Booker
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: distributor_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET on a non-existent distributor UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /distributors/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == ERR_NOT_FOUND"

      - name: market_list_pagination_respects_limit_offset
        claim_type: listing
        grounds:
          - 'endpoints."GET /distributors/{did}/markets"'
          - response_envelope.pagination_fields
        distinguishing_aspect: "List endpoint returns paginated envelope with limit/offset/total_count/has_more."
        test_recipe:
          setup: ["Distributor with 3 markets"]
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "D", territory: "US" }
              as: PlatformAdmin
              captures: { did: $.data.id }
            - call: "POST /distributors/${did}/markets"
              payload: { code: "NYC", population_tier: "TIER_1", weekly_coop_budget_cents: 100000 }
              as: PlatformAdmin
            - call: "POST /distributors/${did}/markets"
              payload: { code: "LA", population_tier: "TIER_1", weekly_coop_budget_cents: 100000 }
              as: PlatformAdmin
            - call: "POST /distributors/${did}/markets"
              payload: { code: "CHI", population_tier: "TIER_2", weekly_coop_budget_cents: 50000 }
              as: PlatformAdmin
          trigger:
            - call: "GET /distributors/${did}/markets"
              payload: { limit: 2, offset: 0 }
              as: Auditor
          assert:
            - "Response envelope contains meta.api_request_id and meta.api_request_timestamp"
            - "response_type == 'array'"
            - "Pagination fields present: limit, offset, total_count, has_more"
            - "total_count == 3"
            - "has_more == true when limit=2, offset=0"
            - "data length == 2"

      - name: screen_fk_to_theatre_enforced
        claim_type: fk_integrity
        grounds:
          - entities.Screen.fields.theatre_id
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "POST /theatres/{tid}/screens with non-existent tid returns 404 (parent scope violation)."
        test_recipe:
          setup: ["Distributor exists"]
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "D", territory: "US" }
              as: PlatformAdmin
              captures: { did: $.data.id }
          trigger:
            - call: "POST /distributors/${did}/theatres/00000000-0000-0000-0000-000000000000/screens"
              payload: { auditorium_label: "A", seat_count: 100, projection_format: "DCP_2K" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == ERR_NOT_FOUND"

      - name: booking_agreement_screen_theatre_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_SCREEN_THEATRE_MISMATCH]
        distinguishing_aspect: "BookingAgreement with screen_id from Theatre T2 but theatre_id=T1 → ERR_SCREEN_THEATRE_MISMATCH."
        test_recipe:
          setup: ["Distributor D1, Film F1, two Theatres T1/T2 each with a Screen"]
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "D", territory: "US" }
              as: PlatformAdmin
              captures: { did: $.data.id }
            - call: "POST /distributors/${did}/films"
              payload: { title: "F", genre: "NARRATIVE", runtime_minutes: 90, rating: "R", release_pattern: "LIMITED", target_release_date: "2026-05-08T00:00:00Z", min_screens_for_wide: 0 }
              as: Booker
              captures: { fid: $.data.id }
            - call: "POST /distributors/${did}/theatres"
              payload: { name: "T1", circuit: "X", market_code: "NYC", house_allowance_cents: 100 }
              as: PlatformAdmin
              captures: { t1id: $.data.id }
            - call: "POST /distributors/${did}/theatres"
              payload: { name: "T2", circuit: "X", market_code: "NYC", house_allowance_cents: 100 }
              as: PlatformAdmin
              captures: { t2id: $.data.id }
            - call: "POST /distributors/${did}/theatres/${t1id}/screens"
              payload: { auditorium_label: "A", seat_count: 100, projection_format: "DCP_2K" }
              as: PlatformAdmin
            - call: "POST /distributors/${did}/theatres/${t2id}/screens"
              payload: { auditorium_label: "B", seat_count: 100, projection_format: "DCP_2K" }
              as: PlatformAdmin
              captures: { s2id: $.data.id }
          trigger:
            - call: "POST /distributors/${did}/booking-agreements"
              payload: { film_id: "${fid}", theatre_id: "${t1id}", screen_id: "${s2id}", opening_date: "2026-05-08T00:00:00Z", min_weeks_committed: 1, week_one_rental_pct: 0.60, rental_decay_per_week: 0.05, floor_pct: 0.30, per_capita_floor_cents: 100 }
              as: Booker
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "error_id == ERR_SCREEN_THEATRE_MISMATCH"

  # ===========================================================================
  # Section: state_machines (valid, invalid, terminal lockdown, side effects)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: film_initial_state_is_pre_release
        claim_type: initial_state
        grounds: [state_machines.Film.initial_state]
        distinguishing_aspect: "Film starts in PRE_RELEASE immediately after POST /films."
        test_recipe:
          setup: ["Distributor exists"]
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "D", territory: "US" }
              as: PlatformAdmin
              captures: { did: $.data.id }
            - call: "POST /distributors/${did}/films"
              payload: { title: "F", genre: "NARRATIVE", runtime_minutes: 100, rating: "R", release_pattern: "LIMITED", target_release_date: "2026-05-08T00:00:00Z", min_screens_for_wide: 0 }
              as: Booker
              captures: { fid: $.data.id, status: $.data.lifecycle_status }
          trigger:
            - call: "GET /distributors/${did}/films/${fid}"
              payload: {}
              as: Auditor
          assert:
            - "lifecycle_status == PRE_RELEASE"

      - name: film_terminal_ancillary_released_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Film.terminal_states]
        distinguishing_aspect: "Film in ANCILLARY_RELEASED rejects further transitions (e.g., pull returns ERR_INVALID_STATE)."
        test_recipe:
          setup: ["Film F1 with all bookings COMPLETED; request_ancillary_handoff done; clock advanced past theatrical_window_end; one SCHEDULED AncillaryWindow exists"]
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "D", territory: "US" }
              as: PlatformAdmin
              captures: { did: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distributors/${did}/films"
              payload: { title: "F", genre: "NARRATIVE", runtime_minutes: 90, rating: "R", release_pattern: "LIMITED", target_release_date: "2026-05-01T00:00:00Z", min_screens_for_wide: 0 }
              as: Booker
              captures: { fid: $.data.id }
            - call: "POST /distributors/${did}/films/${fid}/request_ancillary_handoff"
              payload: {}
              as: Booker
            - call: "POST /distributors/${did}/films/${fid}/ancillary-windows"
              payload: { window_kind: "SVOD", scheduled_start_utc: "2026-08-01T00:00:00Z" }
              as: Booker
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /distributors/${did}/films/${fid}/pull"
              payload: {}
              as: Booker
              captures: { err: $.data.error_id }
          assert:
            - "Film.lifecycle_status == ANCILLARY_RELEASED (terminal)"
            - "POST /pull returns 409 with error_id == ERR_INVALID_STATE"

      - name: booking_cancel_from_completed_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.BookingAgreement
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /cancel on a COMPLETED BookingAgreement returns ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["BookingAgreement BA1 in COMPLETED state (via full cycle: settle, close week)"]
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "D", territory: "US" }
              as: PlatformAdmin
              captures: { did: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distributors/${did}/films"
              payload: { title: "F", genre: "NARRATIVE", runtime_minutes: 90, rating: "R", release_pattern: "LIMITED", target_release_date: "2026-05-01T00:00:00Z", min_screens_for_wide: 0 }
              as: Booker
              captures: { fid: $.data.id }
            - call: "POST /distributors/${did}/theatres"
              payload: { name: "T", circuit: "X", market_code: "NYC", house_allowance_cents: 100 }
              as: PlatformAdmin
              captures: { tid: $.data.id }
            - call: "POST /distributors/${did}/theatres/${tid}/screens"
              payload: { auditorium_label: "A", seat_count: 100, projection_format: "DCP_2K" }
              as: PlatformAdmin
              captures: { sid: $.data.id }
            - call: "POST /distributors/${did}/booking-agreements"
              payload: { film_id: "${fid}", theatre_id: "${tid}", screen_id: "${sid}", opening_date: "2026-05-01T00:00:00Z", min_weeks_committed: 1, week_one_rental_pct: 0.60, rental_decay_per_week: 0.05, floor_pct: 0.30, per_capita_floor_cents: 100 }
              as: Booker
              captures: { baid: $.data.id, ba_v0: $.data.version }
            - call: "POST /distributors/${did}/booking-agreements/${baid}/accept"
              payload: { expected_booking_agreement_version: "${ba_v0}" }
              as: Exhibitor
            - call: "POST /distributors/${did}/booking-agreements/${baid}/dcp-shipments"
              payload: { content_format: "DCP_2K", tracking_number: "TN-1" }
              as: Booker
              captures: { shipid: $.data.id }
            - call: "POST /distributors/${did}/booking-agreements/${baid}/dcp-shipments/${shipid}/mark_delivered"
              payload: {}
              as: Exhibitor
            - call: "POST /distributors/${did}/booking-agreements/${baid}/kdm-keys"
              payload: { valid_from_utc: "2026-05-01T00:00:00Z", valid_until_utc: "2026-06-01T00:00:00Z", screen_cert_fingerprint: "FP" }
              as: Booker
            - call: "POST /distributors/${did}/booking-agreements/${baid}/box-office-reports"
              payload: { report_date: "2026-05-01T00:00:00Z", gross_cents: 500000, admissions: 2000 }
              as: Exhibitor
              captures: { rid: $.data.id }
            - call: "POST /distributors/${did}/booking-agreements/${baid}/box-office-reports/${rid}/submit"
              payload: {}
              as: Exhibitor
            - call: "POST /distributors/${did}/close_box_office_week"
              payload: {}
              as: SettlementClerk
            - call: "GET /distributors/${did}/booking-agreements/${baid}/settlements"
              payload: {}
              as: SettlementClerk
              captures: { settlement_id: "$.data[0].id" }
            - call: "POST /distributors/${did}/booking-agreements/${baid}/settlements/${settlement_id}/mark_settled"
              payload: {}
              as: SettlementClerk
            - call: "POST /distributors/${did}/close_box_office_week"
              payload: {}
              as: SettlementClerk
          trigger:
            - call: "POST /distributors/${did}/booking-agreements/${baid}/cancel"
              payload: {}
              as: Booker
              captures: { err: $.data.error_id }
          assert:
            - "BookingAgreement.deal_status == COMPLETED before cancel attempt"
            - "POST /cancel returns 409 with error_id == ERR_INVALID_STATE"
            - "No side effects fire (Screen status unchanged, screens_committed unchanged)"

      - name: zone_clearance_overrule_cascades_to_proposed_bookings
        claim_type: side_effect_execution
        grounds: [state_machines.ZoneClearance.CHALLENGED_to_OVERRULED]
        distinguishing_aspect: "OVERRULED cascades: any PROPOSED/COUNTERED BookingAgreement for the original theatre on the same film is auto-CANCELLED."
        test_recipe:
          setup: ["ZoneClearance ZC1 CHALLENGED; Theatre T1 has a PROPOSED BookingAgreement BA1 for Film F1"]
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "D", territory: "US" }
              as: PlatformAdmin
              captures: { did: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distributors/${did}/markets"
              payload: { code: "NYC", population_tier: "TIER_1", weekly_coop_budget_cents: 100000 }
              as: PlatformAdmin
              captures: { mid: $.data.id }
            - call: "POST /distributors/${did}/films"
              payload: { title: "F", genre: "NARRATIVE", runtime_minutes: 90, rating: "R", release_pattern: "LIMITED", target_release_date: "2026-06-01T00:00:00Z", min_screens_for_wide: 0 }
              as: Booker
              captures: { fid: $.data.id }
            - call: "POST /distributors/${did}/theatres"
              payload: { name: "T1", circuit: "X", market_code: "NYC", house_allowance_cents: 100 }
              as: PlatformAdmin
              captures: { t1id: $.data.id }
            - call: "POST /distributors/${did}/theatres/${t1id}/screens"
              payload: { auditorium_label: "A", seat_count: 100, projection_format: "DCP_2K" }
              as: PlatformAdmin
              captures: { s1id: $.data.id }
            - call: "POST /distributors/${did}/booking-agreements"
              payload: { film_id: "${fid}", theatre_id: "${t1id}", screen_id: "${s1id}", opening_date: "2026-06-01T00:00:00Z", min_weeks_committed: 1, week_one_rental_pct: 0.60, rental_decay_per_week: 0.05, floor_pct: 0.30, per_capita_floor_cents: 100 }
              as: Booker
              captures: { baid: $.data.id }
            - call: "POST /distributors/${did}/markets/${mid}/zone-clearances"
              payload: { film_id: "${fid}", theatre_id: "${t1id}", clearance_radius_km: 5.0, effective_from_utc: "2026-06-01T00:00:00Z", effective_until_utc: "2026-06-30T00:00:00Z" }
              as: Booker
              captures: { zc1id: $.data.id }
            - call: "POST /distributors/${did}/markets/${mid}/zone-clearances/${zc1id}/challenge"
              payload: {}
              as: Exhibitor
          trigger:
            - call: "POST /distributors/${did}/markets/${mid}/zone-clearances/${zc1id}/rule"
              payload: { ruling: "OVERRULED" }
              as: Booker
            - call: "GET /distributors/${did}/booking-agreements/${baid}"
              payload: {}
              as: Booker
              captures: { ba_status: $.data.deal_status }
          assert:
            - "ZoneClearance.status == OVERRULED"
            - "BookingAgreement BA1 deal_status == CANCELLED (cascade fired)"

      - name: invalid_kdm_extend_when_status_expired
        claim_type: invalid_transition
        grounds: [state_machines.KDMKey]
        distinguishing_aspect: "POST /extend on an EXPIRED KDM returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["KDM K1 expired (clock past valid_until)"]
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "D", territory: "US" }
              as: PlatformAdmin
              captures: { did: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distributors/${did}/films"
              payload: { title: "F", genre: "NARRATIVE", runtime_minutes: 90, rating: "R", release_pattern: "LIMITED", target_release_date: "2026-05-01T00:00:00Z", min_screens_for_wide: 0 }
              as: Booker
              captures: { fid: $.data.id }
            - call: "POST /distributors/${did}/theatres"
              payload: { name: "T", circuit: "X", market_code: "NYC", house_allowance_cents: 100 }
              as: PlatformAdmin
              captures: { tid: $.data.id }
            - call: "POST /distributors/${did}/theatres/${tid}/screens"
              payload: { auditorium_label: "A", seat_count: 100, projection_format: "DCP_2K" }
              as: PlatformAdmin
              captures: { sid: $.data.id }
            - call: "POST /distributors/${did}/booking-agreements"
              payload: { film_id: "${fid}", theatre_id: "${tid}", screen_id: "${sid}", opening_date: "2026-05-01T00:00:00Z", min_weeks_committed: 1, week_one_rental_pct: 0.60, rental_decay_per_week: 0.05, floor_pct: 0.30, per_capita_floor_cents: 100 }
              as: Booker
              captures: { baid: $.data.id, ba_v0: $.data.version }
            - call: "POST /distributors/${did}/booking-agreements/${baid}/accept"
              payload: { expected_booking_agreement_version: "${ba_v0}" }
              as: Exhibitor
            - call: "POST /distributors/${did}/booking-agreements/${baid}/dcp-shipments"
              payload: { content_format: "DCP_2K", tracking_number: "TN-1" }
              as: Booker
              captures: { shipid: $.data.id }
            - call: "POST /distributors/${did}/booking-agreements/${baid}/dcp-shipments/${shipid}/mark_delivered"
              payload: {}
              as: Exhibitor
            - call: "POST /distributors/${did}/booking-agreements/${baid}/kdm-keys"
              payload: { valid_from_utc: "2026-05-01T00:00:00Z", valid_until_utc: "2026-05-08T00:00:00Z", screen_cert_fingerprint: "FP" }
              as: Booker
              captures: { k1id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-08T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /distributors/${did}/booking-agreements/${baid}/kdm-keys/${k1id}/extend"
              payload: { valid_until_utc: "2026-05-22T00:00:00Z" }
              as: Booker
              captures: { err: $.data.error_id }
          assert:
            - "KDM K1 status == EXPIRED (half-open: at t == valid_until, key is expired)"
            - "extend returns 409 ERR_INVALID_STATE"

  # ===========================================================================
  # Section: calculations (constants, precision, filter)
  # ===========================================================================
  - section: calculations
    instances:
      - name: per_capita_floor_applies_when_higher_than_split
        claim_type: correct_result
        grounds: [calculations.settlement_distributor_share]
        distinguishing_aspect: "When admissions*per_capita_floor > net*pct, distributor_share = per_capita total, exhibitor_share goes negative."
        test_recipe:
          setup: ["BA1 ACCEPTED with per_capita_floor=150; week 1 gross=100000, house=50000, admissions=500"]
          setup_api_calls:
            - call: "POST /distributors"
