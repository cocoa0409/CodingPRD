  - method: GET
    path: "/vessels/{id}/rotation-plans"
    description: "List rotation plans of a vessel"
    roles: [FleetAdmin, CrewingManager, CredentialingOfficer, PortCaptain, UnionDispatcher, Mariner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CrewRotationPlan[]"
    side_effects: []
  - method: POST
    path: "/vessels/{id}/rotation-plans/{planId}/archive"
    description: "SUPERSEDED -> ARCHIVED"
    roles: [CrewingManager]
    code: 200
    input: []
    output: CrewRotationPlan
    side_effects: ["status -> ARCHIVED"]

  # --- Assignment ---
  - method: POST
    path: "/assignments"
    description: "Propose an assignment (PROPOSED); channel rules, rotation window, overlap checks, endorsement/rank gates apply"
    roles: [CrewingManager, UnionDispatcher]
    code: 201
    input: [mariner_id, manning_slot_id, assignment_channel, sign_on_date, planned_relief_date, "union_registration_id?", "relief_of_assignment_id?", "local_join?"]
    output: Assignment
    side_effects: ["assignment_status = PROPOSED", "travel_status = PENDING", "repatriation_status = NOT_DUE", "vessel_id denormalized from slot"]
  - method: GET
    path: "/assignments"
    description: "List assignments with filters"
    roles: [FleetAdmin, CrewingManager, CredentialingOfficer, PortCaptain, UnionDispatcher, Mariner]
    code: 200
    input: ["mariner_id?", "manning_slot_id?", "vessel_id?", "assignment_status?", "relief_of_assignment_id?", "union_registration_id?", "limit?", "offset?"]
    output: "Assignment[]"
    side_effects: []
  - method: GET
    path: "/assignments/{id}"
    description: "Get one assignment"
    roles: [FleetAdmin, CrewingManager, CredentialingOfficer, PortCaptain, UnionDispatcher, Mariner]
    code: 200
    input: []
    output: Assignment
    side_effects: []
  - method: POST
    path: "/assignments/{id}/confirm"
    description: "PROPOSED -> CONFIRMED; full gate battery (posture, channel, endorsement, rank, overlaps, dues)"
    roles: [CrewingManager, UnionDispatcher]
    code: 200
    input: []
    output: Assignment
    side_effects: ["assignment_status -> CONFIRMED", "travel_status := WAIVED if local_join else PENDING"]
  - method: POST
    path: "/assignments/{id}/sign-on"
    description: "CONFIRMED -> ONBOARD; requires now >= sign_on_date and travel READY/WAIVED"
    roles: [CrewingManager, PortCaptain]
    code: 200
    input: []
    output: Assignment
    side_effects: ["assignment_status -> ONBOARD", "actual_sign_on_at := now", "slot current_coverage -> COVERED", "Vessel slots_covered/compliance_posture recompute"]
  - method: POST
    path: "/assignments/{id}/relieve"
    description: "ONBOARD -> RELIEVED; requires relief assignment ONBOARD on same slot; auto-creates REPATRIATION booking"
    roles: [CrewingManager]
    code: 200
    input: []
    output: Assignment
    side_effects: ["assignment_status -> RELIEVED", "actual_relieved_at := now", "repatriation_status -> DUE", "auto-create REPATRIATION TravelBooking (QUOTED, legs [])", "coverage/posture recompute"]
  - method: POST
    path: "/assignments/{id}/close"
    description: "RELIEVED -> CLOSED; requires repatriation COMPLETED"
    roles: [CrewingManager]
    code: 200
    input: []
    output: Assignment
    side_effects: ["assignment_status -> CLOSED"]
  - method: POST
    path: "/assignments/{id}/cancel"
    description: "PROPOSED|CONFIRMED|SUSPENDED -> CANCELLED; cascades non-terminal travel bookings (fees for TICKETED)"
    roles: [CrewingManager, UnionDispatcher]
    code: 200
    input: []
    output: Assignment
    side_effects: ["assignment_status -> CANCELLED", "TravelBookings {QUOTED,BOOKED,TICKETED} -> CANCELLED (TICKETED compute cancellation_fee_cents)", "coverage/posture recompute"]
  - method: POST
    path: "/assignments/{id}/resume"
    description: "SUSPENDED -> CONFIRMED (never signed on) or -> ONBOARD (was signed on); requires posture restored"
    roles: [CrewingManager]
    code: 200
    input: []
    output: Assignment
    side_effects: ["assignment_status -> CONFIRMED or ONBOARD per actual_sign_on_at", "coverage/posture recompute"]

  # --- TravelBooking ---
  - method: POST
    path: "/assignments/{id}/travel-bookings"
    description: "Create a JOIN travel booking (QUOTED); assignment must be CONFIRMED/ONBOARD/RELIEVED; REPATRIATION direction is system-created only"
    roles: [CrewingManager]
    code: 201
    input: [direction, legs, payer]
    output: TravelBooking
    side_effects: ["status = QUOTED", "JOIN requires >= 1 leg (ERR_NO_TRAVEL_LEGS)", "direction == REPATRIATION rejected for manual create (ERR_INVALID_REQUEST)"]
  - method: GET
    path: "/assignments/{id}/travel-bookings"
    description: "List travel bookings of an assignment"
    roles: [FleetAdmin, CrewingManager, CredentialingOfficer, PortCaptain, UnionDispatcher, Mariner]
    code: 200
    input: ["direction?", "status?", "limit?", "offset?"]
    output: "TravelBooking[]"
    side_effects: []
  - method: PUT
    path: "/assignments/{id}/travel-bookings/{bookingId}"
    description: "Replace legs while QUOTED (used to fill the system-created repatriation booking)"
    roles: [CrewingManager]
    code: 200
    input: [legs]
    output: TravelBooking
    side_effects: ["legs replaced (booking must be QUOTED else ERR_INVALID_STATE)"]
  - method: POST
    path: "/assignments/{id}/travel-bookings/{bookingId}/book"
    description: "QUOTED -> BOOKED (requires legs)"
    roles: [CrewingManager]
    code: 200
    input: []
    output: TravelBooking
    side_effects: ["status -> BOOKED"]
  - method: POST
    path: "/assignments/{id}/travel-bookings/{bookingId}/ticket"
    description: "BOOKED -> TICKETED; computes total_fare_cents (per-leg rounding then sum); bubbles travel/repatriation status"
    roles: [CrewingManager]
    code: 200
    input: []
    output: TravelBooking
    side_effects: ["status -> TICKETED", "total_fare_cents computed", "JOIN -> assignment.travel_status READY; REPATRIATION -> repatriation_status ARRANGED"]
  - method: POST
    path: "/assignments/{id}/travel-bookings/{bookingId}/complete"
    description: "TICKETED -> COMPLETED; REPATRIATION completion flips repatriation_status COMPLETED"
    roles: [CrewingManager]
    code: 200
    input: []
    output: TravelBooking
    side_effects: ["status -> COMPLETED", "REPATRIATION -> assignment.repatriation_status COMPLETED"]
  - method: POST
    path: "/assignments/{id}/travel-bookings/{bookingId}/cancel"
    description: "QUOTED|BOOKED|TICKETED -> CANCELLED; TICKETED incurs 15% fee; last JOIN ticket cancellation demotes travel_status"
    roles: [CrewingManager]
    code: 200
    input: []
    output: TravelBooking
    side_effects: ["status -> CANCELLED", "TICKETED: cancellation_fee_cents = round_half_up(total x 0.15)", "JOIN: travel_status -> PENDING if no other TICKETED+ JOIN booking"]

