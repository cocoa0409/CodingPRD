            - { call: "POST /isps/${isp_id}/submit-review", payload: {}, as: CaseManager, as_user_id: "${cm_id}" }
            - { call: "POST /isps/${isp_id}/approve", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /isps/${isp_id}/activate", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /authorizations", payload: { individual_id: "${ind_id}", isp_id: "${isp_id}", service_code: "DAY_PROG", unit_type: "FIFTEEN_MIN", authorized_units: 60, rate_cents: 1500, span_start: "2026-01-01", span_end: "2026-12-31" }, as: CaseManager, as_user_id: "${cm_id}", captures: { auth_id: $.data.id } }
