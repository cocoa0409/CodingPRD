  - method: POST
    path: "/mail-drops/{id}/presort"
    description: "Compute presort tiers + postage; enforces daily aggregate capacity"
    roles: [MailSpecialist]
    code: 200
    input: []
    output: MailDrop
    side_effects: ["presort_postage_waterfall", "mail_daily_capacity", "increments MailDrop.version by 1"]
  - method: POST
    path: "/mail-drops/{id}/drop"
    description: "Execute drop; MAIL job READY_TO_SHIP -> FULFILLED"
    roles: [MailSpecialist]
    code: 200
    input: []
    output: MailDrop
    side_effects: ["Job -> FULFILLED; delivered_quantity := total_pieces", "increments MailDrop.version by 1"]
  - method: POST
    path: "/invoices"
    description: "Generate PRODUCTION invoice (DRAFT) for a FULFILLED, UNBILLED job; runs tolerance billing math"
    roles: [PlantManager]
    code: 201
    input: ["job_id"]
    output: Invoice
    side_effects: ["overrun_underrun_billing", "proof_overage_fee", "postage aggregation from DROPPED mail drops"]
  - method: GET
    path: "/invoices/{id}"
    description: "Get invoice"
    roles: [PlantManager, Customer, Estimator]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/invoices"
    description: "List invoices; Customer role sees own only"
    roles: [PlantManager, Customer, Estimator]
    code: 200
    input: ["job_id?", "customer_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: POST
    path: "/invoices/{id}/issue"
    description: "DRAFT -> ISSUED"
    roles: [PlantManager]
    code: 200
    input: []
    output: Invoice
    side_effects: ["Job UNBILLED -> INVOICED", "customer_credit_exposure", "increments Invoice.version by 1"]
  - method: POST
    path: "/invoices/{id}/payments"
    description: "Record payment (1..outstanding); exact outstanding -> PAID"
    roles: [PlantManager]
    code: 201
    input: ["amount_cents"]
    output: Invoice
    side_effects: ["payment application; PAID cascade to Job SETTLED/CLOSED", "customer_credit_exposure", "increments Invoice.version by 1"]
  - method: POST
    path: "/invoices/{id}/apply-credit"
    description: "Apply customer reprint credit balance to an open invoice"
    roles: [PlantManager]
    code: 200
    input: ["amount_cents"]
    output: Invoice
    side_effects: ["credit application; PAID cascade", "customer_credit_exposure", "increments Invoice.version by 1"]
  - method: POST
    path: "/invoices/{id}/dispute"
    description: "ISSUED -> DISPUTED (branch; resolvable via payment or credit)"
    roles: [Customer, PlantManager]
    code: 200
    input: ["reason"]
    output: Invoice
    side_effects: ["increments Invoice.version by 1"]
  - method: POST
    path: "/reprint-claims"
    description: "Customer files claim on a FULFILLED/CLOSED own job"
    roles: [Customer]
    code: 201
    input: ["job_id", "claimed_defect", "defect_qty"]
    output: ReprintClaim
    side_effects: []
  - method: GET
    path: "/reprint-claims/{id}"
    description: "Get claim"
    roles: [PlantManager, Customer]
    code: 200
    input: []
    output: ReprintClaim
    side_effects: []
  - method: GET
    path: "/reprint-claims"
    description: "List claims; Customer role sees own only"
    roles: [PlantManager, Customer]
    code: 200
    input: ["job_id?", "invoice_id?", "reprint_job_id?", "status?", "limit?", "offset?"]
    output: ReprintClaim[]
    side_effects: []
  - method: POST
    path: "/reprint-claims/{id}/review"
    description: "FILED -> UNDER_REVIEW; records reviewed_by"
    roles: [PlantManager]
    code: 200
    input: []
    output: ReprintClaim
    side_effects: ["sets reviewed_by", "increments ReprintClaim.version by 1"]
  - method: POST
    path: "/reprint-claims/{id}/approve"
    description: "UNDER_REVIEW -> APPROVED (REPRINT creates reprint job; CREDIT issues credit with auto-application cascade); approver != reviewer"
    roles: [PlantManager]
    code: 200
    input: ["resolution", "liability_pct"]
    output: ReprintClaim
    side_effects: ["reprint_credit", "REPRINT: creates child Job", "CREDIT: invoice application -> PAID -> Job SETTLED/CLOSED -> posture recompute", "increments ReprintClaim.version by 1"]
  - method: POST
    path: "/reprint-claims/{id}/deny"
    description: "UNDER_REVIEW -> DENIED; denier != reviewer"
    roles: [PlantManager]
    code: 200
    input: ["reason"]
    output: ReprintClaim
    side_effects: ["increments ReprintClaim.version by 1"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving endpoint). Startup default is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [PlantManager]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: string }"
    side_effects: ["lazy estimate expiry re-evaluation on next access"]


# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_NOT_OWN_RESOURCE, http: 403, condition: "Customer role accessing a resource whose customer_id != X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Claim approve/deny attempted by the same X-User-ID recorded as reviewed_by" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body reference does not resolve" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, bad enum, out-of-range numeric, malformed payload" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current parent version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-machine rejection: transition not defined from the entity's current state" }
  - { id: ERR_ESTIMATE_EXPIRED, http: 409, condition: "Accept attempted after expires_at (estimate transitions to EXPIRED)" }
  - { id: ERR_CREDIT_HOLD, http: 409, condition: "Estimate accept while customer.posture == CREDIT_HOLD" }
  - { id: ERR_JOB_INVALID_STATE, http: 409, condition: "Job production_status not in the required set for the operation" }
  - { id: ERR_JOB_PAST_CANCEL_POINT, http: 409, condition: "Cancel attempted from BINDERY or later" }
  - { id: ERR_JOB_IN_LOCKED_GANG, http: 409, condition: "Cancel/removal attempted on a job whose gang is LOCKED or CONSUMED" }
  - { id: ERR_PROOF_NOT_AWAITING, http: 409, condition: "Approve/request-changes on a proof not in AWAITING_CUSTOMER" }
  - { id: ERR_PRESS_UNAVAILABLE, http: 409, condition: "PressRun creation against a press with status DOWN" }
  - { id: ERR_PRESS_TYPE_MISMATCH, http: 409, condition: "PressRun press_type does not match job/gang press_type" }
  - { id: ERR_PRESS_WINDOW_CONFLICT, http: 409, condition: "PressRun window overlaps an existing SCHEDULED run on the press including trailing washup buffer" }
  - { id: ERR_PAPER_INSUFFICIENT, http: 409, condition: "Reservation at schedule or excess consumption at complete exceeds available sheets (FIFO lots)" }
  - { id: ERR_PO_STATE, http: 409, condition: "Receive/cancel attempted on a PO in RECEIVED or CANCELLED" }
  - { id: ERR_OVER_RECEIPT, http: 422, condition: "Cumulative receipts would exceed floor(ordered_sheets * 1.10)" }
  - { id: ERR_GANG_TOO_SMALL, http: 409, condition: "Lock attempted with fewer than 2 members" }
  - { id: ERR_GANG_FULL, http: 409, condition: "Membership add beyond 6 members" }
  - { id: ERR_GANG_NOT_FORMING, http: 409, condition: "Membership mutation attempted when gang is LOCKED or CONSUMED" }
  - { id: ERR_GANG_NOT_LOCKED, http: 409, condition: "Gang press-run creation or unlock precondition requires LOCKED" }
  - { id: ERR_GANG_INELIGIBLE_JOB, http: 409, condition: "Member job fails referential eligibility: not PLATED, wrong stock on any signature, wrong press_type, or already in another gang" }
  - { id: ERR_GANG_DUE_WINDOW_EXCEEDED, http: 409, condition: "Member job due_date more than 3 days from gang anchor_due_date" }
  - { id: ERR_GANG_HAS_SCHEDULED_RUN, http: 409, condition: "Unlock attempted while a SCHEDULED press run references the gang" }
  - { id: ERR_GANG_RUN_QUANTITY_MISMATCH, http: 409, condition: "Gang press-run run_quantity != sum of member quantity_ordered" }
  - { id: ERR_BINDERY_SEQUENCE, http: 409, condition: "Completing a ticket while a lower sequence_no ticket of the same job is still QUEUED" }
  - { id: ERR_MAIL_CAPACITY_EXCEEDED, http: 409, condition: "Presort would push the drop_date aggregate over 100000 pieces" }
  - { id: ERR_FULFILLMENT_CHANNEL_MISMATCH, http: 409, condition: "record-delivery on a MAIL job, or mail-drop creation on a SHIP job" }
  - { id: ERR_DUPLICATE_INVOICE, http: 409, condition: "A PRODUCTION invoice already exists for the job" }
  - { id: ERR_INVOICE_STATE, http: 409, condition: "Invoice operation invalid from current status (e.g., pay a DRAFT invoice, dispute a PAID invoice)" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "Payment amount < 1 or > amount_outstanding_cents" }
  - { id: ERR_CREDIT_APPLICATION_INVALID, http: 422, condition: "apply-credit amount exceeds min(customer credit balance, invoice outstanding)" }
  - { id: ERR_CLAIM_STATE, http: 409, condition: "Claim operation invalid from current status (e.g., approve from FILED, review twice)" }
  - { id: ERR_CLAIM_ALREADY_OPEN, http: 409, condition: "A claim in FILED or UNDER_REVIEW already exists for the job" }
  - { id: ERR_CLAIM_NO_OPEN_INVOICE, http: 409, condition: "CREDIT approval requires an open PRODUCTION invoice with outstanding > 0" }
  - { id: ERR_DEFECT_QTY_INVALID, http: 422, condition: "defect_qty < 1 or > job.delivered_quantity" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Estimator
    description: "Creates and revises estimates, sends quotes"
    identity: opaque
    exclusive_operations: ["POST /estimates", "PUT /estimates/{id}", "POST /estimates/{id}/quote"]
    shared_operations: [GET reads on customers, estimates, jobs, paper-stocks, gang-runs, invoices]
  - name: Customer
    description: "The print buyer; approves proofs, accepts/declines quotes, files claims, disputes invoices — own resources only"
    identity: entity_backed:Customer
    exclusive_operations: ["POST /estimates/{id}/accept", "POST /estimates/{id}/decline", "POST /proofs/{id}/approve", "POST /proofs/{id}/request-changes", "POST /reprint-claims"]
    shared_operations: ["POST /invoices/{id}/dispute", "GET reads on own estimates/jobs/proofs/invoices/claims/mail-drops/bindery-tickets"]
  - name: PrepressOperator
    description: "Uploads prepress proofs"
    identity: opaque
    exclusive_operations: ["POST /proofs"]
    shared_operations: [GET reads on jobs, proofs, customers]
  - name: PressScheduler
    description: "Schedules presses and gang runs; completes/cancels runs"
    identity: opaque
    exclusive_operations: ["POST /press-runs", "POST /press-runs/{id}/complete", "POST /press-runs/{id}/cancel", "POST /gang-runs", "POST /gang-runs/{id}/members", "POST /gang-runs/{id}/remove-member", "POST /gang-runs/{id}/lock", "POST /gang-runs/{id}/unlock"]
    shared_operations: [GET reads on presses, press-runs, gang-runs, jobs, paper-lots, paper-stocks, bindery-tickets]
  - name: PurchasingManager
    description: "Manages paper catalog, purchase orders, and receipts"
    identity: opaque
    exclusive_operations: ["POST /paper-stocks", "POST /paper-purchase-orders", "POST /paper-purchase-orders/{id}/receive", "POST /paper-purchase-orders/{id}/cancel"]
    shared_operations: [GET reads on paper-stocks, paper-purchase-orders, paper-lots]
  - name: MailSpecialist
    description: "Plans postal drops, runs presort, executes drops"
    identity: opaque
    exclusive_operations: ["POST /mail-drops", "POST /mail-drops/{id}/presort", "POST /mail-drops/{id}/drop"]
    shared_operations: [GET reads on mail-drops, jobs]
  - name: PlantManager
    description: "Plant administration: customers, presses, bindery, delivery, invoicing, claim adjudication, clock"
    identity: opaque
    exclusive_operations: ["POST /customers", "POST /presses", "POST /bindery-tickets", "POST /bindery-tickets/{id}/complete", "POST /jobs/{id}/record-delivery", "POST /jobs/{id}/cancel", "POST /invoices", "POST /invoices/{id}/issue", "POST /invoices/{id}/payments", "POST /invoices/{id}/apply-credit", "POST /reprint-claims/{id}/review", "POST /reprint-claims/{id}/approve", "POST /reprint-claims/{id}/deny", "POST /_clock/set_current_utc"]
    shared_operations: ["POST /invoices/{id}/dispute", GET reads on all resources]
