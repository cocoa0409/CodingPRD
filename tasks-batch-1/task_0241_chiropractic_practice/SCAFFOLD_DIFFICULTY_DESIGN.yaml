          assert:
            - "Appointment.${appt1}.counts_against_cap == true"
            - "InsurancePolicy.${pol_id}.visits_reserved == 2"
            - "the 3rd booking response_type == error with data.error_id == ERR_VISIT_CAP_EXCEEDED"

