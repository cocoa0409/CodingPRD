              payload: { partner_id: "${pa_id}", alert_type: "STRUCTURING", triggered_at: "2026-08-01T00:00:00Z", transaction_volume_cents: 900000, detection_note: "Eleven cash-equivalent loads just under the reporting threshold in one day." }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { alr3_id: $.data.id, alr3_due: $.data.sla_due_at, alr3_breaches: $.data.sla_breach_count }
            - call: "POST /oversight/alerts/${alr3_id}/dispose"
              payload: { disposition: "PARTNER_RESPONSE_PENDING", disposition_note: "Awaiting the partner's account-holder explanation." }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { alr3_disp: $.data.disposition }
            - *q_clock_sep
          trigger:
            - call: "POST /oversight/cycles/${cyc_aug_id}/close"
              payload: { closing_note: "August oversight run." }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { cyc3_reop: $.data.alerts_reopened_count }
            - call: "GET /oversight/alerts/${alr3_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { alr3_disp_after: $.data.disposition, alr3_breaches_after: $.data.sla_breach_count }
          assert:
