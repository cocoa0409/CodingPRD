          setup: ["consumer; one system storing [FINANCIAL]; verified request for [MINOR_DATA]"]
          setup_api_calls:
            - call: "POST /privacy/consumers"
              payload: { email: "tx@x.com", full_name: "TX One", state_code: "TX" }
              as: PrivacyAdmin
              captures: { cons: $.data.id }
            - call: "POST /privacy/data-systems"
              payload: { system_key: "sys-a", hosting_region: US, stores_categories: [FINANCIAL] }
              as: PrivacyAdmin
            - call: "POST /privacy/consumers/${cons}/rights-requests"
              payload: { request_type: ACCESS, requested_categories: [MINOR_DATA] }
              as: Consumer
              as_user_id: "${cons}"
              captures: { req: $.data.id }
            - call: "POST /privacy/rights-requests/${req}/verify"
              payload: {}
              as: DataSteward
          trigger:
            - call: "POST /privacy/rights-requests/${req}/route"
              payload: {}
              as: DataSteward
              captures: { err: $.data.error_id }
            - call: "GET /privacy/rights-requests/${req}/tasks"
              payload: {}
              as: DataSteward
          assert:
            - "error_id == ERR_NO_SYSTEMS_IN_SCOPE (422)"
            - "tasks list is empty; request fulfillment_status stays INTAKE"

