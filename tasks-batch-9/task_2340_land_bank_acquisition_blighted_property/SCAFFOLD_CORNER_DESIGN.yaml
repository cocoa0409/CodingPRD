            - call: "POST /land-bank/properties/${p_id}/list"
              payload: {}
              as: DispositionOfficer
              as_user_id: "disp-1"
              captures: { custody_after: $.data.custody_status }
          assert:
            - "${est} == 1973019  # grade D lot 10000: 950000 + 620000 + round_half_up(0.18*1570000)=282600 -> 1852600, overhead 120419"
            - "HTTP 409 on the first list attempt and ${err_id} == ERR_PROPERTY_NOT_IN_INVENTORY with title_status still CLEAR"
            - "HTTP 200 on the second list attempt and ${custody_after} == LISTED"
            - "FundingSource.${fs_id}.committed_cents == 0 and available_cents == 4988000 after the cancel  # 5000000 - 12000 disbursed"

      - name: packet_decline_releases_commitment_and_restores_constrained_source
        claim_type: side_effect_execution
        grounds:
          - state_machines.AcquisitionPacket.BOARD_APPROVED_to_DECLINED.side_effects
          - state_machines.FundingSource.CONSTRAINED_to_ACTIVE
          - calculations.funding_ledger_position
        distinguishing_aspect: "Declining an approved packet is the exact compensating action of approving it: the commitment goes back to zero, the source climbs back over its reserve floor and flips CONSTRAINED -> ACTIVE, and the sibling packet that was parked in ON_HOLD_FUNDING returns to DUE_DILIGENCE in the same response."
        test_recipe:
          setup:
            - "One ANY funding source authorized 100000 cents (reserve floor 5000) with two packets: one for 96000 (board-approved, driving the source CONSTRAINED) and one for 1000 that the constraint cascade parked in ON_HOLD_FUNDING."
          setup_api_calls:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Compensation Line", source_type: "GENERAL_FUND", authorized_cents: 100000, restriction: "ANY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { fs_id: $.data.id }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-201100", address: "1100 Rowan St", situs_ward: 3, lot_area_sqft: 6000, assessed_value_cents: 300000, structure_present: true, structure_condition_grade: "C", vacancy_months: 4 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p1_id: $.data.id }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-201101", address: "1101 Rowan St", situs_ward: 3, lot_area_sqft: 6000, assessed_value_cents: 300000, structure_present: true, structure_condition_grade: "C", vacancy_months: 4 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p2_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets"
              payload: { property_id: "${p1_id}", funding_source_id: "${fs_id}", channel: "NEGOTIATED_PURCHASE", offer_price_cents: 96000, title_search_fee_cents: 0 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { pk1_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets"
              payload: { property_id: "${p2_id}", funding_source_id: "${fs_id}", channel: "NEGOTIATED_PURCHASE", offer_price_cents: 1000, title_search_fee_cents: 0 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { pk2_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets/${pk1_id}/board-approval"
              payload: { resolution_no: "R-2026-400" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { pk1_committed: $.data.committed_cents }
            - call: "GET /land-bank/funding-sources/${fs_id}"
              payload: {}
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { fs_status_mid: $.data.status, fs_avail_mid: $.data.available_cents }
          trigger:
            - call: "POST /land-bank/acquisition-packets/${pk1_id}/decline"
