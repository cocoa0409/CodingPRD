            - "Call 2 returns ERR_UNIT_STATE_INVALID with HTTP 409: TAB-002 is programmed for the right style and P-001 holds an ISSUED lot, but its program_status is PROGRAMMED rather than LA_PASSED - the deploy gate reads the unit's OTHER state dimension too."
            - "Call 3 succeeds: BallotLot.${lot1}.custody_state == RECEIVED, issued_quantity == 0, unused_quantity == 12500, precinct_id == null, Precinct.${pr1}.ballots_received == 0 and deployment_status == NOT_READY."
