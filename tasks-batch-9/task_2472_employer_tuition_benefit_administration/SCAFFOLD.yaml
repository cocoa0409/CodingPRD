# =============================================================================
# PRD Benchmark Seed Tables — §1.0–§1.7
# Task: task_2472_employer_tuition_benefit_administration
#
# Difficulty band: Expert+ (15 entities / 51 endpoints / 42 error codes /
# 7 calculations with 3 dual-variant families / 8 state machines including one
# cyclic and one parallel-dimension machine / 2 OCC races).
#
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2472. Employer Tuition Benefit Administration (Guild education benefits platform): eligible program catalog curation with school partner agreements and negotiated tuition, employee eligibility by tenure, hours and job family with annual benefit caps, direct-bill versus reimbursement models and up-front payment to schools, tax exclusion limits with imputed income above the threshold, academic progress requirements and repayment obligations on failure or early departure, coaching and advising services with persistence tracking, employer reporting on utilization, retention and skill attainment, program approval workflow for non-catalog schools

domain_name: employer-tuition-benefit-administration

# Flat/graph topology: every entity is addressed from a top-level collection or as a
# sub-resource of its owning collection. `/` is therefore the API prefix — there is no
# single root resource all paths hang from.
api_prefix: "/"

complexity_profile:
  primary_archetype: quota_allocation          # the per-employee annual benefit cap is a finite
                                               # pool that is reserved, disbursed, held on clawback
                                               # and released by compensating actions
  secondary_archetype: compliance_audit        # IRC §127 exclusion limit, imputed income, service
                                               # commitment repayment, append-only tax ledger
  complexity_layers:
    - optimistic_concurrency                   # OCC on Employee.version and PartnerAgreement.version
    - dual_variant_calculation                 # provisional reserve vs settled final; chronological
                                               # tax split vs annual aggregate true-up
    - rate_threshold_triggers                  # §127 exclusion limit, admin-fee tiers, persistence tiers
    - cascading_side_effects                   # failed-outcome clawback chain, termination chain

  entity_topology: graph
  # CatalogListing is a junction of Employer x Program (x PartnerAgreement), PartnerAgreement is a
  # junction of Employer x School, and Enrollment fans in from Employee + CatalogListing +
  # BenefitPolicy. No strict ownership tree exists.

  state_machine_shape: parallel
  # Enrollment carries two independent state axes (academic_status x funding_status) that advance
  # on different triggers and by different actors; ProgramApprovalRequest is cyclic
  # (CHANGES_REQUESTED -> SUBMITTED) with a revision cap; ReimbursementClaim and
  # ProgramApprovalRequest decisions are branching fork points with divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # Employer -> Employee, Enrollment -> AcademicOutcome
    - many_to_many         # Employer x Program via CatalogListing; Employer x School via PartnerAgreement
    - cross_aggregate      # Enrollment reads Employee (cap ledger), BenefitPolicy (pinned), CatalogListing
                           # (negotiated tuition) and School (accreditation) across aggregate boundaries

  role_model: peer_roles
  # PlatformAdmin owns schools/clock/settlement runs, BenefitAdministrator owns employer policy and
  # approvals, Employee owns enrollments/claims/repayments, SchoolPartner owns programs/registration/
  # outcomes, Coach owns coaching sessions. No role is a superset of another.

  consistency_model: immediate
  # Every cascade (clawback, release, ledger recompute, tax reversal, true-up) completes inside the
  # triggering request; all derived fields are readable in the same response or an immediately
  # following GET.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Employer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered employer name.
        constraints: "1..160 chars, non-blank"
      - name: benefit_admin_contact_email
        type: string
        source: input
        description: Mailbox the benefit administrator is reachable at.
        constraints: "must contain '@'"
      - name: fiscal_year_start_month
        type: integer
        source: input
        description: Calendar month the benefit plan year starts on; drives plan_year bucketing of the annual cap.
        constraints: "1..12"
      - name: status
        type: enum
        source: input
        description: Employer account state.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: total_disbursed_cents
        type: integer
        source: computed
        description: "Employer-wide money actually paid out: sum of Enrollment.employer_disbursed_cents over enrollments whose employee_id belongs to this employer and whose funding_status == SETTLED. CLAWED_BACK and RELEASED enrollments contribute 0."
        default: 0
      - name: total_admin_fee_cents
        type: integer
        source: computed
        description: "Sum of ReimbursementClaim.platform_admin_fee_cents over claims with status == APPROVED whose enrollment belongs to an employee of this employer."
        default: 0
      - name: total_imputed_income_cents
        type: integer
        source: computed
        description: "Sum of TaxLedgerEntry.imputed_income_cents over all entry_type values {BENEFIT, REVERSAL, TRUE_UP} for employees of this employer whose tax_year equals the calendar year of the logical clock."
        default: 0

  - name: BenefitPolicy
    parent: Employer
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: "FK -> Employer.id; the employer this policy version governs."
      - name: effective_from
        type: string
        source: input
        description: Inclusive first date the policy governs (ISO date, no time component).
        constraints: "ISO 8601 date"
      - name: effective_to
        type: string
        source: input
        description: Exclusive last date the policy governs; policy windows are half-open [effective_from, effective_to).
        constraints: "ISO 8601 date, strictly greater than effective_from"
      - name: status
        type: enum
        source: system
        description: Policy lifecycle state.
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, SUPERSEDED}"
      - name: min_tenure_months
        type: integer
        source: input
        description: Whole months of tenure an employee must have reached to be eligible.
        constraints: ">= 0"
      - name: min_weekly_hours
        type: number
        source: input
        description: Scheduled weekly hours an employee must meet or exceed to be eligible.
        constraints: ">= 0, at most 2 decimal places"
      - name: eligible_job_families
        type: array
        source: input
        description: Job families covered by the benefit.
        constraints: "non-empty subset of {ENGINEERING, OPERATIONS, CLINICAL, RETAIL_FRONTLINE, CORPORATE}"
      - name: annual_cap_cents
        type: integer
        source: input
        description: Per-employee benefit ceiling for one plan_year.
        constraints: ">= 1"
      - name: funding_model
        type: enum
        source: input
        description: Which funding models enrollments under this policy may use; HYBRID lets the employee pick per enrollment.
        constraints: "one of {DIRECT_BILL, REIMBURSEMENT, HYBRID}"
      - name: reimbursement_pct
        type: number
        source: input
        description: Share of negotiated tuition the employer covers under the REIMBURSEMENT model.
        constraints: "> 0 and <= 1, at most 2 decimal places"
      - name: max_concurrent_credits
        type: integer
        source: input
        description: Maximum credits an employee may carry across enrollments whose term intervals overlap.
        constraints: ">= 1"
      - name: drop_window_days
        type: integer
        source: input
        description: Days after term_start_date during which a withdrawal releases funding without a repayment obligation.
        constraints: ">= 0"
      - name: service_commitment_months
        type: integer
        source: input
        description: Months of continued employment owed after term_end_date; unserved months prorate the early-departure repayment.
        constraints: ">= 1"
      - name: min_passing_grade_points
        type: number
        source: input
        description: Grade points an outcome must reach for the term to count as academic progress.
        default: 2.00
        constraints: "0.00..4.00, at most 2 decimal places"
      - name: non_catalog_approval_required
        type: boolean
        source: input
        description: When true, employees may request approval of a non-catalog program; when false, POST /program-approval-requests is rejected outright.
        default: true

  - name: Employee
    parent: Employer
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: "FK -> Employer.id; employing organization."
      - name: full_name
        type: string
        source: input
        description: Employee display name.
        constraints: "1..160 chars"
      - name: work_email
        type: string
        source: input
        description: Work mailbox.
        constraints: "must contain '@'"
      - name: hire_date
        type: string
        source: input
        description: Date of hire; tenure is measured from here to the logical clock date.
        constraints: "ISO 8601 date"
      - name: weekly_hours
        type: number
        source: input
        description: Scheduled weekly hours.
        constraints: ">= 0 and <= 80, at most 2 decimal places"
      - name: job_family
        type: enum
        source: input
        description: Job family used for eligibility.
        constraints: "one of {ENGINEERING, OPERATIONS, CLINICAL, RETAIL_FRONTLINE, CORPORATE}"
      - name: employment_status
        type: enum
        source: input
        description: Employment state.
        default: ACTIVE
        constraints: "one of {ACTIVE, LEAVE, TERMINATED}"
      - name: termination_date
        type: string
        source: input
        description: Date employment ended; required when employment_status is set to TERMINATED, otherwise null.
        default: null
        constraints: "ISO 8601 date or null"
      - name: tenure_months
        type: integer
        source: computed
        description: Whole months from hire_date to the logical clock date (a month completes when the day-of-month is reached or passed).
      - name: eligibility_status
        type: enum
        source: computed
        description: "Derived against the employer's current BenefitPolicy (the unique policy with employer_id == this employer, status == ACTIVE, and effective_from <= clock_date < effective_to). Evaluated in this fixed order: no current policy -> INELIGIBLE_NO_POLICY; employment_status != ACTIVE -> INELIGIBLE_EMPLOYMENT; tenure_months < min_tenure_months -> INELIGIBLE_TENURE; weekly_hours < min_weekly_hours -> INELIGIBLE_HOURS; job_family not in eligible_job_families -> INELIGIBLE_JOB_FAMILY; otherwise ELIGIBLE."
        constraints: "one of {ELIGIBLE, INELIGIBLE_NO_POLICY, INELIGIBLE_EMPLOYMENT, INELIGIBLE_TENURE, INELIGIBLE_HOURS, INELIGIBLE_JOB_FAMILY}"
      - name: cap_plan_year
        type: integer
        source: computed
        description: Plan year the cap ledger fields are scoped to; plan_year_of(logical clock date) per calculations.annual_cap_ledger.
      - name: cap_reserved_cents
        type: integer
        source: computed
        description: Cap dollars committed to enrollments not yet paid out (see calculations.annual_cap_ledger).
        default: 0
      - name: cap_disbursed_cents
        type: integer
        source: computed
        description: Cap dollars already paid out and still standing (see calculations.annual_cap_ledger).
        default: 0
      - name: cap_clawback_hold_cents
        type: integer
        source: computed
        description: Cap dollars paid out on enrollments now CLAWED_BACK whose RepaymentObligation is still open (see calculations.annual_cap_ledger).
        default: 0
      - name: cap_available_cents
        type: integer
        source: computed
        description: Remaining headroom for the plan year (see calculations.annual_cap_ledger).
      - name: taxable_excluded_cents_ytd
        type: integer
        source: computed
        description: "Sum of TaxLedgerEntry.excluded_cents for this employee where tax_year equals the calendar year of the logical clock, over all entry_type values."
        default: 0
      - name: imputed_income_cents_ytd
        type: integer
        source: computed
        description: "Sum of TaxLedgerEntry.imputed_income_cents for this employee where tax_year equals the calendar year of the logical clock, over all entry_type values."
        default: 0
      - name: open_repayment_balance_cents
        type: integer
        source: computed
        description: "Sum of RepaymentObligation.balance_cents over obligations whose enrollment_id belongs to this employee and whose status IN {ASSESSED, PARTIALLY_PAID}."
        default: 0
      - name: coaching_hold
        type: boolean
        source: computed
        description: "True when EXISTS an Enrollment with employee_id == this employee, academic_status IN {REGISTERED, IN_PROGRESS, INCOMPLETE} and persistence_tier == HIGH. Blocks new enrollments until coaching lowers the score."
        default: false

  - name: School
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: School legal name.
        constraints: "1..160 chars"
      - name: state_code
        type: string
        source: input
        description: Two-letter US state code of the school's main campus.
        constraints: "exactly 2 uppercase letters"
      - name: contact_email
        type: string
        source: input
        description: School partnerships mailbox.
        constraints: "must contain '@'"
      - name: accreditation_status
        type: enum
        source: input
        description: Accreditation standing; gates agreement activation and non-catalog approval.
        default: ACCREDITED
        constraints: "one of {ACCREDITED, PROBATION, UNACCREDITED}"

  - name: PartnerAgreement
    parent: School
    common_fields: true
    fields:
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; school party to the agreement."
      - name: employer_id
        type: string
        source: input
        description: "FK -> Employer.id; employer party to the agreement."
      - name: negotiated_discount_pct
        type: number
        source: input
        description: Discount off list tuition negotiated for this employer.
        constraints: ">= 0 and <= 0.60, at most 4 decimal places"
      - name: direct_bill_enabled
        type: boolean
        source: input
        description: When true, listings under this agreement may be enrolled under DIRECT_BILL.
        default: false
      - name: effective_from
        type: string
        source: input
        description: Inclusive first date the agreement covers.
        constraints: "ISO 8601 date"
      - name: effective_to
        type: string
        source: input
        description: Inclusive last date the agreement covers; term_start_date of an enrollment must fall inside [effective_from, effective_to].
        constraints: "ISO 8601 date, strictly greater than effective_from"
      - name: status
        type: enum
        source: system
        description: Agreement lifecycle state.
        default: PENDING
        constraints: "one of {PENDING, ACTIVE, TERMINATED}"
      - name: terminated_on
        type: string
        source: system
        description: Logical clock date the agreement was terminated, else null.
        default: null

  - name: Program
    parent: School
    common_fields: true
    fields:
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; offering school."
      - name: name
        type: string
        source: input
        description: Program name.
        constraints: "1..160 chars"
      - name: credential_type
        type: enum
        source: input
        description: Credential awarded; drives the persistence base risk.
        constraints: "one of {CERTIFICATE, ASSOCIATE, BACHELOR, MASTER}"
      - name: skill_track
        type: enum
        source: input
        description: Skill family the program builds; reported as skill attainment on completion.
        constraints: "one of {DATA_ANALYTICS, NURSING, SUPPLY_CHAIN, CYBERSECURITY, BUSINESS_ADMIN}"
      - name: list_tuition_per_credit_cents
        type: integer
        source: input
        description: Published tuition per credit before any negotiated discount.
        constraints: ">= 1"
      - name: total_credits
        type: integer
        source: input
        description: Credits required for the credential.
        constraints: ">= 1"
      - name: term_length_weeks
        type: integer
        source: input
        description: Nominal term length in weeks.
        constraints: ">= 1"

  - name: CatalogListing
    parent: null
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: "FK -> Employer.id; employer whose catalog carries the program."
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the listed program."
      - name: agreement_id
        type: string
        source: input
        description: "FK -> PartnerAgreement.id; null on APPROVED_EXCEPTION listings created by an approved ProgramApprovalRequest."
        default: null
      - name: source_request_id
        type: string
        source: system
        description: "FK -> ProgramApprovalRequest.id; null on catalog-curated listings."
        default: null
      - name: approval_source
        type: enum
        source: system
        description: CATALOG when curated through POST /catalog-listings, APPROVED_EXCEPTION when synthesized by an approved non-catalog request.
        constraints: "one of {CATALOG, APPROVED_EXCEPTION}"
      - name: status
        type: enum
        source: system
        description: Listing availability.
        default: CURATED
        constraints: "one of {CURATED, SUSPENDED}"
      - name: negotiated_tuition_per_credit_cents
        type: integer
        source: computed
        description: Per-credit rate after the negotiated discount (see calculations.negotiated_rate_derivation).
      - name: allowed_funding_models
        type: array
        source: computed
        description: "[DIRECT_BILL, REIMBURSEMENT] when approval_source == CATALOG and the agreement has direct_bill_enabled == true; [REIMBURSEMENT] otherwise (including every APPROVED_EXCEPTION listing)."

  - name: ProgramApprovalRequest
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; requesting employee."
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the non-catalog program being requested."
      - name: justification
        type: string
        source: input
        description: Employee's case for the exception.
        constraints: "1..2000 chars"
      - name: requested_annual_cost_cents
        type: integer
        source: input
        description: Employee's estimate of the annual cost, for the reviewer's context.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Approval workflow state.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, UNDER_REVIEW, CHANGES_REQUESTED, APPROVED, REJECTED}"
      - name: revision_count
        type: integer
        source: computed
        description: Number of completed resubmissions; capped at MAX_REVISION_ROUNDS = 2.
        default: 0
      - name: decision_note
        type: string
        source: system
        description: Reviewer note recorded by the most recent review decision, else null.
        default: null

  - name: Enrollment
    parent: Employee
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the learner."
      - name: catalog_listing_id
        type: string
        source: input
        description: "FK -> CatalogListing.id; listing that authorizes the benefit and supplies the negotiated rate."
      - name: policy_id
        type: string
        source: system
        description: "FK -> BenefitPolicy.id; the employer's current policy pinned at creation. Later policy activations never repoint this field."
      - name: term_code
        type: string
        source: input
        description: Academic term label.
        constraints: "1..16 chars, e.g. '2026-FA'"
      - name: term_start_date
        type: string
        source: input
        description: First day of the term (inclusive).
        constraints: "ISO 8601 date"
      - name: term_end_date
        type: string
        source: input
        description: Last day of the term (inclusive); term intervals are closed on both ends for overlap purposes.
        constraints: "ISO 8601 date, strictly greater than term_start_date"
      - name: credits
        type: integer
        source: input
        description: Credits attempted this term.
        constraints: ">= 1 and <= 30"
      - name: funding_model
        type: enum
        source: input
        description: Effective funding model; required only when the pinned policy's funding_model is HYBRID, otherwise defaults to the policy's value and must match it when supplied.
        constraints: "one of {DIRECT_BILL, REIMBURSEMENT}"
      - name: plan_year
        type: integer
        source: computed
        description: plan_year_of(term_start_date) per calculations.annual_cap_ledger; the cap bucket this enrollment consumes.
      - name: drop_deadline_date
        type: string
        source: computed
        description: term_start_date + policy.drop_window_days; a withdrawal on or before this date releases funding with no repayment obligation.
      - name: gross_tuition_cents
        type: integer
        source: computed
        description: listing.negotiated_tuition_per_credit_cents * credits (see calculations.benefit_award_computation).
      - name: employer_reserved_cents
        type: integer
        source: computed
        description: Provisional employer entitlement held against the cap at creation (variant provisional_reserve).
      - name: employer_settled_cents
        type: integer
        source: computed
        description: Final employer entitlement determined when money moves (variant direct_bill_upfront_final or reimbursement_outcome_conditioned_final).
        default: 0
      - name: employer_disbursed_cents
        type: integer
        source: computed
        description: Money actually paid out on this enrollment (invoice payment or approved claim); zeroed only by a full reversal is NOT performed — the value is retained and the enrollment moves to CLAWED_BACK.
        default: 0
      - name: employee_share_cents
        type: integer
        source: computed
        description: "gross_tuition_cents - employer_reserved_cents while funding_status IN {RESERVED, BILLED}; gross_tuition_cents - employer_settled_cents while funding_status IN {SETTLED, CLAWED_BACK}; gross_tuition_cents when funding_status == RELEASED."
      - name: academic_status
        type: enum
        source: system
        description: Academic axis of the enrollment lifecycle.
        default: REGISTERED
        constraints: "one of {REGISTERED, IN_PROGRESS, PASSED, FAILED, WITHDRAWN, INCOMPLETE}"
      - name: funding_status
        type: enum
        source: system
        description: Money axis of the enrollment lifecycle; advances independently of academic_status.
        default: RESERVED
        constraints: "one of {RESERVED, BILLED, SETTLED, RELEASED, CLAWED_BACK}"
      - name: credits_earned
        type: integer
        source: computed
        description: credits_earned of the latest AcademicOutcome for this enrollment, else 0.
        default: 0
      - name: persistence_risk_score
        type: integer
        source: computed
        description: 0..100 persistence risk (see calculations.persistence_risk_score).
      - name: persistence_tier
        type: enum
        source: computed
        description: "LOW when persistence_risk_score < 30, MEDIUM when 30 <= score < 60, HIGH when score >= 60."
        constraints: "one of {LOW, MEDIUM, HIGH}"
      - name: last_session_date
        type: string
        source: computed
        description: session_date of the most recent CoachingSession for this enrollment (session_date DESC, tie-break created_at ASC), else null.
        default: null

  - name: TuitionInvoice
    parent: Enrollment
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: system
        description: "FK -> Enrollment.id; the enrollment being billed."
      - name: amount_cents
        type: integer
        source: computed
        description: employer_reserved_cents of the enrollment at the moment registration was confirmed.
      - name: due_date
        type: string
        source: computed
        description: term_start_date + 30 days.
      - name: status
        type: enum
        source: system
        description: Invoice lifecycle state.
        default: ISSUED
        constraints: "one of {ISSUED, APPROVED_FOR_PAYMENT, PAID, VOIDED}"
      - name: paid_on
        type: string
        source: system
        description: Logical clock date the invoice was paid, else null.
        default: null

  - name: ReimbursementClaim
    parent: Enrollment
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment being reimbursed."
      - name: amount_requested_cents
        type: integer
        source: input
        description: Amount the employee asks to be reimbursed.
        constraints: ">= 1"
      - name: receipt_reference
        type: string
        source: input
        description: School receipt identifier supporting the claim.
        constraints: "1..64 chars"
      - name: status
        type: enum
        source: system
        description: Claim lifecycle state.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, APPROVED, REJECTED}"
      - name: approved_amount_cents
        type: integer
        source: computed
        description: Amount approved and disbursed (see calculations.reimbursement_settlement).
        default: 0
      - name: platform_admin_fee_cents
        type: integer
        source: computed
        description: Guild platform fee charged to the employer on this settlement (see calculations.reimbursement_settlement).
        default: 0
      - name: decision_note
        type: string
        source: system
        description: Reviewer note recorded at decision time, else null.
        default: null

  - name: AcademicOutcome
    parent: Enrollment
    common_fields: false
    fields:
      - name: enrollment_id
        type: string
        source: system
        description: "FK -> Enrollment.id; the enrollment the outcome closes."
      - name: term_code
        type: string
        source: input
        description: Term the outcome reports; must equal the enrollment's term_code.
        constraints: "1..16 chars"
      - name: completion_status
        type: enum
        source: input
        description: Academic result reported by the school.
        constraints: "one of {PASSED, FAILED, WITHDRAWN, INCOMPLETE}"
      - name: grade_points
        type: number
        source: input
        description: Grade points earned; required when completion_status IN {PASSED, FAILED}, must be null otherwise.
        default: null
        constraints: "0.00..4.00, at most 2 decimal places, or null"
      - name: credits_earned
        type: integer
        source: input
        description: Credits actually earned this term.
        constraints: ">= 0 and <= the enrollment's credits"
      - name: posted_on
        type: string
        source: system
        description: Logical clock date the outcome was posted.
      - name: posted_by_role
        type: enum
        source: system
        description: SCHOOL_PARTNER when posted through the outcomes endpoint, SYSTEM when synthesized by the term-close run.
        constraints: "one of {SCHOOL_PARTNER, SYSTEM}"

  - name: RepaymentObligation
    parent: Enrollment
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: system
        description: "FK -> Enrollment.id; the enrollment whose benefit is being recovered."
      - name: trigger_reason
        type: enum
        source: system
        description: Why the obligation was assessed.
        constraints: "one of {ACADEMIC_FAILURE, EARLY_DEPARTURE, WITHDRAWAL_AFTER_DROP_WINDOW}"
      - name: principal_cents
        type: integer
        source: computed
        description: Amount assessed (see calculations.repayment_assessment).
      - name: paid_cents
        type: integer
        source: computed
        description: Sum of accepted repayment amounts.
        default: 0
      - name: waived_cents
        type: integer
        source: computed
        description: Amount forgiven by the benefit administrator; 0 or the whole outstanding balance at waive time.
        default: 0
      - name: balance_cents
        type: integer
        source: computed
        description: principal_cents - paid_cents - waived_cents.
      - name: status
        type: enum
        source: system
        description: Obligation lifecycle state.
        default: ASSESSED
        constraints: "one of {ASSESSED, PARTIALLY_PAID, SETTLED, WAIVED}"
      - name: assessed_on
        type: string
        source: system
        description: Logical clock date the obligation was assessed.

  - name: TaxLedgerEntry
    parent: Employee
    common_fields: false
    fields:
      - name: employee_id
        type: string
        source: system
        description: "FK -> Employee.id; the taxpayer."
      - name: enrollment_id
        type: string
        source: system
        description: "FK -> Enrollment.id; the enrollment that moved the money; null on TRUE_UP entries, which are annual-scope."
        default: null
      - name: entry_type
        type: enum
        source: system
        description: BENEFIT on disbursement, REVERSAL on clawback, TRUE_UP on the annual aggregate reconciliation.
        constraints: "one of {BENEFIT, REVERSAL, TRUE_UP}"
      - name: tax_year
        type: integer
        source: system
        description: Calendar year of the logical clock when the entry was appended.
      - name: benefit_cents
        type: integer
        source: system
        description: Signed benefit amount (negative on REVERSAL, always 0 on TRUE_UP).
      - name: excluded_cents
        type: integer
        source: system
        description: Signed portion excluded from income under the §127 limit.
      - name: imputed_income_cents
        type: integer
        source: system
        description: Signed portion added to the employee's taxable wages; benefit_cents == excluded_cents + imputed_income_cents on every entry.
      - name: posted_at
        type: datetime
        source: system
        description: Logical clock instant the entry was appended (ISO 8601 UTC, three fractional digits).

  - name: CoachingSession
    parent: Enrollment
    common_fields: false
    fields:
      - name: enrollment_id
        type: string
        source: system
        description: "FK -> Enrollment.id; the enrollment being advised."
      - name: coach_user_id
        type: string
        source: system
        description: Opaque operator id copied from the acting Coach's X-User-ID header; NOT a foreign key to any entity.
      - name: session_date
        type: string
        source: input
        description: Date the session took place; must not be after the logical clock date.
        constraints: "ISO 8601 date"
      - name: modality
        type: enum
        source: input
        description: How the session was delivered.
        constraints: "one of {PHONE, VIDEO, IN_PERSON, ASYNC_MESSAGE}"
      - name: risk_flags
        type: array
        source: input
        description: Risk factors the coach observed.
        default: []
        constraints: "subset of {FINANCIAL_STRESS, SCHEDULE_CONFLICT, ACADEMIC_STRUGGLE, LOW_ENGAGEMENT, CARE_RESPONSIBILITY}, no duplicates"
      - name: notes
        type: string
        source: input
        description: Free-text advising note.
        default: null
        constraints: "0..2000 chars or null"
      - name: persistence_risk_score_after
        type: integer
        source: computed
        description: Enrollment.persistence_risk_score as recomputed at the end of this session's request.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: BenefitPolicy
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /benefit-policies/{id}/activate"
        actor: BenefitAdministrator
        preconditions:
          - "policy.status == DRAFT"
          - "X-User-ID == policy.employer_id"
          - "no other BenefitPolicy of the same employer with status == ACTIVE has a half-open window [effective_from, effective_to) that intersects this policy's window (touching endpoints do not intersect)"
        side_effects:
          - "policy.status = ACTIVE"
          - "every Employee of this employer recomputes eligibility_status, cap_plan_year, cap_reserved_cents, cap_disbursed_cents, cap_clawback_hold_cents and cap_available_cents against the employer's current policy, processed in Employee.created_at ASC order; each recomputed Employee has updated_at refreshed and version incremented by 1"
          - "existing Enrollment rows keep their pinned policy_id and their already-computed money fields unchanged"
        note: "Version-pinning: activation never repoints Enrollment.policy_id."
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event during POST /_ops/term-close (policy window elapsed)"
        actor: system
        preconditions:
          - "policy.status == ACTIVE"
          - "policy.effective_to <= logical clock date"
        side_effects:
          - "policy.status = SUPERSEDED"
          - "every Employee of this employer recomputes eligibility_status (an employer with no current policy yields INELIGIBLE_NO_POLICY), processed in Employee.created_at ASC order"

  - entity: PartnerAgreement
    state_field: status
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /partner-agreements/{id}/activate"
        actor: BenefitAdministrator
        preconditions:
          - "agreement.status == PENDING"
          - "X-User-ID == agreement.employer_id"
          - "School(agreement.school_id).accreditation_status != UNACCREDITED"
        side_effects:
          - "agreement.status = ACTIVE"
          - "agreement.version incremented by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /partner-agreements/{id}/terminate"
        actor: BenefitAdministrator
        preconditions:
          - "agreement.status == ACTIVE"
          - "X-User-ID == agreement.employer_id"
        side_effects:
          - "agreement.status = TERMINATED, terminated_on = logical clock date, version incremented by 1"
          - "CASCADE hop 1: every CatalogListing with agreement_id == this agreement and status == CURATED moves to SUSPENDED (processed in CatalogListing.created_at ASC order)"
          - "CASCADE hop 2: because those listings are SUSPENDED, every Enrollment on them with academic_status == REGISTERED moves academic_status to WITHDRAWN and funding_status from RESERVED or BILLED to RELEASED (enrollments already IN_PROGRESS are deliberately left running)"
          - "CASCADE hop 3: because those enrollments are RELEASED, each of their TuitionInvoice rows with status IN {ISSUED, APPROVED_FOR_PAYMENT} moves to VOIDED and each affected Employee's cap ledger is recomputed"
          - "CASCADE hop 2b: every ProgramApprovalRequest with status IN {SUBMITTED, UNDER_REVIEW, CHANGES_REQUESTED} whose program_id belongs to agreement.school_id moves to REJECTED with decision_note 'school partnership terminated'"

  - entity: ProgramApprovalRequest
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /program-approval-requests/{id}/review"
        actor: BenefitAdministrator
        preconditions:
          - "request.status == SUBMITTED"
          - "X-User-ID == Employee(request.employee_id).employer_id"
        side_effects:
          - "request.status = UNDER_REVIEW"
      - from: UNDER_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /program-approval-requests/{id}/decide with decision == REQUEST_CHANGES"
        actor: BenefitAdministrator
        preconditions:
          - "request.status == UNDER_REVIEW"
          - "X-User-ID == Employee(request.employee_id).employer_id"
        side_effects:
          - "request.status = CHANGES_REQUESTED, decision_note = supplied note"
        note: "Opens the revision cycle; no CatalogListing is created on this branch."
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /program-approval-requests/{id}/resubmit"
        actor: Employee
        preconditions:
          - "request.status == CHANGES_REQUESTED"
          - "X-User-ID == request.employee_id"
          - "request.revision_count < 2 (MAX_REVISION_ROUNDS)"
        side_effects:
          - "request.status = SUBMITTED, revision_count incremented by 1"
          - "justification and requested_annual_cost_cents replaced when supplied"
        note: "The cycle CHANGES_REQUESTED -> SUBMITTED -> UNDER_REVIEW -> CHANGES_REQUESTED may run at most twice; the third resubmit is rejected with ERR_REVISION_LIMIT_REACHED."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /program-approval-requests/{id}/decide with decision == APPROVE"
        actor: BenefitAdministrator
        preconditions:
          - "request.status == UNDER_REVIEW"
          - "X-User-ID == Employee(request.employee_id).employer_id"
          - "School(Program(request.program_id).school_id).accreditation_status == ACCREDITED"
          - "Employee(request.employee_id).eligibility_status == ELIGIBLE"
        side_effects:
          - "request.status = APPROVED, decision_note = supplied note"
          - "a CatalogListing is created with employer_id = the requesting employee's employer, program_id = request.program_id, agreement_id = null, source_request_id = request.id, approval_source = APPROVED_EXCEPTION, status = CURATED, negotiated_tuition_per_credit_cents = program.list_tuition_per_credit_cents (no discount), allowed_funding_models = [REIMBURSEMENT]"
        note: "Branch divergence: APPROVE materialises a listing, REJECT and REQUEST_CHANGES never do."
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /program-approval-requests/{id}/decide with decision == REJECT"
        actor: BenefitAdministrator
        preconditions:
          - "request.status == UNDER_REVIEW"
          - "X-User-ID == Employee(request.employee_id).employer_id"
        side_effects:
          - "request.status = REJECTED, decision_note = supplied note"
          - "no CatalogListing is created"
      - from: SUBMITTED
        to: REJECTED
        trigger: "system event during POST /partner-agreements/{id}/terminate (cascade hop 2b)"
        actor: system
        preconditions:
          - "request.status IN {SUBMITTED, UNDER_REVIEW, CHANGES_REQUESTED}"
          - "Program(request.program_id).school_id == the terminated agreement's school_id"
        side_effects:
          - "request.status = REJECTED, decision_note = 'school partnership terminated'"

  - entity: Enrollment
    state_field: academic_status
    initial_state: REGISTERED
    terminal_states: [PASSED, FAILED, WITHDRAWN, INCOMPLETE]
    transitions:
      - from: REGISTERED
        to: IN_PROGRESS
        trigger: "POST /enrollments/{id}/confirm-registration"
        actor: SchoolPartner
        preconditions:
          - "enrollment.academic_status == REGISTERED"
          - "enrollment.funding_status == RESERVED"
          - "CatalogListing(enrollment.catalog_listing_id).status == CURATED"
          - "X-User-ID == Program(listing.program_id).school_id"
        side_effects:
          - "academic_status = IN_PROGRESS"
          - "when enrollment.funding_model == DIRECT_BILL: a TuitionInvoice is created with amount_cents = enrollment.employer_reserved_cents, due_date = term_start_date + 30 days, status = ISSUED, and funding_status moves RESERVED -> BILLED"
          - "when enrollment.funding_model == REIMBURSEMENT: no invoice is created and funding_status stays RESERVED"
          - "persistence_risk_score and persistence_tier recomputed; the owning Employee's coaching_hold recomputed"
        note: "Fork point: the two funding models produce disjoint side-effect sets from one trigger."
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /enrollments/{id}/academic-outcomes with completion_status == PASSED"
        actor: SchoolPartner
        preconditions:
          - "enrollment.academic_status == IN_PROGRESS"
          - "outcome.term_code == enrollment.term_code"
          - "outcome.grade_points >= policy.min_passing_grade_points"
          - "X-User-ID == Program(listing.program_id).school_id"
        side_effects:
          - "academic_status = PASSED, credits_earned = outcome.credits_earned"
          - "persistence_risk_score and persistence_tier recomputed; Employee.coaching_hold recomputed"
          - "funding_status is NOT touched — a REIMBURSEMENT enrollment stays RESERVED until a claim is approved, a DIRECT_BILL enrollment stays wherever its invoice left it"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /enrollments/{id}/academic-outcomes with completion_status == FAILED"
        actor: SchoolPartner
        preconditions:
          - "enrollment.academic_status == IN_PROGRESS"
          - "outcome.term_code == enrollment.term_code"
          - "X-User-ID == Program(listing.program_id).school_id"
        side_effects:
          - "academic_status = FAILED, credits_earned = outcome.credits_earned"
          - "CASCADE hop 1 -> 2: because academic_status became FAILED while funding_status == SETTLED, a RepaymentObligation is created with trigger_reason = ACADEMIC_FAILURE and principal_cents = enrollment.employer_disbursed_cents, and funding_status moves SETTLED -> CLAWED_BACK"
          - "CASCADE hop 2 -> 3: because funding_status became CLAWED_BACK, a REVERSAL TaxLedgerEntry mirroring the assessed principal is appended (see calculations.tax_exclusion_split)"
          - "CASCADE hop 3 -> 4: because the REVERSAL entry landed, Employee.taxable_excluded_cents_ytd, Employee.imputed_income_cents_ytd, Employee.cap_disbursed_cents, Employee.cap_clawback_hold_cents, Employee.cap_available_cents, Employee.open_repayment_balance_cents and Employer.total_disbursed_cents / total_imputed_income_cents are recomputed"
          - "when funding_status is RESERVED or BILLED instead of SETTLED, no obligation and no reversal are produced; funding_status moves to RELEASED and any open invoice is VOIDED"
          - "persistence_risk_score and persistence_tier recomputed; Employee.coaching_hold recomputed"
      - from: IN_PROGRESS
        to: INCOMPLETE
        trigger: "POST /enrollments/{id}/academic-outcomes with completion_status == INCOMPLETE, or system event during POST /_ops/term-close when the term closed with no outcome posted"
        actor: SchoolPartner
        preconditions:
          - "enrollment.academic_status == IN_PROGRESS"
          - "for the system path: enrollment.term_code == the closing term_code and no AcademicOutcome exists for the enrollment"
        side_effects:
          - "academic_status = INCOMPLETE; on the system path an AcademicOutcome with completion_status = INCOMPLETE, grade_points = null, credits_earned = 0 and posted_by_role = SYSTEM is appended"
          - "the same clawback cascade as the FAILED transition runs when funding_status == SETTLED"
          - "persistence_risk_score and persistence_tier recomputed; Employee.coaching_hold recomputed"
      - from: REGISTERED
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/withdraw"
        actor: Employee
        preconditions:
          - "enrollment.academic_status IN {REGISTERED, IN_PROGRESS}"
          - "X-User-ID == enrollment.employee_id"
        side_effects:
          - "academic_status = WITHDRAWN; an AcademicOutcome with completion_status = WITHDRAWN, grade_points = null, credits_earned = 0, posted_by_role = SYSTEM is appended"
          - "when logical clock date <= drop_deadline_date: funding_status moves RESERVED or BILLED -> RELEASED, any TuitionInvoice with status IN {ISSUED, APPROVED_FOR_PAYMENT} moves to VOIDED, and no RepaymentObligation is created"
          - "when logical clock date > drop_deadline_date and funding_status == SETTLED: a RepaymentObligation with trigger_reason = WITHDRAWAL_AFTER_DROP_WINDOW and principal_cents = employer_disbursed_cents is created, funding_status moves SETTLED -> CLAWED_BACK and a REVERSAL TaxLedgerEntry is appended"
          - "Employee cap ledger, tax aggregates, open_repayment_balance_cents and coaching_hold recomputed; Employer aggregates recomputed"
      - from: IN_PROGRESS
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/withdraw"
        actor: Employee
        preconditions:
          - "enrollment.academic_status == IN_PROGRESS"
          - "X-User-ID == enrollment.employee_id"
        side_effects:
          - "identical to the REGISTERED -> WITHDRAWN transition"
      - from: REGISTERED
        to: WITHDRAWN
        trigger: "system event during PATCH /employees/{id} (employment_status -> TERMINATED) or POST /partner-agreements/{id}/terminate"
        actor: system
        preconditions:
          - "enrollment.academic_status IN {REGISTERED, IN_PROGRESS}"
        side_effects:
          - "academic_status = WITHDRAWN, funding_status moves RESERVED or BILLED -> RELEASED, open invoices VOIDED, cap ledger recomputed"

  - entity: Enrollment
    state_field: funding_status
    initial_state: RESERVED
    terminal_states: [RELEASED, CLAWED_BACK]
    transitions:
      - from: RESERVED
        to: BILLED
        trigger: "system event during POST /enrollments/{id}/confirm-registration when funding_model == DIRECT_BILL"
        actor: system
        preconditions:
          - "enrollment.funding_status == RESERVED"
          - "enrollment.funding_model == DIRECT_BILL"
        side_effects:
          - "funding_status = BILLED; a TuitionInvoice is created in status ISSUED"
      - from: BILLED
        to: SETTLED
        trigger: "POST /tuition-invoices/{id}/pay"
        actor: PlatformAdmin
        preconditions:
          - "enrollment.funding_status == BILLED"
          - "invoice.status == APPROVED_FOR_PAYMENT"
          - "enrollment.academic_status != WITHDRAWN"
        side_effects:
          - "funding_status = SETTLED, employer_settled_cents = invoice.amount_cents, employer_disbursed_cents = invoice.amount_cents (variant direct_bill_upfront_final — paid up front, before any academic outcome exists)"
          - "a BENEFIT TaxLedgerEntry is appended per calculations.tax_exclusion_split"
          - "Employee cap ledger and tax aggregates recomputed; Employer.total_disbursed_cents and total_imputed_income_cents recomputed"
      - from: RESERVED
        to: SETTLED
        trigger: "POST /reimbursement-claims/{id}/decide with decision == APPROVE"
        actor: BenefitAdministrator
        preconditions:
          - "enrollment.funding_status == RESERVED"
          - "enrollment.academic_status == PASSED"
          - "claim.status == SUBMITTED"
        side_effects:
          - "funding_status = SETTLED, employer_settled_cents = employer_disbursed_cents = claim.approved_amount_cents (variant reimbursement_outcome_conditioned_final)"
          - "claim.platform_admin_fee_cents computed from the employer's pre-settlement total_disbursed_cents"
          - "a BENEFIT TaxLedgerEntry is appended per calculations.tax_exclusion_split"
          - "Employee cap ledger and tax aggregates recomputed; Employer.total_disbursed_cents and total_admin_fee_cents recomputed"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /reimbursement-claims/{id}/decide with decision == REJECT, POST /enrollments/{id}/withdraw on or before drop_deadline_date, PATCH /employees/{id} termination cascade, or POST /partner-agreements/{id}/terminate cascade"
        actor: BenefitAdministrator
        preconditions:
          - "enrollment.funding_status == RESERVED"
        side_effects:
          - "funding_status = RELEASED, employer_reserved_cents retained for audit but excluded from the cap ledger, employee_share_cents = gross_tuition_cents"
          - "Employee.cap_reserved_cents and cap_available_cents recomputed"
      - from: BILLED
        to: RELEASED
        trigger: "POST /enrollments/{id}/withdraw on or before drop_deadline_date, or a termination/agreement-termination cascade"
        actor: Employee
        preconditions:
          - "enrollment.funding_status == BILLED"
          - "no TuitionInvoice of this enrollment has status == PAID"
        side_effects:
          - "funding_status = RELEASED; every TuitionInvoice with status IN {ISSUED, APPROVED_FOR_PAYMENT} moves to VOIDED"
          - "Employee.cap_reserved_cents and cap_available_cents recomputed"
      - from: SETTLED
        to: CLAWED_BACK
        trigger: "system event on FAILED/INCOMPLETE outcome, on withdrawal after drop_deadline_date, or on PATCH /employees/{id} with employment_status == TERMINATED inside the service commitment"
        actor: system
        preconditions:
          - "enrollment.funding_status == SETTLED"
          - "a RepaymentObligation is being assessed for this enrollment"
        side_effects:
          - "funding_status = CLAWED_BACK; employer_disbursed_cents retained; the enrollment's disbursed amount moves from Employee.cap_disbursed_cents into Employee.cap_clawback_hold_cents"
          - "a REVERSAL TaxLedgerEntry mirroring the assessed principal is appended"
          - "Employer.total_disbursed_cents and total_imputed_income_cents recomputed"

  - entity: TuitionInvoice
    state_field: status
    initial_state: ISSUED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: ISSUED
        to: APPROVED_FOR_PAYMENT
        trigger: "POST /tuition-invoices/{id}/approve-payment"
        actor: BenefitAdministrator
        preconditions:
          - "invoice.status == ISSUED"
          - "Enrollment(invoice.enrollment_id).academic_status IN {REGISTERED, IN_PROGRESS}"
          - "X-User-ID == Employee(enrollment.employee_id).employer_id"
        side_effects:
          - "invoice.status = APPROVED_FOR_PAYMENT"
      - from: APPROVED_FOR_PAYMENT
        to: PAID
        trigger: "POST /tuition-invoices/{id}/pay"
        actor: PlatformAdmin
        preconditions:
          - "invoice.status == APPROVED_FOR_PAYMENT"
          - "Enrollment(invoice.enrollment_id).academic_status != WITHDRAWN"
        side_effects:
          - "invoice.status = PAID, paid_on = logical clock date"
          - "the enrollment's funding_status moves BILLED -> SETTLED with the full up-front cascade (tax entry, cap ledger, employer aggregates)"
        note: "Segregation of duties: the employer approves, the platform disburses."
      - from: ISSUED
        to: VOIDED
        trigger: "system event on withdrawal within the drop window, termination cascade, or agreement-termination cascade"
        actor: system
        preconditions:
          - "invoice.status IN {ISSUED, APPROVED_FOR_PAYMENT}"
        side_effects:
          - "invoice.status = VOIDED"

  - entity: ReimbursementClaim
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /reimbursement-claims/{id}/decide with decision == APPROVE"
        actor: BenefitAdministrator
        preconditions:
          - "claim.status == SUBMITTED"
          - "Enrollment(claim.enrollment_id).academic_status == PASSED"
          - "Enrollment(claim.enrollment_id).funding_status == RESERVED"
          - "X-User-ID == Employee(enrollment.employee_id).employer_id"
        side_effects:
          - "claim.status = APPROVED, approved_amount_cents and platform_admin_fee_cents computed per calculations.reimbursement_settlement"
          - "the enrollment's funding_status moves RESERVED -> SETTLED with the BENEFIT tax entry and ledger recomputes"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /reimbursement-claims/{id}/decide with decision == REJECT"
        actor: BenefitAdministrator
        preconditions:
          - "claim.status == SUBMITTED"
          - "X-User-ID == Employee(enrollment.employee_id).employer_id"
        side_effects:
          - "claim.status = REJECTED, approved_amount_cents stays 0, platform_admin_fee_cents stays 0"
          - "the enrollment's funding_status moves RESERVED -> RELEASED and Employee.cap_reserved_cents / cap_available_cents are recomputed"
        note: "Branch divergence: APPROVE settles and taxes, REJECT releases the reservation and appends no tax entry."

  - entity: RepaymentObligation
    state_field: status
    initial_state: ASSESSED
    terminal_states: [SETTLED, WAIVED]
    transitions:
      - from: ASSESSED
        to: PARTIALLY_PAID
        trigger: "POST /repayment-obligations/{id}/payments with amount_cents < balance_cents"
        actor: Employee
        preconditions:
          - "obligation.status == ASSESSED"
          - "amount_cents <= obligation.balance_cents"
          - "X-User-ID == Employee of Enrollment(obligation.enrollment_id)"
        side_effects:
          - "paid_cents increased by amount_cents, balance_cents recomputed, status = PARTIALLY_PAID"
          - "Employee.open_repayment_balance_cents recomputed; the cap clawback hold is NOT released while a balance remains"
      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /repayment-obligations/{id}/payments with amount_cents < balance_cents"
        actor: Employee
        preconditions:
          - "obligation.status == PARTIALLY_PAID"
          - "amount_cents <= obligation.balance_cents"
        side_effects:
          - "paid_cents increased, balance_cents recomputed, status stays PARTIALLY_PAID"
        note: "Self-loop: repeated partial payments keep the obligation in PARTIALLY_PAID until the balance hits zero."
      - from: ASSESSED
        to: SETTLED
        trigger: "POST /repayment-obligations/{id}/payments with amount_cents == balance_cents"
        actor: Employee
        preconditions:
          - "obligation.status IN {ASSESSED, PARTIALLY_PAID}"
          - "amount_cents == obligation.balance_cents"
        side_effects:
          - "paid_cents increased to principal_cents - waived_cents, balance_cents = 0, status = SETTLED"
          - "because the employer has been made whole, the enrollment's amount leaves Employee.cap_clawback_hold_cents and cap_available_cents rises by that amount"
          - "Employee.open_repayment_balance_cents recomputed"
      - from: ASSESSED
        to: WAIVED
        trigger: "POST /repayment-obligations/{id}/waive"
        actor: BenefitAdministrator
        preconditions:
          - "obligation.status IN {ASSESSED, PARTIALLY_PAID}"
          - "X-User-ID == Employee(enrollment.employee_id).employer_id"
        side_effects:
          - "waived_cents = balance_cents at waive time, balance_cents = 0, status = WAIVED"
          - "the employer absorbed the cost, so the amount STAYS in Employee.cap_clawback_hold_cents and cap_available_cents does not rise"
          - "Employee.open_repayment_balance_cents recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: enrollment-create-stale-employee
    parent_entity: Employee
    write_endpoint: "POST /enrollments"
    occ_field: "expected_employee_version"
    description: |
      Creating an Enrollment against an Employee whose version has advanced since
      the client last read it is rejected. This captures the case where another
      writer has already consumed part of the same annual cap (a new enrollment,
      a settlement, a clawback or a policy activation all bump the Employee row),
      so the cap headroom the current writer reasoned about is stale. A second
      enrollment is legitimate business behaviour on its own, which is why the
      rule is expressed as a version precondition rather than a state check.
    error_id: ERR_STALE_EMPLOYEE_VERSION
    http_status: 412

  - rule_id: listing-create-stale-agreement
    parent_entity: PartnerAgreement
    write_endpoint: "POST /catalog-listings"
    occ_field: "expected_agreement_version"
    description: |
      Curating a CatalogListing against a PartnerAgreement whose version has
      advanced since the client last read it is rejected. The negotiated discount
      that the listing's per-credit rate is derived from lives on the agreement,
      so a stale view would freeze an outdated rate into the catalog. Curating a
      second listing under the same agreement is legitimate, so the guard is a
      version precondition rather than a state check.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: negotiated_rate_derivation
    trigger: "POST /catalog-listings, and the CatalogListing synthesized by POST /program-approval-requests/{id}/decide with decision == APPROVE"
    algorithm: tiered_pricing
    formula: |
      if listing.approval_source == CATALOG:
          discount = PartnerAgreement(listing.agreement_id).negotiated_discount_pct
      else:  # APPROVED_EXCEPTION — no agreement exists, so no discount is negotiated
          discount = 0.0000

      # PINNED ROUNDING ORDER: the per-credit rate is rounded to whole cents HERE, once,
      # and the rounded rate is what gets multiplied by credits in
      # benefit_award_computation. The alternative order (multiply the exact product by
      # credits and round the total) yields a different total whenever the exact
      # per-credit product carries a half-cent remainder.
      negotiated_tuition_per_credit_cents = round_half_up(
          Program(listing.program_id).list_tuition_per_credit_cents * (1 - discount))

      allowed_funding_models =
          [DIRECT_BILL, REIMBURSEMENT] if (listing.approval_source == CATALOG
                                           and agreement.direct_bill_enabled == true)
          else [REIMBURSEMENT]
    input_set: "Exactly one Program and, for CATALOG listings, exactly one PartnerAgreement with status == ACTIVE. Never re-derived after creation: an agreement terminated later suspends the listing but never rewrites its rate."
    constants: {}
    precision: "integer cents, round_half_up, applied exactly once at the per-credit rate"

  - name: benefit_award_computation
    trigger: "POST /enrollments (variant provisional_reserve); POST /tuition-invoices/{id}/pay (variant direct_bill_upfront_final); POST /reimbursement-claims/{id}/decide with decision == APPROVE (variant reimbursement_outcome_conditioned_final)"
    algorithm: nested_min_allocation
    formula: |
      gross_tuition_cents = listing.negotiated_tuition_per_credit_cents * enrollment.credits

      # --- variant provisional_reserve (at creation) --------------------------------
      if effective_funding_model == DIRECT_BILL:
          uncapped_cents = gross_tuition_cents                       # employer fronts 100%
      else:
          uncapped_cents = round_half_up(gross_tuition_cents * policy.reimbursement_pct)
      employer_reserved_cents = min(uncapped_cents, employee.cap_available_cents)
      employee_share_cents    = gross_tuition_cents - employer_reserved_cents

      # --- variant direct_bill_upfront_final (at invoice payment) -------------------
      # Money leaves before any AcademicOutcome exists, so no earned-credit or grade
      # input participates.
      employer_settled_cents  = invoice.amount_cents            # == employer_reserved_cents
      employer_disbursed_cents = invoice.amount_cents

      # --- variant reimbursement_outcome_conditioned_final (at claim approval) ------
      # Same enrollment, same policy, same credits — but conditioned on the outcome,
      # so it diverges from the provisional reserve in both directions.
      earned_ratio_base_cents = round_half_up(
          gross_tuition_cents * (latest_outcome.credits_earned / enrollment.credits))
      effective_pct = min(1.00, policy.reimbursement_pct
                                + (GRADE_BONUS_PCT if latest_outcome.grade_points >= GRADE_BONUS_MIN_POINTS else 0))
      uncapped_final_cents = round_half_up(earned_ratio_base_cents * effective_pct)
      employer_settled_cents = min(uncapped_final_cents,
                                   employer_reserved_cents + employee.cap_available_cents)
    input_set: "One Enrollment, its pinned BenefitPolicy, its CatalogListing, the acting Employee's cap ledger, and — for the reimbursement final variant only — the latest AcademicOutcome of the enrollment (AcademicOutcome.created_at DESC, tie-break created_at ASC is impossible because the enrollment admits at most one outcome per term_code)."
    constants:
      GRADE_BONUS_PCT: 0.10
      GRADE_BONUS_MIN_POINTS: 3.50
    precision: "integer cents, round_half_up; in the reimbursement final variant the earned-credit base is rounded BEFORE the percentage is applied, and each round_half_up shown is applied in the order written"
    variants:
      - name: provisional_reserve
        when: "POST /enrollments"
        difference: "Uses the policy percentage against full attempted credits with no grade bonus, capped by cap_available_cents only."
      - name: direct_bill_upfront_final
        when: "POST /tuition-invoices/{id}/pay"
        difference: "Pays 100% of negotiated tuition with no academic condition at all; academic performance is recovered afterwards through a RepaymentObligation."
      - name: reimbursement_outcome_conditioned_final
        when: "POST /reimbursement-claims/{id}/decide with decision == APPROVE"
        difference: "Scales by credits_earned / credits, adds GRADE_BONUS_PCT when grade_points >= 3.50, and is capped by employer_reserved_cents + cap_available_cents — so it can exceed the provisional reserve."

  - name: annual_cap_ledger
    trigger: "Recomputed on every mutation that touches an Employee's enrollments or obligations: POST /enrollments, POST /enrollments/{id}/withdraw, POST /tuition-invoices/{id}/pay, POST /reimbursement-claims/{id}/decide, POST /enrollments/{id}/academic-outcomes, POST /repayment-obligations/{id}/payments, POST /repayment-obligations/{id}/waive, PATCH /employees/{id}, POST /benefit-policies/{id}/activate, POST /_ops/term-close"
    algorithm: aggregation
    formula: |
      plan_year_of(d) = d.year if d.month >= employer.fiscal_year_start_month else d.year - 1

      employee.cap_plan_year = plan_year_of(logical_clock_date)
      scope = { e in Enrollment : e.employee_id == employee.id
                                  and e.plan_year == employee.cap_plan_year }

      cap_reserved_cents = sum(e.employer_reserved_cents
                               for e in scope if e.funding_status IN {RESERVED, BILLED})
      cap_disbursed_cents = sum(e.employer_disbursed_cents
                                for e in scope if e.funding_status == SETTLED)
      cap_clawback_hold_cents = sum(e.employer_disbursed_cents
                                    for e in scope
                                    if e.funding_status == CLAWED_BACK
                                    and the RepaymentObligation of e has status IN {ASSESSED, PARTIALLY_PAID, WAIVED})
      # RELEASED enrollments and CLAWED_BACK enrollments whose obligation reached SETTLED
      # contribute 0 to every bucket.
      cap_available_cents = policy.annual_cap_cents
                            - cap_reserved_cents - cap_disbursed_cents - cap_clawback_hold_cents

      # CONSERVED QUANTITY (invariant, checked after every forward and compensating action):
      #   policy.annual_cap_cents == cap_available_cents + cap_reserved_cents
      #                              + cap_disbursed_cents + cap_clawback_hold_cents
    input_set: "Enrollments of one Employee filtered to plan_year == cap_plan_year, bucketed by the explicit funding_status enum sets above; `policy` is the employer's current BenefitPolicy (status == ACTIVE and effective_from <= clock_date < effective_to). When no current policy exists, all four buckets are computed as above and cap_available_cents is 0."
    constants: {}
    precision: "integer cents, exact; no rounding occurs"

  - name: tax_exclusion_split
    trigger: "POST /tuition-invoices/{id}/pay and POST /reimbursement-claims/{id}/decide (APPROVE) append a BENEFIT entry; every SETTLED -> CLAWED_BACK transition appends a REVERSAL entry; POST /_ops/term-close with run_annual_true_up == true appends TRUE_UP entries"
    algorithm: chronological
    formula: |
      # --- variant per_event_chronological (authoritative when money moves) ---------
      # Entries are attributed in disbursement order — TaxLedgerEntry.posted_at ASC,
      # tie-break TaxLedgerEntry.created_at ASC (never id).
      prior_excluded = sum(t.excluded_cents for t in TaxLedgerEntry
                           if t.employee_id == employee.id and t.tax_year == Y)
      headroom_cents = max(0, TAX_EXCLUSION_LIMIT_CENTS - prior_excluded)
      excluded_cents = min(disbursed_amount_cents, headroom_cents)
      imputed_income_cents = disbursed_amount_cents - excluded_cents
      append BENEFIT entry (benefit_cents = disbursed_amount_cents,
                            excluded_cents, imputed_income_cents)

      # --- REVERSAL mirroring (on clawback) ----------------------------------------
      origin = the BENEFIT entry of the same enrollment_id and tax_year
      reversed_excluded = min(obligation.principal_cents, origin.excluded_cents)
      append REVERSAL entry (benefit_cents = -obligation.principal_cents,
                             excluded_cents = -reversed_excluded,
                             imputed_income_cents = -(obligation.principal_cents - reversed_excluded))

      # --- variant annual_true_up_aggregate (POST /_ops/term-close, run_annual_true_up) ---
      # A second, equally defensible reading of the same §127 rule: apply the annual
      # limit to the employee's NET benefit for the year instead of to each event in
      # arrival order. After any REVERSAL the two readings disagree, because the
      # chronological attribution leaves imputed income stranded on a later event whose
      # earlier neighbour has since been reversed.
      net_benefit_cents = sum(t.benefit_cents for t in entries of employee, tax_year Y)
      target_excluded_cents = min(net_benefit_cents, TAX_EXCLUSION_LIMIT_CENTS)
      target_imputed_cents  = net_benefit_cents - target_excluded_cents
      delta_excluded = target_excluded_cents - sum(t.excluded_cents ...)
      delta_imputed  = target_imputed_cents  - sum(t.imputed_income_cents ...)
      if delta_excluded != 0 or delta_imputed != 0:
          append TRUE_UP entry (enrollment_id = null, benefit_cents = 0,
                                excluded_cents = delta_excluded,
                                imputed_income_cents = delta_imputed)

      # CONSERVED QUANTITY (invariant):
      #   for every employee and tax_year:
      #     sum(benefit_cents) == sum(excluded_cents) + sum(imputed_income_cents)
      #     employee.taxable_excluded_cents_ytd == sum(excluded_cents)
      #     employee.imputed_income_cents_ytd  == sum(imputed_income_cents)
    input_set: "All TaxLedgerEntry rows of one Employee whose tax_year equals the calendar year of the logical clock, across entry_type {BENEFIT, REVERSAL, TRUE_UP}; ordered by posted_at ASC with created_at ASC as the tie-break. Employees with no entries in the year are skipped by the true-up run."
    constants:
      TAX_EXCLUSION_LIMIT_CENTS: 525000
    precision: "integer cents, exact; no rounding occurs"
    variants:
      - name: per_event_chronological
        when: "Every disbursement and every clawback, immediately, inside the triggering request"
        difference: "Consumes the annual headroom in arrival order, so the first disbursements of the year are fully excluded and later ones absorb the imputed income."
        note: "Authoritative for the values stored on each TaxLedgerEntry."
      - name: annual_true_up_aggregate
        when: "POST /_ops/term-close with run_annual_true_up == true"
        difference: "Applies the limit to the year's NET benefit and books the difference as a single TRUE_UP entry; after a reversal it yields a strictly smaller imputed_income_cents_ytd than the chronological attribution."

  - name: reimbursement_settlement
    trigger: "POST /reimbursement-claims/{id}/decide with decision == APPROVE"
    algorithm: constraint_propagation
    formula: |
      # The fee depends on the employer's YTD spend, and the YTD spend depends on this
      # settlement — a circular-looking dependency. EVALUATION ORDER IS PINNED to the
      # six steps below; step 3 snapshots the PRE-settlement value.
      # 1. eligible_final_cents = employer_settled_cents from
      #    calculations.benefit_award_computation, variant reimbursement_outcome_conditioned_final
      # 2. approved_amount_cents = min(claim.amount_requested_cents,
      #                                eligible_final_cents,
      #                                enrollment.employer_reserved_cents + employee.cap_available_cents)
      # 3. fee_tier_basis_cents = Employer.total_disbursed_cents AS OF BEFORE this request
      #                           mutates anything (it therefore EXCLUDES approved_amount_cents)
      # 4. admin_fee_pct = ADMIN_FEE_PCT_TIER_1 if fee_tier_basis_cents < ADMIN_FEE_TIER_1_MAX_CENTS
      #                    ADMIN_FEE_PCT_TIER_2 if ADMIN_FEE_TIER_1_MAX_CENTS <= fee_tier_basis_cents < ADMIN_FEE_TIER_2_MAX_CENTS
      #                    ADMIN_FEE_PCT_TIER_3 if fee_tier_basis_cents >= ADMIN_FEE_TIER_2_MAX_CENTS
      # 5. platform_admin_fee_cents = round_half_up(approved_amount_cents * admin_fee_pct)
      # 6. Employer.total_disbursed_cents += approved_amount_cents;
      #    Employer.total_admin_fee_cents += platform_admin_fee_cents
      #    (so the NEXT settlement may land in a different tier)
    input_set: "One ReimbursementClaim with status == SUBMITTED, its Enrollment (academic_status == PASSED, funding_status == RESERVED), the latest AcademicOutcome, the pinned BenefitPolicy, the Employee cap ledger, and the Employer aggregate as of before this request."
    constants:
      ADMIN_FEE_PCT_TIER_1: 0.05
      ADMIN_FEE_PCT_TIER_2: 0.04
      ADMIN_FEE_PCT_TIER_3: 0.03
      ADMIN_FEE_TIER_1_MAX_CENTS: 5000000
      ADMIN_FEE_TIER_2_MAX_CENTS: 20000000
    precision: "integer cents, round_half_up on the fee only; the three-way min in step 2 is exact"

  - name: repayment_assessment
    trigger: "Every SETTLED -> CLAWED_BACK transition: FAILED/INCOMPLETE outcome, withdrawal after drop_deadline_date, term-close auto-INCOMPLETE, and PATCH /employees/{id} with employment_status == TERMINATED"
    algorithm: threshold
    formula: |
      if trigger_reason IN {ACADEMIC_FAILURE, WITHDRAWAL_AFTER_DROP_WINDOW}:
          principal_cents = enrollment.employer_disbursed_cents          # full recovery
      else:  # EARLY_DEPARTURE — prorate by unserved commitment months
          elapsed_months  = whole months from enrollment.term_end_date to
                            employee.termination_date (a month completes when the
                            day-of-month is reached or passed; negative clamps to 0)
          remaining_months = max(0, policy.service_commitment_months - elapsed_months)
          principal_cents = round_half_up(enrollment.employer_disbursed_cents
                                          * remaining_months / policy.service_commitment_months)
          # remaining_months == 0 yields principal_cents == 0, and NO obligation row is
          # created — the commitment was fully served.
      balance_cents = principal_cents - paid_cents - waived_cents

      # CONSERVED QUANTITY (invariant): on every obligation,
      #   principal_cents == paid_cents + waived_cents + balance_cents
    input_set: "One Enrollment with funding_status == SETTLED and employer_disbursed_cents > 0, its pinned BenefitPolicy, and — for EARLY_DEPARTURE — the Employee's termination_date. Enrollments in RESERVED, BILLED, RELEASED or CLAWED_BACK are never assessed."
    constants: {}
    precision: "integer cents, round_half_up applied once on the prorated product"

  - name: persistence_risk_score
    trigger: "POST /enrollments (initial score), POST /enrollments/{id}/coaching-sessions, POST /enrollments/{id}/confirm-registration, POST /enrollments/{id}/academic-outcomes, POST /enrollments/{id}/withdraw, POST /_ops/term-close"
    algorithm: weighted_scoring
    formula: |
      base = BASE_RISK_BY_CREDENTIAL[Program(listing.program_id).credential_type]

      outcome_penalty = OUTCOME_PENALTY if the latest AcademicOutcome of the enrollment
                        has completion_status IN {FAILED, INCOMPLETE} else 0

      staleness_penalty = STALENESS_PENALTY if (no CoachingSession exists for the
                          enrollment) or (logical_clock_date - last_session_date
                          > COACH_STALE_DAYS days) else 0

      recent_sessions = CoachingSession rows of this enrollment whose session_date is
                        within COACH_STALE_DAYS days of the logical clock date
                        (i.e. logical_clock_date - session_date <= COACH_STALE_DAYS)
      engagement_credit = min(ENGAGEMENT_CAP, ENGAGEMENT_PER_SESSION * count(recent_sessions))

      last_three = the 3 most recent CoachingSession rows of this enrollment ordered by
                   session_date DESC, tie-break created_at ASC
      flag_penalty = FLAG_WEIGHT * min(FLAG_COUNT_CAP,
                                       total number of risk_flags entries across last_three)

      persistence_risk_score = clamp(0, 100,
          base + outcome_penalty + staleness_penalty + flag_penalty - engagement_credit)

      persistence_tier = LOW    if persistence_risk_score < 30
                         MEDIUM if 30 <= persistence_risk_score < 60
                         HIGH   if persistence_risk_score >= 60
    input_set: "All CoachingSession rows of exactly one Enrollment (no cross-enrollment sessions count) plus the latest AcademicOutcome of that enrollment; ordering pinned as session_date DESC with created_at ASC as the tie-break."
    constants:
      BASE_RISK_BY_CREDENTIAL: { CERTIFICATE: 10, ASSOCIATE: 20, BACHELOR: 30, MASTER: 25 }
      OUTCOME_PENALTY: 30
      STALENESS_PENALTY: 20
      COACH_STALE_DAYS: 45
      ENGAGEMENT_PER_SESSION: 5
      ENGAGEMENT_CAP: 20
      FLAG_WEIGHT: 5
      FLAG_COUNT_CAP: 4
    precision: "integer points, exact; clamped to 0..100"

  - name: employer_utilization_report
    trigger: "GET /employers/{id}/utilization-report"
    algorithm: aggregation
    formula: |
      plan_year = plan_year_of(logical_clock_date)      # see annual_cap_ledger
      employees = Employee rows with employer_id == {id}
      eligible  = employees with eligibility_status == ELIGIBLE
      scope     = Enrollment rows whose employee_id is in employees and plan_year == plan_year

      eligible_employee_count      = count(eligible)
      participating_employee_count = count(distinct e.employee_id for e in scope)
      participation_rate = 0.0 if eligible_employee_count == 0
                           else round_half_up(participating_employee_count
                                              / eligible_employee_count, 4)

      closed      = [e in scope if e.academic_status IN {PASSED, FAILED, WITHDRAWN, INCOMPLETE}]
      completions = [e in closed if e.academic_status == PASSED]
      completion_rate = 0.0 if count(closed) == 0
                        else round_half_up(count(completions) / count(closed), 4)

      retained = distinct employee_ids of scope whose Employee.employment_status == ACTIVE
      retention_rate = 0.0 if participating_employee_count == 0
                       else round_half_up(count(retained) / participating_employee_count, 4)

      skill_attainment_count = count(distinct (e.employee_id,
                                     Program(listing.program_id).skill_track)
                                     for e in completions)

      total_employer_disbursed_cents = sum(e.employer_disbursed_cents
                                           for e in scope if e.funding_status == SETTLED)
      total_imputed_income_cents = sum(t.imputed_income_cents for TaxLedgerEntry t of these
                                       employees where t.tax_year == logical_clock_date.year)
      cost_per_completion_cents = 0 if count(completions) == 0
                                  else round_half_up(total_employer_disbursed_cents
                                                     / count(completions))
    input_set: "One Employer's Employee rows (all employment_status values; the eligible denominator filters to eligibility_status == ELIGIBLE) and their Enrollment rows restricted to plan_year == plan_year_of(clock). Empty collections short-circuit to 0.0 / 0 rather than dividing by zero."
    constants: {}
    precision: "rates as numbers rounded half-up to 4 decimal places; cent amounts as integers rounded half-up"

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's declared roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "request body and query schema: required fields present, types and enum members valid, ISO dates parseable, credits in 1..30, amount fields >= 1, effective_to > effective_from, term_end_date > term_start_date, grade_points supplied exactly when completion_status IN {PASSED, FAILED}, termination_date supplied exactly when employment_status is set to TERMINATED, limit in 1..100, offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "path Employer exists"
    error_id: ERR_EMPLOYER_NOT_FOUND
    http_status: 404
    applies_to: "GET /employers/{id}, GET /employers/{id}/utilization-report, POST /employers/{id}/benefit-policies, GET /employers/{id}/benefit-policies, POST /employers/{id}/employees, GET /employers/{id}/employees"

  - priority: 5
    category: existence
    check: "path BenefitPolicy exists"
    error_id: ERR_POLICY_NOT_FOUND
    http_status: 404
    applies_to: "POST /benefit-policies/{id}/activate"

  - priority: 6
    category: existence
    check: "path Employee exists"
    error_id: ERR_EMPLOYEE_NOT_FOUND
    http_status: 404
    applies_to: "GET /employees/{id}, PATCH /employees/{id}"

  - priority: 7
    category: existence
    check: "path School exists"
    error_id: ERR_SCHOOL_NOT_FOUND
    http_status: 404
    applies_to: "GET /schools/{id}, POST /schools/{id}/programs, GET /schools/{id}/programs"

  - priority: 8
    category: existence
    check: "path PartnerAgreement exists"
    error_id: ERR_AGREEMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /partner-agreements/{id}, POST /partner-agreements/{id}/activate, POST /partner-agreements/{id}/terminate"

  - priority: 9
    category: existence
    check: "path CatalogListing exists"
    error_id: ERR_LISTING_NOT_FOUND
    http_status: 404
    applies_to: "GET /catalog-listings/{id}, POST /catalog-listings/{id}/suspend"

  - priority: 10
    category: existence
    check: "path ProgramApprovalRequest exists"
    error_id: ERR_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "GET /program-approval-requests/{id}, POST /program-approval-requests/{id}/review, POST /program-approval-requests/{id}/resubmit, POST /program-approval-requests/{id}/decide"

  - priority: 11
    category: existence
    check: "path Enrollment exists"
    error_id: ERR_ENROLLMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /enrollments/{id} and every /enrollments/{id}/... endpoint"

  - priority: 12
    category: existence
    check: "path TuitionInvoice exists"
    error_id: ERR_INVOICE_NOT_FOUND
    http_status: 404
    applies_to: "POST /tuition-invoices/{id}/approve-payment, POST /tuition-invoices/{id}/pay"

  - priority: 13
    category: existence
    check: "path ReimbursementClaim exists"
    error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "POST /reimbursement-claims/{id}/decide"

  - priority: 14
    category: existence
    check: "path RepaymentObligation exists"
    error_id: ERR_OBLIGATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /repayment-obligations/{id}/payments, POST /repayment-obligations/{id}/waive"

  - priority: 15
    category: existence
    check: "body-referenced resources exist, validated in the order the fields are declared in the endpoint's input list (employer_id, school_id, employee_id, program_id, agreement_id, catalog_listing_id, enrollment_id)"
    error_id: ERR_EMPLOYER_NOT_FOUND
    http_status: 404
    applies_to: "POST /partner-agreements, POST /catalog-listings, POST /program-approval-requests, POST /enrollments — each missing reference raises the *_NOT_FOUND error of its own entity type"

  - priority: 16
    category: auth
    check: "ownership scope for entity_backed roles: BenefitAdministrator's X-User-ID equals the Employer id owning the target; Employee's X-User-ID equals the target's employee_id; SchoolPartner's X-User-ID equals the School id owning the target Program"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints whose roles include BenefitAdministrator, Employee or SchoolPartner"

  - priority: 17
    category: state
    check: "expected_employee_version equals Employee.version"
    error_id: ERR_STALE_EMPLOYEE_VERSION
    http_status: 412
    applies_to: "POST /enrollments"

  - priority: 18
    category: state
    check: "expected_agreement_version equals PartnerAgreement.version"
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    applies_to: "POST /catalog-listings"

  - priority: 19
    category: state
    check: "BenefitPolicy.status == DRAFT"
    error_id: ERR_POLICY_NOT_DRAFT
    http_status: 409
    applies_to: "POST /benefit-policies/{id}/activate"

  - priority: 20
    category: state
    check: "PartnerAgreement.status == PENDING on activate, == ACTIVE on terminate"
    error_id: ERR_AGREEMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /partner-agreements/{id}/activate, POST /partner-agreements/{id}/terminate"

  - priority: 21
    category: state
    check: "CatalogListing.status == CURATED"
    error_id: ERR_LISTING_NOT_CURATED
    http_status: 409
    applies_to: "POST /catalog-listings/{id}/suspend, POST /enrollments, POST /enrollments/{id}/confirm-registration"

  - priority: 22
    category: state
    check: "ProgramApprovalRequest.status matches the transition: SUBMITTED for review, UNDER_REVIEW for decide, CHANGES_REQUESTED for resubmit"
    error_id: ERR_REQUEST_INVALID_STATE
    http_status: 409
    applies_to: "POST /program-approval-requests/{id}/review, POST /program-approval-requests/{id}/resubmit, POST /program-approval-requests/{id}/decide"

  - priority: 23
    category: state
    check: "Enrollment.academic_status matches the transition: REGISTERED for confirm-registration, IN_PROGRESS for posting an outcome, PASSED for filing a claim, {REGISTERED, IN_PROGRESS} for withdraw, {REGISTERED, IN_PROGRESS} for invoice approval"
    error_id: ERR_ENROLLMENT_INVALID_ACADEMIC_STATE
    http_status: 409
    applies_to: "POST /enrollments/{id}/confirm-registration, POST /enrollments/{id}/academic-outcomes, POST /enrollments/{id}/withdraw, POST /enrollments/{id}/reimbursement-claims, POST /tuition-invoices/{id}/approve-payment"

  - priority: 24
    category: state
    check: "Enrollment.funding_status matches the transition: RESERVED for confirm-registration, RESERVED for filing or approving a claim ON A REIMBURSEMENT ENROLLMENT (a DIRECT_BILL enrollment is instead rejected by priority 31, which is the only reachable path for ERR_REIMBURSEMENT_NOT_ALLOWED), BILLED for paying an invoice"
    error_id: ERR_ENROLLMENT_INVALID_FUNDING_STATE
    http_status: 409
    applies_to: "POST /enrollments/{id}/confirm-registration, POST /enrollments/{id}/reimbursement-claims, POST /reimbursement-claims/{id}/decide, POST /tuition-invoices/{id}/pay"

  - priority: 25
    category: state
    check: "TuitionInvoice.status == ISSUED on approve-payment, == APPROVED_FOR_PAYMENT on pay"
    error_id: ERR_INVOICE_INVALID_STATE
    http_status: 409
    applies_to: "POST /tuition-invoices/{id}/approve-payment, POST /tuition-invoices/{id}/pay"

  - priority: 26
    category: state
    check: "ReimbursementClaim.status == SUBMITTED"
    error_id: ERR_CLAIM_INVALID_STATE
    http_status: 409
    applies_to: "POST /reimbursement-claims/{id}/decide"

  - priority: 27
    category: state
    check: "RepaymentObligation.status IN {ASSESSED, PARTIALLY_PAID}"
    error_id: ERR_OBLIGATION_INVALID_STATE
    http_status: 409
    applies_to: "POST /repayment-obligations/{id}/payments, POST /repayment-obligations/{id}/waive"

  - priority: 28
    category: business_referential
    check: "the employer has exactly one current BenefitPolicy (status == ACTIVE and effective_from <= clock_date < effective_to)"
    error_id: ERR_NO_ACTIVE_POLICY
    http_status: 409
    applies_to: "POST /enrollments, POST /program-approval-requests"

  - priority: 29
    category: business_referential
    check: "the referenced PartnerAgreement has status == ACTIVE, belongs to the supplied employer_id and school of the supplied program_id, and its [effective_from, effective_to] window is non-empty"
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /catalog-listings"

  - priority: 30
    category: business_referential
    check: "on filing a claim, the latest AcademicOutcome of the enrollment has completion_status == PASSED and grade_points >= policy.min_passing_grade_points; on posting an outcome with completion_status == PASSED, grade_points >= policy.min_passing_grade_points"
    error_id: ERR_ACADEMIC_PROGRESS_NOT_MET
    http_status: 422
    applies_to: "POST /enrollments/{id}/reimbursement-claims, POST /enrollments/{id}/academic-outcomes"

  - priority: 31
    category: business_referential
    check: "Enrollment.funding_model == REIMBURSEMENT"
    error_id: ERR_REIMBURSEMENT_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /enrollments/{id}/reimbursement-claims"

  - priority: 32
    category: business_safety
    check: "the acting Employee's eligibility_status is not INELIGIBLE_EMPLOYMENT, INELIGIBLE_HOURS or INELIGIBLE_JOB_FAMILY"
    error_id: ERR_EMPLOYEE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /enrollments, POST /program-approval-requests"

  - priority: 33
    category: business_safety
    check: "Employee.tenure_months >= policy.min_tenure_months"
    error_id: ERR_EMPLOYEE_TENURE_NOT_MET
    http_status: 422
    applies_to: "POST /enrollments, POST /program-approval-requests"

  - priority: 34
    category: business_safety
    check: "School.accreditation_status == ACCREDITED when approving a non-catalog request; != UNACCREDITED when activating an agreement"
    error_id: ERR_SCHOOL_NOT_ACCREDITED
    http_status: 422
    applies_to: "POST /program-approval-requests/{id}/decide, POST /partner-agreements/{id}/activate"

  - priority: 35
    category: business_safety
    check: "Employee.coaching_hold == false"
    error_id: ERR_COACHING_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /enrollments"

  - priority: 36
    category: business_temporal
    check: "the activating policy's half-open window [effective_from, effective_to) does not intersect the window of any other BenefitPolicy of the same employer with status == ACTIVE; touching endpoints (a.effective_to == b.effective_from) do NOT intersect"
    error_id: ERR_POLICY_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /benefit-policies/{id}/activate"

  - priority: 37
    category: business_temporal
    check: "sum of credits over the employee's enrollments with academic_status IN {REGISTERED, IN_PROGRESS} whose CLOSED interval [term_start_date, term_end_date] intersects the new enrollment's closed interval — a single shared day counts as an intersection — plus the new enrollment's credits, is <= policy.max_concurrent_credits"
    error_id: ERR_CONCURRENT_CREDIT_LIMIT
    http_status: 422
    applies_to: "POST /enrollments"

  - priority: 38
    category: business_constraint
    check: "no CatalogListing with status == CURATED and no ProgramApprovalRequest with status IN {SUBMITTED, UNDER_REVIEW, CHANGES_REQUESTED} already exists for the same (employer_id, program_id) pair"
    error_id: ERR_DUPLICATE_LISTING
    http_status: 409
    applies_to: "POST /catalog-listings, POST /program-approval-requests"

  - priority: 39
    category: business_constraint
    check: "no Enrollment with the same (employee_id, catalog_listing_id, term_code) exists whose academic_status is not in {WITHDRAWN, FAILED}"
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    applies_to: "POST /enrollments"

  - priority: 40
    category: business_constraint
    check: "ProgramApprovalRequest.revision_count < 2 (MAX_REVISION_ROUNDS)"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /program-approval-requests/{id}/resubmit"

  - priority: 41
    category: business_constraint
    check: "payment amount_cents <= RepaymentObligation.balance_cents"
    error_id: ERR_REPAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /repayment-obligations/{id}/payments"

  - priority: 42
    category: business_constraint
    check: "the employer's current BenefitPolicy has non_catalog_approval_required == true"
    error_id: ERR_NON_CATALOG_APPROVAL_DISABLED
    http_status: 422
    applies_to: "POST /program-approval-requests"

  - priority: 43
    category: business_constraint
    check: "the effective funding model (supplied funding_model, else the policy's) is a member of CatalogListing.allowed_funding_models and matches the policy's funding_model when that is not HYBRID"
    error_id: ERR_FUNDING_MODEL_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /enrollments"

  - priority: 44
    category: business_fiscal
    check: "Employee.cap_available_cents > 0 — a plan year with zero remaining headroom admits no further enrollment; a positive-but-insufficient headroom is allowed and produces partial coverage through the min() in benefit_award_computation"
    error_id: ERR_ANNUAL_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /enrollments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Employer & policy -----------------------------------------------------
  - method: POST
    path: "/employers"
    description: "Onboard an employer client."
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, benefit_admin_contact_email, fiscal_year_start_month, "status?"]
    output: Employer
    side_effects: ["all computed aggregate fields initialised to 0"]

  - method: GET
    path: "/employers/{id}"
    description: "Read one employer including its reporting aggregates."
    roles: [PlatformAdmin, BenefitAdministrator]
    code: 200
    input: []
    output: Employer
    side_effects: []

  - method: GET
    path: "/employers/{id}/utilization-report"
    description: "Computed read: utilization, retention, skill attainment and cost per completion for the current plan year (see calculations.employer_utilization_report). Empty collections yield 0.0 / 0 instead of an error."
    roles: [BenefitAdministrator, PlatformAdmin]
    code: 200
    input: []
    output: "{ plan_year: integer, eligible_employee_count: integer, participating_employee_count: integer, participation_rate: number, completion_rate: number, retention_rate: number, skill_attainment_count: integer, total_employer_disbursed_cents: integer, total_imputed_income_cents: integer, cost_per_completion_cents: integer }"
    side_effects: []

  - method: POST
    path: "/employers/{id}/benefit-policies"
    description: "Draft a new benefit policy version for the employer."
    roles: [BenefitAdministrator]
    code: 201
    input: [effective_from, effective_to, min_tenure_months, min_weekly_hours, eligible_job_families, annual_cap_cents, funding_model, reimbursement_pct, max_concurrent_credits, drop_window_days, service_commitment_months, "min_passing_grade_points?", "non_catalog_approval_required?"]
    output: BenefitPolicy
    side_effects: ["policy created in status DRAFT; no employee eligibility is recomputed yet"]

  - method: GET
    path: "/employers/{id}/benefit-policies"
    description: "List the employer's policy versions (FK reverse-reachability for BenefitPolicy.employer_id)."
    roles: [BenefitAdministrator, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BenefitPolicy[]
    side_effects: []

  - method: POST
    path: "/benefit-policies/{id}/activate"
    description: "Activate a DRAFT policy after the half-open window overlap check."
    roles: [BenefitAdministrator]
    code: 200
    input: []
    output: BenefitPolicy
    side_effects:
      - "policy.status DRAFT -> ACTIVE"
      - "every Employee of the employer recomputes eligibility_status and the full cap ledger in created_at ASC order; each recomputed Employee has version incremented by 1"
      - "existing enrollments keep their pinned policy_id"

  # --- Employees -------------------------------------------------------------
  - method: POST
    path: "/employers/{id}/employees"
    description: "Register an employee under the employer."
    roles: [BenefitAdministrator]
    code: 201
    input: [full_name, work_email, hire_date, weekly_hours, job_family, "employment_status?"]
    output: Employee
    side_effects: ["tenure_months, eligibility_status and the cap ledger computed against the employer's current policy"]

  - method: GET
    path: "/employers/{id}/employees"
    description: "List the employer's employees (FK reverse-reachability for Employee.employer_id)."
    roles: [BenefitAdministrator]
    code: 200
    input: ["eligibility_status?", "job_family?", "limit?", "offset?"]
    output: Employee[]
    side_effects: []

  - method: GET
    path: "/employees/{id}"
    description: "Read one employee with the live eligibility verdict, cap ledger, tax aggregates and coaching hold."
    roles: [Employee, BenefitAdministrator, Coach]
    code: 200
    input: []
    output: Employee
    side_effects: []

  - method: PATCH
    path: "/employees/{id}"
    description: "Update employment facts. Setting employment_status to TERMINATED runs the early-departure cascade."
    roles: [BenefitAdministrator]
    code: 200
    input: ["weekly_hours?", "job_family?", "employment_status?", "termination_date?"]
    output: Employee
    side_effects:
      - "eligibility_status recomputed (TERMINATED yields INELIGIBLE_EMPLOYMENT)"
      - "on TERMINATED: every Enrollment with academic_status IN {REGISTERED, IN_PROGRESS} moves to WITHDRAWN with funding RESERVED/BILLED -> RELEASED and open invoices VOIDED"
      - "on TERMINATED: every Enrollment with funding_status == SETTLED whose term_end_date is within policy.service_commitment_months before termination_date moves SETTLED -> CLAWED_BACK with a prorated EARLY_DEPARTURE RepaymentObligation and a mirroring REVERSAL TaxLedgerEntry"
      - "Employee cap ledger, tax aggregates, open_repayment_balance_cents and coaching_hold recomputed; Employer aggregates recomputed"

  # --- Schools, programs, agreements ----------------------------------------
  - method: POST
    path: "/schools"
    description: "Register a school in the platform directory."
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, state_code, contact_email, "accreditation_status?"]
    output: School
    side_effects: []

  - method: GET
    path: "/schools/{id}"
    description: "Read one school."
    roles: [PlatformAdmin, BenefitAdministrator, SchoolPartner]
    code: 200
    input: []
    output: School
    side_effects: []

  - method: POST
    path: "/schools/{id}/programs"
    description: "Publish a program under the school."
    roles: [SchoolPartner, PlatformAdmin]
    code: 201
    input: [name, credential_type, skill_track, list_tuition_per_credit_cents, total_credits, term_length_weeks]
    output: Program
    side_effects: []

  - method: GET
    path: "/schools/{id}/programs"
    description: "List the school's programs (FK reverse-reachability for Program.school_id)."
    roles: [PlatformAdmin, BenefitAdministrator, SchoolPartner, Employee]
    code: 200
    input: ["credential_type?", "skill_track?", "limit?", "offset?"]
    output: Program[]
    side_effects: []

  - method: POST
    path: "/partner-agreements"
    description: "Draft a school/employer partner agreement with a negotiated discount."
    roles: [PlatformAdmin]
    code: 201
    input: [school_id, employer_id, negotiated_discount_pct, direct_bill_enabled, effective_from, effective_to]
    output: PartnerAgreement
    side_effects: ["agreement created in status PENDING"]

  - method: GET
    path: "/partner-agreements"
    description: "List agreements (FK reverse-reachability for PartnerAgreement.school_id and .employer_id)."
    roles: [PlatformAdmin, BenefitAdministrator, SchoolPartner]
    code: 200
    input: ["school_id?", "employer_id?", "status?", "limit?", "offset?"]
    output: PartnerAgreement[]
    side_effects: []

  - method: GET
    path: "/partner-agreements/{id}"
    description: "Read one agreement, including the version an OCC listing create must echo."
    roles: [PlatformAdmin, BenefitAdministrator, SchoolPartner]
    code: 200
    input: []
    output: PartnerAgreement
    side_effects: []

  - method: POST
    path: "/partner-agreements/{id}/activate"
    description: "Activate a PENDING agreement; the school must not be UNACCREDITED."
    roles: [BenefitAdministrator]
    code: 200
    input: []
    output: PartnerAgreement
    side_effects: ["status PENDING -> ACTIVE", "increments PartnerAgreement.version by 1"]

  - method: POST
    path: "/partner-agreements/{id}/terminate"
    description: "Terminate an ACTIVE agreement and cascade through listings, registered enrollments, invoices and open approval requests."
    roles: [BenefitAdministrator]
    code: 200
    input: []
    output: PartnerAgreement
    side_effects:
      - "status ACTIVE -> TERMINATED, terminated_on set, version incremented by 1"
      - "hop 1: CURATED listings under this agreement -> SUSPENDED (created_at ASC)"
      - "hop 2: enrollments on those listings with academic_status == REGISTERED -> WITHDRAWN, funding RESERVED/BILLED -> RELEASED"
      - "hop 3: their ISSUED/APPROVED_FOR_PAYMENT invoices -> VOIDED and each affected Employee's cap ledger recomputed"
      - "hop 2b: open ProgramApprovalRequests for this school's programs -> REJECTED"

  # --- Catalog curation ------------------------------------------------------
  - method: POST
    path: "/catalog-listings"
    description: "Curate a program into the employer's eligible catalog under an ACTIVE agreement. Requires the agreement version the client last observed."
    roles: [BenefitAdministrator]
    code: 201
    input: [employer_id, program_id, agreement_id, expected_agreement_version]
    output: CatalogListing
    side_effects:
      - "negotiated_tuition_per_credit_cents and allowed_funding_models computed per calculations.negotiated_rate_derivation"
      - "approval_source = CATALOG, status = CURATED, source_request_id = null"
      - "increments PartnerAgreement.version by 1"

  - method: GET
    path: "/catalog-listings"
    description: "List listings (FK reverse-reachability for CatalogListing.employer_id, .program_id, .agreement_id and .source_request_id)."
    roles: [BenefitAdministrator, Employee, PlatformAdmin]
    code: 200
    input: ["employer_id?", "program_id?", "agreement_id?", "source_request_id?", "status?", "approval_source?", "limit?", "offset?"]
    output: CatalogListing[]
    side_effects: []

  - method: GET
    path: "/catalog-listings/{id}"
    description: "Read one listing with its negotiated per-credit rate."
    roles: [BenefitAdministrator, Employee, PlatformAdmin]
    code: 200
    input: []
    output: CatalogListing
    side_effects: []

  - method: POST
    path: "/catalog-listings/{id}/suspend"
    description: "Remove a listing from the eligible catalog without touching enrollments already on it."
    roles: [BenefitAdministrator]
    code: 200
    input: []
    output: CatalogListing
    side_effects: ["status CURATED -> SUSPENDED; existing enrollments continue unchanged"]

  # --- Non-catalog approval workflow ----------------------------------------
  - method: POST
    path: "/program-approval-requests"
    description: "Employee requests approval of a program that is not in the employer's catalog."
    roles: [Employee]
    code: 201
    input: [employee_id, program_id, justification, requested_annual_cost_cents]
    output: ProgramApprovalRequest
    side_effects: ["request created in status SUBMITTED with revision_count 0"]

  - method: GET
    path: "/program-approval-requests"
    description: "List approval requests (FK reverse-reachability for .employee_id and .program_id)."
    roles: [Employee, BenefitAdministrator]
    code: 200
    input: ["employee_id?", "program_id?", "status?", "limit?", "offset?"]
    output: ProgramApprovalRequest[]
    side_effects: []

  - method: GET
    path: "/program-approval-requests/{id}"
    description: "Read one approval request with its revision count."
    roles: [Employee, BenefitAdministrator]
    code: 200
    input: []
    output: ProgramApprovalRequest
    side_effects: []

  - method: POST
    path: "/program-approval-requests/{id}/review"
    description: "Take a SUBMITTED request into review."
    roles: [BenefitAdministrator]
    code: 200
    input: []
    output: ProgramApprovalRequest
    side_effects: ["status SUBMITTED -> UNDER_REVIEW"]

  - method: POST
    path: "/program-approval-requests/{id}/resubmit"
    description: "Employee answers a change request and resubmits; at most 2 revision rounds."
    roles: [Employee]
    code: 200
    input: ["justification?", "requested_annual_cost_cents?"]
    output: ProgramApprovalRequest
    side_effects: ["status CHANGES_REQUESTED -> SUBMITTED", "revision_count incremented by 1"]

  - method: POST
    path: "/program-approval-requests/{id}/decide"
    description: "Branch an UNDER_REVIEW request to APPROVED (materialises an APPROVED_EXCEPTION listing), REJECTED, or CHANGES_REQUESTED (reopens the cycle)."
    roles: [BenefitAdministrator]
    code: 200
    input: [decision, "decision_note?"]
    output: ProgramApprovalRequest
    side_effects:
      - "decision == APPROVE: status -> APPROVED and a CatalogListing is created with approval_source APPROVED_EXCEPTION, agreement_id null, source_request_id = request.id, negotiated rate = list rate, allowed_funding_models [REIMBURSEMENT]"
      - "decision == REJECT: status -> REJECTED, no listing created"
      - "decision == REQUEST_CHANGES: status -> CHANGES_REQUESTED, no listing created"

  # --- Enrollment ------------------------------------------------------------
  - method: POST
    path: "/enrollments"
    description: "Employee enrolls in a term against a CURATED listing. Requires the employee version the client last observed."
    roles: [Employee]
    code: 201
    input: [employee_id, catalog_listing_id, term_code, term_start_date, term_end_date, credits, expected_employee_version, "funding_model?"]
    output: Enrollment
    side_effects:
      - "policy_id pinned to the employer's current BenefitPolicy; plan_year and drop_deadline_date computed"
      - "gross_tuition_cents, employer_reserved_cents and employee_share_cents computed per calculations.benefit_award_computation variant provisional_reserve"
      - "academic_status = REGISTERED, funding_status = RESERVED"
      - "persistence_risk_score and persistence_tier computed; Employee.coaching_hold recomputed"
      - "Employee cap ledger recomputed and increments Employee.version by 1"

  - method: GET
    path: "/enrollments"
    description: "List enrollments (FK reverse-reachability for .employee_id, .catalog_listing_id and .policy_id)."
    roles: [Employee, BenefitAdministrator, Coach, SchoolPartner]
    code: 200
    input: ["employee_id?", "catalog_listing_id?", "policy_id?", "term_code?", "academic_status?", "funding_status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  - method: GET
    path: "/enrollments/{id}"
    description: "Read one enrollment with both status axes and every money field."
    roles: [Employee, BenefitAdministrator, Coach, SchoolPartner]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: POST
    path: "/enrollments/{id}/confirm-registration"
    description: "School confirms the learner is registered; DIRECT_BILL issues the up-front invoice, REIMBURSEMENT does not."
    roles: [SchoolPartner]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "academic_status REGISTERED -> IN_PROGRESS"
      - "DIRECT_BILL: TuitionInvoice created in ISSUED with amount_cents = employer_reserved_cents and due_date = term_start_date + 30 days; funding_status RESERVED -> BILLED"
      - "REIMBURSEMENT: no invoice; funding_status stays RESERVED"
      - "persistence_risk_score recomputed; Employee.coaching_hold recomputed"

  - method: POST
    path: "/enrollments/{id}/withdraw"
    description: "Employee withdraws. On or before drop_deadline_date the reservation is released cleanly; afterwards a settled benefit is clawed back."
    roles: [Employee]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "academic_status -> WITHDRAWN and a SYSTEM AcademicOutcome with completion_status WITHDRAWN is appended"
      - "within the drop window: funding RESERVED/BILLED -> RELEASED and open invoices VOIDED, no obligation"
      - "after the drop window with funding_status == SETTLED: WITHDRAWAL_AFTER_DROP_WINDOW obligation assessed at full employer_disbursed_cents, funding -> CLAWED_BACK, REVERSAL TaxLedgerEntry appended"
      - "Employee cap ledger, tax aggregates and coaching_hold recomputed; Employer aggregates recomputed"

  - method: POST
    path: "/enrollments/{id}/academic-outcomes"
    description: "School posts the term result; FAILED or INCOMPLETE on a settled benefit runs the clawback cascade."
    roles: [SchoolPartner]
    code: 201
    input: [term_code, completion_status, credits_earned, "grade_points?"]
    output: AcademicOutcome
    side_effects:
      - "academic_status -> PASSED / FAILED / INCOMPLETE; Enrollment.credits_earned updated"
      - "FAILED or INCOMPLETE with funding_status == SETTLED: ACADEMIC_FAILURE obligation assessed at full employer_disbursed_cents, funding SETTLED -> CLAWED_BACK, REVERSAL TaxLedgerEntry appended, Employee and Employer aggregates recomputed"
      - "persistence_risk_score and persistence_tier recomputed; Employee.coaching_hold recomputed"

  - method: GET
    path: "/enrollments/{id}/academic-outcomes"
    description: "Append-only outcome log for the enrollment (FK reverse-reachability for AcademicOutcome.enrollment_id)."
    roles: [SchoolPartner, BenefitAdministrator, Employee, Coach]
    code: 200
    input: ["limit?", "offset?"]
    output: AcademicOutcome[]
    side_effects: []

  - method: POST
    path: "/enrollments/{id}/coaching-sessions"
    description: "Coach logs an advising session; recomputes the enrollment's persistence score and the employee's coaching hold."
    roles: [Coach]
    code: 201
    input: [session_date, modality, "risk_flags?", "notes?"]
    output: CoachingSession
    side_effects:
      - "coach_user_id copied from X-User-ID"
      - "Enrollment.persistence_risk_score, persistence_tier and last_session_date recomputed; persistence_risk_score_after stamped on the session"
      - "Employee.coaching_hold recomputed"

  - method: GET
    path: "/enrollments/{id}/coaching-sessions"
    description: "Append-only coaching log for the enrollment (FK reverse-reachability for CoachingSession.enrollment_id)."
    roles: [Coach, BenefitAdministrator, Employee]
    code: 200
    input: ["limit?", "offset?"]
    output: CoachingSession[]
    side_effects: []

  # --- Direct bill -----------------------------------------------------------
  - method: GET
    path: "/enrollments/{id}/invoices"
    description: "Invoices raised for the enrollment (FK reverse-reachability for TuitionInvoice.enrollment_id)."
    roles: [BenefitAdministrator, SchoolPartner, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TuitionInvoice[]
    side_effects: []

  - method: POST
    path: "/tuition-invoices/{id}/approve-payment"
    description: "Employer approves an ISSUED invoice for payment (segregation of duties: approval only)."
    roles: [BenefitAdministrator]
    code: 200
    input: []
    output: TuitionInvoice
    side_effects: ["status ISSUED -> APPROVED_FOR_PAYMENT"]

  - method: POST
    path: "/tuition-invoices/{id}/pay"
    description: "Platform disburses the approved invoice to the school up front, before any academic outcome exists."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: TuitionInvoice
    side_effects:
      - "status APPROVED_FOR_PAYMENT -> PAID, paid_on set"
      - "enrollment funding_status BILLED -> SETTLED with employer_settled_cents = employer_disbursed_cents = amount_cents"
      - "BENEFIT TaxLedgerEntry appended per calculations.tax_exclusion_split"
      - "Employee cap ledger and tax aggregates recomputed; Employer.total_disbursed_cents and total_imputed_income_cents recomputed"

  # --- Reimbursement ---------------------------------------------------------
  - method: POST
    path: "/enrollments/{id}/reimbursement-claims"
    description: "Employee files a reimbursement claim after a passing outcome."
    roles: [Employee]
    code: 201
    input: [amount_requested_cents, receipt_reference]
    output: ReimbursementClaim
    side_effects: ["claim created in status SUBMITTED with approved_amount_cents 0"]

  - method: GET
    path: "/enrollments/{id}/reimbursement-claims"
    description: "Claims filed on the enrollment (FK reverse-reachability for ReimbursementClaim.enrollment_id)."
    roles: [Employee, BenefitAdministrator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ReimbursementClaim[]
    side_effects: []

  - method: POST
    path: "/reimbursement-claims/{id}/decide"
    description: "Employer approves (settles and disburses in the same request) or rejects (releases the reservation) a claim."
    roles: [BenefitAdministrator]
    code: 200
    input: [decision, "decision_note?"]
    output: ReimbursementClaim
    side_effects:
      - "APPROVE: approved_amount_cents and platform_admin_fee_cents computed per calculations.reimbursement_settlement; enrollment funding RESERVED -> SETTLED; BENEFIT TaxLedgerEntry appended; Employee and Employer aggregates recomputed"
      - "REJECT: status -> REJECTED; enrollment funding RESERVED -> RELEASED; Employee cap ledger recomputed; no tax entry"

  # --- Repayment -------------------------------------------------------------
  - method: GET
    path: "/enrollments/{id}/repayment-obligations"
    description: "Obligations assessed on the enrollment (FK reverse-reachability for RepaymentObligation.enrollment_id)."
    roles: [Employee, BenefitAdministrator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RepaymentObligation[]
    side_effects: []

  - method: POST
    path: "/repayment-obligations/{id}/payments"
    description: "Employee repays part or all of an obligation; clearing the balance releases the cap clawback hold."
    roles: [Employee]
    code: 200
    input: [amount_cents]
    output: RepaymentObligation
    side_effects:
      - "paid_cents increased, balance_cents recomputed, status -> PARTIALLY_PAID or SETTLED"
      - "on SETTLED: the enrollment's amount leaves Employee.cap_clawback_hold_cents and cap_available_cents rises by it"
      - "Employee.open_repayment_balance_cents recomputed"

  - method: POST
    path: "/repayment-obligations/{id}/waive"
    description: "Employer forgives the outstanding balance; the employer absorbed the cost so the cap hold is NOT released."
    roles: [BenefitAdministrator]
    code: 200
    input: []
    output: RepaymentObligation
    side_effects:
      - "waived_cents = balance_cents at waive time, balance_cents = 0, status -> WAIVED"
      - "cap_clawback_hold_cents unchanged; Employee.open_repayment_balance_cents recomputed"

  # --- Tax ledger ------------------------------------------------------------
  - method: GET
    path: "/tax-ledger-entries"
    description: "Append-only §127 ledger (FK reverse-reachability for TaxLedgerEntry.employee_id and .enrollment_id)."
    roles: [BenefitAdministrator, PlatformAdmin]
    code: 200
    input: ["employee_id?", "enrollment_id?", "tax_year?", "entry_type?", "limit?", "offset?"]
    output: TaxLedgerEntry[]
    side_effects: []

  - method: GET
    path: "/tax-ledger-entries/{id}"
    description: "Read one ledger entry."
    roles: [BenefitAdministrator, PlatformAdmin]
    code: 200
    input: []
    output: TaxLedgerEntry
    side_effects: []

  # --- Test-driving surface --------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["tenure_months, eligibility_status, cap_plan_year, persistence staleness and every date comparison are evaluated against the new value on subsequent requests"]

  - method: POST
    path: "/_ops/term-close"
    description: "Operator batch that closes a term: supersedes elapsed policies, auto-INCOMPLETEs unreported enrollments, refreshes persistence scores and optionally runs the annual §127 true-up."
    roles: [PlatformAdmin]
    code: 200
    input: [term_code, "run_annual_true_up?", "tax_year?"]
    output: "{ superseded_policy_count: integer, closed_enrollment_count: integer, obligation_assessed_count: integer, true_up_entry_count: integer, coaching_hold_employee_count: integer }"
    side_effects:
      - "step 1: every ACTIVE BenefitPolicy with effective_to <= clock date -> SUPERSEDED, then affected employees' eligibility recomputed (Employee.created_at ASC)"
      - "step 2: every Enrollment with the given term_code, academic_status == IN_PROGRESS and no AcademicOutcome -> INCOMPLETE with a SYSTEM outcome row (Enrollment.created_at ASC)"
      - "step 3: each newly INCOMPLETE enrollment with funding_status == SETTLED runs the clawback cascade (ACADEMIC_FAILURE obligation, CLAWED_BACK, REVERSAL entry, ledger recomputes)"
      - "step 4: persistence_risk_score / persistence_tier recomputed for every enrollment of the term and Employee.coaching_hold refreshed"
      - "step 5: when run_annual_true_up == true, for every Employee with at least one TaxLedgerEntry in tax_year (default: calendar year of the clock), the annual_true_up_aggregate variant appends a TRUE_UP entry when the delta is non-zero (Employee.created_at ASC)"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for the endpoint, or an entity_backed role acting outside its ownership scope"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Schema violation: missing required field, bad type or enum member, unparseable date, credits outside 1..30, effective_to <= effective_from, term_end_date <= term_start_date, grade_points present/absent contrary to completion_status, limit outside 1..100"
  - id: ERR_EMPLOYER_NOT_FOUND
    http: 404
    condition: "Employer id in the path or body does not exist"
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "BenefitPolicy id in the path does not exist"
  - id: ERR_EMPLOYEE_NOT_FOUND
    http: 404
    condition: "Employee id in the path or body does not exist"
  - id: ERR_SCHOOL_NOT_FOUND
    http: 404
    condition: "School id in the path or body does not exist"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "Program id in the body does not exist"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "PartnerAgreement id in the path or body does not exist"
  - id: ERR_LISTING_NOT_FOUND
    http: 404
    condition: "CatalogListing id in the path or body does not exist"
  - id: ERR_REQUEST_NOT_FOUND
    http: 404
    condition: "ProgramApprovalRequest id in the path does not exist"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "Enrollment id in the path does not exist"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "TuitionInvoice id in the path does not exist"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "ReimbursementClaim id in the path does not exist"
  - id: ERR_OBLIGATION_NOT_FOUND
    http: 404
    condition: "RepaymentObligation id in the path does not exist"
  - id: ERR_STALE_EMPLOYEE_VERSION
    http: 412
    condition: "expected_employee_version does not equal Employee.version on POST /enrollments"
  - id: ERR_STALE_AGREEMENT_VERSION
    http: 412
    condition: "expected_agreement_version does not equal PartnerAgreement.version on POST /catalog-listings"
  - id: ERR_POLICY_NOT_DRAFT
    http: 409
    condition: "Activating a BenefitPolicy whose status is ACTIVE or SUPERSEDED"
  - id: ERR_AGREEMENT_INVALID_STATE
    http: 409
    condition: "Activating an agreement that is not PENDING, or terminating one that is not ACTIVE"
  - id: ERR_LISTING_NOT_CURATED
    http: 409
    condition: "The target or referenced CatalogListing has status SUSPENDED"
  - id: ERR_REQUEST_INVALID_STATE
    http: 409
    condition: "Review/decide/resubmit called on a ProgramApprovalRequest whose status does not admit that transition"
  - id: ERR_ENROLLMENT_INVALID_ACADEMIC_STATE
    http: 409
    condition: "The enrollment's academic_status does not admit the requested operation"
  - id: ERR_ENROLLMENT_INVALID_FUNDING_STATE
    http: 409
    condition: "The enrollment's funding_status does not admit the requested operation (e.g. filing a second claim after the first settled)"
  - id: ERR_INVOICE_INVALID_STATE
    http: 409
    condition: "Approving an invoice that is not ISSUED, or paying one that is not APPROVED_FOR_PAYMENT"
  - id: ERR_CLAIM_INVALID_STATE
    http: 409
    condition: "Deciding a ReimbursementClaim that is already APPROVED or REJECTED"
  - id: ERR_OBLIGATION_INVALID_STATE
    http: 409
    condition: "Paying or waiving a RepaymentObligation that is already SETTLED or WAIVED"
  - id: ERR_NO_ACTIVE_POLICY
    http: 409
    condition: "The employer has no BenefitPolicy with status ACTIVE whose half-open window contains the logical clock date"
  - id: ERR_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "The PartnerAgreement referenced by a catalog curation is not ACTIVE, or does not join the supplied employer to the program's school"
  - id: ERR_ACADEMIC_PROGRESS_NOT_MET
    http: 422
    condition: "Filing a claim without a PASSED latest outcome, or posting a PASSED outcome whose grade_points fall below policy.min_passing_grade_points"
  - id: ERR_REIMBURSEMENT_NOT_ALLOWED
    http: 409
    condition: "Filing a reimbursement claim on a DIRECT_BILL enrollment"
  - id: ERR_EMPLOYEE_NOT_ELIGIBLE
    http: 422
    condition: "Employee.eligibility_status is INELIGIBLE_EMPLOYMENT, INELIGIBLE_HOURS or INELIGIBLE_JOB_FAMILY"
  - id: ERR_EMPLOYEE_TENURE_NOT_MET
    http: 422
    condition: "Employee.tenure_months is below policy.min_tenure_months"
  - id: ERR_SCHOOL_NOT_ACCREDITED
    http: 422
    condition: "Approving a non-catalog request for a school that is not ACCREDITED, or activating an agreement with an UNACCREDITED school"
  - id: ERR_COACHING_HOLD_ACTIVE
    http: 409
    condition: "Employee.coaching_hold is true because an open enrollment sits in persistence_tier HIGH"
  - id: ERR_POLICY_PERIOD_OVERLAP
    http: 409
    condition: "The activating policy's half-open window intersects another ACTIVE policy window of the same employer"
  - id: ERR_CONCURRENT_CREDIT_LIMIT
    http: 422
    condition: "Credits across the employee's time-overlapping open enrollments would exceed policy.max_concurrent_credits (closed intervals; one shared day counts)"
  - id: ERR_DUPLICATE_LISTING
    http: 409
    condition: "A CURATED listing or an open approval request already exists for the same (employer, program) pair"
  - id: ERR_DUPLICATE_ENROLLMENT
    http: 409
    condition: "An enrollment for the same (employee, listing, term_code) already exists and is not WITHDRAWN or FAILED"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "A third resubmission of the same ProgramApprovalRequest (revision_count already 2)"
  - id: ERR_REPAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "A repayment amount_cents greater than the obligation's balance_cents"
  - id: ERR_NON_CATALOG_APPROVAL_DISABLED
    http: 422
    condition: "Submitting a non-catalog approval request while the current policy has non_catalog_approval_required == false"
  - id: ERR_FUNDING_MODEL_NOT_ALLOWED
    http: 422
    condition: "The effective funding model is not in CatalogListing.allowed_funding_models, or contradicts a non-HYBRID policy funding_model"
  - id: ERR_ANNUAL_CAP_EXCEEDED
    http: 422
    condition: "Employee.cap_available_cents is 0 for the plan year the new enrollment falls in"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Guild platform operator: onboards employers and schools, disburses money to schools, drives the logical clock and the term-close batch."
    identity: opaque
    exclusive_operations:
      - "POST /employers"
      - "POST /schools"
      - "POST /partner-agreements"
      - "POST /tuition-invoices/{id}/pay"
      - "POST /_clock/set_current_utc"
      - "POST /_ops/term-close"
    shared_operations:
      - "GET /employers/{id}"
      - "GET /employers/{id}/utilization-report"
      - "GET /employers/{id}/benefit-policies"
      - "GET /schools/{id}"
      - "POST /schools/{id}/programs"
      - "GET /schools/{id}/programs"
      - "GET /partner-agreements"
      - "GET /partner-agreements/{id}"
      - "GET /catalog-listings"
      - "GET /catalog-listings/{id}"
      - "GET /enrollments/{id}/invoices"
      - "GET /tax-ledger-entries"
      - "GET /tax-ledger-entries/{id}"

  - name: BenefitAdministrator
    description: "Employer-side HR benefits owner: authors policy versions, activates and terminates partner agreements, curates the catalog, decides non-catalog requests and reimbursement claims, approves invoices for payment, waives repayments."
    identity: "entity_backed:Employer"
    exclusive_operations:
      - "POST /employers/{id}/benefit-policies"
      - "POST /benefit-policies/{id}/activate"
      - "POST /employers/{id}/employees"
      - "GET /employers/{id}/employees"
      - "PATCH /employees/{id}"
      - "POST /partner-agreements/{id}/activate"
      - "POST /partner-agreements/{id}/terminate"
      - "POST /catalog-listings"
      - "POST /catalog-listings/{id}/suspend"
      - "POST /program-approval-requests/{id}/review"
      - "POST /program-approval-requests/{id}/decide"
      - "POST /tuition-invoices/{id}/approve-payment"
      - "POST /reimbursement-claims/{id}/decide"
      - "POST /repayment-obligations/{id}/waive"
    shared_operations:
      - "GET /employers/{id}"
      - "GET /employers/{id}/utilization-report"
      - "GET /employers/{id}/benefit-policies"
      - "GET /employees/{id}"
      - "GET /schools/{id}"
      - "GET /schools/{id}/programs"
      - "GET /partner-agreements"
      - "GET /partner-agreements/{id}"
      - "GET /catalog-listings"
      - "GET /catalog-listings/{id}"
      - "GET /program-approval-requests"
      - "GET /program-approval-requests/{id}"
      - "GET /enrollments"
      - "GET /enrollments/{id}"
      - "GET /enrollments/{id}/academic-outcomes"
      - "GET /enrollments/{id}/coaching-sessions"
      - "GET /enrollments/{id}/invoices"
      - "GET /enrollments/{id}/reimbursement-claims"
      - "GET /enrollments/{id}/repayment-obligations"
      - "GET /tax-ledger-entries"
      - "GET /tax-ledger-entries/{id}"

  - name: Employee
    description: "The learner: requests non-catalog approvals, enrolls, withdraws, files reimbursement claims and repays obligations."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /program-approval-requests"
      - "POST /program-approval-requests/{id}/resubmit"
      - "POST /enrollments"
      - "POST /enrollments/{id}/withdraw"
      - "POST /enrollments/{id}/reimbursement-claims"
      - "POST /repayment-obligations/{id}/payments"
    shared_operations:
      - "GET /employees/{id}"
      - "GET /schools/{id}/programs"
      - "GET /catalog-listings"
      - "GET /catalog-listings/{id}"
      - "GET /program-approval-requests"
      - "GET /program-approval-requests/{id}"
      - "GET /enrollments"
      - "GET /enrollments/{id}"
      - "GET /enrollments/{id}/academic-outcomes"
      - "GET /enrollments/{id}/coaching-sessions"
      - "GET /enrollments/{id}/reimbursement-claims"
      - "GET /enrollments/{id}/repayment-obligations"

  - name: SchoolPartner
    description: "School-side registrar: publishes programs, confirms registrations and posts academic outcomes."
    identity: "entity_backed:School"
    exclusive_operations:
      - "POST /enrollments/{id}/confirm-registration"
      - "POST /enrollments/{id}/academic-outcomes"
    shared_operations:
      - "GET /schools/{id}"
      - "POST /schools/{id}/programs"
      - "GET /schools/{id}/programs"
      - "GET /partner-agreements"
      - "GET /partner-agreements/{id}"
      - "GET /enrollments"
      - "GET /enrollments/{id}"
      - "GET /enrollments/{id}/academic-outcomes"
      - "GET /enrollments/{id}/invoices"

  - name: Coach
    description: "Guild advising coach: logs coaching sessions and tracks persistence risk. Operational identity, not tied to a persisted entity."
    identity: opaque
    exclusive_operations:
      - "POST /enrollments/{id}/coaching-sessions"
    shared_operations:
      - "GET /employees/{id}"
      - "GET /enrollments"
      - "GET /enrollments/{id}"
      - "GET /enrollments/{id}/academic-outcomes"
      - "GET /enrollments/{id}/coaching-sessions"
