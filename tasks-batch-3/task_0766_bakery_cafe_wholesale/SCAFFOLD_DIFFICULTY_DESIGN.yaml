  # =========================================================================
  # Rule 6 — boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: markdown_window_hours_boundary
        grounds:
          - validations[priority=8]
          - calculations.markdown_price
          - state_machines.BakeLot.FRESH_to_MARKED_DOWN
        distinguishing_aspect: "At exactly hours_to_expiry == MARKDOWN_WINDOW_HOURS (8) the lot IS eligible (<= boundary) and uses MID_DISCOUNT because h>4, giving markdown_price_cents=300 — the expiry-hours threshold metric on the markdown endpoint."
        test_recipe:
          setup:
            - "Product base 400 shelf 12; committed line; BakeLot baked 10 with best_by exactly 8h ahead of clock; 7 sold so remaining 3 (ratio 0.3, no surplus)."
