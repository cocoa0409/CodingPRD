              captures: { tech_id: $.data.id }
            - call: "POST /road-service-calls"
              payload: { fleet_account_id: "${fleet_id}", vehicle_id: "${veh_id}", service_location_id: "${loc_id}", priority: "NORMAL", complaint: "Air loss", reported_at: "2026-08-13T12:00:00Z" }
              as: DispatchCoordinator
              captures: { call_id: $.data.id }
          trigger:
            - call: "POST /road-service-calls/${call_id}/dispatch"
              payload: { dispatched_at: "2026-08-13T12:20:00Z", dispatch_miles: 7, technician_id: "${tech_id}" }
              as: DispatchCoordinator
          assert:
            - "RoadServiceCall.${call_id}.dispatch_status == \"DISPATCHED\", technician_id == ${tech_id}, dispatched_at == \"2026-08-13T12:20:00Z\", dispatch_miles == 7"
            - "Technician.${tech_id}.status == \"ON_CALL\" and completed_call_count == 0"
            - "Vehicle.${veh_id}.status == \"OUT_OF_SERVICE\""
            - "RoadServiceCall.${call_id}.billing_status == \"UNBILLED\" — the billing dimension is untouched by dispatch"
            - "committed_response_minutes, actual_response_minutes and gross_cents are all still null: pricing happens at arrive and complete, not at dispatch"

      - name: casing_cyclic_shape_loops_back_to_initial_state
        claim_type: cyclic
        grounds:
          - state_machines.Casing.RETREADED_to_ON_WHEEL
        excluded_because:
          difficulty_instance: non_linear_state_machine / casing_retread_cycle_returns_to_on_wheel
          rationale: "That instance walks the whole six-hop loop and asserts the return to ON_WHEEL with retread_count incremented and the grade cleared."

      - name: road_service_call_parallel_dimension_independence
        claim_type: parallel
        grounds:
          - entities.RoadServiceCall.fields.dispatch_status
          - entities.RoadServiceCall.fields.billing_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / road_service_call_parallel_dispatch_and_billing_dimensions
          rationale: "That instance advances each dimension while pinning the other, which is exactly the independence claim."

      - name: retread_job_guarded_transition_on_line_state
        claim_type: guarded transitions
        grounds:
          - validations.priority_32_business_constraint
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / retread_job_creation_depends_on_retread_line_state
          rationale: "The guard A->B only if line is AVAILABLE is asserted there in both directions."

      - name: retread_completion_ledger_sync_to_fleet_balance
        claim_type: Ledger sync
        grounds:
          - calculations.casing_credit_balance
        excluded_because:
          difficulty_instance: transitive_cascade / retread_completion_ledger_cascade_depth_five
          rationale: "Hops 3 to 5 of that instance reconcile the derived fleet balance and every OPEN invoice before and after."

      - name: invoice_dispute_compensation_without_drift
        claim_type: Compensation
        grounds:
          - state_machines.CrossLocationInvoice.SUBMITTED_to_DISPUTED
        excluded_because:
          difficulty_instance: compensating_invariant / invoice_dispute_restores_credit_ledger_sum
          rationale: "That instance asserts the conserved ledger sum returning to its pre-submit value with the APPLICATION row left intact."

      - name: fail_cure_conditional_cascade_by_failure_reason
        claim_type: Conditional cascade
        grounds:
          - state_machines.RetreadJob.IN_PRODUCTION_to_FAILED_CURE
        excluded_because:
          difficulty_instance: non_linear_state_machine / retread_job_failed_cure_fork_diverges_by_reason
          rationale: "All three conditional side-effect sets are asserted side by side there."

  # -------------------------------------------------------------------
  - section: calculations
    instances:

      - name: survey_finding_ladder_takes_first_match_only
        claim_type: threshold
        grounds:
          - calculations.survey_finding
          - entities.TireSurvey.fields.finding_code
          - entities.TireSurvey.fields.pull_recommended
        distinguishing_aspect: "A survey at tread 3 with pressure 80 satisfies rows 1, 2 and 3 of the ladder at once; only the first match may be reported, so finding_code is TREAD_BELOW_MIN and not TREAD_AT_PULL_POINT or PRESSURE_DEVIATION, even though both later conditions hold."
        test_recipe:
          setup:
            - "a DRIVE policy with min_tread_depth_32nds 4, pull_point_32nds 6, target_pressure_psi 100, pressure_tolerance_pct 0.10"
            - "one mounted asset at odometer 300000"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Ladder Commercial", location_code: "LDC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4016", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Ladder Freight", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/tire-policies"
              payload: { position: "DRIVE", target_pressure_psi: 100, pressure_tolerance_pct: 0.10, min_tread_depth_32nds: 4, pull_point_32nds: 6, max_retread_count: 3, approved_brands: ["Bridgestone"], new_tire_tread_depth_32nds: 24, casing_spec_code: "ANY" }
              as: DealerAdmin
            - call: "POST /fleet-accounts/${fleet_id}/vehicles"
              payload: { unit_number: "T-115", vehicle_type: "TRACTOR", current_odometer_miles: 300000 }
              as: DealerAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-4016", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 125 }
              as: DealerAdmin
              captures: { casing_id: $.data.id }
            - call: "POST /tire-assets"
              payload: { fleet_account_id: "${fleet_id}", casing_id: "${casing_id}", brand: "Bridgestone", cost_basis_cents: 50000 }
              as: DealerAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /tire-assets/${asset_id}/mount"
              payload: { vehicle_id: "${veh_id}", position: "DRIVE", mounted_at: "2026-08-02T09:00:00Z", odometer_at_mount: 300000, tread_depth_at_mount_32nds: 24 }
              as: TireTechnician
          trigger:
            - call: "POST /tire-assets/${asset_id}/surveys"
              payload: { surveyed_at: "2026-08-14T09:00:00Z", pressure_psi: 80, tread_depth_32nds: 3, odometer_miles: 340000 }
              as: TireTechnician
              captures: { survey_id: $.data.id }
          assert:
            - "TireSurvey.${survey_id}.finding_code == \"TREAD_BELOW_MIN\" — first match wins even though tread 3 <= pull point 6 and the pressure deviation also breaches tolerance"
            - "TireSurvey.${survey_id}.pressure_deviation_pct == 0.2000 (abs(80 - 100) / 100 rounded to 4 dp)"
            - "TireSurvey.${survey_id}.pull_recommended == true and TireAsset.${asset_id}.status == \"PULL_FLAGGED\""
            - "TireSurvey.${survey_id}.surveyed_by_user_id is the submitting technician's X-User-ID, not a client-supplied value"

      - name: survey_pressure_deviation_rounded_before_comparison
        claim_type: Precision
        grounds:
          - calculations.survey_finding
          - entities.TireSurvey.fields.pressure_deviation_pct
        distinguishing_aspect: "The deviation is rounded to 4 dp BEFORE the >= comparison. At pressure 96.5 against target 100 the deviation is 0.0350, well under tolerance, so the compliant survey also clears an existing pull flag; the value is reported at four decimals rather than as a raw float."
        test_recipe:
          setup:
            - "the same DRIVE policy (target 100, tolerance 0.10, pull point 6)"
            - "one asset already PULL_FLAGGED by an earlier tread-6 survey"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Precision Commercial", location_code: "PRC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4017", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Precision Freight", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/tire-policies"
