            - { call: "POST /properties/${p_id}/leases", payload: { tenant_name: "T3", suite_ref: "STE-301", commencement_date: "2027-01-01T00:00:00Z", expiry_date: "2027-12-31T00:00:00Z", base_rent_cents_monthly: 110000, sqft: 1000, term_months: 12 }, as: Borrower, as_user_id: "${b_id}", captures: { le3_id: $.data.id } }
