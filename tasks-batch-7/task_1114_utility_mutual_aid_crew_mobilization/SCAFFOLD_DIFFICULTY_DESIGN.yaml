# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# utility-mutual-aid: 9 rules x >=2 instances (rule 1 and rule 2 carry 3 each)
# All money figures are precomputed literals; see formulas in SCAFFOLD.yaml §1.3.
# Shared fixture vocabulary (re-derived per instance, self-contained):
#   host utility HST, responding utility RSP, event "Hurricane Idalia"
#   (premium window 2026-05-02..2026-05-20 inclusive, deadline 2026-05-10T18:00Z),
#   schedule S1: LINE 12000c/h, OT 1.5x, DT 2x, premium 10%, per-diem 8950c.
# =============================================================================
scaffold_difficulty_design:

  # ==========================================================================
  # Rule 1 — dual_variant_calc (instances span THREE entity domains)
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_provisional_vs_final_totals
        grounds:
          - calculations.invoice_totals
          - entities.Invoice.fields.provisional_total_cents
          - entities.Invoice.fields.final_total_cents
          - state_machines.Invoice.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Invoice domain: on identical raw rows, the provisional variant (SUBMITTED
          timesheets estimated + SUBMITTED claims included) yields 360964 while the
          final variant (CERTIFIED + APPROVED only) yields 201866 after one
          timesheet and one claim are rejected — two valid algorithms, different money.
        test_recipe:
          setup:
            - "Event ACTIVE then DEMOBILIZING; request FULFILLED with one ARRIVED+CLEARED LINE crew (equipment 35000c/day)"
            - "T1: WORK 600 min on 2026-05-04 CERTIFIED -> 180200; T2: WORK 480 min on 2026-05-05 left SUBMITTED"
            - "P1: TRAVEL per-diem 2026-05-03 (1 member, 0 meals) APPROVED -> 6713; P2: same on 2026-05-04 left SUBMITTED"
          setup_api_calls:
            - { call: "POST /mutual-aid/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Host Power", company_code: "HST", role_capability: "BOTH", home_region: "Coastal" }, as: ProgramAdmin, captures: { host_id: "$.data.id" } }
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Responder Electric", company_code: "RSP", role_capability: "RESPONDING", home_region: "Inland" }, as: ProgramAdmin, captures: { rsp_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events", payload: { event_name: "Hurricane Idalia", host_utility_id: "${host_id}", event_type: "STORM", declared_start_date: "2026-05-02", premium_window_start: "2026-05-02", premium_window_end: "2026-05-20", mobilization_deadline: "2026-05-10T18:00:00Z" }, as: ProgramAdmin, captures: { ev_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events/${ev_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /mutual-aid/billing-rate-schedules", payload: { event_id: "${ev_id}", effective_start_date: "2026-05-01", effective_end_date: "2026-05-31", rate_lines: [{ crew_type: "LINE", hourly_rate_cents: 12000 }], storm_premium_bps: 1000, per_diem_rate_cents: 8950, per_diem_method: "STANDARD", mobilization_fee_tiers: [{ min_subtotal_cents: 0, fee_bps: 800 }, { min_subtotal_cents: 10000000, fee_bps: 500 }] }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { sch_id: "$.data.id" } }
            - { call: "POST /mutual-aid/billing-rate-schedules/${sch_id}/publish", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
            - { call: "POST /mutual-aid/assistance-requests", payload: { event_id: "${ev_id}", responding_utility_id: "${rsp_id}", requested_crews: [{ crew_type: "LINE", count: 2 }], required_minimum_crews: 1, earliest_start_date: "2026-05-03", latest_end_date: "2026-05-15" }, as: HostCoordinator, as_user_id: "${host_id}", captures: { req_id: "$.data.id" } }
            - { call: "POST /mutual-aid/assistance-requests/${req_id}/submit", payload: {}, as: HostCoordinator, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/assistance-requests/${req_id}/accept", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
            - { call: "POST /mutual-aid/crews", payload: { request_id: "${req_id}", crew_type: "LINE", home_base: "Depot 7", roster: [{ member_ref: "M1", member_role: "foreman" }], equipment_units: [{ unit_type: "bucket_truck", unit_ref: "BT-1", daily_rate_cents: 35000 }] }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { crew_id: "$.data.id" } }
            - { call: "POST /mutual-aid/safety-briefings", payload: { crew_id: "${crew_id}", event_id: "${ev_id}", conductor_operator_ref: "OFF-1", host_rules_version: "HR-2026.1", topics: ["grounding", "storm"] }, as: HostSafetyOfficer, as_user_id: "${host_id}", captures: { brf_id: "$.data.id" } }
            - { call: "POST /mutual-aid/safety-briefings/${brf_id}/acknowledge", payload: { supervisor_operator_ref: "SUP-1" }, as: CrewSupervisor, as_user_id: "${crew_id}" }
            - { call: "POST /mutual-aid/crews/${crew_id}/confirm_arrival", payload: {}, as: HostCoordinator, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /mutual-aid/timesheets", payload: { crew_id: "${crew_id}", work_date: "2026-05-04", day_classification: "WORK", reported_work_minutes: 600 }, as: CrewSupervisor, as_user_id: "${crew_id}", captures: { ts1_id: "$.data.id" } }
            - { call: "POST /mutual-aid/timesheets/${ts1_id}/submit", payload: { submitted_by_operator_ref: "SUP-1" }, as: CrewSupervisor, as_user_id: "${crew_id}" }
            - { call: "POST /mutual-aid/timesheets/${ts1_id}/certify", payload: { certifier_operator_ref: "HC-1" }, as: HostCoordinator, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/timesheets", payload: { crew_id: "${crew_id}", work_date: "2026-05-05", day_classification: "WORK", reported_work_minutes: 480 }, as: CrewSupervisor, as_user_id: "${crew_id}", captures: { ts2_id: "$.data.id" } }
            - { call: "POST /mutual-aid/timesheets/${ts2_id}/submit", payload: { submitted_by_operator_ref: "SUP-1" }, as: CrewSupervisor, as_user_id: "${crew_id}" }
            - { call: "POST /mutual-aid/per-diem-claims", payload: { crew_id: "${crew_id}", claim_date: "2026-05-03", member_count: 1, meals_provided_count: 0, day_factor_type: "TRAVEL" }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { pd1_id: "$.data.id" } }
            - { call: "POST /mutual-aid/per-diem-claims/${pd1_id}/approve", payload: {}, as: HostCoordinator, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/per-diem-claims", payload: { crew_id: "${crew_id}", claim_date: "2026-05-04", member_count: 1, meals_provided_count: 0, day_factor_type: "TRAVEL" }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { pd2_id: "$.data.id" } }
            - { call: "POST /mutual-aid/invoices", payload: { request_id: "${req_id}", rate_schedule_id: "${sch_id}", billing_period_start: "2026-05-01", billing_period_end: "2026-05-31" }, as: RespondingFinance, as_user_id: "${rsp_id}", captures: { inv_id: "$.data.id", prov_total: "$.data.provisional_total_cents" } }
            - { call: "POST /mutual-aid/timesheets/${ts2_id}/reject", payload: {}, as: HostCoordinator, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/per-diem-claims/${pd2_id}/reject", payload: {}, as: HostCoordinator, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/events/${ev_id}/begin_demobilization", payload: {}, as: HostCoordinator, as_user_id: "${host_id}" }
          trigger:
            - { call: "POST /mutual-aid/invoices/${inv_id}/submit", payload: {}, as: RespondingFinance, as_user_id: "${rsp_id}" }
          assert:
            - "Invoice.${inv_id}.provisional_total_cents == 360964 (capture prov_total)"
            - "Invoice.${inv_id}.status == SUBMITTED"
            - "Invoice.${inv_id}.labor_subtotal_cents == 180200"
            - "Invoice.${inv_id}.per_diem_subtotal_cents == 6713"
            - "Invoice.${inv_id}.mobilization_fee_cents == 14953"
            - "Invoice.${inv_id}.final_total_cents == 201866"
            - "Invoice.${inv_id}.outstanding_cents == 201866"
            - "Invoice.${inv_id}.final_total_cents != Invoice.${inv_id}.provisional_total_cents"

      - name: per_diem_standard_vs_actual_method
        grounds:
          - calculations.per_diem_claim_amount
          - entities.PerDiemClaim.fields.method_applied
          - entities.PerDiemClaim.fields.amount_cents
        distinguishing_aspect: |
          PerDiemClaim domain (distinct from the Invoice domain of
          invoice_provisional_vs_final_totals): identical inputs (1 member, 0 meals,
          TRAVEL factor) yield 6713 under STANDARD (round_half_up(8950*0.75)) and
          5000 under ACTUAL (receipts) — variant selected by the effective schedule's
          per_diem_method, and both figures are exposed on the claims.
        test_recipe:
          setup:
            - "One event; responding utility RSP-A on a STANDARD schedule; responding utility RSP-B on an ACTUAL schedule"
            - "Each utility has an ACCEPTED request with one committed crew (roster of 1)"
          setup_api_calls:
            - { call: "POST /mutual-aid/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Host Power", company_code: "HST", role_capability: "BOTH", home_region: "Coastal" }, as: ProgramAdmin, captures: { host_id: "$.data.id" } }
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Responder A", company_code: "RSPA", role_capability: "RESPONDING", home_region: "Inland" }, as: ProgramAdmin, captures: { rspa_id: "$.data.id" } }
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Responder B", company_code: "RSPB", role_capability: "RESPONDING", home_region: "North" }, as: ProgramAdmin, captures: { rspb_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events", payload: { event_name: "Hurricane Idalia", host_utility_id: "${host_id}", event_type: "STORM", declared_start_date: "2026-05-02", premium_window_start: "2026-05-02", premium_window_end: "2026-05-20", mobilization_deadline: "2026-05-10T18:00:00Z" }, as: ProgramAdmin, captures: { ev_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events/${ev_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /mutual-aid/billing-rate-schedules", payload: { event_id: "${ev_id}", effective_start_date: "2026-05-01", effective_end_date: "2026-05-31", rate_lines: [{ crew_type: "LINE", hourly_rate_cents: 12000 }], storm_premium_bps: 1000, per_diem_rate_cents: 8950, per_diem_method: "STANDARD", mobilization_fee_tiers: [{ min_subtotal_cents: 0, fee_bps: 800 }] }, as: RespondingCoordinator, as_user_id: "${rspa_id}", captures: { scha_id: "$.data.id" } }
            - { call: "POST /mutual-aid/billing-rate-schedules/${scha_id}/publish", payload: {}, as: RespondingCoordinator, as_user_id: "${rspa_id}" }
            - { call: "POST /mutual-aid/billing-rate-schedules", payload: { event_id: "${ev_id}", effective_start_date: "2026-05-01", effective_end_date: "2026-05-31", rate_lines: [{ crew_type: "LINE", hourly_rate_cents: 12000 }], storm_premium_bps: 1000, per_diem_rate_cents: 8950, per_diem_method: "ACTUAL", mobilization_fee_tiers: [{ min_subtotal_cents: 0, fee_bps: 800 }] }, as: RespondingCoordinator, as_user_id: "${rspb_id}", captures: { schb_id: "$.data.id" } }
            - { call: "POST /mutual-aid/billing-rate-schedules/${schb_id}/publish", payload: {}, as: RespondingCoordinator, as_user_id: "${rspb_id}" }
            - { call: "POST /mutual-aid/assistance-requests", payload: { event_id: "${ev_id}", responding_utility_id: "${rspa_id}", requested_crews: [{ crew_type: "LINE", count: 1 }], required_minimum_crews: 1, earliest_start_date: "2026-05-03", latest_end_date: "2026-05-15" }, as: HostCoordinator, as_user_id: "${host_id}", captures: { reqa_id: "$.data.id" } }
            - { call: "POST /mutual-aid/assistance-requests/${reqa_id}/submit", payload: {}, as: HostCoordinator, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/assistance-requests/${reqa_id}/accept", payload: {}, as: RespondingCoordinator, as_user_id: "${rspa_id}" }
            - { call: "POST /mutual-aid/crews", payload: { request_id: "${reqa_id}", crew_type: "LINE", home_base: "Depot A", roster: [{ member_ref: "MA1", member_role: "foreman" }], equipment_units: [] }, as: RespondingCoordinator, as_user_id: "${rspa_id}", captures: { crewa_id: "$.data.id" } }
            - { call: "POST /mutual-aid/assistance-requests", payload: { event_id: "${ev_id}", responding_utility_id: "${rspb_id}", requested_crews: [{ crew_type: "LINE", count: 1 }], required_minimum_crews: 1, earliest_start_date: "2026-05-03", latest_end_date: "2026-05-15" }, as: HostCoordinator, as_user_id: "${host_id}", captures: { reqb_id: "$.data.id" } }
            - { call: "POST /mutual-aid/assistance-requests/${reqb_id}/submit", payload: {}, as: HostCoordinator, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/assistance-requests/${reqb_id}/accept", payload: {}, as: RespondingCoordinator, as_user_id: "${rspb_id}" }
            - { call: "POST /mutual-aid/crews", payload: { request_id: "${reqb_id}", crew_type: "LINE", home_base: "Depot B", roster: [{ member_ref: "MB1", member_role: "foreman" }], equipment_units: [] }, as: RespondingCoordinator, as_user_id: "${rspb_id}", captures: { crewb_id: "$.data.id" } }
          trigger:
            - { call: "POST /mutual-aid/per-diem-claims", payload: { crew_id: "${crewa_id}", claim_date: "2026-05-03", member_count: 1, meals_provided_count: 0, day_factor_type: "TRAVEL" }, as: RespondingCoordinator, as_user_id: "${rspa_id}", captures: { cla_id: "$.data.id", cla_amount: "$.data.amount_cents", cla_method: "$.data.method_applied" } }
            - { call: "POST /mutual-aid/per-diem-claims", payload: { crew_id: "${crewb_id}", claim_date: "2026-05-03", member_count: 1, meals_provided_count: 0, day_factor_type: "TRAVEL", receipts_total_cents: 5000 }, as: RespondingCoordinator, as_user_id: "${rspb_id}", captures: { clb_id: "$.data.id", clb_amount: "$.data.amount_cents", clb_method: "$.data.method_applied" } }
          assert:
            - "PerDiemClaim.${cla_id}.method_applied == STANDARD"
            - "PerDiemClaim.${cla_id}.amount_cents == 6713"
            - "PerDiemClaim.${clb_id}.method_applied == ACTUAL"
            - "PerDiemClaim.${clb_id}.amount_cents == 5000"
            - "PerDiemClaim.${cla_id}.amount_cents != PerDiemClaim.${clb_id}.amount_cents"

      - name: aar_as_billed_vs_as_certified_variance
        grounds:
          - calculations.aar_cost_variance
          - entities.AfterActionReport.fields.variance_cents
          - state_machines.AfterActionReport.DRAFTING_to_SUBMITTED
        distinguishing_aspect: |
          AfterActionReport domain (distinct from Invoice and PerDiemClaim): the
          as-certified audit view (186913, fee excluded) and the as-billed
          contractual view (201866, fee included) disagree by exactly the
          mobilization fee — variance_cents == 14953 on identical underlying data.
        test_recipe:
          setup:
            - "Event DEMOBILIZING; request RELEASED; T1 CERTIFIED 180200; P1 APPROVED 6713; invoice SUBMITTED then APPROVED with final_total 201866"
          setup_api_calls:
            - { call: "POST /mutual-aid/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Host Power", company_code: "HST", role_capability: "BOTH", home_region: "Coastal" }, as: ProgramAdmin, captures: { host_id: "$.data.id" } }
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Responder Electric", company_code: "RSP", role_capability: "RESPONDING", home_region: "Inland" }, as: ProgramAdmin, captures: { rsp_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events", payload: { event_name: "Hurricane Idalia", host_utility_id: "${host_id}", event_type: "STORM", declared_start_date: "2026-05-02", premium_window_start: "2026-05-02", premium_window_end: "2026-05-20", mobilization_deadline: "2026-05-10T18:00:00Z" }, as: ProgramAdmin, captures: { ev_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events/${ev_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /mutual-aid/billing-rate-schedules", payload: { event_id: "${ev_id}", effective_start_date: "2026-05-01", effective_end_date: "2026-05-31", rate_lines: [{ crew_type: "LINE", hourly_rate_cents: 12000 }], storm_premium_bps: 1000, per_diem_rate_cents: 8950, per_diem_method: "STANDARD", mobilization_fee_tiers: [{ min_subtotal_cents: 0, fee_bps: 800 }] }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { sch_id: "$.data.id" } }
            - { call: "POST /mutual-aid/billing-rate-schedules/${sch_id}/publish", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
            - { call: "POST /mutual-aid/assistance-requests", payload: { event_id: "${ev_id}", responding_utility_id: "${rsp_id}", requested_crews: [{ crew_type: "LINE", count: 2 }], required_minimum_crews: 1, earliest_start_date: "2026-05-03", latest_end_date: "2026-05-15" }, as: HostCoordinator, as_user_id: "${host_id}", captures: { req_id: "$.data.id" } }
            - { call: "POST /mutual-aid/assistance-requests/${req_id}/submit", payload: {}, as: HostCoordinator, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/assistance-requests/${req_id}/accept", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
            - { call: "POST /mutual-aid/crews", payload: { request_id: "${req_id}", crew_type: "LINE", home_base: "Depot 7", roster: [{ member_ref: "M1", member_role: "foreman" }], equipment_units: [{ unit_type: "bucket_truck", unit_ref: "BT-1", daily_rate_cents: 35000 }] }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { crew_id: "$.data.id" } }
            - { call: "POST /mutual-aid/safety-briefings", payload: { crew_id: "${crew_id}", event_id: "${ev_id}", conductor_operator_ref: "OFF-1", host_rules_version: "HR-2026.1", topics: ["grounding"] }, as: HostSafetyOfficer, as_user_id: "${host_id}", captures: { brf_id: "$.data.id" } }
            - { call: "POST /mutual-aid/safety-briefings/${brf_id}/acknowledge", payload: { supervisor_operator_ref: "SUP-1" }, as: CrewSupervisor, as_user_id: "${crew_id}" }
            - { call: "POST /mutual-aid/crews/${crew_id}/confirm_arrival", payload: {}, as: HostCoordinator, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /mutual-aid/timesheets", payload: { crew_id: "${crew_id}", work_date: "2026-05-04", day_classification: "WORK", reported_work_minutes: 600 }, as: CrewSupervisor, as_user_id: "${crew_id}", captures: { ts1_id: "$.data.id" } }
            - { call: "POST /mutual-aid/timesheets/${ts1_id}/submit", payload: { submitted_by_operator_ref: "SUP-1" }, as: CrewSupervisor, as_user_id: "${crew_id}" }
            - { call: "POST /mutual-aid/timesheets/${ts1_id}/certify", payload: { certifier_operator_ref: "HC-1" }, as: HostCoordinator, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/per-diem-claims", payload: { crew_id: "${crew_id}", claim_date: "2026-05-03", member_count: 1, meals_provided_count: 0, day_factor_type: "TRAVEL" }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { pd1_id: "$.data.id" } }
            - { call: "POST /mutual-aid/per-diem-claims/${pd1_id}/approve", payload: {}, as: HostCoordinator, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/events/${ev_id}/begin_demobilization", payload: {}, as: HostCoordinator, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/invoices", payload: { request_id: "${req_id}", rate_schedule_id: "${sch_id}", billing_period_start: "2026-05-01", billing_period_end: "2026-05-31" }, as: RespondingFinance, as_user_id: "${rsp_id}", captures: { inv_id: "$.data.id" } }
            - { call: "POST /mutual-aid/invoices/${inv_id}/submit", payload: {}, as: RespondingFinance, as_user_id: "${rsp_id}" }
            - { call: "POST /mutual-aid/invoices/${inv_id}/approve", payload: { approver_operator_ref: "FIN-9" }, as: HostFinance, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/crews/${crew_id}/release", payload: {}, as: HostCoordinator, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/crews/${crew_id}/complete_return", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
            - { call: "POST /mutual-aid/after-action-reports", payload: { event_id: "${ev_id}", summary: "Idalia response" }, as: HostCoordinator, as_user_id: "${host_id}", captures: { aar_id: "$.data.id" } }
          trigger:
            - { call: "POST /mutual-aid/after-action-reports/${aar_id}/submit", payload: {}, as: HostCoordinator, as_user_id: "${host_id}" }
          assert:
            - "AfterActionReport.${aar_id}.status == SUBMITTED"
            - "AfterActionReport.${aar_id}.total_crew_days == 1"
            - "AfterActionReport.${aar_id}.as_certified_total_cents == 186913"
            - "AfterActionReport.${aar_id}.as_billed_total_cents == 201866"
            - "AfterActionReport.${aar_id}.variance_cents == 14953"

  # ==========================================================================
  # Rule 2 — combinatorial_formula (modes a, b, c — all three)
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: work_day_tiered_labor_with_premium_and_equipment
        grounds:
          - calculations.crew_daily_billing
          - state_machines.TimeSheet.SUBMITTED_to_CERTIFIED
        distinguishing_aspect: |
          Mode (a): five inputs (minutes, two thresholds, two multipliers, premium
          window membership, equipment total) interact through nested min/max tier
          selection plus a conditional premium branch: 600 min => 480 straight +
          120 OT at 1.5x, premium 10% on rounded labor, equipment added last.
        test_recipe:
          setup: ["Event ACTIVE; request FULFILLED; one ARRIVED+CLEARED LINE crew with equipment_daily_total_cents == 35000; schedule S1 published"]
          setup_api_calls:
            - { call: "POST /mutual-aid/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: ProgramAdmin }
