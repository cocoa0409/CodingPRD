              as: PlatformAdmin
              captures: { ck_id: $.data.id }
            - call: "POST /api/ledger-checkpoints/${ck_id}/adopt"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/terminals"
              payload: { terminal_code: "PHX-WEST", terminal_name: "Phoenix West Hub", state_code: "AZ", apron_capacity: 40 }
              as: TerminalManager
              captures: { t_phx: $.data.id }
            - call: "POST /api/terminals"
              payload: { terminal_code: "TUS-HUB", terminal_name: "Tucson Transfer Hub", state_code: "AZ", apron_capacity: 30 }
              as: TerminalManager
              captures: { t_tus: $.data.id }
            - call: "POST /api/terminals/${t_phx}/operate"
              payload: {}
              as: TerminalManager
            - call: "POST /api/terminals/${t_tus}/operate"
              payload: {}
              as: TerminalManager
            - call: "POST /api/carriers"
              payload: { carrier_name: "Aurora Freight Systems", dot_number: "DOT-3196001" }
              as: ComplianceOfficer
              captures: { car_id: $.data.id }
            - call: "POST /api/carriers/${car_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/shipper-commitments"
              payload: { shipper_name: "Rio Grande Distribution", shipper_floor_per_mile_cents: 100, reserved_window_start_epoch_day: 0, reserved_window_end_epoch_day: 30, committed_slots: 5 }
              as: ShipperPartnershipManager
              captures: { com_id: $.data.id }
            - call: "POST /api/shipper-commitments/${com_id}/confirm"
              payload: {}
              as: ShipperPartnershipManager
            - call: "POST /api/driver-prospects"
              payload: { prospect_name: "Mira Okafor", home_terminal_id: "${t_phx}", pathway: "REMOTE_SUPPORT" }
              as: DriverOutreachCoordinator
              captures: { pro_id: $.data.id }
            - call: "POST /api/driver-prospects"
              payload: { prospect_name: "Sam Delgado", home_terminal_id: "${t_phx}", pathway: "REMOTE_SUPPORT" }
              as: DriverOutreachCoordinator
              captures: { pro2_id: $.data.id }
            - call: "POST /api/corridors"
              payload: { corridor_name: "Sun Belt I-10", origin_terminal_id: "${t_phx}", destination_terminal_id: "${t_tus}", highway_segment_miles: 24, mapped_route: { route_code: "I10-EAST-01", waypoint_count: 14, has_hov_lane: true, requires_tunnel_clearance: false }, weather_profile: "LOW_VISIBILITY", weather_risk_score: 34 }
              as: CorridorOperationsManager
              captures: { cor_id: $.data.id }
            - call: "POST /api/run-plans"
              payload: { corridor_id: "${cor_id}", carrier_id: "${car_id}", origin_terminal_id: "${t_phx}", destination_terminal_id: "${t_tus}", shipper_commitment_id: "${com_id}", window_start_epoch_day: 1, window_end_epoch_day: 3, trailer_count: 1, posted_per_mile_cents: 225, hauler_team_id: "${pro_id}", sacra_loadboard_slot_held: true }
              as: CarrierDispatcher
              captures: { rp_id: $.data.id }
            - call: "POST /api/terminals/${t_phx}/service-windows"
              payload: { run_plan_id: "${rp_id}", service_type: "HANDOFF_OUTBOUND", window_start_minute: 100, window_end_minute: 160, handoff_duration_minutes: 20, buffer_minutes: 15, yield_to_transit: false }
              as: TerminalManager
              captures: { win_id: $.data.id }
            - call: "POST /api/remote-support-assignments"
              payload: { corridor_id: "${cor_id}", run_plan_id: "${rp_id}", monitoring_start_at: "2026-09-10T00:30:00Z", monitoring_end_at: "2026-09-10T04:00:00Z", remote_operator_id: "${pro_id}", safety_support_operator_id: "${pro2_id}", geofence_type: "GEOFENCE_ONLY", intervention_protocol: "STANDBY_TAKEOVER" }
              as: RemoteSupportSupervisor
