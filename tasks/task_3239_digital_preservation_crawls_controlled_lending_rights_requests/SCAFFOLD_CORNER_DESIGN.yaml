            - "WaitlistEntry.${esw2}.offer_expires_at == 2026-09-05T01:00:00Z (offered at sweep time + 48h)"
      - name: promotion_skips_ineligible_head_and_offers_next
        claim_type: selector_policy
        grounds:
          - calculations.waitlist_promotion
        distinguishing_aspect: "Selector policy: when the earliest OPEN entry's patron is at the loan cap, promotion skips that entry (it stays OPEN) and offers the next eligible entry; the empty-pool fallback produces no offer."
        test_recipe:
