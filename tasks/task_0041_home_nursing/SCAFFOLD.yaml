# =============================================================================
# Home Nursing Service — PRD Benchmark Scaffold (v1)
# =============================================================================

scenario: |
  On-demand home nursing service: nurse qualification certification with nursing
  license verification, hospital-affiliation verification, specialty-skill tagging,
  training and continuing-education records, periodic re-certification, and
  disqualification handling; patient ordering with service-item catalog, service
  description and contraindications, medical document upload (prescription/discharge
  summary), service-address and time selection, and order-eligibility review for
  specific items; nurse matching and dispatch with skill matching, geographic-distance
  filtering, nurse availability and workload, patient-preference (gender/language)
  consideration, dispatch acceptance window, and re-dispatch on rejection; service
  execution records with on-site check-in (GPS/face), service-procedure checklist,
  vital-sign and medication records, photo or signature evidence, abnormal-event
  reporting, and service completion confirmation; medical waste registration with
  waste-category classification (sharps/infectious/pharmaceutical), quantity records,
  sealed-package handling, qualified-disposal-unit handover, and disposal certificate
  archiving; fee settlement with service-item pricing, distance and time-of-day
  surcharge, package deduction, refund rules, nurse revenue sharing, tax handling,
  and periodic payout; complaint handling with complaint submission and categorization,
  nurse-related and service-related routing, multi-stage review, mediation and
  compensation, and nurse rating impact; event-driven synchronization with payment,
  IM, identity verification, and medical-waste-disposal systems; audit logging for
  service records and complaint handling.

domain_name: home-nursing
api_prefix: /orders

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: selector_policy
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - selector_policy

  entity_topology: hybrid
  state_machine_shape: branching            # cyclic re-dispatch + parallel order_status × payment_status
  relationship_patterns:
    - one_to_many                           # Nurse 1—* CertificationRecord, Order 1—* WasteEntry
    - many_to_many                          # Nurse <-> ServiceItem via specialty tags
    - cross_aggregate                       # Complaint references Order, ServiceRecord, Nurse
  role_model: peer_roles                    # Patient, Nurse, ComplianceOfficer, PlatformAdmin
  consistency_model: saga                   # multi-step order → dispatch → execution → settlement with compensation

# =============================================================================
# §1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Nurse
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Nurse legal name" }
      - { name: gender, type: enum, source: input, description: "M | F | O", constraints: "M|F|O" }
      - { name: languages, type: array, source: input, description: "Array of ISO 639-1 codes (e.g., ['zh','en'])" }
      - { name: license_number, type: string, source: input, description: "Government nursing license id; unique" }
      - { name: license_verified, type: boolean, source: computed, default: false, description: "True after identity-verification system confirms license" }
      - { name: hospital_affiliation_verified, type: boolean, source: computed, default: false, description: "True after employer hospital handshake confirms current employment" }
      - { name: specialty_tags, type: array, source: input, description: "Array of skill tags from {WOUND_CARE, IV_INFUSION, CATHETER_CARE, MATERNAL_NEWBORN, ELDERLY_CARE, PALLIATIVE}" }
      - { name: home_lat, type: number, source: input, description: "Nurse base latitude (decimal degrees, signed)" }
      - { name: home_lng, type: number, source: input, description: "Nurse base longitude (decimal degrees, signed)" }
      - { name: max_daily_orders, type: integer, source: input, default: 6, description: "Workload ceiling per local calendar day; integer >= 1" }
      - { name: revenue_share_bps, type: integer, source: input, default: 7000, description: "Nurse share of net service revenue in basis points (10000 = 100%)" }
      - { name: rating, type: number, source: computed, default: 5.00, description: "Latest 50 ratings average; 1.00–5.00, two decimals" }
      - { name: certification_status, type: enum, source: system, default: PENDING, description: "PENDING | CERTIFIED | EXPIRING | DISQUALIFIED" }
      - { name: certified_until, type: datetime, source: computed, description: "Last successful re-certification expiration timestamp; null until first certification" }

  - name: CertificationRecord
    parent: Nurse
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: nurse_id, type: string, source: system, description: "FK to Nurse.id" }
      - { name: kind, type: enum, source: input, description: "INITIAL | RECERTIFICATION | TRAINING | DISQUALIFICATION" }
      - { name: training_hours, type: number, source: input, default: 0, description: "Continuing-education hours credited (>= 0)" }
      - { name: outcome, type: enum, source: input, description: "PASS | FAIL" }
      - { name: effective_at, type: datetime, source: input, description: "When this record takes effect" }
      - { name: notes, type: string, source: input, description: "Reviewer notes" }
      - { name: created_at, type: datetime, source: system, description: "Record creation timestamp" }

  - name: ServiceItem
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Catalog code, unique (e.g., 'IV001')" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: description, type: string, source: input, description: "Patient-facing description" }
      - { name: contraindications, type: string, source: input, description: "Contraindication notes (free text)" }
      - { name: required_skill, type: enum, source: input, description: "Single tag the nurse MUST have; one of {WOUND_CARE, IV_INFUSION, CATHETER_CARE, MATERNAL_NEWBORN, ELDERLY_CARE, PALLIATIVE}" }
      - { name: requires_medical_doc, type: boolean, source: input, default: false, description: "If true, order must attach prescription or discharge summary" }
      - { name: requires_eligibility_review, type: boolean, source: input, default: false, description: "If true, order needs ComplianceOfficer review before dispatch" }
      - { name: base_price_cents, type: integer, source: input, description: "Base price in fen/cents (>= 0)" }
      - { name: duration_minutes, type: integer, source: input, description: "Standard service duration; integer > 0" }
      - { name: active, type: boolean, source: input, default: true, description: "Soft-disable flag" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "Caller (Patient) id; equals X-User-ID at creation" }
      - { name: service_item_code, type: string, source: input, description: "FK to ServiceItem.code" }
      - { name: service_address, type: string, source: input, description: "Free-text address" }
      - { name: service_lat, type: number, source: input, description: "Address latitude" }
      - { name: service_lng, type: number, source: input, description: "Address longitude" }
      - { name: scheduled_start, type: datetime, source: input, description: "Requested start time (UTC ISO8601)" }
      - { name: preferred_gender, type: enum, source: input, default: ANY, description: "M | F | ANY" }
      - { name: preferred_language, type: string, source: input, default: "any", description: "ISO 639-1 code or 'any'" }
      - { name: medical_doc_url, type: string, source: input, description: "URL to uploaded document; required when ServiceItem.requires_medical_doc" }
      - { name: package_id, type: string, source: input, description: "Optional Package.id used to deduct credits" }
      - { name: estimated_fee_cents, type: integer, source: computed, description: "Pre-dispatch fee estimate (provisional)" }
      - { name: final_fee_cents, type: integer, source: computed, description: "Post-completion finalized fee" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | UNDER_REVIEW | AWAITING_DISPATCH | DISPATCHED | IN_PROGRESS | COMPLETED | CANCELLED | REJECTED" }
      - { name: payment_status, type: enum, source: system, default: UNPAID, description: "UNPAID | AUTHORIZED | CAPTURED | REFUNDED" }
      - { name: cancelled_reason, type: string, source: input, description: "Free text on cancel" }
      - { name: dispatch_attempt_count, type: integer, source: computed, default: 0, description: "Total Dispatch records created for this order" }

  - name: Dispatch
    parent: Order
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: order_id, type: string, source: system, description: "FK to Order.id" }
      - { name: nurse_id, type: string, source: system, description: "Selected Nurse.id" }
      - { name: ranked_score, type: number, source: computed, description: "Composite score used to pick this nurse" }
      - { name: distance_km, type: number, source: computed, description: "Haversine distance from nurse home to service address (km, 3 decimals)" }
      - { name: offered_at, type: datetime, source: system, description: "When dispatch was sent" }
      - { name: accept_deadline, type: datetime, source: computed, description: "offered_at + ACCEPTANCE_WINDOW_SECONDS" }
      - { name: status, type: enum, source: system, default: OFFERED, description: "OFFERED | ACCEPTED | REJECTED | EXPIRED | CANCELLED" }
      - { name: rejection_reason, type: string, source: input, description: "Free text from nurse on reject" }
      - { name: created_at, type: datetime, source: system, description: "Record creation timestamp" }

  - name: ServiceRecord
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK to Order.id (1:1)" }
      - { name: nurse_id, type: string, source: system, description: "Acting nurse" }
      - { name: checkin_at, type: datetime, source: input, description: "On-site check-in timestamp" }
      - { name: checkin_lat, type: number, source: input, description: "GPS latitude at check-in" }
      - { name: checkin_lng, type: number, source: input, description: "GPS longitude at check-in" }
      - { name: face_verification_passed, type: boolean, source: input, description: "Identity-verification result captured at check-in" }
      - { name: checklist_items, type: array, source: input, description: "Array of {step, done:boolean, note}; each step in service procedure must appear" }
      - { name: vitals, type: array, source: input, description: "Array of {ts, type:enum(BP|HR|TEMP|SPO2|GLU), value, unit}" }
      - { name: medications_administered, type: array, source: input, description: "Array of {name, dose, route, ts}" }
      - { name: evidence_urls, type: array, source: input, description: "Photo or signature URLs (>= 1 entry)" }
      - { name: abnormal_events, type: array, source: input, description: "Array of {ts, severity:enum(LOW|MEDIUM|HIGH), description}" }
      - { name: completed_at, type: datetime, source: input, description: "Patient-confirmed completion timestamp" }
      - { name: status, type: enum, source: system, default: STARTED, description: "STARTED | IN_PROGRESS | AWAITING_PATIENT_CONFIRM | COMPLETED" }

  - name: WasteEntry
    parent: ServiceRecord
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: order_id, type: string, source: system, description: "FK to Order.id" }
      - { name: category, type: enum, source: input, description: "SHARPS | INFECTIOUS | PHARMACEUTICAL" }
      - { name: quantity, type: number, source: input, description: "Amount (positive number; unit by category)" }
      - { name: unit, type: enum, source: input, description: "PCS | LITERS | KG" }
      - { name: sealed, type: boolean, source: input, description: "True when sealed-package handling done" }
      - { name: disposal_unit_id, type: string, source: input, description: "Qualified disposal-unit identifier; opaque" }
      - { name: handover_at, type: datetime, source: input, description: "Time disposal unit took custody" }
      - { name: certificate_url, type: string, source: input, description: "Disposal certificate URL after handover; null while pending" }
      - { name: status, type: enum, source: system, default: REGISTERED, description: "REGISTERED | HANDED_OVER | ARCHIVED" }
      - { name: created_at, type: datetime, source: system, description: "Record creation timestamp" }

  - name: Package
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "Owning Patient id" }
      - { name: service_item_code, type: string, source: input, description: "ServiceItem this package covers" }
      - { name: total_credits, type: integer, source: input, description: "Total prepaid sessions; integer > 0" }
      - { name: used_credits, type: integer, source: computed, default: 0, description: "Credits consumed; integer >= 0" }
      - { name: expires_at, type: datetime, source: input, description: "Package validity end" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | EXHAUSTED | EXPIRED" }

  - name: Settlement
    parent: Order
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: order_id, type: string, source: system, description: "FK to Order.id (1:1)" }
      - { name: gross_fee_cents, type: integer, source: computed, description: "Final pre-tax fee" }
      - { name: distance_surcharge_cents, type: integer, source: computed, description: "Distance surcharge component" }
      - { name: time_of_day_surcharge_cents, type: integer, source: computed, description: "Time-of-day surcharge component" }
      - { name: package_deduction_cents, type: integer, source: computed, description: "Reduction from used package credit" }
      - { name: refund_cents, type: integer, source: computed, default: 0, description: "Refund applied per refund rules" }
      - { name: tax_cents, type: integer, source: computed, description: "Tax computed on net taxable base" }
      - { name: nurse_revenue_share_cents, type: integer, source: computed, description: "Nurse cut after tax" }
      - { name: platform_share_cents, type: integer, source: computed, description: "Platform cut after tax" }
      - { name: payout_batch_id, type: string, source: system, description: "Set when included in a periodic payout batch; null while pending" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | FINALIZED | PAID_OUT | REVERSED" }
      - { name: created_at, type: datetime, source: system, description: "Record creation timestamp" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "Subject order" }
      - { name: nurse_id, type: string, source: computed, description: "Copied from Order.assigned nurse at submission" }
      - { name: patient_id, type: string, source: computed, description: "Copied from Order.patient_id" }
      - { name: category, type: enum, source: input, description: "NURSE_MISCONDUCT | SERVICE_QUALITY | BILLING | SAFETY | OTHER" }
      - { name: routing, type: enum, source: computed, description: "NURSE_RELATED | SERVICE_RELATED — derived from category" }
      - { name: description, type: string, source: input, description: "Patient narrative" }
      - { name: stage, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | TRIAGE | MEDIATION | RESOLVED | REJECTED" }
      - { name: rating_impact, type: number, source: computed, default: 0, description: "Signed rating delta applied to nurse on resolution (negative reduces rating)" }
      - { name: compensation_cents, type: integer, source: computed, default: 0, description: "Compensation paid to patient on RESOLVED" }
      - { name: resolution_notes, type: string, source: input, description: "Final note from ComplianceOfficer" }

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: subject_type, type: enum, source: system, description: "ORDER | SERVICE_RECORD | COMPLAINT | NURSE" }
      - { name: subject_id, type: string, source: system, description: "Id of the subject" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role at time of action" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID at time of action" }
      - { name: action, type: string, source: system, description: "Short action verb (e.g., CHECKIN, COMPLETE, COMPLAINT_RESOLVE)" }
      - { name: payload, type: object, source: system, description: "Snapshot of the request body / state diff" }
      - { name: created_at, type: datetime, source: system, description: "Append-only timestamp" }

  - name: PayoutBatch
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "UUID" }
      - { name: cutoff_at, type: datetime, source: input, description: "Inclusive upper bound for Settlement.created_at to be included" }
      - { name: total_settlements, type: integer, source: computed, description: "Number of settlements paid out" }
      - { name: total_nurse_share_cents, type: integer, source: computed, description: "Sum of nurse_revenue_share_cents in this batch" }
      - { name: total_platform_share_cents, type: integer, source: computed, description: "Sum of platform_share_cents in this batch" }
      - { name: status, type: enum, source: system, default: BUILDING, description: "BUILDING | PAID" }
      - { name: created_at, type: datetime, source: system, description: "Record creation timestamp" }

# =============================================================================
# §1.2: State Machine Table
# =============================================================================
state_machines:
  # ---- Nurse certification lifecycle ----
  - entity: Nurse
    field: certification_status
    initial_state: PENDING
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: PENDING
        to: CERTIFIED
        trigger: "POST /nurses/{nurseId}/certification-records (kind=INITIAL, outcome=PASS)"
        actor: ComplianceOfficer
        preconditions:
          - "Nurse.license_verified == true (identity-verification system handshake)"
          - "Nurse.hospital_affiliation_verified == true"
          - "Sum of training_hours over CertificationRecord(kind in {INITIAL,TRAINING}) >= MIN_TRAINING_HOURS (24)"
        side_effects:
          - "Set Nurse.certified_until = effective_at + RECERT_VALIDITY_DAYS (365 days)"
          - "Append AuditLog(NURSE, CERTIFY)"

      - from: CERTIFIED
        to: EXPIRING
        trigger: "POST /_clock/advance crosses (Nurse.certified_until - EXPIRY_WARNING_DAYS, 30)"
        actor: system
        preconditions:
          - "now() >= Nurse.certified_until - 30 days AND now() < Nurse.certified_until"
        side_effects:
          - "Append AuditLog(NURSE, EXPIRY_WARNING)"

      - from: EXPIRING
        to: CERTIFIED
        trigger: "POST /nurses/{nurseId}/certification-records (kind=RECERTIFICATION, outcome=PASS)"
        actor: ComplianceOfficer
        preconditions:
          - "training_hours_since_last_cert >= MIN_RECERT_TRAINING_HOURS (12)"
        side_effects:
          - "Set Nurse.certified_until = effective_at + RECERT_VALIDITY_DAYS"
          - "Append AuditLog(NURSE, RECERTIFY)"

      - from: [CERTIFIED, EXPIRING]
        to: PENDING
        trigger: "POST /_clock/advance crosses Nurse.certified_until"
        actor: system
        preconditions:
          - "now() >= Nurse.certified_until"
        side_effects:
          - "Cancel all OFFERED Dispatch rows for this nurse → status=CANCELLED"
          - "Append AuditLog(NURSE, CERT_LAPSED)"

      - from: [PENDING, CERTIFIED, EXPIRING]
        to: DISQUALIFIED
        trigger: "POST /nurses/{nurseId}/certification-records (kind=DISQUALIFICATION)"
        actor: ComplianceOfficer
        preconditions:
          - "Nurse.certification_status != DISQUALIFIED"
        side_effects:
          - "Cancel all OFFERED Dispatch rows for this nurse → CANCELLED"
          - "Trigger re-dispatch for each affected Order (see Order.AWAITING_DISPATCH→DISPATCHED logic)"
          - "Append AuditLog(NURSE, DISQUALIFY)"

  # ---- Order lifecycle (status dimension) ----
  - entity: Order
    field: status
    initial_state: SUBMITTED
    terminal_states: [COMPLETED, CANCELLED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "system (auto) when ServiceItem.requires_eligibility_review == true at order creation"
        actor: system
        preconditions:
          - "ServiceItem.requires_eligibility_review == true"
        side_effects: []

      - from: SUBMITTED
        to: AWAITING_DISPATCH
        trigger: "system (auto) when ServiceItem.requires_eligibility_review == false at order creation"
        actor: system
        preconditions:
          - "ServiceItem.requires_eligibility_review == false"
        side_effects:
          - "Trigger nurse selection and Dispatch creation (see selector_policy in §1.3)"

      - from: UNDER_REVIEW
        to: AWAITING_DISPATCH
        trigger: "POST /orders/{orderId}/eligibility-review (decision=APPROVE)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Trigger nurse selection and Dispatch creation"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /orders/{orderId}/eligibility-review (decision=REJECT)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "If payment_status==AUTHORIZED → emit refund event, set payment_status=REFUNDED"
          - "If package_id set, do NOT consume any credit (already not consumed pre-dispatch)"

      - from: AWAITING_DISPATCH
        to: DISPATCHED
        trigger: "system (Dispatch.status flips OFFERED→ACCEPTED)"
        actor: system
        preconditions:
          - "There is a Dispatch d with d.order_id=Order.id and d.status=ACCEPTED"
        side_effects:
          - "Order.dispatch_attempt_count remains; nurse is locked"

      - from: DISPATCHED
        to: AWAITING_DISPATCH
        trigger: "system (Dispatch.status flips OFFERED→REJECTED or OFFERED→EXPIRED while no other ACCEPTED)"
        actor: system
        preconditions:
          - "Order.dispatch_attempt_count < MAX_DISPATCH_ATTEMPTS (5)"
          - "No ACCEPTED Dispatch exists for this Order"
        side_effects:
          - "Re-run nurse selection excluding nurses tied to prior REJECTED/EXPIRED dispatches for this order"
          - "If selector returns empty → set Order.status=CANCELLED with reason ERR_NO_AVAILABLE_NURSE"

      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /orders/{orderId}/service-record (initial check-in)"
        actor: Nurse
        preconditions:
          - "ServiceRecord does not yet exist"
          - "checkin GPS within MAX_CHECKIN_RADIUS_KM (0.5) of service address"
          - "face_verification_passed == true"
        side_effects:
          - "Create ServiceRecord with status=STARTED"
          - "Append AuditLog(SERVICE_RECORD, CHECKIN)"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /orders/{orderId}/confirm-completion"
        actor: Patient
        preconditions:
          - "ServiceRecord.status == AWAITING_PATIENT_CONFIRM"
          - "All required WasteEntry rows ARCHIVED for this order (when ServiceItem produces waste — i.e., required_skill in {WOUND_CARE, IV_INFUSION, CATHETER_CARE})"
        side_effects:
          - "ServiceRecord.status → COMPLETED"
          - "Compute final_fee_cents per §1.3 final_settlement"
          - "Create Settlement(status=FINALIZED), capture payment, emit IM 'order completed' event"
          - "If Package used → Package.used_credits += 1; if used_credits == total_credits → Package.status=EXHAUSTED"
          - "Append AuditLog(ORDER, COMPLETE)"

      - from: [SUBMITTED, UNDER_REVIEW, AWAITING_DISPATCH]
        to: CANCELLED
        trigger: "POST /orders/{orderId}/cancel"
        actor: Patient
        preconditions:
          - "Order.status NOT IN {DISPATCHED, IN_PROGRESS, COMPLETED, CANCELLED, REJECTED}"
        side_effects:
          - "Cancel any OFFERED Dispatch → CANCELLED"
          - "If payment_status==AUTHORIZED → set payment_status=REFUNDED"

  # ---- Order payment dimension (parallel to status) ----
  - entity: Order
    field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    transitions:
      - from: UNPAID
        to: AUTHORIZED
        trigger: "POST /orders (creation success), system emits payment authorize event"
        actor: system
        preconditions:
          - "estimated_fee_cents > 0"
        side_effects: []

      - from: AUTHORIZED
        to: CAPTURED
        trigger: "system (Order.status enters COMPLETED)"
        actor: system
        preconditions:
          - "Order.status == COMPLETED"
        side_effects:
          - "Settlement.status set to FINALIZED"

      - from: AUTHORIZED
        to: REFUNDED
        trigger: "system (Order cancelled or rejected)"
        actor: system
        preconditions:
          - "Order.status IN {CANCELLED, REJECTED}"
        side_effects: []

      - from: CAPTURED
        to: REFUNDED
        trigger: "POST /orders/{orderId}/refund"
        actor: ComplianceOfficer
        preconditions:
          - "Order.status == COMPLETED"
          - "Settlement.status IN {FINALIZED, PAID_OUT}"
          - "Refund must conform to §1.3 refund_calc (within REFUND_WINDOW_HOURS=24 of completion)"
        side_effects:
          - "Settlement.status → REVERSED"
          - "Settlement.refund_cents recomputed"
          - "If Settlement was PAID_OUT, debit nurse share from next PayoutBatch"

  # ---- Dispatch lifecycle ----
  - entity: Dispatch
    field: status
    initial_state: OFFERED
    terminal_states: [ACCEPTED, REJECTED, EXPIRED, CANCELLED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /dispatches/{dispatchId}/accept"
        actor: Nurse
        preconditions:
          - "now() < Dispatch.accept_deadline"
          - "X-User-ID == Dispatch.nurse_id"
          - "Order.status == AWAITING_DISPATCH OR (Order.status == DISPATCHED AND no other ACCEPTED dispatch)"
        side_effects:
          - "Order.status → DISPATCHED"
          - "All other OFFERED Dispatch rows for this order → CANCELLED (only this one wins)"

      - from: OFFERED
        to: REJECTED
        trigger: "POST /dispatches/{dispatchId}/reject"
        actor: Nurse
        preconditions:
          - "now() < Dispatch.accept_deadline"
          - "X-User-ID == Dispatch.nurse_id"
        side_effects:
          - "Trigger Order re-dispatch flow (see Order.DISPATCHED→AWAITING_DISPATCH transition logic)"

      - from: OFFERED
        to: EXPIRED
        trigger: "POST /_clock/advance crosses Dispatch.accept_deadline"
        actor: system
        preconditions:
          - "now() >= Dispatch.accept_deadline"
        side_effects:
          - "Trigger Order re-dispatch flow"

      - from: OFFERED
        to: CANCELLED
        trigger: "system (Order cancelled, or Nurse disqualified, or another Dispatch accepted)"
        actor: system
        preconditions: []
        side_effects: []

  # ---- ServiceRecord lifecycle ----
  - entity: ServiceRecord
    field: status
    initial_state: STARTED
    terminal_states: [COMPLETED]
    transitions:
      - from: STARTED
        to: IN_PROGRESS
        trigger: "PATCH /orders/{orderId}/service-record (append checklist/vitals)"
        actor: Nurse
        preconditions:
          - "checkin_at recorded"
        side_effects: []

      - from: IN_PROGRESS
        to: AWAITING_PATIENT_CONFIRM
        trigger: "POST /orders/{orderId}/service-record/finish"
        actor: Nurse
        preconditions:
          - "All checklist_items[].done == true"
          - "len(evidence_urls) >= 1"
          - "All HIGH-severity abnormal_events have a paired note (description non-empty)"
        side_effects:
          - "Set ServiceRecord.completed_at = now()"

      - from: AWAITING_PATIENT_CONFIRM
        to: COMPLETED
        trigger: "system (Order.status enters COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []

  # ---- WasteEntry lifecycle ----
  - entity: WasteEntry
    field: status
    initial_state: REGISTERED
    terminal_states: [ARCHIVED]
    transitions:
      - from: REGISTERED
        to: HANDED_OVER
        trigger: "PATCH /orders/{orderId}/waste-entries/{wasteId} (sealed=true, disposal_unit_id, handover_at)"
        actor: Nurse
        preconditions:
          - "WasteEntry.sealed == true"
          - "WasteEntry.disposal_unit_id present"
        side_effects: []

      - from: HANDED_OVER
        to: ARCHIVED
        trigger: "POST /_events/emit (medical-waste-disposal system returns certificate_url)"
        actor: system
        preconditions:
          - "certificate_url is non-empty"
        side_effects:
          - "Append AuditLog(SERVICE_RECORD, WASTE_ARCHIVED)"

  # ---- Complaint lifecycle ----
  - entity: Complaint
    field: stage
    initial_state: SUBMITTED
    terminal_states: [RESOLVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: TRIAGE
        trigger: "POST /complaints/{complaintId}/triage"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Set routing = NURSE_RELATED if category in {NURSE_MISCONDUCT, SAFETY} else SERVICE_RELATED"

      - from: TRIAGE
        to: MEDIATION
        trigger: "POST /complaints/{complaintId}/escalate-mediation"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

      - from: TRIAGE
        to: REJECTED
        trigger: "POST /complaints/{complaintId}/resolve (decision=REJECT)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Append AuditLog(COMPLAINT, REJECT)"

      - from: MEDIATION
        to: RESOLVED
        trigger: "POST /complaints/{complaintId}/resolve (decision=UPHOLD, compensation_cents, rating_impact)"
        actor: ComplianceOfficer
        preconditions:
          - "compensation_cents <= Settlement.gross_fee_cents (cap)"
          - "If routing == NURSE_RELATED: rating_impact in [-1.0, 0]; else rating_impact == 0"
        side_effects:
          - "Apply rating_impact to Nurse.rating (clamped to [1.00, 5.00])"
          - "If compensation_cents > 0 → Settlement.refund_cents += compensation_cents; if Settlement was FINALIZED/PAID_OUT → Settlement.status=REVERSED"
          - "Append AuditLog(COMPLAINT, RESOLVE)"

      - from: MEDIATION
        to: REJECTED
        trigger: "POST /complaints/{complaintId}/resolve (decision=REJECT)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Append AuditLog(COMPLAINT, REJECT)"

# =============================================================================
# §1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two nurses simultaneously accept the same Dispatch offer (or distinct dispatches for the same Order)"
    guarantee: "At most one Dispatch reaches ACCEPTED per Order; the late writer is rejected"
    error_id: ERR_DISPATCH_ALREADY_TAKEN
    http_status: 409
    serialization: "First-writer-wins on (order_id, status=ACCEPTED) uniqueness"

  - scenario: "Patient cancels Order while system finalizes a Dispatch acceptance"
    guarantee: "Exactly one wins; loser receives ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Order.status"

  - scenario: "Two ComplianceOfficers run resolve on the same Complaint at once"
    guarantee: "Only one resolve commits; the second sees ERR_INVALID_STATE because stage is no longer MEDIATION/TRIAGE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Complaint.stage"

  - scenario: "Two Patients (or replays) submit duplicate orders with the same Idempotency-Key"
    guarantee: "Only the first creates the Order; subsequent identical requests return the original Order"
    error_id: ERR_IDEMPOTENCY_KEY_REUSED
    http_status: 409
    serialization: "Idempotency-Key uniqueness within Patient scope"

  - scenario: "Two attempts to build a PayoutBatch with overlapping cutoff_at"
    guarantee: "Only one BUILDING batch may exist; the second is rejected"
    error_id: ERR_PAYOUT_BATCH_ALREADY_BUILDING
    http_status: 409
    serialization: "First-writer-wins on PayoutBatch.status=BUILDING"

# =============================================================================
# §1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: estimated_fee
    trigger: "POST /orders (order creation, before Dispatch); refreshed on UNDER_REVIEW→AWAITING_DISPATCH"
    algorithm: forward_looking
    formula: |
      base = ServiceItem.base_price_cents
      # Use planned scheduled_start, MAX rounded distance from any candidate nurse home, no actual waste yet
      distance_km_estimate = haversine(Patient.lat_lng, ServiceItem.center_or_default)
      distance_surcharge = max(0, ceil(distance_km_estimate - DIST_FREE_KM)) * DIST_PRICE_PER_KM_CENTS
      hour = scheduled_start.hour (UTC)
      tod_multiplier_bps = NIGHT_BPS if (hour < 6 or hour >= 22) else (WEEKEND_BPS if scheduled_start is Sat/Sun else DAY_BPS)
      tod_surcharge = round_half_up(base * (tod_multiplier_bps - 10000) / 10000)
      package_deduction_cents = base if (package valid AND active AND used < total) else 0
      net = max(0, base + distance_surcharge + tod_surcharge - package_deduction_cents)
      tax = round_half_up(net * TAX_BPS / 10000)
      estimated_fee_cents = net + tax
      # Rounding order pinned: per-component round_half_up THEN sum, NOT sum-then-round
    input_set: "ServiceItem (active=true), Order (status=SUBMITTED), Package (status=ACTIVE) only"
    constants:
      DIST_FREE_KM: 5
      DIST_PRICE_PER_KM_CENTS: 200
      DAY_BPS: 10000
      NIGHT_BPS: 13000
      WEEKEND_BPS: 11500
      TAX_BPS: 600
    precision: "integer cents, round_half_up at each component"
    variants:
      - name: estimated_fee
        when: "before service execution begins"
        difference: "Uses scheduled_start (planned); distance estimated from ServiceItem default; package_deduction projected (not yet consumed)"

  - name: final_settlement
    trigger: "Order.IN_PROGRESS→COMPLETED transition (chronological replay over actual events)"
    algorithm: chronological
    formula: |
      base = ServiceItem.base_price_cents
      # Use ACTUAL Dispatch.distance_km from the accepted dispatch
      distance_km_actual = ACCEPTED_dispatch.distance_km
      distance_surcharge = max(0, ceil(distance_km_actual - DIST_FREE_KM)) * DIST_PRICE_PER_KM_CENTS
      # Use ACTUAL ServiceRecord.checkin_at for time-of-day lookup
      hour = ServiceRecord.checkin_at.hour (UTC)
      tod_multiplier_bps = NIGHT_BPS if (hour < 6 or hour >= 22) else (WEEKEND_BPS if checkin Sat/Sun else DAY_BPS)
      tod_surcharge = round_half_up(base * (tod_multiplier_bps - 10000) / 10000)
      package_deduction = base if (Package used at completion) else 0
      gross_fee_cents = max(0, base + distance_surcharge + tod_surcharge - package_deduction)
      tax_cents = round_half_up(gross_fee_cents * TAX_BPS / 10000)
      total_charge = gross_fee_cents + tax_cents
      # Revenue split AFTER tax
      nurse_revenue_share_cents = round_half_up(gross_fee_cents * Nurse.revenue_share_bps / 10000)
      platform_share_cents = gross_fee_cents - nurse_revenue_share_cents
      # Tax goes entirely to platform reserve (not split)
    input_set: "Accepted Dispatch (status=ACCEPTED), ServiceRecord (status=COMPLETED), Package (consumed_or_not), Nurse.revenue_share_bps"
    constants:
      DIST_FREE_KM: 5
      DIST_PRICE_PER_KM_CENTS: 200
      DAY_BPS: 10000
      NIGHT_BPS: 13000
      WEEKEND_BPS: 11500
      TAX_BPS: 600
    precision: "integer cents, round_half_up per component THEN sum"
    variants:
      - name: final_settlement
        when: "at order completion"
        difference: "Uses ACTUAL distance from accepted Dispatch and ACTUAL checkin time-of-day; package consumption confirmed; numbers may differ from estimated_fee when nurse far from default or check-in crosses time band"

  - name: refund_calc
    trigger: "POST /orders/{id}/refund"
    algorithm: tiered_pricing
    formula: |
      hours_since_complete = (now() - ServiceRecord.completed_at) / 3600
      if hours_since_complete > REFUND_WINDOW_HOURS: reject ERR_REFUND_WINDOW_EXPIRED
      # tiered: full refund within 1h, 50% within 6h, 20% within 24h
      if hours_since_complete <= 1: refund_cents = Settlement.gross_fee_cents + Settlement.tax_cents
      elif hours_since_complete <= 6: refund_cents = round_half_up((Settlement.gross_fee_cents + Settlement.tax_cents) * 0.5)
      elif hours_since_complete <= 24: refund_cents = round_half_up((Settlement.gross_fee_cents + Settlement.tax_cents) * 0.2)
      # Tier boundary: <= is inclusive on the LOWER tier, so exactly 1.0h = full, 1.0001h = 50%
    input_set: "Settlement (status in {FINALIZED, PAID_OUT}), ServiceRecord (status=COMPLETED)"
    constants:
      REFUND_WINDOW_HOURS: 24
    precision: "integer cents, round_half_up"
    variants:
      - name: standard_refund
        when: "patient initiated refund within window"
        difference: "Uses tiered percentages keyed off elapsed-hour buckets"

  - name: nurse_dispatch_score
    trigger: "Order.SUBMITTED→AWAITING_DISPATCH or Order.UNDER_REVIEW→AWAITING_DISPATCH or Order.DISPATCHED→AWAITING_DISPATCH"
    algorithm: weighted_scoring
    formula: |
      # Eligibility filter (candidate set):
      # Nurse must be CERTIFIED or EXPIRING; required ServiceItem.required_skill in Nurse.specialty_tags
      # Nurse not in any prior REJECTED/EXPIRED dispatch for this same Order
      # distance_km <= MAX_DISPATCH_RADIUS_KM (15)
      # current daily workload (count of Order.status in {DISPATCHED, IN_PROGRESS} for this nurse on local calendar day) < Nurse.max_daily_orders
      # Patient.preferred_gender == ANY OR Nurse.gender == Patient.preferred_gender
      # Patient.preferred_language == 'any' OR Patient.preferred_language IN Nurse.languages
      #
      # Ranking (lower score wins):
      # score = W_DIST * (distance_km / MAX_DISPATCH_RADIUS_KM)
      #       + W_LOAD * (current_load / max_daily_orders)
      #       + W_RATING * (5.0 - Nurse.rating)
      # Tie-break (when scores tie to 4 decimals): smaller distance_km wins; if still tied, lexicographic Nurse.id ascending.
      # Empty pool fallback: Order.status → CANCELLED with reason ERR_NO_AVAILABLE_NURSE.
    input_set: "Nurses with certification_status in {CERTIFIED, EXPIRING} AND not previously rejected/expired this order"
    constants:
      MAX_DISPATCH_RADIUS_KM: 15
      W_DIST: 0.5
      W_LOAD: 0.3
      W_RATING: 0.2
    precision: "score to 4 decimals; round_half_up"
    variants:
      - name: weighted_pick
        when: "selecting candidate nurse"
        difference: "Composite weighted score with explicit tie-break"

  - name: nurse_rating_aggregate
    trigger: "Complaint.MEDIATION→RESOLVED with rating_impact != 0; new patient rating submission"
    algorithm: aggregation
    formula: |
      # Latest 50 ratings: source = (a) implicit 5.0 per COMPLETED order with no UPHELD nurse-related complaint;
      # (b) (5.0 + rating_impact) per COMPLETED order with a RESOLVED nurse-related complaint where rating_impact != 0.
      # Sort by ServiceRecord.completed_at DESC, take top 50, mean to two decimals (round_half_up).
      # Tie-break on identical timestamps: Order.id lexicographic descending.
      # If fewer than 1 rating: rating remains 5.00 (initialization).
      Nurse.rating = round_half_up(mean(latest_50_ratings), 2) clamped to [1.00, 5.00]
    input_set: "Orders (status=COMPLETED) for this Nurse, joined with Complaints (stage=RESOLVED, routing=NURSE_RELATED)"
    constants:
      RATING_WINDOW_SIZE: 50
      RATING_FLOOR: 1.00
      RATING_CEIL: 5.00
    precision: "two decimals, round_half_up"

  - name: payout_aggregate
    trigger: "POST /payout-batches (build a payout batch up to cutoff_at)"
    algorithm: aggregation
    formula: |
      # Source: Settlement rows with status=FINALIZED AND created_at <= cutoff_at AND payout_batch_id IS NULL
      # NOT included: Settlements with status REVERSED, PENDING, or already paid out
      total_settlements = count(...)
      total_nurse_share_cents = sum(Settlement.nurse_revenue_share_cents)
      total_platform_share_cents = sum(Settlement.platform_share_cents)
      For each included Settlement: set payout_batch_id, then status → PAID_OUT (atomic)
      Tie-break on Settlement.created_at = cutoff_at: include (inclusive upper bound)
    input_set: "Settlement.status=FINALIZED AND payout_batch_id IS NULL AND created_at <= cutoff_at"
    constants: {}
    precision: "integer cents"

# =============================================================================
# §1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role must be permitted for this operation per §1.7 RBAC"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resource ids must exist; validated left-to-right (orderId → dispatchId, etc.)"
    error_id: "ERR_NURSE_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_SERVICE_ITEM_NOT_FOUND | ERR_DISPATCH_NOT_FOUND | ERR_WASTE_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND | ERR_PACKAGE_NOT_FOUND"
    http_status: 404
    applies_to: all path-bearing endpoints

  - priority: 4
    category: state
    check: "Subject entity must be in correct state for this transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all action endpoints

  - priority: 5
    category: business_referential
    check: "Cross-entity link must be valid: ServiceItem.active==true, Package.patient_id==Order.patient_id, Dispatch.nurse_id==X-User-ID for accept/reject"
    error_id: ERR_RESOURCE_LINK_INVALID
    http_status: 422
    applies_to: "POST /orders, POST /dispatches/{id}/accept, POST /dispatches/{id}/reject"

  - priority: 6
    category: business_safety
    check: "ServiceItem.requires_medical_doc==true demands non-empty Order.medical_doc_url"
    error_id: ERR_MEDICAL_DOC_REQUIRED
    http_status: 422
    applies_to: "POST /orders"

  - priority: 7
    category: business_safety
    check: "Nurse must satisfy required_skill, certification_status in {CERTIFIED, EXPIRING}, and not be DISQUALIFIED"
    error_id: ERR_NURSE_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /dispatches/{id}/accept, internal selector"

  - priority: 8
    category: business_constraint
    check: "On Dispatch.accept: Order.status must be AWAITING_DISPATCH AND no other Dispatch is ACCEPTED for this order"
    error_id: ERR_DISPATCH_ALREADY_TAKEN
    http_status: 409
    applies_to: "POST /dispatches/{id}/accept"

  - priority: 9
    category: business_temporal
    check: "Dispatch.accept and Dispatch.reject must occur strictly before Dispatch.accept_deadline"
    error_id: ERR_DISPATCH_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /dispatches/{id}/accept, POST /dispatches/{id}/reject"

  - priority: 10
    category: business_safety
    check: "ServiceRecord check-in: GPS within MAX_CHECKIN_RADIUS_KM (0.5) of Order.service_address coords"
    error_id: ERR_CHECKIN_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /orders/{id}/service-record"

  - priority: 11
    category: business_safety
    check: "ServiceRecord check-in: face_verification_passed==true"
    error_id: ERR_FACE_VERIFICATION_FAILED
    http_status: 422
    applies_to: "POST /orders/{id}/service-record"

  - priority: 12
    category: business_constraint
    check: "ServiceRecord finish: every checklist_items[].done==true and len(evidence_urls) >= 1"
    error_id: ERR_CHECKLIST_INCOMPLETE
    http_status: 422
    applies_to: "POST /orders/{id}/service-record/finish"

  - priority: 13
    category: business_safety
    check: "Order.confirm-completion blocked when any WasteEntry for the order is not ARCHIVED (only when ServiceItem produces waste)"
    error_id: ERR_WASTE_NOT_ARCHIVED
    http_status: 409
    applies_to: "POST /orders/{id}/confirm-completion"

  - priority: 14
    category: business_temporal
    check: "Refund must be requested within REFUND_WINDOW_HOURS (24) after ServiceRecord.completed_at"
    error_id: ERR_REFUND_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /orders/{id}/refund"

  - priority: 15
    category: business_fiscal
    check: "Complaint.resolve compensation_cents must not exceed Settlement.gross_fee_cents"
    error_id: ERR_COMPENSATION_EXCEEDS_FEE
    http_status: 422
    applies_to: "POST /complaints/{id}/resolve"

  - priority: 16
    category: business_constraint
    check: "Idempotency-Key (header) on POST /orders must not collide with prior key (within Patient scope)"
    error_id: ERR_IDEMPOTENCY_KEY_REUSED
    http_status: 409
    applies_to: "POST /orders"

  - priority: 17
    category: business_constraint
    check: "POST /orders rejected when no PayoutBatch is currently BUILDING is irrelevant; but POST /payout-batches rejected if a BUILDING batch already exists"
    error_id: ERR_PAYOUT_BATCH_ALREADY_BUILDING
    http_status: 409
    applies_to: "POST /payout-batches"

  - priority: 18
    category: business_constraint
    check: "OCC: PUT/PATCH/POST-action endpoints accept optional version; mismatched version → conflict"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "All non-idempotent mutations"

# =============================================================================
# §1.5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Nurses & Certification ----
  - method: POST
    path: "/nurses"
    description: "Register a nurse profile (initial state PENDING)"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, gender, languages, license_number, specialty_tags, home_lat, home_lng, "max_daily_orders?", "revenue_share_bps?"]
    output: Nurse
    side_effects: ["Async identity-verification kicked off; license_verified=false until /_events/emit returns"]

  - method: GET
    path: "/nurses"
    description: "List nurses (filter by certification_status, specialty)"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "certification_status?", "specialty?"]
    output: "Nurse[]"
    side_effects: []

  - method: GET
    path: "/nurses/{nurseId}"
    description: "Get nurse by id"
    roles: [PlatformAdmin, ComplianceOfficer, Nurse]
    code: 200
    input: []
    output: Nurse
    side_effects: ["Nurse can only fetch self"]

  - method: POST
    path: "/nurses/{nurseId}/certification-records"
    description: "Append a certification or training record (drives Nurse.certification_status)"
    roles: [ComplianceOfficer]
    code: 201
    input: [kind, "training_hours?", outcome, effective_at, "notes?"]
    output: CertificationRecord
    side_effects: ["May transition Nurse.certification_status; sets Nurse.certified_until on PASS"]

  - method: GET
    path: "/nurses/{nurseId}/certification-records"
    description: "List certification records for a nurse"
    roles: [PlatformAdmin, ComplianceOfficer, Nurse]
    code: 200
    input: ["limit?", "offset?"]
    output: "CertificationRecord[]"
    side_effects: []

  # ---- Service Items ----
  - method: POST
    path: "/service-items"
    description: "Create a catalog item"
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, description, contraindications, required_skill, "requires_medical_doc?", "requires_eligibility_review?", base_price_cents, duration_minutes]
    output: ServiceItem
    side_effects: []

  - method: GET
    path: "/service-items"
    description: "List active catalog items"
    roles: [PlatformAdmin, ComplianceOfficer, Patient]
    code: 200
    input: ["limit?", "offset?", "active?"]
    output: "ServiceItem[]"
    side_effects: []

  - method: GET
    path: "/service-items/{code}"
    description: "Get one catalog item"
    roles: [PlatformAdmin, ComplianceOfficer, Patient]
    code: 200
    input: []
    output: ServiceItem
    side_effects: []

  # ---- Orders ----
  - method: POST
    path: "/orders"
    description: "Create an order; auto-routes to UNDER_REVIEW or AWAITING_DISPATCH and may trigger Dispatch creation"
    roles: [Patient]
    code: 201
    input: [service_item_code, service_address, service_lat, service_lng, scheduled_start, "preferred_gender?", "preferred_language?", "medical_doc_url?", "package_id?"]
    output: Order
    side_effects:
      - "Compute estimated_fee_cents (forward_looking)"
      - "Authorize payment → payment_status=AUTHORIZED"
      - "Create one Dispatch row when AWAITING_DISPATCH (selector_policy)"
      - "Honors Idempotency-Key header"

  - method: GET
    path: "/orders"
    description: "List orders (Patient sees own; PlatformAdmin/ComplianceOfficer see all; Nurse sees ones assigned)"
    roles: [Patient, PlatformAdmin, ComplianceOfficer, Nurse]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Order[]"
    side_effects: []

  - method: GET
    path: "/orders/{orderId}"
    description: "Get order by id"
    roles: [Patient, PlatformAdmin, ComplianceOfficer, Nurse]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: POST
    path: "/orders/{orderId}/eligibility-review"
    description: "Compliance officer approves/rejects items needing review"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "notes?"]
    output: Order
    side_effects: ["On APPROVE: trigger Dispatch creation. On REJECT: refund authorized payment"]

  - method: POST
    path: "/orders/{orderId}/cancel"
    description: "Patient cancels prior to acceptance"
    roles: [Patient]
    code: 200
    input: ["cancelled_reason?"]
    output: Order
    side_effects: ["Cancels OFFERED Dispatches; refunds authorized payment"]

  - method: POST
    path: "/orders/{orderId}/confirm-completion"
    description: "Patient confirms service done; capture payment + create Settlement"
    roles: [Patient]
    code: 200
    input: []
    output: Order
    side_effects:
      - "Compute final_settlement (chronological)"
      - "Create Settlement (FINALIZED)"
      - "payment_status → CAPTURED"
      - "Package.used_credits += 1 (when used)"

  - method: POST
    path: "/orders/{orderId}/refund"
    description: "Refund a completed order per refund_calc"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Settlement
    side_effects: ["Settlement.refund_cents recomputed; Settlement.status → REVERSED; payment_status → REFUNDED"]

  # ---- Dispatch ----
  - method: GET
    path: "/orders/{orderId}/dispatches"
    description: "List dispatch attempts on an order"
    roles: [Patient, PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Dispatch[]"
    side_effects: []

  - method: GET
    path: "/dispatches/{dispatchId}"
    description: "Get a dispatch row"
    roles: [PlatformAdmin, ComplianceOfficer, Nurse]
    code: 200
    input: []
    output: Dispatch
    side_effects: ["Nurse can only fetch dispatches whose nurse_id == X-User-ID"]

  - method: POST
    path: "/dispatches/{dispatchId}/accept"
    description: "Nurse accepts an offered dispatch"
    roles: [Nurse]
    code: 200
    input: []
    output: Dispatch
    side_effects: ["Order.status → DISPATCHED; sibling OFFERED dispatches → CANCELLED"]

  - method: POST
    path: "/dispatches/{dispatchId}/reject"
    description: "Nurse rejects an offered dispatch"
    roles: [Nurse]
    code: 200
    input: ["rejection_reason?"]
    output: Dispatch
    side_effects: ["Trigger order re-dispatch (selector excludes this nurse)"]

  # ---- Service Record ----
  - method: POST
    path: "/orders/{orderId}/service-record"
    description: "Nurse on-site check-in; create ServiceRecord"
    roles: [Nurse]
    code: 201
    input: [checkin_at, checkin_lat, checkin_lng, face_verification_passed, "checklist_items?", "vitals?", "medications_administered?", "evidence_urls?", "abnormal_events?"]
    output: ServiceRecord
    side_effects: ["Order.status DISPATCHED → IN_PROGRESS; AuditLog entry"]

  - method: PATCH
    path: "/orders/{orderId}/service-record"
    description: "Append checklist/vitals/medications/evidence/abnormal events"
    roles: [Nurse]
    code: 200
    input: ["checklist_items?", "vitals?", "medications_administered?", "evidence_urls?", "abnormal_events?"]
    output: ServiceRecord
    side_effects: []

  - method: POST
    path: "/orders/{orderId}/service-record/finish"
    description: "Nurse declares service procedure done, requests patient confirmation"
    roles: [Nurse]
    code: 200
    input: []
    output: ServiceRecord
    side_effects: ["Set ServiceRecord.completed_at; transition to AWAITING_PATIENT_CONFIRM"]

  # ---- Waste Entries ----
  - method: POST
    path: "/orders/{orderId}/waste-entries"
    description: "Register a medical waste item"
    roles: [Nurse]
    code: 201
    input: [category, quantity, unit, "sealed?", "disposal_unit_id?", "handover_at?"]
    output: WasteEntry
    side_effects: []

  - method: PATCH
    path: "/orders/{orderId}/waste-entries/{wasteId}"
    description: "Update sealing/handover info"
    roles: [Nurse]
    code: 200
    input: ["sealed?", "disposal_unit_id?", "handover_at?"]
    output: WasteEntry
    side_effects: ["May transition REGISTERED → HANDED_OVER"]

  - method: GET
    path: "/orders/{orderId}/waste-entries"
    description: "List waste entries for an order"
    roles: [Nurse, PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "WasteEntry[]"
    side_effects: []

  # ---- Packages ----
  - method: POST
    path: "/packages"
    description: "Create a prepaid service package for a patient"
    roles: [PlatformAdmin]
    code: 201
    input: [patient_id, service_item_code, total_credits, expires_at]
    output: Package
    side_effects: []

  - method: GET
    path: "/packages"
    description: "List packages (Patient sees own)"
    roles: [Patient, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Package[]"
    side_effects: []

  # ---- Settlements & Payouts ----
  - method: GET
    path: "/orders/{orderId}/settlement"
    description: "Get the settlement for an order"
    roles: [Patient, PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: POST
    path: "/payout-batches"
    description: "Build a periodic payout batch (admin)"
    roles: [PlatformAdmin]
    code: 201
    input: [cutoff_at]
    output: PayoutBatch
    side_effects: ["Aggregates eligible Settlements; status moves FINALIZED → PAID_OUT atomically; PayoutBatch.status=PAID"]

  - method: GET
    path: "/payout-batches"
    description: "List payout batches"
    roles: [PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "PayoutBatch[]"
    side_effects: []

  # ---- Complaints ----
  - method: POST
    path: "/complaints"
    description: "Patient submits a complaint about a completed order"
    roles: [Patient]
    code: 201
    input: [order_id, category, description]
    output: Complaint
    side_effects: ["Append AuditLog(COMPLAINT, SUBMIT)"]

  - method: GET
    path: "/complaints"
    description: "List complaints (Patient sees own; ComplianceOfficer/PlatformAdmin see all)"
    roles: [Patient, PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "stage?"]
    output: "Complaint[]"
    side_effects: []

  - method: POST
    path: "/complaints/{complaintId}/triage"
    description: "Compliance triages a submitted complaint (assigns routing)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Complaint
    side_effects: ["Sets routing"]

  - method: POST
    path: "/complaints/{complaintId}/escalate-mediation"
    description: "Escalate triage to mediation"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: POST
    path: "/complaints/{complaintId}/resolve"
    description: "Resolve or reject a complaint at TRIAGE or MEDIATION"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "compensation_cents?", "rating_impact?", "resolution_notes?"]
    output: Complaint
    side_effects: ["Apply rating_impact; refund/compensate; AuditLog(COMPLAINT, RESOLVE|REJECT)"]

  # ---- Audit & Test Hooks ----
  - method: GET
    path: "/audit-logs"
    description: "List audit log entries (admin/compliance only)"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "subject_type?", "subject_id?"]
    output: "AuditLog[]"
    side_effects: []

  - method: POST
    path: "/_clock/advance"
    description: "Test hook: advance the simulated clock (drives EXPIRED dispatches, EXPIRING/PENDING certifications)"
    roles: [PlatformAdmin]
    code: 200
    input: [to]
    output: null
    side_effects:
      - "OFFERED Dispatch with accept_deadline <= new now → EXPIRED, with re-dispatch chain"
      - "Nurse with certified_until <= new now → certification_status=PENDING (and OFFERED dispatches CANCELLED)"
      - "Nurse with (certified_until - 30d) <= new now < certified_until → certification_status=EXPIRING"

  - method: POST
    path: "/_events/emit"
    description: "Test hook: emit external system events (payment-system / identity-verification / medical-waste-disposal / IM)"
    roles: [PlatformAdmin]
    code: 200
    input: [system, event_type, payload]
    output: null
    side_effects:
      - "system=identity-verification → set Nurse.license_verified or Nurse.hospital_affiliation_verified"
      - "system=medical-waste-disposal + event_type=CERTIFICATE_ISSUED → WasteEntry.HANDED_OVER → ARCHIVED with certificate_url"
      - "system=payment + event_type=AUTHORIZED|CAPTURED|REFUNDED → mirrors payment_status"
      - "system=im + event_type=ORDER_COMPLETED → no state change (audit only)"

# =============================================================================
# §1.6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID/X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }

  # --- Request ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "General request format error (missing required field, type mismatch, bad enum)" }
  - { id: ERR_IDEMPOTENCY_KEY_REUSED, http: 409, condition: "Same Idempotency-Key submitted with a different payload, or duplicate within Patient scope" }
  - { id: ERR_VERSION_CONFLICT, http: 409, condition: "OCC version mismatch on PUT/PATCH/action" }

  # --- Not Found ---
  - { id: ERR_NURSE_NOT_FOUND, http: 404, condition: "Nurse id does not resolve" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Order id does not resolve" }
  - { id: ERR_SERVICE_ITEM_NOT_FOUND, http: 404, condition: "ServiceItem code does not resolve or is inactive" }
  - { id: ERR_DISPATCH_NOT_FOUND, http: 404, condition: "Dispatch id does not resolve" }
  - { id: ERR_WASTE_NOT_FOUND, http: 404, condition: "WasteEntry id does not resolve" }
  - { id: ERR_COMPLAINT_NOT_FOUND, http: 404, condition: "Complaint id does not resolve" }
  - { id: ERR_PACKAGE_NOT_FOUND, http: 404, condition: "Package id does not resolve" }

  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Subject not in correct state for this transition" }
  - { id: ERR_DISPATCH_ALREADY_TAKEN, http: 409, condition: "Another Dispatch on this Order is already ACCEPTED" }
  - { id: ERR_DISPATCH_WINDOW_EXPIRED, http: 409, condition: "Dispatch.accept_deadline already passed" }
  - { id: ERR_WASTE_NOT_ARCHIVED, http: 409, condition: "Some WasteEntry on this order is not ARCHIVED yet" }
  - { id: ERR_PAYOUT_BATCH_ALREADY_BUILDING, http: 409, condition: "A PayoutBatch with status=BUILDING already exists" }

  # --- Referential / Resource ---
  - { id: ERR_RESOURCE_LINK_INVALID, http: 422, condition: "Cross-entity link rejected (inactive ServiceItem, foreign Package, mismatched Dispatch nurse)" }

  # --- Safety / Business ---
  - { id: ERR_MEDICAL_DOC_REQUIRED, http: 422, condition: "ServiceItem requires medical doc but Order.medical_doc_url is empty" }
  - { id: ERR_NURSE_NOT_CERTIFIED, http: 422, condition: "Nurse not in {CERTIFIED, EXPIRING} or lacks required_skill or DISQUALIFIED" }
  - { id: ERR_CHECKIN_OUT_OF_RANGE, http: 422, condition: "GPS check-in beyond MAX_CHECKIN_RADIUS_KM (0.5)" }
  - { id: ERR_FACE_VERIFICATION_FAILED, http: 422, condition: "face_verification_passed != true on check-in" }
  - { id: ERR_CHECKLIST_INCOMPLETE, http: 422, condition: "Not all checklist items done or no evidence on /finish" }

  # --- Selector / Dispatch ---
  - { id: ERR_NO_AVAILABLE_NURSE, http: 422, condition: "Selector candidate set empty after filters and exclusions" }

  # --- Fiscal / Refund ---
  - { id: ERR_REFUND_WINDOW_EXPIRED, http: 422, condition: "Refund requested after REFUND_WINDOW_HOURS (24)" }
  - { id: ERR_COMPENSATION_EXCEEDS_FEE, http: 422, condition: "Complaint compensation_cents exceeds Settlement.gross_fee_cents" }
  - { id: ERR_INSUFFICIENT_PACKAGE_CREDIT, http: 422, condition: "Package referenced has used_credits >= total_credits or status != ACTIVE" }

# =============================================================================
# §1.7: RBAC Matrix
# =============================================================================
roles:
  - name: Patient
    description: "End user requesting nursing service"
    identity: "opaque"
    exclusive_operations:
      - "POST /orders — submit service request"
      - "POST /orders/{id}/cancel — cancel before nurse acceptance"
      - "POST /orders/{id}/confirm-completion — confirm service done"
      - "POST /complaints — submit a complaint"
    shared_operations:
      - "GET /orders, /orders/{id}, /orders/{id}/dispatches, /orders/{id}/settlement (own only)"
      - "GET /service-items, /service-items/{code}"
      - "GET /packages (own only)"
      - "GET /complaints (own only)"

  - name: Nurse
    description: "Certified nursing professional taking dispatched orders"
    identity: "entity_backed:Nurse"
    exclusive_operations:
      - "POST /dispatches/{id}/accept"
      - "POST /dispatches/{id}/reject"
      - "POST /orders/{id}/service-record — on-site check-in"
      - "PATCH /orders/{id}/service-record — append data"
      - "POST /orders/{id}/service-record/finish"
      - "POST /orders/{id}/waste-entries"
      - "PATCH /orders/{id}/waste-entries/{wasteId}"
    shared_operations:
      - "GET /nurses/{id} (self only)"
      - "GET /nurses/{id}/certification-records (self only)"
      - "GET /orders, /orders/{id} (only orders dispatched/assigned)"
      - "GET /dispatches/{id} (own only)"
      - "GET /orders/{id}/waste-entries (own assigned)"

  - name: ComplianceOfficer
    description: "Reviews eligibility, certifications, refunds, and complaints"
    identity: "opaque"
    exclusive_operations:
      - "POST /nurses/{id}/certification-records"
      - "POST /orders/{id}/eligibility-review"
      - "POST /orders/{id}/refund"
      - "POST /complaints/{id}/triage"
      - "POST /complaints/{id}/escalate-mediation"
      - "POST /complaints/{id}/resolve"
    shared_operations:
      - "GET /nurses, /nurses/{id}, /nurses/{id}/certification-records"
      - "GET /orders, /orders/{id}, /orders/{id}/settlement, /orders/{id}/waste-entries"
      - "GET /complaints, /complaints/{id}"
      - "GET /audit-logs"

  - name: PlatformAdmin
    description: "Operational super-user; manages catalog, packages, payouts, and test hooks"
    identity: "opaque"
    exclusive_operations:
      - "POST /nurses — register a nurse profile"
      - "POST /service-items — create catalog item"
      - "POST /packages — create patient package"
      - "POST /payout-batches — build payout batch"
      - "POST /_clock/advance — test clock"
      - "POST /_events/emit — emit external event"
    shared_operations:
      - "GET /nurses, /nurses/{id}"
      - "GET /service-items, /service-items/{code}"
      - "GET /orders, /orders/{id}, /orders/{id}/dispatches, /orders/{id}/settlement, /orders/{id}/waste-entries"
      - "GET /payout-batches"
      - "GET /complaints"
      - "GET /audit-logs"
