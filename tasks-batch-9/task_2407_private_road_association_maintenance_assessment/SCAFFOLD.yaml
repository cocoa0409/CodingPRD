scenario: "2407. Private Road Association Maintenance & Assessment (rural private road association): membership roll tied to parcel deeds and road-maintenance covenants, annual assessment formula by frontage, usage class or trip generation, special assessment for grading, culvert or paving projects with vote thresholds, delinquency remedies including lien filing and access restriction limits, contractor bid solicitation for grading, snow and dust control, easement disputes and new-lot connection fees, reserve accounting for bridge and culvert replacement, emergency-vehicle access standard compliance"
domain_name: private-road-association-maintenance-assessment
api_prefix: ""   # flat topology: every collection is a top-level path (/parcels, /members, /assessment-rolls, ...)

complexity_profile:
  difficulty_level: expert_plus          # above the §0.4 Expert band: 12 entities, 53 endpoints, 6 state machines, 11 calculations
  primary_archetype: multi_party_negotiation
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity is a top-level collection linked by explicit foreign keys; no nesting in URL paths.
  # Parcel.parent_parcel_id makes the parcel table self-referential (subdivision of a deeded lot).

  state_machine_shape: cyclic
  # AssessmentRoll: DRAFT -> CERTIFIED -> DRAFT (recall) -> CERTIFIED -> LEVIED
  # MaintenanceProject: BID_SOLICITATION -> AWARDED -> BID_SOLICITATION (awarded bid withdrawn) -> AWARDED
  # SpecialAssessmentProposal: DRAFT -> BALLOTING -> DRAFT (quorum failure) with failed_tally_count termination
  # ConnectionRequest: SUBMITTED -> DISPUTED -> SUBMITTED (easement resolved)
  # Member: two independent dimensions (standing_status x access_status) on one row
  # DelinquencyAction: branching (INITIATED -> EFFECTIVE | INITIATED -> VOIDED) with divergent side-effect sets

  relationship_patterns:
    - one_to_many          # Association -> RoadSegment -> Parcel -> Member; AssessmentRoll -> AssessmentCharge
    - many_to_many         # Ballot is the junction of Member x SpecialAssessmentProposal
    - self_referential     # Parcel.parent_parcel_id (subdivided lots)
    - cross_aggregate      # AssessmentCharge.proposal_id, MaintenanceProject.proposal_id, MaintenanceProject.awarded_bid_id

  role_model: segregation_of_duties
  # The AssessmentClerk who certifies a roll may not levy it (BoardTreasurer levies).
  # The BoardTreasurer user who initiates a DelinquencyAction may not effectuate it (X-User-ID must differ).
  # The RoadCommissioner user who creates a MaintenanceProject may not award it (X-User-ID must differ).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Association
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the private road association
      - name: reserve_target_cents
        type: integer
        source: input
        description: fully funded reserve target for bridge and culvert replacement, in cents
        constraints: ">= 1"
      - name: default_voting_basis
        type: enum
        source: input
        description: voting basis inherited by new SpecialAssessmentProposal rows when the request omits voting_basis
        default: PER_PARCEL
        constraints: "one of {PER_PARCEL, ASSESSED_SHARE}"
      - name: delinquency_interest_basis
        type: enum
        source: input
        description: selects which variant of calculations.lien_payoff_amount applies to this association
        default: STATUTORY
        constraints: "one of {STATUTORY, ASSOCIATION_POLICY}"
      - name: quorum_bps
        type: integer
        source: input
        description: participation quorum in basis points of eligible_weight_total required for a tally to be decisive
        default: 5000
        constraints: "1..10000"
      - name: reserve_balance_cents
        type: integer
        source: computed
        description: "running reserve fund balance; recomputed by calculations.reserve_balance_reconciliation on every levy, connection approval, project award, project cancel and bid withdrawal"
        default: 0
      - name: reserve_funding_ratio
        type: number
        source: computed
        description: reserve_balance_cents / reserve_target_cents, rounded to 4 decimals for display only; posture comparisons use integer arithmetic
        default: 0
      - name: reserve_posture
        type: enum
        source: computed
        description: "derived funding posture gating BRIDGE and CULVERT awards; recomputed whenever reserve_balance_cents changes"
        default: UNDERFUNDED
        constraints: "one of {UNDERFUNDED, ADEQUATE, FULLY_FUNDED}"

  - name: RoadSegment
    parent: null
    common_fields: true
    fields:
      - name: association_id
        type: string
        source: input
        description: "FK -> Association.id; the association that maintains this segment"
      - name: name
        type: string
        source: input
        description: segment label as recorded in the maintenance covenant
      - name: length_feet
        type: number
        source: input
        description: centerline length of the segment in feet
        constraints: "> 0"
      - name: width_feet
        type: number
        source: input
        description: travelway width in feet, as built
        constraints: "> 0"
      - name: max_grade_pct
        type: number
        source: input
        description: steepest sustained grade on the segment, in percent
        constraints: ">= 0"
      - name: surface_type
        type: enum
        source: input
        description: running surface
        constraints: "one of {GRAVEL, CHIP_SEAL, PAVED}"
      - name: turnout_count
        type: integer
        source: input
        description: number of emergency-vehicle passing turnouts on the segment
        constraints: ">= 0"
      - name: turnaround_present
        type: boolean
        source: input
        description: whether a compliant apparatus turnaround exists at the terminus
      - name: bridge_present
        type: boolean
        source: input
        description: whether the segment carries a bridge subject to reserve replacement accounting
      - name: bridge_load_rating_tons
        type: number
        source: input
        description: posted bridge load rating in tons; null when bridge_present is false
        default: null
      - name: culvert_count
        type: integer
        source: input
        description: number of cross culverts on the segment subject to reserve replacement accounting
        constraints: ">= 0"
      - name: required_turnouts
        type: integer
        source: computed
        description: "max(0, ceil(length_feet / 800) - 1); see calculations.emergency_access_grade_evaluation"
      - name: emergency_access_grade
        type: enum
        source: computed
        description: "emergency-vehicle access standard compliance grade; UNKNOWN until the first access inspection, then COMPLIANT or DEFICIENT"
        default: UNKNOWN
        constraints: "one of {UNKNOWN, COMPLIANT, DEFICIENT}"
      - name: last_inspection_at
        type: datetime
        source: system
        description: inspected_at of the most recent access inspection; null before the first inspection
        default: null

  - name: Parcel
    parent: null
    common_fields: true
    fields:
      - name: road_segment_id
        type: string
        source: input
        description: "FK -> RoadSegment.id; the segment this parcel takes access from"
      - name: parent_parcel_id
        type: string
        source: system
        description: "FK -> Parcel.id; set only on lots created by a subdivision, null for originally deeded parcels"
        default: null
      - name: deed_book_page
        type: string
        source: input
        description: recorded deed book and page carrying the road-maintenance covenant
      - name: frontage_feet
        type: number
        source: input
        description: deeded road frontage in feet, the base of the frontage-weighted assessment
        constraints: "> 0"
      - name: usage_class
        type: enum
        source: input
        description: usage class selecting the frontage multiplier
        constraints: "one of {RESIDENTIAL_YEAR_ROUND, SEASONAL, AGRICULTURAL, COMMERCIAL, UNDEVELOPED}"
      - name: trips_per_day
        type: number
        source: input
        description: average daily trip generation attributed to the parcel
        constraints: ">= 0"
      - name: covenant_recorded
        type: boolean
        source: input
        description: whether the road-maintenance covenant is recorded against this parcel; assessable parcels require true
      - name: status
        type: enum
        source: computed
        description: "lifecycle; ACTIVE on creation, PENDING_CONNECTION for subdivision children, SUBDIVIDED once split, WITHDRAWN when a connection request is denied"
        default: ACTIVE
        constraints: "one of {ACTIVE, PENDING_CONNECTION, SUBDIVIDED, WITHDRAWN}"
      - name: frontage_share_units
        type: number
        source: computed
        description: "frontage_feet * usage_class multiplier; the FRONTAGE_WEIGHTED share unit, recomputed on every field change"
      - name: trip_share_units
        type: number
        source: computed
        description: "trips_per_day * 25 + frontage_feet * 0.20; the TRIP_GENERATION_WEIGHTED share unit"

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: "FK -> Parcel.id; the deeded parcel that carries this membership"
      - name: owner_name
        type: string
        source: input
        description: name of record of the deed holder
      - name: deed_book_page
        type: string
        source: input
        description: deed book and page asserted by the owner; must match the parcel's recorded deed to verify
      - name: deed_recorded_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) the deed was recorded
      - name: standing_status
        type: enum
        source: computed
        description: "fiscal standing dimension, independent of access_status; recomputed by calculations.member_standing_reconciliation"
        default: PENDING_DEED_VERIFICATION
        constraints: "one of {PENDING_DEED_VERIFICATION, GOOD_STANDING, DELINQUENT, LIEN_FILED}"
      - name: access_status
        type: enum
        source: computed
        description: "access dimension, independent of standing_status; recomputed by calculations.member_access_reconciliation"
        default: UNRESTRICTED
        constraints: "one of {UNRESTRICTED, WARNED, RESTRICTED}"
      - name: deed_verified_at
        type: datetime
        source: system
        description: logical-clock instant at which the deed was verified; null while PENDING_DEED_VERIFICATION
        default: null
      - name: encumbered_principal_cents
        type: integer
        source: computed
        description: "sum of DelinquencyAction.lien_amount_cents for this member with status == EFFECTIVE; conserved quantity for the lien compensating invariant"
        default: 0
      - name: restricted_days_used
        type: integer
        source: computed
        description: "sum of DelinquencyAction.restriction_days for this member with action_type == ACCESS_RESTRICTION and status IN {EFFECTIVE, RELEASED}, counted inside the fiscal year of the underlying charge's roll"
        default: 0

  - name: AssessmentRoll
    parent: null
    common_fields: true
    fields:
      - name: association_id
        type: string
        source: input
        description: "FK -> Association.id; the association levying this roll"
      - name: fiscal_year
        type: integer
        source: input
        description: fiscal year label of the roll
        constraints: "2020..2100"
      - name: fy_start_date
        type: string
        source: input
        description: ISO 8601 date, inclusive first day of the fiscal year
      - name: fy_end_date
        type: string
        source: input
        description: ISO 8601 date, inclusive last day of the fiscal year
      - name: budget_requirement_cents
        type: integer
        source: input
        description: total maintenance budget to be spread across assessable parcels, in cents
        constraints: ">= 1"
      - name: method_variant
        type: enum
        source: input
        description: selects the variant of calculations.annual_assessment_allocation applied at certification
        constraints: "one of {FRONTAGE_WEIGHTED, TRIP_GENERATION_WEIGHTED}"
      - name: status
        type: enum
        source: computed
        description: roll lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, CERTIFIED, LEVIED}"
      - name: total_share_units
        type: number
        source: computed
        description: sum of the selected share unit over the assessable parcel set at certification; 0 while DRAFT
        default: 0
      - name: total_levied_cents
        type: integer
        source: computed
        description: sum of AssessmentCharge.amount_cents for this roll with charge_type == ANNUAL and status != VOIDED
        default: 0
      - name: unallocated_residual_cents
        type: integer
        source: computed
        description: "budget_requirement_cents - total_levied_cents; may be positive (per-parcel cap absorbed budget) or negative (minimum-charge floor over-collected)"
        default: 0
      - name: reserve_contribution_cents
        type: integer
        source: computed
        description: "round_half_up(budget_requirement_cents * 0.15), credited to Association.reserve_balance_cents at levy; 0 before levy"
        default: 0
      - name: recall_count
        type: integer
        source: computed
        description: number of times this roll has been recalled from CERTIFIED back to DRAFT
        default: 0
      - name: certified_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent certification; null while DRAFT and reset to null on recall
        default: null
      - name: levied_at
        type: datetime
        source: system
        description: logical-clock instant of levy; null until LEVIED
        default: null
      - name: due_date
        type: string
        source: computed
        description: "ISO 8601 date; date(levied_at) + 45 days, stamped onto every ANNUAL charge at levy; null until LEVIED"
        default: null

  - name: AssessmentCharge
    parent: null
    common_fields: true
    fields:
      - name: roll_id
        type: string
        source: system
        description: "FK -> AssessmentRoll.id; the roll that carries this charge (ANNUAL charges and the CONNECTION_FEE charges billed against the latest levied roll)"
      - name: proposal_id
        type: string
        source: system
        description: "FK -> SpecialAssessmentProposal.id; set only on SPECIAL charges created at proposal adoption, null otherwise"
        default: null
      - name: parcel_id
        type: string
        source: system
        description: "FK -> Parcel.id; the assessed parcel"
      - name: member_id
        type: string
        source: system
        description: "FK -> Member.id; the member billed; for CONNECTION_FEE charges this is the member of the parent parcel"
      - name: charge_type
        type: enum
        source: system
        description: origin of the charge
        constraints: "one of {ANNUAL, SPECIAL, CONNECTION_FEE}"
      - name: share_units_snapshot
        type: number
        source: computed
        description: share unit value used for this charge at creation time; frozen so later parcel reclassification cannot retroactively move the charge
      - name: amount_cents
        type: integer
        source: computed
        description: charge principal in cents produced by calculations.annual_assessment_allocation, special_assessment_allocation or connection_fee
      - name: paid_cents
        type: integer
        source: computed
        description: cumulative payments applied to this charge
        default: 0
      - name: balance_cents
        type: integer
        source: computed
        description: amount_cents - paid_cents
      - name: status
        type: enum
        source: computed
        description: collection lifecycle
        default: PENDING
        constraints: "one of {PENDING, OPEN, PAID, DELINQUENT, LIEN_ENCUMBERED, VOIDED}"
      - name: due_date
        type: string
        source: computed
        description: ISO 8601 date this charge becomes collectible-past-due; null while PENDING
        default: null
      - name: delinquent_since
        type: string
        source: computed
        description: ISO 8601 date the first delinquency action was initiated against this charge; null otherwise
        default: null

  - name: SpecialAssessmentProposal
    parent: null
    common_fields: true
    fields:
      - name: road_segment_id
        type: string
        source: input
        description: "FK -> RoadSegment.id; the segment the proposed capital work serves; also scopes the eligible voter set"
      - name: project_type
        type: enum
        source: input
        description: capital work type; selects the base vote threshold
        constraints: "one of {GRADING, CULVERT, PAVING, BRIDGE}"
      - name: title
        type: string
        source: input
        description: short description of the proposed work
      - name: estimated_cost_cents
        type: integer
        source: input
        description: engineer's estimate for the work, in cents
        constraints: ">= 1"
      - name: cost_allocation_method
        type: enum
        source: input
        description: allocation method used by calculations.special_assessment_allocation at adoption
        constraints: "one of {FRONTAGE_WEIGHTED, TRIP_GENERATION_WEIGHTED, EQUAL_SHARE}"
      - name: voting_basis
        type: enum
        source: input
        description: selects the variant of calculations.member_voting_weight for this ballot; defaults to the association's default_voting_basis
        default: null
        constraints: "one of {PER_PARCEL, ASSESSED_SHARE}"
      - name: status
        type: enum
        source: computed
        description: balloting lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, BALLOTING, ADOPTED, REJECTED}"
      - name: required_threshold_bps
        type: integer
        source: computed
        description: "approval threshold in basis points from calculations.vote_threshold_resolution; recomputed on creation and whenever Association.reserve_posture changes while status == DRAFT"
      - name: balloting_closes_at
        type: datetime
        source: input
        description: logical-clock instant after which ballots are refused and a tally may be taken
        default: null
      - name: balloting_opened_at
        type: datetime
        source: system
        description: logical-clock instant balloting opened; null while DRAFT
        default: null
      - name: eligible_weight_total
        type: integer
        source: computed
        description: snapshot of the summed voting weight of the eligible voter set, taken when balloting opens
        default: 0
      - name: counted_weight_total
        type: integer
        source: computed
        description: "sum of Ballot.weight_snapshot for this proposal with status == CAST; conserved quantity for the ballot compensating invariant"
        default: 0
      - name: yes_weight_total
        type: integer
        source: computed
        description: sum of Ballot.weight_snapshot with status == CAST and choice == YES
        default: 0
      - name: no_weight_total
        type: integer
        source: computed
        description: sum of Ballot.weight_snapshot with status == CAST and choice == NO
        default: 0
      - name: abstain_weight_total
        type: integer
        source: computed
        description: sum of Ballot.weight_snapshot with status == CAST and choice == ABSTAIN
        default: 0
      - name: quorum_met
        type: boolean
        source: computed
        description: "counted_weight_total * 10000 >= eligible_weight_total * Association.quorum_bps, recomputed on every ballot mutation"
        default: false
      - name: failed_tally_count
        type: integer
        source: computed
        description: number of tallies that returned the proposal to DRAFT for want of quorum; at 2 the next quorum failure rejects the proposal outright
        default: 0
      - name: approved_amount_cents
        type: integer
        source: computed
        description: estimated_cost_cents frozen at adoption and spread by calculations.special_assessment_allocation; 0 unless ADOPTED
        default: 0

  - name: Ballot
    parent: null
    common_fields: true
    fields:
      - name: proposal_id
        type: string
        source: input
        description: "FK -> SpecialAssessmentProposal.id; the proposal being voted on"
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the voting member, which must equal X-User-ID for the MemberOwner role"
      - name: choice
        type: enum
        source: input
        description: the vote cast
        constraints: "one of {YES, NO, ABSTAIN}"
      - name: weight_snapshot
        type: integer
        source: computed
        description: voting weight frozen at cast time by calculations.member_voting_weight under the proposal's voting_basis
      - name: status
        type: enum
        source: computed
        description: "CAST on creation; SUPERSEDED when the same member recasts; REVOKED when the member revokes; VOIDED when the member's standing_status becomes LIEN_FILED"
        default: CAST
        constraints: "one of {CAST, SUPERSEDED, REVOKED, VOIDED}"
      - name: cast_at
        type: datetime
        source: system
        description: logical-clock instant the ballot was cast

  - name: MaintenanceProject
    parent: null
    common_fields: true
    fields:
      - name: road_segment_id
        type: string
        source: input
        description: "FK -> RoadSegment.id; the segment the work occupies during its work window"
      - name: proposal_id
        type: string
        source: input
        description: "FK -> SpecialAssessmentProposal.id; the adopted proposal funding this project, null for routine operating work"
        default: null
      - name: awarded_bid_id
        type: string
        source: system
        description: "FK -> ContractorBid.id; the bid currently awarded, null while soliciting or after the awarded bid withdraws"
        default: null
      - name: category
        type: enum
        source: input
        description: work category; GRADING, SNOW and DUST are operating work, CULVERT, PAVING and BRIDGE draw on the reserve
        constraints: "one of {GRADING, SNOW, DUST, CULVERT, PAVING, BRIDGE}"
      - name: window_start_date
        type: string
        source: input
        description: ISO 8601 date, inclusive first day the contractor occupies the segment
      - name: window_end_date
        type: string
        source: input
        description: ISO 8601 date, exclusive last day of the work window (half-open interval)
      - name: status
        type: enum
        source: computed
        description: project lifecycle
        default: BID_SOLICITATION
        constraints: "one of {BID_SOLICITATION, AWARDED, COMPLETE, CANCELLED}"
      - name: awarded_amount_cents
        type: integer
        source: computed
        description: amount_cents of the awarded bid; 0 while unawarded
        default: 0
      - name: reserve_draw_cents
        type: integer
        source: computed
        description: "reserve draw held against this project from calculations.project_reserve_draw; 0 for operating categories and reversed to 0 on cancel or awarded-bid withdrawal"
        default: 0
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the RoadCommissioner who created the project; the segregation-of-duties comparand for award
      - name: awarded_by_user_id
        type: string
        source: system
        description: X-User-ID of the RoadCommissioner who awarded the project; null while unawarded
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: logical-clock instant of completion; null unless COMPLETE
        default: null
      - name: actual_cost_cents
        type: integer
        source: input
        description: final invoiced cost recorded at completion; null unless COMPLETE
        default: null
      - name: cancellation_reason
        type: string
        source: input
        description: free-text reason recorded at cancellation; null unless CANCELLED
        default: null

  - name: ContractorBid
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: system
        description: "FK -> MaintenanceProject.id; the project this bid responds to"
      - name: contractor_name
        type: string
        source: input
        description: bidding firm name
      - name: contractor_user_id
        type: string
        source: system
        description: X-User-ID of the Contractor that submitted the bid; a later bid by the same id supersedes the earlier one
      - name: amount_cents
        type: integer
        source: input
        description: lump-sum bid amount in cents
        constraints: ">= 1"
      - name: bond_on_file
        type: boolean
        source: input
        description: whether a performance bond is on file; a bid without a bond is not responsive
      - name: status
        type: enum
        source: computed
        description: bid lifecycle
        default: SUBMITTED
        constraints: "one of {SUBMITTED, SUPERSEDED, AWARDED, REJECTED, WITHDRAWN}"
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant the bid was submitted

  - name: DelinquencyAction
    parent: null
    common_fields: true
    fields:
      - name: charge_id
        type: string
        source: system
        description: "FK -> AssessmentCharge.id; the past-due charge this remedy pursues"
      - name: member_id
        type: string
        source: system
        description: "FK -> Member.id; copied from the charge at creation"
      - name: action_type
        type: enum
        source: input
        description: remedy pursued
        constraints: "one of {NOTICE, LIEN_FILING, ACCESS_RESTRICTION}"
      - name: status
        type: enum
        source: computed
        description: remedy lifecycle
        default: INITIATED
        constraints: "one of {INITIATED, EFFECTIVE, RELEASED, VOIDED}"
      - name: lien_amount_cents
        type: integer
        source: computed
        description: "charge.balance_cents frozen when a LIEN_FILING becomes EFFECTIVE; 0 for other action types and reset to 0 on release"
        default: 0
      - name: payoff_amount_cents
        type: integer
        source: computed
        description: payoff quoted by calculations.lien_payoff_amount at the moment the action became EFFECTIVE; 0 for other action types
        default: 0
      - name: restriction_start_date
        type: string
        source: input
        description: ISO 8601 date, inclusive first restricted day; required for ACCESS_RESTRICTION
        default: null
      - name: restriction_end_date
        type: string
        source: input
        description: ISO 8601 date, exclusive last restricted day; required for ACCESS_RESTRICTION
        default: null
      - name: restriction_days
        type: integer
        source: computed
        description: "(restriction_end_date - restriction_start_date) in whole days for a half-open interval; 0 for other action types"
        default: 0
      - name: initiated_by_user_id
        type: string
        source: system
        description: X-User-ID of the BoardTreasurer who initiated the remedy; the segregation-of-duties comparand for effectuation
      - name: effectuated_by_user_id
        type: string
        source: system
        description: X-User-ID of the BoardTreasurer who effectuated the remedy; null while INITIATED
        default: null
      - name: effective_at
        type: datetime
        source: system
        description: logical-clock instant the remedy became EFFECTIVE; null otherwise
        default: null
      - name: released_at
        type: datetime
        source: system
        description: logical-clock instant the remedy was released or voided; null otherwise
        default: null
      - name: release_reason
        type: string
        source: input
        description: free-text reason recorded on release or void; null while open
        default: null

  - name: ConnectionRequest
    parent: null
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: "FK -> Parcel.id; the newly subdivided lot seeking to connect to the private road"
      - name: requested_usage_class
        type: enum
        source: input
        description: usage class the new lot will be assessed under once connected
        constraints: "one of {RESIDENTIAL_YEAR_ROUND, SEASONAL, AGRICULTURAL, COMMERCIAL, UNDEVELOPED}"
      - name: requested_trips_per_day
        type: number
        source: input
        description: trip generation the new lot will be assessed under once connected
        constraints: ">= 0"
      - name: easement_grant_recorded
        type: boolean
        source: input
        description: whether the access easement over the private road has been recorded for the new lot; approval requires true
      - name: status
        type: enum
        source: computed
        description: review lifecycle
        default: SUBMITTED
        constraints: "one of {SUBMITTED, DISPUTED, APPROVED, DENIED}"
      - name: connection_fee_cents
        type: integer
        source: computed
        description: fee produced by calculations.connection_fee at approval; 0 otherwise
        default: 0
      - name: reserve_buyin_cents
        type: integer
        source: computed
        description: reserve buy-in component of connection_fee_cents, credited to Association.reserve_balance_cents at approval; 0 otherwise
        default: 0
      - name: dispute_reason
        type: string
        source: input
        description: easement dispute description recorded when the secretary defers the decision; null otherwise
        default: null
      - name: resolution_note
        type: string
        source: input
        description: note recorded when a dispute is resolved and the request returns to SUBMITTED; null otherwise
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant of the terminal decision; null until APPROVED or DENIED
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the AssociationSecretary who recorded the terminal decision; null until decided
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Parcel
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: SUBDIVIDED
        trigger: "POST /parcels/{parcel_id}/subdivide"
        actor: AssociationSecretary
        preconditions:
          - "parcel.status == ACTIVE"
          - "sum of children[].frontage_feet equals parcel.frontage_feet exactly (ERR_FRONTAGE_MISMATCH)"
          - "no AssessmentCharge for this parcel has status IN {OPEN, DELINQUENT, LIEN_ENCUMBERED} (ERR_PARCEL_HAS_OPEN_CHARGES)"
          - "no AssessmentRoll of the parcel's association has status == CERTIFIED (ERR_CERTIFIED_ROLL_LOCKED)"
        side_effects:
          - "creates one Parcel per children[] entry with parent_parcel_id = this parcel, status = PENDING_CONNECTION, covenant_recorded = false, road_segment_id copied from the parent"
          - "parent parcel status -> SUBDIVIDED, removing it from the assessable parcel set"
          - "increments Parcel.version by 1 on the parent"
        note: "children are invisible to assessment until a ConnectionRequest is APPROVED; discover them via GET /parcels?parent_parcel_id=..."
      - from: PENDING_CONNECTION
        to: ACTIVE
        trigger: "POST /connection-requests/{request_id}/decide with outcome == APPROVED"
        actor: AssociationSecretary
        preconditions:
          - "parcel.status == PENDING_CONNECTION"
          - "request.easement_grant_recorded == true (ERR_EASEMENT_NOT_RECORDED)"
        side_effects:
          - "parcel.covenant_recorded -> true, usage_class -> request.requested_usage_class, trips_per_day -> request.requested_trips_per_day"
          - "recomputes parcel.frontage_share_units and parcel.trip_share_units"
          - "cascade documented under ConnectionRequest SUBMITTED -> APPROVED"
      - from: PENDING_CONNECTION
        to: WITHDRAWN
        trigger: "POST /connection-requests/{request_id}/decide with outcome == DENIED"
        actor: AssociationSecretary
        preconditions:
          - "parcel.status == PENDING_CONNECTION"
        side_effects:
          - "parcel.status -> WITHDRAWN; the lot never enters the assessable set and no connection fee is charged"

  - entity: Member
    initial_state: PENDING_DEED_VERIFICATION
    terminal_states: []
    note: |
      Two independent state dimensions live on the same row. standing_status tracks fiscal
      standing and is advanced by deed verification, delinquency actions and payments.
      access_status tracks physical access and is advanced only by EFFECTIVE DelinquencyAction
      rows. A member can be LIEN_FILED and UNRESTRICTED at once (lien filed, no gate revocation),
      or GOOD_STANDING and WARNED (notice served, then the charge paid). Neither dimension
      constrains the other's transitions.
    transitions:
      - from: "standing_status == PENDING_DEED_VERIFICATION"
        to: "standing_status == GOOD_STANDING"
        trigger: "POST /members/{member_id}/verify-deed"
        actor: AssociationSecretary
        preconditions:
          - "member.standing_status == PENDING_DEED_VERIFICATION (ERR_MEMBER_ALREADY_VERIFIED)"
          - "verified_deed_book_page == member.deed_book_page AND == parcel.deed_book_page (ERR_DEED_MISMATCH)"
        side_effects:
          - "member.deed_verified_at = current logical clock"
          - "the member's parcel becomes eligible for assessment roll certification"
      - from: "standing_status == GOOD_STANDING"
        to: "standing_status == DELINQUENT"
        trigger: "POST /assessment-charges/{charge_id}/delinquency-actions"
        actor: BoardTreasurer
        preconditions:
          - "charge.status IN {OPEN, DELINQUENT} and charge.balance_cents > 0"
          - "current clock date >= charge.due_date + 30 days (ERR_CHARGE_NOT_YET_DELINQUENT)"
        side_effects:
          - "charge.status -> DELINQUENT and charge.delinquent_since = current clock date (first action only)"
          - "member.standing_status -> DELINQUENT via calculations.member_standing_reconciliation"
      - from: "standing_status == DELINQUENT"
        to: "standing_status == LIEN_FILED"
        trigger: "POST /delinquency-actions/{action_id}/effectuate on a LIEN_FILING or ACCESS_RESTRICTION action"
        actor: BoardTreasurer
        preconditions:
          - "action.status == INITIATED"
        side_effects:
          - "see DelinquencyAction INITIATED -> EFFECTIVE for the full four-hop cascade"
      - from: "standing_status IN {DELINQUENT, LIEN_FILED}"
        to: "standing_status == GOOD_STANDING"
        trigger: "POST /assessment-charges/{charge_id}/payments clearing the balance, or POST /delinquency-actions/{action_id}/release"
        actor: "MemberOwner | AssessmentClerk | BoardTreasurer"
        preconditions:
          - "after the mutation, no charge of this member has status IN {DELINQUENT, LIEN_ENCUMBERED}"
        side_effects:
          - "member.standing_status recomputed by calculations.member_standing_reconciliation"
          - "member.encumbered_principal_cents recomputed"
      - from: "access_status == UNRESTRICTED"
        to: "access_status == WARNED"
        trigger: "POST /delinquency-actions/{action_id}/effectuate on a NOTICE action"
        actor: BoardTreasurer
        preconditions:
          - "action.status == INITIATED and action.action_type == NOTICE"
        side_effects:
          - "member.access_status -> WARNED by calculations.member_access_reconciliation; standing_status is untouched by this hop"
      - from: "access_status IN {UNRESTRICTED, WARNED}"
        to: "access_status == RESTRICTED"
        trigger: "POST /delinquency-actions/{action_id}/effectuate on an ACCESS_RESTRICTION action"
        actor: BoardTreasurer
        preconditions:
          - "action.status == INITIATED and action.action_type == ACCESS_RESTRICTION"
          - "charge.balance_cents >= 50000 (ERR_BALANCE_BELOW_RESTRICTION_MINIMUM)"
          - "member.restricted_days_used + action.restriction_days <= 45 (ERR_RESTRICTION_DAYS_EXCEEDED)"
          - "segment.emergency_access_grade == COMPLIANT (ERR_EMERGENCY_ACCESS_DEFICIENT): a gate restriction may not be imposed on a segment that already fails the emergency-vehicle access standard"
        side_effects:
          - "member.access_status -> RESTRICTED"
          - "member.restricted_days_used += action.restriction_days"
      - from: "access_status IN {WARNED, RESTRICTED}"
        to: "access_status == UNRESTRICTED"
        trigger: "POST /delinquency-actions/{action_id}/release, or POST /assessment-charges/{charge_id}/payments clearing the balance"
        actor: "BoardTreasurer | MemberOwner | AssessmentClerk"
        preconditions:
          - "after the mutation, no EFFECTIVE DelinquencyAction remains for this member"
        side_effects:
          - "member.access_status recomputed by calculations.member_access_reconciliation; restricted_days_used is NOT decremented — consumed restriction days stay consumed for the fiscal year"

  - entity: AssessmentRoll
    initial_state: DRAFT
    terminal_states: [LEVIED]
    note: "cyclic: DRAFT -> CERTIFIED -> DRAFT -> CERTIFIED -> LEVIED; each recall increments recall_count and each re-certification recomputes every charge from current parcel data"
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /assessment-rolls/{roll_id}/certify"
        actor: AssessmentClerk
        preconditions:
          - "roll.status == DRAFT (ERR_ROLL_NOT_DRAFT)"
          - "every parcel with status == ACTIVE and covenant_recorded == true on a segment of this association has a Member with standing_status != PENDING_DEED_VERIFICATION (ERR_MEMBERSHIP_ROLL_INCOMPLETE)"
          - "the assessable parcel set is non-empty, i.e. total_share_units > 0 (ERR_NO_ASSESSABLE_PARCELS)"
        side_effects:
          - "runs calculations.annual_assessment_allocation under roll.method_variant"
          - "creates one AssessmentCharge per assessable parcel with charge_type = ANNUAL, status = PENDING, share_units_snapshot and amount_cents frozen"
          - "sets roll.total_share_units, roll.total_levied_cents, roll.unallocated_residual_cents, roll.certified_at"
          - "increments AssessmentRoll.version by 1"
      - from: CERTIFIED
        to: DRAFT
        trigger: "POST /assessment-rolls/{roll_id}/recall"
        actor: AssessmentClerk
        preconditions:
          - "roll.status == CERTIFIED (ERR_ROLL_NOT_CERTIFIED)"
        side_effects:
          - "every AssessmentCharge of this roll with charge_type == ANNUAL and status == PENDING -> VOIDED"
          - "roll.total_levied_cents -> 0, roll.total_share_units -> 0, roll.unallocated_residual_cents -> 0, roll.certified_at -> null"
          - "roll.recall_count += 1"
          - "no reserve movement occurs: the reserve contribution is credited only at levy"
      - from: CERTIFIED
        to: LEVIED
        trigger: "POST /assessment-rolls/{roll_id}/levy"
        actor: BoardTreasurer
        preconditions:
          - "roll.status == CERTIFIED (ERR_ROLL_NOT_CERTIFIED)"
          - "the acting role is BoardTreasurer, never the AssessmentClerk who certified (segregation of duties by role)"
        side_effects:
          - "every ANNUAL charge of the roll with status == PENDING -> OPEN with due_date = date(levied_at) + 45 days"
          - "roll.due_date and roll.levied_at set; roll.reserve_contribution_cents = round_half_up(budget_requirement_cents * 0.15)"
          - "Association.reserve_balance_cents += roll.reserve_contribution_cents, then reserve_funding_ratio and reserve_posture recomputed"
          - "because reserve_posture may have changed, every SpecialAssessmentProposal of the association with status == DRAFT has required_threshold_bps recomputed"

  - entity: AssessmentCharge
    initial_state: PENDING
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: PENDING
        to: OPEN
        trigger: "POST /assessment-rolls/{roll_id}/levy (system cascade)"
        actor: system
        preconditions: ["parent roll transitions CERTIFIED -> LEVIED"]
        side_effects: ["charge.due_date stamped from the roll"]
      - from: PENDING
        to: VOIDED
        trigger: "POST /assessment-rolls/{roll_id}/recall (system cascade)"
        actor: system
        preconditions: ["parent roll transitions CERTIFIED -> DRAFT"]
        side_effects: ["charge drops out of roll.total_levied_cents"]
      - from: "OPEN | DELINQUENT | LIEN_ENCUMBERED"
        to: PAID
        trigger: "POST /assessment-charges/{charge_id}/payments"
        actor: "MemberOwner | AssessmentClerk"
        preconditions:
          - "charge.status IN {OPEN, DELINQUENT, LIEN_ENCUMBERED} (ERR_CHARGE_NOT_COLLECTIBLE)"
          - "amount_cents <= charge.balance_cents (ERR_OVERPAYMENT)"
          - "for MemberOwner, charge.member_id == X-User-ID (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "charge.paid_cents += amount_cents; balance_cents recomputed; status -> PAID only when balance_cents == 0"
          - "because the charge reached PAID, every EFFECTIVE DelinquencyAction on it -> RELEASED with released_at stamped and lien_amount_cents -> 0"
          - "because those actions closed, member.standing_status and member.access_status are recomputed and member.encumbered_principal_cents falls by the released lien principal"
      - from: OPEN
        to: DELINQUENT
        trigger: "POST /assessment-charges/{charge_id}/delinquency-actions (system cascade)"
        actor: system
        preconditions: ["current clock date >= charge.due_date + 30 days"]
        side_effects: ["charge.delinquent_since set"]
      - from: DELINQUENT
        to: LIEN_ENCUMBERED
        trigger: "POST /delinquency-actions/{action_id}/effectuate (system cascade)"
        actor: system
        preconditions: ["the effectuated action has action_type IN {LIEN_FILING, ACCESS_RESTRICTION}"]
        side_effects: ["charge participates in member.encumbered_principal_cents"]
      - from: LIEN_ENCUMBERED
        to: DELINQUENT
        trigger: "POST /delinquency-actions/{action_id}/release (system cascade) while balance_cents > 0"
        actor: system
        preconditions: ["no other EFFECTIVE DelinquencyAction remains on the charge"]
        side_effects: ["member.encumbered_principal_cents recomputed"]

  - entity: SpecialAssessmentProposal
    initial_state: DRAFT
    terminal_states: [ADOPTED, REJECTED]
    note: "cyclic with a termination counter: a quorum failure returns the proposal to DRAFT until failed_tally_count reaches 2, after which the next quorum failure rejects it"
    transitions:
      - from: DRAFT
        to: BALLOTING
        trigger: "POST /special-assessment-proposals/{proposal_id}/open-balloting"
        actor: BoardTreasurer
        preconditions:
          - "proposal.status == DRAFT (ERR_PROPOSAL_NOT_DRAFT)"
          - "balloting_closes_at > current logical clock (ERR_INVALID_DATE_RANGE)"
        side_effects:
          - "eligible_weight_total = sum of calculations.member_voting_weight over the eligible voter set, snapshotted now"
          - "proposal.balloting_opened_at set; counted/yes/no/abstain totals reset to 0; quorum_met -> false"
          - "required_threshold_bps recomputed from the current Association.reserve_posture and frozen for this balloting round"
      - from: BALLOTING
        to: ADOPTED
        trigger: "POST /special-assessment-proposals/{proposal_id}/tally"
        actor: BoardTreasurer
        preconditions:
          - "proposal.status == BALLOTING (ERR_PROPOSAL_NOT_BALLOTING)"
          - "current logical clock >= balloting_closes_at (ERR_BALLOTING_STILL_OPEN)"
          - "quorum_met == true"
          - "yes_weight_total * 10000 >= counted_weight_total * required_threshold_bps"
        side_effects:
          - "approved_amount_cents = estimated_cost_cents"
          - "runs calculations.special_assessment_allocation and creates one AssessmentCharge per assessable parcel with charge_type = SPECIAL, proposal_id set, roll_id = the association's latest LEVIED roll, status = OPEN and due_date = clock date + 45 days"
          - "because SPECIAL charges were created, each billed member's standing_status is re-reconciled (no change unless a charge was already delinquent)"
      - from: BALLOTING
        to: REJECTED
        trigger: "POST /special-assessment-proposals/{proposal_id}/tally"
        actor: BoardTreasurer
        preconditions:
          - "proposal.status == BALLOTING and clock >= balloting_closes_at"
          - "quorum_met == true and yes_weight_total * 10000 < counted_weight_total * required_threshold_bps, OR quorum_met == false and failed_tally_count >= 2"
        side_effects:
          - "no charges are created; approved_amount_cents stays 0"
          - "every Ballot of this proposal with status == CAST stays CAST as the historical record"
      - from: BALLOTING
        to: DRAFT
        trigger: "POST /special-assessment-proposals/{proposal_id}/tally with quorum_met == false and failed_tally_count < 2"
        actor: BoardTreasurer
        preconditions:
          - "proposal.status == BALLOTING and clock >= balloting_closes_at"
          - "quorum_met == false"
        side_effects:
          - "failed_tally_count += 1"
          - "every Ballot of this proposal with status == CAST -> VOIDED; counted/yes/no/abstain totals reset to 0; quorum_met -> false"
          - "balloting_opened_at and balloting_closes_at reset to null so a fresh round must be opened"

  - entity: Ballot
    initial_state: CAST
    terminal_states: [SUPERSEDED, REVOKED, VOIDED]
    transitions:
      - from: CAST
        to: SUPERSEDED
        trigger: "POST /ballots for the same (proposal_id, member_id) pair"
        actor: MemberOwner
        preconditions:
          - "the new ballot passes every check for POST /ballots"
        side_effects:
          - "prior CAST ballot -> SUPERSEDED; proposal.counted_weight_total and the choice totals are recomputed from CAST ballots only"
      - from: CAST
        to: REVOKED
        trigger: "POST /ballots/{ballot_id}/revoke"
        actor: MemberOwner
        preconditions:
          - "ballot.status == CAST (ERR_BALLOT_NOT_CAST)"
          - "proposal.status == BALLOTING (ERR_PROPOSAL_NOT_BALLOTING)"
          - "current logical clock < proposal.balloting_closes_at (ERR_BALLOTING_CLOSED)"
          - "ballot.member_id == X-User-ID (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "proposal.counted_weight_total -= ballot.weight_snapshot and the matching choice total falls by the same amount"
          - "proposal.quorum_met recomputed; increments SpecialAssessmentProposal.version by 1"
      - from: CAST
        to: VOIDED
        trigger: "POST /delinquency-actions/{action_id}/effectuate (system cascade) or a quorum-failure tally"
        actor: system
        preconditions:
          - "the voting member's standing_status became LIEN_FILED while the proposal is BALLOTING, or the proposal returned to DRAFT"
        side_effects:
          - "proposal.counted_weight_total and the matching choice total fall by weight_snapshot; quorum_met recomputed"

  - entity: MaintenanceProject
    initial_state: BID_SOLICITATION
    terminal_states: [COMPLETE, CANCELLED]
    note: "cyclic: BID_SOLICITATION -> AWARDED -> BID_SOLICITATION when the awarded bid withdraws, then AWARDED again"
    transitions:
      - from: BID_SOLICITATION
        to: AWARDED
        trigger: "POST /maintenance-projects/{project_id}/award"
        actor: RoadCommissioner
        preconditions:
          - "project.status == BID_SOLICITATION (ERR_PROJECT_NOT_IN_SOLICITATION)"
          - "X-User-ID != project.created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "bid.project_id == project.id (ERR_BID_PROJECT_MISMATCH)"
          - "bid.status == SUBMITTED (ERR_BID_NOT_ACTIVE)"
          - "bid.bond_on_file == true (ERR_BOND_NOT_ON_FILE)"
          - "if project.category == PAVING then segment.emergency_access_grade == COMPLIANT (ERR_EMERGENCY_ACCESS_DEFICIENT)"
          - "bid is the lowest responsive bid per the selector in calculations.lowest_responsive_bid (ERR_NOT_LOWEST_RESPONSIVE_BID)"
          - "if the awarded amount >= 1000000 then the project has at least 3 responsive SUBMITTED bids (ERR_INSUFFICIENT_BIDS)"
          - "if project.category IN {CULVERT, BRIDGE} and Association.reserve_posture == UNDERFUNDED at request start then project.proposal_id must reference an ADOPTED proposal (ERR_RESERVE_UNDERFUNDED)"
          - "calculations.project_reserve_draw output <= Association.reserve_balance_cents (ERR_INSUFFICIENT_RESERVE)"
        side_effects:
          - "bid.status -> AWARDED; every other bid on the project with status == SUBMITTED -> REJECTED"
          - "project.awarded_bid_id, awarded_amount_cents, awarded_by_user_id set"
          - "project.reserve_draw_cents = calculations.project_reserve_draw output"
          - "Association.reserve_balance_cents -= project.reserve_draw_cents; reserve_funding_ratio and reserve_posture recomputed"
          - "because reserve_posture may have changed, every DRAFT SpecialAssessmentProposal of the association has required_threshold_bps recomputed"
      - from: AWARDED
        to: BID_SOLICITATION
        trigger: "POST /contractor-bids/{bid_id}/withdraw on the awarded bid (system cascade)"
        actor: system
        preconditions:
          - "bid.status == AWARDED and project.status == AWARDED"
        side_effects:
          - "bid.status -> WITHDRAWN"
          - "because the awarded bid left, project.status -> BID_SOLICITATION, awarded_bid_id -> null, awarded_amount_cents -> 0, awarded_by_user_id -> null"
          - "because the award was undone, project.reserve_draw_cents is returned: Association.reserve_balance_cents += the prior draw, then the draw is zeroed"
          - "because reserve_balance_cents rose, reserve_funding_ratio and reserve_posture are recomputed, and every DRAFT proposal's required_threshold_bps follows"
          - "bids previously REJECTED by this award stay REJECTED; a new round needs fresh bids"
      - from: AWARDED
        to: COMPLETE
        trigger: "POST /maintenance-projects/{project_id}/complete"
        actor: RoadCommissioner
        preconditions:
          - "project.status == AWARDED (ERR_PROJECT_NOT_AWARDED)"
          - "completed_at >= project.window_start_date (ERR_INVALID_DATE_RANGE)"
        side_effects:
          - "project.completed_at and actual_cost_cents recorded; reserve_draw_cents is retained (the draw is now spent)"
          - "if project.category IN {CULVERT, PAVING, BRIDGE} and category == PAVING then segment.surface_type -> PAVED and segment.emergency_access_grade -> UNKNOWN pending re-inspection"
      - from: "BID_SOLICITATION | AWARDED"
        to: CANCELLED
        trigger: "POST /maintenance-projects/{project_id}/cancel"
        actor: RoadCommissioner
        preconditions:
          - "project.status IN {BID_SOLICITATION, AWARDED}"
        side_effects:
          - "every bid on the project with status IN {SUBMITTED, AWARDED} -> REJECTED"
          - "because the award (if any) was undone, Association.reserve_balance_cents += project.reserve_draw_cents and project.reserve_draw_cents -> 0"
          - "because reserve_balance_cents changed, reserve_funding_ratio and reserve_posture are recomputed, and every DRAFT proposal's required_threshold_bps follows"

  - entity: ContractorBid
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED, REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "POST /maintenance-projects/{project_id}/contractor-bids by the same contractor_user_id"
        actor: Contractor
        preconditions: ["the newer bid passes every check for the endpoint"]
        side_effects: ["prior SUBMITTED bid by the same contractor_user_id -> SUPERSEDED; only the newest bid is responsive"]
      - from: SUBMITTED
        to: AWARDED
        trigger: "POST /maintenance-projects/{project_id}/award"
        actor: RoadCommissioner
        preconditions: ["see MaintenanceProject BID_SOLICITATION -> AWARDED"]
        side_effects: ["project.awarded_bid_id set to this bid"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /maintenance-projects/{project_id}/award or /cancel (system cascade)"
        actor: system
        preconditions: ["another bid was awarded, or the project was cancelled"]
        side_effects: ["bid leaves the responsive set"]
      - from: "SUBMITTED | AWARDED"
        to: WITHDRAWN
        trigger: "POST /contractor-bids/{bid_id}/withdraw"
        actor: Contractor
        preconditions:
          - "bid.status IN {SUBMITTED, AWARDED} (ERR_BID_NOT_ACTIVE)"
          - "bid.contractor_user_id == X-User-ID (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "if the bid was AWARDED, the full project reversion cascade under MaintenanceProject AWARDED -> BID_SOLICITATION runs"
      - from: AWARDED
        to: REJECTED
        trigger: "POST /maintenance-projects/{project_id}/cancel (system cascade)"
        actor: system
        preconditions: ["project.status == AWARDED at cancellation"]
        side_effects: ["reserve draw reversed as documented on the project transition"]

  - entity: DelinquencyAction
    initial_state: INITIATED
    terminal_states: [RELEASED, VOIDED]
    note: "branching: from INITIATED the same release endpoint voids an un-effectuated remedy while effectuate advances it; the two branches carry disjoint side-effect sets"
    transitions:
      - from: INITIATED
        to: EFFECTIVE
        trigger: "POST /delinquency-actions/{action_id}/effectuate"
        actor: BoardTreasurer
        preconditions:
          - "action.status == INITIATED (ERR_ACTION_NOT_INITIATED)"
          - "X-User-ID != action.initiated_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "charge.balance_cents > 0 (ERR_CHARGE_NOT_COLLECTIBLE)"
          - "for ACCESS_RESTRICTION: charge.balance_cents >= 50000 (ERR_BALANCE_BELOW_RESTRICTION_MINIMUM)"
          - "for ACCESS_RESTRICTION: member.restricted_days_used + action.restriction_days <= 45 (ERR_RESTRICTION_DAYS_EXCEEDED)"
          - "for ACCESS_RESTRICTION: segment.emergency_access_grade == COMPLIANT (ERR_EMERGENCY_ACCESS_DEFICIENT)"
        side_effects:
          - "hop 1: action.status -> EFFECTIVE, effective_at and effectuated_by_user_id stamped; for LIEN_FILING and ACCESS_RESTRICTION, lien_amount_cents = charge.balance_cents and payoff_amount_cents = calculations.lien_payoff_amount"
          - "hop 2: because a LIEN_FILING or ACCESS_RESTRICTION became EFFECTIVE, charge.status DELINQUENT -> LIEN_ENCUMBERED (NOTICE leaves the charge DELINQUENT)"
          - "hop 3: because the charge became LIEN_ENCUMBERED, member.standing_status -> LIEN_FILED and member.encumbered_principal_cents += lien_amount_cents; for ACCESS_RESTRICTION, member.access_status -> RESTRICTED and restricted_days_used += restriction_days; for NOTICE, member.access_status -> WARNED and standing_status is unchanged"
          - "hop 4: because member.standing_status became LIEN_FILED, every Ballot of that member with status == CAST on a proposal with status == BALLOTING -> VOIDED, and each affected proposal's counted_weight_total, choice totals and quorum_met are recomputed (this bumps SpecialAssessmentProposal.version)"
      - from: INITIATED
        to: VOIDED
        trigger: "POST /delinquency-actions/{action_id}/release"
        actor: BoardTreasurer
        preconditions:
          - "action.status == INITIATED"
        side_effects:
          - "action.status -> VOIDED, released_at and release_reason stamped; lien_amount_cents stays 0"
          - "charge.status stays DELINQUENT and member.standing_status is re-reconciled (falls back to GOOD_STANDING only when no delinquent charge remains)"
      - from: EFFECTIVE
        to: RELEASED
        trigger: "POST /delinquency-actions/{action_id}/release, or POST /assessment-charges/{charge_id}/payments clearing the balance (system cascade)"
        actor: "BoardTreasurer | system"
        preconditions:
          - "action.status == EFFECTIVE (ERR_ACTION_ALREADY_CLOSED when RELEASED or VOIDED)"
        side_effects:
          - "action.status -> RELEASED, released_at stamped, lien_amount_cents -> 0 and payoff_amount_cents retained as the historical quote"
          - "because the lien was released, charge.status LIEN_ENCUMBERED -> DELINQUENT when balance_cents > 0, or -> PAID when balance_cents == 0"
          - "because the charge changed, member.encumbered_principal_cents, standing_status and access_status are recomputed; restricted_days_used is NOT decremented"

  - entity: ConnectionRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    note: "cyclic through DISPUTED: SUBMITTED -> DISPUTED -> SUBMITTED -> APPROVED"
    transitions:
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /connection-requests/{request_id}/decide with outcome == DISPUTED"
        actor: AssociationSecretary
        preconditions:
          - "request.status == SUBMITTED (ERR_REQUEST_NOT_PENDING)"
          - "dispute_reason is present (ERR_INVALID_REQUEST)"
        side_effects:
          - "request.dispute_reason recorded; the lot stays PENDING_CONNECTION and no fee is computed"
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /connection-requests/{request_id}/resolve-dispute"
        actor: AssociationSecretary
        preconditions:
          - "request.status == DISPUTED (ERR_REQUEST_NOT_PENDING)"
        side_effects:
          - "request.easement_grant_recorded set from the payload, resolution_note recorded, dispute_reason -> null"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /connection-requests/{request_id}/decide with outcome == APPROVED"
        actor: AssociationSecretary
        preconditions:
          - "request.status == SUBMITTED (ERR_REQUEST_NOT_PENDING)"
          - "parcel.status == PENDING_CONNECTION (ERR_PARCEL_NOT_ACTIVE)"
          - "request.easement_grant_recorded == true (ERR_EASEMENT_NOT_RECORDED)"
          - "segment.emergency_access_grade != DEFICIENT (ERR_EMERGENCY_ACCESS_DEFICIENT)"
          - "a Member exists on the parent parcel with standing_status != PENDING_DEED_VERIFICATION (ERR_PARENT_MEMBER_NOT_FOUND)"
          - "the association has at least one AssessmentRoll with status == LEVIED (ERR_ROLL_NOT_FOUND)"
        side_effects:
          - "hop 1: request.status -> APPROVED, connection_fee_cents and reserve_buyin_cents computed by calculations.connection_fee, decided_at and decided_by_user_id stamped"
          - "hop 2: because the request was approved, the lot's Parcel goes PENDING_CONNECTION -> ACTIVE with covenant_recorded = true, usage_class and trips_per_day taken from the request, share units recomputed"
          - "hop 3: because a fee was assessed, an AssessmentCharge is created with charge_type = CONNECTION_FEE, roll_id = latest LEVIED roll, parcel_id = the new lot, member_id = the parent parcel's member, status = OPEN, due_date = clock date + 45 days"
          - "hop 4: because reserve_buyin_cents was credited, Association.reserve_balance_cents += reserve_buyin_cents, reserve_funding_ratio and reserve_posture are recomputed, and every DRAFT proposal's required_threshold_bps follows"
      - from: "SUBMITTED | DISPUTED"
        to: DENIED
        trigger: "POST /connection-requests/{request_id}/decide with outcome == DENIED"
        actor: AssociationSecretary
        preconditions:
          - "request.status IN {SUBMITTED, DISPUTED}"
        side_effects:
          - "request.decided_at and decided_by_user_id stamped; no fee, no charge, no reserve movement"
          - "because the connection was refused, the lot's Parcel goes PENDING_CONNECTION -> WITHDRAWN"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: bid-submit-stale-project
    parent_entity: MaintenanceProject
    write_endpoint: "POST /maintenance-projects/{project_id}/contractor-bids"
    occ_field: "expected_project_version"
    description: |
      Submitting a bid against a MaintenanceProject whose version has advanced since the
      client last read it is rejected. The product deliberately lets a contractor's newer
      bid supersede its own earlier bid, so a submission carrying a stale project version
      cannot be distinguished from a legitimate revision by state alone; the OCC check on
      MaintenanceProject.version is what tells the two apart.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

  - rule_id: ballot-cast-stale-proposal
    parent_entity: SpecialAssessmentProposal
    write_endpoint: "POST /ballots"
    occ_field: "expected_proposal_version"
    description: |
      Casting a ballot against a SpecialAssessmentProposal whose version has advanced since
      the client last read it is rejected. Recasting is legal (the prior ballot is
      superseded), so a second cast from the same member is not a state violation; the OCC
      check on SpecialAssessmentProposal.version is what rejects a cast written against a
      tally the client never saw, including one changed by a lien-driven ballot void.
    error_id: ERR_STALE_PROPOSAL_VERSION
    http_status: 412

  - rule_id: parcel-update-stale
    parent_entity: Parcel
    write_endpoint: "PATCH /parcels/{parcel_id}"
    occ_field: "expected_parcel_version"
    description: |
      Reclassifying a Parcel whose version has advanced since the client last read it is
      rejected. Frontage and usage-class edits are individually legal at any time while the
      parcel is ACTIVE and no roll is CERTIFIED, so a second edit is not a state violation;
      the OCC check on Parcel.version is what prevents a stale edit from silently
      overwriting a reclassification the client never observed.
    error_id: ERR_STALE_PARCEL_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: parcel_share_units
    trigger: "on POST /parcels, PATCH /parcels/{parcel_id}, POST /parcels/{parcel_id}/subdivide, and the APPROVED cascade of POST /connection-requests/{request_id}/decide"
    algorithm: weighted_scoring
    formula: |
      USAGE_MULTIPLIER = { RESIDENTIAL_YEAR_ROUND: 1.00, SEASONAL: 0.60,
                           AGRICULTURAL: 0.80, COMMERCIAL: 1.75, UNDEVELOPED: 0.25 }
      frontage_share_units = frontage_feet * USAGE_MULTIPLIER[usage_class]
      trip_share_units     = trips_per_day * TRIP_UNIT_FACTOR
                           + frontage_feet * FRONTAGE_FLOOR_WEIGHT
      # Both are kept as exact rational values; no rounding happens at this level.
      # Note the asymmetry that drives the dual-variant divergence: the trip variant does
      # NOT apply USAGE_MULTIPLIER at all.
    input_set: "the parcel row being written; no cross-entity inputs"
    constants:
      TRIP_UNIT_FACTOR: 25.0
      FRONTAGE_FLOOR_WEIGHT: 0.20
    precision: "exact rational; stored to 4 decimal places for display"

  - name: annual_assessment_allocation
    trigger: "POST /assessment-rolls/{roll_id}/certify (DRAFT -> CERTIFIED), and read-only via GET /assessment-rolls/{roll_id}/method-comparison"
    algorithm: waterfall_allocation
    formula: |
      # ---- Step 1: assessable parcel set (explicit filter, no adjectives) ----
      A = [ p for p in Parcel
            where p.status == 'ACTIVE'
              and p.covenant_recorded == true
              and p.road_segment_id IN (RoadSegment where association_id == roll.association_id)
              and EXISTS Member m where m.parcel_id == p.id
                    and m.standing_status IN {GOOD_STANDING, DELINQUENT, LIEN_FILED} ]
      # ---- Step 2: share units under the roll's method_variant ----
      u[p]  = p.frontage_share_units  if roll.method_variant == 'FRONTAGE_WEIGHTED'
            = p.trip_share_units      if roll.method_variant == 'TRIP_GENERATION_WEIGHTED'
      U     = sum(u[p] for p in A)                     # roll.total_share_units
      if U == 0: reject with ERR_NO_ASSESSABLE_PARCELS
      # ---- Step 3: raw pro-rata share, exact rational, NO rounding yet ----
      raw[p] = roll.budget_requirement_cents * u[p] / U
      # ---- Step 4: clamp to the floor and the per-parcel cap ----
      CAP   = floor(MAX_SINGLE_PARCEL_SHARE_PCT * roll.budget_requirement_cents)
      cl[p] = min(max(raw[p], MIN_CHARGE_CENTS), CAP)
      clamped[p] = (cl[p] != raw[p])
      # ---- Step 5..6: SINGLE redistribution pass over unclamped parcels only ----
      # This is the pinned evaluation order for a dependency that looks circular:
      # the cap depends on the budget, the residual depends on the clamps, and the
      # redistribution depends on the residual. There is exactly ONE pass. No second
      # clamping round and no fixed-point iteration are performed.
      residual = roll.budget_requirement_cents - sum(cl[p] for p in A)
      Unc      = [ p for p in A if not clamped[p] ]
      Uu       = sum(u[p] for p in Unc)
      for p in A:
          if p in Unc and Uu > 0:
              want = residual * u[p] / Uu
              # the redistribution itself is bounded by the same cap/floor, evaluated once
              add  = min(want, CAP - cl[p])            if residual >= 0
                   = max(want, MIN_CHARGE_CENTS - cl[p]) if residual < 0
              final[p] = cl[p] + add
          else:
              final[p] = cl[p]                          # clamped parcels never absorb residual
      # ---- Step 7: rounding order is pinned: round EACH parcel, then sum ----
      amount_cents[p] = round_half_up(final[p])
      # ---- Step 8: whatever the cap/floor and rounding left over is recorded, not spread ----
      roll.total_levied_cents        = sum(amount_cents[p] for p in A)
      roll.unallocated_residual_cents = roll.budget_requirement_cents - roll.total_levied_cents
      # unallocated_residual_cents MAY BE NEGATIVE when MIN_CHARGE_CENTS over-collected.
    input_set: "Parcel rows with status == ACTIVE and covenant_recorded == true on a RoadSegment of the roll's association whose Member has standing_status != PENDING_DEED_VERIFICATION; SUBDIVIDED, WITHDRAWN and PENDING_CONNECTION parcels are excluded"
    constants:
      MIN_CHARGE_CENTS: 50000
      MAX_SINGLE_PARCEL_SHARE_PCT: 0.40
    precision: "whole cents, round_half_up, applied per parcel after redistribution and never to an intermediate subtotal"
    variants:
      - name: FRONTAGE_WEIGHTED
        when: "roll.method_variant == 'FRONTAGE_WEIGHTED'"
        difference: "share units are frontage_feet * usage-class multiplier, so usage class drives the split and trip generation is ignored"
      - name: TRIP_GENERATION_WEIGHTED
        when: "roll.method_variant == 'TRIP_GENERATION_WEIGHTED'"
        difference: "share units are trips_per_day * 25 + frontage_feet * 0.20, so a low-traffic COMMERCIAL parcel pays materially less and a busy RESIDENTIAL parcel pays more; identical parcel data yields different per-parcel amounts and a different unallocated_residual_cents"

  - name: special_assessment_allocation
    trigger: "POST /special-assessment-proposals/{proposal_id}/tally on the BALLOTING -> ADOPTED branch"
    algorithm: waterfall_allocation
    formula: |
      # Same eight steps as annual_assessment_allocation with three substitutions:
      #   budget_requirement_cents -> proposal.estimated_cost_cents
      #   the assessable set A is additionally filtered to
      #       p.road_segment_id == proposal.road_segment_id
      #   u[p] is selected by proposal.cost_allocation_method:
      u[p] = p.frontage_share_units  if cost_allocation_method == 'FRONTAGE_WEIGHTED'
           = p.trip_share_units      if cost_allocation_method == 'TRIP_GENERATION_WEIGHTED'
           = 1                       if cost_allocation_method == 'EQUAL_SHARE'
      # Charges are created with charge_type = SPECIAL, status = OPEN,
      # due_date = current clock date + NET_DAYS, roll_id = latest LEVIED roll.
      # Latest LEVIED roll selector: AssessmentRoll where association_id matches
      # and status == 'LEVIED', ranked by fiscal_year DESC then created_at DESC,
      # first row wins; empty -> reject with ERR_ROLL_NOT_FOUND.
    input_set: "as annual_assessment_allocation, further restricted to parcels on proposal.road_segment_id"
    constants:
      MIN_CHARGE_CENTS: 50000
      MAX_SINGLE_PARCEL_SHARE_PCT: 0.40
      NET_DAYS: 45
    precision: "whole cents, round_half_up per parcel"

  - name: member_voting_weight
    trigger: "POST /special-assessment-proposals/{proposal_id}/open-balloting (for eligible_weight_total) and POST /ballots (for Ballot.weight_snapshot)"
    algorithm: threshold
    formula: |
      # Eligible voter set for proposal P (explicit filter):
      E = [ m for m in Member
            where m.standing_status IN {GOOD_STANDING, DELINQUENT}
              and EXISTS Parcel p where p.id == m.parcel_id
                    and p.status == 'ACTIVE'
                    and p.covenant_recorded == true
                    and p.road_segment_id == P.road_segment_id ]
      # NOTE: DELINQUENT members sit in the quorum denominator but may not cast
      # (POST /ballots requires GOOD_STANDING); LIEN_FILED members leave both.
      basis = P.voting_basis or Association.default_voting_basis
      if basis == 'PER_PARCEL':
          weight(m) = 1
      if basis == 'ASSESSED_SHARE':
          c = first row of [ AssessmentCharge where member_id == m.id
                               and charge_type == 'ANNUAL'
                               and status != 'VOIDED'
                               and roll.status IN {CERTIFIED, LEVIED} ]
                ranked by roll.fiscal_year DESC, then charge.created_at DESC
          weight(m) = floor(c.amount_cents / 100) if c exists else 0
      eligible_weight_total = sum(weight(m) for m in E)
    input_set: "Member rows joined to their Parcel and, for ASSESSED_SHARE, to their newest non-voided ANNUAL charge on a CERTIFIED or LEVIED roll"
    constants: {}
    precision: "integer weights; floor on the dollar conversion"
    variants:
      - name: PER_PARCEL
        when: "proposal.voting_basis == 'PER_PARCEL'"
        difference: "one vote per deeded membership regardless of assessment size, so small parcels carry the same weight as large ones"
      - name: ASSESSED_SHARE
        when: "proposal.voting_basis == 'ASSESSED_SHARE'"
        difference: "weight is the member's newest certified annual charge in whole dollars, so the same ballots can adopt under PER_PARCEL and fail under ASSESSED_SHARE when the yes voters are the lightly assessed ones"

  - name: vote_threshold_resolution
    trigger: "POST /special-assessment-proposals (creation), POST /special-assessment-proposals/{proposal_id}/open-balloting, and any cascade that changes Association.reserve_posture while the proposal is DRAFT"
    algorithm: threshold
    formula: |
      base_bps = { GRADING: 5000, CULVERT: 6000, PAVING: 6667, BRIDGE: 7500 }[project_type]
      cost_bump    = 500 if estimated_cost_cents > ESCALATION_COST_CENTS else 0
      posture_bump = 500 if Association.reserve_posture == 'UNDERFUNDED' else 0
      required_threshold_bps = min(base_bps + cost_bump + posture_bump, MAX_THRESHOLD_BPS)
      # Adoption test at tally (integer arithmetic only, no floats):
      #   quorum_met = counted_weight_total * 10000 >= eligible_weight_total * quorum_bps
      #   adopted    = quorum_met AND
      #                yes_weight_total * 10000 >= counted_weight_total * required_threshold_bps
      # PAVING is deliberately 6667 bps, not two-thirds: 2 of 3 equal votes gives
      # 20000 >= 20001 == false and therefore REJECTED.
    input_set: "the proposal row plus the association's reserve_posture at evaluation time"
    constants:
      ESCALATION_COST_CENTS: 2000000
      MAX_THRESHOLD_BPS: 8000
      GRADING_BPS: 5000
      CULVERT_BPS: 6000
      PAVING_BPS: 6667
      BRIDGE_BPS: 7500
    precision: "integer basis points; comparisons are cross-multiplied integers so no floating point rounding can shift an outcome"

  - name: emergency_access_grade_evaluation
    trigger: "POST /road-segments (initial UNKNOWN), POST /road-segments/{segment_id}/access-inspections, and the PAVING branch of POST /maintenance-projects/{project_id}/complete (resets to UNKNOWN)"
    algorithm: constraint_propagation
    formula: |
      required_turnouts = max(0, ceil(length_feet / TURNOUT_SPACING_FEET) - 1)
      compliant =     (width_feet        >= MIN_WIDTH_FEET)
                  and (max_grade_pct     <= MAX_GRADE_PCT)
                  and (turnaround_present == true)
                  and (turnout_count     >= required_turnouts)
                  and ( bridge_present == false
                        or (bridge_load_rating_tons is not null
                            and bridge_load_rating_tons >= MIN_BRIDGE_RATING_TONS) )
      emergency_access_grade = 'COMPLIANT' if compliant else 'DEFICIENT'
      # Five inputs interact non-linearly: ceil() over length feeds an integer
      # comparison, and the bridge clause is a conditional branch that disappears
      # entirely when bridge_present is false.
    input_set: "the RoadSegment row after the inspection payload has overwritten width_feet, max_grade_pct, turnout_count, turnaround_present and bridge_load_rating_tons"
    constants:
      MIN_WIDTH_FEET: 20.0
      MAX_GRADE_PCT: 12.0
      TURNOUT_SPACING_FEET: 800.0
      MIN_BRIDGE_RATING_TONS: 40.0
    precision: "boolean outcome; comparisons are inclusive on both sides (>= width, <= grade)"

  - name: connection_fee
    trigger: "POST /connection-requests/{request_id}/decide on the SUBMITTED -> APPROVED branch"
    algorithm: tiered_pricing
    formula: |
      new_units = parcel.frontage_feet * USAGE_MULTIPLIER[request.requested_usage_class]
      U_now     = sum(p.frontage_share_units for p in Parcel
                      where p.status == 'ACTIVE' and p.covenant_recorded == true
                        and p.road_segment_id IN segments of this association)
      deficit   = max(0, Association.reserve_target_cents - Association.reserve_balance_cents)
      # Four components. THE ROUNDING ORDER IS PINNED: round EACH component to whole
      # cents with round_half_up FIRST, then sum the rounded components. Summing the
      # exact components and rounding once at the end is a DIFFERENT, WRONG answer
      # (the two halves of the frontage and trip components add to a whole cent).
      c_base     = round_half_up(CONNECT_BASE_CENTS)
      c_frontage = round_half_up(parcel.frontage_feet * CONNECT_FRONTAGE_RATE_CENTS_PER_FOOT)
      c_trips    = round_half_up(request.requested_trips_per_day * CONNECT_TRIP_RATE_CENTS)
      c_reserve  = round_half_up(RESERVE_BUYIN_PCT * deficit * new_units / U_now) if U_now > 0 else 0
      reserve_buyin_cents   = c_reserve
      connection_fee_cents  = c_base + c_frontage + c_trips + c_reserve
    input_set: "the connecting Parcel, its ConnectionRequest, and the association's current ACTIVE covenant-recorded parcel set (which excludes the SUBDIVIDED parent and the connecting lot itself)"
    constants:
      CONNECT_BASE_CENTS: 250000
      CONNECT_FRONTAGE_RATE_CENTS_PER_FOOT: 1875
      CONNECT_TRIP_RATE_CENTS: 41733
      RESERVE_BUYIN_PCT: 0.35
    precision: "whole cents, round_half_up per component, then integer addition"

  - name: project_reserve_draw
    trigger: "POST /maintenance-projects/{project_id}/award; reversed by /cancel and by withdrawal of the awarded bid"
    algorithm: waterfall_allocation
    formula: |
      if project.category IN {GRADING, SNOW, DUST}:
          reserve_draw_cents = 0            # operating work is funded from the annual levy
      else:
          proposal_funding = proposal.approved_amount_cents
                             if project.proposal_id is not null
                                and proposal.status == 'ADOPTED'
                             else 0
          reserve_draw_cents = max(0, bid.amount_cents - proposal_funding)
      # Gate, evaluated against the balance as of the start of the award request:
      #   reserve_draw_cents <= Association.reserve_balance_cents, inclusive
      #   (equal is allowed and drives the balance to exactly 0)
    input_set: "the awarded ContractorBid, the project's optional ADOPTED proposal, and Association.reserve_balance_cents before the draw"
    constants: {}
    precision: "whole cents"

  - name: reserve_balance_reconciliation
    trigger: "every mutation that moves reserve money: roll levy, connection approval, project award, project cancel, awarded-bid withdrawal"
    algorithm: aggregation
    formula: |
      Association.reserve_balance_cents =
            sum(r.reserve_contribution_cents for r in AssessmentRoll
                where r.association_id == a.id and r.status == 'LEVIED')
          + sum(q.reserve_buyin_cents      for q in ConnectionRequest
                where q.status == 'APPROVED'
                  and q.parcel -> road_segment -> association_id == a.id)
          - sum(j.reserve_draw_cents       for j in MaintenanceProject
                where j.road_segment -> association_id == a.id
                  and j.status IN {AWARDED, COMPLETE})
      reserve_funding_ratio = round(reserve_balance_cents / reserve_target_cents, 4)
      reserve_posture = 'FULLY_FUNDED' if reserve_balance_cents            >= reserve_target_cents
                      : 'ADEQUATE'     if reserve_balance_cents * 100      >= reserve_target_cents * 60
                      : 'UNDERFUNDED'
      # Posture comparisons are integer cross-multiplications; the ADEQUATE boundary
      # is inclusive, so a balance of exactly 60% of target is ADEQUATE.
    input_set: "LEVIED rolls, APPROVED connection requests, and MaintenanceProject rows with status IN {AWARDED, COMPLETE}; BID_SOLICITATION and CANCELLED projects contribute nothing"
    constants:
      RESERVE_CONTRIBUTION_PCT: 0.15
      ADEQUATE_RATIO_PCT: 60
    precision: "whole cents; reserve_funding_ratio rounded to 4 decimals for display only and never used in a comparison"

  - name: lien_payoff_amount
    trigger: "POST /delinquency-actions/{action_id}/effectuate for action_type IN {LIEN_FILING, ACCESS_RESTRICTION}"
    algorithm: decay_function
    formula: |
      principal = charge.balance_cents                       # frozen at effectuation
      days_delinquent = (current clock date - charge.due_date) in whole days
      if Association.delinquency_interest_basis == 'STATUTORY':
          payoff_amount_cents = principal
                              + round_half_up(principal * STATUTORY_ANNUAL_RATE
                                              * days_delinquent / 365)
      if Association.delinquency_interest_basis == 'ASSOCIATION_POLICY':
          whole_months = floor(days_delinquent / 30)
          payoff_amount_cents = round_half_up(
              (principal + LIEN_FILING_COST_CENTS)
              * (1 + POLICY_MONTHLY_RATE) ** whole_months )
    input_set: "the charge's balance at effectuation and the association's interest basis; payments made after effectuation do not retroactively change payoff_amount_cents"
    constants:
      STATUTORY_ANNUAL_RATE: 0.12
      POLICY_MONTHLY_RATE: 0.0125
      LIEN_FILING_COST_CENTS: 12500
      GRACE_DAYS: 30
    precision: "whole cents, round_half_up once at the end of the selected branch"
    variants:
      - name: STATUTORY
        when: "Association.delinquency_interest_basis == 'STATUTORY'"
        difference: "simple interest on principal only, prorated by exact days over 365; filing costs are never added"
        note: "with principal 1589041 and 30 days delinquent this yields 1604714"
      - name: ASSOCIATION_POLICY
        when: "Association.delinquency_interest_basis == 'ASSOCIATION_POLICY'"
        difference: "filing cost is added to the base first, then compounded by whole 30-day months, so the payoff exceeds the statutory figure and steps rather than accrues"
        note: "with principal 1589041 and 30 days delinquent this yields 1621560"

  - name: lowest_responsive_bid
    trigger: "POST /maintenance-projects/{project_id}/award (validation of the caller-supplied bid_id)"
    algorithm: threshold
    formula: |
      candidates = [ b for b in ContractorBid
                     where b.project_id == project.id
                       and b.status == 'SUBMITTED'
                       and b.bond_on_file == true ]
      # eligibility filter: SUBMITTED with a bond on file
      # ranking expression: amount_cents ASC
      # tie-break: created_at ASC (never id)
      # empty candidate set: reject with ERR_NOT_LOWEST_RESPONSIVE_BID
      winner = first of candidates ranked by (amount_cents ASC, created_at ASC)
      if bid_id != winner.id: reject with ERR_NOT_LOWEST_RESPONSIVE_BID
      responsive_count = len(candidates)
      if winner.amount_cents >= COMPETITIVE_BID_THRESHOLD_CENTS and responsive_count < MIN_RESPONSIVE_BIDS:
          reject with ERR_INSUFFICIENT_BIDS
    input_set: "ContractorBid rows on the project with status == SUBMITTED and bond_on_file == true; SUPERSEDED, REJECTED and WITHDRAWN bids are excluded"
    constants:
      COMPETITIVE_BID_THRESHOLD_CENTS: 1000000
      MIN_RESPONSIVE_BIDS: 3
    precision: "integer cents comparison; the threshold is inclusive (a bid of exactly 1000000 needs three responsive bids)"

  - name: member_standing_reconciliation
    trigger: "every mutation that changes an AssessmentCharge status or a DelinquencyAction status"
    algorithm: projection
    formula: |
      if member.standing_status == 'PENDING_DEED_VERIFICATION': unchanged (verification is the only exit)
      elif EXISTS charge of member with status == 'LIEN_ENCUMBERED': 'LIEN_FILED'
      elif EXISTS charge of member with status == 'DELINQUENT':      'DELINQUENT'
      else:                                                          'GOOD_STANDING'
      encumbered_principal_cents = sum(a.lien_amount_cents for a in DelinquencyAction
                                       where a.member_id == member.id and a.status == 'EFFECTIVE')
    input_set: "all AssessmentCharge rows with member_id == member.id and status != VOIDED, plus all DelinquencyAction rows for the member"
    constants: {}
    precision: "exact integers"

  - name: member_access_reconciliation
    trigger: "every mutation that changes a DelinquencyAction status, plus the payment cascade"
    algorithm: projection
    formula: |
      if EXISTS a in DelinquencyAction where a.member_id == m.id
             and a.status == 'EFFECTIVE' and a.action_type == 'ACCESS_RESTRICTION':
          access_status = 'RESTRICTED'
      elif EXISTS a where a.member_id == m.id and a.status == 'EFFECTIVE'
             and a.action_type == 'NOTICE':
          access_status = 'WARNED'
      else:
          access_status = 'UNRESTRICTED'
      # restricted_days_used is a monotone fiscal-year counter, never decremented:
      restricted_days_used = sum(a.restriction_days for a in DelinquencyAction
                                 where a.member_id == m.id
                                   and a.action_type == 'ACCESS_RESTRICTION'
                                   and a.status IN {EFFECTIVE, RELEASED})
      # Statutory ceiling checked at effectuation:
      #   restricted_days_used + candidate.restriction_days <= MAX_RESTRICTION_DAYS_PER_FY
      # Interval semantics: each restriction is half-open [start, end), so
      # restriction_days = (end - start) in whole days, and two back-to-back
      # restrictions that touch at a single date are legal individually yet can
      # still breach the ceiling in aggregate.
    input_set: "DelinquencyAction rows for the member; VOIDED actions contribute nothing to either field"
    constants:
      MAX_RESTRICTION_DAYS_PER_FY: 45
    precision: "integer days"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and non-blank"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the six roles declared in the RBAC matrix"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "the role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 4
    category: business_constraint
    check: "request body and query shape: required fields present, enums in range, numbers non-negative, integers integral, dates ISO 8601, limit in 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 5
    category: existence
    check: "path-templated ids resolve, left to right"
    error_id: "ERR_ASSOCIATION_NOT_FOUND | ERR_ROAD_SEGMENT_NOT_FOUND | ERR_PARCEL_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_ROLL_NOT_FOUND | ERR_CHARGE_NOT_FOUND | ERR_PROPOSAL_NOT_FOUND | ERR_BALLOT_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_BID_NOT_FOUND | ERR_DELINQUENCY_ACTION_NOT_FOUND | ERR_CONNECTION_REQUEST_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 6
    category: existence
    check: "body foreign keys resolve: association_id, road_segment_id, parcel_id, member_id, proposal_id, bid_id"
    error_id: "ERR_ASSOCIATION_NOT_FOUND | ERR_ROAD_SEGMENT_NOT_FOUND | ERR_PARCEL_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_PROPOSAL_NOT_FOUND | ERR_BID_NOT_FOUND"
    http_status: 404
    applies_to: "POST /road-segments, POST /parcels, POST /members, POST /assessment-rolls, POST /special-assessment-proposals, POST /ballots, POST /maintenance-projects, POST /maintenance-projects/{project_id}/award, POST /connection-requests"
  - priority: 7
    category: auth
    check: "MemberOwner ownership: Ballot.member_id, AssessmentCharge.member_id, or the parent parcel's member equals X-User-ID; Contractor ownership: ContractorBid.contractor_user_id equals X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /ballots, POST /ballots/{ballot_id}/revoke, POST /assessment-charges/{charge_id}/payments, POST /connection-requests, POST /contractor-bids/{bid_id}/withdraw"
  - priority: 8
    category: auth
    check: "segregation of duties on X-User-ID: award may not be performed by MaintenanceProject.created_by_user_id; effectuate may not be performed by DelinquencyAction.initiated_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /maintenance-projects/{project_id}/award, POST /delinquency-actions/{action_id}/effectuate"
  - priority: 9
    category: state
    check: "OCC: expected_project_version == MaintenanceProject.version"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /maintenance-projects/{project_id}/contractor-bids"
  - priority: 10
    category: state
    check: "OCC: expected_proposal_version == SpecialAssessmentProposal.version"
    error_id: ERR_STALE_PROPOSAL_VERSION
    http_status: 412
    applies_to: "POST /ballots, POST /ballots/{ballot_id}/revoke"
  - priority: 11
    category: state
    check: "OCC: expected_parcel_version == Parcel.version"
    error_id: ERR_STALE_PARCEL_VERSION
    http_status: 412
    applies_to: "PATCH /parcels/{parcel_id}"
  - priority: 12
    category: state
    check: "AssessmentRoll.status == DRAFT"
    error_id: ERR_ROLL_NOT_DRAFT
    http_status: 409
    applies_to: "POST /assessment-rolls/{roll_id}/certify"
  - priority: 13
    category: state
    check: "AssessmentRoll.status == CERTIFIED"
    error_id: ERR_ROLL_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /assessment-rolls/{roll_id}/recall, POST /assessment-rolls/{roll_id}/levy"
  - priority: 14
    category: state
    check: "no AssessmentRoll of the parcel's association is CERTIFIED (a certified roll freezes parcel data until it is recalled or levied)"
    error_id: ERR_CERTIFIED_ROLL_LOCKED
    http_status: 409
    applies_to: "PATCH /parcels/{parcel_id}, POST /parcels/{parcel_id}/subdivide"
  - priority: 15
    category: state
    check: "Parcel.status == ACTIVE for reclassification and subdivision; Parcel.status == PENDING_CONNECTION for connection decisions"
    error_id: ERR_PARCEL_NOT_ACTIVE
    http_status: 409
    applies_to: "PATCH /parcels/{parcel_id}, POST /parcels/{parcel_id}/subdivide, POST /connection-requests, POST /connection-requests/{request_id}/decide"
  - priority: 16
    category: state
    check: "Member.standing_status == PENDING_DEED_VERIFICATION"
    error_id: ERR_MEMBER_ALREADY_VERIFIED
    http_status: 409
    applies_to: "POST /members/{member_id}/verify-deed"
  - priority: 17
    category: state
    check: "AssessmentCharge.status IN {OPEN, DELINQUENT, LIEN_ENCUMBERED} and balance_cents > 0"
    error_id: ERR_CHARGE_NOT_COLLECTIBLE
    http_status: 409
    applies_to: "POST /assessment-charges/{charge_id}/payments, POST /assessment-charges/{charge_id}/delinquency-actions, POST /delinquency-actions/{action_id}/effectuate"
  - priority: 18
    category: state
    check: "SpecialAssessmentProposal.status == DRAFT"
    error_id: ERR_PROPOSAL_NOT_DRAFT
    http_status: 409
    applies_to: "POST /special-assessment-proposals/{proposal_id}/open-balloting"
  - priority: 19
    category: state
    check: "SpecialAssessmentProposal.status == BALLOTING"
    error_id: ERR_PROPOSAL_NOT_BALLOTING
    http_status: 409
    applies_to: "POST /ballots, POST /ballots/{ballot_id}/revoke, POST /special-assessment-proposals/{proposal_id}/tally"
  - priority: 20
    category: state
    check: "the referenced proposal, when supplied, has status == ADOPTED"
    error_id: ERR_PROPOSAL_NOT_ADOPTED
    http_status: 409
    applies_to: "POST /maintenance-projects"
  - priority: 21
    category: state
    check: "Ballot.status == CAST"
    error_id: ERR_BALLOT_NOT_CAST
    http_status: 409
    applies_to: "POST /ballots/{ballot_id}/revoke"
  - priority: 22
    category: state
    check: "MaintenanceProject.status == BID_SOLICITATION"
    error_id: ERR_PROJECT_NOT_IN_SOLICITATION
    http_status: 409
    applies_to: "POST /maintenance-projects/{project_id}/contractor-bids, POST /maintenance-projects/{project_id}/award"
  - priority: 23
    category: state
    check: "MaintenanceProject.status == AWARDED"
    error_id: ERR_PROJECT_NOT_AWARDED
    http_status: 409
    applies_to: "POST /maintenance-projects/{project_id}/complete"
  - priority: 24
    category: state
    check: "ContractorBid.status IN {SUBMITTED, AWARDED} for withdrawal; == SUBMITTED for award"
    error_id: ERR_BID_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /contractor-bids/{bid_id}/withdraw, POST /maintenance-projects/{project_id}/award"
  - priority: 25
    category: state
    check: "DelinquencyAction.status == INITIATED"
    error_id: ERR_ACTION_NOT_INITIATED
    http_status: 409
    applies_to: "POST /delinquency-actions/{action_id}/effectuate"
  - priority: 26
    category: state
    check: "DelinquencyAction.status IN {INITIATED, EFFECTIVE}"
    error_id: ERR_ACTION_ALREADY_CLOSED
    http_status: 409
    applies_to: "POST /delinquency-actions/{action_id}/release"
  - priority: 27
    category: state
    check: "ConnectionRequest.status == SUBMITTED for decide, == DISPUTED for resolve-dispute (DENIED is also accepted from DISPUTED)"
    error_id: ERR_REQUEST_NOT_PENDING
    http_status: 409
    applies_to: "POST /connection-requests/{request_id}/decide, POST /connection-requests/{request_id}/resolve-dispute"
  - priority: 28
    category: business_safety
    check: "the work's road segment satisfies the emergency-vehicle access standard: emergency_access_grade == COMPLIANT before a PAVING award or an ACCESS_RESTRICTION effectuation, and != DEFICIENT before a connection approval"
    error_id: ERR_EMERGENCY_ACCESS_DEFICIENT
    http_status: 409
    applies_to: "POST /maintenance-projects/{project_id}/award, POST /delinquency-actions/{action_id}/effectuate, POST /connection-requests/{request_id}/decide"
  - priority: 29
    category: business_safety
    check: "the bid being awarded has bond_on_file == true"
    error_id: ERR_BOND_NOT_ON_FILE
    http_status: 409
    applies_to: "POST /maintenance-projects/{project_id}/award"
  - priority: 30
    category: business_referential
    check: "verified_deed_book_page equals both Member.deed_book_page and the parcel's deed_book_page"
    error_id: ERR_DEED_MISMATCH
    http_status: 409
    applies_to: "POST /members/{member_id}/verify-deed"
  - priority: 31
    category: business_referential
    check: "every ACTIVE covenant-recorded parcel of the association has a Member with standing_status != PENDING_DEED_VERIFICATION"
    error_id: ERR_MEMBERSHIP_ROLL_INCOMPLETE
    http_status: 409
    applies_to: "POST /assessment-rolls/{roll_id}/certify"
  - priority: 32
    category: business_referential
    check: "the parcel named by a connection request has covenant_recorded == false and a non-null parent_parcel_id; a member on the parent parcel exists with standing_status != PENDING_DEED_VERIFICATION"
    error_id: ERR_PARENT_MEMBER_NOT_FOUND
    http_status: 409
    applies_to: "POST /connection-requests, POST /connection-requests/{request_id}/decide"
  - priority: 33
    category: business_referential
    check: "the ConnectionRequest's easement_grant_recorded == true"
    error_id: ERR_EASEMENT_NOT_RECORDED
    http_status: 409
    applies_to: "POST /connection-requests/{request_id}/decide"
  - priority: 34
    category: business_referential
    check: "a parcel may carry at most one Member row"
    error_id: ERR_DUPLICATE_MEMBER_FOR_PARCEL
    http_status: 409
    applies_to: "POST /members"
  - priority: 35
    category: business_referential
    check: "the parcel's covenant_recorded == true when it is being enrolled onto a roll or voted with"
    error_id: ERR_COVENANT_NOT_RECORDED
    http_status: 409
    applies_to: "POST /ballots, POST /members"
  - priority: 36
    category: business_referential
    check: "the awarded bid's project_id equals the path project id"
    error_id: ERR_BID_PROJECT_MISMATCH
    http_status: 409
    applies_to: "POST /maintenance-projects/{project_id}/award"
  - priority: 37
    category: business_referential
    check: "when proposal_id is supplied, proposal.road_segment_id equals the project's road_segment_id and proposal.project_type equals project.category"
    error_id: ERR_PROPOSAL_SEGMENT_MISMATCH
    http_status: 409
    applies_to: "POST /maintenance-projects"
  - priority: 38
    category: business_constraint
    check: "the assessable parcel set is non-empty (total_share_units > 0)"
    error_id: ERR_NO_ASSESSABLE_PARCELS
    http_status: 409
    applies_to: "POST /assessment-rolls/{roll_id}/certify"
  - priority: 39
    category: business_constraint
    check: "sum of children[].frontage_feet equals the parent parcel's frontage_feet exactly, and children has at least 2 entries"
    error_id: ERR_FRONTAGE_MISMATCH
    http_status: 422
    applies_to: "POST /parcels/{parcel_id}/subdivide"
  - priority: 40
    category: business_constraint
    check: "the supplied bid_id is the lowest responsive bid per calculations.lowest_responsive_bid"
    error_id: ERR_NOT_LOWEST_RESPONSIVE_BID
    http_status: 409
    applies_to: "POST /maintenance-projects/{project_id}/award"
  - priority: 41
    category: business_constraint
    check: "a bid at or above 1000000 cents requires at least 3 responsive SUBMITTED bids on the project"
    error_id: ERR_INSUFFICIENT_BIDS
    http_status: 409
    applies_to: "POST /maintenance-projects/{project_id}/award"
  - priority: 42
    category: business_constraint
    check: "no other AssessmentRoll of the association shares this fiscal_year"
    error_id: ERR_FISCAL_YEAR_ROLL_EXISTS
    http_status: 409
    applies_to: "POST /assessment-rolls"
  - priority: 43
    category: business_temporal
    check: "the roll's closed fiscal interval [fy_start_date, fy_end_date] does not overlap any existing roll of the association; intervals that merely touch end-to-start on consecutive days are permitted; fy_start_date < fy_end_date"
    error_id: ERR_FISCAL_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /assessment-rolls"
  - priority: 44
    category: business_temporal
    check: "the project's half-open window [window_start_date, window_end_date) does not intersect the window of any project on the same road segment with status IN {BID_SOLICITATION, AWARDED}; touching windows (one ends the day the next starts) are permitted"
    error_id: ERR_WORK_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /maintenance-projects"
  - priority: 45
    category: business_temporal
    check: "a new window on a segment that already hosts a PAVING project with status IN {AWARDED, COMPLETE} must start at or after that project's window_end_date + 3 days of cure buffer"
    error_id: ERR_PAVING_CURE_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /maintenance-projects"
  - priority: 46
    category: business_temporal
    check: "current logical clock >= proposal.balloting_closes_at"
    error_id: ERR_BALLOTING_STILL_OPEN
    http_status: 409
    applies_to: "POST /special-assessment-proposals/{proposal_id}/tally"
  - priority: 47
    category: business_temporal
    check: "current logical clock < proposal.balloting_closes_at"
    error_id: ERR_BALLOTING_CLOSED
    http_status: 409
    applies_to: "POST /ballots, POST /ballots/{ballot_id}/revoke"
  - priority: 48
    category: business_temporal
    check: "current clock date >= charge.due_date + 30 grace days (inclusive)"
    error_id: ERR_CHARGE_NOT_YET_DELINQUENT
    http_status: 409
    applies_to: "POST /assessment-charges/{charge_id}/delinquency-actions"
  - priority: 49
    category: business_temporal
    check: "restriction dates are present for ACCESS_RESTRICTION, form a half-open interval with start < end, and sit inside the fiscal interval of the charge's roll"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /assessment-charges/{charge_id}/delinquency-actions, POST /special-assessment-proposals/{proposal_id}/open-balloting, POST /maintenance-projects, POST /maintenance-projects/{project_id}/complete"
  - priority: 50
    category: business_temporal
    check: "member.restricted_days_used + this action's restriction_days <= 45 days per fiscal year (inclusive ceiling)"
    error_id: ERR_RESTRICTION_DAYS_EXCEEDED
    http_status: 409
    applies_to: "POST /delinquency-actions/{action_id}/effectuate"
  - priority: 51
    category: business_fiscal
    check: "the voting member's standing_status == GOOD_STANDING"
    error_id: ERR_MEMBER_NOT_IN_GOOD_STANDING
    http_status: 409
    applies_to: "POST /ballots"
  - priority: 52
    category: business_fiscal
    check: "the parcel has no AssessmentCharge with status IN {OPEN, DELINQUENT, LIEN_ENCUMBERED}"
    error_id: ERR_PARCEL_HAS_OPEN_CHARGES
    http_status: 409
    applies_to: "POST /parcels/{parcel_id}/subdivide"
  - priority: 53
    category: business_fiscal
    check: "payment amount_cents <= charge.balance_cents"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /assessment-charges/{charge_id}/payments"
  - priority: 54
    category: business_fiscal
    check: "charge.balance_cents >= 50000 before an ACCESS_RESTRICTION may take effect"
    error_id: ERR_BALANCE_BELOW_RESTRICTION_MINIMUM
    http_status: 409
    applies_to: "POST /delinquency-actions/{action_id}/effectuate"
  - priority: 55
    category: business_fiscal
    check: "a CULVERT or BRIDGE project may not be awarded while Association.reserve_posture == UNDERFUNDED unless project.proposal_id references an ADOPTED proposal"
    error_id: ERR_RESERVE_UNDERFUNDED
    http_status: 409
    applies_to: "POST /maintenance-projects/{project_id}/award"
  - priority: 56
    category: business_fiscal
    check: "calculations.project_reserve_draw output <= Association.reserve_balance_cents (inclusive)"
    error_id: ERR_INSUFFICIENT_RESERVE
    http_status: 409
    applies_to: "POST /maintenance-projects/{project_id}/award"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------------- Association ----------------
  - method: POST
    path: "/associations"
    description: "Register the private road association and its reserve target"
    roles: [AssociationSecretary]
    code: 201
    input: [name, reserve_target_cents, "default_voting_basis?", "delinquency_interest_basis?", "quorum_bps?"]
    output: Association
    side_effects: ["reserve_balance_cents = 0, reserve_funding_ratio = 0, reserve_posture = UNDERFUNDED"]
  - method: GET
    path: "/associations/{association_id}"
    description: "Read the association including its live reserve balance, funding ratio and posture"
    roles: [AssociationSecretary, AssessmentClerk, BoardTreasurer, RoadCommissioner, MemberOwner]
    code: 200
    input: []
    output: Association
    side_effects: []

  # ---------------- RoadSegment ----------------
  - method: POST
    path: "/road-segments"
    description: "Add a maintained segment; emergency_access_grade starts UNKNOWN until the first inspection"
    roles: [RoadCommissioner]
    code: 201
    input: [association_id, name, length_feet, width_feet, max_grade_pct, surface_type, turnout_count, turnaround_present, bridge_present, "bridge_load_rating_tons?", culvert_count]
    output: RoadSegment
    side_effects: ["required_turnouts computed per calculations.emergency_access_grade_evaluation", "emergency_access_grade = UNKNOWN"]
  - method: GET
    path: "/road-segments/{segment_id}"
    description: "Read one segment"
    roles: [AssociationSecretary, AssessmentClerk, BoardTreasurer, RoadCommissioner, MemberOwner]
    code: 200
    input: []
    output: RoadSegment
    side_effects: []
  - method: GET
    path: "/road-segments"
    description: "List segments, ordered by created_at ASC; filterable by association"
    roles: [AssociationSecretary, AssessmentClerk, BoardTreasurer, RoadCommissioner, MemberOwner]
    code: 200
    input: ["association_id?", "emergency_access_grade?", "limit?", "offset?"]
    output: RoadSegment[]
    side_effects: []
  - method: POST
    path: "/road-segments/{segment_id}/access-inspections"
    description: "Record an emergency-vehicle access inspection; overwrites the measured geometry and regrades the segment"
    roles: [RoadCommissioner]
    code: 200
    input: [inspected_at, measured_width_feet, measured_max_grade_pct, measured_turnout_count, turnaround_present, "measured_bridge_load_rating_tons?"]
    output: RoadSegment
    side_effects:
      - "width_feet, max_grade_pct, turnout_count, turnaround_present and bridge_load_rating_tons overwritten from the payload; last_inspection_at = inspected_at"
      - "emergency_access_grade recomputed by calculations.emergency_access_grade_evaluation"
      - "if the grade became DEFICIENT: every MaintenanceProject on the segment with category == PAVING and status IN {BID_SOLICITATION, AWARDED} -> CANCELLED"
      - "because those projects cancelled, their SUBMITTED and AWARDED bids -> REJECTED and their reserve_draw_cents are returned to Association.reserve_balance_cents"
      - "because the reserve balance rose, reserve_funding_ratio and reserve_posture are recomputed and every DRAFT proposal's required_threshold_bps follows"
      - "increments RoadSegment.version by 1"

  # ---------------- Parcel ----------------
  - method: POST
    path: "/parcels"
    description: "Enroll a deeded parcel on a segment"
    roles: [AssociationSecretary]
    code: 201
    input: [road_segment_id, deed_book_page, frontage_feet, usage_class, trips_per_day, covenant_recorded]
    output: Parcel
    side_effects: ["status = ACTIVE", "frontage_share_units and trip_share_units computed by calculations.parcel_share_units"]
  - method: GET
    path: "/parcels/{parcel_id}"
    description: "Read one parcel including both share-unit values"
    roles: [AssociationSecretary, AssessmentClerk, BoardTreasurer, RoadCommissioner, MemberOwner]
    code: 200
    input: []
    output: Parcel
    side_effects: []
  - method: GET
    path: "/parcels"
    description: "List parcels, ordered by created_at ASC; filter by segment, by subdivision parent, or by status"
    roles: [AssociationSecretary, AssessmentClerk, BoardTreasurer, RoadCommissioner, MemberOwner]
    code: 200
    input: ["road_segment_id?", "parent_parcel_id?", "status?", "limit?", "offset?"]
    output: Parcel[]
    side_effects: []
  - method: PATCH
    path: "/parcels/{parcel_id}"
    description: "Reclassify a parcel's frontage, usage class or trip generation under optimistic concurrency"
    roles: [AssociationSecretary]
    code: 200
    input: [expected_parcel_version, "frontage_feet?", "usage_class?", "trips_per_day?"]
    output: Parcel
    side_effects:
      - "supplied fields overwritten; frontage_share_units and trip_share_units recomputed"
      - "already-created AssessmentCharge rows keep their share_units_snapshot and amount_cents: reclassification is never retroactive"
      - "increments Parcel.version by 1"
  - method: POST
    path: "/parcels/{parcel_id}/subdivide"
    description: "Split a deeded parcel into lots; each child starts PENDING_CONNECTION with covenant_recorded false. `children` is an array of at least 2 objects, each { deed_book_page, frontage_feet }."
    roles: [AssociationSecretary]
    code: 200
    input: [children]
    output: "{ parent_parcel: Parcel, children: Parcel[] }"
    side_effects:
      - "one Parcel created per children[] entry with parent_parcel_id set, status = PENDING_CONNECTION, covenant_recorded = false, usage_class = UNDEVELOPED, trips_per_day = 0, road_segment_id copied from the parent"
      - "the response's children array is returned in the same order as the request's children array, so a caller can address a specific lot without depending on a created_at tie-break"
      - "parent status -> SUBDIVIDED, leaving the assessable set"
      - "increments Parcel.version by 1 on the parent"

