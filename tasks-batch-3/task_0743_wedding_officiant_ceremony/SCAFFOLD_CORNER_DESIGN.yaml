  # ===========================================================================
  - section: state_machines
    instances:
      - name: complete_booking_from_inquiry_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Booking.CONFIRMED_to_COMPLETED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /bookings/{id}/complete on an INQUIRY booking is not a valid transition -> ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["A booking left in INQUIRY (no hold placed)"]
          setup_api_calls:
            - call: "POST /officiants"
              payload: { full_name: "Jae K", email: "jae@x.com", styles: ["SECULAR"], denomination: "CIVIL", certified_jurisdictions: ["CA"] }
              as: Coordinator
              captures: { off_id: $.data.id }
            - call: "POST /officiants/${off_id}/transition"
              payload: { to_state: "ACTIVE" }
              as: Coordinator
            - call: "POST /couples"
              payload: { partner_one_name: "Jem", partner_two_name: "Ky", email: "jk@x.com", phone: "555-0205" }
              as: Coordinator
              captures: { cp_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "Classic", tier: "CLASSIC", base_price_cents: 200000, deposit_pct: 0.30 }
              as: Coordinator
              captures: { pkg_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Kin Hall", jurisdiction: "CA", address: "25 Kin" }
              as: Coordinator
              captures: { ven_id: $.data.id }
            - call: "POST /bookings"
              payload: { officiant_id: "${off_id}", couple_id: "${cp_id}", package_id: "${pkg_id}", venue_id: "${ven_id}", ceremony_start: "2026-09-01T15:00:00Z", ceremony_end: "2026-09-01T16:00:00Z", travel_distance_km: 10, required_style: "SECULAR" }
              as: Couple
              as_user_id: "${cp_id}"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /bookings/${bk_id}/complete"
              payload: {}
              as: Officiant
              as_user_id: "${off_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Booking.${bk_id}.status == INQUIRY"

      - name: cancel_already_cancelled_booking_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Booking.terminal_states"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A CANCELLED booking is terminal; a second cancel returns ERR_INVALID_STATE (409) and does not re-run settlement."
        test_recipe:
          setup: ["A booking cancelled from HOLD (terminal CANCELLED)"]
          setup_api_calls:
            - call: "POST /officiants"
              payload: { full_name: "Lia M", email: "lia@x.com", styles: ["SECULAR"], denomination: "CIVIL", certified_jurisdictions: ["CA"] }
              as: Coordinator
              captures: { off_id: $.data.id }
            - call: "POST /officiants/${off_id}/transition"
              payload: { to_state: "ACTIVE" }
              as: Coordinator
              captures: { off_v: $.data.version }
            - call: "POST /couples"
              payload: { partner_one_name: "Lo", partner_two_name: "Mi", email: "lm2@x.com", phone: "555-0206" }
              as: Coordinator
              captures: { cp_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "Classic", tier: "CLASSIC", base_price_cents: 200000, deposit_pct: 0.30 }
              as: Coordinator
              captures: { pkg_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Lin Hall", jurisdiction: "CA", address: "26 Lin" }
              as: Coordinator
              captures: { ven_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { officiant_id: "${off_id}", couple_id: "${cp_id}", package_id: "${pkg_id}", venue_id: "${ven_id}", ceremony_start: "2026-09-01T15:00:00Z", ceremony_end: "2026-09-01T16:00:00Z", travel_distance_km: 10, required_style: "SECULAR" }
              as: Couple
              as_user_id: "${cp_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /date-holds"
              payload: { booking_id: "${bk_id}", expected_officiant_version: "${off_v}" }
              as: Couple
              as_user_id: "${cp_id}"
            - call: "POST /bookings/${bk_id}/cancel"
              payload: { cancel_reason: "COUPLE_REQUEST" }
              as: Couple
              as_user_id: "${cp_id}"
          trigger:
            - call: "POST /bookings/${bk_id}/cancel"
              payload: { cancel_reason: "COUPLE_REQUEST" }
              as: Couple
              as_user_id: "${cp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Booking.${bk_id}.status == CANCELLED"

      - name: approve_already_active_officiant_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - "state_machines.Officiant.PENDING_REVIEW_to_ACTIVE"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Approving an already-ACTIVE officiant (to_state=ACTIVE from ACTIVE) is not a declared transition -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An officiant approved to ACTIVE"]
          setup_api_calls:
            - call: "POST /officiants"
              payload: { full_name: "Mac N", email: "man@x.com", styles: ["SECULAR"], denomination: "CIVIL", certified_jurisdictions: ["CA"] }
              as: Coordinator
              captures: { off_id: $.data.id }
            - call: "POST /officiants/${off_id}/transition"
              payload: { to_state: "ACTIVE" }
              as: Coordinator
          trigger:
            - call: "POST /officiants/${off_id}/transition"
              payload: { to_state: "ACTIVE" }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: license_full_compliance_path_records
        claim_type: Valid Transition
        grounds:
          - state_machines.MarriageLicense.FILED_to_SIGNED
          - state_machines.MarriageLicense.SIGNED_to_RECORDED
          - entities.MarriageLicense.fields.recorded_at
        distinguishing_aspect: "Happy compliance path NOT_FILED->FILED->SIGNED->RECORDED sets signed_at, return_deadline (signed_at+10d), recorded_at; final status RECORDED."
        test_recipe:
          setup: ["Booking CONFIRMED at a CA venue; license created (CA, valid dates); clock 2026-03-01"]
          setup_api_calls:
            - call: "POST /officiants"
