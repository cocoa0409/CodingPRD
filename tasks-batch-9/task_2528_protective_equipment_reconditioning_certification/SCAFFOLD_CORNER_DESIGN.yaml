# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_2528 — Protective Equipment Reconditioning & Certification
#
# Breadth walk of references/claim-extraction-guide.md against this scaffold's
# §1.1-§1.7. `section:` values are the guide's nine sections; `claim_type:`
# values are its per-section rows. Corners already asserted by a §1.8 instance
# appear as `excluded_because:` stubs naming that instance.
#
# Error-catalog closure (§1.6, 51 ids) — every id is the asserted error of some
# instance across BOTH design files:
#   §1.8 covers ERR_UNIT_STATE_INVALID, ERR_ACCOUNT_ON_HOLD,
#     ERR_LIABILITY_WAIVER_MISSING, ERR_PART_STOCK_INSUFFICIENT,
#     ERR_BENCH_CALIBRATION_EXPIRED, ERR_BENCH_WINDOW_CONFLICT,
#     ERR_LOANER_DOUBLE_BOOKED.
#   §1.9 covers the remaining 44: the 12 *_NOT_FOUND ids (errors section),
#     ERR_INVALID_REQUEST, ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED,
#     ERR_ACCOUNT_SCOPE_VIOLATION, ERR_SEGREGATION_OF_DUTIES (x2 endpoints),
#     the six *_STATE_INVALID / ALREADY_VOIDED ids, ERR_CONDEMN_REQUIRED,
#     ERR_DETERMINATION_MISMATCH, ERR_DETERMINATION_UPGRADE_FORBIDDEN,
#     ERR_PART_NOT_APPROVED, ERR_PART_MODEL_MISMATCH,
#     ERR_MODEL_NOT_RECONDITIONABLE, ERR_INSPECTION_INCOMPLETE,
#     ERR_DUPLICATE_INSPECTION, ERR_UNIT_COUNT_EXCEEDED,
#     ERR_UNIT_REGISTRATION_INCOMPLETE, ERR_SERIAL_DUPLICATE,
#     ERR_RETEST_LIMIT_EXCEEDED, ERR_BENCH_DAILY_QUOTA_EXCEEDED,
#     ERR_LOANER_CERTIFICATION_EXPIRED, ERR_NO_LOANER_AVAILABLE,
#     ERR_LABEL_WINDOW_EXPIRED, ERR_RETENTION_ACTIVE,
#     ERR_WARRANTY_CLAIM_REQUIRED, ERR_SHIPMENT_NOT_READY,
#     ERR_SETTLEMENT_LOCKED, ERR_STALE_UNIT_VERSION (both §1.2.1 rules).
#
# Unknown-id literal used for 404 probes: 00000000-0000-4000-8000-000000000000
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: model_spec_creation_returns_every_declared_field
        claim_type: Creation
        grounds:
          - entities.ModelSpec
          - endpoints.POST_/model-specs
        distinguishing_aspect: |
          A create with every required input returns 201 and echoes all declared
          fields, including the nested component_criteria objects and the
          server-minted version 1; reconditionable defaults to true when omitted.
        test_recipe:
          setup:
            - "empty database with the logical clock pinned to 2026-08-01T00:00:00Z"
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantManager
          trigger:
            - &k_model
              call: "POST /model-specs"
              payload: { manufacturer: "Riddell", model_code: "SF-2026", standard_code: "ND002", shell_material: "POLYCARBONATE", max_service_life_years: 10, warranty_years: 5, record_retention_years: 3, pass_si_max: 300.0, repair_si_max: 360.0, max_retest_count: 3, required_component_codes: ["SHELL"], component_criteria: [{ code: "SHELL", metric: "crack_length_mm", metric_direction: "HIGHER_IS_WORSE", replace_threshold: 4.0, fail_threshold: 6.0, unit: "mm" }] }
              as: PlantManager
              captures: { model_id: $.data.id }
          assert:
            - "HTTP 201"
            - "ModelSpec.${model_id}.model_code == SF-2026"
            - "ModelSpec.${model_id}.standard_code == ND002"
            - "ModelSpec.${model_id}.pass_si_max == 300.0"
            - "ModelSpec.${model_id}.repair_si_max == 360.0"
            - "ModelSpec.${model_id}.required_component_codes == [SHELL]"
            - "ModelSpec.${model_id}.component_criteria[0].metric_direction == HIGHER_IS_WORSE"
            - "ModelSpec.${model_id}.reconditionable == true"
            - "ModelSpec.${model_id}.version == 1"

      - name: get_test_bench_returns_the_stored_row
        claim_type: Retrieval
        grounds:
          - entities.TestBench
          - endpoints.GET_/test-benches/{id}
        distinguishing_aspect: |
          GET /test-benches/{id} returns the same field values the create wrote,
          including calibration_valid_until null before any calibrate call.
        test_recipe:
          setup:
            - "one TestBench RIG-1 created and never calibrated"
          setup_api_calls:
            - *k_clock
            - &k_bench
              call: "POST /test-benches"
              payload: { bench_code: "RIG-1", test_type: "DROP_IMPACT", daily_session_quota: 6, cooldown_minutes: 45 }
              as: PlantManager
              captures: { bench_id: $.data.id }
          trigger:
            - call: "GET /test-benches/${bench_id}"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
          assert:
            - "HTTP 200"
            - "TestBench.${bench_id}.bench_code == RIG-1"
            - "TestBench.${bench_id}.test_type == DROP_IMPACT"
            - "TestBench.${bench_id}.daily_session_quota == 6"
            - "TestBench.${bench_id}.cooldown_minutes == 45"
            - "TestBench.${bench_id}.calibration_valid_until == null"
            - "response response_type == object"

      - name: list_approved_parts_filters_by_component_and_paginates
        claim_type: Listing
        grounds:
          - endpoints.GET_/approved-parts
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          Two SHELL parts and one LINER part exist for the model; the filtered
          page GET /approved-parts?model_spec_id=..&component_code=SHELL&limit=1
          returns exactly 1 row with total_count 2 and has_more true — the
          filter must be applied before the page window, not after.
        test_recipe:
          setup:
            - "one ModelSpec with three ApprovedPart rows: two component_code SHELL, one LINER"
          setup_api_calls:
            - *k_clock
            - *k_model
            - call: "POST /approved-parts"
              payload: { model_spec_id: "${model_id}", part_number: "PN-SHELL-1", component_code: "SHELL", oem_approved: true, unit_price_cents: 4500, received_qty: 4 }
              as: PlantManager
              captures: { part_shell_1: $.data.id }
            - call: "POST /approved-parts"
              payload: { model_spec_id: "${model_id}", part_number: "PN-SHELL-2", component_code: "SHELL", oem_approved: true, unit_price_cents: 5200, received_qty: 2 }
              as: PlantManager
              captures: { part_shell_2: $.data.id }
            - call: "POST /approved-parts"
              payload: { model_spec_id: "${model_id}", part_number: "PN-LINER-1", component_code: "LINER", oem_approved: true, unit_price_cents: 3100, received_qty: 6 }
              as: PlantManager
              captures: { part_liner_1: $.data.id }
          trigger:
            - call: "GET /approved-parts?model_spec_id=${model_id}&component_code=SHELL&limit=1&offset=0"
              payload: {}
              as: PlantManager
          assert:
            - "HTTP 200"
            - "response response_type == array"
            - "response data contains exactly 1 ApprovedPart"
            - "response total_count == 2"
            - "response has_more == true"
            - "response limit == 1"
            - "response offset == 0"
            - "the returned row's component_code == SHELL"
            - "GET /approved-parts?model_spec_id=${model_id} with no component_code returns total_count 3"

      - name: get_unknown_equipment_unit_returns_not_found
        claim_type: Not Found
        grounds:
          - errors.ERR_UNIT_NOT_FOUND
          - validations.v-path-and-fk-existence
        distinguishing_aspect: |
          A well-formed but unknown UUID on GET /equipment-units/{id} returns
          ERR_UNIT_NOT_FOUND / 404 — not 500 and not an empty 200 envelope.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /equipment-units/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: IntakeClerk
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404"
            - "response error_id == ERR_UNIT_NOT_FOUND"
            - "response response_type == error"
            - "response data.message is a non-empty string"

      - name: create_customer_account_missing_required_sport_rejected
        claim_type: Required Fields
        grounds:
          - validations.v-request-schema
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_/customer-accounts
        distinguishing_aspect: |
          sport has source input with no default, so omitting it must fail with
          ERR_INVALID_REQUEST / 400 before any row is written; the account list
          for the org name stays empty.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /customer-accounts"
              payload: { org_name: "Northside High", org_type: "SCHOOL", contact_email: "ad@northside.example" }
              as: PlantManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400"
            - "response error_id == ERR_INVALID_REQUEST"
            - "no CustomerAccount row was created"

      - name: test_bench_cooldown_minutes_default_is_45
        claim_type: Defaults
        grounds:
          - entities.TestBench.fields.cooldown_minutes
          - endpoints.POST_/test-benches
        distinguishing_aspect: |
          cooldown_minutes is an optional input with default 45; omitting it must
          persist 45 (not null and not 0), because the §1.4 bench-window rule
          reads this field to pad every requested session interval.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /test-benches"
              payload: { bench_code: "RIG-2", test_type: "PNEUMATIC_RAM", daily_session_quota: 4 }
              as: PlantManager
              captures: { bench_id_2: $.data.id }
          assert:
            - "HTTP 201"
            - "TestBench.${bench_id_2}.cooldown_minutes == 45"
            - "TestBench.${bench_id_2}.test_type == PNEUMATIC_RAM"
            - "TestBench.${bench_id_2}.daily_session_quota == 4"

      - name: shipment_count_computes_discrepancy_and_quarantines
        claim_type: Computed Fields
        grounds:
          - entities.IntakeShipment.fields.discrepancy_count
          - state_machines.IntakeShipment.status.DRAFT_to_QUARANTINED
        distinguishing_aspect: |
          Counting 3 against declared_unit_count 2 writes discrepancy_count 1 and
          routes the shipment to QUARANTINED rather than COUNTED, which later
          forces a non-MATCHED discrepancy_resolution at accept time.
        test_recipe:
          setup:
            - "one CustomerAccount with a waiver on file and one DRAFT shipment declaring 2 units"
          setup_api_calls:
            - *k_clock
            - *k_model
            - &k_acct
              call: "POST /customer-accounts"
              payload: { org_name: "Northside High", org_type: "SCHOOL", sport: "FOOTBALL", contact_email: "ad@northside.example" }
              as: PlantManager
              captures: { acct_id: $.data.id }
            - &k_waiver
              call: "POST /customer-accounts/${acct_id}/liability-acknowledgment"
              payload: { waiver_version: "2026.1", signer_name: "R. Vega" }
              as: IntakeClerk
            - call: "POST /intake-shipments"
              payload: { customer_account_id: "${acct_id}", sport: "FOOTBALL", service_tier: "STANDARD", declared_unit_count: 2, season_start_date: "2026-08-25T00:00:00Z", season_end_date: "2026-11-20T00:00:00Z" }
              as: IntakeClerk
              captures: { ship_id: $.data.id }
          trigger:
            - call: "POST /intake-shipments/${ship_id}/count"
              payload: { counted_unit_count: 3 }
              as: IntakeClerk
          assert:
            - "HTTP 200"
            - "IntakeShipment.${ship_id}.counted_unit_count == 3"
            - "IntakeShipment.${ship_id}.declared_unit_count == 2"
            - "IntakeShipment.${ship_id}.discrepancy_count == 1"
            - "IntakeShipment.${ship_id}.status == QUARANTINED"
            - "IntakeShipment.${ship_id}.discrepancy_resolution == null"
            - "IntakeShipment.${ship_id}.version == 2"

      - name: system_fields_minted_on_customer_account_create
        claim_type: System Fields
        grounds:
          - entities.CustomerAccount
          - complexity_profile.consistency_model
        distinguishing_aspect: |
          id / created_at / updated_at / version are server-minted: version is 1
          on create and 2 after the first mutation, and id is a bare UUID with no
          type prefix.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - *k_clock
            - *k_acct
          trigger:
            - call: "POST /customer-accounts/${acct_id}/liability-acknowledgment"
              payload: { waiver_version: "2026.1", signer_name: "R. Vega" }
              as: IntakeClerk
          assert:
            - "CustomerAccount.${acct_id}.id is a bare UUID with no prefix"
            - "CustomerAccount.${acct_id}.version == 2"
            - "CustomerAccount.${acct_id}.created_at is an ISO 8601 UTC timestamp"
            - "CustomerAccount.${acct_id}.updated_at >= CustomerAccount.${acct_id}.created_at"
            - "CustomerAccount.${acct_id}.liability_waiver_status == ON_FILE"
            - "CustomerAccount.${acct_id}.liability_waiver_version == 2026.1"
            - "CustomerAccount.${acct_id}.open_shipment_count == 0"

      - name: create_shipment_with_invalid_service_tier_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.IntakeShipment.fields.service_tier
          - validations.v-request-schema
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          service_tier accepts only STANDARD / SEASONAL_CONTRACT / PRIORITY_RUSH;
          "GOLD" must be rejected with ERR_INVALID_REQUEST / 400 at priority 30,
          before the FK existence check at priority 40 ever runs.
        test_recipe:
          setup:
            - "one CustomerAccount with a waiver on file"
          setup_api_calls:
            - *k_clock
            - *k_acct
            - *k_waiver
          trigger:
            - call: "POST /intake-shipments"
              payload: { customer_account_id: "${acct_id}", sport: "FOOTBALL", service_tier: "GOLD", declared_unit_count: 2, season_start_date: "2026-08-25T00:00:00Z", season_end_date: "2026-11-20T00:00:00Z" }
              as: IntakeClerk
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400"
            - "response error_id == ERR_INVALID_REQUEST"
            - "GET /intake-shipments?customer_account_id=${acct_id} returns 0 records"

      - name: component_inspection_is_immutable_and_carries_no_version
        claim_type: Immutability
        grounds:
          - entities.ComponentInspection
          - endpoints.GET_/equipment-units/{id}/inspections
        distinguishing_aspect: |
          ComponentInspection is the scaffold's only common_fields:false entity:
          the row carries id and created_at but no updated_at and no version, and
          §1.5 declares no PATCH / PUT / DELETE for it — the measurement record is
          append-only evidence.
        test_recipe:
          setup:
            - "one unit in DISASSEMBLED with a single recorded SHELL inspection"
          setup_api_calls:
            - *k_clock
            - *k_model
            - *k_acct
            - *k_waiver
            - call: "POST /intake-shipments"
              payload: { customer_account_id: "${acct_id}", sport: "FOOTBALL", service_tier: "STANDARD", declared_unit_count: 1, season_start_date: "2026-08-25T00:00:00Z", season_end_date: "2026-11-20T00:00:00Z" }
              as: IntakeClerk
              captures: { ship_id: $.data.id }
            - call: "POST /intake-shipments/${ship_id}/count"
              payload: { counted_unit_count: 1 }
              as: IntakeClerk
            - call: "POST /equipment-units"
              payload: { intake_shipment_id: "${ship_id}", serial_number: "SN-0001", declared_model_code: "SF-2026" }
              as: IntakeClerk
              captures: { u1_id: $.data.id }
            - call: "POST /intake-shipments/${ship_id}/accept"
              payload: { discrepancy_resolution: "MATCHED" }
              as: IntakeClerk
            - call: "POST /equipment-units/${u1_id}/identify"
              payload: { model_spec_id: "${model_id}", manufacture_date: "2018-09-15T00:00:00Z", age_basis: "MANUFACTURE_DATE" }
              as: IntakeClerk
            - call: "POST /equipment-units/${u1_id}/disassemble"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /equipment-units/${u1_id}/inspections"
              payload: { component_code: "SHELL", measurement_value: 1.50, measurement_unit: "mm", note: "no crown cracking" }
              as: Technician
              as_user_id: "tech-1"
              captures: { insp_id: $.data.id }
          trigger:
            - call: "GET /equipment-units/${u1_id}/inspections"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "comp-1"
          assert:
            - "HTTP 200"
            - "response data contains exactly 1 ComponentInspection with id ${insp_id}"
            - "the returned ComponentInspection has no version field"
            - "the returned ComponentInspection has no updated_at field"
            - "the returned ComponentInspection has created_at set"
            - "ComponentInspection.${insp_id}.verdict == PASS"
            - "ComponentInspection.${insp_id}.replace_threshold_applied == 4.0"
            - "ComponentInspection.${insp_id}.fail_threshold_applied == 6.0"
            - "ComponentInspection.${insp_id}.metric_direction_applied == HIGHER_IS_WORSE"
            - "ComponentInspection.${insp_id}.inspector_user_id == tech-1"
            - "§1.5 declares no PATCH, PUT or DELETE endpoint for ComponentInspection"

      - name: register_unit_under_unknown_shipment_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.EquipmentUnit.fields.intake_shipment_id
          - validations.v-path-and-fk-existence
          - errors.ERR_SHIPMENT_NOT_FOUND
        distinguishing_aspect: |
          EquipmentUnit hangs off IntakeShipment by FK; an unknown
          intake_shipment_id resolves at priority 40 to ERR_SHIPMENT_NOT_FOUND /
          404 rather than the unit's own not-found error.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /equipment-units"
              payload: { intake_shipment_id: "00000000-0000-4000-8000-000000000000", serial_number: "SN-0001" }
              as: IntakeClerk
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404"
            - "response error_id == ERR_SHIPMENT_NOT_FOUND"

      - name: create_loaner_unit_with_unknown_model_spec_returns_not_found
        claim_type: flat
        grounds:
          - complexity_profile.entity_topology
          - entities.LoanerUnit.fields.model_spec_id
          - errors.ERR_MODEL_SPEC_NOT_FOUND
        distinguishing_aspect: |
          Flat topology claim: LoanerUnit references ModelSpec by FK with no URL
          nesting, so the FK must be validated in the body — an unknown
          model_spec_id yields ERR_MODEL_SPEC_NOT_FOUND / 404 and no LoanerUnit
          row.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /loaner-units"
              payload: { model_spec_id: "00000000-0000-4000-8000-000000000000", asset_tag: "LN-009", condition_grade: "A", certification_valid_until: "2026-12-31T00:00:00Z" }
              as: PlantManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404"
            - "response error_id == ERR_MODEL_SPEC_NOT_FOUND"
            - "GET /loaner-units returns total_count 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: new_shipment_starts_in_draft_with_a_zeroed_ledger
        claim_type: Initial State
        grounds:
          - state_machines.IntakeShipment.status
          - entities.IntakeShipment.fields.status
        distinguishing_aspect: |
          A freshly created shipment sits in initial_state DRAFT with every
          computed counter and money field still null/zero — counted_unit_count,
          accepted_at, provisional_total_cents and committed_due_at are only
          written by later transitions.
        test_recipe:
          setup:
            - "one CustomerAccount with a waiver on file"
          setup_api_calls:
            - *k_clock
            - *k_acct
            - *k_waiver
          trigger:
            - call: "POST /intake-shipments"
              payload: { customer_account_id: "${acct_id}", sport: "FOOTBALL", service_tier: "STANDARD", declared_unit_count: 2, season_start_date: "2026-08-25T00:00:00Z", season_end_date: "2026-11-20T00:00:00Z" }
              as: IntakeClerk
              captures: { ship_id: $.data.id }
          assert:
            - "HTTP 201"
            - "IntakeShipment.${ship_id}.status == DRAFT"
            - "IntakeShipment.${ship_id}.counted_unit_count == null"
            - "IntakeShipment.${ship_id}.units_registered == 0"
            - "IntakeShipment.${ship_id}.units_in_process == 0"
            - "IntakeShipment.${ship_id}.accepted_at == null"
            - "IntakeShipment.${ship_id}.committed_due_at == null"
            - "IntakeShipment.${ship_id}.provisional_total_cents == null"
            - "IntakeShipment.${ship_id}.settlement_locked == false"
            - "IntakeShipment.${ship_id}.version == 1"
            - "CustomerAccount.${acct_id}.open_shipment_count == 0"

      - name: destruction_record_witness_then_verify_disposes_the_unit
        claim_type: Valid Transition
        grounds:
          - state_machines.DestructionRecord.status
          - state_machines.EquipmentUnit.custody_status.PENDING_DISPOSAL_to_DISPOSED
          - endpoints.POST_/destruction-records/{id}/witness
          - endpoints.POST_/destruction-records/{id}/verify
        distinguishing_aspect: |
          The two-officer disposal walk: witness (comp-1) moves PENDING->WITNESSED
          and stamps method/witness_name/witnessed_at, then verify (comp-2) moves
          WITNESSED->VERIFIED, drives the unit's custody axis to DISPOSED and
          writes record_retention_until = verification instant + 3 years =
          2029-08-01T00:00:00Z, which is what prevents resale of the shell.
        test_recipe:
          setup:
            - "one unit identified on FIRST_SEASON basis from 2016 (service_age_years 10, life_expired true, condemn_required true)"
            - "the unit condemned, so custody_status is PENDING_DISPOSAL and one PENDING DestructionRecord exists"
            - "that record already witnessed by comp-1"
          setup_api_calls:
            - *k_clock
            - *k_model
            - *k_acct
            - *k_waiver
            - call: "POST /intake-shipments"
              payload: { customer_account_id: "${acct_id}", sport: "FOOTBALL", service_tier: "STANDARD", declared_unit_count: 1, season_start_date: "2026-08-25T00:00:00Z", season_end_date: "2026-11-20T00:00:00Z" }
              as: IntakeClerk
              captures: { ship_id: $.data.id }
            - call: "POST /intake-shipments/${ship_id}/count"
              payload: { counted_unit_count: 1 }
              as: IntakeClerk
            - call: "POST /equipment-units"
              payload: { intake_shipment_id: "${ship_id}", serial_number: "SN-0001", declared_model_code: "SF-2026" }
              as: IntakeClerk
              captures: { u1_id: $.data.id }
            - call: "POST /intake-shipments/${ship_id}/accept"
              payload: { discrepancy_resolution: "MATCHED" }
              as: IntakeClerk
            - call: "POST /equipment-units/${u1_id}/identify"
              payload: { model_spec_id: "${model_id}", manufacture_date: "2016-09-15T00:00:00Z", age_basis: "FIRST_SEASON" }
              as: IntakeClerk
            - call: "POST /equipment-units/${u1_id}/condemn"
              payload: { condemn_reason: "LIFE_EXPIRED" }
              as: CertifyingInspector
              as_user_id: "insp-1"
            - call: "GET /equipment-units/${u1_id}/destruction-records"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "comp-1"
              captures: { dr_id: "$.data[0].id" }
