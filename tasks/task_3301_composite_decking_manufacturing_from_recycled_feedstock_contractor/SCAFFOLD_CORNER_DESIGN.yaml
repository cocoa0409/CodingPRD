            - call: "POST /decking/product-lines"
              payload: { name: "L1", color: "Grey", capped: false, profile: "GROOVED", emboss: "WOODGRAIN", board_length_ft: 16, formulation_id: "${form_id}" }
              as: ProductManager
              captures: { line1: $.data.id }
            - call: "POST /decking/stocking-commitments"
              payload: { dealer_id: "${dealer_id}", territory_code: "VA-N", product_line_id: "${line1}", committed_lf: 100, season_year: 2026 }
              as: ChannelManager
              captures: { sc_id: $.data.id }
          trigger:
            - call: "POST /decking/stocking-commitments/${sc_id}/close-season"
              payload: {}
              as: ChannelManager
              captures: { error_id: $.data.error_id }
          assert:
            - "response status 409 (precondition failure) and StockingCommitment.${sc_id}.status remains OPEN"

