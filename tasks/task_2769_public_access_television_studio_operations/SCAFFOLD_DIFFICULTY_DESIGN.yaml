            - call: "POST /studio-resources"
              payload: {resource_code: "CAM-01", resource_class: "EQUIPMENT", required_competency_code: "STUDIO_FLOOR", capacity_slots: 1, turnaround_minutes: 30, base_deposit_cents: 5000, replacement_value_cents: 90000}
              as: FacilitiesManager
              as_user_id: "fac-1"
              captures: {res_id: $.data.id}
