# =============================================================================
# §1.8 Scaffold Difficulty Design — Mobile Car Wash & Fleet Washing Service
# Test Targeting Index: 9 Difficulty Rules x >=2 instances (26 instances total)
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: wash_quote_booking_vs_completion
        grounds:
          - calculations.wash_quote_cents
          - entities.WashOrder.fields.quote_cents
          - entities.WashOrder.fields.final_cents
          - state_machines.WashOrder.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Pricing domain on WashOrder: QUOTED_AT_BOOKING prices the booked input set
          (10 sedans -> 10% tier -> 31500) while FINAL_AT_COMPLETION prices the washed
          input set (9 sedans -> 5% tier -> 29925) — identical rates and site, different
          result driven purely by input-set selection per variant.
        test_recipe:
          setup:
            - "RETAIL customer with site S1 (lot 8000 sqft, VACUUM_RECOVERY, water_reclaim_required=false, max_discharge_gal=100)"
            - "10 SEDAN vehicles registered at S1"
            - "Wash order O1 for all 10 sedans, window 2026-08-05T13:00:00Z-15:00:00Z, quote_cents 31500, CONFIRMED to SCHEDULED"
            - "BASIC van (recovery 0.60, tank 100) loaded with 96 gal; certified technician T1; route 2026-08-05 PUBLISHED with O1's stop ARRIVED"
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "Retail One", email: "r1@x.com", customer_type: "RETAIL" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "S1", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "P01", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v1: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "P02", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v2: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "P03", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v3: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "P04", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v4: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "P05", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v5: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "P06", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v6: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "P07", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v7: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "P08", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v8: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "P09", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v9: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "P10", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v10: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}", "${v2}", "${v3}", "${v4}", "${v5}", "${v6}", "${v7}", "${v8}", "${v9}", "${v10}"], scheduled_window_start: "2026-08-05T13:00:00Z", scheduled_window_end: "2026-08-05T15:00:00Z" }, as: PlatformAdmin, captures: { order_id: $.data.id, order_quote: $.data.quote_cents, order_v: $.data.version } }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher }
            - { call: "POST /fleet-wash/vans", payload: { name: "VAN-A", tank_capacity_gal: 100, reclaim_system: "BASIC" }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /fleet-wash/vans/${van_id}/events", payload: { event_type: "LOAD_WATER", gallons: 96 }, as: Dispatcher }
            - { call: "POST /fleet-wash/technicians", payload: { name: "Tech One", water_reclaim_certified: true }, as: PlatformAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /fleet-wash/routes", payload: { route_date: "2026-08-05", van_id: "${van_id}", lead_technician_id: "${tech_id}" }, as: Dispatcher, captures: { route_id: $.data.id, route_v: $.data.version } }
            - { call: "POST /fleet-wash/routes/${route_id}/stops", payload: { wash_order_id: "${order_id}", expected_route_version: "${route_v}" }, as: Dispatcher, captures: { stop_id: $.data.id } }
            - { call: "POST /fleet-wash/routes/${route_id}/events", payload: { event_type: "PUBLISH" }, as: Dispatcher }
            - { call: "POST /fleet-wash/routes/${route_id}/stops/${stop_id}/events", payload: { event_type: "ARRIVE" }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "START" }, as: Technician, as_user_id: "${tech_id}" }
          trigger:
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "COMPLETE", vehicles_washed_ids: ["${v1}", "${v2}", "${v3}", "${v4}", "${v5}", "${v6}", "${v7}", "${v8}", "${v9}"] }, as: Technician, as_user_id: "${tech_id}", captures: { final_c: $.data.final_cents, o_status: $.data.status } }
          assert:
            - "WashOrder.${order_id}.quote_cents == 31500 (booked set: 10 x 3500 = 35000, 10% tier at exactly 10 -> -3500)"
            - "WashOrder.${order_id}.final_cents == 29925 (washed set: 9 x 3500 = 31500, 5% tier -> -1575)"
            - "WashOrder.${order_id}.final_cents != WashOrder.${order_id}.quote_cents"
            - "WashOrder.${order_id}.status == COMPLETED and billing_status == UNBILLED"

      - name: invoice_projection_vs_final
        grounds:
          - calculations.fleet_invoice_billing
          - entities.Invoice.fields.variant
          - entities.Invoice.fields.line_count
          - state_machines.Invoice
        distinguishing_aspect: |
          Billing domain on Invoice/FleetContract (different entity domain than WashOrder
          pricing): PROJECTION counts the SCHEDULED unfinished order at quote (3 lines,
          81000) while FINAL counts completed orders only (2 lines, 54000) over the same
          contract and period.
        test_recipe:
          setup:
            - "FLEET customer C2 with site S1 (non-reclaim) and 10 SEDAN vehicles"
            - "FleetContract ACTIVE: rates 3000/4000/6000/10000, monthly_minimum_cents 200000, loyalty_credit_pct 0.025"
            - "O1 and O2 (10 sedans each, windows 2026-08-03T13:00Z/15:00Z) COMPLETED with all 10 washed (final 27000 each)"
            - "O3 (same 10 sedans, window 2026-08-04T13:00Z) remains SCHEDULED with quote 27000"
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "Fleet Two", email: "f2@x.com", customer_type: "FLEET" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "S1", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "Q01", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v1: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "Q02", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v2: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "Q03", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v3: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "Q04", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v4: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "Q05", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v5: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "Q06", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v6: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "Q07", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v7: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "Q08", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v8: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "Q09", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v9: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "Q10", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v10: $.data.id } }
            - { call: "POST /fleet-wash/fleet-contracts", payload: { customer_id: "${cust_id}", start_date: "2026-01-01", end_date: "2026-12-31", monthly_minimum_cents: 200000, sedan_rate_cents: 3000, suv_pickup_rate_cents: 4000, van_boxtruck_rate_cents: 6000, heavy_fleet_rate_cents: 10000, loyalty_credit_pct: 0.025 }, as: PlatformAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /fleet-wash/fleet-contracts/${contract_id}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}", "${v2}", "${v3}", "${v4}", "${v5}", "${v6}", "${v7}", "${v8}", "${v9}", "${v10}"], scheduled_window_start: "2026-08-03T13:00:00Z", scheduled_window_end: "2026-08-03T15:00:00Z" }, as: PlatformAdmin, captures: { o1_id: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders/${o1_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}", "${v2}", "${v3}", "${v4}", "${v5}", "${v6}", "${v7}", "${v8}", "${v9}", "${v10}"], scheduled_window_start: "2026-08-03T15:00:00Z", scheduled_window_end: "2026-08-03T17:00:00Z" }, as: PlatformAdmin, captures: { o2_id: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders/${o2_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}", "${v2}", "${v3}", "${v4}", "${v5}", "${v6}", "${v7}", "${v8}", "${v9}", "${v10}"], scheduled_window_start: "2026-08-04T13:00:00Z", scheduled_window_end: "2026-08-04T15:00:00Z" }, as: PlatformAdmin, captures: { o3_id: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders/${o3_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher }
            - { call: "POST /fleet-wash/vans", payload: { name: "VAN-ADV", tank_capacity_gal: 200, reclaim_system: "ADVANCED" }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /fleet-wash/vans/${van_id}/events", payload: { event_type: "LOAD_WATER", gallons: 200 }, as: Dispatcher }
            - { call: "POST /fleet-wash/technicians", payload: { name: "Tech Cert", water_reclaim_certified: true }, as: PlatformAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /fleet-wash/routes", payload: { route_date: "2026-08-03", van_id: "${van_id}", lead_technician_id: "${tech_id}" }, as: Dispatcher, captures: { route_id: $.data.id, route_v: $.data.version } }
            - { call: "POST /fleet-wash/routes/${route_id}/stops", payload: { wash_order_id: "${o1_id}", expected_route_version: "${route_v}" }, as: Dispatcher, captures: { s1_id: $.data.id } }
            - { call: "GET /fleet-wash/routes/${route_id}", payload: {}, as: Dispatcher, captures: { route_v2: $.data.version } }
            - { call: "POST /fleet-wash/routes/${route_id}/stops", payload: { wash_order_id: "${o2_id}", expected_route_version: "${route_v2}" }, as: Dispatcher, captures: { s2_id: $.data.id } }
            - { call: "POST /fleet-wash/routes/${route_id}/events", payload: { event_type: "PUBLISH" }, as: Dispatcher }
            - { call: "POST /fleet-wash/routes/${route_id}/stops/${s1_id}/events", payload: { event_type: "ARRIVE" }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /fleet-wash/wash-orders/${o1_id}/events", payload: { event_type: "START" }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /fleet-wash/wash-orders/${o1_id}/events", payload: { event_type: "COMPLETE", vehicles_washed_ids: ["${v1}", "${v2}", "${v3}", "${v4}", "${v5}", "${v6}", "${v7}", "${v8}", "${v9}", "${v10}"] }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /fleet-wash/routes/${route_id}/stops/${s2_id}/events", payload: { event_type: "ARRIVE" }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /fleet-wash/wash-orders/${o2_id}/events", payload: { event_type: "START" }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /fleet-wash/wash-orders/${o2_id}/events", payload: { event_type: "COMPLETE", vehicles_washed_ids: ["${v1}", "${v2}", "${v3}", "${v4}", "${v5}", "${v6}", "${v7}", "${v8}", "${v9}", "${v10}"] }, as: Technician, as_user_id: "${tech_id}" }
          trigger:
            - { call: "POST /fleet-wash/invoices/generate", payload: { fleet_contract_id: "${contract_id}", period_month: "2026-08", variant: "PROJECTION" }, as: Dispatcher, captures: { prev_lines: $.data.line_count, prev_charges: $.data.charges_cents, prev_billed: $.data.billed_cents } }
            - { call: "POST /fleet-wash/invoices/generate", payload: { fleet_contract_id: "${contract_id}", period_month: "2026-08", variant: "FINAL" }, as: Dispatcher, captures: { fin_lines: $.data.line_count, fin_charges: $.data.charges_cents, fin_billed: $.data.billed_cents } }
          assert:
            - "PREVIEW invoice line_count == 3 and charges_cents == 81000 (O1+O2 at final 27000 + O3 at quote 27000)"
            - "FINAL invoice line_count == 2 and charges_cents == 54000 (completed orders only)"
            - "PREVIEW loyalty_credits_cents == 2025 (3 x round_half_up(27000*0.025)=675); FINAL == 1350"
            - "Both invoices billed_cents == 200000 with minimum_applied == true (78975 and 52650 both below minimum)"
            - "PREVIEW invoice status == PREVIEW; FINAL invoice status == DRAFT"

  - rule_id: combinatorial_formula
    instances:
      - name: wash_quote_tiered_multi_input
        grounds:
          - calculations.wash_quote_cents
          - entities.Site.fields.water_reclaim_required
        distinguishing_aspect: |
          Mode (a): three inputs (class rate card, count-driven discount tier, site
          reclaim flag) interact non-linearly — the 8% surcharge applies to the
          POST-discount amount: 10 sedans at a reclaim site yields 34020, the same
          count at a plain site yields 31500, and 4 sedans at the reclaim site yields
          15120 (surcharge with zero discount).
        test_recipe:
          setup:
            - "RETAIL customer; site PLAIN (non-reclaim) and site RECLAIM (BERMS, water_reclaim_required=true, max_discharge_gal 100)"
            - "10 SEDAN vehicles"
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "Retail Q", email: "rq@x.com", customer_type: "RETAIL" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "PLAIN", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_plain: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "RECLAIM", lot_size_sqft: 60000, containment_type: "BERMS", water_reclaim_required: true, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_reclaim: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_plain}", plate: "T01", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v1: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_plain}", plate: "T02", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v2: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_plain}", plate: "T03", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v3: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_plain}", plate: "T04", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v4: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_plain}", plate: "T05", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v5: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_plain}", plate: "T06", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v6: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_plain}", plate: "T07", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v7: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_plain}", plate: "T08", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v8: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_plain}", plate: "T09", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v9: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_plain}", plate: "T10", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v10: $.data.id } }
          trigger:
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_plain}", vehicle_ids: ["${v1}", "${v2}", "${v3}", "${v4}", "${v5}", "${v6}", "${v7}", "${v8}", "${v9}", "${v10}"], scheduled_window_start: "2026-08-06T13:00:00Z", scheduled_window_end: "2026-08-06T15:00:00Z" }, as: PlatformAdmin, captures: { q_plain: $.data.quote_cents } }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_reclaim}", vehicle_ids: ["${v1}", "${v2}", "${v3}", "${v4}", "${v5}", "${v6}", "${v7}", "${v8}", "${v9}", "${v10}"], scheduled_window_start: "2026-08-07T13:00:00Z", scheduled_window_end: "2026-08-07T15:00:00Z" }, as: PlatformAdmin, captures: { q_reclaim: $.data.quote_cents } }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_reclaim}", vehicle_ids: ["${v1}", "${v2}", "${v3}", "${v4}"], scheduled_window_start: "2026-08-08T13:00:00Z", scheduled_window_end: "2026-08-08T15:00:00Z" }, as: PlatformAdmin, captures: { q_small: $.data.quote_cents } }
          assert:
            - "q_plain == 31500 (35000 - 3500 tier discount, no surcharge)"
            - "q_reclaim == 34020 (35000 - 3500 = 31500, + round_half_up(31500 * 0.08) = 2520)"
            - "q_small == 15120 (14000 no tier, + round_half_up(14000 * 0.08) = 1120)"
            - "q_reclaim - q_plain == 2520 (surcharge applies to post-discount amount, not subtotal)"

      - name: invoice_per_line_rounding_pinned
        grounds:
          - calculations.fleet_invoice_billing
          - entities.Invoice.fields.loyalty_credits_cents
        distinguishing_aspect: |
          Mode (b): nested rounding with pinned order — each order line's loyalty credit
          round_half_up(27000 * 0.0075 = 202.5) -> 203 is rounded per line and summed
          (3 x 203 = 609); rounding once after summing (81000 * 0.0075 = 607.5 -> 608)
          is forbidden. The scaffold pins per-line rounding, observable as 609.
        test_recipe:
          setup:
            - "FLEET customer; site (non-reclaim); 10 SEDAN vehicles"
            - "FleetContract ACTIVE: rates 3000/4000/6000/10000, monthly_minimum_cents 50000, loyalty_credit_pct 0.0075"
            - "Three orders (same 10 sedans each, charge 27000 each) COMPLETED in 2026-08 via one route of three stops"
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "Fleet R", email: "fr@x.com", customer_type: "FLEET" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "YARD", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "R01", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v1: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "R02", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v2: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "R03", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v3: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "R04", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v4: $.data.id } }
