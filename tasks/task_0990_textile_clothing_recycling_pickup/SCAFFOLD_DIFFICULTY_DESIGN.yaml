            - "L2 credit: ${id} == VOIDED, has_hold == false (caused by ticket quarantine, not by the adjudication directly)"
            - "L3 fund: held_cents == 0 and available_cents == 100000 (hold released by the credit voiding)"
            - "partner branch: Partner.${id}.status == QUARANTINED (SEVERE on its COMPLETED assignment)"
            - "resident strike branch: Resident.${id}.strikes == 1, still ACTIVE"

      - name: ticket_void_credit_fund_release_cascade
        grounds:
          - state_machines.WeightTicket.CERTIFIED_to_VOIDED
          - state_machines.DiversionCredit.FINALIZED_to_VOIDED
