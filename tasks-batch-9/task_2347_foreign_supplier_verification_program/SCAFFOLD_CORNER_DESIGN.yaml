              captures: { qi_a: $.data.id }
            - call: "POST /fsvp/qualified-individuals/${qi_a}/designation"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /fsvp/foreign-suppliers"
              payload: { importer_id: "${imp}", name: "Rio Verde SA", country_code: "PE", facility_registration_number: "FRN-PE-77001", regulatory_compliance_status: "NO_ADVERSE_FINDINGS" }
              as: ComplianceOfficer
              captures: { sup: $.data.id }
          trigger:
            - call: "POST /fsvp/foreign-suppliers/${sup}/evaluation"
              payload: { decision: "APPROVE", performance_basis_note: "No adverse FDA findings and two acceptable prior audits on file" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
          assert:
            - "HTTP 200"
            - "ForeignSupplier.${sup}.status == APPROVED"
            - "ForeignSupplier.${sup}.last_evaluated_at == 2026-09-01T00:00:00.000Z"
            - "ForeignSupplier.${sup}.performance_score_provisional == 100.00"
            - "ForeignSupplier.${sup}.performance_score_final == 100.00"
            - "ForeignSupplier.${sup}.performance_sample_weight_total == 0.00"
            - "ForeignSupplier.${sup}.version == 2"

      - name: hazard_added_to_approved_analysis_rejected
        claim_type: invalid_transitions
        grounds:
