              as_user_id: "po-1"
            - call: "POST /biometric-assets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", system_category: "TIMEKEEPING", modality: "FINGERPRINT", subject_class: "EMPLOYEE", template_storage_location: "tk-vault-01", declared_retention_days: 30, retention_basis: "SCHEDULE_ONLY" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { asset_id: $.data.id }
            - call: "POST /biometric-assets/${asset_id}/transitions"
              payload: { to_status: "CLASSIFIED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: SystemOperator
            - call: "POST /biometric-assets/${asset_id}/transitions"
              payload: { to_status: "ACTIVE" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /data-subjects"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", subject_type: "EMPLOYEE", external_ref: "EMP-0001", preferred_locale: "en" }
              as: HRAdministrator
              as_user_id: "hr-1"
              captures: { s1_id: $.data.id }
            - call: "POST /consent-records"
              payload: { data_subject_id: "${s1_id}", asset_id: "${asset_id}", locale: "en", written_release_acknowledged: true, signature_ref: "sig-emp1-r1" }
              as: HRAdministrator
              as_user_id: "hr-1"
              captures: { c1_id: $.data.id }
            - call: "POST /consent-records/${c1_id}/transitions"
              payload: { to_status: "GRANTED" }
              as: HRAdministrator
              as_user_id: "hr-1"
          trigger:
            - call: "POST /consent-records/${c1_id}/transitions"
              payload: { to_status: "REVOKED", revocation_reason: "employee withdrew consent" }
              as: HRAdministrator
              as_user_id: "hr-1"
            - call: "POST /consent-records/${c1_id}/transitions"
              payload: { to_status: "RESOLICIT_REQUIRED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /consent-records/${c1_id}/transitions"
              payload: { to_status: "SOLICITED" }
              as: HRAdministrator
              as_user_id: "hr-1"
            - call: "POST /consent-records/${c1_id}/transitions"
              payload: { to_status: "GRANTED", written_release_acknowledged: true, signature_ref: "sig-emp1-r2" }
              as: HRAdministrator
              as_user_id: "hr-1"
          assert:
            - "Before: BiometricAsset.${asset_id}.enrolled_subject_count == 1, consent_gap_count == 0, ComplianceProgram.${prog_id}.posture == OPEN and ConsentRecord.${c1_id}.record_retention_until == 2029-08-14T00:00:00.000Z"
            - "After REVOKED: BiometricAsset.${asset_id}.enrolled_subject_count == 0 and GET /accommodations?created_from_consent_id=${c1_id} returns exactly one row with origin == AUTO_REVOKE and status == REQUESTED"
            - "Mid-cycle: after the RESOLICIT_REQUIRED call BiometricAsset.${asset_id}.consent_gap_count == 1 and ComplianceProgram.${prog_id}.posture == RESTRICTED"
            - "After the final GRANTED: BiometricAsset.${asset_id}.enrolled_subject_count == 1 exactly (not 2 — the headcount is restored, not double-counted) and consent_gap_count == 0"
            - "COMPENSATION: the row returned by GET /accommodations?created_from_consent_id=${c1_id} now has status == ENDED, and DataSubject.${s1_id}.active_accommodation_count == 0 with enrollment_status ENROLLED"
            - "ComplianceProgram.${prog_id}.posture is back to OPEN, ConsentRecord.${c1_id}.solicitation_round is exactly 1 greater than its value at creation, and record_retention_until == 2029-08-14T00:00:00.000Z (re-stamped from the unchanged clock)"
