scaffold_corner_design:
- section: entities
  instances:
  - name: program_creation_applies_every_declared_default
    claim_type: defaults
    grounds:
    - entities.TransplantProgram.fields.organ_type
    - entities.TransplantProgram.fields.cooling_off_days
    - entities.TransplantProgram.fields.follow_up_completeness_threshold_pct
    - entities.TransplantProgram.fields.follow_up_compliance_threshold_pct
    - entities.TransplantProgram.fields.expected_one_year_survival_rate
    - entities.TransplantProgram.fields.donor_fund_pool_cents
    - entities.TransplantProgram.fields.compliance_posture
    - calculations.donor_fund_ledger
    - calculations.program_follow_up_compliance
    - endpoints[POST /programs]
    distinguishing_aspect: Only the two mandatory inputs are supplied, so all eight optional inputs AND
      the five computed openers must come from the scaffold's declared defaults - notably the vacuous
      follow_up_compliance_pct 100.00 rather than 0.00.
    test_recipe:
      setup:
      - Empty database. The logical clock stands at its default 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T00:00:00Z'
        as: ProgramAdmin
      trigger:
        call: POST /programs
        payload:
          name: Default Policy Center
          center_code: DEF-01
        as: ProgramAdmin
      assert:
      - HTTP 201
      - organ_type == KIDNEY
      - cooling_off_days == 7
      - follow_up_completeness_threshold_pct == 80
      - follow_up_compliance_threshold_pct == 75
      - expected_one_year_survival_rate == 0.95
      - donor_fund_pool_cents == 5000000
      - lost_wage_daily_cap_cents == 30000
      - lost_wage_weekly_cap_cents == 150000
      - donor_fund_committed_cents == 0 and donor_fund_remaining_cents == 5000000
      - 'follow_up_compliance_pct == 100.00 (vacuous: no DonorFollowUp is due)'
      - cit_breach_count == 0
      - compliance_posture == OPEN
      - last_sweep_at is null
      - version == 1 and created_at == 2026-08-01T00:00:00Z
  - name: recipient_creation_returns_declared_fields_and_creation_time_score
    claim_type: creation
    grounds:
    - entities.RecipientCandidate
    - calculations.waitlist_priority_score
    - endpoints[POST /recipient-candidates]
    distinguishing_aspect: The priority score is computed AT CREATION with zero waiting time, so the assertion
      pins the three non-waiting components (14.0 + 2.01 + 4.00) and proves active_days_total contributes
      nothing before any waitlist event exists.
    test_recipe:
      setup:
      - Program NLT-01 with coordinator staff exists.
      - 'The candidate is urgency 7, dialysis_years 2.0, cpra 0.85, age 44: c_urgency 14.0, c_waiting
        0.0, c_dialysis round_half_up(2.01, 2) = 2.01, c_cpra 4.0, c_pediatric 0.0.'
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T00:00:00Z'
        as: ProgramAdmin
      - call: POST /programs
        payload:
          name: Northlake Transplant Center
          center_code: NLT-01
          organ_type: KIDNEY
          cooling_off_days: 7
          follow_up_completeness_threshold_pct: 80
          follow_up_compliance_threshold_pct: 75
          expected_one_year_survival_rate: 0.8
          donor_fund_pool_cents: 5000000
          lost_wage_daily_cap_cents: 30000
          lost_wage_weekly_cap_cents: 150000
        as: ProgramAdmin
        captures:
          prog_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Coordinator One
          staff_role: TRANSPLANT_COORDINATOR
          npi: '1000000001'
        as: ProgramAdmin
        captures:
          coord_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Advocate One
          staff_role: LIVING_DONOR_ADVOCATE
          npi: '1000000002'
        as: ProgramAdmin
        captures:
          adv_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Reviewer Med
          staff_role: EVALUATION_REVIEWER
          npi: '1000000003'
        as: ProgramAdmin
        captures:
          revmed_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Reviewer Psy
          staff_role: EVALUATION_REVIEWER
          npi: '1000000004'
        as: ProgramAdmin
        captures:
          revpsy_id: $.data.id
      trigger:
        call: POST /recipient-candidates
        payload:
          program_id: ${prog_id}
          mrn: R-101
          abo_blood_type: A
          age_years: 44
          cpra: 0.85
          dialysis_years: 2.0
          medical_urgency_points: 7
        as: TransplantCoordinator
        as_user_id: ${coord_id}
      assert:
      - HTTP 201
      - listing_status == WORKUP
      - active_days_total == 0
      - waitlist_priority_score == 20.01
      - offer_decline_count == 0
      - candidacy_approved_by_staff_id is null and registered_at is null
      - version == 1
      - mrn == R-101 and abo_blood_type == A and cpra == 0.85
