              as: ClearanceSupervisor
            - call: "POST /licenses"
              payload: { production_id: "${prod_id}", asset_id: "${asset_id}", archive_id: "${arch_id}", rights_leg: "FOOTAGE", media: "BROADCAST", territory: "WORLD", window_class: "ALL_MEDIA_WINDOW", term_months: 12, term_start_date: "2026-08-15", term_end_date: "2027-08-15" }
              as: ClearanceSupervisor
              captures: { lic_id: $.data.id, lic_v: $.data.version }
            - call: "POST /licenses/${lic_id}/negotiation-rounds"
              payload: { party: "LICENSOR", proposed_fee_cents: 258750, expected_license_version: "${lic_v}" }
              as: RightsHolderRep
              as_user_id: "${arch_id}"
            - call: "POST /licenses/${lic_id}/state"
              payload: { to_status: "EXECUTED" }
              as: ClearanceSupervisor
            - call: "POST /productions/${prod_id}/subject-releases"
              payload: { subject_person_key: "reyes-marta", release_type: "APPEARANCE", depiction_from_date: "2026-03-01", depiction_to_date: "2026-03-31", asset_id: "${asset_id}", approval_rights: "ROUGH_CUT" }
              as: ProductionAdmin
              captures: { rel_id: $.data.id }
            - call: "POST /subject-releases/${rel_id}/state"
              payload: { to_status: "SENT" }
              as: ProductionAdmin
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: ClearanceSupervisor
              captures: { pv2: $.data.version }
            - call: "POST /productions/${prod_id}/clearance-charts"
              payload: { chart_label: "restricted pin", expected_production_version: "${pv2}" }
              as: ClearanceSupervisor
              captures: { chart_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "LOCKED" }
              as: ClearanceSupervisor
          assert:
            - "at stage 1 Production.${prod_id}.posture == BLOCKED and the pin returns 409 ERR_PRODUCTION_POSTURE_BLOCKED; no ClearanceChart row exists"
            - "Asset.${asset_id}.depiction_status == PENDING as soon as depiction_subject_key is set, and stays PENDING while the release is only SENT"
            - "at stage 2 posture == RESTRICTED (open 0, pending_depiction 1) and the pin returns 201 with status PINNED and pinned_row_count == 1"
            - "the LOCKED request returns 409 ERR_PRODUCTION_POSTURE_RESTRICTED, not ERR_EO_NOT_BOUND — priority 15 is consulted before priority 28 even though no E&O application exists"
            - "Production.${prod_id}.status is still CLEARANCE and committed_fee_cents == 258750"

      - name: negotiation_round_ceiling_error
        claim_type: error_reachability
        grounds:
          - errors.ERR_NEGOTIATION_ROUND_LIMIT
        excluded_because:
          difficulty_instance: "non_linear_state_machine / license_negotiation_cycle_revisits_quoted_and_caps_at_six_rounds"
          rationale: "The sixth-round ceiling and its 409 are asserted by the named §1.8 instance."

      - name: stale_and_superseded_chart_errors
        claim_type: error_reachability
        grounds:
          - errors.ERR_CHART_STALE
          - errors.ERR_CUE_SHEET_INCOMPLETE
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / stale_chart_referential_error_outranks_cue_sheet_safety_error"
          rationale: "Both ERR_CHART_STALE and, after the chart is re-pinned, ERR_CUE_SHEET_INCOMPLETE are triggered by the named §1.8 instance."

      - name: suspended_archive_error
        claim_type: error_reachability
        grounds:
          - errors.ERR_ARCHIVE_SUSPENDED
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / archive_suspension_blocks_execution_of_an_otherwise_valid_quoted_license"
          rationale: "The 409 on execution against a SUSPENDED archive is the named §1.8 instance's core assertion."

      - name: unbound_eo_error_on_delivery
        claim_type: error_reachability
        grounds:
          - errors.ERR_EO_NOT_BOUND
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / unbound_eo_application_blocks_delivery_of_a_fully_validated_package"
          rationale: "ERR_EO_NOT_BOUND on VALIDATED -> DELIVERED, and the success after binding, are the named §1.8 instance."

      - name: renewal_window_error
        claim_type: error_reachability
        grounds:
          - errors.ERR_OUTSIDE_RENEWAL_WINDOW
        excluded_because:
          difficulty_instance: "boundary_precision_check / renewal_window_sixty_versus_sixty_one_whole_days"
          rationale: "The 61-day refusal with ERR_OUTSIDE_RENEWAL_WINDOW is the named §1.8 instance."

      - name: overlap_and_depiction_conflict_errors
        claim_type: error_reachability
        grounds:
          - errors.ERR_LICENSE_TERM_OVERLAP
          - errors.ERR_DEPICTION_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / license_term_adjacency_allowed_but_one_day_intersection_refused"
          rationale: "ERR_LICENSE_TERM_OVERLAP is asserted there and ERR_DEPICTION_WINDOW_CONFLICT in its sibling depiction-window instance."

  - section: rbac
    instances:

      - name: exclusive_operations_are_unauthorized_for_every_other_role
        claim_type: role_exclusivity
        grounds:
          - roles.ProductionAdmin.exclusive_operations
          - roles.ArchiveResearcher.exclusive_operations
          - roles.ClearanceSupervisor.exclusive_operations
          - roles.LegalCounsel.exclusive_operations
          - validations[priority=3]
        distinguishing_aspect: "Each role's exclusive list must be closed against the other four: four different exclusive endpoints are attacked by four different wrong roles and every one answers 403 ERR_UNAUTHORIZED with no state change, proving no role is a superset of another (the model is segregation_of_duties, not hierarchical_override)."
        test_recipe:
          setup: ["A production in CLEARANCE with one 45-second footage asset, one ACTIVE archive with the standard rate card, and one AVAILABLE candidate already logged."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Role Walls", delivery_deadline_date: "2027-06-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "POST /archives"
              payload: { name: "Pathe Vault", holder_type: "FILM_ARCHIVE" }
              as: ArchiveResearcher
              captures: { arch_id: $.data.id }
            - call: "POST /archives/${arch_id}/rate-cards"
              payload: { base_rate_per_30s_cents: 60000, minimum_fee_cents: 150000, festival_minimum_fee_cents: 40000, effective_from_date: "2026-01-01" }
              as: ArchiveResearcher
              captures: { rc_id: $.data.id }
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Kerbside", timecode_in_seconds: 0, timecode_out_seconds: 45, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
              captures: { asset_id: $.data.id }
            - call: "POST /assets/${asset_id}/source-candidates"
              payload: { archive_id: "${arch_id}", availability_status: "AVAILABLE" }
              as: ArchiveResearcher
              captures: { cand_id: $.data.id }
          trigger:
            - call: "POST /productions"
              payload: { title: "Not My Job", delivery_deadline_date: "2027-06-30" }
              as: ClearanceSupervisor
            - call: "POST /assets/${asset_id}/source-candidates"
              payload: { archive_id: "${arch_id}", availability_status: "AVAILABLE" }
              as: ClearanceSupervisor
            - call: "POST /archives/${arch_id}/state"
              payload: { to_status: "SUSPENDED", reason: "Dispute" }
              as: ProductionAdmin
            - call: "POST /assets/${asset_id}/fair-use-analyses"
              payload: { transformative_score: 90, nature_score: 60, amount_used_score: 40, market_harm_score: 50 }
              as: ClearanceSupervisor
          assert:
            - "POST /productions as ClearanceSupervisor returns 403 ERR_UNAUTHORIZED — creating the production file is ProductionAdmin-exclusive"
            - "POST /assets/{id}/source-candidates as ClearanceSupervisor returns 403 ERR_UNAUTHORIZED — logging candidates is ArchiveResearcher-exclusive"
            - "POST /archives/{id}/state as ProductionAdmin returns 403 ERR_UNAUTHORIZED and Archive.${arch_id}.status is still ACTIVE"
            - "POST /assets/{id}/fair-use-analyses as ClearanceSupervisor returns 403 ERR_UNAUTHORIZED — authoring the four-factor analysis is LegalCounsel-exclusive"
            - "GET /assets/${asset_id}/source-candidates returns exactly 1 row after all four refusals"

      - name: shared_operations_succeed_for_each_declared_role
        claim_type: shared_operations
        grounds:
          - roles.ProductionAdmin.shared_operations
          - roles.ArchiveResearcher.shared_operations
          - roles.ClearanceSupervisor.shared_operations
          - endpoints.POST_/archives
          - endpoints.POST_/assets/{id}/select-source
        distinguishing_aspect: "Shared operations must be genuinely shared: POST /archives works for BOTH ArchiveResearcher and ProductionAdmin, POST /licenses for BOTH ProductionAdmin and ClearanceSupervisor, and select-source for BOTH ArchiveResearcher and ClearanceSupervisor, with identical semantics whichever role calls."
        test_recipe:
          setup: ["An empty database. One production in CLEARANCE with two 45-second footage assets."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Shared Hands", delivery_deadline_date: "2027-06-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Asset by researcher", timecode_in_seconds: 0, timecode_out_seconds: 45, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
              captures: { a1: $.data.id }
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Asset by admin", timecode_in_seconds: 0, timecode_out_seconds: 45, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ProductionAdmin
              captures: { a2: $.data.id }
          trigger:
            - call: "POST /archives"
              payload: { name: "Researcher Archive", holder_type: "FILM_ARCHIVE" }
              as: ArchiveResearcher
              captures: { arch_a: $.data.id }
            - call: "POST /archives"
              payload: { name: "Admin Archive", holder_type: "STOCK_LIBRARY" }
              as: ProductionAdmin
              captures: { arch_b: $.data.id }
            - call: "POST /archives/${arch_a}/rate-cards"
              payload: { base_rate_per_30s_cents: 60000, minimum_fee_cents: 150000, festival_minimum_fee_cents: 40000, effective_from_date: "2026-01-01" }
              as: RightsHolderRep
              as_user_id: "${arch_a}"
              captures: { rc_a: $.data.id }
            - call: "POST /assets/${a1}/source-candidates"
              payload: { archive_id: "${arch_a}", availability_status: "AVAILABLE" }
              as: ArchiveResearcher
              captures: { c1: $.data.id }
            - call: "POST /assets/${a2}/source-candidates"
              payload: { archive_id: "${arch_a}", availability_status: "AVAILABLE" }
              as: ArchiveResearcher
              captures: { c2: $.data.id }
            - call: "POST /assets/${a1}/select-source"
              payload: { source_candidate_id: "${c1}" }
              as: ArchiveResearcher
            - call: "POST /assets/${a2}/select-source"
              payload: { source_candidate_id: "${c2}" }
              as: ClearanceSupervisor
            - call: "POST /licenses"
              payload: { production_id: "${prod_id}", asset_id: "${a1}", archive_id: "${arch_a}", rights_leg: "FOOTAGE", media: "BROADCAST", territory: "WORLD", window_class: "ALL_MEDIA_WINDOW", term_months: 12, term_start_date: "2026-08-15", term_end_date: "2027-08-15" }
              as: ProductionAdmin
              captures: { l1: $.data.id }
