  - rule_id: resource_temporal_overlap
    instances:

      - name: volunteer_sessions_collide_under_buffered_half_open_intervals
        grounds:
          - validations[priority=20]
          - errors[ERR_SITE_WINDOW_CONFLICT]
          - entities.VolunteerEvent.fields.window_start
          - entities.CollectionSite.fields.bin_capacity
        distinguishing_aspect: |
          Overlap semantics #1 occupies a CollectionSite exclusively with HALF-OPEN
          intervals padded by a 45-minute turnover buffer: a session starting at 16:00
          after one ending at 15:30 is rejected, while a session starting at exactly
          16:15 (end + buffer, the strict-inequality edge) is accepted.
        test_recipe:
          setup:
            - "Cycle 'Back-to-School 2026' is COLLECTING and site 'Northside Depot' is ACTIVE."
            - "One SCHEDULED assembly session occupies 2026-08-05T09:00:00Z to 2026-08-05T15:30:00Z."
          setup_api_calls:
            - call: "POST /drive-cycles"
              payload: { name: "Back-to-School 2026", cadence: "BACK_TO_SCHOOL", window_start: "2026-07-01T00:00:00Z", window_end: "2026-09-30T23:59:59Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { cycle_id: $.data.id }
            - call: "PATCH /drive-cycles/${cycle_id}/status"
              payload: { target_status: "COLLECTING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /collection-sites"
              payload: { drive_cycle_id: "${cycle_id}", name: "Northside Depot", site_type: "RETAIL", bin_capacity: 10 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { site_id: $.data.id }
            - call: "PATCH /collection-sites/${site_id}/operational-status"
              payload: { target_status: "ACTIVE" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /volunteer-events"
              payload: { collection_site_id: "${site_id}", event_type: "ASSEMBLY", window_start: "2026-08-05T09:00:00Z", window_end: "2026-08-05T15:30:00Z", volunteer_count: 8, minor_volunteer_count: 0, adult_supervisor_count: 1 }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { ve1_id: $.data.id }
          trigger:
            - call: "POST /volunteer-events"
              payload: { collection_site_id: "${site_id}", event_type: "SORTING", window_start: "2026-08-05T16:00:00Z", window_end: "2026-08-05T17:00:00Z", volunteer_count: 4, minor_volunteer_count: 0, adult_supervisor_count: 1 }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { err: $.data.error_id }
            - call: "POST /volunteer-events"
              payload: { collection_site_id: "${site_id}", event_type: "SORTING", window_start: "2026-08-05T16:15:00Z", window_end: "2026-08-05T17:15:00Z", volunteer_count: 4, minor_volunteer_count: 0, adult_supervisor_count: 1 }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { ve3_id: $.data.id }
          assert:
            - "The 16:00 attempt returns HTTP 409 with error_id == ERR_SITE_WINDOW_CONFLICT"
            - "The 16:15 attempt returns HTTP 201"
            - "VolunteerEvent.${ve3_id}.status == SCHEDULED"
            - "GET /collection-sites/${site_id}/volunteer-events returns exactly 2 events"

      - name: distribution_events_overlap_on_closed_intervals_with_aggregate_seat_ceiling
        grounds:
          - validations[priority=21]
          - errors[ERR_SCHOOL_THROUGHPUT_EXCEEDED]
          - entities.School.fields.max_concurrent_seats
          - entities.DistributionEvent.fields.seat_capacity
        distinguishing_aspect: |
          Overlap semantics #2 sits on a different resource entity, the School, and uses
          CLOSED intervals with an AGGREGATE capacity instead of exclusive occupation:
          an event touching the incumbent's end instant at 19:00:00Z overlaps and pushes
          100 + 30 past max_concurrent_seats 120, while starting one second later at
          19:00:01Z is accepted.
        test_recipe:
          setup:
            - "Lincoln Elementary is ACTIVE with max_concurrent_seats 120."
            - "A DRAFT distribution event with seat_capacity 100 runs 2026-08-20T15:00:00Z to 2026-08-20T19:00:00Z."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Lincoln Elementary", district_code: "D7", title_i_pct: 0.80, enrollment_count: 400, max_concurrent_seats: 120 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { school_id: $.data.id }
            - call: "PATCH /schools/${school_id}/partnership-status"
              payload: { target_status: "MOU_PENDING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "PATCH /schools/${school_id}/partnership-status"
              payload: { target_status: "ACTIVE" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /drive-cycles"
              payload: { name: "Back-to-School 2026", cadence: "BACK_TO_SCHOOL", window_start: "2026-07-01T00:00:00Z", window_end: "2026-09-30T23:59:59Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { cycle_id: $.data.id }
            - call: "PATCH /drive-cycles/${cycle_id}/status"
              payload: { target_status: "COLLECTING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /distribution-events"
              payload: { school_id: "${school_id}", drive_cycle_id: "${cycle_id}", grade_band: "K_2", window_start: "2026-08-20T15:00:00Z", window_end: "2026-08-20T19:00:00Z", seat_capacity: 100 }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { ev1_id: $.data.id }
          trigger:
            - call: "POST /distribution-events"
              payload: { school_id: "${school_id}", drive_cycle_id: "${cycle_id}", grade_band: "G3_5", window_start: "2026-08-20T19:00:00Z", window_end: "2026-08-20T21:00:00Z", seat_capacity: 30 }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { err: $.data.error_id }
            - call: "POST /distribution-events"
              payload: { school_id: "${school_id}", drive_cycle_id: "${cycle_id}", grade_band: "G3_5", window_start: "2026-08-20T19:00:01Z", window_end: "2026-08-20T21:00:00Z", seat_capacity: 30 }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { ev3_id: $.data.id }
          assert:
            - "The 19:00:00Z attempt returns HTTP 409 with error_id == ERR_SCHOOL_THROUGHPUT_EXCEEDED"
            - "The 19:00:01Z attempt returns HTTP 201"
            - "DistributionEvent.${ev3_id}.seat_capacity == 30"
            - "GET /distribution-events with school_id=${school_id} returns exactly 2 events"

  - rule_id: compensating_invariant
    instances:

      - name: confirm_then_waitlist_conserves_physical_units
        grounds:
          - calculations.item_conservation
          - state_machines.StudentRegistration.VERIFIED_to_CONFIRMED
          - state_machines.StudentRegistration.CONFIRMED_to_WAITLISTED
          - entities.InventoryPosition.fields.reserved_qty
          - entities.InventoryPosition.fields.adjustment_qty
        distinguishing_aspect: |
          Conserved quantity #1 is PHYSICAL UNITS of one SKU in one cycle: after the
          CONFIRMED reservation leg and its WAITLISTED release leg,
          on_hand_qty + reserved_qty + distributed_qty + damaged_qty is still exactly 3,
          equal to accepted_donated_qty + purchased_received_qty + adjustment_qty, with
          on_hand back at 3 and reserved back at 0.
        test_recipe:
          setup:
            - "Lincoln Elementary is ACTIVE with a PUBLISHED K_2 needs list of 1 backpack per student."
            - "The COLLECTING cycle holds 3 backpacks, all from a single opening cycle-count adjustment."
            - "A PUBLISHED event with seat_capacity 4 has one VERIFIED registration."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Lincoln Elementary", district_code: "D7", title_i_pct: 0.80, enrollment_count: 400, max_concurrent_seats: 120 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { school_id: $.data.id }
            - call: "PATCH /schools/${school_id}/partnership-status"
              payload: { target_status: "MOU_PENDING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "PATCH /schools/${school_id}/partnership-status"
              payload: { target_status: "ACTIVE" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /supply-items"
              payload: { sku: "BPK-01", name: "Standard backpack", category: "BACKPACK", unit_cost_cents: 1450, bulk_pack_size: 6 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { backpack_id: $.data.id }
            - call: "POST /grade-kit-specs"
              payload: { school_id: "${school_id}", grade_band: "K_2", student_target_count: 100 }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { spec_id: $.data.id }
            - call: "POST /kit-spec-lines"
              payload: { grade_kit_spec_id: "${spec_id}", supply_item_id: "${backpack_id}", qty_per_student: 1 }
              as: SchoolLiaison
              as_user_id: "${school_id}"
            - call: "PATCH /grade-kit-specs/${spec_id}/status"
              payload: { target_status: "PUBLISHED" }
              as: SchoolLiaison
              as_user_id: "${school_id}"
            - call: "POST /drive-cycles"
              payload: { name: "Back-to-School 2026", cadence: "BACK_TO_SCHOOL", window_start: "2026-07-01T00:00:00Z", window_end: "2026-09-30T23:59:59Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { cycle_id: $.data.id }
            - call: "PATCH /drive-cycles/${cycle_id}/status"
              payload: { target_status: "COLLECTING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /inventory-positions/adjustments"
              payload: { drive_cycle_id: "${cycle_id}", supply_item_id: "${backpack_id}", delta_on_hand_qty: 3, reason: "opening count" }
              as: WarehouseLead
              as_user_id: "wl-1"
              captures: { pos_id: $.data.id }
            - call: "POST /distribution-events"
              payload: { school_id: "${school_id}", drive_cycle_id: "${cycle_id}", grade_band: "K_2", window_start: "2026-08-20T15:00:00Z", window_end: "2026-08-20T19:00:00Z", seat_capacity: 4 }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /distribution-events/${ev_id}/transitions"
              payload: { target_status: "PUBLISHED" }
              as: SchoolLiaison
              as_user_id: "${school_id}"
            - call: "POST /student-registrations"
              payload: { distribution_event_id: "${ev_id}", student_reference: "S-001", grade_band: "K_2", guardian_name: "G One", free_lunch_eligible: true }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { r1_id: $.data.id }
            - call: "GET /distribution-events/${ev_id}"
              payload: {}
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { ev_v1: $.data.version }
            - call: "POST /student-registrations/${r1_id}/transitions"
              payload: { target_status: "VERIFIED", expected_distribution_event_version: "${ev_v1}" }
              as: SchoolLiaison
              as_user_id: "${school_id}"
          trigger:
            - call: "GET /distribution-events/${ev_id}"
              payload: {}
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { ev_v2: $.data.version }
            - call: "POST /student-registrations/${r1_id}/transitions"
              payload: { target_status: "CONFIRMED", expected_distribution_event_version: "${ev_v2}" }
              as: SchoolLiaison
              as_user_id: "${school_id}"
            - call: "GET /inventory-positions/${pos_id}"
              payload: {}
              as: WarehouseLead
              as_user_id: "wl-1"
              captures: { mid_on_hand: $.data.on_hand_qty, mid_reserved: $.data.reserved_qty }
            - call: "GET /distribution-events/${ev_id}"
              payload: {}
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { ev_v3: $.data.version }
            - call: "POST /student-registrations/${r1_id}/transitions"
              payload: { target_status: "WAITLISTED", expected_distribution_event_version: "${ev_v3}" }
              as: SchoolLiaison
              as_user_id: "${school_id}"
            - call: "GET /inventory-positions/${pos_id}"
              payload: {}
              as: WarehouseLead
              as_user_id: "wl-1"
              captures: { end_on_hand: $.data.on_hand_qty, end_reserved: $.data.reserved_qty }
          assert:
            - "InventoryPosition.${pos_id}.on_hand_qty == 2 and reserved_qty == 1 between the two legs"
            - "InventoryPosition.${pos_id}.on_hand_qty == 3 after the compensating leg"
            - "InventoryPosition.${pos_id}.reserved_qty == 0 after the compensating leg"
            - "InventoryPosition.${pos_id}.distributed_qty == 0 and damaged_qty == 0"
            - "InventoryPosition.${pos_id}.adjustment_qty == 3"
            - "StudentRegistration.${r1_id}.reserved_unit_count == 0"
            - "DriveCycle.${cycle_id}.total_items_on_hand == 3"

      - name: submit_then_cancel_purchase_order_conserves_donated_cents
        grounds:
          - calculations.cash_conservation
          - calculations.purchase_funding_waterfall
          - state_machines.PurchaseOrder.DRAFT_to_SUBMITTED
          - state_machines.PurchaseOrder.SUBMITTED_to_CANCELLED
          - entities.PurchaseOrder.fields.funding_allocations
          - entities.CashDonation.fields.allocated_cents
        distinguishing_aspect: |
          Conserved quantity #2 is a different kind entirely, CENTS of donated cash in
          one cycle: the waterfall draws 30000 from the item-restricted gift and 35163
          from the unrestricted gift, and the cancellation replays that ledger in reverse
          so every gift returns to allocated_cents 0 and the cycle's
          cash_received_cents 120000 is again fully available.
        test_recipe:
          setup:
            - "The COLLECTING cycle holds three gifts: 30000 cents restricted to backpacks (oldest), 50000 cents unrestricted, and 40000 cents restricted to Lincoln Elementary."
            - "A DRAFT purchase order for a 40-unit backpack gap costs 65163 cents (42 units, 60900 subtotal, 4263 fee)."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Lincoln Elementary", district_code: "D7", title_i_pct: 0.80, enrollment_count: 400, max_concurrent_seats: 120 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { school_id: $.data.id }
            - call: "POST /supply-items"
              payload: { sku: "BPK-01", name: "Standard backpack", category: "BACKPACK", unit_cost_cents: 1450, bulk_pack_size: 6 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { backpack_id: $.data.id }
            - call: "POST /drive-cycles"
              payload: { name: "Back-to-School 2026", cadence: "BACK_TO_SCHOOL", window_start: "2026-07-01T00:00:00Z", window_end: "2026-09-30T23:59:59Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { cycle_id: $.data.id }
            - call: "PATCH /drive-cycles/${cycle_id}/status"
              payload: { target_status: "COLLECTING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /cash-donations"
              payload: { drive_cycle_id: "${cycle_id}", donor_name: "Backpack Fund", amount_cents: 30000, restriction_type: "ITEM_RESTRICTED", restricted_supply_item_id: "${backpack_id}" }
              as: DonorRelations
              as_user_id: "dr-1"
              captures: { d1_id: $.data.id }
            - call: "POST /cash-donations"
              payload: { drive_cycle_id: "${cycle_id}", donor_name: "Acme Corp", amount_cents: 50000, restriction_type: "UNRESTRICTED" }
              as: DonorRelations
              as_user_id: "dr-1"
              captures: { d2_id: $.data.id }
            - call: "POST /cash-donations"
              payload: { drive_cycle_id: "${cycle_id}", donor_name: "Lincoln PTA", amount_cents: 40000, restriction_type: "SCHOOL_RESTRICTED", restricted_school_id: "${school_id}" }
              as: DonorRelations
              as_user_id: "dr-1"
              captures: { d3_id: $.data.id }
            - call: "POST /purchase-orders"
              payload: { drive_cycle_id: "${cycle_id}", supply_item_id: "${backpack_id}", requested_unit_gap: 40 }
              as: WarehouseLead
              as_user_id: "wl-1"
              captures: { po_id: $.data.id, total: $.data.total_cost_cents }
          trigger:
            - call: "GET /drive-cycles/${cycle_id}"
              payload: {}
              as: WarehouseLead
              as_user_id: "wl-1"
              captures: { cyc_v1: $.data.version }
            - call: "POST /purchase-orders/${po_id}/transitions"
              payload: { target_status: "SUBMITTED", expected_drive_cycle_version: "${cyc_v1}" }
              as: WarehouseLead
              as_user_id: "wl-1"
              captures: { sub_status: $.data.status }
            - call: "GET /cash-donations/${d2_id}"
              payload: {}
              as: DonorRelations
              as_user_id: "dr-1"
              captures: { d2_alloc_mid: $.data.allocated_cents, d2_status_mid: $.data.status }
            - call: "GET /drive-cycles/${cycle_id}"
              payload: {}
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { cyc_v2: $.data.version }
            - call: "POST /purchase-orders/${po_id}/transitions"
              payload: { target_status: "CANCELLED", expected_drive_cycle_version: "${cyc_v2}" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { cancel_status: $.data.status }
          assert:
            - "PurchaseOrder.${po_id}.ordered_qty == 42"
            - "PurchaseOrder.${po_id}.line_subtotal_cents == 60900"
            - "PurchaseOrder.${po_id}.admin_fee_cents == 4263"
            - "PurchaseOrder.${po_id}.total_cost_cents == 65163"
            - "After SUBMITTED: CashDonation.${d1_id}.allocated_cents == 30000 and status == FULLY_ALLOCATED"
            - "After SUBMITTED: CashDonation.${d2_id}.allocated_cents == 35163, available_cents == 14837, status == PARTIALLY_ALLOCATED"
            - "After SUBMITTED: CashDonation.${d3_id}.allocated_cents == 0 (SCHOOL_RESTRICTED gifts never fund a cycle-level order)"
            - "After SUBMITTED: DriveCycle.${cycle_id}.cash_allocated_cents == 65163 and cash_available_cents == 54837"
            - "After CANCELLED: CashDonation.${d1_id}.allocated_cents == 0 and status == RECEIVED"
            - "After CANCELLED: CashDonation.${d2_id}.allocated_cents == 0 and status == RECEIVED"
            - "After CANCELLED: DriveCycle.${cycle_id}.cash_received_cents == 120000, cash_allocated_cents == 0, cash_available_cents == 120000"
            - "PurchaseOrder.${po_id}.status == CANCELLED and funding_allocations == []"
