  - section: calculations
    instances:

      - name: processing_fee_band_boundaries_are_inclusive_on_both_edges
        claim_type: correct_result
        grounds: [calculations.calc_contribution_processing_fee, entities.Contribution.fields.processing_fee_cents]
        distinguishing_aspect: "Band selection is by AVERAGE rate on the whole gross, not marginal, and both comparisons are inclusive, so 99999/100000 and 999999/1000000 must land in different bands with a non-monotonic fee jump that a marginal implementation cannot reproduce."
        test_recipe:
          setup:
            - "A FOR_PROFIT_LLC collective (deductibility disabled, so deductible_amount_cents is 0 everywhere and cannot mask a fee error)."
            - "One OPEN tier and one donor."
            - "Four settled contributions at the two band edges: 99999, 100000, 999999 and 1000000."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Fee Band Collective", institution_name: "Fee Institution", institution_ipeds_code: "022400", home_state_code: "TX", association_ruleset: "NCAA_2024", entity_structure: "FOR_PROFIT_LLC" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T1", tier_name: "Fee Base", annual_dues_cents: 10000, benefit_rank: 1 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Fee Donor", email: "fee@example.com" }
              as: CollectiveDirector
              captures: { donor_id: $.data.id }
          trigger:
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 99999, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "APPROVE" }
              as: TreasuryOfficer
              captures: { fee_a: $.data.processing_fee_cents, net_a: $.data.net_amount_cents, ded_a: $.data.deductible_amount_cents }
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 100000, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "APPROVE" }
              as: TreasuryOfficer
              captures: { fee_b: $.data.processing_fee_cents, net_b: $.data.net_amount_cents }
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 999999, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "APPROVE" }
              as: TreasuryOfficer
              captures: { fee_c: $.data.processing_fee_cents, net_c: $.data.net_amount_cents }
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 1000000, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "APPROVE" }
              as: TreasuryOfficer
              captures: { fee_d: $.data.processing_fee_cents, net_d: $.data.net_amount_cents }
          assert:
            - "${fee_a} == 2930"
            - "${net_a} == 97069"
            - "${fee_b} == 2530"
            - "${net_b} == 97470"
            - "${fee_c} == 25030"
            - "${net_c} == 974969"
            - "${fee_d} == 21000"
            - "${net_d} == 979000"
            - "${fee_a} > ${fee_b}, so one extra cent of gross at the band-1 edge lowers the fee by 400 cents."
            - "${ded_a} == 0"
            - "Collective.${col_id}.settled_net_funds_cents == 2148508"

      - name: pending_and_failed_contributions_excluded_from_settled_net_funds
        claim_type: input_set_filtering
        grounds: [calculations.calc_collective_funding_posture.input_set, entities.Collective.fields.settled_net_funds_cents, state_machines.sm_contribution_status]
        distinguishing_aspect: "Only SETTLED contributions feed settled_net_funds_cents; a PENDING (DEFER) row and a FAILED (DECLINE) row of much larger gross amounts must contribute exactly nothing and must carry zeroed fee and net."
        test_recipe:
          setup:
            - "One collective, one OPEN tier, one donor."
            - "Three contributions on the same donor: 100000 APPROVE (settles, net 97470), 200000 DEFER (stays PENDING), 300000 DECLINE (moves to FAILED)."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Filter Collective", institution_name: "Filter Institution", institution_ipeds_code: "022500", home_state_code: "CA", association_ruleset: "NCAA_2026" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
