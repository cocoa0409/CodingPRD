      - name: demote_floor_cn1_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=22]", "errors[ERR_CANNOT_DEMOTE_FLOOR]"]
        distinguishing_aspect: "Closing a review with DEMOTE for a CN_I nurse returns ERR_CANNOT_DEMOTE_FLOOR."
        test_recipe:
          setup: ["Nurse DF1 at CN_I with OPEN review"]
          setup_api_calls:
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-DF1", full_name: "Df One", hire_date: "2020-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { df1_id: $.data.id }
