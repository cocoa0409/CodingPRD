  # ===========================================================================
  # Rule 6 — boundary_precision_check
  # Each instance pins an inclusive/exclusive edge with the adjacent value on the
  # other side, so an off-by-one implementation cannot pass.
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: barcode_epoch_skew_floor_is_inclusive_and_one_epoch_older_is_refused
        grounds:
          - calculations.rotating_barcode_token
          - validations[priority=21]
          - errors.ERR_BARCODE_EPOCH_INVALID
          - endpoints[GET /tickets/{id}/barcode]
        distinguishing_aspect: |
          The accepted epoch window is the CLOSED range
          [now_epoch - SKEW_TOLERANCE_EPOCHS, now_epoch] with
          BARCODE_ROTATION_SECONDS 30 and SKEW_TOLERANCE_EPOCHS 1. Three presentations
          pin all three edges against anchor 2026-09-12T18:00:00Z: epoch 20 at now_epoch
          21 (exactly the floor → accepted), epoch 20 at now_epoch 22 (one below the floor
          → refused), and epoch 22 at now_epoch 22 (exactly the ceiling → accepted). An
          implementation using a half-open window, a tolerance of 0, or a tolerance of 2
          fails at least one of the three.
        test_recipe:
          setup:
            - "Event DOORS_OPEN with barcode_anchor_at 2026-09-12T18:00:00Z; AccessZone GA1 (fire_code_capacity 200); Gate G1; ONLINE ScanSession open."
