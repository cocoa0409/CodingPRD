            - "GET /carriage/distributors/${dc_id} afterwards returns receivable_balance_cents == 0 and status == \"ACTIVE\""
            - "a third RECORD_PAYMENT of 1 returns 422 with data.error_id == \"ERR_INVALID_INVOICE_STATE\""

      - name: waived_blackout_rule_rejects_later_enforce
        claim_type: terminal_state_lockdown
        grounds:
          - errors[ERR_INVALID_BLACKOUT_STATE]
          - entities.BlackoutRule.fields.status
          - endpoints[POST /carriage/blackout-rules/{blackoutRuleId}/lifecycle]
        distinguishing_aspect: >-
          ENFORCE and WAIVE are legal only from SCHEDULED, so once a rule is WAIVED a
          follow-up ENFORCE is 422 ERR_INVALID_BLACKOUT_STATE and enforced_at stays
          null — a waived blackout can never be resurrected.
        test_recipe:
          setup:
            - "One executed agreement, one OWNED_CLEARED substitute title, and one SCHEDULED blackout rule of 4 hours in US territory."
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Meridian Broadband"
                distributor_type: "CABLE_MSO"
                rate_card_class: "CLASS_A"
