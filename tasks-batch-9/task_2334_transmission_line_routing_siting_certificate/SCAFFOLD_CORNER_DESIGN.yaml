              payload: { disposition: "DISMISS", disposition_note: "Alignment already avoids the school parcel" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
          assert:
            - "response.status == 201"
            - "PublicComment.${cmt1}.status == DISMISSED"
            - "PublicComment.${cmt1}.disposition_note == Alignment already avoids the school parcel"
            - "RouteSegment.${seg1}.material_comment_count == 0"
            - "RouteSegment.${seg1}.survey_status == FIELD_VERIFIED"
            - "Route.${routeA}.status == PUBLISHED_FOR_COMMENT"
            - "Route.${routeA}.refinement_round == 0"

      - name: certificate_conditions_read_back_in_order_supplied
        claim_type: computed_read
        grounds:
          - endpoints[GET /siting/certificates/{certificateId}/conditions].description
          - endpoints[POST /siting/applications/{applicationId}/decision].input_notes
        distinguishing_aspect: "The order's conditions array is materialised in array order and read back created_at ASC, and each constraint_kind keeps only its own extra fields: blackout dates on the SEASONAL_BLACKOUT row, crew_limit on the CREW_LIMIT row, neither on MONITORING."
        test_recipe:
          setup:
            - "Certificate ISSUED with the three conditions supplied by the order in the sequence ENV-BLACKOUT-1, CUL-MON-1, ENG-CREW-1"
          setup_api_calls: *cCERT
          trigger:
            - call: "GET /siting/certificate-conditions"
              payload: { certificate_id: "${cert}" }
              as: ComplianceMonitor
              as_user_id: "monitor-abe"
              captures: { cond_first: "$.data[0].id" }
          assert:
            - "response.status == 200"
            - "response.meta.total_count == 3"
            - "response.data[0].code == ENV-BLACKOUT-1"
            - "response.data[0].blackout_start_mmdd == 04-01"
            - "response.data[0].crew_limit == null"
            - "response.data[1].code == CUL-MON-1"
            - "response.data[1].blackout_start_mmdd == null"
            - "response.data[2].code == ENG-CREW-1"
            - "response.data[2].crew_limit == 9"
            - "response.data[2].status == ACTIVE"

      - name: activity_cancellation_releases_the_committed_crew
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /siting/construction-activities/{activityId}/cancellation].side_effects
          - state_machines.ConstructionActivity.SCHEDULED_to_CANCELLED
        distinguishing_aspect: "Cancellation from SCHEDULED is the compensating path for a never-started activity: the row goes to CANCELLED, the segment's committed_crew_count returns to 0 and construction_state stays PENDING because no work ever began."
        test_recipe:
          setup:
            - "Certificate ISSUED/ACTIVE with a SCHEDULED crew-6 CLEARING activity on segment 2"
          setup_api_calls: *cCERT
          trigger:
            - call: "POST /siting/construction-activities"
              payload: { certificate_id: "${cert}", segment_id: "${seg2}", activity_kind: "CLEARING", crew_count: 6, window_start_at: "2027-09-01T00:00:00Z", window_end_at: "2027-09-10T00:00:00Z" }
              as: Developer
              as_user_id: "dev-nora"
              captures: { act_c: "$.data.id" }
            - call: "POST /siting/construction-activities/${act_c}/cancellation"
              payload: { cancellation_reason: "Crew reassigned to the water crossing" }
              as: Developer
              as_user_id: "dev-nora"
          assert:
            - "response.status == 201"
            - "ConstructionActivity.${act_c}.status == CANCELLED"
            - "ConstructionActivity.${act_c}.started_at == null"
            - "RouteSegment.${seg2}.committed_crew_count == 0"
            - "RouteSegment.${seg2}.construction_state == PENDING"
            - "Project.${proj}.stage == CERTIFICATED"

      - name: federal_permit_issuance_reaches_the_terminal_permit_state
        claim_type: conditional_action
        grounds:
          - endpoints[POST /siting/route-segments/{segmentId}/federal-permit-actions]
          - state_machines.RouteSegment.APPLIED_to_ISSUED
        distinguishing_aspect: "The permit dimension is driven only by the FederalPermitOfficer and only through APPLY then ISSUE: issuing on the applied waterway crossing records USACE and lands in ISSUED, one of the two terminal permit states."
        test_recipe:
          setup:
            - "Segment 2 crosses a NAVIGABLE_WATERWAY with an APPLIED USACE permit"
          setup_api_calls:
            - *c01
            - *c08
            - *c09
            - *c10
            - *c36
          trigger:
            - call: "POST /siting/route-segments/${seg2}/federal-permit-actions"
              payload: { action: "ISSUE", determination_note: "Section 10 authorization granted" }
              as: FederalPermitOfficer
              as_user_id: "fed-owen"
          assert:
            - "response.status == 201"
            - "RouteSegment.${seg2}.federal_permit_status == ISSUED"
            - "RouteSegment.${seg2}.federal_permit_agency == USACE"
            - "RouteSegment.${seg1}.federal_permit_status == NOT_REQUIRED"

