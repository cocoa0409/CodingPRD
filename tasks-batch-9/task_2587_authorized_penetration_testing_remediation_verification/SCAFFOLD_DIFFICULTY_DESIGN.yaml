              as: Tester
              as_user_id: "${t1_id}"
              captures: { fx_id: $.data.id, fx_score: $.data.severity_score, fx_band: $.data.severity_band, fx_points: $.data.severity_points }
            - call: "GET /pentest/engagements/${eng_id}"
              payload: {}
              as: Tester
              as_user_id: "${t1_id}"
              captures: { eng_v_c: $.data.version }
            - call: "POST /pentest/findings"
              payload: { engagement_id: "${eng_id}", asset_id: "${asset_a_id}", title: "Internal debug endpoint returns configuration", reproduction_steps: "1. From the internal VLAN GET /debug/config 2. Observe secrets", business_impact_narrative: "Internal staff can read gateway credentials", technical_base_score: 4.00, exposure_class: "INTERNAL", root_cause_theme: "SECRETS_HANDLING", expected_engagement_version: "${eng_v_c}" }
              as: Tester
              as_user_id: "${t1_id}"
              captures: { fy_id: $.data.id, fy_score: $.data.severity_score, fy_band: $.data.severity_band, fy_points: $.data.severity_points }
          assert:
            - "${fx_score} == 9.90 — 8.00*1.15 = 9.20, then +0.50 tier, then +0.20 regime; it is NOT 10.00, which is what (8.00+0.50+0.20)*1.15 = 10.005 clamped would produce"
            - "${fx_band} == CRITICAL and ${fx_points} == 40"
            - "Finding.${fx_id}.immediate_action_required == true"
            - "${fy_score} == 4.50 — 4.00*0.95 = 3.80, then +0.70 of bonuses; it is NOT 4.47, which is round((4.00+0.70)*0.95, 2)"
            - "${fy_band} == MEDIUM and ${fy_points} == 8"
