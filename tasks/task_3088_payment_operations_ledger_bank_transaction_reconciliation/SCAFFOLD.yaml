  - 'AuditEvent appended: action=statement_line.added'
- method: POST
  path: /bank-statements/{id}/reconcile
  description: Run reconciliation_variance under this statement's algorithm and fall through to RECONCILED or DISCREPANCY
  roles:
  - PaymentOpsAnalyst
  - LedgerController
  code: 200
  input:
  - expected_statement_version
  output: BankStatement
  side_effects:
  - Runs reconciliation_variance and refreshes matched_posted_cents and unmatched_amount_cents
  - status = RECONCILED when unmatched_amount_cents == 0, else status = DISCREPANCY
  - Creates an ExceptionItem of kind STATEMENT_VARIANCE when a variance remains
  - increments BankStatement.version by 1
  - 'AuditEvent appended: action=bank_statement.reconciled'
- method: POST
  path: /bank-statements/{id}/revise
  description: Create the next revision of a statement that is in DISCREPANCY
  roles:
  - PaymentOpsAnalyst
  - LedgerController
  code: 201
  input:
  - expected_statement_version
  - institution_ref
  - cycle_date
  - opening_balance_cents
  - closing_balance_cents
  output: BankStatement
  side_effects:
  - A new BankStatement row is created with revision_number = predecessor.revision_number + 1
  - Predecessor status becomes REVISED and its STATEMENT_VARIANCE exception is resolved
  - increments the predecessor's version by 1
  - 'AuditEvent appended: action=bank_statement.revised'
- method: POST
  path: /payment-orders
  description: Create a payment order; resolves the rail cutoffs, checks rail/account compatibility, the velocity
    limit and both duplicate guards
  roles:
  - PaymentInitiator
  code: 201
  input:
  - legal_entity_id
  - ledger_id
  - counterparty_id
  - source_account_id
  - rail
  - direction
  - amount_cents
  - settlement_speed?
  - idempotency_key
  - requested_release_utc?
  - payable_to_name?
  output: PaymentOrder
  side_effects:
  - status = PENDING_APPROVAL, settlement_status = UNSETTLED, initiator_user_id = X-User-ID
  - Runs rail_cutoff_resolution to populate cutoffs and cutoff_snapshot_utc
  - Registers the duplicate signature for payment_dup_window
  - 'AuditEvent appended: action=payment_order.created'
- method: GET
  path: /payment-orders/{id}
  description: Read one payment order including both state dimensions and the resolved cutoffs
  roles:
