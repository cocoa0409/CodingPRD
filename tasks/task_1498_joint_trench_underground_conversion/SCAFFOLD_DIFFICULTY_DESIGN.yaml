# =============================================================================
# task_1498 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x >=2 instances = 20 instances. All literals pre-computed from the
# formulas in SCAFFOLD.yaml §1.3 (verified by executing the formulas as code).
# Clock default 2026-08-01T00:00:00Z unless a call sets it.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_share_divergence
        grounds:
          - calculations.provisional_cost_share
          - calculations.final_trueup_allocation
          - entities.UtilityParticipation.fields.provisional_share_cents
          - entities.TrueUpRun.fields.lines
        distinguishing_aspect: |
          Entity domain = cost accounting on UtilityParticipation. Same participation
          data valued twice: provisional variant (estimate 1000001, bp 3333) gives
          P2 333300; the final variant (joint actuals 900000, Rule-20 credit 200000
          waterfall, exclusive 50000) gives P2 349970. The two variants diverge.
        test_recipe:
          setup:
            - "3-party project (bp 3333/3333/3334, estimate 1000001, credit 200000) driven through the full lifecycle to RECONCILIATION with one segment closed, one conversion complete, all three participations INSTALLED, and actuals 900000 JOINT_TRENCH + 50000 EXCLUSIVE on P2 posted"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "Rule20 Alpha", rule20_credit_cents: 200000, estimated_total_cost_cents: 1000001, target_cutover_on: "2026-12-31T00:00:00Z", contingency_days: 0 }, as: ProgramManager, captures: { proj: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U-Elec", utility_type: ELECTRIC, cost_share_bp: 3333, sequence_order: 1, has_separation_waiver: false }, as: ProgramManager, captures: { p1: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U-Tel", utility_type: TELECOM, cost_share_bp: 3333, sequence_order: 2, has_separation_waiver: false }, as: ProgramManager, captures: { p2: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U-Catv", utility_type: CATV, cost_share_bp: 3334, sequence_order: 3, has_separation_waiver: false }, as: ProgramManager, captures: { p3: "$.data.id" } }
            - { call: "POST /api/participations/${p1}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p1}" }
            - { call: "POST /api/participations/${p2}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p2}" }
            - { call: "POST /api/participations/${p3}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p3}" }
            - { call: "POST /api/projects/${proj}/lifecycle", payload: { action: MOBILIZE }, as: ProgramManager }
            - { call: "POST /api/parcels", payload: { project_id: "${proj}", address: "1 Main St", owner_name: "Owner One", existing_panel_amps: 200, load_calc_amps: 100 }, as: RightOfWayAgent, captures: { parcel: "$.data.id" } }
            - { call: "POST /api/easements", payload: { parcel_id: "${parcel}", easement_type: TRENCH }, as: RightOfWayAgent, captures: { es: "$.data.id" } }
            - { call: "POST /api/easements/${es}/transition", payload: { to: REQUESTED }, as: RightOfWayAgent }
            - { call: "POST /api/easements/${es}/transition", payload: { to: SIGNED }, as: RightOfWayAgent }
            - { call: "POST /api/easements/${es}/transition", payload: { to: RECORDED }, as: RightOfWayAgent }
            - { call: "POST /api/permits", payload: { project_id: "${proj}", permit_type: ENCROACHMENT, valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-12-31T00:00:00Z" }, as: RightOfWayAgent, captures: { perm: "$.data.id" } }
            - { call: "POST /api/permits/${perm}/transition", payload: { to: SUBMITTED }, as: RightOfWayAgent }
            - { call: "POST /api/permits/${perm}/transition", payload: { to: ISSUED }, as: RightOfWayAgent }
            - { call: "POST /api/trench-segments", payload: { project_id: "${proj}", segment_code: "SEG-1", length_ft: 500, max_depth_inches: 60, parcel_ids: ["${parcel}"] }, as: ProgramManager, captures: { seg: "$.data.id", seg_v: "$.data.version" } }
            - { call: "POST /api/trench-segments/${seg}/schedule", payload: { excavation_start_on: "2026-09-01T00:00:00Z", excavation_end_on: "2026-09-10T00:00:00Z", expected_trench_segment_version: "${seg_v}" }, as: ProgramManager }
            - { call: "POST /api/projects/${proj}/lifecycle", payload: { action: START_TRENCHING }, as: ProgramManager }
            - { call: "POST /api/trench-segments/${seg}/transition", payload: { to: EXCAVATING }, as: ProgramManager }
            - { call: "POST /api/occupancy-slots", payload: { trench_segment_id: "${seg}", participation_id: "${p1}", depth_top_inches: 36, depth_bottom_inches: 60, install_start_at: "2026-09-01T00:00:00Z", install_end_at: "2026-09-03T00:00:00Z" }, as: UtilityCoordinator, as_user_id: "${p1}", captures: { s1: "$.data.id" } }
            - { call: "POST /api/occupancy-slots", payload: { trench_segment_id: "${seg}", participation_id: "${p2}", depth_top_inches: 12, depth_bottom_inches: 24, install_start_at: "2026-09-03T00:00:00Z", install_end_at: "2026-09-05T00:00:00Z" }, as: UtilityCoordinator, as_user_id: "${p2}", captures: { s2: "$.data.id" } }
            - { call: "POST /api/occupancy-slots/${s1}/transition", payload: { to: INSTALLING }, as: UtilityCoordinator, as_user_id: "${p1}" }
            - { call: "POST /api/occupancy-slots/${s1}/transition", payload: { to: INSTALLED }, as: UtilityCoordinator, as_user_id: "${p1}" }
            - { call: "POST /api/occupancy-slots/${s1}/transition", payload: { to: VERIFIED }, as: ProgramManager }
            - { call: "POST /api/occupancy-slots/${s2}/transition", payload: { to: INSTALLING }, as: UtilityCoordinator, as_user_id: "${p2}" }
            - { call: "POST /api/occupancy-slots/${s2}/transition", payload: { to: INSTALLED }, as: UtilityCoordinator, as_user_id: "${p2}" }
            - { call: "POST /api/occupancy-slots/${s2}/transition", payload: { to: VERIFIED }, as: ProgramManager }
            - { call: "POST /api/participations/${p1}/transition", payload: { to: INSTALLED }, as: UtilityCoordinator, as_user_id: "${p1}" }
            - { call: "POST /api/participations/${p2}/transition", payload: { to: INSTALLED }, as: UtilityCoordinator, as_user_id: "${p2}" }
            - { call: "POST /api/participations/${p3}/transition", payload: { to: INSTALLED }, as: UtilityCoordinator, as_user_id: "${p3}" }
            - { call: "POST /api/trench-segments/${seg}/transition", payload: { to: BACKFILLING }, as: ProgramManager }
            - { call: "POST /api/trench-segments/${seg}/transition", payload: { to: BACKFILLED }, as: ProgramManager }
            - { call: "POST /api/service-conversions", payload: { parcel_id: "${parcel}", project_id: "${proj}" }, as: ConversionContractor, captures: { conv: "$.data.id" } }
            - { call: "POST /api/service-conversions/${conv}/work-transition", payload: { to: ROUGH_IN }, as: ConversionContractor }
            - { call: "POST /api/service-conversions/${conv}/work-transition", payload: { to: PANEL_SET, panel_capacity_amps: 125 }, as: ConversionContractor }
            - { call: "POST /api/service-conversions/${conv}/work-transition", payload: { to: READY_TO_ENERGIZE }, as: ConversionContractor }
            - { call: "POST /api/service-conversions/${conv}/work-transition", payload: { to: ENERGIZED }, as: ConversionContractor }
            - { call: "POST /api/service-conversions/${conv}/work-transition", payload: { to: INSPECTED, outcome: PASS }, as: ConversionContractor }
            - { call: "POST /api/service-conversions/${conv}/work-transition", payload: { to: COMPLETE }, as: ConversionContractor }
            - { call: "POST /api/restoration-tasks", payload: { trench_segment_id: "${seg}", parcel_id: "${parcel}", task_type: HARDSCAPE }, as: ConversionContractor, captures: { rt: "$.data.id" } }
            - { call: "POST /api/restoration-tasks/${rt}/transition", payload: { to: IN_WORK }, as: ConversionContractor }
            - { call: "POST /api/restoration-tasks/${rt}/transition", payload: { to: COMPLETE }, as: ConversionContractor }
            - { call: "POST /api/restoration-tasks/${rt}/transition", payload: { to: ACCEPTED }, as: ProgramManager }
            - { call: "POST /api/trench-segments/${seg}/transition", payload: { to: CLOSED }, as: ProgramManager }
            - { call: "POST /api/projects/${proj}/lifecycle", payload: { action: START_CONVERSION }, as: ProgramManager }
            - { call: "POST /api/projects/${proj}/lifecycle", payload: { action: START_RECONCILIATION }, as: ProgramManager }
            - { call: "POST /api/actual-cost-entries", payload: { project_id: "${proj}", cost_code: JOINT_TRENCH, amount_cents: 900000, incurred_on: "2026-09-20T00:00:00Z" }, as: FinanceAnalyst, as_user_id: "fin-1" }
            - { call: "POST /api/actual-cost-entries", payload: { project_id: "${proj}", cost_code: EXCLUSIVE, participation_id: "${p2}", amount_cents: 50000, incurred_on: "2026-09-21T00:00:00Z" }, as: FinanceAnalyst, as_user_id: "fin-1" }
            - { call: "GET /api/participations/${p2}", payload: {}, as: ProgramManager, captures: { p2_prov: "$.data.provisional_share_cents" } }
            - { call: "GET /api/projects/${proj}", payload: {}, as: ProgramManager, captures: { pv: "$.data.version" } }
            - { call: "POST /api/true-up-runs", payload: { project_id: "${proj}", expected_project_version: "${pv}" }, as: FinanceAnalyst, as_user_id: "fin-1", captures: { run: "$.data.id" } }
            - { call: "POST /api/true-up-runs/${run}/transition", payload: { to: PUBLISHED }, as: ProgramManager, as_user_id: "pm-1" }
          trigger:
            - { call: "GET /api/true-up-runs/${run}", payload: {}, as: FinanceAnalyst, captures: { run_lines: "$.data.lines", run_total: "$.data.total_actual_cost_cents", run_credit: "$.data.rule20_credit_applied_cents" } }
            - { call: "GET /api/invoices?true_up_run_id=${run}", payload: {}, as: ProgramManager, captures: { inv0_principal: "$.data[0].principal_cents", inv0_part: "$.data[0].participation_id" } }
          assert:
            - "captured p2_prov == 333300 (provisional variant on the estimate)"
            - "run_lines entry for ${p2}: gross_share_cents == 299970, credit_cents == 0, exclusive_cents == 50000, final_share_cents == 349970, delta_cents == 16670"
            - "run_lines entry for ${p1}: gross_share_cents == 299970, credit_cents == 200000, final_share_cents == 99970, delta_cents == -233331, refund_cents == 233331"
            - "run_lines entry for ${p3}: gross_share_cents == 300060, credit_cents == 0, final_share_cents == 300060, delta_cents == -33340"
            - "run_total == 950000 and run_credit == 200000"
            - "333300 != 349970 — identical participation data, different variants, different money"
            - "exactly one invoice exists for the run; inv0_part == ${p2} and inv0_principal == 16670 (negative deltas produce refunds, not invoices)"
      - name: waiver_vs_standard_separation_variant
        grounds:
          - calculations.depth_separation_requirement
          - entities.OccupancySlot.fields.depth_top_inches
          - entities.UtilityParticipation.fields.has_separation_waiver
        distinguishing_aspect: |
          Entity domain = trench geometry on OccupancySlot (distinct from the
          cost-share domain of the sibling instance). Identical band geometry
          ([12,24) under [30,42), gap 6) is ADMITTED when both participants are
          non-electric with waivers (required 6) and REJECTED when either lacks
          the waiver (required 12).
        test_recipe:
          setup:
            - "4-party mobilized project (bp 2500 x4): P2 TELECOM waiver=true, P3 CATV waiver=true, P4 CATV waiver=false; two scheduled segments SEG-A/SEG-B, excavation 2026-09-01..2026-09-10"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "Waiver Project", rule20_credit_cents: 0, estimated_total_cost_cents: 4000000, target_cutover_on: "2026-12-31T00:00:00Z", contingency_days: 0 }, as: ProgramManager, captures: { proj: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U-E", utility_type: ELECTRIC, cost_share_bp: 2500, sequence_order: 1, has_separation_waiver: false }, as: ProgramManager, captures: { p1: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U-T", utility_type: TELECOM, cost_share_bp: 2500, sequence_order: 2, has_separation_waiver: true }, as: ProgramManager, captures: { p2: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U-C1", utility_type: CATV, cost_share_bp: 2500, sequence_order: 3, has_separation_waiver: true }, as: ProgramManager, captures: { p3: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U-C2", utility_type: CATV, cost_share_bp: 2500, sequence_order: 4, has_separation_waiver: false }, as: ProgramManager, captures: { p4: "$.data.id" } }
            - { call: "POST /api/participations/${p1}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p1}" }
            - { call: "POST /api/participations/${p2}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p2}" }
            - { call: "POST /api/participations/${p3}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p3}" }
            - { call: "POST /api/participations/${p4}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p4}" }
            - { call: "POST /api/projects/${proj}/lifecycle", payload: { action: MOBILIZE }, as: ProgramManager }
            - { call: "POST /api/trench-segments", payload: { project_id: "${proj}", segment_code: "SEG-A", length_ft: 300, max_depth_inches: 60 }, as: ProgramManager, captures: { segA: "$.data.id", segA_v: "$.data.version" } }
            - { call: "POST /api/trench-segments/${segA}/schedule", payload: { excavation_start_on: "2026-09-01T00:00:00Z", excavation_end_on: "2026-09-10T00:00:00Z", expected_trench_segment_version: "${segA_v}" }, as: ProgramManager }
            - { call: "POST /api/trench-segments", payload: { project_id: "${proj}", segment_code: "SEG-B", length_ft: 300, max_depth_inches: 60 }, as: ProgramManager, captures: { segB: "$.data.id", segB_v: "$.data.version" } }
            - { call: "POST /api/trench-segments/${segB}/schedule", payload: { excavation_start_on: "2026-09-01T00:00:00Z", excavation_end_on: "2026-09-10T00:00:00Z", expected_trench_segment_version: "${segB_v}" }, as: ProgramManager }
          trigger:
            - { call: "POST /api/occupancy-slots", payload: { trench_segment_id: "${segA}", participation_id: "${p2}", depth_top_inches: 30, depth_bottom_inches: 42, install_start_at: "2026-09-01T00:00:00Z", install_end_at: "2026-09-03T00:00:00Z" }, as: UtilityCoordinator, as_user_id: "${p2}", captures: { sA_tel: "$.data.id" } }
            - { call: "POST /api/occupancy-slots", payload: { trench_segment_id: "${segA}", participation_id: "${p3}", depth_top_inches: 12, depth_bottom_inches: 24, install_start_at: "2026-09-03T00:00:00Z", install_end_at: "2026-09-05T00:00:00Z" }, as: UtilityCoordinator, as_user_id: "${p3}", captures: { sA_catv: "$.data.id" } }
            - { call: "POST /api/occupancy-slots", payload: { trench_segment_id: "${segB}", participation_id: "${p2}", depth_top_inches: 30, depth_bottom_inches: 42, install_start_at: "2026-09-01T00:00:00Z", install_end_at: "2026-09-03T00:00:00Z" }, as: UtilityCoordinator, as_user_id: "${p2}", captures: { sB_tel: "$.data.id" } }
            - { call: "POST /api/occupancy-slots", payload: { trench_segment_id: "${segB}", participation_id: "${p4}", depth_top_inches: 12, depth_bottom_inches: 24, install_start_at: "2026-09-03T00:00:00Z", install_end_at: "2026-09-05T00:00:00Z" }, as: UtilityCoordinator, as_user_id: "${p4}", captures: { err: "$.data.error_id" } }
          assert:
            - "SEG-A: both slots created (waiver pair, gap 6 >= 6 required); ${sA_catv} exists with status RESERVED"
            - "SEG-B: P4 slot rejected — err == ERR_MIN_SEPARATION_VIOLATION (same gap 6 < 12 standard, because P4 has no waiver)"
            - "identical geometry, opposite outcomes; the waiver flag selects the variant"
  # ---------------------------------------------------------------- rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: provisional_share_rounding_remainder
        grounds:
          - calculations.provisional_cost_share
          - entities.UtilityParticipation.fields.provisional_share_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the pinned order is round-per-participant FIRST,
          then reconcile the remainder cent-by-cent in sequence_order. With
          T=1000001 and bp 3333/3333/3334 the raw rounded shares sum to 1000000,
          so the +1 cent remainder lands on sequence_order 1 (333301/333300/333400);
          sum-then-round would instead give 333300/333300/333401.
        test_recipe:
          setup:
            - "3-party project, estimate 1000001, bp 3333/3333/3334 (seq 1..3), all COMMITTED, then MOBILIZE"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "Rounding Project", rule20_credit_cents: 0, estimated_total_cost_cents: 1000001, target_cutover_on: "2026-12-31T00:00:00Z", contingency_days: 0 }, as: ProgramManager, captures: { proj: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U1", utility_type: ELECTRIC, cost_share_bp: 3333, sequence_order: 1 }, as: ProgramManager, captures: { p1: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U2", utility_type: TELECOM, cost_share_bp: 3333, sequence_order: 2 }, as: ProgramManager, captures: { p2: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U3", utility_type: CATV, cost_share_bp: 3334, sequence_order: 3 }, as: ProgramManager, captures: { p3: "$.data.id" } }
            - { call: "POST /api/participations/${p1}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p1}" }
            - { call: "POST /api/participations/${p2}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p2}" }
            - { call: "POST /api/participations/${p3}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p3}" }
            - { call: "POST /api/projects/${proj}/lifecycle", payload: { action: MOBILIZE }, as: ProgramManager }
          trigger:
            - { call: "GET /api/participations/${p1}", payload: {}, as: ProgramManager, captures: { s1: "$.data.provisional_share_cents" } }
            - { call: "GET /api/participations/${p2}", payload: {}, as: ProgramManager, captures: { s2: "$.data.provisional_share_cents" } }
            - { call: "GET /api/participations/${p3}", payload: {}, as: ProgramManager, captures: { s3: "$.data.provisional_share_cents" } }
          assert:
            - "s1 == 333301 (remainder +1 cent to lowest sequence_order)"
            - "s2 == 333300"
            - "s3 == 333400"
            - "s1 + s2 + s3 == 1000001 == estimated_total_cost_cents (conservation after reconciliation)"
      - name: delay_damages_tiered_cap
        grounds:
          - calculations.delay_liquidated_damages
          - entities.Project.fields.liquidated_damages_cents
          - entities.ChangeOrder.fields.delay_cause
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction: per-cause tiered factor
          (EXCUSABLE 0 / MIXED 0.5 / NEGLIGENT 1.0) multiplied by days and rate,
          then floored by max(0, ...-contingency) and capped by min(cap, raw).
          raw 350000 first (cap slack), then raw 2350000 clamps to cap 1000000.
        test_recipe:
          setup:
            - "project estimate 10000000, contingency_days 0; four change orders incorporated in sequence"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "LD Project", rule20_credit_cents: 0, estimated_total_cost_cents: 10000000, target_cutover_on: "2026-12-31T00:00:00Z", contingency_days: 0 }, as: ProgramManager, captures: { proj: "$.data.id" } }
            - { call: "POST /api/change-orders", payload: { project_id: "${proj}", description: "weather" }, as: ProgramManager, captures: { co1: "$.data.id" } }
            - { call: "POST /api/change-orders/${co1}/transition", payload: { to: PRICED, delta_cost_cents: 0, delta_delay_days: 2, delay_cause: EXCUSABLE }, as: ProgramManager }
            - { call: "POST /api/change-orders/${co1}/transition", payload: { to: APPROVED }, as: ProgramManager }
            - { call: "POST /api/change-orders/${co1}/transition", payload: { to: INCORPORATED }, as: ProgramManager }
            - { call: "POST /api/change-orders", payload: { project_id: "${proj}", description: "contractor" }, as: ProgramManager, captures: { co2: "$.data.id" } }
            - { call: "POST /api/change-orders/${co2}/transition", payload: { to: PRICED, delta_cost_cents: 0, delta_delay_days: 5, delay_cause: NEGLIGENT }, as: ProgramManager }
            - { call: "POST /api/change-orders/${co2}/transition", payload: { to: APPROVED }, as: ProgramManager }
            - { call: "POST /api/change-orders/${co2}/transition", payload: { to: INCORPORATED }, as: ProgramManager }
            - { call: "POST /api/change-orders", payload: { project_id: "${proj}", description: "mixed" }, as: ProgramManager, captures: { co3: "$.data.id" } }
            - { call: "POST /api/change-orders/${co3}/transition", payload: { to: PRICED, delta_cost_cents: 0, delta_delay_days: 4, delay_cause: MIXED }, as: ProgramManager }
            - { call: "POST /api/change-orders/${co3}/transition", payload: { to: APPROVED }, as: ProgramManager }
            - { call: "POST /api/change-orders/${co3}/transition", payload: { to: INCORPORATED }, as: ProgramManager }
          trigger:
            - { call: "GET /api/projects/${proj}", payload: {}, as: ProgramManager, captures: { ld1: "$.data.liquidated_damages_cents", delay1: "$.data.cumulative_delay_days" } }
            - { call: "POST /api/change-orders", payload: { project_id: "${proj}", description: "big negligent" }, as: ProgramManager, captures: { co4: "$.data.id" } }
            - { call: "POST /api/change-orders/${co4}/transition", payload: { to: PRICED, delta_cost_cents: 0, delta_delay_days: 40, delay_cause: NEGLIGENT }, as: ProgramManager }
            - { call: "POST /api/change-orders/${co4}/transition", payload: { to: APPROVED }, as: ProgramManager }
            - { call: "POST /api/change-orders/${co4}/transition", payload: { to: INCORPORATED }, as: ProgramManager }
            - { call: "GET /api/projects/${proj}", payload: {}, as: ProgramManager, captures: { ld2: "$.data.liquidated_damages_cents", delay2: "$.data.cumulative_delay_days" } }
          assert:
            - "ld1 == 350000 (billable = 2*0 + 5*1.0 + 4*0.5 = 7 days; 7 * 50000 = 350000; cap 1000000 not binding)"
            - "delay1 == 11"
            - "ld2 == 1000000 (billable 47 * 50000 = 2350000, clamped by min to cap = round_half_up(10000000 * 0.10))"
            - "delay2 == 51"
      - name: late_fee_tier_pinned_on_principal
        grounds:
          - calculations.late_fee_accrual
          - entities.Invoice.fields.late_fee_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: the fee
          tier is keyed on principal_cents ONLY, even though the fee inflates the
          total. principal 9999999 (< 10000000) stays STANDARD even though
          principal+fee = 10149999 crosses the tier threshold; an implementation
          keying the tier on the post-fee total would wrongly return 200000.
        test_recipe:
          setup:
