        as: SecurityDirector
        as_user_id: director-1
      - call: POST /event-security/security-events/${event_id}/after-action-reviews
        payload:
          narrative: doors held twice, one medical handoff, one no-show on the floor post
          corrective_action_count: 3
        as: IncidentCommander
        as_user_id: commander-1
        captures:
          aar_id: $.data.id
      - call: POST /event-security/after-action-reviews/${aar_id}/decision
        payload:
