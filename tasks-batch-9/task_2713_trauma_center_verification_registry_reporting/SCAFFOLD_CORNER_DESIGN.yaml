        distinguishing_aspect: "TraumaProgramManager is entity_backed, so the identity header itself is the authorisation scope: the same request body is accepted when X-User-ID equals the body center_id and refused with 403 ERR_CENTER_SCOPE_VIOLATION when it names a peer center."
