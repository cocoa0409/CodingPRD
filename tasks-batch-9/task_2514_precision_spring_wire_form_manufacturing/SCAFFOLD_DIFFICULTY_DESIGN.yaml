      - name: oven_aggregate_load_exactly_at_capacity_and_closed_interval_touch_on_heat_treat
        boundary_metric: "aggregate oven load in kg, 3 decimal places, compared with capacity_kg strictly (> rejects, == passes), over CLOSED time intervals"
        grounds:
          - calculations.oven_interval_load
          - validations[priority=71]
          - errors.ERR_OVEN_CAPACITY_EXCEEDED
          - entities.StressReliefOven.fields.scheduled_load_kg
          - endpoints["POST /heat-treat-batches"]
        distinguishing_aspect: |
          A fourth metric (mass in kg over closed time intervals) on a fourth endpoint, and it carries TWO
          boundaries at once: the load comparison is strict at exactly capacity (250.000 == 250.0 passes,
          260.000 > 250.0 rejects) and the intervals are CLOSED, so a batch starting at the very instant an
          existing batch ends still collides, while starting one minute later does not. The final call also shows
          that oven.scheduled_load_kg (a plain sum over SCHEDULED/RUNNING batches) may legally exceed capacity_kg
          once the intervals are disjoint, so the capacity rule cannot be implemented against that field.
        test_recipe:
          setup:
            - "Oven OV-3 with capacity_kg 250.0 and max_temp_c 450.0."
            - "An INDUSTRIAL program with an unpeened stainless extension design D2 and a RUNNING 1000-piece run to hang batches on."
            - "One SCHEDULED batch A occupying the closed interval [2026-08-05T06:00Z, 2026-08-05T10:00Z] with load_kg 180.0."
