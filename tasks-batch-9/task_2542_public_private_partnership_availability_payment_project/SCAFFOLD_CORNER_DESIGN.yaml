          A flat topology means every row created through a parent's action path must
          afterwards be a first-class top-level resource: the deduction event minted under
          `/ppp/service-periods/{id}/deduction-events` has to be readable at
          `/ppp/deduction-events/{id}`, and so on for all eleven entities. This instance runs
