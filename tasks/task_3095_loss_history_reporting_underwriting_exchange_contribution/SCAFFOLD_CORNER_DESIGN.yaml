        claim_type: RBAC denial
        grounds:
          - roles.ExchangeComplianceOfficer
          - roles.CarrierDataSteward
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Segregation of duties: the role that contributes claim data (CarrierDataSteward) cannot adjudicate disputes about it — POST /disputes/{id}/resolve from a steward is 403 ERR_UNAUTHORIZED."
        test_recipe:
