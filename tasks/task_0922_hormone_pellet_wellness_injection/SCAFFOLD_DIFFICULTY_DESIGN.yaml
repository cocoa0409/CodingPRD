      - name: administer_then_void_restores_series_entitlement_conservation
        grounds:
          - conservation_invariants.series_entitlement_conservation
          - calculations.series_redemption_debit_cents
          - state_machines.InjectionVisit.ADMINISTERED_to_VOIDED
          - calculations.injection_payment_source
        distinguishing_aspect: |
          Conserved quantity two, of a different kind entirely - visit entitlements
          rather than physical pellets. Administering draws one entitlement and debits
          3287 cents of book value; voiding returns the entitlement so remaining_visits
          is 8 again, and refunded_visits and forfeited_visits are untouched at 0.
        test_recipe:
          setup:
            - "A B12 series pack with all 8 entitlements intact."
            - "A SCHEDULED B12 injection visit for 2026-05-15T09:00:00Z bound to that pack."
            - "Clock at 2026-05-15T09:00:00Z."
          setup_api_calls:
            - call: "POST /clinic/providers"
              payload: { full_name: "Dr Ada Reyes", provider_type: "PHYSICIAN", npi: "1000000001" }
              as: ClinicAdmin
              captures: { dr1: $.data.id }
            - call: "POST /clinic/patients"
              payload: { full_name: "Pat TwentyNine", date_of_birth: "1998-04-29", email: "p29@example.com", sex_at_birth: "FEMALE" }
              as: ClinicAdmin
              captures: { p29: $.data.id }
            - call: "POST /clinic/standing-orders"
              payload: { physician_id: "${dr1}", scope_hormone_types: ["TESTOSTERONE"], scope_injection_types: ["B12"], max_dose_mg: 1500, valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-10-01T00:00:00Z" }
              as: Physician
              as_user_id: "${dr1}"
              captures: { so29: $.data.id }
            - call: "POST /clinic/series-packs"
              payload: { patient_id: "${p29}", series_type: "B12" }
              as: FrontDesk
              captures: { pack29: $.data.id }
            - call: "POST /clinic/injection-visits"
              payload: { patient_id: "${p29}", provider_id: "${dr1}", standing_order_id: "${so29}", injection_type: "B12", room_code: "RM23", scheduled_start: "2026-05-15T09:00:00Z", series_pack_id: "${pack29}" }
              as: FrontDesk
              captures: { iv29: $.data.id }
            - call: "POST /clinic/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T09:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/injection-visits/${iv29}/administer"
              payload: {}
              as: Physician
              as_user_id: "${dr1}"
          trigger:
            - call: "POST /clinic/injection-visits/${iv29}/void"
              payload: { reason: "Charted against the wrong pack" }
              as: Physician
              as_user_id: "${dr1}"
          assert:
            - "immediately before the trigger SeriesPack.${pack29} held remaining_visits 7 and redeemed_visits 1, and InjectionVisit.${iv29}.series_debit_cents was 3287"
            - "InjectionVisit.${iv29}.payment_source == SERIES"
            - "InjectionVisit.${iv29}.charge_cents == 0"
            - "InjectionVisit.${iv29}.status == VOIDED"
            - "SeriesPack.${pack29}.purchased_visits == 8"
            - "SeriesPack.${pack29}.remaining_visits == 8"
            - "SeriesPack.${pack29}.redeemed_visits == 0"
            - "SeriesPack.${pack29}.refunded_visits == 0"
            - "SeriesPack.${pack29}.forfeited_visits == 0"
            - "SeriesPack.${pack29}.status == ACTIVE"

      - name: procedure_cancel_waives_schedule_and_holds_financing_money_conservation
        grounds:
          - conservation_invariants.financing_money_conservation
          - state_machines.FinancingPlan.ACTIVE_to_CANCELLED
          - calculations.financing_schedule_cents
          - calculations.refund_settlement_cents
        distinguishing_aspect: |
          Conserved quantity three, cents of financed principal rather than pellets or
          entitlements. After the cancel every unpaid installment is WAIVED, so leg B
          reads 7773 paid + 0 outstanding + 38867 waived == 46640, and leg A still reads
          11660 + 46640 == 58300 even though 3138 was never in play here and
          refunded_cents sits outside both legs.
        test_recipe:
          setup:
            - "An ACTIVE FinancingPlan with principal 58300, down payment 11660 and 6 installments of 7773, 7773, 7773, 7773, 7773, 7775."
            - "Installment 1 already PAID."
            - "The financed procedure is SCHEDULED for 2026-08-01T09:00:00Z and the clock is at 2026-06-15T00:00:00Z, more than 48 hours ahead, so the cancel tier is NONE."
          setup_api_calls:
            - call: "POST /clinic/providers"
              payload: { full_name: "Dr Ada Reyes", provider_type: "PHYSICIAN", npi: "1000000001" }
              as: ClinicAdmin
