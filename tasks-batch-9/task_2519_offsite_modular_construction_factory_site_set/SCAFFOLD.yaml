    side_effects: ["moves the module's qc_status along the QC machine (RELEASED, CONDITIONAL_RELEASE or HOLD)", "FAIL sets hold_state = AGENCY_HOLD and fires the three-link hold cascade: module unloaded, shipment load recomputed, DRAFT draw bases recomputed", "recomputes wip_earned_cents (a HOLD module earns nothing)", "increments InspectionRecord.version, ModuleUnit.version and any affected Shipment.version by 1"]

