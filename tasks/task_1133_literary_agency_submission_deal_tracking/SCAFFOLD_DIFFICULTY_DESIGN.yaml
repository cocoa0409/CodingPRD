            - { call: "GET /deals/${d1}", payload: {}, as: RoyaltiesAccountant, as_user_id: "ra-1", captures: { eoFwd: $.data.advance_earned_out_cents } }
            - { call: "POST /royalty-statements/${rs1}/open-audit", payload: {}, as: RoyaltiesAccountant, as_user_id: "ra-1" }
            - { call: "POST /royalty-statements/${rs1}/resolve-audit", payload: { net_receipts_hardcover_cents: 6000000, net_receipts_trade_cents: 3200000, net_receipts_ebook_cents: 1000000 }, as: RoyaltiesAccountant, as_user_id: "ra-1", captures: { varEnd: $.data.variance_cents } }
            - { call: "GET /deals/${d1}", payload: {}, as: RoyaltiesAccountant, as_user_id: "ra-1", captures: { eoEnd: $.data.advance_earned_out_cents } }
          assert:
            - "${eoFwd} == 965600   # forward action adds author_net"
            - "${eoEnd} == ${eoFwd}   # compensating resolve with identical receipts: delta 0, no drift"
            - "${varEnd} == 1000   # variance itself also unchanged"

      - name: negotiate_revise_roundtrip_conserves_live_offer_set
        grounds:
          - state_machines.Offer.RECEIVED_to_UNDER_NEGOTIATION
          - state_machines.Offer.UNDER_NEGOTIATION_to_RECEIVED
        distinguishing_aspect: |
          DIFFERENT conserved quantity than the sibling — the live-offer
          COUNT and the parent submission's state (a set cardinality + state
          invariant, not a monetary accumulator): the forward action negotiate
          (RECEIVED -> UNDER_NEGOTIATION) paired with its compensating action
          revise (UNDER_NEGOTIATION -> RECEIVED) leaves count(offers in
          {RECEIVED, UNDER_NEGOTIATION} on the round) == 2 and both submissions
          OFFER_EXTENDED, exactly as before the pair.
        test_recipe:
          setup:
            - "Signed pipeline; auction round open; s1 (edA) and s2 (edB) SENT; offers o1 on s1, o2 on s2, both RECEIVED; both submissions OFFER_EXTENDED"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency C2", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
            - { call: "POST /agents", payload: { agency_id: "${ag}", display_name: "Agent One", email: "a1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { agent1: $.data.id } }
            - { call: "POST /authors", payload: { agency_id: "${ag}", display_name: "Author One", email: "au1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { author1: $.data.id } }
            - { call: "POST /editors", payload: { agency_id: "${ag}", display_name: "Ed A", imprint: "IA", email: "eda@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { edA: $.data.id } }
            - { call: "POST /editors", payload: { agency_id: "${ag}", display_name: "Ed B", imprint: "IB", email: "edb@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { edB: $.data.id } }
            - { call: "POST /query-letters", payload: { author_id: "${author1}", genre: "FICTION", word_count: 90000 }, as: Agent, as_user_id: "${agent1}", captures: { q1: $.data.id } }
            - { call: "POST /query-letters/${q1}/assign", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /query-letters/${q1}/request-manuscript", payload: { title: "Book One" }, as: Agent, as_user_id: "${agent1}", captures: { ms1: $.data.id } }
            - { call: "POST /manuscripts/${ms1}/assign-reader", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms1}/evaluate", payload: { eval_score: 80 }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms1}/accept", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements", payload: { author_id: "${author1}", manuscript_id: "${ms1}", agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}", captures: { agr1: $.data.id } }
            - { call: "POST /client-agreements/${agr1}/offer", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements/${agr1}/sign", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /submission-rounds", payload: { manuscript_id: "${ms1}", agent_id: "${agent1}", max_editors: 5, auction_mode: true }, as: Agent, as_user_id: "${agent1}", captures: { r1: $.data.id, rv1: $.data.version } }
            - { call: "POST /submissions", payload: { submission_round_id: "${r1}", editor_id: "${edA}" }, as: Agent, as_user_id: "${agent1}", captures: { s1: $.data.id } }
            - { call: "POST /submissions", payload: { submission_round_id: "${r1}", editor_id: "${edB}" }, as: Agent, as_user_id: "${agent1}", captures: { s2: $.data.id } }
            - { call: "POST /submission-rounds/${r1}/open", payload: { expected_submission_round_version: "${rv1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /submissions/${s1}/send", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /submissions/${s2}/send", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /offers", payload: { submission_id: "${s1}", advance_cents: 300000, royalty_pct_hardcover: 0.10, royalty_pct_trade: 0.08, royalty_pct_ebook: 0.25 }, as: Agent, as_user_id: "${agent1}", captures: { o1: $.data.id } }
            - { call: "POST /offers", payload: { submission_id: "${s2}", advance_cents: 250000, royalty_pct_hardcover: 0.10, royalty_pct_trade: 0.08, royalty_pct_ebook: 0.25 }, as: Agent, as_user_id: "${agent1}", captures: { o2: $.data.id } }
          trigger:
            - { call: "POST /offers/${o1}/negotiate", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { o1Mid: $.data.status } }
            - { call: "POST /offers/${o1}/revise", payload: { advance_cents: 320000, royalty_pct_hardcover: 0.10, royalty_pct_trade: 0.08, royalty_pct_ebook: 0.25 }, as: Agent, as_user_id: "${agent1}", captures: { o1End: $.data.status } }
            - { call: "GET /offers", payload: { submission_id: "${s1}" }, as: Agent, as_user_id: "${agent1}", captures: { s1Offers: $.data } }
            - { call: "GET /submissions/${s1}", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { s1End: $.data.status } }
            - { call: "GET /submissions/${s2}", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { s2End: $.data.status } }
          assert:
            - "${o1Mid} == UNDER_NEGOTIATION and ${o1End} == RECEIVED   # forward + compensating pair"
            - "count of offers on round ${r1} with status IN {RECEIVED, UNDER_NEGOTIATION} == 2   # live-set cardinality conserved"
            - "Offer.${o2}.status == RECEIVED   # sibling untouched"
            - "${s1End} == OFFER_EXTENDED and ${s2End} == OFFER_EXTENDED   # submission states conserved through the pair"
            - "Offer.${o1}.advance_cents == 320000   # terms DID change — only the conserved quantities are invariant"
