          Metric = destination moisture pct on POST /api/shipments/{id}/accept (different metric
          and endpoint than the tonnage instance): max 10.0 + tolerance 2.0 makes 12.0 the
          inclusive accept boundary - 12.0 is accepted with a 2.0-point deduction (net 49.0 t,
