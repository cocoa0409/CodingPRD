scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: pay_credit_scheduled_vs_actual
        grounds:
          - calculations.pay_credit_calc
          - calculations.pay_credit_calc.variants[scheduled]
          - calculations.pay_credit_calc.variants[actual]
          - endpoints.GET_/assignments/{id}/pay-credit-estimate
          - state_machines.Assignment.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Dual variants live on the Assignment entity (pay-credit on a flown trip)
          and produce different results when an in-progress sick call drops a leg:
          scheduled uses all legs without applying the MIN_PAY_CREDIT_FLOOR_MINUTES
          floor, actual uses only flown legs and applies the floor.
        test_recipe:
          setup:
            - "POST /pairings: create pairing P with base_airport=DFW, rank_composition={CAPTAIN:1}."
            - "POST /pairings/{P}/duty-periods x2: D1 (report_at=2026-06-01T08:00Z, release_at=2026-06-01T18:00Z), D2 (report_at=2026-06-02T08:00Z, release_at=2026-06-02T18:00Z)."
            - "POST /duty-periods/{D1}/flight-legs: REVENUE leg 180min (dep_at=09:00, arr_at=12:00)."
            - "POST /duty-periods/{D2}/flight-legs: REVENUE leg 60min (dep_at=09:00, arr_at=10:00)."
            - "POST /pairings/{P}/publish then open-bidding then award; assign CrewMember M as CAPTAIN."
          trigger:
            - "GET /assignments/{A}/pay-credit-estimate (BEFORE Pairing closes)."
            - "POST /_clock/advance to 2026-06-01T07:55Z (Pairing -> IN_PROGRESS)."
            - "POST /sick-calls for M with effective_from=2026-06-01T19:00Z (after D1, before D2) so D2 is dropped."
            - "POST /_clock/advance past Pairing.end_at (2026-06-02T18:01Z): Assignment -> COMPLETED."
            - "GET /assignments/{A} (actual)."
          assert:
            - "Estimate response scheduled_pay_credit_minutes == 240 (180+60, no floor applied because 240 > raw; here floor not relevant — pin: scheduled formula returns max(180+60, 0)=240, no MIN floor)."
            - "After completion, Assignment.pay_credit_minutes == 240 (only 180 revenue minutes flown -> raw=180; max(180, MIN_PAY_CREDIT_FLOOR_MINUTES=240) = 240)."
            - "Assignment.actual_block_minutes == 180."
            - "Scheduled returned 240 by skipping floor; actual returned 240 by applying floor — same number but produced by different paths; assert via observing actual_block_minutes (180) != revenue_minutes used in scheduled (240)."

      - name: bid_award_seniority_vs_load_balanced
        grounds:
          - calculations.bid_award_calc
          - calculations.bid_award_calc.variants[seniority_first]
          - calculations.bid_award_calc.variants[load_balanced]
          - entities.Pairing.fields.required_rank_composition
          - endpoints.POST_/bid-windows/{id}/award
        distinguishing_aspect: |
          Dual variants live on the Bid/Pairing awarding domain (a different entity
          domain from pay-credit); identical bids produce different awarded CrewMember
          ids under seniority_first vs load_balanced because the ranking key changes
          from union_seniority_number to cumulative_block_minutes_30d.
        test_recipe:
          setup:
            - "Create CrewMember A (seniority=1, cumulative_block_minutes_30d=5000 via prior assignment)."
            - "Create CrewMember B (seniority=100, cumulative_block_minutes_30d=0)."
            - "Create Pairing P1 with required_rank_composition={CAPTAIN:1} and bid_window_id=W."
            - "Create Pairing P2 identical to P1 but required_rank_composition={CAPTAIN:1, mode:LOAD_BALANCED}."
            - "Both A and B submit bids on P1 and P2 within window W."
          trigger:
            - "POST /bid-windows/W/award."
          assert:
            - "Assignment for P1 has crew_member_id == A.id (seniority_first wins on lower seniority number)."
            - "Assignment for P2 has crew_member_id == B.id (load_balanced wins on lower cumulative_block_minutes_30d)."
            - "Bid (A,P2) ends in NOT_AWARDED; Bid (B,P1) ends in NOT_AWARDED."

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: pay_credit_aggregate_then_floor
        grounds:
          - calculations.pay_credit_calc
          - calculations.pay_credit_calc.formula
        distinguishing_aspect: |
          Mode (b): nested rounding where the order matters. Scaffold pins
          aggregate-then-floor on deadhead legs (NOT floor-per-leg-then-sum);
          two 35-minute DEADHEAD legs produce 35 credit, not 34.
        test_recipe:
          setup:
            - "Create Pairing P with two DEADHEAD legs of 35 minutes each and zero REVENUE legs."
            - "Assign CrewMember M to P; let pairing close (advance clock past end_at)."
          trigger:
            - "GET /assignments/{A}."
          assert:
            - "Assignment.pay_credit_minutes == 240 (raw=floor(70*0.5)=35, then max(35, MIN_PAY_CREDIT_FLOOR_MINUTES=240)=240)."
            - "If implementation used floor-per-leg-then-sum, raw would be 34, but the floor still yields 240; to distinguish, separately compute the pre-floor raw via inspection of /pay-credit-estimate (scheduled variant skips floor): scheduled_pay_credit_minutes == 35, NOT 34."

      - name: faa_duty_rest_check_three_input_threshold
        grounds:
          - calculations.faa_duty_rest_check
          - calculations.faa_duty_rest_check.formula
          - calculations.faa_duty_rest_check.constants
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs (cumulative_duty_minutes_7d,
          cumulative_block_minutes_30d, last_duty_end_at, per-DutyPeriod.duty_minutes)
          and non-linear conditional branching — the FIRST failing inequality is
          the one reported, so input order across four checks selects different
          error attributions for identical totals.
        test_recipe:
          setup:
            - "CrewMember M with cumulative_block_minutes_30d=5400, last_duty_end_at=2026-06-01T00:00Z."
            - "Pairing P with total_block_minutes=601, total_duty_minutes=600, start_at=2026-06-01T10:00Z (10h after last duty -> rest exactly 600min, passes), one DutyPeriod with duty_minutes=600."
          trigger:
            - "POST /assignments (admin override) for M on P."
          assert:
            - "Response status 422, error_id == ERR_FAA_DUTY_VIOLATION (rest check passed at 600min boundary; 30-day block 5400+601=6001 > 6000 fails before single-period and 7-day checks)."
            - "If instead rest is 599min (last_duty_end_at=2026-06-01T00:01Z), error_id == ERR_FAA_CREW_REST_VIOLATION because the rest check is evaluated FIRST."

      - name: bid_award_chronological_dependency
        grounds:
          - calculations.bid_award_calc
          - calculations.bid_award_calc.formula
        distinguishing_aspect: |
          Mode (c): pinned chronological evaluation order. Awarding sweeps pairings
          in ascending Pairing.start_at, and each award mutates the candidate's
          cumulative counters used by subsequent pairings — so the value of
          'award outcome for pairing P2' depends on whether P1 was processed first.
          Without the pinned order, identical Bid sets produce different awards.
        test_recipe:
          setup:
            - "CrewMember M with cumulative_block_minutes_30d=5000."
            - "Pairing P_early with start_at=2026-06-01T08:00Z, total_block_minutes=600."
            - "Pairing P_late with start_at=2026-06-05T08:00Z, total_block_minutes=600."
            - "M bids on both within window W; M is the only bidder."
          trigger:
            - "POST /bid-windows/W/award."
          assert:
            - "Bid(M, P_early).status == AWARDED (5000+600=5600 <= 6000)."
            - "Bid(M, P_late).status == NOT_AWARDED (cumulative now 5600+600=6200 > 6000 — FAA fails)."
            - "If evaluation order were reversed, both could be AWARDED or only P_late could be — the pinned ascending start_at order makes the outcome deterministic."

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: trade_request_cyclic_counter_loop
        grounds:
          - state_machines.TradeRequest
          - state_machines.TradeRequest.PROPOSED_to_COUNTER_PROPOSED
          - state_machines.TradeRequest.COUNTER_PROPOSED_to_PROPOSED
          - entities.TradeRequest.fields.revision_count
        distinguishing_aspect: |
          TradeRequest exhibits a true cycle: PROPOSED -> COUNTER_PROPOSED -> PROPOSED
          (with role swap and revision_count++) up to 3 rounds. A different entity
          (Assignment) has a non-cyclic branching machine; this rule is satisfied
          by the cycle on TradeRequest.
        test_recipe:
          setup:
            - "Two CrewMembers M1, M2 with SCHEDULED Assignments A1, A2 on different Pairings."
            - "M1 creates TradeRequest TR (initiator=M1, counterparty=M2, initiator_assignment_id=A1, counterparty_assignment_id=A2)."
          trigger:
            - "POST /trade-requests/TR/counter as M2 (new offer: swap A1 with A2 fields)."
            - "POST /trade-requests/TR/counter as M1 (now M1 is the counterparty after first swap)."
            - "POST /trade-requests/TR/counter as M2."
          assert:
            - "After 1st counter: TR.state == COUNTER_PROPOSED, revision_count == 1, current counterparty is M1."
            - "After 2nd counter: TR.state == PROPOSED, revision_count == 2, current counterparty is M2."
            - "After 3rd counter: TR.state == COUNTER_PROPOSED, revision_count == 3."
            - "A 4th counter call returns 422 ERR_TRADE_RULE_VIOLATION (revision_count cap)."

      - name: assignment_branching_release_vs_progress
        grounds:
          - state_machines.Assignment
          - state_machines.Assignment.SCHEDULED_to_RELEASED
          - state_machines.Assignment.SCHEDULED_to_IN_PROGRESS
          - state_machines.Assignment.SCHEDULED_to_NO_SHOW
        distinguishing_aspect: |
          Assignment (a different entity from TradeRequest) has a branching fork from
          SCHEDULED into three divergent terminal-track states (RELEASED via sick call
          path; IN_PROGRESS via clock advance and Pairing transition; NO_SHOW via admin
          mark) with different side-effect sets per branch: RELEASED debits cumulative
          counters, IN_PROGRESS does not, NO_SHOW triggers reserve_selection_calc.
        test_recipe:
          setup:
            - "Three identical Pairings P_a, P_b, P_c and three CrewMembers; assign one per pairing."
          trigger:
            - "On Assignment_a: POST /assignments/Assignment_a/release."
            - "On Assignment_b: POST /_clock/advance past P_b.start_at."
            - "On Assignment_c: POST /assignments/Assignment_c/mark-no-show after P_c.start_at."
          assert:
            - "Assignment_a.status == RELEASED; CrewMember_a.cumulative_block_minutes_30d decreased by Pairing.total_block_minutes."
            - "Assignment_b.status == IN_PROGRESS; CrewMember_b.cumulative_block_minutes_30d unchanged."
            - "Assignment_c.status == NO_SHOW; ReservePool callout query was attempted (verified by GET /reserve-pool with a candidate present being CALLED_OUT or ERR_NO_RESERVE_AVAILABLE returned)."

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: sick_call_chain_depth_3
        grounds:
          - endpoints.POST_/sick-calls
          - state_machines.Assignment.SCHEDULED_to_RELEASED
          - state_machines.ReservePool.AVAILABLE_to_CALLED_OUT
          - calculations.reserve_selection_calc
          - entities.SickCall.fields.covered_by_assignment_id
        distinguishing_aspect: |
          Trigger: POST /sick-calls. Depth-3 chain:
          (link 1) SickCall causes Assignment A to transition SCHEDULED -> RELEASED;
          (link 2) RELEASED transition triggers reserve_selection_calc which transitions
                   a ReservePool entry AVAILABLE -> CALLED_OUT;
          (link 3) CALLED_OUT transition creates a new Assignment for the reserve crew
                   AND back-fills SickCall.covered_by_assignment_id.
          Each link is caused by the previous link, not by the original POST.
        test_recipe:
          setup:
            - "CrewMember M1 has scheduled Assignment A1 on Pairing P (rank slot CAPTAIN)."
            - "CrewMember M2 (rank CAPTAIN, base = P.base_airport) on ReservePool R, state AVAILABLE, window covers Pairing day."
          trigger:
            - "POST /sick-calls {crew_member_id: M1.id, assignment_id: A1.id, effective_from: now+1h, expected_return_at: now+72h}."
          assert:
            - "Assignment A1.status == RELEASED (link 1, caused by sick call)."
            - "ReservePool R.state == CALLED_OUT (link 2, caused by A1 release triggering reserve_selection_calc)."
            - "New Assignment A2 exists with crew_member_id == M2.id, source == RESERVE_CALLOUT (link 3, caused by R callout)."
            - "SickCall.covered_by_assignment_id == A2.id (back-link populated by link 3)."

      - name: pairing_cancel_chain_depth_2
        grounds:
          - state_machines.Pairing.AWARDED_to_CANCELLED
          - state_machines.Assignment.SCHEDULED_to_RELEASED
          - entities.CrewMember.fields.cumulative_block_minutes_30d
        distinguishing_aspect: |
          Trigger: POST /pairings/{id}/cancel. Different trigger from sick_call_chain.
          Depth-2 chain:
          (link 1) Pairing AWARDED -> CANCELLED causes each AWARDED Assignment to
                   transition SCHEDULED -> RELEASED;
          (link 2) Each Assignment RELEASED transition debits CrewMember.cumulative_block_minutes_30d
                   AND cumulative_duty_minutes_7d. Each link is caused by the previous link.
        test_recipe:
          setup:
            - "Pairing P in AWARDED with two Assignments (CAPTAIN, FIRST_OFFICER) belonging to M1 and M2."
            - "Snapshot M1.cumulative_block_minutes_30d = X1, M2.cumulative_block_minutes_30d = X2."
          trigger:
            - "POST /pairings/P/cancel."
          assert:
            - "Pairing.status == CANCELLED (origin)."
            - "Both Assignments.status == RELEASED (link 1, caused by Pairing.cancel)."
            - "M1.cumulative_block_minutes_30d == X1 - P.total_block_minutes (link 2, caused by Assignment release)."
            - "M2.cumulative_block_minutes_30d == X2 - P.total_block_minutes (link 2, caused by Assignment release)."

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_bid_award
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - endpoints.POST_/bid-windows/{id}/award
        distinguishing_aspect: |
          Category pair: state (ERR_PAIRING_INVALID_STATE) vs business_safety
          (ERR_FAA_DUTY_VIOLATION). Priority 7 wins over priority 10 — if a pairing
          is no longer BIDDING_OPEN, the response is ERR_PAIRING_INVALID_STATE even
          when the awarding would also have caused FAA violations.
        test_recipe:
          setup:
            - "Create Pairing P that has been CANCELLED (so .status != BIDDING_OPEN)."
            - "Bid window W still contains P among its bids (race window pre-cancel)."
            - "Bidder M has cumulative_block_minutes_30d=5800 and would also violate FAA on P."
          trigger:
            - "POST /bid-windows/W/award."
          assert:
            - "Response error_id == ERR_PAIRING_INVALID_STATE (state check beats FAA safety check by priority)."

      - name: trade_state_vs_business_referential_on_approve
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - endpoints.POST_/trade-requests/{id}/approve
        distinguishing_aspect: |
          Category pair: state (ERR_INVALID_TRADE_STATE) vs business_referential
          (ERR_TRADE_RULE_VIOLATION). Different pair from instance 1. Priority 8
          beats priority 11 — if TradeRequest is REJECTED, response is
          ERR_INVALID_TRADE_STATE even when rank composition would also fail.
        test_recipe:
          setup:
            - "TradeRequest TR in REJECTED state."
            - "Crew members on either side have different ranks (would fail trade rule)."
          trigger:
            - "POST /trade-requests/TR/approve."
          assert:
            - "Response error_id == ERR_INVALID_TRADE_STATE (priority 8) — NOT ERR_TRADE_RULE_VIOLATION (priority 11)."

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: crew_rest_exactly_600_minutes
        grounds:
          - calculations.faa_duty_rest_check
          - calculations.faa_duty_rest_check.constants
          - errors.ERR_FAA_CREW_REST_VIOLATION
          - endpoints.POST_/assignments
        distinguishing_aspect: |
          Metric: time-interval threshold (numeric). The boundary uses >= 600 minutes
          (inclusive). 600 passes; 599 fails. Endpoint: POST /assignments.
        test_recipe:
          setup:
            - "CrewMember M with last_duty_end_at = 2026-06-01T00:00:00Z."
            - "Pairing P with DutyPeriod D, D.report_at = 2026-06-01T10:00:00Z (exactly 600min rest)."
            - "Pairing P with all other FAA totals within bounds."
          trigger:
            - "POST /assignments {pairing_id: P, crew_member_id: M, assigned_rank_slot: CAPTAIN}."
            - "Then second test: same setup but D.report_at = 2026-06-01T09:59:00Z (599min)."
          assert:
            - "First call returns 201 (boundary inclusive at 600)."
            - "Second call returns 422 with error_id == ERR_FAA_CREW_REST_VIOLATION (boundary fails at 599)."

      - name: reserve_callout_empty_pool
        grounds:
          - calculations.reserve_selection_calc
          - errors.ERR_NO_RESERVE_AVAILABLE
          - endpoints.POST_/sick-calls
        distinguishing_aspect: |
          Metric: empty-set edge (different from numeric threshold). Endpoint:
          POST /sick-calls. When reserve_selection_calc's eligible pool is empty
          (after filtering rank/base/standby/FAA), the calc returns the empty-pool
          fallback (ERR_NO_RESERVE_AVAILABLE) and SickCall.covered_by_assignment_id
          stays null.
        test_recipe:
          setup:
            - "CrewMember M1 with Assignment A1 in SCHEDULED."
            - "ReservePool table EMPTY (no AVAILABLE entries matching rank/base/window)."
          trigger:
            - "POST /sick-calls {crew_member_id: M1, assignment_id: A1, ...}."
          assert:
            - "SickCall created (201)."
            - "Response body data includes warning/error_id == ERR_NO_RESERVE_AVAILABLE."
            - "SickCall.covered_by_assignment_id == null."
            - "Assignment A1.status == RELEASED (sick call still released the slot)."

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: bid_submission_requires_pairing_bidding_open
        grounds:
          - validations[priority=7]
          - state_machines.Bid
          - state_machines.Pairing
          - endpoints.POST_/bids
        distinguishing_aspect: |
          Entity pair: Bid -> Pairing. A Bid can transition into SUBMITTED only if
          its parent Pairing is in BIDDING_OPEN. Different entity pair from instance 2.
        test_recipe:
          setup:
            - "Pairing P in PUBLISHED (not yet open for bidding)."
            - "CrewMember M (active Pilot)."
          trigger:
            - "POST /bids {pairing_id: P, preference_rank: 1, bid_window_id: W}."
          assert:
            - "Response 409, error_id == ERR_PAIRING_INVALID_STATE."
            - "Then POST /pairings/P/open-bidding."
            - "Retry POST /bids -> 201."

      - name: trade_approve_requires_both_assignments_scheduled
        grounds:
          - state_machines.TradeRequest.ACCEPTED_to_APPROVED
          - calculations.trade_legality_check
          - endpoints.POST_/trade-requests/{id}/approve
        distinguishing_aspect: |
          Entity pair: TradeRequest -> Assignment (two-sided). TradeRequest's
          ACCEPTED -> APPROVED transition is gated on BOTH initiator_assignment_id
          and counterparty_assignment_id being in SCHEDULED. Different entity pair
          from instance 1.
        test_recipe:
          setup:
            - "TradeRequest TR in ACCEPTED state."
            - "initiator_assignment_id A1 is SCHEDULED, counterparty_assignment_id A2 has been RELEASED via prior sick call."
          trigger:
            - "POST /trade-requests/TR/approve."
          assert:
            - "Response 409, error_id == ERR_INVALID_ASSIGNMENT_STATE (precondition: both assignments SCHEDULED)."
            - "TR.state remains ACCEPTED (no transition occurred)."

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: pairing_internal_dutyperiod_rest_overlap
        grounds:
          - validations[priority=14]
          - errors.ERR_PAIRING_INTERNAL_OVERLAP
          - calculations.faa_duty_rest_check.constants
          - endpoints.POST_/pairings/{id}/duty-periods
        distinguishing_aspect: |
          Resource: Pairing's DutyPeriod siblings. Interval semantics: half-open
          intervals with a required >= CREW_REST_MIN_MINUTES (600min) inter-period
          rest. A new DutyPeriod whose report_at is < 600 minutes after the previous
          release_at is rejected. The geometry is "gap-with-min-buffer" between
          siblings.
        test_recipe:
          setup:
            - "Pairing P in DRAFT with D1 (release_at=2026-06-01T18:00:00Z)."
          trigger:
            - "POST /pairings/P/duty-periods {sequence_no: 2, report_at: 2026-06-02T03:59:00Z, release_at: 2026-06-02T13:00:00Z} (599min gap)."
          assert:
            - "Response 422, error_id == ERR_PAIRING_INTERNAL_OVERLAP."
            - "Retry with report_at=2026-06-02T04:00:00Z (600min gap, boundary inclusive) -> 201."

      - name: reserve_pool_standby_window_inclusion
        grounds:
          - validations[priority=12]
          - errors.ERR_RESERVE_OUTSIDE_WINDOW
          - entities.ReservePool.fields.standby_start_at
          - entities.ReservePool.fields.standby_end_at
          - endpoints.POST_/reserve-pool/{id}/call-out
        distinguishing_aspect: |
          Resource: ReservePool's standby window. Different resource entity from
          Pairing's DutyPeriod. Interval semantics: closed-open [standby_start_at,
          standby_end_at) — start inclusive, end EXCLUSIVE. Different geometric
          treatment from the Pairing DutyPeriod buffer (which is gap-with-min,
          not point-in-window).
        test_recipe:
          setup:
            - "ReservePool R with standby_start_at=2026-06-01T08:00:00Z, standby_end_at=2026-06-01T20:00:00Z."
          trigger:
            - "POST /_clock/advance to 2026-06-01T20:00:00Z."
            - "POST /reserve-pool/R/call-out {pairing_id: P, assigned_rank_slot: CAPTAIN}."
          assert:
            - "Response 422, error_id == ERR_RESERVE_OUTSIDE_WINDOW (end is exclusive)."
            - "Repeat with clock at 2026-06-01T08:00:00Z -> 201 (start is inclusive)."
            - "Repeat with clock at 2026-06-01T19:59:00Z -> 201 (within window)."

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: trade_execution_conserves_total_block_30d
        grounds:
          - state_machines.TradeRequest.APPROVED_to_EXECUTED
          - calculations.trade_legality_check
          - entities.CrewMember.fields.cumulative_block_minutes_30d
        distinguishing_aspect: |
          Conserved quantity: sum_block_30d_both = M1.cumulative_block_minutes_30d
          + M2.cumulative_block_minutes_30d. The forward action (trade execution)
          and its compensating internal accounting (debit-credit pair on each crew
          member) MUST leave this sum unchanged.
        test_recipe:
          setup:
            - "CrewMember M1 has Assignment A1 on Pairing P1 (total_block_minutes=800), cumulative_block_minutes_30d=4000."
            - "CrewMember M2 has Assignment A2 on Pairing P2 (total_block_minutes=600), cumulative_block_minutes_30d=2000."
            - "TradeRequest TR (M1.A1 <-> M2.A2) progresses PROPOSED -> ACCEPTED -> APPROVED."
            - "Both Pairings are within rolling 30-day window from now."
          trigger:
            - "POST /trade-requests/TR/approve."
          assert:
            - "Before: M1.cumulative_block_minutes_30d + M2.cumulative_block_minutes_30d == 6000."
            - "After: M1.cumulative_block_minutes_30d == 3800 (4000 - 800 + 600); M2.cumulative_block_minutes_30d == 2200 (2000 - 600 + 800)."
            - "Sum after == 6000. Conserved quantity sum_block_30d_both unchanged."

      - name: pairing_cancel_undo_conserves_baseline_block_30d
        grounds:
          - state_machines.Pairing.AWARDED_to_CANCELLED
          - state_machines.Assignment.SCHEDULED_to_RELEASED
          - entities.CrewMember.fields.cumulative_block_minutes_30d
        distinguishing_aspect: |
          Different conserved quantity: per-crew-member baseline. For each affected
          crew member, their cumulative_block_minutes_30d AFTER pairing cancel MUST
          equal their cumulative_block_minutes_30d BEFORE the awarding that created
          the assignment in the first place. Award (forward) and cancel-release
          (compensating) together net to zero per crew member.
        test_recipe:
          setup:
            - "CrewMember M with cumulative_block_minutes_30d = 1500 (baseline)."
            - "Pairing P with total_block_minutes=400 reaches AWARDED with M as CAPTAIN."
            - "Immediately after award: M.cumulative_block_minutes_30d == 1900."
          trigger:
            - "POST /pairings/P/cancel."
          assert:
            - "Assignment.status == RELEASED."
            - "M.cumulative_block_minutes_30d == 1500 (back to baseline; the +400 from award and -400 from release-via-cancel net to zero)."
