            - "Batch METRO-2026-06 (30 cases at invoice 9140 over base 8533) is NORMALIZED; batch METRO-2026-07 (10 cases, same costs) is NORMALIZED; batch METRO-2026-05 is still RECEIVED and empty."
            - "METRO-2026-06 was audited (overbilled 300), a recovery was requested, and the settlement was WRITTEN_OFF, so METRO-01 is SUSPENDED."
            - "Pier 9 then submits a letter to METRO-01, which is SUBMITTED and awaiting countersignature."
