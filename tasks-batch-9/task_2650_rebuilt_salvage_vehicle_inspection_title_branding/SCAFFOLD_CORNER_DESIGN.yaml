  # ===========================================================================
  - section: rbac
    instances:
      - name: every_role_can_perform_its_own_exclusive_write
        claim_type: role_permission_positive
        grounds:
          - roles.ProgramAdmin
          - roles.StateTitleClerk
          - roles.InsurerAdjuster
          - roles.Rebuilder
          - roles.Inspector
          - roles.FraudInvestigator
        distinguishing_aspect: "One chain exercises an exclusive_operation of six of the seven roles in sequence — admin licensing, clerk registration and titling, adjuster damage filing, rebuilder application and documentation, inspector verification, and investigator take-up — proving no role's own writes are blocked by the matrix; the HearingOfficer's review and decide operations are exercised by the appeal corner in the state_machines section."
        test_recipe:
          setup: ["an empty program: every fixture below is created by the role that owns the operation"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/rebuilders"
              payload: { legal_name: "Sierra Rebuilders LLC", license_number: "RB-9331", license_expires_at: "2027-06-30T00:00:00Z", bond_amount_cents: 2500000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { rb_id: $.data.id }
            - call: "POST /v1/inspectors"
              payload: { full_name: "Dana Ruiz", badge_number: "INS-9331", credential_expires_at: "2027-01-01T00:00:00Z", certifications: ["STRUCTURAL", "VIN"], home_state_code: "NV" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { insp_id: $.data.id }
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A007331", model_year: 2020, make: "Wells", model: "Cargo", body_class: "TRAILER", registered_state_code: "NV" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { veh_id: $.data.id }
            - call: "POST /v1/damage-reports"
              payload: { vehicle_id: "${veh_id}", insurer_name: "Cascade Mutual", claim_number: "CM-93031", basis_code: "GROSS_ESTIMATE", acv_cents: 400000, repair_estimate_cents: 320000, damage_type: "COLLISION", odometer_reading_miles: 0, report_effective_at: "2026-07-20T00:00:00Z", total_loss_declared: true }
              as: InsurerAdjuster
              as_user_id: "adj-01"
              captures: { rep_id: $.data.id }
            - call: "POST /v1/title-records"
              payload: { vehicle_id: "${veh_id}", issuing_state_code: "NV", owner_name: "Ada Reyes", source_damage_report_id: "${rep_id}" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { title_id: $.data.id }
            - call: "POST /v1/applications"
              payload: { vehicle_id: "${veh_id}", rebuilder_id: "${rb_id}", salvage_title_id: "${title_id}", declared_repair_cost_cents: 320000 }
              as: Rebuilder
              as_user_id: "${rb_id}"
              captures: { app_id: $.data.id }
            - call: "POST /v1/applications/${app_id}/parts-documents"
              payload: { doc_type: "RECEIPT", part_class: "LIGHTING", source_type: "NEW", amount_cents: 20000, vendor_name: "Basin Frame Supply", part_serial_number: "SL-9331" }
              as: Rebuilder
              as_user_id: "${rb_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /v1/parts-documents/${doc_id}/verify"
              payload: { verification_note: "new lamp invoice on file" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /v1/fraud-referrals"
              payload: { vehicle_id: "${veh_id}", application_id: "${app_id}", referral_type: "DOCUMENT_FORGERY", evidence_summary: "vendor letterhead appears pasted" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /v1/fraud-referrals/${ref_id}/investigate"
              payload: { investigation_note: "assigned to the fraud unit" }
              as: FraudInvestigator
