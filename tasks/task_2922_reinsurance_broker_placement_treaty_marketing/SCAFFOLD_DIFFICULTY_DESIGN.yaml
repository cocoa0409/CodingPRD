              captures: { sl_p: $.data.id }
          assert:
            - "${committed_before} == 200000000 and ${available_before} == 300000000"
            - "the firm-order succeeds — 200000000 + 300000000 == 500000000 == capacity_limit_minor, and equality passes"
            - "SigningLine.${sl_p}.committed_capacity_minor == 300000000 and SigningLine.${sl_p}.status == PROVISIONAL"
