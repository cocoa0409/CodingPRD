  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: declare_deceased_depth4_cascade_through_inherited_beneficiary_rmd
        grounds:
          - state_machines.IRAAccount.ACTIVE_to_INHERITED
          - calculations.rmd_amount
          - entities.BeneficiaryDesignation.fields.secure_deadline_at
          - entities.AccountOwner.fields.rmd_posture
        distinguishing_aspect: |
          Depth-≥4 chain originating from POST /owners/{id}/declare-deceased:
          (1) AccountOwner.deceased_at set; (2) THAT change cascades into IRAAccount
          ACTIVE → INHERITED (caused by hop 1, not by the original action); (3) THAT
          IRAAccount transition cascades into BeneficiaryDesignation ACTIVE → INHERITED
          with secure_deadline_at stamped (caused by hop 2); (4) THAT designation change
          cascades into RMDSchedule rebuild under variant secure_10year_pace (caused by
          hop 3). Each hop is consequent to the previous, not parallel fan-out.
          Different trigger from instance #2.
        test_recipe:
          setup:
            - "Owner Gina (age 73 throughout 2026) with one ACTIVE TRADITIONAL account funded to cash 700000 cents"
            - "One ACTIVE NON_ELIGIBLE_INDIVIDUAL beneficiary"
            - "One OPEN RMDSchedule for tax_year=2026 with required_amount_cents=26315 (living variant)"
            - "Clock pinned at 2026-06-01"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /ira/owners"
              payload: { full_name: "Gina", date_of_birth: "1953-04-04", tax_id_last4: "5555", filing_status: "SINGLE" }
              as: PlanAdministrator
              captures: { gina_id: $.data.id }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${gina_id}", account_type: "TRADITIONAL" }
              as: PlanAdministrator
              captures: { gina_trad_id: $.data.id, gina_trad_v0: $.data.version }
            - call: "POST /ira/contributions"
              payload: { account_id: "${gina_trad_id}", tax_year: 2026, amount_cents: 700000, contribution_kind: "PRETAX" }
              as: AccountOwner
              as_user_id: "${gina_id}"
              captures: { gina_c1_id: $.data.id }
            - call: "POST /ira/contributions/${gina_c1_id}/confirm"
              payload: { expected_account_version: "${gina_trad_v0}" }
              as: AccountOwner
              as_user_id: "${gina_id}"
            - call: "POST /ira/beneficiary-designations"
              payload: { account_id: "${gina_trad_id}", beneficiary_full_name: "Nephew Neville", relationship: "NON_ELIGIBLE_INDIVIDUAL", percentage_bps: 10000 }
              as: AccountOwner
              as_user_id: "${gina_id}"
              captures: { gina_bene_id: $.data.id }
            - call: "POST /ira/beneficiary-designations/${gina_bene_id}/activate"
              payload: {}
              as: AccountOwner
              as_user_id: "${gina_id}"
            - call: "POST /ira/rmd-schedules"
              payload: { owner_id: "${gina_id}", tax_year: 2026 }
              as: PlanAdministrator
              captures: { gina_sched_id: $.data.id, gina_sched_alive_required: $.data.required_amount_cents }
            - call: "GET /ira/owners/${gina_id}"
              payload: {}
              as: PlanAdministrator
              captures: { gina_v_pre: $.data.version }
          trigger:
            - call: "POST /ira/owners/${gina_id}/declare-deceased"
              payload: { deceased_at: "2026-06-01T12:00:00Z", expected_owner_version: "${gina_v_pre}" }
              as: PlanAdministrator
            - call: "GET /ira/accounts/${gina_trad_id}"
              payload: {}
              as: PlanAdministrator
              captures: { gina_acct_status_after: $.data.status }
            - call: "GET /ira/beneficiary-designations/${gina_bene_id}"
              payload: {}
              as: PlanAdministrator
              captures: { gina_bene_status_after: $.data.status, gina_bene_deadline: $.data.secure_deadline_at }
          assert:
            - "gina_sched_alive_required == 26315"
            - "gina_acct_status_after == INHERITED"
            - "gina_bene_status_after == INHERITED"
            - "gina_bene_deadline == 2036-06-01T12:00:00Z"
            - "AccountOwner.${gina_id}.rmd_posture == REQUIRED_PENDING"

      - name: distribution_confirm_rmd_satisfaction_depth3_cascade
        grounds:
          - state_machines.Distribution.PENDING_to_CONFIRMED
          - state_machines.RMDSchedule.OPEN_to_SATISFIED
          - entities.AccountOwner.fields.rmd_posture
          - entities.RMDSchedule.fields.satisfied_amount_cents
        distinguishing_aspect: |
          Depth-≥2 (actually 3) chain originating from POST /distributions/{id}/confirm
          with distribution_reason=RMD: (1) Distribution PENDING → CONFIRMED;
          (2) THAT confirmation increments RMDSchedule.satisfied_amount_cents and, when
          it meets required_amount_cents, drives RMDSchedule OPEN → SATISFIED (caused by
          hop 1); (3) THAT schedule transition triggers AccountOwner.rmd_posture
          recompute to REQUIRED_MET (caused by hop 2). Different trigger from instance #1.
        test_recipe:
          setup:
            - "Owner Henry (age 73 in 2026) with one TRADITIONAL account funded to cash 700000 cents"
            - "One OPEN RMDSchedule tax_year=2026 with required_amount_cents=26315"
            - "AccountOwner.rmd_posture == REQUIRED_PENDING"
            - "PENDING Distribution for amount_cents=26315 distribution_reason=RMD"
            - "Clock at 2026-06-01"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /ira/owners"
              payload: { full_name: "Henry", date_of_birth: "1953-05-05", tax_id_last4: "6666", filing_status: "SINGLE" }
              as: PlanAdministrator
              captures: { henry_id: $.data.id }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${henry_id}", account_type: "TRADITIONAL" }
              as: PlanAdministrator
              captures: { henry_trad_id: $.data.id, henry_trad_v0: $.data.version }
            - call: "POST /ira/contributions"
              payload: { account_id: "${henry_trad_id}", tax_year: 2026, amount_cents: 700000, contribution_kind: "PRETAX" }
              as: AccountOwner
              as_user_id: "${henry_id}"
              captures: { henry_c1_id: $.data.id }
            - call: "POST /ira/contributions/${henry_c1_id}/confirm"
              payload: { expected_account_version: "${henry_trad_v0}" }
              as: AccountOwner
              as_user_id: "${henry_id}"
            - call: "POST /ira/rmd-schedules"
              payload: { owner_id: "${henry_id}", tax_year: 2026 }
              as: PlanAdministrator
              captures: { henry_sched_id: $.data.id }
            - call: "POST /ira/distributions"
              payload: { account_id: "${henry_trad_id}", amount_cents: 26315, distribution_reason: "RMD", tax_year: 2026 }
              as: AccountOwner
              as_user_id: "${henry_id}"
              captures: { henry_dist_id: $.data.id }
            - call: "GET /ira/accounts/${henry_trad_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${henry_id}"
              captures: { henry_trad_v_pre: $.data.version }
          trigger:
            - call: "POST /ira/distributions/${henry_dist_id}/confirm"
              payload: { expected_account_version: "${henry_trad_v_pre}" }
              as: AccountOwner
              as_user_id: "${henry_id}"
            - call: "GET /ira/rmd-schedules/${henry_sched_id}"
              payload: {}
              as: PlanAdministrator
              captures: { sched_status_after: $.data.status, sched_satisfied_after: $.data.satisfied_amount_cents }
            - call: "GET /ira/owners/${henry_id}"
              payload: {}
              as: PlanAdministrator
              captures: { posture_after: $.data.rmd_posture }
          assert:
            - "Distribution.${henry_dist_id}.status == CONFIRMED"
            - "sched_status_after == SATISFIED"
            - "sched_satisfied_after == 26315"
            - "posture_after == REQUIRED_MET"
            - "IRAAccount.${henry_trad_id}.cash_balance_cents == 673685"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: kind_mismatch_outranks_contribution_cap_on_contribution_create
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_KIND_ACCOUNT_MISMATCH]
          - errors[ERR_CONTRIBUTION_CAP_EXCEEDED]
        distinguishing_aspect: |
          Category pair: business_safety (priority 8 ERR_KIND_ACCOUNT_MISMATCH) vs
          business_fiscal (priority 11 ERR_CONTRIBUTION_CAP_EXCEEDED). A request that
          violates BOTH (a TRADITIONAL account receives a ROTH-kind contribution AND
          the amount would exceed the cap) MUST return ERR_KIND_ACCOUNT_MISMATCH —
          the safety check wins. The body of POST /contributions itself triggers ERR_KIND
          before any cap math runs. Different category pair from instance #2.
        test_recipe:
          setup:
            - "Owner Ivan (age 45, SINGLE 2026) with one TRADITIONAL account"
            - "ytd_contribution_cents seeded to 750000 (== cap) via a single CONFIRMED PRETAX 750000"
            - "Now attempt a 1-cent contribution with contribution_kind=ROTH against the TRADITIONAL account"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /ira/owners"
              payload: { full_name: "Ivan", date_of_birth: "1981-08-08", tax_id_last4: "7777", filing_status: "SINGLE", modified_agi_cents: 12000000 }
              as: PlanAdministrator
              captures: { ivan_id: $.data.id }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${ivan_id}", account_type: "TRADITIONAL" }
              as: PlanAdministrator
              captures: { ivan_trad_id: $.data.id, ivan_trad_v0: $.data.version }
            - call: "POST /ira/contributions"
              payload: { account_id: "${ivan_trad_id}", tax_year: 2026, amount_cents: 750000, contribution_kind: "PRETAX" }
              as: AccountOwner
              as_user_id: "${ivan_id}"
              captures: { ivan_c1_id: $.data.id }
            - call: "POST /ira/contributions/${ivan_c1_id}/confirm"
              payload: { expected_account_version: "${ivan_trad_v0}" }
              as: AccountOwner
              as_user_id: "${ivan_id}"
          trigger:
            - call: "POST /ira/contributions"
              payload: { account_id: "${ivan_trad_id}", tax_year: 2026, amount_cents: 1, contribution_kind: "ROTH" }
              as: AccountOwner
              as_user_id: "${ivan_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "$.data.error_id == ERR_KIND_ACCOUNT_MISMATCH"

      - name: invalid_state_outranks_insufficient_balance_on_distribution_confirm
        grounds:
          - validations[priority=5]
          - validations[priority=12]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INSUFFICIENT_BALANCE]
          - state_machines.Distribution.PENDING_to_CONFIRMED
        distinguishing_aspect: |
          Category pair: state (priority 5 ERR_INVALID_STATE) vs business_fiscal
          (priority 12 ERR_INSUFFICIENT_BALANCE). A Distribution that has ALREADY been
          CONFIRMED is re-confirmed; the same call also asks for amount_cents greater
          than account.cash_balance_cents. ERR_INVALID_STATE wins because the
          distribution.status != PENDING precondition fires before the balance check.
          Different category pair from instance #1.
        test_recipe:
          setup:
            - "Owner Jane (age 45 2026) with TRADITIONAL account funded to cash 100000 via PRETAX 100000 confirmed"
            - "Distribution 50000 NORMAL, CONFIRMED — account.cash_balance_cents now 50000"
            - "Now attempt to re-confirm the same already-CONFIRMED distribution; in addition the request would be over-balance if state were OK"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /ira/owners"
              payload: { full_name: "Jane", date_of_birth: "1981-09-09", tax_id_last4: "8888", filing_status: "SINGLE" }
              as: PlanAdministrator
              captures: { jane_id: $.data.id }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${jane_id}", account_type: "TRADITIONAL" }
              as: PlanAdministrator
              captures: { jane_trad_id: $.data.id, jane_trad_v0: $.data.version }
            - call: "POST /ira/contributions"
              payload: { account_id: "${jane_trad_id}", tax_year: 2026, amount_cents: 100000, contribution_kind: "PRETAX" }
              as: AccountOwner
              as_user_id: "${jane_id}"
              captures: { jane_c1_id: $.data.id }
            - call: "POST /ira/contributions/${jane_c1_id}/confirm"
              payload: { expected_account_version: "${jane_trad_v0}" }
              as: AccountOwner
              as_user_id: "${jane_id}"
            - call: "GET /ira/accounts/${jane_trad_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${jane_id}"
              captures: { jane_trad_v1: $.data.version }
            - call: "POST /ira/distributions"
              payload: { account_id: "${jane_trad_id}", amount_cents: 50000, distribution_reason: "NORMAL", tax_year: 2026 }
              as: AccountOwner
              as_user_id: "${jane_id}"
              captures: { jane_dist_id: $.data.id }
            - call: "POST /ira/distributions/${jane_dist_id}/confirm"
              payload: { expected_account_version: "${jane_trad_v1}" }
              as: AccountOwner
              as_user_id: "${jane_id}"
            - call: "GET /ira/accounts/${jane_trad_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${jane_id}"
              captures: { jane_trad_v2: $.data.version }
          trigger:
            - call: "POST /ira/distributions/${jane_dist_id}/confirm"
              payload: { expected_account_version: "${jane_trad_v2}" }
              as: AccountOwner
              as_user_id: "${jane_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "$.data.error_id == ERR_INVALID_STATE"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: contribution_cap_boundary_at_exact_cap_passes_one_cent_over_fails
        grounds:
          - validations[priority=11]
          - calculations.contribution_limit
          - errors[ERR_CONTRIBUTION_CAP_EXCEEDED]
          - state_machines.Contribution.PENDING_to_CONFIRMED
        distinguishing_aspect: |
          Boundary <= vs >: ytd_contribution_cents + amount_cents <= 750000 passes;
          == 750000 boundary is INCLUSIVE (priority 11 uses <=). A second contribution
          of 1 cent crossing to 750001 fails with ERR_CONTRIBUTION_CAP_EXCEEDED. Metric:
          ytd_contribution_cents (numeric threshold). Endpoint: POST /contributions/{id}/confirm.
        test_recipe:
          setup:
            - "Owner Karl (age 45 SINGLE 2026 AGI 12000000) with one TRADITIONAL account, ytd=0"
            - "First PRETAX 750000 confirmed -> ytd=750000 (exactly cap)"
            - "Second PRETAX 1 created PENDING; confirm should fail"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /ira/owners"
              payload: { full_name: "Karl", date_of_birth: "1981-10-10", tax_id_last4: "1010", filing_status: "SINGLE", modified_agi_cents: 12000000 }
              as: PlanAdministrator
              captures: { karl_id: $.data.id }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${karl_id}", account_type: "TRADITIONAL" }
              as: PlanAdministrator
              captures: { karl_trad_id: $.data.id, karl_trad_v0: $.data.version }
            - call: "POST /ira/contributions"
              payload: { account_id: "${karl_trad_id}", tax_year: 2026, amount_cents: 750000, contribution_kind: "PRETAX" }
              as: AccountOwner
              as_user_id: "${karl_id}"
              captures: { karl_c1_id: $.data.id }
            - call: "POST /ira/contributions/${karl_c1_id}/confirm"
              payload: { expected_account_version: "${karl_trad_v0}" }
              as: AccountOwner
              as_user_id: "${karl_id}"
            - call: "GET /ira/accounts/${karl_trad_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${karl_id}"
              captures: { karl_trad_v1: $.data.version }
            - call: "POST /ira/contributions"
              payload: { account_id: "${karl_trad_id}", tax_year: 2026, amount_cents: 1, contribution_kind: "PRETAX" }
              as: AccountOwner
              as_user_id: "${karl_id}"
              captures: { karl_c2_id: $.data.id }
          trigger:
            - call: "POST /ira/contributions/${karl_c2_id}/confirm"
              payload: { expected_account_version: "${karl_trad_v1}" }
              as: AccountOwner
              as_user_id: "${karl_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "$.data.error_id == ERR_CONTRIBUTION_CAP_EXCEEDED"
            - "IRAAccount.${karl_trad_id}.ytd_contribution_cents == 750000"

      - name: rmd_age_threshold_seventy_three_boundary_on_rmd_schedule_create
        grounds:
          - calculations.rmd_amount
          - entities.AccountOwner.fields.date_of_birth
          - entities.RMDSchedule.fields.required_amount_cents
        distinguishing_aspect: |
          Boundary on a different metric (age in years, not currency) and a different
          endpoint (POST /rmd-schedules, not /contributions/.../confirm). Owner whose
          age-at-Dec-31-of-tax-year is 72 produces required_amount_cents=0; bumping the
          birth year by one (age 73) flips to required_amount_cents=26315 with cash
          700000 (per Uniform Lifetime divisor 26.60).
        test_recipe:
          setup:
            - "Owner Lena (DOB 1954-01-15 → turns 72 on 2026-01-15, age-at-EOY=72) with TRADITIONAL cash 700000"
            - "Owner Mona (DOB 1953-01-15 → turns 73 on 2026-01-15, age-at-EOY=73) with TRADITIONAL cash 700000"
            - "Clock at 2026-06-01"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /ira/owners"
              payload: { full_name: "Lena", date_of_birth: "1954-01-15", tax_id_last4: "1212", filing_status: "SINGLE" }
              as: PlanAdministrator
              captures: { lena_id: $.data.id }
            - call: "POST /ira/owners"
              payload: { full_name: "Mona", date_of_birth: "1953-01-15", tax_id_last4: "1313", filing_status: "SINGLE" }
              as: PlanAdministrator
              captures: { mona_id: $.data.id }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${lena_id}", account_type: "TRADITIONAL" }
              as: PlanAdministrator
              captures: { lena_trad_id: $.data.id, lena_trad_v0: $.data.version }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${mona_id}", account_type: "TRADITIONAL" }
              as: PlanAdministrator
              captures: { mona_trad_id: $.data.id, mona_trad_v0: $.data.version }
            - call: "POST /ira/contributions"
              payload: { account_id: "${lena_trad_id}", tax_year: 2026, amount_cents: 700000, contribution_kind: "PRETAX" }
              as: AccountOwner
              as_user_id: "${lena_id}"
              captures: { lena_c1_id: $.data.id }
            - call: "POST /ira/contributions/${lena_c1_id}/confirm"
              payload: { expected_account_version: "${lena_trad_v0}" }
              as: AccountOwner
              as_user_id: "${lena_id}"
            - call: "POST /ira/contributions"
              payload: { account_id: "${mona_trad_id}", tax_year: 2026, amount_cents: 700000, contribution_kind: "PRETAX" }
              as: AccountOwner
              as_user_id: "${mona_id}"
              captures: { mona_c1_id: $.data.id }
            - call: "POST /ira/contributions/${mona_c1_id}/confirm"
              payload: { expected_account_version: "${mona_trad_v0}" }
              as: AccountOwner
              as_user_id: "${mona_id}"
            - call: "POST /ira/rmd-schedules"
              payload: { owner_id: "${lena_id}", tax_year: 2026 }
              as: PlanAdministrator
              captures: { lena_sched_id: $.data.id, lena_sched_required: $.data.required_amount_cents }
          trigger:
            - call: "POST /ira/rmd-schedules"
              payload: { owner_id: "${mona_id}", tax_year: 2026 }
              as: PlanAdministrator
              captures: { mona_sched_id: $.data.id, mona_sched_required: $.data.required_amount_cents }
          assert:
            - "lena_sched_required == 0"
            - "mona_sched_required == 26315"
            - "lena_sched_required != mona_sched_required"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: conversion_completes_only_when_target_roth_account_active
        grounds:
          - state_machines.Conversion.INITIATED_to_COMPLETED
          - entities.Conversion.fields.target_account_id
          - entities.IRAAccount.fields.status
          - validations[priority=5]
        distinguishing_aspect: |
          Cross-entity pair: Conversion → IRAAccount (target). Conversion can be
          COMPLETED only if the target ROTH account is in ACTIVE state. Freezing the
          target between INITIATED and complete makes target.status=FROZEN; the
          complete transition then fails ERR_INVALID_STATE because target_account.status
          != ACTIVE. Different entity pair from instance #2.
        test_recipe:
          setup:
            - "Owner Noah with TRADITIONAL source (aftertax 200000 confirmed) and ROTH target ACTIVE"
            - "Conversion INITIATED on source, gross 200000"
            - "Admin freezes the ROTH target"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /ira/owners"
              payload: { full_name: "Noah", date_of_birth: "1981-11-11", tax_id_last4: "1414", filing_status: "SINGLE", modified_agi_cents: 12000000 }
              as: PlanAdministrator
              captures: { noah_id: $.data.id }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${noah_id}", account_type: "TRADITIONAL" }
              as: PlanAdministrator
              captures: { noah_trad_id: $.data.id, noah_trad_v0: $.data.version }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${noah_id}", account_type: "ROTH" }
              as: PlanAdministrator
              captures: { noah_roth_id: $.data.id, noah_roth_v0: $.data.version }
            - call: "POST /ira/contributions"
              payload: { account_id: "${noah_trad_id}", tax_year: 2026, amount_cents: 200000, contribution_kind: "AFTERTAX" }
              as: AccountOwner
              as_user_id: "${noah_id}"
              captures: { noah_c1_id: $.data.id }
            - call: "POST /ira/contributions/${noah_c1_id}/confirm"
              payload: { expected_account_version: "${noah_trad_v0}" }
              as: AccountOwner
              as_user_id: "${noah_id}"
            - call: "POST /ira/conversions"
              payload: { source_account_id: "${noah_trad_id}", target_account_id: "${noah_roth_id}", gross_amount_cents: 200000 }
              as: AccountOwner
              as_user_id: "${noah_id}"
              captures: { noah_conv_id: $.data.id }
            - call: "POST /ira/accounts/${noah_roth_id}/freeze"
              payload: { expected_account_version: "${noah_roth_v0}" }
              as: PlanAdministrator
            - call: "GET /ira/accounts/${noah_trad_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${noah_id}"
              captures: { noah_trad_v_pre: $.data.version }
          trigger:
            - call: "POST /ira/conversions/${noah_conv_id}/complete"
              payload: { expected_source_account_version: "${noah_trad_v_pre}" }
              as: AccountOwner
              as_user_id: "${noah_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "$.data.error_id == ERR_INVALID_STATE"
            - "Conversion.${noah_conv_id}.status == INITIATED"

      - name: rmd_distribution_confirm_requires_open_rmd_schedule
        grounds:
          - state_machines.Distribution.PENDING_to_CONFIRMED
          - entities.RMDSchedule.fields.status
          - entities.Distribution.fields.distribution_reason
        distinguishing_aspect: |
          Cross-entity pair: Distribution → RMDSchedule. A Distribution with
          distribution_reason=RMD can transition PENDING → CONFIRMED only if an OPEN
          (or DELINQUENT) RMDSchedule exists for (owner_id, tax_year). Without one,
          ERR_INVALID_STATE is returned. Different entity pair from instance #1.
        test_recipe:
          setup:
            - "Owner Olive (age 73 2026) with TRADITIONAL cash 700000 — but NO RMDSchedule yet"
            - "PENDING Distribution amount=26315 distribution_reason=RMD tax_year=2026"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /ira/owners"
              payload: { full_name: "Olive", date_of_birth: "1953-06-06", tax_id_last4: "1515", filing_status: "SINGLE" }
              as: PlanAdministrator
              captures: { olive_id: $.data.id }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${olive_id}", account_type: "TRADITIONAL" }
              as: PlanAdministrator
              captures: { olive_trad_id: $.data.id, olive_trad_v0: $.data.version }
            - call: "POST /ira/contributions"
              payload: { account_id: "${olive_trad_id}", tax_year: 2026, amount_cents: 700000, contribution_kind: "PRETAX" }
              as: AccountOwner
              as_user_id: "${olive_id}"
              captures: { olive_c1_id: $.data.id }
            - call: "POST /ira/contributions/${olive_c1_id}/confirm"
              payload: { expected_account_version: "${olive_trad_v0}" }
              as: AccountOwner
              as_user_id: "${olive_id}"
            - call: "GET /ira/accounts/${olive_trad_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${olive_id}"
              captures: { olive_trad_v1: $.data.version }
            - call: "POST /ira/distributions"
              payload: { account_id: "${olive_trad_id}", amount_cents: 26315, distribution_reason: "RMD", tax_year: 2026 }
              as: AccountOwner
              as_user_id: "${olive_id}"
              captures: { olive_dist_id: $.data.id }
          trigger:
            - call: "POST /ira/distributions/${olive_dist_id}/confirm"
              payload: { expected_account_version: "${olive_trad_v1}" }
              as: AccountOwner
              as_user_id: "${olive_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "$.data.error_id == ERR_INVALID_STATE"
            - "Distribution.${olive_dist_id}.status == PENDING"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: contribution_tax_year_window_aggregate_capacity_overlap_on_contribution
        grounds:
          - validations[priority=11]
          - calculations.contribution_limit
          - entities.IRAAccount.fields.ytd_contribution_cents
          - entities.IRAAccount.fields.tax_year_marker
          - errors[ERR_CONTRIBUTION_CAP_EXCEEDED]
        distinguishing_aspect: |
          Interval semantics: AGGREGATE CAPACITY within a half-open tax-year window
          [Jan 1 tax_year, Jan 1 tax_year+1). Two contributions for the SAME tax_year
          on the SAME account compete for the cap; their cumulative occupation
          (ytd_contribution_cents += amount per confirm) cannot exceed the limit.
          The conflict is rejection-by-aggregation, not point-overlap; the rule
          enforces sum-of-occupations ≤ capacity. Sits on IRAAccount/Contribution.
          Different interval semantics from instance #2 (hard-endpoint cutoff).
        test_recipe:
          setup:
            - "Owner Peter (age 45 SINGLE 2026 AGI 12000000) with one TRADITIONAL account"
            - "First PRETAX 700000 CONFIRMED — ytd=700000 (50000 headroom remains under cap 750000)"
            - "Second PRETAX 60000 PENDING — would push ytd to 760000 > cap 750000"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /ira/owners"
              payload: { full_name: "Peter", date_of_birth: "1981-12-12", tax_id_last4: "1616", filing_status: "SINGLE", modified_agi_cents: 12000000 }
              as: PlanAdministrator
              captures: { peter_id: $.data.id }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${peter_id}", account_type: "TRADITIONAL" }
              as: PlanAdministrator
              captures: { peter_trad_id: $.data.id, peter_trad_v0: $.data.version }
            - call: "POST /ira/contributions"
              payload: { account_id: "${peter_trad_id}", tax_year: 2026, amount_cents: 700000, contribution_kind: "PRETAX" }
              as: AccountOwner
              as_user_id: "${peter_id}"
              captures: { peter_c1_id: $.data.id }
            - call: "POST /ira/contributions/${peter_c1_id}/confirm"
              payload: { expected_account_version: "${peter_trad_v0}" }
              as: AccountOwner
              as_user_id: "${peter_id}"
            - call: "GET /ira/accounts/${peter_trad_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${peter_id}"
              captures: { peter_trad_v1: $.data.version }
            - call: "POST /ira/contributions"
              payload: { account_id: "${peter_trad_id}", tax_year: 2026, amount_cents: 60000, contribution_kind: "PRETAX" }
              as: AccountOwner
              as_user_id: "${peter_id}"
              captures: { peter_c2_id: $.data.id }
          trigger:
            - call: "POST /ira/contributions/${peter_c2_id}/confirm"
              payload: { expected_account_version: "${peter_trad_v1}" }
              as: AccountOwner
              as_user_id: "${peter_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "$.data.error_id == ERR_CONTRIBUTION_CAP_EXCEEDED"
            - "IRAAccount.${peter_trad_id}.ytd_contribution_cents == 700000"

      - name: secure_10year_deadline_closed_endpoint_overlap_on_distribution
        grounds:
          - validations[priority=13]
          - entities.BeneficiaryDesignation.fields.secure_deadline_at
          - errors[ERR_SECURE_DEADLINE_PASSED]
          - state_machines.Distribution.PENDING_to_CONFIRMED
        distinguishing_aspect: |
          Interval semantics: HARD ENDPOINT CUTOFF on the closed window
          [owner.deceased_at, owner.deceased_at + 10y]. The remaining balance at
          beneficiary.secure_deadline_at MUST be 0; a distribution attempt that would
          leave any positive balance past the deadline is rejected. The rule is
          point-overlap with the closed endpoint, not aggregate-capacity. Sits on the
          Distribution resource (different from instance #1 which sits on Contribution).
        test_recipe:
          setup:
            - "Inherited TRADITIONAL account (cash 700000) from deceased owner Quinn, NON_ELIGIBLE_INDIVIDUAL beneficiary, secure_deadline_at=2036-06-01"
            - "Clock advanced to 2036-06-02 (one day PAST the deadline; account.cash_balance_cents still 700000)"
            - "PENDING Distribution amount=10000 distribution_reason=INHERITED"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /ira/owners"
              payload: { full_name: "Quinn", date_of_birth: "1953-07-07", tax_id_last4: "1717", filing_status: "SINGLE" }
              as: PlanAdministrator
              captures: { quinn_id: $.data.id }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${quinn_id}", account_type: "TRADITIONAL" }
              as: PlanAdministrator
              captures: { quinn_trad_id: $.data.id, quinn_trad_v0: $.data.version }
            - call: "POST /ira/contributions"
              payload: { account_id: "${quinn_trad_id}", tax_year: 2026, amount_cents: 700000, contribution_kind: "PRETAX" }
              as: AccountOwner
              as_user_id: "${quinn_id}"
              captures: { quinn_c1_id: $.data.id }
            - call: "POST /ira/contributions/${quinn_c1_id}/confirm"
              payload: { expected_account_version: "${quinn_trad_v0}" }
              as: AccountOwner
              as_user_id: "${quinn_id}"
            - call: "POST /ira/beneficiary-designations"
              payload: { account_id: "${quinn_trad_id}", beneficiary_full_name: "Cousin Cassidy", relationship: "NON_ELIGIBLE_INDIVIDUAL", percentage_bps: 10000 }
              as: AccountOwner
              as_user_id: "${quinn_id}"
              captures: { quinn_bene_id: $.data.id }
            - call: "POST /ira/beneficiary-designations/${quinn_bene_id}/activate"
              payload: {}
              as: AccountOwner
              as_user_id: "${quinn_id}"
            - call: "GET /ira/owners/${quinn_id}"
              payload: {}
              as: PlanAdministrator
              captures: { quinn_v_pre: $.data.version }
            - call: "POST /ira/owners/${quinn_id}/declare-deceased"
              payload: { deceased_at: "2026-06-01T12:00:00Z", expected_owner_version: "${quinn_v_pre}" }
              as: PlanAdministrator
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2036-06-02T00:00:00Z" }
              as: PlanAdministrator
            - call: "GET /ira/accounts/${quinn_trad_id}"
              payload: {}
              as: PlanAdministrator
              captures: { quinn_trad_v_pre: $.data.version }
            - call: "POST /ira/distributions"
              payload: { account_id: "${quinn_trad_id}", amount_cents: 10000, distribution_reason: "INHERITED", tax_year: 2036 }
              as: AccountOwner
              as_user_id: "${quinn_id}"
              captures: { quinn_dist_id: $.data.id }
          trigger:
            - call: "POST /ira/distributions/${quinn_dist_id}/confirm"
              payload: { expected_account_version: "${quinn_trad_v_pre}" }
              as: AccountOwner
              as_user_id: "${quinn_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "$.data.error_id == ERR_SECURE_DEADLINE_PASSED"
            - "IRAAccount.${quinn_trad_id}.cash_balance_cents == 700000"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: contribution_confirm_then_reverse_conserves_account_balance_and_ytd
        grounds:
          - state_machines.Contribution.PENDING_to_CONFIRMED
          - state_machines.Contribution.CONFIRMED_to_REVERSED
          - entities.IRAAccount.fields.cash_balance_cents
          - entities.IRAAccount.fields.ytd_contribution_cents
          - entities.IRAAccount.fields.pretax_basis_cents
        distinguishing_aspect: |
          Forward: Contribution PENDING → CONFIRMED. Compensating: CONFIRMED → REVERSED.
          Invariant pinned: the triple
            (IRAAccount.cash_balance_cents, IRAAccount.ytd_contribution_cents,
             IRAAccount.pretax_basis_cents)
          measured BEFORE the confirm MUST equal the triple AFTER the reverse.
          Conserved quantity TYPE: account balances + year-to-date contribution counter.
          Different conserved quantity type from instance #2 (which conserves the
          RMDSchedule satisfaction state).
        test_recipe:
          setup:
            - "Owner Roger (age 45 SINGLE 2026 AGI 12000000) with one TRADITIONAL account at cash=0, ytd=0, pretax_basis=0"
            - "PENDING Contribution: PRETAX 200000 tax_year=2026"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /ira/owners"
              payload: { full_name: "Roger", date_of_birth: "1981-01-01", tax_id_last4: "1818", filing_status: "SINGLE", modified_agi_cents: 12000000 }
              as: PlanAdministrator
              captures: { roger_id: $.data.id }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${roger_id}", account_type: "TRADITIONAL" }
              as: PlanAdministrator
              captures: { roger_trad_id: $.data.id, roger_trad_v0: $.data.version, pre_cash: $.data.cash_balance_cents, pre_ytd: $.data.ytd_contribution_cents, pre_pre: $.data.pretax_basis_cents }
            - call: "POST /ira/contributions"
              payload: { account_id: "${roger_trad_id}", tax_year: 2026, amount_cents: 200000, contribution_kind: "PRETAX" }
              as: AccountOwner
              as_user_id: "${roger_id}"
              captures: { roger_c1_id: $.data.id }
          trigger:
            - call: "POST /ira/contributions/${roger_c1_id}/confirm"
              payload: { expected_account_version: "${roger_trad_v0}" }
              as: AccountOwner
              as_user_id: "${roger_id}"
            - call: "GET /ira/accounts/${roger_trad_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${roger_id}"
              captures: { roger_trad_v1: $.data.version, mid_cash: $.data.cash_balance_cents, mid_ytd: $.data.ytd_contribution_cents }
            - call: "POST /ira/contributions/${roger_c1_id}/reverse"
              payload: { expected_account_version: "${roger_trad_v1}" }
              as: PlanAdministrator
            - call: "GET /ira/accounts/${roger_trad_id}"
              payload: {}
              as: PlanAdministrator
              captures: { post_cash: $.data.cash_balance_cents, post_ytd: $.data.ytd_contribution_cents, post_pre: $.data.pretax_basis_cents }
          assert:
            - "pre_cash == 0"
            - "mid_cash == 200000"
            - "post_cash == 0"
            - "pre_ytd == 0"
            - "post_ytd == 0"
            - "pre_pre == 0"
            - "post_pre == 0"
            - "IRAAccount.${roger_trad_id}.cash_balance_cents == 0"
            - "Contribution.${roger_c1_id}.status == REVERSED"

      - name: distribution_confirm_then_reverse_conserves_rmd_satisfaction
        grounds:
          - state_machines.Distribution.PENDING_to_CONFIRMED
          - state_machines.Distribution.CONFIRMED_to_REVERSED
          - entities.RMDSchedule.fields.satisfied_amount_cents
          - entities.RMDSchedule.fields.status
        distinguishing_aspect: |
          Forward: Distribution (RMD) PENDING → CONFIRMED. Compensating: CONFIRMED →
          REVERSED. Invariant pinned: the pair
            (RMDSchedule.satisfied_amount_cents, RMDSchedule.status)
          measured BEFORE the distribution confirm MUST equal the pair AFTER the
          reverse — the schedule must revert from SATISFIED back to OPEN with
          satisfied_amount_cents=0. Conserved quantity TYPE: RMD-satisfaction state
          (a non-monetary regulatory counter, distinct in TYPE from instance #1's
          account balance / ytd counters).
        test_recipe:
          setup:
            - "Owner Sara (age 73 2026) with TRADITIONAL cash 700000"
            - "OPEN RMDSchedule tax_year=2026 required=26315 satisfied=0"
            - "PENDING Distribution amount=26315 RMD tax_year=2026"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /ira/owners"
              payload: { full_name: "Sara", date_of_birth: "1953-03-03", tax_id_last4: "1919", filing_status: "SINGLE" }
              as: PlanAdministrator
              captures: { sara_id: $.data.id }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${sara_id}", account_type: "TRADITIONAL" }
              as: PlanAdministrator
              captures: { sara_trad_id: $.data.id, sara_trad_v0: $.data.version }
            - call: "POST /ira/contributions"
              payload: { account_id: "${sara_trad_id}", tax_year: 2026, amount_cents: 700000, contribution_kind: "PRETAX" }
              as: AccountOwner
              as_user_id: "${sara_id}"
              captures: { sara_c1_id: $.data.id }
            - call: "POST /ira/contributions/${sara_c1_id}/confirm"
              payload: { expected_account_version: "${sara_trad_v0}" }
              as: AccountOwner
              as_user_id: "${sara_id}"
            - call: "POST /ira/rmd-schedules"
              payload: { owner_id: "${sara_id}", tax_year: 2026 }
              as: PlanAdministrator
              captures: { sara_sched_id: $.data.id, pre_satisfied: $.data.satisfied_amount_cents, pre_status: $.data.status }
            - call: "GET /ira/accounts/${sara_trad_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${sara_id}"
              captures: { sara_trad_v1: $.data.version }
            - call: "POST /ira/distributions"
              payload: { account_id: "${sara_trad_id}", amount_cents: 26315, distribution_reason: "RMD", tax_year: 2026 }
              as: AccountOwner
              as_user_id: "${sara_id}"
              captures: { sara_dist_id: $.data.id }
          trigger:
            - call: "POST /ira/distributions/${sara_dist_id}/confirm"
              payload: { expected_account_version: "${sara_trad_v1}" }
              as: AccountOwner
              as_user_id: "${sara_id}"
            - call: "GET /ira/rmd-schedules/${sara_sched_id}"
              payload: {}
              as: PlanAdministrator
              captures: { mid_satisfied: $.data.satisfied_amount_cents, mid_status: $.data.status }
            - call: "GET /ira/accounts/${sara_trad_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${sara_id}"
              captures: { sara_trad_v2: $.data.version }
            - call: "POST /ira/distributions/${sara_dist_id}/reverse"
              payload: { expected_account_version: "${sara_trad_v2}" }
              as: PlanAdministrator
            - call: "GET /ira/rmd-schedules/${sara_sched_id}"
              payload: {}
              as: PlanAdministrator
              captures: { post_satisfied: $.data.satisfied_amount_cents, post_status: $.data.status }
          assert:
            - "pre_satisfied == 0"
            - "pre_status == OPEN"
            - "mid_satisfied == 26315"
            - "mid_status == SATISFIED"
            - "post_satisfied == 0"
            - "post_status == OPEN"
            - "Distribution.${sara_dist_id}.status == REVERSED"
