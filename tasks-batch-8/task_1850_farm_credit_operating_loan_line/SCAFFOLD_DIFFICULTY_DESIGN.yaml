            - { call: "POST /draw-requests", payload: { loan_account_id: "${loan}", amount_cents: 19000000, purpose: "SEED" }, as: LoanOfficer, captures: { drw: $.data.id } }
            - { call: "POST /draw-requests/${drw}/approve", as: LoanOfficer }
            - { call: "POST /draw-requests/${drw}/disburse", as: LoanOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2031-03-05T00:00:00Z" }, as: System }
          trigger:
            - { call: "POST /associations/${assoc}/run_periodic_review", as: System }
            - { call: "GET /ucc-filings/${fil}", as: LoanOfficer, captures: { fst: $.data.status } }
            - { call: "GET /collateral/${col}", as: LoanOfficer, captures: { perf: $.data.perfection_state } }
            - { call: "GET /loan-accounts/${loan}/financial_summary", as: LoanOfficer, captures: { bb: $.data.borrowing_base_cents, po: $.data.payment_posture } }
            - { call: "GET /margin-call-notices?loan_account_id=${loan}", as: LoanOfficer, captures: { mc_st: "$.data[0].status", mc_def: "$.data[0].deficiency_cents" } }
            - { call: "GET /borrowers/${bor}", as: LoanOfficer, captures: { bor_st: $.data.status } }
