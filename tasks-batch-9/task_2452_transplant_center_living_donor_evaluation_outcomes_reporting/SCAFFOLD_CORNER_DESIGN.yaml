  - name: lost_wage_nested_cap_min_flips_at_the_five_day_crossover
    claim_type: correct_result
    grounds:
    - calculations.donor_cost_reimbursement
    - entities.TransplantProgram.fields.lost_wage_daily_cap_cents
    - entities.TransplantProgram.fields.lost_wage_weekly_cap_cents
    - entities.DonorCostClaim.fields.estimated_reimbursement_cents
    distinguishing_aspect: 'The estimate is min(submitted, min(days * daily_cap, ceil(days/7) * weekly_cap)):
      at 4 days the daily cap binds (120000) and at 6 days the weekly cap binds (150000), so 5 days is
      the crossover where both caps read 150000.'
    test_recipe:
      setup:
      - D-001 is DONATED (donated_at 2026-08-09T06:00:00Z) in program NLT-01 with lost_wage_daily_cap_cents
        30000 and lost_wage_weekly_cap_cents 150000.
      - 'A 4-day LOST_WAGES claim for 200000 was already filed: daily 120000 vs weekly ceil(4/7) * 150000
        = 150000 -> estimate 120000.'
      - 'A 6-day LOST_WAGES claim for 200000 was also filed: daily 180000 vs weekly 150000 -> estimate
        150000.'
      - The trigger files the 5-day claim for the same submitted 200000.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T00:00:00Z'
        as: ProgramAdmin
      - call: POST /programs
        payload:
