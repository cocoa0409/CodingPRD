    - concurrency_rules[formulary-entry-update-stale-version]
    - endpoints.PUT /formulary-entries/{id}
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: PUT with the current expected_formulary_entry_version succeeds and bumps version 1 -> 2; a second
      PUT carrying the now-stale captured version is rejected 412 ERR_STALE_VERSION and changes nothing.
    test_recipe:
      setup:
      - Plan (DRAFT) + drug + one FormularyEntry at version 1
      setup_api_calls:
      - call: POST /plans
        payload:
          name: P-OCC
          deductible_cents: 0
          oop_max_cents: 100000
          assistance_model: ACCUMULATOR
          member_min_pay_cents: 0
          card_fill_cap_cents: 0
          dispensing_fee_cents: 0
        as: PbmAdmin
        captures:
          p_occ: $.data.id
      - call: POST /drugs
        payload:
          ndc: 00000-9039
          name: Versionex
          therapeutic_class: ANTACID
          unit_cost_cents: 100
          max_daily_dose_units: 10
          is_specialty: false
        as: PbmAdmin
        captures:
          d_occ: $.data.id
      - call: POST /formulary-entries
        payload:
          plan_id: ${p_occ}
          drug_id: ${d_occ}
          tier: 1
          quantity_limit_per_fill: 30
          max_days_supply: 30
          copay_type: FLAT
          copay_flat_cents: 100
        as: PbmAdmin
        captures:
          fe_occ: $.data.id
          fe_occ_v: $.data.version
      trigger:
      - call: PUT /formulary-entries/${fe_occ}
        payload:
          expected_formulary_entry_version: ${fe_occ_v}
          tier: 3
        as: PbmAdmin
        captures:
          fe_occ_v2: $.data.version
      - call: PUT /formulary-entries/${fe_occ}
        payload:
          expected_formulary_entry_version: ${fe_occ_v}
          tier: 4
        as: PbmAdmin
        captures:
          err_occ: $.data.error_id
      - call: GET /formulary-entries/${fe_occ}
        payload: {}
        as: PbmAdmin
      assert:
      - 'First PUT: 200, tier == 3, version == 2'
      - 'Second PUT (stale captured version): 412 ERR_STALE_VERSION; entry still tier 3, version 2'
  - name: derived_oop_max_reached_flag_and_cap
