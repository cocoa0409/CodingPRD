              as: StateAuthority
          assert:
            - "GRANT_PROVISIONAL yields authorization_status == PROVISIONAL, allowed_subtests == [MATH, RLA], max_sessions_per_week == 2, authorized_at set"
            - "GRANT_FULL on the second center yields FULL_AUTHORIZED, allowed_subtests == [MATH, RLA, SCIENCE, SOCIAL_STUDIES], max_sessions_per_week == 20"
            - "WITHDRAW yields WITHDRAWN with allowed_subtests == [] and authorized_at still null"
            - "the SCIENCE session in the provisional center's room returns 409 with data.error_id == ERR_SUBTEST_NOT_AUTHORIZED"
            - "the merge edge PROVISIONAL -> FULL_AUTHORIZED returns 200, rewrites allowed_subtests to all four and max_sessions_per_week to 20 while leaving authorized_at unchanged"
