            - "data.error_id == ERR_NOT_ELIGIBLE_FOR_CERTIFICATE"

      - name: priority_forbidden_role_over_invalid_state_on_confirm_stub
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=5]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / forbidden_role_beats_invalid_state_on_confirm
          rationale: "The auth(403)-vs-state(409) priority ordering on confirm is the exact §1.8 dual-failure instance."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: revoke_certificate_still_valid_rejected
        claim_type: Conditional action
        grounds:
          - state_machines.Certificate.ISSUED_to_REVOKED
          - errors[ERR_CERTIFICATE_STILL_VALID]
          - endpoints."POST /training/certificates/{id}/revoke"
        distinguishing_aspect: "Manually revoking a certificate whose registration is ATTENDED and assessment not VOIDED returns ERR_CERTIFICATE_STILL_VALID (409)."
        test_recipe:
          setup:
            - "ATTENDED registration with a PASS assessment and an ISSUED certificate; assessment not voided"
          setup_api_calls:
            - call: "POST /training/programs"
              payload: { title: "Rev Prog", category: "TECHNICAL", delivery_mode: "ONSITE", ceu_credits: 8 }
              as: ProgramDesigner
