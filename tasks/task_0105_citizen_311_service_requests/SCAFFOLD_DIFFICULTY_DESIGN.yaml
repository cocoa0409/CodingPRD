  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: maintenance_window_closed_interval_touching_collides
        grounds:
          - calculations.window_overlap
          - validations[priority=20]
          - entities.ServiceWindow.fields.window_type
        distinguishing_aspect: |
          MAINTENANCE windows on a Department use CLOSED-interval semantics: a second window starting
          exactly at the first's end (10:00 == 10:00) COLLIDES and is rejected with ERR_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "A department with a MAINTENANCE window [2026-06-01T08:00:00Z, 2026-06-01T10:00:00Z]; a second MAINTENANCE window on the same department [2026-06-01T10:00:00Z, 2026-06-01T12:00:00Z] that touches the first."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /departments"
              payload: { name: "Streets", backlog_threshold: 5 }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /service-windows"
              payload: { window_type: "MAINTENANCE", department_id: "${dept_id}", starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T10:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /service-windows"
              payload: { window_type: "MAINTENANCE", department_id: "${dept_id}", starts_at: "2026-06-01T10:00:00Z", ends_at: "2026-06-01T12:00:00Z" }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_WINDOW_OVERLAP"

      - name: blackout_window_half_open_touching_allowed
        grounds:
          - calculations.window_overlap
          - validations[priority=20]
          - entities.ServiceWindow.fields.window_type
        distinguishing_aspect: |
          BLACKOUT windows on a Jurisdiction use HALF-OPEN [start,end) semantics (different interval
          arithmetic, different resource entity than the MAINTENANCE/Department case): a second window
          starting exactly at the first's end (10:00 == 10:00) does NOT collide and is accepted (201).
        test_recipe:
          setup:
            - "A jurisdiction with a BLACKOUT window [2026-06-01T08:00:00Z, 2026-06-01T10:00:00Z); a second BLACKOUT on the same jurisdiction [2026-06-01T10:00:00Z, 2026-06-01T12:00:00Z) that touches the first."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /jurisdictions"
              payload: { name: "J1", min_lat: 41.80, max_lat: 41.95, min_lng: -87.70, max_lng: -87.55 }
              as: SystemAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /service-windows"
              payload: { window_type: "BLACKOUT", jurisdiction_id: "${jur_id}", starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T10:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /service-windows"
              payload: { window_type: "BLACKOUT", jurisdiction_id: "${jur_id}", starts_at: "2026-06-01T10:00:00Z", ends_at: "2026-06-01T12:00:00Z" }
              as: SystemAdmin
              captures: { w2: $.data.id }
          assert:
            - "response.status == 201"
            - "ServiceWindow.${w2}.window_type == BLACKOUT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: department_backlog_conserved_across_complete_then_reopen
        grounds:
          - calculations.department_backlog
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
          - state_machines.WorkOrder.COMPLETED_to_REOPENED
        distinguishing_aspect: |
          Conserved quantity = Department.open_work_order_count (an integer backlog). Forward action
          complete decrements it (1 -> 0); the compensating action reopen increments it back (0 -> 1).
          Invariant pinned as open_work_order_count == count(WorkOrder where dept and status IN
          {OPEN,IN_PROGRESS,REOPENED}); after complete-then-reopen the count returns to 1.
        test_recipe:
          setup:
            - "A single routed+started work order on a department (open count 1)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: SystemAdmin
            - call: "POST /departments"
              payload: { name: "Streets", backlog_threshold: 5 }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "Pothole", code: "POTHOLE", default_priority: "STANDARD", default_department_id: "${dept_id}", requires_geolocation: false }
              as: SystemAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /sla-policies"
              payload: { category_id: "${cat_id}", priority: "STANDARD", resolution_sla_hours: 24, escalation_tier1_hours: 2, escalation_tier2_hours: 6 }
              as: SystemAdmin
            - call: "POST /citizens"
              payload: { email: "c@x.com", full_name: "C" }
              as: Anonymous
              captures: { citizen_id: $.data.id }
            - call: "POST /agents"
              payload: { department_id: "${dept_id}", full_name: "Ag" }
              as: SystemAdmin
              captures: { agent_id: $.data.id }
            - call: "POST /service-requests"
              payload: { citizen_id: "${citizen_id}", category_id: "${cat_id}", description: "r" }
              as: Citizen
              as_user_id: "${citizen_id}"
              captures: { req_id: $.data.id }
            - call: "POST /service-requests/${req_id}/triage"
              payload: {}
              as: Dispatcher
            - call: "POST /service-requests/${req_id}/route"
              payload: {}
              as: Dispatcher
            - call: "GET /work-orders"
              payload: { request_id: "${req_id}" }
              as: Dispatcher
              captures: { wo_id: $.data.0.id, wo_v: $.data.0.version }
            - call: "POST /work-orders/${wo_id}/assign"
              payload: { assigned_agent_id: "${agent_id}", expected_work_order_version: "${wo_v}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Agent
              as_user_id: "${agent_id}"
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { completion_note: "fixed" }
              as: Agent
              as_user_id: "${agent_id}"
          trigger:
            - call: "POST /service-requests/${req_id}/reopen"
              payload: {}
              as: Citizen
              as_user_id: "${citizen_id}"
            - call: "GET /departments/${dept_id}"
              payload: {}
              as: Dispatcher
              captures: { open_ct: $.data.open_work_order_count }
          assert:
            - "Department.${dept_id}.open_work_order_count == 1"
            - "Department.${dept_id}.congested == false"

      - name: open_escalation_count_conserved_across_breach_then_resolve
        grounds:
          - calculations.sla_breach_sweep
          - state_machines.ServiceRequest.IN_PROGRESS_to_RESOLVED
          - state_machines.Escalation.OPEN_to_RESOLVED
        distinguishing_aspect: |
          Conserved quantity = per-request count of OPEN escalations (a different conserved quantity
          than department backlog). Forward action (SLA breach sweep) creates one OPEN escalation
          (count 0 -> 1); the compensating action (request reaching RESOLVED on completion) resolves it
          (count 1 -> 0). After breach-then-resolve the open-escalation count returns to 0.
        test_recipe:
          setup:
            - "A routed+started request breached once (one OPEN escalation); agent then completes the work order."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: SystemAdmin
            - call: "POST /departments"
              payload: { name: "Streets", backlog_threshold: 5 }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "Pothole", code: "POTHOLE", default_priority: "STANDARD", default_department_id: "${dept_id}", requires_geolocation: false }
              as: SystemAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /sla-policies"
              payload: { category_id: "${cat_id}", priority: "STANDARD", resolution_sla_hours: 24, escalation_tier1_hours: 2, escalation_tier2_hours: 6 }
              as: SystemAdmin
            - call: "POST /citizens"
              payload: { email: "c@x.com", full_name: "C" }
              as: Anonymous
              captures: { citizen_id: $.data.id }
            - call: "POST /agents"
              payload: { department_id: "${dept_id}", full_name: "Ag" }
              as: SystemAdmin
              captures: { agent_id: $.data.id }
            - call: "POST /service-requests"
              payload: { citizen_id: "${citizen_id}", category_id: "${cat_id}", description: "r" }
              as: Citizen
              as_user_id: "${citizen_id}"
              captures: { req_id: $.data.id }
            - call: "POST /service-requests/${req_id}/triage"
              payload: {}
              as: Dispatcher
            - call: "POST /service-requests/${req_id}/route"
              payload: {}
              as: Dispatcher
            - call: "GET /work-orders"
              payload: { request_id: "${req_id}" }
              as: Dispatcher
              captures: { wo_id: $.data.0.id, wo_v: $.data.0.version }
            - call: "POST /work-orders/${wo_id}/assign"
              payload: { assigned_agent_id: "${agent_id}", expected_work_order_version: "${wo_v}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Agent
              as_user_id: "${agent_id}"
            - call: "POST /_clock/advance"
              payload: { hours: 27 }
              as: SystemAdmin
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { completion_note: "fixed" }
              as: Agent
              as_user_id: "${agent_id}"
            - call: "GET /service-requests/${req_id}/escalations"
              payload: {}
              as: Dispatcher
              captures: { esc_status: $.data.0.status }
          assert:
            - "ServiceRequest.${req_id}.status == RESOLVED"
            - "count of OPEN Escalation on ${req_id} == 0"
            - "every Escalation on ${req_id} has status == RESOLVED"
