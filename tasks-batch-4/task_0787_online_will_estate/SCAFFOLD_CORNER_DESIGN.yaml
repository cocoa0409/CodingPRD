scaffold_corner_design:
  # =================================================================
  - section: entities
    instances:
      - name: subscription_creation_returns_fields
        claim_type: creation
        grounds:
          - entities.Subscription.fields.price_cents
          - 'endpoints["POST /v1/subscriptions"]'
        distinguishing_aspect: "POST /v1/subscriptions returns 201 with status PENDING_PAYMENT, computed price_cents 20000, version 1."
        test_recipe:
          setup: ["PLUS plan in catalog; a registered member."]
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { plan_tier: "PLUS", base_price_cents: 20000, included_document_types: ["WILL"], max_documents: 10, allows_trust: false }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "c1@x.com", full_name: "C One", state_code: "CA" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
          trigger:
            - call: "POST /v1/subscriptions"
              payload: { member_id: "${m_id}", plan_tier: "PLUS", bundle_type: "INDIVIDUAL" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: "$.data.id" }
          assert:
            - "Subscription.${sub_id}.status == PENDING_PAYMENT"
            - "Subscription.${sub_id}.price_cents == 20000"
            - "Subscription.${sub_id}.version == 1"

      - name: bundle_type_default_individual
        claim_type: defaults
        grounds:
          - entities.Subscription.fields.bundle_type
        distinguishing_aspect: "Omitting bundle_type defaults it to INDIVIDUAL (multiplier 1.0), so PLUS price stays 20000."
        test_recipe:
          setup: ["PLUS plan; a registered member."]
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { plan_tier: "PLUS", base_price_cents: 20000, included_document_types: ["WILL"], max_documents: 10, allows_trust: false }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "c2@x.com", full_name: "C Two", state_code: "CA" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
          trigger:
            - call: "POST /v1/subscriptions"
              payload: { member_id: "${m_id}", plan_tier: "PLUS" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: "$.data.id" }
          assert:
            - "Subscription.${sub_id}.bundle_type == INDIVIDUAL"
            - "Subscription.${sub_id}.price_cents == 20000"

      - name: get_subscription_not_found_returns_404
        claim_type: not_found
        grounds:
          - 'errors[ERR_SUBSCRIPTION_NOT_FOUND]'
          - 'endpoints["GET /v1/subscriptions/{id}"]'
        distinguishing_aspect: "GET /v1/subscriptions/{unknown-uuid} returns ERR_SUBSCRIPTION_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty subscription set (a member exists only to authenticate)."]
          setup_api_calls:
            - call: "POST /v1/members"
              payload: { email: "c3@x.com", full_name: "C Three", state_code: "CA" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
          trigger:
            - call: "GET /v1/subscriptions/00000000-0000-4000-8000-000000000000"
              as: Member
              as_user_id: "${m_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_SUBSCRIPTION_NOT_FOUND"

      - name: create_subscription_missing_member_id_returns_invalid_request
        claim_type: required_fields
        grounds:
          - 'errors[ERR_VALIDATION]'
          - 'endpoints["POST /v1/subscriptions"]'
        distinguishing_aspect: "POST /v1/subscriptions without required member_id returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["PLUS plan in catalog; a member for auth."]
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { plan_tier: "PLUS", base_price_cents: 20000, included_document_types: ["WILL"], max_documents: 10, allows_trust: false }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "c4@x.com", full_name: "C Four", state_code: "CA" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
          trigger:
            - call: "POST /v1/subscriptions"
              payload: { plan_tier: "PLUS", bundle_type: "INDIVIDUAL" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: questionnaire_completeness_computed_partial
        claim_type: computed_fields
        grounds:
          - calculations.questionnaire_completeness
          - entities.Questionnaire.fields.completeness_pct
        distinguishing_aspect: "Answering 3 of the 5 WILL required fields yields completeness_pct 60.00 and status IN_PROGRESS."
        test_recipe:
          setup: ["ACTIVE subscription; a fresh WILL questionnaire (required_field_count 5)."]
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { plan_tier: "PLUS", base_price_cents: 20000, included_document_types: ["WILL"], max_documents: 10, allows_trust: false }
              as: PlatformAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "c5@x.com", full_name: "C Five", state_code: "CA" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /v1/subscriptions"
              payload: { member_id: "${m_id}", plan_tier: "PLUS", bundle_type: "INDIVIDUAL" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /v1/_payments/simulate"
              payload: { subscription_id: "${sub_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /v1/questionnaires"
              payload: { subscription_id: "${sub_id}", document_type: "WILL", state_code: "CA" }
              as: Member
              as_user_id: "${m_id}"
              captures: { q_id: "$.data.id" }
          trigger:
            - call: "POST /v1/questionnaires/${q_id}/answers"
              payload: { answers: { q1: "a", q2: "b", q3: "c" } }
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Questionnaire.${q_id}.completeness_pct == 60.00"
            - "Questionnaire.${q_id}.status == IN_PROGRESS"

  # =================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_returns_terminal
        claim_type: terminal_lockdown
        grounds:
          - 'errors[ERR_ALREADY_TERMINAL]'
          - state_machines.Subscription.ACTIVE_to_CANCELLED
        distinguishing_aspect: "A second cancel on a CANCELLED subscription returns ERR_ALREADY_TERMINAL; no further side effects."
        test_recipe:
          setup: ["ACTIVE subscription already cancelled once (status CANCELLED)."]
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { plan_tier: "PLUS", base_price_cents: 20000, included_document_types: ["WILL"], max_documents: 10, allows_trust: false }
              as: PlatformAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "c6@x.com", full_name: "C Six", state_code: "CA" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /v1/subscriptions"
              payload: { member_id: "${m_id}", plan_tier: "PLUS", bundle_type: "INDIVIDUAL" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /v1/_payments/simulate"
              payload: { subscription_id: "${sub_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /v1/subscriptions/${sub_id}/cancel"
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /v1/subscriptions/${sub_id}/cancel"
              as: Member
              as_user_id: "${m_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_ALREADY_TERMINAL"
            - "Subscription.${sub_id}.status == CANCELLED"

      - name: execute_from_executed_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - 'errors[ERR_INVALID_STATE]'
          - state_machines.EstateDocument.GENERATED_to_EXECUTED
        distinguishing_aspect: "Executing a document already EXECUTED returns ERR_INVALID_STATE (execute requires GENERATED/PENDING_EXECUTION)."
        test_recipe:
          setup: ["ACTIVE subscription with an EXECUTED WILL document and a beneficiary."]
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { plan_tier: "PLUS", base_price_cents: 20000, included_document_types: ["WILL"], max_documents: 10, allows_trust: false }
              as: PlatformAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "c7@x.com", full_name: "C Seven", state_code: "CA" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /v1/subscriptions"
              payload: { member_id: "${m_id}", plan_tier: "PLUS", bundle_type: "INDIVIDUAL" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /v1/_payments/simulate"
              payload: { subscription_id: "${sub_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /v1/beneficiaries"
              payload: { subscription_id: "${sub_id}", full_name: "Heir", relationship: "CHILD", allocation_pct: 100 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /v1/questionnaires"
              payload: { subscription_id: "${sub_id}", document_type: "WILL", state_code: "CA" }
              as: Member
              as_user_id: "${m_id}"
              captures: { q_id: "$.data.id" }
            - call: "POST /v1/questionnaires/${q_id}/answers"
              payload: { answers: { q1: "a", q2: "b", q3: "c", q4: "d", q5: "e" } }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /v1/documents"
              payload: { questionnaire_id: "${q_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { doc_id: "$.data.id" }
            - call: "POST /v1/documents/${doc_id}/execute"
              payload: { witnesses_count: 2 }
              as: Notary
          trigger:
            - call: "POST /v1/documents/${doc_id}/execute"
              payload: { witnesses_count: 2 }
              as: Notary
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "EstateDocument.${doc_id}.status == EXECUTED"

      - name: respond_executor_twice_returns_invalid_state
        claim_type: idempotency
        grounds:
          - 'errors[ERR_INVALID_STATE]'
          - state_machines.Executor.NOMINATED_to_ACCEPTED
        distinguishing_aspect: "Responding ACCEPT to an already-ACCEPTED executor returns ERR_INVALID_STATE (respond requires NOMINATED)."
        test_recipe:
          setup: ["ACTIVE subscription with an executor already ACCEPTED."]
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { plan_tier: "PLUS", base_price_cents: 20000, included_document_types: ["WILL"], max_documents: 10, allows_trust: false }
              as: PlatformAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "c8@x.com", full_name: "C Eight", state_code: "CA" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /v1/subscriptions"
              payload: { member_id: "${m_id}", plan_tier: "PLUS", bundle_type: "INDIVIDUAL" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /v1/_payments/simulate"
              payload: { subscription_id: "${sub_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /v1/executors"
              payload: { subscription_id: "${sub_id}", full_name: "Ex One", email: "ex@x.com", priority_order: 1 }
              as: Member
              as_user_id: "${m_id}"
              captures: { ex_id: "$.data.id" }
            - call: "POST /v1/executors/${ex_id}/respond"
              payload: { decision: "ACCEPT" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /v1/executors/${ex_id}/respond"
              payload: { decision: "ACCEPT" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Executor.${ex_id}.status == ACCEPTED"

  # =================================================================
  - section: calculations
    instances:
      - name: witness_requirement_la_will_surcharge
        claim_type: correct_result
        grounds:
          - calculations.witness_requirement
          - entities.EstateDocument.fields.witness_count_required
          - entities.EstateDocument.fields.requires_notary
        distinguishing_aspect: "A WILL in LA computes witness_count_required 3 (base 2 + LA surcharge 1) and requires_notary true."
        test_recipe:
          setup: ["ACTIVE subscription; a COMPLETED WILL questionnaire with state_code LA."]
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { plan_tier: "PLUS", base_price_cents: 20000, included_document_types: ["WILL"], max_documents: 10, allows_trust: false }
              as: PlatformAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "c9@x.com", full_name: "C Nine", state_code: "LA" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /v1/subscriptions"
              payload: { member_id: "${m_id}", plan_tier: "PLUS", bundle_type: "INDIVIDUAL" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /v1/_payments/simulate"
              payload: { subscription_id: "${sub_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /v1/questionnaires"
              payload: { subscription_id: "${sub_id}", document_type: "WILL", state_code: "LA" }
              as: Member
              as_user_id: "${m_id}"
              captures: { q_id: "$.data.id" }
            - call: "POST /v1/questionnaires/${q_id}/answers"
              payload: { answers: { q1: "a", q2: "b", q3: "c", q4: "d", q5: "e" } }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /v1/documents"
              payload: { questionnaire_id: "${q_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { doc_id: "$.data.id" }
          assert:
            - "EstateDocument.${doc_id}.witness_count_required == 3"
            - "EstateDocument.${doc_id}.requires_notary == true"

      - name: signup_price_basic_individual
        claim_type: correct_result
        grounds:
          - calculations.signup_price
          - entities.Subscription.fields.price_cents
        distinguishing_aspect: "BASIC INDIVIDUAL with no add-on prices at exactly 10000 ((10000+0)*1.0)."
        test_recipe:
          setup: ["BASIC plan in catalog; a member."]
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { plan_tier: "BASIC", base_price_cents: 10000, included_document_types: ["WILL"], max_documents: 3, allows_trust: false }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "c10@x.com", full_name: "C Ten", state_code: "CA" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
          trigger:
            - call: "POST /v1/subscriptions"
              payload: { member_id: "${m_id}", plan_tier: "BASIC", bundle_type: "INDIVIDUAL" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: "$.data.id" }
          assert:
            - "Subscription.${sub_id}.price_cents == 10000"

      - name: cancel_refund_midperiod_prorated
        claim_type: correct_result
        grounds:
          - calculations.cancel_refund
          - entities.Subscription.fields.refunded_cents
        distinguishing_aspect: "Cancelling a 20000 PLUS subscription at 2026-12-01 (182 days remaining of 365) refunds round(20000*182/365) = 9973."
        test_recipe:
          setup: ["PLUS subscription ACTIVE for [2026-06-01, 2027-06-01); clock advanced to 2026-12-01."]
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { plan_tier: "PLUS", base_price_cents: 20000, included_document_types: ["WILL"], max_documents: 10, allows_trust: false }
              as: PlatformAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "c11@x.com", full_name: "C Eleven", state_code: "CA" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /v1/subscriptions"
              payload: { member_id: "${m_id}", plan_tier: "PLUS", bundle_type: "INDIVIDUAL" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /v1/_payments/simulate"
              payload: { subscription_id: "${sub_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/subscriptions/${sub_id}/cancel"
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Subscription.${sub_id}.status == CANCELLED"
            - "Subscription.${sub_id}.refunded_cents == 9973"
            - "Subscription.${sub_id}.paid_to_date_cents == 10027"

  # =================================================================
  - section: validations
    instances:
      - name: renew_before_window_returns_window_not_open
        claim_type: violation_to_error
        grounds:
          - 'validations[priority=11]'
          - 'errors[ERR_RENEWAL_WINDOW_NOT_OPEN]'
        distinguishing_aspect: "Renewing at 2026-07-01 (window opens 2027-05-02) returns ERR_RENEWAL_WINDOW_NOT_OPEN."
        test_recipe:
          setup: ["PLUS subscription ACTIVE for [2026-06-01, 2027-06-01); clock at 2026-07-01 (before renewal window)."]
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { plan_tier: "PLUS", base_price_cents: 20000, included_document_types: ["WILL"], max_documents: 10, allows_trust: false }
              as: PlatformAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "c12@x.com", full_name: "C Twelve", state_code: "CA" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /v1/subscriptions"
              payload: { member_id: "${m_id}", plan_tier: "PLUS", bundle_type: "INDIVIDUAL" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /v1/_payments/simulate"
              payload: { subscription_id: "${sub_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/subscriptions/${sub_id}/renew"
              as: Member
              as_user_id: "${m_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_RENEWAL_WINDOW_NOT_OPEN"
            - "Subscription.${sub_id}.renewal_pending == false"

      - name: generate_trust_not_in_plan_returns_error
        claim_type: violation_to_error
        grounds:
          - 'validations[priority=16]'
          - 'errors[ERR_DOCUMENT_TYPE_NOT_IN_PLAN]'
        distinguishing_aspect: "Generating a TRUST on a BASIC plan (included_document_types [WILL,TRUST] but allows_trust false) returns ERR_DOCUMENT_TYPE_NOT_IN_PLAN."
        test_recipe:
          setup: ["BASIC plan that lists TRUST in included types but has allows_trust false; ACTIVE subscription; a COMPLETED TRUST questionnaire (7 answers)."]
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { plan_tier: "BASIC", base_price_cents: 10000, included_document_types: ["WILL","TRUST"], max_documents: 10, allows_trust: false }
              as: PlatformAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "c13@x.com", full_name: "C Thirteen", state_code: "CA" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /v1/subscriptions"
              payload: { member_id: "${m_id}", plan_tier: "BASIC", bundle_type: "INDIVIDUAL" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /v1/_payments/simulate"
              payload: { subscription_id: "${sub_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /v1/questionnaires"
              payload: { subscription_id: "${sub_id}", document_type: "TRUST", state_code: "CA" }
              as: Member
              as_user_id: "${m_id}"
              captures: { q_id: "$.data.id" }
            - call: "POST /v1/questionnaires/${q_id}/answers"
              payload: { answers: { q1: "a", q2: "b", q3: "c", q4: "d", q5: "e", q6: "f", q7: "g" } }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /v1/documents"
              payload: { questionnaire_id: "${q_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_DOCUMENT_TYPE_NOT_IN_PLAN"

      - name: execute_insufficient_witnesses_returns_error
        claim_type: violation_to_error
        grounds:
          - 'validations[priority=19]'
          - 'errors[ERR_WITNESS_REQUIREMENT_NOT_MET]'
        distinguishing_aspect: "Executing a CA WILL (witness_count_required 2) with witnesses_count 1 returns ERR_WITNESS_REQUIREMENT_NOT_MET."
        test_recipe:
          setup: ["ACTIVE subscription; GENERATED CA WILL; one non-contingent beneficiary present."]
          setup_api_calls:
            - call: "POST /v1/plan-catalog"
              payload: { plan_tier: "PLUS", base_price_cents: 20000, included_document_types: ["WILL"], max_documents: 10, allows_trust: false }
              as: PlatformAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "c14@x.com", full_name: "C Fourteen", state_code: "CA" }
