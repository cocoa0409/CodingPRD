  - rule_id: resource_temporal_overlap
    instances:
      - name: payment_standard_effective_window_latest_wins
        grounds:
          - calculations.rent_reasonableness
          - entities.PaymentStandard.fields.effective_from
        distinguishing_aspect: |
          Interval semantics: half-open/overlapping effective windows resolved by
          "latest effective_from wins; ties broken by created_at ASC". Two
          PaymentStandard rows for (zip,bedrooms) with overlapping windows —
          150000 effective 2026-01-01 and 170000 effective 2026-06-01 — the row with
          effective_from 2026-06-01 governs a 2026-08-01 lease. Semantics: point-in-window
          selection, not adjacency/capacity.
        test_recipe:
          setup:
            - "Two overlapping PaymentStandard rows for (90016,1BR): 150000 from 2026-01-01, 170000 from 2026-06-01"
          setup_api_calls:
            - call: "POST /hcv/landlords"
              payload: { legal_name: "L 15", tax_id: "T15" }
              as: HousingAuthorityAdmin
              captures: { landlord15_id: $.data.id }
            - call: "POST /hcv/payment-standards"
              payload: { zip_code: "90016", bedroom_count: 1, amount_cents: 150000, effective_from: "2026-01-01" }
              as: HousingAuthorityAdmin
            - call: "POST /hcv/payment-standards"
              payload: { zip_code: "90016", bedroom_count: 1, amount_cents: 170000, effective_from: "2026-06-01" }
              as: HousingAuthorityAdmin
            - call: "POST /hcv/properties"
              payload: { landlord_id: "${landlord15_id}", address: "15 O St", zip_code: "90016" }
              as: HousingAuthorityAdmin
              captures: { property15_id: $.data.id }
            - call: "POST /hcv/properties/${property15_id}/units"
              payload: { unit_label: "UF", bedroom_count: 1 }
              as: HousingAuthorityAdmin
              captures: { unitF_id: $.data.id, unitF_v: $.data.version }
            - call: "POST /hcv/voucher-families"
              payload: { family_code: "FF", voucher_bedroom_size: 1, annual_income_cents: 2400000 }
              as: HousingAuthorityAdmin
              captures: { familyF_id: $.data.id }
            - call: "POST /hcv/contracts"
              payload: { unit_id: "${unitF_id}", family_id: "${familyF_id}", contract_rent_cents: 200000, lease_start_date: "2026-08-01", expected_unit_version: "${unitF_v}" }
              as: Landlord
              as_user_id: "${landlord15_id}"
              captures: { contractF_id: $.data.id }
          trigger:
            - call: "POST /hcv/contracts/${contractF_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${landlord15_id}"
          assert:
            - "approved_rent_cents == 170000 (latest effective_from row 2026-06-01 governs; 150000 row shadowed)"
      - name: unit_single_live_contract_temporal_exclusion
        grounds:
          - validations[priority=11]
          - entities.HAPContract.fields.status
        distinguishing_aspect: |
          Different interval semantics from instance 1: a unit is exclusively occupied
          by any HAPContract in a non-terminal status set {DRAFT, PENDING_INSPECTION,
          APPROVED, ACTIVE, ABATED} — a set-membership exclusion, not a point-in-window
          selection. Creating a second contract on the same unit while one is live is
          rejected with ERR_UNIT_ALREADY_UNDER_CONTRACT.
        test_recipe:
          setup:
            - "Unit UG already has a DRAFT contract; attempt a second contract on UG"
          setup_api_calls:
            - call: "POST /hcv/landlords"
              payload: { legal_name: "L 16", tax_id: "T16" }
              as: HousingAuthorityAdmin
              captures: { landlord16_id: $.data.id }
            - call: "POST /hcv/properties"
              payload: { landlord_id: "${landlord16_id}", address: "16 P St", zip_code: "90017" }
              as: HousingAuthorityAdmin
              captures: { property16_id: $.data.id }
            - call: "POST /hcv/properties/${property16_id}/units"
              payload: { unit_label: "UG", bedroom_count: 1 }
              as: HousingAuthorityAdmin
              captures: { unitG_id: $.data.id, unitG_v: $.data.version }
            - call: "POST /hcv/voucher-families"
              payload: { family_code: "FG", voucher_bedroom_size: 1, annual_income_cents: 2400000 }
              as: HousingAuthorityAdmin
              captures: { familyG_id: $.data.id }
            - call: "POST /hcv/contracts"
              payload: { unit_id: "${unitG_id}", family_id: "${familyG_id}", contract_rent_cents: 150000, lease_start_date: "2026-08-01", expected_unit_version: "${unitG_v}" }
              as: Landlord
              as_user_id: "${landlord16_id}"
              captures: { contractG_id: $.data.id }
          trigger:
            - call: "POST /hcv/contracts"
              payload: { unit_id: "${unitG_id}", family_id: "${familyG_id}", contract_rent_cents: 150000, lease_start_date: "2026-08-01", expected_unit_version: "${unitG_v}" }
              as: Landlord
              as_user_id: "${landlord16_id}"
              captures: { err_id6: $.data.error_id }
          assert:
            - "Second contract on same unit rejected with ERR_INVALID_STATE (Unit flipped LISTED->UNDER_CONTRACT on first create, so second create hits state precondition) or ERR_UNIT_ALREADY_UNDER_CONTRACT — one live-contract-per-unit exclusion enforced"

  - rule_id: compensating_invariant
    instances:
      - name: submit_withdraw_restores_zero_portions
        grounds:
          - state_machines.HAPContract.DRAFT_to_PENDING_INSPECTION
          - state_machines.HAPContract.PENDING_INSPECTION_to_DRAFT
        distinguishing_aspect: |
          Conserved quantity: the contract's monetary portion fields. Invariant:
          forward (submit sets approved_rent/hap/tenant) paired with compensation
          (withdraw) restores approved_rent_cents == 0, hap_portion_cents == 0,
          tenant_portion_cents == 0, and status == DRAFT — no drift in the monetary
          triple.
        test_recipe:
          setup:
            - "Fresh DRAFT contract"
          setup_api_calls:
            - call: "POST /hcv/landlords"
              payload: { legal_name: "L 17", tax_id: "T17" }
              as: HousingAuthorityAdmin
              captures: { landlord17_id: $.data.id }
            - call: "POST /hcv/payment-standards"
              payload: { zip_code: "90018", bedroom_count: 1, amount_cents: 150000, effective_from: "2026-01-01" }
              as: HousingAuthorityAdmin
            - call: "POST /hcv/properties"
              payload: { landlord_id: "${landlord17_id}", address: "17 Q St", zip_code: "90018" }
              as: HousingAuthorityAdmin
              captures: { property17_id: $.data.id }
            - call: "POST /hcv/properties/${property17_id}/units"
              payload: { unit_label: "UH", bedroom_count: 1 }
              as: HousingAuthorityAdmin
              captures: { unitH_id: $.data.id, unitH_v: $.data.version }
            - call: "POST /hcv/voucher-families"
              payload: { family_code: "FH", voucher_bedroom_size: 1, annual_income_cents: 2400000 }
              as: HousingAuthorityAdmin
              captures: { familyH_id: $.data.id }
            - call: "POST /hcv/contracts"
              payload: { unit_id: "${unitH_id}", family_id: "${familyH_id}", contract_rent_cents: 150000, lease_start_date: "2026-08-01", expected_unit_version: "${unitH_v}" }
              as: Landlord
              as_user_id: "${landlord17_id}"
              captures: { contractH_id: $.data.id }
          trigger:
            - call: "POST /hcv/contracts/${contractH_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${landlord17_id}"
            - call: "POST /hcv/contracts/${contractH_id}/withdraw"
              payload: {}
              as: Landlord
              as_user_id: "${landlord17_id}"
          assert:
            - "After submit+withdraw: HAPContract.${contractH_id}.status == DRAFT"
            - "HAPContract.${contractH_id}.approved_rent_cents == 0"
            - "HAPContract.${contractH_id}.hap_portion_cents == 0"
            - "HAPContract.${contractH_id}.tenant_portion_cents == 0"
      - name: abatement_and_cure_conserve_total_hap_minus_abated_days
        grounds:
          - calculations.abatement_proration
          - state_machines.HAPContract.ABATED_to_ACTIVE
        distinguishing_aspect: |
          Conserved quantity of a DIFFERENT type than instance 1 (monetary-time
          integral rather than monetary triple): total HAP disbursed across the
          abatement episode equals full-month HAP minus exactly the per-day deduction
          for days in ABATED status. Forward (abate holds payments) + compensation
          (cure recomputes) must leave sum(hap_amount_cents) == sum(hap_portion) -
          deduction, with no drift.
        test_recipe:
          setup:
            - "Active contract hap_portion 90000; abate for exactly 10 days of a 31-day month, then cure"
          setup_api_calls:
            - call: "POST /hcv/landlords"
              payload: { legal_name: "L 18", tax_id: "T18" }
              as: HousingAuthorityAdmin
              captures: { landlord18_id: $.data.id }
            - call: "POST /hcv/payment-standards"
              payload: { zip_code: "90019", bedroom_count: 1, amount_cents: 150000, effective_from: "2026-01-01" }
              as: HousingAuthorityAdmin
            - call: "POST /hcv/properties"
              payload: { landlord_id: "${landlord18_id}", address: "18 R St", zip_code: "90019" }
              as: HousingAuthorityAdmin
              captures: { property18_id: $.data.id }
            - call: "POST /hcv/properties/${property18_id}/units"
              payload: { unit_label: "UI", bedroom_count: 1 }
              as: HousingAuthorityAdmin
              captures: { unitI_id: $.data.id, unitI_v: $.data.version }
            - call: "POST /hcv/voucher-families"
              payload: { family_code: "FI", voucher_bedroom_size: 1, annual_income_cents: 2400000 }
              as: HousingAuthorityAdmin
              captures: { familyI_id: $.data.id }
            - call: "POST /hcv/contracts"
              payload: { unit_id: "${unitI_id}", family_id: "${familyI_id}", contract_rent_cents: 150000, lease_start_date: "2026-08-01", expected_unit_version: "${unitI_v}" }
              as: Landlord
              as_user_id: "${landlord18_id}"
              captures: { contractI_id: $.data.id }
            - call: "POST /hcv/contracts/${contractI_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${landlord18_id}"
            - call: "POST /hcv/contracts/${contractI_id}/activate"
              payload: {}
              as: HousingAuthorityAdmin
            - call: "POST /hcv/contracts/${contractI_id}/inspections"
              payload: { inspection_type: "ANNUAL", scheduled_date: "2026-08-05" }
              as: HousingAuthorityAdmin
              captures: { inspI_id: $.data.id }
            - call: "POST /hcv/inspections/${inspI_id}/repair-items"
              payload: { description: "leak", is_life_threatening: false }
              as: Inspector
              captures: { itemI_id: $.data.id }
            - call: "POST /hcv/inspections/${inspI_id}/record-result"
              payload: { outcome: "FAIL" }
              as: Inspector
            - call: "POST /hcv/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: HousingAuthorityAdmin
          trigger:
            - call: "POST /hcv/repair-items/${itemI_id}/mark-repaired"
              payload: {}
              as: Landlord
              as_user_id: "${landlord18_id}"
            - call: "POST /hcv/inspections/${inspI_id}/request-reinspection"
              payload: {}
              as: Landlord
              as_user_id: "${landlord18_id}"
            - call: "POST /hcv/repair-items/${itemI_id}/verify"
              payload: { outcome: "PASS" }
              as: Inspector
          assert:
            - "After cure: HAPContract.${contractI_id}.status == ACTIVE"
            - "ABATED_HELD payments recomputed: sum of hap_amount_cents equals sum(hap_portion_cents) minus per-row round_half_up deductions for abated days — conserved monetary-time invariant"
            - "Unit.${unitI_id}.status == UNDER_CONTRACT"
