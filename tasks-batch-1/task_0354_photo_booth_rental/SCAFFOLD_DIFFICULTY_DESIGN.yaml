  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: booth_overlap_halfopen_with_turnaround_buffer
        grounds:
          - validations[priority=42]
          - state_machines.Booking.DRAFT_to_CONFIRMED
          - calculations.booth_selector
        distinguishing_aspect: |
          Booth interval semantics: half-open with a 120-min turnaround buffer added to the END. Booking-1
          occupies [16:30, 01:00) (incl. buffer). A second confirm whose setup_start (event_start 02:00 -
          90min = 00:30) falls before 01:00 collides => ERR_NO_BOOTH_AVAILABLE; whereas event_start 02:30
          (setup_start exactly 01:00) is allowed by the half-open edge. Buffer + half-open geometry.
        test_recipe:
          setup:
            - "One booth; Booking-1 (18:00-00:00 next day... use 18:00-22:00) CONFIRMED occupies [16:30, 01:00) incl. buffer."
            - "Booking-2 event 02:00-04:00 next day => setup_start 00:30 < 01:00 => collides; only booth blocked."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /booth-models"
              payload: { name: "Open-Air Mirror", booth_type: "MIRROR", footprint_sqft: 80, max_prints_per_hour: 120 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packages"
              payload: { booth_model_id: "${model_id}", name: "Basic 4hr", base_price: 1200.00, included_hours: 4, included_prints: 300, overtime_rate_per_hour: 150.00, idle_rate_per_hour: 75.00, overage_print_rate: 0.40 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /booths"
              payload: { booth_model_id: "${model_id}", asset_tag: "BTH-001" }
              as: OperationsManager
              captures: { booth_id: $.data.id, booth_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "Cara One" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /bookings"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}", event_start: "2026-09-12T18:00:00Z", event_end: "2026-09-12T22:00:00Z", venue_distance_miles: 0, requested_setup_lead_min: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk1_id: $.data.id }
            - call: "POST /bookings/${bk1_id}/payments"
              payload: { kind: "DEPOSIT", amount: 300.00 }
              as: FinanceClerk
            - call: "POST /bookings/${bk1_id}/confirm"
              payload: { expected_booth_version: "${booth_v}" }
              as: OperationsManager
            - call: "POST /bookings"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}", event_start: "2026-09-13T02:00:00Z", event_end: "2026-09-13T04:00:00Z", venue_distance_miles: 0, requested_setup_lead_min: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk2_id: $.data.id }
            - call: "POST /bookings/${bk2_id}/payments"
              payload: { kind: "DEPOSIT", amount: 300.00 }
              as: FinanceClerk
          trigger:
            - call: "POST /bookings/${bk2_id}/confirm"
              payload: { expected_booth_version: "${booth_v}" }
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_BOOTH_AVAILABLE"
            - "HTTP status == 409"
            - "Booking.${bk2_id}.schedule_status == DRAFT"

      - name: attendant_overlap_closed_no_buffer_boundary_touch
        grounds:
          - validations[priority=44]
          - calculations.attendant_selector
          - state_machines.AttendantAssignment.status
        distinguishing_aspect: |
          Attendant interval semantics differ from booth: CLOSED interval [event_start-90, event_end+60]
          with NO turnaround buffer. Booking-1 occupies [16:30, 23:00]. Booking-2 whose attendant window
          starts exactly at 23:00 (event_start 00:30 next day) TOUCHES the closed boundary => conflict on
          the single attendant, even though two booths are free. Closed/no-buffer vs booth's half-open/buffered.
        test_recipe:
          setup:
            - "Two booths (so booth supply never blocks), one attendant, ATTENDANT add-on."
            - "Booking-1 18:00-22:00 CONFIRMED claims the attendant [16:30,23:00]. Booking-2 event 00:30-02:00 next day -> attendant window starts exactly 23:00 (touch) => attendant conflict."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /booth-models"
              payload: { name: "Open-Air Mirror", booth_type: "MIRROR", footprint_sqft: 80, max_prints_per_hour: 120 }
