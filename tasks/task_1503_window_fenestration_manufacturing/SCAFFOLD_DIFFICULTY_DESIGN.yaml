  - rule_id: transitive_cascade
    instances:
      - name: breakage_cascade_depth3_unlocks_wave
        grounds:
          - state_machines.IGUnit.SEALED_to_BROKEN
          - state_machines.OrderLine.IN_PRODUCTION_to_GLASS_HOLD
          - state_machines.ProductionWave.RELEASED_to_OPEN
          - calculations.wave_allocation
          - calculations.wave_auto_unlock
        distinguishing_aspect: |
          Depth-3 chain from the report-breakage trigger: unit BROKEN causes
          OrderLine GLASS_HOLD (hop 1), the line's hold releases wave allocation
          10 -> 4 (hop 2), and the downward recompute crosses ceil(10/2)=5,
          auto-unlocking wave RELEASED -> OPEN (hop 3). Each hop is caused by
          the previous hop, not by the original breakage call.
        test_recipe:
          setup:
            - "MN rule, V200, GP1, dealer; order A qty4 and order B qty6 (RECTANGLE 40x60 GP1 lines), both confirmed and assigned to wave cap_units 10 / glass 2000 (allocated 10 == capacity)"
            - "Wave LOCKED then RELEASED; one unit of order B advanced to SEALED"
          setup_api_calls:
            - { call: "POST /fenestration/energy-code-rules", payload: { state_code: "MN", max_u_factor: 0.30, max_shgc: 0.55, effective_from: "2025-01-01T00:00:00Z" }, as: PlantEngineer }
