        distinguishing_aspect: "Every foreign key declared in §1.1 has a reverse read: the sub-resource form for the nine hierarchical keys and the filtered-list form for notification records and patrol assignments, so no child row is discoverable only by remembering the id returned at creation."
        test_recipe:
