            - call: "POST /postage-statements/${stmt_id}/verify"
              payload: { outcome: "ACCEPT" }
              as: AcceptanceClerk
              as_user_id: "clerk-007"
            - call: "POST /drop-shipments/${ship_id}/deposit"
              payload: {}
              as: AcceptanceClerk
              as_user_id: "clerk-007"
          assert:
            - "First deposit: HTTP 409 with ${err_id} == ERR_STATEMENT_NOT_ACCEPTED while PostageStatement.${stmt_id}.status == SUBMITTED"
            - "After the refusal the shipment is untouched: DropShipment.${ship_id}.status == IN_TRANSIT with deposited_at_utc == null, CommingleBatch.${batch_id}.status == DOCUMENTED, and no ServiceLevelRecord exists"
            - "After verify ACCEPT: PostageStatement.${stmt_id}.status == ACCEPTED_CLEAN with adjustment_cents == 0"
            - "Second deposit with the identical payload: HTTP 200, DropShipment.${ship_id}.status == DEPOSITED, CommingleBatch.${batch_id}.status == CLOSED, both MailJobs MAILED and two ServiceLevelRecords created"
            - "The appointment window and the logical clock (2026-08-12T14:00:00.000Z) were identical on both attempts, so the temporal rules cannot explain the difference"

      - name: statement_submit_requires_sorted_batch
        grounds:
          - validations[priority=12]
          - errors.ERR_INVALID_BATCH_STATE
          - state_machines.CommingleBatch.OPEN_to_SORTED
          - concurrency_rules[statement-create-stale-batch]
        distinguishing_aspect: |
          Pair PostageStatement <-> CommingleBatch, and the interesting part is that the
          OCC token is NOT the guard: the first attempt sends a perfectly current
          expected_batch_version for the OPEN batch, so version checking passes and the
          request is still refused on the batch's STATE. An implementation that treats a
          matching version as proof the parent is usable returns 201 and freezes a
          statement over an unsorted batch whose rate_mills_per_piece is still 0.
        test_recipe:
          setup:
            - "The canonical two-client fixture is pooled with both containers attached, but the batch has NOT been sorted: status OPEN, achieved_tier NONE, rate_mills_per_piece 0, batch_postage_cents 0."
