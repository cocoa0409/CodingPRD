# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2394 — Beverage Container Deposit Redemption Center
#
# 9 rule_id blocks / 22 instances. Every `grounds:` entry resolves into
# SCAFFOLD.yaml §1.1-§1.6; every `setup_api_calls:` chain is composed only of
# endpoints declared in SCAFFOLD.yaml §1.5; every numeric assert literal below
# was computed by executing the cited §1.3 formula with its `constants:`.
#
# Shared world (recurring prefix of most chains): logical clock parked at
# 2026-08-05T09:00:00Z, one ACTIVE Distributor, one REGISTERED covered
# PET_PLASTIC product (deposit_cents 10), one OPERATIONAL RedemptionCenter at
# grid origin with daily_account_cap_containers 300 and opening_cash_cents
# 50000, one IDLE PET_PLASTIC machine, one ACTIVE bag-drop-enrolled
# RedeemerAccount, one OPEN ProgramPeriod 2026Q3.

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: visit_payout_hand_count_vs_machine_count_divergence
        grounds:
          - calculations.visit_payout_valuation
          - entities.RedemptionVisit.fields.shrink_adjustment_count
          - entities.RedemptionVisit.fields.visit_limit_applied
          - state_machines.RedemptionVisit.COUNTING_to_COUNTED
        distinguishing_aspect: |
          Two visits present the SAME 60 accepted containers of the same label at the same
          center; the MACHINE_COUNT variant pays all 60 (limit 240, shrink 0, payout 600)
          while the HAND_COUNT variant pays 49 (limit 50, ceil(50*0.02)=1 shrink, payout 490),
          so channel alone moves payout_cents by 110 cents and refused_over_limit_count by 10.
        test_recipe:
          setup:
            - "Clock at 2026-08-05T09:00:00Z; ACTIVE Distributor; REGISTERED covered PET_PLASTIC product with deposit_cents 10"
            - "OPERATIONAL center with daily_account_cap_containers 300 and one PET_PLASTIC machine"
            - "ACTIVE RedeemerAccount with containers_redeemed_today 0"
            - "Visit A: CENTER / MACHINE_COUNT for that account, count_status COUNTING, one lot of 60 presented / 0 out-of-state / 0 contaminated"
            - "Visit B: CENTER / HAND_COUNT for the same account, count_status COUNTING, one lot of 60 presented / 0 out-of-state / 0 contaminated"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /distributors"
              payload: { legal_name: "Cascade Bottling LLC", state_code: "OR", permit_number: "PERMIT-1001" }
              as: ProgramAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /beverage-products"
              payload: { distributor_id: "${dist_id}", brand_name: "Cascade Spring", beverage_type: "WATER", container_material: "PET_PLASTIC", fill_volume_ml: 500, upc: "011110000001", label_state_code: "OR" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /beverage-products/${prod_id}/registration-actions"
              payload: { action: "SUBMIT" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
            - call: "POST /beverage-products/${prod_id}/registration-actions"
              payload: { action: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /redemption-centers"
              payload: { site_name: "Bend Redemption Center", x_miles: 0.0, y_miles: 0.0, accepted_materials: ["ALUMINUM", "GLASS", "PET_PLASTIC", "HDPE_PLASTIC"], accepts_all_materials: true, daily_account_cap_containers: 300, opening_cash_cents: 50000 }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
            - call: "POST /redemption-centers/${center_id}/machines"
              payload: { asset_tag: "RVM-1001", accepted_material: "PET_PLASTIC" }
              as: ProgramAdmin
              captures: { mach_id: $.data.id }
            - call: "POST /redemption-centers/${center_id}/status-changes"
              payload: { action: "ACTIVATE" }
              as: ProgramAdmin
            - call: "POST /redeemer-accounts"
              payload: { holder_name: "Dana Reyes", account_code: "ACCT-1001", bag_drop_enrolled: true }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /redemption-visits"
              payload: { site_type: "CENTER", channel: "MACHINE_COUNT", center_id: "${center_id}", account_id: "${acct_id}", machine_id: "${mach_id}" }
              as: CenterOperator
              as_user_id: "${center_id}"
              captures: { visit_a_id: $.data.id, visit_a_ver: $.data.version }
            - call: "POST /redemption-visits/${visit_a_id}/lots"
              payload: { product_id: "${prod_id}", presented_quantity: 60, out_of_state_marked_quantity: 0, contaminated_quantity: 0, expected_visit_version: "${visit_a_ver}" }
              as: CenterOperator
              as_user_id: "${center_id}"
              captures: { lot_a_id: $.data.id }
            - call: "POST /redemption-visits"
              payload: { site_type: "CENTER", channel: "HAND_COUNT", center_id: "${center_id}", account_id: "${acct_id}" }
              as: CenterOperator
              as_user_id: "${center_id}"
              captures: { visit_b_id: $.data.id, visit_b_ver: $.data.version }
            - call: "POST /redemption-visits/${visit_b_id}/lots"
              payload: { product_id: "${prod_id}", presented_quantity: 60, out_of_state_marked_quantity: 0, contaminated_quantity: 0, expected_visit_version: "${visit_b_ver}" }
              as: CenterOperator
              as_user_id: "${center_id}"
              captures: { lot_b_id: $.data.id }
          trigger:
            - call: "POST /redemption-visits/${visit_a_id}/close-count"
              payload: {}
              as: CenterOperator
              as_user_id: "${center_id}"
            - call: "POST /redemption-visits/${visit_b_id}/close-count"
              payload: {}
              as: CenterOperator
              as_user_id: "${center_id}"
          assert:
            - "RedemptionVisit.${visit_a_id}.visit_limit_applied == 240"
            - "RedemptionVisit.${visit_a_id}.capped_count == 60"
            - "RedemptionVisit.${visit_a_id}.shrink_adjustment_count == 0"
            - "RedemptionVisit.${visit_a_id}.payable_count == 60"
            - "RedemptionVisit.${visit_a_id}.refused_over_limit_count == 0"
            - "RedemptionVisit.${visit_a_id}.payout_cents == 600"
            - "RedemptionVisit.${visit_b_id}.visit_limit_applied == 50"
            - "RedemptionVisit.${visit_b_id}.capped_count == 50"
            - "RedemptionVisit.${visit_b_id}.shrink_adjustment_count == 1"
            - "RedemptionVisit.${visit_b_id}.payable_count == 49"
            - "RedemptionVisit.${visit_b_id}.refused_over_limit_count == 10"
            - "RedemptionVisit.${visit_b_id}.payout_cents == 490"
            - "ContainerLot.${lot_b_id}.accepted_quantity == 60"
            - "ContainerLot.${lot_b_id}.paid_quantity == 49"
            - "ContainerLot.${lot_b_id}.reconciliation_flag == PAID_PARTIAL"
            - "RedeemerAccount.${acct_id}.containers_redeemed_today == 109"
            - "RedeemerAccount.${acct_id}.cap_reached_today == false"
            - "RedeemerAccount.${acct_id}.fraud_strikes == 0"

      - name: bag_drop_provisional_vs_final_credit_divergence
        grounds:
          - calculations.bag_drop_credit_valuation
          - entities.BagDrop.fields.provisional_credit_cents
          - entities.BagDrop.fields.final_credit_cents
          - entities.BagDrop.fields.adjustment_cents
          - state_machines.BagDrop.DROPPED_to_COUNTED
          - state_machines.BagDrop.COUNTED_to_CREDITED
        distinguishing_aspect: |
          The same bag yields 2000 cents under the PROVISIONAL variant (min(300,250) units x 8
          cents, no service fee) and 2800 cents under the FINAL variant (285 counted containers
          x 10 cents minus the 50-cent service fee), so the switch posts an ADJUSTMENT of
          exactly +800 cents and the declared-count cap (250) binds only in the provisional leg.
        test_recipe:
          setup:
            - "Clock at 2026-08-05T09:00:00Z; OPERATIONAL center; ACTIVE bag-drop-enrolled account with credit_balance_cents 0"
            - "OPEN ProgramPeriod 2026Q3 covering 2026-07-01..2026-09-30"
            - "One BagDrop in status DROPPED with declared_count 300, provisional credit already posted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /program-periods"
              payload: { quarter_code: "2026Q3", start_date: "2026-07-01", end_date: "2026-09-30", operating_cost_cents: 1000 }
              as: ProgramAdmin
              captures: { period_id: $.data.id }
            - call: "POST /redemption-centers"
              payload: { site_name: "Bend Redemption Center", x_miles: 0.0, y_miles: 0.0, accepted_materials: ["ALUMINUM", "GLASS", "PET_PLASTIC", "HDPE_PLASTIC"], accepts_all_materials: true, daily_account_cap_containers: 300, opening_cash_cents: 50000 }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
            - call: "POST /redemption-centers/${center_id}/machines"
              payload: { asset_tag: "RVM-1001", accepted_material: "PET_PLASTIC" }
              as: ProgramAdmin
            - call: "POST /redemption-centers/${center_id}/status-changes"
              payload: { action: "ACTIVATE" }
              as: ProgramAdmin
            - call: "POST /redeemer-accounts"
              payload: { holder_name: "Dana Reyes", account_code: "ACCT-1001", bag_drop_enrolled: true }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bag-drops"
              payload: { account_id: "${acct_id}", center_id: "${center_id}", tag_code: "BAG-1001", declared_count: 300 }
              as: CenterOperator
              as_user_id: "${center_id}"
              captures: { bag_id: $.data.id, bag_ver: $.data.version }
          trigger:
            - call: "POST /bag-drops/${bag_id}/count-results"
              payload: { counted_quantities: [120, 100, 65], expected_bag_drop_version: "${bag_ver}" }
              as: PlantCounter
            - call: "POST /bag-drops/${bag_id}/settlement-actions"
              payload: { action: "CREDIT" }
              as: CenterOperator
              as_user_id: "${center_id}"
          assert:
            - "BagDrop.${bag_id}.provisional_units == 250"
            - "BagDrop.${bag_id}.provisional_credit_cents == 2000"
            - "BagDrop.${bag_id}.counted_lines == 3"
            - "BagDrop.${bag_id}.counted_total == 285"
            - "BagDrop.${bag_id}.gross_final_cents == 2850"
            - "BagDrop.${bag_id}.final_credit_cents == 2800"
            - "BagDrop.${bag_id}.adjustment_cents == 800"
            - "BagDrop.${bag_id}.variance_pct == -0.05"
            - "BagDrop.${bag_id}.variance_flag == false"
            - "BagDrop.${bag_id}.status == CREDITED"
            - "RedeemerAccount.${acct_id}.credit_balance_cents == 2800"
            - "RedeemerAccount.${acct_id}.fraud_strikes == 0"
            - "GET /redeemer-accounts/${acct_id}/credit-entries returns total_count 2 with entry_type PROVISIONAL amount_cents 2000 then entry_type ADJUSTMENT amount_cents 800 and balance_after_cents 2800"
            - "ProgramPeriod.${period_id}.containers_redeemed_count == 285"
            - "ProgramPeriod.${period_id}.redemptions_paid_cents == 2800"

      - name: commodity_spot_vs_index_pricing_divergence
        grounds:
          - calculations.material_sale_net_revenue
          - entities.CommodityBatch.fields.effective_price_cents_per_tonne
          - entities.CommodityBatch.fields.gross_revenue_cents
          - state_machines.CommodityBatch.BALED_to_SOLD
        distinguishing_aspect: |
          Two batches with byte-identical bale_weights_kg [14.12, 16.13, 12.62] and
          contamination_pct 0.0375 diverge purely by pricing_mode: SPOT at 154000 keeps the
          quoted price and nets 6162 cents, INDEX at 160000 is cut 250 bps to 156000 and nets
          6244 cents, while freight_cents is identical (193) because it ignores price.
        test_recipe:
          setup:
            - "Clock at 2026-08-05T09:00:00Z; OPEN ProgramPeriod 2026Q3; OPERATIONAL center with a PET_PLASTIC machine"
            - "REGISTERED covered PET_PLASTIC product; one anonymous COUNTED MACHINE_COUNT visit of 500 accepted containers, so unbatched_container_count is 500"
            - "Batch SPOT-A and batch IDX-B each BALED with bale_weights_kg [14.12, 16.13, 12.62] and contamination_pct 0.0375"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /program-periods"
              payload: { quarter_code: "2026Q3", start_date: "2026-07-01", end_date: "2026-09-30", operating_cost_cents: 1000 }
              as: ProgramAdmin
              captures: { period_id: $.data.id }
            - call: "POST /distributors"
              payload: { legal_name: "Cascade Bottling LLC", state_code: "OR", permit_number: "PERMIT-1001" }
              as: ProgramAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /beverage-products"
              payload: { distributor_id: "${dist_id}", brand_name: "Cascade Spring", beverage_type: "WATER", container_material: "PET_PLASTIC", fill_volume_ml: 500, upc: "011110000001", label_state_code: "OR" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /beverage-products/${prod_id}/registration-actions"
              payload: { action: "SUBMIT" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
            - call: "POST /beverage-products/${prod_id}/registration-actions"
              payload: { action: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /redemption-centers"
              payload: { site_name: "Bend Redemption Center", x_miles: 0.0, y_miles: 0.0, accepted_materials: ["ALUMINUM", "GLASS", "PET_PLASTIC", "HDPE_PLASTIC"], accepts_all_materials: true, daily_account_cap_containers: 300, opening_cash_cents: 50000 }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
            - call: "POST /redemption-centers/${center_id}/machines"
              payload: { asset_tag: "RVM-1001", accepted_material: "PET_PLASTIC" }
              as: ProgramAdmin
              captures: { mach_id: $.data.id }
            - call: "POST /redemption-centers/${center_id}/status-changes"
              payload: { action: "ACTIVATE" }
              as: ProgramAdmin
            - call: "POST /redemption-visits"
              payload: { site_type: "CENTER", channel: "MACHINE_COUNT", center_id: "${center_id}", machine_id: "${mach_id}" }
              as: CenterOperator
              as_user_id: "${center_id}"
              captures: { anon_visit_id: $.data.id, anon_visit_ver: $.data.version }
            - call: "POST /redemption-visits/${anon_visit_id}/lots"
              payload: { product_id: "${prod_id}", presented_quantity: 500, out_of_state_marked_quantity: 0, contaminated_quantity: 0, expected_visit_version: "${anon_visit_ver}" }
              as: CenterOperator
              as_user_id: "${center_id}"
            - call: "POST /redemption-visits/${anon_visit_id}/close-count"
              payload: {}
              as: CenterOperator
              as_user_id: "${center_id}"
            - call: "POST /commodity-batches"
              payload: { center_id: "${center_id}", material: "PET_PLASTIC", batch_code: "SPOT-A", container_count: 200 }
              as: PlantCounter
              captures: { batch_a_id: $.data.id }
            - call: "POST /commodity-batches/${batch_a_id}/processing-actions"
              payload: { action: "SORT", contamination_pct: 0.0375 }
              as: PlantCounter
            - call: "POST /commodity-batches/${batch_a_id}/processing-actions"
              payload: { action: "BALE", bale_weights_kg: [14.12, 16.13, 12.62] }
              as: PlantCounter
            - call: "POST /commodity-batches"
              payload: { center_id: "${center_id}", material: "PET_PLASTIC", batch_code: "IDX-B", container_count: 200 }
              as: PlantCounter
              captures: { batch_b_id: $.data.id }
            - call: "POST /commodity-batches/${batch_b_id}/processing-actions"
              payload: { action: "SORT", contamination_pct: 0.0375 }
              as: PlantCounter
            - call: "POST /commodity-batches/${batch_b_id}/processing-actions"
              payload: { action: "BALE", bale_weights_kg: [14.12, 16.13, 12.62] }
              as: PlantCounter
          trigger:
            - call: "POST /commodity-batches/${batch_a_id}/sale"
              payload: { pricing_mode: "SPOT", quoted_price_cents_per_tonne: 154000, period_id: "${period_id}" }
              as: CenterOperator
              as_user_id: "${center_id}"
            - call: "POST /commodity-batches/${batch_b_id}/sale"
              payload: { pricing_mode: "INDEX", quoted_price_cents_per_tonne: 160000, period_id: "${period_id}" }
              as: CenterOperator
              as_user_id: "${center_id}"
          assert:
            - "CommodityBatch.${batch_a_id}.effective_price_cents_per_tonne == 154000"
            - "CommodityBatch.${batch_a_id}.gross_weight_kg == 42.87"
            - "CommodityBatch.${batch_a_id}.gross_revenue_cents == 6355"
            - "CommodityBatch.${batch_a_id}.freight_cents == 193"
            - "CommodityBatch.${batch_a_id}.net_revenue_cents == 6162"
            - "CommodityBatch.${batch_a_id}.status == SOLD"
            - "CommodityBatch.${batch_b_id}.effective_price_cents_per_tonne == 156000"
            - "CommodityBatch.${batch_b_id}.gross_weight_kg == 42.87"
            - "CommodityBatch.${batch_b_id}.gross_revenue_cents == 6437"
            - "CommodityBatch.${batch_b_id}.freight_cents == 193"
            - "CommodityBatch.${batch_b_id}.net_revenue_cents == 6244"
            - "ProgramPeriod.${period_id}.material_revenue_cents == 12406"
            - "ProgramPeriod.${period_id}.outstanding_liability_cents == 0"
            - "RedemptionCenter.${center_id}.batched_container_count == 400"
            - "RedemptionCenter.${center_id}.unbatched_container_count == 100"

  - rule_id: combinatorial_formula
    instances:

      - name: visit_payable_three_way_min_daily_allowance_binds
        grounds:
          - calculations.visit_payout_valuation
          - calculations.daily_cap_ledger
          - entities.RedemptionVisit.fields.capped_count
          - entities.ContainerLot.fields.paid_quantity
          - entities.ContainerLot.fields.reconciliation_flag
        distinguishing_aspect: |
          payable_count is the minimum of three independently computed quantities
          (raw_accepted_count 300, visit_limit_applied 240, remaining daily_allowance 220) and
          the THIRD term binds: the answer 220 cannot be produced by any two-term formula, and
          the waterfall then splits the 220 across two 150-container lots as 150 + 70.
        test_recipe:
          setup:
            - "Clock at 2026-08-05T09:00:00Z; OPERATIONAL center with daily_account_cap_containers 300 and one PET_PLASTIC machine"
            - "REGISTERED covered PET_PLASTIC product with deposit_cents 10"
            - "Visit 1 already COUNTED with payable_count 80, so RedeemerAccount.containers_redeemed_today is 80 and cap_reached_today is false"
            - "Visit 2 is COUNTING for the same account with two lots of 150 presented containers each (raw_accepted_count 300)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /distributors"
              payload: { legal_name: "Cascade Bottling LLC", state_code: "OR", permit_number: "PERMIT-1001" }
              as: ProgramAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /beverage-products"
              payload: { distributor_id: "${dist_id}", brand_name: "Cascade Spring", beverage_type: "WATER", container_material: "PET_PLASTIC", fill_volume_ml: 500, upc: "011110000001", label_state_code: "OR" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /beverage-products/${prod_id}/registration-actions"
              payload: { action: "SUBMIT" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
            - call: "POST /beverage-products/${prod_id}/registration-actions"
              payload: { action: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /redemption-centers"
              payload: { site_name: "Bend Redemption Center", x_miles: 0.0, y_miles: 0.0, accepted_materials: ["ALUMINUM", "GLASS", "PET_PLASTIC", "HDPE_PLASTIC"], accepts_all_materials: true, daily_account_cap_containers: 300, opening_cash_cents: 50000 }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
            - call: "POST /redemption-centers/${center_id}/machines"
              payload: { asset_tag: "RVM-1001", accepted_material: "PET_PLASTIC" }
              as: ProgramAdmin
              captures: { mach_id: $.data.id }
            - call: "POST /redemption-centers/${center_id}/status-changes"
              payload: { action: "ACTIVATE" }
              as: ProgramAdmin
            - call: "POST /redeemer-accounts"
              payload: { holder_name: "Dana Reyes", account_code: "ACCT-1001", bag_drop_enrolled: true }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /redemption-visits"
              payload: { site_type: "CENTER", channel: "MACHINE_COUNT", center_id: "${center_id}", account_id: "${acct_id}", machine_id: "${mach_id}" }
              as: CenterOperator
              as_user_id: "${center_id}"
              captures: { v1_id: $.data.id, v1_ver: $.data.version }
            - call: "POST /redemption-visits/${v1_id}/lots"
              payload: { product_id: "${prod_id}", presented_quantity: 80, out_of_state_marked_quantity: 0, contaminated_quantity: 0, expected_visit_version: "${v1_ver}" }
              as: CenterOperator
              as_user_id: "${center_id}"
            - call: "POST /redemption-visits/${v1_id}/close-count"
              payload: {}
              as: CenterOperator
              as_user_id: "${center_id}"
            - call: "POST /redemption-visits"
              payload: { site_type: "CENTER", channel: "MACHINE_COUNT", center_id: "${center_id}", account_id: "${acct_id}", machine_id: "${mach_id}" }
              as: CenterOperator
              as_user_id: "${center_id}"
              captures: { v2_id: $.data.id, v2_ver: $.data.version }
            - call: "POST /redemption-visits/${v2_id}/lots"
              payload: { product_id: "${prod_id}", presented_quantity: 150, out_of_state_marked_quantity: 0, contaminated_quantity: 0, expected_visit_version: "${v2_ver}" }
              as: CenterOperator
              as_user_id: "${center_id}"
              captures: { lot_1_id: $.data.id }
            - call: "GET /redemption-visits/${v2_id}"
              payload: {}
              as: CenterOperator
              as_user_id: "${center_id}"
              captures: { v2_ver_after_lot1: $.data.version }
            - call: "POST /redemption-visits/${v2_id}/lots"
              payload: { product_id: "${prod_id}", presented_quantity: 150, out_of_state_marked_quantity: 0, contaminated_quantity: 0, expected_visit_version: "${v2_ver_after_lot1}" }
              as: CenterOperator
              as_user_id: "${center_id}"
              captures: { lot_2_id: $.data.id }
          trigger:
            - call: "POST /redemption-visits/${v2_id}/close-count"
              payload: {}
              as: CenterOperator
              as_user_id: "${center_id}"
          assert:
            - "RedemptionVisit.${v2_id}.raw_accepted_count == 300"
            - "RedemptionVisit.${v2_id}.visit_limit_applied == 240"
            - "RedemptionVisit.${v2_id}.capped_count == 220"
            - "RedemptionVisit.${v2_id}.shrink_adjustment_count == 0"
            - "RedemptionVisit.${v2_id}.payable_count == 220"
            - "RedemptionVisit.${v2_id}.refused_over_limit_count == 80"
            - "RedemptionVisit.${v2_id}.payout_cents == 2200"
            - "RedemptionVisit.${v2_id}.payout_status == WITHHELD"
            - "RedemptionVisit.${v2_id}.withhold_reason == DAILY_CAP_EXCEEDED"
            - "ContainerLot.${lot_1_id}.paid_quantity == 150"
            - "ContainerLot.${lot_1_id}.reconciliation_flag == PAID_FULL"
            - "ContainerLot.${lot_2_id}.paid_quantity == 70"
