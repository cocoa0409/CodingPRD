# ============================================================================
# 1.9 Scaffold Corner Design - task 2218 Camp Accreditation & Health Care
#     Compliance. One walk of references/claim-extraction-guide.md against
#     this scaffold's 1.1-1.7 surface. Corners already asserted by
#     SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
#     Logical clock default: 2026-08-01T00:00:00Z.
# ============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------------ 1.1 ---
  - section: entities
    instances:
      - name: camp_creation_returns_every_input_field_plus_derived_staffing_requirement
        claim_type: Creation
        grounds:
          - entities.Camp
          - endpoints[POST /accreditation/camps]
          - calculations.required_health_staffing_level
        distinguishing_aspect: "A single POST must echo the eight configuration inputs AND stamp four derived fields in one response - required_health_staffing_level, compliance_posture, risk_index and risk_index_variant - so a handler that only persists inputs fails."
        test_recipe:
          setup:
            - "empty database; logical clock at the default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /accreditation/camps"
              payload: { name: "Pine Hollow Resident Camp", camp_type: "RESIDENT", state_code: "OH", population_served: "MEDICALLY_FRAGILE", program_elements: ["AQUATICS_OPEN_WATER"], resident_census: 200, distance_to_hospital_km: 45, max_daily_census: 240, health_staffing_level: "RN_ONSITE" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_id: "$.data.id" }
          assert:
            - "201 with response_type object and data.id a server-generated string"
            - "Camp.${camp_id}.camp_type == RESIDENT and population_served == MEDICALLY_FRAGILE and resident_census == 200 and distance_to_hospital_km == 45 and max_daily_census == 240"
            - "Camp.${camp_id}.health_staffing_level == RN_ONSITE"
            - "Camp.${camp_id}.required_health_staffing_level == PHYSICIAN_ONSITE (base rank 4 from r_type 3 r_pop 4 r_census 3 r_dist 3 r_prog 3, bump 1, min(4,5))"
            - "Camp.${camp_id}.compliance_posture == RESTRICTED because rank(RN_ONSITE)=3 < rank(PHYSICIAN_ONSITE)=4"
            - "Camp.${camp_id}.health_intake_status == OPEN"
            - "Camp.${camp_id}.risk_index == 54.60 and risk_index_variant == PRE_VISIT"
            - "Camp.${camp_id}.accreditation_status == NOT_ACCREDITED and state_license_status == NONE and state_license_number == null"
            - "Camp.${camp_id}.version == 1"

      - name: camp_retrieval_returns_the_stored_row_with_both_status_axes
        claim_type: Retrieval
        grounds:
          - entities.Camp
          - endpoints[GET /accreditation/camps/{campId}]
        distinguishing_aspect: "GET must expose both independent status axes and all four conserved ledger fields at their zero baseline, not a trimmed create-response projection."
        test_recipe:
          setup:
            - "one DAY camp created with defaults, no cycle, no license action"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/camps"
              payload: { name: "Willow Day Camp", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", health_staffing_level: "FIRST_AIDER_ONLY" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_id: "$.data.id" }
          trigger:
            - call: "GET /accreditation/camps/${camp_id}"
              as: AccreditationOfficer
              as_user_id: "officer-1"
          assert:
            - "200 with data.id == ${camp_id}"
            - "accreditation_status == NOT_ACCREDITED and state_license_status == NONE - the two axes are reported independently"
            - "penalty_point_balance == 0 and controlled_intake_units == 0 and controlled_on_hand_units == 0 and last_accredited_year == null"
            - "compliance_posture == OPEN and health_intake_status == OPEN and required_health_staffing_level == FIRST_AIDER_ONLY"
            - "risk_index == 16.00 (10 base + 6 license NONE) and risk_index_variant == PRE_VISIT"

      - name: camp_listing_filters_by_state_code_and_paginates_by_offset
        claim_type: Listing
        grounds:
          - entities.Camp
          - endpoints[GET /accreditation/camps]
          - response_envelope.pagination_fields
        distinguishing_aspect: "total_count must count the filtered set (3 OH camps) and not the whole table (4 rows), and has_more must flip to false on the second page."
        test_recipe:
          setup:
            - "three OH camps and one PA camp"
          setup_api_calls:
            - call: "POST /accreditation/camps"
              payload: { name: "OH Camp One", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/camps"
              payload: { name: "OH Camp Two", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/camps"
              payload: { name: "OH Camp Three", camp_type: "RESIDENT", state_code: "OH", population_served: "YOUTH_ONLY" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/camps"
              payload: { name: "PA Camp One", camp_type: "DAY", state_code: "PA", population_served: "YOUTH_ONLY" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "GET /accreditation/camps"
              payload: { state_code: "OH", limit: 2, offset: 0 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/camps"
              payload: { state_code: "OH", limit: 2, offset: 2 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/camps"
              payload: { state_code: "OH", camp_type: "DAY" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
          assert:
            - "first call: 200, response_type array, 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second call: 200, 1 row, total_count == 3, has_more == false"
            - "third call: 200, 2 rows, total_count == 2 - the two filters compose conjunctively"
            - "no PA camp appears in any of the three responses"

      - name: unknown_uuids_on_every_entity_read_return_that_entitys_not_found_error
        claim_type: Not Found
        grounds:
          - errors[ERR_CAMP_NOT_FOUND]
          - errors[ERR_STANDARDS_SET_NOT_FOUND]
          - errors[ERR_STANDARD_NOT_FOUND]
          - errors[ERR_CYCLE_NOT_FOUND]
          - errors[ERR_EVALUATION_NOT_FOUND]
          - errors[ERR_WRITTEN_PLAN_NOT_FOUND]
          - errors[ERR_VISITOR_NOT_FOUND]
          - errors[ERR_VISIT_NOT_FOUND]
          - errors[ERR_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_DEFICIENCY_NOT_FOUND]
          - errors[ERR_MED_RECORD_NOT_FOUND]
          - errors[ERR_ANNUAL_REPORT_NOT_FOUND]
          - errors[ERR_DISCLOSURE_NOT_FOUND]
        distinguishing_aspect: "Thirteen entities each own a distinct 404 error_id at a distinct priority; a shared generic ERR_NOT_FOUND fails every assertion here."
        test_recipe:
          setup:
            - "empty database; every path parameter below is the unknown uuid 00000000-0000-0000-0000-0000000000ff"
          setup_api_calls: []
          trigger:
            - call: "GET /accreditation/camps/00000000-0000-0000-0000-0000000000ff"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/standards-sets/00000000-0000-0000-0000-0000000000ff"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/standards/00000000-0000-0000-0000-0000000000ff"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/cycles/00000000-0000-0000-0000-0000000000ff"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/standard-evaluations/00000000-0000-0000-0000-0000000000ff"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/written-plans/00000000-0000-0000-0000-0000000000ff"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/visitors/00000000-0000-0000-0000-0000000000ff"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/visits/00000000-0000-0000-0000-0000000000ff"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/visit-assignments/00000000-0000-0000-0000-0000000000ff"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/deficiencies/00000000-0000-0000-0000-0000000000ff"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/medication-records/00000000-0000-0000-0000-0000000000ff"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/annual-reports/00000000-0000-0000-0000-0000000000ff"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/incident-disclosures/00000000-0000-0000-0000-0000000000ff"
              as: AccreditationOfficer
              as_user_id: "officer-1"
          assert:
            - "all thirteen calls return 404 with response_type error"
            - "error_id values in call order: ERR_CAMP_NOT_FOUND, ERR_STANDARDS_SET_NOT_FOUND, ERR_STANDARD_NOT_FOUND, ERR_CYCLE_NOT_FOUND, ERR_EVALUATION_NOT_FOUND, ERR_WRITTEN_PLAN_NOT_FOUND, ERR_VISITOR_NOT_FOUND, ERR_VISIT_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_DEFICIENCY_NOT_FOUND, ERR_MED_RECORD_NOT_FOUND, ERR_ANNUAL_REPORT_NOT_FOUND, ERR_DISCLOSURE_NOT_FOUND"

      - name: camp_and_visitor_creation_missing_required_input_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Camp
          - entities.Visitor
          - validations[priority 3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Only the four Camp fields with source input and no default are required; omitting an input field that HAS a default (health_staffing_level) must still succeed, so a blanket require-all-inputs handler fails the last call."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /accreditation/camps"
              payload: { camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/camps"
              payload: { name: "No Type Camp", state_code: "OH", population_served: "YOUTH_ONLY" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/visitors"
              payload: { full_name: "Dana Reed", home_state_code: "PA" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/camps"
              payload: { name: "Minimal Camp", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
          assert:
            - "first call: 400 ERR_INVALID_REQUEST (name missing)"
            - "second call: 400 ERR_INVALID_REQUEST (camp_type missing)"
            - "third call: 400 ERR_INVALID_REQUEST (trained_through_year missing)"
            - "fourth call: 201 - the four no-default inputs are the only required ones"

      - name: camp_creation_omitting_optional_inputs_applies_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Camp
          - calculations.camp_compliance_posture
        distinguishing_aspect: "health_staffing_level defaults to NONE (rank 0) while required_health_staffing_level computes to FIRST_AIDER_ONLY (rank 1), so the default-only camp is born RESTRICTED rather than OPEN."
        test_recipe:
          setup:
            - "empty database; logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /accreditation/camps"
              payload: { name: "Bare Defaults Camp", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_id: "$.data.id" }
          assert:
            - "201 with Camp.${camp_id}.program_elements == [] and resident_census == 0 and distance_to_hospital_km == 0 and max_daily_census == 0 and prior_accredited_cycle_count == 0"
            - "Camp.${camp_id}.health_staffing_level == NONE (declared default)"
            - "Camp.${camp_id}.required_health_staffing_level == FIRST_AIDER_ONLY"
            - "Camp.${camp_id}.compliance_posture == RESTRICTED - the staffing-gap branch fires on the defaults alone"
            - "Camp.${camp_id}.risk_index == 31.00 (10 base + 15 staffing gap + 6 license NONE, multiplier 1.0)"

      - name: computed_and_system_camp_fields_ignore_extra_field_client_values
        claim_type: Computed Fields
        grounds:
          - entities.Camp
          - entities.Camp.fields.penalty_point_balance
          - entities.Camp.fields.accreditation_status
        distinguishing_aspect: "Client-supplied values for computed and system fields must be discarded, not merged - the ledger balance stays 0 and the accreditation axis stays NOT_ACCREDITED even though the body asserts otherwise."
        test_recipe:
          setup:
            - "empty database; logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /accreditation/camps"
              payload: { name: "Overreach Camp", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", health_staffing_level: "FIRST_AIDER_ONLY", penalty_point_balance: 99, accreditation_status: "ACCREDITED", risk_index: 1.00, compliance_posture: "OPEN", state_license_status: "ACTIVE", controlled_on_hand_units: 500 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_id: "$.data.id" }
          assert:
            - "201 - unknown/computed keys are ignored rather than rejected"
            - "Camp.${camp_id}.penalty_point_balance == 0 and controlled_on_hand_units == 0 and controlled_intake_units == 0"
            - "Camp.${camp_id}.accreditation_status == NOT_ACCREDITED and state_license_status == NONE"
            - "Camp.${camp_id}.risk_index == 16.00 and compliance_posture == OPEN (computed, coincidentally matching the ignored input)"

      - name: standards_set_system_fields_are_server_generated_and_version_increments_on_publish
        claim_type: System Fields
        grounds:
          - entities.StandardsSet
          - endpoints[POST /accreditation/standards-sets]
          - endpoints[POST /accreditation/standards-sets/{setId}/publish]
        distinguishing_aspect: "status and published_at are system-sourced: DRAFT/null at creation, PUBLISHED plus the logical-clock instant after publish, with version stepping 1 -> 2 -> 3 across the two writes that touch the row."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/standards-sets"
              payload: { edition_code: "ACA-2026-SYS", effective_year: 2026 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { set_id: "$.data.id", set_version: "$.data.version" }
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${set_id}", code: "SU.1", title: "Supervision ratios", domain: "SUPERVISION", mandatory: true, scoring_weight: 1 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /accreditation/standards-sets/${set_id}/publish"
              as: AccreditationOfficer
              as_user_id: "officer-1"
          assert:
            - "at creation: StandardsSet.${set_id}.status == DRAFT, published_at == null, standard_count == 0, mandatory_count == 0, version == 1, created_at and updated_at both non-null"
            - "after the standard is added: standard_count == 1, mandatory_count == 1, version == 2"
            - "after publish: 200, status == PUBLISHED, published_at == 2026-08-01T00:00:00Z, version == 3"
            - "no client-supplied status or published_at was ever accepted - both endpoints declare them out of input"

      - name: camp_and_visitor_enum_and_range_inputs_rejected_as_invalid_enum
        claim_type: Type Constraints
        grounds:
          - entities.Camp.fields.camp_type
          - entities.Visitor.fields.trained_through_year
          - validations[priority 3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Enum domain membership, non-negative integers and the 2000..2100 year range are all priority-3 schema checks that must fire at 400 before any existence or business check."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /accreditation/camps"
              payload: { name: "Bad Type Camp", camp_type: "OVERNIGHT", state_code: "OH", population_served: "YOUTH_ONLY" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/camps"
              payload: { name: "Negative Census Camp", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", resident_census: -5 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/camps"
              payload: { name: "Bad Element Camp", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", program_elements: ["ARCHERY"] }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/visitors"
              payload: { full_name: "Time Traveller", home_state_code: "PA", trained_through_year: 1999 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
          assert:
            - "all four calls: 400 ERR_INVALID_REQUEST"
            - "no Camp and no Visitor row is persisted by any of the four calls"

      - name: cycle_creation_materialises_one_evaluation_per_standard_of_the_pinned_parent_set
        claim_type: Parent Relationships
        grounds:
          - entities.Standard.parent
          - entities.StandardEvaluation.parent
          - calculations.standard_applicability_determination
        distinguishing_aspect: "Materialisation is scoped to the pinned standards_set_id: three standards live in the pinned edition and two in a rival published edition, so exactly three evaluations exist and the rival's standards are absent."
        test_recipe:
          setup:
            - "two published editions; the cycle pins the first"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/camps"
              payload: { name: "Parent Scope Camp", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", health_staffing_level: "FIRST_AIDER_ONLY" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_id: "$.data.id" }
            - call: "POST /accreditation/standards-sets"
              payload: { edition_code: "ACA-2026-PIN", effective_year: 2026 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { pinned_set_id: "$.data.id" }
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${pinned_set_id}", code: "SU.1", title: "Supervision ratios", domain: "SUPERVISION", mandatory: true, scoring_weight: 3 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${pinned_set_id}", code: "OM.4", title: "Operations records", domain: "OPERATIONS", mandatory: false, scoring_weight: 1 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${pinned_set_id}", code: "PA.2", title: "Open water swim area", domain: "AQUATICS", mandatory: true, scoring_weight: 2, requires_program_elements_any: ["AQUATICS_OPEN_WATER"] }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/standards-sets/${pinned_set_id}/publish"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/standards-sets"
              payload: { edition_code: "ACA-2026-RIVAL", effective_year: 2026 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { rival_set_id: "$.data.id" }
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${rival_set_id}", code: "RV.1", title: "Rival edition standard one", domain: "SUPERVISION", mandatory: true, scoring_weight: 5 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${rival_set_id}", code: "RV.2", title: "Rival edition standard two", domain: "OPERATIONS", mandatory: true, scoring_weight: 5 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/standards-sets/${rival_set_id}/publish"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/camps/${camp_id}"
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_version: "$.data.version" }
          trigger:
            - call: "POST /accreditation/cycles"
              payload: { camp_id: "${camp_id}", standards_set_id: "${pinned_set_id}", cycle_year: 2026, expected_camp_version: "${camp_version}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { cycle_id: "$.data.id" }
            - call: "GET /accreditation/standard-evaluations"
              payload: { cycle_id: "${cycle_id}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
          assert:
            - "201 with AccreditationCycle.${cycle_id}.standards_set_id == ${pinned_set_id} and status == SELF_ASSESSMENT"
            - "the evaluation listing returns total_count == 3 - one row per Standard of the pinned edition only"
            - "no evaluation references a Standard with code RV.1 or RV.2"
            - "the PA.2 row has applicable == false (program-element gate, camp has no AQUATICS_OPEN_WATER) while SU.1 and OM.4 have applicable == true"
            - "AccreditationCycle.${cycle_id}.applicable_standard_count == 2 and applicable_mandatory_count == 1"
            - "every materialised row has mandatory and scoring_weight pinned from its Standard: SU.1 -> (true, 3), OM.4 -> (false, 1), PA.2 -> (true, 2)"

      - name: flat_topology_cross_collection_foreign_keys_are_validated_not_found_before_body_rules
        claim_type: Parent Relationships
        grounds:
          - complexity_profile.entity_topology
          - validations[priority 4]
          - validations[priority 10]
          - validations[priority 15]
        distinguishing_aspect: "entity_topology flat means FKs arrive in the request body rather than the path; each unresolvable body FK must still 404 on its own error_id, ahead of every 409/422 business rule the same body would also violate."
        test_recipe:
          setup:
            - "one published edition so the standards_set_id in the first call is valid"
          setup_api_calls:
            - call: "POST /accreditation/standards-sets"
              payload: { edition_code: "ACA-2026-FK", effective_year: 2026 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { set_id: "$.data.id", set_version: "$.data.version" }
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${set_id}", code: "SU.1", title: "Supervision ratios", domain: "SUPERVISION", mandatory: true, scoring_weight: 1 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/standards-sets/${set_id}/publish"
              as: AccreditationOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /accreditation/cycles"
              payload: { camp_id: "00000000-0000-0000-0000-0000000000ff", standards_set_id: "${set_id}", cycle_year: 2026, expected_camp_version: "${set_version}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/visit-assignments"
              payload: { visit_id: "00000000-0000-0000-0000-0000000000ff", visitor_id: "00000000-0000-0000-0000-0000000000ff", team_role: "LEAD", travel_block_start_date: "2026-09-01", travel_block_end_date: "2026-09-03" }
              as: AccreditationOfficer
