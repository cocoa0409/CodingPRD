    input: ["booth_id", "device_count", "included_leads?"]
    output: LeadCaptureLicense
    side_effects: ["LeadCaptureLicense created PROVISIONED with license_total_cents computed"]
  - method: GET
    path: "/booths/{id}/lead-capture-licenses"
    description: "List the licences provisioned for a booth; reverse-reachability for LeadCaptureLicense.booth_id"
    roles: [ShowOperations, Exhibitor, WarehouseAgent, LaborSupervisor, ClaimsAdjuster, FinanceController]
    code: 200
    input: ["limit?", "offset?"]
    output: LeadCaptureLicense[]
    side_effects: []
  - method: POST
    path: "/lead-capture-licenses/{id}/lead-batches"
    description: "Ingest a batch of scanned badge ids, deduplicated against everything seen before"
    roles: [Exhibitor]
    code: 200
    input: ["badge_ids", "captured_at"]
    output: LeadCaptureLicense
    side_effects: ["calculations.lead_license_billing runs", "First accepted batch transitions the licence PROVISIONED -> ACTIVE"]

  # ---------------- Test-driving surface ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time. Every deadline tier, storage day count, band split and expiry rule reads this clock."
    roles: [ShowOperations, FinanceController, WarehouseAgent, LaborSupervisor, ClaimsAdjuster, Exhibitor]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: datetime }
    side_effects: ["Logical clock repositioned; no entity is mutated and no recomputation is triggered"]

global_constants:
  DEFAULT_LOGICAL_CLOCK_UTC: "2026-08-01T00:00:00Z"
  MAX_DESIGN_REVISIONS: 3
  MAX_CLAIM_APPEALS: 2
  REFURB_OVERRUN_TOLERANCE: 1.20
  CONDITION_GRADE_ORDER: "A > B > C > D"

errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header is missing, empty, or names a role outside the RBAC matrix" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "The acting role is not listed on the endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "An Exhibitor acts on a resource whose exhibitor_id is not its X-User-ID, or a WarehouseAgent acts on a warehouse that is not its X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The acting X-User-ID is the same operator that created the change order, filed the claim, or issued the invoice now being approved, adjudicated or voided" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "A required body field is absent, an enum value is not a declared member, a numeric field is negative or non-integral, or a datetime does not parse" }
  - { id: ERR_INVALID_PAGINATION, http: 400, condition: "limit outside [1, 100] or offset below 0" }
  - { id: ERR_VENUE_NOT_FOUND, http: 404, condition: "No Venue with the supplied id" }
  - { id: ERR_JURISDICTION_NOT_FOUND, http: 404, condition: "No UnionJurisdiction with the supplied id" }
  - { id: ERR_WAREHOUSE_NOT_FOUND, http: 404, condition: "No Warehouse with the supplied id" }
  - { id: ERR_SHOW_NOT_FOUND, http: 404, condition: "No Show with the supplied id" }
  - { id: ERR_EXHIBITOR_NOT_FOUND, http: 404, condition: "No Exhibitor with the supplied id" }
  - { id: ERR_BOOTH_NOT_FOUND, http: 404, condition: "No Booth with the supplied id" }
  - { id: ERR_ASSET_NOT_FOUND, http: 404, condition: "No ExhibitAsset with the supplied id" }
  - { id: ERR_DESIGN_NOT_FOUND, http: 404, condition: "No ExhibitDesign with the supplied id" }
  - { id: ERR_SERVICE_ORDER_NOT_FOUND, http: 404, condition: "No ServiceOrder with the supplied id" }
  - { id: ERR_CRATE_NOT_FOUND, http: 404, condition: "No Crate with the supplied id, including ids listed in crate_ids" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "No DrayageShipment with the supplied id" }
  - { id: ERR_LABOR_CALL_NOT_FOUND, http: 404, condition: "No LaborCall with the supplied id" }
  - { id: ERR_CHANGE_ORDER_NOT_FOUND, http: 404, condition: "No ChangeOrder with the supplied id" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "No Invoice with the supplied id, including ids listed in service_order_ids resolution" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "No DamageClaim with the supplied id" }
  - { id: ERR_REFURB_NOT_FOUND, http: 404, condition: "No RefurbWorkOrder with the supplied id" }
  - { id: ERR_LICENSE_NOT_FOUND, http: 404, condition: "No LeadCaptureLicense with the supplied id" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "The requested transition is not declared from the target's current state" }
  - { id: ERR_ENTITY_TERMINAL, http: 409, condition: "The target already sits in a terminal state of its machine" }
  - { id: ERR_STALE_BOOTH_VERSION, http: 412, condition: "expected_booth_version does not match Booth.version" }
  - { id: ERR_STALE_SERVICE_ORDER_VERSION, http: 412, condition: "expected_service_order_version does not match the target ServiceOrder.version" }
  - { id: ERR_STALE_WAREHOUSE_VERSION, http: 412, condition: "expected_warehouse_version does not match Warehouse.version" }
  - { id: ERR_SHOW_NOT_ACCEPTING, http: 409, condition: "The show's status does not admit this operation" }
  - { id: ERR_BOOTH_FROZEN, http: 409, condition: "The booth's derived posture is FROZEN" }
  - { id: ERR_BOOTH_RESTRICTED, http: 409, condition: "The booth's derived posture is RESTRICTED and the operation is one RESTRICTED also blocks" }
  - { id: ERR_UNION_JURISDICTION_REQUIRED, http: 422, condition: "self_install_requested is true on a jurisdiction that forbids exhibitor self-install" }
  - { id: ERR_HANGING_SIGN_NOT_PERMITTED, http: 422, condition: "A hanging sign is designed for a booth type the venue does not permit to fly one" }
  - { id: ERR_CRATE_WEIGHT_LIMIT_EXCEEDED, http: 422, condition: "A crate on the shipment is heavier than the venue's max_forklift_capacity_lbs" }
  - { id: ERR_LABOR_WINDOW_OUTSIDE_SHOW, http: 422, condition: "The requested crew window is inverted or falls outside [show.move_in_start, show.move_out_end]" }
  - { id: ERR_LABOR_CALL_OVERLAP, http: 409, condition: "A live call on the same jurisdiction and booth sits within the turnaround buffer of the requested window" }
  - { id: ERR_BOOTH_WINDOW_CONFLICT, http: 409, condition: "A live service order on the same booth occupies a closed interval that touches or overlaps the requested window" }
  - { id: ERR_DOCK_CAPACITY_EXCEEDED, http: 409, condition: "Aggregate billable_cwt of intersecting receiving appointments would exceed the warehouse dock_capacity_cwt" }
  - { id: ERR_JURISDICTION_VENUE_MISMATCH, http: 422, condition: "The jurisdiction belongs to a venue other than the one hosting the booth's show" }
  - { id: ERR_CRATE_EXHIBITOR_MISMATCH, http: 422, condition: "A crate listed on the shipment belongs to a different exhibitor" }
  - { id: ERR_CHANGE_TARGET_MISMATCH, http: 422, condition: "The polymorphic target does not exist for its target_type, or sits on a different booth" }
  - { id: ERR_INVOICE_SCOPE_MISMATCH, http: 422, condition: "A swept service order belongs to a different exhibitor or a different show" }
  - { id: ERR_CLAIM_REFERENCE_MISMATCH, http: 422, condition: "The cited crate is not packed with the claimed asset, or the asset belongs to another exhibitor" }
  - { id: ERR_WAREHOUSE_CAPACITY_EXCEEDED, http: 409, condition: "Checking the crate in would push committed_cwt past capacity_cwt, or the warehouse is CLOSED" }
  - { id: ERR_CREW_SIZE_LIMIT, http: 422, condition: "crew_size is below 1 or above the jurisdiction's crew_max_size" }
  - { id: ERR_EMPTY_COLLECTION, http: 422, condition: "lines, crate_ids, service_order_ids or badge_ids arrived empty" }
  - { id: ERR_INVALID_LINE_SEQUENCE, http: 422, condition: "line_seq values are duplicated or do not form a contiguous 1-based run" }
  - { id: ERR_DUPLICATE_BOOTH_NUMBER, http: 409, condition: "The booth_number is already taken on that show" }
  - { id: ERR_DESIGN_REVISION_LIMIT, http: 409, condition: "A fourth revision was requested on a design that has already cycled three times" }
  - { id: ERR_CLAIM_APPEAL_LIMIT, http: 409, condition: "A third appeal was lodged on a claim that has already consumed two" }
  - { id: ERR_REFURB_OVERRUN_UNAPPROVED, http: 422, condition: "actual_cents exceeds the 20 percent overrun tolerance without an APPLIED change order" }
  - { id: ERR_CONDITION_GRADE_REGRESSION, http: 422, condition: "condition_grade_after is worse than the asset's current grade" }
  - { id: ERR_LICENSE_CLOSED, http: 409, condition: "A lead batch arrived after the licence closed" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Projected exposure at order creation would exceed the exhibitor's credit limit. Applying an already-approved change order is deliberately NOT credit checked: the resulting balance breach is caught by the booth-posture freeze instead" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 422, condition: "amount_cents is not positive, or would drive settled_cents past total_cents" }
  - { id: ERR_DECLARED_VALUE_EXCEEDS_ASSET, http: 422, condition: "declared_value_cents exceeds the asset's list_value_cents" }
  - { id: ERR_COVERAGE_BASIS_UNAVAILABLE, http: 422, condition: "DECLARED_VALUE was selected without a shipment carrying declared-value coverage" }
  - { id: ERR_EXHIBITOR_SUSPENDED, http: 402, condition: "An invoice was issued against a SUSPENDED exhibitor" }

roles:
  - name: Exhibitor
    description: "The exhibiting company. Commissions designs, orders show services, registers crates, raises change orders, provisions lead capture and files claims — always inside its own account."
    identity: "entity_backed:Exhibitor"
    exclusive_operations:
      - "POST /exhibit-designs"
      - "POST /exhibit-designs/{id}/quote"
      - "POST /lead-capture-licenses"
      - "POST /lead-capture-licenses/{id}/lead-batches"
    shared_operations:
      - "POST /exhibit-assets (with ShowOperations)"
      - "POST /service-orders (with ShowOperations)"
      - "POST /service-orders/{id}/fulfillment (with ShowOperations)"
      - "POST /crates (with WarehouseAgent)"
      - "POST /labor-calls (with ShowOperations)"
      - "POST /change-orders and /submit (with ShowOperations)"
      - "POST /damage-claims and /appeal (with ClaimsAdjuster)"
      - "all GET endpoints"

  - name: ShowOperations
    description: "The general contractor's show floor operations desk. Owns the show calendar, the floor plan, crate movement on the floor, design decisions and change-order review."
    identity: "opaque"
    exclusive_operations:
      - "POST /venues"
      - "POST /venues/{id}/union-jurisdictions"
      - "POST /warehouses"
      - "POST /shows"
      - "POST /shows/{id}/status"
      - "POST /booths"
      - "POST /exhibit-designs/{id}/decision"
      - "POST /exhibit-designs/{id}/release"
      - "POST /change-orders/{id}/review"
      - "POST /change-orders/{id}/apply"
    shared_operations:
      - "POST /exhibitors (with FinanceController)"
      - "POST /exhibit-assets/{id}/lifecycle (with WarehouseAgent)"
      - "POST /service-orders and /fulfillment (with Exhibitor)"
      - "POST /crates/{id}/movements and /drayage-shipments/{id}/hold (with WarehouseAgent)"
      - "POST /labor-calls and /labor-calls/{id}/cancel (with LaborSupervisor)"
      - "POST /refurb-work-orders (with WarehouseAgent)"
      - "POST /_clock/set_current_utc (with every role)"
      - "all GET endpoints"

  - name: WarehouseAgent
    description: "Advance warehouse and refurbishment shop operator. X-User-ID is the id of the Warehouse the agent staffs, so warehouse-scoped writes are ownership checked."
    identity: "entity_backed:Warehouse"
    exclusive_operations:
      - "POST /crates/{id}/warehouse-check-in"
      - "POST /drayage-shipments"
      - "POST /refurb-work-orders/{id}/progress"
    shared_operations:
      - "POST /crates (with Exhibitor)"
      - "POST /crates/{id}/movements and /drayage-shipments/{id}/hold (with ShowOperations)"
      - "POST /exhibit-assets/{id}/lifecycle (with ShowOperations)"
      - "POST /refurb-work-orders (with ShowOperations)"
      - "POST /warehouses/{id}/storage-billing-runs (with FinanceController)"
      - "all GET endpoints"

  - name: LaborSupervisor
    description: "Union labor steward on the floor. Dispatches crews, records arrival and closes calls; touches nothing financial."
    identity: "opaque"
    exclusive_operations:
      - "POST /labor-calls/{id}/dispatch"
      - "POST /labor-calls/{id}/check-in"
      - "POST /labor-calls/{id}/completion"
    shared_operations:
      - "POST /labor-calls/{id}/cancel (with ShowOperations)"
      - "all GET endpoints"

  - name: ClaimsAdjuster
    description: "Damage and loss adjuster. Investigates, adjudicates and settles claims, subject to segregation of duties against whoever filed the claim."
    identity: "opaque"
    exclusive_operations:
      - "POST /damage-claims/{id}/investigation"
      - "POST /damage-claims/{id}/adjudication"
    shared_operations:
      - "POST /damage-claims and /appeal (with Exhibitor)"
      - "POST /damage-claims/{id}/settlement (with FinanceController)"
      - "all GET endpoints"

  - name: FinanceController
    description: "Accounts receivable. Opens, issues, collects and voids invoices and controls exhibitor credit standing, subject to segregation of duties on void."
    identity: "opaque"
    exclusive_operations:
      - "POST /invoices"
      - "POST /invoices/{id}/issue"
      - "POST /invoices/{id}/payments"
      - "POST /invoices/{id}/void"
      - "POST /exhibitors/{id}/status"
    shared_operations:
      - "POST /exhibitors (with ShowOperations)"
      - "POST /damage-claims/{id}/settlement (with ClaimsAdjuster)"
      - "POST /warehouses/{id}/storage-billing-runs (with WarehouseAgent)"
      - "all GET endpoints"
