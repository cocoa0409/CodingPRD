              payload: { name: "Northwind Foods", code: "NWF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { prin: $.data.id }
            - call: "POST /commission-agreements"
              payload: { principal_id: "${prin}", retailer_id: "${ret}", category_code: "FROZEN_SNACKS", effective_start_date: "2026-01-01", effective_end_date: "2026-09-01", base_commission_bps: 500, tier_threshold_cents: 3000000, tier_commission_bps: 300 }
              as: BrokerAdmin
              captures: { a1: $.data.id }
            - call: "POST /commission-agreements/${a1}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /commission-agreements"
              payload: { principal_id: "${prin}", retailer_id: "${ret}", category_code: "FROZEN_SNACKS", effective_start_date: "2026-09-01", effective_end_date: "2027-01-01", base_commission_bps: 480, tier_threshold_cents: 3000000, tier_commission_bps: 290 }
              as: BrokerAdmin
              captures: { a2: $.data.id }
            - call: "POST /commission-agreements"
              payload: { principal_id: "${prin}", retailer_id: "${ret}", category_code: "FROZEN_SNACKS", effective_start_date: "2026-08-31", effective_end_date: "2027-06-01", base_commission_bps: 460, tier_threshold_cents: 3000000, tier_commission_bps: 280 }
              as: BrokerAdmin
              captures: { a3: $.data.id }
            - call: "POST /commission-agreements"
              payload: { principal_id: "${prin}", retailer_id: "${ret}", category_code: "FROZEN_SNACKS", effective_start_date: "2025-06-01", effective_end_date: "2026-01-01", base_commission_bps: 520, tier_threshold_cents: 3000000, tier_commission_bps: 310 }
              as: BrokerAdmin
              captures: { a4: $.data.id }
          trigger:
            - call: "POST /commission-agreements/${a2}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /commission-agreements/${a3}/activate"
              payload: {}
              as: BrokerAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /commission-agreements/${a4}/activate"
              payload: {}
              as: BrokerAdmin
          assert:
            - "Activating A2 succeeds (200) — new.start 2026-09-01 == A1.end 2026-09-01, so under the half-open rule new.start < other.end is false and there is no overlap; CommissionAgreement.${a2}.status == ACTIVE"
            - "Activating A3 returns 409 with error_id == ERR_AGREEMENT_WINDOW_OVERLAP — 2026-08-31 < 2026-09-01 and 2026-01-01 < 2027-06-01 makes it overlap A1 (and it also overlaps the now-ACTIVE A2); CommissionAgreement.${a3}.status stays DRAFT"
            - "Activating A4 succeeds — new.end 2026-01-01 == A1.start 2026-01-01 proves adjacency is legal on the lower edge too; three ACTIVE agreements now tile [2025-06-01, 2027-01-01) with no gap and no overlap"
            - "Second leg — terminate A1 as BrokerAdmin, then retry activating A3: it now succeeds, because a TERMINATED agreement is excluded from the overlap set even though its dates still overlap. Retrying against the still-ACTIVE A2 is what would keep it blocked, so terminate A2 as well before this leg"
            - "Overlap is evaluated only on activation: creating A3 as a DRAFT never errored, and no ACTIVE agreement is mutated by a failed activation (A1.version and A2.version unchanged)"

