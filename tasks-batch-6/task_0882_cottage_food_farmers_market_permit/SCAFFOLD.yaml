    output: SalesRecord
    side_effects: ["status -> VOIDED", "producer.ytd -= gross", "manifest.booth_fee_cents recomputed"]

  # ---- RecallEvent ----
  - method: POST
    path: "/cottage-food/recall-events"
    description: "Initiate a recall (depth-3 cascade); computes estimated liability"
    roles: [HealthAdmin]
    code: 201
    input: [producer_id, product_id, reason, severity]
    output: RecallEvent
    side_effects: ["status=INITIATED", "estimated_liability_cents computed", "cascade: product RECALLED -> permit SUSPENDED -> manifests VOIDED"]
  - method: GET
    path: "/cottage-food/recall-events"
    description: "List recall events (filter by producer or product)"
    roles: [Producer, HealthInspector, HealthAdmin]
    code: 200
    input: ["producer_id?", "product_id?", "status?", "limit?", "offset?"]
    output: "RecallEvent[]"
    side_effects: []
  - method: GET
    path: "/cottage-food/recall-events/{id}"
    description: "Get a recall event"
    roles: [Producer, HealthInspector, HealthAdmin]
    code: 200
    input: []
    output: RecallEvent
    side_effects: []
  - method: POST
    path: "/cottage-food/recall-events/{id}/resolve"
    description: "Resolve a recall (INITIATED -> RESOLVED); computes final liability"
    roles: [HealthAdmin]
    code: 200
    input: [recalled_units]
    output: RecallEvent
    side_effects: ["status -> RESOLVED", "final_liability_cents computed"]

  # ---- Reporting ----
  - method: GET
    path: "/cottage-food/producers/{id}/compliance-summary"
    description: "Computed compliance/sales-cap summary for a producer"
    roles: [Producer, HealthInspector, HealthAdmin]
    code: 200
    input: []
    output: "{ producer_id: string, status: string, provisional_ytd_cents: integer, audited_ytd_cents: integer, annual_cap_cents: integer, cap_utilization_pct: number, active_permit_id: string, open_complaint_count: integer, active_recall_count: integer }"
    side_effects: []

  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any set call the clock reads exactly this default (never wall-clock)."
    roles: [HealthAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advances to to_iso8601"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH_CONTEXT, http: 400, condition: "X-User-Role/X-User-ID missing or role unknown" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad type, illegal enum, gross_amount_cents <= 0, bad verification_token" }
  - { id: ERR_PRODUCER_NOT_FOUND, http: 404, condition: "producer_id does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "product_id does not exist" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "permit_id does not exist" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "inspection id does not exist" }
  - { id: ERR_COMPLAINT_NOT_FOUND, http: 404, condition: "complaint id does not exist" }
  - { id: ERR_MARKET_NOT_FOUND, http: 404, condition: "market_id does not exist" }
  - { id: ERR_MANIFEST_NOT_FOUND, http: 404, condition: "manifest id does not exist" }
  - { id: ERR_SALES_RECORD_NOT_FOUND, http: 404, condition: "sales record id does not exist" }
  - { id: ERR_RECALL_NOT_FOUND, http: 404, condition: "recall event id does not exist" }
  - { id: ERR_PRODUCER_NOT_REGISTERED, http: 409, condition: "Acting producer is not REGISTERED (still PENDING_VERIFICATION or SUSPENDED)" }
  - { id: ERR_PERMIT_INVALID_STATE, http: 409, condition: "Permit not in a legal state for submit/issue/renew" }
  - { id: ERR_MANIFEST_INVALID_STATE, http: 409, condition: "Manifest not in a legal state for the requested action / sale" }
  - { id: ERR_INSPECTION_NOT_SCHEDULED, http: 409, condition: "Inspection not in SCHEDULED state for close" }
  - { id: ERR_COMPLAINT_INVALID_STATE, http: 409, condition: "Complaint not in a legal state for review/resolve" }
  - { id: ERR_SALES_RECORD_NOT_RECORDED, http: 409, condition: "Sales record not RECORDED (already VOIDED) for void" }
  - { id: ERR_RECALL_INVALID_STATE, http: 409, condition: "Recall not in a legal state (resolve requires INITIATED; reinstate blocked by INITIATED recall)" }
  - { id: ERR_PERMIT_NOT_ISSUED, http: 409, condition: "Manifest submit requires linked Permit.status == ISSUED" }
  - { id: ERR_INSPECTION_NOT_PASSED, http: 409, condition: "CLASS_B permit issue requires a PASSED Inspection" }
  - { id: ERR_PERMIT_EXPIRED, http: 409, condition: "Permit is expired at the manifest event_date" }
  - { id: ERR_PERMIT_TERM_OVERLAP, http: 409, condition: "New issued permit term overlaps an existing ISSUED permit for the producer" }
  - { id: ERR_FOOD_NOT_COTTAGE_ALLOWED, http: 422, condition: "Product category prohibited, needs refrigeration, or exceeds ph/water-activity limits" }
  - { id: ERR_PRODUCT_NOT_APPROVED, http: 422, condition: "A manifest product is not APPROVED (or recall targets a non-APPROVED product)" }
  - { id: ERR_LABEL_NOT_APPROVED, http: 422, condition: "A manifest product is not LABEL_APPROVED" }
  - { id: ERR_PRODUCT_RECALLED, http: 422, condition: "A manifest product is RECALLED" }
  - { id: ERR_VENUE_CLASS_NOT_ALLOWED, http: 422, condition: "Permit class not in FarmersMarket.allowed_classes" }
  - { id: ERR_DUPLICATE_MANIFEST, http: 409, condition: "Another non-terminal manifest exists for the same (producer, market, event_date)" }
  - { id: ERR_MARKET_CAPACITY_FULL, http: 409, condition: "Market day-slot capacity reached for the event_date" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Complaint reviewer/resolver is the same user as the filer" }
  - { id: ERR_STALE_MARKET_VERSION, http: 412, condition: "expected_market_version does not match FarmersMarket.version" }
  - { id: ERR_STALE_PERMIT_VERSION, http: 412, condition: "expected_permit_version does not match Permit.version" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Producer
    description: "Cottage-food operator acting on their own producer, products, permits, manifests, and sales."
    identity: "entity_backed:Producer"
    exclusive_operations:
      - "POST /cottage-food/producers/{id}/verify — verify own registration"
      - "POST /cottage-food/products — declare product"
      - "POST /cottage-food/permits — create permit"
      - "POST /cottage-food/permits/{id}/submit — submit permit"
      - "POST /cottage-food/permits/{id}/renew — begin renewal (OCC)"
      - "POST /cottage-food/market-manifests — create manifest"
      - "POST /cottage-food/market-manifests/{id}/submit — submit manifest"
      - "POST /cottage-food/market-manifests/{id}/withdraw — withdraw manifest"
      - "POST /cottage-food/sales-records — report sale"
    shared_operations:
      - "POST /cottage-food/producers — register (shared with HealthAdmin)"
      - "GET reads on producers, products, permits, inspections, farmers-markets, manifests, sales-records, recall-events, compliance-summary"

  - name: HealthInspector
    description: "Health department staff performing allowed-food/labeling review, inspections, permit issuance, and complaint handling."
    identity: "opaque"
    exclusive_operations:
      - "POST /cottage-food/products/{id}/review-food — allowed-food review"
      - "POST /cottage-food/products/{id}/review-label — labeling review"
      - "POST /cottage-food/permits/{id}/issue — issue/re-issue permit"
      - "POST /cottage-food/inspections — schedule inspection"
      - "POST /cottage-food/inspections/{id}/close — close inspection"
    shared_operations:
      - "POST /cottage-food/complaints — file complaint (shared with HealthAdmin)"
      - "POST /cottage-food/complaints/{id}/review — review complaint (SoD)"
      - "POST /cottage-food/complaints/{id}/resolve — resolve complaint (SoD)"
      - "GET reads across the domain"

  - name: MarketManager
    description: "Operator of a specific FarmersMarket; X-User-ID equals the market id they manage."
    identity: "entity_backed:FarmersMarket"
    exclusive_operations:
      - "POST /cottage-food/market-manifests/{id}/approve — approve manifest (OCC + capacity)"
      - "POST /cottage-food/market-manifests/{id}/reject — reject manifest"
      - "POST /cottage-food/market-manifests/{id}/check-in — check in vendor"
    shared_operations:
      - "GET reads on producers, products, permits, farmers-markets, manifests"

  - name: HealthAdmin
    description: "Program administrator: policies, markets, recalls, revocations, void, reinstatement, clock, reporting."
    identity: "opaque"
    exclusive_operations:
      - "POST /cottage-food/allowed-food-policies — create policy"
      - "POST /cottage-food/farmers-markets — create market"
      - "POST /cottage-food/producers/{id}/reinstate — reinstate producer"
      - "POST /cottage-food/permits/{id}/revoke — revoke permit"
      - "POST /cottage-food/sales-records/{id}/void — void sale"
      - "POST /cottage-food/recall-events — initiate recall"
      - "POST /cottage-food/recall-events/{id}/resolve — resolve recall"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "POST /cottage-food/producers — register (shared with Producer)"
      - "POST /cottage-food/complaints — file complaint (shared with HealthInspector)"
      - "POST /cottage-food/complaints/{id}/review — review complaint (SoD)"
      - "POST /cottage-food/complaints/{id}/resolve — resolve complaint (SoD)"
      - "GET reads across the domain"
