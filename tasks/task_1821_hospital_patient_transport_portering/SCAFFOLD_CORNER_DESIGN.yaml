        distinguishing_aspect: "A request without X-User-Role/X-User-ID fails before any business logic with ERR_UNAUTHENTICATED (401), and the error envelope carries data.error_id."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
