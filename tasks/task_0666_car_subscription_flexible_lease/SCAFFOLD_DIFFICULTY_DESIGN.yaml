scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: early_cancel_forward_vs_chronological_diverge
        grounds:
          - calculations.early_cancel_fee
          - state_machines.Subscription.ACTIVE_to_CLOSED
          - endpoints["GET /subscriptions/{id}/cancel-quote"]
        distinguishing_aspect: |
          On the Subscription cost domain, forward_looking charges projected unfulfilled months at 50%
          (240000) while chronological reconstructs flat ETF + prorated unbilled days (56667) for the
          SAME subscription state — two valid approaches, different numbers, on the Subscription entity.
        test_recipe:
          setup:
            - "PLUS plan: monthly_fee 80000, min_term 6, included_swaps 1, deposit_base 80000."
            - "Applicant approved (score 0.8818) on PLUS; subscription ACTIVE since term_start 2026-04-01; cycle #1 OPEN with cycle_start 2026-04-01."
            - "Clock advanced to 2026-04-11 (10 days into the open April cycle; 0 full months elapsed)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 80000, included_miles_per_cycle: 1000, free_buffer_miles: 50, overage_tier1_rate_cents: 25, overage_tier2_rate_cents: 38, included_swaps_per_term: 1, min_term_months: 6, deposit_base_cents: 80000 }
              as: PlatformAdmin
              captures: { plus_plan_id: $.data.id }
            - call: "POST /fleets"
              payload: { name: "CA Depot", region_code: "CA" }
              as: PlatformAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_id: "${fleet_id}", plan_id: "${plus_plan_id}", vin: "VIN-PLUS-1", model_label: "XC40", odometer_miles: 5000 }
              as: FleetOperator
              captures: { veh_id: $.data.id, veh_v0: $.data.version }
            - call: "POST /applicants"
              payload: { full_name: "M One", email: "m1@x.com", credit_score: 720, monthly_income_cents: 480000, history_flag: "CLEAN" }
              as: Member
              captures: { appl_id: $.data.id }
            - call: "POST /applicants/${appl_id}/decide-eligibility"
              payload: { plan_id: "${plus_plan_id}" }
              as: BillingAdmin
            - call: "POST /subscriptions"
              payload: { applicant_id: "${appl_id}", plan_id: "${plus_plan_id}" }
              as: Member
              as_user_id: "${appl_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/assign-vehicle"
              payload: { vehicle_id: "${veh_id}", expected_vehicle_version: "${veh_v0}" }
              as: FleetOperator
            - call: "POST /couriers"
              payload: { name: "Carlos", fleet_id: "${fleet_id}", buffer_minutes: 30 }
              as: FleetOperator
              captures: { courier_id: $.data.id }
            - call: "POST /delivery-slots"
              payload: { courier_id: "${courier_id}", subscription_id: "${sub_id}", kind: "DELIVERY", window_start_iso: "2026-04-01T09:00:00Z", window_end_iso: "2026-04-01T10:00:00Z" }
              as: FleetOperator
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: FleetOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-11T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /subscriptions/${sub_id}/cancel-quote"
              payload: { mode: "FORWARD" }
              as: BillingAdmin
              captures: { fwd_fee: $.data.fee_cents }
            - call: "GET /subscriptions/${sub_id}/cancel-quote"
              payload: { mode: "CHRONOLOGICAL" }
              as: BillingAdmin
              captures: { chrono_fee: $.data.fee_cents }
          assert:
            - "FORWARD quote fee_cents == 240000"
            - "CHRONOLOGICAL quote fee_cents == 56667"
            - "fwd_fee != chrono_fee (240000 != 56667) for identical subscription state"

      - name: fleet_utilization_reservation_inclusive_vs_assignment_only
        grounds:
          - calculations.fleet_utilization
          - entities.Fleet.fields.utilization_pct
          - endpoints["GET /fleets/{id}/utilization"]
        distinguishing_aspect: |
          On the Fleet/Vehicle domain, the canonical persisted utilization counts RESERVED+ASSIGNED (0.5
          for 1 RESERVED + 1 ASSIGNED of 4) while the ASSIGNED_ONLY projection counts only ASSIGNED (0.25)
          — a different number for identical vehicle state, on a different entity domain than the early_cancel cost calc.
        test_recipe:
          setup:
            - "Fleet with 4 vehicles: 1 RESERVED (a DRAFT subscription assigned it), 1 ASSIGNED (an ACTIVE subscription), 2 AVAILABLE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 80000, included_miles_per_cycle: 1000, free_buffer_miles: 50, overage_tier1_rate_cents: 25, overage_tier2_rate_cents: 38, included_swaps_per_term: 1, min_term_months: 6, deposit_base_cents: 80000 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /fleets"
              payload: { name: "Util Depot", region_code: "CA" }
              as: PlatformAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_id: "${fleet_id}", plan_id: "${plan_id}", vin: "UV-1", model_label: "XC40", odometer_miles: 0 }
              as: FleetOperator
              captures: { v1: $.data.id, v1_v0: $.data.version }
            - call: "POST /vehicles"
              payload: { fleet_id: "${fleet_id}", plan_id: "${plan_id}", vin: "UV-2", model_label: "XC40", odometer_miles: 0 }
              as: FleetOperator
              captures: { v2: $.data.id, v2_v0: $.data.version }
            - call: "POST /vehicles"
              payload: { fleet_id: "${fleet_id}", plan_id: "${plan_id}", vin: "UV-3", model_label: "XC40", odometer_miles: 0 }
              as: FleetOperator
            - call: "POST /vehicles"
              payload: { fleet_id: "${fleet_id}", plan_id: "${plan_id}", vin: "UV-4", model_label: "XC40", odometer_miles: 0 }
              as: FleetOperator
            - call: "POST /applicants"
              payload: { full_name: "A1", email: "a1@x.com", credit_score: 720, monthly_income_cents: 480000, history_flag: "CLEAN" }
              as: Member
              captures: { ap1: $.data.id }
            - call: "POST /applicants/${ap1}/decide-eligibility"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "POST /applicants"
              payload: { full_name: "A2", email: "a2@x.com", credit_score: 720, monthly_income_cents: 480000, history_flag: "CLEAN" }
              as: Member
              captures: { ap2: $.data.id }
            - call: "POST /applicants/${ap2}/decide-eligibility"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "POST /subscriptions"
              payload: { applicant_id: "${ap1}", plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${ap1}"
              captures: { sub1: $.data.id }
            - call: "POST /subscriptions/${sub1}/assign-vehicle"
              payload: { vehicle_id: "${v1}", expected_vehicle_version: "${v1_v0}" }
              as: FleetOperator
            - call: "POST /couriers"
              payload: { name: "C1", fleet_id: "${fleet_id}" }
              as: FleetOperator
              captures: { cr1: $.data.id }
            - call: "POST /delivery-slots"
              payload: { courier_id: "${cr1}", subscription_id: "${sub1}", kind: "DELIVERY", window_start_iso: "2026-04-01T09:00:00Z", window_end_iso: "2026-04-01T10:00:00Z" }
              as: FleetOperator
            - call: "POST /subscriptions/${sub1}/activate"
              payload: {}
              as: FleetOperator
            - call: "POST /subscriptions"
              payload: { applicant_id: "${ap2}", plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${ap2}"
              captures: { sub2: $.data.id }
            - call: "POST /subscriptions/${sub2}/assign-vehicle"
              payload: { vehicle_id: "${v2}", expected_vehicle_version: "${v2_v0}" }
              as: FleetOperator
          trigger:
            - call: "GET /fleets/${fleet_id}"
              payload: {}
              as: FleetOperator
              captures: { canonical_util: $.data.utilization_pct }
            - call: "GET /fleets/${fleet_id}/utilization"
              payload: { basis: "ASSIGNED_ONLY" }
              as: FleetOperator
              captures: { proj_util: $.data.utilization_pct }
          assert:
            - "Fleet.${fleet_id}.utilization_pct == 0.5"
            - "GET /fleets/${fleet_id}/utilization?basis=ASSIGNED_ONLY utilization_pct == 0.25"
            - "canonical_util != proj_util (0.5 != 0.25) for identical vehicle state"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: mileage_overage_tiered_selection_mode_a
        grounds:
          - calculations.mileage_overage
          - state_machines.Subscription.PENDING_DELIVERY_to_ACTIVE
          - endpoints["POST /billing-cycles/{id}/close"]
        distinguishing_aspect: |
          Mode (a): >=3 inputs (delta, included, buffer, two tier rates, tier1 limit) with nested
          min/max tier selection — billable=max(0,delta-included-buffer); tier1=min(billable,200);
          tier2=max(0,billable-200); overage = 200*25 + 250*38 = 14500 for delta 1500.
        test_recipe:
          setup:
            - "PLUS plan included 1000, buffer 50, tier1_rate 25, tier2_rate 38; vehicle odometer 5000 at activation; cycle #1 OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 80000, included_miles_per_cycle: 1000, free_buffer_miles: 50, overage_tier1_rate_cents: 25, overage_tier2_rate_cents: 38, included_swaps_per_term: 1, min_term_months: 6, deposit_base_cents: 80000 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /fleets"
              payload: { name: "D", region_code: "CA" }
              as: PlatformAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_id: "${fleet_id}", plan_id: "${plan_id}", vin: "OV-1", model_label: "XC40", odometer_miles: 5000 }
              as: FleetOperator
              captures: { veh_id: $.data.id, veh_v0: $.data.version }
            - call: "POST /applicants"
              payload: { full_name: "M", email: "ov@x.com", credit_score: 720, monthly_income_cents: 480000, history_flag: "CLEAN" }
              as: Member
              captures: { appl_id: $.data.id }
            - call: "POST /applicants/${appl_id}/decide-eligibility"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "POST /subscriptions"
              payload: { applicant_id: "${appl_id}", plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${appl_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/assign-vehicle"
              payload: { vehicle_id: "${veh_id}", expected_vehicle_version: "${veh_v0}" }
              as: FleetOperator
            - call: "POST /couriers"
              payload: { name: "C", fleet_id: "${fleet_id}" }
              as: FleetOperator
              captures: { cr: $.data.id }
            - call: "POST /delivery-slots"
              payload: { courier_id: "${cr}", subscription_id: "${sub_id}", kind: "DELIVERY", window_start_iso: "2026-04-01T09:00:00Z", window_end_iso: "2026-04-01T10:00:00Z" }
              as: FleetOperator
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: FleetOperator
            - call: "GET /subscriptions/${sub_id}/billing-cycles"
              payload: { status: "OPEN" }
              as: BillingAdmin
              captures: { cycle_id: $.data.0.id }
          trigger:
            - call: "POST /billing-cycles/${cycle_id}/close"
              payload: { odometer_end_miles: 6500 }
              as: BillingAdmin
              captures: { closed_overage: $.data.overage_cents }
          assert:
            - "BillingCycle.${cycle_id}.overage_cents == 14500"
            - "the posted CYCLE Invoice.amount_cents == 94500 (monthly_fee 80000 + overage 14500)"

      - name: swap_net_adjustment_eval_order_mode_c
        grounds:
          - calculations.swap_net_adjustment
          - state_machines.SwapRequest.APPROVED_to_COMPLETED
          - entities.Subscription.fields.swaps_used
        distinguishing_aspect: |
          Mode (c): circular-looking eval order — net depends on swap_fee, which is gated on swaps_used
          checked BEFORE this swap increments it; eval order pinned credit_old -> charge_new -> fee -> net.
          For a chargeable upgrade (swaps_used=1>=1) with remaining 12/30: 38000 - 32000 + 7500 = 13500.
        test_recipe:
          setup:
            - "Subscription ACTIVE on PLUS (80000) since 2026-04-01; cycle #1 OPEN; one prior free swap already done so swaps_used=1."
            - "A second AVAILABLE PREMIUM (95000) vehicle in the same fleet to upgrade into; clock at 2026-04-19 (remaining 12 of 30 April days)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 80000, included_miles_per_cycle: 1000, free_buffer_miles: 50, overage_tier1_rate_cents: 25, overage_tier2_rate_cents: 38, included_swaps_per_term: 1, min_term_months: 6, deposit_base_cents: 80000 }
              as: PlatformAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 95000, included_miles_per_cycle: 1500, free_buffer_miles: 50, overage_tier1_rate_cents: 25, overage_tier2_rate_cents: 38, included_swaps_per_term: 1, min_term_months: 6, deposit_base_cents: 100000 }
              as: PlatformAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /fleets"
              payload: { name: "SW", region_code: "CA" }
              as: PlatformAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_id: "${fleet_id}", plan_id: "${plus_id}", vin: "SW-A", model_label: "XC40", odometer_miles: 0 }
              as: FleetOperator
              captures: { vA: $.data.id, vA_v0: $.data.version }
            - call: "POST /vehicles"
              payload: { fleet_id: "${fleet_id}", plan_id: "${plus_id}", vin: "SW-B", model_label: "XC40", odometer_miles: 0 }
              as: FleetOperator
              captures: { vB: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_id: "${fleet_id}", plan_id: "${prem_id}", vin: "SW-C", model_label: "XC60", odometer_miles: 0 }
              as: FleetOperator
              captures: { vC: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "M", email: "sw@x.com", credit_score: 720, monthly_income_cents: 480000, history_flag: "CLEAN" }
              as: Member
              captures: { appl_id: $.data.id }
            - call: "POST /applicants/${appl_id}/decide-eligibility"
              payload: { plan_id: "${plus_id}" }
              as: BillingAdmin
            - call: "POST /subscriptions"
              payload: { applicant_id: "${appl_id}", plan_id: "${plus_id}" }
              as: Member
              as_user_id: "${appl_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/assign-vehicle"
              payload: { vehicle_id: "${vA}", expected_vehicle_version: "${vA_v0}" }
              as: FleetOperator
            - call: "POST /couriers"
              payload: { name: "C", fleet_id: "${fleet_id}" }
              as: FleetOperator
              captures: { cr: $.data.id }
            - call: "POST /delivery-slots"
              payload: { courier_id: "${cr}", subscription_id: "${sub_id}", kind: "DELIVERY", window_start_iso: "2026-04-01T09:00:00Z", window_end_iso: "2026-04-01T10:00:00Z" }
              as: FleetOperator
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: FleetOperator
            - call: "POST /subscriptions/${sub_id}/swap-requests"
              payload: { to_vehicle_id: "${vB}" }
              as: Member
              as_user_id: "${appl_id}"
              captures: { sw1: $.data.id }
            - call: "GET /vehicles/${vB}"
              payload: {}
              as: FleetOperator
              captures: { vB_v: $.data.version }
            - call: "POST /swap-requests/${sw1}/approve"
              payload: { expected_vehicle_version: "${vB_v}" }
              as: FleetOperator
            - call: "POST /swap-requests/${sw1}/complete"
              payload: {}
              as: FleetOperator
            - call: "POST /subscriptions/${sub_id}/swap-requests"
              payload: { to_vehicle_id: "${vC}" }
              as: Member
              as_user_id: "${appl_id}"
              captures: { sw2: $.data.id }
            - call: "GET /vehicles/${vC}"
              payload: {}
              as: FleetOperator
              captures: { vC_v: $.data.version }
            - call: "POST /swap-requests/${sw2}/approve"
              payload: { expected_vehicle_version: "${vC_v}" }
              as: FleetOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-19T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /swap-requests/${sw2}/complete"
              payload: {}
              as: FleetOperator
              captures: { net_adj: $.data.net_adjustment_cents, fee_applied: $.data.swap_fee_applied_cents }
          assert:
            - "SwapRequest.${sw2}.swap_fee_applied_cents == 7500 (swaps_used was 1 >= included_swaps 1 BEFORE increment)"
            - "SwapRequest.${sw2}.net_adjustment_cents == 13500 (charge_new 38000 - credit_old 32000 + fee 7500)"
            - "Subscription.${sub_id}.swaps_used == 2 after completion"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: vehicle_cyclic_available_reserved_assigned_inspection_available
        grounds:
          - state_machines.Vehicle.AVAILABLE_to_RESERVED
          - state_machines.Vehicle.IN_INSPECTION_to_AVAILABLE
          - entities.Vehicle.fields.status
        distinguishing_aspect: |
          Vehicle is cyclic: AVAILABLE->RESERVED->ASSIGNED->IN_INSPECTION->AVAILABLE returns the same
          vehicle to its initial state and it can be re-assigned to a new subscription — a loop, not a
          linear pipeline. (Distinct entity from the Subscription parallel-axes instance.)
        test_recipe:
          setup:
            - "One vehicle taken full loop: assigned, activated, returned, settled (back to AVAILABLE), then assigned again to a second subscription."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 80000, included_miles_per_cycle: 1000, free_buffer_miles: 50, overage_tier1_rate_cents: 25, overage_tier2_rate_cents: 38, included_swaps_per_term: 1, min_term_months: 6, deposit_base_cents: 80000 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /fleets"
              payload: { name: "Cyc", region_code: "CA" }
              as: PlatformAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_id: "${fleet_id}", plan_id: "${plan_id}", vin: "CY-1", model_label: "XC40", odometer_miles: 100 }
              as: FleetOperator
              captures: { veh_id: $.data.id, veh_v0: $.data.version }
            - call: "POST /applicants"
              payload: { full_name: "A", email: "cy1@x.com", credit_score: 720, monthly_income_cents: 480000, history_flag: "CLEAN" }
              as: Member
              captures: { ap1: $.data.id }
            - call: "POST /applicants/${ap1}/decide-eligibility"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "POST /subscriptions"
              payload: { applicant_id: "${ap1}", plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${ap1}"
              captures: { sub1: $.data.id }
            - call: "POST /subscriptions/${sub1}/assign-vehicle"
              payload: { vehicle_id: "${veh_id}", expected_vehicle_version: "${veh_v0}" }
              as: FleetOperator
            - call: "POST /couriers"
              payload: { name: "C", fleet_id: "${fleet_id}" }
              as: FleetOperator
              captures: { cr: $.data.id }
            - call: "POST /delivery-slots"
              payload: { courier_id: "${cr}", subscription_id: "${sub1}", kind: "DELIVERY", window_start_iso: "2026-04-01T09:00:00Z", window_end_iso: "2026-04-01T10:00:00Z" }
              as: FleetOperator
            - call: "POST /subscriptions/${sub1}/activate"
              payload: {}
              as: FleetOperator
            - call: "POST /subscriptions/${sub1}/initiate-return"
              payload: {}
              as: Member
              as_user_id: "${ap1}"
            - call: "POST /return-inspections"
              payload: { subscription_id: "${sub1}", vehicle_id: "${veh_id}", reported_odometer_miles: 200 }
              as: FleetOperator
              captures: { insp_id: $.data.id }
            - call: "POST /return-inspections/${insp_id}/assess"
              payload: {}
              as: FleetOperator
            - call: "POST /return-inspections/${insp_id}/settle"
              payload: {}
              as: BillingAdmin
            - call: "POST /applicants"
              payload: { full_name: "B", email: "cy2@x.com", credit_score: 720, monthly_income_cents: 480000, history_flag: "CLEAN" }
              as: Member
              captures: { ap2: $.data.id }
            - call: "POST /applicants/${ap2}/decide-eligibility"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "POST /subscriptions"
              payload: { applicant_id: "${ap2}", plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${ap2}"
              captures: { sub2: $.data.id }
            - call: "GET /vehicles/${veh_id}"
              payload: {}
              as: FleetOperator
              captures: { veh_v_after: $.data.version }
          trigger:
            - call: "POST /subscriptions/${sub2}/assign-vehicle"
              payload: { vehicle_id: "${veh_id}", expected_vehicle_version: "${veh_v_after}" }
              as: FleetOperator
              captures: { reassigned_vehicle: $.data.active_vehicle_id }
          assert:
            - "Vehicle.${veh_id}.status == RESERVED again after the full loop (AVAILABLE re-entered then re-RESERVED)"
            - "Vehicle.${veh_id}.active_subscription_id == ${sub2}"
            - "Subscription.${sub2}.active_vehicle_id == ${veh_id}"

      - name: subscription_parallel_lifecycle_and_billing_axes
        grounds:
          - state_machines.Subscription.ACTIVE_to_RETURN_PENDING
          - entities.Subscription.fields.lifecycle_status
          - entities.Subscription.fields.billing_status
        distinguishing_aspect: |
          Subscription carries two independent state axes: marking PAST_DUE changes billing_status while
          lifecycle_status stays ACTIVE, then record-payment flips billing_status back without touching
          lifecycle — parallel dimensions on one row. (Distinct entity from the cyclic Vehicle instance.)
        test_recipe:
          setup:
            - "Subscription ACTIVE on PLUS; billing_status CURRENT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscription-plans"
