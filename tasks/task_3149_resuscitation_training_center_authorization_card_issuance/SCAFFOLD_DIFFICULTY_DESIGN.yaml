              payload: { monitored_at: "2028-12-20T00:00:00Z", course_type_observed: "BLS_PROVIDER", outcome: "SATISFACTORY" }
              as: TrainingFaculty
              as_user_id: "${faculty2_id}"
              captures: { }
            - call: "GET /aha/instructors/${cand_id}"
              payload: {}
              as: TCAdmin
              captures: { cand_status_monitored: $.data.status }
            - call: "POST /aha/instructors/${cand_id}/certify"
