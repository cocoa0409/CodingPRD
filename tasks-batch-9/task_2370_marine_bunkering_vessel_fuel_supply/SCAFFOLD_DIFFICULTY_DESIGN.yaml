  - rule_id: non_linear_state_machine
    instances:
      - name: nomination_parallel_compliance_and_fulfillment_dimensions
        grounds:
          - state_machines.Nomination.PENDING_REVIEW_to_REJECTED
          - state_machines.Nomination.REJECTED_to_PENDING_REVIEW
          - state_machines.Nomination.PENDING_REVIEW_to_APPROVED
          - state_machines.Nomination.DRAFT_to_CONFIRMED
          - entities.Nomination.fields.compliance_status
          - entities.Nomination.fields.fulfillment_status
          - entities.Nomination.fields.compliance_reviewer_user_id
        distinguishing_aspect: |
          Nomination carries two parallel state dimensions on one row plus a cycle inside one of
          them: compliance_status walks PENDING_REVIEW -> REJECTED -> PENDING_REVIEW -> APPROVED
          while fulfillment_status stays DRAFT throughout, and the later confirm moves
          fulfillment_status DRAFT -> CONFIRMED without touching compliance_status.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z"
            - "Port NLRTM (ECA), grade MGO-DMA, one index quote 705.00 dated 2026-08-03, customer with credit_limit_usd 5000000.00"
            - "One nomination for 1200.000 mt in (fulfillment DRAFT, compliance PENDING_REVIEW) with eca_documentation_ref present"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: OpsCoordinator
            - call: "POST /ports"
              payload: { port_code: "NLRTM", name: "Rotterdam", eca_zone: true, eca_sulfur_limit_pct: 0.100, notice_lead_hours: 24, concurrent_ops_capacity: 2, spill_response_tier: "TIER_1" }
              as: OpsCoordinator
              captures: { port_id: $.data.id }
            - call: "POST /fuel-grades"
              payload: { grade_code: "MGO-DMA", max_sulfur_pct: 0.100, eca_permitted: true, test_tolerance_pct: 0.010, index_code: "MGO-ARA", base_barging_rate_usd_per_mt: 9.50, min_barging_fee_usd: 2000.00, cross_contamination_group: "DISTILLATE" }
