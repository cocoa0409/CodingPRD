# =============================================================================
# PRD Benchmark Seed Tables — Pay Equity Analysis & Reporting
# =============================================================================

scenario: |
  Pay Equity Analysis & Reporting (compensation analytics team): comparator
  group construction & regression modeling, unexplained gap identification by
  protected class, remediation budget & individual adjustment decisions,
  privilege considerations & analysis governance, pay transparency posting
  requirement by jurisdiction, EEO-style reporting compilation,
  hiring/promotion pipeline analysis, monitoring cadence & re-testing

domain_name: pay-equity-analysis
api_prefix: /api

# =============================================================================
# Complexity Profile (SKILL §0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # privilege governance, EEO filings, audit trail
  secondary_archetype: workflow_orchestration # study lifecycle with legal-review and remediation loops
  complexity_layers:
    - optimistic_concurrency     # OCC on ComparatorGroup.version (run create) and RemediationPlan.version (adjustment decision)
    - dual_variant_calculation   # OLS vs cohort-median gap; FULL_CLOSURE vs PRO_RATA allocation
    - scheduled_actions          # logical clock drives adjustment effectivation + monitoring due
    - cascading_side_effects     # finalize cascade; clock-driven EFFECTIVE → RESOLVED → MONITORING chain
  entity_topology: flat                      # all resources addressable at /api/<collection>/{id}, linked by FK fields
  state_machine_shape: cyclic                # legal-review rework loop, plan reject loop, monitoring re-open loop
  relationship_patterns:
    - one_to_many                # study → snapshots/groups/plans/findings/filings/pipelines/cycles
    - cross_aggregate            # adjustment → finding + snapshot + plan; run → group
  role_model: segregation_of_duties          # adjustment proposer cannot decide it; privilege gated to LegalCounsel
  consistency_model: immediate               # all side effects atomic within the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: PayEquityStudy
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Study name" }
      - { name: analysis_period_start, type: string, source: input, description: "Inclusive first date (YYYY-MM-DD) of the compensation analysis period; CLOSED interval semantics" }
      - { name: analysis_period_end, type: string, source: input, description: "Inclusive last date (YYYY-MM-DD) of the analysis period; must be >= analysis_period_start" }
      - { name: protected_classes, type: array, source: input, description: "Non-empty subset of [GENDER, ETHNICITY, AGE_BAND]; drives which GapFindings a FINAL ModelRun generates" }
      - { name: significance_threshold, type: number, source: input, default: 0.05, description: "p-value ceiling for statistical significance; a finding is significant when p_value <= this (inclusive)" }
      - { name: actionable_gap_pct, type: number, source: input, default: 2.0, description: "Minimum adjusted gap percent for actionability; actionable when adjusted_gap_pct >= this (inclusive)" }
      - { name: min_group_size, type: integer, source: input, default: 30, description: "Minimum ComparatorGroup.member_count required to lock a group; lock passes when member_count >= this (inclusive)" }
      - { name: monitor_cadence_days, type: integer, source: input, default: 180, description: "Cadence days between monitoring windows; informational baseline for MonitoringCycle.due_date" }
      - { name: status, type: enum, source: system, description: "DRAFT | MODELING | UNDER_LEGAL_REVIEW | PRIVILEGED_FINAL | REMEDIATION_OPEN | MONITORING | CLOSED" }
      - { name: review_rounds, type: integer, source: system, default: 0, description: "Increments by 1 every time the study enters UNDER_LEGAL_REVIEW" }
      - { name: privileged_model_run_ids, type: array, source: system, default: [], description: "Ids of all FINAL ModelRuns pinned when legal approves; cleared when privilege is invalidated or review is re-opened" }
      - { name: snapshot_count, type: integer, source: computed, description: "Count of EmployeeSnapshots with study_id == this study" }
      - { name: assigned_snapshot_count, type: integer, source: computed, description: "Count of this study's snapshots whose comparator_group_id is non-null" }
      - { name: unresolved_finding_count, type: integer, source: computed, description: "Count of this study's GapFindings with status IN {FLAGGED, TARGETED}" }
      - { name: actionable_finding_count, type: integer, source: computed, description: "Count of this study's GapFindings with is_actionable == true AND status != DISMISSED" }

  - name: EmployeeSnapshot
    parent: PayEquityStudy
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> PayEquityStudy.id; immutable after creation" }
      - { name: employee_ref, type: string, source: input, description: "Opaque employee identifier; unique within the study" }
      - { name: gender_class, type: enum, source: input, description: "MALE | FEMALE | NONBINARY" }
      - { name: ethnicity_class, type: enum, source: input, description: "WHITE | BLACK | HISPANIC | ASIAN | OTHER" }
      - { name: age_band, type: enum, source: input, description: "UNDER_40 | FORTY_PLUS" }
      - { name: job_family, type: string, source: input, description: "Job family code, e.g. ENG" }
      - { name: job_level, type: integer, source: input, description: "Level 1..10; feeds the OLS level deflation" }
      - { name: location_code, type: string, source: input, description: "Work location code, e.g. CA" }
      - { name: fte_factor, type: number, source: input, description: "Full-time-equivalent factor, 0 < fte <= 1.0" }
      - { name: base_salary_cents, type: integer, source: input, description: "Annual base salary actually paid, cents, >= 0" }
      - { name: bonus_cents, type: integer, source: input, description: "Annual bonus paid, cents, >= 0" }
      - { name: hire_date, type: string, source: input, description: "YYYY-MM-DD hire date" }
      - { name: comparator_group_id, type: string, source: input, default: null, description: "FK -> ComparatorGroup.id; nullable; set/cleared via PATCH; a snapshot belongs to at most one group" }
      - { name: annualized_base_cents, type: integer, source: computed, description: "= ROUND(base_salary_cents / fte_factor, 0) half-up; FTE-normalized annual base" }
      - { name: tenure_years, type: number, source: computed, description: "= ROUND((study.analysis_period_end - hire_date) / 365.25, 2)" }

  - name: ComparatorGroup
    parent: PayEquityStudy
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> PayEquityStudy.id" }
      - { name: name, type: string, source: input, description: "Group label; unique within the study" }
      - { name: job_family, type: string, source: input, description: "Membership criterion: snapshot.job_family must equal this" }
      - { name: min_job_level, type: integer, source: input, description: "Membership criterion: snapshot.job_level >= this (inclusive lower bound of the substantially-similar band)" }
      - { name: max_job_level, type: integer, source: input, description: "Membership criterion: snapshot.job_level <= this (inclusive upper bound); must be >= min_job_level" }
      - { name: location_code, type: string, source: input, description: "Membership criterion: snapshot.location_code must equal this" }
      - { name: member_count, type: integer, source: computed, description: "Count of EmployeeSnapshots with comparator_group_id == this group" }
      - { name: status, type: enum, source: system, description: "DRAFT | LOCKED | ANALYZED" }

  - name: ModelRun
    parent: ComparatorGroup
    common_fields: true
    fields:
      - { name: comparator_group_id, type: string, source: input, description: "FK -> ComparatorGroup.id" }
      - { name: study_id, type: string, source: system, description: "FK -> PayEquityStudy.id; denormalized from the group at creation" }
      - { name: methodology, type: enum, source: input, description: "REGRESSION_OLS | COHORT_MEDIAN; selects the adjusted_pay_gap variant" }
      - { name: run_index, type: integer, source: computed, description: "Per-group sequential index = count of prior runs for the group + 1" }
      - { name: per_class_results, type: object, source: computed, description: "Keyed by '<DIMENSION>:<CLASS_VALUE>' (e.g. 'GENDER:FEMALE') for each non-reference class value with >=1 member; value = { reference_class, class_headcount, reference_headcount, adjusted_gap_pct, p_value }" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINAL | SUPERSEDED" }
      - { name: finalized_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp when finalized" }

  - name: GapFinding
    parent: ModelRun
    common_fields: true
    fields:
      - { name: model_run_id, type: string, source: system, description: "FK -> ModelRun.id; set at generation on finalize" }
      - { name: comparator_group_id, type: string, source: system, description: "FK -> ComparatorGroup.id; denormalized from the run" }
      - { name: study_id, type: string, source: system, description: "FK -> PayEquityStudy.id; denormalized from the run" }
      - { name: protected_class, type: enum, source: system, description: "GENDER | ETHNICITY | AGE_BAND (the dimension)" }
      - { name: class_value, type: string, source: system, description: "Non-reference class value analyzed, e.g. FEMALE, BLACK, FORTY_PLUS" }
      - { name: reference_class, type: string, source: system, description: "Baseline class value: MALE for GENDER, WHITE for ETHNICITY, UNDER_40 for AGE_BAND" }
      - { name: adjusted_gap_pct, type: number, source: system, description: "Copied from the run's per_class_results at generation" }
      - { name: p_value, type: number, source: system, description: "Copied from the run's per_class_results at generation" }
      - { name: affected_headcount, type: integer, source: system, description: "= class_headcount at generation" }
      - { name: is_actionable, type: boolean, source: computed, description: "= adjusted_gap_pct >= study.actionable_gap_pct AND p_value <= study.significance_threshold (both inclusive)" }
      - { name: status, type: enum, source: system, description: "FLAGGED | TARGETED | MONITORED | DISMISSED | RESOLVED" }
      - { name: disposition_rationale, type: string, source: input, default: null, description: "Required when disposition == DISMISSED" }
      - { name: disposition_by_user_id, type: string, source: system, default: null, description: "X-User-ID that dispositioned the finding" }

  - name: RemediationPlan
    parent: PayEquityStudy
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> PayEquityStudy.id; at most one non-COMPLETED plan per study" }
      - { name: total_budget_cents, type: integer, source: input, description: "Approved remediation envelope, cents, > 0" }
      - { name: allocation_strategy, type: enum, source: input, default: FULL_CLOSURE, description: "FULL_CLOSURE | PRO_RATA; selects the remediation_suggested_allocation variant" }
      - { name: committed_cents, type: integer, source: computed, description: "= SUM(approved_increase_cents) over this plan's adjustments with status IN {APPROVED, EFFECTIVE}" }
      - { name: remaining_cents, type: integer, source: computed, description: "= total_budget_cents - committed_cents" }
      - { name: rejection_count, type: integer, source: system, default: 0, description: "Increments on each committee REJECT decision" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | EXECUTING | FULLY_COMMITTED | COMPLETED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the CompAnalyst creator" }

  - name: Adjustment
    parent: RemediationPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> RemediationPlan.id" }
      - { name: gap_finding_id, type: string, source: input, description: "FK -> GapFinding.id; must be a TARGETED finding of the plan's study" }
      - { name: employee_snapshot_id, type: string, source: input, description: "FK -> EmployeeSnapshot.id; must belong to the plan's study" }
      - { name: study_id, type: string, source: system, description: "FK -> PayEquityStudy.id; denormalized from the plan" }
      - { name: proposed_increase_cents, type: integer, source: input, description: "Proposed annual base increase, cents, > 0" }
      - { name: approved_increase_cents, type: integer, source: system, default: null, description: "= proposed_increase_cents, stamped at approval" }
      - { name: effective_date, type: string, source: input, description: "YYYY-MM-DD; must be >= the current logical-clock date at creation; APPROVED -> EFFECTIVE when the clock reaches it" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED | EFFECTIVE | REVERSED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of proposer; segregation of duties: the decider's X-User-ID must differ" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the RemediationApprover who decided" }

  - name: ReportFiling
    parent: PayEquityStudy
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> PayEquityStudy.id" }
      - { name: report_type, type: enum, source: input, description: "EEO_WORKFORCE_COMP | STATE_PAY_DATA" }
      - { name: jurisdiction_rule_id, type: string, source: input, default: null, description: "FK -> JurisdictionRule.id; required when report_type == STATE_PAY_DATA" }
      - { name: reporting_year, type: integer, source: input, description: "Calendar year being reported" }
      - { name: due_date, type: string, source: input, description: "YYYY-MM-DD statutory due date; submission on this exact date is NOT late" }
      - { name: band_rows, type: array, source: computed, default: null, description: "Compiled rows [{band, gender_class, headcount}]; null until first compile; cleared on reopen" }
      - { name: total_headcount, type: integer, source: computed, default: null, description: "SUM of band_rows headcount; MUST equal the study's snapshot_count at compile time" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of submission" }
      - { name: late_submission, type: boolean, source: computed, default: null, description: "Set at submit: true iff the clock's UTC date is strictly after due_date" }
      - { name: status, type: enum, source: system, description: "COMPILING | INTERNAL_REVIEW | SUBMITTED | ACCEPTED | REJECTED" }

  - name: JurisdictionRule
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_code, type: string, source: input, description: "Unique jurisdiction code, e.g. CA, CO, NYC" }
      - { name: range_disclosure_required, type: boolean, source: input, default: false, description: "When true, postings must carry both min_salary_cents and max_salary_cents to publish" }
      - { name: max_range_spread_pct, type: number, source: input, default: null, description: "When non-null, publish requires (max - min) / min * 100 <= this cap" }
      - { name: min_posting_duration_days, type: integer, source: input, default: 0, description: "A posting may close only when clock_date >= published date + this many days (inclusive)" }
      - { name: pay_data_report_required, type: boolean, source: input, default: false, description: "Whether this jurisdiction mandates state pay-data reporting" }
      - { name: filing_due_month, type: integer, source: input, default: null, description: "1..12 statutory filing month" }
      - { name: filing_due_day, type: integer, source: input, default: null, description: "1..31 statutory filing day" }

  - name: TransparencyPosting
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_rule_id, type: string, source: input, description: "FK -> JurisdictionRule.id" }
      - { name: job_posting_ref, type: string, source: input, description: "Unique external posting reference" }
      - { name: title, type: string, source: input, description: "Job title" }
      - { name: min_salary_cents, type: integer, source: input, default: null, description: "Posted range floor; nullable until provided" }
      - { name: max_salary_cents, type: integer, source: input, default: null, description: "Posted range ceiling; nullable until provided" }
      - { name: published_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp at publish" }
      - { name: closed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp at close" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | CLOSED" }

  - name: PipelineAnalysis
    parent: PayEquityStudy
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> PayEquityStudy.id" }
      - { name: stage, type: enum, source: input, description: "APPLICATION | SCREEN | INTERVIEW | OFFER | HIRE | PROMOTION" }
      - { name: cohort_period_start, type: string, source: input, description: "YYYY-MM-DD cohort window start" }
      - { name: cohort_period_end, type: string, source: input, description: "YYYY-MM-DD cohort window end; >= start" }
      - { name: records, type: array, source: input, description: "Non-empty [{class_label: string, count_in: int >= 0, count_passed: int >= 0}]; count_passed <= count_in per record" }
      - { name: pass_rates, type: object, source: computed, description: "{class_label: ROUND(count_passed / count_in, 4) half-up} for records with count_in > 0" }
      - { name: adverse_impact_ratio, type: number, source: computed, default: null, description: "ROUND(min(pass_rates) / max(pass_rates), 4) computed FROM the rounded pass rates; null when fewer than 2 classes have count_in > 0" }
      - { name: adverse_impact_flag, type: boolean, source: computed, description: "true iff adverse_impact_ratio is non-null AND < 0.80 (four-fifths rule); exactly 0.8000 is NOT flagged" }
      - { name: highest_rate_class, type: string, source: computed, default: null, description: "class_label holding max pass rate; ties broken by earliest records index" }

  - name: MonitoringCycle
    parent: PayEquityStudy
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> PayEquityStudy.id; study must be MONITORING at creation" }
      - { name: window_start, type: string, source: input, description: "YYYY-MM-DD; HALF-OPEN window [window_start, window_end)" }
      - { name: window_end, type: string, source: input, description: "YYYY-MM-DD; exclusive; must be > window_start" }
      - { name: due_date, type: string, source: input, description: "YYYY-MM-DD re-test due date; must be >= window_end; SCHEDULED -> DUE when clock date >= due_date" }
      - { name: cycle_index, type: integer, source: computed, description: "Per-study sequential index = count of prior cycles for the study + 1" }
      - { name: retest_result, type: enum, source: input, default: null, description: "GAPS_CLOSED | GAPS_PERSIST | INCONCLUSIVE; supplied at complete" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DUE | RE_TESTING | COMPLETED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PayEquityStudy
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: MODELING
        trigger: "POST /api/pay-equity-studies/{studyId}/advance"
        actor: CompAnalyst
        preconditions:
          - "At least one ComparatorGroup of this study has member_count >= study.min_group_size (ERR_NO_QUALIFYING_GROUPS)"
          - "Study is DRAFT (ERR_STUDY_INVALID_STATE)"
        side_effects:
          - "Snapshot creation and compensation-field edits become locked (ERR_SNAPSHOT_LOCKED while status != DRAFT)"
      - from: MODELING
        to: UNDER_LEGAL_REVIEW
        trigger: "POST /api/pay-equity-studies/{studyId}/submit-legal-review"
        actor: CompAnalyst
        preconditions:
          - "Study is MODELING (ERR_STUDY_INVALID_STATE)"
          - "Every ComparatorGroup with status LOCKED or ANALYZED has at least one FINAL ModelRun (ERR_UNANALYZED_GROUPS)"
        side_effects:
          - "review_rounds += 1"
      - from: UNDER_LEGAL_REVIEW
        to: PRIVILEGED_FINAL
        trigger: "POST /api/pay-equity-studies/{studyId}/legal-decision with decision=APPROVE"
        actor: LegalCounsel
        preconditions:
          - "Study is UNDER_LEGAL_REVIEW (ERR_STUDY_INVALID_STATE)"
        side_effects:
          - "privileged_model_run_ids := ids of all FINAL ModelRuns in the study (version-pin on approval)"
      - from: UNDER_LEGAL_REVIEW
        to: DRAFT
        trigger: "POST /api/pay-equity-studies/{studyId}/legal-decision with decision=REQUEST_CHANGES"
        actor: LegalCounsel
        preconditions:
          - "Study is UNDER_LEGAL_REVIEW (ERR_STUDY_INVALID_STATE)"
          - "rationale is non-empty (ERR_RATIONALE_REQUIRED)"
        side_effects:
          - "privileged_model_run_ids := []"
          - "Snapshots editable again (study back in DRAFT) — rework loop"
      - from: PRIVILEGED_FINAL
        to: UNDER_LEGAL_REVIEW
        trigger: "system (automatic when a ModelRun in this study transitions PROVISIONAL -> FINAL while study is PRIVILEGED_FINAL — new evidence invalidates the pinned privilege set)"
        actor: system
        preconditions: []
        side_effects:
          - "privileged_model_run_ids := []"
          - "review_rounds += 1"
      - from: PRIVILEGED_FINAL
        to: REMEDIATION_OPEN
        trigger: "POST /api/pay-equity-studies/{studyId}/open-remediation"
        actor: LegalCounsel
        preconditions:
          - "Study is PRIVILEGED_FINAL (ERR_STUDY_INVALID_STATE)"
        side_effects: []
      - from: PRIVILEGED_FINAL
        to: CLOSED
        trigger: "POST /api/pay-equity-studies/{studyId}/close (clean-study path)"
        actor: LegalCounsel
        preconditions:
          - "Study is PRIVILEGED_FINAL and actionable_finding_count == 0 (else ERR_GAPS_NOT_CLOSED)"
        side_effects: []
      - from: REMEDIATION_OPEN
        to: MONITORING
        trigger: "POST /api/pay-equity-studies/{studyId}/begin-monitoring OR system auto-transition when the condition below becomes true"
        actor: CompAnalyst | system
        preconditions:
          - "unresolved_finding_count == 0 (ERR_GAPS_NOT_RESOLVED — checked first)"
          - "The study's non-COMPLETED RemediationPlan (if any) has status IN {FULLY_COMMITTED, COMPLETED}; a plan must exist (ERR_PLAN_NOT_COMMITTED)"
        side_effects: []
      - from: MONITORING
        to: REMEDIATION_OPEN
        trigger: "system (automatic when a MonitoringCycle completes with retest_result == GAPS_PERSIST)"
        actor: system
        preconditions: []
        side_effects:
          - "A new RemediationPlan may be created for the study (prior plan is COMPLETED and does not block)"
      - from: MONITORING
        to: CLOSED
        trigger: "POST /api/pay-equity-studies/{studyId}/close"
        actor: LegalCounsel
        preconditions:
          - "Study is MONITORING (ERR_STUDY_INVALID_STATE)"
          - "Latest COMPLETED MonitoringCycle (by cycle_index) has retest_result == GAPS_CLOSED (ERR_GAPS_NOT_CLOSED)"
        side_effects: []

  - entity: ComparatorGroup
    initial_state: DRAFT
    terminal_states: [ANALYZED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /api/comparator-groups/{groupId}/lock"
        actor: CompAnalyst
        preconditions:
          - "Group is DRAFT (ERR_GROUP_INVALID_STATE)"
          - "Parent study is MODELING (ERR_STUDY_NOT_MODELING)"
          - "member_count >= study.min_group_size (ERR_GROUP_BELOW_MIN_SIZE — inclusive boundary)"
        side_effects:
          - "Membership frozen: PATCH assigning/unassigning snapshots to/from this group now fails (ERR_GROUP_INVALID_STATE)"
      - from: LOCKED
        to: ANALYZED
        trigger: "system (automatic when a ModelRun of this group transitions PROVISIONAL -> FINAL and its GapFinding generation completes)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ModelRun
    initial_state: PROVISIONAL
    terminal_states: [FINAL, SUPERSEDED]
    transitions:
      - from: PROVISIONAL
        to: SUPERSEDED
        trigger: "system (automatic when a newer ModelRun is created for the same ComparatorGroup)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /api/model-runs/{runId}/finalize"
        actor: CompAnalyst
        preconditions:
          - "Run is PROVISIONAL (ERR_RUN_INVALID_STATE)"
        side_effects:
          - "finalized_at := current logical clock"
          - "Generate one GapFinding per key of per_class_results whose dimension is in study.protected_classes (status FLAGGED); generation order is pinned: study.protected_classes array order, and within a dimension by class_value ASC"
          - "Parent ComparatorGroup LOCKED -> ANALYZED"
          - "If parent study is PRIVILEGED_FINAL: study -> UNDER_LEGAL_REVIEW and privileged_model_run_ids := [] (privilege invalidated by new evidence)"
          - "Recompute study.unresolved_finding_count and study.actionable_finding_count"

  - entity: GapFinding
    initial_state: FLAGGED
    terminal_states: [DISMISSED, MONITORED, RESOLVED]
    transitions:
      - from: FLAGGED
        to: TARGETED
        trigger: "POST /api/gap-findings/{findingId}/disposition with disposition=TARGETED"
        actor: CompAnalyst
        preconditions:
          - "Finding is FLAGGED (ERR_FINDING_INVALID_STATE)"
          - "Parent study is REMEDIATION_OPEN (ERR_STUDY_NOT_IN_REMEDIATION)"
          - "is_actionable == true (ERR_FINDING_NOT_ACTIONABLE)"
        side_effects:
          - "disposition_by_user_id := X-User-ID"
          - "Recompute study.unresolved_finding_count (TARGETED remains unresolved)"
      - from: FLAGGED
        to: MONITORED
        trigger: "POST /api/gap-findings/{findingId}/disposition with disposition=MONITORED"
        actor: CompAnalyst
        preconditions:
          - "Finding is FLAGGED (ERR_FINDING_INVALID_STATE)"
          - "Parent study is REMEDIATION_OPEN (ERR_STUDY_NOT_IN_REMEDIATION)"
        side_effects:
          - "disposition_by_user_id := X-User-ID"
          - "Recompute study.unresolved_finding_count"
          - "If unresolved_finding_count == 0 and a plan is FULLY_COMMITTED or COMPLETED: study REMEDIATION_OPEN -> MONITORING (auto)"
      - from: FLAGGED
        to: DISMISSED
        trigger: "POST /api/gap-findings/{findingId}/disposition with disposition=DISMISSED"
        actor: CompAnalyst
        preconditions:
          - "Finding is FLAGGED (ERR_FINDING_INVALID_STATE)"
          - "Parent study is REMEDIATION_OPEN (ERR_STUDY_NOT_IN_REMEDIATION)"
          - "disposition_rationale is non-empty (ERR_RATIONALE_REQUIRED)"
        side_effects:
          - "disposition_by_user_id := X-User-ID; disposition_rationale stored"
          - "Recompute study.unresolved_finding_count and study.actionable_finding_count"
          - "Auto-monitoring check (same as MONITORED side effect)"
      - from: TARGETED
        to: RESOLVED
        trigger: "system (automatic when no Adjustment referencing this finding remains in PROPOSED or APPROVED AND at least one referencing Adjustment is EFFECTIVE; re-evaluated on every Adjustment EFFECTIVE/REJECTED/REVERSED transition)"
        actor: system
        preconditions: []
        side_effects:
          - "Recompute study.unresolved_finding_count"
          - "If unresolved_finding_count == 0 and the study's plan is FULLY_COMMITTED or COMPLETED: study REMEDIATION_OPEN -> MONITORING (auto)"

  - entity: RemediationPlan
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/remediation-plans/{planId}/submit"
        actor: CompAnalyst
        preconditions:
          - "Plan is DRAFT (ERR_PLAN_INVALID_STATE)"
          - "At least one Adjustment of this plan is PROPOSED (ERR_PLAN_EMPTY)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/remediation-plans/{planId}/decision with decision=APPROVE"
        actor: RemediationApprover
        preconditions:
          - "Plan is SUBMITTED (ERR_PLAN_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /api/remediation-plans/{planId}/decision with decision=REJECT"
        actor: RemediationApprover
        preconditions:
          - "Plan is SUBMITTED (ERR_PLAN_INVALID_STATE)"
          - "rationale is non-empty (ERR_RATIONALE_REQUIRED)"
        side_effects:
          - "rejection_count += 1 (rework loop)"
      - from: APPROVED
        to: EXECUTING
        trigger: "system (automatic when the plan's first Adjustment transitions PROPOSED -> APPROVED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXECUTING
        to: FULLY_COMMITTED
        trigger: "system (automatic when committed_cents == total_budget_cents after a recompute)"
        actor: system
        preconditions: []
        side_effects:
          - "Study auto-monitoring check runs if unresolved_finding_count == 0"
      - from: FULLY_COMMITTED
        to: EXECUTING
        trigger: "system (automatic when an EFFECTIVE Adjustment is REVERSED and committed_cents drops below total_budget_cents)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXECUTING
        to: COMPLETED
        trigger: "system (automatic when no Adjustment remains in PROPOSED or APPROVED AND at least one Adjustment is EFFECTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "Study auto-monitoring check runs if unresolved_finding_count == 0"
      - from: FULLY_COMMITTED
        to: COMPLETED
        trigger: "system (same completion condition as EXECUTING -> COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "Study auto-monitoring check runs if unresolved_finding_count == 0"

  - entity: Adjustment
    initial_state: PROPOSED
    terminal_states: [REJECTED, REVERSED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /api/adjustments/{adjustmentId}/decision with decision=APPROVE"
        actor: RemediationApprover
        preconditions:
          - "Adjustment is PROPOSED (ERR_ADJUSTMENT_INVALID_STATE)"
          - "OCC: expected_plan_version == plan.version (ERR_STALE_PLAN_VERSION, 412 — evaluated before state)"
          - "Parent plan status IN {APPROVED, EXECUTING} (ERR_PLAN_NOT_APPROVED)"
          - "decided_by X-User-ID != created_by_user_id (ERR_SELF_DECISION_FORBIDDEN)"
          - "plan.committed_cents + proposed_increase_cents <= plan.total_budget_cents (ERR_BUDGET_EXCEEDED — inclusive boundary: equality is allowed)"
        side_effects:
          - "approved_increase_cents := proposed_increase_cents; decided_by_user_id := X-User-ID"
          - "plan.committed_cents recompute; plan.version += 1"
          - "If plan was APPROVED: plan -> EXECUTING"
          - "If plan.committed_cents == plan.total_budget_cents: plan -> FULLY_COMMITTED"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /api/adjustments/{adjustmentId}/decision with decision=REJECT"
        actor: RemediationApprover
        preconditions:
          - "Adjustment is PROPOSED (ERR_ADJUSTMENT_INVALID_STATE)"
          - "OCC: expected_plan_version == plan.version (ERR_STALE_PLAN_VERSION, 412 — evaluated before state)"
          - "Parent plan status IN {APPROVED, EXECUTING} (ERR_PLAN_NOT_APPROVED)"
          - "decided_by X-User-ID != created_by_user_id (ERR_SELF_DECISION_FORBIDDEN)"
        side_effects:
          - "decided_by_user_id := X-User-ID; plan.version += 1"
          - "GapFinding resolution re-check for the referenced finding"
      - from: APPROVED
        to: EFFECTIVE
        trigger: "system (POST /api/_clock/set_current_utc sweep: every APPROVED Adjustment whose effective_date <= new clock UTC date becomes EFFECTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "GapFinding resolution re-check (may flip TARGETED -> RESOLVED)"
          - "Plan completion check (may flip EXECUTING/FULLY_COMMITTED -> COMPLETED)"
          - "Study auto-monitoring check"
      - from: EFFECTIVE
        to: REVERSED
        trigger: "POST /api/adjustments/{adjustmentId}/reverse"
        actor: RemediationApprover
        preconditions:
          - "Adjustment is EFFECTIVE (ERR_ADJUSTMENT_INVALID_STATE)"
          - "Parent plan status IN {EXECUTING, FULLY_COMMITTED} (ERR_PLAN_INVALID_STATE — a COMPLETED plan cannot reopen)"
        side_effects:
          - "plan.committed_cents recompute (drops by approved_increase_cents); plan.version += 1"
          - "If plan was FULLY_COMMITTED: plan -> EXECUTING"
          - "GapFinding resolution re-check (a RESOLVED finding stays RESOLVED; a TARGETED one stays TARGETED)"

  - entity: ReportFiling
    initial_state: COMPILING
    terminal_states: [ACCEPTED]
    transitions:
      - from: COMPILING
        to: INTERNAL_REVIEW
        trigger: "POST /api/report-filings/{filingId}/compile"
        actor: ComplianceReporter
        preconditions:
          - "Filing is COMPILING (ERR_FILING_INVALID_STATE)"
        side_effects:
          - "Compute band_rows and total_headcount per eeo_band_aggregation"
      - from: INTERNAL_REVIEW
        to: SUBMITTED
        trigger: "POST /api/report-filings/{filingId}/submit"
        actor: ComplianceReporter
        preconditions:
          - "Filing is INTERNAL_REVIEW (ERR_FILING_INVALID_STATE)"
        side_effects:
          - "submitted_at := current logical clock"
          - "late_submission := (clock UTC date > due_date); submission exactly on due_date is not late"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /api/report-filings/{filingId}/record-decision with decision=ACCEPTED"
        actor: ComplianceReporter
        preconditions:
          - "Filing is SUBMITTED (ERR_FILING_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/report-filings/{filingId}/record-decision with decision=REJECTED"
        actor: ComplianceReporter
        preconditions:
          - "Filing is SUBMITTED (ERR_FILING_INVALID_STATE)"
        side_effects: []
      - from: REJECTED
        to: COMPILING
        trigger: "POST /api/report-filings/{filingId}/reopen"
        actor: ComplianceReporter
        preconditions:
          - "Filing is REJECTED (ERR_FILING_INVALID_STATE)"
        side_effects:
          - "band_rows := null; total_headcount := null; submitted_at := null; late_submission := null (resubmission loop)"

  - entity: TransparencyPosting
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/transparency-postings/{postingId}/publish"
        actor: ComplianceReporter
        preconditions:
          - "Posting is DRAFT (ERR_POSTING_INVALID_STATE)"
          - "If jurisdiction.range_disclosure_required: both min_salary_cents and max_salary_cents present (ERR_RANGE_DISCLOSURE_REQUIRED)"
          - "If both bounds present: max_salary_cents >= min_salary_cents (ERR_INVALID_SALARY_RANGE)"
          - "If jurisdiction.max_range_spread_pct non-null and both bounds present: (max - min)/min*100 <= cap (ERR_RANGE_SPREAD_EXCEEDED)"
        side_effects:
          - "published_at := current logical clock"
      - from: PUBLISHED
        to: CLOSED
        trigger: "POST /api/transparency-postings/{postingId}/close"
        actor: ComplianceReporter
        preconditions:
          - "Posting is PUBLISHED (ERR_POSTING_INVALID_STATE)"
          - "clock UTC date >= date(published_at) + jurisdiction.min_posting_duration_days (ERR_MIN_POSTING_DURATION_NOT_MET — equality allowed)"
        side_effects:
          - "closed_at := current logical clock"

  - entity: MonitoringCycle
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: DUE
        trigger: "system (POST /api/_clock/set_current_utc sweep: every SCHEDULED cycle whose due_date <= new clock UTC date becomes DUE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DUE
        to: RE_TESTING
        trigger: "POST /api/monitoring-cycles/{cycleId}/start"
        actor: CompAnalyst
        preconditions:
          - "Cycle is DUE (ERR_CYCLE_INVALID_STATE)"
        side_effects: []
      - from: RE_TESTING
        to: COMPLETED
        trigger: "POST /api/monitoring-cycles/{cycleId}/complete"
        actor: CompAnalyst
        preconditions:
          - "Cycle is RE_TESTING (ERR_CYCLE_INVALID_STATE)"
          - "retest_result provided and valid (ERR_INVALID_REQUEST)"
        side_effects:
          - "If retest_result == GAPS_PERSIST and study is MONITORING: study MONITORING -> REMEDIATION_OPEN (re-test failure reopens remediation)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC-only)
# =============================================================================
concurrency_rules:
  - rule_id: model-run-create-stale-group
    parent_entity: ComparatorGroup
    write_endpoint: "POST /api/model-runs"
    occ_field: "expected_group_version"
    description: |
      Creating a ModelRun against a ComparatorGroup whose version has advanced
      since the client last observed it is rejected. A successful run creation
      supersedes the group's prior PROVISIONAL runs and bumps group.version, so
      a client holding a stale version is acting on a superseded group view.
    error_id: ERR_STALE_GROUP_VERSION
    http_status: 412
  - rule_id: adjustment-decision-stale-plan
    parent_entity: RemediationPlan
    write_endpoint: "POST /api/adjustments/{adjustmentId}/decision"
    occ_field: "expected_plan_version"
    description: |
      Deciding an Adjustment while holding a RemediationPlan version that has
      advanced since the client last observed it is rejected. Every successful
      decision recomputes committed_cents and bumps plan.version, so a stale
      version means the client evaluated the budget check against an outdated
      committed total.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: fte_annualized_base
    trigger: "EmployeeSnapshot creation; PATCH of base_salary_cents or fte_factor"
    algorithm: aggregation
    formula: |
      annualized_base_cents = ROUND(base_salary_cents / fte_factor, 0)  # half-up
      tenure_years = ROUND((study.analysis_period_end - hire_date) / 365.25, 2)  # half-up
    input_set: "The single EmployeeSnapshot being mutated; study dates from its parent"
    precision: "annualized 0 decimal places, tenure 2 decimal places, round_half_up"

  - name: adjusted_pay_gap
    trigger: "ModelRun creation (PROVISIONAL) for a ComparatorGroup; recomputed identically on finalize (values frozen from creation)"
    algorithm: weighted_scoring
    formula: |
      Members = snapshots with comparator_group_id == group.id
      Reference class value per dimension: GENDER->MALE, ETHNICITY->WHITE, AGE_BAND->UNDER_40
      For each dimension in study.protected_classes, for each non-reference class value
      present among members with class_headcount >= 1 AND reference_headcount >= 1,
      emit per_class_results["<DIMENSION>:<CLASS_VALUE>"]:

      Variant REGRESSION_OLS (level-deflated mean gap):
        adj_pay_i = ROUND(annualized_base_cents_i / (1 + LEVEL_LOADING * (job_level_i - 1)), 2)  # half-up, per employee FIRST
        mean_ref   = ROUND(SUM(adj_pay over reference members) / reference_headcount, 2)
        mean_class = ROUND(SUM(adj_pay over class members) / class_headcount, 2)
        adjusted_gap_pct = ROUND((mean_ref - mean_class) / mean_ref * 100, 4)  # half-up

      Variant COHORT_MEDIAN (raw median gap, no level deflation):
        median_ref   = median of annualized_base_cents over reference members
                       (even count: mean of the two middle values, exact)
        median_class = median of annualized_base_cents over class members
        adjusted_gap_pct = ROUND((median_ref - median_class) / median_ref * 100, 4)  # half-up

      Significance heuristic (both variants):
        p_value = ROUND(1 / (1 + class_headcount * ABS(adjusted_gap_pct)), 4)  # half-up, uses the ROUNDED 4dp gap
    input_set: "Snapshots assigned to the group at run-creation time; only the group's own members; no state filtering (snapshots are immutable once the group is lockable)"
    constants:
      LEVEL_LOADING: 0.04
    precision: "per-employee adj_pay 2 dp; means 2 dp; gap and p_value 4 dp; round_half_up throughout"
    variants:
      - name: REGRESSION_OLS
        when: "ModelRun.methodology == REGRESSION_OLS"
        difference: "Level-deflated per-employee pay (2dp rounding per employee BEFORE averaging); mean-based; same members yield a different gap than COHORT_MEDIAN"
      - name: COHORT_MEDIAN
        when: "ModelRun.methodology == COHORT_MEDIAN"
        difference: "Raw annualized base, median-based, no level deflation; same members yield a different gap than REGRESSION_OLS"

  - name: gap_actionability
    trigger: "GapFinding generation (on ModelRun finalize) and on read"
    algorithm: threshold
    formula: |
      is_actionable = (adjusted_gap_pct >= study.actionable_gap_pct)
                      AND (p_value <= study.significance_threshold)
      Both comparisons are INCLUSIVE: a gap exactly equal to actionable_gap_pct
      qualifies; a p_value exactly equal to significance_threshold qualifies.
    input_set: "The GapFinding's own adjusted_gap_pct and p_value plus the parent study's two thresholds"
    precision: "comparisons on the stored 4dp values"

  - name: remediation_suggested_allocation
    trigger: "GET /api/remediation-plans/{planId}/suggested-allocation"
    algorithm: waterfall_allocation
    formula: |
      Universe = all GapFindings of the plan's study with status == TARGETED
      For each such finding, affected employees = snapshots of the plan's study with
        comparator_group_id == finding.comparator_group_id AND the finding's
        dimension value == finding.class_value (GENDER->gender_class, ETHNICITY->ethnicity_class, AGE_BAND->age_band)
      per_capita_gap_i = ROUND(annualized_base_cents_i * finding.adjusted_gap_pct / 100, 0)  # half-up, per employee

      Variant FULL_CLOSURE:
        suggested_i = per_capita_gap_i
        total_suggested_cents = SUM(suggested_i)   # may exceed total_budget_cents; advisory only

      Variant PRO_RATA (budget-constrained waterfall):
        G = SUM(per_capita_gap_i over the universe)
        If G == 0: all suggestions are 0.
        raw_i = per_capita_gap_i * total_budget_cents / G
        base_i = FLOOR(raw_i)
        remainder = total_budget_cents - SUM(base_i)
        Distribute remainder one cent at a time to employees ordered by
          (per_capita_gap_i DESC, snapshot.created_at ASC), one cent per employee
          per pass, until remainder == 0.
        suggested_i = base_i + allocated remainder cents
        total_suggested_cents == total_budget_cents exactly when G > 0.
    input_set: "TARGETED GapFindings of the study + their affected snapshots; plan.total_budget_cents"
    precision: "per-capita gaps 0 dp half-up; PRO_RATA floors then distributes cents; total is exact"
    variants:
      - name: FULL_CLOSURE
        when: "plan.allocation_strategy == FULL_CLOSURE"
        difference: "Ignores the budget envelope; suggests the full per-capita gap for every affected employee"
      - name: PRO_RATA
        when: "plan.allocation_strategy == PRO_RATA"
        difference: "Scales every suggestion by total_budget_cents / G with floor + deterministic remainder; same TARGETED universe yields different (smaller) amounts than FULL_CLOSURE whenever G > budget"

  - name: plan_budget_reconciliation
    trigger: "Adjustment decision (APPROVE/REJECT), Adjustment APPROVED->EFFECTIVE sweep, Adjustment reverse"
    algorithm: aggregation
    formula: |
      committed_cents = SUM(approved_increase_cents) over plan's adjustments
                        with status IN {APPROVED, EFFECTIVE}
      remaining_cents = total_budget_cents - committed_cents
      Invariant: committed_cents + remaining_cents == total_budget_cents at all times.
      Plan auto FULLY_COMMITTED when committed_cents == total_budget_cents.
      Plan auto COMPLETED when no adjustment is PROPOSED or APPROVED AND >= 1 adjustment is EFFECTIVE.
    input_set: "All Adjustments of the plan"
    precision: "integer cents, exact"

  - name: adverse_impact_ratio
    trigger: "PipelineAnalysis creation"
    algorithm: threshold
    formula: |
      For each record with count_in > 0:
        pass_rate = ROUND(count_passed / count_in, 4)   # half-up — per-class rounding FIRST
      If fewer than 2 records have count_in > 0:
        adverse_impact_ratio = null; adverse_impact_flag = false
      Else:
        adverse_impact_ratio = ROUND(min(pass_rates) / max(pass_rates), 4)  # FROM THE ROUNDED RATES — order pinned
        adverse_impact_flag = (adverse_impact_ratio < FOUR_FIFTHS_THRESHOLD)
        # exactly 0.8000 is NOT flagged (strict <)
      highest_rate_class = class_label of max pass rate; ties -> earliest record index
    input_set: "The analysis's own records array only"
    constants:
      FOUR_FIFTHS_THRESHOLD: 0.80
    precision: "pass rates 4 dp half-up; ratio 4 dp half-up computed from the rounded rates (nested rounding order is normative: rounding only at the end can differ in the 4th decimal)"

  - name: eeo_band_aggregation
    trigger: "POST /api/report-filings/{filingId}/compile"
    algorithm: aggregation
    formula: |
      Band edges (cents): BAND_A [0, 5000000), BAND_B [5000000, 7500000),
        BAND_C [7500000, 10000000), BAND_D [10000000, 15000000), BAND_E [15000000, inf)
      Band membership uses annualized_base_cents with LOWER-INCLUSIVE / UPPER-EXCLUSIVE
      boundaries: an employee at exactly 5000000 cents falls in BAND_B.
      band_rows = for each band x each gender_class value present: {band, gender_class, headcount}
      total_headcount = SUM(headcount over band_rows)
      Conservation invariant: total_headcount == study.snapshot_count at compile time
      (every snapshot lands in exactly one band; no rounding, integer counts).
    input_set: "All EmployeeSnapshots of the filing's study (no status filtering)"
    precision: "integer headcounts, exact"

  - name: scheduled_transition_sweep
    trigger: "POST /api/_clock/set_current_utc"
    algorithm: chronological
    formula: |
      On every clock set, in this pinned order:
      1. APPROVED Adjustments with effective_date <= new clock UTC date -> EFFECTIVE
         (ties processed by effective_date ASC, then created_at ASC)
      2. GapFinding resolution re-check for affected findings
      3. Plan completion / FULLY_COMMITTED checks
      4. Study auto-monitoring check
      5. SCHEDULED MonitoringCycles with due_date <= new clock UTC date -> DUE
      Date comparisons use the UTC calendar date portion of the clock.
    input_set: "All APPROVED adjustments and SCHEDULED cycles system-wide"
    precision: "date-granularity comparisons, inclusive <="

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and X-User-Role must be one of the declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The caller's role must be permitted on this endpoint"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path ids and request-body FK ids must reference existing resources (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 3.5
    category: concurrency
    check: "OCC: expected_group_version == ComparatorGroup.version on POST /api/model-runs; expected_plan_version == RemediationPlan.version on POST /api/adjustments/{id}/decision"
    error_id: "ERR_STALE_GROUP_VERSION / ERR_STALE_PLAN_VERSION"
    http_status: 412
    applies_to: "POST /api/model-runs; POST /api/adjustments/{adjustmentId}/decision"

  - priority: 3.7
    category: business_input
    check: "Request shape: required fields present; enums valid; analysis_period_start <= analysis_period_end; window_start < window_end; due_date >= window_end; proposed_increase_cents > 0; count_passed <= count_in; rationale non-empty where required"
    error_id: "ERR_INVALID_REQUEST / ERR_INVALID_WINDOW / ERR_INVALID_DUE_DATE / ERR_INVALID_INCREASE / ERR_INVALID_PIPELINE_RECORD / ERR_RATIONALE_REQUIRED"
    http_status: 400
    applies_to: "all mutation endpoints"

  - priority: 4
    category: state
    check: "Entity state preconditions for the action (per state machine): study editable/analyzable/remediation-open/monitoring; group DRAFT for lock; run PROVISIONAL for finalize; finding FLAGGED for disposition; plan DRAFT/SUBMITTED/APPROVED-EXECUTING as required; adjustment PROPOSED for decision and EFFECTIVE for reverse; filing/posting/cycle correct from-state"
    error_id: "ERR_STUDY_INVALID_STATE / ERR_SNAPSHOT_LOCKED / ERR_STUDY_NOT_MODELING / ERR_STUDY_NOT_IN_REMEDIATION / ERR_STUDY_NOT_MONITORING / ERR_STUDY_NOT_REPORTABLE / ERR_NO_QUALIFYING_GROUPS / ERR_UNANALYZED_GROUPS / ERR_GAPS_NOT_RESOLVED / ERR_PLAN_NOT_COMMITTED / ERR_GAPS_NOT_CLOSED / ERR_GROUP_INVALID_STATE / ERR_RUN_INVALID_STATE / ERR_FINDING_INVALID_STATE / ERR_PLAN_INVALID_STATE / ERR_PLAN_NOT_APPROVED / ERR_ADJUSTMENT_INVALID_STATE / ERR_FILING_INVALID_STATE / ERR_POSTING_INVALID_STATE / ERR_CYCLE_INVALID_STATE"
    http_status: 409
    applies_to: "all action/transition endpoints and state-gated creations"

  - priority: 5
    category: business_safety
    check: "Segregation of duties: adjustment decider's X-User-ID must differ from the adjustment's created_by_user_id; compliance: postings in disclosure jurisdictions must carry a full pay range"
    error_id: "ERR_SELF_DECISION_FORBIDDEN / ERR_RANGE_DISCLOSURE_REQUIRED"
    http_status: 403
    applies_to: "POST /api/adjustments/{adjustmentId}/decision; POST /api/transparency-postings/{postingId}/publish"

  - priority: 6
    category: business_temporal
    check: "Temporal rules: adjustment effective_date not in the past; posting minimum duration elapsed; study analysis periods must not overlap (CLOSED intervals — sharing one boundary date conflicts); monitoring windows must not overlap (HALF-OPEN [start,end) — touching windows allowed)"
    error_id: "ERR_EFFECTIVE_DATE_IN_PAST / ERR_MIN_POSTING_DURATION_NOT_MET / ERR_STUDY_PERIOD_OVERLAP / ERR_MONITOR_WINDOW_OVERLAP"
    http_status: 422
    applies_to: "POST /api/adjustments; POST /api/transparency-postings/{postingId}/close; POST /api/pay-equity-studies; POST /api/monitoring-cycles"

  - priority: 7
    category: business_constraint
    check: "Constraint rules: uniqueness (employee_ref per study, group name per study, filing per study+type+year, jurisdiction_code, job_posting_ref, single non-COMPLETED plan per study); referential consistency (snapshot/group/plan/finding/adjustment all in the same study); group membership criteria match; group minimum size at lock; salary range sanity and spread cap; plan non-empty at submit; finding actionability for TARGETED"
    error_id: "ERR_DUPLICATE_EMPLOYEE_REF / ERR_DUPLICATE_GROUP_NAME / ERR_DUPLICATE_FILING / ERR_DUPLICATE_JURISDICTION / ERR_DUPLICATE_POSTING_REF / ERR_ACTIVE_PLAN_EXISTS / ERR_CROSS_STUDY_REFERENCE / ERR_GROUP_CRITERIA_MISMATCH / ERR_GROUP_BELOW_MIN_SIZE / ERR_INVALID_SALARY_RANGE / ERR_RANGE_SPREAD_EXCEEDED / ERR_PLAN_EMPTY / ERR_FINDING_NOT_ACTIONABLE"
    http_status: 409
    applies_to: "creation endpoints, PATCH /api/employee-snapshots/{id}, group lock, plan submit, finding disposition, posting publish"

  - priority: 9
    category: business_fiscal
    check: "Budget: plan.committed_cents + proposed_increase_cents <= plan.total_budget_cents (equality allowed)"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /api/adjustments/{adjustmentId}/decision with decision=APPROVE"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z (fixed startup default; never wall-clock). Setting the clock runs the scheduled_transition_sweep: APPROVED adjustments with effective_date <= new UTC date become EFFECTIVE, then SCHEDULED cycles with due_date <= new UTC date become DUE."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["scheduled_transition_sweep (adjustments -> EFFECTIVE, findings -> RESOLVED, plan completion, study auto-monitoring, cycles -> DUE)"]

  # --- PayEquityStudy ---
  - method: POST
    path: "/api/pay-equity-studies"
    description: "Create a pay equity study in DRAFT. Rejects when the CLOSED period [analysis_period_start, analysis_period_end] overlaps any existing study's period (sharing a single boundary date conflicts)."
    roles: [CompAnalyst]
    code: 201
    input: [name, analysis_period_start, analysis_period_end, protected_classes, "significance_threshold?", "actionable_gap_pct?", "min_group_size?", "monitor_cadence_days?"]
    output: PayEquityStudy
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/api/pay-equity-studies"
    description: "List studies with optional status filter and pagination"
    roles: &all_roles [CompAnalyst, LegalCounsel, RemediationApprover, PeopleOpsAdmin, ComplianceReporter, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PayEquityStudy[]"
    side_effects: []

  - method: GET
    path: "/api/pay-equity-studies/{studyId}"
    description: "Get one study including computed aggregates"
    roles: *all_roles
    code: 200
    input: []
    output: PayEquityStudy
    side_effects: []

  - method: POST
    path: "/api/pay-equity-studies/{studyId}/advance"
    description: "DRAFT -> MODELING; requires at least one group with member_count >= min_group_size"
    roles: [CompAnalyst]
    code: 200
    input: []
    output: PayEquityStudy
    side_effects: ["snapshot editing locks"]

  - method: POST
    path: "/api/pay-equity-studies/{studyId}/submit-legal-review"
    description: "MODELING -> UNDER_LEGAL_REVIEW; requires every LOCKED/ANALYZED group to hold a FINAL run"
    roles: [CompAnalyst]
    code: 200
    input: []
    output: PayEquityStudy
    side_effects: ["review_rounds += 1"]

  - method: POST
    path: "/api/pay-equity-studies/{studyId}/legal-decision"
    description: "Legal counsel decision: APPROVE -> PRIVILEGED_FINAL (pins privileged_model_run_ids); REQUEST_CHANGES -> DRAFT (requires rationale)"
    roles: [LegalCounsel]
    code: 200
    input: [decision, "rationale?"]
    output: PayEquityStudy
    side_effects: ["APPROVE pins privileged_model_run_ids = all FINAL run ids", "REQUEST_CHANGES clears privileged_model_run_ids"]

  - method: POST
    path: "/api/pay-equity-studies/{studyId}/open-remediation"
    description: "PRIVILEGED_FINAL -> REMEDIATION_OPEN"
    roles: [LegalCounsel]
    code: 200
    input: []
    output: PayEquityStudy
    side_effects: []

  - method: POST
    path: "/api/pay-equity-studies/{studyId}/begin-monitoring"
    description: "REMEDIATION_OPEN -> MONITORING; requires zero unresolved findings and a FULLY_COMMITTED or COMPLETED plan"
    roles: [CompAnalyst]
    code: 200
    input: []
    output: PayEquityStudy
    side_effects: []

  - method: POST
    path: "/api/pay-equity-studies/{studyId}/close"
    description: "Close from MONITORING (latest COMPLETED cycle GAPS_CLOSED) or from PRIVILEGED_FINAL (actionable_finding_count == 0)"
    roles: [LegalCounsel]
    code: 200
    input: []
    output: PayEquityStudy
    side_effects: []

  # --- EmployeeSnapshot ---
  - method: POST
    path: "/api/employee-snapshots"
    description: "Add an employee snapshot to a DRAFT study; employee_ref unique per study"
    roles: [PeopleOpsAdmin]
    code: 201
    input: [study_id, employee_ref, gender_class, ethnicity_class, age_band, job_family, job_level, location_code, fte_factor, base_salary_cents, bonus_cents, hire_date]
    output: EmployeeSnapshot
    side_effects: ["computes annualized_base_cents and tenure_years"]

  - method: GET
    path: "/api/employee-snapshots"
    description: "List snapshots; optional filters study_id, comparator_group_id"
    roles: *all_roles
    code: 200
    input: ["study_id?", "comparator_group_id?", "limit?", "offset?"]
    output: "EmployeeSnapshot[]"
    side_effects: []

  - method: GET
    path: "/api/employee-snapshots/{snapshotId}"
    description: "Get one snapshot"
    roles: *all_roles
    code: 200
    input: []
    output: EmployeeSnapshot
    side_effects: []

  - method: PATCH
    path: "/api/employee-snapshots/{snapshotId}"
    description: "Update compensation fields (study must be DRAFT) and/or assign/unassign comparator_group_id (target group must be DRAFT, same study, criteria match; unassign via comparator_group_id: null; current group must not be LOCKED/ANALYZED)"
    roles: [PeopleOpsAdmin]
    code: 200
    input: ["base_salary_cents?", "bonus_cents?", "fte_factor?", "job_level?", "comparator_group_id?"]
    output: EmployeeSnapshot
    side_effects: ["recomputes annualized_base_cents when comp fields change", "recomputes member_count of affected groups and bumps their version on membership change"]

  # --- ComparatorGroup ---
  - method: POST
    path: "/api/comparator-groups"
    description: "Create a comparator group (DRAFT) in a DRAFT or MODELING study; name unique per study"
    roles: [CompAnalyst]
    code: 201
    input: [study_id, name, job_family, min_job_level, max_job_level, location_code]
    output: ComparatorGroup
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/api/comparator-groups"
    description: "List groups; optional filters study_id, status"
    roles: *all_roles
    code: 200
    input: ["study_id?", "status?", "limit?", "offset?"]
    output: "ComparatorGroup[]"
    side_effects: []

  - method: GET
    path: "/api/comparator-groups/{groupId}"
    description: "Get one group including member_count and version"
    roles: *all_roles
    code: 200
    input: []
    output: ComparatorGroup
    side_effects: []

  - method: POST
    path: "/api/comparator-groups/{groupId}/lock"
    description: "DRAFT -> LOCKED; requires parent study MODELING and member_count >= study.min_group_size (inclusive)"
    roles: [CompAnalyst]
    code: 200
    input: []
    output: ComparatorGroup
    side_effects: ["membership frozen"]

  # --- ModelRun ---
  - method: POST
    path: "/api/model-runs"
    description: "Create a PROVISIONAL model run on a LOCKED or ANALYZED group whose study is MODELING or MONITORING. OCC: expected_group_version must equal the group's current version. Supersedes the group's prior PROVISIONAL runs."
    roles: [CompAnalyst]
    code: 201
    input: [comparator_group_id, methodology, expected_group_version]
    output: ModelRun
    side_effects: ["computes per_class_results per adjusted_pay_gap variant", "prior PROVISIONAL runs of the group -> SUPERSEDED", "increments ComparatorGroup.version by 1", "run_index assigned"]

  - method: GET
    path: "/api/model-runs"
    description: "List runs; optional filters comparator_group_id, study_id, status"
    roles: *all_roles
    code: 200
    input: ["comparator_group_id?", "study_id?", "status?", "limit?", "offset?"]
    output: "ModelRun[]"
    side_effects: []

  - method: GET
    path: "/api/model-runs/{runId}"
    description: "Get one run including per_class_results"
    roles: *all_roles
    code: 200
    input: []
    output: ModelRun
    side_effects: []

  - method: POST
    path: "/api/model-runs/{runId}/finalize"
    description: "PROVISIONAL -> FINAL; generates FLAGGED GapFindings, flips group to ANALYZED, and invalidates privilege if the study is PRIVILEGED_FINAL"
    roles: [CompAnalyst]
    code: 200
    input: []
    output: ModelRun
    side_effects: ["GapFinding rows generated (FLAGGED)", "group LOCKED -> ANALYZED", "PRIVILEGED_FINAL study -> UNDER_LEGAL_REVIEW with privileged_model_run_ids cleared", "study finding aggregates recomputed"]

  # --- GapFinding ---
  - method: GET
    path: "/api/gap-findings"
    description: "List findings; optional filters study_id, comparator_group_id, model_run_id, status"
    roles: *all_roles
    code: 200
    input: ["study_id?", "comparator_group_id?", "model_run_id?", "status?", "limit?", "offset?"]
    output: "GapFinding[]"
    side_effects: []

  - method: GET
    path: "/api/gap-findings/{findingId}"
    description: "Get one finding"
    roles: *all_roles
    code: 200
    input: []
    output: GapFinding
    side_effects: []

  - method: POST
    path: "/api/gap-findings/{findingId}/disposition"
    description: "FLAGGED -> TARGETED (requires is_actionable) | MONITORED | DISMISSED (requires disposition_rationale); study must be REMEDIATION_OPEN"
    roles: [CompAnalyst]
    code: 200
    input: [disposition, "disposition_rationale?"]
    output: GapFinding
    side_effects: ["disposition_by_user_id recorded", "study finding aggregates recomputed", "study auto-monitoring check"]

  # --- RemediationPlan ---
  - method: POST
    path: "/api/remediation-plans"
    description: "Create a DRAFT remediation plan for a REMEDIATION_OPEN study; at most one non-COMPLETED plan per study"
    roles: [CompAnalyst]
    code: 201
    input: [study_id, total_budget_cents, "allocation_strategy?"]
    output: RemediationPlan
    side_effects: ["status = DRAFT", "created_by_user_id := X-User-ID"]

  - method: GET
    path: "/api/remediation-plans"
    description: "List plans; optional filters study_id, status"
    roles: *all_roles
    code: 200
    input: ["study_id?", "status?", "limit?", "offset?"]
    output: "RemediationPlan[]"
    side_effects: []

  - method: GET
    path: "/api/remediation-plans/{planId}"
    description: "Get one plan including committed_cents / remaining_cents"
    roles: *all_roles
    code: 200
    input: []
    output: RemediationPlan
    side_effects: []

  - method: GET
    path: "/api/remediation-plans/{planId}/suggested-allocation"
    description: "Computed read: remediation_suggested_allocation over the study's TARGETED findings using the plan's allocation_strategy"
    roles: [CompAnalyst, RemediationApprover]
    code: 200
    input: []
    output: "{ strategy: string, total_suggested_cents: integer, suggestions: array }"
    side_effects: []

  - method: POST
    path: "/api/remediation-plans/{planId}/submit"
    description: "DRAFT -> SUBMITTED; requires at least one PROPOSED adjustment"
    roles: [CompAnalyst]
    code: 200
    input: []
    output: RemediationPlan
    side_effects: []

  - method: POST
    path: "/api/remediation-plans/{planId}/decision"
    description: "Committee decision: SUBMITTED -> APPROVED (decision=APPROVE) or -> DRAFT (decision=REJECT, rationale required, rejection_count += 1)"
    roles: [RemediationApprover]
    code: 200
    input: [decision, "rationale?"]
    output: RemediationPlan
    side_effects: ["REJECT increments rejection_count (rework loop)"]

  # --- Adjustment ---
  - method: POST
    path: "/api/adjustments"
    description: "Propose an individual adjustment against a TARGETED finding; plan must be DRAFT or EXECUTING; effective_date must not be before the current clock date"
    roles: [CompAnalyst]
    code: 201
    input: [plan_id, gap_finding_id, employee_snapshot_id, proposed_increase_cents, effective_date]
    output: Adjustment
    side_effects: ["status = PROPOSED", "created_by_user_id := X-User-ID", "study_id denormalized from plan"]

  - method: GET
    path: "/api/adjustments"
    description: "List adjustments; optional filters plan_id, employee_snapshot_id, gap_finding_id, study_id, status"
    roles: *all_roles
    code: 200
    input: ["plan_id?", "employee_snapshot_id?", "gap_finding_id?", "study_id?", "status?", "limit?", "offset?"]
    output: "Adjustment[]"
    side_effects: []

  - method: GET
    path: "/api/adjustments/{adjustmentId}"
    description: "Get one adjustment"
    roles: *all_roles
    code: 200
    input: []
    output: Adjustment
    side_effects: []

  - method: POST
    path: "/api/adjustments/{adjustmentId}/decision"
    description: "Approve or reject a PROPOSED adjustment. OCC on expected_plan_version (412 before state checks). Segregation of duties: decider != proposer. APPROVE checks budget: committed + proposed <= total (equality allowed)."
    roles: [RemediationApprover]
    code: 200
    input: [decision, expected_plan_version, "rationale?"]
    output: Adjustment
    side_effects: ["increments RemediationPlan.version by 1", "APPROVE: approved_increase_cents := proposed; committed_cents recompute; plan APPROVED -> EXECUTING on first approval; plan -> FULLY_COMMITTED when committed == total", "REJECT: finding resolution re-check"]

  - method: POST
    path: "/api/adjustments/{adjustmentId}/reverse"
    description: "EFFECTIVE -> REVERSED (compensating action); plan must be EXECUTING or FULLY_COMMITTED"
    roles: [RemediationApprover]
    code: 200
    input: [rationale]
    output: Adjustment
    side_effects: ["committed_cents recompute (drops by approved_increase_cents)", "plan FULLY_COMMITTED -> EXECUTING when committed < total", "plan.version += 1"]

  # --- ReportFiling ---
  - method: POST
    path: "/api/report-filings"
    description: "Create a filing (COMPILING) for a study in PRIVILEGED_FINAL, REMEDIATION_OPEN, MONITORING, or CLOSED; unique per (study, report_type, reporting_year); jurisdiction_rule_id required for STATE_PAY_DATA"
    roles: [ComplianceReporter]
    code: 201
    input: [study_id, report_type, reporting_year, due_date, "jurisdiction_rule_id?"]
    output: ReportFiling
    side_effects: ["status = COMPILING"]

  - method: GET
    path: "/api/report-filings"
    description: "List filings; optional filters study_id, status, jurisdiction_rule_id"
    roles: *all_roles
    code: 200
    input: ["study_id?", "status?", "jurisdiction_rule_id?", "limit?", "offset?"]
    output: "ReportFiling[]"
    side_effects: []

  - method: GET
    path: "/api/report-filings/{filingId}"
    description: "Get one filing including band_rows after compile"
    roles: *all_roles
    code: 200
    input: []
    output: ReportFiling
    side_effects: []

  - method: POST
    path: "/api/report-filings/{filingId}/compile"
    description: "COMPILING -> INTERNAL_REVIEW; computes band_rows and total_headcount via eeo_band_aggregation"
    roles: [ComplianceReporter]
    code: 200
    input: []
    output: ReportFiling
    side_effects: ["band_rows and total_headcount computed; total_headcount == study.snapshot_count"]

  - method: POST
    path: "/api/report-filings/{filingId}/submit"
    description: "INTERNAL_REVIEW -> SUBMITTED; stamps submitted_at and late_submission (late iff clock UTC date > due_date; on due_date is not late)"
    roles: [ComplianceReporter]
    code: 200
    input: []
    output: ReportFiling
    side_effects: ["submitted_at, late_submission stamped"]

  - method: POST
    path: "/api/report-filings/{filingId}/record-decision"
    description: "Record the regulator outcome: SUBMITTED -> ACCEPTED | REJECTED"
    roles: [ComplianceReporter]
    code: 200
    input: [decision, "notes?"]
    output: ReportFiling
    side_effects: []

  - method: POST
    path: "/api/report-filings/{filingId}/reopen"
    description: "REJECTED -> COMPILING (resubmission loop); clears band_rows, total_headcount, submitted_at, late_submission"
    roles: [ComplianceReporter]
    code: 200
    input: []
    output: ReportFiling
    side_effects: ["computed fields cleared for recompile"]

  # --- JurisdictionRule ---
  - method: POST
    path: "/api/jurisdiction-rules"
    description: "Create a jurisdiction rule configuration; jurisdiction_code unique"
    roles: [PeopleOpsAdmin]
    code: 201
    input: [jurisdiction_code, "range_disclosure_required?", "max_range_spread_pct?", "min_posting_duration_days?", "pay_data_report_required?", "filing_due_month?", "filing_due_day?"]
    output: JurisdictionRule
    side_effects: []

  - method: GET
    path: "/api/jurisdiction-rules"
    description: "List jurisdiction rules"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: "JurisdictionRule[]"
    side_effects: []

  - method: GET
    path: "/api/jurisdiction-rules/{ruleId}"
    description: "Get one jurisdiction rule"
    roles: *all_roles
    code: 200
    input: []
    output: JurisdictionRule
    side_effects: []

  # --- TransparencyPosting ---
  - method: POST
    path: "/api/transparency-postings"
    description: "Create a DRAFT posting; job_posting_ref unique"
    roles: [ComplianceReporter]
    code: 201
    input: [jurisdiction_rule_id, job_posting_ref, title, "min_salary_cents?", "max_salary_cents?"]
    output: TransparencyPosting
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/api/transparency-postings"
    description: "List postings; optional filters jurisdiction_rule_id, status"
    roles: *all_roles
    code: 200
    input: ["jurisdiction_rule_id?", "status?", "limit?", "offset?"]
    output: "TransparencyPosting[]"
    side_effects: []

  - method: GET
    path: "/api/transparency-postings/{postingId}"
    description: "Get one posting"
    roles: *all_roles
    code: 200
    input: []
    output: TransparencyPosting
    side_effects: []

  - method: POST
    path: "/api/transparency-postings/{postingId}/publish"
    description: "DRAFT -> PUBLISHED; enforces jurisdiction disclosure (safety), range sanity, and spread cap; stamps published_at from the logical clock"
    roles: [ComplianceReporter]
    code: 200
    input: []
    output: TransparencyPosting
    side_effects: ["published_at := current logical clock"]

  - method: POST
    path: "/api/transparency-postings/{postingId}/close"
    description: "PUBLISHED -> CLOSED; requires clock date >= published date + min_posting_duration_days (equality allowed)"
    roles: [ComplianceReporter]
    code: 200
    input: []
    output: TransparencyPosting
    side_effects: ["closed_at := current logical clock"]

  # --- PipelineAnalysis ---
  - method: POST
    path: "/api/pipeline-analyses"
    description: "Create a hiring/promotion funnel analysis for a study; computes pass_rates, adverse_impact_ratio (four-fifths rule), adverse_impact_flag at creation"
    roles: [CompAnalyst]
    code: 201
    input: [study_id, stage, cohort_period_start, cohort_period_end, records]
    output: PipelineAnalysis
    side_effects: ["computes pass_rates, adverse_impact_ratio, adverse_impact_flag, highest_rate_class"]

  - method: GET
    path: "/api/pipeline-analyses"
    description: "List pipeline analyses; optional filters study_id, stage"
    roles: *all_roles
    code: 200
    input: ["study_id?", "stage?", "limit?", "offset?"]
    output: "PipelineAnalysis[]"
    side_effects: []

  - method: GET
    path: "/api/pipeline-analyses/{analysisId}"
    description: "Get one pipeline analysis"
    roles: *all_roles
    code: 200
    input: []
    output: PipelineAnalysis
    side_effects: []

  # --- MonitoringCycle ---
  - method: POST
    path: "/api/monitoring-cycles"
    description: "Schedule a monitoring cycle for a MONITORING study; HALF-OPEN window [window_start, window_end) must not overlap any existing cycle of the study (touching boundaries allowed); due_date >= window_end"
    roles: [CompAnalyst]
    code: 201
    input: [study_id, window_start, window_end, due_date]
    output: MonitoringCycle
    side_effects: ["status = SCHEDULED", "cycle_index assigned"]

  - method: GET
    path: "/api/monitoring-cycles"
    description: "List cycles; optional filters study_id, status"
    roles: *all_roles
    code: 200
    input: ["study_id?", "status?", "limit?", "offset?"]
    output: "MonitoringCycle[]"
    side_effects: []

  - method: GET
    path: "/api/monitoring-cycles/{cycleId}"
    description: "Get one cycle"
    roles: *all_roles
    code: 200
    input: []
    output: MonitoringCycle
    side_effects: []

  - method: POST
    path: "/api/monitoring-cycles/{cycleId}/start"
    description: "DUE -> RE_TESTING (cycle becomes DUE only via the clock sweep at due_date)"
    roles: [CompAnalyst]
    code: 200
    input: []
    output: MonitoringCycle
    side_effects: []

  - method: POST
    path: "/api/monitoring-cycles/{cycleId}/complete"
    description: "RE_TESTING -> COMPLETED with retest_result; GAPS_PERSIST reopens the study to REMEDIATION_OPEN"
    roles: [CompAnalyst]
    code: 200
    input: [retest_result]
    output: MonitoringCycle
    side_effects: ["GAPS_PERSIST: study MONITORING -> REMEDIATION_OPEN"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role value not one of the declared roles" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Caller role not permitted on this endpoint" }
  # --- Existence / input ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or request-body FK id references a non-existent resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, malformed date, analysis_period_end < analysis_period_start, or cohort_period_end < cohort_period_start" }
  - { id: ERR_INVALID_WINDOW, http: 400, condition: "MonitoringCycle window_end <= window_start" }
  - { id: ERR_INVALID_DUE_DATE, http: 400, condition: "MonitoringCycle due_date < window_end" }
  - { id: ERR_INVALID_INCREASE, http: 400, condition: "Adjustment proposed_increase_cents <= 0" }
  - { id: ERR_INVALID_PIPELINE_RECORD, http: 400, condition: "PipelineAnalysis record with count_passed > count_in, negative counts, or empty records array" }
  - { id: ERR_RATIONALE_REQUIRED, http: 400, condition: "rationale / disposition_rationale missing or empty where mandated (finding DISMISSED, plan REJECT, legal REQUEST_CHANGES)" }
  # --- Concurrency (OCC) ---
  - { id: ERR_STALE_GROUP_VERSION, http: 412, condition: "expected_group_version != ComparatorGroup.version on POST /api/model-runs" }
  - { id: ERR_STALE_PLAN_VERSION, http: 412, condition: "expected_plan_version != RemediationPlan.version on POST /api/adjustments/{id}/decision" }
  # --- State ---
  - { id: ERR_STUDY_INVALID_STATE, http: 409, condition: "Study not in the state required by the invoked transition" }
  - { id: ERR_SNAPSHOT_LOCKED, http: 409, condition: "Snapshot creation or compensation-field edit while the parent study is not DRAFT" }
  - { id: ERR_STUDY_NOT_MODELING, http: 409, condition: "ComparatorGroup lock attempted while parent study is not MODELING" }
  - { id: ERR_STUDY_NOT_IN_REMEDIATION, http: 409, condition: "Finding disposition or plan creation attempted while study is not REMEDIATION_OPEN" }
  - { id: ERR_STUDY_NOT_MONITORING, http: 409, condition: "MonitoringCycle creation attempted while study is not MONITORING" }
  - { id: ERR_STUDY_NOT_REPORTABLE, http: 409, condition: "ReportFiling creation attempted while study is DRAFT, MODELING, or UNDER_LEGAL_REVIEW" }
  - { id: ERR_NO_QUALIFYING_GROUPS, http: 409, condition: "Study advance requires at least one group with member_count >= min_group_size" }
  - { id: ERR_UNANALYZED_GROUPS, http: 409, condition: "Legal-review submission requires every LOCKED/ANALYZED group to hold a FINAL ModelRun" }
  - { id: ERR_GAPS_NOT_RESOLVED, http: 409, condition: "begin-monitoring requires unresolved_finding_count == 0" }
  - { id: ERR_PLAN_NOT_COMMITTED, http: 409, condition: "begin-monitoring requires a plan in FULLY_COMMITTED or COMPLETED" }
  - { id: ERR_GAPS_NOT_CLOSED, http: 409, condition: "close requires latest COMPLETED cycle GAPS_CLOSED (from MONITORING) or actionable_finding_count == 0 (from PRIVILEGED_FINAL)" }
  - { id: ERR_GROUP_INVALID_STATE, http: 409, condition: "Group not in the state required (lock requires DRAFT; run creation requires LOCKED or ANALYZED)" }
  - { id: ERR_RUN_INVALID_STATE, http: 409, condition: "ModelRun not PROVISIONAL when finalize attempted" }
  - { id: ERR_FINDING_INVALID_STATE, http: 409, condition: "GapFinding not FLAGGED when disposition attempted" }
  - { id: ERR_PLAN_INVALID_STATE, http: 409, condition: "RemediationPlan not in the state required (submit/decision/adjustment-create/reverse)" }
  - { id: ERR_PLAN_NOT_APPROVED, http: 409, condition: "Adjustment decision requires plan status APPROVED or EXECUTING" }
  - { id: ERR_ADJUSTMENT_INVALID_STATE, http: 409, condition: "Adjustment not PROPOSED (decision) or not EFFECTIVE (reverse)" }
  - { id: ERR_FILING_INVALID_STATE, http: 409, condition: "ReportFiling not in the state required by compile/submit/record-decision/reopen" }
  - { id: ERR_POSTING_INVALID_STATE, http: 409, condition: "TransparencyPosting not DRAFT (publish) or not PUBLISHED (close)" }
  - { id: ERR_CYCLE_INVALID_STATE, http: 409, condition: "MonitoringCycle not DUE (start) or not RE_TESTING (complete)" }
  # --- Business safety (compliance / segregation) ---
  - { id: ERR_SELF_DECISION_FORBIDDEN, http: 403, condition: "Adjustment decider's X-User-ID equals the adjustment's created_by_user_id (segregation of duties)" }
  - { id: ERR_RANGE_DISCLOSURE_REQUIRED, http: 422, condition: "Jurisdiction requires pay range disclosure but posting lacks min_salary_cents or max_salary_cents" }
  # --- Business temporal ---
  - { id: ERR_EFFECTIVE_DATE_IN_PAST, http: 422, condition: "Adjustment effective_date is before the current logical-clock date" }
  - { id: ERR_MIN_POSTING_DURATION_NOT_MET, http: 422, condition: "Posting close before published date + min_posting_duration_days" }
  - { id: ERR_STUDY_PERIOD_OVERLAP, http: 409, condition: "New study's CLOSED analysis period overlaps an existing study's period (shared boundary date counts)" }
  - { id: ERR_MONITOR_WINDOW_OVERLAP, http: 409, condition: "New cycle's HALF-OPEN window overlaps an existing cycle of the same study (touching boundaries allowed)" }
  # --- Business constraint ---
  - { id: ERR_DUPLICATE_EMPLOYEE_REF, http: 409, condition: "employee_ref already exists within the study" }
  - { id: ERR_DUPLICATE_GROUP_NAME, http: 409, condition: "ComparatorGroup name already exists within the study" }
  - { id: ERR_DUPLICATE_FILING, http: 409, condition: "ReportFiling already exists for (study_id, report_type, reporting_year)" }
  - { id: ERR_DUPLICATE_JURISDICTION, http: 409, condition: "jurisdiction_code already exists" }
  - { id: ERR_DUPLICATE_POSTING_REF, http: 409, condition: "job_posting_ref already exists" }
  - { id: ERR_ACTIVE_PLAN_EXISTS, http: 409, condition: "Study already has a RemediationPlan whose status is not COMPLETED" }
  - { id: ERR_CROSS_STUDY_REFERENCE, http: 409, condition: "Referenced group/finding/snapshot/plan belongs to a different study than the operation's study context" }
  - { id: ERR_GROUP_CRITERIA_MISMATCH, http: 422, condition: "Snapshot job_family/location_code differ from the group's, or snapshot job_level outside the group's [min_job_level, max_job_level] band" }
  - { id: ERR_GROUP_BELOW_MIN_SIZE, http: 422, condition: "Group lock attempted with member_count < study.min_group_size" }
  - { id: ERR_INVALID_SALARY_RANGE, http: 422, condition: "Posting max_salary_cents < min_salary_cents" }
  - { id: ERR_RANGE_SPREAD_EXCEEDED, http: 422, condition: "Posting range spread (max-min)/min*100 exceeds the jurisdiction's max_range_spread_pct" }
  - { id: ERR_PLAN_EMPTY, http: 422, condition: "Plan submit requires at least one PROPOSED adjustment" }
  - { id: ERR_FINDING_NOT_ACTIONABLE, http: 422, condition: "Disposition TARGETED requires is_actionable == true" }
  # --- Business fiscal ---
  - { id: ERR_BUDGET_EXCEEDED, http: 422, condition: "plan.committed_cents + proposed_increase_cents > plan.total_budget_cents on APPROVE" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CompAnalyst
    description: "Compensation analytics team member; builds studies, comparator groups, model runs, dispositions findings, drafts remediation plans and adjustments, runs pipeline analyses and monitoring cycles"
    identity: opaque
    exclusive_operations:
      - "POST /api/pay-equity-studies"
      - "POST /api/pay-equity-studies/{id}/advance"
      - "POST /api/pay-equity-studies/{id}/submit-legal-review"
      - "POST /api/pay-equity-studies/{id}/begin-monitoring"
      - "POST /api/comparator-groups and /lock"
      - "POST /api/model-runs and /finalize"
      - "POST /api/gap-findings/{id}/disposition"
      - "POST /api/remediation-plans and /submit"
      - "POST /api/adjustments"
      - "POST /api/pipeline-analyses"
      - "POST /api/monitoring-cycles, /start, /complete"
    shared_operations:
      - "All GET endpoints"
      - "GET /api/remediation-plans/{id}/suggested-allocation (with RemediationApprover)"

  - name: LegalCounsel
    description: "Legal counsel; sole authority over privilege designation and study closure; gates the analysis under legal privilege"
    identity: opaque
    exclusive_operations:
      - "POST /api/pay-equity-studies/{id}/legal-decision"
      - "POST /api/pay-equity-studies/{id}/open-remediation"
      - "POST /api/pay-equity-studies/{id}/close"
    shared_operations:
      - "All GET endpoints"

  - name: RemediationApprover
    description: "Compensation committee approver; decides plans and individual adjustments; segregation of duties: cannot decide an adjustment it proposed"
    identity: opaque
    exclusive_operations:
      - "POST /api/remediation-plans/{id}/decision"
      - "POST /api/adjustments/{id}/decision"
      - "POST /api/adjustments/{id}/reverse"
    shared_operations:
      - "All GET endpoints"
      - "GET /api/remediation-plans/{id}/suggested-allocation (with CompAnalyst)"

  - name: PeopleOpsAdmin
    description: "People operations administrator; maintains employee snapshots and jurisdiction rule configuration"
    identity: opaque
    exclusive_operations:
      - "POST /api/employee-snapshots"
      - "PATCH /api/employee-snapshots/{id}"
      - "POST /api/jurisdiction-rules"
    shared_operations:
      - "All GET endpoints"

  - name: ComplianceReporter
    description: "Compliance reporting specialist; compiles and submits EEO-style filings and manages pay transparency postings"
    identity: opaque
    exclusive_operations:
      - "POST /api/report-filings, /compile, /submit, /record-decision, /reopen"
      - "POST /api/transparency-postings, /publish, /close"
    shared_operations:
      - "All GET endpoints"

  - name: PlatformAdmin
    description: "Platform operator; drives the logical clock used by scheduled transitions"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
