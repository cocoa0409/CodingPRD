  - name: fai_reject_cancels_the_run_and_releases_the_wire_and_setup
    claim_type: cascade_down
    grounds:
    - state_machines.ProductionRun.transitions[FAI_PENDING -> CANCELLED]
    - state_machines.MachineSetup.transitions[ACTIVE -> ABORTED]
    - state_machines.CoilingMachine.transitions[PRODUCTION -> IDLE]
    excluded_because:
      difficulty_instance: transitive_cascade / fai_rejection_wire_release_setup_abort_chain_four_hops
      rationale: That §1.8 instance drives POST /production-runs/{id}/fai-disposition with decision REJECT and
        asserts all four hops — process_status CANCELLED, the verbatim wire-reservation release, the setup ABORTED
        and the coiler back to IDLE with a null active_setup_id.
  - name: submission_approve_promotes_the_design_and_starts_amortization
    claim_type: bubble_up
    grounds:
    - state_machines.QualificationSubmission.transitions[SUBMITTED -> APPROVED]
    - state_machines.SpringDesign.transitions[PROTOTYPE_RELEASED -> PRODUCTION_RELEASED]
    - state_machines.ToolingAsset.transitions[PENDING -> AMORTIZING]
    excluded_because:
      difficulty_instance: transitive_cascade / ppap_approval_production_release_amortization_chain_four_hops
      rationale: That §1.8 instance drives the APPROVE verdict and asserts the whole four-hop chain, including
        the frozen amortization_basis_pieces, amort_per_piece_cents 10 and the program's quote_frozen flag.
  - name: submission_interim_approve_caps_allocation_and_resubmit_reopens_it
    claim_type: valid_transition
    grounds:
    - state_machines.QualificationSubmission.transitions[SUBMITTED -> INTERIM_APPROVED]
    - state_machines.QualificationSubmission.transitions[INTERIM_APPROVED -> SUBMITTED]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / lot_creation_capped_by_interim_approved_submission_then_reopened_by_resubmit
      rationale: That §1.8 instance records the INTERIM_APPROVE verdict with its interim_piece_cap, allocates
        against the cap, then resubmits from INTERIM_APPROVED and asserts the cap is nulled and the posture falls
        back to BLOCKED.
  - name: submission_resubmit_at_the_third_round_is_refused
    claim_type: precondition_enforcement
    grounds:
    - state_machines.QualificationSubmission.transitions[REVISION_REQUESTED -> SUBMITTED]
    - errors[ERR_MAX_SUBMISSION_ROUNDS_EXCEEDED]
    excluded_because:
      difficulty_instance: non_linear_state_machine / qualification_submission_revision_cycle_capped_at_three_rounds
      rationale: That §1.8 instance walks the SUBMITTED <-> REVISION_REQUESTED loop to round_no 3 and asserts
        the fourth submit is refused by the counter rather than by a state.
  - name: run_process_and_quality_axes_advance_independently
    claim_type: parallel
    grounds:
    - complexity_profile.state_machine_shape
    - state_machines.ProductionRun
    excluded_because:
      difficulty_instance: non_linear_state_machine / production_run_parallel_axes_move_independently
      rationale: That §1.8 instance walks the combined (process_status x quality_status) grid, showing each axis
        moving without disturbing the other and the combined state gating completion.
- section: calculations
  instances:
  - name: spring_rate_and_mass_recomputed_by_a_revision_that_changes_active_coils
    claim_type: correct_result
    grounds:
    - calculations.spring_rate
    - calculations.wire_mass_per_piece
    - endpoints[POST /spring-designs/{id}/revisions]
    distinguishing_aspect: 'The revision re-runs the closed-form stack on the NEW coil count only: rate falls
      from 9.031 to 7.225 (G*d^4 / (8*Dm^3*Na) with Na 8 -> 10) and per-piece mass rises from 0.021185 to 0.025422
      kg, while the stress fields, which do not read active_coils, stay at 513.37 / 171.12 MPa.'
    test_recipe:
      setup:
      - A PROTOTYPE_RELEASED D1 (d 2.5, OD 20.0, Na 8) on the 79.3 GPa / 7850 kg-per-m3 grade reads spring_rate
        9.031 and wire_mass_per_piece_kg 0.021185; its version has not moved since creation because only the revisions
        endpoint bumps it.
      setup_api_calls:
      - call: POST /customer-programs
        payload:
          program_code: PGM-1
          customer_name: Bramble Industrial Supply
          application_class: INDUSTRIAL
          ppap_level: 1
          committed_pieces: 500000
          minimum_order_quantity: 1000
          required_salt_spray_hours: 96
          biocompatibility_required: false
          min_fatigue_margin: 1.2
          required_ppk: 1.0
          amortization_method: FORECAST_BASIS
        as: ProgramManager
        captures:
          prog_id: $.data.id
          prog_v: $.data.version
      - call: POST /material-specs
        payload:
          spec_code: MS-CRSI-1
          wire_material: CHROME_SILICON_A401
          tensile_grade_mpa: 1900
          shear_modulus_gpa: 79.3
          elastic_modulus_gpa: 203.0
          density_kg_per_m3: 7850
          coating: ZINC_PHOSPHATE
          salt_spray_hours: 96
          biocompatible: false
          cost_per_kg_cents: 850
        as: DesignEngineer
        captures:
          ms_id: $.data.id
      - call: POST /spring-designs
        payload:
          program_id: ${prog_id}
          material_spec_id: ${ms_id}
          part_number: D1
          form_type: COMPRESSION
          end_type: CLOSED_GROUND
          wire_diameter_mm: 2.5
          outer_diameter_mm: 20.0
          free_length_mm: 60.0
          active_coils: 8
          max_working_load_n: 150
          min_working_load_n: 50
          cycle_seconds_per_piece: 1.8
          shot_peening_required: true
        as: DesignEngineer
        as_user_id: de-01
        captures:
          d_id: $.data.id
          d_v: $.data.version
      - call: POST /spring-designs/${d_id}/critical-characteristics
        payload:
          char_code: FREE_LENGTH
          nominal_value: 60.0
          lsl: 59.5
          usl: 60.5
          is_safety_critical: true
          cpk_floor: 1.333
        as: DesignEngineer
        as_user_id: de-01
        captures:
          cc_id: $.data.id
      - call: POST /spring-designs/${d_id}/submit-for-review
        payload: {}
        as: DesignEngineer
        as_user_id: de-01
      - call: POST /spring-designs/${d_id}/review
        payload:
          decision: APPROVE_PROTOTYPE
        as: EngineeringManager
        as_user_id: em-01
      trigger:
      - call: POST /spring-designs/${d_id}/revisions
        payload:
          expected_design_version: ${d_v}
          active_coils: 10
        as: DesignEngineer
        as_user_id: de-01
      assert:
      - HTTP 200
      - SpringDesign.spring_rate_n_per_mm == 7.225
      - SpringDesign.wire_mass_per_piece_kg == 0.025422
      - SpringDesign.shear_stress_max_mpa == 513.37
      - SpringDesign.shear_stress_min_mpa == 171.12
      - SpringDesign.fatigue_margin_ratio == 1.757
      - SpringDesign.predicted_fatigue_life_cycles == 10000000
      - SpringDesign.current_revision_no == 2
      - SpringDesign.superseded_revision_no == 1
      - SpringDesign.release_status == 'DRAFT'
