              as: AdOps
              captures: { cver: $.data.version }
          trigger:
            - call: "PATCH /adnet/campaigns/${cmp}"
              payload: { cpm_cents: 2000, expected_campaign_version: "${cver}" }
              as: AdOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409, error_id == ERR_CAMPAIGN_NOT_EDITABLE; cpm_cents stays 1000"

      - name: flight_end_equal_start_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_FLIGHT_WINDOW_INVALID]"]
