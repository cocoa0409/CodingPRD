              payload: { scheduled_departures: 100, completed_departures: 100, cancelled_carrier_departures: 0, cancelled_weather_departures: 0, seats_offered: 1900, passengers_enplaned: 700 }
              as: Carrier
              as_user_id: "${car1_id}"
            - call: "POST /eas/service-periods/${per13_id}/certify"
              payload: { certification_note: "a thirteenth month on a twelve-month obligation" }
              as: ProgramAdmin
              captures: { obligation_error_id: $.data.error_id }
          assert:
            - "ServiceAgreement.${agr_id}.total_committed_usd == round(1200000.00 * 12 / 12, 2) == 1200000.00 at award with obligated_remaining_usd == 1200000.00"
            - "Every one of the twelve payments has monthly_entitlement_usd == 100000.00, per_departure_rate_usd == 1000.00, credited_departures == 100, cancellation_adjustment_usd == 0.00, withholding_pct == 0.00 and net_payment_usd == 100000.00"
            - "After the twelfth disbursement ServiceAgreement.${agr_id}.disbursed_to_date_usd == 1200000.00 and obligated_remaining_usd == round(1200000.00 - 1200000.00, 2) == 0.00"
            - "The twelfth certification itself succeeded on equality, because round(100000.00 - 0.00, 2) was exactly equal to the obligated_remaining_usd of 100000.00 at that moment"
            - "GET /eas/service-periods filtered by agreement_id ${agr_id} returns 12 rows all with status PAID before the trigger"
            - "The thirteenth period is created (201) and reported (200) without error — the ceiling is not enforced at those steps"
            - "The thirteenth certify returns 422 with ${obligation_error_id} == ERR_OBLIGATION_EXCEEDED"
            - "ServicePeriod.${per13_id}.status is still REPORTED, no SubsidyPayment exists for it, and GET /eas/subsidy-payments filtered by nothing returns total_count == 12"
            - "ServiceAgreement.${agr_id}.disbursed_to_date_usd is still 1200000.00 and obligated_remaining_usd is still 0.00, never negative"

  - section: rbac
    instances:
      - name: requests_without_a_usable_identity_are_rejected_first
        claim_type: authentication
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations.priority_1
          - roles
        distinguishing_aspect: "Authentication is answered before role membership, ownership and existence alike: an empty X-User-ID, and a role name that is not one of the five declared roles, both return 401 even on endpoints the request would otherwise be entitled to call."
        test_recipe:
          setup:
            - "One community exists so the target ids resolve."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eas/communities"
              payload: { code: "HYS", name: "Hays", state_code: "KS", driving_miles_to_nearest_hub: 165.0, enplanements_prior_year: 6200, min_required_weekly_round_trips: 12, min_required_weekly_seats: 400 }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
          trigger:
            - call: "GET /eas/communities/${comm_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: ""
              captures: { empty_id_error_id: $.data.error_id }
            - call: "POST /eas/carriers"
              payload: { name: "Ghost Air", certificate_number: "CERT-9999" }
              as: ProgramAdmin
              as_user_id: ""
              captures: { empty_id_write_error_id: $.data.error_id }
            - call: "GET /eas/communities"
              payload: {}
              as: Auditor
              as_user_id: "auditor-1"
              captures: { unknown_role_error_id: $.data.error_id }
          assert:
            - "The read with an empty X-User-ID returns 401 with ${empty_id_error_id} == ERR_UNAUTHENTICATED"
            - "The write with an empty X-User-ID returns 401 with ${empty_id_write_error_id} == ERR_UNAUTHENTICATED and no Carrier row is created"
            - "The read naming the undeclared role Auditor returns 401 with ${unknown_role_error_id} == ERR_UNAUTHENTICATED, not 403"
            - "GET /eas/carriers with a valid ProgramAdmin identity returns total_count == 0, confirming the refused write left nothing behind"

      - name: exclusive_operations_are_refused_to_every_other_role
        claim_type: authorization
        grounds:
          - errors.ERR_UNAUTHORIZED
          - validations.priority_2
          - roles.ProgramAdmin.exclusive_operations
          - roles.SelectionOfficer.exclusive_operations
          - roles.EligibilityAnalyst.exclusive_operations
          - roles.Carrier.exclusive_operations
        distinguishing_aspect: "Two of the exclusive claims are action-level rather than endpoint-level: ProgramAdmin and Carrier share POST /eas/rate-renegotiations/{id}/actions but the ACCEPT/COUNTER/REJECT verbs belong to the program office and REVISE/WITHDRAW to the carrier, so the same endpoint answers 403 or 200 depending only on the action token."
        test_recipe:
          setup:
            - "Community HYS SUBSIDIZED under an ACTIVE agreement with one REQUESTED renegotiation on file."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eas/communities"
              payload: { code: "HYS", name: "Hays", state_code: "KS", driving_miles_to_nearest_hub: 165.0, enplanements_prior_year: 6200, min_required_weekly_round_trips: 12, min_required_weekly_seats: 400 }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /eas/communities/${comm_id}/eligibility-determinations"
              payload: { waiver_requested: false }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /eas/aircraft-types"
              payload: { code: "B190", name: "Beechcraft 1900D", seats: 19, is_jet: false, fuel_burn_gal_per_hour: 68.0, hourly_operating_cost_usd: 1450.00 }
              as: ProgramAdmin
              captures: { ac_b190_id: $.data.id }
            - call: "POST /eas/carriers"
              payload: { name: "Prairie Air", certificate_number: "CERT-1001" }
              as: ProgramAdmin
              captures: { car1_id: $.data.id }
            - call: "POST /eas/solicitations"
              payload: { community_id: "${comm_id}", closes_at: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { sol_id: $.data.id }
            - call: "POST /eas/proposals"
              payload: { solicitation_id: "${sol_id}", carrier_id: "${car1_id}", aircraft_type_id: "${ac_b190_id}", service_level: "ESSENTIAL_MINIMUM", weekly_round_trips: 12, seats_per_departure: 19, annual_subsidy_request_usd: 1600000.00, term_months: 24, payment_basis: "COMPLETED_FLIGHT_PRORATION" }
              as: Carrier
              as_user_id: "${car1_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /eas/proposals/${p1_id}/actions"
              payload: { action: "SUBMIT" }
              as: Carrier
              as_user_id: "${car1_id}"
            - call: "POST /eas/solicitations/${sol_id}/actions"
              payload: { action: "CLOSE" }
              as: ProgramAdmin
            - call: "POST /eas/solicitations/${sol_id}/selection-order"
              payload: { order_note: "award to sole candidate" }
              as: SelectionOfficer
              as_user_id: "officer-1"
              captures: { agr_id: $.data.id }
            - call: "POST /eas/rate-renegotiations"
              payload: { agreement_id: "${agr_id}", trigger_type: "COST_INCREASE", documented_cost_increase_pct: 0.0400, requested_annual_subsidy_usd: 1660000.00, justification: "insurance renewal" }
              as: Carrier
              as_user_id: "${car1_id}"
              captures: { rn1_id: $.data.id }
          trigger:
            - call: "POST /eas/communities"
              payload: { code: "DDC", name: "Dodge City", state_code: "KS", driving_miles_to_nearest_hub: 152.0, enplanements_prior_year: 5100, min_required_weekly_round_trips: 12, min_required_weekly_seats: 400 }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
              captures: { analyst_write_error_id: $.data.error_id }
            - call: "POST /eas/communities/${comm_id}/eligibility-determinations"
              payload: { waiver_requested: true }
              as: ProgramAdmin
              captures: { admin_determination_error_id: $.data.error_id }
            - call: "POST /eas/solicitations/${sol_id}/selection-order"
              payload: { order_note: "carrier awarding itself" }
              as: Carrier
              as_user_id: "${car1_id}"
              captures: { carrier_award_error_id: $.data.error_id }
            - call: "POST /eas/service-periods"
              payload: { agreement_id: "${agr_id}", period_month: "2026-08" }
              as: SelectionOfficer
              as_user_id: "officer-1"
              captures: { officer_period_error_id: $.data.error_id }
            - call: "POST /eas/rate-renegotiations/${rn1_id}/actions"
              payload: { action: "ACCEPT", action_note: "carrier accepting its own request" }
              as: Carrier
              as_user_id: "${car1_id}"
              captures: { carrier_accept_error_id: $.data.error_id }
            - call: "POST /eas/rate-renegotiations/${rn1_id}/actions"
              payload: { action: "WITHDRAW", action_note: "program office withdrawing for the carrier" }
              as: ProgramAdmin
              as_user_id: "admin-negotiator"
              captures: { admin_withdraw_error_id: $.data.error_id }
            - call: "POST /eas/rate-renegotiations/${rn1_id}/actions"
              payload: { action: "REJECT", action_note: "not documented" }
              as: ProgramAdmin
              as_user_id: "admin-negotiator"
          assert:
            - "EligibilityAnalyst creating a community returns 403 with ${analyst_write_error_id} == ERR_UNAUTHORIZED and GET /eas/communities still returns total_count == 1"
            - "ProgramAdmin filing an eligibility determination returns 403 with ${admin_determination_error_id} == ERR_UNAUTHORIZED"
            - "Carrier issuing a selection order returns 403 with ${carrier_award_error_id} == ERR_UNAUTHORIZED"
            - "SelectionOfficer opening a service period returns 403 with ${officer_period_error_id} == ERR_UNAUTHORIZED"
            - "Carrier sending ACCEPT on the renegotiation returns 403 with ${carrier_accept_error_id} == ERR_UNAUTHORIZED even though the carrier owns the renegotiation — the verb is reserved to the program office"
            - "ProgramAdmin sending WITHDRAW returns 403 with ${admin_withdraw_error_id} == ERR_UNAUTHORIZED, the mirror image of the previous call on the same endpoint"
            - "RateRenegotiation.${rn1_id}.status is still REQUESTED after all the refusals, then REJECT by ProgramAdmin returns 200 with status REJECTED"

      - name: entity_backed_roles_cannot_reach_another_owners_rows
        claim_type: resource_ownership
        grounds:
          - errors.ERR_FORBIDDEN_RESOURCE_OWNER
          - validations.priority_5
          - roles.Carrier.identity
          - roles.CommunityRepresentative.identity
        distinguishing_aspect: "Ownership is resolved through a chain rather than a column: a Carrier's right to report on a ServicePeriod runs period -> agreement -> carrier_id, so carrier 2 is refused on carrier 1's period even though both are legitimate Carriers with identical role rights."
        test_recipe:
          setup:
            - "Two communities each with their own solicitation; carrier 1 holds the awarded agreement for community 1 with an OPEN 2026-08 period; carrier 2 has a DRAFT proposal of its own."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eas/communities"
              payload: { code: "HYS", name: "Hays", state_code: "KS", driving_miles_to_nearest_hub: 165.0, enplanements_prior_year: 6200, min_required_weekly_round_trips: 12, min_required_weekly_seats: 400 }
              as: ProgramAdmin
              captures: { comm1_id: $.data.id }
            - call: "POST /eas/communities/${comm1_id}/eligibility-determinations"
              payload: { waiver_requested: false }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /eas/communities"
              payload: { code: "DDC", name: "Dodge City", state_code: "KS", driving_miles_to_nearest_hub: 152.0, enplanements_prior_year: 5100, min_required_weekly_round_trips: 12, min_required_weekly_seats: 400 }
              as: ProgramAdmin
              captures: { comm2_id: $.data.id }
            - call: "POST /eas/communities/${comm2_id}/eligibility-determinations"
              payload: { waiver_requested: false }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /eas/aircraft-types"
              payload: { code: "B190", name: "Beechcraft 1900D", seats: 19, is_jet: false, fuel_burn_gal_per_hour: 68.0, hourly_operating_cost_usd: 1450.00 }
              as: ProgramAdmin
              captures: { ac_b190_id: $.data.id }
            - call: "POST /eas/carriers"
              payload: { name: "Prairie Air", certificate_number: "CERT-1001" }
