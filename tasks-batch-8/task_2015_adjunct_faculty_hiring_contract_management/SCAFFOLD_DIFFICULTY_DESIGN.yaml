  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: benefits_cap_exact_equality_is_eligible
        grounds:
          - calculations.term_load_units
          - entities.TermConfig.fields.load_cap_units
          - entities.AdjunctFaculty.fields.benefits_eligible
        distinguishing_aspect: |
          Metric = numeric load threshold on GET /faculty/{id}/load: the rule is
          load >= cap (inclusive). At exactly cap (3.00 + 1.50 = 4.50 ==
          load_cap_units 4.50) benefits_eligible must be true; at 4.49 it must
          be false. The >= (not >) boundary is the falsifiable claim.
        test_recipe:
          setup:
            - "Faculty COMPLIANT with two ACTIVE contracts in 2026FA: loads 3.00 and 1.50 (sum exactly 4.50 == cap)"
            - "Both sections RUNNING (clock at term start)"
