  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: shortfall_recomputed_minus_recognized
        claim_type: correct_result
        grounds: ["calculations.shortfall_calculation", "entities.AuditFinding.fields.shortfall_cents"]
        distinguishing_aspect: "Finding on an ACCEPTED report: shortfall = recomputed FINAL at audited base (150000 * 5% = 7500) minus already-recognized 5000 = 2500 — not the full 7500."
        test_recipe:
          setup: ["AG ACTIVE 500 bp min 0; report net 100000 VALIDATED then ACCEPTED (recognized 5000); audit covering the period in FIELDWORK"]
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Sf Co", tax_id: "TAX-SF-1", contact_email: "sf@x.test" }
