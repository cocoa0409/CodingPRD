      - name: verify_expired_card_returns_card_expired
        claim_type: Violation → Error
        grounds:
          - validations[priority=10]
          - errors[ERR_CARD_EXPIRED]
        distinguishing_aspect: "Verifying a card whose expires_on precedes the current fare day -> ERR_CARD_EXPIRED (409)."
        test_recipe:
          setup:
            - "Clock 2026-06-20T12:00:00Z; Rider RE with PENDING_VERIFICATION card CE expires_on 2026-06-10."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_X", base_fare_cents: 300, daily_cap_cents: 500, weekly_cap_cents: 2500 }
              as: FareAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T12:00:00Z" }
