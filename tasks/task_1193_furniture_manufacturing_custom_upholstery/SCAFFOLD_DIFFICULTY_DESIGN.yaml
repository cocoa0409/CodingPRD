            - call: "POST /mill/dealer-accounts"
              payload: { dealer_code: "DLR-001", name: "Blue Ridge Furniture", credit_limit_cents: 100000000, sample_allowance_cents: 5000000 }
              as: SalesRep
              captures: { dealer_id: $.data.id }
            - call: "POST /mill/material-lots"
              payload: { fabric_spec_id: "${spec_id}", expected_yards: 30.0 }
              as: MaterialReceiver
              captures: { lot_id: $.data.id }
            - call: "POST /mill/material-lots/${lot_id}/receive"
              payload: { received_yards: 30.0 }
              as: MaterialReceiver
            - call: "POST /mill/material-lots/${lot_id}/inspect"
              payload: { result: "PASS", usable_yards: 30.0, rejected_yards: 0.0, measured_width_inches: 54.0 }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-ADJ", dealer_id: "${dealer_id}", ship_to_state: "NC", delivery_method: "LTL_FREIGHT" }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /mill/order-lines"
              payload: { order_id: "${order_id}", model_id: "${model_id}", fabric_spec_id: "${spec_id}", fabric_source: "PLANT_STOCK", finish_code: "ESPRESSO", quantity: 1 }
              as: SalesRep
              captures: { line_id: $.data.id }
            - call: "POST /mill/customer-orders/${order_id}/confirm"
              payload: {}
              as: SalesRep
            - call: "POST /mill/cells"
              payload: { cell_code: "C-CUT", cell_type: "CUTTING", capacity_slots: 1, certifications: [] }
              as: ProductionPlanner
              captures: { c_cut: $.data.id }
          trigger:
            - call: "POST /mill/cell-bookings"
              payload: { cell_id: "${c_cut}", order_line_id: "${line_id}", operation: "CUT", start_at: "2026-06-03T10:00:00Z", end_at: "2026-06-03T12:00:00Z" }
              as: ProductionPlanner
              captures: { b1: $.data.id }
            - call: "POST /mill/cell-bookings"
              payload: { cell_id: "${c_cut}", order_line_id: "${line_id}", operation: "CUT", start_at: "2026-06-03T12:00:00Z", end_at: "2026-06-03T14:00:00Z" }
              as: ProductionPlanner
              captures: { b2: $.data.id }
            - call: "POST /mill/cell-bookings"
              payload: { cell_id: "${c_cut}", order_line_id: "${line_id}", operation: "CUT", start_at: "2026-06-03T11:00:00Z", end_at: "2026-06-03T13:00:00Z" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "Booking ${b1} created BOOKED for [10:00, 12:00)"
            - "Booking ${b2} created BOOKED for [12:00, 14:00) — start == prior end is adjacent, not overlapping"
            - "Third booking [11:00, 13:00) rejected: 409 data.error_id == ERR_CELL_OVERLAP"
            - "Cell.${c_cut}.committed_hours == 4.0 (only the two accepted bookings count)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: booking_gated_on_line_stage
        grounds:
          - errors[ERR_LINE_STAGE_MISMATCH]
