              as: PlatformAdmin
          trigger:
            - call: "POST /api/complexes/${cx_id}/run-ops"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Flock.${f1_id}.status == DEPLETED and current_hen_count == 0"
            - "Flock.${f1_id}.age_weeks == 80 (the age-80 week start fired the deplete and froze the counter)"
            - "House.${h1_id}.hen_inventory == 0 (the deplete cascade recomputed it)"
            - "a subsequent molt attempt on the DEPLETED flock returns 409 ERR_INVALID_STATE"

