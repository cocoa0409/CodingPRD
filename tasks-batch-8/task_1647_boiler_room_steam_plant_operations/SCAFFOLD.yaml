# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"

  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for this endpoint per RBAC"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-template ID does not resolve within the requested scope"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Schema violation (missing required field, invalid enum, end<=start, etc.)"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in the required from-state for this transition"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC mismatch: expected_<parent>_version != parent's current version"

  - id: ERR_WATER_CRITICAL
    http: 422
    condition: "Boiler.water_status == CRITICAL — warm blocked"

  - id: ERR_WATER_OUT_OF_SPEC
    http: 422
    condition: "Boiler.water_status != IN_SPEC — bring-online blocked"

  - id: ERR_NO_VALID_CHEMISTRY
    http: 422
    condition: "No non-VOIDED ChemistryLog with cycles_of_concentration <= MAX_CYCLES exists"

  - id: ERR_CERT_NOT_VALID
    http: 422
    condition: "Boiler.cert_status != VALID — warm/bring-online blocked"

  - id: ERR_PLANT_EMERGENCY
    http: 422
    condition: "Plant.posture == EMERGENCY — warm blocked"

  - id: ERR_OPERATOR_LICENSE_INVALID
    http: 422
    condition: "Operator.license_status != ACTIVE (or license_class insufficient)"

  - id: ERR_LICENSE_WRONG_STATE
    http: 422
    condition: "Operator.license_state != Plant.state_code"

  - id: ERR_SOD_VERIFICATION
    http: 422
    condition: "Verifier is the same operator who recorded the entry (segregation of duties)"

  - id: ERR_REFERENCED_NOT_FOUND
    http: 422
    condition: "Body-field FK target (recorded_by_operator_id, triggered_boiler_id, assigned_boiler_ids element) does not exist"

  - id: ERR_DISPATCH_WINDOW_CONFLICT
    http: 409
    condition: "A boiler in assigned_boiler_ids is already assigned to an overlapping SCHEDULED/ACTIVE window (half-open semantics)"

  - id: ERR_INSPECTION_SCHEDULE_CONFLICT
    http: 409
    condition: "Another PENDING inspection on this boiler occupies an overlapping buffered closed interval"

  - id: ERR_RELIEF_SETPOINT_EXCEEDED
    http: 422
    condition: "relief_valve_lift_pressure_psi > setpoint * (1 + tolerance_pct/100)"

  - id: ERR_RELIEF_NO_LIFT
    http: 422
    condition: "relief_valve_lift_pressure_psi < setpoint (lift must occur at or above setpoint)"

  - id: ERR_DUPLICATE_TAG
    http: 409
    condition: "Boiler tag or SteamTrap tag already exists within plant"

  - id: ERR_FUEL_INVENTORY_UNDERFLOW
    http: 422
    condition: "Operation would drive Plant.fuel_inventory_gal negative"

  - id: ERR_LEAD_CANNOT_BANK
    http: 422
    condition: "Current lead boiler cannot bank while other boilers are ONLINE"

  - id: ERR_RESOLUTION_NOTES_REQUIRED
    http: 422
    condition: "resolution_notes empty on Incident close"

  - id: ERR_INCIDENT_NOT_CLOSABLE
    http: 409
    condition: "HIGH/CRITICAL Incident must traverse ACKNOWLEDGED→MITIGATED before CLOSE"

  - id: ERR_INCIDENT_UNRESOLVED
    http: 422
    condition: "Boiler reset blocked: HIGH/CRITICAL incidents on this boiler not yet MITIGATED/CLOSED"

  - id: ERR_REINSPECTION_REQUIRED
    http: 422
    condition: "Boiler cert_status == SUSPENDED requires a POST_INCIDENT Inspection PASSED before reset"

  - id: ERR_BOILER_IN_DISPATCH
    http: 422
    condition: "Boiler cannot be decommissioned while referenced by SCHEDULED/ACTIVE LoadDispatch"

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: PlantManager
    description: "Plant administrative authority; owns plant config, decommission, verification-void, incident closure"
    identity: "opaque"
    exclusive_operations:
      - "POST /plants — create plant"
      - "POST /plants/{plantId}/run-ops — advance ops epoch"
      - "POST /plants/{plantId}/boilers — create boiler"
      - "POST /plants/{plantId}/boilers/{boilerId}/decommission — terminal"
      - "POST /plants/{plantId}/operators — create operator"
      - "POST /plants/{plantId}/operators/{operatorId}/renew-license"
      - "POST /plants/{plantId}/operators/{operatorId}/revoke-license"
      - "POST /plants/{plantId}/boilers/{boilerId}/chemistry-logs/{logId}/void — manager-only void"
      - "POST /plants/{plantId}/boilers/{boilerId}/inspections — schedule (shared with Inspector)"
      - "POST /plants/{plantId}/boilers/{boilerId}/inspections/{inspectionId}/record-outcome — shared with Inspector"
      - "POST /plants/{plantId}/boilers/{boilerId}/inspections/{inspectionId}/post — post certificate"
      - "POST /plants/{plantId}/incidents/{incidentId}/close"
      - "POST /plants/{plantId}/fuel-deliveries"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints (all)"
      - "POST /plants/{plantId}/boilers/{boilerId}/log-entries/{entryId}/void — shared with Operator (VERIFIED requires PlantManager, DRAFT allows Operator)"

  - name: Operator
    description: "Licensed boiler operator; performs state transitions, logs, chemistry, surveys"
    identity: "entity_backed:Operator"
    exclusive_operations:
      - "POST /plants/{plantId}/boilers/{boilerId}/warm"
      - "POST /plants/{plantId}/boilers/{boilerId}/bring-online"
      - "POST /plants/{plantId}/boilers/{boilerId}/bank"
      - "POST /plants/{plantId}/boilers/{boilerId}/shutdown"
      - "POST /plants/{plantId}/boilers/{boilerId}/reset"
      - "POST /plants/{plantId}/boilers/{boilerId}/log-entries"
      - "POST /plants/{plantId}/boilers/{boilerId}/log-entries/{entryId}/verify — SoD: must not be recorder"
      - "POST /plants/{plantId}/boilers/{boilerId}/chemistry-logs"
      - "POST /plants/{plantId}/steam-traps/{trapId}/survey"
      - "POST /plants/{plantId}/incidents"
      - "POST /plants/{plantId}/incidents/{incidentId}/acknowledge"
      - "POST /plants/{plantId}/incidents/{incidentId}/mitigate"
    shared_operations:
      - "GET endpoints (all)"
      - "POST /plants/{plantId}/load-dispatches — shared with PlantManager"
      - "POST /plants/{plantId}/load-dispatches/{dispatchId}/cancel — shared"
      - "POST /plants/{plantId}/steam-traps — shared with PlantManager"
      - "POST /plants/{plantId}/boilers/{boilerId}/log-entries/{entryId}/void — DRAFT void shared with PlantManager"

  - name: Inspector
    description: "External jurisdictional inspector; schedules and records outcomes"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET endpoints (all)"
      - "POST /plants/{plantId}/boilers/{boilerId}/inspections — shared with PlantManager"
      - "POST /plants/{plantId}/boilers/{boilerId}/inspections/{inspectionId}/record-outcome — shared with PlantManager"
