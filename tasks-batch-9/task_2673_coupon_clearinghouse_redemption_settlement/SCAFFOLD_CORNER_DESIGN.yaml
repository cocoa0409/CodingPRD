  # =====================================================================
  # Table 2 — State Machines
  # =====================================================================
  - section: state_machines
    instances:

      - name: offer_activation_refused_once_expiration_date_has_passed
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Offer.transitions.REGISTERED_to_ACTIVE
          - validations[priority=15][ERR_OFFER_EXPIRED]
          - errors.ERR_OFFER_EXPIRED
        distinguishing_aspect: |
          The activate transition's second precondition is enforced
          independently of the from-state guard: the offer is still REGISTERED
          (so priority 8 is satisfied) yet activation returns 422
          ERR_OFFER_EXPIRED because the clock has moved past expiration_date,
          and the offer stays REGISTERED with an unchanged version.
        test_recipe:
          setup:
            - "one manufacturer; one offer expiring 2026-08-10, registered at the default clock"
            - "clock then advanced to 2026-08-11, which is past the expiration date but sweeps nothing because the offer is REGISTERED, not ACTIVE"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { mfr_id: $.data.id }
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "SOUP50", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-08-10", redemption_instructions: "Save 50c", barcode_family: "GS1_DATABAR", max_redemptions: 1000 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/register"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /offers/${offer_id}/activate"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "GET /offers/${offer_id}"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
          assert:
            - "the setup clock call returned expired_offer_count == 0 — the ACTIVE -> EXPIRED sweep only touches ACTIVE offers"
            - "trigger call 1 returns 422 ERR_OFFER_EXPIRED"
            - "trigger call 2: data.status == \"REGISTERED\" and data.version == 2 (create then register only), so the refused activation applied no side effect"

      - name: lot_finalize_refused_until_full_sample_captured
        claim_type: precondition_enforcement
        grounds:
          - state_machines.SubmissionLot.transitions.SORTED_to_VALIDATED
          - validations[priority=30][ERR_SAMPLE_INCOMPLETE]
          - calculations.lot_sample_size
        distinguishing_aspect: |
          With counted_qty 3 the lot needs all 3 images (FULL_COUNT sampling),
          so finalize at captured_item_count 2 is a 422 ERR_SAMPLE_INCOMPLETE
          that changes nothing, and the identical call succeeds after the third
          image lands — the guard is captured_item_count == sample_size, not >=.
        test_recipe:
          setup:
            - "manufacturer, retailer, ACTIVE offer (face 50, fee 7, exp 2026-12-31)"
            - "MAIL submission declared 3 / verified 3, one lot of counted_qty 3, one POS basket under POS-1 with qualifying_units 1"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { mfr_id: $.data.id }
            - call: "POST /retailers"
              payload: { legal_name: "Northgate Markets" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
