        distinguishing_aspect: "Calling any endpoint without X-User-ID or X-User-Role header returns ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
