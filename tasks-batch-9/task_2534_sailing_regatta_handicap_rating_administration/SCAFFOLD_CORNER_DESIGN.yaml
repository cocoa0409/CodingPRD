            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_a}", rule_code: "TOD_PHRF", sail_area_m2: 68.0, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_a_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_a: $.data.id } }
            - { call: "POST /regatta-ops/rating-certificates/${c_a}/issue", payload: {}, as: Measurer, as_user_id: "${m_mea}" }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_b}", rule_code: "TOD_PHRF", sail_area_m2: 52.0, hull_length_m: 9.4, displacement_kg: 4100, draft_m: 1.95, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_b_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_b: $.data.id } }
            - { call: "POST /regatta-ops/rating-certificates/${c_b}/issue", payload: {}, as: Measurer, as_user_id: "${m_mea}" }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Autumn Handicap Series", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", discard_policy: "NONE", handicap_basis: "PER_CERTIFICATE", planned_race_count: 6, fleet_minimum: 2, protest_time_limit_minutes: 90, jury_quorum_required: 2, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg: $.data.id, reg_v1: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Notice of race revision 1", effective_utc: "2026-07-10T00:00:00Z", expected_regatta_version: "${reg_v1}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/divisions", payload: { regatta_id: "${reg}", code: "A", boat_type_filter: "MONOHULL", rating_band_low: 150.0, rating_band_high: 230.0, min_entries: 2 }, as: RegattaChair, as_user_id: "${m_ch}", captures: { div_a: $.data.id } }
            - { call: "POST /regatta-ops/entries", payload: { regatta_id: "${reg}", boat_id: "${b_a}", certificate_id: "${c_a}", helm_member_id: "${m_h1}", declared_crew_count: 1 }, as: Competitor, as_user_id: "${m_h1}", captures: { e_a: $.data.id } }
            - { call: "POST /regatta-ops/entries", payload: { regatta_id: "${reg}", boat_id: "${b_b}", certificate_id: "${c_b}", helm_member_id: "${m_h2}", declared_crew_count: 1 }, as: Competitor, as_user_id: "${m_h2}", captures: { e_b: $.data.id } }
            - { call: "POST /regatta-ops/entries/${e_a}/crew", payload: { member_id: "${m_h1}", position: "HELM", weight_kg: 84.5 }, as: Competitor, as_user_id: "${m_h1}" }
            - { call: "POST /regatta-ops/entries/${e_b}/crew", payload: { member_id: "${m_h2}", position: "HELM", weight_kg: 79.0 }, as: Competitor, as_user_id: "${m_h2}" }
            - { call: "POST /regatta-ops/entries/${e_a}/assign-division", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/entries/${e_b}/assign-division", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/entries/${e_a}/inspect", payload: { outcome: "PASS" }, as: RaceOfficer, as_user_id: "${m_pro}" }
            - { call: "POST /regatta-ops/entries/${e_b}/inspect", payload: { outcome: "PASS" }, as: RaceOfficer, as_user_id: "${m_pro}" }
            - { call: "POST /regatta-ops/entries/${e_a}/accept", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/entries/${e_b}/accept", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/divisions/${div_a}/confirm", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/rating-certificates/${c_a}/suspend", payload: { suspension_reason_code: "REMEASURE_ORDERED" }, as: Measurer, as_user_id: "${m_mea}" }
          trigger:
            - { call: "POST /regatta-ops/rating-certificates/${c_a}/reinstate", payload: {}, as: Measurer, as_user_id: "${m_mea}" }
          assert:
            - "the trigger call returns HTTP 200 with RatingCertificate.${c_a}.status == ISSUED and suspension_reason_code == null"
            - "Entry.${e_a}.registration_status == SUBMITTED, not ACCEPTED"
            - "Entry.${e_a}.division_id == ${div_a} and Entry.${e_b}.registration_status == ACCEPTED"
            - "Division.${div_a}.assigned_entry_count == 2 and Division.${div_a}.accepted_entry_count == 1"
            - "Division.${div_a}.status == PROVISIONAL: reinstatement does not re-confirm the division"
            - "Boat.${b_a}.version == 5: create 1, certificate create 2, issue 3, suspend 4, reinstate 5"

      - name: entry_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.Entry.inspection_status
          - state_machines.Entry.registration_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / entry_inspection_dimension_cycles_without_touching_registration
          rationale: "That instance walks NOT_INSPECTED -> FAILED -> PASSED -> FAILED on an entry that is already ACCEPTED and asserts registration_status is still ACCEPTED at every hop, which is exactly the parallel-dimension claim; repeating it here would only re-run the same call sequence."

      - name: certificate_suspension_cascades_down_to_races
        claim_type: cascade_down
        grounds:
          - state_machines.RatingCertificate.ISSUED_to_SUSPENDED
          - state_machines.Division.CONFIRMED_to_PROVISIONAL
        excluded_because:
          difficulty_instance: cascading_side_effects / certificate_suspension_cascades_entry_division_and_race_block
          rationale: "The four-hop suspension cascade (entry to RATING_INVALID, division counts refreshed, CONFIRMED division reverted, PENDING races blocked with DIVISION_UNDER_MINIMUM) is asserted hop by hop there, including the non-terminal-children restriction that a SUBMITTED entry is left alone."

      - name: division_revert_is_conditional_on_the_effective_floor
        claim_type: conditional_cascade
        grounds:
          - state_machines.Division.CONFIRMED_to_PROVISIONAL
          - entities.Regatta.fields.fleet_minimum
        excluded_because:
          difficulty_instance: cascading_side_effects / certificate_suspension_cascades_entry_division_and_race_block
          rationale: "The same instance shows the conditional half of the cascade: the division reverts only because its refreshed assigned_entry_count fell under max(min_entries, fleet_minimum), and the entry that was merely SUBMITTED is not touched at all."

      - name: duty_release_syncs_member_and_mark_boat_ledgers
        claim_type: ledger_sync
        grounds:
          - state_machines.DutyAssignment.CONFIRMED_to_RELEASED
          - entities.ClubMember.fields.assigned_duty_minutes
          - entities.MarkBoat.fields.committed_minutes
        excluded_because:
          difficulty_instance: derived_ledger_reconciliation / duty_release_restores_member_and_mark_boat_minute_ledgers
          rationale: "That instance reconciles both ancestor ledgers before and after the release, and additionally pins that PROPOSED -> CONFIRMED is a ledger no-op because PROPOSED already counted - the before/after reconciliation this row asks for."

      - name: abandon_reverses_every_scoring_side_effect
        claim_type: compensation
        grounds:
          - state_machines.Race.STARTED_to_ABANDONED
          - state_machines.Race.scoring_status.FINAL_to_NOT_SCORED
        excluded_because:
          difficulty_instance: cascading_side_effects / abandon_restores_series_points_conservation
          rationale: "Abandoning a FINAL race is the scaffold's compensation path, and that instance asserts every reversed effect (results voided, points 0, place null, corrected_seconds null, series totals back to their pre-race values, final_race_count decremented) with no drift."

      - name: jury_recusal_cross_entity_reverts_scheduled_protests
        claim_type: cross_entity
        grounds:
          - state_machines.JuryPanel.SEATED_to_FORMING
          - state_machines.Protest.HEARING_SCHEDULED_to_FILED
        excluded_because:
          difficulty_instance: cascading_side_effects / jury_recusal_cascades_panel_and_scheduled_protest
          rationale: "One recusal changes the panel and, across the entity boundary, drags every HEARING_SCHEDULED protest bound to it back to FILED with jury_panel_id and hearing_utc nulled; that instance asserts both sides of the boundary."

      - name: hearing_schedule_is_guarded_by_the_panel_state
        claim_type: guarded transitions
        grounds:
          - state_machines.Protest.FILED_to_HEARING_SCHEDULED
          - state_machines.JuryPanel.FORMING_to_SEATED
        excluded_because:
          difficulty_instance: guarded_cross_entity_transition / schedule_hearing_requires_seated_jury_panel
          rationale: "The Protest FILED -> HEARING_SCHEDULED edge fires only while the named panel is SEATED at quorum, and that instance drives the guard from both sides: rejected while the panel is FORMING, accepted once a seat lifts it to SEATED."

  # =========================================================================
  # From Table 3 (Calculations)
  # =========================================================================
  # No `Reconciliation` row is emitted: neither dual-variant rule ever switches
  # variant on a live row. corrected_time picks its variant from the regatta
  # handicap_basis and the pinned certificate rule_code, both immutable once the
  # result exists, and series_standing picks its variant from Regatta.scoring_system.
  - section: calculations
    instances:

      - name: rating_value_saturates_at_tot_and_tod_clamp_ceilings
        claim_type: constants_applied
        grounds:
          - calculations.certificate_rating_value
          - calculations.certificate_rating_value.constants.TOD_CLAMP_LOW
          - calculations.certificate_rating_value.constants.TOD_CLAMP_HIGH
          - calculations.certificate_rating_value.constants.TOT_CLAMP_LOW
          - calculations.certificate_rating_value.constants.TOT_CLAMP_HIGH
        distinguishing_aspect: |
          Both clamps are driven to saturation, which the difficulty design never does: a
          400/14.0/1000/2.00 MONOHULL has raw_speed_index 3.2, so the TOD line 420 - 380*3.2 = -796
          is clamped to -30.0 and the TOT line 0.4 + 0.7*3.2 = 2.64 is clamped to 1.6000 with
          band_key_spm -231.4, while a 4.0/4.0/8000/1.00 boat with raw 0.1 saturates the other way
          at TOD 300.0 and TOT 0.5000 with band 365.7 - so band_key_spm is projected from the
          CLAMPED rating_value, not from the unclamped line.
        test_recipe:
          setup:
            - "One licensed measurer and two MONOHULL boats: an extreme sailplan (400.0 m2 sail, 14.0 m hull, 1000 kg, 2.00 m draft) and an extreme lead mine (4.0 m2 sail, 4.0 m hull, 8000 kg, 1.00 m draft)."
            - "Every measurement stays inside its declared range, so priority 6 and priority 48 both pass and the clamps are the only thing the request exercises."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Mara Vance", email: "mara.vance@yc.test", measurer_license_id: "M-101" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_mea: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-9001", boat_name: "Overpowered", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 14.5 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_hi: $.data.id, b_hi_v1: $.data.version } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-9002", boat_name: "Lead Mine", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 4.5 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_lo: $.data.id, b_lo_v1: $.data.version } }
          trigger:
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_hi}", rule_code: "TOT_ORC", sail_area_m2: 400.0, hull_length_m: 14.0, displacement_kg: 1000, draft_m: 2.00, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_hi_v1}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_hi_tot: $.data.id } }
            - { call: "GET /regatta-ops/boats/${b_hi}", payload: {}, as: Measurer, as_user_id: "${m_mea}", captures: { b_hi_v2: $.data.version } }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_hi}", rule_code: "TOD_PHRF", sail_area_m2: 400.0, hull_length_m: 14.0, displacement_kg: 1000, draft_m: 2.00, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_hi_v2}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_hi_tod: $.data.id } }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_lo}", rule_code: "TOD_PHRF", sail_area_m2: 4.0, hull_length_m: 4.0, displacement_kg: 8000, draft_m: 1.00, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_lo_v1}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_lo_tod: $.data.id } }
            - { call: "GET /regatta-ops/boats/${b_lo}", payload: {}, as: Measurer, as_user_id: "${m_mea}", captures: { b_lo_v2: $.data.version } }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_lo}", rule_code: "TOT_ORC", sail_area_m2: 4.0, hull_length_m: 4.0, displacement_kg: 8000, draft_m: 1.00, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_lo_v2}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_lo_tot: $.data.id } }
          assert:
            - "every trigger POST returns HTTP 201"
            - "RatingCertificate.${c_hi_tot}.raw_speed_index == 3.2, rating_value == 1.6 (clamped from 2.64) and band_key_spm == -231.4"
            - "RatingCertificate.${c_hi_tod}.raw_speed_index == 3.2, rating_value == -30.0 (clamped from -796.0) and band_key_spm == -30.0"
            - "RatingCertificate.${c_lo_tod}.raw_speed_index == 0.1, rating_value == 300.0 (clamped from 382.0) and band_key_spm == 300.0"
            - "RatingCertificate.${c_lo_tot}.raw_speed_index == 0.1, rating_value == 0.5 (clamped from 0.47) and band_key_spm == 365.7"
            - "Boat.${b_hi}.version == 3 and Boat.${b_lo}.version == 3: two certificate creates each"

      - name: length_factor_floor_and_ceiling_bound_the_speed_index
        claim_type: threshold
        grounds:
          - calculations.certificate_rating_value
          - calculations.certificate_rating_value.constants.LENGTH_FACTOR_FLOOR
          - calculations.certificate_rating_value.constants.LENGTH_FACTOR_CEIL
          - calculations.certificate_rating_value.constants.LENGTH_DIVISOR
        distinguishing_aspect: |
          length_factor is max(1.00, min(1.60, hull_length_m / 8.0)), so on a hull with base 0.4
          (64.0 m2 sail, 8000 kg) the 7.0 m and the 8.0 m measurement both land on the floor 1.00
          and yield an identical TOD rating 268.0, while 12.8 m sits exactly on the ceiling ratio
          1.60 and 13.6 m is above it - both yielding an identical 176.8. Two ratios below the
          floor and two at or above the ceiling collapse to two values, which is what pins the
          clamp rather than a linear length term.
        test_recipe:
          setup:
            - "One licensed measurer and four MONOHULL boats that differ only in hull_length_m: 7.0, 8.0, 12.8 and 13.6 metres, all with sail_area_m2 64.0 and displacement_kg 8000 (base = 8/20 = 0.4)."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Mara Vance", email: "mara.vance@yc.test", measurer_license_id: "M-101" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_mea: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-7001", boat_name: "Short One", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 7.4 }, as: Competitor, as_user_id: "${m_h1}", captures: { b1: $.data.id, b1_v: $.data.version } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-7002", boat_name: "Floor Case", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 8.4 }, as: Competitor, as_user_id: "${m_h1}", captures: { b2: $.data.id, b2_v: $.data.version } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-7003", boat_name: "Ceiling Case", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 13.2 }, as: Competitor, as_user_id: "${m_h1}", captures: { b3: $.data.id, b3_v: $.data.version } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-7004", boat_name: "Over Ceiling", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 14.0 }, as: Competitor, as_user_id: "${m_h1}", captures: { b4: $.data.id, b4_v: $.data.version } }
          trigger:
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b1}", rule_code: "TOD_PHRF", sail_area_m2: 64.0, hull_length_m: 7.0, displacement_kg: 8000, draft_m: 1.80, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b1_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c1: $.data.id } }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b2}", rule_code: "TOD_PHRF", sail_area_m2: 64.0, hull_length_m: 8.0, displacement_kg: 8000, draft_m: 1.80, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b2_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c2: $.data.id } }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b3}", rule_code: "TOD_PHRF", sail_area_m2: 64.0, hull_length_m: 12.8, displacement_kg: 8000, draft_m: 1.80, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b3_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c3: $.data.id } }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b4}", rule_code: "TOD_PHRF", sail_area_m2: 64.0, hull_length_m: 13.6, displacement_kg: 8000, draft_m: 1.80, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b4_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c4: $.data.id } }
          assert:
            - "RatingCertificate.${c1}.raw_speed_index == 0.4 and rating_value == 268.0 (ratio 0.875 raised to the floor 1.00)"
            - "RatingCertificate.${c2}.raw_speed_index == 0.4 and rating_value == 268.0 (ratio exactly 1.00, the floor boundary)"
            - "RatingCertificate.${c3}.raw_speed_index == 0.64 and rating_value == 176.8 (ratio exactly 1.60, the ceiling boundary)"
            - "RatingCertificate.${c4}.raw_speed_index == 0.64 and rating_value == 176.8 (ratio 1.70 cut back to the ceiling 1.60)"
            - "the 0.8 m of extra hull between ${c3} and ${c4} buys exactly 0.0 spm, while the 4.8 m between ${c2} and ${c3} buys 91.2 spm"
            - "band_key_spm equals rating_value on all four rows because rule_code is TOD_PHRF"

      - name: staffing_readiness_ignores_partially_covering_and_proposed_windows
        claim_type: input_set_filtering
        grounds:
          - calculations.race_staffing_readiness
          - endpoints[GET /regatta-ops/races/{id}/staffing]
          - entities.DutyAssignment.fields.status
        distinguishing_aspect: |
          For a race scheduled 14:00 the coverage window is 13:30-16:00, and a duty contributes
          nothing unless it is CONFIRMED and fully covers that window: a CONFIRMED SIGNALS duty
          running 13:30-15:00 (flush at the start, two hours short at the end) and a PROPOSED
          SIGNALS duty covering 12:00-20:00 both leave staffed_position_codes at
          ["PRO", "TIMEKEEPER"], and confirming the second one is what flips staffing_ready to true.
        test_recipe:
          setup:
            - "A DRAFT regatta (CAT_4) and one DISTANCE_COASTAL race, 6.0 nm, scheduled 2026-08-05T14:00:00Z, so the required positions are PRO, TIMEKEEPER and SIGNALS only."
            - "CONFIRMED PRO and TIMEKEEPER duties spanning 12:00-20:00, a CONFIRMED SIGNALS duty spanning only 13:30-15:00, and a second SIGNALS duty spanning 12:00-20:00 left PROPOSED."
          setup_api_calls:
