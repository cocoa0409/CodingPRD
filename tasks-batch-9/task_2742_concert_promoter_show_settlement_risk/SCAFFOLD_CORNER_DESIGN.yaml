            - call: "POST /offers"
              payload: { show_id: "${cd_sh_1}", expected_show_version: "${cd_sh_1_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 1000001, deposit_cents: 0, expense_cap_cents: 500000 }
              as: TalentBuyer
              captures: { cd_of_1: $.data.id }
            - call: "POST /offers/${cd_of_1}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /offers/${cd_of_1}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${cd_ar_1}"
            - call: "POST /ticket-tiers"
              payload: { show_id: "${cd_sh_1}", tier_name: "GA", price_cents: 5000, allocation_qty: 200 }
              as: TalentBuyer
              captures: { cd_tt_1: $.data.id }
            - call: "POST /shows/${cd_sh_1}/on-sale"
              payload: {}
              as: TalentBuyer
            - call: "POST /ticket-tiers/${cd_tt_1}/sales"
              payload: { qty: 200 }
              as: TalentBuyer
            - call: "POST /budget-lines"
              payload: { show_id: "${cd_sh_1}", category: "PRODUCTION", description: "Un-invoiced backline", budgeted_cents: 100000, is_artist_deductible: false }
              as: TourAccountant
              captures: { cd_bl_1: $.data.id }
            # ---- show C2, payment_due exactly 1000000
            - call: "POST /shows"
              payload: { artist_id: "${cd_ar_2}", venue_id: "${cd_vn_id}", event_at: "2026-12-09T02:00:00.000Z", load_in_at: "2026-12-08T14:00:00.000Z", load_out_at: "2026-12-09T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
              captures: { cd_sh_2: $.data.id, cd_sh_2_v: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${cd_sh_2}", expected_show_version: "${cd_sh_2_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 1000000, deposit_cents: 0, expense_cap_cents: 500000 }
              as: TalentBuyer
              captures: { cd_of_2: $.data.id }
            - call: "POST /offers/${cd_of_2}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /offers/${cd_of_2}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${cd_ar_2}"
            - call: "POST /ticket-tiers"
              payload: { show_id: "${cd_sh_2}", tier_name: "GA", price_cents: 5000, allocation_qty: 200 }
              as: TalentBuyer
              captures: { cd_tt_2: $.data.id }
            - call: "POST /shows/${cd_sh_2}/on-sale"
              payload: {}
              as: TalentBuyer
            - call: "POST /ticket-tiers/${cd_tt_2}/sales"
              payload: { qty: 200 }
              as: TalentBuyer
            - call: "POST /budget-lines"
              payload: { show_id: "${cd_sh_2}", category: "PRODUCTION", description: "Un-invoiced backline", budgeted_cents: 100000, is_artist_deductible: false }
              as: TourAccountant
              captures: { cd_bl_2: $.data.id }
            # ---- show C3, for the deal-term fork
            - call: "POST /shows"
              payload: { artist_id: "${cd_ar_3}", venue_id: "${cd_vn_id}", event_at: "2026-12-16T02:00:00.000Z", load_in_at: "2026-12-15T14:00:00.000Z", load_out_at: "2026-12-16T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
              captures: { cd_sh_3: $.data.id, cd_sh_3_v: $.data.version }
            # ---- both shows performed and calculated
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-09T02:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /shows/${cd_sh_1}/perform"
              payload: {}
              as: TourAccountant
            - call: "POST /shows/${cd_sh_2}/perform"
              payload: {}
              as: TourAccountant
            - call: "POST /settlements"
              payload: { show_id: "${cd_sh_1}" }
              as: TourAccountant
              captures: { cd_st_1: $.data.id }
            - call: "POST /settlements/${cd_st_1}/calculate"
              payload: {}
              as: TourAccountant
              as_user_id: "u_cd_calc"
              captures: { cd_st_1_adj: $.data.adjusted_gross_cents, cd_st_1_expense: $.data.total_settlement_expense_cents, cd_st_1_allowed: $.data.allowed_expense_cents, cd_st_1_earnings: $.data.artist_earnings_cents, cd_st_1_due: $.data.payment_due_cents, cd_st_1_net: $.data.promoter_net_cents }
            - call: "POST /settlements/${cd_st_1}/artist-response"
              payload: { response: "ACCEPT" }
              as: ArtistRep
              as_user_id: "${cd_ar_1}"
              captures: { cd_st_1_signed: $.data.signed_by_user_id }
            - call: "POST /settlements"
              payload: { show_id: "${cd_sh_2}" }
              as: TourAccountant
              captures: { cd_st_2: $.data.id }
            - call: "POST /settlements/${cd_st_2}/calculate"
              payload: {}
              as: TourAccountant
              as_user_id: "u_cd_calc"
              captures: { cd_st_2_due: $.data.payment_due_cents, cd_st_2_net: $.data.promoter_net_cents }
            - call: "POST /settlements/${cd_st_2}/artist-response"
              payload: { response: "ACCEPT" }
              as: ArtistRep
              as_user_id: "${cd_ar_2}"
          trigger:
            # CASH is the only method the limit applies to
            - call: "POST /settlements/${cd_st_1}/pay"
              payload: { payment_method: "CASH", payment_reference: "CASH-BAG-01" }
              as: TourAccountant
              as_user_id: "u_cd_pay"
              captures: { cd_err_cash: $.data.error_id }
            - call: "GET /settlements/${cd_st_1}"
              payload: {}
              as: TourAccountant
              captures: { cd_st_1_status_mid: $.data.status, cd_st_1_paid_at_mid: $.data.paid_at }
            - call: "POST /settlements/${cd_st_1}/pay"
              payload: { payment_method: "WIRE", payment_reference: "WIRE-99001" }
              as: TourAccountant
              as_user_id: "u_cd_pay"
              captures: { cd_st_1_status_after: $.data.status, cd_st_1_method: $.data.payment_method }
            # exactly at the limit, in cash
            - call: "POST /settlements/${cd_st_2}/pay"
              payload: { payment_method: "CASH", payment_reference: "CASH-BAG-02" }
              as: TourAccountant
              as_user_id: "u_cd_pay"
              captures: { cd_st_2_status_after: $.data.status, cd_st_2_method: $.data.payment_method }
            # rule 25, branch FLAT_GUARANTEE: versus_pct is forbidden here
            - call: "POST /offers"
              payload: { show_id: "${cd_sh_3}", expected_show_version: "${cd_sh_3_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 400000, deposit_cents: 0, expense_cap_cents: 400000, versus_pct: 85.00 }
              as: TalentBuyer
              captures: { cd_err_flat_versus: $.data.error_id }
            # rule 25, branch VERSUS: versus_pct is required here
            - call: "POST /offers"
              payload: { show_id: "${cd_sh_3}", expected_show_version: "${cd_sh_3_v}", deal_structure: "VERSUS", guarantee_cents: 400000, deposit_cents: 0, expense_cap_cents: 400000 }
              as: TalentBuyer
              captures: { cd_err_versus_missing: $.data.error_id }
            # rule 25, structure-independent clause: deposit may not exceed the guarantee
            - call: "POST /offers"
              payload: { show_id: "${cd_sh_3}", expected_show_version: "${cd_sh_3_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 400000, deposit_cents: 500000, expense_cap_cents: 400000 }
              as: TalentBuyer
              captures: { cd_err_deposit: $.data.error_id }
            # the coherent VERSUS offer is accepted
            - call: "POST /offers"
              payload: { show_id: "${cd_sh_3}", expected_show_version: "${cd_sh_3_v}", deal_structure: "VERSUS", guarantee_cents: 400000, deposit_cents: 0, expense_cap_cents: 400000, versus_pct: 85.00 }
              as: TalentBuyer
              captures: { cd_of_3: $.data.id, cd_of_3_status: $.data.status, cd_of_3_versus: $.data.versus_pct, cd_of_3_backend: $.data.backend_split_artist_pct }
            - call: "GET /offers"
              payload: { show_id: "${cd_sh_3}" }
              as: TalentBuyer
          assert:
            - "FIXTURE ARITHMETIC — ${cd_st_1_adj} == 975000 (200 x 5000 = 1000000 gross, tax 0, facility 0, card ROUND_HALF_UP(1000000 * 2.5 / 100) = 25000), ${cd_st_1_expense} == 0 and ${cd_st_1_allowed} == 0 because the only line has no APPROVED invoice, so ${cd_st_1_earnings} == 1000001 == the FLAT guarantee and ${cd_st_1_due} == 1000001 - 0 - 0"
            - "CASH IS REFUSED BY ONE CENT — ${cd_err_cash} == ERR_CASH_PAYMENT_LIMIT with HTTP 422 because 1000001 > CASH_PAYMENT_LIMIT_CENTS 1000000"
            - "THE REFUSAL WRITES NOTHING — ${cd_st_1_status_mid} == ARTIST_SIGNED and ${cd_st_1_paid_at_mid} is null; the show is still PERFORMED, not SETTLED"
            - "THE SAME SETTLEMENT PAYS BY WIRE — ${cd_st_1_status_after} == PAID with ${cd_st_1_method} == WIRE: the limit is conditional on the method, not a property of the settlement; ${cd_st_1_signed} == ${cd_ar_1} differs from the paying u_cd_pay so priority 19 is satisfied"
            - "THE LIMIT IS INCLUSIVE — ${cd_st_2_due} == 1000000 exactly and ${cd_st_2_status_after} == PAID with ${cd_st_2_method} == CASH; the rule is payment_due_cents <= 1000000"
            - "PROMOTER NET GOES NEGATIVE WITHOUT BLOCKING PAYMENT — ${cd_st_1_net} == -25001 == 975000 - 1000001 - 0 - 0 and ${cd_st_2_net} == -25000; a loss-making settlement is still payable"
            - "FLAT FORBIDS VERSUS — ${cd_err_flat_versus} == ERR_DEAL_TERMS_INCOHERENT with HTTP 422: the field is well-formed and in range, so priority 3 is not what fired"
            - "VERSUS REQUIRES VERSUS — ${cd_err_versus_missing} == ERR_DEAL_TERMS_INCOHERENT with HTTP 422 for the mirror-image omission of the SAME field"
            - "THE DEPOSIT CLAUSE IS STRUCTURE-INDEPENDENT — ${cd_err_deposit} == ERR_DEAL_TERMS_INCOHERENT with HTTP 422 for deposit 500000 against guarantee 400000"
            - "THE COHERENT BRANCH PASSES — the last offer returns 201 with ${cd_of_3_status} == DRAFT, ${cd_of_3_versus} == 85.00 and ${cd_of_3_backend} null; GET /offers?show_id=${cd_sh_3} returns total_count 1, so none of the three refused offers was persisted"

      - name: existence_and_authorization_checks_run_before_state_and_amount_checks
        claim_type: Cascading validation
        grounds:
          - "validations[priority=2]"
          - "validations[priority=3]"
          - "validations[priority=7]"
          - "validations[priority=9]"
          - "validations[priority=11]"
          - "validations[priority=13]"
          - "validations[priority=16]"
        distinguishing_aspect: "Every probe violates TWO rules at once and the response must come from the earlier one, because the later check literally cannot be evaluated until the earlier one has passed: an amount check needs the row it is comparing against, a cross-reference check needs both rows to exist, and an OCC comparison needs a show to read a version from. The unauthorized probe is the one implementations most often get backwards — a malformed body sent by the wrong role must be 403, not 400, because authorization at priority 2 precedes well-formedness at priority 3."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z. One market, one artist, one venue, one PLANNED show SH with one PRODUCTION BudgetLine BL. Nothing else exists, so every id in the probes below that is not captured is guaranteed absent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
              payload: { name: "Cascade Market", region_code: "CS", guarantee_exposure_limit_cents: 5000000 }
              as: RiskOfficer
              captures: { cs_mk_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Cascade Act", agency: "Csc Talent", tier: "CLUB", historical_sellthrough_pct: 50.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { cs_ar_id: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${cs_mk_id}", name: "Cascade Hall", gross_capacity: 500, facility_fee_cents_per_ticket: 0, ticket_tax_pct: 0 }
              as: TalentBuyer
              captures: { cs_vn_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${cs_ar_id}", venue_id: "${cs_vn_id}", event_at: "2026-12-02T02:00:00.000Z", load_in_at: "2026-12-01T14:00:00.000Z", load_out_at: "2026-12-02T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
              captures: { cs_sh_id: $.data.id, cs_sh_v: $.data.version }
            - call: "POST /budget-lines"
              payload: { show_id: "${cs_sh_id}", category: "PRODUCTION", description: "Cascade line", budgeted_cents: 100000, is_artist_deductible: true }
              as: TourAccountant
              captures: { cs_bl_id: $.data.id }
            # bumps the show's version, so the ${cs_sh_v} captured above is now genuinely stale
            - call: "POST /shows/${cs_sh_id}/exposure-override"
              payload: { exposure_override_limit_cents: 10000000, exposure_override_justification: "Headroom for the cascade fixture" }
              as: RiskOfficer
              as_user_id: "u_cs_risk"
              captures: { cs_sh_v2: $.data.version }
          trigger:
            # 11 before 33: the inventory check needs a tier to read available_qty from
            - call: "POST /ticket-holds"
              payload: { ticket_tier_id: "00000000-0000-4000-8000-000000000011", kind: "PROMOTER_HOLD", qty: 999999, holder: "Nobody" }
              as: TalentBuyer
              captures: { cs_err_tier_404: $.data.error_id }
            # 7 before 20: the coherence check needs the show to compare the line against
            - call: "POST /vendor-invoices"
              payload: { show_id: "00000000-0000-4000-8000-000000000007", budget_line_id: "${cs_bl_id}", vendor_name: "Ghost Freight", amount_cents: 10000, invoice_date: "2026-08-01T00:00:00.000Z", documentation_ref: "PKT-CS-01" }
              as: TourAccountant
              captures: { cs_err_show_404: $.data.error_id }
            # 13 before 17: the state check needs a settlement to read a status from
            - call: "POST /settlements/00000000-0000-4000-8000-000000000013/calculate"
              payload: {}
              as: TourAccountant
              captures: { cs_err_settlement_404: $.data.error_id }
            # 9 before 35: the cap check needs a line to compare approved_cap_cents against
            - call: "POST /budget-lines/00000000-0000-4000-8000-000000000009/variance-decision"
              payload: { decision: "REJECT", approved_cap_cents: 1, variance_justification: "Should never be evaluated" }
              as: RiskOfficer
              captures: { cs_err_line_404: $.data.error_id }
            # 7 before 16: OCC has nothing to compare a version against
            - call: "POST /offers"
              payload: { show_id: "00000000-0000-4000-8000-000000000016", expected_show_version: "${cs_sh_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 400000, deposit_cents: 0, expense_cap_cents: 400000 }
              as: TalentBuyer
              captures: { cs_err_occ_404: $.data.error_id }
            # 2 before 3: the wrong role with a malformed body
            - call: "POST /markets"
              payload: { name: "Sneaky Market", region_code: "SN", guarantee_exposure_limit_cents: -500 }
              as: TalentBuyer
              captures: { cs_err_forbidden: $.data.error_id }
            # 3 before 5: a malformed body that also names a non-existent artist
            - call: "POST /shows"
              payload: { artist_id: "00000000-0000-4000-8000-000000000005", venue_id: "${cs_vn_id}", event_at: "not-a-timestamp", load_in_at: "2026-12-08T14:00:00.000Z", load_out_at: "2026-12-09T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
              captures: { cs_err_shape: $.data.error_id }
            - call: "GET /shows"
              payload: { venue_id: "${cs_vn_id}" }
              as: TalentBuyer
            - call: "GET /markets"
              payload: {}
              as: RiskOfficer
            - call: "GET /budget-lines/${cs_bl_id}"
              payload: {}
              as: TourAccountant
              captures: { cs_bl_status_after: $.data.variance_status, cs_bl_cap_after: $.data.approved_cap_cents }
          assert:
            - "EXISTENCE BEFORE AMOUNT — ${cs_err_tier_404} == ERR_TICKET_TIER_NOT_FOUND with HTTP 404, NOT ERR_INSUFFICIENT_TIER_INVENTORY 422, even though qty 999999 exceeds any conceivable inventory"
            - "EXISTENCE BEFORE CROSS-REFERENCE — ${cs_err_show_404} == ERR_SHOW_NOT_FOUND with HTTP 404, NOT ERR_BUDGET_LINE_SHOW_MISMATCH 422: priority 7 is evaluated before priority 20 and the line genuinely does belong to a different show"
            - "EXISTENCE BEFORE STATE — ${cs_err_settlement_404} == ERR_SETTLEMENT_NOT_FOUND with HTTP 404, NOT ERR_INVALID_STATE 409"
            - "EXISTENCE BEFORE CAP VALIDITY — ${cs_err_line_404} == ERR_BUDGET_LINE_NOT_FOUND with HTTP 404, NOT ERR_VARIANCE_CAP_INVALID 422, even though REJECT with approved_cap_cents present breaks rule 35 on its face"
            - "EXISTENCE BEFORE CONCURRENCY — ${cs_err_occ_404} == ERR_SHOW_NOT_FOUND with HTTP 404, NOT ERR_STALE_SHOW_VERSION 412: ${cs_sh_v} is a REAL version that the exposure-override has already superseded (${cs_sh_v2} == ${cs_sh_v} + 1), so the same body aimed at ${cs_sh_id} would be a 412 — but the show named here does not exist and priority 7 precedes priority 16"
            - "AUTHORIZATION BEFORE WELL-FORMEDNESS — ${cs_err_forbidden} == ERR_ROLE_FORBIDDEN with HTTP 403, NOT ERR_INVALID_REQUEST 400: POST /markets is RiskOfficer-only, so the negative guarantee_exposure_limit_cents is never inspected and the caller learns nothing about the payload"
            - "WELL-FORMEDNESS BEFORE EXISTENCE — ${cs_err_shape} == ERR_INVALID_REQUEST with HTTP 400, NOT ERR_ARTIST_NOT_FOUND 404: an unparseable event_at is rejected at priority 3 before any foreign key is resolved"
            - "NOTHING WAS WRITTEN — GET /shows?venue_id=${cs_vn_id} returns total_count 1, GET /markets returns total_count 1, and ${cs_bl_status_after} == WITHIN_TOLERANCE with ${cs_bl_cap_after} null"

  # ===========================================================================
  # SECTION 5 — endpoints
  # 63 endpoints in §1.5, of which 61 are domain endpoints and 2 are the /_
  # test-driving endpoints. The Bulk action row is SKIPPED: §1.5 declares no
  # endpoint that accepts a collection, so there are no partial-success or
  # rollback-or-skip semantics to test. Every other row is walked.
  # ===========================================================================
  - section: endpoints
    instances:
      - name: the_write_surface_is_create_plus_action_only_with_no_update_or_delete_verb
        claim_type: Standard CRUD
        grounds:
          - "endpoints[POST /venues]"
          - "endpoints[GET /venues/{venue_id}]"
          - "endpoints[GET /venues]"
          - "endpoints[GET /artists]"
        distinguishing_aspect: "Half of this row is a claim about what must NOT exist: §1.5 declares 61 domain endpoints and not one of them is a PUT, PATCH or DELETE, so Create and Read are the whole persistence surface and every mutation must travel through a declared action endpoint. An implementation that helpfully adds PATCH /shows/{show_id} would let a caller set show_status, committed_guarantee_cents or event_at directly, bypassing all 45 §1.4 rules, the §1.2 transition guards and the §1.7 cascades at once. The positive half proves creation is not an upsert: posting a byte-identical venue body twice yields two distinct rows, because no §1.4 rule makes venue identity unique."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z. One Market. Nothing else."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
              payload: { name: "Crud Market", region_code: "CR", guarantee_exposure_limit_cents: 5000000 }
              as: RiskOfficer
              captures: { cr_mk_id: $.data.id }
          trigger:
            - call: "POST /venues"
              payload: { market_id: "${cr_mk_id}", name: "Crud Amphitheatre", gross_capacity: 4200, facility_fee_cents_per_ticket: 275, ticket_tax_pct: 6.50 }
              as: TalentBuyer
              captures: { cr_vn_1: $.data.id, cr_vn_1_created: $.data.created_at, cr_vn_1_updated: $.data.updated_at, cr_vn_1_version: $.data.version }
            - call: "GET /venues/${cr_vn_1}"
              payload: {}
              as: VenueOperator
              as_user_id: "${cr_vn_1}"
              captures: { cr_vn_1_read_name: $.data.name, cr_vn_1_read_cap: $.data.gross_capacity, cr_vn_1_read_fee: $.data.facility_fee_cents_per_ticket, cr_vn_1_read_tax: $.data.ticket_tax_pct, cr_vn_1_read_market: $.data.market_id, cr_vn_1_read_version: $.data.version, cr_vn_1_read_updated: $.data.updated_at }
            # the identical body again - creation is not an upsert
            - call: "POST /venues"
              payload: { market_id: "${cr_mk_id}", name: "Crud Amphitheatre", gross_capacity: 4200, facility_fee_cents_per_ticket: 275, ticket_tax_pct: 6.50 }
              as: TalentBuyer
              captures: { cr_vn_2: $.data.id, cr_vn_2_version: $.data.version }
            - call: "GET /venues"
              payload: { market_id: "${cr_mk_id}", limit: 1, offset: 0 }
              as: TalentBuyer
            - call: "GET /venues"
              payload: { market_id: "${cr_mk_id}", limit: 1, offset: 1 }
              as: TalentBuyer
            - call: "POST /artists"
              payload: { name: "Crud Act Theatre", agency: "Crd Talent", tier: "THEATER", historical_sellthrough_pct: 64.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { cr_ar_1: $.data.id }
            - call: "POST /artists"
              payload: { name: "Crud Act Arena", agency: "Crd Talent", tier: "ARENA", historical_sellthrough_pct: 82.00, withholding_pct: 15.00 }
              as: TalentBuyer
              captures: { cr_ar_2: $.data.id }
            - call: "GET /artists"
              payload: { tier: "THEATER" }
              as: TourAccountant
            - call: "GET /artists/${cr_ar_2}"
              payload: {}
              as: ArtistRep
              as_user_id: "${cr_ar_2}"
              captures: { cr_ar_2_read_tier: $.data.tier, cr_ar_2_read_withholding: $.data.withholding_pct }
            - call: "GET /venues/00000000-0000-4000-8000-0000000000c0"
              payload: {}
              as: TalentBuyer
              captures: { cr_err_not_found: $.data.error_id }
          assert:
            - "CREATE ECHOES EVERY STORED FIELD — the first POST /venues returns 201 with ${cr_vn_1_version} == 1 and ${cr_vn_1_created} == ${cr_vn_1_updated} == 2026-08-01T00:00:00.000Z (the logical clock, not wall time)"
            - "READ IS A PURE READ — ${cr_vn_1_read_name} == Crud Amphitheatre, ${cr_vn_1_read_cap} == 4200, ${cr_vn_1_read_fee} == 275, ${cr_vn_1_read_tax} == 6.50, ${cr_vn_1_read_market} == ${cr_mk_id}, and ${cr_vn_1_read_version} == 1 with ${cr_vn_1_read_updated} == ${cr_vn_1_updated}: a GET never bumps version or updated_at"
            - "CREATE IS NOT AN UPSERT — ${cr_vn_2} != ${cr_vn_1} and ${cr_vn_2_version} == 1; the identical body produced a second row because no §1.4 rule makes (market_id, name) unique for Venue"
            - "LIST PAGINATES — GET /venues?market_id=${cr_mk_id}&limit=1&offset=0 returns total_count 2, has_more true and exactly 1 item; the same call at offset=1 returns total_count 2, has_more false and exactly 1 item, and the two ids are ${cr_vn_1} and ${cr_vn_2} with no overlap"
            - "LIST FILTERS — GET /artists?tier=THEATER returns total_count 1 containing ${cr_ar_1} only, while ${cr_ar_2_read_tier} == ARENA and ${cr_ar_2_read_withholding} == 15.00"
            - "READ OF AN ABSENT ROW — ${cr_err_not_found} == ERR_VENUE_NOT_FOUND with HTTP 404"
            - "NO UPDATE VERB EXISTS — §1.5 declares no PUT, PATCH or DELETE on any path; Venue, Artist and Market have no mutating endpoint at all, and every other entity changes only through a declared POST action. A PATCH or DELETE that answers with anything other than 404/405 is a scaffold violation, because it would bypass §1.4 entirely"

      - name: action_endpoints_move_the_row_and_refuse_when_their_precondition_fails
        claim_type: Action endpoint
        grounds:
          - "endpoints[POST /offers/{offer_id}/withdraw]"
          - "endpoints[POST /settlements/{settlement_id}/reopen]"
          - "state_machines.Offer[SUBMITTED->WITHDRAWN]"
          - "state_machines.Settlement[CALCULATED->REOPENED]"
          - "state_machines.Settlement[ARTIST_SIGNED->REOPENED]"
        distinguishing_aspect: "Two action endpoints whose whole contract is a guarded status move plus a bookkeeping side effect, driven through both of their entry states and both of their refusal modes. Reopen is the interesting one: it is reachable from CALCULATED and from ARTIST_SIGNED, it must NULL the artist signature when it comes from ARTIST_SIGNED (an implementation that only flips the status leaves a signed-off settlement that nobody signed), reopen_count must accumulate across both reopens rather than reset, and the same X-User-ID that calculated the settlement may not reopen it. Withdraw proves the negative side of the ledger: withdrawing a SUBMITTED offer that never booked exposure must leave market.committed_guarantee_cents untouched, and an ACCEPTED offer cannot be withdrawn at all."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z. Market Act Market limit 5000000, Venue Act Hall cap 500 / facility 0 / tax 0, Artists AC1 and AC2 with withholding_pct 0."
            - "Show E1: ON_SALE on an accepted FLAT_GUARANTEE offer of 100000 (deposit 0, cap 100000), GA 5000 x 100 with 50 sold, one deductible PRODUCTION line budgeted 50000 whose 50000 invoice is APPROVED (variance_pct 0.00, WITHIN_TOLERANCE, settlement_expense 50000)."
            - "Show E2: PLANNED with one SUBMITTED offer of 200000 — never accepted, so it books no exposure."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
              payload: { name: "Act Market", region_code: "AC", guarantee_exposure_limit_cents: 5000000 }
              as: RiskOfficer
              captures: { ac_mk_id: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${ac_mk_id}", name: "Act Hall", gross_capacity: 500, facility_fee_cents_per_ticket: 0, ticket_tax_pct: 0 }
              as: TalentBuyer
              captures: { ac_vn_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Act One", agency: "Act Talent", tier: "CLUB", historical_sellthrough_pct: 58.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { ac_ar_1: $.data.id }
            - call: "POST /artists"
              payload: { name: "Act Two", agency: "Act Talent", tier: "CLUB", historical_sellthrough_pct: 58.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { ac_ar_2: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${ac_ar_1}", venue_id: "${ac_vn_id}", event_at: "2026-12-02T02:00:00.000Z", load_in_at: "2026-12-01T14:00:00.000Z", load_out_at: "2026-12-02T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
              captures: { ac_sh_1: $.data.id, ac_sh_1_v: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${ac_sh_1}", expected_show_version: "${ac_sh_1_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 100000, deposit_cents: 0, expense_cap_cents: 100000 }
              as: TalentBuyer
              captures: { ac_of_1: $.data.id }
            - call: "POST /offers/${ac_of_1}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /offers/${ac_of_1}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${ac_ar_1}"
            - call: "POST /ticket-tiers"
              payload: { show_id: "${ac_sh_1}", tier_name: "GA", price_cents: 5000, allocation_qty: 100 }
              as: TalentBuyer
              captures: { ac_tt_1: $.data.id }
            - call: "POST /shows/${ac_sh_1}/on-sale"
              payload: {}
              as: TalentBuyer
            - call: "POST /ticket-tiers/${ac_tt_1}/sales"
              payload: { qty: 50 }
              as: TalentBuyer
            - call: "POST /budget-lines"
              payload: { show_id: "${ac_sh_1}", category: "PRODUCTION", description: "Backline rental", budgeted_cents: 50000, is_artist_deductible: true }
              as: TourAccountant
              captures: { ac_bl_1: $.data.id }
            - call: "POST /vendor-invoices"
              payload: { show_id: "${ac_sh_1}", budget_line_id: "${ac_bl_1}", vendor_name: "Act Backline", amount_cents: 50000, invoice_date: "2026-08-02T00:00:00.000Z", documentation_ref: "PKT-AC-01" }
              as: TourAccountant
              captures: { ac_vi_1: $.data.id }
            - call: "POST /vendor-invoices/${ac_vi_1}/verify"
              payload: {}
              as: TourAccountant
              as_user_id: "u_ac_verify"
            - call: "POST /vendor-invoices/${ac_vi_1}/approve"
              payload: {}
              as: TourAccountant
              as_user_id: "u_ac_approve"
            - call: "POST /shows"
              payload: { artist_id: "${ac_ar_2}", venue_id: "${ac_vn_id}", event_at: "2026-12-09T02:00:00.000Z", load_in_at: "2026-12-08T14:00:00.000Z", load_out_at: "2026-12-09T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
              captures: { ac_sh_2: $.data.id, ac_sh_2_v: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${ac_sh_2}", expected_show_version: "${ac_sh_2_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 200000, deposit_cents: 0, expense_cap_cents: 200000 }
              as: TalentBuyer
              captures: { ac_of_2: $.data.id }
            - call: "POST /offers/${ac_of_2}/submit"
              payload: {}
              as: TalentBuyer
              captures: { ac_of_2_version_before: $.data.version }
            - call: "GET /markets/${ac_mk_id}"
              payload: {}
              as: RiskOfficer
              captures: { ac_committed_before: $.data.committed_guarantee_cents }
          trigger:
            # withdraw from SUBMITTED - the declared happy path
            - call: "POST /offers/${ac_of_2}/withdraw"
              payload: { reason: "Artist took a competing offer in the market" }
              as: TalentBuyer
              captures: { ac_of_2_status: $.data.status, ac_of_2_version_after: $.data.version }
            - call: "GET /markets/${ac_mk_id}"
              payload: {}
              as: RiskOfficer
              captures: { ac_committed_after: $.data.committed_guarantee_cents, ac_posture_after: $.data.risk_posture }
            - call: "GET /shows/${ac_sh_2}"
              payload: {}
              as: TalentBuyer
              captures: { ac_sh_2_status_after: $.data.show_status, ac_sh_2_committed: $.data.committed_guarantee_cents }
            # withdraw an ACCEPTED offer - not a declared edge
            - call: "POST /offers/${ac_of_1}/withdraw"
              payload: { reason: "Buyer regret" }
              as: TalentBuyer
              captures: { ac_err_withdraw: $.data.error_id }
            # reopen: first from CALCULATED
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-02T02:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /shows/${ac_sh_1}/perform"
              payload: {}
              as: TourAccountant
            - call: "POST /settlements"
              payload: { show_id: "${ac_sh_1}" }
              as: TourAccountant
              captures: { ac_st_1: $.data.id, ac_st_1_reopens_0: $.data.reopen_count }
            - call: "POST /settlements/${ac_st_1}/calculate"
              payload: {}
              as: TourAccountant
              as_user_id: "u_ac_calc"
              captures: { ac_st_1_status_calc: $.data.status, ac_st_1_calc_by: $.data.calculated_by_user_id, ac_st_1_adj: $.data.adjusted_gross_cents, ac_st_1_allowed: $.data.allowed_expense_cents, ac_st_1_due: $.data.payment_due_cents, ac_st_1_net: $.data.promoter_net_cents }
            # segregation of duties: the calculating user may not reopen
            - call: "POST /settlements/${ac_st_1}/reopen"
              payload: { reopen_reason: "Recheck the production ledger" }
              as: RiskOfficer
              as_user_id: "u_ac_calc"
              captures: { ac_err_sod: $.data.error_id }
            - call: "POST /settlements/${ac_st_1}/reopen"
              payload: { reopen_reason: "Recheck the production ledger" }
              as: RiskOfficer
              as_user_id: "u_ac_risk"
              captures: { ac_st_1_status_reopen_1: $.data.status, ac_st_1_reopens_1: $.data.reopen_count }
            # REOPENED is not an entry state for reopen
            - call: "POST /settlements/${ac_st_1}/reopen"
              payload: { reopen_reason: "Again" }
              as: RiskOfficer
              as_user_id: "u_ac_risk"
              captures: { ac_err_reopen_state: $.data.error_id }
            # back around the cycle, then reopen from ARTIST_SIGNED
            - call: "POST /settlements/${ac_st_1}/calculate"
              payload: {}
              as: TourAccountant
              as_user_id: "u_ac_calc"
              captures: { ac_st_1_status_calc_2: $.data.status }
            - call: "POST /settlements/${ac_st_1}/artist-response"
              payload: { response: "ACCEPT" }
              as: ArtistRep
              as_user_id: "${ac_ar_1}"
              captures: { ac_st_1_status_signed: $.data.status, ac_st_1_signed_by: $.data.signed_by_user_id }
            - call: "POST /settlements/${ac_st_1}/reopen"
              payload: { reopen_reason: "Artist disputes the backline charge after signing" }
              as: RiskOfficer
              as_user_id: "u_ac_risk"
              captures: { ac_st_1_status_reopen_2: $.data.status, ac_st_1_reopens_2: $.data.reopen_count, ac_st_1_signed_after: $.data.signed_by_user_id }
            - call: "GET /shows/${ac_sh_1}"
              payload: {}
              as: TourAccountant
              captures: { ac_sh_1_status_after: $.data.show_status }
          assert:
            - "WITHDRAW MOVES THE ROW — ${ac_of_2_status} == WITHDRAWN and ${ac_of_2_version_after} == ${ac_of_2_version_before} + 1; the endpoint's only other declared side effect is that version bump"
            - "WITHDRAWING AN UNACCEPTED OFFER TOUCHES NO LEDGER — ${ac_committed_after} == ${ac_committed_before} == 100000 (show E1's guarantee only), ${ac_posture_after} == OPEN, and ${ac_sh_2_status_after} == PLANNED with ${ac_sh_2_committed} == 0: a SUBMITTED offer never booked exposure, so withdrawing it cannot unbook any"
            - "ACCEPTED IS NOT A WITHDRAW ENTRY STATE — ${ac_err_withdraw} == ERR_INVALID_STATE with HTTP 409 (the declared entry set is {DRAFT, SUBMITTED, COUNTERED}) and offer ${ac_of_1} is still ACCEPTED"
            - "SETTLEMENT FIXTURE — ${ac_st_1_status_calc} == CALCULATED with ${ac_st_1_calc_by} == u_ac_calc, ${ac_st_1_adj} == 243750 (250000 gross less the 6250 card fee), ${ac_st_1_allowed} == 50000 == MIN(50000 recognised, 100000 cap), ${ac_st_1_due} == 100000 == the FLAT guarantee and ${ac_st_1_net} == 93750 == 243750 - 100000 - 50000 - 0"
            - "SEGREGATION ON REOPEN — ${ac_err_sod} == ERR_SEGREGATION_OF_DUTIES with HTTP 403 for the u_ac_calc reopen, and the settlement is still CALCULATED with reopen_count still ${ac_st_1_reopens_0} == 0"
            - "REOPEN FROM CALCULATED — ${ac_st_1_status_reopen_1} == REOPENED with ${ac_st_1_reopens_1} == 1"
            - "REOPENED IS NOT AN ENTRY STATE — ${ac_err_reopen_state} == ERR_INVALID_STATE with HTTP 409 and ${ac_st_1_reopens_1} is unchanged at 1: a refused action never increments the counter"
            - "REOPEN FROM ARTIST_SIGNED VOIDS THE SIGNATURE — after ${ac_st_1_status_calc_2} == CALCULATED and ${ac_st_1_status_signed} == ARTIST_SIGNED with ${ac_st_1_signed_by} == ${ac_ar_1}, the second reopen gives ${ac_st_1_status_reopen_2} == REOPENED, ${ac_st_1_reopens_2} == 2 (accumulated, not reset) and ${ac_st_1_signed_after} == null"
            - "NEITHER ACTION TOUCHED THE SHOW — ${ac_sh_1_status_after} == PERFORMED throughout; only a PAID settlement moves a show to SETTLED, and no payment was made"

      - name: cross_reference_links_require_both_rows_and_are_readable_from_either_side
        claim_type: Cross-reference link
        grounds:
          - "endpoints[POST /vendor-invoices]"
          - "endpoints[POST /cancellation-events/{cancellation_event_id}/reschedule]"
          - "endpoints[GET /shows]"
          - "endpoints[GET /cancellation-events]"
          - "entities.Show[rescheduled_from_show_id]"
          - "entities.CancellationEvent[replacement_show_id]"
