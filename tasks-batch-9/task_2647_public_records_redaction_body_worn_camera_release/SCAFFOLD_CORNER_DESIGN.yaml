      - name: purge_is_refused_before_due_then_locks_the_asset_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.VideoAsset.transitions.SCHEDULED->PURGED
          - state_machines.VideoAsset.terminal_states
          - validations.priority_29
          - errors.ERR_PURGE_NOT_DUE
          - errors.ERR_ASSET_STATE_INVALID
          - "endpoints.POST /records/video-assets/{id}/purge"
        distinguishing_aspect: |
          One recording exercises both ends of the retention edge from the same row:
          at 2026-08-31T23:59:59Z the purge is refused with ERR_PURGE_NOT_DUE, at
          exactly 2026-09-01T00:00:00Z it succeeds, and the third call — against the
          now-terminal PURGED row — is ERR_ASSET_STATE_INVALID, not a second success.
        test_recipe:
          setup:
            - "One NON_EVIDENTIARY_180D recording with scheduled_purge_at 2026-09-01T00:00:00Z and no ResponsiveRecord and no LitigationHold, so retention_locked is false."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-31T23:59:59Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/video-assets", payload: { incident_number: "INC-2026-0617", device_serial: "AXON-0617", officer_badge: "B-1117", recorded_start_at: "2026-03-05T09:00:00Z", duration_ms: 600000, classification: "ROUTINE", retention_category: "NON_EVIDENTIARY_180D", scheduled_purge_at: "2026-09-01T00:00:00Z" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { asset_id: $.data.id } }
          trigger:
            - { call: "POST /records/video-assets/${asset_id}/purge", payload: { destruction_note: "One second early" }, as: RecordsSupervisor, as_user_id: "supv-1", captures: { e_early: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/video-assets/${asset_id}/purge", payload: { destruction_note: "Retention schedule executed" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/video-assets/${asset_id}/purge", payload: { destruction_note: "Second attempt" }, as: RecordsSupervisor, as_user_id: "supv-1", captures: { e_terminal: $.data.error_id } }
          assert:
            - "first response: HTTP 409 and ${e_early} == ERR_PURGE_NOT_DUE, with VideoAsset.${asset_id}.disposition_state still SCHEDULED"
            - "third response: HTTP 200 and VideoAsset.${asset_id}.disposition_state == PURGED (the comparison is clock >= scheduled_purge_at, so the boundary instant itself is due)"
            - "fourth response: HTTP 409 and ${e_terminal} == ERR_ASSET_STATE_INVALID"
            - "VideoAsset.${asset_id}.disposition_state == PURGED and retention_locked == false and suspended_by_hold_id == null"
