      - name: corner_endophthalmitis_inside_the_window_is_reportable_on_the_routine_clock
        claim_type: correct_result
        grounds:
          - calculations.adverse_event_reportability
          - entities.AdverseEvent.fda_report_due_date
        distinguishing_aspect: "An ENDOPHTHALMITIS event 20 days after the injection is reportable through the event-type arm alone (severity MODERATE, culture PENDING), and because it is not SEVERE the due date uses ROUTINE_REPORT_DAYS: onset 2026-08-21T09:00 + 30 days == 2026-09-20T09:00:00Z, measured from onset rather than from the encounter or the clock."
        test_recipe:
          setup:
            - "the corner prologue with encounter ENC-NP DOCUMENTED at 2026-08-01T09:00:00Z"
            - "logical clock advanced to 2026-08-21T00:00:00Z"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_pt_np
            - *k_cl1
            - *k_cl2
            - *k_lot
            - *k_img_np
            - *k_plan_np
            - *k_plan_np_act
            - *k_enc_np
            - *k_enc_np_doc
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-21T00:00:00Z" }
              as: PracticeAdmin
          trigger:
            - call: "POST /adverse-events"
              payload: { injection_encounter_id: "${k_enc_np_id}", event_type: "ENDOPHTHALMITIS", onset_datetime: "2026-08-21T09:00:00Z", severity: "MODERATE", culture_result: "PENDING" }
              as: RetinaSpecialist
              as_user_id: "${k_cl2_id}"
              captures: { k_ae_r_id: $.data.id, k_ae_r_days: $.data.days_post_injection, k_ae_r_flag: $.data.reportable, k_ae_r_due: $.data.fda_report_due_date, k_ae_r_status: $.data.status }
          assert:
            - "${k_ae_r_days} == 20 and ${k_ae_r_flag} == true"
            - "${k_ae_r_due} == \"2026-09-20T09:00:00Z\""
            - "${k_ae_r_status} == REPORTED"
            - "AdverseEvent.${k_ae_r_id}.source_drug_lot_id == ${k_lot_id} and patient_id == ${k_pt_np_id}"
            - "AdverseEvent.${k_ae_r_id}.reported_by_clinician_id == ${k_cl2_id}"

      - name: corner_endophthalmitis_one_day_outside_the_window_is_not_reportable
        claim_type: threshold_boundary
        grounds:
          - calculations.adverse_event_reportability.constants.ENDOPHTHALMITIS_WINDOW_DAYS
          - entities.AdverseEvent.reportable
        distinguishing_aspect: "days_post_injection floors the elapsed time: an onset 31 days and one hour after the injection floors to 31, which fails the <= 30 window, and with severity MILD and a NEGATIVE culture no other arm fires — so reportable is false and fda_report_due_date is null rather than onset + 30 days."
        test_recipe:
          setup:
            - "the corner prologue with encounter ENC-NP DOCUMENTED at 2026-08-01T09:00:00Z"
            - "logical clock advanced to 2026-09-01T00:00:00Z"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_pt_np
            - *k_cl1
            - *k_cl2
            - *k_lot
            - *k_img_np
            - *k_plan_np
            - *k_plan_np_act
            - *k_enc_np
            - *k_enc_np_doc
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PracticeAdmin
          trigger:
            - call: "POST /adverse-events"
              payload: { injection_encounter_id: "${k_enc_np_id}", event_type: "ENDOPHTHALMITIS", onset_datetime: "2026-09-01T10:00:00Z", severity: "MILD", culture_result: "NEGATIVE" }
              as: RetinaSpecialist
              as_user_id: "${k_cl2_id}"
              captures: { k_ae_n_id: $.data.id, k_ae_n_days: $.data.days_post_injection, k_ae_n_flag: $.data.reportable, k_ae_n_due: $.data.fda_report_due_date }
          assert:
            - "${k_ae_n_days} == 31 (31 days and one hour, floored)"
            - "${k_ae_n_flag} == false and ${k_ae_n_due} == null"
            - "AdverseEvent.${k_ae_n_id}.status == REPORTED — the workflow state is independent of FDA reportability"

      - name: corner_recall_notification_deadline_follows_the_recall_class_table
        claim_type: constants_applied
        grounds:
          - calculations.recall_notification_plan
          - entities.LotRecall.notification_deadline_date
        distinguishing_aspect: "The deadline is the clock plus the class table (CLASS_I 3, CLASS_II 10, CLASS_III 30 days), not the recall's own updated_at: a CLASS_I recall opened at the 2026-08-01 clock is due 2026-08-04 and a CLASS_II recall on a second lot the same day is due 2026-08-11. With no dispensed encounter on either lot, notifications_required is 0 and no RecallNotification row is created."
        test_recipe:
          setup:
            - "the corner prologue with lot RX-9001 (5 vials) and a second lot RX-9002 (2 vials), neither ever dispensed"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_lot
            - call: "POST /drug-lots"
              payload: { drug_id: "${k_drug_ref_id}", lot_number: "RX-9002", expiration_date: "2027-07-31T00:00:00Z", received_date: "2026-07-05T00:00:00Z", unit_acquisition_cost_cents: 131000, vials_received: 2 }
              as: PharmacyTech
              captures: { k_lot_b_id: $.data.id }
          trigger:
            - call: "POST /lot-recalls"
              payload: { drug_lot_id: "${k_lot_id}", recall_class: "CLASS_I", reason: "Sterility failure in the filling line" }
              as: ComplianceOfficer
              captures: { k_rec_i_id: $.data.id, k_rec_i_due: $.data.notification_deadline_date, k_rec_i_req: $.data.notifications_required }
            - call: "POST /lot-recalls"
              payload: { drug_lot_id: "${k_lot_b_id}", recall_class: "CLASS_II", reason: "Carton mislabelling" }
              as: ComplianceOfficer
              captures: { k_rec_ii_id: $.data.id, k_rec_ii_due: $.data.notification_deadline_date, k_rec_ii_req: $.data.notifications_required }
          assert:
            - "${k_rec_i_due} == \"2026-08-04T00:00:00Z\" and ${k_rec_ii_due} == \"2026-08-11T00:00:00Z\""
            - "${k_rec_i_req} == 0 and ${k_rec_ii_req} == 0"
            - "GET /recall-notifications?lot_recall_id=${k_rec_i_id} returns total_count == 0"
            - "DrugLot.${k_lot_id}.status == RECALLED with vials_quarantined == 5, and DrugLot.${k_lot_b_id}.vials_quarantined == 2"

  - section: validations
    instances:

      - name: corner_auth_layer_rejects_missing_headers_unknown_roles_and_wrong_roles_in_priority_order
        claim_type: priority_ordering
        grounds:
          - validations.priority_1
          - validations.priority_2
          - validations.priority_3
          - validations.priority_4
        distinguishing_aspect: "The four auth checks fire in their declared order on the same endpoint: absent headers give 401 ERR_MISSING_AUTH_HEADERS even when the body is also invalid, an unlisted role name gives 401 ERR_UNKNOWN_ROLE before any endpoint-permission test, a valid-but-unpermitted role gives 403 ERR_ROLE_NOT_PERMITTED, and a permitted RetinaSpecialist whose X-User-ID resolves to no Clinician gives 403 ERR_ACTING_IDENTITY_NOT_FOUND."
        test_recipe:
          setup:
            - "the corner prologue with payer PAY-COMM and clinician CL1 on file"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pt_np
            - *k_cl1
          trigger:
            - call: "POST /payers"
              payload: { name: "", payer_type: "NOT_A_TYPE", coinsurance_rate: 9.5 }
              as: PracticeAdmin
              omit_headers: ["X-User-Role", "X-User-ID"]
              captures: { k_auth_e1: $.data.error_id }
            - call: "POST /payers"
              payload: { name: "Anywhere Health", payer_type: "COMMERCIAL", coinsurance_rate: 0.2 }
              as: Concierge
              captures: { k_auth_e2: $.data.error_id }
            - call: "POST /payers"
              payload: { name: "Anywhere Health", payer_type: "COMMERCIAL", coinsurance_rate: 0.2 }
              as: PharmacyTech
              captures: { k_auth_e3: $.data.error_id }
            - call: "POST /imaging-studies"
              payload: { patient_id: "${k_pt_np_id}", eye: "OD", study_datetime: "2026-08-01T00:00:00Z", central_subfield_thickness_um: 400, intraretinal_fluid: true, subretinal_fluid: false, new_hemorrhage: false, va_letter_score: 60 }
              as: RetinaSpecialist
              as_user_id: "11111111-1111-4111-8111-111111111111"
              captures: { k_auth_e4: $.data.error_id }
          assert:
            - "${k_auth_e1} == \"ERR_MISSING_AUTH_HEADERS\" with HTTP 401 — priority 1 outranks the priority-5 body validation that the same request also fails"
            - "${k_auth_e2} == \"ERR_UNKNOWN_ROLE\" with HTTP 401"
            - "${k_auth_e3} == \"ERR_ROLE_NOT_PERMITTED\" with HTTP 403"
            - "${k_auth_e4} == \"ERR_ACTING_IDENTITY_NOT_FOUND\" with HTTP 403"
            - "no Payer named \"Anywhere Health\" and no ImagingStudy row is created by any of the four calls"

      - name: corner_every_path_id_family_returns_its_own_not_found
        claim_type: violation_to_error
        grounds:
          - validations.priority_6
          - errors[ERR_PAYER_NOT_FOUND]
          - errors[ERR_NOTIFICATION_NOT_FOUND]
        distinguishing_aspect: "Priority 6 resolves path ids against the addressed entity, so each of the sixteen id families returns its OWN 404 error_id rather than a shared ERR_NOT_FOUND: a syntactically valid but unknown UUID on each GET-by-id endpoint is answered by the matching ERR_*_NOT_FOUND."
        test_recipe:
          setup:
            - "an empty database beyond the clock (no row can accidentally match the probe UUIDs)"
          setup_api_calls:
            - *k_clk
          trigger:
            - call: "GET /payers/aaaaaaaa-0000-4000-8000-000000000001"
              as: PracticeAdmin
              captures: { k_nf_payer: $.data.error_id }
            - call: "GET /drugs/aaaaaaaa-0000-4000-8000-000000000002"
              as: PracticeAdmin
              captures: { k_nf_drug: $.data.error_id }
            - call: "GET /payer-drug-policies/aaaaaaaa-0000-4000-8000-000000000003"
