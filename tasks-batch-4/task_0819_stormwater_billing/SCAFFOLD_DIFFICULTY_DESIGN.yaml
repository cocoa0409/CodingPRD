scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fee_marginal_vs_flat_diverge_on_bill
        grounds:
          - calculations.stormwater_fee
          - entities.StormwaterBill.fields.net_fee_cents
          - entities.StormwaterBill.fields.fee_variant
        distinguishing_aspect: >
          On the StormwaterBill/Parcel billing domain, the same eru=6.0 parcel billed MARGINAL
          yields net_fee_cents==21500 while billed FLAT yields net_fee_cents==18500 (delta 3000).
        test_recipe:
          setup:
            - "Account + parcel with an ACTIVE 18000 sqft measurement (eru 6.0), no credit, no exemption."
            - "Two non-overlapping billing periods."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Acme", contact_email: "a@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-DV1", land_use: "COMMERCIAL" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 18000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
          trigger:
            - call: "POST /bills"
              payload: { parcel_id: "${parcel}", account_id: "${acct}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", due_date: "2026-04-30T00:00:00Z", fee_variant: "MARGINAL" }
              as: BillingClerk
              captures: { bill_m: $.data.id }
            - call: "POST /bills"
              payload: { parcel_id: "${parcel}", account_id: "${acct}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", due_date: "2026-07-31T00:00:00Z", fee_variant: "FLAT" }
              as: BillingClerk
              captures: { bill_f: $.data.id }
          assert:
            - "StormwaterBill.${bill_m}.base_fee_cents == 21000"
            - "StormwaterBill.${bill_m}.net_fee_cents == 21500"
            - "StormwaterBill.${bill_f}.base_fee_cents == 18000"
            - "StormwaterBill.${bill_f}.net_fee_cents == 18500"

      - name: credit_provisional_vs_inspected_diverge_on_bmpcredit
        grounds:
          - calculations.bmp_credit_amount
          - entities.BMPCredit.fields.credit_pct
          - entities.BMPCredit.fields.inspected_score
          - state_machines.CreditInspection.SCHEDULED_to_COMPLETED
        distinguishing_aspect: >
          On the BMPCredit domain (distinct from the Parcel/Bill fee domain), the same credit's
          credit_pct is 0.50 provisional (self_reported_score 90) and 0.42 inspected (observed_score 70).
        test_recipe:
          setup:
            - "Account + parcel (eru 6.0). One ACTIVE BMPCredit self_reported_score=90 (provisional credit_pct 0.50)."
            - "A SCHEDULED inspection for that credit."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Acme", contact_email: "a@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-DV2", land_use: "COMMERCIAL" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 18000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
            - call: "POST /bmp-credits"
              payload: { parcel_id: "${parcel}", bmp_type: "RAIN_GARDEN", self_reported_score: 90, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: Assessor
              captures: { credit: $.data.id }
            - call: "POST /credit-inspections"
              payload: { bmp_credit_id: "${credit}", scheduled_date: "2026-02-01T00:00:00Z" }
              as: CreditInspector
              captures: { insp: $.data.id }
          trigger:
            - call: "POST /credit-inspections/${insp}/complete"
              payload: { result: "PASS", observed_score: 70 }
              as: CreditInspector
          assert:
            - "before trigger: BMPCredit.${credit}.credit_pct == 0.50"
            - "after trigger: BMPCredit.${credit}.inspected_score == 70"
            - "after trigger: BMPCredit.${credit}.credit_pct == 0.42"
            - "BMPCredit.${credit}.status == ACTIVE"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_fee_three_band_marginal_mode_a
        grounds:
          - calculations.stormwater_fee
          - entities.Parcel.fields.billable_eru
        distinguishing_aspect: >
          Mode (a): a >=3-input non-linear formula — eru 6.0 spans all three tier bands and
          base_fee_marginal_cents = round(1.0*4000 + 4.0*3500 + 1.0*3000) = 21000 via nested min/max band selection.
        test_recipe:
          setup:
            - "Account + parcel with ACTIVE 18000 sqft measurement (eru 6.0), no credit, no exemption."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Acme", contact_email: "a@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-CF1", land_use: "INDUSTRIAL" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 18000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
          trigger:
            - call: "GET /parcels/${parcel}/fee-quote"
              payload: {}
              as: BillingClerk
              captures: { eru: $.data.billable_eru, bm: $.data.base_fee_marginal_cents }
          assert:
            - "fee-quote billable_eru == 6.0"
            - "fee-quote base_fee_marginal_cents == 21000"
            - "fee-quote marginal_assessed_cents == 21500"

      - name: fund_allocation_capital_round_then_subtract_mode_b
        grounds:
          - calculations.fund_allocation
          - entities.FundLedgerEntry.fields.amount_cents
          - entities.FundLedgerEntry.fields.fund
        distinguishing_aspect: >
          Mode (b): pinned rounding order — capital_share = round_half_up(0.30*5)=2, operating = 5-2 = 3.
          Rounding the operating share instead would give 4/1, so the pinned order is observable at 5 cents.
        test_recipe:
          setup:
            - "Account + parcel (eru 2.0, 6000 sqft) with an ISSUED bill (assessed 8000)."
            - "A partial 5-cent payment applied to it."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Acme", contact_email: "a@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-CF2", land_use: "RESIDENTIAL_MF" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 6000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
            - call: "POST /bills"
              payload: { parcel_id: "${parcel}", account_id: "${acct}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", due_date: "2026-04-30T00:00:00Z" }
              as: BillingClerk
              captures: { bill: $.data.id }
          trigger:
            - call: "POST /payments"
              payload: { bill_id: "${bill}", account_id: "${acct}", amount_cents: 5, method: "ACH" }
              as: BillingClerk
              captures: { pay: $.data.id }
          assert:
            - "the CAPITAL FundLedgerEntry with source_payment_id==${pay} and entry_type==ALLOCATION has amount_cents == 2"
            - "the OPERATING FundLedgerEntry with source_payment_id==${pay} and entry_type==ALLOCATION has amount_cents == 3"
            - "StormwaterBill.${bill}.status == PARTIALLY_PAID"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: appeal_needs_remeasure_review_cycle
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_NEEDS_REMEASURE
          - state_machines.Appeal.NEEDS_REMEASURE_to_UNDER_REVIEW
          - entities.Appeal.fields.status
        distinguishing_aspect: >
          Appeal exercises a cycle: UNDER_REVIEW -> NEEDS_REMEASURE -> (APPEAL_REMEASURE measurement) -> UNDER_REVIEW,
          returning to a state it already visited — not a linear pipeline.
        test_recipe:
          setup:
            - "Account + parcel (ACTIVE, eru 6.0). A MEASUREMENT_ERROR appeal moved to UNDER_REVIEW then NEEDS_REMEASURE."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Acme", contact_email: "a@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-SM1", land_use: "COMMERCIAL" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 18000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
            - call: "GET /parcels/${parcel}"
              payload: {}
              as: Assessor
              captures: { pv1: $.data.version }
            - call: "POST /appeals"
              payload: { parcel_id: "${parcel}", account_id: "${acct}", grounds: "MEASUREMENT_ERROR", narrative: "over-measured" }
              as: StormwaterAdmin
              captures: { appeal: $.data.id }
            - call: "POST /appeals/${appeal}/review"
              payload: {}
              as: StormwaterAdmin
            - call: "POST /appeals/${appeal}/remeasure"
              payload: {}
              as: StormwaterAdmin
          trigger:
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 12000, method: "FIELD_SURVEY", source: "APPEAL_REMEASURE", expected_parcel_version: "${pv1}" }
              as: Assessor
          assert:
            - "before trigger: Appeal.${appeal}.status == NEEDS_REMEASURE"
            - "after trigger: Appeal.${appeal}.status == UNDER_REVIEW"
            - "Parcel.${parcel}.billable_eru == 4.0"

      - name: bmpcredit_reinspection_active_self_loop
        grounds:
          - state_machines.BMPCredit.ACTIVE_to_ACTIVE
          - entities.BMPCredit.fields.credit_pct
        distinguishing_aspect: >
          BMPCredit exercises a self-loop ACTIVE -> ACTIVE on a PASS inspection: status is unchanged but
          credit_pct is re-scored 0.50 -> 0.42, a non-linear (looping) transition on a different entity than Appeal.
        test_recipe:
          setup:
            - "Account + parcel (eru 6.0). ACTIVE BMPCredit self_reported 90 (credit_pct 0.50); SCHEDULED inspection."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Acme", contact_email: "a@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-SM2", land_use: "COMMERCIAL" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 18000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
            - call: "POST /bmp-credits"
              payload: { parcel_id: "${parcel}", bmp_type: "GREEN_ROOF", self_reported_score: 90, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: Assessor
              captures: { credit: $.data.id }
            - call: "POST /credit-inspections"
              payload: { bmp_credit_id: "${credit}", scheduled_date: "2026-02-01T00:00:00Z" }
              as: CreditInspector
              captures: { insp: $.data.id }
          trigger:
            - call: "POST /credit-inspections/${insp}/complete"
              payload: { result: "PASS", observed_score: 70 }
              as: CreditInspector
          assert:
            - "BMPCredit.${credit}.status == ACTIVE"
            - "BMPCredit.${credit}.credit_pct == 0.42"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: credit_fail_revokes_and_recomputes_parcel_depth3
        grounds:
          - state_machines.CreditInspection.SCHEDULED_to_COMPLETED
          - state_machines.BMPCredit.ACTIVE_to_REVOKED
          - entities.Parcel.fields.current_fee_cents
        distinguishing_aspect: >
          Depth-3 chain from the inspection-complete trigger: Inspection COMPLETED(FAIL) -> BMPCredit REVOKED
          (credit_pct 0) -> Parcel.current_fee_cents recomputed 11000 -> 21500; each link caused by the prior.
        test_recipe:
          setup:
            - "Account + parcel (eru 6.0) with ACTIVE credit self_reported 90 => parcel current_fee_cents 11000."
            - "A SCHEDULED inspection on that credit."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Acme", contact_email: "a@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-TC1", land_use: "COMMERCIAL" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 18000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
            - call: "POST /bmp-credits"
              payload: { parcel_id: "${parcel}", bmp_type: "DETENTION_POND", self_reported_score: 90, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: Assessor
              captures: { credit: $.data.id }
            - call: "POST /credit-inspections"
              payload: { bmp_credit_id: "${credit}", scheduled_date: "2026-02-01T00:00:00Z" }
              as: CreditInspector
              captures: { insp: $.data.id }
          trigger:
            - call: "POST /credit-inspections/${insp}/complete"
              payload: { result: "FAIL", observed_score: 10 }
              as: CreditInspector
          assert:
            - "before trigger: Parcel.${parcel}.current_fee_cents == 11000"
            - "after trigger: CreditInspection.${insp}.status == COMPLETED"
            - "after trigger: BMPCredit.${credit}.status == REVOKED and credit_pct == 0"
            - "after trigger: Parcel.${parcel}.current_fee_cents == 21500"

      - name: payment_settles_bill_and_account_depth2
        grounds:
          - state_machines.StormwaterBill.ISSUED_to_PAID
          - entities.Account.fields.outstanding_balance_cents
          - entities.Account.fields.delinquency_status
        distinguishing_aspect: >
          Depth-2 chain from the payment trigger (distinct from the inspection trigger): Payment applied
          -> Bill ISSUED->PAID -> Account.outstanding_balance_cents 21500->0 and delinquency_status->CURRENT.
        test_recipe:
          setup:
            - "Account + parcel (eru 6.0, no credit) with an ISSUED bill assessed 21500; account outstanding 21500."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Acme", contact_email: "a@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-TC2", land_use: "COMMERCIAL" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 18000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
            - call: "POST /bills"
              payload: { parcel_id: "${parcel}", account_id: "${acct}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", due_date: "2026-04-30T00:00:00Z" }
              as: BillingClerk
              captures: { bill: $.data.id }
          trigger:
            - call: "POST /payments"
              payload: { bill_id: "${bill}", account_id: "${acct}", amount_cents: 21500, method: "CARD" }
              as: BillingClerk
              captures: { pay: $.data.id }
          assert:
            - "before trigger: Account.${acct}.outstanding_balance_cents == 21500"
            - "after trigger: StormwaterBill.${bill}.status == PAID"
            - "after trigger: Account.${acct}.outstanding_balance_cents == 0"
            - "after trigger: Account.${acct}.delinquency_status == CURRENT"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: void_bill_state_beats_overpayment_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - errors[ERR_BILL_NOT_PAYABLE]
          - errors[ERR_OVERPAYMENT]
        distinguishing_aspect: >
          state (ERR_BILL_NOT_PAYABLE, priority 7) beats business_fiscal (ERR_OVERPAYMENT, priority 12):
          paying 9999 on a VOID bill (outstanding 0) returns ERR_BILL_NOT_PAYABLE, not ERR_OVERPAYMENT.
        test_recipe:
          setup:
            - "Account + parcel (eru 2.0) with a bill (assessed 8000, no payment) that is then VOIDED."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Acme", contact_email: "a@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-PC1", land_use: "RESIDENTIAL_MF" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 6000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
            - call: "POST /bills"
              payload: { parcel_id: "${parcel}", account_id: "${acct}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", due_date: "2026-04-30T00:00:00Z" }
              as: BillingClerk
              captures: { bill: $.data.id }
            - call: "POST /bills/${bill}/void"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /payments"
              payload: { bill_id: "${bill}", account_id: "${acct}", amount_cents: 9999, method: "ACH" }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BILL_NOT_PAYABLE"
            - "no Payment is created and no FundLedgerEntry is written"

      - name: exempt_parcel_constraint_beats_credit_overlap_temporal
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_PARCEL_EXEMPT]
          - errors[ERR_CREDIT_WINDOW_OVERLAP]
        distinguishing_aspect: >
          business_constraint (ERR_PARCEL_EXEMPT, priority 10) beats business_temporal
          (ERR_CREDIT_WINDOW_OVERLAP, priority 11): a new credit that is both on a GRANTED-exempt parcel
          and overlaps an existing ACTIVE credit returns ERR_PARCEL_EXEMPT.
        test_recipe:
          setup:
            - "Parcel with an ACTIVE RAIN_GARDEN credit [2026-01-01,2026-07-01), then a GRANTED exemption."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Acme", contact_email: "a@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-PC2", land_use: "INSTITUTIONAL" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 18000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
            - call: "POST /bmp-credits"
              payload: { parcel_id: "${parcel}", bmp_type: "RAIN_GARDEN", self_reported_score: 80, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2026-07-01T00:00:00Z" }
              as: Assessor
              captures: { credit1: $.data.id }
            - call: "POST /exemptions"
              payload: { parcel_id: "${parcel}", category: "GOVERNMENT", requested_pct: 1.0 }
              as: Assessor
              captures: { exemption: $.data.id }
            - call: "POST /exemptions/${exemption}/decision"
              payload: { outcome: "GRANT", granted_pct: 1.0 }
              as: Assessor
          trigger:
            - call: "POST /bmp-credits"
              payload: { parcel_id: "${parcel}", bmp_type: "RAIN_GARDEN", self_reported_score: 60, effective_date: "2026-06-01T00:00:00Z", expiry_date: "2026-12-01T00:00:00Z" }
              as: Assessor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PARCEL_EXEMPT"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: flat_tier_upper_edge_at_eru_5_inclusive
        grounds:
          - calculations.stormwater_fee
          - entities.Parcel.fields.billable_eru
        distinguishing_aspect: >
          At eru == 5.0 exactly (tier-2 upper edge is inclusive, '>' at the edge), FLAT uses RATE_T2:
          base_fee_flat_cents == round(5.0 * 3500) == 17500 (not 5.0*3000). Metric = ERU tier edge, endpoint = fee-quote.
        test_recipe:
          setup:
            - "Account + parcel with ACTIVE 15000 sqft measurement (eru exactly 5.0), no credit."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Acme", contact_email: "a@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-BP1", land_use: "COMMERCIAL" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 15000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
          trigger:
            - call: "GET /parcels/${parcel}/fee-quote"
              payload: {}
              as: BillingClerk
              captures: { eru: $.data.billable_eru, bf: $.data.base_fee_flat_cents }
          assert:
            - "fee-quote billable_eru == 5.0"
            - "fee-quote base_fee_flat_cents == 17500"
            - "fee-quote base_fee_marginal_cents == 18000"

      - name: delinquency_grace_day_boundary_inclusive
        grounds:
          - calculations.delinquency_penalty
          - state_machines.StormwaterBill.ISSUED_to_DELINQUENT
          - entities.StormwaterBill.fields.penalty_cents
        distinguishing_aspect: >
          At current_utc == due_date + 30 days exactly (inclusive '>='), run-cycle marks the bill DELINQUENT
          with penalty_cents == round(21500*0.10) == 2150. Metric = elapsed grace days, endpoint = run-cycle
          (different metric and endpoint than the ERU tier edge).
        test_recipe:
          setup:
            - "Account + parcel (eru 6.0) with an unpaid ISSUED bill assessed 21500, due 2026-04-01; clock at 2026-05-01 (exactly due+30d)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Acme", contact_email: "a@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-BP2", land_use: "COMMERCIAL" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 18000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
            - call: "POST /bills"
              payload: { parcel_id: "${parcel}", account_id: "${acct}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", due_date: "2026-04-01T00:00:00Z" }
              as: BillingClerk
              captures: { bill: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BillingClerk
          trigger:
            - call: "POST /billing/run-cycle"
              payload: {}
              as: BillingClerk
          assert:
            - "StormwaterBill.${bill}.status == DELINQUENT"
            - "StormwaterBill.${bill}.penalty_cents == 2150"
            - "StormwaterBill.${bill}.net_fee_cents == 23650"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: bill_issue_requires_active_parcel
        grounds:
          - validations[priority=7]
          - entities.Parcel.fields.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: >
          StormwaterBill issuance depends on Parcel state (Bill<->Parcel pair): issuing a bill for a DRAFT
          parcel (no ACTIVE measurement) returns ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Account + parcel with NO measurement (status DRAFT)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Acme", contact_email: "a@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-CE1", land_use: "COMMERCIAL" }
              as: Assessor
              captures: { parcel: $.data.id }
          trigger:
            - call: "POST /bills"
              payload: { parcel_id: "${parcel}", account_id: "${acct}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", due_date: "2026-04-30T00:00:00Z" }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "no StormwaterBill is created"

      - name: inspection_complete_requires_active_credit
        grounds:
          - validations[priority=7]
          - state_machines.BMPCredit.ACTIVE_to_EXPIRED
          - state_machines.CreditInspection.SCHEDULED_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: >
          CreditInspection completion depends on BMPCredit state (Inspection<->BMPCredit pair, distinct from
          Bill<->Parcel): completing an inspection whose credit was EXPIRED by run-cycle returns ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Parcel with ACTIVE credit (effective 2026-01-01, next_inspection_due 2027-01-01) and a SCHEDULED inspection; clock advanced past the due date and run-cycle expires the credit."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Acme", contact_email: "a@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-CE2", land_use: "COMMERCIAL" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 18000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
            - call: "POST /bmp-credits"
              payload: { parcel_id: "${parcel}", bmp_type: "CISTERN", self_reported_score: 80, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2028-01-01T00:00:00Z" }
              as: Assessor
              captures: { credit: $.data.id }
            - call: "POST /credit-inspections"
              payload: { bmp_credit_id: "${credit}", scheduled_date: "2026-02-01T00:00:00Z" }
              as: CreditInspector
              captures: { insp: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00Z" }
              as: CreditInspector
            - call: "POST /billing/run-cycle"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /credit-inspections/${insp}/complete"
              payload: { result: "PASS", observed_score: 90 }
              as: CreditInspector
              captures: { err: $.data.error_id }
          assert:
            - "before trigger: BMPCredit.${credit}.status == EXPIRED"
            - "response error_id == ERR_INVALID_STATE"
            - "CreditInspection.${insp}.status == SCHEDULED (unchanged)"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: credit_window_half_open_overlap_rejected
        grounds:
          - validations[priority=11]
          - entities.BMPCredit.fields.effective_date
          - entities.BMPCredit.fields.expiry_date
          - errors[ERR_CREDIT_WINDOW_OVERLAP]
        distinguishing_aspect: >
          BMPCredit windows are half-open [effective_date, expiry_date): a new RAIN_GARDEN credit
          [2026-06-01,2026-12-01) overlaps an existing ACTIVE [2026-01-01,2026-07-01) and is rejected,
          while a touching window (effective == prior expiry) would NOT conflict.
        test_recipe:
          setup:
            - "Parcel (non-exempt) with an ACTIVE RAIN_GARDEN credit [2026-01-01,2026-07-01)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Acme", contact_email: "a@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-TO1", land_use: "COMMERCIAL" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 18000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
            - call: "POST /bmp-credits"
              payload: { parcel_id: "${parcel}", bmp_type: "RAIN_GARDEN", self_reported_score: 80, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2026-07-01T00:00:00Z" }
              as: Assessor
              captures: { credit1: $.data.id }
          trigger:
            - call: "POST /bmp-credits"
              payload: { parcel_id: "${parcel}", bmp_type: "RAIN_GARDEN", self_reported_score: 70, effective_date: "2026-06-01T00:00:00Z", expiry_date: "2026-12-01T00:00:00Z" }
              as: Assessor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CREDIT_WINDOW_OVERLAP"

      - name: bill_period_closed_shared_endpoint_overlap_rejected
        grounds:
          - validations[priority=11]
          - entities.StormwaterBill.fields.period_start
          - entities.StormwaterBill.fields.period_end
          - errors[ERR_BILL_PERIOD_OVERLAP]
        distinguishing_aspect: >
          StormwaterBill periods are CLOSED [period_start, period_end]: a new bill [2026-06-30,2026-12-31]
          that SHARES the endpoint 2026-06-30 with an existing bill [2026-01-01,2026-06-30] is rejected —
          a shared endpoint conflicts, unlike the half-open credit window.
        test_recipe:
          setup:
            - "Parcel (ACTIVE, eru 6.0) with a non-VOID bill for period [2026-01-01,2026-06-30]."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Acme", contact_email: "a@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-TO2", land_use: "COMMERCIAL" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 18000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
            - call: "POST /bills"
              payload: { parcel_id: "${parcel}", account_id: "${acct}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", due_date: "2026-07-31T00:00:00Z" }
              as: BillingClerk
              captures: { bill1: $.data.id }
          trigger:
            - call: "POST /bills"
              payload: { parcel_id: "${parcel}", account_id: "${acct}", period_start: "2026-06-30T00:00:00Z", period_end: "2026-12-31T00:00:00Z", due_date: "2027-01-31T00:00:00Z" }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BILL_PERIOD_OVERLAP"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: refund_conserves_total_fund_balance
        grounds:
          - state_machines.Payment.APPLIED_to_REFUNDED
          - calculations.fund_allocation
          - entities.FundLedgerEntry.fields.entry_type
        distinguishing_aspect: >
          Conserved quantity = fund cash. A pay-then-refund round trip on a 21500 payment writes ALLOCATION
          CAPITAL 6450 / OPERATING 15050 and equal-and-opposite REVERSAL rows, so
          sum(ALLOCATION) - sum(REVERSAL) per fund == 0 (net fund balance unchanged).
        test_recipe:
          setup:
            - "Account + parcel (eru 6.0) with an ISSUED bill assessed 21500, fully paid by clerk 'clerk-a' (ALLOCATION 6450/15050)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Acme", contact_email: "a@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-CI1", land_use: "COMMERCIAL" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 18000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
            - call: "POST /bills"
              payload: { parcel_id: "${parcel}", account_id: "${acct}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", due_date: "2026-04-30T00:00:00Z" }
              as: BillingClerk
              captures: { bill: $.data.id }
            - call: "POST /payments"
              payload: { bill_id: "${bill}", account_id: "${acct}", amount_cents: 21500, method: "ACH" }
              as: BillingClerk
              as_user_id: "clerk-a"
              captures: { pay: $.data.id }
          trigger:
            - call: "POST /payments/${pay}/refund"
              payload: {}
              as: BillingClerk
              as_user_id: "clerk-b"
          assert:
            - "after refund: Payment.${pay}.status == REFUNDED"
            - "FundLedgerEntry rows for ${pay}: ALLOCATION CAPITAL 6450, ALLOCATION OPERATING 15050, REVERSAL CAPITAL 6450, REVERSAL OPERATING 15050"
            - "net capital (sum ALLOCATION - sum REVERSAL) == 0 and net operating == 0"

      - name: refund_conserves_account_receivable
        grounds:
          - state_machines.Payment.APPLIED_to_REFUNDED
          - entities.Account.fields.outstanding_balance_cents
          - entities.StormwaterBill.fields.amount_paid_cents
        distinguishing_aspect: >
          Conserved quantity = account receivable (distinct from fund cash). Pay-then-refund restores
          Account.outstanding_balance_cents to its pre-payment 21500 and bill.amount_paid_cents to 0.
        test_recipe:
          setup:
            - "Account + parcel (eru 6.0) with ISSUED bill assessed 21500 (outstanding 21500), fully paid by 'clerk-a'."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Acme", contact_email: "a@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-CI2", land_use: "COMMERCIAL" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 18000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
            - call: "POST /bills"
              payload: { parcel_id: "${parcel}", account_id: "${acct}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", due_date: "2026-04-30T00:00:00Z" }
              as: BillingClerk
              captures: { bill: $.data.id }
            - call: "POST /payments"
              payload: { bill_id: "${bill}", account_id: "${acct}", amount_cents: 21500, method: "ACH" }
              as: BillingClerk
              as_user_id: "clerk-a"
              captures: { pay: $.data.id }
          trigger:
            - call: "POST /payments/${pay}/refund"
              payload: {}
              as: BillingClerk
              as_user_id: "clerk-b"
          assert:
            - "before refund: Account.${acct}.outstanding_balance_cents == 0 and StormwaterBill.${bill}.status == PAID"
            - "after refund: Account.${acct}.outstanding_balance_cents == 21500"
            - "after refund: StormwaterBill.${bill}.amount_paid_cents == 0 and status == ISSUED"
