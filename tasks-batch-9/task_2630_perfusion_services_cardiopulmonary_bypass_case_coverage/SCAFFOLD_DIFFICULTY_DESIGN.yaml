        grounds:
          - state_machines.PerfusionDevice.RESERVED_to_NEEDS_SERVICE
          - state_machines.BypassCase.SETUP_VERIFIED_to_STAFFED
          - state_machines.PumpChecklist.VERIFIED_to_INVALIDATED
          - state_machines.BypassCase.PROVISIONAL_ACCRUED_to_UNBILLED
          - entities.BypassCase.fields.readiness_flag
          - entities.PerfusionDevice.fields.alarm_count_since_service
          - entities.HospitalContract.fields.accrued_case_fee_cents
        distinguishing_aspect: |
          Depth 4, triggered by a device event log. Link 1 (a critical alarm moves the reserved
          primary device RESERVED -> NEEDS_SERVICE) is what makes link 2 possible (the case holding
          that device reverts SETUP_VERIFIED -> STAFFED and raises readiness_flag
          DEVICE_FALLBACK_REQUIRED); link 2 is what invalidates the verified checklist in link 3;
          and link 3 is the declared cause of link 4, the fiscal reversal PROVISIONAL_ACCRUED ->
          UNBILLED that withdraws 400000 cents from the contract ledger. Remove any link and the
          following one cannot fire.
