            - call: "POST /direct-selling/product-orders"
              payload: { consultant_id: "${cons_b_id}", order_type: "BUSINESS_SUPPLY", posted_period_code: "2026-08", ship_to_state_code: "TX", lines: [ { product_id: "${serum_id}", quantity: 5 } ] }
              as: Consultant
