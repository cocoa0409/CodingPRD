      - name: frozen_posture_reverts_approved_runs_but_leaves_running_ones
        claim_type: conditional_cascade
        grounds:
          - state_machines.ProductionRun.APPROVED_to_PLANNED
          - state_machines.Plant.NORMAL_to_FROZEN
          - calculations.plant_operating_posture
          - entities.Plant.fields.permit_status
        distinguishing_aspect: |
          The FROZEN cascade is conditional on the child's state: the APPROVED run on train 1 is
          reverted to PLANNED while the RUNNING run on train 2 is untouched, because RUNNING -> * is
          not part of the posture cascade. One posture flip therefore produces two different outcomes
          on two sibling runs.
