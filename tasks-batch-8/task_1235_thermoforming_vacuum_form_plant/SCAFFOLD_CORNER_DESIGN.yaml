            - { call: "POST /machine-resources", payload: { resource_code: "ST-V11", resource_type: FORMING_STATION, cleanliness_grade: INDUSTRIAL, machine_rate_per_hour: 55.00 }, as: ProductionScheduler, captures: { station_id: $.data.id } }
            - { call: "POST /production-orders", payload: { order_code: "O-V11", part_number: "P-V11", resin_type: PETG, ordered_qty: 50, required_gauge_mm: 1.500, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.300, spec_min_wall_mm: 1.230, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 55.00, tool_id: "${tool_id}", packaging_spec_id: "${spec_id}", is_prototype_order: true }, as: ProductionScheduler, captures: { order_id: $.data.id } }
            - { call: "POST /material-allocations", payload: { production_order_id: "${order_id}", source_type: VIRGIN_LOT, lot_id: "${lot_id}", qty_kg: 2.950 }, as: ProductionScheduler }
            - { call: "GET /production-orders/${order_id}", as: Any, captures: { o_ver: $.data.version } }
            - { call: "POST /production-orders/${order_id}/stage", payload: { expected_production_order_version: "${o_ver}" }, as: ProductionScheduler }
            - { call: "POST /forming-runs", payload: { production_order_id: "${order_id}", station_id: "${station_id}", planned_start: "2026-05-02T10:00:00Z", planned_end: "2026-05-02T10:30:00Z", oven_temp_c: 180.0, cycle_time_s: 30, shots_planned: 10 }, as: ProductionScheduler }
            - { call: "POST /assembly-tasks", payload: { production_order_id: "${order_id}", task_type: TRIM, sequence_no: 1 }, as: ProductionScheduler, captures: { task1: $.data.id } }
            - { call: "POST /assembly-tasks", payload: { production_order_id: "${order_id}", task_type: PACK, sequence_no: 2 }, as: ProductionScheduler, captures: { task2: $.data.id } }
            - { call: "POST /assembly-tasks/${task1}/complete", as: ProductionScheduler }
          trigger:
            - { call: "POST /assembly-tasks/${task2}/complete", as: ProductionScheduler, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ORDER_QUALITY_NOT_RELEASED (captured ${err}) — quality_status still PENDING"
  # -------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: run_complete_scrap_discovery_and_terminal_lockdown
        claim_type: action_endpoint
        grounds: ["endpoints: \"POST /forming-runs/{runId}/complete", "endpoints: \"GET /scrap-records", "errors[ERR_INVALID_RUN_STATE]"]
        distinguishing_aspect: "Completing a run with scrap_weight_kg 0.500 cascade-creates a PENDING ScrapRecord discoverable only via the filtered list (FK reverse-reachability), and a second complete on the terminal run is rejected."
        test_recipe:
          setup: ["RUNNING order O-E1 with one SCHEDULED run"]
          setup_api_calls:
            - { call: "POST /material-lots", payload: { lot_code: "L-E1", resin_type: PETG, gauge_mm: 1.500, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 10.000, unit_cost_per_kg: 10.00 }, as: MaterialsPlanner, captures: { lot_id: $.data.id } }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: MATERIAL_LOT, subject_id: "${lot_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools", payload: { tool_code: "T-E1", part_number: "P-E1", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 1000.00 }, as: ToolingEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /tools/${tool_id}/complete-prototype", as: ToolingEngineer }
            - { call: "POST /packaging-specs", payload: { spec_code: "S-E1", spec_type: STOCK, cleanliness_grade: INDUSTRIAL, per_pack_cost: 0.30 }, as: PackagingEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /machine-resources", payload: { resource_code: "ST-E1", resource_type: FORMING_STATION, cleanliness_grade: INDUSTRIAL, machine_rate_per_hour: 55.00 }, as: ProductionScheduler, captures: { station_id: $.data.id } }
            - { call: "POST /production-orders", payload: { order_code: "O-E1", part_number: "P-E1", resin_type: PETG, ordered_qty: 100, required_gauge_mm: 1.500, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.300, spec_min_wall_mm: 1.230, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 55.00, tool_id: "${tool_id}", packaging_spec_id: "${spec_id}", is_prototype_order: true }, as: ProductionScheduler, captures: { order_id: $.data.id } }
            - { call: "POST /material-allocations", payload: { production_order_id: "${order_id}", source_type: VIRGIN_LOT, lot_id: "${lot_id}", qty_kg: 5.900 }, as: ProductionScheduler }
            - { call: "GET /production-orders/${order_id}", as: Any, captures: { o_ver: $.data.version } }
            - { call: "POST /production-orders/${order_id}/stage", payload: { expected_production_order_version: "${o_ver}" }, as: ProductionScheduler }
            - { call: "POST /forming-runs", payload: { production_order_id: "${order_id}", station_id: "${station_id}", planned_start: "2026-05-02T10:00:00Z", planned_end: "2026-05-02T10:30:00Z", oven_temp_c: 180.0, cycle_time_s: 30, shots_planned: 10 }, as: ProductionScheduler, captures: { run_id: $.data.id } }
          trigger:
            - { call: "POST /forming-runs/${run_id}/complete", payload: { shots_completed: 10, scrap_weight_kg: 0.500, actual_end: "2026-05-02T10:30:00Z" }, as: ProductionScheduler, captures: { run_st: $.data.status } }
            - { call: "GET /scrap-records", payload: { forming_run_id: "${run_id}" }, as: Any, captures: { scrap_id: "$.data[0].id", scrap_st: "$.data[0].status", scrap_w: "$.data[0].weight_kg", scrap_resin: "$.data[0].resin_type" } }
            - { call: "POST /forming-runs/${run_id}/complete", payload: { shots_completed: 0, scrap_weight_kg: 0.000, actual_end: "2026-05-02T10:35:00Z" }, as: ProductionScheduler, captures: { err: $.data.error_id } }
          assert:
            - "Run completes: status == COMPLETED (captured ${run_st})"
            - "Exactly one ScrapRecord exists for the run (id ${scrap_id}): status == PENDING, weight_kg == 0.500, resin_type == PETG (captured ${scrap_st} / ${scrap_w} / ${scrap_resin})"
            - "Second complete rejected: error == ERR_INVALID_RUN_STATE (captured ${err}) — terminal lockdown"
      - name: allocations_filterable_by_production_order
        claim_type: standard_crud
        grounds: ["endpoints: \"GET /material-allocations\""]
        distinguishing_aspect: "The filtered list returns exactly the two allocations of the queried order and supports the FK reverse-reachability contract."
        test_recipe:
          setup: ["order O-E2 with two virgin allocations (2.000 + 3.950) from a CERTIFIED lot"]
          setup_api_calls:
            - { call: "POST /material-lots", payload: { lot_code: "L-E2", resin_type: PETG, gauge_mm: 1.500, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 10.000, unit_cost_per_kg: 10.00 }, as: MaterialsPlanner, captures: { lot_id: $.data.id } }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: MATERIAL_LOT, subject_id: "${lot_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools", payload: { tool_code: "T-E2", part_number: "P-E2", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 1000.00 }, as: ToolingEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /tools/${tool_id}/complete-prototype", as: ToolingEngineer }
            - { call: "POST /packaging-specs", payload: { spec_code: "S-E2", spec_type: STOCK, cleanliness_grade: INDUSTRIAL, per_pack_cost: 0.30 }, as: PackagingEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /production-orders", payload: { order_code: "O-E2", part_number: "P-E2", resin_type: PETG, ordered_qty: 50, required_gauge_mm: 1.500, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.300, spec_min_wall_mm: 1.230, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 55.00, tool_id: "${tool_id}", packaging_spec_id: "${spec_id}", is_prototype_order: true }, as: ProductionScheduler, captures: { order_id: $.data.id } }
            - { call: "POST /material-allocations", payload: { production_order_id: "${order_id}", source_type: VIRGIN_LOT, lot_id: "${lot_id}", qty_kg: 2.000 }, as: ProductionScheduler, captures: { a1: $.data.id } }
            - { call: "POST /material-allocations", payload: { production_order_id: "${order_id}", source_type: VIRGIN_LOT, lot_id: "${lot_id}", qty_kg: 3.950 }, as: ProductionScheduler, captures: { a2: $.data.id } }
          trigger:
            - { call: "GET /material-allocations", payload: { production_order_id: "${order_id}" }, as: Any }
          assert:
            - "Response data contains exactly the two allocations ${a1} and ${a2} (total_count == 2, order-insensitive)"
      - name: get_response_envelope_shape
        claim_type: standard_crud
        grounds: ["response_envelope"]
        distinguishing_aspect: "A single-entity GET wraps data in the fixed envelope: meta.api_request_id and meta.api_request_timestamp present, response_type == 'object', data.id matching the requested resource."
        test_recipe:
          setup: ["one lot exists"]
          setup_api_calls:
            - { call: "POST /material-lots", payload: { lot_code: "L-E3", resin_type: PP, gauge_mm: 1.000, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 4.000, unit_cost_per_kg: 6.00 }, as: MaterialsPlanner, captures: { lot_id: $.data.id } }
          trigger:
            - { call: "GET /material-lots/${lot_id}", as: Any, captures: { got_id: $.data.id } }
          assert:
            - "Response carries meta.api_request_id and meta.api_request_timestamp"
            - "response_type == 'object' and data.id == ${lot_id} (captured ${got_id})"
  # -------------------------------------------------------------------------
  - section: errors
    instances:
      - name: nonexistent_resources_return_not_found_battery
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_TOOL_NOT_FOUND]", "errors[ERR_MATERIAL_LOT_NOT_FOUND]", "errors[ERR_ORDER_NOT_FOUND]", "errors[ERR_MACHINE_RESOURCE_NOT_FOUND]", "errors[ERR_QUALITY_INSPECTION_NOT_FOUND]", "errors[ERR_ASSEMBLY_TASK_NOT_FOUND]", "errors[ERR_ALLOCATION_NOT_FOUND]", "errors[ERR_FORMING_RUN_NOT_FOUND]", "errors[ERR_SCRAP_RECORD_NOT_FOUND]", "errors[ERR_REGRIND_BATCH_NOT_FOUND]", "errors[ERR_CERTIFICATE_NOT_FOUND]", "errors[ERR_PACKAGING_SPEC_NOT_FOUND]"]
        distinguishing_aspect: "Every resource type resolves an unknown id to its own domain-specific 404 error code, including the polymorphic certificate subject lookup (subject_type TOOL with unknown subject_id -> ERR_TOOL_NOT_FOUND)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /tools/00000000-0000-4000-8000-000000000001", as: Any, captures: { e_tool: $.data.error_id } }
            - { call: "GET /material-lots/00000000-0000-4000-8000-000000000001", as: Any, captures: { e_lot: $.data.error_id } }
            - { call: "GET /production-orders/00000000-0000-4000-8000-000000000001", as: Any, captures: { e_ord: $.data.error_id } }
            - { call: "GET /machine-resources/00000000-0000-4000-8000-000000000001", as: Any, captures: { e_mach: $.data.error_id } }
            - { call: "GET /quality-inspections/00000000-0000-4000-8000-000000000001", as: Any, captures: { e_insp: $.data.error_id } }
            - { call: "GET /assembly-tasks/00000000-0000-4000-8000-000000000001", as: Any, captures: { e_task: $.data.error_id } }
            - { call: "GET /material-allocations/00000000-0000-4000-8000-000000000001", as: Any, captures: { e_alloc: $.data.error_id } }
            - { call: "GET /forming-runs/00000000-0000-4000-8000-000000000001", as: Any, captures: { e_run: $.data.error_id } }
            - { call: "GET /scrap-records/00000000-0000-4000-8000-000000000001", as: Any, captures: { e_scrap: $.data.error_id } }
            - { call: "GET /regrind-batches/00000000-0000-4000-8000-000000000001", as: Any, captures: { e_batch: $.data.error_id } }
            - { call: "GET /cleanliness-certificates/00000000-0000-4000-8000-000000000001", as: Any, captures: { e_cert: $.data.error_id } }
            - { call: "POST /packaging-specs/00000000-0000-4000-8000-000000000001/decide", payload: { decision: APPROVED }, as: PlantManager, captures: { e_spec: $.data.error_id } }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: TOOL, subject_id: "00000000-0000-4000-8000-000000000001", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector, captures: { e_subj: $.data.error_id } }
          assert:
            - "GET unknown tool -> ${e_tool} == ERR_TOOL_NOT_FOUND (404)"
            - "GET unknown lot -> ${e_lot} == ERR_MATERIAL_LOT_NOT_FOUND"
            - "GET unknown order -> ${e_ord} == ERR_ORDER_NOT_FOUND"
            - "GET unknown machine resource -> ${e_mach} == ERR_MACHINE_RESOURCE_NOT_FOUND"
            - "GET unknown inspection -> ${e_insp} == ERR_QUALITY_INSPECTION_NOT_FOUND"
            - "GET unknown assembly task -> ${e_task} == ERR_ASSEMBLY_TASK_NOT_FOUND"
            - "GET unknown allocation -> ${e_alloc} == ERR_ALLOCATION_NOT_FOUND"
            - "GET unknown run -> ${e_run} == ERR_FORMING_RUN_NOT_FOUND"
            - "GET unknown scrap record -> ${e_scrap} == ERR_SCRAP_RECORD_NOT_FOUND"
            - "GET unknown batch -> ${e_batch} == ERR_REGRIND_BATCH_NOT_FOUND"
            - "GET unknown certificate -> ${e_cert} == ERR_CERTIFICATE_NOT_FOUND"
            - "decide on unknown spec -> ${e_spec} == ERR_PACKAGING_SPEC_NOT_FOUND"
            - "certificate for unknown TOOL subject -> ${e_subj} == ERR_TOOL_NOT_FOUND"
      - name: create_lot_missing_auth_header_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers fails authentication before any role, existence, or business check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /material-lots", payload: { lot_code: "L-AUTH", resin_type: PETG, gauge_mm: 1.500, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 5.000, unit_cost_per_kg: 8.00 }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER with HTTP 400 (captured ${err})"
      - name: decide_stock_spec_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.PackagingSpec", "errors[ERR_INVALID_SPEC_STATE]"]
        distinguishing_aspect: "STOCK specs are born ACTIVE; decide on one is rejected with ERR_INVALID_SPEC_STATE because the decide transition exists only from PENDING_APPROVAL."
        test_recipe:
          setup: ["STOCK spec ACTIVE"]
          setup_api_calls:
            - { call: "POST /packaging-specs", payload: { spec_code: "S-ERR1", spec_type: STOCK, cleanliness_grade: INDUSTRIAL, per_pack_cost: 0.30 }, as: PackagingEngineer, captures: { spec_id: $.data.id, st: $.data.status } }
          trigger:
            - { call: "POST /packaging-specs/${spec_id}/decide", payload: { decision: APPROVED }, as: PlantManager, captures: { err: $.data.error_id } }
          assert:
            - "Spec was created ACTIVE (captured ${st})"
            - "error_id == ERR_INVALID_SPEC_STATE (captured ${err})"
      - name: run_create_on_queued_order_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.FormingRun", "errors[ERR_ORDER_NOT_RUNNING]"]
        distinguishing_aspect: "A run may only be created against a STAGED or RUNNING order; a QUEUED order (never staged) is rejected with ERR_ORDER_NOT_RUNNING."
        test_recipe:
          setup: ["QUEUED order O-ERR4 (prototype tool) and a free station"]
          setup_api_calls:
            - { call: "POST /tools", payload: { tool_code: "T-ERR4", part_number: "P-ERR4", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 1000.00 }, as: ToolingEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /tools/${tool_id}/complete-prototype", as: ToolingEngineer }
            - { call: "POST /packaging-specs", payload: { spec_code: "S-ERR4", spec_type: STOCK, cleanliness_grade: INDUSTRIAL, per_pack_cost: 0.30 }, as: PackagingEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /machine-resources", payload: { resource_code: "ST-ERR4", resource_type: FORMING_STATION, cleanliness_grade: INDUSTRIAL, machine_rate_per_hour: 55.00 }, as: ProductionScheduler, captures: { station_id: $.data.id } }
            - { call: "POST /production-orders", payload: { order_code: "O-ERR4", part_number: "P-ERR4", resin_type: PETG, ordered_qty: 50, required_gauge_mm: 1.500, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.300, spec_min_wall_mm: 1.230, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 55.00, tool_id: "${tool_id}", packaging_spec_id: "${spec_id}", is_prototype_order: true }, as: ProductionScheduler, captures: { order_id: $.data.id } }
          trigger:
            - { call: "POST /forming-runs", payload: { production_order_id: "${order_id}", station_id: "${station_id}", planned_start: "2026-05-02T10:00:00Z", planned_end: "2026-05-02T10:30:00Z", oven_temp_c: 180.0, cycle_time_s: 30, shots_planned: 10 }, as: ProductionScheduler, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ORDER_NOT_RUNNING (captured ${err})"
      - name: allocation_double_release_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.MaterialAllocation", "errors[ERR_ALLOCATION_NOT_RELEASABLE]"]
        distinguishing_aspect: "RELEASED is terminal for allocations: a second release is rejected with ERR_ALLOCATION_NOT_RELEASABLE and balances do not drift."
        test_recipe:
          setup: ["CERTIFIED lot 10.000kg; QUEUED order O-ERR5 with a 2.000kg allocation already RELEASED"]
          setup_api_calls:
            - { call: "POST /material-lots", payload: { lot_code: "L-ERR5", resin_type: PETG, gauge_mm: 1.500, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 10.000, unit_cost_per_kg: 10.00 }, as: MaterialsPlanner, captures: { lot_id: $.data.id } }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: MATERIAL_LOT, subject_id: "${lot_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools", payload: { tool_code: "T-ERR5", part_number: "P-ERR5", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 1000.00 }, as: ToolingEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /tools/${tool_id}/complete-prototype", as: ToolingEngineer }
