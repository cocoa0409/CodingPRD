  # =====================================================================
  # SECTION 7 — RBAC (claim-extraction-guide Table 7)
  # =====================================================================
  - section: rbac
    instances:

      - name: a_mileage_analyst_cannot_prepare_a_return
        claim_type: exclusive_operation_denied
        grounds:
          - roles.TaxPreparer.exclusive_operations
          - roles.MileageAnalyst.shared_operations
          - validations[2].ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "prepare is exclusive to TaxPreparer, so a MileageAnalyst call returns ERR_FORBIDDEN_ROLE 403 at priority 2 — before the OCC token, the gap rule and the gallons rule are examined — and the same call as the preparer then succeeds."
        test_recipe:
          setup:
            - "ACCEPTED IL trip of 650.0 miles and an ACCEPTED IL purchase of 100.000 gallons in Q2-2026; a DRAFT return."
          setup_api_calls:
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Prairie Freight LLC", usdot_number: "USDOT-2637001", base_jurisdiction_code: "IL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c1_id: $.data.id }
            - call: "POST /apportionment/vehicles"
