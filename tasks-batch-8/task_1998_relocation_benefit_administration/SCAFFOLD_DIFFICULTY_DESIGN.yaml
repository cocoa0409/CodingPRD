          - state_machines.RelocationCase.IN_PROGRESS_to_CANCELLED
          - state_machines.MoveAssignment.ESTIMATE_APPROVED_to_CANCELLED
          - calculations.case_cost_ledger
        distinguishing_aspect: |
          Depth-2 chain from the plain cancel trigger: case -> CANCELLED causes
          the ESTIMATE_APPROVED assignment -> CANCELLED (hop 1); that
