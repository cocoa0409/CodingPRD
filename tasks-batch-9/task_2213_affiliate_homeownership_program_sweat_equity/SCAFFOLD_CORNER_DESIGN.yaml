          assert:
            - "Shift read with 2 of 5 confirmed: confirmed_general_count == 2, confirmed_trade_count == 0, fill_ratio == 0.4 (round(2/5, 4))"
            - "Lock at 2 confirmations: HTTP 409 and ${e_lock} == ERR_SHIFT_FILL_INSUFFICIENT, because ceil(0.60 * 5) == 3"
            - "Third confirm: HTTP 200, status == CONFIRMED"
            - "Lock at 3 confirmations: HTTP 200, status == LOCKED, confirmed_general_count == 3, fill_ratio == 0.6 exactly, safety_briefing_completed == true"
            - "The two other RESERVED-capable seats were never filled, so a 5-slot shift locked at 60 percent fill and not at 100 percent"

      - name: advocacy_category_allowance_fills_then_refuses_the_next_entry
        claim_type: waterfall_allocation
        grounds: [calculations.sweat_equity_credit_allocation, entities.SweatEquityEntry.fields.hours_credited, entities.SweatEquityEntry.fields.capped_hours, "state_machines.SweatEquityEntry.status.VERIFIED_to_CREDITED", "validations[priority=23]", errors.ERR_CATEGORY_CREDIT_CAP_REACHED]
        distinguishing_aspect: "ADVOCACY_CAP_HOURS 10.00 is a bucket on the SUM of already-credited hours, so three identical 12-hour claims land differently: the first takes 6.00 with no spill, the second is partially filled at 4.00 with 2.00 spilled into capped_hours, and the third finds zero room and is refused outright. The 0.50 ADVOCACY weight is applied per entry BEFORE the bucket is consulted."
        test_recipe:
          setup:
            - "Canonical program with a SELECTED household whose only ACTIVE member is the adult APPLICANT, so sweat_equity_required_hours froze at 12.0 and the family allowance never applies (an APPLICANT is not family-scoped). Three ADVOCACY entries of 12 hours each are claimed by fsc-1 and verified by cm-1; the first two are then credited in order, leaving 10.00 credited ADVOCACY hours on the household."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
