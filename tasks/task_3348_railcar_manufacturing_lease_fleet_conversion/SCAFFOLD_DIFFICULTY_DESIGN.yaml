        payload:
          lease_fleet_car_id: ${car_a}
          car_assignment_id: ${asg_a}
          return_date: '2026-10-05'
          mileage_since_last: 1000
          condition_grade: A
        as: LeaseAdministrator
        captures:
          ret_a: $.data.id
          over_a: $.data.mileage_overage_cents
      - call: POST /api/v1/car-returns
        payload:
          lease_fleet_car_id: ${car_b}
          car_assignment_id: ${asg_b}
          return_date: '2026-10-05'
          mileage_since_last: 1001
          condition_grade: A
        as: LeaseAdministrator
        captures:
          ret_b: $.data.id
          over_b: $.data.mileage_overage_cents
      assert:
      - 'Exactly at the allowance: CarReturn ${ret_a}.mileage_overage_cents == ${over_a} == 0 (blocks
        = ceil(30/30) = 1, included_miles = 1 * 1000 = 1000, mileage_used 1000 - 1000 = 0 overage miles,
        max(0, 0) * 12 == 0)'
      - 'One mile past the allowance: CarReturn ${ret_b}.mileage_overage_cents == ${over_b} == 12 (mileage_used
        1001 - included_miles 1000 = 1 overage mile * 12 cents)'
      - 'The comparison is inclusive, not strict: mileage_used == included_miles charges exactly 0 cents
        while one extra mile charges exactly 12 cents, so the true-up uses mileage_used <= included_miles
        rather than mileage_used < included_miles'
      - Both returns were accepted and are distinct rows (${ret_a} != ${ret_b}), so the only difference
        between the two scenarios is the one-mile crossing of the allowance
  - name: boundary_component_stock_exact_vs_one_short
    grounds:
    - validations[priority=13]
    - entities.Component.fields.on_hand_qty
    - entities.CarTypeComponentRequirement.fields.qty_per_car
    - state_machines.ProductionOrder.DRAFT_to_COMPONENT_RESERVED
    - calculations.component_allocation
    distinguishing_aspect: 'Two otherwise identical 5-car reservations that each consume 2 wheelsets per
      car

      (required = 2 * 5 = 10) turn on the >= in Component.on_hand_qty >= effective

      qty_per_car * production_order.quantity: on_hand_qty exactly 10 commits the stock

      and moves the order to COMPONENT_RESERVED, while on_hand_qty 9 is rejected with

      ERR_COMPONENT_SHORTAGE. The boundary metric is stock units against a

      bill-of-materials requirement, reached through

      POST /api/v1/production-orders/{id}/reserve-components — a different metric and a

      different endpoint from the mileage-overage zero edge of the sibling instance.

      '
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z; empty DB.
      - Two car types each carry one WHEELSET bill-of-material row with qty_per_car 2; their wheelset
        components have lead_time_days 10, so the gated lead time is ceil(10 / 2) = 5 days and a 2026-09-01..2026-09-30
        horizon of 29 days is feasible.
      - Wheelset WS-EQ-1 is created with on_hand_qty exactly 10; wheelset WS-SH-1 is created with on_hand_qty
        9.
      - One RETAINED order of quantity 5 (planned_shop_days 5) exists on each car type, so each order
        requires exactly 2 * 5 = 10 units of its wheelset.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/car-types
        payload:
          model_code: STK-EQ-100
          car_class: BOXCAR
          build_hours: 1
          regulatory_life_years: 15
          line_count_family: STK_EQ_LINE
        as: ProductionPlanner
        captures:
          ct_eq_id: $.data.id
      - call: POST /api/v1/car-types
        payload:
          model_code: STK-SH-100
          car_class: BOXCAR
          build_hours: 1
          regulatory_life_years: 15
          line_count_family: STK_SH_LINE
        as: ProductionPlanner
        captures:
          ct_sh_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: WS-EQ-1
          component_class: WHEELSET
          unit_cost_cents: 200000
          lead_time_days: 10
          on_hand_qty: 10
        as: SupplyChainCoordinator
        captures:
          comp_eq_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: WS-SH-1
          component_class: WHEELSET
          unit_cost_cents: 200000
          lead_time_days: 10
          on_hand_qty: 9
        as: SupplyChainCoordinator
        captures:
          comp_sh_id: $.data.id
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_eq_id}
          component_id: ${comp_eq_id}
          qty_per_car: 2
        as: ProductionPlanner
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_sh_id}
          component_id: ${comp_sh_id}
          qty_per_car: 2
        as: ProductionPlanner
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_eq_id}
          quantity: 5
          planned_shop_days: 5
          disposition: RETAINED
          priority_rank: 1
          order_date: '2026-09-01'
          required_delivery_date: '2026-09-30'
        as: ProductionPlanner
        captures:
          po_eq: $.data.id
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_sh_id}
          quantity: 5
          planned_shop_days: 5
          disposition: RETAINED
          priority_rank: 1
          order_date: '2026-09-01'
          required_delivery_date: '2026-09-30'
        as: ProductionPlanner
        captures:
          po_sh: $.data.id
      trigger:
      - call: POST /api/v1/production-orders/${po_eq}/reserve-components
        payload: {}
        as: ProductionPlanner
        captures:
          eq_status: $.data.status
      - call: GET /api/v1/components/${comp_eq_id}
        as: PlatformAdmin
        captures:
          eq_on_hand: $.data.on_hand_qty
      - call: POST /api/v1/production-orders/${po_sh}/reserve-components
        payload: {}
        as: ProductionPlanner
        captures:
          sh_err: $.data.error_id
      - call: GET /api/v1/components/${comp_sh_id}
        as: PlatformAdmin
        captures:
          sh_on_hand: $.data.on_hand_qty
      - call: GET /api/v1/production-orders/${po_sh}
        as: PlatformAdmin
        captures:
          sh_status: $.data.status
      assert:
      - 'Exactly at the requirement: Component ${comp_eq_id} on_hand_qty 10 == qty_per_car 2 * quantity
        5 == 10, so the reservation succeeds and production_order ${po_eq} status == ${eq_status} == COMPONENT_RESERVED'
      - After the commit Component ${comp_eq_id}.on_hand_qty == ${eq_on_hand} == 0 (10 units committed,
        none left), so the >= boundary consumed the stock exactly rather than rejecting it
      - 'One unit short: Component ${comp_sh_id} on_hand_qty 9 < qty_per_car 2 * quantity 5 == 10, so
        the reservation is rejected with error_id ${sh_err} == ERR_COMPONENT_SHORTAGE and http_status
        == 409'
      - Component ${comp_sh_id}.on_hand_qty == ${sh_on_hand} == 9, unchanged, and production_order ${po_sh}
        status == ${sh_status} == DRAFT — the rejected reservation commits nothing and leaves no partial
        state
- rule_id: cross_entity_state_dependency
  instances:
  - name: settle_returns_gated_on_car_return_settlement
    grounds:
    - state_machines.LeaseFleetCar.UNDER_REPAIR_to_HELD
    - state_machines.CarAssignment.ACTIVE_to_COMPLETED
    - validations[priority=23]
    - entities.CarReturn.fields.settlement_status
    - entities.LeaseFleetCar.fields.status
    - calculations.mileage_true_up_settlement
    - entities.CarReturn.fields.mileage_overage_cents
    distinguishing_aspect: 'LeaseFleetCar''s UNDER_REPAIR -> HELD transition (POST /api/v1/lease-fleet-cars/{id}/settle-returns)

      is gated on a DIFFERENT entity''s row state: every CarReturn of that car must already carry

      settlement_status == SETTLED. While the car itself sits in the legal from-state UNDER_REPAIR but

      its CarReturn is still PENDING, the call is rejected 409 ERR_UNSETTLED_RETURNS; the same call

      returns 200 only after POST /api/v1/car-returns/{id}/settle flips that CarReturn to SETTLED.

      This is the LeaseFleetCar -> CarReturn entity pair, distinct from the CarAssignment -> LeaseContract

      pair used by the sibling instance.

      '
    test_recipe:
      setup:
      - Logical clock pinned at 2026-09-01T00:00:00Z (the scaffold's startup default); database empty.
      - 'Car type R7A-100 (BOXCAR, build_hours 10, regulatory_life_years 40, line_count_family R7A_LINE)
        with one WHEELSET bill-of-material row: component R7A-WS at qty_per_car 4, unit_cost_cents 100000,
        lead_time_days 20, on_hand_qty 100. Worst gated lead = ceil(20 / 4) = 5 days, so the 19-day horizon
        2026-09-01..2026-09-20 passes the §1.3 production_feasibility_gate.'
      - 'A RETAINED production order for 1 car (planned_shop_days 10 = build_hours 10 * quantity 1) is
        reserved, released against the ACTIVE contract, changed over on line R7A_LINE for [2026-09-05,
        2026-09-15), and completed on 2026-09-15: one LeaseFleetCar in status HELD, built_date 2026-09-15,
        regulatory_life_end_date 2066-09-15, acquisition_cost_cents = unit_price_cents = 875000.'
