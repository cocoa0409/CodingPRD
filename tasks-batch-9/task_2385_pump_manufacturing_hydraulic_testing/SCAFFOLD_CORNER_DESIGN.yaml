      - name: unknown_lot_id_with_a_zero_quantity_defect_returns_not_found_first
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
          - validations[priority=13]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          The path is resolved before the body is judged: a defect report that names a non-existent lot
          AND carries affected_qty 0 must return 404 ERR_NOT_FOUND, never the 422 ERR_ZERO_QUANTITY, so an
          attacker cannot probe body rules against ids they cannot see.
        test_recipe:
          setup:
            - "Empty database apart from the pinned clock; no CastingLot exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /casting-lots/33333333-3333-3333-3333-333333333333/defects"
              payload: { defect_code: "DEF-X", defect_type: "POROSITY", severity: "MINOR", affected_qty: 0 }
              as: QualityInspector
              as_user_id: "qi-301"
          assert:
            - "HTTP status is 404 with error_id ERR_NOT_FOUND"
            - "the response does NOT carry ERR_ZERO_QUANTITY"
            - "GET /casting-defects returns total_count == 0"
