              as: SystemAdmin
            - call: "POST /franchise/restaurants"
              payload: { site_code: "GA-ATL-202", market_code: "GA", baseline_weekly_revenue_cents: 700000, equipment_value_cents: 90000000 }
              as: SystemAdmin
