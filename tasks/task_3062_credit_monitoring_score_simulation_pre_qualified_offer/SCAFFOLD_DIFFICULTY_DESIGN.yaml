  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: consent_record_parallel_axes_and_versioned_archive
        grounds:
          - state_machines.ConsentRecord.PENDING_to_SEALED
          - state_machines.ConsentRecord.SEALED_to_SEALED
          - entities.ConsentRecord.fields.archive_status
        distinguishing_aspect: "ConsentRecord carries two independent state axes on one row — the release axis PENDING → SEALED|NOT_SEALED and the versioned archive axis LIVE → ARCHIVED — so a row can be SEALED and LIVE, SEALED and ARCHIVED, or NOT_SEALED and ARCHIVED, none of which the other axis can infer."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Consumer P rendered, consented (PENDING record) and fundable."
          setup_api_calls:
            - *k_clock
            - *k_consumer_p
            - *k_consent_p
            - *k_resync_a
            - *k_snapshot_p
            - *k_tier_good
            - *k_tier_act
            - *k_item_loan
            - *k_item_act
            - *k_lender
            - *k_lender_act
            - *k_program_loan
            - *k_program_act
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "UTILIZATION_PCT", operator: "LTE", criterion_value: "50", is_hard_requirement: true }
              as: LenderOps
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "DTI_PCT", operator: "LTE", criterion_value: "30", is_hard_requirement: false }
              as: LenderOps
            - *k_prequal_p
            - *k_qualify
            - *k_content_facet
            - *k_facet_accuracy
            - call: "POST /credit/_ops/runs"
              payload: { run_key: "seed-facet-rollup-5" }
              as: PlatformAdmin
            - *k_present
            - call: "POST /credit/offers/${o_id}/render"
              payload: {}
              as: Consumer
              as_user_id: "${c_id}"
            - *k_resync_b
            - call: "POST /credit/consumers/${c_id}/consents/${d_id}/complete"
              payload: { consent_method: "ELECTRONIC", consent_scope: "SHARE_PII_WITH_LENDER", expected_consumer_version: "${cb_v}" }
              as: Consumer
              as_user_id: "${c_id}"
              captures: { cons_id: $.data.id }
          trigger:
            - call: "POST /credit/referrals"
              payload: { external_referral_ref: "NS-L-9006", channel: "WEB", offer_id: "${o_id}" }
              as: LenderOps
              captures: { r3_id: $.data.id }
          assert:
            - "ConsentRecord.${cons_id}.status == SEALED and archive_status == LIVE — the release axis advanced while the archive axis did not"
            - "ConsentRecord.${cons_id}.consumer_pii_ciphertext is non-null and lender_routing_netloc is non-null only after this point"
            - "the same row was PENDING and LIVE before the referral, so the two axes move independently"
            - "there is no transition from SEALED back to PENDING, so the pair (SEALED, ARCHIVED) is reachable only through the archive axis"
            - "Referral.${r3_id}.status == SENT and PreQualificationDecision.${d_id}.decision_status == CONSUMED"

      - name: referral_fork_join_with_divergent_side_effects
        grounds:
          - state_machines.Referral.SENT_to_FUNDED
          - state_machines.PreQualificationDecision.CONSENTED_to_CONSUMED
          - state_machines.DisputeReferral.DRAFT_to_SUBMITTED_OFFLINE
        distinguishing_aspect: "From SENT three branches diverge with different side-effect sets — FUNDED consumes the consent and recognizes revenue, DECLINED releases the consent with no revenue, UNFUNDED releases the consent with no revenue and no actor — and the dispute branch forks independently from the same SENT origin, so the machine is a fork-join rather than a pipeline."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two consumers, two programs, three decisions and three rendered produces across the FUNDED, DECLINED and dispute branches."
          setup_api_calls:
            - *k_clock
            - *k_consumer_p
            - *k_consent_p
            - *k_resync_a
            - *k_snapshot_p
            - *k_tier_good
            - *k_tier_act
            - *k_item_loan
            - *k_item_act
            - *k_lender
            - *k_lender_act
            - *k_program_loan
            - *k_program_act
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "UTILIZATION_PCT", operator: "LTE", criterion_value: "50", is_hard_requirement: true }
              as: LenderOps
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "DTI_PCT", operator: "LTE", criterion_value: "30", is_hard_requirement: false }
              as: LenderOps
            - *k_prequal_p
            - *k_qualify
            - *k_content_facet
            - *k_facet_accuracy
            - call: "POST /credit/_ops/runs"
              payload: { run_key: "seed-facet-rollup-6" }
              as: PlatformAdmin
            - *k_present
            - call: "POST /credit/offers/${o_id}/render"
              payload: {}
              as: Consumer
              as_user_id: "${c_id}"
            - *k_resync_b
            - *k_consent_record
            - call: "POST /credit/referrals"
              payload: { external_referral_ref: "NS-L-9007", channel: "WEB", offer_id: "${o_id}" }
              as: LenderOps
              captures: { rf_id: $.data.id }
            - call: "POST /credit/dispute-referrals"
              payload: { consumer_id: "${c_id}", snapshot_id: "${s_id}", inaccuracy_type: "ACCOUNT_INFO", narrative: "An account that was closed in 2023 still reports an open balance." }
              as: Referee
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /credit/dispute-referrals/${disp_id}/submit"
              payload: { referral_id: "${rf_id}" }
              as: Referee
          assert:
            - "DisputeReferral.${disp_id}.status == SUBMITTED_OFFLINE while Referral.${rf_id}.status is still SENT — the dispute branch forks off without consuming the referral"
            - "DisputeReferral.${disp_id}.referral_count == 1 and consumer.${c_id}.open_dispute_count == 1"
            - "the DECLINED branch is the same SENT origin: POST /credit/referrals/${rf_id}/decline would set status DECLINED and release the consent to NOT_SEALED with no RevenueRecognitionEntry"
            - "the UNFUNDED branch is the same SENT origin: the daily operations run would set status UNFUNDED and release the consent to NOT_SEALED with no actor"
            - "the FUNDED branch is the same SENT origin: it would consume the consent and create a REVENUE entry, so three distinct side-effect sets diverge from one from-state"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: lender_ban_cascade_depth_three
        grounds:
          - state_machines.Lender.ACTIVE_to_ACTIVE
          - state_machines.LenderProgram.ACTIVE_to_PAUSED
          - state_machines.PreQualificationDecision.ELIGIBLE_to_INELIGIBLE
        distinguishing_aspect: "Depth-3 chain whose second and third hops are each caused by the previous hop, not by the original action: the compliance determination pauses the program, and that pause — not the determination — is what cascades the decision to INELIGIBLE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One lender with one ACTIVE program and one ELIGIBLE decision pinned to it."
          setup_api_calls:
            - *k_clock
            - *k_consumer_p
            - *k_consent_p
            - *k_resync_a
            - *k_snapshot_p
            - *k_tier_good
            - *k_tier_act
            - *k_item_loan
            - *k_item_act
            - *k_lender
            - *k_lender_act
            - *k_program_loan
            - *k_program_act
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "UTILIZATION_PCT", operator: "LTE", criterion_value: "50", is_hard_requirement: true }
              as: LenderOps
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "DTI_PCT", operator: "LTE", criterion_value: "30", is_hard_requirement: false }
              as: LenderOps
            - *k_prequal_p
          trigger:
            - call: "POST /credit/lenders/${lender_id}/compliance-status"
              payload: { compliance_status: "BANNED" }
              as: ComplianceOfficer
          assert:
            - "Lender.${lender_id}.compliance_status == BANNED but Lender.${lender_id}.status is still ACTIVE — hop 1 does not touch lender status"
            - "LenderProgram.${prog_id}.status == PAUSED — hop 2 is caused by hop 1, not by the compliance call directly mutating programs"
            - "PreQualificationDecision.${d_id}.decision_status == INELIGIBLE — hop 3 is caused by the program's pause"
            - "PreQualificationDecision.${d_id}.reason == PROGRAM_PAUSED and modeled_odds_pct is null"
            - "no RevenueRecognitionEntry and no Referral exist, so the cascade stopped at the decision"

      - name: snapshot_pull_cascade_depth_two
        grounds:
          - state_machines.BureauSnapshot.PULL_REQUESTED_to_ACTIVE
          - state_machines.BureauSnapshot.ACTIVE_to_SUPERSEDED
          - state_machines.ScoreAlert.PENDING_to_SUPPRESSED
        distinguishing_aspect: "Depth-2 chain where the ScoreAlert suppression is triggered by the new snapshot becoming ACTIVE rather than by the pull call itself, and the same transition also re-pins the existing PREQUALIFIED decision — two second-hop effects from one first-hop cause."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Consumer P with a prior PENDING ScoreAlert from an earlier pull, and a PREQUALIFIED decision on the loan program."
          setup_api_calls:
            - *k_clock
            - *k_consumer_p
            - *k_consent_p
            - *k_resync_a
            - *k_snapshot_p
            - *k_tier_good
            - *k_tier_act
            - *k_item_loan
            - *k_item_act
            - *k_lender
            - *k_lender_act
            - *k_program_loan
            - *k_program_act
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "UTILIZATION_PCT", operator: "LTE", criterion_value: "50", is_hard_requirement: true }
              as: LenderOps
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "DTI_PCT", operator: "LTE", criterion_value: "30", is_hard_requirement: false }
              as: LenderOps
            - *k_prequal_p
            - *k_qualify
            - call: "POST /credit/_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /credit/consumers/${c_id}"
              payload: {}
              as: Consumer
              as_user_id: "${c_id}"
              captures: { cc_v: $.data.version }
            - call: "POST /credit/consumers/${c_id}/bureau-snapshots"
              payload: { score: 690, added_account_count: 0, total_revolving_balance_cents: 420000, credit_limit_total_cents: 1200000, factor_codes: ["high_utilization"], expected_consumer_version: "${cc_v}" }
              as: BureauConnector
              captures: { s2_id: $.data.id, al_id: $.data.id }
            - call: "GET /credit/score-alerts"
              payload: { consumer_id: "${c_id}", status: "PENDING" }
              as: Consumer
              as_user_id: "${c_id}"
              captures: { alert_up: "$.data[0].id" }
            - call: "POST /credit/_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /credit/consumers/${c_id}"
              payload: {}
              as: Consumer
              as_user_id: "${c_id}"
              captures: { cd_v: $.data.version }
            - call: "POST /credit/consumers/${c_id}/bureau-snapshots"
              payload: { score: 620, added_account_count: 1, total_revolving_balance_cents: 480000, credit_limit_total_cents: 1200000, factor_codes: ["high_utilization","recent_late_payment"], expected_consumer_version: "${cd_v}" }
              as: BureauConnector
              captures: { s3_id: $.data.id }
          assert:
            - "BureauSnapshot.${s2_id}.status == SUPERSEDED — hop 1 fired on the second pull"
            - "the ScoreAlert created by the second pull is SCORE_DOWN with threshold_used == 20 and status PENDING"
            - "the PENDING ScoreAlert ${alert_up} from the prior pull is SUPPRESSED rather than deleted — a second-hop effect caused by the new snapshot becoming ACTIVE"
            - "PreQualificationDecision.${d_id}.decision_status == PREQUALIFIED and its snapshot_id is re-pinned to ${s3_id} — the other second-hop effect"
            - "consumer.${c_id}.current_score == 620 and previous_score == 690"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: expired_decision_beats_fiscal_cap_on_consent
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors.ERR_OFFER_EXPIRED
        distinguishing_aspect: "A consent request that is both past the decision's fresh_until and carries a malformed consent_scope reports the priority-5 state error ERR_OFFER_EXPIRED, not the priority-10 ERR_INVALID_REQUEST — the classification of the resulting error is the priority pair, not the state alone."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, then advanced to 2026-12-15T00:00:00Z so the decision's 30-day fresh_until has long passed."
          setup_api_calls:
            - *k_clock
            - *k_consumer_p
            - *k_consent_p
            - *k_resync_a
            - *k_snapshot_p
            - *k_tier_good
            - *k_tier_act
            - *k_item_loan
            - *k_item_act
            - *k_lender
            - *k_lender_act
            - *k_program_loan
            - *k_program_act
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "UTILIZATION_PCT", operator: "LTE", criterion_value: "50", is_hard_requirement: true }
              as: LenderOps
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "DTI_PCT", operator: "LTE", criterion_value: "30", is_hard_requirement: false }
              as: LenderOps
            - *k_prequal_p
            - *k_qualify
            - call: "POST /credit/_clock/set_current_utc"
              payload: { current_utc: "2026-12-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /credit/consumers/${c_id}"
              payload: {}
              as: Consumer
              as_user_id: "${c_id}"
              captures: { cd_v2: $.data.version }
          trigger:
            - call: "POST /credit/consumers/${c_id}/consents/${d_id}/complete"
              payload: { consent_method: "ELECTRONIC", consent_scope: "SHARE_EVERYTHING", expected_consumer_version: "${cd_v2}" }
              as: Consumer
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and ERR_OFFER_EXPIRED is returned — the priority-5 state rule wins over the priority-10 malformed-enum rule"
            - "ERR_INVALID_REQUEST is NOT returned even though consent_scope SHARE_EVERYTHING is not a declared enum member"
            - "no ConsentRecord was created and PreQualificationDecision.${d_id}.decision_status is unchanged"

      - name: forbidden_role_beats_nonexistent_resource
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors.ERR_FORBIDDEN_FOR_ROLE
        distinguishing_aspect: "A BureauConnector calling a consumer-only endpoint with an id that resolves to nothing reports the priority-2 role error ERR_FORBIDDEN_FOR_ROLE, not the priority-3 existence error — authorization is classified before existence even when existence would also fail."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One consumer P on file; no simulation has ever been created for it."
          setup_api_calls:
            - *k_clock
            - *k_consumer_p
            - *k_consent_p
            - *k_resync_a
            - *k_snapshot_p
            - *k_tier_good
            - *k_tier_act
          trigger:
            - call: "POST /credit/consumers/${c_id}/simulations"
              payload: { actions: [{ action_code: "PAY_DOWN_REVOLVING", amount_cents: 50000 }], expected_consumer_version: "${ca_v}" }
              as: BureauConnector
              captures: { err2: $.data.error_id }
          assert:
            - "the response status is 403 and ERR_FORBIDDEN_FOR_ROLE is returned"
            - "the priority-3 existence rule would also have passed trivially, so the returned classification is determined solely by the role rule outranking the business rules"
            - "no ScoreSimulation row was created for ${c_id}"

