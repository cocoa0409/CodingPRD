  # ----------------------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:

      - name: run_publish_blocked_by_denied_market_accreditation
        grounds:
          - validations[priority=43]
          - validations[priority=23]
          - state_machines.AccreditationAudit.OPEN_to_FINALIZED
          - entities.Market.fields.publication_blocked
          - entities.Market.fields.accreditation_status
          - entities.Market.fields.limitation_disclosures
          - endpoints[POST /processing-runs/{processing_run_id}/publish]
          - errors[ERR_PUBLICATION_BLOCKED]
        distinguishing_aspect: |
          Entity pair ProcessingRun -> Market: a fully WEIGHTED run of its own accord cannot publish
          because a sibling entity - the Market, driven by an AccreditationAudit it knows nothing about
          - carries publication_blocked true, and the very same publish call succeeds once a later audit
          finalizes ACCREDITED, with nothing about the run itself having changed.
        test_recipe:
          setup:
            - "Market DMA-515 with one quota cell (target 1), a published 2026Q3 universe of 120000 households and a published edit rule set."
            - "One ACTIVE household with an installed HEALTHY tuner and a 350-minute interval on 2026-08-10."
            - "A run over [2026-08-10T00:00:00Z, 2026-08-11T00:00:00Z) opened by stat-opener-15, edited and weighted FINAL, so it is WEIGHTED with projected_average_audience 29167."
            - "An accreditation audit opened by auditor-opener-15 and finalized DENIED by auditor-closer-15 with limitation_disclosures [SMALL_CELL_SAMPLE], so the market has accreditation_status DENIED, publication_blocked true and one recorded disclosure, and FROZEN has already been released."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Omicron", market_code: "DMA-515", dma_rank: 15, incentive_budget_cents: 1000000 }
              as: PanelOperationsManager
              captures: { m15_id: "$.data.id" }
            - call: "POST /markets/${m15_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 1, base_incentive_cents: 2000 }
              as: PanelOperationsManager
              captures: { cell_r_id: "$.data.id" }
            - call: "POST /edit-rule-sets"
              payload: { label: "RS-2026Q3", missing_interval_ascription_minutes: 60, invalid_tuning_max_minutes: 900, outlier_household_minutes_cap: 1200, outlier_weight_ratio_cap: 2.5, fault_missing_minutes_threshold: 1440 }
              as: MethodologyStatistician
              captures: { rs15_id: "$.data.id" }
            - call: "POST /edit-rule-sets/${rs15_id}/publish"
              payload: {}
              as: MethodologyStatistician
            - call: "GET /markets/${m15_id}"
              payload: {}
              as: MethodologyStatistician
              captures: { m15_v_before_universe: "$.data.version" }
            - call: "POST /universe-estimates"
              payload: { market_id: "${m15_id}", vintage_label: "2026Q3", effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", cell_populations: [{ quota_cell_id: "${cell_r_id}", population_households: 120000, population_persons: 300000 }], expected_market_version: "${m15_v_before_universe}" }
              as: MethodologyStatistician
              captures: { ue15_id: "$.data.id" }
            - call: "POST /universe-estimates/${ue15_id}/publish"
              payload: {}
              as: MethodologyStatistician
            - call: "POST /households"
              payload: { market_id: "${m15_id}", quota_cell_id: "${cell_r_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2 }
              as: PanelOperationsManager
              captures: { hr1_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${hr1_id}", meter_type: "TV_TUNER", serial_no: "MT-001301" }
              as: FieldTechnician
              captures: { mtr1_id: "$.data.id" }
            - call: "POST /meters/${mtr1_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /households/${hr1_id}/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: MethodologyStatistician
            - call: "POST /tuning-intervals"
              payload: { meter_id: "${mtr1_id}", source_methodology: "INHOME_TUNER", start_iso: "2026-08-10T18:00:00Z", end_iso: "2026-08-10T23:50:00Z", station_code: "WXYZ", tuning_minutes: 350 }
              as: MethodologyStatistician
            - call: "GET /markets/${m15_id}"
              payload: {}
              as: MethodologyStatistician
              captures: { m15_v_before_run: "$.data.version" }
            - call: "POST /processing-runs"
              payload: { market_id: "${m15_id}", universe_estimate_id: "${ue15_id}", edit_rule_set_id: "${rs15_id}", window_start_iso: "2026-08-10T00:00:00Z", window_end_iso: "2026-08-11T00:00:00Z", expected_market_version: "${m15_v_before_run}" }
              as: MethodologyStatistician
