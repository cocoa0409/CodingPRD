  - rule_id: cross_entity_state_dependency
    instances:

      - name: plan_activation_gated_by_provider_registration_and_two_acknowledged_roles
        grounds:
          - state_machines.PlanDocument.DRAFT_to_ACTIVE
          - validations[priority=25]
          - validations[priority=26]
          - validations[priority=27]
          - state_machines.FiduciaryRoleAllocation.ALLOCATED_to_ALLOCATED
        distinguishing_aspect: |
          Nothing about the PlanDocument itself decides whether it may activate: the gate is
          entirely on three sibling rows — the sponsoring PooledPlanProvider's
          registration_status, and the acknowledged_at attribute of two separate
          FiduciaryRoleAllocation rows for different statutory roles held by different service
          providers. The same POST therefore fails three different ways in strict priority
          order (25, then 26, then 27) as each sibling is repaired, and only the third repair
          lets it through.
        test_recipe:
          setup:
            - "A PooledPlanProvider still in PENDING_REGISTRATION."
            - "A DRAFT PlanDocument for that provider with a recordkeeper and a trustee engaged."
            - "An ALLOCATED NAMED_FIDUCIARY_3_16 allocation for the recordkeeper and an ALLOCATED TRUSTEE_403A allocation for the trustee, both with acknowledged_at still null."
