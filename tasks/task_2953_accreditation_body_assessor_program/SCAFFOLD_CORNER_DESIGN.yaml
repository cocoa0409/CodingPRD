          Witnessing may only be booked under the plan that is actually APPROVED: with plan A
          CANCELLED by plan B's creation and plan B approved, a session request against plan A must
          return ERR_PLAN_NOT_APPROVED (422) even though the cycle itself is PLANNED, and the
          assessor's ledger must stay at committed 0.
