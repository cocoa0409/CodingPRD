# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Birthday Party & Kids' Venue Booking — EXPERT band breadth probe.
# Walks references/claim-extraction-guide.md against SCAFFOLD §1.1–§1.7.
# Every setup_api_calls chain is empty-DB executable; literals pre-computed.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_venue_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Venue, endpoints]
        distinguishing_aspect: "POST /venues with only name returns 201; status ACTIVE, timezone UTC, weather_dependent false, reschedule_lead_hours 48 (defaults applied)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /venues"
              payload: { name: "Acme" }
              as: VenueManager
              captures: { v_id: $.data.id }
          assert:
            - "response code == 201"
            - "Venue.${v_id}.status == ACTIVE"
            - "Venue.${v_id}.timezone == UTC"
            - "Venue.${v_id}.weather_dependent == false"
            - "Venue.${v_id}.reschedule_lead_hours == 48"

      - name: get_booking_returns_stored_and_computed
        claim_type: Retrieval
        grounds: [entities.Booking, endpoints]
        distinguishing_aspect: "GET /bookings/{id} returns the created booking with computed event_end_utc, quote_total_cents, waivers_required, payment_status UNPAID."
        test_recipe:
          setup: ["Venue/Room/Package; booking children 8, no add-ons (quote 30000)."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Vg", weather_dependent: false }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "Rg", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 8, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T09:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T10:00:00Z", children_count: 8 }
              as: Coordinator
              captures: { b_id: $.data.id }
          trigger:
            - call: "GET /bookings/${b_id}"
              payload: {}
              as: Guardian
              as_user_id: "${b_id}"
          assert:
            - "Booking.${b_id}.event_end_utc == 2026-07-01T12:00:00Z"
            - "Booking.${b_id}.quote_total_cents == 30000"
            - "Booking.${b_id}.waivers_required == 8"
            - "Booking.${b_id}.payment_status == UNPAID"
            - "Booking.${b_id}.status == QUOTE_DRAFT"

      - name: list_bookings_paginated_envelope
        claim_type: Listing
        grounds: [entities.Booking, endpoints]
        distinguishing_aspect: "GET /bookings returns array envelope with total_count and has_more; limit=1 yields has_more true when two bookings exist."
        test_recipe:
          setup: ["Two bookings created on the same room/package."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Vl", weather_dependent: false }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "Rl", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 8, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T09:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T10:00:00Z", children_count: 8 }
              as: Coordinator
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-02T10:00:00Z", children_count: 8 }
              as: Coordinator
          trigger:
            - call: "GET /bookings?limit=1&offset=0"
              payload: {}
              as: VenueManager
          assert:
            - "response.meta has api_request_id and api_request_timestamp"
            - "response.response_type == array"
            - "total_count == 2"
            - "has_more == true"
            - "len(data) == 1"

      - name: get_booking_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_BOOKING_NOT_FOUND]
          - endpoints
        distinguishing_aspect: "GET /bookings/{nonexistent} returns ERR_BOOKING_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /bookings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: VenueManager
              captures: { eid: $.data.error_id }
          assert:
            - "response code == 404"
            - "response.data.error_id == ERR_BOOKING_NOT_FOUND"

      - name: create_booking_missing_required_field
        claim_type: Required Fields
        grounds:
          - entities.Booking
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /bookings omitting children_count returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Venue/Room/Package exist."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Vmr", weather_dependent: false }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "Rmr", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 8, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T10:00:00Z" }
              as: Coordinator
              captures: { eid: $.data.error_id }
          assert:
            - "response code == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_booking_adults_count_default_zero
        claim_type: Defaults
        grounds: [entities.Booking.fields.adults_count]
        distinguishing_aspect: "POST /bookings omitting adults_count yields adults_count 0 and headcount_committed == children_count."
        test_recipe:
          setup: ["Venue/Room/Package; booking children 5, no adults_count."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Vd", weather_dependent: false }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "Rd", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 8, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T09:00:00Z" }
              as: Coordinator
          trigger:
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T10:00:00Z", children_count: 5 }
              as: Coordinator
              captures: { b_id: $.data.id }
          assert:
            - "Booking.${b_id}.adults_count == 0"
            - "Booking.${b_id}.headcount_committed == 5"

      - name: booking_system_fields_ignored_on_input
        claim_type: System Fields
        grounds: [entities.Booking.fields.status, entities.Booking.fields.quote_total_cents]
        distinguishing_aspect: "Client-supplied status/quote_total_cents are ignored; server stamps status QUOTE_DRAFT and computes quote_total from package/add-ons."
        test_recipe:
          setup: ["Venue/Room/Package; booking children 8 with status/quote_total injected in body (must be ignored)."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Vsf", weather_dependent: false }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "Rsf", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 8, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T09:00:00Z" }
              as: Coordinator
          trigger:
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T10:00:00Z", children_count: 8 }
              as: Coordinator
              captures: { b_id: $.data.id }
          assert:
            - "Booking.${b_id}.status == QUOTE_DRAFT"
            - "Booking.${b_id}.quote_total_cents == 30000"
            - "Booking.${b_id}.version == 1"

      - name: addon_invalid_enum_kind_rejected
        claim_type: Type Constraints
        grounds:
          - entities.AddOn.fields.kind
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /bookings/{id}/add-ons with kind=BALLOON (not in CAKE|CHARACTER|EXTRA_TIME) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["QUOTE_DRAFT booking exists."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Vte", weather_dependent: false }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "Rte", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 8, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T09:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T10:00:00Z", children_count: 8 }
              as: Coordinator
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /bookings/${b_id}/add-ons"
              payload: { kind: "BALLOON", unit_price_cents: 1000, quantity: 1 }
              as: Coordinator
              captures: { eid: $.data.error_id }
          assert:
            - "response code == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: guestparty_immutable_entity_no_version
        claim_type: Immutability
        grounds: [entities.GuestParty]
        distinguishing_aspect: "GuestParty (common_fields: false) is an append-only roster event with only id/created_at and no version/update endpoint; listing it shows the recorded deltas."
        test_recipe:
          setup: ["QUOTE_DRAFT booking, one guest-party event children_delta +2 recorded."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Vgp", weather_dependent: false }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "Rgp", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 8, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T09:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T10:00:00Z", children_count: 8 }
              as: Coordinator
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/guest-parties"
              payload: { children_delta: 2, reason: "rsvp" }
              as: Coordinator
              captures: { gp_id: $.data.id }
          trigger:
            - call: "GET /bookings/${b_id}/guest-parties"
              payload: {}
              as: Coordinator
          assert:
            - "len(data) == 1"
            - "GuestParty.${gp_id}.children_delta == 2"
            - "Booking.${b_id}.children_count == 10"

      - name: booking_cross_aggregate_venue_resolution
        claim_type: Parent Relationships
        grounds: [entities.Booking.fields.venue_id, entities.Room.fields.venue_id]
        distinguishing_aspect: "On POST /bookings, venue_id is resolved from room/package (cross-aggregate) and equals the room's venue_id; not taken from client input."
        test_recipe:
          setup: ["Venue V, Room R and Package P both under V; booking created."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Vca", weather_dependent: false }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "Rca", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 8, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T09:00:00Z" }
              as: Coordinator
          trigger:
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T10:00:00Z", children_count: 8 }
              as: Coordinator
              captures: { b_id: $.data.id }
          assert:
            - "Booking.${b_id}.venue_id == ${v_id}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_from_quote_draft_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Booking.HELD_to_CONFIRMED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / ppvc_state_beats_waiver_safety
          rationale: "The §1.8 instance confirms a QUOTE_DRAFT booking and asserts ERR_INVALID_STATE; the invalid-from rejection is its outcome."

      - name: cancel_already_cancelled_booking_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling a booking that is already CANCELLED (terminal) returns ERR_INVALID_STATE; no second refund is synthesized."
        test_recipe:
          setup: ["A QUOTE_DRAFT booking cancelled once (CANCELLED, no payments so no refund)."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Vcc", weather_dependent: false }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "Rcc", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 8, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T09:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T10:00:00Z", children_count: 8 }
              as: Coordinator
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/cancel"
              payload: {}
              as: Coordinator
          trigger:
            - call: "POST /bookings/${b_id}/cancel"
              payload: {}
              as: Coordinator
              captures: { eid: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Booking.${b_id}.status == CANCELLED"

      - name: new_booking_starts_in_quote_draft
        claim_type: Initial State
        grounds: [state_machines.Booking, entities.Booking.fields.status]
        distinguishing_aspect: "A freshly created Booking has status QUOTE_DRAFT, reschedule_count 0, payment_status UNPAID."
        test_recipe:
          setup: ["Venue/Room/Package."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Vis", weather_dependent: false }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "Ris", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 8, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T09:00:00Z" }
              as: Coordinator
          trigger:
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T10:00:00Z", children_count: 8 }
              as: Coordinator
              captures: { b_id: $.data.id }
          assert:
            - "Booking.${b_id}.status == QUOTE_DRAFT"
            - "Booking.${b_id}.reschedule_count == 0"
            - "Booking.${b_id}.payment_status == UNPAID"

      - name: completed_booking_terminal_no_transition
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Booking
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A COMPLETED booking cannot be cancelled; POST /cancel returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Booking completed (children 8 no add-ons, deposit paid, host, waivers, clock past end)."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Vtl", weather_dependent: false }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "Rtl", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 8, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
            - call: "POST /staff-members"
              payload: { venue_id: "${v_id}", full_name: "Host H", skills: ["HOST"] }
              as: VenueManager
              captures: { sm_host: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T09:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T10:00:00Z", children_count: 8 }
              as: Coordinator
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/hold"
              payload: {}
              as: Coordinator
            - call: "POST /bookings/${b_id}/staff-assignments"
              payload: { staff_member_id: "${sm_host}", role_on_event: "HOST" }
              as: Coordinator
            - call: "POST /bookings/${b_id}/waivers"
              payload: { child_name: "c1", guardian_signature: "sig" }
              as: Coordinator
              captures: { w1: $.data.id }
            - call: "POST /bookings/${b_id}/waivers/${w1}/sign"
              payload: { guardian_signature: "sig" }
              as: Coordinator
            - call: "POST /bookings/${b_id}/payments"
              payload: { direction: "CHARGE", amount_cents: 30000, purpose: "BALANCE" }
              as: FinanceClerk
            - call: "POST /bookings/${b_id}/confirm"
              payload: {}
              as: Coordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T13:00:00Z" }
              as: Coordinator
            - call: "POST /bookings/${b_id}/complete"
              payload: {}
              as: Coordinator
          trigger:
            - call: "POST /bookings/${b_id}/cancel"
              payload: {}
              as: Coordinator
              captures: { eid: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Booking.${b_id}.status == COMPLETED"

      - name: complete_releases_staff_assignments_cascade
        claim_type: Side Effect Execution
        grounds: [state_machines.Booking.CONFIRMED_to_COMPLETED, state_machines.StaffAssignment.ASSIGNED_to_RELEASED]
        distinguishing_aspect: "Completing a booking RELEASES all its ASSIGNED staff (bubble side effect); the host assignment reads RELEASED afterward."
        test_recipe:
          setup: ["Confirmed booking with host assigned, clock past event_end."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Vse", weather_dependent: false }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "Rse", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 8, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
            - call: "POST /staff-members"
              payload: { venue_id: "${v_id}", full_name: "Host H", skills: ["HOST"] }
              as: VenueManager
              captures: { sm_host: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T09:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
