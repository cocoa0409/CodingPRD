          assert: ["err == ERR_SNAPSHOT_OUT_OF_FLIGHT", "http status == 422"]

      - name: launch_before_start_date_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_FLIGHT_NOT_STARTED]"]
        distinguishing_aspect: "Clock at 2026-08-01, line item start_date 2026-08-05: LAUNCH → ERR_FLIGHT_NOT_STARTED (422); line item stays TRAFFICKED."
        test_recipe:
          setup: ["IO approved; TRAFFICKED line item (TAGGED creative) with start_date 2026-08-05; clock 2026-08-01"]
