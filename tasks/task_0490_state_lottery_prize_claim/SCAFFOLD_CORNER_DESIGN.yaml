        grounds: ["concurrency_rules[settlement-create-stale-retailer]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Creating a CommissionSettlement with a stale expected_retailer_version (the version observed before another settlement create bumped it) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["an ACTIVE retailer observed at version V; one settlement created (bumps retailer version to V+1); a second create still carrying V"]
          setup_api_calls:
            - call: "POST /games"
              payload: { name: "OccGame", game_type: "DAILY", claim_window_days: 10, federal_withholding_threshold_cents: 600000 }
              as: LotteryOfficer
              captures: { gid: $.data.id }
