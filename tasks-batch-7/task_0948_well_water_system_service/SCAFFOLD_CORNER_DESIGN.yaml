              as: PlatformAdmin
              captures: { well_id: $.data.id }
            - call: "POST /water-service/technicians"
              payload: { full_name: "Payment Version Tech", tier: "JOURNEYMAN", home_jurisdiction_code: "JUR_ALPHA", status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /water-service/part-catalog-items"
              payload: { part_number: "CTL-5000-V", category: "CONTROL", unit_cost_cents: 5000, media_kind: "NONE", on_hand_qty: 10, status: "ACTIVE" }
              as: PlatformAdmin
              captures: { part_id: $.data.id }
            - call: "POST /water-service/emergency-tickets"
              payload: { property_id: "${prop_id}", well_profile_id: "${well_id}", account_id: "${acct_id}", reported_outage_hours: 2.0 }
              as: Dispatcher
              captures: { tkt_id: $.data.id }
            - call: "POST /water-service/emergency-tickets/${tkt_id}/triage"
              payload: {}
              as: Dispatcher
            - call: "POST /water-service/emergency-tickets/${tkt_id}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /water-service/emergency-tickets/${tkt_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /water-service/emergency-tickets/${tkt_id}/diagnosis"
              payload: { cause_class: "CONTROL_FAILURE", onsite_estimate_cents: 20000 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /water-service/work-orders"
              payload: { property_id: "${prop_id}", well_profile_id: "${well_id}", assigned_technician_id: "${tech_id}", scope: "REPAIR", emergency_ticket_id: "${tkt_id}" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /water-service/work-orders/${wo_id}/schedule"
              payload: { scheduled_start_at: "2026-06-01T12:00:00Z", scheduled_end_at: "2026-06-01T14:00:00Z" }
              as: Dispatcher
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
