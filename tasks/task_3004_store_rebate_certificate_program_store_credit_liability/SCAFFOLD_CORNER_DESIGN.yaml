  - section: endpoints
    instances:
      - name: receipt_create_runs_split_scan_and_returns_201
        claim_type: Standard CRUD
        grounds: ["endpoints.POST_/stores/{store_id}/receipts"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / split_transaction_window_half_open_left_edge
          rationale: "Split-scan flag creation and window semantics are asserted by the named §1.8 instance."

      - name: submission_resubmit_refreshes_provisional_after_return
        claim_type: Computed read
        grounds: ["endpoints.POST_/stores/{store_id}/rebate-submissions/{submission_id}/resubmit", calculations.rebate_award]
        distinguishing_aspect: "Resubmission recomputes the provisional award with the provisional variant's rules (returns invisible): rejected at provisional 1100, a full return of the only unit, then resubmit RE-computes provisional as 1100 (unchanged) while resubmit_count moves to 1, status returns to UNDER_REVIEW, and rejection_reason clears."
        test_recipe:
          setup: ["Store S; program P ACTIVE item AAA 0.11; account AC; receipt R (AAA qty 1 @ 10000, purchased 2026-09-08T10:00:00Z) → submitted (provisional 1100) → REJECTED; then line 1 fully returned."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores"
              payload: { store_code: "S-EP2", submission_window_days: 30, certificate_validity_months: 1, expected_breakage_rate: 0.25, split_txn_window_hours: 2, split_txn_min_receipts: 3 }
              as: StoreAdmin
              captures: { s: $.data.id }
