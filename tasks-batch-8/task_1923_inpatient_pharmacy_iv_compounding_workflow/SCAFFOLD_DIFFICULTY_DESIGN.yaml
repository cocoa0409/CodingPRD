              payload: { full_name: "Pat XE", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugXE", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", drug_product_id: "${drug_id}", route: "IV", ordered_dose_mg: 100.0, frequency_per_day: 1, expected_patient_version: "${pat_v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /pharmacy/medication-orders/${ord_id}/verify"
              payload: {}
              as: Pharmacist
            - call: "POST /pharmacy/hoods"
              payload: { name: "HOOD-XE", iso_class: "ISO_5" }
              as: PharmacyAdmin
              captures: { hood_id: $.data.id }
            - call: "POST /pharmacy/hood-sessions"
              payload: { hood_id: "${hood_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-03T00:00:00Z" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /pharmacy/batches"
              payload: { hood_session_id: "${sess_id}", order_ids: ["${ord_id}"], usp_risk_level: "LOW" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /pharmacy/batches/${batch_id}/start"
              payload: {}
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
            - call: "POST /pharmacy/hood-sessions/${sess_id}/start"
              payload: {}
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
            - call: "POST /pharmacy/batches/${batch_id}/start"
              payload: {}
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { b_status: $.data.status }
          assert:
            - "first batch start: error_id == ERR_HOOD_SESSION_NOT_ACTIVE (HTTP 409) because session was SCHEDULED"
            - "after starting the hood session, second batch start succeeds: status == IN_PROGRESS"
            - "HoodSession.${sess_id}.status == IN_USE"
      - name: pocket_dispense_requires_order_verified_and_preparation_qa
        grounds:
          - state_machines.MedicationOrder.fulfillment:READY_to_fulfillment:DISPENSED
          - errors[ERR_ORDER_NOT_VERIFIED]
          - errors[ERR_PREPARATION_NOT_QA_PASSED]
        distinguishing_aspect: |
          Different entity pair (ADCPocket -> MedicationOrder / CompoundedPreparation):
          dispensing from a pocket against an UNVERIFIED order fails ERR_ORDER_NOT_VERIFIED,
          and dispensing an IV order whose linked preparation is still COMPOUNDED (batch not
          yet QA-released) fails ERR_PREPARATION_NOT_QA_PASSED — two distinct cross-entity
          gates on the same dispense path.
        test_recipe:
          setup:
            - "Clock at default; patient; Drug D IV; pocket stocked with 10 units of D"
            - "Order O1 created but NOT verified; order O2 verified and its batch completed (preparation COMPOUNDED, batch QA_REVIEW, not released)"
          setup_api_calls:
