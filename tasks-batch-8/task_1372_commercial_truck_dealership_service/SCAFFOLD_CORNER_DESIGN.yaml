            - { call: "GET /dealership/parts-sale-lines", payload: { parts_sale_id: "${s1}" }, as: PartsCounterRep, captures: { n9: "$.data[0].unit_net_price_cents" } }
            - { call: "GET /dealership/parts-sale-lines", payload: { parts_sale_id: "${s2}" }, as: PartsCounterRep, captures: { n10: "$.data[0].unit_net_price_cents" } }
          assert:
            - "qty 9: unit_net_price_cents == 11249 (round_half_up(12499 * 0.90) = 11249.1 -> 11249)"
            - "qty 10: unit_net_price_cents == 10624 (15% effective discount)"
