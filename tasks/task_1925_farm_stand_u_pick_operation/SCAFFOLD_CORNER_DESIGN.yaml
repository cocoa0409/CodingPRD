            - { call: "POST /farm/fields", payload: { season_id: "${s_id}", name: "North", rotation_group: "RG1", rotation_order: 1, estimated_harvest_oz: 1000 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /farm/sales-days", payload: { season_id: "${s_id}", date: "2026-08-04", day_type: "WEEKDAY", parking_capacity: 50, staff_on_duty: 3 }, as: FarmManager, captures: { day_id: $.data.id } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:30:00Z" }, as: FarmManager }
            - { call: "POST /farm/sales-days/${day_id}/open-day", payload: {}, as: FarmManager }
            - { call: "POST /farm/fields/${f_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/field-day-windows", payload: { field_id: "${f_id}", date: "2026-08-04", open_time: "09:00", close_time: "17:00", picking_capacity_slots: 30 }, as: FarmManager, captures: { w_id: $.data.id } }
            - { call: "POST /farm/field-day-windows/${w_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/waivers", payload: { season_id: "${s_id}", signer_name: "Ann", signer_email: "ann@x.com", party_member_names: ["Ann", "Bob"] }, as: Anonymous, captures: { wv_id: $.data.id } }
            - { call: "POST /farm/visit-sessions", payload: { window_id: "${w_id}", waiver_id: "${wv_id}", party_size: 2, container_count: 0, parking_spaces: 0, origin: "ONLINE" }, as: GateStaff, captures: { vs_id: $.data.id } }
          trigger:
            - { call: "GET /farm/availability-calendar", payload: { from_date: "2026-08-04", to_date: "2026-08-04" }, as: GateStaff, captures: { cal_rows: $.data.rows } }
          assert:
            - "Exactly 1 row returned for 2026-08-04..2026-08-04 (date range filter excludes other dates)"
            - "Row window_id == ${w_id}, window_status == OPEN, field_status == OPEN"
            - "Row booked_slots == 2 (the party-2 session)"
            - "Row projected_remaining_oz == 1000 (no harvest lines yet)"

      - name: response_envelope_shape_on_success_and_error
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "Every success body carries meta.api_request_id, meta.api_request_timestamp, response_type 'object'|'array', and data; every error body carries response_type 'error' with data.error_id and data.message."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: FarmManager, captures: { ok_rtype: $.response_type, ok_req: $.meta.api_request_id, s_id: $.data.id } }
          trigger:
            - { call: "GET /farm/seasons/12345678-1234-1234-1234-123456789abc", payload: {}, as: FarmManager, captures: { err_rtype: $.response_type, err_id: $.data.error_id, err_msg: $.data.message } }
          assert:
            - "Success: response_type == 'object', meta.api_request_id non-empty, data holds the Season"
            - "Error: response_type == 'error', data.error_id == ERR_NOT_FOUND, data.message non-empty, HTTP 404"

