            - { call: "POST /estimates", payload: { customer_id: "${cb}", job_name: "B", quantity_ordered: 100, press_type: "WEB", binding_method: "SADDLE_STITCH", fulfillment_type: "SHIP", signatures: [ { name: "S", pages: 8, up_count: 1, paper_stock_id: "${stock}", make_ready_cents: 1000, rate_per_thousand_cents: 1000 } ], press_spoilage_pct: 0, bindery_spoilage_pct: 0, due_date: "2026-08-20T00:00:00Z" }, as: Estimator, captures: { eb: $.data.id } }
          trigger:
