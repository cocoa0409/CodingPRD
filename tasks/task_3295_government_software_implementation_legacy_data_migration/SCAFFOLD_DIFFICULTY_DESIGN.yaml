      setup:
      - "Agency with blackout ELECTION_FREEZE window 2026-11-01..2026-11-10; contract IMPLEMENTATION; go-live planned 2026-11-05 (inside blackout) created while blackout\
        \ check applies at create \u2014 instead propose date outside blackout at create, then revise to 2026-11-05 after READINESS_CHECKED so both violations hold\
        \ at the second readiness-check."
