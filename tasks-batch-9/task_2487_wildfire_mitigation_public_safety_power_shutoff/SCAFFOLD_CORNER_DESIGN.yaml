            - *k_bravo
            - *k_delta
            - call: "POST /circuits"
              payload: { circuit_code: "INSPECT-1", district_code: "D-SOUTH", hftd_tier: "TIER_1", overhead_miles: 5.0, equipment_condition_index: 90, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: false }
