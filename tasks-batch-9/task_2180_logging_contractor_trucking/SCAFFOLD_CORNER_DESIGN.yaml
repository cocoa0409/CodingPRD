          The seasonal gate reads the logical clock's calendar month: FROZEN_ONLY admits only
          December, January and February, and the clock's 2026-08-01 startup default is August,
          so activation must fail with ERR_SEASONAL_ACCESS_CLOSED while the tract stays
          MOBILIZING.
