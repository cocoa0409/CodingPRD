          expected_product_version: ${p1v}
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          r1: $.data.id
      - call: POST /ladder-ops/design-revisions/${r1}/submit
        payload: {}
        as: DesignEngineer
        as_user_id: eng-1
      - call: POST /ladder-ops/design-revisions/${r1}/review
        payload:
          decision: APPROVE
        as: DesignApprover
        as_user_id: appr-1
      - call: POST /ladder-ops/test-benches
        payload:
          bench_code: BENCH-1
