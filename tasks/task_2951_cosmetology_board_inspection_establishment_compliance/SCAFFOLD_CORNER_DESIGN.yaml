              payload: { establishment_id: "${est_id}", inspection_type: "ROUTINE", window_start_at: "2026-08-03T09:00:00Z", window_end_at: "2026-08-03T17:00:00Z", inspector_user_id: "insp-030" }
              as: Inspector
