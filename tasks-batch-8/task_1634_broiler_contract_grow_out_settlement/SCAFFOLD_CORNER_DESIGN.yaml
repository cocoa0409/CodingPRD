  # Section: cross_cutting_complexity_layers
  # ==================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_flock_version_on_recompute
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[flock-settlement-recompute-stale-version]", "errors[ERR_STALE_FLOCK_VERSION]"]
        distinguishing_aspect: "A recompute carrying the flock's pre-weight-ticket version is rejected with ERR_STALE_FLOCK_VERSION 412; retrying with the fresh version succeeds."
        test_recipe:
          setup: ["HARVESTED flock; client observed version before a late weight ticket posted"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/growers", payload: { grower_code: "G-OCC1", full_name: "Occ One" }, as: IntegratorAdmin, captures: { g: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H1", capacity_birds: 9000 }, as: IntegratorAdmin, captures: { h: $.data.id } }
            - { call: "POST /api/contracts", payload: { grower_id: "${g}", contract_no: "C-OCC1", base_pay_cents_per_lb: 6, committed_house_count: 1, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/contracts/${c}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/settlement-groups", payload: { group_code: "WK-OCC1", week_ending_date: "2026-12-31" }, as: SettlementAnalyst, captures: { grp: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-OCC1" }, as: IntegratorAdmin, captures: { f: $.data.id } }
            - { call: "POST /api/flocks/${f}/placements", payload: { scheduled_date: "2026-08-01", head_count: 5000 }, as: IntegratorAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/placements/${p}/confirm", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f}/feed-deliveries", payload: { delivered_date: "2026-08-05", feed_lbs: 10000, feed_type: STARTER, ticket_no: "FT-OCC1" }, as: IntegratorAdmin }
            - { call: "POST /api/catch-crews", payload: { crew_code: "CREW-OCC1", max_catches_per_day: 2 }, as: LivehaulScheduler, captures: { crew: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f}/catch-schedules", payload: { crew_id: "${crew}", catch_date: "2026-09-10" }, as: LivehaulScheduler, captures: { cs: $.data.id } }
            - { call: "POST /api/flocks/${f}/weight-tickets", payload: { ticket_no: "WT-OCC1", weighed_at: "2026-09-10T08:00:00Z", live_weight_lbs: 5000 }, as: LivehaulScheduler }
            - { call: "POST /api/catch-schedules/${cs}/complete", payload: {}, as: LivehaulScheduler }
            - { call: "GET /api/flocks/${f}", payload: {}, as: SettlementAnalyst, captures: { fv: $.data.version } }
            - { call: "POST /api/flocks/${f}/weight-tickets", payload: { ticket_no: "WT-OCC2", weighed_at: "2026-09-10T09:00:00Z", live_weight_lbs: 1000 }, as: LivehaulScheduler }
          trigger:
            - { call: "POST /api/flocks/${f}/recompute-settlement", payload: { expected_flock_version: "${fv}" }, as: SettlementAnalyst, captures: { err: $.data.error_id } }
            - { call: "GET /api/flocks/${f}", payload: {}, as: SettlementAnalyst, captures: { fv2: $.data.version } }
            - { call: "POST /api/flocks/${f}/recompute-settlement", payload: { expected_flock_version: "${fv2}" }, as: SettlementAnalyst, captures: { net: $.data.net_amount_cents } }
          assert:
            - "stale recompute -> ERR_STALE_FLOCK_VERSION 412"
            - "fresh recompute succeeds; net reflects live_weight_lbs == 6000 (both tickets): base 36000 + bonus 1500 (adj_fcr == group avg in single-member group -> 0.25 c/lb) = net_amount_cents 37500"

      - name: occ_stale_grower_version_on_loan_issue
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[loan-adjust-stale-grower-version]", "errors[ERR_STALE_GROWER_VERSION]"]
        distinguishing_aspect: "Issuing a loan with a stale Grower version (an earlier loan issue already advanced it) -> ERR_STALE_GROWER_VERSION 412."
        test_recipe:
          setup: ["grower created; version observed once; one loan issued (bumps version)"]
          setup_api_calls:
            - { call: "POST /api/growers", payload: { grower_code: "G-OCC2", full_name: "Occ Two" }, as: IntegratorAdmin, captures: { g: $.data.id, gv: $.data.version } }
            - { call: "POST /api/growers/${g}/loans", payload: { principal_cents: 10000, recovery_pct: 10, purpose: OPERATING, expected_grower_version: "${gv}" }, as: IntegratorAdmin }
          trigger:
            - { call: "POST /api/growers/${g}/loans", payload: { principal_cents: 20000, recovery_pct: 10, purpose: OPERATING, expected_grower_version: "${gv}" }, as: IntegratorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "second loan issue with the original version -> ERR_STALE_GROWER_VERSION 412"
            - "Grower.${g}.loan_outstanding_cents remains 10000 (the rejected write had no effect)"

      - name: clock_default_is_fixed_startup_instant
        claim_type: scheduled_actions
        grounds: [endpoints]
        distinguishing_aspect: "Before any set_current_utc call, the logical clock reads exactly 2026-08-01T00:00:00Z — a catch scheduled at flock age 40 days from a 2026-08-01 placement is age-checked against the fixed default, not wall-clock."
        test_recipe:
          setup: ["flock placed 2026-08-01 with the clock never set; GROWING after feed"]
          setup_api_calls:
            - { call: "POST /api/growers", payload: { grower_code: "G-CLK", full_name: "Clock Grower" }, as: IntegratorAdmin, captures: { g: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H1", capacity_birds: 9000 }, as: IntegratorAdmin, captures: { h: $.data.id } }
            - { call: "POST /api/contracts", payload: { grower_id: "${g}", contract_no: "C-CLK", base_pay_cents_per_lb: 6, committed_house_count: 1, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/contracts/${c}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/settlement-groups", payload: { group_code: "WK-CLK", week_ending_date: "2026-12-31" }, as: SettlementAnalyst, captures: { grp: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-CLK" }, as: IntegratorAdmin, captures: { f: $.data.id } }
            - { call: "POST /api/flocks/${f}/placements", payload: { scheduled_date: "2026-08-01", head_count: 1000 }, as: IntegratorAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/placements/${p}/confirm", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f}/feed-deliveries", payload: { delivered_date: "2026-08-02", feed_lbs: 1000, feed_type: STARTER, ticket_no: "FT-CLK" }, as: IntegratorAdmin }
            - { call: "POST /api/catch-crews", payload: { crew_code: "CREW-CLK", max_catches_per_day: 2 }, as: LivehaulScheduler, captures: { crew: $.data.id } }
          trigger:
            - { call: "POST /api/flocks/${f}/catch-schedules", payload: { crew_id: "${crew}", catch_date: "2026-08-20" }, as: LivehaulScheduler, captures: { err: $.data.error_id } }
          assert:
            - "rejected with ERR_FLOCK_TOO_YOUNG — with the default clock at 2026-08-01 the flock's age is 0 days, regardless of wall-clock time"

      - name: derived_fields_reconcile_on_mortality_post
        claim_type: derived_field_reconciliation
        grounds: [entities.Flock.fields.livability_pct, entities.Flock.fields.condemnation_pct]
        distinguishing_aspect: "livability_pct and condemnation_pct recompute on every mortality report: after 300 dead / 40 condemned on 10000 placed, livability 0.97 and condemnation_pct 40/9700."
        test_recipe:
          setup: ["flock PLACED 10000"]
          setup_api_calls:
            - { call: "POST /api/growers", payload: { grower_code: "G-DF", full_name: "Derived Fields" }, as: IntegratorAdmin, captures: { g: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H1", capacity_birds: 20000 }, as: IntegratorAdmin, captures: { h: $.data.id } }
            - { call: "POST /api/contracts", payload: { grower_id: "${g}", contract_no: "C-DF", base_pay_cents_per_lb: 6, committed_house_count: 1, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/contracts/${c}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/settlement-groups", payload: { group_code: "WK-DF", week_ending_date: "2026-12-31" }, as: SettlementAnalyst, captures: { grp: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-DF" }, as: IntegratorAdmin, captures: { f: $.data.id } }
            - { call: "POST /api/flocks/${f}/placements", payload: { scheduled_date: "2026-08-01", head_count: 10000 }, as: IntegratorAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/placements/${p}/confirm", payload: {}, as: IntegratorAdmin }
          trigger:
            - { call: "POST /api/flocks/${f}/mortality-reports", payload: { report_date: "2026-08-10", dead_head: 300, condemned_head: 40 }, as: Grower, as_user_id: "${g}" }
            - { call: "GET /api/flocks/${f}", payload: {}, as: IntegratorAdmin, captures: { liv: $.data.livability_pct, cp: $.data.condemnation_pct } }
          assert:
