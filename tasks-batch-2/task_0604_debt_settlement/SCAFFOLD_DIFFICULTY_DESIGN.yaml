            - "DedicatedAccount.balance after void == 3600.00 (funded 2000 credited back, fee 500 WAIVED)"
            - "Invariant: balance after void == lifetime_deposited (3600.00); cash conserved"

      - name: debt_principal_conserved_on_settlement_void
