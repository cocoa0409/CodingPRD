  - rule_id: cross_entity_state_dependency
    instances:

      - name: loan_relief_transition_gated_by_the_loans_own_origination_state
        grounds:
          - state_machines.ForbearanceDeferment.REQUESTED_to_GRANTED
          - state_machines.Loan.APPROVED_to_IN_SCHOOL
          - state_machines.Loan
          - validations[priority=13]
        distinguishing_aspect: "Entity pair (ForbearanceDeferment, Loan): the identical relief request is refused while the Loan sits in APPROVED and accepted once the Loan reaches IN_SCHOOL, so the relief's valid next-state is decided by the cross-entity Loan state and not by anything on the relief row itself."
