        test_recipe:
          setup:
            - "Three grade-D frame-damaged bikes scrapped, each with a PICKED_UP 2.5kg ALUMINUM ticket picked up in 2026-08 (default clock)"
          setup_api_calls:
            - { call: "POST /donors", payload: { display_name: "D S", donor_type: "ORGANIZATION", email: "ds@x.org" }, as: ShopCoordinator, captures: { d_id: $.data.id } }
