          per_diem_rate_cents: 25000
          liability_bearer: LESSOR
          term_start_date: '2026-09-01'
          term_end_date: '2027-09-01'
          fleet_car_cap: 10
        as: LeaseAdministrator
        captures:
          lc_id: $.data.id
      - call: POST /api/v1/lease-contracts/${lc_id}/activate
        payload: {}
        as: LeaseAdministrator
        captures:
          lc_v_observed: $.data.version
      trigger:
      - call: POST /api/v1/lease-contracts/${lc_id}/amendments
        payload:
          per_diem_rate_cents: 30000
          liability_bearer: LESSEE
          expected_lease_version: ${lc_v_observed}
        as: LeaseAdministrator
        captures:
          lc_v_after_first: $.data.version
      - call: POST /api/v1/lease-contracts/${lc_id}/amendments
        payload:
          per_diem_rate_cents: 32000
          liability_bearer: LESSEE
          expected_lease_version: ${lc_v_observed}
        as: LeaseAdministrator
        captures:
          err_id: $.data.error_id
      - call: GET /api/v1/lease-contracts/${lc_id}
        payload: {}
        as: PlatformAdmin
      assert:
      - the first amendments call with the freshly observed version returns HTTP 200 and status AMENDMENT_DRAFTED
      - the second amendments call reusing ${lc_v_observed} returns HTTP 412
      - error_id == "ERR_STALE_VERSION"
      - LeaseContract.${lc_id}.status == "AMENDMENT_DRAFTED" (unchanged by the stale write)
      - LeaseContract.${lc_id}.version == ${lc_v_after_first} (unchanged by the stale write)
      - LeaseContract.${lc_id}.per_diem_rate_cents == 30000 (the stale redraft's 32000 was not stored)
