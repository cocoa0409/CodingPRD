# =============================================================================
# SCAFFOLD.yaml — task_1547_enrollment_management_yield_modeling
# §1.0–§1.7 (difficulty/corner designs live in their own sibling files)
# =============================================================================

scenario: |
  Enrollment Management & Yield Modeling (university admissions office):
  inquiry-to-application funnel & source attribution, review/decision workflow
  & committee reads, admit-rate & yield prediction with financial-aid
  leveraging, deposit tracking & summer melt intervention, waitlist activation
  & class-shaping targets, transfer & readmit pipeline, capacity by
  program/major, scholarship budget optimization

domain_name: enrollment-yield
api_prefix: /enrollment

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # finite program seats + scholarship budget competed for, reserved, released
  secondary_archetype: multi_party_negotiation  # committee reads with quorum gate before decision
  complexity_layers:
    - optimistic_concurrency                  # OCC on Program.version and Application.version
    - derived_field_reconciliation            # program/cycle counters recomputed on every funnel mutation
    - rate_threshold_triggers                 # melt-risk threshold auto-creates interventions; posture flips at targets
    - selector_policy                         # waitlist activation picks from a ranked candidate pool

  entity_topology: flat                       # peer entities with FK references; no nested URL paths
  state_machine_shape: cyclic                 # Application re-read loop + AidOffer negotiation cycle + branching forks

  relationship_patterns:
    - one_to_many        # Program -> Application, Application -> CommitteeReview/AidOffer/Deposit/Intervention
    - cross_aggregate    # Application references Applicant, Program, AdmissionCycle across aggregate roots

  role_model: peer_roles   # AdmissionsOfficer / ApplicationReader / FinancialAidOfficer / EnrollmentManager own different resources
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: AdmissionCycle
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Cycle display name, e.g. 'Fall 2027'" }
      - { name: application_opens_at, type: datetime, source: input, description: "When application intake opens (ISO 8601 UTC)" }
      - { name: application_deadline_at, type: datetime, source: input, description: "Application deadline; cycle may not close review before this instant" }
      - { name: deposit_deadline_at, type: datetime, source: input, description: "Deposit deadline; deposits accepted while current_utc <= deposit_deadline_at (boundary inclusive)" }
      - { name: census_at, type: datetime, source: input, description: "Census instant; cycle may not close before this" }
      - { name: target_class_size, type: integer, source: input, description: "Class-shaping target across the whole cycle (must be >= 1)" }
      - { name: status, type: enum, source: system, description: "SETUP -> OPEN -> REVIEW_CLOSED -> DECISIONS_RELEASED -> ENROLLMENT_TRACKING -> CLOSED" }
      - { name: inquiry_count, type: integer, source: computed, description: "Count of Applicants with cycle_id == this cycle" }
      - { name: application_count, type: integer, source: computed, description: "Count of Applications in this cycle" }
      - { name: admitted_count, type: integer, source: computed, description: "Applications of this cycle currently in ADMITTED" }
      - { name: deposited_count, type: integer, source: computed, description: "Applications of this cycle currently in DEPOSITED" }
      - { name: enrolled_count, type: integer, source: computed, description: "Applications of this cycle currently in ENROLLED" }
      - { name: decisioned_count, type: integer, source: computed, description: "Applications of this cycle in ADMITTED/DEPOSITED/ENROLLED/MELTED/WITHDRAWN after admission plus DENIED (ever-decisioned)" }
      - { name: admit_rate, type: number, source: computed, description: "= admitted_or_further_count / decisioned_count, 4 decimals round_half_up; 0 when decisioned_count == 0" }

  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> AdmissionCycle.id; the cycle this program/major admits into" }
      - { name: name, type: string, source: input, description: "Program/major name" }
      - { name: capacity_seats, type: integer, source: input, description: "Physical seat capacity; deposits are rejected at == capacity_seats (>= rejects, < accepts)" }
      - { name: target_enrollment, type: integer, source: input, description: "Class-shaping target for this program; must be <= capacity_seats" }
      - { name: tuition_cents, type: integer, source: input, description: "Sticker tuition in cents; basis for aid formulas and aid gap" }
      - { name: scholarship_budget_cents, type: integer, source: input, description: "Total scholarship/scholarship-aid budget for this program" }
      - { name: deposit_amount_cents, type: integer, source: input, description: "Exact deposit amount a deposit must carry" }
      - { name: auto_waitlist_activation, type: boolean, source: input, default: false, description: "When true, a freed seat auto-activates the top-ranked ACTIVE waitlist entry" }
      - { name: admitted_count, type: integer, source: computed, description: "Applications of this program currently in ADMITTED" }
      - { name: deposited_count, type: integer, source: computed, description: "Applications of this program currently in DEPOSITED" }
      - { name: enrolled_count, type: integer, source: computed, description: "Applications of this program currently in ENROLLED" }
      - { name: seats_open, type: integer, source: computed, description: "= capacity_seats - deposited_count - enrolled_count; conserved ledger field" }
      - { name: scholarship_committed_cents, type: integer, source: computed, description: "Sum of amount_cents over AidOffers of this program's applications in status OFFERED or ACCEPTED" }
      - { name: scholarship_available_cents, type: integer, source: computed, description: "= scholarship_budget_cents - scholarship_committed_cents; conserved ledger field" }
      - { name: intake_posture, type: enum, source: computed, description: "OPEN while deposited_count + enrolled_count < target_enrollment and cycle.status in {OPEN, REVIEW_CLOSED, DECISIONS_RELEASED, ENROLLMENT_TRACKING}; PAUSED when deposited_count + enrolled_count >= target_enrollment; CLOSED when cycle.status == CLOSED" }

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> AdmissionCycle.id; the cycle this inquiry is attributed to" }
      - { name: full_name, type: string, source: input, description: "Applicant full name" }
      - { name: email, type: string, source: input, description: "Applicant email; unique within the cycle (ERR_DUPLICATE_APPLICANT_EMAIL)" }
      - { name: applicant_type, type: enum, source: input, description: "FIRST_YEAR | TRANSFER | READMIT" }
      - { name: inquiry_source, type: enum, source: input, description: "WEB_FORM | CAMPUS_VISIT | COLLEGE_FAIR | REFERRAL | PURCHASED_LIST; source-attribution dimension" }
      - { name: distance_band, type: enum, source: input, description: "LOCAL | REGIONAL | NATIONAL | INTERNATIONAL; melt-risk distance factor" }
      - { name: transfer_credit_hours, type: integer, source: input, description: "Required when applicant_type == TRANSFER (ERR_APPLICANT_TYPE_DATA_MISSING); >= 0" }
      - { name: prior_standing, type: enum, source: input, description: "GOOD_STANDING | ACADEMIC_PROBATION | DISMISSED; required when applicant_type == READMIT; DISMISSED rejected (ERR_READMIT_NOT_ELIGIBLE)" }
      - { name: funnel_stage, type: enum, source: system, description: "INQUIRY -> APPLIED (auto on first Application creation); APPLIED is absorbing" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id" }
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: cycle_id, type: string, source: input, description: "FK -> AdmissionCycle.id; must equal both the applicant's cycle_id and the program's cycle_id" }
      - { name: academic_score, type: number, source: input, description: "0..100 academic index; drives merit tiers, yield bands, waitlist rank" }
      - { name: efc_cents, type: integer, source: input, description: "Expected family contribution in cents; >= 0; drives need-based aid" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock at creation; waitlist tie-break (earlier wins)" }
      - { name: review_round, type: integer, source: computed, description: "Starts at 1; +1 on every COMMITTEE_REVIEW -> IN_REVIEW send-back" }
      - { name: submitted_read_count, type: integer, source: computed, description: "CommitteeReviews of this application in SUBMITTED" }
      - { name: aid_accepted_cents, type: integer, source: computed, description: "aid_package_total: sum of amount_cents over AidOffers in ACCEPTED" }
      - { name: aid_gap_cents, type: integer, source: computed, description: "= max(0, program.tuition_cents - aid_accepted_cents)" }
      - { name: melt_risk_score, type: number, source: computed, description: "0..1 weighted risk; variant selected by clock position (standard vs summer_window)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> IN_REVIEW -> COMMITTEE_REVIEW -> DECISION_PENDING -> ADMITTED | DENIED | WAITLISTED; WAITLISTED -> ADMITTED | DENIED | WITHDRAWN; ADMITTED -> DEPOSITED | WITHDRAWN; DEPOSITED -> ENROLLED | MELTED | WITHDRAWN" }

  - name: CommitteeReview
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id" }
      - { name: reader_id, type: string, source: input, description: "Opaque ApplicationReader user id assigned to read; submit requires X-User-ID == reader_id" }
      - { name: window_start_at, type: datetime, source: input, description: "Review window open (inclusive)" }
      - { name: window_end_at, type: datetime, source: input, description: "Review window close (exclusive); half-open [start, end)" }
      - { name: score_academic, type: number, source: input, description: "0..100; set at submit" }
      - { name: score_fit, type: number, source: input, description: "0..100; set at submit" }
      - { name: recommendation, type: enum, source: input, description: "ADMIT | DENY | WAITLIST; set at submit" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock at submit" }
      - { name: status, type: enum, source: system, description: "ASSIGNED -> SUBMITTED | CANCELLED" }

  - name: AidOffer
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id" }
      - { name: fund_type, type: enum, source: input, description: "MERIT | NEED_BASED" }
      - { name: amount_cents, type: integer, source: computed, description: "aid_leveraging_award result at create; recomputed on re-offer (REVISION_REQUESTED -> OFFERED)" }
      - { name: status, type: enum, source: system, description: "OFFERED -> ACCEPTED | DECLINED | REVOKED | SUPERSEDED | REVISION_REQUESTED; REVISION_REQUESTED -> OFFERED | REVOKED; ACCEPTED -> REVOKED" }

  - name: Deposit
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; at most one non-terminal deposit per application (guaranteed by application state gate)" }
      - { name: amount_cents, type: integer, source: input, description: "Must equal program.deposit_amount_cents (ERR_DEPOSIT_AMOUNT_MISMATCH)" }
      - { name: paid_at, type: datetime, source: system, description: "Logical clock at creation" }
      - { name: refund_amount_cents, type: integer, source: computed, description: "amount_cents when REFUNDED; 0 when FORFEITED; null while PAID" }
      - { name: status, type: enum, source: system, description: "PAID -> REFUNDED | FORFEITED" }

  - name: WaitlistEntry
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; created by the WAITLISTED decision transition" }
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; denormalized from the application at entry creation" }
      - { name: rank_score, type: number, source: computed, description: "waitlist_rank_score at entry creation: 0.6*academic_score + 0.4*(100 * ADMIT-recommendations / submitted reads), 4 decimals round_half_up" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> ACTIVATED | EXPIRED | REMOVED" }

  - name: MeltIntervention
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id" }
      - { name: advisor_id, type: string, source: input, description: "Opaque advisor user id; buffer-overlap resource key ('AUTO_QUEUE' reserved for system-created rows)" }
      - { name: intervention_type, type: enum, source: input, description: "OUTREACH_CALL | ADVISOR_MEETING | EMAIL_CAMPAIGN; buffer rule applies only to OUTREACH_CALL and ADVISOR_MEETING" }
      - { name: window_start_at, type: datetime, source: input, description: "Scheduled start (inclusive)" }
      - { name: window_end_at, type: datetime, source: input, description: "Scheduled end (exclusive); must be > window_start_at" }
      - { name: trigger_source, type: enum, source: system, description: "MANUAL (POST /enrollment/interventions) | AUTO_THRESHOLD (created by melt-risk threshold crossing)" }
      - { name: outcome, type: enum, source: input, description: "REACHED_ENGAGED | REACHED_CONFIRMED | NO_CONTACT; required when completing" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> COMPLETED | CANCELLED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: AdmissionCycle
    initial_state: SETUP
    terminal_states: [CLOSED]
    transitions:
      - from: SETUP
        to: OPEN
        trigger: "POST /enrollment/cycles/{cycleId}/advance { to_status: OPEN }"
        actor: EnrollmentManager
        preconditions:
          - "current_utc >= application_opens_at (ERR_PHASE_PRECONDITION_NOT_MET)"
          - "At least one Program with cycle_id == this cycle (ERR_CYCLE_HAS_NO_PROGRAMS)"
        side_effects: []

      - from: OPEN
        to: REVIEW_CLOSED
        trigger: "POST /enrollment/cycles/{cycleId}/advance { to_status: REVIEW_CLOSED }"
        actor: EnrollmentManager
        preconditions:
          - "current_utc >= application_deadline_at (ERR_PHASE_PRECONDITION_NOT_MET)"
        side_effects: []

      - from: REVIEW_CLOSED
        to: DECISIONS_RELEASED
        trigger: "POST /enrollment/cycles/{cycleId}/advance { to_status: DECISIONS_RELEASED }"
        actor: EnrollmentManager
        preconditions:
          - "No Application of this cycle in IN_REVIEW, COMMITTEE_REVIEW, or DECISION_PENDING (ERR_UNRESOLVED_APPLICATIONS)"
        side_effects: []

      - from: DECISIONS_RELEASED
        to: ENROLLMENT_TRACKING
        trigger: "POST /enrollment/cycles/{cycleId}/advance { to_status: ENROLLMENT_TRACKING }"
        actor: EnrollmentManager
        preconditions:
          - "current_utc >= deposit_deadline_at (ERR_PHASE_PRECONDITION_NOT_MET)"
        side_effects: []

      - from: ENROLLMENT_TRACKING
        to: CLOSED
        trigger: "POST /enrollment/cycles/{cycleId}/advance { to_status: CLOSED }"
        actor: EnrollmentManager
        preconditions:
          - "current_utc >= census_at (ERR_PHASE_PRECONDITION_NOT_MET)"
        side_effects:
          - "Cascade link 1: every WaitlistEntry of this cycle's programs in ACTIVE -> EXPIRED"
          - "Cascade link 2: each expired entry's Application in WAITLISTED -> DENIED"
          - "Cascade link 1b: every MeltIntervention of this cycle's applications in SCHEDULED -> CANCELLED"
          - "Recompute program counters and cycle funnel aggregates"

  - entity: Applicant
    initial_state: INQUIRY
    terminal_states: [APPLIED]
    transitions:
      - from: INQUIRY
        to: APPLIED
        trigger: "system (automatic when the applicant's first Application is created)"
        actor: system
        preconditions: []
        side_effects:
          - "Cycle funnel aggregates recompute (inquiry_count unchanged, application_count +1)"

  - entity: Application
    initial_state: SUBMITTED
    terminal_states: [DENIED, ENROLLED, MELTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "POST /enrollment/applications/{applicationId}/transition { to_status: IN_REVIEW }"
        actor: AdmissionsOfficer
        preconditions: []
        side_effects: []

      - from: IN_REVIEW
        to: COMMITTEE_REVIEW
        trigger: "system (automatic when the first CommitteeReview is assigned to this application)"
        actor: system
        preconditions: []
        side_effects: []

      - from: COMMITTEE_REVIEW
        to: IN_REVIEW
        trigger: "POST /enrollment/applications/{applicationId}/transition { to_status: IN_REVIEW } (send-back for additional reads)"
        actor: AdmissionsOfficer
        preconditions: []
        side_effects:
          - "review_round += 1"
          - "All CommitteeReviews of this application in ASSIGNED -> CANCELLED"

      - from: COMMITTEE_REVIEW
        to: DECISION_PENDING
        trigger: "POST /enrollment/applications/{applicationId}/transition { to_status: DECISION_PENDING }"
        actor: AdmissionsOfficer
        preconditions:
          - "submitted_read_count >= REVIEW_QUORUM (2) (ERR_REVIEW_QUORUM_NOT_MET)"
        side_effects: []

      - from: DECISION_PENDING
        to: ADMITTED
        trigger: "POST /enrollment/applications/{applicationId}/transition { to_status: ADMITTED }"
        actor: AdmissionsOfficer
        preconditions:
          - "program.intake_posture == OPEN (ERR_INTAKE_PAUSED)"
          - "cycle.status in {OPEN, REVIEW_CLOSED, DECISIONS_RELEASED} (ERR_CYCLE_PHASE_MISMATCH)"
        side_effects:
          - "program.admitted_count += 1; cycle aggregates recompute; intake_posture recompute"

      - from: DECISION_PENDING
        to: DENIED
        trigger: "POST /enrollment/applications/{applicationId}/transition { to_status: DENIED }"
        actor: AdmissionsOfficer
        preconditions: []
        side_effects:
          - "All CommitteeReviews in ASSIGNED -> CANCELLED"
          - "Cycle decisioned_count recompute"

      - from: DECISION_PENDING
        to: WAITLISTED
        trigger: "POST /enrollment/applications/{applicationId}/transition { to_status: WAITLISTED }"
        actor: AdmissionsOfficer
        preconditions: []
        side_effects:
          - "Create WaitlistEntry(application_id, program_id from application, rank_score via waitlist_rank_score, status ACTIVE)"
          - "All CommitteeReviews in ASSIGNED -> CANCELLED"

      - from: WAITLISTED
        to: ADMITTED
        trigger: "system (waitlist activation: POST /enrollment/waitlist-activations or auto-activation cascade on a freed seat)"
        actor: system
        preconditions:
          - "program.intake_posture == OPEN (ERR_INTAKE_PAUSED)"
          - "cycle.status in {DECISIONS_RELEASED, ENROLLMENT_TRACKING} (ERR_CYCLE_PHASE_MISMATCH)"
          - "An ACTIVE WaitlistEntry exists for this application and was selected (rank_score DESC, tie application.submitted_at ASC)"
        side_effects:
          - "Selected WaitlistEntry -> ACTIVATED"
          - "program.admitted_count += 1; intake_posture recompute"

      - from: WAITLISTED
        to: DENIED
        trigger: "system (cycle-close cascade) or POST /enrollment/applications/{applicationId}/transition { to_status: DENIED }"
        actor: AdmissionsOfficer | system
        preconditions: []
        side_effects:
          - "ACTIVE WaitlistEntry of this application -> REMOVED (manual) or EXPIRED (cycle-close cascade)"

      - from: WAITLISTED
        to: WITHDRAWN
        trigger: "POST /enrollment/applications/{applicationId}/transition { to_status: WITHDRAWN }"
        actor: Applicant | AdmissionsOfficer
        preconditions:
          - "If actor is Applicant: X-User-ID == application.applicant_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "ACTIVE WaitlistEntry -> REMOVED"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /enrollment/applications/{applicationId}/transition { to_status: WITHDRAWN }"
        actor: Applicant | AdmissionsOfficer
        preconditions:
          - "If actor is Applicant: X-User-ID == application.applicant_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: []

      - from: IN_REVIEW
        to: WITHDRAWN
        trigger: "POST /enrollment/applications/{applicationId}/transition { to_status: WITHDRAWN }"
        actor: Applicant | AdmissionsOfficer
        preconditions:
          - "If actor is Applicant: X-User-ID == application.applicant_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: []

      - from: COMMITTEE_REVIEW
        to: WITHDRAWN
        trigger: "POST /enrollment/applications/{applicationId}/transition { to_status: WITHDRAWN }"
        actor: Applicant | AdmissionsOfficer
        preconditions:
          - "If actor is Applicant: X-User-ID == application.applicant_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "All CommitteeReviews in ASSIGNED -> CANCELLED"

      - from: DECISION_PENDING
        to: WITHDRAWN
        trigger: "POST /enrollment/applications/{applicationId}/transition { to_status: WITHDRAWN }"
        actor: Applicant | AdmissionsOfficer
        preconditions:
          - "If actor is Applicant: X-User-ID == application.applicant_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "All CommitteeReviews in ASSIGNED -> CANCELLED"

      - from: ADMITTED
        to: DEPOSITED
        trigger: "system (automatic on successful POST /enrollment/deposits for this application)"
        actor: system
        preconditions: []
        side_effects:
          - "program.admitted_count -= 1; program.deposited_count += 1; seats_open recompute; intake_posture recompute"
          - "melt_risk_score recompute (standard variant); if >= MELT_RISK_THRESHOLD and no SCHEDULED MeltIntervention exists: create one (trigger_source AUTO_THRESHOLD, intervention_type EMAIL_CAMPAIGN, advisor_id 'AUTO_QUEUE', window [now, now+7d))"

      - from: ADMITTED
        to: WITHDRAWN
        trigger: "POST /enrollment/applications/{applicationId}/transition { to_status: WITHDRAWN }"
        actor: Applicant | AdmissionsOfficer
        preconditions:
          - "If actor is Applicant: X-User-ID == application.applicant_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "All AidOffers in OFFERED or REVISION_REQUESTED -> REVOKED; scholarship ledger recompute"
          - "program.admitted_count -= 1; seats_open recompute; intake_posture recompute"

      - from: DEPOSITED
        to: ENROLLED
        trigger: "POST /enrollment/applications/{applicationId}/transition { to_status: ENROLLED }"
        actor: EnrollmentManager
        preconditions:
          - "This application's Deposit is in PAID (implied by DEPOSITED; kept as explicit guard)"
          - "cycle.status in {DECISIONS_RELEASED, ENROLLMENT_TRACKING} (ERR_CYCLE_PHASE_MISMATCH)"
        side_effects:
          - "program.deposited_count -= 1; program.enrolled_count += 1; seats_open recompute; intake_posture recompute"
          - "All MeltInterventions in SCHEDULED -> CANCELLED"

      - from: DEPOSITED
        to: MELTED
        trigger: "system (POST /enrollment/cycles/{cycleId}/melt-sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade link 2: this application's Deposit PAID -> FORFEITED (refund_amount_cents = 0)"
          - "Cascade link 3: program.deposited_count -= 1; seats_open += 1; intake_posture recompute"
          - "Cascade link 4 (only when program.auto_waitlist_activation == true AND intake_posture recomputed OPEN): select top-ranked ACTIVE WaitlistEntry of this program (rank_score DESC, tie application.submitted_at ASC); entry -> ACTIVATED; its Application WAITLISTED -> ADMITTED; program.admitted_count += 1; when the pool is empty the seat simply stays open"
          - "AidOffers in OFFERED/REVISION_REQUESTED/ACCEPTED -> REVOKED; scholarship ledger recompute"

      - from: DEPOSITED
        to: WITHDRAWN
        trigger: "POST /enrollment/applications/{applicationId}/transition { to_status: WITHDRAWN }"
        actor: Applicant | AdmissionsOfficer
        preconditions:
          - "If actor is Applicant: X-User-ID == application.applicant_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Deposit PAID -> REFUNDED when current_utc <= cycle.deposit_deadline_at (refund_amount_cents = amount_cents); PAID -> FORFEITED when current_utc > cycle.deposit_deadline_at (refund_amount_cents = 0)"
          - "program.deposited_count -= 1; seats_open += 1; intake_posture recompute"
          - "AidOffers in OFFERED/REVISION_REQUESTED/ACCEPTED -> REVOKED; scholarship ledger recompute"
          - "Same conditional waitlist auto-activation cascade as DEPOSITED -> MELTED link 4"

  - entity: CommitteeReview
    initial_state: ASSIGNED
    terminal_states: [SUBMITTED, CANCELLED]
    transitions:
      - from: ASSIGNED
        to: SUBMITTED
        trigger: "POST /enrollment/reviews/{reviewId}/submit"
        actor: ApplicationReader
        preconditions:
          - "X-User-ID == review.reader_id (ERR_REVIEWER_MISMATCH)"
          - "window_start_at <= current_utc < window_end_at (ERR_REVIEW_WINDOW_CLOSED)"
          - "score_academic and score_fit within 0..100 (ERR_SCORE_OUT_OF_RANGE)"
        side_effects:
          - "application.submitted_read_count recompute"

      - from: ASSIGNED
        to: CANCELLED
        trigger: "system (send-back, deny, waitlist, or withdraw cascades from the parent Application)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AidOffer
    initial_state: OFFERED
    terminal_states: [ACCEPTED, DECLINED, REVOKED, SUPERSEDED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /enrollment/aid-offers/{aidOfferId}/transition { to_status: ACCEPTED }"
        actor: Applicant
        preconditions:
          - "X-User-ID == application.applicant_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Scholarship ledger recompute (committed includes ACCEPTED); application.aid_accepted_cents / aid_gap_cents / melt_risk_score recompute"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /enrollment/aid-offers/{aidOfferId}/transition { to_status: DECLINED }"
        actor: Applicant
        preconditions:
          - "X-User-ID == application.applicant_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Scholarship ledger recompute (OFFERED leaves committed); application aid fields recompute"

      - from: OFFERED
        to: REVISION_REQUESTED
        trigger: "POST /enrollment/aid-offers/{aidOfferId}/transition { to_status: REVISION_REQUESTED }"
        actor: Applicant
        preconditions:
          - "X-User-ID == application.applicant_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Scholarship ledger recompute: REVISION_REQUESTED is NOT committed (funds released while negotiating)"

      - from: REVISION_REQUESTED
        to: OFFERED
        trigger: "POST /enrollment/aid-offers/{aidOfferId}/transition { to_status: OFFERED } (re-offer)"
        actor: FinancialAidOfficer
        preconditions:
          - "Recomputed aid_leveraging_award base > 0 (ERR_NO_AID_ELIGIBILITY)"
          - "program.scholarship_available_cents > 0 (ERR_SCHOLARSHIP_BUDGET_EXCEEDED)"
        side_effects:
          - "amount_cents recomputed via aid_leveraging_award against CURRENT scholarship_available_cents (this offer contributes 0 to committed while in REVISION_REQUESTED)"
          - "Scholarship ledger recompute (new OFFERED amount enters committed)"

      - from: REVISION_REQUESTED
        to: REVOKED
        trigger: "POST /enrollment/aid-offers/{aidOfferId}/transition { to_status: REVOKED }"
        actor: FinancialAidOfficer
        preconditions: []
        side_effects:
          - "Scholarship ledger recompute"

      - from: OFFERED
        to: REVOKED
        trigger: "POST /enrollment/aid-offers/{aidOfferId}/transition { to_status: REVOKED } or system cascade (application withdraw/melt)"
        actor: FinancialAidOfficer | system
        preconditions: []
        side_effects:
          - "Cascade link 2: scholarship_committed_cents -= amount_cents; scholarship_available_cents += amount_cents"
          - "Cascade link 3: application.aid_accepted_cents / aid_gap_cents / melt_risk_score recompute"

      - from: ACCEPTED
        to: REVOKED
        trigger: "POST /enrollment/aid-offers/{aidOfferId}/transition { to_status: REVOKED } or system cascade (application withdraw/melt)"
        actor: FinancialAidOfficer | system
        preconditions: []
        side_effects:
          - "Cascade link 2: scholarship_committed_cents -= amount_cents; scholarship_available_cents += amount_cents"
          - "Cascade link 3: application.aid_accepted_cents / aid_gap_cents / melt_risk_score recompute"

      - from: OFFERED
        to: SUPERSEDED
        trigger: "system (automatic when a new AidOffer is created for the same application while this one is OFFERED)"
        actor: system
        preconditions: []
        side_effects:
          - "Scholarship ledger recompute (old amount leaves committed, new amount enters)"

  - entity: Deposit
    initial_state: PAID
    terminal_states: [REFUNDED, FORFEITED]
    transitions:
      - from: PAID
        to: REFUNDED
        trigger: "system (DEPOSITED -> WITHDRAWN when current_utc <= cycle.deposit_deadline_at)"
        actor: system
        preconditions: []
        side_effects:
          - "refund_amount_cents = amount_cents"

      - from: PAID
        to: FORFEITED
        trigger: "system (DEPOSITED -> WITHDRAWN after deposit_deadline_at, or DEPOSITED -> MELTED via melt-sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "refund_amount_cents = 0"

  - entity: WaitlistEntry
    initial_state: ACTIVE
    terminal_states: [ACTIVATED, EXPIRED, REMOVED]
    transitions:
      - from: ACTIVE
        to: ACTIVATED
        trigger: "POST /enrollment/waitlist-activations or system auto-activation cascade"
        actor: EnrollmentManager | system
        preconditions:
          - "program.intake_posture == OPEN (ERR_INTAKE_PAUSED)"
          - "cycle.status in {DECISIONS_RELEASED, ENROLLMENT_TRACKING} (ERR_CYCLE_PHASE_MISMATCH)"
          - "Entry selected by pinned selector: eligible = ACTIVE entries of the program; order rank_score DESC, tie application.submitted_at ASC; empty pool -> ERR_WAITLIST_EMPTY"
        side_effects:
          - "Linked Application WAITLISTED -> ADMITTED; program.admitted_count += 1"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (cycle-close cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Linked Application WAITLISTED -> DENIED"

      - from: ACTIVE
        to: REMOVED
        trigger: "system (applicant withdrawal or manual WAITLISTED -> DENIED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MeltIntervention
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /enrollment/interventions/{interventionId}/transition { to_status: COMPLETED, outcome: ... }"
        actor: EnrollmentManager | AdmissionsOfficer
        preconditions:
          - "outcome present and a valid enum member (ERR_INVALID_REQUEST)"
        side_effects:
          - "application.melt_risk_score recompute (engagement factor drops to 0.0 when outcome in {REACHED_ENGAGED, REACHED_CONFIRMED})"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /enrollment/interventions/{interventionId}/transition { to_status: CANCELLED } or system cascades (enroll, cycle close)"
        actor: EnrollmentManager | AdmissionsOfficer | system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: aid-offer-create-stale-application
    parent_entity: Application
    write_endpoint: "POST /enrollment/aid-offers"
    occ_field: expected_application_version
    description: |
      Creating an AidOffer against an Application whose version has advanced
      since the client last observed it is rejected. A successful create
      supersedes any currently OFFERED offer on that application, so a writer
      holding a stale view of the application (e.g., unaware that a transition
      or a prior offer bumped the version) must not be allowed to supersede.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: program-update-stale-version
    parent_entity: Program
    write_endpoint: "PATCH /enrollment/programs/{programId}"
    occ_field: expected_program_version
    description: |
      Updating a Program's capacity, budget, target, or auto-activation flag
      is rejected when the client's expected_program_version no longer matches
      the program's current version — the client's view of the ledger the new
      values must satisfy is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: yield_forecast
    trigger: "GET /enrollment/cycles/{cycleId}/forecast (variant query param); not persisted"
    algorithm: forward_looking
    formula: |
      enrolled_base = cycle.enrolled_count
      deposited_base = cycle.deposited_count
      pipeline = applications of this cycle with status == ADMITTED
                 (excluded: SUBMITTED, IN_REVIEW, COMMITTEE_REVIEW, DECISION_PENDING,
                  WAITLISTED, DENIED, WITHDRAWN, MELTED)
      historical_band variant:
        band_p(academic_score) = 0.65 if score >= 90; 0.45 if 70 <= score < 90; 0.25 if score < 70
        p(app) = band_p(app.academic_score)
      aid_adjusted variant:
        coverage(app) = round(app.aid_accepted_cents / program.tuition_cents, 4) (0 when aid_accepted_cents == 0)
        p(app) = round(min(1.0, band_p(app.academic_score) * (1 + coverage(app))), 4)
      projected_enrollment = round_half_up(enrolled_base + deposited_base + sum(p(app) for app in pipeline)) as integer
      admit_rate reported alongside = cycle.admit_rate
    input_set: "Applications of the cycle in ADMITTED only for the pipeline term; DEPOSITED/ENROLLED enter as bases; all other statuses excluded"
    constants:
      BAND_HIGH_SCORE: 90
      BAND_HIGH_P: 0.65
      BAND_MID_SCORE: 70
      BAND_MID_P: 0.45
      BAND_LOW_P: 0.25
    precision: "probabilities 4 decimal places round_half_up; projected_enrollment integer round_half_up"
    variants:
      - name: historical_band
        when: "variant=historical_band (default)"
        difference: "probability from score band alone; financial aid ignored"
      - name: aid_adjusted
        when: "variant=aid_adjusted"
        difference: "band probability scaled by (1 + aid coverage ratio), capped at 1.0 — identical inputs, higher projection whenever any admitted applicant holds accepted aid"

  - name: melt_risk_score
    trigger: "deposit creation, aid-offer create/accept/decline/revoke/re-offer, intervention completion, and POST /_clock/set_current_utc (recomputes every DEPOSITED application)"
    algorithm: weighted_scoring
    formula: |
      aid_gap_factor = round(min(1, application.aid_gap_cents / program.tuition_cents), 4)  (0 when tuition_cents == 0)
      distance_factor = { LOCAL: 0.0, REGIONAL: 0.3, NATIONAL: 0.6, INTERNATIONAL: 1.0 }[applicant.distance_band]
      engagement_factor = 0.0 if any MeltIntervention of this application is COMPLETED
                          with outcome in {REACHED_ENGAGED, REACHED_CONFIRMED} else 1.0
      time_factor = round(min(1, days_between(deposit.paid_at, current_utc) / 30), 4)
      standard variant (current_utc <= cycle.deposit_deadline_at):
        risk = round(0.40*aid_gap_factor + 0.25*distance_factor + 0.20*engagement_factor + 0.15*time_factor, 4)
      summer_window variant (current_utc > cycle.deposit_deadline_at):
        risk = round(0.50*aid_gap_factor + 0.30*engagement_factor + 0.20*time_factor, 4)
        (distance factor dropped; weights rebalanced)
      Each weighted product is rounded to 4 decimals round_half_up before summing; the sum is rounded to 4 decimals round_half_up.
      Threshold side effect (on every recompute): if application.status == DEPOSITED
      and risk >= MELT_RISK_THRESHOLD and no SCHEDULED MeltIntervention exists for the
      application: create MeltIntervention(trigger_source=AUTO_THRESHOLD,
      intervention_type=EMAIL_CAMPAIGN, advisor_id="AUTO_QUEUE",
      window_start_at=current_utc, window_end_at=current_utc + 7 days).
    input_set: "The single DEPOSITED application; its program tuition; its applicant distance_band; its interventions; its PAID deposit paid_at"
    constants:
      MELT_RISK_THRESHOLD: 0.70
      TIME_FACTOR_FULL_DAYS: 30
    precision: "4 decimal places, round_half_up, per-product rounding before summation"
    variants:
      - name: standard
        when: "current_utc <= cycle.deposit_deadline_at"
        difference: "four-factor weights 0.40/0.25/0.20/0.15 including distance"
      - name: summer_window
        when: "current_utc > cycle.deposit_deadline_at"
        difference: "distance factor dropped; weights 0.50/0.30/0.20 over aid gap, engagement, time — same underlying fields produce a different score"

  - name: aid_leveraging_award
    trigger: "POST /enrollment/aid-offers; AidOffer REVISION_REQUESTED -> OFFERED re-offer"
    algorithm: tiered_pricing
    formula: |
      tuition = program.tuition_cents
      if fund_type == MERIT:
        tier_rate = 0.50 if academic_score >= 95
                    else 0.35 if academic_score >= 90
                    else 0.20 if academic_score >= 80
                    else 0.0
        base = round_half_up(tier_rate * tuition) to integer cents
        fund_cap = MERIT_MAX_CENTS
      else (NEED_BASED):
        need_base = max(0, tuition - application.efc_cents)
        base = round_half_up(min(need_base, 0.60 * tuition)) to integer cents
        fund_cap = NEED_MAX_CENTS
      base = min(base, fund_cap)
      if base == 0: reject ERR_NO_AID_ELIGIBILITY
      if program.scholarship_available_cents == 0: reject ERR_SCHOLARSHIP_BUDGET_EXCEEDED
      award_cents = min(base, program.scholarship_available_cents)
      On re-offer (REVISION_REQUESTED -> OFFERED) the same formula runs against the
      CURRENT scholarship_available_cents (the offer itself contributes 0 to committed
      while in REVISION_REQUESTED).
    input_set: "The target application (academic_score, efc_cents); its program (tuition_cents, scholarship_available_cents)"
    constants:
      MERIT_MAX_CENTS: 2500000
      NEED_MAX_CENTS: 3000000
      NEED_TUITION_COVER_RATE: 0.60
    precision: "integer cents, round_half_up at the base computation; no further rounding"
    variants: []

  - name: aid_package_total
    trigger: "recomputed whenever an AidOffer of the application changes status"
    algorithm: aggregation
    formula: |
      aid_accepted_cents = sum(amount_cents for AidOffers of the application with status == ACCEPTED)
      Rounding order is pinned: every offer's amount_cents was already rounded to integer
      cents (round_half_up) at award time by aid_leveraging_award; the package sums those
      rounded per-offer amounts. The sum itself is NEVER re-rounded.
      aid_gap_cents = max(0, program.tuition_cents - aid_accepted_cents)
    input_set: "AidOffers of the application in ACCEPTED only (OFFERED, REVISION_REQUESTED, DECLINED, REVOKED, SUPERSEDED excluded)"
    constants: {}
    precision: "integer cents; sum of pre-rounded components"
    variants: []

  - name: waitlist_rank_score
    trigger: "WaitlistEntry creation (Application DECISION_PENDING -> WAITLISTED)"
    algorithm: weighted_scoring
    formula: |
      submitted = CommitteeReviews of the application with status == SUBMITTED
      admit_recs = count(submitted where recommendation == ADMIT)
      rec_strength = 100 * admit_recs / len(submitted)   (0 when len(submitted) == 0)
      rank_score = round(0.6 * academic_score + 0.4 * rec_strength, 4)
    input_set: "CommitteeReviews of the application in SUBMITTED only (ASSIGNED/CANCELLED excluded)"
    constants:
      ACADEMIC_WEIGHT: 0.6
      RECOMMENDATION_WEIGHT: 0.4
    precision: "4 decimal places, round_half_up"
    variants: []

  - name: funnel_conversion_report
    trigger: "GET /enrollment/cycles/{cycleId}/funnel-report"
    algorithm: aggregation
    formula: |
      rows = for each inquiry_source s in {WEB_FORM, CAMPUS_VISIT, COLLEGE_FAIR, REFERRAL, PURCHASED_LIST}:
        inquiries = count(Applicants of this cycle with inquiry_source == s)
        applied = count(of those, funnel_stage == APPLIED)
        conversion_rate = round(applied / inquiries, 4) when inquiries > 0 else 0.0
      overall_conversion_rate = round(total_applied / total_inquiries, 4) when total_inquiries > 0 else 0.0
      Rounding order is pinned: the overall rate is computed from the unrounded totals
      and rounded ONCE — it is NOT the average of the per-source rounded rates.
    input_set: "Applicants with cycle_id == this cycle (both INQUIRY and APPLIED funnel stages)"
    constants: {}
    precision: "4 decimal places, round_half_up; per-source rows rounded individually; overall rounded once from totals"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint; for entity-backed ownership endpoints X-User-ID must equal the owning Applicant id (ERR_NOT_RESOURCE_OWNER); for review submit X-User-ID must equal review.reader_id (ERR_REVIEWER_MISMATCH)"
    error_id: "ERR_FORBIDDEN / ERR_NOT_RESOURCE_OWNER / ERR_REVIEWER_MISMATCH"
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path ids exist; body FK references exist (applicant_id, program_id, cycle_id, application_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "Optimistic concurrency: expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /enrollment/aid-offers, PATCH /enrollment/programs/{programId}"

  - priority: 5
    category: state
    check: "Target resource's current state permits the requested transition (covers melt-sweep cycle phase; application-state gate on deposit creation: application must be ADMITTED; review create requires application IN_REVIEW or COMMITTEE_REVIEW; intervention create requires application DEPOSITED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition/advance endpoints, POST /enrollment/deposits, POST /enrollment/cycles/{cycleId}/melt-sweep, POST /enrollment/reviews, POST /enrollment/interventions"

  - priority: 6
    category: business_temporal
    check: "Clock-based window/deadline rules: review window open (ERR_REVIEW_WINDOW_CLOSED); deposit deadline not passed (ERR_DEPOSIT_DEADLINE_PASSED); cycle advance timing preconditions (ERR_PHASE_PRECONDITION_NOT_MET)"
    error_id: "ERR_REVIEW_WINDOW_CLOSED / ERR_DEPOSIT_DEADLINE_PASSED / ERR_PHASE_PRECONDITION_NOT_MET"
    http_status: 409
    applies_to: "submit, deposits, cycle advance"

  - priority: 7
    category: business_constraint
    check: "Field/range/uniqueness/scheduling rules: scores 0..100 (ERR_SCORE_OUT_OF_RANGE); duplicate reader on same application (ERR_DUPLICATE_READER_REVIEW); reviewer window overlap half-open (ERR_REVIEWER_WINDOW_OVERLAP); advisor 15-minute buffer for OUTREACH_CALL/ADVISOR_MEETING (ERR_INTERVENTION_WINDOW_CONFLICT); applicant-type required data (ERR_APPLICANT_TYPE_DATA_MISSING, ERR_READMIT_NOT_ELIGIBLE); applicant email unique per cycle (ERR_DUPLICATE_APPLICANT_EMAIL); program cycles align (ERR_PROGRAM_CYCLE_MISMATCH); target <= capacity (ERR_TARGET_EXCEEDS_CAPACITY); deposit amount exact (ERR_DEPOSIT_AMOUNT_MISMATCH)"
    error_id: "ERR_SCORE_OUT_OF_RANGE / ERR_DUPLICATE_READER_REVIEW / ERR_REVIEWER_WINDOW_OVERLAP / ERR_INTERVENTION_WINDOW_CONFLICT / ERR_APPLICANT_TYPE_DATA_MISSING / ERR_READMIT_NOT_ELIGIBLE / ERR_DUPLICATE_APPLICANT_EMAIL / ERR_PROGRAM_CYCLE_MISMATCH / ERR_TARGET_EXCEEDS_CAPACITY / ERR_DEPOSIT_AMOUNT_MISMATCH"
    http_status: "409 | 422"
    applies_to: "create/update/action endpoints"

  - priority: 8
    category: business_referential
    check: "Cross-entity state references: cycle phase gates on other entities (ERR_CYCLE_PHASE_MISMATCH); program intake_posture OPEN (ERR_INTAKE_PAUSED); review quorum met (ERR_REVIEW_QUORUM_NOT_MET); unresolved applications on cycle advance (ERR_UNRESOLVED_APPLICATIONS); cycle has programs (ERR_CYCLE_HAS_NO_PROGRAMS); no ACCEPTED aid offer exists on new-offer create (ERR_AID_ALREADY_ACCEPTED); waitlist pool non-empty (ERR_WAITLIST_EMPTY)"
    error_id: "ERR_CYCLE_PHASE_MISMATCH / ERR_INTAKE_PAUSED / ERR_REVIEW_QUORUM_NOT_MET / ERR_UNRESOLVED_APPLICATIONS / ERR_CYCLE_HAS_NO_PROGRAMS / ERR_AID_ALREADY_ACCEPTED / ERR_WAITLIST_EMPTY"
    http_status: 409
    applies_to: "decision transitions, deposits, waitlist activation, cycle advance, aid-offer create"

  - priority: 9
    category: business_fiscal
    check: "Capacity/budget last: program seat capacity (ERR_CAPACITY_FULL); scholarship budget checks (ERR_SCHOLARSHIP_BUDGET_EXCEEDED on create/re-offer; ERR_BUDGET_BELOW_COMMITTED on budget patch); aid eligibility base > 0 (ERR_NO_AID_ELIGIBILITY)"
    error_id: "ERR_CAPACITY_FULL / ERR_SCHOLARSHIP_BUDGET_EXCEEDED / ERR_BUDGET_BELOW_COMMITTED / ERR_NO_AID_ELIGIBILITY"
    http_status: "409 | 422"
    applies_to: "POST /enrollment/deposits, aid-offer endpoints, PATCH /enrollment/programs/{programId}"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock (default 2026-08-01T00:00:00Z before any set) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time. Side effect: recomputes time-dependent derived fields (melt_risk_score for every DEPOSITED application, including threshold auto-interventions)."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["melt_risk_score recompute sweep over DEPOSITED applications"]

  # --- AdmissionCycle ---
  - method: POST
    path: "/enrollment/cycles"
    description: "Create an admission cycle (status SETUP)"
    roles: [EnrollmentManager]
    code: 201
    input: [name, application_opens_at, application_deadline_at, deposit_deadline_at, census_at, target_class_size]
    output: AdmissionCycle
    side_effects: ["status=SETUP; all computed counts 0"]

  - method: GET
    path: "/enrollment/cycles/{cycleId}"
    description: "Get a cycle with computed funnel aggregates"
    roles: [SystemAdmin, EnrollmentManager, AdmissionsOfficer, FinancialAidOfficer]
    code: 200
    input: []
    output: AdmissionCycle
    side_effects: []

  - method: POST
    path: "/enrollment/cycles/{cycleId}/advance"
    description: "Advance cycle status per state machine"
    roles: [EnrollmentManager]
    code: 200
    input: [to_status]
    output: AdmissionCycle
    side_effects: ["Cycle state machine transition incl. close cascades", "increments AdmissionCycle.version by 1"]

  - method: GET
    path: "/enrollment/cycles/{cycleId}/forecast"
    description: "Yield forecast (computed read); variant query param historical_band (default) | aid_adjusted"
    roles: [EnrollmentManager, AdmissionsOfficer]
    code: 200
    input: ["variant?"]
    output: { variant: string, projected_enrollment: integer, admit_rate: number, admitted_count: integer, deposited_count: integer, enrolled_count: integer }
    side_effects: []

  - method: GET
    path: "/enrollment/cycles/{cycleId}/funnel-report"
    description: "Inquiry-to-application conversion by inquiry_source (source attribution)"
    roles: [EnrollmentManager, AdmissionsOfficer]
    code: 200
    input: []
    output: { rows: array, inquiry_count: integer, applied_count: integer, overall_conversion_rate: number }
    side_effects: []

  - method: POST
    path: "/enrollment/cycles/{cycleId}/melt-sweep"
    description: "Summer melt sweep: every still-DEPOSITED application of this cycle -> MELTED with full cascade (deposit forfeit, counters, conditional waitlist auto-activation)"
    roles: [EnrollmentManager]
    code: 200
    input: []
    output: { melted_count: integer, melted_application_ids: array, activated_entry_ids: array }
    side_effects: ["Application DEPOSITED -> MELTED cascade per state machine"]

  # --- Program ---
  - method: POST
    path: "/enrollment/programs"
    description: "Create a program/major with capacity, targets, tuition, scholarship budget"
    roles: [EnrollmentManager]
    code: 201
    input: [cycle_id, name, capacity_seats, target_enrollment, tuition_cents, scholarship_budget_cents, deposit_amount_cents, "auto_waitlist_activation?"]
    output: Program
    side_effects: ["counters 0; seats_open = capacity_seats; scholarship_available_cents = scholarship_budget_cents; intake_posture computed"]

  - method: GET
    path: "/enrollment/programs/{programId}"
    description: "Get a program with computed ledger fields"
    roles: [SystemAdmin, EnrollmentManager, AdmissionsOfficer, FinancialAidOfficer]
    code: 200
    input: []
    output: Program
    side_effects: []

  - method: GET
    path: "/enrollment/programs"
    description: "List programs (paginated, filterable)"
    roles: [SystemAdmin, EnrollmentManager, AdmissionsOfficer, FinancialAidOfficer]
    code: 200
    input: ["cycle_id?", "limit?", "offset?"]
    output: Program[]
    side_effects: []

  - method: PATCH
    path: "/enrollment/programs/{programId}"
    description: "Update program capacity/target/budget/auto-activation flag (OCC-guarded)"
    roles: [EnrollmentManager]
    code: 200
    input: ["capacity_seats?", "target_enrollment?", "scholarship_budget_cents?", "auto_waitlist_activation?", expected_program_version]
    output: Program
    side_effects: ["seats_open / scholarship_available_cents / intake_posture recompute", "increments Program.version by 1"]

  # --- Applicant ---
  - method: POST
    path: "/enrollment/applicants"
    description: "Capture an inquiry (creates Applicant in INQUIRY with source attribution)"
    roles: [AdmissionsOfficer]
    code: 201
    input: [cycle_id, full_name, email, applicant_type, inquiry_source, distance_band, "transfer_credit_hours?", "prior_standing?"]
    output: Applicant
    side_effects: ["funnel_stage=INQUIRY; cycle.inquiry_count recompute"]

  - method: GET
    path: "/enrollment/applicants/{applicantId}"
    description: "Get an applicant"
    roles: [SystemAdmin, EnrollmentManager, AdmissionsOfficer, FinancialAidOfficer, Applicant]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  - method: GET
    path: "/enrollment/applicants"
    description: "List applicants (paginated, filterable)"
    roles: [SystemAdmin, EnrollmentManager, AdmissionsOfficer, FinancialAidOfficer]
    code: 200
    input: ["cycle_id?", "inquiry_source?", "funnel_stage?", "limit?", "offset?"]
    output: Applicant[]
    side_effects: []

  # --- Application ---
  - method: POST
    path: "/enrollment/applications"
    description: "Submit an application (side effect: applicant INQUIRY -> APPLIED)"
    roles: [AdmissionsOfficer]
    code: 201
    input: [applicant_id, program_id, cycle_id, academic_score, efc_cents]
    output: Application
    side_effects: ["status=SUBMITTED; submitted_at = logical clock; review_round=1", "Applicant INQUIRY -> APPLIED", "cycle.application_count recompute"]

  - method: GET
    path: "/enrollment/applications/{applicationId}"
    description: "Get an application with computed fields"
    roles: [SystemAdmin, EnrollmentManager, AdmissionsOfficer, FinancialAidOfficer, ApplicationReader, Applicant]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: GET
    path: "/enrollment/applications"
    description: "List applications (paginated, filterable)"
    roles: [SystemAdmin, EnrollmentManager, AdmissionsOfficer, FinancialAidOfficer]
    code: 200
    input: ["cycle_id?", "program_id?", "applicant_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: POST
    path: "/enrollment/applications/{applicationId}/transition"
    description: "Transition application status (review moves, decisions, withdraw, enroll)"
    roles: [AdmissionsOfficer, EnrollmentManager, Applicant]
    code: 200
    input: [to_status]
    output: Application
    side_effects: ["Application state machine transition incl. cascades", "increments Application.version by 1"]

  # --- CommitteeReview ---
  - method: POST
    path: "/enrollment/reviews"
    description: "Assign a committee read; application must be IN_REVIEW or COMMITTEE_REVIEW (ERR_INVALID_STATE otherwise); first assignment moves application IN_REVIEW -> COMMITTEE_REVIEW"
    roles: [AdmissionsOfficer]
    code: 201
    input: [application_id, reader_id, window_start_at, window_end_at]
    output: CommitteeReview
    side_effects: ["status=ASSIGNED", "Application IN_REVIEW -> COMMITTEE_REVIEW when first assignment"]

  - method: GET
    path: "/enrollment/reviews/{reviewId}"
    description: "Get a committee review"
    roles: [SystemAdmin, EnrollmentManager, AdmissionsOfficer, ApplicationReader]
    code: 200
    input: []
    output: CommitteeReview
    side_effects: []

  - method: GET
    path: "/enrollment/reviews"
    description: "List committee reviews (filterable)"
    roles: [SystemAdmin, EnrollmentManager, AdmissionsOfficer, ApplicationReader]
    code: 200
    input: ["application_id?", "reader_id?", "status?", "limit?", "offset?"]
    output: CommitteeReview[]
    side_effects: []

  - method: POST
    path: "/enrollment/reviews/{reviewId}/submit"
    description: "Submit scores and recommendation for an assigned read"
    roles: [ApplicationReader]
    code: 200
    input: [score_academic, score_fit, recommendation]
    output: CommitteeReview
    side_effects: ["status ASSIGNED -> SUBMITTED; submitted_at = logical clock", "application.submitted_read_count recompute"]

  # --- AidOffer ---
  - method: POST
    path: "/enrollment/aid-offers"
    description: "Create a computed aid offer (amount via aid_leveraging_award); supersedes any OFFERED offer on the application; OCC-guarded"
    roles: [FinancialAidOfficer]
    code: 201
    input: [application_id, fund_type, expected_application_version]
    output: AidOffer
    side_effects: ["amount_cents computed", "existing OFFERED offer -> SUPERSEDED", "scholarship ledger recompute", "increments Application.version by 1"]

  - method: GET
    path: "/enrollment/aid-offers/{aidOfferId}"
    description: "Get an aid offer"
    roles: [SystemAdmin, EnrollmentManager, AdmissionsOfficer, FinancialAidOfficer, Applicant]
    code: 200
    input: []
    output: AidOffer
    side_effects: []

  - method: GET
    path: "/enrollment/aid-offers"
    description: "List aid offers (filterable)"
    roles: [SystemAdmin, EnrollmentManager, AdmissionsOfficer, FinancialAidOfficer]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: AidOffer[]
    side_effects: []

  - method: POST
    path: "/enrollment/aid-offers/{aidOfferId}/transition"
    description: "Aid offer lifecycle: accept/decline/request-revision (Applicant owner), re-offer/revoke (FinancialAidOfficer)"
    roles: [FinancialAidOfficer, Applicant]
    code: 200
    input: [to_status]
    output: AidOffer
    side_effects: ["AidOffer state machine transition incl. ledger + application recompute"]

  # --- Deposit ---
  - method: POST
    path: "/enrollment/deposits"
    description: "Pay an enrollment deposit (side effect: application ADMITTED -> DEPOSITED)"
    roles: [Applicant]
    code: 201
    input: [application_id, amount_cents]
    output: Deposit
    side_effects: ["status=PAID; paid_at = logical clock", "Application ADMITTED -> DEPOSITED cascade incl. counters, posture, melt-risk recompute"]

  - method: GET
    path: "/enrollment/deposits/{depositId}"
    description: "Get a deposit"
    roles: [SystemAdmin, EnrollmentManager, AdmissionsOfficer, FinancialAidOfficer, Applicant]
    code: 200
    input: []
    output: Deposit
    side_effects: []

  - method: GET
    path: "/enrollment/deposits"
    description: "List deposits (filterable)"
    roles: [SystemAdmin, EnrollmentManager, AdmissionsOfficer, FinancialAidOfficer]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: Deposit[]
    side_effects: []

  # --- Waitlist ---
  - method: GET
    path: "/enrollment/waitlist-entries/{entryId}"
    description: "Get a waitlist entry"
    roles: [SystemAdmin, EnrollmentManager, AdmissionsOfficer]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: []

  - method: GET
    path: "/enrollment/waitlist-entries"
    description: "List waitlist entries (filterable)"
    roles: [SystemAdmin, EnrollmentManager, AdmissionsOfficer]
    code: 200
    input: ["program_id?", "application_id?", "status?", "limit?", "offset?"]
    output: WaitlistEntry[]
    side_effects: []

  - method: POST
    path: "/enrollment/waitlist-activations"
    description: "Activate the top-ranked ACTIVE waitlist entry of a program (pinned selector)"
    roles: [EnrollmentManager]
    code: 200
    input: [program_id]
    output: WaitlistEntry
    side_effects: ["entry ACTIVE -> ACTIVATED", "linked Application WAITLISTED -> ADMITTED", "program.admitted_count += 1; posture recompute"]

  # --- MeltIntervention ---
  - method: POST
    path: "/enrollment/interventions"
    description: "Schedule a summer-melt intervention; application must be DEPOSITED (ERR_INVALID_STATE otherwise); advisor buffer rule applies to OUTREACH_CALL/ADVISOR_MEETING"
    roles: [EnrollmentManager, AdmissionsOfficer]
    code: 201
    input: [application_id, advisor_id, intervention_type, window_start_at, window_end_at]
    output: MeltIntervention
    side_effects: ["status=SCHEDULED; trigger_source=MANUAL"]

  - method: GET
    path: "/enrollment/interventions/{interventionId}"
    description: "Get an intervention"
    roles: [SystemAdmin, EnrollmentManager, AdmissionsOfficer]
    code: 200
    input: []
    output: MeltIntervention
    side_effects: []

  - method: GET
    path: "/enrollment/interventions"
    description: "List interventions (filterable)"
    roles: [SystemAdmin, EnrollmentManager, AdmissionsOfficer]
    code: 200
    input: ["application_id?", "advisor_id?", "status?", "limit?", "offset?"]
    output: MeltIntervention[]
    side_effects: []

  - method: POST
    path: "/enrollment/interventions/{interventionId}/transition"
    description: "Complete (with outcome) or cancel an intervention"
    roles: [EnrollmentManager, AdmissionsOfficer]
    code: 200
    input: [to_status, "outcome?"]
    output: MeltIntervention
    side_effects: ["SCHEDULED -> COMPLETED recomputes application.melt_risk_score", "SCHEDULED -> CANCELLED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID headers missing or role unknown" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Authenticated role is not in the endpoint's allowed roles" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Applicant role acting on a resource whose applicant_id != X-User-ID" }
  - { id: ERR_REVIEWER_MISMATCH, http: 403, condition: "Review submit with X-User-ID != review.reader_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed value, or invalid enum member" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource's current state does not permit the requested transition/action" }
  - { id: ERR_PHASE_PRECONDITION_NOT_MET, http: 409, condition: "Cycle advance attempted before the phase's clock precondition (opens/deadline/census) is reached" }
  - { id: ERR_CYCLE_HAS_NO_PROGRAMS, http: 409, condition: "SETUP -> OPEN with zero programs in the cycle" }
  - { id: ERR_UNRESOLVED_APPLICATIONS, http: 409, condition: "REVIEW_CLOSED -> DECISIONS_RELEASED while applications remain IN_REVIEW/COMMITTEE_REVIEW/DECISION_PENDING" }
  - { id: ERR_CYCLE_PHASE_MISMATCH, http: 409, condition: "Cross-entity cycle-phase gate failed (admit outside OPEN/REVIEW_CLOSED/DECISIONS_RELEASED; deposit outside DECISIONS_RELEASED; waitlist activation outside DECISIONS_RELEASED/ENROLLMENT_TRACKING; application create outside OPEN)" }
  - { id: ERR_REVIEW_WINDOW_CLOSED, http: 409, condition: "Review submit outside [window_start_at, window_end_at) on the logical clock" }
  - { id: ERR_SCORE_OUT_OF_RANGE, http: 422, condition: "score_academic/score_fit outside 0..100 on submit, or academic_score outside 0..100 on application create" }
  - { id: ERR_DUPLICATE_READER_REVIEW, http: 409, condition: "Same reader_id already holds an ASSIGNED or SUBMITTED review for the same application" }
  - { id: ERR_REVIEWER_WINDOW_OVERLAP, http: 409, condition: "New ASSIGNED review window [start, end) overlaps another ASSIGNED review window for the same reader_id (half-open: end == other start is allowed)" }
  - { id: ERR_INTERVENTION_WINDOW_CONFLICT, http: 409, condition: "New OUTREACH_CALL/ADVISOR_MEETING for advisor_id within 15-minute buffer of another SCHEDULED such intervention ([start, end+15min) exclusion); EMAIL_CAMPAIGN and advisor_id 'AUTO_QUEUE' exempt" }
  - { id: ERR_APPLICANT_TYPE_DATA_MISSING, http: 422, condition: "TRANSFER without transfer_credit_hours, or READMIT without prior_standing" }
  - { id: ERR_READMIT_NOT_ELIGIBLE, http: 422, condition: "READMIT applicant with prior_standing == DISMISSED" }
  - { id: ERR_DUPLICATE_APPLICANT_EMAIL, http: 409, condition: "email already exists on another Applicant of the same cycle" }
  - { id: ERR_PROGRAM_CYCLE_MISMATCH, http: 422, condition: "application's cycle_id != program.cycle_id or != applicant.cycle_id" }
  - { id: ERR_TARGET_EXCEEDS_CAPACITY, http: 422, condition: "target_enrollment > capacity_seats on program create/patch" }
  - { id: ERR_DEPOSIT_AMOUNT_MISMATCH, http: 422, condition: "deposit amount_cents != program.deposit_amount_cents" }
  - { id: ERR_DEPOSIT_DEADLINE_PASSED, http: 409, condition: "deposit create with current_utc > cycle.deposit_deadline_at (boundary: exactly at the deadline is accepted)" }
  - { id: ERR_CAPACITY_FULL, http: 409, condition: "deposit create when program.deposited_count + enrolled_count >= capacity_seats (boundary: == capacity rejects; == capacity-1 accepts)" }
  - { id: ERR_INTAKE_PAUSED, http: 409, condition: "admit/activation while program.intake_posture is PAUSED or CLOSED" }
  - { id: ERR_REVIEW_QUORUM_NOT_MET, http: 409, condition: "COMMITTEE_REVIEW -> DECISION_PENDING with submitted_read_count < 2" }
  - { id: ERR_SCHOLARSHIP_BUDGET_EXCEEDED, http: 409, condition: "aid-offer create/re-offer with positive computed base but scholarship_available_cents == 0" }
  - { id: ERR_NO_AID_ELIGIBILITY, http: 422, condition: "aid_leveraging_award base computes to 0 (score below 80 for MERIT, or need_base 0 for NEED_BASED)" }
  - { id: ERR_BUDGET_BELOW_COMMITTED, http: 409, condition: "PATCH scholarship_budget_cents below current scholarship_committed_cents" }
  - { id: ERR_WAITLIST_EMPTY, http: 409, condition: "waitlist activation with no ACTIVE entry for the program" }
  - { id: ERR_AID_ALREADY_ACCEPTED, http: 409, condition: "aid-offer create while the application already has an ACCEPTED offer" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Platform operator; drives the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across resources"

  - name: EnrollmentManager
    description: "Owns cycles, programs, deposits reporting, waitlist activation, melt sweep, interventions"
    identity: opaque
    exclusive_operations:
      - "POST /enrollment/cycles, POST /enrollment/cycles/{id}/advance, POST /enrollment/cycles/{id}/melt-sweep"
      - "POST /enrollment/programs, PATCH /enrollment/programs/{id}"
      - "POST /enrollment/waitlist-activations"
      - "Application transition to ENROLLED"
    shared_operations:
      - "GET reads; POST /enrollment/interventions and intervention transitions; forecast/funnel reads"

  - name: AdmissionsOfficer
    description: "Owns inquiry intake, application submission, review assignment, application decisions"
    identity: opaque
    exclusive_operations:
      - "POST /enrollment/applicants"
      - "POST /enrollment/applications"
      - "POST /enrollment/reviews"
      - "Application transitions to IN_REVIEW / DECISION_PENDING / ADMITTED / DENIED / WAITLISTED (staff side)"
    shared_operations:
      - "GET reads; WITHDRAWN transitions; interventions; forecast/funnel reads"

  - name: ApplicationReader
    description: "Committee reader; submits reads assigned to their opaque user id"
    identity: opaque
    exclusive_operations:
      - "POST /enrollment/reviews/{reviewId}/submit (only when X-User-ID == review.reader_id)"
    shared_operations:
      - "GET /enrollment/reviews, GET /enrollment/reviews/{id}, GET /enrollment/applications/{id}"

  - name: FinancialAidOfficer
    description: "Owns aid offers and scholarship budget consumption"
    identity: opaque
    exclusive_operations:
      - "POST /enrollment/aid-offers"
      - "AidOffer transitions to OFFERED (re-offer) and REVOKED"
    shared_operations:
      - "GET reads"

  - name: Applicant
    description: "The applicant acting on their own resources"
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /enrollment/deposits (own application only)"
      - "AidOffer transitions to ACCEPTED / DECLINED / REVISION_REQUESTED (own application only)"
      - "Application transition to WITHDRAWN (own application only)"
    shared_operations:
      - "GET own applicant/application/aid-offer/deposit records"
