  # ==========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: pax_add_then_remove_conserves_sheet_index_moment
        conserved_quantity: "the load sheet's takeoff weight and takeoff index moment"
        invariant_formula: |
          final_takeoff_weight_kg == round2(issued_takeoff_weight_kg
                                    + sum of weight_delta_kg over APPLIED LastMinuteChange rows)
          final_index_tow        == round2(issued_index_tow
                                    + sum of index_delta over APPLIED LastMinuteChange rows)
          final_payload_kg       == round2(issued_payload_kg + lmc_net_weight_delta_kg)
          final_mac_tow_pct      == pct_mac(final_index_tow, final_takeoff_weight_kg)
        grounds:
          - calculations.calculate_lmc_allowance
          - entities.LoadSheet.fields.final_index_tow
          - state_machines.LoadSheet.transitions.ACCEPTED_to_AMENDED
        distinguishing_aspect: |
          Adding two adults to cabin zone OC and then removing two adults from the
          same zone returns lmc_net_weight_delta_kg to 0.00 and drives every final_*
          figure back to its issued value to the last centikilogram - but
          lmc_absolute_weight_delta_kg is a one-way counter and must read 352.00,
          so the sheet is provably NOT in its original state even though its
          weights are. The post-departure amendment then recomputes the same
          figures from the two APPLIED rows and must not drift, which catches
          implementations that accumulate final_* incrementally instead of
          re-deriving it from the issued baseline.
        test_recipe:
          setup:
            - "Aircraft HB-AAA with cabin zone OC and holds H1, H4; runway LSGG/04 with the [15, 30) band; STANDARD program; flight at 22 C, 6 kt, DRY."
            - "Plan: OC 50 male / 6 child / 4 infant = 4650.00, H1 bags 1450.00, one 400.00 kg GENERAL consignment in H4 -> base_payload_kg 6500.00, underload_kg 13680.00."
            - "Sheet 1 is issued by lc-01 (lmc_allowance_kg 500.00) and accepted by cpt-01."
