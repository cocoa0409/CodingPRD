    - errors[ERR_NOT_SHORT_DATED]
    - calculations.short_date_credit_value
    distinguishing_aspect: "Metric: whole days-to-expiry on POST /vet/short-date-credits \u2014 a\ndifferent metric (day count) and endpoint than the money boundary:\ndays == 180 is ELIGIBLE (25% tier,\
      \ claimed 250c for a 999c unit)\nwhile days == 181 is rejected ERR_NOT_SHORT_DATED.\n"
