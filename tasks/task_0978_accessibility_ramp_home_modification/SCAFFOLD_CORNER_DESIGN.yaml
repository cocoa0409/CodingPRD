              as: Assessor
            - call: "POST /cases/${case_id}/assessments/${asmt1_id}/complete"
              payload: { mobility_score: 50, hazard_count: 1, recommended_modifications: ["RAMP"] }
              as: Assessor
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v_pre: $.data.version }
            - call: "POST /cases/${case_id}/assessments"
              payload: { assessor_id: "ot-61", assessor_role: "CAPS", assessment_type: "REASSESSMENT", scheduled_date: "2026-05-01T00:00:00Z", mobility_score: 55, hazard_count: 0 }
              as: IntakeCoordinator
              captures: { asmt2_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments/${asmt2_id}/start"
              payload: {}
              as: Assessor
            - call: "POST /cases/${case_id}/assessments/${asmt2_id}/complete"
              payload: { mobility_score: 55, hazard_count: 0, recommended_modifications: ["RAILS"] }
              as: Assessor
          trigger:
            - call: "POST /cases/${case_id}/quotes"
              payload: { valid_until: "2026-12-31T00:00:00Z", expected_case_version: "${case_v_pre}" }
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "error_id == ERR_STALE_VERSION"
            - "Case.${case_id} has no DRAFT quote (write rejected, version not consumed)"

      - name: occ_funding_approve_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[funding-approve-stale-case]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "funding-approve-stale-case: an approve carrying the case version observed before an intervening assessment completion bumped Case.version is rejected with 412, and the funding source stays PENDING."
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z; case ASSESSED; funding source PENDING"
            - "case_v_pre captured, THEN an assessment round bumps Case.version"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cases"
              payload: { client_name: "Occ Two", client_address: "72 Occ Rd", client_phone: "555-0802" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments"
              payload: { assessor_id: "ot-62", assessor_role: "OT", assessment_type: "INITIAL", scheduled_date: "2026-05-01T00:00:00Z", mobility_score: 50, hazard_count: 1 }
              as: IntakeCoordinator
              captures: { asmt1_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments/${asmt1_id}/start"
              payload: {}
              as: Assessor
            - call: "POST /cases/${case_id}/assessments/${asmt1_id}/complete"
              payload: { mobility_score: 50, hazard_count: 1, recommended_modifications: ["RAMP"] }
              as: Assessor
            - call: "POST /cases/${case_id}/funding-sources"
              payload: { source_type: "VA_BENEFIT", program_name: "VA3", requested_cents: 9000, priority_rank: 1 }
              as: FundingCoordinator
              captures: { fs_id: $.data.id }
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v_pre: $.data.version }
            - call: "POST /cases/${case_id}/assessments"
              payload: { assessor_id: "ot-63", assessor_role: "OT", assessment_type: "REASSESSMENT", scheduled_date: "2026-05-01T00:00:00Z", mobility_score: 60, hazard_count: 0 }
              as: IntakeCoordinator
              captures: { asmt2_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments/${asmt2_id}/start"
              payload: {}
              as: Assessor
            - call: "POST /cases/${case_id}/assessments/${asmt2_id}/complete"
              payload: { mobility_score: 60, hazard_count: 0, recommended_modifications: ["RAILS"] }
              as: Assessor
          trigger:
            - call: "POST /cases/${case_id}/funding-sources/${fs_id}/approve"
              payload: { approved_cents: 9000, expected_case_version: "${case_v_pre}" }
              as: FundingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "error_id == ERR_STALE_VERSION"
            - "FundingSource.${fs_id}.status == PENDING (unchanged)"

      - name: occ_invoice_send_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[invoice-send-stale-case]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "invoice-send-stale-case: a send carrying the case version observed before an assessment-driven Case mutation is rejected with 412; the invoice stays DRAFT and case billing totals stay 0."
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z; case INTAKE; DRAFT invoice with one line 2000"
            - "case_v_pre captured, THEN an assessment create/complete round bumps Case.version"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cases"
              payload: { client_name: "Occ Three", client_address: "73 Occ Rd", client_phone: "555-0803" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v1: $.data.version }
            - call: "POST /cases/${case_id}/invoices"
              payload: { invoice_type: "SERVICE_CALL", due_date: "2026-06-01T00:00:00Z", expected_case_version: "${case_v1}" }
              as: BillingCoordinator
              captures: { inv_id: $.data.id }
            - call: "POST /cases/${case_id}/invoices/${inv_id}/line-items"
              payload: { description: "Svc", quantity: 1, unit_price_cents: 2000, tax_rate_pct: 0.0 }
              as: BillingCoordinator
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v_pre: $.data.version }
            - call: "POST /cases/${case_id}/assessments"
              payload: { assessor_id: "ot-64", assessor_role: "OT", assessment_type: "INITIAL", scheduled_date: "2026-05-01T00:00:00Z", mobility_score: 50, hazard_count: 1 }
              as: IntakeCoordinator
              captures: { asmt_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/start"
              payload: {}
              as: Assessor
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/complete"
              payload: { mobility_score: 50, hazard_count: 1, recommended_modifications: ["RAMP"] }
              as: Assessor
          trigger:
            - call: "POST /cases/${case_id}/invoices/${inv_id}/send"
              payload: { expected_case_version: "${case_v_pre}" }
              as: BillingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "error_id == ERR_STALE_VERSION"
            - "Invoice.${inv_id}.status == DRAFT"
            - "Case.${case_id}.total_billed_cents == 0"

      - name: case_version_increments_on_each_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.Case.fields.version
          - concurrency_rules[quote-create-stale-case]
        distinguishing_aspect: "Version monotonicity: Case.version starts at 1 on create and becomes exactly 2 after the assessment-creation side effect (INTAKE -> ASSESSMENT_SCHEDULED), giving OCC callers an observable increment per mutation."
        test_recipe:
          setup: ["Clock at 2026-05-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /cases"
              payload: { client_name: "Ver Bump", client_address: "74 Version Rd", client_phone: "555-0804" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id, v_at_create: $.data.version }
            - call: "POST /cases/${case_id}/assessments"
              payload: { assessor_id: "ot-65", assessor_role: "OT", assessment_type: "INITIAL", scheduled_date: "2026-05-01T00:00:00Z", mobility_score: 50, hazard_count: 1 }
              as: IntakeCoordinator
              captures: { asmt_id: $.data.id }
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { v_after: $.data.version }
          assert:
            - "Case.version at create == 1"
            - "Case.version after assessment create == 2 (exactly +1 per mutation)"
            - "updated_at after the mutation > updated_at at create"

      - name: reassessment_becomes_overdue_after_due_date
        claim_type: scheduled_actions
        grounds:
          - state_machines.ReassessmentSchedule.PENDING_to_OVERDUE
        distinguishing_aspect: "Scheduled/deferred system transition: a PENDING reassessment with due_date 2026-06-01 reads OVERDUE once the logical clock passes to 2026-06-02."
        test_recipe:
          setup: ["Case exists; ReassessmentSchedule PENDING due 2026-06-01; clock then advanced to 2026-06-02"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cases"
              payload: { client_name: "Sched Due", client_address: "75 Due Rd", client_phone: "555-0805" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/reassessment-schedules"
              payload: { trigger_event: "TIME_BASED", due_date: "2026-06-01T00:00:00Z", priority: "ROUTINE" }
              as: IntakeCoordinator
              captures: { sched_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: SystemAdmin
            - call: "GET /cases/${case_id}/reassessment-schedules/${sched_id}"
              as: Any
          assert:
            - "ReassessmentSchedule.${sched_id}.status == OVERDUE"

      - name: derived_fields_consistent_after_reversal
        claim_type: derived_field_reconciliation
        grounds:
          - entities.FundingSource.fields.remaining_cents
          - entities.Case.fields.total_funded_cents
        excluded_because:
          difficulty_instance: allocation_commit_reverse_conserves_remaining_cents
          rationale: "Remaining-cents reconciliation after COMMITTED -> REVERSED is the core assertion of the named §1.8 compensating-invariant instance."

  # ===========================================================================
  # Section: consistency_model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: writes_visible_immediately_after_mutation
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - entities.Case.fields.updated_at
        distinguishing_aspect: "Immediate consistency: a mutation's effects are fully observable in the very next read — no lag, no stale denormalized fields."
        test_recipe:
          setup: ["Clock at 2026-05-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /cases"
              payload: { client_name: "Imm Read", client_address: "76 Now St", client_phone: "555-0901", referral_source: "AGENCY" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "GET /cases/${case_id}"
              as: Any
          assert:
            - "GET immediately after POST returns client_name == 'Imm Read', referral_source == 'AGENCY', status == INTAKE, version == 1"
            - "POST response body and subsequent GET body agree on every stored field (same-request visibility, no reconciliation delay)"
