  - rule_id: combinatorial_formula
    instances:
      - name: risk_score_rounds_each_component_before_summing
        grounds:
          - calculations.readmission_risk_score
          - entities.RiskAssessment.fields.comorbidity_points
          - entities.RiskAssessment.fields.social_modifier_points
          - entities.RiskAssessment.fields.risk_score
        distinguishing_aspect: |
          Mode (b) - nested rounding whose ORDER changes the answer. With
          comorbidity_count 5 (raw 12.5) and social_risk_flags_count 3 (raw
          7.5), rounding each component half-up before summing yields
          6 + 6 + 13 + 11 + 8 = 44, while summing the raw products first and
          rounding once yields 43; the scaffold pins the per-component order.
        test_recipe:
          setup:
            - "Clock at 2026-05-01T16:00:00Z; IN_NETWORK facility, TCM-covered BUSINESS_DAYS payer, navigator with cap 5, one patient."
            - "One RECEIVED referral discharged 2026-05-01, INPATIENT 4 days, URGENT, comorbidity_count 5, prior_ed_visits_6mo 2, prior_admissions_6mo 1, social_risk_flags_count 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T16:00:00Z" }
              as: ProgramAdmin
            - call: "POST /tcm/facilities"
              payload: { name: "Mercy General", facility_type: "ACUTE_HOSPITAL", network_status: "IN_NETWORK" }
              as: ProgramAdmin
