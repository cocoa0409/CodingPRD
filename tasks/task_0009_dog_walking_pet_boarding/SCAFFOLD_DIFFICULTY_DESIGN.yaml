              as: PlatformAdmin
            - call: "POST /api/v1/bookings/${b6_a_id}/start"
              payload: {}
              as: Sitter
              as_user_id: "${s6_id}"
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-07T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/bookings/${b6_a_id}/complete"
              payload: { owner_rating: 3 }
              as: Sitter
              as_user_id: "${s6_id}"
            - call: "POST /api/v1/insurance-claims"
