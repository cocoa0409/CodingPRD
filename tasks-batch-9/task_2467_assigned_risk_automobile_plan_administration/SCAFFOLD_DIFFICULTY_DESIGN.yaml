  - rule_id: resource_temporal_overlap
    instances:
      - name: vehicle_policy_terms_are_half_open_so_adjacency_is_legal
        grounds:
          - validations[priority=10][error_id=ERR_POLICY_TERM_OVERLAP]
          - validations[priority=10][error_id=ERR_POLICY_TERM_INVALID]
          - entities.Policy.fields.effective_date
          - entities.Policy.fields.expiration_date
          - errors[ERR_POLICY_TERM_OVERLAP]
        distinguishing_aspect: |
          Interval semantics under test: a Vehicle's policy terms are HALF-OPEN
          [effective_date, expiration_date), so a term starting one day before the incumbent
          expires overlaps and is refused, while a term starting exactly on the incumbent's
          expiration date touches but does not intersect and is accepted. The resource is the
          Vehicle and the overlap is carrier-agnostic — the two policies belong to different
          carriers. The sibling instance uses CLOSED intervals with a mandatory clear-day gap on a
          different resource entity.
