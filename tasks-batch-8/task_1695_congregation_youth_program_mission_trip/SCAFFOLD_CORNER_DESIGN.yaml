          assert:
            - "r1_status == APPROVED; r2_status == WAITLISTED and r3_status == WAITLISTED (fork at seats_taken == capacity boundary; waitlisting is success, not an error)"
            - "e_full == ERR_NO_WAITLIST_CAPACITY (promote while seats_taken >= capacity)"
            - "e_head == ERR_WAITLIST_NOT_HEAD (reg3 created after reg2; created_at ASC selector, never id)"
