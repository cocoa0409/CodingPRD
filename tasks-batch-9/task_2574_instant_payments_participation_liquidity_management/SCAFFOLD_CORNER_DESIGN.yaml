      - name: velocity_window_excludes_diverted_transfer
        claim_type: Input Set Filtering
        grounds:
          - calculations.velocity_window_usage
          - validations[priority=94]
          - state_machines.CreditTransfer.QUEUED_THROTTLED_to_DIVERTED
        distinguishing_aspect: "Only the five countable clearing states feed the velocity window: a transfer diverted to a fallback rail leaves the input set entirely, so with a rolling_window_count_limit of 1 a second transfer inside the same 60-minute window is admitted - an implementation that counts every row created in the window refuses it."
        test_recipe:
          setup:
            - "Alpha National Bank is LIVE with a position account opened at 1,200,000,000 cents (warning 1,100,000,000 / critical 1,000,000,000 / floor 200,000,000) and a CORPORATE policy whose rolling_window_count_limit is 1 (per-transaction 250,000,000, daily 500,000,000, window amount 400,000,000)."
            - "At 13:00 customer account CUST-ALPHA-0001 originates T1 for 10,000,000 cents; it scores 57 and stays INITIATED."
            - "At 13:05 a PARTICIPANT-scoped FULL_OUTAGE with fallback_rail FALLBACK_ACH is declared for Alpha, parking T1 as QUEUED_THROTTLED; at 13:06 T1 is diverted to FALLBACK_ACH; at 13:10 the outage is resolved and the posture returns to NORMAL."
            - "The clock is moved to 2026-08-03T13:20:00Z, so the 60-minute window is [12:20, 13:20) and still contains T1's created_at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants"
              payload: { legal_name: "Alpha National Bank", routing_number: "021000021", settlement_agent_reference: "SA-ALPHA-01", participation_model: "SEND_AND_RECEIVE" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_id: $.data.id }
            - call: "POST /position-accounts"
              payload: { participant_id: "${pa_id}", opening_balance_cents: 1200000000, warning_threshold_cents: 1100000000, critical_threshold_cents: 1000000000, floor_cents: 200000000 }
              as: LiquidityOfficer
              as_user_id: "liq-01"
              captures: { acct_id: $.data.id }
            - call: "POST /participants/${pa_id}/attestation"
              payload: { attestation_document_reference: "ATT-ALPHA-2026-08" }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
            - call: "POST /participants/${pa_id}/certification-window"
              payload: { certification_test_suite_version: "CERT-2026.2" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pa_id}/certification-results"
              payload: { outcome: "PASS" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pa_id}/activation"
              payload: { go_live_business_date: "2026-08-03" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_v: $.data.version }
            - call: "POST /segment-policies"
              payload: { participant_id: "${pa_id}", segment: "CORPORATE", per_transaction_limit_cents: 250000000, daily_aggregate_limit_cents: 500000000, rolling_window_count_limit: 1, rolling_window_amount_limit_cents: 400000000, effective_from: "2026-08-01T00:00:00Z", expected_participant_version: "${pa_v}" }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
            - call: "POST /customer-accounts"
              payload: { participant_id: "${pa_id}", segment: "CORPORATE", account_reference: "CUST-ALPHA-0001", fraud_risk_baseline: 20 }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
              captures: { ca_id: $.data.id }
            - call: "POST /settlement-cycles"
              payload: { business_date: "2026-08-03" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "GET /position-accounts/${acct_id}"
              payload: {}
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { acct_v1: $.data.version }
            - call: "POST /credit-transfers"
              payload: { originator_participant_id: "${pa_id}", customer_account_id: "${ca_id}", receiver_routing_number: "021000089", amount_cents: 10000000, expected_position_account_version: "${acct_v1}" }
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { t1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:05:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /outage-events"
              payload: { scope: "PARTICIPANT", severity: "FULL_OUTAGE", fallback_rail: "FALLBACK_ACH", started_at: "2026-08-03T13:05:00Z", participant_id: "${pa_id}" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { oe_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:06:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /credit-transfers/${t1_id}/diversion"
              payload: { fallback_rail: "FALLBACK_ACH" }
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:10:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /outage-events/${oe_id}/resolution"
              payload: { ended_at: "2026-08-03T13:10:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:20:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "GET /position-accounts/${acct_id}"
              payload: {}
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { acct_v2: $.data.version }
          trigger:
            - call: "POST /credit-transfers"
              payload: { originator_participant_id: "${pa_id}", customer_account_id: "${ca_id}", receiver_routing_number: "021000089", amount_cents: 10000000, expected_position_account_version: "${acct_v2}" }
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { t2_id: $.data.id, score: $.data.fraud_score, status: $.data.clearing_status }
          assert:
            - "The response is HTTP 201: ${status} == INITIATED and ${score} == 57 (base 20 + amount_term 20 + velocity_term 0 + new_beneficiary 12 = 52, x 1.1 = 57.2 -> 57)"
            - "CreditTransfer.${t1_id}.clearing_status == DIVERTED with rail == FALLBACK_ACH, so the window count seen by the trigger was 0 and 0 + 1 <= rolling_window_count_limit 1"
            - "OutageEvent.${oe_id}.status == RESOLVED with ended_at 2026-08-03T13:10:00Z and Participant.${pa_id}.operational_posture == NORMAL"
            - "PrefundedPositionAccount.${acct_id}.reserved_cents == 10000000 (only T2 reserves) and current_balance_cents == 1200000000 (no settlement, no ledger entry)"
            - "A further transfer of 10,000,000 cents at 2026-08-03T13:21:00Z is refused with HTTP 422 ERR_VELOCITY_LIMIT_EXCEEDED, because T2 is INITIATED and therefore countable"

      - name: access_fee_rounding_order_per_transfer
        claim_type: tiered_pricing
        grounds:
          - calculations.intraday_liquidity_access_fee
        excluded_because:
          difficulty_instance: intraday_access_fee_rounds_per_transfer_then_sums
          rationale: "The pinned round-per-transfer-then-sum order, the rebate threshold and the FEE_DEBIT posting are all asserted by that §1.8 instance with amounts chosen so the two rounding orders diverge."

      - name: fraud_score_term_combination
        claim_type: weighted_scoring
        grounds:
          - calculations.fraud_score
        excluded_because:
          difficulty_instance: fraud_score_multi_term_combination_with_segment_multiplier
          rationale: "The multi-term combination, the clamped amount and velocity terms and the segment multiplier are the subject of that §1.8 instance."

      - name: alert_tier_threshold_bands
        claim_type: threshold
        grounds:
          - calculations.liquidity_alert_tier
        excluded_because:
          difficulty_instance: balance_exactly_at_critical_threshold_is_red
          rationale: "The at-threshold, one-cent-above and one-cent-below cases of the tier bands are enumerated there, including the floor_cents case that stays RED rather than BREACH."

      - name: reconciliation_variance_two_variants_diverge
        claim_type: Variant Divergence
        grounds:
          - calculations.reconciliation_variance
        excluded_because:
          difficulty_instance: reconciliation_variance_provisional_vs_final_diverge
          rationale: "Both variants are run against identical stored rows and the delta is asserted there."

      - name: fraud_score_variant_selection_by_context
        claim_type: Variant Selection
        grounds:
          - calculations.fraud_score.variants
        excluded_because:
          difficulty_instance: fraud_score_origination_vs_review_final_diverge
          rationale: "That instance shows ORIGINATION frozen on the transfer while REVIEW_FINAL is written on the review, which is exactly the variant-selection claim."

      - name: reconciliation_variant_switch_delta
        claim_type: Reconciliation
        grounds:
          - calculations.reconciliation_variance.variants
        excluded_because:
          difficulty_instance: reconciliation_variance_provisional_vs_final_diverge
          rationale: "The PROVISIONAL to FINAL switch and the resulting cycle-status effect are asserted there; no ledger delta is posted by a reconciliation run, which that instance also pins."

      - name: daily_sent_usage_running_total_after_reversal
        claim_type: aggregation
        grounds:
          - calculations.customer_daily_sent_usage
        excluded_because:
          difficulty_instance: daily_sent_usage_conserved_after_partial_return
          rationale: "The conservation of daily_sent_amount_cents across a partial return - the running total correct after add and after reversal - is that instance's whole point."

      - name: governing_policy_window_selection
        claim_type: interval_merge
        grounds:
          - calculations.governing_segment_policy_selection
        excluded_because:
          difficulty_instance: segment_policy_windows_adjacent_admitted_overlap_rejected
          rationale: "Adjacent versus overlapping half-open windows, and the pinned effective_from DESC selection, are covered there."

      - name: posture_propagation_reaches_fixed_point
        claim_type: constraint_propagation
        grounds:
          - calculations.operational_posture_derivation
        excluded_because:
          difficulty_instance: settlement_cascade_five_hops_to_sibling_parking
          rationale: "The propagation from a ledger movement through tier, posture and sibling transfers - and its termination - is asserted hop by hop there."

      - name: reconciliation_processing_order
        claim_type: chronological
        grounds:
          - calculations.reconciliation_variance
        excluded_because:
          difficulty_instance: empty_input_reconciliation_variance_at_tolerance_edge
          rationale: "That instance pins the run against an empty input set and the tolerance edge, where processing order is provably irrelevant and the variance equals core_deposit_total_cents exactly."

  - section: validations
    instances:
      - name: clock_move_backward_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=80]
          - errors[ERR_CLOCK_NOT_MONOTONIC]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "The logical clock is monotonic non-decreasing: re-setting it to the same instant is accepted while any earlier instant is refused, which is what keeps every window and deadline comparison in the scaffold reproducible."
        test_recipe:
          setup:
            - "The clock has been advanced to 2026-08-03T13:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T12:59:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { err: $.data.error_id }
          assert:
            - "The response is HTTP 422 and ${err} == ERR_CLOCK_NOT_MONOTONIC"
            - "A repeat POST with current_utc 2026-08-03T13:00:00Z (the stored instant, unchanged) is accepted"

      - name: duplicate_routing_number_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=88]
          - errors[ERR_DUPLICATE_ROUTING_NUMBER]
        distinguishing_aspect: "Routing-number uniqueness is global across participants, not scoped to a legal name or an enrollment status, so a second DRAFT participant claiming the same nine digits is refused at 409 even though every other field differs."
        test_recipe:
          setup:
            - "Alpha National Bank exists in DRAFT with routing_number 021000021; the clock is 2026-08-03T13:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants"
              payload: { legal_name: "Alpha National Bank", routing_number: "021000021", settlement_agent_reference: "SA-ALPHA-01", participation_model: "SEND_AND_RECEIVE" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_id: $.data.id }
          trigger:
            - call: "POST /participants"
              payload: { legal_name: "Gamma Savings Bank", routing_number: "021000021", settlement_agent_reference: "SA-GAMMA-01", participation_model: "RECEIVE_ONLY" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { err: $.data.error_id }
          assert:
            - "The response is HTTP 409 and ${err} == ERR_DUPLICATE_ROUTING_NUMBER"
            - "Exactly one Participant row exists and Participant.${pa_id}.legal_name is still Alpha National Bank"

      - name: prefund_below_minimum_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=97]
          - errors[ERR_PREFUND_BELOW_MINIMUM]
          - global_constants.MIN_PREFUND_CENTS
        distinguishing_aspect: "MIN_PREFUND_CENTS is a floor on the opening balance only, checked after the threshold-ordering rule at priority 47: an account whose thresholds are all internally consistent is still refused one cent below 100,000,000."
        test_recipe:
          setup:
            - "Alpha National Bank exists in DRAFT with no position account; the clock is 2026-08-03T13:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants"
              payload: { legal_name: "Alpha National Bank", routing_number: "021000021", settlement_agent_reference: "SA-ALPHA-01", participation_model: "SEND_AND_RECEIVE" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_id: $.data.id }
          trigger:
            - call: "POST /position-accounts"
              payload: { participant_id: "${pa_id}", opening_balance_cents: 99999999, warning_threshold_cents: 99999999, critical_threshold_cents: 99999999, floor_cents: 99999999 }
              as: LiquidityOfficer
              as_user_id: "liq-01"
              captures: { err: $.data.error_id }
          assert:
            - "The response is HTTP 422 and ${err} == ERR_PREFUND_BELOW_MINIMUM"
            - "The four equal thresholds satisfy priority 47 (equal adjacent thresholds are accepted), so only the minimum-prefund rule fires"
            - "No PrefundedPositionAccount row exists and GET /participants/${pa_id}/position-accounts returns total_count 0"
            - "The same call with opening_balance_cents 100000000 (exactly MIN_PREFUND_CENTS) is accepted"

      - name: threshold_ordering_violation_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=47]
          - errors[ERR_INVALID_THRESHOLD_ORDERING]
        distinguishing_aspect: "The ordering rule is a four-way chain floor <= critical <= warning <= opening_balance; inverting only the middle pair (critical above warning) is enough to fail it, and the failure is a 422 on the ordering rule rather than a generic 400."
        test_recipe:
          setup:
            - "Alpha National Bank exists in DRAFT with no position account; the clock is 2026-08-03T13:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants"
              payload: { legal_name: "Alpha National Bank", routing_number: "021000021", settlement_agent_reference: "SA-ALPHA-01", participation_model: "SEND_AND_RECEIVE" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_id: $.data.id }
          trigger:
            - call: "POST /position-accounts"
              payload: { participant_id: "${pa_id}", opening_balance_cents: 1200000000, warning_threshold_cents: 1000000000, critical_threshold_cents: 1100000000, floor_cents: 200000000 }
              as: LiquidityOfficer
              as_user_id: "liq-01"
              captures: { err: $.data.error_id }
          assert:
            - "The response is HTTP 422 and ${err} == ERR_INVALID_THRESHOLD_ORDERING"
            - "No PrefundedPositionAccount row exists"
            - "Swapping the two values (warning 1,100,000,000 and critical 1,000,000,000) makes the same call succeed with alert_tier GREEN"

      - name: outage_interval_ends_before_start_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=48]
          - errors[ERR_INVALID_INTERVAL]
        distinguishing_aspect: "Interval well-formedness (priority 48) is checked before the overlap rule at priority 83, so a backwards outage window is an ERR_INVALID_INTERVAL 422 and never an ERR_OUTAGE_WINDOW_CONFLICT, even on an empty outage table."
        test_recipe:
          setup:
            - "No OutageEvent rows exist; the clock is 2026-08-03T15:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T15:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
          trigger:
            - call: "POST /outage-events"
              payload: { scope: "NETWORK_WIDE", severity: "FULL_OUTAGE", fallback_rail: "FALLBACK_ACH", started_at: "2026-08-03T14:00:00Z", ended_at: "2026-08-03T13:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { err: $.data.error_id }
          assert:
            - "The response is HTTP 422 and ${err} == ERR_INVALID_INTERVAL"
            - "No OutageEvent row is created, so no participant posture becomes OFFLINE"
            - "The same rule refuses a CustomerSegmentPolicy whose effective_to is not strictly after its effective_from, and a request-for-payment whose expiry_at is not strictly after the clock"

      - name: second_position_account_for_participant_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=89]
          - errors[ERR_DUPLICATE_RESOURCE]
        distinguishing_aspect: "A participant holds at most one prefunded position account - the ledger identity and every tier computation assume a single account - so the second create is a 409 even with entirely different thresholds."
        test_recipe:
          setup:
            - "Alpha National Bank exists in DRAFT with one position account opened at 1,200,000,000 cents; the clock is 2026-08-03T13:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants"
              payload: { legal_name: "Alpha National Bank", routing_number: "021000021", settlement_agent_reference: "SA-ALPHA-01", participation_model: "SEND_AND_RECEIVE" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_id: $.data.id }
            - call: "POST /position-accounts"
              payload: { participant_id: "${pa_id}", opening_balance_cents: 1200000000, warning_threshold_cents: 1100000000, critical_threshold_cents: 1000000000, floor_cents: 200000000 }
              as: LiquidityOfficer
              as_user_id: "liq-01"
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /position-accounts"
              payload: { participant_id: "${pa_id}", opening_balance_cents: 500000000, warning_threshold_cents: 300000000, critical_threshold_cents: 200000000, floor_cents: 100000000 }
              as: LiquidityOfficer
              as_user_id: "liq-01"
              captures: { err: $.data.error_id }
          assert:
            - "The response is HTTP 409 and ${err} == ERR_DUPLICATE_RESOURCE"
            - "GET /participants/${pa_id}/position-accounts returns total_count 1 and its single row is ${acct_id} with opening_balance_cents 1200000000"
            - "The same error id guards CustomerAccount.account_reference uniqueness within a participant"

      - name: duplicate_settlement_cycle_business_date_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=90]
          - errors[ERR_DUPLICATE_SETTLEMENT_CYCLE]
        distinguishing_aspect: "Cycle business_date is globally unique, so the second cycle for 2026-08-03 is refused; the same rule row deliberately does NOT refuse a repeated reconciliation run, which instead creates the next revision."
        test_recipe:
          setup:
            - "Settlement cycle 2026-08-03 exists and is OPEN; the clock is 2026-08-03T13:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /settlement-cycles"
              payload: { business_date: "2026-08-03" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /settlement-cycles"
              payload: { business_date: "2026-08-03" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { err: $.data.error_id }
          assert:
            - "The response is HTTP 409 and ${err} == ERR_DUPLICATE_SETTLEMENT_CYCLE"
            - "SettlementCycle.${cyc_id}.status is still OPEN and its version is unchanged"

      - name: settlement_cycle_future_business_date_rejected
        claim_type: Temporal validation
        grounds:
          - validations[priority=86]
          - errors[ERR_BUSINESS_DATE_NOT_REACHED]
        distinguishing_aspect: "A cycle may be opened for today or any past date but never for a future one, and the same rule blocks a cutoff taken before the cycle's own business_date - the comparison is against the UTC date of the logical clock, not wall time."
        test_recipe:
          setup:
            - "No SettlementCycle rows exist; the clock is 2026-08-03T13:00:00Z, so the UTC business date is 2026-08-03."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
          trigger:
            - call: "POST /settlement-cycles"
              payload: { business_date: "2026-08-04" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { err: $.data.error_id }
          assert:
            - "The response is HTTP 422 and ${err} == ERR_BUSINESS_DATE_NOT_REACHED"
            - "No SettlementCycle row is created"
            - "The same call with business_date 2026-08-03 succeeds, and one with 2026-08-02 also succeeds because past dates are permitted"

      - name: ledger_adjustment_below_zero_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=98]
          - errors[ERR_LEDGER_ADJUSTMENT_WOULD_GO_NEGATIVE]
          - calculations.liquidity_alert_tier
        distinguishing_aspect: "Zero is the hard bound on the funded position, not floor_cents: a withdrawal that lands the balance under the floor is legal and merely raises a BREACH alert, while one cent past zero is refused - so the rule must be evaluated against the projected balance, not against the tier."
        test_recipe:
          setup:
            - "Alpha National Bank exists in DRAFT with a position account opened at exactly 100,000,000 cents (warning 90,000,000 / critical 80,000,000 / floor 50,000,000); no ledger entries have been posted."
            - "The clock is 2026-08-03T13:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants"
              payload: { legal_name: "Alpha National Bank", routing_number: "021000021", settlement_agent_reference: "SA-ALPHA-01", participation_model: "SEND_AND_RECEIVE" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_id: $.data.id }
            - call: "POST /position-accounts"
              payload: { participant_id: "${pa_id}", opening_balance_cents: 100000000, warning_threshold_cents: 90000000, critical_threshold_cents: 80000000, floor_cents: 50000000 }
              as: LiquidityOfficer
              as_user_id: "liq-01"
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /position-accounts/${acct_id}/ledger-adjustments"
              payload: { entry_type: "WITHDRAWAL_DEBIT", magnitude_cents: 100000001, reference: "Over-withdrawal attempt" }
              as: LiquidityOfficer
              as_user_id: "liq-01"
              captures: { err: $.data.error_id }
          assert:
