  - section: errors
    instances:
      - name: budget_created_after_approval_stays_locked_and_blocks_events
        claim_type: triggerable
        grounds:
          - errors.ERR_BUDGET_NOT_ACTIVE
          - validations[priority=20]
          - state_machines.NutrientManagementPlan.SUBMITTED->APPROVED
          - entities.FieldNutrientBudget.fields.budget_status
        distinguishing_aspect: |
          ERR_BUDGET_NOT_ACTIVE is otherwise unreachable on an APPROVED plan, because approval
          activates every budget that exists at that moment. The only way to hold a LOCKED budget
          under an APPROVED plan is to create the budget after approval: POST /cafo/field-budgets
