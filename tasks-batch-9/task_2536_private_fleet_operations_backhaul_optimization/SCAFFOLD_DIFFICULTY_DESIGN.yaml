              captures: { term_status: $.data.status }
          assert:
            - "${pre_count} == 3 and ${pre_index} == 1.5000"
            - "${bid_93_status} == SUBMITTED, ${bid_93_seniority} == 2022-04-01 and ${bid_93_safety} == 100"
            - "LINK 1: ${term_status} == TERMINATED"
            - "LINK 2: Domicile.${dom_kc_id}.assigned_driver_count == 2"
            - "LINK 3: Domicile.${dom_kc_id}.balance_index == 1.0000"
            - "RouteBid ${bid_93_id} status == PASSED_OVER and RoutePosting.${posting_200_id}.bid_count == 0, while the posting itself is still OPEN"
            - "GET /fleet/drivers?domicile_id=${dom_kc_id}&status=ACTIVE returns exactly 2 rows"
            - "a second POST /fleet/drivers/${drv_93_id}/termination returns ERR_INVALID_STATE_TRANSITION (409), not ERR_DRIVER_NOT_ACTIVE"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: hos_duty_limit_beats_driver_rest_gap_when_both_are_violated
        grounds:
          - validations[priority 12 hours_of_service]
          - validations[priority 14 temporal]
          - calculations.hos_feasibility
          - calculations.driver_rest_gap
          - errors.ERR_HOS_DUTY_LIMIT
          - errors.ERR_DRIVER_REST_GAP
        distinguishing_aspect: |
          PAIR: hours_of_service (priority 12) versus temporal (priority 14).
          The same driver, the same 300-minute rest gap and the same equipment
          are used twice; only the projected duty differs, by exactly one
          minute. At 841 duty minutes the answer is ERR_HOS_DUTY_LIMIT even
          though the rest gap is equally violated; at 840 duty minutes the
          HOS objection disappears and the SAME endpoint now answers
          ERR_DRIVER_REST_GAP. Distinct from the other two pairs in this rule:
          both members here are 422 business-rule categories, neither is a
          state check and neither is an authorization check.
        test_recipe:
          setup:
            - "Store S-1004 unloads 600 cases/hour with 3 doors and 24-hour dock availability; trailers hold 3200 cases; two tractors and two trailers exist so equipment availability never masks the result."
            - "TRIP-A is PLANNED for driver D-77: two 1550-case DELIVERY stops (service 170 each) plus a DROP_OFF (20), drive 240 + 200 + 40 = 480, break 0 because 480 is not > 480, planned_duty_minutes 840, planned_end_at 2026-08-05T13:30:00Z."
            - "TRIP-B starts 2026-08-05T18:30:00Z, i.e. exactly 300 minutes after TRIP-A ends - half the 600-minute rest requirement. Its first DELIVERY carries 1556 cases, giving ceil(1556*60/600) + 15 = 171 service minutes and planned_duty_minutes 480 + 171 + 170 + 20 = 841."
            - "TRIP-C is TRIP-B with 1550 cases on the first stop instead of 1556: planned_duty_minutes 840 exactly, same 300-minute rest gap."
