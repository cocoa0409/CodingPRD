# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# FOG Ordinance Compliance Program. Breadth coverage of every §1.1–§1.7 claim
# not already probed by SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8).
# Sections and claim_types follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: c_establishment_create_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Establishment, entities.Establishment.fields.has_charbroiler]
        distinguishing_aspect: "Create with has_charbroiler omitted applies default false; system fields id/created_at/updated_at/version==1 minted; computed posture starts COMPLIANT with open_violation_count 0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Defaults Diner", street_address: "1 A St", seating_capacity: 10, fryer_count: 0, cuisine_profile: LOW_GREASE }
              as: ProgramAdmin
              captures: { est_id: $.data.id }
          trigger:
            - call: "GET /establishments/${est_id}"
              as: ProgramAdmin
          assert:
            - "Establishment.${est_id}.has_charbroiler == false (default applied)"
            - "id is a server-minted UUID; created_at == updated_at; version == 1"
            - "compliance_status == COMPLIANT and open_violation_count == 0 and missed_pump_windows == 0"

      - name: c_establishment_missing_required_returns_400
        claim_type: required_fields
        grounds: [entities.Establishment.fields.seating_capacity, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input seating_capacity yields ERR_INVALID_REQUEST (400) before any state is persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /establishments"
              payload: { name: "No Seats", street_address: "2 B St", fryer_count: 0, cuisine_profile: LOW_GREASE }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and HTTP status 400"

      - name: c_computed_field_input_ignored_on_establishment_create
        claim_type: computed_fields
        grounds: [entities.Establishment.fields.risk_class, entities.Establishment.fields.compliance_status]
        distinguishing_aspect: "Client-supplied computed fields (risk_class, compliance_status) in the create body are ignored; the server computes them from the profile."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /establishments"
              payload: { name: "Sneaky Steakhouse", street_address: "3 C St", seating_capacity: 200, fryer_count: 3, has_charbroiler: false, cuisine_profile: HIGH_GREASE, risk_class: "LOW", compliance_status: "COMPLIANT" }
              as: ProgramAdmin
              captures: { est_id: $.data.id }
          assert:
            - "Establishment.${est_id}.risk_class == HIGH (computed 80 >= 70; client-supplied LOW ignored)"
            - "Establishment.${est_id}.risk_score == 80"

      - name: c_get_nonexistent_establishment_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /establishments/00000000-0000-4000-8000-000000000000"
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and HTTP status 404"

      - name: c_filtered_manifests_list_pagination
        claim_type: listing
        grounds: [entities.PumpManifest, response_envelope]
        distinguishing_aspect: "GET /pump-manifests?hauler_id=H&limit=1 returns only H's manifests and honors pagination fields total_count/has_more."
        test_recipe:
          setup:
            - "HIGH establishment with ACTIVE interceptor; haulers H1 and H2 both PERMITTED"
            - "two SUBMITTED manifests for H1 (pump_dates 2026-08-01, 2026-08-02), one for H2 (2026-08-01)"
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "List Diner", street_address: "4 D St", seating_capacity: 200, fryer_count: 3, has_charbroiler: false, cuisine_profile: HIGH_GREASE }
              as: ProgramAdmin
              captures: { est_id: $.data.id }
            - call: "POST /interceptors"
              payload: { establishment_id: "${est_id}", nominal_capacity_gal: 600 }
              as: ProgramAdmin
              captures: { int_id: $.data.id }
            - call: "POST /interceptors/${int_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /interceptors/${int_id}/commission"
              payload: {}
              as: Inspector
            - call: "POST /haulers"
              payload: { name: "H1 Haul", permit_number: "PN-L1", insurance_expires_on: "2027-06-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { h1: $.data.id }
            - call: "POST /haulers/${h1}/permit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /haulers"
              payload: { name: "H2 Haul", permit_number: "PN-L2", insurance_expires_on: "2027-06-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { h2: $.data.id }
            - call: "POST /haulers/${h2}/permit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /pump-manifests"
              payload: { establishment_id: "${est_id}", interceptor_id: "${int_id}", hauler_id: "${h1}", pump_date: "2026-08-01T00:00:00Z", pumped_volume_gal: 1000 }
              as: FseContact
              as_user_id: "${est_id}"
            - call: "POST /pump-manifests"
              payload: { establishment_id: "${est_id}", interceptor_id: "${int_id}", hauler_id: "${h1}", pump_date: "2026-08-02T00:00:00Z", pumped_volume_gal: 1000 }
              as: FseContact
              as_user_id: "${est_id}"
            - call: "POST /pump-manifests"
              payload: { establishment_id: "${est_id}", interceptor_id: "${int_id}", hauler_id: "${h2}", pump_date: "2026-08-01T00:00:00Z", pumped_volume_gal: 1000 }
              as: FseContact
              as_user_id: "${est_id}"
          trigger:
            - call: "GET /pump-manifests?hauler_id=${h1}&limit=1"
              as: Inspector
          assert:
            - "response_type == array; data contains exactly 1 manifest (limit honored)"
            - "total_count == 2 for hauler ${h1} and has_more == true"
            - "every returned manifest has hauler_id == ${h1} (filter excludes H2's manifest)"

      - name: c_disposal_record_immutable_no_version
        claim_type: immutability
        grounds: [entities.DisposalRecord]
        distinguishing_aspect: "DisposalRecord is append-only (common_fields: false): its create response carries id and created_at but no version/updated_at, and no update endpoint exists in §1.5."
        test_recipe:
          setup:
            - "HIGH establishment with ACTIVE interceptor; PERMITTED hauler; SUBMITTED manifest"
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Immutable Eats", street_address: "5 E St", seating_capacity: 200, fryer_count: 3, has_charbroiler: false, cuisine_profile: HIGH_GREASE }
              as: ProgramAdmin
              captures: { est_id: $.data.id }
            - call: "POST /interceptors"
              payload: { establishment_id: "${est_id}", nominal_capacity_gal: 600 }
              as: ProgramAdmin
              captures: { int_id: $.data.id }
            - call: "POST /interceptors/${int_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /interceptors/${int_id}/commission"
              payload: {}
              as: Inspector
            - call: "POST /haulers"
              payload: { name: "Imm Haul", permit_number: "PN-IMM", insurance_expires_on: "2027-06-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { h: $.data.id }
            - call: "POST /haulers/${h}/permit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /pump-manifests"
              payload: { establishment_id: "${est_id}", interceptor_id: "${int_id}", hauler_id: "${h}", pump_date: "2026-08-01T00:00:00Z", pumped_volume_gal: 1000 }
              as: FseContact
              as_user_id: "${est_id}"
              captures: { m: $.data.id }
          trigger:
            - call: "POST /disposal-records"
              payload: { hauler_id: "${h}", manifest_id: "${m}", disposed_volume_gal: 1000, disposal_site_name: "Site C", disposed_at: "2026-08-01T12:00:00Z" }
              as: HaulerAdmin
              as_user_id: "${h}"
              captures: { dr: $.data.id }
          assert:
            - "DisposalRecord.${dr} response contains id and created_at but no version or updated_at field"
            - "§1.5 declares no PUT/PATCH/DELETE for /disposal-records (append-only)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: c_commission_proposed_interceptor_rejected
        claim_type: invalid_transition
        grounds: [state_machines.GreaseInterceptor.APPROVED_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Commission is valid only from APPROVED; calling it on a PROPOSED interceptor fails with ERR_INVALID_STATE and leaves status unchanged."
        test_recipe:
          setup: ["establishment with a PROPOSED interceptor (never approved)"]
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Skip Step Cafe", street_address: "6 F St", seating_capacity: 10, fryer_count: 0, cuisine_profile: LOW_GREASE }
              as: ProgramAdmin
              captures: { est_id: $.data.id }
            - call: "POST /interceptors"
              payload: { establishment_id: "${est_id}", nominal_capacity_gal: 50 }
              as: ProgramAdmin
              captures: { int_id: $.data.id }
          trigger:
            - call: "POST /interceptors/${int_id}/commission"
              payload: {}
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "GreaseInterceptor.${int_id}.status remains PROPOSED"

      - name: c_resolved_violation_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.Violation, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "RESOLVED is terminal: a subsequent dismiss fails with ERR_INVALID_STATE and open_violation_count stays 0 (no double-decrement)."
        test_recipe:
          setup:
            - "LOW establishment with one NOTICED violation (failing inspection by insp-7), resolved by an Inspector"
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Lockdown Lunch", street_address: "7 G St", seating_capacity: 10, fryer_count: 0, cuisine_profile: LOW_GREASE }
              as: ProgramAdmin
              captures: { est_id: $.data.id }
            - call: "POST /inspections"
              payload: { establishment_id: "${est_id}", items: [ { category: "GREASE_TRAP_MAINTENANCE", severity: "CRITICAL" } ] }
              as: Inspector
              as_user_id: "insp-7"
            - call: "GET /violations?establishment_id=${est_id}&status=NOTICED"
              as: Inspector
              captures: { viol_id: "$.data[0].id" }
            - call: "POST /violations/${viol_id}/resolve"
              payload: {}
              as: Inspector
          trigger:
            - call: "POST /violations/${viol_id}/dismiss"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-9"
              captures: { err: $.data.error_id }
            - call: "GET /establishments/${est_id}"
              as: ProgramAdmin
          assert:
            - "error_id == ERR_INVALID_STATE (RESOLVED is terminal)"
            - "Violation.${viol_id}.status remains RESOLVED"
            - "Establishment.${est_id}.open_violation_count == 0 (exactly one decrement happened, at resolve)"

      - name: c_revoked_hauler_cannot_reinstate
        claim_type: terminal_lockdown
        grounds: [state_machines.Hauler, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REVOKED is terminal: reinstate on a REVOKED hauler fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["hauler PERMITTED then REVOKED"]
          setup_api_calls:
            - call: "POST /haulers"
              payload: { name: "Terminal Haul", permit_number: "PN-TERM", insurance_expires_on: "2027-06-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { h: $.data.id }
            - call: "POST /haulers/${h}/permit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /haulers/${h}/revoke"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /haulers/${h}/reinstate"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Hauler.${h}.status remains REVOKED"

      - name: c_initial_states_on_create
        claim_type: initial_state
        grounds: [state_machines.Hauler, state_machines.GreaseInterceptor, state_machines.VarianceRequest, state_machines.BlockageEvent, state_machines.PumpManifest]
        distinguishing_aspect: "Freshly created entities start in their declared initial states: hauler APPLIED, interceptor PROPOSED, variance UNDER_REVIEW, blockage REPORTED, manifest SUBMITTED."
        test_recipe:
          setup: ["HIGH establishment; PERMITTED hauler"]
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Initial Inn", street_address: "8 H St", seating_capacity: 200, fryer_count: 3, has_charbroiler: false, cuisine_profile: HIGH_GREASE }
              as: ProgramAdmin
              captures: { est_id: $.data.id }
            - call: "POST /haulers"
              payload: { name: "Init Haul", permit_number: "PN-INIT", insurance_expires_on: "2027-06-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { h: $.data.id }
            - call: "POST /interceptors"
              payload: { establishment_id: "${est_id}", nominal_capacity_gal: 600 }
              as: ProgramAdmin
              captures: { int_id: $.data.id }
            - call: "POST /interceptors/${int_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /interceptors/${int_id}/commission"
              payload: {}
              as: Inspector
            - call: "POST /haulers/${h}/permit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /variance-requests"
              payload: { establishment_id: "${est_id}", scope: "INTERCEPTOR_SIZE", justification: "tight space", effective_from: "2027-01-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z" }
              as: FseContact
              as_user_id: "${est_id}"
              captures: { var_id: $.data.id }
            - call: "POST /blockage-events"
              payload: { location_description: "5th Ave line" }
              as: Inspector
              captures: { blk: $.data.id }
            - call: "POST /pump-manifests"
              payload: { establishment_id: "${est_id}", interceptor_id: "${int_id}", hauler_id: "${h}", pump_date: "2026-08-01T00:00:00Z", pumped_volume_gal: 1000 }
              as: FseContact
              as_user_id: "${est_id}"
              captures: { m: $.data.id }
          trigger:
            - call: "GET /haulers/${h}"
              as: ProgramAdmin
          assert:
            - "Hauler.${h} was created in APPLIED (observed before permit call)"
            - "GreaseInterceptor.${int_id} was created in PROPOSED"
            - "VarianceRequest.${var_id}.status == UNDER_REVIEW"
            - "BlockageEvent.${blk}.status == REPORTED"
            - "PumpManifest.${m}.status == SUBMITTED"

      - name: c_failing_inspection_sets_cure_deadline_and_fine_zero
        claim_type: side_effect_execution
        grounds: [calculations.inspection_score, entities.Violation.fields.cure_deadline, entities.Violation.fields.fine_cents]
        distinguishing_aspect: "The auto-created violation pins cure_deadline = inspection created_at + severity days (MAJOR -> 2026-08-01T00:00:00Z + 14d = 2026-08-15T00:00:00Z), fine_cents stays 0 while NOTICED, and recorded_by_user_id echoes the inspector's X-User-ID."
        test_recipe:
          setup: ["LOW establishment; inspection recorded at the default clock 2026-08-01T00:00:00Z by insp-7 with a failing MAJOR-severity item set"]
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Deadline Deli", street_address: "9 I St", seating_capacity: 10, fryer_count: 0, cuisine_profile: LOW_GREASE }
              as: ProgramAdmin
              captures: { est_id: $.data.id }
            - call: "POST /inspections"
              payload: { establishment_id: "${est_id}", items: [ { category: "GREASE_TRAP_MAINTENANCE", severity: "MAJOR" }, { category: "RECORD_KEEPING", severity: "MAJOR" }, { category: "BMP_PRACTICES", severity: "MINOR" }, { category: "BMP_PRACTICES", severity: "MINOR" }, { category: "STRUCTURAL", severity: "MINOR" }, { category: "STRUCTURAL", severity: "MINOR" }, { category: "RECORD_KEEPING", severity: "MINOR" } ] }
              as: Inspector
              as_user_id: "insp-7"
            - call: "GET /violations?establishment_id=${est_id}&status=NOTICED"
              as: Inspector
              captures: { viol_id: "$.data[0].id" }
          trigger:
            - call: "GET /violations/${viol_id}"
              as: Inspector
          assert:
            - "Violation.${viol_id}.cure_deadline == 2026-08-15T00:00:00Z (created_at + 14 days for MAJOR)"
            - "Violation.${viol_id}.fine_cents == 0 while NOTICED"
            - "Violation.${viol_id}.recorded_by_user_id == insp-7"
            - "Violation.${viol_id}.status == NOTICED"

      - name: c_manifest_verify_side_effect_excluded
        claim_type: side_effect_execution
        grounds: [state_machines.PumpManifest.SUBMITTED_to_VERIFIED]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / manifest_verify_requires_permitted_hauler"
          rationale: "That instance's final assert pins Establishment.last_verified_pump_at == 2026-08-02T00:00:00Z after the successful verify."

      - name: c_variance_cycle_excluded
        claim_type: valid_transition
        grounds: [state_machines.VarianceRequest.UNDER_REVIEW_to_INFO_REQUESTED, state_machines.VarianceRequest.INFO_REQUESTED_to_UNDER_REVIEW]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / variance_info_request_cycle"
          rationale: "The §1.8 instance drives the cycle twice and asserts the terminal deny."

      - name: c_hauler_cycle_excluded
        claim_type: valid_transition
        grounds: [state_machines.Hauler.PERMITTED_to_SUSPENDED, state_machines.Hauler.SUSPENDED_to_PERMITTED]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / hauler_permit_suspension_cycle"
          rationale: "The §1.8 instance drives the full cycle and asserts the mismatch_count reset."

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: c_inspection_score_constants_and_floor
        claim_type: correct_result
        grounds: [calculations.inspection_score]
        distinguishing_aspect: "Severity constants MINOR 3 / MAJOR 8 / CRITICAL 20 are applied exactly (1 CRITICAL + 1 MAJOR -> score 72, passed) and the floor max(0, .) binds (6 CRITICAL -> score 0, violation severity CRITICAL)."
        test_recipe:
          setup: ["two LOW establishments"]
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Score One", street_address: "10 J St", seating_capacity: 10, fryer_count: 0, cuisine_profile: LOW_GREASE }
              as: ProgramAdmin
              captures: { e1: $.data.id }
            - call: "POST /establishments"
              payload: { name: "Score Two", street_address: "11 J St", seating_capacity: 10, fryer_count: 0, cuisine_profile: LOW_GREASE }
              as: ProgramAdmin
              captures: { e2: $.data.id }
          trigger:
            - call: "POST /inspections"
              payload: { establishment_id: "${e1}", items: [ { category: "STRUCTURAL", severity: "CRITICAL" }, { category: "RECORD_KEEPING", severity: "MAJOR" } ] }
              as: Inspector
              captures: { i1: $.data.id }
            - call: "POST /inspections"
              payload: { establishment_id: "${e2}", items: [ { category: "STRUCTURAL", severity: "CRITICAL" }, { category: "RECORD_KEEPING", severity: "CRITICAL" }, { category: "GREASE_TRAP_MAINTENANCE", severity: "CRITICAL" }, { category: "BMP_PRACTICES", severity: "CRITICAL" }, { category: "STRUCTURAL", severity: "CRITICAL" }, { category: "RECORD_KEEPING", severity: "CRITICAL" } ] }
              as: Inspector
              captures: { i2: $.data.id }
            - call: "GET /violations?establishment_id=${e2}&status=NOTICED"
              as: Inspector
              captures: { v2: "$.data[0].id" }
          assert:
            - "Inspection.${i1}.score == 72 (100 - 20 - 8) and passed == true"
            - "Inspection.${i2}.score == 0 (floor max(0, 100 - 120)) and passed == false"
            - "Violation.${v2}.severity == CRITICAL (highest severity among items)"

      - name: c_pumping_frequency_by_risk_class
        claim_type: constants_applied
        grounds: [calculations.risk_classification, entities.Establishment.fields.pumping_frequency_days]
        distinguishing_aspect: "Risk table constants map exactly: HIGH -> 90, MEDIUM -> 180, LOW -> 365 days, including the MEDIUM boundary at score exactly 40."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Freq High", street_address: "12 K St", seating_capacity: 200, fryer_count: 3, has_charbroiler: false, cuisine_profile: HIGH_GREASE }
              as: ProgramAdmin
              captures: { eh: $.data.id }
            - call: "POST /establishments"
              payload: { name: "Freq Med", street_address: "13 K St", seating_capacity: 100, fryer_count: 1, cuisine_profile: MEDIUM_GREASE }
              as: ProgramAdmin
              captures: { em: $.data.id }
            - call: "POST /establishments"
              payload: { name: "Freq Low", street_address: "14 K St", seating_capacity: 50, fryer_count: 0, cuisine_profile: LOW_GREASE }
              as: ProgramAdmin
              captures: { el: $.data.id }
          trigger:
            - call: "GET /establishments/${em}"
              as: ProgramAdmin
          assert:
            - "Establishment.${eh}.risk_class == HIGH and pumping_frequency_days == 90"
            - "Establishment.${em}.risk_score == 40 and risk_class == MEDIUM (>= 40 boundary inclusive) and pumping_frequency_days == 180"
            - "Establishment.${el}.risk_class == LOW and pumping_frequency_days == 365"

      - name: c_disposal_tolerance_exactly_five_percent_passes
        claim_type: threshold
        grounds: [calculations.disposal_tolerance, "errors[ERR_DISPOSAL_DISCREPANCY]"]
        distinguishing_aspect: "Boundary on the disposal ratio: |2100-2000|/2000 == 0.05 exactly passes (strict > 0.05 rejects); 2101 gal (0.0505) is rejected with ERR_DISPOSAL_DISCREPANCY."
        test_recipe:
          setup:
            - "HIGH establishment with ACTIVE interceptor; PERMITTED hauler"
            - "manifest M1 (pump 2026-08-01, pumped 2000) with disposal 2100; manifest M2 (pump 2026-08-02, pumped 2000) with disposal 2101"
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Tolerance Tavern", street_address: "15 L St", seating_capacity: 200, fryer_count: 3, has_charbroiler: false, cuisine_profile: HIGH_GREASE }
              as: ProgramAdmin
              captures: { est_id: $.data.id }
            - call: "POST /interceptors"
              payload: { establishment_id: "${est_id}", nominal_capacity_gal: 600 }
              as: ProgramAdmin
              captures: { int_id: $.data.id }
            - call: "POST /interceptors/${int_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /interceptors/${int_id}/commission"
              payload: {}
              as: Inspector
            - call: "POST /haulers"
              payload: { name: "Tol Haul", permit_number: "PN-TOL", insurance_expires_on: "2027-06-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { h: $.data.id }
            - call: "POST /haulers/${h}/permit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /pump-manifests"
              payload: { establishment_id: "${est_id}", interceptor_id: "${int_id}", hauler_id: "${h}", pump_date: "2026-08-01T00:00:00Z", pumped_volume_gal: 2000 }
              as: FseContact
              as_user_id: "${est_id}"
              captures: { m1: $.data.id }
            - call: "POST /disposal-records"
