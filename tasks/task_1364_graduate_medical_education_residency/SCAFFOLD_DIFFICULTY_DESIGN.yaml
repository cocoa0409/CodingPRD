      - name: rotation_capacity_exact_boundary
        grounds:
          - state_machines.RotationAssignment
          - errors[ERR_ROTATION_CAPACITY_FULL]
          - validations[priority=9]
        distinguishing_aspect: |
          Metric: assignment count vs rotation capacity, via assignment create.
          With max_residents_per_block == 2 the second assignment (count 1 -> 2,
          count == max is allowed to be REACHED) succeeds and only the third
          (count == 2 == max) is rejected: the boundary is count == max blocks,
          count == max-1 passes. Different metric and endpoint than the 80-hour
          average.
        test_recipe:
          setup:
            - "Program, ACTIVE year, APPROVED complement (4 positions), residents A/B/C ACTIVE"
            - "Rotation ICU max_residents_per_block 2, min_pgy_level 1; block 1 captured"
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-0017" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years/${yr}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog}", academic_year_id: "${yr}", pgy_level: 1, approved_positions: 4, annual_funding_budget_cents: 100000000, blended_stipend_cents: 6000000 }, as: ProgramDirector, captures: { comp: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/complement-approvals/${comp}/approve", payload: {}, as: DesignatedInstitutionalOfficial }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "A One", email: "a@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { resA: "$.data.id" } }
            - { call: "POST /residency-programs/residents/${resA}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "B Two", email: "b@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { resB: "$.data.id" } }
            - { call: "POST /residency-programs/residents/${resB}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "C Three", email: "c@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { resC: "$.data.id" } }
            - { call: "POST /residency-programs/residents/${resC}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/rotations", payload: { program_id: "${prog}", name: "ICU", min_pgy_level: 1, max_residents_per_block: 2 }, as: ProgramCoordinator, captures: { rot: "$.data.id" } }
            - { call: "GET /residency-programs/schedule-blocks", payload: { academic_year_id: "${yr}" }, as: ProgramCoordinator, captures: { blk: "$.data[0].id" } }
          trigger:
            - { call: "POST /residency-programs/rotation-assignments", payload: { resident_id: "${resA}", schedule_block_id: "${blk}", rotation_id: "${rot}" }, as: ProgramCoordinator, captures: { a1: "$.data.id" } }
            - { call: "POST /residency-programs/rotation-assignments", payload: { resident_id: "${resB}", schedule_block_id: "${blk}", rotation_id: "${rot}" }, as: ProgramCoordinator, captures: { a2: "$.data.id" } }
            - { call: "POST /residency-programs/rotation-assignments", payload: { resident_id: "${resC}", schedule_block_id: "${blk}", rotation_id: "${rot}" }, as: ProgramCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "First assignment (count 0 < 2) succeeds with status PLANNED"
            - "Second assignment (count 1 < 2) succeeds — reaching exactly max is permitted"
            - "Third assignment (count 2 == max) is rejected with error_id ERR_ROTATION_CAPACITY_FULL (409)"
            - "GET rotation-assignments?rotation_id + schedule_block_id shows total_count == 2"

      - name: survey_response_rate_exact_boundary
        grounds:
          - state_machines.AnnualSurvey.OPEN_to_CLOSED
          - calculations.program_accreditation_status
        distinguishing_aspect: |
          Metric: survey response rate via survey close (different metric and
          endpoint than duty hours and rotation capacity). resident_response_rate
          == 70.00 is compliant (rule is strictly < 70.00) and creates NO
          citation; the §1.8 cascade instance covers 69.99 creating one —
          together they pin the boundary from both sides.
        test_recipe:
          setup:
            - "Program with year; AnnualSurvey OPEN"
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-0018" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/annual-surveys", payload: { program_id: "${prog}", academic_year_id: "${yr}" }, as: ProgramCoordinator, captures: { surv: "$.data.id" } }
          trigger:
            - { call: "POST /residency-programs/annual-surveys/${surv}/close", payload: { resident_response_rate: 70.00, faculty_response_rate: 100.00, area_results: [ { area_code: "DUTY_HOURS", compliance_pct: 70.00 }, { area_code: "EVALUATION", compliance_pct: 100.00 } ] }, as: DesignatedInstitutionalOfficial, captures: { fl: "$.data.flagged_area_count", sst: "$.data.status" } }
            - { call: "GET /residency-programs/accreditation-citations", payload: { program_id: "${prog}" }, as: DesignatedInstitutionalOfficial }
          assert:
            - "Close succeeds: status == CLOSED, flagged_area_count == 0 (70.00 is NOT < 70.00)"
            - "GET accreditation-citations?program_id == total_count 0 (no RESPONSE_RATE citation at exactly 70.00)"
            - "program.accreditation_status == CONTINUED"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: assignment_requires_active_academic_year
        grounds:
          - state_machines.RotationAssignment
          - state_machines.AcademicYear
          - errors[ERR_ACADEMIC_YEAR_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair RotationAssignment -> AcademicYear: creating an assignment into a
          block of a PLANNING (never-activated) year is rejected even though the
          resident is ACTIVE and the rotation has capacity; activating the year
          afterwards makes the identical payload succeed.
        test_recipe:
          setup:
            - "Program with year2 in PLANNING (13 blocks auto-created) and year1 ACTIVE carrying an ACTIVE resident (complement approved on year1)"
            - "Rotation Wards (capacity 2) ACTIVE"
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-0019" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years/${yr}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2027-2028", start_date: "2027-07-01", end_date: "2028-06-29" }, as: ProgramCoordinator, captures: { yr2: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog}", academic_year_id: "${yr}", pgy_level: 1, approved_positions: 2, annual_funding_budget_cents: 100000000, blended_stipend_cents: 6000000 }, as: ProgramDirector, captures: { comp: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/complement-approvals/${comp}/approve", payload: {}, as: DesignatedInstitutionalOfficial }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "R One", email: "r1@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { res: "$.data.id" } }
            - { call: "POST /residency-programs/residents/${res}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/rotations", payload: { program_id: "${prog}", name: "Wards", min_pgy_level: 1, max_residents_per_block: 2 }, as: ProgramCoordinator, captures: { rot: "$.data.id" } }
            - { call: "GET /residency-programs/schedule-blocks", payload: { academic_year_id: "${yr2}" }, as: ProgramCoordinator, captures: { blk2: "$.data[0].id" } }
          trigger:
            - { call: "POST /residency-programs/rotation-assignments", payload: { resident_id: "${res}", schedule_block_id: "${blk2}", rotation_id: "${rot}" }, as: ProgramCoordinator, captures: { err: "$.data.error_id" } }
            - { call: "POST /residency-programs/academic-years/${yr2}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/rotation-assignments", payload: { resident_id: "${res}", schedule_block_id: "${blk2}", rotation_id: "${rot}" }, as: ProgramCoordinator, captures: { asg: "$.data.id", ast: "$.data.status" } }
          assert:
            - "While year2 is PLANNING: create fails with error_id ERR_ACADEMIC_YEAR_NOT_ACTIVE"
            - "After POST academic-years/{yr2}/activate the IDENTICAL payload succeeds: status == PLANNED"
            - "Only the AcademicYear state changed between the two attempts (same resident, block, rotation)"

      - name: moonlighting_approve_requires_good_standing
        grounds:
          - state_machines.MoonlightingRequest.SUBMITTED_to_APPROVED
          - state_machines.ResidentStanding
          - errors[ERR_STANDING_BLOCKS_MOONLIGHTING]
        distinguishing_aspect: |
          Pair MoonlightingRequest -> Resident: a request created and submitted
          while the resident was GOOD_STANDING becomes un-approvable the moment
          a remediation plan flips standing to UNDER_REMEDIATION — the approve
          gate re-reads the OTHER entity's current state; the SUBMITTED request
          itself is left untouched by the standing sweep.
        test_recipe:
          setup:
            - "Program, ACTIVE year, APPROVED complement, resident R ACTIVE/GOOD_STANDING"
            - "Moonlighting request SUBMITTED (created while GOOD_STANDING)"
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-0020" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years/${yr}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog}", academic_year_id: "${yr}", pgy_level: 1, approved_positions: 2, annual_funding_budget_cents: 100000000, blended_stipend_cents: 6000000 }, as: ProgramDirector, captures: { comp: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/complement-approvals/${comp}/approve", payload: {}, as: DesignatedInstitutionalOfficial }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "R One", email: "r1@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { res: "$.data.id" } }
            - { call: "POST /residency-programs/residents/${res}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/moonlighting-requests", payload: { resident_id: "${res}", type: "EXTERNAL", site_name: "County Clinic", start_date: "2026-09-01", end_date: "2026-10-01", hours_per_week: 4.00 }, as: Resident, as_user_id: "${res}", captures: { mr: "$.data.id" } }
            - { call: "POST /residency-programs/moonlighting-requests/${mr}/submit", payload: {}, as: Resident, as_user_id: "${res}" }
          trigger:
            - { call: "POST /residency-programs/remediation-plans", payload: { resident_id: "${res}", goals: "Professionalism coaching", start_date: "2026-08-01", end_date: "2026-10-30" }, as: ProgramDirector, captures: { rem: "$.data.id" } }
            - { call: "POST /residency-programs/moonlighting-requests/${mr}/approve", payload: {}, as: ProgramDirector, captures: { err: "$.data.error_id" } }
            - { call: "POST /residency-programs/remediation-plans/${rem}/complete", payload: { outcome: "SUCCESS" }, as: ProgramDirector }
            - { call: "POST /residency-programs/moonlighting-requests/${mr}/approve", payload: {}, as: ProgramDirector, captures: { mst: "$.data.status" } }
          assert:
            - "After remediation opens (standing UNDER_REMEDIATION): approve fails with error_id ERR_STANDING_BLOCKS_MOONLIGHTING (403)"
            - "MoonlightingRequest.${mr}.status stays SUBMITTED through the standing change (sweep revokes only APPROVED/ACTIVE)"
            - "After remediation completes SUCCESS (standing GOOD_STANDING): the same approve succeeds, status == APPROVED"
            - "The moonlighting decision depended solely on Resident.standing_status at approve time"

      - name: ccc_finalize_requires_evaluation_quorum
        grounds:
          - state_machines.CCCReview.IN_DELIBERATION_to_FINALIZED
          - errors[ERR_INSUFFICIENT_EVALUATIONS]
        distinguishing_aspect: |
          Pair CCCReview -> MilestoneEvaluation: finalize is blocked while only
          2 evaluations exist for (resident, year, period) and becomes legal
          the moment a 3rd evaluation is submitted — the review's transition
          space depends on the COUNT of a different entity's rows.
        test_recipe:
          setup:
            - "Program, ACTIVE year, APPROVED complement, resident ACTIVE"
            - "Exactly 2 milestone evaluations for (R, year, H1); CCC review IN_DELIBERATION"
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-0021" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years/${yr}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog}", academic_year_id: "${yr}", pgy_level: 1, approved_positions: 2, annual_funding_budget_cents: 100000000, blended_stipend_cents: 6000000 }, as: ProgramDirector, captures: { comp: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/complement-approvals/${comp}/approve", payload: {}, as: DesignatedInstitutionalOfficial }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "R One", email: "r1@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { res: "$.data.id" } }
            - { call: "POST /residency-programs/residents/${res}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/milestone-evaluations", payload: { resident_id: "${res}", academic_year_id: "${yr}", reporting_period: "H1", competency_ratings: [ { competency: "PATIENT_CARE", level: 3 }, { competency: "MEDICAL_KNOWLEDGE", level: 3 }, { competency: "PROFESSIONALISM", level: 3 }, { competency: "COMMUNICATION", level: 3 }, { competency: "PRACTICE_BASED_LEARNING", level: 3 }, { competency: "SYSTEMS_BASED_PRACTICE", level: 3 } ] }, as: FacultyEvaluator, as_user_id: "ev-1" }
            - { call: "POST /residency-programs/milestone-evaluations", payload: { resident_id: "${res}", academic_year_id: "${yr}", reporting_period: "H1", competency_ratings: [ { competency: "PATIENT_CARE", level: 3 }, { competency: "MEDICAL_KNOWLEDGE", level: 3 }, { competency: "PROFESSIONALISM", level: 3 }, { competency: "COMMUNICATION", level: 3 }, { competency: "PRACTICE_BASED_LEARNING", level: 3 }, { competency: "SYSTEMS_BASED_PRACTICE", level: 3 } ] }, as: FacultyEvaluator, as_user_id: "ev-2" }
            - { call: "POST /residency-programs/ccc-reviews", payload: { resident_id: "${res}", academic_year_id: "${yr}", reporting_period: "H1" }, as: CCCChair, as_user_id: "chair-1", captures: { ccc: "$.data.id" } }
            - { call: "POST /residency-programs/ccc-reviews/${ccc}/begin-deliberation", payload: {}, as: CCCChair, as_user_id: "chair-1" }
          trigger:
            - { call: "POST /residency-programs/ccc-reviews/${ccc}/finalize", payload: { outcome: "SATISFACTORY", milestone_levels: [ { competency: "PATIENT_CARE", level: 3 }, { competency: "MEDICAL_KNOWLEDGE", level: 3 }, { competency: "PROFESSIONALISM", level: 3 }, { competency: "COMMUNICATION", level: 3 }, { competency: "PRACTICE_BASED_LEARNING", level: 3 }, { competency: "SYSTEMS_BASED_PRACTICE", level: 3 } ] }, as: CCCChair, as_user_id: "chair-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /residency-programs/milestone-evaluations", payload: { resident_id: "${res}", academic_year_id: "${yr}", reporting_period: "H1", competency_ratings: [ { competency: "PATIENT_CARE", level: 3 }, { competency: "MEDICAL_KNOWLEDGE", level: 3 }, { competency: "PROFESSIONALISM", level: 3 }, { competency: "COMMUNICATION", level: 3 }, { competency: "PRACTICE_BASED_LEARNING", level: 3 }, { competency: "SYSTEMS_BASED_PRACTICE", level: 3 } ] }, as: FacultyEvaluator, as_user_id: "ev-3" }
            - { call: "POST /residency-programs/ccc-reviews/${ccc}/finalize", payload: { outcome: "SATISFACTORY", milestone_levels: [ { competency: "PATIENT_CARE", level: 3 }, { competency: "MEDICAL_KNOWLEDGE", level: 3 }, { competency: "PROFESSIONALISM", level: 3 }, { competency: "COMMUNICATION", level: 3 }, { competency: "PRACTICE_BASED_LEARNING", level: 3 }, { competency: "SYSTEMS_BASED_PRACTICE", level: 3 } ] }, as: CCCChair, as_user_id: "chair-1", captures: { cst: "$.data.status" } }
          assert:
            - "With exactly 2 evaluations: finalize fails with error_id ERR_INSUFFICIENT_EVALUATIONS (409); review stays IN_DELIBERATION"
            - "After the 3rd evaluation: the identical finalize succeeds, status == FINALIZED"
            - "composite_snapshot is populated at finalize (quorum-gated computation)"
            - "No ProbationCase or RemediationPlan is created (outcome SATISFACTORY)"

      - name: complement_approve_blocked_when_program_probationary
        grounds:
          - state_machines.ComplementApproval.SUBMITTED_to_APPROVED
          - calculations.program_accreditation_status
          - errors[ERR_PROGRAM_PROBATIONARY]
        distinguishing_aspect: |
          Pair ComplementApproval -> ResidencyProgram: DIO approval of a
          SUBMITTED complement is legal while the program is CONTINUED but
          rejected with ERR_PROGRAM_PROBATIONARY once two unresolved SERIOUS
          citations flip the derived accreditation_status to PROBATIONARY —
          the complement workflow reads the program's derived state.
        test_recipe:
          setup:
            - "Program with year; complement row SUBMITTED"
            - "Program currently CONTINUED"
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-0022" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog}", academic_year_id: "${yr}", pgy_level: 1, approved_positions: 4, annual_funding_budget_cents: 100000000, blended_stipend_cents: 6000000 }, as: ProgramDirector, captures: { comp: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector }
          trigger:
            - { call: "POST /residency-programs/accreditation-citations", payload: { program_id: "${prog}", citation_code: "IV.A.1", severity: "SERIOUS", area_code: "SUPERVISION", due_date: "2026-12-01" }, as: DesignatedInstitutionalOfficial, captures: { c1: "$.data.id" } }
            - { call: "POST /residency-programs/accreditation-citations", payload: { program_id: "${prog}", citation_code: "III.B.3", severity: "SERIOUS", area_code: "DUTY_HOURS", due_date: "2026-12-01" }, as: DesignatedInstitutionalOfficial, captures: { c2: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/approve", payload: {}, as: DesignatedInstitutionalOfficial, captures: { err: "$.data.error_id" } }
            - { call: "POST /residency-programs/accreditation-citations/${c1}/draft-response", payload: { response_text: "Supervision plan revised." }, as: ProgramDirector }
            - { call: "POST /residency-programs/accreditation-citations/${c1}/submit-response", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/accreditation-citations/${c1}/resolve", payload: { resolution_note: "Accepted" }, as: DesignatedInstitutionalOfficial }
            - { call: "POST /residency-programs/accreditation-citations/${c2}/draft-response", payload: { response_text: "Duty hour monitoring overhauled." }, as: ProgramDirector }
            - { call: "POST /residency-programs/accreditation-citations/${c2}/submit-response", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/accreditation-citations/${c2}/resolve", payload: { resolution_note: "Accepted" }, as: DesignatedInstitutionalOfficial }
            - { call: "POST /residency-programs/complement-approvals/${comp}/approve", payload: {}, as: DesignatedInstitutionalOfficial, captures: { st: "$.data.status" } }
          assert:
            - "After two OPEN SERIOUS citations: program.accreditation_status == PROBATIONARY"
            - "Complement approve is rejected with error_id ERR_PROGRAM_PROBATIONARY (403); row stays SUBMITTED"
            - "After both citations are RESOLVED: program.accreditation_status == CONTINUED and the same approve succeeds (status == APPROVED)"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: resident_block_unit_slot_conflict
        grounds:
          - state_machines.RotationAssignment
          - errors[ERR_BLOCK_ASSIGNMENT_CONFLICT]
          - entities.ScheduleBlock
        distinguishing_aspect: |
          Interval semantics: indivisible 28-day UNIT SLOT — a resident occupies
          a whole block; a second non-CANCELLED assignment in the same block is
          a conflict regardless of which rotations are involved. Adjacent blocks
          (block 1 then block 2) are fine. Contrasts with the half-open date-
          range semantics of moonlighting.
        test_recipe:
          setup:
            - "Program, ACTIVE year, APPROVED complement, resident R ACTIVE"
            - "Rotations Wards and ICU (capacity 5 each); blocks 1 and 2 captured"
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-0023" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years/${yr}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog}", academic_year_id: "${yr}", pgy_level: 1, approved_positions: 2, annual_funding_budget_cents: 100000000, blended_stipend_cents: 6000000 }, as: ProgramDirector, captures: { comp: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/complement-approvals/${comp}/approve", payload: {}, as: DesignatedInstitutionalOfficial }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "R One", email: "r1@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { res: "$.data.id" } }
            - { call: "POST /residency-programs/residents/${res}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/rotations", payload: { program_id: "${prog}", name: "Wards", min_pgy_level: 1, max_residents_per_block: 5 }, as: ProgramCoordinator, captures: { rotA: "$.data.id" } }
            - { call: "POST /residency-programs/rotations", payload: { program_id: "${prog}", name: "ICU", min_pgy_level: 1, max_residents_per_block: 5 }, as: ProgramCoordinator, captures: { rotB: "$.data.id" } }
            - { call: "GET /residency-programs/schedule-blocks", payload: { academic_year_id: "${yr}" }, as: ProgramCoordinator, captures: { blk1: "$.data[0].id", blk2: "$.data[1].id" } }
          trigger:
            - { call: "POST /residency-programs/rotation-assignments", payload: { resident_id: "${res}", schedule_block_id: "${blk1}", rotation_id: "${rotA}" }, as: ProgramCoordinator, captures: { a1: "$.data.id" } }
            - { call: "POST /residency-programs/rotation-assignments", payload: { resident_id: "${res}", schedule_block_id: "${blk1}", rotation_id: "${rotB}" }, as: ProgramCoordinator, captures: { err: "$.data.error_id" } }
            - { call: "POST /residency-programs/rotation-assignments", payload: { resident_id: "${res}", schedule_block_id: "${blk2}", rotation_id: "${rotB}" }, as: ProgramCoordinator, captures: { a2: "$.data.id" } }
            - { call: "POST /residency-programs/rotation-assignments/${a1}/cancel", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/rotation-assignments", payload: { resident_id: "${res}", schedule_block_id: "${blk1}", rotation_id: "${rotB}" }, as: ProgramCoordinator, captures: { a3: "$.data.id" } }
          assert:
            - "Second assignment into the SAME block (different rotation, ample capacity) fails with error_id ERR_BLOCK_ASSIGNMENT_CONFLICT (unit-slot semantics: one resident occupies the whole block)"
            - "Assignment into the ADJACENT block 2 succeeds (block adjacency is not a conflict, unlike partial date overlap)"
            - "After cancelling a1, a fresh assignment into block 1 succeeds — CANCELLED releases the slot"
            - "Capacity was never the binding constraint (max_residents_per_block 5 throughout)"

      - name: moonlighting_half_open_interval_overlap
        grounds:
          - state_machines.MoonlightingRequest
          - errors[ERR_MOONLIGHTING_OVERLAP]
          - entities.MoonlightingRequest
        distinguishing_aspect: |
          Interval semantics: continuous half-open [start_date, end_date) ranges
          — a request starting 2026-09-15 inside an APPROVED [2026-09-01,
          2026-10-01) window conflicts, while a request starting exactly at
          2026-10-01 (end == start) is legal adjacency. Different geometric
          treatment than the indivisible-block slot rule.
        test_recipe:
          setup:
            - "Program, ACTIVE year, APPROVED complement, resident R ACTIVE/GOOD_STANDING"
            - "Request A APPROVED for [2026-09-01, 2026-10-01) 3.00 h/wk"
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-0024" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years/${yr}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog}", academic_year_id: "${yr}", pgy_level: 1, approved_positions: 2, annual_funding_budget_cents: 100000000, blended_stipend_cents: 6000000 }, as: ProgramDirector, captures: { comp: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/complement-approvals/${comp}/approve", payload: {}, as: DesignatedInstitutionalOfficial }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "R One", email: "r1@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { res: "$.data.id" } }
            - { call: "POST /residency-programs/residents/${res}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/moonlighting-requests", payload: { resident_id: "${res}", type: "EXTERNAL", site_name: "Clinic A", start_date: "2026-09-01", end_date: "2026-10-01", hours_per_week: 3.00 }, as: Resident, as_user_id: "${res}", captures: { mrA: "$.data.id" } }
            - { call: "POST /residency-programs/moonlighting-requests/${mrA}/submit", payload: {}, as: Resident, as_user_id: "${res}" }
            - { call: "POST /residency-programs/moonlighting-requests/${mrA}/approve", payload: {}, as: ProgramDirector }
          trigger:
            - { call: "POST /residency-programs/moonlighting-requests", payload: { resident_id: "${res}", type: "EXTERNAL", site_name: "Clinic B", start_date: "2026-09-15", end_date: "2026-11-01", hours_per_week: 2.00 }, as: Resident, as_user_id: "${res}", captures: { err: "$.data.error_id" } }
            - { call: "POST /residency-programs/moonlighting-requests", payload: { resident_id: "${res}", type: "EXTERNAL", site_name: "Clinic C", start_date: "2026-10-01", end_date: "2026-11-01", hours_per_week: 2.00 }, as: Resident, as_user_id: "${res}", captures: { mrC: "$.data.id", cst: "$.data.status" } }
          assert:
            - "Request B [2026-09-15, 2026-11-01) is rejected with error_id ERR_MOONLIGHTING_OVERLAP (partial intersection with A's [2026-09-01, 2026-10-01))"
            - "Request C [2026-10-01, 2026-11-01) is created with status DRAFT — end == start adjacency is NOT an overlap under half-open semantics"
            - "Overlap is evaluated at CREATE against statuses {SUBMITTED, APPROVED, ACTIVE}"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: attest_void_conserves_official_weekly_hours
        grounds:
          - state_machines.DutyHourLog
          - calculations.official_weekly_duty_hours
        distinguishing_aspect: |
          Conserved quantity: the resident's official weekly duty hours. Attest
          of a 16.00h log moves the week's official hours 40.00 -> 56.00 and the
          rolling average 10.00 -> 14.00; voiding the same log restores BOTH to
          exactly 40.00 / 10.00 with no drift — the forward/compensating pair
          leaves the aggregate bit-identical.
        test_recipe:
          setup:
            - "Program, ACTIVE year, APPROVED complement, resident R ACTIVE"
            - "4 ATTESTED 10.00h logs Mon-Thu of week 2026-08-03 (official 40.00, rolling avg 10.00; gaps 14h, no violations)"
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-0025" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years/${yr}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog}", academic_year_id: "${yr}", pgy_level: 1, approved_positions: 2, annual_funding_budget_cents: 100000000, blended_stipend_cents: 6000000 }, as: ProgramDirector, captures: { comp: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/complement-approvals/${comp}/approve", payload: {}, as: DesignatedInstitutionalOfficial }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "R One", email: "r1@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { res: "$.data.id" } }
            - { call: "POST /residency-programs/residents/${res}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/duty-hour-logs", payload: { resident_id: "${res}", started_at: "2026-08-03T00:00:00Z", ended_at: "2026-08-03T10:00:00Z" }, as: Resident, as_user_id: "${res}", captures: { l1: "$.data.id" } }
            - { call: "POST /residency-programs/duty-hour-logs/${l1}/attest", payload: {}, as: Resident, as_user_id: "${res}" }
            - { call: "POST /residency-programs/duty-hour-logs", payload: { resident_id: "${res}", started_at: "2026-08-04T00:00:00Z", ended_at: "2026-08-04T10:00:00Z" }, as: Resident, as_user_id: "${res}", captures: { l2: "$.data.id" } }
            - { call: "POST /residency-programs/duty-hour-logs/${l2}/attest", payload: {}, as: Resident, as_user_id: "${res}" }
            - { call: "POST /residency-programs/duty-hour-logs", payload: { resident_id: "${res}", started_at: "2026-08-05T00:00:00Z", ended_at: "2026-08-05T10:00:00Z" }, as: Resident, as_user_id: "${res}", captures: { l3: "$.data.id" } }
            - { call: "POST /residency-programs/duty-hour-logs/${l3}/attest", payload: {}, as: Resident, as_user_id: "${res}" }
            - { call: "POST /residency-programs/duty-hour-logs", payload: { resident_id: "${res}", started_at: "2026-08-06T00:00:00Z", ended_at: "2026-08-06T10:00:00Z" }, as: Resident, as_user_id: "${res}", captures: { l4: "$.data.id" } }
            - { call: "POST /residency-programs/duty-hour-logs/${l4}/attest", payload: {}, as: Resident, as_user_id: "${res}" }
            - { call: "GET /residency-programs/residents/${res}/duty-hour-summary", payload: { week_start: "2026-08-03" }, as: ProgramDirector, captures: { off0: "$.data.official_hours", avg0: "$.data.rolling_4wk_avg_official" } }
          trigger:
            - { call: "POST /residency-programs/duty-hour-logs", payload: { resident_id: "${res}", started_at: "2026-08-07T00:00:00Z", ended_at: "2026-08-07T16:00:00Z" }, as: Resident, as_user_id: "${res}", captures: { l5: "$.data.id" } }
            - { call: "POST /residency-programs/duty-hour-logs/${l5}/attest", payload: {}, as: Resident, as_user_id: "${res}" }
            - { call: "GET /residency-programs/residents/${res}/duty-hour-summary", payload: { week_start: "2026-08-03" }, as: ProgramDirector, captures: { off1: "$.data.official_hours", avg1: "$.data.rolling_4wk_avg_official" } }
            - { call: "POST /residency-programs/duty-hour-logs/${l5}/void", payload: { void_reason: "duplicate entry" }, as: Resident, as_user_id: "${res}", captures: { lst: "$.data.status" } }
            - { call: "GET /residency-programs/residents/${res}/duty-hour-summary", payload: { week_start: "2026-08-03" }, as: ProgramDirector, captures: { off2: "$.data.official_hours", avg2: "$.data.rolling_4wk_avg_official" } }
          assert:
            - "Baseline: official_hours == 40.00 and rolling_4wk_avg_official == 10.00"
            - "After attest of the 16.00h log: official_hours == 56.00, rolling_4wk_avg_official == 14.00"
            - "After void: official_hours == 40.00 and rolling_4wk_avg_official == 10.00 EXACTLY (compensating action restores the conserved aggregate with zero drift)"
            - "DutyHourLog.${l5}.status == VOID; voided rows are excluded from the aggregate"
            - "No DutyHourViolation exists for R at any point (56.00/4 = 14.00 <= 80.00; rest gaps all >= 14h; 5 worked days)"

      - name: verify_void_conserves_verified_case_count
        grounds:
          - state_machines.ProcedureCaseLog
          - calculations.case_log_progress
        distinguishing_aspect: |
          Conserved quantity: the VERIFIED case count per (resident, category).
          Verify moves effective_cases 0.00 -> 1.00; the compensating void
          returns it to exactly 0.00 (and all_met stays false throughout) —
          different conserved quantity than duty hours (discrete weighted case
          credit vs continuous hour sum).
        test_recipe:
          setup:
            - "Program, ACTIVE year, APPROVED complement, resident R ACTIVE, rotation exists"
            - "CaseRequirement MAJOR_SURGERY required_count 2, required_primary_count 1"
            - "One LOGGED SURGEON case"
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro Surgery", specialty: "GENERAL_SURGERY", acgme_program_code: "440-00-0026" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years/${yr}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog}", academic_year_id: "${yr}", pgy_level: 1, approved_positions: 2, annual_funding_budget_cents: 100000000, blended_stipend_cents: 6000000 }, as: ProgramDirector, captures: { comp: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/complement-approvals/${comp}/approve", payload: {}, as: DesignatedInstitutionalOfficial }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "R One", email: "r1@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { res: "$.data.id" } }
            - { call: "POST /residency-programs/residents/${res}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/rotations", payload: { program_id: "${prog}", name: "General Surgery", min_pgy_level: 1, max_residents_per_block: 5 }, as: ProgramCoordinator, captures: { rot: "$.data.id" } }
            - { call: "POST /residency-programs/case-requirements", payload: { program_id: "${prog}", procedure_category: "MAJOR_SURGERY", required_count: 2, required_primary_count: 1 }, as: ProgramDirector, captures: { req: "$.data.id" } }
            - { call: "POST /residency-programs/procedure-case-logs", payload: { resident_id: "${res}", rotation_id: "${rot}", procedure_category: "MAJOR_SURGERY", performed_date: "2026-08-03", role: "SURGEON" }, as: Resident, as_user_id: "${res}", captures: { cl: "$.data.id" } }
            - { call: "GET /residency-programs/residents/${res}/case-progress", payload: {}, as: ProgramDirector, captures: { met0: "$.data.all_met" } }
          trigger:
            - { call: "POST /residency-programs/procedure-case-logs/${cl}/verify", payload: {}, as: FacultyEvaluator, as_user_id: "ev-1", captures: { s1: "$.data.status" } }
            - { call: "GET /residency-programs/residents/${res}/case-progress", payload: {}, as: ProgramDirector, captures: { met1: "$.data.all_met" } }
            - { call: "POST /residency-programs/procedure-case-logs/${cl}/void", payload: { void_reason: "duplicate log entry" }, as: ProgramDirector, captures: { s2: "$.data.status" } }
            - { call: "GET /residency-programs/residents/${res}/case-progress", payload: {}, as: ProgramDirector, captures: { met2: "$.data.all_met" } }
          assert:
            - "Baseline (LOGGED): MAJOR_SURGERY effective_cases == 0.00, verified_primary == 0, all_met == false"
            - "After verify: effective_cases == 1.00, verified_primary == 1 (SURGEON weight 1.0), status == VERIFIED"
            - "After void (compensating action): effective_cases == 0.00 and verified_primary == 0 EXACTLY — the verified-count invariant is restored"
            - "ProcedureCaseLog.${cl}.status == VOIDED; VOIDED rows never re-enter case_log_progress"
            - "all_met == false at every point (required_count 2 never reached)"
