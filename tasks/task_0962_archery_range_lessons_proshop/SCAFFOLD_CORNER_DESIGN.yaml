  - section: rbac
    instances:
      - name: member_cannot_record_safety_strikes
        claim_type: violation_to_error
        grounds: [roles]
        distinguishing_aspect: "RangeOfficer-exclusive operation: a Member calling POST /members/{id}/safety-strikes gets ERR_UNAUTHORIZED (403) even on their own member id."
        test_recipe:
          setup: ["member exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: Admin }
            - call: "POST /members"
              payload: { email: "rbac1@x.com", full_name: "Rbac One", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /members/${m_id}/safety-strikes"
              payload: { reason: "self report" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED (403); safety_strikes stays 0"
      - name: coach_cannot_confirm_others_lesson
        claim_type: violation_to_error
        grounds: [roles, state_machines.Lesson.REQUESTED_to_CONFIRMED]
        distinguishing_aspect: "Coach ownership: coach2 confirming coach1's lesson fails ERR_UNAUTHORIZED (X-User-ID != lesson.coach_id) before any state check."
        test_recipe:
          setup: ["coaches c1, c2; member with wallet/waiver; lesson REQUESTED for c1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: Admin }
            - call: "POST /coaches"
              payload: { full_name: "Coach One", disciplines: ["RECURVE"] }
              as: Admin
              captures: { c1: $.data.id }
            - call: "POST /coaches"
              payload: { full_name: "Coach Two", disciplines: ["RECURVE"] }
              as: Admin
              captures: { c2: $.data.id }
            - call: "POST /members"
              payload: { email: "rbac2@x.com", full_name: "Rbac Two", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - { call: "POST /members/${m_id}/wallet/adjustments", payload: { amount_cents: 10000 }, as: Admin }
            - { call: "POST /members/${m_id}/waivers", payload: {}, as: Member, as_user_id: "${m_id}" }
            - call: "POST /lessons"
              payload: { coach_id: "${c1}", discipline: "RECURVE", proposed_start_at: "2026-05-02T10:00:00Z", duration_minutes: 60 }
              as: Member
              as_user_id: "${m_id}"
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /lessons/${l_id}/confirm"
              payload: {}
              as: Coach
              as_user_id: "${c2}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED (403); lesson stays REQUESTED; wallet unchanged 10000"
      - name: member_cannot_approve_others_repair
        claim_type: violation_to_error
        grounds: [roles, state_machines.RepairOrder]
        distinguishing_aspect: "Repair approval is owner-only: member2 approving member1's QUOTED order fails ERR_UNAUTHORIZED even though the state precondition (QUOTED) holds."
        test_recipe:
          setup: ["member1 owns an INTAKE repair order quoted (QUOTED); member2 exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: Admin }
            - call: "POST /members"
              payload: { email: "own1@x.com", full_name: "Owner One", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { email: "own2@x.com", full_name: "Owner Two", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { m2: $.data.id }
            - call: "POST /repair-orders"
              payload: { member_id: "${m1}", item_description: "loose sight" }
              as: ShopClerk
              captures: { ro_id: $.data.id, ro_v: $.data.version }
            - { call: "POST /repair-orders/${ro_id}/quote", payload: { parts: [], labor_minutes: 30, promised_hours: 72, expected_repair_order_version: "${ro_v}" }, as: ShopClerk }
          trigger:
            - call: "POST /repair-orders/${ro_id}/approve"
              payload: {}
              as: Member
              as_user_id: "${m2}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED (403); RepairOrder.${ro_id}.status remains QUOTED"
      - name: anonymous_cannot_book_session
        claim_type: violation_to_error
        grounds: [roles]
        distinguishing_aspect: "POST /range-sessions requires Member or RangeOfficer: Anonymous gets ERR_UNAUTHORIZED (403) before existence checks on the lane id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /range-sessions"
              payload: { lane_id: "00000000-0000-4000-8000-000000000000", booking_type: "WALK_IN", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T11:00:00Z" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED (403)"
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_scorecard_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[scorecard-correction-stale-version]"]
        distinguishing_aspect: "Two strictly sequential PUTs carrying the same captured version: the first succeeds (version 1 -> 2), the second is stale and fails ERR_STALE_VERSION (412) with no mutation."
        test_recipe:
          setup: ["league CLOSED, one CONFIRMED entry, scorecard SUBMITTED version 1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: Admin }
            - call: "POST /leagues"
              payload: { name: "OCC Cup", entry_fee_cents: 5000, max_entries: 10 }
              as: LeagueDirector
              captures: { lg_id: $.data.id }
            - call: "POST /members"
              payload: { email: "occ@x.com", full_name: "Occ Archer", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - { call: "POST /members/${m_id}/wallet/adjustments", payload: { amount_cents: 5000 }, as: Admin }
            - { call: "POST /members/${m_id}/waivers", payload: {}, as: Member, as_user_id: "${m_id}" }
            - call: "POST /leagues/${lg_id}/entries"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { e_id: $.data.id }
            - { call: "POST /leagues/${lg_id}/close", payload: {}, as: LeagueDirector }
            - call: "POST /league-entries/${e_id}/scorecards"
              payload: { ends: [[10,10,10],[10,10,10],[10,10,10],[10,10,10],[10,10,10],[10,10,10],[10,10,10],[10,10,10],[10,10,10],[10,10,10]], x_hits: 30 }
              as: Member
              as_user_id: "${m_id}"
              captures: { sc_id: $.data.id, sc_v: $.data.version }
          trigger:
            - call: "PUT /scorecards/${sc_id}"
              payload: { ends: [[9,9,9],[9,9,9],[9,9,9],[9,9,9],[9,9,9],[9,9,9],[9,9,9],[9,9,9],[9,9,9],[9,9,9]], x_hits: 0, expected_scorecard_version: "${sc_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { pts: $.data.total_points, v2: $.data.version }
            - call: "PUT /scorecards/${sc_id}"
              payload: { ends: [[8,8,8],[8,8,8],[8,8,8],[8,8,8],[8,8,8],[8,8,8],[8,8,8],[8,8,8],[8,8,8],[8,8,8]], x_hits: 0, expected_scorecard_version: "${sc_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "first PUT: total_points == 270, version == 2"
            - "second PUT with the same captured version: error_id == ERR_STALE_VERSION (412); total_points remains 270, version remains 2"
      - name: occ_stale_repair_quote_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[repair-quote-stale-version]"]
        distinguishing_aspect: "Re-quote from QUOTED legitimately supersedes the prior quote: a second quote carrying the pre-quote version is stale and fails ERR_STALE_VERSION (412); a quote carrying the current version succeeds."
        test_recipe:
          setup: ["repair order INTAKE version 1; product P (4000, stock 5)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: Admin }
            - call: "POST /members"
              payload: { email: "rq@x.com", full_name: "Requote Owner", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /shop-products"
              payload: { name: "Riser", sku: "RSR-1", unit_price_cents: 4000, initial_stock: 5 }
              as: ShopClerk
              captures: { p_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { member_id: "${m_id}", item_description: "bent riser" }
              as: ShopClerk
              captures: { ro_id: $.data.id, ro_v: $.data.version }
          trigger:
            - call: "POST /repair-orders/${ro_id}/quote"
              payload: { parts: [ { product_id: "${p_id}", qty: 1 } ], labor_minutes: 30, promised_hours: 72, expected_repair_order_version: "${ro_v}" }
              as: ShopClerk
              captures: { ro_v2: $.data.version }
            - call: "POST /repair-orders/${ro_id}/quote"
              payload: { parts: [ { product_id: "${p_id}", qty: 2 } ], labor_minutes: 60, promised_hours: 72, expected_repair_order_version: "${ro_v}" }
              as: ShopClerk
              captures: { err: $.data.error_id }
            - call: "POST /repair-orders/${ro_id}/quote"
              payload: { parts: [ { product_id: "${p_id}", qty: 2 } ], labor_minutes: 60, promised_hours: 72, expected_repair_order_version: "${ro_v2}" }
              as: ShopClerk
              captures: { qt: $.data.quote_total_cents }
          assert:
            - "first quote succeeds (version 1 -> 2)"
            - "second quote with stale version: error_id == ERR_STALE_VERSION (412), quote_total unchanged"
            - "third quote with current version succeeds: parts_total 8000 + labor 2 blocks x 1500 = 3000 (BASIC, no rush) -> quote_total_cents == 11000"
      - name: quote_supersede_releases_prior_parts_reservation
        claim_type: derived_field_reconciliation
        grounds: [calculations.repair_quote_total, entities.ShopProduct.fields.stock_quantity]
        distinguishing_aspect: "Re-quoting recomputes the reservation: quote1 reserves 1 unit (stock 5 -> 4); superseding quote2 reserves 2 units net, releasing the old hold first (stock 4 -> 3, not 2)."
        test_recipe:
          setup: ["repair order QUOTED with parts P x1 (stock 4 after reserve)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: Admin }
            - call: "POST /members"
              payload: { email: "rel@x.com", full_name: "Release Owner", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /shop-products"
              payload: { name: "Cam", sku: "CAM-1", unit_price_cents: 2000, initial_stock: 5 }
              as: ShopClerk
              captures: { p_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { member_id: "${m_id}", item_description: "cam timing" }
              as: ShopClerk
              captures: { ro_id: $.data.id, ro_v: $.data.version }
            - call: "POST /repair-orders/${ro_id}/quote"
              payload: { parts: [ { product_id: "${p_id}", qty: 1 } ], labor_minutes: 30, promised_hours: 72, expected_repair_order_version: "${ro_v}" }
              as: ShopClerk
              captures: { ro_v2: $.data.version }
          trigger:
            - call: "POST /repair-orders/${ro_id}/quote"
              payload: { parts: [ { product_id: "${p_id}", qty: 2 } ], labor_minutes: 30, promised_hours: 72, expected_repair_order_version: "${ro_v2}" }
              as: ShopClerk
            - call: "GET /shop-products"
              payload: {}
              as: ShopClerk
              captures: { stock: "$.data[0].stock_quantity" }
          assert:
            - "after quote1: stock_quantity == 4; after superseding quote2 (qty 2): stock_quantity == 3 (old reservation fully released before the new hold)"
  - section: consistency_model
