            - "FinanceSteward GET donors -> 200, total_count == 1"

  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_amend_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[agreement-amend-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on GiftAgreement.version: amend with the current version succeeds (version 1 -> 2); a second amend replaying the stale version 1 is rejected 412 ERR_STALE_VERSION and changes nothing."
        test_recipe:
          setup: ["Donor D; ACTIVE table; DRAFT agreement at version 1"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "OCC Amend", date_of_birth: "1956-03-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CRT_ANNUITY", gift_amount_cents: 10000000, payout_rate_bps: 500, lives: 1, annuitant_1_age: 80, funding_month: "2026-08" }, as: GiftOfficer, captures: { ag: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "POST /giving/gift-agreements/${ag}/amend", payload: { expected_gift_agreement_version: "${v1}", restriction_type: "RESEARCH" }, as: GiftAdministrator, captures: { v2: $.data.version, rt2: $.data.restriction_type } }
            - { call: "POST /giving/gift-agreements/${ag}/amend", payload: { expected_gift_agreement_version: "${v1}", restriction_type: "CAPITAL" }, as: GiftAdministrator, captures: { err: $.data.error_id } }
            - { call: "GET /giving/gift-agreements/${ag}", payload: {}, as: GiftAdministrator, captures: { v_final: $.data.version, rt_final: $.data.restriction_type } }
          assert:
            - "first amend: version ${v2} == 2 and restriction_type == RESEARCH (${rt2})"
            - "stale amend: ${err} == ERR_STALE_VERSION (412)"
            - "post-state: version still 2 (${v_final}); restriction_type still RESEARCH (${rt_final}) — the losing request applied nothing"
      - name: occ_reserve_adjustment_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reserve-adjust-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on ReserveFund.version: an adjustment against version v0 succeeds (v0 -> v0+1); replaying another adjustment with the same stale v0 is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["reserve fund at version v0"]
          setup_api_calls:
            - { call: "GET /giving/reserve-fund", payload: {}, as: ComplianceOfficer, captures: { v0: $.data.version } }
          trigger:
            - { call: "POST /giving/reserve-fund/adjustments", payload: { direction: "CONTRIBUTION", amount_cents: 100000, expected_reserve_fund_version: "${v0}" }, as: ComplianceOfficer, captures: { v1: $.data.version, bal1: $.data.balance_cents } }
            - { call: "POST /giving/reserve-fund/adjustments", payload: { direction: "CONTRIBUTION", amount_cents: 100000, expected_reserve_fund_version: "${v0}" }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
            - { call: "GET /giving/reserve-fund", payload: {}, as: ComplianceOfficer, captures: { bal2: $.data.balance_cents } }
          assert:
            - "first adjustment: version ${v1} == ${v0} + 1, balance 100000 (${bal1})"
            - "stale replay: ${err} == ERR_STALE_VERSION (412); balance unchanged 100000 (${bal2})"
      - name: derived_field_received_value_reconciles
        claim_type: derived_field_reconciliation
        grounds: [entities.GiftAgreement.fields.received_value_cents, state_machines.GiftAsset.RECEIVED_to_RETURNED]
        distinguishing_aspect: "received_value_cents reconciles on both directions of asset mutation: receiving 6000000 raises it to 6000000 (agreement stays EXECUTED below the 10000000 gift); returning the asset drops it back to 0."
        test_recipe:
          setup: ["CRAT (gift 10000000) EXECUTED; cash asset 6000000 pledged"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Reconcile", date_of_birth: "1946-06-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CRT_ANNUITY", gift_amount_cents: 10000000, payout_rate_bps: 500, lives: 1, annuitant_1_age: 80, funding_month: "2026-08" }, as: GiftOfficer, captures: { ag: $.data.id } }
            - { call: "POST /giving/beneficiary-designations", payload: { gift_agreement_id: "${ag}", slot: "PRIMARY_1", beneficiary_name: "Heir", document_received: true }, as: GiftOfficer, captures: { bd: $.data.id } }
            - { call: "POST /giving/beneficiary-designations/${bd}/transition", payload: { action: "SUBMIT" }, as: GiftOfficer }
            - { call: "POST /giving/beneficiary-designations/${bd}/transition", payload: { action: "VERIFY" }, as: GiftAdministrator }
            - { call: "POST /giving/gift-agreements/${ag}/execute", payload: {}, as: GiftAdministrator, as_user_id: "admin-1" }
            - { call: "POST /giving/gift-assets", payload: { gift_agreement_id: "${ag}", asset_kind: "CASH", pledged_value_cents: 6000000 }, as: EstateManager, captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /giving/gift-assets/${a1}/transition", payload: { action: "RECEIVE" }, as: EstateManager }
            - { call: "GET /giving/gift-agreements/${ag}", payload: {}, as: EstateManager, captures: { rv1: $.data.received_value_cents, st1: $.data.status } }
            - { call: "POST /giving/gift-assets/${a1}/transition", payload: { action: "RETURN" }, as: EstateManager }
            - { call: "GET /giving/gift-agreements/${ag}", payload: {}, as: EstateManager, captures: { rv2: $.data.received_value_cents, st2: $.data.status } }
          assert:
            - "after RECEIVE: received_value_cents == 6000000 (${rv1}), status still EXECUTED (${st1})"
            - "after RETURN: received_value_cents == 0 (${rv2}), status EXECUTED (${st2}) — no funding flip-flop"
      - name: scheduled_defer_past_rejected
        claim_type: scheduled_actions
        grounds: [state_machines.AnnuityPayment.DUE_to_DEFERRED, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "DEFER requires defer_until in the future of the logical clock: at clock 2026-09-01, defer_until 2026-08-15 fails 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["CRAT (gift 1665017, 600bps, MONTHLY, age 98) ACTIVE; clock 2026-09-01; payment 1 DUE"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Defer Past", date_of_birth: "1928-01-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CRT_ANNUITY", gift_amount_cents: 1665017, payout_rate_bps: 600, payment_frequency: "MONTHLY", lives: 1, annuitant_1_age: 98, funding_month: "2026-08" }, as: GiftOfficer, captures: { ag: $.data.id } }
            - { call: "POST /giving/beneficiary-designations", payload: { gift_agreement_id: "${ag}", slot: "PRIMARY_1", beneficiary_name: "Heir", document_received: true }, as: GiftOfficer, captures: { bd: $.data.id } }
            - { call: "POST /giving/beneficiary-designations/${bd}/transition", payload: { action: "SUBMIT" }, as: GiftOfficer }
            - { call: "POST /giving/beneficiary-designations/${bd}/transition", payload: { action: "VERIFY" }, as: GiftAdministrator }
            - { call: "POST /giving/gift-agreements/${ag}/execute", payload: {}, as: GiftAdministrator, as_user_id: "admin-1" }
            - { call: "POST /giving/gift-assets", payload: { gift_agreement_id: "${ag}", asset_kind: "CASH", pledged_value_cents: 1665017 }, as: EstateManager, captures: { a1: $.data.id } }
            - { call: "POST /giving/gift-assets/${a1}/transition", payload: { action: "RECEIVE" }, as: EstateManager }
            - { call: "POST /giving/gift-agreements/${ag}/generate-payment-schedule", payload: {}, as: GiftAdministrator }
            - { call: "POST /giving/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /giving/annuity-payments", payload: { gift_agreement_id: "${ag}", status: "DUE" }, as: GiftAdministrator, captures: { p1: "$.data[0].id" } }
          trigger:
            - { call: "POST /giving/annuity-payments/${p1}/transition", payload: { action: "DEFER", defer_until: "2026-08-15T00:00:00Z" }, as: GiftAdministrator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST (400); payment remains DUE"
      - name: clock_default_milestone_boundary
        claim_type: scheduled_actions
        grounds: [state_machines.ProbateMilestone.PENDING_to_OVERDUE, endpoints]
        distinguishing_aspect: "The default logical clock is exactly 2026-08-01T00:00:00Z and the overdue rule is STRICT (due_date < now): a milestone due exactly at the default instant stays PENDING; it flips to OVERDUE only after the clock advances past it."
        test_recipe:
          setup: ["Deceased donor; estate with milestone due exactly 2026-08-01T00:00:00Z (the default clock value); clock never set"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Clock Default", date_of_birth: "1935-01-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/donors/${d_id}/record-death", payload: { deceased_on: "2026-07-15T00:00:00Z" }, as: EstateManager, as_user_id: "em-1" }
            - { call: "POST /giving/estates", payload: { donor_id: "${d_id}", notified_on: "2026-07-16T00:00:00Z" }, as: EstateManager, as_user_id: "em-1", captures: { e_id: $.data.id } }
            - { call: "POST /giving/probate-milestones", payload: { estate_id: "${e_id}", kind: "PETITION", due_date: "2026-08-01T00:00:00Z" }, as: EstateManager, captures: { m_id: $.data.id, m_st: $.data.status } }
          trigger:
            - { call: "POST /giving/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /giving/probate-milestones", payload: { estate_id: "${e_id}" }, as: EstateManager, captures: { m_after: "$.data[0].status" } }
          assert:
            - "at creation under the default clock: status PENDING (${m_st}) — due_date == now is NOT overdue (strict <)"
            - "after clock 2026-08-02: status OVERDUE (${m_after})"

