  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cure_waterfall_conserves_escrow_plus_covered_shortfall
        grounds:
          - calculations.cure_escrow_waterfall
          - state_machines.Sublease.DEFAULTED_to_CURED
        distinguishing_aspect: |
          Conserved quantity: operator.escrow_balance_cents. The cure debits
          exactly shortfall + cure_fee and marks charges PAID for the same
          shortfall; escrow_before - escrow_after == shortfall + fee with zero
          drift, and a failed cure leaves escrow bit-identical (all-or-nothing).
        test_recipe:
          setup:
            - "Clock default. Strong operator, OPEN store, ACTIVE agreement, ACTIVE sublease, escrow 300,000, one OPEN rent charge 180,000, sublease DEFAULTED with cure_fee 15,000."
