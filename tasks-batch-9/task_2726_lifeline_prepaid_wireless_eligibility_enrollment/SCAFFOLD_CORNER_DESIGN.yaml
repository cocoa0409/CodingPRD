          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one ACTIVE TX carrier with cap 50 and three devices: D1 (BASIC 2100), D2 (BASIC 2100), D3 (STANDARD 1200)."
            - "One ACTIVE enrollment E1; D3 is issued to it explicitly, then returned DAMAGED at 2026-08-02, which retires D3 and waives the re-issue freeze."
            - "D1 is then issued explicitly at 2026-08-03, so the carrier holds D1 ISSUED, D2 IN_STOCK and D3 RETIRED."
