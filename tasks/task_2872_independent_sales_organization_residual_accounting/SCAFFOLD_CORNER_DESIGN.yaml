          setup: ["Program P1 (NET_REVENUE_SPLIT, buy_rate_bps 45, buy_rate_per_item_cents 6), agent A1 at split 0.50, and three ACTIVE merchants so each line lands on a distinct merchant. Batch B1 covers 2026-07; empty batch B2 covers the adjacent 2026-06 window."]
