        grounds:
          - state_machines.Device.SOILED_to_AVAILABLE
          - state_machines.Device.AVAILABLE_to_SOILED
          - entities.Device.fields.current_filter_serial
          - entities.Device.fields.sessions_since_filter_change
        distinguishing_aspect: |
          The SOILED -> AVAILABLE transition needs BOTH halves of the cycle dated after
          Device.last_session_end_at: the pre-session filter and disinfection do not count, the fresh
          FILTER_REPLACEMENT alone leaves the device SOILED with sessions_since_filter_change reset to 0,
          and only the following HIGH_LEVEL_DISINFECT flips the status.
