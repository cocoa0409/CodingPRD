  # ===========================================================================
  # Cross-cutting complexity layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: ['complexity_profile.complexity_layers', 'entities.LicenseAgreement']
        distinguishing_aspect: "Each mutating call on the agreement bumps version by exactly 1: create(1) -> submit(2) -> accept(3)."
        test_recipe:
          setup: ["licensee and venue exist"]
          setup_api_calls:
            - { call: "POST /licensing/licensees", payload: { name: "LC", legal_entity_code: "LE-X1" }, as: BrandProgramAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licensing/host-venues", payload: { name: "V", venue_type: "GROCERY", open_time_utc: "06:00", close_time_utc: "22:00", access_restricted: false, max_equipment_footprint_units: 100, security_badge_required: false }, as: BrandProgramAdmin, captures: { ven_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { licensee_id: "${lic_id}", venue_id: "${ven_id}", royalty_tiers: [ { threshold_cents: 0, rate_bps: 300 } ], royalty_basis: "ACCRUAL", term_start_date: "2026-09-01", term_end_date: "2027-08-31" }, as: BrandProgramAdmin, captures: { agr_id: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "POST /licensing/license-agreements/${agr_id}/submit", payload: {}, as: BrandProgramAdmin, captures: { v2: $.data.version } }
            - { call: "POST /licensing/license-agreements/${agr_id}/accept", payload: {}, as: HostVenueManager, as_user_id: "${ven_id}", captures: { v3: $.data.version } }
          assert:
            - "v1 == 1 and v2 == 2 and v3 == 3"
      - name: derived_on_hand_reconciles_after_receipt
        claim_type: derived_field_reconciliation
        grounds: ['entities.StoreAssortmentItem.fields.on_hand', 'state_machines.SupplyOrder.IN_TRANSIT_to_RECEIVED']
