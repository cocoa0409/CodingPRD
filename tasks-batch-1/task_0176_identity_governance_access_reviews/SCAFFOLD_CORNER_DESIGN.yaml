# =============================================================================
# task_0176 — §1.9 Scaffold Corner Design (breadth coverage of §1.1–§1.7)
# Taxonomy sections per references/claim-extraction-guide.md
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_entitlement_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Entitlement.fields.name, entities.Entitlement.fields.status]
        distinguishing_aspect: "POST /entitlements with name+system_code → 201; status defaults ACTIVE, is_privileged false, risk_weight 10."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /entitlements"
              payload: { name: "Reader", system_code: "SYS_R" }
              as: CatalogAdmin
              captures: { e_id: $.data.id, e_status: $.data.status, e_priv: $.data.is_privileged, e_rw: $.data.risk_weight }
          assert:
            - "response code 201"
            - "Entitlement.status == ACTIVE"
            - "Entitlement.is_privileged == false"
            - "Entitlement.risk_weight == 10"

      - name: get_entitlement_not_found
        claim_type: Not Found
        grounds:
          - "entities.Entitlement"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /entitlements/{random-uuid} → 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /entitlements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CatalogAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code 404, error_id == ERR_NOT_FOUND"

      - name: create_entitlement_missing_required_returns_validation
        claim_type: Required Fields
        grounds: [entities.Entitlement.fields.system_code]
        distinguishing_aspect: "POST /entitlements omitting system_code → 400 ERR_VALIDATION."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /entitlements"
              payload: { name: "NoCode" }
              as: CatalogAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code 400, error_id == ERR_VALIDATION"

      - name: identity_id_is_system_minted_uuid_no_prefix
        claim_type: System Fields
        grounds: [entities.Identity.fields.status, entities.Identity.fields.active_grant_count]
        distinguishing_aspect: "POST /identities → server mints id (bare UUID), status ACTIVE, all counters 0; client cannot set them."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /identities"
              payload: { display_name: "Fresh", email: "fresh@x.com" }
              as: AccessManager
              captures: { i_id: $.data.id, agc: $.data.active_grant_count, pec: $.data.privileged_entitlement_count, eff: $.data.effective_risk_score }
          assert:
            - "Identity.active_grant_count == 0"
            - "Identity.privileged_entitlement_count == 0"
            - "Identity.effective_risk_score == 0"
            - "Identity.id is a bare UUID with no type prefix"

      - name: orphan_account_computed_for_nonhuman_with_no_grants
        claim_type: Computed Fields
        grounds: [entities.Identity.fields.is_orphan, entities.Identity.fields.is_human]
        distinguishing_aspect: "A non-human ACTIVE identity with active_grant_count==0 has is_orphan==true; discoverable via GET /identities?is_orphan=true."
        test_recipe:
          setup: ["One non-human identity with zero grants."]
          setup_api_calls:
            - call: "POST /identities"
              payload: { display_name: "svc-batch", email: "svc@x.com", is_human: false }
              as: AccessManager
              captures: { svc: $.data.id }
          trigger:
            - call: "GET /identities/${svc}"
              payload: {}
              as: AccessManager
              captures: { orph: $.data.is_orphan }
          assert:
            - "Identity.${svc}.is_orphan == true"

      - name: list_identities_paginated_envelope
        claim_type: Listing
        grounds: [entities.Identity]
        distinguishing_aspect: "GET /identities returns array envelope with limit/offset/total_count/has_more."
        test_recipe:
          setup: ["Two identities exist."]
          setup_api_calls:
            - call: "POST /identities"
              payload: { display_name: "A", email: "a@x.com" }
              as: AccessManager
            - call: "POST /identities"
              payload: { display_name: "B", email: "b@x.com" }
              as: AccessManager
          trigger:
            - call: "GET /identities?limit=1&offset=0"
              payload: {}
              as: AccessManager
          assert:
            - "response_type == array; data length == 1; total_count == 2; has_more == true"

      - name: audit_event_is_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.AuditEvent]
        distinguishing_aspect: "AuditEvent has common_fields:false — no PUT/PATCH/DELETE endpoint, only GET; carries id+created_at, no version."
        test_recipe:
          setup: ["An identity disable produced one IDENTITY_DISABLED audit event."]
          setup_api_calls:
            - call: "POST /identities"
              payload: { display_name: "Aud", email: "aud@x.com" }
              as: AccessManager
              captures: { ia: $.data.id, ia_v: $.data.version }
            - call: "POST /identities/${ia}/disable"
              payload: { expected_identity_version: "${ia_v}" }
              as: AccessManager
          trigger:
            - call: "GET /identities/${ia}/audit-events?event_type=IDENTITY_DISABLED"
              payload: {}
              as: AccessManager
              captures: { ev_id: $.data.0.id }
          assert:
            - "at least one AuditEvent with event_type == IDENTITY_DISABLED; record has no version field"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: submit_from_approved_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.AccessRequest.DRAFT_to_SUBMITTED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Submitting an already-APPROVED AccessRequest → 409 ERR_INVALID_STATE; no side effects."
        test_recipe:
          setup: ["An AccessRequest is APPROVED."]
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "EntS", system_code: "ES", risk_weight: 10 }
              as: CatalogAdmin
              captures: { es: $.data.id }
            - call: "POST /roles"
              payload: { name: "RoleS", entitlement_ids: ["${es}"] }
              as: CatalogAdmin
              captures: { rs: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Si", email: "si@x.com" }
              as: AccessManager
              captures: { si: $.data.id }
            - call: "POST /access-requests"
              payload: { identity_id: "${si}", role_id: "${rs}", justification: "j" }
              as: AccessManager
              as_user_id: "mgr-a"
              captures: { ars: $.data.id }
            - call: "POST /access-requests/${ars}/submit"
              payload: {}
              as: AccessManager
              as_user_id: "mgr-a"
            - call: "POST /access-requests/${ars}/approve"
              payload: {}
              as: AccessApprover
              as_user_id: "apr-a"
          trigger:
            - call: "POST /access-requests/${ars}/submit"
              payload: {}
              as: AccessManager
              as_user_id: "mgr-a"
              captures: { err: $.data.error_id }
          assert:
            - "response code 409, error_id == ERR_INVALID_STATE"

      - name: new_access_request_starts_in_draft
        claim_type: Initial State
        grounds: [state_machines.AccessRequest, entities.AccessRequest.fields.status]
        distinguishing_aspect: "Newly created AccessRequest has status == DRAFT (initial_state)."
        test_recipe:
          setup: ["A role and identity exist."]
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "EntI", system_code: "EI", risk_weight: 10 }
              as: CatalogAdmin
              captures: { ei: $.data.id }
            - call: "POST /roles"
              payload: { name: "RoleI", entitlement_ids: ["${ei}"] }
              as: CatalogAdmin
              captures: { ri: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Ii", email: "ii@x.com" }
              as: AccessManager
              captures: { ii: $.data.id }
          trigger:
            - call: "POST /access-requests"
              payload: { identity_id: "${ii}", role_id: "${ri}", justification: "j" }
              as: AccessManager
              as_user_id: "mgr-b"
              captures: { st: $.data.status }
          assert:
            - "AccessRequest.status == DRAFT"

      - name: deprovisioned_identity_is_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Identity"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A DEPROVISIONED identity cannot be enabled/disabled — any transition → 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Identity disabled then deprovisioned (0 grants)."]
          setup_api_calls:
            - call: "POST /identities"
              payload: { display_name: "Term", email: "term@x.com" }
              as: AccessManager
              captures: { it: $.data.id, it_v0: $.data.version }
            - call: "POST /identities/${it}/disable"
              payload: { expected_identity_version: "${it_v0}" }
              as: AccessManager
              captures: { it_v1: $.data.version }
            - call: "POST /identities/${it}/deprovision"
              payload: {}
              as: AccessManager
          trigger:
            - call: "POST /identities/${it}/enable"
              payload: { expected_identity_version: "${it_v1}" }
              as: AccessManager
              captures: { err: $.data.error_id }
          assert:
            - "response code 409, error_id == ERR_INVALID_STATE"

      - name: campaign_launch_enrolls_active_grants_bubble
        claim_type: Side Effect Execution
        grounds: [state_machines.CertificationCampaign.DRAFT_to_ACTIVE, state_machines.Grant.NOT_DUE_to_UNDER_REVIEW]
        distinguishing_aspect: "Launching a campaign sets each in-scope ACTIVE grant review_status NOT_DUE->UNDER_REVIEW and creates a PENDING item; item_count matches grant count."
        test_recipe:
          setup: ["One ACTIVE grant in scope of a DRAFT campaign."]
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "EntE", system_code: "EE", risk_weight: 10 }
              as: CatalogAdmin
              captures: { ee: $.data.id }
            - call: "POST /roles"
              payload: { name: "RoleE", entitlement_ids: ["${ee}"] }
              as: CatalogAdmin
              captures: { re: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Ei", email: "ei@x.com" }
              as: AccessManager
              captures: { iee: $.data.id, iee_v: $.data.version }
            - call: "POST /identities/${iee}/grants"
              payload: { entitlement_id: "${ee}", expected_identity_version: "${iee_v}" }
              as: AccessManager
              captures: { gee: $.data.id }
            - call: "POST /certification-campaigns"
              payload: { name: "CampE", scope_role_id: "${re}", review_window_start: "2026-06-01T00:00:00Z", review_window_end: "2026-06-30T00:00:00Z" }
              as: CampaignAdmin
              captures: { ce: $.data.id }
          trigger:
            - call: "POST /certification-campaigns/${ce}/launch"
              payload: {}
              as: CampaignAdmin
              captures: { ic: $.data.item_count }
            - call: "GET /grants/${gee}"
              payload: {}
              as: CampaignAdmin
              captures: { rv: $.data.review_status }
          assert:
            - "CertificationCampaign.${ce}.item_count == 1"
            - "Grant.${gee}.review_status == UNDER_REVIEW"

      - name: item_revoke_cascades_grant_to_revoked
        claim_type: Side Effect Execution
        grounds: [state_machines.Grant.UNDER_REVIEW_to_FLAGGED, state_machines.Grant.ACTIVE_to_REVOKED, entities.Identity.fields.active_grant_count]
        distinguishing_aspect: "Revoking a certification item flips its grant lifecycle ACTIVE->REVOKED and review_status->FLAGGED, decrementing the owner's active_grant_count to 0."
        test_recipe:
          setup: ["One ACTIVE grant enrolled (UNDER_REVIEW) in an ACTIVE campaign."]
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "EntR", system_code: "ER", risk_weight: 10 }
              as: CatalogAdmin
              captures: { er2: $.data.id }
            - call: "POST /roles"
              payload: { name: "RoleR2", entitlement_ids: ["${er2}"] }
              as: CatalogAdmin
              captures: { rr2: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Ri", email: "ri@x.com" }
              as: AccessManager
              captures: { iri: $.data.id, iri_v: $.data.version }
            - call: "POST /identities/${iri}/grants"
              payload: { entitlement_id: "${er2}", expected_identity_version: "${iri_v}" }
              as: AccessManager
              captures: { gri: $.data.id }
            - call: "POST /certification-campaigns"
              payload: { name: "CampR", scope_role_id: "${rr2}", review_window_start: "2026-06-01T00:00:00Z", review_window_end: "2026-06-30T00:00:00Z" }
              as: CampaignAdmin
              captures: { cr: $.data.id }
            - call: "POST /certification-campaigns/${cr}/launch"
              payload: {}
              as: CampaignAdmin
            - call: "GET /certification-items?grant_id=${gri}"
              payload: {}
              as: Certifier
              captures: { iri_item: $.data.0.id }
          trigger:
            - call: "POST /certification-items/${iri_item}/revoke"
              payload: {}
              as: Certifier
            - call: "GET /grants/${gri}"
              payload: {}
              as: Certifier
              captures: { lc: $.data.lifecycle_status, rv: $.data.review_status }
          assert:
            - "Grant.${gri}.lifecycle_status == REVOKED"
            - "Grant.${gri}.review_status == FLAGGED"
            - "Identity.${iri}.active_grant_count == 0"

  # ===========================================================================
  - section: calculations
    instances:
      - name: projected_equals_effective_when_no_pending_requests
        claim_type: Variant Selection
        grounds: [calculations.projected_risk_score, calculations.effective_risk_score]
        distinguishing_aspect: "With no SUBMITTED requests, projected_risk_score == effective_risk_score for an identity holding one non-priv grant of risk 30 (both 30)."
        test_recipe:
          setup: ["Identity holds one ACTIVE non-priv grant (risk 30); no pending requests."]
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "EntN", system_code: "EN", is_privileged: false, risk_weight: 30 }
              as: CatalogAdmin
              captures: { en: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Ni", email: "ni@x.com" }
              as: AccessManager
              captures: { ini: $.data.id, ini_v: $.data.version }
            - call: "POST /identities/${ini}/grants"
              payload: { entitlement_id: "${en}", expected_identity_version: "${ini_v}" }
              as: AccessManager
          trigger:
            - call: "GET /identities/${ini}"
              payload: {}
              as: AccessManager
              captures: { eff: $.data.effective_risk_score, proj: $.data.projected_risk_score }
          assert:
            - "Identity.${ini}.effective_risk_score == 30"
            - "Identity.${ini}.projected_risk_score == 30"

      - name: privileged_surcharge_cap_at_three_steps
        claim_type: Constants Applied
        grounds: [calculations.effective_risk_score]
        distinguishing_aspect: "PRIVILEGED_CAP_STEPS=3: 3 privileged grants give surcharge 75; a 4th does not raise the surcharge (still 75)."
        test_recipe:
          setup: ["Identity holds exactly 3 ACTIVE privileged grants of risk_weight 10 each."]
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "Q1", system_code: "Q1", is_privileged: true, risk_weight: 10 }
              as: CatalogAdmin
              captures: { q1: $.data.id }
            - call: "POST /entitlements"
              payload: { name: "Q2", system_code: "Q2", is_privileged: true, risk_weight: 10 }
              as: CatalogAdmin
              captures: { q2: $.data.id }
            - call: "POST /entitlements"
              payload: { name: "Q3", system_code: "Q3", is_privileged: true, risk_weight: 10 }
              as: CatalogAdmin
              captures: { q3: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Qi", email: "qi@x.com" }
              as: AccessManager
              captures: { iq: $.data.id, iq_v0: $.data.version }
            - call: "POST /identities/${iq}/grants"
              payload: { entitlement_id: "${q1}", expected_identity_version: "${iq_v0}" }
              as: AccessManager
            - call: "GET /identities/${iq}"
              payload: {}
              as: AccessManager
              captures: { iq_v1: $.data.version }
            - call: "POST /identities/${iq}/grants"
              payload: { entitlement_id: "${q2}", expected_identity_version: "${iq_v1}" }
              as: AccessManager
            - call: "GET /identities/${iq}"
              payload: {}
              as: AccessManager
              captures: { iq_v2: $.data.version }
            - call: "POST /identities/${iq}/grants"
              payload: { entitlement_id: "${q3}", expected_identity_version: "${iq_v2}" }
              as: AccessManager
          trigger:
            - call: "GET /identities/${iq}"
              payload: {}
              as: AccessManager
              captures: { eff: $.data.effective_risk_score }
          assert:
            - "Identity.${iq}.effective_risk_score == 105"   # base 30 + surcharge 25*min(3,3)=75

  # ===========================================================================
  - section: validations
    instances:
      - name: sod_policy_same_entitlement_pair_rejected
        claim_type: Violation → Error
        grounds:
          - "errors[ERR_SOD_PAIR_INVALID]"
          - "entities.SodPolicy.fields.entitlement_a_id"
          - "entities.SodPolicy.fields.entitlement_b_id"
        distinguishing_aspect: "POST /sod-policies with entitlement_a_id == entitlement_b_id → 422 ERR_SOD_PAIR_INVALID."
        test_recipe:
          setup: ["One entitlement exists."]
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "Solo", system_code: "SO", risk_weight: 10 }
              as: CatalogAdmin
              captures: { solo: $.data.id }
          trigger:
            - call: "POST /sod-policies"
              payload: { name: "BadPair", entitlement_a_id: "${solo}", entitlement_b_id: "${solo}" }
              as: CatalogAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code 422, error_id == ERR_SOD_PAIR_INVALID"

      - name: submit_with_archived_entitlement_rejected
        claim_type: Cross-entity validation
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_ENTITLEMENT_ARCHIVED]"
          - "entities.Entitlement.fields.status"
        distinguishing_aspect: "Submitting a request whose role bundles an ARCHIVED entitlement → 409 ERR_ENTITLEMENT_ARCHIVED (validity depends on Entitlement.status)."
        test_recipe:
          setup: ["Role bundles an entitlement that is archived after role creation; identity active."]
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "WillArch", system_code: "WA", risk_weight: 10 }
              as: CatalogAdmin
              captures: { wa: $.data.id }
            - call: "POST /roles"
              payload: { name: "RoleWA", entitlement_ids: ["${wa}"] }
              as: CatalogAdmin
              captures: { rwa: $.data.id }
            - call: "POST /entitlements/${wa}/archive"
              payload: {}
              as: CatalogAdmin
            - call: "POST /identities"
              payload: { display_name: "Wa", email: "wa@x.com" }
              as: AccessManager
              captures: { iwa: $.data.id }
            - call: "POST /access-requests"
              payload: { identity_id: "${iwa}", role_id: "${rwa}", justification: "j" }
              as: AccessManager
              as_user_id: "mgr-c"
              captures: { arwa: $.data.id }
          trigger:
            - call: "POST /access-requests/${arwa}/submit"
              payload: {}
              as: AccessManager
              as_user_id: "mgr-c"
              captures: { err: $.data.error_id }
          assert:
            - "response code 409, error_id == ERR_ENTITLEMENT_ARCHIVED"

      - name: hard_sod_conflict_blocks_approval
        claim_type: Violation → Error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_SOD_CONFLICT]"
          - "calculations.sod_conflict_evaluation"
        distinguishing_aspect: "Approving a request that produces a HARD ACTIVE SoD conflict → 409 ERR_SOD_CONFLICT (override cannot push HARD)."
        test_recipe:
          setup: ["Identity holds entitlement A; request adds role bundling B; HARD policy A/B exists; request submitted."]
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "HA", system_code: "HA", risk_weight: 10 }
              as: CatalogAdmin
              captures: { ha: $.data.id }
            - call: "POST /entitlements"
              payload: { name: "HB", system_code: "HB", risk_weight: 10 }
              as: CatalogAdmin
              captures: { hb: $.data.id }
            - call: "POST /sod-policies"
              payload: { name: "HARDab", entitlement_a_id: "${ha}", entitlement_b_id: "${hb}", severity: "HARD" }
              as: CatalogAdmin
            - call: "POST /roles"
              payload: { name: "RoleHB", entitlement_ids: ["${hb}"] }
              as: CatalogAdmin
              captures: { rhb: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Hi", email: "hi@x.com" }
              as: AccessManager
              captures: { ihi: $.data.id, ihi_v: $.data.version }
            - call: "POST /identities/${ihi}/grants"
              payload: { entitlement_id: "${ha}", expected_identity_version: "${ihi_v}" }
              as: AccessManager
            - call: "POST /access-requests"
              payload: { identity_id: "${ihi}", role_id: "${rhb}", justification: "j" }
              as: AccessManager
              as_user_id: "mgr-d"
              captures: { arhi: $.data.id }
            - call: "POST /access-requests/${arhi}/submit"
              payload: {}
              as: AccessManager
              as_user_id: "mgr-d"
          trigger:
            - call: "POST /access-requests/${arhi}/approve"
              payload: { second_approver_confirmed: true }
              as: AccessApprover
              as_user_id: "apr-d"
              captures: { err: $.data.error_id }
          assert:
            - "response code 409, error_id == ERR_SOD_CONFLICT"

      - name: soft_sod_without_override_rejected
        claim_type: Conditional validation
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_SOD_OVERRIDE_REQUIRED]"
          - "entities.SodPolicy.fields.severity"
        distinguishing_aspect: "A SOFT SoD conflict with empty sod_override_justification on approve → 422 ERR_SOD_OVERRIDE_REQUIRED; supplying justification would pass."
        test_recipe:
          setup: ["Identity holds A; request adds role bundling B; SOFT policy A/B; request submitted; approve omits override justification."]
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "SA", system_code: "SA", risk_weight: 10 }
              as: CatalogAdmin
              captures: { sa: $.data.id }
            - call: "POST /entitlements"
              payload: { name: "SB", system_code: "SB", risk_weight: 10 }
              as: CatalogAdmin
              captures: { sb: $.data.id }
            - call: "POST /sod-policies"
              payload: { name: "SOFTab", entitlement_a_id: "${sa}", entitlement_b_id: "${sb}", severity: "SOFT" }
              as: CatalogAdmin
            - call: "POST /roles"
              payload: { name: "RoleSB", entitlement_ids: ["${sb}"] }
              as: CatalogAdmin
              captures: { rsb: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Sfi", email: "sfi@x.com" }
              as: AccessManager
              captures: { isf: $.data.id, isf_v: $.data.version }
            - call: "POST /identities/${isf}/grants"
              payload: { entitlement_id: "${sa}", expected_identity_version: "${isf_v}" }
              as: AccessManager
            - call: "POST /access-requests"
              payload: { identity_id: "${isf}", role_id: "${rsb}", justification: "j" }
              as: AccessManager
              as_user_id: "mgr-e"
              captures: { arsf: $.data.id }
            - call: "POST /access-requests/${arsf}/submit"
              payload: {}
              as: AccessManager
              as_user_id: "mgr-e"
          trigger:
            - call: "POST /access-requests/${arsf}/approve"
              payload: {}
              as: AccessApprover
              as_user_id: "apr-e"
              captures: { err: $.data.error_id }
          assert:
            - "response code 422, error_id == ERR_SOD_OVERRIDE_REQUIRED"

      - name: deprovision_with_active_grants_rejected
        claim_type: Violation → Error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_IDENTITY_HAS_ACTIVE_GRANTS]"
        distinguishing_aspect: "Deprovisioning a DISABLED identity is blocked if active_grant_count>0 — but disable cascades revoke-all, so to reach this we re-grant... use a JIT direct grant after disable? Instead: deprovision an ACTIVE-status identity → ERR_INVALID_STATE; deprovision DISABLED with a re-added grant → ERR_IDENTITY_HAS_ACTIVE_GRANTS."
        test_recipe:
          setup: ["Identity is DISABLED, then a direct grant is added back (via re-enable, grant, disable would revoke). Simpler: an ACTIVE identity with a grant attempts deprovision and is first blocked by state."]
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "DepE", system_code: "DE", risk_weight: 10 }
              as: CatalogAdmin
              captures: { de: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Depi", email: "depi@x.com" }
              as: AccessManager
              captures: { idep: $.data.id, idep_v: $.data.version }
            - call: "POST /identities/${idep}/grants"
              payload: { entitlement_id: "${de}", expected_identity_version: "${idep_v}" }
              as: AccessManager
          trigger:
            - call: "POST /identities/${idep}/deprovision"
              payload: {}
              as: AccessManager
              captures: { err: $.data.error_id }
          assert:
            - "response code 409, error_id == ERR_INVALID_STATE (identity must be DISABLED before deprovision; ERR_IDENTITY_HAS_ACTIVE_GRANTS guards the DISABLED-with-grants path)"

  # ===========================================================================
  - section: rbac
    instances:
      - name: certifier_cannot_create_entitlement
        claim_type: exclusive_operation_denied
        grounds:
          - "roles.Certifier"
          - "roles.CatalogAdmin"
          - "errors[ERR_FORBIDDEN_ROLE]"
        distinguishing_aspect: "Certifier calling POST /entitlements → 403 ERR_FORBIDDEN_ROLE (CatalogAdmin exclusive)."
        test_recipe:
          setup: ["No setup."]
          setup_api_calls: []
          trigger:
            - call: "POST /entitlements"
              payload: { name: "Nope", system_code: "NO" }
              as: Certifier
              captures: { err: $.data.error_id }
          assert:
            - "response code 403, error_id == ERR_FORBIDDEN_ROLE"

      - name: access_manager_cannot_approve_request
        claim_type: exclusive_operation_denied
        grounds:
          - "roles.AccessManager"
          - "roles.AccessApprover"
          - "errors[ERR_FORBIDDEN_ROLE]"
        distinguishing_aspect: "AccessManager calling POST /access-requests/{id}/approve → 403 ERR_FORBIDDEN_ROLE (segregation of duties between manager and approver)."
        test_recipe:
          setup: ["A SUBMITTED access request exists."]
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "EntAm", system_code: "EAM", risk_weight: 10 }
              as: CatalogAdmin
              captures: { eam: $.data.id }
            - call: "POST /roles"
              payload: { name: "RoleAm", entitlement_ids: ["${eam}"] }
              as: CatalogAdmin
              captures: { ram: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Ami", email: "ami@x.com" }
              as: AccessManager
              captures: { iam: $.data.id }
            - call: "POST /access-requests"
              payload: { identity_id: "${iam}", role_id: "${ram}", justification: "j" }
              as: AccessManager
              as_user_id: "mgr-f"
              captures: { aram: $.data.id }
            - call: "POST /access-requests/${aram}/submit"
              payload: {}
              as: AccessManager
              as_user_id: "mgr-f"
          trigger:
            - call: "POST /access-requests/${aram}/approve"
              payload: {}
              as: AccessManager
              as_user_id: "mgr-f"
              captures: { err: $.data.error_id }
          assert:
            - "response code 403, error_id == ERR_FORBIDDEN_ROLE"

      - name: unauthenticated_request_rejected
        claim_type: missing_auth
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers → 401 ERR_UNAUTHENTICATED (auth precedes all other checks)."
        test_recipe:
          setup: ["No setup."]
          setup_api_calls: []
          trigger:
            - call: "GET /identities/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response code 401, error_id == ERR_UNAUTHENTICATED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_version_grant_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[direct-grant-stale-identity]"
          - "entities.Identity.fields.version"
        distinguishing_aspect: "Direct grant with correct expected_identity_version succeeds (201) and Identity.version increments by 1."
        test_recipe:
          setup: ["Fresh identity (version 1)."]
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "Occ", system_code: "OC", risk_weight: 10 }
              as: CatalogAdmin
              captures: { occe: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Occi", email: "occ@x.com" }
              as: AccessManager
              captures: { ioc: $.data.id, ioc_v: $.data.version }
          trigger:
            - call: "POST /identities/${ioc}/grants"
              payload: { entitlement_id: "${occe}", expected_identity_version: "${ioc_v}" }
              as: AccessManager
            - call: "GET /identities/${ioc}"
              payload: {}
              as: AccessManager
              captures: { vafter: $.data.version }
          assert:
            - "grant returns 201"
            - "Identity.${ioc}.version increased by 1 from the value captured as ioc_v"

      - name: occ_stale_version_grant_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[direct-grant-stale-identity]"
          - "errors[ERR_STALE_VERSION]"
          - "validations[priority=12]"
        distinguishing_aspect: "After a first direct grant bumps Identity.version, a second grant still carrying the pre-bump version → 412 ERR_STALE_VERSION (CREATE-with-supersede stale check)."
        test_recipe:
          setup: ["Identity received one grant (version advanced); a second grant reuses the stale version."]
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "St1", system_code: "ST1", risk_weight: 10 }
              as: CatalogAdmin
              captures: { st1: $.data.id }
            - call: "POST /entitlements"
              payload: { name: "St2", system_code: "ST2", risk_weight: 10 }
              as: CatalogAdmin
              captures: { st2: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Sti", email: "sti@x.com" }
              as: AccessManager
              captures: { ist: $.data.id, ist_v0: $.data.version }
            - call: "POST /identities/${ist}/grants"
              payload: { entitlement_id: "${st1}", expected_identity_version: "${ist_v0}" }
              as: AccessManager
          trigger:
            - call: "POST /identities/${ist}/grants"
              payload: { entitlement_id: "${st2}", expected_identity_version: "${ist_v0}" }
              as: AccessManager
              captures: { err: $.data.error_id }
          assert:
            - "response code 412, error_id == ERR_STALE_VERSION (reused pre-bump version is stale)"

      - name: jit_adjacent_window_touching_allowed
        claim_type: rate_threshold_triggers
        grounds:
          - "validations[priority=9]"
          - "entities.Grant.fields.effective_until"
        distinguishing_aspect: "A second JIT grant of the same (identity, entitlement) starting exactly at the prior window's effective_until (12:00) is ALLOWED — half-open intervals make touching non-overlapping (201)."
        test_recipe:
          setup: ["Identity holds a JIT grant of P over [10:00,12:00); a second JIT grant of P over [12:00,14:00) is created."]
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "AdjP", system_code: "AP", is_privileged: true, risk_weight: 20 }
              as: CatalogAdmin
              captures: { ap: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Adj", email: "adj@x.com" }
              as: AccessManager
              captures: { iadj: $.data.id, iadj_v0: $.data.version }
            - call: "POST /identities/${iadj}/grants"
              payload: { entitlement_id: "${ap}", expected_identity_version: "${iadj_v0}", is_just_in_time: true, effective_from: "2026-06-01T10:00:00Z", effective_until: "2026-06-01T12:00:00Z" }
              as: AccessManager
            - call: "GET /identities/${iadj}"
              payload: {}
              as: AccessManager
              captures: { iadj_v1: $.data.version }
          trigger:
            - call: "POST /identities/${iadj}/grants"
              payload: { entitlement_id: "${ap}", expected_identity_version: "${iadj_v1}", is_just_in_time: true, effective_from: "2026-06-01T12:00:00Z", effective_until: "2026-06-01T14:00:00Z" }
              as: AccessManager
              captures: { g2: $.data.id }
          assert:
            - "second JIT grant returns 201 (touching at 12:00 is not an overlap)"

      - name: disable_cascade_revokes_all_grants_endtoend
        claim_type: cascading_side_effects
        grounds: [state_machines.Identity.ACTIVE_to_DISABLED, state_machines.Grant.ACTIVE_to_REVOKED]
        distinguishing_aspect: "Disabling an identity with 2 ACTIVE grants leaves both grants lifecycle_status==REVOKED and produces an IDENTITY_DISABLED audit event (cascade end-to-end)."
        test_recipe:
          setup: ["Identity holds 2 ACTIVE grants."]
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "Cd1", system_code: "CD1", risk_weight: 10 }
              as: CatalogAdmin
              captures: { cd1: $.data.id }
            - call: "POST /entitlements"
              payload: { name: "Cd2", system_code: "CD2", risk_weight: 10 }
              as: CatalogAdmin
              captures: { cd2: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Cdi", email: "cdi@x.com" }
              as: AccessManager
              captures: { icd: $.data.id, icd_v0: $.data.version }
            - call: "POST /identities/${icd}/grants"
              payload: { entitlement_id: "${cd1}", expected_identity_version: "${icd_v0}" }
              as: AccessManager
              captures: { gcd1: $.data.id }
            - call: "GET /identities/${icd}"
              payload: {}
              as: AccessManager
              captures: { icd_v1: $.data.version }
            - call: "POST /identities/${icd}/grants"
              payload: { entitlement_id: "${cd2}", expected_identity_version: "${icd_v1}" }
              as: AccessManager
              captures: { gcd2: $.data.id }
            - call: "GET /identities/${icd}"
              payload: {}
              as: AccessManager
              captures: { icd_v2: $.data.version }
          trigger:
            - call: "POST /identities/${icd}/disable"
              payload: { expected_identity_version: "${icd_v2}" }
              as: AccessManager
            - call: "GET /grants/${gcd1}"
              payload: {}
              as: AccessManager
              captures: { lc1: $.data.lifecycle_status }
            - call: "GET /grants/${gcd2}"
              payload: {}
              as: AccessManager
              captures: { lc2: $.data.lifecycle_status }
          assert:
            - "Grant.${gcd1}.lifecycle_status == REVOKED"
            - "Grant.${gcd2}.lifecycle_status == REVOKED"
            - "GET /identities/${icd}/audit-events?event_type=IDENTITY_DISABLED returns >= 1 record"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: counters_visible_in_same_response_immediate
        claim_type: immediate
        grounds: [entities.Identity.fields.active_grant_count, entities.Identity.fields.effective_risk_score]
        distinguishing_aspect: "The grant response and the identity read are immediately consistent: right after a direct grant, GET /identities shows active_grant_count==1, effective_risk_score==10."
        test_recipe:
          setup: ["Fresh identity; one direct non-priv grant of risk 10."]
          setup_api_calls:
            - call: "POST /entitlements"
              payload: { name: "Imm", system_code: "IM", risk_weight: 10 }
              as: CatalogAdmin
              captures: { imm: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "Immi", email: "imm@x.com" }
              as: AccessManager
              captures: { iim: $.data.id, iim_v: $.data.version }
            - call: "POST /identities/${iim}/grants"
              payload: { entitlement_id: "${imm}", expected_identity_version: "${iim_v}" }
              as: AccessManager
          trigger:
            - call: "GET /identities/${iim}"
              payload: {}
              as: AccessManager
              captures: { agc: $.data.active_grant_count, eff: $.data.effective_risk_score }
          assert:
            - "Identity.${iim}.active_grant_count == 1"
            - "Identity.${iim}.effective_risk_score == 10"

  # ===========================================================================
  # excluded_because stubs — corners already exercised by §1.8
  # ===========================================================================
  - section: state_machines
    instances:
      - name: stub_request_returned_resubmit_cycle
        claim_type: Valid Transition
        grounds: [state_machines.AccessRequest.RETURNED_to_SUBMITTED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / access_request_returned_resubmit_cycle
          rationale: "The SUBMITTED->RETURNED->SUBMITTED cycle is asserted directly by the named §1.8 instance."

      - name: stub_grant_parallel_dimensions
        claim_type: parallel_dimension_independence
        grounds: [state_machines.Grant.UNDER_REVIEW_to_CERTIFIED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / grant_parallel_lifecycle_and_review_dimensions
          rationale: "Independence of lifecycle_status and review_status is the core assertion of the named §1.8 instance."

  - section: calculations
    instances:
      - name: stub_completion_pct_divide_then_round
        claim_type: Precision
        grounds: [calculations.campaign_completion_pct]
        excluded_because:
          difficulty_instance: combinatorial_formula / campaign_completion_divide_then_round
          rationale: "The 71.43 divide-then-round value is asserted by the named §1.8 instance."

      - name: stub_high_risk_threshold_boundary
        claim_type: Correct Result
        grounds: [calculations.effective_risk_score]
        excluded_because:
          difficulty_instance: boundary_precision_check / high_risk_threshold_ge_boundary
          rationale: "The exact >=100 flag boundary is asserted by the named §1.8 instance."

  - section: validations
    instances:
      - name: stub_sod_self_action_block
        claim_type: Violation → Error
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_SOD_SELF_ACTION]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / dual_approval_beats_sod_override
          rationale: "SoD self-action and dual-approval priority are exercised through the §1.8 priority-conflict instances and the rbac access_manager_cannot_approve_request corner."

  - section: cross_cutting_complexity_layers
    instances:
      - name: stub_jit_window_overlap_block
        claim_type: rate_threshold_triggers
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_JIT_WINDOW_OVERLAP]"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / jit_grant_window_half_open_overlap
          rationale: "The half-open overlap rejection is asserted by the named §1.8 instance; the touching-allowed positive path is covered by the jit_adjacent_window_touching_allowed corner."
