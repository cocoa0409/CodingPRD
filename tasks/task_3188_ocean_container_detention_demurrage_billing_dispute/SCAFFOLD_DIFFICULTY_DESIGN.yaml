            - "dem_at_gate == 0 (gate-out 09-10 within 4 free days 09-09,09-10,09-11,09-12 — wait, free days are first 4 working days strictly after available 09-08 = 09-09,09-10,09-11,09-12; gate-out ON 09-10 is inside free window so 0 billable)"
            - "Hop 1: cntr_h_st == EMPTY_RETURNED and det_final == 191000 (15 billable days: 6@7000 + 7@15000 + 2@22000 = 42000 + 105000 + 44000)"
            - "Hop 2: inv_h_gross == 191000 (demurrage_total 0 + detention_total 191000)"
            - "Hop 3: acct_h_ob == 191000 (invoice balance debited to the account)"
  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: gate_out_held_container_vs_closed_account_state_vs_safety
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CONTAINER_HELD]
        distinguishing_aspect: |
          Category pair state (p5) vs business_safety (p6): a gate-out on a
          container that is BOTH in DISCHARGED (no mark-available yet) AND has
          an active CUSTOMS_HOLD must return the state error ERR_INVALID_STATE
          (p5 wins over p6); only when the state precondition is satisfied
          does the safety error surface.
        test_recipe:
          setup:
            - "ACCT-I ACTIVE, CTR-I ACTIVE, Terminal OAK, CNTR-I DISCHARGED (mark-available NOT yet called) with a CUSTOMS_HOLD placed... note: holds endpoint requires no specific container state, so hold can be placed while DISCHARGED"
          setup_api_calls:
            - call: "POST /ocean-billing/customer-accounts"
              payload: { account_code: "ACCT-I", legal_name: "Indigo Wholesale" }
              as: ContractManager
              captures: { acct_i: $.data.id }
            - call: "POST /ocean-billing/customer-accounts/${acct_i}/service-contracts"
              payload: { contract_ref: "CTR-I", demurrage_free_days: 2, detention_free_days: 5, saturday_counts_as_free_day: false, demurrage_rate_schedule: "STANDARD", detention_rate_schedule: "STANDARD", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: ContractManager
              captures: { ctr_i: $.data.id }
            - call: "POST /ocean-billing/service-contracts/${ctr_i}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /ocean-billing/terminals"
              payload: { terminal_code: "OAK", timezone: "Pacific/Honolulu", daily_appointment_capacity: 5, gate_closed_weekends: true }
              as: TerminalOperator
              captures: { term_oak: $.data.id }
            - call: "POST /ocean-billing/return-locations"
              payload: { location_code: "LOC-1", terminal_id: "${term_oak}", accepts_equipment_types: ["DRY40"], daily_empty_capacity: 10 }
              as: EquipmentController
            - call: "POST /ocean-billing/containers"
              payload: { container_number: "MATU0000102", equipment_type: "DRY40", customer_account_id: "${acct_i}", service_contract_id: "${ctr_i}", terminal_id: "${term_oak}", discharge_ts: "2026-09-08T12:00:00Z", available_ts: "2026-09-09T12:00:00Z" }
              as: TerminalOperator
              captures: { cntr_i: $.data.id }
            - call: "POST /ocean-billing/containers/${cntr_i}/holds"
              payload: { hold_code: "CUSTOMS_HOLD", action: "PLACE" }
              as: TerminalOperator
          trigger:
            - call: "POST /ocean-billing/containers/${cntr_i}/gate-out"
              payload: { slot_override: true, slot_override_reason: "waived" }
              as: TerminalOperator
              captures: { err_first: $.data.error_id }
            - call: "POST /ocean-billing/containers/${cntr_i}/mark-available"
              payload: {}
              as: TerminalOperator
            - call: "POST /ocean-billing/containers/${cntr_i}/gate-out"
              payload: { slot_override: true, slot_override_reason: "waived" }
              as: TerminalOperator
              captures: { err_second: $.data.error_id }
          assert:
            - "err_first == ERR_INVALID_STATE (p5 state beats p6 safety: container still DISCHARGED)"
            - "err_second == ERR_CONTAINER_HELD (state now AVAILABLE; safety check surfaces)"
            - "Container.${cntr_i}.status == AVAILABLE (no transition occurred on either attempt)"

      - name: evidence_outside_window_vs_dispute_state_temporal_vs_state
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_NOT_A_WORKING_DAY]
        distinguishing_aspect: |
          Category pair state (p5) vs business_temporal (p7): attaching
          evidence whose date is outside the dispute window on a WITHDRAWN
          dispute returns ERR_INVALID_STATE (no transition exists from a
          terminal state), while the SAME out-of-window evidence on a live
          SUBMITTED dispute returns ERR_NOT_A_WORKING_DAY — different pairs
          than the sibling instance (state vs temporal, not state vs safety).
        test_recipe:
          setup:
            - "INV-J issued (45000) for ACCT-J; dispute DSP-J filed with evidence window 2026-09-02..2026-09-04 and then WITHDRAWN by the customer"
          setup_api_calls:
