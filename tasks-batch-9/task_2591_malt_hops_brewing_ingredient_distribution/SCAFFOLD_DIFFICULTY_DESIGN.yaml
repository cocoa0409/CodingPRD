            - call: "POST /sales-orders/${oc_id}/ship"
              payload: {}
              as: WarehouseOperator
              captures: { ship_error: $.data.error_id }
          assert:
            - "BEFORE the trigger: SalesOrder.${oc_id}.total_cents == 119380 and SalesOrder.${oc_id}.fulfillment_status == PICKED"
            - "BEFORE the trigger: OrderLine.${lc1_id}.extended_cents == 24000 and OrderLine.${lc2_id}.extended_cents == 44880"
            - "BEFORE the trigger: SalesOrder.${oc_id}.chargeable_lbs == 880 and SalesOrder.${oc_id}.freight_cents == 43000 and SalesOrder.${oc_id}.small_order_surcharge_cents == 7500 and SalesOrder.${oc_id}.pallet_break_fee_cents == 0"
            - "BEFORE the trigger: ColdChainShipment.${sc_id}.status == IN_TRANSIT and ColdStorageZone.${zone1_id}.occupied_pallets == 0"
            - "reading 1: interval_minutes == 0, in_violation == false, ${r1_cum} == 0"
