  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_draft_bundle_bid
        grounds:
          - validations[priority=7]
          - validations[priority=19]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Pair {state, business_fiscal}: a 1-cent bid on a DRAFT bundle violates
          both the bundle-state precondition (must be PUBLISHED) and the fiscal
          minimum; priority 7 state wins over priority 19 fiscal, so the error is
          ERR_INVALID_STATE, not ERR_BID_BELOW_MINIMUM.
        test_recipe:
          setup:
            - "Event BIDDING_OPEN; bundleA PUBLISHED (enabled opening); bundleB DRAFT containing one VALUED item (FMV 40000, min would be 12000); bidder br registered"
