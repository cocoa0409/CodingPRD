  # ===================================================================
  # RULE 6 — boundary_precision_check
  # ===================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: notice_compliance_inclusive_at_the_deadline_instant_and_false_one_second_later
        grounds:
          - calculations.agenda_notice_compliance
          - entities.AgendaPacket.fields.notice_compliant
          - entities.AgendaPacket.fields.posted_at
          - state_machines.AgendaPacket.DRAFT_to_POSTED
        distinguishing_aspect: |
          The comparison posted_at <= notice_deadline_at is inclusive at
          second granularity: posting at exactly 2026-09-12T18:00:00Z yields
          notice_compliant true, and posting one second later at
          2026-09-12T18:00:01Z yields false. Both posts return 201 — the
          boundary changes a stored boolean, not the HTTP outcome.
        test_recipe:
          setup:
            - "Two venues so both meetings can start at 2026-09-15T18:00:00Z (deadline 2026-09-12T18:00:00Z for a COUNCIL / REGULAR body)."
            - "Each meeting has a one-item DRAFT packet ready to post."
          setup_api_calls:
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue_on: $.data.id }
            - call: "POST /clerk/venues"
              payload: { name: "Annex Hall", address: "3 Civic Plaza", capacity: 80, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue_late: $.data.id }
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue_on}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { m_on: $.data.id, m_on_v: $.data.version }
            - call: "POST /clerk/meetings"
