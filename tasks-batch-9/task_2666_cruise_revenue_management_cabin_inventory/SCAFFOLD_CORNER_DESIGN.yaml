            - call: "POST /group-blocks/${blk_beta}/extend-review"
              payload: { new_review_date: "2026-08-30T00:00:00Z" }
              as: GroupSalesAgent
              as_user_id: "gsa-001"
              captures: { bv2: $.data.version }
            - call: "POST /group-blocks/${blk_beta}/extend-review"
              payload: { new_review_date: "2026-09-10T00:00:00Z" }
              as: GroupSalesAgent
              as_user_id: "gsa-001"
              captures: { e3: $.data.error_id }
            - call: "POST /bookings"
