  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pledge_by_over_committed_member_reports_standing_before_budget_ceiling
        grounds:
          - validations.priority_9_ERR_MEMBER_OVER_COMMITTED
          - validations.priority_32_ERR_BUDGET_CEILING_EXCEEDED
          - errors.ERR_MEMBER_OVER_COMMITTED
          - errors.ERR_BUDGET_CEILING_EXCEEDED
          - calculations.member_tier_price_cents
          - entities.Member.fields.standing
        distinguishing_aspect: |
          Both the priority-9 state rule (Member.standing must be IN_GOOD_STANDING) and the priority-32
          fiscal rule (annual_committed_cents + the new projection must fit under budget_ceiling_cents)
          are violated by the same pledge: Xavier's ledger already holds 4500000 against a 4100000
          ceiling, and the new projection on the second product is another 4500000. The state category
          outranks the fiscal category, so the response must be ERR_MEMBER_OVER_COMMITTED (409) and
          never ERR_BUDGET_CEILING_EXCEEDED (409).
        test_recipe:
          setup:
            - "Vendor Atlas Scholarly with two products; Xavier College has budget_ceiling_cents 4100000, Yankee and Zulu 9000000."
            - "Xavier's trial on the first product is ENDORSED and a DRAFT trial exists on the second product."
            - "Yankee, Zulu and Xavier pledged in that order (Xavier's projection was 4050000 at a participant count of 3, which fitted its ceiling), then Yankee and Zulu withdrew."
            - "Signing settles Xavier's only remaining pledge at the participant-count-1 band price 4500000, which pushes annual_committed_cents to 4500000 and flips standing to OVER_COMMITTED."
