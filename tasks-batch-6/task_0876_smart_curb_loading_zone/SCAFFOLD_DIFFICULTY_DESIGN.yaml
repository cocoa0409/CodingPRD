  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: reservation_halfopen_capacity_overlap
        grounds:
          - state_machines.Reservation.PENDING_to_CONFIRMED
          - entities.CurbZone.fields.capacity_slots
          - errors[ERR_ZONE_CAPACITY_CONFLICT]
        distinguishing_aspect: "CurbZone reservation intervals are half-open [start,end) with aggregate capacity: an adjacent reservation (start == prior end) does NOT overlap and is accepted, while a genuinely overlapping one on a cap-1 zone is rejected."
        test_recipe:
          setup:
            - "Zone Z3 cap 1; ACTIVE permit; RA [08:00Z,08:45Z) CONFIRMED; RC [08:45Z,09:15Z) CONFIRMED (adjacent, accepted); RB [08:30Z,09:00Z) PENDING (overlaps RA and RC)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /curb/pricing-policies", payload: { name: "P1", base_rate_cents_per_15min: 200, peak_multiplier_bps: 15000, peak_start_hour: 7, peak_end_hour: 10, surge_tier1_ratio_bps: 5000, surge_tier1_mult_bps: 12500, surge_tier2_ratio_bps: 8000, surge_tier2_mult_bps: 15000 }, as: CurbPlanner, captures: { pol_id: $.data.id } }
            - { call: "POST /curb/zones", payload: { name: "Z3", block_face: "ELM-300", length_meters: 6, designation: "LOADING", capacity_slots: 1, pricing_policy_id: "${pol_id}" }, as: CurbPlanner, captures: { z3: $.data.id } }
            - { call: "POST /curb/permittees", payload: { legal_name: "Acme", contact_email: "a@x.com", permittee_type: "CARRIER" }, as: PlatformAdmin, captures: { pm_id: $.data.id } }
            - { call: "POST /curb/permits", payload: { permittee_id: "${pm_id}", requested_designation: "LOADING", purpose: "deliveries", zone_ids: ["${z3}"] }, as: Permittee, as_user_id: "${pm_id}", captures: { permit_id: $.data.id } }
            - { call: "POST /curb/permits/${permit_id}/submit", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
            - { call: "POST /curb/permits/${permit_id}/review", payload: {}, as: CurbPlanner, as_user_id: "planner1" }
            - { call: "POST /curb/permits/${permit_id}/approve", payload: {}, as: PermitApprover, as_user_id: "approver1" }
            - { call: "POST /curb/reservations", payload: { permit_id: "${permit_id}", zone_id: "${z3}", start_utc: "2026-06-01T08:00:00Z", end_utc: "2026-06-01T08:45:00Z" }, as: Permittee, as_user_id: "${pm_id}", captures: { ra: $.data.id } }
            - { call: "POST /curb/reservations/${ra}/confirm", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
            - { call: "POST /curb/reservations", payload: { permit_id: "${permit_id}", zone_id: "${z3}", start_utc: "2026-06-01T08:45:00Z", end_utc: "2026-06-01T09:15:00Z" }, as: Permittee, as_user_id: "${pm_id}", captures: { rc: $.data.id } }
            - { call: "POST /curb/reservations/${rc}/confirm", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
            - { call: "POST /curb/reservations", payload: { permit_id: "${permit_id}", zone_id: "${z3}", start_utc: "2026-06-01T08:30:00Z", end_utc: "2026-06-01T09:00:00Z" }, as: Permittee, as_user_id: "${pm_id}", captures: { rb: $.data.id } }
          trigger:
            - { call: "POST /curb/reservations/${rb}/confirm", payload: {}, as: Permittee, as_user_id: "${pm_id}", captures: { err: $.data.error_id } }
          assert:
            - "Adjacent RC [08:45,09:15) confirmed successfully (booking_status CONFIRMED) - half-open, no overlap with RA"
            - "confirm RB returns HTTP 409 ERR_ZONE_CAPACITY_CONFLICT (overlaps a CONFIRMED reservation on a cap-1 zone)"

      - name: schedule_exclusive_buffer_overlap
        grounds:
          - calculations.schedule_window_overlap
          - entities.ScheduleWindow.fields.exclusive
          - errors[ERR_SCHEDULE_WINDOW_CONFLICT]
        distinguishing_aspect: "ScheduleWindow intervals use closed pairwise-exclusive semantics with a 15-min turnover buffer (no adjacency), unlike the half-open aggregate reservation rule: a non-exclusive window shares freely, but a second EXCLUSIVE window within the buffer is rejected."
        test_recipe:
          setup:
            - "Permit owns zone Z1; NON-exclusive window N day0 [540,600) coexists with another; exclusive window A day0 [540,600); a second exclusive window [590,640) collides within buffer"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /curb/pricing-policies", payload: { name: "P1", base_rate_cents_per_15min: 200, peak_multiplier_bps: 15000, peak_start_hour: 7, peak_end_hour: 10, surge_tier1_ratio_bps: 5000, surge_tier1_mult_bps: 12500, surge_tier2_ratio_bps: 8000, surge_tier2_mult_bps: 15000 }, as: CurbPlanner, captures: { pol_id: $.data.id } }
            - { call: "POST /curb/zones", payload: { name: "Z1", block_face: "MAIN-100", length_meters: 12, designation: "VALET", capacity_slots: 5, pricing_policy_id: "${pol_id}" }, as: CurbPlanner, captures: { z1: $.data.id } }
            - { call: "POST /curb/permittees", payload: { legal_name: "Valet Co", contact_email: "v@x.com", permittee_type: "VALET_OPERATOR" }, as: PlatformAdmin, captures: { pm_id: $.data.id } }
            - { call: "POST /curb/permits", payload: { permittee_id: "${pm_id}", requested_designation: "VALET", purpose: "valet", zone_ids: ["${z1}"] }, as: Permittee, as_user_id: "${pm_id}", captures: { permit_id: $.data.id } }
            - { call: "POST /curb/schedule-windows", payload: { permit_id: "${permit_id}", zone_id: "${z1}", day_of_week: 0, start_minute: 540, end_minute: 600, exclusive: false }, as: Permittee, as_user_id: "${pm_id}", captures: { win_n1: $.data.id } }
            - { call: "POST /curb/schedule-windows", payload: { permit_id: "${permit_id}", zone_id: "${z1}", day_of_week: 0, start_minute: 540, end_minute: 600, exclusive: false }, as: Permittee, as_user_id: "${pm_id}", captures: { win_n2: $.data.id } }
            - { call: "POST /curb/schedule-windows", payload: { permit_id: "${permit_id}", zone_id: "${z1}", day_of_week: 0, start_minute: 540, end_minute: 600, exclusive: true }, as: Permittee, as_user_id: "${pm_id}", captures: { win_a: $.data.id } }
          trigger:
            - { call: "POST /curb/schedule-windows", payload: { permit_id: "${permit_id}", zone_id: "${z1}", day_of_week: 0, start_minute: 590, end_minute: 640, exclusive: true }, as: Permittee, as_user_id: "${pm_id}", captures: { err: $.data.error_id } }
          assert:
            - "Two NON-exclusive windows on identical [540,600) both created (201) - non-exclusive shares"
            - "Exclusive window A [540,600) created successfully"
            - "Trigger exclusive window [590,640) returns HTTP 409 ERR_SCHEDULE_WINDOW_CONFLICT (overlaps exclusive A within buffer)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: reservation_charge_refund_zero
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - calculations.zone_revenue_rollup
          - entities.LedgerEntry.fields.amount_cents
        distinguishing_aspect: "Conserved quantity = per-reservation ledger balance sum(LedgerEntry.amount_cents WHERE reservation_id == R). Confirm appends CHARGE +900; cancel-before-start appends REFUND -900; the balance returns to exactly 0."
        test_recipe:
          setup:
            - "Reservation R [08:00Z,08:45Z) CONFIRMED (CHARGE +900); clock 2026-05-20 (< start)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /curb/pricing-policies", payload: { name: "P1", base_rate_cents_per_15min: 200, peak_multiplier_bps: 15000, peak_start_hour: 7, peak_end_hour: 10, surge_tier1_ratio_bps: 5000, surge_tier1_mult_bps: 12500, surge_tier2_ratio_bps: 8000, surge_tier2_mult_bps: 15000 }, as: CurbPlanner, captures: { pol_id: $.data.id } }
            - { call: "POST /curb/zones", payload: { name: "Z1", block_face: "MAIN-100", length_meters: 12, designation: "LOADING", capacity_slots: 5, pricing_policy_id: "${pol_id}" }, as: CurbPlanner, captures: { z1: $.data.id } }
            - { call: "POST /curb/permittees", payload: { legal_name: "Acme", contact_email: "a@x.com", permittee_type: "CARRIER" }, as: PlatformAdmin, captures: { pm_id: $.data.id } }
            - { call: "POST /curb/permits", payload: { permittee_id: "${pm_id}", requested_designation: "LOADING", purpose: "deliveries", zone_ids: ["${z1}"] }, as: Permittee, as_user_id: "${pm_id}", captures: { permit_id: $.data.id } }
            - { call: "POST /curb/permits/${permit_id}/submit", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
            - { call: "POST /curb/permits/${permit_id}/review", payload: {}, as: CurbPlanner, as_user_id: "planner1" }
            - { call: "POST /curb/permits/${permit_id}/approve", payload: {}, as: PermitApprover, as_user_id: "approver1" }
            - { call: "POST /curb/reservations", payload: { permit_id: "${permit_id}", zone_id: "${z1}", start_utc: "2026-06-01T08:00:00Z", end_utc: "2026-06-01T08:45:00Z" }, as: Permittee, as_user_id: "${pm_id}", captures: { res_id: $.data.id } }
            - { call: "POST /curb/reservations/${res_id}/confirm", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
          trigger:
            - { call: "POST /curb/reservations/${res_id}/cancel", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
          assert:
            - "Exactly two LedgerEntry rows for reservation_id == ${res_id}: CHARGE +900 and REFUND -900"
            - "sum(LedgerEntry.amount_cents WHERE reservation_id == ${res_id}) == 0"
            - "Reservation.${res_id}.payment_status == REFUNDED"

      - name: citation_issue_dismiss_receivable
        grounds:
          - state_machines.Citation.DISPUTED_to_DISMISSED
          - entities.Permittee.fields.outstanding_fines_cents
        distinguishing_aspect: "Conserved quantity = Permittee.outstanding_fines_cents. Issuing a citation raises it by the base fine; a compensating DISMISSED adjudication removes the citation from the open set and restores it to the pre-issue value 0 - a distinct conserved quantity from the reservation ledger balance."
        test_recipe:
          setup:
            - "Permittee PM with no citations (outstanding 0); officer issues an OVERSTAY citation (fine 7500, outstanding -> 7500) at 2026-05-20; citation disputed"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /curb/pricing-policies", payload: { name: "P1", base_rate_cents_per_15min: 200, peak_multiplier_bps: 15000, peak_start_hour: 7, peak_end_hour: 10, surge_tier1_ratio_bps: 5000, surge_tier1_mult_bps: 12500, surge_tier2_ratio_bps: 8000, surge_tier2_mult_bps: 15000 }, as: CurbPlanner, captures: { pol_id: $.data.id } }
            - { call: "POST /curb/zones", payload: { name: "Z1", block_face: "MAIN-100", length_meters: 12, designation: "LOADING", capacity_slots: 5, pricing_policy_id: "${pol_id}" }, as: CurbPlanner, captures: { z1: $.data.id } }
            - { call: "POST /curb/permittees", payload: { legal_name: "Acme", contact_email: "a@x.com", permittee_type: "CARRIER" }, as: PlatformAdmin, captures: { pm_id: $.data.id } }
            - { call: "POST /curb/citations", payload: { zone_id: "${z1}", permittee_id: "${pm_id}", violation_type: "OVERSTAY" }, as: EnforcementOfficer, as_user_id: "officer1", captures: { cit_id: $.data.id } }
            - { call: "POST /curb/citations/${cit_id}/dispute", payload: { reason: "not us" }, as: Permittee, as_user_id: "${pm_id}" }
          trigger:
            - { call: "POST /curb/citations/${cit_id}/adjudicate", payload: { decision: "DISMISSED" }, as: EnforcementOfficer, as_user_id: "officer1" }
          assert:
            - "Before dismiss: Permittee.${pm_id}.outstanding_fines_cents == 7500"
            - "Citation.${cit_id}.status == DISMISSED"
            - "After dismiss: Permittee.${pm_id}.outstanding_fines_cents == 0 (restored to pre-issue)"
