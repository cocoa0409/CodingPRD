scaffold_corner_design:
  # =====================================================================
  - section: entities
    instances:
      - name: create_client_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Client.fields.status, entities.Client.fields.outstanding_balance_cents]
        distinguishing_aspect: "POST /care/clients with the four required fields returns 201; status defaults ACTIVE, outstanding_balance_cents defaults 0, ot_threshold_hours defaults 8."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /care/clients"
              payload: { name: "Client Z", home_zip: "90001", hourly_rate_cents: 3000, mileage_rate_cents_per_mile: 75 }
              as: CareCoordinator
              captures: { cl: $.data.id }
          assert:
            - "Client.${cl}.status == ACTIVE"
            - "Client.${cl}.outstanding_balance_cents == 0"
            - "Client.${cl}.version == 1"

      - name: error_client_not_found_on_get
        claim_type: Not Found
        grounds: [entities.Client, "errors[ERR_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "GET /care/clients/{unknown-uuid} returns ERR_RESOURCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /care/clients/00000000-0000-0000-0000-000000000000"
              as: CareCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RESOURCE_NOT_FOUND"

      - name: error_required_field_missing_on_create_visit
        claim_type: Required Fields
        grounds: [entities.Visit.fields.scheduled_end, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /care/visits omitting scheduled_end returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A client exists."]
          setup_api_calls:
            - call: "POST /care/clients"
              payload: { name: "Client S1", home_zip: "90001", hourly_rate_cents: 3000, mileage_rate_cents_per_mile: 75 }
              as: CareCoordinator
              captures: { cl: $.data.id }
          trigger:
            - call: "POST /care/visits"
              payload: { client_id: "${cl}", task_type: "COMPANION", scheduled_start: "2026-03-05T09:00:00Z" }
              as: CareCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: error_invalid_enum_task_type_on_create_visit
        claim_type: Type Constraints
        grounds: [entities.Visit.fields.task_type, "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "POST /care/visits with task_type not in {GROCERY,RX_PICKUP,TRANSPORT,COMPANION} returns ERR_INVALID_ENUM (422)."
        test_recipe:
          setup: ["A client exists."]
          setup_api_calls:
            - call: "POST /care/clients"
              payload: { name: "Client S2", home_zip: "90001", hourly_rate_cents: 3000, mileage_rate_cents_per_mile: 75 }
              as: CareCoordinator
              captures: { cl: $.data.id }
          trigger:
            - call: "POST /care/visits"
              payload: { client_id: "${cl}", task_type: "MASSAGE", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T10:00:00Z" }
              as: CareCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_ENUM"

      - name: visit_log_entry_append_only_listed_in_order
        claim_type: Immutability
        grounds: [entities.VisitLogEntry, endpoints.visit_log_list]
        distinguishing_aspect: "VisitLogEntry (common_fields:false) is append-only: two POSTed entries both appear via GET /care/visits/{id}/log and carry id + created_at but no version field."
        test_recipe:
          setup: ["Caregiver assigned and clocked in on a visit."]
          setup_api_calls:
            - call: "POST /care/caregivers"
              payload: { name: "CG S", home_zip: "90001" }
              as: CareCoordinator
              captures: { cg: $.data.id }
            - call: "POST /care/caregivers/${cg}/background-checks"
              payload: {}
              as: CareCoordinator
              captures: { bgc: $.data.id }
            - call: "POST /care/background-checks/${bgc}/decision"
              payload: { outcome: "CLEARED", expires_at: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/caregivers/${cg}/bonds"
              payload: { coverage_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/clients"
              payload: { name: "Client S3", home_zip: "90001", hourly_rate_cents: 3000, mileage_rate_cents_per_mile: 75 }
              as: CareCoordinator
              captures: { cl: $.data.id }
            - call: "POST /care/visits"
              payload: { client_id: "${cl}", task_type: "COMPANION", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z" }
              as: CareCoordinator
              captures: { v: $.data.id, vv: $.data.version }
            - call: "POST /care/visits/${v}/assignments"
              payload: { caregiver_id: "${cg}", expected_visit_version: "${vv}" }
              as: CareCoordinator
            - call: "POST /care/visits/${v}/clock-in"
              payload: { actual_start: "2026-03-05T09:00:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /care/visits/${v}/log"
              payload: { entry_type: "NOTE", note: "arrived on time" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /care/visits/${v}/log"
              payload: { entry_type: "TASK_DONE", note: "groceries delivered" }
              as: Caregiver
              as_user_id: "${cg}"
          trigger:
            - call: "GET /care/visits/${v}/log"
              as: CareCoordinator
          assert:
            - "response data has total_count == 2 (both entries present)"

  # =====================================================================
  - section: state_machines
    instances:
      - name: error_finalize_non_draft_invoice
        claim_type: invalid_transition
        grounds: [state_machines.Invoice.DRAFT_to_FINALIZED, "errors[ERR_INVOICE_NOT_DRAFT]"]
        distinguishing_aspect: "Finalizing an already FINALIZED invoice returns ERR_INVOICE_NOT_DRAFT (409)."
        test_recipe:
          setup: ["A FINALIZED invoice from a completed visit."]
          setup_api_calls:
            - call: "POST /care/caregivers"
              payload: { name: "CG T", home_zip: "90001" }
              as: CareCoordinator
              captures: { cg: $.data.id }
            - call: "POST /care/caregivers/${cg}/background-checks"
              payload: {}
              as: CareCoordinator
              captures: { bgc: $.data.id }
            - call: "POST /care/background-checks/${bgc}/decision"
              payload: { outcome: "CLEARED", expires_at: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/caregivers/${cg}/bonds"
              payload: { coverage_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/clients"
              payload: { name: "Client T", home_zip: "90001", hourly_rate_cents: 3000, mileage_rate_cents_per_mile: 75 }
              as: CareCoordinator
              captures: { cl: $.data.id }
            - call: "POST /care/visits"
              payload: { client_id: "${cl}", task_type: "COMPANION", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z" }
              as: CareCoordinator
              captures: { v: $.data.id, vv: $.data.version }
            - call: "POST /care/visits/${v}/assignments"
              payload: { caregiver_id: "${cg}", expected_visit_version: "${vv}" }
              as: CareCoordinator
            - call: "POST /care/visits/${v}/clock-in"
              payload: { actual_start: "2026-03-05T09:00:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /care/visits/${v}/clock-out"
              payload: { actual_end: "2026-03-05T12:00:00Z", mileage_miles: 0 }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "GET /care/invoices?visit_id=${v}"
              as: BillingClerk
              captures: { inv: "$.data[0].id" }
            - call: "POST /care/invoices/${inv}/finalize"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /care/invoices/${inv}/finalize"
              payload: {}
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVOICE_NOT_DRAFT"

      - name: error_clockout_on_scheduled_visit
        claim_type: invalid_transition
        grounds: [state_machines.Visit.IN_PROGRESS_to_COMPLETED, "errors[ERR_VISIT_NOT_IN_PROGRESS]"]
        distinguishing_aspect: "Clock-out on a SCHEDULED (never clocked-in) visit returns ERR_VISIT_NOT_IN_PROGRESS (409)."
        test_recipe:
          setup: ["A caregiver assigned to a SCHEDULED visit (not clocked in)."]
          setup_api_calls:
            - call: "POST /care/caregivers"
              payload: { name: "CG U", home_zip: "90001" }
              as: CareCoordinator
              captures: { cg: $.data.id }
            - call: "POST /care/caregivers/${cg}/background-checks"
              payload: {}
              as: CareCoordinator
              captures: { bgc: $.data.id }
            - call: "POST /care/background-checks/${bgc}/decision"
              payload: { outcome: "CLEARED", expires_at: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/caregivers/${cg}/bonds"
              payload: { coverage_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/clients"
              payload: { name: "Client U", home_zip: "90001", hourly_rate_cents: 3000, mileage_rate_cents_per_mile: 75 }
              as: CareCoordinator
              captures: { cl: $.data.id }
            - call: "POST /care/visits"
              payload: { client_id: "${cl}", task_type: "COMPANION", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z" }
              as: CareCoordinator
              captures: { v: $.data.id, vv: $.data.version }
            - call: "POST /care/visits/${v}/assignments"
              payload: { caregiver_id: "${cg}", expected_visit_version: "${vv}" }
              as: CareCoordinator
          trigger:
            - call: "POST /care/visits/${v}/clock-out"
              payload: { actual_end: "2026-03-05T12:00:00Z", mileage_miles: 0 }
              as: Caregiver
              as_user_id: "${cg}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VISIT_NOT_IN_PROGRESS"

      - name: error_suspend_already_suspended_client
        claim_type: idempotency
        grounds: [state_machines.Client.ACTIVE_to_SUSPENDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second suspend on an already-SUSPENDED client returns ERR_INVALID_STATE (409); the cascade does not re-run."
        test_recipe:
          setup: ["A client already SUSPENDED."]
          setup_api_calls:
            - call: "POST /care/clients"
              payload: { name: "Client V", home_zip: "90001", hourly_rate_cents: 3000, mileage_rate_cents_per_mile: 75 }
              as: CareCoordinator
              captures: { cl: $.data.id }
            - call: "POST /care/clients/${cl}/suspend"
              payload: {}
              as: CareCoordinator
          trigger:
            - call: "POST /care/clients/${cl}/suspend"
              payload: {}
              as: CareCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: error_acknowledge_non_open_wellness_check
        claim_type: invalid_transition
        grounds: [state_machines.WellnessCheck.OPEN_to_ACKNOWLEDGED, "errors[ERR_WELLNESS_NOT_ACTIONABLE]"]
        distinguishing_aspect: "Acknowledging a RESOLVED wellness check returns ERR_WELLNESS_NOT_ACTIONABLE (409)."
        test_recipe:
          setup: ["A wellness check resolved directly by the coordinator."]
          setup_api_calls:
            - call: "POST /care/caregivers"
              payload: { name: "CG W", home_zip: "90001" }
              as: CareCoordinator
              captures: { cg: $.data.id }
            - call: "POST /care/caregivers/${cg}/background-checks"
              payload: {}
              as: CareCoordinator
              captures: { bgc: $.data.id }
            - call: "POST /care/background-checks/${bgc}/decision"
              payload: { outcome: "CLEARED", expires_at: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/caregivers/${cg}/bonds"
              payload: { coverage_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/clients"
              payload: { name: "Client W", home_zip: "90001", hourly_rate_cents: 3000, mileage_rate_cents_per_mile: 75 }
              as: CareCoordinator
              captures: { cl: $.data.id }
            - call: "POST /care/visits"
              payload: { client_id: "${cl}", task_type: "COMPANION", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z" }
              as: CareCoordinator
              captures: { v: $.data.id, vv: $.data.version }
            - call: "POST /care/visits/${v}/assignments"
              payload: { caregiver_id: "${cg}", expected_visit_version: "${vv}" }
              as: CareCoordinator
            - call: "POST /care/visits/${v}/clock-in"
              payload: { actual_start: "2026-03-05T09:00:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /care/visits/${v}/escalate"
              payload: { severity: "LOW", reason: "check-in" }
              as: Caregiver
              as_user_id: "${cg}"
              captures: { wc: $.data.id }
            - call: "POST /care/wellness-checks/${wc}/resolve"
              payload: {}
              as: CareCoordinator
          trigger:
            - call: "POST /care/wellness-checks/${wc}/acknowledge"
              payload: {}
              as: FamilyContact
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_WELLNESS_NOT_ACTIONABLE"

      - name: error_approve_non_requested_addon
        claim_type: invalid_transition
        grounds: [state_machines.AddOn.REQUESTED_to_APPROVED, "errors[ERR_ADDON_NOT_REQUESTED]"]
        distinguishing_aspect: "Approving an add-on that is already APPROVED returns ERR_ADDON_NOT_REQUESTED (409)."
        test_recipe:
          setup: ["A visit with an add-on already APPROVED."]
          setup_api_calls:
            - call: "POST /care/clients"
              payload: { name: "Client X", home_zip: "90001", hourly_rate_cents: 3000, mileage_rate_cents_per_mile: 75 }
              as: CareCoordinator
              captures: { cl: $.data.id }
            - call: "POST /care/visits"
              payload: { client_id: "${cl}", task_type: "COMPANION", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z" }
              as: CareCoordinator
              captures: { v: $.data.id }
            - call: "POST /care/visits/${v}/add-ons"
              payload: { addon_type: "PET_CARE", fee_cents: 800 }
              as: CareCoordinator
              captures: { ao: $.data.id }
            - call: "POST /care/add-ons/${ao}/approve"
              payload: { outcome: "APPROVE" }
              as: CareCoordinator
          trigger:
            - call: "POST /care/add-ons/${ao}/approve"
              payload: { outcome: "APPROVE" }
              as: CareCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ADDON_NOT_REQUESTED"

      - name: error_cancel_completed_visit_terminal
        claim_type: terminal_state
        grounds: [state_machines.Visit.SCHEDULED_to_CANCELLED, "errors[ERR_VISIT_NOT_SCHEDULED]"]
        distinguishing_aspect: "Cancelling a COMPLETED visit (terminal) returns ERR_VISIT_NOT_SCHEDULED (409)."
        test_recipe:
          setup: ["A COMPLETED visit."]
          setup_api_calls:
            - call: "POST /care/caregivers"
              payload: { name: "CG Y", home_zip: "90001" }
              as: CareCoordinator
              captures: { cg: $.data.id }
            - call: "POST /care/caregivers/${cg}/background-checks"
              payload: {}
              as: CareCoordinator
              captures: { bgc: $.data.id }
            - call: "POST /care/background-checks/${bgc}/decision"
              payload: { outcome: "CLEARED", expires_at: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/caregivers/${cg}/bonds"
              payload: { coverage_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/clients"
              payload: { name: "Client Y", home_zip: "90001", hourly_rate_cents: 3000, mileage_rate_cents_per_mile: 75 }
              as: CareCoordinator
              captures: { cl: $.data.id }
            - call: "POST /care/visits"
              payload: { client_id: "${cl}", task_type: "COMPANION", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z" }
              as: CareCoordinator
              captures: { v: $.data.id, vv: $.data.version }
            - call: "POST /care/visits/${v}/assignments"
              payload: { caregiver_id: "${cg}", expected_visit_version: "${vv}" }
              as: CareCoordinator
            - call: "POST /care/visits/${v}/clock-in"
              payload: { actual_start: "2026-03-05T09:00:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /care/visits/${v}/clock-out"
              payload: { actual_end: "2026-03-05T12:00:00Z", mileage_miles: 0 }
              as: Caregiver
              as_user_id: "${cg}"
          trigger:
            - call: "POST /care/visits/${v}/cancel"
              payload: {}
              as: CareCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VISIT_NOT_SCHEDULED"

  # =====================================================================
  - section: calculations
    instances:
      - name: only_approved_addons_billed_on_invoice
        claim_type: Input Set Filtering
        grounds: [calculations.invoice_assembly, entities.Invoice.fields.addon_cents]
        distinguishing_aspect: "A REQUESTED (unapproved) add-on of 800c is NOT included in Invoice.addon_cents; with no approved add-ons addon_cents == 0."
        test_recipe:
          setup: ["A completed visit whose only add-on stayed REQUESTED (rate 3000, 3h, 0 miles)."]
          setup_api_calls:
            - call: "POST /care/caregivers"
              payload: { name: "CG AA", home_zip: "90001" }
              as: CareCoordinator
              captures: { cg: $.data.id }
            - call: "POST /care/caregivers/${cg}/background-checks"
              payload: {}
              as: CareCoordinator
              captures: { bgc: $.data.id }
            - call: "POST /care/background-checks/${bgc}/decision"
              payload: { outcome: "CLEARED", expires_at: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/caregivers/${cg}/bonds"
              payload: { coverage_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/clients"
              payload: { name: "Client AA", home_zip: "90001", hourly_rate_cents: 3000, mileage_rate_cents_per_mile: 75 }
              as: CareCoordinator
              captures: { cl: $.data.id }
            - call: "POST /care/visits"
              payload: { client_id: "${cl}", task_type: "COMPANION", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z" }
              as: CareCoordinator
              captures: { v: $.data.id, vv: $.data.version }
            - call: "POST /care/visits/${v}/assignments"
              payload: { caregiver_id: "${cg}", expected_visit_version: "${vv}" }
              as: CareCoordinator
            - call: "POST /care/visits/${v}/add-ons"
              payload: { addon_type: "EXTRA_STOP", fee_cents: 800 }
              as: CareCoordinator
            - call: "POST /care/visits/${v}/clock-in"
              payload: { actual_start: "2026-03-05T09:00:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /care/visits/${v}/clock-out"
              payload: { actual_end: "2026-03-05T12:00:00Z", mileage_miles: 0 }
              as: Caregiver
              as_user_id: "${cg}"
          trigger:
            - call: "GET /care/invoices?visit_id=${v}"
              as: BillingClerk
              captures: { inv: "$.data[0].id" }
          assert:
            - "Invoice.${inv}.addon_cents == 0"
            - "Invoice.${inv}.total_cents == 9000"

      - name: min_visit_minutes_guarantee_short_visit
        claim_type: Constants Applied
        grounds: [calculations.labor_charge, entities.Client.fields.min_visit_minutes]
        distinguishing_aspect: "A 30-minute actual visit is billed at the 60-minute minimum: labor = 1.0h * 3000 = 3000, not 1500."
        test_recipe:
          setup: ["Client min_visit_minutes 60, rate 3000; visit worked only 09:00-09:30 (30 min)."]
          setup_api_calls:
            - call: "POST /care/caregivers"
              payload: { name: "CG AB", home_zip: "90001" }
              as: CareCoordinator
              captures: { cg: $.data.id }
            - call: "POST /care/caregivers/${cg}/background-checks"
              payload: {}
              as: CareCoordinator
              captures: { bgc: $.data.id }
            - call: "POST /care/background-checks/${bgc}/decision"
              payload: { outcome: "CLEARED", expires_at: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/caregivers/${cg}/bonds"
              payload: { coverage_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/clients"
              payload: { name: "Client AB", home_zip: "90001", hourly_rate_cents: 3000, mileage_rate_cents_per_mile: 75, min_visit_minutes: 60 }
              as: CareCoordinator
              captures: { cl: $.data.id }
            - call: "POST /care/visits"
              payload: { client_id: "${cl}", task_type: "GROCERY", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T09:30:00Z" }
              as: CareCoordinator
              captures: { v: $.data.id, vv: $.data.version }
            - call: "POST /care/visits/${v}/assignments"
              payload: { caregiver_id: "${cg}", expected_visit_version: "${vv}" }
              as: CareCoordinator
            - call: "POST /care/visits/${v}/clock-in"
              payload: { actual_start: "2026-03-05T09:00:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /care/visits/${v}/clock-out"
              payload: { actual_end: "2026-03-05T09:30:00Z", mileage_miles: 0 }
              as: Caregiver
              as_user_id: "${cg}"
          trigger:
            - call: "GET /care/invoices?visit_id=${v}"
              as: BillingClerk
              captures: { inv: "$.data[0].id" }
          assert:
            - "Invoice.${inv}.labor_cents == 3000"

      - name: labor_tiered_overtime_covered_by_difficulty
        claim_type: Correct Result
        grounds: [calculations.labor_charge]
        excluded_because:
          difficulty_instance: combinatorial_formula / labor_tiered_overtime_nonlinear
          rationale: "The tiered-overtime labor result is asserted directly by the named §1.8 instance."

      - name: rounding_order_covered_by_difficulty
        claim_type: Precision
        grounds: [calculations.invoice_assembly]
        excluded_because:
          difficulty_instance: combinatorial_formula / invoice_rounding_per_line_then_sum
          rationale: "Per-line rounding order is asserted by the named §1.8 instance."

  # =====================================================================
  - section: validations
    instances:
      - name: error_not_resource_owner_wrong_caregiver_clockin
        claim_type: Violation → Error
        grounds: ["validations[priority=4]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "A caregiver who is not the visit's assigned caregiver attempting clock-in returns ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["A visit assigned to caregiver-1; a second caregiver-2 exists."]
          setup_api_calls:
            - call: "POST /care/caregivers"
              payload: { name: "CG AC1", home_zip: "90001" }
              as: CareCoordinator
              captures: { cg1: $.data.id }
            - call: "POST /care/caregivers/${cg1}/background-checks"
              payload: {}
              as: CareCoordinator
              captures: { bgc1: $.data.id }
            - call: "POST /care/background-checks/${bgc1}/decision"
              payload: { outcome: "CLEARED", expires_at: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/caregivers/${cg1}/bonds"
              payload: { coverage_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/caregivers"
              payload: { name: "CG AC2", home_zip: "90001" }
              as: CareCoordinator
              captures: { cg2: $.data.id }
            - call: "POST /care/clients"
              payload: { name: "Client AC", home_zip: "90001", hourly_rate_cents: 3000, mileage_rate_cents_per_mile: 75 }
              as: CareCoordinator
              captures: { cl: $.data.id }
            - call: "POST /care/visits"
              payload: { client_id: "${cl}", task_type: "COMPANION", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z" }
              as: CareCoordinator
              captures: { v: $.data.id, vv: $.data.version }
            - call: "POST /care/visits/${v}/assignments"
              payload: { caregiver_id: "${cg1}", expected_visit_version: "${vv}" }
              as: CareCoordinator
          trigger:
            - call: "POST /care/visits/${v}/clock-in"
              payload: { actual_start: "2026-03-05T09:00:00Z" }
              as: Caregiver
              as_user_id: "${cg2}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_RESOURCE_OWNER"

      - name: error_invalid_time_range_visit_create
        claim_type: Violation → Error
        grounds: ["validations[priority=12]", "errors[ERR_INVALID_TIME_RANGE]"]
        distinguishing_aspect: "POST /care/visits with scheduled_end <= scheduled_start returns ERR_INVALID_TIME_RANGE (422)."
        test_recipe:
          setup: ["A client exists."]
          setup_api_calls:
            - call: "POST /care/clients"
              payload: { name: "Client AD", home_zip: "90001", hourly_rate_cents: 3000, mileage_rate_cents_per_mile: 75 }
              as: CareCoordinator
              captures: { cl: $.data.id }
          trigger:
            - call: "POST /care/visits"
              payload: { client_id: "${cl}", task_type: "COMPANION", scheduled_start: "2026-03-05T12:00:00Z", scheduled_end: "2026-03-05T11:00:00Z" }
              as: CareCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_TIME_RANGE"

      - name: error_policy_client_mismatch_on_claim_create
        claim_type: Cross-entity validation
        grounds: ["validations[priority=10]", "errors[ERR_POLICY_CLIENT_MISMATCH]"]
        distinguishing_aspect: "Opening a claim whose LTCPolicy belongs to a different client than the invoice returns ERR_POLICY_CLIENT_MISMATCH (409)."
        test_recipe:
          setup: ["Client-1 has a finalized invoice; client-2 owns the policy."]
          setup_api_calls:
            - call: "POST /care/caregivers"
              payload: { name: "CG AE", home_zip: "90001" }
              as: CareCoordinator
              captures: { cg: $.data.id }
            - call: "POST /care/caregivers/${cg}/background-checks"
              payload: {}
              as: CareCoordinator
              captures: { bgc: $.data.id }
            - call: "POST /care/background-checks/${bgc}/decision"
              payload: { outcome: "CLEARED", expires_at: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/caregivers/${cg}/bonds"
              payload: { coverage_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/clients"
              payload: { name: "Client AE1", home_zip: "90001", hourly_rate_cents: 3000, mileage_rate_cents_per_mile: 75 }
              as: CareCoordinator
              captures: { cl1: $.data.id }
            - call: "POST /care/clients"
              payload: { name: "Client AE2", home_zip: "90002", hourly_rate_cents: 3000, mileage_rate_cents_per_mile: 75 }
              as: CareCoordinator
              captures: { cl2: $.data.id }
            - call: "POST /care/clients/${cl2}/ltc-policies"
              payload: { payer_name: "OtherCo", benefit_type: "INDEMNITY", lifetime_max_cents: 1000000, daily_benefit_cents: 5000 }
              as: CareCoordinator
              captures: { pol2: $.data.id }
            - call: "POST /care/visits"
              payload: { client_id: "${cl1}", task_type: "COMPANION", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z" }
              as: CareCoordinator
              captures: { v: $.data.id, vv: $.data.version }
            - call: "POST /care/visits/${v}/assignments"
              payload: { caregiver_id: "${cg}", expected_visit_version: "${vv}" }
              as: CareCoordinator
            - call: "POST /care/visits/${v}/clock-in"
              payload: { actual_start: "2026-03-05T09:00:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /care/visits/${v}/clock-out"
              payload: { actual_end: "2026-03-05T12:00:00Z", mileage_miles: 0 }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "GET /care/invoices?visit_id=${v}"
              as: BillingClerk
              captures: { inv: "$.data[0].id" }
            - call: "POST /care/invoices/${inv}/finalize"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /care/invoices/${inv}/claims"
              payload: { ltc_policy_id: "${pol2}" }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_POLICY_CLIENT_MISMATCH"

      - name: priority_state_beats_fiscal_covered_by_difficulty
        claim_type: Priority Ordering
        grounds: ["validations[priority=8]", "validations[priority=13]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / claim_submit_state_beats_fiscal
          rationale: "The state-vs-fiscal precedence is asserted by the named §1.8 instance."

  # =====================================================================
  - section: endpoints
    instances:
      - name: visits_list_pagination_shape
        claim_type: Listing
        grounds: [endpoints.visits_list]
        distinguishing_aspect: "GET /care/visits?client_id=... returns a paginated envelope carrying total_count and has_more for the client's visits."
        test_recipe:
          setup: ["A client with two ad-hoc visits."]
          setup_api_calls:
            - call: "POST /care/clients"
              payload: { name: "Client AF", home_zip: "90001", hourly_rate_cents: 3000, mileage_rate_cents_per_mile: 75 }
              as: CareCoordinator
              captures: { cl: $.data.id }
            - call: "POST /care/visits"
              payload: { client_id: "${cl}", task_type: "COMPANION", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T10:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/visits"
              payload: { client_id: "${cl}", task_type: "GROCERY", scheduled_start: "2026-03-05T11:00:00Z", scheduled_end: "2026-03-05T12:00:00Z" }
              as: CareCoordinator
          trigger:
            - call: "GET /care/visits?client_id=${cl}&limit=10&offset=0"
              as: CareCoordinator
          assert:
            - "response data has total_count == 2 and has_more == false"

      - name: fk_reverse_family_contacts_listed_under_client
        claim_type: Retrieval
        grounds: [entities.FamilyContact.fields.client_id, endpoints.family_contacts_list]
        distinguishing_aspect: "A family contact created under a client is discoverable via GET /care/clients/{id}/family-contacts (FK reverse-reachability)."
        test_recipe:
          setup: ["A client with one family contact."]
          setup_api_calls:
            - call: "POST /care/clients"
              payload: { name: "Client AG", home_zip: "90001", hourly_rate_cents: 3000, mileage_rate_cents_per_mile: 75 }
              as: CareCoordinator
              captures: { cl: $.data.id }
            - call: "POST /care/clients/${cl}/family-contacts"
              payload: { name: "Jane Doe", email: "jane@x.com", relationship: "daughter" }
              as: CareCoordinator
              captures: { fc: $.data.id }
          trigger:
            - call: "GET /care/clients/${cl}/family-contacts"
              as: CareCoordinator
          assert:
            - "response data has total_count == 1 (the created FamilyContact ${fc})"

