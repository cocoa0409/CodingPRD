# =============================================================================
# §1.9 Scaffold Corner Design (Breadth coverage of non-difficulty claims)
# Fishing Charter & Guide Booking — Expert.
# Walks references/claim-extraction-guide.md sections against SCAFFOLD.yaml §1.1–§1.7.
# excluded_because: stubs cite §1.8 instances by name; those have no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_marina_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Marina
          - 'endpoints.POST /marinas'
        distinguishing_aspect: "POST /marinas with name+slot_count returns 201; status=OPEN, open_slot_count=slot_count, turnaround_buffer_minutes default 30, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /marinas"
              payload: { name: "Harbor One", slot_count: 5 }
              as: DockMaster
              captures: { m_id: $.data.id }
          assert:
            - "Marina.${m_id}.status == OPEN"
            - "Marina.${m_id}.open_slot_count == 5"
            - "Marina.${m_id}.turnaround_buffer_minutes == 30"
            - "Marina.${m_id}.version == 1"

      - name: get_charter_recomputes_seats_and_catch
        claim_type: Computed Fields
        grounds:
          - entities.Charter.fields.seats_booked
          - entities.Charter.fields.catch_total
          - "'endpoints.GET /charters/{charterId}'"
        distinguishing_aspect: "GET /charters/{id} returns seats_booked summed over {RESERVED,CONFIRMED} bookings; a charter with one party-3 RESERVED booking shows seats_booked == 3 and catch_total == 0."
        test_recipe:
          setup: ["Charter DRAFT seats_total 6; one RESERVED booking party_size 3."]
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "Comp Marina", slot_count: 2 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "Compboat", length_ft: 30, passenger_capacity: 6 }
              as: FleetManager
              captures: { boat_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Comp Cust", email: "comp@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_id}", trip_type: "INSHORE", depart_at: "2027-06-10T12:00:00Z", return_at: "2027-06-10T16:00:00Z", base_seat_price_cents: 10000, seats_total: 6 }
              as: FleetManager
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /bookings"
              payload: { charter_id: "${ch_id}", customer_id: "${cust_id}", party_size: 3, expected_charter_version: "${ch_v}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "GET /charters/${ch_id}"
              as: FleetManager
              captures: { seats: $.data.seats_booked }
          assert:
            - "Charter.${ch_id}.seats_booked == 3"
            - "Charter.${ch_id}.catch_total == 0"

      - name: create_booking_missing_party_size_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Booking.fields.party_size
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /bookings without party_size returns ERR_INVALID_REQUEST (400); party_size has source:input and no default."
        test_recipe:
          setup: ["Charter DRAFT exists."]
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "Req Marina", slot_count: 2 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "Reqboat", length_ft: 30, passenger_capacity: 6 }
              as: FleetManager
              captures: { boat_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Req Cust", email: "req@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_id}", trip_type: "INSHORE", depart_at: "2027-06-10T12:00:00Z", return_at: "2027-06-10T16:00:00Z", base_seat_price_cents: 10000, seats_total: 6 }
              as: FleetManager
              captures: { ch_id: $.data.id, ch_v: $.data.version }
          trigger:
            - call: "POST /bookings"
              payload: { charter_id: "${ch_id}", customer_id: "${cust_id}", expected_charter_version: "${ch_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_booking_invalid_return_before_depart_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Charter.fields.return_at
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /charters with return_at <= depart_at returns ERR_INVALID_REQUEST (400); the temporal ordering bound is enforced at creation."
        test_recipe:
          setup: ["Marina + boat exist."]
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "Ord Marina", slot_count: 2 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "Ordboat", length_ft: 30, passenger_capacity: 6 }
              as: FleetManager
              captures: { boat_id: $.data.id }
          trigger:
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_id}", trip_type: "INSHORE", depart_at: "2027-06-10T16:00:00Z", return_at: "2027-06-10T12:00:00Z", base_seat_price_cents: 10000, seats_total: 6 }
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: get_marina_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "'endpoints.GET /marinas/{marinaId}'"
          - "errors[ERR_MARINA_NOT_FOUND]"
        distinguishing_aspect: "GET /marinas/{random-uuid} returns ERR_MARINA_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /marinas/00000000-0000-4000-8000-000000000000"
              as: DockMaster
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_MARINA_NOT_FOUND"

      - name: permit_is_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.Permit
          - 'endpoints.POST /permits'
          - "'endpoints.GET /permits/{permitId}'"
        distinguishing_aspect: "Permit has common_fields:false — its create response carries id+created_at but NO version field, and no update/state-transition endpoint exists for it."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /permits"
              payload: { permit_kind: "STATE_INSHORE", permit_number: "S-9", valid_through: "2030-01-01T00:00:00Z", daily_bag_limit: 5 }
              as: FleetManager
              captures: { p_id: $.data.id }
          assert:
            - "Permit.${p_id}.permit_number == S-9"
            - "Permit.${p_id}.daily_bag_limit == 5"
            - "Permit.${p_id} has no field version"

      - name: addon_line_total_non_bulk_no_discount
        claim_type: Computed Fields
        grounds:
          - calculations.addon_line_total_cents
          - entities.AddOnLine.fields.line_total_cents
          - 'endpoints.POST /add-on-lines'
        distinguishing_aspect: "BAIT x2 (below BULK_QTY 10) -> unit_price 800, line_total 1600 with no bulk discount applied."
        test_recipe:
          setup: ["A RESERVED booking exists."]
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "NB Marina", slot_count: 2 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "NBboat", length_ft: 30, passenger_capacity: 6 }
              as: FleetManager
              captures: { boat_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "NB Cust", email: "nb@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_id}", trip_type: "INSHORE", depart_at: "2027-07-10T12:00:00Z", return_at: "2027-07-10T16:00:00Z", base_seat_price_cents: 10000, seats_total: 6 }
              as: FleetManager
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /bookings"
              payload: { charter_id: "${ch_id}", customer_id: "${cust_id}", party_size: 1, expected_charter_version: "${ch_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /add-on-lines"
              payload: { booking_id: "${bk_id}", addon_kind: "BAIT", quantity: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
          assert:
            - "AddOnLine.${line_id}.unit_price_cents == 800"
            - "AddOnLine.${line_id}.line_total_cents == 1600"

      - name: deposit_min_floor_applied
        claim_type: Computed Fields
        grounds:
          - calculations.deposit_due_cents
          - entities.Booking.fields.deposit_due_cents
        distinguishing_aspect: "base 2000 party 1 -> seat_subtotal 2000; 25% = 500 but MIN_DEPOSIT 2000 floor applies, so deposit_due_cents == 2000 (== subtotal cap)."
        test_recipe:
          setup: ["Charter base_seat_price 2000; a booking party_size 1."]
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "Floor Marina", slot_count: 2 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "Floorboat", length_ft: 30, passenger_capacity: 6 }
              as: FleetManager
              captures: { boat_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Floor Cust", email: "floor@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_id}", trip_type: "HALF_DAY", depart_at: "2027-07-10T12:00:00Z", return_at: "2027-07-10T16:00:00Z", base_seat_price_cents: 2000, seats_total: 6 }
              as: FleetManager
              captures: { ch_id: $.data.id, ch_v: $.data.version }
          trigger:
            - call: "POST /bookings"
              payload: { charter_id: "${ch_id}", customer_id: "${cust_id}", party_size: 1, expected_charter_version: "${ch_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
          assert:
            - "Booking.${bk_id}.seat_subtotal_cents == 2000"
            - "Booking.${bk_id}.deposit_due_cents == 2000"

      - name: deposit_round_half_up_above_floor
        claim_type: Precision
        grounds:
          - calculations.deposit_due_cents
        distinguishing_aspect: "base 4001 party 2 not split -> seat_subtotal 8002; 25% = 2000.5 rounds half-up to deposit_due_cents 2001 (> MIN 2000), proving round_half_up on the percent step."
        test_recipe:
          setup: ["Charter base_seat_price 4001; booking party_size 2."]
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "Round Marina", slot_count: 2 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "Roundboat", length_ft: 30, passenger_capacity: 6 }
              as: FleetManager
              captures: { boat_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Round Cust", email: "round@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_id}", trip_type: "INSHORE", depart_at: "2027-07-10T12:00:00Z", return_at: "2027-07-10T16:00:00Z", base_seat_price_cents: 4001, seats_total: 6 }
              as: FleetManager
              captures: { ch_id: $.data.id, ch_v: $.data.version }
          trigger:
            - call: "POST /bookings"
              payload: { charter_id: "${ch_id}", customer_id: "${cust_id}", party_size: 2, expected_charter_version: "${ch_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
          assert:
            - "Booking.${bk_id}.seat_subtotal_cents == 8002"
            - "Booking.${bk_id}.deposit_due_cents == 2001"

      - name: system_fields_ignored_on_input
        claim_type: System Fields
        grounds:
          - entities.Marina.fields.status
          - entities.Marina.fields.open_slot_count
        distinguishing_aspect: "POST /marinas with a client-supplied status and open_slot_count in the body ignores them: status=OPEN, open_slot_count=slot_count regardless."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /marinas"
              payload: { name: "Sys Marina", slot_count: 3 }
              as: DockMaster
              captures: { m_id: $.data.id }
          assert:
            - "Marina.${m_id}.status == OPEN"
            - "Marina.${m_id}.open_slot_count == 3"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: schedule_from_already_scheduled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Charter.transitions.DRAFT_to_SCHEDULED
          - "errors[ERR_CHARTER_NOT_SCHEDULED]"
        distinguishing_aspect: "Calling schedule on a charter already SCHEDULED is not a valid from-state; returns a state error and no side effects fire (version unchanged)."
        test_recipe:
          setup: ["Charter SCHEDULED (crew + slot + paid booking)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-01T00:00:00Z" }
              as: FleetManager
            - call: "POST /marinas"
              payload: { name: "Re Marina", slot_count: 2 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /dock-slots"
              payload: { marina_id: "${marina_id}", slot_label: "M1", max_boat_length_ft: 40 }
              as: DockMaster
              captures: { slot_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "Reboat", length_ft: 30, passenger_capacity: 6 }
              as: FleetManager
              captures: { boat_id: $.data.id }
            - call: "POST /captains"
              payload: { marina_id: "${marina_id}", full_name: "Cap M", uscg_license_grade: "MASTER_50", license_expires_on: "2030-01-01T00:00:00Z" }
              as: FleetManager
              captures: { cap_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Re Cust", email: "re@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_id}", trip_type: "INSHORE", depart_at: "2027-08-10T12:00:00Z", return_at: "2027-08-10T16:00:00Z", base_seat_price_cents: 10000, seats_total: 6 }
              as: FleetManager
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /crew-assignments"
              payload: { charter_id: "${ch_id}", role_slot: "CAPTAIN", captain_id: "${cap_id}" }
              as: FleetManager
            - call: "POST /slot-reservations"
              payload: { dock_slot_id: "${slot_id}", charter_id: "${ch_id}", expected_charter_version: "${ch_v}" }
              as: DockMaster
            - call: "GET /charters/${ch_id}"
              as: FleetManager
              captures: { ch_v2: $.data.version }
            - call: "POST /bookings"
              payload: { charter_id: "${ch_id}", customer_id: "${cust_id}", party_size: 2, expected_charter_version: "${ch_v2}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/pay-deposit"
              payload: { amount_cents: 5000 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /charters/${ch_id}/schedule"
              as: FleetManager
          trigger:
            - call: "POST /charters/${ch_id}/schedule"
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_CHARTER_NOT_SCHEDULED"

      - name: reschedule_from_scheduled_not_on_hold_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Charter.transitions.WEATHER_HOLD_to_SCHEDULED
          - "errors[ERR_CHARTER_NOT_ON_HOLD]"
        distinguishing_aspect: "Reschedule requires WEATHER_HOLD; calling it on a SCHEDULED charter returns ERR_CHARTER_NOT_ON_HOLD."
        test_recipe:
          setup: ["Charter SCHEDULED, not on hold."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-01T00:00:00Z" }
              as: FleetManager
            - call: "POST /marinas"
              payload: { name: "RH Marina", slot_count: 2 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /dock-slots"
              payload: { marina_id: "${marina_id}", slot_label: "N1", max_boat_length_ft: 40 }
              as: DockMaster
              captures: { slot_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "RHboat", length_ft: 30, passenger_capacity: 6 }
              as: FleetManager
              captures: { boat_id: $.data.id }
            - call: "POST /captains"
              payload: { marina_id: "${marina_id}", full_name: "Cap N", uscg_license_grade: "MASTER_50", license_expires_on: "2030-01-01T00:00:00Z" }
              as: FleetManager
              captures: { cap_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "RH Cust", email: "rh@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_id}", trip_type: "INSHORE", depart_at: "2027-08-10T12:00:00Z", return_at: "2027-08-10T16:00:00Z", base_seat_price_cents: 10000, seats_total: 6 }
              as: FleetManager
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /crew-assignments"
              payload: { charter_id: "${ch_id}", role_slot: "CAPTAIN", captain_id: "${cap_id}" }
              as: FleetManager
            - call: "POST /slot-reservations"
              payload: { dock_slot_id: "${slot_id}", charter_id: "${ch_id}", expected_charter_version: "${ch_v}" }
              as: DockMaster
            - call: "GET /charters/${ch_id}"
              as: FleetManager
              captures: { ch_v2: $.data.version }
            - call: "POST /bookings"
              payload: { charter_id: "${ch_id}", customer_id: "${cust_id}", party_size: 2, expected_charter_version: "${ch_v2}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/pay-deposit"
              payload: { amount_cents: 5000 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /charters/${ch_id}/schedule"
              as: FleetManager
          trigger:
            - call: "POST /charters/${ch_id}/reschedule"
              payload: { depart_at: "2027-08-12T12:00:00Z", return_at: "2027-08-12T16:00:00Z" }
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_CHARTER_NOT_ON_HOLD"

      - name: cancel_from_settled_terminal_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Charter.terminal_states
          - "errors[ERR_CHARTER_NOT_CANCELLABLE]"
        distinguishing_aspect: "A SETTLED charter is terminal; cancel returns ERR_CHARTER_NOT_CANCELLABLE and nothing changes."
        test_recipe:
          setup: ["Charter sailed then settled (terminal SETTLED)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-10T11:00:00Z" }
              as: FleetManager
            - call: "POST /marinas"
              payload: { name: "Term Marina", slot_count: 2 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /dock-slots"
              payload: { marina_id: "${marina_id}", slot_label: "O1", max_boat_length_ft: 40 }
              as: DockMaster
              captures: { slot_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "Termboat", length_ft: 30, passenger_capacity: 6 }
              as: FleetManager
              captures: { boat_id: $.data.id }
            - call: "POST /captains"
              payload: { marina_id: "${marina_id}", full_name: "Cap O", uscg_license_grade: "MASTER_50", license_expires_on: "2030-01-01T00:00:00Z" }
              as: FleetManager
              captures: { cap_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Term Cust", email: "term@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_id}", trip_type: "INSHORE", depart_at: "2027-08-10T12:00:00Z", return_at: "2027-08-10T16:00:00Z", base_seat_price_cents: 10000, seats_total: 6 }
              as: FleetManager
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /crew-assignments"
              payload: { charter_id: "${ch_id}", role_slot: "CAPTAIN", captain_id: "${cap_id}" }
              as: FleetManager
            - call: "POST /slot-reservations"
              payload: { dock_slot_id: "${slot_id}", charter_id: "${ch_id}", expected_charter_version: "${ch_v}" }
              as: DockMaster
            - call: "GET /charters/${ch_id}"
              as: FleetManager
              captures: { ch_v2: $.data.version }
            - call: "POST /bookings"
              payload: { charter_id: "${ch_id}", customer_id: "${cust_id}", party_size: 2, expected_charter_version: "${ch_v2}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/pay-deposit"
              payload: { amount_cents: 5000 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /charters/${ch_id}/schedule"
              as: FleetManager
            - call: "POST /charters/${ch_id}/sail"
              as: Captain
              as_user_id: "${cap_id}"
            - call: "POST /charters/${ch_id}/settle"
              as: FleetManager
          trigger:
