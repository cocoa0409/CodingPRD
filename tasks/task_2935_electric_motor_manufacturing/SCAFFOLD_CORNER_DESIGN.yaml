          One TESTED work order at a measured 93.42 % is offered for certification five times while
          the standards table is filled in around it. With no eligible row the answer is priority
          69; with only a US row it is still 69, proving the jurisdiction filter of the selector;
          asking for CN — where no row exists at all — returns priority 45 instead, proving 45
