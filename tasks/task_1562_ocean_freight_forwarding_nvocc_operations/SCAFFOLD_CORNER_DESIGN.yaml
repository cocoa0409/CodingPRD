          assert:
            - "request sent with X-User-Role: SuperUser (not a declared role) — equivalently with headers omitted: error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http 400 (not 404 although the id also does not exist — band 1 precedes band 3)"

      - name: any_role_can_read_shared_gets
        claim_type: satisfaction_pass
        grounds:
