  - rule_id: compensating_invariant
    instances:

      - name: rollback_restores_endpoint_traffic_ledger_to_pre_ramp_value
        grounds:
          - calculations.endpoint_traffic_ledger
          - state_machines.Deployment_rollout_state.RAMPING_to_ROLLED_BACK
          - entities.Deployment.fields.cumulative_ramp_delta_pct
          - entities.TrafficRampStep.fields.reason
          - entities.ServingEndpoint.fields.allocated_traffic_pct
        distinguishing_aspect: |
          LEDGER: ServingEndpoint.allocated_traffic_pct (plus the per-deployment
          cumulative_ramp_delta_pct). FORWARD OPERATIONS: three ramps on D1 (0 -> 5 -> 15 -> 35) and
          one ramp on a co-tenant SHADOW deployment D2 (0 -> 10). COMPENSATING OPERATION: ROLLBACK on
          D1. The invariant is that the compensation releases exactly what D1 held — it appends a
          signed ROLLBACK_RELEASE step of -35.00 rather than recomputing from a checkpoint table, so
          the signed ramp-step rows for D1 sum to exactly 0.00 and the endpoint returns to the 10.00
          it would have had if D1 had never ramped, with D2's own 10.00 untouched.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z startup default"
            - "one APPROVED ModelVersion (feature_spec_hash fs-v1)"
            - "one OPEN ServingEndpoint with max_traffic_pct 100.00"
            - "D1 REALTIME and D2 SHADOW on that SAME endpoint over the same interval (legal: rule 61 is scoped per pattern)"
          setup_api_calls:
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml", revalidation_interval_days: 90 }
