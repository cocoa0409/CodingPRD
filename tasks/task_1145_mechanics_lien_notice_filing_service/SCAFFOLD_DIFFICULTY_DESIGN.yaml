        grounds:
          - entities.Project.fields.open_notice_count
          - entities.Company.fields.open_notice_count
          - state_machines.NoticeOrder.DRAFT_to_EXPIRED
        distinguishing_aspect: |
          Conserved quantity is a COUNT of open obligations (not money): the
          forward action (notice create) increments Project.open_notice_count
          and Company.open_notice_count to 1, and the compensating auto-expiry
          (clock advanced past the 2026-05-22 deadline) returns BOTH counters to
          exactly 0 — open_notice_count == count of notices in {DRAFT, SERVED,
          DELIVERY_FAILED} holds at every step.
        test_recipe:
          setup:
            - "Verified CA project with ACTIVE span (prelim deadline 2026-05-22); no notices yet; both counters at 0"
          setup_api_calls:
            - { call: "POST /lien/companies", payload: { name: "Cnt Co", contact_email: "cn@x.com" }, as: PlatformAdmin, captures: { comp_id: $.data.id, comp_v: $.data.version } }
            - { call: "POST /lien/companies/${comp_id}/balance-adjustments", payload: { amount_cents: 10000000, reason: "seed", expected_company_version: "${comp_v}" }, as: PlatformAdmin }
            - { call: "POST /lien/jurisdiction-rules", payload: { state_code: "CA", project_type: "COMMERCIAL_PRIVATE", prelim_notice_required: true, prelim_days: 20, prelim_day_basis: "CALENDAR", refused_counts_as_served: false, allowed_delivery_methods: ["CERTIFIED_MAIL", "PERSONAL_SERVICE"], filing_window_days: 90, foreclosure_deadline_days: 90, stop_notice_days: 30, bond_claim_days: 45, counts_punch_list: false, retainage_claimable: false, cap_mode: "UNCAPPED", interest_annual_rate: 0.10, bond_pct: 1.25, effective_from: "2026-01-01" }, as: PlatformAdmin }
            - { call: "POST /lien/projects", payload: { name: "Cnt Job", state_code: "CA", county: "Colusa", project_type: "COMMERCIAL_PRIVATE", property_legal_description: "Lot 131", contract_value_cents: 500000, approved_extras_cents: 0, retainage_held_cents: 0 }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { proj_id: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "OWNER", legal_name: "O", address: "1 Cn Ave" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_o: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "GC", legal_name: "G", address: "2 Cn Ave" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_g: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "LENDER", legal_name: "L", address: "9 Ln" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_g_l: $.data.id } }
            - { call: "POST /lien/parties/${p_g_l}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/parties/${p_o}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/parties/${p_g}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/projects/${proj_id}/research-advance", payload: {}, as: OpsAgent }
            - { call: "POST /lien/projects/${proj_id}/research-advance", payload: {}, as: OpsAgent, captures: { pv: $.data.version } }
            - { call: "POST /lien/furnishing-spans", payload: { project_id: "${proj_id}", span_kind: "BASE_CONTRACT", start_date: "2026-05-02", end_date: "2026-06-10", expected_project_version: "${pv}" }, as: CustomerAdmin, as_user_id: "${comp_id}" }
          trigger:
            - { call: "POST /lien/notices", payload: { project_id: "${proj_id}", recipient_party_id: "${p_o}", delivery_method: "CERTIFIED_MAIL" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { n_id: $.data.id } }
            - { call: "GET /lien/projects/${proj_id}", payload: {}, as: OpsAgent, captures: { p_cnt1: $.data.open_notice_count } }
            - { call: "GET /lien/companies/${comp_id}", payload: {}, as: PlatformAdmin, captures: { c_cnt1: $.data.open_notice_count } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-23T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /lien/notices/${n_id}", payload: {}, as: OpsAgent, captures: { n_status: $.data.status } }
            - { call: "GET /lien/projects/${proj_id}", payload: {}, as: OpsAgent, captures: { p_cnt2: $.data.open_notice_count } }
            - { call: "GET /lien/companies/${comp_id}", payload: {}, as: PlatformAdmin, captures: { c_cnt2: $.data.open_notice_count } }
          assert:
            - "After create: Project.open_notice_count == 1 and Company.open_notice_count == 1 (forward action)"
            - "Clock at 2026-05-23 > deadline 2026-05-22: NoticeOrder.${n_id}.status == EXPIRED (lazy auto-transition on read)"
            - "After expiry: Project.open_notice_count == 0 and Company.open_notice_count == 0 (compensation restores the baseline exactly)"
