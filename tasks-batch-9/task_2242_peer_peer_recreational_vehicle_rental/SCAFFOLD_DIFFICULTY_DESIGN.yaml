  # ===========================================================================
  - rule_id: boundary_precision_check
    scaffold_basis: >-
      Five independent PINNED boundaries: OWNER_SUSPENSION_POINT_THRESHOLD = 12
      compared with >=, LATE_GRACE_MINUTES = 60 compared with <=,
      base_subtotal_cents rounded PER NIGHT rather than once at the end,
      MAX_RECORD_POINTS = 6 compared with <=, and the empty-set boundary of
      §1.4 priority 23 (a damage_zone with zero POST_TRIP photos).
    instances:

      - name: owner_suspension_fires_at_exactly_twelve_points_not_eleven
        grounds: >-
          §1.5 POST /rv-marketplace/owners/{ownerId}/penalty-adjustments side
          effects and OWNER_SUSPENSION_POINT_THRESHOLD = 12 from
          §1.3 calculations.cancellation_refund.constants.
        distinguishing_aspect: >-
          The threshold is crossed in two steps that differ by a single point, and
          the boundary is inclusive (>= 12), so 11 must leave the owner ACTIVE and
          its listing LISTED while 12 must suspend both. A third step subtracts one
          point to probe the asymmetric reverse edge: the owner returns to ACTIVE
          but the listing is explicitly NOT auto-reinstated, so an implementation
          that treats the cascade as a reversible function of the current point
          total fails on the way back down.
        test_recipe:
          setup: >-
            Canonical marketplace with one LISTED listing and an owner at 0
            penalty points.
          setup_api_calls:
            - *c_clock
            - *c_owner
            - *c_renter
            - *c_season_peak
            - *c_season_shoulder
            - *c_season_off
            - *c_plan_std
            - *c_policy_mod
            - *c_qual_dr
            - *c_qual_tow
            - *c_listing
            - *c_doc_title
            - *c_doc_reg
            - *c_doc_ins
            - *c_insp_front
            - *c_insp_rear
            - *c_insp_interior
            - *c_insp_roof
            - *c_insp_under
            - *c_verify_title
            - *c_verify_reg
            - *c_verify_ins
            - *c_submit
            - *c_list_approve
          trigger:
            - call: "POST /rv-marketplace/owners/${owner_id}/penalty-adjustments"
              payload: { points_delta: 11, reason: "eleven points of accumulated sanctions" }
              as: PlatformAdmin
            - call: "POST /rv-marketplace/owners/${owner_id}/penalty-adjustments"
              payload: { points_delta: 1, reason: "the twelfth point" }
              as: PlatformAdmin
            - call: "POST /rv-marketplace/owners/${owner_id}/penalty-adjustments"
              payload: { points_delta: -1, reason: "one point credited back on appeal" }
              as: PlatformAdmin
          assert:
            - "trigger step 1 (total 11, one below the threshold): response 200, data.owner_penalty_points == 11, data.status == 'ACTIVE', data.listed_listing_count == 1"
            - "after step 1, GET /rv-marketplace/listings/${listing_id} shows data.listing_status == 'LISTED'"
            - "trigger step 2 (total exactly 12): response 200, data.owner_penalty_points == 12, data.status == 'SUSPENDED', data.listed_listing_count == 0"
            - "after step 2, GET /rv-marketplace/listings/${listing_id} shows data.listing_status == 'SUSPENDED'"
            - "trigger step 3 (back down to 11): response 200, data.owner_penalty_points == 11, data.status == 'ACTIVE', data.listed_listing_count == 0"
            - "after step 3, GET /rv-marketplace/listings/${listing_id} still shows data.listing_status == 'SUSPENDED' — the cascade is not undone"

      - name: late_return_grace_admits_exactly_sixty_minutes_and_bills_at_sixty_one
        grounds: >-
          §1.3 late_return_fee with SCHEDULED_RETURN_TIME_UTC 11:00:00,
          LATE_GRACE_MINUTES 60 (compared with <=), LATE_HOUR_FEE_CENTS 7500 and
          LATE_FEE_CAP_BP 20000.
        distinguishing_aspect: >-
          Two returns one minute apart on two identical bookings straddle the
          grace edge. At 2026-09-02T12:00:00Z late_minutes is exactly 60 and the
          <= comparison yields a zero fee (final_total 151876, balance_due 5813).
          At 12:01:00Z late_minutes is 61, so late_blocks = ceil(1/60) = 1 and the
          fee is min(1 * 7500, cap 43066) = 7500 (final_total 159376, balance_due
          13313). An implementation using < grace bills the first return; one
          that floors instead of ceils the block count bills the second as 0; one
          that applies the cap as a floor bills 43066.
