      - name: existence_beats_state_on_work_item_create
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_REPAIR_NOTICE_NOT_FOUND]
          - errors[ERR_INVALID_BATCH_STATE]
        distinguishing_aspect: |
          Error-category pair (existence, state) — a third distinct pair: the request targets a
          SEALED batch (state violation, priority 5) and references a non-existent notice id
          (existence violation, priority 4); existence must win with ERR_REPAIR_NOTICE_NOT_FOUND 404.
        test_recipe:
          setup:
            - "one batch created and immediately sealed is impossible (needs an item), so: a delinquent notice, a batch with one item, sealed — the batch is now in SEALED_FOR_BIDDING"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Ora Oak", mailing_address: "15 Oak St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
