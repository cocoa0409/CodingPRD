        grounds:
          - validations.priority_23_ERR_SELF_RESTRUCTURING
          - endpoints.POST_/restructurings
        distinguishing_aspect: |
          Both foreign keys resolve to a real Organization, so the existence rule at
          priority 4 is satisfied and the request is well formed - the only thing wrong
          is that the two keys are the SAME row. The refusal is therefore a 422 business
          rule rather than a 400 or a 404, and nothing may be persisted: a self-deal that
          is created and then rolled back would still leave a Restructuring visible to
          the list endpoint.
        test_recipe:
          setup:
            - "One CA organization"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: PlatformAdmin
              captures: { org_a: $.data.id }
          trigger:
            - call: "POST /restructurings"
              payload: { initiator_org_id: "${org_a}", target_org_id: "${org_a}", confidentiality_tier: "STANDARD" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { e_self: $.data.error_id }
            - call: "GET /restructurings"
              payload: { initiator_org_id: "${org_a}", limit: 100, offset: 0 }
              as: StrategyOfficer
              as_user_id: "${org_a}"
          assert:
            - "the create call returns HTTP status 422 with error ERR_SELF_RESTRUCTURING"
            - "the response carries a non-empty error_id and message"
            - "the list call returns HTTP status 200 with an empty items array and total 0"

      - name: a_historic_dollar_value_equal_to_the_fund_value_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_31_ERR_HDV_EXCEEDS_FUND_VALUE
          - calculations.restricted_fund_transferable_amount
          - endpoints.POST_/restricted-funds
        distinguishing_aspect: |
          The rule forbids a historic dollar value that EXCEEDS principal plus
          appreciation, so 62000000 against a fund worth exactly 62000000 satisfies it
          and must be accepted. The accepted boundary then propagates: the judicial
          release is max(0, 62000000 - 62000000) = 0 above the historic floor plus a
          floor-truncated 7 percent slice of 62000000 = 4340000, so a fully underwater
          endowment still releases 4340000 rather than nothing at all.
        test_recipe:
          setup:
            - "One CA organization"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: PlatformAdmin
              captures: { org_a: $.data.id }
          trigger:
            - call: "POST /restricted-funds"
              payload: { org_id: "${org_a}", fund_name: "Underwater Legacy Endowment", fund_type: "PERM_ENDOWMENT", principal_cents: 50000000, accumulated_appreciation_cents: 12000000, historic_dollar_value_cents: 62000000, restriction_purpose_code: "PURP-SCHOLARSHIP", restriction_conflict: true, donor_of_record_reachable: false }
              as: CharitableTrustCounsel
              as_user_id: "ctc-001"
              captures: { fund_u: $.data.id }
            - call: "POST /restricted-funds/${fund_u}/file-petition"
              payload: { petition_basis: "DONOR_UNREACHABLE", court_docket_no: "SUP-CT-2026-0708" }
              as: CharitableTrustCounsel
              as_user_id: "ctc-001"
            - call: "POST /restricted-funds/${fund_u}/record-court-decision"
              payload: { decision: "GRANTED" }
              as: CharitableTrustCounsel
              as_user_id: "ctc-001"
          assert:
