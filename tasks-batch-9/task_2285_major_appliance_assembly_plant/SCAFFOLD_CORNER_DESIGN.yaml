              payload: {}
              as: PlantAdmin
          assert:
            - "After setup: Part.${p_door_id}.lifecycle_status == SERVICE_ONLY with service_obligation_until == 2036-08-03T06:00:00Z, and EngineeringChange.${ecs_id}.status == CUT_IN with cut_in_at == 2026-08-03T06:00:00Z"
            - "Trigger 1: HTTP 409 with error.error_id == ERR_INVALID_STATE — P-DOOR-B is ACTIVE, not SERVICE_ONLY, so the state guard (priority 9) fires before the obligation rule"
            - "Trigger 2: HTTP 409 with error.error_id == ERR_SERVICE_OBLIGATION_ACTIVE — ten years of legacy service supply are still owed"
            - "Trigger 4: HTTP 409 with error.error_id == ERR_SERVICE_OBLIGATION_ACTIVE — equality is still inside the obligation"
            - "Trigger 6: HTTP 200 — Part.${p_door_id}.lifecycle_status == OBSOLETE (terminal) one second past the deadline"

      - name: header_missing_x_user_id_outranks_role_and_schema_checks
        claim_type: priority_ordering
        grounds:
          - validations[priority 1] ERR_UNAUTHENTICATED
          - validations[priority 2] ERR_ROLE_NOT_PERMITTED
          - validations[priority 3] ERR_INVALID_REQUEST
        distinguishing_aspect: "The same malformed POST /lines body yields three different errors depending on how far the request gets: no X-User-ID at all is 401 before the role is looked at, a permitted-but-wrong role is 403 before the body is parsed, and only the right role reaches the 400 schema check on takt_seconds 0."
        test_recipe:
          setup:
            - "Empty database; clock at 2026-08-03T06:00:00Z"
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /lines"
              payload: {}
              as: NONE
              captures: { err_h1_id: $.data.error_id }
            - call: "POST /lines"
              payload: {}
              as: LineOperator
              captures: { err_h2_id: $.data.error_id }
            - call: "POST /lines"
              payload: { line_code: "L9", takt_seconds: 0, option_load_limit_pct: 63.00, baseline_headcount: 20, current_family_code: "FAM_A" }
              as: PlantAdmin
              captures: { err_h3_id: $.data.error_id }
            - call: "POST /lines"
              payload: { line_code: "L9", takt_seconds: 120, option_load_limit_pct: 100.01, baseline_headcount: 20, current_family_code: "FAM_A" }
              as: PlantAdmin
              captures: { err_h4_id: $.data.error_id }
          assert:
            - "Trigger 1 (the X-User-ID header is omitted entirely, written here as as: NONE): HTTP 401 with error.error_id == ERR_UNAUTHENTICATED, even though the body is empty and the role header is absent too"
            - "Trigger 2: HTTP 403 with error.error_id == ERR_ROLE_NOT_PERMITTED — POST /lines is PlantAdmin-exclusive; the empty body is never validated"
            - "Trigger 3: HTTP 400 with error.error_id == ERR_INVALID_REQUEST — takt_seconds must be >= 1"
            - "Trigger 4: HTTP 400 with error.error_id == ERR_INVALID_REQUEST — option_load_limit_pct must lie in (0, 100]"
            - "GET /lines/{id} for any id returns 404 and no Line named 'L9' exists — none of the four calls persisted anything"

      - name: fk_existence_checks_follow_the_declared_input_order
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 5] the referenced entity's NOT_FOUND code
          - validations[priority 7] ERR_STALE_MODEL_VARIANT_VERSION
        distinguishing_aspect: "When several foreign keys are bogus at once, the error is the one for the field declared first in the endpoint's input list — line_id before model_variant_id on POST /build-slots — and existence (priority 5) still outranks the OCC check (priority 7) even when expected_model_variant_version is deliberately stale."
        test_recipe:
          setup:
            - "Base fixture: Line L1 with ST10/ST20, SUP1, P-DOOR-A and WM-X RELEASED carrying the single POS-DOOR BOM line ${bom_x_id}"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - *c_wmx
            - *c_bomx
            - *c_relx
          trigger:
            - call: "POST /build-slots"
              payload: { line_id: "00000000-0000-4000-8000-000000000001", model_variant_id: "00000000-0000-4000-8000-000000000002", sequence_index: 1, planned_start: "2026-08-03T07:00:00Z" }
              as: ProductionPlanner
              captures: { err_f1_id: $.data.error_id }
            - call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "00000000-0000-4000-8000-000000000002", sequence_index: 1, planned_start: "2026-08-03T07:00:00Z" }
              as: ProductionPlanner
              captures: { err_f2_id: $.data.error_id }
            - call: "POST /bom-lines"
              payload: { model_variant_id: "${wmx_id}", part_id: "00000000-0000-4000-8000-000000000003", station_id: "${st10_id}", bom_position_code: "POS-LID", qty_per_unit: 1, effective_from_sequence: 1, expected_model_variant_version: "${wmx_v} + 40" }
              as: EngineeringLead
              captures: { err_f3_id: $.data.error_id }
          assert:
            - "Trigger 1: HTTP 404 with error.error_id == ERR_LINE_NOT_FOUND — line_id is declared before model_variant_id, so its miss is reported first"
            - "Trigger 2: HTTP 404 with error.error_id == ERR_MODEL_VARIANT_NOT_FOUND once line_id resolves"
            - "Trigger 3: HTTP 404 with error.error_id == ERR_PART_NOT_FOUND, not 412 — the stale version (${wmx_v} + 40) is never compared because existence is priority 5 and OCC is priority 7"
            - "No BuildSlot and no BomLine beyond ${bom_x_id} exist afterwards"

      - name: labor_capacity_alone_rejects_the_fourth_slot_at_the_fatigue_tier_jump
        claim_type: aggregate_validation
        grounds:
          - validations[priority 31] ERR_LABOR_CAPACITY_EXCEEDED
          - calculations.shift_committed_labor_minutes
        distinguishing_aspect: "Each slot is individually harmless and the option-load window is never threatened (4 x 4 = 16 <= 31); it is the aggregate that breaks. Three WM-X slots give gross 450 and committed 473 — inside 480 — while the fourth jumps gross to 600, tier 1.12 and committed 672, so only ERR_LABOR_CAPACITY_EXCEEDED fires."
        test_recipe:
          setup:
            - "Base fixture: Line L1 (ST10 capacity 40, ST20), SUP1, P-DOOR-A, WM-X RELEASED (150 labour minutes, 4 option points), ShiftPlan A 06:00-14:00 headcount 20 (available_labor_minutes 480)"
            - "Four PLANNED slots on L1: indexes 1..4 at 07:00, 07:30, 08:00 and 08:30"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - *c_wmx
            - *c_bomx
            - *c_relx
            - *c_lineread
            - *c_shifta
            - *c_slot1
            - *c_slot2
            - call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wmx_id}", sequence_index: 3, planned_start: "2026-08-03T08:00:00Z" }
              as: ProductionPlanner
              captures: { slot3_id: $.data.id }
            - call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wmx_id}", sequence_index: 4, planned_start: "2026-08-03T08:30:00Z" }
              as: ProductionPlanner
              captures: { slot4_id: $.data.id }
          trigger:
            - *c_seq1
            - *c_seq2
            - call: "POST /build-slots/${slot3_id}/sequence"
              payload: {}
              as: ProductionPlanner
            - call: "POST /build-slots/${slot4_id}/sequence"
              payload: {}
              as: ProductionPlanner
              captures: { err_lab_id: $.data.error_id }
          assert:
            - "Triggers 1-3 succeed; after trigger 3 ShiftPlan.${shift_a_id}.unit_labor_minutes == 450 and committed_labor_minutes == 473 (450 is exactly FATIGUE_T2_MAX, so the multiplier is 1.05 and ceil(472.5) == 473)"
            - "Trigger 4: HTTP 422 with error.error_id == ERR_LABOR_CAPACITY_EXCEEDED — gross 600 crosses into tier 1.12 and ceil(672.0) == 672 > 480"
            - "BuildSlot.${slot4_id}.status is still PLANNED with allocated_slot_units == 0; Station.${st10_id}.presentation_slots_used == 6 (three slots x 2), not 8"
            - "ShiftPlan.${shift_a_id}.committed_labor_minutes is still 473 — the rejected slot booked nothing"

      - name: dock_window_conflict_inside_the_ten_minute_buffer
        claim_type: violation_to_error
        grounds:
          - validations[priority 22] ERR_DOCK_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: resource_temporal_overlap / dock_window_buffer_padded_on_both_ends_and_station_scoped
          rationale: "Both-end padding, the exactly-10-minute gap that is legal and the station scoping are asserted there."

      - name: shift_window_overlap_on_the_overtime_extended_end
        claim_type: violation_to_error
        grounds:
          - validations[priority 23] ERR_SHIFT_WINDOW_OVERLAP
        excluded_because:
          difficulty_instance: resource_temporal_overlap / shift_plan_overlap_measured_on_the_overtime_extended_end
          rationale: "The overtime-extended end, the touching-endpoint tolerance and the same-code supersede path are asserted there."

      - name: efficiency_index_one_hundredth_over_tier_b_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 13] ERR_EFFICIENCY_LIMIT_EXCEEDED
        excluded_because:
          difficulty_instance: boundary_precision_check / efficiency_index_exactly_at_tier_b_maximum_certifies
          rationale: "Index 1.00 certifying versus 1.01 raising ERR_EFFICIENCY_LIMIT_EXCEEDED with no mutation is the named instance's subject."

      - name: model_not_released_blocks_certification_but_not_assembly
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 14] ERR_MODEL_NOT_RELEASED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / obsoleting_the_variant_blocks_certification_but_not_assembly
          rationale: "The asymmetry between the certification guard and the assembly path is asserted there."

      - name: line_posture_blocked_on_release_when_constrained
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 26] ERR_LINE_POSTURE_BLOCKED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / station_saturation_derives_line_posture_and_blocks_slot_release
          rationale: "CONSTRAINED blocking release while sequencing stays legal is asserted there."

      - name: option_load_window_and_labor_capacity_both_violated
        claim_type: priority_conflict
        grounds:
          - validations[priority 29] ERR_OPTION_LOAD_WINDOW_EXCEEDED
          - validations[priority 31] ERR_LABOR_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / option_load_window_outranks_labor_capacity
          rationale: "The simultaneous violation and the 29-before-31 outcome are the named instance's subject."

      - name: stale_model_variant_version_and_obsolete_variant_both_violated
        claim_type: priority_conflict
        grounds:
          - validations[priority 7] ERR_STALE_MODEL_VARIANT_VERSION
          - validations[priority 9] ERR_INVALID_STATE
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stale_variant_version_outranks_obsolete_variant_state
          rationale: "Concurrency-before-state on POST /bom-lines is asserted there."

      - name: supplier_scope_violation_and_invalid_call_state_both_violated
        claim_type: priority_conflict
        grounds:
          - validations[priority 6] ERR_SUPPLIER_SCOPE_VIOLATION
          - validations[priority 9] ERR_INVALID_STATE
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / supplier_scope_outranks_invalid_call_state
          rationale: "Authorization-before-state on record-arrival is asserted there."

      - name: bom_not_effective_below_the_cut_in_index
        claim_type: violation_to_error
        grounds:
          - validations[priority 15] ERR_BOM_NOT_EFFECTIVE
        excluded_because:
          difficulty_instance: boundary_precision_check / bom_effective_from_sequence_inclusive_at_cut_in_index
          rationale: "An index below every effective_from_sequence yielding ERR_BOM_NOT_EFFECTIVE, and the inclusive boundary at the cut-in index, are asserted there."

  # ===========================================================================
  - section: endpoints
    instances:

      - name: bom_line_list_resolves_the_effective_set_at_a_sequence_index
        claim_type: computed_read
        grounds:
          - endpoints["GET /bom-lines"]
          - calculations.effective_bom_at_sequence
        distinguishing_aspect: "effective_at_sequence is a resolver, not a filter: with two ACTIVE POS-DOOR lines (effective_from_sequence 1 and 5) the query returns exactly one row per position — the one with the greatest effective_from_sequence <= the probe — so index 4 yields the qty-2 line and index 5 the qty-3 line."
        test_recipe:
          setup:
            - "Base fixture: Line L1 (ST10/ST20), SUP1, P-DOOR-A, WM-X RELEASED with POS-DOOR on P-DOOR-A at ST10 qty 2 effective_from_sequence 1"
            - "A second ACTIVE POS-DOOR line on the same variant: P-DOOR-A at ST10 qty 3, effective_from_sequence 5 (it does not supersede the first, whose effective_from_sequence 1 is below 5)"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - *c_wmx
            - *c_bomx
            - *c_relx
            - &c_wmxread
              call: "GET /model-variants/${wmx_id}"
              payload: {}
              as: EngineeringLead
              captures: { wmx_v2: $.data.version }
            - call: "POST /bom-lines"
              payload: { model_variant_id: "${wmx_id}", part_id: "${p_door_id}", station_id: "${st10_id}", bom_position_code: "POS-DOOR", qty_per_unit: 3, effective_from_sequence: 5, expected_model_variant_version: "${wmx_v2}" }
              as: EngineeringLead
              captures: { bom_x5_id: $.data.id }
          trigger:
            - call: "GET /bom-lines?model_variant_id=${wmx_id}&effective_at_sequence=4"
              payload: {}
              as: ProductionPlanner
            - call: "GET /bom-lines?model_variant_id=${wmx_id}&effective_at_sequence=5"
              payload: {}
              as: ProductionPlanner
            - call: "GET /bom-lines?model_variant_id=${wmx_id}&status=ACTIVE"
              payload: {}
              as: ProductionPlanner
          assert:
            - "Trigger 1: total_count == 1 with items[0].id == ${bom_x_id} and qty_per_unit == 2 — the index-5 line is not yet effective at index 4"
            - "Trigger 2: total_count == 1 with items[0].id == ${bom_x5_id} and qty_per_unit == 3"
            - "Trigger 3: total_count == 2 (both lines are ACTIVE; without effective_at_sequence no resolution happens), has_more == false"
            - "BomLine.${bom_x_id}.status == ACTIVE with superseded_by_bom_line_id null — a later-effective line does not retire an earlier one"

      - name: parent_scoped_lists_paginate_within_their_own_line
        claim_type: listing
        grounds:
          - endpoints["GET /lines/{id}/stations"]
          - endpoints["GET /lines/{id}/shift-plans"]
        distinguishing_aspect: "Both nested lists are scoped by the path parent and ordered deterministically (stations by position_index ASC): L1 reports two stations across two pages while L2 reports zero, and the shift-plan list honours the shift_code filter on top of the scope."
        test_recipe:
          setup:
            - "Line L1 with ST10 (position 10) and ST20 (position 20) and one ACTIVE ShiftPlan A 06:00-14:00"
            - "Line L2 with no stations and no shift plans"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_lineread
            - *c_shifta
            - call: "POST /lines"
              payload: { line_code: "L2", takt_seconds: 100, option_load_limit_pct: 50.00, baseline_headcount: 10, current_family_code: "FAM_B" }
              as: PlantAdmin
              captures: { l2b_id: $.data.id }
          trigger:
            - call: "GET /lines/${line_id}/stations?limit=1&offset=0"
              payload: {}
              as: ProductionPlanner
            - call: "GET /lines/${line_id}/stations?limit=1&offset=1"
              payload: {}
              as: ProductionPlanner
            - call: "GET /lines/${l2b_id}/stations"
              payload: {}
              as: ProductionPlanner
            - call: "GET /lines/${line_id}/shift-plans?shift_code=A"
              payload: {}
              as: ProductionPlanner
            - call: "GET /lines/${line_id}/shift-plans?shift_code=B"
              payload: {}
              as: ProductionPlanner
          assert:
            - "Trigger 1: total_count == 2, has_more == true, exactly one item, items[0].id == ${st10_id} (position_index 10 sorts first)"
            - "Trigger 2: total_count == 2, has_more == false, items[0].id == ${st20_id}"
            - "Trigger 3: total_count == 0, has_more == false, items == [] — L1's stations are invisible from L2"
            - "Trigger 4: total_count == 1 with items[0].id == ${shift_a_id}; Trigger 5: total_count == 0"

      - name: warranty_close_stores_the_design_feedback_note_and_freezes_counters
        claim_type: action_endpoint
        grounds:
          - endpoints["POST /warranty-returns/{id}/close"]
          - state_machines.WarrantyReturn ANALYZED_SUPPLIER -> CLOSED
        distinguishing_aspect: "close is the JOIN of the two analysed branches: it stores design_feedback_note, leaves every counter exactly as the analyse left it (supplier score 90.00, one attributed failure) and is not repeatable — the second call is 409."
        test_recipe:
          setup:
            - "Base fixture through shipping: unit1 CERTIFIED, ASSEMBLED and SHIPPED; clock at 12:00; WarrantyReturn wr1 on unit1 in TEARDOWN"
            - "wr1 analysed as SUPPLIER_DEFECT with root_cause_part_id P-DOOR-A, so SUP1 carries one quality penalty"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - *c_wmx
            - *c_bomx
            - *c_relx
            - *c_lineread
            - *c_shifta
            - *c_slot1
            - *c_seq1
            - *c_rel1
            - *c_hipot1
            - *c_cyc1
            - *c_leak1
            - *c_energy1
            - *c_water1
            - *c_cert1
            - *c_asm1
            - *c_ship1
            - *c_clock12
            - *c_wr1
            - *c_wr1_teardown
            - &c_wr1_supplier
              call: "POST /warranty-returns/${wr1_id}/analyze"
              payload: { disposition: "SUPPLIER_DEFECT", root_cause_part_id: "${p_door_id}" }
              as: WarrantyAnalyst
          trigger:
            - call: "POST /warranty-returns/${wr1_id}/close"
              payload: { design_feedback_note: "seal supplier to requalify tooling" }
              as: WarrantyAnalyst
            - call: "POST /warranty-returns/${wr1_id}/close"
              payload: { design_feedback_note: "again" }
              as: WarrantyAnalyst
              captures: { err_close_id: $.data.error_id }
          assert:
            - "Trigger 1: HTTP 200 — WarrantyReturn.${wr1_id}.status == CLOSED with disposition still SUPPLIER_DEFECT, root_cause_part_id == ${p_door_id}, engineering_change_id null and design_feedback_note == 'seal supplier to requalify tooling'"
            - "Part.${p_door_id}.field_failure_count == 1 and cohort_failure_rate_per_1000 == 1000.00 — close moves no counter"
            - "Supplier.${sup1_id}.quality_penalty_count == 1, on_time_score == 90.00, status == APPROVED"
            - "Trigger 2: HTTP 409 with error.error_id == ERR_INVALID_STATE — CLOSED is terminal"

      - name: production_unit_and_quality_test_filters_compose
        claim_type: listing
        grounds:
          - endpoints["GET /production-units"]
          - endpoints["GET /production-units/{id}/quality-tests"]
        distinguishing_aspect: "Every declared filter is honoured against the same shipped unit: assembly_status SHIPPED matches, quality_status PENDING does not, certification_tier A matches while B does not, and the nested test list splits the five tests by test_type, status and result."
        test_recipe:
          setup:
            - "Base fixture through shipping: unit1 (ENERGY 380.00, WATER 184.00) is CERTIFIED with efficiency_index 0.94 and certification_tier A, then ASSEMBLED and SHIPPED"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - *c_wmx
            - *c_bomx
            - *c_relx
            - *c_lineread
            - *c_shifta
            - *c_slot1
            - *c_seq1
            - *c_rel1
            - *c_hipot1
            - *c_cyc1
            - *c_leak1
            - *c_energy1
            - *c_water1
            - *c_cert1
            - *c_asm1
            - *c_ship1
          trigger:
            - call: "GET /production-units?assembly_status=SHIPPED"
              payload: {}
              as: ProductionPlanner
            - call: "GET /production-units?quality_status=PENDING"
              payload: {}
              as: ProductionPlanner
            - call: "GET /production-units?certification_tier=A"
              payload: {}
              as: ProductionPlanner
            - call: "GET /production-units?certification_tier=B"
              payload: {}
              as: ProductionPlanner
            - call: "GET /production-units/${unit1_id}/quality-tests?result=MEASURED"
              payload: {}
              as: QualityInspector
            - call: "GET /production-units/${unit1_id}/quality-tests?test_type=ENERGY&status=RECORDED"
              payload: {}
              as: QualityInspector
            - call: "GET /production-units/${unit1_id}/quality-tests?status=VOIDED"
              payload: {}
              as: QualityInspector
          assert:
            - "Trigger 1: total_count == 1 with items[0].id == ${unit1_id}; Trigger 2: total_count == 0"
            - "Trigger 3: total_count == 1; Trigger 4: total_count == 0 — the CERTIFICATION_AVERAGE index 0.94 lands in tier A"
            - "Trigger 5: total_count == 2 — only ENERGY and WATER carry result MEASURED; the three gate tests carry PASS"
            - "Trigger 6: total_count == 1 with items[0].limit_value == 400.00; Trigger 7: total_count == 0"

      - name: delivery_call_and_change_lists_filter_on_status_and_origin
        claim_type: listing
        grounds:
          - endpoints["GET /delivery-calls"]
          - endpoints["GET /engineering-changes"]
        distinguishing_aspect: "cancel_reason is queryable independently of status, and origin separates client-authored changes from the warranty-minted ones: with one CANCELLED and one SCHEDULED call and a single MANUAL change, every filter combination returns the exact subset."
        test_recipe:
          setup:
            - "Base fixture: Line L1 (ST10/ST20), SUP1, P-DOOR-A, WM-X RELEASED, ShiftPlan A, slot index 1 PLANNED"
            - "Two DeliveryCalls at ST10 for P-DOOR-A: 09:00-10:00 (later CANCELLED by the planner) and 11:00-12:00 (still SCHEDULED)"
            - "One MANUAL EngineeringChange EC-1 on WM-X / POS-DOOR in SUBMITTED"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - *c_wmx
            - *c_bomx
            - *c_relx
            - *c_lineread
            - *c_shifta
            - *c_slot1
            - *c_call1
            - call: "POST /delivery-calls"
              payload: { supplier_id: "${sup1_id}", part_id: "${p_door_id}", station_id: "${st10_id}", window_start: "2026-08-03T11:00:00Z", window_end: "2026-08-03T12:00:00Z", sequenced_qty: 4 }
              as: ProductionPlanner
              captures: { call2_id: $.data.id }
            - call: "POST /delivery-calls/${call1_id}/cancel"
              payload: {}
              as: ProductionPlanner
            - *c_ec1
            - *c_ec1_submit
          trigger:
            - call: "GET /delivery-calls?supplier_id=${sup1_id}&limit=1&offset=0"
              payload: {}
              as: ProductionPlanner
            - call: "GET /delivery-calls?status=CANCELLED"
              payload: {}
              as: ProductionPlanner
            - call: "GET /delivery-calls?cancel_reason=PLANNER"
              payload: {}
              as: ProductionPlanner
            - call: "GET /delivery-calls?status=SCHEDULED&station_id=${st10_id}"
              payload: {}
              as: ProductionPlanner
            - call: "GET /engineering-changes?origin=MANUAL&status=SUBMITTED"
              payload: {}
              as: EngineeringLead
            - call: "GET /engineering-changes?origin=WARRANTY"
              payload: {}
              as: EngineeringLead
          assert:
            - "Trigger 1: total_count == 2, has_more == true, exactly one item"
            - "Trigger 2: total_count == 1 with items[0].id == ${call1_id}; Trigger 3: total_count == 1 with the same row"
            - "Trigger 4: total_count == 1 with items[0].id == ${call2_id}"
            - "Trigger 5: total_count == 1 with items[0].id == ${ec1_id} and submitted_by_user_id == 'eng-1'; Trigger 6: total_count == 0"

      - name: cut_in_endpoint_applies_all_four_cascade_links
        claim_type: action_endpoint
        grounds:
          - endpoints["POST /engineering-changes/{id}/cut-in"]
        excluded_because:
          difficulty_instance: transitive_cascade / engineering_change_cut_in_supersedes_bom_and_releases_line_side_depth_four
          rationale: "All four declared side effects of the cut-in endpoint are asserted end-to-end there."

      - name: run_checkpoint_endpoint_sweeps_calls_slots_and_changes
        claim_type: bulk_action
        grounds:
          - endpoints["POST /lines/{id}/run-checkpoint"]
        excluded_because:
          difficulty_instance: transitive_cascade / checkpoint_miss_demotes_supplier_and_de_sequences_slot_depth_four
          rationale: "The multi-step sweep and its per-step response arrays are asserted there."

  # ===========================================================================
  - section: errors
    instances:

      - name: remaining_not_found_codes_are_each_reachable_on_their_own_endpoint
        claim_type: error_reachability
        grounds:
          - errors.ERR_STATION_NOT_FOUND
          - errors.ERR_SUPPLIER_NOT_FOUND
          - errors.ERR_BOM_LINE_NOT_FOUND
          - errors.ERR_DELIVERY_CALL_NOT_FOUND
          - errors.ERR_SHIFT_PLAN_NOT_FOUND
          - errors.ERR_BUILD_SLOT_NOT_FOUND
          - errors.ERR_ENGINEERING_CHANGE_NOT_FOUND
          - errors.ERR_WARRANTY_RETURN_NOT_FOUND
        distinguishing_aspect: "Each entity answers with its OWN 404 code rather than a generic one, and the code is decided by the endpoint's type, not by what the UUID happens to be — every id below is the same shape of unknown v4 UUID."
        test_recipe:
          setup:
            - "Empty database; clock at 2026-08-03T06:00:00Z"
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /stations/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: PlantAdmin
              captures: { err_n1_id: $.data.error_id }
            - call: "GET /suppliers/00000000-0000-4000-8000-0000000000bb"
              payload: {}
              as: PlantAdmin
              captures: { err_n2_id: $.data.error_id }
            - call: "GET /bom-lines/00000000-0000-4000-8000-0000000000cc"
              payload: {}
              as: PlantAdmin
              captures: { err_n3_id: $.data.error_id }
            - call: "GET /delivery-calls/00000000-0000-4000-8000-0000000000dd"
              payload: {}
              as: PlantAdmin
              captures: { err_n4_id: $.data.error_id }
            - call: "GET /shift-plans/00000000-0000-4000-8000-0000000000ee"
              payload: {}
              as: PlantAdmin
              captures: { err_n5_id: $.data.error_id }
            - call: "GET /build-slots/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: PlantAdmin
              captures: { err_n6_id: $.data.error_id }
            - call: "GET /engineering-changes/00000000-0000-4000-8000-000000000011"
              payload: {}
              as: PlantAdmin
              captures: { err_n7_id: $.data.error_id }
            - call: "GET /warranty-returns/00000000-0000-4000-8000-000000000022"
              payload: {}
              as: PlantAdmin
              captures: { err_n8_id: $.data.error_id }
          assert:
            - "All eight triggers: HTTP 404 with response_type 'error', data.error_id set and data.message non-empty"
            - "The eight error_ids are, in order: ERR_STATION_NOT_FOUND, ERR_SUPPLIER_NOT_FOUND, ERR_BOM_LINE_NOT_FOUND, ERR_DELIVERY_CALL_NOT_FOUND, ERR_SHIFT_PLAN_NOT_FOUND, ERR_BUILD_SLOT_NOT_FOUND, ERR_ENGINEERING_CHANGE_NOT_FOUND, ERR_WARRANTY_RETURN_NOT_FOUND"
            - "No response carries a data payload beyond the error object"

      - name: segregation_of_duties_forbids_the_current_submitter_from_deciding
        claim_type: error_reachability
        grounds:
          - errors.ERR_SEGREGATION_OF_DUTIES
          - validations[priority 8] ERR_SEGREGATION_OF_DUTIES
          - entities.EngineeringChange.fields.submitted_by_user_id
        distinguishing_aspect: "The bar is on the CURRENT submitter, not on a fixed author: eng-1 cannot decide its own submission, eng-2 can — and after eng-2 requests a revision and re-submits, eng-2 is the one locked out while eng-1 becomes eligible."
        test_recipe:
          setup:
            - "Base fixture: Line L1 (ST10/ST20), SUP1, P-DOOR-A, WM-X RELEASED with POS-DOOR, ShiftPlan A, slot index 1 PLANNED"
            - "EngineeringChange EC-1 SUBMITTED by eng-1 and moved to UNDER_REVIEW"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - *c_wmx
            - *c_bomx
            - *c_relx
            - *c_ec1
            - *c_ec1_submit
            - &c_ec1_review
              call: "POST /engineering-changes/${ec1_id}/start-review"
              payload: {}
              as: EngineeringLead
              as_user_id: "eng-1"
          trigger:
            - call: "POST /engineering-changes/${ec1_id}/decide"
              payload: { decision: "APPROVE" }
              as: EngineeringLead
              as_user_id: "eng-1"
              captures: { err_sod1_id: $.data.error_id }
            - call: "POST /engineering-changes/${ec1_id}/decide"
              payload: { decision: "REQUEST_REVISION", note: "add the tooling impact" }
              as: EngineeringLead
              as_user_id: "eng-2"
            - call: "POST /engineering-changes/${ec1_id}/submit"
              payload: {}
              as: EngineeringLead
              as_user_id: "eng-2"
            - call: "POST /engineering-changes/${ec1_id}/start-review"
              payload: {}
              as: EngineeringLead
              as_user_id: "eng-2"
            - call: "POST /engineering-changes/${ec1_id}/decide"
              payload: { decision: "APPROVE" }
              as: EngineeringLead
              as_user_id: "eng-2"
              captures: { err_sod2_id: $.data.error_id }
            - call: "POST /engineering-changes/${ec1_id}/decide"
              payload: { decision: "APPROVE" }
              as: EngineeringLead
              as_user_id: "eng-1"
          assert:
            - "Trigger 1: HTTP 403 with error.error_id == ERR_SEGREGATION_OF_DUTIES; status stays UNDER_REVIEW and decided_by_user_id stays null"
            - "Trigger 2: HTTP 200 — status == REVISION_REQUESTED, revision_round == 1, decided_by_user_id == 'eng-2'"
            - "Trigger 3: HTTP 200 — status == SUBMITTED with submitted_by_user_id rewritten to 'eng-2'"
            - "Trigger 5: HTTP 403 with error.error_id == ERR_SEGREGATION_OF_DUTIES — the roles have swapped with the submitter"
            - "Trigger 6: HTTP 200 — status == APPROVED with decided_by_user_id == 'eng-1' and revision_round still 1"

  # ===========================================================================
  - section: rbac
    instances:

      - name: exclusive_operations_are_forbidden_to_every_other_role
        claim_type: role_denial
        grounds:
          - roles[*].exclusive_operations
          - validations[priority 2] ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "The role gate (priority 2) is decided before the path id is resolved (priority 4), so every one of these calls answers 403 ERR_ROLE_NOT_PERMITTED on an id that does not exist — a 404 here would prove the checks run in the wrong order."
        test_recipe:
          setup:
            - "Empty database; clock at 2026-08-03T06:00:00Z. Every path id below is an unknown UUID on purpose."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /build-slots/00000000-0000-4000-8000-000000000101/sequence"
              payload: {}
              as: LineOperator
              captures: { err_r1_id: $.data.error_id }
            - call: "POST /build-slots/00000000-0000-4000-8000-000000000101/release"
