            - "Each store has stage 1 ACTIVE at 0.20 discount and stage 2 ARMED at 0.40 discount over half-open windows [2026-09-15,2026-09-29) and [2026-09-29,2026-10-13)"
            - "The only difference: S-201 stage 1 has sell_through_target_pct 0.25, S-202 stage 1 has 0.30"
            - "Each store has exactly one POSTED sales day of 1,200,000 cents on 300 ORIGINAL units, so realized_sell_through_pct is 0.2500 on both"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
