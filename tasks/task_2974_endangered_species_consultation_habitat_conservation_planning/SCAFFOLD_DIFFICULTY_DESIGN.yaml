# ============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2974 — Endangered Species Consultation & Habitat Conservation Planning
#
# Nine §0.5 rules, 24 instances. Every numeric literal in every `assert:` was
# computed by executing the corresponding §1.3 `formula:` with its `constants:`
# in Python (Decimal, ROUND_HALF_UP) before being written here.
#
# Fixture user ids used by the opaque WildlifeAgency role:
#   fws-user-registrar   — species / critical habitat / bank registry, clock
#   fws-user-reviewer    — information requests and concurrences
#   fws-user-issuer      — biological opinions and permit issuance
#   fws-user-approver    — habitat conservation plan decisions
#   fws-user-adjudicator — monitoring report adjudication
# The segregation-of-duties rules require approver != issuer and
# adjudicator != issuer, which the ids above satisfy.
# ============================================================================
scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: mitigation_preliminary_vs_final_variant_divergence
        grounds:
          - calculations.required_mitigation_units
          - calculations.required_mitigation_units.variants.PRELIMINARY
          - calculations.required_mitigation_units.variants.FINAL
          - entities.HabitatConservationPlan.fields.preliminary_mitigation_units
          - entities.HabitatConservationPlan.fields.final_mitigation_units
          - entities.HabitatConservationPlan.fields.mitigation_delta_units
          - endpoints["POST /project-actions/{id}/habitat-conservation-plans"]
          - endpoints["POST /habitat-conservation-plans/{id}/submit"]
        distinguishing_aspect: >-
          Operates on the HabitatConservationPlan / PresenceDetermination
          acreage domain: the PRELIMINARY variant multiplies the plan's whole
          covered_acres (20.00) by the worst species ratio (3.0) for 60.00
          units, while the FINAL variant rounds per presence-determination row
          with the critical-habitat uplift for 45.00 + 14.70 = 59.70 units. The
          delta is negative (-0.30), so a generator that reuses the
          PRELIMINARY number as the FINAL one is caught by sign, not just by
          magnitude.
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "Species SP-E: ENDANGERED, take_authorization_unit INDIVIDUALS, take_density_per_acre 0.40, recovery_unit_population 4000, survey season months 4..7. One CriticalHabitatUnit CHU-1 with designation_status FINAL in county 06037."
            - "Species SP-T: THREATENED, take_density_per_acre 0.25, recovery_unit_population 9000, survey season months 4..7, no critical habitat."
            - "One ConservationBank covering SP-E, service area [06037], credit_price_cents 250000, credits_total_minted 500.00."
            - "One Proponent and one NON_FEDERAL ProjectAction with footprint_acres 200.00 in county 06037."
            - "PD1: SP-E, FIELD_SURVEY, DETECTED, habitat_overlap_acres 10.00, cites CHU-1, window 2026-05-04..2026-05-08 -> presence_status PRESENT, survey_in_season true."
            - "PD2: SP-T, DATABASE_QUERY, DETECTED, habitat_overlap_acres 7.35, no critical habitat unit -> presence_status PRESUMED_PRESENT."
            - "Effect determination yields overlap_pct 8.68 and LAA, opening a FORMAL consultation; the biological assessment is submitted and the biological opinion is issued (NO_JEOPARDY, authorized_take_units 4.00)."
            - "A HabitatConservationPlan is opened with covered_acres 20.00 and permit_term_years 30, capturing preliminary_mitigation_units."
            - "Two CONSERVATION_BANK_CREDIT commitments of 45.01 and 14.71 units are reserved, so secured_mitigation_units is 59.72 at submission."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /species"
              payload: {scientific_name: "Gopherus agassizii", common_name: "Desert tortoise", listing_status: "ENDANGERED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.40, recovery_unit_population: 4000, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {species_e_id: "$.data.id"}
            - call: "POST /species/${species_e_id}/critical-habitat-units"
              payload: {unit_code: "CHU-1", acres: 500.00, county_code: "06037", designation_status: "FINAL", primary_constituent_elements: ["burrow substrate", "forage cover"]}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {chu1_id: "$.data.id"}
            - call: "POST /species"
              payload: {scientific_name: "Vireo bellii pusillus", common_name: "Least Bell's vireo", listing_status: "THREATENED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.25, recovery_unit_population: 9000, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {species_t_id: "$.data.id"}
            - call: "POST /conservation-banks"
              payload: {bank_name: "Mojave Habitat Bank", covered_species_id: "${species_e_id}", service_area_county_codes: ["06037"], credit_price_cents: 250000, credits_total_minted: 500.00}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {bank_id: "$.data.id"}
            - call: "POST /proponents"
              payload: {org_name: "Sunrise Logistics Park LLC", contact_email: "permits@sunrise-park.example", is_federal_agency: false}
              as: Anonymous
              captures: {proponent_id: "$.data.id"}
            - call: "POST /project-actions"
              payload: {proponent_id: "${proponent_id}", action_name: "Sunrise Park Phase I", action_type: "NON_FEDERAL", footprint_acres: 200.00, county_code: "06037", construction_start_date: "2027-01-01", construction_end_date: "2027-12-31"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {action_id: "$.data.id"}
            - call: "POST /project-actions/${action_id}/presence-determinations"
              payload: {species_id: "${species_e_id}", method: "FIELD_SURVEY", detection_result: "DETECTED", habitat_overlap_acres: 10.00, critical_habitat_unit_id: "${chu1_id}", survey_window_start: "2026-05-04", survey_window_end: "2026-05-08"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {pd1_id: "$.data.id", pd1_status: "$.data.presence_status"}
            - call: "POST /project-actions/${action_id}/presence-determinations"
              payload: {species_id: "${species_t_id}", method: "DATABASE_QUERY", detection_result: "DETECTED", habitat_overlap_acres: 7.35}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {pd2_id: "$.data.id", pd2_status: "$.data.presence_status"}
            - call: "POST /project-actions/${action_id}/effect-determination"
              payload: {}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {consultation_id: "$.data.active_consultation_id", effect: "$.data.effect_determination", pct: "$.data.overlap_pct"}
            - call: "POST /consultations/${consultation_id}/biological-assessment"
              payload: {ba_narrative: "Effects analysis for 17.35 acres of occupied habitat.", ba_effects_analysis_complete: true}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /consultations/${consultation_id}/biological-opinion"
              payload: {}
              as: WildlifeAgency
              as_user_id: "fws-user-issuer"
              captures: {bo_id: "$.data.id", bo_conclusion: "$.data.conclusion", bo_take: "$.data.authorized_take_units"}
            - call: "POST /project-actions/${action_id}/habitat-conservation-plans"
              payload: {plan_name: "Sunrise Park HCP", covered_acres: 20.00, permit_term_years: 30}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {hcp_id: "$.data.id", hcp_v1: "$.data.version", prelim_units: "$.data.preliminary_mitigation_units"}
            - call: "POST /habitat-conservation-plans/${hcp_id}/mitigation-commitments"
              payload: {mechanism: "CONSERVATION_BANK_CREDIT", units: 45.01, expected_hcp_version: "${hcp_v1}", conservation_bank_id: "${bank_id}"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {c1_id: "$.data.id"}
            - call: "GET /habitat-conservation-plans/${hcp_id}"
              payload: {}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {hcp_v2: "$.data.version"}
            - call: "POST /habitat-conservation-plans/${hcp_id}/mitigation-commitments"
              payload: {mechanism: "CONSERVATION_BANK_CREDIT", units: 14.71, expected_hcp_version: "${hcp_v2}", conservation_bank_id: "${bank_id}"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {c2_id: "$.data.id"}
          trigger:
            - call: "POST /habitat-conservation-plans/${hcp_id}/submit"
              payload: {}
              as: Proponent
              as_user_id: "${proponent_id}"
          assert:
            - "the captured ${prelim_units} == 60.00 (PRELIMINARY variant: round_half_up(20.00 * 3.0, 2))"
            - "HabitatConservationPlan.preliminary_mitigation_units == 60.00 in the trigger response, unchanged by submission"
            - "HabitatConservationPlan.final_mitigation_units == 59.70 (FINAL variant: round_half_up(10.00*3.0*1.5, 2) = 45.00 plus round_half_up(7.35*2.0*1.0, 2) = 14.70)"
            - "HabitatConservationPlan.mitigation_delta_units == -0.30"
            - "HabitatConservationPlan.secured_mitigation_units == 59.72"
            - "HabitatConservationPlan.plan_status == 'SUBMITTED'"
            - "HabitatConservationPlan.funding_status == 'UNFUNDED' — submission does not touch the funding dimension"
            - "the captured ${pd1_status} == 'PRESENT' and ${pd2_status} == 'PRESUMED_PRESENT'"

      - name: compliance_standing_rolling_vs_lifetime_variant_divergence
        grounds:
          - calculations.compliance_standing_score
          - calculations.compliance_standing_score.variants.ROLLING_12_MONTH
          - calculations.compliance_standing_score.variants.LIFETIME
          - entities.Proponent.fields.compliance_standing_score
          - entities.Proponent.fields.compliance_variant_applied
          - complexity_profile.consistency_model
          - endpoints["GET /proponents/{id}"]
        distinguishing_aspect: >-
          Operates on the Proponent / MonitoringReport compliance domain, not on
          plan acreage: the SAME two penalty events score 88.50 under
          ROLLING_12_MONTH at clock 2027-06-01 and 91.50 under LIFETIME at clock
          2028-06-01, and the variant flips purely because no report's period_end
          remains inside the 365-day window — no write to any row occurs between
          the two reads.
        test_recipe:
          setup:
            - "The full canonical chain from empty DB to an ACTIVE IncidentalTakePermit: SP-E (ENDANGERED, density 0.40, population 4000, season 4..7) with CHU-1 FINAL in county 06037, SP-T (THREATENED), a bank covering SP-E in county 06037 with 500.00 credits at 250000 cents, a proponent, a NON_FEDERAL action of 200.00 acres in county 06037, PD1 (SP-E FIELD_SURVEY DETECTED 10.00 acres citing CHU-1) and PD2 (SP-T DATABASE_QUERY DETECTED 7.35 acres), effect determination LAA, biological assessment, biological opinion (authorized_take_units 4.00, reinitiation_trigger_units 3.60), an HCP with covered_acres 20.00 and permit_term_years 30, commitments of 45.01 and 14.71 bank credits, a funding assurance of 5026514 cents, submission, APPROVE by fws-user-approver, and permit issuance by fws-user-issuer with term_start 2026-10-01."
            - "MonitoringReport R1 covers [2026-10-01, 2026-10-31) with take_units_reported 1.00, is submitted at clock 2026-11-20 (due_at 2026-12-15, so is_late false) and is then REJECTED by fws-user-adjudicator at the same clock — a REJECTED_REPORT penalty of weight 11 dated 2026-11-20."
            - "MonitoringReport R2 covers [2027-01-01, 2027-03-31) with take_units_reported 1.00, is submitted at clock 2027-05-20 (due_at 2027-05-15, so is_late true) and is ACCEPTED — a LATE_REPORT penalty of weight 6 dated 2027-05-20."
            - "The clock is moved to 2027-06-01 and the proponent is read once, capturing the ROLLING_12_MONTH result; the clock is then moved to 2028-06-01 with no intervening write."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /species"
              payload: {scientific_name: "Gopherus agassizii", common_name: "Desert tortoise", listing_status: "ENDANGERED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.40, recovery_unit_population: 4000, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {species_e_id: "$.data.id"}
            - call: "POST /species/${species_e_id}/critical-habitat-units"
              payload: {unit_code: "CHU-1", acres: 500.00, county_code: "06037", designation_status: "FINAL", primary_constituent_elements: ["burrow substrate", "forage cover"]}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {chu1_id: "$.data.id"}
            - call: "POST /species"
              payload: {scientific_name: "Vireo bellii pusillus", common_name: "Least Bell's vireo", listing_status: "THREATENED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.25, recovery_unit_population: 9000, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {species_t_id: "$.data.id"}
            - call: "POST /conservation-banks"
              payload: {bank_name: "Mojave Habitat Bank", covered_species_id: "${species_e_id}", service_area_county_codes: ["06037"], credit_price_cents: 250000, credits_total_minted: 500.00}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {bank_id: "$.data.id"}
            - call: "POST /proponents"
              payload: {org_name: "Sunrise Logistics Park LLC", contact_email: "permits@sunrise-park.example", is_federal_agency: false}
              as: Anonymous
              captures: {proponent_id: "$.data.id"}
            - call: "POST /project-actions"
              payload: {proponent_id: "${proponent_id}", action_name: "Sunrise Park Phase I", action_type: "NON_FEDERAL", footprint_acres: 200.00, county_code: "06037", construction_start_date: "2027-01-01", construction_end_date: "2027-12-31"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {action_id: "$.data.id"}
            - call: "POST /project-actions/${action_id}/presence-determinations"
              payload: {species_id: "${species_e_id}", method: "FIELD_SURVEY", detection_result: "DETECTED", habitat_overlap_acres: 10.00, critical_habitat_unit_id: "${chu1_id}", survey_window_start: "2026-05-04", survey_window_end: "2026-05-08"}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /project-actions/${action_id}/presence-determinations"
              payload: {species_id: "${species_t_id}", method: "DATABASE_QUERY", detection_result: "DETECTED", habitat_overlap_acres: 7.35}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /project-actions/${action_id}/effect-determination"
              payload: {}
