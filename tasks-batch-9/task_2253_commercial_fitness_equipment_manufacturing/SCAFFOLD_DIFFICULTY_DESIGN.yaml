      trigger:
      - call: POST /test-runs
        payload: {model_revision_id: '${r1}', test_rig_id: '${g1}', window_start: '2026-08-06T00:00:00Z', window_end: '2026-08-10T00:00:00Z', target_cycles: 300000}
