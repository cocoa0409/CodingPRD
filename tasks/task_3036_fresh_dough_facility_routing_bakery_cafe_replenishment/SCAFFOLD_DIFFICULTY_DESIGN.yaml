  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cafe_version_returns_to_baseline_after_amend_cycle
        grounds:
          - concurrency_rules[order-write-stale-cafe]
          - state_machines.CafeOrder.SUBMITTED_to_DRAFT
          - entities.Cafe.fields.credit_balance_cents
        distinguishing_aspect: |
          Conserved quantity = Cafe.version parity per completed mutation cycle:
          create(+1) + submit(+1) + amend(+1) + cancel(+1) leaves
          credit_balance_cents at its pre-cycle value (0) — a forward order
          flow paired with its compensating cancel conserves the ledger.
        test_recipe:
          setup:
            - "F1, CXL, C1 (FRANCHISE 90000) exist; clock before cutoff"
          setup_api_calls:
            - call: "POST /dough-ops/facilities"
              payload: { name: "F1", effective_capacity_units: 2000 }
              as: FacilityPlanner
              captures: { f1_id: $.data.id }
            - call: "POST /dough-ops/dough-types"
              payload: { code: "CXL", category: "CONVENTIONAL", shelf_life_hours: 36, order_cutoff_local: "13:00", substitution_allowed: false, flat_transfer_price: 4.00 }
              as: FacilityPlanner
              captures: { cxl_id: $.data.id }
            - call: "POST /dough-ops/cafes"
              payload: { name: "C1", facility_id: "${f1_id}", ownership_type: "FRANCHISE", credit_limit_cents: 90000 }
              as: FacilityPlanner
              captures: { c1_id: $.data.id, c1_v0: $.data.version }
            - call: "POST /dough-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T10:00:00Z" }
              as: FacilityPlanner
            - call: "POST /dough-ops/cafe-orders"
              payload: { cafe_id: "${c1_id}", dough_type_id: "${cxl_id}", production_date: "2026-09-10", quantity: 100, expected_cafe_version: "${c1_v0}" }
              as: CafeManager
              as_user_id: "${c1_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /dough-ops/cafe-orders/${o1_id}/submit"
              payload: {}
              as: CafeManager
              as_user_id: "${c1_id}"
            - call: "GET /dough-ops/cafes/${c1_id}"
              payload: {}
              as: FacilityPlanner
              captures: { c1_v1: $.data.version }
          trigger:
            - call: "POST /dough-ops/cafe-orders/${o1_id}/amend"
              payload: { quantity: 80, expected_cafe_version: "${c1_v1}" }
              as: CafeManager
              as_user_id: "${c1_id}"
            - call: "POST /dough-ops/cafe-orders/${o1_id}/cancel"
              payload: {}
              as: CafeManager
              as_user_id: "${c1_id}"
            - call: "GET /dough-ops/cafes/${c1_id}"
              payload: {}
              as: FacilityPlanner
              captures: { c1_v_final: $.data.version, c1_bal_final: $.data.credit_balance_cents }
          assert:
            - "Cafe.${c1_id}.credit_balance_cents == 0   # forward create+submit+amend compensated by cancel leaves the ledger unchanged"
            - "Cafe.${c1_id}.version == ${c1_v0} + 4     # four mutations (create, submit, amend, cancel) each bumped version exactly once"
            - "CafeOrder.${o1_id}.status == CANCELLED"

      - name: production_plan_effective_units_zero_after_route_cancel
        grounds:
          - state_machines.DeliveryRoute.PUBLISHED_to_CANCELLED
          - calculations.effective_units
          - state_machines.ProductionPlan
        distinguishing_aspect: |
          Conserved quantity = ProductionPlan.total_effective_units net change:
          a route cancel that cascades all attached orders to CANCELLED must
          leave the plan's effective-units invariant (total_effective_units
          recomputes to 0) — forward plan-populate paired with the compensating
          route cancel conserves capacity.
        test_recipe:
          setup:
            - "Plan for 2026-09-11 with C3 50 BMT and C5 150 CXL + 60 BMT attached (total eff = 50x2 + 150 + 60x2 = 370)"
            - "plan locked, released, route PUBLISHED with the two stops"
          setup_api_calls:
            - call: "POST /dough-ops/facilities"
              payload: { name: "F1", effective_capacity_units: 2000 }
              as: FacilityPlanner
              captures: { f1_id: $.data.id }
            - call: "POST /dough-ops/dough-types"
              payload: { code: "CXL", category: "CONVENTIONAL", shelf_life_hours: 36, order_cutoff_local: "13:00", substitution_allowed: false, flat_transfer_price: 4.00 }
              as: FacilityPlanner
              captures: { cxl_id: $.data.id }
            - call: "POST /dough-ops/dough-types"
              payload: { code: "BMT", category: "ARTISAN", shelf_life_hours: 48, order_cutoff_local: "18:00", substitution_allowed: false, flat_transfer_price: 5.00 }
              as: FacilityPlanner
              captures: { bmt_id: $.data.id }
            - call: "POST /dough-ops/cafes"
