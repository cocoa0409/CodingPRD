# =============================================================================
# PRD Benchmark Scaffold — task_3053
# Custody Platform for Registered Investment Advisers & Advisor Transition
# (Schwab Advisor Services-style RIA custody back office)
# =============================================================================

scenario: |
  Custody Platform for Registered Investment Advisers & Advisor Transition (Schwab Advisor
  Services): advisor firm onboarding with custody agreements, entitlements and trading
  authorization, book transition from a prior firm with bulk account opening, asset transfer
  and cost-basis carryover, model portfolio management with block trading and average-price
  allocation across household accounts, advisory fee billing computed on custodied balances
  with tiered schedules and household aggregation, alternative asset custody and valuation
  acceptance, client authorization for money movement with standing instruction verification,
  advisor technology integration entitlements and data feed provisioning, custody rule
  compliance evidence and independent examination support

domain_name: custody-ria-advisor-transition
api_prefix: /ria

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - optimistic_concurrency
    - bulk_operations
    - derived_field_reconciliation
    - selector_policy
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_target: expert
  entity_count: 23
  state_machine_count: 14
  calculation_count: 11
  validation_count: 50
  endpoint_count: 131
  error_code_count: 50
  role_count: 7
  concurrency_rule_count: 3

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (23 entities; flat topology with cross-aggregate FKs)
# =============================================================================
entities:

  # ---------------------------------------------------------------------------
  - name: AdvisorFirm
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered investment adviser legal entity name"
        constraints: "required; unique among non-ARCHIVED firms"
      - name: crd_number
        type: string
        source: input
        description: "Investment adviser CRD registration number"
        constraints: "required; unique among non-ARCHIVED firms"
      - name: home_state_code
        type: string
        source: input
        description: "Two-letter state of the firm's principal office"
      - name: custody_agreement_status
        type: enum
        source: computed
        description: "PENDING | EXECUTED | SUPERSEDED | TERMINATED"
        constraints: "PENDING | EXECUTED | SUPERSEDED | TERMINATED"
      - name: firm_posture
        type: enum
        source: computed
        description: "Derived posture gating child operations: OPEN | LIMITED | SUSPENDED | FROZEN"
        constraints: "OPEN | LIMITED | SUSPENDED | FROZEN"
      - name: posture_reason_code
        type: string
        source: computed
        description: "Machine code for the currently binding posture rule (e.g. CUSTODY_AGREEMENT_NOT_EXECUTED)"
      - name: agreement_executed_at
        type: datetime
        source: system
        description: "Server-stamped instant the custody agreement was countersigned; null while PENDING"
      - name: supervision_evidence_status
        type: enum
        source: computed
        description: "Aggregate of the firm's CustodyRulesEvidence rollup: CLEAR | DEFICIENT | UNKNOWN"
        constraints: "CLEAR | DEFICIENT | UNKNOWN"
      - name: entitlement_count
        type: integer
        source: computed
        description: "Count of AdvisorFirmEntitlements in state GRANTED"
      - name: household_fee_basis_total_cents
        type: integer
        source: computed
        description: "Sum of C1 household_fee_basis_cents over the firm's Households (derived reconciliation target)"

  # ---------------------------------------------------------------------------
  - name: CustodyAgreement
    parent: AdvisorFirm
    common_fields: true
    fields:
      - name: firm_id
        type: string
        source: system
        description: "FK -> AdvisorFirm.id; the firm whose custody arrangement this agreement records"
      - name: agreement_status
        type: enum
        source: system
        description: "DRAFT | PENDING_SIGNATURE | EXECUTED | SUPERSEDED | TERMINATED"
        constraints: "DRAFT | PENDING_SIGNATURE | EXECUTED | SUPERSEDED | TERMINATED"
      - name: adviser_crd_number
        type: string
        source: input
        description: "CRD number the adviser attests on the agreement; must equal AdvisorFirm.crd_number"
      - name: drafted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the officer who drafted the agreement (segregation-of-duties record)"
      - name: executed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the officer who countersigned; MUST differ from drafted_by_user_id (SoD)"
      - name: signed_at
        type: datetime
        source: system
        description: "Server-stamped countersignature instant"
      - name: countersignature_hash
        type: string
        source: system
        description: "Server-minted tamper-evidence token minted at EXECUTED, surfacing in the examination bundle"
      - name: superseded_by_agreement_id
        type: string
        source: system
        description: "reference to the successor CustodyAgreement in the same firm (self-referential link), null unless SUPERSEDED"

  # ---------------------------------------------------------------------------
  - name: AdvisorFirmEntitlement
    parent: AdvisorFirm
    common_fields: true
    fields:
      - name: firm_id
        type: string
        source: system
        description: "FK -> AdvisorFirm.id; owning firm"
      - name: entitlement_code
        type: enum
        source: input
        description: "TRADING_AUTHORIZATION | MONEY_MOVEMENT | MODEL_MANAGEMENT | BILLING | ALTERNATIVE_ASSETS | DATA_FEED | API_ACCESS"
        constraints: "TRADING_AUTHORIZATION | MONEY_MOVEMENT | MODEL_MANAGEMENT | BILLING | ALTERNATIVE_ASSETS | DATA_FEED | API_ACCESS"
      - name: requested_custody_agreement_id
        type: string
        source: input
        description: "FK -> CustodyAgreement.id; the agreement the firm claims authorizes this entitlement"
      - name: entitlement_status
        type: enum
        source: system
        description: "REQUESTED | GRANTED | SUSPENDED | REVOKED"
        constraints: "REQUESTED | GRANTED | SUSPENDED | REVOKED"
      - name: effective_from
        type: datetime
        source: system
        description: "Instant entitlement became GRANTED; null while REQUESTED"
      - name: payload_integrity_verified
        type: boolean
        source: computed
        description: "True iff this entitlement's requested_custody_agreement_id equals the firm's CURRENT EXECUTED agreement id"

  # ---------------------------------------------------------------------------
  - name: Household
    parent: AdvisorFirm
    common_fields: true
    fields:
      - name: firm_id
        type: string
        source: system
        description: "FK -> AdvisorFirm.id; servicing firm"
      - name: household_name
        type: string
        source: input
        description: "Display name of the client household (billing aggregation unit)"
      - name: household_status
        type: enum
        source: system
        description: "ACTIVE | BILLING_HELD | CLOSED"
        constraints: "ACTIVE | BILLING_HELD | CLOSED"
      - name: household_fee_basis_cents
        type: integer
        source: computed
        description: "C1: sum of account_fee_basis_cents over Household.accounts whose account_status is in {OPEN, FROZEN}"
      - name: household_annual_fee_cents
        type: integer
        source: computed
        description: "C2 household-aggregated annual advisory fee in cents"
      - name: billing_period_number
        type: integer
        source: computed
        description: "Last settled billing period index (0 before the first settlement)"

  # ---------------------------------------------------------------------------
  - name: HouseholdAccount
    parent: Household
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: system
        description: "FK -> Household.id; owning household"
      - name: firm_id
        type: string
        source: system
        description: "FK -> AdvisorFirm.id; servicing firm (denormalized for firm-level reads)"
      - name: account_number
        type: string
        source: input
        description: "Custody account number"
        constraints: "required; unique among non-CLOSED accounts within the firm"
      - name: account_type
        type: enum
        source: input
        description: "INDIVIDUAL | JOINT | TRUST | IRA | ROTH_IRA | ENTITY"
        constraints: "INDIVIDUAL | JOINT | TRUST | IRA | ROTH_IRA | ENTITY"
      - name: account_status
        type: enum
        source: system
        description: "PENDING | OPEN | FROZEN | CLOSED"
        constraints: "PENDING | OPEN | FROZEN | CLOSED"
      - name: market_value_cents
        type: integer
        source: computed
        description: "Sum over the account's incumbent TransferLot rows applied to it of (quantity_micros * valuation_price_micros) / 10000000000"
      - name: account_fee_basis_cents
        type: integer
        source: computed
        description: "Sum over the account's positions of MAX(market_value_cents_of_position, cost_basis_cents_of_position) — C1"
      - name: billable
        type: boolean
        source: computed
        description: "True iff account_type is in {INDIVIDUAL, JOINT, TRUST, IRA, ROTH_IRA}; ENTITY accounts are custody-only and never billable"
      - name: householding_consent
        type: enum
        source: input
        description: "OP_IN | OP_OUT | NONE — whether the client consented to household-aggregated fee tiers"
        constraints: "OP_IN | OP_OUT | NONE"
      - name: last_listed_cents
        type: integer
        source: computed
        description: "market_value_cents recomputed by the most recent POST /accounts/{id}/list (derived reconciliation target)"
      - name: last_listed_at
        type: datetime
        source: system
        description: "Server-stamped instant of the most recent listing run"
      - name: model_portfolio_id
        type: string
        source: system
        description: "FK -> ModelPortfolio.id; assigned model, null until assignment"
      - name: billed_period_count
        type: integer
        source: computed
        description: "Number of settled billing periods in which this account was included in a fee basis"

  # ---------------------------------------------------------------------------
  - name: AssetTransfer
    parent: HouseholdAccount
    common_fields: true
    fields:
      - name: receiving_account_id
        type: string
        source: system
        description: "FK -> HouseholdAccount.id; the custody account receiving the transferred assets"
      - name: firm_id
        type: string
        source: system
        description: "FK -> AdvisorFirm.id; the receiving firm"
      - name: transfer_status
        type: enum
        source: system
        description: "REQUESTED | SUBMITTED | RECEIVED | REJECTED | BASIS_REVIEW | CREDITED"
        constraints: "REQUESTED | SUBMITTED | RECEIVED | REJECTED | BASIS_REVIEW | CREDITED"
      - name: delivering_firm_name
        type: string
        source: input
        description: "Name of the prior custodian/advisor firm delivering the assets"
      - name: method
        type: enum
        source: input
        description: "ACAT | DIRECT_ROLLOVER | DTC_NON_ACAT"
        constraints: "ACAT | DIRECT_ROLLOVER | DTC_NON_ACAT"
      - name: sent_basis_confidence
        type: enum
        source: computed
        description: "C6 carryover grade: HIGH | MEDIUM | LOW | NONE"
      - name: carryover_cents
        type: integer
        source: computed
        description: "C6 cost basis actually carried to the receiving positions"
      - name: cost_basis_complete
        type: boolean
        source: computed
        description: "True when every received position was stamped with a HIGH-confidence basis"
      - name: rejected_reason_code
        type: string
        source: input
        description: "Free-form reason recorded on REJECTED transfers"
      - name: credited_at
        type: datetime
        source: system
        description: "Server-stamped instant assets were credited into the receiving account"

  # ---------------------------------------------------------------------------
  - name: TransferLot
    parent: AssetTransfer
    common_fields: true
    fields:
      - name: transfer_id
        type: string
        source: system
        description: "FK -> AssetTransfer.id; parent transfer"
      - name: symbol
        type: string
        source: input
        description: "Security ticker symbol of the incoming lot"
      - name: quantity_micros
        type: integer
        source: input
        description: "Quantity in micro-units (1 share = 1000000)"
      - name: sent_cost_basis_cents
        type: integer
        source: input
        description: "Cost basis reported by the delivering firm; null when the delivering firm sent no basis"
      - name: lot_inventory_date
        type: datetime
        source: input
        description: "Original acquisition date of the lot at the delivering firm"
      - name: valuation_price_micros
        type: integer
        source: input
        description: "Custodian valuation price for this lot in micros of one cent (1 US cent = 10000 micros); drives the account's market value"
      - name: basis_appraisal_cents
        type: integer
        source: computed
        description: "C5 accepted basis value; null until the transfer reaches BASIS_REVIEW and is accepted"
      - name: suspected_double_basis
        type: boolean
        source: computed
        description: "True iff this lot looks like an ACAT full-account transfer whose basis was already delivered under an earlier transfer"
      - name: basis_confidence_grade
        type: enum
        source: computed
        description: "HIGH | MEDIUM | LOW | NONE — this lot's contribution to C6 carryover grading"
        constraints: "HIGH | MEDIUM | LOW | NONE"

  # ---------------------------------------------------------------------------
  - name: ModelPortfolio
    parent: AdvisorFirm
    common_fields: true
    fields:
      - name: firm_id
        type: string
        source: system
        description: "FK -> AdvisorFirm.id; owning firm"
      - name: model_name
        type: string
        source: input
        description: "Model portfolio display name"
      - name: model_status
        type: enum
        source: system
        description: "DRAFT | APPROVED | REBALANCING | ACTIVE | ARCHIVED"
        constraints: "DRAFT | APPROVED | REBALANCING | ACTIVE | ARCHIVED"
      - name: approval_round_number
        type: integer
        source: system
        description: "Count of approval submissions; increments on each APPROVED -> REBALANCING rework cycle (cyclic machine)"
      - name: drift_approved_at
        type: datetime
        source: system
        description: "Server-stamped instant the currently APPROVED version was approved"
      - name: target_weight_total_bps
        type: integer
        source: computed
        description: "Sum of target_weight_bps over the model's target lines (must equal 10000 at approval)"

  # ---------------------------------------------------------------------------
  - name: ModelTarget
    parent: ModelPortfolio
    common_fields: true
    fields:
      - name: model_id
        type: string
        source: system
        description: "FK -> ModelPortfolio.id; parent model"
      - name: symbol
        type: string
        source: input
        description: "Target security ticker"
        constraints: "unique per model"
      - name: target_weight_bps
        type: integer
        source: input
        description: "Target weight in basis points; the model's target lines MUST sum to exactly 10000 at approval time"

  # ---------------------------------------------------------------------------
  - name: BlockOrder
    parent: AdvisorFirm
    common_fields: true
    fields:
      - name: firm_id
        type: string
        source: system
        description: "FK -> AdvisorFirm.id; executing firm"
      - name: model_id
        type: string
        source: system
        description: "FK -> ModelPortfolio.id; the approved model this block implements"
      - name: symbol
        type: string
        source: input
        description: "Executed security ticker"
      - name: side
        type: enum
        source: input
        description: "BUY | SELL"
        constraints: "BUY | SELL"
      - name: total_requested_share_micros
        type: integer
        source: computed
        description: "Sum of requested_share_micros across this block's allocations"
      - name: executed_share_micros
        type: integer
        source: input
        description: "Total shares actually executed at the desk; may differ from the requested total (partial fill)"
      - name: execution_price_micros
        type: integer
        source: input
        description: "Single execution price in micros of one cent (i.e. 1 US cent = 10000 micros)"
      - name: block_status
        type: enum
        source: system
        description: "DRAFT | SUBMITTED | EXECUTED | ALLOCATED | SETTLED | UNALLOCATED"
        constraints: "DRAFT | SUBMITTED | EXECUTED | ALLOCATED | SETTLED | UNALLOCATED"
      - name: unallocated_share_micros
        type: integer
        source: computed
        description: "executed_share_micros minus the sum of allocation share_micros; MUST be 0 for ALLOCATED"
      - name: preview_notional_cents
        type: integer
        source: computed
        description: "C3 ROUND_THEN_ALLOCATE indicative figure: round_half_up(executed_share_micros * execution_price_micros / 10000000000), written by POST /ria/block-orders/{id}/allocation-preview; null until a preview runs"

  # ---------------------------------------------------------------------------
  - name: BlockAllocation
    parent: BlockOrder
    common_fields: true
    fields:
      - name: block_order_id
        type: string
        source: system
        description: "FK -> BlockOrder.id; parent block"
      - name: account_id
        type: string
        source: system
        description: "FK -> HouseholdAccount.id; the account receiving (BUY) or delivering (SELL) shares"
      - name: requested_share_micros
        type: integer
        source: input
        description: "Shares the account asked for before the fill was known"
      - name: share_micros
        type: integer
        source: computed
        description: "Shares allocated by C3; null until the block is ALLOCATED"
      - name: allocation_rank
        type: integer
        source: input
        description: "Client-supplied deterministic tie-break rank; lower rank wins a leftover share"
        constraints: "unique per block order"
      - name: allocated_cost_cents
        type: integer
        source: computed
        description: "C3: allocated-cost-basis after rounding share_micros * execution_price_micros"
      - name: average_price_micros
        type: integer
        source: computed
        description: "C3: allocated_cost_cents * 10000 / share_micros, rounded half-up to micros"
      - name: fee_rebate_cents
        type: integer
        source: computed
        description: "Execution-credit credited to this allocation when C4 finds it was over-allocated"
      - name: allocation_status
        type: enum
        source: system
        description: "PENDING | ALLOCATED | REBATED | SETTLED"
        constraints: "PENDING | ALLOCATED | REBATED | SETTLED"

  # ---------------------------------------------------------------------------
  - name: FeeBillingRun
    parent: AdvisorFirm
    common_fields: true
    fields:
      - name: firm_id
        type: string
        source: system
        description: "FK -> AdvisorFirm.id; billed firm"
      - name: household_id
        type: string
        source: system
        description: "FK -> Household.id; billed household"
      - name: period_start_date
        type: datetime
        source: input
        description: "Inclusive start of the billing period"
      - name: period_end_date
        type: datetime
        source: input
        description: "Exclusive end of the billing period (half-open [start, end) interval)"
      - name: period_days
        type: integer
        source: computed
        description: "period_end_date - period_start_date in whole days; the pro-ration denominator"
      - name: billing_run_status
        type: enum
        source: system
        description: "SETTLED | INVOICE_MISMATCH | REOPENED | VOIDED"
        constraints: "SETTLED | INVOICE_MISMATCH | REOPENED | VOIDED"
      - name: fee_basis_snapshot_cents
        type: integer
        source: system
        description: "C1 household fee basis captured at settlement; the invoice is later reconciled against it"
      - name: fee_variant_used
        type: enum
        source: input
        description: "HOUSEHOLD_AGGREGATED | PER_ACCOUNT — which C2 variant the invoice was computed under"
        constraints: "HOUSEHOLD_AGGREGATED | PER_ACCOUNT"
      - name: gross_fee_cents
        type: integer
        source: computed
        description: "C2 result: annual fee pro-rated to period_days, rounded half-up after pro-ration"
      - name: credit_applied_cents
        type: integer
        source: computed
        description: "Sum of fee credits whose credit_status is AVAILABLE under the pinned selector"
      - name: net_fee_cents
        type: integer
        source: computed
        description: "gross_fee_cents - credit_applied_cents"
      - name: stated_invoice_cents
        type: integer
        source: input
        description: "Amount the adviser stated on its remitted invoice; compared against the recomputed net fee"
      - name: settlement_evidence_hash
        type: string
        source: system
        description: "Server-minted evidence token minted at SETTLED; surfaces in the examination bundle"

  # ---------------------------------------------------------------------------
  - name: FeeCredit
    parent: Household
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: system
        description: "FK -> Household.id; household the credit belongs to"
      - name: credit_cents
        type: integer
        source: input
        description: "Credit amount in cents"
      - name: earned_on_date
        type: datetime
        source: system
        description: "Server-stamped issue instant; the pin order for C2's credit selector"
      - name: credit_status
        type: enum
        source: system
        description: "AVAILABLE | PARTIALLY_APPLIED | APPLIED"
        constraints: "AVAILABLE | PARTIALLY_APPLIED | APPLIED"
      - name: applied_to_billing_run_id
        type: string
        source: system
        description: "FK -> FeeBillingRun.id; the run that consumed this credit, null while AVAILABLE"

  # ---------------------------------------------------------------------------
  - name: AlternativeAssetHolding
    parent: HouseholdAccount
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: system
        description: "FK -> HouseholdAccount.id; the custody account holding the interest"
      - name: asset_name
        type: string
        source: input
        description: "Partnership / fund display name"
      - name: asset_acceptance_status
        type: enum
        source: system
        description: "PENDING | UNDER_REVIEW | ACCEPTED | REJECTED"
        constraints: "PENDING | UNDER_REVIEW | ACCEPTED | REJECTED"
      - name: unit_count
        type: integer
        source: input
        description: "Number of units / interests held"
      - name: stated_value_cents
        type: integer
        source: input
        description: "Value the adviser supplied; never used directly for billing"
      - name: accepted_value_cents
        type: integer
        source: computed
        description: "C4 haircut value admitted into the fee basis; null until ACCEPTED or REJECTED"
      - name: haircut_pct
        type: integer
        source: computed
        description: "C4 haircut in basis points actually applied"
      - name: valuation_floor_cents
        type: integer
        source: input
        description: "Per-holding floor; accepted value never falls below it"
      - name: valuation_as_of_date
        type: datetime
        source: input
        description: "As-of date the stated value represents"
      - name: valuation_age_days
        type: integer
        source: computed
        description: "current_utc - valuation_as_of_date in whole days; drives the C4 staleness branch"
      - name: stale_valuation
        type: boolean
        source: computed
        description: "True iff valuation_age_days > 270; forces the account's alternative holdings to be excluded from C1"
      - name: fee_basis_eligible
        type: boolean
        source: computed
        description: "True iff accepted_value_cents is non-null AND stale_valuation is false"

  # ---------------------------------------------------------------------------
  - name: MoneyMovementInstruction
    parent: HouseholdAccount
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: system
        description: "FK -> HouseholdAccount.id; account the money moves from"
      - name: standing_instruction_id
        type: string
        source: system
        description: "FK -> StandingInstruction.id; the verified instruction that authorizes this movement"
      - name: amount_cents
        type: integer
        source: input
        description: "Amount to move in cents; must satisfy the standing instruction's periodic limit"
      - name: movement_type
        type: enum
        source: input
        description: "ACH_DISBURSEMENT | WIRE | JOURNAL | CHECK"
        constraints: "ACH_DISBURSEMENT | WIRE | JOURNAL | CHECK"
      - name: movement_status
        type: enum
        source: system
        description: "DRAFT | PENDING_AUTHORIZATION | AUTHORIZED | REJECTED | CANCELLED | COMPLETED"
        constraints: "DRAFT | PENDING_AUTHORIZATION | AUTHORIZED | REJECTED | CANCELLED | COMPLETED"
      - name: authorization_note
        type: string
        source: input
        description: "Client-supplied authorization note; blank notes fail C7 verification"
      - name: jurisdiction_withholding_required
        type: boolean
        source: computed
        description: "True when C7's dominant-rule selector finds a binding jurisdiction restriction for this account type"
      - name: withheld_cents
        type: integer
        source: computed
        description: "C7: amount retained to satisfy jurisdiction withholding"
      - name: net_disbursed_cents
        type: integer
        source: computed
        description: "amount_cents - withheld_cents"

  # ---------------------------------------------------------------------------
  - name: StandingInstruction
    parent: HouseholdAccount
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: system
        description: "FK -> HouseholdAccount.id; account the instruction governs"
      - name: instruction_type
        type: enum
        source: input
        description: "THIRD_PARTY_DISBURSEMENT | WIRE | JOURNAL"
        constraints: "THIRD_PARTY_DISBURSEMENT | WIRE | JOURNAL"
      - name: payee_name
        type: string
        source: input
        description: "Named payee; third-party disbursement requires a payee different from the household's primary"
      - name: periodic_limit_cents
        type: integer
        source: input
        description: "Maximum aggregate movement per billing period across all instructions on the account"
      - name: verification_status
        type: enum
        source: system
        description: "PENDING | VERIFIED | EXPIRED | REVOKED"
        constraints: "PENDING | VERIFIED | EXPIRED | REVOKED"
        constraints: "PENDING | VERIFIED | EXPIRED | REVOKED"
      - name: verification_token
        type: string
        source: system
        description: "Server-issued client verification token returned at creation; consumed by POST /standing-instructions/{id}/verify"
      - name: verified_at
        type: datetime
        source: system
        description: "Server-stamped instant the client verified the instruction; null while PENDING"
      - name: round_trip_days
        type: integer
        source: computed
        description: "current_utc - verified_at in whole days; EXPIRED once it reaches 7"
      - name: consumed_period_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over this account's movements in movement_status in {AUTHORIZED, COMPLETED} within the current billing period"

  # ---------------------------------------------------------------------------
  - name: CustodyRulesEvidence
    parent: AdvisorFirm
    common_fields: true
    fields:
      - name: firm_id
        type: string
        source: system
        description: "FK -> AdvisorFirm.id; audited firm"
      - name: requirement_code
        type: enum
        source: input
        description: "QUALIFIED_CUSTODIAN | SURPRISE_EXAMINATION | CLIENT_NOTIFICATION | TWO_PARTY_AUTHORIZATION | FEE_DISCLOSURE | ANNUAL_ATTESTATION | STANDING_INSTRUCTION_AUTHORIZATION | FEE_CREDIT_DISCLOSURE"
        constraints: "QUALIFIED_CUSTODIAN | SURPRISE_EXAMINATION | CLIENT_NOTIFICATION | TWO_PARTY_AUTHORIZATION | FEE_DISCLOSURE | ANNUAL_ATTESTATION | STANDING_INSTRUCTION_AUTHORIZATION | FEE_CREDIT_DISCLOSURE"
      - name: requirement_status
        type: enum
        source: system
        description: "PENDING | SUBMITTED | ACCEPTED | DEFICIENT | WAIVED | LAPSED"
        constraints: "PENDING | SUBMITTED | ACCEPTED | DEFICIENT | WAIVED | LAPSED"
      - name: critical
        type: boolean
        source: input
        description: "True when a DEFICIENT verdict on this evidence SUSPENDS the firm posture"
      - name: drafted_by_user_id
        type: string
        source: system
        description: "X-User-ID that submitted the evidence package"
      - name: accepted_by_user_id
        type: string
        source: system
        description: "X-User-ID that accepted it; MUST differ from drafted_by_user_id (segregation of duties)"
      - name: evidence_document_hash
        type: string
        source: system
        description: "Server-minted document hash minted at ACCEPTED; required in the examination bundle"
      - name: submitted_at
        type: datetime
        source: system
        description: "Server-stamped submission instant"
      - name: evidence_round_number
        type: integer
        source: computed
        description: "Correction rounds consumed; starts at 0 and increments on every SUBMITTED -> DEFICIENT transition. A row at 4 may not be resubmitted."

  # ---------------------------------------------------------------------------
  - name: DataFeedProvision
    parent: AdvisorFirm
    common_fields: true
    fields:
      - name: firm_id
        type: string
        source: system
        description: "FK -> AdvisorFirm.id; entitled firm"
      - name: feed_type
        type: enum
        source: input
        description: "POSITIONS | TRANSACTIONS | BALANCES | FEES | ALTERNATIVES"
        constraints: "POSITIONS | TRANSACTIONS | BALANCES | FEES | ALTERNATIVES"
      - name: provision_status
        type: enum
        source: system
        description: "REQUESTED | ACTIVE | THROTTLED | REVOKED"
        constraints: "REQUESTED | ACTIVE | THROTTLED | REVOKED"
      - name: provisioned_records_count
        type: integer
        source: computed
        description: "Running count of records delivered on this feed; increments per pull"
      - name: delivery_endpoint_host
        type: string
        source: input
        description: "Destination host the feed is delivered to"
      - name: throttle_reason_code
        type: string
        source: computed
        description: "Set when the feed is THROTTLED (e.g. DATABASE_INVARIANT_CHAIN_BROKEN)"
      - name: last_delivered_at
        type: datetime
        source: system
        description: "Server-stamped instant of the most recent successful delivery"
      - name: delivered_count
        type: integer
        source: computed
        description: "Number of records delivered by the most recent pull; 0 before the first pull"

  # ---------------------------------------------------------------------------
  - name: OnboardingBatch
    parent: AdvisorFirm
    common_fields: true
    fields:
      - name: firm_id
        type: string
        source: system
        description: "FK -> AdvisorFirm.id; firm whose book transition this batch drives"
      - name: batch_kind
        type: enum
        source: input
        description: "ACCOUNTS | TRANSFERS | LOTS | EVIDENCE — selects with which materially different row shape the batch describes the book transition"
        constraints: "ACCOUNTS | TRANSFERS | LOTS | EVIDENCE"
      - name: batch_status
        type: enum
        source: system
        description: "CREATED | DISPATCHED | COMPLETED"
        constraints: "CREATED | DISPATCHED | COMPLETED"
      - name: chunk_size
        type: integer
        source: input
        description: "Items materialised per dispatch chunk; defaults to the whole batch"
      - name: requested_item_count
        type: integer
        source: computed
        description: "Number of items in the submitted batch"
      - name: dispatched_item_count
        type: integer
        source: computed
        description: "Number of items actually materialised; a repeated dispatch skips rows whose natural key already exists, so this value is stable across retries"
      - name: skipped_duplicate_count
        type: integer
        source: computed
        description: "Items skipped as duplicates on the most recent dispatch"

  # ---------------------------------------------------------------------------
  - name: AdminActionLog
    parent: AdvisorFirm
    common_fields: true
    fields:
      - name: firm_id
        type: string
        source: system
        description: "FK -> AdvisorFirm.id; firm the regulatory action names"
      - name: admin_action_kind
        type: enum
        source: input
        description: "REGULATORY_FREEZE | DEFICIENCY_NOTICE"
        constraints: "REGULATORY_FREEZE | DEFICIENCY_NOTICE"
      - name: admin_action_status
        type: enum
        source: system
        description: "UNACKNOWLEDGED | ACTIVE | ACKNOWLEDGED"
        constraints: "UNACKNOWLEDGED | ACTIVE | ACKNOWLEDGED"
      - name: admin_action_detail
        type: string
        source: input
        description: "Free-form regulator narrative"
      - name: acknowledged_note
        type: string
        source: input
        description: "Firm's acknowledgement narrative; null until acknowledged"
      - name: acknowledged_by_user_id
        type: string
        source: system
        description: "X-User-ID of the officer who acknowledged"

  # ---------------------------------------------------------------------------
  - name: SystemConfig
    parent: null
    common_fields: true
    fields:
      - name: config_key
        type: string
        source: system
        description: "Singleton configuration key; always CUSTODY_PLATFORM_DEFAULTS"
      - name: database_invariant_enforcement
        type: enum
        source: input
        description: "WARN | ENFORCED — when ENFORCED a BROKEN firm-scoped invariant rejects the guarded writes"
        constraints: "WARN | ENFORCED"
        default: "WARN"
      - name: platform_fee_enabled
        type: boolean
        source: input
        description: "Whether C2's platform-fee component is added to the attributable ladder"
        default: true

  # ---------------------------------------------------------------------------
  - name: DatabaseInvariant
    parent: AdvisorFirm
    common_fields: true
    fields:
      - name: firm_id
        type: string
        source: system
        description: "FK -> AdvisorFirm.id; firm whose conserved quantity this invariant guards"
      - name: invariant_code
        type: enum
        source: input
        description: "CUSTODY_AGREEMENT_CONSISTENCY | TRANSFER_BASIS_CONSERVATION | HOUSEHOLD_FEE_BASIS_RECONCILIATION | CASCADE_ECONOMIC_EFFECT"
        constraints: "CUSTODY_AGREEMENT_CONSISTENCY | TRANSFER_BASIS_CONSERVATION | HOUSEHOLD_FEE_BASIS_RECONCILIATION | CASCADE_ECONOMIC_EFFECT"
      - name: invariant_status
        type: enum
        source: computed
        description: "HOLDING | BROKEN"
        constraints: "HOLDING | BROKEN"
      - name: expected_total_cents
        type: integer
        source: system
        description: "Value of the conserved quantity the invariant expects; 0 for boolean invariants"
      - name: observed_total_cents
        type: integer
        source: system
        description: "Value the invariant actually measured at the last evaluation"
      - name: breach_detail_code
        type: string
        source: system
        description: "Populated when invariant_status == BROKEN (e.g. HOUSEHOLD_FEE_BASIS_TOTAL_DRIFT)"
      - name: last_evaluated_at
        type: datetime
        source: system
        description: "Server-stamped instant of the most recent POST /invariants/evaluate for this firm"

  # ---------------------------------------------------------------------------
  - name: ExaminationBundle
    parent: AdvisorFirm
    common_fields: true
    fields:
      - name: firm_id
        type: string
        source: system
        description: "FK -> AdvisorFirm.id; firm under examination"
      - name: period_start_date
        type: datetime
        source: input
        description: "Inclusive start of the evidence period"
      - name: period_end_date
        type: datetime
        source: input
        description: "Exclusive end of the evidence period"
      - name: bundle_status
        type: enum
        source: system
        description: "ASSEMBLING | GENERATED | INCOMPLETE | SEALED"
        constraints: "ASSEMBLING | GENERATED | INCOMPLETE | SEALED"
      - name: missing_evidence_codes
        type: array
        source: computed
        description: "Sorted array of requirement_code values that blocked assembly"
      - name: sealed_evidence_hash
        type: string
        source: system
        description: "Server-minted seal token minted at SEALED; the hash the independent examiner verifies"
      - name: generated_at
        type: datetime
        source: system
        description: "Server-stamped instant the bundle was assembled"

#   branching ................ AssetTransfer (C6)
#   linear ................... TransferLot (C6, per-lot)
#   linear ................... FeeBillingRun (C4)
#   linear ................... MoneyMovementInstruction (C7)
#   linear ................... StandingInstruction (C11)
#   cyclic ................... CustodyRulesEvidence (C9)
#   branching with revert .... DataFeedProvision (C1)
#   branching ................ AlternativeAssetHolding (C4)
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  - entity: AdvisorFirm
    initial_state: OPEN
    terminal_states: [FROZEN]
    shape: posture_driven
    shape_note: |
      firm_posture is a derived aggregate over (a) the firm's CURRENT executed CustodyAgreement,
      (b) the rollup of the firm's CustodyRulesEvidence, and (c) the AdvisorFirmEntitlement
      set. It gates every child operation, and it is re-derived after each child mutation.
    transitions:
      - from: OPEN
        to: LIMITED
        trigger: "system re-derivation after a CustodyRulesEvidence row transitions SUBMITTED -> DEFICIENT with critical == true"
        actor: system
        preconditions: ["firm has at least one CustodyRulesEvidence row with requirement_status == DEFICIENT and critical == true"]
        side_effects:
          - "AdvisorFirm.posture_reason_code := CUSTODY_EVIDENCE_DEFICIENT"
          - "AdvisorFirm.supervision_evidence_status := DEFICIENT"
          - "cascade: every non-terminal DataFeedProvision of the firm transitions ACTIVE -> THROTTLED"
          - "cascade: every AdvisorFirmEntitlement of the firm whose entitlement_code is in {MODEL_MANAGEMENT, ALTERNATIVE_ASSETS} transitions GRANTED -> SUSPENDED"
          - "cascade (2nd hop): SUSPENDING an AdvisorFirmEntitlement forces the re-derivation of ModelPortfolio.model_status for every non-ARCHIVED model of the firm — ERR_MODEL_MANAGEMENT_ENTITLEMENT_REQUIRED"
        note: "Hop 1 suspends entitlements, hop 2 re-derives dependent models; the two hops are caused by each other, not by one parallel fan-out."
      - from: OPEN
        to: SUSPENDED
        trigger: "system re-derivation after POST /ria/firms/{id}/custody-agreements/{agreement_id}/terminate"
        actor: system
        preconditions: ["firm's CustodyAgreement with agreement_status == EXECUTED transitions to TERMINATED"]
        side_effects:
          - "AdvisorFirm.custody_agreement_status := TERMINATED"
          - "AdvisorFirm.posture_reason_code := CUSTODY_AGREEMENT_TERMINATED"
          - "cascade: every AdvisorFirmEntitlement of the firm in state REQUESTED or GRANTED transitions to SUSPENDED"
          - "cascade: every non-terminal BlockOrder of the firm in state SUBMITTED transitions to UNALLOCATED"
          - "cascade: every DataFeedProvision of the firm in state ACTIVE transitions to THROTTLED"
      - from: LIMITED
        to: OPEN
        trigger: "system re-derivation after POST /ria/custody-evidence/{id}/accept"
        actor: system
        preconditions: ["no AdvisorFirmEntitlement of the firm has entitlement_status == REVOKED", "every CustodyRulesEvidence row of the firm with critical == true has requirement_status in {ACCEPTED, WAIVED}", "firm has a CustodyAgreement with agreement_status == EXECUTED"]
        side_effects:
          - "AdvisorFirm.posture_reason_code := null"
          - "AdvisorFirm.supervision_evidence_status := CLEAR"
          - "cascade: every DataFeedProvision of the firm in state THROTTLED transitions to ACTIVE"
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /ria/firms/{id}/custody-agreements/execute"
        actor: CustodyOperationsOfficer
        preconditions: ["the firm has exactly one CustodyAgreement in state PENDING_SIGNATURE", "AdvisorFirm.crd_number == CustodyAgreement.adviser_crd_number", "no CustodyRulesEvidence row of the firm has requirement_status == DEFICIENT"]
        side_effects:
          - "AdvisorFirm.custody_agreement_status := EXECUTED"
          - "AdvisorFirm.agreement_executed_at := current_utc"
          - "recompute C12 AdvisorFirm.firm_posture"
      - from: SUSPENDED
        to: FROZEN
        trigger: "POST /ria/firms/{id}/freeze"
        actor: ComplianceReviewer
        preconditions: ["AdvisorFirm.firm_posture == SUSPENDED"]
        side_effects:
          - "AdvisorFirm.posture_reason_code := REGULATORY_FREEZE"
          - "cascade: every non-terminal MoneyMovementInstruction of the firm in state DRAFT or PENDING_AUTHORIZATION transitions to CANCELLED"
          - "cascade: every FeeBillingRun of the firm in state SETTLED transitions to REOPENED"
          - "recompute C12 AdvisorFirm.firm_posture"
      - from: OPEN
        to: FROZEN
        trigger: "POST /ria/firms/{id}/freeze"
        actor: ComplianceReviewer
        preconditions: ["AdvisorFirm.firm_posture == OPEN", "the firm has an AdminActionLog row with admin_action_kind == REGULATORY_FREEZE and admin_action_status == ACTIVE"]
        side_effects:
          - "AdvisorFirm.posture_reason_code := REGULATORY_FREEZE"
          - "cascade: every non-terminal MoneyMovementInstruction of the firm in state DRAFT or PENDING_AUTHORIZATION transitions to CANCELLED"
          - "cascade: every FeeBillingRun of the firm in state SETTLED transitions to REOPENED"
          - "cascade: every DataFeedProvision of the firm in state ACTIVE transitions to THROTTLED"
      - from: LIMITED
        to: FROZEN
        trigger: "POST /ria/firms/{id}/freeze"
        actor: ComplianceReviewer
        preconditions: ["AdvisorFirm.firm_posture == LIMITED", "firm has at least one CustodyRulesEvidence row with requirement_status == DEFICIENT and critical == true"]
        side_effects:
          - "AdvisorFirm.posture_reason_code := REGULATORY_FREEZE"
          - "cascade: every non-terminal MoneyMovementInstruction of the firm in state DRAFT or PENDING_AUTHORIZATION transitions to CANCELLED"
          - "cascade: every FeeBillingRun of the firm in state SETTLED transitions to REOPENED"
          - "recompute C12 AdvisorFirm.firm_posture"

  # ---------------------------------------------------------------------------
  - entity: CustodyAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    shape: branching_with_revert
    shape_note: "Two live DRAFT rows are permitted; the branch decision at submission is 'which sibling becomes PENDING_SIGNATURE'. Revert exists on both PENDING_SIGNATURE -> DRAFT and EXECUTED -> SUPERSEDED."
    transitions:
      - from: DRAFT
        to: PENDING_SIGNATURE
        trigger: "POST /ria/custody-agreements/{id}/submit"
        actor: AdvisorOperationsLead
        preconditions: ["CustodyAgreement.agreement_status == DRAFT", "AdvisorFirm.crd_number == CustodyAgreement.adviser_crd_number", "no sibling CustodyAgreement of the same firm currently has agreement_status in {PENDING_SIGNATURE, EXECUTED}"]
        side_effects:
          - "CustodyAgreement.drafted_by_user_id := X-User-ID header"
          - "cascade: blocks (does not mutate) every AdvisorFirmEntitlement of the firm whose requested_custody_agreement_id is another EXECUTED agreement — those keep entitlement_status GRANTED but gain payload_integrity_verified := false"
      - from: PENDING_SIGNATURE
        to: DRAFT
        trigger: "POST /ria/custody-agreements/{id}/revert"
        actor: AdvisorOperationsLead
        preconditions: ["CustodyAgreement.agreement_status == PENDING_SIGNATURE"]
        side_effects:
          - "CustodyAgreement.drafted_by_user_id := null"
          - "CustodyAgreement.submitted_at reset to null"
      - from: PENDING_SIGNATURE
        to: EXECUTED
        trigger: "POST /ria/firms/{id}/custody-agreements/execute"
        actor: CustodyOperationsOfficer
        preconditions: ["a CustodyAgreement of the firm has agreement_status == PENDING_SIGNATURE", "AdvisorFirm.crd_number == CustodyAgreement.adviser_crd_number", "the X-User-ID executing differs from CustodyAgreement.drafted_by_user_id"]
        side_effects:
          - "CustodyAgreement.agreement_status := EXECUTED"
          - "CustodyAgreement.executed_by_user_id := X-User-ID header"
          - "CustodyAgreement.signed_at := current_utc"
          - "CustodyAgreement.countersignature_hash := server-minted opaque token"
          - "cascade: AdvisorFirm.custody_agreement_status := EXECUTED; AdvisorFirm.agreement_executed_at := current_utc"
          - "cascade: every AdvisorFirmEntitlement of the firm whose requested_custody_agreement_id != this agreement id transitions GRANTED -> REVOKED"
          - "cascade (2nd hop): revoking an AdvisorFirmEntitlement with entitlement_code in {MODEL_MANAGEMENT, ALTERNATIVE_ASSETS} forces re-derivation of ModelPortfolio.model_status for every non-ARCHIVED model of the firm"
          - "recompute C12 AdvisorFirm.firm_posture"
      - from: EXECUTED
        to: SUPERSEDED
        trigger: "POST /ria/firms/{id}/custody-agreements/execute (executing a newer agreement for the same firm)"
        actor: CustodyOperationsOfficer
        preconditions: ["another CustodyAgreement of the same firm has agreement_status == PENDING_SIGNATURE"]
        side_effects:
          - "CustodyAgreement.agreement_status := SUPERSEDED"
          - "CustodyAgreement.superseded_by_agreement_id := the newly executed agreement id"
          - "AdvisorFirm.custody_agreement_status := EXECUTED for the successor, so the successor's status is the one the firm reports"
        note: "EXECUTED -> SUPERSEDED is a revert-shaped backward link: the old agreement stops authorizing, and the hop above is what makes it stop."
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /ria/firms/{id}/custody-agreements/{agreement_id}/terminate"
        actor: CustodyOperationsOfficer
        preconditions: ["agreement_id is the firm's current agreement", "CustodyAgreement.agreement_status == EXECUTED", "the firm has zero HouseholdAccount rows with account_status == OPEN"]
        side_effects:
          - "CustodyAgreement.agreement_status := TERMINATED"
          - "AdvisorFirm.custody_agreement_status := TERMINATED"
          - "cascade: AdvisorFirm.firm_posture := SUSPENDED; posture_reason_code := CUSTODY_AGREEMENT_TERMINATED"

  # ---------------------------------------------------------------------------
  - entity: AdvisorFirmEntitlement
    initial_state: REQUESTED
    terminal_states: [REVOKED]
    shape: cyclic
    shape_note: "GRANTED -> SUSPENDED -> GRANTED is a true cycle (posture re-derivation can both suspend and restore in any order, repeatedly)."
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /ria/firm-entitlements/{id}/grant"
        actor: CustodyOperationsOfficer
        preconditions: ["AdvisorFirm.firm_posture is in {OPEN, LIMITED}", "the firm has a CustodyAgreement with agreement_status == EXECUTED", "AdvisorFirmEntitlement.requested_custody_agreement_id == the firm's current EXECUTED agreement id", "no sibling AdvisorFirmEntitlement of the same firm already has the same entitlement_code in state GRANTED"]
        side_effects:
          - "AdvisorFirmEntitlement.effective_from := current_utc"
          - "AdvisorFirmEntitlement.payload_integrity_verified := true"
          - "AdvisorFirm.entitlement_count += 1"
          - "cascade: if entitlement_code == BILLING, every Household of the firm re-derives household_status — a Household with householding_consent == OP_OUT and more than one billable account transitions ACTIVE -> BILLING_HELD"
      - from: GRANTED
        to: SUSPENDED
        trigger: "system re-derivation from POST /ria/firms/{id}/freeze or from a firm posture drop"
        actor: system
        preconditions: ["AdvisorFirm.firm_posture == SUSPENDED or FROZEN"]
        side_effects:
          - "AdvisorFirmEntitlement.effective_from := null"
          - "cascade: for entitlement_code in {MODEL_MANAGEMENT, ALTERNATIVE_ASSETS}, every non-ARCHIVED ModelPortfolio of the firm re-evaluates model_status — the model is forced out of ACTIVE with error ERR_MODEL_MANAGEMENT_ENTITLEMENT_REQUIRED on the next model write"
      - from: SUSPENDED
        to: GRANTED
        trigger: "POST /ria/firm-entitlements/{id}/grant"
        actor: CustodyOperationsOfficer
        preconditions: ["AdvisorFirm.firm_posture is in {OPEN, LIMITED}", "AdvisorFirmEntitlement.requested_custody_agreement_id == the firm's current EXECUTED agreement id"]
        side_effects:
          - "AdvisorFirmEntitlement.effective_from := current_utc"
          - "AdvisorFirm.entitlement_count += 1"
      - from: GRANTED
        to: REVOKED
        trigger: "system cascade from executing a superseding CustodyAgreement"
        actor: system
        preconditions: ["AdvisorFirmEntitlement.requested_custody_agreement_id != the firm's current EXECUTED agreement id"]
        side_effects:
          - "AdvisorFirm.entitlement_count -= 1"
          - "cascade: for entitlement_code in {MODEL_MANAGEMENT, ALTERNATIVE_ASSETS}, every non-ARCHIVED ModelPortfolio of the firm is forced to ARCHIVED-eligible status ERR_MODEL_MANAGEMENT_ENTITLEMENT_REQUIRED on its next write"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /ria/firm-entitlements/{id}/revoke"
        actor: ComplianceReviewer
        preconditions: ["AdvisorFirmEntitlement.entitlement_status == SUSPENDED"]
        side_effects:
          - "AdvisorFirmEntitlement.effective_from := null"
          - "cascade: for entitlement_code in {MODEL_MANAGEMENT, ALTERNATIVE_ASSETS}, every non-ARCHIVED ModelPortfolio of the firm is forced to ARCHIVED-eligible status ERR_MODEL_MANAGEMENT_ENTITLEMENT_REQUIRED on its next write"
      - from: REVOKED
        to: REQUESTED
        trigger: "POST /ria/firm-entitlements/{id}/reopen"
        actor: AdvisorOperationsLead
        preconditions: ["AdvisorFirmEntitlement.entitlement_status == REVOKED", "the firm has a CustodyAgreement with agreement_status == EXECUTED"]
        side_effects:
          - "AdvisorFirmEntitlement.requested_custody_agreement_id := the firm's current EXECUTED agreement id"
          - "AdvisorFirmEntitlement.payload_integrity_verified := true"
        note: "Reopening closes the cycle; the entitlement must be granted again from REQUESTED."

  # ---------------------------------------------------------------------------
  - entity: HouseholdAccount
    initial_state: PENDING
    terminal_states: [CLOSED]
    shape: parallel
    shape_note: |
      Two independent state dimensions on one row: account_status (lifecycle) and the
      listing pairs (last_listed_cents / last_listed_at). The listing dimension advances
      while the lifecycle dimension stays fixed, and both are observable on the same read.
    transitions:
      - from: PENDING
        to: OPEN
        trigger: "POST /ria/accounts/{id}/activate"
        actor: CustodyOperationsOfficer
        preconditions: ["AdvisorFirm.firm_posture is in {OPEN, LIMITED}", "the account's firm has a CustodyAgreement with agreement_status == EXECUTED", "at least one AdvisorFirmEntitlement of the firm with entitlement_code in {TRADING_AUTHORIZATION, BILLING} has entitlement_status == GRANTED"]
        side_effects:
          - "HouseholdAccount.account_status := OPEN"
          - "cascade: the owning Household recomputes household_fee_basis_cents via C1"
      - from: OPEN
        to: FROZEN
        trigger: "POST /ria/accounts/{id}/freeze"
        actor: ComplianceReviewer
        preconditions: ["HouseholdAccount.account_status == OPEN"]
        side_effects:
          - "HouseholdAccount.account_status := FROZEN"
          - "cascade: every BlockAllocation of this account whose allocation_status == PENDING is excluded from the next C3 allocation"
          - "cascade (2nd hop): the parent BlockOrder recomputes unallocated_share_micros via C3 and, when it becomes non-zero, the block enters UNALLOCATED"
      - from: FROZEN
        to: OPEN
        trigger: "POST /ria/accounts/{id}/unfreeze"
        actor: ComplianceReviewer
        preconditions: ["HouseholdAccount.account_status == FROZEN", "AdvisorFirm.firm_posture is in {OPEN, LIMITED}"]
        side_effects:
          - "HouseholdAccount.account_status := OPEN"
          - "cascade: the owning Household recomputes household_fee_basis_cents via C1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /ria/accounts/{id}/close"
        actor: CustodyOperationsOfficer
        preconditions: ["HouseholdAccount.account_status == OPEN", "the account has zero AssetTransfer rows in state in {REQUESTED, SUBMITTED, RECEIVED, BASIS_REVIEW}", "the account has zero MoneyMovementInstruction rows in state in {DRAFT, PENDING_AUTHORIZATION, AUTHORIZED}"]
        side_effects:
          - "HouseholdAccount.account_status := CLOSED"
          - "cascade: the owning Household recomputes household_fee_basis_cents via C1 (the closed account drops out of the basis)"
          - "cascade: every StandingInstruction of this account in state VERIFIED transitions to REVOKED"
      - from: FROZEN
        to: CLOSED
        trigger: "POST /ria/accounts/{id}/close"
        actor: CustodyOperationsOfficer
        preconditions: ["HouseholdAccount.account_status == FROZEN", "AdvisorFirm.firm_posture is in {OPEN, LIMITED, SUSPENDED}", "the account has zero AssetTransfer rows in state in {REQUESTED, SUBMITTED, RECEIVED, BASIS_REVIEW}"]
        side_effects:
          - "HouseholdAccount.account_status := CLOSED"
          - "cascade: the owning Household recomputes household_fee_basis_cents via C1"
      - from: OPEN
        to: OPEN
        trigger: "POST /ria/accounts/{id}/list"
        actor: AdvisorOperationsLead
        preconditions: ["HouseholdAccount.account_status is in {PENDING, OPEN, FROZEN}"]
        side_effects:
          - "HouseholdAccount.last_listed_cents := recomputed market_value_cents"
          - "HouseholdAccount.last_listed_at := current_utc"
          - "recompute C11 reconstructed_nav_cents and cost_basis_reconciliation_delta_cents for the listing run"
        note: "Parallel dimension: the lifecycle state is unchanged and last_listed_* advance independently."

  # ---------------------------------------------------------------------------
  - entity: AssetTransfer
    initial_state: REQUESTED
    terminal_states: [CREDITED, REJECTED]
    shape: branching
    shape_note: "The SUBMITTED -> RECEIVED link forks: complete basis goes straight to CREDITED via a lot-level hop, incomplete basis detours through BASIS_REVIEW."
    transitions:
      - from: REQUESTED
        to: SUBMITTED
        trigger: "POST /ria/assets/{id}/transfer-out"
        actor: AdvisorOperationsLead
        preconditions: ["AssetTransfer.transfer_status == REQUESTED", "the receiving account's HouseholdAccount.account_status is in {OPEN, FROZEN}", "AdvisorFirm.firm_posture is in {OPEN, LIMITED}"]
        side_effects:
          - "AssetTransfer.transfer_status := SUBMITTED"
      - from: SUBMITTED
        to: RECEIVED
        trigger: "POST /ria/assets/{id}/mark-received"
        actor: CustodyOperationsOfficer
        preconditions: ["AssetTransfer.transfer_status == SUBMITTED"]
        side_effects:
          - "AssetTransfer.transfer_status := RECEIVED"
          - "every TransferLot of the transfer is stamped with basis_confidence_grade and suspected_double_basis"
          - "cascade: the receiving HouseholdAccount recomputes market_value_cents from its positions"
          - "cascade (2nd hop): the owning Household recomputes household_fee_basis_cents via C1"
      - from: RECEIVED
        to: BASIS_REVIEW
        trigger: "system cascade immediately after SUBMITTED -> RECEIVED, when at least one TransferLot has sent_cost_basis_cents == null"
        actor: system
        preconditions: ["AssetTransfer.transfer_status == RECEIVED", "at least one TransferLot of this transfer has sent_cost_basis_cents == null"]
        side_effects:
          - "AssetTransfer.transfer_status := BASIS_REVIEW"
          - "AssetTransfer.carryover_cents := 0"
          - "AssetTransfer.cost_basis_complete := false"
          - "the transfer's lots keep sent_cost_basis_cents == null and stay out of the receiving account's fee basis until a basis is accepted"
        note: "This hop is what makes the fork real — it is triggered by the lot state set in the previous hop, not by the original receive call."
      - from: RECEIVED
        to: CREDITED
        trigger: "system cascade after SUBMITTED -> RECEIVED, when every TransferLot already carries sent_cost_basis_cents"
        actor: system
        preconditions: ["AssetTransfer.transfer_status == RECEIVED", "every TransferLot of this transfer has sent_cost_basis_cents non-null"]
        side_effects:
          - "AssetTransfer.transfer_status := CREDITED"
          - "AssetTransfer.carryover_cents := C6 result"
          - "AssetTransfer.sent_basis_confidence := C6 grade"
          - "AssetTransfer.cost_basis_complete := true"
          - "AssetTransfer.credited_at := current_utc"
          - "cascade: each TransferLot.basis_appraisal_cents := its own sent_cost_basis_cents"
      - from: BASIS_REVIEW
        to: CREDITED
        trigger: "POST /ria/assets/{id}/accept-basis"
        actor: AdvisorOperationsLead
        preconditions: ["AssetTransfer.transfer_status == BASIS_REVIEW", "every TransferLot of the transfer now carries sent_cost_basis_cents non-null", "the firm holds a CustodyRulesEvidence row with requirement_code == QUALIFIED_CUSTODIAN and requirement_status in {ACCEPTED, WAIVED}"]
        side_effects:
          - "AssetTransfer.transfer_status := CREDITED"
          - "AssetTransfer.carryover_cents := C6 result"
          - "AssetTransfer.sent_basis_confidence := C6 grade"
          - "AssetTransfer.cost_basis_complete := true"
          - "AssetTransfer.credited_at := current_utc"
          - "cascade: the receiving HouseholdAccount recomputes market_value_cents and account_fee_basis_cents via C1"
          - "cascade (2nd hop): the owning Household recomputes household_annual_fee_cents via C2"
      - from: BASIS_REVIEW
        to: REJECTED
        trigger: "POST /ria/assets/{id}/reject-basis"
        actor: CustodyOperationsOfficer
        preconditions: ["AssetTransfer.transfer_status == BASIS_REVIEW", "AssetTransfer.rejected_reason_code is non-empty"]
        side_effects:
          - "AssetTransfer.transfer_status := REJECTED"
          - "AssetTransfer.carryover_cents := 0"
          - "cascade: every TransferLot of the transfer is removed from the receiving account's positions"
          - "cascade (2nd hop): the owning Household recomputes household_fee_basis_cents via C1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /ria/assets/{id}/reject"
        actor: CustodyOperationsOfficer
        preconditions: ["AssetTransfer.transfer_status == REQUESTED", "AssetTransfer.rejected_reason_code is non-empty"]
        side_effects:
          - "AssetTransfer.transfer_status := REJECTED"

  # ---------------------------------------------------------------------------
  - entity: TransferLot
    initial_state: PENDING
    terminal_states: [APPLIED, DISCARDED]
    shape: linear
    shape_note: "Per-lot linear pipeline; the last hop (STAMPED -> APPLIED) fires from AssetTransfer's BASIS_REVIEW -> CREDITED transition, i.e. a cross-entity bubble."
    transitions:
      - from: PENDING
        to: STAMPED
        trigger: "system cascade from AssetTransfer SUBMITTED -> RECEIVED"
        actor: system
        preconditions: ["the parent AssetTransfer.transfer_status == RECEIVED"]
        side_effects:
          - "TransferLot.basis_confidence_grade := C6 per-lot grade"
          - "TransferLot.suspected_double_basis := C6 duplicate check"
      - from: STAMPED
        to: APPLIED
        trigger: "system cascade from AssetTransfer BASIS_REVIEW -> CREDITED or RECEIVED -> CREDITED"
        actor: system
        preconditions: ["the parent AssetTransfer.transfer_status == CREDITED", "TransferLot.sent_cost_basis_cents is non-null"]
        side_effects:
          - "TransferLot.basis_appraisal_cents := C5 accepted basis"
          - "cascade: the receiving HouseholdAccount position gains this lot for C1 purposes"
      - from: STAMPED
        to: DISCARDED
        trigger: "system cascade from AssetTransfer BASIS_REVIEW -> REJECTED"
        actor: system
        preconditions: ["the parent AssetTransfer.transfer_status == REJECTED"]
        side_effects:
          - "TransferLot.basis_appraisal_cents := null"

  # ---------------------------------------------------------------------------
  - entity: ModelPortfolio
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    shape: cyclic
    shape_note: "APPROVED -> REBALANCING -> APPROVED is a revision loop; approval_round_number increments each time the loop closes."
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /ria/models/{id}/approve"
        actor: InvestmentCommitteeChair
        preconditions: ["ModelPortfolio.model_status == DRAFT", "target_weight_total_bps == 10000", "the firm has an AdvisorFirmEntitlement with entitlement_code == MODEL_MANAGEMENT and entitlement_status == GRANTED", "AdvisorFirm.firm_posture is in {OPEN, LIMITED}"]
        side_effects:
          - "ModelPortfolio.model_status := APPROVED"
          - "ModelPortfolio.drift_approved_at := current_utc"
          - "ModelPortfolio.approval_round_number += 1"
      - from: APPROVED
        to: REBALANCING
        trigger: "POST /ria/models/{id}/rebalance"
        actor: AdvisorOperationsLead
        preconditions: ["ModelPortfolio.model_status == APPROVED", "the firm has an AdvisorFirmEntitlement with entitlement_code == MODEL_MANAGEMENT and entitlement_status == GRANTED"]
        side_effects:
          - "ModelPortfolio.model_status := REBALANCING"
          - "cascade: every BlockOrder of the firm with model_id == this model and block_status == DRAFT transitions to SUBMITTED"
      - from: ACTIVE
        to: REBALANCING
        trigger: "POST /ria/models/{id}/rebalance"
        actor: AdvisorOperationsLead
        preconditions: ["ModelPortfolio.model_status == ACTIVE"]
        side_effects:
          - "ModelPortfolio.model_status := REBALANCING"
          - "cascade: every BlockOrder of the firm with model_id == this model and block_status == DRAFT transitions to SUBMITTED"
      - from: REBALANCING
        to: APPROVED
        trigger: "POST /ria/models/{id}/approve"
        actor: InvestmentCommitteeChair
        preconditions: ["ModelPortfolio.model_status == REBALANCING", "target_weight_total_bps == 10000"]
        side_effects:
          - "ModelPortfolio.model_status := APPROVED"
          - "ModelPortfolio.drift_approved_at := current_utc"
          - "ModelPortfolio.approval_round_number += 1"
        note: "Cycle close: each traversal bumps approval_round_number, so the second approval is observably round 2."
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /ria/models/{id}/activate"
        actor: InvestmentCommitteeChair
        preconditions: ["ModelPortfolio.model_status == APPROVED", "the firm has an AdvisorFirmEntitlement with entitlement_code == MODEL_MANAGEMENT and entitlement_status == GRANTED", "at least one HouseholdAccount of the firm has model_portfolio_id == this model"]
        side_effects:
          - "ModelPortfolio.model_status := ACTIVE"
          - "cascade: every HouseholdAccount of the firm with model_portfolio_id == this model and account_status == PENDING transitions to OPEN"
          - "cascade (2nd hop): the owning Household recomputes household_fee_basis_cents and household_annual_fee_cents via C1 and C2"
      - from: DRAFT
        to: ARCHIVED
        trigger: "POST /ria/models/{id}/archive"
        actor: InvestmentCommitteeChair
        preconditions: ["ModelPortfolio.model_status == DRAFT"]
        side_effects: ["ModelPortfolio.model_status := ARCHIVED"]
      - from: APPROVED
        to: ARCHIVED
        trigger: "POST /ria/models/{id}/archive"
        actor: InvestmentCommitteeChair
        preconditions: ["ModelPortfolio.model_status == APPROVED", "the firm has zero HouseholdAccount rows with model_portfolio_id == this model"]
        side_effects: ["ModelPortfolio.model_status := ARCHIVED"]

  # ---------------------------------------------------------------------------
  - entity: BlockOrder
    initial_state: DRAFT
    terminal_states: [SETTLED]
    shape: branching_with_revert
    shape_note: "EXECUTED forks into ALLOCATED (clean) or UNALLOCATED (residual), and UNALLOCATED reverts to EXECUTED once allocation gaps close."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /ria/block-orders/{id}/submit"
        actor: AdvisorOperationsLead
        preconditions: ["BlockOrder.block_status == DRAFT", "total_requested_share_micros >= executed_share_micros", "the firm has an AdvisorFirmEntitlement with entitlement_code == TRADING_AUTHORIZATION and entitlement_status == GRANTED", "the firm has an AdvisorFirmEntitlement with entitlement_code == MODEL_MANAGEMENT and entitlement_status == GRANTED", "every BlockAllocation of the block targets an account whose HouseholdAccount.account_status is OPEN", "AdvisorFirm.firm_posture == OPEN"]
        side_effects:
          - "BlockOrder.block_status := SUBMITTED"
      - from: SUBMITTED
        to: EXECUTED
        trigger: "POST /ria/block-orders/{id}/execute"
        actor: AdvisorOperationsLead
        preconditions: ["BlockOrder.block_status == SUBMITTED"]
        side_effects:
          - "BlockOrder.block_status := EXECUTED"
      - from: EXECUTED
        to: ALLOCATED
        trigger: "POST /ria/block-orders/{id}/allocate"
        actor: AdvisorOperationsLead
        preconditions: ["BlockOrder.block_status == EXECUTED"]
        side_effects:
          - "C3 runs: BlockAllocation.share_micros, allocated_cost_cents and average_price_micros are written for every allocation whose account_status is OPEN"
          - "BlockAllocation.allocation_status := ALLOCATED for every filled allocation"
          - "BlockOrder.unallocated_share_micros := 0 when every allocation filled exactly, else the residual"
          - "BlockOrder.block_status := ALLOCATED when unallocated_share_micros == 0, else UNALLOCATED"
      - from: EXECUTED
        to: UNALLOCATED
        trigger: "POST /ria/block-orders/{id}/allocate when a targeted account is not OPEN"
        actor: AdvisorOperationsLead
        preconditions: ["BlockOrder.block_status == EXECUTED", "at least one BlockAllocation targets an account whose HouseholdAccount.account_status is not OPEN"]
        side_effects:
          - "the excluded allocations keep allocation_status PENDING and keep share_micros null"
          - "BlockOrder.unallocated_share_micros := executed_share_micros minus the shares assigned to OPEN accounts"
          - "BlockOrder.block_status := UNALLOCATED"
      - from: UNALLOCATED
        to: EXECUTED
        trigger: "POST /ria/accounts/{id}/unfreeze followed by re-allocation"
        actor: system
        preconditions: ["BlockOrder.block_status == UNALLOCATED", "the previously excluded accounts are now OPEN"]
        side_effects:
          - "BlockOrder.block_status := EXECUTED; unallocated_share_micros := null"
        note: "Revert edge that makes the fork recoverable."
      - from: ALLOCATED
        to: SETTLED
        trigger: "POST /ria/block-orders/{id}/settle"
        actor: CustodyOperationsOfficer
        preconditions: ["BlockOrder.block_status == ALLOCATED", "unallocated_share_micros == 0"]
        side_effects:
          - "BlockOrder.block_status := SETTLED"
          - "BlockAllocation.allocation_status := SETTLED for every allocation"
          - "cascade: for each allocation, the receiving HouseholdAccount recomputes market_value_cents"
          - "cascade (2nd hop): the owning Household recomputes household_fee_basis_cents via C1"
          - "recompute C4 for the block so any over-allocation credit is credited to the affected allocations"
      - from: SUBMITTED
        to: UNALLOCATED
        trigger: "system cascade from a firm posture drop to SUSPENDED or FROZEN"
        actor: system
        preconditions: ["AdvisorFirm.firm_posture in {SUSPENDED, FROZEN}", "BlockOrder.block_status == SUBMITTED"]
        side_effects:
          - "BlockOrder.block_status := UNALLOCATED"
          - "BlockOrder.unallocated_share_micros := executed_share_micros"

  # ---------------------------------------------------------------------------
  - entity: FeeBillingRun
    initial_state: SETTLED
    terminal_states: [VOIDED]
    shape: linear
    shape_note: "SETTLED is the creation state; the only forward path is SETTLED -> INVOICE_MISMATCH -> REOPENED (-> SETTLED) or SETTLED -> VOIDED."
    transitions:
      - from: SETTLED
        to: INVOICE_MISMATCH
        trigger: "POST /ria/billing-runs/{id}/remit-invoice when stated_invoice_cents != recomputed net_fee_cents"
        actor: AdvisorOperationsLead
        preconditions: ["FeeBillingRun.billing_run_status == SETTLED", "stated_invoice_cents != net_fee_cents"]
        side_effects:
          - "FeeBillingRun.billing_run_status := INVOICE_MISMATCH"
          - "cascade: the owning Household transitions household_status ACTIVE -> BILLING_HELD"
          - "cascade (2nd hop): a Household left BILLING_HELD cannot seed a new FeeBillingRun"
      - from: INVOICE_MISMATCH
        to: REOPENED
        trigger: "POST /ria/billing-runs/{id}/reopen"
        actor: ComplianceReviewer
        preconditions: ["FeeBillingRun.billing_run_status == INVOICE_MISMATCH", "the X-User-ID reopening differs from the FeeBillingRun.firm_id's billing operator is NOT required — the invoker IS a ComplianceReviewer"]
        side_effects:
          - "FeeBillingRun.billing_run_status := REOPENED"
          - "the C2 credit_applied_cents and net_fee_cents are released; every FeeCredit consumed by this run returns to credit_status AVAILABLE"
          - "cascade: the owning Household transitions household_status BILLING_HELD -> ACTIVE"
      - from: REOPENED
        to: SETTLED
        trigger: "POST /ria/billing-runs/{id}/settle"
        actor: AdvisorOperationsLead
        preconditions: ["FeeBillingRun.billing_run_status == REOPENED"]
        side_effects:
          - "FeeBillingRun.billing_run_status := SETTLED"
          - "recompute C2 gross_fee_cents, credit_applied_cents and net_fee_cents from the current credit selector"
          - "FeeBillingRun.settlement_evidence_hash := server-minted opaque token"
      - from: SETTLED
        to: VOIDED
        trigger: "POST /ria/billing-runs/{id}/void"
        actor: ComplianceReviewer
        preconditions: ["FeeBillingRun.billing_run_status == SETTLED"]
        side_effects:
          - "FeeBillingRun.billing_run_status := VOIDED"
          - "every FeeCredit consumed by this run returns to credit_status AVAILABLE"

  # ---------------------------------------------------------------------------
  - entity: StandingInstruction
    initial_state: PENDING
    terminal_states: [EXPIRED, REVOKED]
    shape: linear
    shape_note: "PENDING -> VERIFIED, then VERIFIED -> EXPIRED (round_trip_days >= 7) or VERIFIED -> REVOKED."
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /ria/standing-instructions/{id}/verify"
        actor: Client
        preconditions: ["StandingInstruction.verification_status == PENDING", "the X-User-ID matches the household's primary client user id for the account"]
        side_effects:
          - "StandingInstruction.verification_status := VERIFIED"
          - "StandingInstruction.verified_at := current_utc"
      - from: VERIFIED
        to: EXPIRED
        trigger: "POST /ria/standing-instructions/{id}/expire-check"
        actor: CustodyOperationsOfficer
        preconditions: ["StandingInstruction.verification_status == VERIFIED", "round_trip_days >= 7"]
        side_effects:
          - "StandingInstruction.verification_status := EXPIRED"
          - "cascade: every MoneyMovementInstruction of the account in state DRAFT or PENDING_AUTHORIZATION transitions to REJECTED"
      - from: VERIFIED
        to: REVOKED
        trigger: "POST /ria/standing-instructions/{id}/revoke"
        actor: ComplianceReviewer
        preconditions: ["StandingInstruction.verification_status == VERIFIED"]
        side_effects:
          - "StandingInstruction.verification_status := REVOKED"
          - "cascade: every MoneyMovementInstruction of the account in state DRAFT or PENDING_AUTHORIZATION transitions to REJECTED"

  # ---------------------------------------------------------------------------
  - entity: MoneyMovementInstruction
    initial_state: DRAFT
    terminal_states: [REJECTED, CANCELLED, COMPLETED]
    shape: linear
    shape_note: "DRAFT -> PENDING_AUTHORIZATION -> AUTHORIZED -> COMPLETED, with reject/cancel branches."
    transitions:
      - from: DRAFT
        to: PENDING_AUTHORIZATION
        trigger: "POST /ria/money-movements/{id}/submit"
        actor: AdvisorOperationsLead
        preconditions: ["MoneyMovementInstruction.movement_status == DRAFT", "AdvisorFirm.firm_posture is in {OPEN, LIMITED}", "the account's HouseholdAccount.account_status == OPEN"]
        side_effects:
          - "MoneyMovementInstruction.movement_status := PENDING_AUTHORIZATION"
      - from: PENDING_AUTHORIZATION
        to: AUTHORIZED
        trigger: "POST /ria/money-movements/{id}/authorize"
        actor: Client
        preconditions: ["MoneyMovementInstruction.movement_status == PENDING_AUTHORIZATION", "the linked StandingInstruction.verification_status == VERIFIED", "StandingInstruction.round_trip_days < 7", "C7 verification passes: authorization_note non-empty, amount_cents <= periodic_limit_cents, and the account is not subject to a two-party-authorization requirement unless the firm holds a CustodyRulesEvidence row with requirement_code == TWO_PARTY_AUTHORIZATION and requirement_status in {ACCEPTED, WAIVED}"]
        side_effects:
          - "MoneyMovementInstruction.movement_status := AUTHORIZED"
          - "StandingInstruction.consumed_period_cents += amount_cents"
          - "recompute C7 withheld_cents and net_disbursed_cents"
          - "cascade: the account's HouseholdAccount recomputes market_value_cents after the movement posts"
          - "cascade (2nd hop): the owning Household recomputes household_fee_basis_cents via C1"
      - from: PENDING_AUTHORIZATION
        to: REJECTED
        trigger: "POST /ria/money-movements/{id}/reject"
        actor: Client
        preconditions: ["MoneyMovementInstruction.movement_status == PENDING_AUTHORIZATION"]
        side_effects:
          - "MoneyMovementInstruction.movement_status := REJECTED"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /ria/money-movements/{id}/cancel"
        actor: AdvisorOperationsLead
        preconditions: ["MoneyMovementInstruction.movement_status == DRAFT"]
        side_effects:
          - "MoneyMovementInstruction.movement_status := CANCELLED"
      - from: AUTHORIZED
        to: COMPLETED
        trigger: "POST /ria/money-movements/{id}/complete"
        actor: CustodyOperationsOfficer
        preconditions: ["MoneyMovementInstruction.movement_status == AUTHORIZED"]
        side_effects:
          - "MoneyMovementInstruction.movement_status := COMPLETED"
          - "StandingInstruction.consumed_period_cents += 0 (already counted at authorization)"

  # ---------------------------------------------------------------------------
  - entity: CustodyRulesEvidence
    initial_state: PENDING
    terminal_states: [WAIVED, LAPSED]
    shape: cyclic
    shape_note: "SUBMITTED -> DEFICIENT -> SUBMITTED is a correction loop; each traversal increments evidence_round_number."
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /ria/custody-evidence/{id}/submit"
        actor: AdvisorOperationsLead
        preconditions: ["CustodyRulesEvidence.requirement_status == PENDING", "AdvisorFirm.firm_posture is in {OPEN, LIMITED, SUSPENDED}"]
        side_effects:
          - "CustodyRulesEvidence.requirement_status := SUBMITTED"
          - "CustodyRulesEvidence.drafted_by_user_id := X-User-ID header"
          - "CustodyRulesEvidence.submitted_at := current_utc"
          - "cascade: AdvisorFirm.supervision_evidence_status := recomputed rollup"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /ria/custody-evidence/{id}/accept"
        actor: ComplianceReviewer
        preconditions: ["CustodyRulesEvidence.requirement_status == SUBMITTED", "the X-User-ID accepting differs from CustodyRulesEvidence.drafted_by_user_id"]
        side_effects:
          - "CustodyRulesEvidence.requirement_status := ACCEPTED"
          - "CustodyRulesEvidence.accepted_by_user_id := X-User-ID header"
          - "CustodyRulesEvidence.evidence_document_hash := server-minted opaque token"
          - "cascade: AdvisorFirm.supervision_evidence_status := recomputed rollup"
          - "cascade (2nd hop): recompute C12 AdvisorFirm.firm_posture — a firm in LIMITED with all critical evidence accepted returns to OPEN"
      - from: SUBMITTED
        to: DEFICIENT
        trigger: "POST /ria/custody-evidence/{id}/reject"
        actor: ComplianceReviewer
        preconditions: ["CustodyRulesEvidence.requirement_status == SUBMITTED", "the X-User-ID rejecting differs from CustodyRulesEvidence.drafted_by_user_id"]
        side_effects:
          - "CustodyRulesEvidence.requirement_status := DEFICIENT"
          - "CustodyRulesEvidence.evidence_round_number += 1"
          - "cascade: AdvisorFirm.supervision_evidence_status := DEFICIENT"
          - "cascade (2nd hop): recompute C12 AdvisorFirm.firm_posture; a firm in OPEN with a critical DEFICIENT row drops to LIMITED"
          - "cascade (3rd hop): the LIMITED posture suspends MODEL_MANAGEMENT and ALTERNATIVE_ASSETS entitlements"
      - from: DEFICIENT
        to: SUBMITTED
        trigger: "POST /ria/custody-evidence/{id}/resubmit"
        actor: AdvisorOperationsLead
        preconditions: ["CustodyRulesEvidence.requirement_status == DEFICIENT", "CustodyRulesEvidence.evidence_round_number < 4"]
        side_effects:
          - "CustodyRulesEvidence.requirement_status := SUBMITTED"
          - "CustodyRulesEvidence.drafted_by_user_id := X-User-ID header"
        note: "Cycle close; the fourth round is the ceiling and the fifth attempt is rejected."
      - from: SUBMITTED
        to: WAIVED
        trigger: "POST /ria/custody-evidence/{id}/waive"
        actor: ComplianceReviewer
        preconditions: ["CustodyRulesEvidence.requirement_status == SUBMITTED", "CustodyRulesEvidence.critical == false"]
        side_effects:
          - "CustodyRulesEvidence.requirement_status := WAIVED"
      - from: ACCEPTED
        to: LAPSED
        trigger: "POST /ria/custody-evidence/{id}/lapse"
        actor: ComplianceReviewer
        preconditions: ["CustodyRulesEvidence.requirement_status == ACCEPTED", "AdvisorFirm.agreement_executed_at is non-null and current_utc - AdvisorFirm.agreement_executed_at >= 365 days"]
        side_effects:
          - "CustodyRulesEvidence.requirement_status := LAPSED"
          - "cascade: AdvisorFirm.supervision_evidence_status := recomputed rollup"
          - "cascade (2nd hop): recompute C12 AdvisorFirm.firm_posture"

  # ---------------------------------------------------------------------------
  - entity: DataFeedProvision
    initial_state: REQUESTED
    terminal_states: [REVOKED]
    shape: branching_with_revert
    shape_note: "REQUESTED -> ACTIVE, then ACTIVE <-> THROTTLED is a revert pair driven by the firm's database invariant chain."
    transitions:
      - from: REQUESTED
        to: ACTIVE
        trigger: "POST /ria/data-feeds/{id}/provision"
        actor: AdvisorOperationsLead
        preconditions: ["DataFeedProvision.provision_status == REQUESTED", "the firm has an AdvisorFirmEntitlement with entitlement_code == DATA_FEED and entitlement_status == GRANTED", "AdvisorFirm.firm_posture == OPEN"]
        side_effects:
          - "DataFeedProvision.provision_status := ACTIVE"
          - "DataFeedProvision.throttle_reason_code := null"
      - from: ACTIVE
        to: THROTTLED
        trigger: "system re-derivation (POST /ria/firms/{id}/freeze, a posture drop, or POST /ria/invariants/evaluate"
        actor: system
        preconditions: ["AdvisorFirm.firm_posture in {LIMITED, SUSPENDED, FROZEN}"]
        side_effects:
          - "DataFeedProvision.provision_status := THROTTLED"
          - "DataFeedProvision.throttle_reason_code := the binding posture reason code"
      - from: THROTTLED
        to: ACTIVE
        trigger: "POST /ria/invariants/evaluate when every invariant in the database invariant chain holds"
        actor: CustodyOperationsOfficer
        preconditions: ["DataFeedProvision.provision_status == THROTTLED", "AdvisorFirm.firm_posture in {OPEN, LIMITED}"]
        side_effects:
          - "DataFeedProvision.provision_status := ACTIVE"
          - "DataFeedProvision.throttle_reason_code := null"
      - from: THROTTLED
        to: REVOKED
        trigger: "POST /ria/data-feeds/{id}/revoke"
        actor: ComplianceReviewer
        preconditions: ["DataFeedProvision.provision_status == THROTTLED"]
        side_effects: ["DataFeedProvision.provision_status := REVOKED"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /ria/data-feeds/{id}/revoke"
        actor: ComplianceReviewer
        preconditions: ["DataFeedProvision.provision_status == ACTIVE"]
        side_effects: ["DataFeedProvision.provision_status := REVOKED"]

  # ---------------------------------------------------------------------------
  - entity: AlternativeAssetHolding
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED]
    shape: branching
    shape_note: "PENDING -> UNDER_REVIEW forks into ACCEPTED (C4 haircut) or REJECTED."
    transitions:
      - from: PENDING
        to: UNDER_REVIEW
        trigger: "POST /ria/alternatives/{id}/submit-valuation"
        actor: AdvisorOperationsLead
        preconditions: ["AlternativeAssetHolding.asset_acceptance_status == PENDING", "the firm has an AdvisorFirmEntitlement with entitlement_code == ALTERNATIVE_ASSETS and entitlement_status == GRANTED"]
        side_effects:
          - "AlternativeAssetHolding.asset_acceptance_status := UNDER_REVIEW"
          - "AlternativeAssetHolding.valuation_age_days := current_utc - valuation_as_of_date in whole days"
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /ria/alternatives/{id}/accept-valuation"
        actor: ComplianceReviewer
        preconditions: ["AlternativeAssetHolding.asset_acceptance_status == UNDER_REVIEW", "all of C4's gates pass: valuation_age_days <= 270, stated_value_cents >= valuation_floor_cents, and the account hosts no other holding with asset_acceptance_status == UNDER_REVIEW"]
        side_effects:
          - "AlternativeAssetHolding.asset_acceptance_status := ACCEPTED"
          - "AlternativeAssetHolding.accepted_value_cents := C4 result"
          - "AlternativeAssetHolding.haircut_pct := C4 haircut in basis points"
          - "AlternativeAssetHolding.fee_basis_eligible := true"
          - "cascade: the holding's HouseholdAccount.alt_value_cents := sum of accepted_value_cents over eligible holdings"
          - "cascade (2nd hop): the owning Household recomputes household_fee_basis_cents via C1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /ria/alternatives/{id}/reject-valuation"
        actor: ComplianceReviewer
        preconditions: ["AlternativeAssetHolding.asset_acceptance_status == UNDER_REVIEW"]
        side_effects:
          - "AlternativeAssetHolding.asset_acceptance_status := REJECTED"
          - "AlternativeAssetHolding.accepted_value_cents := null"
          - "cascade: the holding's HouseholdAccount.alt_value_cents := sum of accepted_value_cents over eligible holdings"
          - "cascade (2nd hop): the owning Household recomputes household_fee_basis_cents via C1"

# =============================================================================
# §1.2.1 Concurrency Rules (true write-write races only; OCC-resolved)
# =============================================================================
concurrency_rules:

  - rule_id: model-rebalance-stale-model
    parent_entity: ModelPortfolio
    write_endpoint: "POST /models/{id}/rebalance"
    occ_field: "expected_model_portfolio_version"
    description: |
      Requesting a rebalance against a ModelPortfolio whose version has advanced since
      the client last read it is rejected. The version advances on any legitimate
      rebalance entry (including the approval round-trip), so a client holding a
      pre-round view of the model is acting on a superseded state.
    error_id: ERR_STALE_MODEL_VERSION
    http_status: 412

  - rule_id: block-allocate-stale-block
    parent_entity: BlockOrder
    write_endpoint: "POST /block-orders/{id}/allocate"
    occ_field: "expected_block_order_version"
    description: |
      Requesting an allocation against a BlockOrder whose version has advanced since
      the client last read it is rejected. The version advances whenever the block is
      legitimately superseded (for example by a re-execution that reprices the fill),
      so the client's expected allocation basis is stale.
    error_id: ERR_STALE_BLOCK_VERSION
    http_status: 412

  - rule_id: account-relink-stale-household
    parent_entity: Household
    write_endpoint: "POST /accounts/{id}/relink"
    occ_field: "expected_household_version"
    description: |
      Relinking a HouseholdAccount to a different Household against a Household whose
      version has advanced since the client last read it is rejected. The household
      version advances whenever another account is legitimately relinked into or out of
      it (which supersedes the client's view of the membership), so the relink must be
      re-decided against fresh membership state.
    error_id: ERR_STALE_HOUSEHOLD_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (11 rules; 7 carry dual-variant `variants`)
# =============================================================================
calculations:

  - name: household_fee_basis
    trigger: "on any mutation of a HouseholdAccount position set, account_status, or AlternativeAssetHolding.accepted_value_cents"
    algorithm: aggregation
    formula: |
      for each account A of household H with A.account_status IN {OPEN, FROZEN} and A.billable == true:
          A.TRADITIONAL_value = round_half_up( sum over A's positions P of
                                 (P.quantity_micros * P.valuation_price_micros) / 1000000000000 )
          A.TRADITIONAL_basis = round_half_up( sum over A's positions P of
                                 MAX(P.market_value_cents, P.cost_basis_cents) )
          A.ALT_basis = sum over A's AlternativeAssetHolding rows V with
                        V.asset_acceptance_status == ACCEPTED and V.stale_valuation == false
                        of V.accepted_value_cents
          A.account_fee_basis_cents = A.TRADITIONAL_basis + A.ALT_basis
      H.household_fee_basis_cents = sum over included accounts A of A.account_fee_basis_cents
    input_set: |
      Accounts included: account_status IN {OPEN, FROZEN} AND billable == true AND the
      firm's firm_posture IN {OPEN, LIMITED}. Accounts with account_status IN
      {PENDING, CLOSED} are excluded. ENTITY-type accounts are excluded by billable ==
      false. A holding with stale_valuation == true contributes 0 even when ACCEPTED.
      Positions with quantity_micros == 0 contribute 0.
    constants:
      MICROS_PER_SHARE: 1000000
      MICROS_PER_CENT: 10000
      MICROS_TO_CENTS_DIVISOR: 10000000000
    precision: "2 decimal places (cents), round_half_up at each per-position value; the account total is an integer sum of already-rounded position values"
    variants:
      - name: FULL_RECOMPUTE
        when: "any account or position mutation, or a fee-basis read"
        difference: "rebuilds the household basis from every included account; the authoritative value"
      - name: LISTED_SNAPSHOT
        when: "POST /accounts/{id}/list has run since the last position mutation"
        difference: "uses last_listed_cents for the account's traditional sleeve instead of re-deriving from positions; diverges from FULL_RECOMPUTE whenever a position changed after the listing, which is exactly the drift the reconciliation invariant detects"

  - name: advisory_fee_household_aggregation
    trigger: "FeeBillingRun creation, reopen, and settle"
    algorithm: tiered_pricing
    formula: |
      Order of evaluation is PINNED: (1) attributable tier fee, (2) platform fee
      selecting ONE tier from the aggregate balance, (3) sum, (4) pro-rate, (5) round,
      (6) subtract credits. Steps 1-3 are computed on the annual basis and are only
      rounded at step 5.

      H.household_fee_basis_cents must be positive, else the run is rejected.

      attributable_annual_cents = 0
      for each tier T = (lower_cents, upper_cents, rate_bps) in ATTRIBUTABLE_TIERS in ascending lower_cents:
          tier_amount = min(H.household_fee_basis_cents, T.upper_cents) - T.lower_cents   (last tier: no upper bound)
          if tier_amount > 0:
              attributable_annual_cents += floor(tier_amount * T.rate_bps / 10000)

      platform_rate_bps = the rate_bps of the SINGLE PLATFORM_TIER whose
                          [lower_cents, upper_cents] contains H.household_fee_basis_cents
                          (the last tier has no upper bound)
      platform_annual_cents = floor(H.household_fee_basis_cents * platform_rate_bps / 10000)

      annual_fee_cents = attributable_annual_cents + platform_annual_cents
      gross_fee_cents  = round_half_up( annual_fee_cents * period_days / 365 )

      Credit consumption is PINNED: walk the household's FeeCredit rows with
      credit_status IN {AVAILABLE, PARTIALLY_APPLIED} in (earned_on_date ASC,
      then created_at ASC as the deterministic fallback for credits stamped at
      the same instant; `id` is never consulted) order, consuming each one only
      down to the remaining headroom
      (gross_fee_cents - credit_applied_cents). A credit fully consumed becomes
      APPLIED; a credit consumed only in part becomes PARTIALLY_APPLIED and keeps
      its remainder; a credit reached after the headroom is exhausted stays
      AVAILABLE and is not touched. credit_applied_cents therefore never exceeds
      gross_fee_cents.
      net_fee_cents    = gross_fee_cents - credit_applied_cents
    input_set: |
      Households included: household_status IN {ACTIVE, BILLING_HELD} AND the firm's
      firm_posture in {OPEN, LIMITED}. A household with zero included billable accounts
      has household_fee_basis_cents == 0 and MUST be rejected with ERR_FEE_BASIS_ZERO.
      period_days = period_end_date - period_start_date in whole days (half-open interval).
    constants:
      ATTRIBUTABLE_TIERS: [[0, 250000000, 110], [250000001, 500000000, 90], [500000001, 1000000000, 70], [1000000001, null, 55]]
      PLATFORM_TIERS: [[0, 250000000, 8], [250000001, 500000000, 6], [500000001, 1000000000, 4], [1000000001, null, 3]]
      DAYS_PER_YEAR: 365
    precision: "2 decimal places, round_half_up applied ONCE, after pro-ration, to the summed annual fee; tier components are floored to whole cents before summing"
    variants:
      - name: HOUSEHOLD_AGGREGATED
        when: "at least one household account has householding_consent IN {OP_IN, NONE}"
        difference: "runs the tier ladder once against the single aggregate household_fee_basis_cents; this is the value stored on Household.household_annual_fee_cents"
      - name: PER_ACCOUNT
        when: "every account of the household has householding_consent == OP_OUT"
        difference: "runs the same tier ladder independently per account (using account_fee_basis_cents) and sums the per-account annual fees; for identical data this yields a strictly larger annual fee than HOUSEHOLD_AGGREGATED whenever the household has more than one account, because the ladder is restarted at the lowest rate for each account"

  - name: block_trade_average_price_allocation
    trigger: "POST /block-orders/{id}/allocate"
    algorithm: waterfall_allocation
    formula: |
      total_requested = sum of requested_share_micros over allocations A whose
                        account has account_status == OPEN
      for each such allocation A:
          exact_A  = A.requested_share_micros * executed_share_micros / total_requested
          base_A   = floor(exact_A)
          remainder_A = exact_A - base_A
      residual = executed_share_micros - sum of base_A
      Assign the residual one micro-share at a time to allocations ordered by
      (remainder_A DESC, A.allocation_rank ASC); allocation_rank is client-supplied and
      unique per block, so the tie-break is total.
      A.share_micros = base_A (+1 if it won a residual unit)
      A.allocated_cost_cents = round_half_up( A.share_micros * execution_price_micros / 10000000000 )
      A.average_price_micros = round_half_up( A.allocated_cost_cents * 10000000000 / A.share_micros )
    input_set: |
      Allocations targeting an account with account_status != OPEN are excluded from
      total_requested and receive share_micros == null. For a SELL block the allocation
      direction reverses but the arithmetic is identical. A block whose
      executed_share_micros is 0 is rejected before allocation.
    constants:
      MICROS_PER_SHARE: 1000000
      MICROS_PER_CENT: 10000
      MICROS_TO_CENTS_DIVISOR: 10000000000
    precision: "allocated_cost_cents rounded half-up to whole cents; average_price_micros rounded half-up to whole micros"
    variants:
      - name: ALLOCATE_THEN_ROUND
        when: "the block is allocated and costed (the pinned production order)"
        difference: "rounds each allocation's cost to the cent independently, so the sum of allocated costs equals the block notional — no residual cent"
      - name: ROUND_THEN_ALLOCATE
        when: "an indicative preview read is requested (POST /block-orders/{id}/allocation-preview)"
        difference: "rounds the block-level notional once, then splits it proportionally; for a three-way split this drifts the sum of allocated costs away from ALLOCATE_THEN_ROUND whenever more than one allocation rounds up"

  - name: over_allocation_credit
    trigger: "POST /block-orders/{id}/settle and POST /block-orders/{id}/allocate"
    algorithm: compensating_invariant
    formula: |
      block_notional_cents = round_half_up( executed_share_micros * execution_price_micros / 10000000000 )
      allocated_total_cents = sum of A.allocated_cost_cents over ALL allocations
      drift_cents = allocated_total_cents - block_notional_cents
      if drift_cents > 0:
          distribute drift_cents as execution credits, one cent at a time, over
          allocations ordered by (allocated_cost_cents DESC, allocation_rank ASC)
          A.fee_rebate_cents += credit; A.allocation_status := REBATED
          recompute A.average_price_micros after the credit
      invariant: after credit distribution,
                 sum of A.allocated_cost_cents - sum of A.fee_rebate_cents == block_notional_cents
    input_set: "Every allocation of the block. Applies to both BUY and SELL blocks."
    constants:
      MICROS_PER_CENT: 10000
      MICROS_TO_CENTS_DIVISOR: 10000000000
    precision: "whole cents"
    variants:
      - name: CREDIT_TO_ALLOCATIONS
        when: "the block is still ALLOCATED and its allocations are not yet SETTLED"
        difference: "the drift is credited back onto the allocations themselves as fee_rebate_cents"
      - name: CREDIT_TO_HOUSEHOLD
        when: "the block was already SETTLED before this allocation basis was finalised"
        difference: "the drift is credited to the owning Household as a FeeCredit issued via POST /ria/households/{id}/fee-credits instead, leaving allocated_cost_cents untouched; BLOCK_RESET is applied first (fee_rebate_cents zeroed, statuses reset to ALLOCATED), so the block-level and household-level variants are provably exclusive and drift is never compensated twice"

  - name: alternative_valuation_haircut
    trigger: "POST /alternatives/{id}/accept-valuation"
    algorithm: threshold
    formula: |
      if V.valuation_age_days > 270:
          REJECT (the holding may not be admitted; stale_valuation := true)
      base = V.stated_value_cents * (1 - haircut_pct/10000)
      accepted = min( max(base, V.valuation_floor_cents), V.stated_value_cents )
      V.accepted_value_cents = accepted
    input_set: |
      Only holdings with asset_acceptance_status == UNDER_REVIEW and a firm entitlement
      ALTERNATIVE_ASSETS in state GRANTED. A holding whose asset_name collides with
      another UNDER_REVIEW holding on the same account is rejected before valuation.
    constants:
      HAIRCUT_BPS_YOUNG: 3500
      HAIRCUT_BPS_AGED: 2500
      AGE_THRESHOLD_DAYS: 270
    precision: "whole cents, round_half_up on the haircut product"
    variants:
      - name: HAIRCUT_AGED
        when: "valuation_age_days <= AGE_THRESHOLD_DAYS"
        difference: "applies HAIRCUT_BPS_AGED (2500 bps = 25.00%)"
      - name: HAIRCUT_STALE
        when: "valuation_age_days > AGE_THRESHOLD_DAYS"
        difference: "the holding is never admitted to the fee basis at all — accepted_value_cents stays null and stale_valuation := true, which removes it from C1 even if a later call re-supplies it"

  - name: cost_basis_carryover
    trigger: "AssetTransfer SUBMITTED -> RECEIVED and BASIS_REVIEW -> CREDITED"
    algorithm: chronological
    formula: |
      Process the transfer's lots in (lot_inventory_date ASC, symbol ASC) order.
      A.suspected_double_basis = true iff
          A.method == ACAT
          and an earlier AssetTransfer of the same receiving_account_id has
              transfer_status == CREDITED
              and shares at least one symbol with this transfer
      For each lot L:
          if L.sent_cost_basis_cents is null:                        L.basis_confidence_grade := NONE
          elif L.suspected_double_basis:                             L.basis_confidence_grade := LOW
          elif L.lot_inventory_date < the transfer's submission instant: L.basis_confidence_grade := HIGH
          else:                                                      L.basis_confidence_grade := MEDIUM
      carryover_cents = sum of L.sent_cost_basis_cents over lots with grade HIGH

      Unit note: cost_basis_carryover works on the transfer's inbound lots (each
      sent_cost_basis_cents is a whole-cent amount for the whole lot), whereas
      alternative_valuation_haircut works on a single holding's stated value.
      They are therefore NESTED rather than overlapping: a holding that arrives as
      a transfer lot keeps its carried basis until it is classified as an
      alternative asset, at which point the haircut chain takes over and
      C5's carried basis is EXCLUDED from the newly created AlternativeAssetHolding
      so the same cents are never counted twice in the fee basis.
    input_set: |
      Lots are included regardless of quantity, including quantity_micros == 0 lots
      (which contribute 0 cents but still participate in grading). A rejected transfer
      contributes 0 and its lots are discarded.
    constants:
      LOW_GRADE_ON_DOUBLE_BASIS: true
    precision: "whole cents"
    variants:
      - name: GRADED_CARRYOVER
        when: "the transfer is ACAT or DTC_NON_ACAT (a firm-to-firm delivery)"
        difference: "grades every lot and carries only HIGH-grade basis, leaving MEDIUM/LOW/NONE lots uncosted"
      - name: FULL_CARRYOVER
        when: "the transfer is DIRECT_ROLLOVER"
        difference: "carries every non-null sent basis regardless of grade; a rollover lot is never downgraded to LOW because rollovers are exempt from the double-basis suspicion"

  - name: money_movement_verification
    trigger: "POST /money-movements/{id}/authorize"
    algorithm: constraint_propagation
    formula: |
      Order is PINNED and sequential; the FIRST rule that fires wins:
        1. if M.authorization_note is blank                -> REJECT (ERR_AUTHORIZATION_NOTE_REQUIRED)
        2. if M.amount_cents > I.periodic_limit_cents - I.consumed_period_cents
                                                           -> REJECT (ERR_STANDING_LIMIT_EXCEEDED)
        3. if I.verification_status != VERIFIED            -> REJECT (ERR_STANDING_INSTRUCTION_NOT_VERIFIED)
        4. if I.round_trip_days >= 7                       -> REJECT (ERR_STANDING_INSTRUCTION_EXPIRED)
        5. if the account_type is in JURISDICTION_WITHHOLDING_TYPES:
               M.jurisdiction_withholding_required := true
               M.withheld_cents = min( floor(M.amount_cents * 1000 / 10000), M.amount_cents )
           else: M.withheld_cents = 0
      M.net_disbursed_cents = M.amount_cents - M.withheld_cents
    input_set: |
      Only movements whose account's HouseholdAccount.account_status == OPEN and whose
      firm firm_posture IN {OPEN, LIMITED} reach this rule at all. Movements on a FROZEN
      account are rejected earlier by the §1.4 state validation.
    constants:
      WITHHOLDING_RATE_BPS: 1000
      JURISDICTION_WITHHOLDING_TYPES: [IRA, ROTH_IRA]
    precision: "whole cents, floor on the withholding product"
    variants:
      - name: FIRST_BINDING_RULE
        when: "the movement is subject to more than one restriction"
        difference: "the first failing rule in the pinned order determines both the error and, when it does not reject, the withheld amount; a later rule never overrides an earlier one's withholding decision"
      - name: DOMINANT_RULE
        when: "a read-only recomputation is requested (GET /accounts/{id}/money-movements/summary)"
        difference: "reports the withdrawal amount each restriction would independently demand and returns the single largest one; on an account whose authorization chain is not fully propagated the probe returns the entitlement-level withdrawal (0) rather than the jurisdiction withholding, because the probe re-reads the posture chain before the movement row"

  - name: account_valuation_presentation
    trigger: "POST /accounts/{id}/list"
    algorithm: aggregation
    formula: |
      traditional_cents = round_half_up( sum over the account's positions P of
                            (P.quantity_micros * P.valuation_price_micros) / 1000000000000 )
      alt_cents         = sum over ACCEPTED, non-stale AlternativeAssetHolding rows of accepted_value_cents
      total_presented_cents = traditional_cents + alt_cents
      H.last_listed_cents := traditional_cents
    input_set: |
      All accounts regardless of account_status except CLOSED. Alternative holdings
      contribute to the presented total only when accepted and not stale.
      last_listed_cents intentionally excludes the alternative sleeve, while the C1 fee
      basis includes the accepted alternative sleeve, so the two derivations differ by
      exactly the accepted alternative value.
    constants:
      MICROS_PER_SHARE: 1000000
      MICROS_PER_CENT: 10000
      MICROS_TO_CENTS_DIVISOR: 10000000000
    precision: "whole cents, round_half_up at the position level"
    variants: []

  - name: firm_posture_derivation
    trigger: "after any mutation of CustodyAgreement, CustodyRulesEvidence, AdvisorFirmEntitlement, or AdminActionLog for the firm"
    algorithm: threshold
    formula: |
      Evaluate in this pinned order and stop at the first match:
        0. if the firm has an AdminActionLog row with admin_action_kind == REGULATORY_FREEZE and admin_action_status == ACTIVE
               -> firm_posture = FROZEN, reason = REGULATORY_FREEZE
        1. if the firm has zero CustodyAgreement rows with agreement_status == EXECUTED
               -> firm_posture = SUSPENDED, reason = CUSTODY_AGREEMENT_NOT_EXECUTED
        2. if any CustodyRulesEvidence row has requirement_status == DEFICIENT and critical == true
               -> firm_posture = LIMITED, reason = CUSTODY_EVIDENCE_DEFICIENT
        3. if any AdvisorFirmEntitlement row has entitlement_status == REVOKED
               -> firm_posture = LIMITED, reason = ENTITLEMENT_REVOKED
        4. if an AdminActionLog row of the firm has admin_action_status == UNACKNOWLEDGED
               -> firm_posture = LIMITED, reason = ADMIN_ACTION_UNACKNOWLEDGED
        5. if a CustodyAgreement row of the firm has agreement_status == TERMINATED
               -> firm_posture = SUSPENDED, reason = CUSTODY_AGREEMENT_TERMINATED
        6. otherwise -> firm_posture = OPEN, reason = null
      supervision_evidence_status := CLEAR     when every critical evidence row is ACCEPTED or WAIVED
                                  := DEFICIENT when any critical evidence row is DEFICIENT
                                  := UNKNOWN   when the firm has no critical evidence rows at all
    input_set: "All firm-scoped child rows of the four referenced entities, regardless of age."
    constants:
      CRITICAL_DEFICIENCY_IS_LIMITING: true
    precision: "not applicable (enum derivation)"
    variants: []

  - name: household_invariant_reconciliation
    trigger: "POST /invariants/evaluate and POST /accounts/{id}/list"
    algorithm: compensating_invariant
    formula: |
      basis_1 = AdvisorFirm.household_fee_basis_total_cents
      basis_2 = sum over the firm's Households H of H.household_fee_basis_cents
      basis_3 = sum over the firm's included HouseholdAccounts A of A.account_fee_basis_cents
      drift_household = basis_1 - basis_2
      drift_account   = basis_2 - basis_3
      invariant HOUSEHOLD_FEE_BASIS_RECONCILIATION is BROKEN when
          (drift_household != 0 or drift_account != 0)
          and the SystemConfig database_invariant_enforcement == ENFORCED
      observed_total_cents := basis_3 ; expected_total_cents := basis_1
      breach_detail_code := HOUSEHOLD_FEE_BASIS_TOTAL_DRIFT       when basis_1 != basis_3
                            HOUSEHOLD_FEE_BASIS_STALE_ROLLUP      when basis_1 == basis_3 and drift_household != 0
    input_set: "All households of the firm, including BILLING_HELD and CLOSED ones; C1's account inclusion filter is applied before summing."
    constants:
      MAX_TOLERANCE_CENTS: 0
    precision: "whole cents, exact equality (tolerance is 0)"
    variants: []

  - name: examination_bundle_assembly
    trigger: "POST /examination-bundles/{id}/generate and POST /examination-bundles/{id}/seal"
    algorithm: aggregation
    formula: |
      required_codes = the six CustodyRulesEvidence requirement codes
                       {QUALIFIED_CUSTODIAN, SURPRISE_EXAMINATION, CLIENT_NOTIFICATION,
                        TWO_PARTY_AUTHORIZATION, FEE_DISCLOSURE, ANNUAL_ATTESTATION}
                       plus the two movement-evidence codes
                       {STANDING_INSTRUCTION_AUTHORIZATION, FEE_CREDIT_DISCLOSURE}
      for each required code C:
          evidence_rows = CustodyRulesEvidence rows of the firm with requirement_code == C
                          and requirement_status IN {ACCEPTED, WAIVED}
                          and submitted_at within [period_start_date, period_end_date)
          if evidence_rows is empty: add C to missing_evidence_codes
      missing_evidence_codes := sorted ascending (lexicographic, stable)
      bundle_status := GENERATED when missing_evidence_codes is empty, else INCOMPLETE
      sealing is permitted only from GENERATED
    input_set: |
      Monetary movements counted toward the movement-evidence codes: the firm's
      MoneyMovementInstruction rows whose authorization instant falls in the
      half-open interval [period_start_date, period_end_date).
    constants:
      INTERVAL_INCLUSIVE_START: true
      INTERVAL_INCLUSIVE_END: false
    precision: "not applicable (set/count derivation)"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (50 rules, ordered by priority; the FIRST failure wins)
#
# Category ordering pinned for this scaffold (it encodes the priority):
#   auth(1-2) < existence(3-5) < state(6-13) < business_safety(14-27)
#   < business_constraint(28-39) < business_temporal(40-43) < business_referential(44)
#   < business_fiscal(45-50)
# Two-priority residual rule for the residual pair:
#   (a) POST /ria/billing-runs, priority 41 vs 45 -> residual priority 41 (business_temporal before business_fiscal)
#   (b) POST /ria/money-movements/{id}/authorize, priority 8 vs 23 -> residual priority 8 (state before business_safety)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is a role declared in §1.7"
    error_id: ERR_AUTHENTICATION_REQUIRED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the caller's X-User-Role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "the AdvisorFirm referenced by the first path parameter or by a body firm_id exists"
    error_id: ERR_FIRM_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints whose path or body carries a firm reference"

  - priority: 4
    category: existence
    check: "the remaining path parameters resolve to existing rows in §1.1, evaluated left-to-right, and every FK in the body resolves to an existing row"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: existence
    check: "the resolved child row is owned by the resolved parent row in the path (the CustodyAgreement belongs to that firm, the TransferLot belongs to that AssetTransfer, and so on)"
    error_id: ERR_PARENT_CHILD_MISMATCH
    http_status: 404
    applies_to: "all nested paths"

  - priority: 6
    category: state
    check: "the target row's state is the transition's declared from state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint in §1.5"

  - priority: 7
    category: state
    check: "the target row is not in a terminal state for its machine"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "every action endpoint whose entity declares terminal_states"

  - priority: 8
    category: state
    check: "the target row's HouseholdAccount.account_status is in the set the action requires (OPEN for every trading, movement and billing path)"
    error_id: ERR_ACCOUNT_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /ria/block-orders/{id}/submit, POST /ria/money-movements/{id}/submit, POST /ria/money-movements/{id}/authorize, POST /ria/assets/{id}/transfer-out, POST /ria/block-orders/{id}/allocate, POST /ria/billing-runs"

  - priority: 9
    category: state
    check: "the parent ModelPortfolio.model_status is APPROVED or ACTIVE when a block is submitted against it"
    error_id: ERR_MODEL_NOT_APPROVED
    http_status: 409
    applies_to: "POST /ria/block-orders/{id}/submit"

  - priority: 10
    category: state
    check: "the household's household_status is ACTIVE (a BILLING_HELD household cannot seed a new run)"
    error_id: ERR_HOUSEHOLD_BILLING_HELD
    http_status: 409
    applies_to: "POST /ria/billing-runs"

  - priority: 11
    category: state
    check: "the feed is not THROTTLED"
    error_id: ERR_FEED_THROTTLED
    http_status: 409
    applies_to: "POST /ria/data-feeds/{id}/pull"

  - priority: 12
    category: state
    check: "expected_model_portfolio_version matches ModelPortfolio.version"
    error_id: ERR_STALE_MODEL_VERSION
    http_status: 412
    applies_to: "POST /ria/models/{id}/rebalance"

  - priority: 12
    category: state
    check: "expected_block_order_version matches BlockOrder.version"
    error_id: ERR_STALE_BLOCK_VERSION
    http_status: 412
    applies_to: "POST /ria/block-orders/{id}/allocate"

  - priority: 12
    category: state
    check: "expected_household_version matches Household.version"
    error_id: ERR_STALE_HOUSEHOLD_VERSION
    http_status: 412
    applies_to: "POST /ria/accounts/{id}/relink"

  - priority: 13
    category: state
    check: "the supplied If-Match ETag matches the target row's current version"
    error_id: ERR_INVALID_IF_MATCH
    http_status: 412
    applies_to: "every PUT and every state-changing POST that carries If-Match"

  - priority: 13
    category: state
    check: "a state-changing PUT or POST carries an If-Match header at all"
    error_id: ERR_IF_MATCH_REQUIRED
    http_status: 428
    applies_to: "every PUT and every state-changing POST"

  - priority: 14
    category: business_safety
    check: "AdvisorFirm.firm_posture is not FROZEN"
    error_id: ERR_FIRM_FROZEN
    http_status: 403
    applies_to: "all write endpoints except POST /ria/admin-actions/{id}/acknowledge and POST /_clock/set_current_utc"

  - priority: 15
    category: business_safety
    check: "the entitlement named in the check has entitlement_status == GRANTED for the acting firm"
    error_id: ERR_ENTITLEMENT_NOT_GRANTED
    http_status: 403
    applies_to: "the entitlement-gated endpoints named in the description"
    description: "Gated endpoints: POST /ria/models/{id}/approve + /rebalance + /activate (MODEL_MANAGEMENT); POST /ria/block-orders/{id}/submit (TRADING_AUTHORIZATION and MODEL_MANAGEMENT); POST /ria/billing-runs (BILLING); POST /ria/alternatives/{id}/submit-valuation (ALTERNATIVE_ASSETS); POST /ria/data-feeds/{id}/provision (DATA_FEED); POST /ria/accounts/{id}/activate (TRADING_AUTHORIZATION or BILLING)."

  - priority: 16
    category: business_safety
    check: "the firm holds a CustodyAgreement with agreement_status == EXECUTED and the referenced agreement is that same current agreement"
    error_id: ERR_CUSTODY_AGREEMENT_REQUIRED
    http_status: 409
    applies_to: "POST /ria/accounts/{id}/activate, POST /ria/firm-entitlements/{id}/grant, POST /ria/firm-entitlements/{id}/reopen, POST /ria/models/{id}/approve, POST /ria/assets/{id}/accept-basis, POST /ria/firms/{id}/custody-agreements/execute"

  - priority: 17
    category: business_safety
    check: "AdvisorFirm.firm_posture == OPEN for trading-path actions"
    error_id: ERR_FIRM_NOT_OPEN_FOR_TRADING
    http_status: 409
    applies_to: "POST /ria/block-orders/{id}/submit, POST /ria/block-orders/{id}/execute, POST /ria/models/{id}/activate, POST /ria/money-movements/{id}/submit, POST /ria/data-feeds/{id}/provision"

  - priority: 18
    category: business_safety
    check: "the acting X-User-ID differs from the recorded drafter on a two-party control"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /ria/firms/{id}/custody-agreements/execute, POST /ria/custody-evidence/{id}/accept, POST /ria/custody-evidence/{id}/reject"

  - priority: 19
    category: business_safety
    check: "CustodyRulesEvidence.evidence_round_number is strictly less than 4"
    error_id: ERR_EVIDENCE_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /ria/custody-evidence/{id}/resubmit"

  - priority: 20
    category: business_safety
    check: "no sibling AdvisorFirmEntitlement of the firm already holds the same entitlement_code in state GRANTED"
    error_id: ERR_ENTITLEMENT_DUPLICATE
    http_status: 409
    applies_to: "POST /ria/firm-entitlements, POST /ria/firm-entitlements/{id}/grant"

  - priority: 21
    category: business_safety
    check: "the entitlement's requested_custody_agreement_id is the firm's current EXECUTED agreement"
    error_id: ERR_ENTITLEMENT_AGREEMENT_SUPERSEDED
    http_status: 409
    applies_to: "POST /ria/firm-entitlements/{id}/grant, POST /ria/accounts/{id}/activate"

  - priority: 22
    category: business_safety
    check: "the firm holds no AdminActionLog row with admin_action_status == UNACKNOWLEDGED that blocks the requested two-party action"
    error_id: ERR_ADMIN_ACTION_OUTSTANDING
    http_status: 409
    applies_to: "POST /ria/firms/{id}/custody-agreements/execute, POST /ria/custody-evidence/{id}/accept"

  - priority: 23
    category: business_safety
    check: "the linked StandingInstruction.verification_status == VERIFIED"
    error_id: ERR_STANDING_INSTRUCTION_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /ria/money-movements/{id}/authorize"

  - priority: 24
    category: business_safety
    check: "the linked StandingInstruction.round_trip_days is strictly less than 7"
    error_id: ERR_STANDING_INSTRUCTION_EXPIRED
    http_status: 409
    applies_to: "POST /ria/money-movements/{id}/authorize"

  - priority: 25
    category: business_safety
    check: "the account hosts no second AlternativeAssetHolding with asset_acceptance_status == UNDER_REVIEW"
    error_id: ERR_AMBIGUOUS_VALUATION_BINDING
    http_status: 409
    applies_to: "POST /ria/alternatives/{id}/accept-valuation"

  - priority: 26
    category: business_safety
    check: "no firm-scoped FirmDatabaseInvariant with invariant_status == BROKEN exists while database_invariant_enforcement == ENFORCED"
    error_id: ERR_INVARIANT_CHAIN_BROKEN
    http_status: 409
    applies_to: "POST /ria/billing-runs, POST /ria/data-feeds/{id}/provision, POST /ria/invariants/evaluate"

  - priority: 27
    category: business_safety
    check: "the firm has zero HouseholdAccount rows with account_status == OPEN"
    error_id: ERR_OPEN_ACCOUNTS_BLOCK_TERMINATION
    http_status: 409
    applies_to: "POST /ria/firms/{id}/custody-agreements/{agreement_id}/terminate"

  - priority: 29
    category: business_constraint
    check: "sum of ModelTarget.target_weight_bps for the model equals exactly 10000"
    error_id: ERR_MODEL_WEIGHTS_INVALID
    http_status: 422
    applies_to: "POST /ria/models/{id}/approve, POST /ria/models/{id}/targets, PUT /ria/model-targets/{id}"

  - priority: 30
    category: business_constraint
    check: "sum of BlockAllocation.requested_share_micros is greater than or equal to BlockOrder.executed_share_micros, and each allocation_rank is unique within the block"
    error_id: ERR_ALLOCATION_NOT_CONSISTENT
    http_status: 422
    applies_to: "POST /ria/block-orders/{id}/submit, POST /ria/block-orders/{id}/allocations"

  - priority: 31
    category: business_constraint
    check: "BlockOrder.unallocated_share_micros == 0"
    error_id: ERR_ALLOCATION_INCOMPLETE
    http_status: 409
    applies_to: "POST /ria/block-orders/{id}/settle"

  - priority: 32
    category: business_constraint
    check: "at least one allocation targets an OPEN account and executed_share_micros is greater than 0"
    error_id: ERR_NO_ELIGIBLE_ALLOCATION_TARGET
    http_status: 409
    applies_to: "POST /ria/block-orders/{id}/allocate"

  - priority: 33
    category: business_constraint
    check: "StandingInstruction.periodic_limit_cents - StandingInstruction.consumed_period_cents is greater than or equal to MoneyMovementInstruction.amount_cents"
    error_id: ERR_STANDING_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /ria/money-movements/{id}/authorize"

  - priority: 34
    category: business_constraint
    check: "MoneyMovementInstruction.authorization_note is non-empty"
    error_id: ERR_AUTHORIZATION_NOTE_REQUIRED
    http_status: 422
    applies_to: "POST /ria/money-movements/{id}/authorize"

  - priority: 35
    category: business_constraint
    check: "AlternativeAssetHolding.stated_value_cents is greater than or equal to valuation_floor_cents"
    error_id: ERR_VALUATION_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /ria/alternatives/{id}/accept-valuation"

  - priority: 36
    category: business_constraint
    check: "the account hosts no other AlternativeAssetHolding with the same asset_name in state UNDER_REVIEW"
    error_id: ERR_DUPLICATE_ALTERNATIVE_HOLDING
    http_status: 409
    applies_to: "POST /ria/alternatives/{id}/accept-valuation"

  - priority: 37
    category: business_constraint
    check: "issuing this FeeCredit would push the household's outstanding credit balance in credit_status IN {AVAILABLE, PARTIALLY_APPLIED} above its household_annual_fee_cents"
    error_id: ERR_CREDIT_EXCEEDS_FEE
    http_status: 422
    applies_to: "POST /ria/households/{id}/fee-credits"

  - priority: 38
    category: business_constraint
    check: "the ExaminationBundle is in GENERATED state before sealing"
    error_id: ERR_BUNDLE_NOT_SEALABLE
    http_status: 409
    applies_to: "POST /ria/examination-bundles/{id}/seal"

  - priority: 39
    category: business_constraint
    check: "every area named by the batch kind is reachable: for ONBOARDING_BATCH kind ACCOUNTS the household must be non-CLOSED; for kind TRANSFERS the receiving account must be OPEN or FROZEN; for kind EVIDENCE the firm must have a DB row of the kind's entity"
    error_id: ERR_ONBOARDING_BATCH_NOT_DISPATCHABLE
    http_status: 409
    applies_to: "PUT /ria/onboarding-batches/{id}"

  - priority: 40
    category: business_constraint
    check: "a batch dispatch is idempotent: rows whose natural key already exists are skipped rather than duplicated"
    error_id: ERR_ONBOARDING_BATCH_NOT_DISPATCHABLE
    http_status: 409
    applies_to: "PUT /ria/onboarding-batches/{id}"
    description: "This row documents the idempotent-skip semantics rather than an additional rejection; the same error id is reused so the dispatch contract stays single-valued."

  - priority: 41
    category: business_temporal
    check: "AlternativeAssetHolding.valuation_age_days is less than or equal to 270"
    error_id: ERR_VALUATION_STALE
    http_status: 422
    applies_to: "POST /ria/alternatives/{id}/accept-valuation"

  - priority: 42
    category: business_temporal
    check: "FeeBillingRun.period_end_date is strictly after period_start_date"
    error_id: ERR_BILLING_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /ria/billing-runs"

  - priority: 43
    category: business_temporal
    check: "the requested listing instant falls at or after the account's previous last_listed_at plus one hour"
    error_id: ERR_LISTING_COOLDOWN
    http_status: 409
    applies_to: "POST /ria/accounts/{id}/list"
    description: "Half-open interval [previous last_listed_at, previous last_listed_at + 1 hour). A listing request inside that window collides with the previous listing's occupation of the account's listing slot, and that calendar slot is acknowledged by the caller via If-Match on the account's ETag."

  - priority: 44
    category: business_temporal
    check: "the requested valuation_as_of_date does not land on a calendar day already occupied by an accepted valuation for the same asset_name on the same account"
    error_id: ERR_DUPLICATE_VALUATION_PERIOD
    http_status: 409
    applies_to: "POST /ria/alternatives/{id}/submit-valuation"

  - priority: 45
    category: business_referential
    check: "every FK written in the request body points at a row the acting firm owns (cross-firm reference integrity)"
    error_id: ERR_REFERENCE_MISMATCH
    http_status: 422
    applies_to: "all"

  - priority: 46
    category: business_fiscal
    check: "Household.household_fee_basis_cents is strictly greater than 0"
    error_id: ERR_FEE_BASIS_ZERO
    http_status: 409
    applies_to: "POST /ria/billing-runs"

  - priority: 47
    category: business_fiscal
    check: "FeeBillingRun.stated_invoice_cents equals the recomputed net_fee_cents"
    error_id: ERR_FEE_INVOICE_MISMATCH
    http_status: 409
    applies_to: "POST /ria/billing-runs/{id}/settle"
    description: "POST /ria/billing-runs/{id}/remit-invoice never rejects on mismatch: it records the stated invoice and transitions the run SETTLED -> INVOICE_MISMATCH (200), holding the household's billing. The error is raised on the later re-settle attempt while the mismatch still stands."

  - priority: 48
    category: business_fiscal
    check: "Household.household_fee_basis_cents is at least 250000000 before a run may be seeded"
    error_id: ERR_FEE_BASIS_BELOW_MINIMUM
    http_status: 409
    applies_to: "POST /ria/billing-runs"
    description: "Boundary is inclusive: a household basis of exactly 250000000 is accepted, 249999999 is not."

# =============================================================================
# §1.5 API Endpoint Table (131 endpoints; If-Match expected on every PUT and state-changing POST)
# =============================================================================
endpoints:

  # ---- clock / config / invariants / audit (test-driving + ops surface) -----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "TEST-DRIVING. Moves the server's logical clock. Server startup default is fixed at 2026-09-01T00:00:00Z; before any call to this endpoint the logical clock reads exactly that default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["sets the logical clock; recomputes valuation_age_days, round_trip_days and every temporal window"]

  - method: POST
    path: "/ria/systems/config"
    description: "Create the single SystemConfig row that toggles database invariant enforcement."
    roles: [PlatformAdmin]
    code: 201
    input: [database_invariant_enforcement]
    output: SystemConfig
    side_effects: ["none"]

  - method: PATCH
    path: "/ria/systems/config/{id}"
    description: "Flip database_invariant_enforcement between WARN and ENFORCED."
    roles: [PlatformAdmin]
    code: 200
    input: [database_invariant_enforcement, "if_match?"]
    output: SystemConfig
    side_effects: ["increments SystemConfig.version by 1"]

  - method: POST
    path: "/ria/invariants/evaluate"
    description: "Device-level invariant sweep: recomputes every FirmDatabaseInvariant of a firm, stores the resulting invariant_status and breach_detail_code, and runs C11's household reconciliation. Requires an ETag for the firm."
    roles: [CustodyOperationsOfficer, PlatformAdmin]
    code: 200
    input: [firm_id, "if_match?"]
    output: DatabaseInvariant[]
    side_effects: ["provisions any of the four DatabaseInvariant codes the firm does not yet have (CUSTODY_AGREEMENT_CONSISTENCY, TRANSFER_BASIS_CONSERVATION, HOUSEHOLD_FEE_BASIS_RECONCILIATION, CASCADE_ECONOMIC_EFFECT)", "recompute C11", "sets DatabaseInvariant.last_evaluated_at and written invariant_status", "increments AdvisorFirm.version by 1"]

  - method: GET
    path: "/ria/firms/{id}/invariants"
    description: "List a firm's database invariants."
    roles: [ComplianceReviewer, PlatformAdmin, CustodyOperationsOfficer]
    code: 200
    input: ["firm_id?"]
    output: DatabaseInvariant[]
    side_effects: ["none"]

  - method: POST
    path: "/ria/admin-actions/issue"
    description: "Regulator issues an admin action against a firm. A REGULATORY_FREEZE action is created ACTIVE and forces firm_posture FROZEN via C10's level-0 rule; a DEFICIENCY_NOTICE action is created UNACKNOWLEDGED and forces firm_posture LIMITED until acknowledged."
    roles: [PlatformAdmin]
    code: 201
    input: [firm_id, admin_action_kind, admin_action_detail]
    output: AdminActionLog
    side_effects: ["AdminActionLog.admin_action_status := ACTIVE for REGULATORY_FREEZE, UNACKNOWLEDGED for DEFICIENCY_NOTICE", "recompute C10 AdvisorFirm.firm_posture"]

  - method: GET
    path: "/ria/firms/{id}/admin-actions"
    description: "List a firm's admin actions."
    roles: [ComplianceReviewer, PlatformAdmin, CustodyOperationsOfficer]
    code: 200
    input: ["firm_id?"]
    output: AdminActionLog[]
    side_effects: ["none"]

  - method: POST
    path: "/ria/admin-actions/{id}/acknowledge"
    description: "Firm acknowledges an admin action; clears both the UNACKNOWLEDGED limitation and the ACTIVE regulatory freeze, returning the firm's posture to whatever C10's lower rules then dictate."
    roles: [AdvisorOperationsLead, CustodyOperationsOfficer]
    code: 200
    input: [acknowledged_note]
    output: AdminActionLog
    side_effects: ["AdminActionLog.admin_action_status := ACKNOWLEDGED", "records acknowledged_by_user_id", "recompute C10 AdvisorFirm.firm_posture"]

  # ---- firms ---------------------------------------------------------------
  - method: POST
    path: "/ria/firms"
    description: "Register an adviser firm."
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, crd_number, home_state_code]
    output: AdvisorFirm
    side_effects: ["CustodyRulesEvidence and FirmDatabaseInvariant rows are NOT auto-created", "firm_posture initialised SUSPENDED by C10 (no executed agreement yet)"]

  - method: GET
    path: "/ria/firms/{id}"
    description: "Read one firm, including derived posture, agreement status and consolidated fee basis total."
    roles: [PlatformAdmin, CustodyOperationsOfficer, ComplianceReviewer, AdvisorOperationsLead]
    code: 200
    input: []
    output: AdvisorFirm
    side_effects: ["none"]

  - method: GET
    path: "/ria/firms"
    description: "List firms with pagination and posture filter."
    roles: [PlatformAdmin, ComplianceReviewer, CustodyOperationsOfficer]
    code: 200
    input: ["firm_posture?", "limit?", "offset?"]
    output: AdvisorFirm[]
    side_effects: ["none"]

  - method: POST
    path: "/ria/firms/{id}/freeze"
    description: "Regulatory freeze; cascades cancellations and reopens settled billing runs."
    roles: [ComplianceReviewer]
    code: 200
    input: [freeze_reason_code]
    output: AdvisorFirm
    side_effects: ["AdvisorFirm.firm_posture := FROZEN", "cancels non-terminal MoneyMovementInstructions", "reopens SETTLED FeeBillingRuns", "throttles ACTIVE DataFeedProvisions", "increments AdvisorFirm.version by 1"]

  - method: POST
    path: "/ria/firms/{id}/custody-agreements"
    description: "Draft a custody agreement for a firm."
    roles: [AdvisorOperationsLead]
    code: 201
    input: [adviser_crd_number]
    output: CustodyAgreement
    side_effects: ["CustodyAgreement.agreement_status := DRAFT"]

  - method: GET
    path: "/ria/firms/{id}/custody-agreements"
    description: "List a firm's custody agreements including superseded and terminated ones."
    roles: [AdvisorOperationsLead, CustodyOperationsOfficer, ComplianceReviewer, PlatformAdmin]
    code: 200
    input: ["agreement_status?"]
    output: CustodyAgreement[]
    side_effects: ["none"]

  - method: GET
    path: "/ria/custody-agreements/{id}"
    description: "Read one custody agreement."
    roles: [AdvisorOperationsLead, CustodyOperationsOfficer, ComplianceReviewer, PlatformAdmin]
    code: 200
    input: []
    output: CustodyAgreement
    side_effects: ["none"]

  - method: POST
    path: "/ria/custody-agreements/{id}/submit"
    description: "Submit a draft agreement for counter-signature."
    roles: [AdvisorOperationsLead]
    code: 200
    input: ["if_match?"]
    output: CustodyAgreement
    side_effects: ["CustodyAgreement.agreement_status := PENDING_SIGNATURE", "records drafted_by_user_id", "increments CustodyAgreement.version by 1"]

  - method: POST
    path: "/ria/custody-agreements/{id}/revert"
    description: "Revert a submitted agreement back to draft."
    roles: [AdvisorOperationsLead]
    code: 200
    input: ["if_match?"]
    output: CustodyAgreement
    side_effects: ["CustodyAgreement.agreement_status := DRAFT", "clears drafted_by_user_id", "increments CustodyAgreement.version by 1"]

  - method: POST
    path: "/ria/firms/{id}/custody-agreements/execute"
    description: "Countersign the firm's pending agreement. The executing officer must differ from the drafter (segregation of duties)."
    roles: [CustodyOperationsOfficer]
    code: 200
    input: ["if_match?"]
    output: CustodyAgreement
    side_effects: ["CustodyAgreement.agreement_status := EXECUTED", "mints countersignature_hash", "supersedes any prior EXECUTED agreement", "revokes entitlements pointing at superseded agreements", "recompute C10", "increments AdvisorFirm.version and CustodyAgreement.version by 1"]

  - method: POST
    path: "/ria/firms/{id}/custody-agreements/{agreement_id}/terminate"
    description: "Terminate the firm's current agreement; only permitted when no account is open."
    roles: [CustodyOperationsOfficer]
    code: 200
    input: ["if_match?"]
    output: CustodyAgreement
