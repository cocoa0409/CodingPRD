              payload: { season_id: "${season_id}", previous_stop_id: "${stop0_id}", stop_type: "SHOW", venue_name: "Sioux Falls Bowl", city: "Sioux Falls", state_code: "SD", arrive_at: "2027-06-19T12:00:00Z", depart_at: "2027-06-19T23:59:00Z", show_start_at: "2027-06-19T20:30:00Z", travel_miles_from_previous: 352, uniform_trunks: 40, instrument_cases: 95, prop_units: 25, truck_count: 4, rehearsal_minutes: 150, heat_index_f: 84 }
              as: TourManager
              captures: { stop_big_id: "$.data.id" }
            - call: "POST /tour-stops"
              payload: { season_id: "${season_id}", previous_stop_id: "${stop_big_id}", stop_type: "SHOW", venue_name: "Lincoln Field", city: "Lincoln", state_code: "NE", arrive_at: "2027-06-20T13:00:00Z", depart_at: "2027-06-20T23:59:00Z", show_start_at: "2027-06-20T20:30:00Z", travel_miles_from_previous: 349, uniform_trunks: 40, instrument_cases: 95, prop_units: 24, truck_count: 2, rehearsal_minutes: 150, heat_index_f: 84 }
              as: TourManager
              captures: { stop_small_id: "$.data.id" }
