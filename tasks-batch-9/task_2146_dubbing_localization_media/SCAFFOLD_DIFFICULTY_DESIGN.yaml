  - rule_id: combinatorial_formula
    instances:
      - name: session_cost_rounds_each_line_item_before_summing
        grounds:
          - calculations.session_cost_cents
          - entities.RecordingSession.fields.session_cost_cents
          - state_machines.RecordingSession.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Mode (b) nested rounding with a pinned order: rounding the studio line (10750.5), the talent line (8127.5) and the union uplift (1015.9375) to whole cents FIRST and then summing yields 19895, while summing the raw values and rounding once yields 19894 - a one-cent split that only the pinned order resolves.
