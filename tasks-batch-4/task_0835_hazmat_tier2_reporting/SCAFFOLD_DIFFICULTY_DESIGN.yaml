# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine Difficulty Rules × 2 instances = 18 instances.
# All setup_api_calls / trigger chains are executable from empty-DB using only
# §1.5 endpoints. Formula-derived asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: inventory_max_vs_average_amount
        grounds:
          - calculations.reportable_amount
          - entities.ChemicalInventory.fields.reportable_amount_lbs
          - entities.ChemicalInventory.fields.average_onsite_lbs
          - entities.ChemicalInventory.fields.is_reportable
        distinguishing_aspect: |
          On one ChemicalInventory row the MAX variant (reportable_amount_lbs = max_daily_amount_lbs = 12000)
          drives is_reportable while the AVERAGE variant (average_onsite_lbs = average_daily_amount_lbs = 4000)
          never touches a threshold; same row, two different lbs values.
        test_recipe:
          setup:
            - "A facility and a non-EHS chemical (threshold 10000 lb) exist."
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "Acme Plant", epa_facility_id: "TX-0001", state_code: "TX", county: "Harris", operator_name: "Acme LLC" }
              as: Regulator
              captures: { fac_id: $.data.id }
            - call: "POST /epcra/chemicals"
              payload: { cas_number: "7440-01-1", name: "Argon-Mix", is_ehs: false, rq_lbs: 1000, hazard_weight: 0.2, physical_state: "SOLID" }
              as: Regulator
              captures: { chem_id: $.data.id }
          trigger:
            - call: "POST /epcra/chemical-inventories"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", reporting_year: 2025, max_daily_amount_lbs: 12000, average_daily_amount_lbs: 4000, days_on_site: 200, storage_type: "TANK" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { inv_id: $.data.id }
          assert:
            - "ChemicalInventory.${inv_id}.reportable_amount_lbs == 12000"
            - "ChemicalInventory.${inv_id}.average_onsite_lbs == 4000"
            - "ChemicalInventory.${inv_id}.is_reportable == true"
            - "ChemicalInventory.${inv_id}.reportable_amount_lbs != ChemicalInventory.${inv_id}.average_onsite_lbs"

      - name: filing_provisional_vs_assessed_fee
        grounds:
          - calculations.tier_ii_filing_fee
          - entities.TierIIFiling.fields.provisional_fee_cents
          - entities.TierIIFiling.fields.assessed_fee_cents
        distinguishing_aspect: |
          On the TierIIFiling entity domain (not ChemicalInventory) the PROVISIONAL variant (flat per declared
          row = 7000) diverges from the ASSESSED variant (tiered reportable + EHS surcharge = 10000) for identical
          single-EHS-chemical inventory.
        test_recipe:
          setup:
            - "Facility with one reportable EHS chemical (tpq 100) inventory for 2025 and an ACTIVE SDS; a DRAFT filing."
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "Beta Chem", epa_facility_id: "TX-0002", state_code: "TX", county: "Harris", operator_name: "Beta Inc" }
              as: Regulator
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /epcra/chemicals"
              payload: { cas_number: "7782-50-5", name: "Chlorine", is_ehs: true, tpq_lbs: 100, rq_lbs: 10, hazard_weight: 0.5, physical_state: "GAS" }
              as: Regulator
              captures: { chem_id: $.data.id }
            - call: "POST /epcra/chemical-inventories"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", reporting_year: 2025, max_daily_amount_lbs: 200, average_daily_amount_lbs: 150, days_on_site: 300, storage_type: "CYLINDER" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /epcra/sds"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", document_ref: "sds://chlorine-v1", revision_date: "2025-01-02T00:00:00Z", expected_facility_version: "${fac_v}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /epcra/tier-ii-filings"
              payload: { facility_id: "${fac_id}", reporting_year: 2025 }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { fil_id: $.data.id, prov_fee: $.data.provisional_fee_cents }
          trigger:
            - call: "POST /epcra/tier-ii-filings/${fil_id}/submit"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { assessed: $.data.assessed_fee_cents }
          assert:
            - "TierIIFiling.${fil_id}.provisional_fee_cents == 7000"
            - "TierIIFiling.${fil_id}.assessed_fee_cents == 10000"
            - "TierIIFiling.${fil_id}.provisional_fee_cents != TierIIFiling.${fil_id}.assessed_fee_cents"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: threshold_ehs_branch_nested_min
        grounds:
          - calculations.applicable_threshold_determination
          - entities.ChemicalInventory.fields.applicable_threshold_lbs
          - entities.ChemicalInventory.fields.is_reportable
          - entities.ChemicalInventory.fields.exceeds_tpq
        distinguishing_aspect: |
          Mode (a): applicable_threshold_lbs = min(tpq_lbs=800, EHS_TPQ_CAP_LBS=500) = 500 combines a conditional
          branch on is_ehs with a nested min over three inputs; is_reportable(600>=500)=true but exceeds_tpq(600>=800)=false.
        test_recipe:
          setup:
            - "Facility and an EHS chemical with tpq 800 lb."
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "Gamma Storage", epa_facility_id: "TX-0003", state_code: "TX", county: "Galveston", operator_name: "Gamma Co" }
              as: Regulator
              captures: { fac_id: $.data.id }
            - call: "POST /epcra/chemicals"
              payload: { cas_number: "7664-41-7", name: "Ammonia", is_ehs: true, tpq_lbs: 800, rq_lbs: 100, hazard_weight: 0.3, physical_state: "GAS" }
              as: Regulator
              captures: { chem_id: $.data.id }
          trigger:
            - call: "POST /epcra/chemical-inventories"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", reporting_year: 2025, max_daily_amount_lbs: 600, average_daily_amount_lbs: 400, days_on_site: 250, storage_type: "TANK" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { inv_id: $.data.id }
          assert:
            - "ChemicalInventory.${inv_id}.applicable_threshold_lbs == 500"
            - "ChemicalInventory.${inv_id}.is_reportable == true"
            - "ChemicalInventory.${inv_id}.exceeds_tpq == false"

      - name: hazard_index_round_then_sum
        grounds:
          - calculations.facility_hazard_index
          - entities.Facility.fields.hazard_index
          - entities.ChemicalInventory.fields.weighted_hazard_contribution
        distinguishing_aspect: |
          Mode (b): three inventories each yield round((1000/1000)*0.125,2)=0.13; round-then-sum gives
          hazard_index=0.39, whereas sum-then-round of 0.375 would give 0.38 — the pinned rounding order decides.
        test_recipe:
          setup:
            - "Facility and a chemical with hazard_weight 0.125; three ACTIVE inventories each with max_daily 1000 lb."
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "Delta Depot", epa_facility_id: "TX-0004", state_code: "TX", county: "Brazoria", operator_name: "Delta Co" }
              as: Regulator
              captures: { fac_id: $.data.id }
            - call: "POST /epcra/chemicals"
              payload: { cas_number: "64-17-5", name: "Ethanol", is_ehs: false, rq_lbs: 5000, hazard_weight: 0.125, physical_state: "LIQUID" }
              as: Regulator
              captures: { chem_id: $.data.id }
            - call: "POST /epcra/chemical-inventories"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", reporting_year: 2025, max_daily_amount_lbs: 1000, average_daily_amount_lbs: 800, days_on_site: 100, storage_type: "DRUM" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { inv1_id: $.data.id, contrib1: $.data.weighted_hazard_contribution }
            - call: "POST /epcra/chemical-inventories"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", reporting_year: 2025, max_daily_amount_lbs: 1000, average_daily_amount_lbs: 800, days_on_site: 100, storage_type: "DRUM" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /epcra/chemical-inventories"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", reporting_year: 2025, max_daily_amount_lbs: 1000, average_daily_amount_lbs: 800, days_on_site: 100, storage_type: "DRUM" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
          trigger:
            - call: "GET /epcra/facilities/${fac_id}"
              payload: {}
              as: Regulator
              captures: { hz: $.data.hazard_index }
          assert:
            - "ChemicalInventory.${inv1_id}.weighted_hazard_contribution == 0.13"
            - "Facility.${fac_id}.hazard_index == 0.39"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: filing_revision_cycle_back_edge
        grounds:
          - state_machines.TierIIFiling.UNDER_REVIEW_to_RETURNED_FOR_REVISION
          - state_machines.TierIIFiling.RETURNED_FOR_REVISION_to_SUBMITTED
          - entities.TierIIFiling.fields.revision_count
        distinguishing_aspect: |
          TierIIFiling is cyclic: after RETURN the filing re-enters SUBMITTED via submit (a back-edge
          RETURNED_FOR_REVISION->SUBMITTED), with revision_count == 1 — impossible in a linear pipeline.
        test_recipe:
          setup:
            - "Facility with one reportable EHS inventory + ACTIVE SDS; filing submitted, moved to UNDER_REVIEW, then RETURNED_FOR_REVISION."
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "Epsilon Works", epa_facility_id: "TX-0005", state_code: "TX", county: "Harris", operator_name: "Epsilon Co" }
              as: Regulator
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /epcra/chemicals"
              payload: { cas_number: "7782-50-5", name: "Chlorine", is_ehs: true, tpq_lbs: 100, rq_lbs: 10, hazard_weight: 0.5, physical_state: "GAS" }
              as: Regulator
              captures: { chem_id: $.data.id }
            - call: "POST /epcra/chemical-inventories"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", reporting_year: 2025, max_daily_amount_lbs: 200, average_daily_amount_lbs: 150, days_on_site: 300, storage_type: "CYLINDER" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /epcra/sds"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", document_ref: "sds://chlorine-v1", revision_date: "2025-01-02T00:00:00Z", expected_facility_version: "${fac_v}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /epcra/tier-ii-filings"
              payload: { facility_id: "${fac_id}", reporting_year: 2025 }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { fil_id: $.data.id }
            - call: "POST /epcra/tier-ii-filings/${fil_id}/submit"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /epcra/tier-ii-filings/${fil_id}/review"
              payload: { decision: "BEGIN" }
              as: Regulator
            - call: "POST /epcra/tier-ii-filings/${fil_id}/review"
              payload: { decision: "RETURN" }
              as: Regulator
          trigger:
            - call: "POST /epcra/tier-ii-filings/${fil_id}/submit"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { st: $.data.status }
          assert:
            - "TierIIFiling.${fil_id}.status == SUBMITTED"
            - "TierIIFiling.${fil_id}.revision_count == 1"

      - name: release_parallel_reporting_remediation
        grounds:
          - state_machines.ReleaseNotification.remediation_ONGOING_to_CONTAINED
          - entities.ReleaseNotification.fields.reporting_status
          - entities.ReleaseNotification.fields.remediation_status
        distinguishing_aspect: |
          Advancing remediation_status to CONTAINED leaves reporting_status at PENDING_VERBAL — the two
          dimensions of the same ReleaseNotification row evolve independently.
        test_recipe:
          setup:
            - "Facility and a chemical (rq 1000); a below-RQ release (100 lb) reported, so no cascade fires."
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "Zeta Yard", epa_facility_id: "TX-0006", state_code: "TX", county: "Harris", operator_name: "Zeta Co" }
              as: Regulator
              captures: { fac_id: $.data.id }
            - call: "POST /epcra/chemicals"
              payload: { cas_number: "67-56-1", name: "Methanol", is_ehs: false, rq_lbs: 1000, hazard_weight: 0.1, physical_state: "LIQUID" }
              as: Regulator
              captures: { chem_id: $.data.id }
            - call: "POST /epcra/release-notifications"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", release_datetime: "2026-02-01T00:00:00Z", quantity_released_lbs: 100, medium: "SOIL" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { rel_id: $.data.id }
          trigger:
            - call: "POST /epcra/release-notifications/${rel_id}/remediation"
              payload: { to: "CONTAINED" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { rem: $.data.remediation_status, rep: $.data.reporting_status }
          assert:
            - "ReleaseNotification.${rel_id}.remediation_status == CONTAINED"
            - "ReleaseNotification.${rel_id}.reporting_status == PENDING_VERBAL"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: release_rq_to_case_to_enforcement_to_permit_suspend
        grounds:
          - state_machines.ReleaseNotification.create_to_PENDING_VERBAL
          - state_machines.Permit.ACTIVE_to_SUSPENDED
          - entities.Facility.fields.compliance_posture
          - entities.ComplianceCase.fields.origin
        distinguishing_aspect: |
          Depth-3 chain from a single release POST: release(exceeds_rq)->ComplianceCase(RELEASE_RQ_EXCEEDED,HIGH)
          ->Facility.compliance_posture=ENFORCEMENT->ACTIVE Permit=SUSPENDED, each hop caused by the previous.
        test_recipe:
          setup:
            - "Facility with an ACTIVE OPERATING permit valid through 2027, and a chemical with rq 50 lb."
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "Eta Terminal", epa_facility_id: "TX-0007", state_code: "TX", county: "Jefferson", operator_name: "Eta Co" }
              as: Regulator
              captures: { fac_id: $.data.id }
            - call: "POST /epcra/permits"
              payload: { facility_id: "${fac_id}", permit_type: "OPERATING", issued_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z", fee_cents: 25000 }
              as: Regulator
              captures: { permit_id: $.data.id }
            - call: "POST /epcra/chemicals"
              payload: { cas_number: "7647-01-0", name: "Hydrogen Chloride", is_ehs: true, tpq_lbs: 500, rq_lbs: 50, hazard_weight: 0.4, physical_state: "GAS" }
              as: Regulator
              captures: { chem_id: $.data.id }
          trigger:
            - call: "POST /epcra/release-notifications"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", release_datetime: "2026-02-15T00:00:00Z", quantity_released_lbs: 100, medium: "AIR" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { rel_id: $.data.id, exceeds: $.data.exceeds_rq }
            - call: "GET /epcra/facilities/${fac_id}"
              payload: {}
              as: Regulator
              captures: { posture: $.data.compliance_posture }
            - call: "GET /epcra/facilities/${fac_id}/permits"
              payload: {}
              as: Regulator
              captures: { permit_status_0: "$.data[0].status" }
            - call: "GET /epcra/facilities/${fac_id}/compliance-cases"
              payload: {}
              as: Regulator
              captures: { case_origin_0: "$.data[0].origin", case_severity_0: "$.data[0].severity" }
          assert:
            - "ReleaseNotification.${rel_id}.exceeds_rq == true"
            - "Facility.${fac_id}.compliance_posture == ENFORCEMENT"
            - "The facility's ComplianceCase has origin == RELEASE_RQ_EXCEEDED and severity == HIGH"
            - "Permit.${permit_id}.status == SUSPENDED"

      - name: inspection_fail_to_case_to_deficient
        grounds:
          - state_machines.Inspection.IN_PROGRESS_to_FAILED
          - entities.ComplianceCase.fields.origin
          - entities.Facility.fields.compliance_posture
        distinguishing_aspect: |
          Depth-2 chain from inspection completion: complete(FAIL)->ComplianceCase(INSPECTION_FAILED,MEDIUM)
          ->Facility.compliance_posture=DEFICIENT — a different triggering transition than the release cascade.
        test_recipe:
          setup:
            - "Facility with a SCHEDULED inspection that has been started (IN_PROGRESS)."
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "Theta Mill", epa_facility_id: "TX-0008", state_code: "TX", county: "Harris", operator_name: "Theta Co" }
              as: Regulator
              captures: { fac_id: $.data.id }
            - call: "POST /epcra/inspections"
              payload: { facility_id: "${fac_id}", inspector_id: "INSP-9", scheduled_date: "2026-04-01T09:00:00Z" }
              as: Regulator
              captures: { insp_id: $.data.id }
            - call: "POST /epcra/inspections/${insp_id}/start"
              payload: {}
              as: Regulator
          trigger:
            - call: "POST /epcra/inspections/${insp_id}/complete"
              payload: { result: "FAIL", findings_count: 3 }
              as: Regulator
              captures: { insp_status: $.data.status }
            - call: "GET /epcra/facilities/${fac_id}"
              payload: {}
              as: Regulator
              captures: { posture: $.data.compliance_posture }
            - call: "GET /epcra/facilities/${fac_id}/compliance-cases"
              payload: {}
              as: Regulator
              captures: { case_origin_0: "$.data[0].origin", case_severity_0: "$.data[0].severity" }
          assert:
            - "Inspection.${insp_id}.status == FAILED"
            - "The facility's ComplianceCase has origin == INSPECTION_FAILED and severity == MEDIUM"
            - "Facility.${fac_id}.compliance_posture == DEFICIENT"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: case_resolve_state_beats_business_constraint
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_CASE_NOT_UNDER_REVIEW]
          - errors[ERR_UNRESOLVED_INSPECTION]
        distinguishing_aspect: |
          Pair (state P6, business_constraint P10): a case that is OPEN (not UNDER_REVIEW) at a facility whose
          latest inspection FAILED returns ERR_CASE_NOT_UNDER_REVIEW, not ERR_UNRESOLVED_INSPECTION.
        test_recipe:
          setup:
            - "Facility with an OPEN manual ComplianceCase, and a most-recent inspection in FAILED status."
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "Iota Plant", epa_facility_id: "TX-0009", state_code: "TX", county: "Harris", operator_name: "Iota Co" }
              as: Regulator
              captures: { fac_id: $.data.id }
            - call: "POST /epcra/compliance-cases"
              payload: { facility_id: "${fac_id}", severity: "LOW" }
              as: Regulator
              captures: { case_id: $.data.id }
            - call: "POST /epcra/inspections"
              payload: { facility_id: "${fac_id}", inspector_id: "INSP-3", scheduled_date: "2026-04-10T09:00:00Z" }
              as: Regulator
              captures: { insp_id: $.data.id }
            - call: "POST /epcra/inspections/${insp_id}/start"
              payload: {}
              as: Regulator
            - call: "POST /epcra/inspections/${insp_id}/complete"
              payload: { result: "FAIL", findings_count: 2 }
              as: Regulator
          trigger:
            - call: "POST /epcra/compliance-cases/${case_id}/resolve"
              payload: { penalty_cents: 0 }
              as: Regulator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CASE_NOT_UNDER_REVIEW"
            - "HTTP status == 409"

      - name: permit_issue_temporal_beats_fiscal
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - errors[ERR_PERMIT_PERIOD_OVERLAP]
          - errors[ERR_OUTSTANDING_FEES]
        distinguishing_aspect: |
          Pair (business_temporal P9, business_fiscal P11): issuing a permit that overlaps an existing same-type
          permit at a facility that also has outstanding fees returns ERR_PERMIT_PERIOD_OVERLAP, not ERR_OUTSTANDING_FEES.
        test_recipe:
          setup:
            - "Facility with an existing ACTIVE OPERATING permit [2026-01-01,2027-01-01], and a SUBMITTED unpaid filing so total_outstanding_fee_cents > 0."
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "Kappa Chem", epa_facility_id: "TX-0010", state_code: "TX", county: "Harris", operator_name: "Kappa Co" }
              as: Regulator
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /epcra/permits"
              payload: { facility_id: "${fac_id}", permit_type: "OPERATING", issued_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z", fee_cents: 25000 }
              as: Regulator
              captures: { permit1_id: $.data.id }
            - call: "POST /epcra/chemicals"
              payload: { cas_number: "7782-50-5", name: "Chlorine", is_ehs: true, tpq_lbs: 100, rq_lbs: 5000, hazard_weight: 0.5, physical_state: "GAS" }
              as: Regulator
              captures: { chem_id: $.data.id }
            - call: "POST /epcra/chemical-inventories"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", reporting_year: 2025, max_daily_amount_lbs: 200, average_daily_amount_lbs: 150, days_on_site: 300, storage_type: "CYLINDER" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /epcra/sds"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", document_ref: "sds://chlorine-v1", revision_date: "2025-01-02T00:00:00Z", expected_facility_version: "${fac_v}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /epcra/tier-ii-filings"
              payload: { facility_id: "${fac_id}", reporting_year: 2025 }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { fil_id: $.data.id }
            - call: "POST /epcra/tier-ii-filings/${fil_id}/submit"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
          trigger:
            - call: "POST /epcra/permits"
              payload: { facility_id: "${fac_id}", permit_type: "OPERATING", issued_date: "2026-06-01T00:00:00Z", expiry_date: "2026-12-01T00:00:00Z", fee_cents: 25000 }
              as: Regulator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PERMIT_PERIOD_OVERLAP"
            - "HTTP status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: inventory_threshold_inclusive_boundary
        grounds:
          - calculations.applicable_threshold_determination
          - entities.ChemicalInventory.fields.is_reportable
        distinguishing_aspect: |
          Numeric-threshold metric on POST /epcra/chemical-inventories: max_daily exactly equal to the 10000 lb
          non-EHS threshold is reportable because the test is >= (not >).
        test_recipe:
          setup:
            - "Facility and a non-EHS chemical (threshold 10000 lb)."
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "Lambda Store", epa_facility_id: "TX-0011", state_code: "TX", county: "Harris", operator_name: "Lambda Co" }
              as: Regulator
              captures: { fac_id: $.data.id }
            - call: "POST /epcra/chemicals"
              payload: { cas_number: "108-88-3", name: "Toluene", is_ehs: false, rq_lbs: 1000, hazard_weight: 0.15, physical_state: "LIQUID" }
              as: Regulator
              captures: { chem_id: $.data.id }
          trigger:
            - call: "POST /epcra/chemical-inventories"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", reporting_year: 2025, max_daily_amount_lbs: 10000, average_daily_amount_lbs: 6000, days_on_site: 150, storage_type: "TANK" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { inv_id: $.data.id }
          assert:
            - "ChemicalInventory.${inv_id}.applicable_threshold_lbs == 10000"
            - "ChemicalInventory.${inv_id}.reportable_amount_lbs == 10000"
            - "ChemicalInventory.${inv_id}.is_reportable == true"

      - name: filing_submit_empty_reportable_set_boundary
        grounds:
          - validations[priority=8]
          - errors[ERR_NO_REPORTABLE_CHEMICALS]
          - state_machines.TierIIFiling.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Empty-collection metric on POST /epcra/tier-ii-filings/{id}/submit: a filing whose facility has zero
          reportable inventories for the year is rejected with ERR_NO_REPORTABLE_CHEMICALS (distinct metric/endpoint from the numeric threshold boundary).
        test_recipe:
          setup:
            - "Facility with a DRAFT filing for 2025 and no reportable inventory."
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "Mu Yard", epa_facility_id: "TX-0012", state_code: "TX", county: "Harris", operator_name: "Mu Co" }
              as: Regulator
              captures: { fac_id: $.data.id }
            - call: "POST /epcra/tier-ii-filings"
              payload: { facility_id: "${fac_id}", reporting_year: 2025 }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { fil_id: $.data.id }
          trigger:
            - call: "POST /epcra/tier-ii-filings/${fil_id}/submit"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_REPORTABLE_CHEMICALS"
            - "HTTP status == 422"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: permit_closed_interval_touching_overlap
        grounds:
          - validations[priority=9]
          - errors[ERR_PERMIT_PERIOD_OVERLAP]
          - entities.Permit.fields.issued_date
          - entities.Permit.fields.expiry_date
        distinguishing_aspect: |
          Permit uses closed-interval intersection on same permit_type: [2026-01-01,2026-06-30] and
          [2026-06-30,2026-12-31] share the endpoint 2026-06-30, so touching intervals collide.
        test_recipe:
          setup:
            - "Facility with an ACTIVE OPERATING permit [2026-01-01,2026-06-30] and no outstanding fees."
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "Nu Plant", epa_facility_id: "TX-0013", state_code: "TX", county: "Harris", operator_name: "Nu Co" }
              as: Regulator
              captures: { fac_id: $.data.id }
            - call: "POST /epcra/permits"
              payload: { facility_id: "${fac_id}", permit_type: "OPERATING", issued_date: "2026-01-01T00:00:00Z", expiry_date: "2026-06-30T00:00:00Z", fee_cents: 25000 }
              as: Regulator
              captures: { permit1_id: $.data.id }
          trigger:
            - call: "POST /epcra/permits"
              payload: { facility_id: "${fac_id}", permit_type: "OPERATING", issued_date: "2026-06-30T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z", fee_cents: 25000 }
              as: Regulator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PERMIT_PERIOD_OVERLAP"
            - "HTTP status == 409"

      - name: inspector_buffer_double_booking
        grounds:
          - validations[priority=9]
          - errors[ERR_INSPECTOR_DOUBLE_BOOKED]
          - entities.Inspection.fields.scheduled_date
          - entities.Inspection.fields.inspector_id
        distinguishing_aspect: |
          Inspection uses a symmetric 24h buffer around a point for the same inspector_id: two scheduled_dates
          11h apart (09:00 and 20:00 same day) collide — buffer-around-point semantics, distinct from Permit's closed-interval intersection.
        test_recipe:
          setup:
            - "Facility with an inspection for inspector INSP-7 at 2026-04-01T09:00:00Z."
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "Xi Depot", epa_facility_id: "TX-0014", state_code: "TX", county: "Harris", operator_name: "Xi Co" }
              as: Regulator
              captures: { fac_id: $.data.id }
            - call: "POST /epcra/inspections"
              payload: { facility_id: "${fac_id}", inspector_id: "INSP-7", scheduled_date: "2026-04-01T09:00:00Z" }
              as: Regulator
              captures: { insp1_id: $.data.id }
          trigger:
            - call: "POST /epcra/inspections"
              payload: { facility_id: "${fac_id}", inspector_id: "INSP-7", scheduled_date: "2026-04-01T20:00:00Z" }
              as: Regulator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSPECTOR_DOUBLE_BOOKED"
            - "HTTP status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: filing_submit_depends_on_facility_posture
        grounds:
          - state_machines.TierIIFiling.DRAFT_to_SUBMITTED
          - entities.Facility.fields.compliance_posture
          - errors[ERR_FACILITY_UNDER_ENFORCEMENT]
        distinguishing_aspect: |
          Pair TierIIFiling->Facility: a DRAFT filing that passes state/safety/referential is still blocked with
          ERR_FACILITY_UNDER_ENFORCEMENT because Facility.compliance_posture == ENFORCEMENT.
        test_recipe:
          setup:
            - "Facility with a reportable EHS inventory + ACTIVE SDS + DRAFT filing, then pushed into ENFORCEMENT by an RQ-exceeding release."
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "Omicron Chem", epa_facility_id: "TX-0015", state_code: "TX", county: "Harris", operator_name: "Omicron Co" }
              as: Regulator
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /epcra/chemicals"
              payload: { cas_number: "7782-50-5", name: "Chlorine", is_ehs: true, tpq_lbs: 100, rq_lbs: 10, hazard_weight: 0.5, physical_state: "GAS" }
              as: Regulator
              captures: { chem_id: $.data.id }
            - call: "POST /epcra/chemical-inventories"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", reporting_year: 2025, max_daily_amount_lbs: 200, average_daily_amount_lbs: 150, days_on_site: 300, storage_type: "CYLINDER" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /epcra/sds"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", document_ref: "sds://chlorine-v1", revision_date: "2025-01-02T00:00:00Z", expected_facility_version: "${fac_v}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /epcra/tier-ii-filings"
              payload: { facility_id: "${fac_id}", reporting_year: 2025 }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { fil_id: $.data.id }
            - call: "POST /epcra/release-notifications"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", release_datetime: "2026-02-20T00:00:00Z", quantity_released_lbs: 100, medium: "AIR" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
          trigger:
            - call: "POST /epcra/tier-ii-filings/${fil_id}/submit"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FACILITY_UNDER_ENFORCEMENT"
            - "HTTP status == 409"

      - name: case_resolve_depends_on_inspection_passed
        grounds:
          - state_machines.ComplianceCase.UNDER_REVIEW_to_RESOLVED
          - entities.Inspection.fields.status
          - errors[ERR_UNRESOLVED_INSPECTION]
        distinguishing_aspect: |
          Pair ComplianceCase->Inspection: a case in UNDER_REVIEW cannot resolve while the facility's latest
          Inspection.status is FAILED — ERR_UNRESOLVED_INSPECTION.
        test_recipe:
          setup:
            - "Facility with a manual ComplianceCase moved to UNDER_REVIEW; latest inspection is FAILED."
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "Pi Works", epa_facility_id: "TX-0016", state_code: "TX", county: "Harris", operator_name: "Pi Co" }
              as: Regulator
              captures: { fac_id: $.data.id }
            - call: "POST /epcra/compliance-cases"
              payload: { facility_id: "${fac_id}", severity: "LOW" }
              as: Regulator
              captures: { case_id: $.data.id }
            - call: "POST /epcra/compliance-cases/${case_id}/review"
              payload: {}
              as: Regulator
            - call: "POST /epcra/inspections"
              payload: { facility_id: "${fac_id}", inspector_id: "INSP-4", scheduled_date: "2026-04-05T09:00:00Z" }
              as: Regulator
              captures: { insp_id: $.data.id }
            - call: "POST /epcra/inspections/${insp_id}/start"
              payload: {}
              as: Regulator
            - call: "POST /epcra/inspections/${insp_id}/complete"
              payload: { result: "FAIL", findings_count: 1 }
              as: Regulator
          trigger:
            - call: "POST /epcra/compliance-cases/${case_id}/resolve"
              payload: { penalty_cents: 5000 }
              as: Regulator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNRESOLVED_INSPECTION"
            - "HTTP status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: fee_ledger_submit_return_conserves_outstanding
        grounds:
          - state_machines.TierIIFiling.UNDER_REVIEW_to_RETURNED_FOR_REVISION
          - calculations.facility_outstanding_fee_ledger
          - entities.Facility.fields.total_outstanding_fee_cents
        distinguishing_aspect: |
          Conserved quantity = Facility.total_outstanding_fee_cents (money): submit adds assessed_fee (10000),
          RETURN removes exactly the same and zeroes assessed_fee, restoring the pre-submit total of 0.
        test_recipe:
          setup:
            - "Facility with reportable EHS inventory + ACTIVE SDS + DRAFT filing; submit then BEGIN then RETURN, no payment."
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "Rho Chem", epa_facility_id: "TX-0017", state_code: "TX", county: "Harris", operator_name: "Rho Co" }
              as: Regulator
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /epcra/chemicals"
              payload: { cas_number: "7782-50-5", name: "Chlorine", is_ehs: true, tpq_lbs: 100, rq_lbs: 5000, hazard_weight: 0.5, physical_state: "GAS" }
              as: Regulator
              captures: { chem_id: $.data.id }
            - call: "POST /epcra/chemical-inventories"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", reporting_year: 2025, max_daily_amount_lbs: 200, average_daily_amount_lbs: 150, days_on_site: 300, storage_type: "CYLINDER" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /epcra/sds"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", document_ref: "sds://chlorine-v1", revision_date: "2025-01-02T00:00:00Z", expected_facility_version: "${fac_v}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /epcra/tier-ii-filings"
              payload: { facility_id: "${fac_id}", reporting_year: 2025 }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { fil_id: $.data.id }
            - call: "POST /epcra/tier-ii-filings/${fil_id}/submit"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /epcra/tier-ii-filings/${fil_id}/review"
              payload: { decision: "BEGIN" }
              as: Regulator
          trigger:
            - call: "POST /epcra/tier-ii-filings/${fil_id}/review"
              payload: { decision: "RETURN" }
              as: Regulator
              captures: { fee_after: $.data.assessed_fee_cents }
            - call: "GET /epcra/facilities/${fac_id}"
              payload: {}
              as: Regulator
              captures: { outstanding: $.data.total_outstanding_fee_cents }
          assert:
            - "TierIIFiling.${fil_id}.assessed_fee_cents == 0"
            - "TierIIFiling.${fil_id}.revision_count == 1"
            - "Facility.${fac_id}.total_outstanding_fee_cents == 0"

      - name: hazard_index_add_retire_conserves
        grounds:
          - state_machines.ChemicalInventory.ACTIVE_to_RETIRED
          - calculations.facility_hazard_index
          - entities.Facility.fields.hazard_index
        distinguishing_aspect: |
          Conserved quantity = Facility.hazard_index (dimensionless hazard score): adding an inventory raises it by
          the row's weighted_hazard_contribution (1.00), retiring it lowers by exactly the same, restoring 0.00 — a different conserved quantity than the fee ledger.
        test_recipe:
          setup:
            - "Facility, chemical (hazard_weight 0.2), one ACTIVE inventory max_daily 5000 (contribution 1.00)."
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "Sigma Depot", epa_facility_id: "TX-0018", state_code: "TX", county: "Harris", operator_name: "Sigma Co" }
              as: Regulator
              captures: { fac_id: $.data.id }
            - call: "POST /epcra/chemicals"
              payload: { cas_number: "71-43-2", name: "Benzene", is_ehs: false, rq_lbs: 1000, hazard_weight: 0.2, physical_state: "LIQUID" }
              as: Regulator
              captures: { chem_id: $.data.id }
            - call: "POST /epcra/chemical-inventories"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", reporting_year: 2025, max_daily_amount_lbs: 5000, average_daily_amount_lbs: 3000, days_on_site: 120, storage_type: "TANK" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { inv_id: $.data.id, contrib: $.data.weighted_hazard_contribution }
          trigger:
            - call: "POST /epcra/chemical-inventories/${inv_id}/retire"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "GET /epcra/facilities/${fac_id}"
              payload: {}
              as: Regulator
              captures: { hz_after: $.data.hazard_index }
          assert:
            - "ChemicalInventory.${inv_id}.weighted_hazard_contribution == 1.00"
            - "Facility.${fac_id}.hazard_index == 0.00"
