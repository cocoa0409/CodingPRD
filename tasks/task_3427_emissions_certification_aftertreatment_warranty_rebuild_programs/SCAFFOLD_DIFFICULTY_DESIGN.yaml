      - name: core_credit_ledger_confirm_then_forfeit_nets_zero
        grounds:
          - calculations.core_credit_provisional
          - calculations.core_credit_final
          - state_machines.RemanOrder.AWAITING_CORE_to_CORE_FORFEIT
          - entities.ServiceCenter.fields.core_credit_balance_cents
        distinguishing_aspect: |
          Conserved quantity: the center core-credit ledger in cents. A
          confirm posts +120000, a grade-B lands +30000 delta (balance 150000
          == the final credit), and a second order's confirm (+60000) paired
          with its compensating forfeit returns the ledger to exactly 150000
          — the sum of effective credits of non-reversed orders. Forward and
          compensating actions net to zero drift. Distinct conserved quantity
          (cents ledger) from the bay-day instance.
        test_recipe:
          setup:
            - "Logical clock 2026-12-01T00:00:00Z moving to 2027-03-02T00:00:00Z; family IN_PRODUCTION; units UN-931/UN-932 IN_SERVICE; center AUTHORIZED with zero ledger."
            - "Order A (unit UN-931): price 500000, core 200000 -> provisional 120000, confirmed, received, graded B -> final 150000. Order B (unit UN-932): price 300000, core 100000 -> provisional 60000, confirmed, never received."
          setup_api_calls:
            - *c_clock0
            - *c_std
            - *c_std_pub
            - *c_fam
            - *c_spec
            - *c_cal
            - *c_act
            - *c_bt
            - *c_ftp
            - *c_ftp_rec
            - *c_ftp_rev
            - *c_rmc
            - *c_rmc_rec
            - *c_rmc_rev
            - *c_set
            - *c_set_rec
            - *c_set_rev
            - *c_submit
            - *c_cert
            - *c_eip
            - *c_fleet
            - *c_center
            - *c_tech2
            - *c_authz
            - *c_authz2
            - *c_tool
            - call: "POST /emissions/engine-units"
              payload: { engine_family_id: "${fam_id}", fleet_id: "${flt_id}", serial_number: "UN-931", in_service_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { unit_a_id: $.data.id, unit_a_v: $.data.version }
            - call: "POST /emissions/engine-units"
              payload: { engine_family_id: "${fam_id}", fleet_id: "${flt_id}", serial_number: "UN-932", in_service_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { unit_b_id: $.data.id, unit_b_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /emissions/reman-orders"
              payload: { engine_unit_id: "${unit_a_id}", service_center_id: "${ctr_id}", reman_scope: "ENGINE", spec_level: "STANDARD", quoted_price_cents: 500000, quoted_core_value_cents: 200000, expected_core_return_by: "2027-03-01T00:00:00Z", expected_engine_unit_version: "${unit_a_v}" }
              as: ServiceAdvisor
              as_user_id: "${ctr_id}"
              captures: { ro_a_id: $.data.id }
            - call: "POST /emissions/reman-orders"
              payload: { engine_unit_id: "${unit_b_id}", service_center_id: "${ctr_id}", reman_scope: "ENGINE", spec_level: "STANDARD", quoted_price_cents: 300000, quoted_core_value_cents: 100000, expected_core_return_by: "2027-03-01T00:00:00Z", expected_engine_unit_version: "${unit_b_v}" }
              as: ServiceAdvisor
              as_user_id: "${ctr_id}"
              captures: { ro_b_id: $.data.id }
            - call: "POST /emissions/reman-orders/${ro_a_id}/confirm"
              payload: {}
              as: ServiceAdvisor
              as_user_id: "${ctr_id}"
            - call: "POST /emissions/reman-orders/${ro_b_id}/confirm"
              payload: {}
              as: ServiceAdvisor
              as_user_id: "${ctr_id}"
            - call: "POST /emissions/reman-orders/${ro_a_id}/receive-core"
              payload: {}
              as: ServiceAdvisor
              as_user_id: "${ctr_id}"
            - call: "POST /emissions/reman-orders/${ro_a_id}/grade-core"
              payload: { core_grade: "B" }
              as: RemanPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /emissions/reman-orders/${ro_b_id}/forfeit-core"
              payload: {}
              as: ServiceAdvisor
              as_user_id: "${ctr_id}"
              captures: { ro_b_status: $.data.status }
            - call: "GET /emissions/service-centers/${ctr_id}"
              payload: {}
              as: RemanPlanner
              captures: { ctr_balance: $.data.core_credit_balance_cents }
          assert:
            - "ledger walked 0 -> 120000 (confirm A) -> 180000 (confirm B) -> 210000 (grade B on A posts the +30000 delta: final 150000 minus provisional 120000) -> 150000 (forfeit B removes its 60000 provisional)"
            - "the compensating forfeit of order B removes exactly its 60000 provisional: ServiceCenter.${ctr_id}.core_credit_balance_cents == 150000 via ${ctr_balance} — equal to order A's final credit, zero drift"
            - "RemanOrder.${ro_b_id}.status == CORE_FORFEIT via ${ro_b_status} and final_core_credit_cents == 0"
            - "ServiceCenter.${ctr_id}.core_reversal_count == 1 (below the suspension threshold 2)"
