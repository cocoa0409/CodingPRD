      - name: one_clock_advance_sweeps_only_the_agreements_that_are_due
        claim_type: Bulk action
        grounds:
          - endpoints[POST /warewashing/_clock/set_current_utc]
          - state_machines.ServiceAgreement.status.ACTIVE_to_RENEWAL_PENDING
          - state_machines.ServiceAgreement.status.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          The sweep is a per-row filter, not an all-or-nothing batch: with three ACTIVE agreements - one
          ending 2026-09-01, one ending 2026-10-01 with a 5-day notice, one ending 2029-08-01 - a single
          advance to 2026-09-28T00:00:00Z returns expired 1 and moved_to_renewal_pending 1 and leaves the
          long agreement untouched, and the counts let a test prove the sweep ran without inspecting each
          row. A second advance to the same instant re-reports zeros because nothing is left to move.
        test_recipe:
          setup:
            - "Three ACTIVE agreements for one customer with different term ends; no placements, so the cascade has nothing to touch."
          setup_api_calls:
            - call: "POST /warewashing/customers"
              payload: { name: "Harbor Grill Group", sustainability_goal_water_l: 500000 }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /warewashing/chemical-products"
              payload: { sku: "DET-100", product_type: "DETERGENT", concentration_target_ppm: 1200, spec_dose_ml_per_rack: 8.00, unit_size_ml: 20000, unit_price_cents: 9600 }
              as: PlatformAdmin
              captures: { det_id: $.data.id }
            - call: "POST /warewashing/service-agreements"
              payload: { customer_id: "${cust_id}", agreement_code: "AGR-SHORT", start_date: "2026-08-01", minimum_term_months: 1, monthly_minimum_spend_cents: 20000, covered_product_ids: ["${det_id}"], renewal_notice_days: 5 }
              as: AccountManager
              captures: { a_short: $.data.id, te_short: $.data.term_end_date }
            - call: "POST /warewashing/service-agreements/${a_short}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /warewashing/service-agreements"
              payload: { customer_id: "${cust_id}", agreement_code: "AGR-MID", start_date: "2026-08-01", minimum_term_months: 2, monthly_minimum_spend_cents: 20000, covered_product_ids: ["${det_id}"], renewal_notice_days: 5 }
              as: AccountManager
              captures: { a_mid: $.data.id, te_mid: $.data.term_end_date }
            - call: "POST /warewashing/service-agreements/${a_mid}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /warewashing/service-agreements"
              payload: { customer_id: "${cust_id}", agreement_code: "AGR-LONG", start_date: "2026-08-01", minimum_term_months: 36, monthly_minimum_spend_cents: 20000, covered_product_ids: ["${det_id}"], renewal_notice_days: 5 }
              as: AccountManager
              captures: { a_long: $.data.id, te_long: $.data.term_end_date }
            - call: "POST /warewashing/service-agreements/${a_long}/activate"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /warewashing/_clock/set_current_utc"
              payload: { current_utc: "2026-09-28T00:00:00Z" }
              as: PlatformAdmin
              captures: { now: $.data.current_utc, n_moved: $.data.agreements_moved_to_renewal_pending, n_exp: $.data.agreements_expired, n_esc: $.data.tickets_escalated }
            - call: "GET /warewashing/service-agreements/${a_short}"
              payload: {}
              as: AccountManager
              captures: { st_short: $.data.status }
            - call: "GET /warewashing/service-agreements/${a_mid}"
              payload: {}
              as: AccountManager
              captures: { st_mid: $.data.status }
            - call: "GET /warewashing/service-agreements/${a_long}"
              payload: {}
              as: AccountManager
              captures: { st_long: $.data.status }
            - call: "POST /warewashing/_clock/set_current_utc"
              payload: { current_utc: "2026-09-28T00:00:00Z" }
              as: PlatformAdmin
              captures: { n_moved_2: $.data.agreements_moved_to_renewal_pending, n_exp_2: $.data.agreements_expired }
          assert:
            - "${te_short} == 2026-09-01, ${te_mid} == 2026-10-01 and ${te_long} == 2029-08-01"
            - "${now} == 2026-09-28T00:00:00Z, ${n_exp} == 1, ${n_moved} == 1 and ${n_esc} == 0"
            - "${st_short} == EXPIRED, ${st_mid} == RENEWAL_PENDING (inside its 5-day notice window) and ${st_long} == ACTIVE"
            - "${n_moved_2} == 0 and ${n_exp_2} == 0 - the sweep is idempotent at a repeated instant, and setting the clock backwards would be ERR_INVALID_REQUEST"

      - name: a_follow_up_visit_may_only_reference_a_rejected_visit_of_its_own_ticket
        claim_type: Cross-reference link
        grounds:
          - endpoints[POST /warewashing/service-visits]
          - entities.ServiceVisit.fields.follow_up_to_visit_id
          - errors[ERR_UNKNOWN_REFERENCE]
        distinguishing_aspect: |
          The link is validated against the referenced row's state, not just its existence: pointing
          follow_up_to_visit_id at the REJECTED first visit creates the follow-up, while pointing it at
          the SCHEDULED follow-up itself is ERR_UNKNOWN_REFERENCE (422) even though that id resolves
          perfectly. The rejection also had to hand the ticket back to QUEUED and clear its assignment,
