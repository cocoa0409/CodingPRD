      - name: corner_ordering_physician_cannot_attest_own_supervision_rejected
        claim_type: Segregation of duties
        grounds:
          - validations[priority=33]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - roles.OrthoPhysician
          - complexity_profile.role_model (segregation_of_duties)
        distinguishing_aspect: |
          This is the only rule in the scaffold that compares the ACTOR id with
          a stored field rather than checking a role name, and it is the whole
          point of the in-office ancillary services exception: the physician who
          referred the patient to their own practice's dispensary cannot also be
          the one who certifies that supervision was furnished. The same request
          body, sent by the same role, from the same clinic, is refused for the
          ordering physician and accepted for a second group physician. It also
          has to survive the encounter having only ONE eligible attester: adding
          a second physician after the refusal makes the previously impossible
          attestation succeed, and re-attesting by that same second physician to
          correct the observed level must remain allowed.
        test_recipe:
          setup:
            - "one DIRECT-supervision SPINE clinic with a single group physician; a patient; an off-shelf product whose ioas_supervision_required is GENERAL"
            - "one encounter ordered by that single physician and documented with their own medical necessity note"
