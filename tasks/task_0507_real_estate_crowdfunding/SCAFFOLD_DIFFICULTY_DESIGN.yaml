          - validations[priority=11]
          - state_machines.RedemptionRequest.QUEUED_to_FULFILLED
          - errors[ERR_INSUFFICIENT_SHARES]
        distinguishing_aspect: "On the Holding resource the overlap is a SHARE-BALANCE point conflict: a single holding of 1000 shares cannot fulfill two force-fulfills of 600+600 — the second sees shares_owned=400 < 600 and fails ERR_INSUFFICIENT_SHARES; this is a sum-vs-available balance check, geometrically different from the Fund aggregate-capacity window."
        test_recipe:
          setup:
            - "Holding of 1000 shares, NAV 1000, age tier 0 (no penalty concern). R1 600 shares fulfilled, leaving 400. R2 600 shares queued."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Operator
            - call: "POST /funds"
              payload: { name: "Fund O8b", vehicle_type: "REIT", gross_asset_value_cents: 100000000, total_liabilities_cents: 0 }
              as: FundManager
              captures: { fund_id: $.data.id, fund_v0: $.data.version }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A", min_investment_cents: 100000, mgmt_fee_bps: 100 }
              as: FundManager
              captures: { sc_id: $.data.id }
            - call: "POST /investors"
              payload: { email: "o8b@o.com", full_name: "O8b", accredited_status: "ACCREDITED", annual_income_cents: 500000000, net_worth_cents: 500000000 }
              as: Anonymous
              captures: { inv: $.data.id }
            - call: "POST /investors/${inv}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { investor_id: "${inv}", share_class_id: "${sc_id}", funded_amount_cents: 1000000, expected_fund_version: "${fund_v0}" }
              as: Investor
              as_user_id: "${inv}"
              captures: { sub: $.data.id }
            - call: "POST /subscriptions/${sub}/settle"
              payload: {}
              as: Operator
              captures: { holding: $.data.holding_id }
            - call: "POST /funds/${fund_id}/valuations"
              payload: { period_label: "2026-Q1", gross_asset_value_cents: 100000000, total_liabilities_cents: 0 }
              as: FundManager
            - call: "GET /holdings/${holding}"
              payload: {}
              as: Operator
              captures: { hv1: $.data.version }
            - call: "POST /redemption-requests"
              payload: { holding_id: "${holding}", shares_requested: 600, expected_holding_version: "${hv1}" }
              as: Investor
              as_user_id: "${inv}"
              captures: { r1: $.data.id }
            - call: "GET /holdings/${holding}"
              payload: {}
              as: Operator
              captures: { hv2: $.data.version }
            - call: "POST /redemption-requests"
              payload: { holding_id: "${holding}", shares_requested: 600, expected_holding_version: "${hv2}" }
              as: Investor
              as_user_id: "${inv}"
              captures: { r2: $.data.id }
            - call: "POST /redemption-requests/${r1}/force-fulfill"
              payload: {}
              as: Operator
          trigger:
            - call: "POST /redemption-requests/${r2}/force-fulfill"
              payload: {}
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INSUFFICIENT_SHARES"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: subscription_reverse_restores_capital_and_shares
        grounds:
          - state_machines.Subscription.PENDING_ACH_to_SETTLED
          - state_machines.Subscription.SETTLED_to_REVERSED
          - calculations.fund_shares_outstanding
          - entities.Fund.fields.total_capital_cents
          - entities.Fund.fields.shares_outstanding
        distinguishing_aspect: "Conserved quantity A = Fund.total_capital_cents AND Fund.shares_outstanding: a settle (+1000000 capital, +1000 shares) paired with its reverse must restore the fund to total_capital_cents==0 and shares_outstanding==0 exactly, no drift."
        test_recipe:
          setup:
            - "Fund empty; one subscription funded 1000000 is settled (capital 1000000, shares 1000) then reversed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Operator
            - call: "POST /funds"
              payload: { name: "Fund C9", vehicle_type: "REIT", gross_asset_value_cents: 0, total_liabilities_cents: 0 }
              as: FundManager
              captures: { fund_id: $.data.id, fund_v0: $.data.version }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A", min_investment_cents: 100000, mgmt_fee_bps: 100 }
              as: FundManager
              captures: { sc_id: $.data.id }
            - call: "POST /investors"
              payload: { email: "c9@c.com", full_name: "C9", accredited_status: "ACCREDITED", annual_income_cents: 50000000, net_worth_cents: 50000000 }
              as: Anonymous
              captures: { inv: $.data.id }
            - call: "POST /investors/${inv}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { investor_id: "${inv}", share_class_id: "${sc_id}", funded_amount_cents: 1000000, expected_fund_version: "${fund_v0}" }
              as: Investor
              as_user_id: "${inv}"
              captures: { sub: $.data.id }
            - call: "POST /subscriptions/${sub}/settle"
              payload: {}
              as: Operator
          trigger:
            - call: "POST /subscriptions/${sub}/reverse"
              payload: {}
              as: Operator
            - call: "GET /funds/${fund_id}"
              payload: {}
              as: Operator
              captures: { tc: $.data.total_capital_cents, so: $.data.shares_outstanding }
          assert:
            - "Fund.${fund_id}.total_capital_cents == 0"
            - "Fund.${fund_id}.shares_outstanding == 0"

      - name: subscription_reverse_restores_investor_ytd_invested
        grounds:
          - state_machines.Subscription.SETTLED_to_REVERSED
          - calculations.ytd_invested
          - entities.Investor.fields.ytd_invested_cents
        distinguishing_aspect: "Conserved quantity B = Investor.ytd_invested_cents (a different quantity from fund capital/shares): settling +1000000 then reversing must return ytd_invested_cents to 0, so the annual-cap headroom is fully restored."
        test_recipe:
          setup:
            - "Non-accredited investor (cap 1200000); one subscription funded 1000000 settled (ytd=1000000) then reversed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Operator
            - call: "POST /funds"
              payload: { name: "Fund C9b", vehicle_type: "REIT", gross_asset_value_cents: 0, total_liabilities_cents: 0 }
              as: FundManager
              captures: { fund_id: $.data.id, fund_v0: $.data.version }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A", min_investment_cents: 100000, mgmt_fee_bps: 100 }
              as: FundManager
              captures: { sc_id: $.data.id }
            - call: "POST /investors"
              payload: { email: "c9b@c.com", full_name: "C9b", accredited_status: "NON_ACCREDITED", annual_income_cents: 8000000, net_worth_cents: 12000000 }
              as: Anonymous
              captures: { inv: $.data.id }
            - call: "POST /investors/${inv}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { investor_id: "${inv}", share_class_id: "${sc_id}", funded_amount_cents: 1000000, expected_fund_version: "${fund_v0}" }
              as: Investor
              as_user_id: "${inv}"
              captures: { sub: $.data.id }
            - call: "POST /subscriptions/${sub}/settle"
              payload: {}
              as: Operator
          trigger:
            - call: "POST /subscriptions/${sub}/reverse"
              payload: {}
              as: Operator
            - call: "GET /investors/${inv}"
              payload: {}
              as: Operator
              captures: { ytd: $.data.ytd_invested_cents }
          assert:
