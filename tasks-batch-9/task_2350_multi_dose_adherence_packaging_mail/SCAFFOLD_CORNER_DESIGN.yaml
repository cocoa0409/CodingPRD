  - section: endpoints
    instances:

      - name: prescription_crud_create_read_and_filtered_list
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/pharmacy/prescriptions
          - endpoints.GET_/pharmacy/prescriptions/{id}
          - endpoints.GET_/pharmacy/prescriptions
          - entities.Prescription
        distinguishing_aspect: "The create/read/list triple is exercised against one patient with two prescriptions in different statuses, so the status filter must partition the list while the unfiltered read still returns both."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; one plan and one patient"
            - "two prescriptions, the second of which is discontinued by a denied authorization so the statuses differ"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pharmacy/insurance-plans"
              payload: { payer_name: "Northwind PBM", bin_number: "610502", generic_copay_cents_per_day: 34, brand_copay_cents_per_day: 74, specialty_copay_cents_per_day: 44 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Rosa Klein", date_of_birth: "1954-09-09", email: "rosa.klein@example.com", state_code: "WA", insurance_plan_id: "${plan_id}" }
              as: PharmacyOperations
              captures: { pt_id: $.data.id }
          trigger:
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Metformin ER", ndc: "00093-1049-01", strength: "500mg", form: "TABLET", copay_tier: "GENERIC", dose_times: ["MORNING"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01", last_dispensed_date: "2026-07-25", last_dispensed_days_supply: 28 }
              as: Prescriber
              captures: { rx1: $.data.id, rx1_status: $.data.status }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Albuterol HFA", ndc: "00173-0682-20", strength: "90mcg", form: "INHALER", copay_tier: "GENERIC", dose_times: ["MORNING"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 2, written_date: "2026-06-01", expiration_date: "2027-06-01" }
              as: PharmacyOperations
              captures: { rx2: $.data.id }
            - call: "GET /pharmacy/prescriptions/${rx1}"
              payload: {}
              as: Patient
              as_user_id: "${pt_id}"
              captures: { read_back: $.data.drug_name }
            - call: "GET /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", status: "ACTIVE", limit: 10, offset: 0 }
              as: PharmacyOperations
              captures: { first_row: "$.data[0].id" }
          assert:
            - "both creates return 201 with ${rx1_status} == ACTIVE, refills_remaining equal to refills_authorized (3 and 2), refills_consumed 0, days_dispensed_total 0 and version 1"
            - "${read_back} == Metformin ER and the detail read echoes every stored field including last_dispensed_date 2026-07-25 and packable true"
            - "${rx2} has packable false (form INHALER) and last_dispensed_date null, since the optional dispense history was omitted"
            - "the filtered list returns total_count 2 with has_more false, ordered by created_at ASC so ${first_row} == ${rx1}"
            - "GET /pharmacy/prescriptions?patient_id=${pt_id}&status=SUPERSEDED returns total_count 0 with an empty data array, not a 404"

      - name: pouch_parcel_is_only_stageable_once_the_roll_is_verified
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/pharmacy/fill-cycles/{id}/shipments
          - validations.priority_10
          - errors.ERR_INVALID_CYCLE_STATE
          - entities.Shipment.fields.shipment_kind
        distinguishing_aspect: "One endpoint, two admissibility windows keyed on shipment_kind: the cold-chain parcel is legal at LINES_ADJUDICATED while the pouch parcel of the very same cycle must wait for VERIFIED."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; synchronized patient with one pouchable tablet (MORNING) and one refrigerated insulin pen (BEDTIME)"
            - "cycle C1 [2026-08-15, 2026-09-12) adjudicated clean, so it holds one POUCH line and one COLD_CHAIN line and packaging_status is LINES_ADJUDICATED"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pharmacy/insurance-plans"
              payload: { payer_name: "Northwind PBM", bin_number: "610502", generic_copay_cents_per_day: 34, brand_copay_cents_per_day: 74, specialty_copay_cents_per_day: 44, refill_too_soon_threshold_pct: 75, coinsurance_pct: 20 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
