  # ---------------------------------------------------------------------------
  # Rule 3: non_linear_state_machine — cycles on DIFFERENT entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: job_hold_resume_cycle
        grounds:
          - state_machines.Job.EN_ROUTE_to_ON_HOLD
          - state_machines.Job.ON_HOLD_to_EN_ROUTE
        distinguishing_aspect: |
          Job machine is cyclic (EN_ROUTE -> ON_HOLD -> EN_ROUTE -> ON_HOLD):
          ON_HOLD is re-entered after a resume, proving the loop is not
          one-shot; each pass increments Job.version by 1.
        test_recipe:
          setup:
            - "Carrier; TX escort; job width 170 / height 150 (1 REAR position, no survey), booked, permitted, scheduled, departed at 2026-08-10T09:00:00Z"
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Falcon Freight", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /escorts", payload: { operator_name: "Solo Rider", certified_state_codes: ["TX"] }, as: Dispatcher, captures: { esc1_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "Generator", width_inches: 170, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_id: $.data.id } }
            - { call: "GET /jobs/${job_id}/legs", payload: {}, as: Dispatcher, captures: { leg_id: "$.data[0].id" } }
            - { call: "POST /jobs/${job_id}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
            - { call: "POST /legs/${leg_id}/permits", payload: { permit_number: "TX-P-4", valid_from: "2026-08-09T00:00:00Z", valid_until: "2026-08-12T00:00:00Z" }, as: Dispatcher, captures: { permit_id: $.data.id } }
            - { call: "POST /permits/${permit_id}/issue", payload: {}, as: Dispatcher }
            - { call: "POST /legs/${leg_id}/assignments", payload: { position: "REAR", escort_id: "${esc1_id}" }, as: Dispatcher, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: EscortOperator, as_user_id: "${esc1_id}" }
            - { call: "POST /jobs/${job_id}/schedule", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/depart", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /jobs/${job_id}/hold", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/resume", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/hold", payload: {}, as: Dispatcher }
          assert:
            - "First hold: Job.${job_id}.job_status == ON_HOLD"
            - "Resume: Job.${job_id}.job_status == EN_ROUTE (cycle closed)"
            - "Second hold succeeds again: job_status == ON_HOLD — the EN_ROUTE <-> ON_HOLD cycle is re-enterable, not a one-way latch"
            - "Each transition incremented Job.version by exactly 1 (version 5 -> 6 at depart, -> 7 at first hold, -> 8 at resume, -> 9 at second hold)"

      - name: incident_dispute_reassessment_cycle
        grounds:
          - state_machines.Incident.ASSESSED_to_DISPUTED
          - state_machines.Incident.DISPUTED_to_ASSESSED
          - calculations.incident_liability_assessment
        distinguishing_aspect: |
          Incident machine (a DIFFERENT entity from Job) loops
          ASSESSED -> DISPUTED -> ASSESSED, and the re-assessment REPLACES the
          prior liability amounts (escort_share 0 at 25% fault becomes 70000 at
          60% fault) rather than accumulating.
        test_recipe:
          setup:
            - "Delivered TX job with one COMPLETED assignment; incident reported by Dispatcher 'disp-1' with claimed_amount_cents 200000 linked to that assignment"
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Gulf Haulers", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /escorts", payload: { operator_name: "Lone Star Escort", certified_state_codes: ["TX"] }, as: Dispatcher, captures: { esc1_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "Boiler", width_inches: 170, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_id: $.data.id } }
            - { call: "GET /jobs/${job_id}/legs", payload: {}, as: Dispatcher, captures: { leg_id: "$.data[0].id" } }
            - { call: "POST /jobs/${job_id}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
            - { call: "POST /legs/${leg_id}/permits", payload: { permit_number: "TX-P-5", valid_from: "2026-08-09T00:00:00Z", valid_until: "2026-08-12T00:00:00Z" }, as: Dispatcher, captures: { permit_id: $.data.id } }
            - { call: "POST /permits/${permit_id}/issue", payload: {}, as: Dispatcher }
            - { call: "POST /legs/${leg_id}/assignments", payload: { position: "REAR", escort_id: "${esc1_id}" }, as: Dispatcher, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: EscortOperator, as_user_id: "${esc1_id}" }
            - { call: "POST /jobs/${job_id}/schedule", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/depart", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T12:00:00Z" }, as: Dispatcher }
            - { call: "POST /assignments/${asg_id}/check-ins", payload: {}, as: EscortOperator, as_user_id: "${esc1_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T13:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/deliver", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/incidents", payload: { incident_type: "CARGO_DAMAGE", description: "Load shifted on bridge strike avoidance maneuver", claimed_amount_cents: 200000, assignment_id: "${asg_id}" }, as: Dispatcher, as_user_id: "disp-1", captures: { inc_id: $.data.id } }
          trigger:
            - { call: "POST /incidents/${inc_id}/assess", payload: { escort_fault_share_pct: 25 }, as: SafetyManager, as_user_id: "sm-1" }
            - { call: "POST /incidents/${inc_id}/dispute", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
            - { call: "POST /incidents/${inc_id}/assess", payload: { escort_fault_share_pct: 60 }, as: SafetyManager, as_user_id: "sm-1" }
            - { call: "POST /incidents/${inc_id}/settle", payload: {}, as: FinanceManager }
          assert:
            - "After first assessment: Incident.${inc_id}.incident_status == ASSESSED, assessed_amount_cents == 200000, escort_share_cents == 0 (max(0, round(200000 x 0.25) - 50000))"
            - "After dispute: incident_status == DISPUTED"
            - "After re-assessment: incident_status == ASSESSED again and escort_share_cents == 70000 (max(0, 120000 - 50000)) — replaced, not added"
            - "After settle: incident_status == SETTLED; Escort.${esc1_id}.reliability_score == 65 (latest pct 60 >= 50 -> -35 at settlement; the disputed 25% assessment never applied a penalty)"

  # ---------------------------------------------------------------------------
  # Rule 4: transitive_cascade — different triggers, depth >= 3 and >= 2
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: incident_settle_suspension_release_demote
        grounds:
          - state_machines.Incident.ASSESSED_to_SETTLED
          - state_machines.Escort.ACTIVE_to_SUSPENDED
          - state_machines.EscortAssignment.ACCEPTED_to_RELEASED
          - calculations.escort_reliability_update
        distinguishing_aspect: |
          Depth-3 chain from an incident-settle trigger: settle mutates the
          Escort (reliability 30 < 40 -> SUSPENDED), the suspension itself
          releases that escort's ACCEPTED assignment on a DIFFERENT job, and
          that release demotes the SCHEDULED job B to CLEARED.
        test_recipe:
          setup:
            - "Escort E (TX, reliability 100); delivered job A with E's COMPLETED assignment; SCHEDULED job B (window 2026-08-12) with E's ACCEPTED REAR assignment; two REPORTED incidents on job A linked to A's assignment"
