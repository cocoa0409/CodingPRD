# =============================================================================
# Scaffold: Microgreens & Specialty Produce Grower (chef-direct specialty grower)
# =============================================================================

scenario: |
  Microgreens & Specialty Produce Grower (chef-direct specialty grower): chef/restaurant
  standing order & weekly change, sow-to-harvest tray scheduling, variety trial & new-item
  introduction, delivery route & minimum order, seed lot germination testing, food-safety
  plan & harvest sanitation, spoilage/credit on delivery, farmers-market surplus channel

domain_name: microgreens-specialty-grower
api_prefix: /grow

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit          # food-safety plan & harvest sanitation gate all grow ops
  secondary_archetype: quota_allocation        # tray rack capacity + delivery route minimum-order allocation
  complexity_layers:
    - rate_threshold_triggers                  # germination pass/fail at 0.85; route minimum at >= 3000
    - dual_variant_calculation                 # provisional vs final order totals; original-paper vs post-harvest-priced credits
    - cascading_side_effects                   # lot fail -> crop block -> order shortage -> surplus reduction
    - optimistic_concurrency                   # OCC on StandingOrder for weekly change + on CropPlan for sow
  entity_topology: flat                        # peer entities linked by FK references, no nested URL paths
  state_machine_shape: branching               # crop cycle with fail-branch reverts; order lifecycle with credit fork
  relationship_patterns:
    - one_to_many                              # Customer -> StandingOrder -> OrderItem; Variety -> CropPlan -> TrayBatch
    - cross_aggregate                          # TrayBatch -> SeedLot -> GerminationTest; DeliveryRoute -> DeliveryStop -> OrderItem
  role_model: peer_roles                       # Grower owns grow ops; Chef owns ordering; OpsManager owns compliance & routes
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: business_name, type: string, source: input, description: "Restaurant or chef business name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: delivery_zone, type: string, source: input, description: "Zone code used for route assignment, e.g. NORTH | SOUTH | MARKET" }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Running store-credit balance from resolved spoilage credits; starts at 0" }
      - { name: is_active, type: boolean, source: system, description: "Soft-active flag; deactivated customers cannot place changes" , default: true }

  - name: Variety
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Variety name, e.g. 'Red Garnet Amaranth'" }
      - { name: crop_category, type: string, source: input, description: "MICROGREEN | PETITE_GREEN | EDIBLE_FLOWER | SPECIALTY_HERB" }
      - { name: days_to_harvest, type: integer, source: input, description: "Nominal sow-to-harvest days for this variety" }
      - { name: expected_yield_grams_per_tray, type: integer, source: input, description: "Nominal grams per 1020 tray at harvest" }
      - { name: listed_price_cents_per_kg, type: integer, source: input, description: "Base catalog price; order lines may override" }
      - { name: stage, type: enum, source: system, description: "TRIAL | EVALUATION | LISTED | RETIRED", default: TRIAL }
      - { name: min_order_grams, type: integer, source: input, description: "Minimum saleable order quantity in grams" }

  - name: VarietyTrial
    parent: null
    common_fields: true
    fields:
      - { name: variety_id, type: string, source: input, description: "FK -> Variety.id; the variety under trial" }
      - { name: sow_date, type: string, source: input, description: "ISO date the trial trays were sown" }
      - { name: chef_panel_size, type: integer, source: input, description: "Number of chefs who will score the trial" }
      - { name: avg_flavor_score, type: number, source: computed, description: "Mean of submitted panel scores; null until scores recorded" }
      - { name: yield_score, type: number, source: input, description: "Grower yield rating 0.0-10.0 recorded at trial harvest" }
      - { name: decision, type: enum, source: system, description: "PENDING | ADOPTED | REJECTED", default: PENDING }

  - name: SeedLot
    parent: null
    common_fields: true
    fields:
      - { name: variety_id, type: string, source: input, description: "FK -> Variety.id" }
      - { name: supplier_name, type: string, source: input, description: "Seed supplier" }
      - { name: lot_code, type: string, source: input, description: "Supplier lot code; unique per (variety_id, lot_code)" }
      - { name: received_date, type: string, source: input, description: "ISO date the lot was received" }
      - { name: seeds_on_hand_grams, type: integer, source: input, description: "Unsowed seed remaining, grams" }
      - { name: status, type: enum, source: system, description: "QUARANTINE | RELEASED | BLOCKED | DEPLETED", default: QUARANTINE }

  - name: GerminationTest
    parent: null
    common_fields: true
    fields:
      - { name: seed_lot_id, type: string, source: input, description: "FK -> SeedLot.id; lot under test" }
      - { name: seeds_sown_count, type: integer, source: input, description: "Number of seeds placed in the test cell" }
      - { name: germinated_count, type: integer, source: input, description: "Number germinated at read time; set on record-result" }
      - { name: germination_rate, type: number, source: computed, description: "germinated_count / seeds_sown_count, 4 decimals" }
      - { name: result, type: enum, source: system, description: "PENDING | PASS | FAIL", default: PENDING }

  - name: CropPlan
    parent: null
    common_fields: true
    fields:
      - { name: variety_id, type: string, source: input, description: "FK -> Variety.id" }
      - { name: planned_sow_date, type: string, source: input, description: "ISO date sowing is planned" }
      - { name: planned_tray_count, type: integer, source: input, description: "Trays to sow" }
      - { name: seed_grams_required, type: integer, source: input, description: "Grams of seed this plan will draw" }
      - { name: status, type: enum, source: system, description: "PLANNED | SOWING | GROWING | READY | HARVESTED | CANCELLED", default: PLANNED }
      - { name: base_harvest_kg, type: number, source: computed, description: "planned_tray_count * expected_yield_grams_per_tray / 1000, fixed at plan creation" }
      - { name: sown_tray_count, type: integer, source: system, description: "Trays actually sown; 0 until sow executed", default: 0 }

  - name: TrayBatch
    parent: null
    common_fields: true
    fields:
      - { name: crop_plan_id, type: string, source: input, description: "FK -> CropPlan.id" }
      - { name: seed_lot_id, type: string, source: input, description: "FK -> SeedLot.id; lot this batch draws from" }
      - { name: tray_count, type: integer, source: input, description: "Trays in this batch" }
      - { name: sown_at, type: string, source: computed, description: "ISO timestamp set when the batch is sown (from the logical clock)" }
      - { name: expected_harvest_date, type: string, source: computed, description: "sown_at date + variety.days_to_harvest" }
      - { name: status, type: enum, source: system, description: "SOWN | GERMINATING | GROWING | READY | HARVESTED | FAILED", default: SOWN }
      - { name: harvested_kg, type: number, source: system, description: "Recorded net kg at harvest; 0 until HARVESTED", default: 0 }

  - name: FoodSafetyPlan
    parent: null
    common_fields: true
    fields:
      - { name: plan_code, type: string, source: input, description: "Unique plan code, e.g. FSP-2026-A" }
      - { name: water_test_current, type: boolean, source: input, description: "True when a passing water test is on file and in date" }
      - { name: sanitation_sop_version, type: string, source: input, description: "SOP document version string" }
      - { name: approved_at, type: string, source: system, description: "ISO timestamp of approval; null until approved" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | SUSPENDED", default: DRAFT }

  - name: SanitationLog
    parent: null
    common_fields: false
    fields:
      - { name: harvest_batch_id, type: string, source: input, description: "FK -> TrayBatch.id; the batch this sanitation record covers" }
      - { name: surface_swab_passed, type: boolean, source: input, description: "True when the pre-harvest surface swab passed" }
      - { name: wash_water_ppm, type: integer, source: input, description: "Sanitizer concentration in ppm measured in wash water" }
      - { name: logged_by, type: string, source: input, description: "Operator identifier who recorded the log" }

  - name: StandingOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: effective_week_start, type: string, source: input, description: "ISO Monday date of the first week this revision covers" }
      - { name: change_cutoff_day, type: integer, source: input, description: "Day-of-week index (0=Mon..6=Sun) after which weekly changes lock for the coming week" }
      - { name: status, type: enum, source: system, description: "DRAFT | CONFIRMED | LOCKED | CANCELLED", default: DRAFT }
      - { name: weekly_subtotal_cents, type: integer, source: computed, description: "Sum of order_line_extension over current lines; recomputed on every line change" }
      - { name: version, type: integer, source: system, description: "OCC token; increments on every mutation" }

  - name: OrderItem
    parent: null
    common_fields: true
    fields:
      - { name: standing_order_id, type: string, source: input, description: "FK -> StandingOrder.id" }
      - { name: variety_id, type: string, source: input, description: "FK -> Variety.id" }
      - { name: qty_kg, type: number, source: input, description: "Weekly quantity in kilograms, 3 decimals" }
      - { name: unit_price_cents_per_kg, type: integer, source: input, description: "Line price; defaults from Variety.listed_price_cents_per_kg when omitted" }
      - { name: line_extension_cents, type: integer, source: computed, description: "round_half_up(qty_kg * unit_price_cents_per_kg) to whole cents" }
      - { name: fulfillment, type: enum, source: system, description: "PLANNED | ALLOCATED | SHORTED | DELIVERED | CREDITED", default: PLANNED }

  - name: DeliveryRoute
    parent: null
    common_fields: true
    fields:
      - { name: route_code, type: string, source: input, description: "Route identifier, e.g. R-NORTH-01" }
      - { name: service_date, type: string, source: input, description: "ISO date the route runs" }
      - { name: min_stop_subtotal_cents, type: integer, source: input, description: "Per-stop minimum; stops below it are skipped" }
      - { name: status, type: enum, source: system, description: "PLANNED | DISPATCHED | COMPLETED | CANCELLED", default: PLANNED }

  - name: DeliveryStop
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> DeliveryRoute.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: standing_order_id, type: string, source: input, description: "FK -> StandingOrder.id fulfilled at this stop" }
      - { name: stop_subtotal_cents, type: integer, source: computed, description: "Sum of delivered line extensions for the stop's order at dispatch" }
      - { name: outcome, type: enum, source: system, description: "SCHEDULED | INCLUDED | SKIPPED | DELIVERED", default: SCHEDULED }

  - name: SpoilageCredit
    parent: null
    common_fields: true
    fields:
      - { name: delivery_stop_id, type: string, source: input, description: "FK -> DeliveryStop.id where spoilage was reported" }
      - { name: order_item_id, type: string, source: input, description: "FK -> OrderItem.id being credited" }
      - { name: credit_qty_kg, type: number, source: input, description: "Quantity spoiled on arrival" }
      - { name: pricing_variant, type: enum, source: input, description: "ORIGINAL_PAPER | POST_HARVEST_PRICING" }
      - { name: credit_cents, type: integer, source: computed, description: "Computed per pricing variant; see spoilage_credit calculation" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED", default: PENDING }

  - name: SurplusListing
    parent: null
    common_fields: true
    fields:
      - { name: variety_id, type: string, source: input, description: "FK -> Variety.id offered at the farmers market" }
      - { name: tray_batch_id, type: string, source: input, description: "FK -> TrayBatch.id the surplus was harvested from" }
      - { name: qty_kg, type: number, source: input, description: "Quantity listed" }
      - { name: market_price_cents_per_kg, type: integer, source: input, description: "Farmers-market price, typically below chef price" }
      - { name: market_date, type: string, source: input, description: "ISO date of the market" }
      - { name: status, type: enum, source: system, description: "LISTED | SOLD | WITHDRAWN", default: LISTED }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Variety
    initial_state: TRIAL
    terminal_states: [RETIRED]
    transitions:
      - from: TRIAL
        to: EVALUATION
        trigger: "POST /grow/variety-trials/{id}/record-panel (all panel scores in)"
        actor: Grower
        preconditions:
          - "VarietyTrial.decision == PENDING"
          - "avg_flavor_score has been computed from chef_panel_size scores"
        side_effects:
          - "VarietyTrial remains PENDING until decide is called"
      - from: EVALUATION
        to: LISTED
        trigger: "POST /grow/variety-trials/{id}/decide with outcome=ADOPT"
        actor: Grower
        preconditions:
          - "avg_flavor_score >= 6.0 AND yield_score >= 5.0 (else ERR_TRIAL_CRITERIA_NOT_MET)"
        side_effects:
          - "VarietyTrial.decision -> ADOPTED"
          - "Variety.stage -> LISTED"
      - from: EVALUATION
        to: TRIAL
        trigger: "POST /grow/variety-trials/{id}/decide with outcome=RETRIAL"
        actor: Grower
        preconditions: []
        side_effects:
          - "VarietyTrial.decision -> REJECTED (revision loop: a new VarietyTrial may be opened)"
      - from: LISTED
        to: RETIRED
        trigger: "POST /grow/varieties/{id}/retire"
        actor: Grower
        preconditions:
          - "No OrderItem with fulfillment IN {PLANNED, ALLOCATED} references this variety (ERR_VARIETY_IN_USE)"
        side_effects: []

  - entity: FoodSafetyPlan
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /grow/food-safety-plans/{id}/approve"
        actor: OpsManager
        preconditions:
          - "water_test_current == true (else ERR_FOOD_SAFETY_NOT_APPROVED)"
        side_effects:
          - "approved_at set from the logical clock"
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /grow/food-safety-plans/{id}/suspend"
        actor: OpsManager
        preconditions: []
        side_effects:
          - "While SUSPENDED, sow is blocked (priority-5 safety gate no longer satisfied)"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /grow/food-safety-plans/{id}/approve (reinstatement)"
        actor: OpsManager
        preconditions:
          - "water_test_current == true"
        side_effects:
          - "approved_at refreshed"

  - entity: SeedLot
    initial_state: QUARANTINE
    terminal_states: [DEPLETED, BLOCKED]
    transitions:
      - from: QUARANTINE
        to: RELEASED
        trigger: "POST /grow/germination-tests/{id}/record-result with result PASS"
        actor: Grower
        preconditions:
          - "GerminationTest.result for the lot == PASS (germination_rate >= 0.85)"
        side_effects:
          - "SeedLot.status -> RELEASED; sowing from this lot now permitted"
      - from: QUARANTINE
        to: BLOCKED
        trigger: "POST /grow/germination-tests/{id}/record-result with result FAIL"
        actor: Grower
        preconditions:
          - "GerminationTest.result for the lot == FAIL (germination_rate < 0.85)"
        side_effects:
          - "SeedLot.status -> BLOCKED"
          - "Cascade: every TrayBatch with seed_lot_id == this lot and status IN {SOWN, GERMINATING, GROWING} -> FAILED"
          - "Cascade: each failed TrayBatch's CropPlan recomputes shortage (see tray_batch_failure_cascade)"
      - from: RELEASED
        to: BLOCKED
        trigger: "POST /grow/germination-tests/{id}/record-result with result FAIL on a re-test of an already-RELEASED lot (supplier recall)"
        actor: Grower
        preconditions:
          - "GerminationTest.result for the lot == FAIL (germination_rate < 0.85)"
        side_effects:
          - "SeedLot.status -> BLOCKED"
          - "Cascade: every TrayBatch with seed_lot_id == this lot and status IN {SOWN, GERMINATING, GROWING} -> FAILED"
          - "Cascade: each failed TrayBatch's CropPlan recomputes shortage (see tray_batch_failure_cascade)"
      - from: RELEASED
        to: DEPLETED
        trigger: "system (when seeds_on_hand_grams reaches 0 after a sow)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CropPlan
    initial_state: PLANNED
    terminal_states: [HARVESTED, CANCELLED]
    transitions:
      - from: PLANNED
        to: SOWING
        trigger: "POST /grow/crop-plans/{id}/sow"
        actor: Grower
        preconditions:
          - "FoodSafetyPlan status == APPROVED (ERR_FOOD_SAFETY_NOT_APPROVED)"
          - "expected_crop_plan_version matches (OCC, ERR_STALE_VERSION)"
          - "The seed lot used is RELEASED (ERR_SEED_LOT_NOT_RELEASED)"
          - "seed_grams_required <= seed lot seeds_on_hand_grams (ERR_INSUFFICIENT_SEED)"
        side_effects:
          - "Creates TrayBatch (status SOWN) under this plan"
          - "Decrements SeedLot.seeds_on_hand_grams by seed_grams_required"
          - "CropPlan.sown_tray_count = planned_tray_count"
      - from: SOWING
        to: GROWING
        trigger: "POST /grow/tray-batches/{id}/advance (germination confirmed)"
        actor: Grower
        preconditions:
          - "TrayBatch.status == SOWN"
        side_effects:
          - "TrayBatch.status -> GERMINATING then GROWING on next advance"
      - from: GROWING
        to: READY
        trigger: "POST /grow/tray-batches/{id}/advance at expected_harvest_date"
        actor: Grower
        preconditions:
          - "TrayBatch.status == GROWING"
        side_effects:
          - "TrayBatch.status -> READY"
      - from: READY
        to: HARVESTED
        trigger: "POST /grow/tray-batches/{id}/harvest"
        actor: Grower
        preconditions:
          - "TrayBatch.status == READY"
          - "A SanitationLog for this batch exists with surface_swab_passed == true AND wash_water_ppm IN [50, 200] (ERR_SANITATION_NOT_LOGGED / ERR_SANITATION_FAILED)"
        side_effects:
          - "TrayBatch.status -> HARVESTED, harvested_kg set"
          - "CropPlan.status -> HARVESTED"
          - "OrderItem allocation pass runs (see harvest_allocation calculation)"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /grow/crop-plans/{id}/cancel"
        actor: Grower
        preconditions: []
        side_effects: []

  - entity: TrayBatch
    initial_state: SOWN
    terminal_states: [HARVESTED, FAILED]
    transitions:
      - from: SOWN
        to: GERMINATING
        trigger: "POST /grow/tray-batches/{id}/advance"
        actor: Grower
        preconditions: ["status == SOWN"]
        side_effects: []
      - from: GERMINATING
        to: GROWING
        trigger: "POST /grow/tray-batches/{id}/advance"
        actor: Grower
        preconditions: ["status == GERMINATING"]
        side_effects: []
      - from: GROWING
        to: READY
        trigger: "POST /grow/tray-batches/{id}/advance"
        actor: Grower
        preconditions: ["status == GROWING"]
        side_effects: []
      - from: READY
        to: HARVESTED
        trigger: "POST /grow/tray-batches/{id}/harvest"
        actor: Grower
        preconditions: ["SanitationLog present and passing"]
        side_effects: ["harvested_kg set", "CropPlan -> HARVESTED", "allocation pass runs"]
      - from: SOWN
        to: FAILED
        trigger: "system (seed lot blocked)"
        actor: system
        preconditions: ["SeedLot transitioned to BLOCKED"]
        side_effects: ["tray_batch_failure_cascade"]
      - from: GERMINATING
        to: FAILED
        trigger: "system (seed lot blocked)"
        actor: system
        preconditions: ["SeedLot transitioned to BLOCKED"]
        side_effects: ["tray_batch_failure_cascade"]
      - from: GROWING
        to: FAILED
        trigger: "system (seed lot blocked)"
        actor: system
        preconditions: ["SeedLot transitioned to BLOCKED"]
        side_effects: ["tray_batch_failure_cascade"]

  - entity: StandingOrder
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /grow/standing-orders/{id}/confirm"
        actor: Chef
        preconditions:
          - "At least one OrderItem present (ERR_EMPTY_ORDER)"
          - "expected_standing_order_version matches (OCC, ERR_STALE_VERSION)"
        side_effects:
          - "weekly_subtotal_cents recomputed"
      - from: CONFIRMED
        to: LOCKED
        trigger: "system (weekly cutoff passes, via POST /grow/_clock/set_current_utc advancing past change_cutoff_day)"
        actor: system
        preconditions:
          - "Logical clock weekday > change_cutoff_day relative to effective_week_start"
        side_effects:
          - "No further line changes accepted until next week"
      - from: LOCKED
        to: CONFIRMED
        trigger: "system (weekly rollover to next effective week)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /grow/standing-orders/{id}/cancel"
        actor: Chef
        preconditions: []
        side_effects: ["All OrderItems -> SHORTED? no: deleted lines dropped"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /grow/standing-orders/{id}/cancel"
        actor: Chef
        preconditions: []
        side_effects:
          - "All OrderItems with fulfillment PLANNED -> SHORTED (cancel-release)"
          - "Any linked DeliveryStop outcome -> SKIPPED"

  - entity: DeliveryRoute
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /grow/delivery-routes/{id}/dispatch"
        actor: OpsManager
        preconditions:
          - "At least one DeliveryStop in SCHEDULED (ERR_EMPTY_ROUTE)"
        side_effects:
          - "For each stop: compute stop_subtotal_cents from DELIVERED-pending lines"
          - "Stops with stop_subtotal_cents >= min_stop_subtotal_cents -> INCLUDED; else SKIPPED (inclusive >= boundary)"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /grow/delivery-routes/{id}/complete"
        actor: OpsManager
        preconditions:
          - "Every INCLUDED stop is DELIVERED or has at least one SpoilageCredit resolved"
        side_effects: []

  - entity: DeliveryStop
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, SKIPPED]
    transitions:
      - from: SCHEDULED
        to: INCLUDED
        trigger: "system (route dispatch, subtotal >= minimum)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: SKIPPED
        trigger: "system (route dispatch, subtotal < minimum) OR POST /grow/delivery-stops/{id}/skip"
        actor: system
        preconditions: []
        side_effects:
          - "Linked OrderItems remain ALLOCATED and roll to next route (not credited)"
      - from: INCLUDED
        to: DELIVERED
        trigger: "POST /grow/delivery-stops/{id}/deliver"
        actor: OpsManager
        preconditions:
          - "DeliveryRoute.status == DISPATCHED"
        side_effects:
          - "OrderItems -> DELIVERED; SpoilageCredit window opens"

  - entity: SpoilageCredit
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /grow/spoilage-credits/{id}/approve"
        actor: OpsManager
        preconditions:
          - "credit_qty_kg <= delivered qty of the OrderItem (ERR_CREDIT_EXCEEDS_DELIVERY)"
        side_effects:
          - "Customer.credit_balance_cents += credit_cents"
          - "OrderItem.fulfillment -> CREDITED when credit_qty_kg == delivered qty"
      - from: PENDING
        to: REJECTED
        trigger: "POST /grow/spoilage-credits/{id}/reject"
        actor: OpsManager
        preconditions: []
        side_effects: []

  - entity: SurplusListing
    initial_state: LISTED
    terminal_states: [SOLD, WITHDRAWN]
    transitions:
      - from: LISTED
        to: SOLD
        trigger: "POST /grow/surplus-listings/{id}/sell"
        actor: Grower
        preconditions: []
        side_effects: ["Records farmers-market sale at market_price_cents_per_kg"]
      - from: LISTED
        to: WITHDRAWN
        trigger: "POST /grow/surplus-listings/{id}/withdraw"
        actor: Grower
        preconditions: []
        side_effects: []

  - entity: GerminationTest
    initial_state: PENDING
    terminal_states: [PASS, FAIL]
    transitions:
      - from: PENDING
        to: PASS
        trigger: "POST /grow/germination-tests/{id}/record-result with germination_rate >= 0.85"
        actor: Grower
        preconditions: []
        side_effects: ["SeedLot QUARANTINE -> RELEASED (or stays RELEASED)"]
      - from: PENDING
        to: FAIL
        trigger: "POST /grow/germination-tests/{id}/record-result with germination_rate < 0.85"
        actor: Grower
        preconditions: []
        side_effects: ["SeedLot QUARANTINE -> BLOCKED, or RELEASED -> BLOCKED on recall (+tray_batch_failure_cascade)"]

  - entity: VarietyTrial
    initial_state: PENDING
    terminal_states: [ADOPTED, REJECTED]
    transitions:
      - from: PENDING
        to: ADOPTED
        trigger: "POST /grow/variety-trials/{id}/decide with outcome=ADOPT"
        actor: Grower
        preconditions: ["avg_flavor_score >= 6.0 AND yield_score >= 5.0"]
        side_effects: ["Variety EVALUATION -> LISTED"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /grow/variety-trials/{id}/decide with outcome=RETRIAL"
        actor: Grower
        preconditions: []
        side_effects: ["Variety EVALUATION -> TRIAL (revision loop)"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: standing-order-weekly-change-stale-version
    parent_entity: StandingOrder
    write_endpoint: "POST /grow/standing-orders/{id}/lines"
    occ_field: "expected_standing_order_version"
    description: |
      Adding a weekly-change line to a StandingOrder whose version has advanced
      since the client last observed it is rejected. Captures the case where
      another writer has just confirmed or edited the order and the current
      writer's view of the order is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: crop-plan-sow-stale-version
    parent_entity: CropPlan
    write_endpoint: "POST /grow/crop-plans/{id}/sow"
    occ_field: "expected_crop_plan_version"
    description: |
      Sowing a CropPlan whose version has advanced since the client last
      observed it is rejected. Captures the case where another writer has just
      edited planned_tray_count / seed_grams_required and the current writer's
      view of the plan is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_line_extension
    trigger: "OrderItem create/update; StandingOrder confirm; spoilage credit"
    algorithm: aggregation
    formula: |
      line_extension_cents = round_half_up(qty_kg * unit_price_cents_per_kg) to whole cents.
      Rounding order is PINNED: round each line first, then sum lines for subtotals.
      weekly_subtotal_cents = sum of line_extension_cents over all current OrderItems
      of the StandingOrder.
    constants: {}
    precision: "whole cents, round_half_up, per-line then sum"
    variants:
      - name: provisional
        when: "StandingOrder in DRAFT or CONFIRMED"
        difference: "subtotal reflects current editable lines; recomputed on every line change"
      - name: final
        when: "StandingOrder LOCKED / at dispatch"
        difference: "subtotal frozen from LOCKED lines; used for stop_subtotal_cents at dispatch"

  - name: standing_order_revenue_projection
    trigger: "GET /grow/standing-orders/{id}/projection"
    algorithm: aggregation
    formula: |
      Two valid counts over the SAME order produce different revenue projections:
      all_lines_total = sum(line_extension_cents) over ALL OrderItems regardless of status.
      confirmed_only_total = sum(line_extension_cents) over OrderItems whose parent
      StandingOrder.status == CONFIRMED or LOCKED (excludes DRAFT edits not yet confirmed).
    constants: {}
    precision: "whole cents"
    variants:
      - name: all_lines
        when: "Grower capacity planning view"
        difference: "includes DRAFT lines"
      - name: confirmed_only
        when: "OpsManager dispatch/fiscal view"
        difference: "excludes DRAFT lines; smaller when unconfirmed edits exist"

  - name: spoilage_credit
    trigger: "SpoilageCredit approve"
    algorithm: tiered_pricing
    formula: |
      credit_cents depends on pricing_variant:
      ORIGINAL_PAPER:
        credit_cents = round_half_up(credit_qty_kg * order_item.unit_price_cents_per_kg)
      POST_HARVEST_PRICING:
        harvest_ratio = total harvested_kg across HARVESTED TrayBatches of the crop plan
                        / crop_plan.base_harvest_kg
        plan_cap_factor = 1.00 if harvest_ratio >= 0.70 else 0.85
        variety_overweight_ratio = plan harvested_kg for this variety / plan base for variety
        overweight_excess = max(0, variety_overweight_ratio - 1.10)
        price_adjustment = 1.00 - min(0.25, overweight_excess)
        capped_unit_price = unit_price_cents_per_kg * plan_cap_factor * (1.00 - min(0.25, overweight_excess))
        credit_cents = round_half_up(credit_qty_kg * capped_unit_price)
      Evaluation order is PINNED: compute plan_cap_factor first, then price_adjustment,
      then capped_unit_price, then multiply by qty and round once at the end.
    constants:
      PLAN_CAP_THRESHOLD: 0.70
      PLAN_CAP_FACTOR: 0.85
      OVERWEIGHT_ALLOWANCE: 1.10
      MAX_PRICE_REDUCTION: 0.25
    precision: "whole cents, round_half_up, single final rounding"
    variants:
      - name: original_paper
        when: "pricing_variant == ORIGINAL_PAPER"
        difference: "credit at the invoiced line price"
      - name: post_harvest_pricing
        when: "pricing_variant == POST_HARVEST_PRICING"
        difference: "credit at capped post-harvest unit price; <= original-paper credit"

  - name: germination_result
    trigger: "GerminationTest record-result"
    algorithm: threshold
    formula: |
      germination_rate = germinated_count / seeds_sown_count (4 decimals, round_half_up)
      result = PASS if germination_rate >= 0.85 else FAIL   (inclusive boundary)
    constants:
      PASS_THRESHOLD: 0.85
    precision: "4 decimals, round_half_up"

  - name: harvest_allocation
    trigger: "TrayBatch harvest"
    algorithm: waterfall_allocation
    formula: |
      On harvest, allocate harvested_kg against OrderItems with fulfillment PLANNED
      for the same variety, ordered by StandingOrder.effective_week_start ASC, then
      StandingOrder.created_at ASC (never id). Fill each order's qty_kg in order;
      when supply runs out mid-order, that order is partially ALLOCATED and the
      remainder marked SHORTED. Any leftover harvested_kg becomes surplus and may be
      listed via SurplusListing.
    constants: {}
    precision: "3 decimals kg"

  - name: route_minimum_allocation
    trigger: "DeliveryRoute dispatch"
    algorithm: threshold
    formula: |
      For each DeliveryStop on the route:
        stop_subtotal_cents = sum(line_extension_cents) over the stop's order lines
        outcome = INCLUDED if stop_subtotal_cents >= min_stop_subtotal_cents else SKIPPED
      Boundary is INCLUSIVE: a stop exactly at the minimum is INCLUDED.
    constants: {}
    precision: "whole cents"

  - name: tray_batch_failure_cascade
    trigger: "SeedLot BLOCKED"
    algorithm: constraint_propagation
    formula: |
      When a SeedLot is BLOCKED, every TrayBatch with seed_lot_id == that lot and
      status IN {SOWN, GERMINATING, GROWING} transitions to FAILED. For each failed
      batch, its CropPlan recomputes projected shortfall = base_harvest_kg -
      (sum harvested_kg of surviving batches). That shortfall marks matching
      PLANNED OrderItems SHORTED via harvest_allocation re-pass, which in turn
      reduces the affected DeliveryStop.stop_subtotal_cents and can flip a stop
      from INCLUDED to SKIPPED on the next dispatch.
    constants: {}
    precision: "n/a"

  - name: sow_to_harvest_schedule
    trigger: "TrayBatch create (sow)"
    algorithm: forward_looking
    formula: |
      expected_harvest_date = date(sown_at) + variety.days_to_harvest days.
      base_harvest_kg = planned_tray_count * variety.expected_yield_grams_per_tray / 1000
      (fixed at CropPlan creation; not recomputed on later variety edits).
    constants: {}
    precision: "date (day granularity); kg 3 decimals"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role must have permission for the operation"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Resource IDs in path and FK fields in body must exist"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_CUSTOMER_NOT_FOUND, ERR_VARIETY_NOT_FOUND, ERR_SEED_LOT_NOT_FOUND, ERR_CROP_PLAN_NOT_FOUND, ERR_TRAY_BATCH_NOT_FOUND, ERR_STANDING_ORDER_NOT_FOUND, ERR_ORDER_ITEM_NOT_FOUND, ERR_ROUTE_NOT_FOUND, ERR_STOP_NOT_FOUND, ERR_CREDIT_NOT_FOUND, ERR_GERMINATION_TEST_NOT_FOUND, ERR_TRIAL_NOT_FOUND)"
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "Target resource must be in correct state for the operation"
    error_id: "ERR_INVALID_STATE (per-resource: ERR_ORDER_NOT_EDITABLE, ERR_LOT_NOT_RELEASED, ERR_BATCH_NOT_READY, ERR_ROUTE_NOT_DISPATCHED)"
    http_status: 409
    applies_to: "state transition endpoints"
  - priority: 5
    category: business_safety
    check: "Food-safety: sow requires FoodSafetyPlan APPROVED; harvest requires passing SanitationLog"
    error_id: "ERR_FOOD_SAFETY_NOT_APPROVED | ERR_SANITATION_NOT_LOGGED | ERR_SANITATION_FAILED"
    http_status: 409
    applies_to: "POST /grow/crop-plans/{id}/sow, POST /grow/tray-batches/{id}/harvest"
  - priority: 6
    category: business_constraint
    check: "Seed lot must be RELEASED and have sufficient seeds_on_hand_grams"
    error_id: "ERR_SEED_LOT_NOT_RELEASED | ERR_INSUFFICIENT_SEED"
    http_status: 409
    applies_to: "POST /grow/crop-plans/{id}/sow"
  - priority: 7
    category: business_temporal
    check: "Weekly change must arrive before change_cutoff_day; variety must be LISTED to add to an order"
    error_id: "ERR_WEEKLY_CHANGE_LOCKED | ERR_VARIETY_NOT_LISTED"
    http_status: 409
    applies_to: "POST /grow/standing-orders/{id}/lines"
  - priority: 8
    category: business_fiscal
    check: "Credit quantity must not exceed delivered quantity; OCC version must match"
    error_id: "ERR_CREDIT_EXCEEDS_DELIVERY | ERR_STALE_VERSION"
    http_status: 422
    applies_to: "POST /grow/spoilage-credits, POST /grow/standing-orders/{id}/lines, POST /grow/crop-plans/{id}/sow"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Customer ---
  - { method: POST, path: "/grow/customers", description: "Create customer", roles: [OpsManager], code: 201, input: [business_name, contact_email, delivery_zone], output: Customer, side_effects: ["credit_balance_cents = 0", "is_active = true"] }
  - { method: GET, path: "/grow/customers", description: "List customers", roles: [Grower, Chef, OpsManager], code: 200, input: ["limit?", "offset?"], output: "Customer[]", side_effects: [] }
  - { method: GET, path: "/grow/customers/{id}", description: "Get customer", roles: [Grower, Chef, OpsManager], code: 200, input: [], output: Customer, side_effects: [] }

  # --- Variety ---
  - { method: POST, path: "/grow/varieties", description: "Create variety (starts TRIAL)", roles: [Grower], code: 201, input: [name, crop_category, days_to_harvest, expected_yield_grams_per_tray, listed_price_cents_per_kg, min_order_grams], output: Variety, side_effects: ["stage = TRIAL"] }
  - { method: GET, path: "/grow/varieties", description: "List varieties", roles: [Grower, Chef, OpsManager], code: 200, input: ["limit?", "offset?", "stage?"], output: "Variety[]", side_effects: [] }
  - { method: GET, path: "/grow/varieties/{id}", description: "Get variety", roles: [Grower, Chef, OpsManager], code: 200, input: [], output: Variety, side_effects: [] }
  - { method: POST, path: "/grow/varieties/{id}/retire", description: "Retire a LISTED variety", roles: [Grower], code: 200, input: [], output: Variety, side_effects: ["stage -> RETIRED if no open order lines"] }

  # --- VarietyTrial ---
  - { method: POST, path: "/grow/variety-trials", description: "Open a variety trial", roles: [Grower], code: 201, input: [variety_id, sow_date, chef_panel_size, yield_score], output: VarietyTrial, side_effects: ["decision = PENDING"] }
  - { method: GET, path: "/grow/variety-trials", description: "List trials", roles: [Grower, OpsManager], code: 200, input: ["limit?", "offset?", "variety_id?"], output: "VarietyTrial[]", side_effects: [] }
  - { method: GET, path: "/grow/variety-trials/{id}", description: "Get a variety trial", roles: [Grower, OpsManager], code: 200, input: [], output: VarietyTrial, side_effects: [] }
  - { method: POST, path: "/grow/variety-trials/{id}/record-panel", description: "Record chef panel scores; computes avg_flavor_score", roles: [Grower], code: 200, input: [scores], output: VarietyTrial, side_effects: ["avg_flavor_score computed", "Variety TRIAL -> EVALUATION"] }
  - { method: POST, path: "/grow/variety-trials/{id}/decide", description: "Decide trial: ADOPT lists the variety; RETRIAL loops back to TRIAL", roles: [Grower], code: 200, input: [outcome], output: VarietyTrial, side_effects: ["decision -> ADOPTED/REJECTED", "Variety EVALUATION -> LISTED/TRIAL"] }

  # --- SeedLot / GerminationTest ---
  - { method: POST, path: "/grow/seed-lots", description: "Receive a seed lot (QUARANTINE)", roles: [Grower], code: 201, input: [variety_id, supplier_name, lot_code, received_date, seeds_on_hand_grams], output: SeedLot, side_effects: ["status = QUARANTINE"] }
  - { method: GET, path: "/grow/seed-lots", description: "List seed lots", roles: [Grower, OpsManager], code: 200, input: ["limit?", "offset?", "variety_id?", "status?"], output: "SeedLot[]", side_effects: [] }
  - { method: GET, path: "/grow/seed-lots/{id}", description: "Get seed lot", roles: [Grower, OpsManager], code: 200, input: [], output: SeedLot, side_effects: [] }
  - { method: POST, path: "/grow/germination-tests", description: "Start a germination test on a lot", roles: [Grower], code: 201, input: [seed_lot_id, seeds_sown_count], output: GerminationTest, side_effects: ["result = PENDING"] }
  - { method: GET, path: "/grow/germination-tests", description: "List germination tests", roles: [Grower, OpsManager], code: 200, input: ["limit?", "offset?", "seed_lot_id?"], output: "GerminationTest[]", side_effects: [] }
  - { method: GET, path: "/grow/germination-tests/{id}", description: "Get a germination test", roles: [Grower, OpsManager], code: 200, input: [], output: GerminationTest, side_effects: [] }
  - { method: POST, path: "/grow/germination-tests/{id}/record-result", description: "Record germinated_count; computes rate, sets PASS/FAIL, transitions lot", roles: [Grower], code: 200, input: [germinated_count], output: GerminationTest, side_effects: ["germination_rate computed", "result PASS/FAIL", "SeedLot QUARANTINE -> RELEASED or BLOCKED (+cascade)"] }

  # --- FoodSafetyPlan / SanitationLog ---
  - { method: POST, path: "/grow/food-safety-plans", description: "Create food-safety plan (DRAFT)", roles: [OpsManager], code: 201, input: [plan_code, water_test_current, sanitation_sop_version], output: FoodSafetyPlan, side_effects: ["status = DRAFT"] }
  - { method: GET, path: "/grow/food-safety-plans/{id}", description: "Get food-safety plan", roles: [Grower, OpsManager], code: 200, input: [], output: FoodSafetyPlan, side_effects: [] }
  - { method: POST, path: "/grow/food-safety-plans/{id}/approve", description: "Approve plan (requires water_test_current)", roles: [OpsManager], code: 200, input: [], output: FoodSafetyPlan, side_effects: ["status -> APPROVED", "approved_at set"] }
  - { method: POST, path: "/grow/food-safety-plans/{id}/suspend", description: "Suspend plan", roles: [OpsManager], code: 200, input: [], output: FoodSafetyPlan, side_effects: ["status -> SUSPENDED"] }
  - { method: POST, path: "/grow/sanitation-logs", description: "Log pre-harvest sanitation for a batch", roles: [Grower], code: 201, input: [harvest_batch_id, surface_swab_passed, wash_water_ppm, logged_by], output: SanitationLog, side_effects: [] }
  - { method: GET, path: "/grow/sanitation-logs", description: "List sanitation logs", roles: [Grower, OpsManager], code: 200, input: ["limit?", "offset?", "harvest_batch_id?"], output: "SanitationLog[]", side_effects: [] }
  - { method: GET, path: "/grow/sanitation-logs/{id}", description: "Get a sanitation log", roles: [Grower, OpsManager], code: 200, input: [], output: SanitationLog, side_effects: [] }

  # --- CropPlan / TrayBatch ---
  - { method: POST, path: "/grow/crop-plans", description: "Create crop plan", roles: [Grower], code: 201, input: [variety_id, planned_sow_date, planned_tray_count, seed_grams_required], output: CropPlan, side_effects: ["base_harvest_kg computed", "status = PLANNED"] }
  - { method: GET, path: "/grow/crop-plans", description: "List crop plans", roles: [Grower, OpsManager], code: 200, input: ["limit?", "offset?", "variety_id?", "status?"], output: "CropPlan[]", side_effects: [] }
  - { method: GET, path: "/grow/crop-plans/{id}", description: "Get crop plan", roles: [Grower, OpsManager], code: 200, input: [], output: CropPlan, side_effects: [] }
  - { method: POST, path: "/grow/crop-plans/{id}/sow", description: "Sow the plan from a RELEASED seed lot (OCC guarded)", roles: [Grower], code: 200, input: [seed_lot_id, expected_crop_plan_version], output: CropPlan, side_effects: ["creates TrayBatch SOWN", "SeedLot.seeds_on_hand_grams -= seed_grams_required", "CropPlan.version += 1", "status -> SOWING"] }
  - { method: POST, path: "/grow/crop-plans/{id}/cancel", description: "Cancel a PLANNED crop plan", roles: [Grower], code: 200, input: [], output: CropPlan, side_effects: ["status -> CANCELLED"] }
  - { method: GET, path: "/grow/tray-batches", description: "List tray batches", roles: [Grower, OpsManager], code: 200, input: ["limit?", "offset?", "crop_plan_id?", "seed_lot_id?", "status?"], output: "TrayBatch[]", side_effects: [] }
  - { method: GET, path: "/grow/tray-batches/{id}", description: "Get tray batch", roles: [Grower, OpsManager], code: 200, input: [], output: TrayBatch, side_effects: [] }
  - { method: POST, path: "/grow/tray-batches/{id}/advance", description: "Advance batch SOWN -> GERMINATING -> GROWING -> READY", roles: [Grower], code: 200, input: [], output: TrayBatch, side_effects: ["status advanced"] }
  - { method: POST, path: "/grow/tray-batches/{id}/harvest", description: "Harvest a READY batch (sanitation gated)", roles: [Grower], code: 200, input: [harvested_kg], output: TrayBatch, side_effects: ["status -> HARVESTED", "CropPlan -> HARVESTED", "harvest_allocation runs"] }

  # --- StandingOrder / OrderItem ---
  - { method: POST, path: "/grow/standing-orders", description: "Create standing order (DRAFT)", roles: [Chef], code: 201, input: [customer_id, effective_week_start, change_cutoff_day], output: StandingOrder, side_effects: ["status = DRAFT", "version = 1"] }
  - { method: GET, path: "/grow/standing-orders", description: "List standing orders", roles: [Grower, Chef, OpsManager], code: 200, input: ["limit?", "offset?", "customer_id?", "status?"], output: "StandingOrder[]", side_effects: [] }
  - { method: GET, path: "/grow/standing-orders/{id}", description: "Get standing order", roles: [Grower, Chef, OpsManager], code: 200, input: [], output: StandingOrder, side_effects: [] }
  - { method: GET, path: "/grow/standing-orders/{id}/projection", description: "Revenue projection (all_lines vs confirmed_only)", roles: [Grower, OpsManager], code: 200, input: [], output: StandingOrder, side_effects: [] }
  - { method: POST, path: "/grow/standing-orders/{id}/lines", description: "Add a weekly-change line (OCC + cutoff + LISTED gated)", roles: [Chef], code: 201, input: [variety_id, qty_kg, "unit_price_cents_per_kg?", expected_standing_order_version], output: OrderItem, side_effects: ["creates OrderItem PLANNED", "line_extension_cents computed", "weekly_subtotal_cents recomputed", "StandingOrder.version += 1"] }
  - { method: GET, path: "/grow/standing-orders/{id}/lines", description: "List lines of a standing order", roles: [Grower, Chef, OpsManager], code: 200, input: ["limit?", "offset?"], output: "OrderItem[]", side_effects: [] }
  - { method: POST, path: "/grow/standing-orders/{id}/confirm", description: "Confirm a DRAFT order", roles: [Chef], code: 200, input: [expected_standing_order_version], output: StandingOrder, side_effects: ["status -> CONFIRMED", "weekly_subtotal_cents recomputed", "version += 1"] }
  - { method: POST, path: "/grow/standing-orders/{id}/cancel", description: "Cancel an order", roles: [Chef], code: 200, input: [], output: StandingOrder, side_effects: ["status -> CANCELLED", "PLANNED lines -> SHORTED", "linked stops -> SKIPPED"] }

  # --- OrderItem direct ---
  - { method: GET, path: "/grow/order-items", description: "List order items", roles: [Grower, Chef, OpsManager], code: 200, input: ["limit?", "offset?", "standing_order_id?", "variety_id?", "fulfillment?"], output: "OrderItem[]", side_effects: [] }
  - { method: GET, path: "/grow/order-items/{id}", description: "Get order item", roles: [Grower, Chef, OpsManager], code: 200, input: [], output: OrderItem, side_effects: [] }

  # --- DeliveryRoute / DeliveryStop ---
  - { method: POST, path: "/grow/delivery-routes", description: "Create delivery route (PLANNED)", roles: [OpsManager], code: 201, input: [route_code, service_date, min_stop_subtotal_cents], output: DeliveryRoute, side_effects: ["status = PLANNED"] }
  - { method: GET, path: "/grow/delivery-routes", description: "List routes", roles: [Grower, OpsManager], code: 200, input: ["limit?", "offset?", "status?"], output: "DeliveryRoute[]", side_effects: [] }
  - { method: GET, path: "/grow/delivery-routes/{id}", description: "Get route", roles: [Grower, OpsManager], code: 200, input: [], output: DeliveryRoute, side_effects: [] }
  - { method: POST, path: "/grow/delivery-routes/{id}/stops", description: "Add a stop to a route", roles: [OpsManager], code: 201, input: [customer_id, standing_order_id], output: DeliveryStop, side_effects: ["outcome = SCHEDULED"] }
  - { method: GET, path: "/grow/delivery-routes/{id}/stops", description: "List stops on a route", roles: [Grower, OpsManager], code: 200, input: ["limit?", "offset?"], output: "DeliveryStop[]", side_effects: [] }
  - { method: POST, path: "/grow/delivery-routes/{id}/dispatch", description: "Dispatch route; computes stop subtotals and INCLUDED/SKIPPED by minimum", roles: [OpsManager], code: 200, input: [], output: DeliveryRoute, side_effects: ["status -> DISPATCHED", "route_minimum_allocation per stop"] }
  - { method: POST, path: "/grow/delivery-routes/{id}/complete", description: "Complete route", roles: [OpsManager], code: 200, input: [], output: DeliveryRoute, side_effects: ["status -> COMPLETED"] }
  - { method: GET, path: "/grow/delivery-stops", description: "List delivery stops (filtered)", roles: [Grower, OpsManager], code: 200, input: ["limit?", "offset?", "customer_id?", "standing_order_id?", "outcome?"], output: "DeliveryStop[]", side_effects: [] }
  - { method: GET, path: "/grow/delivery-stops/{id}", description: "Get delivery stop", roles: [Grower, OpsManager], code: 200, input: [], output: DeliveryStop, side_effects: [] }
  - { method: POST, path: "/grow/delivery-stops/{id}/deliver", description: "Mark INCLUDED stop delivered", roles: [OpsManager], code: 200, input: [], output: DeliveryStop, side_effects: ["outcome -> DELIVERED", "OrderItems -> DELIVERED"] }
  - { method: POST, path: "/grow/delivery-stops/{id}/skip", description: "Skip a stop", roles: [OpsManager], code: 200, input: [], output: DeliveryStop, side_effects: ["outcome -> SKIPPED"] }

  # --- SpoilageCredit ---
  - { method: POST, path: "/grow/spoilage-credits", description: "Report spoilage on a delivered stop", roles: [Chef, OpsManager], code: 201, input: [delivery_stop_id, order_item_id, credit_qty_kg, pricing_variant], output: SpoilageCredit, side_effects: ["status = PENDING", "credit_cents computed per variant"] }
  - { method: GET, path: "/grow/spoilage-credits", description: "List spoilage credits", roles: [Grower, Chef, OpsManager], code: 200, input: ["limit?", "offset?", "delivery_stop_id?", "order_item_id?", "status?"], output: "SpoilageCredit[]", side_effects: [] }
  - { method: GET, path: "/grow/spoilage-credits/{id}", description: "Get spoilage credit", roles: [Grower, Chef, OpsManager], code: 200, input: [], output: SpoilageCredit, side_effects: [] }
  - { method: POST, path: "/grow/spoilage-credits/{id}/approve", description: "Approve credit; posts to customer balance", roles: [OpsManager], code: 200, input: [], output: SpoilageCredit, side_effects: ["status -> APPROVED", "Customer.credit_balance_cents += credit_cents", "OrderItem may -> CREDITED"] }
  - { method: POST, path: "/grow/spoilage-credits/{id}/reject", description: "Reject credit", roles: [OpsManager], code: 200, input: [], output: SpoilageCredit, side_effects: ["status -> REJECTED"] }

  # --- SurplusListing ---
  - { method: POST, path: "/grow/surplus-listings", description: "List harvest surplus for farmers market", roles: [Grower], code: 201, input: [variety_id, tray_batch_id, qty_kg, market_price_cents_per_kg, market_date], output: SurplusListing, side_effects: ["status = LISTED"] }
  - { method: GET, path: "/grow/surplus-listings", description: "List surplus listings", roles: [Grower, OpsManager], code: 200, input: ["limit?", "offset?", "variety_id?", "tray_batch_id?", "status?"], output: "SurplusListing[]", side_effects: [] }
  - { method: GET, path: "/grow/surplus-listings/{id}", description: "Get surplus listing", roles: [Grower, OpsManager], code: 200, input: [], output: SurplusListing, side_effects: [] }
  - { method: POST, path: "/grow/surplus-listings/{id}/sell", description: "Mark surplus sold at market", roles: [Grower], code: 200, input: [], output: SurplusListing, side_effects: ["status -> SOLD"] }
  - { method: POST, path: "/grow/surplus-listings/{id}/withdraw", description: "Withdraw surplus listing", roles: [Grower], code: 200, input: [], output: SurplusListing, side_effects: ["status -> WITHDRAWN"] }

  # --- Test-driving clock ---
  - { method: POST, path: "/grow/_clock/set_current_utc", description: "Set the logical clock. Startup default is 2026-08-01T00:00:00Z and the clock MUST NOT fall back to wall-clock time; drives weekly cutoff lock and harvest scheduling.", roles: [OpsManager], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock advanced", "StandingOrder CONFIRMED -> LOCKED when weekday passes change_cutoff_day", "LOCKED -> CONFIRMED on weekly rollover"] }

