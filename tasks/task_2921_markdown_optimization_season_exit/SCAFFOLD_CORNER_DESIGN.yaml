      - name: unknown_path_ids_return_their_own_not_found_errors
        claim_type: Error Triggerability
        grounds:
          - validations[priority=4]
          - errors[ERR_ZONE_NOT_FOUND]
          - errors[ERR_STORE_NOT_FOUND]
          - errors[ERR_STEP_NOT_FOUND]
          - errors[ERR_EXECUTION_NOT_FOUND]
          - errors[ERR_RESERVATION_NOT_FOUND]
          - errors[ERR_AGREEMENT_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_DISPOSITION_NOT_FOUND]
        distinguishing_aspect: |
          Each resource owns a distinct 404 id and path ids are resolved left to right, so a well-formed but
          unknown id on eight different collections must produce eight different error ids - and an unknown
          parent in a nested path must report the PARENT's error, not the child's.
        test_recipe:
          setup:
            - "Season FW26-APPAREL is ACTIVE with item A-1001 registered, so the store is not empty"
            - "The uuid 00000000-0000-4000-8000-000000000001 is well formed and matches no row of any collection"
            - "The clock stands at 2026-10-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { code: "FW26-APPAREL", category: "APPAREL", season_start_date: "2026-08-15", season_end_date: "2027-01-31", exit_target_date: "2027-01-15", exit_units_target: 1000, sell_through_target_pct: 82.0, clearance_space_units: 900 }
