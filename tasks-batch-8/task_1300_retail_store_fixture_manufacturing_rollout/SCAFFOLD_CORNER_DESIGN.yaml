# =============================================================================
# Task 1300 §1.9: Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Enumerative breadth coverage of §1.1–§1.7 claims not already probed by §1.8.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: program_create_defaults_and_envelope
        claim_type: creation
        grounds: [entities.RolloutProgram]
        distinguishing_aspect: "POST /rollout-programs returns 201 with server-minted id, computed fields initialized, status DRAFT, and the fixed response envelope (meta + response_type + data)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /rollout-programs"
              payload: { program_name: "P-CORNER", retailer_code: "RTL-C", budget_total_cents: 500000, contingency_budget_cents: 50000 }
              as: ProgramManager
              captures: { prog_id: $.data.id, prog_v: $.data.version }
          assert:
            - "http_status == 201 and envelope has meta.api_request_id, response_type == object"
            - "RolloutProgram.${prog_id}.status == DRAFT"
            - "RolloutProgram.${prog_id}.remaining_budget_cents == 500000"
            - "RolloutProgram.${prog_id}.contingency_spent_cents == 0"
            - "RolloutProgram.${prog_id}.fulfilled_kit_count == 0"
            - "RolloutProgram.${prog_id}.closeout_recovery_cents == 0"
            - "RolloutProgram.${prog_id}.final_reconciliation_cents == null"
            - "RolloutProgram.${prog_id}.attic_valuation_method == PROGRAM_AVERAGE (default applied)"
            - "RolloutProgram.${prog_id}.recalled_part_numbers == [] (default applied)"
            - "version == 1 and id is a bare UUID without type prefix"

      - name: program_not_found_returns_404
        claim_type: not_found
        grounds: [entities.RolloutProgram, "errors[ERR_PROGRAM_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent program UUID returns 404 ERR_PROGRAM_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /rollout-programs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PROGRAM_NOT_FOUND"
            - "http_status == 404"
            - "envelope response_type == error and data.message present"

      - name: prototype_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.FixturePrototype, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /fixture-prototypes without target_cost_cents is rejected ERR_INVALID_REQUEST before any entity is persisted."
        test_recipe:
          setup: ["Program created (DRAFT)"]
          setup_api_calls:
            - call: "POST /rollout-programs"
              payload: { program_name: "P-REQ", retailer_code: "RTL-C", budget_total_cents: 500000, contingency_budget_cents: 50000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /fixture-prototypes"
              payload: { program_id: "${prog_id}", fixture_code: "GONDOLA-4FT", bom_lines: [ { part_number: "PN-1", quantity: 1, list_unit_cost_cents: 100 } ] }
              as: FixtureEngineer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"
            - "GET /fixture-prototypes?program_id=${prog_id} returns total_count == 0"

      - name: claim_type_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.DamageClaim.fields.claim_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "claim_type outside {DAMAGED, MISSING} is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "Full chain to a DELIVERED delivery (program ACTIVE, prototype APPROVED, kit 10@1000 FROZEN+RELEASED on capacity-100 wave, delivery dispatched and confirmed)"
          setup_api_calls:
            - call: "POST /rollout-programs"
              payload: { program_name: "P-ENUM", retailer_code: "RTL-C", budget_total_cents: 1000000, contingency_budget_cents: 100000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /rollout-programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /fixture-prototypes"
              payload: { program_id: "${prog_id}", fixture_code: "ENDCAP", bom_lines: [ { part_number: "PN-600", quantity: 1, list_unit_cost_cents: 3000 } ], target_cost_cents: 999999 }
              as: FixtureEngineer
              captures: { proto_id: $.data.id }
            - call: "POST /fixture-prototypes/${proto_id}/submit-review"
              payload: {}
              as: FixtureEngineer
              as_user_id: "eng-1"
            - call: "POST /fixture-prototypes/${proto_id}/approve"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /store-kit-configs"
              payload: { program_id: "${prog_id}", prototype_id: "${proto_id}", store_code: "STORE-E1", config_lines: [ { part_number: "PN-600", quantity: 10, unit_cost_cents: 1000 } ] }
              as: ConfigCoordinator
              captures: { kit_id: $.data.id }
            - call: "POST /store-kit-configs/${kit_id}/freeze"
              payload: {}
              as: ConfigCoordinator
            - call: "POST /production-waves"
              payload: { program_id: "${prog_id}", wave_label: "WAVE-E1", start_date: "2026-09-01", end_date: "2026-09-10", capacity_units: 100 }
              as: ProductionPlanner
              captures: { wave_id: $.data.id }
            - call: "POST /production-waves/${wave_id}/commit"
              payload: {}
              as: ProductionPlanner
            - call: "POST /store-kit-configs/${kit_id}/release"
              payload: { wave_id: "${wave_id}" }
              as: ConfigCoordinator
            - call: "POST /install-deliveries"
              payload: { kit_id: "${kit_id}", crew_code: "CREW-E", delivery_date: "2026-09-12", estimated_install_hours: 4 }
              as: InstallCrewLead
              captures: { del_id: $.data.id }
            - call: "POST /install-deliveries/${del_id}/dispatch"
              payload: {}
              as: InstallCrewLead
            - call: "POST /install-deliveries/${del_id}/confirm-delivery"
              payload: {}
              as: InstallCrewLead
          trigger:
            - call: "POST /damage-claims"
              payload: { delivery_id: "${del_id}", part_number: "PN-600", claim_type: "SCRATCHED", replacement_component_count: 1, replacement_cost_cents: 100 }
              as: HotlineAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"

      - name: kit_list_pagination_and_filter
        claim_type: listing
        grounds: [entities.StoreKitConfig, response_envelope]
        distinguishing_aspect: "GET /store-kit-configs?program_id=…&limit=1 returns only that program's kits with pagination fields total_count/has_more consistent."
        test_recipe:
          setup:
            - "Two ACTIVE programs P1, P2; P1 has two DRAFT kits, P2 has one DRAFT kit (each referencing its own approved prototype)"
          setup_api_calls:
            - call: "POST /rollout-programs"
              payload: { program_name: "P-LIST1", retailer_code: "RTL-C", budget_total_cents: 1000000, contingency_budget_cents: 100000 }
              as: ProgramManager
              captures: { prog1: $.data.id }
            - call: "POST /rollout-programs/${prog1}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /fixture-prototypes"
              payload: { program_id: "${prog1}", fixture_code: "ENDCAP", bom_lines: [ { part_number: "PN-600", quantity: 1, list_unit_cost_cents: 3000 } ], target_cost_cents: 999999 }
              as: FixtureEngineer
              captures: { proto1: $.data.id }
            - call: "POST /fixture-prototypes/${proto1}/submit-review"
              payload: {}
              as: FixtureEngineer
              as_user_id: "eng-1"
            - call: "POST /fixture-prototypes/${proto1}/approve"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /store-kit-configs"
              payload: { program_id: "${prog1}", prototype_id: "${proto1}", store_code: "STORE-L1" }
              as: ConfigCoordinator
            - call: "POST /store-kit-configs"
              payload: { program_id: "${prog1}", prototype_id: "${proto1}", store_code: "STORE-L2" }
              as: ConfigCoordinator
            - call: "POST /rollout-programs"
              payload: { program_name: "P-LIST2", retailer_code: "RTL-C", budget_total_cents: 1000000, contingency_budget_cents: 100000 }
              as: ProgramManager
              captures: { prog2: $.data.id }
            - call: "POST /rollout-programs/${prog2}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /fixture-prototypes"
              payload: { program_id: "${prog2}", fixture_code: "ENDCAP", bom_lines: [ { part_number: "PN-600", quantity: 1, list_unit_cost_cents: 3000 } ], target_cost_cents: 999999 }
              as: FixtureEngineer
              captures: { proto2: $.data.id }
            - call: "POST /fixture-prototypes/${proto2}/submit-review"
              payload: {}
              as: FixtureEngineer
              as_user_id: "eng-1"
            - call: "POST /fixture-prototypes/${proto2}/approve"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /store-kit-configs"
              payload: { program_id: "${prog2}", prototype_id: "${proto2}", store_code: "STORE-L3" }
              as: ConfigCoordinator
          trigger:
            - call: "GET /store-kit-configs"
              payload: {}
              as: ProgramManager
          assert:
            - "GET /store-kit-configs?program_id=${prog1}&limit=1&offset=0 → total_count == 2, has_more == true, data length == 1, all rows program_id == ${prog1}"
            - "GET /store-kit-configs?program_id=${prog1}&limit=1&offset=1 → total_count == 2, has_more == false"
            - "GET /store-kit-configs?program_id=${prog2} → total_count == 1"

      - name: version_increments_on_mutation
        claim_type: system_fields
        grounds: [entities.StoreKitConfig, "concurrency_rules[kit-config-patch-stale-version]"]
        distinguishing_aspect: "Kit version starts at 1 on create and increments by exactly 1 on a successful PATCH; updated_at refreshes."
        test_recipe:
          setup:
            - "Program ACTIVE; prototype APPROVED; kit created in DRAFT without lines"
          setup_api_calls:
            - call: "POST /rollout-programs"
              payload: { program_name: "P-VER", retailer_code: "RTL-C", budget_total_cents: 1000000, contingency_budget_cents: 100000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /rollout-programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /fixture-prototypes"
              payload: { program_id: "${prog_id}", fixture_code: "ENDCAP", bom_lines: [ { part_number: "PN-600", quantity: 1, list_unit_cost_cents: 3000 } ], target_cost_cents: 999999 }
              as: FixtureEngineer
              captures: { proto_id: $.data.id }
            - call: "POST /fixture-prototypes/${proto_id}/submit-review"
              payload: {}
              as: FixtureEngineer
              as_user_id: "eng-1"
            - call: "POST /fixture-prototypes/${proto_id}/approve"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /store-kit-configs"
              payload: { program_id: "${prog_id}", prototype_id: "${proto_id}", store_code: "STORE-V1" }
              as: ConfigCoordinator
              captures: { kit_id: $.data.id, kit_v: $.data.version }
          trigger:
            - call: "PATCH /store-kit-configs/${kit_id}"
              payload: { config_lines: [ { part_number: "PN-600", quantity: 3, unit_cost_cents: 1000 } ], expected_config_version: "${kit_v}" }
              as: ConfigCoordinator
              captures: { kit_v2: $.data.version }
          assert:
            - "kit_v == 1 at creation"
            - "kit_v2 == 2 after PATCH"
            - "StoreKitConfig.${kit_id}.total_components == 3"
            - "StoreKitConfig.${kit_id}.updated_at > created_at"

      - name: computed_field_input_ignored_on_program_create
        claim_type: computed_fields
        grounds: [entities.RolloutProgram.fields.remaining_budget_cents]
        distinguishing_aspect: "Client-supplied remaining_budget_cents on create is ignored; server initializes it to budget_total_cents."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /rollout-programs"
              payload: { program_name: "P-IGN", retailer_code: "RTL-C", budget_total_cents: 500000, contingency_budget_cents: 50000, remaining_budget_cents: 1 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
          assert:
            - "RolloutProgram.${prog_id}.remaining_budget_cents == 500000 (client-supplied 1 ignored)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_active_program_returns_409
        claim_type: invalid_transition
        grounds: [state_machines.RolloutProgram.DRAFT_to_ACTIVE, "errors[ERR_PROGRAM_NOT_ACTIVE]"]
        distinguishing_aspect: "Second activate on an already-ACTIVE program is rejected ERR_PROGRAM_NOT_ACTIVE with no side effects."
        test_recipe:
          setup: ["Program created and activated"]
          setup_api_calls:
            - call: "POST /rollout-programs"
              payload: { program_name: "P-SM1", retailer_code: "RTL-C", budget_total_cents: 500000, contingency_budget_cents: 50000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /rollout-programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "POST /rollout-programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PROGRAM_NOT_ACTIVE"
            - "http_status == 409"
            - "RolloutProgram.${prog_id}.status == ACTIVE"

      - name: closed_program_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RolloutProgram]
        distinguishing_aspect: "CLOSED is terminal: initiate-closeout on a CLOSED program fails ERR_PROGRAM_NOT_ACTIVE."
        test_recipe:
          setup:
            - "Program driven to CLOSED via the full single-kit chain (kit FULFILLED, wave COMPLETE, closeout initiated, ledger disposed, finalized)"
          setup_api_calls:
            - call: "POST /rollout-programs"
              payload: { program_name: "P-SM2", retailer_code: "RTL-C", budget_total_cents: 2000000, contingency_budget_cents: 100000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /rollout-programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /fixture-prototypes"
              payload: { program_id: "${prog_id}", fixture_code: "GONDOLA-8FT", bom_lines: [ { part_number: "PN-300", quantity: 5, list_unit_cost_cents: 9000 } ], target_cost_cents: 999999 }
              as: FixtureEngineer
              captures: { proto_id: $.data.id }
            - call: "POST /fixture-prototypes/${proto_id}/submit-review"
              payload: {}
              as: FixtureEngineer
              as_user_id: "eng-1"
            - call: "POST /fixture-prototypes/${proto_id}/approve"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /store-kit-configs"
              payload: { program_id: "${prog_id}", prototype_id: "${proto_id}", store_code: "STORE-S2", config_lines: [ { part_number: "PN-300", quantity: 100, unit_cost_cents: 3000 } ] }
              as: ConfigCoordinator
              captures: { kit_id: $.data.id }
            - call: "POST /store-kit-configs/${kit_id}/freeze"
              payload: {}
              as: ConfigCoordinator
            - call: "POST /production-waves"
              payload: { program_id: "${prog_id}", wave_label: "WAVE-S2", start_date: "2026-09-01", end_date: "2026-09-10", capacity_units: 200 }
              as: ProductionPlanner
              captures: { wave_id: $.data.id }
            - call: "POST /production-waves/${wave_id}/commit"
              payload: {}
              as: ProductionPlanner
            - call: "POST /store-kit-configs/${kit_id}/release"
              payload: { wave_id: "${wave_id}" }
              as: ConfigCoordinator
            - call: "POST /install-deliveries"
              payload: { kit_id: "${kit_id}", crew_code: "CREW-S2", delivery_date: "2026-09-12", estimated_install_hours: 5 }
              as: InstallCrewLead
              captures: { del_id: $.data.id }
            - call: "POST /install-deliveries/${del_id}/dispatch"
              payload: {}
              as: InstallCrewLead
            - call: "POST /install-deliveries/${del_id}/confirm-delivery"
              payload: {}
              as: InstallCrewLead
            - call: "POST /install-signoffs"
              payload: { delivery_id: "${del_id}", photo_urls: [ "https://photos/s2.jpg" ] }
              as: InstallCrewLead
              as_user_id: "crew-1"
              captures: { so_id: $.data.id }
            - call: "POST /install-signoffs/${so_id}/approve"
              payload: {}
              as: StoreManager
              as_user_id: "sm-1"
            - call: "GET /attic-stock-ledgers"
              payload: {}
              as: ProgramManager
              captures: { ledger_id: "$.data[0].id"}
            - call: "POST /production-waves/${wave_id}/complete"
              payload: {}
              as: ProductionPlanner
            - call: "POST /rollout-programs/${prog_id}/initiate-closeout"
              payload: {}
              as: ProgramManager
            - call: "POST /attic-stock-ledgers/${ledger_id}/dispose"
              payload: { disposition_type: "SCRAP" }
              as: ProgramManager
            - call: "POST /rollout-programs/${prog_id}/finalize-closeout"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "POST /rollout-programs/${prog_id}/initiate-closeout"
              payload: {}
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PROGRAM_NOT_ACTIVE"
            - "RolloutProgram.${prog_id}.status == CLOSED"
            - "RolloutProgram.${prog_id}.final_reconciliation_cents == 1667795"

      - name: kit_created_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.StoreKitConfig]
        distinguishing_aspect: "A newly created kit starts in DRAFT with total_components 0 and wave_id null when no config_lines supplied."
        test_recipe:
          setup: ["Program ACTIVE; prototype APPROVED"]
          setup_api_calls:
            - call: "POST /rollout-programs"
              payload: { program_name: "P-SM3", retailer_code: "RTL-C", budget_total_cents: 1000000, contingency_budget_cents: 100000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /rollout-programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /fixture-prototypes"
              payload: { program_id: "${prog_id}", fixture_code: "ENDCAP", bom_lines: [ { part_number: "PN-600", quantity: 1, list_unit_cost_cents: 3000 } ], target_cost_cents: 999999 }
              as: FixtureEngineer
              captures: { proto_id: $.data.id }
            - call: "POST /fixture-prototypes/${proto_id}/submit-review"
              payload: {}
              as: FixtureEngineer
              as_user_id: "eng-1"
            - call: "POST /fixture-prototypes/${proto_id}/approve"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
          trigger:
            - call: "POST /store-kit-configs"
              payload: { program_id: "${prog_id}", prototype_id: "${proto_id}", store_code: "STORE-S3" }
              as: ConfigCoordinator
              captures: { kit_id: $.data.id }
          assert:
            - "StoreKitConfig.${kit_id}.status == DRAFT"
            - "StoreKitConfig.${kit_id}.total_components == 0"
            - "StoreKitConfig.${kit_id}.kit_total_cost_cents == 0"
            - "StoreKitConfig.${kit_id}.wave_id == null"

      - name: freeze_locks_prototype_bubble_up
        claim_type: side_effect_execution
        grounds: [state_machines.FixturePrototype.APPROVED_to_LOCKED, state_machines.StoreKitConfig.DRAFT_to_FROZEN]
        distinguishing_aspect: "The first kit freeze bubbles up to the prototype: APPROVED → LOCKED, and a subsequent PATCH on the LOCKED prototype is rejected ERR_PROTOTYPE_INVALID_STATE."
        test_recipe:
          setup: ["Program ACTIVE; prototype APPROVED; kit with one line in DRAFT"]
          setup_api_calls:
            - call: "POST /rollout-programs"
              payload: { program_name: "P-SM4", retailer_code: "RTL-C", budget_total_cents: 1000000, contingency_budget_cents: 100000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /rollout-programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /fixture-prototypes"
              payload: { program_id: "${prog_id}", fixture_code: "ENDCAP", bom_lines: [ { part_number: "PN-600", quantity: 1, list_unit_cost_cents: 3000 } ], target_cost_cents: 999999 }
              as: FixtureEngineer
              captures: { proto_id: $.data.id }
            - call: "POST /fixture-prototypes/${proto_id}/submit-review"
              payload: {}
              as: FixtureEngineer
              as_user_id: "eng-1"
            - call: "POST /fixture-prototypes/${proto_id}/approve"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /store-kit-configs"
              payload: { program_id: "${prog_id}", prototype_id: "${proto_id}", store_code: "STORE-S4", config_lines: [ { part_number: "PN-600", quantity: 5, unit_cost_cents: 1000 } ] }
              as: ConfigCoordinator
              captures: { kit_id: $.data.id }
          trigger:
            - call: "POST /store-kit-configs/${kit_id}/freeze"
              payload: {}
              as: ConfigCoordinator
            - call: "PATCH /fixture-prototypes/${proto_id}"
              payload: { bom_lines: [ { part_number: "PN-600", quantity: 2, list_unit_cost_cents: 3000 } ] }
              as: FixtureEngineer
              captures: { err: $.data.error_id }
          assert:
            - "FixturePrototype.${proto_id}.status == LOCKED after the freeze"
            - "PATCH on LOCKED prototype: error_id == ERR_PROTOTYPE_INVALID_STATE"
            - "FixturePrototype.${proto_id}.bom_lines unchanged (quantity still 1)"

      - name: clock_advance_auto_starts_wave_and_expires_reservation
        claim_type: valid_transition
        grounds: [state_machines.ProductionWave.COMMITTED_to_IN_PRODUCTION, state_machines.StagingReservation.HELD_to_EXPIRED]
        distinguishing_aspect: "Advancing the logical clock past wave.start_date auto-transitions COMMITTED → IN_PRODUCTION, and past a HELD reservation's end_ts auto-transitions it → EXPIRED, both as side effects of POST /_clock/set_current_utc."
        test_recipe:
          setup:
            - "Program ACTIVE; prototype APPROVED; kit FROZEN+RELEASED to COMMITTED wave (start_date 2026-08-10); reservation HELD [2026-08-05T10:00:00Z, 2026-08-06T10:00:00Z) — reservation created against RELEASED kit before wave start"
          setup_api_calls:
            - call: "POST /rollout-programs"
              payload: { program_name: "P-SM5", retailer_code: "RTL-C", budget_total_cents: 1000000, contingency_budget_cents: 100000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /rollout-programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /fixture-prototypes"
              payload: { program_id: "${prog_id}", fixture_code: "ENDCAP", bom_lines: [ { part_number: "PN-600", quantity: 1, list_unit_cost_cents: 3000 } ], target_cost_cents: 999999 }
              as: FixtureEngineer
              captures: { proto_id: $.data.id }
            - call: "POST /fixture-prototypes/${proto_id}/submit-review"
              payload: {}
              as: FixtureEngineer
              as_user_id: "eng-1"
            - call: "POST /fixture-prototypes/${proto_id}/approve"
              payload: {}
              as: ProgramManager
