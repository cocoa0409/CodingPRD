            - "Account.${b1}.active_holdings_mwh == 0 and Account.${b2}.active_holdings_mwh == 5"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: reading_requires_generator_active
        grounds:
          - state_machines.MeterReading.transitions
          - validations[priority=6]
          - errors[ERR_GENERATOR_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair MeterReading -> Generator: reading creation is gated on the GENERATOR's status, not the
          reading's own — SUSPENDED and DECOMMISSIONED generators reject new readings with
          ERR_GENERATOR_NOT_ACTIVE even though the payload is otherwise valid.
        test_recipe:
          setup: ["Generator g verified ACTIVE, then suspended, then reinstated, then decommissioned"]
          setup_api_calls:
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id }
            - call: "POST /greenpower/generators/${g}/submit-verification"
              payload: {}
              as: GeneratorOperator
              as_user_id: "${g}"
            - call: "POST /greenpower/generators/${g}/verify"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/generators/${g}/suspend"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", metered_kwh: 100 }
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { err1: $.data.error_id }
            - call: "POST /greenpower/generators/${g}/reinstate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/generators/${g}/decommission"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", metered_kwh: 100 }
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_GENERATOR_NOT_ACTIVE (reading create while generator SUSPENDED)"
            - "err2 == ERR_GENERATOR_NOT_ACTIVE (reading create while generator DECOMMISSIONED)"
            - "no MeterReading rows exist for ${g} (GET /greenpower/meter-readings?generator_id=${g} returns empty data)"

      - name: subscription_create_requires_program_open
        grounds:
          - state_machines.Program
          - validations[priority=11]
          - errors[ERR_PROGRAM_NOT_OPEN]
        distinguishing_aspect: |
          Pair Subscription -> Program: creating a subscription is gated on the PROGRAM's lifecycle state —
          against a DRAFT program the create fails with ERR_PROGRAM_NOT_OPEN even with a correct OCC version
          and valid payload.
        test_recipe:
          setup: ["Program created (DRAFT, version 1), never opened"]
          setup_api_calls:
            - call: "POST /greenpower/programs"
              payload: { name: "SunTariff", market_class: "VOLUNTARY", eligible_region_codes: ["CAISO"], eligible_technologies: ["SOLAR"], capacity_cap_kw: 1000, rate_tiers: [{up_to_kwh: 500, rate_cents_per_kwh: 5}], annual_claim_cap_mwh: 10000 }
              as: RegistryAdmin
              captures: { p: $.data.id, pv: $.data.version }
          trigger:
            - call: "POST /greenpower/subscriptions"
              payload: { program_id: "${p}", customer_name: "Customer A", utility_account_no: "U-A", allocation_kw: 600, estimated_usage_kwh: 5000, expected_program_version: "${pv}" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PROGRAM_NOT_OPEN (program still DRAFT; OCC version matched yet the state gate fires)"
            - "HTTP status 409"

      - name: retirement_requires_open_obligation
        grounds:
          - state_machines.ComplianceObligation
          - validations[priority=14]
          - errors[ERR_OBLIGATION_NOT_OPEN]
        distinguishing_aspect: |
          Pair Retirement -> ComplianceObligation: a compliance retirement is gated on the OBLIGATION's
          status — retiring a perfectly valid ACTIVE certificate into a CLOSED_SHORTFALL obligation fails
          with ERR_OBLIGATION_NOT_OPEN and the certificate stays ACTIVE.
        test_recipe:
          setup: ["Obligation closed with zero coverage; 1-MWh ACTIVE certificate minted"]
          setup_api_calls:
            - call: "POST /greenpower/compliance-obligations"
              payload: { lse_name: "LSE One", year: 2026, region_code: "CAISO", required_mwh: 5, penalty_rate_cents_per_mwh: 5000 }
              as: ComplianceOfficer
              captures: { ob: $.data.id }
            - call: "POST /greenpower/compliance-obligations/${ob}/close"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id }
            - call: "POST /greenpower/generators/${g}/submit-verification"
              payload: {}
              as: GeneratorOperator
              as_user_id: "${g}"
            - call: "POST /greenpower/generators/${g}/verify"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", metered_kwh: 1000 }
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { r1: $.data.id }
            - call: "POST /greenpower/meter-readings/${r1}/attest"
              payload: {}
              as: MeterAttester
              as_user_id: "att-1"
            - call: "POST /greenpower/meter-readings/${r1}/accept"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/generators/${g}/mint-run"
              payload: {}
              as: RegistryAdmin
            - call: "GET /greenpower/certificates?generator_id=${g}&vintage_month=2026-07"
              as: RegistryAdmin
              captures: { c: "$.data[0].id" }
          trigger:
            - call: "POST /greenpower/retirements"
              payload: { certificate_id: "${c}", purpose: "COMPLIANCE", obligation_id: "${ob}" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_OBLIGATION_NOT_OPEN (obligation CLOSED_SHORTFALL)"
            - "Certificate.${c}.status unchanged == ACTIVE; no Retirement row created for ${c}"

      - name: trade_settle_requires_active_buyer_account
        grounds:
          - state_machines.Trade.ACCEPTED_to_SETTLED
          - validations[priority=8]
          - errors[ERR_ACCOUNT_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair Trade -> Account: settling an ACCEPTED trade is gated on BOTH counterparty accounts' standing —
          suspending the buyer after acceptance makes the otherwise-valid settle fail with
          ERR_ACCOUNT_NOT_ACTIVE while the certificate remains LOCKED.
        test_recipe:
          setup: ["1-MWh certificate in b1; trade b1 -> b2 ACCEPTED (certificate LOCKED); buyer b2 then suspended"]
          setup_api_calls:
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id }
            - call: "POST /greenpower/generators/${g}/submit-verification"
              payload: {}
              as: GeneratorOperator
              as_user_id: "${g}"
            - call: "POST /greenpower/generators/${g}/verify"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", metered_kwh: 1000 }
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { r1: $.data.id }
            - call: "POST /greenpower/meter-readings/${r1}/attest"
              payload: {}
              as: MeterAttester
              as_user_id: "att-1"
            - call: "POST /greenpower/meter-readings/${r1}/accept"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/generators/${g}/mint-run"
              payload: {}
              as: RegistryAdmin
            - call: "GET /greenpower/certificates?generator_id=${g}&vintage_month=2026-07"
              as: RegistryAdmin
              captures: { c: "$.data[0].id" }
            - call: "POST /greenpower/accounts"
              payload: { account_type: "BROKER", owner_name: "Broker One" }
              as: RegistryAdmin
              captures: { b1: $.data.id }
            - call: "POST /greenpower/accounts"
              payload: { account_type: "BROKER", owner_name: "Broker Two" }
              as: RegistryAdmin
              captures: { b2: $.data.id }
            - call: "POST /greenpower/certificates/${c}/transfer"
              payload: { to_account_id: "${b1}" }
              as: RegistryAdmin
            - call: "POST /greenpower/trades"
              payload: { from_account_id: "${b1}", to_account_id: "${b2}", items: [{certificate_id: "${c}", quantity_mwh: 1}], unit_price_cents_per_mwh: 300, settlement_mode: "GROSS" }
              as: BrokerTrader
              as_user_id: "${b1}"
              captures: { t: $.data.id }
            - call: "POST /greenpower/trades/${t}/accept"
              payload: {}
              as: BrokerTrader
              as_user_id: "${b2}"
            - call: "POST /greenpower/accounts/${b2}/suspend"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "POST /greenpower/trades/${t}/settle"
              payload: {}
              as: BrokerTrader
              as_user_id: "${b2}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ACCOUNT_NOT_ACTIVE (buyer suspended between accept and settle)"
            - "Trade.${t}.status remains ACCEPTED and Certificate.${c}.status remains LOCKED"
            - "Certificate.${c}.account_id unchanged == ${b1}"

  - rule_id: resource_temporal_overlap
    instances:
      - name: reading_half_open_interval_overlap
        grounds:
          - validations[priority=21]
          - errors[ERR_READING_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Interval semantics #1 — half-open timestamp intervals [period_start, period_end) on the generator's
          reading timeline: an interior overlap [07-10, 07-20) vs [07-01, 07-15) is rejected, while exact
          adjacency (period_start == prior period_end) is accepted without gap penalty.
        test_recipe:
          setup: ["Generator ACTIVE; reading r1 [2026-07-01, 2026-07-15) accepted into SUBMITTED"]
          setup_api_calls:
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id }
            - call: "POST /greenpower/generators/${g}/submit-verification"
              payload: {}
              as: GeneratorOperator
              as_user_id: "${g}"
            - call: "POST /greenpower/generators/${g}/verify"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-15T00:00:00Z", metered_kwh: 100 }
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-07-10T00:00:00Z", period_end: "2026-07-20T00:00:00Z", metered_kwh: 100 }
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { err: $.data.error_id }
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-07-15T00:00:00Z", period_end: "2026-07-31T00:00:00Z", metered_kwh: 100 }
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { r3: $.data.id }
          assert:
            - "err == ERR_READING_PERIOD_OVERLAP (HTTP 409): [07-10, 07-20) intersects [07-01, 07-15)"
            - "adjacent reading ${r3} [07-15, 07-31) is created (period_start == existing period_end touches without overlapping under half-open semantics)"
            - "MeterReading.${r3}.status == SUBMITTED"

      - name: vintage_closed_month_window_eligibility
        grounds:
          - calculations.vintage_eligibility
          - validations[priority=25]
          - errors[ERR_VINTAGE_INELIGIBLE]
        distinguishing_aspect: |
          Interval semantics #2 — closed month-granularity containment against a program window: with
          vintage_window_months 12 and clock month 2026-08, vintage 2025-09 (11 months back) is eligible while
          vintage 2025-08 (12 months back) is rejected — inclusive both ends, unlike the half-open reading rule.
        test_recipe:
          setup:
            - "Generator ACTIVE; certificates minted with vintage 2025-08 and 2025-09 (readings attested inside their 30-day windows via clock control); program vintage_window_months 12"
            - "logical clock at 2026-08-15 for the retirement attempts"
          setup_api_calls:
            - call: "POST /greenpower/programs"
              payload: { name: "SunTariff", market_class: "VOLUNTARY", eligible_region_codes: ["CAISO"], eligible_technologies: ["SOLAR"], capacity_cap_kw: 1000, rate_tiers: [{up_to_kwh: 500, rate_cents_per_kwh: 5}], annual_claim_cap_mwh: 10000, vintage_window_months: 12 }
              as: RegistryAdmin
              captures: { p: $.data.id }
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id }
            - call: "POST /greenpower/generators/${g}/submit-verification"
              payload: {}
              as: GeneratorOperator
              as_user_id: "${g}"
            - call: "POST /greenpower/generators/${g}/verify"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/_clock/set_current_utc"
              payload: { to_iso8601: "2025-09-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2025-08-01T00:00:00Z", period_end: "2025-09-01T00:00:00Z", metered_kwh: 1000 }
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { r1: $.data.id }
            - call: "POST /greenpower/meter-readings/${r1}/attest"
              payload: {}
              as: MeterAttester
              as_user_id: "att-1"
            - call: "POST /greenpower/meter-readings/${r1}/accept"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/_clock/set_current_utc"
              payload: { to_iso8601: "2025-10-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2025-09-01T00:00:00Z", period_end: "2025-10-01T00:00:00Z", metered_kwh: 1000 }
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { r2: $.data.id }
            - call: "POST /greenpower/meter-readings/${r2}/attest"
              payload: {}
              as: MeterAttester
              as_user_id: "att-1"
            - call: "POST /greenpower/meter-readings/${r2}/accept"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/generators/${g}/mint-run"
              payload: {}
              as: RegistryAdmin
            - call: "GET /greenpower/certificates?generator_id=${g}&vintage_month=2025-08"
              as: RegistryAdmin
              captures: { c_old: "$.data[0].id" }
            - call: "GET /greenpower/certificates?generator_id=${g}&vintage_month=2025-09"
              as: RegistryAdmin
              captures: { c_edge: "$.data[0].id" }
            - call: "POST /greenpower/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /greenpower/retirements"
              payload: { certificate_id: "${c_edge}", purpose: "VOLUNTARY_PROGRAM", program_id: "${p}" }
              as: ProgramManager
              captures: { ret: $.data.id }
            - call: "POST /greenpower/retirements"
              payload: { certificate_id: "${c_old}", purpose: "VOLUNTARY_PROGRAM", program_id: "${p}" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "vintage 2025-09 retirement ${ret} succeeds (months_between == 11 <= vintage_window_months - 1 == 11: closed upper boundary)"
            - "err == ERR_VINTAGE_INELIGIBLE for vintage 2025-08 (months_between == 12: one month past the window)"
            - "Certificate.${c_old}.status remains ACTIVE"

  - rule_id: compensating_invariant
    instances:
      - name: serial_partition_conservation
        grounds:
          - calculations.serial_split_partition
          - entities.Certificate.fields.serial_start
          - entities.Certificate.fields.quantity_mwh
        distinguishing_aspect: |
          Conserved quantity = certificate units and serial space per minted batch: settle-split partitions
          [1,100] into [1,37] (buyer) + [38,100] (seller remainder) with 37 + 63 == 100 and no serial gap or
          overlap; a subsequent lock-then-expire round on the remainder restores LOCKED -> ACTIVE with zero
          drift in units, serials, or account holdings.
        test_recipe:
          setup: ["100-MWh certificate (serials [1,100]) in b1; trade1 for 37 MWh settled to b2; trade2 for 10 MWh on the remainder accepted then expired"]
          setup_api_calls:
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id }
            - call: "POST /greenpower/generators/${g}/submit-verification"
              payload: {}
              as: GeneratorOperator
              as_user_id: "${g}"
            - call: "POST /greenpower/generators/${g}/verify"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", metered_kwh: 100000 }
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { r1: $.data.id }
            - call: "POST /greenpower/meter-readings/${r1}/attest"
              payload: {}
              as: MeterAttester
              as_user_id: "att-1"
            - call: "POST /greenpower/meter-readings/${r1}/accept"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/generators/${g}/mint-run"
              payload: {}
              as: RegistryAdmin
            - call: "GET /greenpower/certificates?generator_id=${g}&vintage_month=2026-07"
              as: RegistryAdmin
              captures: { c: "$.data[0].id" }
            - call: "POST /greenpower/accounts"
              payload: { account_type: "BROKER", owner_name: "Broker One" }
              as: RegistryAdmin
              captures: { b1: $.data.id }
            - call: "POST /greenpower/accounts"
              payload: { account_type: "BROKER", owner_name: "Broker Two" }
              as: RegistryAdmin
              captures: { b2: $.data.id }
            - call: "POST /greenpower/certificates/${c}/transfer"
              payload: { to_account_id: "${b1}" }
              as: RegistryAdmin
            - call: "POST /greenpower/trades"
              payload: { from_account_id: "${b1}", to_account_id: "${b2}", items: [{certificate_id: "${c}", quantity_mwh: 37}], unit_price_cents_per_mwh: 300, settlement_mode: "GROSS" }
              as: BrokerTrader
              as_user_id: "${b1}"
              captures: { t1: $.data.id }
            - call: "POST /greenpower/trades/${t1}/accept"
              payload: {}
              as: BrokerTrader
              as_user_id: "${b2}"
            - call: "POST /greenpower/trades/${t1}/settle"
              payload: {}
              as: BrokerTrader
              as_user_id: "${b2}"
            - call: "GET /greenpower/certificates?account_id=${b2}"
              as: RegistryAdmin
              captures: { cs: "$.data[0].id" }
            - call: "POST /greenpower/trades"
              payload: { from_account_id: "${b1}", to_account_id: "${b2}", items: [{certificate_id: "${c}", quantity_mwh: 10}], unit_price_cents_per_mwh: 300, settlement_mode: "GROSS" }
              as: BrokerTrader
              as_user_id: "${b1}"
              captures: { t2: $.data.id }
            - call: "POST /greenpower/trades/${t2}/accept"
              payload: {}
              as: BrokerTrader
              as_user_id: "${b2}"
          trigger:
            - call: "POST /greenpower/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /greenpower/trades/${t2}/expire"
              payload: {}
              as: RegistryAdmin
          assert:
            - "buyer slice Certificate.${cs}: serial_start == 1, serial_end == 37, quantity_mwh == 37, account_id == ${b2}, status == ACTIVE"
            - "remainder Certificate.${c}: serial_start == 38, serial_end == 100, quantity_mwh == 63 (partition [1,37] + [38,100] == [1,100])"
            - "37 + 63 == 100: total units conserved across the split; Generator.${g}.lifetime_minted_mwh unchanged == 100"
            - "after expire: Certificate.${c}.status == ACTIVE and account_id == ${b1} (lock fully compensated)"
            - "Account.${b1}.active_holdings_mwh == 63 and Account.${b2}.active_holdings_mwh == 37 (sum == 100 conserved)"

      - name: capacity_conservation_round_trip
        grounds:
          - calculations.waitlist_promotion_scan
          - entities.Program.fields.committed_capacity_kw
          - state_machines.Subscription.ACTIVE_to_TERMINATED
        distinguishing_aspect: |
          Conserved quantity = program capacity accounting: after every terminate + promotion-scan round,
          committed_capacity_kw equals exactly the sum of ACTIVE allocations and never exceeds the cap —
          terminate A (600) promotes C (500): committed 1000 -> 900; terminate B (400): committed -> 500.
        test_recipe:
          setup: ["Program cap 1000; A 600 and B 400 ACTIVE (committed 1000); C 500 WAITLISTED"]
          setup_api_calls:
            - call: "POST /greenpower/programs"
              payload: { name: "SunTariff", market_class: "VOLUNTARY", eligible_region_codes: ["CAISO"], eligible_technologies: ["SOLAR"], capacity_cap_kw: 1000, rate_tiers: [{up_to_kwh: 500, rate_cents_per_kwh: 5}], annual_claim_cap_mwh: 10000 }
              as: RegistryAdmin
              captures: { p: $.data.id, pv: $.data.version }
            - call: "POST /greenpower/accounts"
              payload: { account_type: "PROGRAM", owner_name: "SunTariff Holding", program_id: "${p}" }
              as: RegistryAdmin
              captures: { pacc: $.data.id }
            - call: "PATCH /greenpower/programs/${p}"
              payload: { expected_program_version: "${pv}", holding_account_id: "${pacc}" }
              as: RegistryAdmin
              captures: { pv2: $.data.version }
            - call: "POST /greenpower/programs/${p}/open"
              payload: {}
              as: RegistryAdmin
              captures: { pv3: $.data.version }
            - call: "POST /greenpower/subscriptions"
              payload: { program_id: "${p}", customer_name: "Customer A", utility_account_no: "U-A", allocation_kw: 600, estimated_usage_kwh: 5000, expected_program_version: "${pv3}" }
              as: ProgramManager
              captures: { sa: $.data.id }
            - call: "POST /greenpower/subscriptions/${sa}/activate"
              payload: {}
              as: ProgramManager
            - call: "GET /greenpower/programs/${p}"
              as: ProgramManager
              captures: { pv5: $.data.version }
            - call: "POST /greenpower/subscriptions"
              payload: { program_id: "${p}", customer_name: "Customer B", utility_account_no: "U-B", allocation_kw: 400, estimated_usage_kwh: 3000, expected_program_version: "${pv5}" }
              as: ProgramManager
              captures: { sb: $.data.id }
            - call: "POST /greenpower/subscriptions/${sb}/activate"
              payload: {}
              as: ProgramManager
            - call: "GET /greenpower/programs/${p}"
              as: ProgramManager
              captures: { pv7: $.data.version }
            - call: "POST /greenpower/subscriptions"
              payload: { program_id: "${p}", customer_name: "Customer C", utility_account_no: "U-C", allocation_kw: 500, estimated_usage_kwh: 4000, expected_program_version: "${pv7}" }
              as: ProgramManager
              captures: { sc: $.data.id }
            - call: "POST /greenpower/subscriptions/${sc}/activate"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "POST /greenpower/subscriptions/${sa}/terminate"
              payload: {}
              as: ProgramManager
            - call: "POST /greenpower/subscriptions/${sb}/terminate"
              payload: {}
              as: ProgramManager
          assert:
            - "after terminating ${sa}: Subscription.${sc}.status == ACTIVE (500 fits the released 600)"
            - "after terminating ${sa}: Program.${p}.committed_capacity_kw == 900 (== 400 remaining B + 500 promoted C)"
            - "after terminating ${sb}: Program.${p}.committed_capacity_kw == 500 (== C alone; committed always equals the sum of ACTIVE allocations)"
            - "Program.${p}.committed_capacity_kw <= 1000 at every step (capacity invariant never violated)"
