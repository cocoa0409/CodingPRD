      - name: authentication_precedes_authorization_which_precedes_ownership
        claim_type: role_exclusive_operation
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=10]
        distinguishing_aspect: |
          The header ladder is asserted from outside the happy path: a request that is both
          unauthenticated AND malformed is a 401, never a 400; an unknown role string is a 403
          rather than a 401; and a ClientContact hitting a project read it has no role for is
          ERR_UNAUTHORIZED, not the ownership error it would get on an invoice.
          These probes send illegal roles and incomplete bodies, which cannot be expressed as
          structured calls, so they are stated in prose.
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T00:00:00Z; one private client and one ACTIVE T&M project"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FirmAdmin
            - call: "POST /clients"
              payload: { name: "Northside Development", is_public_agency: false, retainage_pct: 0.0500, expense_markup_pct: 0.1000, disallowed_categories: ["ENTERTAINMENT"], receipt_required_above: 75.00, review_cycle_days: 30 }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /labor-rates"
              payload: { role_code: "PROJECT_ARCHITECT", raw_cost_rate: 62.50, effective_from: "2026-01-01" }
              as: Controller
            - call: "POST /projects"
              payload: { client_id: "${cl_id}", name: "Riverside Library", contract_type: "TIME_AND_MATERIALS", contract_amount: 800000.00, project_manager_user_id: "pm-001", percent_complete_method: "EFFORT_BASED", target_multiplier: 3.0000 }
              as: Controller
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /billing-multipliers"
              payload: { project_id: "${p_id}", multiplier: 3.0500, effective_from: "2026-01-01", expected_project_version: "${p_v0}" }
              as: Controller
            - call: "POST /projects/${p_id}/activate"
              payload: {}
              as: Controller
          trigger:
            - "POST /labor-rates with X-User-Id: ctl-001 present but the X-User-Role header entirely absent, and a body of { role_code: \"SENIOR_ENGINEER\" } that is also missing the required raw_cost_rate and effective_from"
            - "POST /labor-rates with X-User-Role: Auditor (a role string that is not one of the five declared roles) and X-User-Id: aud-001, with a complete valid body"
            - "POST /labor-rates with X-User-Role: ProjectManager and X-User-Id: pm-001, with a complete valid body"
            - "GET /labor-rates with X-User-Role: ProjectManager and X-User-Id: pm-001"
            - "POST /_clock/set_current_utc with X-User-Role: Controller and X-User-Id: ctl-001, body { to_iso8601: \"2026-07-01T00:00:00Z\" }"
            - "GET /projects/${p_id} with X-User-Role: ClientContact and X-User-Id: ${cl_id} — the contact of this very project's client"
            - "POST /invoices with X-User-Role: FirmAdmin and X-User-Id: adm-001, body { project_id: \"${p_id}\", period_end: \"2026-05-31\", expected_project_version: 2 }"
          assert:
            - "the header-less malformed request returns 401 ERR_UNAUTHENTICATED — priority 1 outranks both the role check at priority 2 and the shape check at priority 10, so the missing body fields are never reported"
            - "the Auditor request returns 403 ERR_UNAUTHORIZED, not 401: both headers are present, the role is simply not a member of the declared set"
            - "POST /labor-rates as ProjectManager returns 403 ERR_UNAUTHORIZED — cost-rate maintenance is Controller-exclusive"
            - "GET /labor-rates as ProjectManager also returns 403 ERR_UNAUTHORIZED: raw cost rates are hidden from managers in both directions, while GET /billing-multipliers is open to them"
            - "POST /_clock/set_current_utc as Controller returns 403 ERR_UNAUTHORIZED and the logical clock stays at 2026-06-01T00:00:00Z"
            - "GET /projects/${p_id} as the project's own ClientContact returns 403 ERR_UNAUTHORIZED, not ERR_NOT_PROJECT_CLIENT: the role is absent from that endpoint's roles, so priority 2 settles it before the ownership rule at priority 4 is consulted"
            - "POST /invoices as FirmAdmin returns 403 ERR_UNAUTHORIZED and creates no Invoice — the firm administrator maintains clients but never bills them"
            - "after all seven probes no entity version anywhere has changed"

  - section: cross_cutting_layers
    instances:
      - name: stale_project_version_blocks_a_multiplier_from_truncating_what_it_never_saw
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[multiplier-create-stale-project]
          - endpoints.POST_billing_multipliers
          - errors[ERR_STALE_PROJECT_VERSION]
        distinguishing_aspect: |
          The OCC token is the PARENT's version, not the multiplier's, and the write it guards is
          destructive: a successful create truncates the incumbent's effective_to. So the refused
          write must leave the incumbent's effective_to null, must not advance Project.version, and
          the token that has already been spent once must not work a second time.
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T00:00:00Z; private client"
            - "ACTIVE T&M project with multiplier 3.0500 effective 2026-01-01 and one 4.00 h entry on 2026-05-15"
