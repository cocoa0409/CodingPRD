  - section: endpoints
    instances:

      - name: surgical_case_crud_round_trip_create_read_list
        claim_type: standard_crud
        grounds:
          - endpoints[POST /vendor-access/surgical-cases]
          - endpoints[GET /vendor-access/surgical-cases/{id}]
          - endpoints[GET /vendor-access/surgical-cases]
        distinguishing_aspect: "The three CRUD verbs agree on one row: the create response, the single read and the filtered list all report the same id, version 0 and the same derived NOT_REQUIRED / NOT_APPLICABLE projections, and the facility filter excludes the other facility's case."
        test_recipe:
          setup:
            - "Two facilities CR-51A and CR-51B exist; each will hold one case."
          setup_api_calls:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Crud Hospital A", code: "CR-51A", spd_turnaround_hours: 4, spd_bay_count: 2 }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { f_cra_id: $.data.id }
            - call: "POST /vendor-access/facilities"
              payload: { name: "Crud Hospital B", code: "CR-51B", spd_turnaround_hours: 4, spd_bay_count: 2 }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { f_crb_id: $.data.id }
            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_crb_id}", case_number: "CASE-15079", procedure_name: "Other Facility Case", scheduled_start_utc: "2026-10-02T08:00:00Z", scheduled_end_utc: "2026-10-02T09:00:00Z" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_15079_id: $.data.id }
          trigger:
            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_cra_id}", case_number: "CASE-15078", procedure_name: "Crud Round Trip Case", scheduled_start_utc: "2026-10-03T07:30:00Z", scheduled_end_utc: "2026-10-03T09:45:00Z" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_15078_id: $.data.id, case_15078_ver: $.data.version }
            - call: "GET /vendor-access/surgical-cases/${case_15078_id}"
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_15078_read_ver: $.data.version }
            - call: "GET /vendor-access/surgical-cases?facility_id=${f_cra_id}"
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_list_first_id: "$.data[0].id" }
          assert:
            - "the create response is 201 with ${case_15078_ver} == 0"
            - "the single read is 200 with ${case_15078_read_ver} == 0 and echoes case_number CASE-15078, scheduled_start_utc 2026-10-03T07:30:00Z, scheduled_end_utc 2026-10-03T09:45:00Z, original_scheduled_start_utc 2026-10-03T07:30:00Z, status SCHEDULED, restriction_level STANDARD, implant_required false, vendor_coverage_status NOT_REQUIRED, implant_readiness_status NOT_APPLICABLE, approved_rep_count 0, revoked_authorization_count 0 and reschedule_count 0"
            - "the filtered list returns total_count == 1 with ${case_list_first_id} == ${case_15078_id}; CASE-15079 at the other facility is excluded"

      - name: vendor_scorecard_computed_read_aggregates_live_counters
        claim_type: computed_read
        grounds:
          - endpoints[GET /vendor-access/vendors/{id}/scorecard]
          - calculations.vendor_compliance_score
          - calculations.vendor_scorecard_tier_and_quota
        distinguishing_aspect: "The scorecard is a pure projection over live counters, not a stored snapshot: with one 180-minute late delivery it reports 95 / 95, TIER_PLATINUM, IN_GOOD_STANDING, late_fee_balance_cents 900, late_delivery_count 1 and utilization_ratio 0.0 without a sweep ever having run (last_sweep_epoch stays 0)."
        test_recipe:
          setup:
            - "Facility SC-51 has spd_turnaround_hours 4 and spd_bay_count 2; vendor SCORV owns one ACTIVE non-implant product."
            - "Case CASE-15080 runs 2026-10-02T08:00:00Z to 10:00:00Z; its 2-tray SIMPLE set has lead hours 0 + 2 + 4 = 6 and deadline 2026-10-02T02:00:00Z."
            - "The set is received at 2026-10-02T05:00:00Z, 180 minutes late — past HARD_REJECT_GRACE_MINUTES — so the fee is round_half_up(180 * 2.5 * 1.0) = 450 per tray, 900 in total."
          setup_api_calls:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Scorecard Hospital", code: "SC-51", spd_turnaround_hours: 4, spd_bay_count: 2 }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { f_sc_id: $.data.id }
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Scorecard Devices", vendor_code: "SCORV" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_scorv_id: $.data.id, v_scorv_ver0: $.data.version }
            - call: "POST /vendor-access/product-introduction-requests"
              payload: { vendor_id: "${v_scorv_id}", facility_id: "${f_sc_id}", product_name: "Scorecard Driver Set", product_catalog_number: "SD-1300", manufacturer: "Scorv", is_implant: false, unit_cost_cents: 55000, expected_vendor_version: "${v_scorv_ver0}" }
              as: VendorAdmin
              as_user_id: "${v_scorv_id}"
              captures: { pir_sd_id: $.data.id }
            - call: "POST /vendor-access/product-introduction-requests/${pir_sd_id}/submit"
              payload: {}
              as: VendorAdmin
              as_user_id: "${v_scorv_id}"
            - call: "POST /vendor-access/product-introduction-requests/${pir_sd_id}/clinical-review"
              payload: { decision: "ENDORSE" }
              as: ClinicalSponsor
              as_user_id: "user_sponsor_1"
            - call: "POST /vendor-access/product-introduction-requests/${pir_sd_id}/value-analysis-decision"
              payload: { decision: "APPROVE" }
              as: ValueAnalysisApprover
              as_user_id: "user_vac_1"
            - call: "GET /vendor-access/approved-products?product_introduction_request_id=${pir_sd_id}"
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { ap_sd_id: "$.data[0].id" }
            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_sc_id}", case_number: "CASE-15080", procedure_name: "Scorecard Case", scheduled_start_utc: "2026-10-02T08:00:00Z", scheduled_end_utc: "2026-10-02T10:00:00Z" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_15080_id: $.data.id, case_15080_ver: $.data.version }
            - call: "POST /vendor-access/loaner-sets"
              payload: { surgical_case_id: "${case_15080_id}", approved_product_id: "${ap_sd_id}", tray_count: 2, reprocessing_complexity: "SIMPLE", expected_case_version: "${case_15080_ver}" }
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { ls_15080_id: $.data.id }
            - call: "POST /vendor-access/loaner-sets/${ls_15080_id}/receive"
              payload: { delivered_at_utc: "2026-10-02T05:00:00Z" }
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
          trigger:
            - call: "GET /vendor-access/vendors/${v_scorv_id}/scorecard"
              as: ComplianceAdmin
              as_user_id: "user_compliance_1"
              captures: { sc_prov: $.data.provisional_compliance_score, sc_adj: $.data.adjudicated_compliance_score, sc_util: $.data.utilization_ratio, sc_late: $.data.late_delivery_count }
          assert:
            - "HTTP status is 200 and the response carries vendor_id == ${v_scorv_id}"
            - "${sc_prov} == 95 and ${sc_adj} == 95"
            - "scorecard_tier == TIER_PLATINUM and compliance_status == IN_GOOD_STANDING"
            - "access_quota_in_effect == 4, authorizations_used_epoch == 0 and ${sc_util} == 0.0"
            - "late_fee_balance_cents == 900 and ${sc_late} == 1"
            - "lapsed_rep_count == 0, substantiated_incident_count == 0, open_incident_count == 0 and last_sweep_epoch == 0"
            - "LoanerSet.${ls_15080_id}.status == REJECTED_LATE with fee_status == ASSESSED and assessed_late_fee_cents == 900"
            - "a second identical GET returns byte-identical numbers — the read mutates nothing"

      - name: clock_action_endpoint_drives_every_system_timestamp
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /vendor-access/_clock/set_current_utc]
          - global_constants.LOGICAL_CLOCK_DEFAULT_UTC
          - global_constants.APPEAL_WINDOW_DAYS
        distinguishing_aspect: "The clock endpoint is the only writable time source: a revocation performed at 2026-09-20T13:45:30Z stamps that exact second (not the 2026-08-01 default), and the appeal filed five days later inherits a deadline of 2026-10-04T13:45:30Z — second-precision, carried from the revocation instant rather than from the filing instant."
        test_recipe:
          setup:
            - "Vendor CLKV has rep Cleo, still PENDING with no credentials."
          setup_api_calls:
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Clock Devices", vendor_code: "CLKV" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_clkv_id: $.data.id }
            - call: "POST /vendor-access/vendor-reps"
              payload: { vendor_id: "${v_clkv_id}", full_name: "Cleo Clock", email: "cleo@clkv.example" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { rep_cleo_id: $.data.id }
          trigger:
            - call: "POST /vendor-access/_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T13:45:30Z" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { clock_echo: $.data.current_utc }
            - call: "POST /vendor-access/vendor-reps/${rep_cleo_id}/revoke-access"
              payload: { reason: "Gift policy attestation withdrawn" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { cleo_revoked_at: $.data.revoked_at_utc }
            - call: "POST /vendor-access/_clock/set_current_utc"
              payload: { current_utc: "2026-09-25T00:00:00Z" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
            - call: "POST /vendor-access/access-appeals"
              payload: { vendor_rep_id: "${rep_cleo_id}", grounds: "The attestation was re-signed the same afternoon" }
              as: VendorAdmin
              as_user_id: "${v_clkv_id}"
              captures: { appeal_cleo_id: $.data.id }
          assert:
            - "${clock_echo} == 2026-09-20T13:45:30Z"
            - "${cleo_revoked_at} == 2026-09-20T13:45:30Z and VendorRep.${rep_cleo_id}.access_status == REVOKED"
            - "AccessAppeal.${appeal_cleo_id}.filed_at_utc == 2026-09-25T00:00:00Z"
            - "AccessAppeal.${appeal_cleo_id}.filed_for_revoked_at_utc == 2026-09-20T13:45:30Z"
            - "AccessAppeal.${appeal_cleo_id}.appeal_deadline_utc == 2026-10-04T13:45:30Z and status == SUBMITTED"

