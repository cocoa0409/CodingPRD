            - "${rec_1_method} == ANONYMIZE and ${rec_1_due} == 2026-08-31T00:00:00Z; ${rec_2_method} == OVERWRITE and ${rec_2_due} == 2026-09-30T00:00:00Z (each record pins its own schedule at collection)"
            - "${live_before} == 2 and ${lifetime_before} == 2 and ${active_consents_before} == 1"
            - "${pr_status_initial} == SUBMITTED (the Parent role created it with X-User-ID equal to the held consent id)"
            - "${pr_status_verified} == VERIFIED (SIGNED_FORM_RETURN tier 2 >= KNOWLEDGE_BASED_AUTH tier 2, and requester_email matches parent_email)"
            - "${pr_status_final} == FULFILLED and ${in_scope} == 2 and ${fulfilled_at} == 2026-08-01T00:00:00Z"
            - "ChildDataRecord.${rec_1}.status == DISPOSED with disposal_method_applied == ANONYMIZE, and ChildDataRecord.${rec_2}.status == DISPOSED with disposal_method_applied == OVERWRITE (each keeps its own pinned method through the cascade)"
            - "${live_after_delete} == 0 (the reversible balance returned to exactly its starting value)"
            - "${lifetime_after_delete} == 2 (the monotone witness did NOT decrease — this is the compensating pair)"
            - "ConsentRequest.${consent_k1}.status == REVOKED with revocation_reason == DELETION_FULFILLED and ${active_consents_after} == 0"
            - "${err_revoked} == ERR_CONSENT_REVOKED with HTTP 409 (priority 70, not the ERR_CONSENT_NOT_GRANTED of a merely unverified consent)"
            - "${live_final} == 1 and ${lifetime_final} == 3 and ${active_consents_final} == 1"
            - "${lifetime_final} - ${lifetime_before} == 1 while ${live_final} - ${live_before} == -1 (the two counters move in opposite directions over the same three collections and one deletion)"
            - "ChildDataRecord.${rec_3}.status == COLLECTED and ChildDataRecord.${rec_3}.consent_request_id == ${consent_k2}"

      - name: exposure_points_reverse_on_block_while_audit_decision_count_never_does
        grounds:
          - calculations.third_party_exposure_points
          - state_machines.ThirdPartyIntegration.APPROVED_to_BLOCKED
          - entities.OnlineService.fields.audit_decision_count
          - entities.ThirdPartyIntegration.fields.exposure_points
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Blocking an approved integration must undo its entire contribution to the service's
          third_party_exposure_points (30 points back to 0, posture recomputed from the reduced
          total) while the row itself KEEPS exposure_points == 30 — the aggregate is a live sum over
          APPROVED rows, not a stored balance — and audit_decision_count, the monotone audit trail,
          climbs from 1 to 2 on the very transition that reverses the points. The reversal is also
          one-way: BLOCKED is not a declared `from` for APPROVED, so a block cannot be quietly
          un-blocked.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; service MIXED_AUDIENCE (design_score 0.60)."
            - "Notice published disclosing vendor 'MetricPulse'."
            - "Integration MetricPulse: ANALYTICS, collects_persistent_identifier true, placement_area CHILD_DIRECTED_AREA (15 x 2 = 30 points), still DECLARED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Reversible Exposure Kids", operator_organization: "Reversible Media", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "MODERATE" }
              as: ComplianceOfficer
            - call: "POST /online-services/${svc_id}/determination"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv1: $.data.version }
            - call: "POST /parental-notices"
              payload: { service_id: "${svc_id}", notice_label: "Direct notice r1", delivery_channel: "IN_APP_MODAL", content_keys: ["OPERATOR_IDENTITY_CONTACT", "ELEMENTS_COLLECTED", "USE_PURPOSES", "THIRD_PARTY_DISCLOSURE", "PARENTAL_RIGHTS", "NO_CONDITIONING_OF_PARTICIPATION", "RETENTION_AND_DISPOSAL"], disclosed_integration_vendors: ["MetricPulse"], expected_service_version: "${sv1}" }
              as: ComplianceOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /parental-notices/${notice_id}/publish"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /third-party-integrations"
              payload: { service_id: "${svc_id}", vendor_name: "MetricPulse", integration_type: "ANALYTICS", collects_persistent_identifier: true, placement_area: "CHILD_DIRECTED_AREA" }
              as: ComplianceOfficer
              captures: { intg_id: $.data.id, intg_points: $.data.exposure_points, intg_disclosed: $.data.disclosed_in_notice, intg_status_initial: $.data.status }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { exposure_before: $.data.third_party_exposure_points, decisions_before: $.data.audit_decision_count, posture_before: $.data.compliance_posture }
          trigger:
            - call: "POST /third-party-integrations/${intg_id}/status"
              payload: { to_status: "AUDIT_PENDING", audit_note: "annual analytics review" }
              as: ComplianceOfficer
              captures: { status_pending: $.data.status }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { exposure_pending: $.data.third_party_exposure_points, open_pending: $.data.open_audit_count, posture_pending: $.data.compliance_posture, decisions_pending: $.data.audit_decision_count }
            - call: "POST /third-party-integrations/${intg_id}/status"
              payload: { to_status: "APPROVED", audit_note: "aggregate metrics only, no profiling" }
              as: ComplianceOfficer
              captures: { status_approved: $.data.status, points_after_approve: $.data.exposure_points, decided_at: $.data.last_audit_decision_at }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { exposure_approved: $.data.third_party_exposure_points, decisions_approved: $.data.audit_decision_count, posture_approved: $.data.compliance_posture, open_approved: $.data.open_audit_count }
            - call: "POST /third-party-integrations/${intg_id}/status"
              payload: { to_status: "BLOCKED", audit_note: "vendor failed its own child-data review" }
              as: ComplianceOfficer
              captures: { status_blocked: $.data.status, points_after_block: $.data.exposure_points }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { exposure_blocked: $.data.third_party_exposure_points, decisions_blocked: $.data.audit_decision_count, posture_blocked: $.data.compliance_posture, open_blocked: $.data.open_audit_count }
            - call: "POST /third-party-integrations/${intg_id}/status"
              payload: { to_status: "APPROVED", audit_note: "attempt to restore the vendor" }
              as: ComplianceOfficer
              captures: { err_unblock: $.data.error_id }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { exposure_final: $.data.third_party_exposure_points, decisions_final: $.data.audit_decision_count }
          assert:
            - "${intg_status_initial} == DECLARED and ${intg_points} == 30 (ANALYTICS 15 doubled for a persistent identifier) and ${intg_disclosed} == true"
            - "${exposure_before} == 0 and ${decisions_before} == 0 and ${posture_before} == OPEN (a DECLARED integration contributes nothing)"
            - "${status_pending} == AUDIT_PENDING and ${exposure_pending} == 0 and ${open_pending} == 1 and ${posture_pending} == RESTRICTED and ${decisions_pending} == 0 (queuing an audit is not an audit DECISION)"
            - "${status_approved} == APPROVED and ${points_after_approve} == 30 and ${decided_at} == 2026-08-01T00:00:00Z"
            - "${exposure_approved} == 30 and ${open_approved} == 0 and ${posture_approved} == OPEN and ${decisions_approved} == 1 (30 < POSTURE_RESTRICT_POINTS 40)"
            - "${status_blocked} == BLOCKED and ${points_after_block} == 30 (the ROW keeps its own points; only the service-level sum drops the term)"
            - "${exposure_blocked} == 0 (the full 30-point contribution reversed exactly, with no residue)"
            - "${decisions_blocked} == 2 and ${open_blocked} == 0 and ${posture_blocked} == OPEN (the monotone counter rose on the very call that reversed the points)"
            - "${err_unblock} == ERR_INVALID_STATE with HTTP 409 (BLOCKED is not a declared `from` for APPROVED; the compensation cannot itself be compensated)"
            - "${exposure_final} == 0 and ${decisions_final} == 2 (the refused call changed neither the reversible aggregate nor the monotone trail)"
            - "ThirdPartyIntegration.${intg_id}.status == BLOCKED at the end, with exposure_points still 30"
