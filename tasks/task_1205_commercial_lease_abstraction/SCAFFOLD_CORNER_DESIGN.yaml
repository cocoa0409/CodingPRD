              payload: {}
              as: Abstractor
            - call: "POST /lease-admin/leases/${lease_id}/certify"
              payload: {}
              as: Certifier
            - call: "POST /lease-admin/leases/${lease_id}/rent-schedule-lines"
              payload: { period_start: "2027-01-01", period_end: "2028-01-01", base_rent_cents: 1200000 }
              as: PortfolioManager
            - call: "POST /lease-admin/properties/${prop_id}/recovery-pools"
              payload: { category: CAM, fiscal_year: 2027, budgeted_cents: 1200000 }
              as: LeaseAccountant
              captures: { pool_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/recovery-billings"
              payload: { pool_id: "${pool_id}", fiscal_year: 2027, period_index: 1 }
