# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 9 rules x 2 instances = 18 instances. Every chain replays empty-DB -> state
# using only §1.5 endpoints. Numeric asserts are pre-computed literals.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: moisture_screening_vs_verification_divergence
        grounds:
          - calculations.moisture_risk_score
          - state_machines.MoistureAssessment.DRAFT_to_ACCEPTED
          - state_machines.MoistureAssessment.DRAFT_to_REJECTED
          - entities.MoistureAssessment.fields.assessment_kind
        distinguishing_aspect: |
          Identical readings (slab 3.0 lbs, RH 60%, no efflorescence, no grading
          deficit) score 0/LOW/ACCEPTED under SCREENING but 40/HIGH/REJECTED under
          VERIFICATION — same inputs, two variants, opposite resolution, on the
          MoistureAssessment entity domain (distinct from the Project price domain
          of the sibling instance).
        test_recipe:
          setup:
            - "Project A with a SCREENING assessment carrying readings slab=3.0, rh=60, efflorescence=false, grading=false, submitted and resolved"
            - "Project B with a first SCREENING assessment slab=6.0 (REJECTED), then a VERIFICATION assessment carrying readings identical to Project A's, submitted and resolved"
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { name: "GC One", license_no: "LIC-1" }, as: PlatformAdmin, captures: { ctr_id: $.data.id } }
            - { call: "POST /api/homeowners", payload: { name: "H A", email: "ha@x.com", phone: "1" }, as: Contractor, as_user_id: "${ctr_id}", captures: { ho_a: $.data.id } }
            - { call: "POST /api/homeowners", payload: { name: "H B", email: "hb@x.com", phone: "2" }, as: Contractor, as_user_id: "${ctr_id}", captures: { ho_b: $.data.id } }
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_a}", address: "1 A St", basement_sqft: 900, base_contract_cents: 5000000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { proj_a: $.data.id } }
            - { call: "POST /api/projects/${proj_a}/moisture-assessments", payload: { slab_moisture_lbs: 3.0, interior_rh_pct: 60, efflorescence_observed: false, grading_deficit: false, egress_windows_existing: 1, ceiling_height_in: 86 }, as: Contractor, as_user_id: "${ctr_id}", captures: { ma_a: $.data.id } }
            - { call: "POST /api/moisture-assessments/${ma_a}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}", captures: { ma_a_status: $.data.status, ma_a_score: $.data.moisture_risk_score, ma_a_band: $.data.risk_band } }
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_b}", address: "2 B St", basement_sqft: 900, base_contract_cents: 5000000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { proj_b: $.data.id } }
            - { call: "POST /api/projects/${proj_b}/moisture-assessments", payload: { slab_moisture_lbs: 6.0, interior_rh_pct: 60, efflorescence_observed: false, grading_deficit: false, egress_windows_existing: 1, ceiling_height_in: 86 }, as: Contractor, as_user_id: "${ctr_id}", captures: { ma_b1: $.data.id } }
            - { call: "POST /api/moisture-assessments/${ma_b1}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/projects/${proj_b}/moisture-assessments", payload: { assessment_kind: "VERIFICATION", slab_moisture_lbs: 3.0, interior_rh_pct: 60, efflorescence_observed: false, grading_deficit: false, egress_windows_existing: 1, ceiling_height_in: 86 }, as: Contractor, as_user_id: "${ctr_id}", captures: { ma_b2: $.data.id } }
          trigger:
            - { call: "POST /api/moisture-assessments/${ma_b2}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}", captures: { ma_b2_status: $.data.status, ma_b2_score: $.data.moisture_risk_score, ma_b2_band: $.data.risk_band } }
          assert:
            - "MoistureAssessment.${ma_a}: moisture_risk_score == 0, risk_band == LOW, status == ACCEPTED"
            - "MoistureAssessment.${ma_b2}: moisture_risk_score == 40, risk_band == HIGH, status == REJECTED"
            - "captured ${ma_a_score} == 0 and ${ma_b2_score} == 40 for byte-identical reading inputs"
            - "Project.${proj_b}.status remains ASSESSMENT (VERIFICATION rejection does not advance the project)"

      - name: project_price_provisional_vs_final
        grounds:
          - calculations.project_price
          - entities.Project.fields.contract_price_cents
          - entities.Project.fields.price_variant
          - entities.AllowanceLine.fields.variance_cents
        distinguishing_aspect: |
          With base 5,000,000 cents and one 100,000-cent allowance line, the
          PROVISIONAL variant reports 5,010,000 (10% contingency on the unselected
          line) while FINAL after selecting 112,000 reports 5,012,000 — same base
          data, two price algorithms, different cents, on the Project fiscal domain
          (distinct from the MoistureAssessment scoring domain of the sibling).
        test_recipe:
          setup:
            - "Project (INTAKE) with base_contract_cents 5000000 and one AllowanceLine FLOORING budgeted 100000, unselected"
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { name: "GC Two", license_no: "LIC-2" }, as: PlatformAdmin, captures: { ctr_id: $.data.id } }
            - { call: "POST /api/homeowners", payload: { name: "H C", email: "hc@x.com", phone: "3" }, as: Contractor, as_user_id: "${ctr_id}", captures: { ho_id: $.data.id } }
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_id}", address: "3 C St", basement_sqft: 800, base_contract_cents: 5000000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { proj_id: $.data.id } }
            - { call: "POST /api/projects/${proj_id}/allowance-lines", payload: { name: "FLOORING", budgeted_cents: 100000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { al_id: $.data.id } }
            - { call: "GET /api/projects/${proj_id}", payload: {}, as: Contractor, as_user_id: "${ctr_id}", captures: { price_before: $.data.contract_price_cents, variant_before: $.data.price_variant } }
          trigger:
            - { call: "POST /api/allowance-lines/${al_id}/select", payload: { actual_cents: 112000 }, as: Homeowner, as_user_id: "${ho_id}" }
            - { call: "GET /api/projects/${proj_id}", payload: {}, as: Contractor, as_user_id: "${ctr_id}", captures: { price_after: $.data.contract_price_cents, variant_after: $.data.price_variant } }
          assert:
            - "before selection: Project.${proj_id}.price_variant == PROVISIONAL and contract_price_cents == 5010000"
            - "after selection: price_variant == FINAL and contract_price_cents == 5012000"
            - "AllowanceLine.${al_id}.variance_cents == 12000 and remaining_cents == -12000"
            - "${price_before} != ${price_after} for identical base_contract_cents"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: egress_ceiling_multi_input_boundary
        grounds:
          - calculations.egress_ceiling_compliance
          - state_machines.Permit.DRAFT_to_UNDER_REVIEW
          - validations[priority=12]
          - validations[priority=13]
        distinguishing_aspect: |
          Mode (a) combinatorial: five inputs (bedroom_count, windows[],
          finished/low/prohibited areas) interact through conditional branches —
          the bedroom-conditional window rule R1 and the 50%-of-area rule R2 both
          sit exactly on their compliance boundaries (5.7 sqft, 44 in sill, 600/1200
          sqft full-height) and the permit still submits cleanly.
        test_recipe:
          setup:
            - "Project advanced to PERMITTING via accepted assessment and approved design; permit created with bedroom_count=2, windows [{6.0,40},{5.7,44}], ceiling_height_in=84, finished_area_sqft=1200, low_area_sqft=600, prohibited_area_sqft=0"
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { name: "GC Three", license_no: "LIC-3" }, as: PlatformAdmin, captures: { ctr_id: $.data.id } }
            - { call: "POST /api/homeowners", payload: { name: "H D", email: "hd@x.com", phone: "4" }, as: Contractor, as_user_id: "${ctr_id}", captures: { ho_id: $.data.id } }
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_id}", address: "4 D St", basement_sqft: 1200, base_contract_cents: 8000000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { proj_id: $.data.id } }
            - { call: "POST /api/projects/${proj_id}/moisture-assessments", payload: { slab_moisture_lbs: 2.0, interior_rh_pct: 50, efflorescence_observed: false, grading_deficit: false, egress_windows_existing: 2, ceiling_height_in: 84 }, as: Contractor, as_user_id: "${ctr_id}", captures: { ma_id: $.data.id } }
            - { call: "POST /api/moisture-assessments/${ma_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/projects/${proj_id}/design-packages", payload: { layout_notes: "two bedrooms + rec room", mechanical_relocations: [{ system: "HVAC", description: "move trunk line", estimated_cents: 250000 }] }, as: Contractor, as_user_id: "${ctr_id}", captures: { dp_id: $.data.id } }
            - { call: "POST /api/design-packages/${dp_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/design-packages/${dp_id}/approve", payload: {}, as: Homeowner, as_user_id: "${ho_id}" }
            - { call: "POST /api/projects/${proj_id}/permits", payload: { bedroom_count: 2, windows: [{ net_clear_sqft: 6.0, sill_height_in: 40 }, { net_clear_sqft: 5.7, sill_height_in: 44 }], ceiling_height_in: 84, finished_area_sqft: 1200, low_area_sqft: 600, prohibited_area_sqft: 0 }, as: Contractor, as_user_id: "${ctr_id}", captures: { pm_id: $.data.id, pm_pin: $.data.pinned_design_revision } }
          trigger:
            - { call: "POST /api/permits/${pm_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}", captures: { pm_status: $.data.status, pm_egress: $.data.egress_compliant, pm_ceiling: $.data.ceiling_compliant } }
          assert:
            - "Permit.${pm_id}.egress_compliant == true (window 2 sits exactly on 5.7 sqft / 44 in)"
            - "Permit.${pm_id}.ceiling_compliant == true (full-height area 600 == exactly 50% of 1200, zero prohibited)"
            - "Permit.${pm_id}.status == UNDER_REVIEW and pinned_design_revision == 1"

      - name: change_order_per_item_markup_rounding
        grounds:
          - calculations.change_order_pricing
          - entities.ChangeOrder.fields.price_delta_cents
          - concurrency_rules[change-order-create-stale-project]
        distinguishing_aspect: |
          Mode (b) nested rounding: markup 15% is applied and round_half_up'd PER
          scope item before summation — items [{1,101},{1,103}] pin to 116+118=234
          cents, while the forbidden sum-first order would yield 235; the sibling
          instance is mode (a), not rounding-order.
        test_recipe:
          setup:
            - "Project (INTAKE) base 5000000 with version captured fresh before the change-order create"
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { name: "GC Four", license_no: "LIC-4" }, as: PlatformAdmin, captures: { ctr_id: $.data.id } }
            - { call: "POST /api/homeowners", payload: { name: "H E", email: "he@x.com", phone: "5" }, as: Contractor, as_user_id: "${ctr_id}", captures: { ho_id: $.data.id } }
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_id}", address: "5 E St", basement_sqft: 700, base_contract_cents: 5000000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { proj_id: $.data.id } }
            - { call: "GET /api/projects/${proj_id}", payload: {}, as: Contractor, as_user_id: "${ctr_id}", captures: { proj_v: $.data.version } }
          trigger:
            - { call: "POST /api/projects/${proj_id}/change-orders", payload: { scope_description: "add pot lights + outlet", kind: "ADD", scope_items: [{ description: "pot light", qty: 1, unit_cost_cents: 101 }, { description: "outlet", qty: 1, unit_cost_cents: 103 }], allowance_draws: [], expected_project_version: "${proj_v}" }, as: Contractor, as_user_id: "${ctr_id}", captures: { co_id: $.data.id, co_delta: $.data.price_delta_cents } }
          assert:
            - "ChangeOrder.${co_id}.price_delta_cents == 234 (round_half_up(101*1.15)=116 plus round_half_up(103*1.15)=118)"
            - "ChangeOrder.${co_id}.status == PROPOSED"
            - "Project.${proj_id}.version advanced by 1 from ${proj_v}"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: moisture_assessment_remediation_cycle
        grounds:
          - state_machines.MoistureAssessment.REJECTED_to_DRAFT
          - state_machines.MoistureAssessment.DRAFT_to_ACCEPTED
          - calculations.moisture_risk_score
        distinguishing_aspect: |
          MoistureAssessment runs a cyclic remediation loop REJECTED -> DRAFT ->
          ACCEPTED with the reopen mutating assessment_kind to VERIFICATION; the
          sibling cycle lives on a different entity (DesignPackage).
        test_recipe:
          setup:
            - "Project with a SCREENING assessment REJECTED (slab 6.0), reopened with remediated readings slab 2.0 / RH 50"
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { name: "GC Five", license_no: "LIC-5" }, as: PlatformAdmin, captures: { ctr_id: $.data.id } }
            - { call: "POST /api/homeowners", payload: { name: "H F", email: "hf@x.com", phone: "6" }, as: Contractor, as_user_id: "${ctr_id}", captures: { ho_id: $.data.id } }
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_id}", address: "6 F St", basement_sqft: 850, base_contract_cents: 4000000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { proj_id: $.data.id } }
            - { call: "POST /api/projects/${proj_id}/moisture-assessments", payload: { slab_moisture_lbs: 6.0, interior_rh_pct: 72, efflorescence_observed: true, grading_deficit: true, egress_windows_existing: 0, ceiling_height_in: 86 }, as: Contractor, as_user_id: "${ctr_id}", captures: { ma_id: $.data.id } }
            - { call: "POST /api/moisture-assessments/${ma_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}", captures: { st1: $.data.status } }
          trigger:
            - { call: "POST /api/moisture-assessments/${ma_id}/reopen", payload: { remediation_notes: "interior drain tile + dehumidifier", slab_moisture_lbs: 2.0, interior_rh_pct: 50, efflorescence_observed: false, grading_deficit: false }, as: Contractor, as_user_id: "${ctr_id}", captures: { st2: $.data.status, kind2: $.data.assessment_kind } }
            - { call: "POST /api/moisture-assessments/${ma_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}", captures: { st3: $.data.status, score3: $.data.moisture_risk_score, band3: $.data.risk_band } }
          assert:
            - "first submit: status == REJECTED (screening score 6.0->50 + 72->30 + 20 + 15 = 115 HIGH)"
            - "after reopen: status == DRAFT and assessment_kind == VERIFICATION"
            - "second submit: status == ACCEPTED with moisture_risk_score == 0 and risk_band == LOW under VERIFICATION thresholds"
            - "Project.${proj_id}.status == DESIGN after the accepted resubmit"

      - name: design_package_revision_loop_with_supersede
        grounds:
          - state_machines.DesignPackage.REVISION_REQUESTED_to_SUBMITTED
          - state_machines.DesignPackage.SUBMITTED_to_APPROVED
          - entities.DesignPackage.fields.revision_number
          - entities.Project.fields.approved_design_id
        distinguishing_aspect: |
          DesignPackage runs a negotiation cycle SUBMITTED -> REVISION_REQUESTED ->
          SUBMITTED (revision_number 1->2) before APPROVED, and a second package's
          approval SUPERSEDES the first — branching plus cycle on DesignPackage,
          distinct from the MoistureAssessment sibling.
        test_recipe:
          setup:
            - "Project in DESIGN (accepted assessment); package P1 submitted, revision requested, resubmitted at revision 2, approved; package P2 created, submitted, approved"
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { name: "GC Six", license_no: "LIC-6" }, as: PlatformAdmin, captures: { ctr_id: $.data.id } }
            - { call: "POST /api/homeowners", payload: { name: "H G", email: "hg@x.com", phone: "7" }, as: Contractor, as_user_id: "${ctr_id}", captures: { ho_id: $.data.id } }
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_id}", address: "7 G St", basement_sqft: 1000, base_contract_cents: 6000000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { proj_id: $.data.id } }
            - { call: "POST /api/projects/${proj_id}/moisture-assessments", payload: { slab_moisture_lbs: 1.5, interior_rh_pct: 45, efflorescence_observed: false, grading_deficit: false, egress_windows_existing: 1, ceiling_height_in: 88 }, as: Contractor, as_user_id: "${ctr_id}", captures: { ma_id: $.data.id } }
            - { call: "POST /api/moisture-assessments/${ma_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/projects/${proj_id}/design-packages", payload: { layout_notes: "v1 layout", mechanical_relocations: [] }, as: Contractor, as_user_id: "${ctr_id}", captures: { dp1: $.data.id } }
            - { call: "POST /api/design-packages/${dp1}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/design-packages/${dp1}/request-revision", payload: { revision_notes: "move wet bar to east wall" }, as: Homeowner, as_user_id: "${ho_id}", captures: { st_rev: $.data.status } }
          trigger:
            - { call: "POST /api/design-packages/${dp1}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}", captures: { rev2: $.data.revision_number, st_sub2: $.data.status } }
            - { call: "POST /api/design-packages/${dp1}/approve", payload: {}, as: Homeowner, as_user_id: "${ho_id}", captures: { st_app1: $.data.status } }
            - { call: "POST /api/projects/${proj_id}/design-packages", payload: { layout_notes: "v2 layout", mechanical_relocations: [{ system: "PLUMBING", description: "relocate rough-in", estimated_cents: 180000 }] }, as: Contractor, as_user_id: "${ctr_id}", captures: { dp2: $.data.id } }
            - { call: "POST /api/design-packages/${dp2}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/design-packages/${dp2}/approve", payload: {}, as: Homeowner, as_user_id: "${ho_id}" }
            - { call: "GET /api/projects/${proj_id}", payload: {}, as: Contractor, as_user_id: "${ctr_id}", captures: { approved_id: $.data.approved_design_id } }
          assert:
            - "resubmit after REVISION_REQUESTED: revision_number == 2, status == SUBMITTED"
            - "first approve: DesignPackage.${dp1}.status == APPROVED and Project advanced to PERMITTING"
            - "after second approve: DesignPackage.${dp1}.status == SUPERSEDED, DesignPackage.${dp2}.status == APPROVED"
            - "Project.${proj_id}.approved_design_id == ${dp2}"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: strike_suspension_cascade
        grounds:
          - calculations.cleanup_strike_escalation
          - state_machines.Project.IN_PROGRESS_to_SUSPENDED
          - state_machines.WorkPhase.IN_PROGRESS_to_BLOCKED
          - state_machines.Inspection.REQUESTED_to_CANCELLED
          - entities.DailySiteLog.fields.strike_applied
        distinguishing_aspect: |
          Depth-4 chain from a site-log creation trigger: violation log -> Project
          strike_count recompute -> Project SUSPENDED at threshold -> IN_PROGRESS
          WorkPhase BLOCKED (pre_block_status captured) -> its REQUESTED rough-in
          Inspection CANCELLED; sibling cascade originates from a different trigger
          (inspection record-result).
        test_recipe:
          setup:
            - "Project IN_PROGRESS with one ELECTRICAL phase IN_PROGRESS (sub assigned) and a REQUESTED ROUGH_IN inspection on it; logical clock at 2026-06-05; two violation logs already filed (2026-06-01, 2026-06-03)"
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { name: "GC Seven", license_no: "LIC-7" }, as: PlatformAdmin, captures: { ctr_id: $.data.id } }
            - { call: "POST /api/homeowners", payload: { name: "H H", email: "hh@x.com", phone: "8" }, as: Contractor, as_user_id: "${ctr_id}", captures: { ho_id: $.data.id } }
            - { call: "POST /api/subcontractors", payload: { name: "Sparky Co", trade: "ELECTRICAL" }, as: PlatformAdmin, captures: { sub_id: $.data.id } }
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_id}", address: "8 H St", basement_sqft: 950, base_contract_cents: 7000000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { proj_id: $.data.id } }
            - { call: "POST /api/projects/${proj_id}/moisture-assessments", payload: { slab_moisture_lbs: 2.0, interior_rh_pct: 50, efflorescence_observed: false, grading_deficit: false, egress_windows_existing: 1, ceiling_height_in: 86 }, as: Contractor, as_user_id: "${ctr_id}", captures: { ma_id: $.data.id } }
            - { call: "POST /api/moisture-assessments/${ma_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/projects/${proj_id}/design-packages", payload: { layout_notes: "rec room", mechanical_relocations: [] }, as: Contractor, as_user_id: "${ctr_id}", captures: { dp_id: $.data.id } }
            - { call: "POST /api/design-packages/${dp_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/design-packages/${dp_id}/approve", payload: {}, as: Homeowner, as_user_id: "${ho_id}" }
            - { call: "POST /api/projects/${proj_id}/permits", payload: { bedroom_count: 1, windows: [{ net_clear_sqft: 6.0, sill_height_in: 40 }], ceiling_height_in: 86, finished_area_sqft: 900, low_area_sqft: 200, prohibited_area_sqft: 0 }, as: Contractor, as_user_id: "${ctr_id}", captures: { pm_id: $.data.id } }
            - { call: "POST /api/permits/${pm_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/permits/${pm_id}/record-decision", payload: { outcome: "ISSUED", notes: "ok" }, as: Inspector }
            - { call: "POST /api/projects/${proj_id}/work-phases", payload: { trade: "ELECTRICAL", zone: "REC_ROOM", start_date: "2026-06-01", end_date: "2026-06-20", crew_count: 2, subcontractor_id: "${sub_id}" }, as: Contractor, as_user_id: "${ctr_id}", captures: { wp_id: $.data.id } }
            - { call: "POST /api/work-phases/${wp_id}/start", payload: {}, as: Subcontractor, as_user_id: "${sub_id}" }
            - { call: "POST /api/projects/${proj_id}/inspections", payload: { type: "ROUGH_IN", work_phase_id: "${wp_id}" }, as: Contractor, as_user_id: "${ctr_id}", captures: { insp_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/projects/${proj_id}/site-logs", payload: { work_date: "2026-06-01", containment_intact: false, hepa_run_hours: 6, noise_db_max: 60, cleanup_completed: true }, as: Subcontractor, as_user_id: "${sub_id}" }
            - { call: "POST /api/projects/${proj_id}/site-logs", payload: { work_date: "2026-06-03", containment_intact: true, hepa_run_hours: 6, noise_db_max: 60, cleanup_completed: false }, as: Subcontractor, as_user_id: "${sub_id}" }
          trigger:
