            - "response.data.error_id == ERR_ACCOUNT_SCOPE_VIOLATION"
            - "the same GET as Servicer with X-User-ID ${acct_b_id} returns 200 with data.total_cents == 20798"
            - "PartOrder.${order_b_id}.servicer_account_id == ${acct_b_id}"

