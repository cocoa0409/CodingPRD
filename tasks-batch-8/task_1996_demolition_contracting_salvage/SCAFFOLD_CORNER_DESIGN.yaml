        claim_type: violation_to_error
        grounds: [state_machines.DemolitionPermit.APPROVED_to_ACTIVE, "errors[ERR_UTILITY_UNVERIFIED]"]
        distinguishing_aspect: "Empty-set boundary on a different metric: with NO UtilityDisconnect rows at all, ACTIVATE fails ERR_UTILITY_UNVERIFIED (>= 1 record required)."
        test_recipe:
          setup: ["Project DRAFT with an APPROVED permit; no utility disconnects."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ContractorAdmin }
