  - rule_id: compensating_invariant
    instances:
      - name: booking_cancellation_restores_center_minutes_and_donor_blocked_days
        grounds:
          - calculations.derived_counter_reconciliation
          - entities.CollectionCenter.fields.committed_slot_minutes
          - entities.DonorProfile.fields.blocked_day_count
          - state_machines.CollectionBooking.CONFIRMED_to_CANCELLED
          - endpoints.POST_registry_collection_bookings_id_cancel
        distinguishing_aspect: |
          Conserved quantities: the center's committed collection MINUTES and the donor's blocked
          CALENDAR DAYS - two physical capacity ledgers that must both return to their pre-booking
          values when a confirmed booking is cancelled. The compensation is asymmetric: minutes were
          committed at booking time, days only at confirmation time, yet a single cancel must undo
          both without drift, and the cancellation FEE that the cancel does add lives in a different
          ledger (the claim) so it must not perturb either capacity count.
        test_recipe:
          setup:
            - "domestic registry, capacity-1 center, donor D1, one patient with a CLEARED case, PBSC method and conditioning_start_date 2026-10-05"
            - "no manual donor windows exist, so both ledgers start at 0"
