          identifiers: an empty book cannot be submitted at all, and a book whose entries
          carry fewer than MIN_VERIFIED_RECORDS (3) in-window VERIFIED HISTORICAL rows can be
          submitted but cannot be VALUED. The probe walks the questionnaire from zero entries
