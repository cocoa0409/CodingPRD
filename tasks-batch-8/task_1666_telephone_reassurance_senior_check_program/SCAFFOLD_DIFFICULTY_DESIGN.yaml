  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_precondition_beats_safety_fields
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SAFETY_FIELDS_REQUIRED]
        distinguishing_aspect: |
          Category pair (state, business_safety): the same request violates BOTH the state
          precondition (target assignment already CANCELLED) and the safety-field rule
          (IMMEDIATE_DANGER without follow_up_plan/supervisor_notified); priority 6 fires before
          priority 8, so the winner is ERR_INVALID_STATE, not ERR_SAFETY_FIELDS_REQUIRED.
        test_recipe:
          setup:
            - "Program; enrolled participant with MON schedule; certified volunteer; assignment A1 created then cancelled"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 5, current_policy_version: "v2026.1", max_reserve_slots: 0 }, as: ProgramCoordinator }
            - { call: "POST /api/participants", payload: { full_name: "Pri P", date_of_birth: "1951-10-01", phone: "555-2000", address: "1 Pri Rd", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 1, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker, captures: { p_id: $.data.id } }
            - { call: "POST /api/participants/${p_id}/emergency-contacts", payload: { full_name: "KP", phone: "555-2001", relationship: "son", contact_rank: "PRIMARY" }, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/submit-review", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/approve", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/call-schedules", payload: { weekday: "MON", window_start: "09:00", window_end: "11:00" }, as: ProgramCoordinator }
