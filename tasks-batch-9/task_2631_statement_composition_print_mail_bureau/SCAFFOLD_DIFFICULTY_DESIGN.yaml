  - rule_id: resource_temporal_overlap
    instances:

      - name: press_line_windows_use_closed_intervals_with_a_changeover_buffer
        grounds:
          - calculations.print_run_window_sizing
          - validations.priority_63_ERR_PRESS_WINDOW_CONFLICT
          - entities.PressLine.fields.changeover_buffer_minutes
          - entities.PrintRun.fields.window_end
        distinguishing_aspect: |
          The contended resource is a PressLine and the interval semantics are CLOSED on both ends with
          a 30-minute changeover buffer added to each side, and the occupancy set is filtered to
          {PLANNED, RUNNING}: a run that touches the buffer boundary from the LEFT is refused, and a
          COMPLETED run stops contending entirely, so the same wall-clock window that was rejected as
          overlapping becomes bookable once the incumbent finishes.
        test_recipe:
          setup:
            - "Client CL-PW with dr_readiness_required false; ACTIVE template T-PW: FIRST_CLASS, sheets_per_document 1, no inserts."
            - "PressLine PL-PW: sheets_per_hour 600, daily_sheet_capacity 9000, changeover_buffer_minutes 30. Every job carries 2 records, so every run is 2 sheets and 60 minutes (MIN_RUN_MINUTES floors ceil(2 * 60 / 600) == 1)."
            - "Three independent 2-record data files reach ACCEPTED and become three COMPOSED jobs, each presorted to a single batch."
            - "Job ONE is scheduled first on PL-PW for [2026-08-04T09:00:00Z, 2026-08-04T10:00:00Z] and stays PLANNED, so the buffered exclusion zone is [08:30, 10:30] on that line."
            - "The clock starts at 2026-08-01T00:00:00Z and is advanced to 2026-08-04T09:00:00Z only when run ONE has to be started and completed."
