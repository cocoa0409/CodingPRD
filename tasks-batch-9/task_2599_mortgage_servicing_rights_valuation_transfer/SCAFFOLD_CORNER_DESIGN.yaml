      - name: servicing_transfer_parallel_dimensions_and_compound_readiness
        claim_type: valid_transition
        grounds:
          - state_machines.ServicingTransfer.parallel_dimensions
          - state_machines.ServicingTransfer.compound_derivation
        excluded_because:
          difficulty_instance: non_linear_state_machine / servicing_transfer_drives_three_parallel_dimensions_out_of_order
          rationale: "That instance drives all three dimensions out of order, asserts readiness at every step, and exercises the rollback demotion; a second recipe would only restate it."

      - name: escrow_mapping_rollback_reverses_every_side_effect
        claim_type: side_effect_execution
        grounds:
          - state_machines.ServicingTransfer.transitions[data_status ESCROW_MAPPED -> data_status MAPPED]
        excluded_because:
          difficulty_instance: compensating_invariant / escrow_mapping_rollback_restores_custodial_funds_without_drift
          rationale: "The compensation side effects and the no-drift custodial invariant are asserted there loan by loan."

      - name: rate_curve_supersession_cascades_down_the_marketing_chain
        claim_type: side_effect_execution
        grounds:
          - state_machines.RateCurveSnapshot.transitions[ACTIVE -> SUPERSEDED]
        excluded_because:
          difficulty_instance: transitive_cascade / rate_curve_publication_cascades_four_levels_to_lapsed_bid
          rationale: "The four-level downward cascade and the portfolio's derived valuation_freshness repaint are asserted level by level there."

      - name: transfer_completion_bubbles_up_to_the_portfolio
        claim_type: side_effect_execution
        grounds:
          - state_machines.ServicingPortfolio.transitions[UNDER_CONTRACT -> TRANSFERRED]
        excluded_because:
          difficulty_instance: transitive_cascade / transfer_completion_cascades_loans_portfolio_and_open_hedge
          rationale: "The bubble-up from the loans plus the conditional hedge closure are asserted there, including the derived collapse of loan_count and total_upb_cents."

      - name: bid_negotiation_cycle_is_bounded_by_the_round_cap
        claim_type: idempotency
        grounds:
          - state_machines.Bid.transitions[REVISED -> COUNTERED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / bid_negotiation_cycles_countered_and_revised_until_round_cap
          rationale: "The cycle, the counter-field clearing and the round-cap refusal are asserted round by round there."

