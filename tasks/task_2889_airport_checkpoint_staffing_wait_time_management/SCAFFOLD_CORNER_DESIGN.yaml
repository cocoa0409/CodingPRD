              as: PlatformAdmin
          trigger:
            - call: "POST /lane-assignments/${asg1_id}/break"
              payload: { action: "START" }
              as: ScreeningOfficer
              as_user_id: "${off_id}"
              expect_status: 409
              captures: { not_due_error: $.data.error_id }
            - call: "GET /lane-assignments/${asg1_id}"
              payload: {}
              as: ScreeningOfficer
              captures: { break_at_59: $.data.break_state, asg_at_59: $.data.assignment_state }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lane-assignments/${asg1_id}/break"
              payload: { action: "START" }
              as: ScreeningOfficer
              as_user_id: "${off_id}"
              captures: { break_at_60: $.data.break_state, break_started: $.data.break_started_at_utc }
          assert:
            - "${ci_state} == CHECKED_IN, ${ci_break} == NOT_DUE and ${ci_baseline} == 2026-09-10T08:00:00Z"
            - "${not_due_error} == ERR_BREAK_NOT_DUE (409) at exactly 59 minutes"
            - "${break_at_59} == NOT_DUE — the lazy NOT_DUE -> DUE re-evaluation on the read did not fire at 59, and ${asg_at_59} == CHECKED_IN"
            - "${break_at_60} == ON_BREAK at exactly 60 minutes and ${break_started} == 2026-09-10T09:00:00Z, so the boundary is >= not >"
            - "the officer's duty_status is ON_BREAK after the accepted START and assignment_state is still CHECKED_IN"

