            - "the rigging order on the other deal is accepted: ServiceOrder.${so2_id}.status == INTAKE"
            - "ServiceOrder.${so1_id} is untouched and still the only rigging order on its deal"
            - "the rule is scoped per deal, so it is not a store-wide one-at-a-time limit"

      - name: funding_shortfall_boundary_at_the_balance
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FUNDING_SHORTFALL]
          - errors[ERR_BALANCE_OUTSTANDING]
          - validations[priority=20]
          - entities.BoatDeal.fields.balance_due_cents
        distinguishing_aspect: "Funding at exactly balance_due_cents is accepted while one cent below is rejected, and funding above the balance is also accepted, so the comparison is a one-sided lower bound."
        test_recipe:
          setup: ["a store with one contracted deal whose balance_due_cents is 12102193"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
