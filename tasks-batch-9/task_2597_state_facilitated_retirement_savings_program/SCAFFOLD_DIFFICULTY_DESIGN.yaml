scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 / 9 — dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: nia_adjusted_balance_vs_daily_prorata_on_excess_correction
        grounds:
          - calculations.excess_nia_attribution
          - entities.ExcessContributionCase.fields.nia_adjusted_balance_cents
          - entities.ExcessContributionCase.fields.nia_daily_prorata_cents
          - entities.ExcessContributionCase.fields.nia_method_applied
          - entities.ExcessContributionCase.fields.applied_nia_cents
          - state_machines.ExcessContributionCase.METHOD_ELECTED_to_COMPLETED
          - entities.ParticipantAccount.fields.balance_cents
        distinguishing_aspect: |
          This instance exercises the dual variant on the PARTICIPANT money aggregate
          (ExcessContributionCase over ParticipantAccount): the adjusted-opening-balance variant
          reads a fair-market-value pair and returns 2353 cents while the deemed-daily-rate
          variant reads an elapsed-day count and returns 800 cents on identical case data, and
          because no investment election was superseded inside the computation period the
          selection rule pins ADJUSTED_BALANCE, so exactly 2353 moves.
        test_recipe:
          setup:
            - "Program year 2026 with a 700000-cent IRA limit and a 500 bp default deferral rate; TDF2045 and MMKT01 on the fund menu"
            - "Employer Delta Fabrication (60 employees, WAVE_2) registered; participant Rosa Lim (born 1980-05-10, so age_at_year_end 46 and NOT catch-up eligible) auto-enrolled and ACTIVE with a ROTH_IRA account"
            - "A first remittance of 400000 cents posted at clock 2026-03-06, then 50000 cents of earnings credited, leaving balance_cents 450000 / contribution_basis_cents 400000 / ytd_contribution_cents 400000"
            - "A second remittance of 400000 cents posted at clock 2026-04-05, pushing ytd to 800000 and detecting an excess of 100000 cents; the case captures opening_fmv_cents 450000 and period_contributions_cents 400000 with computation_period_start 2026-04-05"
            - "REFUND_TO_PARTICIPANT elected; a further 20000 cents of earnings credited; clock advanced to 2026-05-15, exactly 40 days after computation_period_start; no investment election has been superseded since detection"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "TDF2045", name: "Target Retirement 2045", category: "TARGET_DATE", target_year: 2045, expense_ratio_bp: 30, default_eligible: true }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "MMKT01", name: "Government Money Market", category: "CAPITAL_PRESERVATION", expense_ratio_bp: 20, default_eligible: true }
              as: ProgramAdministrator
            - call: "POST /employers"
              payload: { ein: "12-3456789", legal_name: "Delta Fabrication LLC", worksite_state: "CA", employee_count: 60 }
              as: ProgramAdministrator
              captures: { emp_id: "$.data.id" }
            - call: "POST /employers/${emp_id}/registration"
              payload: { non_fiduciary_acknowledged: true, payroll_contact_email: "payroll@delta.example" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /participants"
              payload: { full_name: "Rosa Lim", date_of_birth: "1980-05-10", email: "rosa.lim@x.example", ssn_last4: "1234", state_resident: true }
              as: ProgramAdministrator
              captures: { par_id: "$.data.id" }
            - call: "POST /employers/${emp_id}/enrollments"
              payload: { participant_id: "${par_id}", hire_date: "2026-01-05", annual_compensation_cents: 9600000 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { enr_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /_ops/auto-enrollment-run"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /participant-accounts"
              payload: { participant_id: "${par_id}" }
              as: ProgramAdministrator
              captures: { acct_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-06T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /employers/${emp_id}/payroll-remittances"
              payload: { pay_period_start: "2026-02-01", pay_period_end: "2026-02-28", pay_date: "2026-03-05", total_deducted_cents: 400000 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { rem1_id: "$.data.id" }
            - call: "POST /payroll-remittances/${rem1_id}/remittance-lines"
              payload: { enrollment_id: "${enr_id}", gross_wages_cents: 8000000, deducted_cents: 400000 }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /payroll-remittances/${rem1_id}/submit"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /payroll-remittances/${rem1_id}/post"
              payload: { posting_reference: "PR-2026-0001" }
              as: Recordkeeper
            - call: "POST /participant-accounts/${acct_id}/earnings-postings"
              payload: { earnings_cents: 50000, posting_date: "2026-03-06" }
              as: Recordkeeper
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /employers/${emp_id}/payroll-remittances"
              payload: { pay_period_start: "2026-03-01", pay_period_end: "2026-03-31", pay_date: "2026-04-03", total_deducted_cents: 400000 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { rem2_id: "$.data.id" }
            - call: "POST /payroll-remittances/${rem2_id}/remittance-lines"
              payload: { enrollment_id: "${enr_id}", gross_wages_cents: 8000000, deducted_cents: 400000 }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /payroll-remittances/${rem2_id}/submit"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /payroll-remittances/${rem2_id}/post"
              payload: { posting_reference: "PR-2026-0002" }
              as: Recordkeeper
            - call: "GET /participant-accounts/${acct_id}/excess-contribution-cases"
              payload: {}
              as: ProgramAdministrator
              captures: { case_id: "$.data[0].id" }
            - call: "POST /excess-contribution-cases/${case_id}/method-election"
              payload: { correction_method: "REFUND_TO_PARTICIPANT" }
              as: Participant
              as_user_id: "${par_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /participant-accounts/${acct_id}/earnings-postings"
              payload: { earnings_cents: 20000, posting_date: "2026-05-14" }
              as: Recordkeeper
          trigger:
            - call: "POST /excess-contribution-cases/${case_id}/completion"
              payload: { settlement_reference: "NIA-2026-0001" }
              as: Recordkeeper
          assert:
            - "ExcessContributionCase.${case_id}.status == COMPLETED"
            - "ExcessContributionCase.${case_id}.detected_excess_cents == 100000"
            - "ExcessContributionCase.${case_id}.opening_fmv_cents == 450000"
            - "ExcessContributionCase.${case_id}.period_contributions_cents == 400000"
            - "ExcessContributionCase.${case_id}.period_distributions_cents == 0"
            - "ExcessContributionCase.${case_id}.closing_fmv_cents == 870000"
            - "ExcessContributionCase.${case_id}.nia_adjusted_balance_cents == 2353"
            - "ExcessContributionCase.${case_id}.nia_daily_prorata_cents == 800"
            - "ExcessContributionCase.${case_id}.nia_adjusted_balance_cents != ExcessContributionCase.${case_id}.nia_daily_prorata_cents"
            - "ExcessContributionCase.${case_id}.nia_method_applied == ADJUSTED_BALANCE"
            - "ExcessContributionCase.${case_id}.applied_nia_cents == 2353"
            - "ExcessContributionCase.${case_id}.corrected_amount_cents == 102353"
            - "ParticipantAccount.${acct_id}.balance_cents == 767647"
            - "ParticipantAccount.${acct_id}.contribution_basis_cents == 697647"
            - "ParticipantAccount.${acct_id}.ytd_contribution_cents == 700000"
            - "ParticipantAccount.${acct_id}.remaining_headroom_cents == 0"
            - "ParticipantAccount.${acct_id}.posture == UNRESTRICTED"

      - name: statutory_per_employee_vs_graduated_shortfall_penalty
        grounds:
          - calculations.employer_penalty_amount
          - entities.PenaltyAssessment.fields.statutory_amount_cents
          - entities.PenaltyAssessment.fields.graduated_amount_cents
          - entities.PenaltyAssessment.fields.assessed_cents
          - entities.PenaltyAssessment.fields.months_late
          - entities.Employer.fields.unremitted_deduction_cents
          - state_machines.Employer.compliance_status.DELINQUENT_to_PENALIZED
        distinguishing_aspect: |
          This instance exercises the dual variant on the EMPLOYER enforcement aggregate rather
          than on participant money, and its selection rule is a max() rather than a
          context switch: a 5-employee firm 90 days past notice owes 125000 cents statutorily but
          144000 cents on the graduated shortfall track, and because violation_type is
          FAILURE_TO_REMIT the assessment settles on the larger of the two, 144000.
        test_recipe:
          setup:
            - "Program year 2026 with default penalty dials (25000/50000 cents per employee, 150 bp per month, 10000-cent floor, 5000 bp cap, 90/180-day notice tiers)"
            - "Employer Harbor Micro Foods with exactly 5 eligible employees (WAVE_3), registered"
            - "One participant enrolled and ACTIVE so a remittance line is admissible"
            - "A single remittance for pay period 2025-12-01..2025-12-31 with pay_date 2026-01-02 (due 2026-01-09) holding 800000 cents of withheld deductions, SUBMITTED at clock 2026-02-01 and never posted, so unremitted_deduction_cents is 800000 and compliance_status is DELINQUENT"
            - "Clock advanced to 2026-12-31, exactly 356 days past the remittance due date, so months_late is ceil(356/30) = 12"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "TDF2045", name: "Target Retirement 2045", category: "TARGET_DATE", target_year: 2045, expense_ratio_bp: 30, default_eligible: true }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "MMKT01", name: "Government Money Market", category: "CAPITAL_PRESERVATION", expense_ratio_bp: 20, default_eligible: true }
              as: ProgramAdministrator
            - call: "POST /employers"
              payload: { ein: "55-1112223", legal_name: "Harbor Micro Foods Inc", worksite_state: "CA", employee_count: 5 }
              as: ProgramAdministrator
              captures: { emp2_id: "$.data.id" }
            - call: "POST /employers/${emp2_id}/registration"
              payload: { non_fiduciary_acknowledged: true, payroll_contact_email: "hr@harbormicro.example" }
              as: Employer
              as_user_id: "${emp2_id}"
            - call: "POST /participants"
              payload: { full_name: "Dev Anand", date_of_birth: "1985-09-20", email: "dev.anand@x.example", ssn_last4: "5566", state_resident: true }
              as: ProgramAdministrator
              captures: { par2_id: "$.data.id" }
            - call: "POST /employers/${emp2_id}/enrollments"
              payload: { participant_id: "${par2_id}", hire_date: "2025-12-01", annual_compensation_cents: 19200000 }
              as: Employer
              as_user_id: "${emp2_id}"
              captures: { enr2_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /_ops/auto-enrollment-run"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /employers/${emp2_id}/payroll-remittances"
              payload: { pay_period_start: "2025-12-01", pay_period_end: "2025-12-31", pay_date: "2026-01-02", total_deducted_cents: 800000 }
              as: Employer
              as_user_id: "${emp2_id}"
              captures: { rem_late_id: "$.data.id" }
            - call: "POST /payroll-remittances/${rem_late_id}/remittance-lines"
              payload: { enrollment_id: "${enr2_id}", gross_wages_cents: 16000000, deducted_cents: 800000 }
              as: Employer
              as_user_id: "${emp2_id}"
            - call: "POST /payroll-remittances/${rem_late_id}/submit"
              payload: {}
              as: Employer
              as_user_id: "${emp2_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-31T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /employers/${emp2_id}/penalty-assessments"
              payload: { violation_type: "FAILURE_TO_REMIT", notice_date: "2026-10-02", cure_days: 30 }
              as: ComplianceOfficer
              as_user_id: "officer-assessor-1"
              captures: { pen_id: "$.data.id" }
          assert:
            - "PenaltyAssessment.${pen_id}.employee_count_at_assessment == 5"
            - "PenaltyAssessment.${pen_id}.shortfall_basis_cents == 800000"
            - "PenaltyAssessment.${pen_id}.months_late == 12"
            - "PenaltyAssessment.${pen_id}.statutory_amount_cents == 125000"
            - "PenaltyAssessment.${pen_id}.graduated_amount_cents == 144000"
            - "PenaltyAssessment.${pen_id}.statutory_amount_cents != PenaltyAssessment.${pen_id}.graduated_amount_cents"
            - "PenaltyAssessment.${pen_id}.assessed_cents == 144000"
            - "PenaltyAssessment.${pen_id}.cure_deadline == 2026-11-01"
            - "PenaltyAssessment.${pen_id}.status == ASSESSED"
            - "PenaltyAssessment.${pen_id}.origin == MANUAL"
            - "PenaltyAssessment.${pen_id}.assessed_by_user_id == officer-assessor-1"
            - "Employer.${emp2_id}.compliance_status == PENALIZED"
            - "Employer.${emp2_id}.registration_status == REGISTERED"
            - "Employer.${emp2_id}.unremitted_deduction_cents == 800000"

  # ===========================================================================
  # RULE 2 / 9 — combinatorial_formula
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: three_fund_split_last_holder_absorbs_remainder
        grounds:
          - calculations.fund_allocation_split
          - entities.ParticipantAccount.fields.fund_balances
          - entities.InvestmentElection.fields.allocations
          - entities.InvestmentElection.fields.status
          - concurrency_rules[election-create-stale-account]
        distinguishing_aspect: |
          Ordering-plus-remainder combinatorics: the three per-fund figures are produced by
          round_half_up on every fund EXCEPT the last in (allocation_bp DESC, fund_code ASC)
          order, and the last fund takes the arithmetic remainder, so an odd balance of 100003
          cents splits 50002 / 33331 / 16670 and sums to exactly 100003, whereas rounding each
          fund independently yields 16671 for MMKT01 and a total of 100004 that overstates the
          account by one cent.
        test_recipe:
          setup:
            - "Program year 2026; fund menu holds TDF2045, MMKT01 and EQIDX1"
            - "Employer registered, Rosa Lim auto-enrolled with a ROTH_IRA account whose ACTIVE election is the SYSTEM_DEFAULT single allocation of 10000 bp to TDF2045"
            - "One remittance line of gross 2000060 cents at 500 bp withheld exactly 100003 cents and posted, so balance_cents is the odd value 100003 and contribution_basis_cents is 100003"
            - "The account version has been re-read after the posting so the fund-change election can be composed against it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "TDF2045", name: "Target Retirement 2045", category: "TARGET_DATE", target_year: 2045, expense_ratio_bp: 30, default_eligible: true }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "MMKT01", name: "Government Money Market", category: "CAPITAL_PRESERVATION", expense_ratio_bp: 20, default_eligible: true }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "EQIDX1", name: "US Equity Index", category: "EQUITY_INDEX", expense_ratio_bp: 10, default_eligible: false }
              as: ProgramAdministrator
            - call: "POST /employers"
              payload: { ein: "12-3456789", legal_name: "Delta Fabrication LLC", worksite_state: "CA", employee_count: 60 }
              as: ProgramAdministrator
              captures: { emp_id: "$.data.id" }
            - call: "POST /employers/${emp_id}/registration"
              payload: { non_fiduciary_acknowledged: true, payroll_contact_email: "payroll@delta.example" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /participants"
              payload: { full_name: "Rosa Lim", date_of_birth: "1980-05-10", email: "rosa.lim@x.example", ssn_last4: "1234", state_resident: true }
              as: ProgramAdministrator
              captures: { par_id: "$.data.id" }
            - call: "POST /employers/${emp_id}/enrollments"
              payload: { participant_id: "${par_id}", hire_date: "2026-01-05", annual_compensation_cents: 24000720 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { enr_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /_ops/auto-enrollment-run"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /participant-accounts"
              payload: { participant_id: "${par_id}" }
              as: ProgramAdministrator
              captures: { acct_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-06T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /employers/${emp_id}/payroll-remittances"
              payload: { pay_period_start: "2026-02-01", pay_period_end: "2026-02-28", pay_date: "2026-03-05", total_deducted_cents: 100003 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { rem_odd_id: "$.data.id" }
            - call: "POST /payroll-remittances/${rem_odd_id}/remittance-lines"
              payload: { enrollment_id: "${enr_id}", gross_wages_cents: 2000060, deducted_cents: 100003 }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /payroll-remittances/${rem_odd_id}/submit"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /payroll-remittances/${rem_odd_id}/post"
              payload: { posting_reference: "PR-2026-ODD1" }
              as: Recordkeeper
            - call: "GET /participant-accounts/${acct_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { acct_v2: "$.data.version" }
          trigger:
            - call: "POST /participant-accounts/${acct_id}/investment-elections"
              payload:
                allocations:
                  - { fund_code: "EQIDX1", allocation_bp: 5000 }
                  - { fund_code: "TDF2045", allocation_bp: 3333 }
                  - { fund_code: "MMKT01", allocation_bp: 1667 }
                expected_account_version: "${acct_v2}"
              as: Participant
              as_user_id: "${par_id}"
              captures: { elec_id: "$.data.id" }
          assert:
            - "InvestmentElection.${elec_id}.status == ACTIVE"
            - "InvestmentElection.${elec_id}.source == PARTICIPANT_ELECTED"
            - "ParticipantAccount.${acct_id}.balance_cents == 100003"
            - "ParticipantAccount.${acct_id}.fund_balances entry for fund_code EQIDX1 has balance_cents == 50002"
            - "ParticipantAccount.${acct_id}.fund_balances entry for fund_code TDF2045 has balance_cents == 33331"
            - "ParticipantAccount.${acct_id}.fund_balances entry for fund_code MMKT01 has balance_cents == 16670"
            - "sum of ParticipantAccount.${acct_id}.fund_balances[].balance_cents == 100003"
            - "ParticipantAccount.${acct_id}.fund_balances entry for fund_code MMKT01 has balance_cents != 16671"
            - "GET /participant-accounts/${acct_id}/investment-elections returns total_count == 2 with exactly one status == ACTIVE and exactly one status == SUPERSEDED"
            - "the SUPERSEDED election has source == SYSTEM_DEFAULT and selection_basis == TARGET_DATE_GLIDE_PATH"
            - "ParticipantAccount.${acct_id}.version == ${acct_v2} + 1"

      - name: portability_waterfall_fee_tier_keyed_on_gross_not_net
        grounds:
          - calculations.portability_settlement_math
          - entities.PortabilityTransfer.fields.fee_cents
          - entities.PortabilityTransfer.fields.basis_portion_cents
          - entities.PortabilityTransfer.fields.taxable_cents
          - entities.PortabilityTransfer.fields.withholding_cents
          - entities.PortabilityTransfer.fields.net_cents
          - entities.PortabilityTransfer.fields.settle_by_date
        distinguishing_aspect: |
          Ordered five-stage waterfall whose stages consume each other's outputs: the fee tier is
          keyed on the GROSS 1000000 cents (60 bp, 6000 cents), then the basis portion is a
          pro-rata of pre-debit basis over pre-debit balance (500000), then taxable (500000),
          then 10% withholding (50000), then net (944000). Keying the tier on the
          post-withholding 950000 instead lands in the 50 bp band, yielding fee 4750 and net
          945250 — a 1250-cent divergence that only an ordered pipeline can rule out.
        test_recipe:
          setup:
            - "Program year 2026; Rosa Lim enrolled with a ROTH_IRA account"
            - "A posted remittance of 600000 cents (gross 12000000 at 500 bp) leaves contribution_basis_cents 600000 and ytd_contribution_cents 600000, comfortably inside the 700000 ceiling so no excess case exists"
            - "A 600000-cent earnings posting raises balance_cents to 1200000 while leaving contribution_basis_cents at 600000, so the basis fraction is exactly one half"
            - "Clock at 2026-05-01, account posture UNRESTRICTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "TDF2045", name: "Target Retirement 2045", category: "TARGET_DATE", target_year: 2045, expense_ratio_bp: 30, default_eligible: true }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "MMKT01", name: "Government Money Market", category: "CAPITAL_PRESERVATION", expense_ratio_bp: 20, default_eligible: true }
              as: ProgramAdministrator
            - call: "POST /employers"
              payload: { ein: "12-3456789", legal_name: "Delta Fabrication LLC", worksite_state: "CA", employee_count: 60 }
              as: ProgramAdministrator
              captures: { emp_id: "$.data.id" }
            - call: "POST /employers/${emp_id}/registration"
              payload: { non_fiduciary_acknowledged: true, payroll_contact_email: "payroll@delta.example" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /participants"
              payload: { full_name: "Rosa Lim", date_of_birth: "1980-05-10", email: "rosa.lim@x.example", ssn_last4: "1234", state_resident: true }
              as: ProgramAdministrator
              captures: { par_id: "$.data.id" }
            - call: "POST /employers/${emp_id}/enrollments"
              payload: { participant_id: "${par_id}", hire_date: "2026-01-05", annual_compensation_cents: 144000000 }
