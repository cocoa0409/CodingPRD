              payload: { assessor_id: "${assessor_1}", method: "SKINFOLD", assessed_at: "2026-11-01T09:00:00Z", measured_weight_lbs: 159.6, body_fat_pct: 14.0, urine_specific_gravity: 1.020 }
              as: Assessor
              as_user_id: "${assessor_1}"
              captures: { assess_a: $.data.id }
          trigger:
            - call: "POST /assessments/${assess_a}/finalize"
              payload: {}
              as: Assessor
              as_user_id: "${assessor_2}"
              captures: { e_finalize: $.data.error_id }
            - call: "POST /assessments/${assess_a}/finalize"
              payload: {}
              as: Assessor
              as_user_id: "${assessor_1}"
              captures: { ok_status: $.data.status }
            - call: "POST /assessments/${assess_a}/appeals"
              payload: { team_id: "${team_1}", reason: "Skinfold sites appear mismeasured" }
              as: TeamCoach
              as_user_id: "${team_1}"
              captures: { appeal_id: $.data.id }
            - call: "POST /appeals/${appeal_id}/assign-reviewer"
              payload: { reviewing_assessor_id: "${assessor_2}" }
              as: StateOffice
              captures: { appeal_state: $.data.status }
            - call: "POST /appeals/${appeal_id}/order-retest"
              payload: {}
              as: Assessor
              as_user_id: "${assessor_3}"
              captures: { e_retest_other: $.data.error_id }
            - call: "POST /appeals/${appeal_id}/order-retest"
              payload: {}
