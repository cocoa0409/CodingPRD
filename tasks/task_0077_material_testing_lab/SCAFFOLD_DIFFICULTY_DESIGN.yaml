scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: tester_qualification_posture_at_mutation_vs_at_clock_advance
        grounds:
          - calculations.tester_qualification_posture
          - state_machines.TestTask.ASSIGNED_to_PENDING_ASSIGNMENT
          - entities.Tester.fields.qualification_posture
        distinguishing_aspect: |
          Same Tester row with the same qualifications array can produce identical
          posture=LAPSED under both variants, but only the at_clock_advance variant
          cascades and demotes the Tester's active TestTasks back to PENDING_ASSIGNMENT.
          This dual-variant pair lives on the Tester entity domain (qualification + workload),
          distinct from the Invoice entity domain used by the second instance.
        test_recipe:
          setup:
            - "Clock at 2026-01-01T00:00:00Z"
            - "POST /testers creates T1 with qualifications [{material_category=CONCRETE, valid_from=2026-01-01, valid_to=2026-02-01}], max_concurrent_tasks=5"
            - "POST /clients creates C1; POST /samples creates S1 with material_category=CONCRETE; POST /samples/{S1}/tasks creates K1 (COMPRESSION_STRENGTH) which auto-assigns to T1; Tester.active_task_count=1"
          trigger:
            - "Branch A — at_mutation: PATCH /testers/{T1} sets qualifications=[] (empty) with version=2"
            - "Compare Tester.qualification_posture after PATCH"
            - "Reset state, then Branch B — at_clock_advance: leave qualifications intact; POST /_clock/advance to=2026-02-02T00:00:00Z (past valid_to)"
          assert:
            - "Branch A: Tester.qualification_posture == 'LAPSED' AND K1.status == 'ASSIGNED' (no cascade) AND K1.assigned_tester_id == T1.id"
            - "Branch B: Tester.qualification_posture == 'LAPSED' AND K1.status == 'PENDING_ASSIGNMENT' AND K1.assigned_tester_id == null AND T1.active_task_count == 0"

      - name: invoice_total_standard_vs_contract_pricing
        grounds:
          - calculations.invoice_total
          - entities.Client.fields.contract_id
          - entities.Invoice.fields.package_discount_cents
        distinguishing_aspect: |
          Same input — exactly one COMPLETED COMPRESSION_STRENGTH urgent task with no
          abnormal record — yields total_due_cents = 30000 when contract_id is null
          (line_count < 5 → no package discount) but total_due_cents = 27000 when
          contract_id is non-null (contract path triggers the 10% discount regardless
          of line count). This dual-variant pair lives on the Invoice/pricing domain,
          structurally distinct from the Tester/posture domain above.
        test_recipe:
          setup:
            - "Two clients: C1 (contract_id=null) and C2 (contract_id='MASTER-001'). For each, one completed COMPRESSION_STRENGTH urgent task ready to invoice; no abnormal records; deposit_balance_cents=0."
          trigger:
            - "POST /clients/{C1}/invoices with task_ids=[K_C1]"
            - "POST /clients/{C2}/invoices with task_ids=[K_C2]"
          assert:
            - "Invoice for C1: subtotal_cents==20000, surcharge_total_cents==10000, refund_total_cents==0, package_discount_cents==0, total_due_cents==30000"
            - "Invoice for C2: subtotal_cents==20000, surcharge_total_cents==10000, refund_total_cents==0, package_discount_cents==3000, total_due_cents==27000"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_total_per_line_round_before_aggregate     # Mode (b): nested rounding order
        grounds:
          - calculations.invoice_total
          - entities.Invoice.fields.line_items
          - entities.Invoice.fields.surcharge_total_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The scaffold pins
          'round per-line surcharge, THEN sum' rather than 'sum bases, then take 50%
          of the sum'. For three urgent SETTING_TIME tasks (base=15000 each), per-line
          rounding gives surcharge_per_line = round_half_up(15000*0.5)=7500 each,
          surcharge_total=22500. Reversed order would give 7500*3=22500 (same here),
          but the invariant under test is the EVALUATION ORDER itself — each line's
          surcharge field equals 7500, NOT a single 22500 line-level total. That
          stored-per-line literal is observable and asserts the pinned order.
        test_recipe:
          setup:
            - "One client C1 with no contract, no deposit"
            - "Three completed SETTING_TIME tasks K1, K2, K3 each urgent=true with no abnormal records; sample.material_category=CEMENT"
          trigger:
            - "POST /clients/{C1}/invoices with task_ids=[K1, K2, K3]"
          assert:
            - "Invoice.line_items has length 3"
            - "Each Invoice.line_items[i].surcharge_cents == 7500"
            - "Invoice.subtotal_cents == 45000 AND Invoice.surcharge_total_cents == 22500 AND Invoice.refund_total_cents == 0 AND Invoice.package_discount_cents == 0 AND Invoice.total_due_cents == 67500"

      - name: invoice_total_three_input_nonlinear_with_package_threshold   # Mode (a): >=3 inputs, non-linear interaction
        grounds:
          - calculations.invoice_total
          - entities.TestTask.fields.urgent
          - entities.TestTask.fields.retest_count
          - entities.Client.fields.deposit_balance_cents
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs (line_count, urgent-mix, abnormal-after-retest,
          deposit balance, contract_id) and non-linear interaction: the package-discount
          gate (line_count>=5 OR contract!=null) applies AFTER per-line surcharge/refund,
          and the deposit deduction applies AFTER the package discount. Crossing the
          5-line threshold for the same client with the SAME total base_fee but
          different urgency mixes shifts the package_discount from 0 to a positive
          rounded literal. Five urgent COMPRESSION_STRENGTH non-abnormal tasks yields
          subtotal=100000, surcharge_total=50000, refund_total=0, gross=150000,
          line_count==5 -> package_discount=round(150000*0.10)=15000,
          pre_deposit_total=135000, deposit_applied=min(20000,135000)=20000,
          total_due=115000. Structurally distinct from Mode (b) above.
        test_recipe:
          setup:
            - "Client C1 with no contract; deposit_balance_cents=20000"
            - "Five completed COMPRESSION_STRENGTH tasks K1..K5, each urgent=true, sample.material_category=CONCRETE, no abnormal records"
          trigger:
            - "POST /clients/{C1}/invoices with task_ids=[K1, K2, K3, K4, K5]"
          assert:
            - "Invoice.subtotal_cents == 100000"
            - "Invoice.surcharge_total_cents == 50000"
            - "Invoice.refund_total_cents == 0"
            - "Invoice.package_discount_cents == 15000"
            - "Invoice.deposit_applied_cents == 20000"
            - "Invoice.total_due_cents == 115000"
            - "Client.deposit_balance_cents == 0 AND Client.outstanding_balance_cents == 115000"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: report_revision_cycle
        grounds:
          - state_machines.Report.UNDER_REVIEW_to_DRAFTED
          - state_machines.Report.DRAFTED_to_UNDER_REVIEW
          - state_machines.Report.RECALLED_to_DRAFTED
          - entities.Report.fields.version
        distinguishing_aspect: |
          Report has TWO cycles on the same entity: (a) DRAFTED -> UNDER_REVIEW ->
          DRAFTED via send-back (reviewer rejection), and (b) ISSUED -> RECALLED ->
          DRAFTED via recall+reopen. Version increments on each back-edge. This is
          the Report entity; the second instance below is on TestTask, structurally
          distinct entity.
        test_recipe:
          setup:
            - "Completed task K1 (CONCRETE compression) with a non-abnormal record; reviewer R1 (scope=CONCRETE)"
            - "POST /tasks/{K1}/report mints Report Rp1 version=1"
          trigger:
            - "POST /reports/{Rp1}/submit-for-review"
            - "POST /reports/{Rp1}/send-back as R1"
            - "POST /reports/{Rp1}/submit-for-review"
          assert:
            - "After send-back: Report.status == 'DRAFTED' AND Report.version == 2 AND Report.reviewer_id == null"
            - "After second submit-for-review: Report.status == 'UNDER_REVIEW' AND Report.version == 2"

      - name: test_task_retest_loop
        grounds:
          - state_machines.TestTask.IN_PROGRESS_to_AWAITING_RETEST
          - state_machines.TestTask.AWAITING_RETEST_to_IN_PROGRESS
          - entities.TestTask.fields.retest_count
        distinguishing_aspect: |
          TestTask exhibits a cycle: IN_PROGRESS -> AWAITING_RETEST -> IN_PROGRESS
          when a retest record (supersedes_record_id present) is submitted. This is
          a different entity (TestTask) from the Report-cycle instance, satisfying
          the differentiation clause.
        test_recipe:
          setup:
            - "Task K1 (COMPRESSION_STRENGTH on CONCRETE cube 150mm); tester T1 starts task; instrument booking active"
            - "Submit TestRecord with raw_data.peak_load_kn=400 -> calculated_result=17.8 MPa -> abnormal_flag=true"
          trigger:
            - "POST /tasks/{K1}/records with supersedes_record_id pointing to the first record, raw_data.peak_load_kn=720"
          assert:
            - "After first record: TestTask.status == 'AWAITING_RETEST' AND TestTask.retest_count == 0 AND Sample.status == 'RETESTING'"
            - "After retest submission: TestTask.status == 'IN_PROGRESS' AND TestTask.retest_count == 1 AND new TestRecord.calculated_result == 32.0 AND abnormal_flag == false AND previous TestRecord.status == 'SUPERSEDED'"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: instrument_calibration_lapse_cascade   # depth >= 3
        grounds:
          - state_machines.Instrument.AVAILABLE_to_CALIBRATION_DUE
          - state_machines.TestTask.ASSIGNED_to_PENDING_ASSIGNMENT
          - entities.Tester.fields.active_task_count
          - entities.InstrumentBooking.fields.status
        distinguishing_aspect: |
          Trigger = clock-advance past Instrument.calibration_valid_to. Hop 1: Instrument
          status flips to CALIBRATION_DUE. Hop 2: that flip itself cancels each future
          RESERVED booking on that instrument (InstrumentBooking.status -> CANCELLED).
          Hop 3: each cancelled booking's TestTask reverts ASSIGNED -> PENDING_ASSIGNMENT.
          Hop 4: each reverted task decrements its prior Tester.active_task_count.
          Each hop is CAUSED BY the previous hop, not by the original /_clock/advance call.
        test_recipe:
          setup:
            - "Clock at 2026-01-01"
            - "Instrument I1 with calibration_valid_to=2026-01-10"
            - "Tester T1, max=5, qualifications cover CONCRETE"
            - "Task K1 ASSIGNED to T1 with InstrumentBooking B1 (I1, slot_start=2026-01-15, slot_end=2026-01-15T01:00:00Z), status=RESERVED; Tester.active_task_count==1"
          trigger:
            - "POST /_clock/advance to=2026-01-11T00:00:01Z"
          assert:
            - "Instrument.status == 'CALIBRATION_DUE'"
            - "InstrumentBooking.status == 'CANCELLED'"
            - "TestTask.status == 'PENDING_ASSIGNMENT' AND TestTask.assigned_tester_id == null AND TestTask.instrument_booking_id == null"
            - "Tester.active_task_count == 0"
            - "AuditEvent emitted with event_type == 'INSTRUMENT_CALIBRATION_LAPSED'"

      - name: task_completion_bubble_up_to_sample   # depth >= 2
        grounds:
          - state_machines.TestTask.IN_PROGRESS_to_COMPLETED
          - state_machines.Sample.IN_TESTING_to_TESTED
          - entities.Instrument.fields.usage_minutes_total
        distinguishing_aspect: |
          Trigger = POST /tasks/{id}/complete. Hop 1: TestTask.status flips to COMPLETED.
          Hop 2: as a consequence of that flip, the linked InstrumentBooking transitions
          RESERVED -> COMPLETED, Instrument.usage_minutes_total accumulates, AND if
          all sibling tasks under the same Sample are also COMPLETED, Sample.status
          bubbles up to TESTED. Different trigger and different propagation pattern
          from the calibration-lapse cascade above.
        test_recipe:
          setup:
            - "Sample S1 with one task K1 IN_PROGRESS; record SUBMITTED with abnormal_flag=false; InstrumentBooking B1 RESERVED, slot 60 minutes"
          trigger:
            - "POST /tasks/{K1}/complete"
          assert:
            - "TestTask.status == 'COMPLETED'"
            - "InstrumentBooking.status == 'COMPLETED'"
            - "Instrument.usage_minutes_total increased by 60"
            - "Sample.status == 'TESTED'"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_report_sign
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - state_machines.Report.UNDER_REVIEW_to_SIGNED
        distinguishing_aspect: |
          Pair: state (priority 6, ERR_INVALID_STATE) vs business_safety (priority 7,
          ERR_SEGREGATION_OF_DUTIES). When a Signatory whose id ALSO equals the
          Reviewer.id attempts to sign a Report that is already in SIGNED state, BOTH
          violations are present. The scaffold pins state-check first: the response
          MUST be ERR_INVALID_STATE, NOT ERR_SEGREGATION_OF_DUTIES.
        test_recipe:
          setup:
            - "Report Rp1 currently in SIGNED state; Signatory U1 also acted as Reviewer (R1.id == U1.id is impossible across entities — use Tester T1 who also acts as a Signatory by having Signatory.id == Tester.id-not-possible since they are different entity types). Use instead: Report.status==SIGNED AND Signatory.id == Reviewer.id by setting Report.reviewer_id == Signatory.id explicitly via test fixture"
          trigger:
            - "POST /reports/{Rp1}/sign as Signatory U1 whose id equals Report.reviewer_id"
          assert:
            - "HTTP 409 AND response.data.error_id == 'ERR_INVALID_STATE' (state check wins by priority over segregation check)"

      - name: business_referential_vs_business_constraint_on_task_creation
        grounds:
          - validations[priority=11]
          - validations[priority=16]
          - state_machines.TestTask
        distinguishing_aspect: |
          Pair: business_referential (priority 11, ERR_TEST_METHOD_NOT_SUPPORTED — the
          test_method does not match the Sample's material_category) vs
          business_constraint (priority 16, ERR_NO_QUALIFIED_TESTER — no eligible
          tester). Different error-category pair from the first instance above
          (which was state vs business_safety). When a single POST
          /samples/{id}/tasks request triggers BOTH (incompatible method AND no
          qualified tester for the sample's material), the scaffold pins the
          referential check first: response MUST be
          ERR_TEST_METHOD_NOT_SUPPORTED, NOT ERR_NO_QUALIFIED_TESTER.
        test_recipe:
          setup:
            - "Sample S1 with material_category=CONCRETE"
            - "All testers in the system have qualifications covering only STEEL_REBAR (none qualified for CONCRETE)"
          trigger:
            - "POST /samples/{S1}/tasks with test_method=TENSILE_STRENGTH (method maps to STEEL_REBAR, mismatch with CONCRETE)"
          assert:
            - "HTTP 422 AND response.data.error_id == 'ERR_TEST_METHOD_NOT_SUPPORTED' (priority 11 beats priority 16)"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: abnormal_flag_at_lower_bound_exact
        grounds:
          - calculations.test_result_calculation
          - entities.TestRecord.fields.abnormal_flag
        distinguishing_aspect: |
          Metric: numeric threshold on calculated_result (MPa). Boundary semantics
          pinned in calculations.test_result_calculation.precision: result == LOWER[m]
          is NOT abnormal (>= LOWER, NOT > LOWER). For COMPRESSION_STRENGTH cube 150mm,
          peak_load_kn=450 yields exactly 20.0 MPa == LOWER. Endpoint: POST
          /tasks/{id}/records.
        test_recipe:
          setup:
            - "Task K1 (COMPRESSION_STRENGTH, sample CONCRETE cube 150mm) in IN_PROGRESS"
          trigger:
            - "POST /tasks/{K1}/records with raw_data.peak_load_kn=450"
          assert:
            - "TestRecord.calculated_result == 20.0"
            - "TestRecord.abnormal_flag == false"

      - name: empty_eligible_tester_pool_at_assignment
        grounds:
          - calculations.tester_assignment_selection
          - validations[priority=16]
          - state_machines.TestTask
        distinguishing_aspect: |
          Metric: empty-collection edge — the eligible-tester set is empty. Different
          boundary type (empty-set) and different endpoint (POST /samples/{id}/tasks)
          from the numeric-threshold instance above.
        test_recipe:
          setup:
            - "Single Tester T1 whose qualifications cover only STEEL_REBAR"
            - "Sample S1 with material_category=CONCRETE"
          trigger:
            - "POST /samples/{S1}/tasks with test_method=COMPRESSION_STRENGTH"
          assert:
            - "HTTP 422 AND response.data.error_id == 'ERR_NO_QUALIFIED_TESTER'"
            - "TestTask is NOT created (or created in PENDING_ASSIGNMENT state with no assigned_tester_id depending on policy: scaffold pins HARD REJECT at creation)"

      - name: workload_cap_exact_equality_boundary
        grounds:
          - validations[priority=15]
          - calculations.tester_assignment_selection
          - entities.Tester.fields.max_concurrent_tasks
          - entities.Tester.fields.active_task_count
        distinguishing_aspect: |
          Metric: integer cap boundary, distinct from the MPa numeric and the empty-set
          edge above. The check is 'active_task_count + 1 > max_concurrent_tasks',
          i.e. equality (count == max) is NOT exceeded; equality (count + 1 == max + 1,
          i.e. max + 1 > max) IS exceeded. Endpoint: POST /tasks/{id}/assign.
        test_recipe:
          setup:
            - "Tester T1 with max_concurrent_tasks=2, qualifications=CONCRETE"
            - "Two ACTIVE tasks K1, K2 already ASSIGNED to T1; active_task_count==2"
            - "Sample S1 CONCRETE; new Task K3 created PENDING_ASSIGNMENT"
          trigger:
            - "POST /tasks/{K3}/assign"
          assert:
            - "HTTP 409 AND response.data.error_id == 'ERR_TESTER_WORKLOAD_EXCEEDED' (3 > 2)"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: report_issue_blocked_by_instrument_calibration_history
        grounds:
          - validations[priority=10]
          - state_machines.Report.SIGNED_to_ISSUED
          - entities.Instrument.fields.calibration_valid_to
          - entities.TestRecord.fields.created_at
        distinguishing_aspect: |
          Entity pair: Report -> Instrument (through TestRecord -> InstrumentBooking).
          Issuing a Report requires that, at the moment each non-superseded TestRecord
          was created, its instrument's calibration_valid_to was still >= that record's
          created_at. A historically-lapsed instrument retroactively blocks issuance
          even after re-calibration.
        test_recipe:
          setup:
            - "Instrument I1 originally calibrated 2026-01-01..2026-01-31"
            - "Task K1 IN_PROGRESS on I1; clock=2026-02-05 (already past calibration)"
            - "Tester submits a TestRecord at 2026-02-05 (calibration already expired). Manually allowed for test setup by advancing clock then patching calibration retroactively."
            - "Re-calibrate I1 to extend valid_to to 2026-12-31 via PATCH; complete the task; Report Rp1 reaches SIGNED."
          trigger:
            - "POST /reports/{Rp1}/issue as Signatory"
          assert:
            - "HTTP 422 AND response.data.error_id == 'ERR_REPORT_BLOCKED_INSTRUMENT_LAPSED'"

      - name: report_issue_blocked_by_invoice_status
        grounds:
          - state_machines.Report.SIGNED_to_ISSUED
          - state_machines.Invoice
          - entities.Invoice.fields.status
        distinguishing_aspect: |
          Entity pair: Report ↔ Invoice — completely disjoint from the
          Report ↔ Instrument pair above. Issuing a Report (SIGNED → ISSUED) is
          guarded by Invoice.status ∈ {ISSUED, PAID} for the invoice covering the
          report's underlying task. If no Invoice has been issued yet (or the
          existing invoice was VOIDED), the report cannot transition to ISSUED.
        test_recipe:
          setup:
            - "Task K1 COMPLETED with non-abnormal record; Report Rp1 has been signed (status==SIGNED)"
            - "No Invoice exists yet for K1"
          trigger:
            - "POST /reports/{Rp1}/issue as Signatory"
          assert:
            - "HTTP 409 AND response.data.error_id == 'ERR_INVALID_STATE' (preconditions not met because no invoice exists)"
            - "After POST /clients/{Client.id}/invoices with task_ids=[K1] creating Invoice in ISSUED, POST /reports/{Rp1}/issue succeeds with HTTP 200 and Report.status == 'ISSUED'"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: instrument_booking_half_open_adjacent_allowed
        grounds:
          - validations[priority=14]
          - entities.InstrumentBooking.fields.slot_start
          - entities.InstrumentBooking.fields.slot_end
          - concurrency_rules[instrument-overlap]
        distinguishing_aspect: |
          Resource: Instrument. Interval semantics: half-open [slot_start, slot_end).
          Bookings touching at exactly slot_end_A == slot_start_B do NOT collide; any
          numeric overlap (slot_start_B < slot_end_A) collides.
        test_recipe:
          setup:
            - "Instrument I1 with broad calibration window"
            - "Existing RESERVED InstrumentBooking B1 slot=[10:00:00, 11:00:00)"
          trigger:
            - "POST /instruments/{I1}/bookings B2 slot_start=11:00:00, slot_end=12:00:00 (adjacent, should succeed)"
            - "POST /instruments/{I1}/bookings B3 slot_start=10:59:59.999, slot_end=12:00:00 (overlap by 1ms, should fail)"
          assert:
            - "B2: HTTP 201 (adjacent allowed by half-open semantics)"
            - "B3: HTTP 409 AND error_id == 'ERR_INSTRUMENT_SLOT_CONFLICT'"

      - name: tester_aggregate_capacity_overlap
        grounds:
          - validations[priority=15]
          - entities.Tester.fields.active_task_count
          - entities.Tester.fields.max_concurrent_tasks
          - state_machines.TestTask.PENDING_ASSIGNMENT_to_ASSIGNED
        distinguishing_aspect: |
          Resource: Tester — different resource entity from the Instrument used by
          the booking-overlap instance above. Interval semantics: AGGREGATE
          CAPACITY across an open-ended bag of concurrent active TestTasks, NOT a
          half-open numeric time interval. The geometric treatment is total-count
          vs. boundary-touching: a new assignment is rejected when
          (active_task_count + 1) > max_concurrent_tasks regardless of when the
          tasks were created or how their underlying instrument slots fall. This
          satisfies the differentiation clause on both axes — different resource
          entity (Tester vs Instrument) and different interval semantics
          (aggregate-capacity vs half-open [start,end)).
        test_recipe:
          setup:
            - "Tester T1, max_concurrent_tasks=2, qualifications=CONCRETE"
            - "Two existing tasks K1, K2 ASSIGNED to T1 with non-overlapping bookings on different instruments (so booking-overlap rule does NOT fire); active_task_count=2"
            - "New PENDING_ASSIGNMENT task K3 on a CONCRETE sample"
          trigger:
            - "POST /tasks/{K3}/assign (only candidate tester is T1, who is at aggregate capacity)"
          assert:
            - "HTTP 409 AND response.data.error_id == 'ERR_TESTER_WORKLOAD_EXCEEDED'"
            - "K3.status == 'PENDING_ASSIGNMENT' AND K3.assigned_tester_id == null AND T1.active_task_count == 2 (unchanged)"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: tester_workload_conservation_under_reassign
        grounds:
          - state_machines.TestTask.ASSIGNED_to_PENDING_ASSIGNMENT
          - entities.Tester.fields.active_task_count
          - calculations.tester_assignment_selection
        distinguishing_aspect: |
          Conserved quantity: SUM(Tester.active_task_count across all testers) ==
          COUNT(TestTask WHERE status IN {ASSIGNED, IN_PROGRESS, AWAITING_RETEST}).
          For a forward action POST /tasks/{id}/assign and its compensating action
          POST /tasks/{id}/reassign performed on the same task, the named sum MUST
          return to its pre-assign value. Pinned formula: sum_workload(t for t in Tester)
          == count(K for K in TestTask if K.status in {'ASSIGNED','IN_PROGRESS','AWAITING_RETEST'}).
        test_recipe:
          setup:
            - "Two testers T1, T2 both qualified for CONCRETE; T1.active_task_count=2 (two tasks K0a, K0b already assigned), T2.active_task_count=0"
            - "Sample S1 CONCRETE; new Task K1 created PENDING_ASSIGNMENT (auto-assigned to T2 since 0 < 2)"
            - "Pre-state snapshot: invariant_sum = T1.active_task_count + T2.active_task_count = 2 + 1 = 3; count_active_tasks = 3"
          trigger:
            - "POST /tasks/{K1}/reassign"
          assert:
            - "After reassign: K1.status == 'PENDING_ASSIGNMENT' AND K1.assigned_tester_id == null"
            - "T1.active_task_count == 2 AND T2.active_task_count == 0"
            - "Invariant: T1.active_task_count + T2.active_task_count == 2 == count(K in TestTask if K.status in {'ASSIGNED','IN_PROGRESS','AWAITING_RETEST'})"

      - name: client_deposit_conservation_under_invoice_void
        grounds:
          - state_machines.Invoice.ISSUED_to_VOIDED
          - calculations.invoice_total
          - entities.Client.fields.deposit_balance_cents
          - entities.Client.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Conserved quantity: Client.deposit_balance_cents + Client.outstanding_balance_cents
          + (sum of deposit_applied_cents over all VOIDED invoices that have been
          restored). Different conserved-quantity type (monetary cents vs integer
          task counts above). For forward action POST /clients/{id}/invoices and
          compensating action POST /invoices/{id}/void, the pinned invariant is:
          (Client.deposit_balance_cents + Client.outstanding_balance_cents) returns
          to its pre-invoice value when the invoice is voided.
        test_recipe:
          setup:
            - "Client C1 with deposit_balance_cents=30000, outstanding_balance_cents=0"
            - "Five completed COMPRESSION_STRENGTH non-urgent tasks K1..K5 ready to invoice"
            - "Pre-state: deposit_balance=30000, outstanding=0, invariant_sum=30000"
          trigger:
            - "POST /clients/{C1}/invoices with task_ids=[K1..K5] (subtotal=100000, no surcharge, no refund, gross=100000, package_discount=round(100000*0.10)=10000, pre_deposit=90000, deposit_applied=min(30000,90000)=30000, total_due=60000)"
            - "POST /invoices/{Inv1}/void (none of the underlying reports issued yet)"
          assert:
            - "After issuance: Client.deposit_balance_cents == 0 AND Client.outstanding_balance_cents == 60000 (sum=60000, NOT yet conserved — deposit_applied has shifted bucket; full invariant requires the restored portion)"
            - "After void: Client.deposit_balance_cents == 30000 AND Client.outstanding_balance_cents == 0 (sum back to 30000 — invariant restored)"
            - "Invoice.status == 'VOIDED'"
