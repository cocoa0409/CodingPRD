        distinguishing_aspect: "One action endpoint, two outcomes on the same row: REJECT moves PROPOSED->REJECTED and hands the novice back to ENROLLED without ever touching the caseload or slot counters, and the identical second call is refused because the terminal REJECTED state no longer satisfies the transition precondition."
        test_recipe:
          setup: ["A PROPOSED MentorMatch pairs CERTIFIED mentor Rosa Alvarez with novice Dana Pike at OPEN site NG-001; the novice is MATCHED, the mentor's active_caseload_count is 0 and the site's active_match_count is 0. The logical clock is at its startup default 2026-08-01T00:00:00Z."]
