      - name: commission_finalize_requires_all_dates_reconciled
        grounds:
          - state_machines.CommissionStatement.DRAFT_to_FINALIZED
          - errors[ERR_RECONCILIATION_UNRESOLVED]
        distinguishing_aspect: |
          Pair = CommissionStatement depends on ReconciliationSession (third
          distinct pair): finalize is rejected while any date in the closed
          period lacks a BALANCED/RESOLVED session, and succeeds once the
          missing session is created and counted.
        test_recipe:
          setup:
            - "Site S with active policy, no sales on 2026-05-01; clock advanced to 2026-05-02 (period closed); statement for period 2026-05-01..2026-05-01 exists in DRAFT"
