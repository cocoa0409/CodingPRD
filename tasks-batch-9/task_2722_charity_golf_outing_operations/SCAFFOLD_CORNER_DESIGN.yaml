      - name: a_refund_may_not_exceed_the_payment_net_of_the_retained_late_cancellation_fee
        claim_type: Violation → Error
        grounds:
          - validations[priority=36]
          - calculations.registration_cancel_cascade.step_1
          - errors.ERR_REFUND_EXCEEDS_PAYMENT
        distinguishing_aspect: "The refund ceiling MOVES with the clock: outside the notice window it is the whole 120000 paid, and inside the window the retained 25 percent late fee lowers it to 90000, so the very same refund_cents value of 100000 is legal before the window and illegal inside it."
        test_recipe:
          setup:
            - "An OPEN outing (scheduled 2026-09-19T12:00:00Z, cancellation_notice_days 30, so the window opens 2026-08-20T12:00:00Z) with a TEAM4 tier priced 120000."
            - "Two CONFIRMED registrations, R_EARLY and R_LATE, each with player_count 4 and amount_paid_cents 120000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TournamentDirector
            - call: "POST /outing-ops/outings"
              payload: { name: "Refund Ceiling Open", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 4, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
            - call: "POST /outing-ops/contracts"
              payload: { outing_id: "${o_id}", course_name: "Cedar Ridge GC", rate_per_player_cents: 9500, guaranteed_player_count: 0, cancellation_notice_days: 30 }
              as: CourseOperations
              captures: { c_id: $.data.id }
            - call: "POST /outing-ops/contracts/${c_id}/lifecycle"
              payload: { action: "SIGN" }
              as: CourseOperations
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "TEAM4", kind: "TEAM", price_cents: 120000, player_slots: 4, gsv_cents: 24000, inventory_cap: 10 }
              as: TournamentDirector
              captures: { t_id: $.data.id }
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "OPEN_REGISTRATION" }
              as: TournamentDirector
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${t_id}", buyer_name: "Early Canceller", player_count: 4 }
              as: TournamentDirector
              captures: { re_id: $.data.id }
            - call: "POST /outing-ops/registrations/${re_id}/payment"
              payload: { amount_cents: 120000 }
              as: CharityTreasurer
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${t_id}", buyer_name: "Late Canceller", player_count: 4 }
              as: TournamentDirector
              captures: { rl_id: $.data.id }
            - call: "POST /outing-ops/registrations/${rl_id}/payment"
              payload: { amount_cents: 120000 }
              as: CharityTreasurer
          trigger:
            - call: "POST /outing-ops/registrations/${re_id}/lifecycle"
              payload: { action: "CANCEL", refund_cents: 120001 }
              as: TournamentDirector
              captures: { e_over_early: $.data.error_id }
            - call: "POST /outing-ops/registrations/${re_id}/lifecycle"
              payload: { action: "CANCEL", refund_cents: 100000 }
              as: TournamentDirector
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: TournamentDirector
            - call: "POST /outing-ops/registrations/${rl_id}/lifecycle"
              payload: { action: "CANCEL", refund_cents: 100000 }
              as: TournamentDirector
              captures: { e_over_late: $.data.error_id }
            - call: "POST /outing-ops/registrations/${rl_id}/lifecycle"
              payload: { action: "CANCEL" }
              as: TournamentDirector
          assert:
            - "${e_over_early} == 'ERR_REFUND_EXCEEDS_PAYMENT' (HTTP 409) - 120001 is one cent above amount_paid_cents, and GET /outing-ops/registrations/${re_id} still reads status == 'CONFIRMED' with amount_refunded_cents == 0"
            - "the 100000 refund on R_EARLY is HTTP 200: the clock is outside the notice window, so late_cancel_fee_cents == 0, the ceiling is the full 120000, amount_refunded_cents == 100000 and the row auto-advances to REFUNDED"
            - "${e_over_late} == 'ERR_REFUND_EXCEEDS_PAYMENT' (HTTP 409) - inside the window the retained fee round_half_up(0.25 * 120000) == 30000 lowers the ceiling to 90000, so the SAME 100000 value that was legal a moment ago is now refused"
            - "GET /outing-ops/registrations/${rl_id} still reads status == 'CONFIRMED', amount_refunded_cents == 0 AND late_cancel_fee_cents == 0 - the refused call retained nothing"
            - "the plain CANCEL on R_LATE is HTTP 200 with late_cancel_fee_cents == 30000, amount_refunded_cents == 90000 and status == 'REFUNDED'"
            - "GET /outing-ops/outings/${o_id} reads refunded_cents == 190000, gross_revenue_cents == 0 (neither registration is revenue-recognized any more), confirmed_player_slots == 0, admin_fee_cents == 0 and net_proceeds_cents == -190000"

      - name: an_underfunded_prize_pool_blocks_scoring_until_an_upsell_commit_raises_gross_revenue
        claim_type: Violation → Error
        grounds:
          - validations[priority=38]
