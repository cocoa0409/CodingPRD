          - state_machines.RemoteHandsTicket.authorization_AUTHORIZED_to_REVOKED
          - state_machines.RemoteHandsTicket.execution_QUEUED_to_DISPATCHED
          - validations.priority_16_ERR_TICKET_NOT_AUTHORIZED
          - validations.priority_13_ERR_INVALID_STATE
          - entities.RemoteHandsTicket.fields.authorization_state
          - entities.RemoteHandsTicket.fields.execution_state
        distinguishing_aspect: |
          The two dimensions are neither independent nor merged: dispatch is REFUSED while
          authorization is still PENDING_AUTHORIZATION (ERR_TICKET_NOT_AUTHORIZED, execution
          stays QUEUED), authorization then moves alone to AUTHORIZED without touching
          execution, and a later REVOKED drags execution DISPATCHED→CANCELLED so completion
          becomes impossible (ERR_INVALID_STATE) and the contract's bundled minutes are never
          consumed.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Contract ACTIVE with remote_hands_included_minutes 15, cabinet C01 INSTALLED."
            - "Two contacts holding REMOTE_HANDS: the requester and a different authorizer."
