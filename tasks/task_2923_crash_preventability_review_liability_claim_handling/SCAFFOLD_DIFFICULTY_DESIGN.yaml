      - name: settle_demand_cascade_depth3_subrogation_ready
        grounds:
          - state_machines.Demand.OFFER_OUTSTANDING_to_SETTLED
          - state_machines.Claim.NEGOTIATION_to_SETTLEMENT_COMPLETE
          - state_machines.SubrogationDemand.DRAFT_to_READY_TO_PURSUE
          - calculations.settlement_layer_waterfall
          - calculations.subrogation_recovery
          - entities.SubrogationDemand.fields.recoverable_base_cents
          - entities.SubrogationDemand.fields.max_recoverable_cents
          - validations[priority=52]
        distinguishing_aspect: |
          Triggering transition: Demand OFFER_OUTSTANDING -> SETTLED, a different
          transition from the other instance's ReviewCase DELIBERATION ->
          DECIDED. Three serial links: (1) the Demand settles and freezes
          settled_amount_cents / alae_cents / settlement_total_cents, (2) because
          it settled and no sibling demand is open, the Claim moves NEGOTIATION
          -> SETTLEMENT_COMPLETE and its paid buckets absorb 15,000,000 cents,
          (3) because the Claim reached SETTLEMENT_COMPLETE, the DRAFT
          SubrogationDemand moves to READY_TO_PURSUE and freezes
          recoverable_base_cents 15,000,000 / max_recoverable_cents 6,000,000
          from the buckets link 2 had just written.
        test_recipe:
          setup:
            - "One Terminal, one Driver, one MODERATE crash on 2026-07-30 with third_party_at_fault TRUE (required to open a subrogation demand)."
            - "A well-formed two-layer 2026 tower: layer_index 1 SIR attachment 0 limit 10,000,000, layer_index 2 PRIMARY attachment 10,000,000 limit 10,000,000, so capacity is 20,000,000."
            - "One Claim with a single THIRD_PARTY_PROPERTY Demand of 20,000,000, a DEMAND_BASED revision that set outstanding_reserve_cents to 20,000,000, and a standing carrier offer of 13,392,857."
            - "One SubrogationDemand on that claim in DRAFT with at_fault_percentage 40 and recoverable_base_cents / max_recoverable_cents both still null."
            - "Clock left at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "Hillsboro Terminal", terminal_code: "HIL01", region_code: "OH", annual_miles_millions: 4.0 }
              as: SafetyAdmin
