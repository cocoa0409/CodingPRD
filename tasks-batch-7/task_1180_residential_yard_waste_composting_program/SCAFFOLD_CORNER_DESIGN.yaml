          trigger:
            - { call: "POST /contamination-inspections", payload: { pickup_ticket_id: "${t1}", result: "TAGGED_REJECTED", violation_codes: [] }, as: FieldInspector, as_user_id: "insp_1", captures: { err: $.data.error_id } }
