              payload: { full_name: "CrisisDoc", network_status: "IN_NETWORK", specialties: ["STRESS"], accepting: true }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /eap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eap/crisis-contacts"
              payload: { contract_id: "${c_id}", severity: "HIGH" }
              as: CrisisCounselor
              captures: { cc_id: $.data.id }
            - call: "POST /eap/crisis-contacts/${cc_id}/triage"
              payload: { disposition: "URGENT_REFERRAL" }
              as: CrisisCounselor
          trigger:
            - call: "POST /eap/crisis-contacts/${cc_id}/escalate"
              payload: { required_specialty: "STRESS" }
              as: CrisisCounselor
              captures: { cc_status: $.data.status }
          assert:
            - "CrisisContact.${cc_id}.status == ESCALATED"
            - "Provider.${prov_id}.active_referral_count == 1"
            - "Referral list filtered by provider_id=${prov_id} contains one REQUESTED CLINICAL referral"

