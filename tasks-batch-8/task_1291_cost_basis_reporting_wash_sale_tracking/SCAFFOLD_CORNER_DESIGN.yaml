  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role fails with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any other check."
        test_recipe:
          setup: ["firm exists"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm V1" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
          trigger:
            - call: "GET /firms/${firm_id}"
              payload: {}
              as: __NO_AUTH_HEADERS__
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: corporate_action_incomplete_payload_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_INCOMPLETE_ACTION_PAYLOAD]"]
        distinguishing_aspect: "Announcing a SPLIT without split_ratio_numerator fails with ERR_INCOMPLETE_ACTION_PAYLOAD."
        test_recipe:
          setup: ["firm, security"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm V2" }
              as: FirmAdmin
