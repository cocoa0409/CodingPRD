# =============================================================================
# §1.9 Scaffold Corner Design — Advertising Policy Review & Ad Approval
# =============================================================================
# Breadth probe over the nine claim-extraction-guide sections. Every instance is
# a test prototype: the setup_api_calls chain drives an empty database into the
# instance's precondition using only §1.5 endpoints, and every assert names an
# exact field with a literal value pre-computed from §1.3.
#
# Conventions reused verbatim from SCAFFOLD_DIFFICULTY_DESIGN.yaml:
#   * the logical clock reads 2026-08-01T00:00:00Z until POST /ad-policy/_clock
#     /set_current_utc moves it;
#   * Advertiser and PolicyReviewer calls always carry as_user_id (the acting
#     Advertiser.id / Reviewer.id); PolicyAdmin and IntegrityAnalyst calls omit
#     it because those two roles are opaque;
#   * ReviewTask and DisapprovalNotice ids are captured from their filtered list
#     endpoints (GET /ad-policy/review-tasks, GET /ad-policy/disapproval-notices)
#     because no write response returns them directly;
#   * negative triggers capture $.data.error_id so the expected failure is an
#     asserted observable, never an inferred one.
scaffold_corner_design:

  # ===========================================================================
  - section: "From Table 1 (Entities)"
    instances:

      - name: entity_creation_ad_creative_returns_201_with_both_state_axes_at_their_initial_values
        claim_type: Creation
        grounds:
          - entities.AdCreative
          - endpoints[POST /ad-policy/ad-creatives]
          - calculations.serving_eligibility_gate
        distinguishing_aspect: |
          A freshly created creative must come back with every system and computed
          field seeded by the server, not by the request: DRAFT on the review axis,
          NOT_CHECKED on the destination axis, both risk scores 0.00, version 1 and
          blocking_reason_codes holding exactly the two conjuncts that a draft
          necessarily fails, in conjunct order.
        test_recipe:
          setup:
            - "One REGULATED rule FIN_CREDIT so declared_category_codes resolves."
            - "One advertiser with no verifications and no enforcement history, so account_status is ACTIVE."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "FIN_CREDIT", title: "Consumer credit offers", category_class: "REGULATED", base_severity_weight: 4.00, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.55, review_sla_hours: 48, default_queue: "STANDARD" }
              as: PolicyAdmin
              captures: { fin_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Beacon Lending Co", country_code: "US", industry_code: "CONSUMER_FINANCE" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
          trigger:
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Refinance in ten minutes", body_text: "Refinance your card balance in ten minutes with a fixed rate.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/refi", display_url: "https://www.beaconlending.example/refi" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_id: "$.data.id" }
            - call: "GET /ad-policy/ad-creatives/${cr_id}"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
          assert:
            - "The create call returns HTTP 201"
            - "AdCreative.${cr_id}.review_status == DRAFT and destination_status == NOT_CHECKED"
            - "AdCreative.${cr_id}.risk_score_provisional == 0.00 and risk_score_final == 0.00"
            - "AdCreative.${cr_id}.serving_eligible == false"
            - "AdCreative.${cr_id}.blocking_reason_codes == [REVIEW_NOT_APPROVED, DESTINATION_NOT_CLEARED] in exactly that order"
            - "AdCreative.${cr_id}.screening_run_count == 0, limited_country_codes == [], approved_under_certification_id == null"
            - "AdCreative.${cr_id}.political_flag == false and disclaimer_text == null (both omitted from the request)"
            - "AdCreative.${cr_id}.version == 1"
            - "The GET returns byte-identical field values to the POST response"

      - name: entity_retrieval_get_certification_returns_the_stored_interval_and_its_activation_status
        claim_type: Retrieval
        grounds:
          - entities.Certification
          - endpoints[GET /ad-policy/certifications/{id}]
          - calculations.certification_coverage
        distinguishing_aspect: |
          A certification whose half-open interval already contains the 2026-08-01
          logical clock is stored ACTIVE at creation time, and the read endpoint
          returns the six input fields unchanged plus status ACTIVE and a null
          revocation_reason — no field is recomputed at read time.
        test_recipe:
          setup:
            - "One RESTRICTED rule ALC_SPIRITS that requires certification."
            - "One advertiser holding a US licence valid 2026-07-01 to 2026-12-01, which brackets the clock."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "ALC_SPIRITS", title: "Alcohol - spirits", category_class: "RESTRICTED", base_severity_weight: 6.00, requires_certification: true, requires_disclaimer: true, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.55, review_sla_hours: 48, default_queue: "REGULATED_CERT" }
              as: PolicyAdmin
              captures: { alc_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Northline Spirits LLC", country_code: "US", industry_code: "ALCOHOL_RETAIL" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/certifications"
              payload: { advertiser_id: "${adv_id}", policy_rule_id: "${alc_id}", license_number: "TTB-NL-2026-441", issuing_country_code: "US", valid_from: "2026-07-01T00:00:00Z", valid_until: "2026-12-01T00:00:00Z" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cert_id: "$.data.id" }
          trigger:
            - call: "GET /ad-policy/certifications/${cert_id}"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
          assert:
            - "The read returns HTTP 200"
            - "Certification.${cert_id}.status == ACTIVE (valid_from <= 2026-08-01T00:00:00Z < valid_until)"
            - "Certification.${cert_id}.license_number == TTB-NL-2026-441 and issuing_country_code == US"
            - "Certification.${cert_id}.valid_from == 2026-07-01T00:00:00Z and valid_until == 2026-12-01T00:00:00Z"
            - "Certification.${cert_id}.revocation_reason == null and version == 1"

      - name: entity_listing_ad_creatives_paginates_by_created_at_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /ad-policy/ad-creatives]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three creatives owned by one advertiser, read with limit 2: the first page
          carries two rows in created_at ASC order with total_count 3 and has_more
          true, the second page carries the remaining row with has_more false. The
          window must be computed against the filtered set, not the whole table.
        test_recipe:
          setup:
            - "One rule and two advertisers; the queried advertiser owns three creatives created in a fixed order, the other owns one that must never appear."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "FIN_CREDIT", title: "Consumer credit offers", category_class: "REGULATED", base_severity_weight: 4.00, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.55, review_sla_hours: 48, default_queue: "STANDARD" }
              as: PolicyAdmin
              captures: { fin_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Beacon Lending Co", country_code: "US", industry_code: "CONSUMER_FINANCE" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Rival Lending Co", country_code: "US", industry_code: "CONSUMER_FINANCE" }
              as: PolicyAdmin
              captures: { other_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Offer one", body_text: "Refinance offer number one for existing customers.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/one", display_url: "https://www.beaconlending.example/one" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr1_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Offer two", body_text: "Refinance offer number two for existing customers.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/two", display_url: "https://www.beaconlending.example/two" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr2_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Offer three", body_text: "Refinance offer number three for existing customers.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/three", display_url: "https://www.beaconlending.example/three" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr3_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${other_id}", headline: "Rival offer", body_text: "A rival refinance offer that must be filtered out.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["US"], landing_page_url: "https://www.rivallending.example/one", display_url: "https://www.rivallending.example/one" }
              as: Advertiser
              as_user_id: "${other_id}"
          trigger:
            - call: "GET /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", limit: 2, offset: 0 }
              as: PolicyAdmin
            - call: "GET /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", limit: 2, offset: 2 }
              as: PolicyAdmin
            - call: "GET /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}" }
              as: PolicyAdmin
          assert:
            - "Page one returns exactly 2 rows, in order [${cr1_id}, ${cr2_id}] (created_at ASC)"
            - "Page one reports total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Page two returns exactly 1 row, [${cr3_id}], with total_count == 3 and has_more == false"
            - "The unpaginated third call applies the default limit 10 and offset 0 and returns all 3 rows with has_more == false"
            - "No page contains the rival advertiser's creative"

      - name: ad_creative_create_missing_required_declared_category_codes_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.AdCreative.declared_category_codes
          - validations[priority=20].ERR_INVALID_REQUEST
          - endpoints[POST /ad-policy/ad-creatives]
        distinguishing_aspect: |
          declared_category_codes has source input, no default and a non-empty
          constraint, so omitting it is a 400 ERR_INVALID_REQUEST from priority 20
          before any FK resolution at priority 32 — and no AdCreative row is written.
        test_recipe:
          setup:
            - "One rule and one advertiser exist; nothing else is needed because the request never gets past body validation."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "FIN_CREDIT", title: "Consumer credit offers", category_class: "REGULATED", base_severity_weight: 4.00, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.55, review_sla_hours: 48, default_queue: "STANDARD" }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Beacon Lending Co", country_code: "US", industry_code: "CONSUMER_FINANCE" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
          trigger:
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "No categories", body_text: "This request omits declared_category_codes entirely.", target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/x", display_url: "https://www.beaconlending.example/x" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { err: "$.data.error_id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Empty categories", body_text: "This request supplies an empty declared_category_codes array.", declared_category_codes: [], target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/y", display_url: "https://www.beaconlending.example/y" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { err2: "$.data.error_id" }
            - call: "GET /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}" }
              as: PolicyAdmin
          assert:
            - "The first trigger returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "The second trigger also returns 400 ERR_INVALID_REQUEST because the array is constrained non-empty"
            - "Neither call returns ERR_POLICY_RULE_NOT_FOUND — priority 20 precedes priority 32"
            - "GET /ad-policy/ad-creatives for this advertiser reports total_count == 0"

      - name: policy_rule_defaults_are_applied_when_every_optional_input_is_omitted
        claim_type: Defaults
        grounds:
          - entities.PolicyRule
          - endpoints[POST /ad-policy/policy-rules]
        distinguishing_aspect: |
          A rule created with only its four required fields must materialise the six
          declared defaults exactly — requires_certification false, requires_disclaimer
          false, auto threshold 0.90, manual threshold 0.55, review_sla_hours 48 and
          default_queue STANDARD — plus country_override_count 0 and version 1.
        test_recipe:
          setup:
            - "Empty database; no other rule exists so the uniqueness check at priority 90 cannot fire."
          setup_api_calls: []
          trigger:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "SUP_HEALTH", title: "Health supplements", category_class: "REGULATED", base_severity_weight: 3.00 }
              as: PolicyAdmin
              captures: { sup_id: "$.data.id" }
            - call: "GET /ad-policy/policy-rules/${sup_id}"
              payload: {}
              as: PolicyAdmin
          assert:
            - "The create call returns HTTP 201"
            - "PolicyRule.${sup_id}.requires_certification == false and requires_disclaimer == false"
            - "PolicyRule.${sup_id}.confidence_auto_disapprove_threshold == 0.90 and confidence_manual_threshold == 0.55"
            - "PolicyRule.${sup_id}.review_sla_hours == 48 and default_queue == STANDARD"
            - "PolicyRule.${sup_id}.country_override_count == 0 and version == 1"
            - "PolicyRule.${sup_id}.base_severity_weight == 3.00 (echoed with 2 decimals)"

      - name: computed_field_country_override_count_tracks_override_inserts_and_bumps_the_rule_version
        claim_type: Computed Fields
        grounds:
          - entities.PolicyRule.country_override_count
          - endpoints[POST /ad-policy/policy-rules/{id}/country-overrides]
          - endpoints[GET /ad-policy/policy-rules/{id}/country-overrides]
        distinguishing_aspect: |
          country_override_count is a denormalised counter on the parent rule, not a
          request field: two override inserts drive it 0 -> 1 -> 2 and lift the rule's
          version to 3, while the override rows themselves stay at version 1.
        test_recipe:
          setup:
            - "One RESTRICTED rule with no overrides, so the counter starts at its 0 default."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "ALC_SPIRITS", title: "Alcohol - spirits", category_class: "RESTRICTED", base_severity_weight: 6.00, requires_certification: true, requires_disclaimer: true, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.55, review_sla_hours: 48, default_queue: "REGULATED_CERT" }
              as: PolicyAdmin
              captures: { alc_id: "$.data.id", alc_v0: "$.data.version" }
          trigger:
            - call: "POST /ad-policy/policy-rules/${alc_id}/country-overrides"
              payload: { country_code: "US", disposition: "RESTRICTED_CERT_REQUIRED", requires_license: true, requires_disclaimer: true, severity_multiplier: 1.50 }
              as: PolicyAdmin
              captures: { ovr_us_id: "$.data.id" }
            - call: "GET /ad-policy/policy-rules/${alc_id}"
              payload: {}
              as: PolicyAdmin
            - call: "POST /ad-policy/policy-rules/${alc_id}/country-overrides"
              payload: { country_code: "SE", disposition: "BLOCKED", severity_multiplier: 2.00 }
              as: PolicyAdmin
            - call: "GET /ad-policy/policy-rules/${alc_id}"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/policy-rules/${alc_id}/country-overrides"
              payload: {}
              as: PolicyAdmin
          assert:
            - "${alc_v0} == 1 before any override is inserted and country_override_count == 0 at that point"
            - "After the first override PolicyRule.${alc_id}.country_override_count == 1 and version == 2"
            - "After the second override PolicyRule.${alc_id}.country_override_count == 2 and version == 3"
            - "CountryPolicyOverride.${ovr_us_id}.severity_multiplier == 1.50, requires_license == true, version == 1"
            - "The SE override defaults requires_license to false and requires_disclaimer to false"
            - "GET country-overrides returns total_count == 2"

      - name: system_fields_screening_run_sequence_index_is_contiguous_across_the_revision_loop
        claim_type: System Fields
        grounds:
          - entities.ScreeningRun.sequence_index
          - entities.ScreeningRun.creative_version_at_run
          - state_machines.AdCreative.review_status.DISAPPROVED_to_DRAFT
          - calculations.creative_risk_score
        distinguishing_aspect: |
          sequence_index is server-assigned as previous max + 1 per creative, and the
          only way to reach index 2 is the revision loop (auto-disapproval, PATCH back
          to DRAFT, re-submit): the second run must read sequence_index 2 and snapshot
          the creative version it ran against, while the risk score reflects only the
          latest run's decisions.
        test_recipe:
          setup:
            - "Rule HATE_SPEECH (PROHIBITED, weight 12.00, auto 0.90, manual 0.55) with no country override, so its US disposition defaults to BLOCKED."
            - "One advertiser with identity and business standing VERIFIED so no verification gap routes the second run to manual."
            - "One creative declaring HATE_SPEECH and targeting US, submitted and screened at confidence 0.95 so it is auto-disapproved (assessed 12.00 * 1.00 * 0.80 = 9.60, below the 10.00 WARNING threshold, so the account stays ACTIVE)."
            - "The advertiser then PATCHes the creative back to DRAFT and re-submits it."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "HATE_SPEECH", title: "Hateful content", category_class: "PROHIBITED", base_severity_weight: 12.00, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.55, review_sla_hours: 24, default_queue: "STANDARD" }
              as: PolicyAdmin
              captures: { hate_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Loud Media Group", country_code: "US", industry_code: "PUBLISHING" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "BUSINESS_STANDING", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Speak your mind", body_text: "Speak your mind about the neighbours you cannot stand.", declared_category_codes: ["HATE_SPEECH"], target_country_codes: ["US"], landing_page_url: "https://www.loudmedia.example/speak", display_url: "https://www.loudmedia.example/speak" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_v1: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${hate_id}", confidence: 0.95, matched_snippet: "neighbours you cannot stand" }], expected_ad_creative_version: "${cr_v1}" }
              as: PolicyAdmin
              captures: { run1_id: "$.data.id", run1_seq: "$.data.sequence_index" }
            - call: "PATCH /ad-policy/ad-creatives/${cr_id}"
              payload: { headline: "Speak kindly", body_text: "Speak kindly about the neighbours on your street." }
              as: Advertiser
              as_user_id: "${adv_id}"
            - call: "POST /ad-policy/ad-creatives/${cr_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_v2: "$.data.version" }
          trigger:
            - call: "POST /ad-policy/ad-creatives/${cr_id}/screening-runs"
              payload: { classifier_version: "clf-2026.08", decisions: [{ policy_rule_id: "${hate_id}", confidence: 0.30, matched_snippet: "neighbours on your street" }], expected_ad_creative_version: "${cr_v2}" }
              as: PolicyAdmin
              captures: { run2_id: "$.data.id", run2_seq: "$.data.sequence_index" }
            - call: "GET /ad-policy/ad-creatives/${cr_id}/screening-runs"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/ad-creatives/${cr_id}"
              payload: {}
              as: PolicyAdmin
          assert:
            - "${run1_seq} == 1 and ${run2_seq} == 2 (contiguous per creative, server-assigned)"
            - "${cr_v1} == 2 (create 1, submit 2) and ${cr_v2} == 5 (screening run 3, PATCH 4, re-submit 5)"
            - "ScreeningRun.${run1_id}.creative_version_at_run == ${cr_v1} and ScreeningRun.${run2_id}.creative_version_at_run == ${cr_v2}"
            - "ScreeningRun.${run1_id}.outcome == AUTO_DISAPPROVED with provisional_risk_score 11.40 (12.00 * 1.00 * 0.95)"
            - "ScreeningRun.${run2_id}.outcome == AUTO_APPROVED with decision_count == 1, max_confidence == 0.30 and provisional_risk_score == 0.00"
            - "AdCreative.${cr_id}.screening_run_count == 2, review_status == AUTO_APPROVED, risk_score_provisional == 0.00"
            - "GET screening-runs returns both runs ordered by sequence_index ASC with total_count == 2"

      - name: type_constraints_invalid_category_class_and_out_of_range_weight_return_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.PolicyRule.category_class
          - entities.PolicyRule.base_severity_weight
          - validations[priority=20].ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Enum membership and numeric range are both enforced at priority 20 before any
          business rule: category_class BANNED is not one of the three declared classes,
          and base_severity_weight 25.00 exceeds the 20.00 ceiling. Neither request may
          create a row, and neither may be reported as a threshold-ordering error.
        test_recipe:
          setup:
            - "Empty database; the two rejected requests are the only calls that touch it."
          setup_api_calls: []
          trigger:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "GAM_CASINO", title: "Casino gambling", category_class: "BANNED", base_severity_weight: 8.00 }
              as: PolicyAdmin
              captures: { err_enum: "$.data.error_id" }
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "GAM_CASINO", title: "Casino gambling", category_class: "RESTRICTED", base_severity_weight: 25.00 }
              as: PolicyAdmin
              captures: { err_range: "$.data.error_id" }
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "GAM_CASINO", title: "Casino gambling", category_class: "RESTRICTED", base_severity_weight: 8.00, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.55 }
              as: PolicyAdmin
              captures: { gam_id: "$.data.id" }
          assert:
            - "The first trigger returns HTTP 400 with error_id ERR_INVALID_REQUEST (BANNED is not PROHIBITED | RESTRICTED | REGULATED)"
            - "The second trigger returns HTTP 400 with error_id ERR_INVALID_REQUEST (25.00 > 20.00 ceiling)"
            - "Neither rejected call returns ERR_INVALID_THRESHOLD_ORDER or ERR_DUPLICATE_POLICY_CODE"
            - "The third call succeeds with HTTP 201, proving the code GAM_CASINO was never consumed by the two rejected attempts"
            - "PolicyRule.${gam_id}.category_class == RESTRICTED and base_severity_weight == 8.00"

      - name: immutability_screening_run_and_classifier_decision_expose_no_version_and_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.ScreeningRun
          - entities.ClassifierDecision
          - endpoints[GET /ad-policy/screening-runs/{id}]
          - endpoints[GET /ad-policy/screening-runs/{id}/classifier-decisions]
        distinguishing_aspect: |
          ScreeningRun and ClassifierDecision are declared common_fields: false, so their
          payloads carry id and created_at but no version and no updated_at, and §1.5
          declares no PATCH, PUT or DELETE on either resource — the audit trail of a
          screening decision can only be appended to, never edited.
        test_recipe:
          setup:
            - "One REGULATED rule, one verified advertiser, one submitted creative and one screening run at confidence 0.30 that auto-approves."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "FIN_CREDIT", title: "Consumer credit offers", category_class: "REGULATED", base_severity_weight: 4.00, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.55, review_sla_hours: 48, default_queue: "STANDARD" }
              as: PolicyAdmin
              captures: { fin_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Beacon Lending Co", country_code: "US", industry_code: "CONSUMER_FINANCE" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "BUSINESS_STANDING", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Fixed rate refinance", body_text: "A fixed rate refinance offer with no origination fee.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/fixed", display_url: "https://www.beaconlending.example/fixed" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${fin_id}", confidence: 0.30, matched_snippet: "fixed rate refinance" }], expected_ad_creative_version: "${cr_v}" }
              as: PolicyAdmin
              captures: { run_id: "$.data.id" }
          trigger:
            - call: "GET /ad-policy/screening-runs/${run_id}"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/screening-runs/${run_id}/classifier-decisions"
              payload: {}
              as: PolicyAdmin
          assert:
            - "The ScreeningRun payload contains id and created_at but no version key and no updated_at key"
            - "The single ClassifierDecision payload contains id and created_at but no version key and no updated_at key"
            - "ClassifierDecision.disposition == BELOW_THRESHOLD, country_multiplier_applied == 1.00, assessed_points == 1.20 (4.00 * 1.00 * 0.30)"
            - "ScreeningRun.${run_id}.decision_count == 1 and classifier-decisions reports total_count == 1"
            - "§1.5 exposes no PATCH, PUT or DELETE for /ad-policy/screening-runs/{id} or its classifier-decisions sub-resource"

      - name: parent_relationship_country_override_under_an_unknown_policy_rule_returns_policy_rule_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.CountryPolicyOverride.policy_rule_id
          - validations[priority=30].ERR_AD_CREATIVE_NOT_FOUND
          - errors[ERR_POLICY_RULE_NOT_FOUND]
        distinguishing_aspect: |
          The override is addressed through its parent's path segment, so an unresolvable
          parent id is a 404 ERR_POLICY_RULE_NOT_FOUND from the priority 30 ladder — the
          body is never validated, which is why a body that is itself illegal (duplicate
          disposition-free payload) still reports the parent 404.
        test_recipe:
          setup:
            - "One real rule exists so the 404 cannot be blamed on an empty table."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "ALC_SPIRITS", title: "Alcohol - spirits", category_class: "RESTRICTED", base_severity_weight: 6.00, requires_certification: true }
              as: PolicyAdmin
              captures: { alc_id: "$.data.id" }
          trigger:
            - call: "POST /ad-policy/policy-rules/00000000-0000-4000-8000-000000000000/country-overrides"
              payload: { country_code: "US", disposition: "BLOCKED", severity_multiplier: 2.00 }
              as: PolicyAdmin
              captures: { err_post: "$.data.error_id" }
            - call: "GET /ad-policy/policy-rules/00000000-0000-4000-8000-000000000000/country-overrides"
              payload: {}
              as: PolicyAdmin
              captures: { err_get: "$.data.error_id" }
            - call: "GET /ad-policy/policy-rules/${alc_id}/country-overrides"
              payload: {}
              as: PolicyAdmin
          assert:
            - "Both unknown-parent calls return HTTP 404 with error_id ERR_POLICY_RULE_NOT_FOUND"
            - "Neither returns ERR_INVALID_REQUEST or ERR_DUPLICATE_POLICY_CODE"
            - "The real rule's override list returns HTTP 200 with total_count == 0"
            - "PolicyRule.${alc_id}.country_override_count == 0 (no row leaked from the rejected insert)"

      - name: flat_topology_ad_creative_body_fks_are_validated_and_unknown_ids_return_not_found
        claim_type: Creation
        grounds:
          - complexity_profile.entity_topology
          - validations[priority=32].ERR_POLICY_RULE_NOT_FOUND
          - errors[ERR_ADVERTISER_NOT_FOUND]
        distinguishing_aspect: |
          The topology is flat, so AdCreative points at its advertiser and at its rules by
          reference: an unknown advertiser_id is ERR_ADVERTISER_NOT_FOUND and an unknown
          element of declared_category_codes is ERR_POLICY_RULE_NOT_FOUND, both 404 at
          priority 32 and both checked in the order the rule declares.
        test_recipe:
          setup:
            - "One rule FIN_CREDIT and one real advertiser."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "FIN_CREDIT", title: "Consumer credit offers", category_class: "REGULATED", base_severity_weight: 4.00 }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Beacon Lending Co", country_code: "US", industry_code: "CONSUMER_FINANCE" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
          trigger:
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "00000000-0000-4000-8000-000000000000", headline: "Orphan creative", body_text: "A creative whose advertiser_id does not resolve to any row.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/orphan", display_url: "https://www.beaconlending.example/orphan" }
              as: Advertiser
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { err_adv: "$.data.error_id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Unknown category", body_text: "A creative declaring a category code that no rule defines.", declared_category_codes: ["NOT_A_RULE"], target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/unknown", display_url: "https://www.beaconlending.example/unknown" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { err_rule: "$.data.error_id" }
            - call: "GET /ad-policy/ad-creatives"
              payload: {}
              as: PolicyAdmin
          assert:
            - "The first trigger returns HTTP 404 with error_id ERR_ADVERTISER_NOT_FOUND"
            - "The second trigger returns HTTP 404 with error_id ERR_POLICY_RULE_NOT_FOUND"
            - "GET /ad-policy/ad-creatives reports total_count == 0 — neither rejected request wrote a row"

  # ===========================================================================
  - section: "From Table 2 (State Machines)"
    instances:

      - name: initial_state_routed_review_task_and_future_dated_certification_start_in_their_declared_states
        claim_type: Initial State
        grounds:
          - state_machines.ReviewTask.status
          - state_machines.Certification.status
          - calculations.review_task_priority_score
          - calculations.screening_disposition
        distinguishing_aspect: |
          Two machines are seeded in the same chain: a certification whose window opens
          in the future starts SUBMITTED rather than ACTIVE, and a task minted by manual
          routing starts QUEUED with resolution PENDING, no holder, cycle_count 0 and a
          priority_score of 45.00 + 12.00 = 57.00 computed at creation time.
        test_recipe:
          setup:
            - "Rule ALC_SPIRITS (RESTRICTED, weight 6.00, requires_certification true, requires_disclaimer true, auto 0.90, manual 0.55, sla 48, default_queue REGULATED_CERT) with no country override, so strictest_multiplier is 1.00."
            - "One advertiser with identity and business standing VERIFIED."
            - "A certification for ALC_SPIRITS valid 2026-09-01 to 2026-12-01, i.e. entirely after the 2026-08-01 clock."
            - "One non-political creative declaring ALC_SPIRITS, targeting US, carrying a disclaimer, submitted and screened at confidence 0.70 (>= 0.55, < 0.90)."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "ALC_SPIRITS", title: "Alcohol - spirits", category_class: "RESTRICTED", base_severity_weight: 6.00, requires_certification: true, requires_disclaimer: true, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.55, review_sla_hours: 48, default_queue: "REGULATED_CERT" }
              as: PolicyAdmin
              captures: { alc_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Northline Spirits LLC", country_code: "US", industry_code: "ALCOHOL_RETAIL" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "BUSINESS_STANDING", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/certifications"
              payload: { advertiser_id: "${adv_id}", policy_rule_id: "${alc_id}", license_number: "TTB-NL-2026-902", issuing_country_code: "US", valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-12-01T00:00:00Z" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cert_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Single barrel release", body_text: "Our single barrel bourbon release is available for pre-order.", declared_category_codes: ["ALC_SPIRITS"], target_country_codes: ["US"], landing_page_url: "https://www.northline.example/bourbon", display_url: "https://www.northline.example/bourbon", disclaimer_text: "Drink responsibly. 21+" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_v: "$.data.version" }
          trigger:
            - call: "POST /ad-policy/ad-creatives/${cr_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${alc_id}", confidence: 0.70, matched_snippet: "single barrel bourbon" }], expected_ad_creative_version: "${cr_v}" }
              as: PolicyAdmin
              captures: { run_id: "$.data.id" }
            - call: "GET /ad-policy/review-tasks"
              payload: { ad_creative_id: "${cr_id}" }
              as: PolicyAdmin
              captures: { task_id: "$.data[0].id" }
            - call: "GET /ad-policy/certifications/${cert_id}"
              payload: {}
              as: PolicyAdmin
          assert:
            - "Certification.${cert_id}.status == SUBMITTED (valid_from 2026-09-01 is after the clock, so activation waits for the sweep)"
            - "ScreeningRun.${run_id}.outcome == ROUTED_MANUAL with provisional_risk_score 4.20 (6.00 * 1.00 * 0.70)"
            - "ReviewTask.${task_id}.status == QUEUED, resolution == PENDING, assigned_reviewer_id == null, claimed_at == null, escalation_note == null"
            - "ReviewTask.${task_id}.cycle_count == 0 and version == 1"
            - "ReviewTask.${task_id}.queue == REGULATED_CERT (the matched rule requires certification) and primary_policy_rule_id == ${alc_id}"
            - "ReviewTask.${task_id}.priority_score == 57.00 (45.00 base + max(12.00, 0.00) + 0.00 + 0.00)"
            - "ReviewTask.${task_id}.sla_deadline_at == 2026-08-03T00:00:00Z (created_at + 48h)"
            - "AdCreative.${cr_id}.review_status == PENDING_MANUAL_REVIEW and destination_status == DESTINATION_PENDING"

      - name: valid_transition_submit_advances_the_review_axis_and_the_destination_axis_together
        claim_type: Valid Transition
        grounds:
          - state_machines.AdCreative.review_status.DRAFT_to_SCREENING
          - state_machines.AdCreative.destination_status.NOT_CHECKED_to_DESTINATION_PENDING
          - endpoints[POST /ad-policy/ad-creatives/{id}/submit]
        distinguishing_aspect: |
          One submit call moves both axes in a single write: review_status DRAFT ->
          SCREENING and destination_status NOT_CHECKED -> DESTINATION_PENDING, with
          exactly one version increment and no ReviewTask created, because screening
          itself is driven by the separate screening-runs endpoint.
        test_recipe:
          setup:
            - "One rule, one advertiser and one DRAFT creative."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "FIN_CREDIT", title: "Consumer credit offers", category_class: "REGULATED", base_severity_weight: 4.00 }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Beacon Lending Co", country_code: "US", industry_code: "CONSUMER_FINANCE" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Balance transfer", body_text: "Move your balance and pay no interest for a year.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/transfer", display_url: "https://www.beaconlending.example/transfer" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_id: "$.data.id" }
          trigger:
            - call: "POST /ad-policy/ad-creatives/${cr_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
            - call: "GET /ad-policy/review-tasks"
              payload: { ad_creative_id: "${cr_id}" }
              as: PolicyAdmin
          assert:
            - "The submit call returns HTTP 200"
            - "AdCreative.${cr_id}.review_status == SCREENING and destination_status == DESTINATION_PENDING"
            - "AdCreative.${cr_id}.version == 2 (exactly one increment for the submit)"
            - "AdCreative.${cr_id}.serving_eligible == false with blocking_reason_codes [REVIEW_NOT_APPROVED, DESTINATION_NOT_CLEARED]"
            - "GET /ad-policy/review-tasks for this creative reports total_count == 0"

      - name: invalid_transition_second_submit_on_a_screening_creative_returns_invalid_creative_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.AdCreative.review_status.DRAFT_to_SCREENING
          - validations[priority=40].ERR_INVALID_CREATIVE_STATE
        distinguishing_aspect: |
          No submit transition leaves SCREENING, so a repeated submit is a 409
          ERR_INVALID_CREATIVE_STATE that leaves the version untouched — the rejection
          must be a state check, not an idempotent replay that silently returns 200.
        test_recipe:
          setup:
            - "One creative already submitted, so review_status is SCREENING and version is 2."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "FIN_CREDIT", title: "Consumer credit offers", category_class: "REGULATED", base_severity_weight: 4.00 }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Beacon Lending Co", country_code: "US", industry_code: "CONSUMER_FINANCE" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Balance transfer", body_text: "Move your balance and pay no interest for a year.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/transfer", display_url: "https://www.beaconlending.example/transfer" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_v: "$.data.version" }
          trigger:
            - call: "POST /ad-policy/ad-creatives/${cr_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { err: "$.data.error_id" }
            - call: "GET /ad-policy/ad-creatives/${cr_id}"
              payload: {}
              as: PolicyAdmin
          assert:
            - "The second submit returns HTTP 409 with error_id ERR_INVALID_CREATIVE_STATE"
            - "AdCreative.${cr_id}.version is still ${cr_v} == 2 (the rejected call performed no side effect)"
            - "AdCreative.${cr_id}.review_status == SCREENING and destination_status == DESTINATION_PENDING"

      - name: terminal_state_lockdown_a_withdrawn_creative_rejects_submit_and_patch
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.AdCreative.review_status.DRAFT_to_WITHDRAWN
          - validations[priority=40].ERR_INVALID_CREATIVE_STATE
        distinguishing_aspect: |
          WITHDRAWN is the review axis' terminal state: neither submit nor PATCH has a
          transition out of it, so both are 409 ERR_INVALID_CREATIVE_STATE. A PATCH must
          not be allowed to resurrect the creative into DRAFT the way it may from
          DISAPPROVED.
        test_recipe:
          setup:
            - "One DRAFT creative that its owner withdraws immediately, reaching WITHDRAWN at version 2."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "FIN_CREDIT", title: "Consumer credit offers", category_class: "REGULATED", base_severity_weight: 4.00 }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Beacon Lending Co", country_code: "US", industry_code: "CONSUMER_FINANCE" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Retired offer", body_text: "An offer that is pulled before it is ever submitted for review.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/retired", display_url: "https://www.beaconlending.example/retired" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/withdraw"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_v: "$.data.version" }
          trigger:
            - call: "POST /ad-policy/ad-creatives/${cr_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { err_submit: "$.data.error_id" }
            - call: "PATCH /ad-policy/ad-creatives/${cr_id}"
              payload: { headline: "Un-retired offer" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { err_patch: "$.data.error_id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/withdraw"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { err_withdraw: "$.data.error_id" }
            - call: "GET /ad-policy/ad-creatives/${cr_id}"
              payload: {}
              as: PolicyAdmin
          assert:
            - "All three triggers return HTTP 409 with error_id ERR_INVALID_CREATIVE_STATE"
            - "AdCreative.${cr_id}.review_status == WITHDRAWN and headline is still 'Retired offer'"
            - "AdCreative.${cr_id}.version is still ${cr_v} == 2"

      - name: precondition_enforcement_screening_run_against_a_draft_creative_returns_invalid_creative_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.AdCreative.review_status.SCREENING_to_AUTO_APPROVED
          - validations[priority=40].ERR_INVALID_CREATIVE_STATE
          - concurrency_rules.screening-run-stale-creative
        distinguishing_aspect: |
          Every screening-run transition requires review_status == SCREENING, so ingesting
          a run against a DRAFT creative fails at priority 40 even though the supplied
          expected_ad_creative_version is perfectly current — the state check outranks the
          priority 45 OCC check, and no ScreeningRun row is written.
        test_recipe:
          setup:
            - "One rule, one advertiser and one creative left in DRAFT (never submitted), with its create version captured for the OCC token."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "FIN_CREDIT", title: "Consumer credit offers", category_class: "REGULATED", base_severity_weight: 4.00, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.55 }
              as: PolicyAdmin
              captures: { fin_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Beacon Lending Co", country_code: "US", industry_code: "CONSUMER_FINANCE" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Draft only", body_text: "A creative that is screened before anyone submits it.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/draft", display_url: "https://www.beaconlending.example/draft" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_id: "$.data.id", cr_v: "$.data.version" }
          trigger:
            - call: "POST /ad-policy/ad-creatives/${cr_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${fin_id}", confidence: 0.30, matched_snippet: "a creative that is screened" }], expected_ad_creative_version: "${cr_v}" }
              as: PolicyAdmin
              captures: { err: "$.data.error_id" }
            - call: "GET /ad-policy/ad-creatives/${cr_id}/screening-runs"
              payload: {}
              as: PolicyAdmin
          assert:
            - "The trigger returns HTTP 409 with error_id ERR_INVALID_CREATIVE_STATE, never ERR_STALE_CREATIVE_VERSION"
            - "GET screening-runs for the creative reports total_count == 0"
            - "AdCreative.${cr_id}.review_status == DRAFT, screening_run_count == 0 and version is still ${cr_v} == 1"

      - name: idempotency_claiming_an_already_claimed_task_twice_returns_invalid_task_state
        claim_type: Idempotency
        grounds:
          - state_machines.ReviewTask.status.QUEUED_to_CLAIMED
          - validations[priority=40].ERR_INVALID_TASK_STATE
          - endpoints[POST /ad-policy/review-tasks/{id}/claim]
        distinguishing_aspect: |
          claim requires status QUEUED, so the same reviewer replaying their own successful
          claim gets 409 ERR_INVALID_TASK_STATE — and crucially claimed_task_count must
          stay at 1, not creep to 2, because the rejected call performs no side effect.
        test_recipe:
          setup:
            - "Rule FIN_CREDIT (REGULATED, weight 4.00, auto 0.90, manual 0.55, queue STANDARD), one verified advertiser, one reviewer authorised for US on the STANDARD queue with a ceiling of 3."
            - "One creative screened at confidence 0.70 so it routes to manual review with a STANDARD task, which the reviewer then claims."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "FIN_CREDIT", title: "Consumer credit offers", category_class: "REGULATED", base_severity_weight: 4.00, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.55, review_sla_hours: 48, default_queue: "STANDARD" }
