  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_distribution_create
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - errors[ERR_FORMAT_INVALID_STATE]
          - errors[ERR_NO_VALID_PRICE]
        distinguishing_aspect: "A DRAFT format with no ACTIVE price violates BOTH the state check (priority 4, ERR_FORMAT_INVALID_STATE) and the business_fiscal check (priority 8, ERR_NO_VALID_PRICE); the state error wins — a different category pair than instance two."
        test_recipe:
          setup:
            - "AMZ channel, publisher, title, PRINT format left in DRAFT with no assets and no ChannelPrice."
          setup_api_calls:
            - call: "POST /channels"
              payload: { name: "AMZ", channel_type: "RETAIL", supports_formats: ["PRINT","EBOOK"], ebook_high_rate: 0.70, ebook_low_rate: 0.35, ebook_rate_low_threshold_cents: 299, ebook_rate_high_threshold_cents: 999, delivery_fee_per_mb_cents: 15, distribution_discount_standard: 0.40, distribution_discount_expanded: 0.60, returns_reserve_pct: 0.15, min_list_price_cents: 99, max_list_price_cents: 25000 }
              as: PlatformAdmin
              captures: { amz: "$.data.id" }
            - call: "POST /publishers"
              payload: { name: "Indie House", email: "p@x.com" }
              as: PlatformAdmin
              captures: { pub: "$.data.id" }
            - call: "POST /titles"
              payload: { publisher_id: "${pub}", title: "Prio Book", language: "en", bisac_category: "FIC000000" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { title: "$.data.id" }
            - call: "POST /titles/${title}/formats"
              payload: { format_type: "PRINT", trim_size: "6x9", interior_color: "BW", page_count: 200 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { fmt: "$.data.id" }
          trigger:
            - call: "POST /formats/${fmt}/distribution-requests"
              payload: { channel_id: "${amz}", territory: "US" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "response data.error_id == ERR_FORMAT_INVALID_STATE"
            - "error_id != ERR_NO_VALID_PRICE (fiscal is lower priority and suppressed)"

      - name: temporal_beats_referential_on_statement_issue
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_PERIOD_NOT_ENDED]
          - errors[ERR_NO_SALES_IN_PERIOD]
        distinguishing_aspect: "A statement whose period has NOT ended and that has zero sales violates BOTH business_temporal (priority 5, ERR_PERIOD_NOT_ENDED) and business_referential (priority 6, ERR_NO_SALES_IN_PERIOD); the temporal error wins — a distinct category pair from instance one."
        test_recipe:
          setup:
