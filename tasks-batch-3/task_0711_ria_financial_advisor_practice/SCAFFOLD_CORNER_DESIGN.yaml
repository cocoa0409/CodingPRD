# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# RIA / Financial-Advisor Practice — Expert. Breadth probe walking
# references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1-§1.7.
# Every grounds[] resolves to §1.1-§1.7; every call resolves to §1.5.
# Fee schedule literal used: tiers [{<=100000000@100bps},{<=500000000@75bps},{rest@50bps}], min 100000.
# Clock default 2026-03-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_household_returns_201_with_computed_aum_zero
        claim_type: Creation
        grounds: [entities.Household, endpoints]
        distinguishing_aspect: "POST /households with required fields returns 201 and billable_aum_cents/aggregated_aum_cents/breakpoint_tier_index all 0; version==1."
        test_recipe:
          setup: ["A fee schedule exists."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: null, annual_rate_bps: 100} ], minimum_annual_fee_cents: 0 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
          trigger:
            - call: "POST /households"
              payload: { name: "Carter Family", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}" }
              as: Advisor
              captures: { hh_id: $.data.id, v: $.data.version }
          assert:
            - "HTTP 201; Household.${hh_id}.billable_aum_cents == 0 AND aggregated_aum_cents == 0 AND breakpoint_tier_index == 0"
            - "Household.${hh_id}.version == 1 AND status == ACTIVE"

      - name: get_household_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Household, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /households/{id} with a non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /households/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Advisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and data.error_id == ERR_NOT_FOUND"

      - name: create_client_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Client, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /clients omitting risk_tolerance_score (required, no default) returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A household exists."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: null, annual_rate_bps: 100} ], minimum_annual_fee_cents: 0 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}" }
              as: Advisor
              captures: { hh_id: $.data.id }
          trigger:
            - call: "POST /clients"
              payload: { household_id: "${hh_id}", full_name: "C", date_of_birth: "1980-01-01", risk_capacity_score: 60 }
              as: Advisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and data.error_id == ERR_INVALID_REQUEST (risk_tolerance_score missing)"

      - name: client_score_out_of_range_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Client.fields.risk_capacity_score, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /clients with risk_capacity_score=150 (>100) returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A household exists."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: null, annual_rate_bps: 100} ], minimum_annual_fee_cents: 0 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}" }
              as: Advisor
              captures: { hh_id: $.data.id }
          trigger:
            - call: "POST /clients"
              payload: { household_id: "${hh_id}", full_name: "C", date_of_birth: "1980-01-01", risk_capacity_score: 150, risk_tolerance_score: 60 }
              as: Advisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and data.error_id == ERR_INVALID_REQUEST (score out of 0..100)"

      - name: suitability_band_computed_from_min_scores
        claim_type: Computed Fields
        grounds: [entities.Client.fields.suitability_band, state_machines.Client.PROSPECT_to_KYC_VERIFIED]
        distinguishing_aspect: "VERIFY_KYC computes suitability_band from min(capacity=80, tolerance=20)=20 -> CONSERVATIVE band; client-supplied band ignored."
        test_recipe:
          setup: ["A PROSPECT client with capacity 80, tolerance 20."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: null, annual_rate_bps: 100} ], minimum_annual_fee_cents: 0 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}" }
              as: Advisor
              captures: { hh_id: $.data.id }
            - call: "POST /clients"
              payload: { household_id: "${hh_id}", full_name: "C", date_of_birth: "1980-01-01", risk_capacity_score: 80, risk_tolerance_score: 20 }
              as: Advisor
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /clients/${c_id}/state"
              payload: { action: "VERIFY_KYC" }
              as: Advisor
              captures: { band: $.data.suitability_band }
          assert:
            - "Client.${c_id}.suitability_band == CONSERVATIVE (min(80,20)=20 lands in the conservative band)"

      - name: household_billing_method_defaults_to_arrears
        claim_type: Defaults
        grounds: [entities.Household.fields.billing_method]
        distinguishing_aspect: "POST /households omitting billing_method defaults to ARREARS."
        test_recipe:
          setup: ["A fee schedule exists."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: null, annual_rate_bps: 100} ], minimum_annual_fee_cents: 0 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
          trigger:
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}" }
              as: Advisor
              captures: { bm: $.data.billing_method }
          assert:
            - "Household.billing_method == ARREARS (default applied)"

      - name: create_household_bad_fee_schedule_reference
        claim_type: Parent Relationships
        grounds: [entities.Household.fields.fee_schedule_id, "validations[priority=4]", "errors[ERR_REFERENCE_NOT_FOUND]"]
        distinguishing_aspect: "POST /households with a non-existent fee_schedule_id returns 422 ERR_REFERENCE_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB; fabricated fee_schedule_id."]
          setup_api_calls: []
          trigger:
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "00000000-0000-4000-8000-000000000000" }
              as: Advisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 and data.error_id == ERR_REFERENCE_NOT_FOUND"

      - name: list_households_pagination_envelope
        claim_type: Listing
        grounds: [entities.Household, endpoints]
        distinguishing_aspect: "GET /households returns response_type array with pagination fields total_count and has_more."
        test_recipe:
          setup: ["One household exists."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: null, annual_rate_bps: 100} ], minimum_annual_fee_cents: 0 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}" }
              as: Advisor
          trigger:
            - call: "GET /households?limit=10&offset=0"
              payload: {}
              as: Advisor
          assert:
            - "response_type == array; meta.total_count >= 1; meta.has_more is a boolean"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: client_activate_from_prospect_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Client.IPS_SIGNED_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /clients/{id}/state action=ACTIVATE on a PROSPECT client (ACTIVATE only defined from IPS_SIGNED) returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A PROSPECT client (never KYC-verified)."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: null, annual_rate_bps: 100} ], minimum_annual_fee_cents: 0 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}" }
              as: Advisor
              captures: { hh_id: $.data.id }
            - call: "POST /clients"
              payload: { household_id: "${hh_id}", full_name: "C", date_of_birth: "1980-01-01", risk_capacity_score: 60, risk_tolerance_score: 60 }
              as: Advisor
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /clients/${c_id}/state"
              payload: { action: "ACTIVATE" }
              as: Advisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == ERR_INVALID_STATE"

      - name: compliance_item_archive_from_open_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ComplianceItem.SATISFIED_to_ARCHIVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /compliance-items/{id}/state action=ARCHIVE on an OPEN item (ARCHIVE only from SATISFIED) returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["An OPEN compliance item due in the future."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: null, annual_rate_bps: 100} ], minimum_annual_fee_cents: 0 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}" }
              as: Advisor
              captures: { hh_id: $.data.id }
            - call: "POST /compliance-items"
              payload: { subject_type: "HOUSEHOLD", subject_id: "${hh_id}", obligation_type: "FORM_ADV_DELIVERY", due_date: "2026-12-31" }
              as: ComplianceOfficer
              captures: { ci_id: $.data.id }
          trigger:
            - call: "POST /compliance-items/${ci_id}/state"
              payload: { action: "ARCHIVE" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == ERR_INVALID_STATE"

      - name: client_disengage_then_disengage_again_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Client.PROSPECT_to_DISENGAGED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A DISENGAGED client (terminal) rejects any further action with 409 ERR_INVALID_STATE; second DISENGAGE fails."
        test_recipe:
          setup: ["A DISENGAGED client."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: null, annual_rate_bps: 100} ], minimum_annual_fee_cents: 0 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}" }
              as: Advisor
              captures: { hh_id: $.data.id }
            - call: "POST /clients"
              payload: { household_id: "${hh_id}", full_name: "C", date_of_birth: "1980-01-01", risk_capacity_score: 60, risk_tolerance_score: 60 }
              as: Advisor
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/state"
              payload: { action: "DISENGAGE" }
              as: Advisor
          trigger:
            - call: "POST /clients/${c_id}/state"
              payload: { action: "DISENGAGE" }
              as: Advisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == ERR_INVALID_STATE (DISENGAGED is terminal)"

      - name: fee_run_initial_state_is_draft
        claim_type: Initial State
        grounds: [state_machines.FeeRun, entities.FeeRun.fields.status]
        distinguishing_aspect: "A freshly created fee run starts in status DRAFT with basis/gross/assessed all 0."
        test_recipe:
          setup: ["An ACTIVE billable account in a household so a run can be created."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: null, annual_rate_bps: 100} ], minimum_annual_fee_cents: 0 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}" }
              as: Advisor
              captures: { hh_id: $.data.id, hh_v0: $.data.version }
          trigger:
            - call: "POST /fee-runs"
              payload: { household_id: "${hh_id}", period_start: "2026-01-01", period_end: "2026-03-31", expected_household_version: "${hh_v0}" }
              as: BillingAdmin
              captures: { run_id: $.data.id, st: $.data.status }
          assert:
            - "FeeRun.${run_id}.status == DRAFT AND gross_fee_cents == 0 AND assessed_fee_cents == 0"

      - name: review_complete_computes_next_due_date
        claim_type: Side Effect Execution
        grounds: [state_machines.Review.SCHEDULED_to_COMPLETED, entities.Review.fields.next_due_date, entities.Review.fields.completed_at]
        distinguishing_aspect: "POST /reviews/{id}/complete at clock 2026-03-01 with cadence_days=365 stamps completed_at and computes next_due_date 2027-03-01."
        test_recipe:
          setup: ["Clock 2026-03-01; a SCHEDULED review with cadence_days=365."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Advisor
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: null, annual_rate_bps: 100} ], minimum_annual_fee_cents: 0 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}" }
              as: Advisor
              captures: { hh_id: $.data.id }
            - call: "POST /reviews"
              payload: { household_id: "${hh_id}", scheduled_for: "2026-03-01", cadence_days: 365 }
              as: Advisor
              captures: { rev_id: $.data.id }
          trigger:
            - call: "POST /reviews/${rev_id}/complete"
              payload: {}
              as: Advisor
              captures: { nd: $.data.next_due_date, ca: $.data.completed_at }
          assert:
            - "Review.${rev_id}.status == COMPLETED AND next_due_date == 2027-03-01"

      - name: later_review_supersedes_earlier_as_missed
        claim_type: Side Effect Execution
        grounds: [state_machines.Review.SCHEDULED_to_MISSED, entities.Review.fields.status]
        distinguishing_aspect: "Creating a later-dated SCHEDULED review (2026-12-01) for a household marks the prior earlier SCHEDULED review (2026-06-01) as MISSED."
        test_recipe:
          setup: ["A household with one SCHEDULED review on 2026-06-01."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: null, annual_rate_bps: 100} ], minimum_annual_fee_cents: 0 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}" }
              as: Advisor
              captures: { hh_id: $.data.id }
            - call: "POST /reviews"
              payload: { household_id: "${hh_id}", scheduled_for: "2026-06-01", cadence_days: 365 }
              as: Advisor
              captures: { rev1_id: $.data.id }
          trigger:
            - call: "POST /reviews"
              payload: { household_id: "${hh_id}", scheduled_for: "2026-12-01", cadence_days: 365 }
              as: Advisor
              captures: { rev2_id: $.data.id }
            - call: "GET /reviews/${rev1_id}"
              payload: {}
              as: Advisor
              captures: { s1: $.data.status }
          assert:
            - "Review.${rev1_id}.status == MISSED AND Review.${rev2_id}.status == SCHEDULED"

      - name: ips_cycle_revision_round_increments
        claim_type: cyclic
        grounds: [state_machines.InvestmentPolicyStatement.PROPOSED_to_DRAFT]
        excluded_because:
          difficulty_instance: non_linear_state_machine / ips_draft_proposed_revision_cycle
          rationale: "The DRAFT<->PROPOSED cycle and revision_round increment are asserted by the named §1.8 instance."

      - name: fee_run_calculate_locks_fee_schedule
        claim_type: Side Effect Execution
        grounds: [state_machines.FeeRun.DRAFT_to_CALCULATED, entities.FeeSchedule.fields.is_locked, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "After CALCULATE, the referenced FeeSchedule.is_locked==true and a subsequent PATCH /fee-schedules/{id} returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A CALCULATED fee run referencing the schedule."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: null, annual_rate_bps: 100} ], minimum_annual_fee_cents: 0 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}", billing_method: "ARREARS" }
              as: Advisor
              captures: { hh_id: $.data.id, hh_v0: $.data.version }
            - call: "POST /clients"
              payload: { household_id: "${hh_id}", full_name: "C", date_of_birth: "1980-01-01", risk_capacity_score: 60, risk_tolerance_score: 60 }
              as: Advisor
              captures: { c_id: $.data.id }
            - call: "POST /accounts"
              payload: { household_id: "${hh_id}", client_id: "${c_id}", custodian: "Schwab", account_type: "TAXABLE", market_value_cents: 100000000, equity_value_cents: 0, billable: true, held_away: false }
              as: Advisor
              captures: { a_id: $.data.id }
            - call: "POST /clients/${c_id}/state"
              payload: { action: "VERIFY_KYC" }
              as: Advisor
            - call: "POST /accounts/${a_id}/state"
              payload: { action: "ACTIVATE" }
              as: Advisor
            - call: "POST /fee-runs"
              payload: { household_id: "${hh_id}", period_start: "2026-01-01", period_end: "2026-03-31", expected_household_version: "${hh_v0}" }
              as: BillingAdmin
              captures: { run_id: $.data.id }
            - call: "POST /fee-runs/${run_id}/state"
              payload: { action: "CALCULATE" }
              as: BillingAdmin
          trigger:
            - call: "PATCH /fee-schedules/${sched_id}"
              payload: { minimum_annual_fee_cents: 500 }
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == ERR_INVALID_STATE (schedule locked by CALCULATED run)"

      - name: account_freeze_cascade_rejects_proposed_rebalance
        claim_type: Cross-entity
        grounds: [state_machines.Account.ACTIVE_to_FROZEN, state_machines.RebalanceOrder.PROPOSED_to_REJECTED]
        excluded_because:
          difficulty_instance: transitive_cascade / account_freeze_rejects_rebalance_then_clears_flag_depth3
          rationale: "Freeze cascade auto-rejecting the PROPOSED rebalance order is asserted by the named §1.8 depth-3 cascade instance."

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: fee_minimum_floor_binds_on_small_account
        claim_type: Correct Result
        grounds: [calculations.tiered_marginal_fee, entities.FeeRun.fields.assessed_fee_cents, entities.FeeRun.fields.gross_fee_cents]
        distinguishing_aspect: "Full-year run on a 5,000,000c account: gross_fee_cents=50000 (tier0 @1%) but minimum 100000 binds, so assessed_fee_cents=100000 (floor_binds variant)."
        test_recipe:
          setup: ["An ACTIVE billable account valued 5,000,000c in an ARREARS household on the standard schedule (minimum 100000)."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: 100000000, annual_rate_bps: 100}, {upper_bound_cents: 500000000, annual_rate_bps: 75}, {upper_bound_cents: null, annual_rate_bps: 50} ], minimum_annual_fee_cents: 100000 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}", billing_method: "ARREARS" }
              as: Advisor
              captures: { hh_id: $.data.id, hh_v0: $.data.version }
            - call: "POST /clients"
              payload: { household_id: "${hh_id}", full_name: "C", date_of_birth: "1980-01-01", risk_capacity_score: 60, risk_tolerance_score: 60 }
              as: Advisor
              captures: { c_id: $.data.id }
            - call: "POST /accounts"
              payload: { household_id: "${hh_id}", client_id: "${c_id}", custodian: "Schwab", account_type: "TAXABLE", market_value_cents: 5000000, equity_value_cents: 0, billable: true, held_away: false }
              as: Advisor
              captures: { a_id: $.data.id }
            - call: "POST /clients/${c_id}/state"
              payload: { action: "VERIFY_KYC" }
              as: Advisor
            - call: "POST /accounts/${a_id}/state"
              payload: { action: "ACTIVATE" }
              as: Advisor
            - call: "POST /fee-runs"
              payload: { household_id: "${hh_id}", period_start: "2026-01-01", period_end: "2026-12-31", expected_household_version: "${hh_v0}" }
              as: BillingAdmin
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /fee-runs/${run_id}/state"
              payload: { action: "CALCULATE" }
              as: BillingAdmin
              captures: { gross: $.data.gross_fee_cents, assessed: $.data.assessed_fee_cents }
          assert:
            - "FeeRun.${run_id}.gross_fee_cents == 50000"
            - "FeeRun.${run_id}.assessed_fee_cents == 100000 (minimum floor binds)"

      - name: held_away_account_excluded_from_billable_aum
        claim_type: Input Set Filtering
        grounds: [calculations.householding_breakpoint_tier, entities.Household.fields.billable_aum_cents, entities.Household.fields.aggregated_aum_cents, entities.Account.fields.held_away]
        distinguishing_aspect: "A held_away ACTIVE account is excluded from billable_aum_cents but included in aggregated_aum_cents: billable=100000000, aggregated=150000000 with one billable 100M and one held-away 50M account."
        test_recipe:
          setup: ["A household with one ACTIVE billable account (100M) and one ACTIVE held-away account (50M)."]
          setup_api_calls:
