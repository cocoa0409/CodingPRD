      - name: corner_confidence_variant_divergence_on_identical_scores
        claim_type: variant_divergence
        grounds: [calculations.match_confidence_score.variants]
        distinguishing_aspect: "One score triple must yield two different confidence values under the two variants, which no single code path can produce."
        excluded_because:
          difficulty_instance: dual_variant_calc / confidence_variant_identifier_anchored_vs_attribute_blend
          rationale: "That instance feeds one score triple through both variants and asserts the full divergence including the anchor bonus and the low-image ceiling."

      - name: corner_index_basis_variant_divergence_on_one_fixture
        claim_type: variant_divergence
        grounds: [calculations.price_index.variants]
        distinguishing_aspect: "The matched-basket and imputed-full-catalog bases must disagree on the same basket, including the imputed and excluded counts."
        excluded_because:
          difficulty_instance: dual_variant_calc / price_index_matched_basket_vs_imputed_full_catalog_divergence
          rationale: "That instance runs MATCHED_BASKET and IMPUTED_FULL_CATALOG over the same catalogue and asserts both index values, the median imputation and the differing weight denominators."

      - name: corner_repricing_clamp_order_is_not_commutative
        claim_type: correct_result
        grounds: [calculations.repricing_proposal]
        distinguishing_aspect: "Applying the band clamp before the floor clamp yields a different price from the reverse order, so the pinned order is observable."
        excluded_because:
          difficulty_instance: combinatorial_formula / repricing_band_clamp_then_floor_clamp_non_commutative
          rationale: "That instance pins band-then-floor at 27500 against the floor-then-band answer of 27498 on the scaffold's own worked fixture, with floor_binding and band_breach both true."

      - name: corner_index_double_rounding_order_per_product_then_average
        claim_type: precision
        grounds: [calculations.price_index.precision]
        distinguishing_aspect: "Rounding each product ratio before averaging gives a different index from averaging then rounding once."
        excluded_because:
          difficulty_instance: combinatorial_formula / price_index_round_per_product_then_average_order
          rationale: "That instance contrasts rounding each product ratio before the weighted average against averaging the unrounded ratios, and asserts the pinned result."

      - name: corner_beat_bonus_tier_boundary_and_keying
        claim_type: tiered_pricing_boundary
        grounds: [calculations.price_match_honored_price.constants.BEAT_BONUS_TIER2_MAX_CENTS, calculations.price_match_honored_price.constants.BEAT_BONUS_CAP_CENTS]
        distinguishing_aspect: "The bonus tier is keyed on claimed_price_cents and never re-derived from honored_price_cents, and the tier breakpoints are strict."
        excluded_because:
          difficulty_instance: combinatorial_formula / beat_bonus_tier_keyed_on_claimed_price_not_honored_price
          rationale: "That instance tests the strict tier breakpoints, the 500-cent bonus cap and the pinned keying on claimed_price_cents, including the no-fixed-point argument for keying on the honored price."

