  - id: ERR_THERMOSTAT_BELOW_MINIMUM
    http: 400
    condition: "a THERMOSTAT_SET step supplies thermostat_f below WINTERIZATION_MIN_THERMOSTAT_F (50) on the ALL_REQUIRED shortcut"
  - id: ERR_FORWARDING_ADDRESS_MISSING
    http: 400
    condition: "a mail hold is forwarded with forwarding_address null"
  - id: ERR_LANDFALL_ETA_IN_PAST
    http: 400
    condition: "a storm event is declared with landfall_eta_at at or before the logical clock"
  - id: ERR_PAGINATION_INVALID
    http: 400
    condition: "limit is outside [1, 100] or offset is negative"
  - id: ERR_CLOCK_REGRESSION
    http: 400
    condition: "POST /property-care/_clock/set_current_utc is called with an instant strictly before the current logical clock"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix (8 roles; segregation_of_duties role model)
# ---------------------------------------------------------------------------
roles:
  - name: PlatformAdmin
    description: "Platform operator. Owns configuration (service plans, checklist templates, the logical clock) and may act as a superset of AccountManager and Dispatcher on the operational surface, but is deliberately NOT permitted to approve a routine work order, accept or decline a vendor assignment, complete a visit, or drive the storm advisory ladder."
    identity: "opaque"
    exclusive_operations:
      - "POST /property-care/_clock/set_current_utc"
      - "POST /property-care/service-plans"
      - "POST /property-care/service-plans/{id}/retire"
    shared_operations:
      - "owner, property, subscription, billing-cycle, invoice, vendor, key, winterization, turnover, mail-hold and incident administration shared with AccountManager and Dispatcher"
      - "POST /property-care/work-orders/{id}/approve and /reject shared with Owner and StormCoordinator as an override"

  - name: Owner
    description: "Homeowner client. Approves routine work orders against a per-owner ceiling, declares away periods, requests visits, drives the OWNER_IN_RESIDENCE occupancy branch and disputes invoices. Cannot dispatch, cannot touch vendors or keys, and has no authority at all on the storm pipeline."
    identity: "entity_backed:Owner"
    exclusive_operations:
      - "POST /property-care/invoices/{id}/dispute"
    shared_operations:
      - "POST /property-care/work-orders/{id}/approve and /reject on the ROUTINE pipeline only"
      - "POST /property-care/properties/{id}/occupancy-transitions"
      - "POST /property-care/away-periods and PATCH /property-care/away-periods/{id}/cadence"
      - "POST /property-care/visits, POST /property-care/findings/{id}/dismiss, mail-hold extension and release, invoice payment, and every read scoped to the owner's own properties"

  - name: AccountManager
    description: "Commercial operator. Owns subscriptions, billing cycles, invoices and the delinquency ladder. Cannot approve a work order, cannot dispatch a vendor and cannot perform a visit."
    identity: "opaque"
    exclusive_operations:
      - "POST /property-care/subscriptions/{id}/activate"
      - "POST /property-care/subscriptions/{id}/pause"
      - "POST /property-care/subscriptions/{id}/resume"
      - "POST /property-care/subscriptions/{id}/tier-changes"
      - "POST /property-care/subscriptions/{id}/cancel"
      - "POST /property-care/subscriptions/{id}/mark-delinquent"
      - "POST /property-care/subscriptions/{id}/clear-delinquency"
      - "POST /property-care/billing-cycles/{id}/close"
      - "POST /property-care/invoices/{id}/issue"
      - "POST /property-care/invoices/{id}/resolve-dispute"
      - "POST /property-care/invoices/{id}/void"
      - "POST /property-care/work-orders/{id}/invoice"
    shared_operations:
      - "owner, property, away-period, visit scheduling, deferral, rescheduling, mail-hold, invoice line and incident reclassification operations shared with Dispatcher and PlatformAdmin"

  - name: Dispatcher
    description: "Field operations coordinator. Owns the seasonal axis, vendor onboarding and eligibility, work-order creation and dispatch, key custody and access grants, findings triage and incident handling. Cannot approve a work order it created and cannot perform the visit itself."
    identity: "opaque"
    exclusive_operations:
      - "POST /property-care/properties/{id}/seasonal-transitions"
      - "POST /property-care/vendors/{id}/suspend"
      - "POST /property-care/vendors/{id}/reinstate"
      - "POST /property-care/vendors/{id}/refresh-eligibility"
      - "POST /property-care/work-orders/{id}/dispatch"
      - "POST /property-care/key-assets/{id}/rotate-code"
      - "POST /property-care/key-assets/{id}/issuances"
      - "POST /property-care/key-issuances/{id}/return"
      - "POST /property-care/key-issuances/{id}/mark-overdue"
      - "POST /property-care/key-issuances/{id}/declare-lost"
      - "POST /property-care/key-assets/{id}/access-grants"
      - "POST /property-care/access-grants/{id}/activate"
      - "POST /property-care/access-grants/{id}/revoke"
      - "POST /property-care/vendor-assignments/{id}/withdraw"
      - "POST /property-care/findings/{id}/triage"
      - "POST /property-care/findings/{id}/monitor"
      - "POST /property-care/visits/{id}/convert-to-turnover"
    shared_operations:
      - "POST /property-care/findings/{id}/work-orders shared with StormCoordinator"
      - "visit scheduling, deferral, rescheduling and abort shared with AccountManager"
      - "winterization steps, turnover advance and fail-inspection, mail-hold package logging shared with FieldTech"

  - name: FieldTech
    description: "Technician who physically performs visits. Owns visit execution and checklist submission, winterization steps, turnover inspection outcomes, package logging and the post-storm damage assessment. Cannot create a work order, cannot dispatch and cannot touch billing."
    identity: "opaque"
    exclusive_operations:
      - "POST /property-care/visits/{id}/arrive"
      - "POST /property-care/visits/{id}/complete"
    shared_operations:
      - "POST /property-care/visits/{id}/depart shared with Dispatcher"
      - "POST /property-care/visits/{id}/findings shared with Dispatcher"
      - "POST /property-care/winterization-records/{id}/steps shared with Dispatcher"
      - "POST /property-care/rental-turnovers/{id}/fail-inspection and /advance shared with Dispatcher"
      - "POST /property-care/mail-holds/{id}/log-packages shared with Dispatcher"
      - "POST /property-care/storm-responses/{id}/assessments shared with StormCoordinator, subject to the segregation-of-duties rung"

  - name: Vendor
    description: "External contractor. Accepts or declines offers, starts and finishes on-site work and records work-order actuals. Every action is scoped to assignments whose vendor_id equals X-User-ID."
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /property-care/vendor-assignments/{id}/accept"
      - "POST /property-care/vendor-assignments/{id}/decline"
      - "POST /property-care/vendor-assignments/{id}/start-work"
      - "POST /property-care/vendor-assignments/{id}/finish-work"
    shared_operations:
      - "POST /property-care/work-orders/{id}/complete shared with Dispatcher"
      - "read access to its own assignments, the bound work orders, the target properties and its own key issuances and access grants"

  - name: StormCoordinator
    description: "Emergency operations lead. Owns the storm advisory ladder, storm responses, sweep scheduling and the emergency approval ceiling. Approves STORM-pipeline work orders that the Owner is never asked about, and cannot approve a ROUTINE work order."
    identity: "opaque"
    exclusive_operations:
      - "POST /property-care/storm-events"
      - "POST /property-care/storm-events/{id}/advisory"
      - "POST /property-care/storm-events/{id}/landfall"
      - "POST /property-care/storm-events/{id}/all-clear"
      - "POST /property-care/storm-events/{id}/close"
      - "POST /property-care/storm-responses/{id}/close"
    shared_operations:
      - "POST /property-care/storm-events/{id}/responses and /schedule-sweep shared with Dispatcher"
      - "POST /property-care/work-orders/{id}/approve and /reject on the STORM pipeline only"
      - "POST /property-care/findings/{id}/work-orders, /submit and /dispatch shared with Dispatcher"
      - "POST /property-care/storm-responses/{id}/assessments shared with FieldTech"
      - "POST /property-care/security-incidents/{id}/escalate shared with Dispatcher"

  - name: Auditor
    description: "Read-only compliance observer. Holds GET access to every collection and every single-resource read in the system and holds no write permission anywhere; every POST, PATCH and DELETE returns ERR_ROLE_NOT_PERMITTED."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "every GET endpoint declared in section 1.5 except GET /property-care/_clock, which is shared with the operational roles"
