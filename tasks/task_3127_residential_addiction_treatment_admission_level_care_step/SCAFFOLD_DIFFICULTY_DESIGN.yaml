- rule_id: combinatorial_formula
  instances:
  - name: compliance_risk_aged_tiered_deduction
    grounds:
    - calculations.tiered_compliance_risk_deduction
    - entities.Facility.fields.compliance_risk_points
    - entities.Facility.fields.facility_posture
    - endpoints.POST_/treatment-network/facilities/{id}/facility-ops/run
    distinguishing_aspect: compliance_risk_points combines three non-linear inputs — a capped aged component
      with a nested min over a max, a missing-class count and a stale-expiry count — then multiplies the
      whole raw sum once by a tier multiplier selected from that raw sum, so one stale ACCREDITATION_BODY
      plus the absent RECOVERY_HOUSE class compose to raw 15, land in the MODERATE tier at multiplier
      1.0 and produce exactly 45, one point above the RESTRICTED cut but 15 below the FROZEN cut.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z.
      - A MN facility holding a GRANTED STATE_LICENSE (expires 2027-01-01) and a GRANTED ACCREDITATION_BODY
        whose expires_at is 2026-08-01T00:00:00Z, i.e. 31 days stale at the epoch.
      - The facility holds no RECOVERY_HOUSE accreditation and no beds, clinicians or episodes.
      setup_api_calls:
      - call: POST /treatment-network/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /treatment-network/facilities
        payload:
          name: Cascade Ridge Recovery Center
          state_code: MN
        as: PlatformAdmin
        captures:
          mew_fac: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/accreditations
        payload:
          accreditation_class: ACCREDITATION_BODY
          granting_body: CARF
          effective_at: '2026-01-01T00:00:00Z'
          expires_at: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
        captures:
          mew_acc_body: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/accreditations
        payload:
          accreditation_class: STATE_LICENSE
          granting_body: MN-DHS
          effective_at: '2026-01-01T00:00:00Z'
          expires_at: '2027-01-01T00:00:00Z'
          license_level_max: ASAM_3_5
          credential_tier_min: TIER_3_LICENSED
        as: PlatformAdmin
        captures:
          mew_acc_lic: $.data.id
      trigger:
      - call: POST /treatment-network/facilities/${mew_fac}/facility-ops/run
        payload: {}
        as: PlatformAdmin
      assert:
      - Facility.${mew_fac}.compliance_risk_points == 45
      - Facility.${mew_fac}.facility_posture == RESTRICTED
      - Facility.${mew_fac}.licensed == true
      - Facility.${mew_fac}.is_accepting_admissions == false
      - Facility.${mew_fac}.as_level_max == ASAM_3_5
      - Facility.${mew_fac}.ops_epoch == 1 and last_ops_run_at == 2026-09-01T00:00:00Z
      - Accreditation.${mew_acc_body}.status == EXPIRED
  - name: clearance_window_nested_rounding_order
    grounds:
    - calculations.medical_clearance_window_remaining
    - calculations.medical_clearance_window_remaining.variants
    - entities.MedicalClearance.fields.window_hours_remaining
    - entities.MedicalClearance.fields.window_days_remaining
    - entities.MedicalClearance.fields.effective_status
    distinguishing_aspect: 'The clearance window is rounded in a pinned order — round the exact hour delta
      to a whole hour FIRST and only then divide by 24 and round again — and the pinned order is directly
      observable: the exact hour delta 1.0 yields window_hours_remaining 1 with window_days_remaining
      0, whereas the rejected opposite order would yield window_hours_remaining 1 with window_days_remaining
      1, so the two orders disagree on the days field for half of all possible offsets.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z on a licensed MN facility with two beds and an APPROVED
        14-day ASAM_3_5 authorization.
      - Episode A's TB_SCREEN clearance was cleared at 2026-08-25T00:00:00Z, so its window closes exactly
        one hour before the logical now.
      - A further cleared TB_SCREEN on a second episode was cleared at 2026-08-25T01:00:00Z, one hour
        before the first, giving an exact hour delta of 1.0.
      setup_api_calls:
      - call: POST /treatment-network/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /treatment-network/facilities
        payload:
          name: Cascade Ridge Recovery Center
          state_code: MN
        as: PlatformAdmin
        captures:
          mew_fac: $.data.id
      - call: POST /treatment-network/clinicians
        payload:
          full_name: Dr. Astrid Lindqvist
          credential_tier: TIER_4_INDEPENDENT
          is_medical_provider: true
        as: PlatformAdmin
        captures:
          mew_clin_A: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/beds
        payload:
          unit_name: North Wing
          bed_label: MN-B-01
          level_of_care: ASAM_3_5
          cleaning_turnaround_hours: 24
        as: PlatformAdmin
        captures:
          mew_bed_35: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/beds
        payload:
          unit_name: North Wing
          bed_label: MN-B-02
          level_of_care: ASAM_3_1
          cleaning_turnaround_hours: 48
        as: PlatformAdmin
        captures:
          mew_bed_31: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/beds
        payload:
          unit_name: North Wing
          bed_label: MN-B-03
          level_of_care: ASAM_2_1
          cleaning_turnaround_hours: 0
        as: PlatformAdmin
        captures:
          mew_bed_21: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/service-offerings
        payload:
          service_code: RES_GROUP
          level_of_care: ASAM_3_5
          required_min_credential_tier: TIER_3_LICENSED
          requires_medical_provider: false
