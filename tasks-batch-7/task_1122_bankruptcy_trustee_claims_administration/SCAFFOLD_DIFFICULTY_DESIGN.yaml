              as_user_id: "trust-0001"
              captures: { a2: $.data.id }
            - call: "POST /trustee/assets/${a2}/investigate"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/assets/${a2}/mark_for_sale"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${case_id}/sales"
              payload: { asset_id: "${a2}", buyer_name: "B2", hammer_price_cents: 409999, sale_costs_cents: 410000 }
