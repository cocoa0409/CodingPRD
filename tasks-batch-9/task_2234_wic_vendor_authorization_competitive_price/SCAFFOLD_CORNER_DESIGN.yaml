              as: VendorUnitSupervisor
              captures: { item_milk: $.data.id }
            - call: "POST /authorized-food-items"
              payload: { food_category_id: "${cat_milk}", upc: "00077788899", brand: "Valley Juice", container_size_oz: 64, contract_brand: false, required_for_authorization: false }
              as: VendorUnitSupervisor
              captures: { item_juice: $.data.id }
            - call: "POST /authorized-food-items"
              payload: { food_category_id: "${cat_milk}", upc: "00055566677", brand: "Prairie Cereal", container_size_oz: 18, contract_brand: false, required_for_authorization: false }
              as: VendorUnitSupervisor
              captures: { item_cereal: $.data.id }
            - call: "POST /price-cycles"
              payload: { cycle_code: "2026Q3", submission_open_at: "2026-08-01T00:00:00Z", submission_due_at: "2026-09-01T00:00:00Z" }
              as: VendorUnitSupervisor
              captures: { cycle_q3: $.data.id }
            - call: "POST /vendors"
              payload: { store_name: "Alpha Market", store_type: "SUPERMARKET", reported_monthly_redemption_cents: 6000000 }
              as: VendorUnitAnalyst
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-31T23:59:59.999Z" }
              as: SystemOperator
            - call: "POST /price-submissions"
              payload: { vendor_id: "${v1}", food_item_id: "${item_milk}", price_cycle_id: "${cycle_q3}", shelf_price_cents: 320 }
              as: VendorOperator
              as_user_id: "${v1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /price-submissions"
              payload: { vendor_id: "${v1}", food_item_id: "${item_milk}", price_cycle_id: "${cycle_q3}", shelf_price_cents: 320 }
              as: VendorOperator
              as_user_id: "${v1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T23:59:59.999Z" }
              as: SystemOperator
            - call: "POST /price-submissions"
              payload: { vendor_id: "${v1}", food_item_id: "${item_juice}", price_cycle_id: "${cycle_q3}", shelf_price_cents: 118 }
              as: VendorOperator
              as_user_id: "${v1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /price-submissions"
              payload: { vendor_id: "${v1}", food_item_id: "${item_cereal}", price_cycle_id: "${cycle_q3}", shelf_price_cents: 250 }
              as: VendorOperator
              as_user_id: "${v1}"
          assert:
            - "At 2026-07-31T23:59:59.999Z: HTTP 409 with error.id == ERR_SUBMISSION_WINDOW_CLOSED — one millisecond before the inclusive open instant"
            - "At 2026-08-01T00:00:00Z: HTTP 201 — submission_open_at itself is inside the window"
            - "At 2026-08-31T23:59:59.999Z: HTTP 201 — the last representable instant before submission_due_at is still inside"
            - "At 2026-09-01T00:00:00Z: HTTP 409 with error.id == ERR_SUBMISSION_WINDOW_CLOSED — submission_due_at is exclusive, and the cycle status is still OPEN, so status is not what rejected the call"
            - "GET /price-submissions?vendor_id=${v1}&price_cycle_id=${cycle_q3} reports meta.total_count == 2"

      - name: paid_claim_beats_recoupment_ceiling_in_priority_order
        claim_type: priority_ordering
        grounds:
          - "validations[priority 18]"
          - "validations[priority 41]"
          - "errors.ERR_CLAIM_ALREADY_PAID"
        excluded_because:
          difficulty_instance: paid_claim_state_beats_recoupment_fiscal_on_adjustment_create
          rationale: |
            The guide's `Priority Ordering` and `Priority conflict` rows ask that two
            simultaneously violated rules resolve to the lower priority number. The §1.8
            instance violates rule 18 (ERR_CLAIM_ALREADY_PAID) and rule 41
            (ERR_RECOUPMENT_EXCEEDS_PAYABLE) in one request and pins rule 18 as the
            answer, which is the same claim with a much larger priority gap than any
            adjacent pair a smoke test would pick.

      - name: training_currency_gates_authorization_across_entities
        claim_type: cross_entity_validation
        grounds:
          - "validations[priority 21]"
          - "validations[priority 35]"
          - "errors.ERR_VENDOR_TRAINING_EXPIRED"
        excluded_because:
          difficulty_instance: training_safety_beats_peer_group_referential_on_authorize
          rationale: |
            The guide's `Cross-entity validation` row asks that a rule whose validity
            depends on another entity's state be tested both ways. The §1.8 instance
            drives POST /vendors/{id}/authorize with an expired training record and a
            RETIRED peer group at once, showing the business_safety rule at priority 21
            beats the business_referential rule at priority 35, and then repairs each
            condition in turn.

      - name: cycle_window_overlap_detection
        claim_type: temporal_conflict_detection
        grounds:
          - "validations[priority 13]"
          - "errors.ERR_CYCLE_WINDOW_OVERLAP"
          - "entities.PriceCycle.fields.submission_due_at"
        excluded_because:
          difficulty_instance: price_cycle_window_allows_touching_boundary_but_rejects_overlap
          rationale: |
            The guide's `Temporal validation` row asks that an operation valid in
            isolation but conflicting with an existing interval be detected. The §1.8
            instance covers rule 13 at its exact seam — a new window starting precisely
            at an existing submission_due_at is allowed, one millisecond earlier is
            ERR_CYCLE_WINDOW_OVERLAP — which is the strongest form of that claim.

