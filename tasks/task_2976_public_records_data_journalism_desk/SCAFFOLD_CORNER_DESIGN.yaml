      - name: review_assignment_junction_links_reviewers_and_findings_both_ways
        claim_type: graph
        grounds:
          - entities.ReviewAssignment
          - endpoints[GET /records-desk/review-assignments]
          - complexity_profile.entity_topology
          - entities.ExpertReviewer.fields.active_assignment_count
        distinguishing_aspect: |
          ReviewAssignment is a true many-to-many junction, not a 1:1 link: one reviewer must be able to
          hold assignments on two findings AND one finding must be able to carry assignments from two
          reviewers, with both directions independently listable by foreign key. The per-reviewer
          active_assignment_count must partition by reviewer (2 and 1), not count the junction rows
          globally (3).
        test_recipe:
          setup:
            - "One Desk, one Investigation with one AnalysisRun and two Findings f1 and f2."
            - "Two ExpertReviewers rev1 (max_concurrent_assignments 2) and rev2 (default 2), neither conflicted."
          setup_api_calls:
