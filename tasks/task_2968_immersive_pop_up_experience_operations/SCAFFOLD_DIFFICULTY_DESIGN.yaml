  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_creation_blocked_by_the_guests_no_show_restriction
        grounds:
          - state_machines.GuestAccount.ACTIVE_to_RESTRICTED
          - validations[priority 80].ERR_GUEST_RESTRICTED
          - calculations.guest_attendance_posture
          - endpoints[POST /ticket-orders]
          - endpoints[POST /guest-accounts/{guestId}/reinstate]
        distinguishing_aspect: |
          Entity pair TicketOrder -> GuestAccount. The blocking state is not set by any call against the
          order's own aggregate: it accumulates on the guest through a rate threshold, where the third
          no-show — and only the third — flips the account ACTIVE -> RESTRICTED. From that instant a
          brand-new order on a completely different slot is refused with ERR_GUEST_RESTRICTED even though
          the slot has 40 free seats and the run is OPEN and CLEARED, and the refusal disappears the
          moment the guest is reinstated, without anything about the slot or the run changing.
        test_recipe:
          setup:
            - "The standard clearance chain: an OPEN, CLEARED NYC run with one themed room."
            - "Slot 1 RELEASED for 2026-09-05T14:00:00Z..14:45:00Z with 40 seats; slot 2 RELEASED for 2026-09-12T14:00:00Z..14:45:00Z with 40 seats (non-overlapping, so the aggregate load rule is not engaged)."
            - "One VISITOR guest holding three CONFIRMED SINGLE orders of party_size 1 on slot 1, each priced at 32250 cents (lead_days 35)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOpsManager
