          trigger:
            - { call: "POST /rescue-ops/home-checks", payload: { application_id: "${app}", scheduled_date: "2026-08-16T10:00:00Z" }, as: AdoptionOfficer, as_user_id: "officer-1", captures: { hc1: $.data.id } }
