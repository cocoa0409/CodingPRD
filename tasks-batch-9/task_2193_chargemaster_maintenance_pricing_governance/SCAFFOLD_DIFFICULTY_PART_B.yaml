# =============================================================================
# §1.8 Scaffold Difficulty Design — FRAGMENT B
# Rules owned by this fragment:
#   Rule 3 — non_linear_state_machine
#   Rule 4 — transitive_cascade
#   Rule 7 — cross_entity_state_dependency
# =============================================================================
scaffold_difficulty_design:

  - rule_id: non_linear_state_machine
    instances:

      - name: non_linear_state_machine__charge_item_parallel_dimensions_double_revision_loop
        grounds:
          - state_machines.ChargeItem.DRAFT_to_PENDING_REVIEW
          - state_machines.ChargeItem.PENDING_REVIEW_to_DRAFT
          - state_machines.ChargeItem.PENDING_REVIEW_to_APPROVED
          - state_machines.ChargeItem.PRICE_STALE_to_PRICED_CURRENT
          - entities.ChargeItem.fields.lifecycle_status
          - entities.ChargeItem.fields.price_status
          - calculations.gross_charge_from_price_rule
          - calculations.markup_compliance_ratio
          - errors.ERR_ITEM_PRICE_NOT_CURRENT
        distinguishing_aspect: |
          On the ChargeItem entity the two status dimensions are genuinely parallel: the lifecycle
          dimension traverses the cycle DRAFT -> PENDING_REVIEW -> DRAFT -> PENDING_REVIEW while the
          price dimension advances PRICE_STALE -> PRICED_CURRENT in the middle of that cycle without
          the lifecycle value changing, and the final PENDING_REVIEW -> APPROVED hop is admissible
          only because the *other* dimension reached PRICED_CURRENT.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-09-01T00:00:00Z."
            - "Facility 'Northgate General' with rounding_mode NEAREST_CENT and aggregate_markup_limit_bp 40000; posture OPEN."
            - "RevenueCode 0300 (PROCEDURE, requires_hcpcs false, allows CPT) and an unrestricted Clinical Lab department."
            - "One ACTIVE COST_PLUS_MARKUP PriceRule on (facility, 0300) with the default three markup tiers, effective from 2026-01-01."
            - "One ChargeItem CDM-40001, cost_basis 60000c, medicare_rate 18000c, market_p75 200000c, lifecycle DRAFT, price_status PRICE_STALE, version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Northgate General", cms_certification_number: "CCN-2193-A", rounding_mode: "NEAREST_CENT", aggregate_markup_limit_bp: 40000, duplicate_detection_mode: "STRICT_CODE" }
              as: SystemAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory - general", requires_hcpcs: false, allowed_code_types: ["CPT", "HCPCS", "REV_ONLY", "CDM_INTERNAL"], pricing_class: "PROCEDURE", status: "ACTIVE" }
              as: SystemAdmin
              captures: { rc_lab_id: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac_id}", name: "Clinical Lab", cost_center_code: "CC-7100", manager_user_id: "mgr_lab_01", allowed_revenue_code_values: [] }
              as: SystemAdmin
              captures: { dept_lab_id: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac_id}", revenue_code_id: "${rc_lab_id}", pricing_method: "COST_PLUS_MARKUP", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 32000 }, { min_cost_basis_cents: 50000, markup_bp: 24000 }, { min_cost_basis_cents: 250000, markup_bp: 18000 }], min_medicare_multiple_bp: 12000, market_cap_multiple_bp: 11000, effective_from: "2026-01-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { pr_lab_id: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac_id}", department_id: "${dept_lab_id}", revenue_code_id: "${rc_lab_id}", cdm_number: "CDM-40001", description: "Comprehensive metabolic panel", code_type: "CPT", code_value: "80053", cost_basis_cents: 60000, medicare_rate_cents: 18000, market_p75_cents: 200000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /chargemaster/charge-items/${item_id}/lifecycle"
              payload: { action: "SUBMIT_FOR_REVIEW", note: "first submission" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_01"
            - call: "POST /chargemaster/charge-items/${item_id}/lifecycle"
              payload: { action: "RETURN_TO_DRAFT", note: "cost basis needs a second look" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_01"
              captures: { lifecycle_after_bounce: $.data.lifecycle_status, price_after_bounce: $.data.price_status }
            - call: "POST /chargemaster/charge-items/${item_id}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_01"
              captures: { lifecycle_after_reprice: $.data.lifecycle_status }
            - call: "POST /chargemaster/charge-items/${item_id}/lifecycle"
              payload: { action: "SUBMIT_FOR_REVIEW", note: "second submission after reprice" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_01"
            - call: "POST /chargemaster/charge-items/${item_id}/lifecycle"
              payload: { action: "APPROVE", note: "committee approval" }
              as: PricingCommitteeApprover
              as_user_id: "pca_01"
              captures: { item_version_final: $.data.version }
          assert:
            - "${price_after_bounce} == PRICE_STALE"
            - "${lifecycle_after_bounce} == DRAFT"
            - "${lifecycle_after_reprice} == DRAFT"
            - "ChargeItem.${item_id}.lifecycle_status == APPROVED"
            - "ChargeItem.${item_id}.price_status == PRICED_CURRENT"
            - "ChargeItem.${item_id}.gross_charge_cents == 144000"
            - "ChargeItem.${item_id}.prior_gross_charge_cents == 0"
            - "ChargeItem.${item_id}.price_conflict == false"
            - "ChargeItem.${item_id}.applied_price_rule_id == ${pr_lab_id}"
            - "ChargeItem.${item_id}.version == 6"
            - "${item_version_final} == 6"
            - "Facility.${fac_id}.active_item_count == 0"
            - "Facility.${fac_id}.aggregate_gross_charge_cents == 0"
            - "Facility.${fac_id}.stale_price_item_count == 0"
            - "Facility.${fac_id}.chargemaster_posture == OPEN"

      - name: non_linear_state_machine__change_request_two_round_revision_cycle_then_reject_branch
        grounds:
          - state_machines.ChangeRequest.SUBMITTED_to_UNDER_REVIEW
          - state_machines.ChangeRequest.UNDER_REVIEW_to_CHANGES_REQUESTED
          - state_machines.ChangeRequest.CHANGES_REQUESTED_to_SUBMITTED
          - state_machines.ChangeRequest.UNDER_REVIEW_to_REJECTED
          - entities.ChangeRequest.fields.revision_round
          - entities.ChangeRequest.fields.reviewed_by_user_id
          - calculations.gross_charge_from_price_rule
          - calculations.markup_compliance_ratio
          - validations[priority=40]
        distinguishing_aspect: |
          The non-linear machine here is on ChangeRequest — a different entity from the ChargeItem
          instance above — and its non-linearity is a true revision cycle
          UNDER_REVIEW -> CHANGES_REQUESTED -> SUBMITTED -> UNDER_REVIEW traversed twice with
          reviewed_by_user_id cleared on each re-entry, followed by the REJECTED branch of the
          UNDER_REVIEW fork whose side-effect set differs from the APPROVED branch (no
          approved_by_user_id, no ChargeItem mutation).
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-09-01T00:00:00Z."
            - "Facility with rounding_mode NEAREST_CENT and aggregate_markup_limit_bp 40000; posture OPEN."
            - "RevenueCode 0300, unrestricted Clinical Lab department managed by mgr_lab_01."
            - "One ACTIVE COST_PLUS_MARKUP PriceRule with the default three tiers."
            - "ChargeItem CDM-40001 (cost_basis 60000c) repriced once, so lifecycle_status DRAFT / price_status PRICED_CURRENT / gross_charge_cents 144000 / version 2."
            - "One PRICE_CHANGE ChangeRequest submitted by mgr_lab_01 proposing cost_basis 70000c, revision_round 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Northgate General", cms_certification_number: "CCN-2193-B", rounding_mode: "NEAREST_CENT", aggregate_markup_limit_bp: 40000 }
              as: SystemAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory - general", requires_hcpcs: false, allowed_code_types: ["CPT", "HCPCS", "REV_ONLY", "CDM_INTERNAL"], pricing_class: "PROCEDURE", status: "ACTIVE" }
              as: SystemAdmin
              captures: { rc_lab_id: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac_id}", name: "Clinical Lab", cost_center_code: "CC-7100", manager_user_id: "mgr_lab_01", allowed_revenue_code_values: [] }
              as: SystemAdmin
              captures: { dept_lab_id: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac_id}", revenue_code_id: "${rc_lab_id}", pricing_method: "COST_PLUS_MARKUP", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 32000 }, { min_cost_basis_cents: 50000, markup_bp: 24000 }, { min_cost_basis_cents: 250000, markup_bp: 18000 }], min_medicare_multiple_bp: 12000, market_cap_multiple_bp: 11000, effective_from: "2026-01-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { pr_lab_id: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac_id}", department_id: "${dept_lab_id}", revenue_code_id: "${rc_lab_id}", cdm_number: "CDM-40001", description: "Comprehensive metabolic panel", code_type: "CPT", code_value: "80053", cost_basis_cents: 60000, medicare_rate_cents: 18000, market_p75_cents: 200000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { item_id: $.data.id }
            - call: "POST /chargemaster/charge-items/${item_id}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_01"
            - call: "POST /chargemaster/change-requests"
              payload: { department_id: "${dept_lab_id}", charge_item_id: "${item_id}", request_type: "PRICE_CHANGE", justification: "Reagent vendor cost increase effective Q4 2026", proposed_cost_basis_cents: 70000 }
              as: DepartmentManager
              as_user_id: "mgr_lab_01"
              captures: { cr_id: $.data.id, cr_projected_r0: $.data.projected_gross_charge_cents }
          trigger:
            - call: "POST /chargemaster/change-requests/${cr_id}/decisions"
              payload: { decision: "REVIEW", decision_note: "round 1 review opened" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_01"
              captures: { reviewer_round1: $.data.reviewed_by_user_id }
            - call: "POST /chargemaster/change-requests/${cr_id}/decisions"
              payload: { decision: "REQUEST_CHANGES", decision_note: "supply cost documentation is incomplete" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_01"
            - call: "POST /chargemaster/change-requests/${cr_id}/resubmit"
              payload: { justification: "Attached vendor invoice; revised cost basis to 90000 cents", proposed_cost_basis_cents: 90000 }
              as: DepartmentManager
              as_user_id: "mgr_lab_01"
              captures: { round1_round: $.data.revision_round, reviewer_cleared_1: $.data.reviewed_by_user_id, projected_r1: $.data.projected_gross_charge_cents }
            - call: "POST /chargemaster/change-requests/${cr_id}/decisions"
              payload: { decision: "REVIEW", decision_note: "round 2 review opened by a second analyst" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_02"
              captures: { reviewer_round2: $.data.reviewed_by_user_id }
            - call: "POST /chargemaster/change-requests/${cr_id}/decisions"
              payload: { decision: "REQUEST_CHANGES", decision_note: "cost basis still unsupported at this magnitude" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_02"
            - call: "POST /chargemaster/change-requests/${cr_id}/resubmit"
              payload: { justification: "Final revision: fully loaded cost basis is 260000 cents per assay", proposed_cost_basis_cents: 260000 }
              as: DepartmentManager
              as_user_id: "mgr_lab_01"
              captures: { round2_round: $.data.revision_round, projected_r2: $.data.projected_gross_charge_cents, projected_ratio_r2: $.data.projected_markup_ratio_bp }
            - call: "POST /chargemaster/change-requests/${cr_id}/decisions"
              payload: { decision: "REVIEW", decision_note: "round 3 review re-opened by the original analyst" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_01"
            - call: "POST /chargemaster/change-requests/${cr_id}/decisions"
              payload: { decision: "REJECT", decision_note: "markup not defensible at the proposed cost basis" }
              as: PricingCommitteeApprover
              as_user_id: "pca_01"
              captures: { cr_version_final: $.data.version }
          assert:
            - "${cr_projected_r0} == 168000"
            - "${reviewer_round1} == ria_01"
            - "${round1_round} == 1"
            - "${reviewer_cleared_1} == null"
            - "${projected_r1} == 216000"
            - "${reviewer_round2} == ria_02"
            - "${round2_round} == 2"
            - "${projected_r2} == 220000"
            - "${projected_ratio_r2} == 8462"
            - "ChangeRequest.${cr_id}.status == REJECTED"
            - "ChangeRequest.${cr_id}.revision_round == 2"
            - "ChangeRequest.${cr_id}.reviewed_by_user_id == ria_01"
            - "ChangeRequest.${cr_id}.approved_by_user_id == null"
            - "ChangeRequest.${cr_id}.projected_gross_charge_cents == 220000"
            - "ChangeRequest.${cr_id}.projected_markup_ratio_bp == 8462"
            - "ChangeRequest.${cr_id}.version == 9"
            - "${cr_version_final} == 9"
            - "ChargeItem.${item_id}.price_status == PRICED_CURRENT"
            - "ChargeItem.${item_id}.cost_basis_cents == 60000"
            - "ChargeItem.${item_id}.gross_charge_cents == 144000"
            - "ChargeItem.${item_id}.version == 2"
            - "Department.${dept_lab_id}.open_request_count == 0"

  - rule_id: transitive_cascade
    instances:

      - name: transitive_cascade__implement_item_supersedes_file_clears_facility_voids_sibling_request
        grounds:
          - state_machines.ChangeRequest.APPROVED_to_IMPLEMENTED
          - state_machines.ChangeRequest.APPROVED_to_VOIDED_STALE
          - state_machines.TransparencyFile.PUBLISHED_to_SUPERSEDED
          - state_machines.ChargeItem.PRICED_CURRENT_to_REPRICE_PENDING
          - state_machines.ChargeItem.REPRICE_PENDING_to_PRICED_CURRENT
          - state_machines.Facility.chargemaster_posture
          - entities.ChangeRequest.fields.pinned_charge_item_version
          - entities.Facility.fields.published_transparency_file_id
          - entities.Department.fields.open_request_count
          - calculations.gross_charge_from_price_rule
          - concurrency_rules[change-request-approve-stale-item]
          - concurrency_rules[transparency-build-stale-facility]
        distinguishing_aspect: |
          The triggering transition is ChangeRequest APPROVED -> IMPLEMENTED, and every hop is caused
          by the previous hop, not by the trigger: implement mutates the ChargeItem (hop 1); the
          ChargeItem mutation is what forces the PUBLISHED TransparencyFile to SUPERSEDED (hop 2);
          the file's supersession is what clears Facility.published_transparency_file_id and flips
          transparency_status to NEEDS_REFRESH (hop 3); and the item's advanced version is what voids
          the sibling APPROVED ChangeRequest into VOIDED_STALE, which is what recomputes
          Department.open_request_count (hop 4) — depth 4 across five entities.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-09-01T00:00:00Z."
            - "Facility with rounding_mode NEAREST_CENT and aggregate_markup_limit_bp 40000."
            - "RevenueCode 0300, Clinical Lab department managed by mgr_lab_01, one ACTIVE COST_PLUS_MARKUP PriceRule with the default three tiers."
            - "ChargeItem CDM-40001 (cost_basis 60000c, medicare 18000c, market_p75 200000c) driven all the way to lifecycle ACTIVE with gross_charge_cents 144000."
            - "One ACTIVE PayerContract so the transparency build has payer_column_count == 1 and validates cleanly."
            - "TransparencyFile built, VALIDATED (which froze the item) and PUBLISHED (which thawed it) — Facility.transparency_status CURRENT, posture OPEN."
            - "Two ChangeRequests on the SAME item, both UNDER_REVIEW then APPROVED: CR-A is a PRICE_CHANGE to cost_basis 70000c (its approval bumped the item to version 8 and pinned 8), CR-B is a DEACTIVATION approved afterwards and also pinned at 8."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Northgate General", cms_certification_number: "CCN-2193-C", rounding_mode: "NEAREST_CENT", aggregate_markup_limit_bp: 40000 }
              as: SystemAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory - general", requires_hcpcs: false, allowed_code_types: ["CPT", "HCPCS", "REV_ONLY", "CDM_INTERNAL"], pricing_class: "PROCEDURE", status: "ACTIVE" }
              as: SystemAdmin
              captures: { rc_lab_id: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac_id}", name: "Clinical Lab", cost_center_code: "CC-7100", manager_user_id: "mgr_lab_01", allowed_revenue_code_values: [] }
              as: SystemAdmin
              captures: { dept_lab_id: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac_id}", revenue_code_id: "${rc_lab_id}", pricing_method: "COST_PLUS_MARKUP", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 32000 }, { min_cost_basis_cents: 50000, markup_bp: 24000 }, { min_cost_basis_cents: 250000, markup_bp: 18000 }], min_medicare_multiple_bp: 12000, market_cap_multiple_bp: 11000, effective_from: "2026-01-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { pr_lab_id: $.data.id }
            - call: "POST /chargemaster/payer-contracts"
              payload: { facility_id: "${fac_id}", payer_code: "BCBS_STATE", product_line: "COMMERCIAL", reimbursement_method: "PERCENT_OF_CHARGE", percent_of_charge_bp: 4500, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", trailing_units: 100, renegotiation_notice_days: 30 }
              as: ContractManager
              captures: { pc_id: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac_id}", department_id: "${dept_lab_id}", revenue_code_id: "${rc_lab_id}", cdm_number: "CDM-40001", description: "Comprehensive metabolic panel", code_type: "CPT", code_value: "80053", cost_basis_cents: 60000, medicare_rate_cents: 18000, market_p75_cents: 200000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { item_id: $.data.id }
            - call: "POST /chargemaster/charge-items/${item_id}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_01"
            - call: "POST /chargemaster/charge-items/${item_id}/lifecycle"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_01"
            - call: "POST /chargemaster/charge-items/${item_id}/lifecycle"
              payload: { action: "APPROVE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_01"
            - call: "POST /chargemaster/charge-items/${item_id}/lifecycle"
              payload: { action: "ACTIVATE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_01"
            - call: "GET /chargemaster/facilities/${fac_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { fac_v_before_build: $.data.version }
            - call: "POST /chargemaster/transparency-files"
              payload: { facility_id: "${fac_id}", file_format: "CSV", expected_facility_version: "${fac_v_before_build}" }
              as: ComplianceOfficer
              captures: { tf_id: $.data.id, tf_payer_cols: $.data.payer_column_count }
            - call: "POST /chargemaster/transparency-files/${tf_id}/lifecycle"
              payload: { action: "VALIDATE" }
              as: ComplianceOfficer
              captures: { tf_status_validated: $.data.status }
            - call: "POST /chargemaster/transparency-files/${tf_id}/lifecycle"
              payload: { action: "PUBLISH" }
              as: ComplianceOfficer
              captures: { tf_included: $.data.included_item_count }
            - call: "POST /chargemaster/change-requests"
              payload: { department_id: "${dept_lab_id}", charge_item_id: "${item_id}", request_type: "PRICE_CHANGE", justification: "Reagent vendor cost increase for the FY2027 contract year", proposed_cost_basis_cents: 70000 }
              as: DepartmentManager
              as_user_id: "mgr_lab_01"
              captures: { cr_a_id: $.data.id, cr_a_projected: $.data.projected_gross_charge_cents, cr_a_ratio: $.data.projected_markup_ratio_bp }
            - call: "POST /chargemaster/change-requests"
              payload: { department_id: "${dept_lab_id}", charge_item_id: "${item_id}", request_type: "DEACTIVATION", justification: "Assay retired by the reference laboratory effective Q1 2027" }
              as: DepartmentManager
              as_user_id: "mgr_lab_01"
              captures: { cr_b_id: $.data.id }
            - call: "POST /chargemaster/change-requests/${cr_a_id}/decisions"
              payload: { decision: "REVIEW", decision_note: "price change review opened" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_01"
            - call: "POST /chargemaster/change-requests/${cr_b_id}/decisions"
              payload: { decision: "REVIEW", decision_note: "deactivation review opened" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_01"
            - call: "GET /chargemaster/charge-items/${item_id}"
              payload: {}
              as: PricingCommitteeApprover
              captures: { item_v_for_a: $.data.version }
            - call: "POST /chargemaster/change-requests/${cr_a_id}/approve"
              payload: { expected_charge_item_version: "${item_v_for_a}", decision_note: "price change approved" }
              as: PricingCommitteeApprover
              as_user_id: "pca_01"
              captures: { cr_a_pin: $.data.pinned_charge_item_version }
            - call: "GET /chargemaster/charge-items/${item_id}"
              payload: {}
              as: PricingCommitteeApprover
              captures: { item_v_for_b: $.data.version }
            - call: "POST /chargemaster/change-requests/${cr_b_id}/approve"
              payload: { expected_charge_item_version: "${item_v_for_b}", decision_note: "deactivation approved" }
              as: PricingCommitteeApprover
              as_user_id: "pca_01"
              captures: { cr_b_pin: $.data.pinned_charge_item_version }
            - call: "GET /chargemaster/facilities/${fac_id}"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { fac_v_before_implement: $.data.version }
          trigger:
            - call: "POST /chargemaster/change-requests/${cr_a_id}/implement"
              payload: { implementation_note: "applied the approved cost basis of 70000 cents" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_01"
              captures: { cr_a_final_status: $.data.status }
          assert:
            - "${tf_payer_cols} == 1"
            - "${tf_status_validated} == VALIDATED"
            - "${tf_included} == 1"
            - "${cr_a_projected} == 168000"
            - "${cr_a_ratio} == 24000"
            - "${item_v_for_a} == 7"
            - "${cr_a_pin} == 8"
