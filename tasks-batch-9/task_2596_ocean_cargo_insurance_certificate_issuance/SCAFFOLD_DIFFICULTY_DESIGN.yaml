  - rule_id: compensating_invariant
    instances:
      - name: issue_then_cancel_conserves_exposure_and_net_premium
        conserved_quantity: |
          Two money-denominated quantities, pinned as formulas over entity fields:
          (I1) booked exposure
               Vessel.accumulated_insured_value
             + Port(loading).accumulated_insured_value
             + Port(discharge).accumulated_insured_value
             + OpenPolicy.aggregate_insured_value_booked  ==  0.00
          (I2) net written premium
               OpenPolicy.aggregate_premium_booked
             - OpenPolicy.aggregate_return_premium        ==  0.00
        grounds:
          - state_machines.Certificate.status.ISSUED_to_CANCELLED
          - state_machines.AccumulationEntry.status.ACTIVE_to_RELEASED
          - calculations.certificate_return_premium
          - entities.OpenPolicy.fields.aggregate_return_premium
        distinguishing_aspect: |
          Forward action POST /certificates/{id}/issue books 1155000.00 onto
          four ledgers and 6444.91 of written premium; the compensating action
          POST /certificates/{id}/cancel, taken before attachment (clock
          2026-08-01, attachment 2026-08-10), must release all three
          AccumulationEntry rows and return 100% of the premium, driving both
          I1 and I2 back to exactly 0.00. certificates_issued_count and
          aggregate_premium_booked are deliberately NOT rewound — written
          premium and returned premium are separate ledgers — so an
          implementation that "fixes" drift by decrementing
          aggregate_premium_booked fails the assertions just as surely as one
          that forgets to release the port entries.
        test_recipe:
          setup:
            - "the canonical ACTIVE OpenPolicy, CommodityClass CC-ELEC, APPROVED vessel VSL-A, GREEN ports SGSIN / NLRTM"
            - "all four ledgers verified at 0.00 before the forward action"
            - "CERT-A DRAFT with war and strikes cover (insured 1155000.00, total premium 6444.91)"
            - "the logical clock stays at 2026-08-01T00:00:00Z, before the 2026-08-10 attachment, so CANCEL_UNEARNED_PCT_PRE_ATTACHMENT (1.00) applies"
          setup_api_calls:
            - call: "POST /ports"
              payload: { unlocode: "SGSIN", name: "Singapore", country_code: "SG", port_accumulation_limit_amount: 4000000, storage_free_days: 30, war_risk_tier: "GREEN" }
              as: Underwriter
              captures: { port_load_id: $.data.id }
            - call: "POST /ports"
              payload: { unlocode: "NLRTM", name: "Rotterdam", country_code: "NL", port_accumulation_limit_amount: 4000000, storage_free_days: 30, war_risk_tier: "GREEN" }
              as: Underwriter
              captures: { port_disch_id: $.data.id }
            - call: "POST /commodity-classes"
              payload: { code: "CC-ELEC", description: "Consumer electronics", susceptibility_rating: "S3", required_packaging_code: "EXPORT_CRATE", rate_loading_pct: 0.35, max_conveyance_share_pct: 0.80, survey_required_above_amount: 500000 }
              as: Underwriter
              captures: { cc_id: $.data.id }
            - call: "POST /vessels"
              payload: { name: "MV Kite", imo_number: "9100001", year_built: 2015, classification_society: "LR", flag_code: "SG", vessel_accumulation_limit_amount: 5000000 }
              as: Underwriter
              captures: { vsl_a_id: $.data.id }
            - call: "POST /vessels/${vsl_a_id}/classification-review"
              payload: {}
              as: Underwriter
            - call: "POST /open-policies"
              payload: { policy_number: "OP-2596-A", assured_name: "Kite Trading Pte", inception_at: "2026-01-01T00:00:00Z", expiry_at: "2027-01-01T00:00:00Z", freight_basis: "PREPAID", per_certificate_limit_amount: 2000000, conveyance_limit_amount: 3000000, annual_aggregate_limit_amount: 10000000, premium_rate_per_mille: 3.500, war_rate_per_mille: 0.600, strikes_rate_per_mille: 0.255, warehouse_to_warehouse: true, markup_pct: 0.10, deductible_amount: 2500 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /open-policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /certificates"
              payload: { open_policy_id: "${pol_id}", commodity_class_id: "${cc_id}", vessel_id: "${vsl_a_id}", loading_port_id: "${port_load_id}", discharge_port_id: "${port_disch_id}", certificate_number: "CERT-A", valuation_basis: "CIF_PLUS_MARKUP", packaging_code: "EXPORT_CRATE", package_count: 120, gross_weight_kg: 18000, sailing_date: "2026-08-10T00:00:00Z", discharge_date: "2026-09-05T00:00:00Z", invoice_value: 1000000, freight_amount: 45000, duty_amount: 5000, war_cover_requested: true, strikes_cover_requested: true }
              as: Assured
              as_user_id: "${pol_id}"
              captures: { cert_a_id: $.data.id }
            - call: "GET /open-policies/${pol_id}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version, booked_before: $.data.aggregate_insured_value_booked }
          trigger:
            - call: "POST /certificates/${cert_a_id}/issue"
              payload: { expected_open_policy_version: "${pol_v1}" }
              as: Underwriter
            - call: "GET /vessels/${vsl_a_id}"
              payload: {}
              as: Underwriter
              captures: { vessel_ledger_after_issue: $.data.accumulated_insured_value }
            - call: "GET /open-policies/${pol_id}"
              payload: {}
              as: Underwriter
              captures: { booked_after_issue: $.data.aggregate_insured_value_booked, premium_after_issue: $.data.aggregate_premium_booked }
            - call: "POST /certificates/${cert_a_id}/cancel"
              payload: { cancellation_reason: "SHIPMENT_NOT_SHIPPED" }
              as: Underwriter
          assert:
            - "${booked_before} == 0.00 and ${vessel_ledger_after_issue} == 1155000.00 and ${booked_after_issue} == 1155000.00 and ${premium_after_issue} == 6444.91"
            - "Certificate.${cert_a_id}.status == CANCELLED and Certificate.${cert_a_id}.return_premium_amount == 6444.91"
            - "I1: Vessel.${vsl_a_id}.accumulated_insured_value == 0.00, Port.${port_load_id}.accumulated_insured_value == 0.00, Port.${port_disch_id}.accumulated_insured_value == 0.00 and OpenPolicy.${pol_id}.aggregate_insured_value_booked == 0.00 (sum 0.00)"
            - "I2: OpenPolicy.${pol_id}.aggregate_premium_booked == 6444.91 and OpenPolicy.${pol_id}.aggregate_return_premium == 6444.91, so the net is exactly 0.00"
            - "OpenPolicy.${pol_id}.certificates_issued_count == 1 — the count of written certificates is history and is not rewound"
            - "GET /accumulation-entries?certificate_id=${cert_a_id}&status=ACTIVE returns total_count == 0; the same query with status=RELEASED returns 3, every row carrying release_reason CERTIFICATE_CANCELLED"

      - name: appoint_then_cancel_conserves_surveyor_booked_minutes
        conserved_quantity: |
          A capacity quantity in whole minutes, not money:
            Surveyor.booked_minutes_total
          ==  sum(SurveyOrder.window_minutes
                  for orders on this surveyor with status IN {APPOINTED, REPORT_FILED})
          and the invariant is that appointing then cancelling returns it to its
          pre-appointment value of 0, with the calendar interval itself freed.
        grounds:
          - state_machines.SurveyOrder.status.APPOINTED_to_CANCELLED
          - calculations.surveyor_window_conflict
          - entities.Surveyor.fields.booked_minutes_total
          - state_machines.ClaimFile.status
        distinguishing_aspect: |
          A different conserved quantity — a surveyor's booked minutes, an
          integer capacity measure rather than money or insured exposure. The
          forward action POST /survey-orders books 120 minutes and moves the
          claim to SURVEY_ORDERED; the compensating action POST
          /survey-orders/{id}/cancel must return booked_minutes_total to 0 AND
          return the claim to OPENED, and the freed interval must be re-bookable
          — re-requesting the identical 09:00..11:00 window succeeds, which is
          the strongest evidence that the CANCELLED order no longer occupies the
          calendar (cancelled orders are excluded from the conflict input set).
          An implementation that leaves the minutes booked, or that leaves the
          claim stuck in SURVEY_ORDERED, shows the drift immediately.
        test_recipe:
          setup:
            - "an ACTIVE Surveyor based at NLRTM certified for S3, travel_buffer_minutes 45, booked_minutes_total 0"
            - "CERT-A ISSUED and one OPENED ClaimFile on it"
          setup_api_calls:
            - call: "POST /ports"
              payload: { unlocode: "SGSIN", name: "Singapore", country_code: "SG", port_accumulation_limit_amount: 4000000, storage_free_days: 30, war_risk_tier: "GREEN" }
