# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk of references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1-§1.7.
# Every active instance drives empty-DB -> precondition using only §1.5 endpoints.
scaffold_corner_design:

  - section: entities
    instances:

      - name: create_building_returns_declared_fields_with_server_defaults
        claim_type: Creation
        grounds:
          - entities.Building
          - endpoints[POST /residence-life/buildings]
        distinguishing_aspect: "A second Building created with only name/code/campus_zone comes back 201 with posture OPEN, bed_capacity 0, assigned_bed_count 0, version 1, break_housing_enabled false and closure_reason null."
        test_recipe:
          setup:
            - "One hall (KERR) already exists so the create path is exercised against a non-empty table."
          setup_api_calls:
            - call: "POST /residence-life/buildings"
              payload: { name: "Kerr Hall", code: "KERR", campus_zone: "NORTH" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { b1_id: $.data.id }
          trigger:
            - call: "POST /residence-life/buildings"
              payload: { name: "McGregor Hall", code: "MCGR", campus_zone: "SOUTH" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { b2_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Building.${b2_id}.posture == OPEN"
            - "Building.${b2_id}.break_housing_enabled == false"
            - "Building.${b2_id}.bed_capacity == 0 and Building.${b2_id}.assigned_bed_count == 0"
            - "Building.${b2_id}.version == 1"
            - "Building.${b2_id}.closure_reason == null and Building.${b2_id}.last_posture_change_at == null"
            - "Building.${b2_id}.id != Building.${b1_id}.id"

      - name: list_rooms_filters_by_floor_and_paginates_with_total_count
        claim_type: Listing
        grounds:
          - endpoints[GET /residence-life/rooms]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /residence-life/rooms?floor_id=...&limit=2&offset=0 returns 2 rooms with total_count 3 and has_more true; offset=2 returns the remaining 1 with has_more false."
        test_recipe:
          setup:
            - "Kerr Hall floor 2 holds rooms 201, 202 and 203."
          setup_api_calls:
            - call: "POST /residence-life/buildings"
              payload: { name: "Kerr Hall", code: "KERR", campus_zone: "NORTH" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { b_id: $.data.id }
            - call: "POST /residence-life/floors"
              payload: { building_id: "${b_id}", floor_number: 2 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { f_id: $.data.id }
            - call: "POST /residence-life/rooms"
              payload: { floor_id: "${f_id}", room_number: "201", bed_capacity: 2, last_renovation_year: 2021 }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/rooms"
              payload: { floor_id: "${f_id}", room_number: "202", bed_capacity: 2, last_renovation_year: 2021 }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/rooms"
              payload: { floor_id: "${f_id}", room_number: "203", bed_capacity: 1, last_renovation_year: 2019 }
              as: ResidenceDirector
              as_user_id: "rd-1"
          trigger:
            - call: "GET /residence-life/rooms"
              payload: { floor_id: "${f_id}", limit: 2, offset: 0 }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "GET /residence-life/rooms"
              payload: { floor_id: "${f_id}", limit: 2, offset: 2 }
              as: ResidenceDirector
              as_user_id: "rd-1"
          assert:
            - "First call: meta present, response_type == array, data length 2, total_count == 3, has_more == true"
            - "Second call: data length 1, total_count == 3, has_more == false"
            - "Floor.${f_id}.bed_capacity == 5"

      - name: get_unknown_student_returns_student_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_STUDENT_NOT_FOUND]
          - validations[priority=10]
        distinguishing_aspect: "A well-formed UUID that matches no Student row returns HTTP 404 with data.error_id == ERR_STUDENT_NOT_FOUND, not an empty object."
        test_recipe:
          setup:
            - "At least one Student exists so the lookup misses rather than hitting an empty table."
          setup_api_calls:
            - call: "POST /residence-life/students"
              payload: { full_name: "Dee Sun", email: "dee@u.edu", class_year: "JUNIOR" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { s_id: $.data.id }
          trigger:
            - call: "GET /residence-life/students/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with data.error_id == ERR_STUDENT_NOT_FOUND"
            - "response_type == error"
            - "Student.${s_id} is untouched"

      - name: create_room_without_bed_capacity_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=15]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /residence-life/rooms]
        distinguishing_aspect: "bed_capacity is a required input with no default, so omitting it returns HTTP 400 ERR_INVALID_REQUEST and no Room row is created."
        test_recipe:
          setup:
            - "Kerr Hall floor 2 exists and holds no rooms."
          setup_api_calls:
            - call: "POST /residence-life/buildings"
              payload: { name: "Kerr Hall", code: "KERR", campus_zone: "NORTH" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { b_id: $.data.id }
            - call: "POST /residence-life/floors"
              payload: { building_id: "${b_id}", floor_number: 2 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /residence-life/rooms"
              payload: { floor_id: "${f_id}", room_number: "201", last_renovation_year: 2021 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /residence-life/rooms?floor_id=${f_id} returns total_count == 0"
            - "Floor.${f_id}.bed_capacity == 0"

      - name: create_building_omitting_break_housing_enabled_defaults_to_false
        claim_type: Defaults
        grounds:
          - entities.Building.fields.break_housing_enabled
          - endpoints[POST /residence-life/buildings]
        distinguishing_aspect: "break_housing_enabled has default false; a hall created with the flag explicitly true keeps true while a hall created without the key reads false."
        test_recipe:
          setup:
            - "One hall was created with break_housing_enabled explicitly true."
          setup_api_calls:
            - call: "POST /residence-life/buildings"
              payload: { name: "Kerr Hall", code: "KERR", campus_zone: "NORTH", break_housing_enabled: true }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { b1_id: $.data.id }
          trigger:
            - call: "POST /residence-life/buildings"
              payload: { name: "McGregor Hall", code: "MCGR", campus_zone: "WEST" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { b2_id: $.data.id }
          assert:
            - "Building.${b1_id}.break_housing_enabled == true"
            - "Building.${b2_id}.break_housing_enabled == false"

      - name: create_room_with_bed_capacity_five_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Room.fields.bed_capacity
          - validations[priority=15]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "bed_capacity is constrained to 1..4, so 5 returns HTTP 400 ERR_INVALID_REQUEST while 4 is accepted."
        test_recipe:
          setup:
            - "Kerr Hall floor 2 exists."
          setup_api_calls:
            - call: "POST /residence-life/buildings"
              payload: { name: "Kerr Hall", code: "KERR", campus_zone: "NORTH" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { b_id: $.data.id }
            - call: "POST /residence-life/floors"
              payload: { building_id: "${b_id}", floor_number: 2 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /residence-life/rooms"
              payload: { floor_id: "${f_id}", room_number: "201", bed_capacity: 5, last_renovation_year: 2021 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { err: $.data.error_id }
            - call: "POST /residence-life/rooms"
              payload: { floor_id: "${f_id}", room_number: "201", bed_capacity: 4, last_renovation_year: 2021 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { r_id: $.data.id }
          assert:
            - "The first call returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "The second call returns HTTP 201 and Room.${r_id}.bed_capacity == 4"
            - "Floor.${f_id}.bed_capacity == 4"

      - name: create_floor_under_unknown_building_returns_building_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=20]
          - errors[ERR_BUILDING_NOT_FOUND]
          - entities.Floor.fields.building_id
        distinguishing_aspect: "A body foreign key that resolves to no Building returns HTTP 404 ERR_BUILDING_NOT_FOUND at validation priority 20, before any Floor row is created."
        test_recipe:
          setup:
            - "One real hall exists, so the failure is a genuine miss and not an empty table."
          setup_api_calls:
            - call: "POST /residence-life/buildings"
              payload: { name: "Kerr Hall", code: "KERR", campus_zone: "NORTH" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /residence-life/floors"
              payload: { building_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", floor_number: 3 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with data.error_id == ERR_BUILDING_NOT_FOUND"
            - "GET /residence-life/floors?building_id=${b_id} returns total_count == 0"

      - name: duplicate_room_number_on_same_floor_returns_409
        claim_type: Type Constraints
        grounds:
          - validations[priority=61]
          - errors[ERR_DUPLICATE_ROOM_NUMBER]
        distinguishing_aspect: "room_number is unique per floor_id: repeating 201 on the same floor returns HTTP 409 ERR_DUPLICATE_ROOM_NUMBER, while the same number on a different floor of the same hall is accepted."
        test_recipe:
          setup:
            - "Kerr Hall has floors 2 and 3; floor 2 already holds room 201."
          setup_api_calls:
            - call: "POST /residence-life/buildings"
              payload: { name: "Kerr Hall", code: "KERR", campus_zone: "NORTH" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { b_id: $.data.id }
            - call: "POST /residence-life/floors"
              payload: { building_id: "${b_id}", floor_number: 2 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { f2_id: $.data.id }
            - call: "POST /residence-life/floors"
              payload: { building_id: "${b_id}", floor_number: 3 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { f3_id: $.data.id }
            - call: "POST /residence-life/rooms"
              payload: { floor_id: "${f2_id}", room_number: "201", bed_capacity: 2, last_renovation_year: 2021 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { r201_id: $.data.id }
          trigger:
            - call: "POST /residence-life/rooms"
              payload: { floor_id: "${f2_id}", room_number: "201", bed_capacity: 1, last_renovation_year: 2020 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { err: $.data.error_id }
            - call: "POST /residence-life/rooms"
              payload: { floor_id: "${f3_id}", room_number: "201", bed_capacity: 1, last_renovation_year: 2020 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { r301_id: $.data.id }
          assert:
            - "The first call returns HTTP 409 with data.error_id == ERR_DUPLICATE_ROOM_NUMBER"
            - "The second call returns HTTP 201"
            - "Room.${r201_id}.bed_capacity == 2 - the rejected create did not overwrite it"
            - "Building.${b_id}.bed_capacity == 3"

  - section: state_machines
    instances:

      - name: certify_an_uncertified_ra_returns_ra_state_invalid
        claim_type: Invalid Transitions
        grounds:
          - state_machines.RA.IN_TRAINING_to_CERTIFIED
          - errors[ERR_RA_STATE_INVALID]
          - validations[priority=30]
        distinguishing_aspect: "CERTIFIED is only reachable from IN_TRAINING; issuing CERTIFY on a freshly created RA whose certification_status is UNCERTIFIED returns HTTP 409 ERR_RA_STATE_INVALID and leaves the dimension at UNCERTIFIED."
        test_recipe:
          setup:
            - "An RA row exists in employment_status PROVISIONAL and certification_status UNCERTIFIED, created by accepting an offer."
          setup_api_calls:
            - call: "POST /residence-life/buildings"
              payload: { name: "Kerr Hall", code: "KERR", campus_zone: "NORTH" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { b_id: $.data.id }
            - call: "POST /residence-life/floors"
              payload: { building_id: "${b_id}", floor_number: 2 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { f_id: $.data.id }
            - call: "POST /residence-life/students"
              payload: { full_name: "Ada Ray", email: "ada@u.edu", class_year: "JUNIOR" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { s_ada_id: $.data.id }
            - call: "POST /residence-life/ra-applications"
              payload: { applicant_student_id: "${s_ada_id}", term_code: "2026FA", essay_ref: "E-ADA" }
              as: Student
              as_user_id: "${s_ada_id}"
              captures: { app_id: $.data.id }
            - call: "POST /residence-life/ra-applications/${app_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_ada_id}"
            - call: "POST /residence-life/ra-applications/${app_id}/review"
              payload: { interview_score: 84 }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ra-applications/${app_id}/decision"
              payload: { decision: "OFFER" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ra-applications/${app_id}/response"
              payload: { response: "ACCEPT" }
              as: Student
              as_user_id: "${s_ada_id}"
              captures: { ra_id: $.data.created_ra_id }
          trigger:
            - call: "POST /residence-life/ras/${ra_id}/certification"
              payload: { action: "CERTIFY" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_RA_STATE_INVALID"
            - "RA.${ra_id}.certification_status == UNCERTIFIED"
            - "RA.${ra_id}.employment_status == PROVISIONAL"
            - "RA.${ra_id}.certified_at == null"
            - "RAApplication.${app_id}.status == ACCEPTED and RAApplication.${app_id}.created_ra_id == ${ra_id}"

      - name: posture_from_emergency_closed_to_restricted_returns_invalid_posture_transition
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Building.EMERGENCY_CLOSED_to_OPEN
          - errors[ERR_INVALID_POSTURE_TRANSITION]
        distinguishing_aspect: "The only edge out of EMERGENCY_CLOSED is back to OPEN, so target_posture RESTRICTED returns HTTP 409 ERR_INVALID_POSTURE_TRANSITION and the hall stays EMERGENCY_CLOSED."
        test_recipe:
          setup:
            - "Kerr Hall has been driven to posture EMERGENCY_CLOSED."
          setup_api_calls:
            - call: "POST /residence-life/buildings"
              payload: { name: "Kerr Hall", code: "KERR", campus_zone: "NORTH" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { b_id: $.data.id }
            - call: "POST /residence-life/buildings/${b_id}/posture"
              payload: { target_posture: "EMERGENCY_CLOSED", reason: "gas leak" }
              as: ResidenceDirector
              as_user_id: "rd-1"
          trigger:
            - call: "POST /residence-life/buildings/${b_id}/posture"
              payload: { target_posture: "RESTRICTED", reason: "partial reopening" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_INVALID_POSTURE_TRANSITION"
            - "Building.${b_id}.posture == EMERGENCY_CLOSED"
            - "Building.${b_id}.closure_reason == 'gas leak'"

      - name: triage_close_no_action_creates_no_conduct_case_and_no_judicial_hold
        claim_type: Side Effect Execution
        grounds:
          - state_machines.IncidentReport.SUBMITTED_to_CLOSED_NO_ACTION
          - state_machines.IncidentReport.SUBMITTED_to_ROUTED_TO_CONDUCT
          - entities.Student.fields.judicial_hold
          - entities.IncidentReport.fields.conduct_case_id
        distinguishing_aspect: "The CLOSE_NO_ACTION branch of the triage fork has a side-effect set disjoint from ROUTE: conduct_case_id stays null, no ConductCase row exists for the subject, and Student.judicial_hold stays false."
        test_recipe:
          setup:
            - "Kerr Hall floor 2 with an ACTIVE RA assigned to it (certification not required to file a report)."
            - "Bo Lin occupies room 201 and has a SUBMITTED incident report filed against him."
          setup_api_calls:
            - call: "POST /residence-life/buildings"
              payload: { name: "Kerr Hall", code: "KERR", campus_zone: "NORTH" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { b_id: $.data.id }
            - call: "POST /residence-life/floors"
              payload: { building_id: "${b_id}", floor_number: 2 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { f_id: $.data.id }
            - call: "POST /residence-life/rooms"
              payload: { floor_id: "${f_id}", room_number: "201", bed_capacity: 2, last_renovation_year: 2021 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { r201_id: $.data.id }
            - call: "POST /residence-life/students"
              payload: { full_name: "Ada Ray", email: "ada@u.edu", class_year: "JUNIOR" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { s_ada_id: $.data.id }
            - call: "POST /residence-life/ra-applications"
              payload: { applicant_student_id: "${s_ada_id}", term_code: "2026FA", essay_ref: "E-ADA" }
              as: Student
              as_user_id: "${s_ada_id}"
              captures: { app_id: $.data.id }
            - call: "POST /residence-life/ra-applications/${app_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_ada_id}"
            - call: "POST /residence-life/ra-applications/${app_id}/review"
              payload: { interview_score: 84 }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ra-applications/${app_id}/decision"
              payload: { decision: "OFFER" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ra-applications/${app_id}/response"
              payload: { response: "ACCEPT" }
              as: Student
              as_user_id: "${s_ada_id}"
              captures: { ra_id: $.data.created_ra_id }
            - call: "POST /residence-life/ras/${ra_id}/floor-assignment"
              payload: { floor_id: "${f_id}" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ras/${ra_id}/employment"
              payload: { action: "ACTIVATE" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/students"
              payload: { full_name: "Bo Lin", email: "bo@u.edu", class_year: "SOPHOMORE" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { s_bo_id: $.data.id }
            - call: "POST /residence-life/students/${s_bo_id}/room-assignment"
              payload: { action: "PLACE", room_id: "${r201_id}" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/incident-reports"
              payload: { room_id: "${r201_id}", subject_student_id: "${s_bo_id}", occurred_at: "2026-07-29T21:15:00Z", severity: "MINOR", policy_code: "NOISE", narrative: "Speaker left playing in an empty room for ten minutes." }
              as: ResidentAssistant
              as_user_id: "${ra_id}"
              captures: { ir_id: $.data.id }
            - call: "POST /residence-life/incident-reports/${ir_id}/submit"
              payload: {}
              as: ResidentAssistant
              as_user_id: "${ra_id}"
          trigger:
            - call: "POST /residence-life/incident-reports/${ir_id}/triage"
              payload: { disposition: "CLOSE_NO_ACTION", note: "resolved informally" }
              as: ResidenceDirector
              as_user_id: "rd-1"
          assert:
            - "IncidentReport.${ir_id}.status == CLOSED_NO_ACTION"
            - "IncidentReport.${ir_id}.conduct_case_id == null"
            - "IncidentReport.${ir_id}.routed_by_user_id == null"
            - "GET /residence-life/conduct-cases?respondent_student_id=${s_bo_id} returns total_count == 0"
            - "Student.${s_bo_id}.judicial_hold == false"
            - "Student.${s_bo_id}.conduct_points == 0 and Student.${s_bo_id}.conduct_standing == GOOD"

      - name: incident_return_disposition_capped_at_two_rounds
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.IncidentReport.SUBMITTED_to_RETURNED_FOR_DETAIL
          - state_machines.IncidentReport.RETURNED_FOR_DETAIL_to_SUBMITTED
          - validations[priority=32]
          - errors[ERR_RETURN_LIMIT_REACHED]
        distinguishing_aspect: "The SUBMITTED -> RETURNED_FOR_DETAIL -> SUBMITTED cycle may run twice; with return_count already 2 the third RETURN returns HTTP 409 ERR_RETURN_LIMIT_REACHED and the report stays SUBMITTED."
        test_recipe:
          setup:
            - "Kerr Hall floor 2 with an ACTIVE RA assigned to it."
            - "An incident report about Bo Lin has been returned twice and resubmitted twice, so return_count is 2 and status is SUBMITTED."
          setup_api_calls:
            - call: "POST /residence-life/buildings"
              payload: { name: "Kerr Hall", code: "KERR", campus_zone: "NORTH" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { b_id: $.data.id }
            - call: "POST /residence-life/floors"
              payload: { building_id: "${b_id}", floor_number: 2 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { f_id: $.data.id }
            - call: "POST /residence-life/rooms"
              payload: { floor_id: "${f_id}", room_number: "201", bed_capacity: 2, last_renovation_year: 2021 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { r201_id: $.data.id }
            - call: "POST /residence-life/students"
