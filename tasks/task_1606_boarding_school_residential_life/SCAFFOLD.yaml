# =============================================================================
# SCAFFOLD — Boarding School Residential Life (New England boarding school)
# Task 1606. Sections 1.0-1.7 (difficulty/corner designs live in sibling files).
# =============================================================================

scenario: |
  Boarding School Residential Life (New England boarding school): dorm assignment & roommate matching, sign-in/out & weekend leave permission workflow, dorm-parent duty rotation & night check, health center medication administration, discipline & major violation hearing, study-hall & curfew compliance tracking, international guardian & travel arrangement, break-period housing & storage

domain_name: boarding-school-reslife
api_prefix: /reslife

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers: [cascading_side_effects, optimistic_concurrency, rate_threshold_triggers, temporal_windowing]
  entity_topology: flat            # all resources top-level under /reslife; FK links in bodies/filters
  state_machine_shape: cyclic      # appeal loop, duty-swap loop, med hold loop, parallel dims on Student
  relationship_patterns: [one_to_many, many_to_many, self_referential, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate
  version_policy: "entity.version increments by 1 on every material mutation of that entity's own stored fields or status (including cascaded writes); pure recomputation of derived fields without stored-field change does not bump version"

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Term
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Term label, e.g. FALL_2026" }
      - { name: starts_on, type: string, source: input, description: "ISO date, first day of term" }
      - { name: ends_on, type: string, source: input, description: "ISO date, last day of term; must be > starts_on" }
      - { name: status, type: enum, source: system, description: "UPCOMING | ACTIVE | CLOSED", default: UPCOMING, constraints: "at most one ACTIVE term exists at any time" }

  - name: Dorm
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Dorm name" }
      - { name: gender_policy, type: enum, source: input, description: "MALE_ONLY | FEMALE_ONLY | ANY" }
      - { name: curfew_weekday, type: string, source: input, description: "HH:MM 24h local, applies Sun-Thu nights" }
      - { name: curfew_weekend, type: string, source: input, description: "HH:MM 24h local, applies Fri-Sat nights" }
      - { name: posture, type: enum, source: system, description: "OPEN | CLOSED_FOR_BREAK", default: OPEN }
      - { name: beds_total, type: integer, source: computed, description: "Sum of beds over all Rooms of this dorm" }
      - { name: occupancy_physical, type: integer, source: computed, description: "Count of DormAssignments with status CONFIRMED in rooms of this dorm" }
      - { name: occupancy_projected, type: integer, source: computed, description: "occupancy_physical + count of PROPOSED assignments in rooms of this dorm" }
      - { name: beds_available, type: integer, source: computed, description: "beds_total - occupancy_physical" }

  - name: Room
    parent: null
    common_fields: true
    fields:
      - { name: dorm_id, type: string, source: input, description: "FK -> Dorm.id; owning dorm" }
      - { name: room_number, type: string, source: input, description: "Room label; unique within dorm" }
      - { name: beds, type: integer, source: input, description: "Bed capacity, 1..4" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | FULL | BLOCKED; FULL is auto when beds_assigned == beds; BLOCKED is manual", default: AVAILABLE }
      - { name: beds_assigned, type: integer, source: computed, description: "Count of CONFIRMED DormAssignments in this room", default: 0 }
      - { name: beds_available, type: integer, source: computed, description: "beds - beds_assigned", default: 0 }

  - name: Parent
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Parent or legal guardian at home" }
      - { name: email, type: string, source: input, description: "Contact email" }

  - name: Guardian
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Local guardian for international students" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: city, type: string, source: input, description: "Guardian city of residence" }
      - { name: max_wards, type: integer, source: input, description: "Maximum number of wards, 1..10", default: 3 }
      - { name: wards_assigned, type: integer, source: computed, description: "Count of ENROLLED or ON_LEAVE Students whose guardian_id references this guardian", default: 0 }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | SUSPENDED", default: PENDING }

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Staff member name" }
      - { name: staff_role, type: enum, source: input, description: "DORM_PARENT | NURSE | DEAN | FRONT_DESK" }
      - { name: dorm_id, type: string, source: input, description: "FK -> Dorm.id; home dorm for DORM_PARENT staff, null allowed for others", default: null }
      - { name: is_active, type: boolean, source: input, description: "Employment active flag", default: true }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Student legal name" }
      - { name: grade, type: integer, source: input, description: "Grade 9..12" }
      - { name: gender, type: enum, source: input, description: "MALE | FEMALE" }
      - { name: is_international, type: boolean, source: input, description: "True if student requires a local guardian" }
      - { name: parent_id, type: string, source: input, description: "FK -> Parent.id; home parent" }
      - { name: guardian_id, type: string, source: input, description: "FK -> Guardian.id; required when is_international=true, must be null otherwise", default: null }
      - { name: sleep_schedule, type: integer, source: input, description: "Roommate questionnaire 1..5 (1=early bird,5=night owl)" }
      - { name: cleanliness, type: integer, source: input, description: "Roommate questionnaire 1..5" }
      - { name: noise_tolerance, type: integer, source: input, description: "Roommate questionnaire 1..5" }
      - { name: guests_comfort, type: integer, source: input, description: "Roommate questionnaire 1..5" }
      - { name: enrollment_status, type: enum, source: system, description: "ENROLLED | ON_LEAVE | WITHDRAWN | GRADUATED; parallel dimension 1", default: ENROLLED }
      - { name: discipline_standing, type: enum, source: computed, description: "GOOD | PROBATION | SUSPENDED; parallel dimension 2, derived from demerit_points thresholds", default: GOOD }
      - { name: demerit_points, type: integer, source: computed, description: "Official points: event-assessed points + points_assessed of DisciplineCases in SANCTIONED or CLOSED status", default: 0 }
      - { name: demerit_points_provisional, type: integer, source: computed, description: "demerit_points + points_proposed of cases in REPORTED/UNDER_REVIEW/HEARING_SCHEDULED/APPEALED", default: 0 }
      - { name: weekend_leaves_used, type: integer, source: computed, description: "Count of WEEKEND_OVERNIGHT LeaveRequests of this student in the ACTIVE term with status in {APPROVED, SIGNED_OUT, OVERDUE, RETURNED}", default: 0 }
      - { name: weekend_leave_allowance, type: integer, source: computed, description: "Per-term WEEKEND_OVERNIGHT allowance from calculation weekend_leave_allowance", default: 0 }

  - name: DormAssignment
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: room_id, type: string, source: input, description: "FK -> Room.id" }
      - { name: term_id, type: string, source: input, description: "FK -> Term.id" }
      - { name: roommate_assignment_id, type: string, source: system, description: "FK -> DormAssignment.id; mutual roommate link, null when unpaired", default: null }
      - { name: status, type: enum, source: system, description: "PROPOSED | CONFIRMED | SUPERSEDED | ENDED", default: PROPOSED }
      - { name: compatibility_score, type: integer, source: computed, description: "0..100 roommate compatibility from calculation roommate_compatibility_score; null until roommate link set", default: null }
      - { name: check_in_at, type: datetime, source: system, description: "Set on confirm", default: null }
      - { name: check_out_at, type: datetime, source: system, description: "Set on end", default: null }

  - name: LeaveRequest
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: leave_type, type: enum, source: input, description: "WEEKEND_OVERNIGHT | DAY_PASS | BREAK_TRAVEL" }
      - { name: destination, type: string, source: input, description: "Free-text destination" }
      - { name: departs_at, type: datetime, source: input, description: "Planned departure instant" }
      - { name: returns_at, type: datetime, source: input, description: "Planned return instant; must be > departs_at" }
      - { name: status, type: enum, source: system, description: "REQUESTED | PARENT_APPROVED | APPROVED | DENIED | CANCELLED | EXPIRED | SIGNED_OUT | OVERDUE | RETURNED", default: REQUESTED }
      - { name: decided_by_parent_id, type: string, source: system, description: "X-User-ID of Parent/Guardian/Dean who made the family decision", default: null }
      - { name: decided_by_staff_id, type: string, source: system, description: "X-User-ID of DormParent who made the dorm decision", default: null }
      - { name: denial_reason, type: string, source: system, description: "Reason code when DENIED or CANCELLED by cascade", default: null }
      - { name: signed_out_at, type: datetime, source: system, description: "Actual sign-out instant", default: null }
      - { name: returned_at, type: datetime, source: system, description: "Actual return instant", default: null }
      - { name: late_return_minutes, type: integer, source: computed, description: "max(0, returned_at - returns_at) in minutes", default: 0 }

  - name: SignEvent
    parent: null
    common_fields: false
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: event_type, type: enum, source: input, description: "SIGN_OUT | SIGN_IN" }
      - { name: occurred_at, type: datetime, source: input, description: "Event instant; defaults to current logical clock when omitted", default: null }
      - { name: leave_request_id, type: string, source: input, description: "FK -> LeaveRequest.id; optional link", default: null }
      - { name: recorded_by_staff_id, type: string, source: system, description: "FK -> StaffMember.id; X-User-ID of recording FrontDesk/DormParent" }
      - { name: minutes_late, type: integer, source: computed, description: "For SIGN_IN only: max(0, occurred_at - applicable curfew) in minutes; 0 for SIGN_OUT", default: 0 }

  - name: DutyShift
    parent: null
    common_fields: true
    fields:
      - { name: dorm_id, type: string, source: input, description: "FK -> Dorm.id" }
      - { name: staff_id, type: string, source: input, description: "FK -> StaffMember.id; current assignee (a DORM_PARENT)" }
      - { name: duty_date, type: string, source: input, description: "ISO date of the duty" }
      - { name: shift_slot, type: enum, source: input, description: "WEEKDAY_NIGHT | WEEKEND_DAY | WEEKEND_NIGHT" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | SWAP_PENDING | COMPLETED | MISSED | CANCELLED", default: SCHEDULED }
      - { name: swap_requested_to_id, type: string, source: system, description: "FK -> StaffMember.id; pending swap target", default: null }
      - { name: cancel_reason, type: string, source: system, description: "Reason when CANCELLED (e.g. SUPERSEDED)", default: null }

  - name: NightCheck
    parent: null
    common_fields: false
    fields:
      - { name: duty_shift_id, type: string, source: input, description: "FK -> DutyShift.id" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: check_kind, type: enum, source: input, description: "BED_CHECK | STUDY_HALL" }
      - { name: result, type: enum, source: input, description: "PRESENT | LATE_ARRIVAL | ABSENT_EXCUSED | ABSENT_UNEXCUSED" }
      - { name: checked_at, type: datetime, source: system, description: "Logical clock instant at recording" }
      - { name: points_assessed, type: integer, source: computed, description: "Points from calculation night_check_points", default: 0 }

  - name: MedicationOrder
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: medication_name, type: string, source: input, description: "Medication label" }
      - { name: dose_mg, type: number, source: input, description: "Dose per administration" }
      - { name: slot, type: enum, source: input, description: "MORNING | NOON | EVENING | BEDTIME" }
      - { name: doses_total, type: integer, source: input, description: "Dispensed doses, >= 1" }
      - { name: doses_remaining, type: integer, source: computed, description: "doses_total - count of ADMINISTERED MedicationAdministrations", default: 0 }
      - { name: refill_threshold, type: integer, source: input, description: "Low-stock threshold", default: 5 }
      - { name: low_stock, type: boolean, source: computed, description: "true when doses_remaining <= refill_threshold", default: false }
      - { name: is_controlled, type: boolean, source: input, description: "Controlled substance flag; requires witness" }
      - { name: prescriber_name, type: string, source: input, description: "Prescribing clinician" }
      - { name: status, type: enum, source: system, description: "ACTIVE | HOLD | DISCONTINUED | COMPLETED", default: ACTIVE }
      - { name: hold_reason, type: string, source: system, description: "Reason while on HOLD", default: null }

  - name: MedicationAdministration
    parent: null
    common_fields: false
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> MedicationOrder.id" }
      - { name: scheduled_date, type: string, source: input, description: "ISO date the dose was scheduled for; unique per order" }
      - { name: outcome, type: enum, source: input, description: "ADMINISTERED | REFUSED | OMITTED_HOLD" }
      - { name: administered_by_staff_id, type: string, source: system, description: "FK -> StaffMember.id; X-User-ID of acting Nurse" }
      - { name: witness_staff_id, type: string, source: input, description: "FK -> StaffMember.id; required when the order is_controlled and outcome=ADMINISTERED; must differ from administering nurse", default: null }
      - { name: notes, type: string, source: input, description: "Free-text note", default: null }

  - name: DisciplineCase
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: reported_by_staff_id, type: string, source: system, description: "FK -> StaffMember.id; X-User-ID of reporting Dean/DormParent" }
      - { name: category, type: enum, source: input, description: "MINOR | MAJOR; MAJOR requires a hearing before outcome" }
      - { name: description, type: string, source: input, description: "Incident description" }
      - { name: points_proposed, type: integer, source: input, description: "Proposed demerit points, feeds demerit_points_provisional while pending" }
      - { name: status, type: enum, source: system, description: "REPORTED | UNDER_REVIEW | HEARING_SCHEDULED | SANCTIONED | APPEALED | DISMISSED | CLOSED", default: REPORTED }
      - { name: hearing_officer_id, type: string, source: input, description: "FK -> StaffMember.id; DEAN who chairs the hearing; must differ from reported_by_staff_id", default: null }
      - { name: hearing_at, type: datetime, source: input, description: "Scheduled hearing instant; must be in the future", default: null }
      - { name: sanction_type, type: enum, source: system, description: "NONE | WARNING | PROBATION | SUSPENSION | EXPULSION; set at outcome", default: null }
      - { name: points_assessed, type: integer, source: system, description: "Official points; set at SANCTIONED outcome or appeal UPHOLD adjustment", default: 0 }
      - { name: decided_at, type: datetime, source: system, description: "Instant outcome recorded; appeal window anchor", default: null }
      - { name: appeal_count, type: integer, source: system, description: "Number of appeals filed; hard cap 1", default: 0 }

  - name: BreakPeriod
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Break label, e.g. THANKSGIVING_2026" }
      - { name: kind, type: enum, source: input, description: "THANKSGIVING | WINTER | SPRING | SUMMER" }
      - { name: starts_on, type: string, source: input, description: "ISO date break begins" }
      - { name: ends_on, type: string, source: input, description: "ISO date break ends; must be > starts_on" }
      - { name: housing_available, type: boolean, source: input, description: "Whether break housing is offered" }
      - { name: status, type: enum, source: system, description: "UPCOMING | ACTIVE | CLOSED; advanced by logical-clock sweep", default: UPCOMING }

  - name: BreakHousingRequest
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: break_period_id, type: string, source: input, description: "FK -> BreakPeriod.id" }
      - { name: reason, type: string, source: input, description: "Free-text reason", default: null }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED | CHECKED_IN | CHECKED_OUT | CANCELLED", default: REQUESTED }
      - { name: room_id, type: string, source: system, description: "FK -> Room.id; temporary break room assigned at approval, null in v1 flow", default: null }
      - { name: room_charge_cents, type: integer, source: computed, description: "Flat break room charge; see calculation break_housing_total_due", default: 0 }
      - { name: storage_total_cents, type: integer, source: computed, description: "Sum of the student's billable StorageReservations for this break", default: 0 }
      - { name: deposit_credit_cents, type: integer, source: computed, description: "Deposit credit per pinned evaluation order", default: 0 }
      - { name: fee_cents, type: integer, source: computed, description: "Total due = room_charge + storage_total - deposit_credit", default: 0 }

  - name: StorageUnit
    parent: null
    common_fields: true
    fields:
      - { name: label, type: string, source: input, description: "Storage unit label" }
      - { name: capacity_cuft, type: integer, source: input, description: "Capacity in cubic feet, >= 1" }
      - { name: status, type: enum, source: system, description: "OPEN | SEALED", default: OPEN }
      - { name: used_cuft, type: integer, source: computed, description: "Sum of volume_cuft over StorageReservations of this unit with status in {RESERVED, CHECKED_IN}", default: 0 }

  - name: StorageReservation
    parent: null
    common_fields: true
    fields:
      - { name: storage_unit_id, type: string, source: input, description: "FK -> StorageUnit.id" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: break_period_id, type: string, source: input, description: "FK -> BreakPeriod.id" }
      - { name: volume_cuft, type: integer, source: input, description: "Reserved cubic feet, >= 1" }
      - { name: weeks, type: integer, source: input, description: "Billable storage weeks, >= 1" }
      - { name: items_description, type: string, source: input, description: "Free-text item manifest" }
      - { name: early_bird, type: boolean, source: computed, description: "true when created >= 30 days before the break starts_on", default: false }
      - { name: fee_cents, type: integer, source: computed, description: "Per-reservation fee from calculation storage_fee_cents", default: 0 }
      - { name: status, type: enum, source: system, description: "RESERVED | CHECKED_IN | RETRIEVED | CANCELLED | EXPIRED", default: RESERVED }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Term
    initial_state: UPCOMING
    terminal_states: [CLOSED]
    transitions:
      - from: UPCOMING
        to: ACTIVE
        trigger: "POST /reslife/terms/{term_id}/activate"
        actor: SchoolAdmin
        preconditions: ["no other Term has status ACTIVE"]
        side_effects: ["increments Term.version by 1"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /reslife/terms/{term_id}/close"
        actor: SchoolAdmin
        preconditions: []
        side_effects:
          - "Every DormAssignment with term_id = this term and status CONFIRMED -> ENDED (check_out_at = now); status PROPOSED -> SUPERSEDED"
          - "Each ENDED assignment clears the mutual roommate link: partner assignment roommate_assignment_id := null and compatibility_score := null"
          - "Each affected Room recomputes beds_assigned/beds_available; a FULL room whose beds_assigned drops below beds auto-flips to AVAILABLE"
          - "Every LeaveRequest of students in this term with status in {REQUESTED, PARENT_APPROVED, APPROVED} -> CANCELLED (denial_reason=TERM_CLOSED)"
          - "increments Term.version by 1"

  - entity: Dorm
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED_FOR_BREAK
        trigger: "POST /reslife/dorms/{dorm_id}/close-for-break"
        actor: SchoolAdmin
        preconditions: ["a BreakPeriod with status ACTIVE exists"]
        side_effects: ["increments Dorm.version by 1", "blocks new assignment confirms, night checks remain allowed, sign-in blocked except break-housing exception"]
      - from: CLOSED_FOR_BREAK
        to: OPEN
        trigger: "POST /reslife/dorms/{dorm_id}/reopen"
        actor: SchoolAdmin
        preconditions: []
        side_effects: ["increments Dorm.version by 1"]

  - entity: Room
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: FULL
        trigger: "system: auto when a DormAssignment confirm raises beds_assigned to == beds"
        actor: system
        preconditions: []
        side_effects: ["increments Room.version by 1"]
      - from: FULL
        to: AVAILABLE
        trigger: "system: auto when an assignment end/supersede lowers beds_assigned below beds"
        actor: system
        preconditions: []
        side_effects: ["increments Room.version by 1"]
      - from: AVAILABLE
        to: BLOCKED
        trigger: "POST /reslife/rooms/{room_id}/block"
        actor: SchoolAdmin
        preconditions: ["beds_assigned == 0"]
        side_effects: ["increments Room.version by 1"]
      - from: BLOCKED
        to: AVAILABLE
        trigger: "POST /reslife/rooms/{room_id}/unblock"
        actor: SchoolAdmin
        preconditions: []
        side_effects: ["increments Room.version by 1"]

  - entity: Student
    initial_state: ENROLLED (enrollment axis) / GOOD (standing axis)
    terminal_states: [WITHDRAWN, GRADUATED]
    note: "Two parallel state dimensions evolve independently on one row: enrollment_status (system transitions via enrollment endpoint) and discipline_standing (computed from demerit_points thresholds, moves both up and down)."
    transitions:
      - from: ENROLLED
        to: ON_LEAVE
        trigger: "POST /reslife/students/{student_id}/enrollment {to_status: ON_LEAVE}"
        actor: SchoolAdmin
        preconditions: []
        side_effects: ["increments Student.version by 1", "ON_LEAVE students are excluded from required night checks"]
      - from: ON_LEAVE
        to: ENROLLED
        trigger: "POST /reslife/students/{student_id}/enrollment {to_status: ENROLLED}"
        actor: SchoolAdmin
        preconditions: []
        side_effects: ["increments Student.version by 1"]
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /reslife/students/{student_id}/enrollment {to_status: WITHDRAWN}"
        actor: SchoolAdmin
        preconditions: []
        side_effects:
          - "CONFIRMED/PROPOSED DormAssignments in the ACTIVE term -> ENDED / SUPERSEDED (roommate link cleared on partner; room beds recomputed)"
          - "LeaveRequests in {REQUESTED, PARENT_APPROVED, APPROVED} -> CANCELLED (denial_reason=STUDENT_WITHDRAWN)"
          - "MedicationOrders in {ACTIVE, HOLD} -> DISCONTINUED"
          - "BreakHousingRequests in {REQUESTED, APPROVED} -> CANCELLED; StorageReservations in {RESERVED} -> CANCELLED (capacity released)"
          - "increments Student.version by 1"
      - from: ON_LEAVE
        to: WITHDRAWN
        trigger: "POST /reslife/students/{student_id}/enrollment {to_status: WITHDRAWN}"
        actor: SchoolAdmin
        preconditions: []
        side_effects: ["same cascade as ENROLLED->WITHDRAWN", "increments Student.version by 1"]
      - from: ENROLLED
        to: GRADUATED
        trigger: "POST /reslife/students/{student_id}/enrollment {to_status: GRADUATED}"
        actor: SchoolAdmin
        preconditions: ["no DormAssignment of this student has status CONFIRMED (must be ended first, e.g. by term close)"]
        side_effects: ["increments Student.version by 1"]
      - from: GOOD
        to: PROBATION
        trigger: "system: standing_reevaluation when demerit_points crosses >= 10"
        actor: system
        preconditions: []
        side_effects: ["increments Student.version by 1"]
      - from: PROBATION
        to: SUSPENDED
        trigger: "system: standing_reevaluation when demerit_points crosses >= 20"
        actor: system
        preconditions: []
        side_effects: ["all LeaveRequests in {REQUESTED, PARENT_APPROVED, APPROVED} -> CANCELLED (denial_reason=STANDING_SUSPENDED)", "increments Student.version by 1"]
      - from: PROBATION
        to: GOOD
        trigger: "system: standing_reevaluation when demerit_points drops below 10 (appeal overturn)"
        actor: system
        preconditions: []
        side_effects: ["increments Student.version by 1"]
      - from: SUSPENDED
        to: PROBATION
        trigger: "system: standing_reevaluation when demerit_points drops below 20"
        actor: system
        preconditions: []
        side_effects: ["increments Student.version by 1"]

  - entity: DormAssignment
    initial_state: PROPOSED
    terminal_states: [SUPERSEDED, ENDED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /reslife/dorm-assignments/{assignment_id}/confirm"
        actor: SchoolAdmin
        preconditions:
          - "assignment's Term.status == ACTIVE"
          - "Room.status != BLOCKED (ERR_INVALID_STATE) and beds_available >= 1 (ERR_ROOM_FULL; a FULL room fails only the fiscal check)"
          - "Dorm.posture == OPEN"
          - "Student.enrollment_status == ENROLLED"
          - "dorm gender_policy accepts student.gender (ANY, or MALE_ONLY==MALE, FEMALE_ONLY==FEMALE)"
          - "if student.is_international then Student.guardian_id -> Guardian.status == APPROVED"
          - "no other DormAssignment of this student in this term has status CONFIRMED"
        side_effects:
          - "check_in_at := now; Room.beds_assigned += 1; Room auto-flips to FULL when beds_assigned == beds"
          - "increments DormAssignment.version by 1"
      - from: CONFIRMED
        to: ENDED
        trigger: "POST /reslife/dorm-assignments/{assignment_id}/end, or cascade from term close / student withdrawal"
        actor: SchoolAdmin
        preconditions: []
        side_effects:
          - "check_out_at := now; Room.beds_assigned -= 1; FULL room auto-flips to AVAILABLE"
          - "if roommate_assignment_id set: partner assignment's roommate_assignment_id := null and compatibility_score := null; this assignment's link cleared"
          - "increments DormAssignment.version by 1"
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system: creating a new DormAssignment for the same student+term supersedes existing PROPOSED ones; also term close"
        actor: system
        preconditions: []
        side_effects: ["roommate link cleared on partner if set", "increments DormAssignment.version by 1"]

  - entity: LeaveRequest
    initial_state: REQUESTED
    terminal_states: [DENIED, CANCELLED, EXPIRED, RETURNED]
    transitions:
      - from: REQUESTED
        to: PARENT_APPROVED
        trigger: "POST /reslife/leave-requests/{leave_id}/parent-decision {decision: APPROVE}"
        actor: Parent
        preconditions: ["actor routing: student.is_international ? (X-User-ID == student.guardian_id, Guardian.status == APPROVED) : (X-User-ID == student.parent_id); a Dean may act as proxy when the international student's guardian is SUSPENDED"]
        side_effects: ["decided_by_parent_id := X-User-ID", "increments LeaveRequest.version by 1"]
      - from: REQUESTED
        to: DENIED
        trigger: "POST /reslife/leave-requests/{leave_id}/parent-decision {decision: DENY}, or cascade (guardian suspension, term close, withdrawal, standing SUSPENDED)"
        actor: Parent
        preconditions: ["same actor routing as approve"]
        side_effects: ["decided_by_parent_id := X-User-ID, denial_reason set", "increments LeaveRequest.version by 1"]
      - from: PARENT_APPROVED
        to: APPROVED
        trigger: "POST /reslife/leave-requests/{leave_id}/dorm-decision {decision: APPROVE}"
        actor: DormParent
        preconditions:
          - "acting DormParent's StaffMember.dorm_id == dorm of the student's CONFIRMED DormAssignment in the ACTIVE term (ERR_NO_CONFIRMED_RESIDENCY when the student has none)"
          - "Student.discipline_standing != SUSPENDED (ERR_STUDENT_SUSPENDED)"
          - "for WEEKEND_OVERNIGHT: weekend_leaves_used < weekend_leave_allowance (re-checked; ERR_LEAVE_ALLOWANCE_EXHAUSTED)"
        side_effects: ["decided_by_staff_id := X-User-ID; WEEKEND_OVERNIGHT consumes one allowance unit", "increments LeaveRequest.version by 1"]
      - from: PARENT_APPROVED
        to: DENIED
        trigger: "POST /reslife/leave-requests/{leave_id}/dorm-decision {decision: DENY}"
        actor: DormParent
        preconditions: ["same dorm-scope rule as approve"]
        side_effects: ["increments LeaveRequest.version by 1"]
      - from: APPROVED
        to: SIGNED_OUT
        trigger: "POST /reslife/leave-requests/{leave_id}/sign-out"
        actor: FrontDesk
        preconditions: ["now within [departs_at - 2h, departs_at + 6h] (ERR_SIGN_OUT_WINDOW)"]
        side_effects: ["signed_out_at := now; a SignEvent {event_type: SIGN_OUT, leave_request_id: this} is appended", "increments LeaveRequest.version by 1"]
      - from: SIGNED_OUT
        to: RETURNED
        trigger: "POST /reslife/leave-requests/{leave_id}/return"
        actor: FrontDesk
        preconditions: []
        side_effects: ["returned_at := now; late_return_minutes computed; SignEvent SIGN_IN appended; if late_return_minutes > 0, late_return_points assessed to Student.demerit_points and standing_reevaluation runs", "increments LeaveRequest.version by 1"]
      - from: OVERDUE
        to: RETURNED
        trigger: "POST /reslife/leave-requests/{leave_id}/return"
        actor: FrontDesk
        preconditions: []
        side_effects: ["same as SIGNED_OUT->RETURNED (late points apply)", "increments LeaveRequest.version by 1"]
      - from: SIGNED_OUT
        to: OVERDUE
        trigger: "system: logical-clock sweep when now > returns_at"
        actor: system
        preconditions: []
        side_effects: ["increments LeaveRequest.version by 1"]
      - from: APPROVED
        to: EXPIRED
        trigger: "system: logical-clock sweep when now > departs_at + 6h and never signed out"
        actor: system
        preconditions: []
        side_effects: ["allowance unit released (EXPIRED not in the counted status set)", "increments LeaveRequest.version by 1"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /reslife/leave-requests/{leave_id}/cancel, or cascade"
        actor: Student
        preconditions: ["X-User-ID == student_id for direct cancel"]
        side_effects: ["increments LeaveRequest.version by 1"]
      - from: PARENT_APPROVED
        to: CANCELLED
        trigger: "POST /reslife/leave-requests/{leave_id}/cancel, or cascade"
        actor: Student
        preconditions: ["X-User-ID == student_id for direct cancel"]
        side_effects: ["increments LeaveRequest.version by 1"]
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /reslife/leave-requests/{leave_id}/cancel, or cascade (standing SUSPENDED, term close, withdrawal)"
        actor: Student
        preconditions: ["X-User-ID == student_id for direct cancel"]
        side_effects: ["allowance unit released if one was consumed", "increments LeaveRequest.version by 1"]

  - entity: DutyShift
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, MISSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: SWAP_PENDING
        trigger: "POST /reslife/duty-shifts/{shift_id}/request-swap"
        actor: DormParent
        preconditions: ["X-User-ID == staff_id (current assignee)", "target_staff_id is an active StaffMember with staff_role DORM_PARENT, != current staff_id", "target has no other DutyShift on the same duty_date with a conflicting slot (same slot, or WEEKDAY_NIGHT vs any slot of same date)"]
        side_effects: ["swap_requested_to_id := target_staff_id", "increments DutyShift.version by 1"]
      - from: SWAP_PENDING
        to: SCHEDULED
        trigger: "POST /reslife/duty-shifts/{shift_id}/swap-respond {accept: true}"
        actor: DormParent
        preconditions: ["X-User-ID == swap_requested_to_id"]
        side_effects: ["staff_id := swap_requested_to_id; swap_requested_to_id := null (cycle back to SCHEDULED with new owner)", "increments DutyShift.version by 1"]
      - from: SWAP_PENDING
        to: SCHEDULED
        trigger: "POST /reslife/duty-shifts/{shift_id}/swap-respond {accept: false}"
        actor: DormParent
        preconditions: ["X-User-ID == swap_requested_to_id"]
        side_effects: ["staff_id unchanged; swap_requested_to_id := null", "increments DutyShift.version by 1"]
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /reslife/duty-shifts/{shift_id}/complete"
        actor: DormParent
        preconditions: ["X-User-ID == staff_id", "every student with a CONFIRMED DormAssignment in this shift's dorm (ACTIVE term) and enrollment_status == ENROLLED has a NightCheck with check_kind BED_CHECK on this shift (ERR_CHECKS_OUTSTANDING)"]
        side_effects: ["increments DutyShift.version by 1"]
      - from: SCHEDULED
        to: MISSED
        trigger: "system: logical-clock sweep when current date > duty_date and checks incomplete"
        actor: system
        preconditions: []
        side_effects: ["increments DutyShift.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: superseded by a new DutyShift created for the same dorm+duty_date+shift_slot"
        actor: system
        preconditions: []
        side_effects: ["cancel_reason := SUPERSEDED", "increments DutyShift.version by 1"]

  - entity: MedicationOrder
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED, COMPLETED]
    transitions:
      - from: ACTIVE
        to: HOLD
        trigger: "POST /reslife/medication-orders/{order_id}/hold"
        actor: Nurse
        preconditions: []
        side_effects: ["hold_reason set", "increments MedicationOrder.version by 1"]
      - from: HOLD
        to: ACTIVE
        trigger: "POST /reslife/medication-orders/{order_id}/resume"
        actor: Nurse
        preconditions: []
        side_effects: ["hold_reason := null; doses_remaining unchanged", "increments MedicationOrder.version by 1"]
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /reslife/medication-orders/{order_id}/discontinue, or cascade from student withdrawal"
        actor: Nurse
        preconditions: []
        side_effects: ["increments MedicationOrder.version by 1"]
      - from: HOLD
        to: DISCONTINUED
        trigger: "POST /reslife/medication-orders/{order_id}/discontinue"
        actor: Nurse
        preconditions: []
        side_effects: ["increments MedicationOrder.version by 1"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: auto when an ADMINISTERED MedicationAdministration brings doses_remaining to exactly 0"
        actor: system
        preconditions: []
        side_effects: ["increments MedicationOrder.version by 1"]

  - entity: DisciplineCase
    initial_state: REPORTED
    terminal_states: [DISMISSED, CLOSED]
    transitions:
      - from: REPORTED
        to: UNDER_REVIEW
        trigger: "POST /reslife/discipline-cases/{case_id}/begin-review"
        actor: Dean
        preconditions: []
        side_effects: ["increments DisciplineCase.version by 1"]
      - from: UNDER_REVIEW
        to: HEARING_SCHEDULED
        trigger: "POST /reslife/discipline-cases/{case_id}/schedule-hearing"
        actor: Dean
        preconditions: ["hearing_officer_id is an active StaffMember with staff_role DEAN", "hearing_officer_id != reported_by_staff_id (segregation of duties, ERR_REPORTER_CANNOT_ADJUDICATE)", "hearing_at is in the future (ERR_HEARING_IN_PAST)"]
        side_effects: ["increments DisciplineCase.version by 1"]
      - from: HEARING_SCHEDULED
        to: SANCTIONED
        trigger: "POST /reslife/discipline-cases/{case_id}/record-outcome {outcome: SANCTIONED}"
        actor: Dean
        preconditions: ["X-User-ID == hearing_officer_id"]
        side_effects: ["points_assessed := input points_assessed; sanction_type set; decided_at := now; Student.demerit_points += points_assessed and standing_reevaluation runs (threshold crossings cascade to standing flips and, on SUSPENDED, auto-cancel of the student's pending leaves)", "increments DisciplineCase.version by 1"]
      - from: HEARING_SCHEDULED
        to: DISMISSED
        trigger: "POST /reslife/discipline-cases/{case_id}/record-outcome {outcome: DISMISSED}"
        actor: Dean
        preconditions: ["X-User-ID == hearing_officer_id"]
        side_effects: ["decided_at := now; no points applied; case leaves the provisional-points input set", "increments DisciplineCase.version by 1"]
      - from: UNDER_REVIEW
        to: SANCTIONED
        trigger: "POST /reslife/discipline-cases/{case_id}/record-outcome {outcome: SANCTIONED} (MINOR category only)"
        actor: Dean
        preconditions: ["category == MINOR (MAJOR from UNDER_REVIEW -> ERR_HEARING_REQUIRED)", "X-User-ID != reported_by_staff_id (segregation, ERR_REPORTER_CANNOT_ADJUDICATE)"]
        side_effects: ["same point/standing side effects as HEARING_SCHEDULED->SANCTIONED", "increments DisciplineCase.version by 1"]
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /reslife/discipline-cases/{case_id}/record-outcome {outcome: DISMISSED} (MINOR category only)"
        actor: Dean
        preconditions: ["category == MINOR (MAJOR -> ERR_HEARING_REQUIRED)", "X-User-ID != reported_by_staff_id"]
        side_effects: ["decided_at := now", "increments DisciplineCase.version by 1"]
      - from: SANCTIONED
        to: APPEALED
        trigger: "POST /reslife/discipline-cases/{case_id}/appeal"
        actor: Student
        preconditions: ["X-User-ID == student_id", "appeal_count == 0 (ERR_APPEAL_LIMIT_REACHED)", "now <= decided_at + 168h (ERR_APPEAL_WINDOW_CLOSED)"]
        side_effects: ["appeal_count := 1", "increments DisciplineCase.version by 1"]
      - from: APPEALED
        to: SANCTIONED
        trigger: "POST /reslife/discipline-cases/{case_id}/appeal-decision {decision: UPHOLD}"
        actor: Dean
        preconditions: ["X-User-ID != reported_by_staff_id (segregation)"]
        side_effects: ["points_assessed := adjusted_points when provided; Student.demerit_points adjusted by the delta and standing_reevaluation runs (may flip standing down)", "increments DisciplineCase.version by 1"]
      - from: APPEALED
        to: DISMISSED
        trigger: "POST /reslife/discipline-cases/{case_id}/appeal-decision {decision: OVERTURN}"
        actor: Dean
        preconditions: ["X-User-ID != reported_by_staff_id (segregation)"]
        side_effects: ["Student.demerit_points -= points_assessed (exact reversal); points_assessed := 0; standing_reevaluation runs", "increments DisciplineCase.version by 1"]
      - from: SANCTIONED
        to: CLOSED
        trigger: "POST /reslife/discipline-cases/{case_id}/close"
        actor: Dean
        preconditions: ["appeal window passed (now > decided_at + 168h) OR appeal_count == 1"]
        side_effects: ["increments DisciplineCase.version by 1"]

  - entity: BreakPeriod
    initial_state: UPCOMING
    terminal_states: [CLOSED]
    transitions:
      - from: UPCOMING
        to: ACTIVE
        trigger: "system: logical-clock sweep when current date >= starts_on"
        actor: system
        preconditions: []
        side_effects: ["increments BreakPeriod.version by 1"]
      - from: ACTIVE
        to: CLOSED
        trigger: "system: logical-clock sweep when current date > ends_on"
        actor: system
        preconditions: []
        side_effects:
          - "BreakHousingRequests with status CHECKED_IN -> CHECKED_OUT (auto check-out at sweep)"
          - "StorageReservations with status RESERVED -> EXPIRED (fee retained, capacity released)"
          - "increments BreakPeriod.version by 1"

  - entity: BreakHousingRequest
    initial_state: REQUESTED
    terminal_states: [DENIED, CHECKED_OUT, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /reslife/break-housing-requests/{request_id}/decide {decision: APPROVE}"
        actor: Dean
        preconditions: ["BreakPeriod.status in {UPCOMING, ACTIVE}"]
        side_effects: ["break_housing_total_due calculation runs: room_charge_cents, storage_total_cents, deposit_credit_cents, fee_cents populated", "increments BreakHousingRequest.version by 1"]
      - from: REQUESTED
        to: DENIED
        trigger: "POST /reslife/break-housing-requests/{request_id}/decide {decision: DENY}"
        actor: Dean
        preconditions: []
        side_effects: ["increments BreakHousingRequest.version by 1"]
      - from: APPROVED
        to: CHECKED_IN
        trigger: "POST /reslife/break-housing-requests/{request_id}/check-in"
        actor: DormParent
        preconditions: ["BreakPeriod.status == ACTIVE (ERR_BREAK_NOT_ACTIVE)"]
        side_effects: ["increments BreakHousingRequest.version by 1"]
      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /reslife/break-housing-requests/{request_id}/check-out, or break-close sweep"
        actor: DormParent
        preconditions: []
        side_effects: ["increments BreakHousingRequest.version by 1"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "cascade from student withdrawal"
        actor: system
        preconditions: []
        side_effects: ["increments BreakHousingRequest.version by 1"]
      - from: APPROVED
        to: CANCELLED
        trigger: "cascade from student withdrawal"
        actor: system
        preconditions: []
        side_effects: ["increments BreakHousingRequest.version by 1"]

  - entity: StorageReservation
    initial_state: RESERVED
    terminal_states: [RETRIEVED, CANCELLED, EXPIRED]
    transitions:
      - from: RESERVED
        to: CHECKED_IN
        trigger: "POST /reslife/storage-reservations/{reservation_id}/check-in"
        actor: DormParent
        preconditions: ["BreakPeriod.status == ACTIVE (ERR_BREAK_NOT_ACTIVE)"]
        side_effects: ["increments StorageReservation.version by 1"]
      - from: CHECKED_IN
        to: RETRIEVED
        trigger: "POST /reslife/storage-reservations/{reservation_id}/retrieve"
        actor: DormParent
        preconditions: []
        side_effects: ["unit used_cuft recomputed (volume released)", "increments StorageReservation.version by 1"]
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /reslife/storage-reservations/{reservation_id}/cancel, or cascade from student withdrawal"
        actor: Student
        preconditions: ["X-User-ID == student_id for direct cancel"]
        side_effects: ["unit used_cuft recomputed; fee_cents removed from any future break-housing billing", "increments StorageReservation.version by 1"]
      - from: RESERVED
        to: EXPIRED
        trigger: "system: break-close sweep"
        actor: system
        preconditions: []
        side_effects: ["fee retained; unit used_cuft recomputed", "increments StorageReservation.version by 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only; serially-observable true races)
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-student
    parent_entity: Student
    write_endpoint: "POST /reslife/dorm-assignments"
    occ_field: "expected_student_version"
    description: |
      Creating a DormAssignment supersedes the student's existing PROPOSED
      assignment in the same term (old -> SUPERSEDED). A create that carries an
      expected_student_version behind the student's current version is rejected:
      the client's view of the student's assignment state is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: duty-shift-create-stale-dorm
    parent_entity: Dorm
    write_endpoint: "POST /reslife/duty-shifts"
    occ_field: "expected_dorm_version"
    description: |
      Creating a DutyShift for a dorm+duty_date+shift_slot supersedes an existing
      SCHEDULED shift for that same dorm+date+slot (old -> CANCELLED). A create
      that carries an expected_dorm_version behind the dorm's current version is
      rejected: the client's view of the dorm's rotation is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: weekend_leave_allowance
    trigger: "recomputed on read of Student and whenever grade, discipline_standing, or guardian approval changes"
    algorithm: threshold
    formula: |
      base = BASE_BY_GRADE[grade]                       # 9->4, 10->4, 11->6, 12->8
      mult = STANDING_MULT[discipline_standing]         # GOOD->1.0, PROBATION->0.5, SUSPENDED->0
      bonus = 1 if (is_international AND guardian_id -> Guardian.status == APPROVED) else 0
      allowance = min(CAP, floor(base * mult) + bonus)
    input_set: "the single Student row; guardian looked up via guardian_id"
    constants:
      CAP: 10
    precision: "integer (floor before bonus)"
    variants: []

  - name: weekend_leaves_used
    trigger: "recomputed on read of Student and on any LeaveRequest status change"
    algorithm: aggregation
    formula: |
      used = count(LeaveRequest where student_id = this student
                   AND leave_type == WEEKEND_OVERNIGHT
                   AND status IN {APPROVED, SIGNED_OUT, OVERDUE, RETURNED}
                   AND the leave's departs_at falls within the currently ACTIVE term's [starts_on, ends_on] inclusive)
    input_set: "LeaveRequests of the student; exactly the statuses above; DENIED/CANCELLED/EXPIRED and non-weekend types excluded"
    precision: "integer"
    variants: []

  - name: roommate_compatibility_score
    trigger: "on POST link-roommate, on mutual link creation at assignment create, and on PATCH of either student's questionnaire fields"
    algorithm: weighted_scoring
    formula: |
      score = 100 - (12*|a.sleep_schedule - b.sleep_schedule|
                   +  8*|a.cleanliness - b.cleanliness|
                   +  8*|a.noise_tolerance - b.noise_tolerance|
                   +  4*|a.guests_comfort - b.guests_comfort|)
      score = max(0, score)   # floor at 0
      Both linked assignments store the same score.
    input_set: "the two linked DormAssignments' students' questionnaire fields"
    precision: "integer"
    variants: []

  - name: dorm_occupancy
    trigger: "on read of Dorm and on any DormAssignment create/confirm/end/supersede"
    algorithm: aggregation
    formula: |
      physical  = count(DormAssignment in rooms of this dorm with status CONFIRMED)
      projected = physical + count(DormAssignment in rooms of this dorm with status PROPOSED)
    input_set: "DormAssignments whose room_id belongs to this dorm; CONFIRMED vs PROPOSED split is the variant axis"
    precision: "integer"
    variants:
      - name: physical
        when: "beds_available, occupancy_physical, room FULL logic"
        difference: "counts only CONFIRMED assignments"
      - name: projected
        when: "occupancy_projected field on Dorm reads"
        difference: "counts CONFIRMED + PROPOSED, so identical data yields a larger number whenever proposals exist"

  - name: curfew_lateness_points
    trigger: "on creation of a SignEvent with event_type SIGN_IN"
    algorithm: threshold
    formula: |
      curfew = (weekday(occurred_at) IN {Fri, Sat}) ? dorm.curfew_weekend : dorm.curfew_weekday
      minutes_late = max(0, occurred_at - same-day curfew) in whole minutes
      points = 0 if minutes_late == 0
             | 1 if 1 <= minutes_late <= 15
             | 2 if 16 <= minutes_late <= 60
             | 3 if minutes_late > 60
      Student.demerit_points += points; then standing_reevaluation runs.
    input_set: "the new SignEvent; the student's dorm via CONFIRMED assignment in the ACTIVE term"
    precision: "integer minutes"
    variants: []

  - name: night_check_points
    trigger: "on creation of a NightCheck"
    algorithm: threshold
    formula: |
      points = POINTS[check_kind][result]
      POINTS[BED_CHECK]  = {PRESENT:0, LATE_ARRIVAL:1, ABSENT_EXCUSED:0, ABSENT_UNEXCUSED:3}
      POINTS[STUDY_HALL] = {PRESENT:0, LATE_ARRIVAL:1, ABSENT_EXCUSED:0, ABSENT_UNEXCUSED:2}
      NightCheck.points_assessed := points
      Student.demerit_points += points; then standing_reevaluation runs.
    input_set: "the new NightCheck"
    precision: "integer"
    variants: []

  - name: standing_reevaluation
    trigger: "after any change to Student.demerit_points (night check, curfew points, sanction, appeal adjustment/overturn)"
    algorithm: threshold
    formula: |
      standing = SUSPENDED if demerit_points >= 20
               | PROBATION if demerit_points >= 10
               | GOOD      otherwise
      On transition into SUSPENDED: cascade-cancel the student's LeaveRequests in
      {REQUESTED, PARENT_APPROVED, APPROVED} with denial_reason=STANDING_SUSPENDED.
    input_set: "the single Student row's demerit_points"
    constants:
      PROBATION_AT: 10
      SUSPENDED_AT: 20
    precision: "integer; boundaries are inclusive (>=)"
    variants: []

  - name: discipline_points_dual
    trigger: "on read of Student and on any DisciplineCase status/points change"
    algorithm: aggregation
    formula: |
      official    = sum(points_assessed of cases in {SANCTIONED, CLOSED})
                  + sum(points from NightCheck.points_assessed) + sum(points from curfew_lateness_points)
      provisional = official + sum(points_proposed of cases in {REPORTED, UNDER_REVIEW, HEARING_SCHEDULED, APPEALED})
    input_set: "DisciplineCases of the student partitioned by status; event-sourced points"
    precision: "integer"
    variants:
      - name: official
        when: "discipline_standing, dorm-decision standing checks"
        difference: "only finalized sanctions and event points count"
      - name: provisional
        when: "demerit_points_provisional field on Student reads"
        difference: "adds proposed points of pending cases; identical data yields a strictly larger number whenever a case is pending"

  - name: medication_dose_ledger
    trigger: "on creation of a MedicationAdministration and on order read"
    algorithm: aggregation
    formula: |
      doses_remaining = doses_total - count(administrations of this order with outcome == ADMINISTERED)
      low_stock = (doses_remaining <= refill_threshold)
      REFUSED and OMITTED_HOLD outcomes do not decrement.
      When doses_remaining reaches exactly 0 after an ADMINISTERED row, status auto-flips to COMPLETED.
    input_set: "MedicationAdministrations of this order, filtered to outcome ADMINISTERED"
    precision: "integer; low_stock boundary is inclusive (<="
    variants: []

  - name: storage_fee_cents
    trigger: "on StorageReservation creation"
    algorithm: tiered_pricing
    formula: |
      early_bird = (created_at <= break.starts_on - 30 days)
      rate = RATE_CENTS_PER_CUFT_WEEK * (early_bird ? (1 - EARLY_BIRD_DISCOUNT) : 1)
      fee_cents = round_half_up(volume_cuft * weeks * rate)   # ROUND PER RESERVATION LINE, THEN SUM
    input_set: "the new StorageReservation; its BreakPeriod for the early-bird window"
    constants:
      RATE_CENTS_PER_CUFT_WEEK: 250
      EARLY_BIRD_DISCOUNT: 0.15
    precision: "whole cents, round_half_up PER RESERVATION; student-level totals sum the rounded line fees (sum-then-round is the rejected alternative: two early-bird 1-cuft/1-week lines total 426 cents per-line vs 425 aggregate)"
    variants: []

  - name: break_housing_total_due
    trigger: "on BreakHousingRequest approval (decide APPROVE)"
    algorithm: waterfall_allocation
    formula: |
      EVALUATION ORDER IS PINNED (removes the circularity "deposit is 10% of the total"):
        1. room_charge_cents   = ROOM_CHARGE_FLAT_CENTS
        2. storage_total_cents = sum(fee_cents of this student's StorageReservations for this break
                                     with status IN {RESERVED, CHECKED_IN, EXPIRED})   # EXPIRED keeps its fee; RETRIEVED/CANCELLED excluded
        3. deposit_credit_cents = min(DEPOSIT_CAP_CENTS, round_half_up(0.10 * (room_charge_cents + storage_total_cents)))
        4. fee_cents = room_charge_cents + storage_total_cents - deposit_credit_cents
    input_set: "the BreakHousingRequest's student's StorageReservations for the same break, status-filtered as above"
    constants:
      ROOM_CHARGE_FLAT_CENTS: 20000
      DEPOSIT_CAP_CENTS: 5000
      DEPOSIT_RATE: 0.10
    precision: "whole cents, round_half_up at step 3 only"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "acting role is in the endpoint's roles list; ownership scoping rules of section 1.7 (Student acts on own records; Parent/Guardian only for their own child/ward; DormParent dorm-scope on dorm-decision; night-check actor is the shift assignee)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path identifiers resolve left-to-right; body FK references (student_id, room_id, term_id, dorm_id, guardian_id, parent_id, break_period_id, storage_unit_id, target_staff_id, hearing_officer_id, witness_staff_id, roommate_assignment_id, leave_request_id) exist", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: business_constraint, check: "required request fields present and well-typed", error_id: ERR_MISSING_REQUIRED_FIELD, http_status: 400, applies_to: "all write endpoints" }
  - { priority: 5, category: business_constraint, check: "field value domain: enum membership, grade in 9..12, questionnaire ints in 1..5, beds in 1..4, volume/weeks/doses >= 1, returns_at > departs_at, ends_on > starts_on", error_id: ERR_INVALID_FIELD_VALUE, http_status: 422, applies_to: "all write endpoints" }
  - { priority: 6, category: state, check: "target resource is in a from-state listed for the requested transition; attempts from terminal states rejected here", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: state, check: "an ACTIVE Term exists where the operation requires one (assignment create/confirm, leave create, night checks, sign events)", error_id: ERR_TERM_NOT_ACTIVE, http_status: 409, applies_to: ["POST /reslife/dorm-assignments", "POST /reslife/dorm-assignments/{assignment_id}/confirm", "POST /reslife/leave-requests", "POST /reslife/duty-shifts/{shift_id}/night-checks", "POST /reslife/sign-events"] }
  - { priority: 8, category: state, check: "Student.enrollment_status == ENROLLED where required (leave create, storage reservation create, sign events, assignment confirm, medication order create)", error_id: ERR_STUDENT_NOT_ENROLLED, http_status: 409, applies_to: ["POST /reslife/leave-requests", "POST /reslife/storage-reservations", "POST /reslife/sign-events", "POST /reslife/dorm-assignments/{assignment_id}/confirm", "POST /reslife/medication-orders"] }
  - { priority: 9, category: state, check: "Dorm.posture == OPEN for assignment confirm and for sign-in of students without an APPROVED/CHECKED_IN break-housing request", error_id: ERR_DORM_CLOSED, http_status: 409, applies_to: ["POST /reslife/dorm-assignments/{assignment_id}/confirm", "POST /reslife/sign-events"] }
  - { priority: 10, category: state, check: "Administrations only on non-terminal orders: DISCONTINUED or COMPLETED MedicationOrder rejected here; HOLD is deliberately NOT covered by this row (handled at priority 11 so the safety error wins)", error_id: ERR_ORDER_NOT_ACTIVE, http_status: 409, applies_to: ["POST /reslife/medication-orders/{order_id}/administrations"] }
  - { priority: 11, category: business_safety, check: "MedicationOrder on HOLD must not receive administrations (distinct from generic inactive orders)", error_id: ERR_MEDICATION_ON_HOLD, http_status: 422, applies_to: ["POST /reslife/medication-orders/{order_id}/administrations"] }
  - { priority: 12, category: business_safety, check: "controlled-order ADMINISTERED rows require witness_staff_id of an active StaffMember different from the acting nurse", error_id: ERR_WITNESS_REQUIRED, http_status: 422, applies_to: ["POST /reslife/medication-orders/{order_id}/administrations"] }
  - { priority: 13, category: business_safety, check: "international student must reference an APPROVED guardian (at student creation and again at assignment confirm)", error_id: ERR_GUARDIAN_NOT_APPROVED, http_status: 422, applies_to: ["POST /reslife/students", "POST /reslife/dorm-assignments/{assignment_id}/confirm"] }
  - { priority: 14, category: business_referential, check: "uniqueness: one MedicationAdministration per (order_id, scheduled_date)", error_id: ERR_DOSE_ALREADY_LOGGED, http_status: 409, applies_to: ["POST /reslife/medication-orders/{order_id}/administrations"] }
  - { priority: 15, category: business_referential, check: "uniqueness: one NightCheck per (duty_shift_id, student_id, check_kind)", error_id: ERR_CHECK_ALREADY_RECORDED, http_status: 409, applies_to: ["POST /reslife/duty-shifts/{shift_id}/night-checks"] }
  - { priority: 16, category: business_referential, check: "uniqueness: no second ACTIVE MedicationOrder for same (student_id, medication_name, slot)", error_id: ERR_DUPLICATE_ACTIVE_ORDER, http_status: 409, applies_to: ["POST /reslife/medication-orders"] }
  - { priority: 17, category: business_referential, check: "uniqueness: one non-terminal BreakHousingRequest per (student_id, break_period_id)", error_id: ERR_DUPLICATE_BREAK_REQUEST, http_status: 409, applies_to: ["POST /reslife/break-housing-requests"] }
  - { priority: 18, category: business_referential, check: "roommate link targets a different student's assignment", error_id: ERR_SELF_ROOMMATE, http_status: 422, applies_to: ["POST /reslife/dorm-assignments", "POST /reslife/dorm-assignments/{assignment_id}/link-roommate"] }
  - { priority: 19, category: business_referential, check: "roommate link target is in the same room and same term, status PROPOSED or CONFIRMED", error_id: ERR_ROOMMATE_NOT_IN_ROOM, http_status: 422, applies_to: ["POST /reslife/dorm-assignments", "POST /reslife/dorm-assignments/{assignment_id}/link-roommate"] }
  - { priority: 20, category: business_referential, check: "Student holds no CONFIRMED DormAssignment in the ACTIVE term: required for GRADUATED transition and for confirming a second assignment", error_id: ERR_ACTIVE_ASSIGNMENT_EXISTS, http_status: 409, applies_to: ["POST /reslife/students/{student_id}/enrollment", "POST /reslife/dorm-assignments/{assignment_id}/confirm"] }
  - { priority: 21, category: business_constraint, check: "at most one ACTIVE term", error_id: ERR_ACTIVE_TERM_EXISTS, http_status: 409, applies_to: ["POST /reslife/terms/{term_id}/activate"] }
  - { priority: 22, category: business_constraint, check: "dorm gender_policy accepts student.gender", error_id: ERR_DORM_GENDER_MISMATCH, http_status: 422, applies_to: ["POST /reslife/dorm-assignments/{assignment_id}/confirm"] }
  - { priority: 23, category: business_constraint, check: "international student creation requires guardian_id present (distinct from approval check)", error_id: ERR_GUARDIAN_REQUIRED, http_status: 422, applies_to: ["POST /reslife/students"] }
  - { priority: 24, category: business_constraint, check: "segregation of duties: hearing_officer_id != reported_by_staff_id; MINOR record-outcome actor != reporter; appeal-decision actor != reporter", error_id: ERR_REPORTER_CANNOT_ADJUDICATE, http_status: 422, applies_to: ["POST /reslife/discipline-cases/{case_id}/schedule-hearing", "POST /reslife/discipline-cases/{case_id}/record-outcome", "POST /reslife/discipline-cases/{case_id}/appeal-decision"] }
  - { priority: 25, category: business_constraint, check: "MAJOR cases must pass through HEARING_SCHEDULED before record-outcome", error_id: ERR_HEARING_REQUIRED, http_status: 422, applies_to: ["POST /reslife/discipline-cases/{case_id}/record-outcome"] }
  - { priority: 26, category: business_constraint, check: "appeal_count must be 0 to file an appeal", error_id: ERR_APPEAL_LIMIT_REACHED, http_status: 422, applies_to: ["POST /reslife/discipline-cases/{case_id}/appeal"] }
  - { priority: 27, category: business_constraint, check: "only international students may request break housing", error_id: ERR_NOT_ELIGIBLE_BREAK_HOUSING, http_status: 422, applies_to: ["POST /reslife/break-housing-requests"] }
  - { priority: 28, category: business_constraint, check: "student has a CONFIRMED DormAssignment in the relevant dorm/term (night check target, sign-in curfew lookup, dorm-decision scope)", error_id: ERR_NOT_RESIDENT, http_status: 422, applies_to: ["POST /reslife/duty-shifts/{shift_id}/night-checks", "POST /reslife/sign-events"] }
  - { priority: 29, category: business_constraint, check: "dorm-decision requires the student to hold a CONFIRMED assignment in the ACTIVE term (distinct error from not-resident-in-my-dorm scope failures, which surface as ERR_FORBIDDEN)", error_id: ERR_NO_CONFIRMED_RESIDENCY, http_status: 409, applies_to: ["POST /reslife/leave-requests/{leave_id}/dorm-decision"] }
  - { priority: 30, category: business_constraint, check: "duty-shift completion requires BED_CHECK NightChecks for every ENROLLED resident of the dorm", error_id: ERR_CHECKS_OUTSTANDING, http_status: 409, applies_to: ["POST /reslife/duty-shifts/{shift_id}/complete"] }
  - { priority: 31, category: business_constraint, check: "swap target eligibility: active DORM_PARENT, not the current assignee, no conflicting shift that date", error_id: ERR_SWAP_TARGET_INELIGIBLE, http_status: 422, applies_to: ["POST /reslife/duty-shifts/{shift_id}/request-swap"] }
  - { priority: 32, category: business_constraint, check: "room block requires zero current occupants", error_id: ERR_ROOM_OCCUPIED, http_status: 409, applies_to: ["POST /reslife/rooms/{room_id}/block"] }
  - { priority: 33, category: business_temporal, check: "leave window half-open overlap: for the same student, non-terminal leaves' [departs_at, returns_at) intervals must not intersect; touching endpoints allowed", error_id: ERR_LEAVE_WINDOW_OVERLAP, http_status: 409, applies_to: ["POST /reslife/leave-requests"] }
  - { priority: 34, category: business_temporal, check: "departs_at must be in the future", error_id: ERR_LEAVE_IN_PAST, http_status: 422, applies_to: ["POST /reslife/leave-requests"] }
  - { priority: 35, category: business_temporal, check: "hearing_at must be in the future", error_id: ERR_HEARING_IN_PAST, http_status: 422, applies_to: ["POST /reslife/discipline-cases/{case_id}/schedule-hearing"] }
  - { priority: 36, category: business_temporal, check: "appeal must be filed within 168h of decided_at", error_id: ERR_APPEAL_WINDOW_CLOSED, http_status: 422, applies_to: ["POST /reslife/discipline-cases/{case_id}/appeal"] }
  - { priority: 37, category: business_temporal, check: "sign-out only within [departs_at - 2h, departs_at + 6h]", error_id: ERR_SIGN_OUT_WINDOW, http_status: 422, applies_to: ["POST /reslife/leave-requests/{leave_id}/sign-out"] }
  - { priority: 38, category: business_temporal, check: "a staff member may not hold two non-CANCELLED DutyShifts on the same duty_date with conflicting slots (same slot always conflicts; WEEKEND_DAY and WEEKEND_NIGHT do not conflict with each other; WEEKDAY_NIGHT conflicts only with WEEKDAY_NIGHT); on create, the shift being superseded by this very request is excluded from the conflict set. OCC version check on the parent is evaluated before this rule.", error_id: ERR_SHIFT_CONFLICT, http_status: 409, applies_to: ["POST /reslife/duty-shifts", "POST /reslife/duty-shifts/{shift_id}/request-swap"] }
  - { priority: 39, category: business_temporal, check: "break-housing/storage check-in only while BreakPeriod.status == ACTIVE", error_id: ERR_BREAK_NOT_ACTIVE, http_status: 409, applies_to: ["POST /reslife/break-housing-requests/{request_id}/check-in", "POST /reslife/storage-reservations/{reservation_id}/check-in"] }
  - { priority: 40, category: business_fiscal, check: "WEEKEND_OVERNIGHT leave requires weekend_leaves_used < weekend_leave_allowance (checked at create and re-checked at dorm approval)", error_id: ERR_LEAVE_ALLOWANCE_EXHAUSTED, http_status: 422, applies_to: ["POST /reslife/leave-requests", "POST /reslife/leave-requests/{leave_id}/dorm-decision"] }
  - { priority: 41, category: business_fiscal, check: "room has beds_available >= 1 at confirm", error_id: ERR_ROOM_FULL, http_status: 422, applies_to: ["POST /reslife/dorm-assignments/{assignment_id}/confirm"] }
  - { priority: 42, category: business_fiscal, check: "guardian wards_assigned < max_wards when a new ward is assigned", error_id: ERR_GUARDIAN_AT_CAPACITY, http_status: 422, applies_to: ["POST /reslife/students"] }
  - { priority: 43, category: business_fiscal, check: "storage aggregate capacity: sum(volume_cuft of reservations in {RESERVED, CHECKED_IN} for the same unit AND same break) + new volume <= capacity_cuft", error_id: ERR_STORAGE_CAPACITY_EXCEEDED, http_status: 422, applies_to: ["POST /reslife/storage-reservations"] }
  - { priority: 44, category: state, check: "StorageUnit.status == OPEN for new reservations; SEALED rejects", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: ["POST /reslife/storage-reservations"] }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving; default time 2026-08-01T00:00:00Z) ---
  - { method: POST, path: "/reslife/_clock/set_current_utc", description: "Advance the logical clock; server starts at exactly 2026-08-01T00:00:00Z before any set call (never wall-clock). Side effects run all time-based sweeps: leave EXPIRED/OVERDUE marking, BreakPeriod UPCOMING->ACTIVE->CLOSED with its cascades (CHECKED_IN housing -> CHECKED_OUT, RESERVED storage -> EXPIRED), DutyShift SCHEDULED -> MISSED past duty_date.", roles: [SchoolAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["time-based sweeps per description"] }

  # --- Terms ---
  - { method: POST, path: "/reslife/terms", description: "Create a term (status UPCOMING)", roles: [SchoolAdmin], code: 201, input: [name, starts_on, ends_on], output: Term, side_effects: [] }
  - { method: GET, path: "/reslife/terms", description: "List terms", roles: [SchoolAdmin, DormParent, Nurse, Dean, FrontDesk], code: 200, input: ["status?"], output: "Term[]", side_effects: [] }
  - { method: GET, path: "/reslife/terms/{term_id}", description: "Get a term", roles: [SchoolAdmin, DormParent, Nurse, Dean, FrontDesk], code: 200, input: [], output: Term, side_effects: [] }
  - { method: POST, path: "/reslife/terms/{term_id}/activate", description: "Activate term (UPCOMING->ACTIVE); fails if another term is ACTIVE", roles: [SchoolAdmin], code: 200, input: [], output: Term, side_effects: ["Term.status -> ACTIVE", "increments Term.version by 1"] }
  - { method: POST, path: "/reslife/terms/{term_id}/close", description: "Close term; cascades end assignments, clear roommate links, recompute rooms, cancel pending leaves", roles: [SchoolAdmin], code: 200, input: [], output: Term, side_effects: ["Term.status -> CLOSED", "assignment/roommate/room/leave cascade per state machine", "increments Term.version by 1"] }

  # --- Dorms ---
  - { method: POST, path: "/reslife/dorms", description: "Create a dorm", roles: [SchoolAdmin], code: 201, input: [name, gender_policy, curfew_weekday, curfew_weekend], output: Dorm, side_effects: ["posture=OPEN, counters zero"] }
  - { method: GET, path: "/reslife/dorms", description: "List dorms", roles: [SchoolAdmin, DormParent, Nurse, Dean, FrontDesk, Student], code: 200, input: ["posture?"], output: "Dorm[]", side_effects: [] }
  - { method: GET, path: "/reslife/dorms/{dorm_id}", description: "Get a dorm with computed occupancy fields", roles: [SchoolAdmin, DormParent, Nurse, Dean, FrontDesk, Student], code: 200, input: [], output: Dorm, side_effects: [] }
  - { method: POST, path: "/reslife/dorms/{dorm_id}/close-for-break", description: "Set posture CLOSED_FOR_BREAK; requires an ACTIVE BreakPeriod", roles: [SchoolAdmin], code: 200, input: [], output: Dorm, side_effects: ["Dorm.posture -> CLOSED_FOR_BREAK", "increments Dorm.version by 1"] }
  - { method: POST, path: "/reslife/dorms/{dorm_id}/reopen", description: "Set posture OPEN", roles: [SchoolAdmin], code: 200, input: [], output: Dorm, side_effects: ["Dorm.posture -> OPEN", "increments Dorm.version by 1"] }

  # --- Rooms ---
  - { method: POST, path: "/reslife/rooms", description: "Create a room in a dorm", roles: [SchoolAdmin], code: 201, input: [dorm_id, room_number, beds], output: Room, side_effects: ["status=AVAILABLE, beds_assigned=0"] }
  - { method: GET, path: "/reslife/rooms", description: "List rooms (FK reverse-reachability for Room.dorm_id)", roles: [SchoolAdmin, DormParent, Nurse, Dean, FrontDesk], code: 200, input: ["dorm_id?", "status?"], output: "Room[]", side_effects: [] }
  - { method: GET, path: "/reslife/rooms/{room_id}", description: "Get a room", roles: [SchoolAdmin, DormParent, Nurse, Dean, FrontDesk], code: 200, input: [], output: Room, side_effects: [] }
  - { method: POST, path: "/reslife/rooms/{room_id}/block", description: "Block an empty room (maintenance)", roles: [SchoolAdmin], code: 200, input: [], output: Room, side_effects: ["Room.status -> BLOCKED", "increments Room.version by 1"] }
  - { method: POST, path: "/reslife/rooms/{room_id}/unblock", description: "Unblock a room", roles: [SchoolAdmin], code: 200, input: [], output: Room, side_effects: ["Room.status -> AVAILABLE", "increments Room.version by 1"] }

  # --- Parents / Guardians / Staff ---
  - { method: POST, path: "/reslife/parents", description: "Create a parent record", roles: [SchoolAdmin], code: 201, input: [full_name, email], output: Parent, side_effects: [] }
  - { method: GET, path: "/reslife/parents/{parent_id}", description: "Get a parent", roles: [SchoolAdmin, Dean, DormParent], code: 200, input: [], output: Parent, side_effects: [] }
  - { method: POST, path: "/reslife/guardians", description: "Create a guardian (status PENDING)", roles: [SchoolAdmin], code: 201, input: [full_name, email, city, "max_wards?"], output: Guardian, side_effects: ["status=PENDING, wards_assigned=0"] }
  - { method: GET, path: "/reslife/guardians", description: "List guardians", roles: [SchoolAdmin, Dean, DormParent], code: 200, input: ["status?"], output: "Guardian[]", side_effects: [] }
  - { method: GET, path: "/reslife/guardians/{guardian_id}", description: "Get a guardian", roles: [SchoolAdmin, Dean, DormParent], code: 200, input: [], output: Guardian, side_effects: [] }
  - { method: POST, path: "/reslife/guardians/{guardian_id}/approve", description: "Approve guardian (PENDING->APPROVED)", roles: [SchoolAdmin], code: 200, input: [], output: Guardian, side_effects: ["Guardian.status -> APPROVED; wards' weekend_leave_allowance gains the international bonus", "increments Guardian.version by 1"] }
  - { method: POST, path: "/reslife/guardians/{guardian_id}/suspend", description: "Suspend guardian; wards' REQUESTED leaves are auto-DENIED (reason GUARDIAN_SUSPENDED) and future family decisions route to a Dean proxy", roles: [SchoolAdmin], code: 200, input: [], output: Guardian, side_effects: ["Guardian.status -> SUSPENDED", "wards' LeaveRequests in REQUESTED -> DENIED (denial_reason=GUARDIAN_SUSPENDED)", "wards' weekend_leave_allowance loses the bonus", "increments Guardian.version by 1"] }
  - { method: POST, path: "/reslife/staff", description: "Create a staff member", roles: [SchoolAdmin], code: 201, input: [full_name, staff_role, "dorm_id?", "is_active?"], output: StaffMember, side_effects: [] }
  - { method: GET, path: "/reslife/staff", description: "List staff (FK reverse-reachability for StaffMember.dorm_id)", roles: [SchoolAdmin, DormParent, Nurse, Dean, FrontDesk], code: 200, input: ["dorm_id?", "staff_role?", "is_active?"], output: "StaffMember[]", side_effects: [] }
  - { method: GET, path: "/reslife/staff/{staff_id}", description: "Get a staff member", roles: [SchoolAdmin, DormParent, Nurse, Dean, FrontDesk], code: 200, input: [], output: StaffMember, side_effects: [] }

  # --- Students ---
  - { method: POST, path: "/reslife/students", description: "Create a student with roommate questionnaire", roles: [SchoolAdmin], code: 201, input: [legal_name, grade, gender, is_international, parent_id, "guardian_id?", sleep_schedule, cleanliness, noise_tolerance, guests_comfort], output: Student, side_effects: ["enrollment_status=ENROLLED, standing=GOOD, points 0", "guardian wards_assigned recomputed"] }
  - { method: GET, path: "/reslife/students", description: "List students (FK reverse-reachability for parent_id/guardian_id)", roles: [SchoolAdmin, DormParent, Nurse, Dean, FrontDesk], code: 200, input: ["parent_id?", "guardian_id?", "grade?", "discipline_standing?", "enrollment_status?"], output: "Student[]", side_effects: [] }
  - { method: GET, path: "/reslife/students/{student_id}", description: "Get a student with computed standing/points/allowance fields", roles: [SchoolAdmin, DormParent, Nurse, Dean, FrontDesk, Student, Parent, Guardian], code: 200, input: [], output: Student, side_effects: [] }
  - { method: PATCH, path: "/reslife/students/{student_id}", description: "Update grade/questionnaire; questionnaire changes recompute compatibility_score on any linked assignment pair", roles: [SchoolAdmin], code: 200, input: ["grade?", "sleep_schedule?", "cleanliness?", "noise_tolerance?", "guests_comfort?"], output: Student, side_effects: ["recompute roommate_compatibility_score on linked DormAssignment pair if any", "recompute weekend_leave_allowance when grade changes", "increments Student.version by 1"] }
  - { method: POST, path: "/reslife/students/{student_id}/enrollment", description: "Enrollment transitions (ENROLLED<->ON_LEAVE, ->WITHDRAWN, ->GRADUATED); WITHDRAWN cascades", roles: [SchoolAdmin], code: 200, input: [to_status], output: Student, side_effects: ["per Student state machine including the WITHDRAWN cascade", "increments Student.version by 1"] }

  # --- Dorm assignments ---
  - { method: POST, path: "/reslife/dorm-assignments", description: "Propose an assignment (OCC on Student); supersedes the student's existing PROPOSED assignment in the same term", roles: [SchoolAdmin], code: 201, input: [student_id, room_id, term_id, expected_student_version, "roommate_assignment_id?"], output: DormAssignment, side_effects: ["existing PROPOSED assignments of this student in this term -> SUPERSEDED (roommate links cleared)", "optional roommate link set mutually with compatibility_score computed", "increments Student.version by 1"] }
  - { method: GET, path: "/reslife/dorm-assignments", description: "List assignments (FK reverse-reachability for student_id/room_id/term_id/roommate_assignment_id)", roles: [SchoolAdmin, DormParent, Dean], code: 200, input: ["student_id?", "room_id?", "term_id?", "status?", "roommate_assignment_id?"], output: "DormAssignment[]", side_effects: [] }
  - { method: GET, path: "/reslife/dorm-assignments/{assignment_id}", description: "Get an assignment", roles: [SchoolAdmin, DormParent, Dean, Student], code: 200, input: [], output: DormAssignment, side_effects: [] }
  - { method: POST, path: "/reslife/dorm-assignments/{assignment_id}/confirm", description: "Confirm a PROPOSED assignment (residency/gender/guardian/capacity gates)", roles: [SchoolAdmin], code: 200, input: [], output: DormAssignment, side_effects: ["status -> CONFIRMED, check_in_at=now", "Room.beds_assigned += 1 and FULL auto-flip", "increments DormAssignment.version by 1"] }
  - { method: POST, path: "/reslife/dorm-assignments/{assignment_id}/end", description: "End a CONFIRMED assignment", roles: [SchoolAdmin], code: 200, input: [], output: DormAssignment, side_effects: ["status -> ENDED, check_out_at=now", "Room.beds_assigned -= 1 and AVAILABLE auto-flip", "roommate link cleared on partner", "increments DormAssignment.version by 1"] }
  - { method: POST, path: "/reslife/dorm-assignments/{assignment_id}/link-roommate", description: "Mutually link two same-room same-term assignments and compute compatibility", roles: [SchoolAdmin], code: 200, input: [roommate_assignment_id], output: DormAssignment, side_effects: ["both assignments' roommate_assignment_id set", "compatibility_score computed on both", "increments DormAssignment.version by 1"] }

  # --- Leave requests ---
  - { method: POST, path: "/reslife/leave-requests", description: "Student files a leave request (acting student is the subject)", roles: [Student], code: 201, input: [leave_type, destination, departs_at, returns_at], output: LeaveRequest, side_effects: ["status=REQUESTED"] }
  - { method: GET, path: "/reslife/leave-requests", description: "List leave requests (FK reverse-reachability for student_id)", roles: [SchoolAdmin, DormParent, Dean, Student, Parent, Guardian], code: 200, input: ["student_id?", "status?", "leave_type?"], output: "LeaveRequest[]", side_effects: [] }
  - { method: GET, path: "/reslife/leave-requests/{leave_id}", description: "Get a leave request", roles: [SchoolAdmin, DormParent, Dean, Student, Parent, Guardian], code: 200, input: [], output: LeaveRequest, side_effects: [] }
  - { method: POST, path: "/reslife/leave-requests/{leave_id}/parent-decision", description: "Family decision: Parent for domestic, Guardian for international, Dean proxy when guardian SUSPENDED", roles: [Parent, Guardian, Dean], code: 200, input: [decision, "denial_reason?"], output: LeaveRequest, side_effects: ["REQUESTED -> PARENT_APPROVED or DENIED", "increments LeaveRequest.version by 1"] }
  - { method: POST, path: "/reslife/leave-requests/{leave_id}/dorm-decision", description: "Dorm-parent decision; dorm-scoped; re-checks standing, residency, allowance", roles: [DormParent], code: 200, input: [decision, "denial_reason?"], output: LeaveRequest, side_effects: ["PARENT_APPROVED -> APPROVED or DENIED", "WEEKEND_OVERNIGHT consumes one allowance unit on APPROVE", "increments LeaveRequest.version by 1"] }
  - { method: POST, path: "/reslife/leave-requests/{leave_id}/cancel", description: "Student cancels own non-terminal leave before sign-out", roles: [Student], code: 200, input: [], output: LeaveRequest, side_effects: ["-> CANCELLED; consumed allowance unit released", "increments LeaveRequest.version by 1"] }
  - { method: POST, path: "/reslife/leave-requests/{leave_id}/sign-out", description: "Record departure within the grace window; appends SIGN_OUT SignEvent", roles: [FrontDesk, DormParent], code: 200, input: [], output: LeaveRequest, side_effects: ["APPROVED -> SIGNED_OUT", "SignEvent appended", "increments LeaveRequest.version by 1"] }
  - { method: POST, path: "/reslife/leave-requests/{leave_id}/return", description: "Record return; appends SIGN_IN SignEvent; late returns assess points via curfew-independent late_return ladder", roles: [FrontDesk, DormParent], code: 200, input: [], output: LeaveRequest, side_effects: ["SIGNED_OUT/OVERDUE -> RETURNED", "late_return_minutes computed; points = 0 if 0, 1 if 1-15, 2 if 16-60, 3 if >60 added to Student.demerit_points; standing_reevaluation runs", "increments LeaveRequest.version by 1"] }

  # --- Sign events ---
  - { method: POST, path: "/reslife/sign-events", description: "Record a campus sign-out/sign-in; SIGN_IN computes curfew minutes_late and assesses late points", roles: [FrontDesk, DormParent], code: 201, input: [student_id, event_type, "occurred_at?", "leave_request_id?"], output: SignEvent, side_effects: ["SIGN_IN: minutes_late computed vs dorm curfew; curfew_lateness_points added to Student.demerit_points; standing_reevaluation runs"] }
  - { method: GET, path: "/reslife/sign-events", description: "List sign events (FK reverse-reachability)", roles: [SchoolAdmin, DormParent, Dean, FrontDesk, Student], code: 200, input: ["student_id?", "leave_request_id?", "recorded_by_staff_id?", "event_type?"], output: "SignEvent[]", side_effects: [] }
  - { method: GET, path: "/reslife/sign-events/{event_id}", description: "Get a sign event", roles: [SchoolAdmin, DormParent, Dean, FrontDesk, Student], code: 200, input: [], output: SignEvent, side_effects: [] }

  # --- Duty shifts & night checks ---
  - { method: POST, path: "/reslife/duty-shifts", description: "Schedule a duty shift (OCC on Dorm); supersedes an existing SCHEDULED shift for the same dorm+duty_date+shift_slot", roles: [SchoolAdmin], code: 201, input: [dorm_id, staff_id, duty_date, shift_slot, expected_dorm_version], output: DutyShift, side_effects: ["existing SCHEDULED shift for same dorm+date+slot -> CANCELLED (reason SUPERSEDED)", "increments Dorm.version by 1"] }
  - { method: GET, path: "/reslife/duty-shifts", description: "List duty shifts (FK reverse-reachability)", roles: [SchoolAdmin, DormParent, Dean], code: 200, input: ["dorm_id?", "staff_id?", "duty_date?", "status?", "swap_requested_to_id?"], output: "DutyShift[]", side_effects: [] }
  - { method: GET, path: "/reslife/duty-shifts/{shift_id}", description: "Get a duty shift", roles: [SchoolAdmin, DormParent, Dean], code: 200, input: [], output: DutyShift, side_effects: [] }
  - { method: POST, path: "/reslife/duty-shifts/{shift_id}/request-swap", description: "Current assignee requests a swap to another eligible dorm parent", roles: [DormParent], code: 200, input: [target_staff_id], output: DutyShift, side_effects: ["SCHEDULED -> SWAP_PENDING", "increments DutyShift.version by 1"] }
  - { method: POST, path: "/reslife/duty-shifts/{shift_id}/swap-respond", description: "Swap target accepts (ownership moves, status back to SCHEDULED) or declines (owner unchanged)", roles: [DormParent], code: 200, input: [accept], output: DutyShift, side_effects: ["SWAP_PENDING -> SCHEDULED", "increments DutyShift.version by 1"] }
  - { method: POST, path: "/reslife/duty-shifts/{shift_id}/complete", description: "Complete a shift once every ENROLLED resident has a BED_CHECK NightCheck", roles: [DormParent], code: 200, input: [], output: DutyShift, side_effects: ["SCHEDULED -> COMPLETED", "increments DutyShift.version by 1"] }
  - { method: POST, path: "/reslife/duty-shifts/{shift_id}/night-checks", description: "Record a bed-check or study-hall result; assesses points via night_check_points and runs standing_reevaluation", roles: [DormParent], code: 201, input: [student_id, check_kind, result], output: NightCheck, side_effects: ["points_assessed computed", "Student.demerit_points += points", "standing_reevaluation cascade (may flip standing and auto-cancel leaves on SUSPENDED)"] }
  - { method: GET, path: "/reslife/night-checks", description: "List night checks (FK reverse-reachability)", roles: [SchoolAdmin, DormParent, Dean], code: 200, input: ["duty_shift_id?", "student_id?", "check_kind?", "result?"], output: "NightCheck[]", side_effects: [] }
  - { method: GET, path: "/reslife/night-checks/{check_id}", description: "Get a night check", roles: [SchoolAdmin, DormParent, Dean], code: 200, input: [], output: NightCheck, side_effects: [] }

  # --- Health center ---
  - { method: POST, path: "/reslife/medication-orders", description: "Create a medication order (Nurse); student must be ENROLLED", roles: [Nurse], code: 201, input: [student_id, medication_name, dose_mg, slot, doses_total, "refill_threshold?", is_controlled, prescriber_name], output: MedicationOrder, side_effects: ["status=ACTIVE; doses_remaining=doses_total"] }
  - { method: GET, path: "/reslife/medication-orders", description: "List medication orders (FK reverse-reachability for student_id)", roles: [SchoolAdmin, Nurse, Dean], code: 200, input: ["student_id?", "status?"], output: "MedicationOrder[]", side_effects: [] }
  - { method: GET, path: "/reslife/medication-orders/{order_id}", description: "Get a medication order", roles: [SchoolAdmin, Nurse, Dean], code: 200, input: [], output: MedicationOrder, side_effects: [] }
  - { method: POST, path: "/reslife/medication-orders/{order_id}/hold", description: "Place order on HOLD (safety stop)", roles: [Nurse], code: 200, input: [reason], output: MedicationOrder, side_effects: ["ACTIVE -> HOLD", "increments MedicationOrder.version by 1"] }
  - { method: POST, path: "/reslife/medication-orders/{order_id}/resume", description: "Resume a HOLD order; doses_remaining unchanged", roles: [Nurse], code: 200, input: [], output: MedicationOrder, side_effects: ["HOLD -> ACTIVE", "increments MedicationOrder.version by 1"] }
  - { method: POST, path: "/reslife/medication-orders/{order_id}/discontinue", description: "Discontinue an order", roles: [Nurse], code: 200, input: [], output: MedicationOrder, side_effects: ["ACTIVE/HOLD -> DISCONTINUED", "increments MedicationOrder.version by 1"] }
  - { method: POST, path: "/reslife/medication-orders/{order_id}/administrations", description: "Record a dose outcome for a scheduled date; ADMINISTERED decrements doses_remaining; auto-COMPLETED at exactly 0", roles: [Nurse], code: 201, input: [scheduled_date, outcome, "witness_staff_id?", "notes?"], output: MedicationAdministration, side_effects: ["medication_dose_ledger recompute", "auto-COMPLETED at doses_remaining == 0", "low_stock recompute"] }
  - { method: GET, path: "/reslife/medication-administrations", description: "List administrations (FK reverse-reachability)", roles: [SchoolAdmin, Nurse, Dean], code: 200, input: ["order_id?", "administered_by_staff_id?", "witness_staff_id?"], output: "MedicationAdministration[]", side_effects: [] }
  - { method: GET, path: "/reslife/medication-administrations/{administration_id}", description: "Get an administration", roles: [SchoolAdmin, Nurse, Dean], code: 200, input: [], output: MedicationAdministration, side_effects: [] }
  - { method: GET, path: "/reslife/medication-orders/{order_id}/administrations", description: "List administrations of one order (sub-resource form)", roles: [SchoolAdmin, Nurse, Dean], code: 200, input: [], output: "MedicationAdministration[]", side_effects: [] }

  # --- Discipline ---
  - { method: POST, path: "/reslife/discipline-cases", description: "Report a discipline case; reporter is the acting Dean/DormParent (X-User-ID)", roles: [Dean, DormParent], code: 201, input: [student_id, category, description, points_proposed], output: DisciplineCase, side_effects: ["status=REPORTED; reported_by_staff_id := X-User-ID"] }
  - { method: GET, path: "/reslife/discipline-cases", description: "List discipline cases (FK reverse-reachability)", roles: [SchoolAdmin, Dean, DormParent], code: 200, input: ["student_id?", "status?", "reported_by_staff_id?", "hearing_officer_id?"], output: "DisciplineCase[]", side_effects: [] }
  - { method: GET, path: "/reslife/discipline-cases/{case_id}", description: "Get a discipline case", roles: [SchoolAdmin, Dean, DormParent, Student], code: 200, input: [], output: DisciplineCase, side_effects: [] }
  - { method: POST, path: "/reslife/discipline-cases/{case_id}/begin-review", description: "REPORTED -> UNDER_REVIEW", roles: [Dean], code: 200, input: [], output: DisciplineCase, side_effects: ["increments DisciplineCase.version by 1"] }
  - { method: POST, path: "/reslife/discipline-cases/{case_id}/schedule-hearing", description: "UNDER_REVIEW -> HEARING_SCHEDULED; segregation: officer != reporter", roles: [Dean], code: 200, input: [hearing_at, hearing_officer_id], output: DisciplineCase, side_effects: ["increments DisciplineCase.version by 1"] }
  - { method: POST, path: "/reslife/discipline-cases/{case_id}/record-outcome", description: "Record SANCTIONED (applies points + standing cascade) or DISMISSED; MAJOR requires HEARING_SCHEDULED, MINOR allowed from UNDER_REVIEW", roles: [Dean], code: 200, input: [outcome, "sanction_type?", "points_assessed?"], output: DisciplineCase, side_effects: ["points applied; decided_at set; standing_reevaluation cascade", "increments DisciplineCase.version by 1"] }
  - { method: POST, path: "/reslife/discipline-cases/{case_id}/appeal", description: "Student appeals a SANCTIONED case within 168h; one appeal max", roles: [Student], code: 200, input: [], output: DisciplineCase, side_effects: ["SANCTIONED -> APPEALED; appeal_count := 1", "increments DisciplineCase.version by 1"] }
  - { method: POST, path: "/reslife/discipline-cases/{case_id}/appeal-decision", description: "Dean (not the reporter) upholds (optionally adjusting points) or overturns (points revoked)", roles: [Dean], code: 200, input: [decision, "adjusted_points?"], output: DisciplineCase, side_effects: ["APPEALED -> SANCTIONED or DISMISSED; points delta applied; standing_reevaluation runs", "increments DisciplineCase.version by 1"] }
  - { method: POST, path: "/reslife/discipline-cases/{case_id}/close", description: "Close a SANCTIONED case after the appeal window or decided appeal", roles: [Dean], code: 200, input: [], output: DisciplineCase, side_effects: ["SANCTIONED -> CLOSED", "increments DisciplineCase.version by 1"] }

  # --- Breaks & break housing ---
  - { method: POST, path: "/reslife/break-periods", description: "Create a break period (UPCOMING)", roles: [SchoolAdmin], code: 201, input: [name, kind, starts_on, ends_on, housing_available], output: BreakPeriod, side_effects: ["status=UPCOMING"] }
  - { method: GET, path: "/reslife/break-periods", description: "List break periods", roles: [SchoolAdmin, DormParent, Nurse, Dean, FrontDesk, Student], code: 200, input: ["status?", "kind?"], output: "BreakPeriod[]", side_effects: [] }
  - { method: GET, path: "/reslife/break-periods/{break_id}", description: "Get a break period", roles: [SchoolAdmin, DormParent, Nurse, Dean, FrontDesk, Student], code: 200, input: [], output: BreakPeriod, side_effects: [] }
  - { method: POST, path: "/reslife/break-housing-requests", description: "International student requests break housing", roles: [Student], code: 201, input: [break_period_id, "reason?"], output: BreakHousingRequest, side_effects: ["status=REQUESTED"] }
  - { method: GET, path: "/reslife/break-housing-requests", description: "List break-housing requests (FK reverse-reachability)", roles: [SchoolAdmin, Dean, DormParent, Student], code: 200, input: ["student_id?", "break_period_id?", "status?", "room_id?"], output: "BreakHousingRequest[]", side_effects: [] }
  - { method: GET, path: "/reslife/break-housing-requests/{request_id}", description: "Get a break-housing request", roles: [SchoolAdmin, Dean, DormParent, Student], code: 200, input: [], output: BreakHousingRequest, side_effects: [] }
  - { method: POST, path: "/reslife/break-housing-requests/{request_id}/decide", description: "Approve (computes the pinned-order fee breakdown) or deny", roles: [Dean, SchoolAdmin], code: 200, input: [decision], output: BreakHousingRequest, side_effects: ["REQUESTED -> APPROVED/DENIED", "break_housing_total_due fields populated on APPROVE", "increments BreakHousingRequest.version by 1"] }
  - { method: POST, path: "/reslife/break-housing-requests/{request_id}/check-in", description: "Check into break housing while the break is ACTIVE", roles: [DormParent], code: 200, input: [], output: BreakHousingRequest, side_effects: ["APPROVED -> CHECKED_IN", "increments BreakHousingRequest.version by 1"] }
  - { method: POST, path: "/reslife/break-housing-requests/{request_id}/check-out", description: "Check out of break housing", roles: [DormParent], code: 200, input: [], output: BreakHousingRequest, side_effects: ["CHECKED_IN -> CHECKED_OUT", "increments BreakHousingRequest.version by 1"] }

  # --- Storage ---
  - { method: POST, path: "/reslife/storage-units", description: "Create a storage unit (OPEN)", roles: [SchoolAdmin], code: 201, input: [label, capacity_cuft], output: StorageUnit, side_effects: ["status=OPEN, used_cuft=0"] }
  - { method: GET, path: "/reslife/storage-units", description: "List storage units", roles: [SchoolAdmin, DormParent, FrontDesk, Dean, Student], code: 200, input: ["status?"], output: "StorageUnit[]", side_effects: [] }
  - { method: GET, path: "/reslife/storage-units/{unit_id}", description: "Get a storage unit with used_cuft", roles: [SchoolAdmin, DormParent, FrontDesk, Dean, Student], code: 200, input: [], output: StorageUnit, side_effects: [] }
  - { method: POST, path: "/reslife/storage-reservations", description: "Reserve storage for a break; aggregate capacity check; per-line fee rounding", roles: [Student], code: 201, input: [storage_unit_id, break_period_id, volume_cuft, weeks, items_description], output: StorageReservation, side_effects: ["fee_cents computed per storage_fee_cents", "unit used_cuft recomputed"] }
  - { method: GET, path: "/reslife/storage-reservations", description: "List storage reservations (FK reverse-reachability)", roles: [SchoolAdmin, DormParent, FrontDesk, Student], code: 200, input: ["storage_unit_id?", "student_id?", "break_period_id?", "status?"], output: "StorageReservation[]", side_effects: [] }
  - { method: GET, path: "/reslife/storage-reservations/{reservation_id}", description: "Get a storage reservation", roles: [SchoolAdmin, DormParent, FrontDesk, Student], code: 200, input: [], output: StorageReservation, side_effects: [] }
  - { method: POST, path: "/reslife/storage-reservations/{reservation_id}/check-in", description: "Check stored items in while the break is ACTIVE", roles: [DormParent, FrontDesk], code: 200, input: [], output: StorageReservation, side_effects: ["RESERVED -> CHECKED_IN", "increments StorageReservation.version by 1"] }
  - { method: POST, path: "/reslife/storage-reservations/{reservation_id}/retrieve", description: "Retrieve stored items; capacity released", roles: [DormParent, FrontDesk], code: 200, input: [], output: StorageReservation, side_effects: ["CHECKED_IN -> RETRIEVED; used_cuft recomputed", "increments StorageReservation.version by 1"] }
  - { method: POST, path: "/reslife/storage-reservations/{reservation_id}/cancel", description: "Student cancels a RESERVED reservation; capacity released and fee dropped", roles: [Student], code: 200, input: [], output: StorageReservation, side_effects: ["RESERVED -> CANCELLED; used_cuft recomputed", "increments StorageReservation.version by 1"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on endpoint, or ownership/scope rule violated (wrong parent/guardian, dorm-parent outside student's dorm, night-check by non-assignee, cancel by non-owner)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not resolve" }
  - { id: ERR_MISSING_REQUIRED_FIELD, http: 400, condition: "Required request field absent or malformed" }
  - { id: ERR_INVALID_FIELD_VALUE, http: 422, condition: "Field outside its domain (enum membership, ranges, returns_at <= departs_at, ends_on <= starts_on)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a from-state for the requested transition (incl. terminal-state attempts and SEALED storage unit)" }
  - { id: ERR_TERM_NOT_ACTIVE, http: 409, condition: "Operation requires an ACTIVE Term and none exists (or assignment's term is not ACTIVE)" }
  - { id: ERR_STUDENT_NOT_ENROLLED, http: 409, condition: "Operation requires enrollment_status == ENROLLED" }
  - { id: ERR_DORM_CLOSED, http: 409, condition: "Dorm.posture == CLOSED_FOR_BREAK blocks assignment confirm and ordinary sign-in" }
  - { id: ERR_ORDER_NOT_ACTIVE, http: 409, condition: "Administration attempted on a DISCONTINUED or COMPLETED MedicationOrder" }
  - { id: ERR_MEDICATION_ON_HOLD, http: 422, condition: "Administration attempted while MedicationOrder.status == HOLD (safety; outranks duplicate-dose referential errors)" }
  - { id: ERR_WITNESS_REQUIRED, http: 422, condition: "Controlled-order ADMINISTERED row lacks a witness, or witness equals the administering nurse, or witness is not an active StaffMember" }
  - { id: ERR_GUARDIAN_NOT_APPROVED, http: 422, condition: "International student references a guardian whose status != APPROVED (at student creation or assignment confirm)" }
  - { id: ERR_DOSE_ALREADY_LOGGED, http: 409, condition: "A MedicationAdministration already exists for (order_id, scheduled_date)" }
  - { id: ERR_CHECK_ALREADY_RECORDED, http: 409, condition: "A NightCheck already exists for (duty_shift_id, student_id, check_kind)" }
  - { id: ERR_DUPLICATE_ACTIVE_ORDER, http: 409, condition: "An ACTIVE MedicationOrder already exists for (student_id, medication_name, slot)" }
  - { id: ERR_DUPLICATE_BREAK_REQUEST, http: 409, condition: "A non-terminal BreakHousingRequest already exists for (student_id, break_period_id)" }
  - { id: ERR_SELF_ROOMMATE, http: 422, condition: "Roommate link target belongs to the same student" }
  - { id: ERR_ROOMMATE_NOT_IN_ROOM, http: 422, condition: "Roommate link target is in a different room or term, or not PROPOSED/CONFIRMED" }
  - { id: ERR_ACTIVE_ASSIGNMENT_EXISTS, http: 409, condition: "GRADUATED transition or assignment confirm attempted while the student already holds a CONFIRMED DormAssignment in the ACTIVE term" }
  - { id: ERR_ACTIVE_TERM_EXISTS, http: 409, condition: "Activating a term while another term is ACTIVE" }
  - { id: ERR_DORM_GENDER_MISMATCH, http: 422, condition: "Dorm gender_policy does not accept the student's gender at confirm" }
  - { id: ERR_GUARDIAN_REQUIRED, http: 422, condition: "is_international=true student created without guardian_id" }
  - { id: ERR_REPORTER_CANNOT_ADJUDICATE, http: 422, condition: "Segregation of duties: hearing officer / outcome recorder / appeal decider equals the case reporter" }
  - { id: ERR_HEARING_REQUIRED, http: 422, condition: "record-outcome attempted on a MAJOR case still in UNDER_REVIEW" }
  - { id: ERR_APPEAL_LIMIT_REACHED, http: 422, condition: "Second appeal attempted (appeal_count already 1)" }
  - { id: ERR_NOT_ELIGIBLE_BREAK_HOUSING, http: 422, condition: "Non-international student requested break housing" }
  - { id: ERR_NOT_RESIDENT, http: 422, condition: "Student has no CONFIRMED DormAssignment in the relevant dorm/ACTIVE term (night check, curfew sign-in)" }
  - { id: ERR_NO_CONFIRMED_RESIDENCY, http: 409, condition: "dorm-decision attempted for a student with no CONFIRMED assignment in the ACTIVE term" }
  - { id: ERR_CHECKS_OUTSTANDING, http: 409, condition: "Duty-shift completion attempted before every ENROLLED resident has a BED_CHECK NightCheck" }
  - { id: ERR_SWAP_TARGET_INELIGIBLE, http: 422, condition: "Swap target missing, not an active DORM_PARENT, is the current assignee, or has a conflicting shift that date" }
  - { id: ERR_ROOM_OCCUPIED, http: 409, condition: "Block attempted on a room with beds_assigned > 0" }
  - { id: ERR_LEAVE_WINDOW_OVERLAP, http: 409, condition: "New leave's [departs_at, returns_at) intersects another non-terminal leave of the same student (touching endpoints allowed)" }
  - { id: ERR_LEAVE_IN_PAST, http: 422, condition: "departs_at is not in the future" }
  - { id: ERR_HEARING_IN_PAST, http: 422, condition: "hearing_at is not in the future" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 422, condition: "Appeal attempted more than 168h after decided_at" }
  - { id: ERR_SIGN_OUT_WINDOW, http: 422, condition: "Sign-out attempted outside [departs_at - 2h, departs_at + 6h]" }
  - { id: ERR_SHIFT_CONFLICT, http: 409, condition: "Staff member already holds a DutyShift on the same duty_date with a conflicting slot" }
  - { id: ERR_BREAK_NOT_ACTIVE, http: 409, condition: "Check-in attempted while the BreakPeriod is not ACTIVE" }
  - { id: ERR_LEAVE_ALLOWANCE_EXHAUSTED, http: 422, condition: "WEEKEND_OVERNIGHT leave would exceed weekend_leave_allowance for the ACTIVE term" }
  - { id: ERR_ROOM_FULL, http: 422, condition: "Confirm attempted with beds_available < 1" }
  - { id: ERR_GUARDIAN_AT_CAPACITY, http: 422, condition: "Guardian wards_assigned == max_wards when assigning a new ward" }
  - { id: ERR_STORAGE_CAPACITY_EXCEEDED, http: 422, condition: "Aggregate reservation volume for the unit+break would exceed capacity_cuft" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC mismatch: expected_<parent>_version differs from the parent's current version" }
  - { id: ERR_STUDENT_SUSPENDED, http: 409, condition: "dorm-decision APPROVE attempted while Student.discipline_standing == SUSPENDED" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SchoolAdmin
    description: "School administrator; manages all configuration, terms, dorms, rooms, people, assignments, duty scheduling, and the logical clock"
    identity: opaque
    exclusive_operations: ["POST /reslife/_clock/set_current_utc", "term create/activate/close", "dorm create/close-for-break/reopen", "room create/block/unblock", "parent/guardian/staff/student create", "guardian approve/suspend", "student PATCH and enrollment transitions", "dorm-assignment create/confirm/end/link-roommate", "duty-shift create", "break-period create", "storage-unit create"]
    shared_operations: ["break-housing decide (with Dean)", "read access to most collections"]

  - name: Student
    description: "Enrolled boarder; X-User-ID equals the Student.id; may only act on records whose student_id equals X-User-ID"
    identity: "entity_backed:Student"
    exclusive_operations: ["POST /reslife/leave-requests", "POST /reslife/leave-requests/{id}/cancel", "POST /reslife/discipline-cases/{id}/appeal", "POST /reslife/break-housing-requests", "POST /reslife/storage-reservations", "POST /reslife/storage-reservations/{id}/cancel"]
    shared_operations: ["read own student record, own leaves, own cases, dorms, break periods, storage units"]

  - name: Parent
    description: "Home parent of a domestic student; X-User-ID equals Parent.id; authorized only where the student's parent_id equals X-User-ID"
    identity: "entity_backed:Parent"
    exclusive_operations: ["parent-decision on leaves of own domestic children"]
    shared_operations: ["read own child's student record and leaves"]

  - name: Guardian
    description: "Local guardian of international students; X-User-ID equals Guardian.id; authorized only where the student's guardian_id equals X-User-ID and guardian status is APPROVED"
    identity: "entity_backed:Guardian"
    exclusive_operations: ["parent-decision on leaves of own international wards"]
    shared_operations: ["read wards' student records and leaves"]

  - name: DormParent
    description: "Faculty member living in a dorm; X-User-ID equals StaffMember.id with staff_role DORM_PARENT; dorm-decision and night checks scoped to own dorm / own shifts"
    identity: "entity_backed:StaffMember"
    exclusive_operations: ["POST /reslife/leave-requests/{id}/dorm-decision", "POST /reslife/duty-shifts/{id}/request-swap", "POST /reslife/duty-shifts/{id}/swap-respond", "POST /reslife/duty-shifts/{id}/complete", "POST /reslife/duty-shifts/{id}/night-checks", "break-housing check-in/check-out"]
    shared_operations: ["report discipline cases (with Dean)", "sign-out/return leaves (with FrontDesk)", "storage check-in/retrieve (with FrontDesk)", "create sign events (with FrontDesk)"]

  - name: Nurse
    description: "Health-center nurse; X-User-ID equals StaffMember.id with staff_role NURSE; sole medication authority"
    identity: "entity_backed:StaffMember"
    exclusive_operations: ["POST /reslife/medication-orders", "hold/resume/discontinue orders", "POST /reslife/medication-orders/{id}/administrations"]
    shared_operations: ["read students and terms"]

  - name: Dean
    description: "Dean of students; X-User-ID equals StaffMember.id with staff_role DEAN; runs discipline workflow and break-housing decisions; may proxy family leave decisions when a guardian is SUSPENDED"
    identity: "entity_backed:StaffMember"
    exclusive_operations: ["begin-review", "schedule-hearing", "record-outcome", "appeal-decision", "close discipline cases"]
    shared_operations: ["parent-decision as proxy for suspended guardians", "break-housing decide (with SchoolAdmin)", "report discipline cases (with DormParent)"]

  - name: FrontDesk
    description: "Front-desk attendant; X-User-ID equals StaffMember.id with staff_role FRONT_DESK; records campus sign-in/out"
    identity: "entity_backed:StaffMember"
    exclusive_operations: ["POST /reslife/sign-events is primarily a FrontDesk duty (shared with DormParent for dorm-originated events)"]
    shared_operations: ["sign-out/return leaves (with DormParent)", "storage check-in/retrieve (with DormParent)"]
