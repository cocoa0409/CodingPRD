          assert:
            - "the setup reading ${tr} was created with HTTP status 201"
            - "HTTP status == 422"
            - "${eid} == ERR_TIMESTAMP_IN_FUTURE"
            - "DispenserUnit.${du}.lifetime_dispensed_gallons == 1.00"
            - "exactly one TelemetryReading row exists"

      - name: route_capacity_exhausted_by_the_second_stop_of_the_same_route
        claim_type: aggregate_validation
        grounds:
          - validations[priority 33 ERR_ROUTE_CAPACITY_EXCEEDED]
          - calculations.route_allocation_waterfall
        distinguishing_aspect: "Each stop's request is individually within the 12-unit route capacity, but the first stop consumes all 12, so the second stop's SKU has no whole case left: 409 ERR_ROUTE_CAPACITY_EXCEEDED with committed_units still 12."
        test_recipe:
          setup:
            - "Two SKUs (case_pack_units 4, ounces_per_unit 1000, national_allocation_units 100), each with a 7000-ounce reading and a position at on_hand 2 forecast to requested 12; route capacity_units 12 with two non-overlapping stops; stop 1 already allocated SKU-COLA."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { o: $.data.id, ov: $.data.version }
            - call: "POST /fountain-network/placement-agreements"
              payload: { outlet_id: "${o}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2027-01-01T00:00:00Z", annual_commitment_gallons: 8000, equipment_value_cents: 480000, expected_outlet_version: "${ov}" }
              as: NetworkAdmin
              captures: { ag: $.data.id }
            - call: "POST /fountain-network/dispenser-units"
              payload: { outlet_id: "${o}", agreement_id: "${ag}", serial_number: "SN-9001", model_code: "FREESTYLE_9100", installed_at: "2025-11-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { du: $.data.id }
            - call: "POST /fountain-network/supply-items"
              payload: { sku_code: "SKU-COLA", brand_name: "Cola Classic", supply_form: "CARTRIDGE", case_pack_units: 4, ounces_per_unit: 1000, national_allocation_units: 100 }
              as: NetworkAdmin
              captures: { siA: $.data.id }
            - call: "POST /fountain-network/supply-items"
              payload: { sku_code: "SKU-LEMON", brand_name: "Lemon Fizz", supply_form: "CARTRIDGE", case_pack_units: 4, ounces_per_unit: 1000, national_allocation_units: 100 }
              as: NetworkAdmin
              captures: { siB: $.data.id }
            - call: "POST /fountain-network/telemetry-readings"
              payload: { dispenser_unit_id: "${du}", supply_item_id: "${siA}", dispensed_ounces: 7000, reading_at: "2026-07-28T00:00:00Z", window_days: 7 }
              as: SupplyPlanner
            - call: "POST /fountain-network/telemetry-readings"
              payload: { dispenser_unit_id: "${du}", supply_item_id: "${siB}", dispensed_ounces: 7000, reading_at: "2026-07-28T00:00:00Z", window_days: 7 }
              as: SupplyPlanner
            - call: "POST /fountain-network/supply-positions"
              payload: { outlet_id: "${o}", supply_item_id: "${siA}", on_hand_units: 2 }
              as: SupplyPlanner
              captures: { spA: $.data.id }
            - call: "POST /fountain-network/supply-positions"
              payload: { outlet_id: "${o}", supply_item_id: "${siB}", on_hand_units: 2 }
              as: SupplyPlanner
              captures: { spB: $.data.id }
            - call: "POST /fountain-network/supply-positions/${spA}/forecast"
              payload: { variant: "TRAILING_ACTUAL", window_days: 7 }
              as: SupplyPlanner
            - call: "POST /fountain-network/supply-positions/${spB}/forecast"
              payload: { variant: "TRAILING_ACTUAL", window_days: 7 }
              as: SupplyPlanner
            - call: "POST /fountain-network/replenishment-routes"
              payload: { route_code: "RT-01", depot_region_code: "R-WEST", service_date: "2026-08-03T00:00:00Z", van_code: "VAN-7", capacity_units: 12 }
              as: SupplyPlanner
              captures: { rt: $.data.id, rtv: $.data.version }
            - call: "POST /fountain-network/replenishment-routes/${rt}/stops"
              payload: { outlet_id: "${o}", sequence_index: 1, window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z", expected_route_version: "${rtv}" }
              as: SupplyPlanner
              captures: { st1: $.data.id }
            - call: "GET /fountain-network/replenishment-routes/${rt}"
              as: SupplyPlanner
              captures: { rtv2: $.data.version }
            - call: "POST /fountain-network/replenishment-routes/${rt}/stops"
              payload: { outlet_id: "${o}", sequence_index: 2, window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T11:00:00Z", expected_route_version: "${rtv2}" }
              as: SupplyPlanner
              captures: { st2: $.data.id }
            - call: "POST /fountain-network/route-stops/${st1}/allocations"
              payload: { supply_position_ids: ["${spA}"] }
              as: SupplyPlanner
          trigger:
            - call: "POST /fountain-network/route-stops/${st2}/allocations"
