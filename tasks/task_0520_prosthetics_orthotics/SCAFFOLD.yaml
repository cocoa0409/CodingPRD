        source: system
        description: "ISO 8601 UTC."
      - name: updated_at
        type: datetime
        source: system
        description: "Refreshed on every mutation."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments on mutation."
        default: 1
      - name: full_name
        type: string
        source: input
