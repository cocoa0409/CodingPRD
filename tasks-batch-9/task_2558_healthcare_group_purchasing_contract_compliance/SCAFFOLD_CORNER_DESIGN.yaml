          setup: ["ACTIVE contract C-CLS (TIER_0 only), item V-1 base 10000 floor 8000, member M-CLS whose item master holds MI-1 and MI-2, an APPROVED cross-reference MI-1 -> V-1 with conversion_factor 1.5 and no cross-reference for MI-2, a countersigned commitment and one ACTIVE TIER_PRICE activation over [2026-08-01, 2026-12-31]."]
