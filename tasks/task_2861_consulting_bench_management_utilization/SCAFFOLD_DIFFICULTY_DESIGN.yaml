            - call: "POST /consultants"
              payload: { full_name: "Grace Hopper", email: "grace.hopper@firm.test", level: "CONSULTANT", practice_group_id: "${pg_id}", home_city: "Boston", home_geo_code: "NA", cost_rate_usd_per_hour: 140.00, standard_bill_rate_usd_per_hour: 300.00 }
              as: ResourceManager
