      - name: digital_embargo_and_collected_blackout_date_boundaries_differ_by_one_day
        grounds:
          - validations.priority_17_ERR_DIGITAL_EMBARGO_VIOLATION
          - validations.priority_18_ERR_CANNIBALIZATION_WINDOW_CONFLICT
          - entities.ReleaseWindow.fields.release_date
          - endpoints.POST_/comics/issues/{id}/release-windows
        distinguishing_aspect: |
          Metric: UTC calendar dates on POST /comics/issues/{id}/release-windows, where the two windows
          use opposite inclusivity. The 30-day digital embargo is inclusive, so 2027-01-01 is the first
          legal digital date and 2026-12-31 is refused; the 90-day collected blackout is exclusive, so
          2027-03-02 (the blackout end itself) is refused and 2027-03-03 is the first legal collected
          date. The same one-day step therefore lands on opposite sides of the two rules.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "GREENLIT title with two UNSOLICITED issues: #1 on sale 2026-10-14 and #2 on sale 2026-12-02, so max(target_on_sale_date) over the title is 2026-12-02"
            - "no release windows yet on issue #2 (target 2026-12-02 + 30 days == 2027-01-01, + 90 days == 2027-03-02)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SalesDirector
            - call: "POST /comics/titles"
              payload: { name: "Nebula Knights", planned_issue_count: 6, royalty_pool_bps: 1200, cover_participation_bps: 1500 }
              as: EditorInChief
              captures: { t1: $.data.id }
