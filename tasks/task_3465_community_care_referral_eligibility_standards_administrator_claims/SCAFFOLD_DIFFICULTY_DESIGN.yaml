  - rule_id: boundary_precision_check
    instances:
      - name: wait_standard_exactly_at_threshold_not_failed
        grounds:
          - calculations.eligibility_determination
          - entities.EligibilityAssessment.fields.wait_standard_failed
        distinguishing_aspect: |
          Metric: wait days on the eligibility-assessments endpoint. The
          standard fails only when wait_days is STRICTLY greater than 20:
          a station at exactly 20 days keeps the veteran ineligible (all else
          passing), while 21 days makes the same veteran eligible. One day
          across the >=/> boundary flips the outcome.
        test_recipe:
          setup:
            - "Station W20 with primary_wait_days == 20 and station W21 with primary_wait_days == 21; both offer PT_EVAL, both 23.6 rural minutes away (drive passes)"
            - "Two PG-5 RURAL veterans, no choice request — wait is the only variable"
          setup_api_calls:
            - call: "POST /community-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /community-care/care-stations"
              payload: { name: "Station W20", latitude: 40.0, longitude: -75.0, primary_wait_days: 20, specialty_wait_days: 10, service_codes: ["PT_EVAL"] }
              as: PlatformAdmin
              captures: { st20: $.data.id }
            - call: "POST /community-care/care-stations"
              payload: { name: "Station W21", latitude: 40.0, longitude: -75.0, primary_wait_days: 21, specialty_wait_days: 10, service_codes: ["PT_EVAL"] }
              as: PlatformAdmin
              captures: { st21: $.data.id }
