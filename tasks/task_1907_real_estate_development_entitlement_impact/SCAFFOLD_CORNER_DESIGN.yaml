            - call: "POST /entitlement/decision-authorities"
              payload: { full_name: "Council", body: "CITY_COUNCIL" }
              as: PlatformAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /entitlement/applications/${app_id}/open-review"
              payload: {}
              as: StaffReviewer
              as_user_id: "${rev_id}"
            - call: "POST /entitlement/applications/${app_id}/advance-to-decision"
              payload: {}
              as: StaffReviewer
              as_user_id: "${rev_id}"
            - call: "GET /entitlement/applications/${app_id}"
              payload: {}
              as: DecisionAuthority
              as_user_id: "${auth_id}"
              captures: { app_v_stale: $.data.version }
            - call: "POST /entitlement/applications/${app_id}/outreach-events"
              payload: { event_date: "2026-08-03T00:00:00Z", disposition: "OPPOSE", attendee_count: 5 }
              as: StaffReviewer
              as_user_id: "${rev_id}"
          trigger:
            - call: "POST /entitlement/applications/${app_id}/decisions"
              payload: { decision: "APPROVE", decided_by: "${auth_id}", expected_application_version: "${app_v_stale}" }
              as: DecisionAuthority
              as_user_id: "${auth_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_APPLICATION_VERSION (outreach event bumped version after authority's read)"
            - "HTTP 412; decision NOT rendered; application remains DECISION_PENDING"

  # ===========================================================================
  # Section: consistency_model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: payment_immediately_reflects_assessment_status
        claim_type: immediate_consistency
        grounds: ["state_machines.ImpactFeeAssessment.OPEN_to_PARTIALLY_PAID", "complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: the response to a partial payment AND a subsequent GET both show status PARTIALLY_PAID with no lag."
        test_recipe:
          setup: ["application SUBMITTED; provisional assessment net 58000.00"]
          setup_api_calls:
            - call: "POST /entitlement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /entitlement/fee-schedules"
              payload: { schedule_label: "V1", effective_date: "2026-08-01T00:00:00Z", rate_transportation_res: 3200.00, rate_parks_res: 2100.00, rate_fire_res: 800.00, rate_water_res: 2600.00, rate_sewer_res: 2900.00, rate_transportation_com: 5400.00, rate_parks_com: 0.00, rate_fire_com: 950.00, rate_water_com: 3100.00, rate_sewer_com: 3400.00 }
              as: PlatformAdmin
              captures: { fs_v1: $.data.id }
            - call: "POST /entitlement/fee-schedules/${fs_v1}/adopt"
              payload: {}
              as: PlatformAdmin
            - call: "POST /entitlement/applicants"
              payload: { legal_name: "ImmCo", contact_email: "im@x.com" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /entitlement/projects"
              payload: { project_name: "Imm", applicant_id: "${applicant_id}", land_use_type: "RESIDENTIAL", dwelling_units: 5, affordable_units: 0, floor_area_sqft: 0, prior_use_basis: {} }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { project_id: $.data.id, project_v: $.data.version }
            - call: "POST /entitlement/applications"
              payload: { project_id: "${project_id}", application_type: "REZONE", submittal_package: ["SITE_PLAN"], expected_project_version: "${project_v}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /entitlement/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "GET /entitlement/applications/${app_id}/assessments"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { assessment_id: "$.data[0].id" }
          trigger:
            - call: "POST /entitlement/assessments/${assessment_id}/payments"
              payload: { amount: 10000.00, paid_at: "2026-08-02T00:00:00Z" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "GET /entitlement/assessments/${assessment_id}"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { a_status: $.data.status }
          assert:
            - "GET immediately after partial payment shows status == PARTIALLY_PAID (no eventual-consistency lag)"
            - "outstanding balance == 48000.00 in the same read"
