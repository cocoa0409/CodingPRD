              payload: {}
              as: Picker
              as_user_id: "${p_id}"
            - call: "POST /v1/orders/${ord_id}/capture"
              payload: {}
              as: StoreOps
          trigger:
            - call: "POST /v1/order-lines/${milk_line}/out-of-stock"
              payload: {}
              as: StoreOps
              captures: { line_status: $.data.status }
          assert:
            - "Order.${ord_id}.refunded_total_cents == 698"
            - "Order.${ord_id}.payment_status == PARTIALLY_REFUNDED"
            - "Order.${ord_id}.net_captured_cents == 864"
            - "OrderLine.${milk_line}.status == OUT_OF_STOCK"

      - name: tc_substitution_accept_depth2
        grounds:
          - state_machines.Substitution.PROPOSED_to_ACCEPTED
          - state_machines.OrderLine.PENDING_to_SUBSTITUTED
          - entities.OrderLine.fields.final_line_cents
          - entities.OrderLine.fields.status
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (POST substitution accept): (1) Substitution.status PROPOSED
          -> ACCEPTED; (2) that acceptance causes the parent OrderLine PENDING -> SUBSTITUTED and sets
          final_line_cents = substitute_line_cents (250). The OrderLine change is caused by the Substitution
          change, not directly by the accept call.
        test_recipe:
          setup:
            - "Store, Customer, Picker, slot cap 1. UNIT product A(349, SHOPPER_CHOICE line) and UNIT sub SUB(250)."
            - "Order with one A line. Claimed (PICKING). Substitution SUB qty 1 proposed (substitute_line_cents=250)."
          setup_api_calls:
