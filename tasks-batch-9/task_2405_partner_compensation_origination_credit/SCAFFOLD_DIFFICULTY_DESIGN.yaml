              as: CreditArbiter
              as_user_id: "${parb}"
              captures: { err1: "$.data.error_id" }
            - call: "POST /comp/credit-claims/${cl1}/adjudicate"
              payload: { decision: "SPLIT", approved_pct: 60.00, counterparty_pct: 40.00, expected_matter_version: "${mv3}" }
              as: CreditArbiter
              as_user_id: "${parb}"
          assert:
            - "${err1} == ERR_CLAIM_NOT_ADJUDICABLE"
            - "the third REMAND returns HTTP 409 and leaves CreditClaim.${cl1}.state == DISPUTED"
            - "CreditClaim.${cl1}.remand_count == 2 immediately after the rejected REMAND"
            - "CreditClaim.${cl1}.revision_count == 2 immediately after the rejected REMAND"
            - "Matter.${m1}.version == ${mv3} immediately after the rejected REMAND"
            - "the following SPLIT returns HTTP 200 and CreditClaim.${cl1}.state == ALLOCATED"
            - "CreditClaim.${cl1}.approved_pct == 60.00"
            - "CreditClaim.${cl1}.counterparty_pct == 40.00"
            - "Matter.${m1}.origination_pct_assigned == 100.00"

