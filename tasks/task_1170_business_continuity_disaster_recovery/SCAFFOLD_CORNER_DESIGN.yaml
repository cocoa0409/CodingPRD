      - name: notification_ack_bubbles_activation_to_acknowledged
        grounds: [state_machines.Notification.SENT_to_ACKED, state_machines.Activation.ALL_NOTIFIED_to_ACKNOWLEDGED]
        distinguishing_aspect: "Bubble-up: acking the final outstanding notification flips the parent activation to ACKNOWLEDGED and stamps acknowledged_at; earlier acks leave it ALL_NOTIFIED."
