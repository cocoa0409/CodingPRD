  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: occupancy_intervals_touch_at_endpoints_but_reject_true_overlap
        grounds:
          - validations[priority=16]
          - errors[ERR_OCCUPANCY_INTERVAL_OVERLAP]
          - entities.OwnershipRecord.fields.occupancy_start_date
          - entities.OwnershipRecord.fields.occupancy_end_date
        distinguishing_aspect: |
          The contended resource is a PARCEL as an occupancy timeline, with DATE granularity and
          half-open [start, end) semantics: [2020-01-01, 2023-01-01) and [2023-01-01, 2026-01-01) share
          the instant 2023-01-01 and are both accepted, while [2025-06-01, open) genuinely intersects
          the second interval and is rejected. Endpoint-touching is the accepted case here, unlike the
          docket rule where a 15-minute gap is already a collision.
        test_recipe:
          setup:
            - "Parcel P1 exists and TaxpayerAccount T has no ownership records yet."
            - "Two consecutive DEED_REGISTRY PRIMARY_RESIDENCE records are ingested with explicit end dates so no open-ended truncation can hide the overlap check."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /parcels"
              payload: { apn: "P-0001", situs_address_normalized: "100 OAK ST NORTHFIELD ST 10001", county_zone: "NORTH", tax_year: 2026, base_year: 2020, base_year_value_cents: 30000000, market_value_cents: 40000000, assessment_cap_pct_bps: 200 }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { p1_id: $.data.id }
            - call: "POST /taxpayer-accounts"
              payload: { full_name: "OLIVIA OCCUPANT", date_of_birth: "1975-11-11", ssn_last4: "8181", mailing_address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { t_id: $.data.id }
            - call: "POST /ownership-records"
              payload: { parcel_id: "${p1_id}", taxpayer_id: "${t_id}", ownership_pct_bps: 10000, deed_recorded_date: "2020-01-01", occupancy_type: "PRIMARY_RESIDENCE", occupancy_start_date: "2020-01-01", occupancy_end_date: "2023-01-01", source_system: "DEED_REGISTRY" }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { or1_id: $.data.id }
          trigger:
            - call: "POST /ownership-records"
              payload: { parcel_id: "${p1_id}", taxpayer_id: "${t_id}", ownership_pct_bps: 10000, deed_recorded_date: "2023-01-01", occupancy_type: "PRIMARY_RESIDENCE", occupancy_start_date: "2023-01-01", occupancy_end_date: "2026-01-01", source_system: "DEED_REGISTRY" }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { or2_id: $.data.id }
            - call: "POST /ownership-records"
              payload: { parcel_id: "${p1_id}", taxpayer_id: "${t_id}", ownership_pct_bps: 10000, deed_recorded_date: "2025-06-01", occupancy_type: "PRIMARY_RESIDENCE", occupancy_start_date: "2025-06-01", source_system: "DEED_REGISTRY" }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { err: $.data.error_id }
          assert:
            - "the touching record is accepted: HTTP 201, OwnershipRecord.${or2_id}.status == VERIFIED, occupancy_start_date == 2023-01-01, occupancy_end_date == 2026-01-01"
            - "OwnershipRecord.${or1_id}.status is still VERIFIED with occupancy_end_date 2023-01-01 (a touching successor does not supersede or truncate it)"
            - "the overlapping record returns HTTP 409 with ${err} == ERR_OCCUPANCY_INTERVAL_OVERLAP (2025-06-01 falls inside [2023-01-01, 2026-01-01))"
            - "GET /ownership-records?parcel_id=${p1_id}&occupancy_type=PRIMARY_RESIDENCE returns exactly 2 rows"
            - "no third OwnershipRecord row exists for ${p1_id}, so the rejected call had no partial effect"

      - name: docket_aggregate_capacity_blocks_a_slot_no_other_hearing_touches
        grounds:
          - validations[priority=27]
          - errors[ERR_DOCKET_CAPACITY_REACHED]
          - entities.HearingDocket.fields.capacity
          - entities.HearingDocket.fields.scheduled_appeal_count
          - state_machines.Appeal.SCHEDULED_to_CONTINUED
        distinguishing_aspect: |
