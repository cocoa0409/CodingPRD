          trigger:
            - call: "POST /agencies/clients/${cl}/debt-accounts"
              payload: { creditor_id: "00000000-0000-4000-8000-000000000000", account_ref: "DUP", original_balance_cents: 200000, original_apr: 0.1999, min_payment_cents: 4500, proposed_monthly_payment_cents: 15000, requested_concession_apr: 0.0699 }
              as: Counselor
              as_user_id: "${cn}"
          assert:
            - "Response error_id == ERR_REFERENCE_NOT_FOUND (referential precedence over duplicate-ref)"
            - "HTTP status == 422"

