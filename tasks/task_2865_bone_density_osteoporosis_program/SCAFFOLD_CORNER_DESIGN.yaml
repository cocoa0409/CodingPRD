          - errors[ERR_SCAN_ORDER_NOT_FOUND]
          - errors[ERR_SCAN_APPOINTMENT_NOT_FOUND]
          - errors[ERR_FRAX_ASSESSMENT_NOT_FOUND]
          - errors[ERR_DIAGNOSTIC_REPORT_NOT_FOUND]
          - errors[ERR_TREATMENT_PLAN_NOT_FOUND]
        distinguishing_aspect: "Every addressable type has its own 404 rather than one generic one, and the schema check at priority 3 still outranks all of them: POST to a qc-run collection under a non-existent densitometer returns 422 ERR_INVALID_REQUEST when purpose is a bad enum and only returns 404 ERR_DENSITOMETER_NOT_FOUND once the body is well formed."
