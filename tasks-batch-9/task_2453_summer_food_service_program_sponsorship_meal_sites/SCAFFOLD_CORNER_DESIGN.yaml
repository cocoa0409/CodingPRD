      - name: request_without_a_declared_role_header_is_rejected_with_401
        claim_type: other_roles_exclusive_denied
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Authentication is checked strictly before authorisation: a request whose X-User-Role is absent or not one of the four declared roles returns 401 ERR_UNAUTHENTICATED — never the 403 ERR_ROLE_NOT_PERMITTED that a recognised-but-wrong role would get, and never a 404 for the unknown sponsor id in the path."
        test_recipe:
          setup:
            - "Empty database except the initialised clock; the trigger calls are issued with no X-User-Role / X-User-ID headers (denoted by the pseudo-role Anonymous, which is not one of the four declared roles)."
          setup_api_calls:
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StateAgencyReviewer
          trigger:
            - call: "POST /sfsp/sponsors"
              payload: { legal_name: "Anonymous Attempt", sponsor_type: "NONPROFIT", experience_status: "NEW", program_year: 2026, advance_eligible: false }
              as: Anonymous
              captures: { e_write: $.data.error_id }
            - call: "GET /sfsp/sponsors/00000000-0000-4000-8000-00000000dead"
              payload: {}
              as: Anonymous
              captures: { e_read: $.data.error_id }
          assert:
            - "Both triggers return HTTP status == 401"
            - "${e_write} == ERR_UNAUTHENTICATED and ${e_read} == ERR_UNAUTHENTICATED"
            - "The unauthenticated read does NOT return 404 ERR_SPONSOR_NOT_FOUND even though the path id does not exist (priority 1 precedes priority 4)"
            - "GET /sfsp/sites?limit=10&offset=0 as StateAgencyReviewer returns total_count == 0: the rejected write created no Sponsor"

