            - call: "POST /direct-selling/enrollment-applications/${app_t_id}/identity-decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
            - call: "POST /direct-selling/enrollment-applications/${app_t_id}/pay-starter-kit"
              payload: { amount_cents: 11129, payment_reference: "KIT-PAY-TIA" }
              as: PlatformAdmin
            - call: "POST /direct-selling/enrollment-applications/${app_t_id}/approve"
              payload: {}
              as: ComplianceOfficer
              captures: { cons_t_id: "$.data.id" }
            - call: "POST /direct-selling/compliance-cases"
