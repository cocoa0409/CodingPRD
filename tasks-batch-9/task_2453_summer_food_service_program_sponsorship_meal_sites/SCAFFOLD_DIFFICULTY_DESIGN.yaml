  - rule_id: non_linear_state_machine
    instances:
      - name: site_parallel_status_dimensions_move_independently
        grounds:
          - state_machines.Site.APPROVED_to_SUSPENDED
          - state_machines.Site.SUSPENDED_to_APPROVED
          - state_machines.Site.NOT_STARTED_to_OPERATING
          - entities.Site.fields.approval_status
          - entities.Site.fields.operating_status
          - entities.Site.fields.claim_hold
        distinguishing_aspect: |
          Site is the PARALLEL-dimension machine: suspending and reinstating moves only
          approval_status (APPROVED -> SUSPENDED -> APPROVED) while operating_status stays OPERATING
          across both hops, and first_operating_date is never re-stamped — a single-dimension
          implementation that resets operating_status on suspension fails this test.
        test_recipe:
          setup:
            - "Sponsor APPROVED; one rural SELF_PREP OPEN site APPROVED and moved to OPERATING at logical clock 2026-06-08."
            - "The site has no MealServiceDay rows, so the suspension cascade has nothing to void."
          setup_api_calls:
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StateAgencyReviewer
