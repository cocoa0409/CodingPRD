          trigger:
            - call: "POST /app-versions/${v10_id}/review-windows"
              payload: { reviewer_id: "${d10_id}", starts_at: "2026-09-15T00:00:00Z", ends_at: "2026-09-15T00:00:00Z" }
              as: Reviewer
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == 'ERR_REVIEWER_CONFLICT' (business_safety priority 6 segregation of duties: reviewer == owning developer is rejected before the priority-7 inverted-interval constraint check)"

