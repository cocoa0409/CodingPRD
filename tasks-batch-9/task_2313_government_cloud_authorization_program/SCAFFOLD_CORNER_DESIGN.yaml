  - name: the_two_append_only_entities_expose_no_version_and_no_update_endpoint
    claim_type: immutability
    grounds:
    - entities.ControlBaseline.common_fields
    - entities.ScanSubmission.common_fields
    - endpoints[POST /control-baselines]
    distinguishing_aspect: 'ControlBaseline and ScanSubmission are declared common_fields: false, so their rows carry id and
      created_at only — no version, no updated_at — and §1.5 declares no PATCH, PUT or DELETE for either collection: they
      are append-only by construction, unlike the 13 versioned entities.'
    test_recipe:
      setup:
      - Clock 2026-02-01T00:00:00Z; DOT agency, MODERATE baseline and a DRAFT offering exist.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-02-01T00:00:00Z'
        as: ProgramBoardReviewer
        as_user_id: board-1
      - call: POST /agencies
        payload:
          name: Department of Transportation
          agency_code: DOT
          sponsorship_capacity: 3
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          agency_dot_id: $.data.id
      - call: POST /control-baselines
        payload:
          impact_level: MODERATE
          version_label: Rev5-MODERATE
          effective_from: '2026-01-01T00:00:00Z'
          families: *id001
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          baseline_mod_id: $.data.id
      - call: POST /offerings
        payload:
          name: GovCloud Compute
          provider_name: Aurora Cloud
          service_model: IAAS
          deployment_model: GOV_COMMUNITY
          assessment_budget_usd: 400000.0
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          offering_id: $.data.id
      trigger:
      - call: POST /control-baselines
        payload:
          impact_level: HIGH
          version_label: Rev5-HIGH
          effective_from: '2026-01-15T00:00:00Z'
          families:
          - family_code: AC
            required_control_count: 4
            priority_rank: 1
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          baseline_high_id: $.data.id
      assert:
      - HTTP 201; data carries id, created_at, impact_level, version_label, effective_from, retired, families and total_required_controls
      - data has NO version key and NO updated_at key
      - data.created_at == 2026-02-01T00:00:00Z and data.total_required_controls == 4
      - §1.5 declares exactly one endpoint under /control-baselines (POST) — no GET/{id}, PATCH, PUT or DELETE exists, so
        a baseline can never be edited or retired after the fact
      - §1.5 declares only POST and GET under /monitoring-periods/{id}/scan-submissions, and ScanSubmission rows likewise
        carry no version key
