  - rule_id: priority_pair_validation_conflict
    instances:
      - name: withdraw_draft_election_after_deadline_state_beats_temporal
        grounds:
          - validations[priority=9]
          - validations[priority=20]
          - state_machines.CarriageElection.NEGOTIATING_to_DRAFT
          - entities.CarriageElection.fields.status
        distinguishing_aspect: |
          Error-category pair state (409) versus business_temporal (422): a withdraw call against a
          DRAFT election issued after ELECTION_DEADLINE_UTC violates priority 9 and priority 20 at
          once, and priority 9 wins, so the response is 409 ERR_ELECTION_NOT_WITHDRAWABLE and never
          422 ERR_ELECTION_WINDOW_CLOSED.
        test_recipe:
          setup:
            - "One CBS station with an ACTIVE affiliation and one CABLE distributor"
            - "One CarriageElection created but never filed, so status is DRAFT"
            - "Clock moved to 2026-10-02, one day past ELECTION_DEADLINE_UTC of 2026-10-01"
          setup_api_calls:
            - call: "POST /retrans/stations"
              payload: { call_sign: "WXYZ", market_code: "SEA", dma_rank: 12, market_tv_households: 1800000, network_affiliation: "CBS" }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { st_id: "$.data.id" }
            - call: "POST /retrans/stations/${st_id}/affiliation-agreements"
              payload: { network_name: "CBS", term_end_utc: "2032-01-01T00:00:00Z", reverse_comp_floor_per_sub_cents: 90, split_premium_bp: 500, permitted_tiers: ["BROADCAST_BASIC", "EXPANDED_BASIC"], digital_rights_grantable: true, ooh_rights_grantable: false, streaming_rights_grantable: true }
