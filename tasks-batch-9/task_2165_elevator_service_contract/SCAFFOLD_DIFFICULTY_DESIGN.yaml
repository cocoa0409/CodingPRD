          - entities.ElevatorCar.fields.availability_state
          - entities.ElevatorCar.fields.compliance_state
        distinguishing_aspect: |
          Non-linearity on ENTITY ElevatorCar takes the PARALLEL-DIMENSION form: a callback moves
          availability_state IN_SERVICE -> OUT_OF_SERVICE while compliance_state stays CERTIFIED, and
          a later clock advance moves compliance_state CERTIFIED -> CERTIFICATE_EXPIRED while
          availability_state stays OUT_OF_SERVICE. Neither dimension constrains the other here.
        test_recipe:
          setup:
            - "One ACTIVE contract with one car C1 whose compliance_state has been driven to CERTIFIED by a PASS inspection plus a posted certificate."
            - "The certificate was issued on 2026-08-01 and therefore expires 2027-08-01."
