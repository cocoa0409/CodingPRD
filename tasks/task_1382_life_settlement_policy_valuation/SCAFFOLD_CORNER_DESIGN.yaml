        distinguishing_aspect: "entity_backed ownership: an Investor (X-User-ID == Investor.id) reading a portfolio with no allocation for them gets ERR_INVESTOR_NOT_ALLOCATED; with an allocation the same read succeeds; the list endpoint filters to allocated portfolios only."
        test_recipe:
          setup: ["investor inv1; portfolio P1 with allocations []; portfolio P2 with allocations [{inv1, 5}]"]
          setup_api_calls:
            - { call: "POST /api/investors", payload: { name: "Inv One", investor_type: "FUND" }, as: PlatformAdmin, captures: { inv1: "$.data.id" } }
            - { call: "POST /api/portfolios", payload: { name: "P1", discount_rate_bps: 1200, valuation_method: "PROSPECTIVE", allocations: [] }, as: PortfolioManager, captures: { pf1: "$.data.id" } }
