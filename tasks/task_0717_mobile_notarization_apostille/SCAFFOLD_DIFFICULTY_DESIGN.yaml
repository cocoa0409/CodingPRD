              as: CoordinatorOps
              captures: { acct_id: $.data.id }
            - call: "POST /notary/notaries"
              payload: { account_id: "${acct_id}", full_name: "Nora", commission_state: "CA", commission_expires_at: "2027-01-01T00:00:00Z", ron_authorized: true, nsa_certified: true }
              as: CoordinatorOps
              captures: { not_id: $.data.id }
          trigger:
            - call: "POST /notary/requests/00000000-0000-4000-8000-000000000000/start-session"
              payload: {}
              as: Notary
              as_user_id: "${not_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response.status == 404"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: enhanced_trust_threshold_exactly_75_passes
        grounds:
          - calculations.credential_trust_score
          - entities.IdVerification.fields.outcome
          - validations[priority=13]
        distinguishing_aspect: "ENHANCED threshold is >=75: kba=70, credential=90, biometric=60 -> trust_score exactly 75.00 -> outcome PASS; one point lower (kba=65) -> 73.50 -> FAIL. Boundary sits on the credential trust metric reached through POST /id-verifications."
        test_recipe:
          setup:
            - "LOAN_SIGNING request (forces ENHANCED). Signer registered."
          setup_api_calls:
            - call: "POST /notary/fee-schedules"
              payload: { state_code: "CA", per_stamp_cents: 1500, travel_base_cents: 4000, travel_per_mile_cents: 100, ron_surcharge_cents: 2500, state_cap_cents: 20000 }
              as: CoordinatorOps
