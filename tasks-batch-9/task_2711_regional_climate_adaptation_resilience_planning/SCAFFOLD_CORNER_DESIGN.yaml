              captures: { err_id: $.data.error_id }
          assert:
            - "status 409 and data.error_id == ERR_NO_ASSESSED_VULNERABILITY"
            - "LifelineAsset.${a1_id}.criticality_status == UNRANKED with consequence_score == null and version == 1"

      - name: asset_ranking_twice_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.LifelineAsset.UNRANKED_to_RANKED.preconditions
          - validations.priority_14_ERR_ASSET_ALREADY_RANKED
        distinguishing_aspect: "A second criticality-ranking on a RANKED asset returns 409 ERR_ASSET_ALREADY_RANKED and leaves consequence_score untouched; only a RECOMPUTE_REQUIRED asset may be ranked again."
        test_recipe:
          setup:
            - "The base chain through a RANKED LifelineAsset (consequence_score already written)."
          setup_api_calls:
