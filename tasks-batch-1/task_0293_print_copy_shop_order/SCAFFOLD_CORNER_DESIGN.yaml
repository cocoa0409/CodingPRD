# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across claim-extraction-guide sections vs SCAFFOLD §1.1–§1.7.
# All setup_api_calls reuse §1.5 endpoints. excluded_because stubs cite §1.8 names.
# =============================================================================
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_shop_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Shop, endpoints]
        distinguishing_aspect: "POST /shops with all required fields returns 201 and a Shop with id, created_at, version=1 and echoed config."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /shops"
              payload: { name: "S1", tax_rate_bps: 825, rush_surcharge_bps: 2000, rush_cutoff_hour_utc: 14, standard_turnaround_days: 3, rush_turnaround_days: 1, daily_unit_capacity: 50 }
              as: ShopStaff
              captures: { shop_id: $.data.id, v: $.data.version }
          assert:
            - "HTTP 201"
            - "Shop.${shop_id}.tax_rate_bps == 825 and Shop.${shop_id}.version == 1"

      - name: get_order_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Order, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /orders/{random-uuid} for a non-existent id returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["A shop exists; the requested order id does not."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S2", tax_rate_bps: 0, rush_surcharge_bps: 0, rush_cutoff_hour_utc: 14, standard_turnaround_days: 3, rush_turnaround_days: 1, daily_unit_capacity: 50 }
              as: ShopStaff
          trigger:
            - call: "GET /orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ShopStaff
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == ERR_NOT_FOUND"

      - name: create_order_line_missing_quantity_returns_validation
        claim_type: Required Fields
        grounds: [entities.OrderLine.fields.quantity, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /order-lines without the required quantity field returns ERR_VALIDATION 400."
        test_recipe:
          setup: ["A draft order and an active product exist."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S3", tax_rate_bps: 0, rush_surcharge_bps: 0, rush_cutoff_hour_utc: 14, standard_turnaround_days: 3, rush_turnaround_days: 1, daily_unit_capacity: 50 }
              as: ShopStaff
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", email: "s3@x.com", name: "S3C" }
              as: ShopStaff
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { shop_id: "${shop_id}", name: "P", category: "COPIES", base_unit_price_cents: 500, requires_proof: false, requires_press: false }
              as: ShopStaff
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", product_id: "${prod_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_VALIDATION"

      - name: order_line_service_level_defaults_to_standard
        claim_type: Defaults
        grounds: [entities.OrderLine.fields.service_level]
        distinguishing_aspect: "Omitting service_level on POST /order-lines applies default STANDARD."
        test_recipe:
          setup: ["A draft order and active product exist."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S4", tax_rate_bps: 0, rush_surcharge_bps: 0, rush_cutoff_hour_utc: 14, standard_turnaround_days: 3, rush_turnaround_days: 1, daily_unit_capacity: 50 }
              as: ShopStaff
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", email: "s4@x.com", name: "S4C" }
              as: ShopStaff
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { shop_id: "${shop_id}", name: "P", category: "COPIES", base_unit_price_cents: 500, requires_proof: false, requires_press: false }
              as: ShopStaff
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", product_id: "${prod_id}", quantity: 10 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
          assert:
            - "HTTP 201"
            - "OrderLine.${line_id}.service_level == STANDARD"

      - name: order_line_estimate_and_production_units_computed
        claim_type: Computed Fields
        grounds: [entities.OrderLine.fields.estimate_line_cents, entities.OrderLine.fields.production_units, calculations.estimate_line_price]
        distinguishing_aspect: "estimate_line_cents and production_units are computed server-side; BANNER unit_size 2, qty 3 -> production_units 6, estimate base 5000*3=15000 (no tier)."
        test_recipe:
          setup: ["BANNER product base 5000 unit_size 2, no tiers; draft order."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S5", tax_rate_bps: 0, rush_surcharge_bps: 0, rush_cutoff_hour_utc: 14, standard_turnaround_days: 3, rush_turnaround_days: 1, daily_unit_capacity: 50 }
              as: ShopStaff
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", email: "s5@x.com", name: "S5C" }
              as: ShopStaff
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { shop_id: "${shop_id}", name: "Banner", category: "BANNER", base_unit_price_cents: 5000, unit_size: 2, requires_proof: false, requires_press: true }
              as: ShopStaff
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", product_id: "${prod_id}", quantity: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
          assert:
            - "OrderLine.${line_id}.production_units == 6"
            - "OrderLine.${line_id}.estimate_line_cents == 15000"

      - name: customer_id_system_minted_ignores_client_id
        claim_type: System Fields
        grounds: [entities.Customer.fields.id]
        distinguishing_aspect: "id/created_at/version are system-minted; POST /customers does not accept an id and the returned id is a server UUID."
        test_recipe:
          setup: ["A shop exists."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S6", tax_rate_bps: 0, rush_surcharge_bps: 0, rush_cutoff_hour_utc: 14, standard_turnaround_days: 3, rush_turnaround_days: 1, daily_unit_capacity: 50 }
              as: ShopStaff
              captures: { shop_id: $.data.id }
          trigger:
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", email: "s6@x.com", name: "S6C" }
              as: ShopStaff
              captures: { cust_id: $.data.id, v: $.data.version }
          assert:
            - "HTTP 201"
            - "Customer.${cust_id}.version == 1 and id is a server-minted UUID"

      - name: create_product_invalid_category_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.Product.fields.category, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /products with category not in {COPIES,BANNER,BINDING} returns ERR_VALIDATION 400."
        test_recipe:
          setup: ["A shop exists."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S7", tax_rate_bps: 0, rush_surcharge_bps: 0, rush_cutoff_hour_utc: 14, standard_turnaround_days: 3, rush_turnaround_days: 1, daily_unit_capacity: 50 }
              as: ShopStaff
              captures: { shop_id: $.data.id }
          trigger:
            - call: "POST /products"
              payload: { shop_id: "${shop_id}", name: "Bad", category: "POSTER", base_unit_price_cents: 500 }
              as: ShopStaff
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_VALIDATION"

      - name: list_products_filtered_by_shop_paginated
        claim_type: Listing
        grounds: [entities.Product, endpoints]
        distinguishing_aspect: "GET /products?shop_id=... returns a paginated array with total_count and has_more in meta/envelope."
        test_recipe:
          setup: ["A shop with two products."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S8", tax_rate_bps: 0, rush_surcharge_bps: 0, rush_cutoff_hour_utc: 14, standard_turnaround_days: 3, rush_turnaround_days: 1, daily_unit_capacity: 50 }
              as: ShopStaff
              captures: { shop_id: $.data.id }
            - call: "POST /products"
              payload: { shop_id: "${shop_id}", name: "A", category: "COPIES", base_unit_price_cents: 500 }
              as: ShopStaff
            - call: "POST /products"
              payload: { shop_id: "${shop_id}", name: "B", category: "BANNER", base_unit_price_cents: 5000 }
              as: ShopStaff
          trigger:
            - call: "GET /products"
              payload: { shop_id: "${shop_id}", limit: 10, offset: 0 }
              as: ShopStaff
          assert:
            - "HTTP 200 and response_type == array"
            - "total_count == 2 and has_more == false"

  # =========================================================================
  - section: state_machines
    instances:
      - name: confirm_order_with_no_lines_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Order.DRAFT_to_CONFIRMED, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Confirm a DRAFT order with zero OrderLines fails the '>= 1 line' precondition with ERR_VALIDATION 400."
        test_recipe:
          setup: ["A draft order with no lines and a fulfillment."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S9", tax_rate_bps: 0, rush_surcharge_bps: 0, rush_cutoff_hour_utc: 14, standard_turnaround_days: 3, rush_turnaround_days: 1, daily_unit_capacity: 50 }
              as: ShopStaff
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", email: "s9@x.com", name: "S9C" }
              as: ShopStaff
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /fulfillments"
              payload: { order_id: "${order_id}", method: "PICKUP", ship_fee_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_VALIDATION (no lines)"

      - name: order_initial_state_is_draft_unpaid
        claim_type: Initial State
        grounds: [entities.Order.fields.production_status, entities.Order.fields.payment_status, state_machines.Order.DRAFT_to_CONFIRMED]
        distinguishing_aspect: "A newly created order starts production_status DRAFT and payment_status UNPAID."
        test_recipe:
          setup: ["A shop and customer exist."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S10", tax_rate_bps: 0, rush_surcharge_bps: 0, rush_cutoff_hour_utc: 14, standard_turnaround_days: 3, rush_turnaround_days: 1, daily_unit_capacity: 50 }
              as: ShopStaff
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", email: "s10@x.com", name: "S10C" }
              as: ShopStaff
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
          assert:
            - "Order.${order_id}.production_status == DRAFT"
            - "Order.${order_id}.payment_status == UNPAID"

      - name: cancel_already_fulfilled_order_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Order.READY_to_FULFILLED, state_machines.Order.DRAFT_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From terminal FULFILLED, cancel is rejected ERR_INVALID_STATE (cancel only valid from DRAFT/CONFIRMED)."
        test_recipe:
          setup: ["An order driven all the way to FULFILLED (confirmed, invoiced, paid, produced, handed off)."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S11", tax_rate_bps: 0, rush_surcharge_bps: 0, rush_cutoff_hour_utc: 23, standard_turnaround_days: 3, rush_turnaround_days: 1, daily_unit_capacity: 50 }
              as: ShopStaff
              captures: { shop_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: ShopStaff
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", email: "s11@x.com", name: "S11C" }
              as: ShopStaff
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { shop_id: "${shop_id}", name: "P", category: "COPIES", base_unit_price_cents: 500, requires_proof: false, requires_press: false }
              as: ShopStaff
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", product_id: "${prod_id}", quantity: 10 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /artworks"
              payload: { order_line_id: "${line_id}", file_name: "s11.pdf", page_count: 1, dpi: 600, bleed_mm: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { art_id: $.data.id }
            - call: "POST /artworks/${art_id}/preflight"
              payload: {}
              as: ProductionOperator
            - call: "POST /fulfillments"
              payload: { order_id: "${order_id}", method: "PICKUP", ship_fee_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ful_id: $.data.id }
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/invoice"
              payload: {}
              as: ShopStaff
            - call: "POST /orders/${order_id}/pay"
              payload: { amount_cents: 5000 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/start-production"
              payload: {}
              as: ProductionOperator
            - call: "POST /order-lines/${line_id}/produce"
              payload: {}
              as: ProductionOperator
            - call: "POST /fulfillments/${ful_id}/hand-off"
              payload: {}
              as: ShopStaff
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v2: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: { expected_order_version: "${ord_v2}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

      - name: approve_already_approved_proof_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Proof.SUBMITTED_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a proof twice: second approve sees status APPROVED (not SUBMITTED) and returns ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["A proof on a requires_proof line, already APPROVED once."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S12", tax_rate_bps: 0, rush_surcharge_bps: 0, rush_cutoff_hour_utc: 23, standard_turnaround_days: 3, rush_turnaround_days: 1, daily_unit_capacity: 50 }
              as: ShopStaff
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", email: "s12@x.com", name: "S12C" }
              as: ShopStaff
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { shop_id: "${shop_id}", name: "Proofed", category: "BANNER", base_unit_price_cents: 5000, requires_proof: true, requires_press: false }
              as: ShopStaff
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", product_id: "${prod_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /artworks"
              payload: { order_line_id: "${line_id}", file_name: "s12.pdf", page_count: 1, dpi: 600, bleed_mm: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { art_id: $.data.id }
            - call: "POST /artworks/${art_id}/preflight"
              payload: {}
              as: ProductionOperator
            - call: "POST /proofs"
              payload: { order_line_id: "${line_id}" }
              as: ProductionOperator
              captures: { proof_id: $.data.id }
            - call: "POST /proofs/${proof_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /proofs/${proof_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

      - name: submit_proof_for_non_proof_product_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.OrderLine.PREFLIGHT_OK_to_PROOF_PENDING, "errors[ERR_PROOF_NOT_REQUIRED]", entities.Product.fields.requires_proof]
        distinguishing_aspect: "POST /proofs for a line whose product requires_proof=false returns ERR_PROOF_NOT_REQUIRED 409."
        test_recipe:
          setup: ["A preflight-OK line on a requires_proof=false product."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S13", tax_rate_bps: 0, rush_surcharge_bps: 0, rush_cutoff_hour_utc: 23, standard_turnaround_days: 3, rush_turnaround_days: 1, daily_unit_capacity: 50 }
              as: ShopStaff
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", email: "s13@x.com", name: "S13C" }
              as: ShopStaff
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { shop_id: "${shop_id}", name: "NoProof", category: "COPIES", base_unit_price_cents: 500, requires_proof: false, requires_press: false }
              as: ShopStaff
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", product_id: "${prod_id}", quantity: 10 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /artworks"
              payload: { order_line_id: "${line_id}", file_name: "s13.pdf", page_count: 1, dpi: 600, bleed_mm: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { art_id: $.data.id }
            - call: "POST /artworks/${art_id}/preflight"
              payload: {}
              as: ProductionOperator
          trigger:
            - call: "POST /proofs"
              payload: { order_line_id: "${line_id}" }
              as: ProductionOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_PROOF_NOT_REQUIRED"

      - name: preflight_fail_sets_failed_with_reason
        claim_type: Side Effect Execution
        grounds: [state_machines.Artwork.UPLOADED_to_FAILED, entities.Artwork.fields.preflight_reason, calculations.preflight_evaluation]
        distinguishing_aspect: "Preflight on dpi 100 (< MIN_DPI 150) sets preflight_status FAILED and preflight_reason citing DPI; line stays OPEN."
        test_recipe:
          setup: ["A line with an UPLOADED artwork at dpi 100, bleed 3."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S14", tax_rate_bps: 0, rush_surcharge_bps: 0, rush_cutoff_hour_utc: 23, standard_turnaround_days: 3, rush_turnaround_days: 1, daily_unit_capacity: 50 }
              as: ShopStaff
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", email: "s14@x.com", name: "S14C" }
              as: ShopStaff
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { shop_id: "${shop_id}", name: "P", category: "COPIES", base_unit_price_cents: 500, requires_proof: false, requires_press: false }
              as: ShopStaff
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", product_id: "${prod_id}", quantity: 10 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /artworks"
              payload: { order_line_id: "${line_id}", file_name: "s14.pdf", page_count: 1, dpi: 100, bleed_mm: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { art_id: $.data.id }
