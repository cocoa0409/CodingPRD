# =============================================================================
# PRD Benchmark Seed Tables — Allowance for Credit Losses (CECL) Estimation
# =============================================================================

scenario: |
  1967. Allowance for Credit Losses (CECL) Estimation: segmentation of portfolio
  by risk characteristics, lifetime loss modeling & reasonable-supportable forecast
  period, qualitative factor framework & documentation, individually evaluated loan
  analysis, reversion methodology & scenario weighting, quarterly model run, review
  & management adjustment, disclosure preparation & auditor support, back-testing
  & model refresh

domain_name: cecl-allowance
api_prefix: /cecl

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - derived_field_reconciliation
    - cascading_side_effects
  entity_topology: flat            # peer entities joined by FK references; no URL nesting except action/sub-resource GETs
  state_machine_shape: cyclic      # rework/reopen/return revision loops on ModelRun, IndividualEvaluation, DisclosureReport, PortfolioSegment
  relationship_patterns:
    - one_to_many                  # PortfolioSegment -> Loan, ModelRun -> IndividualEvaluation, etc.
    - self_referential             # LossModel.parent_model_id (refresh lineage)
    - cross_aggregate              # IndividualEvaluation joins ModelRun x Loan; BacktestResult selects a FINALIZED ModelRun
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: LossModel
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Model name (e.g., 'CECL Loss Rate v1')" }
      - { name: method, type: enum, source: input, description: "Lifetime loss method: LOSS_RATE | DISCOUNTED_CASH_FLOW | VINTAGE" }
      - { name: forecast_period_quarters, type: integer, source: input, description: "Reasonable & supportable forecast period F, 1..8 quarters" }
      - { name: reversion_method, type: enum, source: input, description: "IMMEDIATE | STRAIGHT_LINE — how rates revert to historical after the forecast horizon" }
      - { name: reversion_period_quarters, type: integer, source: input, description: "R, 0..4; MUST be 0 when reversion_method=IMMEDIATE, 1..4 when STRAIGHT_LINE, and F + R <= 8" }
      - { name: historical_lookback_quarters, type: integer, source: input, description: "Lookback window for historical rate anchoring, 1..40" }
      - { name: version_label, type: string, source: system, default: "v1", description: "Model version label; refresh increments v1 -> v2 -> ..." }
      - { name: parent_model_id, type: string, source: system, default: null, description: "FK -> LossModel.id; set on models created by refresh (refresh lineage), null otherwise" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED" }
      - { name: consecutive_backtest_breach_count, type: integer, source: system, default: 0, description: "Consecutive BREACH backtests; reset to 0 on PASS or on refresh" }
      - { name: refresh_required, type: boolean, source: system, default: false, description: "Set true when consecutive_backtest_breach_count reaches BREACH_COUNT_THRESHOLD; cleared by refresh" }

  - name: PortfolioSegment
    parent: null
    common_fields: true
    fields:
      - { name: segment_code, type: string, source: input, description: "Unique segment code (e.g., 'CC-NEARPRIME-2023')" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: product_type, type: enum, source: input, description: "CREDIT_CARD | AUTO | MORTGAGE | SMALL_BUSINESS | PERSONAL" }
      - { name: risk_rating_band, type: enum, source: input, description: "PRIME | NEAR_PRIME | SUBPRIME | DEEP_SUBPRIME — drives base loss rate" }
      - { name: vintage_year, type: integer, source: input, description: "Origination vintage year (e.g., 2023)" }
      - { name: status, type: enum, source: system, description: "OPEN | WATCH (auto-set by charge_off_rate threshold crossing)" }
      - { name: origination_total_cents, type: integer, source: system, default: 0, description: "Sum of initial amortized_cost_cents of every loan ever created in this segment; never decremented" }
      - { name: ytd_gross_charge_offs_cents, type: integer, source: system, default: 0, description: "Cumulative gross charge-offs" }
      - { name: ytd_recoveries_cents, type: integer, source: system, default: 0, description: "Cumulative recoveries against prior charge-offs" }
      - { name: charge_off_rate_bps, type: integer, source: computed, description: "round_half_up((ytd_gross_charge_offs_cents - ytd_recoveries_cents) * 10000 / origination_total_cents); 0 when origination_total_cents == 0" }
      - { name: base_loss_rate_bps, type: integer, source: computed, description: "Base annual lifetime loss rate from risk_rating_band: PRIME 50, NEAR_PRIME 150, SUBPRIME 400, DEEP_SUBPRIME 900" }

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - { name: segment_id, type: string, source: input, description: "FK -> PortfolioSegment.id" }
      - { name: loan_number, type: string, source: input, description: "Globally unique loan identifier" }
      - { name: amortized_cost_cents, type: integer, source: input, description: "Current amortized cost; > 0; reduced by partial charge-offs" }
      - { name: risk_rating, type: enum, source: input, description: "PASS | SPECIAL_MENTION | SUBSTANDARD | DOUBTFUL | LOSS" }
      - { name: delinquency_days, type: integer, source: input, default: 0, description: "Days past due, >= 0" }
      - { name: collateral_value_cents, type: integer, source: input, default: 0, description: "Appraised collateral value, >= 0" }
      - { name: individually_evaluated, type: boolean, source: computed, description: "true iff risk_rating IN {SUBSTANDARD, DOUBTFUL, LOSS} OR amortized_cost_cents >= INDIVIDUAL_EVAL_THRESHOLD_CENTS (100000000); excluded from collective reserve when true" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CHARGED_OFF" }
      - { name: charged_off_total_cents, type: integer, source: system, default: 0, description: "Cumulative charged-off amount on this loan" }
      - { name: recovered_total_cents, type: integer, source: system, default: 0, description: "Cumulative recoveries recorded on this loan" }

  - name: EconomicScenario
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Scenario name (e.g., 'Baseline 2026H1')" }
      - { name: scenario_type, type: enum, source: input, description: "BASELINE | ADVERSE | OPTIMISTIC" }
      - { name: unemployment_rate_bps, type: integer, source: input, description: "Forecast unemployment rate in basis points (e.g., 500 = 5.00%)" }
      - { name: gdp_growth_bps, type: integer, source: input, description: "Forecast GDP growth in basis points (may be negative)" }
      - { name: effective_from_period, type: string, source: input, description: "First covered quarter, 'YYYY-Qn'" }
      - { name: effective_to_period, type: string, source: input, description: "Half-open window end, 'YYYY-Qn'; scenario covers quarters [from, to), i.e. from_idx <= q < to_idx; MUST be strictly after effective_from_period" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED" }

  - name: QualitativeFactor
    parent: null
    common_fields: true
    fields:
      - { name: segment_id, type: string, source: input, description: "FK -> PortfolioSegment.id" }
      - { name: factor_code, type: enum, source: input, description: "CONCENTRATION_RISK | POLICY_CHANGE | ECONOMIC_UNCERTAINTY | COLLATERAL_VALUATION | MODEL_LIMITATION" }
      - { name: adjustment_bps, type: integer, source: input, description: "Signed adjustment to segment loss rate in basis points, -2000..2000, != 0" }
      - { name: effective_from_period, type: string, source: input, description: "First covered quarter, 'YYYY-Qn' (inclusive)" }
      - { name: effective_to_period, type: string, source: input, description: "Last covered quarter, 'YYYY-Qn' (INCLUSIVE — closed interval, unlike EconomicScenario)" }
      - { name: documentation_text, type: string, source: input, default: "", description: "Supporting narrative; required (>= 50 chars) before DRAFT -> DOCUMENTED" }
      - { name: status, type: enum, source: system, description: "DRAFT | DOCUMENTED | APPROVED | RETIRED" }

  - name: ModelRun
    parent: null
    common_fields: true
    fields:
      - { name: as_of_period, type: string, source: input, description: "Quarter the run estimates, 'YYYY-Qn'; must be strictly later than any FINALIZED run's as_of_period" }
      - { name: loss_model_id, type: string, source: input, description: "FK -> LossModel.id; model must be ACTIVE at create and at execute" }
      - { name: scenario_weights, type: array, source: input, description: "[{ scenario_id, weight_bps }]; weight_bps integers > 0 summing to exactly 10000; pinned at creation" }
      - { name: status, type: enum, source: system, description: "DRAFT | EXECUTED | UNDER_REVIEW | APPROVED | FINALIZED" }
      - { name: executed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the CreditAnalyst who executed the run (segregation-of-duties anchor)" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the approving ChiefCreditOfficer" }
      - { name: model_version_label, type: string, source: system, default: null, description: "LossModel.version_label snapshot pinned at execute" }
      - { name: needs_segmentation_review, type: boolean, source: system, default: false, description: "Set true on DRAFT runs when any segment enters WATCH (cascaded flag; informational)" }
      - { name: individual_evaluation_count, type: integer, source: system, default: 0, description: "Number of IndividualEvaluation rows created for this run" }
      - { name: reviewed_evaluation_count, type: integer, source: computed, default: 0, description: "Count of this run's IndividualEvaluations currently in REVIEWED" }
      - { name: total_exposure_cents, type: integer, source: system, default: 0, description: "Snapshot at execute: collective exposure + amortized cost of individually evaluated ACTIVE loans" }
      - { name: quantitative_reserve_cents, type: integer, source: computed, default: 0, description: "Sum of per-segment quantitative_reserve_cents (each rounded per segment BEFORE summing)" }
      - { name: qualitative_adjustment_cents, type: integer, source: computed, default: 0, description: "Sum of per-segment qualitative adjustments" }
      - { name: individual_reserve_cents, type: integer, source: computed, default: 0, description: "Sum of this run's IndividualEvaluation.specific_reserve_cents; re-synced on every evaluation mutation" }
      - { name: management_adjustment_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over this run's APPROVED ManagementAdjustments" }
      - { name: total_allowance_cents, type: integer, source: computed, default: 0, description: "quantitative_reserve_cents + qualitative_adjustment_cents + individual_reserve_cents + management_adjustment_cents" }
      - { name: segments_breakdown, type: array, source: system, default: [], description: "Snapshot rows: { segment_id, exposure_cents, base_loss_rate_bps, scenario_mult_bps, effective_mult_bps, lifetime_loss_rate_bps, qualitative_bps, quantitative_reserve_cents, qualitative_adjustment_cents, segment_allowance_cents }" }
      - { name: rework_notes, type: string, source: system, default: "", description: "Notes from the most recent request_rework" }

  - name: IndividualEvaluation
    parent: null
    common_fields: true
    fields:
      - { name: run_id, type: string, source: system, description: "FK -> ModelRun.id" }
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id" }
      - { name: method, type: enum, source: input, description: "COLLATERAL_FAIR_VALUE | DISCOUNTED_CASH_FLOW; defaults to COLLATERAL_FAIR_VALUE at creation" }
      - { name: collateral_value_cents, type: integer, source: input, description: "Collateral value used for COLLATERAL_FAIR_VALUE; copied from loan at creation" }
      - { name: expected_quarterly_cash_flows_cents, type: array, source: input, default: [], description: "Contractual expected cash flows per quarter [cf_1..cf_N]; required non-empty for DISCOUNTED_CASH_FLOW" }
      - { name: discount_rate_bps, type: integer, source: input, default: null, description: "Quarterly discount rate in bps; required for DISCOUNTED_CASH_FLOW" }
      - { name: analysis_notes, type: string, source: input, default: "", description: "Analyst narrative; required non-empty before submit" }
      - { name: specific_reserve_cents, type: integer, source: computed, description: "Per-method specific reserve (see individual_specific_reserve calculation)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | REVIEWED" }

  - name: ManagementAdjustment
    parent: null
    common_fields: true
    fields:
      - { name: run_id, type: string, source: system, description: "FK -> ModelRun.id" }
      - { name: amount_cents, type: integer, source: input, description: "Signed adjustment, != 0; |amount| capped at 10% of (quantitative + qualitative + individual) subtotal" }
      - { name: rationale, type: string, source: input, description: "Required non-empty justification" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator (segregation-of-duties anchor for approve)" }
      - { name: resolved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of approver/rejecter" }

  - name: DisclosureReport
    parent: null
    common_fields: true
    fields:
      - { name: run_id, type: string, source: system, description: "FK -> ModelRun.id; exactly one report per run, created at finalize" }
      - { name: beginning_allowance_cents, type: integer, source: system, description: "total_allowance_cents of the FINALIZED run with the greatest as_of_period strictly before this run's; 0 when none" }
      - { name: ending_allowance_cents, type: integer, source: system, description: "This run's total_allowance_cents at finalize" }
      - { name: period_charge_offs_cents, type: integer, source: input, description: "GL gross charge-offs for the period, >= 0 (supplied at finalize)" }
      - { name: period_recoveries_cents, type: integer, source: input, description: "GL recoveries for the period, >= 0 (supplied at finalize)" }
      - { name: provision_cents, type: integer, source: computed, description: "ending_allowance_cents - beginning_allowance_cents + period_charge_offs_cents - period_recoveries_cents" }
      - { name: status, type: enum, source: system, description: "PREPARED | UNDER_AUDIT_REVIEW | RELEASED" }
      - { name: audit_reference, type: string, source: system, default: "", description: "Auditor reference recorded at sign_off" }
      - { name: revision_notes, type: string, source: system, default: "", description: "Auditor notes recorded at return_for_revision" }

  - name: BacktestResult
    parent: null
    common_fields: false
    fields:
      - { name: loss_model_id, type: string, source: system, description: "FK -> LossModel.id" }
      - { name: backtest_period, type: string, source: input, description: "Quarter being backtested, 'YYYY-Qn'" }
      - { name: actual_loss_rate_bps, type: integer, source: input, description: "Observed loss rate for the period, 0..10000" }
      - { name: backtested_run_id, type: string, source: system, description: "id of the selected FINALIZED ModelRun (selection per backtest_run_selection); not a managed reference" }
      - { name: predicted_loss_rate_bps, type: integer, source: system, description: "round_half_up(selected_run.total_allowance_cents * 10000 / selected_run.total_exposure_cents)" }
      - { name: variance_bps, type: integer, source: computed, description: "actual_loss_rate_bps - predicted_loss_rate_bps" }
      - { name: outcome, type: enum, source: computed, description: "PASS when |variance_bps| <= 150; BREACH when |variance_bps| > 150 (strictly greater)" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: LossModel
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /cecl/loss-models/{modelId}/activate"
        actor: ModelValidator
        preconditions:
          - "Model is DRAFT (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Any other LossModel currently ACTIVE transitions to RETIRED (auto-retire)"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /cecl/loss-models/{modelId}/retire"
        actor: ModelValidator
        preconditions:
          - "No ModelRun with status IN {DRAFT, EXECUTED, UNDER_REVIEW, APPROVED} references this model (ERR_MODEL_IN_USE)"
        side_effects: []
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /cecl/loss-models/{modelId}/refresh (creates a NEW DRAFT LossModel; this model itself stays ACTIVE)"
        actor: ModelValidator
        preconditions:
          - "refresh_required == true (ERR_REFRESH_NOT_REQUIRED)"
        side_effects:
          - "Create new LossModel: status DRAFT, parent_model_id = this model's id, version_label incremented (vN -> vN+1), config fields copied"
          - "This model: refresh_required = false, consecutive_backtest_breach_count = 0"

  - entity: PortfolioSegment
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: WATCH
        trigger: "system (recomputed during POST /cecl/loans/{loanId}/charge_off)"
        actor: system
        preconditions:
          - "recomputed charge_off_rate_bps > WATCH_RATE_THRESHOLD_BPS (200)"
        side_effects:
          - "Every ModelRun with status == DRAFT has needs_segmentation_review set true"
      - from: WATCH
        to: OPEN
        trigger: "system (recomputed during POST /cecl/loans/{loanId}/record_recovery)"
        actor: system
        preconditions:
          - "recomputed charge_off_rate_bps <= WATCH_RATE_THRESHOLD_BPS (200)"
        side_effects: []

  - entity: Loan
    initial_state: ACTIVE
    terminal_states: [CHARGED_OFF]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /cecl/loans/{loanId}/charge_off (partial: charge_off_amount_cents < amortized_cost_cents)"
        actor: CreditAnalyst
        preconditions:
          - "charge_off_amount_cents >= 1 and <= amortized_cost_cents (ERR_CHARGE_OFF_EXCEEDS_BALANCE)"
        side_effects:
          - "amortized_cost_cents -= charge_off_amount_cents; charged_off_total_cents += charge_off_amount_cents"
          - "PortfolioSegment.ytd_gross_charge_offs_cents += charge_off_amount_cents (hop 1 of cascade)"
          - "PortfolioSegment.charge_off_rate_bps recomputed; if > 200, segment OPEN -> WATCH (hop 2)"
          - "On segment entering WATCH: every DRAFT ModelRun gets needs_segmentation_review = true (hop 3)"
      - from: ACTIVE
        to: CHARGED_OFF
        trigger: "POST /cecl/loans/{loanId}/charge_off (full: charge_off_amount_cents == amortized_cost_cents)"
        actor: CreditAnalyst
        preconditions:
          - "charge_off_amount_cents >= 1 and <= amortized_cost_cents (ERR_CHARGE_OFF_EXCEEDS_BALANCE)"
        side_effects:
          - "amortized_cost_cents = 0; charged_off_total_cents += charge_off_amount_cents"
          - "PortfolioSegment.ytd_gross_charge_offs_cents += charge_off_amount_cents (hop 1 of cascade)"
          - "PortfolioSegment.charge_off_rate_bps recomputed; if > 200, segment OPEN -> WATCH (hop 2)"
          - "On segment entering WATCH: every DRAFT ModelRun gets needs_segmentation_review = true (hop 3)"
      - from: CHARGED_OFF
        to: CHARGED_OFF
        trigger: "POST /cecl/loans/{loanId}/record_recovery"
        actor: CreditAnalyst
        preconditions:
          - "recovered_total_cents + recovery_amount_cents <= charged_off_total_cents (ERR_RECOVERY_EXCEEDS_CHARGE_OFF)"
          - "recovery_amount_cents >= 1"
        side_effects:
          - "recovered_total_cents += recovery_amount_cents"
          - "PortfolioSegment.ytd_recoveries_cents += recovery_amount_cents"
          - "PortfolioSegment.charge_off_rate_bps recomputed; if <= 200 and segment WATCH, segment WATCH -> OPEN"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /cecl/loans/{loanId}/record_recovery (recovery on a partially charged ACTIVE loan)"
        actor: CreditAnalyst
        preconditions:
          - "charged_off_total_cents > 0 (ERR_INVALID_STATE_TRANSITION — nothing to recover against)"
          - "recovered_total_cents + recovery_amount_cents <= charged_off_total_cents (ERR_RECOVERY_EXCEEDS_CHARGE_OFF)"
        side_effects:
          - "recovered_total_cents += recovery_amount_cents; segment counters and rate recomputed as above"

  - entity: EconomicScenario
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /cecl/economic-scenarios/{scenarioId}/archive"
        actor: ModelValidator
        preconditions:
          - "No ModelRun with status IN {DRAFT, EXECUTED, UNDER_REVIEW, APPROVED} references this scenario in scenario_weights (ERR_SCENARIO_IN_USE); FINALIZED runs do not block"
        side_effects: []

  - entity: QualitativeFactor
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: DOCUMENTED
        trigger: "POST /cecl/qualitative-factors/{factorId}/document"
        actor: CreditAnalyst
        preconditions:
          - "documentation_text (request body) has trimmed length >= 50 characters (ERR_FACTOR_DOCUMENTATION_INSUFFICIENT)"
        side_effects:
          - "documentation_text stored on the factor"
      - from: DOCUMENTED
        to: APPROVED
        trigger: "POST /cecl/qualitative-factors/{factorId}/approve"
        actor: ChiefCreditOfficer
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: RETIRED
        trigger: "POST /cecl/qualitative-factors/{factorId}/retire"
        actor: ChiefCreditOfficer
        preconditions: []
        side_effects:
          - "Retired factors are excluded from qualitative_adjustment for all future runs"

  - entity: ModelRun
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /cecl/model-runs/{runId}/execute"
        actor: CreditAnalyst
        preconditions:
          - "Referenced LossModel.status == ACTIVE (ERR_MODEL_NOT_ACTIVE)"
        side_effects:
          - "Compute segments_breakdown per segment (see quantitative_reserve + qualitative_adjustment); snapshot run totals and total_exposure_cents"
          - "Create one IndividualEvaluation (DRAFT, method COLLATERAL_FAIR_VALUE, collateral_value_cents copied) per ACTIVE loan with individually_evaluated == true"
          - "individual_evaluation_count = number created; model_version_label pinned; executed_by_user_id = caller X-User-ID"
      - from: EXECUTED
        to: UNDER_REVIEW
        trigger: "POST /cecl/model-runs/{runId}/submit_for_review"
        actor: CreditAnalyst
        preconditions:
          - "Every IndividualEvaluation of this run is REVIEWED (ERR_EVALUATIONS_OUTSTANDING); vacuously satisfied when the run has zero evaluations"
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /cecl/model-runs/{runId}/approve"
        actor: ChiefCreditOfficer
        preconditions:
          - "Caller X-User-ID != executed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "approved_by_user_id = caller X-User-ID"
      - from: UNDER_REVIEW
        to: EXECUTED
        trigger: "POST /cecl/model-runs/{runId}/request_rework"
        actor: ChiefCreditOfficer
        preconditions: []
        side_effects:
          - "rework_notes stored; run returns to EXECUTED for further evaluation/adjustment (rework cycle)"
      - from: APPROVED
        to: FINALIZED
        trigger: "POST /cecl/model-runs/{runId}/finalize"
        actor: ChiefCreditOfficer
        preconditions:
          - "No ManagementAdjustment of this run is PENDING (ERR_ADJUSTMENTS_PENDING)"
        side_effects:
          - "Create DisclosureReport (PREPARED): beginning_allowance_cents per prior_finalized_allowance selector, ending_allowance_cents = total_allowance_cents, provision_cents computed (hop 1 of finalize cascade)"
          - "provision_cents = ending - beginning + period_charge_offs_cents - period_recoveries_cents computed on the created report (hop 2)"

  - entity: IndividualEvaluation
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /cecl/individual-evaluations/{evaluationId}/submit"
        actor: CreditAnalyst
        preconditions:
          - "Parent ModelRun.status IN {EXECUTED, UNDER_REVIEW} (ERR_INVALID_STATE_TRANSITION)"
          - "analysis_notes non-empty after trim (ERR_ANALYSIS_DOCUMENTATION_REQUIRED)"
        side_effects:
          - "Re-sync run.individual_reserve_cents and run.total_allowance_cents"
      - from: SUBMITTED
        to: REVIEWED
        trigger: "POST /cecl/individual-evaluations/{evaluationId}/review"
        actor: ChiefCreditOfficer
        preconditions:
          - "Parent ModelRun.status IN {EXECUTED, UNDER_REVIEW} (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "run.reviewed_evaluation_count recomputed; run.individual_reserve_cents and run.total_allowance_cents re-synced"
      - from: REVIEWED
        to: SUBMITTED
        trigger: "POST /cecl/individual-evaluations/{evaluationId}/reopen"
        actor: ChiefCreditOfficer
        preconditions:
          - "Parent ModelRun.status IN {EXECUTED, UNDER_REVIEW} (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "run.reviewed_evaluation_count recomputed (reopen cycle)"

  - entity: ManagementAdjustment
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /cecl/management-adjustments/{adjustmentId}/approve"
        actor: ChiefCreditOfficer
        preconditions:
          - "Parent ModelRun.status IN {EXECUTED, UNDER_REVIEW} (ERR_INVALID_STATE_TRANSITION)"
          - "Caller X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "run.management_adjustment_cents += amount_cents (hop 1)"
          - "run.total_allowance_cents recomputed (hop 2); run.version increments"
          - "resolved_by_user_id = caller"
      - from: PENDING
        to: REJECTED
        trigger: "POST /cecl/management-adjustments/{adjustmentId}/reject"
        actor: ChiefCreditOfficer
        preconditions:
          - "Parent ModelRun.status IN {EXECUTED, UNDER_REVIEW, APPROVED} (ERR_INVALID_STATE_TRANSITION) — rejection never alters run totals, so it stays available on APPROVED runs to unblock finalize"
        side_effects:
          - "resolved_by_user_id = caller; run totals unchanged"

  - entity: DisclosureReport
    initial_state: PREPARED
    terminal_states: [RELEASED]
    transitions:
      - from: PREPARED
        to: UNDER_AUDIT_REVIEW
        trigger: "POST /cecl/disclosure-reports/{reportId}/submit_for_audit"
        actor: CreditAnalyst
        preconditions: []
        side_effects: []
      - from: UNDER_AUDIT_REVIEW
        to: RELEASED
        trigger: "POST /cecl/disclosure-reports/{reportId}/sign_off"
        actor: ExternalAuditor
        preconditions:
          - "audit_reference non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "audit_reference stored"
      - from: UNDER_AUDIT_REVIEW
        to: PREPARED
        trigger: "POST /cecl/disclosure-reports/{reportId}/return_for_revision"
        actor: ExternalAuditor
        preconditions:
          - "revision_notes non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "revision_notes stored (return-for-revision cycle)"

# =============================================================================
# Concurrency Rules (§1.2.1) — OCC on parent version only
# =============================================================================
concurrency_rules:
  - rule_id: ma-create-stale-run
    parent_entity: ModelRun
    write_endpoint: "POST /cecl/model-runs/{id}/management-adjustments"
    occ_field: expected_model_run_version
    description: |
      Creating a ManagementAdjustment against a ModelRun whose version has
      advanced beyond the client's last observed version is rejected. The new
      adjustment would legitimately be accepted against a current view of the
      run, so the stale write is refused on OCC grounds: expected_model_run_version
      must equal the run's current version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: evaluation-update-stale
    parent_entity: IndividualEvaluation
    write_endpoint: "PATCH /cecl/individual-evaluations/{evaluationId}"
    occ_field: expected_evaluation_version
    description: |
      Updating an IndividualEvaluation whose version has advanced since the
      client last read it is rejected. A prior successful PATCH has legitimately
      advanced the evaluation, so the stale writer is refused on OCC grounds:
      expected_evaluation_version must equal the evaluation's current version.
    error_id: ERR_EVALUATION_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: individual_evaluation_flag
    trigger: "Loan creation (POST /cecl/loans)"
    algorithm: threshold
    formula: |
      individually_evaluated =
        (risk_rating IN {SUBSTANDARD, DOUBTFUL, LOSS})
        OR (amortized_cost_cents >= INDIVIDUAL_EVAL_THRESHOLD_CENTS)
      Boundary: amortized_cost_cents exactly equal to the threshold IS individually evaluated (>=).
    input_set: "The loan being created"
    constants:
      INDIVIDUAL_EVAL_THRESHOLD_CENTS: 100000000
    precision: "boolean; no rounding"

  - name: segment_base_loss_rate
    trigger: "Segment read; ModelRun execute"
    algorithm: aggregation
    formula: |
      base_loss_rate_bps = BASE_RATE_BY_BAND[risk_rating_band]
    input_set: "The segment's risk_rating_band"
    constants:
      BASE_RATE_PRIME_BPS: 50
      BASE_RATE_NEAR_PRIME_BPS: 150
      BASE_RATE_SUBPRIME_BPS: 400
      BASE_RATE_DEEP_SUBPRIME_BPS: 900
    precision: "integer bps; no rounding"

  - name: scenario_loss_multiplier
    trigger: "ModelRun execute (per scenario referenced in scenario_weights)"
    algorithm: constraint_propagation
    formula: |
      mult_bps(s) = clamp(
        10000 + (s.unemployment_rate_bps - U_NEUTRAL_BPS) * SENS_U
              + (GDP_NEUTRAL_BPS - s.gdp_growth_bps) * SENS_G,
        MIN_MULT_BPS, MAX_MULT_BPS)
    input_set: "Each EconomicScenario referenced by the run's scenario_weights"
    constants:
      U_NEUTRAL_BPS: 500
      SENS_U: 20
      GDP_NEUTRAL_BPS: 200
      SENS_G: 10
      MIN_MULT_BPS: 5000
      MAX_MULT_BPS: 30000
    precision: "integer bps; clamp applied last"

  - name: quantitative_reserve
    trigger: "ModelRun execute (per segment)"
    algorithm: forward_looking
    formula: |
      # Scenario blend (two variants — see variants below)
      M = scenario-blended multiplier (exact decimal; see variants)
      # Reversion to historical (multiplier 1.0) after forecast horizon F, life L = 8
      IF reversion_method == IMMEDIATE:
        E = (F * M + (L - F) * 1.0) / L
      IF reversion_method == STRAIGHT_LINE:
        REV = SUM_{i=1..R} ( M - (M - 1.0) * i / (R + 1) )
        E = (F * M + REV + (L - F - R) * 1.0) / L
      # All intermediate math is EXACT (no intermediate rounding).
      lifetime_loss_rate_bps = round_half_up(base_loss_rate_bps * E)
      exposure_cents = SUM(amortized_cost_cents) over loans of the segment
                       with status == ACTIVE AND individually_evaluated == false
      quantitative_reserve_cents = round_half_up(exposure_cents * lifetime_loss_rate_bps / 10000)
      # Rounding order is PINNED: rate first (whole bps), then per-segment reserve (whole cents).
    input_set: "Segments with their ACTIVE, collectively-evaluated loans; the run's scenario_weights; the run's LossModel (F, R, reversion_method)"
    constants:
      REMAINING_LIFE_QUARTERS: 8
    precision: "rate rounded half_up to integer bps; reserve rounded half_up to whole cents; no other rounding"
    variants:
      - name: single_scenario
        when: "scenario_weights contains exactly one entry"
        difference: "M = mult_bps(that scenario) / 10000 — no weighting applied"
      - name: weighted_scenarios
        when: "scenario_weights contains two or more entries"
        difference: "M = SUM(weight_bps_s * mult_bps(s)) / 10000 / 10000 — weights blend the multipliers; identical portfolio data yields a different rate than single_scenario"

  - name: qualitative_adjustment
    trigger: "ModelRun execute (per segment)"
    algorithm: aggregation
    formula: |
      qualitative_bps = SUM(adjustment_bps) over QualitativeFactors where
        segment_id == segment.id AND status == APPROVED
        AND quarter_index(effective_from_period) <= quarter_index(run.as_of_period)
        AND quarter_index(run.as_of_period) <= quarter_index(effective_to_period)   # closed window
      qualitative_adjustment_cents = round_half_up(exposure_cents * qualitative_bps / 10000)
      # Floor: a segment's allowance cannot go below zero.
      IF quantitative_reserve_cents + qualitative_adjustment_cents < 0:
        qualitative_adjustment_cents = -quantitative_reserve_cents
      segment_allowance_cents = quantitative_reserve_cents + qualitative_adjustment_cents
    input_set: "APPROVED QualitativeFactors whose closed effective window covers run.as_of_period"
    precision: "round_half_up to whole cents"

  - name: individual_specific_reserve
    trigger: "IndividualEvaluation creation (execute), and every PATCH of the evaluation"
    algorithm: dual_method
    formula: |
      IF method == COLLATERAL_FAIR_VALUE:
        net_collateral = collateral_value_cents - round_half_up(collateral_value_cents * COST_TO_SELL_BPS / 10000)
        specific_reserve_cents = max(0, loan.amortized_cost_cents - net_collateral)
      IF method == DISCOUNTED_CASH_FLOW:
        r = discount_rate_bps / 10000  (quarterly)
        PV = SUM_{t=1..N} expected_quarterly_cash_flows_cents[t] / (1 + r)^t   # exact until final round
        specific_reserve_cents = max(0, loan.amortized_cost_cents - round_half_up(PV))
    input_set: "The evaluation's loan (amortized_cost_cents at snapshot) and its own method inputs"
    constants:
      COST_TO_SELL_BPS: 1000
    precision: "round_half_up to whole cents; PV rounded once at the end"
    variants:
      - name: collateral_fair_value
        when: "method == COLLATERAL_FAIR_VALUE (default at creation)"
        difference: "Reserve driven by liquidation value net of 10% cost-to-sell"
      - name: discounted_cash_flow
        when: "method == DISCOUNTED_CASH_FLOW (set via PATCH)"
        difference: "Reserve driven by present value of expected cash flows; identical loan data yields a different reserve than collateral_fair_value"

  - name: run_totals
    trigger: "ModelRun execute; every IndividualEvaluation mutation; ManagementAdjustment approve"
    algorithm: aggregation
    formula: |
      # PINNED rounding order: per-segment amounts are rounded to whole cents FIRST, then summed.
      quantitative_reserve_cents   = SUM over segments of quantitative_reserve_cents (already rounded per segment)
      qualitative_adjustment_cents = SUM over segments of qualitative_adjustment_cents
      individual_reserve_cents     = SUM over run's IndividualEvaluations of specific_reserve_cents
      management_adjustment_cents  = SUM over run's APPROVED ManagementAdjustments of amount_cents
      total_allowance_cents        = quantitative + qualitative + individual + management_adjustment
      total_exposure_cents         = SUM of segment exposures (collective) + SUM of amortized_cost_cents of individually evaluated ACTIVE loans
    input_set: "This run's segments_breakdown, IndividualEvaluations, APPROVED ManagementAdjustments"
    precision: "integer cents; sums of already-rounded components (never re-round the sum)"

  - name: management_adjustment_cap
    trigger: "ManagementAdjustment creation"
    algorithm: threshold
    formula: |
      subtotal = run.quantitative_reserve_cents + run.qualitative_adjustment_cents + run.individual_reserve_cents
      cap_cents = round_half_up(subtotal * CAP_PERCENT)
      accept iff 1 <= |amount_cents| <= cap_cents   # equality with the cap is accepted
    input_set: "The parent run's current subtotal"
    constants:
      CAP_PERCENT: 0.10
    precision: "cap rounded half_up to whole cents"

  - name: backtest_outcome
    trigger: "POST /cecl/loss-models/{modelId}/backtests"
    algorithm: threshold
    formula: |
      selected_run = per backtest_run_selection
      predicted_loss_rate_bps = round_half_up(selected_run.total_allowance_cents * 10000 / selected_run.total_exposure_cents)
      variance_bps = actual_loss_rate_bps - predicted_loss_rate_bps
      outcome = BREACH iff |variance_bps| > BREACH_VARIANCE_THRESHOLD_BPS   # exactly 150 is PASS
      On BREACH: model.consecutive_backtest_breach_count += 1 (hop 1);
                 if the count then >= BREACH_COUNT_THRESHOLD, model.refresh_required = true (hop 2)
      On PASS:  model.consecutive_backtest_breach_count = 0 (refresh_required unchanged)
    input_set: "The model's selected FINALIZED run; the actual loss rate input"
    constants:
      BREACH_VARIANCE_THRESHOLD_BPS: 150
      BREACH_COUNT_THRESHOLD: 2
    precision: "integer bps"

  - name: backtest_run_selection
    trigger: "POST /cecl/loss-models/{modelId}/backtests"
    algorithm: selector
    formula: |
      candidates = ModelRuns where loss_model_id == model.id AND status == FINALIZED
                   AND quarter_index(as_of_period) <= quarter_index(backtest_period)
      rank by quarter_index(as_of_period) DESC
      tie-break: not needed (as_of_period is unique among FINALIZED runs per period-forward rule)
      empty candidate set: reject with ERR_NO_FINALIZED_RUN
    input_set: "FINALIZED ModelRuns of this LossModel"
    precision: "quarter index = year * 4 + (quarter_number - 1)"

  - name: segment_charge_off_rate
    trigger: "Loan charge_off and record_recovery"
    algorithm: threshold
    formula: |
      net_charge_offs = ytd_gross_charge_offs_cents - ytd_recoveries_cents
      charge_off_rate_bps = 0 if origination_total_cents == 0
                          else round_half_up(net_charge_offs * 10000 / origination_total_cents)
      if charge_off_rate_bps > WATCH_RATE_THRESHOLD_BPS and status == OPEN: status -> WATCH
      if charge_off_rate_bps <= WATCH_RATE_THRESHOLD_BPS and status == WATCH: status -> OPEN
      Boundary: exactly 200 bps does NOT trigger WATCH (strict >).
    input_set: "The segment's counters"
    constants:
      WATCH_RATE_THRESHOLD_BPS: 200
    precision: "round_half_up to integer bps"

  - name: rollforward_provision
    trigger: "ModelRun finalize (DisclosureReport creation)"
    algorithm: aggregation
    formula: |
      beginning_allowance_cents = per prior_finalized_allowance selector (0 when none)
      ending_allowance_cents    = run.total_allowance_cents
      provision_cents = ending_allowance_cents - beginning_allowance_cents
                        + period_charge_offs_cents - period_recoveries_cents
      Rollforward identity (always holds): ending == beginning + provision - (charge_offs - recoveries)
    input_set: "The run being finalized; prior FINALIZED runs; GL inputs at finalize"
    precision: "integer cents"

  - name: prior_finalized_allowance
    trigger: "ModelRun finalize"
    algorithm: selector
    formula: |
      candidates = ModelRuns where status == FINALIZED
                   AND quarter_index(as_of_period) < quarter_index(this run's as_of_period)
      rank by quarter_index(as_of_period) DESC; take first
      tie-break: not needed (as_of_period unique among FINALIZED runs)
      empty candidate set: beginning_allowance_cents = 0
    input_set: "All FINALIZED ModelRuns"
    precision: "quarter index = year * 4 + (quarter_number - 1)"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Caller role is allowed for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Every id in the path exists (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: existence
    check: "Request body shape: required fields present, types valid, enum members valid, period strings match 'YYYY-Qn' with n in 1..4; unknown/system-managed fields in the body are IGNORED (not rejected)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 5
    category: state
    check: "Target resource is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version"
    error_id: "ERR_STALE_VERSION | ERR_EVALUATION_STALE_VERSION"
    http_status: 412
    applies_to: "POST /cecl/model-runs/{id}/management-adjustments; PATCH /cecl/individual-evaluations/{evaluationId}"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: run approve requires caller != executed_by_user_id; adjustment approve requires caller != created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /cecl/model-runs/{runId}/approve; POST /cecl/management-adjustments/{adjustmentId}/approve"
  - priority: 8
    category: business_temporal
    check: "ModelRun creation: as_of_period strictly later than every FINALIZED run's as_of_period"
    error_id: ERR_PERIOD_NOT_FORWARD
    http_status: 409
    applies_to: "POST /cecl/model-runs"
  - priority: 9
    category: business_referential
    check: "Referenced configuration is usable: LossModel ACTIVE on run create/execute (ERR_MODEL_NOT_ACTIVE); segment OPEN on loan create (ERR_SEGMENT_NOT_OPEN); every scenario in scenario_weights ACTIVE (ERR_SCENARIO_NOT_ACTIVE)"
    error_id: "ERR_MODEL_NOT_ACTIVE | ERR_SEGMENT_NOT_OPEN | ERR_SCENARIO_NOT_ACTIVE"
    http_status: 409
    applies_to: "POST /cecl/model-runs; POST /cecl/model-runs/{runId}/execute; POST /cecl/loans"
  - priority: 10
    category: business_constraint
    check: "Structural rules: scenario weight_bps sum == 10000 (ERR_WEIGHT_SUM_INVALID); scenario half-open windows per scenario_type do not overlap among ACTIVE scenarios (ERR_SCENARIO_WINDOW_OVERLAP); factor closed windows per (segment_id, factor_code) do not overlap among non-RETIRED factors (ERR_FACTOR_WINDOW_OVERLAP); reversion config: IMMEDIATE requires reversion_period_quarters == 0, STRAIGHT_LINE requires 1..4, and F + R <= 8 (ERR_INVALID_REVERSION_CONFIG); scenario effective_to strictly after effective_from (ERR_INVALID_REQUEST); segment_code unique (ERR_DUPLICATE_SEGMENT_CODE); loan_number unique (ERR_DUPLICATE_LOAN_NUMBER); adjustment amount != 0 (ERR_ZERO_ADJUSTMENT); scenario archive blocked while referenced by an in-flight run (ERR_SCENARIO_IN_USE); model retire blocked while referenced by an in-flight run (ERR_MODEL_IN_USE); refresh requires refresh_required (ERR_REFRESH_NOT_REQUIRED); submit_for_review requires all evaluations REVIEWED (ERR_EVALUATIONS_OUTSTANDING); finalize requires no PENDING adjustments (ERR_ADJUSTMENTS_PENDING); backtest requires a selectable FINALIZED run (ERR_NO_FINALIZED_RUN); DCF method requires non-empty expected_quarterly_cash_flows_cents and discount_rate_bps (ERR_INVALID_REQUEST); factor document requires documentation_text >= 50 chars (ERR_FACTOR_DOCUMENTATION_INSUFFICIENT); evaluation submit requires non-empty analysis_notes (ERR_ANALYSIS_DOCUMENTATION_REQUIRED)"
    error_id: "ERR_WEIGHT_SUM_INVALID | ERR_SCENARIO_WINDOW_OVERLAP | ERR_FACTOR_WINDOW_OVERLAP | ERR_INVALID_REVERSION_CONFIG | ERR_DUPLICATE_SEGMENT_CODE | ERR_DUPLICATE_LOAN_NUMBER | ERR_ZERO_ADJUSTMENT | ERR_SCENARIO_IN_USE | ERR_MODEL_IN_USE | ERR_REFRESH_NOT_REQUIRED | ERR_EVALUATIONS_OUTSTANDING | ERR_ADJUSTMENTS_PENDING | ERR_NO_FINALIZED_RUN | ERR_FACTOR_DOCUMENTATION_INSUFFICIENT | ERR_ANALYSIS_DOCUMENTATION_REQUIRED | ERR_INVALID_REQUEST"
    http_status: "422 for amount/config errors; 409 for uniqueness/in-use/gating"
    applies_to: "per-check endpoints as named"
  - priority: 11
    category: business_fiscal
    check: "Amount sanity: charge_off_amount_cents <= amortized_cost_cents (ERR_CHARGE_OFF_EXCEEDS_BALANCE); cumulative recoveries <= cumulative charge-offs per loan (ERR_RECOVERY_EXCEEDS_CHARGE_OFF); |adjustment amount| <= 10% cap of run subtotal (ERR_ADJUSTMENT_EXCEEDS_CAP)"
    error_id: "ERR_CHARGE_OFF_EXCEEDS_BALANCE | ERR_RECOVERY_EXCEEDS_CHARGE_OFF | ERR_ADJUSTMENT_EXCEEDS_CAP"
    http_status: 422
    applies_to: "POST /cecl/loans/{loanId}/charge_off; POST /cecl/loans/{loanId}/record_recovery; POST /cecl/model-runs/{id}/management-adjustments"

# =============================================================================
# Table 1.0: Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- LossModel ---
  - method: POST
    path: "/cecl/loss-models"
    description: "Create a LossModel in DRAFT"
    roles: [ModelValidator]
    code: 201
    input: [name, method, forecast_period_quarters, reversion_method, reversion_period_quarters, historical_lookback_quarters]
    output: LossModel
    side_effects: ["status=DRAFT, version_label=v1, counters zeroed"]
  - method: GET
    path: "/cecl/loss-models"
    description: "List LossModels"
    roles: [CreditAnalyst, ModelValidator, ChiefCreditOfficer, ExternalAuditor]
    code: 200
    input: ["status?", "parent_model_id?", "limit?", "offset?"]
    output: "LossModel[]"
    side_effects: []
  - method: GET
    path: "/cecl/loss-models/{modelId}"
    description: "Get a LossModel"
    roles: [CreditAnalyst, ModelValidator, ChiefCreditOfficer, ExternalAuditor]
    code: 200
    input: []
    output: LossModel
    side_effects: []
  - method: POST
    path: "/cecl/loss-models/{modelId}/activate"
    description: "Activate a DRAFT model; any other ACTIVE model is auto-retired"
    roles: [ModelValidator]
    code: 200
    input: []
    output: LossModel
    side_effects: ["status DRAFT -> ACTIVE", "other ACTIVE models -> RETIRED"]
  - method: POST
    path: "/cecl/loss-models/{modelId}/retire"
    description: "Retire an ACTIVE model (blocked while in-flight runs reference it)"
    roles: [ModelValidator]
    code: 200
    input: []
    output: LossModel
    side_effects: ["status ACTIVE -> RETIRED"]
  - method: POST
    path: "/cecl/loss-models/{modelId}/refresh"
    description: "Refresh a breached model: creates a successor DRAFT model with parent_model_id lineage"
    roles: [ModelValidator]
    code: 201
    input: []
    output: LossModel
    side_effects: ["new LossModel DRAFT with version_label incremented", "this model refresh_required=false, consecutive_backtest_breach_count=0"]
  - method: POST
    path: "/cecl/loss-models/{modelId}/backtests"
    description: "Record a back-test of the model against its selected FINALIZED run"
    roles: [ModelValidator]
    code: 201
    input: [backtest_period, actual_loss_rate_bps]
    output: BacktestResult
    side_effects: ["BacktestResult created (outcome computed)", "model.consecutive_backtest_breach_count incremented on BREACH / reset to 0 on PASS", "model.refresh_required=true when count reaches 2"]
  - method: GET
    path: "/cecl/loss-models/{id}/backtest-results"
    description: "List back-test results for a model"
    roles: [CreditAnalyst, ModelValidator, ChiefCreditOfficer, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "BacktestResult[]"
    side_effects: []

  # --- PortfolioSegment ---
  - method: POST
    path: "/cecl/portfolio-segments"
    description: "Create a PortfolioSegment in OPEN"
    roles: [CreditAnalyst]
    code: 201
    input: [segment_code, name, product_type, risk_rating_band, vintage_year]
    output: PortfolioSegment
    side_effects: ["status=OPEN, counters zeroed"]
  - method: GET
    path: "/cecl/portfolio-segments/{segmentId}"
    description: "Get a PortfolioSegment"
    roles: [CreditAnalyst, ModelValidator, ChiefCreditOfficer, ExternalAuditor]
    code: 200
    input: []
    output: PortfolioSegment
    side_effects: []
  - method: GET
    path: "/cecl/portfolio-segments/{id}/loans"
    description: "List loans of a segment (reverse reachability for Loan.segment_id)"
    roles: [CreditAnalyst, ModelValidator, ChiefCreditOfficer, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Loan[]"
    side_effects: []
  - method: GET
    path: "/cecl/portfolio-segments/{id}/qualitative-factors"
    description: "List qualitative factors of a segment (reverse reachability for QualitativeFactor.segment_id)"
    roles: [CreditAnalyst, ModelValidator, ChiefCreditOfficer, ExternalAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "QualitativeFactor[]"
    side_effects: []

  # --- Loan ---
  - method: POST
    path: "/cecl/loans"
    description: "Create a Loan in a segment (segment must be OPEN)"
    roles: [CreditAnalyst]
    code: 201
    input: [segment_id, loan_number, amortized_cost_cents, risk_rating, "delinquency_days?", "collateral_value_cents?"]
    output: Loan
    side_effects: ["individually_evaluated computed", "segment.origination_total_cents += amortized_cost_cents"]
  - method: GET
    path: "/cecl/loans/{loanId}"
    description: "Get a Loan"
    roles: [CreditAnalyst, ModelValidator, ChiefCreditOfficer, ExternalAuditor]
    code: 200
    input: []
    output: Loan
    side_effects: []
  - method: POST
    path: "/cecl/loans/{loanId}/charge_off"
    description: "Record a full or partial charge-off; cascades segment counters, WATCH status, and DRAFT-run flags"
    roles: [CreditAnalyst]
    code: 200
    input: [charge_off_amount_cents, charge_off_period]
    output: Loan
    side_effects: ["loan balance/status updated", "segment.ytd_gross_charge_offs_cents incremented", "segment charge_off_rate recompute -> possible OPEN->WATCH", "DRAFT runs flagged needs_segmentation_review on WATCH entry"]
  - method: POST
    path: "/cecl/loans/{loanId}/record_recovery"
    description: "Record a recovery against prior charge-offs; may auto-clear segment WATCH"
    roles: [CreditAnalyst]
    code: 200
    input: [recovery_amount_cents, recovery_period]
    output: Loan
    side_effects: ["recovered_total_cents incremented", "segment.ytd_recoveries_cents incremented", "segment charge_off_rate recompute -> possible WATCH->OPEN"]

  # --- EconomicScenario ---
  - method: POST
    path: "/cecl/economic-scenarios"
    description: "Create an ACTIVE EconomicScenario; half-open windows per scenario_type must not overlap among ACTIVE scenarios"
    roles: [ModelValidator]
    code: 201
    input: [name, scenario_type, unemployment_rate_bps, gdp_growth_bps, effective_from_period, effective_to_period]
    output: EconomicScenario
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/cecl/economic-scenarios/{scenarioId}"
    description: "Get an EconomicScenario"
    roles: [CreditAnalyst, ModelValidator, ChiefCreditOfficer, ExternalAuditor]
    code: 200
    input: []
    output: EconomicScenario
    side_effects: []
  - method: POST
    path: "/cecl/economic-scenarios/{scenarioId}/archive"
    description: "Archive a scenario (blocked while an in-flight run references it)"
    roles: [ModelValidator]
    code: 200
    input: []
    output: EconomicScenario
    side_effects: ["status ACTIVE -> ARCHIVED"]

  # --- QualitativeFactor ---
  - method: POST
    path: "/cecl/qualitative-factors"
    description: "Create a DRAFT QualitativeFactor; closed windows per (segment_id, factor_code) must not overlap among non-RETIRED factors"
    roles: [CreditAnalyst]
    code: 201
    input: [segment_id, factor_code, adjustment_bps, effective_from_period, effective_to_period, "documentation_text?"]
    output: QualitativeFactor
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/cecl/qualitative-factors/{factorId}"
    description: "Get a QualitativeFactor"
    roles: [CreditAnalyst, ModelValidator, ChiefCreditOfficer, ExternalAuditor]
    code: 200
    input: []
    output: QualitativeFactor
    side_effects: []
  - method: POST
    path: "/cecl/qualitative-factors/{factorId}/document"
    description: "Attach documentation (>= 50 chars), DRAFT -> DOCUMENTED"
    roles: [CreditAnalyst]
    code: 200
    input: [documentation_text]
    output: QualitativeFactor
    side_effects: ["status -> DOCUMENTED"]
  - method: POST
    path: "/cecl/qualitative-factors/{factorId}/approve"
    description: "Approve a DOCUMENTED factor"
    roles: [ChiefCreditOfficer]
    code: 200
    input: []
    output: QualitativeFactor
    side_effects: ["status -> APPROVED"]
  - method: POST
    path: "/cecl/qualitative-factors/{factorId}/retire"
    description: "Retire an APPROVED factor (excluded from future runs)"
    roles: [ChiefCreditOfficer]
    code: 200
    input: []
    output: QualitativeFactor
    side_effects: ["status -> RETIRED"]

  # --- ModelRun ---
  - method: POST
    path: "/cecl/model-runs"
    description: "Create a DRAFT ModelRun with pinned scenario weights"
    roles: [CreditAnalyst]
    code: 201
    input: [as_of_period, loss_model_id, scenario_weights]
    output: ModelRun
    side_effects: ["status=DRAFT; period-forward, scenario-active, and weight-sum validations"]
  - method: GET
    path: "/cecl/model-runs"
    description: "List ModelRuns (reverse reachability for ModelRun.loss_model_id via loss_model_id filter)"
    roles: [CreditAnalyst, ModelValidator, ChiefCreditOfficer, ExternalAuditor]
    code: 200
    input: ["loss_model_id?", "status?", "as_of_period?", "limit?", "offset?"]
    output: "ModelRun[]"
    side_effects: []
  - method: GET
    path: "/cecl/model-runs/{runId}"
    description: "Get a ModelRun"
    roles: [CreditAnalyst, ModelValidator, ChiefCreditOfficer, ExternalAuditor]
    code: 200
    input: []
    output: ModelRun
    side_effects: []
  - method: POST
    path: "/cecl/model-runs/{runId}/execute"
    description: "Execute the quarterly run: snapshot segment breakdown, create IndividualEvaluations, pin totals"
    roles: [CreditAnalyst]
    code: 200
    input: []
    output: ModelRun
    side_effects: ["segments_breakdown computed", "IndividualEvaluations created (DRAFT) for individually-evaluated ACTIVE loans", "executed_by_user_id recorded", "increments ModelRun.version by 1"]
  - method: POST
    path: "/cecl/model-runs/{runId}/submit_for_review"
    description: "Submit an EXECUTED run for review (all evaluations must be REVIEWED)"
    roles: [CreditAnalyst]
    code: 200
    input: []
    output: ModelRun
    side_effects: ["status EXECUTED -> UNDER_REVIEW", "increments ModelRun.version by 1"]
  - method: POST
    path: "/cecl/model-runs/{runId}/approve"
    description: "Approve a run (segregation of duties: approver != executor)"
    roles: [ChiefCreditOfficer]
    code: 200
    input: []
    output: ModelRun
    side_effects: ["status UNDER_REVIEW -> APPROVED", "approved_by_user_id recorded", "increments ModelRun.version by 1"]
  - method: POST
    path: "/cecl/model-runs/{runId}/request_rework"
    description: "Send a run back to EXECUTED for rework (cycle)"
    roles: [ChiefCreditOfficer]
    code: 200
    input: [rework_notes]
    output: ModelRun
    side_effects: ["status UNDER_REVIEW -> EXECUTED", "rework_notes stored", "increments ModelRun.version by 1"]
  - method: POST
    path: "/cecl/model-runs/{runId}/finalize"
    description: "Finalize an APPROVED run; creates the DisclosureReport with roll-forward"
    roles: [ChiefCreditOfficer]
    code: 200
    input: [period_charge_offs_cents, period_recoveries_cents]
    output: ModelRun
    side_effects: ["status APPROVED -> FINALIZED", "DisclosureReport created (PREPARED) with beginning/ending/provision", "increments ModelRun.version by 1"]
  - method: GET
    path: "/cecl/model-runs/{runId}/allowance-summary"
    description: "Computed read: run-level totals plus the per-segment breakdown snapshot"
    roles: [CreditAnalyst, ModelValidator, ChiefCreditOfficer, ExternalAuditor]
    code: 200
    input: []
    output: "{ as_of_period: string, total_exposure_cents: integer, quantitative_reserve_cents: integer, qualitative_adjustment_cents: integer, individual_reserve_cents: integer, management_adjustment_cents: integer, total_allowance_cents: integer, segments_breakdown: array }"
    side_effects: []

  # --- IndividualEvaluation ---
  - method: GET
    path: "/cecl/individual-evaluations"
    description: "List IndividualEvaluations (reverse reachability for run_id and loan_id)"
    roles: [CreditAnalyst, ModelValidator, ChiefCreditOfficer, ExternalAuditor]
    code: 200
    input: ["run_id?", "loan_id?", "status?", "limit?", "offset?"]
    output: "IndividualEvaluation[]"
    side_effects: []
  - method: GET
    path: "/cecl/individual-evaluations/{evaluationId}"
    description: "Get an IndividualEvaluation"
    roles: [CreditAnalyst, ModelValidator, ChiefCreditOfficer, ExternalAuditor]
    code: 200
    input: []
    output: IndividualEvaluation
    side_effects: []
  - method: PATCH
    path: "/cecl/individual-evaluations/{evaluationId}"
    description: "Update method/inputs/notes while DRAFT or SUBMITTED; recomputes specific reserve (OCC-guarded)"
    roles: [CreditAnalyst]
    code: 200
    input: [expected_evaluation_version, "method?", "collateral_value_cents?", "expected_quarterly_cash_flows_cents?", "discount_rate_bps?", "analysis_notes?"]
    output: IndividualEvaluation
    side_effects: ["specific_reserve_cents recomputed", "run.individual_reserve_cents and run.total_allowance_cents re-synced", "increments IndividualEvaluation.version by 1"]
  - method: POST
    path: "/cecl/individual-evaluations/{evaluationId}/submit"
    description: "Submit a DRAFT evaluation (requires analysis_notes)"
    roles: [CreditAnalyst]
    code: 200
    input: []
    output: IndividualEvaluation
    side_effects: ["status DRAFT -> SUBMITTED", "run totals re-synced"]
  - method: POST
    path: "/cecl/individual-evaluations/{evaluationId}/review"
    description: "Mark a SUBMITTED evaluation REVIEWED"
    roles: [ChiefCreditOfficer]
    code: 200
    input: []
    output: IndividualEvaluation
    side_effects: ["status SUBMITTED -> REVIEWED", "run.reviewed_evaluation_count recomputed", "run totals re-synced"]
  - method: POST
    path: "/cecl/individual-evaluations/{evaluationId}/reopen"
    description: "Reopen a REVIEWED evaluation back to SUBMITTED (cycle)"
    roles: [ChiefCreditOfficer]
    code: 200
    input: [reopen_reason]
    output: IndividualEvaluation
    side_effects: ["status REVIEWED -> SUBMITTED", "run.reviewed_evaluation_count recomputed"]

  # --- ManagementAdjustment ---
  - method: POST
    path: "/cecl/model-runs/{id}/management-adjustments"
    description: "Propose a management adjustment on an EXECUTED or UNDER_REVIEW run (OCC-guarded, cap-checked)"
    roles: [CreditAnalyst]
    code: 201
    input: [amount_cents, rationale, expected_model_run_version]
    output: ManagementAdjustment
    side_effects: ["status=PENDING", "created_by_user_id recorded", "increments ModelRun.version by 1"]
  - method: GET
    path: "/cecl/model-runs/{id}/management-adjustments"
    description: "List adjustments of a run (reverse reachability for ManagementAdjustment.run_id)"
    roles: [CreditAnalyst, ModelValidator, ChiefCreditOfficer, ExternalAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ManagementAdjustment[]"
    side_effects: []
  - method: POST
    path: "/cecl/management-adjustments/{adjustmentId}/approve"
    description: "Approve a PENDING adjustment (segregation of duties: approver != creator); run totals re-sync"
    roles: [ChiefCreditOfficer]
    code: 200
    input: []
    output: ManagementAdjustment
    side_effects: ["status PENDING -> APPROVED", "run.management_adjustment_cents and total_allowance_cents recomputed", "increments ModelRun.version by 1"]
  - method: POST
    path: "/cecl/management-adjustments/{adjustmentId}/reject"
    description: "Reject a PENDING adjustment (no run impact)"
    roles: [ChiefCreditOfficer]
    code: 200
    input: []
    output: ManagementAdjustment
    side_effects: ["status PENDING -> REJECTED", "resolved_by_user_id recorded"]

  # --- DisclosureReport ---
  - method: GET
    path: "/cecl/model-runs/{id}/disclosure-reports"
    description: "List disclosure reports of a run (reverse reachability for DisclosureReport.run_id); 0 or 1 entries"
    roles: [CreditAnalyst, ModelValidator, ChiefCreditOfficer, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "DisclosureReport[]"
    side_effects: []
  - method: GET
    path: "/cecl/disclosure-reports/{reportId}"
    description: "Get a DisclosureReport"
    roles: [CreditAnalyst, ModelValidator, ChiefCreditOfficer, ExternalAuditor]
    code: 200
    input: []
    output: DisclosureReport
    side_effects: []
  - method: POST
    path: "/cecl/disclosure-reports/{reportId}/submit_for_audit"
    description: "Submit a PREPARED report for audit review"
    roles: [CreditAnalyst]
    code: 200
    input: []
    output: DisclosureReport
    side_effects: ["status PREPARED -> UNDER_AUDIT_REVIEW"]
  - method: POST
    path: "/cecl/disclosure-reports/{reportId}/sign_off"
    description: "External auditor signs off, releasing the report"
    roles: [ExternalAuditor]
    code: 200
    input: [audit_reference]
    output: DisclosureReport
    side_effects: ["status UNDER_AUDIT_REVIEW -> RELEASED", "audit_reference stored"]
  - method: POST
    path: "/cecl/disclosure-reports/{reportId}/return_for_revision"
    description: "External auditor returns the report for revision (cycle)"
    roles: [ExternalAuditor]
    code: 200
    input: [revision_notes]
    output: DisclosureReport
    side_effects: ["status UNDER_AUDIT_REVIEW -> PREPARED", "revision_notes stored"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not a declared role" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role is valid but not allowed for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path id does not identify an existing resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad type, invalid enum member, bad period format ('YYYY-Qn', n in 1..4), scenario effective_to not after effective_from, DCF inputs missing" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Target resource is in a state that does not permit the requested transition (including recovery on a loan with nothing charged off)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_model_run_version does not equal the run's current version (OCC)" }
  - { id: ERR_EVALUATION_STALE_VERSION, http: 412, condition: "expected_evaluation_version does not equal the evaluation's current version (OCC)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Approver is the same X-User-ID as the executor/creator of the item being approved" }
  - { id: ERR_PERIOD_NOT_FORWARD, http: 409, condition: "ModelRun as_of_period is not strictly later than every FINALIZED run's as_of_period" }
  - { id: ERR_MODEL_NOT_ACTIVE, http: 409, condition: "Referenced LossModel is not ACTIVE (run create or execute)" }
  - { id: ERR_SEGMENT_NOT_OPEN, http: 409, condition: "Referenced PortfolioSegment is not OPEN (loan create)" }
  - { id: ERR_SCENARIO_NOT_ACTIVE, http: 409, condition: "A scenario referenced in scenario_weights is not ACTIVE" }
  - { id: ERR_WEIGHT_SUM_INVALID, http: 422, condition: "scenario_weights weight_bps values do not sum to exactly 10000 (or a weight <= 0)" }
  - { id: ERR_SCENARIO_WINDOW_OVERLAP, http: 409, condition: "Half-open [from, to) window overlaps another ACTIVE scenario of the same scenario_type (touching at to == from is allowed)" }
  - { id: ERR_FACTOR_WINDOW_OVERLAP, http: 409, condition: "Closed [from, to] window overlaps another non-RETIRED factor with same (segment_id, factor_code) (adjacency to+1 == from is allowed)" }
  - { id: ERR_INVALID_REVERSION_CONFIG, http: 422, condition: "IMMEDIATE requires reversion_period_quarters == 0; STRAIGHT_LINE requires 1..4; F + R must be <= 8" }
  - { id: ERR_FACTOR_DOCUMENTATION_INSUFFICIENT, http: 422, condition: "document called with documentation_text trimmed length < 50 characters" }
  - { id: ERR_ANALYSIS_DOCUMENTATION_REQUIRED, http: 422, condition: "Evaluation submit with empty analysis_notes" }
  - { id: ERR_ZERO_ADJUSTMENT, http: 422, condition: "ManagementAdjustment amount_cents == 0" }
  - { id: ERR_DUPLICATE_SEGMENT_CODE, http: 409, condition: "segment_code already exists" }
  - { id: ERR_DUPLICATE_LOAN_NUMBER, http: 409, condition: "loan_number already exists" }
  - { id: ERR_SCENARIO_IN_USE, http: 409, condition: "Archive blocked: an in-flight (non-FINALIZED, non-terminal) run references the scenario" }
  - { id: ERR_MODEL_IN_USE, http: 409, condition: "Retire blocked: an in-flight (DRAFT..APPROVED) run references the model" }
  - { id: ERR_REFRESH_NOT_REQUIRED, http: 409, condition: "refresh called while refresh_required is false" }
  - { id: ERR_EVALUATIONS_OUTSTANDING, http: 409, condition: "submit_for_review while any of the run's evaluations is not REVIEWED" }
  - { id: ERR_ADJUSTMENTS_PENDING, http: 409, condition: "finalize while any of the run's adjustments is PENDING" }
  - { id: ERR_NO_FINALIZED_RUN, http: 409, condition: "backtest with no FINALIZED run of this model at or before backtest_period" }
  - { id: ERR_CHARGE_OFF_EXCEEDS_BALANCE, http: 422, condition: "charge_off_amount_cents < 1 or > amortized_cost_cents" }
  - { id: ERR_RECOVERY_EXCEEDS_CHARGE_OFF, http: 422, condition: "cumulative recoveries would exceed cumulative charge-offs on the loan" }
  - { id: ERR_ADJUSTMENT_EXCEEDS_CAP, http: 422, condition: "|amount_cents| exceeds round_half_up(10% of run quantitative+qualitative+individual subtotal)" }

# =============================================================================
# Table 7: RBAC Permission Matrix (segregation of duties)
# =============================================================================
roles:
  - name: CreditAnalyst
    description: "Prepares portfolio data and quarterly runs: segments, loans, charge-offs/recoveries, qualitative factor drafting/documentation, run creation/execution/submission, individual evaluation preparation, management adjustment proposals, disclosure preparation"
    identity: opaque
    exclusive_operations:
      - "POST /cecl/portfolio-segments"
      - "POST /cecl/loans and /charge_off and /record_recovery"
      - "POST /cecl/qualitative-factors and /document"
      - "POST /cecl/model-runs and /execute and /submit_for_review"
      - "PATCH /cecl/individual-evaluations/{id} and /submit"
      - "POST /cecl/model-runs/{id}/management-adjustments"
      - "POST /cecl/disclosure-reports/{id}/submit_for_audit"
    shared_operations:
      - "All GET endpoints (shared with ModelValidator, ChiefCreditOfficer, ExternalAuditor)"
  - name: ModelValidator
    description: "Owns model governance: loss model lifecycle, economic scenarios, back-testing, model refresh"
    identity: opaque
    exclusive_operations:
      - "POST /cecl/loss-models and /activate and /retire and /refresh"
      - "POST /cecl/loss-models/{id}/backtests"
      - "POST /cecl/economic-scenarios and /archive"
    shared_operations:
      - "All GET endpoints"
  - name: ChiefCreditOfficer
    description: "Approval authority: qualitative factor approval/retirement, run approval/rework/finalization, evaluation review/reopen, management adjustment decisions"
    identity: opaque
    exclusive_operations:
      - "POST /cecl/qualitative-factors/{id}/approve and /retire"
      - "POST /cecl/model-runs/{id}/approve and /request_rework and /finalize"
      - "POST /cecl/individual-evaluations/{id}/review and /reopen"
      - "POST /cecl/management-adjustments/{id}/approve and /reject"
    shared_operations:
      - "All GET endpoints"
  - name: ExternalAuditor
    description: "Independent auditor: read-only across the system plus disclosure sign-off / return-for-revision"
    identity: opaque
    exclusive_operations:
      - "POST /cecl/disclosure-reports/{id}/sign_off"
      - "POST /cecl/disclosure-reports/{id}/return_for_revision"
    shared_operations:
      - "All GET endpoints"
