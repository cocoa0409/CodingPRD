          - state_machines.InductionCycle.SCREENING_to_BALLOTING
        distinguishing_aspect: |
          The positive half of the concurrency contract, and a version audit of the whole lifecycle:
          creation leaves version 1, open-nominations 2, close-nominations 3 and the screening ADVANCE
          4, so the read returns 4 and the ballot request that carries 4 succeeds and takes the cycle
          to 5. Every cycle-level write increments exactly once - no write is silently version-neutral.
