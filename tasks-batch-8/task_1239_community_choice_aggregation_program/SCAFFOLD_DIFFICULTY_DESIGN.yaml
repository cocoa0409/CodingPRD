  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant across DIFFERENT conserved quantities.
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: remittance_reconcile_dispute_conserves_remitted_cents
        grounds:
          - state_machines.RemittanceFile.RECONCILED_to_DISPUTED
          - calculations.remittance_waterfall
          - entities.ServiceAccount.fields.cumulative_remitted_cents
        distinguishing_aspect: |
          Conserved quantity: the SUM of cumulative_remitted_cents across all accounts
          plus RemittanceFile.applied_cents drift. Invariant: reconcile credits N cents
          across ledgers; dispute reverses exactly those credits — after the pair,
          sum(account.cumulative_remitted_cents) equals its pre-reconcile value and
          applied_cents == 0. No drift permitted.
        test_recipe:
          setup:
            - "Authority ACTIVE; two ENROLLED accounts each billed 1000 kWh (11400 c each) in an ACCEPTED 2026-05 extract"
            - "Remittance 2026-05: gross 22800, fee 0 -> net 22800; reconcile applies 11400 to each account"
          setup_api_calls:
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/authority"
              payload: { display_name: "Valley Clean Alliance", utility_territory_code: "PGE", er_balancing_authority: "CISO", rate_setting_policy: "COST_PLUS", rps_target_pct: 0.60, bad_debt_trueup_cap_pct: 0.01 }
              as: BoardDirector
              captures: { auth_v0: $.data.version }
            - call: "POST /cca/products"
              payload: { product_code: "STANDARD50", election_key: "DEFAULT", renewable_pct: 0.50 }
              as: RateAnalyst
              captures: { prod_std: $.data.id }
            - call: "POST /cca/rate-schedules"
              payload: { product_id: "${prod_std}", period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", energy_rate_cents_per_kwh: 11.40, pcia_rate_cents_per_kwh: 1.50, incumbent_benchmark_rate_cents_per_kwh: 12.00 }
              as: RateAnalyst
              captures: { rs_std: $.data.id }
            - call: "POST /cca/rate-schedules/${rs_std}/propose"
              payload: {}
              as: RateAnalyst
            - call: "POST /cca/rate-schedules/${rs_std}/adopt"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/products/${prod_std}/adopt"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/authority/activate"
              payload: {}
              as: BoardDirector
            - call: "GET /cca/authority"
              payload: {}
              as: BoardDirector
              captures: { auth_v: '$.data[0].version' }
            - call: "POST /cca/service-accounts/ingest"
              payload: { accounts: [ { utility_account_number: "U-9001", service_class: "RESIDENTIAL", annual_kwh_estimate: 12000, annual_peak_kw: 4.0, da_eligible: false }, { utility_account_number: "U-9002", service_class: "RESIDENTIAL", annual_kwh_estimate: 12000, annual_peak_kw: 4.0, da_eligible: false } ] }
              as: ProgramOperator
              captures: { acct_h1: "$.data.account_ids[0]", acct_h2: "$.data.account_ids[1]" }
            - call: "POST /cca/enrollment-notices"
              payload: { wave_label: "W1", notice_mailed_on: "2026-01-01T00:00:00Z", target_service_classes: ["RESIDENTIAL"] }
              as: ProgramOperator
              captures: { notice_w1: $.data.id }
            - call: "POST /cca/enrollment-notices/${notice_w1}/issue"
              payload: { expected_authority_version: "${auth_v}" }
              as: ProgramOperator
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/enrollment-notices/${notice_w1}/close"
              payload: {}
              as: ProgramOperator
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/_clock/advance_epoch"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/billing-extracts"
              payload: { billing_month: "2026-05" }
              as: BillingCoordinator
              captures: { ext_may: $.data.id }
            - call: "POST /cca/billing-extracts/${ext_may}/lines"
              payload: { service_account_id: "${acct_h1}", usage_kwh: 1000 }
              as: BillingCoordinator
            - call: "POST /cca/billing-extracts/${ext_may}/lines"
              payload: { service_account_id: "${acct_h2}", usage_kwh: 1000 }
              as: BillingCoordinator
            - call: "POST /cca/billing-extracts/${ext_may}/submit"
              payload: {}
              as: BillingCoordinator
            - call: "POST /cca/billing-extracts/${ext_may}/utility-accept"
              payload: {}
              as: UtilityLiaison
              captures: { ext_v_acc: $.data.version }
            - call: "POST /cca/remittance-files"
              payload: { remittance_period: "2026-05", gross_remittance_cents: 22800, utility_fee_bps: 0 }
              as: BillingCoordinator
