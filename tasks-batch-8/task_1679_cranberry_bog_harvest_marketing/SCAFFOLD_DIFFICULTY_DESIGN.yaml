            - "Season status after close == HARVEST_CLOSED (auto cascade)"
            - "Pool.${p1}.status == OPEN after reopen (cycle CLOSED -> OPEN)"
            - "Season status after reopen == OPEN (compensating revert)"
            - "Delivery.${d1}.status == ACCEPTED after the cycle (pool usable again)"

  # ==========================================================================
  # Rule 4 — transitive_cascade (frost-complete trigger vs pool-close trigger)
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: frost_damage_flags_estimate_recomputes_quota_flips_posture
        grounds:
          - state_machines.FrostEvent.ACTIVE_to_COMPLETED
          - state_machines.YieldEstimate.APPROVED_to_FLAGGED
          - calculations.quota_base_barrels
          - entities.MemberQuota.fields.posture
        distinguishing_aspect: |
          Depth-3 cascade from the frost-complete trigger: completing the event
          with damage (1) flags the APPROVED estimate; the flag (2) recomputes
          MemberQuota.base_quota_barrels 2300 -> 2000 (bog falls back to
          baseline); the recompute (3) flips MemberQuota.posture to OVER_QUOTA
          because delivered 2100 > 2000. Each link is caused by the previous
          one, and the trigger differs from the sibling instance (pool close).
        test_recipe:
          setup:
            - "Member ACTIVE, 10-acre ACTIVE bog (frost threshold default -2.0), season 2026 OPEN"
            - "APPROVED estimate 2300 -> quota base 2300; station 5000; MAIN pool OPEN"
            - "Two ACCEPTED B-grade deliveries, net 1100 and 1000 -> delivered_barrels 2100 (within 2300)"
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/bogs"
              payload: { name: "North Bog", acres: 10, variety: "STEVENS", sprinkler_demand_gpm: 500 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { b1: "$.data.id" }
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /coop/yield-estimates"
              payload: { bog_id: "${b1}", season_id: "${s1}", estimated_barrels: 2300 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { e1: "$.data.id" }
            - call: "POST /coop/yield-estimates/${e1}/transition"
              payload: { to: "APPROVED" }
              as: FieldOfficer
            - call: "POST /coop/seasons/${s1}/open"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/stations"
              payload: { name: "Station A", daily_capacity_barrels: 5000 }
              as: CoopAdmin
              captures: { st1: "$.data.id" }
            - call: "POST /coop/pools"
              payload: { season_id: "${s1}", code: "MAIN", provisional_advance_rate_per_barrel: 0.50, retain_pct: 0.20 }
              as: PoolManager
              captures: { p1: "$.data.id" }
            - call: "POST /coop/deliveries"
              payload: { season_id: "${s1}", bog_id: "${b1}", receiving_station_id: "${st1}", scheduled_date: "2026-10-10", expected_barrels: 1150 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { d1: "$.data.id" }
            - call: "POST /coop/deliveries/${d1}/receive"
              payload: { gross_barrels: 1150, tare_barrels: 50 }
              as: StationOperator
              as_user_id: "${st1}"
            - call: "POST /coop/deliveries/${d1}/grade"
              payload: { color_score: 7.5, firmness_score: 7.0, foreign_matter_pct: 3.0 }
              as: StationOperator
              as_user_id: "${st1}"
            - call: "POST /coop/deliveries/${d1}/accept"
              payload: {}
              as: PoolManager
            - call: "POST /coop/deliveries"
              payload: { season_id: "${s1}", bog_id: "${b1}", receiving_station_id: "${st1}", scheduled_date: "2026-10-12", expected_barrels: 1050 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { d2: "$.data.id" }
            - call: "POST /coop/deliveries/${d2}/receive"
              payload: { gross_barrels: 1050, tare_barrels: 50 }
              as: StationOperator
              as_user_id: "${st1}"
            - call: "POST /coop/deliveries/${d2}/grade"
              payload: { color_score: 7.5, firmness_score: 7.0, foreign_matter_pct: 3.0 }
              as: StationOperator
              as_user_id: "${st1}"
            - call: "POST /coop/deliveries/${d2}/accept"
              payload: {}
              as: PoolManager
            - call: "POST /coop/frost-events"
              payload: { bog_id: "${b1}", season_id: "${s1}", window_start: "2026-10-20T00:00:00Z", window_end: "2026-10-20T06:00:00Z", forecast_min_temp_c: -4.0 }
              as: FieldOfficer
              captures: { f1: "$.data.id" }
            - call: "POST /coop/frost-events/${f1}/transition"
              payload: { to: "ACTIVE" }
              as: FieldOfficer
          trigger:
            - call: "POST /coop/frost-events/${f1}/transition"
              payload: { to: "COMPLETED", actual_min_temp_c: -5.0 }
              as: FieldOfficer
              captures: { f_damage: "$.data.damage_flag" }
            - call: "GET /coop/yield-estimates/${e1}"
              payload: {}
              as: FieldOfficer
              captures: { e_status: "$.data.status" }
            - call: "GET /coop/quotas"
              payload: { member_id: "${m1}", season_id: "${s1}" }
              as: CoopAdmin
              captures: { q_base: "$.data[0].base_quota_barrels", q_posture: "$.data[0].posture", q_delivered: "$.data[0].delivered_barrels" }
          assert:
            - "FrostEvent.${f1}.damage_flag == true (-5.0 <= -2.0 threshold)"
            - "YieldEstimate.${e1}.status == FLAGGED (cascade link 1)"
            - "MemberQuota.base_quota_barrels == 2000 (cascade link 2: baseline fallback after flag)"
            - "MemberQuota.delivered_barrels == 2100 (unchanged by the cascade)"
            - "MemberQuota.posture == OVER_QUOTA (cascade link 3: 2100 > 2000)"

      - name: pool_close_closes_season_and_locks_quotas
        grounds:
          - state_machines.Pool.OPEN_to_CLOSED
          - state_machines.Season.OPEN_to_HARVEST_CLOSED
          - entities.MemberQuota.fields.quota_locked
        distinguishing_aspect: |
          Depth-2 cascade from the pool-close trigger: closing the season's
          last OPEN pool (1) auto-transitions Season OPEN -> HARVEST_CLOSED;
          that season transition (2) sets quota_locked = true on every
          MemberQuota, so a subsequent well-formed PATCH (current version)
          fails with ERR_QUOTA_LOCKED. Trigger differs from the sibling
          (frost completion).
        test_recipe:
          setup:
            - "Member ACTIVE, ACTIVE bog, season 2026 OPEN (quota base 2000), MAIN pool OPEN, no pipeline deliveries"
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/bogs"
              payload: { name: "North Bog", acres: 10, variety: "STEVENS", sprinkler_demand_gpm: 500 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { b1: "$.data.id" }
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /coop/seasons/${s1}/open"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/pools"
              payload: { season_id: "${s1}", code: "MAIN", provisional_advance_rate_per_barrel: 0.50, retain_pct: 0.20 }
              as: PoolManager
              captures: { p1: "$.data.id" }
          trigger:
            - call: "POST /coop/pools/${p1}/transition"
              payload: { to: "CLOSED" }
              as: PoolManager
            - call: "GET /coop/seasons/${s1}"
              payload: {}
              as: PoolManager
              captures: { s_status: "$.data.status" }
            - call: "GET /coop/quotas"
              payload: { member_id: "${m1}", season_id: "${s1}" }
              as: CoopAdmin
              captures: { q_id: "$.data[0].id", q_locked: "$.data[0].quota_locked", q_v: "$.data[0].version" }
            - call: "PATCH /coop/quotas/${q_id}"
              payload: { base_quota_barrels: 2500, expected_quota_version: "${q_v}" }
              as: CoopAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "Season.${s1}.status == HARVEST_CLOSED (cascade link 1)"
            - "MemberQuota.quota_locked == true (cascade link 2)"
            - "PATCH with the CURRENT post-lock version fails with error_id == ERR_QUOTA_LOCKED (not ERR_STALE_VERSION — proves the lock cascade bumped version and was re-read)"
  # ==========================================================================
  # Rule 5 — priority_pair_validation_conflict (state vs fiscal; temporal vs constraint)
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: accept_replay_state_error_beats_over_quota_pool_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_OVER_QUOTA_POOL_UNAVAILABLE]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: re-accepting an
          ACCEPTED delivery violates the GRADED-only state precondition AND,
          because remaining quota is now 0 and no OVER_QUOTA pool exists, would
          also fail the fiscal pool-availability check; the state error
          ERR_INVALID_STATE (priority 5) must win over the fiscal error
          (priority 9).
        test_recipe:
          setup:
            - "Member ACTIVE, 10-acre bog, season OPEN; quota base overridden to 100"
            - "MAIN pool OPEN (rate 0.50); NO OVER_QUOTA pool exists"
            - "Delivery D1 net 100 graded B and ACCEPTED (quota_applied 100, over 0)"
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/bogs"
              payload: { name: "North Bog", acres: 10, variety: "STEVENS", sprinkler_demand_gpm: 500 }
              as: GrowerMember
              as_user_id: "${m1}"
