            - "error_id == ERR_INVALID_TRANSITION with HTTP 409 — the aircraft is IN_STORAGE, and storage creation requires ASSEMBLY_COMPLETE; the state gate alone prevents a second ACTIVE record"
      - name: negotiation_wrong_turn_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_NEGOTIATION_ACTOR_TURN]"
        distinguishing_aspect: "From PROPOSED the turn belongs to the Customer; a DeliveryManager counter is rejected with ERR_NEGOTIATION_ACTOR_TURN (403) even with a fresh OCC version."
        test_recipe:
          setup: ["program M1; GOOD customer AL1; aircraft line 1017 with a round-1 PROPOSED negotiation"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 1017, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/delivery-negotiations", payload: { proposed_delivery_date: "2026-10-11", compensation_variant: "CONTRACTUAL_LIQUIDATED" }, as: DeliveryManager, captures: { neg_id: "$.data.id", neg_v: "$.data.version" } }
          trigger:
            - { call: "POST /api/delivery-negotiations/${neg_id}/counter", payload: { proposed_delivery_date: "2026-10-12", compensation_variant: "CONTRACTUAL_LIQUIDATED", expected_negotiation_version: "${neg_v}" }, as: DeliveryManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NEGOTIATION_ACTOR_TURN with HTTP 403 (PROPOSED awaits the Customer)"
      - name: negotiation_round_limit_auto_expires
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_NEGOTIATION_ROUND_LIMIT]"
          - "state_machines.DeliveryNegotiation.PROPOSED_to_EXPIRED"
        distinguishing_aspect: "The 6th-round boundary: rounds advance 1..6 legally, and the counter attempted at round_number == 6 returns ERR_NEGOTIATION_ROUND_LIMIT (422) and leaves the negotiation EXPIRED."
        test_recipe:
          setup: ["program M1; GOOD customer AL1; aircraft line 1018 with a negotiation driven through rounds 1 to 6"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { airline_code: "AL1", name: "Air One", credit_standing: "GOOD" }, as: ProgramAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 1018, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id" } }
            - { call: "POST /api/aircraft-units/${ac_id}/delivery-negotiations", payload: { proposed_delivery_date: "2026-10-11", compensation_variant: "CONTRACTUAL_LIQUIDATED" }, as: DeliveryManager, captures: { neg_id: "$.data.id", v1: "$.data.version" } }
            - { call: "POST /api/delivery-negotiations/${neg_id}/counter", payload: { proposed_delivery_date: "2026-10-12", compensation_variant: "CONTRACTUAL_LIQUIDATED", expected_negotiation_version: "${v1}" }, as: Customer, as_user_id: "${cust_id}", captures: { v2: "$.data.version" } }
            - { call: "POST /api/delivery-negotiations/${neg_id}/counter", payload: { proposed_delivery_date: "2026-10-13", compensation_variant: "CONTRACTUAL_LIQUIDATED", expected_negotiation_version: "${v2}" }, as: DeliveryManager, captures: { v3: "$.data.version" } }
            - { call: "POST /api/delivery-negotiations/${neg_id}/counter", payload: { proposed_delivery_date: "2026-10-14", compensation_variant: "CONTRACTUAL_LIQUIDATED", expected_negotiation_version: "${v3}" }, as: Customer, as_user_id: "${cust_id}", captures: { v4: "$.data.version" } }
            - { call: "POST /api/delivery-negotiations/${neg_id}/counter", payload: { proposed_delivery_date: "2026-10-15", compensation_variant: "CONTRACTUAL_LIQUIDATED", expected_negotiation_version: "${v4}" }, as: DeliveryManager, captures: { v5: "$.data.version" } }
            - { call: "POST /api/delivery-negotiations/${neg_id}/counter", payload: { proposed_delivery_date: "2026-10-16", compensation_variant: "CONTRACTUAL_LIQUIDATED", expected_negotiation_version: "${v5}" }, as: Customer, as_user_id: "${cust_id}", captures: { v6: "$.data.version", r6: "$.data.round_number" } }
          trigger:
            - { call: "POST /api/delivery-negotiations/${neg_id}/counter", payload: { proposed_delivery_date: "2026-10-17", compensation_variant: "CONTRACTUAL_LIQUIDATED", expected_negotiation_version: "${v6}" }, as: DeliveryManager, captures: { err: "$.data.error_id" } }
            - { call: "GET /api/aircraft-units/${ac_id}/delivery-negotiations", payload: {}, as: DeliveryManager, captures: { neg_st: "$.data[0].status", neg_round: "$.data[0].round_number" } }
          assert:
            - "rounds advance legally to round_number == 6 (five counters)"
            - "counter at round 6: ERR_NEGOTIATION_ROUND_LIMIT (422)"
            - "negotiation status == EXPIRED and round_number stays 6"
      - name: begin_root_cause_without_regulator_notification_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_REGULATOR_NOTIFICATION_REQUIRED]"
        distinguishing_aspect: "begin-root-cause on an OPEN but un-notified escape fails with ERR_REGULATOR_NOTIFICATION_REQUIRED (422) even when conformance_refs are supplied."
        test_recipe:
          setup: ["program M1, customer AL1, aircraft line 1019 with one OPEN escape (no notification)"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { model_code: "M1", current_rate_per_month: 5, required_component_codes: 1, rework_budget_total_cents: 1000000 }, as: ProgramAdmin, captures: { prog_id: "$.data.id" } }
