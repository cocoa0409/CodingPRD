          - state_machines.UnitBuild.WATER_TEST_to_ROUGH_IN
          - state_machines.UnitBuild.ROUGH_IN_to_APPLIANCE_INSTALL
          - state_machines.QualityInspection.SCHEDULED_to_COMPLETED
          - calculations.inspection_grade
          - entities.UnitBuild.fields.rework_count
          - entities.UnitBuild.fields.water_test_passed
        distinguishing_aspect: |
          The non-linearity is on UnitBuild.current_station: a FAIL grade drives
          the station backwards from WATER_TEST to ROUGH_IN and the same forward
          stations are then traversed a second time, so the station sequence is a
          cycle rather than a path and actual_station_hours keeps accumulating
          across the loop.
