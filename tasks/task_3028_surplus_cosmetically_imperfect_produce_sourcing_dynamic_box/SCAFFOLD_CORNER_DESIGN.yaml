- section: validations
  instances:
  - name: build_with_a_stale_order_version_is_refused_before_any_line_is_written
    claim_type: violation_to_error
    grounds:
    - validations[priority=5]
    - errors.ERR_STALE_VERSION
    - concurrency_rules[box-order-finalize-stale-version]
    distinguishing_aspect: Priority 5 checks the request's expected_box_order_version against the order's current version, so a stale value is a 412 ERR_STALE_VERSION and no build item is created.
    test_recipe:
      setup:
      - One center, supplier, lot and customer with a WEEKLY subscription and one DRAFT order whose version is read and then deliberately understated.
      setup_api_calls:
      - call: POST /produce/fulfillment-centers
        payload:
          code: DEMO-NE
          name: Demo Center
          region: NE
          insulation_profile: LIGHT
          max_concurrent_building_cycles: 5
        as: PlatformAdmin
        captures:
          sv_c: $.data.id
      - call: POST /produce/suppliers
        payload:
          name: Supply Co SV
          region: NE
        as: PlatformAdmin
        captures:
          sv_s: $.data.id
      - call: POST /produce/suppliers/${sv_s}/lots
        payload:
          fulfillment_center_id: ${sv_c}
          product_name: SV1
          category: FRUIT
          procurement_grade: SURPLUS
          unit_weight_grams: 100
          quantity_available: 300
          unit_cost_cents: 100
          harvest_date: '2026-09-01T00:00:00Z'
          expiry_date: '2026-09-20T00:00:00Z'
          ready_date: '2026-09-05T00:00:00Z'
        as: PlatformAdmin
        captures:
          sv_l: $.data.id
          sv_lv: $.data.version
      - call: POST /produce/sourcing-bids
        payload:
          supply_lot_id: ${sv_l}
          supplier_id: ${sv_s}
          bid_unit_cost_cents: 100
          quantity_offered: 300
        as: Supplier
        as_user_id: ${sv_s}
      - call: POST /produce/supply-lots/${sv_l}/award
        payload:
          bidder_quota: 1
          expected_supply_lot_version: ${sv_lv}
        as: PlatformAdmin
        captures:
          sv_lv2: $.data.version
      - call: POST /produce/supply-lots/${sv_l}/make-ready
        payload:
          quality_outcome: PASS
          expected_supply_lot_version: ${sv_lv2}
        as: PlatformAdmin
      - call: POST /produce/customers/register
        payload:
          email: sv@example.com
          full_name: Sub Sv
          service_region: NE
        as: Anonymous
        captures:
          sv_cu: $.data.id
      - call: POST /produce/subscriptions
        payload:
          customer_id: ${sv_cu}
          cadence: WEEKLY
        as: PlatformAdmin
        captures:
          sv_sub: $.data.id
          sv_subv: $.data.version
      - call: POST /produce/box-orders
        payload:
          customer_id: ${sv_cu}
          subscription_id: ${sv_sub}
          serving_cycle_index: 1
          cuisine_preference: STANDARD
        as: PlatformAdmin
        captures:
          sv_o1: $.data.id
          sv_o1v: $.data.version
      trigger:
      - call: POST /produce/box-orders/${sv_o1}/build
        payload:
          expected_box_order_version: ${sv_o1v} - 1
          line_plan:
          - supply_lot_id: ${sv_l}
            units: 6
        as: FulfillmentOperator
        as_user_id: ${sv_c}
        captures:
          sv_err: $.data.error_id
      assert:
      - the build returns 412 and sv_err == ERR_STALE_VERSION
