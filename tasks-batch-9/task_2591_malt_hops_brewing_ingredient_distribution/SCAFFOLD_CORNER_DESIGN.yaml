            - "target is crop year 2030 against a 2026 source: HTTP 422 with ${ny_err_skip} == ERR_INVALID_CARRY_FORWARD_TARGET — 2030 is OPEN, so only the year test can be refusing it"
            - "target is the 2029 program against a 2028 source: HTTP 422 with ${ny_err_settled} == ERR_INVALID_CARRY_FORWARD_TARGET — the crop year is right and only the SETTLED status can be refusing it"
            - "after the three refusals: HopContract.${ny_ca}.status == ACTIVE, carry_forward_target_program_id == null and version is unchanged from its post-setup value"
            - "legitimate roll onto the 2027 program: HTTP 200, ${ny_ok_status} == CARRY_FORWARD_PENDING, ${ny_ok_lbs} == 1250 and ${ny_ok_fee} == 25000 (1250 * 250.00 * 8 / 100)"
            - "HopContract.${ny_cb}.status == ACTIVE and remaining_lbs == 4000 — contract B was never mutated"

      - name: a_fully_drawn_contract_can_be_neither_defaulted_nor_rolled
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NO_UNCOMMITTED_VOLUME]
