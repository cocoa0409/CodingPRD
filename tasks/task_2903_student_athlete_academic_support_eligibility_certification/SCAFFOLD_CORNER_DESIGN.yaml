              payload: { action: "RECORD_GRADE", grade: "B" }
              as: Registrar
          assert:
            - "The response is HTTP 200 with data.status == COMPLETED, data.earned_credit_hours == 6.00 and data.degree_applicable_credits_counted == 0.00"
            - "StudentAthlete.${s42_id}.transfer_credits_accepted == 20.00 (12.00 CORE under the 40.0 cap plus 8.00 ELECTIVE under the 20.0 cap)"
            - "StudentAthlete.${s42_id}.cumulative_gpa == 3.00 and completed_full_time_terms == 1 (26.00 attempted credits)"
            - "StudentAthlete.${s42_id}.transfer_status == INCOMING_TRANSFER is unchanged - the accepted figure is stored even though no TRANSFER certification has been attempted"

      - name: grade_f_excluded_from_earned_credits
        claim_type: correct_result
        grounds:
          - calculations.academic_standing_rollup.formula
          - calculations.academic_risk_score.formula
          - entities.Enrollment.fields.earned_credit_hours
        distinguishing_aspect: "An F is attempted but not earned: earned_credit_hours 0.00 and degree_applicable_credits 0.00, yet the 12.00 attempted credits still make the term count as a full-time term (inclusive at full_time_credit_minimum 12), and the resulting risk_score lands exactly on the TIER_3 boundary 40.00."
        test_recipe:
          setup:
            - "Student S43 declared DP43 (total_required_credits 60.00, min_progress_gpa 2.0 by default) and is enrolled in KINE-200 (12.00 credits, CORE rule for catalog 2026)."
            - "2026FA uses the default full_time_credit_minimum of 12."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/degree-programs"
              payload: { code: "DP43", name: "Kinesiology", catalog_year: 2026, total_required_credits: 60.00 }
              as: Registrar
              captures: { dp43_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "KINE", course_number: "200", title: "Exercise Physiology", credit_hours: 12.00, instructor_user_id: "instr_kine_1" }
              as: Registrar
              captures: { kine_id: $.data.id }
            - call: "POST /athletics/degree-applicability-rules"
              payload: { degree_program_id: "${dp43_id}", course_id: "${kine_id}", effective_catalog_year: 2026, applicability: "CORE" }
              as: Registrar
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Fortythree", sport_code: "FB", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s43_id: $.data.id }
            - call: "POST /athletics/student-athletes/${s43_id}/major-declaration"
              payload: { declared_program_id: "${dp43_id}", term_id: "${term1_id}" }
              as: AcademicAdvisor
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s43_id}", course_id: "${kine_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e43_id: $.data.id }
          trigger:
            - call: "POST /athletics/enrollments/${e43_id}/outcome"
              payload: { action: "RECORD_GRADE", grade: "F" }
              as: Registrar
          assert:
            - "The response is HTTP 200 with data.status == COMPLETED, data.grade == F, data.grade_points == 0.00 and data.earned_credit_hours == 0.00"
            - "data.degree_applicable_credits_counted == 0.00 because grade_points == 0.00 excludes the row from the audit input set"
            - "data.is_full_time_countable == true and StudentAthlete.${s43_id}.completed_full_time_terms == 1"
            - "StudentAthlete.${s43_id}.cumulative_gpa == 0.00, degree_applicable_credits == 0.00 and progress_pct == 0.0000"
            - "StudentAthlete.${s43_id}.risk_score == 40.00 (0.4 * 100.00 gpa points, all other components 0.00) and risk_tier == TIER_3"
            - "StudentAthlete.${s43_id}.required_study_hall_hours == 8.0 and support_status == SUPPORT_MANDATED"

      - name: meeting_starting_exactly_at_return_at_not_counted
        claim_type: interval_merge
        grounds:
          - calculations.missed_class_units.formula
          - entities.MissedClassRequest.fields.missed_meeting_count
          - entities.CompetitionEvent.fields.missed_class_unit_multiplier
        distinguishing_aspect: "Both windows are half-open, so the Wednesday meeting that starts exactly at return_at contributes nothing: missed_meeting_count is 1, not 2, and missed_units is 0.83 rather than 1.66."
        test_recipe:
          setup:
            - "SOCI-150 meets ISO weekdays [1, 3, 5] at minute 600 UTC for 50 minutes, i.e. 10:00-10:50 UTC on Monday, Wednesday and Friday."
            - "CompetitionEvent EV44 (REGULAR_SEASON, multiplier 1.0) is TRAVEL_APPROVED with departure_at 2026-09-14T08:00:00Z (a Monday) and return_at 2026-09-16T10:00:00Z (the Wednesday meeting's exact start)."
            - "Student S44 (WBB) is ENROLLED in SOCI-150 in 2026FA and has the default allowance of 9.0 units."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: AcademicAdvisor
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "SOCI", course_number: "150", title: "Introduction to Sociology", credit_hours: 3.00, instructor_user_id: "instr_soc_1", meeting_days: [1, 3, 5], meeting_start_minute_utc: 600, meeting_duration_minutes: 50 }
              as: Registrar
              captures: { soci_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Fortyfour", sport_code: "WBB", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s44_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s44_id}", course_id: "${soci_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e44_id: $.data.id }
            - call: "POST /athletics/competition-events"
              payload: { sport_code: "WBB", term_id: "${term1_id}", event_type: "REGULAR_SEASON", departure_at: "2026-09-14T08:00:00Z", return_at: "2026-09-16T10:00:00Z" }
              as: AthleticsOperations
              captures: { ev44_id: $.data.id }
            - call: "POST /athletics/competition-events/${ev44_id}/status"
              payload: { action: "APPROVE_TRAVEL" }
              as: AthleticsOperations
          trigger:
            - call: "POST /athletics/missed-class-requests"
              payload: { competition_event_id: "${ev44_id}", enrollment_id: "${e44_id}" }
              as: AcademicAdvisor
          assert:
            - "The response is HTTP 201 with data.status == DRAFT and data.missed_meeting_count == 1 (only the Monday 10:00-10:50 occurrence)"
            - "data.missed_units_gross == 0.83 (50 overlap minutes / 60, ROUND_HALF_UP) and data.missed_units == 0.83 after the 1.0 multiplier"
            - "data.instructor_user_id == instr_soc_1 and data.notified_at is null"
            - "StudentAthlete.${s44_id}.missed_class_units_charged == 0.83 and missed_class_units_remaining == 8.17"
            - "CompetitionEvent.${ev44_id}.charged_units_total == 0.83"
            - "StudentAthlete.${s44_id}.risk_score == 41.84 (0.4 * 100.00 gpa points on an empty COMPLETED set plus 0.2 * 9.22 missed points) and risk_tier == TIER_3"
            - "StudentAthlete.${s44_id}.required_study_hall_hours == 8.0 because floor(0.83 / 3) contributes no travel offset"

      - name: incident_severity_points_applied_without_decay
        claim_type: constants_applied
        grounds:
          - calculations.tutor_compliance_penalty.formula
          - constants.INCIDENT_POINTS
          - entities.ComplianceIncident.fields.penalty_points_assessed
        distinguishing_aspect: "INCIDENT_POINTS[LEVEL_II] writes exactly 2.00 penalty points on SUBSTANTIATE, and with no CLOSED reporting term in existence the decay step is not applied, so the tutor's ledger reads 2 and its status stays TRAINED one point below TUTOR_SUSPENSION_POINT_THRESHOLD."
        test_recipe:
          setup:
            - "Tutor T45 completed training in 2026FA and holds no assignments, so no cascade can fire."
            - "ComplianceIncident I45 (EXCESSIVE_TUTOR_HOURS) against student S45 and tutor T45 is UNDER_INVESTIGATION; 2026FA is still OPEN so no decay window has elapsed."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Fortyfive", sport_code: "MBB", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s45_id: $.data.id }
            - call: "POST /athletics/tutors"
              payload: { full_name: "Tomas Twopoints", subject_codes: ["MATH"] }
              as: LearningSpecialist
              captures: { t45_id: $.data.id }
            - call: "POST /athletics/tutors/${t45_id}/status"
              payload: { action: "COMPLETE_TRAINING", term_id: "${term1_id}" }
              as: LearningSpecialist
            - call: "POST /athletics/compliance-incidents"
              payload: { student_athlete_id: "${s45_id}", incident_type: "EXCESSIVE_TUTOR_HOURS", narrative: "Tutor logged hours beyond the weekly cap for this student.", tutor_id: "${t45_id}" }
              as: ComplianceOfficer
              captures: { i45_id: $.data.id }
            - call: "POST /athletics/compliance-incidents/${i45_id}/status"
              payload: { action: "OPEN_INVESTIGATION" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /athletics/compliance-incidents/${i45_id}/status"
              payload: { action: "SUBSTANTIATE", severity: "LEVEL_II" }
              as: ComplianceOfficer
          assert:
            - "The response is HTTP 200 with data.status == SUBSTANTIATED, data.severity == LEVEL_II and data.penalty_points_assessed == 2.00"
            - "Tutor.${t45_id}.penalty_points == 2 and Tutor.${t45_id}.status == TRAINED (2 < TUTOR_SUSPENSION_POINT_THRESHOLD 3)"
            - "Tutor.${t45_id}.training_completed_term_index == 1 and training_valid_through_term_index == 3"
            - "StudentAthlete.${s45_id}.substantiated_penalty_points == 2.00"
            - "StudentAthlete.${s45_id}.risk_score == 47.50 (0.4 * 100.00 gpa points plus 0.15 * 50.00 incident points) and risk_tier == TIER_3"
            - "StudentAthlete.${s45_id}.support_status == SUPPORT_MANDATED - LEVEL_II does not withhold support"

      - name: missed_units_rounded_per_occurrence_then_summed
        claim_type: precision
        grounds: [calculations.missed_class_units.precision]
        excluded_because:
          difficulty_instance: combinatorial_formula / missed_units_round_per_meeting_then_sum
          rationale: "The named §1.8 instance pins the per-occurrence ROUND_HALF_UP order against the round-once-at-the-end alternative."

      - name: study_hall_tutor_credit_bracket_selected_from_gross_hours
        claim_type: tiered_pricing
        grounds: [calculations.support_requirement_hours.formula]
        excluded_because:
          difficulty_instance: combinatorial_formula / study_hall_tutor_credit_cap_from_gross_bracket
          rationale: "The named §1.8 instance drives the gross-bracket cap selection and the tutor-credit subtraction in the declared order."

      - name: progress_pct_exactly_at_required_benchmark_passes
        claim_type: threshold
        grounds: [calculations.progress_benchmark_evaluation.formula]
        excluded_because:
          difficulty_instance: boundary_precision_check / ptd_progress_exactly_at_benchmark_passes
          rationale: "The named §1.8 instance sits exactly on the inclusive progress threshold at 4-decimal precision."

      - name: apr_cohort_excludes_dropped_only_students
        claim_type: input_set_filtering
        grounds: [calculations.apr_points_award.input_set]
        excluded_because:
          difficulty_instance: boundary_precision_check / apr_close_with_zero_eligible_students_yields_null_squad_apr
          rationale: "The named §1.8 instance empties the cohort with a DROPPED-only student and asserts the NULL squad_apr rather than 0."

      - name: apr_close_order_by_term_index_is_respected
        claim_type: chronological
        grounds: [calculations.apr_points_award.formula]
        excluded_because:
          difficulty_instance: compensating_invariant / apr_points_possible_conserved_across_revocation
          rationale: "The named §1.8 instance closes two terms in term_index order and reconciles the point ledger across a revocation."

      - name: degree_audit_diverges_between_catalog_variants
        claim_type: variant_divergence
        grounds: [calculations.degree_applicable_credit_audit.variants]
        excluded_because:
          difficulty_instance: dual_variant_calc / catalog_variant_divergence_on_degree_audit
          rationale: "The named §1.8 instance runs the same data through CATALOG_AT_ENTRY and CATALOG_AT_CERTIFICATION and asserts the delta."

      - name: risk_variant_forced_at_cumulative_minimum_terms
        claim_type: variant_selection
        grounds: [calculations.academic_risk_score.variants]
        excluded_because:
          difficulty_instance: dual_variant_calc / risk_score_variant_divergence_term_snapshot_vs_cumulative
          rationale: "The named §1.8 instance shows TERM_SNAPSHOT below RISK_CUMULATIVE_MIN_TERMS and the forced CUMULATIVE variant at or above it."

  # ---------------------------------------------------------------------------
  # Guide section 4 - Validations
  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: duplicate_enrollment_same_triple_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
          - errors[ERR_DUPLICATE_ENROLLMENT]
          - entities.Enrollment.constraints
        distinguishing_aspect: "A second non-terminal Enrollment for the same (student_athlete_id, course_id, term_id) triple returns 409 ERR_DUPLICATE_ENROLLMENT and leaves exactly one row."
        test_recipe:
          setup:
            - "Student S46 already has an ENROLLED row for SOCI-150 in 2026FA."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "SOCI", course_number: "150", title: "Introduction to Sociology", credit_hours: 3.00, instructor_user_id: "instr_soc_1" }
              as: Registrar
              captures: { soci_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Fortysix", sport_code: "SOC", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s46_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s46_id}", course_id: "${soci_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e46_id: $.data.id }
          trigger:
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s46_id}", course_id: "${soci_id}", term_id: "${term1_id}" }
              as: Registrar
          assert:
            - "The response is HTTP 409 with data.error_id == ERR_DUPLICATE_ENROLLMENT"
            - "GET /athletics/enrollments filtered by student_athlete_id ${s46_id} returns total_count == 1 and the single row id ${e46_id}"
            - "Enrollment.${e46_id}.status == ENROLLED and version == 1"

      - name: same_course_in_a_later_term_is_not_a_duplicate
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=14]
          - entities.Enrollment.fields.term_id
          - entities.Enrollment.fields.credit_hours
        distinguishing_aspect: "The uniqueness key includes term_id, so re-enrolling the same student in the same course in 2027SP is accepted with 201 while the 2026FA row stays ENROLLED - the constraint is per triple, not per (student, course) pair."
        test_recipe:
          setup:
            - "Terms 2026FA (term_index 1) and 2027SP (term_index 2) are both OPEN and student S47 holds an ENROLLED SOCI-150 row in 2026FA."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/terms"
              payload: { code: "2027SP", term_index: 2, term_type: "SPRING", catalog_year: 2027, start_date: "2027-01-11T00:00:00Z", end_date: "2027-05-14T00:00:00Z" }
              as: Registrar
              captures: { term2_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "SOCI", course_number: "150", title: "Introduction to Sociology", credit_hours: 3.00, instructor_user_id: "instr_soc_1" }
              as: Registrar
              captures: { soci_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Fortyseven", sport_code: "SOC", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s47_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s47_id}", course_id: "${soci_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e47a_id: $.data.id }
          trigger:
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s47_id}", course_id: "${soci_id}", term_id: "${term2_id}" }
              as: Registrar
          assert:
            - "The response is HTTP 201 with data.status == ENROLLED and data.term_id == ${term2_id}"
            - "data.credit_hours == 3.00 defaulted from Course.credit_hours and data.credit_source == RESIDENT"
            - "data.grade is null, data.earned_credit_hours == 0.00 and data.is_full_time_countable == false"
            - "Enrollment.${e47a_id}.status == ENROLLED is untouched and GET /athletics/enrollments for ${s47_id} returns total_count == 2"

      - name: major_declaration_after_deadline_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=13]
          - errors[ERR_MAJOR_DECLARATION_DEADLINE_PASSED]
          - entities.DegreeProgram.fields.major_declaration_deadline_term_count
        distinguishing_aspect: "With entry_term_index 1 and the default major_declaration_deadline_term_count 4 the last admissible term_index is 4, so a declaration recorded in the term_index 5 term returns 422 and declared_program_id stays null."
        test_recipe:
          setup:
            - "Student S48 entered at term_index 1; DegreeProgram DP48 uses the default deadline count of 4."
            - "Term 2028FA has term_index 5, which is one past the 1 + 4 - 1 == 4 limit."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/terms"
              payload: { code: "2028FA", term_index: 5, term_type: "FALL", catalog_year: 2028, start_date: "2028-08-21T00:00:00Z", end_date: "2028-12-15T00:00:00Z" }
              as: Registrar
              captures: { term5_id: $.data.id }
            - call: "POST /athletics/degree-programs"
              payload: { code: "DP48", name: "Communications", catalog_year: 2026, total_required_credits: 60.00 }
              as: Registrar
              captures: { dp48_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Fortyeight", sport_code: "MBB", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s48_id: $.data.id }
          trigger:
            - call: "POST /athletics/student-athletes/${s48_id}/major-declaration"
              payload: { declared_program_id: "${dp48_id}", term_id: "${term5_id}" }
              as: AcademicAdvisor
          assert:
            - "The response is HTTP 422 with data.error_id == ERR_MAJOR_DECLARATION_DEADLINE_PASSED"
            - "StudentAthlete.${s48_id}.declared_program_id is null and major_declared_term_index is null"
            - "StudentAthlete.${s48_id}.eligibility_state == NOT_CERTIFIED and degree_applicable_credits == 0.00"

      - name: continuing_certification_without_declared_major_rejected
        claim_type: conditional_validation
        grounds:
          - validations[priority=12]
          - errors[ERR_MAJOR_NOT_DECLARED]
          - calculations.progress_benchmark_evaluation.formula
        distinguishing_aspect: "The declared-major requirement is conditional on certification_type: CONTINUING against a null declared_program_id returns 422 ERR_MAJOR_NOT_DECLARED, whereas the very same student and payload with certification_type INITIAL on the entry term takes the provisional path instead."
        test_recipe:
          setup:
            - "Student S49 entered at term_index 1 and has declared no major."
            - "Term 2027SP has term_index 2, so CONTINUING is the type-correct choice and only the missing major can fail."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/terms"
              payload: { code: "2027SP", term_index: 2, term_type: "SPRING", catalog_year: 2027, start_date: "2027-01-11T00:00:00Z", end_date: "2027-05-14T00:00:00Z" }
              as: Registrar
              captures: { term2_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Fortynine", sport_code: "WBB", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s49_id: $.data.id }
            - call: "GET /athletics/student-athletes/${s49_id}"
              payload: {}
              as: CertificationOfficer
              captures: { s49_v: $.data.version }
          trigger:
            - call: "POST /athletics/certifications"
              payload: { student_athlete_id: "${s49_id}", term_id: "${term2_id}", certification_type: "CONTINUING", expected_student_athlete_version: "${s49_v}" }
              as: CertificationOfficer
              as_user_id: "co_requester"
          assert:
            - "The response is HTTP 422 with data.error_id == ERR_MAJOR_NOT_DECLARED"
            - "No EligibilityCertification row exists for ${s49_id}: GET /athletics/certifications filtered by student_athlete_id returns total_count == 0"
            - "StudentAthlete.${s49_id}.version == ${s49_v} - a rejected certification performs no write on the student"

      - name: certification_type_term_mismatch_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=12]
          - errors[ERR_CERTIFICATION_TYPE_TERM_MISMATCH]
          - entities.StudentAthlete.fields.entry_term_index
        distinguishing_aspect: "Type validity is a cross-entity comparison of Term.term_index against StudentAthlete.entry_term_index: INITIAL is only legal on the entry term, so INITIAL against the term_index 2 term returns 422 even though the same INITIAL payload would succeed on the term_index 1 term."
        test_recipe:
          setup:
            - "Student S50 entered at term_index 1; both 2026FA (index 1) and 2027SP (index 2) are OPEN."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/terms"
              payload: { code: "2027SP", term_index: 2, term_type: "SPRING", catalog_year: 2027, start_date: "2027-01-11T00:00:00Z", end_date: "2027-05-14T00:00:00Z" }
              as: Registrar
              captures: { term2_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Fifty", sport_code: "TRACK", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s50_id: $.data.id }
            - call: "GET /athletics/student-athletes/${s50_id}"
              payload: {}
              as: CertificationOfficer
              captures: { s50_v: $.data.version }
          trigger:
            - call: "POST /athletics/certifications"
              payload: { student_athlete_id: "${s50_id}", term_id: "${term2_id}", certification_type: "INITIAL", expected_student_athlete_version: "${s50_v}" }
              as: CertificationOfficer
              as_user_id: "co_requester"
          assert:
            - "The response is HTTP 422 with data.error_id == ERR_CERTIFICATION_TYPE_TERM_MISMATCH"
            - "The missing-major rule at the same priority does not fire, because INITIAL tolerates a null declared_program_id"
            - "GET /athletics/certifications filtered by student_athlete_id ${s50_id} returns total_count == 0"

      - name: session_ending_after_term_end_rejected
        claim_type: cascading_validation
        grounds:
          - validations[priority=13]
          - errors[ERR_SESSION_OUTSIDE_TERM]
          - entities.SupportSession.fields.term_index_of_record
        distinguishing_aspect: "The window check runs only after the term of record has been resolved from start_at: the session starts inside 2026FA (so term_index_of_record resolves to 1) but ends after Term.end_date, which yields 422 ERR_SESSION_OUTSIDE_TERM rather than the priority-6 time-window error."
        test_recipe:
          setup:
            - "2026FA runs 2026-08-24T00:00:00Z to 2026-12-18T00:00:00Z (half-open on end_date) and student S51 exists."
            - "The proposed STUDY_HALL session runs 2026-12-17T22:00:00Z to 2026-12-19T00:00:00Z, so start_at is inside the term but end_at is not."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-12-17T00:00:00Z" }
              as: LearningSpecialist
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Fiftyone", sport_code: "BASE", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s51_id: $.data.id }
          trigger:
            - call: "POST /athletics/support-sessions"
              payload: { student_athlete_id: "${s51_id}", session_type: "STUDY_HALL", start_at: "2026-12-17T22:00:00Z", end_at: "2026-12-19T00:00:00Z" }
              as: LearningSpecialist
          assert:
            - "The response is HTTP 422 with data.error_id == ERR_SESSION_OUTSIDE_TERM"
            - "The priority-6 ERR_INVALID_TIME_WINDOW does not fire because start_at < end_at holds"
            - "GET /athletics/support-sessions filtered by student_athlete_id ${s51_id} returns total_count == 0"

      - name: tier_hours_cap_aggregate_exceeded_rejected
        claim_type: aggregate_validation
        grounds:
          - validations[priority=15]
          - errors[ERR_TIER_HOURS_CAP_EXCEEDED]
          - calculations.support_requirement_hours.formula
        distinguishing_aspect: "Each assignment is individually legal at 1.50 weekly hours, but the collective 3.00 exceeds TIER_WEEKLY_HOUR_CAP[TIER_1] == 2.0, so the second creation returns 422 while the tutor's ledger stays at 1.50."
        test_recipe:
          setup:
            - "Student S52 has had no enrollment outcome, missed-class charge or incident, so risk_tier is still the default TIER_1 with a weekly cap of 2.0 hours."
            - "Tutor T52 is TRAINED with subject_codes [\"MATH\"] and max_weekly_hours 20 (default); S52 is ENROLLED in MATH-101 and MATH-102."
            - "Assignment A52a (MATH-101, 1.50 weekly hours) is already ACTIVE."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: LearningSpecialist
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "MATH", course_number: "101", title: "College Algebra", credit_hours: 3.00, instructor_user_id: "instr_math_1" }
              as: Registrar
              captures: { math101_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "MATH", course_number: "102", title: "Precalculus", credit_hours: 3.00, instructor_user_id: "instr_math_2" }
              as: Registrar
              captures: { math102_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Fiftytwo", sport_code: "MBB", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s52_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s52_id}", course_id: "${math101_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e52a_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s52_id}", course_id: "${math102_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e52b_id: $.data.id }
            - call: "POST /athletics/tutors"
              payload: { full_name: "Tina Mathis", subject_codes: ["MATH"] }
              as: LearningSpecialist
              captures: { t52_id: $.data.id }
            - call: "POST /athletics/tutors/${t52_id}/status"
              payload: { action: "COMPLETE_TRAINING", term_id: "${term1_id}" }
              as: LearningSpecialist
            - call: "POST /athletics/tutor-assignments"
              payload: { tutor_id: "${t52_id}", enrollment_id: "${e52a_id}", weekly_hours: 1.50 }
              as: LearningSpecialist
              captures: { a52a_id: $.data.id }
            - call: "POST /athletics/tutor-assignments/${a52a_id}/status"
              payload: { action: "ACTIVATE" }
              as: LearningSpecialist
          trigger:
            - call: "POST /athletics/tutor-assignments"
              payload: { tutor_id: "${t52_id}", enrollment_id: "${e52b_id}", weekly_hours: 1.50 }
              as: LearningSpecialist
          assert:
            - "The response is HTTP 422 with data.error_id == ERR_TIER_HOURS_CAP_EXCEEDED"
            - "The priority-15 tutor weekly-hours rule does not fire because 1.50 + 1.50 == 3.00 is far below max_weekly_hours 20"
            - "Tutor.${t52_id}.assigned_weekly_hours == 1.50 and TutorAssignment.${a52a_id}.status == ACTIVE"
            - "StudentAthlete.${s52_id}.required_study_hall_hours == 0.0 - TIER_1's 0.0 base minus the 0.75 tutor credit floors at 0.0"

      - name: transfer_certification_residency_not_met_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_TRANSFER_RESIDENCY_NOT_MET]
          - calculations.transfer_credit_acceptance.formula
        distinguishing_aspect: "An INCOMING_TRANSFER student with a COMPLETED transfer enrollment but no COMPLETED resident enrollment fails the TRANSFER_RESIDENCY_TERMS gate with 422, and the accepted-credit figure 12.00 is still stored on the student as the calculation specifies."
        test_recipe:
          setup:
            - "Student S53 is INCOMING_TRANSFER, declared DP53 in 2026FA and has a COMPLETED TRANSFER enrollment in HIST-101 (12.00 credits, CORE rule for catalog 2026) with grade B."
            - "The student holds no RESIDENT enrollment at all, so zero terms satisfy the residency requirement of 1."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/degree-programs"
              payload: { code: "DP53", name: "History", catalog_year: 2026, total_required_credits: 60.00 }
              as: Registrar
              captures: { dp53_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "HIST", course_number: "101", title: "World History", credit_hours: 12.00, instructor_user_id: "instr_hist_1" }
              as: Registrar
              captures: { hist_id: $.data.id }
            - call: "POST /athletics/degree-applicability-rules"
              payload: { degree_program_id: "${dp53_id}", course_id: "${hist_id}", effective_catalog_year: 2026, applicability: "CORE" }
              as: Registrar
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Fiftythree", sport_code: "SOC", entry_term_index: 1, entry_catalog_year: 2026, transfer_status: "INCOMING_TRANSFER" }
              as: Registrar
              captures: { s53_id: $.data.id }
            - call: "POST /athletics/student-athletes/${s53_id}/major-declaration"
              payload: { declared_program_id: "${dp53_id}", term_id: "${term1_id}" }
              as: AcademicAdvisor
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s53_id}", course_id: "${hist_id}", term_id: "${term1_id}", credit_source: "TRANSFER" }
              as: Registrar
              captures: { e53_id: $.data.id }
            - call: "POST /athletics/enrollments/${e53_id}/outcome"
              payload: { action: "RECORD_GRADE", grade: "B" }
              as: Registrar
            - call: "GET /athletics/student-athletes/${s53_id}"
              payload: {}
              as: CertificationOfficer
              captures: { s53_v: $.data.version }
          trigger:
            - call: "POST /athletics/certifications"
              payload: { student_athlete_id: "${s53_id}", term_id: "${term1_id}", certification_type: "TRANSFER", expected_student_athlete_version: "${s53_v}" }
              as: CertificationOfficer
              as_user_id: "co_requester"
          assert:
            - "The response is HTTP 422 with data.error_id == ERR_TRANSFER_RESIDENCY_NOT_MET"
            - "The priority-12 transfer credit-source rule does not fire because a COMPLETED TRANSFER enrollment exists"
            - "StudentAthlete.${s53_id}.transfer_credits_accepted == 12.00 is stored even though the certification was refused"
            - "StudentAthlete.${s53_id}.eligibility_state == NOT_CERTIFIED and GET /athletics/certifications for ${s53_id} returns total_count == 0"

      - name: get_unknown_tutor_without_x_user_id_returns_unauthenticated
        claim_type: priority_ordering
        grounds:
          - validations[priority=1]
          - validations[priority=4]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Authentication at priority 1 outranks resource resolution at priority 4: a request with a blank X-User-ID against a non-existent tutor id returns 401 ERR_UNAUTHENTICATED, never 404 ERR_TUTOR_NOT_FOUND."
        test_recipe:
          setup:
            - "No tutor with id 00000000-0000-0000-0000-000000000000 exists, and the request is sent with an empty X-User-ID header."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: LearningSpecialist
          trigger:
            - call: "GET /athletics/tutors/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: LearningSpecialist
              as_user_id: ""
          assert:
            - "The response is HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "data.response_type == error and the meta envelope still carries api_request_id and api_request_timestamp"
            - "The same request with a non-empty X-User-ID returns 404 ERR_TUTOR_NOT_FOUND, proving the ordering rather than a missing route"

      - name: state_error_outranks_fiscal_error_on_request_create
        claim_type: priority_conflict
        grounds: ["errors[ERR_EVENT_NOT_TRAVEL_APPROVED]", "errors[ERR_MISSED_CLASS_ALLOWANCE_EXCEEDED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_on_missed_class_request_create
          rationale: "The named §1.8 instance violates the priority-10 state rule and the priority-15 fiscal rule in one call and pins the priority-10 error."

      - name: safety_error_outranks_referential_error_on_assignment_create
        claim_type: priority_conflict
        grounds: ["errors[ERR_TUTOR_NOT_TRAINED]", "errors[ERR_TUTOR_SUBJECT_MISMATCH]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_beats_referential_on_tutor_assignment_create
          rationale: "The named §1.8 instance violates the priority-11 safety rule and the priority-12 referential rule in one call and pins the priority-11 error."

  # ---------------------------------------------------------------------------
  # Guide section 5 - Endpoints
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: eligibility_summary_computed_read_matches_audit
        claim_type: computed_read
        grounds:
          - endpoints[GET /athletics/student-athletes/{student_athlete_id}/eligibility-summary]
          - calculations.progress_benchmark_evaluation.formula
          - calculations.support_requirement_hours.formula
        distinguishing_aspect: "The summary read is a pure projection: with one COMPLETED 12.00-credit CORE course graded B it returns progress_pct 0.2000 against required_progress_pct 0.0000, benchmark_result PASS with an empty failure_reasons array, and the default variants CATALOG_AT_ENTRY / TERM_SNAPSHOT."
        test_recipe:
          setup:
            - "Student S54 declared DP54 (total_required_credits 60.00, min_progress_gpa 2.0) in 2026FA and completed KINE-200 (12.00 credits, CORE rule for catalog 2026) with grade B."
            - "The student has no missed-class charges, no incidents and no tutor assignments; completed_full_time_terms is 1, which is below RISK_CUMULATIVE_MIN_TERMS."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/degree-programs"
              payload: { code: "DP54", name: "Kinesiology", catalog_year: 2026, total_required_credits: 60.00 }
              as: Registrar
              captures: { dp54_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "KINE", course_number: "200", title: "Exercise Physiology", credit_hours: 12.00, instructor_user_id: "instr_kine_1" }
              as: Registrar
              captures: { kine_id: $.data.id }
            - call: "POST /athletics/degree-applicability-rules"
              payload: { degree_program_id: "${dp54_id}", course_id: "${kine_id}", effective_catalog_year: 2026, applicability: "CORE" }
              as: Registrar
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Fiftyfour", sport_code: "WBB", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s54_id: $.data.id }
            - call: "POST /athletics/student-athletes/${s54_id}/major-declaration"
              payload: { declared_program_id: "${dp54_id}", term_id: "${term1_id}" }
              as: AcademicAdvisor
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s54_id}", course_id: "${kine_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e54_id: $.data.id }
            - call: "POST /athletics/enrollments/${e54_id}/outcome"
              payload: { action: "RECORD_GRADE", grade: "B" }
              as: Registrar
          trigger:
            - call: "GET /athletics/student-athletes/${s54_id}/eligibility-summary"
              payload: {}
              as: CertificationOfficer
          assert:
            - "The response is HTTP 200 with response_type == object and data.student_athlete_id == ${s54_id}"
            - "data.audit_variant == CATALOG_AT_ENTRY and data.risk_variant == TERM_SNAPSHOT (both defaulted)"
            - "data.degree_applicable_credits == 12.00, data.progress_pct == 0.2000 and data.required_progress_pct == 0.0000"
            - "data.benchmark_result == PASS and data.failure_reasons == []"
            - "data.cumulative_gpa == 3.00, data.completed_full_time_terms == 1 and data.transfer_credits_accepted == 0.00"
            - "data.risk_score == 0.00, data.risk_tier == TIER_1 and data.required_study_hall_hours == 0.0"
            - "data.missed_class_units_charged == 0.00 and data.missed_class_units_remaining == 9.00"
            - "data.apr_points_possible == 0, data.apr_points_earned == 0 and data.apr_points_forfeited == 0"

      - name: apr_close_before_term_end_returns_409
        claim_type: conditional_action
        grounds:
          - endpoints[POST /athletics/terms/{term_id}/apr-close]
          - validations[priority=9]
          - errors[ERR_APR_TERM_NOT_ENDED]
        distinguishing_aspect: "The APR close action is conditional on the logical clock having reached Term.end_date: at 2026-12-17T00:00:00Z the close returns 409 ERR_APR_TERM_NOT_ENDED and the term keeps apr_status OPEN with squad_apr null."
        test_recipe:
          setup:
