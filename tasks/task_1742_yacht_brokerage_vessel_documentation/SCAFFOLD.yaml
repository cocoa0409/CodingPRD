    output: SyndicationEvent
    side_effects: ["on outcome == ACKED: syndication_status = SYNDICATED"]
  - method: GET
    path: "/yacht/listings/{id}/syndication-events"
    description: "List syndication pushes for a listing"
    roles: [PlatformAdmin, ListingAgent, SellingAgent]
    code: 200
    input: []
    output: SyndicationEvent[]
    side_effects: []
  - method: GET
    path: "/yacht/listings/{id}/offers"
    description: "List offers on a listing"
    roles: [PlatformAdmin, ListingAgent, SellingAgent, ClosingOfficer, EscrowOfficer]
    code: 200
    input: []
    output: Offer[]
    side_effects: []
  - method: POST
    path: "/yacht/offers"
    description: "Submit a buyer offer on a listing"
    roles: [SellingAgent]
    code: 201
    input: [listing_id, buyer_id, selling_agent_id, offer_price_cents, deposit_pct_basis, acceptance_deadline, settlement_state_code, 'offshore_delivery?', 'parent_offer_id?']
    output: Offer
    side_effects: ["offer.status = PENDING", "round_no = 1 (or parent.round_no + 1 when parent_offer_id set)"]
  - method: GET
    path: "/yacht/offers/{id}"
    description: "Fetch one offer"
    roles: [PlatformAdmin, ListingAgent, SellingAgent, ClosingOfficer, EscrowOfficer]
    code: 200
    input: []
    output: Offer
    side_effects: []
  - method: GET
    path: "/yacht/offers"
    description: "List offers with filters and pagination"
    roles: [PlatformAdmin, ListingAgent, SellingAgent, ClosingOfficer, EscrowOfficer]
    code: 200
    input: ['listing_id?', 'buyer_id?', 'selling_agent_id?', 'parent_offer_id?', 'status?', 'limit?', 'offset?']
    output: Offer[]
    side_effects: []
  - method: POST
    path: "/yacht/offers/{id}/accept"
    description: "Seller side accepts a PENDING offer (OCC-guarded)"
    roles: [ListingAgent]
    code: 200
    input: [expected_offer_version]
    output: Offer
    side_effects: ["offer.status = ACCEPTED", "listing.status = UNDER_CONTRACT", "auto-create Contingency rows", "increments offer.version by 1"]
  - method: POST
    path: "/yacht/offers/{id}/reject"
    description: "Seller side rejects a PENDING offer"
    roles: [ListingAgent]
    code: 200
    input: []
    output: Offer
    side_effects: ["offer.status = REJECTED", "increments offer.version by 1"]
  - method: POST
    path: "/yacht/offers/{id}/counter"
    description: "Counter a PENDING offer; creates child offer in PENDING with round_no+1 (OCC-guarded)"
    roles: [ListingAgent, SellingAgent]
    code: 201
    input: [expected_offer_version, offer_price_cents, deposit_pct_basis, acceptance_deadline]
    output: Offer
    side_effects: ["original offer.status = COUNTERED", "creates child Offer (PENDING, parent_offer_id = original.id)", "increments original offer.version by 1"]
  - method: POST
    path: "/yacht/offers/{id}/withdraw"
    description: "Buyer side withdraws its own PENDING offer"
    roles: [SellingAgent]
    code: 200
    input: []
    output: Offer
    side_effects: ["offer.status = WITHDRAWN", "increments offer.version by 1"]
  - method: POST
    path: "/yacht/offers/{id}/fail"
    description: "Collapse an ACCEPTED offer after unresolved contingency objection (kick-out)"
    roles: [SellingAgent]
    code: 200
    input: []
    output: Offer
    side_effects: ["offer.status = FAILED", "listing.status = ACTIVE", "increments offer.version by 1"]
  - method: GET
    path: "/yacht/offers/{id}/contingencies"
    description: "List contingencies on an offer"
    roles: [PlatformAdmin, ListingAgent, SellingAgent, ClosingOfficer, EscrowOfficer]
    code: 200
    input: []
    output: Contingency[]
    side_effects: []
  - method: POST
    path: "/yacht/contingencies/{id}/satisfy"
    description: "Buyer side marks a contingency satisfied"
    roles: [SellingAgent]
    code: 200
    input: []
    output: Contingency
    side_effects: ["contingency.status = SATISFIED", "increments contingency.version by 1"]
  - method: POST
    path: "/yacht/contingencies/{id}/waive"
    description: "Buyer side waives a contingency"
    roles: [SellingAgent]
    code: 200
    input: []
    output: Contingency
    side_effects: ["contingency.status = WAIVED", "increments contingency.version by 1"]
  - method: POST
    path: "/yacht/contingencies/{id}/object"
