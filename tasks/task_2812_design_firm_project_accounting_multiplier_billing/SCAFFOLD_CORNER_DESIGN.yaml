              as: Controller
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /phases"
              payload: { project_id: "${p_id}", wbs_code: "02-DD", fee_basis: "LUMP_SUM", lump_sum_fee: 200000.00, budget_labor_cost: 60000.00, consultant_budget: 0.00 }
              as: Controller
              captures: { ph_id: $.data.id }
            - call: "POST /billing-multipliers"
              payload: { project_id: "${p_id}", multiplier: 3.0500, effective_from: "2026-01-01", expected_project_version: "${p_v0}" }
              as: Controller
            - call: "POST /projects/${p_id}/activate"
              payload: {}
              as: Controller
            - call: "POST /time-entries"
              payload: { project_id: "${p_id}", phase_id: "${ph_id}", role_code: "PROJECT_ARCHITECT", work_date: "2026-05-11", hours: 4.00 }
              as: ProjectAccountant
              as_user_id: "acct-001"
              captures: { te_done: $.data.id }
            - call: "POST /time-entries/${te_done}/approve"
              payload: {}
              as: ProjectManager
              as_user_id: "pm-001"
            - call: "POST /time-entries"
              payload: { project_id: "${p_id}", phase_id: "${ph_id}", role_code: "PROJECT_ARCHITECT", work_date: "2026-05-12", hours: 2.00 }
              as: ProjectAccountant
              as_user_id: "acct-001"
              captures: { te_open: $.data.id }
            - call: "POST /expenses"
              payload: { project_id: "${p_id}", phase_id: "${ph_id}", category: "REPROGRAPHICS", amount: 100.00, incurred_on: "2026-05-12", receipt_attached: false }
              as: ProjectAccountant
              as_user_id: "acct-001"
              captures: { ex_open: $.data.id }
          trigger:
            - call: "POST /phases/${ph_id}/complete"
