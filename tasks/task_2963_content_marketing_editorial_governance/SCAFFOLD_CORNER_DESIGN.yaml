          - errors[ERR_EVIDENCE_INSUFFICIENT]
        excluded_because:
          difficulty_instance: dual_variant_calc / claim_evidence_score_strict_regulated_diverges_from_standard
          rationale: "The named §1.8 instance decides the same evidence dossier under both scoring variants; the STRICT_REGULATED leg is refused with this code."

      - name: error_slot_capacity_exceeded_is_triggered_by_the_difficulty_design
        claim_type: Error triggerable
        grounds:
          - errors[ERR_SLOT_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: combinatorial_formula / slot_commit_tier_pinned_to_pre_commit_utilization
          rationale: "The named §1.8 instance drives the slot to the point where the tier surcharge pushes commit_points past capacity_points and asserts this code."

      - name: error_expert_unavailable_is_triggered_by_the_difficulty_design
