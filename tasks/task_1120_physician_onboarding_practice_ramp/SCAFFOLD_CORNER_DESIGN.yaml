        claim_type: exclusive_operation_denied
        grounds: ["roles", "validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Segregated steps stay segregated: the PracticeManager cannot approve a credential item, the Recruiter cannot execute an offer, and a Physician cannot submit credential documents — each denied with ERR_FORBIDDEN (403)."
        test_recipe:
