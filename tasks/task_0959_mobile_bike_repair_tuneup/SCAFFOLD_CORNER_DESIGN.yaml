          assert:
            - "error_id == ERR_SUBSCRIPTION_PERIOD (422)"

      - name: suspended_subscription_booking_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority=22]", "errors[ERR_SUBSCRIPTION_INACTIVE]"]
        distinguishing_aspect: "Booking with a SUSPENDED subscription fails with ERR_SUBSCRIPTION_INACTIVE (409) even though allowance remains."
        test_recipe:
