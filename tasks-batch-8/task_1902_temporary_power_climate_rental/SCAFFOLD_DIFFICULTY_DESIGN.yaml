scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains: contract load vs unit fuel)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: load_sizing_nameplate_vs_diversified
        grounds:
          - calculations.load_sizing
          - entities.RentalContract.fields.load_profile
          - entities.RentalContract.fields.sized_kw
        distinguishing_aspect: |
          Same load_profile on the same RentalContract yields sized_kw 275 under
          NAMEPLATE_SUM but 213 under DIVERSIFIED_DEMAND — a contract-domain
          dual variant, distinct from the equipment-telemetry domain of the
          second instance.
        test_recipe:
          setup:
            - "Customer C1 (credit GOOD), Site S1 in TX-TCEQ"
            - "RentalContract K1 on S1 with load_profile [(CONTINUOUS,100),(INTERMITTENT,80),(STANDBY,40)], window 2026-09-01..2026-09-08, status DRAFT"
          setup_api_calls:
            - call: "POST /power-rental/customers"
              payload: { name: "Acme Construction", billing_email: "ap@acme.example" }
              as: SalesEngineer
              captures: { cust_id: $.data.id }
            - call: "POST /power-rental/sites"
              payload: { customer_id: "${cust_id}", name: "Houston Yard", jurisdiction_code: "TX-TCEQ", fuel_tank_capacity_liters: 5000 }
              as: SalesEngineer
              captures: { site_id: $.data.id }
            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 100 }, { load_type: "INTERMITTENT", nameplate_kw: 80 }, { load_type: "STANDBY", nameplate_kw: 40 } ], start_date: "2026-09-01T00:00:00Z", expected_offhire_date: "2026-09-08T00:00:00Z" }
              as: SalesEngineer
              captures: { con_id: $.data.id }
          trigger:
            - call: "POST /power-rental/rental-contracts/${con_id}/size-load"
              payload: { sizing_method: "NAMEPLATE_SUM" }
              as: SalesEngineer
              captures: { sized_np: $.data.sized_kw }
            - call: "POST /power-rental/rental-contracts/${con_id}/size-load"
              payload: { sizing_method: "DIVERSIFIED_DEMAND" }
              as: SalesEngineer
              captures: { sized_dd: $.data.sized_kw }
          assert:
            - "first size-load response sized_kw == 275 (ceil(1.25 * 220))"
            - "second size-load response sized_kw == 213 (ceil(1.25 * 170))"
            - "RentalContract.${con_id}.sizing_method == DIVERSIFIED_DEMAND after second call"
            - "275 != 213 — identical inputs, variant-divergent outputs"

      - name: fuel_projection_rated_vs_metered
        grounds:
          - calculations.fuel_burn_projection
          - entities.TelemetryEvent.fields.event_type
          - entities.EquipmentUnit.fields.capacity_kw
        distinguishing_aspect: |
          Same 200 kW unit and same site tank yield liters_per_hour 42.0 under
          RATED_CURVE but 50.0 under METERED_AVG (500 L over 10 h) — an
          equipment-telemetry-domain dual variant, distinct from the
          contract-domain load_sizing instance.
        test_recipe:
          setup:
            - "Customer C1, Site S1 (TX-TCEQ, 5000 L tank), Unit U1 (200 kW, nox 3.0, TIER_4F, rates 12000/60000/200000, demob 35000)"
            - "Contract K1 (window 2026-09-01..2026-09-08, load 160 CONTINUOUS -> sized 200) is ON_RENT with U1 DEPLOYED"
            - "Logical clock at 2026-09-05T00:00:00Z; telemetry: FUEL_DELIVERY 3000 L (2026-09-02), RUNTIME 10 h (2026-09-04T10:00), FUEL_BURN 500 L (2026-09-04T12:00)"
          setup_api_calls:
            - call: "POST /power-rental/customers"
              payload: { name: "Acme Construction", billing_email: "ap@acme.example" }
              as: SalesEngineer
              captures: { cust_id: $.data.id }
            - call: "POST /power-rental/sites"
              payload: { customer_id: "${cust_id}", name: "Houston Yard", jurisdiction_code: "TX-TCEQ", fuel_tank_capacity_liters: 5000 }
              as: SalesEngineer
              captures: { site_id: $.data.id }
            - call: "POST /power-rental/equipment-units"
              payload: { unit_type: "GENERATOR", capacity_kw: 200, fuel_type: "DIESEL", emissions_tier: "TIER_4F", nox_g_per_kwh: 3.0, day_rate_cents: 12000, week_rate_cents: 60000, month_rate_cents: 200000, demob_fee_cents: 35000, home_depot_code: "DAL-01" }
              as: DepotManager
              captures: { unit_id: $.data.id }
            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 160 } ], start_date: "2026-09-01T00:00:00Z", expected_offhire_date: "2026-09-08T00:00:00Z" }
              as: SalesEngineer
              captures: { con_id: $.data.id }
            - call: "POST /power-rental/rental-contracts/${con_id}/size-load"
              payload: { sizing_method: "NAMEPLATE_SUM" }
              as: SalesEngineer
              captures: { con_v: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/lines"
              payload: { line_type: "EQUIPMENT", equipment_unit_id: "${unit_id}", expected_rental_contract_version: "${con_v}" }
              as: SalesEngineer
            - call: "POST /power-rental/rental-contracts/${con_id}/quote"
              payload: {}
              as: SalesEngineer
              captures: { con_v4: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/confirm"
              payload: { expected_rental_contract_version: "${con_v4}" }
              as: SalesEngineer
            - call: "POST /power-rental/rental-contracts/${con_id}/mobilize"
              payload: {}
              as: DepotManager
            - call: "POST /power-rental/rental-contracts/${con_id}/start-rental"
              payload: {}
              as: DepotManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /power-rental/telemetry-events"
              payload: { contract_id: "${con_id}", event_type: "FUEL_DELIVERY", value: 3000, recorded_at: "2026-09-02T08:00:00Z" }
              as: FieldTechnician
            - call: "POST /power-rental/telemetry-events"
              payload: { equipment_unit_id: "${unit_id}", contract_id: "${con_id}", event_type: "RUNTIME", value: 10, recorded_at: "2026-09-04T10:00:00Z" }
              as: FieldTechnician
            - call: "POST /power-rental/telemetry-events"
              payload: { equipment_unit_id: "${unit_id}", contract_id: "${con_id}", event_type: "FUEL_BURN", value: 500, recorded_at: "2026-09-04T12:00:00Z" }
              as: FieldTechnician
          trigger:
            - call: "GET /power-rental/equipment-units/${unit_id}/fuel-projection"
              payload: { method: "RATED_CURVE" }
              as: DepotManager
              captures: { rated_lph: $.data.liters_per_hour, rated_eta: $.data.next_refuel_eta_hours }
            - call: "GET /power-rental/equipment-units/${unit_id}/fuel-projection"
              payload: { method: "METERED_AVG" }
              as: DepotManager
              captures: { met_lph: $.data.liters_per_hour, met_eta: $.data.next_refuel_eta_hours }
          assert:
            - "RATED_CURVE: liters_per_hour == 42.0, projected_liters_per_day == 1008.0, next_refuel_eta_hours == 71.43 (3000/42 round_half_up 2dp)"
            - "METERED_AVG: liters_per_hour == 50.0, projected_liters_per_day == 1200.0, next_refuel_eta_hours == 60.0, telemetry_event_count == 2"
            - "rated liters_per_hour 42.0 != metered 50.0 for the identical unit and tank"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (mode a tiered vs mode b rounding order)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: rental_charge_tiered_decomposition
        grounds:
          - calculations.rental_charge_accrual
          - entities.RentalLine.fields.day_rate_cents
          - entities.RentalLine.fields.demob_fee_cents
        distinguishing_aspect: |
          Mode (a): tiered decomposition with >= 3 interacting inputs (duration,
          three rate tiers, demob fee, quantity) — a 7-day window selects one
          weekly block per line (60000 + 15000) plus a 35000 demob fee, total
          110000, instead of 7 daily charges (105000).
        test_recipe:
          setup:
            - "Customer C1, Site S1 (TX-TCEQ), Unit U1 (200 kW, rates 12000/60000/200000, demob 35000), Kit K (CABLE-400A, 400 A, rates 3000/15000/50000)"
            - "Contract K1 DRAFT, window 2026-09-01..2026-09-08 (exactly 7 days), load 160 CONTINUOUS -> sized 200"
            - "Lines: one EQUIPMENT (U1), one ACCESSORY_KIT (K x1; required amps 241 <= 400)"
          setup_api_calls:
            - call: "POST /power-rental/customers"
              payload: { name: "Acme Construction", billing_email: "ap@acme.example" }
              as: SalesEngineer
              captures: { cust_id: $.data.id }
            - call: "POST /power-rental/sites"
              payload: { customer_id: "${cust_id}", name: "Houston Yard", jurisdiction_code: "TX-TCEQ", fuel_tank_capacity_liters: 5000 }
              as: SalesEngineer
              captures: { site_id: $.data.id }
            - call: "POST /power-rental/equipment-units"
              payload: { unit_type: "GENERATOR", capacity_kw: 200, fuel_type: "DIESEL", emissions_tier: "TIER_4F", nox_g_per_kwh: 3.0, day_rate_cents: 12000, week_rate_cents: 60000, month_rate_cents: 200000, demob_fee_cents: 35000, home_depot_code: "DAL-01" }
              as: DepotManager
              captures: { unit_id: $.data.id }
            - call: "POST /power-rental/accessory-kits"
              payload: { kit_code: "CABLE-400A", description: "400A cable + distro kit", max_ampacity_a: 400, day_rate_cents: 3000, week_rate_cents: 15000, month_rate_cents: 50000 }
              as: DepotManager
              captures: { kit_id: $.data.id }
            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 160 } ], start_date: "2026-09-01T00:00:00Z", expected_offhire_date: "2026-09-08T00:00:00Z" }
              as: SalesEngineer
              captures: { con_id: $.data.id }
            - call: "POST /power-rental/rental-contracts/${con_id}/size-load"
              payload: { sizing_method: "NAMEPLATE_SUM" }
              as: SalesEngineer
              captures: { con_v: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/lines"
              payload: { line_type: "EQUIPMENT", equipment_unit_id: "${unit_id}", expected_rental_contract_version: "${con_v}" }
              as: SalesEngineer
            - call: "GET /power-rental/rental-contracts/${con_id}"
              payload: {}
              as: SalesEngineer
              captures: { con_v3: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/lines"
              payload: { line_type: "ACCESSORY_KIT", accessory_kit_id: "${kit_id}", quantity: 1, expected_rental_contract_version: "${con_v3}" }
              as: SalesEngineer
          trigger:
            - call: "POST /power-rental/rental-contracts/${con_id}/quote"
              payload: {}
              as: SalesEngineer
              captures: { quoted: $.data.quoted_total_cents }
          assert:
            - "quoted_total_cents == 110000 (equipment 60000 + demob 35000 + kit 15000)"
            - "naive per-day alternative 7*12000 + 7*3000 = 105000 is NOT used — week tier selected at day 7"

      - name: invoice_discount_rounds_per_line_then_sums
        grounds:
          - calculations.invoice_total
          - entities.Customer.fields.loyalty_discount_pct
          - entities.RentalContract.fields.invoice_total_cents
        distinguishing_aspect: |
          Mode (b): pinned nested rounding order — round_half_up per line then
          sum gives 2 x round(100005 * 0.93) = 2 x 93005 = 186010, whereas
          sum-then-round would give round(200010 * 0.93) = 186009; the scaffold
          pins per-line-first, a different combinatorial mode than tiered
          decomposition.
        test_recipe:
          setup:
            - "Customer C1 with loyalty_discount_pct 0.07; Site S1 (TX-TCEQ)"
            - "Units U1 and U2 (100 kW each, rates 10001/50005/200011, demob 50000, nox 2.0, TIER_4F)"
            - "Contract K1 window 2026-09-01..2026-09-06 (5 days), load 80 CONTINUOUS -> sized 100; ON_RENT with both units DEPLOYED; clock advanced to 2026-09-06 and contract taken OFF_HIRE so each line final_charge_cents == 50005 + 50000 = 100005"
          setup_api_calls:
            - call: "POST /power-rental/customers"
              payload: { name: "Loyal Rentals Co", billing_email: "ap@loyal.example", loyalty_discount_pct: 0.07 }
              as: SalesEngineer
              captures: { cust_id: $.data.id }
            - call: "POST /power-rental/sites"
              payload: { customer_id: "${cust_id}", name: "Houston Yard", jurisdiction_code: "TX-TCEQ", fuel_tank_capacity_liters: 5000 }
              as: SalesEngineer
              captures: { site_id: $.data.id }
            - call: "POST /power-rental/equipment-units"
              payload: { unit_type: "GENERATOR", capacity_kw: 100, fuel_type: "DIESEL", emissions_tier: "TIER_4F", nox_g_per_kwh: 2.0, day_rate_cents: 10001, week_rate_cents: 50005, month_rate_cents: 200011, demob_fee_cents: 50000, home_depot_code: "DAL-01" }
              as: DepotManager
              captures: { u1: $.data.id }
            - call: "POST /power-rental/equipment-units"
              payload: { unit_type: "GENERATOR", capacity_kw: 100, fuel_type: "DIESEL", emissions_tier: "TIER_4F", nox_g_per_kwh: 2.0, day_rate_cents: 10001, week_rate_cents: 50005, month_rate_cents: 200011, demob_fee_cents: 50000, home_depot_code: "DAL-01" }
              as: DepotManager
              captures: { u2: $.data.id }
            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 80 } ], start_date: "2026-09-01T00:00:00Z", expected_offhire_date: "2026-09-06T00:00:00Z" }
              as: SalesEngineer
              captures: { con_id: $.data.id }
            - call: "POST /power-rental/rental-contracts/${con_id}/size-load"
              payload: { sizing_method: "NAMEPLATE_SUM" }
              as: SalesEngineer
              captures: { con_v: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/lines"
              payload: { line_type: "EQUIPMENT", equipment_unit_id: "${u1}", expected_rental_contract_version: "${con_v}" }
              as: SalesEngineer
            - call: "GET /power-rental/rental-contracts/${con_id}"
              payload: {}
              as: SalesEngineer
              captures: { con_v3: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/lines"
              payload: { line_type: "EQUIPMENT", equipment_unit_id: "${u2}", expected_rental_contract_version: "${con_v3}" }
              as: SalesEngineer
            - call: "POST /power-rental/rental-contracts/${con_id}/quote"
              payload: {}
              as: SalesEngineer
              captures: { con_v5: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/confirm"
              payload: { expected_rental_contract_version: "${con_v5}" }
              as: SalesEngineer
            - call: "POST /power-rental/rental-contracts/${con_id}/mobilize"
              payload: {}
              as: DepotManager
            - call: "POST /power-rental/rental-contracts/${con_id}/start-rental"
              payload: {}
              as: DepotManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /power-rental/rental-contracts/${con_id}/off-hire"
              payload: {}
              as: SalesEngineer
          trigger:
            - call: "POST /power-rental/rental-contracts/${con_id}/close"
              payload: {}
              as: SalesEngineer
              captures: { invoice: $.data.invoice_total_cents }
          assert:
            - "each RentalLine.final_charge_cents == 100005 (5 days -> 50005 time + 50000 demob)"
            - "invoice_total_cents == 186010 (2 x round_half_up(100005 * 0.93) = 2 x 93005)"
            - "sum-then-round order would yield 186009 — pinned order produces 186010"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (contract cycle/revert vs unit fleet cycle)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: contract_quote_revise_cycle
        grounds:
          - state_machines.RentalContract.QUOTED_to_DRAFT
          - state_machines.RentalContract.DRAFT_to_QUOTED
          - state_machines.RentalContract.QUOTED_to_CONFIRMED
        distinguishing_aspect: |
          RentalContract exhibits a revert cycle DRAFT -> QUOTED -> DRAFT ->
          QUOTED -> CONFIRMED: after revise, line editing reopens and a second
          quote recomputes (95000 with one line, then 110000 after adding a kit
          line); distinct from the EquipmentUnit fleet cycle instance.
        test_recipe:
          setup:
            - "Customer C1, Site S1 (TX-TCEQ), Unit U1 (200 kW, rates 12000/60000/200000, demob 35000), Kit K (400 A, rates 3000/15000/50000)"
            - "Contract K1 DRAFT, window 2026-09-01..2026-09-08, load 160 CONTINUOUS -> sized 200"
          setup_api_calls:
            - call: "POST /power-rental/customers"
              payload: { name: "Acme Construction", billing_email: "ap@acme.example" }
              as: SalesEngineer
              captures: { cust_id: $.data.id }
            - call: "POST /power-rental/sites"
              payload: { customer_id: "${cust_id}", name: "Houston Yard", jurisdiction_code: "TX-TCEQ", fuel_tank_capacity_liters: 5000 }
              as: SalesEngineer
              captures: { site_id: $.data.id }
            - call: "POST /power-rental/equipment-units"
              payload: { unit_type: "GENERATOR", capacity_kw: 200, fuel_type: "DIESEL", emissions_tier: "TIER_4F", nox_g_per_kwh: 3.0, day_rate_cents: 12000, week_rate_cents: 60000, month_rate_cents: 200000, demob_fee_cents: 35000, home_depot_code: "DAL-01" }
              as: DepotManager
              captures: { unit_id: $.data.id }
            - call: "POST /power-rental/accessory-kits"
              payload: { kit_code: "CABLE-400A", description: "400A cable + distro kit", max_ampacity_a: 400, day_rate_cents: 3000, week_rate_cents: 15000, month_rate_cents: 50000 }
              as: DepotManager
              captures: { kit_id: $.data.id }
            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 160 } ], start_date: "2026-09-01T00:00:00Z", expected_offhire_date: "2026-09-08T00:00:00Z" }
              as: SalesEngineer
              captures: { con_id: $.data.id }
            - call: "POST /power-rental/rental-contracts/${con_id}/size-load"
              payload: { sizing_method: "NAMEPLATE_SUM" }
              as: SalesEngineer
              captures: { con_v: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/lines"
              payload: { line_type: "EQUIPMENT", equipment_unit_id: "${unit_id}", expected_rental_contract_version: "${con_v}" }
              as: SalesEngineer
            - call: "POST /power-rental/rental-contracts/${con_id}/quote"
              payload: {}
              as: SalesEngineer
              captures: { q1: $.data.quoted_total_cents }
          trigger:
            - call: "POST /power-rental/rental-contracts/${con_id}/revise"
              payload: {}
              as: SalesEngineer
              captures: { st_revise: $.data.status, con_v5: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/lines"
              payload: { line_type: "ACCESSORY_KIT", accessory_kit_id: "${kit_id}", quantity: 1, expected_rental_contract_version: "${con_v5}" }
              as: SalesEngineer
              captures: { line2: $.data.id }
            - call: "POST /power-rental/rental-contracts/${con_id}/quote"
              payload: {}
              as: SalesEngineer
              captures: { q2: $.data.quoted_total_cents, con_v7: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/confirm"
              payload: { expected_rental_contract_version: "${con_v7}" }
              as: SalesEngineer
              captures: { st_final: $.data.status }
          assert:
            - "first quote quoted_total_cents == 95000 (equipment-only)"
            - "revise response status == DRAFT (revert branch taken)"
            - "line add after revise succeeds with 201 (editing reopened)"
            - "second quote quoted_total_cents == 110000 (equipment 60000+35000 + kit 15000)"
            - "confirm response status == CONFIRMED"

      - name: equipment_unit_fleet_cycle
        grounds:
          - state_machines.EquipmentUnit.AVAILABLE_to_RESERVED
          - state_machines.EquipmentUnit.OFF_RENT_to_MAINTENANCE
          - state_machines.EquipmentUnit.MAINTENANCE_to_AVAILABLE
        distinguishing_aspect: |
          EquipmentUnit cycles AVAILABLE -> RESERVED -> DEPLOYED -> OFF_RENT ->
          MAINTENANCE -> AVAILABLE, returning to its initial state — a fleet
          cycle on a different entity than the RentalContract quote/revise loop.
        test_recipe:
          setup:
            - "Customer C1, Site S1 (TX-TCEQ), Unit U1 (200 kW, rates 12000/60000/200000, demob 35000)"
            - "Contract K1 (window 2026-09-01..2026-09-08, load 160 -> sized 200) driven to ON_RENT with U1 DEPLOYED; clock at 2026-09-04"
          setup_api_calls:
            - call: "POST /power-rental/customers"
              payload: { name: "Acme Construction", billing_email: "ap@acme.example" }
              as: SalesEngineer
              captures: { cust_id: $.data.id }
            - call: "POST /power-rental/sites"
              payload: { customer_id: "${cust_id}", name: "Houston Yard", jurisdiction_code: "TX-TCEQ", fuel_tank_capacity_liters: 5000 }
              as: SalesEngineer
              captures: { site_id: $.data.id }
            - call: "POST /power-rental/equipment-units"
              payload: { unit_type: "GENERATOR", capacity_kw: 200, fuel_type: "DIESEL", emissions_tier: "TIER_4F", nox_g_per_kwh: 3.0, day_rate_cents: 12000, week_rate_cents: 60000, month_rate_cents: 200000, demob_fee_cents: 35000, home_depot_code: "DAL-01" }
              as: DepotManager
              captures: { unit_id: $.data.id }
            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 160 } ], start_date: "2026-09-01T00:00:00Z", expected_offhire_date: "2026-09-08T00:00:00Z" }
              as: SalesEngineer
              captures: { con_id: $.data.id }
            - call: "POST /power-rental/rental-contracts/${con_id}/size-load"
              payload: { sizing_method: "NAMEPLATE_SUM" }
              as: SalesEngineer
              captures: { con_v: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/lines"
              payload: { line_type: "EQUIPMENT", equipment_unit_id: "${unit_id}", expected_rental_contract_version: "${con_v}" }
              as: SalesEngineer
              captures: { line_id: $.data.id }
            - call: "GET /power-rental/equipment-units/${unit_id}"
              payload: {}
              as: DepotManager
              captures: { st_reserved: $.data.status }
            - call: "POST /power-rental/rental-contracts/${con_id}/quote"
