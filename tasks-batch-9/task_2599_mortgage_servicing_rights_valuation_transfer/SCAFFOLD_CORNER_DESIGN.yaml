              payload: {}
              as: PlatformAdmin
              as_user_id: admin-001
              captures: { e_hp: "$.data.error_id" }
          assert:
            - "every call returns 404 with the error envelope shape {meta, response_type: error, data: {error_id, message}}"
            - "${e_cp} == ERR_COUNTERPARTY_NOT_FOUND, ${e_loan} == ERR_LOAN_NOT_FOUND, ${e_as} == ERR_ASSUMPTION_SET_NOT_FOUND, ${e_curve} == ERR_RATE_CURVE_NOT_FOUND"
            - "${e_vr} == ERR_VALUATION_RUN_NOT_FOUND, ${e_bp} == ERR_BID_PACKAGE_NOT_FOUND, ${e_tl} == ERR_TAPE_LINE_NOT_FOUND, ${e_bid} == ERR_BID_NOT_FOUND"
            - "${e_pa} == ERR_PURCHASE_AGREEMENT_NOT_FOUND, ${e_ar} == ERR_APPROVAL_REQUEST_NOT_FOUND, ${e_st} == ERR_SERVICING_TRANSFER_NOT_FOUND, ${e_case} == ERR_ERROR_CASE_NOT_FOUND, ${e_hp} == ERR_HEDGE_POSITION_NOT_FOUND"
            - "the same discrimination applies to body-side references at priority 5: a valuation run with an unknown assumption_set_id reports ERR_ASSUMPTION_SET_NOT_FOUND, and an award with an unknown winning_bid_id reports ERR_BID_NOT_FOUND"
            - "the path check at priority 4 runs before the body check at priority 5: an unknown portfolio id AND an unknown assumption_set_id together report ERR_PORTFOLIO_NOT_FOUND"

