            - call: "POST /releases"
              payload: { sku_id: "${sku_id}", allocated_quantity: 3, release_price_cents: 20000, entry_opens_at: "2026-07-07T06:00:00Z", entry_closes_at: "2026-07-08T00:00:00Z", purchase_opens_at: "2026-07-08T01:00:00Z", purchase_closes_at: "2026-07-09T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_RELEASE_WINDOW_OVERLAP"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: money_conserved_across_verify_then_refund
        grounds:
          - state_machines.Order.SHIPPED_TO_BUYER_to_VERIFIED
          - state_machines.Dispute.OPEN_to_RESOLVED_REFUND
          - entities.Account.fields.balance_cents
        distinguishing_aspect: "Conserved quantity = seller ledger money: verify credits 27300 and the compensating REFUND debits 27300, so seller.balance_cents returns to its exact pre-verify value 0 (no drift)."
        test_recipe:
          setup:
            - "A verified FIXED order that was verified (seller credited 27300) with an OPEN INAUTHENTIC dispute filed within the window."
          setup_api_calls:
            - call: "POST /skus"
              payload: { style_code: "KK1234-011", name: "AJ16", brand: "Nike", retail_price_cents: 20000 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "seller15@x.com", full_name: "Seller Fifteen" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /accounts/${seller_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "buyer15@x.com", full_name: "Buyer Fifteen" }
              as: PlatformAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /accounts/${buyer_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { sku_id: "${sku_id}", seller_account_id: "${seller_id}", size: "10", condition: "DEADSTOCK", pricing_mode: "FIXED", ask_price_cents: 30000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/buy"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { order_id: $.data.id }
            - call: "POST /authenticators"
              payload: { name: "Auth I", location_code: "NJ6" }
              as: PlatformAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /consignment-items"
              payload: { order_id: "${order_id}", seller_account_id: "${seller_id}", sku_id: "${sku_id}", declared_condition_grade: "DEADSTOCK", declared_box_grade: "PERFECT", declared_accessories_complete: true }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { ci_id: $.data.id }
            - call: "POST /consignment-items/${ci_id}/receive"
              payload: {}
              as: Authenticator
              as_user_id: "${auth_id}"
            - call: "POST /consignment-items/${ci_id}/schedule-inspection"
              payload: { authenticator_id: "${auth_id}", inspection_window_start: "2026-07-01T15:00:00Z", inspection_window_end: "2026-07-01T15:30:00Z" }
              as: Authenticator
              as_user_id: "${auth_id}"
            - call: "POST /consignment-items/${ci_id}/complete-inspection"
              payload: { inspection_result: "PASS", authenticated_condition_grade: "DEADSTOCK", authenticated_box_grade: "PERFECT", authenticated_accessories_complete: true }
              as: Authenticator
              as_user_id: "${auth_id}"
            - call: "POST /orders/${order_id}/ship-to-buyer"
              payload: {}
              as: PlatformAdmin
            - call: "POST /orders/${order_id}/verify"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
            - call: "POST /disputes"
              payload: { order_id: "${order_id}", filed_by_account_id: "${buyer_id}", reason: "INAUTHENTIC" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { dispute_id: $.data.id }
          trigger:
            - call: "POST /disputes/${dispute_id}/resolve"
              payload: { outcome: "REFUND", resolution_note: "counterfeit confirmed" }
              as: CustomerService
          assert:
            - "Account.${seller_id}.balance_cents == 0"
            - "Order.${order_id}.payment_status == REFUNDED"

      - name: allocation_units_conserved_across_claim_and_expiry
        grounds:
          - state_machines.RaffleEntry.WON_to_WON
          - state_machines.Release.DRAWN_to_SETTLED
          - entities.Release.fields.available_units
        distinguishing_aspect: "Conserved quantity = release allocation units: allocated_quantity(2) == available_units + reserved_units + sold_units holds after a claim (reserved->sold) and after settle (unclaimed reserved->available): 1 + 0 + 1 == 2."
        test_recipe:
          setup:
            - "A release allocated 2 with two verified winners after the draw; one claims (sold 1, reserved 1); clock advanced past purchase_closes_at."
          setup_api_calls:
            - call: "POST /skus"
              payload: { style_code: "LL2345-012", name: "AJ17", brand: "Nike", retail_price_cents: 20000, release_category: "LIMITED" }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "w1@x.com", full_name: "Winner One" }
              as: PlatformAdmin
              captures: { w1_id: $.data.id }
            - call: "POST /accounts/${w1_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "w2@x.com", full_name: "Winner Two" }
              as: PlatformAdmin
              captures: { w2_id: $.data.id }
            - call: "POST /accounts/${w2_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /releases"
              payload: { sku_id: "${sku_id}", allocated_quantity: 2, release_price_cents: 20000, entry_opens_at: "2026-07-05T00:00:00Z", entry_closes_at: "2026-07-06T00:00:00Z", purchase_opens_at: "2026-07-06T01:00:00Z", purchase_closes_at: "2026-07-07T00:00:00Z" }
              as: PlatformAdmin
              captures: { release_id: $.data.id, release_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /releases/${release_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /releases/${release_id}/enter"
              payload: {}
              as: Buyer
              as_user_id: "${w1_id}"
              captures: { entry1_id: $.data.id }
            - call: "POST /releases/${release_id}/enter"
              payload: {}
              as: Buyer
              as_user_id: "${w2_id}"
              captures: { entry2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /releases/${release_id}/draw"
              payload: { expected_release_version: "${release_v}" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-06T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /raffle-entries/${entry1_id}/claim"
              payload: {}
              as: Buyer
              as_user_id: "${w1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-07T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /releases/${release_id}/settle"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Release.${release_id}.sold_units == 1"
            - "Release.${release_id}.reserved_units == 0"
            - "Release.${release_id}.available_units == 1"
