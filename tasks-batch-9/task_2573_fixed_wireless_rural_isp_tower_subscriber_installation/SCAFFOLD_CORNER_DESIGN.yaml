      - name: outage_credit_rounds_uptime_and_shortfall_to_three_decimals
        claim_type: precision
        grounds:
          - calculations.outage_credit_amount
          - entities.OutageCredit.fields.measured_uptime_pct
          - entities.OutageCredit.fields.shortfall_pct
          - entities.OutageCredit.fields.credit_cents
        distinguishing_aspect: |
          A 1269-minute outage gives 100 * (43200 - 1269) / 43200 = 97.0625%, which must round
          HALF-UP to exactly 97.063 (not truncate to 97.062); the shortfall is then 99.5 - 97.063 =
          2.437 and the credit is round_half_up(6999 * 2.437 / 100 * 10) = 1706 cents, well under the
          floor(6999 * 0.5) = 3499 cap. Truncating the uptime would yield shortfall 2.438 and a
          1707-cent credit.
