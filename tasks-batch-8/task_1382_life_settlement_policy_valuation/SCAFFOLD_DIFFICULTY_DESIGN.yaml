      - name: accept_missing_disclosures_rejected_before_commission_cap
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - state_machines.Offer.PENDING_to_ACCEPTED
        distinguishing_aspect: |
          Category pair (business_safety, business_fiscal): accept with
          disclosures undelivered AND broker_commission_bps 700 (over the 600 cap)
          returns ERR_DISCLOSURES_INCOMPLETE (priority 8 safety), never
          ERR_COMMISSION_CAP_EXCEEDED (priority 12 fiscal).
