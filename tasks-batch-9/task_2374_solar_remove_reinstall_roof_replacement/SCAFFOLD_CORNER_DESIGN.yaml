            - "DeckFinding.${f1}.requires_repermit == false"
            - "DeckFinding.${f2}.requires_repermit == false"
            - "ReroofProject.${p1}.scoped_upgrade_cost_cents == 236640"
            - "ReroofProject.${p1}.posture == FROZEN"

      - name: corner_final_credit_counts_only_weather_aborted_windows_and_ignores_completed_superseded_and_scheduled_ones
        claim_type: input_set_filtering
        grounds:
          - calculations.downtime_production_loss_credit.input_set
          - calculations.downtime_production_loss_credit.constants.WEATHER_ABORTED_DAY_FACTOR
          - state_machines.ReroofProject.transitions["COMMISSIONED -> CLOSED"].side_effects
        distinguishing_aspect: "Four windows cover three of the four downtime dates but only the WEATHER_ABORTED one halves its day. The downtime span is 2026-08-05..2026-08-08 (four dates). At 41.75 kWh and 14 cents under the LEASE factor 1.00 a full day is round_half_up(584.5) = 585 and a halved day is round_half_up(292.25) = 292, so the final credit is 585 + 292 + 585 + 585 = 2047 - lower than the 2338 provisional reservation, which forces a 291-cent release rather than a top-up. A COMPLETED window on 08-07, a SUPERSEDED window on 08-05 and a SCHEDULED window on 08-07 must all be ignored."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, moved to 2026-08-05T08:00:00Z for de-energization and to 2026-08-08T16:00:00Z for reinstall and re-energization."
            - "A LEASE project (three consents, ownership factor 1.00, baseline 41.75 kWh, 4 estimated downtime days -> provisional round_half_up(41.75 * 4 * 14) = 2338) runs one circuit and one panel through the full remove-and-reinstall, filing the manufacturer warranty notice because a leased system may not be reinstalled while the notice is PENDING."
            - "All four windows are created after commissioning so that the second weather abort cannot restrict the project before re-energization; settlement has no posture gate."
            - "W_abort covers 2026-08-06 and stays WEATHER_ABORTED. W_done covers 2026-08-07 and is driven to COMPLETED. W_super covers 2026-08-05, is aborted and then rescheduled to 2026-08-20, so it ends SUPERSEDED and its replacement lies outside the span. W_sched covers 2026-08-07 and stays SCHEDULED."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
