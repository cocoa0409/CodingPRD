              as: MerchandiseBuyer
              captures: { i9501_id: $.data.id }
            - call: "POST /merchandise/items/${i9501_id}/price-assignments"
              payload: { price_point_id: "${pp125_id}" }
              as: MerchandiseBuyer
            - call: "POST /merchandise/containers"
