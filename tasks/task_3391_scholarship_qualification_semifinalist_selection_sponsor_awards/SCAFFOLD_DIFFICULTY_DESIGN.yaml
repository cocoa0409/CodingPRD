              as: ProgramAdmin
              captures: { sp: $.data.id }
            - call: "POST /api/corporate-sponsors/${sp}/agreements"
              payload: { cycle_id: "${cyc}", award_amount_cents: 250000, max_awards: 2, pool_total_cents: 500000, effective_start_date: "2027-01-01", effective_end_date: "2027-06-30" }
              as: SponsorAdmin
              as_user_id: "${sp}"
              captures: { a1: $.data.id }
          trigger:
