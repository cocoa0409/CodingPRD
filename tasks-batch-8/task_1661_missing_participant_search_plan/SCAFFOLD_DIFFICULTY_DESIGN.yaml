            - "No PBGCTransfer row exists for Participant.${p_sg} afterwards"

  - rule_id: resource_temporal_overlap
    instances:
      - name: blackout_half_open_overlap
        grounds:
          - validations[priority=9]
          - errors[ERR_BLACKOUT_WINDOW_OVERLAP]
          - entities.BlackoutPeriod.fields.start_at
        distinguishing_aspect: |
          Resource = the case's blackout schedule; semantics = half-open
          intervals [start_at, end_at) with adjacency allowed: a blackout
          starting exactly at another's end is accepted, while one overlapping
          by a single day is rejected with ERR_BLACKOUT_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Case in DRAFT; blackout A [2026-09-01, 2026-09-10) created."
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Overlap Co 401k", sponsor_ein: "123456789", plan_number: "090", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_o: "$.data.id" } }
            - { call: "POST /blackout-periods", payload: { termination_case_id: "${c_o}", start_at: "2026-09-01T00:00:00Z", end_at: "2026-09-10T00:00:00Z", outgoing_recordkeeper: "OldRK", incoming_recordkeeper: "NewRK" }, as: PlanAdministrator, captures: { b_oa: "$.data.id" } }
          trigger:
            - { call: "POST /blackout-periods", payload: { termination_case_id: "${c_o}", start_at: "2026-09-10T00:00:00Z", end_at: "2026-09-15T00:00:00Z", outgoing_recordkeeper: "NewRK", incoming_recordkeeper: "NewerRK" }, as: PlanAdministrator, captures: { b_ob: "$.data.id" } }
            - { call: "POST /blackout-periods", payload: { termination_case_id: "${c_o}", start_at: "2026-09-09T00:00:00Z", end_at: "2026-09-12T00:00:00Z", outgoing_recordkeeper: "RKX", incoming_recordkeeper: "RKY" }, as: PlanAdministrator, captures: { err_ov: "$.data.error_id" } }
          assert:
            - "Blackout B [2026-09-10, 2026-09-15) created successfully (adjacency at exactly A.end_at is allowed under half-open semantics)"
            - "Blackout C [2026-09-09, 2026-09-12) rejected: error_id == ERR_BLACKOUT_WINDOW_OVERLAP, http status == 409 (intersects both A's tail and B's head)"
            - "Exactly two BlackoutPeriod rows exist for TerminationCase.${c_o} afterwards"

      - name: certified_mail_trailing_buffer
        grounds:
          - validations[priority=10]
          - errors[ERR_CERTIFIED_MAIL_WINDOW_ACTIVE]
          - state_machines.MissingSearchCase
        distinguishing_aspect: |
          Resource = the search case's certified-mail channel; semantics = a
          fixed 15-day TRAILING BUFFER occupation [attempted_at, attempted_at +
          15 days) — different interval geometry than the sibling's adjacency-
          allowed half-open windows: a second certified-mail attempt at day +10
          collides, while one at exactly day +15 lands outside the buffer.
        test_recipe:
          setup:
            - "Case (DRAFT suffices for the search lifecycle) with one participant declared MISSING; search case escalated to STEP4_CERTIFIED_MAIL; first CERTIFIED_MAIL attempt recorded with attempted_at 2026-11-04T00:00:00Z."
