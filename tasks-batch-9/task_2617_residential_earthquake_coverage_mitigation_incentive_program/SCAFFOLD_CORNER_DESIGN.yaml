            - "${early_exp_err} == \"ERR_OFFER_STILL_VALID\" with HTTP 409 - the clock has not reached expires_at"
            - "${off_1_status} == \"ACCEPTED\" and ${twice_err} == \"ERR_OFFER_ALREADY_RESPONDED\" with HTTP 409"
            - "${dup_pol_err} == \"ERR_DUPLICATE_ACTIVE_POLICY\" with HTTP 409 - the first quote is still QUOTED, which already occupies the dwelling"
            - "${late_err} == \"ERR_OFFER_EXPIRED\" with HTTP 409 at 2026-10-01, and the same instant makes ${off_2_status} == \"EXPIRED\" legal"
            - "${ins_status} == \"WITHDRAWN\" and ${withdrawn_err} == \"ERR_INSURER_WITHDRAWN\" with HTTP 409 - no new business through a withdrawn insurer"

