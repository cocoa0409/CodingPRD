          setup:
            - "School DEL32 with one RN and one ENROLLED student; one ActionPlan already pushed twice around DRAFT -> PENDING_GUARDIAN -> PENDING_PROVIDER -> DRAFT, so revision_round is 2 and the plan sits at PENDING_PROVIDER with guardian_consent_at set for the third time."
