              captures: { cust_id: $.data.id }
            - call: "POST /sop/promotions"
              payload: { item_id: "${item_id}", customer_id: "${cust_id}", start_month: "2026-09", end_month: "2026-09", lift_pct: 10, cannibalization_pct: 2 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { promo_id: $.data.id }
            - call: "POST /sop/promotions/${promo_id}/approve"
              payload: {}
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-IMMEDIATE", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_id: $.data.id, fc_v0: $.data.version, base_units: $.data.baseline_units }
          trigger:
            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_id}", adjustment_type: "PROMOTION", delta_units: 0, rationale: "approved september promotion", promotion_id: "${promo_id}", expected_demand_forecast_version: "${fc_v0}" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { adj_id: $.data.id, applied_on_create: $.data.applied_delta_units }
            - call: "GET /sop/demand-forecasts/${fc_id}"
              payload: {}
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { units_before_endorse: $.data.consensus_units, status_before: $.data.status }
            - call: "POST /sop/consensus-adjustments/${adj_id}/reviews"
              payload: { decision: "ENDORSE" }
              as: DemandReviewLead
              as_user_id: "lead-1"
              captures: { applied_on_endorse: $.data.applied_delta_units, adj_status: $.data.status }
            - call: "GET /sop/demand-forecasts/${fc_id}"
              payload: {}
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { units_after: $.data.consensus_units, endorsed_count: $.data.endorsed_adjustment_count }
          assert:
            - "${base_units} == 1000 and ${applied_on_create} == 80 == round_half_up(1000 * 10 / 100) - round_half_up(1000 * 2 / 100) — the derived delta is present in the CREATE response itself, not deferred"
            - "${status_before} == \"UNDER_CONSENSUS\" and ${units_before_endorse} == 1000 — a merely PROPOSED adjustment does not yet move consensus"
            - "${applied_on_endorse} == 80 and ${adj_status} == \"COMMITTED\" in the endorsement's own response body"
            - "${units_after} == 1080 and ${endorsed_count} == 1 on the very next read, with no write in between and no second read required"
            - "GET /sop/consensus-adjustments/${adj_id} reports delta_units 0 alongside applied_delta_units 80 — the promotion-derived value never overwrites the request field"

      - name: supply_plan_create_makes_the_cycle_money_visible_on_the_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /sop/supply-plans]
          - calculations.calc_cycle_financials
          - calculations.calc_cycle_posture
        distinguishing_aspect: |
          The plan create's declared side effect re-runs the cycle's financials and posture in the
          same request, so the immediately following read must already show plan_value_cents
          900000, gross_gap_cents 1100000, constrained_plan_count 1 and posture AT_RISK. An
          implementation that recomputes lazily on the next cycle transition would still report
          the pre-plan zeros here.
        test_recipe:
          setup:
            - "The base family, one MATURE item (95.0 / 0.20 / 30, safety_stock 330) and one customer; a 9 h block inside 2026-09 (900 units)."
            - "A cycle over 2026-09..2026-09 with financial_commitment_cents 2000000 and one 1000-unit forecast, advanced to SUPPLY_REVIEW; no plan exists yet."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/capacity-blocks"
              payload: { family_id: "${fam_id}", start_date: "2026-09-01", end_date: "2026-09-30", available_hours: 9 }
              as: SupplyPlanner
              as_user_id: "supply-1"
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-VISIBLE", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 2000000, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
              captures: { pv_before: $.data.plan_value_cents, gap_before: $.data.gross_gap_cents, count_before: $.data.constrained_plan_count, posture_before: $.data.posture }
          trigger:
            - call: "POST /sop/supply-plans"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}" }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { plan_id: $.data.id, constrained: $.data.constrained_units, ctype: $.data.constraint_type }
            - call: "GET /sop/planning-cycles/${cycle_id}"
              payload: {}
              as: ExecutiveSponsor
              as_user_id: "exec-1"
              captures: { pv_after: $.data.plan_value_cents, gap_after: $.data.gross_gap_cents, residual_after: $.data.residual_gap_cents, count_after: $.data.constrained_plan_count, posture_after: $.data.posture }
          assert:
            - "${pv_before} == 0, ${gap_before} == 2000000, ${count_before} == 0 and ${posture_before} == \"AT_RISK\" — the cycle-advance response already reflects an empty plan set"
            - "${constrained} == 900 and ${ctype} == \"CAPACITY\" for ${plan_id}"
            - "${pv_after} == 900000 == 900 * 1000, ${gap_after} == 1100000, ${residual_after} == 1100000 and ${count_after} == 1 on the FIRST read after the create"
            - "${posture_after} == \"AT_RISK\" — recomputed in the same request as the plan create, not deferred to the next transition"
            - "No further write occurs between the create and the read, so a second identical read must return exactly the same five values"
