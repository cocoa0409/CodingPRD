            - "affected_3 == 3 after one expand call and lots_after == [L-1, L-2, L-3]"
            - "camp_v_after == 3 — the expand is a single write, not one write per lot code"
            - "that listing returns total_count 3 with affected_first == RECALL_AFFECTED, so both new installations moved INSTALLED -> RECALL_AFFECTED in the same call"
            - "lot3_status == QUARANTINED with lot3_q == 9 and lot3_avail == 0 (10 received, 1 installed, the remaining 9 frozen)"
            - "UnitBuild.${build_id}.recall_hold is true and it was already true before the expand — the flag is idempotent under the second and third label"

      - name: warranty_claims_are_reachable_from_dealer_build_and_lot
        claim_type: cross_reference_link
        grounds:
          - endpoints["GET /warranty-claims"]
          - entities.WarrantyClaim.fields.component_lot_id
        distinguishing_aspect: "The same claim set is navigable from three different anchors, and the dealer-scoped listing narrows it a fourth way: a DealerPrincipal sees only its own rows without passing any filter."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; supplier SUP-C with lot L-1; dealers D-A and D-B, each with one delivered unit; D-A files two claims (one of them naming L-1) and D-B files one."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { supplier_code: "SUP-C", name: "Cascade Components", component_categories: ["APPLIANCE"] }
              as: PlantAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_id}", part_number: "PN-FRIDGE", lot_code: "L-1", category: "APPLIANCE", quantity_received: 10 }
              as: PlantAdmin
              captures: { lot_1: $.data.id }
            - call: "POST /floor-plans"
              payload: { model_code: "FP-TOW", chassis_class: "TOWABLE", length_ft: 28, base_msrp_cents: 8000000, base_station_hours: 40.00, base_dry_weight_lbs: 6000, gvwr_lbs: 9000, required_wheelbase_in: 180, electrical_service_amps: 50, fresh_water_capacity_gal: 60 }
              as: PlantAdmin
              captures: { fp_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-A", region: "CENTRAL", allocation_share_bp: 1500, floor_plan_credit_limit_cents: 100000000, goodwill_budget_cents: 500000 }
              as: PlantAdmin
              captures: { dlr_a: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-B", region: "EAST", allocation_share_bp: 1500, floor_plan_credit_limit_cents: 100000000, goodwill_budget_cents: 500000 }
              as: PlantAdmin
              captures: { dlr_b: $.data.id }
            - call: "POST /_inject/delivered-unit"
              payload: { dealer_id: "${dlr_a}", floor_plan_id: "${fp_id}" }
              as: PlantAdmin
              captures: { build_a1: $.data.id }
            - call: "POST /_inject/delivered-unit"
              payload: { dealer_id: "${dlr_a}", floor_plan_id: "${fp_id}" }
              as: PlantAdmin
              captures: { build_a2: $.data.id }
            - call: "POST /_inject/delivered-unit"
              payload: { dealer_id: "${dlr_b}", floor_plan_id: "${fp_id}" }
              as: PlantAdmin
              captures: { build_b1: $.data.id }
            - call: "POST /warranty-claims"
              payload: { unit_build_id: "${build_a1}", claim_type: "APPLIANCE", labor_hours: 2.00, parts_cost_cents: 0, narrative: "refrigerator cooling fault", component_lot_id: "${lot_1}" }
              as: DealerPrincipal
              as_user_id: "${dlr_a}"
              captures: { claim_a1: $.data.id }
            - call: "POST /warranty-claims"
              payload: { unit_build_id: "${build_a2}", claim_type: "ELECTRICAL", labor_hours: 1.00, parts_cost_cents: 0, narrative: "converter fan noise" }
              as: DealerPrincipal
              as_user_id: "${dlr_a}"
              captures: { claim_a2: $.data.id }
            - call: "POST /warranty-claims"
              payload: { unit_build_id: "${build_b1}", claim_type: "PLUMBING", labor_hours: 1.50, parts_cost_cents: 0, narrative: "grey tank valve leak" }
              as: DealerPrincipal
              as_user_id: "${dlr_b}"
              captures: { claim_b1: $.data.id }
          trigger:
            - call: "GET /warranty-claims?dealer_id=${dlr_a}"
              payload: {}
              as: WarrantyAdministrator
              as_user_id: "WA-1"
              captures: { by_dealer_first: "$.data[0].id" }
            - call: "GET /warranty-claims?unit_build_id=${build_a1}"
              payload: {}
              as: WarrantyAdministrator
              as_user_id: "WA-1"
              captures: { by_build_first: "$.data[0].id" }
            - call: "GET /warranty-claims?component_lot_id=${lot_1}"
              payload: {}
              as: WarrantyAdministrator
              as_user_id: "WA-1"
              captures: { by_lot_first: "$.data[0].id" }
            - call: "GET /warranty-claims"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_b}"
              captures: { as_b_first: "$.data[0].id" }
          assert:
            - "the dealer-filtered call returns total_count 2 with by_dealer_first == ${claim_a1} — claim_a1 and claim_a2, never claim_b1"
            - "the build-filtered call returns total_count 1 with by_build_first == ${claim_a1}"
            - "the lot-filtered call returns total_count 1 with by_lot_first == ${claim_a1}: the optional lot link is what makes supplier chargeback traceable"
            - "the unfiltered call as dealer B returns total_count 1 with as_b_first == ${claim_b1} — no filter was supplied, yet a DealerPrincipal sees only its own claims"
            - "GET /warranty-claims as WarrantyAdministrator with no filter returns total_count 3"

      - name: supplier_scorecard_is_a_computed_read_of_both_variants
        claim_type: computed_read
        grounds:
          - endpoints["GET /suppliers/{id}/scorecard"]
          - calculations.supplier_quality_score.variants
        distinguishing_aspect: "The scorecard stores nothing of its own: it recomputes both windowing variants at the current clock, persists the rolling result onto the Supplier, and the derived supplier_status crosses from ACTIVE to PROBATION purely because a third campaign was opened."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; supplier SUP-C and three campaigns whose lot codes match no lot, so nothing is quarantined and the campaigns exist only as penalty events."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { supplier_code: "SUP-C", name: "Cascade Components", component_categories: ["APPLIANCE"] }
              as: PlantAdmin
              captures: { sup_id: $.data.id, score_at_create: $.data.quality_score, status_at_create: $.data.supplier_status }
            - call: "POST /recall-campaigns"
              payload: { supplier_id: "${sup_id}", campaign_code: "RC-1", part_number: "PN-NONE", lot_codes: ["NOSUCHLOT-1"], severity: "COMPLIANCE" }
              as: RecallCoordinator
              captures: { camp_1: $.data.id }
            - call: "POST /recall-campaigns"
              payload: { supplier_id: "${sup_id}", campaign_code: "RC-2", part_number: "PN-NONE", lot_codes: ["NOSUCHLOT-2"], severity: "SAFETY" }
              as: RecallCoordinator
              captures: { camp_2: $.data.id }
            - call: "POST /recall-campaigns"
              payload: { supplier_id: "${sup_id}", campaign_code: "RC-3", part_number: "PN-NONE", lot_codes: ["NOSUCHLOT-3"], severity: "SAFETY" }
              as: RecallCoordinator
              captures: { camp_3: $.data.id }
          trigger:
            - call: "GET /suppliers/${sup_id}/scorecard"
              payload: {}
              as: PlantAdmin
              captures: { r0: $.data.rolling_quality_score, l0: $.data.lifetime_quality_score, s0: $.data.supplier_status, open0: $.data.open_recall_count, ev0: $.data.penalty_event_count }
            - call: "POST /recall-campaigns/${camp_1}/open"
              payload: {}
              as: RecallCoordinator
            - call: "POST /recall-campaigns/${camp_2}/open"
              payload: {}
              as: RecallCoordinator
            - call: "GET /suppliers/${sup_id}/scorecard"
              payload: {}
              as: PlantAdmin
              captures: { r2: $.data.rolling_quality_score, l2: $.data.lifetime_quality_score, s2: $.data.supplier_status, open2: $.data.open_recall_count, ev2: $.data.penalty_event_count }
            - call: "POST /recall-campaigns/${camp_3}/open"
              payload: {}
              as: RecallCoordinator
            - call: "GET /suppliers/${sup_id}/scorecard"
              payload: {}
              as: PlantAdmin
              captures: { r3: $.data.rolling_quality_score, l3: $.data.lifetime_quality_score, s3: $.data.supplier_status, open3: $.data.open_recall_count }
            - call: "POST /recall-campaigns/${camp_1}/close"
              payload: {}
              as: RecallCoordinator
              captures: { camp1_status: $.data.status }
            - call: "GET /suppliers/${sup_id}"
              payload: {}
              as: PlantAdmin
              captures: { stored_score: $.data.quality_score, stored_status: $.data.supplier_status, stored_open: $.data.open_recall_count }
          assert:
            - "score_at_create == 100.00 and status_at_create == ACTIVE"
            - "r0 == 100.00, l0 == 100.00, s0 == ACTIVE, open0 == 0 and ev0 == 0 — a DRAFT campaign has no opened_at and is not a penalty event"
            - "r2 == 75.00 (COMPLIANCE 10.0 + SAFETY 15.0), l2 == 75.00 (both events are inside the 90-day window), s2 == ACTIVE and open2 == 2 with ev2 == 2"
            - "r3 == 60.00 and l3 == 60.00 with s3 == PROBATION (60.00 is below SUPPLIER_ACTIVE_MIN_SCORE 70.00 and at or above 50.00) and open3 == 3"
            - "camp1_status == CLOSED — a campaign with affected_installation_count 0 is closeable at once"
            - "stored_score == 60.00 and stored_status == PROBATION: the scorecard read persisted the rolling variant onto the Supplier"
            - "stored_open == 2 while the score is unchanged at 60.00 — closing a campaign removes it from open_recall_count but never from the penalty set"

      - name: warranty_info_requests_are_a_conditional_action_capped_at_two
        claim_type: conditional_action
        grounds:
          - endpoints["POST /warranty-claims/{id}/request-info"]
          - errors.ERR_INFO_REQUEST_LIMIT_REACHED
          - errors.ERR_CLAIM_NOT_DECIDABLE
        distinguishing_aspect: "request-info is available only from SUBMITTED and only while info_request_count is below MAX_INFO_REQUESTS 2, and pay is available only from APPROVED — the same endpoints are refused with 409 outside those windows, and a resubmission reprices the claim."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one delivered unit for dealer D-TOW and one SUBMITTED APPLIANCE claim at labor_hours 1.00 with no parts and no goodwill."
          setup_api_calls:
            - call: "POST /floor-plans"
              payload: { model_code: "FP-TOW", chassis_class: "TOWABLE", length_ft: 28, base_msrp_cents: 8000000, base_station_hours: 40.00, base_dry_weight_lbs: 6000, gvwr_lbs: 9000, required_wheelbase_in: 180, electrical_service_amps: 50, fresh_water_capacity_gal: 60 }
              as: PlantAdmin
              captures: { fp_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-TOW", region: "CENTRAL", allocation_share_bp: 1500, floor_plan_credit_limit_cents: 100000000, goodwill_budget_cents: 500000 }
              as: PlantAdmin
              captures: { dlr_id: $.data.id }
            - call: "POST /_inject/delivered-unit"
              payload: { dealer_id: "${dlr_id}", floor_plan_id: "${fp_id}" }
              as: PlantAdmin
              captures: { build_id: $.data.id }
            - call: "POST /warranty-claims"
              payload: { unit_build_id: "${build_id}", claim_type: "APPLIANCE", labor_hours: 1.00, parts_cost_cents: 0, narrative: "range igniter fault" }
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { claim_id: $.data.id, claim_status: $.data.status, ir0: $.data.info_request_count }
          trigger:
            - call: "POST /warranty-claims/${claim_id}/pay"
              payload: {}
              as: WarrantyAdministrator
              as_user_id: "WA-1"
              captures: { e_pay_early: $.data.error_id }
            - call: "POST /warranty-claims/${claim_id}/request-info"
              payload: { info_request_note: "photographs of the burner assembly, please" }
              as: WarrantyAdministrator
              as_user_id: "WA-1"
              captures: { s1: $.data.status, ir1: $.data.info_request_count }
            - call: "POST /warranty-claims/${claim_id}/resubmit"
              payload: { labor_hours: 2.00, narrative: "range igniter fault, photographs attached" }
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { s2: $.data.status, labor2: $.data.labor_hours }
            - call: "POST /warranty-claims/${claim_id}/request-info"
              payload: { info_request_note: "serial plate photograph, please" }
              as: WarrantyAdministrator
              as_user_id: "WA-1"
              captures: { s3: $.data.status, ir2: $.data.info_request_count }
            - call: "POST /warranty-claims/${claim_id}/resubmit"
              payload: { narrative: "range igniter fault, serial plate attached" }
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { s4: $.data.status }
            - call: "POST /warranty-claims/${claim_id}/request-info"
              payload: { info_request_note: "one more thing" }
              as: WarrantyAdministrator
              as_user_id: "WA-1"
              captures: { e_limit: $.data.error_id }
            - call: "POST /warranty-claims/${claim_id}/decide"
              payload: { decision: "APPROVED" }
              as: WarrantyAdministrator
              as_user_id: "WA-1"
              captures: { s5: $.data.status, total5: $.data.total_reimbursement_cents, tier5: $.data.authority_tier }
            - call: "POST /warranty-claims/${claim_id}/decide"
              payload: { decision: "DENIED", denial_reason: "changed my mind" }
              as: WarrantyAdministrator
              as_user_id: "WA-1"
              captures: { e_decide_twice: $.data.error_id }
          assert:
            - "claim_status == SUBMITTED with ir0 == 0"
            - "e_pay_early == ERR_CLAIM_NOT_DECIDABLE with status 409 — pay is conditional on APPROVED"
            - "s1 == INFO_REQUESTED with ir1 == 1, and s2 == SUBMITTED with labor2 == 2.00 after the resubmission"
            - "s3 == INFO_REQUESTED with ir2 == 2 and s4 == SUBMITTED"
            - "e_limit == ERR_INFO_REQUEST_LIMIT_REACHED with status 409 — the third request is refused although the claim is once again SUBMITTED"
            - "s5 == APPROVED with tier5 == TIER_A and total5 == 15600 (2.00 h * 7800, no parts, no goodwill), priced from the resubmitted labour rather than the original 1.00 h"
            - "e_decide_twice == ERR_CLAIM_NOT_DECIDABLE with status 409 and WarrantyClaim.${claim_id}.status is still APPROVED"

