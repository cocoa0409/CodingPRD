scaffold_corner_design:
  - section: entities
    instances:
      - name: program_cycle_creation_makes_state_allocation_children
        claim_type: creation
        grounds: [entities.ProgramCycle, entities.StateAllocation, "endpoints[POST /api/program-cycles]"]
        distinguishing_aspect: "POST /api/program-cycles returns 201 with status SETUP and version 1, and atomically creates one PENDING StateAllocation per state_populations entry with all computed slot fields still null."
        test_recipe:
          setup:
            - "A cycle has been created with two state populations (AA 4500, BB 2500)."
          setup_api_calls:
            - call: "POST /api/program-cycles"
              payload: { name: "CYC-C1", target_graduation_year: 2028, total_semifinalist_slots: 10, national_award_slots: 0, national_award_amount_cents: 250000, confirming_floor: 200, application_deadline: "2027-12-15T00:00:00Z", semifinalist_embargo_until: "2027-09-10T00:00:00Z", finalist_embargo_until: "2028-02-10T00:00:00Z", award_embargo_until: "2028-03-01T00:00:00Z", public_embargo_until: "2028-03-01T00:00:00Z", state_populations: [ { state_code: "AA", graduating_population: 4500 }, { state_code: "BB", graduating_population: 2500 } ] }
              as: ProgramAdmin
              captures: { cyc: $.data.id, cyc_status: $.data.status, cyc_v: $.data.version }
          trigger:
            - call: "GET /api/program-cycles/${cyc}/state-allocations"
              payload: {}
              as: ProgramAdmin
              captures: { aa_status: "$.data[0].status", aa_prov: "$.data[0].slots_provisional", bb_pop: "$.data[1].graduating_population" }
          assert:
            - "create returned 201 with ${cyc_status} == SETUP and ${cyc_v} == 1"
            - "GET state-allocations returns exactly 2 rows sorted state_code ASC: AA (population 4500) then BB (${bb_pop} == 2500)"
            - "both rows: status PENDING (${aa_status} == PENDING), quota_raw/slots_provisional/slots_final/threshold_selection_index null (${aa_prov} is null), selected_count == 0"

      - name: create_student_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.Student.fields.citizenship_status, "errors[ERR_INVALID_REQUEST]", "validations[priority=10]"]
        distinguishing_aspect: "Omitting the required enum field citizenship_status is a 400 ERR_INVALID_REQUEST; the student is not created."
        test_recipe:
          setup:
            - "A school exists."
          setup_api_calls:
            - call: "POST /api/schools"
              payload: { name: "ZZ High", school_code: "ZZ-1", state_code: "ZZ" }
              as: ProgramAdmin
              captures: { sch: $.data.id }
          trigger:
            - call: "POST /api/students"
              payload: { full_name: "No Citizenship", school_id: "${sch}", state_code: "ZZ", graduation_year: 2028, enrollment_status: "ENROLLED_FULL_TIME" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /api/students?school_id=${sch} returns an empty list (nothing persisted)"

      - name: entry_computed_selection_index_input_ignored
        claim_type: computed_fields
        grounds: [entities.Entry.fields.selection_index, calculations.selection_index]
        distinguishing_aspect: "selection_index is server-computed as (reading + writing + math) * 2; a client-supplied selection_index in the score payload is ignored, never trusted."
        test_recipe:
          setup:
            - "Cycle in ENTRY_CLOSED with one SUBMITTED entry."
          setup_api_calls:
            - call: "POST /api/program-cycles"
              payload: { name: "CYC-C3", target_graduation_year: 2028, total_semifinalist_slots: 5, national_award_slots: 0, national_award_amount_cents: 250000, confirming_floor: 200, application_deadline: "2027-12-15T00:00:00Z", semifinalist_embargo_until: "2027-09-10T00:00:00Z", finalist_embargo_until: "2028-02-10T00:00:00Z", award_embargo_until: "2028-03-01T00:00:00Z", public_embargo_until: "2028-03-01T00:00:00Z", state_populations: [ { state_code: "ZZ", graduating_population: 10000 } ] }
              as: ProgramAdmin
              captures: { cyc: $.data.id }
            - call: "POST /api/program-cycles/${cyc}/open-entries"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/schools"
              payload: { name: "ZZ High", school_code: "ZZ-1", state_code: "ZZ" }
              as: ProgramAdmin
              captures: { sch: $.data.id }
            - call: "POST /api/students"
              payload: { full_name: "F One", school_id: "${sch}", state_code: "ZZ", graduation_year: 2028, citizenship_status: "US_CITIZEN", enrollment_status: "ENROLLED_FULL_TIME" }
              as: ProgramAdmin
              captures: { stu: $.data.id }
            - call: "POST /api/entries"
              payload: { student_id: "${stu}", cycle_id: "${cyc}", exam_year_of_hs: "THIRD_YEAR" }
              as: Student
              as_user_id: "${stu}"
              captures: { ent: $.data.id }
            - call: "POST /api/program-cycles/${cyc}/close-entries"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /api/entries/${ent}/score"
              payload: { reading_score: 37, writing_score: 37, math_score: 38, selection_index: 1 }
              as: ProgramAdmin
              captures: { si: $.data.selection_index, st: $.data.status }
          assert:
            - "${si} == 224 (computed (37+37+38)*2), not the client-supplied 1"
            - "${st} == SCORED"

      - name: entry_system_fields_ignored_input
        claim_type: system_fields
        grounds: [entities.Entry, response_envelope]
        distinguishing_aspect: "Server-stamped fields (id, created_at, version, status) cannot be injected at creation: a payload carrying status/version is honored neither in value nor in kind."
        test_recipe:
          setup:
            - "Cycle in ENTRY_OPEN with a school and a student."
          setup_api_calls:
            - call: "POST /api/program-cycles"
              payload: { name: "CYC-C4", target_graduation_year: 2028, total_semifinalist_slots: 5, national_award_slots: 0, national_award_amount_cents: 250000, confirming_floor: 200, application_deadline: "2027-12-15T00:00:00Z", semifinalist_embargo_until: "2027-09-10T00:00:00Z", finalist_embargo_until: "2028-02-10T00:00:00Z", award_embargo_until: "2028-03-01T00:00:00Z", public_embargo_until: "2028-03-01T00:00:00Z", state_populations: [ { state_code: "ZZ", graduating_population: 10000 } ] }
              as: ProgramAdmin
              captures: { cyc: $.data.id }
            - call: "POST /api/program-cycles/${cyc}/open-entries"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/schools"
              payload: { name: "ZZ High", school_code: "ZZ-1", state_code: "ZZ" }
              as: ProgramAdmin
              captures: { sch: $.data.id }
            - call: "POST /api/students"
              payload: { full_name: "F One", school_id: "${sch}", state_code: "ZZ", graduation_year: 2028, citizenship_status: "US_CITIZEN", enrollment_status: "ENROLLED_FULL_TIME" }
              as: ProgramAdmin
              captures: { stu: $.data.id }
          trigger:
            - call: "POST /api/entries"
              payload: { student_id: "${stu}", cycle_id: "${cyc}", exam_year_of_hs: "THIRD_YEAR", status: "SCORED", version: 99 }
              as: Student
              as_user_id: "${stu}"
              captures: { st: $.data.status, v: $.data.version, eid: $.data.id }
          assert:
            - "${st} == SUBMITTED (initial state) and ${v} == 1 — injected status SCORED and version 99 ignored"
            - "${eid} is a plain UUID with no type prefix, and created_at/updated_at are present ISO-8601 UTC timestamps"

      - name: get_entry_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "A well-formed but nonexistent entry id returns 404 ERR_NOT_FOUND for any permitted role."
        test_recipe:
          setup:
            - "A cycle exists (any content); the probed entry id was never created."
          setup_api_calls:
            - call: "POST /api/program-cycles"
              payload: { name: "CYC-C5", target_graduation_year: 2028, total_semifinalist_slots: 5, national_award_slots: 0, national_award_amount_cents: 250000, confirming_floor: 200, application_deadline: "2027-12-15T00:00:00Z", semifinalist_embargo_until: "2027-09-10T00:00:00Z", finalist_embargo_until: "2028-02-10T00:00:00Z", award_embargo_until: "2028-03-01T00:00:00Z", public_embargo_until: "2028-03-01T00:00:00Z", state_populations: [ { state_code: "ZZ", graduating_population: 10000 } ] }
              as: ProgramAdmin
          trigger:
            - call: "GET /api/entries/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_FOUND with HTTP 404 and the error envelope carries meta + data.error_id + data.message"

      - name: entries_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /api/entries]"]
        distinguishing_aspect: "List responses carry the fixed pagination contract: limit/offset inputs, total_count and has_more outputs, defaults limit 10."
        test_recipe:
          setup:
            - "Cycle in ENTRY_OPEN with two students each holding one entry."
          setup_api_calls:
            - call: "POST /api/program-cycles"
              payload: { name: "CYC-C6", target_graduation_year: 2028, total_semifinalist_slots: 5, national_award_slots: 0, national_award_amount_cents: 250000, confirming_floor: 200, application_deadline: "2027-12-15T00:00:00Z", semifinalist_embargo_until: "2027-09-10T00:00:00Z", finalist_embargo_until: "2028-02-10T00:00:00Z", award_embargo_until: "2028-03-01T00:00:00Z", public_embargo_until: "2028-03-01T00:00:00Z", state_populations: [ { state_code: "ZZ", graduating_population: 10000 } ] }
              as: ProgramAdmin
              captures: { cyc: $.data.id }
            - call: "POST /api/program-cycles/${cyc}/open-entries"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/schools"
              payload: { name: "ZZ High", school_code: "ZZ-1", state_code: "ZZ" }
              as: ProgramAdmin
              captures: { sch: $.data.id }
            - call: "POST /api/students"
              payload: { full_name: "F One", school_id: "${sch}", state_code: "ZZ", graduation_year: 2028, citizenship_status: "US_CITIZEN", enrollment_status: "ENROLLED_FULL_TIME" }
              as: ProgramAdmin
              captures: { s1: $.data.id }
            - call: "POST /api/students"
              payload: { full_name: "F Two", school_id: "${sch}", state_code: "ZZ", graduation_year: 2028, citizenship_status: "US_CITIZEN", enrollment_status: "ENROLLED_FULL_TIME" }
              as: ProgramAdmin
              captures: { s2: $.data.id }
            - call: "POST /api/entries"
              payload: { student_id: "${s1}", cycle_id: "${cyc}", exam_year_of_hs: "THIRD_YEAR" }
              as: Student
              as_user_id: "${s1}"
            - call: "POST /api/entries"
              payload: { student_id: "${s2}", cycle_id: "${cyc}", exam_year_of_hs: "THIRD_YEAR" }
              as: Student
              as_user_id: "${s2}"
          trigger:
            - call: "GET /api/entries"
              payload: { cycle_id: "${cyc}", limit: 1, offset: 0 }
              as: ProgramAdmin
            - call: "GET /api/entries"
              payload: { cycle_id: "${cyc}", limit: 1, offset: 1 }
              as: ProgramAdmin
          assert:
            - "page 1: response_type == array, exactly 1 item, total_count == 2, has_more == true; the item is the first-created entry (created_at ASC ordering)"
            - "page 2: exactly 1 item (the other entry), total_count == 2, has_more == false"
            - "the two pages return disjoint ids covering both entries"

      - name: agreement_employee_children_only_defaults_true
        claim_type: defaults
        grounds: [entities.SponsorAgreement.fields.employee_children_only]
        distinguishing_aspect: "Omitting employee_children_only at agreement creation applies the declared default true, which then restricts matching to employee children."
        test_recipe:
          setup:
            - "A cycle and a sponsor exist."
          setup_api_calls:
            - call: "POST /api/program-cycles"
              payload: { name: "CYC-C7", target_graduation_year: 2028, total_semifinalist_slots: 5, national_award_slots: 0, national_award_amount_cents: 250000, confirming_floor: 200, application_deadline: "2027-12-15T00:00:00Z", semifinalist_embargo_until: "2027-09-10T00:00:00Z", finalist_embargo_until: "2028-02-10T00:00:00Z", award_embargo_until: "2028-03-01T00:00:00Z", public_embargo_until: "2028-03-01T00:00:00Z", state_populations: [ { state_code: "ZZ", graduating_population: 10000 } ] }
              as: ProgramAdmin
              captures: { cyc: $.data.id }
            - call: "POST /api/corporate-sponsors"
              payload: { legal_name: "Acme Corp", sponsor_code: "ACME" }
              as: ProgramAdmin
              captures: { sp: $.data.id }
          trigger:
            - call: "POST /api/corporate-sponsors/${sp}/agreements"
              payload: { cycle_id: "${cyc}", award_amount_cents: 250000, max_awards: 2, pool_total_cents: 500000, effective_start_date: "2027-01-01", effective_end_date: "2027-12-31" }
              as: SponsorAdmin
              as_user_id: "${sp}"
              captures: { flag: $.data.employee_children_only, ag_status: $.data.status }
          assert:
            - "${flag} == true (default applied)"
            - "${ag_status} == ACTIVE and supersedes_agreement_id is null"

      - name: school_common_fields_false_has_no_version
        claim_type: immutability
        grounds: [entities.School]
        distinguishing_aspect: "School declares common_fields: false — the create response carries id and created_at only; no version/updated_at exist and §1.5 declares no update or delete endpoint for schools."
        test_recipe:
          setup:
            - "A cycle exists (minimal fixture context)."
          setup_api_calls:
            - call: "POST /api/program-cycles"
              payload: { name: "CYC-C8", target_graduation_year: 2028, total_semifinalist_slots: 5, national_award_slots: 0, national_award_amount_cents: 250000, confirming_floor: 200, application_deadline: "2027-12-15T00:00:00Z", semifinalist_embargo_until: "2027-09-10T00:00:00Z", finalist_embargo_until: "2028-02-10T00:00:00Z", award_embargo_until: "2028-03-01T00:00:00Z", public_embargo_until: "2028-03-01T00:00:00Z", state_populations: [ { state_code: "ZZ", graduating_population: 10000 } ] }
              as: ProgramAdmin
          trigger:
            - call: "POST /api/schools"
              payload: { name: "Immutable High", school_code: "ZZ-9", state_code: "ZZ" }
              as: ProgramAdmin
              captures: { sch: $.data.id }
          assert:
            - "the response contains id (${sch}) and created_at, and contains neither version nor updated_at"
            - "§1.5 declares no PUT/PATCH/DELETE for /api/schools — the entity is create-and-reference only"

  - section: state_machines
    instances:
      - name: notification_created_embargoed_initial_state
        claim_type: initial_state
        grounds: [state_machines.Notification, entities.Notification.fields.status]
        distinguishing_aspect: "Selection queues each selected student's SEMIFINALIST_NOTICE in EMBARGOED with the cycle's semifinalist embargo and sequence_number 1 — never auto-released."
        test_recipe:
          setup:
            - "Cycle advanced to SEMIFINALISTS_SELECTED with one selected student."
          setup_api_calls:
            - call: "POST /api/program-cycles"
              payload: { name: "CYC-S1", target_graduation_year: 2028, total_semifinalist_slots: 5, national_award_slots: 0, national_award_amount_cents: 250000, confirming_floor: 200, application_deadline: "2027-12-15T00:00:00Z", semifinalist_embargo_until: "2027-09-10T00:00:00Z", finalist_embargo_until: "2028-02-10T00:00:00Z", award_embargo_until: "2028-03-01T00:00:00Z", public_embargo_until: "2028-03-01T00:00:00Z", state_populations: [ { state_code: "ZZ", graduating_population: 10000 } ] }
              as: ProgramAdmin
              captures: { cyc: $.data.id }
            - call: "POST /api/program-cycles/${cyc}/open-entries"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/schools"
              payload: { name: "ZZ High", school_code: "ZZ-1", state_code: "ZZ" }
              as: ProgramAdmin
              captures: { sch: $.data.id }
            - call: "POST /api/students"
              payload: { full_name: "F One", school_id: "${sch}", state_code: "ZZ", graduation_year: 2028, citizenship_status: "US_CITIZEN", enrollment_status: "ENROLLED_FULL_TIME" }
              as: ProgramAdmin
              captures: { stu: $.data.id }
            - call: "POST /api/entries"
              payload: { student_id: "${stu}", cycle_id: "${cyc}", exam_year_of_hs: "THIRD_YEAR" }
              as: Student
              as_user_id: "${stu}"
              captures: { ent: $.data.id }
            - call: "POST /api/program-cycles/${cyc}/close-entries"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/entries/${ent}/score"
              payload: { reading_score: 37, writing_score: 37, math_score: 38 }
              as: ProgramAdmin
            - call: "POST /api/program-cycles/${cyc}/run-semifinalist-selection"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "GET /api/students/${stu}/notifications"
              payload: {}
              as: ProgramAdmin
              captures: { n_status: "$.data[0].status", n_type: "$.data[0].notice_type", n_seq: "$.data[0].sequence_number", n_emb: "$.data[0].embargo_until" }
          assert:
            - "exactly one notification: ${n_type} == SEMIFINALIST_NOTICE, ${n_seq} == 1, ${n_status} == EMBARGOED"
            - "${n_emb} == 2027-09-10T00:00:00Z (copied from the cycle) and released_logical_at is null"

      - name: rescore_scored_entry_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Entry.SUBMITTED_to_SCORED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "SCORED is not a valid source state for the score trigger: a second scoring of the same entry is rejected with ERR_INVALID_STATE and changes nothing (idempotency by rejection)."
        test_recipe:
          setup:
            - "Cycle in ENTRY_CLOSED with one entry already SCORED (SI 224)."
          setup_api_calls:
            - call: "POST /api/program-cycles"
              payload: { name: "CYC-S2", target_graduation_year: 2028, total_semifinalist_slots: 5, national_award_slots: 0, national_award_amount_cents: 250000, confirming_floor: 200, application_deadline: "2027-12-15T00:00:00Z", semifinalist_embargo_until: "2027-09-10T00:00:00Z", finalist_embargo_until: "2028-02-10T00:00:00Z", award_embargo_until: "2028-03-01T00:00:00Z", public_embargo_until: "2028-03-01T00:00:00Z", state_populations: [ { state_code: "ZZ", graduating_population: 10000 } ] }
              as: ProgramAdmin
              captures: { cyc: $.data.id }
            - call: "POST /api/program-cycles/${cyc}/open-entries"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/schools"
              payload: { name: "ZZ High", school_code: "ZZ-1", state_code: "ZZ" }
              as: ProgramAdmin
              captures: { sch: $.data.id }
            - call: "POST /api/students"
              payload: { full_name: "F One", school_id: "${sch}", state_code: "ZZ", graduation_year: 2028, citizenship_status: "US_CITIZEN", enrollment_status: "ENROLLED_FULL_TIME" }
              as: ProgramAdmin
              captures: { stu: $.data.id }
            - call: "POST /api/entries"
              payload: { student_id: "${stu}", cycle_id: "${cyc}", exam_year_of_hs: "THIRD_YEAR" }
              as: Student
              as_user_id: "${stu}"
              captures: { ent: $.data.id }
            - call: "POST /api/program-cycles/${cyc}/close-entries"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/entries/${ent}/score"
              payload: { reading_score: 37, writing_score: 37, math_score: 38 }
              as: ProgramAdmin
          trigger:
            - call: "POST /api/entries/${ent}/score"
              payload: { reading_score: 20, writing_score: 20, math_score: 20 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
            - call: "GET /api/entries/${ent}"
              payload: {}
              as: ProgramAdmin
              captures: { si: $.data.selection_index, st: $.data.status }
          assert:
            - "${err} == ERR_INVALID_STATE with HTTP 409"
            - "the stored entry is unchanged: ${si} == 224 and ${st} == SCORED (the rejected rescore wrote nothing)"

      - name: completed_cycle_rejects_reopen
        claim_type: terminal_lockdown
        grounds: [state_machines.ProgramCycle, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "AWARDS_COMPLETED is terminal: after the single national award is accepted and its one disbursement released, the cycle bubbles to AWARDS_COMPLETED and open-entries is rejected."
        test_recipe:
          setup:
            - "Cycle with national_award_slots 1 driven through matching; the single award accepted and fully disbursed (terms_total 1, due at the default clock), so the cycle auto-completes."
          setup_api_calls:
            - call: "POST /api/program-cycles"
              payload: { name: "CYC-S3", target_graduation_year: 2028, total_semifinalist_slots: 5, national_award_slots: 1, national_award_amount_cents: 250000, confirming_floor: 200, application_deadline: "2027-12-15T00:00:00Z", semifinalist_embargo_until: "2027-09-10T00:00:00Z", finalist_embargo_until: "2028-02-10T00:00:00Z", award_embargo_until: "2028-03-01T00:00:00Z", public_embargo_until: "2028-03-01T00:00:00Z", state_populations: [ { state_code: "ZZ", graduating_population: 10000 } ] }
              as: ProgramAdmin
              captures: { cyc: $.data.id }
            - call: "POST /api/program-cycles/${cyc}/open-entries"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/schools"
              payload: { name: "ZZ High", school_code: "ZZ-1", state_code: "ZZ" }
              as: ProgramAdmin
              captures: { sch: $.data.id }
            - call: "POST /api/students"
              payload: { full_name: "F One", school_id: "${sch}", state_code: "ZZ", graduation_year: 2028, citizenship_status: "US_CITIZEN", enrollment_status: "ENROLLED_FULL_TIME" }
              as: ProgramAdmin
              captures: { stu: $.data.id }
            - call: "POST /api/entries"
              payload: { student_id: "${stu}", cycle_id: "${cyc}", exam_year_of_hs: "THIRD_YEAR" }
              as: Student
              as_user_id: "${stu}"
              captures: { ent: $.data.id }
            - call: "POST /api/program-cycles/${cyc}/close-entries"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/entries/${ent}/score"
              payload: { reading_score: 37, writing_score: 37, math_score: 38 }
              as: ProgramAdmin
            - call: "POST /api/program-cycles/${cyc}/run-semifinalist-selection"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/finalist-applications"
              payload: { entry_id: "${ent}", gpa_scaled: 3.9, course_rigor: "MOST_RIGOROUS", confirming_selection_index: 210 }
              as: Student
              as_user_id: "${stu}"
              captures: { app: $.data.id }
            - call: "POST /api/finalist-applications/${app}/endorse"
              payload: {}
              as: SchoolOfficial
              as_user_id: "${sch}"
            - call: "POST /api/finalist-applications/${app}/submit"
              payload: {}
              as: Student
              as_user_id: "${stu}"
              captures: { app_v: $.data.version }
            - call: "POST /api/finalist-applications/${app}/review"
              payload: { decision: "CONFIRM", expected_finalist_application_version: "${app_v}" }
              as: ProgramAdmin
            - call: "POST /api/program-cycles/${cyc}/publish-finalists"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/program-cycles/${cyc}/run-award-matching"
              payload: {}
              as: ProgramAdmin
            - call: "GET /api/awards"
