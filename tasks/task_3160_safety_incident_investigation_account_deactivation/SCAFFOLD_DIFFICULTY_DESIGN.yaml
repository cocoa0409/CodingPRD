              as: SafetyInvestigator
              captures: { refusal_id: $.data.error_id }
          assert:
            - "the decision is refused with error_id == \"ERR_IN_FLIGHT_APPEAL\" with HTTP 409"
            - "the refusal is driven by the sibling EnforcementAction holding enforcement_status == \"APPEAL_PENDING\", not by any state of the incident itself, whose incident_status is \"PENDING_DECISION\" and therefore decidable"
            - "GET /safety/accounts/${acct_id} still reports status == \"APPEAL_PENDING\" and standing_enforcement_count == 1, so the refused request produced no side effects"

      - name: dependency_expiry_blocked_by_sibling_severe_tier
        grounds:
          - state_machines.EnforcementAction.transitions.ACTIVE_to_EXPIRED
          - state_machines.Account.transitions.RESTRICTED_to_DEACTIVATED
          - calculations.risk_tier_regression_from_restriction_expiry
          - endpoints.POST_/safety/enforcement-actions/expiry-sweep
        distinguishing_aspect: |
          The scheduled expiry sweep on the EnforcementAction branches on the Account's own
          recomputed risk_tier: at a pre-sweep tier of exactly TIER_SEVERE the expiry is
