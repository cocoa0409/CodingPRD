          sample_attempt_count is a lifetime counter that survives every resubmission, so the only way
          to reach the sample ceiling with a live profile is to pass on the third attempt, let the
          recertification lapse, and resubmit: the fourth sample is then refused at the profile level
          even though the profile sits legitimately in SUBMITTED.
