      - name: certify_and_advance_calls_from_the_wrong_stage_are_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.TurnoverCase.DECLARANT_CONTROL_to_ELECTION_CALLED
          - state_machines.TurnoverCase.ELECTION_HELD_to_OWNER_CONTROL
          - errors.ERR_TURNOVER_STAGE_INVALID
          - validations[priority=9]
        distinguishing_aspect: "Both dimensions reject out-of-stage requests with ERR_TURNOVER_STAGE_INVALID (409): advancing GOVERNANCE while the case is still DECLARANT_CONTROL, certifying the trigger a second time once it is ELECTION_CALLED, and advancing GOVERNANCE while the election is merely CALLED and not HELD. trigger_certified_at keeps its first value across the rejected second certification."
        test_recipe:
          setup:
            - "Association 'Rushmere' with fixed_turnover_date 2026-07-01T00:00:00Z, already reached at the default clock 2026-08-01T00:00:00Z."
            - "TurnoverCase with total_seats 3 in DECLARANT_CONTROL / SUBSIDY_ACTIVE."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Rushmere", total_planned_lots: 6, turnover_threshold_pct: 66.67, fixed_turnover_date: "2026-07-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc_id}", total_seats: 3 }
              as: PlatformAdmin
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /hoa/turnover-cases/${case_id}/advance"
              payload: { dimension: "GOVERNANCE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { e_advance_too_early: $.data.error_id }
            - call: "POST /hoa/turnover-cases/${case_id}/certify-trigger"
              payload: { trigger_basis: "FIXED_DATE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/turnover-cases/${case_id}/certify-trigger"
              payload: { trigger_basis: "FIXED_DATE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { e_certify_twice: $.data.error_id }
            - call: "POST /hoa/turnover-cases/${case_id}/advance"
              payload: { dimension: "GOVERNANCE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { e_advance_before_election_held: $.data.error_id }
          assert:
            - "e_advance_too_early == ERR_TURNOVER_STAGE_INVALID with HTTP 409"
            - "e_certify_twice == ERR_TURNOVER_STAGE_INVALID with HTTP 409"
            - "e_advance_before_election_held == ERR_TURNOVER_STAGE_INVALID with HTTP 409"
            - "TurnoverCase.${case_id}.governance_status == ELECTION_CALLED and trigger_certified_at == 2026-08-01T00:00:00Z"
            - "TurnoverCase.${case_id}.financial_status == SUBSIDY_ACTIVE, untouched by any GOVERNANCE call"
            - "TurnoverCase.${case_id}.turnover_posture == TRANSITION_RESTRICTED"

      - name: advance_financial_without_any_audit_engagement_is_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.TurnoverCase.SUBSIDY_ACTIVE_to_AUDIT_IN_PROGRESS
          - errors.ERR_TRANSITION_AUDIT_MISSING
          - validations[priority=10]
          - endpoints[POST /hoa/audit-engagements]
        distinguishing_aspect: "Ending the declarant subsidy is the same event as opening the audit window, so the FINANCIAL advance requires at least one AuditEngagement in {ENGAGED, ISSUED}: without one it returns ERR_TRANSITION_AUDIT_MISSING (409) and Association.subsidy_end_date stays null; creating the engagement makes the identical call succeed and stamps subsidy_end_date plus budget_forecast_status STALE."
        test_recipe:
          setup:
            - "Association 'Saltmarsh Quay' with a TurnoverCase (total_seats 3) and no AuditEngagement."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Saltmarsh Quay", total_planned_lots: 6, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 40000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc_id}", total_seats: 3 }
              as: PlatformAdmin
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /hoa/turnover-cases/${case_id}/advance"
              payload: { dimension: "FINANCIAL", subsidy_end_date: "2026-10-01T00:00:00Z" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { e_no_audit: $.data.error_id }
            - call: "POST /hoa/audit-engagements"
              payload: { association_id: "${assoc_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Auditor
              as_user_id: "auditor-9"
              captures: { eng_id: $.data.id }
            - call: "POST /hoa/turnover-cases/${case_id}/advance"
              payload: { dimension: "FINANCIAL", subsidy_end_date: "2026-10-01T00:00:00Z" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          assert:
            - "e_no_audit == ERR_TRANSITION_AUDIT_MISSING with HTTP 409"
            - "after the first trigger call: TurnoverCase.${case_id}.financial_status == SUBSIDY_ACTIVE and Association.${assoc_id}.subsidy_end_date == null"
            - "second trigger call returns 201 with AuditEngagement.${eng_id}.status == ENGAGED"
            - "third trigger call returns 200 with TurnoverCase.${case_id}.financial_status == AUDIT_IN_PROGRESS"
            - "Association.${assoc_id}.subsidy_end_date == 2026-10-01T00:00:00Z and budget_forecast_status == STALE"
            - "TurnoverCase.${case_id}.governance_status == DECLARANT_CONTROL, so turnover_posture == TRANSITION_RESTRICTED"

      - name: governance_advance_below_the_records_threshold_is_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.TurnoverCase.ELECTION_HELD_to_OWNER_CONTROL
          - calculations.records_transfer_completeness
          - errors.ERR_RECORDS_INCOMPLETE
          - validations[priority=13]
        distinguishing_aspect: "GOVERNANCE_RECORDS_THRESHOLD_PCT is 80.00 and inclusive: with 3 of 5 required items ACCEPTED the percentage is 60.00 and the advance is refused with ERR_RECORDS_INCOMPLETE (422); accepting a fourth lifts it to exactly 80.00 and the identical advance succeeds. The non-required sixth item never moves the percentage."
