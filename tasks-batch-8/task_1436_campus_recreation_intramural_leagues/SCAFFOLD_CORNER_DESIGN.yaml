# =============================================================================
# §1.9 Scaffold Corner Design — Campus Recreation & Intramural Leagues
# Enumerative coverage of testable claims NOT covered by SCAFFOLD_DIFFICULTY_DESIGN.
# Corner instance names are unique across both design files. Logical clock default
# 2026-08-01T00:00:00Z. Facility fixture windows use day_of_week 1 (Tue) 17:00-22:00
# unless the instance says otherwise.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: member_creation_defaults_and_system_fields
        claim_type: creation_defaults
        grounds: [entities.Member, endpoints."POST /v1/members"]
        distinguishing_aspect: "POST /v1/members with required inputs returns 201 with server-minted id, status ACTIVE, waiver_signed_date null, outstanding_fines_cents 0, no_show_count 0, version 1; computed/system fields are not settable from input."
        test_recipe:
          setup: ["empty database; clock default"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/members", payload: { email: "d1@x.edu", full_name: "Def One", affiliation: "COMMUNITY" }, as: RecAdmin, captures: { d1_id: "$.data.id", d1_status: "$.data.status", d1_fines: "$.data.outstanding_fines_cents", d1_v: "$.data.version" } }
          assert:
            - "response 201; data.id is a server-minted UUID; status == ACTIVE; waiver_signed_date == null; outstanding_fines_cents == 0; no_show_count == 0; version == 1"
      - name: member_missing_affiliation_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Member.fields.affiliation, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting the input-sourced affiliation field is a 400 ERR_VALIDATION."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/members", payload: { email: "d2@x.edu", full_name: "Def Two" }, as: RecAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALIDATION; http 400"
      - name: member_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Member.fields.affiliation, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "affiliation outside {STUDENT, FACULTY, COMMUNITY} is rejected; enum closure enforced."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/members", payload: { email: "d3@x.edu", full_name: "Def Three", affiliation: "ALUMNI" }, as: RecAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALIDATION; http 400"
      - name: staff_conditional_fields_rejected
        claim_type: type_constraints
        grounds: [entities.Staff.fields.certification_level, entities.Staff.fields.certified_class_types, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Conditional field rules: OFFICIAL missing certification_level fails; INSTRUCTOR carrying certification_level fails — the requirement flips with staff_role."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/staff", payload: { full_name: "No Cert", staff_role: "OFFICIAL", base_hourly_rate_cents: 2000 }, as: RecAdmin, captures: { err1: "$.data.error_id" } }
            - { call: "POST /v1/staff", payload: { full_name: "Wrong Field", staff_role: "INSTRUCTOR", base_hourly_rate_cents: 3000, certification_level: 2, certified_class_types: ["YOGA"] }, as: RecAdmin, captures: { err2: "$.data.error_id" } }
          assert:
            - "first trigger: error_id == ERR_VALIDATION (certification_level required for OFFICIAL)"
            - "second trigger: error_id == ERR_VALIDATION (certification_level forbidden for INSTRUCTOR)"
      - name: team_computed_counters_after_roster_adds
        claim_type: computed_fields
        grounds: [entities.Team.fields.active_roster_count, entities.Team.fields.points]
        distinguishing_aspect: "Computed team counters start at 0 / null and track roster writes; client-supplied values for computed fields are ignored."
        test_recipe:
          setup: ["league REGISTRATION_OPEN; captain member CA fully eligible; team Alpha created"]
          setup_api_calls:
            - { call: "POST /v1/leagues", payload: { name: "Hoops", sport: "BASKETBALL", divisions: [ { name: "A", capacity: 4, skill_min: 1, skill_max: 10 } ], registration_open_at: "2026-08-20T00:00:00Z", registration_close_at: "2026-09-05T00:00:00Z", season_start_at: "2026-09-07T00:00:00Z", season_end_at: "2026-12-04T00:00:00Z", team_capacity: 4, min_teams: 2, roster_min: 1, roster_max: 3 }, as: RecAdmin, captures: { lg_id: "$.data.id" } }
            - { call: "POST /v1/leagues/${lg_id}/open-registration", as: LeagueCoordinator }
            - { call: "POST /v1/members", payload: { email: "ca@x.edu", full_name: "Cap A", affiliation: "STUDENT" }, as: RecAdmin, captures: { ca_id: "$.data.id", ca_v: "$.data.version" } }
            - { call: "POST /v1/members/${ca_id}/waiver-sign", as: Member, as_user_id: "${ca_id}", captures: { ca_v2: "$.data.version" } }
            - { call: "POST /v1/members/${ca_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${ca_v2}" }, as: Member, as_user_id: "${ca_id}" }
            - { call: "POST /v1/teams", payload: { league_id: "${lg_id}", name: "Alpha", captain_member_id: "${ca_id}", skill_rating: 5 }, as: LeagueCoordinator, captures: { ta_id: "$.data.id", ta_cnt0: "$.data.active_roster_count", ta_sm0: "$.data.sportsmanship_rating" } }
          trigger:
            - { call: "POST /v1/teams/${ta_id}/roster-entries", payload: { member_id: "${ca_id}" }, as: Member, as_user_id: "${ca_id}", captures: { re_role: "$.data.role" } }
            - { call: "GET /v1/teams/${ta_id}", as: LeagueCoordinator, captures: { ta_cnt1: "$.data.active_roster_count" } }
          assert:
            - "at creation: active_roster_count == 0, sportsmanship_rating == null, points == 0, forfeit_count == 0, division_name == null, status == REGISTERED"
            - "after captain's roster add: active_roster_count == 1 and the entry role == CAPTAIN"
      - name: entity_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent UUID yields the error envelope with ERR_NOT_FOUND and a message field."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/members/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: RecAdmin, captures: { err: "$.data.error_id", msg: "$.data.message" } }
          assert:
            - "error_id == ERR_NOT_FOUND; http 404; envelope carries meta.api_request_id, response_type == error, data.message non-empty"
      - name: membership_supersede_backlink
        claim_type: computed_fields
        grounds: [state_machines.Membership.ACTIVE_to_SUPERSEDED, entities.Membership.fields.supersedes_membership_id]
        distinguishing_aspect: "Create-with-supersede: buying FALL_2026 again while the first FALL_2026 is still ACTIVE supersedes it — the new ACTIVE membership points back at the SUPERSEDED one; at most one ACTIVE membership per member."
        test_recipe:
          setup: ["member M with ACTIVE FALL_2026 membership purchased 2026-08-24 (FULL); clock advanced to 2026-08-31 (first still ACTIVE)"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T00:00:00Z" }, as: RecAdmin }
            - { call: "POST /v1/members", payload: { email: "ms@x.edu", full_name: "Mem S", affiliation: "STUDENT" }, as: RecAdmin, captures: { ms_id: "$.data.id", ms_v: "$.data.version" } }
            - { call: "POST /v1/members/${ms_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${ms_v}" }, as: Member, as_user_id: "${ms_id}", captures: { ms1_id: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: RecAdmin }
            - { call: "GET /v1/members/${ms_id}", as: RecAdmin, captures: { ms_v2: "$.data.version" } }
          trigger:
            - { call: "POST /v1/members/${ms_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${ms_v2}" }, as: Member, as_user_id: "${ms_id}", captures: { ms2_id: "$.data.id", ms2_super: "$.data.supersedes_membership_id", ms2_fee: "$.data.fee_cents" } }
            - { call: "GET /v1/memberships/${ms1_id}", as: RecAdmin, captures: { ms1_status: "$.data.status" } }
            - { call: "GET /v1/memberships?member_id=${ms_id}&status=ACTIVE", as: RecAdmin }
          assert:
            - "new membership status == ACTIVE and supersedes_membership_id == ${ms1_id}"
            - "old membership status == SUPERSEDED"
            - "filtered list member_id=M&status=ACTIVE has total_count == 1 (uniqueness invariant)"
            - "second purchase on 2026-08-31 is PRORATED: fee_cents == 5625 (weekly round_half_up(6000/16) = 375 x ceil(103/7) = 15)"
      - name: membership_lazy_expiry_excluded
        claim_type: state_derivation
        grounds: [state_machines.Membership.ACTIVE_to_EXPIRED]
        excluded_because:
          difficulty_instance: checkout_gated_by_membership_state
          rationale: "Lazy EXPIRED flip is asserted there via GET /v1/memberships/{id} after the clock passes term end."
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: league_open_registration_requires_divisions
        claim_type: precondition_enforcement
        grounds: [state_machines.League.DRAFT_to_REGISTRATION_OPEN, "errors[ERR_LEAGUE_NOT_READY_FOR_SEASON]"]
        distinguishing_aspect: "open-registration with an empty divisions array is rejected; the league stays DRAFT."
        test_recipe:
          setup: ["league with divisions: [] created"]
          setup_api_calls:
            - { call: "POST /v1/leagues", payload: { name: "NoDiv", sport: "SOCCER", divisions: [], registration_open_at: "2026-08-20T00:00:00Z", registration_close_at: "2026-09-05T00:00:00Z", season_start_at: "2026-09-07T00:00:00Z", season_end_at: "2026-12-04T00:00:00Z", team_capacity: 4, min_teams: 2, roster_min: 1, roster_max: 3 }, as: RecAdmin, captures: { lg_id: "$.data.id" } }
          trigger:
            - { call: "POST /v1/leagues/${lg_id}/open-registration", as: LeagueCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_LEAGUE_NOT_READY_FOR_SEASON; league status remains DRAFT"
      - name: league_close_registration_too_few_teams
        claim_type: precondition_enforcement
        grounds: [state_machines.League.REGISTRATION_OPEN_to_SCHEDULING, "errors[ERR_TOO_FEW_TEAMS]"]
        distinguishing_aspect: "close-registration below min_teams fails; boundary is >= min_teams (exactly min_teams would pass — here one team against min_teams 2 fails)."
        test_recipe:
          setup: ["league REGISTRATION_OPEN (min_teams 2); exactly one team registered"]
          setup_api_calls:
            - { call: "POST /v1/leagues", payload: { name: "Hoops", sport: "BASKETBALL", divisions: [ { name: "A", capacity: 4, skill_min: 1, skill_max: 10 } ], registration_open_at: "2026-08-20T00:00:00Z", registration_close_at: "2026-09-05T00:00:00Z", season_start_at: "2026-09-07T00:00:00Z", season_end_at: "2026-12-04T00:00:00Z", team_capacity: 4, min_teams: 2, roster_min: 1, roster_max: 3 }, as: RecAdmin, captures: { lg_id: "$.data.id" } }
            - { call: "POST /v1/leagues/${lg_id}/open-registration", as: LeagueCoordinator }
            - { call: "POST /v1/members", payload: { email: "ca@x.edu", full_name: "Cap A", affiliation: "STUDENT" }, as: RecAdmin, captures: { ca_id: "$.data.id" } }
            - { call: "POST /v1/teams", payload: { league_id: "${lg_id}", name: "Alpha", captain_member_id: "${ca_id}", skill_rating: 5 }, as: LeagueCoordinator }
          trigger:
            - { call: "POST /v1/leagues/${lg_id}/close-registration", as: LeagueCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_TOO_FEW_TEAMS; league remains REGISTRATION_OPEN"
      - name: league_start_season_requires_placement
        claim_type: precondition_enforcement
        grounds: [state_machines.League.SCHEDULING_to_IN_SEASON, "errors[ERR_LEAGUE_NOT_READY_FOR_SEASON]"]
        distinguishing_aspect: "start-season with a REGISTERED-but-unplaced team fails even though team count and rosters suffice."
        test_recipe:
          setup: ["league SCHEDULING; teams Alpha (PLACED, roster 1) and Beta (REGISTERED, unplaced, roster 1)"]
          setup_api_calls:
            - { call: "POST /v1/leagues", payload: { name: "Hoops", sport: "BASKETBALL", divisions: [ { name: "A", capacity: 4, skill_min: 1, skill_max: 10 } ], registration_open_at: "2026-08-20T00:00:00Z", registration_close_at: "2026-09-05T00:00:00Z", season_start_at: "2026-09-07T00:00:00Z", season_end_at: "2026-12-04T00:00:00Z", team_capacity: 4, min_teams: 2, roster_min: 1, roster_max: 3 }, as: RecAdmin, captures: { lg_id: "$.data.id" } }
            - { call: "POST /v1/leagues/${lg_id}/open-registration", as: LeagueCoordinator }
            - { call: "POST /v1/members", payload: { email: "ca@x.edu", full_name: "Cap A", affiliation: "STUDENT" }, as: RecAdmin, captures: { ca_id: "$.data.id", ca_v: "$.data.version" } }
            - { call: "POST /v1/members/${ca_id}/waiver-sign", as: Member, as_user_id: "${ca_id}", captures: { ca_v2: "$.data.version" } }
            - { call: "POST /v1/members/${ca_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${ca_v2}" }, as: Member, as_user_id: "${ca_id}" }
            - { call: "POST /v1/members", payload: { email: "cb@x.edu", full_name: "Cap B", affiliation: "STUDENT" }, as: RecAdmin, captures: { cb_id: "$.data.id", cb_v: "$.data.version" } }
            - { call: "POST /v1/members/${cb_id}/waiver-sign", as: Member, as_user_id: "${cb_id}", captures: { cb_v2: "$.data.version" } }
            - { call: "POST /v1/members/${cb_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${cb_v2}" }, as: Member, as_user_id: "${cb_id}" }
            - { call: "POST /v1/teams", payload: { league_id: "${lg_id}", name: "Alpha", captain_member_id: "${ca_id}", skill_rating: 5 }, as: LeagueCoordinator, captures: { ta_id: "$.data.id" } }
            - { call: "POST /v1/teams/${ta_id}/roster-entries", payload: { member_id: "${ca_id}" }, as: Member, as_user_id: "${ca_id}" }
            - { call: "POST /v1/teams", payload: { league_id: "${lg_id}", name: "Beta", captain_member_id: "${cb_id}", skill_rating: 5 }, as: LeagueCoordinator, captures: { tb_id: "$.data.id" } }
            - { call: "POST /v1/teams/${tb_id}/roster-entries", payload: { member_id: "${cb_id}" }, as: Member, as_user_id: "${cb_id}" }
            - { call: "POST /v1/leagues/${lg_id}/close-registration", as: LeagueCoordinator }
            - { call: "POST /v1/teams/${ta_id}/place-division", payload: { division_name: "A" }, as: LeagueCoordinator }
          trigger:
            - { call: "POST /v1/leagues/${lg_id}/start-season", as: LeagueCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_LEAGUE_NOT_READY_FOR_SEASON (Beta has no division); league remains SCHEDULING"
      - name: league_start_playoffs_blocked_by_unfinished_game
        claim_type: precondition_enforcement
        grounds: [state_machines.League.IN_SEASON_to_PLAYOFFS, "errors[ERR_PLAYOFFS_NOT_READY]"]
        distinguishing_aspect: "A single game still SCHEDULED blocks start-playoffs with ERR_PLAYOFFS_NOT_READY."
        test_recipe:
          setup: ["2-team league IN_SEASON with one SCHEDULED game in the future"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T00:00:00Z" }, as: RecAdmin }
            - { call: "POST /v1/facilities", payload: { name: "Court 1", kind: "COURT", operating_windows: [ { day_of_week: 1, open_minute: 1020, close_minute: 1320 } ] }, as: RecAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /v1/leagues", payload: { name: "Hoops", sport: "BASKETBALL", divisions: [ { name: "A", capacity: 4, skill_min: 1, skill_max: 10 } ], registration_open_at: "2026-08-20T00:00:00Z", registration_close_at: "2026-09-05T00:00:00Z", season_start_at: "2026-09-07T00:00:00Z", season_end_at: "2026-12-04T00:00:00Z", team_capacity: 4, min_teams: 2, roster_min: 1, roster_max: 3 }, as: RecAdmin, captures: { lg_id: "$.data.id" } }
            - { call: "POST /v1/leagues/${lg_id}/open-registration", as: LeagueCoordinator }
            - { call: "POST /v1/members", payload: { email: "ca@x.edu", full_name: "Cap A", affiliation: "STUDENT" }, as: RecAdmin, captures: { ca_id: "$.data.id", ca_v: "$.data.version" } }
            - { call: "POST /v1/members/${ca_id}/waiver-sign", as: Member, as_user_id: "${ca_id}", captures: { ca_v2: "$.data.version" } }
            - { call: "POST /v1/members/${ca_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${ca_v2}" }, as: Member, as_user_id: "${ca_id}" }
            - { call: "POST /v1/members", payload: { email: "cb@x.edu", full_name: "Cap B", affiliation: "STUDENT" }, as: RecAdmin, captures: { cb_id: "$.data.id", cb_v: "$.data.version" } }
            - { call: "POST /v1/members/${cb_id}/waiver-sign", as: Member, as_user_id: "${cb_id}", captures: { cb_v2: "$.data.version" } }
            - { call: "POST /v1/members/${cb_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${cb_v2}" }, as: Member, as_user_id: "${cb_id}" }
            - { call: "POST /v1/teams", payload: { league_id: "${lg_id}", name: "Alpha", captain_member_id: "${ca_id}", skill_rating: 5 }, as: LeagueCoordinator, captures: { ta_id: "$.data.id" } }
            - { call: "POST /v1/teams/${ta_id}/roster-entries", payload: { member_id: "${ca_id}" }, as: Member, as_user_id: "${ca_id}" }
            - { call: "POST /v1/teams", payload: { league_id: "${lg_id}", name: "Beta", captain_member_id: "${cb_id}", skill_rating: 5 }, as: LeagueCoordinator, captures: { tb_id: "$.data.id" } }
            - { call: "POST /v1/teams/${tb_id}/roster-entries", payload: { member_id: "${cb_id}" }, as: Member, as_user_id: "${cb_id}" }
            - { call: "POST /v1/leagues/${lg_id}/close-registration", as: LeagueCoordinator }
            - { call: "POST /v1/teams/${ta_id}/place-division", payload: { division_name: "A" }, as: LeagueCoordinator }
            - { call: "POST /v1/teams/${tb_id}/place-division", payload: { division_name: "A" }, as: LeagueCoordinator }
            - { call: "POST /v1/leagues/${lg_id}/start-season", as: LeagueCoordinator }
            - { call: "GET /v1/leagues/${lg_id}", as: LeagueCoordinator, captures: { lg_v: "$.data.version" } }
            - { call: "POST /v1/leagues/${lg_id}/games", payload: { home_team_id: "${ta_id}", away_team_id: "${tb_id}", facility_id: "${f_id}", start_at: "2026-09-08T18:00:00Z", end_at: "2026-09-08T19:30:00Z", expected_league_version: "${lg_v}" }, as: LeagueCoordinator }
          trigger:
            - { call: "POST /v1/leagues/${lg_id}/start-playoffs", as: LeagueCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_PLAYOFFS_NOT_READY; league remains IN_SEASON"
      - name: membership_cancel_twice_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Membership.ACTIVE_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal: the second cancel is rejected and no further transition is possible."
        test_recipe:
          setup: ["member M with ACTIVE FALL_2026 membership"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T00:00:00Z" }, as: RecAdmin }
            - { call: "POST /v1/members", payload: { email: "mc@x.edu", full_name: "Mem C", affiliation: "STUDENT" }, as: RecAdmin, captures: { mc_id: "$.data.id", mc_v: "$.data.version" } }
            - { call: "POST /v1/members/${mc_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${mc_v}" }, as: Member, as_user_id: "${mc_id}", captures: { ms_id: "$.data.id" } }
            - { call: "POST /v1/memberships/${ms_id}/cancel", as: Member, as_user_id: "${mc_id}", captures: { ms_st: "$.data.status" } }
          trigger:
            - { call: "POST /v1/memberships/${ms_id}/cancel", as: Member, as_user_id: "${mc_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "first cancel: status == CANCELLED"
            - "second cancel: error_id == ERR_INVALID_STATE (409)"
      - name: roster_remove_captain_returns_error
        claim_type: precondition_enforcement
        grounds: [state_machines.RosterEntry.ACTIVE_to_REMOVED, "errors[ERR_CAPTAIN_REMOVAL_FORBIDDEN]"]
        distinguishing_aspect: "The captain's own roster entry is unremovable even while the roster is unlocked — a member-identity-based constraint, not a state one."
        test_recipe:
          setup: ["league REGISTRATION_OPEN; team Alpha with captain entry ACTIVE"]
          setup_api_calls:
            - { call: "POST /v1/leagues", payload: { name: "Hoops", sport: "BASKETBALL", divisions: [ { name: "A", capacity: 4, skill_min: 1, skill_max: 10 } ], registration_open_at: "2026-08-20T00:00:00Z", registration_close_at: "2026-09-05T00:00:00Z", season_start_at: "2026-09-07T00:00:00Z", season_end_at: "2026-12-04T00:00:00Z", team_capacity: 4, min_teams: 2, roster_min: 1, roster_max: 3 }, as: RecAdmin, captures: { lg_id: "$.data.id" } }
            - { call: "POST /v1/leagues/${lg_id}/open-registration", as: LeagueCoordinator }
            - { call: "POST /v1/members", payload: { email: "ca@x.edu", full_name: "Cap A", affiliation: "STUDENT" }, as: RecAdmin, captures: { ca_id: "$.data.id", ca_v: "$.data.version" } }
            - { call: "POST /v1/members/${ca_id}/waiver-sign", as: Member, as_user_id: "${ca_id}", captures: { ca_v2: "$.data.version" } }
            - { call: "POST /v1/members/${ca_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${ca_v2}" }, as: Member, as_user_id: "${ca_id}" }
            - { call: "POST /v1/teams", payload: { league_id: "${lg_id}", name: "Alpha", captain_member_id: "${ca_id}", skill_rating: 5 }, as: LeagueCoordinator, captures: { ta_id: "$.data.id" } }
            - { call: "POST /v1/teams/${ta_id}/roster-entries", payload: { member_id: "${ca_id}" }, as: Member, as_user_id: "${ca_id}", captures: { re_id: "$.data.id" } }
          trigger:
