  # ===================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: plan_check_fail_revision_cycle
        grounds:
          - state_machines.TreatmentPlan.PENDING_PRIMARY_CHECK_to_CHECK_FAILED
          - state_machines.TreatmentPlan.CHECK_FAILED_to_DRAFT
          - state_machines.TreatmentPlan.DRAFT_to_PENDING_PRIMARY_CHECK
        distinguishing_aspect: |
          TreatmentPlan exhibits a revision CYCLE (DRAFT -> PENDING_PRIMARY_CHECK -> CHECK_FAILED ->
          DRAFT -> PENDING_PRIMARY_CHECK -> ... -> APPROVED_FOR_DELIVERY); the failing PRIMARY check
          also bumps the course PHYSICS_REVIEW -> PLANNING and the resubmission bumps it back, which
          a linear-pipeline implementation cannot express.
        test_recipe:
          setup:
            - "IMRT course 4000 cGy / 8 fx brought to PLANNING with an APPROVED contour set"
            - "Plan has one constraint (limit 4500, evaluated 4000 -> satisfied)"
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-CYC-1", full_name: "Cycle One", date_of_birth: "1970-01-01" }, as: Scheduler, captures: { pat: $.data.id } }
            - { call: "POST /oncology/patients/${pat}/treatment-courses", payload: { diagnosis_code: "C73", intent: "CURATIVE", technique: "IMRT", prescribed_total_dose_cGy: 4000, planned_fractions: 8 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "CT-Sim-C1", machine_type: "CT_SIMULATOR", room: "SIM1" }, as: SystemAdmin, captures: { sim_m: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-07-28T09:00:00Z", end_time: "2026-07-28T09:30:00Z", immobilization_device: "THERMOPLASTIC_MASK" }, as: Scheduler, captures: { sim_a: $.data.id } }
            - { call: "POST /oncology/simulation-appointments/${sim_a}/complete", payload: { patient_weight_kg: 75.0 }, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/treatment-courses/${crs}/contour-sets", payload: { set_label: "CT1", target_volumes: ["PTV"], oar_structures: ["Cord"] }, as: RadiationOncologist, as_user_id: "onc_a", captures: { cs: $.data.id } }
            - { call: "POST /oncology/contour-sets/${cs}/submit", payload: {}, as: RadiationOncologist, as_user_id: "onc_a" }
            - { call: "POST /oncology/contour-sets/${cs}/approve", payload: {}, as: RadiationOncologist, as_user_id: "onc_b" }
            - { call: "GET /oncology/treatment-courses/${crs}", payload: {}, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs_v: $.data.version } }
            - { call: "POST /oncology/treatment-courses/${crs}/treatment-plans", payload: { contour_set_id: "${cs}", target_total_dose_cGy: 4000, planned_fractions: 8, expected_course_version: "${crs_v}" }, as: MedicalDosimetrist, as_user_id: "dos_a", captures: { pl: $.data.id } }
            - { call: "POST /oncology/treatment-plans/${pl}/dose-constraints", payload: { structure_name: "Cord", constraint_type: "MAX_DOSE", limit_cGy: 4500, evaluated_value_cGy: 4000 }, as: MedicalDosimetrist, as_user_id: "dos_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/submit-for-check", payload: {}, as: MedicalDosimetrist, as_user_id: "dos_a" }
          trigger:
            - { call: "POST /oncology/treatment-plans/${pl}/physics-checks", payload: { check_type: "PRIMARY", outcome: "FAIL", notes: "MU model off" }, as: MedicalPhysicist, as_user_id: "phys_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/revise", payload: {}, as: MedicalDosimetrist, as_user_id: "dos_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/submit-for-check", payload: {}, as: MedicalDosimetrist, as_user_id: "dos_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/physics-checks", payload: { check_type: "PRIMARY", outcome: "PASS" }, as: MedicalPhysicist, as_user_id: "phys_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/physics-checks", payload: { check_type: "SECOND", outcome: "PASS" }, as: MedicalPhysicist, as_user_id: "phys_b" }
            - { call: "GET /oncology/treatment-plans/${pl}", payload: {}, as: MedicalDosimetrist, as_user_id: "dos_a", captures: { pl_status: $.data.status } }
            - { call: "GET /oncology/treatment-courses/${crs}", payload: {}, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs_status: $.data.status } }
          assert:
            - "after PRIMARY FAIL: plan was CHECK_FAILED and course was PLANNING (verified by revise succeeding only from CHECK_FAILED)"
            - "after revise + resubmit + PRIMARY PASS + SECOND PASS: pl_status == APPROVED_FOR_DELIVERY"
            - "crs_status == TREATMENT_READY"
            - "plan ${pl} completed the full cycle DRAFT -> PENDING_PRIMARY_CHECK -> CHECK_FAILED -> DRAFT -> PENDING_PRIMARY_CHECK -> PENDING_SECOND_CHECK -> APPROVED_FOR_DELIVERY"

      - name: course_adaptation_cycle_returns_to_on_treatment
        grounds:
          - state_machines.TreatmentCourse.ON_TREATMENT_to_ADAPTATION_REQUIRED
          - state_machines.TreatmentCourse.ADAPTATION_REQUIRED_to_REPLANNING
          - state_machines.TreatmentCourse.REPLANNING_to_PHYSICS_REVIEW
          - state_machines.TreatmentCourse.TREATMENT_READY_to_ON_TREATMENT
        distinguishing_aspect: |
          TreatmentCourse exhibits the adaptation CYCLE ON_TREATMENT -> ADAPTATION_REQUIRED ->
          REPLANNING -> PHYSICS_REVIEW -> TREATMENT_READY -> ON_TREATMENT on a DIFFERENT entity than
          the TreatmentPlan revision cycle; the course re-enters ON_TREATMENT only via a delivery
          under the NEW plan.
        test_recipe:
          setup:
            - "IMRT course 2000 cGy / 10 fx; plan A approved; 2 fractions delivered (delivered_dose 400)"
            - "Adaptation triggered by physician override at weight 78.0 (only 2.5% loss, so override is the cause)"
