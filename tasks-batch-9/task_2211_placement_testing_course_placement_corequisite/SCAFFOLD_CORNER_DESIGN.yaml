      - name: retiring_an_already_retired_course_is_rejected_from_the_terminal_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Course, "validations[priority=8]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: |
          RETIRED is terminal, so the second retire must fail rather than
          idempotently succeed — and the cascade must not run twice. The first retire
          sweeps a DRAFT rule and an ACTIVE requisite edge; the second attempt has to
          leave those already-terminal children exactly as the first left them.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Courses MATH-050 and READ-050, ACTIVE, with an ACTIVE BLOCKING PREREQUISITE edge MATH-050 -> READ-050."
            - "One DRAFT PlacementRule targets MATH-050. MATH-050 has no Sections."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-050", title: "Pre-Algebra", subject_area: "MATH", level_rank: 50, units: 5.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_050: $.data.id }
            - call: "POST /courses"
              payload: { course_code: "READ-050", title: "College Reading", subject_area: "ENGLISH", level_rank: 50, units: 3.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_read: $.data.id }
            - call: "POST /course-requisites"
              payload: { course_id: "${c_050}", requisite_course_id: "${c_read}", requisite_type: "PREREQUISITE", min_grade: "C", enforcement: "BLOCKING" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { req: $.data.id }
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TRANSCRIPT_GPA", target_course_id: "${c_050}", priority_rank: 10, min_hs_gpa: 2.0, effective_from: "2026-07-01T00:00:00Z", version_label: "V1" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { rule: $.data.id }
          trigger:
            - call: "POST /courses/${c_050}/retire"
              payload: {}
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { status1: $.data.status }
            - call: "GET /course-requisites/${req}"
              payload: {}
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { req_status1: $.data.status }
            - call: "GET /placement-rules/${rule}"
              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { rule_status1: $.data.status }
            - call: "POST /courses/${c_050}/retire"
              payload: {}
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { err_second: $.data.error_id }
            - call: "GET /courses/${c_050}"
              payload: {}
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { status2: $.data.status }
            - call: "GET /courses/${c_read}"
              payload: {}
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { read_status: $.data.status }
          assert:
            - "${status1} == \"RETIRED\" and ${req_status1} == \"RETIRED\" and ${rule_status1} == \"RETIRED\" — HOP 1 swept both children"
            - "${err_second} == \"ERR_INVALID_STATE\" with HTTP 409 — a terminal state accepts no re-entry, and the retire is NOT idempotent"
            - "${status2} == \"RETIRED\" — unchanged, and no second cascade ran"
            - "${read_status} == \"ACTIVE\" — the retire sweeps the EDGE that mentions the course, never the course on the other end of it"

