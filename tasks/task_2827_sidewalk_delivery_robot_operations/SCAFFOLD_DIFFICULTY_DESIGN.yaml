  - rule_id: resource_temporal_overlap
    instances:
      - name: bay_window_half_open_with_turnaround_buffer
        grounds:
          - "validations[priority=84]"
          - "calculations.bay_minutes_ledger"
          - "entities.BayReservation.fields.window_minutes"
          - "entities.DepotBay.fields.committed_minutes"
          - "concurrency_rules[bay-reservation-create-stale-bay]"
        distinguishing_aspect: >-
          The contended resource is a DepotBay and its interval semantics are half-open
          [window_start_utc, window_end_utc) inflated by TURNAROUND_BUFFER_MINUTES 15 on both sides, so a
          window starting 14 minutes after an existing window ends conflicts (409 ERR_BAY_WINDOW_CONFLICT)
          while one starting exactly 15 minutes after is accepted and adds its 45 window_minutes to the
          same ledger.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 PERMITTED with reserved_bay_minutes 60 and Robot R1 AVAILABLE"
            - "DepotBay B1 bay_type CHARGE, state OPEN, power_kw 22.0, committed_minutes 60 and version 2 after the first reservation"
