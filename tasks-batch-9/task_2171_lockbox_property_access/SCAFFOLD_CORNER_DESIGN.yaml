        grounds: ["errors[ERR_MEMBER_BALANCE_DELINQUENT]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / assign_to_suspended_delinquent_member_state_precedes_fiscal
          rationale: "The named §1.8 instance pins that the fiscal error never surfaces while the member is also ineligible; a standalone fiscal-only path is exercised there by contrast."

      - name: variant_divergence_of_replacement_charge
