              as_user_id: "${coach_id}"
            - call: "POST /boathouse/trailer-loads"
              payload: { regatta_id: "${regatta_id}", driver_member_id: "${equip_id}", tow_vehicle_code: "TOW-1", depart_at: "2026-08-11T05:00:00Z", return_at: "2026-08-12T20:00:00Z" }
              as: EquipmentManager
              as_user_id: "${equip_id}"
              captures: { trailer_id: $.data.id, tv0: $.data.version }
            - call: "POST /boathouse/trailer-loads/${trailer_id}/rack-assignments"
              payload: { regatta_entry_id: "${q_id}", expected_trailer_load_version: "${tv0}" }
              as: EquipmentManager
              as_user_id: "${equip_id}"
              captures: { tv1: $.data.version }
            - call: "POST /boathouse/trailer-loads/${trailer_id}/rack-assignments"
              payload: { regatta_entry_id: "${s_id}", expected_trailer_load_version: "${tv1}" }
              as: EquipmentManager
              as_user_id: "${equip_id}"
              captures: { tv2: $.data.version }
          trigger:
            - call: "POST /boathouse/trailer-loads/${trailer_id}/rack-releases"
              payload: { regatta_entry_id: "${q_id}", expected_trailer_load_version: "${tv2}" }
              as: EquipmentManager
              as_user_id: "${equip_id}"
            - call: "POST /boathouse/trailer-loads/${trailer_id}/rack-releases"
              payload: { regatta_entry_id: "${s_id}", expected_trailer_load_version: "${tv2} + 1" }
              as: EquipmentManager
              as_user_id: "${equip_id}"
            - call: "POST /boathouse/trailer-loads/${trailer_id}/rack-assignments"
              payload: { regatta_entry_id: "${q_id}", expected_trailer_load_version: "${tv2} + 2" }
              as: EquipmentManager
              as_user_id: "${equip_id}"
            - call: "POST /boathouse/trailer-loads/${trailer_id}/rack-releases"
              payload: { regatta_entry_id: "${q_id}", expected_trailer_load_version: "${tv2} + 3" }
              as: EquipmentManager
              as_user_id: "${equip_id}"
          assert:
            - "before the triggers TrailerLoad.${trailer_id}.rack_unit_capacity == 16, rack_units_used == 3 (2 units for the 4+ plus 1 for the 1X) and rack_units_free == 13"
            - "RegattaEntry.${q_id}.rack_tier == 1 with rack_position == 1 and RegattaEntry.${s_id}.rack_tier == 1 with rack_position == 3 from setup"
            - "after the first trigger call rack_units_used == 1 and rack_units_free == 15, and RegattaEntry.${q_id}.rack_tier, rack_position and trailer_load_id are all null"
            - "after the second trigger call rack_units_used == 0 and rack_units_free == 16 == rack_unit_capacity, and RegattaEntry.${s_id}.trailer_load_id == null"
            - "after the third trigger call RegattaEntry.${q_id}.rack_tier == 1 and rack_position == 1 again — the released contiguous slot is reissued with no drift — and rack_units_used == 2 with rack_units_free == 14"
            - "after the fourth trigger call rack_units_used == 0 and rack_units_free == 16, so rack_units_used + rack_units_free == rack_unit_capacity holds at every one of the six observations"
            - "TrailerLoad.${trailer_id}.version == ${tv2} + 4 after the four triggers, one increment per write"

      - name: regatta_net_fee_ledger_returns_to_zero_after_full_refund_scratches
        grounds:
          - calculations.scratch_refund
          - calculations.regatta_entry_fee
          - entities.Regatta.net_fee_cents
          - state_machines.RegattaEntry.SUBMITTED_to_SCRATCHED
        distinguishing_aspect: |
          A different conserved quantity — the Regatta fee ledger. Two HOME entries push
          net_fee_cents from 0 to 9000, and scratching both before entry_deadline_at at
          REFUND_PCT_FULL drives it back to exactly 0 even though both SCRATCHED rows stay in the
          input set: conservation is achieved through the refund_cents term, not by dropping rows,
          so any implementation that removes scratched entries or rounds the refund differently
          fails to return to the original balance.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default, well before the deadlines"
            - "one certified coach, two rowers, two 1X hulls"
            - "one HOME regatta (no transport levy) with entry_deadline_at 2026-08-10T00:00:00Z and scratch_deadline_at 2026-08-11T00:00:00Z"
            - "two 1X entries, each with a declared lineup, neither submitted yet, so net_fee_cents is still 0"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Cora Coach", tier: "COMPETITIVE", body_weight_kg: 78.0, club_roles: ["COACH"], swim_test_passed_on: "2026-04-01T00:00:00Z", coach_cert_expires_at: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /boathouse/members"
              payload: { full_name: "Row One", tier: "COMPETITIVE", body_weight_kg: 82.0, club_roles: ["ATHLETE"], swim_test_passed_on: "2026-04-01T00:00:00Z" }
              as: ClubAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /boathouse/members"
              payload: { full_name: "Row Two", tier: "COMPETITIVE", body_weight_kg: 83.0, club_roles: ["ATHLETE"], swim_test_passed_on: "2026-04-01T00:00:00Z" }
              as: ClubAdmin
              captures: { r2_id: $.data.id }
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Kingfisher", boat_class: "1X", hull_weight_kg: 14.0, home_bay: "BAY-1" }
              as: ClubAdmin
              captures: { shell_a_id: $.data.id }
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Heron", boat_class: "1X", hull_weight_kg: 14.2, home_bay: "BAY-2" }
              as: ClubAdmin
              captures: { shell_b_id: $.data.id }
            - call: "POST /boathouse/regattas"
              payload: { name: "Club Head Race", host_club: "Home RC", venue_kind: "HOME", race_date_at: "2026-08-12T08:00:00Z", entry_deadline_at: "2026-08-10T00:00:00Z", scratch_deadline_at: "2026-08-11T00:00:00Z", weigh_in_opens_at: "2026-08-12T06:00:00Z", weigh_in_closes_at: "2026-08-12T07:00:00Z" }
              as: ClubAdmin
              captures: { regatta_id: $.data.id }
            - call: "POST /boathouse/regatta-entries"
              payload: { regatta_id: "${regatta_id}", shell_id: "${shell_a_id}", event_code: "M1X_OPEN", boat_class: "1X", seed_time_seconds: 380.0 }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { e1_id: $.data.id, e1_v: $.data.version }
            - call: "POST /boathouse/regatta-entries/${e1_id}/lineup"
              payload: { expected_regatta_entry_version: "${e1_v}", seats: [{ member_id: "${r1_id}", seat_number: 1, seat_role: "ROWER" }] }
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /boathouse/regatta-entries"
              payload: { regatta_id: "${regatta_id}", shell_id: "${shell_b_id}", event_code: "M1X_OPEN", boat_class: "1X", seed_time_seconds: 385.0 }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { e2_id: $.data.id, e2_v: $.data.version }
            - call: "POST /boathouse/regatta-entries/${e2_id}/lineup"
              payload: { expected_regatta_entry_version: "${e2_v}", seats: [{ member_id: "${r2_id}", seat_number: 1, seat_role: "ROWER" }] }
              as: Coach
              as_user_id: "${coach_id}"
          trigger:
            - call: "POST /boathouse/regatta-entries/${e1_id}/submit"
              payload: {}
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /boathouse/regatta-entries/${e2_id}/submit"
              payload: {}
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /boathouse/regatta-entries/${e1_id}/scratch"
              payload: { reason: "illness" }
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /boathouse/regatta-entries/${e2_id}/scratch"
              payload: { reason: "illness" }
              as: Coach
              as_user_id: "${coach_id}"
          assert:
            - "before the triggers Regatta.${regatta_id}.net_fee_cents == 0"
            - "after the first submit RegattaEntry.${e1_id}.total_fee_cents == 4500 (base 4500, no HOME levy, no late fee) and Regatta.${regatta_id}.net_fee_cents == 4500"
            - "after the second submit Regatta.${regatta_id}.net_fee_cents == 9000"
            - "after the first scratch RegattaEntry.${e1_id}.status == SCRATCHED with refund_cents == 4500 (the clock is at or before entry_deadline_at so REFUND_PCT_FULL = 1.00 applies) and Regatta.${regatta_id}.net_fee_cents == 4500"
            - "after the second scratch RegattaEntry.${e2_id}.refund_cents == 4500 and Regatta.${regatta_id}.net_fee_cents == 0 — back to its pre-submission value"
            - "GET /boathouse/regatta-entries?regatta_id=${regatta_id} still returns both rows with status == SCRATCHED, each contributing total_fee_cents - refund_cents == 0 to the ledger"
            - "Regatta.${regatta_id}.deposit_held_cents == 0 throughout, unaffected by the fee ledger"
