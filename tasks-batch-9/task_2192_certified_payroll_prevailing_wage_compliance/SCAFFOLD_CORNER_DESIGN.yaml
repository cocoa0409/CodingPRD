              as_user_id: "prep-pat"
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /restitution-payments/${pay_id}/disburse"
              payload: {}
              as: PayrollPreparer
              as_user_id: "prep-pat"
            - call: "GET /contractors/${contractor_id}"
              payload: {}
              as: AgencyComplianceOfficer
              as_user_id: "officer-anna"
              captures: { seen_outstanding: "$.data.outstanding_restitution_cents" }
          assert:
            - "response.status == 200"
            - "Contractor.${contractor_id}.outstanding_restitution_cents == 20000"
            - "Finding.${finding_id}.restitution_outstanding_cents == 20000"
            - "Project.${proj_id}.outstanding_restitution_cents == 20000"
            - "RestitutionPayment.${pay_id}.status == DISBURSED"
