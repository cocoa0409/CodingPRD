# =============================================================================
# Task 0091 — §1.9 Scaffold Corner Design (breadth coverage)
# Walks references/claim-extraction-guide.md against §1.1–§1.7.
# Each active instance is a structured, empty-DB-reachable recipe against §1.5.
# excluded_because stubs point at the §1.8 instance that already covers them.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_volunteer_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Volunteer.fields.status
          - entities.Volunteer.fields.active_match_count
          - endpoints
        distinguishing_aspect: "POST /volunteers with all required fields returns 201; status defaults to APPLIED, active_match_count to 0, cleared_check_id null, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Coordinator
          trigger:
            - call: "POST /volunteers"
              payload: { full_name: "V Create", email: "vc@x.com", gender: "MALE", home_zip: "10001", interest_tags: ["SPORTS"], max_weekly_hours: 3 }
              as: Coordinator
              captures: { v_id: "$.data.id", v_status: "$.data.status", v_amc: "$.data.active_match_count", v_ver: "$.data.version" }
          assert:
            - "response_type == object and status code 201"
            - "Volunteer.${v_id}.status == APPLIED"
            - "Volunteer.${v_id}.active_match_count == 0"
            - "Volunteer.${v_id}.version == 1"

      - name: get_volunteer_not_found_returns_404
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /volunteers/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Coordinator
          trigger:
            - call: "GET /volunteers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Coordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "status code 404 and data.error_id == ERR_NOT_FOUND"

      - name: create_child_missing_required_age_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - entities.Child.fields.age
        distinguishing_aspect: "POST /children omitting the required age field returns ERR_INVALID_REQUEST (422); no Child is created."
        test_recipe:
          setup: ["A Guardian exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /guardians"
              payload: { full_name: "G Req", email: "greq@x.com", consent_on_file: true }
              as: Coordinator
              captures: { g_id: "$.data.id" }
          trigger:
            - call: "POST /children"
              payload: { guardian_id: "${g_id}", first_name: "NoAge", gender: "MALE", home_zip: "10001", interest_tags: ["SPORTS"] }
              as: MatchSpecialist
              captures: { err: "$.data.error_id" }
          assert:
            - "status code 422 and data.error_id == ERR_INVALID_REQUEST"

      - name: create_child_age_out_of_range_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - validations[priority=4]
          - entities.Child.fields.age
        distinguishing_aspect: "POST /children with age 5 (below the 6..16 inclusive range) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A Guardian exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /guardians"
              payload: { full_name: "G Age", email: "gage@x.com", consent_on_file: true }
              as: Coordinator
              captures: { g_id: "$.data.id" }
          trigger:
            - call: "POST /children"
              payload: { guardian_id: "${g_id}", first_name: "Young", age: 5, gender: "MALE", home_zip: "10001", interest_tags: ["SPORTS"] }
              as: MatchSpecialist
              captures: { err: "$.data.error_id" }
          assert:
            - "status code 422 and data.error_id == ERR_INVALID_REQUEST"

      - name: create_child_with_bad_guardian_fk_returns_404
        claim_type: Parent Relationships
        grounds:
          - entities.Child.fields.guardian_id
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "POST /children whose guardian_id references a non-existent Guardian returns ERR_NOT_FOUND (404) — FK integrity on a flat reference."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Coordinator
          trigger:
            - call: "POST /children"
              payload: { guardian_id: "00000000-0000-4000-8000-000000000001", first_name: "Orphan", age: 9, gender: "MALE", home_zip: "10001", interest_tags: ["SPORTS"] }
              as: MatchSpecialist
              captures: { err: "$.data.error_id" }
          assert:
            - "status code 404 and data.error_id == ERR_NOT_FOUND"

      - name: child_system_fields_ignored_on_input
        claim_type: System Fields
        grounds:
          - entities.Child.fields.status
          - entities.Child.fields.open_proposal_id
        distinguishing_aspect: "POST /children ignores any client-supplied status/open_proposal_id; the created Child is WAITLISTED with open_proposal_id null regardless of input (status is not an accepted input field)."
        test_recipe:
          setup: ["A Guardian exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /guardians"
              payload: { full_name: "G Sys", email: "gsys@x.com", consent_on_file: true }
              as: Coordinator
              captures: { g_id: "$.data.id" }
          trigger:
            - call: "POST /children"
              payload: { guardian_id: "${g_id}", first_name: "Sys", age: 10, gender: "FEMALE", home_zip: "10001", interest_tags: ["ARTS"] }
              as: MatchSpecialist
              captures: { c_id: "$.data.id", c_status: "$.data.status", c_opn: "$.data.open_proposal_id" }
          assert:
            - "Child.${c_id}.status == WAITLISTED"
            - "Child.${c_id}.open_proposal_id == null"

      - name: list_volunteers_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints
        distinguishing_aspect: "GET /volunteers returns an array envelope with pagination fields total_count and has_more; with two volunteers and limit=1 the page has total_count 2 and has_more true."
        test_recipe:
          setup: ["Two Volunteers exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /volunteers"
              payload: { full_name: "V L1", email: "vl1@x.com", gender: "MALE", home_zip: "10001", interest_tags: ["SPORTS"], max_weekly_hours: 5 }
              as: Coordinator
            - call: "POST /volunteers"
              payload: { full_name: "V L2", email: "vl2@x.com", gender: "FEMALE", home_zip: "10002", interest_tags: ["ARTS"], max_weekly_hours: 5 }
              as: Coordinator
          trigger:
            - call: "GET /volunteers"
              payload: { limit: 1, offset: 0 }
              as: Coordinator
          assert:
            - "response_type == array, total_count == 2, has_more == true, data length == 1"

      - name: list_volunteers_bad_limit_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - validations[priority=18]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "GET /volunteers with limit=0 (below min 1) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Coordinator
          trigger:
            - call: "GET /volunteers"
              payload: { limit: 0 }
              as: Coordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "status code 422 and data.error_id == ERR_INVALID_REQUEST"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: adjudicate_already_cleared_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.BackgroundCheck.PENDING_to_CLEARED
          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: adjudicate_state_beats_adverse_safety
          rationale: "Adjudicating an already-CLEARED check returning ERR_INVALID_STATE is asserted there (with the safety co-violation)."

      - name: hold_meeting_when_match_not_confirmed_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.MatchMeeting.SCHEDULED_to_HELD
          - errors[ERR_MATCH_NOT_READY_FOR_MEETING]
        distinguishing_aspect: "Holding a meeting requires the parent Match in CONFIRMED. After the match is INTRODUCED (first meeting held), scheduling and holding a SECOND meeting fails ERR_MATCH_NOT_READY_FOR_MEETING because the Match is no longer CONFIRMED."
        test_recipe:
          setup: ["A Match already INTRODUCED (first meeting HELD); a second SCHEDULED meeting exists on it."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /volunteers"
              payload: { full_name: "V Hm", email: "vhm@x.com", gender: "MALE", home_zip: "60601", interest_tags: ["STEM"], max_weekly_hours: 5 }
              as: Coordinator
              captures: { v_id: "$.data.id" }
            - call: "POST /volunteers/${v_id}/submit-screening"
              payload: {}
              as: BackgroundScreener
            - call: "GET /volunteers/${v_id}/background-checks"
              payload: {}
              as: BackgroundScreener
              captures: { bc0: "$.data[0].id", bc1: "$.data[1].id", bc2: "$.data[2].id" }
            - call: "POST /background-checks/${bc0}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 0 }
              as: BackgroundScreener
            - call: "POST /background-checks/${bc1}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 0 }
              as: BackgroundScreener
            - call: "POST /background-checks/${bc2}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 0 }
              as: BackgroundScreener
            - call: "POST /guardians"
              payload: { full_name: "G Hm", email: "ghm@x.com", consent_on_file: true }
              as: Coordinator
              captures: { g_id: "$.data.id" }
            - call: "POST /children"
              payload: { guardian_id: "${g_id}", first_name: "Hmm", age: 10, gender: "MALE", home_zip: "60601", interest_tags: ["STEM"] }
              as: MatchSpecialist
              captures: { c_id: "$.data.id", c_v: "$.data.version" }
            - call: "POST /children/${c_id}/propose-match"
              payload: { expected_child_version: "${c_v}" }
              as: MatchSpecialist
              captures: { prop_id: "$.data.id" }
            - call: "GET /volunteers/${v_id}"
              payload: {}
              as: MatchSpecialist
              captures: { v_v: "$.data.version" }
            - call: "POST /match-proposals/${prop_id}/accept"
              payload: { expected_volunteer_version: "${v_v}" }
              as: MatchSpecialist
              captures: { m_id: "$.data.id" }
            - call: "POST /matches/${m_id}/meetings"
              payload: { scheduled_start: "2026-01-05T10:00:00Z", scheduled_end: "2026-01-05T11:00:00Z", location: "M1" }
              as: MatchSpecialist
              captures: { mtg1_id: "$.data.id" }
            - call: "POST /match-meetings/${mtg1_id}/hold"
              payload: {}
              as: MatchSpecialist
            - call: "POST /matches/${m_id}/meetings"
              payload: { scheduled_start: "2026-01-06T10:00:00Z", scheduled_end: "2026-01-06T11:00:00Z", location: "M2" }
              as: MatchSpecialist
              captures: { mtg2_id: "$.data.id" }
          trigger:
            - call: "POST /match-meetings/${mtg2_id}/hold"
              payload: {}
              as: MatchSpecialist
              captures: { err: "$.data.error_id" }
          assert:
            - "status code 409 and data.error_id == ERR_MATCH_NOT_READY_FOR_MEETING"

      - name: complete_contact_when_match_not_active_returns_match_not_active
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.SupervisionContact.OPEN_to_COMPLETED
          - errors[ERR_MATCH_NOT_ACTIVE]
        distinguishing_aspect: "A SupervisionContact is only opened once a Match reaches ACTIVE, so to exercise ERR_MATCH_NOT_ACTIVE the contact is completed (opening contact #2) and the Match is then closed; completing the second OPEN contact after closure fails because the Match is CLOSED, not ACTIVE."
        test_recipe:
          setup: ["An ACTIVE Match with first contact OPEN; complete it (opens contact #2), then close the match via exit-finalize."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /volunteers"
              payload: { full_name: "V Na", email: "vna@x.com", gender: "FEMALE", home_zip: "30303", interest_tags: ["ARTS"], max_weekly_hours: 5 }
              as: Coordinator
              captures: { v_id: "$.data.id" }
            - call: "POST /volunteers/${v_id}/submit-screening"
              payload: {}
              as: BackgroundScreener
            - call: "GET /volunteers/${v_id}/background-checks"
              payload: {}
              as: BackgroundScreener
              captures: { bc0: "$.data[0].id", bc1: "$.data[1].id", bc2: "$.data[2].id" }
            - call: "POST /background-checks/${bc0}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 0 }
              as: BackgroundScreener
            - call: "POST /background-checks/${bc1}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 0 }
              as: BackgroundScreener
            - call: "POST /background-checks/${bc2}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 0 }
              as: BackgroundScreener
            - call: "POST /guardians"
              payload: { full_name: "G Na", email: "gna@x.com", consent_on_file: true }
              as: Coordinator
              captures: { g_id: "$.data.id" }
            - call: "POST /children"
              payload: { guardian_id: "${g_id}", first_name: "Nat", age: 9, gender: "FEMALE", home_zip: "30303", interest_tags: ["ARTS"] }
              as: MatchSpecialist
              captures: { c_id: "$.data.id", c_v: "$.data.version" }
            - call: "POST /children/${c_id}/propose-match"
              payload: { expected_child_version: "${c_v}" }
              as: MatchSpecialist
              captures: { prop_id: "$.data.id" }
            - call: "GET /volunteers/${v_id}"
              payload: {}
              as: MatchSpecialist
              captures: { v_v: "$.data.version" }
            - call: "POST /match-proposals/${prop_id}/accept"
              payload: { expected_volunteer_version: "${v_v}" }
              as: MatchSpecialist
              as_user_id: "spec-na"
              captures: { m_id: "$.data.id" }
            - call: "POST /matches/${m_id}/meetings"
              payload: { scheduled_start: "2026-01-02T10:00:00Z", scheduled_end: "2026-01-02T11:00:00Z", location: "NA" }
              as: MatchSpecialist
              captures: { mtg_id: "$.data.id" }
            - call: "POST /match-meetings/${mtg_id}/hold"
              payload: {}
              as: MatchSpecialist
            - call: "POST /match-meetings/${mtg_id}/affirm"
              payload: {}
              as: MatchSpecialist
            - call: "GET /matches/${m_id}/supervision-contacts"
              payload: {}
              as: Supervisor
              captures: { sc1_id: "$.data[0].id" }
            - call: "POST /supervision-contacts/${sc1_id}/complete"
              payload: { contacted_at: "2026-01-15T00:00:00Z", party: "BIG" }
              as: Supervisor
            - call: "POST /matches/${m_id}/exit-transitions"
              payload: { exit_type: "EARLY_TERMINATION", initiated_by: "AGENCY", reason_code: "RELOCATION" }
              as: MatchSpecialist
              captures: { et_id: "$.data.id" }
            - call: "POST /exit-transitions/${et_id}/finalize"
              payload: {}
              as: Supervisor
              as_user_id: "sup-na"
            - call: "GET /matches/${m_id}/supervision-contacts"
              payload: {}
              as: Supervisor
              captures: { sc2_id: "$.data[1].id" }
          trigger:
            - call: "POST /supervision-contacts/${sc2_id}/complete"
              payload: { contacted_at: "2026-01-20T00:00:00Z", party: "LITTLE" }
              as: Supervisor
              captures: { err: "$.data.error_id" }
          assert:
            - "status code 409 and data.error_id == ERR_MATCH_NOT_ACTIVE (the contact's Match is CLOSED)"

      - name: decline_already_declined_proposal_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.MatchProposal.OFFERED_to_DECLINED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Declining a MatchProposal that is already DECLINED (terminal) returns ERR_INVALID_STATE (409); no Child state changes on the second attempt."
        test_recipe:
          setup: ["A DECLINED MatchProposal."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /volunteers"
              payload: { full_name: "V Dd", email: "vdd@x.com", gender: "MALE", home_zip: "10001", interest_tags: ["SPORTS"], max_weekly_hours: 5 }
              as: Coordinator
              captures: { v_id: "$.data.id" }
            - call: "POST /volunteers/${v_id}/submit-screening"
              payload: {}
              as: BackgroundScreener
            - call: "GET /volunteers/${v_id}/background-checks"
              payload: {}
              as: BackgroundScreener
              captures: { bc0: "$.data[0].id", bc1: "$.data[1].id", bc2: "$.data[2].id" }
            - call: "POST /background-checks/${bc0}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 0 }
              as: BackgroundScreener
            - call: "POST /background-checks/${bc1}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 0 }
              as: BackgroundScreener
            - call: "POST /background-checks/${bc2}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 0 }
              as: BackgroundScreener
            - call: "POST /guardians"
              payload: { full_name: "G Dd", email: "gdd@x.com", consent_on_file: true }
              as: Coordinator
              captures: { g_id: "$.data.id" }
            - call: "POST /children"
              payload: { guardian_id: "${g_id}", first_name: "Dd", age: 10, gender: "MALE", home_zip: "10001", interest_tags: ["SPORTS"] }
              as: MatchSpecialist
              captures: { c_id: "$.data.id", c_v: "$.data.version" }
            - call: "POST /children/${c_id}/propose-match"
              payload: { expected_child_version: "${c_v}" }
              as: MatchSpecialist
              captures: { prop_id: "$.data.id" }
            - call: "POST /match-proposals/${prop_id}/decline"
              payload: { decline_reason: "POOR_FIT" }
              as: MatchSpecialist
          trigger:
            - call: "POST /match-proposals/${prop_id}/decline"
              payload: { decline_reason: "POOR_FIT" }
              as: MatchSpecialist
              captures: { err: "$.data.error_id" }
          assert:
            - "status code 409 and data.error_id == ERR_INVALID_STATE"

      - name: volunteer_initial_state_applied
        claim_type: Initial State
        grounds:
          - state_machines.Volunteer
        excluded_because:
          difficulty_instance: interest_score_ranking_vs_tiebreak_on_proposal
          rationale: "Volunteer creation in APPLIED then screened to ELIGIBLE is exercised within that instance's setup chain."

      - name: meeting_held_to_affirmed_valid_transition
        claim_type: Valid Transition
        grounds:
          - state_machines.MatchMeeting.HELD_to_AFFIRMED
          - state_machines.Match.INTRODUCED_to_ACTIVE
        excluded_because:
          difficulty_instance: meeting_held_branches_affirm_vs_rescind
          rationale: "The rescind branch of HELD (and the contrasting affirm branch) is asserted there."

  # ===========================================================================
  - section: calculations
    instances:
      - name: outcome_composite_strong_band
        claim_type: Correct Result
        grounds:
          - calculations.outcome_composite_score
          - entities.OutcomeSurvey.fields.composite_score
          - entities.OutcomeSurvey.fields.outcome_band
        distinguishing_aspect: "OutcomeSurvey with relationship_quality 5, child_outcome 4, would_rematch true yields composite_score 5.00 (0.5*5 + 0.5*4 + 0.5 bonus) and outcome_band STRONG (>= STRONG_CUTOFF 4.0)."
        test_recipe:
          setup: ["A CLOSED Match whose SUCCESSFUL_CLOSURE ExitTransition has survey_required true."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /volunteers"
              payload: { full_name: "V Os", email: "vos@x.com", gender: "MALE", home_zip: "94105", interest_tags: ["STEM"], max_weekly_hours: 5 }
              as: Coordinator
              captures: { v_id: "$.data.id" }
            - call: "POST /volunteers/${v_id}/submit-screening"
              payload: {}
              as: BackgroundScreener
            - call: "GET /volunteers/${v_id}/background-checks"
              payload: {}
              as: BackgroundScreener
              captures: { bc0: "$.data[0].id", bc1: "$.data[1].id", bc2: "$.data[2].id" }
            - call: "POST /background-checks/${bc0}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 0 }
              as: BackgroundScreener
            - call: "POST /background-checks/${bc1}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 0 }
              as: BackgroundScreener
            - call: "POST /background-checks/${bc2}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 0 }
              as: BackgroundScreener
            - call: "POST /guardians"
              payload: { full_name: "G Os", email: "gos@x.com", consent_on_file: true }
              as: Coordinator
              captures: { g_id: "$.data.id" }
            - call: "POST /children"
              payload: { guardian_id: "${g_id}", first_name: "Os", age: 12, gender: "MALE", home_zip: "94105", interest_tags: ["STEM"] }
              as: MatchSpecialist
              captures: { c_id: "$.data.id", c_v: "$.data.version" }
            - call: "POST /children/${c_id}/propose-match"
              payload: { expected_child_version: "${c_v}" }
              as: MatchSpecialist
              captures: { prop_id: "$.data.id" }
            - call: "GET /volunteers/${v_id}"
              payload: {}
              as: MatchSpecialist
              captures: { v_v: "$.data.version" }
            - call: "POST /match-proposals/${prop_id}/accept"
              payload: { expected_volunteer_version: "${v_v}" }
              as: MatchSpecialist
              as_user_id: "spec-os"
              captures: { m_id: "$.data.id" }
            - call: "POST /matches/${m_id}/meetings"
              payload: { scheduled_start: "2026-01-02T10:00:00Z", scheduled_end: "2026-01-02T11:00:00Z", location: "Os" }
