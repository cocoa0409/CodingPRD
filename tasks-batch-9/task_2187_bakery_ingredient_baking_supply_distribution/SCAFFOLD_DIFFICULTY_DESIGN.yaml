              as: WarehouseOperator
              as_user_id: "wo-1"
              captures: { zone_nut_id: $.data.id }
            - call: "POST /bakery-distribution/lots"
              payload: { lot_code: "LOT-CTRL-01", product_id: "${almond_id}", zone_id: "${zone_nut_id}", manufactured_on: "2026-08-01T00:00:00Z", quantity_received_lb: 1000 }
              as: WarehouseOperator
              as_user_id: "wo-1"
              captures: { lot_ctrl_id: $.data.id }
            - call: "POST /bakery-distribution/warehouse-zones/${zone_nut_id}/lockout"
              payload: { lockout_start_at: "2026-08-08T06:00:00Z", lockout_end_at: "2026-08-10T00:00:00Z" }
              as: QualityManager
              as_user_id: "qm-1"
              captures: { zone_status_before: $.data.status }
            - call: "POST /bakery-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /bakery-distribution/warehouse-zones/${zone_nut_id}/lockout"
              payload: { lockout_start_at: "2026-08-08T06:00:00Z", lockout_end_at: "2026-08-10T00:00:00Z" }
              as: QualityManager
              as_user_id: "qm-1"
              captures: { zone_status_locked: $.data.status }
          trigger:
            - call: "POST /bakery-distribution/lots"
              payload: { lot_code: "LOT-EDGE-01", product_id: "${almond_id}", zone_id: "${zone_nut_id}", manufactured_on: "2026-08-01T00:00:00Z", quantity_received_lb: 4000 }
              as: WarehouseOperator
              as_user_id: "wo-1"
              captures: { err_endpoint: $.data.error_id }
            - call: "POST /bakery-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:01Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /bakery-distribution/warehouse-zones/${zone_nut_id}/lockout"
              payload: { lockout_start_at: "2026-08-08T06:00:00Z", lockout_end_at: "2026-08-10T00:00:00Z" }
              as: QualityManager
              as_user_id: "qm-1"
              captures: { zone_status_after: $.data.status }
            - call: "POST /bakery-distribution/lots"
              payload: { lot_code: "LOT-EDGE-02", product_id: "${almond_id}", zone_id: "${zone_nut_id}", manufactured_on: "2026-08-01T00:00:00Z", quantity_received_lb: 4000 }
              as: WarehouseOperator
              as_user_id: "wo-1"
              captures: { lot_edge2_id: $.data.id, lot_edge2_status: $.data.status }
          assert:
            - "${zone_status_before} == OPEN"
            - "${zone_status_locked} == SANITATION_LOCKOUT"
            - "${err_endpoint} == ERR_ZONE_LOCKOUT_CONFLICT"
            - "HTTP status of the 2026-08-10T00:00:00Z receipt is 409"
            - "no Lot with lot_code LOT-EDGE-01 exists after the rejected call"
            - "${zone_status_after} == OPEN"
            - "${lot_edge2_status} == AVAILABLE"
