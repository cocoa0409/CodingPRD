  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_ticket_confirm
        grounds:
          - validations[priority=6]
          - validations[priority=12]
          - state_machines.QueueTicket.PENDING_to_CONFIRMED
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: at confirm the lot is
          still RECEIVED (priority 6, ERR_INVALID_STATE) AND the customer is
          SUSPENDED (priority 12, ERR_CUSTOMER_SUSPENDED) — the higher-priority
          state error must win.
        test_recipe:
          setup:
            - "Customer created ACTIVE then SUSPENDED; lot RECEIVED (no moisture test); ticket created while both gates were passable (lot RECEIVED allowed at create, customer then ACTIVE)"
          setup_api_calls:
            - { call: "POST /grain-drying/customers", payload: { name: "C1", credit_limit_cents: 500000, prepaid_balance_cents: 0 }, as: ElevatorManager, captures: { cust: $.data.id } }
            - { call: "POST /grain-drying/dryer-units", payload: { unit_code: "DRYER-1", daily_capacity_bushels: 10000, standard_class_cap_bushels: 8000, throughput_bu_per_hour: 600, cooldown_minutes: 30 }, as: ElevatorManager, captures: { unit: $.data.id } }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:00:00Z" }, as: ElevatorManager }
            - { call: "POST /grain-drying/grain-lots", payload: { customer_id: "${cust}", commodity: "CORN", gross_weight_lbs: 44000, tare_weight_lbs: 34000, target_moisture_pct: 15.0, foreign_material_pct: 2.0 }, as: IntakeTechnician, captures: { lot: $.data.id } }
            - { call: "POST /grain-drying/queue-tickets", payload: { lot_id: "${lot}", unit_id: "${unit}", window_date: "2026-09-12", requested_bushels: 200 }, as: Grower, as_user_id: "${cust}", captures: { tick: $.data.id } }
            - { call: "PATCH /grain-drying/customers/${cust}", payload: { account_status: "SUSPENDED" }, as: ElevatorManager }
          trigger:
            - { call: "POST /grain-drying/queue-tickets/${tick}/confirm", payload: {}, as: ElevatorManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (lot RECEIVED fails priority 6)"
            - "NOT ERR_CUSTOMER_SUSPENDED (priority 12 loses to priority 6)"
            - "QueueTicket.${tick}.status remains PENDING"

      - name: safety_beats_capacity_on_ticket_confirm
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - state_machines.QueueTicket.PENDING_to_CONFIRMED
        distinguishing_aspect: |
          Different error-category pair, business_safety vs business_temporal:
          lot certified at 27.0% (> 26.0 dryer safety limit, priority 9) AND
          the date's standard class cap is already exactly full at 8000
          (priority 11, ERR_CAPACITY_EXCEEDED) — the safety error must win.
        test_recipe:
          setup:
            - "Standard-cap day 2026-09-10 filled to exactly 8000 by an 8000-bu ticket of a 20.0% lot; second lot certified 27.0% with a 100-bu ticket on the same date"
          setup_api_calls:
            - { call: "POST /grain-drying/customers", payload: { name: "C1", credit_limit_cents: 500000, prepaid_balance_cents: 0 }, as: ElevatorManager, captures: { cust: $.data.id } }
            - { call: "POST /grain-drying/dryer-units", payload: { unit_code: "DRYER-1", daily_capacity_bushels: 10000, standard_class_cap_bushels: 8000, throughput_bu_per_hour: 600, cooldown_minutes: 30 }, as: ElevatorManager, captures: { unit: $.data.id } }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:00:00Z" }, as: ElevatorManager }
            - { call: "POST /grain-drying/grain-lots", payload: { customer_id: "${cust}", commodity: "CORN", gross_weight_lbs: 44000, tare_weight_lbs: 34000, target_moisture_pct: 15.0, foreign_material_pct: 2.0 }, as: IntakeTechnician, captures: { lotX: $.data.id, lotX_v: $.data.version } }
            - { call: "POST /grain-drying/moisture-tests", payload: { lot_id: "${lotX}", sample_moisture_pct: 20.0, expected_grain_lot_version: "${lotX_v}" }, as: IntakeTechnician, as_user_id: "tech-1", captures: { testX: $.data.id } }
            - { call: "POST /grain-drying/moisture-tests/${testX}/certify", payload: {}, as: IntakeTechnician, as_user_id: "tech-1" }
            - { call: "POST /grain-drying/queue-tickets", payload: { lot_id: "${lotX}", unit_id: "${unit}", window_date: "2026-09-10", requested_bushels: 8000 }, as: Grower, as_user_id: "${cust}", captures: { tickX: $.data.id } }
            - { call: "POST /grain-drying/queue-tickets/${tickX}/confirm", payload: {}, as: ElevatorManager }
            - { call: "POST /grain-drying/grain-lots", payload: { customer_id: "${cust}", commodity: "CORN", gross_weight_lbs: 44000, tare_weight_lbs: 34000, target_moisture_pct: 15.0, foreign_material_pct: 2.0 }, as: IntakeTechnician, captures: { lotY: $.data.id, lotY_v: $.data.version } }
            - { call: "POST /grain-drying/moisture-tests", payload: { lot_id: "${lotY}", sample_moisture_pct: 27.0, expected_grain_lot_version: "${lotY_v}" }, as: IntakeTechnician, as_user_id: "tech-1", captures: { testY: $.data.id } }
            - { call: "POST /grain-drying/moisture-tests/${testY}/certify", payload: {}, as: IntakeTechnician, as_user_id: "tech-1" }
            - { call: "POST /grain-drying/queue-tickets", payload: { lot_id: "${lotY}", unit_id: "${unit}", window_date: "2026-09-10", requested_bushels: 100 }, as: Grower, as_user_id: "${cust}", captures: { tickY: $.data.id } }
          trigger:
            - { call: "POST /grain-drying/queue-tickets/${tickY}/confirm", payload: {}, as: ElevatorManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MOISTURE_EXCEEDS_DRYER_LIMIT (27.0 > 26.0, priority 9)"
            - "NOT ERR_CAPACITY_EXCEEDED (8000 + 100 > 8000 also true, but priority 11 loses)"
            - "QueueTicket.${tickY}.status remains PENDING"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: moisture_bracket_edge_20_0_vs_20_1
        grounds:
          - calculations.drying_charge
          - validations[priority=10]
        distinguishing_aspect: |
          Boundary on MOISTURE PCT via the charge-preview endpoint: bracket
          edges are inclusive downward, so intake exactly 20.0 bills at T1
          (4c) while 20.1 bills at T2 (5c): identical 5600-lb lots yield
          2000c vs 2550c.
        test_recipe:
          setup:
            - "Customer, CORN tariff, clock; two 5600-lb lots (fm 2.0, target 15.0) certified at exactly 20.0 and 20.1"
          setup_api_calls:
            - { call: "POST /grain-drying/customers", payload: { name: "C1", credit_limit_cents: 500000, prepaid_balance_cents: 0 }, as: ElevatorManager, captures: { cust: $.data.id } }
            - { call: "POST /grain-drying/charge-schedules", payload: { commodity: "CORN", effective_from: "2026-08-01", effective_to: "2026-12-31", t1_max_moisture_pct: 20.0, t2_max_moisture_pct: 25.0, rate_t1_cents_per_pt_bu: 4, rate_t2_cents_per_pt_bu: 5, rate_t3_cents_per_pt_bu: 7, fm_threshold_pct: 3.0, fm_surcharge_pct: 0.10, min_charge_cents: 1500, energy_t1_limit_therms: 60, energy_t1_rate_cents_per_therm: 85, energy_t2_rate_cents_per_therm: 95, est_therms_per_hour: 12.5, est_point_factor: 0.05 }, as: ElevatorManager }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:00:00Z" }, as: ElevatorManager }
            - { call: "POST /grain-drying/grain-lots", payload: { customer_id: "${cust}", commodity: "CORN", gross_weight_lbs: 39600, tare_weight_lbs: 34000, target_moisture_pct: 15.0, foreign_material_pct: 2.0 }, as: IntakeTechnician, captures: { lot1: $.data.id, lot1_v: $.data.version } }
            - { call: "POST /grain-drying/moisture-tests", payload: { lot_id: "${lot1}", sample_moisture_pct: 20.0, expected_grain_lot_version: "${lot1_v}" }, as: IntakeTechnician, as_user_id: "tech-1", captures: { test1: $.data.id } }
            - { call: "POST /grain-drying/moisture-tests/${test1}/certify", payload: {}, as: IntakeTechnician, as_user_id: "tech-1" }
            - { call: "POST /grain-drying/grain-lots", payload: { customer_id: "${cust}", commodity: "CORN", gross_weight_lbs: 39600, tare_weight_lbs: 34000, target_moisture_pct: 15.0, foreign_material_pct: 2.0 }, as: IntakeTechnician, captures: { lot2: $.data.id, lot2_v: $.data.version } }
