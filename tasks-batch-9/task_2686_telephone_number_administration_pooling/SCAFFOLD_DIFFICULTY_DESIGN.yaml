  - rule_id: non_linear_state_machine
    instances:
      - name: allocation_request_info_request_cycle_twice_then_third_refused
        grounds:
          - state_machines.AllocationRequest.PENDING_REVIEW_to_INFO_REQUESTED
          - state_machines.AllocationRequest.INFO_REQUESTED_to_PENDING_REVIEW
          - validations[priority=11]
          - errors.ERR_INFO_CYCLE_LIMIT_REACHED
          - entities.AllocationRequest.fields.info_request_count
        distinguishing_aspect: |
          The identical REQUEST_INFO trigger applied to the identical
          PENDING_REVIEW state succeeds the first two times and is refused with
          ERR_INFO_CYCLE_LIMIT_REACHED (409) the third time, so the outcome is
          a function of the loop counter rather than of the current state, and
          the request is still approvable afterwards.
