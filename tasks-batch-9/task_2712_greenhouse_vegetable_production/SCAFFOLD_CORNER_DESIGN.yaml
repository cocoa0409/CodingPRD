            - "One below-threshold observation is filed first to prove a quiet count does not move the posture."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T00:00:00Z" }
              as: GrowerManager
            - call: "POST /zones"
              payload: { code: "ZC-83", area_sqft: 9450, glazing_type: "GLASS", has_thermal_screen: true, has_supplemental_lighting: true, chp_connected: true, hive_slot_capacity: 8, labor_budget_usd: 20000.00 }
              as: GrowerManager
              captures: { zc83: $.data.id }
            - call: "POST /varieties"
              payload: { name: "Merlice TOV", crop_type: "TOMATO", cycle_length_weeks: 13, first_harvest_week: 4, plant_density_per_sqft: 0.24, yield_curve_lbs_per_sqft: [0.4, 0.8, 1.1, 1.3, 1.3, 1.2, 1.0, 0.9, 0.7, 0.5], grade_a_ratio_pct: 60, requires_pollination: true, ec_target_ms: 3.0 }
              as: GrowerManager
              captures: { vc83: $.data.id }
            - call: "POST /crop-cycles"
              payload: { zone_id: "${zc83}", variety_id: "${vc83}", transplant_date: "2026-08-03", plants_transplanted: 2157 }
              as: GrowerManager
              captures: { cc83: $.data.id }
            - call: "POST /crop-cycles/${cc83}/transitions"
              payload: { to_status: "TRANSPLANTED" }
              as: GrowerManager
            - call: "POST /workers"
              payload: { full_name: "Sera Vos", skill: "SCOUT", hourly_rate_usd: 21.00, productivity_index: 1.00, status: "ACTIVE" }
              as: GrowerManager
              captures: { wc83: $.data.id }
            - call: "POST /scouting-observations"
              payload: { zone_id: "${zc83}", crop_cycle_id: "${cc83}", observed_at: "2026-08-06T06:00:00Z", pest_code: "WHITEFLY", plants_inspected: 60, pest_count_per_plant: 0.400 }
              as: IPMScout
              as_user_id: "${wc83}"
            - call: "GET /zones/${zc83}"
              as: GrowerManager
              captures: { zc83_p0: $.data.ipm_posture, zc83_c0: $.data.open_pest_alert_count }
          trigger:
            - call: "POST /scouting-observations"
              payload: { zone_id: "${zc83}", crop_cycle_id: "${cc83}", observed_at: "2026-08-06T07:00:00Z", pest_code: "WHITEFLY", plants_inspected: 60, pest_count_per_plant: 0.500 }
              as: IPMScout
              as_user_id: "${wc83}"
            - call: "GET /zones/${zc83}"
              as: GrowerManager
              captures: { zc83_p1: $.data.ipm_posture, zc83_c1: $.data.open_pest_alert_count }
            - call: "POST /scouting-observations"
              payload: { zone_id: "${zc83}", crop_cycle_id: "${cc83}", observed_at: "2026-08-06T08:00:00Z", pest_code: "APHID", plants_inspected: 60, pest_count_per_plant: 0.760 }
              as: IPMScout
              as_user_id: "${wc83}"
            - call: "GET /zones/${zc83}"
              as: GrowerManager
              captures: { zc83_p2: $.data.ipm_posture, zc83_c2: $.data.open_pest_alert_count }
          assert:
            - "${zc83_c0} == 0"
            - "${zc83_p0} == NORMAL"
            - "${zc83_c1} == 1"
            - "${zc83_p1} == SCOUT_ALERT"
            - "0.500 equals the WHITEFLY threshold exactly, so the AT boundary opens an alert"
            - "${zc83_c2} == 2"
            - "${zc83_p2} == LOCKED"
            - "0.760 is just above the APHID threshold of 0.75, so the second alert lands and the count reaches PEST_ALERT_LOCK_COUNT 2"
            - "Zone.${zc83}.reentry_clear_at == null, because no biological release has been executed yet"

      - name: cascading_side_effects_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: drainage_reading_cascade_locks_irrigation_then_flags_nutrient_stress
          rationale: |
            The §1.8 transitive_cascade instance is the layer's end-to-end proof: it verifies a depth-3
            chain, captures the intermediate state to show each hop had not yet fired, and asserts the final
            fields on three different entities.

      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: energy_cost_projected_and_settled_with_chp_diverge_on_one_strategy
          rationale: |
            The layer is active because ClimateStrategy and CommitmentWeek both carry projected and settled
            figures. The §1.8 dual_variant_calc instance covers the energy pair on one row including the CHP
            allocation split, so a breadth copy would add no new claim.

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_consistency_makes_the_ipm_lock_cascade_visible_on_the_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Zone.ipm_posture.SCOUT_ALERT_to_LOCKED
          - state_machines.LaborTask.SCHEDULED_to_CANCELLED
          - entities.CropCycle.fields.labor_shortfall_flag
        test_recipe:
          setup:
            - "Clock at 2026-08-06T00:00:00Z, one zone with a 20000.00 USD labor budget, one crop cycle in TRANSPLANTED."
            - "One ACTIVE HARVEST worker at 19.50 USD/h with productivity_index 1.00 and one SCOUT worker."
            - "One SCHEDULED future HARVEST task for 4000 units at a 500 units/hour standard, so 156.00 USD is committed."
            - "One above-threshold observation has already moved the zone to SCOUT_ALERT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T00:00:00Z" }
              as: GrowerManager
            - call: "POST /zones"
              payload: { code: "ZC-90", area_sqft: 9450, glazing_type: "GLASS", has_thermal_screen: true, has_supplemental_lighting: true, chp_connected: true, hive_slot_capacity: 8, labor_budget_usd: 20000.00 }
              as: GrowerManager
              captures: { zc90: $.data.id }
            - call: "POST /varieties"
              payload: { name: "Merlice TOV", crop_type: "TOMATO", cycle_length_weeks: 13, first_harvest_week: 4, plant_density_per_sqft: 0.24, yield_curve_lbs_per_sqft: [0.4, 0.8, 1.1, 1.3, 1.3, 1.2, 1.0, 0.9, 0.7, 0.5], grade_a_ratio_pct: 60, requires_pollination: true, ec_target_ms: 3.0 }
              as: GrowerManager
              captures: { vc90: $.data.id }
            - call: "POST /crop-cycles"
              payload: { zone_id: "${zc90}", variety_id: "${vc90}", transplant_date: "2026-08-03", plants_transplanted: 2157 }
              as: GrowerManager
              captures: { cc90: $.data.id }
            - call: "POST /crop-cycles/${cc90}/transitions"
              payload: { to_status: "TRANSPLANTED" }
              as: GrowerManager
            - call: "POST /workers"
              payload: { full_name: "Petra Lund", skill: "HARVEST", hourly_rate_usd: 19.50, productivity_index: 1.00, status: "ACTIVE" }
              as: GrowerManager
              captures: { wh90: $.data.id }
            - call: "POST /workers"
              payload: { full_name: "Sera Vos", skill: "SCOUT", hourly_rate_usd: 21.00, productivity_index: 1.00, status: "ACTIVE" }
              as: GrowerManager
              captures: { ws90: $.data.id }
            - call: "POST /labor-tasks"
              payload: { zone_id: "${zc90}", crop_cycle_id: "${cc90}", worker_id: "${wh90}", task_type: "HARVEST", window_start: "2026-08-07T07:00:00Z", window_end: "2026-08-07T16:00:00Z", planned_units: 4000, standard_units_per_hour: 500 }
              as: GrowerManager
              captures: { tk90: $.data.id, tk90_cost: $.data.planned_cost_usd }
            - call: "POST /scouting-observations"
              payload: { zone_id: "${zc90}", crop_cycle_id: "${cc90}", observed_at: "2026-08-06T07:00:00Z", pest_code: "WHITEFLY", plants_inspected: 60, pest_count_per_plant: 0.800 }
              as: IPMScout
              as_user_id: "${ws90}"
            - call: "GET /zones/${zc90}"
              as: GrowerManager
              captures: { zc90_mid_posture: $.data.ipm_posture, zc90_mid_committed: $.data.labor_budget_committed_usd }
          trigger:
            - call: "POST /scouting-observations"
              payload: { zone_id: "${zc90}", crop_cycle_id: "${cc90}", observed_at: "2026-08-06T08:00:00Z", pest_code: "THRIPS", plants_inspected: 60, pest_count_per_plant: 1.100 }
              as: IPMScout
              as_user_id: "${ws90}"
              captures: { obs_status: $.data.threshold_status }
            - call: "GET /labor-tasks/${tk90}"
              as: GrowerManager
              captures: { tk90_status: $.data.status, tk90_reason: $.data.cancel_reason }
            - call: "GET /zones/${zc90}"
              as: GrowerManager
              captures: { zc90_posture: $.data.ipm_posture, zc90_committed: $.data.labor_budget_committed_usd, zc90_remaining: $.data.labor_budget_remaining_usd }
            - call: "GET /crop-cycles/${cc90}"
              as: GrowerManager
              captures: { cc90_shortfall: $.data.labor_shortfall_flag }
          assert:
            - "${tk90_cost} == 156.00"
            - "${zc90_mid_posture} == SCOUT_ALERT"
            - "${zc90_mid_committed} == 156.00"
            - "${obs_status} == ABOVE"
            - "the very next read shows the whole cascade with no delay, retry or polling, because the consistency model is immediate"
            - "${tk90_status} == CANCELLED"
            - "${tk90_reason} == IPM_POSTURE_LOCK"
            - "${zc90_posture} == LOCKED"
            - "${zc90_committed} == 0.00"
            - "${zc90_remaining} == 20000.00"
            - "${cc90_shortfall} == true"
            - "Worker.${wh90}.committed_hours == 0.00"
