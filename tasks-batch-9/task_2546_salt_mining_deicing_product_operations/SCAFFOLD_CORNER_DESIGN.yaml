          assert:
            - "${tc} == 940.00 before the trigger"
            - "the allocate response already reports ${w_status} == ALLOCATED, ${w_alloc} == 500.00 and ${w_short} == 0 — no second call is needed to see them"
            - "${r_status} == ${w_status} and ${r_alloc} == ${w_alloc}"
            - "${r_res} == 500.00 and ${r_avail} == 440.00"
            - "${r_reserved} == 500.00 and ${r_util} == 18.80 (940.00 of 5000 covered tons; reserving does not change stored tonnage)"
