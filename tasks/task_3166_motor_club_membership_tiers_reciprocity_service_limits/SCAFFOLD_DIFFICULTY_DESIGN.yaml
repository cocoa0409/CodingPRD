              as: ClubAdmin
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club_nca}", primary_member_name: "Pat Primary", primary_member_email: "pat@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
              captures: { m1: $.data.id }
            - call: "POST /motor-club/memberships/${m1}/household-members"
              payload: { full_name: "Sam Spouse", relationship: "SPOUSE", date_of_birth: "1982-01-01T00:00:00Z" }
              as: MemberServicesRep
              captures: { hm2: $.data.id }
            - call: "DELETE /motor-club/household-members/${hm2}"
              payload: {}
              as: MemberServicesRep
            - call: "POST /motor-club/memberships/${m1}/lapse"
              payload: {}
              as: MemberServicesRep
          trigger:
            - call: "POST /motor-club/service-calls"
              payload: { membership_id: "${m1}", requesting_member_id: "${hm2}", service_type: "TOW", breakdown_location_state: "CA", requested_tow_miles: 10 }
              as: Dispatcher
              captures: { err1: $.data.error_id }
          assert:
            - "error_id == ERR_MEMBERSHIP_NOT_SERVICEABLE (priority 9 referential check beats priority 10 member-coverage check)"
            - "http status == 422"
