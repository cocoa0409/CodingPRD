              captures: { t1_status: $.data.status }
            - call: "GET /agdata/consent-tickets/${ticket2_id}"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { t2_status: $.data.status }
          assert:
            - "SoftwarePackage.${pkg_id}.status == WITHDRAWN"
            - "d1_status == CANCELLED and d2_status == CANCELLED (cascade link 1 covers both AWAITING_CONSENT and CONSENT_GRANTED)"
            - "t1_status == REVOKED and t2_status == REVOKED (cascade link 2 covers both REQUESTED and GRANTED tickets)"

