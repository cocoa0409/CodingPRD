              captures: { d24_ord_v2: $.data.version, d24_t2: $.data.total_price_cents, d24_f2: $.data.amount_financed_cents, d24_dep2: $.data.deposit_cents }
            - call: "POST /api/sales-orders/${d24_ord}/financing-applications"
              payload: { financing_type: "CHATTEL", lender_name: "Cascade Finance", term_months: 240, down_payment_cents: 473600, expected_sales_order_version: "${d24_ord_v2}" }
              as: SalesConsultant
              captures: { d24_app: $.data.id }
            - call: "POST /api/financing-applications/${d24_app}/submit"
              as: SalesConsultant
            - call: "POST /api/sales-orders/${d24_ord}/trade-in-appraisals"
              payload: { declared_model_year: 2012, declared_condition: "B", model_id: "${d24_mdl}" }
              as: SalesConsultant
              captures: { d24_ta: $.data.id }
            - call: "POST /api/trade-in-appraisals/${d24_ta}/inspect"
              payload: { appraised_value_cents: 1500000, reconditioning_cost_cents: 400000, condition_grade: "B" }
              as: Appraiser
            - call: "POST /api/trade-in-appraisals/${d24_ta}/offer"
              as: Appraiser
          trigger:
            - call: "POST /api/trade-in-appraisals/${d24_ta}/decide"
              payload: { decision: "ACCEPT" }
              as: Customer
              as_user_id: "${d24_cust}"
            - call: "GET /api/sales-orders/${d24_ord}"
              as: SalesConsultant
              captures: { d24_t3: $.data.total_price_cents, d24_dep3: $.data.deposit_cents, d24_cr3: $.data.trade_in_credit_cents, d24_f3: $.data.amount_financed_cents }
          assert:
            - "after void compensation: total_price_cents == 9471997 and amount_financed_cents == 9471997 (option C fully backed out; invariant 9471997 == 0 + 0 + 9471997)"
            - "after confirm: 9471997 == 473600 + 0 + 8998397"
            - "after trade-in accept: 9471997 == 473600 + 1100000 + 7898397 (invariant holds with all three legs nonzero)"
            - "total_price_cents is unchanged by the trade-in cycle (9,471,997 at every checkpoint)"

      - name: crew_capacity_conservation_across_cancel
        grounds: ["calculations.crew_day_capacity", "state_machines.TransportJob.SCHEDULED_to_CANCELLED", "entities.TransportCrew.fields.booked_dates"]
        distinguishing_aspect: |
          Conserved quantity: per-date crew section capacity. Booking consumes
          exactly sections_count per window date; cancelling the booking
          restores exactly the same amount (booked_dates returns to []), and an
          identical re-booking afterwards succeeds — no capacity leaks.
        test_recipe:
          setup:
            - "FINANCING_APPROVED canonical community order; crew capacity 2"
          setup_api_calls:
            - call: "POST /api/home-models"
              payload: { model_code: "DW-2860", name: "Pride 2860", floor_plan_type: "DOUBLE_WIDE", section_count: 2, width_ft: 28, length_ft: 60, base_price_cents: 9500000, factory_lead_time_days: 30 }
              as: DealershipAdmin
              captures: { d25_mdl: $.data.id }
            - call: "POST /api/communities"
              payload: { name: "Pinewood MHC", address: "12 Pine Rd", lot_rent_cents: 45000 }
              as: DealershipAdmin
              captures: { d25_com: $.data.id }
            - call: "POST /api/communities/${d25_com}/lots"
              payload: { lot_number: "A-01", max_sections: 2, max_length_ft: 70, utilities_ready: true }
              as: DealershipAdmin
              captures: { d25_lot: $.data.id }
            - call: "POST /api/lots/${d25_lot}/reserve"
              as: SalesConsultant
            - call: "POST /api/customers"
              payload: { full_name: "Alicia Buyer", email: "alicia@x.com", phone: "555-0100", credit_tier: "TIER_A" }
              as: SalesConsultant
              captures: { d25_cust: $.data.id }
            - call: "POST /api/home-units"
              payload: { model_id: "${d25_mdl}", serial_number: "SN-D25-1", unit_kind: "STOCK", condition_grade: "NEW" }
              as: DealershipAdmin
              captures: { d25_unit: $.data.id }
            - call: "POST /api/sales-orders"
              payload: { customer_id: "${d25_cust}", home_unit_id: "${d25_unit}", placement_type: "COMMUNITY_LOT", lot_id: "${d25_lot}", financing_type: "CHATTEL", agreed_home_price_cents: 9200000 }
              as: SalesConsultant
              captures: { d25_ord: $.data.id }
            - call: "POST /api/sales-orders/${d25_ord}/options"
              payload: { option_code: "OPT-APP", description: "Appliance package", unit_price_cents: 125050, quantity: 2 }
              as: SalesConsultant
            - call: "POST /api/sales-orders/${d25_ord}/options"
              payload: { option_code: "OPT-EXT", description: "Exterior package", unit_price_cents: 89999, quantity: 1 }
              as: SalesConsultant
            - call: "POST /api/sales-orders/${d25_ord}/confirm"
              payload: { deposit_cents: 473600 }
              as: SalesConsultant
              captures: { d25_ord_v: $.data.version }
            - call: "POST /api/sales-orders/${d25_ord}/site-evaluations"
              payload: { scheduled_date: "2026-08-05T09:00:00Z", evaluator_id: "eval-1", expected_sales_order_version: "${d25_ord_v}" }
              as: SalesConsultant
              captures: { d25_ev: $.data.id }
            - call: "POST /api/site-evaluations/${d25_ev}/record-findings"
              payload: { foundation_type: "PIERS", utilities_verified: true, permit_number: "P-100", findings_result: "PASS", install_estimate_cents: 350000 }
              as: SiteEvaluator
              as_user_id: "eval-1"
            - call: "POST /api/site-evaluations/${d25_ev}/approve"
              as: InstallationManager
            - call: "GET /api/sales-orders/${d25_ord}"
              as: SalesConsultant
              captures: { d25_ord_v2: $.data.version }
            - call: "POST /api/sales-orders/${d25_ord}/financing-applications"
              payload: { financing_type: "CHATTEL", lender_name: "Cascade Finance", term_months: 240, down_payment_cents: 473600, expected_sales_order_version: "${d25_ord_v2}" }
              as: SalesConsultant
              captures: { d25_app: $.data.id }
            - call: "POST /api/financing-applications/${d25_app}/submit"
              as: SalesConsultant
            - call: "POST /api/financing-applications/${d25_app}/decide"
              payload: { decision: "APPROVE", apr_bps: 725 }
              as: LenderAgent
            - call: "POST /api/transport-crews"
              payload: { name: "Crew Alpha", crew_size: 4, can_set_multiwide: true, max_sections_per_window: 2 }
              as: DealershipAdmin
              captures: { d25_crew: $.data.id }
          trigger:
            - call: "POST /api/sales-orders/${d25_ord}/transport-jobs"
              payload: { home_unit_id: "${d25_unit}", crew_id: "${d25_crew}", origin: "DEALER_LOT", distance_miles: 180, scheduled_start_date: "2026-08-20T08:00:00Z", escort_vehicle_count: 2 }
              as: TransportCoordinator
              captures: { d25_job: $.data.id }
            - call: "GET /api/transport-crews/${d25_crew}"
              as: DealershipAdmin
              captures: { d25_booked_1: $.data.booked_dates }
            - call: "POST /api/transport-jobs/${d25_job}/cancel"
              as: TransportCoordinator
            - call: "GET /api/transport-crews/${d25_crew}"
              as: DealershipAdmin
              captures: { d25_booked_2: $.data.booked_dates }
            - call: "POST /api/sales-orders/${d25_ord}/transport-jobs"
              payload: { home_unit_id: "${d25_unit}", crew_id: "${d25_crew}", origin: "DEALER_LOT", distance_miles: 180, scheduled_start_date: "2026-08-20T08:00:00Z", escort_vehicle_count: 2 }
              as: TransportCoordinator
              captures: { d25_job2: $.data.id }
          assert:
            - "after booking: TransportCrew.${d25_crew}.booked_dates == ['2026-08-20', '2026-08-21'] (2 sections x 2 window days at capacity 2)"
            - "after cancel: booked_dates == [] (capacity fully restored; conserved)"
            - "identical re-booking succeeds (201) — the cancelled job consumes nothing"
