  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: retake_complete_cascade_depth3
        grounds:
          - state_machines.RetouchOrder.APPROVED_to_DONE
          - state_machines.Photo.RETAKE_REQUESTED_to_RETAKEN
          - entities.Photo.fields.retake_of_photo_id
          - entities.RetouchOrder.fields.replacement_photo_id
          - entities.PictureDaySession.fields.retouch_credit_balance_cents
        distinguishing_aspect: |
          Depth-3 cascade originating from RetouchOrder complete: completing the RETAKE order (A: RT
          -> DONE) causes the linked Photo to transition (B: PH RETAKE_REQUESTED -> RETAKEN), which
          itself causes the creation of a replacement Photo (C: new Photo MATCHED with
          retake_of_photo_id = PH). Each link is caused by the previous, not by the trigger directly.
        test_recipe:
          setup:
            - "Session CAPTURE_OPEN, budget 50000; PH MATCHED to S; RETAKE order RT APPROVED (net 1500 reserved, balance 48500)."
          setup_api_calls:
            - call: "POST /api/picture-day-sessions"
              payload: { school_name: "Fir School", scheduled_date: "2026-05-07T00:00:00Z", gallery_closes_at: "2026-12-31T00:00:00Z", retouch_budget_cents: 50000 }
              as: SchoolCoordinator
              captures: { sess: $.data.id }
            - call: "POST /api/packages"
              payload: { picture_day_session_id: "${sess}", sku: "B", name: "Basic", tier: "BASIC", base_price_cents: 2499 }
              as: SchoolCoordinator
              captures: { pkgB: $.data.id }
            - call: "POST /api/students"
              payload: { picture_day_session_id: "${sess}", full_name: "Kid X", grade: "4", homeroom: "Q", guardian_user_id: "g1" }
              as: SchoolCoordinator
              captures: { s1: $.data.id }
