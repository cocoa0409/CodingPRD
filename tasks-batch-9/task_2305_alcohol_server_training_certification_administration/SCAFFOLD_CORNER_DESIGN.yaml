  #   ERR_UNAUTHENTICATED, ERR_INVALID_REQUEST, ERR_MANDATE_TRACK_MISMATCH,
  #   ERR_IDENTITY_ALREADY_REGISTERED, ERR_DUPLICATE_APPROVAL_REQUEST,
  #   ERR_DUPLICATE_ENROLLMENT, ERR_SESSION_AT_CAPACITY, ERR_ATTENDANCE_INCOMPLETE,
  #   ERR_EXAM_WINDOW_NOT_OPEN, ERR_SESSION_WINDOW_IN_PAST,
  #   ERR_PROCTOR_SEPARATION_REQUIRED, ERR_RETAKE_COOLING_OFF,
  #   ERR_RETAKE_LIMIT_EXCEEDED, ERR_APPROVAL_NOT_EFFECTIVE,
  #   ERR_ACCOUNT_INVALID_STATE, ERR_COMPLIANCE_RATE_TOO_LOW -> section validations
  #   ERR_CATALOG_NOT_FOUND, ERR_TRAINING_NOT_FOUND, ERR_CREDENTIAL_NOT_FOUND,
  #   ERR_EMPLOYER_NOT_FOUND -> sections entities and endpoints
  #   ERR_COURSE_INVALID_STATE, ERR_TRAINER_INVALID_STATE, ERR_EMPTY_ROSTER,
  #   ERR_SUBMISSION_INVALID_STATE -> section state_machines
  #   ERR_ENROLLMENT_INVALID_STATE -> section endpoints
  #   ERR_APPROVAL_INVALID_STATE, ERR_CERTIFICATE_INVALID_STATE,
  #   ERR_INSUFFICIENT_SEAT_CREDITS, ERR_DUPLICATE_ASSIGNMENT -> this section
  #   ERR_ROLE_NOT_PERMITTED, ERR_NOT_RESOURCE_OWNER -> section rbac
  #   ERR_STALE_SESSION_VERSION, ERR_STALE_COURSE_VERSION,
  #   ERR_STALE_ACCOUNT_VERSION -> section cross-cutting complexity layers
  #   ERR_SESSION_INVALID_STATE, ERR_TRAINER_NOT_CERTIFIED,
  #   ERR_TRAINER_SCHEDULE_CONFLICT, ERR_SERVER_SESSION_OVERLAP,
  #   ERR_APPROVAL_STALE_CONTENT, ERR_SERVER_WORK_RESTRICTED ->
  #   SCAFFOLD_DIFFICULTY_DESIGN.yaml (see the stubs in section validations)
  - section: errors
    instances:
      - name: a_decided_approval_refuses_both_a_second_decision_and_a_resubmission
        claim_type: Violation → Error
        grounds:
          - errors.ERR_APPROVAL_INVALID_STATE
          - validations.priority_11_ERR_APPROVAL_INVALID_STATE
          - state_machines.CourseApproval.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          ERR_APPROVAL_INVALID_STATE (409) guards both directions of the approval workflow
          from an APPROVED row: a second decision is refused because a decision needs
          SUBMITTED, and a resubmit is refused because resubmit needs CHANGES_REQUESTED or
          STALE. The approval_number and decided_at from the first decision are unchanged.
        test_recipe:
          setup:
            - "A TX MANDATORY jurisdiction and a PUBLISHED ON_PREMISE course whose TX approval was APPROVED at 2026-08-03T09:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /state-jurisdictions"
              payload: { state_code: "TX", mandate_type: "MANDATORY", mandated_tracks: ["ON_PREMISE", "OFF_PREMISE"] }
              as: ProgramAdmin
              captures: { tx_id: $.data.id }
            - call: "POST /courses"
              payload: { title: "TIPS On-Premise Core", track: "ON_PREMISE", delivery_mode: "CLASSROOM", contact_hours: 4, question_count: 40, version_label: "v1" }
              as: ProgramAdmin
              captures: { course_id: $.data.id }
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /course-approvals"
              payload: { course_id: "${course_id}", state_jurisdiction_id: "${tx_id}", submission_note: "initial filing" }
              as: ProgramAdmin
              captures: { appr_id: $.data.id }
            - call: "POST /course-approvals/${appr_id}/decision"
              payload: { decision: "APPROVE", approval_number: "TX-ABC-2026-001", effective_from: "2026-08-01T00:00:00Z", expires_at: "2027-08-01T00:00:00Z" }
              as: StateRegulator
          trigger:
            - call: "POST /course-approvals/${appr_id}/decision"
              payload: { decision: "REJECT", changes_requested_note: "second look" }
              as: StateRegulator
            - call: "POST /course-approvals/${appr_id}/resubmit"
              payload: {}
              as: ProgramAdmin
          assert:
            - "the second decision returns 409 with error.code == 'ERR_APPROVAL_INVALID_STATE'"
            - "the resubmit returns 409 with error.code == 'ERR_APPROVAL_INVALID_STATE'"
            - "CourseApproval.${appr_id}.approval_status == 'APPROVED', approval_number == 'TX-ABC-2026-001', decided_at == '2026-08-03T09:00:00Z' and review_round == 1"

