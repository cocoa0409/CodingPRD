  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_party_buffer_makes_adjacent_window_conflict_but_same_slot_on_another_party_legal
        grounds:
          - calculations.crew_window_overlap
          - validations[priority=22]
          - errors.ERR_CREW_WINDOW_CONFLICT
          - entities.Party.fields.mobilization_buffer_minutes
        distinguishing_aspect: |
          Resource: the Party crew calendar, with half-open intervals inflated by a symmetric
          90-minute mobilization buffer. Exact adjacency at 12:00:00Z against an existing
          08:00-12:00 window is a conflict, the first legal start is exactly 13:30:00Z, and the very
          interval that was refused on the roofer is accepted on the solar contractor because the
          resource is per-party. Interval semantics here are buffered half-open on a per-party
          calendar - unlike the other instance in this rule, which counts a shared per-day quota.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "The roofer Party is created with mobilization_buffer_minutes 90; the solar contractor Party keeps the default 120."
            - "A HOST_OWNED project consented by roofer and solar owner, so posture is OPEN and windows may be created."
            - "One SCHEDULED ROOFING window exists on the roofer for 2026-08-05T08:00:00Z .. 2026-08-05T12:00:00Z."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/parties"
              payload: { name: "Ridgeline Roofing", party_type: "ROOFER", contact_email: "ops@ridgeline.example", mobilization_buffer_minutes: 90 }
