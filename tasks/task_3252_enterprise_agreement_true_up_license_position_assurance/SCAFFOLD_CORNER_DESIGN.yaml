          trigger:
            - call: "POST /licensing/products"
              payload: { sku: "DUP1", name: "Dup Cal 2", license_model: "PER_USER", license_kind: "SUBSCRIPTION", edition: "STANDARD", family: "CAL", annual_unit_price_cents: 90000, license_mobility: false }
              as: ProgramAdministrator
              captures: { err1: $.data.error_id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-DUP-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { err2: $.data.error_id }
            - call: "POST /licensing/agreements/${agr_id}/entitlements"
              payload: { product_id: "${prod_id}", quantity: 5 }
              as: LicensingSpecialist
              captures: { err3: $.data.error_id }
          assert:
            - "duplicate sku fails with ERR_DUPLICATE_SKU (409)"
            - "duplicate enrollment_number fails with ERR_DUPLICATE_ENROLLMENT (409)"
            - "duplicate entitlement pair fails with ERR_DUPLICATE_ENTITLEMENT (409)"
      - name: error_license_mobility_required_on_authorization
        claim_type: violation_to_error
        grounds:
          - validations[priority=22]
          - errors[ERR_LICENSE_MOBILITY_REQUIRED]
        distinguishing_aspect: "Hosting authorization for a product with license_mobility false fails with ERR_LICENSE_MOBILITY_REQUIRED."
        test_recipe:
          setup: ["ACTIVE agreement; product NM1 with license_mobility false"]
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "NM Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-NM-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/products"
              payload: { sku: "NM1", name: "NoMob Srv", license_model: "PER_SERVER_CORE", license_kind: "SUBSCRIPTION", edition: "STANDARD", family: "SRV", annual_unit_price_cents: 50000, license_mobility: false }
              as: ProgramAdministrator
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /licensing/agreements/${agr_id}/hosting-authorizations"
              payload: { product_id: "${prod_id}", provider_name: "HosterCo", effective_on: "2026-09-01" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_LICENSE_MOBILITY_REQUIRED (422)"
      - name: commitment_consumption_after_expiry_marks_expired
        claim_type: violation_to_error
        grounds:
          - validations[priority=18]
          - errors[ERR_COMMITMENT_EXPIRED]
          - state_machines.CloudCommitment.ACTIVE_to_EXPIRED
        distinguishing_aspect: "Consumption against a commitment whose expires_on passed returns ERR_COMMITMENT_EXPIRED AND transitions the commitment to EXPIRED (observable side effect on the error path)."
        test_recipe:
          setup: ["ACTIVE commitment expiring 2026-12-31; clock advanced to 2027-01-15"]
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "CX Org", qualified_device_count: 100 }
