          The occupied resource is the VENDOR-DAY, not the engagement: the collision
          counter aggregates every row with the same vendor_id and service_date across
          aggregate boundaries, so a second engagement's assignment on 2026-06-16 is
          refused with ERR_VENDOR_DAILY_CAPACITY_EXCEEDED against a daily_capacity of 1
