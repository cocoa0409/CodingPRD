            - call: "POST /pentest/scope-items"
              payload: { test_plan_id: "${plan_id}", asset_id: "${asset_a_id}", justification: "Officer proposing scope", requested_engagement_hours: 40, expected_test_plan_version: "${pv1}" }
              as: ComplianceOfficer
