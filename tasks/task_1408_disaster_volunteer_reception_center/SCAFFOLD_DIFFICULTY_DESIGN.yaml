            - { call: "POST /vrc/credentials", payload: { volunteer_id: "${vol}", skill_code: "GENERAL_LABOR", credential_class: "STANDARD", expires_at: "2026-09-01T00:00:00Z" }, as: IntakeCoordinator, captures: { cred: $.data.id } }
            - { call: "POST /vrc/volunteers/${vol}/submit-for-vetting", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/background-checks", payload: { volunteer_id: "${vol}" }, as: VettingOfficer, captures: { bg: $.data.id } }
            - { call: "POST /vrc/background-checks/${bg}/clear", payload: {}, as: VettingOfficer, as_user_id: "vet-1" }
            - { call: "POST /vrc/credentials/${cred}/verify", payload: {}, as: VettingOfficer, as_user_id: "vet-1" }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol}", clearance_type: "SAFETY_BRIEFING" }, as: IntakeCoordinator }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol}", clearance_type: "LIABILITY_WAIVER" }, as: IntakeCoordinator }
            - { call: "POST /vrc/volunteers/${vol}/mark-ready", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/support-requests", payload: { incident_id: "${inc}", requesting_agency: "County OES", site_name: "North Depot", required_skill: "GENERAL_LABOR", min_credential_class: "STANDARD", headcount_needed: 1, criticality: "STANDARD", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T20:00:00Z" }, as: AgencyCoordinator, captures: { req: $.data.id } }
            - { call: "POST /vrc/support-requests/${req}/publish", payload: {}, as: AgencyCoordinator }
