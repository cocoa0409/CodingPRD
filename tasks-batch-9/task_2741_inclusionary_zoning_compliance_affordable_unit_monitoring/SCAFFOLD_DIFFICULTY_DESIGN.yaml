            - { call: "POST /iz-compliance/regulatory-agreements", payload: { project_id: "${p_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { a_id: $.data.id } }
            - { call: "POST /iz-compliance/regulatory-agreements/${a_id}/record", payload: { doc_number: "DOC-KG-0001", recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${p_id}", agreement_id: "${a_id}", unit_number: "K-101", bedrooms: 2, sqft: 950, market_comparable_sqft: 1100, tenure: "OWNERSHIP", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-1", captures: { u_id: $.data.id } }
            - { call: "POST /iz-compliance/affordable-units/${u_id}/record-restriction", payload: { original_purchase_price_cents: 32500000, recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/households", payload: { applicant_name: "Owen Marsh", household_size: 3, gross_annual_income_cents: 6000000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { h_id: $.data.id } }
            - { call: "POST /iz-compliance/income-certifications", payload: { household_id: "${h_id}", unit_id: "${u_id}", certified_income_cents: 6000000, contract_rent_cents: 0, effective_date: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { cert_id: $.data.id } }
            - { call: "GET /iz-compliance/affordable-units/${u_id}", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { u_v1: $.data.version } }
            - { call: "POST /iz-compliance/resale-transactions", payload: { unit_id: "${u_id}", expected_unit_version: "${u_v1}", proposed_price_cents: 32000000, appraised_value_cents: 41000000, capital_improvements_cents: 0, deferred_maintenance_cents: 0, broker_fee_cents: 1000000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { t1_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-03-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/monitoring-reviews", payload: { unit_id: "${u_id}", review_year: 2027, reported_rent_cents: 0, reported_income_cents: 6000000, occupancy_verified: false }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { rev_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-04-05T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/monitoring-reviews/${rev_id}/submit-cure", payload: { corrected_rent_cents: 0 }, as: Developer, as_user_id: "dev-1" }
            - { call: "GET /iz-compliance/affordable-units/${u_id}", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { u_v2: $.data.version } }
