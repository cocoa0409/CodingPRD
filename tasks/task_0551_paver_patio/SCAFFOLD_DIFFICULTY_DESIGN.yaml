scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: project_valuation_estimate_vs_as_built
        grounds:
          - calculations.project_valuation
          - entities.Project.fields.estimated_total_cents
          - entities.Project.fields.final_billed_total_cents
        distinguishing_aspect: |
          On the Project domain, project_valuation diverges by variant: the estimate variant bills
          billable quantity (measured*(1+waste)) at generate-estimate -> 758565, while the as_built
          variant bills actual installed quantity (no waste) at COMPLETED -> 741453; same project,
          two valid billing methods, different totals.
        test_recipe:
          setup:
            - "Fresh DB. A CA project owned by customer 'cust', no HOA, wall_height 36 (no permit)."
            - "Lines: 250 sqft Holland paver (waste 0.10), 40 face-sqft wall (waste 0.10), 1 fire pit (EACH)."
            - "Driven to COMPLETED via a single is_final phase that records installed 260/40/1."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Dana Vale", email: "dv@x.com" }
              as: DesignConsultant
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "PAV-HOLLAND", name: "Holland Paver", category: "PAVER", unit: "SQFT", unit_price_cents: 850, waste_factor: 0.10, coverage_per_pallet_sqft: 120 }
              as: PlatformAdmin
              captures: { p_pav: $.data.id }
            - call: "POST /products"
              payload: { sku: "WALL-STONE", name: "Stone Wall", category: "WALL_BLOCK", unit: "FACE_SQFT", unit_price_cents: 2200, waste_factor: 0.10, coverage_per_pallet_sqft: 30 }
              as: PlatformAdmin
              captures: { p_wall: $.data.id }
            - call: "POST /products"
              payload: { sku: "FIRE-KIT", name: "Fire Pit Kit", category: "FIRE_PIT", unit: "EACH", unit_price_cents: 180000 }
              as: PlatformAdmin
              captures: { p_fire: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_address: "1 Yard Ln", region_code: "CA", in_hoa: false }
              as: DesignConsultant
              captures: { pid: $.data.id }
            - call: "POST /design-revisions"
              payload: { project_id: "${pid}" }
              as: DesignConsultant
              captures: { dr: $.data.id }
            - call: "POST /design-revisions/${dr}/render"
              payload: {}
              as: DesignConsultant
            - call: "POST /design-revisions/${dr}/submit-review"
              payload: {}
              as: DesignConsultant
            - call: "POST /design-revisions/${dr}/approve"
              payload: {}
              as: Client
              as_user_id: "${cust}"
            - call: "POST /site-measurements"
              payload: { project_id: "${pid}", zone_label: "rear patio", measured_sqft: 250, wall_height_in: 36 }
              as: DesignConsultant
            - call: "POST /line-items"
              payload: { project_id: "${pid}", product_id: "${p_pav}", measured_quantity: 250 }
              as: DesignConsultant
              captures: { l1: $.data.id }
            - call: "POST /line-items"
              payload: { project_id: "${pid}", product_id: "${p_wall}", measured_quantity: 40 }
              as: DesignConsultant
              captures: { l2: $.data.id }
            - call: "POST /line-items"
              payload: { project_id: "${pid}", product_id: "${p_fire}", measured_quantity: 1 }
              as: DesignConsultant
              captures: { l3: $.data.id }
            - call: "POST /projects/${pid}/generate-estimate"
              payload: {}
              as: DesignConsultant
              captures: { pv_est: $.data.version, est_total: $.data.estimated_total_cents }
            - call: "POST /draws"
              payload: { project_id: "${pid}", draw_type: "DEPOSIT", amount_cents: 75000, expected_project_version: "${pv_est}" }
              as: ProjectManager
              captures: { dep: $.data.id }
            - call: "POST /draws/${dep}/record-payment"
              payload: {}
              as: ProjectManager
            - call: "POST /projects/${pid}/submit-approvals"
              payload: {}
              as: ProjectManager
            - call: "POST /projects/${pid}/sign-contract"
              payload: {}
              as: Client
              as_user_id: "${cust}"
            - call: "POST /material-orders"
              payload: { project_id: "${pid}", requested_delivery_date: "2026-06-10", line_item_ids: ["${l1}", "${l2}", "${l3}"] }
              as: ProjectManager
              captures: { mo: $.data.id }
            - call: "POST /material-orders/${mo}/place"
              payload: {}
              as: ProjectManager
            - call: "POST /material-orders/${mo}/confirm-delivery"
              payload: {}
              as: ProjectManager
            - call: "POST /crews"
              payload: { name: "Crew A", region_code: "CA" }
              as: PlatformAdmin
              captures: { crew: $.data.id }
            - call: "POST /work-phases"
              payload: { project_id: "${pid}", phase_type: "FINAL_GRADE", covered_line_item_ids: ["${l1}", "${l2}", "${l3}"], is_final: true }
              as: ProjectManager
              captures: { wp: $.data.id }
            - call: "POST /work-phases/${wp}/schedule"
              payload: { crew_id: "${crew}", start_date: "2026-06-11", end_date: "2026-06-15" }
              as: ProjectManager
            - call: "POST /projects/${pid}/start-production"
              payload: {}
              as: ProjectManager
            - call: "POST /work-phases/${wp}/start"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /work-phases/${wp}/complete"
              payload: { installed_quantities: [ { line_item_id: "${l1}", quantity: 260 }, { line_item_id: "${l2}", quantity: 40 }, { line_item_id: "${l3}", quantity: 1 } ] }
              as: ProjectManager
          assert:
            - "Project.${pid}.status == COMPLETED"
            - "Project.${pid}.estimated_total_cents == 758565"
            - "Project.${pid}.final_billed_total_cents == 741453"
            - "Project.${pid}.final_billed_total_cents != Project.${pid}.estimated_total_cents"

      - name: change_order_recompute_vs_line_delta
        grounds:
          - calculations.change_order_price_delta
          - entities.ChangeOrder.fields.price_delta_cents
          - state_machines.ChangeOrder.PROPOSED_to_APPROVED
        distinguishing_aspect: |
          On the ChangeOrder domain (different entity than the Project instance above), price_delta
          diverges: RECOMPUTE re-tiers ALL paver sqft (180->280 crosses the 200-sqft labor tier,
          700->600) yielding 142279, whereas the line_delta method prices only the added 100 sqft at
          the new tier yielding 160279 (an 18000 gap from the un-re-tiered original sqft).
        test_recipe:
          setup:
            - "Fresh DB. CONTRACTED CA project, no HOA, no permit; one 180-sqft Holland paver line."
            - "contract_value_cents == 306502 after signing."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cody Ord", email: "co@x.com" }
              as: DesignConsultant
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "PAV-HOLLAND", name: "Holland Paver", category: "PAVER", unit: "SQFT", unit_price_cents: 850, waste_factor: 0.10, coverage_per_pallet_sqft: 120 }
              as: PlatformAdmin
              captures: { p_pav: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_address: "2 Yard Ln", region_code: "CA", in_hoa: false }
              as: DesignConsultant
              captures: { pid: $.data.id }
            - call: "POST /design-revisions"
              payload: { project_id: "${pid}" }
              as: DesignConsultant
              captures: { dr: $.data.id }
            - call: "POST /design-revisions/${dr}/render"
              payload: {}
              as: DesignConsultant
            - call: "POST /design-revisions/${dr}/submit-review"
              payload: {}
              as: DesignConsultant
            - call: "POST /design-revisions/${dr}/approve"
              payload: {}
              as: Client
              as_user_id: "${cust}"
            - call: "POST /site-measurements"
              payload: { project_id: "${pid}", zone_label: "patio", measured_sqft: 180, wall_height_in: 0 }
              as: DesignConsultant
            - call: "POST /line-items"
              payload: { project_id: "${pid}", product_id: "${p_pav}", measured_quantity: 180 }
              as: DesignConsultant
              captures: { l1: $.data.id }
            - call: "POST /projects/${pid}/generate-estimate"
              payload: {}
              as: DesignConsultant
              captures: { pv_est: $.data.version }
            - call: "POST /draws"
              payload: { project_id: "${pid}", draw_type: "DEPOSIT", amount_cents: 30000, expected_project_version: "${pv_est}" }
              as: ProjectManager
              captures: { dep: $.data.id }
            - call: "POST /draws/${dep}/record-payment"
              payload: {}
              as: ProjectManager
            - call: "POST /projects/${pid}/submit-approvals"
              payload: {}
              as: ProjectManager
            - call: "POST /projects/${pid}/sign-contract"
              payload: {}
              as: Client
              as_user_id: "${cust}"
              captures: { sign_v: $.data.version }
          trigger:
            - call: "POST /change-orders"
              payload: { project_id: "${pid}", description: "add 100 sqft paver", add_product_id: "${p_pav}", add_measured_quantity: 100, expected_project_version: "${sign_v}" }
              as: ProjectManager
              captures: { co: $.data.id }
            - call: "POST /change-orders/${co}/approve"
              payload: {}
              as: ProjectManager
              captures: { delta: $.data.price_delta_cents }
          assert:
            - "ChangeOrder.${co}.price_delta_cents == 142279"
            - "ChangeOrder.${co}.status == APPROVED"
            - "Project.${pid}.contract_value_cents == 448781"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: labor_tier_plus_complex_site_multiplier
        grounds:
          - calculations.labor_cost
          - calculations.project_valuation
          - entities.Project.fields.estimated_total_cents
        distinguishing_aspect: |
          Mode (a) non-linear interaction of >=3 inputs: paver_sqft 300 selects the flat 600 c/sqft
          tier, wall_height 48 applies the 1.15 complex-site multiplier to base paver labor
          (round(300*600*1.15)=207000, not 180000), wall_sqft 50 adds 45000, and permit_fee 35000
          layers on -> estimated_total_cents 717609.
        test_recipe:
          setup:
            - "Fresh DB. CA project, no HOA, one 300-sqft paver line, one 50 face-sqft wall line, wall_height 48."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Lena Bor", email: "lb@x.com" }
              as: DesignConsultant
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "PAV-HOLLAND", name: "Holland Paver", category: "PAVER", unit: "SQFT", unit_price_cents: 850, waste_factor: 0.10, coverage_per_pallet_sqft: 120 }
              as: PlatformAdmin
              captures: { p_pav: $.data.id }
            - call: "POST /products"
              payload: { sku: "WALL-STONE", name: "Stone Wall", category: "WALL_BLOCK", unit: "FACE_SQFT", unit_price_cents: 2200, waste_factor: 0.10, coverage_per_pallet_sqft: 30 }
              as: PlatformAdmin
              captures: { p_wall: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_address: "3 Yard Ln", region_code: "CA", in_hoa: false }
              as: DesignConsultant
              captures: { pid: $.data.id }
            - call: "POST /design-revisions"
              payload: { project_id: "${pid}" }
              as: DesignConsultant
              captures: { dr: $.data.id }
            - call: "POST /design-revisions/${dr}/render"
              payload: {}
              as: DesignConsultant
            - call: "POST /design-revisions/${dr}/submit-review"
              payload: {}
              as: DesignConsultant
            - call: "POST /design-revisions/${dr}/approve"
              payload: {}
              as: Client
              as_user_id: "${cust}"
            - call: "POST /site-measurements"
              payload: { project_id: "${pid}", zone_label: "seat wall", measured_sqft: 300, wall_height_in: 48 }
              as: DesignConsultant
            - call: "POST /line-items"
              payload: { project_id: "${pid}", product_id: "${p_pav}", measured_quantity: 300 }
              as: DesignConsultant
            - call: "POST /line-items"
              payload: { project_id: "${pid}", product_id: "${p_wall}", measured_quantity: 50 }
              as: DesignConsultant
          trigger:
            - call: "POST /projects/${pid}/generate-estimate"
              payload: {}
              as: DesignConsultant
              captures: { est: $.data.estimated_total_cents }
          assert:
            - "Project.${pid}.estimated_total_cents == 717609"
            - "Project.${pid}.permit_required == true"

      - name: material_order_pallet_round_per_line_then_sum
        grounds:
          - calculations.material_order_pallets
          - entities.MaterialOrder.fields.total_pallets
          - state_machines.MaterialOrder.DRAFT_to_PLACED
        distinguishing_aspect: |
          Mode (b) rounding-order: two paver lines of 130 and 100 sqft, coverage 120/pallet. Pinned
          round-per-line-then-sum gives ceil(130/120)+ceil(100/120)=2+1=3 pallets; the divergent
          sum-then-round gives ceil(230/120)=2. total_pallets == 3.
        test_recipe:
          setup:
            - "Fresh DB. CONTRACTED CA project with two zero-waste paver lines (130, 100 sqft), coverage 120."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Pat Pallet", email: "pp@x.com" }
              as: DesignConsultant
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "PAV-PLAIN", name: "Plain Paver", category: "PAVER", unit: "SQFT", unit_price_cents: 850, waste_factor: 0, coverage_per_pallet_sqft: 120 }
              as: PlatformAdmin
              captures: { p_pav: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_address: "4 Yard Ln", region_code: "CA", in_hoa: false }
              as: DesignConsultant
              captures: { pid: $.data.id }
            - call: "POST /design-revisions"
              payload: { project_id: "${pid}" }
              as: DesignConsultant
              captures: { dr: $.data.id }
            - call: "POST /design-revisions/${dr}/render"
              payload: {}
              as: DesignConsultant
            - call: "POST /design-revisions/${dr}/submit-review"
              payload: {}
              as: DesignConsultant
            - call: "POST /design-revisions/${dr}/approve"
              payload: {}
              as: Client
              as_user_id: "${cust}"
            - call: "POST /site-measurements"
              payload: { project_id: "${pid}", zone_label: "patio", measured_sqft: 230, wall_height_in: 0 }
              as: DesignConsultant
            - call: "POST /line-items"
              payload: { project_id: "${pid}", product_id: "${p_pav}", measured_quantity: 130 }
              as: DesignConsultant
              captures: { l1: $.data.id }
            - call: "POST /line-items"
              payload: { project_id: "${pid}", product_id: "${p_pav}", measured_quantity: 100 }
              as: DesignConsultant
              captures: { l2: $.data.id }
            - call: "POST /projects/${pid}/generate-estimate"
              payload: {}
              as: DesignConsultant
              captures: { pv_est: $.data.version }
            - call: "POST /draws"
              payload: { project_id: "${pid}", draw_type: "DEPOSIT", amount_cents: 10000, expected_project_version: "${pv_est}" }
              as: ProjectManager
              captures: { dep: $.data.id }
            - call: "POST /draws/${dep}/record-payment"
              payload: {}
              as: ProjectManager
            - call: "POST /projects/${pid}/submit-approvals"
              payload: {}
              as: ProjectManager
            - call: "POST /projects/${pid}/sign-contract"
              payload: {}
              as: Client
              as_user_id: "${cust}"
            - call: "POST /material-orders"
              payload: { project_id: "${pid}", requested_delivery_date: "2026-06-20", line_item_ids: ["${l1}", "${l2}"] }
              as: ProjectManager
              captures: { mo: $.data.id }
          trigger:
            - call: "POST /material-orders/${mo}/place"
              payload: {}
              as: ProjectManager
              captures: { pallets: $.data.total_pallets }
          assert:
            - "MaterialOrder.${mo}.total_pallets == 3"
            - "MaterialOrder.${mo}.total_sqft_ordered == 360"
            - "MaterialOrder.${mo}.status == PLACED"

      - name: prompt_pay_discount_evaluation_order
        grounds:
          - calculations.project_valuation
          - entities.Project.fields.prompt_pay_discount_cents
          - entities.Project.fields.estimated_total_cents
        distinguishing_aspect: |
          Mode (c) pinned evaluation order: the 2% prompt-pay discount is keyed on pre_tax_subtotal
          (4380000, computed BEFORE tax) not on the taxed or material-only total; tax (203363) is on
          material only; discount 87600 subtracts before adding tax -> estimated_total 4495763. A
          different order (discount on the post-tax or material-only subtotal) yields a different total.
        test_recipe:
          setup:
            - "Fresh DB. CA project, one 3000-sqft paver line (waste 0.10), no wall/permit; pre_tax >= 2,000,000."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Perry Pay", email: "ppay@x.com" }
              as: DesignConsultant
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "PAV-HOLLAND", name: "Holland Paver", category: "PAVER", unit: "SQFT", unit_price_cents: 850, waste_factor: 0.10, coverage_per_pallet_sqft: 120 }
              as: PlatformAdmin
              captures: { p_pav: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_address: "5 Yard Ln", region_code: "CA", in_hoa: false }
              as: DesignConsultant
              captures: { pid: $.data.id }
            - call: "POST /design-revisions"
              payload: { project_id: "${pid}" }
              as: DesignConsultant
              captures: { dr: $.data.id }
            - call: "POST /design-revisions/${dr}/render"
              payload: {}
              as: DesignConsultant
            - call: "POST /design-revisions/${dr}/submit-review"
              payload: {}
              as: DesignConsultant
            - call: "POST /design-revisions/${dr}/approve"
              payload: {}
              as: Client
              as_user_id: "${cust}"
            - call: "POST /site-measurements"
              payload: { project_id: "${pid}", zone_label: "driveway", measured_sqft: 3000, wall_height_in: 0 }
              as: DesignConsultant
            - call: "POST /line-items"
              payload: { project_id: "${pid}", product_id: "${p_pav}", measured_quantity: 3000 }
              as: DesignConsultant
          trigger:
            - call: "POST /projects/${pid}/generate-estimate"
              payload: {}
              as: DesignConsultant
              captures: { est: $.data.estimated_total_cents, disc: $.data.prompt_pay_discount_cents }
          assert:
            - "Project.${pid}.prompt_pay_discount_cents == 87600"
            - "Project.${pid}.estimated_total_cents == 4495763"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: design_revision_revision_cycle
        grounds:
          - state_machines.DesignRevision.IN_REVIEW_to_REVISION_REQUESTED
          - state_machines.DesignRevision.REVISION_REQUESTED_to_DRAFTING
          - entities.DesignRevision.fields.revision_round
        distinguishing_aspect: |
          Cyclic shape on DesignRevision: IN_REVIEW -> REVISION_REQUESTED -> DRAFTING re-enters the
          loop, incrementing revision_round from 1 to 2 and clearing render_url — not a one-way
          A->B->C pipeline.
        test_recipe:
          setup:
            - "Fresh DB. A design revision taken to IN_REVIEW then sent back for revision."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Rae Loop", email: "rl@x.com" }
              as: DesignConsultant
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_address: "6 Yard Ln", region_code: "CA" }
              as: DesignConsultant
              captures: { pid: $.data.id }
            - call: "POST /design-revisions"
              payload: { project_id: "${pid}" }
              as: DesignConsultant
              captures: { dr: $.data.id }
            - call: "POST /design-revisions/${dr}/render"
              payload: {}
              as: DesignConsultant
            - call: "POST /design-revisions/${dr}/submit-review"
              payload: {}
              as: DesignConsultant
            - call: "POST /design-revisions/${dr}/request-revision"
              payload: {}
              as: Client
              as_user_id: "${cust}"
          trigger:
            - call: "POST /design-revisions/${dr}/revise"
              payload: {}
              as: DesignConsultant
          assert:
            - "DesignRevision.${dr}.status == DRAFTING"
            - "DesignRevision.${dr}.revision_round == 2"

      - name: hoa_submission_conditional_branch
        grounds:
          - state_machines.HoaSubmission.SUBMITTED_to_CONDITIONAL
          - state_machines.HoaSubmission.CONDITIONAL_to_SUBMITTED
          - entities.HoaSubmission.fields.conditions
        distinguishing_aspect: |
          Branching fork-join on HoaSubmission (a different entity than the DesignRevision cycle):
          SUBMITTED forks to CONDITIONAL (setting conditions), distinct from the APPROVED/REJECTED
          branches, then re-enters via submit — divergent side effects per branch.
        test_recipe:
          setup:
            - "Fresh DB. An in-HOA project taken to PENDING_APPROVALS so an HoaSubmission (DRAFT) exists."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Hank Oa", email: "ho@x.com" }
              as: DesignConsultant
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "PAV-HOLLAND", name: "Holland Paver", category: "PAVER", unit: "SQFT", unit_price_cents: 850, waste_factor: 0.10, coverage_per_pallet_sqft: 120 }
              as: PlatformAdmin
              captures: { p_pav: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_address: "7 Yard Ln", region_code: "CA", in_hoa: true }
              as: DesignConsultant
              captures: { pid: $.data.id }
            - call: "POST /design-revisions"
              payload: { project_id: "${pid}" }
              as: DesignConsultant
              captures: { dr: $.data.id }
            - call: "POST /design-revisions/${dr}/render"
              payload: {}
              as: DesignConsultant
            - call: "POST /design-revisions/${dr}/submit-review"
              payload: {}
              as: DesignConsultant
            - call: "POST /design-revisions/${dr}/approve"
              payload: {}
              as: Client
              as_user_id: "${cust}"
            - call: "POST /site-measurements"
              payload: { project_id: "${pid}", zone_label: "patio", measured_sqft: 100, wall_height_in: 0 }
              as: DesignConsultant
            - call: "POST /line-items"
              payload: { project_id: "${pid}", product_id: "${p_pav}", measured_quantity: 100 }
              as: DesignConsultant
            - call: "POST /projects/${pid}/generate-estimate"
              payload: {}
              as: DesignConsultant
            - call: "POST /projects/${pid}/submit-approvals"
              payload: {}
              as: ProjectManager
            - call: "GET /projects/${pid}/hoa-submissions"
              payload: {}
              as: ProjectManager
              captures: { hoa: "$.data[0].id" }
            - call: "POST /hoa-submissions/${hoa}/submit"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /hoa-submissions/${hoa}/decide"
              payload: { outcome: "CONDITIONAL", conditions: "earth-tone pavers only", decision_notes: "board review" }
              as: PlatformAdmin
          assert:
            - "HoaSubmission.${hoa}.status == CONDITIONAL"
            - "HoaSubmission.${hoa}.conditions == 'earth-tone pavers only'"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: change_order_permit_raise_blocks_phase_and_releases_crew
        grounds:
          - state_machines.ChangeOrder.PROPOSED_to_APPROVED
          - state_machines.Project.CONTRACTED_to_PENDING_APPROVALS
          - state_machines.WorkPhase.SCHEDULED_to_BLOCKED
          - entities.Crew.fields.active_booking_count
        distinguishing_aspect: |
          Depth-3 cascade from CO approve: approving a WALL_BLOCK change order with add_wall_height_in
