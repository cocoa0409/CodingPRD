              as: ShiftManager
              captures: { lv_pre: "$.data.version" }
            - call: "POST /dry-age-lockers/${locker_id}/temp-readings"
              payload: { temp_c: 11.0, reading_at: "2026-06-02T00:00:00Z" }
              as: SafetyOfficer
          trigger:
            - call: "POST /dry-age-lockers/${locker_id}/release"
              payload: { expected_dry_age_locker_version: "${lv_pre} - 1" }
              as: ShiftManager
              captures: { err: "$.data.error_id" }
          assert:
            - "release response error_id == ERR_STALE_LOCKER_VERSION"

      - name: temp_excursion_cascade_holds_aging_lots
        claim_type: cascading_side_effects
        grounds: [state_machines.DryAgeLocker.OPERATIONAL_to_QUARANTINED, state_machines.InventoryLot.AGING_to_ON_HOLD]
        excluded_because:
          difficulty_instance: "transitive_cascade / temp_excursion_quarantine_holds_aging_lot_blocks_completion"
          rationale: "The reading -> quarantine -> ON_HOLD cascade is the named §1.8 transitive-cascade instance."

  # =========================================================================
  - section: consistency_model
    instances:
      - name: holiday_deposit_charged_and_visible_same_request
        claim_type: immediate
        grounds: [entities.Customer.fields.store_credit_cents, calculations.holiday_deposit]
        distinguishing_aspect: "Under the immediate consistency model, the HOLIDAY order placement response and a same-instant GET both reflect the charged deposit; committed_g visible immediately."
        test_recipe:
          setup: ["A HolidayWindow capacity 100000g before cutoff; RIBEYE cut; a customer."]
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { shrink_pct_whole_cut: 0.04, shrink_pct_grind: 0.10, preferred_discount_pct: 0.10, wholesale_discount_pct: 0.20, bulk_threshold_g: 5000, bulk_extra_discount_pct: 0.05 }
              as: ShiftManager
            - call: "POST /cut-types"
              payload: { code: "RIBEYE", species: "BEEF", base_price_cents_per_kg: 4000 }
              as: ShiftManager
              captures: { ribeye_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-19T00:00:00Z" }
              as: ShiftManager
            - call: "POST /holiday-windows"
              payload: { name: "THANKSGIVING_2026", pickup_date: "2026-11-26T00:00:00Z", capacity_g: 100000, cutoff_at: "2026-11-20T00:00:00Z" }
              as: ShiftManager
              captures: { win_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Cora Commit", phone: "555-1018" }
              as: CounterClerk
              captures: { cc_id: "$.data.id" }
          trigger:
            - call: "POST /custom-orders"
              payload: { customer_id: "${cc_id}", order_kind: "HOLIDAY", holiday_window_id: "${win_id}", pickup_date: "2026-11-26T00:00:00Z", lines: [ { cut_type_id: "${ribeye_id}", ordered_weight_g: 2000 } ] }
              as: CounterClerk
              as_user_id: "${cc_id}"
              captures: { order_id: "$.data.id" }
            - call: "GET /holiday-windows/${win_id}"
              payload: {}
              as: ShiftManager
              captures: { committed: "$.data.committed_g" }
          assert:
            - "CustomOrder.${order_id}.deposit_cents == 2000"
            - "HolidayWindow.${win_id}.committed_g == 2000"
