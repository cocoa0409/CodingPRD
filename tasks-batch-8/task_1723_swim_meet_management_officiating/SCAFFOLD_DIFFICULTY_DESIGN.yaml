          Depth-3 cascade from the relay-scratch trigger (different origin than DQ confirm):
          RelayTeam -> SCRATCHED forces its EventEntry -> SCRATCHED, which forces the entry's
          LaneAssignment ACTIVE -> VOIDED, which forces Team.active_entry_count recomputation to 0.
