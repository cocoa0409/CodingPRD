          trigger:
            - { call: "POST /audits", payload: { subject_coder_id: "${subj_id}", window_start: "2026-04-01T00:00:00Z", window_end: "2026-05-01T00:00:00Z", sample_size: 3 }, as: BillingClerk, as_user_id: "clerk-rb2", captures: { err: $.data.error_id } }
          assert:
            - "Trigger response http_status == 403 and error_id == ERR_FORBIDDEN"

      - name: create_rebill_as_officer_forbidden
        claim_type: rbac_denial
        grounds: ["roles[BillingClerk].exclusive_operations", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "ComplianceOfficer invoking BillingClerk-exclusive POST /rebill-requests -> 403 ERR_FORBIDDEN (authorization precedes existence checks)."
        test_recipe:
          setup: ["One account exists (sources a live version value for the OCC field)"]
          setup_api_calls:
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-RB3", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 900000 }, as: CodingManager, captures: { acct_v: $.data.version } }
          trigger:
            - { call: "POST /rebill-requests", payload: { review_id: "00000000-0000-0000-0000-000000000000", delta_cents: -100, expected_bill_version: "${acct_v}" }, as: ComplianceOfficer, as_user_id: "officer-rb3", captures: { err: $.data.error_id } }
          assert:
            - "Trigger response http_status == 403 and error_id == ERR_FORBIDDEN (not ERR_REVIEW_NOT_FOUND)"

  # ============================== From Cross-Cutting Complexity Layers
  - section: cross_cutting_layers
    instances:
      - name: occ_regroup_stale_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[regroup-stale-coded-case]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Regroup carrying expected_coded_case_version one behind the case's current version -> 412 ERR_STALE_VERSION; with the current version it succeeds."
        test_recipe:
          setup: ["Coded case GROUPED at version V (captured) on a submitted chart"]
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-XC1", full_name: "Occ One", credential: "CCS" }, as: CodingManager, captures: { coder_id: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-XC1", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 900000 }, as: CodingManager, captures: { acct_id: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_id}", acuity: "MEDICAL_LOW" }, as: CodingManager, captures: { chart_id: $.data.id } }
            - { call: "POST /patient-accounts/${acct_id}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /assignments", payload: { chart_id: "${chart_id}", coder_id: "${coder_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/start", payload: {}, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /diagnosis-lines", payload: { chart_id: "${chart_id}", icd_code: "I21.09", poa: "Y", sequence: 1, is_principal: true }, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /assignments/${asg_id}/submit", payload: {}, as: Coder, as_user_id: "${coder_id}" }
            - { call: "GET /coded-cases?chart_id=${chart_id}", payload: {}, as: CodingManager, captures: { case_id: "$.data[0].id", case_v: "$.data[0].version" } }
          trigger:
            - { call: "POST /coded-cases/${case_id}/regroup", payload: { expected_coded_case_version: "${case_v} - 1" }, as: CodingManager, captures: { err: $.data.error_id } }
            - { call: "POST /coded-cases/${case_id}/regroup", payload: { expected_coded_case_version: "${case_v}" }, as: CodingManager, captures: { new_v: $.data.version } }
          assert:
            - "Stale call: http_status == 412 and error_id == ERR_STALE_VERSION; case unchanged"
            - "Current-version call: 200 and CodedCase.${case_id}.version == ${case_v} + 1"

      - name: occ_rebill_create_stale_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[rebill-create-stale-bill]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Rebill create carrying expected_bill_version one behind the bill's current version -> 412 ERR_STALE_VERSION even though review, delta and timely-filing are all valid."
        test_recipe:
          setup: ["PAID bill (paid in full at 2026-05-01) with OPEN review claiming -200000; bill version captured as V"]
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-XC2", full_name: "Occ Two", credential: "RHIA" }, as: CodingManager, captures: { coder_id: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-XC2", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 2000000 }, as: CodingManager, captures: { acct_id: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_id}", acuity: "MEDICAL_HIGH" }, as: CodingManager, captures: { chart_id: $.data.id } }
            - { call: "POST /patient-accounts/${acct_id}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /assignments", payload: { chart_id: "${chart_id}", coder_id: "${coder_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/start", payload: {}, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /diagnosis-lines", payload: { chart_id: "${chart_id}", icd_code: "I21.09", poa: "Y", sequence: 1, is_principal: true }, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /diagnosis-lines", payload: { chart_id: "${chart_id}", icd_code: "N18.6", poa: "Y", sequence: 2, cc_level: "MCC" }, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /assignments/${asg_id}/submit", payload: {}, as: Coder, as_user_id: "${coder_id}" }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: CodingManager }
            - { call: "POST /bills", payload: { account_id: "${acct_id}" }, as: BillingClerk, captures: { bill_id: $.data.id } }
            - { call: "POST /bills/${bill_id}/finalize", payload: {}, as: BillingClerk }
            - { call: "POST /bills/${bill_id}/record-payment", payload: { paid_amount_cents: 1365000, paid_at: "2026-05-01T00:00:00Z" }, as: BillingClerk }
            - { call: "POST /bills/${bill_id}/post-payment-reviews", payload: { payer_ref: "PR-XC2", claimed_delta_cents: -200000 }, as: BillingClerk, captures: { review_id: $.data.id } }
            - { call: "GET /bills/${bill_id}", payload: {}, as: BillingClerk, captures: { bill_v: $.data.version } }
          trigger:
            - { call: "POST /rebill-requests", payload: { review_id: "${review_id}", delta_cents: -200000, expected_bill_version: "${bill_v} - 1" }, as: BillingClerk, captures: { err: $.data.error_id } }
          assert:
            - "Trigger response http_status == 412 and error_id == ERR_STALE_VERSION"
            - "Bill.${bill_id}.status == POST_PAYMENT_REVIEW (unchanged); no RebillRequest created"

      - name: auto_assign_selector_determinism
        claim_type: selector_determinism
        grounds: [endpoints, entities.CodingAssignment.fields.coder_id]
        distinguishing_aspect: "Auto-assignment policy: eligibility = ACTIVE coders meeting the credential bar; ranking = workload_units ASC; tie-break = coder created_at ASC. First pick lands on the older coder (tie at 0), second pick lands on the other (0 vs 2 after the first assign)."
        test_recipe:
          setup: ["Coders c1 (CCS, created at clock 2026-04-01) and c2 (CCS, created at 2026-04-02); two READY MEDICAL_HIGH charts; clock restored to default afterwards"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: CodingManager }
            - { call: "POST /coders", payload: { employee_no: "E-XC3A", full_name: "Older Coder", credential: "CCS" }, as: CodingManager, captures: { c1_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-02T00:00:00Z" }, as: CodingManager }
            - { call: "POST /coders", payload: { employee_no: "E-XC3B", full_name: "Newer Coder", credential: "CCS" }, as: CodingManager, captures: { c2_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: CodingManager }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-XC3A", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 900000 }, as: CodingManager, captures: { acct_a: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-XC3B", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 900000 }, as: CodingManager, captures: { acct_b: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_a}", acuity: "MEDICAL_HIGH" }, as: CodingManager, captures: { chart_a: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_b}", acuity: "MEDICAL_HIGH" }, as: CodingManager, captures: { chart_b: $.data.id } }
            - { call: "POST /patient-accounts/${acct_a}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /patient-accounts/${acct_b}/discharge", payload: { discharge_at: "2026-04-25T10:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
          trigger:
            - { call: "POST /assignments", payload: { chart_id: "${chart_a}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { pick1: $.data.coder_id } }
            - { call: "POST /assignments", payload: { chart_id: "${chart_b}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { pick2: $.data.coder_id } }
          assert:
            - "First auto-assignment picks ${c1_id} (workload tie 0 == 0 broken by created_at ASC: 2026-04-01 < 2026-04-02)"
            - "Second auto-assignment picks ${c2_id} (workload 0 < 2 after c1's assign)"

      - name: sweep_boost_recomputes_priority
        claim_type: rate_threshold_triggers
        grounds: [calculations.queue_priority_score, entities.PatientAccount.fields.dnfb_flag]
        distinguishing_aspect: "Ops-run checkpoint side effect: an assignment created pre-flag scores 50 (tier 40 + amount 10 + acuity 0 + boost 0); after the sweep flags its account (4 days >= 3), the same assignment recomputes to 75 (boost +25) without any direct assignment write."
        test_recipe:
          setup: ["Account discharged 2026-04-27T00:00:00Z (4 days before default clock), charges 1000000, MEDICAL_LOW chart with an ASSIGNED assignment; no sweep yet (dnfb_flag false)"]
          setup_api_calls:
            - { call: "POST /coders", payload: { employee_no: "E-XC4", full_name: "Boost Ed", credential: "CCS" }, as: CodingManager, captures: { coder_id: $.data.id } }
            - { call: "POST /patient-accounts", payload: { mrn: "MRN-XC4", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICAID", total_charges_cents: 1000000 }, as: CodingManager, captures: { acct_id: $.data.id } }
            - { call: "POST /charts", payload: { account_id: "${acct_id}", acuity: "MEDICAL_LOW" }, as: CodingManager, captures: { chart_id: $.data.id } }
            - { call: "POST /patient-accounts/${acct_id}/discharge", payload: { discharge_at: "2026-04-27T00:00:00Z", discharge_disposition: "HOME" }, as: CodingManager }
            - { call: "POST /assignments", payload: { chart_id: "${chart_id}", coder_id: "${coder_id}", due_at: "2026-05-10T00:00:00Z" }, as: CodingManager, captures: { asg_id: $.data.id, prio_pre: $.data.priority_score } }
          trigger:
            - { call: "POST /dnfb-sweeps", payload: { threshold_days: 3 }, as: CodingManager, captures: { sweep_id: $.data.id } }
            - { call: "GET /assignments/${asg_id}", payload: {}, as: CodingManager, captures: { prio_post: $.data.priority_score } }
          assert:
            - "Pre-sweep priority_score == 50 (tier 40 + amount 10 + acuity 0 + boost 0)"
            - "Post-sweep priority_score == 75 (dnfb_boost 25 applied by the checkpoint recompute)"
            - "DnfbSweep.${sweep_id}.flagged_count == 1"

