        grounds:
          - validations[priority 15]
          - validations[priority 16]
          - errors.ERR_CHALLENGE_PAYLOAD_INCOMPLETE
          - errors.ERR_CHALLENGE_TARGET_MISMATCH
          - errors.ERR_DUPLICATE_TARGET_INVALID
        distinguishing_aspect: |
          Each challenge_type carries its own required payload slice: WRONG_CARRIER needs an
          asserted_correct_carrier_id that differs from the filing carrier, INCORRECT_VIOLATION_CODE
          needs both target_violation_id and asserted_correct_violation_code_id, the target violation
          must belong to the challenged report (mismatch, not payload-incomplete), and a
          DUPLICATE_REPORT target must be a different report with the same VIN.
