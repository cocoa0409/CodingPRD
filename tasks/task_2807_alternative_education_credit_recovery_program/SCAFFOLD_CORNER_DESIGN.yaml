        test_recipe:
          setup:
            - "one center with seat_capacity 10 but certified_teacher_fte 0.25 and max_students_per_teacher 4, so staffing_headroom is 1 and intake_posture is RESTRICTED"
            - "two students, each with a SCREENING referral: one CREDIT_DEFICIENCY (2.00 credits, 0 incidents, 6 days) and one BEHAVIOR (1.00 credits, 3 incidents, 2 days)"
          setup_api_calls:
            - call: "POST /home-schools"
              payload: { name: "North High", district_code: "NHS-01", accountability_cohort_year: 2026 }
              as: DistrictAdmin
              captures: { hs_id: $.data.id }
            - call: "POST /centers"
              payload: { name: "Cedar AEC", seat_capacity: 10, certified_teacher_fte: 0.25, support_staff_fte: 2.00, max_students_per_teacher: 4 }
              as: DistrictAdmin
              captures: { ctr_id: $.data.id, ctr_v1: $.data.version }
            - call: "POST /students"
              payload: { home_school_id: "${hs_id}", state_student_id: "S-5301", full_name: "Nils Osei", cohort_year: 2027, grade_level: 11 }
              as: Registrar
              captures: { stu_a: $.data.id }
            - call: "POST /students"
              payload: { home_school_id: "${hs_id}", state_student_id: "S-5302", full_name: "Oona Pike", cohort_year: 2027, grade_level: 11 }
              as: Registrar
              captures: { stu_b: $.data.id }
            - call: "POST /referrals"
              payload: { student_id: "${stu_a}", center_id: "${ctr_id}", pathway: "CREDIT_DEFICIENCY", deficiency_credits: 2.00, behavior_incident_count: 0, days_disengaged: 6 }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
              captures: { ref_a: $.data.id }
            - call: "POST /referrals/${ref_a}/screen"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
            - call: "POST /referrals"
              payload: { student_id: "${stu_b}", center_id: "${ctr_id}", pathway: "BEHAVIOR", deficiency_credits: 1.00, behavior_incident_count: 3, days_disengaged: 2 }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
              captures: { ref_b: $.data.id }
            - call: "POST /referrals/${ref_b}/screen"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
          trigger:
            - call: "POST /referrals/${ref_a}/offer"
              payload: { offer_valid_days: 10, expected_center_version: "${ctr_v1}" }
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
            - call: "POST /referrals/${ref_b}/offer"
              payload: { offer_valid_days: 10, expected_center_version: "${ctr_v1}" }
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
          assert:
            - "Center.${ctr_id}.restricted_seat_margin == 1, staffing_headroom == 1, seats_available == 10 and intake_posture == RESTRICTED (the headroom clause, not the seat clause)"
            - "Referral.${ref_a}.priority_score == 0.1900 and Referral.${ref_b}.priority_score == 0.3983"
            - "the first call returns HTTP 409 with ERR_INTAKE_RESTRICTED and Referral.${ref_a}.status stays SCREENING"
            - "the second call returns HTTP 200 with Referral.${ref_b}.status == PLACEMENT_OFFERED even though 0.3983 < 0.5000, because the BEHAVIOR pathway is admitted on its own"
            - "Center.${ctr_id}.seats_reserved == 1, seats_available == 9 and version == ${ctr_v1} + 1 - the refused offer consumed no version"

