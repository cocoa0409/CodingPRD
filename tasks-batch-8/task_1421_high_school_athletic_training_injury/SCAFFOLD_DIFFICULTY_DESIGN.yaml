# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# High School Athletic Training & Injury Management
# 9 difficulty rules x instances (25 total). Every test_recipe is replayed
# against SCAFFOLD.yaml §1.2/§1.4/§1.5/§1.6.
# =============================================================================
scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (3 instances, 3 entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: heat_policy_district_vs_state_on_same_reading
        grounds:
          - calculations.heat_activity_tier
          - entities.AthleticEvent.fields.event_type
          - state_machines.AthleticEvent.COVERED_to_IN_PROGRESS
        distinguishing_aspect: |
          One WBGT reading (90.5 F) is evaluated under two policy variants keyed on
          event_type: a HOME_GAME (DISTRICT table: >= 90.0 is EXTREME, start blocked)
          versus a TOURNAMENT (STATE_ASSOCIATION table: [89.0,92.0) is SEVERE, start
          allowed) — identical environmental data, opposite gate outcomes.
        test_recipe:
          setup:
            - "Venue V (OUTDOOR) with an ACTIVE EAP"
            - "Event A: FOOTBALL VARSITY HOME_GAME at V 14:00-15:00, attendance 500, covered by trainers T1 (PRIMARY) + T2 (SECONDARY) -> COVERED"
            - "Event B: FOOTBALL VARSITY TOURNAMENT at V 16:00-17:00, covered by T1 + T2 + T3 -> COVERED (buffered windows [13:30,15:30) and [15:30,17:30) touch but do not overlap)"
            - "One HEAT_WBGT reading of 90.5 at 13:00; clock at 13:55"
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Trainer Two", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr2: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Trainer Three", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr3: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Director Dee", role_type: ATHLETIC_DIRECTOR }, as: SystemAdmin, captures: { ad: $.data.id } }
            - { call: "POST /venues", payload: { venue_name: "Stadium", venue_type: OUTDOOR, surface: GRASS, address: "1 School Rd" }, as: SystemAdmin, captures: { v1: $.data.id, v1_v: $.data.version } }
            - { call: "POST /emergency-action-plans", payload: { venue_id: "${v1}", version_label: "2026-fall-v1", evacuation_route: "Gate A", aed_location: "Lobby", ems_contact: "911", nearest_hospital: "General Hospital" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { eap1: $.data.id } }
            - { call: "POST /emergency-action-plans/${eap1}/submit", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /emergency-action-plans/${eap1}/approve", payload: {}, as: AthleticDirector, as_user_id: "${ad}" }
            - { call: "POST /emergency-action-plans/${eap1}/activate", payload: { expected_venue_version: "${v1_v}" }, as: AthleticDirector, as_user_id: "${ad}" }
            - { call: "POST /events", payload: { event_name: "Game A", sport: FOOTBALL, team_level: VARSITY, event_type: HOME_GAME, venue_id: "${v1}", scheduled_start: "2026-08-02T14:00:00Z", scheduled_end: "2026-08-02T15:00:00Z", expected_attendance: 500 }, as: AthleticDirector, as_user_id: "${ad}", captures: { evA: $.data.id } }
            - { call: "POST /coverage-assignments", payload: { event_id: "${evA}", staff_id: "${tr1}", coverage_role: PRIMARY }, as: AthleticDirector, as_user_id: "${ad}" }
            - { call: "POST /coverage-assignments", payload: { event_id: "${evA}", staff_id: "${tr2}", coverage_role: SECONDARY }, as: AthleticDirector, as_user_id: "${ad}" }
            - { call: "POST /events", payload: { event_name: "Tourney B", sport: FOOTBALL, team_level: VARSITY, event_type: TOURNAMENT, venue_id: "${v1}", scheduled_start: "2026-08-02T16:00:00Z", scheduled_end: "2026-08-02T17:00:00Z", expected_attendance: 500 }, as: AthleticDirector, as_user_id: "${ad}", captures: { evB: $.data.id } }
            - { call: "POST /coverage-assignments", payload: { event_id: "${evB}", staff_id: "${tr1}", coverage_role: PRIMARY }, as: AthleticDirector, as_user_id: "${ad}" }
            - { call: "POST /coverage-assignments", payload: { event_id: "${evB}", staff_id: "${tr2}", coverage_role: SECONDARY }, as: AthleticDirector, as_user_id: "${ad}" }
            - { call: "POST /coverage-assignments", payload: { event_id: "${evB}", staff_id: "${tr3}", coverage_role: SECONDARY }, as: AthleticDirector, as_user_id: "${ad}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T13:55:00Z" }, as: SystemAdmin }
            - { call: "POST /weather-readings", payload: { venue_id: "${v1}", reading_type: HEAT_WBGT, value_wbgt_f: 90.5, recorded_at: "2026-08-02T13:00:00Z", source: ON_SITE_SENSOR }, as: AthleticTrainer, as_user_id: "${tr1}" }
          trigger:
            - { call: "POST /events/${evA}/start", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { errA: $.data.error_id } }
            - { call: "POST /events/${evB}/start", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { evB_status: $.data.status } }
          assert:
            - "errA == ERR_HEAT_TIER_EXTREME (http 409) — DISTRICT tier at 90.5 F is EXTREME"
            - "evB_status == IN_PROGRESS — STATE_ASSOCIATION tier at 90.5 F is SEVERE, start allowed"
            - "Event.${evA}.status remains COVERED (re-read)"

      - name: inventory_fifo_vs_wac_running_same_ledger
        grounds:
          - calculations.inventory_valuation
          - calculations.inventory_stock
          - entities.InventoryTransaction.fields.txn_type
        distinguishing_aspect: |
          One append-only ledger is valued under FIFO versus WAC_RUNNING: identical
          transactions yield 103 cents (FIFO layer surviving at 103) versus 101 cents
          (per-transaction re-rounded weighted average) — different entity domain
          (supply inventory) from the heat-policy instance.
        test_recipe:
          setup:
            - "SupplyItem I (TAPE/ROLL, par 50, threshold 15, unit_cost 100)"
            - "Ledger in order: RESTOCK 3 @ 100 (09:00), USAGE 1 (10:00), RESTOCK 1 @ 103 (11:00), USAGE 2 (12:00); clock 13:00"
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /supply-items", payload: { item_name: "Athletic Tape", category: TAPE, unit: ROLL, par_level: 50, reorder_threshold: 15, unit_cost_cents: 100 }, as: SystemAdmin, captures: { item: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T13:00:00Z" }, as: SystemAdmin }
            - { call: "POST /inventory-transactions", payload: { supply_item_id: "${item}", txn_type: RESTOCK, quantity: 3, unit_cost_cents: 100, occurred_at: "2026-08-01T09:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /inventory-transactions", payload: { supply_item_id: "${item}", txn_type: USAGE, quantity: 1, occurred_at: "2026-08-01T10:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /inventory-transactions", payload: { supply_item_id: "${item}", txn_type: RESTOCK, quantity: 1, unit_cost_cents: 103, occurred_at: "2026-08-01T11:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /inventory-transactions", payload: { supply_item_id: "${item}", txn_type: USAGE, quantity: 2, occurred_at: "2026-08-01T12:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}" }
          trigger:
            - { call: "GET /supply-items/${item}/valuation", payload: { policy: FIFO }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { fifo_val: $.data.valuation_cents, fifo_qty: $.data.quantity_on_hand } }
            - { call: "GET /supply-items/${item}/valuation", payload: { policy: WAC_RUNNING }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { wac_val: $.data.valuation_cents, wac_qty: $.data.quantity_on_hand } }
          assert:
            - "fifo_val == 103 and fifo_qty == 1 (remaining layer is 1 @ 103)"
            - "wac_val == 101 and wac_qty == 1 (running wac 101 after the second restock; 303 - 2*101 = 101)"
            - "fifo_val != wac_val on identical ledger data"

      - name: physical_expiry_district13mo_vs_school_year
        grounds:
          - calculations.physical_expiry
          - entities.PreParticipationPhysical.fields.validity_policy
          - entities.PreParticipationPhysical.fields.expires_on
        distinguishing_aspect: |
          One exam_date (2026-03-15) produces expires_on 2027-04-15T00:00:00Z under
          DISTRICT_13MO versus 2026-08-01T00:00:00Z under STATE_SCHOOL_YEAR — a
          third entity domain (medical clearance records), distinct from both the
          environmental and supply instances.
        test_recipe:
          setup:
            - "Two athletes A and B; default clock 2026-08-01T00:00:00Z (no set call, so no sweep expires the RECORDED physicals)"
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete A", date_of_birth: "2009-05-01", grade: 11, sex: M, primary_sport: SOCCER, team_level: VARSITY, guardian_name: "Guard A", guardian_user_id: "g-1001", guardian_email: "ga@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { aA: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete B", date_of_birth: "2009-06-01", grade: 11, sex: F, primary_sport: SOCCER, team_level: VARSITY, guardian_name: "Guard B", guardian_user_id: "g-1002", guardian_email: "gb@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { aB: $.data.id } }
            - { call: "POST /physicals", payload: { athlete_id: "${aA}", exam_date: "2026-03-15", examining_physician_name: "Dr X", outcome: CLEARED, validity_policy: DISTRICT_13MO }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { phA: $.data.id } }
            - { call: "POST /physicals", payload: { athlete_id: "${aB}", exam_date: "2026-03-15", examining_physician_name: "Dr X", outcome: CLEARED, validity_policy: STATE_SCHOOL_YEAR }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { phB: $.data.id } }
          trigger:
            - { call: "GET /physicals/${phA}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { expA: $.data.expires_on } }
            - { call: "GET /physicals/${phB}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { expB: $.data.expires_on } }
          assert:
            - "expA == 2027-04-15T00:00:00Z (exam_date + 13 calendar months)"
            - "expB == 2026-08-01T00:00:00Z (exam month 3 < 8 -> Aug 1 of exam year)"
            - "expA != expB for identical exam_date"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (3 instances, modes a / b / c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: coverage_requirement_tiered_modifiers_and_cap
        grounds:
          - calculations.event_coverage_requirement
          - entities.AthleticEvent.fields.required_trainer_count
        distinguishing_aspect: |
          Mode (a): required_trainer_count combines a tiered contact-level base with
          three conditional modifiers and a cap — TOURNAMENT(2 base) + tournament(+1)
          + 4 restricted roster athletes (>= 4 boundary, +1) + attendance 1200
          (>= 1000, +1) = 5, capped to 4; the same roster at a HOME_GAME with
          attendance 500 yields 3 — nested min/max with state-dependent branches.
        test_recipe:
          setup:
            - "Venue V1; four FOOTBALL VARSITY athletes each with a VERIFIED physical of outcome CLEARED_WITH_RESTRICTIONS and a CURRENT baseline -> posture CLEARED_WITH_RESTRICTIONS (gate 4 via physical outcome)"
            - "Event T: FOOTBALL VARSITY TOURNAMENT at V1 14:00-15:00 attendance 1200"
            - "Event G: FOOTBALL VARSITY HOME_GAME at V1 16:00-17:00 attendance 500 (buffered windows touch at 15:30, no overlap)"
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Nurse Nia", role_type: SCHOOL_NURSE }, as: SystemAdmin, captures: { nr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Director Dee", role_type: ATHLETIC_DIRECTOR }, as: SystemAdmin, captures: { ad: $.data.id } }
            - { call: "POST /venues", payload: { venue_name: "Stadium", venue_type: OUTDOOR, surface: GRASS, address: "1 School Rd" }, as: SystemAdmin, captures: { v1: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Player P1", date_of_birth: "2008-03-01", grade: 12, sex: M, primary_sport: FOOTBALL, team_level: VARSITY, guardian_name: "G1", guardian_user_id: "g-2001", guardian_email: "g1@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { p1: $.data.id } }
            - { call: "POST /physicals", payload: { athlete_id: "${p1}", exam_date: "2026-07-01", examining_physician_name: "Dr X", outcome: CLEARED_WITH_RESTRICTIONS, validity_policy: DISTRICT_13MO, restriction_notes: "no contact" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ph1: $.data.id } }
            - { call: "POST /physicals/${ph1}/verify", payload: {}, as: SchoolNurse, as_user_id: "${nr1}" }
            - { call: "POST /baseline-tests", payload: { athlete_id: "${p1}", test_date: "2026-07-15", instrument: SCAT6, symptom_score: 0, memory_index: 95.0, reaction_time_ms: 250.0, balance_errors: 1 }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /athletes", payload: { full_name: "Player P2", date_of_birth: "2008-04-01", grade: 12, sex: M, primary_sport: FOOTBALL, team_level: VARSITY, guardian_name: "G2", guardian_user_id: "g-2002", guardian_email: "g2@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { p2: $.data.id } }
            - { call: "POST /physicals", payload: { athlete_id: "${p2}", exam_date: "2026-07-01", examining_physician_name: "Dr X", outcome: CLEARED_WITH_RESTRICTIONS, validity_policy: DISTRICT_13MO, restriction_notes: "no contact" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ph2: $.data.id } }
            - { call: "POST /physicals/${ph2}/verify", payload: {}, as: SchoolNurse, as_user_id: "${nr1}" }
            - { call: "POST /baseline-tests", payload: { athlete_id: "${p2}", test_date: "2026-07-15", instrument: SCAT6, symptom_score: 0, memory_index: 95.0, reaction_time_ms: 250.0, balance_errors: 1 }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /athletes", payload: { full_name: "Player P3", date_of_birth: "2008-05-01", grade: 12, sex: M, primary_sport: FOOTBALL, team_level: VARSITY, guardian_name: "G3", guardian_user_id: "g-2003", guardian_email: "g3@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { p3: $.data.id } }
            - { call: "POST /physicals", payload: { athlete_id: "${p3}", exam_date: "2026-07-01", examining_physician_name: "Dr X", outcome: CLEARED_WITH_RESTRICTIONS, validity_policy: DISTRICT_13MO, restriction_notes: "no contact" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ph3: $.data.id } }
            - { call: "POST /physicals/${ph3}/verify", payload: {}, as: SchoolNurse, as_user_id: "${nr1}" }
            - { call: "POST /baseline-tests", payload: { athlete_id: "${p3}", test_date: "2026-07-15", instrument: SCAT6, symptom_score: 0, memory_index: 95.0, reaction_time_ms: 250.0, balance_errors: 1 }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /athletes", payload: { full_name: "Player P4", date_of_birth: "2008-06-01", grade: 12, sex: F, primary_sport: FOOTBALL, team_level: VARSITY, guardian_name: "G4", guardian_user_id: "g-2004", guardian_email: "g4@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { p4: $.data.id } }
            - { call: "POST /physicals", payload: { athlete_id: "${p4}", exam_date: "2026-07-01", examining_physician_name: "Dr X", outcome: CLEARED_WITH_RESTRICTIONS, validity_policy: DISTRICT_13MO, restriction_notes: "no contact" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ph4: $.data.id } }
            - { call: "POST /physicals/${ph4}/verify", payload: {}, as: SchoolNurse, as_user_id: "${nr1}" }
            - { call: "POST /baseline-tests", payload: { athlete_id: "${p4}", test_date: "2026-07-15", instrument: SCAT6, symptom_score: 0, memory_index: 95.0, reaction_time_ms: 250.0, balance_errors: 1 }, as: AthleticTrainer, as_user_id: "${tr1}" }
          trigger:
            - { call: "POST /events", payload: { event_name: "Tourney T", sport: FOOTBALL, team_level: VARSITY, event_type: TOURNAMENT, venue_id: "${v1}", scheduled_start: "2026-08-02T14:00:00Z", scheduled_end: "2026-08-02T15:00:00Z", expected_attendance: 1200 }, as: AthleticDirector, as_user_id: "${ad}", captures: { reqT: $.data.required_trainer_count } }
            - { call: "POST /events", payload: { event_name: "Game G", sport: FOOTBALL, team_level: VARSITY, event_type: HOME_GAME, venue_id: "${v1}", scheduled_start: "2026-08-02T16:00:00Z", scheduled_end: "2026-08-02T17:00:00Z", expected_attendance: 500 }, as: AthleticDirector, as_user_id: "${ad}", captures: { reqG: $.data.required_trainer_count } }
          assert:
            - "reqT == 4 (base 2 + tournament 1 + restricted 1 + attendance 1 = 5, capped at 4)"
            - "reqG == 3 (base 2 + restricted 1; no tournament or attendance bump)"

      - name: wac_running_vs_exact_rounding_order
        grounds:
          - calculations.inventory_valuation
        distinguishing_aspect: |
          Mode (b): nested rounding where the order matters — WAC_RUNNING re-rounds
          the unit cost after every transaction (403/4 -> 101, then 403 - 2*101 = 201)
          while WAC_EXACT keeps an exact rational and rounds once at the end
          (403 - 201.5 = 201.5 -> 202). The scaffold pins WAC_RUNNING as canonical;
          the two policies differ by exactly 1 cent on this ledger.
        test_recipe:
          setup:
            - "SupplyItem I; ledger: RESTOCK 3 @ 100 (09:00), RESTOCK 1 @ 103 (10:00), USAGE 2 (11:00); clock 12:00"
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /supply-items", payload: { item_name: "Bandages", category: FIRST_AID, unit: BOX, par_level: 40, reorder_threshold: 10, unit_cost_cents: 100 }, as: SystemAdmin, captures: { item: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: SystemAdmin }
            - { call: "POST /inventory-transactions", payload: { supply_item_id: "${item}", txn_type: RESTOCK, quantity: 3, unit_cost_cents: 100, occurred_at: "2026-08-01T09:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /inventory-transactions", payload: { supply_item_id: "${item}", txn_type: RESTOCK, quantity: 1, unit_cost_cents: 103, occurred_at: "2026-08-01T10:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /inventory-transactions", payload: { supply_item_id: "${item}", txn_type: USAGE, quantity: 2, occurred_at: "2026-08-01T11:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}" }
          trigger:
            - { call: "GET /supply-items/${item}/valuation", payload: { policy: WAC_RUNNING }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { run_val: $.data.valuation_cents } }
            - { call: "GET /supply-items/${item}/valuation", payload: { policy: WAC_EXACT }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { exact_val: $.data.valuation_cents } }
          assert:
            - "run_val == 201 (per-transaction rounding: wac rounds 100.75 up to 101; 403 - 202 = 201)"
            - "exact_val == 202 (single final rounding of 201.5, round_half_up)"
            - "run_val != exact_val — rounding order is load-bearing"

      - name: reorder_suggestion_pinned_evaluation_order
        grounds:
          - calculations.supply_reorder_suggestion
          - calculations.inventory_stock
          - entities.SupplyBudget.fields.committed_spend_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — suggested quantity depends on
          available budget, available budget depends on committed spend, and the
          committed orders are the same rows that count as inbound stock shrinking
          the deficit. The pinned order (stock -> inbound -> deficit -> budget ->
          max_affordable -> clamp) yields exactly: stock 10, inbound 20, deficit 20,
          available 4000, max_affordable 8, suggested 8.
        test_recipe:
          setup:
            - "SupplyBudget FY2026 total 14000; SupplyItem I (par 50, threshold 15, unit_cost 500) with one direct RESTOCK of 10 @ 500"
            - "RestockOrder O: qty 20 @ 500 (extended 10000), SUBMITTED then APPROVED -> committed 10000, available 4000"
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Director Dee", role_type: ATHLETIC_DIRECTOR }, as: SystemAdmin, captures: { ad: $.data.id } }
            - { call: "POST /supply-budgets", payload: { fiscal_year: 2026, total_budget_cents: 14000 }, as: SystemAdmin, captures: { bud: $.data.id } }
            - { call: "POST /supply-items", payload: { item_name: "Ice Packs", category: FIRST_AID, unit: EACH, par_level: 50, reorder_threshold: 15, unit_cost_cents: 500 }, as: SystemAdmin, captures: { item: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: SystemAdmin }
            - { call: "POST /inventory-transactions", payload: { supply_item_id: "${item}", txn_type: RESTOCK, quantity: 10, unit_cost_cents: 500, occurred_at: "2026-08-01T09:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /restock-orders", payload: { supply_item_id: "${item}", quantity: 20, unit_cost_cents: 500, fiscal_year: 2026 }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ord: $.data.id } }
            - { call: "POST /restock-orders/${ord}/submit", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /restock-orders/${ord}/approve", payload: {}, as: AthleticDirector, as_user_id: "${ad}" }
          trigger:
            - { call: "GET /supply-items/${item}/reorder-suggestion", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { cur: $.data.current_stock, inb: $.data.inbound_qty, def: $.data.deficit_qty, avb: $.data.available_budget_cents, maf: $.data.max_affordable_qty, sug: $.data.suggested_qty } }
          assert:
            - "cur == 10 and inb == 20 (APPROVED order counts as inbound before deficit)"
            - "def == 20 (max(0, 50 - 10 - 20))"
            - "avb == 4000 (14000 - 0 realized - 10000 committed; committed includes the same order counted as inbound)"
            - "maf == 8 (floor(4000 / 500)) and sug == 8 (min(20, 8))"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (3 instances, 3 different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: rtp_regress_cycle_stage_reentry
        grounds:
          - state_machines.ReturnToPlayProtocol.ACTIVE_to_ACTIVE
          - calculations.rtp_stage_dwell
        distinguishing_aspect: |
          Cyclic machine on ReturnToPlayProtocol: stage 1 -> 2 -> (regress) -> 1 ->
          (re-advance after a fresh 24h dwell) -> 2; the status stays ACTIVE while the
          stage dimension loops, and stage_history accumulates ADVANCED then REGRESSED
          exits. Distinct entity from the event and EAP cycles.
        test_recipe:
          setup:
            - "Athlete with VERIFIED physical (exam 2026-07-01, DISTRICT_13MO) and CURRENT baseline (2026-07-15)"
            - "Injury SPRAIN/MINOR evaluated 2026-08-02T08:30 -> begin-care -> UNDER_CARE; RTP protocol created at clock 2026-08-02T09:00 (stage 1)"
            - "Clock advanced to 2026-08-03T09:00; advance -> stage 2 (stage_entered_at 2026-08-03T09:00)"
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Nurse Nia", role_type: SCHOOL_NURSE }, as: SystemAdmin, captures: { nr1: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete A", date_of_birth: "2009-05-01", grade: 11, sex: M, primary_sport: SOCCER, team_level: VARSITY, guardian_name: "Guard A", guardian_user_id: "g-3001", guardian_email: "ga@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { a1: $.data.id } }
            - { call: "POST /physicals", payload: { athlete_id: "${a1}", exam_date: "2026-07-01", examining_physician_name: "Dr X", outcome: CLEARED, validity_policy: DISTRICT_13MO }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ph1: $.data.id } }
            - { call: "POST /physicals/${ph1}/verify", payload: {}, as: SchoolNurse, as_user_id: "${nr1}" }
            - { call: "POST /baseline-tests", payload: { athlete_id: "${a1}", test_date: "2026-07-15", instrument: SCAT6, symptom_score: 0, memory_index: 95.0, reaction_time_ms: 250.0, balance_errors: 1 }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /injuries", payload: { athlete_id: "${a1}", body_region: ANKLE_FOOT, injury_type: SPRAIN, severity: MINOR, mechanism: "inversion in practice", evaluated_at: "2026-08-02T08:30:00Z", restricted_activities: [PRACTICE] }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj: $.data.id } }
            - { call: "POST /injuries/${inj}/begin-care", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj_v2: $.data.version } }
            - { call: "POST /injuries/${inj}/rtp-protocols", payload: { protocol_type: GRADUATED_6_STAGE, expected_injury_version: "${inj_v2}" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { rtp: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rtp-protocols/${rtp}/advance", payload: { symptom_check_passed: true }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { st2: $.data.current_stage } }
          trigger:
            - { call: "POST /rtp-protocols/${rtp}/regress", payload: { notes: "symptoms returned" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { st_after_reg: $.data.current_stage, rec_after_reg: $.data.recurrence_count } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rtp-protocols/${rtp}/advance", payload: { symptom_check_passed: true }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { st_final: $.data.current_stage, hist: $.data.stage_history } }
          assert:
            - "st2 == 2 before the regress"
            - "st_after_reg == 1 and rec_after_reg == 1 (regression resets to stage 1, dwell restarts at 2026-08-03T09:00... regress time)"
            - "st_final == 2 after re-advance at 2026-08-04T09:00 (24h after the regress)"
            - "hist has 3 entries with exit_reasons [ADVANCED, REGRESSED, ADVANCED] in order"

      - name: event_suspend_resume_weather_cycle
        grounds:
          - state_machines.AthleticEvent.IN_PROGRESS_to_SUSPENDED_WEATHER
          - state_machines.AthleticEvent.SUSPENDED_WEATHER_to_IN_PROGRESS
          - state_machines.CoverageAssignment.ON_SITE_to_ON_HOLD
          - state_machines.CoverageAssignment.ON_HOLD_to_ON_SITE
          - calculations.lightning_all_clear
        distinguishing_aspect: |
          Cyclic machine on AthleticEvent: IN_PROGRESS -> SUSPENDED_WEATHER ->
          IN_PROGRESS -> SUSPENDED_WEATHER, with the coverage assignment dimension
          cycling ON_SITE -> ON_HOLD -> ON_SITE via pre_hold_status snapshot/restore.
          Distinct entity from the RTP and EAP cycles.
        test_recipe:
          setup:
            - "Venue V (OUTDOOR, radius default 8.0) with ACTIVE EAP"
            - "Event E FOOTBALL VARSITY HOME_GAME 2026-08-02 14:00-17:00, attendance 500 -> required 2; T1 PRIMARY (acknowledged + checked in = ON_SITE), T2 SECONDARY (stays ASSIGNED); event started at clock 14:05 -> IN_PROGRESS"
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Trainer Two", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr2: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Director Dee", role_type: ATHLETIC_DIRECTOR }, as: SystemAdmin, captures: { ad: $.data.id } }
            - { call: "POST /venues", payload: { venue_name: "Stadium", venue_type: OUTDOOR, surface: GRASS, address: "1 School Rd" }, as: SystemAdmin, captures: { v1: $.data.id, v1_v: $.data.version } }
            - { call: "POST /emergency-action-plans", payload: { venue_id: "${v1}", version_label: "v1", evacuation_route: "Gate A", aed_location: "Lobby", ems_contact: "911", nearest_hospital: "General" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { eap1: $.data.id } }
            - { call: "POST /emergency-action-plans/${eap1}/submit", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /emergency-action-plans/${eap1}/approve", payload: {}, as: AthleticDirector, as_user_id: "${ad}" }
            - { call: "POST /emergency-action-plans/${eap1}/activate", payload: { expected_venue_version: "${v1_v}" }, as: AthleticDirector, as_user_id: "${ad}" }
            - { call: "POST /events", payload: { event_name: "Game E", sport: FOOTBALL, team_level: VARSITY, event_type: HOME_GAME, venue_id: "${v1}", scheduled_start: "2026-08-02T14:00:00Z", scheduled_end: "2026-08-02T17:00:00Z", expected_attendance: 500 }, as: AthleticDirector, as_user_id: "${ad}", captures: { ev: $.data.id } }
            - { call: "POST /coverage-assignments", payload: { event_id: "${ev}", staff_id: "${tr1}", coverage_role: PRIMARY }, as: AthleticDirector, as_user_id: "${ad}", captures: { ca1: $.data.id } }
            - { call: "POST /coverage-assignments", payload: { event_id: "${ev}", staff_id: "${tr2}", coverage_role: SECONDARY }, as: AthleticDirector, as_user_id: "${ad}", captures: { ca2: $.data.id } }
            - { call: "POST /coverage-assignments/${ca1}/acknowledge", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /coverage-assignments/${ca1}/check-in", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T14:05:00Z" }, as: SystemAdmin }
            - { call: "POST /events/${ev}/start", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T14:30:00Z" }, as: SystemAdmin }
            - { call: "POST /weather-readings", payload: { venue_id: "${v1}", reading_type: LIGHTNING_STRIKE, strike_distance_miles: 5.0, recorded_at: "2026-08-02T14:30:00Z", source: ON_SITE_SENSOR }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "GET /events/${ev}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ev_s1: $.data.status, ev_reason: $.data.suspension_reason } }
            - { call: "GET /coverage-assignments", payload: { event_id: "${ev}", staff_id: "${tr1}" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ca1_s1: "$.data[0].status", ca1_pre: "$.data[0].pre_hold_status" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T15:00:00Z" }, as: SystemAdmin }
            - { call: "POST /events/${ev}/resume", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ev_s2: $.data.status } }
            - { call: "GET /coverage-assignments", payload: { event_id: "${ev}", staff_id: "${tr1}" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ca1_s2: "$.data[0].status", ca1_pre2: "$.data[0].pre_hold_status" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T15:10:00Z" }, as: SystemAdmin }
            - { call: "POST /weather-readings", payload: { venue_id: "${v1}", reading_type: LIGHTNING_STRIKE, strike_distance_miles: 6.5, recorded_at: "2026-08-02T15:10:00Z", source: WEATHER_SERVICE }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "GET /events/${ev}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ev_s3: $.data.status } }
          assert:
            - "ev_s1 == SUSPENDED_WEATHER and ev_reason == LIGHTNING (strike at 5.0 mi <= radius 8.0)"
            - "ca1_s1 == ON_HOLD and ca1_pre == ON_SITE (snapshot taken)"
            - "Resume at exactly 15:00:00Z (hold_until = 14:30 + 30 min, inclusive boundary) succeeds: ev_s2 == IN_PROGRESS"
            - "ca1_s2 == ON_SITE and ca1_pre2 == null (restored from snapshot)"
            - "ev_s3 == SUSPENDED_WEATHER after the second strike — the cycle repeats"
            - "Assignment ${ca2} remains ASSIGNED through both suspensions (only ACKNOWLEDGED/ON_SITE are held)"

      - name: eap_revision_loop_draft_pending
        grounds:
          - state_machines.EmergencyActionPlan.DRAFT_to_PENDING_APPROVAL
          - state_machines.EmergencyActionPlan.PENDING_APPROVAL_to_DRAFT
          - state_machines.EmergencyActionPlan.APPROVED_to_ACTIVE
          - concurrency_rules[eap-activate-stale-venue]
        distinguishing_aspect: |
          Cyclic machine on EmergencyActionPlan: DRAFT -> PENDING_APPROVAL -> DRAFT
          (reject) -> PENDING_APPROVAL -> APPROVED -> ACTIVE; the reject edge loops
          back to the initial state. Distinct entity from the RTP and event cycles.
        test_recipe:
          setup:
            - "Venue V; EAP drafted by trainer T1 (author), AthleticDirector AD approves (segregation satisfied)"
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Director Dee", role_type: ATHLETIC_DIRECTOR }, as: SystemAdmin, captures: { ad: $.data.id } }
            - { call: "POST /venues", payload: { venue_name: "Fieldhouse", venue_type: INDOOR, surface: COURT, address: "2 School Rd" }, as: SystemAdmin, captures: { v1: $.data.id, v1_v: $.data.version } }
            - { call: "POST /emergency-action-plans", payload: { venue_id: "${v1}", version_label: "v1", evacuation_route: "Door B", aed_location: "Gym wall", ems_contact: "911", nearest_hospital: "General" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { eap: $.data.id, s0: $.data.status } }
            - { call: "POST /emergency-action-plans/${eap}/submit", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { s1: $.data.status } }
          trigger:
            - { call: "POST /emergency-action-plans/${eap}/reject", payload: {}, as: AthleticDirector, as_user_id: "${ad}", captures: { s2: $.data.status } }
            - { call: "POST /emergency-action-plans/${eap}/submit", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { s3: $.data.status } }
            - { call: "POST /emergency-action-plans/${eap}/approve", payload: {}, as: AthleticDirector, as_user_id: "${ad}", captures: { s4: $.data.status } }
            - { call: "POST /emergency-action-plans/${eap}/activate", payload: { expected_venue_version: "${v1_v}" }, as: AthleticDirector, as_user_id: "${ad}", captures: { s5: $.data.status } }
            - { call: "GET /venues/${v1}", payload: {}, as: AthleticDirector, as_user_id: "${ad}", captures: { v_eap: $.data.active_eap_id, v_ver: $.data.version } }
          assert:
            - "s0 == DRAFT and s1 == PENDING_APPROVAL"
            - "s2 == DRAFT (reject loops back — the cycle edge)"
            - "s3 == PENDING_APPROVAL and s4 == APPROVED and s5 == ACTIVE"
            - "v_eap == ${eap} and v_ver == 2 (activation bumped Venue.version exactly once)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (3 instances; depth 3 / 2 / 2, distinct triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: referral_not_cleared_three_hop_cascade
        grounds:
          - state_machines.PhysicianReferral.SCHEDULED_to_COMPLETED
          - state_machines.ReturnToPlayProtocol.ACTIVE_to_TERMINATED
          - state_machines.InjuryEvaluation.RTP_IN_PROGRESS_to_UNDER_CARE
          - calculations.athlete_participation_posture
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST /referrals/{id}/complete with
          report_clearance = NOT_CLEARED: the report terminates the ACTIVE protocol
          (hop 1); the protocol termination, with no other ACTIVE protocol remaining,
          moves the injury RTP_IN_PROGRESS -> UNDER_CARE (hop 2); the injury change
          recomputes the athlete posture to CLEARED_WITH_RESTRICTIONS (hop 3). Each
          hop is caused by the previous hop's mutation, not by the original call.
        test_recipe:
          setup:
            - "Athlete with VERIFIED physical (2026-07-01) and baseline B1 (2026-07-15); clock 2026-08-02T09:00"
            - "CONCUSSION/MODERATE injury at 2026-08-02T08:30 (B1 auto-SUPERSEDED -> posture INELIGIBLE); new baseline B2 on 2026-08-02 restores baseline gate (posture MEDICAL_HOLD via OPEN injury)"
            - "begin-care -> UNDER_CARE; RTP protocol ACTIVE stage 1 (injury -> RTP_IN_PROGRESS)"
            - "Referral to physician MD (ROUTINE) -> SCHEDULED; injury keeps RTP_IN_PROGRESS"
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Nurse Nia", role_type: SCHOOL_NURSE }, as: SystemAdmin, captures: { nr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Doc Em", role_type: PHYSICIAN }, as: SystemAdmin, captures: { md: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete A", date_of_birth: "2009-05-01", grade: 11, sex: F, primary_sport: SOCCER, team_level: VARSITY, guardian_name: "Guard A", guardian_user_id: "g-4001", guardian_email: "ga@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { a1: $.data.id } }
            - { call: "POST /physicals", payload: { athlete_id: "${a1}", exam_date: "2026-07-01", examining_physician_name: "Dr X", outcome: CLEARED, validity_policy: DISTRICT_13MO }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ph1: $.data.id } }
            - { call: "POST /physicals/${ph1}/verify", payload: {}, as: SchoolNurse, as_user_id: "${nr1}" }
            - { call: "POST /baseline-tests", payload: { athlete_id: "${a1}", test_date: "2026-07-15", instrument: SCAT6, symptom_score: 0, memory_index: 95.0, reaction_time_ms: 250.0, balance_errors: 1 }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /injuries", payload: { athlete_id: "${a1}", body_region: HEAD_NECK, injury_type: CONCUSSION, severity: MODERATE, mechanism: "head-to-head collision", evaluated_at: "2026-08-02T08:30:00Z", restricted_activities: [PRACTICE, CONTACT] }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj: $.data.id } }
            - { call: "POST /baseline-tests", payload: { athlete_id: "${a1}", test_date: "2026-08-02", instrument: IMPACT, symptom_score: 3, memory_index: 90.0, reaction_time_ms: 265.0, balance_errors: 2 }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /injuries/${inj}/begin-care", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj_v2: $.data.version } }
            - { call: "POST /injuries/${inj}/rtp-protocols", payload: { protocol_type: GRADUATED_6_STAGE, expected_injury_version: "${inj_v2}" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { rtp: $.data.id } }
            - { call: "POST /referrals", payload: { injury_id: "${inj}", physician_staff_id: "${md}", reason: "concussion specialist eval", urgency: ROUTINE }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ref: $.data.id } }
            - { call: "POST /referrals/${ref}/schedule", payload: { appointment_at: "2026-08-03T10:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}" }
          trigger:
            - { call: "POST /referrals/${ref}/complete", payload: { report_diagnosis: "concussion - persistent symptoms", report_clearance: NOT_CLEARED }, as: Physician, as_user_id: "${md}", captures: { ref_s: $.data.status } }
            - { call: "GET /rtp-protocols/${rtp}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { rtp_s: $.data.status } }
            - { call: "GET /injuries/${inj}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj_s: $.data.status } }
            - { call: "GET /athletes/${a1}/clearance", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { posture: $.data.participation_posture } }
          assert:
            - "ref_s == COMPLETED"
            - "rtp_s == TERMINATED (hop 1: caused by the NOT_CLEARED report)"
            - "inj_s == UNDER_CARE (hop 2: caused by the protocol termination, no other ACTIVE protocol)"
            - "posture == CLEARED_WITH_RESTRICTIONS (hop 3: caused by the injury status change)"

      - name: rtp_regress_injury_posture_cascade
        grounds:
          - state_machines.ReturnToPlayProtocol.ACTIVE_to_ACTIVE
          - state_machines.InjuryEvaluation.RTP_IN_PROGRESS_to_UNDER_CARE
          - calculations.athlete_participation_posture
          - entities.GuardianNotification.fields.notification_type
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (POST /rtp-protocols/{id}/regress):
          the regression moves the injury RTP_IN_PROGRESS -> UNDER_CARE (hop 1);
          the injury change recomputes the athlete posture (hop 2). A
          RTP_REGRESSION GuardianNotification is also spawned by the regression.
        test_recipe:
          setup:
            - "Same base as rtp_regress_cycle_stage_reentry: cleared athlete, SPRAIN/MINOR injury UNDER_CARE, protocol ACTIVE, advanced to stage 2 at 2026-08-03T09:00"
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Nurse Nia", role_type: SCHOOL_NURSE }, as: SystemAdmin, captures: { nr1: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete A", date_of_birth: "2009-05-01", grade: 11, sex: M, primary_sport: SOCCER, team_level: VARSITY, guardian_name: "Guard A", guardian_user_id: "g-4002", guardian_email: "ga@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { a1: $.data.id } }
            - { call: "POST /physicals", payload: { athlete_id: "${a1}", exam_date: "2026-07-01", examining_physician_name: "Dr X", outcome: CLEARED, validity_policy: DISTRICT_13MO }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ph1: $.data.id } }
            - { call: "POST /physicals/${ph1}/verify", payload: {}, as: SchoolNurse, as_user_id: "${nr1}" }
            - { call: "POST /baseline-tests", payload: { athlete_id: "${a1}", test_date: "2026-07-15", instrument: SCAT6, symptom_score: 0, memory_index: 95.0, reaction_time_ms: 250.0, balance_errors: 1 }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /injuries", payload: { athlete_id: "${a1}", body_region: KNEE, injury_type: SPRAIN, severity: MINOR, mechanism: "cutting move", evaluated_at: "2026-08-02T08:30:00Z", restricted_activities: [PRACTICE] }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj: $.data.id } }
            - { call: "POST /injuries/${inj}/begin-care", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj_v2: $.data.version } }
            - { call: "POST /injuries/${inj}/rtp-protocols", payload: { protocol_type: GRADUATED_6_STAGE, expected_injury_version: "${inj_v2}" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { rtp: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rtp-protocols/${rtp}/advance", payload: { symptom_check_passed: true }, as: AthleticTrainer, as_user_id: "${tr1}" }
          trigger:
            - { call: "POST /rtp-protocols/${rtp}/regress", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "GET /injuries/${inj}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj_s: $.data.status } }
            - { call: "GET /athletes/${a1}/clearance", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { posture: $.data.participation_posture, reasons: $.data.posture_reasons } }
            - { call: "GET /guardian-notifications", payload: { athlete_id: "${a1}", notification_type: RTP_REGRESSION }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { reg_n: "$.data[0].status" } }
          assert:
            - "inj_s == UNDER_CARE (hop 1: caused by the regression)"
            - "posture == CLEARED_WITH_RESTRICTIONS and reasons contains INJURY_RESTRICTIONS (hop 2: caused by the injury change)"
            - "reg_n == QUEUED (notification spawned by the regression)"

      - name: restock_receive_ledger_budget_cascade
        grounds:
          - state_machines.RestockOrder.APPROVED_to_RECEIVED
          - calculations.inventory_stock
          - entities.SupplyBudget.fields.realized_spend_cents
        distinguishing_aspect: |
          Depth-2+ cascade from a third trigger (POST /restock-orders/{id}/receive):
          the receipt appends an InventoryTransaction RESTOCK row (hop 1); the ledger
          append recomputes SupplyItem.current_stock 0 -> 20 and stock_status
          OUT_OF_STOCK -> IN_STOCK (hop 2); the receipt also moves 10000 cents from
          committed to realized on the budget.
        test_recipe:
          setup:
            - "SupplyBudget FY2026 total 100000; SupplyItem I (par 50, threshold 15, unit_cost 500), stock 0"
            - "Order O qty 20 @ 500 (extended 10000), DRAFT -> SUBMITTED -> APPROVED (budget committed 10000, available 90000)"
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Director Dee", role_type: ATHLETIC_DIRECTOR }, as: SystemAdmin, captures: { ad: $.data.id } }
            - { call: "POST /supply-budgets", payload: { fiscal_year: 2026, total_budget_cents: 100000 }, as: SystemAdmin, captures: { bud: $.data.id } }
            - { call: "POST /supply-items", payload: { item_name: "Water Cooler", category: HYDRATION, unit: EACH, par_level: 50, reorder_threshold: 15, unit_cost_cents: 500 }, as: SystemAdmin, captures: { item: $.data.id } }
            - { call: "POST /restock-orders", payload: { supply_item_id: "${item}", quantity: 20, unit_cost_cents: 500, fiscal_year: 2026 }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ord: $.data.id, ext: $.data.extended_cost_cents } }
            - { call: "POST /restock-orders/${ord}/submit", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /restock-orders/${ord}/approve", payload: {}, as: AthleticDirector, as_user_id: "${ad}" }
          trigger:
            - { call: "POST /restock-orders/${ord}/receive", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ord_s: $.data.status } }
            - { call: "GET /inventory-transactions", payload: { restock_order_id: "${ord}" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { tx_type: "$.data[0].txn_type", tx_qty: "$.data[0].quantity", tx_cost: "$.data[0].unit_cost_cents" } }
            - { call: "GET /supply-items/${item}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { stock: $.data.current_stock, stock_s: $.data.stock_status } }
            - { call: "GET /supply-budgets", payload: { fiscal_year: 2026 }, as: SystemAdmin, captures: { b_com: "$.data[0].committed_spend_cents", b_rea: "$.data[0].realized_spend_cents", b_avl: "$.data[0].available_cents" } }
          assert:
            - "ord_s == RECEIVED"
            - "tx_type == RESTOCK and tx_qty == 20 and tx_cost == 500 (hop 1: ledger row spawned by the receipt)"
            - "stock == 20 and stock_s == IN_STOCK (hop 2: 20 > threshold 15; caused by the ledger append)"
            - "b_com == 0 and b_rea == 10000 and b_avl == 90000 (committed converted to realized)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (2 instances, different pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: rtp_advance_state_vs_safety_priority
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - state_machines.ReturnToPlayProtocol.ACTIVE_to_ACTIVE
          - calculations.physical_expiry
        distinguishing_aspect: |
          Pair state(6) vs business_safety(7): the protocol is TERMINATED (state
          violation) AND the athlete's physical has just expired making posture
          INELIGIBLE (safety violation, ERR_PHYSICAL_EXPIRED). Priority 6 wins:
          the response must be ERR_INVALID_STATE, not ERR_PHYSICAL_EXPIRED.
        test_recipe:
          setup:
            - "Clock 2026-07-15; athlete with physical exam 2025-07-01 DISTRICT_13MO (expires_on 2026-08-01T00:00:00Z), VERIFIED; baseline 2026-07-10 CURRENT"
            - "SPRAIN/MINOR injury -> UNDER_CARE -> protocol ACTIVE; protocol then TERMINATED (injury returns to UNDER_CARE)"
            - "Clock set to 2026-08-01T00:00:00Z: sweep expires the physical (now >= expires_on, inclusive) -> posture INELIGIBLE"
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Nurse Nia", role_type: SCHOOL_NURSE }, as: SystemAdmin, captures: { nr1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /athletes", payload: { full_name: "Athlete A", date_of_birth: "2009-05-01", grade: 11, sex: M, primary_sport: SOCCER, team_level: VARSITY, guardian_name: "Guard A", guardian_user_id: "g-5001", guardian_email: "ga@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { a1: $.data.id } }
            - { call: "POST /physicals", payload: { athlete_id: "${a1}", exam_date: "2025-07-01", examining_physician_name: "Dr X", outcome: CLEARED, validity_policy: DISTRICT_13MO }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ph1: $.data.id } }
            - { call: "POST /physicals/${ph1}/verify", payload: {}, as: SchoolNurse, as_user_id: "${nr1}" }
            - { call: "POST /baseline-tests", payload: { athlete_id: "${a1}", test_date: "2026-07-10", instrument: SCAT6, symptom_score: 0, memory_index: 95.0, reaction_time_ms: 250.0, balance_errors: 1 }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /injuries", payload: { athlete_id: "${a1}", body_region: KNEE, injury_type: SPRAIN, severity: MINOR, mechanism: "twist", evaluated_at: "2026-07-14T10:00:00Z", restricted_activities: [PRACTICE] }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj: $.data.id } }
            - { call: "POST /injuries/${inj}/begin-care", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj_v2: $.data.version } }
            - { call: "POST /injuries/${inj}/rtp-protocols", payload: { protocol_type: GRADUATED_6_STAGE, expected_injury_version: "${inj_v2}" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { rtp: $.data.id } }
            - { call: "POST /rtp-protocols/${rtp}/terminate", payload: { reason: "athlete relocated" }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "GET /physicals/${ph1}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ph_s: $.data.status } }
            - { call: "GET /athletes/${a1}/clearance", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { posture: $.data.participation_posture } }
            - { call: "POST /rtp-protocols/${rtp}/advance", payload: { symptom_check_passed: true }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err: $.data.error_id } }
          assert:
            - "ph_s == EXPIRED and posture == INELIGIBLE (the safety violation is genuinely present)"
            - "err == ERR_INVALID_STATE (http 409) — priority-6 state beats priority-7 safety; NOT ERR_PHYSICAL_EXPIRED"

      - name: coverage_assign_temporal_vs_referential_priority
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - entities.CoverageAssignment.fields.staff_id
        distinguishing_aspect: |
          Pair business_temporal(8) vs business_referential(9): one request violates
          both the PRIMARY-overlap rule (trainer already PRIMARY on an overlapping
          event) and the reference-quality rule (trainer is_active = false). The
          temporal conflict ERR_COVERAGE_OVERLAP must win over
          ERR_STAFF_ROLE_MISMATCH.
        test_recipe:
          setup:
            - "Trainer T1 holds PRIMARY on event A at venue V1 [2026-08-02T14:00, 17:00)"
            - "T1 deactivated (is_active = false) via PATCH /staff"
            - "Event B at venue V2 [2026-08-02T16:00, 18:00) — overlaps A"
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Director Dee", role_type: ATHLETIC_DIRECTOR }, as: SystemAdmin, captures: { ad: $.data.id } }
            - { call: "POST /venues", payload: { venue_name: "Stadium", venue_type: OUTDOOR, surface: GRASS, address: "1 School Rd" }, as: SystemAdmin, captures: { v1: $.data.id } }
            - { call: "POST /venues", payload: { venue_name: "Gym", venue_type: INDOOR, surface: COURT, address: "3 School Rd" }, as: SystemAdmin, captures: { v2: $.data.id } }
            - { call: "POST /events", payload: { event_name: "Game A", sport: SOCCER, team_level: VARSITY, event_type: HOME_GAME, venue_id: "${v1}", scheduled_start: "2026-08-02T14:00:00Z", scheduled_end: "2026-08-02T17:00:00Z", expected_attendance: 100 }, as: AthleticDirector, as_user_id: "${ad}", captures: { evA: $.data.id } }
            - { call: "POST /coverage-assignments", payload: { event_id: "${evA}", staff_id: "${tr1}", coverage_role: PRIMARY }, as: AthleticDirector, as_user_id: "${ad}" }
            - { call: "PATCH /staff/${tr1}", payload: { is_active: false }, as: SystemAdmin }
            - { call: "POST /events", payload: { event_name: "Game B", sport: SOCCER, team_level: VARSITY, event_type: HOME_GAME, venue_id: "${v2}", scheduled_start: "2026-08-02T16:00:00Z", scheduled_end: "2026-08-02T18:00:00Z", expected_attendance: 100 }, as: AthleticDirector, as_user_id: "${ad}", captures: { evB: $.data.id } }
          trigger:
            - { call: "POST /coverage-assignments", payload: { event_id: "${evB}", staff_id: "${tr1}", coverage_role: PRIMARY }, as: AthleticDirector, as_user_id: "${ad}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_COVERAGE_OVERLAP (http 409) — priority-8 temporal beats priority-9 referential; NOT ERR_STAFF_ROLE_MISMATCH"
            - "Both violations are present: Staff.${tr1}.is_active == false AND [14:00,17:00) overlaps [16:00,18:00)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (3 instances, different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: heat_tier_boundary_84_inclusive
        grounds:
          - calculations.heat_activity_tier
        distinguishing_aspect: |
          Metric: WBGT numeric tier boundary. The [84.0, 87.0) MODERATE band has an
          INCLUSIVE lower bound: 83.9 -> CAUTION, 84.0 -> MODERATE, 86.9 -> MODERATE,
          87.0 -> SEVERE. Driven through POST /weather-readings and observed on
          GET /venues/{id}/activity-status.
        test_recipe:
          setup:
            - "Venue V (OUTDOOR); clock 2026-08-02T14:00:00Z; no events needed — venue-level tier uses the DISTRICT variant"
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /venues", payload: { venue_name: "Stadium", venue_type: OUTDOOR, surface: TURF, address: "1 School Rd" }, as: SystemAdmin, captures: { v1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T14:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /weather-readings", payload: { venue_id: "${v1}", reading_type: HEAT_WBGT, value_wbgt_f: 83.9, recorded_at: "2026-08-02T13:00:00Z", source: ON_SITE_SENSOR }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "GET /venues/${v1}/activity-status", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { t1: $.data.current_heat_tier } }
            - { call: "POST /weather-readings", payload: { venue_id: "${v1}", reading_type: HEAT_WBGT, value_wbgt_f: 84.0, recorded_at: "2026-08-02T13:05:00Z", source: ON_SITE_SENSOR }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "GET /venues/${v1}/activity-status", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { t2: $.data.current_heat_tier } }
            - { call: "POST /weather-readings", payload: { venue_id: "${v1}", reading_type: HEAT_WBGT, value_wbgt_f: 86.9, recorded_at: "2026-08-02T13:10:00Z", source: ON_SITE_SENSOR }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "GET /venues/${v1}/activity-status", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { t3: $.data.current_heat_tier } }
            - { call: "POST /weather-readings", payload: { venue_id: "${v1}", reading_type: HEAT_WBGT, value_wbgt_f: 87.0, recorded_at: "2026-08-02T13:15:00Z", source: ON_SITE_SENSOR }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "GET /venues/${v1}/activity-status", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { t4: $.data.current_heat_tier } }
          assert:
            - "t1 == CAUTION (83.9 below the 84.0 breakpoint)"
            - "t2 == MODERATE (84.0 hits the inclusive lower bound)"
            - "t3 == MODERATE (86.9 still inside [84.0, 87.0))"
            - "t4 == SEVERE (87.0 hits the next inclusive breakpoint)"

      - name: rtp_dwell_exactly_24h_inclusive
        grounds:
          - calculations.rtp_stage_dwell
          - state_machines.ReturnToPlayProtocol.ACTIVE_to_ACTIVE
        distinguishing_aspect: |
          Metric: elapsed-time dwell threshold. Advance at stage_entered_at +
          23:59:59 fails ERR_RTP_STAGE_DWELL_NOT_MET; at exactly +24:00:00 the >=
          boundary admits the advance. Driven through POST /rtp-protocols/{id}/advance.
        test_recipe:
          setup:
            - "Cleared athlete; SPRAIN/MINOR injury UNDER_CARE; protocol created at clock 2026-08-02T09:00:00Z (stage_entered_at = that instant)"
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Nurse Nia", role_type: SCHOOL_NURSE }, as: SystemAdmin, captures: { nr1: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete A", date_of_birth: "2009-05-01", grade: 11, sex: F, primary_sport: TRACK, team_level: JV, guardian_name: "Guard A", guardian_user_id: "g-6001", guardian_email: "ga@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { a1: $.data.id } }
            - { call: "POST /physicals", payload: { athlete_id: "${a1}", exam_date: "2026-07-01", examining_physician_name: "Dr X", outcome: CLEARED, validity_policy: DISTRICT_13MO }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ph1: $.data.id } }
            - { call: "POST /physicals/${ph1}/verify", payload: {}, as: SchoolNurse, as_user_id: "${nr1}" }
            - { call: "POST /baseline-tests", payload: { athlete_id: "${a1}", test_date: "2026-07-15", instrument: SWAY, symptom_score: 0, memory_index: 97.0, reaction_time_ms: 240.0, balance_errors: 0 }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /injuries", payload: { athlete_id: "${a1}", body_region: LOWER_LEG, injury_type: STRAIN, severity: MINOR, mechanism: "sprint pull", evaluated_at: "2026-08-02T08:30:00Z", restricted_activities: [PRACTICE] }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj: $.data.id } }
            - { call: "POST /injuries/${inj}/begin-care", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj_v2: $.data.version } }
            - { call: "POST /injuries/${inj}/rtp-protocols", payload: { protocol_type: GRADUATED_6_STAGE, expected_injury_version: "${inj_v2}" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { rtp: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:59:59Z" }, as: SystemAdmin }
            - { call: "POST /rtp-protocols/${rtp}/advance", payload: { symptom_check_passed: true }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rtp-protocols/${rtp}/advance", payload: { symptom_check_passed: true }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { st: $.data.current_stage, entered: $.data.stage_entered_at } }
          assert:
            - "err == ERR_RTP_STAGE_DWELL_NOT_MET at 23:59:59 elapsed"
            - "st == 2 at exactly 24:00:00 elapsed (inclusive boundary)"
            - "entered == 2026-08-03T09:00:00Z (dwell clock restarted by the successful advance)"

      - name: referral_due_boundary_exclusive
        grounds:
          - calculations.referral_due_window
          - state_machines.PhysicianReferral.SCHEDULED_to_EXPIRED
        distinguishing_aspect: |
          Metric: deadline boundary with EXCLUSIVE comparison — a ROUTINE referral's
          due_by = created_at + 14 days; at exactly due_by the referral is still
          actionable (schedule succeeds), one second later the sweep marks it EXPIRED
          and a further schedule attempt fails ERR_INVALID_STATE. Contrasts with the
          inclusive dwell boundary. Driven through POST /referrals/{id}/schedule and
          the clock sweep.
        test_recipe:
          setup:
            - "Athlete; SPRAIN/MODERATE injury OPEN; ROUTINE referral created at the default clock 2026-08-01T00:00:00Z (due_by 2026-08-15T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Doc Em", role_type: PHYSICIAN }, as: SystemAdmin, captures: { md: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete A", date_of_birth: "2009-05-01", grade: 10, sex: M, primary_sport: BASEBALL, team_level: JV, guardian_name: "Guard A", guardian_user_id: "g-6002", guardian_email: "ga@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { a1: $.data.id } }
            - { call: "POST /injuries", payload: { athlete_id: "${a1}", body_region: SHOULDER, injury_type: SPRAIN, severity: MODERATE, mechanism: "throwing", evaluated_at: "2026-07-31T10:00:00Z", restricted_activities: [PRACTICE, GAME] }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj: $.data.id } }
            - { call: "POST /referrals", payload: { injury_id: "${inj}", physician_staff_id: "${md}", reason: "shoulder eval", urgency: ROUTINE }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ref: $.data.id, due: $.data.due_by } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /referrals/${ref}/schedule", payload: { appointment_at: "2026-08-15T10:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { s1: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:01Z" }, as: SystemAdmin }
            - { call: "GET /referrals/${ref}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { s2: $.data.status } }
            - { call: "POST /referrals/${ref}/schedule", payload: { appointment_at: "2026-08-16T10:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err: $.data.error_id } }
          assert:
            - "due == 2026-08-15T00:00:00Z (created_at + 14 days)"
            - "s1 == SCHEDULED at exactly due_by (exclusive boundary: expiry requires now > due_by)"
            - "s2 == EXPIRED one second past due_by"
            - "err == ERR_INVALID_STATE (EXPIRED is terminal for scheduling)"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (3 instances, different pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: event_start_gated_by_venue_eap
        grounds:
          - state_machines.AthleticEvent.COVERED_to_IN_PROGRESS
          - state_machines.EmergencyActionPlan.APPROVED_to_ACTIVE
          - entities.Venue.fields.active_eap_id
        distinguishing_aspect: |
          Pair AthleticEvent -> EmergencyActionPlan (via Venue.active_eap_id): a
          fully COVERED event at a venue whose EAP is merely APPROVED (not ACTIVE)
          cannot start (ERR_NO_ACTIVE_EAP); after activation the same start succeeds.
        test_recipe:
          setup:
            - "Venue V; event SOCCER VARSITY PRACTICE (required 1) with T1 PRIMARY -> COVERED; EAP at V is APPROVED but not yet ACTIVE; no weather readings"
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Director Dee", role_type: ATHLETIC_DIRECTOR }, as: SystemAdmin, captures: { ad: $.data.id } }
            - { call: "POST /venues", payload: { venue_name: "Practice Field", venue_type: OUTDOOR, surface: GRASS, address: "4 School Rd" }, as: SystemAdmin, captures: { v1: $.data.id, v1_v: $.data.version } }
            - { call: "POST /events", payload: { event_name: "Practice", sport: SOCCER, team_level: VARSITY, event_type: PRACTICE, venue_id: "${v1}", scheduled_start: "2026-08-02T14:00:00Z", scheduled_end: "2026-08-02T15:30:00Z", expected_attendance: 0 }, as: AthleticDirector, as_user_id: "${ad}", captures: { ev: $.data.id, req: $.data.required_trainer_count } }
            - { call: "POST /coverage-assignments", payload: { event_id: "${ev}", staff_id: "${tr1}", coverage_role: PRIMARY }, as: AthleticDirector, as_user_id: "${ad}" }
            - { call: "POST /emergency-action-plans", payload: { venue_id: "${v1}", version_label: "v1", evacuation_route: "Gate C", aed_location: "Shed", ems_contact: "911", nearest_hospital: "General" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { eap: $.data.id } }
            - { call: "POST /emergency-action-plans/${eap}/submit", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /emergency-action-plans/${eap}/approve", payload: {}, as: AthleticDirector, as_user_id: "${ad}" }
          trigger:
            - { call: "POST /events/${ev}/start", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err: $.data.error_id } }
            - { call: "POST /emergency-action-plans/${eap}/activate", payload: { expected_venue_version: "${v1_v}" }, as: AthleticDirector, as_user_id: "${ad}" }
            - { call: "POST /events/${ev}/start", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ev_s: $.data.status } }
          assert:
            - "req == 1 (MEDIUM contact, PRACTICE, attendance 0)"
            - "err == ERR_NO_ACTIVE_EAP while the EAP is APPROVED-but-not-ACTIVE"
            - "ev_s == IN_PROGRESS after the EAP becomes ACTIVE"

      - name: concussion_stage5_gated_by_referral_report
        grounds:
          - state_machines.ReturnToPlayProtocol.ACTIVE_to_ACTIVE
          - state_machines.PhysicianReferral.SCHEDULED_to_COMPLETED
          - entities.ReturnToPlayProtocol.fields.clearance_authority_required
        distinguishing_aspect: |
          Pair ReturnToPlayProtocol -> PhysicianReferral: a concussion protocol's
          advance into stage 5 requires a COMPLETED/CLOSED referral carrying
          report_clearance in {CLEARED_FULL, CLEARED_RESTRICTED}. Without it the
          advance fails ERR_RTP_PHYSICIAN_REVIEW_REQUIRED; after the physician
          files CLEARED_FULL, the identical advance succeeds.
        test_recipe:
          setup:
            - "Cleared athlete; CONCUSSION/MODERATE injury (baseline B1 auto-SUPERSEDED); new baseline B2 recorded; begin-care; protocol ACTIVE at 2026-08-02T09:00; advanced to stage 4 via 24h steps (stage_entered_at 2026-08-05T09:00)"
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Nurse Nia", role_type: SCHOOL_NURSE }, as: SystemAdmin, captures: { nr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Doc Em", role_type: PHYSICIAN }, as: SystemAdmin, captures: { md: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete A", date_of_birth: "2009-05-01", grade: 11, sex: F, primary_sport: SOCCER, team_level: VARSITY, guardian_name: "Guard A", guardian_user_id: "g-7001", guardian_email: "ga@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { a1: $.data.id } }
            - { call: "POST /physicals", payload: { athlete_id: "${a1}", exam_date: "2026-07-01", examining_physician_name: "Dr X", outcome: CLEARED, validity_policy: DISTRICT_13MO }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ph1: $.data.id } }
            - { call: "POST /physicals/${ph1}/verify", payload: {}, as: SchoolNurse, as_user_id: "${nr1}" }
            - { call: "POST /baseline-tests", payload: { athlete_id: "${a1}", test_date: "2026-07-15", instrument: SCAT6, symptom_score: 0, memory_index: 95.0, reaction_time_ms: 250.0, balance_errors: 1 }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /injuries", payload: { athlete_id: "${a1}", body_region: HEAD_NECK, injury_type: CONCUSSION, severity: MODERATE, mechanism: "heading collision", evaluated_at: "2026-08-02T08:30:00Z", restricted_activities: [PRACTICE, CONTACT] }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj: $.data.id } }
            - { call: "POST /baseline-tests", payload: { athlete_id: "${a1}", test_date: "2026-08-02", instrument: SCAT6, symptom_score: 2, memory_index: 92.0, reaction_time_ms: 260.0, balance_errors: 2 }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /injuries/${inj}/begin-care", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj_v2: $.data.version } }
            - { call: "POST /injuries/${inj}/rtp-protocols", payload: { protocol_type: GRADUATED_6_STAGE, expected_injury_version: "${inj_v2}" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { rtp: $.data.id, auth: $.data.clearance_authority_required } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rtp-protocols/${rtp}/advance", payload: { symptom_check_passed: true }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rtp-protocols/${rtp}/advance", payload: { symptom_check_passed: true }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rtp-protocols/${rtp}/advance", payload: { symptom_check_passed: true }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { st4: $.data.current_stage } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rtp-protocols/${rtp}/advance", payload: { symptom_check_passed: true }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err: $.data.error_id } }
            - { call: "POST /referrals", payload: { injury_id: "${inj}", physician_staff_id: "${md}", reason: "concussion clearance eval", urgency: ROUTINE }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ref: $.data.id } }
            - { call: "POST /referrals/${ref}/schedule", payload: { appointment_at: "2026-08-06T10:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /referrals/${ref}/complete", payload: { report_diagnosis: "concussion resolved", report_clearance: CLEARED_FULL }, as: Physician, as_user_id: "${md}" }
            - { call: "POST /rtp-protocols/${rtp}/advance", payload: { symptom_check_passed: true }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { st5: $.data.current_stage } }
          assert:
            - "auth == PHYSICIAN (concussion computes physician clearance authority)"
            - "st4 == 4"
            - "err == ERR_RTP_PHYSICIAN_REVIEW_REQUIRED (advance into stage 5 gated on the referral report)"
            - "st5 == 5 after the physician files CLEARED_FULL (dwell satisfied: stage 4 entered 2026-08-05T09:00, advance at 2026-08-06 >= +24h)"

      - name: assignment_gated_by_event_terminal_state
        grounds:
          - validations[priority=6]
          - state_machines.AthleticEvent.SCHEDULED_to_CANCELLED
          - state_machines.AthleticEvent.SCHEDULED_to_COVERED
        distinguishing_aspect: |
          Pair CoverageAssignment -> AthleticEvent: assignment creation is only valid
          while the referenced event is SCHEDULED or COVERED; once the event is
          CANCELLED (which itself cascades the existing assignment to CANCELLED), a
          new assignment against it fails ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Venue V; event SOCCER PRACTICE (required 1) with T1 PRIMARY -> COVERED; event then cancelled (assignment cascades to CANCELLED)"
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Trainer Two", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr2: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Director Dee", role_type: ATHLETIC_DIRECTOR }, as: SystemAdmin, captures: { ad: $.data.id } }
            - { call: "POST /venues", payload: { venue_name: "Field", venue_type: OUTDOOR, surface: GRASS, address: "5 School Rd" }, as: SystemAdmin, captures: { v1: $.data.id } }
            - { call: "POST /events", payload: { event_name: "Practice", sport: SOCCER, team_level: VARSITY, event_type: PRACTICE, venue_id: "${v1}", scheduled_start: "2026-08-02T14:00:00Z", scheduled_end: "2026-08-02T15:30:00Z", expected_attendance: 0 }, as: AthleticDirector, as_user_id: "${ad}", captures: { ev: $.data.id } }
            - { call: "POST /coverage-assignments", payload: { event_id: "${ev}", staff_id: "${tr1}", coverage_role: PRIMARY }, as: AthleticDirector, as_user_id: "${ad}", captures: { ca1: $.data.id } }
            - { call: "POST /events/${ev}/cancel", payload: {}, as: AthleticDirector, as_user_id: "${ad}", captures: { ev_s: $.data.status } }
          trigger:
            - { call: "GET /coverage-assignments", payload: { event_id: "${ev}" }, as: AthleticDirector, as_user_id: "${ad}", captures: { ca1_s: "$.data[0].status" } }
            - { call: "POST /coverage-assignments", payload: { event_id: "${ev}", staff_id: "${tr2}", coverage_role: PRIMARY }, as: AthleticDirector, as_user_id: "${ad}", captures: { err: $.data.error_id } }
          assert:
            - "ev_s == CANCELLED and ca1_s == CANCELLED (cancel cascade)"
            - "err == ERR_INVALID_STATE (new assignments require event in SCHEDULED | COVERED)"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: trainer_primary_overlap_half_open
        grounds:
          - validations[priority=8]
          - entities.CoverageAssignment.fields.coverage_role
        distinguishing_aspect: |
          Interval semantics: bare half-open [start, end) with NO buffer on resource
          Staff. Back-to-back events (one ends 17:00, the other starts 17:00) do NOT
          collide, while a one-hour overlap does (ERR_COVERAGE_OVERLAP). Only PRIMARY
          assignments constrain the trainer.
        test_recipe:
          setup:
            - "Trainer T1 PRIMARY on event A at V1 [2026-08-02T14:00, 17:00)"
            - "Event B at V2 [17:00, 19:00) — adjacent; event C at V3 [16:00, 18:00) — overlapping"
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Director Dee", role_type: ATHLETIC_DIRECTOR }, as: SystemAdmin, captures: { ad: $.data.id } }
            - { call: "POST /venues", payload: { venue_name: "Field 1", venue_type: OUTDOOR, surface: GRASS, address: "1 Rd" }, as: SystemAdmin, captures: { v1: $.data.id } }
            - { call: "POST /venues", payload: { venue_name: "Field 2", venue_type: OUTDOOR, surface: TURF, address: "2 Rd" }, as: SystemAdmin, captures: { v2: $.data.id } }
            - { call: "POST /venues", payload: { venue_name: "Field 3", venue_type: INDOOR, surface: COURT, address: "3 Rd" }, as: SystemAdmin, captures: { v3: $.data.id } }
            - { call: "POST /events", payload: { event_name: "A", sport: FOOTBALL, team_level: VARSITY, event_type: HOME_GAME, venue_id: "${v1}", scheduled_start: "2026-08-02T14:00:00Z", scheduled_end: "2026-08-02T17:00:00Z", expected_attendance: 500 }, as: AthleticDirector, as_user_id: "${ad}", captures: { evA: $.data.id } }
            - { call: "POST /events", payload: { event_name: "B", sport: FOOTBALL, team_level: VARSITY, event_type: HOME_GAME, venue_id: "${v2}", scheduled_start: "2026-08-02T17:00:00Z", scheduled_end: "2026-08-02T19:00:00Z", expected_attendance: 500 }, as: AthleticDirector, as_user_id: "${ad}", captures: { evB: $.data.id } }
            - { call: "POST /events", payload: { event_name: "C", sport: BASKETBALL, team_level: VARSITY, event_type: HOME_GAME, venue_id: "${v3}", scheduled_start: "2026-08-02T16:00:00Z", scheduled_end: "2026-08-02T18:00:00Z", expected_attendance: 300 }, as: AthleticDirector, as_user_id: "${ad}", captures: { evC: $.data.id } }
            - { call: "POST /coverage-assignments", payload: { event_id: "${evA}", staff_id: "${tr1}", coverage_role: PRIMARY }, as: AthleticDirector, as_user_id: "${ad}" }
          trigger:
            - { call: "POST /coverage-assignments", payload: { event_id: "${evB}", staff_id: "${tr1}", coverage_role: PRIMARY }, as: AthleticDirector, as_user_id: "${ad}", captures: { caB: $.data.id, caB_s: $.data.status } }
            - { call: "POST /coverage-assignments", payload: { event_id: "${evC}", staff_id: "${tr1}", coverage_role: PRIMARY }, as: AthleticDirector, as_user_id: "${ad}", captures: { err: $.data.error_id } }
          assert:
            - "caB_s == ASSIGNED (half-open adjacency at 17:00 is not a collision)"
            - "err == ERR_COVERAGE_OVERLAP for [16:00,18:00) against [14:00,17:00)"

      - name: venue_booking_buffered_overlap
        grounds:
          - validations[priority=8]
          - entities.AthleticEvent.fields.venue_id
        distinguishing_aspect: |
          Interval semantics: half-open windows EXPANDED by a 30-minute buffer on both
          sides on resource Venue. An event starting 30 minutes after the prior
          event's end still collides (buffers [13:30,17:30) and [17:00,19:30) share
          [17:00,17:30)); starting 60 minutes after does not — a different geometric
          treatment than the bare half-open trainer rule, on a different resource.
        test_recipe:
          setup:
            - "Venue V1 hosts event A [2026-08-02T14:00, 17:00)"
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Director Dee", role_type: ATHLETIC_DIRECTOR }, as: SystemAdmin, captures: { ad: $.data.id } }
            - { call: "POST /venues", payload: { venue_name: "Main Gym", venue_type: INDOOR, surface: COURT, address: "9 Rd" }, as: SystemAdmin, captures: { v1: $.data.id } }
            - { call: "POST /events", payload: { event_name: "A", sport: BASKETBALL, team_level: VARSITY, event_type: HOME_GAME, venue_id: "${v1}", scheduled_start: "2026-08-02T14:00:00Z", scheduled_end: "2026-08-02T17:00:00Z", expected_attendance: 300 }, as: AthleticDirector, as_user_id: "${ad}", captures: { evA: $.data.id } }
          trigger:
            - { call: "POST /events", payload: { event_name: "D", sport: VOLLEYBALL, team_level: JV, event_type: HOME_GAME, venue_id: "${v1}", scheduled_start: "2026-08-02T17:30:00Z", scheduled_end: "2026-08-02T19:00:00Z", expected_attendance: 100 }, as: AthleticDirector, as_user_id: "${ad}", captures: { err: $.data.error_id } }
            - { call: "POST /events", payload: { event_name: "E", sport: VOLLEYBALL, team_level: JV, event_type: HOME_GAME, venue_id: "${v1}", scheduled_start: "2026-08-02T18:00:00Z", scheduled_end: "2026-08-02T20:00:00Z", expected_attendance: 100 }, as: AthleticDirector, as_user_id: "${ad}", captures: { evE: $.data.id, evE_s: $.data.status } }
          assert:
            - "err == ERR_VENUE_OVERLAP for D (17:30 start is inside A's buffered [13:30,17:30) window)"
            - "evE_s == SCHEDULED for E (18:00 start clears the buffer: [17:30,20:30) vs [13:30,17:30) share no instant)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (3 instances, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: inventory_usage_adjustment_conserves_stock_value
        grounds:
          - calculations.inventory_stock
          - calculations.inventory_valuation
          - state_machines.SupplyItem.OUT_OF_STOCK_to_IN_STOCK
        distinguishing_aspect: |
          Conserved quantity: stock units AND valuation cents. A USAGE of 2 followed
          by its compensating ADJUSTMENT of +2 returns current_stock to 5 and the
          FIFO valuation to exactly 1000 cents — zero drift after the action pair.
        test_recipe:
          setup:
            - "SupplyItem I (par 50, threshold 15, unit_cost 200); RESTOCK 5 @ 200 at 09:00 (stock 5, FIFO value 1000); clock 12:00"
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /supply-items", payload: { item_name: "Tape", category: TAPE, unit: ROLL, par_level: 50, reorder_threshold: 15, unit_cost_cents: 200 }, as: SystemAdmin, captures: { item: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: SystemAdmin }
            - { call: "POST /inventory-transactions", payload: { supply_item_id: "${item}", txn_type: RESTOCK, quantity: 5, unit_cost_cents: 200, occurred_at: "2026-08-01T09:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "GET /supply-items/${item}/valuation", payload: { policy: FIFO }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { q0: $.data.quantity_on_hand, v0: $.data.valuation_cents } }
          trigger:
            - { call: "POST /inventory-transactions", payload: { supply_item_id: "${item}", txn_type: USAGE, quantity: 2, occurred_at: "2026-08-01T10:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /inventory-transactions", payload: { supply_item_id: "${item}", txn_type: ADJUSTMENT, quantity: 2, occurred_at: "2026-08-01T11:00:00Z", reason: "recount found misplaced rolls" }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "GET /supply-items/${item}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { q1: $.data.current_stock, s1: $.data.stock_status } }
            - { call: "GET /supply-items/${item}/valuation", payload: { policy: FIFO }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { v1: $.data.valuation_cents } }
          assert:
            - "q0 == 5 and v0 == 1000 before the pair"
            - "q1 == 5 (units conserved: -2 then +2)"
            - "v1 == 1000 (value conserved: ADJUSTMENT layers at the most recent restock cost 200)"
            - "s1 == LOW_STOCK (q1 == 5 is within 1..threshold 15)"

      - name: order_approve_cancel_conserves_budget
        grounds:
          - state_machines.RestockOrder.SUBMITTED_to_APPROVED
          - state_machines.RestockOrder.APPROVED_to_CANCELLED
          - entities.SupplyBudget.fields.available_cents
        distinguishing_aspect: |
          Conserved quantity: budget cents. Approve commits 2000 (available
          10000 -> 8000); the compensating cancel of the APPROVED order releases the
          commitment (available back to exactly 10000, realized stays 0) — approval
          paired with cancellation leaves the budget bit-identical.
        test_recipe:
          setup:
            - "SupplyBudget FY2026 total 10000; SupplyItem I cost 500; order qty 4 @ 500 (extended 2000), DRAFT -> SUBMITTED"
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Director Dee", role_type: ATHLETIC_DIRECTOR }, as: SystemAdmin, captures: { ad: $.data.id } }
            - { call: "POST /supply-budgets", payload: { fiscal_year: 2026, total_budget_cents: 10000 }, as: SystemAdmin, captures: { bud: $.data.id, av0: $.data.available_cents } }
            - { call: "POST /supply-items", payload: { item_name: "Splints", category: FIRST_AID, unit: EACH, par_level: 20, reorder_threshold: 5, unit_cost_cents: 500 }, as: SystemAdmin, captures: { item: $.data.id } }
            - { call: "POST /restock-orders", payload: { supply_item_id: "${item}", quantity: 4, unit_cost_cents: 500, fiscal_year: 2026 }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ord: $.data.id } }
            - { call: "POST /restock-orders/${ord}/submit", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}" }
          trigger:
            - { call: "POST /restock-orders/${ord}/approve", payload: {}, as: AthleticDirector, as_user_id: "${ad}" }
            - { call: "GET /supply-budgets", payload: { fiscal_year: 2026 }, as: SystemAdmin, captures: { av1: "$.data[0].available_cents", cm1: "$.data[0].committed_spend_cents" } }
            - { call: "POST /restock-orders/${ord}/cancel", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ord_s: $.data.status } }
            - { call: "GET /supply-budgets", payload: { fiscal_year: 2026 }, as: SystemAdmin, captures: { av2: "$.data[0].available_cents", cm2: "$.data[0].committed_spend_cents", re2: "$.data[0].realized_spend_cents" } }
          assert:
            - "av0 == 10000"
            - "av1 == 8000 and cm1 == 2000 after approval"
            - "ord_s == CANCELLED and av2 == 10000 and cm2 == 0 and re2 == 0 (approve+cancel conserves budget cents exactly)"

      - name: coverage_decline_reassign_conserves_slots
        grounds:
          - state_machines.CoverageAssignment.ASSIGNED_to_DECLINED
          - state_machines.AthleticEvent.COVERED_to_SCHEDULED
          - state_machines.AthleticEvent.SCHEDULED_to_COVERED
        distinguishing_aspect: |
          Conserved quantity: the event's covered slot count. Declining one of two
          assignments drops active_assignment_count 2 -> 1 and flips the event
          COVERED -> SCHEDULED; assigning a replacement restores count 2 and COVERED.
          The decline+reassign pair conserves the event's coverage invariant.
        test_recipe:
          setup:
            - "Event FOOTBALL VARSITY HOME_GAME (required 2); T1 PRIMARY + T2 SECONDARY -> COVERED"
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Trainer Two", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr2: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Trainer Three", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr3: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Director Dee", role_type: ATHLETIC_DIRECTOR }, as: SystemAdmin, captures: { ad: $.data.id } }
            - { call: "POST /venues", payload: { venue_name: "Stadium", venue_type: OUTDOOR, surface: GRASS, address: "1 Rd" }, as: SystemAdmin, captures: { v1: $.data.id } }
            - { call: "POST /events", payload: { event_name: "Game", sport: FOOTBALL, team_level: VARSITY, event_type: HOME_GAME, venue_id: "${v1}", scheduled_start: "2026-08-02T14:00:00Z", scheduled_end: "2026-08-02T17:00:00Z", expected_attendance: 500 }, as: AthleticDirector, as_user_id: "${ad}", captures: { ev: $.data.id } }
            - { call: "POST /coverage-assignments", payload: { event_id: "${ev}", staff_id: "${tr1}", coverage_role: PRIMARY }, as: AthleticDirector, as_user_id: "${ad}" }
            - { call: "POST /coverage-assignments", payload: { event_id: "${ev}", staff_id: "${tr2}", coverage_role: SECONDARY }, as: AthleticDirector, as_user_id: "${ad}", captures: { ca2: $.data.id } }
            - { call: "GET /events/${ev}/coverage-status", payload: {}, as: AthleticDirector, as_user_id: "${ad}", captures: { rc0: $.data.active_assignment_count, cov0: $.data.is_covered } }
          trigger:
            - { call: "POST /coverage-assignments/${ca2}/decline", payload: {}, as: AthleticTrainer, as_user_id: "${tr2}" }
            - { call: "GET /events/${ev}/coverage-status", payload: {}, as: AthleticDirector, as_user_id: "${ad}", captures: { rc1: $.data.active_assignment_count, cov1: $.data.is_covered } }
            - { call: "GET /events/${ev}", payload: {}, as: AthleticDirector, as_user_id: "${ad}", captures: { ev_s1: $.data.status } }
            - { call: "POST /coverage-assignments", payload: { event_id: "${ev}", staff_id: "${tr3}", coverage_role: SECONDARY }, as: AthleticDirector, as_user_id: "${ad}" }
            - { call: "GET /events/${ev}/coverage-status", payload: {}, as: AthleticDirector, as_user_id: "${ad}", captures: { rc2: $.data.active_assignment_count, cov2: $.data.is_covered } }
          assert:
            - "rc0 == 2 and cov0 == true"
            - "rc1 == 1 and cov1 == false and ev_s1 == SCHEDULED (decline flipped the event back)"
            - "rc2 == 2 and cov2 == true after the replacement — slot count conserved by the decline+reassign pair"
