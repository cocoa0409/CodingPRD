        grounds:
          - state_machines.FitnessDetermination.ISSUED_to_CHALLENGED
          - state_machines.FitnessDetermination.CHALLENGED_to_REAFFIRMED
          - state_machines.FitnessDetermination.REAFFIRMED_to_CHALLENGED
