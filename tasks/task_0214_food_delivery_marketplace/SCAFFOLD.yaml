# =============================================================================
# Task 0214 — Food Delivery Marketplace (DoorDash / Uber Eats style)
# Difficulty tier: EXPERT
# Files: SCAFFOLD.yaml (§1.0–§1.7) | SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8)
#        | SCAFFOLD_CORNER_DESIGN.yaml (§1.9)
# =============================================================================

scenario: |
  Food Delivery Marketplace (DoorDash/Uber Eats style): restaurant
  menu/availability, order routing/batching, courier dispatch & ETA, dynamic
  delivery fee/surge, tip & adjustment, order issue/refund (missing item),
  scheduled order, dasher pay & guarantee

domain_name: food-delivery-marketplace
api_prefix: ""   # flat topology — every collection is a top-level peer resource

# -----------------------------------------------------------------------------
# Complexity profile (Step 0)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation       # estimated vs settled delivery fee & dasher pay
    - cascading_side_effects         # dispatch / cancel / refund propagation
    - scheduled_actions              # scheduled orders released at a future clock time
    - optimistic_concurrency         # OCC on Order.version for dispatch-create supersede
    - selector_policy                # courier dispatch picks one Dasher from a pool

  entity_topology: flat              # peer entities linked by FK; no nesting in business URLs
  state_machine_shape: parallel      # Order carries fulfillment_status × billing_status axes
  relationship_patterns:
    - one_to_many                    # Restaurant→MenuItem, Order→OrderLineItem, Order→Delivery
    - cross_aggregate                # Delivery → Dasher, Order → Restaurant/Customer/Zone
  role_model: peer_roles             # Customer / Restaurant / Dasher own different resources
  consistency_model: immediate       # all mutations atomic within a single request

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # --- Configuration: pricing & guarantee per delivery zone ---
  - name: Zone
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human-readable zone name (e.g., Downtown)" }
      - { name: base_delivery_fee_cents, type: integer, source: input, description: "Flat base delivery fee before distance and surge", constraints: ">= 0" }
      - { name: per_km_fee_cents, type: integer, source: input, description: "Marginal delivery fee charged per whole km of route distance", constraints: ">= 0" }
      - { name: small_order_threshold_cents, type: integer, source: input, description: "Order subtotals strictly below this incur the small-order fee" }
      - { name: small_order_fee_cents, type: integer, source: input, description: "Flat fee added when order_subtotal_cents < small_order_threshold_cents", constraints: ">= 0" }
      - { name: service_fee_bps, type: integer, source: input, default: 0, description: "Platform service fee in basis points (1/100 of a percent) applied PER LINE ITEM; default 0", constraints: ">= 0" }
      - { name: surge_tier_1_demand, type: integer, source: input, default: 5, description: "Active-order count at/above which surge multiplier 1 applies (tier boundary uses >=)" }
      - { name: surge_tier_2_demand, type: integer, source: input, default: 10, description: "Active-order count at/above which surge multiplier 2 applies (tier boundary uses >=)" }
      - { name: surge_multiplier_tier_0, type: number, source: input, default: 1.0, description: "Multiplier when active demand below tier 1" }
      - { name: surge_multiplier_tier_1, type: number, source: input, default: 1.25, description: "Multiplier in tier 1 band" }
      - { name: surge_multiplier_tier_2, type: number, source: input, default: 1.6, description: "Multiplier at/above tier 2" }
      - { name: delivery_fee_cap_cents, type: integer, source: input, description: "Hard upper bound applied to the surged delivery fee" }
      - { name: dasher_min_guarantee_cents, type: integer, source: input, description: "Per-delivery dasher earnings floor (guarantee) for this zone" }
      - { name: dasher_per_km_pay_cents, type: integer, source: input, description: "Dasher base pay per whole km of route distance" }
      - { name: dasher_base_pay_cents, type: integer, source: input, description: "Flat dasher base pay per delivery before distance and surge bonus" }
      - { name: active_order_count, type: integer, source: computed, description: "Read-only: count of Orders in this zone with fulfillment_status IN {PLACED, ROUTED, PICKED_UP}; drives surge tier" }

  # --- Restaurant (acts as a role) ---
  - name: Restaurant
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> Zone.id; the delivery zone this restaurant sits in" }
      - { name: name, type: string, source: input, description: "Restaurant display name" }
      - { name: route_distance_km, type: integer, source: input, description: "Whole-km route distance used for fee and pay calculation for all of this restaurant's deliveries", constraints: ">= 1" }
      - { name: is_open, type: boolean, source: input, default: true, description: "Whether the restaurant is currently accepting orders" }
      - { name: prep_minutes, type: integer, source: input, default: 15, description: "Estimated kitchen prep time in minutes; feeds ETA and the prep-slot interval", constraints: ">= 1" }
      - { name: max_concurrent_prep, type: integer, source: input, default: 1, description: "Maximum number of SCHEDULED orders whose prep intervals may overlap at once", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "ACTIVE → DEACTIVATED; constraints: ACTIVE | DEACTIVATED" }

  # --- MenuItem (child of Restaurant) ---
  - name: MenuItem
    parent: Restaurant
    common_fields: true
    fields:
      - { name: restaurant_id, type: string, source: system, description: "FK -> Restaurant.id" }
      - { name: name, type: string, source: input, description: "Menu item name" }
      - { name: price_cents, type: integer, source: input, description: "Unit price in cents", constraints: "> 0" }
      - { name: available, type: boolean, source: input, default: true, description: "Whether the item can currently be ordered" }
      - { name: status, type: enum, source: system, description: "LISTED → DELISTED; constraints: LISTED | DELISTED" }

  # --- Customer (acts as a role) ---
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer display name" }
      - { name: wallet_credit_cents, type: integer, source: computed, description: "Read-only: refundable platform credit balance; starts at 0, credited by refunds with destination WALLET", default: 0 }

  # --- Dasher (courier, acts as a role) ---
  - name: Dasher
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Dasher display name" }
      - { name: home_zone_id, type: string, source: input, description: "FK -> Zone.id; the zone the dasher operates in (only same-zone orders are dispatchable)" }
      - { name: max_batch_size, type: integer, source: input, default: 2, description: "Maximum number of concurrently active deliveries this dasher may hold", constraints: ">= 1" }
      - { name: active_delivery_count, type: integer, source: computed, description: "Read-only: count of this dasher's Deliveries in fulfillment_status IN {OFFERED, ACCEPTED, EN_ROUTE}; gates batching" }
      - { name: lifetime_earnings_cents, type: integer, source: computed, description: "Read-only: sum of settled_pay_cents over this dasher's EarningsRecords in state SETTLED", default: 0 }
      - { name: availability, type: enum, source: input, default: "ONLINE", description: "ONLINE | OFFLINE; only ONLINE dashers are dispatch candidates; constraints: ONLINE | OFFLINE" }

  # --- Order (central entity, parallel state dimensions) ---
  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the placing customer" }
      - { name: restaurant_id, type: string, source: input, description: "FK -> Restaurant.id; the fulfilling restaurant" }
      - { name: zone_id, type: string, source: computed, description: "FK -> Zone.id; copied from the restaurant at placement, pins pricing zone" }
      - { name: scheduled_for, type: datetime, source: input, required: false, description: "Optional ISO 8601 future time the order should be released for routing; null means ASAP" }
      - { name: order_subtotal_cents, type: integer, source: computed, description: "Read-only: sum of per-line rounded extended prices over all OrderLineItems (see order_subtotal calc)" }
      - { name: service_fee_cents, type: integer, source: computed, description: "Read-only: platform service fee, computed PER LINE then summed (see order_service_fee calc)" }
      - { name: delivery_fee_quote_cents, type: integer, source: computed, description: "Read-only: estimated delivery fee captured at placement (forward-looking variant)" }
      - { name: delivery_fee_final_cents, type: integer, source: computed, description: "Read-only: settled delivery fee captured at delivery completion (settled variant); null until DELIVERED" }
      - { name: tip_cents, type: integer, source: input, default: 0, description: "Customer tip in cents at placement; mutable via tip adjustments", constraints: ">= 0" }
      - { name: surge_multiplier_applied, type: number, source: computed, description: "Read-only: surge multiplier locked into delivery_fee_quote_cents at placement" }
      - { name: eta_minutes, type: integer, source: computed, description: "Read-only: estimated minutes to delivery (see eta_minutes calc)" }
      - { name: refunded_cents, type: integer, source: computed, description: "Read-only: cumulative amount refunded across resolved OrderIssues", default: 0 }
      - { name: fulfillment_status, type: enum, source: system, description: "Lifecycle axis: SCHEDULED | PLACED | ROUTED | PICKED_UP | DELIVERED | CANCELLED" }
      - { name: billing_status, type: enum, source: system, description: "Billing axis evolving independently of fulfillment: UNSETTLED | SETTLED | REFUNDED" }

  # --- OrderLineItem (child of Order) ---
  - name: OrderLineItem
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id" }
      - { name: menu_item_id, type: string, source: input, description: "FK -> MenuItem.id; the ordered item" }
      - { name: quantity, type: integer, source: input, description: "Number of units ordered", constraints: ">= 1" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Read-only: snapshot of MenuItem.price_cents at line creation" }
      - { name: extended_price_cents, type: integer, source: computed, description: "Read-only: rounded(unit_price_cents * quantity) per line (see order_subtotal calc)" }
      - { name: service_fee_cents, type: integer, source: computed, description: "Read-only: round_half_up(extended_price_cents * Zone.service_fee_bps / 10000) — per-line service fee" }
      - { name: fulfilled_quantity, type: integer, source: computed, description: "Read-only: quantity actually delivered; equals quantity until a missing-item issue reduces it", default: 0 }
      - { name: status, type: enum, source: system, description: "ORDERED → SHORTED; constraints: ORDERED | SHORTED" }

  # --- Delivery (courier dispatch / assignment; child of Order) ---
  - name: Delivery
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id" }
      - { name: dasher_id, type: string, source: system, description: "FK -> Dasher.id; the dispatched courier (server-selected)" }
      - { name: route_distance_km, type: integer, source: system, description: "Whole-km route distance snapshotted from the restaurant at dispatch" }
      - { name: pay_quote_cents, type: integer, source: computed, description: "Read-only: estimated dasher pay at dispatch (guarantee-applied estimate variant)" }
      - { name: settled_pay_cents, type: integer, source: computed, description: "Read-only: final dasher pay at delivery completion (guarantee-applied settled variant); null until DELIVERED" }
      - { name: offered_at, type: datetime, source: system, description: "Server-stamped time the dispatch offer was created" }
      - { name: fulfillment_status, type: enum, source: system, description: "OFFERED → ACCEPTED → EN_ROUTE → DELIVERED / REASSIGNED / CANCELLED" }

  # --- TipAdjustment (event log under Order) ---
  - name: TipAdjustment
    parent: Order
    common_fields: false
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id" }
      - { name: delta_cents, type: integer, source: input, description: "Signed change applied to Order.tip_cents (may be negative to reduce tip)" }
      - { name: reason, type: string, source: input, required: false, description: "Optional note for the adjustment" }
      - { name: resulting_tip_cents, type: integer, source: computed, description: "Read-only: Order.tip_cents after this adjustment is applied" }

  # --- OrderIssue (missing-item issue & refund; child of Order) ---
  - name: OrderIssue
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id" }
      - { name: line_item_id, type: string, source: input, description: "FK -> OrderLineItem.id; the line reported short" }
      - { name: missing_quantity, type: integer, source: input, description: "Units reported missing on the line", constraints: ">= 1" }
      - { name: refund_destination, type: enum, source: input, default: "ORIGINAL", description: "ORIGINAL | WALLET; where an approved refund is credited; constraints: ORIGINAL | WALLET" }
      - { name: refund_amount_cents, type: integer, source: computed, description: "Read-only: computed refund for the missing units (see missing_item_refund calc); 0 until APPROVED" }
      - { name: status, type: enum, source: system, description: "OPEN → APPROVED / REJECTED; constraints: OPEN | APPROVED | REJECTED" }

  # --- EarningsRecord (dasher pay & guarantee; child of Dasher) ---
  - name: EarningsRecord
    parent: Dasher
    common_fields: true
    fields:
      - { name: dasher_id, type: string, source: system, description: "FK -> Dasher.id" }
      - { name: delivery_id, type: string, source: system, description: "FK -> Delivery.id; the delivery this earning is for" }
      - { name: base_component_cents, type: integer, source: computed, description: "Read-only: distance + base pay component before guarantee top-up" }
      - { name: tip_component_cents, type: integer, source: computed, description: "Read-only: tip passed through to the dasher at settlement" }
      - { name: guarantee_topup_cents, type: integer, source: computed, description: "Read-only: amount added so total reaches the zone guarantee floor (0 if not needed)" }
      - { name: settled_pay_cents, type: integer, source: computed, description: "Read-only: base_component + tip_component + guarantee_topup at settlement" }
      - { name: status, type: enum, source: system, description: "ACCRUED → SETTLED / REVERSED; constraints: ACCRUED | SETTLED | REVERSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  # Order — fulfillment_status axis (parallel with billing_status)
  # ---------------------------------------------------------------------------
  - entity: Order
    initial_state: PLACED            # ASAP orders; scheduled orders start SCHEDULED (see note)
    terminal_states: [DELIVERED, CANCELLED]
    note: |
      Order has TWO independent state axes. fulfillment_status (this machine)
      tracks routing/courier progress. billing_status (next machine) tracks
      money settlement and evolves on different triggers, so the two axes can
      sit in independent combinations (e.g. DELIVERED×UNSETTLED is impossible by
      design but PICKED_UP×UNSETTLED and DELIVERED×REFUNDED both occur).
      An order created with scheduled_for in the future starts in SCHEDULED;
      an order with scheduled_for null (or in the past) starts in PLACED.
    transitions:
      - from: SCHEDULED
        to: PLACED
        trigger: "POST /_clock/advance or POST /orders/{id}/release (system releases scheduled order when current clock >= scheduled_for)"
        actor: system
        preconditions:
          - "Order.fulfillment_status == SCHEDULED (ERR_INVALID_ORDER_STATE)"
          - "current_utc >= Order.scheduled_for (ERR_SCHEDULE_NOT_DUE)"
        side_effects:
          - "Zone.active_order_count for Order.zone_id increments by 1 (re-derived)"
          - "delivery_fee_quote_cents recomputed against zone demand AT release time (surge re-evaluated)"
          - "surge_multiplier_applied refreshed; eta_minutes refreshed"

      - from: PLACED
        to: ROUTED
        trigger: "POST /orders/{id}/dispatch"
        actor: Restaurant
        preconditions:
          - "Order.fulfillment_status == PLACED (ERR_INVALID_ORDER_STATE)"
          - "Restaurant.is_open == true for Order.restaurant_id (ERR_RESTAURANT_CLOSED)"
          - "request expected_order_version matches Order.version (ERR_STALE_ORDER_VERSION)"
          - "at least one ONLINE same-home_zone Dasher with active_delivery_count < max_batch_size exists (ERR_NO_DASHER_AVAILABLE)"
        side_effects:
          - "Server selects one Dasher via dispatch_selector calc and creates a Delivery in OFFERED with pay_quote_cents computed via dasher_pay_quote"
          - "Delivery.route_distance_km snapshotted from Restaurant.route_distance_km"
          - "increments Order.version by 1"

      - from: ROUTED
        to: PICKED_UP
        trigger: "POST /deliveries/{id}/picked-up (Dasher confirms pickup)"
        actor: Dasher
        preconditions:
          - "Order.fulfillment_status == ROUTED (ERR_INVALID_ORDER_STATE)"
          - "the order's Delivery is in fulfillment_status ACCEPTED (ERR_INVALID_DELIVERY_STATE)"
        side_effects:
          - "Delivery.fulfillment_status ACCEPTED → EN_ROUTE"

      - from: PICKED_UP
        to: DELIVERED
        trigger: "POST /deliveries/{id}/delivered (Dasher confirms drop-off)"
        actor: Dasher
        preconditions:
          - "Order.fulfillment_status == PICKED_UP (ERR_INVALID_ORDER_STATE)"
          - "the order's Delivery is in fulfillment_status EN_ROUTE (ERR_INVALID_DELIVERY_STATE)"
        side_effects:
          - "delivery_fee_final_cents computed via delivery_fee_final (settled surge at completion)"
          - "Delivery.settled_pay_cents computed via dasher_pay_settled"
          - "Delivery.fulfillment_status EN_ROUTE → DELIVERED"
          - "Order.billing_status UNSETTLED → SETTLED (cross-axis effect)"
          - "EarningsRecord for the delivery transitions ACCRUED → SETTLED; Dasher.lifetime_earnings_cents re-derived"
          - "Zone.active_order_count for Order.zone_id decrements by 1 (re-derived)"

      - from: PLACED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "Order.fulfillment_status IN {SCHEDULED, PLACED, ROUTED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "If a Delivery exists in non-terminal state {OFFERED, ACCEPTED}, it transitions to CANCELLED and its EarningsRecord ACCRUED → REVERSED"
          - "Order.billing_status → REFUNDED; refunded_cents set to order_subtotal_cents + service_fee_cents + delivery_fee_quote_cents + tip_cents; wallet/original credit issued"
          - "Zone.active_order_count for Order.zone_id decremented by 1 if order had left SCHEDULED (re-derived)"

      - from: ROUTED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "Order.fulfillment_status IN {SCHEDULED, PLACED, ROUTED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "Same cascade as PLACED → CANCELLED"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "Order.fulfillment_status IN {SCHEDULED, PLACED, ROUTED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "Order.billing_status → REFUNDED; refunded_cents set to order_subtotal_cents + service_fee_cents + delivery_fee_quote_cents + tip_cents; no Delivery to cancel"

  # ---------------------------------------------------------------------------
  # Order — billing_status axis (parallel dimension)
  # ---------------------------------------------------------------------------
  - entity: Order
    initial_state: UNSETTLED
    terminal_states: [REFUNDED]
    note: "Second independent axis on Order. Evolves on delivery completion, refund, and full cancellation — distinct triggers from the fulfillment axis."
    transitions:
      - from: UNSETTLED
        to: SETTLED
        trigger: "system (Order fulfillment PICKED_UP → DELIVERED)"
        actor: system
        preconditions:
          - "Order.billing_status == UNSETTLED (ERR_INVALID_BILLING_STATE)"
        side_effects:
          - "delivery_fee_final_cents and dasher settlement finalized (see fulfillment DELIVERED side-effects)"

      - from: SETTLED
        to: REFUNDED
        trigger: "system (OrderIssue approved that brings cumulative refund to full order value, or full cancel)"
        actor: system
        preconditions:
          - "Order.billing_status == SETTLED (ERR_INVALID_BILLING_STATE)"
          - "refunded_cents (after this refund) >= order_subtotal_cents (ERR_INVALID_BILLING_STATE)"
        side_effects:
          - "Order fully refunded; no further OrderIssues accepted"

      - from: UNSETTLED
        to: REFUNDED
        trigger: "system (Order fulfillment → CANCELLED before settlement)"
        actor: system
        preconditions:
          - "Order.billing_status == UNSETTLED (ERR_INVALID_BILLING_STATE)"
        side_effects:
          - "Full pre-settlement refund issued (see fulfillment CANCELLED side-effects)"

  # ---------------------------------------------------------------------------
  # Delivery — courier dispatch lifecycle (branching: REASSIGNED loop)
  # ---------------------------------------------------------------------------
  - entity: Delivery
    initial_state: OFFERED
    terminal_states: [DELIVERED, CANCELLED]
    note: "Branching with a reassignment loop: a declined offer is REASSIGNED, then the parent Order re-dispatches creating a fresh OFFERED Delivery."
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /deliveries/{id}/accept"
        actor: Dasher
        preconditions:
          - "Delivery.fulfillment_status == OFFERED (ERR_INVALID_DELIVERY_STATE)"
          - "acting Dasher.id == Delivery.dasher_id (ERR_NOT_RESOURCE_OWNER)"
          - "Dasher.active_delivery_count <= max_batch_size (counting this delivery) (ERR_BATCH_LIMIT_EXCEEDED)"
        side_effects:
          - "EarningsRecord stays ACCRUED; no money moves yet"

      - from: OFFERED
        to: REASSIGNED
        trigger: "POST /deliveries/{id}/decline"
        actor: Dasher
        preconditions:
          - "Delivery.fulfillment_status == OFFERED (ERR_INVALID_DELIVERY_STATE)"
          - "acting Dasher.id == Delivery.dasher_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "EarningsRecord ACCRUED → REVERSED"
          - "Order.fulfillment_status reverts ROUTED → PLACED so it can be re-dispatched (cycle)"

      - from: ACCEPTED
        to: EN_ROUTE
        trigger: "system (Order ROUTED → PICKED_UP)"
        actor: system
        preconditions:
          - "Delivery.fulfillment_status == ACCEPTED (ERR_INVALID_DELIVERY_STATE)"
        side_effects: []

      - from: EN_ROUTE
        to: DELIVERED
        trigger: "system (Order PICKED_UP → DELIVERED)"
        actor: system
        preconditions:
          - "Delivery.fulfillment_status == EN_ROUTE (ERR_INVALID_DELIVERY_STATE)"
        side_effects:
          - "settled_pay_cents computed via dasher_pay_settled; EarningsRecord ACCRUED → SETTLED"

      - from: OFFERED
        to: CANCELLED
        trigger: "system (parent Order cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "EarningsRecord ACCRUED → REVERSED"

      - from: ACCEPTED
        to: CANCELLED
        trigger: "system (parent Order cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "EarningsRecord ACCRUED → REVERSED"

  # ---------------------------------------------------------------------------
  # OrderIssue — missing item refund (branching approve/reject)
  # ---------------------------------------------------------------------------
  - entity: OrderIssue
    initial_state: OPEN
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: OPEN
        to: APPROVED
        trigger: "POST /order-issues/{id}/approve"
        actor: Support
        preconditions:
          - "OrderIssue.status == OPEN (ERR_ISSUE_NOT_OPEN)"
          - "parent Order.fulfillment_status == DELIVERED (ERR_ORDER_NOT_DELIVERED)"
          - "missing_quantity <= the line's current fulfilled_quantity (ERR_MISSING_QTY_EXCEEDS_FULFILLED)"
        side_effects:
          - "refund_amount_cents computed via missing_item_refund"
          - "OrderLineItem.fulfilled_quantity decremented by missing_quantity; line status → SHORTED if fulfilled_quantity reaches 0"
          - "Order.refunded_cents increased by refund_amount_cents"
          - "If destination WALLET, Customer.wallet_credit_cents increased by refund_amount_cents"
          - "If cumulative refunded_cents >= order_subtotal_cents, Order.billing_status SETTLED → REFUNDED"

      - from: OPEN
        to: REJECTED
        trigger: "POST /order-issues/{id}/reject"
        actor: Support
        preconditions:
          - "OrderIssue.status == OPEN (ERR_ISSUE_NOT_OPEN)"
        side_effects:
          - "refund_amount_cents stays 0; no ledger movement"

  # ---------------------------------------------------------------------------
  # EarningsRecord — dasher pay lifecycle (created on dispatch)
  # ---------------------------------------------------------------------------
  - entity: EarningsRecord
    initial_state: ACCRUED
    terminal_states: [SETTLED, REVERSED]
    transitions:
      - from: ACCRUED
        to: SETTLED
        trigger: "system (Delivery EN_ROUTE → DELIVERED)"
        actor: system
        preconditions:
          - "EarningsRecord.status == ACCRUED (ERR_EARNINGS_NOT_ACCRUED)"
        side_effects:
          - "settled_pay_cents finalized via dasher_pay_settled; Dasher.lifetime_earnings_cents re-derived (sum over SETTLED)"

      - from: ACCRUED
        to: REVERSED
        trigger: "system (Delivery declined or cancelled)"
        actor: system
        preconditions:
          - "EarningsRecord.status == ACCRUED (ERR_EARNINGS_NOT_ACCRUED)"
        side_effects:
          - "Accrued estimate voided; never counted in lifetime_earnings_cents"

  # ---------------------------------------------------------------------------
  # Restaurant / MenuItem — simple deactivation lifecycles
  # ---------------------------------------------------------------------------
  - entity: Restaurant
    initial_state: ACTIVE
    terminal_states: [DEACTIVATED]
    transitions:
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST /restaurants/{id}/deactivate"
        actor: Restaurant
        preconditions:
          - "Restaurant.status == ACTIVE (ERR_INVALID_RESTAURANT_STATE)"
          - "no Order for this restaurant in fulfillment_status IN {PLACED, ROUTED, PICKED_UP} (ERR_RESTAURANT_HAS_ACTIVE_ORDERS)"
        side_effects:
          - "All this restaurant's MenuItems LISTED → DELISTED"

  - entity: MenuItem
    initial_state: LISTED
    terminal_states: [DELISTED]
    transitions:
      - from: LISTED
        to: DELISTED
        trigger: "POST /menu-items/{id}/delist or system (cascade from restaurant deactivation)"
        actor: Restaurant
        preconditions:
          - "MenuItem.status == LISTED (ERR_INVALID_MENU_ITEM_STATE)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: dispatch-create-stale-order
    parent_entity: Order
    write_endpoint: "POST /orders/{id}/dispatch"
    occ_field: "expected_order_version"
    description: |
      Dispatching an Order whose version has advanced since the client last
      observed it is rejected. A prior dispatch legitimately created a Delivery
      and advanced Order.version (PLACED → ROUTED); a second dispatch still
      carrying the previously-observed version operates on a stale view of the
      order and is rejected on the version mismatch.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- (1a) order_subtotal ---
  - name: order_subtotal
    trigger: "OrderLineItem creation / order placement"
    algorithm: aggregation
    formula: |
      for each OrderLineItem li with status == ORDERED:
        li.extended_price_cents = li.unit_price_cents * li.quantity
      order_subtotal_cents = SUM(li.extended_price_cents for li ORDERED)
    input_set: "OrderLineItems with status == ORDERED only; SHORTED lines retain extended_price_cents but fulfilled_quantity drives refunds"
    precision: "integer cents (unit_price_cents and quantity are both integers, so each line is integral)"
    note: "Subtotal is exact integer arithmetic; the rounding-order subtlety lives in order_service_fee."

  # --- (1a') order_service_fee: rounding-order PINNED (Rule 2 mode b) ---
  - name: order_service_fee
    trigger: "OrderLineItem creation / order placement / line-item add"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round the service fee PER LINE, THEN sum.
      # round-per-line-then-sum vs sum-then-round produce DIFFERENT cents.
      for each OrderLineItem li with status == ORDERED:
        li.service_fee_cents = round_half_up(li.extended_price_cents * Zone.service_fee_bps / 10000)
      service_fee_cents = SUM(li.service_fee_cents for li ORDERED)
      # FORBIDDEN alternative (NOT used): round_half_up(order_subtotal_cents * bps / 10000)
    input_set: "OrderLineItems with status == ORDERED; Zone.service_fee_bps from Order.zone_id"
    constants:
      BPS_DENOMINATOR: 10000
    precision: "integer cents, round_half_up applied PER LINE before summing"
    note: |
      Pinned order: round-per-line THEN sum. Example: lines [999,500,149] at
      850 bps → per-line [85,43,13]=141, but sum-then-round = round(1648*0.085)=140.
      The scaffold pins 141.

  # --- (1b) delivery_fee_quote: forward-looking estimate (Rule 1 + Rule 2 mode a) ---
  - name: delivery_fee_quote
    trigger: "order placement (PLACED) and scheduled-order release (SCHEDULED → PLACED)"
    algorithm: forward_looking
    formula: |
      # Surge tier selected from PROJECTED demand = Zone.active_order_count
      # INCLUDING this order (forward-looking: this order is counted).
      demand = Zone.active_order_count   # already includes this order at placement
      if demand >= Zone.surge_tier_2_demand:      m = Zone.surge_multiplier_tier_2
      elif demand >= Zone.surge_tier_1_demand:    m = Zone.surge_multiplier_tier_1
      else:                                        m = Zone.surge_multiplier_tier_0
      raw_distance_fee = Zone.base_delivery_fee_cents + Zone.per_km_fee_cents * Restaurant.route_distance_km
      surged = round_half_up(raw_distance_fee * m)
      capped = min(surged, Zone.delivery_fee_cap_cents)
      small_order = Zone.small_order_fee_cents if order_subtotal_cents < Zone.small_order_threshold_cents else 0
      delivery_fee_quote_cents = capped + small_order
      surge_multiplier_applied = m
    input_set: "Zone demand counts Orders IN {PLACED, ROUTED, PICKED_UP} for the zone, INCLUDING the order being placed"
    constants: {}
    precision: "integer cents, round_half_up after applying surge, BEFORE adding small-order fee"
    variants:
      - name: quote
        when: "at placement / release — forward-looking; the order itself is included in demand"
        difference: "uses Zone.active_order_count as projected demand including this order; result stored in delivery_fee_quote_cents and frozen"
      - name: final
        when: "at delivery completion — see delivery_fee_final"
        difference: "re-evaluates surge from demand at completion time and EXCLUDES this order (already leaving the active pool)"

  # --- (1c) delivery_fee_final: settled variant (Rule 1 dual-variant on Order) ---
  - name: delivery_fee_final
    trigger: "Order PICKED_UP → DELIVERED"
    algorithm: aggregation
    formula: |
      # Settled (chronological/actual) variant. Demand EXCLUDES this order
      # because it is leaving the active pool at completion.
      demand = Zone.active_order_count - 1     # this order excluded
      if demand >= Zone.surge_tier_2_demand:      m = Zone.surge_multiplier_tier_2
      elif demand >= Zone.surge_tier_1_demand:    m = Zone.surge_multiplier_tier_1
      else:                                        m = Zone.surge_multiplier_tier_0
      raw_distance_fee = Zone.base_delivery_fee_cents + Zone.per_km_fee_cents * Delivery.route_distance_km
      surged = round_half_up(raw_distance_fee * m)
      capped = min(surged, Zone.delivery_fee_cap_cents)
      small_order = Zone.small_order_fee_cents if order_subtotal_cents < Zone.small_order_threshold_cents else 0
      delivery_fee_final_cents = capped + small_order
    input_set: "Zone demand at completion EXCLUDING this order; route_distance snapshotted on the Delivery"
    precision: "integer cents, round_half_up after surge, before small-order fee"
    note: "Same shape as quote but demand basis differs (exclude self) → quote and final diverge for identical inputs when demand straddles a surge tier boundary"

  # --- (2) dasher_pay_quote vs dasher_pay_settled (Rule 1 dual-variant on Dasher domain; Rule 2 mode c circular eval order) ---
  - name: dasher_pay_quote
    trigger: "Delivery creation at dispatch (OFFERED)"
    algorithm: forward_looking
    formula: |
      # EVALUATION ORDER PINNED (mode c): base first, THEN guarantee top-up
      # is keyed off base+tip; the guarantee is NOT applied before tip is known.
      base_component = Zone.dasher_base_pay_cents + Zone.dasher_per_km_pay_cents * Delivery.route_distance_km
      tip_component  = Order.tip_cents                      # tip as known AT DISPATCH (quote)
      pre_guarantee  = base_component + tip_component
      guarantee_topup = max(0, Zone.dasher_min_guarantee_cents - pre_guarantee)
      pay_quote_cents = pre_guarantee + guarantee_topup     # == max(pre_guarantee, guarantee_floor)
    input_set: "Order.tip_cents as of dispatch; zone pay constants; delivery route distance"
    precision: "integer cents"
    variants:
      - name: quote
        when: "at dispatch — tip is the placement tip (pre-adjustment)"
        difference: "tip_component uses Order.tip_cents at dispatch; stored in Delivery.pay_quote_cents and EarningsRecord accrual"
      - name: settled
        when: "at delivery completion — tip reflects all TipAdjustments applied before completion (see dasher_pay_settled)"
        difference: "tip_component uses the current Order.tip_cents at completion; guarantee re-evaluated against the new pre_guarantee"

  - name: dasher_pay_settled
    trigger: "Delivery EN_ROUTE → DELIVERED"
    algorithm: aggregation
    formula: |
      # Same PINNED evaluation order as quote: base, then tip, then guarantee.
      base_component = Zone.dasher_base_pay_cents + Zone.dasher_per_km_pay_cents * Delivery.route_distance_km
      tip_component  = Order.tip_cents                      # CURRENT tip at completion (post-adjustment)
      pre_guarantee  = base_component + tip_component
      guarantee_topup = max(0, Zone.dasher_min_guarantee_cents - pre_guarantee)
      settled_pay_cents = pre_guarantee + guarantee_topup
      # EarningsRecord splits: base_component_cents, tip_component_cents, guarantee_topup_cents
    input_set: "Order.tip_cents at completion (reflects tip adjustments); zone pay constants; delivery route distance"
    precision: "integer cents"
    note: |
      Circular-looking dependency resolved by pinned order: guarantee_topup
      depends on tip_component, and a raised tip can ELIMINATE the guarantee
      top-up (settled < quote + tip_delta when the quote was on the guarantee
      floor). The pin makes the value well-defined.

  # --- (3) missing_item_refund (boundary + reuses pinned per-line price) ---
  - name: missing_item_refund
    trigger: "OrderIssue OPEN → APPROVED"
    algorithm: aggregation
    formula: |
      line = OrderLineItem[OrderIssue.line_item_id]
      # Per-unit price uses the PINNED per-line snapshot, not a re-derived value.
      per_unit = line.unit_price_cents
      refund_amount_cents = per_unit * OrderIssue.missing_quantity
      # Refund is capped so cumulative refunded_cents never exceeds order_subtotal_cents.
      headroom = order_subtotal_cents - Order.refunded_cents
      refund_amount_cents = min(refund_amount_cents, headroom)
    input_set: "single OrderLineItem referenced by the issue; cumulative Order.refunded_cents"
    precision: "integer cents"
    note: "Refund excludes delivery_fee and tip; only line value for missing units, capped at remaining subtotal headroom"

  # --- (4) eta_minutes ---
  - name: eta_minutes
    trigger: "order placement and scheduled-order release"
    algorithm: aggregation
    formula: |
      eta_minutes = Restaurant.prep_minutes + Restaurant.route_distance_km * ETA_MINUTES_PER_KM
    constants:
      ETA_MINUTES_PER_KM: 3
    input_set: "restaurant prep time and route distance at placement/release"
    precision: "integer minutes"

  # --- (5) dispatch_selector (selector policy; deterministic, created_at tie-break) ---
  - name: dispatch_selector
    trigger: "Order PLACED → ROUTED (dispatch)"
    algorithm: weighted_scoring
    formula: |
      # Candidate set (eligibility filter):
      #   Dasher.availability == ONLINE
      #   AND Dasher.home_zone_id == Order.zone_id
      #   AND Dasher.active_delivery_count < Dasher.max_batch_size
      # Ranking (sort key), all over entity fields:
      #   1. ascending active_delivery_count   (least loaded first)
      #   2. descending max_batch_size         (more capacity first)
      #   3. ascending created_at              (earliest-registered first — tie-break)
      # Fallback: candidate set empty -> reject ERR_NO_DASHER_AVAILABLE
      selected = first(sort(candidates, key=(active_delivery_count ASC, max_batch_size DESC, created_at ASC)))
    input_set: "Dashers with availability==ONLINE, home_zone_id==Order.zone_id, active_delivery_count < max_batch_size"
    precision: "n/a"
    note: "id is NEVER used as a tie-break; created_at ASC is the final deterministic tie-break"

  # --- (6) prep_slot_overlap_check (interval overlap on Restaurant; HALF-OPEN adjacency) ---
  - name: prep_slot_overlap_check
    trigger: "scheduled-order placement (POST /orders with scheduled_for in the future)"
    algorithm: interval_merge
    formula: |
      # The new scheduled order occupies the HALF-OPEN prep interval
      #   new = [scheduled_for, scheduled_for + prep_minutes)   (minutes)
      # over the same Restaurant. Two intervals [a,b) and [c,d) OVERLAP iff
      #   a < d AND c < b   (touching endpoints, b == c, do NOT overlap — half-open).
      # Count existing SCHEDULED orders for the SAME restaurant whose interval
      # overlaps `new`. If (overlap_count + 1) > Restaurant.max_concurrent_prep,
      # reject ERR_PREP_SLOT_CONFLICT.
      others = [o for o in Orders
                if o.restaurant_id == new.restaurant_id
                and o.fulfillment_status == SCHEDULED]
      overlap = count(o in others where
                      new.start < (o.scheduled_for + restaurant.prep_minutes)
                      and o.scheduled_for < new.end)
      if overlap + 1 > Restaurant.max_concurrent_prep: reject ERR_PREP_SLOT_CONFLICT
    input_set: "Orders for the same restaurant with fulfillment_status == SCHEDULED only"
    constants: {}
    precision: "half-open interval [start, end); endpoint-touching = no overlap"
    note: "Distinct interval semantics from dasher batching: this is TIME-INTERVAL overlap with half-open adjacency; batching is AGGREGATE-COUNT capacity."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 401
    applies_to: all endpoints except /_clock and /_admin test endpoints

  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all role-restricted endpoints

  - priority: 3
    category: existence
    check: "Resource ids in path / FK body fields exist (validated left-to-right in path, then body FKs)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints referencing a resource id

  - priority: 4
    category: business_referential
    check: "Acting entity_backed user owns the resource it mutates (Dasher==Delivery.dasher_id, Customer==Order.customer_id, Restaurant==Order.restaurant_id / MenuItem.restaurant_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "owner-scoped mutations (accept/decline/picked-up/delivered, order cancel, dispatch, menu-item mutations)"

  - priority: 5
    category: state
    check: "Target Order is in the correct fulfillment_status / billing_status for the operation"
    error_id: "varies (ERR_INVALID_ORDER_STATE, ERR_INVALID_BILLING_STATE, ERR_ORDER_NOT_CANCELLABLE, ERR_ORDER_NOT_DELIVERED)"
    http_status: 409
    applies_to: order/delivery/issue transition endpoints

  - priority: 6
    category: state
    check: "Target Delivery / OrderIssue / EarningsRecord is in the correct state for the operation"
    error_id: "varies (ERR_INVALID_DELIVERY_STATE, ERR_ISSUE_NOT_OPEN, ERR_EARNINGS_NOT_ACCRUED)"
    http_status: 409
    applies_to: delivery and issue transition endpoints

  - priority: 7
    category: business_temporal
    check: "Scheduled order release requires current_utc >= Order.scheduled_for"
    error_id: ERR_SCHEDULE_NOT_DUE
    http_status: 409
    applies_to: "POST /orders/{id}/release"

  - priority: 8
    category: business_constraint
    check: "Restaurant must be open and all ordered MenuItems available & LISTED & belong to the restaurant at placement"
    error_id: ERR_ITEM_UNAVAILABLE
    http_status: 409
    applies_to: "POST /orders, POST /orders/{id}/line-items"

  - priority: 9
    category: business_temporal
    check: "Prep-slot interval overlap: a SCHEDULED order's half-open prep interval may overlap with at most (max_concurrent_prep - 1) existing SCHEDULED orders on the same restaurant"
    error_id: ERR_PREP_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /orders (scheduled_for in the future)"

  - priority: 10
    category: business_constraint
    check: "Restaurant must be open at dispatch time"
    error_id: ERR_RESTAURANT_CLOSED
    http_status: 409
    applies_to: "POST /orders/{id}/dispatch"

  - priority: 11
    category: business_constraint
    check: "Dasher batch limit (aggregate capacity): accepting a delivery must not push active_delivery_count above max_batch_size"
    error_id: ERR_BATCH_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /deliveries/{id}/accept"

  - priority: 12
    category: business_constraint
    check: "At least one eligible ONLINE same-zone Dasher with spare capacity exists at dispatch"
    error_id: ERR_NO_DASHER_AVAILABLE
    http_status: 409
    applies_to: "POST /orders/{id}/dispatch"

  - priority: 13
    category: business_constraint
    check: "missing_quantity on an OrderIssue must not exceed the line's current fulfilled_quantity"
    error_id: ERR_MISSING_QTY_EXCEEDS_FULFILLED
    http_status: 422
    applies_to: "POST /order-issues/{id}/approve"

  - priority: 14
    category: business_fiscal
    check: "A tip adjustment must not reduce Order.tip_cents below 0"
    error_id: ERR_TIP_NEGATIVE
    http_status: 422
    applies_to: "POST /orders/{id}/tip-adjustments"

  - priority: 15
    category: business_temporal
    check: "Tip adjustments allowed only while Order.billing_status == UNSETTLED (before delivery completion)"
    error_id: ERR_TIP_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /orders/{id}/tip-adjustments"

  - priority: 16
    category: state
    check: "OCC: expected_order_version must equal Order.version on dispatch"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /orders/{id}/dispatch"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Zone (configuration) ----
  - method: POST
    path: "/zones"
    description: "Create a delivery zone with pricing & guarantee config"
    roles: [PlatformAdmin]
    code: 201
    input: [name, base_delivery_fee_cents, per_km_fee_cents, small_order_threshold_cents, small_order_fee_cents, delivery_fee_cap_cents, dasher_min_guarantee_cents, dasher_per_km_pay_cents, dasher_base_pay_cents, "service_fee_bps?", "surge_tier_1_demand?", "surge_tier_2_demand?", "surge_multiplier_tier_0?", "surge_multiplier_tier_1?", "surge_multiplier_tier_2?"]
    output: Zone
    side_effects: ["active_order_count initialized to 0"]

  - method: GET
    path: "/zones"
    description: "List zones"
    roles: [PlatformAdmin, Restaurant, Dasher, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Zone[]"
    side_effects: []

  - method: GET
    path: "/zones/{id}"
    description: "Get a zone (includes live active_order_count)"
    roles: [PlatformAdmin, Restaurant, Dasher, Customer]
    code: 200
    input: []
    output: Zone
    side_effects: []

  # ---- Restaurant ----
  - method: POST
    path: "/restaurants"
    description: "Register a restaurant"
    roles: [PlatformAdmin, Restaurant]
    code: 201
    input: [zone_id, name, route_distance_km, "is_open?", "prep_minutes?", "max_concurrent_prep?"]
    output: Restaurant
    side_effects: ["status initialized ACTIVE"]

  - method: GET
    path: "/restaurants"
    description: "List restaurants (optionally filter by zone)"
    roles: [PlatformAdmin, Restaurant, Dasher, Customer]
    code: 200
    input: ["zone_id?", "limit?", "offset?"]
    output: "Restaurant[]"
    side_effects: []

  - method: GET
    path: "/restaurants/{id}"
    description: "Get a restaurant"
    roles: [PlatformAdmin, Restaurant, Dasher, Customer]
    code: 200
    input: []
    output: Restaurant
    side_effects: []

  - method: PATCH
    path: "/restaurants/{id}"
    description: "Update restaurant open flag / prep time"
    roles: [Restaurant]
    code: 200
    input: ["is_open?", "prep_minutes?"]
    output: Restaurant
    side_effects: []

  - method: POST
    path: "/restaurants/{id}/deactivate"
    description: "Deactivate restaurant (cascade-delist menu)"
    roles: [Restaurant]
    code: 200
    input: []
    output: Restaurant
    side_effects: ["status → DEACTIVATED", "all MenuItems LISTED → DELISTED"]

  - method: POST
    path: "/restaurants/{id}/menu-items"
    description: "Add a menu item to a restaurant"
    roles: [Restaurant]
    code: 201
    input: [name, price_cents, "available?"]
    output: MenuItem
    side_effects: ["status initialized LISTED"]

  - method: GET
    path: "/restaurants/{id}/menu-items"
    description: "List menu items for a restaurant (FK reverse-reachability for MenuItem.restaurant_id)"
    roles: [PlatformAdmin, Restaurant, Dasher, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "MenuItem[]"
    side_effects: []

  # ---- MenuItem ----
  - method: GET
    path: "/menu-items/{id}"
    description: "Get a menu item"
    roles: [PlatformAdmin, Restaurant, Dasher, Customer]
    code: 200
    input: []
    output: MenuItem
    side_effects: []

  - method: GET
    path: "/menu-items/{id}/line-items"
    description: "List order line-items referencing this menu item (FK reverse-reachability for OrderLineItem.menu_item_id)"
    roles: [PlatformAdmin, Restaurant]
    code: 200
    input: ["limit?", "offset?"]
    output: "OrderLineItem[]"
    side_effects: []

  - method: PATCH
    path: "/menu-items/{id}"
    description: "Update menu item availability / price"
    roles: [Restaurant]
    code: 200
    input: ["available?", "price_cents?"]
    output: MenuItem
    side_effects: []

  - method: POST
    path: "/menu-items/{id}/delist"
    description: "Delist a menu item"
    roles: [Restaurant]
    code: 200
    input: []
    output: MenuItem
    side_effects: ["status → DELISTED"]

  # ---- Customer ----
  - method: POST
    path: "/customers"
    description: "Register a customer"
    roles: [PlatformAdmin, Customer]
    code: 201
    input: [name]
    output: Customer
    side_effects: ["wallet_credit_cents initialized 0"]

  - method: GET
    path: "/customers/{id}"
    description: "Get a customer (includes wallet balance)"
    roles: [PlatformAdmin, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # ---- Dasher ----
  - method: POST
    path: "/dashers"
    description: "Register a dasher"
    roles: [PlatformAdmin, Dasher]
    code: 201
    input: [name, home_zone_id, "max_batch_size?", "availability?"]
    output: Dasher
    side_effects: ["active_delivery_count 0, lifetime_earnings_cents 0"]

  - method: GET
    path: "/dashers"
    description: "List dashers (optionally filter by home zone)"
    roles: [PlatformAdmin, Dasher]
    code: 200
    input: ["home_zone_id?", "limit?", "offset?"]
    output: "Dasher[]"
    side_effects: []

  - method: GET
    path: "/dashers/{id}"
    description: "Get a dasher (includes live counts and lifetime earnings)"
    roles: [PlatformAdmin, Dasher]
    code: 200
    input: []
    output: Dasher
    side_effects: []

  - method: PATCH
    path: "/dashers/{id}"
    description: "Update dasher availability / batch size"
    roles: [Dasher]
    code: 200
    input: ["availability?", "max_batch_size?"]
    output: Dasher
    side_effects: []

  - method: GET
    path: "/dashers/{id}/earnings"
    description: "List a dasher's earnings records (FK reverse-reachability for EarningsRecord.dasher_id)"
    roles: [PlatformAdmin, Dasher]
    code: 200
    input: ["limit?", "offset?"]
    output: "EarningsRecord[]"
    side_effects: []

  # ---- Order ----
  - method: POST
    path: "/orders"
    description: "Place an order (ASAP or scheduled); creates line items in one shot"
    roles: [Customer]
    code: 201
    input: [customer_id, restaurant_id, line_items, "tip_cents?", "scheduled_for?"]
    output: Order
    side_effects:
      - "Each entry in line_items creates an OrderLineItem; unit_price_cents snapshotted from MenuItem; extended_price_cents via order_subtotal; service_fee_cents via order_service_fee"
      - "order_subtotal_cents, service_fee_cents, delivery_fee_quote_cents, surge_multiplier_applied, eta_minutes computed"
      - "zone_id copied from restaurant; fulfillment_status PLACED (or SCHEDULED if scheduled_for in future); billing_status UNSETTLED"
      - "If scheduled_for in future, prep_slot_overlap_check runs against same-restaurant SCHEDULED orders (ERR_PREP_SLOT_CONFLICT)"
      - "If PLACED, Zone.active_order_count re-derived (increment)"

  - method: GET
    path: "/orders"
    description: "List orders (filter by customer/restaurant/zone)"
    roles: [PlatformAdmin, Customer, Restaurant, Dasher]
    code: 200
    input: ["customer_id?", "restaurant_id?", "zone_id?", "limit?", "offset?"]
    output: "Order[]"
    side_effects: []

  - method: GET
    path: "/orders/{id}"
    description: "Get an order (both status axes + computed fees)"
    roles: [PlatformAdmin, Customer, Restaurant, Dasher]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: POST
    path: "/orders/{id}/line-items"
    description: "Add a line item to a SCHEDULED or PLACED order before dispatch"
    roles: [Customer]
    code: 201
    input: [menu_item_id, quantity]
    output: OrderLineItem
    side_effects:
      - "unit_price_cents snapshotted; extended_price_cents, service_fee_cents, order_subtotal_cents recomputed; delivery_fee_quote_cents re-evaluated (small-order fee may drop)"
      - "increments Order.version by 1"

  - method: GET
    path: "/orders/{id}/line-items"
    description: "List line items for an order (FK reverse-reachability for OrderLineItem.order_id)"
    roles: [PlatformAdmin, Customer, Restaurant, Dasher]
    code: 200
    input: ["limit?", "offset?"]
    output: "OrderLineItem[]"
    side_effects: []

  - method: GET
    path: "/orders/{id}/deliveries"
    description: "List deliveries for an order (FK reverse-reachability for Delivery.order_id)"
    roles: [PlatformAdmin, Customer, Restaurant, Dasher]
    code: 200
    input: ["limit?", "offset?"]
    output: "Delivery[]"
    side_effects: []

  - method: GET
    path: "/orders/{id}/tip-adjustments"
    description: "List tip adjustments for an order (FK reverse-reachability for TipAdjustment.order_id)"
    roles: [PlatformAdmin, Customer, Restaurant]
    code: 200
    input: ["limit?", "offset?"]
    output: "TipAdjustment[]"
    side_effects: []

  - method: GET
    path: "/orders/{id}/issues"
    description: "List order issues for an order (FK reverse-reachability for OrderIssue.order_id)"
    roles: [PlatformAdmin, Customer, Restaurant, Support]
    code: 200
    input: ["limit?", "offset?"]
    output: "OrderIssue[]"
    side_effects: []

  - method: POST
    path: "/orders/{id}/release"
    description: "Release a SCHEDULED order to PLACED (requires due time)"
    roles: [PlatformAdmin, Customer]
    code: 200
    input: []
    output: Order
    side_effects: ["fulfillment_status SCHEDULED → PLACED", "delivery_fee_quote_cents / surge / eta re-evaluated at release", "Zone.active_order_count re-derived (increment)"]

  - method: POST
    path: "/orders/{id}/dispatch"
    description: "Dispatch the order — select a dasher and create an OFFERED Delivery (OCC on Order.version)"
    roles: [Restaurant]
    code: 201
    input: [expected_order_version]
    output: Delivery
    side_effects:
      - "dispatch_selector picks a Dasher; Delivery created OFFERED with pay_quote_cents (dasher_pay_quote)"
      - "EarningsRecord created ACCRUED for the delivery"
      - "Order.fulfillment_status PLACED → ROUTED"
      - "increments Order.version by 1"

  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel an order before delivery; cascades delivery cancel + refund"
    roles: [Customer]
    code: 200
    input: []
    output: Order
    side_effects:
      - "fulfillment_status → CANCELLED; billing_status → REFUNDED"
      - "non-terminal Delivery → CANCELLED, EarningsRecord ACCRUED → REVERSED"
      - "refunded_cents = order_subtotal_cents + service_fee_cents + delivery_fee_quote_cents + tip_cents; wallet/original credit issued"
      - "Zone.active_order_count re-derived"

  - method: POST
    path: "/orders/{id}/tip-adjustments"
    description: "Adjust the tip on an order (UNSETTLED only)"
    roles: [Customer]
    code: 201
    input: [delta_cents, "reason?"]
    output: TipAdjustment
    side_effects: ["Order.tip_cents += delta_cents (must stay >= 0)", "resulting_tip_cents recorded"]

  - method: POST
    path: "/orders/{id}/issues"
    description: "File a missing-item issue against a delivered order"
    roles: [Customer]
    code: 201
    input: [line_item_id, missing_quantity, "refund_destination?"]
    output: OrderIssue
    side_effects: ["OrderIssue created OPEN; no money moves until approval"]

  # ---- Delivery ----
  - method: GET
    path: "/deliveries"
    description: "List deliveries (filter by dasher or order; FK reverse-reachability for Delivery.dasher_id and Delivery.order_id)"
    roles: [PlatformAdmin, Dasher, Restaurant]
    code: 200
    input: ["dasher_id?", "order_id?", "limit?", "offset?"]
    output: "Delivery[]"
    side_effects: []

  - method: GET
    path: "/deliveries/{id}"
    description: "Get a delivery (pay quote/settled, status)"
    roles: [PlatformAdmin, Dasher, Restaurant, Customer]
    code: 200
    input: []
    output: Delivery
    side_effects: []

  - method: POST
    path: "/deliveries/{id}/accept"
    description: "Dasher accepts an offered delivery"
    roles: [Dasher]
    code: 200
    input: []
    output: Delivery
    side_effects: ["fulfillment_status OFFERED → ACCEPTED"]

  - method: POST
    path: "/deliveries/{id}/decline"
    description: "Dasher declines an offered delivery (reverts order to PLACED)"
    roles: [Dasher]
    code: 200
    input: []
    output: Delivery
    side_effects: ["fulfillment_status OFFERED → REASSIGNED", "EarningsRecord ACCRUED → REVERSED", "parent Order ROUTED → PLACED"]

  - method: POST
    path: "/deliveries/{id}/picked-up"
    description: "Dasher confirms pickup (order ROUTED → PICKED_UP)"
    roles: [Dasher]
    code: 200
    input: []
    output: Delivery
    side_effects: ["fulfillment_status ACCEPTED → EN_ROUTE", "Order ROUTED → PICKED_UP"]

  - method: POST
    path: "/deliveries/{id}/delivered"
    description: "Dasher confirms drop-off — settles fees, pay, billing"
    roles: [Dasher]
    code: 200
    input: []
    output: Delivery
    side_effects:
      - "fulfillment_status EN_ROUTE → DELIVERED; Order PICKED_UP → DELIVERED"
      - "delivery_fee_final_cents (delivery_fee_final); settled_pay_cents (dasher_pay_settled)"
      - "EarningsRecord ACCRUED → SETTLED; Dasher.lifetime_earnings_cents re-derived"
      - "Order.billing_status UNSETTLED → SETTLED; Zone.active_order_count re-derived (decrement)"

  - method: GET
    path: "/deliveries/{id}/earnings"
    description: "List the earnings record(s) for a delivery (FK reverse-reachability for EarningsRecord.delivery_id)"
    roles: [PlatformAdmin, Dasher]
    code: 200
    input: ["limit?", "offset?"]
    output: "EarningsRecord[]"
    side_effects: []

  # ---- OrderIssue ----
  - method: GET
    path: "/order-issues"
    description: "List order issues (filter by order or line item; FK reverse-reachability for OrderIssue.order_id and OrderIssue.line_item_id)"
    roles: [PlatformAdmin, Customer, Support]
    code: 200
    input: ["order_id?", "line_item_id?", "limit?", "offset?"]
    output: "OrderIssue[]"
    side_effects: []

  - method: GET
    path: "/order-issues/{id}"
    description: "Get an order issue"
    roles: [PlatformAdmin, Customer, Support]
    code: 200
    input: []
    output: OrderIssue
    side_effects: []

  - method: POST
    path: "/order-issues/{id}/approve"
    description: "Support approves a missing-item issue and issues refund"
    roles: [Support]
    code: 200
    input: []
    output: OrderIssue
    side_effects:
      - "refund_amount_cents (missing_item_refund); status OPEN → APPROVED"
      - "OrderLineItem.fulfilled_quantity decremented; line → SHORTED if zero"
      - "Order.refunded_cents increased; wallet credit if destination WALLET"
      - "billing_status SETTLED → REFUNDED if fully refunded"

  - method: POST
    path: "/order-issues/{id}/reject"
    description: "Support rejects a missing-item issue"
    roles: [Support]
    code: 200
    input: []
    output: OrderIssue
    side_effects: ["status OPEN → REJECTED; no money moves"]

  # ---- EarningsRecord ----
  - method: GET
    path: "/earnings-records/{id}"
    description: "Get an earnings record"
    roles: [PlatformAdmin, Dasher]
    code: 200
    input: []
    output: EarningsRecord
    side_effects: []

  # ---- Test-driving / operational ----
  - method: POST
    path: "/_clock/set"
    description: "Test-driving: set the server's current UTC clock to an absolute ISO 8601 time"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server current_utc set; due SCHEDULED orders are NOT auto-released (use /orders/{id}/release)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 401, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "entity_backed user is not the owner of the targeted resource" }

  # --- not found ---
  - { id: ERR_ZONE_NOT_FOUND, http: 404, condition: "Zone id does not exist" }
  - { id: ERR_RESTAURANT_NOT_FOUND, http: 404, condition: "Restaurant id does not exist" }
  - { id: ERR_MENU_ITEM_NOT_FOUND, http: 404, condition: "MenuItem id does not exist" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id does not exist" }
  - { id: ERR_DASHER_NOT_FOUND, http: 404, condition: "Dasher id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Order id does not exist" }
  - { id: ERR_LINE_ITEM_NOT_FOUND, http: 404, condition: "OrderLineItem id does not exist for the order" }
  - { id: ERR_DELIVERY_NOT_FOUND, http: 404, condition: "Delivery id does not exist" }
  - { id: ERR_ISSUE_NOT_FOUND, http: 404, condition: "OrderIssue id does not exist" }
  - { id: ERR_EARNINGS_NOT_FOUND, http: 404, condition: "EarningsRecord id does not exist" }

  # --- validation / payload ---
  - { id: ERR_INVALID_PAYLOAD, http: 400, condition: "Missing required field or type mismatch" }
  - { id: ERR_INVALID_ENUM, http: 422, condition: "Enum field carries an undeclared value" }
  - { id: ERR_EMPTY_ORDER, http: 422, condition: "Order placed with an empty line_items list" }

  # --- state ---
  - { id: ERR_INVALID_ORDER_STATE, http: 409, condition: "Order fulfillment_status not valid for this transition" }
  - { id: ERR_INVALID_BILLING_STATE, http: 409, condition: "Order billing_status not valid for this transition" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "Order not in {SCHEDULED, PLACED, ROUTED}" }
  - { id: ERR_ORDER_NOT_DELIVERED, http: 409, condition: "Operation requires the order to be DELIVERED" }
  - { id: ERR_INVALID_DELIVERY_STATE, http: 409, condition: "Delivery not in the required state for this transition" }
  - { id: ERR_ISSUE_NOT_OPEN, http: 409, condition: "OrderIssue not in OPEN state" }
  - { id: ERR_EARNINGS_NOT_ACCRUED, http: 409, condition: "EarningsRecord not in ACCRUED state" }
  - { id: ERR_INVALID_RESTAURANT_STATE, http: 409, condition: "Restaurant not ACTIVE for this transition" }
  - { id: ERR_INVALID_MENU_ITEM_STATE, http: 409, condition: "MenuItem not LISTED for this transition" }
  - { id: ERR_RESTAURANT_HAS_ACTIVE_ORDERS, http: 409, condition: "Cannot deactivate a restaurant with orders in {PLACED, ROUTED, PICKED_UP}" }

  # --- business constraints ---
  - { id: ERR_RESTAURANT_CLOSED, http: 409, condition: "Restaurant is_open == false at order/dispatch time" }
  - { id: ERR_ITEM_UNAVAILABLE, http: 409, condition: "Ordered MenuItem is unavailable, DELISTED, or not owned by the restaurant" }
  - { id: ERR_NO_DASHER_AVAILABLE, http: 409, condition: "No eligible ONLINE same-zone dasher with spare batch capacity at dispatch" }
  - { id: ERR_BATCH_LIMIT_EXCEEDED, http: 409, condition: "Accepting would push dasher active_delivery_count above max_batch_size" }
  - { id: ERR_SCHEDULE_NOT_DUE, http: 409, condition: "Scheduled order release attempted before scheduled_for is due" }
  - { id: ERR_PREP_SLOT_CONFLICT, http: 409, condition: "Scheduled order's prep interval overlaps more than max_concurrent_prep SCHEDULED orders on the same restaurant" }
  - { id: ERR_MISSING_QTY_EXCEEDS_FULFILLED, http: 422, condition: "missing_quantity exceeds the line's current fulfilled_quantity" }

  # --- fiscal / temporal (tip) ---
  - { id: ERR_TIP_NEGATIVE, http: 422, condition: "Tip adjustment would drive Order.tip_cents below 0" }
  - { id: ERR_TIP_WINDOW_CLOSED, http: 409, condition: "Tip adjustment attempted after billing_status left UNSETTLED" }

  # --- concurrency ---
  - { id: ERR_STALE_ORDER_VERSION, http: 412, condition: "expected_order_version does not match current Order.version at dispatch" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator who provisions zones, may register any party, and drives the test clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /zones — create zone"
      - "POST /_clock/set — set test clock"
    shared_operations:
      - "POST /restaurants, POST /customers, POST /dashers — register any party"
      - "GET reads across zones, restaurants, menu-items, customers, dashers, orders, deliveries, issues, earnings"
      - "POST /orders/{id}/release — release scheduled order"

  - name: Restaurant
    description: "Restaurant operator: owns its menu and dispatches its own orders"
    identity: "entity_backed:Restaurant"
    exclusive_operations:
      - "POST /restaurants/{id}/menu-items — add menu item (own restaurant)"
      - "PATCH /menu-items/{id}, POST /menu-items/{id}/delist — manage own items"
      - "PATCH /restaurants/{id}, POST /restaurants/{id}/deactivate — manage own restaurant"
      - "POST /orders/{id}/dispatch — dispatch own order"
    shared_operations:
      - "POST /restaurants — self-register"
      - "GET reads on zones, restaurants, menu-items, orders, deliveries, tip-adjustments, issues"

  - name: Customer
    description: "Customer: places, cancels, adjusts, and files issues on own orders"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /orders — place own order"
      - "POST /orders/{id}/line-items — add line to own order"
      - "POST /orders/{id}/cancel — cancel own order"
      - "POST /orders/{id}/tip-adjustments — adjust own order tip"
      - "POST /orders/{id}/issues — file issue on own order"
    shared_operations:
      - "POST /customers — self-register"
      - "POST /orders/{id}/release — release own scheduled order"
      - "GET reads on zones, restaurants, menu-items, own customer, orders, deliveries, issues"

  - name: Dasher
    description: "Courier: accepts/declines offers and progresses own deliveries"
    identity: "entity_backed:Dasher"
    exclusive_operations:
      - "POST /deliveries/{id}/accept — accept own offer"
      - "POST /deliveries/{id}/decline — decline own offer"
      - "POST /deliveries/{id}/picked-up — confirm pickup of own delivery"
      - "POST /deliveries/{id}/delivered — confirm drop-off of own delivery"
      - "PATCH /dashers/{id} — manage own availability/batch size"
    shared_operations:
      - "POST /dashers — self-register"
      - "GET reads on zones, restaurants, menu-items, dashers, orders, deliveries, earnings"

  - name: Support
    description: "Customer-service operator who adjudicates order issues"
    identity: "opaque"
    exclusive_operations:
      - "POST /order-issues/{id}/approve — approve refund"
      - "POST /order-issues/{id}/reject — reject issue"
    shared_operations:
      - "GET reads on orders, order-issues"
