            - { call: "POST /tea-ops/recipes/${r7}/activate", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches", payload: { recipe_id: "${r7}", target_weight_kg: 40.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { b: $.data.id } }
            - { call: "POST /tea-ops/batches/${b}/lock-recipe", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { bv2: $.data.version } }
            - { call: "POST /tea-ops/batches/${b}/allocations", payload: { lot_id: "${l1}", allocated_kg: 28.0, expected_batch_version: "${bv2}" }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "GET /tea-ops/batches/${b}", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { bv3: $.data.version } }
            - { call: "POST /tea-ops/batches/${b}/allocations", payload: { lot_id: "${l2}", allocated_kg: 12.0, expected_batch_version: "${bv3}" }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/finalize-allocation", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/blend", payload: { measured_moisture_pct: 5.5 }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/submit-qc", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
