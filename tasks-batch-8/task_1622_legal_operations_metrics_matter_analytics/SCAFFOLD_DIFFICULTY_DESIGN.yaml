            - "post-cascade (depth 2): SpendLine row exists with amount_cents == 950000 AND source_status == POSTED (verified via Matter.actual_spend_cents == 950000)"
            - "post-cascade (depth 3): Budget.consumed_cents == 950000 AND Budget.posture == CRITICAL (ratio 0.95 >= 0.95)"
            - "post-cascade: FiscalPeriod.total_actual_spend_cents == 950000"

