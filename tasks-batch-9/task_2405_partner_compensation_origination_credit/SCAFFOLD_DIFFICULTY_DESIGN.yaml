# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
#
# Domain: partner-compensation-origination-credit (api_prefix /comp)
# 9 rule_id blocks / 25 instances. Every numeric literal in an `assert:` line was
# produced by executing the referenced §1.3 formula (with its declared `constants:`)
# in Python against the fixture pinned in the same instance's `setup:`.
#
# Logical clock default for every instance: 2026-08-01T00:00:00Z.

scaffold_difficulty_design:

  # =====================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: matter_profitability_contribution_vs_fully_loaded_diverge
        grounds:
          - calculations.matter_realization_and_profitability
          - entities.Matter.fields.profitability_index_contribution
          - entities.Matter.fields.profitability_index_fully_loaded
          - entities.Matter.fields.verified_billable_hours
          - endpoints[POST /comp/matters/{id}/financials]
        distinguishing_aspect: |
          This dual-variant pair lives on the Matter entity domain (client profitability):
          CONTRIBUTION_MARGIN ignores OVERHEAD_RATE_CENTS_PER_HOUR entirely while
          FULLY_LOADED subtracts 9000 cents per verified billable hour, so the same
          matter reports profitability_index_contribution 0.8824 and
          profitability_index_fully_loaded 0.6706 — a pinned delta of 0.2118.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One CompensationCycle for fiscal_year 2026 in OPEN_INTAKE."
            - "One FORMULA Partner who is both billing and responsible attorney of one OPEN Matter."
            - "That Matter carries billed_cents 10000000, collected_cents 8500000, direct_cost_cents 1000000."
            - "That Matter carries verified_billable_hours 200.00 via one verified BILLABLE ContributionRecord."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, discretionary_pool_pct: 0.2000, draw_pct: 0.8000, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Ada Origin", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2010 }
              as: CycleAdmin
              captures: { pa: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-A1", client_display_name: "Alpha Holdings", matter_type: "NEW_CLIENT", practice_group: "CORPORATE", opened_on: "2026-01-15", billing_attorney_id: "${pa}", responsible_attorney_id: "${pa}" }
              as: CycleAdmin
              captures: { m1: "$.data.id", m1v: "$.data.version" }
            - call: "POST /comp/matters/${m1}/financials"
              payload: { billed_delta_cents: 10000000, collected_delta_cents: 8500000, direct_cost_delta_cents: 1000000, expected_matter_version: "${m1v}" }
              as: CycleAdmin
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${pa}", cycle_id: "${cy}", matter_id: "${m1}", kind: "BILLABLE", category: "CLIENT_WORK", hours: 200.00, standard_rate_cents: 50000, service_period_start: "2026-01-15", service_period_end: "2026-06-30" }
              as: CycleAdmin
              captures: { cr1: "$.data.id" }
            - call: "POST /comp/contribution-records/${cr1}/verify"
              payload: {}
              as: CycleAdmin
          trigger:
            - call: "GET /comp/matters/${m1}"
              payload: {}
              as: CycleAdmin
              captures: { pic: "$.data.profitability_index_contribution", pifl: "$.data.profitability_index_fully_loaded" }
          assert:
            - "Matter.${m1}.realization_pct == 0.8500"
            - "Matter.${m1}.verified_billable_hours == 200.00"
            - "Matter.${m1}.profitability_index_contribution == 0.8824"
            - "Matter.${m1}.profitability_index_fully_loaded == 0.6706"
            - "${pic} - ${pifl} == 0.2118"
            - "Matter.${m1}.profitability_index_contribution != Matter.${m1}.profitability_index_fully_loaded"

      - name: partner_formula_score_provisional_vs_final_diverge
        grounds:
          - calculations.partner_formula_score
          - calculations.credited_collection_split
          - entities.Partner.fields.formula_score_provisional
          - entities.Partner.fields.formula_score_final
          - entities.Partner.fields.credited_collection_provisional_cents
          - entities.Partner.fields.credited_collection_final_cents
          - state_machines.CreditClaim.SUBMITTED_to_ALLOCATED
        distinguishing_aspect: |
          This dual-variant pair lives on the Partner entity domain (evaluation scoring),
          not the Matter domain of matter_profitability_contribution_vs_fully_loaded_diverge:
          PROVISIONAL_ACCRUAL scores an OPEN matter off round(billed * realization) and
          yields formula_score_provisional 60.6342, while FINAL_COLLECTED restricts the
          input set to CLOSED matters and therefore yields formula_score_final 1.6667
          for the identical partner and identical allocations.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One CompensationCycle for fiscal_year 2026 in OPEN_INTAKE."
            - "Partner A (FORMULA) is billing and responsible attorney of OPEN Matter M."
            - "Partner ARB (FORMULA, is_credit_arbiter) exists solely to adjudicate; ARB holds no credit."
            - "M carries billed_cents 10000000, collected_cents 8500000, direct_cost_cents 1000000 and verified_billable_hours 200.00."
            - "A holds all four credit roles on M at credit_pct 100.00: ORIGINATING (from an ALLOCATED claim), BILLING and RESPONSIBLE (seeded at matter creation), WORKING (derived at hour verification)."
            - "M is still OPEN, so it is inside the PROVISIONAL_ACCRUAL input set and outside the FINAL_COLLECTED input set."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, discretionary_pool_pct: 0.2000, draw_pct: 0.8000, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Ada Origin", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2010 }
              as: CycleAdmin
              captures: { pa: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Rex Arbiter", practice_group: "REGULATORY", compensation_model: "FORMULA", admission_year: 2004, is_credit_arbiter: true }
              as: CycleAdmin
              captures: { parb: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-A1", client_display_name: "Alpha Holdings", matter_type: "NEW_CLIENT", practice_group: "CORPORATE", opened_on: "2026-01-15", billing_attorney_id: "${pa}", responsible_attorney_id: "${pa}" }
              as: CycleAdmin
              captures: { m1: "$.data.id", m1v: "$.data.version" }
            - call: "POST /comp/matters/${m1}/financials"
              payload: { billed_delta_cents: 10000000, collected_delta_cents: 8500000, direct_cost_delta_cents: 1000000, expected_matter_version: "${m1v}" }
              as: CycleAdmin
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${pa}", cycle_id: "${cy}", matter_id: "${m1}", kind: "BILLABLE", category: "CLIENT_WORK", hours: 200.00, standard_rate_cents: 50000, service_period_start: "2026-01-15", service_period_end: "2026-06-30" }
              as: CycleAdmin
              captures: { cr1: "$.data.id" }
            - call: "POST /comp/contribution-records/${cr1}/verify"
              payload: {}
              as: CycleAdmin
            - call: "POST /comp/credit-claims"
              payload: { cycle_id: "${cy}", matter_id: "${m1}", claim_basis: "NEW_CLIENT", requested_pct: 100.00, narrative: "Originated Alpha Holdings through a direct referral." }
              as: Partner
              as_user_id: "${pa}"
              captures: { cl1: "$.data.id" }
            - call: "POST /comp/credit-claims/${cl1}/submit"
              payload: {}
              as: Partner
              as_user_id: "${pa}"
            - call: "GET /comp/matters/${m1}"
              payload: {}
              as: CycleAdmin
              captures: { m1v2: "$.data.version" }
            - call: "POST /comp/credit-claims/${cl1}/adjudicate"
              payload: { decision: "ALLOCATE", approved_pct: 100.00, expected_matter_version: "${m1v2}" }
              as: CreditArbiter
              as_user_id: "${parb}"
          trigger:
            - call: "GET /comp/partners/${pa}"
              payload: {}
              as: CycleAdmin
              captures: { fsp: "$.data.formula_score_provisional", fsf: "$.data.formula_score_final" }
          assert:
            - "Partner.${pa}.credited_collection_provisional_cents == 8500000"
            - "Partner.${pa}.credited_collection_final_cents == 0"
            - "Partner.${pa}.normalized_credit_index_provisional == 1.000000"
            - "Partner.${pa}.normalized_credit_index_final == 0.000000"
            - "Partner.${pa}.blended_realization_pct == 0.8500"
            - "Partner.${pa}.weighted_profitability_points == 0.6706"
            - "Partner.${pa}.formula_score_provisional == 60.6342"
            - "Partner.${pa}.formula_score_final == 1.6667"
            - "${fsp} != ${fsf}"
            - "CompensationCycle.${cy}.total_formula_score == 60.6342"

  # =====================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: credited_collection_two_layer_rounding_residuals_pinned
        grounds:
          - calculations.credited_collection_split
          - state_machines.CreditClaim.DISPUTED_to_ALLOCATED
          - entities.CreditAllocation.fields.credited_collection_provisional_cents
          - endpoints[POST /comp/credit-claims/{id}/adjudicate]
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters, with one order pinned:
          credited_collection_split rounds the four role pools first (layer 1, residual
          -1 handed to ORIGINATING) and only then rounds within the ORIGINATING role
          across two 50.00 rows (layer 2, residual -1 handed to the earlier-created
          row); collapsing the two layers into round_half_up(C * weight * pct / 100)
          gives claimant 20002 instead of the pinned 20001 and breaks the exact
          re-sum to C = 100010.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One CompensationCycle for fiscal_year 2026 in OPEN_INTAKE."
            - "Partner A (FORMULA) is billing and responsible attorney of OPEN Matter M and holds a verified 5.00-hour BILLABLE record on M, so a WORKING allocation exists."
            - "Partner B (FORMULA) disputes A's origination claim; Partner ARB (is_credit_arbiter) adjudicates."
            - "M carries billed_cents 200020, collected_cents 100010, direct_cost_cents 0, so realization_pct is exactly 0.5000 and the PROVISIONAL_ACCRUAL basis C is exactly 100010 cents."
            - "The claim reaches DISPUTED so the SPLIT branch can create two ORIGINATING rows at 50.00 each, claimant row created first."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, discretionary_pool_pct: 0.2000, draw_pct: 0.8000, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Ada Origin", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2010 }
              as: CycleAdmin
              captures: { pa: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Ben Counter", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2011 }
              as: CycleAdmin
              captures: { pb: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Rex Arbiter", practice_group: "REGULATORY", compensation_model: "FORMULA", admission_year: 2004, is_credit_arbiter: true }
              as: CycleAdmin
              captures: { parb: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-R1", client_display_name: "Rounding Industries", matter_type: "NEW_CLIENT", practice_group: "CORPORATE", opened_on: "2026-01-15", billing_attorney_id: "${pa}", responsible_attorney_id: "${pa}" }
              as: CycleAdmin
              captures: { m1: "$.data.id", m1v: "$.data.version" }
            - call: "POST /comp/matters/${m1}/financials"
              payload: { billed_delta_cents: 200020, collected_delta_cents: 100010, direct_cost_delta_cents: 0, expected_matter_version: "${m1v}" }
              as: CycleAdmin
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${pa}", cycle_id: "${cy}", matter_id: "${m1}", kind: "BILLABLE", category: "CLIENT_WORK", hours: 5.00, standard_rate_cents: 50000, service_period_start: "2026-02-01", service_period_end: "2026-02-28" }
              as: CycleAdmin
              captures: { cr1: "$.data.id" }
            - call: "POST /comp/contribution-records/${cr1}/verify"
              payload: {}
              as: CycleAdmin
            - call: "POST /comp/credit-claims"
              payload: { cycle_id: "${cy}", matter_id: "${m1}", claim_basis: "NEW_CLIENT", requested_pct: 100.00, narrative: "Sole originator of Rounding Industries." }
              as: Partner
              as_user_id: "${pa}"
              captures: { cl1: "$.data.id" }
            - call: "POST /comp/credit-claims/${cl1}/submit"
              payload: {}
              as: Partner
              as_user_id: "${pa}"
            - call: "POST /comp/credit-claims/${cl1}/dispute"
              payload: { contested_pct: 50.00, dispute_grounds: "Introduction came from my existing relationship." }
              as: Partner
              as_user_id: "${pb}"
            - call: "GET /comp/matters/${m1}"
              payload: {}
              as: CycleAdmin
              captures: { m1v2: "$.data.version" }
          trigger:
            - call: "POST /comp/credit-claims/${cl1}/adjudicate"
              payload: { decision: "SPLIT", approved_pct: 50.00, counterparty_pct: 50.00, expected_matter_version: "${m1v2}" }
              as: CreditArbiter
              as_user_id: "${parb}"
          assert:
            - "Matter.${m1}.realization_pct == 0.5000"
            - "Matter.${m1}.origination_pct_assigned == 100.00"
            - "CreditAllocation where matter_id == ${m1} AND credit_role == ORIGINATING AND partner_id == ${pa} has credited_collection_provisional_cents == 20001"
            - "CreditAllocation where matter_id == ${m1} AND credit_role == ORIGINATING AND partner_id == ${pb} has credited_collection_provisional_cents == 20002"
            - "CreditAllocation where matter_id == ${m1} AND credit_role == BILLING has credited_collection_provisional_cents == 20002"
            - "CreditAllocation where matter_id == ${m1} AND credit_role == RESPONSIBLE has credited_collection_provisional_cents == 15002"
            - "CreditAllocation where matter_id == ${m1} AND credit_role == WORKING has credited_collection_provisional_cents == 25003"
            - "sum of credited_collection_provisional_cents over the 5 ACTIVE CreditAllocation rows of ${m1} == 100010"
            - "every ACTIVE CreditAllocation row of ${m1} has credited_collection_final_cents == 0"
            - "Partner.${pa}.credited_collection_provisional_cents == 80008"
            - "Partner.${pb}.credited_collection_provisional_cents == 20002"

      - name: non_billable_points_cap_then_diminishing_then_floor_penalty
        grounds:
          - calculations.non_billable_weighted_points
          - entities.Partner.fields.non_billable_points
          - entities.ContributionRecord.fields.verified
          - endpoints[POST /comp/contribution-records/{id}/verify]
        distinguishing_aspect: |
          Mode (a) — five inputs interacting non-linearly through a nested chain of
          per-category caps, a conditional diminishing branch keyed on capped_total >
          DIMINISHING_THRESHOLD_HOURS, a conditional PRO_BONO_SHORTFALL_PENALTY branch
          and a model multiplier: verifying a 60.00-hour TRAINING record weighted at
          0.75 (nominally 45.00 points) moves non_billable_points by only 7.00, from
          515.45 to 522.45, because the same 60 hours also push capped_total from 440
          to 500 and enlarge the diminishing discount.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One CompensationCycle for fiscal_year 2026 in OPEN_INTAKE."
            - "Partner A with compensation_model FORMULA (MODEL_MULTIPLIER 1.00)."
            - "Four NON_BILLABLE ContributionRecords for A on distinct categories with non-adjacent service windows: FIRM_MANAGEMENT 320.00h, RECRUITING 100.00h, PRO_BONO 40.00h, TRAINING 60.00h."
            - "The FIRM_MANAGEMENT, RECRUITING and PRO_BONO records are already verified; the TRAINING record is still unverified."
            - "At that point capped_total is 440 (FIRM_MANAGEMENT capped from 320 to its 300 cap) and Partner.non_billable_points reads 515.45."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, discretionary_pool_pct: 0.2000, draw_pct: 0.8000, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Ada Origin", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2010 }
              as: CycleAdmin
              captures: { pa: "$.data.id" }
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${pa}", cycle_id: "${cy}", kind: "NON_BILLABLE", category: "FIRM_MANAGEMENT", hours: 320.00, service_period_start: "2026-01-01", service_period_end: "2026-03-31" }
              as: CycleAdmin
              captures: { cr_fm: "$.data.id" }
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${pa}", cycle_id: "${cy}", kind: "NON_BILLABLE", category: "RECRUITING", hours: 100.00, service_period_start: "2026-01-01", service_period_end: "2026-03-31" }
              as: CycleAdmin
              captures: { cr_rec: "$.data.id" }
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${pa}", cycle_id: "${cy}", kind: "NON_BILLABLE", category: "PRO_BONO", hours: 40.00, service_period_start: "2026-01-01", service_period_end: "2026-03-31" }
              as: CycleAdmin
              captures: { cr_pb: "$.data.id" }
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${pa}", cycle_id: "${cy}", kind: "NON_BILLABLE", category: "TRAINING", hours: 60.00, service_period_start: "2026-01-01", service_period_end: "2026-03-31" }
              as: CycleAdmin
              captures: { cr_tr: "$.data.id" }
            - call: "POST /comp/contribution-records/${cr_fm}/verify"
              payload: {}
              as: CycleAdmin
            - call: "POST /comp/contribution-records/${cr_rec}/verify"
              payload: {}
              as: CycleAdmin
            - call: "POST /comp/contribution-records/${cr_pb}/verify"
              payload: {}
              as: CycleAdmin
          trigger:
            - call: "GET /comp/partners/${pa}"
              payload: {}
              as: CycleAdmin
              captures: { nb_before: "$.data.non_billable_points" }
            - call: "POST /comp/contribution-records/${cr_tr}/verify"
              payload: {}
              as: CycleAdmin
            - call: "GET /comp/partners/${pa}"
              payload: {}
              as: CycleAdmin
              captures: { nb_after: "$.data.non_billable_points" }
          assert:
            - "${nb_before} == 515.45"
            - "${nb_after} == 522.45"
            - "${nb_after} - ${nb_before} == 7.00"
            - "ContributionRecord.${cr_tr}.verified == true"
            - "Partner.${pa}.non_billable_points == 522.45"
            - "Partner.${pa}.verified_billable_hours == 0.00"

      - name: formula_score_normalization_pinned_before_index_consumption
        grounds:
          - calculations.partner_formula_score
          - calculations.credited_collection_split
          - entities.Partner.fields.normalized_credit_index_provisional
          - entities.CompensationCycle.fields.total_formula_score
          - endpoints[POST /comp/matters/{id}/financials]
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with a pinned evaluation order: each
          Partner.formula_score_provisional depends on the firm-wide credited total,
          which depends on every partner's credited collections, which depend on that
          partner. Step 4 pins normalization_factor to 6 decimal places once for the
          whole firm before step 5 consumes it, so booking a matter credited only to
          ARB drops A's score from 35.2917 to 28.2922 and B's from 15.0000 to 13.2501
          even though neither partner's own allocations changed by a single cent.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One CompensationCycle for fiscal_year 2026 in OPEN_INTAKE."
            - "Matter M1 (client CLI-R1) has billed 200020 / collected 100010 / direct cost 0, a verified 5.00-hour BILLABLE record for A, and a SPLIT-adjudicated 50/50 ORIGINATING pair between A and B; A also holds BILLING, RESPONSIBLE and WORKING."
            - "Partners A and B therefore hold credited_collection_provisional_cents 80008 and 20002, the firm total is 100010, and formula_score_provisional reads 35.2917 and 15.0000."
            - "Matter M2 (client CLI-R2) has just been created with ARB as both billing and responsible attorney, no ORIGINATING claim and no verified hours, and still carries zero financials."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, discretionary_pool_pct: 0.2000, draw_pct: 0.8000, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Ada Origin", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2010 }
              as: CycleAdmin
              captures: { pa: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Ben Counter", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2011 }
              as: CycleAdmin
              captures: { pb: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Rex Arbiter", practice_group: "REGULATORY", compensation_model: "FORMULA", admission_year: 2004, is_credit_arbiter: true }
              as: CycleAdmin
              captures: { parb: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-R1", client_display_name: "Rounding Industries", matter_type: "NEW_CLIENT", practice_group: "CORPORATE", opened_on: "2026-01-15", billing_attorney_id: "${pa}", responsible_attorney_id: "${pa}" }
              as: CycleAdmin
              captures: { m1: "$.data.id", m1v: "$.data.version" }
            - call: "POST /comp/matters/${m1}/financials"
              payload: { billed_delta_cents: 200020, collected_delta_cents: 100010, direct_cost_delta_cents: 0, expected_matter_version: "${m1v}" }
              as: CycleAdmin
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${pa}", cycle_id: "${cy}", matter_id: "${m1}", kind: "BILLABLE", category: "CLIENT_WORK", hours: 5.00, standard_rate_cents: 50000, service_period_start: "2026-02-01", service_period_end: "2026-02-28" }
              as: CycleAdmin
              captures: { cr1: "$.data.id" }
            - call: "POST /comp/contribution-records/${cr1}/verify"
              payload: {}
              as: CycleAdmin
            - call: "POST /comp/credit-claims"
