              payload: { company_name: "Mu Textiles", site_state_code: "NC" }
              as: ProjectManager
              captures: { cust12_id: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${cust12_id}", job_number: "J-9101", quoted_price_cents: 200000 }
              as: ProjectManager
