  # =======================================================================
  # RULE 8 - resource_temporal_overlap
  # =======================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: confirming_line_peak_occupancy_half_open_window_with_capacity
        grounds:
          - calculations.confirming_line_peak_occupancy
          - calculations.presentation_window
          - entities.Bank.fields.confirmation_appetite_cents
          - entities.Bank.fields.confirming_line_used_cents
          - entities.DocumentaryCredit.fields.confirmation_window_start
          - entities.DocumentaryCredit.fields.confirmation_window_end
          - state_machines.DocumentaryCredit.UNCONFIRMED_to_CONFIRMATION_REQUESTED
          - errors.ERR_CONFIRMING_LINE_WINDOW_FULL
        distinguishing_aspect: |
          The contended resource is a BANK's confirmation line and the interval semantics
          are HALF-OPEN [start, end) WITH AGGREGATE CAPACITY: three overlapping windows
          are admissible only up to a summed peak of 20000000, and C4 starting exactly on
          2026-10-10 is admitted precisely because C1's window ENDS on 2026-10-10 and an
          exclusive end frees the line on that same date.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One applicant with a USD facility of limit_cents 100000000, collateral_required_pct 0."
            - "An advising bank in DE and a candidate confirming bank in SG with confirmation_appetite_cents 20000000, country_risk_score 35, credit_rating A."
            - "A beneficiary in VN, so the SG bank is not domiciled in the beneficiary's country."
            - "Four SIGHT_PAYMENT credits of amount_cents 10000000 each (gross_exposure_cents 10000000 each): C1 expiry 2026-09-19, C2 and C3 expiry 2026-10-20, C4 expiry 2026-11-19, all presentation_period_days 21."
            - "C1, C2 and C3 are ISSUED on 2026-08-10; C4 is only APPROVED on 2026-08-10 and is issued later on 2026-10-10 so that its window starts on the very date C1's window ends."
