scenario: "864. Ethics & Financial-Disclosure Filing (public officials): filer registry & role, annual/transactional statement, conflict & recusal log, gift/travel reporting & limit, late-filing penalty, complaint & investigation, training/certification, public disclosure"
domain_name: ethics-financial-disclosure
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Jurisdiction / ethics-authority name"
      - name: gift_single_limit_cents
        type: integer
        source: input
        description: "Per-event reportable-gift NET value ceiling in cents; a single gift whose NET reportable value exceeds this is rejected"
        default: 5000
      - name: gift_annual_source_limit_cents
        type: integer
        source: input
        description: "Per-source per-calendar-year cumulative NET reportable-gift ceiling in cents"
        default: 25000
      - name: penalty_base_fee_cents
        type: integer
        source: input
        description: "Flat base fee (cents) applied to any late statement, before per-day accrual"
        default: 5000
      - name: penalty_daily_rate_cents
        type: integer
        source: input
        description: "Tier-1 per-day late accrual rate (cents/day); tiers 2 and 3 multiply this (see calculations.late_filing_penalty)"
        default: 250
      - name: penalty_cap_cents
        type: integer
        source: input
        description: "Absolute ceiling (cents) on any single late-filing penalty after the full formula"
        default: 50000

  - name: Filer
    parent: null
    common_fields: true
    fields:
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id"
      - name: full_name
        type: string
        source: input
        description: "Public official's legal name"
      - name: official_title
        type: string
        source: input
        description: "Office / position held"
      - name: filer_category
        type: enum
        source: input
        description: "Determines late-penalty category multiplier"
        constraints: "one of ELECTED, APPOINTED, SENIOR_STAFF, CANDIDATE"
      - name: email
        type: string
        source: input
        description: "Contact email"
      - name: status
        type: enum
        source: input
        description: "Registry lifecycle; only ACTIVE filers may submit statements or file gift reports"
        default: ACTIVE
        constraints: "one of ACTIVE, INACTIVE, SEPARATED"
      - name: compliance_status
        type: enum
        source: computed
        description: "COMPLIANT when outstanding_penalty_cents <= DELINQUENCY_BLOCK_THRESHOLD_CENTS, else DELINQUENT; recomputed on every penalty assess/pay/waive"
        constraints: "one of COMPLIANT, DELINQUENT"
        default: COMPLIANT
      - name: outstanding_penalty_cents
        type: integer
        source: computed
        description: "Conserved ledger: sum of assessed_amount_cents over this filer's Penalty rows in status ASSESSED (see calculations.outstanding_penalty_ledger)"
        default: 0
      - name: reportable_gift_total_cents
        type: integer
        source: computed
        description: "Rolling aggregate: sum of reportable_value_cents over this filer's non-DISPOSED GiftReport rows in the current calendar year (see calculations.gift_annual_aggregate)"
        default: 0
      - name: open_recusal_count
        type: integer
        source: computed
        description: "Conserved count: number of this filer's RecusalEntry rows in status DECLARED"
        default: 0
      - name: training_status
        type: enum
        source: computed
        description: "CURRENT when a COMPLETED TrainingRecord exists whose expires_at is strictly after the current logical clock; LAPSED when the latest completed course has expired; NONE when no course completed"
        constraints: "one of NONE, CURRENT, LAPSED"
        default: NONE

  - name: FilingPeriod
    parent: null
    common_fields: true
    fields:
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id"
      - name: label
        type: string
        source: input
        description: "Human label, e.g. 'CY2025 Annual'"
      - name: statement_type
        type: enum
        source: input
        description: "ANNUAL or TRANSACTIONAL disclosure cycle"
        constraints: "one of ANNUAL, TRANSACTIONAL"
      - name: coverage_start
        type: datetime
        source: input
        description: "Inclusive start of the reporting-coverage interval (closed lower bound)"
      - name: coverage_end
        type: datetime
        source: input
        description: "Inclusive end of the reporting-coverage interval (closed upper bound); periods of the same jurisdiction+statement_type may not overlap on the CLOSED interval, so shared endpoints conflict"
      - name: due_at
        type: datetime
        source: input
        description: "Filing deadline; a statement submitted after this instant is late"
      - name: status
        type: enum
        source: input
        description: "OPEN accepts filings; CLOSED does not"
        default: OPEN
        constraints: "one of OPEN, CLOSED"

  - name: Statement
    parent: null
    common_fields: true
    fields:
      - name: filer_id
        type: string
        source: input
        description: "FK -> Filer.id"
      - name: filing_period_id
        type: string
        source: input
        description: "FK -> FilingPeriod.id"
      - name: supersedes_statement_id
        type: string
        source: input
        description: "FK -> Statement.id; set on an amendment that replaces a prior ACCEPTED statement (self-referential), null otherwise"
        default: null
      - name: statement_type
        type: enum
        source: computed
        description: "Copied from the linked FilingPeriod.statement_type at creation"
        constraints: "one of ANNUAL, TRANSACTIONAL"
      - name: content
        type: object
        source: input
        description: "Disclosure payload (assets, income, positions) — opaque to the state machine"
      - name: status
        type: enum
        source: computed
        description: "Statement lifecycle"
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, ACCEPTED, RETURNED_FOR_CORRECTION, FLAGGED, SUPERSEDED"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent submit; null while DRAFT"
        default: null
      - name: due_at_snapshot
        type: datetime
        source: computed
        description: "FilingPeriod.due_at captured at first submit, used for late math"
      - name: is_late
        type: boolean
        source: computed
        description: "True when submitted_at > due_at_snapshot"
        default: false
      - name: days_late
        type: integer
        source: computed
        description: "0 when on-time, else ceil((submitted_at - due_at_snapshot) / 86400 seconds)"
        default: 0
      - name: correction_round
        type: integer
        source: computed
        description: "Incremented each time the statement is RETURNED_FOR_CORRECTION"
        default: 0
      - name: public_status
        type: enum
        source: computed
        description: "Public-disclosure visibility"
        default: NOT_PUBLISHED
        constraints: "one of NOT_PUBLISHED, PUBLISHED, WITHHELD"
      - name: published_at
        type: datetime
        source: system
        description: "Logical-clock instant of publication; null until published"
        default: null
      - name: redaction_level
        type: enum
        source: input
        description: "Public redaction applied at publish time"
        default: FULL
        constraints: "one of FULL, REDACTED"

  - name: GiftReport
    parent: null
    common_fields: true
    fields:
      - name: filer_id
        type: string
        source: input
        description: "FK -> Filer.id"
      - name: source_name
        type: string
        source: input
        description: "Donor / source identity; annual aggregation groups by this value"
      - name: gift_kind
        type: enum
        source: input
        description: "GIFT (single item valued by fair_market_value_cents) or TRAVEL (valued from travel_legs)"
        constraints: "one of GIFT, TRAVEL"
      - name: fair_market_value_cents
        type: integer
        source: input
        description: "Gross FMV in cents for gift_kind GIFT; ignored for TRAVEL"
        default: 0
      - name: consideration_paid_cents
        type: integer
        source: input
        description: "Amount the filer already paid toward the gift; subtracted to obtain NET reportable value"
        default: 0
      - name: travel_legs
        type: array
        source: input
        description: "For gift_kind TRAVEL: list of objects {nights:int, nightly_rate_cents:int, miles:int}; valued per calculations.gift_travel_valuation"
        default: []
      - name: received_at
        type: datetime
        source: input
        description: "When the gift/travel was received; determines calendar-year bucket for annual aggregation"
      - name: reportable_value_cents
        type: integer
        source: computed
        description: "NET reportable value in cents (see calculations.gift_reportable_value); compared to the single-gift and annual-source limits"
      - name: disclosed_gross_cents
        type: integer
        source: computed
        description: "GROSS value in cents shown on the public disclosure (see calculations.gift_reportable_value); differs from reportable_value_cents whenever consideration_paid_cents > 0"
      - name: status
        type: enum
        source: computed
        description: "REPORTED once recorded; DISPOSED after return/reimbursement removes it from the aggregate"
        default: REPORTED
        constraints: "one of REPORTED, DISPOSED"

  - name: RecusalEntry
    parent: null
    common_fields: true
    fields:
      - name: filer_id
        type: string
        source: input
        description: "FK -> Filer.id"
      - name: matter_id
        type: string
        source: input
        description: "Opaque identifier of the matter recused from; overlap is scoped per (filer_id, matter_id)"
      - name: matter_description
        type: string
        source: input
        description: "Free-text description of the conflict"
      - name: effective_start
        type: datetime
        source: input
        description: "Inclusive start of the recusal interval (closed lower bound)"
      - name: effective_end
        type: datetime
        source: input
        description: "Exclusive end of the recusal interval (open upper bound); two DECLARED recusals on the same (filer_id, matter_id) conflict only if their HALF-OPEN [start,end) intervals overlap, so touching endpoints are allowed"
      - name: reason
        type: string
        source: input
        description: "Reason code / justification"
      - name: status
        type: enum
        source: computed
        description: "DECLARED while active; RESOLVED after the conflict clears"
        default: DECLARED
        constraints: "one of DECLARED, RESOLVED"

  - name: Penalty
    parent: null
    common_fields: true
    fields:
      - name: filer_id
        type: string
        source: input
        description: "FK -> Filer.id"
      - name: statement_id
        type: string
        source: input
        description: "FK -> Statement.id; set for penalty_type LATE_FILING, null for SANCTION"
        default: null
      - name: investigation_id
        type: string
        source: input
        description: "FK -> Investigation.id; set for penalty_type SANCTION, null for LATE_FILING"
        default: null
      - name: penalty_type
        type: enum
        source: computed
        description: "LATE_FILING (auto on late submit) or SANCTION (auto on sustained investigation)"
        constraints: "one of LATE_FILING, SANCTION"
      - name: provisional_amount_cents
        type: integer
        source: computed
        description: "Estimate stamped at submit for LATE_FILING (see calculations.late_filing_penalty variant PROVISIONAL); 0 for SANCTION"
        default: 0
      - name: assessed_amount_cents
        type: integer
        source: computed
        description: "Final owed amount once ASSESSED (LATE_FILING variant FINAL, or SANCTION final_sanction)"
        default: 0
      - name: days_late
        type: integer
        source: computed
        description: "Snapshot of the driving statement's days_late for LATE_FILING; 0 for SANCTION"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Penalty lifecycle"
        default: ACCRUING
        constraints: "one of ACCRUING, ASSESSED, PAID, WAIVED"

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - name: filer_id
        type: string
        source: input
        description: "FK -> Filer.id (the respondent)"
      - name: statement_id
        type: string
        source: input
        description: "FK -> Statement.id; optional subject statement of the allegation, null if none"
        default: null
      - name: complainant_ref
        type: string
        source: input
        description: "Opaque reference to the complainant"
      - name: allegation
        type: string
        source: input
        description: "Text of the allegation"
      - name: status
        type: enum
        source: computed
        description: "Complaint lifecycle"
        default: FILED
        constraints: "one of FILED, SCREENED, DISMISSED, SUBSTANTIATED"

  - name: Investigation
    parent: null
    common_fields: true
    fields:
      - name: complaint_id
        type: string
        source: input
        description: "FK -> Complaint.id"
      - name: filer_id
        type: string
        source: computed
        description: "FK -> Filer.id; copied from the parent Complaint at open time"
      - name: assigned_investigator_id
        type: string
        source: system
        description: "X-User-ID of the Investigator who opened the investigation; SoD anchor"
      - name: adjudicator_id
        type: string
        source: system
        description: "X-User-ID of the Adjudicator who adjudicated; must differ from assigned_investigator_id"
        default: null
      - name: findings
        type: string
        source: input
        description: "Adjudication findings text"
        default: null
      - name: recommended_sanction_cents
        type: integer
        source: input
        description: "Sanction the adjudicator recommends on SUSTAINED; input to final_sanction"
        default: 0
      - name: final_sanction_cents
        type: integer
        source: computed
        description: "min(Jurisdiction.penalty_cap_cents, recommended_sanction_cents) on SUSTAINED (see calculations.final_sanction)"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Investigation lifecycle; NOT_SUSTAINED can be reopened back to OPEN (cycle)"
        default: OPEN
        constraints: "one of OPEN, SUSTAINED, NOT_SUSTAINED, CLOSED"

  - name: TrainingRecord
    parent: null
    common_fields: true
    fields:
      - name: filer_id
        type: string
        source: input
        description: "FK -> Filer.id"
      - name: course_code
        type: string
        source: input
        description: "Ethics course identifier"
      - name: enrolled_at
        type: datetime
        source: system
        description: "Logical-clock instant of enrollment"
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock instant of completion; null until COMPLETED"
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: "completed_at + TRAINING_VALIDITY_DAYS (365) days; null until COMPLETED"
        default: null
      - name: certificate_no
        type: string
        source: computed
        description: "Certificate number minted at completion; null until COMPLETED"
        default: null
      - name: status
        type: enum
        source: computed
        description: "ENROLLED -> COMPLETED; EXPIRED once the logical clock reaches expires_at"
        default: ENROLLED
        constraints: "one of ENROLLED, COMPLETED, EXPIRED"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Statement
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /statements/{id}/submit"
        actor: Filer
        preconditions:
          - "status == DRAFT"
          - "owning Filer.status == ACTIVE (cross-entity dependency Statement->Filer)"
          - "owning Filer.training_status == CURRENT"
          - "owning Filer.outstanding_penalty_cents <= DELINQUENCY_BLOCK_THRESHOLD_CENTS"
          - "no other non-SUPERSEDED Statement exists for same (filer_id, filing_period_id)"
        side_effects:
          - "set submitted_at = current logical clock"
          - "set due_at_snapshot = FilingPeriod.due_at"
          - "compute is_late and days_late"
          - "if is_late: create a Penalty(penalty_type=LATE_FILING, status=ACCRUING, statement_id=this) with provisional_amount_cents per calculations.late_filing_penalty variant PROVISIONAL"
      - from: RETURNED_FOR_CORRECTION
        to: SUBMITTED
        trigger: "POST /statements/{id}/submit"
        actor: Filer
        preconditions:
          - "status == RETURNED_FOR_CORRECTION"
          - "owning Filer.status == ACTIVE"
          - "owning Filer.training_status == CURRENT"
        side_effects:
          - "set submitted_at = current logical clock"
          - "recompute is_late and days_late against due_at_snapshot"
        note: "Resubmission after a correction — the revision half of the cyclic shape"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /statements/{id}/accept"
        actor: EthicsOfficer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "if a LATE_FILING Penalty in status ACCRUING is linked to this statement: transition it ACCRUING->ASSESSED, setting assessed_amount_cents per calculations.late_filing_penalty variant FINAL (cascade link 1)"
          - "that penalty's ASSESSED transition increments owning Filer.outstanding_penalty_cents and recomputes Filer.compliance_status (cascade link 2)"
          - "if the recompute flips Filer.compliance_status to DELINQUENT: set every one of that filer's Statement rows whose public_status == PUBLISHED to WITHHELD (cascade link 3)"
      - from: SUBMITTED
        to: RETURNED_FOR_CORRECTION
        trigger: "POST /statements/{id}/return"
        actor: EthicsOfficer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "increment correction_round by 1"
        note: "Revert half of the cycle SUBMITTED<->RETURNED_FOR_CORRECTION"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system: a new amendment Statement with supersedes_statement_id == this is ACCEPTED"
        actor: system
        preconditions:
          - "status == ACCEPTED"
        side_effects:
          - "set public_status = NOT_PUBLISHED (a superseded statement leaves public view)"
      - from: ACCEPTED
        to: FLAGGED
        trigger: "system: a Complaint referencing this statement is SUBSTANTIATED"
        actor: system
        preconditions:
          - "status == ACCEPTED"
        side_effects:
          - "if public_status == PUBLISHED: set public_status = WITHHELD (cascade link 3 of the adjudication cascade)"
    concurrency_rules:
      - rule_id: publish-stale-statement
        parent_entity: Statement
        write_endpoint: "POST /statements/{id}/publish"
        occ_field: "expected_statement_version"
        description: |
          Publishing a Statement whose version has advanced since the client last
          observed it is rejected as stale. This captures the re-publish case: an
          amendment (or a return/resubmit) has bumped Statement.version between the
          client's read and this publish, so the snapshot the client intends to make
          public is no longer the current one. Resolved by comparing
          expected_statement_version against Statement.version.
        error_id: ERR_STALE_VERSION
        http_status: 412

  - entity: Penalty
    initial_state: ACCRUING
    terminal_states: [PAID, WAIVED]
    transitions:
      - from: ACCRUING
        to: ASSESSED
        trigger: "system: driving Statement transitions SUBMITTED->ACCEPTED, or Investigation->SUSTAINED for SANCTION"
        actor: system
        preconditions:
          - "status == ACCRUING"
        side_effects:
          - "set assessed_amount_cents (LATE_FILING: calculations.late_filing_penalty variant FINAL; SANCTION: Investigation.final_sanction_cents)"
          - "increment owning Filer.outstanding_penalty_cents by assessed_amount_cents"
          - "recompute Filer.compliance_status"
      - from: ASSESSED
        to: PAID
        trigger: "POST /penalties/{id}/pay"
        actor: Filer
        preconditions:
          - "status == ASSESSED"
          - "acting Filer owns the penalty"
        side_effects:
          - "decrement owning Filer.outstanding_penalty_cents by assessed_amount_cents"
          - "recompute Filer.compliance_status; if it flips to COMPLIANT, set every one of that filer's WITHHELD Statement rows back to PUBLISHED"
      - from: ASSESSED
        to: WAIVED
        trigger: "POST /penalties/{id}/waive"
        actor: EthicsOfficer
        preconditions:
          - "status == ASSESSED"
        side_effects:
          - "decrement owning Filer.outstanding_penalty_cents by assessed_amount_cents"
          - "recompute Filer.compliance_status"

  - entity: Complaint
    initial_state: FILED
    terminal_states: [DISMISSED, SUBSTANTIATED]
    transitions:
      - from: FILED
        to: SCREENED
        trigger: "POST /complaints/{id}/screen (decision=SCREENED)"
        actor: EthicsOfficer
        preconditions:
          - "status == FILED"
        side_effects:
          - "set screened marker; complaint becomes eligible for investigation"
      - from: FILED
        to: DISMISSED
        trigger: "POST /complaints/{id}/screen (decision=DISMISSED)"
        actor: EthicsOfficer
        preconditions:
          - "status == FILED"
        side_effects: []
        note: "Branching fork at screening: SCREENED vs DISMISSED"
      - from: SCREENED
        to: SUBSTANTIATED
        trigger: "system: linked Investigation transitions OPEN->SUSTAINED"
        actor: system
        preconditions:
          - "status == SCREENED"
        side_effects:
          - "if statement_id is set: transition that Statement ACCEPTED->FLAGGED (adjudication cascade link 2)"
      - from: SCREENED
        to: DISMISSED
        trigger: "system: linked Investigation transitions OPEN->NOT_SUSTAINED"
        actor: system
        preconditions:
          - "status == SCREENED"
        side_effects: []

  - entity: Investigation
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: SUSTAINED
        trigger: "POST /investigations/{id}/adjudicate (decision=SUSTAINED)"
        actor: Adjudicator
        preconditions:
          - "status == OPEN"
          - "parent Complaint.status == SCREENED (cross-entity dependency Investigation->Complaint)"
          - "acting X-User-ID != assigned_investigator_id (segregation of duties)"
        side_effects:
          - "set final_sanction_cents per calculations.final_sanction"
          - "transition parent Complaint SCREENED->SUBSTANTIATED (adjudication cascade link 1)"
          - "create a Penalty(penalty_type=SANCTION, status=ASSESSED, investigation_id=this, assessed_amount_cents=final_sanction_cents), which increments Filer.outstanding_penalty_cents"
      - from: OPEN
        to: NOT_SUSTAINED
        trigger: "POST /investigations/{id}/adjudicate (decision=NOT_SUSTAINED)"
        actor: Adjudicator
        preconditions:
          - "status == OPEN"
          - "parent Complaint.status == SCREENED"
          - "acting X-User-ID != assigned_investigator_id"
        side_effects:
          - "transition parent Complaint SCREENED->DISMISSED"
      - from: NOT_SUSTAINED
        to: OPEN
        trigger: "POST /investigations/{id}/reopen"
        actor: EthicsOfficer
        preconditions:
          - "status == NOT_SUSTAINED"
        side_effects:
          - "transition parent Complaint DISMISSED->SCREENED (re-open the matter)"
        note: "Cyclic shape OPEN->NOT_SUSTAINED->OPEN"
      - from: SUSTAINED
        to: CLOSED
        trigger: "POST /investigations/{id}/reopen is NOT permitted from SUSTAINED; closure via system archival"
        actor: system
        preconditions:
          - "status == SUSTAINED"
        side_effects: []
        note: "SUSTAINED is effectively final; modeled terminal via CLOSED archival"

  - entity: RecusalEntry
    initial_state: DECLARED
    terminal_states: [RESOLVED]
    transitions:
      - from: DECLARED
        to: RESOLVED
        trigger: "POST /recusals/{id}/resolve"
        actor: Filer
        preconditions:
          - "status == DECLARED"
          - "acting Filer owns the recusal"
        side_effects:
          - "decrement owning Filer.open_recusal_count by 1 (compensates the +1 applied at declaration)"

  - entity: GiftReport
    initial_state: REPORTED
    terminal_states: [DISPOSED]
    transitions:
      - from: REPORTED
        to: DISPOSED
        trigger: "POST /gift-reports/{id}/dispose"
        actor: Filer
        preconditions:
          - "status == REPORTED"
          - "acting Filer owns the gift report"
        side_effects:
          - "decrement owning Filer.reportable_gift_total_cents by reportable_value_cents (compensates the aggregate added at report time)"

  - entity: TrainingRecord
    initial_state: ENROLLED
    terminal_states: [EXPIRED]
    transitions:
      - from: ENROLLED
        to: COMPLETED
        trigger: "POST /training-records/{id}/complete"
        actor: Filer
        preconditions:
          - "status == ENROLLED"
          - "acting Filer owns the training record"
        side_effects:
          - "set completed_at = current logical clock"
          - "set expires_at = completed_at + TRAINING_VALIDITY_DAYS days"
          - "mint certificate_no"
          - "recompute owning Filer.training_status -> CURRENT"
      - from: COMPLETED
        to: EXPIRED
        trigger: "system: current logical clock >= expires_at"
        actor: system
        preconditions:
          - "status == COMPLETED"
          - "current logical clock >= expires_at"
        side_effects:
          - "recompute owning Filer.training_status -> LAPSED"

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: late_filing_penalty
    trigger: "Statement submit (PROVISIONAL variant) and Statement SUBMITTED->ACCEPTED (FINAL variant)"
    algorithm: threshold
    formula: |
      days_late = 0 if submitted_at <= due_at_snapshot
                  else ceil((submitted_at - due_at_snapshot) / 86400 seconds)
      # FINAL variant (mode (a): >=3 inputs, tiered selection, nested min, category multiplier):
      if days_late <= TIER1_MAX_DAYS(30):        tier_rate = penalty_daily_rate_cents
      elif days_late <= TIER2_MAX_DAYS(90):      tier_rate = penalty_daily_rate_cents * TIER2_MULT(2)
      else:                                       tier_rate = penalty_daily_rate_cents * TIER3_MULT(3)
      raw = penalty_base_fee_cents + tier_rate * days_late * CATEGORY_MULTIPLIER[filer_category]
      assessed_amount_cents = min(penalty_cap_cents, round_half_up(raw))
    input_set: "single Statement + its Filer.filer_category + owning Jurisdiction constants"
    constants:
      TIER1_MAX_DAYS: 30
      TIER2_MAX_DAYS: 90
      TIER2_MULT: 2
      TIER3_MULT: 3
      CATEGORY_MULTIPLIER: { ELECTED: 2.0, APPOINTED: 1.5, SENIOR_STAFF: 1.0, CANDIDATE: 1.0 }
      DELINQUENCY_BLOCK_THRESHOLD_CENTS: 10000
    precision: "whole cents, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "stamped on Penalty.provisional_amount_cents at submit time"
        difference: "flat estimate ignoring tier multiplier, category multiplier, and cap: penalty_base_fee_cents + penalty_daily_rate_cents * days_late"
      - name: FINAL
        when: "stamped on Penalty.assessed_amount_cents when the statement is ACCEPTED"
        difference: "full formula above with tiered rate, category multiplier, and cap"

  - name: gift_reportable_value
    trigger: "GiftReport creation"
    algorithm: aggregation
    formula: |
      if gift_kind == GIFT:
        gross = fair_market_value_cents
      else: # TRAVEL
        gross = gift_travel_valuation(travel_legs)   # see that calculation
      disclosed_gross_cents = gross
      reportable_value_cents = max(0, gross - consideration_paid_cents)
    input_set: "single GiftReport"
    constants: {}
    precision: "whole cents"
    variants:
      - name: REPORTABLE_NET
        when: "used for single-gift and annual-source limit comparisons"
        difference: "subtracts consideration_paid_cents from gross"
      - name: DISCLOSED_GROSS
        when: "used for the public disclosure display value"
        difference: "gross value with no consideration subtracted; differs from NET whenever consideration_paid_cents > 0"

  - name: gift_travel_valuation
    trigger: "GiftReport creation when gift_kind == TRAVEL"
    algorithm: aggregation
    formula: |
      # mode (b): rounding order is pinned — round each leg to whole cents, THEN sum.
      per_leg = []
      for leg in travel_legs:
        raw_leg = leg.nights * leg.nightly_rate_cents + leg.miles * MILEAGE_RATE_CENTS_PER_MILE
        per_leg.append(round_half_up(raw_leg))   # round PER LEG first
      gross = sum(per_leg)                        # then sum the rounded legs
    input_set: "single GiftReport.travel_legs"
    constants:
      MILEAGE_RATE_CENTS_PER_MILE: 65.5
    precision: "round each leg half_up to whole cents, then sum (NOT sum-then-round)"

  - name: outstanding_penalty_ledger
    trigger: "Penalty ASSESSED (add), PAID (subtract), WAIVED (subtract)"
    algorithm: aggregation
    formula: |
      Filer.outstanding_penalty_cents = sum(p.assessed_amount_cents
                                            for p in Penalty
                                            where p.filer_id == Filer.id and p.status == ASSESSED)
    input_set: "Penalty rows of one Filer whose status == ASSESSED (PAID/WAIVED/ACCRUING excluded)"
    constants: {}
    precision: "whole cents"

  - name: gift_annual_aggregate
    trigger: "GiftReport creation (add) and dispose (subtract); read for annual-source limit"
    algorithm: aggregation
    formula: |
      per_source_year_total = sum(g.reportable_value_cents
                                  for g in GiftReport
                                  where g.filer_id == Filer.id
                                    and g.source_name == candidate.source_name
                                    and calendar_year(g.received_at) == calendar_year(candidate.received_at)
                                    and g.status != DISPOSED)
    input_set: "non-DISPOSED GiftReport rows of one Filer, grouped by (source_name, calendar_year(received_at))"
    constants: {}
    precision: "whole cents"

  - name: final_sanction
    trigger: "Investigation OPEN->SUSTAINED"
    algorithm: threshold
    formula: |
      final_sanction_cents = min(Jurisdiction.penalty_cap_cents, recommended_sanction_cents)
    input_set: "single Investigation + owning Jurisdiction.penalty_cap_cents"
    constants: {}
    precision: "whole cents"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "acting role is permitted for this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request body well-formed: required fields present, enum values legal, integers non-negative"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 4
    category: existence
    check: "path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all /{id} endpoints"
  - priority: 5
    category: business_referential
    check: "body foreign keys (jurisdiction_id, filer_id, filing_period_id, statement_id, complaint_id) reference existing rows"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all creates carrying FKs"
  - priority: 6
    category: auth
    check: "for entity_backed Filer actions, X-User-ID equals the owning Filer.id of the target resource"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Filer-owned mutations (statement submit, gift dispose, recusal resolve, penalty pay, training complete)"
  - priority: 7
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 8
    category: business_safety
    check: "segregation of duties: adjudicator X-User-ID differs from Investigation.assigned_investigator_id"
    error_id: ERR_SOD_CONFLICT
    http_status: 409
    applies_to: "POST /investigations/{id}/adjudicate"
  - priority: 9
    category: business_safety
    check: "acting Filer.training_status == CURRENT (compliance gate) for statement submit and gift reporting"
    error_id: ERR_TRAINING_NOT_CURRENT
    http_status: 422
    applies_to: "POST /statements/{id}/submit, POST /gift-reports"
  - priority: 10
    category: business_temporal
    check: "new RecusalEntry HALF-OPEN [effective_start, effective_end) does not overlap an existing DECLARED recusal on the same (filer_id, matter_id)"
    error_id: ERR_RECUSAL_OVERLAP
    http_status: 409
    applies_to: "POST /recusals"
  - priority: 11
    category: business_temporal
    check: "new FilingPeriod CLOSED [coverage_start, coverage_end] does not overlap an existing period of the same (jurisdiction_id, statement_type); touching endpoints conflict"
    error_id: ERR_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /filing-periods"
  - priority: 12
    category: business_constraint
    check: "at most one non-SUPERSEDED Statement per (filer_id, filing_period_id)"
    error_id: ERR_DUPLICATE_STATEMENT
    http_status: 409
    applies_to: "POST /statements"
  - priority: 13
    category: business_constraint
    check: "single-gift NET reportable_value_cents <= Jurisdiction.gift_single_limit_cents"
    error_id: ERR_GIFT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /gift-reports"
  - priority: 14
    category: business_fiscal
    check: "acting Filer.outstanding_penalty_cents <= DELINQUENCY_BLOCK_THRESHOLD_CENTS before accepting a new statement submission"
    error_id: ERR_FILER_DELINQUENT
    http_status: 402
    applies_to: "POST /statements/{id}/submit"
  - priority: 15
    category: business_fiscal
    check: "annual per-source aggregate (existing non-DISPOSED NET + this gift NET) <= Jurisdiction.gift_annual_source_limit_cents"
    error_id: ERR_GIFT_ANNUAL_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /gift-reports"
  - priority: 16
    category: business_constraint
    check: "OCC: expected_statement_version equals current Statement.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /statements/{id}/publish"
  - priority: 17
    category: state
    check: "referenced FilingPeriod.status == OPEN when creating or submitting a statement against it"
    error_id: ERR_PERIOD_CLOSED
    http_status: 409
    applies_to: "POST /statements, POST /statements/{id}/submit"
  - priority: 18
    category: business_constraint
    check: "gift payload shape by kind: GIFT requires fair_market_value_cents > 0; TRAVEL requires a non-empty travel_legs array"
    error_id: ERR_INVALID_GIFT_KIND_PAYLOAD
    http_status: 400
    applies_to: "POST /gift-reports"
  - priority: 19
    category: business_constraint
    check: "list pagination limit within [1,100] and offset >= 0"
    error_id: ERR_PAGINATION_INVALID
    http_status: 400
    applies_to: "all list (GET collection) endpoints"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # ---- Jurisdiction ----
  - method: POST
    path: "/jurisdictions"
    description: "Register a jurisdiction with gift/penalty limits"
    roles: [Registrar]
    code: 201
    input: [name, "gift_single_limit_cents?", "gift_annual_source_limit_cents?", "penalty_base_fee_cents?", "penalty_daily_rate_cents?", "penalty_cap_cents?"]
    output: Jurisdiction
    side_effects: []
  - method: GET
    path: "/jurisdictions/{id}"
    description: "Read a jurisdiction"
    roles: [Registrar, EthicsOfficer, Filer]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []

  # ---- Filer ----
  - method: POST
    path: "/filers"
    description: "Add a public official to the filer registry"
    roles: [Registrar]
    code: 201
    input: [jurisdiction_id, full_name, official_title, filer_category, "email?"]
    output: Filer
    side_effects: []
  - method: GET
    path: "/filers/{id}"
    description: "Read a filer (includes computed compliance_status, outstanding_penalty_cents, reportable_gift_total_cents, open_recusal_count, training_status)"
    roles: [Registrar, EthicsOfficer, Filer, Investigator, Adjudicator]
    code: 200
    input: []
    output: Filer
    side_effects: []
  - method: GET
    path: "/filers"
    description: "List filers; reverse-reachability for Filer.jurisdiction_id"
    roles: [Registrar, EthicsOfficer]
    code: 200
    input: ["jurisdiction_id?", "status?", "limit?", "offset?"]
    output: Filer[]
    side_effects: []
  - method: PATCH
    path: "/filers/{id}/status"
    description: "Change a filer's registry status (ACTIVE/INACTIVE/SEPARATED)"
    roles: [Registrar]
    code: 200
    input: [status]
    output: Filer
    side_effects: []

  # ---- FilingPeriod ----
  - method: POST
    path: "/filing-periods"
    description: "Open a filing period; rejects CLOSED-interval overlap for same jurisdiction+statement_type"
    roles: [Registrar]
    code: 201
    input: [jurisdiction_id, statement_type, coverage_start, coverage_end, due_at, "label?", "status?"]
    output: FilingPeriod
    side_effects: ["overlap check per validations priority 11"]
  - method: GET
    path: "/filing-periods/{id}"
    description: "Read a filing period"
    roles: [Registrar, EthicsOfficer, Filer]
    code: 200
    input: []
    output: FilingPeriod
    side_effects: []
  - method: GET
    path: "/filing-periods"
    description: "List filing periods; reverse-reachability for FilingPeriod.jurisdiction_id"
    roles: [Registrar, EthicsOfficer, Filer]
    code: 200
    input: ["jurisdiction_id?", "statement_type?", "limit?", "offset?"]
    output: FilingPeriod[]
    side_effects: []

  # ---- Statement ----
  - method: POST
    path: "/statements"
    description: "Create a DRAFT statement for a filer/period; enforces one non-SUPERSEDED per (filer, period)"
    roles: [Filer]
    code: 201
    input: [filer_id, filing_period_id, "content?", "supersedes_statement_id?", "redaction_level?"]
    output: Statement
    side_effects: ["copy statement_type from FilingPeriod", "duplicate check per validations priority 12"]
  - method: GET
    path: "/statements/{id}"
    description: "Read a statement (Public sees redacted view when public_status == PUBLISHED)"
    roles: [Registrar, EthicsOfficer, Filer, Public]
    code: 200
    input: []
    output: Statement
    side_effects: []
  - method: GET
    path: "/statements"
    description: "List statements; reverse-reachability for filer_id, filing_period_id, supersedes_statement_id; public=true returns only PUBLISHED"
    roles: [Registrar, EthicsOfficer, Filer, Public]
    code: 200
    input: ["filer_id?", "filing_period_id?", "supersedes_statement_id?", "public?", "status?", "limit?", "offset?"]
    output: Statement[]
    side_effects: []
  - method: POST
    path: "/statements/{id}/submit"
    description: "Submit (or resubmit) a statement; stamps submitted_at, computes lateness, may create a LATE_FILING penalty"
    roles: [Filer]
    code: 200
    input: ["attestation?"]
    output: Statement
    side_effects: ["set submitted_at/due_at_snapshot/is_late/days_late", "create ACCRUING LATE_FILING Penalty if late"]
  - method: POST
    path: "/statements/{id}/accept"
    description: "Accept a submitted statement; finalizes any late penalty and drives the acceptance cascade"
    roles: [EthicsOfficer]
    code: 200
    input: ["review_note?"]
    output: Statement
    side_effects: ["finalize linked LATE_FILING Penalty ACCRUING->ASSESSED", "Filer.outstanding_penalty_cents/compliance_status recompute", "withhold this filer's PUBLISHED statements if newly DELINQUENT"]
  - method: POST
    path: "/statements/{id}/return"
    description: "Return a submitted statement for correction (cyclic revert)"
    roles: [EthicsOfficer]
    code: 200
    input: ["correction_note?"]
    output: Statement
    side_effects: ["increment correction_round"]
  - method: POST
    path: "/statements/{id}/publish"
    description: "Publish an ACCEPTED statement to public disclosure; OCC-guarded on Statement.version"
    roles: [Registrar]
    code: 200
    input: [expected_statement_version, "redaction_level?"]
    output: Statement
    side_effects: ["set public_status=PUBLISHED, published_at", "increments Statement.version by 1"]

  # ---- GiftReport ----
  - method: POST
    path: "/gift-reports"
    description: "Report a gift or travel; computes NET/GROSS, enforces single and annual-source limits, requires training current"
    roles: [Filer]
    code: 201
    input: [filer_id, source_name, gift_kind, received_at, "fair_market_value_cents?", "consideration_paid_cents?", "travel_legs?"]
    output: GiftReport
    side_effects: ["compute reportable_value_cents/disclosed_gross_cents", "add reportable_value_cents to Filer.reportable_gift_total_cents"]
  - method: GET
    path: "/gift-reports/{id}"
    description: "Read a gift report"
    roles: [Registrar, EthicsOfficer, Filer, Public]
    code: 200
    input: []
    output: GiftReport
    side_effects: []
  - method: GET
    path: "/gift-reports"
    description: "List gift reports; reverse-reachability for GiftReport.filer_id"
    roles: [Registrar, EthicsOfficer, Filer, Public]
    code: 200
    input: ["filer_id?", "status?", "limit?", "offset?"]
    output: GiftReport[]
    side_effects: []
  - method: POST
    path: "/gift-reports/{id}/dispose"
    description: "Dispose (return/reimburse) a reported gift; removes it from the annual aggregate"
    roles: [Filer]
    code: 200
    input: ["disposition_method?"]
    output: GiftReport
    side_effects: ["subtract reportable_value_cents from Filer.reportable_gift_total_cents"]

  # ---- RecusalEntry ----
  - method: POST
    path: "/recusals"
    description: "Log a conflict/recusal for a matter; enforces half-open interval non-overlap per (filer, matter)"
    roles: [Filer]
    code: 201
    input: [filer_id, matter_id, effective_start, effective_end, "matter_description?", "reason?"]
    output: RecusalEntry
    side_effects: ["increment Filer.open_recusal_count by 1", "overlap check per validations priority 10"]
  - method: GET
    path: "/recusals/{id}"
    description: "Read a recusal entry"
    roles: [Registrar, EthicsOfficer, Filer, Public]
    code: 200
    input: []
    output: RecusalEntry
    side_effects: []
  - method: GET
    path: "/recusals"
    description: "List recusal entries; reverse-reachability for RecusalEntry.filer_id"
    roles: [Registrar, EthicsOfficer, Filer, Public]
    code: 200
    input: ["filer_id?", "matter_id?", "status?", "limit?", "offset?"]
    output: RecusalEntry[]
    side_effects: []
  - method: POST
    path: "/recusals/{id}/resolve"
    description: "Resolve a recusal entry"
    roles: [Filer]
    code: 200
    input: ["resolution_note?"]
    output: RecusalEntry
    side_effects: ["decrement Filer.open_recusal_count by 1"]

  # ---- Penalty ----
  - method: GET
    path: "/penalties/{id}"
    description: "Read a penalty"
    roles: [Registrar, EthicsOfficer, Filer]
    code: 200
    input: []
    output: Penalty
    side_effects: []
  - method: GET
    path: "/penalties"
    description: "List penalties; reverse-reachability for filer_id, statement_id, investigation_id"
    roles: [Registrar, EthicsOfficer, Filer]
    code: 200
    input: ["filer_id?", "statement_id?", "investigation_id?", "status?", "penalty_type?", "limit?", "offset?"]
    output: Penalty[]
    side_effects: []
  - method: POST
    path: "/penalties/{id}/pay"
    description: "Pay an assessed penalty; decrements outstanding, may restore withheld statements"
    roles: [Filer]
    code: 200
    input: ["payment_ref?"]
    output: Penalty
    side_effects: ["decrement Filer.outstanding_penalty_cents", "recompute compliance_status; restore WITHHELD->PUBLISHED if now COMPLIANT"]
  - method: POST
    path: "/penalties/{id}/waive"
    description: "Waive an assessed penalty"
    roles: [EthicsOfficer]
    code: 200
    input: ["waive_reason?"]
    output: Penalty
    side_effects: ["decrement Filer.outstanding_penalty_cents", "recompute compliance_status"]

  # ---- Complaint ----
  - method: POST
    path: "/complaints"
    description: "File an ethics complaint against a filer, optionally about a specific statement"
    roles: [EthicsOfficer, Public]
    code: 201
    input: [filer_id, allegation, "complainant_ref?", "statement_id?"]
    output: Complaint
    side_effects: []
  - method: GET
    path: "/complaints/{id}"
    description: "Read a complaint"
    roles: [Registrar, EthicsOfficer, Investigator, Adjudicator]
    code: 200
    input: []
    output: Complaint
    side_effects: []
  - method: GET
    path: "/complaints"
    description: "List complaints; reverse-reachability for filer_id, statement_id"
    roles: [Registrar, EthicsOfficer, Investigator, Adjudicator]
    code: 200
    input: ["filer_id?", "statement_id?", "status?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []
  - method: POST
    path: "/complaints/{id}/screen"
    description: "Screen a complaint: advance to SCREENED or DISMISSED"
    roles: [EthicsOfficer]
    code: 200
    input: [decision, "screen_note?"]
    output: Complaint
    side_effects: ["branching fork FILED->SCREENED|DISMISSED"]

  # ---- Investigation ----
  - method: POST
    path: "/complaints/{id}/investigations"
    description: "Open an investigation on a SCREENED complaint; assigned_investigator_id set from X-User-ID"
    roles: [Investigator]
    code: 201
    input: ["scope_note?"]
    output: Investigation
    side_effects: ["copy filer_id from Complaint", "set assigned_investigator_id = X-User-ID"]
  - method: GET
    path: "/investigations/{id}"
    description: "Read an investigation"
    roles: [Registrar, EthicsOfficer, Investigator, Adjudicator]
    code: 200
    input: []
    output: Investigation
    side_effects: []
  - method: GET
    path: "/investigations"
    description: "List investigations; reverse-reachability for complaint_id, filer_id"
    roles: [Registrar, EthicsOfficer, Investigator, Adjudicator]
    code: 200
    input: ["complaint_id?", "filer_id?", "status?", "limit?", "offset?"]
    output: Investigation[]
    side_effects: []
  - method: POST
    path: "/investigations/{id}/adjudicate"
    description: "Adjudicate an OPEN investigation SUSTAINED or NOT_SUSTAINED; SoD-enforced; drives complaint/statement cascade and SANCTION penalty on SUSTAINED"
    roles: [Adjudicator]
    code: 200
    input: [decision, "findings?", "recommended_sanction_cents?"]
    output: Investigation
    side_effects: ["set adjudicator_id = X-User-ID", "cascade per §1.2", "create SANCTION Penalty on SUSTAINED"]
  - method: POST
    path: "/investigations/{id}/reopen"
    description: "Reopen a NOT_SUSTAINED investigation (cyclic); restores complaint to SCREENED"
    roles: [EthicsOfficer]
    code: 200
    input: ["reopen_reason?"]
    output: Investigation
    side_effects: ["Complaint DISMISSED->SCREENED"]

  # ---- TrainingRecord ----
  - method: POST
    path: "/training-records"
    description: "Enroll a filer in an ethics course"
    roles: [Filer]
    code: 201
    input: [filer_id, course_code]
    output: TrainingRecord
    side_effects: ["set enrolled_at = current logical clock"]
  - method: GET
    path: "/training-records/{id}"
    description: "Read a training record"
    roles: [Registrar, EthicsOfficer, Filer]
    code: 200
    input: []
    output: TrainingRecord
    side_effects: []
  - method: GET
    path: "/training-records"
    description: "List training records; reverse-reachability for TrainingRecord.filer_id"
    roles: [Registrar, EthicsOfficer, Filer]
    code: 200
    input: ["filer_id?", "status?", "limit?", "offset?"]
    output: TrainingRecord[]
    side_effects: []
  - method: POST
    path: "/training-records/{id}/complete"
    description: "Mark a training record COMPLETED; sets expiry, mints certificate, refreshes training_status"
    roles: [Filer]
    code: 200
    input: ["score?"]
    output: TrainingRecord
    side_effects: ["set completed_at/expires_at/certificate_no", "Filer.training_status -> CURRENT"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock (test-driving). Startup default is 2026-05-01T00:00:00Z; before any set, the clock reads exactly this default and never falls back to wall-clock time. All lateness/expiry/window rules read this clock."
    roles: [Registrar]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unknown X-User-Role or X-User-ID"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for this endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity_backed Filer acting on a resource it does not own"
  - id: ERR_VALIDATION
    http: 400
    condition: "malformed body: missing required field, illegal enum, negative integer"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path or body-referenced resource does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "resource not in a state from which the requested transition is defined"
  - id: ERR_SOD_CONFLICT
    http: 409
    condition: "adjudicator X-User-ID equals the investigation's assigned_investigator_id"
  - id: ERR_TRAINING_NOT_CURRENT
    http: 422
    condition: "acting Filer.training_status != CURRENT on statement submit or gift report"
  - id: ERR_RECUSAL_OVERLAP
    http: 409
    condition: "new recusal half-open interval overlaps an existing DECLARED recusal for the same (filer, matter)"
  - id: ERR_PERIOD_OVERLAP
    http: 409
    condition: "new filing period closed interval overlaps an existing period of the same jurisdiction+statement_type"
  - id: ERR_DUPLICATE_STATEMENT
    http: 409
    condition: "a non-SUPERSEDED statement already exists for the (filer, period)"
  - id: ERR_GIFT_LIMIT_EXCEEDED
    http: 422
    condition: "single-gift NET reportable value exceeds the jurisdiction single-gift limit"
  - id: ERR_FILER_DELINQUENT
    http: 402
    condition: "filer outstanding penalty exceeds the delinquency block threshold on submit"
  - id: ERR_GIFT_ANNUAL_LIMIT_EXCEEDED
    http: 422
    condition: "annual per-source NET aggregate would exceed the jurisdiction annual-source limit"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_statement_version does not match current Statement.version on publish"
  - id: ERR_PERIOD_CLOSED
    http: 409
    condition: "statement create/submit against a FilingPeriod whose status == CLOSED"
  - id: ERR_INVALID_GIFT_KIND_PAYLOAD
    http: 400
    condition: "gift_kind GIFT missing fair_market_value_cents, or gift_kind TRAVEL missing/empty travel_legs"
  - id: ERR_PAGINATION_INVALID
    http: 400
    condition: "limit or offset outside allowed bounds"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: Registrar
    description: "Administers jurisdictions, filer registry, filing periods, and public disclosure publishing"
    identity: opaque
    exclusive_operations:
      - "POST /jurisdictions"
      - "POST /filers"
      - "PATCH /filers/{id}/status"
      - "POST /filing-periods"
      - "POST /statements/{id}/publish"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across jurisdictions/filers/filing-periods/statements/gift-reports/recusals/penalties"
  - name: Filer
    description: "Public official; files own statements, gift reports, recusals, training; pays own penalties"
    identity: "entity_backed:Filer"
    exclusive_operations:
      - "POST /statements"
      - "POST /statements/{id}/submit"
      - "POST /gift-reports"
      - "POST /gift-reports/{id}/dispose"
      - "POST /recusals"
      - "POST /recusals/{id}/resolve"
      - "POST /penalties/{id}/pay"
      - "POST /training-records"
      - "POST /training-records/{id}/complete"
    shared_operations:
      - "GET own filer/statements/gift-reports/recusals/penalties/training-records"
  - name: EthicsOfficer
    description: "Reviews and accepts/returns statements, screens complaints, waives penalties, reopens investigations"
    identity: opaque
    exclusive_operations:
      - "POST /statements/{id}/accept"
      - "POST /statements/{id}/return"
      - "POST /penalties/{id}/waive"
      - "POST /complaints/{id}/screen"
      - "POST /investigations/{id}/reopen"
    shared_operations:
      - "POST /complaints (shared with Public)"
      - "GET reads across filers/statements/complaints/investigations/penalties"
  - name: Investigator
    description: "Opens and conducts investigations on screened complaints; cannot adjudicate own case (SoD)"
    identity: opaque
    exclusive_operations:
      - "POST /complaints/{id}/investigations"
    shared_operations:
      - "GET complaints/investigations/filers"
  - name: Adjudicator
    description: "Adjudicates investigations; must not be the assigned investigator of the same case (SoD)"
    identity: opaque
    exclusive_operations:
      - "POST /investigations/{id}/adjudicate"
    shared_operations:
      - "GET complaints/investigations/filers"
  - name: Public
    description: "Unauthenticated-tier reader of published disclosures and public gift/recusal records"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /complaints (shared with EthicsOfficer)"
      - "GET published statements/gift-reports/recusals"
