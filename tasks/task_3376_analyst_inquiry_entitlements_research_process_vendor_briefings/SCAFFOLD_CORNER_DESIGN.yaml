            - "ConferenceEvent.${ev_id}.sponsor_session_minutes == 20"
            - "ConferenceEvent.${ev_id}.sponsor_minute_share == 0.25"
            - "ConferenceEvent.${ev_id}.status == PROGRAMMING"
            - "ConferenceEvent.${ev_id}.sessions has exactly 3 rows"

      - name: sponsorship_create_leaves_event_revenue_untouched_until_activation
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/research/sponsorships
          - entities.Sponsorship.fields.sponsor_slot_counted
          - entities.ConferenceEvent.fields.sponsorship_revenue_cents
        distinguishing_aspect: "Selling a package is not revenue: the create leaves the event's sponsorship_revenue_cents at 0 with the package PENDING and sponsor_slot_counted false, while still advancing the event's version for the concurrency guard."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One DRAFT event and one ACTIVE vendor."
          setup_api_calls:
            - *c_clock
            - *c_ven1
            - call: "POST /research/conference-events"
              payload: { event_name: "Symposium 2026", venue_region: "NA", start_utc: "2026-10-20T09:00:00Z", end_utc: "2026-10-22T17:00:00Z" }
              as: EventProgrammer
              captures: { ev_id: $.data.id, ev_v: $.data.version }
          trigger:
            - call: "POST /research/sponsorships"
              payload: { conference_event_id: "${ev_id}", vendor_id: "${ven1_id}", tier: "PLATINUM", amount_cents: 9000000, exclusivity_start_utc: "2026-10-01T00:00:00Z", exclusivity_end_utc: "2026-10-05T00:00:00Z", expected_conference_event_version: "${ev_v}" }
              as: SalesRep
              captures: { sp_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Sponsorship.${sp_id}.status == PENDING and sponsor_slot_counted == false"
            - "Sponsorship.${sp_id}.activated_at is null and cancelled_at is null"
            - "ConferenceEvent.${ev_id}.sponsorship_revenue_cents == 0"
            - "ConferenceEvent.${ev_id}.version == 2"

  # ===========================================================================
  - section: errors
    instances:

      - name: appeal_after_the_window_returns_appeal_window_closed
        claim_type: Violation → Error
        grounds:
          - errors.ERR_APPEAL_WINDOW_CLOSED
          - entities.VendorInclusion.fields.appeal_window_closes_at
        distinguishing_aspect: "appeal_window_closes_at is published_at + 30 days; a filing on 2026-10-02 against a window that closed 2026-10-01T00:00:00Z is refused and leaves appeal_count at 0."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Published document with one INCLUDED vendor and one EXCLUDED vendor; clock then advanced to 2026-10-02T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_an1
            - *c_an2
            - *c_ven1
