  - rule_id: compensating_invariant
    instances:
      - name: agreement_ledger_pay_then_equal_refund_conserves_outstanding
        grounds:
          - entities.CooperativeAgreement.fields.outstanding_balance_cents
          - calculations.cost_share_assessment
          - validations[priority=22]
        distinguishing_aspect: |
          Conserved quantity (fiscal cents): outstanding_balance_cents ==
          assessed_total_cents - paid_total_cents + refunded_total_cents. A
          PAYMENT of 3004 followed by a REFUND of 3004 leaves
          outstanding_balance_cents exactly at its pre-payment value 3004.
        test_recipe:
          setup:
            - "One awarded ACTIVE CooperativeAgreement with two period assessments of 1502 each (assessed_total 3004, outstanding 3004)."
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "South Pasture", habitat_type: "GRASSLAND", acreage: 3000 }
              as: RefugeManager
              captures: { u1: $.data.id }
            - call: "POST /refuge/determinations"
              payload: { use_type: "GRAZING", title: "Grazing compatibility", comment_open_date: "2026-09-05", comment_close_date: "2026-09-20" }
              as: PermitOfficer
              captures: { dg: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${dg}/open-comment"
              payload: {}
              as: PermitOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${dg}/finalize"
              payload: { finding: "COMPATIBLE", rationale: "ok" }
              as: PermitOfficer
            - call: "POST /refuge/management-units/${u1}/grazing-offerings"
              payload: { description: "Winter grazing", aum_cap: 100, grazing_window_start: "2026-11-01", grazing_window_end: "2027-02-28", application_deadline: "2026-10-01", min_stewardship_rating: 5 }
              as: Biologist
              captures: { off1: $.data.id }
            - call: "POST /refuge/grazing-offerings/${off1}/bids"
              payload: { cooperator_ref: "coop-1", rate_cents_per_aum: 2000, stewardship_rating: 7 }
              as: Cooperator
              as_user_id: "coop-1"
              captures: { b1: $.data.id }
            - call: "POST /refuge/grazing-offerings/${off1}/close-and-select"
              payload: {}
              as: RefugeManager
            - call: "GET /refuge/cooperative-agreements"
              payload: { winning_bid_id: "${b1}" }
              as: RefugeManager
              captures: { ag1: "$.data[0].id", ag_v: "$.data[0].version" }
            - call: "POST /refuge/cooperative-agreements/${ag1}/assess"
              payload: { period_key: "2026-11", aum_used: 3, rate_cents_per_aum: 1001, expected_agreement_version: "${ag_v}" }
              as: Biologist
              captures: { ag_v2: $.data.version }
            - call: "POST /refuge/cooperative-agreements/${ag1}/assess"
              payload: { period_key: "2026-12", aum_used: 3, rate_cents_per_aum: 1001, expected_agreement_version: "${ag_v2}" }
              as: Biologist
              captures: { outst_pre: $.data.outstanding_balance_cents }
          trigger:
            - call: "POST /refuge/cooperative-agreements/${ag1}/ledger-entries"
              payload: { type: "PAYMENT", amount_cents: 3004 }
              as: Cooperator
              as_user_id: "coop-1"
              captures: { outst_paid: $.data.outstanding_balance_cents }
            - call: "POST /refuge/cooperative-agreements/${ag1}/ledger-entries"
              payload: { type: "REFUND", amount_cents: 3004 }
              as: RefugeManager
              captures: { outst_ref: $.data.outstanding_balance_cents, assessed: $.data.assessed_total_cents, paid: $.data.paid_total_cents, refunded: $.data.refunded_total_cents }
          assert:
            - "after two assessments: outstanding_balance_cents == 3004"
            - "after PAYMENT 3004: outstanding_balance_cents == 0"
            - "after REFUND 3004: outstanding_balance_cents == 3004 (compensating pair conserves the pre-payment value)"
            - "totals reconcile: assessed_total_cents == 3004, paid_total_cents == 3004, refunded_total_cents == 3004"
      - name: unit_visitor_days_suspend_reinstate_conserves_count
        grounds:
          - entities.ManagementUnit.fields.committed_visitor_days
          - calculations.committed_visitor_days
          - state_machines.PermitApplication.ACTIVE_to_SUSPENDED
          - state_machines.PermitApplication.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Conserved quantity (visitor-day count, not money): activating a
          FULL closure suspends the ACTIVE permit and releases its 15
          visitor-days; lifting the same closure reinstates the permit and
          re-adds exactly 15 — the unit's committed_visitor_days returns to
          its pre-closure value with no drift.
        test_recipe:
          setup:
            - "One unit; one ACTIVE RESEARCH permit crew 5, 2026-10-10..2026-10-12 (3 days => 15 committed visitor-days); one SCHEDULED MIGRATION FULL closure 2026-10-09..2026-10-20."
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "North Marsh", habitat_type: "WETLAND", acreage: 1200 }
              as: RefugeManager
              captures: { u1: $.data.id }
            - call: "POST /refuge/determinations"
              payload: { use_type: "RESEARCH", title: "Research use", comment_open_date: "2026-09-05", comment_close_date: "2026-09-20" }
              as: PermitOfficer
              captures: { d1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${d1}/open-comment"
              payload: {}
              as: PermitOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${d1}/finalize"
              payload: { finding: "COMPATIBLE", rationale: "ok" }
              as: PermitOfficer
            - call: "POST /refuge/permits"
              payload: { applicant_ref: "app-1", management_unit_id: "${u1}", determination_id: "${d1}", use_type: "RESEARCH", crew_size: 5, start_date: "2026-10-10", end_date: "2026-10-12" }
              as: PermitApplicant
              as_user_id: "app-1"
              captures: { p1: $.data.id }
            - call: "POST /refuge/permits/${p1}/return-for-revision"
              payload: { note: "n" }
              as: PermitOfficer
            - call: "POST /refuge/permits/${p1}/resubmit"
              payload: {}
              as: PermitApplicant
              as_user_id: "app-1"
            - call: "POST /refuge/permits/${p1}/approve"
              payload: {}
              as: PermitOfficer
            - call: "POST /refuge/permits/${p1}/pay"
              payload: { amount_cents: 21000 }
              as: PermitApplicant
              as_user_id: "app-1"
            - call: "POST /refuge/management-units/${u1}/closures"
              payload: { closure_type: "MIGRATION", scope: "FULL", start_date: "2026-10-09", end_date: "2026-10-20" }
              as: Biologist
              captures: { cl1: $.data.id }
          trigger:
            - call: "GET /refuge/management-units/${u1}/posture"
              as: Biologist
              captures: { days_pre: $.data.committed_visitor_days }
            - call: "POST /refuge/closures/${cl1}/activate"
              payload: {}
              as: Biologist
            - call: "GET /refuge/permits/${p1}"
              as: PermitOfficer
              captures: { p_st_mid: $.data.status }
            - call: "GET /refuge/management-units/${u1}/posture"
              as: Biologist
              captures: { days_mid: $.data.committed_visitor_days }
            - call: "POST /refuge/closures/${cl1}/lift"
              payload: {}
              as: Biologist
            - call: "GET /refuge/permits/${p1}"
              as: PermitOfficer
              captures: { p_st_post: $.data.status }
            - call: "GET /refuge/management-units/${u1}/posture"
              as: Biologist
              captures: { days_post: $.data.committed_visitor_days }
          assert:
            - "pre-closure committed_visitor_days == 15 (crew 5 x 3 days)"
            - "after closure activate: permit status == SUSPENDED and committed_visitor_days == 0"
            - "after closure lift: permit status == ACTIVE (end_date 2026-10-12 >= clock date 2026-09-21)"
            - "post-lift committed_visitor_days == 15 (suspend + reinstate conserves the count exactly)"
