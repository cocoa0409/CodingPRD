          Only IndependentAuditor may decide a draft tally, and the decision is the sole writer of the
          ROSTER_BASED figures: certifying moves tally_status to AUDIT_CERTIFIED, computes
          threshold_votes_final from credentialed_roster_at_close (ceil(2 * 0.75) = 2), resolves the
          slot to ELECTED and stamps the outcome. The administrator's provisional figure is left in
          place beside it.
