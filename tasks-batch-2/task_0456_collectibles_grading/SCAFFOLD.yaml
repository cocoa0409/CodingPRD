scenario: "Collectibles Grading & Authentication (PSA/CGC style): submission & service level (turnaround tier), item intake & tracking, grading (centering/corners/edges/surface), authentication & encapsulation (slab), label & population report, declared value/insurance, crack-and-regrade, return shipment"

domain_name: collectibles-grading
api_prefix: ""

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects        # submission posture re-derived from item states; tier fee waterfall
    - dual_variant_calculation      # estimate-at-intake vs final-at-grade insurance fee; provisional vs final overall grade
    - rate_threshold_triggers       # declared-value tier caps, authentic-grade boundary, turnaround SLA boundary
    - optimistic_concurrency        # crack-and-regrade supersede race on a Slab's parent SubmissionItem

  entity_topology: hybrid
  # Submission -> SubmissionItem hierarchy (tree); GradeAssessment / AuthenticationCheck /
  # Slab / Label / RegradeRequest hang off SubmissionItem via FK; PopulationReport &
  # ServiceLevel & GradingStandard are flat config peers referenced by FK.

  state_machine_shape: compound
  # Submission posture = f(child SubmissionItem states). SubmissionItem has a cyclic
  # crack-and-regrade loop (ENCAPSULATED -> CRACK_PENDING -> GRADING). Shipment is linear.

  relationship_patterns:
    - one_to_many        # Submission 1:N SubmissionItem; SubmissionItem 1:N RegradeRequest
    - cross_aggregate    # GradeAssessment references GradingStandard (config); Label references PopulationReport
    - polymorphic        # n/a kept minimal

  role_model: peer_roles
  # Customer owns submissions; Receiver does intake; Grader grades; Authenticator authenticates
  # & encapsulates; LabAdmin configures service levels/standards & runs population sweeps.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Login/identity email; unique across customers."
        constraints: "unique; non-empty"
      - name: full_name
        type: string
        source: input
        description: "Customer display name."
      - name: store_credit_cents
        type: integer
        source: system
        description: "Wallet balance in cents; credited on insurance payouts and fee refunds."
        default: 0
        constraints: ">= 0"

  - name: ServiceLevel
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Short code, e.g. ECONOMY, REGULAR, EXPRESS, WALKTHROUGH; unique."
        constraints: "unique; non-empty"
      - name: turnaround_business_days
        type: integer
        source: input
        description: "SLA promised turnaround in business days."
        constraints: ">= 1"
      - name: base_fee_cents
        type: integer
        source: input
        description: "Per-item base grading fee in cents for this tier."
        constraints: ">= 0"
      - name: max_declared_value_cents
        type: integer
        source: input
        description: "Inclusive upper cap on per-item declared value permitted at this tier."
        constraints: ">= 1"
      - name: insurance_rate_bps
        type: integer
        source: input
        description: "Insurance fee rate in basis points applied to declared value (1 bp = 0.01%)."
        constraints: ">= 0"
      - name: active
        type: boolean
        source: input
        description: "Whether new submissions may select this tier."
        default: true

  - name: GradingStandard
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Standard code, e.g. CARD_10PT, COMIC_10PT; unique."
        constraints: "unique; non-empty"
      - name: max_grade
        type: number
        source: input
        description: "Top of the grade scale, e.g. 10.0."
        constraints: "> 0"
      - name: authentic_min_grade
        type: number
        source: input
        description: "Inclusive minimum overall grade at which an item is deemed gradeable-authentic (below this -> AUTHENTIC_ONLY label, no numeric grade)."
        constraints: "> 0; <= max_grade"
      - name: centering_weight_bps
        type: integer
        source: input
        description: "Weight (basis points, of 10000) of the centering subgrade in the weighted overall."
        constraints: ">= 0"
      - name: corners_weight_bps
        type: integer
        source: input
        description: "Weight (bps of 10000) of the corners subgrade."
        constraints: ">= 0"
      - name: edges_weight_bps
        type: integer
        source: input
        description: "Weight (bps of 10000) of the edges subgrade."
        constraints: ">= 0"
      - name: surface_weight_bps
        type: integer
        source: input
        description: "Weight (bps of 10000) of the surface subgrade; the four weights MUST sum to 10000."
        constraints: ">= 0; centering+corners+edges+surface == 10000"

  - name: Submission
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the submitter who owns this submission."
      - name: service_level_id
        type: string
        source: input
        description: "FK -> ServiceLevel.id; the turnaround tier chosen for all items in this submission."
      - name: status
        type: enum
        source: computed
        description: "Submission posture derived from child SubmissionItem states. See §1.2 Submission machine."
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, RECEIVING, IN_GRADING, READY_TO_SHIP, SHIPPED, CLOSED"
      - name: item_count
        type: integer
        source: computed
        description: "Count of SubmissionItem children; recomputed on add/remove."
        default: 0
      - name: total_estimated_fee_cents
        type: integer
        source: computed
        description: "Sum of per-item estimated total fees at submit time; see calc estimate_submission_fee."
        default: 0
      - name: total_final_fee_cents
        type: integer
        source: computed
        description: "Sum of per-item final fees at ship time; see calc finalize_submission_fee."
        default: 0

  - name: SubmissionItem
    parent: Submission
    common_fields: true
    fields:
      - name: submission_id
        type: string
        source: input
        description: "FK -> Submission.id; parent batch."
      - name: grading_standard_id
        type: string
        source: input
        description: "FK -> GradingStandard.id; scale used to grade this item."
      - name: title
        type: string
        source: input
        description: "Human description, e.g. '1986 Fleer Jordan #57'."
      - name: declared_value_cents
        type: integer
        source: input
        description: "Customer-declared item value in cents; drives insurance fee and tier cap check."
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: "Item lifecycle state. See §1.2 SubmissionItem machine (cyclic via crack-and-regrade)."
        default: REGISTERED
        constraints: "one of REGISTERED, INTAKE_LOGGED, GRADING, AUTHENTICATED, ENCAPSULATED, CRACK_PENDING, REJECTED_RETURNED, SHIPPED"
      - name: estimated_fee_cents
        type: integer
        source: computed
        description: "Per-item estimate (base + estimated insurance) pinned at submit; see calc estimate_item_fee."
        default: 0
      - name: final_fee_cents
        type: integer
        source: computed
        description: "Per-item final fee (base + final insurance + regrade surcharge); see calc finalize_item_fee."
        default: 0
      - name: regrade_count
        type: integer
        source: system
        description: "Number of completed crack-and-regrade cycles on this item."
        default: 0
      - name: current_grade
        type: number
        source: computed
        description: "Latest finalized overall grade from the active GradeAssessment; null until first grade finalized."
        default: null

  - name: IntakeRecord
    parent: SubmissionItem
    common_fields: true
    fields:
      - name: item_id
        type: string
        source: input
        description: "FK -> SubmissionItem.id; the item received."
      - name: received_by_user_id
        type: string
        source: system
        description: "Opaque Receiver operator id who logged intake (from X-User-ID)."
      - name: condition_note
        type: string
        source: input
        description: "Free-text intake condition note."
      - name: matches_declaration
        type: boolean
        source: input
        description: "Whether the received item matches the customer's declared title/value."
      - name: received_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when intake was logged (sets the SLA window start)."

  - name: GradeAssessment
    parent: SubmissionItem
    common_fields: true
    fields:
      - name: item_id
        type: string
        source: input
        description: "FK -> SubmissionItem.id; the item being graded."
      - name: grading_standard_id
        type: string
        source: input
        description: "FK -> GradingStandard.id; pinned (version-snapshot) standard used for this assessment."
      - name: centering_subgrade
        type: number
        source: input
        description: "Centering subgrade on the standard's scale."
        constraints: "0 <= x <= GradingStandard.max_grade"
      - name: corners_subgrade
        type: number
        source: input
        description: "Corners subgrade."
        constraints: "0 <= x <= GradingStandard.max_grade"
      - name: edges_subgrade
        type: number
        source: input
        description: "Edges subgrade."
        constraints: "0 <= x <= GradingStandard.max_grade"
      - name: surface_subgrade
        type: number
        source: input
        description: "Surface subgrade."
        constraints: "0 <= x <= GradingStandard.max_grade"
      - name: provisional_overall
        type: number
        source: computed
        description: "Weighted-then-floored provisional overall at assessment create; see calc provisional_overall_grade."
        default: null
      - name: final_overall
        type: number
        source: computed
        description: "Finalized overall (lowest-subgrade cap applied) at finalize; see calc final_overall_grade."
        default: null
      - name: superseded
        type: boolean
        source: system
        description: "True once a later regrade assessment replaces this one as the item's active grade."
        default: false

  - name: AuthenticationCheck
    parent: SubmissionItem
    common_fields: true
    fields:
      - name: item_id
        type: string
        source: input
        description: "FK -> SubmissionItem.id; the item authenticated."
      - name: authenticator_user_id
        type: string
        source: system
        description: "Opaque Authenticator operator id who ran the check (from X-User-ID)."
      - name: verdict
        type: enum
        source: input
        description: "Authentication outcome."
        constraints: "one of GENUINE, ALTERED, COUNTERFEIT"
      - name: alteration_note
        type: string
        source: input
        description: "Required note when verdict is ALTERED or COUNTERFEIT; optional when GENUINE."
        default: null

  - name: Slab
    parent: SubmissionItem
    common_fields: true
    fields:
      - name: item_id
        type: string
        source: input
        description: "FK -> SubmissionItem.id; the encapsulated item (active, non-superseded slab)."
      - name: cert_number
        type: string
        source: system
        description: "Server-minted globally-unique certificate number printed on the slab; never reused."
        constraints: "unique"
      - name: assessment_id
        type: string
        source: input
        description: "FK -> GradeAssessment.id; the finalized assessment encapsulated by this slab."
      - name: label_grade_text
        type: string
        source: computed
        description: "Grade text on the label: numeric (e.g. '9.5') if authentic-gradeable, else 'AUTHENTIC' or 'NOT GENUINE'."
        default: null
      - name: active
        type: boolean
        source: system
        description: "False once the slab is cracked in a regrade cycle."
        default: true

  - name: Label
    parent: Slab
    common_fields: false
    fields:
      - name: slab_id
        type: string
        source: input
        description: "FK -> Slab.id; the slab this label is printed for."
      - name: population_report_id
        type: string
        source: input
        description: "FK -> PopulationReport.id; the pop bucket (standard+title+grade) printed on the label."
      - name: printed_pop_count
        type: integer
        source: computed
        description: "Population count snapshot at print time (immutable thereafter)."
      - name: printed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp at label print."

  - name: PopulationReport
    parent: null
    common_fields: true
    fields:
      - name: grading_standard_id
        type: string
        source: input
        description: "FK -> GradingStandard.id; scale for this pop bucket."
      - name: title_key
        type: string
        source: input
        description: "Normalized title key identifying the collectible variety (e.g. '1986-FLEER-JORDAN-57')."
        constraints: "unique together with (grading_standard_id, grade_value)"
      - name: grade_value
        type: number
        source: input
        description: "The discrete grade this bucket counts (e.g. 9.5), or -1 for the AUTHENTIC-only bucket."
      - name: pop_count
        type: integer
        source: computed
        description: "Number of active (non-cracked) slabs in this bucket; bumped on encapsulate, decremented on crack."
        default: 0

  - name: InsurancePolicy
    parent: Submission
    common_fields: true
    fields:
      - name: submission_id
        type: string
        source: input
        description: "FK -> Submission.id; the submission insured in transit."
      - name: covered_value_cents
        type: integer
        source: computed
        description: "Sum of insured per-item declared values capped at each item's tier max; see calc covered_value."
        default: 0
      - name: premium_cents
        type: integer
        source: computed
        description: "Total insurance premium charged; see calc covered_value variants."
        default: 0
      - name: claim_status
        type: enum
        source: computed
        description: "Insurance claim posture."
        default: NONE
        constraints: "one of NONE, FILED, PAID"
      - name: payout_cents
        type: integer
        source: computed
        description: "Amount paid out on an approved loss claim; <= covered_value_cents."
        default: 0

  - name: RegradeRequest
    parent: SubmissionItem
    common_fields: true
    fields:
      - name: item_id
        type: string
        source: input
        description: "FK -> SubmissionItem.id; the encapsulated item to crack and regrade."
      - name: prior_slab_id
        type: string
        source: input
        description: "FK -> Slab.id; the slab to be cracked (must be the item's active slab)."
      - name: expected_item_version
        type: integer
        source: input
        description: "OCC token: the SubmissionItem.version the client last observed; rejected if stale."
      - name: reason
        type: string
        source: input
        description: "Why the customer requests a regrade (e.g. 'believe undergraded')."
      - name: status
        type: enum
        source: computed
        description: "Regrade request lifecycle."
        default: OPEN
        constraints: "one of OPEN, CRACKED, COMPLETED"

  - name: Shipment
    parent: Submission
    common_fields: true
    fields:
      - name: submission_id
        type: string
        source: input
        description: "FK -> Submission.id; the submission being returned."
      - name: carrier
        type: enum
        source: input
        description: "Return carrier."
        constraints: "one of UPS, FEDEX, USPS"
      - name: tracking_number
        type: string
        source: input
        description: "Carrier tracking number."
      - name: insured_value_cents
        type: integer
        source: computed
        description: "Total declared value of items in this shipment (copied from InsurancePolicy.covered_value_cents)."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Shipment lifecycle (linear)."
        default: LABEL_CREATED
        constraints: "one of LABEL_CREATED, IN_TRANSIT, DELIVERED, LOST"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- SubmissionItem: cyclic crack-and-regrade core machine ----
  - entity: SubmissionItem
    initial_state: REGISTERED
    terminal_states: [REJECTED_RETURNED, SHIPPED]
    transitions:
      - from: REGISTERED
        to: INTAKE_LOGGED
        trigger: "POST /submission-items/{id}/intake"
        actor: Receiver
        preconditions:
          - "parent Submission.status IN {SUBMITTED, RECEIVING}"
          - "no existing IntakeRecord for this item"
        side_effects:
          - "create IntakeRecord with received_at = current logical clock"
          - "set IntakeRecord.received_at as the SLA window start for this item"
          - "bubble-up: recompute parent Submission.status (-> RECEIVING if first item logged, else unchanged)"
      - from: INTAKE_LOGGED
        to: REJECTED_RETURNED
        trigger: "POST /submission-items/{id}/reject"
        actor: Receiver
        preconditions:
          - "IntakeRecord.matches_declaration == false"
        side_effects:
          - "item excluded from grading and from insurance covered_value"
          - "bubble-up: recompute parent Submission.status"
          - "this item becomes eligible for return shipment with no slab"
      - from: INTAKE_LOGGED
        to: GRADING
        trigger: "POST /submission-items/{id}/grade-assessments"
        actor: Grader
        preconditions:
          - "IntakeRecord exists and matches_declaration == true"
        side_effects:
          - "create GradeAssessment; compute provisional_overall (calc provisional_overall_grade)"
          - "bubble-up: parent Submission.status -> IN_GRADING when first item enters GRADING"
      - from: GRADING
        to: AUTHENTICATED
        trigger: "POST /submission-items/{id}/authentication"
        actor: Authenticator
        preconditions:
          - "an unsuperseded GradeAssessment exists for this item"
          - "GradeAssessment.final_overall is finalized (non-null)"
        side_effects:
          - "create AuthenticationCheck with verdict"
          - "if verdict in {ALTERED, COUNTERFEIT}: item is non-encapsulatable as graded (label will read 'NOT GENUINE')"
      - from: AUTHENTICATED
        to: ENCAPSULATED
        trigger: "POST /submission-items/{id}/encapsulate"
        actor: Authenticator
        preconditions:
          - "AuthenticationCheck exists for this item"
          - "no active (active==true) Slab already exists for this item"
        side_effects:
          - "create Slab with server-minted unique cert_number; set Slab.active=true"
          - "compute Slab.label_grade_text (calc label_grade_text)"
          - "cross-entity: PopulationReport bucket for (standard,title_key,grade_value) created if absent, pop_count += 1 (calc population_bump)"
          - "ledger sync: finalize item final_fee_cents (calc finalize_item_fee) and add to Submission.total_final_fee_cents"
          - "bubble-up: recompute Submission.status -> READY_TO_SHIP when all non-rejected items ENCAPSULATED"
      - from: ENCAPSULATED
        to: CRACK_PENDING
        trigger: "POST /submission-items/{id}/regrade-requests"
        actor: Customer
        preconditions:
          - "item has an active Slab"
          - "RegradeRequest.expected_item_version == SubmissionItem.version (OCC)"
          - "parent Submission.status != SHIPPED"
        side_effects:
          - "create RegradeRequest status=OPEN"
          - "mark prior Slab active=false (cracked); set RegradeRequest.status=CRACKED"
          - "cross-entity cascade: PopulationReport bucket pop_count -= 1 for the cracked slab's bucket (calc population_decrement)"
          - "cascade: mark the prior active GradeAssessment.superseded=true"
          - "increment SubmissionItem.version by 1"
          - "bubble-up: recompute Submission.status -> IN_GRADING (item back in pipeline)"
        note: "Cyclic edge — item returns to grading after a completed regrade."
      - from: CRACK_PENDING
        to: GRADING
        trigger: "POST /submission-items/{id}/grade-assessments"
        actor: Grader
        preconditions:
          - "item has an OPEN/CRACKED RegradeRequest"
          - "prior Slab.active == false"
        side_effects:
          - "create new GradeAssessment (provisional_overall computed)"
          - "set RegradeRequest.status=COMPLETED; increment SubmissionItem.regrade_count by 1"
        note: "Re-entry into the grading loop; the same GRADING->AUTHENTICATED->ENCAPSULATED edges then re-run."
      - from: ENCAPSULATED
        to: SHIPPED
        trigger: "POST /shipments/{id}/dispatch (covers item)"
        actor: LabAdmin
        preconditions:
          - "parent Submission.status == READY_TO_SHIP"
          - "Shipment covers this item"
        side_effects:
          - "item status -> SHIPPED (terminal)"
      - from: REJECTED_RETURNED
        to: SHIPPED
        trigger: "POST /shipments/{id}/dispatch (covers item)"
        actor: LabAdmin
        preconditions:
          - "parent Submission.status == READY_TO_SHIP"
        side_effects:
          - "rejected item returned in the same shipment; status -> SHIPPED"

  # ---- Submission: compound posture derived from child item states ----
  - entity: Submission
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /submissions/{id}/submit"
        actor: Customer
        preconditions:
          - "item_count >= 1"
          - "every SubmissionItem.declared_value_cents <= ServiceLevel.max_declared_value_cents"
        side_effects:
          - "freeze item set (no add/remove after submit)"
          - "compute total_estimated_fee_cents (calc estimate_submission_fee)"
          - "create InsurancePolicy; compute covered_value_cents & premium_cents (calc covered_value)"
      - from: SUBMITTED
        to: RECEIVING
        trigger: "system: first SubmissionItem intake logged"
        actor: system
        preconditions: ["at least one child item INTAKE_LOGGED"]
        side_effects: ["posture reflects partial intake"]
      - from: RECEIVING
        to: IN_GRADING
        trigger: "system: first SubmissionItem enters GRADING"
        actor: system
        preconditions: ["at least one child item in {GRADING, AUTHENTICATED, ENCAPSULATED}"]
        side_effects: ["posture reflects active grading"]
      - from: IN_GRADING
        to: READY_TO_SHIP
        trigger: "system: all non-rejected items ENCAPSULATED and no open RegradeRequest"
        actor: system
        preconditions:
          - "every SubmissionItem is in {ENCAPSULATED, REJECTED_RETURNED}"
          - "no RegradeRequest in {OPEN, CRACKED}"
        side_effects:
          - "compute total_final_fee_cents (calc finalize_submission_fee)"
      - from: READY_TO_SHIP
        to: SHIPPED
        trigger: "POST /shipments/{id}/dispatch"
        actor: LabAdmin
        preconditions: ["a Shipment exists for this submission"]
        side_effects:
          - "all items -> SHIPPED; Shipment.status -> IN_TRANSIT"
      - from: SHIPPED
        to: CLOSED
        trigger: "POST /shipments/{id}/deliver"
        actor: LabAdmin
        preconditions: ["Shipment.status == DELIVERED"]
        side_effects: ["submission archived; no further mutations"]

  # ---- Shipment: linear, with a branch to LOST that triggers an insurance claim ----
  - entity: Shipment
    initial_state: LABEL_CREATED
    terminal_states: [DELIVERED, LOST]
    transitions:
      - from: LABEL_CREATED
        to: IN_TRANSIT
        trigger: "POST /shipments/{id}/dispatch"
        actor: LabAdmin
        preconditions:
          - "parent Submission.status == READY_TO_SHIP"
        side_effects:
          - "Submission.status -> SHIPPED; all covered items -> SHIPPED"
          - "copy insured_value_cents from InsurancePolicy.covered_value_cents"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /shipments/{id}/deliver"
        actor: LabAdmin
        preconditions: ["shipment IN_TRANSIT"]
        side_effects:
          - "Submission becomes CLOSED-eligible"
      - from: IN_TRANSIT
        to: LOST
        trigger: "POST /shipments/{id}/report-lost"
        actor: LabAdmin
        preconditions: ["shipment IN_TRANSIT"]
        side_effects:
          - "compensation cascade: InsurancePolicy.claim_status -> FILED"
          - "compute payout_cents = covered_value_cents (calc insurance_payout)"
          - "InsurancePolicy.claim_status -> PAID; credit Customer.store_credit_cents += payout_cents (calc insurance_payout)"
        note: "A loss is the compensating path; conserved-quantity invariant: store_credit delta == covered_value_cents."

concurrency_rules:
  - rule_id: regrade-create-stale-item
    parent_entity: SubmissionItem
    write_endpoint: "POST /submission-items/{id}/regrade-requests"
    occ_field: "expected_item_version"
    description: |
      Opening a RegradeRequest against a SubmissionItem whose version has advanced
      since the client last observed it is rejected. A prior regrade request has
      already cracked the active slab and bumped the item's version (legitimately
      superseding the slab the current writer still sees), so the current writer's
      view of the item is stale and its expected_item_version no longer matches.
    error_id: ERR_STALE_ITEM_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: provisional_overall_grade
    trigger: "on GradeAssessment create (POST /submission-items/{id}/grade-assessments)"
    algorithm: weighted_scoring
    formula: |
      # Weighted average of the four subgrades using the standard's bps weights,
      # then FLOORED to the nearest half-point. Provisional is optimistic: it does
      # NOT apply the lowest-subgrade cap.
      raw = (centering*centering_weight_bps + corners*corners_weight_bps
             + edges*edges_weight_bps + surface*surface_weight_bps) / 10000
      provisional_overall = floor(raw * 2) / 2     # floor to nearest 0.5
    input_set: "the four subgrades on this GradeAssessment; weights from the pinned GradingStandard"
    constants:
      HALF_STEP: 0.5
    precision: "grade to 1 decimal place on a 0.5 lattice; round mode = floor"
    variants:
      - name: provisional
        when: "at assessment create"
        difference: "weighted-then-floored; ignores the single-lowest-subgrade cap"

  - name: final_overall_grade
    trigger: "on GradeAssessment finalize (POST /grade-assessments/{id}/finalize) — side effect listed in GRADING->AUTHENTICATED precondition"
    algorithm: weighted_scoring
    formula: |
      # Final is pessimistic: take the provisional weighted-floored value, then CAP
      # it so the overall can never exceed (min_subgrade + 1.5). Then floor to 0.5.
      weighted = floor( ((centering*cW + corners*coW + edges*eW + surface*sW)/10000) * 2 ) / 2
      min_sub  = min(centering, corners, edges, surface)
      capped   = min(weighted, min_sub + 1.5)
      final_overall = floor(capped * 2) / 2
    input_set: "same four subgrades; weights from pinned GradingStandard"
    constants:
      LOWEST_CAP_DELTA: 1.5
      HALF_STEP: 0.5
    precision: "0.5 lattice, floor"
    variants:
      - name: provisional_vs_final_divergence
        when: "subgrades are uneven (one much lower than the others)"
        difference: "final applies min_sub+1.5 cap; provisional does not — same inputs, different overall"

  - name: estimate_item_fee
    trigger: "on Submission submit (POST /submissions/{id}/submit), per item"
    algorithm: tiered_pricing
    formula: |
      # Per-item estimate at submit: base tier fee + ESTIMATED insurance on the
      # UNCAPPED declared value. Insurance estimate uses the raw declared value.
      est_insurance = ceil( declared_value_cents * insurance_rate_bps / 10000 )
      estimated_fee_cents = base_fee_cents + est_insurance
    input_set: "the item's declared_value_cents and the submission's ServiceLevel"
    constants: {}
    precision: "integer cents; round mode = ceil on insurance"
    variants:
      - name: estimate
        when: "at submit"
        difference: "insurance computed on UNCAPPED declared value; no regrade surcharge"

  - name: finalize_item_fee
    trigger: "on SubmissionItem encapsulate (side effect of AUTHENTICATED->ENCAPSULATED)"
    algorithm: tiered_pricing
    formula: |
      # Per-item final fee: base + FINAL insurance on the CAPPED value + regrade surcharge.
      capped_value = min(declared_value_cents, ServiceLevel.max_declared_value_cents)
      final_insurance = ceil( capped_value * insurance_rate_bps / 10000 )
      regrade_surcharge = regrade_count * REGRADE_SURCHARGE_CENTS
      final_fee_cents = base_fee_cents + final_insurance + regrade_surcharge
    input_set: "the item's declared_value_cents (capped), regrade_count, ServiceLevel"
    constants:
      REGRADE_SURCHARGE_CENTS: 1500
    precision: "integer cents; round mode = ceil on insurance"
    variants:
      - name: final
        when: "at encapsulate"
        difference: "insurance computed on CAPPED value; adds regrade_count * 1500 surcharge — diverges from estimate when declared_value exceeds tier cap or item was regraded"

  - name: estimate_submission_fee
    trigger: "on Submission submit"
    algorithm: aggregation
    formula: |
      # Pin evaluation order: per-item estimate first (each ceil'd), THEN sum.
      # 'Round per item then sum', NOT 'sum then round'.
      total_estimated_fee_cents = sum( estimate_item_fee(item) for item in items )
    input_set: "all SubmissionItem children at submit (none excluded — rejection happens later at intake)"
    constants: {}
    precision: "integer cents; per-item ceil already applied, sum is exact"
    variants:
      - name: per_item_then_sum
        when: "always"
        difference: "rounding order pinned: ceil each item's insurance, then sum; sum-then-ceil would differ by up to N-1 cents"

  - name: finalize_submission_fee
    trigger: "on Submission IN_GRADING->READY_TO_SHIP (system)"
    algorithm: aggregation
    formula: |
      # Only ENCAPSULATED items contribute a final fee; REJECTED_RETURNED items
      # contribute 0 (no grading performed). Per-item ceil already applied; then sum.
      total_final_fee_cents = sum( item.final_fee_cents
                                   for item in items if item.status == ENCAPSULATED )
    input_set: "SubmissionItem children with status == ENCAPSULATED only"
    constants: {}
    precision: "integer cents"
    variants:
      - name: encapsulated_only
        when: "at ready-to-ship"
        difference: "excludes REJECTED_RETURNED items from the final fee (they paid no grading fee)"

  - name: covered_value
    trigger: "on Submission submit (InsurancePolicy create); recomputed on item reject"
    algorithm: aggregation
    formula: |
      # Conserved-quantity-relevant: covered value sums each item's declared value
      # CAPPED at the tier max, EXCLUDING rejected items. Premium = covered * rate.
      covered_value_cents = sum( min(item.declared_value_cents, ServiceLevel.max_declared_value_cents)
                                 for item in items if item.status != REJECTED_RETURNED )
      premium_cents = ceil( covered_value_cents * ServiceLevel.insurance_rate_bps / 10000 )
    input_set: "SubmissionItem children whose status != REJECTED_RETURNED"
    constants: {}
    precision: "integer cents; ceil on premium computed on the aggregate (sum-then-ceil)"
    variants:
      - name: aggregate_premium
        when: "always"
        difference: "premium is ceil(SUM-then-rate) — sum-then-ceil — deliberately DIFFERENT rounding order from per-item estimate fee insurance"

  - name: insurance_payout
    trigger: "on Shipment IN_TRANSIT->LOST (POST /shipments/{id}/report-lost)"
    algorithm: aggregation
    formula: |
      # Compensating action: loss pays out exactly the covered value, crediting
      # store_credit. Invariant: Customer.store_credit_cents increases by exactly
      # InsurancePolicy.covered_value_cents (no over/under payout).
      payout_cents = InsurancePolicy.covered_value_cents
      Customer.store_credit_cents += payout_cents
    input_set: "the submission's InsurancePolicy.covered_value_cents"
    constants: {}
    precision: "integer cents; exact"
    variants:
      - name: full_cover_payout
        when: "shipment LOST"
        difference: "payout equals covered_value exactly; conserved invariant store_credit delta == covered_value"

  - name: population_bump
    trigger: "on SubmissionItem encapsulate (AUTHENTICATED->ENCAPSULATED)"
    algorithm: aggregation
    formula: |
      # Pop bucket key = (grading_standard_id, title_key, grade_value). grade_value is
      # final_overall when authentic-gradeable, else -1 (AUTHENTIC bucket). Bump by 1.
      bucket = find_or_create(grading_standard_id, title_key, grade_value)
      bucket.pop_count += 1
    input_set: "the encapsulated item's standard, normalized title_key, and slab grade_value"
    constants:
      AUTHENTIC_ONLY_GRADE_SENTINEL: -1
    precision: "integer count"
    variants:
      - name: increment
        when: "on encapsulate"
        difference: "creates bucket if absent then +1"

  - name: population_decrement
    trigger: "on SubmissionItem crack (ENCAPSULATED->CRACK_PENDING)"
    algorithm: aggregation
    formula: |
      # Cracking the active slab decrements the same bucket it was counted in.
      # Conserved-quantity invariant: a crack-and-regrade leaves total pop_count
      # across all buckets net-zero ONLY after re-encapsulation; the crack alone
      # decrements the old bucket by 1.
      bucket = find(cracked_slab.grading_standard_id, title_key, cracked_slab.grade_value)
      bucket.pop_count -= 1
    input_set: "the cracked slab's bucket"
    constants: {}
    precision: "integer count; pop_count floor 0"
    variants:
      - name: decrement
        when: "on crack"
        difference: "mirror of population_bump; the regrade re-encapsulation re-bumps (possibly a different bucket if grade changed)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /customers and POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist, validated left-to-right."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"

  - priority: 4
    category: business_referential
    check: "Acting Customer owns the referenced Submission/SubmissionItem (X-User-ID == Submission.customer_id)."
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "POST /submissions/{id}/submit, POST /submission-items/{id}/regrade-requests, item create"

  - priority: 5
    category: state
    check: "Target resource is in a valid state for this transition (state-machine from: matches)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: state
    check: "OCC: RegradeRequest.expected_item_version == SubmissionItem.version."
    error_id: ERR_STALE_ITEM_VERSION
    http_status: 412
    applies_to: "POST /submission-items/{id}/regrade-requests"

  - priority: 7
    category: business_safety
    check: "Authentication verdict ALTERED/COUNTERFEIT requires a non-empty alteration_note."
    error_id: ERR_ALTERATION_NOTE_REQUIRED
    http_status: 422
    applies_to: "POST /submission-items/{id}/authentication"

  - priority: 8
    category: business_safety
    check: "An item with AuthenticationCheck.verdict == COUNTERFEIT cannot be encapsulated as a graded slab."
    error_id: ERR_COUNTERFEIT_NOT_ENCAPSULATABLE
    http_status: 422
    applies_to: "POST /submission-items/{id}/encapsulate"

  - priority: 9
    category: business_constraint
    check: "GradeAssessment subgrades each within [0, GradingStandard.max_grade]."
    error_id: ERR_SUBGRADE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /submission-items/{id}/grade-assessments"

  - priority: 10
    category: business_constraint
    check: "GradingStandard weights (centering+corners+edges+surface) sum to exactly 10000 bps."
    error_id: ERR_WEIGHTS_NOT_NORMALIZED
    http_status: 422
    applies_to: "POST /grading-standards"

  - priority: 11
    category: business_constraint
    check: "Only one active (active==true) Slab may exist per SubmissionItem."
    error_id: ERR_ACTIVE_SLAB_EXISTS
    http_status: 409
    applies_to: "POST /submission-items/{id}/encapsulate"

  - priority: 12
    category: business_temporal
    check: "Regrade not allowed after the submission has SHIPPED (Submission.status == SHIPPED/CLOSED)."
    error_id: ERR_SUBMISSION_ALREADY_SHIPPED
    http_status: 409
    applies_to: "POST /submission-items/{id}/regrade-requests"

  - priority: 13
    category: business_fiscal
    check: "Each item's declared_value_cents must be <= the submission tier's max_declared_value_cents."
    error_id: ERR_DECLARED_VALUE_EXCEEDS_TIER
    http_status: 422
    applies_to: "POST /submissions/{id}/submit"

  - priority: 14
    category: business_constraint
    check: "Submission must have item_count >= 1 to submit."
    error_id: ERR_EMPTY_SUBMISSION
    http_status: 422
    applies_to: "POST /submissions/{id}/submit"

  - priority: 15
    category: business_constraint
    check: "Items can only be added/removed while Submission.status == DRAFT."
    error_id: ERR_SUBMISSION_FROZEN
    http_status: 409
    applies_to: "POST /submissions/{id}/items, DELETE /submission-items/{id}"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Customers ----
  - method: POST
    path: "/customers"
    description: "Register a customer."
    roles: [Anonymous]
    code: 201
    input: [email, full_name]
    output: Customer
    side_effects: ["store_credit_cents initialized to 0"]
  - method: GET
    path: "/customers/{id}"
    description: "Fetch a customer (wallet balance)."
    roles: [Customer, LabAdmin]
    code: 200
    input: []
    output: Customer

  # ---- Config: ServiceLevel ----
  - method: POST
    path: "/service-levels"
    description: "Create a turnaround tier."
    roles: [LabAdmin]
    code: 201
    input: [code, turnaround_business_days, base_fee_cents, max_declared_value_cents, insurance_rate_bps, "active?"]
    output: ServiceLevel
    side_effects: []
  - method: GET
    path: "/service-levels/{id}"
    description: "Fetch a service level."
    roles: [LabAdmin, Customer]
    code: 200
    input: []
    output: ServiceLevel
  - method: GET
    path: "/service-levels"
    description: "List service levels."
    roles: [LabAdmin, Customer]
    code: 200
    input: ["active?", "limit?", "offset?"]
    output: ServiceLevel[]

  # ---- Config: GradingStandard ----
  - method: POST
    path: "/grading-standards"
    description: "Create a grading standard (weights must sum to 10000 bps)."
    roles: [LabAdmin]
    code: 201
    input: [code, max_grade, authentic_min_grade, centering_weight_bps, corners_weight_bps, edges_weight_bps, surface_weight_bps]
    output: GradingStandard
    side_effects: ["validate weight normalization (ERR_WEIGHTS_NOT_NORMALIZED)"]
  - method: GET
    path: "/grading-standards/{id}"
    description: "Fetch a grading standard."
    roles: [LabAdmin, Grader, Customer]
    code: 200
    input: []
    output: GradingStandard

  # ---- Submissions ----
  - method: POST
    path: "/submissions"
    description: "Create a DRAFT submission."
    roles: [Customer]
    code: 201
    input: [customer_id, service_level_id]
    output: Submission
    side_effects: ["status=DRAFT; item_count=0"]
  - method: GET
    path: "/submissions/{id}"
    description: "Fetch a submission (computed posture & fee totals)."
    roles: [Customer, LabAdmin, Receiver, Grader, Authenticator]
    code: 200
    input: []
    output: Submission
  - method: GET
    path: "/submissions"
    description: "List submissions; filtered-list reverse-reachability for Submission.customer_id and Submission.service_level_id."
    roles: [Customer, LabAdmin]
    code: 200
    input: ["customer_id?", "service_level_id?", "status?", "limit?", "offset?"]
    output: Submission[]
  - method: POST
    path: "/submissions/{id}/submit"
    description: "Submit a DRAFT submission; freezes items, computes estimate, creates InsurancePolicy."
    roles: [Customer]
    code: 200
    input: []
    output: Submission
    side_effects:
      - "DRAFT->SUBMITTED; compute total_estimated_fee_cents (estimate_submission_fee)"
      - "create InsurancePolicy; compute covered_value_cents & premium_cents (covered_value)"

  # ---- SubmissionItems ----
  - method: POST
    path: "/submissions/{id}/items"
    description: "Add an item to a DRAFT submission."
    roles: [Customer]
    code: 201
    input: [grading_standard_id, title, declared_value_cents]
    output: SubmissionItem
    side_effects: ["parent item_count += 1; status REGISTERED"]
  - method: GET
    path: "/submissions/{id}/items"
    description: "List items of a submission (FK reverse-reachability for SubmissionItem.submission_id)."
    roles: [Customer, LabAdmin, Receiver, Grader, Authenticator]
    code: 200
    input: ["limit?", "offset?"]
    output: SubmissionItem[]
  - method: GET
    path: "/submission-items"
    description: "List/query items (filtered-list reverse-reachability for SubmissionItem.submission_id and SubmissionItem.grading_standard_id)."
    roles: [Customer, LabAdmin, Receiver, Grader, Authenticator]
    code: 200
    input: ["submission_id?", "grading_standard_id?", "status?", "limit?", "offset?"]
    output: SubmissionItem[]
  - method: GET
    path: "/submission-items/{id}"
    description: "Fetch a submission item."
    roles: [Customer, LabAdmin, Receiver, Grader, Authenticator]
    code: 200
    input: []
    output: SubmissionItem
  - method: DELETE
    path: "/submission-items/{id}"
    description: "Remove an item from a DRAFT submission."
    roles: [Customer]
    code: 204
    input: []
    output: null
    side_effects: ["parent item_count -= 1 (only while DRAFT)"]

  # ---- Intake ----
  - method: POST
    path: "/submission-items/{id}/intake"
    description: "Log intake for a received item; sets SLA window start."
    roles: [Receiver]
    code: 201
    input: [condition_note, matches_declaration]
    output: IntakeRecord
    side_effects:
      - "REGISTERED->INTAKE_LOGGED; received_at = clock; bubble-up Submission.status"
  - method: GET
    path: "/submission-items/{id}/intake"
    description: "List intake records for an item (FK reverse-reachability for IntakeRecord.item_id)."
    roles: [Receiver, LabAdmin, Customer]
    code: 200
    input: []
    output: IntakeRecord[]
  - method: POST
    path: "/submission-items/{id}/reject"
    description: "Reject an item that does not match declaration; excluded from grading & coverage."
    roles: [Receiver]
    code: 200
    input: []
    output: SubmissionItem
    side_effects:
      - "INTAKE_LOGGED->REJECTED_RETURNED; recompute InsurancePolicy covered_value; bubble-up posture"

  # ---- Grading ----
  - method: POST
    path: "/submission-items/{id}/grade-assessments"
    description: "Create a grade assessment (subgrades); computes provisional_overall. Also the re-entry edge for crack-and-regrade."
    roles: [Grader]
    code: 201
    input: [grading_standard_id, centering_subgrade, corners_subgrade, edges_subgrade, surface_subgrade]
    output: GradeAssessment
    side_effects:
      - "INTAKE_LOGGED->GRADING (or CRACK_PENDING->GRADING on regrade); provisional_overall computed; on regrade re-entry set RegradeRequest COMPLETED & regrade_count += 1"
  - method: GET
    path: "/submission-items/{id}/grade-assessments"
    description: "List grade assessments for an item (FK reverse-reachability for GradeAssessment.item_id)."
    roles: [Grader, Authenticator, LabAdmin, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: GradeAssessment[]
  - method: GET
    path: "/grade-assessments"
    description: "List/query grade assessments (filtered-list reverse-reachability for GradeAssessment.item_id and GradeAssessment.grading_standard_id)."
    roles: [Grader, Authenticator, LabAdmin, Customer]
    code: 200
    input: ["item_id?", "grading_standard_id?", "limit?", "offset?"]
    output: GradeAssessment[]
  - method: GET
    path: "/grade-assessments/{id}"
    description: "Fetch a grade assessment."
    roles: [Grader, Authenticator, LabAdmin, Customer]
    code: 200
    input: []
    output: GradeAssessment
  - method: POST
    path: "/grade-assessments/{id}/finalize"
    description: "Finalize an assessment; computes final_overall (min-subgrade cap)."
    roles: [Grader]
    code: 200
    input: []
    output: GradeAssessment
    side_effects: ["compute final_overall (final_overall_grade)"]

  # ---- Authentication ----
  - method: POST
    path: "/submission-items/{id}/authentication"
    description: "Run authentication; GRADING->AUTHENTICATED."
    roles: [Authenticator]
    code: 201
    input: [verdict, "alteration_note?"]
    output: AuthenticationCheck
    side_effects: ["GRADING->AUTHENTICATED"]
  - method: GET
    path: "/submission-items/{id}/authentication"
    description: "List authentication checks for an item (FK reverse-reachability for AuthenticationCheck.item_id)."
    roles: [Authenticator, LabAdmin, Customer]
    code: 200
    input: []
    output: AuthenticationCheck[]

  # ---- Encapsulation / Slab ----
  - method: POST
    path: "/submission-items/{id}/encapsulate"
    description: "Encapsulate the item into a slab; mints cert_number, bumps population, finalizes item fee."
    roles: [Authenticator]
    code: 201
    input: [assessment_id]
    output: Slab
    side_effects:
      - "AUTHENTICATED->ENCAPSULATED; mint cert_number; compute label_grade_text; population_bump; finalize_item_fee; bubble-up posture"
  - method: GET
    path: "/submission-items/{id}/slabs"
    description: "List slabs for an item incl. cracked ones (FK reverse-reachability for Slab.item_id)."
    roles: [Authenticator, LabAdmin, Customer]
    code: 200
    input: ["active?", "limit?", "offset?"]
    output: Slab[]
  - method: GET
    path: "/slabs"
    description: "List/query slabs (filtered-list reverse-reachability for Slab.item_id and Slab.assessment_id)."
    roles: [Authenticator, LabAdmin, Customer]
    code: 200
    input: ["item_id?", "assessment_id?", "active?", "limit?", "offset?"]
    output: Slab[]
  - method: GET
    path: "/slabs/{id}"
    description: "Fetch a slab."
    roles: [Authenticator, LabAdmin, Customer]
    code: 200
    input: []
    output: Slab

  # ---- Labels ----
  - method: POST
    path: "/slabs/{id}/label"
    description: "Print the label for a slab; snapshots population count."
    roles: [Authenticator, LabAdmin]
    code: 201
    input: [population_report_id]
    output: Label
    side_effects: ["printed_pop_count = PopulationReport.pop_count snapshot; printed_at = clock"]
  - method: GET
    path: "/slabs/{id}/label"
    description: "List labels for a slab (FK reverse-reachability for Label.slab_id)."
    roles: [Authenticator, LabAdmin, Customer]
    code: 200
    input: []
    output: Label[]
  - method: GET
    path: "/labels"
    description: "List/query labels (filtered-list reverse-reachability for Label.slab_id and Label.population_report_id)."
    roles: [Authenticator, LabAdmin, Customer]
    code: 200
    input: ["slab_id?", "population_report_id?", "limit?", "offset?"]
    output: Label[]
  - method: GET
    path: "/labels/{id}"
    description: "Fetch a label."
    roles: [Authenticator, LabAdmin, Customer]
    code: 200
    input: []
    output: Label

  # ---- Population reports ----
  - method: GET
    path: "/population-reports"
    description: "List/query population buckets (filter by standard/title/grade) — FK reverse-reachability for PopulationReport.grading_standard_id and Label.population_report_id."
    roles: [LabAdmin, Customer, Authenticator]
    code: 200
    input: ["grading_standard_id?", "title_key?", "grade_value?", "limit?", "offset?"]
    output: PopulationReport[]
  - method: GET
    path: "/population-reports/{id}"
    description: "Fetch a single population bucket."
    roles: [LabAdmin, Customer, Authenticator]
    code: 200
    input: []
    output: PopulationReport

  # ---- Insurance ----
  - method: GET
    path: "/submissions/{id}/insurance-policy"
    description: "Fetch the submission's insurance policy (FK reverse-reachability for InsurancePolicy.submission_id)."
    roles: [Customer, LabAdmin]
    code: 200
    input: []
    output: InsurancePolicy[]

  # ---- Regrade ----
  - method: POST
    path: "/submission-items/{id}/regrade-requests"
    description: "Crack-and-regrade: crack the active slab and reopen grading. OCC on item version."
    roles: [Customer]
    code: 201
    input: [prior_slab_id, expected_item_version, reason]
    output: RegradeRequest
    side_effects:
      - "ENCAPSULATED->CRACK_PENDING; crack prior slab (active=false); population_decrement; supersede prior assessment; increment SubmissionItem.version by 1; bubble-up posture"
  - method: GET
    path: "/submission-items/{id}/regrade-requests"
    description: "List regrade requests for an item (FK reverse-reachability for RegradeRequest.item_id)."
    roles: [Customer, LabAdmin, Grader]
    code: 200
    input: ["limit?", "offset?"]
    output: RegradeRequest[]
  - method: GET
    path: "/regrade-requests"
    description: "List/query regrade requests (filtered-list reverse-reachability for RegradeRequest.item_id and RegradeRequest.prior_slab_id)."
    roles: [Customer, LabAdmin, Grader]
    code: 200
    input: ["item_id?", "prior_slab_id?", "limit?", "offset?"]
    output: RegradeRequest[]
  - method: GET
    path: "/regrade-requests/{id}"
    description: "Fetch a regrade request."
    roles: [Customer, LabAdmin, Grader]
    code: 200
    input: []
    output: RegradeRequest

  # ---- Shipments ----
  - method: POST
    path: "/submissions/{id}/shipments"
    description: "Create a return shipment label for a READY_TO_SHIP submission."
    roles: [LabAdmin]
    code: 201
    input: [carrier, tracking_number]
    output: Shipment
    side_effects: ["status LABEL_CREATED; insured_value_cents copied from InsurancePolicy.covered_value_cents"]
  - method: GET
    path: "/submissions/{id}/shipments"
    description: "List shipments for a submission (FK reverse-reachability for Shipment.submission_id)."
    roles: [LabAdmin, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: Shipment[]
  - method: GET
    path: "/shipments/{id}"
    description: "Fetch a shipment."
    roles: [LabAdmin, Customer]
    code: 200
    input: []
    output: Shipment
  - method: POST
    path: "/shipments/{id}/dispatch"
    description: "Dispatch the shipment; Submission->SHIPPED, all items->SHIPPED."
    roles: [LabAdmin]
    code: 200
    input: []
    output: Shipment
    side_effects: ["LABEL_CREATED->IN_TRANSIT; Submission->SHIPPED; items->SHIPPED"]
  - method: POST
    path: "/shipments/{id}/deliver"
    description: "Mark delivered; Submission becomes CLOSED-eligible."
    roles: [LabAdmin]
    code: 200
    input: []
    output: Shipment
    side_effects: ["IN_TRANSIT->DELIVERED"]
  - method: POST
    path: "/shipments/{id}/report-lost"
    description: "Report shipment lost; files & pays insurance claim, credits customer store credit."
    roles: [LabAdmin]
    code: 200
    input: []
    output: Shipment
    side_effects: ["IN_TRANSIT->LOST; InsurancePolicy claim FILED->PAID; insurance_payout credits Customer.store_credit_cents"]
  - method: POST
    path: "/submissions/{id}/close"
    description: "Close a delivered submission."
    roles: [LabAdmin]
    code: 200
    input: []
    output: Submission
    side_effects: ["SHIPPED->CLOSED"]

  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-01-01T00:00:00Z; the clock never falls back to wall-clock time. Drives SLA window math deterministically."
    roles: [LabAdmin, Anonymous]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced; received_at/printed_at stamps read from it"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for this operation."
  - id: ERR_NOT_OWNER
    http: 403
    condition: "Acting Customer is not the owner of the referenced submission/item."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a valid state for this transition."
  - id: ERR_STALE_ITEM_VERSION
    http: 412
    condition: "RegradeRequest.expected_item_version does not match SubmissionItem.version (OCC)."
  - id: ERR_ALTERATION_NOTE_REQUIRED
    http: 422
    condition: "Authentication verdict ALTERED/COUNTERFEIT submitted without alteration_note."
  - id: ERR_COUNTERFEIT_NOT_ENCAPSULATABLE
    http: 422
    condition: "Attempt to encapsulate an item whose authentication verdict is COUNTERFEIT."
  - id: ERR_SUBGRADE_OUT_OF_RANGE
    http: 422
    condition: "A subgrade is outside [0, GradingStandard.max_grade]."
  - id: ERR_WEIGHTS_NOT_NORMALIZED
    http: 422
    condition: "GradingStandard weights do not sum to 10000 bps."
  - id: ERR_ACTIVE_SLAB_EXISTS
    http: 409
    condition: "An active Slab already exists for the item being encapsulated."
  - id: ERR_SUBMISSION_ALREADY_SHIPPED
    http: 409
    condition: "Regrade requested after the submission has shipped."
  - id: ERR_DECLARED_VALUE_EXCEEDS_TIER
    http: 422
    condition: "An item's declared_value_cents exceeds the tier max_declared_value_cents at submit."
  - id: ERR_EMPTY_SUBMISSION
    http: 422
    condition: "Submit attempted on a submission with zero items."
  - id: ERR_SUBMISSION_FROZEN
    http: 409
    condition: "Add/remove item attempted on a non-DRAFT submission."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, or invalid enum value."
  - id: ERR_VALIDATION
    http: 422
    condition: "Semantic field validation failed (e.g. negative declared_value_cents)."
  - id: ERR_DUPLICATE_INTAKE
    http: 409
    condition: "Intake logged twice for the same item."
  - id: ERR_PAGINATION_INVALID
    http: 400
    condition: "limit/offset out of allowed pagination bounds."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may register and set the test clock only."
    identity: "opaque"
    exclusive_operations:
      - "POST /customers"
    shared_operations:
      - "POST /_clock/set_current_utc"

  - name: Customer
    description: "Submitter who owns submissions and requests regrades."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /submissions"
      - "POST /submissions/{id}/submit"
      - "POST /submissions/{id}/items"
      - "DELETE /submission-items/{id}"
      - "POST /submission-items/{id}/regrade-requests"
    shared_operations:
      - "GET /submissions/{id}"
      - "GET /submission-items/{id}"
      - "GET /customers/{id}"

  - name: Receiver
    description: "Warehouse operator who logs intake and rejects mismatched items."
    identity: "opaque"
    exclusive_operations:
      - "POST /submission-items/{id}/intake"
      - "POST /submission-items/{id}/reject"
    shared_operations:
      - "GET /submissions/{id}/items"
      - "GET /submission-items/{id}"

  - name: Grader
    description: "Grades items (subgrades) and finalizes assessments."
    identity: "opaque"
    exclusive_operations:
      - "POST /submission-items/{id}/grade-assessments"
      - "POST /grade-assessments/{id}/finalize"
    shared_operations:
      - "GET /submission-items/{id}/grade-assessments"
      - "GET /grade-assessments/{id}"

  - name: Authenticator
    description: "Authenticates and encapsulates items; prints labels."
    identity: "opaque"
    exclusive_operations:
      - "POST /submission-items/{id}/authentication"
      - "POST /submission-items/{id}/encapsulate"
    shared_operations:
      - "POST /slabs/{id}/label"
      - "GET /slabs/{id}"
      - "GET /population-reports"

  - name: LabAdmin
    description: "Configures service levels/standards, runs shipping, handles losses & closes."
    identity: "opaque"
    exclusive_operations:
      - "POST /service-levels"
      - "POST /grading-standards"
      - "POST /submissions/{id}/shipments"
      - "POST /shipments/{id}/dispatch"
      - "POST /shipments/{id}/deliver"
      - "POST /shipments/{id}/report-lost"
      - "POST /submissions/{id}/close"
    shared_operations:
      - "POST /slabs/{id}/label"
      - "GET /population-reports"
      - "GET /submissions/{id}/insurance-policy"
