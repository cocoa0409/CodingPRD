      - name: period_fee_rounds_per_category_not_on_the_blended_total
        claim_type: precision
        grounds:
          - calculations.period_franchise_fee
          - constants.CATEGORY_DIFF_LODGING_PCT
          - constants.CATEGORY_DIFF_RETAIL_PCT
        excluded_because:
          difficulty_instance: "combinatorial_formula / period_fee_rounds_each_category_before_summing"
          rationale: "The difficulty instance already pins round-then-sum with receipts chosen so that per-category rounding and blended-rate rounding disagree by a whole cent, and it asserts the divergent figure directly. A separate precision corner would re-run the same computation with weaker inputs."

      - name: underreport_percentage_threshold_is_inclusive
        claim_type: threshold
        grounds:
          - calculations.audit_underreport_assessment
          - constants.UNDERREPORT_PENALTY_THRESHOLD_PCT
        excluded_because:
          difficulty_instance: "boundary_precision_check / underreport_pct_at_exact_threshold_triggers_penalty_flag"
          rationale: "The difficulty instance sits the computed underreport percentage exactly on UNDERREPORT_PENALTY_THRESHOLD_PCT after two-decimal rounding and asserts that the penalty flag fires, which is strictly stronger than any off-boundary threshold probe."

      - name: annual_ladder_and_period_assessment_are_distinct_variants
        claim_type: variant_divergence
        grounds:
          - calculations.period_franchise_fee
          - calculations.annual_fee_reconciliation
        excluded_because:
          difficulty_instance: "dual_variant_calc / annual_tiered_ladder_diverges_from_period_remittance_sum"
          rationale: "That instance is built entirely around making the two variants disagree on the same receipts and asserting both figures in one reconciliation row, so the divergence claim is covered at full strength."

      - name: composite_score_rounding_location_is_mode_dependent
        claim_type: weighted_scoring
        grounds:
          - calculations.proposal_composite_score
          - entities.Prospectus.fields.scoring_mode
        excluded_because:
          difficulty_instance: "dual_variant_calc / composite_score_rounding_location_shifts_evaluation_result"
          rationale: "The difficulty instance runs the identical panel scores under both scoring_mode values and asserts that the rounding location flips the responsiveness outcome — the weighted-scoring boundary is exercised there in its sharpest form."

      - name: transfer_settlement_waterfall_orders_admin_fee_before_offsets
        claim_type: waterfall_allocation
        grounds:
          - calculations.successor_transfer_settlement
          - constants.TRANSFER_ADMIN_FEE_PCT
        excluded_because:
          difficulty_instance: "combinatorial_formula / transfer_settlement_charges_admin_fee_on_gross_before_offsets"
          rationale: "The difficulty instance pins the whole waterfall — gross compensable value, admin fee on gross rather than on the net, outstanding balance offset, and the max(0) split into net payable and deficiency — with figures that differ under every plausible reordering."

