  # -------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # -------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: cart_buffer_adjacency_boundary_90min
        grounds:
          - calculations.cart_overlap_check
        distinguishing_aspect: |
          Boundary on MINUTES metric on the submit endpoint: booking2 starting exactly TRAVEL_BUFFER_MINUTES=90 after booking1.event_end must be REJECTED (buffered_end_1 == buffered_start_2 + 0 is still touching under half-open < comparison? NO — buffered interval of b1 ends at end_1+90min; if b2.event_start == end_1+90min, then b2.buffered_start = end_1+90-90 = end_1; overlap test (start_1 < buffered_end_2) AND (buffered_start_2 < buffered_end_1): end_1 < end_1+90 is true → still rejected). The TRUE no-overlap boundary is b2.event_start >= end_1 + 180 min (both buffers clear). Test b2 at +89 vs +90 vs +180 min.
