# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same X-User-ID attempting both create and complete on a PackagingRun" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Resource ID or FK reference does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state that permits this action" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current entity.version" }
  - { id: ERR_LICENSE_NOT_ACTIVE, http: 409, condition: "LicensePermit.status is SUSPENDED/EXPIRED" }
  - { id: ERR_LABEL_NOT_APPROVED, http: 409, condition: "LabelApproval.status is SUBMITTED/REJECTED" }
  - { id: ERR_LABEL_EXPIRED, http: 409, condition: "LabelApproval APPROVED but expires_at < now (non-FEDERAL)" }
  - { id: ERR_PERMIT_EXPIRED, http: 409, condition: "LicensePermit.expires_at < now" }
  - { id: ERR_PRESS_WINDOW_CONFLICT, http: 409, condition: "Press window overlaps another PRESSING batch (half-open intervals)" }
  - { id: ERR_RETURN_WINDOW_EXPIRED, http: 409, condition: "Return attempted > 30 days after shipped_at" }
  - { id: ERR_NO_TANK_AVAILABLE, http: 409, condition: "No tank satisfies capacity/temperature eligibility" }
  - { id: ERR_ABV_OUT_OF_TOLERANCE, http: 409, condition: "| batch.abv_pct - product.target_abv_pct | > abv_tolerance_pct" }
  - { id: ERR_INSUFFICIENT_FRUIT, http: 409, condition: "BlendLine weight exceeds lot unpressed_weight_lbs" }
  - { id: ERR_BATCH_NOT_READY, http: 409, condition: "FermentationBatch referenced for packaging not in READY status" }
  - { id: ERR_INSUFFICIENT_VOLUME, http: 409, condition: "FermentationBatch.volume_liters < requested packaging volume" }
  - { id: ERR_LICENSE_CAP_EXCEEDED, http: 409, condition: "PackagingRun would push license volume_used_liters > annual_volume_cap_liters" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 409, condition: "Order units exceed remaining PackagingRun inventory" }
  - { id: ERR_CONTRACT_HAS_OPEN_LOTS, http: 409, condition: "Settle attempted while some lots not in {PRESSED, SPOILED}" }
  - { id: ERR_PERIOD_NOT_CLOSED, http: 409, condition: "ExciseReport file attempted before period close" }
  - { id: ERR_DUPLICATE_REPORT, http: 409, condition: "OPEN report already exists for (year, month, regulator)" }
  - { id: ERR_DUPLICATE_SKU, http: 409, condition: "CiderProduct sku already in use" }
  - { id: ERR_DUPLICATE_LABEL_MARKET, http: 409, condition: "LabelApproval already exists for (product, market)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OrchardManager
    description: "Owns orchard contracts and harvest lot intake"
    identity: opaque
    exclusive_operations:
      - "POST /cidery/contracts*"
      - "POST /cidery/varieties"
      - "POST /cidery/contracts/{id}/harvest-lots"
    shared_operations:
      - "GET on contracts, lots, varieties"

  - name: CellarLead
    description: "Owns pressing, fermentation, tank and yeast operations"
    identity: opaque
    exclusive_operations:
      - "POST /cidery/yeast-programs"
      - "POST /cidery/tanks*"
      - "POST /cidery/press-batches*"
      - "POST /cidery/fermentation-batches*"
      - "POST /cidery/harvest-lots/{id}/spoil"
    shared_operations:
      - "GET on tanks, press-batches, fermentation-batches, yeast-programs"

  - name: ComplianceOfficer
    description: "Owns licensing, label approvals, products, excise reports"
    identity: opaque
    exclusive_operations:
      - "POST /cidery/products*"
      - "POST /cidery/label-approvals*"
      - "POST /cidery/licenses*"
      - "POST /cidery/excise-reports*"
      - "GET /cidery/compliance-events*"
    shared_operations:
      - "GET on products, labels, licenses, excise-reports, contracts, orders"

  - name: PackagingOperator
    description: "Owns packaging runs"
    identity: opaque
    exclusive_operations:
      - "POST /cidery/packaging-runs*"
    shared_operations:
      - "GET on packaging-runs, products, batches, labels, licenses, tanks"

  - name: SalesRep
    description: "Owns sales orders"
    identity: opaque
    exclusive_operations:
      - "POST /cidery/orders*"
    shared_operations:
      - "GET on orders, products, packaging-runs, licenses, labels"

  - name: PlatformAdmin
    description: "Test-driving and audit access"
    identity: opaque
    exclusive_operations:
      - "POST /cidery/_clock/set_current_utc"
    shared_operations:
      - "GET on all resources"
