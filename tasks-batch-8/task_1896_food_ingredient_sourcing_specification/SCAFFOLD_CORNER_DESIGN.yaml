# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1896 Food Ingredient Sourcing & Specification Management
# Breadth probe over §1.1–§1.7 claims not covered by §1.8 instances.
# All chains replay from empty-DB via §1.5 endpoints only.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: ingredient_creation_defaults_and_envelope
        claim_type: creation_defaults
        grounds:
          - entities.Ingredient
          - response_envelope
        distinguishing_aspect: "POST /sourcing/ingredients returns 201 with status DRAFT, current_dual_source_breach false, active_spec_id null, version 1; envelope carries meta.api_request_id and response_type object."
        test_recipe:
          setup: ["Empty DB; clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "ENZ-D", name: "Default Enzyme", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
              captures: { iid: $.data.id, st: $.data.status, br: $.data.current_dual_source_breach, ver: $.data.version }
          assert:
            - "response status 201; $.data.status == DRAFT; $.data.current_dual_source_breach == false; $.data.version == 1"
            - "$.data.active_spec_id is null; $.meta.api_request_id present; $.response_type == object"

      - name: ingredient_missing_required_field_returns_invalid_request
        claim_type: required_field_validation
        grounds:
          - entities.Ingredient.fields.ingredient_code
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting ingredient_code (required input, no default) fails with ERR_INVALID_REQUEST 400 before any persistence."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /sourcing/ingredients"
              payload: { name: "No Code", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (missing required ingredient_code)"

      - name: ingredient_duplicate_code_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_DUPLICATE]
        distinguishing_aspect: "Second ingredient with identical ingredient_code fails with ERR_DUPLICATE 409."
        test_recipe:
          setup: ["Ingredient ENZ-DUP exists"]
          setup_api_calls:
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "ENZ-DUP", name: "First", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
          trigger:
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "ENZ-DUP", name: "Second", allergen_profile: ["SOY"], requires_dual_source: true }
              as: ProcurementManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE"

      - name: ingredient_invalid_allergen_enum_rejected
        claim_type: type_constraint
        grounds:
          - entities.Ingredient.fields.allergen_profile
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "allergen_profile containing a tag outside the fixed enum (e.g. GLUTEN) fails with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "ENZ-BAD", name: "Bad Allergen", allergen_profile: ["GLUTEN"], requires_dual_source: false }
              as: ProcurementManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (enum membership violation)"

      - name: ingredient_get_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but absent UUID fails with ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /sourcing/ingredients/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: ProcurementManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (404)"

      - name: ingredient_list_pagination_defaults
        claim_type: listing_pagination
        grounds:
          - response_envelope
          - endpoints[GET /sourcing/ingredients]
        distinguishing_aspect: "List endpoint without limit/offset returns at most 10 rows and exposes total_count + has_more per the fixed envelope."
        test_recipe:
          setup: ["12 ingredients created"]
          setup_api_calls:
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "PAG-01", name: "P1", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "PAG-02", name: "P2", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "PAG-03", name: "P3", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "PAG-04", name: "P4", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "PAG-05", name: "P5", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "PAG-06", name: "P6", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "PAG-07", name: "P7", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "PAG-08", name: "P8", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "PAG-09", name: "P9", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "PAG-10", name: "P10", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "PAG-11", name: "P11", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "PAG-12", name: "P12", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
          trigger:
            - call: "GET /sourcing/ingredients"
              payload: {}
              as: QualityManager
          assert:
            - "$.data length == 10 (default limit); $.data pagination fields include total_count == 12 and has_more == true"

      - name: price_index_observation_immutable_no_version
        claim_type: immutability
        grounds:
          - entities.PriceIndexObservation
        distinguishing_aspect: "PriceIndexObservation has common_fields false: response exposes id and created_at but no version field, and no update endpoint exists."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /sourcing/price-index-observations"
              payload: { index_name: "WHEY-SPOT", observed_at: "2026-07-15T00:00:00Z", index_value: 210.5 }
              as: PlatformAdmin
              captures: { oid: $.data.id }
          assert:
            - "201 response has $.data.id and $.data.created_at but no $.data.version and no $.data.updated_at (append-only log)"

      - name: active_spec_id_computed_field_tracks_effective_spec
        claim_type: computed_field_correctness
        grounds:
          - entities.Ingredient.fields.active_spec_id
          - state_machines.IngredientSpec.APPROVED_to_EFFECTIVE
        distinguishing_aspect: "Ingredient.active_spec_id is null before any EFFECTIVE spec and equals the spec id after make-effective; client-supplied active_spec_id is ignored (computed source)."
        test_recipe:
          setup:
            - "Ingredient created; spec v1 with valid param approved"
          setup_api_calls:
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "ENZ-CMP", name: "Computed Enzyme", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
              captures: { ing_id: $.data.id, ing_v: $.data.version }
            - call: "POST /sourcing/ingredients/${ing_id}/specs"
              payload: { spec_version_label: "v1", effective_date: "2026-07-01T00:00:00Z", version_note: "initial spec version", expected_ingredient_version: "${ing_v}" }
              as: SpecAuthor
              as_user_id: author-1
              captures: { spec_id: $.data.id }
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/parameters"
              payload: { parameter_name: "moisture", criticality: "MINOR", uom: "percent", target_value: 5, min_value: 0, max_value: 10 }
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/submit"
              payload: {}
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/approve"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
          trigger:
            - call: "GET /sourcing/ingredients/${ing_id}"
              payload: {}
              as: ProcurementManager
              captures: { pre_spec: $.data.active_spec_id }
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/make-effective"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "GET /sourcing/ingredients/${ing_id}"
              payload: {}
              as: ProcurementManager
              captures: { post_spec: $.data.active_spec_id }
          assert:
            - "Before make-effective: active_spec_id is null"
            - "After make-effective: active_spec_id == ${spec_id}"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: spec_submit_from_pending_review_rejected_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.IngredientSpec
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Submitting a spec already in PENDING_REVIEW fails with ERR_INVALID_STATE; idempotent re-trigger is not permitted."
        test_recipe:
          setup: ["Ingredient; spec v1 with one param submitted once"]
          setup_api_calls:
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "ENZ-IV", name: "Invalid Enzyme", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
              captures: { ing_id: $.data.id, ing_v: $.data.version }
            - call: "POST /sourcing/ingredients/${ing_id}/specs"
              payload: { spec_version_label: "v1", effective_date: "2026-07-01T00:00:00Z", version_note: "initial spec version", expected_ingredient_version: "${ing_v}" }
              as: SpecAuthor
              as_user_id: author-1
              captures: { spec_id: $.data.id }
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/parameters"
              payload: { parameter_name: "moisture", criticality: "MINOR", uom: "percent", target_value: 5, min_value: 0, max_value: 10 }
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/submit"
              payload: {}
              as: SpecAuthor
              as_user_id: author-1
          trigger:
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/submit"
              payload: {}
              as: SpecAuthor
              as_user_id: author-1
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (second submit from PENDING_REVIEW)"

      - name: retired_spec_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.IngredientSpec
        distinguishing_aspect: "A RETIRED spec accepts no further transitions: submit, approve, and retire all fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Ingredient; spec v1 with one param in DRAFT, then retired"]
          setup_api_calls:
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "ENZ-RET", name: "Retire Enzyme", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
              captures: { ing_id: $.data.id, ing_v: $.data.version }
            - call: "POST /sourcing/ingredients/${ing_id}/specs"
              payload: { spec_version_label: "v1", effective_date: "2026-07-01T00:00:00Z", version_note: "initial spec version", expected_ingredient_version: "${ing_v}" }
              as: SpecAuthor
              as_user_id: author-1
              captures: { spec_id: $.data.id }
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/parameters"
              payload: { parameter_name: "moisture", criticality: "MINOR", uom: "percent", target_value: 5, min_value: 0, max_value: 10 }
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/retire"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
          trigger:
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/submit"
              payload: {}
              as: SpecAuthor
              as_user_id: author-1
              captures: { err1: $.data.error_id }
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/approve"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
              captures: { err2: $.data.error_id }
          assert:
            - "submit from RETIRED: error_id == ERR_INVALID_STATE"
            - "approve from RETIRED: error_id == ERR_INVALID_STATE"

      - name: revoked_source_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ApprovedSource
        distinguishing_aspect: "A REVOKED source cannot be activated, suspended, reinstated, or revoked again — all return ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Ingredient EFFECTIVE spec; QUALIFIED supplier; PROVISIONAL source (no contract) revoked by ProcurementManager"
          setup_api_calls:
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "ENZ-RVK", name: "Revoke Enzyme", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
              captures: { ing_id: $.data.id, ing_v: $.data.version }
            - call: "POST /sourcing/ingredients/${ing_id}/specs"
              payload: { spec_version_label: "v1", effective_date: "2026-07-01T00:00:00Z", version_note: "initial spec version", expected_ingredient_version: "${ing_v}" }
              as: SpecAuthor
              as_user_id: author-1
              captures: { spec_id: $.data.id }
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/parameters"
              payload: { parameter_name: "moisture", criticality: "MINOR", uom: "percent", target_value: 5, min_value: 0, max_value: 10 }
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/submit"
              payload: {}
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/approve"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/make-effective"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/suppliers"
              payload: { supplier_code: "SUP-RVK", legal_name: "Revoke Supplier", risk_tier: "TIER_A", country_of_operation: "US" }
              as: ProcurementManager
              captures: { sup_id: $.data.id }
            - call: "GET /sourcing/ingredients/${ing_id}"
              payload: {}
              as: ProcurementManager
              captures: { ing_v2: $.data.version }
            - call: "POST /sourcing/ingredients/${ing_id}/approved-sources"
              payload: { supplier_id: "${sup_id}", pinned_spec_id: "${spec_id}", expected_ingredient_version: "${ing_v2}" }
              as: ProcurementManager
              captures: { src_id: $.data.id }
            - call: "POST /sourcing/ingredients/${ing_id}/approved-sources/${src_id}/revoke"
              payload: {}
              as: ProcurementManager
          trigger:
            - call: "POST /sourcing/ingredients/${ing_id}/approved-sources/${src_id}/activate"
              payload: {}
              as: ProcurementManager
              captures: { err1: $.data.error_id }
            - call: "POST /sourcing/ingredients/${ing_id}/approved-sources/${src_id}/reinstate"
              payload: {}
              as: ProcurementManager
              captures: { err2: $.data.error_id }
            - call: "POST /sourcing/ingredients/${ing_id}/approved-sources/${src_id}/revoke"
              payload: {}
              as: ProcurementManager
              captures: { err3: $.data.error_id }
          assert:
            - "activate from REVOKED: ERR_INVALID_STATE"
            - "reinstate from REVOKED: ERR_INVALID_STATE"
            - "second revoke from REVOKED: ERR_INVALID_STATE"

      - name: contract_auto_expiry_on_clock_sweep
        claim_type: valid_transition
        grounds:
          - state_machines.SupplyContract.ACTIVE_to_EXPIRED
        distinguishing_aspect: "System transition: advancing the clock to exactly window_end expires the ACTIVE contract (EXPIRED terminal); no manual trigger involved."
        test_recipe:
          setup:
            - "ACTIVE source with declarations; ACTIVE contract window [2026-01-01, 2026-08-10)"
          setup_api_calls:
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "ENZ-EXP", name: "Expiry Enzyme", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
              captures: { ing_id: $.data.id, ing_v: $.data.version }
            - call: "POST /sourcing/ingredients/${ing_id}/specs"
              payload: { spec_version_label: "v1", effective_date: "2026-07-01T00:00:00Z", version_note: "initial spec version", expected_ingredient_version: "${ing_v}" }
              as: SpecAuthor
              as_user_id: author-1
              captures: { spec_id: $.data.id }
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/parameters"
              payload: { parameter_name: "moisture", criticality: "MINOR", uom: "percent", target_value: 5, min_value: 0, max_value: 10 }
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/submit"
              payload: {}
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/approve"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/make-effective"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/suppliers"
              payload: { supplier_code: "SUP-EXP", legal_name: "Expiry Supplier", risk_tier: "TIER_A", country_of_operation: "US" }
              as: ProcurementManager
              captures: { sup_id: $.data.id }
            - call: "POST /sourcing/suppliers/${sup_id}/qualifications"
              payload: { questionnaire_score: 90, document_pack_complete: true }
              as: SupplierQualityEngineer
              as_user_id: sqe-1
              captures: { qual_id: $.data.id }
            - call: "POST /sourcing/suppliers/${sup_id}/qualifications/${qual_id}/evaluate"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/suppliers/${sup_id}/qualifications/${qual_id}/decide"
              payload: { decision: "APPROVE", decision_note: "qualification approved" }
              as: QualityManager
              as_user_id: qm-1
            - call: "GET /sourcing/ingredients/${ing_id}"
              payload: {}
              as: ProcurementManager
              captures: { ing_v2: $.data.version }
            - call: "POST /sourcing/ingredients/${ing_id}/approved-sources"
              payload: { supplier_id: "${sup_id}", pinned_spec_id: "${spec_id}", expected_ingredient_version: "${ing_v2}" }
              as: ProcurementManager
              captures: { src_id: $.data.id, src_v: $.data.version }
            - call: "POST /sourcing/approved-sources/${src_id}/declarations"
              payload: { declaration_type: "ALLERGEN", payload: { allergen_tags: ["NONE"] }, valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }
              as: RegulatoryAffairs
            - call: "POST /sourcing/approved-sources/${src_id}/declarations"
              payload: { declaration_type: "COUNTRY_OF_ORIGIN", payload: { country_codes: ["US"], primary_country: "US" }, valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }
              as: RegulatoryAffairs
            - call: "POST /sourcing/ingredients/${ing_id}/approved-sources/${src_id}/activate"
              payload: {}
              as: ProcurementManager
            - call: "POST /sourcing/approved-sources/${src_id}/contracts"
              payload: { annual_committed_volume_kg: 10000, index_base_value: 100, index_pass_through_pct: 0.5, window_start: "2026-01-01T00:00:00Z", window_end: "2026-08-10T00:00:00Z", expected_approved_source_version: "${src_v}" }
              as: ProcurementManager
              captures: { ctr_id: $.data.id }
            - call: "POST /sourcing/approved-sources/${src_id}/contracts/${ctr_id}/activate"
              payload: {}
              as: ProcurementManager
          trigger:
            - call: "POST /sourcing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /sourcing/approved-sources/${src_id}/contracts"
              payload: {}
              as: ProcurementManager
              captures: { ctr_st: "$.data[0].status" }
          assert:
            - "Contract status == EXPIRED after clock reaches window_end exactly (end-exclusive sweep)"

      - name: declaration_supersede_on_recollect
        claim_type: side_effect_execution
        grounds:
          - state_machines.RegulatoryDeclaration.CURRENT_to_SUPERSEDED
        distinguishing_aspect: "Collecting a second ALLERGEN declaration supersedes the first; exactly one CURRENT declaration per (source, type) remains."
        test_recipe:
          setup:
            - "Ingredient EFFECTIVE spec; QUALIFIED supplier; PROVISIONAL source with one CURRENT ALLERGEN declaration"
          setup_api_calls:
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "ENZ-DCL", name: "Decl Enzyme", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
              captures: { ing_id: $.data.id, ing_v: $.data.version }
            - call: "POST /sourcing/ingredients/${ing_id}/specs"
              payload: { spec_version_label: "v1", effective_date: "2026-07-01T00:00:00Z", version_note: "initial spec version", expected_ingredient_version: "${ing_v}" }
              as: SpecAuthor
              as_user_id: author-1
              captures: { spec_id: $.data.id }
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/parameters"
              payload: { parameter_name: "moisture", criticality: "MINOR", uom: "percent", target_value: 5, min_value: 0, max_value: 10 }
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/submit"
              payload: {}
              as: SpecAuthor
              as_user_id: author-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/approve"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/ingredients/${ing_id}/specs/${spec_id}/make-effective"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/suppliers"
