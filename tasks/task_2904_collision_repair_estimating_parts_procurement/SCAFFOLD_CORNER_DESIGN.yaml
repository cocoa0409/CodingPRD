      - name: second_decision_on_an_approved_supplement_is_refused_as_not_open
        claim_type: idempotency
        grounds:
          - state_machines.Supplement.SUBMITTED_to_APPROVED
          - validations.priority_41
          - errors.ERR_SUPPLEMENT_NOT_OPEN
        distinguishing_aspect: >-
          APPROVED is terminal for a supplement: a second decision - even a contradictory DENY - is
          ERR_SUPPLEMENT_NOT_OPEN (409), and the money it already released is untouched. Without this
          lockdown the approved amount could be re-applied and the authorisation ceiling would drift.
        test_recipe:
          setup:
            - "A locked RepairOrder (BODY 4.5 h; labor 27000, supplies 1080, pre-tax 28080) with deductible 25000 and initial authorisation 400000."
            - "Supplement S1 for 24000 carrying a BODY 4.0 h line has been APPROVED, taking approved_labor_hours to 8.5, labor to 51000, supplies to 2040, pre-tax to 53040, insurer to 28040 and customer_pay to 25000."
