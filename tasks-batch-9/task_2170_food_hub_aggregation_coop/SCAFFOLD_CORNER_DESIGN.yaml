scaffold_corner_design:
- section: entities
  instances:
  - name: create_producer_returns_201_with_declared_defaults
    claim_type: creation
    grounds:
    - entities.Producer
    - endpoints[POST /producers]
    distinguishing_aspect: A freshly created Producer must come back with onboarding_status DRAFT, compliance_ok false, food_safety_tier TIER_NONE, review_cycles 0, suspension_count 0, all four money fields
      0 and version 1, with a bare UUID id carrying no type prefix.
    test_recipe:
      setup:
      - Empty database.
      - Logical clock untouched at its 2026-08-01T00:00:00Z default.
      setup_api_calls: []
      trigger:
      - call: POST /producers
        payload:
          legal_name: Green Acres Farm
          region_code: NEV
          contact_email: ga@example.org
        as: HubAdmin
        as_user_id: hub-admin-1
        captures:
          p1_id: $.data.id
          p1_v: $.data.version
      assert:
      - the response status is 201
      - Producer.${p1_id}.onboarding_status == DRAFT
      - Producer.${p1_id}.compliance_ok == false
      - Producer.${p1_id}.food_safety_tier == TIER_NONE
      - Producer.${p1_id}.review_cycles == 0 and Producer.${p1_id}.suspension_count == 0
      - Producer.${p1_id}.paid_in_capital_cents == 0 and Producer.${p1_id}.voting_shares == 0
      - Producer.${p1_id}.patronage_volume_cents == 0 and Producer.${p1_id}.retained_patronage_cents == 0 and Producer.${p1_id}.shrink_charge_cents == 0
      - ${p1_v} == 1
      - ${p1_id} matches the bare UUID form with no type prefix
  - name: get_producer_with_unknown_id_returns_not_found
    claim_type: not_found
    grounds:
    - errors[ERR_PRODUCER_NOT_FOUND]
    - endpoints[GET /producers/{id}]
    - validations[priority=4]
    distinguishing_aspect: A GET against a syntactically valid but unknown producer id must return HTTP 404 with ERR_PRODUCER_NOT_FOUND, not an empty object or a 200.
    test_recipe:
      setup:
      - Empty database - no Producer rows exist.
      setup_api_calls: []
      trigger:
      - call: GET /producers/00000000-0000-4000-8000-000000000000
        payload: {}
        as: HubAdmin
        as_user_id: hub-admin-1
        captures:
          err_id: $.data.error_id
      assert:
      - the response status is 404
      - ${err_id} == ERR_PRODUCER_NOT_FOUND
  - name: list_products_paginates_with_limit_offset_and_total_count
    claim_type: listing
    grounds:
    - endpoints[GET /products]
    - entities.Product
    distinguishing_aspect: GET /products with limit 2 and offset 0 over three LISTED products of the same producer must return exactly 2 rows with total_count 3 and has_more true, and offset 2 must return
      1 row with has_more false.
    test_recipe:
      setup:
      - Producer P1 is ACTIVE and compliant.
      - P1 owns exactly three DRAFT products PR1, PR2, PR3, all CARROT_LOOSE / CASE / CHILL at 1800 cents.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: HubAdmin
        as_user_id: hub-admin-1
      - call: POST /producers
        payload:
          legal_name: Green Acres Farm
          region_code: NEV
          contact_email: ga@example.org
        as: HubAdmin
        as_user_id: hub-admin-1
        captures:
          p1_id: $.data.id
      - call: POST /producers/${p1_id}/documents
        payload:
          doc_type: GAP_AUDIT
          issued_on: '2026-01-01T00:00:00Z'
          expires_on: '2027-01-01T00:00:00Z'
        as: Producer
        as_user_id: ${p1_id}
        captures:
          p1_gap: $.data.id
      - call: POST /producers/${p1_id}/documents
        payload:
          doc_type: LIABILITY_INSURANCE
          issued_on: '2026-01-01T00:00:00Z'
          expires_on: '2027-01-01T00:00:00Z'
        as: Producer
        as_user_id: ${p1_id}
        captures:
          p1_ins: $.data.id
      - call: POST /producers/${p1_id}/documents
        payload:
          doc_type: HACCP_PLAN
          issued_on: '2026-01-01T00:00:00Z'
          expires_on: '2027-01-01T00:00:00Z'
        as: Producer
        as_user_id: ${p1_id}
        captures:
          p1_hac: $.data.id
      - call: POST /producers/${p1_id}/application
        payload: {}
        as: Producer
        as_user_id: ${p1_id}
      - call: POST /producer-documents/${p1_gap}/adjudication
        payload:
          decision: VERIFY
        as: ComplianceOfficer
        as_user_id: co-verify-1
      - call: POST /producer-documents/${p1_ins}/adjudication
        payload:
          decision: VERIFY
        as: ComplianceOfficer
        as_user_id: co-verify-1
      - call: POST /producer-documents/${p1_hac}/adjudication
        payload:
          decision: VERIFY
        as: ComplianceOfficer
        as_user_id: co-verify-1
      - call: POST /producers/${p1_id}/review
        payload:
          decision: APPROVE
        as: ComplianceOfficer
        as_user_id: co-approve-9
      - call: POST /products
        payload:
          producer_id: ${p1_id}
          commodity_code: CARROT_LOOSE
          unit_of_measure: CASE
          storage_class: CHILL
          pack_weight_lb: 25
          units_per_pallet: 40
          producer_unit_price_cents: 1800
        as: Producer
        as_user_id: ${p1_id}
        captures:
          pr1_id: $.data.id
          pr1_v: $.data.version
      - call: POST /products/${pr1_id}/offers
        payload:
          quantity_offered: 100
          offer_window_start: '2026-09-01T00:00:00Z'
          offer_window_end: '2026-12-01T00:00:00Z'
          expected_product_version: ${pr1_v}
        as: Producer
        as_user_id: ${p1_id}
      - call: POST /products
        payload:
          producer_id: ${p1_id}
          commodity_code: CARROT_LOOSE
          unit_of_measure: CASE
          storage_class: CHILL
          pack_weight_lb: 25
          units_per_pallet: 40
          producer_unit_price_cents: 1800
        as: Producer
        as_user_id: ${p1_id}
        captures:
          pr2_id: $.data.id
          pr2_v: $.data.version
      - call: POST /products/${pr2_id}/offers
        payload:
          quantity_offered: 100
          offer_window_start: '2026-09-01T00:00:00Z'
          offer_window_end: '2026-12-01T00:00:00Z'
          expected_product_version: ${pr2_v}
        as: Producer
        as_user_id: ${p1_id}
      - call: POST /products
        payload:
          producer_id: ${p1_id}
          commodity_code: CARROT_LOOSE
          unit_of_measure: CASE
          storage_class: CHILL
          pack_weight_lb: 25
          units_per_pallet: 40
          producer_unit_price_cents: 1800
        as: Producer
        as_user_id: ${p1_id}
        captures:
          pr3_id: $.data.id
          pr3_v: $.data.version
      - call: POST /products/${pr3_id}/offers
        payload:
          quantity_offered: 100
          offer_window_start: '2026-09-01T00:00:00Z'
          offer_window_end: '2026-12-01T00:00:00Z'
          expected_product_version: ${pr3_v}
        as: Producer
        as_user_id: ${p1_id}
      trigger:
      - call: GET /products
        payload:
          producer_id: ${p1_id}
          limit: 2
          offset: 0
        as: HubAdmin
        as_user_id: hub-admin-1
        captures:
          first_id: $.data[0].id
      - call: GET /products
        payload:
          producer_id: ${p1_id}
          limit: 2
          offset: 2
        as: HubAdmin
        as_user_id: hub-admin-1
      assert:
      - the first response carries exactly 2 elements with meta pagination total_count 3 and has_more true
      - the second response carries exactly 1 element with total_count 3 and has_more false
      - ${first_id} == ${pr1_id}
