            - "the STENT call returns 422 with data.error_id == ERR_NO_ELIGIBLE_LOT because the candidate set is empty for that device_type"
            - "the 100-unit BALLOON call returns 409 with data.error_id == ERR_INSUFFICIENT_DEVICE_STOCK: aggregate headroom is only 4 (lots A and B now have zero headroom and are no longer candidates)"
            - "the final read shows lot C still at quantity_reserved 1 — the failed all-or-nothing call reserved nothing and did not bump lot C's version"
            - "GET /device-usages?procedure_id=${proc_id} returns total_count 3, all state RESERVED, ordered by created_at ASC"

      - name: maturation_failure_reasons_are_ascii_sorted_when_several_criteria_fail
        claim_type: correct_result
        grounds:
          - calculations.maturation_readiness
          - state_machines.AccessConversionPlan.ACTIVE_to_MATURATION_HOLD
        distinguishing_aspect: "The five reason codes are appended in evaluation order DIAMETER, FLOW, DEPTH, MATURATION_DAYS, SURVEILLANCE_COUNT and then `sorted()`, so the wire order is ASCII ascending — DEPTH must come first even though it is evaluated third."
        test_recipe:
          setup:
            - "one IN_USE tunneled catheter as from_access, one PLANNED AVF target placed 2026-07-25 with zero readings, and an ACTIVE conversion plan between them"
          setup_api_calls:
            - call: "POST /dialysis-facilities"
              payload: { name: "Corner Dialysis Twenty Five", facility_code: "C-25" }
              as: CenterAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MC-25", full_name: "Petra Nowak", dialysis_facility_id: "${fac_id}", dialysis_modality: "IN_CENTER_HD", payer_program: "FEE_FOR_SERVICE" }
              as: CenterAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /vascular-accesses"
              payload: { patient_id: "${pat_id}", access_type: "TUNNELED_CATHETER", laterality: "RIGHT", site: "CHEST", placed_on: "2026-05-01" }
              as: AccessCoordinator
              captures: { from_id: $.data.id }
            - call: "POST /vascular-accesses/${from_id}/status"
              payload: { to_status: "PLACED" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${from_id}/status"
              payload: { to_status: "IN_USE" }
              as: AccessCoordinator
              captures: { from_v: $.data.version }
            - call: "POST /vascular-accesses"
              payload: { patient_id: "${pat_id}", access_type: "AVF", laterality: "LEFT", site: "UPPER_ARM", placed_on: "2026-07-25", predecessor_access_id: "${from_id}" }
              as: AccessCoordinator
              captures: { target_id: $.data.id }
            - call: "POST /access-conversion-plans"
              payload: { patient_id: "${pat_id}", from_access_id: "${from_id}", target_access_id: "${target_id}", target_access_type: "AVF", target_conversion_date: "2026-10-01", expected_access_version: "${from_v}" }
              as: AccessCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /access-conversion-plans/${plan_id}/activate"
              payload: {}
              as: AccessCoordinator
          trigger:
            - call: "POST /access-conversion-plans/${plan_id}/maturation-checks"
              payload: { diameter_mm: 5.9, flow_ml_min: 599, depth_mm: 6.1 }
              as: AccessCoordinator
          assert:
            - "all five criteria fail: 5.9 < 6.0, 599 < 600, 6.1 > 6.0, days_since_placement == 7 (2026-08-01 minus 2026-07-25) < 42, reading_count 0 < 2"
            - "data.readiness_failure_reasons == [\"DEPTH\", \"DIAMETER\", \"FLOW\", \"MATURATION_DAYS\", \"SURVEILLANCE_COUNT\"] — ASCII order, not evaluation order"
            - "data.readiness_met == false and data.status == MATURATION_HOLD (ACTIVE -> MATURATION_HOLD on a failing check)"
            - "data.maturation_check_count == 1, data.last_check_at == 2026-08-01T00:00:00Z, data.last_diameter_mm == 5.9, data.last_flow_ml_min == 599, data.last_depth_mm == 6.1, data.days_since_placement == 7"
            - "VascularAccess.${target_id}.status is still PLANNED — a failed check never advances the target access"

      - name: input_set_filtering_excludes_declined_referrals_from_the_window
        claim_type: input_set_filtering
        grounds:
          - calculations.facility_partnership_score.input_set
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / triage_legality_depends_on_the_facility_posture_and_is_restored_by_declining_a_sibling
          rationale: "That instance declines a sibling referral, drops it out of the window filter and shows the score and posture recovering as a result."

      - name: precision_of_the_per_line_rounding_before_summation
        claim_type: precision
        grounds:
          - calculations.procedure_allowed_amount.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / allowed_amount_rounds_each_line_before_summation_with_modifier_and_bundling
          rationale: "That instance pins a case where rounding per line and rounding the sum differ by one cent (225101 vs 225100)."

      - name: variant_divergence_between_bundled_esrd_and_fee_for_service
        claim_type: variant_divergence
        grounds:
          - calculations.procedure_allowed_amount.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / reimbursement_bundled_esrd_vs_fee_for_service_divergence
          rationale: "That instance runs identical code lines under both payer programs and asserts the exact delta."

      - name: variant_selection_between_trend_based_and_absolute_based
        claim_type: variant_selection
        grounds:
          - calculations.referral_triage_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / triage_trend_based_vs_absolute_based_on_identical_latest_reading
          rationale: "That instance holds the latest reading fixed and flips only the reading count, so the variant selector alone changes the score."

      - name: threshold_boundaries_of_the_maturation_criteria
        claim_type: threshold
        grounds:
          - calculations.maturation_readiness.constants
        excluded_because:
          difficulty_instance: boundary_precision_check / maturation_day_forty_two_and_flow_six_hundred_are_inclusive_boundaries
          rationale: "That instance tests day 41 vs day 42 and flow 599 vs flow 600 on the same plan."

      - name: constraint_propagation_reaches_a_fixed_point_in_one_pass
        claim_type: constraint_propagation
        grounds:
          - calculations.facility_partnership_score.algorithm
        excluded_because:
          difficulty_instance: combinatorial_formula / partnership_score_breaks_its_own_cycle_by_reading_the_previously_persisted_tier
          rationale: "That instance proves the single-pass rule by showing the grace credit lag one evaluation behind the tier it produces."

  - section: validations
    instances:
      - name: booking_a_slot_before_the_clock_is_rejected
        claim_type: violation_error
        grounds:
          - validations.priority_16_ERR_SCHEDULE_IN_PAST
          - endpoints.POST_procedures
        distinguishing_aspect: "scheduled_start is compared against the injectable clock (2026-08-01T00:00:00Z at startup), not against wall-clock time, so a slot on 2026-07-31 is in the past and is refused with ERR_SCHEDULE_IN_PAST even though every FK, role and capacity check would pass."
        test_recipe:
          setup:
            - "one TRIAGED ROUTINE referral, one free room and one interventionalist"
          setup_api_calls:
            - call: "POST /dialysis-facilities"
              payload: { name: "Corner Dialysis Thirty One", facility_code: "C-31" }
              as: CenterAdmin
              captures: { fac_id: $.data.id }
