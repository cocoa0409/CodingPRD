              as: BillingSpecialist
              captures: { err_mu: $.data.error_id }
          assert:
            - "the response status is 422 and ${err_mu} == ERR_MAKEUP_CREDIT_EXCEEDED"
            - "SupplyContract.${k_fab}.makeup_credit_balance_cents remains 0"

      - name: blackout_closed_interval_touching_rules
        claim_type: Temporal validation
        grounds:
          - validations[priority=6]
          - errors[ERR_TURNAROUND_IN_BLACKOUT]
          - entities.Customer.fields.blackout_windows
        distinguishing_aspect: "Mixed interval algebra: a half-open turnaround window ending exactly at a closed blackout's start shares no instant and schedules, while one starting on the blackout's inclusive end date conflicts."
        test_recipe:
          setup:
            - "Customer BlackCo with blackout_windows [[2027-03-10T00:00:00Z, 2027-03-20T00:00:00Z]]; ONSITE contract ACTIVE; plant OPERATING."
          setup_api_calls:
            - *k_clock
