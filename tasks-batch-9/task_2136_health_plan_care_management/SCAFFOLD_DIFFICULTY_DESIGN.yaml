          - entities.CommunityResource.fields.concurrent_slot_capacity
        distinguishing_aspect: |
          Overlap rule two occupies a different resource entity, CommunityResource, with different
          interval semantics: plain half-open intervals, no buffer, and an aggregate capacity of 2.
          A third referral covering 11:00 is rejected because three intervals cover that instant,
