            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${i1}", purpose: "INITIAL", scheduled_start_at: "2026-08-05T13:00:00Z", scheduled_end_at: "2026-08-05T13:00:00Z" }
              as: FieldInspector
              as_user_id: "${i1}"
              captures: { e4: "$.data.error_id" }
            - call: "POST /inspections/${ins1}/findings"
              payload: { grid_ref: "K1", finding_type: "ACTIVE_INFESTATION", organism: "SUBTERRANEAN_TERMITE", conducive_code: "NONE" }
              as: FieldInspector
              as_user_id: "${i1}"
              captures: { e5: "$.data.error_id" }
            - call: "POST /inspections/${ins1}/findings"
              payload: { grid_ref: "C4", finding_type: "DAMAGE", organism: "SUBTERRANEAN_TERMITE", conducive_code: "NONE", damage_estimate_usd: 0.00, pre_existing: false }
              as: FieldInspector
              as_user_id: "${i1}"
              captures: { e6: "$.data.error_id" }
            - call: "GET /inspections"
              payload: { property_id: "${p1}", limit: 0, offset: 0 }
              as: ComplianceOfficer
              captures: { e7: "$.data.error_id" }
            - call: "GET /inspections"
              payload: { property_id: "${p1}", limit: 101, offset: 0 }
