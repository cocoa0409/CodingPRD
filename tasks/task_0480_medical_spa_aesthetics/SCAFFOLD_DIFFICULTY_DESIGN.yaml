          assert:
            - "trigger response error_id == ERR_STANDING_ORDER_INACTIVE"
            - "trigger response http_status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: loyalty_points_conserved_under_commit_then_refund
        grounds:
          - calculations.loyalty_points_ledger
          - state_machines.TreatmentSession.BOOKED_to_COMMITTED
          - state_machines.ComplicationCase.OPEN_to_RESOLVED
          - entities.LoyaltyAccount.fields.points_balance
        distinguishing_aspect: |
          Conserved quantity = loyalty points. Patient earns 339 points on session 1
          (no redemption), then on session 2 redeems 200 and earns 224; a REFUND
          resolution of session 2's complication reverses exactly session 2's
          224 earned and 200 redeemed, restoring points_earned=339, points_redeemed=0,
          points_balance=339 (identical to the post-session-1 ledger).
        test_recipe:
          setup:
            - "PLUS member with LoyaltyAccount; ACTIVE 2-session plan; session 1 COMMITTED (earn 339, redeem 0); session 2 COMMITTED (20u @1333, redeem 200, earn 224) with an OPEN MODERATE complication."
          setup_api_calls:
            - call: "POST /aesthetics/membership-packages"
              payload: { tier: "PLUS", member_discount_pct: 0.15, loyalty_program: "ALLE", monthly_fee_cents: 9900 }
              as: ClinicAdmin
              captures: { ci_pkg: $.data.id }
            - call: "POST /aesthetics/providers"
              payload: { full_name: "Ci Inj", license_number: "L-CI-I", role_kind: "INJECTOR" }
