# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_2468_retirement_plan_committee_investment_menu_governance
#
# Breadth probe over the §1.1–§1.7 surface of SCAFFOLD.yaml. Every instance
# carries an executable test_recipe whose setup_api_calls drive empty-DB into
# the precondition using only endpoints declared in §1.5.
#
# Reusable setup layers are published as YAML anchors on their first use and
# aliased thereafter:
#   L1  b_clock .. b_charter        governed plan (menu_slot_capacity 6,
#                                  quorum floor 3), 3 filled voting seats,
#                                  3 ACTIVE members, charter ADOPTED
#   L2  b_ips_draft .. b_posture_open  IPS-2026-A ADOPTED via meeting 1,
#                                  menu_posture recomputed to OPEN
#   L3  b_fund_lc_a .. b_seat_tips  7 funds, 5 CORE slots seated
#                                  (1 PENDING_REPLACEMENT of 5 = 0.2000 keeps
#                                  the posture OPEN through an execution)
#   L4  b_review_q0 .. b_finalize_q0   quarter-0 review scored and FINALIZED
#   L5  b_prop_lc .. b_prop_execute large-cap replacement approved, noticed,
#                                  executed inside the blackout window
#
# The cumulative chains are also anchored as whole sequences (*chain_l2,
# *chain_l3, *chain_l4, *chain_l5) so an instance that needs a layer verbatim
# can alias it in one line. YAML cannot splice a sequence, so when an instance
# needs a handful of calls beyond an aliased chain those extra calls lead its
# `trigger:` list and the `setup:` prose says so.
#
# One further convention: where a longer chain is itself built on an earlier one
# (e.g. *chain_qdia), the earlier chain appears as the FIRST ITEM of the new
# sequence (`- *chain_l3`). Read that item as "replay that chain verbatim, then
# continue with the calls that follow" — it is a nesting, not a call.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: plan_create_starts_draft_charter_frozen_posture_and_full_capacity
        claim_type: Creation
        grounds:
          - entities.Plan
          - endpoints.POST_/governance/plans
          - calculations.menu_slot_capacity
        distinguishing_aspect: "A plan created with menu_slot_capacity 6 returns 201 with charter_status DRAFT, menu_posture FROZEN, fiscal_quarter_index 0, version 1 and the capacity triple 0 occupied / 0 reserved / 6 available — every one of those five is server-derived, never client-supplied."
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to its declared default instant 2026-08-01T00:00:00Z."
          setup_api_calls:
            - &b_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
          trigger:
            - &b_plan
              call: "POST /governance/plans"
              payload: { plan_name: "Ridgeline Manufacturing 401(k) Plan", plan_sponsor_name: "Ridgeline Manufacturing Inc.", erisa_covered: true, participant_account_count: 1200, menu_slot_capacity: 6, quorum_min_voting_members: 3, voting_threshold_pct: 0.6000, max_voting_seats: 5, notice_lead_days_required: 30, blackout_buffer_days: 3, fiscal_quarter_index: 0 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { plan_id: $.data.id, plan_v_created: $.data.version }
          assert:
            - "the response status is 201 and response_type is object"
            - "Plan.${plan_id}.charter_status == DRAFT and Plan.${plan_id}.charter_adopted_quarter_index is null"
            - "Plan.${plan_id}.menu_posture == FROZEN and Plan.${plan_id}.fiscal_quarter_index == 0"
            - "Plan.${plan_id}.occupied_menu_slots == 0 and reserved_menu_slots == 0 and available_menu_slots == 6"
            - "Plan.${plan_id}.revenue_credit_accrued_cents == 0 and revenue_credit_allocated_cents == 0 and revenue_credit_balance_cents == 0"
            - "Plan.${plan_id}.fee_disclosure_status == COMPLIANT and at_risk_slot_ratio == 0.0000"
            - "Plan.${plan_id}.version == 1 and created_at and updated_at are non-null"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: committee_seat_create_starts_vacant_with_zero_vacant_quarters
        claim_type: Creation
        grounds:
          - entities.CommitteeSeat
          - endpoints.POST_/governance/committee-seats
          - state_machines.CommitteeSeat.initial_state
        distinguishing_aspect: "A seat is created in status VACANT with consecutive_vacant_quarters 0 even though the plan's charter is still DRAFT — seat creation is the one committee write that does not require an ADOPTED charter."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one plan in charter_status DRAFT."
          setup_api_calls:
            - *b_clock
            - *b_plan
          trigger:
            - &b_seat_chair
              call: "POST /governance/committee-seats"
              payload: { plan_id: "${plan_id}", seat_code: "S-CHAIR", seat_class: "CHAIR", voting: true, seat_index: 1 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { seat_chair_id: $.data.id }
          assert:
            - "the response status is 201"
            - "CommitteeSeat.${seat_chair_id}.status == VACANT and consecutive_vacant_quarters == 0"
            - "CommitteeSeat.${seat_chair_id}.plan_id == ${plan_id} and voting == true and seat_index == 1"
            - "CommitteeSeat.${seat_chair_id}.version == 1"
            - "GET /governance/committee-seats?plan_id=${plan_id}&status=VACANT returns exactly 1 row"

      - name: member_appointment_fills_its_seat_and_starts_appointed
        claim_type: Parent Relationships
        grounds:
          - entities.CommitteeMember
          - entities.CommitteeSeat.fields.status
          - state_machines.CommitteeSeat.VACANT_to_FILLED
        distinguishing_aspect: "Creating a CommitteeMember is the only way a CommitteeSeat leaves VACANT: the appointment lands in status APPOINTED with acceptance_signed_at null and fiduciary_training_status PENDING, and the parent seat flips to FILLED in the same request."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one plan with one VACANT voting chair seat."
          setup_api_calls:
            - *b_clock
            - *b_plan
            - *b_seat_chair
          trigger:
            - &b_mem_chair
              call: "POST /governance/committee-members"
              payload: { seat_id: "${seat_chair_id}", member_name: "Dana Okonjo", term_start_date: "2026-01-01", term_end_date: "2027-12-31", affiliated_provider_role: "NONE" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { mem_chair_id: $.data.id }
          assert:
            - "the response status is 201"
            - "CommitteeMember.${mem_chair_id}.status == APPOINTED and acceptance_signed_at is null"
            - "CommitteeMember.${mem_chair_id}.fiduciary_training_status == PENDING and independence_flag == true"
            - "CommitteeMember.${mem_chair_id}.votes_cast_count == 0 and end_term_reason is null"
            - "CommitteeSeat.${seat_chair_id}.status == FILLED and consecutive_vacant_quarters == 0"
            - "GET /governance/committee-members?seat_id=${seat_chair_id} returns exactly 1 row"

      - name: training_record_assign_applies_declared_defaults_and_moves_member_to_training_assigned
        claim_type: Defaults
        grounds:
          - entities.FiduciaryTrainingRecord.fields.status
          - entities.FiduciaryTrainingRecord.fields.validity_quarters
          - state_machines.CommitteeMember.APPOINTED_to_TRAINING_ASSIGNED
        distinguishing_aspect: "Omitting status and validity_quarters stores ASSIGNED and 8 (not null), stamps assigned_quarter_index from Plan.fiscal_quarter_index 0, leaves completed_quarter_index and score_pct null, and moves the member APPOINTED -> TRAINING_ASSIGNED without touching Plan.documented_acceptance_count."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one APPOINTED member on a FILLED chair seat; Plan.fiscal_quarter_index == 0."
          setup_api_calls:
            - *b_clock
            - *b_plan
            - *b_seat_chair
            - *b_mem_chair
          trigger:
            - &b_tr_chair_duties
              call: "POST /governance/training-records"
              payload: { member_id: "${mem_chair_id}", module_code: "FIDUCIARY_DUTIES" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { tr_chair_duties_id: $.data.id }
          assert:
            - "the response status is 201"
            - "FiduciaryTrainingRecord.${tr_chair_duties_id}.status == ASSIGNED and validity_quarters == 8"
            - "FiduciaryTrainingRecord.${tr_chair_duties_id}.assigned_quarter_index == 0 and completed_quarter_index is null and score_pct is null"
            - "CommitteeMember.${mem_chair_id}.status == TRAINING_ASSIGNED and fiduciary_training_status == PENDING (calculations.fiduciary_training_status: a required module that is neither COMPLETED nor WAIVED yields PENDING)"
            - "Plan.${plan_id}.documented_acceptance_count == 0"

      - name: plan_documented_acceptance_count_is_a_count_not_a_counter
        claim_type: Computed Fields
        grounds:
          - entities.Plan.fields.documented_acceptance_count
          - endpoints.POST_/governance/plans/{planId}/charter/adopt
          - endpoints.POST_/governance/committee-members/{memberId}/activate
        distinguishing_aspect: "Three members that each signed acceptance and then activated leave documented_acceptance_count at exactly 3, not 6: §1.1 defines it as count(members with acceptance_signed_at IS NOT NULL and status IN {ACCEPTANCE_PENDING, ACTIVE}), so the activate side effect 'documented_acceptance_count += 1' must not double-count the acceptance that already qualified the row."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; plan with three voting seats (CHAIR / FINANCE / HR) filled by members whose terms cover the clock instant."
            - "Each member carries FIDUCIARY_DUTIES completed at 95.00 plus IPS_MECHANICS and PROHIBITED_TRANSACTIONS waived — that covers every module both §1.2 (FIDUCIARY_DUTIES + IPS_MECHANICS) and §1.3 (FIDUCIARY_DUTIES + PROHIBITED_TRANSACTIONS) treat as required. INVESTMENT_BASICS, named only inside calculations.fiduciary_training_status, is not a value of the module_code enum and therefore cannot be assigned."
            - "The HR seat holder is affiliated with the recordkeeper, which makes her independence_flag false without affecting quorum."
          setup_api_calls:
            - *b_clock
            - *b_plan
            - *b_seat_chair
            - *b_mem_chair
            - *b_tr_chair_duties
            - &b_tr_chair_done
              call: "POST /governance/training-records/${tr_chair_duties_id}/complete"
              payload: { score_pct: 95.00 }
              as: CommitteeMember
              as_user_id: "${mem_chair_id}"
            - &b_tr_chair_ips
              call: "POST /governance/training-records"
              payload: { member_id: "${mem_chair_id}", module_code: "IPS_MECHANICS", status: "WAIVED", waiver_basis: "Holds ASPPA QKA credential renewed 2025-11-30" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - &b_tr_chair_ptx
              call: "POST /governance/training-records"
              payload: { member_id: "${mem_chair_id}", module_code: "PROHIBITED_TRANSACTIONS", status: "WAIVED", waiver_basis: "ERISA 406 counsel attestation on file 2025-12-04" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - &b_acc_chair
              call: "POST /governance/committee-members/${mem_chair_id}/acceptance"
              payload: { acceptance_doc_ref: "ACC-CHAIR-2026-01" }
              as: CommitteeMember
              as_user_id: "${mem_chair_id}"
            - &b_act_chair
              call: "POST /governance/committee-members/${mem_chair_id}/activate"
              payload: {}
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - &b_seat_fin
              call: "POST /governance/committee-seats"
              payload: { plan_id: "${plan_id}", seat_code: "S-FIN", seat_class: "FINANCE", voting: true, seat_index: 2 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { seat_fin_id: $.data.id }
            - &b_mem_fin
              call: "POST /governance/committee-members"
              payload: { seat_id: "${seat_fin_id}", member_name: "Ivan Serrano", term_start_date: "2026-01-01", term_end_date: "2027-12-31", affiliated_provider_role: "NONE" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { mem_fin_id: $.data.id }
            - &b_tr_fin_duties
              call: "POST /governance/training-records"
              payload: { member_id: "${mem_fin_id}", module_code: "FIDUCIARY_DUTIES" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { tr_fin_duties_id: $.data.id }
            - &b_tr_fin_done
              call: "POST /governance/training-records/${tr_fin_duties_id}/complete"
              payload: { score_pct: 91.00 }
              as: CommitteeMember
              as_user_id: "${mem_fin_id}"
            - &b_tr_fin_ips
              call: "POST /governance/training-records"
              payload: { member_id: "${mem_fin_id}", module_code: "IPS_MECHANICS", status: "WAIVED", waiver_basis: "CFA charterholder IPS module waiver 2025-10-01" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - &b_tr_fin_ptx
              call: "POST /governance/training-records"
              payload: { member_id: "${mem_fin_id}", module_code: "PROHIBITED_TRANSACTIONS", status: "WAIVED", waiver_basis: "Prior year prohibited transaction training on file" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - &b_acc_fin
              call: "POST /governance/committee-members/${mem_fin_id}/acceptance"
              payload: { acceptance_doc_ref: "ACC-FIN-2026-01" }
              as: CommitteeMember
              as_user_id: "${mem_fin_id}"
            - &b_act_fin
              call: "POST /governance/committee-members/${mem_fin_id}/activate"
              payload: {}
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - &b_seat_hr
              call: "POST /governance/committee-seats"
              payload: { plan_id: "${plan_id}", seat_code: "S-HR", seat_class: "HR", voting: true, seat_index: 3 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { seat_hr_id: $.data.id }
            - &b_mem_hr
              call: "POST /governance/committee-members"
              payload: { seat_id: "${seat_hr_id}", member_name: "Rosa Lindqvist", term_start_date: "2026-01-01", term_end_date: "2027-12-31", affiliated_provider_role: "RECORDKEEPER" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { mem_hr_id: $.data.id }
            - &b_tr_hr_duties
              call: "POST /governance/training-records"
              payload: { member_id: "${mem_hr_id}", module_code: "FIDUCIARY_DUTIES" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { tr_hr_duties_id: $.data.id }
            - &b_tr_hr_done
              call: "POST /governance/training-records/${tr_hr_duties_id}/complete"
              payload: { score_pct: 88.00 }
              as: CommitteeMember
              as_user_id: "${mem_hr_id}"
            - &b_tr_hr_ips
              call: "POST /governance/training-records"
              payload: { member_id: "${mem_hr_id}", module_code: "IPS_MECHANICS", status: "WAIVED", waiver_basis: "Recordkeeper IPS mechanics curriculum completed 2025" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - &b_tr_hr_ptx
              call: "POST /governance/training-records"
              payload: { member_id: "${mem_hr_id}", module_code: "PROHIBITED_TRANSACTIONS", status: "WAIVED", waiver_basis: "Annual party-in-interest training attested 2025-12-11" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - &b_acc_hr
              call: "POST /governance/committee-members/${mem_hr_id}/acceptance"
              payload: { acceptance_doc_ref: "ACC-HR-2026-01" }
              as: CommitteeMember
              as_user_id: "${mem_hr_id}"
            - &b_act_hr
              call: "POST /governance/committee-members/${mem_hr_id}/activate"
              payload: {}
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
          trigger:
            - &b_charter
              call: "POST /governance/plans/${plan_id}/charter/adopt"
              payload: { quorum_min_voting_members: 3, voting_threshold_pct: 0.6000, max_voting_seats: 5, charter_doc_ref: "CHARTER-2026-A" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { plan_v_charter: $.data.version }
          assert:
            - "the response status is 200"
            - "Plan.${plan_id}.charter_status == ADOPTED and charter_adopted_quarter_index == 0"
            - "Plan.${plan_id}.documented_acceptance_count == 3"
            - "CommitteeMember.${mem_chair_id}.status == ACTIVE and fiduciary_training_status == CURRENT"
            - "CommitteeMember.${mem_fin_id}.status == ACTIVE and CommitteeMember.${mem_hr_id}.status == ACTIVE"
            - "CommitteeMember.${mem_hr_id}.independence_flag == false and CommitteeMember.${mem_chair_id}.independence_flag == true"
            - "Plan.${plan_id}.version == ${plan_v_charter} and ${plan_v_charter} > ${plan_v_created}"

      - name: plan_read_reports_open_posture_and_capacity_triple_after_ips_adoption
        claim_type: Retrieval
        grounds:
          - endpoints.GET_/governance/plans/{planId}
          - calculations.menu_posture
          - endpoints.POST_/governance/investment-policy-statements/{ipsId}/adopt
        distinguishing_aspect: "A read-only PlanAuditor GET returns the whole derived surface in one object: menu_posture OPEN (charter ADOPTED, an ADOPTED IPS exists, three active voting members meet the quorum floor of 3, and at_risk_slot_ratio is 0.0000 because no slot is counted yet) with the capacity triple 0 / 0 / 6 summing to menu_slot_capacity."
        test_recipe:
          setup:
            - "Governed plan from the charter instance above."
            - "IPS-2026-A drafted with TRAILING_PERIOD scoring, adopted under a carried IPS_ADOPTION motion whose meeting minutes are approved, then the posture explicitly recomputed."
          setup_api_calls:
            - *b_clock
            - *b_plan
            - *b_seat_chair
            - *b_mem_chair
            - *b_tr_chair_duties
            - *b_tr_chair_done
            - *b_tr_chair_ips
            - *b_tr_chair_ptx
            - *b_acc_chair
            - *b_act_chair
            - *b_seat_fin
            - *b_mem_fin
            - *b_tr_fin_duties
            - *b_tr_fin_done
            - *b_tr_fin_ips
            - *b_tr_fin_ptx
            - *b_acc_fin
            - *b_act_fin
            - *b_seat_hr
            - *b_mem_hr
            - *b_tr_hr_duties
            - *b_tr_hr_done
            - *b_tr_hr_ips
            - *b_tr_hr_ptx
            - *b_acc_hr
            - *b_act_hr
            - *b_charter
            - &b_ips_draft
              call: "POST /governance/investment-policy-statements"
              payload: { plan_id: "${plan_id}", version_label: "IPS-2026-A", scoring_variant: "TRAILING_PERIOD", watch_trigger_score_max: 40.00, remediation_trigger_score_max: 25.00, cure_margin_points: 10.00, expense_peer_multiple: 1.25, min_track_record_quarters: 12, style_drift_r2_floor: 0.8000, watch_grace_quarters: 2, weights: { performance: 0.40, peer: 0.20, expense: 0.20, style: 0.10, manager: 0.10 }, benchmark_map: { US_LARGE_CAP: "RUSSELL_1000_GROWTH", CORE_BOND: "BLOOMBERG_AGGREGATE", US_SMALL_CAP: "RUSSELL_2000", INTL_DEVELOPED: "MSCI_EAFE", TIPS: "BLOOMBERG_US_TIPS", TARGET_DATE: "SP_TARGET_DATE_INDEX" } }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { ips_a_id: $.data.id }
            - &b_meet1
              call: "POST /governance/committee-meetings"
              payload: { plan_id: "${plan_id}", meeting_date: "2026-08-03", quarter_index: 0 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { meet1_id: $.data.id }
            - &b_meet1_convene
              call: "POST /governance/committee-meetings/${meet1_id}/convene"
              payload: { attendee_member_ids: ["${mem_chair_id}", "${mem_fin_id}", "${mem_hr_id}"] }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - &b_motion_ips
              call: "POST /governance/motions"
              payload: { meeting_id: "${meet1_id}", subject_type: "IPS_ADOPTION", subject_id: "${ips_a_id}", tally_basis: "VOTES_CAST" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
              captures: { motion_ips_id: $.data.id }
            - &b_vote_ips_chair
              call: "POST /governance/motions/${motion_ips_id}/votes"
              payload: { member_id: "${mem_chair_id}", vote: "FOR" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - &b_vote_ips_fin
              call: "POST /governance/motions/${motion_ips_id}/votes"
              payload: { member_id: "${mem_fin_id}", vote: "FOR" }
              as: CommitteeMember
              as_user_id: "${mem_fin_id}"
            - &b_vote_ips_hr
              call: "POST /governance/motions/${motion_ips_id}/votes"
              payload: { member_id: "${mem_hr_id}", vote: "FOR" }
              as: CommitteeMember
              as_user_id: "${mem_hr_id}"
            - &b_motion_ips_close
              call: "POST /governance/motions/${motion_ips_id}/close"
              payload: {}
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - &b_meet1_adjourn
              call: "POST /governance/committee-meetings/${meet1_id}/adjourn"
              payload: {}
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - &b_meet1_minutes
              call: "POST /governance/committee-meetings/${meet1_id}/minutes-approve"
              payload: { minutes_doc_ref: "MIN-2026-Q0-001" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - &b_ips_adopt
              call: "POST /governance/investment-policy-statements/${ips_a_id}/adopt"
              payload: { approving_motion_id: "${motion_ips_id}" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - &b_posture_open
              call: "POST /governance/plans/${plan_id}/menu-posture/recompute"
              payload: {}
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
          trigger:
            - call: "GET /governance/plans/${plan_id}"
              payload: {}
              as: PlanAuditor
              as_user_id: "aud-1"
          assert:
            - "the response status is 200 and response_type is object"
            - "Plan.${plan_id}.menu_posture == OPEN and at_risk_slot_ratio == 0.0000"
            - "Plan.${plan_id}.occupied_menu_slots == 0 and reserved_menu_slots == 0 and available_menu_slots == 6"
            - "Plan.${plan_id}.total_plan_assets_cents == 0 and revenue_credit_balance_cents == 0"
            - "Plan.${plan_id}.fee_disclosure_status == COMPLIANT and draft_proposal_count == 0"
            - "InvestmentPolicyStatement.${ips_a_id}.status == ADOPTED and approving_motion_id == ${motion_ips_id} and scoring_variant == TRAILING_PERIOD"
            - "Motion.${motion_ips_id}.status == CARRIED and for_count == 3 and support_pct == 100.0000"
            - "CommitteeMeeting.${meet1_id}.status == MINUTES_APPROVED and quorum_met == true"

      - name: funds_list_paginates_and_filters_the_candidate_universe
        claim_type: Listing
        grounds:
          - endpoints.GET_/governance/funds
          - response_envelope.pagination_fields
          - endpoints.POST_/governance/asset-class-slots/{slotId}/seat-fund
        distinguishing_aspect: "With seven funds on the plan, limit 2 / offset 0 returns 2 rows with total_count 7 and has_more true, while menu_status=CANDIDATE returns exactly the two unseated funds — the five seated ones flipped to ACTIVE through seat-fund, not through any client-supplied menu_status."
