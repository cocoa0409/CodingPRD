      - name: manual_auth_suspension_never_auto_restores
        claim_type: conditional_cascade
        grounds: [state_machines.DriverAuthorization.SUSPENDED_to_ACTIVE, state_machines.FleetAccount.SUSPENDED_to_ACTIVE]
        distinguishing_aspect: "Only cascade-suspended (auto_suspended=true) authorizations restore on fleet reactivation; a manually suspended authorization stays SUSPENDED through a full suspend/reactivate cycle."
        test_recipe:
          setup:
            - "site 1 reservable stall; fleet F (credit 10000000, terms 30); driver D ACTIVE-authorized"
            - "settled FLEET_BILL booking in period 2026-08 (final 4500); invoice issued at 2026-09-01 (due 2026-09-30)"
            - "authorization manually SUSPENDED by the fleet manager before the overdue sweep"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /fleet-accounts", payload: { company_name: "F", credit_limit_cents: 10000000, payment_terms_days: 30 }, as: NetworkAdmin, captures: { fl: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-M1", full_name: "M One" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /driver-authorizations", payload: { driver_id: "${d1}", fleet_account_id: "${fl}" }, as: Driver, as_user_id: "${d1}", captures: { au: $.data.id } }
            - { call: "POST /driver-authorizations/${au}/transition", payload: { to: "ACTIVE" }, as: FleetManager, as_user_id: "${fl}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-03", night_count: 1, payment_mode: "FLEET_BILL", fleet_account_id: "${fl}" }, as: Driver, as_user_id: "${d1}", captures: { b1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T15:30:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings/${b1}/check-in", payload: {}, as: Driver, as_user_id: "${d1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T10:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings/${b1}/check-out", payload: {}, as: Driver, as_user_id: "${d1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /fleet-accounts/${fl}/close-billing-period", payload: { period: "2026-08" }, as: NetworkAdmin, captures: { inv: $.data.id } }
            - { call: "POST /driver-authorizations/${au}/transition", payload: { to: "SUSPENDED" }, as: FleetManager, as_user_id: "${fl}", captures: { au_m: $.data.auto_suspended } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /fleet-accounts/${fl}/ops-run", payload: {}, as: NetworkAdmin, captures: { f1: $.data.status } }
            - { call: "POST /invoices/${inv}/payments", payload: { amount_cents: 4500 }, as: FleetManager, as_user_id: "${fl}" }
          trigger:
            - { call: "POST /fleet-accounts/${fl}/ops-run", payload: {}, as: NetworkAdmin, captures: { f2: $.data.status } }
            - { call: "GET /driver-authorizations/${au}", payload: {}, as: NetworkAdmin, captures: { aus: $.data.status, aua: $.data.auto_suspended } }
          assert:
            - "manual suspend stored auto_suspended == false"
            - "fleet went SUSPENDED at the overdue sweep, then ACTIVE after payment + ops-run (auto_suspended cycle)"
            - "DriverAuthorization stays SUSPENDED with auto_suspended == false (manual suspensions never auto-restore)"
  - section: calculations
    instances:
      - name: overstay_penalty_ceil_started_hours
        claim_type: correct_result
        grounds: [calculations.overstay_penalty, state_machines.Booking.CHECKED_IN_to_OVERSTAY]
        distinguishing_aspect: "Sweep boundary is strict (still CHECKED_IN at exactly due+grace); penalty bills each STARTED hour: 70 minutes past grace -> 2 hours at rhu(1.5*4500/20)=338 -> 676."
        test_recipe:
          setup: ["site (base 5000, grace 30) with 1 reservable stall; booking arrival 2026-08-10 checked in at 15:30 (rate 4500); checkout_due 2026-08-11T11:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-OS", full_name: "O Ess" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { b1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T15:30:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings/${b1}/check-in", payload: {}, as: Driver, as_user_id: "${d1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T11:30:00Z" }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/ops-run", payload: {}, as: NetworkAdmin }
            - { call: "GET /bookings/${b1}", payload: {}, as: NetworkAdmin, captures: { s_at_grace: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T11:31:00Z" }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/ops-run", payload: {}, as: NetworkAdmin }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T12:40:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings/${b1}/check-out", payload: {}, as: Driver, as_user_id: "${d1}", captures: { fin: $.data.final_total_cents, fee: $.data.fee_cents, st: $.data.status } }
          assert:
            - "at exactly 11:30:00Z (due+grace) the sweep leaves status == CHECKED_IN (strict >)"
            - "after 11:31 sweep status == OVERSTAY"
            - "check-out at 12:40 (70 min past grace -> ceil 2 hours): fee_cents == 676, final_total_cents == 5176 (4500 + 676)"

      - name: cancellation_fee_free_boundary_and_late_fee
        claim_type: correct_result
        grounds: [calculations.cancellation_fee]
        distinguishing_aspect: "Free-cancel boundary is INCLUSIVE at checkin_open - 24h: cancelling at exactly 2026-08-09T15:00:00Z is free; one second later costs rhu(0.5 * 4500) = 2250."
        test_recipe:
          setup: ["site (base 5000, cancel window 24h) with 2 reservable stalls; bookings B1, B2 arrival 2026-08-10 by two drivers (rate 4500 each)"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R02", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
