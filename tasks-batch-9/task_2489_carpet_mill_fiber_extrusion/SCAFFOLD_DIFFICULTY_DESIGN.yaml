              as: MillPlanner
            - call: "POST /mill/dye-lots"
              payload: { lot_code: "DL-01", production_run_id: "${pr}", vessel_id: "${dv}", color_code: "C-SANDSTONE", target_lab_l: 55.00, target_lab_a: 12.00, target_lab_b: -8.00, lot_kg: 600.0, dye_start_utc: "2026-08-06T08:00:00Z", dye_end_utc: "2026-08-06T12:00:00Z", dyed_yards: 300.0 }
              as: DyeHouseOperator
              captures: { dl1: $.data.id }
          trigger:
            - call: "POST /mill/dye-lots"
              payload: { lot_code: "DL-02", production_run_id: "${pr}", vessel_id: "${dv}", color_code: "C-CLAY", target_lab_l: 50.00, target_lab_a: 14.00, target_lab_b: -6.00, lot_kg: 401.0, dye_start_utc: "2026-08-06T12:00:00Z", dye_end_utc: "2026-08-06T16:00:00Z", dyed_yards: 300.0 }
              as: DyeHouseOperator
            - call: "POST /mill/dye-lots"
              payload: { lot_code: "DL-03", production_run_id: "${pr}", vessel_id: "${dv}", color_code: "C-CLAY", target_lab_l: 50.00, target_lab_a: 14.00, target_lab_b: -6.00, lot_kg: 400.0, dye_start_utc: "2026-08-06T12:00:00Z", dye_end_utc: "2026-08-06T16:00:00Z", dyed_yards: 300.0 }
              as: DyeHouseOperator
              captures: { dl3: $.data.id }
          assert:
            - "the DL-02 attempt returns HTTP 409 with data.error_id == ERR_VESSEL_CAPACITY_EXCEEDED because load(2026-08-06T12:00:00Z) would be 1001.0 kg against capacity 1000.0 kg"
            - "no DyeLot with lot_code DL-02 exists"
            - "the DL-03 attempt returns HTTP 201 with DyeLot.${dl3}.status == FORMULATED because load(2026-08-06T12:00:00Z) is exactly 1000.0 kg and the comparison is <="
            - "DyeLot.${dl1}.status == FORMULATED and DyeLot.${dl1}.lot_kg == 600.0 — the resident lot is unchanged"
            - "DyeLot.${dl3}.dye_start_utc == 2026-08-06T12:00:00Z equals DyeLot.${dl1}.dye_end_utc, and the two lots still contend, so the vessel windows are closed at both ends"

  # =========================================================================
  # RULE 9 — compensating_invariant
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: order_cancel_restores_account_credit_exposure_to_zero
        grounds:
          - calculations.account_credit_conservation
          - calculations.account_credit_ledger
          - calculations.cut_order_credit_reservation
          - state_machines.CutOrder.SUBMITTED_to_CANCELLED
          - state_machines.Account.ACTIVE_to_CREDIT_HOLD
          - state_machines.Account.CREDIT_HOLD_to_ACTIVE
          - entities.CutOrder.fields.reserved_credit_cents
        distinguishing_aspect: |
          Conserved quantity: CENTS OF CREDIT EXPOSURE. POST /mill/cut-orders debits 513000 cents and
          POST /mill/cut-orders/{id}/cancel credits exactly the same figure back, so two independent
          create/cancel round trips each return Account.credit_used_cents to 0 and Account.status to
          ACTIVE bit-identically, with exposure(account) == 0 at every observation point.
        test_recipe:
          setup:
            - "Style ST-SD-01 ACTIVE at 4275 cents/yard."
            - "Account AC-01 with credit_limit_cents 513000, status ACTIVE, credit_used_cents 0."
          setup_api_calls:
            - call: "POST /mill/styles"
              payload: { style_code: "ST-SD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/accounts"
              payload: { account_code: "AC-01", account_type: "DEALER", credit_limit_cents: 513000 }
              as: MillPlanner
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /mill/cut-orders"
              payload: { order_code: "CO-01", account_id: "${acct}", style_id: "${st}", order_type: "RUNNING_LINE", requested_yards: 120.0, shade_tolerance: "ANY" }
              as: MillPlanner
              captures: { co1: $.data.id }
            - call: "POST /mill/cut-orders/${co1}/cancel"
              payload: { reason: "buyer withdrew" }
              as: DealerBuyer
              as_user_id: "${acct}"
            - call: "POST /mill/cut-orders"
              payload: { order_code: "CO-02", account_id: "${acct}", style_id: "${st}", order_type: "RUNNING_LINE", requested_yards: 120.0, shade_tolerance: "ANY" }
              as: MillPlanner
              captures: { co2: $.data.id }
            - call: "POST /mill/cut-orders/${co2}/cancel"
              payload: { reason: "buyer withdrew again" }
              as: DealerBuyer
              as_user_id: "${acct}"
          assert:
            - "after creating CO-01, CutOrder.${co1}.reserved_credit_cents == 513000, Account.${acct}.credit_used_cents == 513000 and Account.${acct}.status == CREDIT_HOLD"
            - "after cancelling CO-01, CutOrder.${co1}.status == CANCELLED, CutOrder.${co1}.reserved_credit_cents == 0, Account.${acct}.credit_used_cents == 0 and Account.${acct}.status == ACTIVE"
            - "after creating CO-02, Account.${acct}.credit_used_cents == 513000 and Account.${acct}.status == CREDIT_HOLD — identical to the first round trip"
            - "after cancelling CO-02, Account.${acct}.credit_used_cents == 0 and Account.${acct}.status == ACTIVE"
            - "Account.${acct}.credit_limit_cents == 513000 is unchanged throughout"
            - "at every observation point, credit_used_cents equals the sum of reserved_credit_cents over the account's SUBMITTED/ALLOCATED/BACKORDERED/CUT orders plus net_invoice_cents over its SHIPPED orders, so exposure(account) == 0"

      - name: order_cancel_restores_production_run_linear_yardage
        grounds:
          - calculations.roll_good_yardage_conservation
          - calculations.roll_good_yardage_ledger
          - state_machines.CutOrder.ALLOCATED_to_CANCELLED
          - state_machines.RollGood.inventory_AVAILABLE_to_inventory_COMMITTED
          - state_machines.RollGood.inventory_COMMITTED_to_inventory_AVAILABLE
          - entities.CutAllocation.fields.yards
          - entities.RollGood.fields.available_yards
        distinguishing_aspect: |
          Conserved quantity: LINEAR YARDS of a production run's goods — a physical, non-monetary
          quantity conserved through a different mechanism than the credit ledger. Allocating 200.0
          yards moves them from RollGood.available_yards into CutAllocation.yards and flips the roll
          to COMMITTED; cancelling RELEASES the line and returns the roll to AVAILABLE with 200.0
          yards, leaving run_yardage(PR-01) at 200.0 before and after.
        test_recipe:
          setup:
            - "Style ST-SD-01 ACTIVE at 4275 cents/yard with an effective DOC_FF_1_70 certificate."
            - "ProductionRun PR-01 RELEASED with exactly one RollGood RG-01 (initial_yards 200.0, qa_status PASSED, inventory_status AVAILABLE, no remnant children)."
            - "Account AC-01 (limit 100000000) and CutOrder CO-01 for 200.0 yards, shade_tolerance ANY, status SUBMITTED."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl: $.data.id }
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-01", polymer_lot_id: "${pl}", input_kg: 4000.000, denier_target: 1200.0, filament_count: 72, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01" }
              as: ExtrusionOperator
              captures: { fb: $.data.id }
            - call: "POST /mill/fiber-batches/${fb}/extrude"
              payload: { throughput_g_per_min: 7200.0, spin_speed_m_per_min: 750.0 }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches/${fb}/disposition"
              payload: { disposition: "RELEASE" }
              as: ExtrusionOperator
            - call: "POST /mill/styles"
              payload: { style_code: "ST-SD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/tufting-machines"
              payload: { machine_code: "TM-01", native_gauge_code: "G_1_10", min_pile_height_mm: 4.0, max_pile_height_mm: 14.0, changeover_minutes: 60, needle_bar_width_in: 144.0 }
              as: MillPlanner
              captures: { tm: $.data.id }
            - call: "POST /mill/production-runs"
              payload: { run_code: "PR-01", style_id: "${st}", machine_id: "${tm}", fiber_batch_id: "${fb}", scheduled_start_utc: "2026-08-05T08:00:00Z", scheduled_end_utc: "2026-08-05T16:00:00Z" }
              as: MillPlanner
              captures: { pr: $.data.id }
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/production-runs/${pr}/load-setup"
              payload: { gauge_loaded_code: "G_1_10", pile_height_set_mm: 8.0, pattern_repeat_loaded_mm: 300.0, stitch_rate_per_inch: 10.0 }
              as: MillPlanner
            - call: "POST /mill/production-runs/${pr}/complete-greige"
              payload: { greige_yards: 400.0 }
              as: MillPlanner
            - call: "POST /mill/production-runs/${pr}/apply-backing"
              payload: { sbr_pct: 80.0, filler_load_pct: 20.0, cure_temp_c: 150, cure_seconds: 120, secondary_backing_type: "ACTION_BAC" }
              as: MillPlanner
            - call: "POST /mill/production-runs/${pr}/roll-goods"
              payload: { roll_number: "RG-01", width_ft: 12.0, initial_yards: 200.0 }
              as: MillPlanner
              captures: { rg: $.data.id }
            - call: "POST /mill/product-tests"
              payload: { style_id: "${st}", roll_good_id: "${rg}", test_type: "FLAMMABILITY_PILL", result_value: 18.0 }
              as: QALabTechnician
              as_user_id: "qa-tech-1"
              captures: { pt: $.data.id }
            - call: "POST /mill/certifications"
              payload: { style_id: "${st}", cert_type: "DOC_FF_1_70", source_test_ids: ["${pt}"], expires_at_utc: "2027-08-01T00:00:00Z" }
              as: CertificationOfficer
              as_user_id: "cert-officer-1"
            - call: "POST /mill/roll-goods/${rg}/qa-disposition"
              payload: { disposition: "RELEASE" }
              as: QALabTechnician
              as_user_id: "qa-tech-1"
            - call: "POST /mill/accounts"
              payload: { account_code: "AC-01", account_type: "COMMERCIAL", credit_limit_cents: 100000000 }
              as: MillPlanner
              captures: { acct: $.data.id }
            - call: "POST /mill/cut-orders"
              payload: { order_code: "CO-01", account_id: "${acct}", style_id: "${st}", order_type: "RUNNING_LINE", requested_yards: 200.0, shade_tolerance: "ANY" }
              as: MillPlanner
              captures: { co: $.data.id }
          trigger:
            - call: "POST /mill/cut-orders/${co}/allocate"
              payload: {}
              as: MillPlanner
            - call: "GET /mill/cut-allocations"
              payload: { cut_order_id: "${co}" }
              as: MillPlanner
              captures: { alloc: "$.data[0].id" }
            - call: "POST /mill/cut-orders/${co}/cancel"
              payload: { reason: "job cancelled by the general contractor" }
              as: MillPlanner
          assert:
            - "before the allocate, RollGood.${rg}.available_yards == 200.0 and RollGood.${rg}.inventory_status == AVAILABLE"
            - "after the allocate, CutAllocation.${alloc}.yards == 200.0, CutAllocation.${alloc}.status == RESERVED and CutOrder.${co}.status == ALLOCATED"
            - "after the allocate, RollGood.${rg}.available_yards == 0.0 and RollGood.${rg}.inventory_status == COMMITTED"
            - "after the allocate, run_yardage(PR-01) == 0.0 + 200.0 + 0.0 == 200.0, equal to the run's single non-remnant roll's initial_yards"
            - "after the cancel, CutAllocation.${alloc}.status == RELEASED and CutOrder.${co}.status == CANCELLED"
            - "after the cancel, RollGood.${rg}.available_yards == 200.0 and RollGood.${rg}.inventory_status == AVAILABLE"
            - "after the cancel, run_yardage(PR-01) == 200.0 + 0.0 + 0.0 == 200.0 — bit-identical to the pre-allocate figure"
            - "after the cancel, RollGood.${rg}.qa_status == PASSED and no remnant child RollGood exists with parent_roll_id == ${rg}"
