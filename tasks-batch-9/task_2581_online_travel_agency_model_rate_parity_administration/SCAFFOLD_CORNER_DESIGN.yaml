            - *c_ma_act
            - *c_rp
            - *c_off
            - *c_sup_a
            - *c_cert_a_sub
            - *c_cert_a_rev
            - *c_cert_a_dec
            - *c_ma_a
            - *c_ma_a_act
            - *c_rp_a
            - *c_off_a
          trigger:
            - call: "POST /offers/${off}/publish"
              payload: {}
              as: CommercialManager
              as_user_id: "cm-2"
            - call: "POST /offers/${off_a}/publish"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_a}"
          assert:
            - "both calls are HTTP 200 with status == LIVE and version == 2"
            - "Offer.${off}.display_total_cents is 24240 and Offer.${off_a}.display_total_cents is 143106"
            - "GET /offers with status LIVE reports total_count == 2"

      - name: same_user_cannot_propose_and_approve_a_commission_override
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=10]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - complexity_profile.role_model
        distinguishing_aspect: "segregation of duties is tracked on X-User-ID across roles, not on the role alone: user u-77 proposing as CommercialManager and then approving as ComplianceOfficer is HTTP 403 ERR_SEGREGATION_OF_DUTIES, while co-1 approving the same override succeeds and stamps approved_by_user_id."
        test_recipe:
          setup:
