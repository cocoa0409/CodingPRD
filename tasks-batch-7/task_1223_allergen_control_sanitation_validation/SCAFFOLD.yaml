# =============================================================================
# Task 1223: Allergen Control & Sanitation Validation Program
# Food plant QA department — allergen matrix, changeover validation, swab
# verification, label reconciliation, rework rules, supplier notifications,
# training/audit, undeclared-allergen escalation.
# =============================================================================

scenario: |
  1223. Allergen Control & Sanitation Validation Program (food plant QA
  department): allergen matrix by line & product sequencing, changeover
  procedure & validation study, ATP/allergen swab verification & action
  level, label reconciliation & packaging control, rework handling rules,
  supplier allergen change notification, training & audit of procedures,
  incident/undeclared-allergen escalation

domain_name: allergen-control-sanitation
api_prefix: /qa

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (12 entities)
# =============================================================================
entities:
  - name: Allergen
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Short allergen code (e.g., PEANUT, MILK, SOY, WHEAT)", constraints: "Unique; uppercase letters and underscore only" }
      - { name: display_name, type: string, source: input, description: "Human-readable allergen name" }
      - { name: regulatory_class, type: enum, source: input, description: "MAJOR_9 | SESAME | SULFITE | OTHER; MAJOR_9 drives mandatory changeover", constraints: "MAJOR_9 | SESAME | SULFITE | OTHER" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Soft-disable flag; inactive allergens cannot be newly mapped" }

  - name: ProductionLine
    parent: null
    common_fields: true
    fields:
      - { name: line_code, type: string, source: input, description: "Line identifier (e.g., LINE-1)", constraints: "Unique" }
      - { name: description, type: string, source: input, description: "Free-text description" }
      - { name: sanitation_class, type: enum, source: input, description: "WET_WASH | DRY_CLEAN | ALLERGEN_DEDICATED", constraints: "WET_WASH | DRY_CLEAN | ALLERGEN_DEDICATED" }
      - { name: posture, type: enum, source: computed, description: "Derived: OPEN | RESTRICTED | HOLD; computed from open Holds and pending SwabResults" }
      - { name: last_validated_changeover_id, type: string, source: system, description: "Most recent Changeover with status=VALIDATED on this line; null if none" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Stock-keeping unit code", constraints: "Unique" }
      - { name: product_name, type: string, source: input, description: "Commercial name" }
      - { name: allergen_set, type: array, source: input, description: "Array of Allergen codes intentionally present (the product's declared allergen profile)" }
      - { name: rework_class, type: enum, source: input, description: "SAME_INTO_SAME | SAME_ALLERGEN_PROFILE | RESTRICTED_REWORK | NO_REWORK; governs rework routing", constraints: "SAME_INTO_SAME | SAME_ALLERGEN_PROFILE | RESTRICTED_REWORK | NO_REWORK" }
      - { name: label_revision, type: integer, source: input, default: 1, description: "Current approved label revision; bumped on label change" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Soft-disable flag" }

  - name: LineAllergenMatrixEntry
    parent: null
    common_fields: true
    fields:
      - { name: line_id, type: string, source: input, description: "FK -> ProductionLine.id; line whose matrix row this belongs to" }
      - { name: allergen_id, type: string, source: input, description: "FK -> Allergen.id; allergen being tracked on this line" }
      - { name: handling, type: enum, source: input, description: "ALLOWED | REQUIRES_CHANGEOVER | PROHIBITED", constraints: "ALLOWED | REQUIRES_CHANGEOVER | PROHIBITED" }
      - { name: changeover_minutes, type: integer, source: input, default: 30, description: "Minimum scheduled changeover minutes required when transitioning TO a product that introduces this allergen" }

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - { name: line_id, type: string, source: input, description: "FK -> ProductionLine.id; line the run executes on" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; product being manufactured" }
      - { name: planned_start_utc, type: datetime, source: input, description: "Planned start (ISO8601)" }
      - { name: planned_end_utc, type: datetime, source: input, description: "Planned end (ISO8601); must be > planned_start_utc" }
      - { name: introduced_allergens, type: array, source: computed, description: "Allergen codes in product.allergen_set that were NOT in the immediately prior ACCEPTED/IN_PROGRESS run's product allergen_set on the same line" }
      - { name: changeover_required, type: boolean, source: computed, description: "True iff any introduced_allergen is mapped REQUIRES_CHANGEOVER for this line, or sanitation_class != ALLERGEN_DEDICATED and introduced_allergens non-empty" }
      - { name: scheduled_changeover_minutes, type: integer, source: computed, description: "Max of LineAllergenMatrixEntry.changeover_minutes over introduced_allergens (0 if none)" }
      - { name: label_revision_snapshot, type: integer, source: system, description: "Product.label_revision pinned at run creation; used by LabelReconciliation" }
      - { name: status, type: enum, source: system, description: "DRAFT | SCHEDULED | IN_PROGRESS | COMPLETED | REJECTED | CANCELLED" }

  - name: Changeover
    parent: null
    common_fields: true
    fields:
      - { name: line_id, type: string, source: input, description: "FK -> ProductionLine.id; line being changed over" }
      - { name: from_run_id, type: string, source: input, description: "FK -> ProductionRun.id; the run ending (nullable for first-run-on-line)", constraints: "nullable" }
      - { name: to_run_id, type: string, source: input, description: "FK -> ProductionRun.id; the run starting after the changeover" }
      - { name: procedure_id, type: string, source: input, description: "FK -> ChangeoverProcedure.id; procedure version executed" }
      - { name: scheduled_minutes, type: integer, source: input, description: "Budgeted minutes; must be >= to_run.scheduled_changeover_minutes" }
      - { name: actual_minutes, type: integer, source: input, description: "Recorded minutes on completion; null until COMPLETED", constraints: "nullable" }
      - { name: validation_score, type: number, source: computed, description: "Derived 0-100 score from swab results + on-time completion; null until swabs recorded", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "PLANNED | IN_EXECUTION | SWAB_PENDING | VALIDATED | FAILED | REWORK_REQUIRED | CANCELLED" }

  - name: ChangeoverProcedure
    parent: null
    common_fields: true
    fields:
      - { name: procedure_code, type: string, source: input, description: "Unique SOP code (e.g., COP-PEANUT-V3)", constraints: "Unique" }
      - { name: target_allergen_id, type: string, source: input, description: "FK -> Allergen.id; the allergen this procedure removes" }
      - { name: method, type: enum, source: input, description: "FULL_WET_WASH | DRY_SCRAPE | PURGE | VACUUM_ONLY", constraints: "FULL_WET_WASH | DRY_SCRAPE | PURGE | VACUUM_ONLY" }
      - { name: min_swab_zones, type: integer, source: input, description: "Minimum number of distinct swab zones that must PASS for validation" }
      - { name: atp_action_level_rlu, type: integer, source: input, description: "ATP reading >= this value (relative light units) counts as FAIL for an ATP swab" }
      - { name: allergen_action_level_ppm, type: number, source: input, description: "Allergen swab ppm >= this value counts as FAIL for an allergen swab" }
      - { name: version_seq, type: integer, source: computed, description: "Monotonic per procedure_code; incremented on supersede" }
      - { name: is_current, type: boolean, source: computed, description: "True iff this is the highest version_seq row for its procedure_code" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | SUPERSEDED | RETIRED" }

  - name: SwabResult
    parent: null
    common_fields: true
    fields:
      - { name: changeover_id, type: string, source: input, description: "FK -> Changeover.id; the changeover being verified" }
      - { name: zone_code, type: string, source: input, description: "Physical swab zone (e.g., BELT-A, HOPPER-2)" }
      - { name: swab_type, type: enum, source: input, description: "ATP | ALLERGEN_PROTEIN | ALLERGEN_ELISA", constraints: "ATP | ALLERGEN_PROTEIN | ALLERGEN_ELISA" }
      - { name: measured_value, type: number, source: input, description: "RLU for ATP; ppm for ALLERGEN_PROTEIN/ALLERGEN_ELISA" }
      - { name: action_level_used, type: number, source: computed, description: "The threshold applied: procedure.atp_action_level_rlu for ATP, procedure.allergen_action_level_ppm otherwise" }
      - { name: outcome, type: enum, source: computed, description: "PASS | FAIL | INVALIDATED; measured_value < action_level_used => PASS, >= => FAIL", constraints: "PASS | FAIL | INVALIDATED" }
      - { name: invalidated_reason, type: string, source: input, description: "Required iff outcome INVALIDATED; operator note for a voided swab", constraints: "nullable" }
      - { name: recorded_by_id, type: string, source: input, description: "FK -> QaTechnician.id; technician who recorded the swab" }

  - name: QaTechnician
    parent: null
    common_fields: true
    fields:
      - { name: tech_code, type: string, source: input, description: "Employee code (e.g., TECH-014)", constraints: "Unique" }
      - { name: full_name, type: string, source: input, description: "Technician full name" }
      - { name: certified_allergen_ids, type: array, source: input, description: "Array of Allergen ids this tech is certified to verify" }
      - { name: certification_expiry_utc, type: datetime, source: input, description: "Certification expiry; swabs recorded after this timestamp are INVALIDATED" }
      - { name: training_score, type: integer, source: computed, description: "0-100 rolling training score; derived from AuditFindings" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | SEPARATED" }

  - name: LabelReconciliation
    parent: null
    common_fields: true
    fields:
      - { name: run_id, type: string, source: input, description: "FK -> ProductionRun.id; run whose packaging is being reconciled" }
      - { name: expected_label_revision, type: integer, source: computed, description: "Copied from ProductionRun.label_revision_snapshot at creation" }
      - { name: printed_label_revision, type: integer, source: input, description: "Revision actually printed on the packaging line" }
      - { name: declared_allergens_on_label, type: array, source: input, description: "Allergen codes printed on the label" }
      - { name: missing_allergens, type: array, source: computed, description: "product.allergen_set minus declared_allergens_on_label (undeclared allergens)" }
      - { name: extra_allergens, type: array, source: computed, description: "declared_allergens_on_label minus product.allergen_set" }
      - { name: verdict, type: enum, source: computed, description: "MATCH | REVISION_MISMATCH | UNDECLARED_ALLERGEN | OVER_DECLARED", constraints: "MATCH | REVISION_MISMATCH | UNDECLARED_ALLERGEN | OVER_DECLARED" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED | ESCALATED" }

  - name: ReworkBatch
    parent: null
    common_fields: true
    fields:
      - { name: source_run_id, type: string, source: input, description: "FK -> ProductionRun.id; run that generated the rework material" }
      - { name: source_product_id, type: string, source: input, description: "FK -> Product.id; product the rework came from" }
      - { name: quantity_kg, type: number, source: input, description: "Mass of rework available" }
      - { name: remaining_kg, type: number, source: computed, description: "Quantity not yet consumed or scrapped; initialized to quantity_kg" }
      - { name: rework_allergen_set, type: array, source: computed, description: "Copied from source_product.allergen_set at creation" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | COMMITTED | CONSUMED | SCRAPPED" }

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: incident_type, type: enum, source: input, description: "UNDECLARED_ALLERGEN | LABEL_MISMATCH | SWAB_FAILURE_CLUSTER | SUPPLIER_ALLERGEN_CHANGE | REWORK_RULE_BREACH", constraints: "UNDECLARED_ALLERGEN | LABEL_MISMATCH | SWAB_FAILURE_CLUSTER | SUPPLIER_ALLERGEN_CHANGE | REWORK_RULE_BREACH" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL; CRITICAL forces line HOLD", constraints: "LOW | MEDIUM | HIGH | CRITICAL" }
      - { name: line_id, type: string, source: input, description: "FK -> ProductionLine.id; affected line (nullable for supplier incidents)", constraints: "nullable" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; affected product (nullable)", constraints: "nullable" }
      - { name: allergen_id, type: string, source: input, description: "FK -> Allergen.id; the allergen involved (nullable for LABEL_MISMATCH without allergen impact)", constraints: "nullable" }
      - { name: source_label_reconciliation_id, type: string, source: input, description: "FK -> LabelReconciliation.id; populated when raised from label reconciliation", constraints: "nullable" }
      - { name: source_changeover_id, type: string, source: input, description: "FK -> Changeover.id; populated when raised from swab failure cluster", constraints: "nullable" }
      - { name: description, type: string, source: input, description: "Free-text narrative" }
      - { name: containment_action, type: string, source: input, description: "Recorded containment steps; required to move INVESTIGATING -> CONTAINED", constraints: "nullable" }
      - { name: root_cause, type: string, source: input, description: "Root cause narrative; required to move CONTAINED -> CLOSED", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "OPEN | INVESTIGATING | CONTAINED | CLOSED | VOID" }

  - name: AuditFinding
    parent: null
    common_fields: true
    fields:
      - { name: technician_id, type: string, source: input, description: "FK -> QaTechnician.id; technician audited" }
      - { name: auditor_id, type: string, source: input, description: "FK -> QaTechnician.id; technician performing the audit; must differ from technician_id (segregation of duties)" }
      - { name: finding_type, type: enum, source: input, description: "PROCEDURE_DEVIATION | DOCUMENTATION_GAP | TRAINING_DEFICIENCY | SWAB_TECHNIQUE | LABEL_CONTROL", constraints: "PROCEDURE_DEVIATION | DOCUMENTATION_GAP | TRAINING_DEFICIENCY | SWAB_TECHNIQUE | LABEL_CONTROL" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL", constraints: "MINOR | MAJOR | CRITICAL" }
      - { name: points_deducted, type: integer, source: computed, description: "Training-score points removed: MINOR=2, MAJOR=5, CRITICAL=15" }
      - { name: corrective_action_due_utc, type: datetime, source: input, description: "Due date for corrective action" }
      - { name: corrective_action_note, type: string, source: input, description: "Closure note; required to RESOLVE", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED | OVERDUE | WAIVED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ProductionRun
    initial_state: DRAFT
    terminal_states: [COMPLETED, REJECTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /qa/production-runs/{runId}/schedule"
        actor: QaSupervisor
        preconditions:
          - "Run must be DRAFT (ERR_RUN_NOT_DRAFT)"
          - "Product.is_active must be true (ERR_PRODUCT_INACTIVE)"
          - "Line.posture must be OPEN (ERR_LINE_NOT_OPEN)"
          - "If changeover_required, a covering Changeover to this run must exist in PLANNED or later (ERR_CHANGEOVER_MISSING)"
          - "No overlap: no other SCHEDULED or IN_PROGRESS run on same line whose [planned_start_utc, planned_end_utc) intersects (ERR_RUN_OVERLAP)"
        side_effects:
          - "introduced_allergens recomputed against prior ACCEPTED-or-IN_PROGRESS run on line"
          - "changeover_required recomputed"
          - "ProductionLine.version incremented by 1"

      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /qa/production-runs/{runId}/start"
        actor: LineOperator
        preconditions:
          - "Run must be SCHEDULED (ERR_RUN_NOT_SCHEDULED)"
          - "Line.posture must be OPEN (ERR_LINE_NOT_OPEN)"
          - "If changeover_required: covering Changeover must be VALIDATED (ERR_CHANGEOVER_NOT_VALIDATED)"
          - "Current logical clock must be >= planned_start_utc (ERR_RUN_NOT_DUE)"
        side_effects:
          - "Covering Changeover consumed (linked)"
          - "ProductionLine.last_validated_changeover_id updated if a changeover was consumed"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /qa/production-runs/{runId}/complete"
        actor: LineOperator
        preconditions:
          - "Run must be IN_PROGRESS (ERR_RUN_NOT_IN_PROGRESS)"
          - "All LabelReconciliations for run must have verdict MATCH or status RESOLVED (ERR_LABEL_RECONCILIATION_OPEN)"
        side_effects:
          - "Run marked COMPLETED; subsequent runs on line use this run's allergen_set as baseline"

      - from: DRAFT
        to: REJECTED
        trigger: "POST /qa/production-runs/{runId}/reject"
        actor: QaSupervisor
        preconditions:
          - "Run must be DRAFT (ERR_RUN_NOT_DRAFT)"
        side_effects: []

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /qa/production-runs/{runId}/cancel"
        actor: QaSupervisor
        preconditions:
          - "Run must be DRAFT or SCHEDULED (ERR_RUN_NOT_CANCELLABLE)"
        side_effects:
          - "Any PLANNED Changeover whose to_run_id == this run is CANCELLED"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /qa/production-runs/{runId}/cancel"
        actor: QaSupervisor
        preconditions:
          - "Run must be DRAFT or SCHEDULED (ERR_RUN_NOT_CANCELLABLE)"
        side_effects:
          - "Any PLANNED or IN_EXECUTION Changeover whose to_run_id == this run is CANCELLED"
          - "If IN_EXECUTION Changeover cancelled mid-flight, its swab results are INVALIDATED"

      - from: SCHEDULED
        to: DRAFT
        trigger: "POST /qa/production-runs/{runId}/unschedule"
        actor: QaSupervisor
        preconditions:
          - "Run must be SCHEDULED (ERR_RUN_NOT_SCHEDULED)"
        side_effects:
          - "introduced_allergens and changeover_required cleared"

  - entity: Changeover
    initial_state: PLANNED
    terminal_states: [VALIDATED, FAILED, CANCELLED]
    transitions:
      - from: PLANNED
        to: IN_EXECUTION
        trigger: "POST /qa/changeovers/{changeoverId}/begin"
        actor: LineOperator
        preconditions:
          - "Changeover must be PLANNED (ERR_CHANGEOVER_NOT_PLANNED)"
          - "to_run must still be SCHEDULED (ERR_RUN_NOT_SCHEDULED)"
          - "Line.posture must be OPEN or RESTRICTED (ERR_LINE_ON_HOLD)"
        side_effects:
          - "ProductionLine.version incremented by 1"

      - from: IN_EXECUTION
        to: SWAB_PENDING
        trigger: "POST /qa/changeovers/{changeoverId}/finish-execution"
        actor: LineOperator
        preconditions:
          - "Changeover must be IN_EXECUTION (ERR_CHANGEOVER_NOT_IN_EXECUTION)"
          - "actual_minutes must be provided and >= 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "actual_minutes recorded"

      - from: SWAB_PENDING
        to: VALIDATED
        trigger: "system (automatic when swab validation criteria met)"
        actor: system
        preconditions:
          - "Distinct zone_code count of SwabResults with outcome=PASS for this changeover >= procedure.min_swab_zones"
          - "No SwabResult for this changeover has outcome=FAIL"
          - "Every ALLERGEN_ELISA swab required by procedure.target_allergen has a PASS"
        side_effects:
          - "validation_score computed (see calculation changeover_validation_score)"
          - "ProductionLine.last_validated_changeover_id set to this changeover"
          - "ProductionLine.posture recomputed"
          - "Covering to_run changeover gate satisfied"

      - from: SWAB_PENDING
        to: FAILED
        trigger: "system (automatic when any SwabResult outcome=FAIL and failure cluster threshold met)"
        actor: system
        preconditions:
          - "FAIL swab count >= SWAB_FAIL_CLUSTER_THRESHOLD (2)"
        side_effects:
          - "Incident auto-created with incident_type=SWAB_FAILURE_CLUSTER, severity=HIGH, source_changeover_id=this"
          - "ProductionLine.posture -> HOLD"
          - "to_run remains SCHEDULED but cannot start"

      - from: SWAB_PENDING
        to: REWORK_REQUIRED
        trigger: "system (automatic when exactly 1 swab FAILed)"
        actor: system
        preconditions:
          - "FAIL swab count == 1"
        side_effects:
          - "Failed swab zones queued for re-clean"

      - from: REWORK_REQUIRED
        to: SWAB_PENDING
        trigger: "POST /qa/changeovers/{changeoverId}/reswab"
        actor: LineOperator
        preconditions:
          - "Changeover must be REWORK_REQUIRED (ERR_CHANGEOVER_NOT_REWORK)"
        side_effects:
          - "Prior FAIL swabs in failed zones marked INVALIDATED with invalidated_reason='RESWAB'"

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /qa/changeovers/{changeoverId}/cancel (or cascade from run cancel)"
        actor: QaSupervisor
        preconditions:
          - "Changeover must be PLANNED or IN_EXECUTION (ERR_CHANGEOVER_TERMINAL)"
        side_effects: []

      - from: IN_EXECUTION
        to: CANCELLED
        trigger: "POST /qa/changeovers/{changeoverId}/cancel (or cascade from run cancel)"
        actor: QaSupervisor
        preconditions:
          - "Changeover must be PLANNED or IN_EXECUTION (ERR_CHANGEOVER_TERMINAL)"
        side_effects:
          - "Any recorded swabs INVALIDATED with reason 'CHANGEOVER_CANCELLED'"

  - entity: LabelReconciliation
    initial_state: OPEN
    terminal_states: [RESOLVED, ESCALATED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /qa/label-reconciliations/{reconId}/resolve"
        actor: QaSupervisor
        preconditions:
          - "Reconciliation must be OPEN (ERR_RECON_NOT_OPEN)"
          - "verdict must be MATCH (ERR_RECON_NOT_MATCH) — non-MATCH verdicts cannot resolve directly, must escalate"
        side_effects: []

      - from: OPEN
        to: ESCALATED
        trigger: "POST /qa/label-reconciliations/{reconId}/escalate"
        actor: QaSupervisor
        preconditions:
          - "Reconciliation must be OPEN (ERR_RECON_NOT_OPEN)"
        side_effects:
          - "Incident created with incident_type=UNDECLARED_ALLERGEN if missing_allergens non-empty, else LABEL_MISMATCH"
          - "severity=CRITICAL if missing_allergens non-empty, else HIGH"
          - "If CRITICAL: ProductionLine.posture -> HOLD; IN_PROGRESS run on the line is force-paused (cannot complete until incident CONTAINED)"

  - entity: ReworkBatch
    initial_state: AVAILABLE
    terminal_states: [CONSUMED, SCRAPPED]
    transitions:
      - from: AVAILABLE
        to: COMMITTED
        trigger: "POST /qa/rework-batches/{batchId}/commit"
        actor: LineOperator
        preconditions:
          - "Batch must be AVAILABLE (ERR_REWORK_NOT_AVAILABLE)"
          - "remaining_kg > 0 (ERR_REWORK_EXHAUSTED)"
          - "Target run's product.rework_class must permit: SAME_INTO_SAME requires same product; SAME_ALLERGEN_PROFILE requires identical allergen_set; RESTRICTED_REWORK requires target allergen_set superset of rework_allergen_set; NO_REWORK always rejects (ERR_REWORK_CLASS_VIOLATION)"
          - "rework_allergen_set must be subset of target run's product.allergen_set (ERR_REWORK_ALLERGEN_BREACH)"
        side_effects:
          - "remaining_kg decremented by commit quantity"
          - "If remaining_kg == 0 after commit, status auto -> CONSUMED"

      - from: COMMITTED
        to: CONSUMED
        trigger: "system (automatic when remaining_kg reaches 0)"
        actor: system
        preconditions: []
        side_effects: []

      - from: AVAILABLE
        to: SCRAPPED
        trigger: "POST /qa/rework-batches/{batchId}/scrap"
        actor: QaSupervisor
        preconditions:
          - "Batch must be AVAILABLE or COMMITTED (ERR_REWORK_TERMINAL)"
        side_effects:
          - "remaining_kg set to 0"

      - from: COMMITTED
        to: SCRAPPED
        trigger: "POST /qa/rework-batches/{batchId}/scrap"
        actor: QaSupervisor
        preconditions:
          - "Batch must be AVAILABLE or COMMITTED (ERR_REWORK_TERMINAL)"
        side_effects:
          - "remaining_kg set to 0"

  - entity: Incident
    initial_state: OPEN
    terminal_states: [CLOSED, VOID]
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /qa/incidents/{incidentId}/begin-investigation"
        actor: QaSupervisor
        preconditions:
          - "Incident must be OPEN (ERR_INCIDENT_NOT_OPEN)"
        side_effects: []

      - from: INVESTIGATING
        to: CONTAINED
        trigger: "POST /qa/incidents/{incidentId}/contain"
        actor: QaSupervisor
        preconditions:
          - "Incident must be INVESTIGATING (ERR_INCIDENT_NOT_INVESTIGATING)"
          - "containment_action must be non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "If severity CRITICAL and line posture was HOLD due to this incident, posture recomputed (may relax to RESTRICTED)"

      - from: CONTAINED
        to: CLOSED
        trigger: "POST /qa/incidents/{incidentId}/close"
        actor: QaManager
        preconditions:
          - "Incident must be CONTAINED (ERR_INCIDENT_NOT_CONTAINED)"
          - "root_cause must be non-empty (ERR_INVALID_REQUEST)"
          - "Closer must differ from the technician who recorded the triggering swab/label entry (segregation of duties) (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "If this was the last non-CLOSED/non-VOID CRITICAL incident on the line, ProductionLine.posture recomputed"

      - from: OPEN
        to: VOID
        trigger: "POST /qa/incidents/{incidentId}/void"
        actor: QaManager
        preconditions:
          - "Incident must be OPEN (ERR_INCIDENT_NOT_OPEN)"
        side_effects:
          - "Any HOLD posture caused by this incident is recomputed"

  - entity: QaTechnician
    initial_state: ACTIVE
    terminal_states: [SEPARATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when training_score < SUSPENSION_THRESHOLD (60)) or POST /qa/technicians/{techId}/suspend"
        actor: system
        preconditions: []
        side_effects:
          - "SUSPENDED technician cannot record swabs or audits (ERR_TECH_NOT_ACTIVE)"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /qa/technicians/{techId}/reinstate"
        actor: QaManager
        preconditions:
          - "Technician must be SUSPENDED (ERR_TECH_NOT_SUSPENDED)"
        side_effects:
          - "training_score reset to 75 (REINSTATE_SCORE_FLOOR)"

      - from: ACTIVE
        to: SEPARATED
        trigger: "POST /qa/technicians/{techId}/separate"
        actor: QaManager
        preconditions:
          - "Technician must be ACTIVE or SUSPENDED (ERR_TECH_TERMINAL)"
        side_effects: []

      - from: SUSPENDED
        to: SEPARATED
        trigger: "POST /qa/technicians/{techId}/separate"
        actor: QaManager
        preconditions:
          - "Technician must be ACTIVE or SUSPENDED (ERR_TECH_TERMINAL)"
        side_effects: []

  - entity: AuditFinding
    initial_state: OPEN
    terminal_states: [RESOLVED, WAIVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /qa/audit-findings/{findingId}/resolve"
        actor: QaSupervisor
        preconditions:
          - "Finding must be OPEN or OVERDUE (ERR_FINDING_NOT_OPEN)"
          - "corrective_action_note must be non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "Technician.training_score recomputed"

      - from: OPEN
        to: OVERDUE
        trigger: "system (automatic when logical clock passes corrective_action_due_utc)"
        actor: system
        preconditions: []
        side_effects:
          - "Additional OVERDUE_PENALTY (3) points deducted from technician.training_score"

      - from: OVERDUE
        to: RESOLVED
        trigger: "POST /qa/audit-findings/{findingId}/resolve"
        actor: QaSupervisor
        preconditions:
          - "Finding must be OPEN or OVERDUE (ERR_FINDING_NOT_OPEN)"
          - "corrective_action_note must be non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "Technician.training_score recomputed (OVERDUE_PENALTY not refunded)"

      - from: OPEN
        to: WAIVED
        trigger: "POST /qa/audit-findings/{findingId}/waive"
        actor: QaManager
        preconditions:
          - "Finding must be OPEN (ERR_FINDING_NOT_OPEN)"
          - "Severity must be MINOR (ERR_FINDING_NOT_MINOR)"
        side_effects:
          - "points_deducted refunded to technician.training_score"

  - entity: ChangeoverProcedure
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /qa/changeover-procedures/{procedureId}/approve"
        actor: QaManager
        preconditions:
          - "Procedure must be DRAFT (ERR_PROCEDURE_NOT_DRAFT)"
          - "min_swab_zones >= 1 and atp_action_level_rlu > 0 and allergen_action_level_ppm > 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "Any prior APPROVED procedure with same procedure_code -> SUPERSEDED"
          - "is_current recomputed for the procedure_code family"

      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (automatic when a newer version of same procedure_code is APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "is_current set to false"

      - from: APPROVED
        to: RETIRED
        trigger: "POST /qa/changeover-procedures/{procedureId}/retire"
        actor: QaManager
        preconditions:
          - "Procedure must be APPROVED (ERR_PROCEDURE_NOT_APPROVED)"
          - "No PLANNED/IN_EXECUTION/SWAB_PENDING/REWORK_REQUIRED Changeover references this procedure (ERR_PROCEDURE_IN_USE)"
        side_effects:
          - "is_current set to false"

  - entity: ProductionLine
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system (derived posture recompute)"
        actor: system
        preconditions:
          - "Any Incident with severity HIGH on this line in OPEN/INVESTIGATING/CONTAINED, or any Changeover in REWORK_REQUIRED"
        side_effects: []

      - from: RESTRICTED
        to: HOLD
        trigger: "system (derived posture recompute)"
        actor: system
        preconditions:
          - "Any Incident with severity CRITICAL on this line not in CLOSED/VOID, or any Changeover FAILED on this line"
        side_effects: []

      - from: OPEN
        to: HOLD
        trigger: "system (derived posture recompute)"
        actor: system
        preconditions:
          - "Any Incident with severity CRITICAL on this line not in CLOSED/VOID, or any Changeover FAILED on this line"
        side_effects: []

      - from: HOLD
        to: RESTRICTED
        trigger: "system (derived posture recompute)"
        actor: system
        preconditions:
          - "No CRITICAL incident open; at least one HIGH incident open or REWORK_REQUIRED changeover"
        side_effects: []

      - from: RESTRICTED
        to: OPEN
        trigger: "system (derived posture recompute)"
        actor: system
        preconditions:
          - "No open incidents (HIGH or CRITICAL); no FAILED or REWORK_REQUIRED changeovers"
        side_effects: []

      - from: HOLD
        to: OPEN
        trigger: "system (derived posture recompute)"
        actor: system
        preconditions:
          - "All incidents CLOSED or VOID; no FAILED changeovers unresolved"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: run-schedule-stale-line
    parent_entity: ProductionLine
    write_endpoint: "POST /qa/production-runs/{runId}/schedule"
    occ_field: "expected_line_version"
    description: |
      Scheduling a ProductionRun against a ProductionLine whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just scheduled another run on the
      same line (which legitimately changed the overlap universe) and the
      current writer's view of line occupancy is therefore stale.
    error_id: ERR_STALE_LINE_VERSION
    http_status: 412

  - rule_id: procedure-approve-stale-family
    parent_entity: ChangeoverProcedure
    write_endpoint: "POST /qa/changeover-procedures/{procedureId}/approve"
    occ_field: "expected_procedure_version"
    description: |
      Approving a DRAFT ChangeoverProcedure whose family state has advanced
      since the client last observed it is rejected. The prior approval may
      already have superseded a sibling version; approving from a stale
      observation would double-supersede.
    error_id: ERR_STALE_PROCEDURE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: introduced_allergens
    trigger: "ProductionRun creation and DRAFT->SCHEDULED transition"
    algorithm: set_difference
    formula: |
      baseline = allergen_set of the most recent COMPLETED or IN_PROGRESS run
                 on the same line, ordered by planned_start_utc ASC,
                 tie-break created_at ASC; empty set if no prior run
      introduced_allergens = product.allergen_set - baseline
    input_set: "COMPLETED or IN_PROGRESS ProductionRuns on the same line; DRAFT/SCHEDULED/REJECTED/CANCELLED excluded"
    precision: "n/a (set semantics)"
    variants:
      - name: optimistic_preview
        when: "at run creation (DRAFT state)"
        difference: "baseline treats the immediately preceding SCHEDULED run as if it will complete; includes SCHEDULED runs in the baseline set"
      - name: strict_actual
        when: "at DRAFT->SCHEDULED transition"
        difference: "baseline includes only COMPLETED or IN_PROGRESS runs; a still-SCHEDULED predecessor does NOT contribute its allergens"

  - name: changeover_required
    trigger: "ProductionRun creation and scheduling"
    algorithm: threshold
    formula: |
      if introduced_allergens is empty: changeover_required = false
      else if any a in introduced_allergens has LineAllergenMatrixEntry.handling == PROHIBITED for this line: reject ERR_ALLERGEN_PROHIBITED_ON_LINE
      else if any a in introduced_allergens has handling == REQUIRES_CHANGEOVER: changeover_required = true
      else if line.sanitation_class == ALLERGEN_DEDICATED: changeover_required = false
      else: changeover_required = true
    constants: {}

  - name: scheduled_changeover_minutes
    trigger: "ProductionRun creation and scheduling"
    algorithm: aggregation
    formula: |
      scheduled_changeover_minutes = max(changeover_minutes over LineAllergenMatrixEntry
                                          where allergen_id in introduced_allergens
                                          and line_id == run.line_id)
      if introduced_allergens is empty: 0
    precision: "integer minutes"

  - name: changeover_validation_score
    trigger: "Changeover SWAB_PENDING -> VALIDATED auto-transition"
    algorithm: weighted_scoring
    formula: |
      base = 100
      on_time_bonus = +5 if actual_minutes <= scheduled_minutes else 0
      tardy_penalty = -1 * min(20, floor((actual_minutes - scheduled_minutes) / 5)) if actual_minutes > scheduled_minutes else 0
      swab_margin_bonus = +1 per PASS swab whose measured_value <= 0.5 * action_level_used, capped at +10
      invalidated_penalty = -2 per INVALIDATED swab
      score = clamp(0, 100, base + on_time_bonus + tardy_penalty + swab_margin_bonus + invalidated_penalty)
    constants:
      BASE_SCORE: 100
      ON_TIME_BONUS: 5
      TARDY_PENALTY_PER_5MIN: 1
      TARDY_PENALTY_CAP: 20
      MARGIN_BONUS_PER_SWAB: 1
      MARGIN_BONUS_CAP: 10
      INVALIDATED_PENALTY: 2
    precision: "integer score"

  - name: swab_outcome
    trigger: "SwabResult creation"
    algorithm: threshold
    formula: |
      if swab_type == ATP:
        action_level_used = changeover.procedure.atp_action_level_rlu
      else:
        action_level_used = changeover.procedure.allergen_action_level_ppm
      if invalidated_reason is provided on create: outcome = INVALIDATED
      else: outcome = PASS iff measured_value < action_level_used else FAIL
      Note strict inequality: measured_value exactly == action_level_used => FAIL
    precision: "measured_value compared at full numeric precision"

  - name: training_score
    trigger: "AuditFinding create, resolve, waive, overdue-transition"
    algorithm: aggregation
    formula: |
      start from 100
      for each AuditFinding of the technician with status in {OPEN, OVERDUE, RESOLVED}:
        subtract points_deducted
      for each AuditFinding with status OVERDUE: subtract OVERDUE_PENALTY (3) additionally
      for each AuditFinding with status WAIVED: no deduction (refunded)
      floor at 0, ceiling at 100
      if score < SUSPENSION_THRESHOLD (60): technician auto-transitions ACTIVE -> SUSPENDED
    constants:
      INITIAL_SCORE: 100
      MINOR_DEDUCTION: 2
      MAJOR_DEDUCTION: 5
      CRITICAL_DEDUCTION: 15
      OVERDUE_PENALTY: 3
      SUSPENSION_THRESHOLD: 60
      REINSTATE_SCORE_FLOOR: 75
    precision: "integer"

  - name: label_reconciliation_verdict
    trigger: "LabelReconciliation creation and PATCH of declared_allergens_on_label / printed_label_revision"
    algorithm: set_difference
    formula: |
      missing = product.allergen_set - declared_allergens_on_label (order by allergen code ASC)
      extra = declared_allergens_on_label - product.allergen_set (order by allergen code ASC)
      if missing non-empty: verdict = UNDECLARED_ALLERGEN
      else if printed_label_revision != expected_label_revision: verdict = REVISION_MISMATCH
      else if extra non-empty: verdict = OVER_DECLARED
      else: verdict = MATCH
      Precedence pinned: UNDECLARED_ALLERGEN > REVISION_MISMATCH > OVER_DECLARED > MATCH
    precision: "n/a (set semantics)"

  - name: rework_eligibility
    trigger: "ReworkBatch commit"
    algorithm: constraint_propagation
    formula: |
      let src = batch.rework_allergen_set, tgt = target_run.product.allergen_set
      rule 1 (class gate):
        SAME_INTO_SAME: require batch.source_product_id == target_run.product_id
        SAME_ALLERGEN_PROFILE: require set(src) == set(tgt)
        RESTRICTED_REWORK: require set(src) subset of set(tgt) and target product.rework_class != NO_REWORK
        NO_REWORK: always reject
      rule 2 (allergen subset): require set(src) subset of set(tgt) regardless of class
      Both rules must hold; evaluate rule 1 first (ERR_REWORK_CLASS_VIOLATION precedes ERR_REWORK_ALLERGEN_BREACH)
    precision: "n/a"

  - name: line_posture
    trigger: "Any Incident create/contain/close/void; any Changeover FAILED/REWORK_REQUIRED/VALIDATED"
    algorithm: aggregation
    formula: |
      critical_open = count of Incidents on line with severity=CRITICAL and status in {OPEN, INVESTIGATING, CONTAINED}
      high_open = count of Incidents on line with severity=HIGH and status in {OPEN, INVESTIGATING, CONTAINED}
      failed_changeover = count of Changeovers on line with status=FAILED
      rework_changeover = count of Changeovers on line with status=REWORK_REQUIRED
      if critical_open > 0 or failed_changeover > 0: posture = HOLD
      else if high_open > 0 or rework_changeover > 0: posture = RESTRICTED
      else: posture = OPEN
      Evaluation order pinned: HOLD check first, then RESTRICTED, then OPEN.
    precision: "integer counts"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role declared in §1.7"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles list"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path ids exist and FK parents resolvable, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: existence
    check: "expected_*_version OCC fields match parent's current version"
    error_id: ERR_STALE_LINE_VERSION
    http_status: 412
    applies_to: "POST /qa/production-runs/{runId}/schedule; POST /qa/changeover-procedures/{procedureId}/approve (ERR_STALE_PROCEDURE_VERSION)"

  - priority: 5
    category: state
    check: "Entity in correct source state for the transition"
    error_id: "ERR_RUN_NOT_DRAFT | ERR_RUN_NOT_SCHEDULED | ERR_RUN_NOT_IN_PROGRESS | ERR_CHANGEOVER_NOT_PLANNED | ERR_CHANGEOVER_NOT_IN_EXECUTION | ERR_RECON_NOT_OPEN | ERR_INCIDENT_NOT_OPEN | ERR_INCIDENT_NOT_INVESTIGATING | ERR_INCIDENT_NOT_CONTAINED | ERR_FINDING_NOT_OPEN | ERR_TECH_NOT_SUSPENDED | ERR_PROCEDURE_NOT_DRAFT | ERR_PROCEDURE_NOT_APPROVED | ERR_REWORK_NOT_AVAILABLE | ERR_CHANGEOVER_NOT_REWORK"
    http_status: 409
    applies_to: "state transition endpoints"

  - priority: 6
    category: state
    check: "ProductionLine.posture gate: OPEN required for run schedule/start; OPEN or RESTRICTED for changeover begin"
    error_id: ERR_LINE_NOT_OPEN
    http_status: 409
    applies_to: "POST /qa/production-runs/{runId}/schedule; POST /qa/production-runs/{runId}/start; POST /qa/changeovers/{changeoverId}/begin"

  - priority: 7
    category: business_safety
    check: "Allergen PROHIBITED on line cannot be introduced by a run"
    error_id: ERR_ALLERGEN_PROHIBITED_ON_LINE
    http_status: 422
    applies_to: "POST /qa/production-runs; POST /qa/production-runs/{runId}/schedule"

  - priority: 8
    category: business_safety
    check: "Changeover gate: changeover_required runs need a VALIDATED changeover before start"
    error_id: ERR_CHANGEOVER_NOT_VALIDATED
    http_status: 409
    applies_to: "POST /qa/production-runs/{runId}/start"

  - priority: 9
    category: business_safety
    check: "Undeclared-allergen gate: run cannot complete while any LabelReconciliation has missing_allergens non-empty and status != RESOLVED"
    error_id: ERR_LABEL_RECONCILIATION_OPEN
    http_status: 409
    applies_to: "POST /qa/production-runs/{runId}/complete"

  - priority: 10
    category: business_safety
    check: "Rework allergen containment: rework_allergen_set must be subset of target product allergen_set"
    error_id: ERR_REWORK_ALLERGEN_BREACH
    http_status: 422
    applies_to: "POST /qa/rework-batches/{batchId}/commit"

  - priority: 11
    category: business_safety
    check: "Technician certification: swab recorder must be certified for the procedure's target allergen and certification not expired at logical clock time"
    error_id: ERR_TECH_NOT_CERTIFIED
    http_status: 403
    applies_to: "POST /qa/changeovers/{changeoverId}/swab-results"

  - priority: 12
    category: business_constraint
    check: "Run overlap: half-open [planned_start_utc, planned_end_utc) on same line must not intersect another SCHEDULED/IN_PROGRESS run"
    error_id: ERR_RUN_OVERLAP
    http_status: 409
    applies_to: "POST /qa/production-runs; POST /qa/production-runs/{runId}/schedule"

  - priority: 13
    category: business_constraint
    check: "Rework class gate per rework_eligibility rule 1"
    error_id: ERR_REWORK_CLASS_VIOLATION
    http_status: 422
    applies_to: "POST /qa/rework-batches/{batchId}/commit"

  - priority: 14
    category: business_constraint
    check: "ChangeoverProcedure referenced by active changeover cannot retire"
    error_id: ERR_PROCEDURE_IN_USE
    http_status: 409
    applies_to: "POST /qa/changeover-procedures/{procedureId}/retire"

  - priority: 15
    category: business_constraint
    check: "Segregation of duties: incident closer must differ from triggering swab/label recorder; audit auditor_id must differ from technician_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /qa/incidents/{incidentId}/close; POST /qa/audit-findings"

  - priority: 16
    category: business_temporal
    check: "Run start not before planned_start_utc per logical clock"
    error_id: ERR_RUN_NOT_DUE
    http_status: 409
    applies_to: "POST /qa/production-runs/{runId}/start"

  - priority: 17
    category: business_temporal
    check: "planned_end_utc must be strictly greater than planned_start_utc"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 400
    applies_to: "POST /qa/production-runs"

  - priority: 18
    category: business_referential
    check: "Allergen codes in product.allergen_set must resolve to active Allergen rows; matrix entries must reference active allergens"
    error_id: ERR_ALLERGEN_INACTIVE
    http_status: 422
    applies_to: "POST /qa/products; POST /qa/line-allergen-matrix-entries"

  - priority: 19
    category: business_fiscal
    check: "Rework commit quantity must not exceed remaining_kg"
    error_id: ERR_REWORK_EXHAUSTED
    http_status: 422
    applies_to: "POST /qa/rework-batches/{batchId}/commit"

  - priority: 20
    category: business_fiscal
    check: "Changeover scheduled_minutes must be >= to_run.scheduled_changeover_minutes"
    error_id: ERR_CHANGEOVER_BUDGET_SHORT
    http_status: 422
    applies_to: "POST /qa/changeovers"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving) ---
  - method: POST
    path: "/qa/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Startup default is exactly 2026-05-01T00:00:00Z and the clock never falls back to wall-clock time."
    roles: [QaManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "AuditFinding OPEN->OVERDUE sweep for findings whose corrective_action_due_utc < new clock"
      - "Technician certification-expiry sweep does not invalidate retroactively recorded swabs, but new swabs recorded after expiry are rejected"

  # --- Allergen ---
  - method: POST
    path: "/qa/allergens"
    description: "Create an allergen"
    roles: [QaManager]
    code: 201
    input: [code, display_name, regulatory_class, "is_active?"]
    output: Allergen
    side_effects: []

  - method: GET
    path: "/qa/allergens"
    description: "List allergens"
    roles: [QaManager, QaSupervisor, QaTechnician, LineOperator, Auditor]
    code: 200
    input: ["limit?", "offset?", "is_active?"]
    output: "Allergen[]"
    side_effects: []

  - method: GET
    path: "/qa/allergens/{allergenId}"
    description: "Get one allergen"
    roles: [QaManager, QaSupervisor, QaTechnician, LineOperator, Auditor]
    code: 200
    input: []
    output: Allergen
    side_effects: []

  # --- ProductionLine ---
  - method: POST
    path: "/qa/production-lines"
    description: "Create a production line"
    roles: [QaManager]
    code: 201
    input: [line_code, description, sanitation_class]
    output: ProductionLine
    side_effects: ["posture initialized to OPEN"]

  - method: GET
    path: "/qa/production-lines"
    description: "List production lines"
    roles: [QaManager, QaSupervisor, QaTechnician, LineOperator, Auditor]
    code: 200
    input: ["limit?", "offset?", "posture?"]
    output: "ProductionLine[]"
    side_effects: []

  - method: GET
    path: "/qa/production-lines/{lineId}"
    description: "Get one production line"
    roles: [QaManager, QaSupervisor, QaTechnician, LineOperator, Auditor]
    code: 200
    input: []
    output: ProductionLine
    side_effects: []

  # --- LineAllergenMatrixEntry ---
  - method: POST
    path: "/qa/line-allergen-matrix-entries"
    description: "Add an allergen handling row for a line"
    roles: [QaManager]
    code: 201
    input: [line_id, allergen_id, handling, "changeover_minutes?"]
    output: LineAllergenMatrixEntry
    side_effects: []

  - method: GET
    path: "/qa/line-allergen-matrix-entries"
    description: "List matrix entries (filterable by line_id or allergen_id)"
    roles: [QaManager, QaSupervisor, QaTechnician, LineOperator, Auditor]
    code: 200
    input: ["line_id?", "allergen_id?", "limit?", "offset?"]
    output: "LineAllergenMatrixEntry[]"
    side_effects: []

  - method: GET
    path: "/qa/line-allergen-matrix-entries/{entryId}"
    description: "Get one matrix entry"
    roles: [QaManager, QaSupervisor, QaTechnician, LineOperator, Auditor]
    code: 200
    input: []
    output: LineAllergenMatrixEntry
    side_effects: []

  # --- Product ---
  - method: POST
    path: "/qa/products"
    description: "Create a product"
    roles: [QaManager]
    code: 201
    input: [sku, product_name, allergen_set, rework_class, "label_revision?", "is_active?"]
    output: Product
    side_effects: []

  - method: GET
    path: "/qa/products"
    description: "List products"
    roles: [QaManager, QaSupervisor, QaTechnician, LineOperator, Auditor]
    code: 200
    input: ["limit?", "offset?", "is_active?"]
    output: "Product[]"
    side_effects: []

  - method: GET
    path: "/qa/products/{productId}"
    description: "Get one product"
    roles: [QaManager, QaSupervisor, QaTechnician, LineOperator, Auditor]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: PATCH
    path: "/qa/products/{productId}"
    description: "Bump label_revision or toggle is_active (supplier allergen change flow)"
    roles: [QaManager]
    code: 200
    input: ["label_revision?", "is_active?", "allergen_set?"]
    output: Product
    side_effects:
      - "If allergen_set changes, an Incident of type SUPPLIER_ALLERGEN_CHANGE severity MEDIUM is auto-created with product_id=this, allergen_id=null"

  # --- ProductionRun ---
  - method: POST
    path: "/qa/production-runs"
    description: "Create a production run (DRAFT)"
    roles: [QaSupervisor]
    code: 201
    input: [line_id, product_id, planned_start_utc, planned_end_utc]
    output: ProductionRun
    side_effects:
      - "label_revision_snapshot pinned from product"
      - "introduced_allergens computed (optimistic_preview variant)"
      - "changeover_required and scheduled_changeover_minutes computed"

  - method: GET
    path: "/qa/production-runs"
    description: "List production runs"
    roles: [QaManager, QaSupervisor, QaTechnician, LineOperator, Auditor]
    code: 200
    input: ["limit?", "offset?", "line_id?", "product_id?", "status?"]
    output: "ProductionRun[]"
    side_effects: []

  - method: GET
    path: "/qa/production-runs/{runId}"
    description: "Get one production run"
    roles: [QaManager, QaSupervisor, QaTechnician, LineOperator, Auditor]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []

  - method: POST
    path: "/qa/production-runs/{runId}/schedule"
    description: "Transition DRAFT -> SCHEDULED (OCC on line version)"
    roles: [QaSupervisor]
    code: 200
    input: [expected_line_version]
    output: ProductionRun
    side_effects:
      - "introduced_allergens recomputed (strict_actual variant)"
      - "increments ProductionLine.version by 1"

  - method: POST
    path: "/qa/production-runs/{runId}/unschedule"
    description: "Transition SCHEDULED -> DRAFT"
    roles: [QaSupervisor]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["introduced_allergens and changeover_required cleared"]

  - method: POST
    path: "/qa/production-runs/{runId}/start"
    description: "Transition SCHEDULED -> IN_PROGRESS"
    roles: [LineOperator]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["Covering changeover consumed; last_validated_changeover_id updated"]

  - method: POST
    path: "/qa/production-runs/{runId}/complete"
    description: "Transition IN_PROGRESS -> COMPLETED"
    roles: [LineOperator]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["Run becomes baseline for subsequent runs' allergen diff"]

  - method: POST
    path: "/qa/production-runs/{runId}/reject"
    description: "Transition DRAFT -> REJECTED"
    roles: [QaSupervisor]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []

  - method: POST
    path: "/qa/production-runs/{runId}/cancel"
    description: "Transition DRAFT/SCHEDULED -> CANCELLED"
    roles: [QaSupervisor]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["Covering PLANNED/IN_EXECUTION changeovers CANCELLED; their swabs INVALIDATED"]

  # --- ChangeoverProcedure ---
  - method: POST
    path: "/qa/changeover-procedures"
    description: "Create a new changeover procedure (DRAFT); reusing a procedure_code starts a new version_seq"
    roles: [QaManager]
    code: 201
    input: [procedure_code, target_allergen_id, method, min_swab_zones, atp_action_level_rlu, allergen_action_level_ppm]
    output: ChangeoverProcedure
    side_effects: ["version_seq computed as max(existing family)+1; is_current=false until APPROVED"]

  - method: GET
    path: "/qa/changeover-procedures"
    description: "List changeover procedures"
    roles: [QaManager, QaSupervisor, QaTechnician, Auditor]
    code: 200
    input: ["limit?", "offset?", "procedure_code?", "target_allergen_id?", "status?"]
    output: "ChangeoverProcedure[]"
    side_effects: []

  - method: GET
    path: "/qa/changeover-procedures/{procedureId}"
    description: "Get one procedure"
    roles: [QaManager, QaSupervisor, QaTechnician, Auditor]
    code: 200
    input: []
    output: ChangeoverProcedure
    side_effects: []

  - method: POST
    path: "/qa/changeover-procedures/{procedureId}/approve"
    description: "Approve a DRAFT procedure; supersedes prior family version (OCC on procedure version)"
    roles: [QaManager]
    code: 200
    input: [expected_procedure_version]
    output: ChangeoverProcedure
    side_effects:
      - "Prior APPROVED family member -> SUPERSEDED, is_current=false"
      - "This procedure -> APPROVED, is_current=true"
      - "increments ChangeoverProcedure.version by 1"

  - method: POST
    path: "/qa/changeover-procedures/{procedureId}/retire"
    description: "Retire an APPROVED procedure not in active use"
    roles: [QaManager]
    code: 200
    input: []
    output: ChangeoverProcedure
    side_effects: ["is_current=false"]

  # --- Changeover ---
  - method: POST
    path: "/qa/changeovers"
    description: "Plan a changeover between two runs on a line"
    roles: [QaSupervisor]
    code: 201
    input: [line_id, from_run_id, to_run_id, procedure_id, scheduled_minutes]
    output: Changeover
    side_effects: []

  - method: GET
    path: "/qa/changeovers"
    description: "List changeovers"
    roles: [QaManager, QaSupervisor, QaTechnician, LineOperator, Auditor]
    code: 200
    input: ["limit?", "offset?", "line_id?", "to_run_id?", "from_run_id?", "procedure_id?", "status?"]
    output: "Changeover[]"
    side_effects: []

  - method: GET
    path: "/qa/changeovers/{changeoverId}"
    description: "Get one changeover"
    roles: [QaManager, QaSupervisor, QaTechnician, LineOperator, Auditor]
    code: 200
    input: []
    output: Changeover
    side_effects: []

  - method: POST
    path: "/qa/changeovers/{changeoverId}/begin"
    description: "Transition PLANNED -> IN_EXECUTION"
    roles: [LineOperator]
    code: 200
    input: []
    output: Changeover
    side_effects: ["increments ProductionLine.version by 1"]

  - method: POST
    path: "/qa/changeovers/{changeoverId}/finish-execution"
    description: "Transition IN_EXECUTION -> SWAB_PENDING; records actual_minutes"
    roles: [LineOperator]
    code: 200
    input: [actual_minutes]
    output: Changeover
    side_effects: []

  - method: POST
    path: "/qa/changeovers/{changeoverId}/reswab"
    description: "Transition REWORK_REQUIRED -> SWAB_PENDING after re-clean"
    roles: [LineOperator]
    code: 200
    input: []
    output: Changeover
    side_effects: ["Prior FAIL swabs in failed zones INVALIDATED with reason RESWAB"]

  - method: POST
    path: "/qa/changeovers/{changeoverId}/cancel"
    description: "Cancel a PLANNED or IN_EXECUTION changeover"
    roles: [QaSupervisor]
    code: 200
    input: []
    output: Changeover
    side_effects: ["Recorded swabs INVALIDATED with reason CHANGEOVER_CANCELLED"]

  # --- SwabResult ---
  - method: POST
    path: "/qa/changeovers/{changeoverId}/swab-results"
    description: "Record a swab result against a SWAB_PENDING changeover"
    roles: [QaTechnician]
    code: 201
    input: [zone_code, swab_type, measured_value, "invalidated_reason?", recorded_by_id]
    output: SwabResult
    side_effects:
      - "action_level_used and outcome computed"
      - "If FAIL count hits SWAB_FAIL_CLUSTER_THRESHOLD (2): Changeover -> FAILED, Incident auto-created, line posture -> HOLD"
      - "If FAIL count == 1: Changeover -> REWORK_REQUIRED"
      - "If all criteria met: Changeover -> VALIDATED and validation_score computed"

  - method: GET
    path: "/qa/swab-results"
    description: "List swab results"
    roles: [QaManager, QaSupervisor, QaTechnician, Auditor]
    code: 200
    input: ["limit?", "offset?", "changeover_id?", "outcome?", "recorded_by_id?"]
    output: "SwabResult[]"
    side_effects: []

  - method: GET
    path: "/qa/swab-results/{swabId}"
    description: "Get one swab result"
    roles: [QaManager, QaSupervisor, QaTechnician, Auditor]
    code: 200
    input: []
    output: SwabResult
    side_effects: []

  # --- QaTechnician ---
  - method: POST
    path: "/qa/technicians"
    description: "Create a QA technician"
    roles: [QaManager]
    code: 201
    input: [tech_code, full_name, certified_allergen_ids, certification_expiry_utc]
    output: QaTechnician
    side_effects: ["training_score initialized to 100"]

  - method: GET
    path: "/qa/technicians"
    description: "List technicians"
    roles: [QaManager, QaSupervisor, Auditor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "QaTechnician[]"
    side_effects: []

  - method: GET
    path: "/qa/technicians/{techId}"
    description: "Get one technician"
    roles: [QaManager, QaSupervisor, Auditor]
    code: 200
    input: []
    output: QaTechnician
    side_effects: []

  - method: POST
    path: "/qa/technicians/{techId}/suspend"
    description: "Manually suspend a technician"
    roles: [QaManager]
    code: 200
    input: []
    output: QaTechnician
    side_effects: []

  - method: POST
    path: "/qa/technicians/{techId}/reinstate"
    description: "Reinstate a suspended technician; resets training_score to 75"
    roles: [QaManager]
    code: 200
    input: []
    output: QaTechnician
    side_effects: ["training_score = 75"]

  - method: POST
    path: "/qa/technicians/{techId}/separate"
    description: "Separate (terminate) a technician"
    roles: [QaManager]
    code: 200
    input: []
    output: QaTechnician
    side_effects: []

  # --- LabelReconciliation ---
  - method: POST
    path: "/qa/label-reconciliations"
    description: "Create a label reconciliation for a run"
    roles: [QaTechnician, QaSupervisor]
    code: 201
    input: [run_id, printed_label_revision, declared_allergens_on_label]
    output: LabelReconciliation
    side_effects:
      - "expected_label_revision copied from run.label_revision_snapshot"
      - "missing_allergens, extra_allergens, verdict computed"

  - method: GET
    path: "/qa/label-reconciliations"
    description: "List label reconciliations"
    roles: [QaManager, QaSupervisor, QaTechnician, Auditor]
    code: 200
    input: ["limit?", "offset?", "run_id?", "verdict?", "status?"]
    output: "LabelReconciliation[]"
    side_effects: []

  - method: GET
    path: "/qa/label-reconciliations/{reconId}"
    description: "Get one label reconciliation"
    roles: [QaManager, QaSupervisor, QaTechnician, Auditor]
    code: 200
    input: []
    output: LabelReconciliation
    side_effects: []

  - method: POST
    path: "/qa/label-reconciliations/{reconId}/resolve"
    description: "Resolve a MATCH reconciliation"
    roles: [QaSupervisor]
    code: 200
    input: []
    output: LabelReconciliation
    side_effects: []

  - method: POST
    path: "/qa/label-reconciliations/{reconId}/escalate"
    description: "Escalate a non-MATCH reconciliation to an Incident"
    roles: [QaSupervisor]
    code: 200
    input: []
    output: LabelReconciliation
    side_effects:
      - "Incident created (UNDECLARED_ALLERGEN CRITICAL if missing_allergens non-empty, else LABEL_MISMATCH HIGH)"
      - "CRITICAL: line posture -> HOLD"

  # --- ReworkBatch ---
  - method: POST
    path: "/qa/rework-batches"
    description: "Create a rework batch from a source run"
    roles: [LineOperator, QaSupervisor]
    code: 201
    input: [source_run_id, source_product_id, quantity_kg]
    output: ReworkBatch
    side_effects: ["remaining_kg initialized; rework_allergen_set copied from source product"]

  - method: GET
    path: "/qa/rework-batches"
    description: "List rework batches"
    roles: [QaManager, QaSupervisor, QaTechnician, LineOperator, Auditor]
    code: 200
    input: ["limit?", "offset?", "source_run_id?", "source_product_id?", "status?"]
    output: "ReworkBatch[]"
    side_effects: []

  - method: GET
    path: "/qa/rework-batches/{batchId}"
    description: "Get one rework batch"
    roles: [QaManager, QaSupervisor, QaTechnician, LineOperator, Auditor]
    code: 200
    input: []
    output: ReworkBatch
    side_effects: []

  - method: POST
    path: "/qa/rework-batches/{batchId}/commit"
    description: "Commit quantity_kg of this batch into a target run"
    roles: [LineOperator]
    code: 200
    input: [target_run_id, quantity_kg]
    output: ReworkBatch
    side_effects: ["remaining_kg decremented; auto-CONSUMED at 0"]

  - method: POST
    path: "/qa/rework-batches/{batchId}/scrap"
    description: "Scrap a rework batch"
    roles: [QaSupervisor]
    code: 200
    input: []
    output: ReworkBatch
    side_effects: ["remaining_kg = 0"]

  # --- Incident ---
  - method: POST
    path: "/qa/incidents"
    description: "Manually raise an incident"
    roles: [QaSupervisor, QaManager]
    code: 201
    input: [incident_type, severity, "line_id?", "product_id?", "allergen_id?", "description"]
    output: Incident
    side_effects: ["Line posture recomputed"]

  - method: GET
    path: "/qa/incidents"
    description: "List incidents"
    roles: [QaManager, QaSupervisor, QaTechnician, LineOperator, Auditor]
    code: 200
    input: ["limit?", "offset?", "line_id?", "product_id?", "allergen_id?", "source_label_reconciliation_id?", "source_changeover_id?", "status?", "severity?"]
    output: "Incident[]"
    side_effects: []

  - method: GET
    path: "/qa/incidents/{incidentId}"
    description: "Get one incident"
    roles: [QaManager, QaSupervisor, QaTechnician, LineOperator, Auditor]
    code: 200
    input: []
    output: Incident
    side_effects: []

  - method: POST
    path: "/qa/incidents/{incidentId}/begin-investigation"
    description: "OPEN -> INVESTIGATING"
    roles: [QaSupervisor]
    code: 200
    input: []
    output: Incident
    side_effects: []

  - method: POST
    path: "/qa/incidents/{incidentId}/contain"
    description: "INVESTIGATING -> CONTAINED"
    roles: [QaSupervisor]
    code: 200
    input: [containment_action]
    output: Incident
    side_effects: ["Line posture recomputed"]

  - method: POST
    path: "/qa/incidents/{incidentId}/close"
    description: "CONTAINED -> CLOSED (segregation of duties enforced)"
    roles: [QaManager]
    code: 200
    input: [root_cause]
    output: Incident
    side_effects: ["Line posture recomputed"]

  - method: POST
    path: "/qa/incidents/{incidentId}/void"
    description: "OPEN -> VOID"
    roles: [QaManager]
    code: 200
    input: []
    output: Incident
    side_effects: ["Line posture recomputed"]

  # --- AuditFinding ---
  - method: POST
    path: "/qa/audit-findings"
    description: "Record an audit finding against a technician"
    roles: [Auditor]
    code: 201
    input: [technician_id, auditor_id, finding_type, severity, corrective_action_due_utc]
    output: AuditFinding
    side_effects:
      - "points_deducted computed (MINOR=2, MAJOR=5, CRITICAL=15)"
      - "Technician.training_score recomputed; auto-suspend if < 60"

  - method: GET
    path: "/qa/audit-findings"
    description: "List audit findings"
    roles: [QaManager, QaSupervisor, Auditor]
    code: 200
    input: ["limit?", "offset?", "technician_id?", "auditor_id?", "status?"]
    output: "AuditFinding[]"
    side_effects: []

  - method: GET
    path: "/qa/audit-findings/{findingId}"
    description: "Get one audit finding"
    roles: [QaManager, QaSupervisor, Auditor]
    code: 200
    input: []
    output: AuditFinding
    side_effects: []

  - method: POST
    path: "/qa/audit-findings/{findingId}/resolve"
    description: "Resolve a finding with a corrective action note"
    roles: [QaSupervisor]
    code: 200
    input: [corrective_action_note]
    output: AuditFinding
    side_effects: ["Technician.training_score recomputed"]

  - method: POST
    path: "/qa/audit-findings/{findingId}/waive"
    description: "Waive a MINOR finding; refunds points"
    roles: [QaManager]
    code: 200
    input: []
    output: AuditFinding
    side_effects: ["points_deducted refunded to technician.training_score"]

  # --- Supplier notification helper (business endpoint) ---
  - method: POST
    path: "/qa/products/{productId}/supplier-allergen-change"
    description: "Record a supplier allergen change notification: bumps label_revision and updates allergen_set, raising a SUPPLIER_ALLERGEN_CHANGE incident"
    roles: [QaManager]
    code: 200
    input: [new_allergen_set, supplier_notice_ref]
    output: Product
    side_effects:
      - "Product.allergen_set replaced; label_revision incremented by 1"
      - "Incident created: incident_type=SUPPLIER_ALLERGEN_CHANGE, severity=MEDIUM, product_id=this"
      - "Existing DRAFT/SCHEDULED runs for this product keep label_revision_snapshot (stale-pin); future reconciliations flag REVISION_MISMATCH"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "Missing or malformed X-User-ID / X-User-Role headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or FK reference does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Payload fails schema/required-field validation" }
  - { id: ERR_INVALID_TIME_RANGE, http: 400, condition: "planned_end_utc <= planned_start_utc" }
  - { id: ERR_STALE_LINE_VERSION, http: 412, condition: "expected_line_version mismatch on ProductionLine (OCC)" }
  - { id: ERR_STALE_PROCEDURE_VERSION, http: 412, condition: "expected_procedure_version mismatch on ChangeoverProcedure (OCC)" }
  - { id: ERR_RUN_NOT_DRAFT, http: 409, condition: "Run not in DRAFT for schedule/reject/cancel" }
  - { id: ERR_RUN_NOT_SCHEDULED, http: 409, condition: "Run not in SCHEDULED for start/unschedule" }
  - { id: ERR_RUN_NOT_IN_PROGRESS, http: 409, condition: "Run not in IN_PROGRESS for complete" }
  - { id: ERR_RUN_NOT_CANCELLABLE, http: 409, condition: "Run not in DRAFT or SCHEDULED for cancel" }
  - { id: ERR_RUN_OVERLAP, http: 409, condition: "Half-open interval collision with another SCHEDULED/IN_PROGRESS run on same line" }
  - { id: ERR_RUN_NOT_DUE, http: 409, condition: "Logical clock < planned_start_utc at start" }
  - { id: ERR_LINE_NOT_OPEN, http: 409, condition: "Line posture gate failed for schedule/start" }
  - { id: ERR_LINE_ON_HOLD, http: 409, condition: "Line posture HOLD blocks changeover begin" }
  - { id: ERR_ALLERGEN_PROHIBITED_ON_LINE, http: 422, condition: "Introduced allergen mapped PROHIBITED on line" }
  - { id: ERR_ALLERGEN_INACTIVE, http: 422, condition: "Referenced allergen is_active=false" }
  - { id: ERR_PRODUCT_INACTIVE, http: 422, condition: "Referenced product is_active=false" }
  - { id: ERR_CHANGEOVER_MISSING, http: 409, condition: "changeover_required run lacks a covering PLANNED-or-later changeover" }
  - { id: ERR_CHANGEOVER_NOT_VALIDATED, http: 409, condition: "Covering changeover not VALIDATED at run start" }
  - { id: ERR_CHANGEOVER_NOT_PLANNED, http: 409, condition: "Changeover not PLANNED for begin" }
  - { id: ERR_CHANGEOVER_NOT_IN_EXECUTION, http: 409, condition: "Changeover not IN_EXECUTION for finish-execution" }
  - { id: ERR_CHANGEOVER_NOT_REWORK, http: 409, condition: "Changeover not REWORK_REQUIRED for reswab" }
  - { id: ERR_CHANGEOVER_TERMINAL, http: 409, condition: "Changeover in terminal state for cancel" }
  - { id: ERR_CHANGEOVER_BUDGET_SHORT, http: 422, condition: "scheduled_minutes < to_run.scheduled_changeover_minutes" }
  - { id: ERR_LABEL_RECONCILIATION_OPEN, http: 409, condition: "Unresolved non-MATCH label reconciliation blocks run completion" }
  - { id: ERR_RECON_NOT_OPEN, http: 409, condition: "LabelReconciliation not OPEN" }
  - { id: ERR_RECON_NOT_MATCH, http: 409, condition: "Only MATCH verdicts can be resolved directly" }
  - { id: ERR_REWORK_NOT_AVAILABLE, http: 409, condition: "ReworkBatch not AVAILABLE for commit" }
  - { id: ERR_REWORK_EXHAUSTED, http: 422, condition: "Commit quantity exceeds remaining_kg or remaining_kg == 0" }
  - { id: ERR_REWORK_CLASS_VIOLATION, http: 422, condition: "Target product rework_class forbids this commit" }
  - { id: ERR_REWORK_ALLERGEN_BREACH, http: 422, condition: "rework_allergen_set not subset of target allergen_set" }
  - { id: ERR_REWORK_TERMINAL, http: 409, condition: "ReworkBatch CONSUMED or SCRAPPED" }
  - { id: ERR_TECH_NOT_ACTIVE, http: 403, condition: "Technician SUSPENDED or SEPARATED cannot record swabs/audits" }
  - { id: ERR_TECH_NOT_CERTIFIED, http: 403, condition: "Technician not certified for procedure target allergen or certification expired" }
  - { id: ERR_TECH_NOT_SUSPENDED, http: 409, condition: "Technician not SUSPENDED for reinstate" }
  - { id: ERR_TECH_TERMINAL, http: 409, condition: "Technician SEPARATED" }
  - { id: ERR_INCIDENT_NOT_OPEN, http: 409, condition: "Incident not OPEN" }
  - { id: ERR_INCIDENT_NOT_INVESTIGATING, http: 409, condition: "Incident not INVESTIGATING" }
  - { id: ERR_INCIDENT_NOT_CONTAINED, http: 409, condition: "Incident not CONTAINED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same user cannot perform both sides of a segregated step" }
  - { id: ERR_FINDING_NOT_OPEN, http: 409, condition: "AuditFinding not OPEN or OVERDUE" }
  - { id: ERR_FINDING_NOT_MINOR, http: 422, condition: "Only MINOR findings may be waived" }
  - { id: ERR_PROCEDURE_NOT_DRAFT, http: 409, condition: "Procedure not DRAFT for approve" }
  - { id: ERR_PROCEDURE_NOT_APPROVED, http: 409, condition: "Procedure not APPROVED for retire" }
  - { id: ERR_PROCEDURE_IN_USE, http: 409, condition: "Active changeover references procedure" }
  - { id: ERR_SWAB_NOT_PENDING, http: 409, condition: "Changeover not SWAB_PENDING when recording a swab" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: QaManager
    description: "QA department manager; owns configuration entities and final closure authority"
    identity: "opaque"
    exclusive_operations:
      - "Create/update allergens, products, lines, matrix entries, procedures, technicians"
      - "Approve / retire changeover procedures"
      - "Close incidents; waive findings; reinstate/separate technicians"
      - "Set logical clock"
      - "Record supplier allergen change"
    shared_operations:
      - "Read all entities"
      - "Raise incidents manually"

  - name: QaSupervisor
    description: "Shift QA supervisor; owns scheduling, label reconciliation, investigation, rework scrapping"
    identity: "opaque"
    exclusive_operations:
      - "Create/schedule/unschedule/reject/cancel production runs"
      - "Plan changeovers; cancel changeovers"
      - "Resolve/escalate label reconciliations"
      - "Begin investigation / contain incidents"
