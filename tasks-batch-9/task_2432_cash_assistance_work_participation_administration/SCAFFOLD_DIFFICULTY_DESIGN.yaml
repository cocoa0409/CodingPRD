# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
#   Nine §0.5 rule_ids, each with >= 2 instances. Every numeric assert literal
#   below was computed by executing the §1.3 formulas against their constants.
#   The logical clock starts at 2026-08-01T00:00:00Z on service startup, so a
#   chain only calls POST /_clock/set_current_utc when it needs a later "now".
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: prospective_vs_retrospective_budgeting_diverge_on_identical_income_records
        grounds:
          - calculations.countable_income_determination
          - calculations.benefit_amount_calculation
          - entities.Application.fields.budgeting_method
          - entities.IncomeSource.fields.verification_status
          - entities.IncomeSource.fields.is_recurring
          - state_machines.Application.RECEIVED_to_DETERMINED
        distinguishing_aspect: |
          The two budgeting variants differ in BOTH the inclusion predicate and the
          per-row monthly derivation: PROSPECTIVE counts only VERIFIED recurring
          rows at gross_monthly_cents, while RETROSPECTIVE counts VERIFIED and
          UNVERIFIED rows at the floored three-month average, so byte-identical
          IncomeSource records yield countable_income_cents 29000 versus 44000 and
          determined_benefit_cents 17000 versus 4250.
        test_recipe:
          setup:
            - "Two households of size 3 with one adult and a 7-year-old child, both classified SINGLE_PARENT."
            - "Each household has one RECEIVED application with the same four income sources: a VERIFIED recurring EARNED source (gross 40000, months 41000/40000/39000), an UNVERIFIED non-recurring EARNED source (gross 30000, months 31000/30000/29000), a VERIFIED recurring UNEARNED_CHILD_SUPPORT source (gross 20000, months 20000 each), and a REFUSED recurring UNEARNED_UI source (gross 15000, months 15000 each)."
            - "The first application uses budgeting_method PROSPECTIVE; the second uses RETROSPECTIVE."
            - "Neither application has any resource item and neither household has a prior clock record."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Prospective Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_p_id: $.data.id }
            - call: "POST /households"
              payload: { head_of_household_name: "Retrospective Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_r_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_p_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_p_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_r_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "RETROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_r_id: $.data.id }
            - call: "POST /applications/${app_p_id}/income-sources"
              payload: { source_type: "EARNED", gross_monthly_cents: 40000, month_1_cents: 41000, month_2_cents: 40000, month_3_cents: 39000, is_recurring: true }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { inc_p1_id: $.data.id }
            - call: "POST /income-sources/${inc_p1_id}/verify"
              payload: { verification_status: "VERIFIED" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_p_id}/income-sources"
              payload: { source_type: "EARNED", gross_monthly_cents: 30000, month_1_cents: 31000, month_2_cents: 30000, month_3_cents: 29000, is_recurring: false }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_p_id}/income-sources"
              payload: { source_type: "UNEARNED_CHILD_SUPPORT", gross_monthly_cents: 20000, month_1_cents: 20000, month_2_cents: 20000, month_3_cents: 20000, is_recurring: true }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { inc_p3_id: $.data.id }
            - call: "POST /income-sources/${inc_p3_id}/verify"
              payload: { verification_status: "VERIFIED" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_p_id}/income-sources"
              payload: { source_type: "UNEARNED_UI", gross_monthly_cents: 15000, month_1_cents: 15000, month_2_cents: 15000, month_3_cents: 15000, is_recurring: true }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { inc_p4_id: $.data.id }
            - call: "POST /income-sources/${inc_p4_id}/verify"
              payload: { verification_status: "REFUSED" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_r_id}/income-sources"
              payload: { source_type: "EARNED", gross_monthly_cents: 40000, month_1_cents: 41000, month_2_cents: 40000, month_3_cents: 39000, is_recurring: true }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { inc_r1_id: $.data.id }
            - call: "POST /income-sources/${inc_r1_id}/verify"
              payload: { verification_status: "VERIFIED" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_r_id}/income-sources"
              payload: { source_type: "EARNED", gross_monthly_cents: 30000, month_1_cents: 31000, month_2_cents: 30000, month_3_cents: 29000, is_recurring: false }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_r_id}/income-sources"
              payload: { source_type: "UNEARNED_CHILD_SUPPORT", gross_monthly_cents: 20000, month_1_cents: 20000, month_2_cents: 20000, month_3_cents: 20000, is_recurring: true }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { inc_r3_id: $.data.id }
            - call: "POST /income-sources/${inc_r3_id}/verify"
              payload: { verification_status: "VERIFIED" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_r_id}/income-sources"
              payload: { source_type: "UNEARNED_UI", gross_monthly_cents: 15000, month_1_cents: 15000, month_2_cents: 15000, month_3_cents: 15000, is_recurring: true }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { inc_r4_id: $.data.id }
            - call: "POST /income-sources/${inc_r4_id}/verify"
              payload: { verification_status: "REFUSED" }
              as: Caseworker
              as_user_id: "cw-1"
          trigger:
            - call: "POST /applications/${app_p_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_r_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
          assert:
            - "Application.${app_p_id}.countable_income_cents == 29000"
            - "Application.${app_p_id}.determined_benefit_cents == 17000"
            - "Application.${app_r_id}.countable_income_cents == 44000"
            - "Application.${app_r_id}.determined_benefit_cents == 4250"
            - "Application.${app_p_id}.snapshot_family_type == SINGLE_PARENT"
            - "Application.${app_r_id}.snapshot_family_type == SINGLE_PARENT"

      - name: state_clock_and_federal_clock_diverge_over_extension_covered_months
        grounds:
          - calculations.time_limit_clock
          - entities.TimeLimitMonth.fields.state_clock_countable
          - entities.TimeLimitMonth.fields.federal_clock_countable
          - entities.Household.fields.extension_months_used
          - state_machines.TimeLimitExtension.REQUESTED_to_GRANTED
        distinguishing_aspect: |
          The STATE_CLOCK variant excludes months shielded by a GRANTED hardship
          extension while the FEDERAL_CLOCK variant does not, so after granting a
          2-month extension over 3 issued months the same TimeLimitMonth rows yield
          state_clock_months_used 1 and federal_clock_months_used 3.
          This is a different entity domain (time-limit ledger counts) from the
          income-budgeting instance.
          Cross-cutting layer probed: dual_variant_calculation.
        test_recipe:
          setup:
            - "A SINGLE_PARENT household of size 3 with countable income 29000 has an approved case in benefit_status ACTIVE with benefit_amount_cents 17000."
            - "Assistance has been issued for 2026-08, 2026-09 and 2026-10, so three TimeLimitMonth rows exist, all countable on both clocks."
            - "A HARDSHIP_DISABILITY extension request exists for first_effective_month 2026-09 with months_requested 3."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Clock Divergence Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/income-sources"
              payload: { source_type: "EARNED", gross_monthly_cents: 40000, month_1_cents: 40000, month_2_cents: 40000, month_3_cents: 40000, is_recurring: true }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { inc1_id: $.data.id }
            - call: "POST /income-sources/${inc1_id}/verify"
              payload: { verification_status: "VERIFIED" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_id}/income-sources"
              payload: { source_type: "UNEARNED_CHILD_SUPPORT", gross_monthly_cents: 20000, month_1_cents: 20000, month_2_cents: 20000, month_3_cents: 20000, is_recurring: true }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { inc2_id: $.data.id }
            - call: "POST /income-sources/${inc2_id}/verify"
              payload: { verification_status: "VERIFIED" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_id}/approve"
              payload: { certification_start_month: "2026-08" }
              as: EligibilitySupervisor
              as_user_id: "sup-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/issuances"
              payload: { benefit_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /cases/${case_id}/issuances"
              payload: { benefit_month: "2026-09" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /cases/${case_id}/issuances"
              payload: { benefit_month: "2026-10" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /cases/${case_id}/extensions"
              payload: { extension_type: "HARDSHIP_DISABILITY", months_requested: 3, first_effective_month: "2026-09" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { ext_id: $.data.id }
          trigger:
            - call: "POST /extensions/${ext_id}/grant"
              payload: { months_granted: 2 }
              as: EligibilitySupervisor
              as_user_id: "sup-1"
          assert:
            - "TimeLimitExtension.${ext_id}.status == GRANTED"
            - "TimeLimitExtension.${ext_id}.months_granted == 2"
            - "TimeLimitExtension.${ext_id}.last_effective_month == 2026-10"
            - "Household.${hh_id}.issued_countable_months == 3"
            - "Household.${hh_id}.state_clock_months_used == 1"
            - "Household.${hh_id}.federal_clock_months_used == 3"
            - "Household.${hh_id}.extension_months_used == 2"
            - "AssistanceCase.${case_id}.benefit_status == ACTIVE"

      - name: gross_versus_net_overpayment_establishment_from_identical_claim_inputs
        grounds:
          - calculations.overpayment_establishment
          - entities.Overpayment.fields.computation_method
          - entities.Overpayment.fields.offsetting_underpayment_cents
          - state_machines.Overpayment.DRAFT_to_ESTABLISHED
        distinguishing_aspect: |
          The GROSS variant ignores offsetting_underpayment_cents entirely while
          the NET variant subtracts it, so two claims with identical
          gross_amount_cents 34000 and offsetting_underpayment_cents 4000 establish
          at 34000 versus 30000 and open balances of 34000 versus 30000.
          This is a third entity domain (recovery ledger) distinct from income
          budgeting and time-limit clocks.
        test_recipe:
          setup:
            - "A SINGLE_PARENT case is ACTIVE with benefit_amount_cents 17000 and assistance issued for 2026-08."
            - "Two DRAFT overpayment claims cover month 2026-08 with claim_type CLIENT_ERROR, gross_amount_cents 34000 and offsetting_underpayment_cents 4000; one uses computation_method GROSS and the other NET."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Overpayment Variant Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/income-sources"
              payload: { source_type: "EARNED", gross_monthly_cents: 40000, month_1_cents: 40000, month_2_cents: 40000, month_3_cents: 40000, is_recurring: true }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { inc1_id: $.data.id }
            - call: "POST /income-sources/${inc1_id}/verify"
              payload: { verification_status: "VERIFIED" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_id}/income-sources"
              payload: { source_type: "UNEARNED_CHILD_SUPPORT", gross_monthly_cents: 20000, month_1_cents: 20000, month_2_cents: 20000, month_3_cents: 20000, is_recurring: true }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { inc2_id: $.data.id }
            - call: "POST /income-sources/${inc2_id}/verify"
              payload: { verification_status: "VERIFIED" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_id}/approve"
              payload: { certification_start_month: "2026-08" }
              as: EligibilitySupervisor
              as_user_id: "sup-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/issuances"
              payload: { benefit_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /overpayments"
              payload: { case_id: "${case_id}", claim_type: "CLIENT_ERROR", months_covered: ["2026-08"], gross_amount_cents: 34000, computation_method: "GROSS", offsetting_underpayment_cents: 4000 }
              as: FiscalOfficer
              as_user_id: "fo-1"
              captures: { op_gross_id: $.data.id }
            - call: "POST /overpayments"
              payload: { case_id: "${case_id}", claim_type: "CLIENT_ERROR", months_covered: ["2026-08"], gross_amount_cents: 34000, computation_method: "NET", offsetting_underpayment_cents: 4000 }
              as: FiscalOfficer
              as_user_id: "fo-1"
              captures: { op_net_id: $.data.id }
          trigger:
            - call: "POST /overpayments/${op_gross_id}/establish"
              payload: {}
              as: FiscalOfficer
              as_user_id: "fo-1"
            - call: "POST /overpayments/${op_net_id}/establish"
              payload: {}
              as: FiscalOfficer
              as_user_id: "fo-1"
          assert:
            - "Overpayment.${op_gross_id}.established_amount_cents == 34000"
            - "Overpayment.${op_gross_id}.balance_cents == 34000"
            - "Overpayment.${op_net_id}.established_amount_cents == 30000"
            - "Overpayment.${op_net_id}.balance_cents == 30000"
            - "Overpayment.${op_gross_id}.monthly_recoupment_cents == 1700"
            - "Overpayment.${op_net_id}.monthly_recoupment_cents == 1700"
            - "Overpayment.${op_gross_id}.status == ESTABLISHED"

  - rule_id: combinatorial_formula
    instances:
      - name: benefit_pipeline_order_ratable_then_cap_then_sanction_then_minimum
        grounds:
          - calculations.benefit_amount_calculation
          - calculations.payment_standard
          - calculations.case_sanction_rollup
          - entities.AssistanceCase.fields.benefit_amount_cents
          - state_machines.ComplianceEpisode.CONCILIATION_to_SANCTION_IMPOSED
        distinguishing_aspect: |
          Five operations interact in a pinned order (deficit floor, ratable
          reduction, maximum-grant cap, sanction reduction, minimum-issuance floor):
          for household_size 11 with zero countable income the correct order yields
          determined_benefit_cents 90000 and, after a level-1 sanction,
          benefit_amount_cents 67500, whereas applying the sanction before the
          maximum-grant cap yields 70762 and applying the cap before the ratable
          reduction yields 57375.
        test_recipe:
          setup:
            - "A SINGLE_PARENT household of size 11 with no income sources and no resource items, so countable_income_cents is 0 and the payment standard is 111000."
            - "Its application is approved, assistance is issued for 2026-08, and the case is ACTIVE with compliance_status ASSIGNED."
            - "A ComplianceEpisode for REFUSED_ASSIGNMENT has completed conciliation and the clock has reached the conciliation deadline."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Large Household", county_code: "ADA", household_size: 11, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_id}/approve"
              payload: { certification_start_month: "2026-08" }
              as: EligibilitySupervisor
              as_user_id: "sup-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/issuances"
              payload: { benefit_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "GET /cases/${case_id}"
              payload: {}
              as: WorkProgramSpecialist
              as_user_id: "wps-1"
              captures: { case_v1: $.data.version }
            - call: "POST /compliance-episodes"
              payload: { case_id: "${case_id}", allegation_reason: "REFUSED_ASSIGNMENT", expected_case_version: "${case_v1}" }
              as: WorkProgramSpecialist
              as_user_id: "wps-1"
              captures: { ep_id: $.data.id }
            - call: "POST /compliance-episodes/${ep_id}/start-conciliation"
              payload: {}
              as: WorkProgramSpecialist
              as_user_id: "wps-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: WorkProgramSpecialist
              as_user_id: "wps-1"
          trigger:
            - call: "POST /compliance-episodes/${ep_id}/impose-sanction"
              payload: {}
              as: EligibilitySupervisor
              as_user_id: "sup-1"
          assert:
            - "Application.${app_id}.countable_income_cents == 0"
            - "Application.${app_id}.determined_benefit_cents == 90000"
            - "ComplianceEpisode.${ep_id}.sanction_level == 1"
            - "ComplianceEpisode.${ep_id}.sanction_pct == 0.25"
            - "AssistanceCase.${case_id}.sanction_level == 1"
            - "AssistanceCase.${case_id}.benefit_amount_cents == 67500"
            - "AssistanceCase.${case_id}.benefit_status == ACTIVE"
            - "AssistanceCase.${case_id}.compliance_status == SANCTIONED"

      - name: retrospective_average_floors_per_source_before_summing
        grounds:
          - calculations.countable_income_determination
          - calculations.benefit_amount_calculation
          - entities.IncomeSource.fields.month_1_cents
          - entities.Application.fields.budgeting_method
        distinguishing_aspect: |
          Flooring each source's three-month average before summing is not
          interchangeable with summing all nine month figures and flooring once:
          months 10000/10001/10001 and 20000/20001/20001 give a per-source total of
          30000 and determined_benefit_cents 34000, while the sum-then-average order
          gives 30001 and 33999. This instance pins rounding-order interaction,
          not the cap-and-sanction interaction of the other instance.
        test_recipe:
          setup:
            - "A SINGLE_PARENT household of size 3 with a RETROSPECTIVE application."
            - "Two VERIFIED recurring EARNED income sources with month figures 10000/10001/10001 and 20000/20001/20001 and no unearned income."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Rounding Order Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "RETROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/income-sources"
              payload: { source_type: "EARNED", gross_monthly_cents: 10000, month_1_cents: 10000, month_2_cents: 10001, month_3_cents: 10001, is_recurring: true }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { inc1_id: $.data.id }
            - call: "POST /income-sources/${inc1_id}/verify"
              payload: { verification_status: "VERIFIED" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_id}/income-sources"
              payload: { source_type: "EARNED", gross_monthly_cents: 20000, month_1_cents: 20000, month_2_cents: 20001, month_3_cents: 20001, is_recurring: true }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { inc2_id: $.data.id }
            - call: "POST /income-sources/${inc2_id}/verify"
              payload: { verification_status: "VERIFIED" }
              as: Caseworker
              as_user_id: "cw-1"
          trigger:
            - call: "POST /applications/${app_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
          assert:
            - "Application.${app_id}.countable_income_cents == 9000"
            - "Application.${app_id}.determined_benefit_cents == 34000"
