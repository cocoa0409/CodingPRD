  - rule_id: resource_temporal_overlap
    instances:
      - name: jig_half_open_window_with_trailing_changeover_buffer
        grounds:
          - calculations.jig_occupancy_conflict
          - entities.WeldJig.fields.changeover_buffer_min
          - entities.JigReservation.fields.occupancy_end_at
          - validations[priority=80]
          - errors.ERR_JIG_WINDOW_CONFLICT
        distinguishing_aspect: |
          The jig resource uses HALF-OPEN geometry with a 45-minute TRAILING buffer folded onto the
          existing interval, so a request starting at 11:44 conflicts while 11:45 - exactly at the buffered
          end - succeeds, and duration_minutes excludes the buffer. That is the opposite endpoint convention
          from the road-test lane, which is closed and buffer-free.
        test_recipe:
          setup:
            - "Jig JIG-TA-01 with changeover_buffer_min 45 holds one RESERVED window 09:00-11:00 on 2026-08-03, so its occupancy runs to 11:45 exclusive."
            - "Units SN-000101 (holder) and SN-000102 (challenger, PLANNED) exist on the CERTIFIED model."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantEngineer
              as_user_id: "pe-1"
            - call: "POST /trailer-models"
              payload: { model_code: "TA-7X14", description: "Tandem 7x14 cargo", axle_count: 2, axle_rating_lbs: 3500, design_braked_axle_count: 1, tire_load_rating_lbs: 1820, frame_design_code: "TA", frame_design_rated_lbs: 7200, coupler_rating_lbs: 7500, overall_width_in: 78.5, nominal_length_mm: 4267, nominal_width_mm: 2134, base_curb_weight_lbs: 1980, base_dealer_price_cents: 489900 }
              as: PlantEngineer
              as_user_id: "pe-1"
