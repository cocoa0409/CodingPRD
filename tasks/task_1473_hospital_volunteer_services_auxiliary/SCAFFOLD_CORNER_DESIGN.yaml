      - name: duplicate_clearance_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
        distinguishing_aspect: "At most one non-terminal clearance per (volunteer, type): a second BACKGROUND create fails while the first is SUBMITTED and STILL fails after the first is CLEARED; renewal must go through resubmit on the same record."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z; volunteer approved; BACKGROUND clearance SUBMITTED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VolunteerServicesDirector }
            - { call: "POST /auxiliary/volunteer-applications", payload: { full_name: "Dup Deb", date_of_birth: "1990-01-01", email: "dd@x.org", phone: "555-9704" }, as: VolunteerCoordinator, captures: { app: $.data.id } }
