              captures: { rs_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06", start_date: "2025-06-01", end_date: "2025-06-30", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-3003", customer_name: "Nate Okada", service_address: "5 Maple Cross", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", meter_serial: "MTR-U-1", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 100000 }
              as: MeterTechnician
              captures: { meter_id: $.data.id }
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-05-31", read_type: "ACTUAL", reading_value: 100000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-06-30", read_type: "ACTUAL", reading_value: 104000 }
              as: MeterTechnician
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_id: "${p1_id}", meter_id: "${meter_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { bill_id: $.data.id }
            - call: "POST /bills/${bill_id}/issue"
              as: BillingSupervisor
            - call: "GET /service-accounts/${acct_id}"
              as: CustomerServiceRep
              captures: { acct_v: $.data.version }
            - call: "POST /payment-arrangements"
              payload: { account_id: "${acct_id}", bill_id: "${bill_id}", total_amount_cents: 5210, down_payment_cents: 1042, installment_count: 6, expected_account_version: "${acct_v}" }
              as: CustomerServiceRep
              captures: { arr_id: $.data.id }
            - call: "POST /payment-arrangements/${arr_id}/activate"
              as: CustomerServiceRep
          trigger:
            - call: "POST /payment-arrangements/${arr_id}/record-payment"
              payload: { amount_cents: 694, on_time: false }
              as: CustomerServiceRep
            - call: "POST /payment-arrangements/${arr_id}/record-payment"
              payload: { amount_cents: 694, on_time: false }
              as: CustomerServiceRep
            - call: "POST /payment-arrangements/${arr_id}/reinstate"
              as: BillingSupervisor
            - call: "POST /payment-arrangements/${arr_id}/record-payment"
              payload: { amount_cents: 694, on_time: false }
              as: CustomerServiceRep
            - call: "POST /payment-arrangements/${arr_id}/record-payment"
              payload: { amount_cents: 694, on_time: false }
              as: CustomerServiceRep
            - call: "POST /payment-arrangements/${arr_id}/reinstate"
              as: BillingSupervisor
          assert:
            - "PaymentArrangement.${arr_id}.installment_cents == 694 and final_installment_cents == 698, summing with the down payment to 1042 + 5 * 694 + 698 == 5210"
            - "AFTER ONE LATE PAYMENT: status == ACTIVE with missed_payment_count == 1 — MISSED_PAYMENTS_TO_DEFAULT is 2, not 1, so the account is still IN_ARRANGEMENT"
            - "AFTER TWO LATE PAYMENTS: status == DEFAULTED with missed_payment_count == 2 and paid_installment_count == 2, and ServiceAccount.${acct_id}.credit_status == ARRANGEMENT_DEFAULTED"
            - "FIRST REINSTATE: HTTP 200, status == ACTIVE, reinstatement_count == 1, missed_payment_count reset to 0, and credit_status back to IN_ARRANGEMENT"
            - "AFTER TWO MORE LATE PAYMENTS: status == DEFAULTED again with missed_payment_count == 2 and paid_installment_count == 4 — still short of installment_count 6, so COMPLETED does not fire"
            - "SECOND REINSTATE: HTTP 422 with error_id ERR_REINSTATEMENT_LIMIT because reinstatement_count 1 is not less than MAX_ARRANGEMENT_REINSTATEMENTS 1"
            - "PaymentArrangement.${arr_id}.status is still DEFAULTED and reinstatement_count is still 1"
            - "ServiceAccount.${acct_id}.balance_cents == 1392 == 5210 - 1042 - 4 * 694 and credit_status == ARRANGEMENT_DEFAULTED"

      - name: corner_calc_precision_tier_three_surcharge_line_lands_on_an_exact_half_cent
        claim_type: precision
        grounds:
          - calculations.tiered_water_charge
        distinguishing_aspect: |
          A 41000-gallon SUMMER bill drives the tier-3 surcharge line to 31000 * 890 * 11500 /
          10000000 == 31728.5 cents exactly — a true half-cent tie. round_half_up gives 31729 and a
          44939-cent total; banker's rounding, truncation or floor all give 31728 and 44938. A second
          bill at 40204 gallons lands on 30913.794, which rounds to 30914 under every sane rule, so
          the pair isolates the tie-breaking rule itself rather than the formula.
