          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "The DRAFT -> PUBLISHED precondition 'plan has >= 1 CasePlanLine' is enforced: publishing an empty plan returns ERR_INVALID_STATE_TRANSITION (409) and leaves plan_status DRAFT with published_by_user_id unset."
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config; clock at 2026-08-05T08:00:00Z; CasePlan CP1 (service_date 2026-08-05) is in DRAFT with no lines."
