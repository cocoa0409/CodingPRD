            - call: "POST /delivery-calls/00000000-0000-4000-8000-000000000106/record-arrival"
              payload: { arrived_at: "2026-08-03T09:30:00Z" }
              as: ProductionPlanner
              captures: { err_r8_id: $.data.error_id }
            - call: "GET /parts/00000000-0000-4000-8000-000000000104/warranty-metrics"
              payload: {}
              as: ProductionPlanner
              captures: { err_r9_id: $.data.error_id }
          assert:
            - "All nine triggers: HTTP 403 with error.error_id == ERR_ROLE_NOT_PERMITTED — never 404, never 422"
            - "Trigger 4 confirms PlantAdmin has no hierarchical override: it is master-data owner, not a super-user"
            - "Trigger 8 confirms record-arrival is SupplierPortal-exclusive even for the planner who booked the call"
            - "Trigger 9 confirms the warranty-metrics read is limited to PlantAdmin, EngineeringLead and WarrantyAnalyst"

      - name: shared_operations_accept_either_owning_role
        claim_type: role_permission
        grounds:
          - roles.PlantAdmin.shared_operations
          - roles.EngineeringLead.shared_operations
          - roles.LineOperator.shared_operations
        distinguishing_aspect: "Everything listed as shared really is shared: PlantAdmin drives BOM authoring, shift planning, slot creation, dock calls, stop/start and the checkpoint, and the second BOM line it writes needs its own freshly read expected_model_variant_version because EngineeringLead's write already bumped the variant."
        test_recipe:
          setup:
            - "Line L1 with ST10/ST20, SUP1, P-DOOR-A; WM-X in DRAFT with POS-DOOR authored by EngineeringLead"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - *c_wmx
            - *c_bomx
            - call: "GET /model-variants/${wmx_id}"
              payload: {}
              as: PlantAdmin
              captures: { wmx_v3: $.data.version }
          trigger:
            - call: "POST /bom-lines"
              payload: { model_variant_id: "${wmx_id}", part_id: "${p_door_id}", station_id: "${st20_id}", bom_position_code: "POS-LID", qty_per_unit: 1, effective_from_sequence: 1, expected_model_variant_version: "${wmx_v3}" }
              as: PlantAdmin
              captures: { bom_lid_id: $.data.id }
            - *c_relx
            - call: "GET /lines/${line_id}"
              payload: {}
              as: PlantAdmin
              captures: { line_v_admin: $.data.version }
            - call: "POST /shift-plans"
              payload: { line_id: "${line_id}", shift_date: "2026-08-03", shift_code: "A", planned_headcount: 20, shift_start: "2026-08-03T06:00:00Z", shift_end: "2026-08-03T14:00:00Z", expected_line_version: "${line_v_admin}" }
              as: PlantAdmin
              captures: { shift_admin_id: $.data.id }
            - call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wmx_id}", sequence_index: 1, planned_start: "2026-08-03T07:00:00Z" }
              as: PlantAdmin
              captures: { slot_admin_id: $.data.id }
            - call: "POST /delivery-calls"
              payload: { supplier_id: "${sup1_id}", part_id: "${p_door_id}", station_id: "${st10_id}", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z", sequenced_qty: 4 }
              as: PlantAdmin
              captures: { call_admin_id: $.data.id }
            - call: "POST /lines/${line_id}/stop"
              payload: { reason: "SAFETY_DRILL" }
              as: PlantAdmin
            - call: "POST /lines/${line_id}/start"
              payload: {}
              as: PlantAdmin
            - call: "POST /lines/${line_id}/run-checkpoint"
              payload: {}
              as: PlantAdmin
          assert:
            - "Trigger 1: HTTP 201 — BomLine.${bom_lid_id} is ACTIVE at ST20; POST /bom-lines works for PlantAdmin as well as EngineeringLead"
            - "Triggers 4, 5 and 6: HTTP 201 for the shift plan, build slot and dock call created by PlantAdmin"
            - "Triggers 7 and 8: Line.${line_id}.operating_mode goes STOPPED (stop_reason 'SAFETY_DRILL') then RUNNING again, with current_family_code still FAM_A and changeover_count == 0"
            - "Trigger 9: HTTP 200 with Line.${line_id}.checkpoint_index == 1; BuildSlot.${slot_admin_id} is still PLANNED (planned_start 07:00 is in the future of the 06:00 clock)"

      - name: supplier_portal_reads_are_scoped_to_the_calling_supplier
        claim_type: role_scoping
        grounds:
          - roles.SupplierPortal
          - validations[priority 6] ERR_SUPPLIER_SCOPE_VIOLATION
        distinguishing_aspect: "For SupplierPortal the X-User-ID IS the Supplier.id: its own row and its own calls and parts read back normally, an explicit filter for another supplier is 403, and an unfiltered list is silently narrowed to its own rows rather than 403."
        test_recipe:
          setup:
            - "Line L1 with ST10; SUP1 with part P-DOOR-A and one SCHEDULED call 09:00-10:00; SUP2 with part P-HOSE-B and one SCHEDULED call 11:00-12:00 at the same station"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_sup1
            - *c_pdoor
            - *c_call1
            - call: "POST /suppliers"
              payload: { supplier_code: "SUP2", name: "Hose Partners SA", sync_window_minutes: 30 }
              as: PlantAdmin
              captures: { sup2_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "P-HOSE-B", supplier_id: "${sup2_id}", is_sequenced_module: false, line_side_max_units: 12 }
              as: PlantAdmin
              captures: { p_hose_id: $.data.id }
            - call: "POST /delivery-calls"
              payload: { supplier_id: "${sup2_id}", part_id: "${p_hose_id}", station_id: "${st10_id}", window_start: "2026-08-03T11:00:00Z", window_end: "2026-08-03T12:00:00Z", sequenced_qty: 2 }
              as: ProductionPlanner
              captures: { call_sup2_id: $.data.id }
          trigger:
            - call: "GET /suppliers/${sup1_id}"
              payload: {}
              as: SupplierPortal
              as_user_id: "${sup1_id}"
            - call: "GET /suppliers/${sup2_id}"
              payload: {}
              as: SupplierPortal
              as_user_id: "${sup1_id}"
              captures: { err_sc1_id: $.data.error_id }
            - call: "GET /delivery-calls"
              payload: {}
              as: SupplierPortal
              as_user_id: "${sup1_id}"
            - call: "GET /delivery-calls/${call_sup2_id}"
              payload: {}
              as: SupplierPortal
              as_user_id: "${sup1_id}"
              captures: { err_sc2_id: $.data.error_id }
            - call: "GET /parts?supplier_id=${sup2_id}"
              payload: {}
              as: SupplierPortal
              as_user_id: "${sup1_id}"
              captures: { err_sc3_id: $.data.error_id }
            - call: "GET /parts"
              payload: {}
              as: SupplierPortal
              as_user_id: "${sup1_id}"
          assert:
            - "Trigger 1: HTTP 200 with data.id == ${sup1_id}, on_time_score == 100.00 and status == APPROVED"
            - "Triggers 2, 4 and 5: HTTP 403 with error.error_id == ERR_SUPPLIER_SCOPE_VIOLATION"
            - "Trigger 3: HTTP 200 with total_count == 1 and items[0].id == ${call1_id} — SUP2's call is filtered out, not rejected"
            - "Trigger 6: HTTP 200 with total_count == 1 and items[0].id == ${p_door_id}"

      - name: supplier_scope_violation_on_record_arrival
        claim_type: role_scoping
        grounds:
          - roles.SupplierPortal.exclusive_operations
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / supplier_scope_outranks_invalid_call_state
          rationale: "The write-side scope check, including its precedence over the call's own state, is asserted there."

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_shift_plan_create_rejects_a_stale_line_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.shift-plan-create-stale-line
          - errors.ERR_STALE_LINE_VERSION
        distinguishing_aspect: "The §1.2.1 rule for POST /shift-plans: a version read before the previous plan was written is refused with 412 ERR_STALE_LINE_VERSION, and because every accepted plan bumps Line.version, the SAME token that just worked is stale on the very next call."
        test_recipe:
          setup:
            - "Line L1 with ST10/ST20; the client has read Line.version once and holds it as ${line_v}"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_lineread
          trigger:
            - call: "POST /shift-plans"
              payload: { line_id: "${line_id}", shift_date: "2026-08-03", shift_code: "A", planned_headcount: 20, shift_start: "2026-08-03T06:00:00Z", shift_end: "2026-08-03T14:00:00Z", expected_line_version: "${line_v} + 5" }
              as: ProductionPlanner
              captures: { err_occ1_id: $.data.error_id }
            - call: "POST /shift-plans"
              payload: { line_id: "${line_id}", shift_date: "2026-08-03", shift_code: "A", planned_headcount: 20, shift_start: "2026-08-03T06:00:00Z", shift_end: "2026-08-03T14:00:00Z", expected_line_version: "${line_v}" }
              as: ProductionPlanner
              captures: { plan_ok_id: $.data.id }
            - call: "POST /shift-plans"
              payload: { line_id: "${line_id}", shift_date: "2026-08-03", shift_code: "B", planned_headcount: 20, shift_start: "2026-08-03T14:00:00Z", shift_end: "2026-08-03T22:00:00Z", expected_line_version: "${line_v}" }
              as: ProductionPlanner
              captures: { err_occ2_id: $.data.error_id }
            - call: "GET /lines/${line_id}"
              payload: {}
              as: ProductionPlanner
          assert:
            - "Trigger 1: HTTP 412 with error.error_id == ERR_STALE_LINE_VERSION and no ShiftPlan created"
            - "Trigger 2: HTTP 201 — ShiftPlan.${plan_ok_id}.status == ACTIVE with available_labor_minutes == 480"
            - "Trigger 3: HTTP 412 with error.error_id == ERR_STALE_LINE_VERSION — the token was consumed by trigger 2, even though shift B would not have overlapped shift A"
            - "Trigger 4: Line.${line_id}.version == ${line_v} + 1 — exactly one accepted write, exactly one bump; GET /lines/${line_id}/shift-plans returns total_count == 1"

      - name: occ_bom_line_create_rejects_a_stale_model_variant_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.bom-line-create-stale-model-variant
          - errors.ERR_STALE_MODEL_VARIANT_VERSION
        distinguishing_aspect: "The §1.2.1 rule for POST /bom-lines, tested on its own rather than against a competing state error: a stale token is 412, the fresh token succeeds, and re-using the fresh token for a second position is 412 because the first insert bumped the variant."
        test_recipe:
          setup:
            - "Line L1 with ST10/ST20, SUP1, P-DOOR-A; ModelVariant WM-X in DRAFT with version read once as ${wmx_v}"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - *c_wmx
          trigger:
            - call: "POST /bom-lines"
              payload: { model_variant_id: "${wmx_id}", part_id: "${p_door_id}", station_id: "${st10_id}", bom_position_code: "POS-DOOR", qty_per_unit: 2, effective_from_sequence: 1, expected_model_variant_version: "${wmx_v} + 7" }
              as: EngineeringLead
              captures: { err_occ3_id: $.data.error_id }
            - call: "POST /bom-lines"
              payload: { model_variant_id: "${wmx_id}", part_id: "${p_door_id}", station_id: "${st10_id}", bom_position_code: "POS-DOOR", qty_per_unit: 2, effective_from_sequence: 1, expected_model_variant_version: "${wmx_v}" }
              as: EngineeringLead
              captures: { bom_ok_id: $.data.id }
            - call: "POST /bom-lines"
              payload: { model_variant_id: "${wmx_id}", part_id: "${p_door_id}", station_id: "${st20_id}", bom_position_code: "POS-LID", qty_per_unit: 1, effective_from_sequence: 1, expected_model_variant_version: "${wmx_v}" }
              as: EngineeringLead
              captures: { err_occ4_id: $.data.error_id }
            - call: "GET /model-variants/${wmx_id}"
              payload: {}
              as: EngineeringLead
          assert:
            - "Trigger 1: HTTP 412 with error.error_id == ERR_STALE_MODEL_VARIANT_VERSION and GET /bom-lines?model_variant_id=${wmx_id} still total_count == 0"
            - "Trigger 2: HTTP 201 — BomLine.${bom_ok_id}.status == ACTIVE with superseded_by_bom_line_id null"
            - "Trigger 3: HTTP 412 with error.error_id == ERR_STALE_MODEL_VARIANT_VERSION"
            - "Trigger 4: ModelVariant.${wmx_id}.version == ${wmx_v} + 1 and status is still DRAFT"

      - name: cascading_side_effects_run_four_levels_deep
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: transitive_cascade / checkpoint_miss_demotes_supplier_and_de_sequences_slot_depth_four
          rationale: "A four-level chain with every intermediate level asserted is exactly that instance (and two sibling cascades)."

      - name: dual_variant_calculation_produces_two_results_from_one_data_set
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: dual_variant_calc / efficiency_provisional_as_tested_vs_certification_average
          rationale: "Both variants and their delta on the same test set are asserted there, and again for warranty rates in the sibling instance."

      - name: rate_threshold_trigger_fires_on_the_cohort_variant_only
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
          - calculations.warranty_failure_rate.constants.WARRANTY_RATE_TRIGGER
        excluded_because:
          difficulty_instance: transitive_cascade / warranty_design_defect_mints_change_and_blocks_sequencing_depth_three
          rationale: "The >= WARRANTY_RATE_TRIGGER breach, the minted WARRANTY-origin change and the resulting sequencing block are asserted there; the pre-breach reading of the same metric is covered by the calculations instance warranty_metrics_read_is_all_zero_before_any_return."

      - name: rate_threshold_resets_when_the_attribution_is_withdrawn
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
        excluded_because:
          difficulty_instance: compensating_invariant / defect_attribution_conserved_across_warranty_withdrawal
          rationale: "The reset of counter, rate and minted change on withdrawal is asserted there as a conservation invariant."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_consistency_every_derived_field_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope.success
        distinguishing_aspect: "Nothing lags: the sequence response itself already carries the pinned snapshots and allocations, the follow-up reads of Station, Line and ShiftPlan agree with it without any settling step, and the certify response carries efficiency_index and certification_tier in the same body that performed the transition."
        test_recipe:
          setup:
            - "Base fixture: Line L1 (ST10 capacity 40, ST20 capacity 40 -> presentation_slots_total 80), SUP1, P-DOOR-A, WM-X RELEASED, ShiftPlan A 06:00-14:00; slot index 1 at 07:00 PLANNED"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - *c_wmx
            - *c_bomx
            - *c_relx
            - *c_lineread
            - *c_shifta
            - *c_slot1
          trigger:
            - *c_seq1
            - call: "GET /stations/${st10_id}"
              payload: {}
              as: ProductionPlanner
            - call: "GET /lines/${line_id}"
              payload: {}
              as: ProductionPlanner
            - call: "GET /shift-plans/${shift_a_id}"
              payload: {}
              as: ProductionPlanner
            - *c_rel1
            - *c_hipot1
            - *c_cyc1
            - *c_leak1
            - *c_energy1
            - *c_water1
            - *c_cert1
          assert:
            - "Trigger 1's own 200 body already reports status SEQUENCED, allocated_slot_units == 2, option_points_snapshot == 4, labor_minutes_snapshot == 150, shift_plan_id == ${shift_a_id} and presentation_allocations == [{ station_id: ${st10_id}, slot_units: 2 }]"
            - "Trigger 2: Station.${st10_id}.presentation_slots_used == 2 — identical to the value implied by trigger 1, with no second write in between"
            - "Trigger 3: Line.${line_id}.presentation_slots_committed == 2, free_slot_pct == 97.50 and posture == OPEN"
            - "Trigger 4: ShiftPlan.${shift_a_id}.unit_labor_minutes == 150 and committed_labor_minutes == 150"
            - "Trigger 11 (certify): the 200 body itself carries quality_status CERTIFIED, efficiency_index == 0.94 and certification_tier == A — no follow-up read is needed to observe them"
