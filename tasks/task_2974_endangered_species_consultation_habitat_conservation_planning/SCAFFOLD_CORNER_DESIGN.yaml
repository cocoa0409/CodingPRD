  #   ERR_MITIGATION_SHORTFALL               C:unassured_funding_outranks_a_mitigation_shortfall_on_approval
  #   ERR_TAKE_LIMIT_EXCEEDED                C:take_limit_is_checked_against_the_remaining_units_before_the_report_is_applied
  #   ERR_RESERVE_CONTRIBUTION_INSUFFICIENT  C:changed_circumstance_waterfall_drains_the_reserve_before_the_permittee
  # ==========================================================================
  - section: errors
    instances:

      - name: every_error_body_carries_only_an_error_id_and_a_message
        claim_type: error_response_shape
        grounds:
          - response_envelope.error
          - errors["ERR_UNAUTHENTICATED"]
          - errors["ERR_ROLE_NOT_PERMITTED"]
          - errors["ERR_INVALID_STATE_TRANSITION"]
        distinguishing_aspect: >-
          One envelope serves all six status families. The data object of a
          failure carries exactly error_id and message and never leaks the
          resource that was refused — no version number, no current state, no
          partial entity — while meta keeps the same api_request_id /
          api_request_timestamp pair as a success. An implementation that returns
          the offending row alongside the error would hand a client the state it
          was just denied.
        test_recipe:
          setup:
            - "Canonical fixture through the effect determination: the action is in FORMAL_CONSULTATION and a second effect determination is therefore unlawful."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /species"
              payload: {scientific_name: "Gopherus agassizii", common_name: "Desert tortoise", listing_status: "ENDANGERED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.40, recovery_unit_population: 4000, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
