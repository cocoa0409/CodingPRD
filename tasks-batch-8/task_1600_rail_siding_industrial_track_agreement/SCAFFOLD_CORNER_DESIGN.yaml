  instances:
  - name: demurrage_tier_boundary_day2_vs_day3
    claim_type: correct_result
    grounds:
    - calculations.demurrage_charge
    - entities.CarDwell.fields.chargeable_days
    distinguishing_aspect: 'At the tier boundary the marginal day doubles in price: 2 chargeable days bill 15000 (all tier-1),
      while 3 chargeable days bill 30000 — the third day alone costs 15000 (tier-2 rate).'
    test_recipe:
      setup:
      - ACTIVE agreement A (rates 7500/15000, free 48h)
      - RAILROAD cars RBOX9401 and RBOX9402 both SPOTTED 2026-08-01T00:00:00Z
      setup_api_calls:
      - call: POST /agreements
        payload:
          shipper_name: Acme Chemical Co
          shipper_user_id: shipper-user-1
          facility_name: Acme Baton Rouge Plant
          term_start_date: '2026-08-01'
          term_end_date: '2027-07-31'
          renewal_notice_days: 90
          renewal_term_months: 12
          shipper_cost_share_pct: 40
          liability_cap_cents: 100000
          shipper_indemnity_default_pct: 50
          free_time_hours: 48
          demurrage_base_rate_cents: 7500
          demurrage_escalated_rate_cents: 15000
          storage_rate_per_car_month_cents: 10012
          inspection_cadence_days: 90
          removal_period_days: 90
          removal_penalty_per_day_cents: 5000
          service_days_of_week:
          - MON
          - WED
          - FRI
          max_switches_per_day: 1
        as: RailroadContractsManager
        captures:
          agr_id: $.data.id
      - call: POST /agreements/${agr_id}/submit
        as: RailroadContractsManager
      - call: POST /agreements/${agr_id}/countersign
        as: ShipperFacilityManager
        as_user_id: shipper-user-1
      - call: POST /car-dwells
        payload:
          agreement_id: ${agr_id}
          car_mark: RBOX9401
          car_ownership: RAILROAD
          placed_at: '2026-08-01T00:00:00Z'
        as: RailroadServiceManager
        captures:
          d2: $.data.id
      - call: POST /car-dwells
        payload:
          agreement_id: ${agr_id}
          car_mark: RBOX9402
          car_ownership: RAILROAD
          placed_at: '2026-08-01T00:00:00Z'
        as: RailroadServiceManager
        captures:
          d3: $.data.id
      trigger:
      - call: POST /car-dwells/${d2}/release
        payload:
          released_at: '2026-08-05T00:00:00Z'
        as: RailroadServiceManager
        captures:
          amt2: $.data.final_demurrage_cents
          days2: $.data.chargeable_days
      - call: POST /car-dwells/${d3}/release
        payload:
          released_at: '2026-08-06T00:00:00Z'
        as: RailroadServiceManager
        captures:
          amt3: $.data.final_demurrage_cents
          days3: $.data.chargeable_days
      assert:
      - days2 == 2 and amt2 == 15000 (2 * 7500, entirely tier-1)
      - days3 == 3 and amt3 == 30000 (2 * 7500 + 1 * 15000; the marginal third day bills at the escalated rate)
