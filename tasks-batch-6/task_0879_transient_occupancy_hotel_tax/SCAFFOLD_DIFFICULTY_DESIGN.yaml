        distinguishing_aspect: >
          A TaxReturn cannot be FILED while its parent Operator is SUSPENDED (ERR_OPERATOR_NOT_ACTIVE);
          the return's transition is gated by the Operator entity's state — TaxReturn<-Operator pair.
        test_recipe:
