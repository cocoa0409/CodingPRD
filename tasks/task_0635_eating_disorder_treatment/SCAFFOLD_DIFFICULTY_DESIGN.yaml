      - name: authorization_expiry_cascade_depth2_to_admission
        grounds:
          - state_machines.InsuranceAuthorization.APPROVED_to_EXPIRED
          - state_machines.Admission.ADMITTED_to_DISCHARGE_PENDING
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (authorization expire, not discharge):
          expire -> InsuranceAuthorization APPROVED->EXPIRED (hop1) -> because the parent
          admission is ADMITTED, that expiry cascades Admission ADMITTED->DISCHARGE_PENDING
          (hop2). The second hop is caused by the first, not by the expire call directly.
        test_recipe:
          setup:
            - "An ADMITTED admission with an APPROVED authorization covered through 2026-01-08; clock advanced to 2026-01-08 so the window has passed."
          setup_api_calls:
