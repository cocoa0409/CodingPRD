              as_user_id: "${op_id}"
              captures: { pr_a_id: $.data.id }
          trigger:
            - call: "POST /permits"
              payload: { facility_id: "${fac_b_id}", permit_type: "ANNUAL", term_start_date: "2026-05-01", plan_review_id: "${pr_a_id}" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_PLAN_REVIEW_FACILITY_MISMATCH"
            - "GET /permits?facility_id=${fac_b_id} returns zero rows"

      - name: outstanding_fees_block_permit_issuance
        claim_type: Violation → Error
        grounds: ["validations[priority=40]", "errors[ERR_OUTSTANDING_FEES]", calculations.operator_fee_balance]
        distinguishing_aspect: "An unpaid 25000-cent plan-review charge makes fee_balance_cents non-zero, so ISSUE is refused with ERR_OUTSTANDING_FEES (402) and succeeds only after the operator pays."
        test_recipe:
          setup: ["A pool facility that does not require plan review nevertheless has an unpaid plan-review fee of 25000 cents, and its annual application sits in UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /plan-reviews"
              payload: { facility_id: "${fac_id}", project_type: "EQUIPMENT_REPLACEMENT", drawing_reference: "DR-EQ-9" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { pr_id: $.data.id }
            - call: "POST /permits"
              payload: { facility_id: "${fac_id}", permit_type: "ANNUAL", term_start_date: "2026-05-01" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "SUBMIT" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "START_REVIEW" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "ISSUE" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /operators/${op_id}/payments"
              payload: { amount_cents: 25000, reference_note: "Plan review fee" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "ISSUE" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
          assert:
            - "The first ISSUE returns 402 with data.error_id == ERR_OUTSTANDING_FEES"
            - "Permit.${permit_id}.status is still UNDER_REVIEW after the refusal"
            - "After the payment, Operator.${op_id}.fee_balance_cents == 0 and the second ISSUE succeeds"
            - "Permit.${permit_id}.status == ISSUED with assessed_fee_cents == 40000 and Operator.${op_id}.fee_balance_cents == 40000"

      - name: refund_requested_after_the_refund_window_rejected
        claim_type: Temporal validation
        grounds: ["validations[priority=41]", "errors[ERR_REFUND_NOT_ELIGIBLE]"]
        distinguishing_aspect: "PERMIT_REFUND_WINDOW_DAYS is 30 days from term_start_date 2026-04-01, so a refund requested at the 2026-05-02 clock is refused with ERR_REFUND_NOT_ELIGIBLE (409) while the revocation itself does not take effect."
        test_recipe:
          setup: ["An annual permit with term_start_date 2026-04-01 was issued at the 2026-05-01 clock; the clock has since moved to 2026-05-02T00:00:00Z, one day past the refund window."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
