# =============================================================================
# §1.9 Scaffold Corner Design (breadth / coverage index)
# task_0541_arbitration_admin  — complements SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8)
# Clock default = 2026-05-01T00:00:00Z. HEARING_NOTICE_DAYS=7, APPEAL_WINDOW_DAYS=30,
# NEUTRAL_BUFFER_MINUTES=30. Fee tiers: T1=75000 T2=175000 T3=400000 T4=700000 (cents);
# tier floors 1_000_000 / 7_500_000 / 50_000_000 inclusive.
# Breadth probe: every entity CRUD/listing, every error, every RBAC scoping, every
# invalid transition, field-shape edges and tier/notice boundaries. Deep multi-step
# scenarios already carried by §1.8 are emitted as excluded_because: stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section 1 — Entities (creation / retrieval / listing / not_found /
  #   required_fields / defaults / computed_fields / system_fields /
  #   type_constraints / foreign_key_integrity)
  # ===========================================================================
  - section: entities
    instances:

      - name: create_case_returns_201_with_computed_fee_fields
        claim_type: creation
        grounds:
          - entities.Case.fields.fee_tier
          - entities.Case.fields.filing_fee_cents
          - entities.Case.fields.status
        distinguishing_aspect: |
          POST /cases with an ARBITRATION panel-1 claim of 500000 returns 201 and the server
          computes fee_tier TIER_1 and filing_fee_cents 75000, with status FILED.
        test_recipe:
          setup:
            - "Empty DB; a single ARBITRATION filing at claim 500000 (below TIER_2 floor)."
          setup_api_calls: []
          trigger:
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "New Case", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Case.${c_id}.status == FILED"
            - "Case.${c_id}.fee_tier == TIER_1"
            - "Case.${c_id}.filing_fee_cents == 75000"
            - "Case.${c_id}.deposit_balance_cents == 0"

      - name: get_case_returns_stored_entity
        claim_type: retrieval
        grounds:
          - entities.Case.fields.title
          - entities.Case.fields.claim_amount_cents
        distinguishing_aspect: |
          GET /cases/{id} returns the previously created Case with matching title and
          claim_amount_cents, wrapped in the object response envelope.
        test_recipe:
          setup:
            - "One ARBITRATION case filed with title 'Readback' and claim 2000000."
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "Readback", claim_amount_cents: 2000000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /cases/${c_id}"
              as: CaseAdministrator
          assert:
            - "response.status == 200"
            - "Case.${c_id}.title == Readback"
            - "Case.${c_id}.claim_amount_cents == 2000000"

      - name: list_cases_paginated_returns_envelope
        claim_type: listing
        grounds:
          - entities.Case.fields.status
        distinguishing_aspect: |
          With two cases filed, GET /cases with limit 1 returns a length-1 array plus
          total_count >= 2 and has_more == true in the pagination envelope.
        test_recipe:
          setup:
            - "Two ARBITRATION cases filed."
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "One", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "Two", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
          trigger:
            - call: "GET /cases"
              payload: { limit: 1, offset: 0 }
              as: CaseAdministrator
          assert:
            - "response.status == 200"
            - "response.total_count >= 2"
            - "response.has_more == true"
            - "len(response.data) == 1"

      - name: list_cases_filtered_by_status
        claim_type: listing
        grounds:
          - entities.Case.fields.status
        distinguishing_aspect: |
          GET /cases?status=WITHDRAWN returns only the WITHDRAWN case, excluding the FILED one;
          the status filter narrows the collection.
        test_recipe:
          setup:
            - "One FILED case and one WITHDRAWN case."
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "Stays", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "Gone", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_gone: $.data.id }
            - call: "POST /cases/${c_gone}/transition"
              payload: { to_status: "WITHDRAWN" }
              as: CaseAdministrator
          trigger:
            - call: "GET /cases"
              payload: { status: "WITHDRAWN" }
              as: CaseAdministrator
          assert:
            - "response.status == 200"
            - "every item in response.data has status == WITHDRAWN"
            - "response.data contains Case ${c_gone}"

      - name: get_case_nonexistent_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          GET /cases/{unknown-uuid} resolves no resource and returns 404 ERR_NOT_FOUND.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /cases/00000000-0000-0000-0000-000000000000"
              as: CaseAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.error_id == ERR_NOT_FOUND"

      - name: create_case_missing_required_claim_amount_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: |
          POST /cases omitting the required claim_amount_cents returns 400 ERR_VALIDATION;
          no Case is created.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "NoClaim", panel_size: 1 }
              as: CaseAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.error_id == ERR_VALIDATION"

      - name: create_case_default_panel_and_strikes_applied
        claim_type: defaults
        grounds:
          - entities.Case.fields.panel_size
          - entities.Case.fields.strikes_per_party
        distinguishing_aspect: |
          POST /cases omitting panel_size and strikes_per_party applies the declared defaults
          panel_size 1 and strikes_per_party 2.
        test_recipe:
          setup:
            - "Empty DB; a filing that omits panel_size and strikes_per_party."
          setup_api_calls: []
          trigger:
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "Defaults", claim_amount_cents: 500000 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Case.${c_id}.panel_size == 1"
            - "Case.${c_id}.strikes_per_party == 2"

      - name: create_case_client_fee_tier_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Case.fields.fee_tier
          - calculations.case_fee_tier
        distinguishing_aspect: |
          A client-supplied fee_tier of TIER_4 in the POST /cases body is ignored; the server
          recomputes fee_tier TIER_1 from the 500000 claim.
        test_recipe:
          setup:
            - "Empty DB; a TIER_1-magnitude claim with a bogus client fee_tier override."
          setup_api_calls: []
          trigger:
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "Ignore", claim_amount_cents: 500000, panel_size: 1, fee_tier: "TIER_4" }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Case.${c_id}.fee_tier == TIER_1"

      - name: create_case_system_status_and_version_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Case.fields.status
        distinguishing_aspect: |
          On POST /cases the server generates id, created_at and version==1 and forces status FILED
          regardless of client input.
        test_recipe:
          setup:
            - "Empty DB; a filing that tries to preset status CLOSED and version 9."
          setup_api_calls: []
          trigger:
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "Sys", claim_amount_cents: 500000, panel_size: 1, status: "CLOSED", version: 9 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Case.${c_id}.status == FILED"
            - "Case.${c_id}.version == 1"

      - name: create_case_invalid_case_type_enum_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=4.5]
          - errors[ERR_INVALID_ENUM]
        distinguishing_aspect: |
          POST /cases with case_type 'LITIGATION' (outside {ARBITRATION, MEDIATION}) returns
          422 ERR_INVALID_ENUM.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /cases"
              payload: { case_type: "LITIGATION", title: "BadEnum", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.error_id == ERR_INVALID_ENUM"

      - name: create_case_panel_size_two_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=4]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: |
          POST /cases with panel_size 2 (not in {1,3}) returns 400 ERR_VALIDATION.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "Panel2", claim_amount_cents: 500000, panel_size: 2 }
              as: CaseAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.error_id == ERR_VALIDATION"

      - name: create_mediation_panel_three_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=4]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: |
          POST /cases MEDIATION with panel_size 3 violates the MEDIATION=>panel_size 1 rule and
          returns 400 ERR_VALIDATION.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /cases"
              payload: { case_type: "MEDIATION", title: "MedPanel3", claim_amount_cents: 500000, panel_size: 3 }
              as: CaseAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.error_id == ERR_VALIDATION"

      - name: create_party_returns_201_with_strike_defaults
        claim_type: creation
        grounds:
          - entities.Party.fields.strikes_used
          - entities.Party.fields.strikes_remaining
        distinguishing_aspect: |
          POST /parties on a case with strikes_per_party 2 returns 201 with strikes_used 0 and
          strikes_remaining 2.
        test_recipe:
          setup:
            - "One ARBITRATION case (strikes_per_party 2)."
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "PartyHost", claim_amount_cents: 500000, panel_size: 1, strikes_per_party: 2 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "Cl", share_pct: 100 }
              as: CaseAdministrator
              captures: { p_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Party.${p_id}.strikes_used == 0"
            - "Party.${p_id}.strikes_remaining == 2"

      - name: create_party_case_not_found
        claim_type: foreign_key_integrity
        grounds:
          - entities.Party.fields.case_id
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          POST /parties with a case_id that resolves to no Case returns 404 ERR_NOT_FOUND.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /parties"
              payload: { case_id: "00000000-0000-0000-0000-000000000000", role: "CLAIMANT", display_name: "X", share_pct: 100 }
              as: CaseAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.error_id == ERR_NOT_FOUND"

      - name: list_parties_of_case_reverse_fk
        claim_type: foreign_key_integrity
        grounds:
          - entities.Party.fields.case_id
        distinguishing_aspect: |
          GET /cases/{id}/parties returns exactly the two parties whose case_id equals the path id.
        test_recipe:
          setup:
            - "One case with a CLAIMANT and a RESPONDENT party."
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "PL", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 50 }
              as: CaseAdministrator
              captures: { pA: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "RESPONDENT", display_name: "B", share_pct: 50 }
              as: CaseAdministrator
              captures: { pB: $.data.id }
          trigger:
            - call: "GET /cases/${c_id}/parties"
              as: CaseAdministrator
          assert:
            - "response.status == 200"
            - "len(response.data) == 2"
            - "response.data contains Party ${pA} and Party ${pB}"

      - name: create_neutral_returns_201_active_roster
        claim_type: creation
        grounds:
          - entities.Neutral.fields.roster_status
        distinguishing_aspect: |
          POST /neutrals returns 201 with roster_status defaulting to ACTIVE.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /neutrals"
              payload: { full_name: "Judge X", neutral_type: "ARBITRATOR", hourly_rate_cents: 50000 }
              as: CaseAdministrator
              captures: { n_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Neutral.${n_id}.roster_status == ACTIVE"

      - name: list_neutrals_filtered_by_roster_status
        claim_type: listing
        grounds:
          - entities.Neutral.fields.roster_status
        distinguishing_aspect: |
          After suspending one neutral, GET /neutrals?roster_status=SUSPENDED returns only the
          suspended neutral, excluding the ACTIVE one.
        test_recipe:
          setup:
            - "Two neutrals; one transitioned to SUSPENDED."
          setup_api_calls:
            - call: "POST /neutrals"
              payload: { full_name: "Active One", neutral_type: "ARBITRATOR", hourly_rate_cents: 50000 }
              as: CaseAdministrator
            - call: "POST /neutrals"
              payload: { full_name: "Susp One", neutral_type: "ARBITRATOR", hourly_rate_cents: 50000 }
              as: CaseAdministrator
              captures: { n_s: $.data.id }
            - call: "POST /neutrals/${n_s}/transition"
              payload: { roster_status: "SUSPENDED" }
              as: CaseAdministrator
          trigger:
            - call: "GET /neutrals"
              payload: { roster_status: "SUSPENDED" }
              as: CaseAdministrator
          assert:
            - "response.status == 200"
            - "every item in response.data has roster_status == SUSPENDED"
            - "response.data contains Neutral ${n_s}"

      - name: create_candidate_returns_201_proposed
        claim_type: creation
        grounds:
          - entities.Candidate.fields.status
          - entities.Candidate.fields.neutral_id
        distinguishing_aspect: |
          POST /cases/{id}/candidates on a SELECTION case returns 201 with status PROPOSED and the
          supplied neutral_id.
        test_recipe:
          setup:
            - "A SELECTION-phase ARBITRATION case (both parties present) and a rostered ARBITRATOR."
          setup_api_calls:
            - call: "POST /neutrals"
              payload: { full_name: "Cand N", neutral_type: "ARBITRATOR", hourly_rate_cents: 50000 }
              as: CaseAdministrator
              captures: { n_id: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "CandHost", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "RESPONDENT", display_name: "B", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { cv_sel: $.data.version }
          trigger:
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n_id}", expected_case_version: "${cv_sel}" }
              as: CaseAdministrator
              captures: { cand: $.data.id }
          assert:
            - "response.status == 201"
            - "Candidate.${cand}.status == PROPOSED"
            - "Candidate.${cand}.neutral_id == ${n_id}"

      - name: add_candidate_neutral_not_found
        claim_type: foreign_key_integrity
        grounds:
          - entities.Candidate.fields.neutral_id
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          POST /cases/{id}/candidates with a neutral_id resolving to no Neutral returns 404
          ERR_NOT_FOUND.
        test_recipe:
          setup:
            - "A SELECTION-phase ARBITRATION case with both parties present."
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "BadNeutral", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "RESPONDENT", display_name: "B", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { cv_sel: $.data.version }
          trigger:
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "00000000-0000-0000-0000-000000000000", expected_case_version: "${cv_sel}" }
              as: CaseAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.error_id == ERR_NOT_FOUND"

      - name: list_candidacies_of_neutral_reverse_fk
        claim_type: foreign_key_integrity
        grounds:
          - entities.Candidate.fields.neutral_id
        distinguishing_aspect: |
          GET /neutrals/{id}/candidates returns the single candidacy whose neutral_id equals the
          path id.
        test_recipe:
          setup:
            - "A SELECTION case with one PROPOSED candidate for neutral n."
          setup_api_calls:
            - call: "POST /neutrals"
              payload: { full_name: "Rev N", neutral_type: "ARBITRATOR", hourly_rate_cents: 50000 }
              as: CaseAdministrator
              captures: { n_id: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "RevCand", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "RESPONDENT", display_name: "B", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { cv_sel: $.data.version }
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n_id}", expected_case_version: "${cv_sel}" }
              as: CaseAdministrator
              captures: { cand: $.data.id }
          trigger:
            - call: "GET /neutrals/${n_id}/candidates"
              as: CaseAdministrator
          assert:
            - "response.status == 200"
            - "len(response.data) == 1"
            - "response.data contains Candidate ${cand}"

      - name: create_hearing_returns_201_scheduled_with_duration
        claim_type: computed_fields
        grounds:
          - entities.Hearing.fields.duration_hours
          - entities.Hearing.fields.status
        distinguishing_aspect: |
          POST /cases/{id}/hearings for a 2026-06-20 09:00-12:00 window returns 201 with status
          SCHEDULED and computed duration_hours 3.
        test_recipe:
          setup:
            - "An appointed ARBITRATION case in HEARING; clock 2026-06-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CaseAdministrator
            - call: "POST /neutrals"
              payload: { full_name: "Hear N", neutral_type: "ARBITRATOR", hourly_rate_cents: 50000 }
              as: CaseAdministrator
              captures: { n_id: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "HearHost", claim_amount_cents: 2000000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "RESPONDENT", display_name: "B", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { cv_sel: $.data.version }
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n_id}", expected_case_version: "${cv_sel}" }
              as: CaseAdministrator
              captures: { cand: $.data.id }
            - call: "POST /candidates/${cand}/disclose"
              payload: { disclosure_text: "none", has_conflict: false }
              as: Neutral
              as_user_id: "${n_id}"
            - call: "POST /candidates/${cand}/transition"
              payload: { to_status: "CLEARED" }
              as: CaseAdministrator
            - call: "GET /cases/${c_id}"
              as: CaseAdministrator
              captures: { cv_pre: $.data.version }
            - call: "POST /cases/${c_id}/appoint"
              payload: { expected_case_version: "${cv_pre}" }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "HEARING" }
              as: CaseAdministrator
          trigger:
            - call: "POST /cases/${c_id}/hearings"
              payload: { hearing_type: "EVIDENTIARY", start_at: "2026-06-20T09:00:00Z", end_at: "2026-06-20T12:00:00Z", location: "Room A" }
              as: CaseAdministrator
              captures: { h: $.data.id }
          assert:
            - "response.status == 201"
            - "Hearing.${h}.status == SCHEDULED"
            - "Hearing.${h}.duration_hours == 3"

      - name: create_exchange_returns_201_pending_and_reverse_fk_list
        claim_type: creation
        grounds:
          - entities.Exchange.fields.status
          - entities.Exchange.fields.case_id
        distinguishing_aspect: |
          POST /cases/{id}/exchanges returns 201 with status PENDING, and GET /cases/{id}/exchanges
          lists it via the case_id reverse FK.
        test_recipe:
