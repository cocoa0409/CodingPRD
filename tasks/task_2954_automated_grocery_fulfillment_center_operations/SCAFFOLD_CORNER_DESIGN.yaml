      # ---- calculation rows already owned by the depth probe (§1.8) ----
      - name: variant_divergence_catchweight_provisional_vs_final_excluded
        claim_type: variant_divergence
        grounds:
          - calculations.order_line_catchweight_price
          - entities.OrderLine.provisional_line_price_cents
          - entities.OrderLine.final_line_price_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / catchweight_line_price_provisional_vs_final
          rationale: "Same order data priced by both variants, with the delta asserted on the ledger, is exactly the named §1.8 instance."
      - name: variant_selection_accuracy_gate_reads_only_the_unit_weighted_score_excluded
        claim_type: variant_selection
        grounds:
          - calculations.zone_inventory_accuracy
          - state_machines.GridZone[OPERATIONAL -> AUDIT_HOLD]
        excluded_because:
          difficulty_instance: dual_variant_calc / zone_inventory_accuracy_unit_vs_sku_weighted
          rationale: "Which variant drives the AUDIT_HOLD gate when the two disagree is the named §1.8 instance's whole point."
      - name: reconciliation_final_price_adjusts_the_order_ledger_excluded
        claim_type: reconciliation
        grounds:
          - calculations.order_line_catchweight_price
          - calculations.order_charge_waterfall
          - entities.CustomerOrder.billing_status
        excluded_because:
          difficulty_instance: dual_variant_calc / catchweight_line_price_provisional_vs_final
          rationale: "The provisional -> final switch and the resulting AUTHORIZED -> ADJUSTED delta on the order are asserted in the named §1.8 instance."
      - name: threshold_catchweight_tolerance_boundary_excluded
        claim_type: threshold
        grounds:
          - calculations.order_line_catchweight_price
          - errors.ERR_WEIGHT_OUT_OF_TOLERANCE
        excluded_because:
          difficulty_instance: boundary_precision_check / catchweight_tolerance_upper_bound_inclusive
          rationale: "deviation_ratio exactly at weight_tolerance_pct (accepted) versus one gram beyond it (rejected) is the named §1.8 instance."
      - name: waterfall_allocation_fee_before_discount_excluded
        claim_type: waterfall_allocation
        grounds:
          - calculations.order_charge_waterfall
        excluded_because:
          difficulty_instance: combinatorial_formula / order_charge_evaluation_order_fee_then_tiered_discount
          rationale: "The pinned STEP 1 -> 2 -> 3 -> 4 evaluation order, and why discounting before the fee gives a different total, is the named §1.8 instance."
      - name: aggregation_transport_cost_round_per_stop_then_sum_excluded
        claim_type: aggregation
        grounds:
          - calculations.wave_transport_cost
        excluded_because:
          difficulty_instance: combinatorial_formula / wave_transport_cost_round_per_stop_then_sum
          rationale: "Round-per-stop-then-sum versus sum-then-round on half-cent stop distances is the named §1.8 instance; this file only re-asserts the resulting total as a literal."

  - section: validations
    # Coverage notes for this section:
    #   * The state-vs-safety pair (priority 11 ERR_INVALID_STATE beating priority 14
    #     ERR_TEMPERATURE_ZONE_MISMATCH on assign-tote) is owned by the depth probe
    #     (priority_pair_validation_conflict / state_beats_safety_on_assign_tote), and the
    #     referential-vs-fiscal pair on POST /slot-bookings is stubbed below.
    #   * The dock-bay aggregate overlap (priority 23) is owned by
    #     resource_temporal_overlap / dock_bay_aggregate_concurrency_overlap; the aggregate row
    #     below therefore uses the other aggregate rule, priority 31's wave-wide stock sum.
    instances:
      - name: proposal_creation_guards_rank_the_supersede_target_above_already_open
        claim_type: priority_conflict
        grounds:
          - validations[priority=20].ERR_SUBSTITUTE_NOT_COMPARABLE
          - validations[priority=21].ERR_SUPERSEDE_TARGET_INVALID
          - validations[priority=30].ERR_PROPOSAL_ALREADY_OPEN
          - entities.SubstitutionProposal.supersedes_proposal_id
          - entities.SubstitutionProposal.round_no
        distinguishing_aspect: "One request violates priority 21 (supersedes a DRAFT proposal) and priority 30 (that line already has an open proposal) at once, and the earlier rule wins: the response is ERR_SUPERSEDE_TARGET_INVALID (422), not ERR_PROPOSAL_ALREADY_OPEN (409). The same endpoint then shows each guard alone -- a CHILLED substitute for an AMBIENT line yields ERR_SUBSTITUTE_NOT_COMPARABLE, a bare create on the still-open line yields ERR_PROPOSAL_ALREADY_OPEN -- and finally a create that supersedes the DECLINED round 1 succeeds with round_no 2."
        test_recipe:
          setup:
            - "Route R1, AMBIENT zone A1 with SKUs AMB-1 (700), AMB-2 (750) and AMB-3 (760) all in substitution group DRY with 100 units each, CHILLED zone C1 with SKU CHL-1 (900, group DRY), AMBIENT station S1 (max 3 totes)."
            - "One BASIC customer's order carries line L1 (2 x AMB-1, provisional 1400) and line L2 (2 x AMB-2, provisional 1500); the order is booked, confirmed, waved and picking."
            - "Both pick tasks complete with picked_units 0, so L1 and L2 both go SHORT and each receives an auto-created DRAFT proposal (P1 offers AMB-2 on L1, P2 offers AMB-3 on L2)."
            - "P1 is then proposed and DECLINED by the customer, which leaves L1.substitution_resolution == PENDING with no open proposal, while L2 still has DRAFT P2 open."
          setup_api_calls:
            - call: "POST /delivery-routes"
              payload: { route_code: "R1", service_area_name: "North", van_capacity_totes: 40, base_delivery_fee_cents: 599, per_km_cost_cents: 150 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { route_id: $.data.id }
            - call: "POST /grid-zones"
              payload: { zone_code: "A1", temperature_zone: "AMBIENT", bot_count: 4 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { zone_amb: $.data.id }
            - call: "POST /grid-zones"
              payload: { zone_code: "C1", temperature_zone: "CHILLED", bot_count: 4 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { zone_chl: $.data.id }
            - call: "POST /pick-stations"
              payload: { station_code: "S1", temperature_zone_capability: ["AMBIENT"], max_concurrent_totes: 3 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
