scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_pricing_estimate_vs_final_divergence
        grounds:
          - calculations.estimate_pricing
          - calculations.final_pricing
          - state_machines.Order.QUOTED_to_PROOF_PENDING
          - state_machines.Order.PROOF_PENDING_to_PROOF_APPROVED
          - entities.Order.fields.estimate_total_cents
          - entities.Order.fields.final_total_cents
        distinguishing_aspect: |
          This dual-variant lives on the ORDER pricing domain: estimate_total_cents (provisional, recomputed
          on line edits) vs final_total_cents (locked at PROOF_APPROVED). Editing lines during a
          CHANGES_REQUESTED loop makes final_total_cents (49500) differ from the QUOTED estimate (23000).
        test_recipe:
          setup:
            - "ACTIVE non-peak ProductionDay, base_price 10000 product (tier_levels 1), options SPRINKLES(+1500) and GOLD_LEAF(+5000)"
            - "Order QUOTED with one line units=2 [SPRINKLES] -> estimate_total_cents=23000, deposit_due_cents=6900"
            - "deposit captured, proof posted, customer requested changes, line edited to units=3 [SPRINKLES, GOLD_LEAF], new proof posted"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-06-01T00:00:00Z" }
              as: BakeryManager
            - call: "POST /options"
              payload: { option_code: "SPRINKLES", surcharge_cents: 1500, introduces_allergen_codes: [], dietary_exclusion_codes: [] }
              as: BakeryManager
            - call: "POST /options"
              payload: { option_code: "GOLD_LEAF", surcharge_cents: 5000, introduces_allergen_codes: [], dietary_exclusion_codes: [] }
              as: BakeryManager
            - call: "POST /products"
              payload: { name: "Vanilla Round", base_price_cents: 10000, base_lead_days: 3, tier_levels: 1, allowed_option_codes: ["SPRINKLES","GOLD_LEAF"], declared_allergen_codes: ["EGG","DAIRY","GLUTEN"] }
              as: BakeryManager
              captures: { prod_id: $.data.id }
            - call: "POST /production-days"
              payload: { production_date: "2026-06-20", unit_capacity: 50, is_peak: false, order_cutoff_at: "2026-06-15T00:00:00Z" }
              as: BakeryManager
              captures: { pday_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "C One" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", production_day_id: "${pday_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { units: 2, selected_option_codes: ["SPRINKLES"], requested_dietary_codes: [] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /orders/${order_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ev1: $.data.estimate_total_cents }
            - call: "POST /orders/${order_id}/payments"
              payload: { kind: "DEPOSIT" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/proofs"
              payload: { image_ref: "proof-r1" }
              as: BakeryStaff
              captures: { proof1_id: $.data.id }
            - call: "POST /orders/${order_id}/proofs/${proof1_id}/request-changes"
              payload: { change_note: "add gold leaf" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "PATCH /orders/${order_id}/lines/${line_id}"
              payload: { units: 3, selected_option_codes: ["SPRINKLES","GOLD_LEAF"] }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/proofs"
              payload: { image_ref: "proof-r2" }
              as: BakeryStaff
              captures: { proof2_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/proofs/${proof2_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { final_total: $.data.final_total_cents, est_total: $.data.estimate_total_cents }
          assert:
            - "Order.${order_id}.estimate_total_cents == 23000"
            - "Order.${order_id}.final_total_cents == 49500"
            - "Order.${order_id}.final_total_cents != Order.${order_id}.estimate_total_cents"
            - "Order.${order_id}.balance_due_cents == 42600"

      - name: refund_credit_full_vs_deposit_forfeit
        grounds:
          - calculations.refund_settlement
          - state_machines.Order.PROOF_PENDING_to_CANCELLED
          - state_machines.Order.PROOF_APPROVED_to_CANCELLED
          - entities.Customer.fields.store_credit_cents
        distinguishing_aspect: |
          This dual-variant lives on the CUSTOMER refund domain (store_credit_cents), a different entity domain
          than order pricing: cancelling from PROOF_PENDING applies the full_refund variant, returning all
          captured tender (6900) to store_credit_cents (the deposit_forfeit variant on a PROOF_APPROVED cancel
          is covered separately by corner instance cancel_proof_approved_forfeits_deposit).
        test_recipe:
          setup:
            - "Order A deposit-paid (6900 captured), at PROOF_PENDING after a first proof, cancelled -> full_refund variant"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-06-01T00:00:00Z" }
              as: BakeryManager
            - call: "POST /products"
              payload: { name: "Plain Sheet", base_price_cents: 10000, base_lead_days: 3, tier_levels: 1, allowed_option_codes: [], declared_allergen_codes: ["EGG","DAIRY","GLUTEN"] }
              as: BakeryManager
              captures: { prod_id: $.data.id }
            - call: "POST /production-days"
              payload: { production_date: "2026-06-20", unit_capacity: 50, is_peak: false, order_cutoff_at: "2026-06-15T00:00:00Z" }
              as: BakeryManager
              captures: { pday_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c2@x.com", full_name: "C Two" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            # ---- order A: cancel from PROOF_PENDING ----
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", production_day_id: "${pday_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_a: $.data.id }
            - call: "POST /orders/${order_a}/lines"
              payload: { units: 2, selected_option_codes: [], requested_dietary_codes: [] }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_a}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_a}/payments"
              payload: { kind: "DEPOSIT" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_a}/proofs"
              payload: { image_ref: "a-proof" }
              as: BakeryStaff
          trigger:
            - call: "POST /orders/${order_a}/cancel"
              payload: { cancel_reason: "changed mind" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { cust_after: $.data.customer_id }
          assert:
            - "Customer.${cust_id}.store_credit_cents == 6900"
            - "Order.${order_a}.payment_status == REFUNDED"
            - "Order.${order_a}.production_status == CANCELLED"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: deposit_calc_three_input_nonlinear_selection
        grounds:
          - calculations.deposit_calc
          - entities.Order.fields.deposit_due_cents
          - entities.ProductionDay.fields.is_peak
          - entities.ProductCatalogItem.fields.tier_levels
        distinguishing_aspect: |
          Mode (a): deposit_calc is a non-linear formula over THREE inputs (estimate_total_cents, is_peak,
          tier_levels) with nested conditional branches and a min/max floor-and-cap; a complex tier_levels>=3
          product on a 30000 estimate yields a 60% deposit (18000), not the 30% standard ratio (9000).
        test_recipe:
          setup:
            - "Non-peak ProductionDay; complex product base_price 30000, tier_levels 3, no options; order with one unit"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-06-01T00:00:00Z" }
              as: BakeryManager
            - call: "POST /products"
              payload: { name: "Tiered Wedding", base_price_cents: 30000, base_lead_days: 5, tier_levels: 3, allowed_option_codes: [], declared_allergen_codes: ["EGG","DAIRY","GLUTEN"] }
              as: BakeryManager
              captures: { prod_id: $.data.id }
            - call: "POST /production-days"
              payload: { production_date: "2026-06-25", unit_capacity: 50, is_peak: false, order_cutoff_at: "2026-06-18T00:00:00Z" }
              as: BakeryManager
              captures: { pday_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c3@x.com", full_name: "C Three" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", production_day_id: "${pday_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { units: 1, selected_option_codes: [], requested_dietary_codes: [] }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { dep: $.data.deposit_due_cents }
          assert:
            - "Order.${order_id}.estimate_total_cents == 30000"
            - "Order.${order_id}.deposit_due_cents == 18000"
            - "Order.${order_id}.balance_due_cents == 12000"

      - name: peak_surcharge_circular_eval_order
        grounds:
          - calculations.estimate_pricing
          - entities.Order.fields.peak_surcharge_cents
          - entities.Order.fields.estimate_total_cents
          - state_machines.Order.DRAFT_to_QUOTED
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency pinned by evaluation order — peak_surcharge_cents is keyed on
          the lines_subtotal tier and estimate_total_cents is lines_subtotal + peak_surcharge; the scaffold pins
          subtotal-first then surcharge. Subtotal 23000 falls in the mid tier -> 10% = 2300 -> total 25300.
        test_recipe:
          setup:
            - "PEAK ProductionDay; base_price 10000 product; option SPRINKLES(+1500); order line units=2 [SPRINKLES] -> subtotal 23000"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-06-01T00:00:00Z" }
              as: BakeryManager
            - call: "POST /options"
              payload: { option_code: "SPRINKLES", surcharge_cents: 1500, introduces_allergen_codes: [], dietary_exclusion_codes: [] }
              as: BakeryManager
            - call: "POST /products"
              payload: { name: "Peak Round", base_price_cents: 10000, base_lead_days: 3, tier_levels: 1, allowed_option_codes: ["SPRINKLES"], declared_allergen_codes: ["EGG","DAIRY","GLUTEN"] }
              as: BakeryManager
              captures: { prod_id: $.data.id }
            - call: "POST /production-days"
              payload: { production_date: "2026-06-20", unit_capacity: 50, is_peak: true, order_cutoff_at: "2026-06-15T00:00:00Z" }
              as: BakeryManager
              captures: { pday_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c4@x.com", full_name: "C Four" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", production_day_id: "${pday_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { units: 2, selected_option_codes: ["SPRINKLES"], requested_dietary_codes: [] }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { peak: $.data.peak_surcharge_cents, total: $.data.estimate_total_cents }
          assert:
            - "Order.${order_id}.peak_surcharge_cents == 2300"
            - "Order.${order_id}.estimate_total_cents == 25300"
            - "Order.${order_id}.deposit_due_cents == 12650"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_proof_revision_cycle
        grounds:
          - state_machines.Order.PROOF_PENDING_to_CHANGES_REQUESTED
          - state_machines.Order.CHANGES_REQUESTED_to_PROOF_PENDING
          - entities.Order.fields.production_status
        distinguishing_aspect: |
          The Order production axis is cyclic: PROOF_PENDING -> CHANGES_REQUESTED -> PROOF_PENDING is a true
          revision loop; a second proof after a request-changes reopens review and increments DesignProof
          revision_number to 2 on the same order.
        test_recipe:
          setup:
            - "Order at PROOF_PENDING after first proof; customer requests changes; staff posts second proof"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-06-01T00:00:00Z" }
              as: BakeryManager
            - call: "POST /products"
              payload: { name: "Loop Cake", base_price_cents: 10000, base_lead_days: 3, tier_levels: 1, allowed_option_codes: [], declared_allergen_codes: ["EGG","DAIRY","GLUTEN"] }
              as: BakeryManager
              captures: { prod_id: $.data.id }
            - call: "POST /production-days"
              payload: { production_date: "2026-06-20", unit_capacity: 50, is_peak: false, order_cutoff_at: "2026-06-15T00:00:00Z" }
              as: BakeryManager
              captures: { pday_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c5@x.com", full_name: "C Five" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", production_day_id: "${pday_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { units: 1, selected_option_codes: [], requested_dietary_codes: [] }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/payments"
              payload: { kind: "DEPOSIT" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/proofs"
              payload: { image_ref: "r1" }
              as: BakeryStaff
              captures: { proof1_id: $.data.id }
            - call: "POST /orders/${order_id}/proofs/${proof1_id}/request-changes"
              payload: { change_note: "fix color" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/proofs"
              payload: { image_ref: "r2" }
              as: BakeryStaff
              captures: { proof2_rev: $.data.revision_number, proof2_status: $.data.proof_status }
          assert:
            - "DesignProof.proof2.revision_number == 2"
            - "DesignProof.proof2.proof_status == AWAITING_REVIEW"
            - "Order.${order_id}.production_status == PROOF_PENDING"

      - name: order_parallel_payment_and_production_axes
        grounds:
          - state_machines.Order.QUOTED_to_PROOF_PENDING
          - state_machines.Order.UNPAID_to_DEPOSIT_PAID
          - entities.Order.fields.production_status
          - entities.Order.fields.payment_status
        distinguishing_aspect: |
          The Order entity carries TWO independent state dimensions (production_status x payment_status): a
          DEPOSIT payment advances payment_status UNPAID->DEPOSIT_PAID while production_status remains QUOTED,
          and only then can a proof advance production_status; the axes evolve on the same row independently.
        test_recipe:
          setup:
            - "Order QUOTED and UNPAID; deposit captured -> DEPOSIT_PAID while production_status stays QUOTED until a proof is posted"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-06-01T00:00:00Z" }
              as: BakeryManager
            - call: "POST /products"
              payload: { name: "Parallel Cake", base_price_cents: 10000, base_lead_days: 3, tier_levels: 1, allowed_option_codes: [], declared_allergen_codes: ["EGG","DAIRY","GLUTEN"] }
              as: BakeryManager
              captures: { prod_id: $.data.id }
            - call: "POST /production-days"
              payload: { production_date: "2026-06-20", unit_capacity: 50, is_peak: false, order_cutoff_at: "2026-06-15T00:00:00Z" }
              as: BakeryManager
              captures: { pday_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c6@x.com", full_name: "C Six" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", production_day_id: "${pday_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { units: 1, selected_option_codes: [], requested_dietary_codes: [] }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/payments"
              payload: { kind: "DEPOSIT" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pay_status: $.data.kind }
          assert:
            - "Order.${order_id}.payment_status == DEPOSIT_PAID"
            - "Order.${order_id}.production_status == QUOTED"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_post_commit_releases_reservation_decrements_capacity
        grounds:
          - state_machines.Order.PROOF_APPROVED_to_CANCELLED
          - state_machines.SlotReservation.COMMITTED_to_RELEASED
          - entities.ProductionDay.fields.units_committed
          - entities.Customer.fields.store_credit_cents
        distinguishing_aspect: |
          Depth-3 cascade from a SINGLE trigger (order cancel): cancel mutates Order->CANCELLED, which mutates
          its COMMITTED SlotReservation->RELEASED, which in turn mutates ProductionDay.units_committed (decrement
          by order units). Each hop is caused by the prior hop, not directly by the cancel action.
        test_recipe:
          setup:
            - "Order at PROOF_APPROVED, fully paid, with a COMMITTED PICKUP reservation that pushed production_day.units_committed to 2"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-06-01T00:00:00Z" }
              as: BakeryManager
            - call: "POST /products"
              payload: { name: "Cascade Cake", base_price_cents: 10000, base_lead_days: 3, tier_levels: 1, allowed_option_codes: [], declared_allergen_codes: ["EGG","DAIRY","GLUTEN"] }
              as: BakeryManager
              captures: { prod_id: $.data.id }
            - call: "POST /production-days"
              payload: { production_date: "2026-06-20", unit_capacity: 50, is_peak: false, order_cutoff_at: "2026-06-15T00:00:00Z" }
              as: BakeryManager
              captures: { pday_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c7@x.com", full_name: "C Seven" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", production_day_id: "${pday_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { units: 2, selected_option_codes: [], requested_dietary_codes: [] }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ov1: $.data.version }
            - call: "POST /orders/${order_id}/payments"
              payload: { kind: "DEPOSIT" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/proofs"
              payload: { image_ref: "p1" }
              as: BakeryStaff
              captures: { proof_id: $.data.id }
            - call: "POST /orders/${order_id}/proofs/${proof_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bv_order_id_1: $.data.version }
            - call: "POST /orders/${order_id}/balance-payment"
              payload: { kind: "BALANCE", applied_credit_cents: 0, expected_order_version: "${bv_order_id_1}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/slot"
              payload: { fulfillment_mode: "PICKUP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ov_pre_commit: $.data.version }
            - call: "POST /orders/${order_id}/slot/${res_id}/commit"
              payload: { expected_order_version: "${ov_pre_commit}" }
              as: DeliveryDispatcher
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: { cancel_reason: "venue cancelled" }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Order.${order_id}.production_status == CANCELLED"
            - "SlotReservation.${res_id}.status == RELEASED"
            - "ProductionDay.${pday_id}.units_committed == 0"
            - "Customer.${cust_id}.store_credit_cents == 16100"

      - name: request_changes_rejects_proof_reopens_editing
        grounds:
          - state_machines.Order.PROOF_PENDING_to_CHANGES_REQUESTED
          - state_machines.DesignProof.AWAITING_REVIEW_to_REJECTED
          - entities.DesignProof.fields.proof_status
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (request-changes, not cancel): request-changes mutates the
          DesignProof AWAITING_REVIEW->REJECTED, and that proof rejection in turn drives Order
          PROOF_PENDING->CHANGES_REQUESTED. Different propagation pattern from the cancel cascade above.
        test_recipe:
          setup:
            - "Order at PROOF_PENDING with one AWAITING_REVIEW proof"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-06-01T00:00:00Z" }
              as: BakeryManager
            - call: "POST /products"
              payload: { name: "Reject Cake", base_price_cents: 10000, base_lead_days: 3, tier_levels: 1, allowed_option_codes: [], declared_allergen_codes: ["EGG","DAIRY","GLUTEN"] }
              as: BakeryManager
              captures: { prod_id: $.data.id }
