              payload: { household_id: "${hh_id}", package_id: "${pkg_id}", policy_id: "${pol_id}", loss_date: "2026-05-01T00:00:00Z", peril: "WATER", settlement_basis: "ACV", affected_room_ids: ["${room_id}"] }
              as: Homeowner
