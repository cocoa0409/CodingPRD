  # ===========================================================================
  - section: validations
    instances:
      - name: supply_chain_append_to_non_tail_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_SUPPLY_CHAIN_NOT_TAIL]"
        distinguishing_aspect: "Appending to a node that is no longer the tail (or to another package's node) fails with ERR_SUPPLY_CHAIN_NOT_TAIL; the chain stays unchanged."
        test_recipe:
          setup: ["Publisher P, package with a two-hop chain N0 -> N1 (N0.is_tail == false)"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /supply-chain-nodes", payload: { package_id: "${pkg_id}", seller_domain: "ssp1.com", fee_bps: 1000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { n0: $.data.id } }
            - { call: "POST /supply-chain-nodes", payload: { package_id: "${pkg_id}", seller_domain: "ssp2.com", fee_bps: 500, parent_node_id: "${n0}" }, as: PublisherManager, as_user_id: "${pub_id}" }
          trigger:
            - { call: "POST /supply-chain-nodes", payload: { package_id: "${pkg_id}", seller_domain: "ssp3.com", fee_bps: 100, parent_node_id: "${n0}" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SUPPLY_CHAIN_NOT_TAIL (409) — N0 already has a child"
            - "Chain still has exactly 2 nodes (GET /supply-chain-nodes?package_id=... total_count == 2)"

      - name: existence_check_beats_blocklist_scope_safety
        claim_type: priority_ordering
        grounds:
          - "validations[priority=5]"
          - "validations[priority=8]"
          - "errors[ERR_NOT_FOUND]"
          - "errors[ERR_BLOCKLIST_SCOPE_MISMATCH]"
        distinguishing_aspect: "A DEAL-scope entry whose deal_id does not exist AND which also carries a forbidden publisher_id fails with ERR_NOT_FOUND (existence, priority 5) before ERR_BLOCKLIST_SCOPE_MISMATCH (safety, priority 8)."
        test_recipe:
          setup: ["Nothing needed beyond an authenticated caller"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
          trigger:
            - { call: "POST /blocklist-entries", payload: { scope: "DEAL", rule_type: "ADVERTISER_DOMAIN", value: "evil.com", deal_id: "00000000-0000-0000-0000-000000000000", publisher_id: "${pub_id}" }, as: ExchangeAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (404) — existence of deal_id is validated before scope-field consistency"

      - name: recon_makegood_without_adjustment_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=18]"
          - "errors[ERR_RECONCILIATION_INPUT_MISMATCH]"
        distinguishing_aspect: "MAKE_GOOD without adjustment_micros (or a non-positive one) fails with ERR_RECONCILIATION_INPUT_MISMATCH; ACCEPT_SSP carrying adjustment_micros fails the same way — the input contract is bidirectional."
        test_recipe:
          setup: ["Deal D with one confirmed 500-imp auction; report R1 OPEN and report R2 OPEN (two reports over adjacent windows)"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id } }
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_id}/approve", payload: {}, as: ExchangeAdmin }
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_id}", bids: [ { bid_cpm_micros: 1000000, impression_count: 500, creative_domain: "a.com" } ] }, as: DemandSide, captures: { rec_id: $.data.auction_record.id } }
            - { call: "POST /auction-records/${rec_id}/confirm-billing", payload: {}, as: DemandSide }
            - { call: "POST /reconciliation-reports", payload: { deal_id: "${deal_id}", period_start: "2026-08-01", period_end: "2026-08-02" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { rep1: $.data.id } }
            - { call: "POST /reconciliation-reports", payload: { deal_id: "${deal_id}", period_start: "2026-08-02", period_end: "2026-08-03" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { rep2: $.data.id } }
          trigger:
            - { call: "POST /reconciliation-reports/${rep1}/resolve", payload: { resolution_type: "MAKE_GOOD" }, as: ExchangeAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /reconciliation-reports/${rep2}/resolve", payload: { resolution_type: "ACCEPT_SSP", adjustment_micros: 5000 }, as: ExchangeAdmin, captures: { err2: $.data.error_id } }
          assert:
            - "MAKE_GOOD without adjustment_micros -> ERR_RECONCILIATION_INPUT_MISMATCH (422); report stays OPEN"
            - "ACCEPT_SSP with adjustment_micros -> ERR_RECONCILIATION_INPUT_MISMATCH (422); report stays OPEN"

      - name: pg_commitment_not_lowerable_below_delivered
        claim_type: violation_to_error
        grounds:
          - "validations[priority=14]"
          - "entities.Deal.fields.delivered_impressions"
        distinguishing_aspect: "On a RENEGOTIATING PG deal that already delivered 1000 impressions, lowering committed_impressions to 500 fails with ERR_PG_COMMITMENT_MISMATCH even though the edit gate itself passes."
        test_recipe:
          setup: ["PG deal committed 1000, APPROVED, one auction delivered 1000 imps; deal moved to RENEGOTIATING"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PROGRAMMATIC_GUARANTEED", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z", committed_impressions: 1000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id } }
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_id}/approve", payload: {}, as: ExchangeAdmin }
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_id}", bids: [ { bid_cpm_micros: 1000000, impression_count: 1000, creative_domain: "a.com" } ] }, as: DemandSide }
            - { call: "POST /deals/${deal_id}/renegotiate", payload: {}, as: PublisherManager, as_user_id: "${pub_id}", captures: { v_reneg: $.data.version } }
          trigger:
            - { call: "PUT /deals/${deal_id}", payload: { expected_deal_version: "${v_reneg}", committed_impressions: 500 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PG_COMMITMENT_MISMATCH (422): committed 500 < delivered 1000"
            - "Deal remains RENEGOTIATING with committed_impressions == 1000"

      - name: seasonal_overlap_checked_per_package_only
        claim_type: satisfaction_pass
        grounds:
          - "validations[priority=10]"
        distinguishing_aspect: "Identical dates on DIFFERENT packages (even of different publishers) do not conflict — the overlap resource is the package, not the exchange."
        test_recipe:
          setup: ["Publishers P1 and P2 each with a package; window W1 on P1's package for [2026-11-20, 2026-11-30]"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "P1", domain: "p1.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub1: $.data.id } }
            - { call: "POST /publishers", payload: { name: "P2", domain: "p2.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub2: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg1", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 1000000 }, as: PublisherManager, as_user_id: "${pub1}", captures: { pkg1: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg2", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 1000000 }, as: PublisherManager, as_user_id: "${pub2}", captures: { pkg2: $.data.id } }
            - { call: "POST /seasonal-windows", payload: { package_id: "${pkg1}", name: "W1", start_date: "2026-11-20", end_date: "2026-11-30", multiplier_bps: 15000 }, as: PublisherManager, as_user_id: "${pub1}" }
          trigger:
            - { call: "POST /seasonal-windows", payload: { package_id: "${pkg2}", name: "W2", start_date: "2026-11-20", end_date: "2026-11-30", multiplier_bps: 15000 }, as: PublisherManager, as_user_id: "${pub2}", captures: { w2_id: $.data.id } }
          assert:
            - "W2 creation succeeds (201) — identical closed interval on a different package is not an overlap"

      - name: duplicate_seat_id_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_DUPLICATE_SEAT]"
          - "entities.DemandPartner.fields.seat_id"
        distinguishing_aspect: "seat_id is globally unique: a second partner with the same seat_id fails with ERR_DUPLICATE_SEAT."
        test_recipe:
          setup: ["One demand partner with seat_id seat-dup"]
          setup_api_calls:
            - { call: "POST /demand-partners", payload: { name: "DP1", seat_id: "seat-dup", max_qps: 10, daily_cap_micros: 1000000 }, as: ExchangeAdmin }
          trigger:
            - { call: "POST /demand-partners", payload: { name: "DP2", seat_id: "seat-dup", max_qps: 10, daily_cap_micros: 1000000 }, as: ExchangeAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_SEAT (409)"

      - name: double_confirm_and_double_void_rejected
        claim_type: idempotency
        grounds:
          - "errors[ERR_ALREADY_CONFIRMED]"
          - "errors[ERR_ALREADY_VOIDED]"
        distinguishing_aspect: "Both record mutations are one-shot: the second confirm fails ERR_ALREADY_CONFIRMED and the second void fails ERR_ALREADY_VOIDED; monetary fields are untouched by the rejected retries."
        test_recipe:
          setup: ["Two filled auctions R1 and R2 on one approved deal (gross 1,000,000 each)"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id } }
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_id}/approve", payload: {}, as: ExchangeAdmin }
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_id}", bids: [ { bid_cpm_micros: 1000000, impression_count: 1000, creative_domain: "a.com" } ] }, as: DemandSide, captures: { rec1: $.data.auction_record.id } }
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_id}", bids: [ { bid_cpm_micros: 1000000, impression_count: 1000, creative_domain: "a.com" } ] }, as: DemandSide, captures: { rec2: $.data.auction_record.id } }
          trigger:
            - { call: "POST /auction-records/${rec1}/confirm-billing", payload: {}, as: DemandSide }
            - { call: "POST /auction-records/${rec1}/confirm-billing", payload: {}, as: DemandSide, captures: { err1: $.data.error_id } }
            - { call: "POST /auction-records/${rec2}/void", payload: {}, as: ExchangeAdmin }
            - { call: "POST /auction-records/${rec2}/void", payload: {}, as: ExchangeAdmin, captures: { err2: $.data.error_id } }
          assert:
            - "Second confirm -> ERR_ALREADY_CONFIRMED (409)"
            - "Second void -> ERR_ALREADY_VOIDED (409); partner lifetime_spend_micros == 1000000 (exactly one void applied to R2, R1 intact)"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: publisher_list_pagination_limit_offset
        claim_type: listing
        grounds:
          - "response_envelope"
          - "endpoints.GET /publishers"
        distinguishing_aspect: "limit=2 pages a 3-row result into 2+1 with total_count == 3 and has_more flipping from true to false; offset beyond the count returns an empty page with has_more false."
        test_recipe:
          setup: ["Three publishers created in order"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "P1", domain: "p1.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin }
            - { call: "POST /publishers", payload: { name: "P2", domain: "p2.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin }
            - { call: "POST /publishers", payload: { name: "P3", domain: "p3.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin }
          trigger:
            - { call: "GET /publishers?limit=2&offset=0", payload: {}, as: ExchangeAdmin }
            - { call: "GET /publishers?limit=2&offset=2", payload: {}, as: ExchangeAdmin }
          assert:
            - "Page 1: 2 items, total_count == 3, has_more == true"
            - "Page 2 (offset 2): 1 item, total_count == 3, has_more == false"

      - name: auction_records_filtered_by_foreign_keys
        claim_type: retrieval
        grounds:
          - "endpoints.GET /auction-records"
          - "entities.AuctionRecord.fields.deal_id"
        distinguishing_aspect: "The filtered list honors deal_id / publisher_id / demand_partner_id / voided combinations: after voiding one of two records, voided=true returns exactly the voided one and deal_id returns both regardless of void flag."
        test_recipe:
          setup: ["One approved deal with two filled auctions; the second is voided"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id } }
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_id}/approve", payload: {}, as: ExchangeAdmin }
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_id}", bids: [ { bid_cpm_micros: 1000000, impression_count: 1000, creative_domain: "a.com" } ] }, as: DemandSide }
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_id}", bids: [ { bid_cpm_micros: 1000000, impression_count: 1000, creative_domain: "a.com" } ] }, as: DemandSide, captures: { rec2: $.data.auction_record.id } }
            - { call: "POST /auction-records/${rec2}/void", payload: {}, as: ExchangeAdmin }
          trigger:
            - { call: "GET /auction-records?deal_id=${deal_id}", payload: {}, as: ExchangeAdmin }
            - { call: "GET /auction-records?deal_id=${deal_id}&voided=true", payload: {}, as: ExchangeAdmin }
            - { call: "GET /deals/${deal_id}/records", payload: {}, as: ExchangeAdmin }
          assert:
            - "deal_id filter: total_count == 2 (voided records remain queryable)"
            - "deal_id + voided=true: total_count == 1 and the single row's id == the voided record"
            - "Sub-resource GET /deals/{id}/records returns the same 2 rows (reverse reachability)"

      - name: seasonal_window_get_by_id
        claim_type: retrieval
        grounds:
          - "endpoints.GET /seasonal-windows/{windowId}"
        distinguishing_aspect: "A stored window round-trips exactly: all input fields plus computed is_currently_applied for the default clock (false for a November window)."
        test_recipe:
          setup: ["Publisher P with package; window W created for [2026-11-20, 2026-11-30] x15000"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 1000000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /seasonal-windows", payload: { package_id: "${pkg_id}", name: "W", start_date: "2026-11-20", end_date: "2026-11-30", multiplier_bps: 15000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { w_id: $.data.id } }
          trigger:
            - { call: "GET /seasonal-windows/${w_id}", payload: {}, as: ExchangeAdmin, captures: { applied: $.data.is_currently_applied, mult: $.data.multiplier_bps } }
          assert:
            - "multiplier_bps == 15000 and is_currently_applied == false at the default clock 2026-08-01T00:00:00Z"

  # ===========================================================================
  - section: errors
    instances:
      - name: unknown_ids_return_not_found
        claim_type: violation_to_error
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Every GET with a well-formed but absent UUID returns ERR_NOT_FOUND (404): publisher, package, deal, report, batch all share the single code."
        test_recipe:
          setup: ["Nothing beyond an authenticated caller"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Seed", domain: "seed.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin }
          trigger:
            - { call: "GET /publishers/00000000-0000-0000-0000-000000000000", payload: {}, as: ExchangeAdmin, captures: { err1: $.data.error_id } }
            - { call: "GET /reconciliation-reports/00000000-0000-0000-0000-000000000000", payload: {}, as: FinanceOfficer, captures: { err2: $.data.error_id } }
          assert:
            - "GET publisher with unknown id -> ERR_NOT_FOUND (404)"
            - "GET reconciliation report with unknown id -> ERR_NOT_FOUND (404)"

      - name: missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers fails with ERR_UNAUTHENTICATED (401) before any role or existence check."
        test_recipe:
          setup: ["Nothing beyond the default empty DB"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Seed", domain: "seed.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin }
          trigger:
            - call: "GET /publishers"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "Request sent WITHOUT X-User-ID and X-User-Role headers -> ERR_UNAUTHENTICATED (401)"

      - name: seasonal_overlap_error_excluded_from_corner
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SEASONAL_WINDOW_OVERLAP]"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / seasonal_window_closed_interval_overlap
          rationale: "The 409 trigger on a shared inclusive end-date is asserted by the named §1.8 instance."

      - name: payout_period_overlap_error_excluded_from_corner
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_PAYOUT_PERIOD_OVERLAP]"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / payout_period_half_open_overlap
          rationale: "The 409 trigger on a half-open overlap is asserted by the named §1.8 instance."

      - name: deal_not_editable_error_excluded_from_corner
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_DEAL_NOT_EDITABLE]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / deal_edit_state_gate_beats_time_range
          rationale: "Asserted as the winning error of the state-vs-temporal priority conflict in the named §1.8 instance."

  # ===========================================================================
  - section: rbac
    instances:
      - name: publisher_manager_cannot_touch_other_publishers_package
        claim_type: role_denied
        grounds:
          - "roles.PublisherManager"
          - "validations[priority=6]"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "Entity-backed ownership: a PublisherManager whose X-User-ID is publisher B cannot pause publisher A's package — 403 ERR_UNAUTHORIZED even though the role may pause packages in general."
        test_recipe:
          setup: ["Publishers A and B; package PKG_A owned by A"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "A", domain: "a.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_a: $.data.id } }
            - { call: "POST /publishers", payload: { name: "B", domain: "b.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_b: $.data.id } }
            - { call: "POST /packages", payload: { name: "PkgA", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_a}", captures: { pkg_a: $.data.id } }
          trigger:
            - { call: "POST /packages/${pkg_a}/pause", payload: {}, as: PublisherManager, as_user_id: "${pub_b}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED (403); PKG_A remains ACTIVE"

      - name: finance_officer_cannot_approve_batch_role_denied
        claim_type: role_denied
        grounds:
          - "roles.FinanceOfficer"
          - "roles.ExchangeAdmin"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "approve is ExchangeAdmin-exclusive: a FinanceOfficer caller is rejected with ERR_UNAUTHORIZED before any batch-state or segregation-of-duties check (priority 2 beats 6 and 15)."
        test_recipe:
          setup: ["Batch B submitted by fin-1 (status PENDING_APPROVAL)"]
          setup_api_calls:
            - { call: "POST /payout-batches", payload: { period_start: "2026-08-01", period_end: "2026-09-01" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { batch_id: $.data.id } }
            - { call: "POST /payout-batches/${batch_id}/submit", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
          trigger:
            - { call: "POST /payout-batches/${batch_id}/approve", payload: {}, as: FinanceOfficer, as_user_id: "fin-9", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED (403) — role denial, not ERR_SEGREGATION_OF_DUTIES"
            - "Batch remains PENDING_APPROVAL"

      - name: demand_side_cannot_void_auction_record
        claim_type: role_denied
        grounds:
          - "roles.DemandSide"
          - "roles.ExchangeAdmin"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "void is ExchangeAdmin-exclusive; DemandSide (the auction caller) cannot self-correct records — 403."
        test_recipe:
          setup: ["One filled auction record on an approved deal"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id } }
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_id}/approve", payload: {}, as: ExchangeAdmin }
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_id}", bids: [ { bid_cpm_micros: 1000000, impression_count: 1000, creative_domain: "a.com" } ] }, as: DemandSide, captures: { rec_id: $.data.auction_record.id } }
          trigger:
            - { call: "POST /auction-records/${rec_id}/void", payload: {}, as: DemandSide, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED (403); record remains voided == false"

      - name: batch_creator_cannot_approve_own_batch
        claim_type: role_denied
        grounds:
          - "validations[priority=15]"
          - "entities.PayoutBatch.fields.created_by_user_id"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
        distinguishing_aspect: "Segregation of duties on the happy path: the creating FinanceOfficer's id as approver fails with ERR_SEGREGATION_OF_DUTIES while a different operator approves successfully."
        test_recipe:
          setup: ["Batch B created and submitted by FinanceOfficer fin-1 (PENDING_APPROVAL)"]
          setup_api_calls:
            - { call: "POST /payout-batches", payload: { period_start: "2026-08-01", period_end: "2026-09-01" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { batch_id: $.data.id } }
            - { call: "POST /payout-batches/${batch_id}/submit", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
          trigger:
            - { call: "POST /payout-batches/${batch_id}/approve", payload: {}, as: ExchangeAdmin, as_user_id: "fin-1", captures: { err: $.data.error_id } }
            - { call: "POST /payout-batches/${batch_id}/approve", payload: {}, as: ExchangeAdmin, as_user_id: "admin-2", captures: { st: $.data.status } }
          assert:
            - "Approver fin-1 (== created_by_user_id) -> ERR_SEGREGATION_OF_DUTIES (403)"
            - "Approver admin-2 -> status == APPROVED"

      - name: publisher_manager_cannot_create_exchange_scope_blocklist
        claim_type: role_denied
        grounds:
          - "roles.PublisherManager"
          - "roles.ExchangeAdmin"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "Scope-aware authorization: PublisherManager may create PUBLISHER/DEAL-scope entries on its own resources, but EXCHANGE scope is ExchangeAdmin-only — 403."
        test_recipe:
          setup: ["Publisher P with manager account"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
          trigger:
            - { call: "POST /blocklist-entries", payload: { scope: "EXCHANGE", rule_type: "ADVERTISER_DOMAIN", value: "evil.com" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED (403)"

  # ===========================================================================
  - section: cross_cutting
    instances:
      - name: occ_stale_version_on_deal_put
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[deal-commercial-edit-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "A second sequential PUT carrying the pre-first-write version fails 412: create (v1) -> PUT with expected v1 succeeds (v2) -> PUT with expected v1 again fails ERR_STALE_VERSION; the deal keeps the first write's floor."
        test_recipe:
          setup: ["DRAFT deal D on publisher P's package (version 1)"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "PUT /deals/${deal_id}", payload: { expected_deal_version: "${v1}", floor_cpm_micros: 700000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { v2: $.data.version, floor_after: $.data.floor_cpm_micros } }
            - { call: "PUT /deals/${deal_id}", payload: { expected_deal_version: "${v1}", floor_cpm_micros: 900000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { err: $.data.error_id } }
          assert:
            - "First PUT succeeds: version == 2 and floor_cpm_micros == 700000"
            - "Second PUT with the stale version -> ERR_STALE_VERSION (412); floor stays 700000"

      - name: occ_stale_version_on_package_put
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[package-floor-edit-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Same OCC shape on a different parent: PUT /packages/{id} with a version advanced by an intervening PUT fails 412 and does not recompute the floor."
        test_recipe:
          setup: ["Package PKG (base floor 1,000,000, version 1)"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 1000000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "PUT /packages/${pkg_id}", payload: { expected_package_version: "${v1}", base_floor_cpm_micros: 1500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { v2: $.data.version, eff: $.data.effective_floor_cpm_micros } }
            - { call: "PUT /packages/${pkg_id}", payload: { expected_package_version: "${v1}", base_floor_cpm_micros: 3000000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { err: $.data.error_id } }
          assert:
            - "First PUT: version == 2 and effective_floor_cpm_micros == 1500000 (recomputed from the new base)"
            - "Second PUT with stale version -> ERR_STALE_VERSION (412); effective floor stays 1500000"

      - name: occ_stale_version_on_demand_partner_put
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[demand-partner-config-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Capacity retune races resolve by OCC: the writer holding the pre-retune version gets 412 and the newer max_qps survives."
        test_recipe:
          setup: ["Demand partner DP (max_qps 10, version 1)"]
          setup_api_calls:
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 10, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "PUT /demand-partners/${dp_id}", payload: { expected_demand_partner_version: "${v1}", max_qps: 50 }, as: ExchangeAdmin, captures: { v2: $.data.version, qps: $.data.max_qps } }
            - { call: "PUT /demand-partners/${dp_id}", payload: { expected_demand_partner_version: "${v1}", max_qps: 99 }, as: ExchangeAdmin, captures: { err: $.data.error_id } }
          assert:
            - "First PUT: version == 2 and max_qps == 50"
            - "Second PUT with stale version -> ERR_STALE_VERSION (412); max_qps stays 50"

      - name: clock_rollover_resets_qps_and_auto_reactivates
        claim_type: rate_threshold_triggers
        grounds:
          - "calculations.auction_throttle"
          - "state_machines.DemandPartner.THROTTLED_to_ACTIVE"
          - "endpoints.POST /_clock/set_current_utc"
        distinguishing_aspect: "The QPS throttle is per-second: moving the logical clock one second forward resets the counter and auto-reactivates the partner (spend < cap), and the very next auction fills — then re-throttles the over-limit candidate again."
        test_recipe:
          setup: ["Partner DP max_qps 1 daily_cap 100,000,000; two approved deals D_HI (floor 2,000,000) and D_LO (floor 1,000,000) on one package; one auction has already filled D_HI and throttled the partner"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 1, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 2000000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { d_hi: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 1000000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { d_lo: $.data.id } }
            - { call: "POST /deals/${d_hi}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${d_hi}/approve", payload: {}, as: ExchangeAdmin }
            - { call: "POST /deals/${d_lo}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${d_lo}/approve", payload: {}, as: ExchangeAdmin }
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_id}", bids: [ { bid_cpm_micros: 3000000, impression_count: 1000, creative_domain: "a.com" } ] }, as: DemandSide }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:01Z" }, as: ExchangeAdmin }
            - { call: "GET /demand-partners/${dp_id}", payload: {}, as: ExchangeAdmin, captures: { st_after_clock: $.data.status, qps_after_clock: $.data.current_second_auction_count } }
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_id}", bids: [ { bid_cpm_micros: 3000000, impression_count: 1000, creative_domain: "a.com" } ] }, as: DemandSide, captures: { outcome_2: $.data.outcome, throttled_2: $.data.throttled_deal_count } }
            - { call: "GET /demand-partners/${dp_id}", payload: {}, as: ExchangeAdmin, captures: { st_final: $.data.status } }
          assert:
            - "After the one-second clock move: status == ACTIVE and current_second_auction_count == 0 (auto-reactivation: later second and spend 3,000,000 < cap)"
            - "Next auction: outcome == FILL on D_HI with throttled_deal_count == 1 (D_LO throttled again in the new second)"
            - "Partner ends THROTTLED again — throttle is re-evaluated per second, not sticky"

      - name: void_rejected_after_batch_settlement
        claim_type: derived_field_reconciliation
        grounds:
          - "validations[priority=16]"
          - "errors[ERR_VOID_AFTER_SETTLEMENT]"
        distinguishing_aspect: "Once a batch covering the record's creation date is SETTLED the money has flowed: voiding the record fails ERR_VOID_AFTER_SETTLEMENT and the paid amounts stay exactly as settled."
        test_recipe:
          setup: ["GUARANTEED publisher with one record (net 850,000) created 2026-08-01; batch [2026-08-01, 2026-09-01) submitted, approved by admin-2, released -> SETTLED (line PAID 850,000)"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id } }
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_id}/approve", payload: {}, as: ExchangeAdmin }
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_id}", bids: [ { bid_cpm_micros: 1000000, impression_count: 1000, creative_domain: "a.com" } ] }, as: DemandSide, captures: { rec_id: $.data.auction_record.id } }
            - { call: "POST /payout-batches", payload: { period_start: "2026-08-01", period_end: "2026-09-01" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { batch_id: $.data.id } }
            - { call: "POST /payout-batches/${batch_id}/submit", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /payout-batches/${batch_id}/approve", payload: {}, as: ExchangeAdmin, as_user_id: "admin-2" }
            - { call: "POST /payout-batches/${batch_id}/release", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
          trigger:
            - { call: "POST /auction-records/${rec_id}/void", payload: {}, as: ExchangeAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /publishers/${pub_id}", payload: {}, as: ExchangeAdmin, captures: { paid: $.data.paid_out_micros } }
          assert:
            - "error_id == ERR_VOID_AFTER_SETTLEMENT (409); record stays voided == false"
            - "Publisher paid_out_micros == 850000 (settlement is final)"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_visibility
        claim_type: immediate_consistency
        grounds:
          - "complexity_profile.consistency_model"
          - "endpoints.GET /deals/{dealId}"
        distinguishing_aspect: "Immediate consistency: a deal read in the very next request reflects the creation values and version 1 with no staleness window; a follow-up PUT's effects are likewise visible on the immediate re-read."
        test_recipe:
          setup: ["Publisher P, package, DRAFT deal D (floor 500,000)"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "GET /deals/${deal_id}", payload: {}, as: ExchangeAdmin, captures: { st: $.data.status, fl: $.data.floor_cpm_micros, v: $.data.version } }
            - { call: "PUT /deals/${deal_id}", payload: { expected_deal_version: "${v1}", floor_cpm_micros: 800000 }, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "GET /deals/${deal_id}", payload: {}, as: ExchangeAdmin, captures: { fl2: $.data.floor_cpm_micros, v2: $.data.version } }
          assert:
            - "Immediate read: status == DRAFT, floor_cpm_micros == 500000, version == 1"
            - "After PUT: immediate re-read shows floor_cpm_micros == 800000 and version == 2"
