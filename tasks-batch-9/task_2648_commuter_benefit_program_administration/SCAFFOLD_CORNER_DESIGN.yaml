              payload: { election_id: "${el_id}", amount_cents: 3000, merchant_category_code: 4111, merchant_name: "CTA Ventra Load", transaction_at: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { txn_id: $.data.id }
