    roles: [TreasuryOps]
    code: 200
    input: []
    output: PlaybookAction
    side_effects: ["READY -> EXECUTING; kind-specific booking (asset SOLD / drawn_cents += estimated_proceeds_cents); first execution moves playbook ACTIVATED -> EXECUTING"]

  - method: POST
    path: "/liquidity/playbook-actions/{id}/settle"
