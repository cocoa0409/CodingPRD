# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2942_structured_cabling_low_voltage_contracting
#
# Every instance grounds in elements already declared in SCAFFOLD.yaml §1.1-§1.7.
# All money is integer cents, all lengths metres to 2dp, all areas sq mm to 2dp.
# The logical clock starts at 2026-08-01T00:00:00Z and only moves via
# POST /_clock/set_current_utc.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: permanent_link_versus_channel_length_grading_on_one_link
        grounds:
          - calculations.link_length_evaluation
          - calculations.link_test_outcome
          - entities.Link.fields.permanent_link_length_m
          - entities.Link.fields.channel_length_m
          - entities.TestResult.fields.test_standard
          - state_machines.Link.install_state.TESTED_PASS_to_TESTED_FAIL
        distinguishing_aspect: |
          The two variants live on the Link/TestResult measurement domain: the same physical
          run yields permanent_link_length_m 84.00 (inside the 90.00 m permanent-link limit,
          PASS) and channel_length_m 100.80 (outside the 100.00 m channel limit, FAIL
          LENGTH_LIMIT), because only the CHANNEL variant adds patch_cord_allowance_m times
          PATCH_CORD_DERATE_FACTOR. This is length/attenuation grading, not the cost
          estimate-versus-final divergence of mac_billing_estimate_versus_final_hours.
        test_recipe:
          setup:
            - "One project RVT1, plenum ceiling, TIA_606_CLASS_1 identifiers"
            - "One telecom room TR01 verified COMPLIANT at exactly 5000 milliohms, so room_state is GROUNDED"
            - "One CAT6A CMP cable type, outer diameter 7.9 mm, max_channel_length_m 100.0"
            - "One CABLE_TRAY pathway segment with 20000.0 sq mm usable area"
            - "One CEILING / PATHWAY_ROUGH_IN coordination in CONFIRMED"
            - "Link TR01-A01 with horizontal_length_m 84.00 and patch_cord_allowance_m 14.00, routed, pulled and terminated"
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1", warranty_program: "STANDARD_15Y", mac_budget_cents: 500000 }
              as: ProjectManager
              captures: { proj: $.data.id }
            - call: "POST /cabling/telecom-rooms"
              payload: { project_id: "${proj}", room_code: "TR01", floor: 3, branch_circuit_amps: 20, ups_capacity_va: 3000 }
              as: ProjectManager
              captures: { room: $.data.id }
            - call: "POST /cabling/telecom-rooms/${room}/grounding-verification"
              payload: { tgb_installed: true, bonding_conductor_awg: 6, ground_resistance_milliohms: 5000 }
              as: ProjectManager
            - call: "POST /cabling/cable-types"
              payload: { category: "CAT6A", jacket_rating: "CMP", outer_diameter_mm: 7.9, max_channel_length_m: 100.0, shielded: false, cost_per_meter_cents: 150, applications: ["DATA_HORIZONTAL", "WAP"] }
              as: DesignEngineer
              captures: { ct: $.data.id }
            - call: "POST /cabling/pathway-segments"
              payload: { project_id: "${proj}", segment_code: "PS-A", pathway_type: "CABLE_TRAY", usable_area_sq_mm: 20000.0, length_m: 40.0, bend_count: 0, in_plenum_space: true, shared_with_power: false, power_separation_mm: 0 }
              as: DesignEngineer
              captures: { seg_a: $.data.id, seg_a_v1: $.data.version }
            - call: "POST /cabling/trade-coordinations"
              payload: { project_id: "${proj}", trade: "CEILING", milestone: "PATHWAY_ROUGH_IN" }
              as: ProjectManager
              captures: { coord: $.data.id }
            - call: "POST /cabling/trade-coordinations/${coord}/confirm"
              payload: { confirmed_date: "2026-08-05" }
              as: ProjectManager
            - call: "POST /cabling/links"
              payload: { project_id: "${proj}", telecom_room_id: "${room}", cable_type_id: "${ct}", identifier: "TR01-A01", application: "DATA_HORIZONTAL", horizontal_length_m: 84.00, consolidation_point_stub_m: 0, patch_cord_allowance_m: 14.00 }
              as: DesignEngineer
              captures: { link: $.data.id, pl_len: $.data.permanent_link_length_m, ch_len: $.data.channel_length_m }
            - call: "POST /cabling/link-routes"
              payload: { link_id: "${link}", pathway_segment_id: "${seg_a}", sequence_index: 1, expected_segment_version: "${seg_a_v1}" }
              as: DesignEngineer
            - call: "POST /cabling/links/${link}/pull"
              payload: {}
              as: Installer
              as_user_id: "user-installer-01"
            - call: "POST /cabling/links/${link}/terminate"
              payload: {}
              as: Installer
              as_user_id: "user-installer-01"
          trigger:
            - call: "POST /cabling/test-results"
              payload: { link_id: "${link}", test_standard: "PERMANENT_LINK", tester_model: "DSX-8000", insertion_loss_db: 15.0, next_margin_db: 3.2, return_loss_margin_db: 2.1, length_measured_m: 84.00 }
              as: TestTechnician
              as_user_id: "user-tester-01"
              captures: { tr_pl: $.data.id }
            - call: "POST /cabling/test-results"
              payload: { link_id: "${link}", test_standard: "CHANNEL", tester_model: "DSX-8000", insertion_loss_db: 15.0, next_margin_db: 3.2, return_loss_margin_db: 2.1, length_measured_m: 100.80 }
              as: TestTechnician
              as_user_id: "user-tester-01"
              captures: { tr_ch: $.data.id }
          assert:
            - "the link create response has permanent_link_length_m == 84.00 and channel_length_m == 100.80"
            - "the PERMANENT_LINK result has outcome == \"PASS\", failure_reason == null and insertion_loss_budget_db == 16.36"
            - "the CHANNEL result has outcome == \"FAIL\", failure_reason == \"LENGTH_LIMIT\" and insertion_loss_budget_db == 19.55"
            - "GET /cabling/links/${link} returns install_state == \"TESTED_FAIL\", test_attempt_count == 2 and latest_test_outcome == \"FAIL\""
            - "GET /cabling/projects/${proj} returns failed_link_count == 1 and completeness_pct_provisional == 0.00"

      - name: mac_billing_estimate_versus_final_hours
        grounds:
          - calculations.mac_ticket_billing
          - calculations.mac_budget_ledger
          - entities.MacTicket.fields.estimated_billed_cents
          - entities.MacTicket.fields.final_billed_cents
          - state_machines.MacTicket.SCHEDULED_to_IN_PROGRESS
          - state_machines.MacTicket.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          The two variants live on the MacTicket money domain, not on Link lengths: ESTIMATE
          prices labor_hours_estimate 6.0 at 62928 cents (subtotal 57600 crosses
          VOLUME_TIER_1_CENTS so a 5% discount applies before the expedite fee) while FINAL
          prices actual_labor_hours 4.0 at 44160 cents (subtotal 38400 earns no discount),
          and the project ledger is corrected by the -18768 cent delta at completion.
        test_recipe:
          setup:
            - "Project RVT1 with mac_budget_cents 500000, one telecom room, one CAT6A CMP cable type"
            - "Its single link TR01-A01 is CERTIFIED, so completeness_pct_strict is 100.00"
            - "The CEILING coordination is RELEASED and the project is OCCUPIED"
            - "The logical clock is inside the ticket's scheduled window when work starts"
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1", warranty_program: "STANDARD_15Y", mac_budget_cents: 500000 }
              as: ProjectManager
              captures: { proj: $.data.id }
            - call: "POST /cabling/telecom-rooms"
              payload: { project_id: "${proj}", room_code: "TR01", floor: 3, branch_circuit_amps: 20, ups_capacity_va: 3000 }
              as: ProjectManager
              captures: { room: $.data.id }
            - call: "POST /cabling/telecom-rooms/${room}/grounding-verification"
              payload: { tgb_installed: true, bonding_conductor_awg: 6, ground_resistance_milliohms: 5000 }
              as: ProjectManager
            - call: "POST /cabling/cable-types"
              payload: { category: "CAT6A", jacket_rating: "CMP", outer_diameter_mm: 7.9, max_channel_length_m: 100.0, shielded: false, cost_per_meter_cents: 150, applications: ["DATA_HORIZONTAL", "WAP"] }
              as: DesignEngineer
              captures: { ct: $.data.id }
            - call: "POST /cabling/pathway-segments"
              payload: { project_id: "${proj}", segment_code: "PS-A", pathway_type: "CABLE_TRAY", usable_area_sq_mm: 20000.0, length_m: 40.0, bend_count: 0, in_plenum_space: true, shared_with_power: false, power_separation_mm: 0 }
              as: DesignEngineer
              captures: { seg_a: $.data.id, seg_a_v1: $.data.version }
            - call: "POST /cabling/trade-coordinations"
              payload: { project_id: "${proj}", trade: "CEILING", milestone: "PATHWAY_ROUGH_IN" }
              as: ProjectManager
              captures: { coord: $.data.id }
            - call: "POST /cabling/trade-coordinations/${coord}/confirm"
              payload: { confirmed_date: "2026-08-05" }
              as: ProjectManager
            - call: "POST /cabling/links"
              payload: { project_id: "${proj}", telecom_room_id: "${room}", cable_type_id: "${ct}", identifier: "TR01-A01", application: "DATA_HORIZONTAL", horizontal_length_m: 85.63, consolidation_point_stub_m: 0, patch_cord_allowance_m: 2.00 }
              as: DesignEngineer
              captures: { link: $.data.id }
            - call: "POST /cabling/link-routes"
              payload: { link_id: "${link}", pathway_segment_id: "${seg_a}", sequence_index: 1, expected_segment_version: "${seg_a_v1}" }
              as: DesignEngineer
            - call: "POST /cabling/links/${link}/pull"
              payload: {}
              as: Installer
              as_user_id: "user-installer-01"
            - call: "POST /cabling/links/${link}/terminate"
              payload: {}
              as: Installer
              as_user_id: "user-installer-01"
            - call: "POST /cabling/links/${link}/label"
              payload: { applied_identifier: "TR01-A01" }
              as: Installer
              as_user_id: "user-installer-01"
            - call: "POST /cabling/links/${link}/record"
              payload: { drawing_sheet_ref: "E-501" }
              as: DesignEngineer
            - call: "POST /cabling/test-results"
              payload: { link_id: "${link}", test_standard: "PERMANENT_LINK", tester_model: "DSX-8000", insertion_loss_db: 15.0, next_margin_db: 3.2, return_loss_margin_db: 2.1, length_measured_m: 85.63 }
              as: TestTechnician
              as_user_id: "user-tester-01"
            - call: "POST /cabling/links/${link}/certify"
              payload: {}
              as: Certifier
              as_user_id: "user-cert-01"
            - call: "POST /cabling/trade-coordinations/${coord}/release"
              payload: {}
              as: ProjectManager
            - call: "POST /cabling/projects/${proj}/occupancy"
              payload: { occupancy_status: "OCCUPIED" }
              as: ProjectManager
            - call: "POST /cabling/mac-tickets"
              payload: { project_id: "${proj}", link_id: "${link}", telecom_room_id: "${room}", ticket_type: "MOVE", requested_window_start: "2026-08-10T09:00:00Z", requested_window_end: "2026-08-10T12:00:00Z", labor_hours_estimate: 6.0, expedite_requested: true }
              as: Client
              captures: { tkt: $.data.id }
          trigger:
            - call: "POST /cabling/mac-tickets/${tkt}/schedule"
              payload: { scheduled_window_start: "2026-08-10T09:00:00Z", scheduled_window_end: "2026-08-10T12:00:00Z" }
              as: ProjectManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:30:00Z" }
              as: ProjectManager
            - call: "POST /cabling/mac-tickets/${tkt}/start"
              payload: {}
              as: Installer
              as_user_id: "user-installer-01"
            - call: "POST /cabling/mac-tickets/${tkt}/complete"
              payload: { actual_labor_hours: 4.0 }
              as: Installer
              as_user_id: "user-installer-01"
          assert:
            - "the schedule response has estimated_billed_cents == 62928 and ticket_state == \"SCHEDULED\""
            - "GET /cabling/projects/${proj} immediately after scheduling returns consumed_mac_cents == 62928"
            - "the complete response has final_billed_cents == 44160, actual_labor_hours == 4.0 and ticket_state == \"COMPLETED\""
            - "GET /cabling/projects/${proj} after completion returns consumed_mac_cents == 44160"
            - "GET /cabling/mac-tickets/${tkt} returns estimated_billed_cents == 62928 and final_billed_cents == 44160 on the same row"

  - rule_id: combinatorial_formula
    instances:

      - name: conduit_fill_tier_table_is_non_monotonic_at_the_second_cable
        grounds:
          - calculations.pathway_fill_evaluation
          - entities.PathwaySegment.fields.allowed_fill_pct
          - entities.PathwaySegment.fields.fill_area_used_sq_mm
          - validations[priority=185]
          - errors[ERR_PATHWAY_FILL_EXCEEDED]
        distinguishing_aspect: |
          Mode (a): a formula with four interacting inputs (occupying_route_count, pathway_type,
          bend_count and the candidate's cross-section) whose tier table is deliberately
          non-monotonic — FILL_PCT_2_CABLES 31 is LOWER than FILL_PCT_3_PLUS 40 — so the
          allowed area SHRINKS from 303.69 to 177.63 sq mm when the second cable is added and
          the request must be refused even though a monotone reading (40% -> 229.20 sq mm)
          would admit it. This is tier selection, not the rounding-order mode of
          as_built_cost_is_rounded_per_link_then_summed.
        test_recipe:
          setup:
            - "Project BLD2 with plenum_ceiling false and TIA_606_CLASS_1 identifiers"
            - "One EMT_CONDUIT segment PS-C with usable_area_sq_mm 573.0, bend_count 0, not in plenum, not shared with power"
            - "One CAT6 CMR cable type with outer_diameter_mm 11.0, so cross_section_area_sq_mm is 95.03"
            - "Two DESIGNED links TR01-A01 and TR01-A02 on that project"
            - "TR01-A01 already occupies PS-C: occupying_route_count 1, allowed_fill_pct 53, fill_area_used_sq_mm 95.03"
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Bluewater Fitout", site_code: "BLD2", plenum_ceiling: false, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id }
            - call: "POST /cabling/telecom-rooms"
              payload: { project_id: "${proj}", room_code: "TR01", floor: 2, branch_circuit_amps: 20, ups_capacity_va: 3000 }
              as: ProjectManager
              captures: { room: $.data.id }
            - call: "POST /cabling/cable-types"
              payload: { category: "CAT6", jacket_rating: "CMR", outer_diameter_mm: 11.0, max_channel_length_m: 100.0, shielded: false, cost_per_meter_cents: 150, applications: ["DATA_HORIZONTAL"] }
              as: DesignEngineer
              captures: { ct: $.data.id }
            - call: "POST /cabling/pathway-segments"
              payload: { project_id: "${proj}", segment_code: "PS-C", pathway_type: "EMT_CONDUIT", usable_area_sq_mm: 573.0, length_m: 18.0, bend_count: 0, in_plenum_space: false, shared_with_power: false, power_separation_mm: 0 }
              as: DesignEngineer
              captures: { seg: $.data.id, seg_v1: $.data.version }
            - call: "POST /cabling/links"
              payload: { project_id: "${proj}", telecom_room_id: "${room}", cable_type_id: "${ct}", identifier: "TR01-A01", application: "DATA_HORIZONTAL", horizontal_length_m: 50.00 }
              as: DesignEngineer
              captures: { link1: $.data.id }
            - call: "POST /cabling/links"
              payload: { project_id: "${proj}", telecom_room_id: "${room}", cable_type_id: "${ct}", identifier: "TR01-A02", application: "DATA_HORIZONTAL", horizontal_length_m: 50.00 }
              as: DesignEngineer
              captures: { link2: $.data.id }
            - call: "POST /cabling/link-routes"
              payload: { link_id: "${link1}", pathway_segment_id: "${seg}", sequence_index: 1, expected_segment_version: "${seg_v1}" }
              as: DesignEngineer
              captures: { route1: $.data.id }
            - call: "GET /cabling/pathway-segments/${seg}"
              payload: {}
              as: DesignEngineer
              captures: { seg_v2: $.data.version, used_after_one: $.data.fill_area_used_sq_mm }
          trigger:
            - call: "POST /cabling/link-routes"
              payload: { link_id: "${link2}", pathway_segment_id: "${seg}", sequence_index: 1, expected_segment_version: "${seg_v2}" }
              as: DesignEngineer
          assert:
            - "the first route succeeded with consumed_area_sq_mm == 95.03"
            - "after the first route GET /cabling/pathway-segments/${seg} returns occupying_route_count == 1, allowed_fill_pct == 53, fill_area_used_sq_mm == 95.03 and fill_ratio == 0.1658"
            - "the trigger returns HTTP 409 with error_id == \"ERR_PATHWAY_FILL_EXCEEDED\" because used_area 190.06 > allowed_area 177.63 at the two-cable tier of 31%"
            - "GET /cabling/pathway-segments/${seg} after the trigger still returns occupying_route_count == 1, fill_area_used_sq_mm == 95.03 and fill_ratio == 0.1658"
            - "GET /cabling/links/${link2} returns routed_segment_count == 0 and install_state == \"DESIGNED\""

      - name: as_built_cost_is_rounded_per_link_then_summed
        grounds:
          - calculations.project_as_built_cost
          - entities.Link.fields.material_cost_cents
          - entities.CablingProject.fields.as_built_cost_cents
          - state_machines.Link.install_state.PULLED_to_TERMINATED
        distinguishing_aspect: |
          Mode (b): nested rounding whose order is pinned. Two links each price 150 cents/m
          over channel_length_m 88.03, i.e. 13204.5 raw cents. Rounding per link first gives
          13205 + 13205 + 19000 labour = 45410; summing the raw products and rounding once
          gives 26409 + 19000 = 45409. The scaffold pins per-link rounding, so 45410 is the
          only correct answer. This is a rounding-order trap, not the tier-selection trap of
          conduit_fill_tier_table_is_non_monotonic_at_the_second_cable.
        test_recipe:
          setup:
            - "Project RVT1, room TR01 GROUNDED at 5000 milliohms, CAT6A CMP cable at 150 cents/m"
            - "CABLE_TRAY segment PS-A with 20000.0 sq mm usable area"
            - "CEILING / PATHWAY_ROUGH_IN coordination CONFIRMED"
            - "Two links TR01-A01 and TR01-A02, each horizontal_length_m 85.63 with patch_cord_allowance_m 2.00, so channel_length_m is 88.03 on both"
            - "Both links are routed and PULLED; TR01-A01 is already TERMINATED"
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id }
            - call: "POST /cabling/telecom-rooms"
              payload: { project_id: "${proj}", room_code: "TR01", floor: 3, branch_circuit_amps: 20, ups_capacity_va: 3000 }
              as: ProjectManager
              captures: { room: $.data.id }
            - call: "POST /cabling/telecom-rooms/${room}/grounding-verification"
              payload: { tgb_installed: true, bonding_conductor_awg: 6, ground_resistance_milliohms: 5000 }
              as: ProjectManager
            - call: "POST /cabling/cable-types"
              payload: { category: "CAT6A", jacket_rating: "CMP", outer_diameter_mm: 7.9, max_channel_length_m: 100.0, shielded: false, cost_per_meter_cents: 150, applications: ["DATA_HORIZONTAL"] }
              as: DesignEngineer
              captures: { ct: $.data.id }
            - call: "POST /cabling/pathway-segments"
              payload: { project_id: "${proj}", segment_code: "PS-A", pathway_type: "CABLE_TRAY", usable_area_sq_mm: 20000.0, length_m: 40.0, bend_count: 0, in_plenum_space: true, shared_with_power: false, power_separation_mm: 0 }
              as: DesignEngineer
              captures: { seg_a: $.data.id, seg_a_v1: $.data.version }
            - call: "POST /cabling/trade-coordinations"
              payload: { project_id: "${proj}", trade: "CEILING", milestone: "PATHWAY_ROUGH_IN" }
              as: ProjectManager
              captures: { coord: $.data.id }
            - call: "POST /cabling/trade-coordinations/${coord}/confirm"
              payload: { confirmed_date: "2026-08-05" }
              as: ProjectManager
            - call: "POST /cabling/links"
              payload: { project_id: "${proj}", telecom_room_id: "${room}", cable_type_id: "${ct}", identifier: "TR01-A01", application: "DATA_HORIZONTAL", horizontal_length_m: 85.63, consolidation_point_stub_m: 0, patch_cord_allowance_m: 2.00 }
              as: DesignEngineer
              captures: { link1: $.data.id, ch1: $.data.channel_length_m }
            - call: "POST /cabling/links"
              payload: { project_id: "${proj}", telecom_room_id: "${room}", cable_type_id: "${ct}", identifier: "TR01-A02", application: "DATA_HORIZONTAL", horizontal_length_m: 85.63, consolidation_point_stub_m: 0, patch_cord_allowance_m: 2.00 }
              as: DesignEngineer
              captures: { link2: $.data.id }
            - call: "POST /cabling/link-routes"
              payload: { link_id: "${link1}", pathway_segment_id: "${seg_a}", sequence_index: 1, expected_segment_version: "${seg_a_v1}" }
              as: DesignEngineer
            - call: "GET /cabling/pathway-segments/${seg_a}"
              payload: {}
              as: DesignEngineer
              captures: { seg_a_v2: $.data.version }
            - call: "POST /cabling/link-routes"
              payload: { link_id: "${link2}", pathway_segment_id: "${seg_a}", sequence_index: 1, expected_segment_version: "${seg_a_v2}" }
              as: DesignEngineer
            - call: "POST /cabling/links/${link1}/pull"
              payload: {}
              as: Installer
              as_user_id: "user-installer-01"
            - call: "POST /cabling/links/${link2}/pull"
              payload: {}
              as: Installer
              as_user_id: "user-installer-01"
            - call: "POST /cabling/links/${link1}/terminate"
              payload: {}
              as: Installer
              as_user_id: "user-installer-01"
          trigger:
            - call: "POST /cabling/links/${link2}/terminate"
              payload: {}
              as: Installer
              as_user_id: "user-installer-01"
            - call: "GET /cabling/projects/${proj}/certification-summary"
              payload: {}
              as: ProjectManager
          assert:
            - "both link create responses have channel_length_m == 88.03"
            - "GET /cabling/links/${link1} returns material_cost_cents == 13205 and GET /cabling/links/${link2} returns material_cost_cents == 13205"
            - "the certification-summary returns as_built_cost_cents == 45410 (13205 + 9500 twice), NOT 45409"
            - "the certification-summary returns total_link_count == 2, certified_link_count == 0 and completeness_pct_strict == 0.00"
            - "GET /cabling/projects/${proj} returns as_built_cost_cents == 45410"

      - name: mac_discount_tier_is_keyed_on_subtotal_not_billed_total
        grounds:
          - calculations.mac_ticket_billing
          - entities.MacTicket.fields.estimated_billed_cents
          - state_machines.MacTicket.SUBMITTED_to_SCHEDULED
          - validations[priority=200]
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency pinned by evaluation order. With 5.0 hours
          and expedite_requested true the subtotal is 48000, just under VOLUME_TIER_1_CENTS
          50000, so volume_discount_pct is 0 and billed_cents is 55200. Reading the tier off
          the amount the client actually pays (55200 >= 50000 -> 5%) yields 52440. The tier is
          keyed on subtotal_cents at STEP 3, before the expedite fee exists at STEP 5.
        test_recipe:
          setup:
            - "Project RVT1 with mac_budget_cents 500000, its single link CERTIFIED, CEILING coordination RELEASED and occupancy_status OCCUPIED"
            - "A SUBMITTED MOVE ticket with labor_hours_estimate 5.0 and expedite_requested true"
          setup_api_calls:
