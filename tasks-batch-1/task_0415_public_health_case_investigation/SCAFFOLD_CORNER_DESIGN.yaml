            - "response.data.error_id == ERR_INVALID_CLASSIFICATION"

      - name: close_blocked_by_pending_transfer_returns_transfer_pending_exists
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=14]
          - errors[ERR_TRANSFER_PENDING_EXISTS]
          - state_machines.Case.CLASSIFIED_to_CLOSED
        distinguishing_aspect: |
          A CLASSIFIED case with an open REQUESTED transfer is itself TRANSFER_PENDING, so close
          is rejected with 409 ERR_TRANSFER_PENDING_EXISTS — distinct from the active-monitoring
          close block in §1.8.
        test_recipe:
          setup:
            - "Program P, condition COVID19 (requires_lab_confirmation false), jurisdictions J1 and J2; case CP classified PROBABLE in J1; EpiAnalyst opens a transfer to J2 (case TRANSFER_PENDING, prior status CLASSIFIED)."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
