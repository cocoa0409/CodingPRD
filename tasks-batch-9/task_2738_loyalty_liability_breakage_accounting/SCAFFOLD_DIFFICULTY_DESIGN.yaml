# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Domain: Loyalty Liability & Breakage Accounting (retail loyalty finance)
# Companion to SCAFFOLD.yaml §1.1-§1.7. Nine rule_id blocks, 19 instances.
#
# UNIT CONVENTIONS (identical to SCAFFOLD.yaml):
#   * all money is integer CENTS
#   * ssp_millicents_per_point / *_rate_millicents_per_point are THOUSANDTHS OF
#     A CENT per point
#   * every rate/multiplier is BASIS POINTS (10000 bp == 1.0000)
#   * round_half_up(x) == Decimal ROUND_HALF_UP to 0 decimal places
#   * every calendar figure is whole days against the logical clock
#
# The logical clock's startup default is exactly 2026-08-01T00:00:00Z; every
# chain below sets it explicitly anyway so no instance depends on the default.
#
# Every numeric literal in every `assert:` line below was produced by executing
# the matching SCAFFOLD.yaml §1.3 formula in Python with Decimal ROUND_HALF_UP.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: dual_variant_redemption_provisional_vs_final_release
        grounds:
          - calculations.redemption_revenue_release
          - state_machines.RedemptionEvent.REQUESTED_to_ALLOCATED
          - state_machines.RedemptionEvent.ALLOCATED_to_FULFILLED
          - entities.RedemptionEvent.fields.provisional_release_cents
          - entities.RedemptionEvent.fields.final_release_cents
          - entities.RedemptionEvent.fields.remeasurement_delta_cents
          - entities.PointLot.fields.breakage_rate_bp_at_issue
        distinguishing_aspect: |
          The SAME single allocation line of 3000 points at ssp 1200 millicents
          releases 2700 cents under variant `provisional_at_allocation` (which
          reserves at the consumed lot's FROZEN breakage_rate_bp_at_issue of
          2500 bp) and 2807 cents under variant `final_at_fulfillment` (which
          reserves at the program's CURRENT approved rate of 2204 bp installed
          after the lot was issued), so remeasurement_delta_cents is exactly
          +107 and the period carries the two legs in two separate columns.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "LoyaltyProgram 'Rewards Core' ACTIVE: ssp_millicents_per_point 1200, point_expiry_days 730, per_issuance_point_cap 5000, promo_multiplier_cap_bp 30000, breakage_method COHORT_WEIGHTED, historical_redemption_rate_bp 7500, so current_breakage_rate_bp is 2500 at activation."
            - "One StateExpiryRule for TX. Two Cohorts: C1 (observed 8200 bp, adjustment 0) and C2 (observed 400 bp, adjustment -300 bp)."
            - "Member M1 GOLD/TX in C1; Member M2 SILVER/TX in C2."
            - "AccountingPeriod 2026-08 OPEN over [2026-08-01, 2026-09-01)."
            - "PointLot lot1 for M1 (base 4000, GOLD 12500 bp) -> 5000 points, gross 6000, deferred 4500, breakage_rate_bp_at_issue 2500."
            - "PointLot lot2 for M2 (base 250, SILVER 10300 bp, promo 10300 bp) -> 266 points, gross 319, deferred 239, breakage_rate_bp_at_issue 2500."
            - "BreakageEstimate est1 for the period, prepared by u_acct_1, APPROVED by u_ctrl_1 -> estimated_redemption_rate_bp 7796, so program.current_breakage_rate_bp is now 2204."
            - "RedemptionEvent rev1 for M1 requesting 3000 CATALOG points, still REQUESTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Rewards Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C2", enrollment_start_date: "2025-01-01T00:00:00Z", enrollment_end_date: "2025-12-31T00:00:00Z", observed_redemption_rate_bp: 400, sample_size: 9000, program_change_adjustment_bp: -300 }
              as: ProgramAdmin
              captures: { coh2_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "M1", state_code: "TX", tier: "GOLD" }
              as: LoyaltyAccountant
              captures: { m1_id: $.data.id }
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh2_id}", external_member_ref: "M2", state_code: "TX", tier: "SILVER" }
              as: LoyaltyAccountant
              captures: { m2_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per1_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 4000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot1_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${m2_id}", period_id: "${per1_id}", base_points: 250, promo_multiplier_bp: 10300 }
              as: LoyaltyAccountant
              captures: { lot2_id: $.data.id }
            - call: "POST /programs/${prog_id}/breakage-estimates"
              payload: { period_id: "${per1_id}", memo_narrative: "Cohort-weighted Aug-2026 estimate", sensitivity_low_bp: 7296, sensitivity_high_bp: 8296 }
              as: LoyaltyAccountant
              as_user_id: "u_acct_1"
              captures: { est1_id: $.data.id }
            - call: "POST /breakage-estimates/${est1_id}/submit"
              payload: {}
              as: LoyaltyAccountant
              as_user_id: "u_acct_1"
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: Controller
              captures: { prog_v: $.data.version }
            - call: "POST /breakage-estimates/${est1_id}/approve"
              payload: { expected_program_version: "${prog_v}" }
              as: Controller
              as_user_id: "u_ctrl_1"
            - call: "POST /redemption-events"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", points_requested: 3000, redemption_type: "CATALOG" }
              as: LoyaltyAccountant
              captures: { rev1_id: $.data.id }
          trigger:
            - call: "POST /redemption-events/${rev1_id}/allocate"
              payload: {}
              as: LoyaltyAccountant
              captures: { prov: $.data.provisional_release_cents }
            - call: "POST /redemption-events/${rev1_id}/fulfill"
              payload: {}
              as: LoyaltyAccountant
              captures: { fin: $.data.final_release_cents }
          assert:
            - "After the allocate call, RedemptionEvent.${rev1_id}.state == ALLOCATED and RedemptionEvent.${rev1_id}.provisional_release_cents == 2700"
            - "After the allocate call, RedemptionEvent.${rev1_id}.final_release_cents == 0 and RedemptionEvent.${rev1_id}.remeasurement_delta_cents == 0"
            - "After the allocate call, AccountingPeriod.${per1_id}.redemption_recognized_cents == 2700 and AccountingPeriod.${per1_id}.remeasurement_delta_cents == 0"
            - "After the fulfill call, RedemptionEvent.${rev1_id}.state == FULFILLED and RedemptionEvent.${rev1_id}.final_release_cents == 2807"
            - "After the fulfill call, RedemptionEvent.${rev1_id}.provisional_release_cents is still exactly 2700 (the provisional leg is never overwritten)"
            - "After the fulfill call, RedemptionEvent.${rev1_id}.remeasurement_delta_cents == 107 and 2807 - 2700 == 107"
            - "After the fulfill call, AccountingPeriod.${per1_id}.redemption_recognized_cents == 2700 and AccountingPeriod.${per1_id}.remeasurement_delta_cents == 107 (two separate columns, never merged)"
            - "GET /redemption-events/${rev1_id}/allocations returns total_count == 1; data[0].entry_type == ALLOCATION, data[0].points_allocated == 3000, data[0].line_gross_ssp_cents == 3600, data[0].provisional_release_cents == 2700, data[0].final_release_cents == 2807"
            - "PointLot.${lot1_id}.points_remaining == 2000 and PointLot.${lot1_id}.lifecycle_state == PARTIALLY_REDEEMED"
            - "PointLot.${lot1_id}.breakage_rate_bp_at_issue is still 2500 even though LoyaltyProgram.${prog_id}.current_breakage_rate_bp is 2204"

      - name: dual_variant_partner_settlement_gross_vs_net
        grounds:
          - calculations.partner_settlement_net
          - entities.PartnerAgreement.fields.net_settlement_enabled
          - entities.SettlementStatement.fields.settlement_basis
          - entities.SettlementStatement.fields.net_due_cents
          - entities.SettlementStatement.fields.redemption_payable_cents
          - concurrency_rules[statement-create-stale-agreement]
        distinguishing_aspect: |
          Two PartnerAgreements carrying byte-identical rate cards, windows and
          activity (80000 partner-issued points and one allocated 3000-point
          PARTNER redemption each) diverge purely on net_settlement_enabled:
          the GROSS statement bills net_due_cents 72000 and reports the 3300
          payable without offsetting it, while the NET statement bills
          net_due_cents 68700 - a 3300 delta on the same measured legs.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "LoyaltyProgram 'Partner Core' ACTIVE with ssp_millicents_per_point 1200, per_issuance_point_cap 200000, historical_redemption_rate_bp 7500 (current_breakage_rate_bp 2500)."
            - "One StateExpiryRule for TX; one Cohort C1 (observed 8200 bp, adjustment 0)."
            - "Members MG and MN, both BASE/TX in C1."
            - "AccountingPeriod 2026-08 OPEN over [2026-08-01, 2026-09-01)."
            - "PartnerAgreement PG: partner_code 'PG', THIRD_PARTY, issuance 900 millicents/pt, redemption 1100 millicents/pt, settlement_lag_days 30, net_settlement_enabled FALSE, min_invoice_cents 5000, window [2026-08-01, 2026-12-31]."
            - "PartnerAgreement PN: identical to PG except partner_code 'PN' and net_settlement_enabled TRUE."
            - "One partner-issued PointLot of base_points 80000 against each agreement -> 80000 points, gross 96000, deferred 72000 each."
            - "One 3000-point PARTNER RedemptionEvent against each agreement, both ALLOCATED, so each agreement has partner_redeemed_points 3000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Partner Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 200000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "MG", state_code: "TX", tier: "BASE" }
              as: LoyaltyAccountant
              captures: { mg_id: $.data.id }
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "MN", state_code: "TX", tier: "BASE" }
              as: LoyaltyAccountant
              captures: { mn_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per1_id: $.data.id }
            - call: "POST /partner-agreements"
              payload: { program_id: "${prog_id}", partner_code: "PG", relationship_type: "THIRD_PARTY", issuance_rate_millicents_per_point: 900, redemption_rate_millicents_per_point: 1100, settlement_lag_days: 30, net_settlement_enabled: false, min_invoice_cents: 5000, effective_start_date: "2026-08-01T00:00:00Z", effective_end_date: "2026-12-31T00:00:00Z" }
              as: ProgramAdmin
              captures: { pag_id: $.data.id }
            - call: "POST /partner-agreements"
              payload: { program_id: "${prog_id}", partner_code: "PN", relationship_type: "THIRD_PARTY", issuance_rate_millicents_per_point: 900, redemption_rate_millicents_per_point: 1100, settlement_lag_days: 30, net_settlement_enabled: true, min_invoice_cents: 5000, effective_start_date: "2026-08-01T00:00:00Z", effective_end_date: "2026-12-31T00:00:00Z" }
              as: ProgramAdmin
              captures: { pan_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${mg_id}", period_id: "${per1_id}", partner_agreement_id: "${pag_id}", base_points: 80000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lotg_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${mn_id}", period_id: "${per1_id}", partner_agreement_id: "${pan_id}", base_points: 80000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lotn_id: $.data.id }
            - call: "POST /redemption-events"
              payload: { member_id: "${mg_id}", period_id: "${per1_id}", partner_agreement_id: "${pag_id}", points_requested: 3000, redemption_type: "PARTNER" }
              as: LoyaltyAccountant
              captures: { revg_id: $.data.id }
            - call: "POST /redemption-events/${revg_id}/allocate"
              payload: {}
              as: LoyaltyAccountant
            - call: "POST /redemption-events"
              payload: { member_id: "${mn_id}", period_id: "${per1_id}", partner_agreement_id: "${pan_id}", points_requested: 3000, redemption_type: "PARTNER" }
              as: LoyaltyAccountant
              captures: { revn_id: $.data.id }
            - call: "POST /redemption-events/${revn_id}/allocate"
              payload: {}
              as: LoyaltyAccountant
          trigger:
            - call: "GET /partner-agreements/${pag_id}"
              payload: {}
              as: LoyaltyAccountant
              captures: { pag_v: $.data.version }
            - call: "POST /settlement-statements"
              payload: { partner_agreement_id: "${pag_id}", period_id: "${per1_id}", expected_partner_agreement_version: "${pag_v}" }
              as: LoyaltyAccountant
              captures: { stg_id: $.data.id }
            - call: "GET /partner-agreements/${pan_id}"
              payload: {}
              as: LoyaltyAccountant
              captures: { pan_v: $.data.version }
            - call: "POST /settlement-statements"
              payload: { partner_agreement_id: "${pan_id}", period_id: "${per1_id}", expected_partner_agreement_version: "${pan_v}" }
              as: LoyaltyAccountant
              captures: { stn_id: $.data.id }
          assert:
            - "SettlementStatement.${stg_id}.settlement_basis == GROSS and SettlementStatement.${stn_id}.settlement_basis == NET"
            - "Both statements measure identical legs: partner_issued_points == 80000, partner_redeemed_points == 3000, issuance_receivable_cents == 72000, redemption_payable_cents == 3300, carried_forward_cents == 0"
            - "SettlementStatement.${stg_id}.net_due_cents == 72000 (GROSS does not offset the payable)"
            - "SettlementStatement.${stn_id}.net_due_cents == 68700 (NET offsets the 3300 payable)"
            - "SettlementStatement.${stg_id}.net_due_cents - SettlementStatement.${stn_id}.net_due_cents == 3300"
            - "Both statements have deferred_below_minimum_cents == 0 because both candidates exceed min_invoice_cents 5000"
            - "Both statements have due_date == 2026-10-01T00:00:00Z (period end_at 2026-09-01 plus settlement_lag_days 30)"
            - "Both statements are in state DRAFT; PartnerAgreement.${pag_id}.outstanding_settlement_cents == 0 and PartnerAgreement.${pan_id}.outstanding_settlement_cents == 0 until issue"

  # ===========================================================================
  # RULE 2 — combinatorial_formula
  # The three instances below deliberately occupy the THREE DIFFERENT modes:
  #   (b) nested-rounding sensitivity   -> combinatorial_issuance_nested_tier_then_promo_rounding
  #   (a) order-of-operations sensitivity -> combinatorial_cohort_rate_clamped_before_weighting
  #   (c) pinned multi-step sequence    -> combinatorial_period_close_rollforward_pinned_eight_step_order
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: combinatorial_issuance_nested_tier_then_promo_rounding
        grounds:
          - calculations.point_issuance_measurement
          - entities.PointLot.fields.tier_points
          - entities.PointLot.fields.points_issued
          - entities.PointLot.fields.tier_benefit_expense_cents
          - entities.PointLot.fields.promo_expense_cents
        distinguishing_aspect: |
          MODE (b) nested rounding. The tier uplift is rounded to whole points
          BEFORE the promotional uplift consumes it, so base 250 at SILVER
          10300 bp with promo 10300 bp yields tier_points 258 and
          points_issued 266, whereas the collapsed one-shot form
          round_half_up(250 * 10300 * 10300 / 10^8) yields 265 - and the 266
          vs 265 split propagates into gross_ssp_cents 319 vs 318.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "LoyaltyProgram 'Nested Core' ACTIVE with ssp_millicents_per_point 1200, per_issuance_point_cap 5000, promo_multiplier_cap_bp 30000, tier_multiplier_bp SILVER 10300, historical_redemption_rate_bp 7500 -> current_breakage_rate_bp 2500 after activation."
            - "One StateExpiryRule for TX, one Cohort C1, one Member M2 at tier SILVER in TX."
            - "AccountingPeriod 2026-08 OPEN over [2026-08-01, 2026-09-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Nested Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "M2", state_code: "TX", tier: "SILVER" }
              as: LoyaltyAccountant
              captures: { m2_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per1_id: $.data.id }
          trigger:
            - call: "POST /point-lots"
              payload: { member_id: "${m2_id}", period_id: "${per1_id}", base_points: 250, promo_multiplier_bp: 10300 }
              as: LoyaltyAccountant
              captures: { lot2_id: $.data.id }
          assert:
            - "PointLot.${lot2_id}.tier_points == 258 (round_half_up(250 * 10300 / 10000) == round_half_up(257.5))"
            - "PointLot.${lot2_id}.points_issued == 266 (round_half_up(258 * 10300 / 10000) == round_half_up(265.74)), NOT 265"
            - "PointLot.${lot2_id}.points_remaining == 266"
            - "PointLot.${lot2_id}.gross_ssp_cents == 319 (round_half_up(266 * 1200 / 1000) == round_half_up(319.2)), NOT 318"
            - "PointLot.${lot2_id}.breakage_reserve_cents == 80 (round_half_up(319 * 2500 / 10000) == round_half_up(79.75))"
            - "PointLot.${lot2_id}.deferred_revenue_cents == 239"
            - "PointLot.${lot2_id}.tier_benefit_expense_cents == 10 (round_half_up((258 - 250) * 1200 / 1000) == round_half_up(9.6))"
            - "PointLot.${lot2_id}.promo_expense_cents == 10 (round_half_up((266 - 258) * 1200 / 1000) == round_half_up(9.6))"
            - "PointLot.${lot2_id}.tier_multiplier_bp_at_issue == 10300 and PointLot.${lot2_id}.ssp_millicents_per_point_at_issue == 1200 and PointLot.${lot2_id}.breakage_rate_bp_at_issue == 2500"
            - "AccountingPeriod.${per1_id}.issuance_deferred_cents == 239"

      - name: combinatorial_cohort_rate_clamped_before_weighting
        grounds:
          - calculations.estimated_redemption_rate
          - entities.BreakageEstimate.fields.estimated_redemption_rate_bp
          - entities.BreakageEstimate.fields.breakage_rate_bp
          - entities.BreakageEstimate.fields.outstanding_points_at_estimate
          - entities.BreakageEstimate.fields.outstanding_gross_ssp_cents_at_estimate
          - entities.Cohort.fields.program_change_adjustment_bp
        distinguishing_aspect: |
          MODE (a) order of operations. The [200, 9800] clamp is applied PER
          COHORT before weighting: cohort C2's raw adjusted rate 400 + (-300)
          = 100 is lifted to the 200 bp floor first, giving
          (8200*5000 + 200*266) / 5266 -> 7796; clamping the weighted mean
          instead gives (8200*5000 + 100*266) / 5266 -> 7791, and 7791 is
          inside the band so the late clamp cannot repair it.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "LoyaltyProgram 'Rewards Core' ACTIVE, breakage_method COHORT_WEIGHTED, ssp_millicents_per_point 1200, per_issuance_point_cap 5000, historical_redemption_rate_bp 7500 (current_breakage_rate_bp 2500)."
