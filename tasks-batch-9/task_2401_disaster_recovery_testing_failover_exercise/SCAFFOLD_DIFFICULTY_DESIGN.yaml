          assert:
            - "the touching exercise schedules successfully: Exercise.${exH2_id}.execution_state == SCHEDULED, because [00:00, 06:00) and [06:00, 12:00) do not intersect"
            - "the overlapping exercise returns 409 with overlap_error == ERR_SITE_WINDOW_CONFLICT, because [05:59, 11:00) intersects [00:00, 06:00) for exactly one minute"
            - "Exercise.${exH3_id}.execution_state remains APPROVED"
            - "Site.${sr_id}.reserved_capacity_units == 4 — two COMPONENT exercises at 2 units each, with nothing reserved for the rejected one"
            - "the rejection is NOT ERR_SITE_CAPACITY_EXCEEDED: 4 + 2 == 6 is far below the 40 usable units"

      - name: change_freeze_interval_is_closed_so_touching_the_endpoint_conflicts
        grounds:
          - validations.priority_38
          - endpoints.POST./recovery-groups/{id}/change-freeze
          - errors.ERR_GROUP_CHANGE_FREEZE_CONFLICT
        distinguishing_aspect: |
          A different contended resource — the RecoveryGroup's change-freeze calendar rather than the
          Site's booking calendar — and the OPPOSITE interval semantics: the freeze interval is CLOSED
          on both ends, so an exercise whose window merely touches change_freeze_start_at conflicts,
          which is exactly the case that the Site rule permits. The check also lives on a different
          endpoint (scope-items rather than schedule).
        test_recipe:
          setup:
            - "The standard RG-1 fixture exists at clock 2026-08-01T00:00:00Z with posture READY."
            - "RG-1 carries a change freeze over the CLOSED interval 2026-08-20T06:00:00Z .. 2026-08-25T00:00:00Z."
            - "Exercise exTouch (COMPONENT_FAILOVER, 2026-08-20T00:00:00Z - 06:00:00Z) ends at exactly the freeze start instant."
            - "Exercise exClear (COMPONENT_FAILOVER, 2026-08-20T00:00:00Z - 05:59:00Z) ends one minute before the freeze starts."
          setup_api_calls:
            - *b01
            - *b02
            - *b03
            - *b04
            - *b05
            - *b06
            - *b07
            - *b08
            - *b09
            - *b10
            - *b11
            - *b12
            - *b13
            - *b14
            - *b15
            - *b16
            - *b17
            - *b18
            - *b19
            - *b20
            - *b21
            - *b22
            - *b23
            - *b24
            - *b25
            - *b26
            - *b27
            - *b28
            - *b29
            - *b30
            - *b31
            - *b32
            - *b33
            - call: "POST /recovery-groups/${g1_id}/change-freeze"
              payload: { change_freeze_start_at: "2026-08-20T06:00:00Z", change_freeze_end_at: "2026-08-25T00:00:00Z" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /exercises"
              payload: { name: "Ends at the freeze boundary", exercise_type: "COMPONENT_FAILOVER", recovery_site_id: "${sr_id}", coordinator_id: "${c1_id}", planned_start_at: "2026-08-20T00:00:00Z", planned_end_at: "2026-08-20T06:00:00Z" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { exTouch_id: $.data.id, exTouch_v: $.data.version }
            - call: "POST /exercises"
              payload: { name: "Ends a minute before the freeze", exercise_type: "COMPONENT_FAILOVER", recovery_site_id: "${sr_id}", coordinator_id: "${c1_id}", planned_start_at: "2026-08-20T00:00:00Z", planned_end_at: "2026-08-20T05:59:00Z" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { exClear_id: $.data.id, exClear_v: $.data.version }
          trigger:
            - call: "POST /exercises/${exTouch_id}/scope-items"
              payload: { recovery_group_id: "${g1_id}", expected_exercise_version: "${exTouch_v}" }
              as: ResilienceCoordinator
