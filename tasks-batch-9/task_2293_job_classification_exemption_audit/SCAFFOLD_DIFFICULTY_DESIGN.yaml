              payload: { state_code: "TX", min_weekly_salary_cents: 60000, duties_test_variant: "FEDERAL", ic_test: "ECONOMIC_REALITY", hce_shortcut_recognized: true, liquidated_damages_multiplier: 1.0, reclass_notice_days: 14 }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /audit-projects"
              payload: { name: "FY26 Texas Sweep", fiscal_year: 2026, lookback_policy: "STANDARD_2Y" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { proj_id: $.data.id }
            - call: "POST /job-families"
              payload: { audit_project_id: "${proj_id}", name: "Clinical Professionals", code: "CLIN-PRO" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { fam_id: $.data.id }
            - call: "POST /audit-projects/${proj_id}/status"
              payload: { target_status: "FIELDWORK" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /positions"
              payload: { job_family_id: "${fam_id}", title: "Staff Therapist At Floor", job_code: "ST-401", current_fls_status: "EXEMPT", claimed_exemption_test: "PROFESSIONAL", annual_salary_cents: 4388800, salary_basis: "SALARY", work_state_code: "TX", incumbent_count: 1, avg_weekly_hours: 42, requires_advanced_degree: true, works_primarily_offsite: false }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { pos_at_id: $.data.id }
            - call: "POST /positions"
              payload: { job_family_id: "${fam_id}", title: "Staff Therapist Below Floor", job_code: "ST-402", current_fls_status: "EXEMPT", claimed_exemption_test: "PROFESSIONAL", annual_salary_cents: 4388748, salary_basis: "SALARY", work_state_code: "TX", incumbent_count: 1, avg_weekly_hours: 42, requires_advanced_degree: true, works_primarily_offsite: false }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { pos_below_id: $.data.id }
            - call: "POST /interviews"
              payload: { position_id: "${pos_at_id}", respondent_type: "MANAGER", respondent_ref: "MGR-A", interviewer_user_id: "int-2", scheduled_start_at: "2026-09-14T09:00:00Z", scheduled_end_at: "2026-09-14T10:00:00Z" }
              as: ComplianceAnalyst
