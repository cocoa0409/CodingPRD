  - section: errors
    instances:
      - name: every_declared_not_found_code_is_reachable
        claim_type: triggerability
        grounds:
          - errors.ERR_REPAIR_ORDER_NOT_FOUND
          - errors.ERR_CUSTOMER_NOT_FOUND
          - errors.ERR_INSURER_NOT_FOUND
          - errors.ERR_ESTIMATE_LINE_NOT_FOUND
          - errors.ERR_DAMAGE_LINE_NOT_FOUND
          - errors.ERR_SUPPLEMENT_NOT_FOUND
          - errors.ERR_PARTS_VENDOR_NOT_FOUND
          - errors.ERR_PARTS_LINE_NOT_FOUND
          - errors.ERR_PROCEDURE_RECORD_NOT_FOUND
          - errors.ERR_CALIBRATION_BAY_NOT_FOUND
          - errors.ERR_STALL_NOT_FOUND
          - errors.ERR_STAGE_ASSIGNMENT_NOT_FOUND
        distinguishing_aspect: >-
          Twelve distinct 404 codes exist, and a generic not-found response would collapse them. Each is
          probed with the same absent uuid so the only thing that varies is which entity the request
          addressed - including the two that are reached through a body field rather than a path segment
          (customer_id, insurer_id) and the cross-order case where the referenced row exists but belongs
          to another RepairOrder.
        test_recipe:
          setup:
            - "A Customer, an Insurer, two RepairOrders (O1 and O2), one teardown finding on O2, and one ProcedureRecord on O1."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Rue Elm", phone: "555-1042", email: "rue@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
