            - call: "GET /escrow/holdbacks/${hb_id}/approvals"
              as: EscrowOfficer
              captures: { ap_l: "$.data[0].id" }
            - call: "POST /escrow/approvals/${ap_l}/decide"
              payload: { decision: "APPROVED" }
              as: Lender
              as_user_id: "lender_1"
              captures: { ap_st: $.data.status, ap_pin: $.data.holdback_version_at_decision }
            - call: "GET /escrow/holdbacks/${hb_id}"
              as: EscrowOfficer
              captures: { hb_st: $.data.status, hb_v: $.data.version }
          assert:
            - "st == PENDING_APPROVALS in the submit response itself"
            - "ap_st == APPROVED and ap_pin == hb_v (the decide response carries the version pin)"
            - "hb_st == ACTIVE immediately after the last approval (auto-transition, no polling)"
