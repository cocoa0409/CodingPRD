          - calculations.replacement_priority_score.constants.COORDINATION_TIERS
        distinguishing_aspect: "With the clock at its 2026-08-01 default, paving on 2026-10-30 is exactly 90 days out and earns 20.00 (50.00 -> 70.00), paving on 2026-10-31 is 91 days out and earns 12.00 (-> 62.00), and paving already past on 2026-07-01 earns 0.00 (-> 50.00) through the days_to_paving < 0 guard rather than the <= 90 tier."
