  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_disbursement_approve
        grounds:
          - validations[priority=7]
          - validations[priority=15]
          - errors[ERR_LOAN_NOT_DRAWABLE]
          - errors[ERR_INSUFFICIENT_LINE]
          - endpoints["POST /disbursements/{disbursementId}/approve"]
        distinguishing_aspect: |
          error-category pair STATE vs BUSINESS_FISCAL: a disbursement approve on a DUE_AND_PAYABLE
          loan (state, p7) that ALSO requests more than the available line (fiscal, p15) must return
          ERR_LOAN_NOT_DRAWABLE (409), never ERR_INSUFFICIENT_LINE (422) — lower priority number wins.
        test_recipe:
          setup:
            - "Originated LOC loan, available_line_of_credit_cents=14690000, then a maturity event made it DUE_AND_PAYABLE and froze the line to 0; one disbursement requested BEFORE the maturity event for 99000000 (way over line)."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Servicer P1", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Ivy Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
            - call: "POST /disbursements"
              payload: { loan_id: "${loan_id}", kind: "LINE_DRAW", requested_amount_cents: 99000000 }
              as: Borrower
              as_user_id: "${borrower_id}"
              captures: { disb_id: $.data.id }
            - call: "GET /loans/${loan_id}"
              payload: {}
              as: ServicerOps
              captures: { loan_v: $.data.version }
            - call: "POST /maturity-events"
              payload: { loan_id: "${loan_id}", event_type: "PERMANENT_VACANCY", event_date: "2025-02-15" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /disbursements/${disb_id}/approve"
              payload: { expected_loan_version: "${loan_v}" }
              as: ServicerOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_LOAN_NOT_DRAWABLE (state p7 beats fiscal p15)"
            - "Disbursement.${disb_id}.status == VOIDED (was voided by the maturity cascade) — approve still rejected on state"

      - name: referential_beats_temporal_on_nbs_deferral
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_NBS_NOT_QUALIFIED]
          - errors[ERR_DEFERRAL_NOT_ELIGIBLE]
          - endpoints["POST /nbs-deferrals"]
        distinguishing_aspect: |
          error-category pair BUSINESS_REFERENTIAL vs BUSINESS_TEMPORAL: an NBS deferral naming a
          borrower who is NOT a qualified NBS (referential, p9) against a maturity event that is NOT a
          BORROWER_DEATH (temporal eligibility, p10) must return ERR_NBS_NOT_QUALIFIED (the lower
          priority number), not ERR_DEFERRAL_NOT_ELIGIBLE.
        test_recipe:
          setup:
            - "Originated LOC loan whose only spouse borrower has nbs_qualifies=false; a PERMANENT_VACANCY maturity event (not death) made the loan DUE_AND_PAYABLE."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Servicer P2", hud_lending_limit_cents: 80000000 }
