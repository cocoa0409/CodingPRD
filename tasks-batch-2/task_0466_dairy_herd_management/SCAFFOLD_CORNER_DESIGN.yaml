              as: HerdManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ANIMAL_NOT_CULLABLE"

      - name: cancel_provisional_milkcheck_succeeds
        claim_type: Valid Transition
        grounds:
          - state_machines.MilkCheck.PROVISIONAL_to_CANCELLED
          - entities.MilkCheck.fields.status
        distinguishing_aspect: "Cancel a PROVISIONAL MilkCheck with matching version => CANCELLED; version increments to 2."
        test_recipe:
          setup: ["A PROVISIONAL MilkCheck (empty pool is fine for cancel) on a 2026-06 price sheet."]
          setup_api_calls:
            - call: "POST /herds"
              payload: { name: "Cancel Check Dairy", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
            - call: "POST /herds/coop-price-sheets"
              payload: { herd_id: "${h_id}", settlement_month: "2026-06", fat_price_per_lb: 2.805, protein_price_per_lb: 3.515, other_solids_price_per_lb: 0.405, ppd_per_cwt: 1.205, advance_rate_per_cwt: 16.00 }
