            - "trigger[2] HTTP status == 200"
            - "trigger[2] response: 0 rows, total_count == 0, has_more == false (r1 superseded nobody; the link is not symmetric)"
            - "trigger[3] response: 3 rows in created_at ASC order - INITIAL_PREMIUM +100000, REPORTING_ADJUSTMENT +19110 from adjudicating r1, and the compensating REPORTING_ADJUSTMENT -19110 that backs the ACCEPTED predecessor out"
            - "after trigger[0]: CoveragePart.${cp}.earned_reported_premium_cents == 0 and Policy.${pol}.premium_balance_cents == 100000"
            - "the 19110 that was earned on r1 (9000000 * 250 bp * 31 / 365 days) is exactly the amount reversed, so the restatement leaves no residue"

