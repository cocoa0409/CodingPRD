            - { call: "POST /fenestration/glass-packages", payload: { code: "LP2-ARG", pane_count: 2, spacer_type: "ALUMINUM", argon_target_pct: 95, argon_min_pct: 90, catalog_u_factor: 0.28, catalog_shgc: 0.40, price_per_sqft_cents: 900, ig_warranty_years: 20 }, as: PlantEngineer, captures: { gp1: $.data.id } }
            - { call: "POST /fenestration/dealers", payload: { name: "NorthStar", ship_to_state_code: "MN" }, as: PlantManager, captures: { dealer: $.data.id } }
            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dealer}", order_date: "2026-08-02T00:00:00Z" }, as: PlantManager, captures: { ord: $.data.id } }
            - { call: "POST /fenestration/orders/${ord}/lines", payload: { series_id: "${v200}", glass_package_id: "${gp1}", shape: "RECTANGLE", width_in: 40, height_in: 60, quantity: 1, grid_style: "NONE", hardware_finish: "STANDARD" }, as: PlantManager }
            - { call: "POST /fenestration/orders/${ord}/confirm", as: PlantManager }
            - { call: "POST /fenestration/production-waves", payload: { wave_date: "2026-09-01T00:00:00Z", capacity_units: 10, capacity_glass_sqft: 500 }, as: ProductionLead, captures: { wave: $.data.id } }
            - { call: "POST /fenestration/production-waves/${wave}/open", as: ProductionLead }
            - { call: "GET /fenestration/production-waves/${wave}", as: ProductionLead, captures: { wv: $.data.version } }
            - { call: "POST /fenestration/production-waves/${wave}/assignments", payload: { order_id: "${ord}", expected_wave_version: "${wv}" }, as: ProductionLead }
            - { call: "POST /fenestration/production-waves/${wave}/lock", as: ProductionLead }
            - { call: "POST /fenestration/production-waves/${wave}/release", as: ProductionLead }
            - { call: "POST /fenestration/shipping-racks", payload: { rack_code: "R5", slot_capacity: 5 }, as: ShippingCoordinator, captures: { rack: $.data.id } }
          trigger:
            - { call: "POST /fenestration/shipping-racks/${rack}/reservations", payload: { order_id: "${ord}", load_date: "2026-09-10T00:00:00Z", ship_date: "2026-09-20T00:00:00Z" }, as: ShippingCoordinator, captures: { res1: $.data.id } }
            - { call: "POST /fenestration/shipping-racks/${rack}/reservations", payload: { order_id: "${ord}", load_date: "2026-09-21T00:00:00Z", ship_date: "2026-09-25T00:00:00Z" }, as: ShippingCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /fenestration/shipping-racks/${rack}/reservations", payload: { order_id: "${ord}", load_date: "2026-09-22T00:00:00Z", ship_date: "2026-09-25T00:00:00Z" }, as: ShippingCoordinator, captures: { res2: $.data.id } }
            - { call: "GET /fenestration/shipping-racks/${rack}", as: ShippingCoordinator, captures: { rack_status: $.data.status } }
          assert:
            - "Reservation [09-10, 09-20] created"
            - "load_date == ship_date + 1 day (09-21) rejected with ERR_RACK_OCCUPANCY_CONFLICT (turnover buffer day)"
            - "load_date == ship_date + 2 days (09-22) accepted — closed-interval + buffer, NOT half-open adjacency"
            - "ShippingRack.${rack}.status == BOOKED with two active reservations coexisting"

  - rule_id: compensating_invariant
    instances:
      - name: wave_assign_unassign_conserves_capacity
        grounds:
          - calculations.wave_allocation
          - state_machines.WindowOrder.CONFIRMED_to_RELEASED
          - concurrency_rules[wave-assignment-stale-wave]
        distinguishing_aspect: |
          Conserved quantity: WAVE UNIT ALLOCATION. Forward action (assign)
          plus its compensating action (unassign) leave
          wave.allocated_units unchanged (0 -> 4 -> 0) and
          allocated_units + free == capacity_units holds at every step.
        test_recipe:
          setup: ["MN rule, V200, GP1, dealer; confirmed order qty4; wave cap_units 10 / glass 500 OPEN at allocated 0"]
          setup_api_calls:
            - { call: "POST /fenestration/energy-code-rules", payload: { state_code: "MN", max_u_factor: 0.30, max_shgc: 0.55, effective_from: "2025-01-01T00:00:00Z" }, as: PlantEngineer }
            - { call: "POST /fenestration/catalog-series", payload: { series_code: "V200", frame_material: "VINYL", base_rate_cents_per_ui: 1500, min_billable_sqft: 3.0, max_united_inches: 120, special_shape_upcharge_pct: 40, lead_time_standard_days: 10, lead_time_special_shape_days: 25, frame_warranty_years: 20 }, as: PlantEngineer, captures: { v200: $.data.id } }
            - { call: "POST /fenestration/glass-packages", payload: { code: "LP2-ARG", pane_count: 2, spacer_type: "ALUMINUM", argon_target_pct: 95, argon_min_pct: 90, catalog_u_factor: 0.28, catalog_shgc: 0.40, price_per_sqft_cents: 900, ig_warranty_years: 20 }, as: PlantEngineer, captures: { gp1: $.data.id } }
            - { call: "POST /fenestration/dealers", payload: { name: "NorthStar", ship_to_state_code: "MN" }, as: PlantManager, captures: { dealer: $.data.id } }
            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dealer}", order_date: "2026-08-02T00:00:00Z" }, as: PlantManager, captures: { ord: $.data.id } }
            - { call: "POST /fenestration/orders/${ord}/lines", payload: { series_id: "${v200}", glass_package_id: "${gp1}", shape: "RECTANGLE", width_in: 40, height_in: 60, quantity: 4, grid_style: "NONE", hardware_finish: "STANDARD" }, as: PlantManager }
            - { call: "POST /fenestration/orders/${ord}/confirm", as: PlantManager }
            - { call: "POST /fenestration/production-waves", payload: { wave_date: "2026-09-01T00:00:00Z", capacity_units: 10, capacity_glass_sqft: 500 }, as: ProductionLead, captures: { wave: $.data.id } }
            - { call: "POST /fenestration/production-waves/${wave}/open", as: ProductionLead }
          trigger:
            - { call: "GET /fenestration/production-waves/${wave}", as: ProductionLead, captures: { wv0: $.data.version, a0: $.data.allocated_units } }
            - { call: "POST /fenestration/production-waves/${wave}/assignments", payload: { order_id: "${ord}", expected_wave_version: "${wv0}" }, as: ProductionLead, captures: { a1: $.data.allocated_units } }
            - { call: "POST /fenestration/production-waves/${wave}/unassign", payload: { order_id: "${ord}" }, as: ProductionLead, captures: { a2: $.data.allocated_units } }
            - { call: "GET /fenestration/orders/${ord}", as: ProductionLead, captures: { o_status: $.data.production_status, o_wave: $.data.wave_id } }
          assert:
            - "allocated_units walk: 0 -> 4 -> 0 (compensating pair leaves the conserved quantity unchanged)"
            - "allocated_glass_sqft walk: 0 -> 66.68 -> 0"
            - "WindowOrder.${ord} returns to CONFIRMED with wave_id == null"

      - name: breakage_remake_conserves_live_ig_count
        grounds:
          - state_machines.IGUnit.SEALED_to_BROKEN
          - entities.IGUnit.fields.remake_of_id
