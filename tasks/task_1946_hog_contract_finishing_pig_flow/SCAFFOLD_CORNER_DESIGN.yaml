          difficulty_instance: state_vs_fiscal_feed_order_on_cancelled_group
          rationale: "Dual-failure ordering state-vs-fiscal asserted there."

      - name: safety_temporal_priority_conflict_covered_by_difficulty
        claim_type: priority_ordering
        grounds: [ "validations[priority=8]", "validations[priority=9]"]
        excluded_because:
          difficulty_instance: safety_vs_temporal_dispatch_wash_unverified_and_stale
          rationale: "Dual-failure ordering safety-vs-temporal asserted there."

  # ============================================================ endpoints
  - section: endpoints
    instances:
      - name: feed_cancel_releases_committed_budget
        claim_type: action_endpoint
        grounds: [state_machines.FeedOrder, calculations.feed_budget_gate]
        distinguishing_aspect: "Cancelling a REQUESTED order releases its committed lbs: afterwards a 640000-lb order fits the 650000-lb hard budget (with only the phase-plan advisory flag raised)."
        test_recipe:
          setup: ["group PLACED 1000 head; STARTER order O1 50000 lbs REQUESTED"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id, barn_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 1000, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v}" }, as: FieldTech, captures: { group_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups/${group_id}/confirm-placement", payload: {}, as: FieldTech }
            - { call: "POST /feed-orders", payload: { group_id: "${group_id}", phase: "STARTER", diet_code: "ST-1", quantity_lbs: 50000, requested_delivery_date: "2026-03-05" }, as: FieldTech, captures: { o1: $.data.id } }
            - { call: "POST /feed-orders", payload: { group_id: "${group_id}", phase: "STARTER", diet_code: "ST-1", quantity_lbs: 640000, requested_delivery_date: "2026-03-06" }, as: FieldTech, captures: { err_pre: $.data.error_id } }
          trigger:
            - { call: "POST /feed-orders/${o1}/cancel", payload: {}, as: FieldTech }
            - { call: "POST /feed-orders", payload: { group_id: "${group_id}", phase: "STARTER", diet_code: "ST-1", quantity_lbs: 640000, requested_delivery_date: "2026-03-06" }, as: FieldTech, captures: { o2: $.data.id, o2_flag: $.data.over_phase_plan } }
          assert:
            - "Before cancel: 640000-lb order rejected ERR_FEED_BUDGET_EXCEEDED (${err_pre}) (50000 committed + 640000 > 650000)"
            - "After cancel: same 640000-lb order succeeds (O2 ${o2}), over_phase_plan == true (${o2_flag}) (phase plan STARTER 97500 < 640000, advisory only)"
            - "O1 order_status == CANCELLED"

      - name: ticket_approve_threshold_role
        claim_type: conditional_action
        grounds: [ state_machines.MaintenanceTicket, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Approval authority depends on quoted cost: 60000c >= 50000c threshold means FieldTech approve is 403 while IntegratorAdmin approve succeeds — same endpoint, role gated by payload-derived value."
        test_recipe:
          setup: ["contract ACTIVE; barn B1; ticket quoted 60000c WEAR by ft_1"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id } }
            - { call: "POST /maintenance-tickets", payload: { barn_id: "${barn_id}", category: "STRUCTURAL", description: "curtain wall" }, as: Grower, as_user_id: "${grower_id}", captures: { tick: $.data.id } }
            - { call: "POST /maintenance-tickets/${tick}/quote", payload: { cost_cents: 60000, cause: "WEAR" }, as: FieldTech, as_user_id: "ft_1" }
          trigger:
            - { call: "POST /maintenance-tickets/${tick}/approve", payload: {}, as: FieldTech, as_user_id: "ft_2", captures: { err: $.data.error_id } }
            - { call: "POST /maintenance-tickets/${tick}/approve", payload: {}, as: IntegratorAdmin, as_user_id: "adm_1", captures: { t_status: $.data.ticket_status } }
          assert:
            - "FieldTech approve at 60000c -> 403 ERR_FORBIDDEN_ROLE (${err})"
            - "IntegratorAdmin approve succeeds: ticket_status == APPROVED (${t_status}), owner_share_cents == 60000, grower_share_cents == 0"

      - name: mortality_reports_subresource_listing
        claim_type: retrieval
        grounds: [entities.MortalityReport, endpoints]
        distinguishing_aspect: "FK reverse reachability: GET /pig-groups/{id}/mortality-reports returns exactly the group's reports (2 items), not other groups'."
        test_recipe:
          setup: ["two placed groups G1/G2 on barns B1/B2; two reports on G1, one on G2"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
