  - name: lease_vs_bond_annual_payment_diverge_on_identical_principal
    grounds:
    - calculations.financing_payment
    - entities.FinancingFacility.fields.annual_payment_cents
    - entities.FinancingFacility.fields.facility_type
    distinguishing_aspect: 'Identical principal (10000000), rate (5.0%), and term (10y) produce

      annual_payment_cents = 1295046 under LEASE and 1320947 under BOND

      (annuity * 1.02 uplift) — dual-variant divergence on the

      FinancingFacility domain, a different entity domain from

      SavingsReport.

      '
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z. Contract in SCOPED (baseline APPROVED, complete-audit done).
      - 'Two facilities on the contract: F_LEASE and F_BOND, both principal 10000000, rate 5.0, term 10.'
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      - &id027
        call: POST /performance-contracts
        payload:
          facility_name: East Middle
          contract_term_years: 15
          guarantee_start_date: '2026-10-01T00:00:00Z'
          mv_protocol: IPMVP_C
          guaranteed_annual_savings_cents: 1500000
          contract_value_cents: 20000000
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          lb_c_id: $.data.id
      - &id028
        call: POST /performance-contracts/${lb_c_id}/baselines
        payload:
          baseline_period_start: '2025-09-01T00:00:00Z'
          baseline_period_end: '2026-09-01T00:00:00Z'
          annual_energy_kwh: 100000
          rate_schedule:
          - up_to_kwh: null
            cents_per_kwh: 12
          heating_degree_days: 3000
          cooling_degree_days: 1200
          occupancy_factor: 0.5
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          lb_b_id: $.data.id
      - call: POST /performance-contracts/${lb_c_id}/baselines/${lb_b_id}/submit
        payload: {}
        as: ESCOEngineer
        as_user_id: ${eng_id}
      - call: POST /performance-contracts/${lb_c_id}/baselines/${lb_b_id}/approve
        payload: {}
        as: OwnerRep
        as_user_id: ${owner_id}
      - &id029
        call: POST /performance-contracts/${lb_c_id}/bundles
        payload:
          name: Scope
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          lb_bd_id: $.data.id
      - call: POST /performance-contracts/${lb_c_id}/bundles/${lb_bd_id}/measures
        payload:
          measure_type: HVAC
          installed_cost_cents: 1000000
          annual_savings_cents: 500000
        as: ESCOEngineer
        as_user_id: ${eng_id}
      - call: POST /performance-contracts/${lb_c_id}/complete-audit
        payload: {}
        as: ESCOEngineer
        as_user_id: ${eng_id}
      - &id030
        call: POST /performance-contracts/${lb_c_id}/financing-facilities
        payload:
          facility_type: LEASE
          principal_cents: 10000000
          annual_rate_pct: 5.0
          term_years: 10
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          lb_fl_id: $.data.id
      - call: POST /performance-contracts/${lb_c_id}/financing-facilities
        payload:
          facility_type: BOND
          principal_cents: 10000000
          annual_rate_pct: 5.0
          term_years: 10
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          lb_fb_id: $.data.id
      trigger:
      - call: POST /performance-contracts/${lb_c_id}/financing-facilities/${lb_fl_id}/submit
        payload: {}
        as: ESCOEngineer
        as_user_id: ${eng_id}
      - call: POST /performance-contracts/${lb_c_id}/financing-facilities/${lb_fb_id}/submit
        payload: {}
        as: ESCOEngineer
        as_user_id: ${eng_id}
      assert:
      - FinancingFacility.${lb_fl_id}.annual_payment_cents == 1295046
      - FinancingFacility.${lb_fb_id}.annual_payment_cents == 1320947
      - FinancingFacility.${lb_fl_id}.coverage_ratio == 1.1583 and FinancingFacility.${lb_fb_id}.coverage_ratio == 1.1355
      - annual_payment differs across variants despite identical principal, rate, and term
