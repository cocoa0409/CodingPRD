      - name: leachate_scheduling_and_dispatch_depend_on_agreement_state
        grounds:
          - validations[priority=10]
          - state_machines.TreatmentAgreement.ACTIVE_to_SUSPENDED
          - state_machines.TreatmentAgreement.SUSPENDED_to_ACTIVE
          - state_machines.TreatmentAgreement.ACTIVE_to_EXPIRED
          - state_machines.LeachateShipment.SCHEDULED_to_DISPATCHED
        distinguishing_aspect: |
          A shipment's own state is legal for dispatch throughout, yet the operation flips
          between refused and allowed purely with the parent agreement's state, and the
          agreement's terminal EXPIRED state is produced lazily BY the very request it then
          rejects: the create call first evaluates expiry against the logical clock, moves the
          agreement to EXPIRED, and only then returns ERR_AGREEMENT_NOT_ACTIVE. The
          agreement's lazy expiry is also irreversible, so reinstatement afterwards is refused.
        test_recipe:
          setup:
            - "Landfill LF with TreatmentAgreement TA (ACTIVE) whose expires_on is 2026-09-30T00:00:00Z, daily_gallon_cap 20000, concurrent_slot_capacity 2."
            - "Shipment S1 SCHEDULED for [2026-08-01T08:00:00Z, 2026-08-01T10:00:00Z) with 2000 gallons."
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000, daily_load_limit: 200 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id }
            - call: "POST /treatment-agreements"
              payload: { landfill_id: "${lf_id}", facility_name: "Valley POTW", daily_gallon_cap: 20000, concurrent_slot_capacity: 2, base_haul_fee: 350.00, treatment_rate_per_kgal: 62.50, effective_from: "2026-01-01T00:00:00Z", expires_on: "2026-09-30T00:00:00Z" }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { ta_id: $.data.id }
            - call: "POST /leachate-shipments"
              payload: { treatment_agreement_id: "${ta_id}", gallons: 2000, window_start: "2026-08-01T08:00:00Z", window_end: "2026-08-01T10:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { s1_id: $.data.id, s1_state0: $.data.status }
          trigger:
            - call: "POST /treatment-agreements/${ta_id}/suspend"
              payload: { suspension_reason: "POTW pretreatment upset." }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { ta_state1: $.data.status }
            - call: "POST /leachate-shipments/${s1_id}/dispatch"
              payload: { hauler_ref: "TNK-1" }
              as: SiteOperator
              as_user_id: "${lf_id}"
            - call: "POST /leachate-shipments"
              payload: { treatment_agreement_id: "${ta_id}", gallons: 1000, window_start: "2026-08-01T12:00:00Z", window_end: "2026-08-01T14:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
            - call: "POST /treatment-agreements/${ta_id}/reinstate"
              payload: {}
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { ta_state2: $.data.status }
            - call: "POST /leachate-shipments/${s1_id}/dispatch"
              payload: { hauler_ref: "TNK-1" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { s1_state1: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /leachate-shipments"
              payload: { treatment_agreement_id: "${ta_id}", gallons: 1000, window_start: "2026-10-01T12:00:00Z", window_end: "2026-10-01T14:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
            - call: "POST /treatment-agreements/${ta_id}/reinstate"
              payload: {}
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
          assert:
            - "${s1_state0} == 'SCHEDULED' and ${ta_state1} == 'SUSPENDED'"
            - "the first dispatch returns ERR_AGREEMENT_NOT_ACTIVE with HTTP 409 although S1 is in the correct SCHEDULED state"
            - "the create attempt during suspension also returns ERR_AGREEMENT_NOT_ACTIVE with HTTP 409 and creates no row"
            - "${ta_state2} == 'ACTIVE' with suspension_reason back to null"
            - "${s1_state1} == 'DISPATCHED' — the shipment never changed, only its parent did"
            - "TreatmentAgreement.${ta_id}.scheduled_gallons_today == 2000 while the clock is on 2026-08-01, since DISPATCHED still occupies its slot and gallons"
            - "after the clock moves past expires_on the create attempt returns ERR_AGREEMENT_NOT_ACTIVE with HTTP 409, and TreatmentAgreement.${ta_id}.status == 'EXPIRED' — the rejected request itself performed the lazy transition"
            - "the final reinstate returns ERR_INVALID_STATE_TRANSITION with HTTP 409, because EXPIRED is terminal"
            - "LeachateShipment.${s1_id}.status is still 'DISPATCHED' and no shipment row was created by either refused create"

