  # ------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: section_seat_conservation_across_roster_and_withdraw
        grounds:
          - entities.CourseSection.fields.enrolled_count
          - entities.CourseSection.fields.seats_available
          - state_machines.CourseSection.OPEN_to_LOCKED
          - state_machines.CourseSection.LOCKED_to_OPEN
        distinguishing_aspect: |
          Conserved quantity = seats: capacity == enrolled_count + seats_available
          must hold after the forward action (roster add: 1+0=1, LOCKED) and
          after its compensating action (withdrawal: 0+1=1, back to OPEN) —
          forward + compensation leaves the global seat count unchanged.
        test_recipe:
          setup:
            - "Term IN_SESSION? No: section OPEN in ENROLLMENT_OPEN term, clock before add_drop_end; section S cap 1 forecast 1"
            - "Enrollment E REGISTERED; S rostered (LOCKED)"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { code: "BS-CS", title: "CS", total_credits_required: 120, licensure_flag: false }
              as: RegistrarAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /api/programs/${prog_id}/state-authorizations"
              payload: { state_code: "CO", authorization_status: "AUTHORIZED", effective_from: "2026-01-01" }
              as: ComplianceOfficer
            - call: "POST /api/terms"
              payload: { name: "2026 Fall A", start_date: "2026-10-05", add_drop_end_date: "2026-10-12", census_date: "2026-10-19", end_date: "2026-12-13" }
              as: RegistrarAdmin
              captures: { term_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/terms/${term_id}/advance"
              payload: { to_state: "ENROLLMENT_OPEN" }
              as: RegistrarAdmin
            - call: "POST /api/terms/${term_id}/sections"
              payload: { course_code: "CS-101", capacity: 1, forecast_enrollment: 1 }
              as: RegistrarAdmin
              captures: { sec_id: "$.data.id" }
            - call: "POST /api/sections/${sec_id}/advance"
              payload: { to_state: "STAFFED" }
              as: RegistrarAdmin
            - call: "POST /api/sections/${sec_id}/advance"
              payload: { to_state: "OPEN" }
              as: RegistrarAdmin
            - call: "POST /api/staff"
              payload: { full_name: "Ann Advisor", email: "adv@x.com", staff_type: "ADVISOR", caseload_cap: 5 }
              as: SystemAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /api/applicants"
              payload: { full_name: "Pat Prospect", email: "p@x.com", state_code: "CO" }
              as: RegistrarAdmin
              captures: { ap_id: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap_id}", term_id: "${term_id}", program_id: "${prog_id}" }
              as: Applicant
              as_user_id: "${ap_id}"
              captures: { appl_id: "$.data.id" }
            - call: "POST /api/applications/${appl_id}/decision"
              payload: { decision: "ADMIT" }
              as: RegistrarAdmin
              captures: { appl_v: "$.data.version" }
            - call: "POST /api/applications/${appl_id}/transfer-credit-evaluations"
              payload: { accepted_credits: 0, in_progress_credits: 0 }
              as: RegistrarAdmin
              captures: { tce_id: "$.data.id" }
            - call: "POST /api/transfer-credit-evaluations/${tce_id}/advance"
              payload: { to_state: "IN_REVIEW" }
              as: RegistrarAdmin
            - call: "POST /api/transfer-credit-evaluations/${tce_id}/advance"
              payload: { to_state: "COMPLETED" }
              as: RegistrarAdmin
            - call: "POST /api/enrollments"
              payload: { application_id: "${appl_id}", advisor_id: "${adv_id}", enrollment_intensity: "FULL_TIME", tuition_cents: 500000, expected_application_version: "${appl_v}" }
              as: RegistrarAdmin
              captures: { enr_id: "$.data.id" }
          trigger:
            - call: "POST /api/sections/${sec_id}/roster"
              payload: { enrollment_id: "${enr_id}" }
              as: RegistrarAdmin
              captures: { s_after_add: "$.data.status" }
            - call: "POST /api/enrollments/${enr_id}/withdraw"
              payload: { withdrawal_date: "2026-09-10" }
              as: RegistrarAdmin
            - call: "GET /api/terms/${term_id}/sections"
              payload: {}
              as: RegistrarAdmin
              captures: { s_after_wd: "$.data[0].status", s_seats: "$.data[0].seats_available", s_enrolled: "$.data[0].enrolled_count" }
          assert:
            - "after roster: enrolled_count == 1, seats_available == 0, status == LOCKED (1 + 0 == capacity 1)"
            - "after withdrawal: enrolled_count == 0, seats_available == 1, status == OPEN (0 + 1 == capacity 1)"
            - "second roster add of a different enrollment succeeds again after reopen"

