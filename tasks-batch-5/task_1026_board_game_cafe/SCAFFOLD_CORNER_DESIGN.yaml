      - name: duplicate_registration_returns_duplicate
        claim_type: Violation to Error
        grounds: ["validations[priority=13]", "errors[ERR_DUPLICATE_REGISTRATION]"]
        distinguishing_aspect: "Registering the same member twice for one OPEN tournament returns ERR_DUPLICATE_REGISTRATION on the second."
        test_recipe:
          setup: ["OPEN tournament with one REGISTERED entry for member m."]
          setup_api_calls:
            - call: "POST /tournaments"
              payload: { name: "Dup Cup", game_title: "Pandemic", format: "CASUAL", capacity: 8, entry_fee_cents: 0, start_at: "2026-07-15T18:00:00Z" }
              as: Manager
              captures: { trn: $.data.id }
            - call: "POST /tournaments/${trn}/open"
              payload: {}
              as: Manager
            - call: "POST /memberships"
              payload: { email: "dupreg@x.com", full_name: "DupReg" }
              as: Staff
              captures: { m: $.data.id }
            - call: "POST /registrations"
              payload: { tournament_id: "${trn}", membership_id: "${m}" }
              as: Staff
          trigger:
            - call: "POST /registrations"
              payload: { tournament_id: "${trn}", membership_id: "${m}" }
              as: Staff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_REGISTRATION and http_status == 409"

      - name: register_scheduled_tournament_returns_not_open
        claim_type: Violation to Error
        grounds: ["validations[priority=12]", "errors[ERR_TOURNAMENT_NOT_OPEN]"]
        distinguishing_aspect: "Registering for a SCHEDULED (never opened) tournament returns ERR_TOURNAMENT_NOT_OPEN."
        test_recipe:
          setup: ["A SCHEDULED tournament exists (not opened)."]
          setup_api_calls:
            - call: "POST /tournaments"
              payload: { name: "Not Open", game_title: "Go", format: "CASUAL", capacity: 8, entry_fee_cents: 0, start_at: "2026-07-15T18:00:00Z" }
              as: Manager
              captures: { trn: $.data.id }
            - call: "POST /memberships"
              payload: { email: "no@x.com", full_name: "No" }
              as: Staff
              captures: { m: $.data.id }
          trigger:
            - call: "POST /registrations"
              payload: { tournament_id: "${trn}", membership_id: "${m}" }
              as: Staff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TOURNAMENT_NOT_OPEN and http_status == 409"

      - name: hold_out_of_service_room_returns_room_unavailable
        claim_type: Violation to Error
        grounds: ["validations[priority=16]", "errors[ERR_ROOM_UNAVAILABLE]", entities.Room.fields.status]
        distinguishing_aspect: "Holding an OUT_OF_SERVICE room returns ERR_ROOM_UNAVAILABLE (checked before the OCC version)."
        test_recipe:
          setup: ["A room set OUT_OF_SERVICE via PATCH (version now 2)."]
          setup_api_calls:
            - call: "POST /rooms"
              payload: { name: "Closed Room", capacity: 10, hourly_rate_cents: 5000 }
              as: Manager
              captures: { room: $.data.id }
            - call: "PATCH /rooms/${room}"
              payload: { status: "OUT_OF_SERVICE" }
              as: Manager
            - call: "GET /rooms/${room}"
              payload: {}
              as: Staff
              captures: { rv: $.data.version }
          trigger:
            - call: "POST /private-bookings"
              payload: { room_id: "${room}", start_at: "2026-07-09T18:00:00Z", end_at: "2026-07-09T20:00:00Z", headcount: 4, expected_room_version: "${rv}" }
              as: Staff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ROOM_UNAVAILABLE and http_status == 409"

      - name: cancel_booked_within_cutoff_returns_too_late
        claim_type: Temporal validation
        grounds: ["validations[priority=17]", "errors[ERR_CANCEL_TOO_LATE]", state_machines.Reservation.transitions.BOOKED_to_CANCELLED]
        distinguishing_aspect: "Cancelling a still-BOOKED reservation inside the 120-min cutoff returns ERR_CANCEL_TOO_LATE (only the temporal rule fails; state is valid)."
        test_recipe:
          setup: ["Reservation BOOKED (start 2026-07-05T12:00:00Z); clock 2026-07-05T11:00:00Z (inside cutoff)."]
          setup_api_calls:
            - call: "POST /tables"
              payload: { label: "C12", seats: 4, half_hour_rate_cents: 0, day_pass_cents: 0, cover_fee_cents: 0, min_spend_cents: 0 }
              as: Manager
              captures: { t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T09:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { table_id: "${t}", party_size: 2, start_at: "2026-07-05T12:00:00Z", end_at: "2026-07-05T14:00:00Z" }
              as: Staff
              captures: { resv: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T11:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /reservations/${resv}/cancel"
              payload: {}
              as: Staff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CANCEL_TOO_LATE and http_status == 409  # BOOKED so state is valid; only temporal fails"

      - name: redeem_more_than_balance_returns_insufficient
        claim_type: Violation to Error
        grounds: ["validations[priority=18]", "errors[ERR_INSUFFICIENT_POINTS]"]
        distinguishing_aspect: "An ACTIVE member with balance 50 redeeming 100 returns ERR_INSUFFICIENT_POINTS (fiscal, no constraint conflict)."
        test_recipe:
          setup: ["ACTIVE member with points_balance 50."]
          setup_api_calls:
            - call: "POST /memberships"
              payload: { email: "poor@x.com", full_name: "Poor" }
              as: Staff
              captures: { m: $.data.id }
            - call: "POST /memberships/${m}/loyalty-adjustments"
