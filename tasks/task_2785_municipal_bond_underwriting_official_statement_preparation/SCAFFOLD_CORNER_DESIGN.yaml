            - "second call: HTTP 200, review_status == APPROVED, authored_by_user_id == 'bc_drafter' and approved_by_user_id == 'bc_reviewer'"

      - name: the_rating_analyst_cannot_read_the_order_book
        claim_type: shared_operations
        grounds:
          - roles[RatingAnalyst].shared_operations "every GET listed in section 1.5 except the order endpoints"
          - endpoints[GET /bond-offerings/order-periods/{id}/orders] roles
        distinguishing_aspect: |
          The analyst's read grant is broad but carved out: it covers every other GET yet stops at
          the order book, so the SAME analyst who can read the deal, the tranches and the order
          PERIOD is refused the orders collection with ERR_UNAUTHORIZED. An implementation that
          grants RatingAnalyst blanket read access passes the first three calls and fails the
          fourth.
