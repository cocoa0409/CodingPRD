        claim_type: Side Effect Execution
        grounds: [state_machines.ThroughputWindow, entities.Stand.fields.consecutive_breach_windows]
        excluded_because:
          difficulty_instance: "dual_variant_calc / throughput_provisional_projection_diverges_from_final_served_count"
          rationale: "BREACH increments the counter (asserted == 1); the PASS reset is asserted == 0 in window_close_at_exact_target_count_passes."
