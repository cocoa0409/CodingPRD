      - name: counter_voiding_preserves_votes_cast_total_identity
        grounds:
          - calculations.vote_ledger_reconciliation
          - state_machines.CommitteeVote.ACTIVE_to_VOIDED
          - entities.CompensationOffer.fields.votes_cast_total
          - entities.CompensationOffer.fields.active_vote_count
          - entities.CompensationOffer.fields.voided_vote_count
        distinguishing_aspect: |
          Conserved quantity = the VOTE LEDGER IDENTITY votes_cast_total == active_vote_count
          + voided_vote_count, a monotone AUDIT counter rather than a restorable balance —
          and that is exactly what makes it the opposite of the guarantee ledger. The counter
          voids both round-1 ballots, so active drops 2 -> 0 and voided rises 0 -> 2 while
          votes_cast_total must NOT move; three fresh round-2 ballots then take the triple to
          (5, 3, 2). An implementation that decrements votes_cast_total on void, or that
          rebuilds it from the ACTIVE rows, loses the fact that five ballots were ever cast
          while still looking self-consistent.
        test_recipe:
          setup:
            - "One OPEN PracticeGroup with guarantee_budget_total_usd 5000000.00."
            - "One Candidate in DILIGENCE with clearance_status CLEARED and the SLIM BOOK assessed."
            - "One CompensationOffer (guaranteed 500000.00 + signing 50000.00) in COMMITTEE_REVIEW with eligible_voter_count 3 and two ACTIVE APPROVE votes in round 1."
