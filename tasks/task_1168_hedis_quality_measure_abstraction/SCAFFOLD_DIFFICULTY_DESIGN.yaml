  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: submit_gated_on_season_open
        grounds:
          - state_machines.MeasureRun.RATE_COMPUTED_to_SUBMITTED
          - validations[priority=7]
          - errors[ERR_SEASON_NOT_OPEN]
        distinguishing_aspect: |
          Entity pair MeasureRun x MeasurementSeason: submit is legal only while the run's
          season is OPEN; the same RATE_COMPUTED run is rejected in a DRAFT season and accepted
          after the season opens.
        test_recipe:
          setup:
            - "Season MY2025 in DRAFT (never opened), default clock 2026-05-01 (before deadline 2026-06-15); spec CBP activated while season DRAFT (activation allows DRAFT|OPEN)"
            - "Member M01 enrolled all 2025; run POPULATED then RATE_COMPUTED (admin_rate 0.0)"
          setup_api_calls:
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: ["LAB_FEED"] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "CBP", version_label: "2025.1", collection_method: "ADMINISTRATIVE", age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_id: $.data.id }
            - { call: "POST /hedis/measure-specifications/${spec_id}/activate", as: QualityAdmin }
            - { call: "POST /hedis/members", payload: { member_ref: "M01", birth_date: "1990-01-01T00:00:00Z", gender: "M" }, as: QualityAdmin, captures: { m1: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_id}" }, as: QualityAnalyst, as_user_id: "qa-1", captures: { run_id: $.data.id } }
            - { call: "POST /hedis/measure-runs/${run_id}/identify-population", as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "GET /hedis/measure-runs/${run_id}", as: QualityAnalyst, captures: { v1: $.data.version } }
            - { call: "POST /hedis/measure-runs/${run_id}/compute-rate", payload: { expected_measure_run_version: "${v1}" }, as: QualityAnalyst, as_user_id: "qa-1", captures: { st_pre: $.data.reporting_status } }
          trigger:
            - { call: "POST /hedis/measure-runs/${run_id}/submit", as: QualityAnalyst, as_user_id: "qa-1", captures: { e1: $.data.error_id } }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin }
            - { call: "POST /hedis/measure-runs/${run_id}/submit", as: QualityAnalyst, as_user_id: "qa-1", captures: { st_post: $.data.reporting_status, sub_by: $.data.submitted_by_user_id } }
          assert:
            - "st_pre == 'RATE_COMPUTED'"
            - "e1 == 'ERR_SEASON_NOT_OPEN' — the run's own state is fine; the SEASON's DRAFT state blocks the transition"
            - "st_post == 'SUBMITTED' and sub_by == 'qa-1' — the identical request succeeds once the season is OPEN"

      - name: abstraction_gated_on_chase_received
        grounds:
          - state_machines.ChartChase.REQUESTED_to_RECEIVED
          - state_machines.Abstraction
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair Abstraction x ChartChase (different from the sibling's
          MeasureRun x MeasurementSeason): abstraction creation requires the chase to be
          RECEIVED; a chase still REQUESTED rejects with ERR_INVALID_STATE while the RECEIVED
          chase accepts.
        test_recipe:
          setup:
            - "Season MY2025 OPEN, clock 2026-03-01; ACTIVE HYBRID spec BCS floor 2; members M001/M002 (F, P1) enrolled all 2025; run POPULATED, sample drawn 2"
            - "Chase C1 (M001) still REQUESTED; chase C2 (M002) RECEIVED"
          setup_api_calls:
            - { call: "POST /hedis/_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: QualityAdmin }
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: ["LAB_FEED"] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "BCS", version_label: "2025.1", collection_method: "HYBRID", hybrid_policy: "SAMPLE_ONLY", sample_size_floor: 2, age_min: 50, age_max: 74, gender_requirement: "F", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_id: $.data.id }
            - { call: "POST /hedis/measure-specifications/${spec_id}/activate", as: QualityAdmin }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin }
            - { call: "POST /hedis/providers", payload: { provider_ref: "P1", name: "Provider One" }, as: QualityAdmin }
            - { call: "POST /hedis/members", payload: { member_ref: "M001", birth_date: "1960-01-01T00:00:00Z", gender: "F", attributed_provider_ref: "P1" }, as: QualityAdmin, captures: { m1: $.data.id } }
            - { call: "POST /hedis/members", payload: { member_ref: "M002", birth_date: "1960-01-01T00:00:00Z", gender: "F", attributed_provider_ref: "P1" }, as: QualityAdmin, captures: { m2: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m2}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_id}" }, as: QualityAnalyst, captures: { run_id: $.data.id } }
            - { call: "POST /hedis/measure-runs/${run_id}/identify-population", as: QualityAnalyst }
            - { call: "POST /hedis/samples", payload: { run_id: "${run_id}" }, as: QualityAnalyst, captures: { smp: $.data.id } }
            - { call: "GET /hedis/samples/${smp}/chart-chases", as: QualityAnalyst, captures: { c1: "$.data[0].id", c2: "$.data[1].id" } }
            - { call: "POST /hedis/chart-chases/${c2}/receive", as: QualityAnalyst }
          trigger:
            - { call: "POST /hedis/abstractions", payload: { chase_id: "${c1}", result: "HIT" }, as: Abstractor, as_user_id: "abs-1", captures: { e1: $.data.error_id } }
            - { call: "POST /hedis/abstractions", payload: { chase_id: "${c2}", result: "HIT" }, as: Abstractor, as_user_id: "abs-1", captures: { a2: $.data.id, a2_st: $.data.status, a2_abs: $.data.abstractor_user_id } }
          assert:
            - "e1 == 'ERR_INVALID_STATE' — chase C1 is REQUESTED, not RECEIVED"
            - "a2_st == 'DRAFT' and a2_abs == 'abs-1' — the RECEIVED chase accepts the abstraction and stamps the abstractor"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: auditor_engagement_halfopen_adjacency
        grounds:
          - validations[priority=10.2]
          - errors[ERR_AUDITOR_WINDOW_OVERLAP]
          - entities.AuditEngagement.fields.window_start
          - entities.AuditEngagement.fields.window_end
        distinguishing_aspect: |
          HALF-OPEN interval semantics on the auditor_user_id resource: an engagement whose
          window_start equals another engagement's window_end is ADJACENT, not overlapping, and
          is accepted; a strictly interior window overlaps and is rejected; the same window
          under a different auditor is accepted. Interval semantics differ from the sibling's
          closed enrollment segments.
        test_recipe:
          setup:
            - "Season MY2025 (DRAFT is fine), default clock; one LOADED spec CBP and one run (run creation has no spec-state precondition) to satisfy the engagement FK"
          setup_api_calls:
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: ["LAB_FEED"] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "CBP", version_label: "2025.1", collection_method: "ADMINISTRATIVE", age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_id: $.data.id }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_id}" }, as: QualityAnalyst, captures: { run_id: $.data.id } }
          trigger:
            - { call: "POST /hedis/audit-engagements", payload: { season_id: "${season_id}", measure_run_id: "${run_id}", auditor_user_id: "aud-1", window_start: "2026-04-01T00:00:00Z", window_end: "2026-05-01T00:00:00Z" }, as: Auditor, captures: { e1: $.data.id, e1_st: $.data.status } }
            - { call: "POST /hedis/audit-engagements", payload: { season_id: "${season_id}", measure_run_id: "${run_id}", auditor_user_id: "aud-1", window_start: "2026-05-01T00:00:00Z", window_end: "2026-06-01T00:00:00Z" }, as: Auditor, captures: { e2: $.data.id } }
            - { call: "POST /hedis/audit-engagements", payload: { season_id: "${season_id}", measure_run_id: "${run_id}", auditor_user_id: "aud-1", window_start: "2026-04-15T00:00:00Z", window_end: "2026-04-20T00:00:00Z" }, as: Auditor, captures: { err: $.data.error_id } }
            - { call: "POST /hedis/audit-engagements", payload: { season_id: "${season_id}", measure_run_id: "${run_id}", auditor_user_id: "aud-2", window_start: "2026-04-01T00:00:00Z", window_end: "2026-05-01T00:00:00Z" }, as: Auditor, captures: { e4: $.data.id } }
          assert:
            - "e1_st == 'SCHEDULED'"
            - "e2 is created — window_start == prior window_end is adjacency, and half-open [start, end) intervals do not overlap at the touching instant"
            - "err == 'ERR_AUDITOR_WINDOW_OVERLAP' — [2026-04-15, 2026-04-20) lies strictly inside aud-1's [2026-04-01, 2026-05-01)"
            - "e4 is created — the overlap resource is auditor_user_id, so aud-2 may hold the identical window"

      - name: enrollment_segment_closed_touch_overlap
        grounds:
          - validations[priority=10.1]
          - errors[ERR_ENROLLMENT_OVERLAP]
          - entities.MemberEnrollmentSegment.fields.span_start
          - entities.MemberEnrollmentSegment.fields.span_end
        distinguishing_aspect: |
          CLOSED-interval semantics on the member resource (different interval semantics and
          different resource entity than the sibling's half-open auditor windows): two segments
          that merely TOUCH at an endpoint (prior span_end == new span_start) DO overlap,
          because both endpoints are inclusive.
        test_recipe:
          setup:
            - "Member M1 registered (no season or run needed — segment validation is member-scoped)"
          setup_api_calls:
            - { call: "POST /hedis/members", payload: { member_ref: "M1", birth_date: "1990-01-01T00:00:00Z", gender: "F" }, as: QualityAdmin, captures: { m1: $.data.id } }
          trigger:
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-06-30T00:00:00Z" }, as: QualityAdmin, captures: { s1: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-07-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin, captures: { s2: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-06-30T00:00:00Z", span_end: "2025-08-01T00:00:00Z" }, as: QualityAdmin, captures: { err: $.data.error_id } }
          assert:
            - "s1 and s2 are created — [2025-01-01, 2025-06-30] and [2025-07-01, 2025-12-31] share no day under closed semantics"
            - "err == 'ERR_ENROLLMENT_OVERLAP' — the new segment's span_start 2025-06-30 equals s1's inclusive span_end, so the closed intervals share that day"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: submit_retract_numerator_conservation
        grounds:
          - state_machines.Abstraction.DRAFT_to_SUBMITTED
          - state_machines.Abstraction.SUBMITTED_to_DRAFT
          - calculations.rate_determination
          - entities.MeasureRun.fields.sample_numerator_count
        distinguishing_aspect: |
          Conserved quantity: the sample numerator tally. Invariant pinned as
          sample_numerator_count == count(abstractions of the run's sample with result == HIT
          and status IN {SUBMITTED, CONFIRMED, OVERREAD_PASSED}); the submit-then-retract pair
          must leave it unchanged, and the chase compensation (ABSTRACTED -> RECEIVED) must
          restore the pre-submit chase state.
        test_recipe:
          setup:
            - "Season MY2025 OPEN, clock 2026-03-01; ACTIVE HYBRID spec BCS floor 2 SAMPLE_ONLY; members M001/M002 (F, P1) enrolled all 2025; run POPULATED; sample drawn 2; both chases RECEIVED"
            - "a1 = abstraction(C1, HIT) created by abs-1, still DRAFT; run.sample_numerator_count == 0 before any submit"
          setup_api_calls:
            - { call: "POST /hedis/_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: QualityAdmin }
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: ["LAB_FEED"] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "BCS", version_label: "2025.1", collection_method: "HYBRID", hybrid_policy: "SAMPLE_ONLY", sample_size_floor: 2, age_min: 50, age_max: 74, gender_requirement: "F", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_id: $.data.id }
            - { call: "POST /hedis/measure-specifications/${spec_id}/activate", as: QualityAdmin }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin }
            - { call: "POST /hedis/providers", payload: { provider_ref: "P1", name: "Provider One" }, as: QualityAdmin }
            - { call: "POST /hedis/members", payload: { member_ref: "M001", birth_date: "1960-01-01T00:00:00Z", gender: "F", attributed_provider_ref: "P1" }, as: QualityAdmin, captures: { m1: $.data.id } }
            - { call: "POST /hedis/members", payload: { member_ref: "M002", birth_date: "1960-01-01T00:00:00Z", gender: "F", attributed_provider_ref: "P1" }, as: QualityAdmin, captures: { m2: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m2}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_id}" }, as: QualityAnalyst, captures: { run_id: $.data.id } }
            - { call: "POST /hedis/measure-runs/${run_id}/identify-population", as: QualityAnalyst }
            - { call: "POST /hedis/samples", payload: { run_id: "${run_id}" }, as: QualityAnalyst, captures: { smp: $.data.id } }
            - { call: "GET /hedis/samples/${smp}/chart-chases", as: QualityAnalyst, captures: { c1: "$.data[0].id", c2: "$.data[1].id" } }
            - { call: "POST /hedis/chart-chases/${c1}/receive", as: QualityAnalyst }
            - { call: "POST /hedis/chart-chases/${c2}/receive", as: QualityAnalyst }
            - { call: "POST /hedis/abstractions", payload: { chase_id: "${c1}", result: "HIT" }, as: Abstractor, as_user_id: "abs-1", captures: { a1: $.data.id } }
            - { call: "GET /hedis/measure-runs/${run_id}", as: QualityAnalyst, captures: { sn_pre: $.data.sample_numerator_count } }
          trigger:
            - { call: "POST /hedis/abstractions/${a1}/submit", as: Abstractor, as_user_id: "abs-1" }
            - { call: "GET /hedis/measure-runs/${run_id}", as: QualityAnalyst, captures: { sn_post_submit: $.data.sample_numerator_count } }
            - { call: "GET /hedis/chart-chases/${c1}", as: QualityAnalyst, captures: { cst_mid: $.data.status } }
            - { call: "POST /hedis/abstractions/${a1}/retract", as: Abstractor, as_user_id: "abs-1" }
            - { call: "GET /hedis/measure-runs/${run_id}", as: QualityAnalyst, captures: { sn_post_retract: $.data.sample_numerator_count } }
            - { call: "GET /hedis/chart-chases/${c1}", as: QualityAnalyst, captures: { cst_post: $.data.status } }
          assert:
            - "sn_pre == 0"
            - "sn_post_submit == 1 — the HIT abstraction in SUBMITTED joins the counted set {SUBMITTED, CONFIRMED, OVERREAD_PASSED}"
            - "cst_mid == 'ABSTRACTED' — submit cascaded to the chase"
            - "sn_post_retract == 0 — the submit/retract pair leaves sample_numerator_count unchanged (compensating invariant holds, no drift)"
            - "cst_post == 'RECEIVED' — the chase compensation restores the pre-submit state"

      - name: withdraw_rechase_chase_coverage_conservation
        grounds:
          - state_machines.ChartChase.REQUESTED_to_WITHDRAWN
          - state_machines.ChartChase.WITHDRAWN_to_REQUESTED
          - entities.Sample.fields.drawn_size
          - entities.ChartChase.fields.chase_round
        distinguishing_aspect: |
          Conserved quantity: chase coverage cardinality — a DIFFERENT conserved quantity than
          the sibling's numerator tally. Invariant pinned as count(ChartChase rows of sample S)
          == Sample.drawn_size with exactly one chase row per sampled member_ref; withdraw and
          rechase mutate status and chase_round but never create or destroy coverage rows.
        test_recipe:
          setup:
            - "Season MY2025 OPEN, clock 2026-03-01; ACTIVE HYBRID spec BCS floor 3 SAMPLE_ONLY; members M1/M2/M3 (F, P1) enrolled all 2025; run POPULATED (denominator 3); sample drawn 3 with chases C1(M1)/C2(M2)/C3(M3)"
          setup_api_calls:
            - { call: "POST /hedis/_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: QualityAdmin }
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: ["LAB_FEED"] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "BCS", version_label: "2025.1", collection_method: "HYBRID", hybrid_policy: "SAMPLE_ONLY", sample_size_floor: 3, age_min: 50, age_max: 74, gender_requirement: "F", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_id: $.data.id }
            - { call: "POST /hedis/measure-specifications/${spec_id}/activate", as: QualityAdmin }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin }
            - { call: "POST /hedis/providers", payload: { provider_ref: "P1", name: "Provider One" }, as: QualityAdmin }
            - { call: "POST /hedis/members", payload: { member_ref: "M1", birth_date: "1960-01-01T00:00:00Z", gender: "F", attributed_provider_ref: "P1" }, as: QualityAdmin, captures: { m1: $.data.id } }
            - { call: "POST /hedis/members", payload: { member_ref: "M2", birth_date: "1960-01-01T00:00:00Z", gender: "F", attributed_provider_ref: "P1" }, as: QualityAdmin, captures: { m2: $.data.id } }
            - { call: "POST /hedis/members", payload: { member_ref: "M3", birth_date: "1960-01-01T00:00:00Z", gender: "F", attributed_provider_ref: "P1" }, as: QualityAdmin, captures: { m3: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m2}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m3}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_id}" }, as: QualityAnalyst, captures: { run_id: $.data.id } }
            - { call: "POST /hedis/measure-runs/${run_id}/identify-population", as: QualityAnalyst }
            - { call: "POST /hedis/samples", payload: { run_id: "${run_id}" }, as: QualityAnalyst, captures: { smp: $.data.id, drawn: $.data.drawn_size } }
            - { call: "GET /hedis/samples/${smp}/chart-chases", as: QualityAnalyst, captures: { c1: "$.data[0].id", c1m: "$.data[0].member_ref" } }
          trigger:
            - { call: "POST /hedis/chart-chases/${c1}/withdraw", as: QualityAnalyst, captures: { st_w: $.data.status } }
            - { call: "GET /hedis/samples/${smp}/chart-chases", as: QualityAnalyst, captures: { w0: "$.data[0].member_ref", w1: "$.data[1].member_ref", w2: "$.data[2].member_ref", ws0: "$.data[0].status" } }
            - { call: "POST /hedis/chart-chases/${c1}/rechase", as: QualityAnalyst, captures: { st_r: $.data.status, rd_r: $.data.chase_round } }
            - { call: "GET /hedis/samples/${smp}/chart-chases", as: QualityAnalyst, captures: { f0: "$.data[0].member_ref", f1: "$.data[1].member_ref", f2: "$.data[2].member_ref" } }
          assert:
            - "drawn == 3 and c1m == 'M1'"
            - "st_w == 'WITHDRAWN' and ws0 == 'WITHDRAWN'"
            - "w0 == 'M1' and w1 == 'M2' and w2 == 'M3' — mid-compensation the sample still holds exactly 3 chase rows, one per sampled member (withdraw does not destroy coverage)"
            - "st_r == 'REQUESTED' and rd_r == 2"
            - "f0 == 'M1' and f1 == 'M2' and f2 == 'M3' — the withdraw/rechase pair restores live coverage with count(chases) == drawn_size == 3 and chase_round incremented by exactly 1"
