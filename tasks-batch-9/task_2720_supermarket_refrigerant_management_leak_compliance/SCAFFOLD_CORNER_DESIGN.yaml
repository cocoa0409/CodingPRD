      - name: leak_rate_rounds_half_up_to_one_decimal_on_a_repeating_quotient
        claim_type: precision
        grounds:
          - calculations.system_leak_rate_pct.precision
          - entities.ServiceRecord.fields.leak_rate_pct_after
        distinguishing_aspect: "15.0 lbs on a 90.0 lb nameplate is 16.666...percent, which must be reported as 16.7 (half-up at one decimal) on both the system and the record - truncation would give 16.6 and two-decimal output would give 16.67, and neither reaches the 20.0 threshold so no event may open."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, R-404A, SYS1 (full 90.0, initial 60.0), T1, EQ1, CYL1 (nominal 50.0, initial 40.0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
