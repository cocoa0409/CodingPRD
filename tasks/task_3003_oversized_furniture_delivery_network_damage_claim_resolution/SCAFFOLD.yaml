# =============================================================================
# Task 3003 — Oversized Furniture Delivery Network & Damage Claim Resolution
# Scaffold (§1.0–§1.7). Difficulty design and corner design live in the two
# sibling files, per the scaffold-generator skill.
# =============================================================================

scenario: |
  Oversized Furniture Delivery Network & Damage Claim Resolution (Wayfair):
  item cubing and freight-class assignment at listing time, routing between
  parcel, LTL and owned final-mile hub based on dimension and destination,
  appointment scheduling windows with room-of-choice versus threshold service
  levels, damage inspection at hub with repair, replacement-part or
  full-replacement determination, supplier chargeback allocation for concealed
  damage versus carrier liability, oversize return authorization economics
  where disposal beats reverse haul, promised-date recalculation when a hub
  misses a linehaul, supplier drop-ship compliance scoring and lead-time
  accuracy. Generated at a difficulty much harder than expert level.

domain_name: oversize-freight-network
api_prefix: /oversize-freight

complexity_profile:
  primary_archetype: Workflow orchestration
  secondary_archetype: Ledger reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - selector_policy
    - scheduled_actions
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: supplier_code, type: string, source: input, description: "Unique supplier code, e.g. SUP-1001", constraints: "unique per supplier" }
      - { name: legal_name, type: string, source: input, description: "Supplier legal name" }
      - { name: drop_ship_enabled, type: boolean, source: input, description: "Whether this supplier may fulfill drop-ship orders directly" }
      - { name: lead_time_days, type: integer, source: input, default: 3, description: "Promised drop-ship handling days; promised_ship_date = order creation date + lead_time_days" }
      - { name: compliance_score, type: number, source: computed, default: 100.00, description: "Weighted compliance score per calculations.supplier_compliance_score (rolling-window variant is the stored field)" }
      - { name: on_time_ship_rate, type: number, source: computed, default: 100.00, description: "Percentage (2dp) of the supplier's 5 most recently closed (DELIVERED) drop-ship shipments with actual_ship_date <= promised_ship_date, window ordered by delivered_at DESC then created_at ASC; 100.00 when no closed shipments exist" }
      - { name: chargeback_rate, type: number, source: computed, default: 0.00, description: "Percentage (2dp): SETTLED Chargebacks attributed to this supplier / Shipments fulfilled by this supplier with current_state != EXCEPTION; 0.00 when denominator is 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE → PROBATION → SUSPENDED, and PROBATION → ACTIVE recovery (auto-transitions on compliance_score per rate_threshold_triggers)" }

  - name: Item
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; fulfilling supplier" }
      - { name: sku, type: string, source: input, description: "Catalog SKU", constraints: "unique" }
      - { name: dim_length_in, type: number, source: input, description: "Longest packaged dimension in inches, > 0" }
      - { name: dim_width_in, type: number, source: input, description: "Second packaged dimension in inches, > 0" }
      - { name: dim_height_in, type: number, source: input, description: "Third packaged dimension in inches, > 0" }
      - { name: weight_lb, type: number, source: input, description: "Packaged weight in pounds, > 0" }
      - { name: declared_value_cents, type: integer, source: input, description: "Retail declared value in cents; basis for damage and return economics" }
      - { name: white_glove_eligible, type: boolean, source: input, description: "Whether the item may be sold with ROOM_OF_CHOICE service" }
      - { name: cube_score, type: number, source: computed, description: "calculations.item_cube_score, 2dp round_half_up; drives freight_class" }
      - { name: freight_class, type: enum, source: computed, description: "PARCEL_ELIGIBLE | LTL_250 | LTL_150 | LTL_125 | LTL_92_5 — derived from cube_score per calculations.freight_class_assignment" }
      - { name: declared_girth_in, type: integer, source: computed, description: "calculations.declared_value_cube_check — ceil PER DIMENSION, then combined: ceil(L) + 2*(ceil(W) + ceil(H))" }
      - { name: parcel_ok, type: boolean, source: computed, description: "declared_girth_in <= 165 (carrier parcel gate); advisory input to routing branch 1" }
      - { name: status, type: enum, source: system, description: "LISTED → DELISTED" }

  - name: Hub
    parent: null
    common_fields: true
    fields:
      - { name: hub_code, type: string, source: input, description: "Unique hub code, e.g. HUB-NE-01", constraints: "unique" }
      - { name: name, type: string, source: input, description: "Hub display name" }
      - { name: serves_zones, type: array, source: input, description: "Destination zone identifiers this hub serves, e.g. [\"ZONE_NE\",\"ZONE_MA\"]" }
      - { name: white_glove_capable, type: boolean, source: input, description: "Whether crews at this hub can perform ROOM_OF_CHOICE deliveries" }
      - { name: daily_capacity, type: integer, source: input, description: "Max ARRIVED linehauls per calendar date at this hub (aggregate whole-date cap)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Customer email", constraints: "unique" }
      - { name: full_name, type: string, source: input, description: "Customer name" }
      - { name: destination_zone, type: string, source: input, description: "Delivery zone identifier used for routing, e.g. ZONE_NE" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; purchaser" }
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; single-item orders only" }
      - { name: service_level, type: enum, source: input, description: "THRESHOLD | ROOM_OF_CHOICE" }
      - { name: shipping_amount_cents, type: integer, source: computed, description: "calculations.shipping_price from the FreightLane for the shipment's leg_mode and customer zone" }
      - { name: oversized_surcharge_cents, type: integer, source: computed, description: "5% of order_total_cents rounded half-up; 0 when freight_class == PARCEL_ELIGIBLE" }
      - { name: handling_fee_cents, type: integer, source: computed, description: "8% applied to (order_total_cents - oversized_surcharge_cents), strictly after surcharge per calculations.order_fee_split" }
      - { name: order_total_cents, type: integer, source: computed, description: "item declared_value_cents + shipping_amount_cents; computed BEFORE fee components (pinned evaluation order)" }
      - { name: order_state, type: enum, source: system, description: "PENDING → ROUTED → IN_TRANSIT → OUT_FOR_DELIVERY → DELIVERED | CANCELLED" }
      - { name: fulfillment_state, type: enum, source: system, description: "NONE → SCHEDULED → FULFILLED → RETURNED — parallel dimension, evolves independently of order_state (direct NONE → FULFILLED for non-hub delivery)" }

  - name: FreightLane
    parent: null
    common_fields: true
    fields:
      - { name: leg_mode, type: enum, source: input, description: "PARCEL | LTL | OWNED_FINAL_MILE" }
      - { name: dest_zone, type: string, source: input, description: "Destination zone this lane serves" }
      - { name: base_rate_cents, type: integer, source: input, description: "Flat lane price in cents" }
      - { name: per_lb_rate_cents, type: integer, source: input, description: "Additional cents per pound of item weight (weight ceiled to whole lb)" }
      - { name: transit_days, type: integer, source: input, description: "Calendar transit days for this leg, >= 1" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: computed, description: "FK -> Order.id; exactly one Shipment per Order, created by routing" }
      - { name: item_id, type: string, source: computed, description: "FK -> Item.id; copied from the Order at creation" }
      - { name: supplier_id, type: string, source: computed, description: "FK -> Supplier.id; copied from the Item at creation" }
      - { name: hub_id, type: string, source: computed, description: "FK -> Hub.id; nullable — set only when routing selects OWNED_FINAL_MILE" }
      - { name: linehaul_id, type: string, source: computed, description: "FK -> Linehaul.id; nullable — the linehaul this shipment is committed to (re-bound on miss per calculations.promised_date)" }
      - { name: fulfillment_mode, type: enum, source: computed, description: "PARCEL | DROP_SHIP | OWNED_FINAL_MILE — from calculations.routing_decision" }
      - { name: leg_mode, type: enum, source: computed, description: "PARCEL | LTL | OWNED_FINAL_MILE — priced leg used for shipping_amount_cents" }
      - { name: promised_date, type: string, source: computed, description: "ISO date; calculations.promised_date = order creation date + 2 + transit_days + dwell(1 if OWNED_FINAL_MILE) + 2*linehaul_misses" }
      - { name: actual_ship_date, type: string, source: computed, description: "ISO date the shipment departed origin; null until depart" }
      - { name: promised_ship_date, type: string, source: computed, description: "ISO date; drop-ship only: order creation date + supplier.lead_time_days; null for network shipments" }
      - { name: linehaul_misses, type: integer, source: computed, default: 0, description: "Count of linehaul MISSED events recorded against this shipment" }
      - { name: current_state, type: enum, source: system, description: "CREATED → TENDERED → IN_TRANSIT → AT_HUB → OUT_FOR_DELIVERY → DELIVERED | EXCEPTION" }
      - { name: delivered_at, type: string, source: computed, description: "ISO datetime of delivery; null until DELIVERED" }

  - name: Linehaul
    parent: null
    common_fields: true
    fields:
      - { name: hub_id, type: string, source: input, description: "FK -> Hub.id; destination hub" }
      - { name: planned_arrival_date, type: string, source: input, description: "ISO calendar date the trailer is planned to arrive" }
      - { name: origin_ship_date, type: string, source: input, description: "ISO date the trailer departs origin; must be strictly before planned_arrival_date" }
      - { name: capacity, type: integer, source: input, description: "Trailer capacity in shipment slots" }
      - { name: committed_count, type: integer, source: computed, default: 0, description: "Shipments with linehaul_id == this Linehaul and current_state NOT IN {DELIVERED, EXCEPTION}" }
      - { name: status, type: enum, source: system, description: "PLANNED → DEPARTED → ARRIVED | MISSED" }

  - name: DeliveryAppointment
    parent: null
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: input, description: "FK -> Shipment.id; appointment belongs to exactly one shipment" }
      - { name: service_level, type: enum, source: computed, description: "THRESHOLD | ROOM_OF_CHOICE — copied from the Order; never client-supplied" }
      - { name: window_start, type: datetime, source: input, description: "ISO 8601 datetime; inclusive lower bound of the delivery window" }
      - { name: window_end, type: datetime, source: input, description: "ISO 8601 datetime; exclusive upper bound — half-open interval [window_start, window_end)" }
      - { name: hub_id, type: string, source: computed, description: "FK -> Hub.id; copied from Shipment.hub_id" }
      - { name: crew_id, type: string, source: input, description: "Crew identifier within the hub; ROOM_OF_CHOICE bookings on the same (hub_id, crew_id) overlap-check against each other" }
      - { name: status, type: enum, source: system, description: "BOOKED → COMPLETED | NO_SHOW | CANCELLED" }

  - name: DamageClaim
    parent: null
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: input, description: "FK -> Shipment.id; damaged shipment" }
      - { name: claimant_role, type: enum, source: input, description: "CUSTOMER | HUB_INSPECTOR — who first reported the damage" }
      - { name: concealment, type: enum, source: input, description: "CONCEALED | VISIBLE_AT_DELIVERY — drives chargeback attribution" }
      - { name: damage_pct, type: integer, source: computed, description: "Inspected damaged percentage 0–100; recorded at inspection" }
      - { name: is_structural, type: boolean, source: computed, description: "True when frame/load-bearing damage; forces FULL_REPLACEMENT" }
      - { name: repair_cost_cents, type: integer, source: computed, description: "Estimated repair cost in cents; recorded at inspection" }
      - { name: replacement_cost_cents, type: integer, source: computed, description: "Item.declared_value_cents snapshot at claim creation" }
      - { name: resolution_type, type: enum, source: computed, description: "REPLACEMENT_PART | REPAIR | FULL_REPLACEMENT — calculations.damage_triage at inspection" }
      - { name: liability_party, type: enum, source: computed, description: "SUPPLIER | CARRIER — calculations.chargeback_allocation at determination" }
      - { name: chargeback_amount_cents, type: integer, source: computed, description: "calculations.chargeback_allocation; 0 until determination" }
      - { name: status, type: enum, source: system, description: "OPEN → INSPECTION → DETERMINATION → SETTLED | WITHDRAWN" }

  - name: Chargeback
    parent: null
    common_fields: true
    fields:
      - { name: damage_claim_id, type: string, source: computed, description: "FK -> DamageClaim.id; 1:1 with the originating claim" }
      - { name: supplier_id, type: string, source: computed, description: "FK -> Supplier.id; debited supplier" }
      - { name: shipment_id, type: string, source: computed, description: "FK -> Shipment.id; damaged shipment" }
      - { name: amount_cents, type: integer, source: computed, description: "Equals DamageClaim.chargeback_amount_cents at determination" }
      - { name: reason_code, type: enum, source: computed, description: "CONCEALED_DAMAGE | REPAIR_OVERRUN | FULL_REPLACEMENT" }
      - { name: status, type: enum, source: system, description: "PENDING → SETTLED | DISPUTED, DISPUTED → REVERSED | SETTLED" }

  - name: ReturnAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; delivered order being returned" }
      - { name: reason, type: enum, source: input, description: "DAMAGE | BUYERS_REMORSE | WRONG_ITEM" }
      - { name: reverse_haul_cost_cents, type: integer, source: computed, description: "LTL FreightLane base_rate_cents to the customer zone x 1.20 handling factor, round_half_up (calculations.return_disposition)" }
      - { name: refurb_value_cents, type: integer, source: computed, description: "Reason-driven recovery: DAMAGE → 10% of declared_value, BUYERS_REMORSE → 40%, WRONG_ITEM → 90% (round_half_up)" }
      - { name: disposition, type: enum, source: computed, description: "FIELD_DISPOSAL | RETURN_TO_HUB — calculations.return_disposition; ties resolve to FIELD_DISPOSAL" }
      - { name: approved_at, type: string, source: computed, description: "ISO datetime of approval; EXPIRED when logical clock passes approved_at + 30 days without completion" }
      - { name: status, type: enum, source: system, description: "REQUESTED → APPROVED → COMPLETED | DENIED | EXPIRED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Supplier
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: PROBATION
        trigger: "system (automatic when compliance_score < 70.00 after any score recompute)"
        actor: system
        preconditions: []
        side_effects:
          - "Supplier.status → PROBATION; drop-ship routing eligibility removed (routing_decision branch 3 requires status == ACTIVE)"
      - from: PROBATION
        to: SUSPENDED
        trigger: "system (automatic when compliance_score < 50.00 after any score recompute)"
        actor: system
        preconditions: []
        side_effects:
          - "Supplier.status → SUSPENDED; new orders on this supplier's items rejected (ERR_ITEM_NOT_LISTED)"
      - from: PROBATION
        to: ACTIVE
        trigger: "system (automatic when compliance_score recovers to >= 80.00 after any score recompute)"
        actor: system
        preconditions: []
        side_effects:
          - "Supplier.status → ACTIVE; drop-ship eligibility restored"

  - entity: Item
    initial_state: LISTED
    terminal_states: [DELISTED]
    transitions:
      - from: LISTED
        to: DELISTED
        trigger: "POST /oversize-freight/items/{itemId}/delist"
        actor: NetworkAdmin
        preconditions:
          - "Item must be LISTED (ERR_INVALID_STATE)"
          - "No Shipment referencing this item with current_state IN {CREATED, TENDERED, IN_TRANSIT, AT_HUB, OUT_FOR_DELIVERY} (ERR_ITEM_HAS_OPEN_SHIPMENTS)"
        side_effects:
          - "Item.status → DELISTED; future orders rejected (ERR_ITEM_NOT_LISTED)"

  - entity: Order
    initial_state: PENDING
    terminal_states: [DELIVERED, CANCELLED]
    note: "Two parallel dimensions: order_state (commercial) and fulfillment_state (execution). They advance independently; the combined state is read via GET /orders/{id}."
    transitions:
      - from: PENDING
        to: ROUTED
        trigger: "system (automatic within POST /orders when routing_decision succeeds)"
        actor: system
        preconditions: []
        side_effects:
          - "Shipment created with current_state = TENDERED (CREATED → TENDERED is immediate)"
          - "For OWNED_FINAL_MILE: shipment bound to a Linehaul (selector: PLANNED linehaul into the routed hub with free capacity, earliest planned_arrival_date, tie-break Linehaul.created_at ASC); Linehaul.committed_count += 1"
          - "shipping_price and order_fee_split computed and stored on the Order"
      - from: ROUTED
        to: IN_TRANSIT
        trigger: "POST /oversize-freight/shipments/{shipmentId}/depart"
        actor: "CarrierRep | SupplierRep"
        preconditions:
          - "Shipment.current_state == TENDERED (ERR_INVALID_STATE)"
        side_effects:
          - "Shipment.actual_ship_date = logical clock date; Shipment.current_state → IN_TRANSIT"
      - from: IN_TRANSIT
        to: OUT_FOR_DELIVERY
        trigger: "POST /oversize-freight/appointments (OWNED_FINAL_MILE only; requires Shipment AT_HUB)"
        actor: "Customer | HubOperator"
        preconditions:
          - "Shipment.current_state == AT_HUB (ERR_INVALID_STATE)"
        side_effects:
          - "Shipment.current_state AT_HUB → OUT_FOR_DELIVERY"
          - "Order.fulfillment_state NONE → SCHEDULED"
      - from: OUT_FOR_DELIVERY
        to: DELIVERED
        trigger: "POST /oversize-freight/appointments/{appointmentId}/complete"
        actor: HubOperator
        preconditions:
          - "Appointment.status == BOOKED (ERR_INVALID_STATE)"
        side_effects:
          - "Shipment.current_state → DELIVERED; delivered_at = logical clock"
          - "Order.fulfillment_state SCHEDULED → FULFILLED"
          - "Drop-ship/network supplier metrics recomputed (supplier_compliance_score)"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /oversize-freight/shipments/{shipmentId}/deliver (PARCEL and DROP_SHIP only — no hub appointment)"
        actor: "CarrierRep | SupplierRep"
        preconditions:
          - "Shipment.current_state == IN_TRANSIT (ERR_INVALID_STATE)"
          - "Shipment.fulfillment_mode != OWNED_FINAL_MILE (ERR_INVALID_STATE — hub shipments deliver via appointment)"
        side_effects:
          - "Shipment.current_state → DELIVERED; delivered_at = logical clock"
          - "Order.fulfillment_state NONE → FULFILLED (no appointment ever existed)"
          - "Drop-ship supplier on_time_ship_rate + compliance_score recomputed"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /oversize-freight/orders/{orderId}/cancel"
        actor: "Customer | NetworkAdmin"
        preconditions:
          - "order_state IN {PENDING, ROUTED} (ERR_INVALID_STATE)"
        side_effects:
          - "Shipment.current_state → EXCEPTION"
          - "Bound Linehaul.committed_count -= 1 (slot released); fulfillment_state stays NONE"
      - from: ROUTED
        to: CANCELLED
        trigger: "POST /oversize-freight/orders/{orderId}/cancel"
        actor: "Customer | NetworkAdmin"
        preconditions:
          - "order_state IN {PENDING, ROUTED} (ERR_INVALID_STATE)"
        side_effects:
          - "Same compensation as PENDING → CANCELLED"

  - entity: Linehaul
    initial_state: PLANNED
    terminal_states: [ARRIVED, MISSED]
    transitions:
      - from: PLANNED
        to: DEPARTED
        trigger: "POST /oversize-freight/linehauls/{linehaulId}/depart"
        actor: NetworkAdmin
        preconditions:
          - "status == PLANNED (ERR_INVALID_STATE)"
        side_effects: []
      - from: DEPARTED
        to: ARRIVED
        trigger: "POST /oversize-freight/linehauls/{linehaulId}/arrive"
        actor: HubOperator
        preconditions:
          - "status == DEPARTED (ERR_INVALID_STATE)"
          - "Count of ARRIVED Linehauls with hub_id == this hub and planned_arrival_date == this date < Hub.daily_capacity (ERR_HUB_DAILY_CAPACITY_EXCEEDED)"
        side_effects:
          - "Shipments with linehaul_id == this Linehaul and current_state == IN_TRANSIT → AT_HUB"
      - from: DEPARTED
        to: MISSED
        trigger: "POST /oversize-freight/linehauls/{linehaulId}/mark-missed"
        actor: HubOperator
        preconditions:
          - "status == DEPARTED (ERR_INVALID_STATE)"
        side_effects:
          - "Each Shipment with linehaul_id == this Linehaul and current_state NOT IN {DELIVERED, EXCEPTION}: linehaul_misses += 1 and promised_date recomputed (+2 days per miss, calculations.promised_date)"
          - "Each such Shipment re-binds to the earliest PLANNED Linehaul into the same hub with free capacity (tie-break Linehaul.created_at ASC); if none exists, linehaul_id set to null until a suitable Linehaul is created (auto rebind on creation)"
          - "New binding adjusts Linehaul.committed_count on both sides (old -1, new +1)"

  - entity: DeliveryAppointment
    initial_state: BOOKED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /oversize-freight/appointments/{appointmentId}/complete"
        actor: HubOperator
        preconditions:
          - "status == BOOKED (ERR_INVALID_STATE)"
        side_effects:
          - "Shipment → DELIVERED; Order → DELIVERED/FULFILLED (see Order machine)"
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /oversize-freight/appointments/{appointmentId}/mark-no-show"
        actor: HubOperator
        preconditions:
          - "status == BOOKED (ERR_INVALID_STATE)"
        side_effects:
          - "Shipment stays OUT_FOR_DELIVERY; a replacement appointment may be booked"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /oversize-freight/appointments/{appointmentId}/cancel"
        actor: "Customer | HubOperator"
        preconditions:
          - "status == BOOKED (ERR_INVALID_STATE)"
        side_effects:
          - "Crew window freed for overlap checks; Shipment returns OUT_FOR_DELIVERY → AT_HUB for rebooking"

  - entity: DamageClaim
    initial_state: OPEN
    terminal_states: [SETTLED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: INSPECTION
        trigger: "POST /oversize-freight/damage-claims/{claimId}/inspect"
        actor: HubOperator
        preconditions:
          - "status == OPEN (ERR_INVALID_STATE)"
          - "Shipment.current_state IN {AT_HUB, DELIVERED} (ERR_CLAIM_REQUIRES_INSPECTABLE_SHIPMENT)"
        side_effects:
          - "damage_pct, is_structural, repair_cost_cents recorded"
          - "resolution_type computed per calculations.damage_triage"
      - from: INSPECTION
        to: DETERMINATION
        trigger: "POST /oversize-freight/damage-claims/{claimId}/determine"
        actor: ClaimsAdjuster
        preconditions:
          - "status == INSPECTION (ERR_INVALID_STATE)"
        side_effects:
          - "liability_party + chargeback_amount_cents computed per calculations.chargeback_allocation"
          - "If liability_party == SUPPLIER: Chargeback created in PENDING with amount_cents = chargeback_amount_cents"
      - from: DETERMINATION
        to: SETTLED
        trigger: "POST /oversize-freight/damage-claims/{claimId}/settle"
        actor: ClaimsAdjuster
        preconditions:
          - "status == DETERMINATION (ERR_INVALID_STATE)"
          - "Linked Chargeback (if any) must be SETTLED or REVERSED (ERR_CHARGEBACK_OPEN)"
        side_effects:
          - "Supplier.chargeback_rate and compliance_score recomputed"
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /oversize-freight/damage-claims/{claimId}/withdraw"
        actor: "Customer | ClaimsAdjuster"
        preconditions:
          - "status == OPEN (ERR_INVALID_STATE)"
        side_effects: []

  - entity: Chargeback
    initial_state: PENDING
    terminal_states: [SETTLED, REVERSED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /oversize-freight/chargebacks/{chargebackId}/settle"
        actor: NetworkAdmin
        preconditions:
          - "status == PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "Supplier.chargeback_rate recomputed; Supplier.compliance_score recomputed; possible Supplier status auto-transition"
      - from: PENDING
        to: DISPUTED
        trigger: "POST /oversize-freight/chargebacks/{chargebackId}/dispute"
        actor: SupplierRep
        preconditions:
          - "status == PENDING (ERR_INVALID_STATE)"
          - "Acting SupplierRep's X-User-ID == Chargeback.supplier_id (ERR_FORBIDDEN)"
        side_effects: []
      - from: DISPUTED
        to: REVERSED
        trigger: "POST /oversize-freight/chargebacks/{chargebackId}/reverse"
        actor: NetworkAdmin
        preconditions:
          - "status == DISPUTED (ERR_INVALID_STATE)"
        side_effects:
          - "Supplier.chargeback_rate recomputed excluding REVERSED; Supplier.compliance_score recomputed"
      - from: DISPUTED
        to: SETTLED
        trigger: "POST /oversize-freight/chargebacks/{chargebackId}/settle"
        actor: NetworkAdmin
        preconditions:
          - "status IN {PENDING, DISPUTED} (ERR_INVALID_STATE)"
        side_effects:
          - "Same recompute chain as PENDING → SETTLED"

  - entity: ReturnAuthorization
    initial_state: REQUESTED
    terminal_states: [COMPLETED, DENIED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /oversize-freight/return-authorizations/{raId}/approve"
        actor: NetworkAdmin
        preconditions:
          - "status == REQUESTED (ERR_INVALID_STATE)"
          - "Order.order_state == DELIVERED (ERR_ORDER_NOT_DELIVERED)"
          - "Logical clock <= Order.delivered_at + 45 days (ERR_RETURN_WINDOW_CLOSED)"
        side_effects:
          - "disposition, reverse_haul_cost_cents, refurb_value_cents computed per calculations.return_disposition"
          - "approved_at = logical clock"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /oversize-freight/return-authorizations/{raId}/deny"
        actor: NetworkAdmin
        preconditions:
          - "status == REQUESTED (ERR_INVALID_STATE)"
        side_effects: []
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /oversize-freight/return-authorizations/{raId}/complete"
        actor: HubOperator
        preconditions:
          - "status == APPROVED (ERR_INVALID_STATE)"
        side_effects:
          - "Order.fulfillment_state FULFILLED → RETURNED"
      - from: APPROVED
        to: EXPIRED
        trigger: "system (automatic when logical clock passes approved_at + 30 days without completion)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: appointment-book-stale-shipment
    parent_entity: Shipment
    write_endpoint: "POST /oversize-freight/appointments"
    occ_field: "expected_shipment_version"
    description: |
      Booking a DeliveryAppointment against a Shipment whose version has
      advanced since the client last read it is rejected. This captures the
      case where another writer has just booked or cancelled an appointment
      (which legitimately mutates the shipment's scheduling view) and the
      current writer's view of the shipment is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: item_cube_score
    trigger: "Item create (listing time)"
    algorithm: weighted_scoring
    formula: |
      score = round_half_up( 0.45 * max(L, W, H)
                           + 0.30 * cbrt(L * W * H)
                           + 0.25 * (L + W + H), 2 )
      L, W, H = dim_length_in, dim_width_in, dim_height_in (inches)
    input_set: "the single Item being listed"
    constants:
      W_LONGEST: 0.45
      W_CUBE_ROOT: 0.30
      W_GIRTH: 0.25
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: freight_class_assignment
    trigger: "Item create, immediately after item_cube_score"
    algorithm: threshold
    formula: |
      s = item.cube_score
      if s <= 40.00:    PARCEL_ELIGIBLE
      elif s <= 70.00:  LTL_250
      elif s <= 100.00: LTL_150
      elif s <= 150.00: LTL_125
      else:             LTL_92_5
      Boundaries are INCLUSIVE on the lower class (score exactly 40.00 → PARCEL_ELIGIBLE).
    input_set: "the single Item"
    constants:
      T_PARCEL: 40.00
      T_250: 70.00
      T_150: 100.00
      T_125: 150.00
    precision: "comparison on the 2dp cube_score"
    variants: []

  - name: declared_value_cube_check
    trigger: "Item create — declared-dimension audit for the parcel gate"
    algorithm: aggregation
    formula: |
      # Nested rounding order is PINNED: ceil EACH dimension first, then combine.
      declared_girth_in = ceil(dim_length_in) + 2 * (ceil(dim_width_in) + ceil(dim_height_in))
      # Per-dimension-then-sum, NOT sum-then-round.
      # dims (20.2, 30.4, 10.1): per-line → 21 + 2*(31 + 11) = 105
      #                          sum-then-round → ceil(20.2 + 2*(30.4+10.1)) = ceil(101.2) = 102
      # The orders differ by 3 inches; the scaffold pins PER-LINE.
      parcel_ok = (declared_girth_in <= 165)
    input_set: "the single Item"
    constants:
      PARCEL_GATE_IN: 165
    precision: "whole inches, ceil per dimension then combine (pinned order)"
    variants: []

  - name: routing_decision
    trigger: "Order create"
    algorithm: constraint_propagation
    formula: |
      Evaluate branches IN ORDER; first matching branch wins:
      1. PARCEL: item.freight_class == PARCEL_ELIGIBLE AND item.parcel_ok
         AND an ACTIVE PARCEL FreightLane exists for customer.destination_zone
         → fulfillment_mode PARCEL, leg_mode PARCEL, hub_id null, linehaul_id null
      2. ROOM_OF_CHOICE service: candidates = Hub with status == ACTIVE,
         customer.destination_zone ∈ serves_zones, white_glove_capable == true
         → selector: argmin by (FreightLane(OWNED_FINAL_MILE, zone).transit_days ASC,
         Hub.created_at ASC); never by id. Empty candidates → ERR_NO_ROUTE.
         → fulfillment_mode OWNED_FINAL_MILE, leg_mode OWNED_FINAL_MILE
      3. DROP_SHIP: item.supplier.drop_ship_enabled AND supplier.status == ACTIVE
         → fulfillment_mode DROP_SHIP, leg_mode LTL, hub_id null;
         promised_ship_date = order creation date + supplier.lead_time_days
      4. LTL network fallback: candidates = Hub with status == ACTIVE and zone ∈
         serves_zones → same selector as branch 2; empty → ERR_NO_ROUTE
         → fulfillment_mode OWNED_FINAL_MILE, leg_mode LTL
      OWNED_FINAL_MILE shipments then bind a Linehaul: PLANNED linehaul into the
      selected hub with committed_count < capacity, earliest planned_arrival_date,
      tie-break Linehaul.created_at ASC; none available → ERR_LINEHAUL_CAPACITY_EXCEEDED.
    input_set: "Order + Item + Supplier + Customer + ACTIVE FreightLanes for the zone + ACTIVE Hubs serving the zone + PLANNED Linehauls"
    constants: {}
    precision: "n/a"
    variants: []

  - name: shipping_price
    trigger: "Order create (after routing_decision fixes leg_mode)"
    algorithm: tiered_pricing
    formula: |
      lane = FreightLane where leg_mode == shipment.leg_mode AND dest_zone ==
             customer.destination_zone AND status == ACTIVE
      if lane is null → ERR_PRICING_UNAVAILABLE
      shipping_amount_cents = lane.base_rate_cents + lane.per_lb_rate_cents * ceil(item.weight_lb)
    input_set: "the selected leg_mode lane for the destination zone"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: order_fee_split
    trigger: "Order create (after shipping_price)"
    algorithm: aggregation
    formula: |
      # Circular-looking dependency, pinned: order_total_cents is computed FIRST
      # from declared value + shipping only; fee components derive FROM it.
      order_total_cents = item.declared_value_cents + shipping_amount_cents
      if item.freight_class == PARCEL_ELIGIBLE:
        oversized_surcharge_cents = 0
      else:
        oversized_surcharge_cents = round_half_up(order_total_cents * 0.05, 0)
      handling_fee_cents = round_half_up((order_total_cents - oversized_surcharge_cents) * 0.08, 0)
      # Evaluation order is strictly: total → surcharge → handling. Computing
      # handling on the pre-surcharge total produces different cents.
    input_set: "Order + Item"
    constants:
      SURCHARGE_PCT: 0.05
      HANDLING_LOAD_PCT: 0.08
    precision: "integer cents, round_half_up at each step"
    variants: []

  - name: promised_date
    trigger: "Shipment create; re-run on Linehaul DEPARTED → MISSED"
    algorithm: chronological
    formula: |
      base at routing (linehaul_misses == 0):
        promised_date = order creation date + 2 (handling) + lane.transit_days
                        + 1 (hub dwell) if fulfillment_mode == OWNED_FINAL_MILE
      after k misses (k = shipment.linehaul_misses):
        promised_date = base + 2 * k
      # Each miss slips the rebooked linehaul by +1 day AND inflates hub dwell
      # by +1 day: total slip per miss is exactly +2 days.
    input_set: "Shipment + Order + FreightLane"
    constants:
      HANDLING_DAYS: 2
      HUB_DWELL_DAYS: 1
      SLIP_PER_MISS_DAYS: 2
    precision: "whole ISO dates"
    variants: []

  - name: damage_triage
    trigger: "DamageClaim inspect (OPEN → INSPECTION)"
    algorithm: threshold
    formula: |
      if claim.is_structural or claim.damage_pct > 40:                   FULL_REPLACEMENT
      elif claim.repair_cost_cents > claim.replacement_cost_cents:       FULL_REPLACEMENT
      elif claim.repair_cost_cents >= 20000:                             REPAIR
      else:                                                               REPLACEMENT_PART
      # damage_pct boundary: > 40 strictly (exactly 40 does NOT trigger)
      # repair cost boundary: >= 20000 inclusive → REPAIR
    input_set: "the DamageClaim being inspected"
    constants:
      STRUCTURAL_DMG_PCT: 40
      REPAIR_FLOOR_CENTS: 20000
    precision: "integer comparisons"
    variants: []

  - name: chargeback_allocation
    trigger: "DamageClaim determine (INSPECTION → DETERMINATION)"
    algorithm: waterfall_allocation
    formula: |
      variant CONCEALED (supplier liable):
        chargeback_amount_cents = round_half_up(repair_cost_cents * 1.00
                                                + replacement_cost_cents * 0.35, 0)
        liability_party = SUPPLIER; a PENDING Chargeback row is created
      variant VISIBLE_AT_DELIVERY (carrier liable):
        chargeback_amount_cents = round_half_up(repair_cost_cents * 0.40, 0)
        liability_party = CARRIER; NO Chargeback row is created
      For FULL_REPLACEMENT resolutions, replacement_cost_cents is the item's
      declared value snapshot regardless of the repair estimate.
    input_set: "DamageClaim in INSPECTION moving to DETERMINATION"
    constants:
      CONCEALED_REPLACEMENT_SHARE: 0.35
      VISIBLE_REPAIR_CLAWBACK: 0.40
    precision: "integer cents, round_half_up"
    variants:
      - name: concealed_supplier
        when: "claim.concealment == CONCEALED"
        difference: "supplier bears 100% repair + 35% replacement; Chargeback row created"
      - name: visible_carrier
        when: "claim.concealment == VISIBLE_AT_DELIVERY"
        difference: "carrier bears the loss; claim records only the 40% repair-cost handling clawback; no Chargeback row"

  - name: return_disposition
    trigger: "ReturnAuthorization approve (REQUESTED → APPROVED)"
    algorithm: waterfall_allocation
    formula: |
      ltl_lane = FreightLane(LTL, customer.destination_zone, status ACTIVE)
      reverse_haul_cost_cents = round_half_up(ltl_lane.base_rate_cents * 1.20, 0)
      refurb_value_cents = round_half_up(item.declared_value_cents * REFURB_PCT[reason], 0)
        REFURB_PCT: DAMAGE 0.10, BUYERS_REMORSE 0.40, WRONG_ITEM 0.90
      if refurb_value_cents > reverse_haul_cost_cents: RETURN_TO_HUB
      else:                                            FIELD_DISPOSAL
      # tie (==) resolves to FIELD_DISPOSAL — disposal wins at break-even
    input_set: "ReturnAuthorization + Order + Item + LTL FreightLane"
    constants:
      REVERSE_HAUL_FACTOR: 1.20
    precision: "integer cents, round_half_up"
    variants: []

  - name: supplier_compliance_score
    trigger: "Shipment close (DELIVERED) for drop-ship; Chargeback settle/reverse"
    algorithm: weighted_scoring
    formula: |
      on_time_ship_rate = round_half_up(100 * (# of the supplier's 5 most recently
          closed (DELIVERED) drop-ship shipments with actual_ship_date <= promised_ship_date)
          / max(1, # in that window), 2)
        window ordered by delivered_at DESC, tie-break Shipment.created_at ASC;
        100.00 when the window is empty
      chargeback_rate = round_half_up(100 * (# Chargebacks SETTLED against supplier)
          / max(1, # supplier's Shipments with current_state != EXCEPTION), 2)
        0.00 when the denominator is 0
      compliance_score = round_half_up(0.60 * on_time_ship_rate
                                       + 0.40 * (100 - chargeback_rate), 2)
      auto-transitions:
        score < 70.00 (from ACTIVE)  → PROBATION
        score < 50.00 (from PROBATION) → SUSPENDED
        score >= 80.00 (from PROBATION) → ACTIVE
    input_set: "Supplier + its shipments (rolling window variant) + its chargebacks"
    constants:
      W_ON_TIME: 0.60
      W_CHARGEBACK: 0.40
      ROLLING_WINDOW: 5
      T_PROBATION: 70.00
      T_SUSPENDED: 50.00
      T_RECOVER: 80.00
    precision: "2 decimal places, round_half_up; the weighted sum consumes the ROUNDED 2dp rates"
    variants:
      - name: rolling_window
        when: "default — the 5 most recently closed drop-ship shipments"
        difference: "old shipments age out of the on-time denominator; the score can recover"
      - name: lifetime
        when: "reporting view only (GET /suppliers/{id}/scorecard?window=lifetime)"
        difference: "ALL closed drop-ship shipments counted; identical chargebacks produce a different compliance_score than rolling once the supplier has more than 5 closed shipments"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role is authorized for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path and body identifiers resolve, validated left-to-right (path segments first, then body fields in declared input order)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"

  - priority: 4
    category: business_constraint
    check: "Required input fields present and well-typed; enum values inside declared sets"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"

  - priority: 5
    category: state
    check: "Target entity is in a valid state for this transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "state-transition endpoints"

  - priority: 6
    category: business_constraint
    check: "ROOM_OF_CHOICE service requires item.white_glove_eligible == true"
    error_id: ERR_SERVICE_LEVEL_NOT_AVAILABLE
    http_status: 422
    applies_to: "POST /oversize-freight/orders"

  - priority: 7
    category: business_referential
    check: "Item must be LISTED and its Supplier must not be SUSPENDED at order time"
    error_id: ERR_ITEM_NOT_LISTED
    http_status: 409
    applies_to: "POST /oversize-freight/orders"

  - priority: 8
    category: business_constraint
    check: "A hub/lane combination exists that can serve the destination zone for the chosen service level"
    error_id: ERR_NO_ROUTE
    http_status: 422
    applies_to: "POST /oversize-freight/orders"

  - priority: 9
    category: business_fiscal
    check: "An ACTIVE FreightLane exists for the selected leg_mode + destination zone (pricing possible)"
    error_id: ERR_PRICING_UNAVAILABLE
    http_status: 402
    applies_to: "POST /oversize-freight/orders"

  - priority: 10
    category: business_temporal
    check: "Appointment window: window_start < window_end, duration >= 2 hours, window_start >= logical clock"
    error_id: ERR_INVALID_APPOINTMENT_WINDOW
    http_status: 422
    applies_to: "POST /oversize-freight/appointments"

  - priority: 11
    category: business_temporal
    check: "ROOM_OF_CHOICE appointments on the same (hub_id, crew_id) must not overlap under half-open semantics [start, end); back-to-back (prev.window_end == next.window_start) is allowed"
    error_id: ERR_APPOINTMENT_OVERLAP
    http_status: 409
    applies_to: "POST /oversize-freight/appointments"

  - priority: 12
    category: business_safety
    check: "Linehaul arrival would exceed Hub.daily_capacity ARRIVED linehauls for that calendar date"
    error_id: ERR_HUB_DAILY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /oversize-freight/linehauls/{id}/arrive"

  - priority: 13
    category: business_safety
    check: "Linehaul committed_count must remain <= capacity when a shipment binds to it"
    error_id: ERR_LINEHAUL_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /oversize-freight/orders (routing commit)"

  - priority: 14
    category: business_temporal
    check: "ReturnAuthorization approve must occur within 45 days of Order delivery (logical clock vs delivered_at)"
    error_id: ERR_RETURN_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /oversize-freight/return-authorizations/{id}/approve"

  - priority: 15
    category: state
    check: "DamageClaim may settle only after its Chargeback (if any) is SETTLED or REVERSED"
    error_id: ERR_CHARGEBACK_OPEN
    http_status: 409
    applies_to: "POST /oversize-freight/damage-claims/{id}/settle"

  - priority: 16
    category: business_fiscal
    check: "Chargeback dispute allowed only by the debited supplier's own rep (X-User-ID == Chargeback.supplier_id)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "POST /oversize-freight/chargebacks/{id}/dispute"

  - priority: 17
    category: business_constraint
    check: "expected_shipment_version matches current Shipment.version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /oversize-freight/appointments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Reference data ---
  - method: POST
    path: "/oversize-freight/suppliers"
    description: "Register a supplier"
    roles: [NetworkAdmin]
    code: 201
    input: [supplier_code, legal_name, drop_ship_enabled, "lead_time_days?"]
    output: Supplier
    side_effects: ["status = ACTIVE; compliance_score = 100.00; on_time_ship_rate = 100.00; chargeback_rate = 0.00"]

  - method: GET
    path: "/oversize-freight/suppliers"
    description: "List suppliers"
    roles: [NetworkAdmin, ClaimsAdjuster, SupplierRep]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Supplier[]"
    side_effects: []

  - method: GET
    path: "/oversize-freight/suppliers/{supplierId}"
    description: "Get one supplier"
    roles: [NetworkAdmin, ClaimsAdjuster, SupplierRep]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  - method: GET
    path: "/oversize-freight/suppliers/{supplierId}/scorecard"
    description: "Computed compliance scorecard; window=rolling (default) or lifetime selects the supplier_compliance_score variant"
    roles: [NetworkAdmin, ClaimsAdjuster, SupplierRep]
    code: 200
    input: ["window?"]
    output: "{ on_time_ship_rate: number, chargeback_rate: number, compliance_score: number, window: string }"
    side_effects: []

  - method: POST
    path: "/oversize-freight/items"
    description: "List an item (cubing, freight class and parcel gate computed at listing time)"
    roles: [NetworkAdmin]
    code: 201
    input: [supplier_id, sku, dim_length_in, dim_width_in, dim_height_in, weight_lb, declared_value_cents, white_glove_eligible]
    output: Item
    side_effects: ["item_cube_score", "freight_class_assignment", "declared_value_cube_check", "status = LISTED"]

  - method: GET
    path: "/oversize-freight/items"
    description: "List items"
    roles: [NetworkAdmin, ClaimsAdjuster, SupplierRep, Customer]
    code: 200
    input: ["limit?", "offset?", "supplier_id?", "freight_class?", "status?"]
    output: "Item[]"
    side_effects: []

  - method: GET
    path: "/oversize-freight/items/{itemId}"
    description: "Get one item"
    roles: [NetworkAdmin, ClaimsAdjuster, SupplierRep, Customer]
    code: 200
    input: []
    output: Item
    side_effects: []

  - method: POST
    path: "/oversize-freight/items/{itemId}/delist"
    description: "Delist an item (blocked while open shipments reference it)"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Item
    side_effects: ["status → DELISTED"]

  - method: POST
    path: "/oversize-freight/hubs"
    description: "Register a final-mile hub"
    roles: [NetworkAdmin]
    code: 201
    input: [hub_code, name, serves_zones, white_glove_capable, daily_capacity]
    output: Hub
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/oversize-freight/hubs"
    description: "List hubs"
    roles: [NetworkAdmin, HubOperator, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: "Hub[]"
    side_effects: []

  - method: GET
    path: "/oversize-freight/hubs/{hubId}"
    description: "Get one hub"
    roles: [NetworkAdmin, HubOperator, ClaimsAdjuster]
    code: 200
    input: []
    output: Hub
    side_effects: []

  - method: POST
    path: "/oversize-freight/freight-lanes"
    description: "Create a freight lane (rate card entry)"
    roles: [NetworkAdmin]
    code: 201
    input: [leg_mode, dest_zone, base_rate_cents, per_lb_rate_cents, transit_days]
    output: FreightLane
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/oversize-freight/freight-lanes"
    description: "List freight lanes"
    roles: [NetworkAdmin, HubOperator]
    code: 200
    input: ["limit?", "offset?", "leg_mode?", "dest_zone?", "status?"]
    output: "FreightLane[]"
    side_effects: []

  - method: GET
    path: "/oversize-freight/freight-lanes/{laneId}"
    description: "Get one freight lane"
    roles: [NetworkAdmin, HubOperator]
    code: 200
    input: []
    output: FreightLane
    side_effects: []

  - method: POST
    path: "/oversize-freight/customers"
    description: "Register a customer"
    roles: [NetworkAdmin]
    code: 201
    input: [email, full_name, destination_zone]
    output: Customer
    side_effects: []

  - method: GET
    path: "/oversize-freight/customers/{customerId}"
    description: "Get one customer"
    roles: [NetworkAdmin, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- Orders & routing ---
  - method: POST
    path: "/oversize-freight/orders"
    description: "Place a single-item order; routing, pricing and fee split computed immediately; a Shipment is created in TENDERED"
    roles: [Customer]
    code: 201
    input: [customer_id, item_id, service_level]
    output: Order
    side_effects:
      - "routing_decision → Shipment created (fulfillment_mode, leg_mode, hub_id, linehaul_id, promised_date, promised_ship_date)"
      - "shipping_price → shipping_amount_cents"
      - "order_fee_split → order_total_cents, oversized_surcharge_cents, handling_fee_cents"
      - "order_state PENDING → ROUTED"
      - "for OWNED_FINAL_MILE: bound Linehaul.committed_count += 1"

  - method: GET
    path: "/oversize-freight/orders"
    description: "List orders"
    roles: [NetworkAdmin, Customer, HubOperator, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?", "customer_id?", "item_id?", "order_state?"]
    output: "Order[]"
    side_effects: []

  - method: GET
    path: "/oversize-freight/orders/{orderId}"
    description: "Get one order (both parallel state dimensions)"
    roles: [NetworkAdmin, Customer, HubOperator, ClaimsAdjuster]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: POST
    path: "/oversize-freight/orders/{orderId}/cancel"
    description: "Cancel an order before transit"
    roles: [Customer, NetworkAdmin]
    code: 200
    input: []
    output: Order
    side_effects: ["order_state → CANCELLED; Shipment → EXCEPTION; bound Linehaul.committed_count -= 1"]

  # --- Shipments ---
  - method: GET
    path: "/oversize-freight/shipments"
    description: "List shipments"
    roles: [NetworkAdmin, HubOperator, ClaimsAdjuster, SupplierRep]
    code: 200
    input: ["limit?", "offset?", "order_id?", "hub_id?", "supplier_id?", "linehaul_id?", "item_id?", "current_state?"]
    output: "Shipment[]"
    side_effects: []

  - method: GET
    path: "/oversize-freight/shipments/{shipmentId}"
    description: "Get one shipment"
    roles: [NetworkAdmin, HubOperator, ClaimsAdjuster, SupplierRep, Customer]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: POST
    path: "/oversize-freight/shipments/{shipmentId}/depart"
    description: "Confirm departure (network: linehaul left origin; drop-ship: supplier ship confirm)"
    roles: [CarrierRep, SupplierRep]
    code: 200
    input: []
    output: Shipment
    side_effects: ["current_state TENDERED → IN_TRANSIT; actual_ship_date = logical clock date; Order ROUTED → IN_TRANSIT"]

  - method: POST
    path: "/oversize-freight/shipments/{shipmentId}/deliver"
    description: "Direct delivery confirmation for PARCEL and DROP_SHIP shipments (no hub appointment)"
    roles: [CarrierRep, SupplierRep]
    code: 200
    input: []
    output: Shipment
    side_effects: ["current_state IN_TRANSIT → DELIVERED; delivered_at = logical clock; Order → DELIVERED and fulfillment_state NONE → FULFILLED; drop-ship supplier metrics recomputed"]

  # --- Linehauls ---
  - method: POST
    path: "/oversize-freight/linehauls"
    description: "Plan a linehaul trailer into a hub"
    roles: [NetworkAdmin]
    code: 201
    input: [hub_id, planned_arrival_date, origin_ship_date, capacity]
    output: Linehaul
    side_effects: ["status = PLANNED; committed_count = 0; unbound OWNED_FINAL_MILE shipments for this hub auto rebind (earliest planned_arrival_date, created_at ASC tie-break)"]

  - method: GET
    path: "/oversize-freight/linehauls"
    description: "List linehauls"
    roles: [NetworkAdmin, HubOperator]
    code: 200
    input: ["limit?", "offset?", "hub_id?", "status?"]
    output: "Linehaul[]"
    side_effects: []

  - method: GET
    path: "/oversize-freight/linehauls/{linehaulId}"
    description: "Get one linehaul"
    roles: [NetworkAdmin, HubOperator]
    code: 200
    input: []
    output: Linehaul
    side_effects: []

  - method: POST
    path: "/oversize-freight/linehauls/{linehaulId}/depart"
    description: "Mark linehaul departed origin"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Linehaul
    side_effects: ["status PLANNED → DEPARTED"]

  - method: POST
    path: "/oversize-freight/linehauls/{linehaulId}/arrive"
    description: "Mark linehaul arrived at hub; gated on hub daily capacity"
    roles: [HubOperator]
    code: 200
    input: []
    output: Linehaul
    side_effects: ["status DEPARTED → ARRIVED; bound shipments IN_TRANSIT → AT_HUB"]

  - method: POST
    path: "/oversize-freight/linehauls/{linehaulId}/mark-missed"
    description: "Mark a departed linehaul missed; recomputes promised dates and rebinds shipments"
    roles: [HubOperator]
    code: 200
    input: []
    output: Linehaul
    side_effects: ["status DEPARTED → MISSED; per bound Shipment: linehaul_misses += 1, promised_date += 2 days, rebind to earliest PLANNED linehaul with free capacity (or unbind)"]

  # --- Appointments ---
  - method: POST
    path: "/oversize-freight/appointments"
    description: "Book a delivery appointment (OCC-guarded on Shipment.version)"
    roles: [Customer, HubOperator]
    code: 201
    input: [shipment_id, window_start, window_end, crew_id, expected_shipment_version]
    output: DeliveryAppointment
    side_effects:
      - "increments Shipment.version by 1"
      - "Shipment.current_state AT_HUB → OUT_FOR_DELIVERY; Order IN_TRANSIT → OUT_FOR_DELIVERY"
      - "Order.fulfillment_state NONE → SCHEDULED"
      - "status = BOOKED; service_level copied from the Order"

  - method: GET
    path: "/oversize-freight/appointments"
    description: "List appointments"
    roles: [NetworkAdmin, HubOperator, Customer]
    code: 200
    input: ["limit?", "offset?", "shipment_id?", "hub_id?", "status?"]
    output: "DeliveryAppointment[]"
    side_effects: []

  - method: GET
    path: "/oversize-freight/appointments/{appointmentId}"
    description: "Get one appointment"
    roles: [NetworkAdmin, HubOperator, Customer]
    code: 200
    input: []
    output: DeliveryAppointment
    side_effects: []

  - method: POST
    path: "/oversize-freight/appointments/{appointmentId}/complete"
    description: "Complete delivery"
    roles: [HubOperator]
    code: 200
    input: []
    output: DeliveryAppointment
    side_effects: ["status → COMPLETED; Shipment → DELIVERED (delivered_at set); Order → DELIVERED, fulfillment_state SCHEDULED → FULFILLED; supplier metrics recomputed"]

  - method: POST
    path: "/oversize-freight/appointments/{appointmentId}/mark-no-show"
    description: "Customer no-show"
    roles: [HubOperator]
    code: 200
    input: []
    output: DeliveryAppointment
    side_effects: ["status → NO_SHOW; Shipment remains OUT_FOR_DELIVERY"]

  - method: POST
    path: "/oversize-freight/appointments/{appointmentId}/cancel"
    description: "Cancel a booked appointment; frees the crew window"
    roles: [Customer, HubOperator]
    code: 200
    input: []
    output: DeliveryAppointment
    side_effects: ["status → CANCELLED; crew window released; Shipment OUT_FOR_DELIVERY → AT_HUB"]

  # --- Damage claims & chargebacks ---
  - method: POST
    path: "/oversize-freight/damage-claims"
    description: "Open a damage claim against a shipment"
    roles: [Customer, HubOperator]
    code: 201
    input: [shipment_id, claimant_role, concealment]
    output: DamageClaim
    side_effects: ["status = OPEN; replacement_cost_cents snapshot from Item.declared_value_cents"]

  - method: GET
    path: "/oversize-freight/damage-claims"
    description: "List damage claims"
    roles: [NetworkAdmin, ClaimsAdjuster, HubOperator, Customer]
    code: 200
    input: ["limit?", "offset?", "shipment_id?", "status?"]
    output: "DamageClaim[]"
    side_effects: []

  - method: GET
    path: "/oversize-freight/damage-claims/{claimId}"
    description: "Get one damage claim"
    roles: [NetworkAdmin, ClaimsAdjuster, HubOperator, Customer]
    code: 200
    input: []
    output: DamageClaim
    side_effects: []

  - method: POST
    path: "/oversize-freight/damage-claims/{claimId}/inspect"
    description: "Record hub inspection; computes resolution_type"
    roles: [HubOperator]
    code: 200
    input: [damage_pct, is_structural, repair_cost_cents]
    output: DamageClaim
    side_effects: ["status → INSPECTION; damage_triage computes resolution_type"]

  - method: POST
    path: "/oversize-freight/damage-claims/{claimId}/determine"
    description: "Determine liability; creates a Chargeback when the supplier is liable"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["status → DETERMINATION; chargeback_allocation; if SUPPLIER liable → Chargeback(PENDING) created"]

  - method: POST
    path: "/oversize-freight/damage-claims/{claimId}/settle"
    description: "Settle claim (requires linked chargeback resolved first)"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["status → SETTLED; supplier chargeback_rate + compliance_score recomputed"]

  - method: POST
    path: "/oversize-freight/damage-claims/{claimId}/withdraw"
    description: "Withdraw an open claim"
    roles: [Customer, ClaimsAdjuster]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["status → WITHDRAWN"]

  - method: GET
    path: "/oversize-freight/chargebacks"
    description: "List chargebacks"
    roles: [NetworkAdmin, ClaimsAdjuster, SupplierRep]
    code: 200
    input: ["limit?", "offset?", "supplier_id?", "damage_claim_id?", "shipment_id?", "status?"]
    output: "Chargeback[]"
    side_effects: []

  - method: GET
    path: "/oversize-freight/chargebacks/{chargebackId}"
    description: "Get one chargeback"
    roles: [NetworkAdmin, ClaimsAdjuster, SupplierRep]
    code: 200
    input: []
    output: Chargeback
    side_effects: []

  - method: POST
    path: "/oversize-freight/chargebacks/{chargebackId}/settle"
    description: "Settle a chargeback (debits supplier metrics)"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Chargeback
    side_effects: ["status → SETTLED; supplier chargeback_rate + compliance_score recomputed; possible supplier status auto-transition"]

  - method: POST
    path: "/oversize-freight/chargebacks/{chargebackId}/dispute"
    description: "Supplier disputes a pending chargeback (own chargebacks only)"
    roles: [SupplierRep]
    code: 200
    input: []
    output: Chargeback
    side_effects: ["status → DISPUTED"]

  - method: POST
    path: "/oversize-freight/chargebacks/{chargebackId}/reverse"
    description: "Reverse a disputed chargeback"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Chargeback
    side_effects: ["status → REVERSED; supplier metrics recomputed excluding REVERSED"]

  # --- Returns ---
  - method: POST
    path: "/oversize-freight/return-authorizations"
    description: "Request a return authorization"
    roles: [Customer]
    code: 201
    input: [order_id, reason]
    output: ReturnAuthorization
    side_effects: ["status = REQUESTED"]

  - method: GET
    path: "/oversize-freight/return-authorizations"
    description: "List return authorizations"
    roles: [NetworkAdmin, HubOperator, Customer]
    code: 200
    input: ["limit?", "offset?", "order_id?", "status?"]
    output: "ReturnAuthorization[]"
    side_effects: []

  - method: GET
    path: "/oversize-freight/return-authorizations/{raId}"
    description: "Get one return authorization"
    roles: [NetworkAdmin, HubOperator, Customer]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: []

  - method: POST
    path: "/oversize-freight/return-authorizations/{raId}/approve"
    description: "Approve; computes disposal-vs-reverse-haul economics"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: ["status → APPROVED; return_disposition computes disposition, reverse_haul_cost_cents, refurb_value_cents; approved_at = logical clock"]

  - method: POST
    path: "/oversize-freight/return-authorizations/{raId}/deny"
    description: "Deny a requested return"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: ["status → DENIED"]

  - method: POST
    path: "/oversize-freight/return-authorizations/{raId}/complete"
    description: "Complete an approved return"
    roles: [HubOperator]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: ["status → COMPLETED; Order.fulfillment_state FULFILLED → RETURNED"]

  # --- Test-driving ---
  - method: POST
    path: "/oversize-freight/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z; the clock MUST NOT fall back to wall-clock time. Used for promised-date, return-window and expiry determinism."
    roles: [NetworkAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, or SupplierRep acting on another supplier's chargeback" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist (checked left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid required field, enum value outside the declared set" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a valid state for the requested transition" }
  - { id: ERR_SERVICE_LEVEL_NOT_AVAILABLE, http: 422, condition: "ROOM_OF_CHOICE ordered for an item with white_glove_eligible == false" }
  - { id: ERR_ITEM_NOT_LISTED, http: 409, condition: "Order references a DELISTED item or an item whose Supplier is SUSPENDED" }
  - { id: ERR_NO_ROUTE, http: 422, condition: "No hub/lane combination can serve the destination zone for the chosen service level" }
  - { id: ERR_PRICING_UNAVAILABLE, http: 402, condition: "No ACTIVE FreightLane for the selected leg_mode + destination zone" }
  - { id: ERR_INVALID_APPOINTMENT_WINDOW, http: 422, condition: "window_start >= window_end, duration < 2 hours, or window_start in the past" }
  - { id: ERR_APPOINTMENT_OVERLAP, http: 409, condition: "ROOM_OF_CHOICE booking overlaps an existing BOOKED appointment on the same (hub_id, crew_id) under half-open interval semantics" }
  - { id: ERR_HUB_DAILY_CAPACITY_EXCEEDED, http: 409, condition: "Arriving linehaul would exceed Hub.daily_capacity for that calendar date" }
  - { id: ERR_LINEHAUL_CAPACITY_EXCEEDED, http: 409, condition: "Shipment binding would push Linehaul committed_count above capacity (or no PLANNED linehaul with free capacity exists)" }
  - { id: ERR_RETURN_WINDOW_CLOSED, http: 422, condition: "Approve attempted more than 45 days after delivered_at (logical clock)" }
  - { id: ERR_CHARGEBACK_OPEN, http: 409, condition: "DamageClaim settle attempted while its Chargeback is PENDING or DISPUTED" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_shipment_version does not match current Shipment.version (OCC)" }
  - { id: ERR_ITEM_HAS_OPEN_SHIPMENTS, http: 409, condition: "Delist attempted while non-terminal shipments reference the item" }
  - { id: ERR_ORDER_NOT_DELIVERED, http: 409, condition: "ReturnAuthorization approve requires order_state == DELIVERED" }
  - { id: ERR_CLAIM_REQUIRES_INSPECTABLE_SHIPMENT, http: 409, condition: "Inspect requires shipment AT_HUB or DELIVERED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: NetworkAdmin
    description: "Operates the delivery network: suppliers, items, hubs, lanes, linehauls, chargeback adjudication, return approval"
    identity: opaque
    exclusive_operations:
      - "POST /oversize-freight/suppliers"
      - "POST /oversize-freight/items"
      - "POST /oversize-freight/items/{id}/delist"
      - "POST /oversize-freight/hubs"
      - "POST /oversize-freight/freight-lanes"
      - "POST /oversize-freight/customers"
      - "POST /oversize-freight/linehauls"
      - "POST /oversize-freight/linehauls/{id}/depart"
      - "POST /oversize-freight/chargebacks/{id}/settle"
      - "POST /oversize-freight/chargebacks/{id}/reverse"
      - "POST /oversize-freight/return-authorizations/{id}/approve"
      - "POST /oversize-freight/return-authorizations/{id}/deny"
      - "POST /oversize-freight/_clock/set_current_utc"
    shared_operations:
      - "POST /oversize-freight/orders/{id}/cancel"
      - "GET endpoints (all)"

  - name: Customer
    description: "Purchaser; places orders, books appointments, opens claims, requests returns"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /oversize-freight/orders"
      - "POST /oversize-freight/return-authorizations"
    shared_operations:
      - "POST /oversize-freight/appointments"
      - "POST /oversize-freight/appointments/{id}/cancel"
      - "POST /oversize-freight/damage-claims"
      - "POST /oversize-freight/damage-claims/{id}/withdraw"
      - "POST /oversize-freight/orders/{id}/cancel"
      - "GET endpoints (own resources)"

  - name: HubOperator
    description: "Final-mile hub staff; linehaul arrival/miss, appointment completion, inspection"
    identity: opaque
    exclusive_operations:
      - "POST /oversize-freight/linehauls/{id}/arrive"
      - "POST /oversize-freight/linehauls/{id}/mark-missed"
      - "POST /oversize-freight/appointments/{id}/complete"
      - "POST /oversize-freight/appointments/{id}/mark-no-show"
      - "POST /oversize-freight/damage-claims/{id}/inspect"
      - "POST /oversize-freight/return-authorizations/{id}/complete"
    shared_operations:
      - "POST /oversize-freight/appointments"
      - "POST /oversize-freight/appointments/{id}/cancel"
      - "POST /oversize-freight/damage-claims"
      - "GET endpoints (hub-scoped)"

  - name: ClaimsAdjuster
    description: "Determines liability and settles damage claims"
    identity: opaque
    exclusive_operations:
      - "POST /oversize-freight/damage-claims/{id}/determine"
      - "POST /oversize-freight/damage-claims/{id}/settle"
    shared_operations:
      - "POST /oversize-freight/damage-claims/{id}/withdraw"
      - "GET endpoints (claims, chargebacks, scorecards)"

  - name: SupplierRep
    description: "Supplier representative; ships drop-ship orders and disputes own chargebacks"
    identity: "entity_backed:Supplier"
    exclusive_operations:
      - "POST /oversize-freight/chargebacks/{id}/dispute"
    shared_operations:
      - "POST /oversize-freight/shipments/{id}/depart (drop-ship ship confirm)"
      - "POST /oversize-freight/shipments/{id}/deliver (drop-ship delivery confirm)"
      - "GET endpoints (own supplier, shipments, chargebacks, scorecard)"

  - name: CarrierRep
    description: "Parcel/LTL carrier representative; confirms departures and direct deliveries on network shipments"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /oversize-freight/shipments/{id}/depart"
      - "POST /oversize-freight/shipments/{id}/deliver"
