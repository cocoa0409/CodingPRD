# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk of the claim-extraction guide against SCAFFOLD.yaml §1.1-§1.7.
# Clock default = 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: application_create_success
        claim_type: Creation
        grounds: [entities.PermitApplication, endpoints]
        distinguishing_aspect: "POST /permits/applications with all required fields returns 201 with status DRAFT, balance_due_cents 0, deposit_status NONE, and version 1."
        test_recipe:
          setup: ["A venue exists."]
          setup_api_calls:
            - { call: "POST /permits/venues", payload: { name: "Riverside Hall", address: "1 River Rd", occupancy_limit: 200 }, as: PermitClerk, captures: { v: $.data.id } }
          trigger:
            - { call: "POST /permits/applications", payload: { venue_id: "${v}", organizer_name: "Rotary Club", event_name: "Summer Gala", event_start: "2026-06-15T18:00:00Z", event_end: "2026-06-15T23:00:00Z", alcohol_service_hours: 5, expected_attendance: 151, requested_sales_limit_cents: 250050 }, as: Applicant, captures: { a: $.data.id } }
          assert:
            - "PermitApplication.${a}.status == DRAFT"
            - "PermitApplication.${a}.balance_due_cents == 0"
            - "PermitApplication.${a}.deposit_status == NONE"
            - "PermitApplication.${a}.version == 1"

      - name: application_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.PermitApplication, "errors[ERR_APPLICATION_NOT_FOUND]"]
        distinguishing_aspect: "GET /permits/applications/{unknown-uuid} returns 404 ERR_APPLICATION_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - { call: "GET /permits/applications/00000000-0000-0000-0000-000000000000", payload: {}, as: PermitClerk }
          assert:
            - "response.status == 404"
            - "response.error_id == ERR_APPLICATION_NOT_FOUND"

      - name: application_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.PermitApplication.fields.event_name, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /permits/applications omitting event_name returns 400 ERR_VALIDATION."
        test_recipe:
          setup: ["A venue exists."]
          setup_api_calls:
            - { call: "POST /permits/venues", payload: { name: "Riverside Hall", address: "1 River Rd", occupancy_limit: 200 }, as: PermitClerk, captures: { v: $.data.id } }
          trigger:
            - { call: "POST /permits/applications", payload: { venue_id: "${v}", organizer_name: "Rotary Club", event_start: "2026-06-15T18:00:00Z", event_end: "2026-06-15T23:00:00Z", alcohol_service_hours: 5, expected_attendance: 151, requested_sales_limit_cents: 250050 }, as: Applicant }
          assert:
            - "response.status == 400"
            - "response.error_id == ERR_VALIDATION"

      - name: server_invalid_enum_training_provider_rejected
        claim_type: Type Constraints
        grounds: [entities.EventServer.fields.training_provider, "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "POST /permits/servers with training_provider outside {TIPS,SERVSAFE_ALCOHOL,STATE_APPROVED} returns 422 ERR_INVALID_ENUM."
        test_recipe:
          setup: ["A draft application exists."]
          setup_api_calls:
            - { call: "POST /permits/venues", payload: { name: "Riverside Hall", address: "1 River Rd", occupancy_limit: 200 }, as: PermitClerk, captures: { v: $.data.id } }
            - { call: "POST /permits/applications", payload: { venue_id: "${v}", organizer_name: "Rotary Club", event_name: "Summer Gala", event_start: "2026-06-15T18:00:00Z", event_end: "2026-06-15T23:00:00Z", alcohol_service_hours: 5, expected_attendance: 151, requested_sales_limit_cents: 250050 }, as: Applicant, captures: { a: $.data.id } }
          trigger:
            - { call: "POST /permits/servers", payload: { application_id: "${a}", full_name: "Sam Pour", cert_number: "C-1", training_provider: "BOGUS", cert_issued_date: "2025-01-01T00:00:00Z", cert_expiry_date: "2027-01-01T00:00:00Z" }, as: Applicant }
          assert:
            - "response.status == 422"
            - "response.error_id == ERR_INVALID_ENUM"

  - section: endpoints
    instances:
      - name: servers_reverse_lookup_by_application
        claim_type: FK integrity
        grounds: [entities.EventServer.fields.application_id, endpoints]
        distinguishing_aspect: "GET /permits/servers?application_id=<a> returns the EventServer[] whose application_id matches — the reverse-reachability channel for a cascade/child entity."
        test_recipe:
          setup: ["An application with one server."]
          setup_api_calls:
            - { call: "POST /permits/venues", payload: { name: "Riverside Hall", address: "1 River Rd", occupancy_limit: 200 }, as: PermitClerk, captures: { v: $.data.id } }
            - { call: "POST /permits/applications", payload: { venue_id: "${v}", organizer_name: "Rotary Club", event_name: "Summer Gala", event_start: "2026-06-15T18:00:00Z", event_end: "2026-06-15T23:00:00Z", alcohol_service_hours: 5, expected_attendance: 151, requested_sales_limit_cents: 250050 }, as: Applicant, captures: { a: $.data.id } }
            - { call: "POST /permits/servers", payload: { application_id: "${a}", full_name: "Sam Pour", cert_number: "C-1", training_provider: "TIPS", cert_issued_date: "2025-01-01T00:00:00Z", cert_expiry_date: "2027-01-01T00:00:00Z" }, as: Applicant, captures: { s: $.data.id } }
          trigger:
            - { call: "GET /permits/servers?application_id=${a}", payload: {}, as: PermitClerk, captures: { first: "$.data[0].id" } }
          assert:
            - "response.response_type == array"
            - "the returned array contains a server whose id == ${s} and status == PENDING"

      - name: get_application_response_envelope
        claim_type: Retrieval
        grounds: [entities.PermitApplication, response_envelope]
        distinguishing_aspect: "GET /permits/applications/{id} wraps the object in the fixed envelope: meta.api_request_id, response_type=object, data holding the entity."
        test_recipe:
          setup: ["An application exists."]
          setup_api_calls:
            - { call: "POST /permits/venues", payload: { name: "Riverside Hall", address: "1 River Rd", occupancy_limit: 200 }, as: PermitClerk, captures: { v: $.data.id } }
            - { call: "POST /permits/applications", payload: { venue_id: "${v}", organizer_name: "Rotary Club", event_name: "Summer Gala", event_start: "2026-06-15T18:00:00Z", event_end: "2026-06-15T23:00:00Z", alcohol_service_hours: 5, expected_attendance: 151, requested_sales_limit_cents: 250050 }, as: Applicant, captures: { a: $.data.id } }
          trigger:
            - { call: "GET /permits/applications/${a}", payload: {}, as: Applicant }
          assert:
            - "response.response_type == object"
            - "response.meta.api_request_id is present"
            - "response.data.id == ${a}"

      - name: ledger_entries_created_on_submit
        claim_type: Computed read
        grounds: [entities.LedgerEntry, endpoints, calculations.permit_fee]
        distinguishing_aspect: "After submit, GET /permits/ledger-entries?application_id=<a> returns a FEE (+13789) and a DEPOSIT (+20000) entry."
        test_recipe:
          setup: ["A submitted application (fee estimated, deposit assessed)."]
          setup_api_calls:
            - { call: "POST /permits/venues", payload: { name: "Riverside Hall", address: "1 River Rd", occupancy_limit: 200 }, as: PermitClerk, captures: { v: $.data.id } }
            - { call: "POST /permits/applications", payload: { venue_id: "${v}", organizer_name: "Rotary Club", event_name: "Summer Gala", event_start: "2026-06-15T18:00:00Z", event_end: "2026-06-15T23:00:00Z", alcohol_service_hours: 5, expected_attendance: 151, requested_sales_limit_cents: 250050 }, as: Applicant, captures: { a: $.data.id } }
            - { call: "POST /permits/servers", payload: { application_id: "${a}", full_name: "Sam Pour", cert_number: "C-1", training_provider: "TIPS", cert_issued_date: "2025-01-01T00:00:00Z", cert_expiry_date: "2027-01-01T00:00:00Z" }, as: Applicant }
            - { call: "POST /permits/insurance-policies", payload: { application_id: "${a}", insurer_name: "Acme Ins", coverage_cents: 200000000, effective_date: "2026-06-01T00:00:00Z", expiry_date: "2026-07-01T00:00:00Z" }, as: Applicant }
            - { call: "POST /permits/security-plans", payload: { application_id: "${a}", planned_guard_count: 3, plan_summary: "Perimeter" }, as: Applicant }
            - { call: "POST /permits/applications/${a}/submit", payload: {}, as: Applicant }
          trigger:
            - { call: "GET /permits/ledger-entries?application_id=${a}", payload: {}, as: PermitClerk }
          assert:
            - "response.response_type == array"
            - "the array contains an entry entry_type==FEE amount_cents==13789 and an entry entry_type==DEPOSIT amount_cents==20000"

  - section: state_machines
    instances:
      - name: submit_from_non_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.PermitApplication.DRAFT_to_SUBMITTED, "errors[ERR_APPLICATION_NOT_DRAFT]"]
        distinguishing_aspect: "Submitting an already-SUBMITTED application returns 409 ERR_APPLICATION_NOT_DRAFT; no second FEE/DEPOSIT entries are created."
        test_recipe:
          setup: ["A submitted application."]
          setup_api_calls:
            - { call: "POST /permits/venues", payload: { name: "Riverside Hall", address: "1 River Rd", occupancy_limit: 200 }, as: PermitClerk, captures: { v: $.data.id } }
            - { call: "POST /permits/applications", payload: { venue_id: "${v}", organizer_name: "Rotary Club", event_name: "Summer Gala", event_start: "2026-06-15T18:00:00Z", event_end: "2026-06-15T23:00:00Z", alcohol_service_hours: 5, expected_attendance: 151, requested_sales_limit_cents: 250050 }, as: Applicant, captures: { a: $.data.id } }
            - { call: "POST /permits/servers", payload: { application_id: "${a}", full_name: "Sam Pour", cert_number: "C-1", training_provider: "TIPS", cert_issued_date: "2025-01-01T00:00:00Z", cert_expiry_date: "2027-01-01T00:00:00Z" }, as: Applicant }
            - { call: "POST /permits/insurance-policies", payload: { application_id: "${a}", insurer_name: "Acme Ins", coverage_cents: 200000000, effective_date: "2026-06-01T00:00:00Z", expiry_date: "2026-07-01T00:00:00Z" }, as: Applicant }
            - { call: "POST /permits/security-plans", payload: { application_id: "${a}", planned_guard_count: 3, plan_summary: "Perimeter" }, as: Applicant }
            - { call: "POST /permits/applications/${a}/submit", payload: {}, as: Applicant }
          trigger:
            - { call: "POST /permits/applications/${a}/submit", payload: {}, as: Applicant }
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_APPLICATION_NOT_DRAFT"

      - name: verify_already_verified_rejected
        claim_type: Idempotency
        grounds: [state_machines.EventServer.PENDING_to_VERIFIED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Verifying an already-VERIFIED server returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["An application with one server already VERIFIED."]
          setup_api_calls:
            - { call: "POST /permits/venues", payload: { name: "Riverside Hall", address: "1 River Rd", occupancy_limit: 200 }, as: PermitClerk, captures: { v: $.data.id } }
            - { call: "POST /permits/applications", payload: { venue_id: "${v}", organizer_name: "Rotary Club", event_name: "Summer Gala", event_start: "2026-06-15T18:00:00Z", event_end: "2026-06-15T23:00:00Z", alcohol_service_hours: 5, expected_attendance: 151, requested_sales_limit_cents: 250050 }, as: Applicant, captures: { a: $.data.id } }
            - { call: "POST /permits/servers", payload: { application_id: "${a}", full_name: "Sam Pour", cert_number: "C-1", training_provider: "TIPS", cert_issued_date: "2025-01-01T00:00:00Z", cert_expiry_date: "2027-01-01T00:00:00Z" }, as: Applicant, captures: { s: $.data.id } }
            - { call: "POST /permits/servers/${s}/verify", payload: {}, as: PermitClerk }
          trigger:
            - { call: "POST /permits/servers/${s}/verify", payload: {}, as: PermitClerk }
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_INVALID_STATE"

  - section: validations
    instances:
      - name: cert_expired_verify_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_CERT_EXPIRED]", state_machines.EventServer.PENDING_to_VERIFIED]
        distinguishing_aspect: "Verifying a server whose cert_expiry_date (2026-06-10) is before event_end (2026-06-15T23:00Z) returns 422 ERR_CERT_EXPIRED."
        test_recipe:
          setup: ["Application with a server whose cert expires before the event."]
          setup_api_calls:
            - { call: "POST /permits/venues", payload: { name: "Riverside Hall", address: "1 River Rd", occupancy_limit: 200 }, as: PermitClerk, captures: { v: $.data.id } }
            - { call: "POST /permits/applications", payload: { venue_id: "${v}", organizer_name: "Rotary Club", event_name: "Summer Gala", event_start: "2026-06-15T18:00:00Z", event_end: "2026-06-15T23:00:00Z", alcohol_service_hours: 5, expected_attendance: 151, requested_sales_limit_cents: 250050 }, as: Applicant, captures: { a: $.data.id } }
            - { call: "POST /permits/servers", payload: { application_id: "${a}", full_name: "Sam Pour", cert_number: "C-1", training_provider: "TIPS", cert_issued_date: "2025-01-01T00:00:00Z", cert_expiry_date: "2026-06-10T00:00:00Z" }, as: Applicant, captures: { s: $.data.id } }
          trigger:
            - { call: "POST /permits/servers/${s}/verify", payload: {}, as: PermitClerk }
          assert:
            - "response.status == 422"
            - "response.error_id == ERR_CERT_EXPIRED"

      - name: insufficient_security_approve_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_INSUFFICIENT_SECURITY]", calculations.required_security_guards]
        distinguishing_aspect: "Approving a security plan with planned_guard_count 2 when required_security_guards is 3 (attendance 151) returns 422 ERR_INSUFFICIENT_SECURITY."
        test_recipe:
          setup: ["Application (attendance 151) with a security plan of only 2 guards."]
          setup_api_calls:
            - { call: "POST /permits/venues", payload: { name: "Riverside Hall", address: "1 River Rd", occupancy_limit: 200 }, as: PermitClerk, captures: { v: $.data.id } }
            - { call: "POST /permits/applications", payload: { venue_id: "${v}", organizer_name: "Rotary Club", event_name: "Summer Gala", event_start: "2026-06-15T18:00:00Z", event_end: "2026-06-15T23:00:00Z", alcohol_service_hours: 5, expected_attendance: 151, requested_sales_limit_cents: 250050 }, as: Applicant, captures: { a: $.data.id } }
            - { call: "POST /permits/security-plans", payload: { application_id: "${a}", planned_guard_count: 2, plan_summary: "Thin" }, as: Applicant, captures: { sp: $.data.id } }
          trigger:
            - { call: "POST /permits/security-plans/${sp}/approve", payload: {}, as: PermitClerk }
          assert:
            - "response.status == 422"
            - "response.error_id == ERR_INSUFFICIENT_SECURITY"

      - name: insurance_dates_invalid_accept_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_INSURANCE_DATES_INVALID]", state_machines.InsurancePolicy.SUBMITTED_to_ACCEPTED]
        distinguishing_aspect: "Accepting a policy whose effective_date (2026-06-20) is after event_start (2026-06-15) returns 422 ERR_INSURANCE_DATES_INVALID even though coverage is sufficient."
        test_recipe:
          setup: ["Application with a policy that does not span the event."]
          setup_api_calls:
            - { call: "POST /permits/venues", payload: { name: "Riverside Hall", address: "1 River Rd", occupancy_limit: 200 }, as: PermitClerk, captures: { v: $.data.id } }
            - { call: "POST /permits/applications", payload: { venue_id: "${v}", organizer_name: "Rotary Club", event_name: "Summer Gala", event_start: "2026-06-15T18:00:00Z", event_end: "2026-06-15T23:00:00Z", alcohol_service_hours: 5, expected_attendance: 151, requested_sales_limit_cents: 250050 }, as: Applicant, captures: { a: $.data.id } }
            - { call: "POST /permits/insurance-policies", payload: { application_id: "${a}", insurer_name: "Acme Ins", coverage_cents: 200000000, effective_date: "2026-06-20T00:00:00Z", expiry_date: "2026-07-01T00:00:00Z" }, as: Applicant, captures: { ins: $.data.id } }
          trigger:
            - { call: "POST /permits/insurance-policies/${ins}/accept", payload: {}, as: PermitClerk }
          assert:
            - "response.status == 422"
            - "response.error_id == ERR_INSURANCE_DATES_INVALID"

      - name: missing_documents_submit_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_MISSING_REQUIRED_DOCUMENTS]"]
        distinguishing_aspect: "Submitting an application with no EventServer/InsurancePolicy/SecurityPlan returns 422 ERR_MISSING_REQUIRED_DOCUMENTS."
        test_recipe:
          setup: ["A draft application with no supporting documents."]
          setup_api_calls:
            - { call: "POST /permits/venues", payload: { name: "Riverside Hall", address: "1 River Rd", occupancy_limit: 200 }, as: PermitClerk, captures: { v: $.data.id } }
            - { call: "POST /permits/applications", payload: { venue_id: "${v}", organizer_name: "Rotary Club", event_name: "Summer Gala", event_start: "2026-06-15T18:00:00Z", event_end: "2026-06-15T23:00:00Z", alcohol_service_hours: 5, expected_attendance: 151, requested_sales_limit_cents: 250050 }, as: Applicant, captures: { a: $.data.id } }
          trigger:
            - { call: "POST /permits/applications/${a}/submit", payload: {}, as: Applicant }
          assert:
            - "response.status == 422"
            - "response.error_id == ERR_MISSING_REQUIRED_DOCUMENTS"

      - name: invalid_date_range_submit_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_DATE_RANGE]"]
        distinguishing_aspect: "Submitting an application whose event_end (17:00) is not strictly after event_start (18:00) returns 400 ERR_INVALID_DATE_RANGE."
        test_recipe:
          setup: ["A draft application with inverted event times but the three documents present."]
          setup_api_calls:
            - { call: "POST /permits/venues", payload: { name: "Riverside Hall", address: "1 River Rd", occupancy_limit: 200 }, as: PermitClerk, captures: { v: $.data.id } }
            - { call: "POST /permits/applications", payload: { venue_id: "${v}", organizer_name: "Rotary Club", event_name: "Summer Gala", event_start: "2026-06-15T18:00:00Z", event_end: "2026-06-15T17:00:00Z", alcohol_service_hours: 5, expected_attendance: 151, requested_sales_limit_cents: 250050 }, as: Applicant, captures: { a: $.data.id } }
            - { call: "POST /permits/servers", payload: { application_id: "${a}", full_name: "Sam Pour", cert_number: "C-1", training_provider: "TIPS", cert_issued_date: "2025-01-01T00:00:00Z", cert_expiry_date: "2027-01-01T00:00:00Z" }, as: Applicant }
            - { call: "POST /permits/insurance-policies", payload: { application_id: "${a}", insurer_name: "Acme Ins", coverage_cents: 200000000, effective_date: "2026-06-01T00:00:00Z", expiry_date: "2026-07-01T00:00:00Z" }, as: Applicant }
            - { call: "POST /permits/security-plans", payload: { application_id: "${a}", planned_guard_count: 3, plan_summary: "Perimeter" }, as: Applicant }
          trigger:
            - { call: "POST /permits/applications/${a}/submit", payload: {}, as: Applicant }
          assert:
            - "response.status == 400"
            - "response.error_id == ERR_INVALID_DATE_RANGE"

      - name: invalid_payment_amount_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_INVALID_PAYMENT_AMOUNT]", entities.LedgerEntry]
        distinguishing_aspect: "A payment with amount_cents 0 returns 400 ERR_INVALID_PAYMENT_AMOUNT and does not bump application.version."
        test_recipe:
          setup: ["A submitted application with an outstanding balance."]
          setup_api_calls:
            - { call: "POST /permits/venues", payload: { name: "Riverside Hall", address: "1 River Rd", occupancy_limit: 200 }, as: PermitClerk, captures: { v: $.data.id } }
            - { call: "POST /permits/applications", payload: { venue_id: "${v}", organizer_name: "Rotary Club", event_name: "Summer Gala", event_start: "2026-06-15T18:00:00Z", event_end: "2026-06-15T23:00:00Z", alcohol_service_hours: 5, expected_attendance: 151, requested_sales_limit_cents: 250050 }, as: Applicant, captures: { a: $.data.id } }
            - { call: "POST /permits/servers", payload: { application_id: "${a}", full_name: "Sam Pour", cert_number: "C-1", training_provider: "TIPS", cert_issued_date: "2025-01-01T00:00:00Z", cert_expiry_date: "2027-01-01T00:00:00Z" }, as: Applicant }
            - { call: "POST /permits/insurance-policies", payload: { application_id: "${a}", insurer_name: "Acme Ins", coverage_cents: 200000000, effective_date: "2026-06-01T00:00:00Z", expiry_date: "2026-07-01T00:00:00Z" }, as: Applicant }
            - { call: "POST /permits/security-plans", payload: { application_id: "${a}", planned_guard_count: 3, plan_summary: "Perimeter" }, as: Applicant }
            - { call: "POST /permits/applications/${a}/submit", payload: {}, as: Applicant }
            - { call: "GET /permits/applications/${a}", payload: {}, as: Applicant, captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /permits/applications/${a}/payments", payload: { amount_cents: 0, expected_application_version: "${pv}" }, as: Applicant }
          assert:
            - "response.status == 400"
            - "response.error_id == ERR_INVALID_PAYMENT_AMOUNT"

  - section: rbac
    instances:
      - name: applicant_cannot_open_review
        claim_type: RBAC denial
        grounds: [roles.Applicant, roles.PermitClerk, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "An Applicant calling POST /permits/applications/{id}/open-review (a PermitClerk-only op) returns 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["A submitted application exists."]
          setup_api_calls:
            - { call: "POST /permits/venues", payload: { name: "Riverside Hall", address: "1 River Rd", occupancy_limit: 200 }, as: PermitClerk, captures: { v: $.data.id } }
            - { call: "POST /permits/applications", payload: { venue_id: "${v}", organizer_name: "Rotary Club", event_name: "Summer Gala", event_start: "2026-06-15T18:00:00Z", event_end: "2026-06-15T23:00:00Z", alcohol_service_hours: 5, expected_attendance: 151, requested_sales_limit_cents: 250050 }, as: Applicant, captures: { a: $.data.id } }
          trigger:
            - { call: "POST /permits/applications/${a}/open-review", payload: {}, as: Applicant }
          assert:
            - "response.status == 403"
            - "response.error_id == ERR_UNAUTHORIZED"

      - name: reviewer_cannot_create_venue
        claim_type: RBAC denial
        grounds: [roles.AgencyReviewer, roles.PermitClerk, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "An AgencyReviewer calling POST /permits/venues (PermitClerk-only) returns 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - { call: "POST /permits/venues", payload: { name: "X Hall", address: "0 Nowhere", occupancy_limit: 50 }, as: AgencyReviewer }
          assert:
            - "response.status == 403"
            - "response.error_id == ERR_UNAUTHORIZED"

      - name: create_venue_unauthenticated_rejected
        claim_type: RBAC denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "POST /permits/venues with missing X-User-ID/X-User-Role headers returns 401 ERR_UNAUTHENTICATED (auth precedes authorization)."
        test_recipe:
          setup: ["Empty database; request sent with no auth headers."]
          setup_api_calls: []
          trigger:
            - { call: "POST /permits/venues", payload: { name: "X Hall", address: "0 Nowhere", occupancy_limit: 50 }, as: PermitClerk }
          assert:
            - "with X-User-ID and X-User-Role headers omitted, response.status == 401"
            - "response.error_id == ERR_UNAUTHENTICATED"

