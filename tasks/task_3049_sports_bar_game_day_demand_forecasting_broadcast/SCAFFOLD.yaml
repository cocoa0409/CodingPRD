  # --- Test-driving endpoints ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock. Default server time is 2026-09-01T00:00:00Z; the clock never falls back to wall-clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["blackout windows, hold timers, and kickoff overrides re-evaluated"]

# =============================================================================
# §1.6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role / X-User-ID"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this operation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist or is out of scope"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed payload, missing required field, or invalid enum"
  - id: ERR_INVALID_STATE
    http: 400
    condition: "Resource not in a valid state for the requested transition"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match current version"
  - id: ERR_EVENT_WINDOW_CONFLICT
    http: 400
    condition: "Event, shift, or promo window is invalid or conflicts"
  - id: ERR_SCREEN_ALREADY_ASSIGNED
    http: 409
    condition: "screen_id already has an ACTIVE assignment in this zone"
  - id: ERR_BLACKOUT_WINDOW_ACTIVE
    http: 400
    condition: "Assignment would violate an active blackout window"
  - id: ERR_LICENSE_NOT_ACTIVE
    http: 400
    condition: "License for the league is not ACTIVE"
  - id: ERR_WAITLIST_FULL
    http: 400
    condition: "All zones are FULL; waitlist join rejected"
  - id: ERR_TABLE_HOLD_EXPIRED
    http: 400
    condition: "Called party did not check in within the hold window"
  - id: ERR_TOO_MANY_NO_SHOWS
    http: 400
    condition: "Guest has 3 or more unredemed no-shows"
  - id: ERR_PPV_REQUIRES_EVENT
    http: 400
    condition: "PPV check must reference an Event with kind=PPV"
  - id: ERR_CONTEST_NOT_OPEN
    http: 400
    condition: "Fantasy contest is not OPEN for registration"
  - id: ERR_PROMO_WINDOW_INVALID
    http: 400
    condition: "Promo end_date before start_date or overlapping rule for same kind/day"
  - id: ERR_SHIFT_WINDOW_INVALID
    http: 400
    condition: "Shift end_time must be after start_time"
  - id: ERR_QUANTITY_INVALID
    http: 400
    condition: "Pieces or portion_count must be a positive integer"
  - id: ERR_PRIZE_STRUCTURE_INVALID
    http: 400
    condition: "prize_structure shares must sum to 1.0 within 0.001"
  - id: ERR_CAPACITY_EXCEEDED
    http: 400
    condition: "Operation would exceed venue or zone capacity"
  - id: ERR_GUEST_NOT_FOUND
    http: 404
    condition: "Referenced guest does not exist"
  - id: ERR_EVENT_NOT_FOUND
    http: 404
    condition: "Referenced event does not exist"

# =============================================================================
# §1.7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "System operator; manages venues, licenses, clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/venues"
      - "POST /api/licenses/{license_id}/suspend"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints across all resources"
  - name: VenueManager
    description: "Single-venue operator; owns pricing, staffing, zoning, fantasy, PPV"
    identity: opaque
    exclusive_operations:
      - "PATCH /api/venues/{venue_id}/wing-cost"
      - "POST /api/venues/{venue_id}/licenses"
      - "POST /api/venues/{venue_id}/zones"
      - "POST /api/venues/{venue_id}/staffing-plans"
      - "POST /api/staffing-plans/{plan_id}/publish"
      - "POST /api/staffing-plans/{plan_id}/revert"
      - "POST /api/staffing-plans/{plan_id}/lock"
      - "POST /api/promo-rules"
      - "POST /api/venues/{venue_id}/ppv-events"
      - "POST /api/venues/{venue_id}/fantasy-contests"
      - "POST /api/fantasy-contests/{contest_id}/open"
      - "POST /api/fantasy-contests/{contest_id}/lock"
      - "POST /api/fantasy-contests/{contest_id}/settle"
      - "POST /api/fantasy-contests/{contest_id}/cancel"
      - "POST /api/checks/{check_id}/void"
      - "POST /api/trivia-sessions/{session_id}/settle"
    shared_operations:
      - "GET endpoints"
      - "POST /api/zones/{zone_id}/screen-assignments"
      - "DELETE /api/zones/{zone_id}/screen-assignments/{assignment_id}"
      - "POST /api/venues/{venue_id}/wing-pricing/quote"
  - name: Host
    description: "Front-of-house; manages waitlist and trivia registration"
    identity: opaque
    exclusive_operations:
      - "POST /api/waitlist"
      - "POST /api/waitlist/{entry_id}/call"
      - "POST /api/waitlist/{entry_id}/seat"
      - "POST /api/waitlist/{entry_id}/cancel"
      - "POST /api/venues/{venue_id}/trivia-sessions"
      - "POST /api/trivia-sessions/{session_id}/entries"
      - "POST /api/trivia-entries/{entry_id}/answers"
      - "POST /api/trivia-sessions/{session_id}/close"
    shared_operations:
      - "GET endpoints"
      - "POST /api/guests"
      - "POST /api/zones/{zone_id}/screen-assignments"
      - "DELETE /api/zones/{zone_id}/screen-assignments/{assignment_id}"
      - "POST /api/fantasy-contests/{contest_id}/entries"
  - name: Server
    description: "Table service; manages checks and order lines"
    identity: opaque
    exclusive_operations:
      - "POST /api/checks"
      - "POST /api/checks/{check_id}/order-lines"
      - "POST /api/order-lines/{line_id}/void"
      - "POST /api/checks/{check_id}/settle"
    shared_operations:
      - "GET endpoints"
      - "POST /api/guests"
      - "POST /api/fantasy-contests/{contest_id}/entries"
  - name: Scheduler
    description: "Event feed operator; ingests and cancels events"
    identity: opaque
    exclusive_operations:
      - "POST /api/events"
      - "POST /api/events/{event_id}/cancel"
    shared_operations:
      - "GET endpoints"
