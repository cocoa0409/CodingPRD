# =============================================================================
# Sports Game Licensing, Roster Updates & Likeness Royalties — Scaffold Seed
# Domain: sports-game-licensing
# =============================================================================

scenario: |
  Sports Game Licensing, Roster Updates & Likeness Royalties (EA Sports): league and
  players association license agreements defining exclusivity, term and royalty
  structures, individual likeness rights including retired players and college
  athletes with opt-in and payment administration, roster data operations updating
  player attributes, transactions and appearance throughout a season, live service
  content cadence with in-game economies and item drops, competitive gaming programs
  sanctioned with the league and prize administration, audio licensing for
  commentary, music and stadium sound with usage terms, regional edition differences
  and censorship requirements, royalty reporting and audit rights held by leagues
  and unions.

domain_name: sports-game-licensing
api_prefix: /licensing

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - temporal_windowing
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: LicenseAgreement
    parent: null
    common_fields: true
    fields:
      - { name: licensor_type, type: enum, source: input, description: "LEAGUE | PLAYERS_ASSOCIATION | COLLEGE_BODY" }
      - { name: licensor_name, type: string, source: input, description: "Display name of league/PA/college body" }
      - { name: exclusivity_scope, type: enum, source: input, description: "NONE | CATEGORY | FULL — whether the licensor grants exclusive simulation rights in a sport category" }
      - { name: sport_category, type: string, source: input, description: "Sport category code the license applies to (e.g. AMFOOT_PRO, BASKET_PRO, SOCCER_INTL)" }
      - { name: term_start_on, type: string, source: input, description: "ISO date (YYYY-MM-DD), inclusive lower bound of the license term" }
      - { name: term_end_on, type: string, source: input, description: "ISO date, inclusive upper bound of the license term" }
      - { name: royalty_model, type: enum, source: input, description: "PERCENT_OF_NET | PER_UNIT | HYBRID — base royalty structure" }
      - { name: royalty_rate_bps, type: integer, source: input, description: "Base royalty rate in basis points (e.g. 1200 = 12.00%)" }
      - { name: minimum_guarantee_cents, type: integer, source: input, description: "Minimum guarantee owed to licensor over the term, in cents" }
      - { name: mg_recoupable, type: boolean, source: input, description: "Whether royalty accruals recoup against the minimum guarantee before cash is owed" }
      - { name: agreement_status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | EXPIRED | TERMINATED" }
      - { name: audit_window_days, type: integer, source: input, description: "Number of days after a royalty statement FINALIZED during which licensor may open an audit" }
      - { name: outstanding_royalty_cents, type: integer, source: computed, description: "Sum of accrued minus paid minus held royalty over FINALIZED statements" }
      - { name: recouped_against_mg_cents, type: integer, source: computed, description: "Portion of minimum guarantee already recouped by accruals" }

  - name: Athlete
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Athlete display name" }
      - { name: sport_category, type: string, source: input, description: "Sport category this athlete plays in" }
      - { name: athlete_class, type: enum, source: input, description: "ACTIVE_PRO | RETIRED | COLLEGE — drives likeness royalty class" }
      - { name: college_opt_in, type: boolean, source: input, description: "True only when athlete_class == COLLEGE and the athlete has opted in under the NIL program; otherwise must be false" }
      - { name: athlete_status, type: enum, source: system, description: "ELIGIBLE | INELIGIBLE — derived from likeness grant coverage" }
      - { name: current_overall_rating, type: integer, source: computed, description: "Latest published overall rating 40..99 from roster ops" }

  - name: LikenessGrant
    parent: null
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id; the athlete whose likeness is granted" }
      - { name: agreement_id, type: string, source: input, description: "FK -> LicenseAgreement.id under which this likeness is licensed (league PA or individual)" }
      - { name: grant_kind, type: enum, source: input, description: "GROUP_PA | INDIVIDUAL_RETIRED | NIL_COLLEGE" }
      - { name: term_start_on, type: string, source: input, description: "ISO date inclusive start of likeness grant" }
      - { name: term_end_on, type: string, source: input, description: "ISO date inclusive end of likeness grant" }
      - { name: royalty_share_bps, type: integer, source: input, description: "Athlete share of the likness royalty pool in basis points" }
      - { name: payment_destination, type: string, source: input, description: "Remittance reference for royalty payment admin" }
      - { name: grant_status, type: enum, source: system, description: "PENDING | GRANTED | SUSPENDED | REVOKED | EXPIRED" }
      - { name: suspended_reason, type: string, source: system, description: "Reason code when SUSPENDED; null otherwise" }

  - name: LiveSeason
    parent: null
    common_fields: true
    fields:
      - { name: title_code, type: string, source: input, description: "Game title code (e.g. PIGSKIN26)" }
      - { name: sport_category, type: string, source: input, description: "Sport category this season simulates" }
      - { name: season_label, type: string, source: input, description: "Human label e.g. 2026-27" }
      - { name: agreement_id, type: string, source: input, description: "FK -> LicenseAgreement.id governing this season's simulation rights" }
      - { name: season_status, type: enum, source: system, description: "PRELAUNCH | LIVE | SUNSET | ARCHIVED" }
      - { name: season_opens_on, type: string, source: input, description: "ISO date the season goes live" }
      - { name: season_closes_on, type: string, source: input, description: "ISO date the season sunsets" }
      - { name: roster_epoch, type: integer, source: system, description: "Monotonic roster publication epoch, starts 0, incremented on each RosterBatch publish" }

  - name: RosterBatch
    parent: LiveSeason
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> LiveSeason.id this batch updates" }
      - { name: batch_label, type: string, source: input, description: "Operator label e.g. WEEK_05_UPDATE" }
      - { name: batch_status, type: enum, source: system, description: "DRAFT | VALIDATED | REJECTED | PUBLISHED | SUPERSEDED | ROLLED_BACK" }
      - { name: submitted_by, type: string, source: input, description: "Operator id submitting the batch" }
      - { name: supersedes_batch_id, type: string, source: system, description: "FK -> RosterBatch.id of the batch this one supersedes on publish; null for the first publish" }
      - { name: published_epoch, type: integer, source: system, description: "Season roster_epoch assigned at publish; null until PUBLISHED" }

  - name: RosterEntry
    parent: RosterBatch
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: input, description: "FK -> RosterBatch.id owning this entry" }
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id the entry describes" }
      - { name: entry_kind, type: enum, source: input, description: "ADD | UPDATE_ATTRIBUTE | TRANSACTION | REMOVE | APPEARANCE" }
      - { name: overall_rating, type: integer, source: input, description: "New overall rating 40..99; required for ADD and UPDATE_ATTRIBUTE" }
      - { name: transaction_detail, type: string, source: input, description: "Free-text transaction note for TRANSACTION entries (trade, IR, suspension)" }
      - { name: entry_status, type: enum, source: system, description: "STAGED | APPLIED | DROPPED" }

  - name: ContentDrop
    parent: LiveSeason
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> LiveSeason.id the drop belongs to" }
      - { name: drop_kind, type: enum, source: input, description: "ITEM_PACK | PLAYER_CARD | VANITY | STADIUM_THEME" }
      - { name: drop_label, type: string, source: input, description: "Label of the drop" }
      - { name: featured_athlete_id, type: string, source: input, description: "FK -> Athlete.id featured in this drop; required for PLAYER_CARD, otherwise null" }
      - { name: price_vc, type: integer, source: input, description: "Price in virtual currency units; 0 for free drops" }
      - { name: scheduled_start_at, type: string, source: input, description: "ISO datetime the drop becomes purchasable" }
      - { name: scheduled_end_at, type: string, source: input, description: "ISO datetime the drop leaves the store" }
      - { name: drop_status, type: enum, source: system, description: "SCHEDULED | RELEASED | HELD | ENDED | CANCELED" }

  - name: PlayerWallet
    parent: LiveSeason
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> LiveSeason.id scoping this wallet" }
      - { name: owner_tag, type: string, source: input, description: "External player account tag" }
      - { name: vc_balance, type: integer, source: computed, description: "Virtual currency balance; never negative" }
      - { name: wallet_status, type: enum, source: system, description: "OPEN | FROZEN | CLOSED" }

  - name: WalletLedgerEntry
    parent: PlayerWallet
    common_fields: false
    fields:
      - { name: wallet_id, type: string, source: input, description: "FK -> PlayerWallet.id this entry posts to" }
      - { name: direction, type: enum, source: input, description: "CREDIT | DEBIT" }
      - { name: amount_vc, type: integer, source: input, description: "Amount in virtual currency units; must be > 0" }
      - { name: reason_code, type: enum, source: input, description: "GRANT | PURCHASE | SPEND_DROP | REFUND | CLAWBACK | PRIZE_PAYOUT" }
      - { name: reference_id, type: string, source: input, description: "Optional reference to a ContentDrop or TournamentPrize id" }
      - { name: entry_status, type: enum, source: system, description: "POSTED — ledger entries are append-only and immediately POSTED" }

  - name: TournamentProgram
    parent: LiveSeason
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> LiveSeason.id the program runs under" }
      - { name: program_label, type: string, source: input, description: "Program label e.g. LEAGUE_CUP_Q3" }
      - { name: league_sanctioned, type: boolean, source: input, description: "True only when sanctioned by the governing league; gates prize administration" }
      - { name: entry_fee_vc, type: integer, source: input, description: "Entry fee in virtual currency; 0 for open qualifiers" }
      - { name: registration_opens_at, type: string, source: input, description: "ISO datetime registration opens" }
      - { name: registration_closes_at, type: string, source: input, description: "ISO datetime registration closes" }
      - { name: program_status, type: enum, source: system, description: "ANNOUNCED | REGISTRATION_OPEN | REGISTRATION_CLOSED | COMPLETED | PAYOUT_FINALIZED | CANCELED" }
      - { name: prize_pool_vc, type: integer, source: computed, description: "Total prize pool in virtual currency, derived from entries" }

  - name: TournamentEntry
    parent: TournamentProgram
    common_fields: false
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> TournamentProgram.id" }
      - { name: wallet_id, type: string, source: input, description: "FK -> PlayerWallet.id of the entrant" }
      - { name: fee_paid, type: boolean, source: system, description: "True when the entry-fee debit succeeded at registration (always true when entry_fee_vc == 0)" }
      - { name: placement, type: integer, source: input, description: "Final placement 1..N once results are recorded; null before COMPLETED" }
      - { name: entry_status, type: enum, source: system, description: "REGISTERED | CONFIRMED | DISQUALIFIED | REFUNDED" }

  - name: TournamentPrize
    parent: TournamentProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> TournamentProgram.id" }
      - { name: placement, type: integer, source: input, description: "Placement this prize row pays (1 = first)" }
      - { name: share_bps, type: integer, source: input, description: "Share of the prize pool in basis points; rows for one program must total 10000" }
      - { name: prize_status, type: enum, source: system, description: "PLANNED | PROJECTED | PAYABLE | PAID | VOIDED" }
      - { name: projected_amount_vc, type: integer, source: computed, description: "Pool share under the projected (registered-inclusive) pool" }
      - { name: final_amount_vc, type: integer, source: computed, description: "Pool share under the final (confirmed-only) pool; null until PAYOUT_FINALIZED" }

  - name: AudioAsset
    parent: null
    common_fields: true
    fields:
      - { name: asset_kind, type: enum, source: input, description: "COMMENTARY_LINE | MUSIC_TRACK | STADIUM_SOUND" }
      - { name: asset_title, type: string, source: input, description: "Title of the audio asset" }
      - { name: rights_holder, type: string, source: input, description: "Rights holder name (label, commentator estate, stadium operator)" }
      - { name: asset_status, type: enum, source: system, description: "CLEARED | BLOCKED | RETIRED" }

  - name: AudioLicense
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> AudioAsset.id being licensed" }
      - { name: term_start_on, type: string, source: input, description: "ISO date inclusive start of audio usage rights" }
      - { name: term_end_on, type: string, source: input, description: "ISO date inclusive end of audio usage rights" }
      - { name: usage_scope, type: enum, source: input, description: "MENU_ONLY | IN_GAME | BROADCAST_SIM | ALL — permitted usage contexts" }
      - { name: region_scope, type: string, source: input, description: "Region code the license covers, or GLOBAL" }
      - { name: license_status, type: enum, source: system, description: "ACTIVE | LAPSED | TERMINATED" }

  - name: RegionalEdition
    parent: LiveSeason
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> LiveSeason.id the edition ships for" }
      - { name: region_code, type: string, source: input, description: "Region code e.g. NA, EU, DE, AU, CN" }
      - { name: edition_status, type: enum, source: system, description: "DRAFT | IN_REVIEW | APPROVED | RELEASED | WITHDRAWN" }
      - { name: censorship_flags, type: array, source: input, description: "Array of censorship directives applied (e.g. [NO_REAL_PLAYER_NAMES, NO_BLOOD_OVERLAYS])" }
      - { name: embargo_until_on, type: string, source: input, description: "ISO date; edition may not RELEASE before this date" }

  - name: RoyaltyStatement
    parent: LicenseAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> LicenseAgreement.id the statement reports against" }
      - { name: period_start_on, type: string, source: input, description: "ISO date inclusive start of royalty period" }
      - { name: period_end_on, type: string, source: input, description: "ISO date inclusive end of royalty period" }
      - { name: statement_status, type: enum, source: system, description: "OPEN | PROVISIONAL | FINALIZED | DISPUTED | PAID" }
      - { name: gross_sales_cents, type: integer, source: input, description: "Reported gross sales for the period" }
      - { name: returns_cents, type: integer, source: input, description: "Reported returns/credits for the period" }
      - { name: pending_sales_cents, type: integer, source: input, description: "Portion of gross sales still in PENDING settlement at period close; excluded from the FINAL accrual variant but included in PROVISIONAL" }
      - { name: accrued_royalty_cents, type: integer, source: computed, description: "Royalty accrued under the agreement's royalty model" }
      - { name: held_royalty_cents, type: integer, source: computed, description: "Royalty held back due to suspended likeness grants" }
      - { name: paid_royalty_cents, type: integer, source: computed, description: "Royalty actually remitted" }

  - name: AuditCase
    parent: LicenseAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> LicenseAgreement.id being audited" }
      - { name: statement_id, type: string, source: input, description: "FK -> RoyaltyStatement.id under audit" }
      - { name: opened_by_role, type: enum, source: input, description: "LEAGUE_AUDITOR | UNION_AUDITOR — which body opened the case" }
      - { name: audit_status, type: enum, source: system, description: "OPEN | FINDINGS_FILED | SETTLED | CLOSED" }
      - { name: finding_delta_cents, type: integer, source: input, description: "Signed adjustment discovered by the audit; 0 when no discrepancy" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: LicenseAgreement
    field: agreement_status
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /licensing/agreements/{agreement_id}/activate"
        actor: LicensingAdmin
        preconditions:
          - "term_start_on <= current clock date <= term_end_on"
          - "If exclusivity_scope in {CATEGORY, FULL}: no other LicenseAgreement with same sport_category and exclusivity_scope != NONE whose term [term_start_on, term_end_on] overlaps this one, in status ACTIVE or SUSPENDED"
        side_effects:
          - "Increments LicenseAgreement.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /licensing/agreements/{agreement_id}/suspend"
        actor: LicensingAdmin
        preconditions:
          - "agreement is ACTIVE"
        side_effects:
          - "All LikenessGrant rows referencing this agreement in GRANTED move to SUSPENDED (suspended_reason = AGREEMENT_SUSPENDED)"
          - "Each such LikenessGrant suspension cascades: every ContentDrop whose featured_athlete_id points at an athlete whose only GRANTED grant was suspended moves RELEASED -> HELD"
          - "Each HELD ContentDrop in turn flags its RoyaltyLineItem accruals as held (held_royalty_cents on the open RoyaltyStatement increases)"
          - "Increments LicenseAgreement.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /licensing/agreements/{agreement_id}/reinstate"
        actor: LicensingAdmin
        preconditions:
          - "agreement is SUSPENDED"
          - "current clock date <= term_end_on"
        side_effects:
          - "LikenessGrant rows suspended with suspended_reason = AGREEMENT_SUSPENDED return to GRANTED"
          - "ContentDrop rows HELD whose featured athlete again has a GRANTED grant return to RELEASED"
          - "held_royalty_cents on the open statement decreases accordingly"
          - "Increments LicenseAgreement.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock date passes term_end_on)"
        actor: system
        preconditions:
          - "current clock date > term_end_on"
        side_effects:
          - "LiveSeason rows referencing this agreement in LIVE move to SUNSET"
          - "ContentDrop rows in RELEASED under those seasons move to ENDED"
          - "LikenessGrant rows in GRANTED under this agreement move to EXPIRED"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /licensing/agreements/{agreement_id}/terminate"
        actor: LicensingAdmin
        preconditions:
          - "agreement is SUSPENDED"
          - "No AuditCase on this agreement in OPEN or FINDINGS_FILED"
        side_effects:
          - "LikenessGrant rows under this agreement move to REVOKED"
          - "LiveSeason rows referencing this agreement in PRELAUNCH or LIVE move to ARCHIVED"
          - "ContentDrop rows not in ENDED or CANCELED move to CANCELED"
          - "Increments LicenseAgreement.version by 1"

  - entity: LikenessGrant
    field: grant_status
    initial_state: PENDING
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /licensing/likeness-grants/{grant_id}/grant"
        actor: RightsOfficer
        preconditions:
          - "Referenced LicenseAgreement is ACTIVE"
          - "Referenced Athlete exists; if Athlete.athlete_class == COLLEGE then Athlete.college_opt_in must be true"
          - "grant term [term_start_on, term_end_on] is contained in the agreement term"
        side_effects:
          - "If Athlete has at least one GRANTED grant now, Athlete.athlete_status -> ELIGIBLE"
      - from: GRANTED
        to: SUSPENDED
        trigger: "POST /licensing/likeness-grants/{grant_id}/suspend OR cascade from LicenseAgreement suspend"
        actor: RightsOfficer
        preconditions:
          - "grant is GRANTED"
        side_effects:
          - "Athlete.athlete_status -> INELIGIBLE when no other GRANTED grant remains for the athlete"
          - "Every ContentDrop RELEASED with featured_athlete_id == this athlete moves to HELD"
          - "held_royalty_cents on the open RoyaltyStatement increases by the per-drop royalty attributable to the athlete"
      - from: SUSPENDED
        to: GRANTED
        trigger: "POST /licensing/likeness-grants/{grant_id}/reinstate OR cascade from LicenseAgreement reinstate"
        actor: RightsOfficer
        preconditions:
          - "grant is SUSPENDED"
          - "Referenced LicenseAgreement is ACTIVE"
        side_effects:
          - "Athlete.athlete_status -> ELIGIBLE"
          - "ContentDrop rows HELD because of this grant return to RELEASED"
          - "held_royalty_cents decreases correspondingly"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /licensing/likeness-grants/{grant_id}/revoke"
        actor: RightsOfficer
        preconditions:
          - "grant is SUSPENDED"
        side_effects:
          - "Athlete.athlete_status -> INELIGIBLE if no other GRANTED grant remains"
          - "ContentDrop rows HELD for this athlete move to CANCELED (not released)"
      - from: GRANTED
        to: EXPIRED
        trigger: "system (clock date passes term_end_on)"
        actor: system
        preconditions:
          - "current clock date > term_end_on"
        side_effects:
          - "Athlete.athlete_status -> INELIGIBLE if no other GRANTED grant remains"

  - entity: LiveSeason
    field: season_status
    initial_state: PRELAUNCH
    terminal_states: [ARCHIVED]
    transitions:
      - from: PRELAUNCH
        to: LIVE
        trigger: "POST /licensing/seasons/{season_id}/launch"
        actor: LiveOpsManager
        preconditions:
          - "Referenced LicenseAgreement is ACTIVE"
          - "current clock date >= season_opens_on"
          - "At least one RosterBatch for this season is PUBLISHED"
        side_effects:
          - "Increments LiveSeason.version by 1"
      - from: LIVE
        to: SUNSET
        trigger: "POST /licensing/seasons/{season_id}/sunset OR cascade from agreement expiry"
        actor: LiveOpsManager
        preconditions:
          - "season is LIVE"
        side_effects:
          - "ContentDrop rows in RELEASED move to ENDED"
          - "PlayerWallet rows under this season in OPEN move to FROZEN"
          - "TournamentProgram rows in ANNOUNCED or REGISTRATION_OPEN move to CANCELED; entry fees refunded via WalletLedgerEntry REFUND credits"
      - from: SUNSET
        to: ARCHIVED
        trigger: "POST /licensing/seasons/{season_id}/archive"
        actor: LiveOpsManager
        preconditions:
          - "season is SUNSET"
          - "No TournamentProgram under this season in REGISTRATION_OPEN, REGISTRATION_CLOSED, or COMPLETED (must be PAYOUT_FINALIZED or CANCELED)"
          - "No RoyaltyStatement on the season's governing agreement in OPEN, PROVISIONAL, or DISPUTED"
        side_effects:
          - "PlayerWallet rows FROZEN move to CLOSED"

  - entity: RosterBatch
    field: batch_status
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED, ROLLED_BACK]
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /licensing/roster-batches/{batch_id}/validate"
        actor: RosterOperator
        preconditions:
          - "Batch has at least one RosterEntry"
          - "Every entry's athlete exists and (for ADD/UPDATE_ATTRIBUTE) has athlete_status == ELIGIBLE"
          - "Every ADD/UPDATE_ATTRIBUTE entry has overall_rating in 40..99"
        side_effects: []
      - from: DRAFT
        to: REJECTED
        trigger: "POST /licensing/roster-batches/{batch_id}/reject"
        actor: RosterReviewer
        preconditions:
          - "batch is DRAFT"
        side_effects:
          - "All RosterEntry rows move to DROPPED"
      - from: VALIDATED
        to: REJECTED
        trigger: "POST /licensing/roster-batches/{batch_id}/reject"
        actor: RosterReviewer
        preconditions:
          - "batch is VALIDATED"
        side_effects:
          - "All RosterEntry rows move to DROPPED"
      - from: VALIDATED
        to: PUBLISHED
        trigger: "POST /licensing/roster-batches/{batch_id}/publish"
        actor: RosterReviewer
        preconditions:
          - "batch is VALIDATED"
          - "expected_season_version matches the parent LiveSeason.version (OCC)"
          - "The submitting RosterOperator (submitted_by) is NOT the acting RosterReviewer (segregation of duties)"
        side_effects:
          - "Season roster_epoch increments by 1; batch.published_epoch set"
          - "The previously PUBLISHED batch for this season (if any) moves to SUPERSEDED; batch.supersedes_batch_id points to it"
          - "Each RosterEntry moves STAGED -> APPLIED; for ADD/UPDATE_ATTRIBUTE the Athlete.current_overall_rating is set to the entry's overall_rating (later entries in the same batch by created_at ASC order win)"
          - "Increments LiveSeason.version by 1"
      - from: PUBLISHED
        to: ROLLED_BACK
        trigger: "POST /licensing/roster-batches/{batch_id}/rollback"
        actor: RosterReviewer
        preconditions:
          - "batch is PUBLISHED and is the most recently published batch for the season (published_epoch == season.roster_epoch)"
        side_effects:
          - "The batch it superseded (supersedes_batch_id) returns from SUPERSEDED to PUBLISHED"
          - "Athlete.current_overall_rating values revert to the superseded batch's applied values"
          - "Season roster_epoch decrements by 1"

  - entity: RosterEntry
    field: entry_status
    initial_state: STAGED
    terminal_states: [DROPPED]
    transitions:
      - from: STAGED
        to: APPLIED
        trigger: "cascade from RosterBatch publish"
        actor: system
        preconditions:
          - "owning batch transitions to PUBLISHED"
        side_effects:
          - "Athlete.current_overall_rating updated for ADD/UPDATE_ATTRIBUTE entries"
      - from: STAGED
        to: DROPPED
        trigger: "cascade from RosterBatch reject"
        actor: system
        preconditions:
          - "owning batch transitions to REJECTED"
        side_effects: []

  - entity: ContentDrop
    field: drop_status
    initial_state: SCHEDULED
    terminal_states: [ENDED, CANCELED]
    transitions:
      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /licensing/content-drops/{drop_id}/release"
        actor: LiveOpsManager
        preconditions:
          - "Parent LiveSeason is LIVE"
          - "current clock datetime >= scheduled_start_at and < scheduled_end_at"
          - "For PLAYER_CARD: featured Athlete.athlete_status == ELIGIBLE"
          - "Every RegionalEdition of the parent season that includes a censorship flag conflicting with the drop must not be RELEASED (drop cannot release globally while a conflicting edition is live)"
        side_effects: []
      - from: RELEASED
        to: HELD
        trigger: "cascade from LikenessGrant suspend or agreement suspend"
        actor: system
        preconditions:
          - "featured athlete loses all GRANTED likeness grants"
        side_effects:
          - "Purchases of this drop are blocked"
      - from: HELD
        to: RELEASED
        trigger: "cascade from LikenessGrant reinstate or agreement reinstate"
        actor: system
        preconditions:
          - "featured athlete has a GRANTED likeness grant again"
        side_effects: []
      - from: HELD
        to: CANCELED
        trigger: "cascade from LikenessGrant revoke or POST /licensing/content-drops/{drop_id}/cancel"
        actor: LiveOpsManager
        preconditions:
          - "drop is HELD (or SCHEDULED for manual cancel)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELED
        trigger: "POST /licensing/content-drops/{drop_id}/cancel"
        actor: LiveOpsManager
        preconditions:
          - "drop is SCHEDULED"
        side_effects: []
      - from: RELEASED
        to: ENDED
        trigger: "system (clock passes scheduled_end_at) or cascade from season sunset"
        actor: system
        preconditions:
          - "current clock datetime >= scheduled_end_at OR parent season SUNSET"
        side_effects: []

  - entity: PlayerWallet
    field: wallet_status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FROZEN
        trigger: "POST /licensing/wallets/{wallet_id}/freeze OR cascade from season sunset"
        actor: LiveOpsManager
        preconditions:
          - "wallet is OPEN"
        side_effects:
          - "DEBIT ledger entries are rejected while FROZEN"
      - from: FROZEN
        to: OPEN
        trigger: "POST /licensing/wallets/{wallet_id}/unfreeze"
        actor: LiveOpsManager
        preconditions:
          - "wallet is FROZEN"
          - "Parent LiveSeason is LIVE"
        side_effects: []
      - from: FROZEN
        to: CLOSED
        trigger: "cascade from season archive"
        actor: system
        preconditions:
          - "parent season ARCHIVED"
        side_effects: []

  - entity: TournamentProgram
    field: program_status
    initial_state: ANNOUNCED
    terminal_states: [PAYOUT_FINALIZED, CANCELED]
    transitions:
      - from: ANNOUNCED
        to: REGISTRATION_OPEN
        trigger: "POST /licensing/tournaments/{program_id}/open-registration"
        actor: LiveOpsManager
        preconditions:
          - "Parent LiveSeason is LIVE"
          - "current clock datetime >= registration_opens_at and < registration_closes_at"
        side_effects: []
      - from: REGISTRATION_OPEN
        to: REGISTRATION_CLOSED
        trigger: "POST /licensing/tournaments/{program_id}/close-registration OR system at registration_closes_at"
        actor: LiveOpsManager
        preconditions:
          - "program is REGISTRATION_OPEN"
        side_effects:
          - "TournamentEntry rows in REGISTERED are reviewed: those whose wallet paid the entry fee move to CONFIRMED; unpaid REGISTERED entries move to REFUNDED"
      - from: REGISTRATION_CLOSED
        to: COMPLETED
        trigger: "POST /licensing/tournaments/{program_id}/record-results"
        actor: LiveOpsManager
        preconditions:
          - "program is REGISTRATION_CLOSED"
          - "Every CONFIRMED TournamentEntry has placement recorded"
        side_effects:
          - "TournamentPrize rows move PLANNED -> PAYABLE with final_amount_vc computed under the final pool variant"
      - from: COMPLETED
        to: PAYOUT_FINALIZED
        trigger: "POST /licensing/tournaments/{program_id}/finalize-payout"
        actor: FinanceController
        preconditions:
          - "program is COMPLETED"
          - "league_sanctioned == true"
          - "Every TournamentPrize in PAYABLE has a CONFIRMED TournamentEntry at its placement"
        side_effects:
          - "Each PAYABLE prize posts a PRIZE_PAYOUT CREDIT WalletLedgerEntry to the winner's wallet and moves to PAID"
          - "Increments TournamentProgram.version by 1"
      - from: ANNOUNCED
        to: CANCELED
        trigger: "POST /licensing/tournaments/{program_id}/cancel OR cascade from season sunset"
        actor: LiveOpsManager
        preconditions:
          - "program in ANNOUNCED or REGISTRATION_OPEN"
        side_effects:
          - "All entries refunded (REFUND credits); TournamentPrize rows move to VOIDED"
      - from: REGISTRATION_OPEN
        to: CANCELED
        trigger: "POST /licensing/tournaments/{program_id}/cancel OR cascade from season sunset"
        actor: LiveOpsManager
        preconditions:
          - "program in ANNOUNCED or REGISTRATION_OPEN"
        side_effects:
          - "All entries refunded (REFUND credits); TournamentPrize rows move to VOIDED"

  - entity: TournamentPrize
    field: prize_status
    initial_state: PLANNED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: PLANNED
        to: PROJECTED
        trigger: "system (first REGISTERED entry posts, pool projection runs)"
        actor: system
        preconditions:
          - "program has at least one REGISTERED TournamentEntry"
        side_effects:
          - "projected_amount_vc computed under the projected pool variant"
      - from: PROJECTED
        to: PAYABLE
        trigger: "cascade from record-results"
        actor: system
        preconditions:
          - "program COMPLETED"
        side_effects:
          - "final_amount_vc computed under the final pool variant (confirmed entrants only)"
      - from: PAYABLE
        to: PAID
        trigger: "cascade from finalize-payout"
        actor: system
        preconditions:
          - "program PAYOUT_FINALIZED"
        side_effects:
          - "PRIZE_PAYOUT credit posted to winner wallet"
      - from: PLANNED
        to: VOIDED
        trigger: "cascade from program cancel"
        actor: system
        preconditions:
          - "program CANCELED"
        side_effects: []
      - from: PROJECTED
        to: VOIDED
        trigger: "cascade from program cancel"
        actor: system
        preconditions:
          - "program CANCELED"
        side_effects: []

  - entity: AudioLicense
    field: license_status
    initial_state: ACTIVE
    terminal_states: [TERMINATED, LAPSED]
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "system (clock date passes term_end_on)"
        actor: system
        preconditions:
          - "current clock date > term_end_on"
        side_effects:
          - "Referenced AudioAsset moves CLEARED -> BLOCKED when no other ACTIVE license covers it"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /licensing/audio-licenses/{license_id}/terminate"
        actor: RightsOfficer
        preconditions:
          - "license is ACTIVE"
        side_effects:
          - "Referenced AudioAsset moves CLEARED -> BLOCKED when no other ACTIVE license covers it"

  - entity: AudioAsset
    field: asset_status
    initial_state: CLEARED
    terminal_states: [RETIRED]
    transitions:
      - from: CLEARED
        to: BLOCKED
        trigger: "cascade from AudioLicense lapse/terminate"
        actor: system
        preconditions:
          - "No ACTIVE AudioLicense covers this asset"
        side_effects: []
      - from: BLOCKED
        to: CLEARED
        trigger: "POST /licensing/audio-licenses (creating a new ACTIVE license covering this asset)"
        actor: RightsOfficer
        preconditions:
          - "new license ACTIVE, region_scope and usage_scope compatible"
        side_effects: []
      - from: BLOCKED
        to: RETIRED
        trigger: "POST /licensing/audio-assets/{asset_id}/retire"
        actor: RightsOfficer
        preconditions:
          - "asset is BLOCKED"
        side_effects: []

  - entity: RegionalEdition
    field: edition_status
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /licensing/editions/{edition_id}/submit-review"
        actor: LiveOpsManager
        preconditions:
          - "edition is DRAFT"
        side_effects: []
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /licensing/editions/{edition_id}/approve"
        actor: ComplianceReviewer
        preconditions:
          - "edition is IN_REVIEW"
          - "The acting ComplianceReviewer is not the operator who submitted the review (segregation of duties)"
        side_effects: []
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /licensing/editions/{edition_id}/return-to-draft"
        actor: ComplianceReviewer
        preconditions:
          - "edition is IN_REVIEW"
        side_effects: []
      - from: APPROVED
        to: RELEASED
        trigger: "POST /licensing/editions/{edition_id}/release"
        actor: LiveOpsManager
        preconditions:
          - "edition is APPROVED"
          - "current clock date >= embargo_until_on"
          - "Parent LiveSeason is LIVE"
        side_effects: []
      - from: RELEASED
        to: WITHDRAWN
        trigger: "POST /licensing/editions/{edition_id}/withdraw"
        actor: ComplianceReviewer
        preconditions:
          - "edition is RELEASED"
        side_effects:
          - "ContentDrop rows RELEASED whose content conflicts with this edition's censorship flags are re-evaluated; conflicting drops move to HELD"

  - entity: RoyaltyStatement
    field: statement_status
    initial_state: OPEN
    terminal_states: [PAID]
    transitions:
      - from: OPEN
        to: PROVISIONAL
        trigger: "POST /licensing/royalty-statements/{statement_id}/compute-provisional"
        actor: FinanceController
        preconditions:
          - "statement is OPEN"
        side_effects:
          - "accrued_royalty_cents computed under the PROVISIONAL variant (includes pending sales)"
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /licensing/royalty-statements/{statement_id}/finalize"
        actor: FinanceController
        preconditions:
          - "statement is PROVISIONAL"
          - "current clock date > period_end_on"
        side_effects:
          - "accrued_royalty_cents recomputed under the FINAL variant (settled sales only); delta vs provisional posted as a correcting line"
          - "LicenseAgreement.outstanding_royalty_cents increases by final accrued minus held"
      - from: FINALIZED
        to: DISPUTED
        trigger: "cascade from AuditCase open"
        actor: LeagueAuditor
        preconditions:
          - "statement is FINALIZED"
          - "audit opened within agreement.audit_window_days of finalization"
        side_effects: []
      - from: FINALIZED
        to: PAID
        trigger: "POST /licensing/royalty-statements/{statement_id}/pay"
        actor: FinanceController
        preconditions:
          - "statement is FINALIZED"
          - "No OPEN or FINDINGS_FILED AuditCase references this statement"
        side_effects:
          - "paid_royalty_cents set to accrued minus held"
          - "LicenseAgreement.outstanding_royalty_cents decreases by paid amount"
          - "recouped_against_mg_cents updated under the recoupment rule"
      - from: DISPUTED
        to: PAID
        trigger: "POST /licensing/royalty-statements/{statement_id}/pay (after audit SETTLED)"
        actor: FinanceController
        preconditions:
          - "statement is DISPUTED"
          - "Referencing AuditCase is SETTLED; finding_delta_cents applied to accrued_royalty_cents first"
        side_effects:
          - "accrued_royalty_cents adjusted by finding_delta_cents, then paid_royalty_cents set"

  - entity: AuditCase
    field: audit_status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FINDINGS_FILED
        trigger: "POST /licensing/audit-cases/{case_id}/file-findings"
        actor: LeagueAuditor
        preconditions:
          - "case is OPEN"
        side_effects:
          - "finding_delta_cents recorded"
      - from: FINDINGS_FILED
        to: SETTLED
        trigger: "POST /licensing/audit-cases/{case_id}/settle"
        actor: FinanceController
        preconditions:
          - "case is FINDINGS_FILED"
          - "The acting FinanceController is not the auditor who opened the case (segregation of duties)"
        side_effects:
          - "Referencing RoyaltyStatement accrued_royalty_cents adjusted by finding_delta_cents"
      - from: SETTLED
        to: CLOSED
        trigger: "POST /licensing/audit-cases/{case_id}/close"
        actor: FinanceController
        preconditions:
          - "case is SETTLED"
          - "Referencing RoyaltyStatement is PAID"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: roster-publish-stale-season
    parent_entity: LiveSeason
    write_endpoint: "POST /licensing/roster-batches/{batch_id}/publish"
    occ_field: "expected_season_version"
    description: |
      Publishing a RosterBatch against a LiveSeason whose version has advanced
      since the reviewer last observed it is rejected. This captures the case
      where another reviewer has just published a different batch (which
      legitimately supersedes the prior published batch under the roster epoch
      rule) and the current reviewer's view of the season is therefore stale.
    error_id: ERR_STALE_SEASON_VERSION
    http_status: 412

  - rule_id: finalize-payout-stale-program
    parent_entity: TournamentProgram
    write_endpoint: "POST /licensing/tournaments/{program_id}/finalize-payout"
    occ_field: "expected_program_version"
    description: |
      Finalizing payout against a TournamentProgram whose version has advanced
      since the controller last observed it is rejected; a stale view may miss
      a late registration correction that changes the final prize pool.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: royalty_accrual
    trigger: "RoyaltyStatement compute-provisional (PROVISIONAL variant) and finalize (FINAL variant)"
    algorithm: tiered_pricing
    formula: |
      # Tiered royalty with nested min/max and conditional branches (mode (a)).
      net_sales_cents = max(0, gross_sales_cents - returns_cents)
      if royalty_model == PERCENT_OF_NET:
          base = net_sales_cents
      elif royalty_model == PER_UNIT:
          base = units_sold * unit_royalty_cents   # units_sold reported on the statement
      else:  # HYBRID
          base = max(net_sales_cents * 0.5, units_sold * unit_royalty_cents)
      tier1 = min(base, TIER1_CAP_CENTS) * TIER1_RATE_BPS / 10000
      tier2 = max(0, min(base, TIER2_CAP_CENTS) - TIER1_CAP_CENTS) * TIER2_RATE_BPS / 10000
      tier3 = max(0, base - TIER2_CAP_CENTS) * TIER3_RATE_BPS / 10000
      accrued_raw = tier1 + tier2 + tier3
      if mg_recoupable and recouped_against_mg_cents < minimum_guarantee_cents:
          room = minimum_guarantee_cents - recouped_against_mg_cents
          accrued_payable = max(0, accrued_raw - room)
      else:
          accrued_payable = accrued_raw
      accrued_royalty_cents = round_half_up(accrued_payable)
    input_set: |
      PROVISIONAL variant: base includes pending sales — net_sales_cents uses gross_sales_cents as reported.
      FINAL variant: base excludes pending sales — net_sales_cents uses (gross_sales_cents - pending_sales_cents).
      Both variants subtract returns_cents and apply the same tier/MG logic.
    constants:
      TIER1_CAP_CENTS: 50000000
      TIER2_CAP_CENTS: 200000000
      TIER1_RATE_BPS: 1000
      TIER2_RATE_BPS: 1200
      TIER3_RATE_BPS: 1500
    precision: "0 decimal places (integer cents), round_half_up at the final step only"
    variants:
      - name: PROVISIONAL
        when: "compute-provisional while period still open"
        difference: "Includes PENDING sales lines; tends to overstate vs final"
      - name: FINAL
        when: "finalize after period_end_on"
        difference: "Excludes PENDING lines; the delta vs provisional is posted as a correcting entry"

  - name: prize_pool_split
    trigger: "TournamentPrize projection (PROJECTED variant) and record-results (FINAL variant)"
    algorithm: waterfall_allocation
    formula: |
      # Pool definition differs per variant; then allocation order pinned.
      if variant == PROJECTED:
          pool_vc = sum(entry_fee_vc over TournamentEntry in {REGISTERED, CONFIRMED})
      else:  # FINAL
          pool_vc = sum(entry_fee_vc over TournamentEntry in {CONFIRMED} only)
      # Allocation: prize rows sorted by placement ASC; per-row raw = pool_vc * share_bps / 10000,
      # ROUNDED DOWN (floor) per row; remainder (pool_vc - sum(floored rows)) goes to placement 1.
      # This pins the rounding order: floor per row first, then remainder to first place.
    input_set: "TournamentPrize rows for the program; entries filtered per variant"
    constants:
      TOTAL_SHARE_BPS: 10000
    precision: "integer vc units, floor per row, remainder to placement 1"
    variants:
      - name: PROJECTED
        when: "on first registration and each subsequent registration"
        difference: "Pool includes REGISTERED-but-unpaid entries; projected_amount_vc is optimistic"
      - name: FINAL
        when: "on record-results"
        difference: "Pool includes only CONFIRMED entries; final_amount_vc is authoritative for payout"

  - name: roster_rating_batch_application
    trigger: "RosterBatch publish"
    algorithm: chronological
    formula: |
      # Entries of kind ADD/UPDATE_ATTRIBUTE within one batch are applied in
      # created_at ASC order; ties broken by entry created_at only (never id).
      # The last write wins per athlete. Batch-level effect:
      # for each distinct athlete in the batch, current_overall_rating :=
      #   the overall_rating of that athlete's chronologically-last ADD/UPDATE_ATTRIBUTE entry.
    input_set: "RosterEntry rows of the batch in STAGED, kinds ADD or UPDATE_ATTRIBUTE"
    precision: "integer ratings"

  - name: wallet_balance_recompute
    trigger: "Every WalletLedgerEntry post"
    algorithm: aggregation
    formula: |
      vc_balance = sum(CREDIT amount_vc) - sum(DEBIT amount_vc) over POSTED entries
      Invariant (compensating): every DEBIT must have vc_balance >= amount_vc at post time,
      so vc_balance >= 0 always. A SPEND_DROP debit paired with a REFUND credit of equal
      amount_vc restores the prior balance exactly.
    input_set: "All POSTED WalletLedgerEntry rows for the wallet"
    precision: "integer vc units"

  - name: outstanding_royalty_reconciliation
    trigger: "statement finalize, pay, and audit settle"
    algorithm: aggregation
    formula: |
      # Conserved quantity for compensating_invariant:
      outstanding_royalty_cents = sum(accrued_royalty_cents - held_royalty_cents - paid_royalty_cents)
                                  over statements in {FINALIZED, DISPUTED, PAID}
      A finalize followed later by a pay of the same statement must leave
      outstanding_royalty_cents unchanged relative to before the finalize.
    input_set: "RoyaltyStatement rows for the agreement in FINALIZED, DISPUTED, PAID"
    precision: "integer cents"

  - name: held_royalty_attribution
    trigger: "LikenessGrant suspend/reinstate/revoke cascades"
    algorithm: weighted_scoring
    formula: |
      # Held royalty per suspended athlete on the open statement:
      held_for_athlete = round_half_up(open_statement.accrued_royalty_cents * grant.royalty_share_bps / 10000)
      # Circular-looking dependency pinned: held_royalty_cents is computed from the
      # CURRENT accrued_royalty_cents snapshot; accrued is NOT recomputed after held
      # changes (evaluation order: accrue first, then attribute holds).
    input_set: "LikenessGrant rows suspended in this cascade, joined to the open statement of their agreement"
    precision: "integer cents, round_half_up"

  - name: license_exclusivity_overlap
    trigger: "LicenseAgreement activate"
    algorithm: interval_merge
    formula: |
      # Exclusivity conflict detection with half-open-in-date semantics:
      # two agreements conflict iff same sport_category, both exclusivity_scope != NONE,
      # both in ACTIVE/SUSPENDED, and date intervals intersect with INTERSECTION LENGTH > 0 days.
      # Adjacent terms (one ends on D, another starts on D+1) do NOT conflict;
      # terms sharing exactly one calendar date DO conflict (inclusive bounds).
    input_set: "LicenseAgreement rows with same sport_category and exclusivity_scope != NONE"
    precision: "whole days"

  - name: edition_embargo_window
    trigger: "RegionalEdition release"
    algorithm: threshold
    formula: |
      # Release allowed iff clock date >= embargo_until_on (inclusive: equal is allowed).
      # Distinct from license overlap semantics: embargo is a single threshold, not an interval pair.
    input_set: "the edition row"
    precision: "whole days; >= comparison (boundary allowed)"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_CONTEXT
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted to invoke this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every id in the path and every FK in the body resolves to an existing resource"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: business_constraint
    check: "Required input fields present, enums valid, ranges honored (e.g. overall_rating 40..99, share_bps totals 10000, amount_vc > 0)"
    error_id: ERR_INVALID_INPUT
    http_status: 400
    applies_to: "all"

  - priority: 5
    category: state
    check: "Target resource is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: business_safety
    check: "Segregation-of-duties: actor must differ from the prior step's actor (roster publish vs submit; edition approve vs submit-review; audit settle vs open)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "publish, approve, settle endpoints"

  - priority: 7
    category: business_referential
    check: "Cross-entity state preconditions: agreement ACTIVE for grant; athlete ELIGIBLE for roster entry and player-card drop; season LIVE for drop release, tournament registration, wallet unfreeze"
    error_id: ERR_REFERENCE_STATE
    http_status: 409
    applies_to: "grant, validate, release, register, unfreeze endpoints"

  - priority: 8
    category: business_temporal
    check: "Temporal windows honored: clock inside term/registration/scheduled windows; embargo reached; audit opened within audit_window_days; no exclusivity overlap"
    error_id: ERR_TEMPORAL_CONFLICT
    http_status: 409
    applies_to: "activate, release, register, open-audit, launch endpoints"

  - priority: 9
    category: business_fiscal
    check: "Fiscal checks last: wallet has sufficient vc_balance for debit; statement has no blocking audit before pay; prize rows total 10000 bps"
    error_id: ERR_FISCAL_BLOCK
    http_status: 422
    applies_to: "debit-post, pay, finalize-payout endpoints"

  - priority: 10
    category: state
    check: "OCC: expected_<parent>_version matches the parent entity's current version (ERR_STALE_SEASON_VERSION for roster publish, ERR_STALE_PROGRAM_VERSION for payout finalize)"
    error_id: "ERR_STALE_SEASON_VERSION / ERR_STALE_PROGRAM_VERSION"
    http_status: 412
    applies_to: "publish roster batch, finalize payout"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/licensing/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is 2026-09-01T00:00:00Z; before any call the clock reads exactly that instant and never falls back to wall-clock time."
    roles: [LicensingAdmin]
    code: 200
    input: [to_iso8601]
