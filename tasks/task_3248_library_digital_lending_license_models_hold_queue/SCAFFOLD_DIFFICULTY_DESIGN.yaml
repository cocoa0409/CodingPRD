            - call: "POST /lending/libraries/${lib2_id}/patrons"
              payload: { external_card_number: "Q-4", full_name: "Patron Q4", postal_code: "94301" }
              as: LibraryAdmin
              as_user_id: "${lib2_id}"
              captures: { patq4_id: $.data.id }
            - call: "POST /lending/consortiums/${cons_id}/titles"
              payload: { isbn: "9780000000005", name: "Title Metered", author: "Author E", price_ocou_cents: 5000, metered_time_price_cents: 4000, metered_time_days: 30, metered_circ_price_cents: 3000, metered_circ_count: 26, cpc_price_per_circ_cents: 199, simultaneous_use_price_cents: 9000, simultaneous_use_days: 180 }
              as: ConsortiumAdmin
