            - call: "POST /shipments/${ship_in1_id}/dispatch"
              payload: { carrier_reference: "IN-2026-08-16" }
              as: WarehouseTech
              as_user_id: "${tech_insp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-18T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shipments/${ship_in1_id}/receipt"
              payload: {}
              as: WarehouseTech
              as_user_id: "${tech_insp_id}"
            - call: "GET /reverse-logistics-jobs"
              payload: { reservation_id: "${res1_id}" }
              as: WarehouseTech
              as_user_id: "${tech_insp_id}"
              captures: { job1_id: "$.data[0].id" }
            - call: "POST /reverse-logistics-jobs/${job1_id}/inspections"
              payload: { soil_level: "LIGHT", damage_severity: "NONE", condition_grade_after: "A", biohazard_flag: false, notes: "post-turn inspection" }
              as: WarehouseTech
              as_user_id: "${tech_insp_id}"
            - call: "POST /reverse-logistics-jobs/${job1_id}/cleaning-completion"
              payload: {}
              as: WarehouseTech
              as_user_id: "${tech_rep_id}"
            - call: "POST /reverse-logistics-jobs/${job1_id}/photography"
              payload: {}
              as: WarehouseTech
              as_user_id: "${tech_rep_id}"
            - call: "POST /reverse-logistics-jobs/${job1_id}/restock"
              payload: {}
              as: WarehouseTech
              as_user_id: "${tech_rep_id}"
          trigger:
            - call: "GET /styles/${style_gown_id}/unit-economics"
              payload: { variant: "REALIZED" }
              as: InventoryPlanner
            - call: "GET /styles/${style_gown_id}/unit-economics"
              payload: { variant: "PROJECTED" }
              as: InventoryPlanner
          assert:
            - "the REALIZED read returns unit_count == 3 and variant == REALIZED"
            - "REALIZED avg_acquisition_cost_cents == 21000"
            - "REALIZED avg_revenue_per_unit_cents == 1111 (3333 attributed on unit 001 plus 0 plus 0, averaged over 3 units with round_half_up)"
            - "REALIZED avg_servicing_cost_per_unit_cents == 667 (2000 plus 0 plus 0 over 3 units)"
            - "REALIZED avg_eol_value_cents == 0 because no unit is RETIRED and no ResaleListing is SOLD"
            - "REALIZED avg_margin_per_unit_cents == -20556"
            - "REALIZED avg_margin_per_turn_cents == -20556 (per-unit margins -19667, -21000, -21000 divided by 1, 1 and 1 chargeable turn then averaged)"
            - "the PROJECTED read returns unit_count == 1 and variant == PROJECTED"
            - "PROJECTED avg_acquisition_cost_cents == 21000, taken straight from Style.acquisition_cost_cents"
            - "PROJECTED avg_revenue_per_unit_cents == 38400 (REFERENCE_REVENUE_PER_TURN_CENTS 3200 times 12 expected turns)"
            - "PROJECTED avg_servicing_cost_per_unit_cents == 24000 (PROJECTED_SERVICING_PER_TURN_CENTS 2000 times 12)"
            - "PROJECTED avg_eol_value_cents == 9000, taken from Style.planned_eol_value_cents"
            - "PROJECTED avg_margin_per_unit_cents == 2400 (38400 - 24000 - 21000 + 9000)"
            - "PROJECTED avg_margin_per_turn_cents == 200 (2400 divided by 12)"
            - "the two variants differ on the same fixture: -20556 versus 200, and REALIZED unit_count 3 versus PROJECTED unit_count 1"
      - name: member_damage_risk_lifetime_vs_rolling_12m_diverge
