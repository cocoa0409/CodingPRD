              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { pkg: "$.data.id" }
            - call: "POST /modular/modules"
              payload: { project_id: "${proj}", design_package_id: "${pkg}", module_code: "M-01", set_sequence_index: 1, width_in: 180, length_in: 600, height_in: 156, gross_weight_lb: 76600 }
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { m1: "$.data.id" }
            - call: "POST /modular/defect-claims"
              payload: { module_id: "${m1}", discovered_phase: "SITE_SET", description: "corner post crushed during rigging", repair_cost_cents: 1234567 }
              as: SiteSuperintendent
              as_user_id: "${proj}"
              captures: { claim: "$.data.id", resp0: "$.data.responsibility", wb0: "$.data.warranty_bucket" }
          trigger:
            - call: "POST /modular/defect-claims/${claim}/adjudicate"
              payload: { adjudication_note: "round 1 presumption" }
              as: WarrantyAdjudicator
              captures: { fs: "$.data.factory_share_pct", fds: "$.data.field_share_pct", fc: "$.data.factory_charge_cents", fdc: "$.data.field_charge_cents", resp: "$.data.responsibility", wb: "$.data.warranty_bucket" }
          assert:
            - "${resp0} == 'UNDETERMINED' and ${wb0} == 'SPLIT' before adjudication"
            - "${fs} == 25.00 (PHASE_PRESUMPTION[SITE_SET]) and ${fds} == 75.00 as the exact complement"
            - "${fc} == 308642 (round_half_up of 308641.75) and ${fdc} == 925925, so ${fc} + ${fdc} == 1234567 exactly"
            - "${resp} == 'SHARED' and ${wb} == 'SPLIT'"
            - "GET /modular/modules/${m1} reports defect_count_factory == 0 and defect_count_field == 0 — only a FACTORY or FIELD outcome bumps a counter"

      - name: permit_posture_propagates_to_a_fixed_point_across_both_tracks
        claim_type: constraint_propagation
        grounds:
          - calculations.permit_posture_derivation
          - endpoints[POST /modular/permits/{permitId}/decide]
          - endpoints[GET /modular/projects/{projectId}]
        distinguishing_aspect: |
          Four approvals across two bifurcated tracks must each re-propagate the posture, and the
