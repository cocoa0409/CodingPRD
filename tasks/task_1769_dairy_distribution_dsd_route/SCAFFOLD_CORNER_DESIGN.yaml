              as_user_id: "${d1}"
              captures: { s1: "$.data.id" }
            - { call: "POST /dairy/routes/${r1}/activate", payload: {}, as: TerritoryManager }
            - call: "POST /dairy/products"
              payload: { sku: "WS-1", name: "WS Prod", units_per_case: 1, shelf_life_days: 30, regulated: false, list_price_cents: 250 }
              as: TerritoryManager
              captures: { pl: "$.data.id" }
            - call: "POST /dairy/drivers"
              payload: { distributor_id: "${d1}", name: "Ela Driver", cdl_class: "A" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { dr1: "$.data.id" }
            - call: "POST /dairy/pricing-periods"
              payload: { month: "2026-08" }
              as: MarketAdministrator
              captures: { per1: "$.data.id", per1_v: "$.data.version" }
            - call: "POST /dairy/pricing-periods/${per1}/announcements"
              payload: { kind: "FINAL", class_i_base_cents_per_cwt: 2000, processor_assessment_cents_per_cwt: 35, hauling_cents_per_cwt: 60, diesel_index_cents: 299, expected_pricing_period_version: "${per1_v}" }
              as: MarketAdministrator
            - { call: "POST /dairy/pricing-periods/${per1}/close", payload: {}, as: MarketAdministrator, captures: { per_status: "$.data.status" } }
            - call: "POST /dairy/trips"
              payload: { route_id: "${r1}", driver_id: "${dr1}", service_date: "2026-08-10", truck_plate: "TK-1", case_capacity: 100, planned_depart_at: "2026-08-10T05:00:00Z", planned_return_at: "2026-08-10T13:00:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { t1: "$.data.id" }
            - call: "POST /dairy/orders"
              payload: { store_id: "${s1}", trip_id: "${t1}", lines: [{ product_id: "${pl}", quantity_units: 4 }], delivery_window_start: "2026-08-10T08:00:00Z", delivery_window_end: "2026-08-10T08:30:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { o1: "$.data.id" }
            - { call: "POST /dairy/orders/${o1}/confirm", payload: {}, as: DistributorOwner, as_user_id: "${d1}" }
            - call: "POST /dairy/trips/${t1}/temperature-readings"
              payload: { recorded_at: "2026-08-10T04:30:00Z", temp_tenths_f: 380, zone: "BOX" }
              as: RouteDriver
              as_user_id: "${dr1}"
            - { call: "POST /dairy/trips/${t1}/depart", payload: {}, as: RouteDriver, as_user_id: "${dr1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/orders/${o1}/deliver"
              payload: { delivered_lines: [{ product_id: "${pl}", delivered_units: 4, scanned_code_date: "2026-09-01" }] }
              as: RouteDriver
              as_user_id: "${dr1}"
            - call: "POST /dairy/returns"
              payload: { order_id: "${o1}", store_id: "${s1}", pickup_trip_id: "${t1}", product_id: "${pl}", quantity_units: 1, reason_code: "DAMAGED", scanned_code_date: "2026-09-01" }
              as: RouteDriver
              as_user_id: "${dr1}"
              captures: { re1: "$.data.id" }
            - { call: "POST /dairy/returns/${re1}/approve", payload: {}, as: DistributorOwner, as_user_id: "${d1}" }
            - { call: "POST /dairy/stores/${s1}/deactivate", payload: {}, as: DistributorOwner, as_user_id: "${d1}" }
          trigger:
            - { call: "POST /dairy/stores/${s1}/deactivate", payload: {}, as: DistributorOwner, as_user_id: "${d1}", captures: { err1: "$.data.error_id" } }
            - { call: "POST /dairy/pricing-periods/${per1}/close", payload: {}, as: MarketAdministrator, captures: { err2: "$.data.error_id" } }
            - { call: "GET /dairy/pricing-periods/${per1}", as: Any, captures: { per_v2: "$.data.version" } }
            - { call: "POST /dairy/pricing-periods/${per1}/announcements", payload: { kind: "PROVISIONAL", class_i_base_cents_per_cwt: 2100, processor_assessment_cents_per_cwt: 35, hauling_cents_per_cwt: 60, diesel_index_cents: 299, expected_pricing_period_version: "${per_v2}" }, as: MarketAdministrator, captures: { err3: "$.data.error_id" } }
            - { call: "POST /dairy/returns/${re1}/approve", payload: {}, as: DistributorOwner, as_user_id: "${d1}", captures: { err4: "$.data.error_id" } }
          assert:
            - "per_status == CLOSED (close with FINAL present succeeds)"
            - "err1 == ERR_STORE_NOT_ACTIVE (double deactivate)"
            - "err2 == ERR_PERIOD_CLOSED (double close)"
            - "err3 == ERR_PERIOD_CLOSED (announcement into CLOSED period; OCC version is fresh, so the state gate is what fires)"
            - "err4 == ERR_RETURN_NOT_REVIEWABLE (CREDITED is terminal for approve)"

