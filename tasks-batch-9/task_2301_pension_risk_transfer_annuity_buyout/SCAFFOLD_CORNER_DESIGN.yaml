              payload: { review_decision: "APPROVE" }
              as: Regulator
              as_user_id: "regulator-01"
              captures: { state_terminated: $.data.plan_status }
            - call: "POST /prt/plans/${plan_id}/termination-filing"
              payload: { filing_reference: "PBGC-500-2026-0003" }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
