  - method: POST
    path: "/district-energy/dispatch-plans"
    description: "Open a dispatch plan against a published forecast, superseding every non-terminal plan on the loop. Guarded by optimistic concurrency on the loop version."
    roles: [DispatchOperator]
    code: 201
    input: ["loop_id", "forecast_id", "expected_loop_version"]
    output: DispatchPlan
    side_effects: ["creates the plan with plan_state DRAFT, block_hours 24.0 and authored_by_user_id set from X-User-ID", "cascades every DispatchPlan on the loop whose plan_state IN {DRAFT, SUBMITTED, APPROVED} to SUPERSEDED", "increments NetworkLoop.version by 1"]
  - method: GET
    path: "/district-energy/dispatch-plans/{plan_id}"
    description: "Read one dispatch plan including its cost, emission and resilience metrics."
    roles: [SystemController, DispatchOperator, NetworkEngineer, BillingAnalyst]
    code: 200
    input: []
    output: DispatchPlan
    side_effects: []
  - method: GET
    path: "/district-energy/dispatch-plans"
    description: "List dispatch plans, filterable by loop, source forecast and lifecycle state."
    roles: [SystemController, DispatchOperator, NetworkEngineer, BillingAnalyst]
    code: 200
    input: ["loop_id?", "forecast_id?", "plan_state?", "limit?", "offset?"]
    output: DispatchPlan[]
    side_effects: []
  - method: POST
    path: "/district-energy/dispatch-plans/{plan_id}/optimize"
    description: "Run the merit-order waterfall and resilience metrics for a draft plan, replacing its dispatch orders."
    roles: [DispatchOperator]
    code: 200
    input: []
    output: DispatchPlan
    side_effects: ["deletes every existing DispatchOrder of this plan", "runs calculations.merit_order_dispatch creating one DispatchOrder per dispatched asset", "runs calculations.plan_reliability_metrics", "stores allocated_capacity_kw, unserved_demand_kw, total_dispatch_cost, total_emissions_kg, reserve_margin_pct and fuel_diversity_hhi"]
  - method: POST
    path: "/district-energy/dispatch-plans/{plan_id}/submit"
    description: "Submit an optimized plan for control-room review."
    roles: [DispatchOperator]
    code: 200
    input: ["submission_note?"]
    output: DispatchPlan
    side_effects: ["sets plan_state = SUBMITTED"]
  - method: POST
    path: "/district-energy/dispatch-plans/{plan_id}/review"
    description: "Approve or reject a submitted plan. The reviewer must differ from the author."
    roles: [SystemController]
    code: 200
    input: ["decision", "review_note?"]
    output: DispatchPlan
    side_effects: ["stores reviewed_by_user_id = X-User-ID", "sets plan_state = APPROVED on APPROVE after the reserve-margin and fuel-diversity gates pass", "sets plan_state = DRAFT on REJECT", "cascades NetworkLoop.posture CONSTRAINED to NORMAL on APPROVE when open_isolation_count == 0 and increments NetworkLoop.version by 1"]
  - method: POST
    path: "/district-energy/dispatch-plans/{plan_id}/commit"
    description: "Commit an approved plan to the plant, drawing the thermal storage energy the plan schedules."
    roles: [DispatchOperator]
    code: 200
    input: []
    output: DispatchPlan
    side_effects: ["sets plan_state = COMMITTED", "decrements ProductionAsset.state_of_charge_kwh by DispatchOrder.discharged_kwh for every storage order and increments each affected ProductionAsset.version by 1"]
  - method: POST
    path: "/district-energy/dispatch-plans/{plan_id}/decommit"
    description: "Withdraw a committed plan, restoring the thermal storage energy ledger exactly."
    roles: [SystemController]
    code: 200
    input: ["reason?"]
    output: DispatchPlan
    side_effects: ["sets plan_state = DRAFT", "clears reviewed_by_user_id", "increments ProductionAsset.state_of_charge_kwh by DispatchOrder.discharged_kwh for every storage order and increments each affected ProductionAsset.version by 1"]
  - method: POST
    path: "/district-energy/dispatch-plans/{plan_id}/reconcile"
    description: "Close out a committed plan once its forecast has been finalised on actual weather."
    roles: [SystemController]
    code: 200
    input: []
    output: DispatchPlan
    side_effects: ["sets plan_state = RECONCILED"]
