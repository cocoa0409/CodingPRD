            - "Cage.${cage_id}.operational_status == FIT_OUT"
            - "Cage.${cage_id}.camera_coverage_pct == 0.00 and Cage.${cage_id}.active_reader_zone_count == 0"

      - name: security_device_listing_filtered_by_cage_and_type
        claim_type: listing
        grounds:
          - endpoints[GET /security-devices]
          - entities.SecurityDevice.fields.device_type
          - entities.SecurityDevice.fields.status
        distinguishing_aspect: "GET /security-devices?cage_id=&device_type=CARD_READER returns exactly the two readers of that cage and excludes the camera, while the unfiltered list of the cage returns total_count 3."
        test_recipe:
          setup:
            - "Hall CX17 owns cage CG-1 with one PLANNED camera CAM-1 (38.0 m) and two PLANNED card readers RDR-N (Z-N) and RDR-S (Z-S)."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Corner Hall 17", code: "CX17", tenant_mode: "MULTI_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /tenants"
              payload: { name: "Meridian Cloud", code: "CXT17", contracted_kw: 100.00, contract_start_date: "2026-01-01T00:00:00Z" }
              as: FacilityPlanner
              captures: { t1_id: $.data.id }
            - call: "POST /cages"
              payload: { hall_id: "${hall_id}", tenant_id: "${t1_id}", label: "CG-1", perimeter_length_m: 40.0 }
              as: SecurityAdministrator
              captures: { cage_id: $.data.id }
            - call: "POST /security-devices"
              payload: { cage_id: "${cage_id}", device_type: "CAMERA", label: "CAM-1", covered_length_m: 38.0 }
              as: SecurityAdministrator
            - call: "POST /security-devices"
              payload: { cage_id: "${cage_id}", device_type: "CARD_READER", label: "RDR-N", reader_zone_label: "Z-N" }
              as: SecurityAdministrator
            - call: "POST /security-devices"
              payload: { cage_id: "${cage_id}", device_type: "CARD_READER", label: "RDR-S", reader_zone_label: "Z-S" }
              as: SecurityAdministrator
          trigger:
            - call: "GET /security-devices?cage_id=${cage_id}&device_type=CARD_READER"
              payload: {}
              as: SecurityAdministrator
            - call: "GET /security-devices?cage_id=${cage_id}"
              payload: {}
              as: SecurityAdministrator
          assert:
            - "the first response holds exactly 2 SecurityDevice rows with labels RDR-N and RDR-S, total_count == 2"
            - "the second response holds total_count == 3"
            - "every returned row has status == PLANNED"

      - name: mop_approval_row_is_immutable_and_append_only
        claim_type: immutability
        grounds:
          - entities.MopApproval
          - endpoints[GET /mops/{id}/approvals]
          - calculations.mop_approval_requirement
        distinguishing_aspect: "MopApproval is declared common_fields: false — the §1.5 surface exposes no PATCH/DELETE for it and its rows carry no version field; two decisions on one MOP produce two immutable rows with sequence 1 and 2."
        test_recipe:
          setup:
            - "The logical clock is at 2026-08-01T00:00:00Z."
            - "Hall CX18 (PLANNING) owns PDU-A1 and busway BW-A1; MOP-1 (LOW risk, target BUSWAY BW-A1, authored by u-elec-1) is UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ChangeManager
            - call: "POST /halls"
              payload: { name: "Corner Hall 18", code: "CX18", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_a_id: $.data.id }
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_a_id}", name: "BW-A1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
              captures: { bw_a_id: $.data.id }
            - call: "POST /mops"
              payload: { hall_id: "${hall_id}", target_resource_type: "BUSWAY", target_resource_id: "${bw_a_id}", title: "BW-A1 label audit", risk_class: "LOW", backout_plan: "Restore original labels.", window_start: "2026-08-05T02:00:00Z", window_end: "2026-08-05T04:00:00Z" }
              as: ElectricalContractor
              as_user_id: "u-elec-1"
              captures: { mop_id: $.data.id }
            - call: "POST /mops/${mop_id}/submit"
              payload: {}
              as: ElectricalContractor
              as_user_id: "u-elec-1"
            - call: "POST /mops/${mop_id}/approvals"
              payload: { decision: "REQUEST_REVISION", comment: "Attach single-line diagram." }
              as: ChangeManager
              as_user_id: "u-cm-1"
          trigger:
            - call: "POST /mops/${mop_id}/revise"
              payload: { backout_plan: "Restore original labels and photograph the run." }
              as: ElectricalContractor
              as_user_id: "u-elec-1"
            - call: "POST /mops/${mop_id}/approvals"
              payload: { decision: "APPROVE", comment: "Diagram received." }
              as: OperationsManager
              as_user_id: "u-om-1"
            - call: "GET /mops/${mop_id}/approvals"
              payload: {}
              as: ChangeManager
          assert:
            - "the approvals list holds exactly 2 MopApproval rows with sequence 1 and 2 in creation order"
            - "row sequence 1 has decision == REQUEST_REVISION, approver_role == ChangeManager and approver_user_id == 'u-cm-1'"
            - "row sequence 2 has decision == APPROVE, approver_role == OperationsManager and approver_user_id == 'u-om-1'"
            - "no MopApproval row exposes a version field, and §1.5 declares no PATCH or DELETE endpoint for /mops/{mop_id}/approvals"
            - "MethodOfProcedure.${mop_id}.status == APPROVED and revision_count == 1 and approval_count == 1"

      - name: rack_graph_links_hall_zone_cage_and_tenant
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.Rack.fields.cage_id
          - entities.Rack.fields.tenant_id
