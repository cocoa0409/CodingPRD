      - name: stratification_score_is_capped_at_one_hundred
        claim_type: precision
        grounds: ["calculations.risk_stratification_score", "entities.RiskStratification.fields.score"]
        distinguishing_aspect: "raw_score 120.0 from 20 chronic conditions is capped by min(100, ...) so score reads 100 and tier HIGH, while raw_score keeps the uncapped 120.0."
        test_recipe:
          setup: ["One member with chronic_condition_count 20 and no events; clock at its default."]
          setup_api_calls:
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-5401", full_name: "Cap Carl", birth_date: "1945-05-05", state_code: "CA", chronic_condition_count: 20 }
              as: ProgramAdmin
              captures: { m: $.data.id }
          trigger:
            - call: "POST /care-management/members/${m}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
              captures: { raw: $.data.raw_score, score: $.data.score, tier: $.data.tier, chronic: $.data.chronic_points }
          assert:
            - "${chronic} == 120.0"
            - "${raw} == 120.0"
            - "${score} == 100"
            - "${tier} == HIGH"

      - name: auto_assignment_ranks_by_headroom_then_created_at_ascending
        claim_type: correct_result
        grounds: ["calculations.care_manager_auto_assignment", "entities.Enrollment.fields.assignment_reason", "entities.CareManager.fields.capacity_points"]
        distinguishing_aspect: "With headrooms 6.0, 8.0 and 8.0 the selector picks the 8.0 pair and breaks the tie on created_at ASC, so the second-created manager wins and assignment_reason is AUTO_SELECTED - never the largest capacity_points and never an id-based choice."
        test_recipe:
          setup:
            - "Clock at its 2026-08-01T00:00:00Z default; program min_risk_tier LOW requiring RN."
            - "Manager one has capacity_points 10.0 and already carries a RISING enrollment worth 4.0, leaving headroom 6.0."
            - "Manager two and manager three each have capacity_points 8.0 and no caseload; manager two was created first."
          setup_api_calls:
            - call: "POST /care-management/programs"
              payload: { name: "Selector Program", min_risk_tier: "LOW", stratification_variant: "CONCURRENT", required_credential_levels: ["RN"], staff_minute_budget: 100000, hourly_cost_cents: 9000, cohort_benchmark_pmpm_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "One Nolan", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 10.0 }
              as: ProgramAdmin
              captures: { cm1: $.data.id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Two Ruiz", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 8.0 }
              as: ProgramAdmin
              captures: { cm2: $.data.id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Three Vale", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 8.0 }
              as: ProgramAdmin
              captures: { cm3: $.data.id }
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-5501", full_name: "Load Lena", birth_date: "1957-07-17", state_code: "CA", chronic_condition_count: 10 }
              as: ProgramAdmin
              captures: { m_load: $.data.id }
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-5502", full_name: "Pick Pete", birth_date: "1981-08-18", state_code: "CA", chronic_condition_count: 0 }
              as: ProgramAdmin
              captures: { m_pick: $.data.id }
            - call: "POST /care-management/members/${m_load}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
            - call: "POST /care-management/members/${m_pick}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
            - call: "POST /care-management/enrollments"
              payload: { member_id: "${m_load}", program_id: "${prog}", care_manager_id: "${cm1}" }
              as: ProgramAdmin
              captures: { enr_load: $.data.id }
            - call: "GET /care-management/care-managers/${cm1}"
              payload: {}
              as: ProgramAdmin
              captures: { cm1_load: $.data.assigned_caseload_points }
          trigger:
            - call: "POST /care-management/enrollments"
              payload: { member_id: "${m_pick}", program_id: "${prog}" }
              as: ProgramAdmin
              captures: { enr_pick: $.data.id, picked: $.data.care_manager_id, reason: $.data.assignment_reason }
          assert:
            - "${cm1_load} == 4.0"
            - "${picked} == ${cm2}"
            - "${picked} != ${cm1} and ${picked} != ${cm3}"
            - "${reason} == AUTO_SELECTED"
            - "CareManager.${cm2}.assigned_caseload_points == 1.0 and CareManager.${cm3}.assigned_caseload_points == 0.0"

      - name: accreditation_file_samples_only_active_enrollments_and_counts_overdue_touches
        claim_type: correct_result
        grounds: ["calculations.accreditation_compliance_file", "entities.Enrollment.fields.next_touch_due_at"]
        distinguishing_aspect: "With one ACTIVE enrollment whose next_touch_due_at 2026-08-31T00:00:00.000Z has passed and one PENDING enrollment, the file reports active_enrollment_count 1, deficiency_counts.TOUCH_OVERDUE 1 and compliance_rate_pct 0.0 - the PENDING enrollment is outside the sample."
        test_recipe:
          setup:
            - "Clock set to 2026-08-01T00:00:00Z for activation, then advanced to 2026-09-30T00:00:00Z."
            - "One ACTIVE enrollment with an ACTIVE care plan approved on 2026-08-01 (next_review_due_at 2026-10-30, so not stale) and no touches."
            - "A second member has a PENDING enrollment in the same program."
          setup_api_calls:
            - call: "POST /care-management/programs"
              payload: { name: "Accreditation Program", min_risk_tier: "LOW", stratification_variant: "CONCURRENT", required_credential_levels: ["RN"], staff_minute_budget: 100000, hourly_cost_cents: 9000, cohort_benchmark_pmpm_cents: 100000, care_plan_review_interval_days: 90, referral_loop_days: 30 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Rita Nolan", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 20.0 }
              as: ProgramAdmin
              captures: { cm_a: $.data.id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Dana Ruiz", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 20.0 }
              as: ProgramAdmin
              captures: { cm_rev: $.data.id }
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-5601", full_name: "Aud Ann", birth_date: "1968-08-28", state_code: "CA", chronic_condition_count: 0 }
              as: ProgramAdmin
              captures: { m1: $.data.id }
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-5602", full_name: "Pen Ding", birth_date: "1969-09-29", state_code: "CA", chronic_condition_count: 0 }
              as: ProgramAdmin
              captures: { m2: $.data.id }
            - call: "POST /care-management/members/${m1}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
            - call: "POST /care-management/members/${m2}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
            - call: "POST /care-management/enrollments"
              payload: { member_id: "${m1}", program_id: "${prog}", care_manager_id: "${cm_a}" }
              as: ProgramAdmin
              captures: { enr1: $.data.id }
            - call: "POST /care-management/enrollments"
              payload: { member_id: "${m2}", program_id: "${prog}", care_manager_id: "${cm_a}" }
              as: ProgramAdmin
              captures: { enr2: $.data.id }
            - call: "POST /care-management/enrollments/${enr1}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { due1: $.data.next_touch_due_at }
            - call: "POST /care-management/care-plans"
              payload: { enrollment_id: "${enr1}", title: "Audit plan" }
              as: CareManager
              as_user_id: "${cm_a}"
              captures: { plan: $.data.id }
            - call: "POST /care-management/care-plans/${plan}/goals"
              payload: { domain: "CLINICAL", description: "Audit goal", target_date: "2026-12-01" }
              as: CareManager
              as_user_id: "${cm_a}"
            - call: "POST /care-management/care-plans/${plan}/submit"
              payload: {}
              as: CareManager
              as_user_id: "${cm_a}"
            - call: "POST /care-management/care-plans/${plan}/review"
              payload: { decision: "APPROVE" }
              as: ClinicalReviewer
              as_user_id: "${cm_rev}"
              captures: { review_due: $.data.next_review_due_at }
            - call: "POST /care-management/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /care-management/programs/${prog}/accreditation-file"
              payload: {}
              as: UtilizationAnalyst
              captures: { active_n: $.data.active_enrollment_count, deficient_n: $.data.enrollments_with_deficiency_count, rate: $.data.compliance_rate_pct, evaluated: $.data.evaluated_at }
          assert:
            - "${due1} == 2026-08-31T00:00:00.000Z"
            - "${review_due} == 2026-10-30T00:00:00.000Z"
            - "${active_n} == 1"
            - "${deficient_n} == 1"
            - "${rate} == 0.0"
            - "${evaluated} == 2026-09-30T00:00:00.000Z"
            - "deficiency_counts.TOUCH_OVERDUE == 1 and deficiency_counts.CARE_PLAN_MISSING == 0 and deficiency_counts.CARE_PLAN_STALE == 0"
            - "deficient_enrollment_ids contains ${enr1} and does not contain ${enr2}"

      - name: risk_variant_divergence_stub
        claim_type: variant_divergence
        grounds: ["calculations.risk_stratification_score"]
        excluded_because:
          difficulty_instance: dual_variant_calc / stratification_variant_divergence_on_member_utilization
          rationale: "The CONCURRENT-versus-PROSPECTIVE inclusion-set difference and its 48-versus-76 outcome are asserted there."

      - name: roi_variant_divergence_stub
        claim_type: variant_divergence
        grounds: ["calculations.roi_savings_measurement"]
        excluded_because:
          difficulty_instance: dual_variant_calc / roi_method_divergence_on_enrollment_savings
          rationale: "PRE_POST versus MATCHED_COHORT projections and both roi_ratio values are asserted there."

      - name: intervention_cost_rounding_stub
        claim_type: precision
        grounds: ["calculations.intervention_cost_cents"]
        excluded_because:
          difficulty_instance: combinatorial_formula / roi_rounding_order_per_month_and_per_intervention
          rationale: "The per-intervention 3017-cent rounding and the 9051-versus-9050 divergence are asserted there."

      - name: engagement_score_denominator_stub
        claim_type: input_set_filtering
        grounds: ["calculations.engagement_score_evaluation"]
        excluded_because:
          difficulty_instance: combinatorial_formula / engagement_denominator_reads_cadence_snapshot_not_current_tier
          rationale: "The snapshot-versus-current-tier denominator choice is the subject of that instance."

  - section: validations
    instances:
      - name: request_without_role_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request carrying no X-User-Role header is rejected with ERR_UNAUTHENTICATED and HTTP 401 before any existence or state check runs."
        test_recipe:
          setup: ["One Member exists."]
          setup_api_calls:
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-6101", full_name: "Auth Amy", birth_date: "1970-01-01", state_code: "CA" }
              as: ProgramAdmin
              captures: { m: $.data.id }
          trigger:
            - call: "GET /care-management/members/${m}"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "the request is sent with neither X-User-Role nor X-User-ID"
            - "HTTP 401"
            - "${err} == ERR_UNAUTHENTICATED"

      - name: list_with_limit_zero_returns_invalid_pagination
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_INVALID_PAGINATION]", "response_envelope.pagination_defaults"]
        distinguishing_aspect: "limit must lie in [1, 100], so limit 0 on GET /care-management/members returns ERR_INVALID_PAGINATION with HTTP 400 rather than an empty page."
        test_recipe:
          setup: ["One Member exists."]
          setup_api_calls:
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-6201", full_name: "Page Pat", birth_date: "1970-01-01", state_code: "CA" }
              as: ProgramAdmin
          trigger:
            - call: "GET /care-management/members"
              payload: { limit: 0 }
              as: UtilizationAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "${err} == ERR_INVALID_PAGINATION"

      - name: second_enrollment_in_same_program_returns_duplicate_active_enrollment
        claim_type: violation_to_error
        grounds: ["validations[priority=62]", "errors[ERR_DUPLICATE_ACTIVE_ENROLLMENT]"]
        distinguishing_aspect: "A member may hold only one PENDING or ACTIVE enrollment per program, so a second create for the same pair returns ERR_DUPLICATE_ACTIVE_ENROLLMENT with HTTP 409 and does not touch the caseload ledger."
        test_recipe:
          setup: ["One PENDING enrollment for member M in program P."]
          setup_api_calls:
            - call: "POST /care-management/programs"
              payload: { name: "Dup Program", min_risk_tier: "LOW", stratification_variant: "CONCURRENT", required_credential_levels: ["RN"], staff_minute_budget: 100000, hourly_cost_cents: 9000, cohort_benchmark_pmpm_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Rita Nolan", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 20.0 }
              as: ProgramAdmin
              captures: { cm_a: $.data.id }
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-6301", full_name: "Dup Dan", birth_date: "1970-01-01", state_code: "CA", chronic_condition_count: 0 }
              as: ProgramAdmin
              captures: { m: $.data.id }
            - call: "POST /care-management/members/${m}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
            - call: "POST /care-management/enrollments"
              payload: { member_id: "${m}", program_id: "${prog}", care_manager_id: "${cm_a}" }
              as: ProgramAdmin
              captures: { enr: $.data.id }
          trigger:
            - call: "POST /care-management/enrollments"
              payload: { member_id: "${m}", program_id: "${prog}", care_manager_id: "${cm_a}" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
            - call: "GET /care-management/enrollments"
              payload: { member_id: "${m}", program_id: "${prog}" }
              as: ProgramAdmin
          assert:
            - "HTTP 409"
            - "${err} == ERR_DUPLICATE_ACTIVE_ENROLLMENT"
            - "the enrollment list for the pair returns total_count == 1"
            - "CareManager.${cm_a}.assigned_caseload_points == 1.0"

      - name: enrollment_without_matching_variant_returns_stratification_required
        claim_type: cross_entity_validation
        grounds: ["validations[priority=66]", "errors[ERR_STRATIFICATION_REQUIRED]", "entities.Program.fields.stratification_variant"]
        distinguishing_aspect: "The program reads PROSPECTIVE, so a member holding only a CONCURRENT stratification is rejected with ERR_STRATIFICATION_REQUIRED and HTTP 422 even though a stratification does exist."
        test_recipe:
          setup: ["Program with stratification_variant PROSPECTIVE and min_risk_tier LOW; member holds exactly one CONCURRENT stratification."]
          setup_api_calls:
            - call: "POST /care-management/programs"
              payload: { name: "Prospective Program", min_risk_tier: "LOW", stratification_variant: "PROSPECTIVE", required_credential_levels: ["RN"], staff_minute_budget: 100000, hourly_cost_cents: 9000, cohort_benchmark_pmpm_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Rita Nolan", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 20.0 }
              as: ProgramAdmin
              captures: { cm_a: $.data.id }
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-6401", full_name: "Var Vic", birth_date: "1970-01-01", state_code: "CA", chronic_condition_count: 0 }
              as: ProgramAdmin
              captures: { m: $.data.id }
            - call: "POST /care-management/members/${m}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
          trigger:
            - call: "POST /care-management/enrollments"
              payload: { member_id: "${m}", program_id: "${prog}", care_manager_id: "${cm_a}" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
            - call: "POST /care-management/members/${m}/stratifications"
              payload: { variant: "PROSPECTIVE" }
              as: UtilizationAnalyst
            - call: "POST /care-management/enrollments"
              payload: { member_id: "${m}", program_id: "${prog}", care_manager_id: "${cm_a}" }
              as: ProgramAdmin
              captures: { enr: $.data.id, tier_snap: $.data.risk_tier_at_enrollment }
          assert:
            - "the first create returns HTTP 422 with ${err} == ERR_STRATIFICATION_REQUIRED"
            - "the second create returns HTTP 201"
            - "${tier_snap} == LOW"

      - name: enrollment_below_program_minimum_tier_is_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=67]", "errors[ERR_RISK_TIER_BELOW_PROGRAM_MINIMUM]", "entities.Program.fields.min_risk_tier"]
        distinguishing_aspect: "Program min_risk_tier HIGH ranks above the member's LOW stratification, so the create returns ERR_RISK_TIER_BELOW_PROGRAM_MINIMUM with HTTP 422."
        test_recipe:
          setup: ["Program with min_risk_tier HIGH; member with chronic_condition_count 0 stratifies CONCURRENT to LOW."]
          setup_api_calls:
            - call: "POST /care-management/programs"
              payload: { name: "High Bar Program", min_risk_tier: "HIGH", stratification_variant: "CONCURRENT", required_credential_levels: ["RN"], staff_minute_budget: 100000, hourly_cost_cents: 9000, cohort_benchmark_pmpm_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Rita Nolan", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 20.0 }
              as: ProgramAdmin
              captures: { cm_a: $.data.id }
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-6501", full_name: "Low Lou", birth_date: "1970-01-01", state_code: "CA", chronic_condition_count: 0 }
              as: ProgramAdmin
              captures: { m: $.data.id }
            - call: "POST /care-management/members/${m}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
              captures: { tier: $.data.tier }
          trigger:
            - call: "POST /care-management/enrollments"
              payload: { member_id: "${m}", program_id: "${prog}", care_manager_id: "${cm_a}" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${tier} == LOW"
            - "HTTP 422"
            - "${err} == ERR_RISK_TIER_BELOW_PROGRAM_MINIMUM"
            - "CareManager.${cm_a}.assigned_caseload_points == 0.0"

      - name: enrollment_with_unauthorized_credential_is_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority=50]", "errors[ERR_CREDENTIAL_NOT_AUTHORIZED]", "entities.Program.fields.required_credential_levels"]
        distinguishing_aspect: "The program requires LCSW, so naming an RN care manager on the create returns ERR_CREDENTIAL_NOT_AUTHORIZED with HTTP 422 even though tier eligibility and capacity both pass."
        test_recipe:
          setup: ["Program requiring LCSW only; one RN care manager; member stratified CONCURRENT to LOW."]
          setup_api_calls:
            - call: "POST /care-management/programs"
              payload: { name: "LCSW Only Program", min_risk_tier: "LOW", stratification_variant: "CONCURRENT", required_credential_levels: ["LCSW"], staff_minute_budget: 100000, hourly_cost_cents: 9000, cohort_benchmark_pmpm_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Rita Nolan", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 20.0 }
              as: ProgramAdmin
              captures: { cm_rn: $.data.id }
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-6601", full_name: "Cred Cy", birth_date: "1970-01-01", state_code: "CA", chronic_condition_count: 0 }
              as: ProgramAdmin
              captures: { m: $.data.id }
            - call: "POST /care-management/members/${m}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
          trigger:
            - call: "POST /care-management/enrollments"
              payload: { member_id: "${m}", program_id: "${prog}", care_manager_id: "${cm_rn}" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "${err} == ERR_CREDENTIAL_NOT_AUTHORIZED"

      - name: enrollment_with_state_licensure_mismatch_is_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority=52]", "errors[ERR_STATE_LICENSURE_MISMATCH]", "entities.CareManager.fields.licensed_state_codes"]
        distinguishing_aspect: "The care manager holds the required RN credential but is licensed only in NY while the member lives in CA, so the create returns ERR_STATE_LICENSURE_MISMATCH with HTTP 422 - a different rule from the credential check."
        test_recipe:
          setup: ["Program requiring RN; one RN care manager licensed only in NY; a CA member stratified CONCURRENT to LOW."]
          setup_api_calls:
            - call: "POST /care-management/programs"
