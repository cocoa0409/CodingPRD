  # ===========================================================================
  # RULE 3 — non-linear state machines on two different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: marketing_plan_revision_loop_increments_round_then_releases_units
        grounds:
          - state_machines.MarketingPlan.state
          - entities.MarketingPlan.fields.revision_round
          - state_machines.AffordableUnit.occupancy_status
        distinguishing_aspect: |
          The non-linear entity here is MarketingPlan: SUBMITTED -> REVISION_REQUESTED ->
          SUBMITTED is a true cycle whose loop counter revision_round advances on every pass,
          and the same review trigger forks into two branches with disjoint side-effect sets
          — REQUEST_REVISION touches no unit at all, while APPROVE sweeps every PLANNED unit
          of the project to MARKETING. A single-pass implementation that treats review as
          terminal, or that runs the unit sweep on both branches, is caught.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project (R-2, 10 units) screened SUBJECT with required_affordable_units 1, ONSITE path, agreement recorded so project.state is AGREEMENT_RECORDED."
            - "One RENTAL 2-bedroom unit created, occupancy_status PLANNED."
            - "MarketingPlan submitted with the half-open window [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Juniper Walk", zoning_district: "R-2", total_units: 10, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${p_id}/elect-path", payload: { compliance_path: "ONSITE" }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/regulatory-agreements", payload: { project_id: "${p_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { a_id: $.data.id } }
            - { call: "POST /iz-compliance/regulatory-agreements/${a_id}/record", payload: { doc_number: "DOC-JW-0001", recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${p_id}", agreement_id: "${a_id}", unit_number: "J-101", bedrooms: 2, sqft: 900, market_comparable_sqft: 1000, tenure: "RENTAL", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-1", captures: { u_id: $.data.id } }
            - { call: "POST /iz-compliance/marketing-plans", payload: { project_id: "${p_id}", lottery_open_at: "2026-09-01T00:00:00Z", lottery_close_at: "2026-10-01T00:00:00Z", preference_categories: ["LIVE_WORK"] }, as: Developer, as_user_id: "dev-1", captures: { mp_id: $.data.id } }
          trigger:
            - call: "POST /iz-compliance/marketing-plans/${mp_id}/review"
              payload: { decision: "REQUEST_REVISION", review_note: "Affirmative marketing outreach list is incomplete." }
              as: HousingComplianceOfficer
              as_user_id: "hco-1"
            - call: "POST /iz-compliance/marketing-plans/${mp_id}/resubmit"
              payload: { lottery_open_at: "2026-10-01T00:00:00Z", lottery_close_at: "2026-11-01T00:00:00Z", preference_categories: ["LIVE_WORK", "DISPLACED"] }
              as: Developer
              as_user_id: "dev-1"
            - call: "POST /iz-compliance/marketing-plans/${mp_id}/review"
              payload: { decision: "APPROVE" }
              as: HousingComplianceOfficer
              as_user_id: "hco-1"
          assert:
            - "after the REQUEST_REVISION review, MarketingPlan.${mp_id}.state == REVISION_REQUESTED and MarketingPlan.${mp_id}.revision_round == 0 and AffordableUnit.${u_id}.occupancy_status is still PLANNED"
            - "after the resubmit, MarketingPlan.${mp_id}.state == SUBMITTED and MarketingPlan.${mp_id}.revision_round == 1"
            - "after the resubmit, MarketingPlan.${mp_id}.lottery_open_at == 2026-10-01T00:00:00Z and lottery_close_at == 2026-11-01T00:00:00Z and preference_categories == [LIVE_WORK, DISPLACED]"
            - "after the APPROVE review, MarketingPlan.${mp_id}.state == APPROVED and MarketingPlan.${mp_id}.reviewed_by_user_id == hco-1"
            - "after the APPROVE review, AffordableUnit.${u_id}.occupancy_status == MARKETING"
            - "MarketingPlan.${mp_id}.revision_round is still 1 after approval — approval is not another pass of the loop"

      - name: escalated_review_reenters_cure_without_resetting_deadline
        grounds:
          - state_machines.MonitoringReview.state
          - state_machines.AffordableUnit.compliance_status
          - calculations.cure_penalty_and_deadline
          - calculations.project_compliance_posture
        distinguishing_aspect: |
          The non-linear entity here is MonitoringReview, a different entity from
          MarketingPlan: FINDING_ISSUED -> ESCALATED -> CURE_SUBMITTED -> CURED re-enters the
          cure pipeline after enforcement, and the re-entry is reachable only from ESCALATED
          (not from CURED, which is terminal). Each pass recomputes penalty_final_cents from
          the growing elapsed time (113384 at 2027-04-05, then 138384 at 2027-05-05) while
          cure_deadline stays frozen at 2027-03-31, and the mirrored compliance_status cycle
          OUT_OF_COMPLIANCE -> CURE_PENDING -> COMPLIANT drags the project posture from
          UNDER_ENFORCEMENT back to COMPLIANT_ONSITE.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project (R-2, 10 units) screened SUBJECT with required_affordable_units 1 and total_obligation_bps 10000, ONSITE path, agreement recorded."
            - "One RENTAL 2-bedroom unit at 5000 bps; one household of size 3 (income 6000000) certified against it, freezing max_allowed_rent_cents at 143872 and making the project COMPLIANT_ONSITE."
            - "Clock advanced to 2027-03-01T00:00:00Z; monitoring review for 2027 records reported_rent_cents 165000, issuing a RENT_OVERCHARGE finding with penalty_at_base_cents 88384, cure_extension_days 0 and cure_deadline 2027-03-31."
            - "Clock advanced to 2027-04-05T00:00:00Z and a cure is submitted 5 days past the deadline, so the review ESCALATES with penalty_final_cents 113384 and the unit becomes OUT_OF_COMPLIANCE."
