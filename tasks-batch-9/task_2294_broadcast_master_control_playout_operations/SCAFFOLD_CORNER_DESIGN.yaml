            - "hop 2: Playlist.${pl1_id}.status == IMPORTED, armed_at_utc is null, blocked_item_count == 2, and traffic_revision is still 1 (a cascade is not a revision)"
            - "hop 3: SpotOrder.${ord1_id}.scheduled_spots == 0, credited_spots == 2, credit_accrued_cents == 200000 (full per-spot rate, not a short-air fraction), status == PARTIALLY_CREDITED"
            - "spot_inventory_conservation still totals 4: 0 aired + 0 short + 2 credited + 0 scheduled + 2 unplaced"
