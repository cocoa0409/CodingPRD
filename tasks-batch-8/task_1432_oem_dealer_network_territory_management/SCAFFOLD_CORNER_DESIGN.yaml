      - name: payment_on_paid_off_advance_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.FloorPlanAdvance"
          - "errors[ERR_ADVANCE_NOT_OPEN]"
        distinguishing_aspect: "A PAID_OFF (terminal) advance rejects further payments with ERR_ADVANCE_NOT_OPEN."
        test_recipe:
          setup: ["Dealer DL-PO1 ACTIVE; advance PO-1 of 40000 fully paid"]
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer PO1", dealer_code: "DL-PO1", region: "West", credit_limit_cents: 100000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-PO1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-PO2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-PO1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/floorplan-advances", payload: { dealer_id: "${d}", unit_serial: "PO-1", advance_cents: 40000 }, as: OemNetworkAdmin, captures: { adv: $.data.id } }
            - { call: "POST /network/floorplan-advances/${adv}/payment", payload: { amount_cents: 40000 }, as: OemNetworkAdmin }
          trigger:
            - { call: "POST /network/floorplan-advances/${adv}/payment", payload: { amount_cents: 1 }, as: OemNetworkAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ADVANCE_NOT_OPEN"
            - "FloorPlanAdvance.${adv}.status == PAID_OFF (unchanged)"

      - name: sale_create_without_open_target_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_TARGET_NOT_OPEN]"
          - "state_machines.UnitSale"
        distinguishing_aspect: "A sale whose sale_date quarter has no OPEN target for the dealer fails with ERR_TARGET_NOT_OPEN 409."
        test_recipe:
          setup: ["Dealer DL-NT1 ACTIVE; no target for 2026 Q3"]
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer NT1", dealer_code: "DL-NT1", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-NT1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-NT2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-NT1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
          trigger:
            - { call: "POST /network/unit-sales", payload: { dealer_id: "${d}", unit_serial: "NT-1", sale_date: "2026-08-05", list_price_cents: 10000 }, as: DealerUser, as_user_id: "${d}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TARGET_NOT_OPEN"

      - name: agreement_expire_before_expiry_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_AGREEMENT_NOT_YET_EXPIRED]"
          - "state_machines.DealerAgreement.ACTIVE_to_EXPIRED"
        distinguishing_aspect: "Expire requires clock beyond expiry_date: at default clock 2026-08-01 an agreement expiring 2026-12-31 fails with ERR_AGREEMENT_NOT_YET_EXPIRED."
        test_recipe:
          setup: ["Dealer DL-AX1 ACTIVE with agreement AGR-AX1 ACTIVE expiring 2026-12-31"]
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer AX1", dealer_code: "DL-AX1", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-AX1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-AX2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-AX1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
          trigger:
            - { call: "POST /network/dealer-agreements/${a}/expire", payload: {}, as: OemNetworkAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_AGREEMENT_NOT_YET_EXPIRED"
            - "DealerAgreement.${a}.status == ACTIVE (unchanged)"

      - name: release_released_assignment_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.TerritoryAssignment"
          - "errors[ERR_ASSIGNMENT_NOT_ACTIVE]"
        distinguishing_aspect: "Releasing an already-RELEASED (terminal) assignment fails with ERR_ASSIGNMENT_NOT_ACTIVE."
        test_recipe:
          setup: ["Dealer DL-RL1 ACTIVE with assignment on T-RL already released once"]
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer RL1", dealer_code: "DL-RL1", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-RL1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-RL2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-RL1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/territory-assignments", payload: { dealer_id: "${d}", agreement_id: "${a}", territory_code: "T-RL", coverage_type: "EXCLUSIVE", starts_on: "2026-01-01", ends_on: "2026-12-31" }, as: OemNetworkAdmin, captures: { asg: $.data.id } }
            - { call: "POST /network/territory-assignments/${asg}/release", payload: {}, as: OemNetworkAdmin }
          trigger:
            - { call: "POST /network/territory-assignments/${asg}/release", payload: {}, as: OemNetworkAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ASSIGNMENT_NOT_ACTIVE"
            - "TerritoryAssignment.${asg}.status == RELEASED (unchanged)"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: leads_pagination_limit_offset_interaction
        claim_type: pagination
        grounds:
          - "response_envelope"
          - "endpoints"
        distinguishing_aspect: "limit=2 over 3 leads returns exactly 2 items with total_count 3 and has_more true; offset=2 returns the final 1 item with has_more false."
        test_recipe:
          setup: ["three leads created on territory T-PG"]
          setup_api_calls:
            - { call: "POST /network/leads", payload: { territory_code: "T-PG", product_line: "DOZER", estimated_value_cents: 100000, contact_name: "L1" }, as: OemSalesOps }
            - { call: "POST /network/leads", payload: { territory_code: "T-PG", product_line: "DOZER", estimated_value_cents: 110000, contact_name: "L2" }, as: OemSalesOps }
            - { call: "POST /network/leads", payload: { territory_code: "T-PG", product_line: "LOADER", estimated_value_cents: 120000, contact_name: "L3" }, as: OemSalesOps }
          trigger:
            - { call: "GET /network/leads", payload: { limit: 2, offset: 0 }, as: Any }
            - { call: "GET /network/leads", payload: { limit: 2, offset: 2 }, as: Any }
          assert:
            - "page 1: data length == 2, total_count == 3, has_more == true"
            - "page 2: data length == 1, total_count == 3, has_more == false"

      - name: response_envelope_shape_on_read
        claim_type: envelope_shape
        grounds:
          - "response_envelope"
        distinguishing_aspect: "Every success response carries meta.api_request_id, meta.api_request_timestamp, response_type object|array, and a data payload."
        test_recipe:
          setup: ["one dealer exists"]
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer EN1", dealer_code: "DL-EN1", region: "West", credit_limit_cents: 100000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id } }
          trigger:
            - { call: "GET /network/dealers/${d}", as: Any }
          assert:
            - "meta.api_request_id is present and non-empty"
            - "meta.api_request_timestamp is ISO8601"
            - "response_type == 'object' for single read"
            - "data.dealer_code == 'DL-EN1'"

      - name: filtered_list_returns_only_matching_dealer_claims
        claim_type: filtered_list
        grounds:
          - "endpoints"
          - "entities.WarrantyClaim.fields.dealer_id"
        distinguishing_aspect: "GET /network/warranty-claims?dealer_id=X is the FK reverse-reachability read: it returns exactly X's claims and nothing else."
        test_recipe:
          setup: ["Dealer DL-FL1 ACTIVE with two claims; Dealer DL-FL2 exists with no claims"]
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer FL1", dealer_code: "DL-FL1", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-FL1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-FL2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-FL1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/warranty-claims", payload: { dealer_id: "${d}", unit_serial: "FL-1", parts_cost_cents: 1000, labor_hours: 0, failure_description: "f1" }, as: DealerUser, as_user_id: "${d}" }
            - { call: "POST /network/warranty-claims", payload: { dealer_id: "${d}", unit_serial: "FL-2", parts_cost_cents: 2000, labor_hours: 0, failure_description: "f2" }, as: DealerUser, as_user_id: "${d}" }
            - { call: "POST /network/dealers", payload: { name: "Dealer FL2", dealer_code: "DL-FL2", region: "East", credit_limit_cents: 100000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d2: $.data.id } }
          trigger:
            - { call: "GET /network/warranty-claims", payload: { dealer_id: "${d}" }, as: Any }
            - { call: "GET /network/warranty-claims", payload: { dealer_id: "${d2}" }, as: Any }
          assert:
            - "filter by ${d}: total_count == 2 and every item's dealer_id == ${d}"
            - "filter by ${d2}: total_count == 0 and data == []"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_territory_overlap_trigger
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_TERRITORY_OVERLAP]"
        excluded_because:
          difficulty_instance: territory_assignment_half_open_adjacency
          rationale: "Asserted as the failure path (overlapping [2026-06-15, 2026-08-01) rejected) of the named §1.8 instance."

      - name: error_agreement_overlap_trigger
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_AGREEMENT_OVERLAP]"
        excluded_because:
          difficulty_instance: agreement_activation_inclusive_overlap
          rationale: "Asserted as the failure path (touching 2026-12-31 without supersede flag) of the named §1.8 instance."

      - name: error_certification_compliance_trigger
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_CERTIFICATION_COMPLIANCE]"
        excluded_because:
          difficulty_instance: agreement_activation_requires_certifications
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_sale_payoff_locked_trigger
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SALE_PAYOFF_LOCKED]"
        excluded_because:
          difficulty_instance: sale_void_blocked_by_floorplan_payoff
          rationale: "Asserted as the failure path of the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: auditor_cannot_route_leads
        claim_type: rbac_exclusive_denial
        grounds:
          - "roles[OemAuditor]"
          - "roles[OemSalesOps]"
          - "errors[ERR_UNAUTHORIZED_ROLE]"
        distinguishing_aspect: "Lead routing is exclusive to OemSalesOps; OemAuditor gets ERR_UNAUTHORIZED_ROLE 403."
        test_recipe:
          setup: ["one NEW lead exists"]
          setup_api_calls:
            - { call: "POST /network/leads", payload: { territory_code: "T-RB", product_line: "DOZER", estimated_value_cents: 100000, contact_name: "Bo" }, as: OemSalesOps, captures: { lead: $.data.id } }
          trigger:
            - { call: "POST /network/leads/${lead}/route", payload: {}, as: OemAuditor, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE"
            - "HTTP status == 403"
            - "Lead.${lead}.status == NEW (unchanged)"

      - name: dealer_user_cannot_close_target
        claim_type: rbac_exclusive_denial
        grounds:
          - "roles[DealerUser]"
          - "roles[OemSalesOps]"
          - "errors[ERR_UNAUTHORIZED_ROLE]"
        distinguishing_aspect: "Target close is exclusive to OemSalesOps; DealerUser is denied with 403 even for their own dealer's target."
        test_recipe:
          setup: ["Dealer DL-RC1 exists with an OPEN target"]
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer RC1", dealer_code: "DL-RC1", region: "West", credit_limit_cents: 100000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id } }
            - { call: "POST /network/sales-targets", payload: { dealer_id: "${d}", period_year: 2026, period_quarter: 3, target_units: 5 }, as: OemSalesOps, captures: { t: $.data.id } }
          trigger:
            - { call: "POST /network/sales-targets/${t}/close", payload: {}, as: DealerUser, as_user_id: "${d}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE"
            - "SalesTarget.${t}.status == OPEN (unchanged)"

      - name: sales_ops_cannot_chargeback_claim
        claim_type: rbac_exclusive_denial
        grounds:
          - "roles[OemSalesOps]"
          - "roles[OemAuditor]"
          - "errors[ERR_UNAUTHORIZED_ROLE]"
        distinguishing_aspect: "Chargeback is exclusive to OemAuditor (segregation from sales ops); OemSalesOps gets ERR_UNAUTHORIZED_ROLE 403."
        test_recipe:
          setup: ["Dealer DL-RD2 ACTIVE; claim PAID then AUDIT_FLAGGED"]
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer RD2", dealer_code: "DL-RD2", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-RD3", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-RD4", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-RD2", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/warranty-claims", payload: { dealer_id: "${d}", unit_serial: "RD-2", parts_cost_cents: 1000, labor_hours: 0, failure_description: "filter" }, as: DealerUser, as_user_id: "${d}", captures: { cl: $.data.id } }
            - { call: "POST /network/warranty-claims/${cl}/decide", payload: { decision: "APPROVE" }, as: OemAuditor }
            - { call: "POST /network/warranty-claims/${cl}/pay", payload: {}, as: OemAuditor }
            - { call: "POST /network/warranty-claims/${cl}/flag-audit", payload: {}, as: OemAuditor }
          trigger:
            - { call: "POST /network/warranty-claims/${cl}/chargeback", payload: { finding: "FULL" }, as: OemSalesOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE"
            - "WarrantyClaim.${cl}.status == AUDIT_FLAGGED (unchanged)"

      - name: non_routed_dealer_cannot_respond_to_lead
        claim_type: rbac_ownership_denial
        grounds:
          - "errors[ERR_LEAD_NOT_ROUTED_TO_DEALER]"
          - "roles[DealerUser]"
        distinguishing_aspect: "Lead respond is ownership-checked: a DealerUser who is not the routed dealer gets ERR_LEAD_NOT_ROUTED_TO_DEALER 403."
        test_recipe:
          setup: ["Dealers DL-RN1 (routed) and DL-RN2 (intruder) ACTIVE, both SHARED on T-RN; lead routed to DL-RN1"]
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer RN1", dealer_code: "DL-RN1", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d1: $.data.id, d1_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d1}", cert_code: "CTE-RN1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d1}", captures: { x1: $.data.id } }
            - { call: "POST /network/certifications/${x1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d1}", cert_code: "CTE-RN2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d1}", captures: { x2: $.data.id } }
            - { call: "POST /network/certifications/${x2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d1}", agreement_code: "AGR-RN1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a1: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a1}/activate", payload: { expected_dealer_version: "${d1_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/dealers", payload: { name: "Dealer RN2", dealer_code: "DL-RN2", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d2: $.data.id, d2_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d2}", cert_code: "CTE-RN3", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d2}", captures: { y1: $.data.id } }
            - { call: "POST /network/certifications/${y1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d2}", cert_code: "CTE-RN4", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d2}", captures: { y2: $.data.id } }
            - { call: "POST /network/certifications/${y2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d2}", agreement_code: "AGR-RN2", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a2: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a2}/activate", payload: { expected_dealer_version: "${d2_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/territory-assignments", payload: { dealer_id: "${d1}", agreement_id: "${a1}", territory_code: "T-RN", coverage_type: "SHARED", starts_on: "2026-01-01", ends_on: "2026-12-31" }, as: OemNetworkAdmin }
            - { call: "POST /network/territory-assignments", payload: { dealer_id: "${d2}", agreement_id: "${a2}", territory_code: "T-RN", coverage_type: "SHARED", starts_on: "2026-01-01", ends_on: "2026-12-31" }, as: OemNetworkAdmin }
            - { call: "POST /network/leads", payload: { territory_code: "T-RN", product_line: "DOZER", estimated_value_cents: 100000, contact_name: "Cy" }, as: OemSalesOps, captures: { lead: $.data.id } }
            - { call: "POST /network/leads/${lead}/route", payload: {}, as: OemSalesOps }
          trigger:
            - { call: "POST /network/leads/${lead}/respond", payload: { response: "ACCEPT" }, as: DealerUser, as_user_id: "${d2}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LEAD_NOT_ROUTED_TO_DEALER (routed to ${d1}, not ${d2})"
            - "Lead.${lead}.status == ROUTED (unchanged)"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_dealer_version_rejected
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[agreement-activate-stale-dealer]"
          - "endpoints"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "OCC layer: after A1's activation bumps Dealer.version 1 -> 2, activating A2 with the stale captured version 1 fails with 412 ERR_STALE_VERSION; retrying with the fresh version succeeds."
        test_recipe:
          setup: ["Dealer DL-OCC ACTIVE via AGR-OCC1 (dealer version now 2); second DRAFT agreement AGR-OCC2 on a non-overlapping 2027 window"]
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer OCC", dealer_code: "DL-OCC", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-OC1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-OC2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-OCC1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a1: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a1}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-OCC2", effective_date: "2027-01-01", expiry_date: "2027-12-31" }, as: OemNetworkAdmin, captures: { a2: $.data.id } }
          trigger:
            - { call: "POST /network/dealer-agreements/${a2}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /network/dealers/${d}", as: Any, captures: { d_v2: $.data.version } }
            - { call: "POST /network/dealer-agreements/${a2}/activate", payload: { expected_dealer_version: "${d_v2}" }, as: OemNetworkAdmin }
          assert:
            - "stale activate (${d_v} captured before A1 activation): error_id == ERR_STALE_VERSION, HTTP 412"
            - "fresh activate (${d_v2} == 2): succeeds"
            - "DealerAgreement.${a2}.status == ACTIVE and Dealer.version advanced to 3"

      - name: sale_acceptance_pays_off_floorplan_cascade
        claim_type: cascade_side_effect
        grounds:
          - "state_machines.UnitSale.REPORTED_to_ACCEPTED"
          - "state_machines.FloorPlanAdvance.OPEN_to_PAID_OFF"
          - "entities.Dealer.fields.floorplan_utilization_cents"
        distinguishing_aspect: "Cascading side-effects layer: accepting the retail sale of a financed unit pays off its advance and releases utilization in the same request."
        test_recipe:
          setup: ["Dealer DL-CS1 ACTIVE credit 200000; OPEN advance 50000 on serial CS-1; target Q3 units 5; sale on serial CS-1 REPORTED"]
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer CS1", dealer_code: "DL-CS1", region: "West", credit_limit_cents: 200000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-CS1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-CS2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-CS1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/floorplan-advances", payload: { dealer_id: "${d}", unit_serial: "CS-1", advance_cents: 50000 }, as: OemNetworkAdmin, captures: { adv: $.data.id } }
            - { call: "POST /network/sales-targets", payload: { dealer_id: "${d}", period_year: 2026, period_quarter: 3, target_units: 5 }, as: OemSalesOps, captures: { t: $.data.id } }
            - { call: "POST /network/unit-sales", payload: { dealer_id: "${d}", unit_serial: "CS-1", sale_date: "2026-08-03", list_price_cents: 80000 }, as: DealerUser, as_user_id: "${d}", captures: { s: $.data.id } }
          trigger:
            - { call: "POST /network/unit-sales/${s}/decide", payload: { decision: "ACCEPT" }, as: OemSalesOps }
            - { call: "GET /network/floorplan-advances/${adv}", as: Any }
            - { call: "GET /network/dealers/${d}", as: Any }
          assert:
            - "FloorPlanAdvance.${adv}.status == PAID_OFF (cascade from acceptance)"
            - "FloorPlanAdvance.${adv}.paid_curtailments_cents == 50000"
            - "Dealer.${d}.floorplan_utilization_cents == 0 (released)"
            - "SalesTarget.${t}.achieved_units == 1"

      - name: suspension_requeues_routed_leads
        claim_type: cascade_side_effect
        grounds:
          - "state_machines.Dealer.ACTIVE_to_SUSPENDED"
          - "state_machines.Lead"
        excluded_because:
          difficulty_instance: chargeback_suspension_cascade
          rationale: "Asserted as link 3 of the named §1.8 instance (lead re-queued to NEW when suspension fires)."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_mutation
        claim_type: immediate_consistency
        grounds:
          - "complexity_profile"
        distinguishing_aspect: "Immediate consistency: a dealer created via POST is readable by GET in the next request with identical field values, and list endpoints reflect it without delay."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer IM1", dealer_code: "DL-IM1", region: "West", credit_limit_cents: 123456, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id } }
          trigger:
            - { call: "GET /network/dealers/${d}", as: Any }
            - { call: "GET /network/dealers", as: Any }
          assert:
            - "GET single: dealer_code == 'DL-IM1' and credit_limit_cents == 123456 (same values as creation)"
            - "GET list: total_count == 1 and data[0].id == ${d}"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: duplicate_agreement_code_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_DUPLICATE_AGREEMENT_CODE]"
          - "entities.DealerAgreement.fields.agreement_code"
        distinguishing_aspect: "agreement_code uniqueness: a second agreement reusing an existing code fails with ERR_DUPLICATE_AGREEMENT_CODE 409."
        test_recipe:
          setup: ["Dealer DL-DG1 exists with agreement AGR-DUP"]
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer DG1", dealer_code: "DL-DG1", region: "West", credit_limit_cents: 100000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id } }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-DUP", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin }
          trigger:
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-DUP", effective_date: "2027-01-01", expiry_date: "2027-12-31" }, as: OemNetworkAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_AGREEMENT_CODE"

      - name: duplicate_unit_serial_sale_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_DUPLICATE_UNIT_SERIAL]"
          - "entities.UnitSale.fields.unit_serial"
        distinguishing_aspect: "A second non-terminal sale with the same (dealer_id, unit_serial) fails with ERR_DUPLICATE_UNIT_SERIAL 409."
        test_recipe:
          setup: ["Dealer DL-DS1 ACTIVE; target Q3 2026 units 9; sale on serial DS-1 already REPORTED"]
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer DS1", dealer_code: "DL-DS1", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-DS1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-DS2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-DS1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/sales-targets", payload: { dealer_id: "${d}", period_year: 2026, period_quarter: 3, target_units: 9 }, as: OemSalesOps }
            - { call: "POST /network/unit-sales", payload: { dealer_id: "${d}", unit_serial: "DS-1", sale_date: "2026-08-05", list_price_cents: 10000 }, as: DealerUser, as_user_id: "${d}" }
          trigger:
            - { call: "POST /network/unit-sales", payload: { dealer_id: "${d}", unit_serial: "DS-1", sale_date: "2026-08-06", list_price_cents: 12000 }, as: DealerUser, as_user_id: "${d}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_UNIT_SERIAL"
            - "GET /network/unit-sales?dealer_id=${d} total_count == 1 (only the first sale persisted)"
