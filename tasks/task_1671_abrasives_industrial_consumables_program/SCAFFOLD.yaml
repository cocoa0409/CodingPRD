# =============================================================================
# SCAFFOLD — Abrasives & Industrial Consumables Program (3M abrasives distributor)
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Abrasives & Industrial Consumables Program (3M abrasives distributor): usage rate per operation & standard consumption, shelf-life on bonded products & rotation, safety (speed rating/guard) compliance, trial-and-conversion documentation, contract price hold & escalation clause, blanket order release scheduling, waste/disposal of used media, product substitution on discontinuation

domain_name: abrasives-consumables-program
api_prefix: /api

complexity_profile:
  primary_archetype: quota_allocation        # blanket-order committed pools reserved/consumed/released by releases
  secondary_archetype: compliance_audit      # speed/guard safety gating, shelf-life rotation, hazard disposal manifests
  complexity_layers:
    - optimistic_concurrency                 # OCC on BlanketOrder.version (release create) and Contract.version (amend)
    - cascading_side_effects                 # amend: Contract→ContractLine→BlanketOrder→Release; discontinue: Product→BlanketOrder→Release
    - dual_variant_calculation               # provisional-vs-final release price; EXACT_DAY-vs-END_OF_MONTH lot expiry
    - rate_threshold_triggers                # rolling usage-variance trigger; monthly hazard-mass threshold
  entity_topology: flat                      # peer entities joined by FK references; no URL nesting except release creation
  state_machine_shape: branching             # Release forks to CANCELLED from 3 states with divergent side effects; MachineAsset is cyclic
  relationship_patterns: [one_to_many, self_referential, cross_aggregate]
  role_model: segregation_of_duties          # trial results submitter may not approve conversion
  consistency_model: immediate               # all mutations + cascades atomic within the request

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Manufacturer/distributor SKU; unique across all products" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: product_form, type: enum, source: input, description: "COATED | BONDED | NONWOVEN" }
      - { name: max_operating_speed_rpm, type: integer, source: input, description: "Maximum safe operating speed of the abrasive product; must be >= 1" }
      - { name: shelf_life_months, type: integer, source: input, default: null, description: "Shelf life in calendar months; REQUIRED when product_form == BONDED, ignored otherwise" }
      - { name: shelf_life_policy, type: enum, source: input, default: "EXACT_DAY", description: "EXACT_DAY | END_OF_MONTH — selects the lot_expiry_date variant" }
      - { name: used_media_hazard_class, type: enum, source: input, default: "NONE", description: "NONE | METAL_SWARF | OIL_CONTAMINATED — hazard class of used media" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED" }
      - { name: replacement_product_id, type: string, source: system, default: null, description: "FK -> Product.id; substitution target set at discontinuation" }
      - { name: discontinued_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of discontinuation" }

  - name: MachineAsset
    parent: null
    common_fields: true
    fields:
      - { name: customer_ref, type: string, source: input, description: "Free-form customer/plant reference (no Customer entity)" }
      - { name: asset_tag, type: string, source: input, description: "Plant-floor asset tag" }
      - { name: machine_type, type: string, source: input, description: "e.g. ANGLE_GRINDER, BELT_SANDER, BENCH_GRINDER" }
      - { name: spindle_max_rpm, type: integer, source: input, description: "Maximum spindle speed of the machine; >= 1" }
      - { name: guard_type, type: enum, source: input, description: "FIXED | ADJUSTABLE | NONE" }
      - { name: status, type: enum, source: system, description: "ACTIVE | QUARANTINED (cyclic)" }
      - { name: consumption_flag, type: enum, source: computed, description: "NORMAL | ELEVATED — derived from covering standards' needs_review (see consumption_variance)" }

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the stocked product" }
      - { name: lot_code, type: string, source: input, description: "Manufacturer lot/batch code" }
      - { name: manufacture_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) of manufacture" }
      - { name: qty_received, type: integer, source: input, description: "Units received into the lot; >= 1" }
      - { name: qty_on_hand, type: integer, source: computed, description: "qty_received minus picked/shipped/consumed units plus cancel-restores" }
      - { name: expiry_date, type: string, source: computed, default: null, description: "ISO date; from lot_expiry_date calc; NULL when product has no shelf_life_months" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | BLOCKED | EXPIRED | DEPLETED" }

  - name: UsageStandard
    parent: null
    common_fields: true
    fields:
      - { name: machine_id, type: string, source: input, description: "FK -> MachineAsset.id; operation machine" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; standard applies to this product on the machine" }
      - { name: operation_name, type: string, source: input, description: "e.g. WELD_BLEND, EDGE_CHAMFER" }
      - { name: standard_qty_per_part, type: number, source: input, description: "Standard consumption (media units per part), 4 decimal places; > 0" }
      - { name: effective_from, type: string, source: input, description: "ISO date; window start (inclusive)" }
      - { name: effective_to, type: string, source: input, default: null, description: "ISO date; window end (EXCLUSIVE — half-open window); NULL = open-ended" }
      - { name: needs_review, type: boolean, source: computed, default: false, description: "true when rolling over-consumption trigger fires (see consumption_variance)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }

  - name: UsageRecord
    parent: null
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: machine_id, type: string, source: input, description: "FK -> MachineAsset.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: lot_id, type: string, source: input, description: "FK -> InventoryLot.id; lot the media was drawn from" }
      - { name: usage_date, type: string, source: input, description: "ISO date of consumption; must not be after the current logical-clock date" }
      - { name: qty_used, type: integer, source: input, description: "Media units consumed; >= 1" }
      - { name: parts_produced, type: integer, source: input, description: "Parts produced; >= 1" }
      - { name: actual_qty_per_part, type: number, source: computed, description: "round_half_up(qty_used / parts_produced, 4)" }
      - { name: variance_pct, type: number, source: computed, description: "round_half_up((actual - standard) / standard, 4) against the covering ACTIVE standard" }
      - { name: variance_band, type: enum, source: computed, description: "UNDER | IN_BAND | OVER per consumption_variance thresholds" }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: customer_ref, type: string, source: input, description: "Customer reference this pricing agreement covers" }
      - { name: contract_number, type: string, source: input, description: "Unique contract number" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | EXPIRED | TERMINATED" }
      - { name: term_start, type: string, source: input, description: "ISO date; release ship dates must be >= term_start" }
      - { name: term_end, type: string, source: input, description: "ISO date; release ship dates must be <= term_end; contract expires when clock date > term_end" }
      - { name: price_hold_end, type: string, source: input, description: "ISO date; prices held at base through this date (inclusive)" }
      - { name: escalation_pct, type: number, source: input, description: "Escalation rate, e.g. 0.04; >= 0" }
      - { name: escalation_effective_date, type: string, source: input, description: "ISO date; escalated price applies to evaluations on/after this date" }

  - name: ContractLine
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id; owning contract" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; priced product" }
      - { name: base_unit_price_cents, type: integer, source: input, description: "Contracted base unit price; >= 1" }
      - { name: current_unit_price_cents, type: integer, source: computed, description: "price_at(current clock date); re-stamped at contract activate and amend" }

  - name: BlanketOrder
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; governing pricing contract" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; committed product (swapped on substitution acceptance)" }
      - { name: committed_qty, type: integer, source: input, description: "Total committed units; >= 1" }
      - { name: remaining_qty, type: integer, source: computed, description: "committed_qty minus qty of releases in SCHEDULED|ON_HOLD|PICKED|SHIPPED (CANCELLED excluded)" }
      - { name: substitution_status, type: enum, source: system, description: "NONE | PENDING | ACCEPTED" }
      - { name: provisional_unit_price_cents, type: integer, source: computed, default: null, description: "ContractLine.current_unit_price_cents for the order product; stamped at confirm, re-stamped by amend cascade and substitution acceptance" }
      - { name: provisional_remaining_value_cents, type: integer, source: computed, default: null, description: "remaining_qty * provisional_unit_price_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | CLOSED | CANCELLED" }

  - name: Release
    parent: null
    common_fields: true
    fields:
      - { name: blanket_order_id, type: string, source: system, description: "FK -> BlanketOrder.id; parent blanket order" }
      - { name: qty, type: integer, source: input, description: "Units to ship; >= 1 and <= order remaining_qty at creation" }
      - { name: scheduled_ship_date, type: string, source: input, description: "ISO date; must fall within contract term [term_start, term_end] inclusive" }
      - { name: provisional_unit_price_cents, type: integer, source: computed, description: "price_at(scheduled_ship_date) for the order product, stamped at creation; re-stamped by amend cascade and substitution acceptance" }
      - { name: final_unit_price_cents, type: integer, source: computed, default: null, description: "price_at(current clock date) stamped at SHIP; NULL until shipped" }
      - { name: allocations, type: array, source: system, description: "FEFO pick lines [{lot_id, qty}]; empty until PICKED; cleared on cancel" }
      - { name: billed_total_cents, type: integer, source: computed, default: null, description: "release_billing_total at SHIP; NULL until shipped" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ON_HOLD | PICKED | SHIPPED | CANCELLED" }

  - name: TrialCase
    parent: null
    common_fields: true
    fields:
      - { name: machine_id, type: string, source: input, description: "FK -> MachineAsset.id; trial machine" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; trial (candidate) product" }
      - { name: incumbent_product_id, type: string, source: input, default: null, description: "FK -> Product.id; incumbent product being compared against (optional)" }
      - { name: scheduled_start, type: string, source: input, description: "ISO date; closed-interval window start on the machine" }
      - { name: scheduled_end, type: string, source: input, description: "ISO date; closed-interval window end; must be >= scheduled_start" }
      - { name: results_submitted_by_user_id, type: string, source: system, default: null, description: "X-User-ID recorded at submit-results (segregation-of-duties anchor)" }
      - { name: measured_removal_rate_g_per_min, type: number, source: input, default: null, description: "Trial metric set at submit-results" }
      - { name: parts_per_unit_media, type: number, source: input, default: null, description: "Trial metric set at submit-results; > 0; drives converted standard rate" }
      - { name: cost_per_part_cents, type: integer, source: input, default: null, description: "Trial metric set at submit-results" }
      - { name: converted_standard_id, type: string, source: system, default: null, description: "FK -> UsageStandard.id; standard created by conversion" }
      - { name: rejection_reason, type: string, source: input, default: null, description: "Required at reject" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EVALUATION | CONVERTED | REJECTED" }

  - name: DisposalRecord
    parent: null
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: customer_ref, type: string, source: input, description: "Customer reference; monthly hazard-mass aggregation key" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; disposed media product" }
      - { name: lot_id, type: string, source: input, default: null, description: "FK -> InventoryLot.id; optional traceability link (may reference BLOCKED/EXPIRED lots)" }
      - { name: qty_disposed, type: integer, source: input, description: "Units disposed; >= 1" }
      - { name: gross_weight_kg, type: number, source: input, description: "Gross weight kg, 2 decimal places; > 0" }
      - { name: disposal_method, type: enum, source: input, description: "RECYCLING | INCINERATION | LANDFILL | HAZARDOUS_WASTE_FACILITY" }
      - { name: manifest_number, type: string, source: input, default: null, description: "Waste manifest number; REQUIRED when product hazard class != NONE" }
      - { name: certified_facility_ref, type: string, source: input, default: null, description: "Certified facility reference; REQUIRED when product hazard class != NONE" }
      - { name: regulator_report_ref, type: string, source: input, default: null, description: "Regulator report reference; REQUIRED when hazard_month_mass >= 1000.00 kg" }
      - { name: disposed_at, type: string, source: input, description: "ISO date of disposal; defines the calendar month for hazard_month_mass" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Product
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /api/products/{id}/discontinue"
        actor: ProgramAdmin
        preconditions:
          - "replacement_product_id present in body (ERR_INVALID_REQUEST)"
          - "replacement product exists (ERR_NOT_FOUND), is not the product itself and is ACTIVE (ERR_REPLACEMENT_INVALID)"
        side_effects:
          - "Set replacement_product_id and discontinued_at (logical clock)"
          - "Cascade hop 1: every BlanketOrder in DRAFT|OPEN with product_id == this product gets substitution_status = PENDING"
          - "Cascade hop 2 (from hop 1): every Release in SCHEDULED belonging to a BlanketOrder that just became PENDING moves to ON_HOLD"
          - "Fan-out: every InventoryLot in AVAILABLE with product_id == this product moves to BLOCKED"

  - entity: MachineAsset
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: QUARANTINED
        trigger: "POST /api/machines/{id}/quarantine"
        actor: EHSOfficer
        preconditions: []
        side_effects: []
      - from: QUARANTINED
        to: ACTIVE
        trigger: "POST /api/machines/{id}/reinstate"
        actor: EHSOfficer
        preconditions: []
        side_effects: []
    note: "Cyclic ACTIVE <-> QUARANTINED; no terminal state. Usage and trial creation are gated on ACTIVE (cross-entity precondition)."

  - entity: InventoryLot
    initial_state: AVAILABLE
    terminal_states: [BLOCKED, EXPIRED, DEPLETED]
    transitions:
      - from: AVAILABLE
        to: BLOCKED
        trigger: "system (fan-out of POST /api/products/{id}/discontinue)"
        actor: system
        preconditions: ["lot.product_id == discontinued product"]
        side_effects: []
      - from: AVAILABLE
        to: EXPIRED
        trigger: "system (sweep inside POST /api/_clock/set_current_utc)"
        actor: system
        preconditions: ["expiry_date IS NOT NULL AND expiry_date < new clock date (strictly; equal date stays AVAILABLE)"]
        side_effects: []
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system (qty_on_hand reaches 0 via POST /api/usage-records or POST /api/releases/{id}/pick)"
        actor: system
        preconditions: ["qty_on_hand == 0 after the decrement"]
        side_effects: []
      - from: DEPLETED
        to: AVAILABLE
        trigger: "system (restore path of POST /api/releases/{id}/cancel from PICKED when the restore returns qty_on_hand > 0)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Restore into a BLOCKED or EXPIRED lot leaves status unchanged (qty increases, lot stays excluded from FEFO)."

  - entity: UsageStandard
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /api/standards/{id}/retire OR system (trial-conversion cascade of POST /api/trials/{id}/convert)"
        actor: ProgramAdmin | system
        preconditions: []
        side_effects:
          - "Recompute MachineAsset.consumption_flag for the standard's machine (retirement may clear the last needs_review)"

  - entity: Contract
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/contracts/{id}/activate"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "Stamp every ContractLine.current_unit_price_cents = price_at(current clock date)"
      - from: ACTIVE
        to: ACTIVE
        trigger: "PATCH /api/contracts/{id} (amend escalation_pct and/or price_hold_end; OCC expected_contract_version)"
        actor: ProgramAdmin
        preconditions:
          - "expected_contract_version == contract.version (ERR_STALE_VERSION)"
        side_effects:
          - "Cascade hop 1: every ContractLine of this contract re-stamps current_unit_price_cents = price_at(current clock date)"
          - "Cascade hop 2 (from hop 1): every BlanketOrder in OPEN whose product_id matches a re-stamped line re-stamps provisional_unit_price_cents := line.current_unit_price_cents and provisional_remaining_value_cents := remaining_qty * provisional_unit_price_cents"
          - "Cascade hop 3 (from hop 2): every Release in SCHEDULED belonging to a re-stamped BlanketOrder re-stamps provisional_unit_price_cents := price_at(release.scheduled_ship_date) for the order product"
          - "increments Contract.version by 1"
        note: "Amend is the depth-3 transitive cascade: Contract -> ContractLine -> BlanketOrder -> Release."
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (sweep inside POST /api/_clock/set_current_utc)"
        actor: system
        preconditions: ["term_end < new clock date (strictly; on term_end itself the contract stays ACTIVE)"]
        side_effects: []
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /api/contracts/{id}/terminate"
        actor: ProgramAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/contracts/{id}/terminate"
        actor: ProgramAdmin
        preconditions: []
        side_effects: []

  - entity: BlanketOrder
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /api/blanket-orders/{id}/confirm"
        actor: ProgramAdmin
        preconditions:
          - "contract.status == ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
          - "a ContractLine exists for (contract_id, product_id) (ERR_CONTRACT_LINE_MISSING)"
          - "product.status == ACTIVE (ERR_PRODUCT_DISCONTINUED)"
        side_effects:
          - "remaining_qty := committed_qty"
          - "provisional_unit_price_cents := ContractLine.current_unit_price_cents; provisional_remaining_value_cents := remaining_qty * provisional_unit_price_cents"
          - "increments BlanketOrder.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "system (auto-close check after POST /api/releases/{id}/ship or POST /api/releases/{id}/cancel)"
        actor: system
        preconditions: ["remaining_qty == 0 AND no releases in SCHEDULED|ON_HOLD|PICKED"]
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/blanket-orders/{id}/cancel"
        actor: AccountManager
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "POST /api/blanket-orders/{id}/cancel"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "Cascade: every Release in SCHEDULED|ON_HOLD|PICKED moves to CANCELLED; each cancelled release's qty is returned (but the order is terminal, so remaining_qty stays informational)"
          - "Releases cancelled from PICKED restore each allocation qty to the same InventoryLot (DEPLETED lot returns to AVAILABLE; BLOCKED/EXPIRED lots keep status)"

  - entity: Release
    initial_state: SCHEDULED
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PICKED
        trigger: "POST /api/releases/{id}/pick"
        actor: AccountManager
        preconditions:
          - "FEFO candidate pool per fefo_allocation; empty pool -> ERR_NO_ELIGIBLE_LOT; pool total < qty -> ERR_INSUFFICIENT_STOCK"
        side_effects:
          - "Decrement each allocated InventoryLot.qty_on_hand; a lot reaching 0 moves to DEPLETED"
          - "Set release.allocations to the waterfall lines [{lot_id, qty}] in allocation order"
          - "increments parent BlanketOrder.version is NOT bumped; only Release fields change"
      - from: PICKED
        to: SHIPPED
        trigger: "POST /api/releases/{id}/ship"
        actor: AccountManager
        preconditions:
          - "order's contract.status == ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
        side_effects:
          - "final_unit_price_cents := price_at(current clock date) for the order product (release_price_at_date, FINAL variant)"
          - "billed_total_cents := release_billing_total (pinned rounding order)"
          - "Auto-close check on parent BlanketOrder (remaining_qty == 0 AND no open releases -> CLOSED)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/releases/{id}/cancel OR system (blanket-order cancel cascade)"
        actor: AccountManager | system
        preconditions: []
        side_effects:
          - "order.remaining_qty += qty (CANCELLED releases leave the reserved set)"
          - "Auto-close check on parent BlanketOrder"
      - from: ON_HOLD
        to: CANCELLED
        trigger: "POST /api/releases/{id}/cancel OR system (blanket-order cancel cascade)"
        actor: AccountManager | system
        preconditions: []
        side_effects:
          - "order.remaining_qty += qty"
          - "Auto-close check on parent BlanketOrder"
      - from: PICKED
        to: CANCELLED
        trigger: "POST /api/releases/{id}/cancel OR system (blanket-order cancel cascade)"
        actor: AccountManager | system
        preconditions: []
        side_effects:
          - "Restore each allocation line's qty to the SAME InventoryLot (qty_on_hand += qty; DEPLETED lot with qty > 0 returns to AVAILABLE; BLOCKED/EXPIRED keep status)"
          - "release.allocations := []"
          - "order.remaining_qty += qty"
          - "Auto-close check on parent BlanketOrder"
        note: "Branching: CANCELLED is reachable from 3 states; the PICKED branch carries the extra lot-restore side-effect set."
      - from: SCHEDULED
        to: ON_HOLD
        trigger: "system (hop 2 of POST /api/products/{id}/discontinue)"
        actor: system
        preconditions: ["release's blanket order just became substitution_status == PENDING"]
        side_effects: []
      - from: ON_HOLD
        to: SCHEDULED
        trigger: "system (cascade of POST /api/blanket-orders/{id}/accept-substitution)"
        actor: system
        preconditions: []
        side_effects:
          - "provisional_unit_price_cents re-stamped := price_at(scheduled_ship_date) for the REPLACEMENT product's contract line"

  - entity: TrialCase
    initial_state: ACTIVE
    terminal_states: [CONVERTED, REJECTED]
    transitions:
      - from: ACTIVE
        to: EVALUATION
        trigger: "POST /api/trials/{id}/submit-results"
        actor: EHSOfficer
        preconditions: []
        side_effects:
          - "results_submitted_by_user_id := X-User-ID of the submitting EHSOfficer; metrics stored"
      - from: EVALUATION
        to: CONVERTED
        trigger: "POST /api/trials/{id}/convert"
        actor: ProgramAdmin
        preconditions:
          - "Segregation of duties: converting X-User-ID != results_submitted_by_user_id (ERR_SEPARATION_OF_DUTIES)"
        side_effects:
          - "Retire the ACTIVE UsageStandard for (machine_id, product_id) if one exists (its window is freed)"
          - "Create a new UsageStandard: status ACTIVE, machine_id/product_id from the trial, operation_name := 'TRIAL-CONVERSION', standard_qty_per_part := round_half_up(1 / parts_per_unit_media, 4), effective_from := current clock date, effective_to := NULL; set converted_standard_id"
          - "Recompute MachineAsset.consumption_flag"
      - from: EVALUATION
        to: REJECTED
        trigger: "POST /api/trials/{id}/reject"
        actor: ProgramAdmin
        preconditions:
          - "rejection_reason present in body (ERR_INVALID_REQUEST)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: release-create-stale-order
    parent_entity: BlanketOrder
    write_endpoint: "POST /api/blanket-orders/{orderId}/releases"
    occ_field: expected_blanket_order_version
    description: |
      Creating a Release against a BlanketOrder whose version has advanced since
      the client last observed it is rejected. This captures the case where another
      writer has just created or cancelled a release (legitimately changing
      remaining_qty) and the current writer's view of the order is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: contract-amend-stale-version
    parent_entity: Contract
    write_endpoint: "PATCH /api/contracts/{id}"
    occ_field: expected_contract_version
    description: |
      Amending a Contract whose version has advanced since the client last observed
      it is rejected. This captures the case where another writer has just amended
      pricing terms (legitimately re-stamping line prices) and the current writer's
      view of the contract is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: release_price_at_date
    trigger: "release creation (provisional), release ship (final), contract activate/amend (line current price), substitution acceptance re-stamp"
    algorithm: threshold
    formula: |
      price_at(eval_date, line, contract):
        if eval_date <= contract.price_hold_end:            # hold end is INCLUSIVE
          return line.base_unit_price_cents
        elif eval_date >= contract.escalation_effective_date:  # effective date is INCLUSIVE
          return round_half_up(line.base_unit_price_cents * (1 + contract.escalation_pct))
        else:
          return line.base_unit_price_cents                 # gap between hold end and escalation effective: base
      All dates compared at ISO-date granularity.
    input_set: "the ContractLine matching (blanket_order.contract_id, blanket_order.product_id) and its parent Contract"
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "release creation / amend cascade / substitution acceptance"
        difference: "evaluates price_at(release.scheduled_ship_date) — forward-looking, stored on provisional_unit_price_cents"
      - name: final
        when: "POST /api/releases/{id}/ship"
        difference: "evaluates price_at(current logical-clock date) — stored on final_unit_price_cents; diverges from provisional whenever the hold/escalation boundary falls between scheduled and actual ship dates"

  - name: lot_expiry_date
    trigger: "POST /api/lots (lot receipt)"
    algorithm: threshold
    formula: |
      if product.shelf_life_months IS NULL: expiry_date = NULL
      else per product.shelf_life_policy:
        EXACT_DAY:     manufacture_date + shelf_life_months calendar months
                       (clamp day-of-month to the target month's last day on overflow)
        END_OF_MONTH:  last calendar day of month(manufacture_date + shelf_life_months)
      Example: manufacture 2026-01-15, 12 months -> EXACT_DAY 2027-01-15 vs END_OF_MONTH 2027-01-31.
    input_set: "the InventoryLot's Product (shelf_life_months, shelf_life_policy)"
    precision: "ISO date"
    variants:
      - name: exact_day
        when: "product.shelf_life_policy == EXACT_DAY"
        difference: "anniversary date of manufacture"
      - name: end_of_month
        when: "product.shelf_life_policy == END_OF_MONTH"
        difference: "end of the expiry month — later than EXACT_DAY for the same manufacture date whenever manufacture day-of-month < last day"

  - name: release_billing_total
    trigger: "POST /api/releases/{id}/ship"
    algorithm: tiered_pricing
    formula: |
      unit_cents = release_price_at_date(final variant, current clock date)   # ROUNDING STEP 1: round at the UNIT level first
      per allocation line i: line_gross_i = unit_cents * qty_i                # exact integer extension per picked lot line
      release_gross = sum(line_gross_i)
      tier_pct = 0.06 if order.committed_qty >= 2000
                 else 0.03 if order.committed_qty >= 500
                 else 0.0                                                     # tier boundaries are INCLUSIVE (>=)
      discount_cents = round_half_up(release_gross * tier_pct)                # ROUNDING STEP 2: discount rounded once at order level
      billed_total_cents = release_gross - discount_cents
      PINNED ROUNDING ORDER: (1) unit price rounded, (2) per-line extension, (3) sum, (4) discount rounded once, (5) subtract.
      Counterfactual "round(base * (1+esc) * qty) at order level" yields different cents and is WRONG.
      Example: base 10013, esc 0.04, qty 2, tier 0 -> pinned 20828 vs counterfactual round(20827.04) = 20827.
    input_set: "the Release's allocations (set at pick), the order's ContractLine, Contract, committed_qty"
    constants:
      TIER1_MIN_QTY: 500
      TIER1_DISCOUNT_PCT: 0.03
      TIER2_MIN_QTY: 2000
      TIER2_DISCOUNT_PCT: 0.06
    precision: "integer cents, round_half_up at exactly the two pinned steps"

  - name: consumption_variance
    trigger: "POST /api/usage-records (after the record is accepted and the lot decremented)"
    algorithm: threshold
    formula: |
      standard = the ACTIVE UsageStandard for (machine_id, product_id) whose half-open window
                 [effective_from, effective_to) contains usage_date (existence enforced by validation)
      actual_qty_per_part = round_half_up(qty_used / parts_produced, 4)
      variance_pct = round_half_up((actual_qty_per_part - standard.standard_qty_per_part)
                                   / standard.standard_qty_per_part, 4)
      variance_band: variance_pct > 0.10  -> OVER            # strictly greater: exactly +0.10 stays IN_BAND
                     variance_pct < -0.10 -> UNDER
                     else                -> IN_BAND
      rolling window W = the 5 most recent UsageRecords for (machine_id, product_id),
                         ordered usage_date DESC, created_at DESC (inclusive of the new record)
      standard.needs_review := (count of OVER in W) >= 3
      MachineAsset.consumption_flag := ELEVATED iff any ACTIVE UsageStandard for that machine
                                       has needs_review == true, else NORMAL
    input_set: "the new UsageRecord, the covering ACTIVE UsageStandard, the rolling window of UsageRecords for (machine, product)"
    constants:
      OVER_THRESHOLD_PCT: 0.10
      WINDOW_SIZE: 5
      TRIGGER_COUNT: 3
    precision: "4 decimal places, round_half_up"

  - name: fefo_allocation
    trigger: "POST /api/releases/{id}/pick"
    algorithm: waterfall_allocation
    formula: |
      candidates = InventoryLots where product_id == order.product_id
                   AND status == AVAILABLE AND qty_on_hand > 0
                   AND (expiry_date IS NULL OR expiry_date >= release.scheduled_ship_date)   # ship ON expiry day allowed
      if candidates empty -> ERR_NO_ELIGIBLE_LOT
      rank: expiry_date ASC (NULLS LAST), then manufacture_date ASC, then created_at ASC     # never id
      waterfall: take min(lot.qty_on_hand, remaining_need) from each lot in rank order until covered
      if sum(candidates.qty_on_hand) < release.qty -> ERR_INSUFFICIENT_STOCK (no partial allocation persisted)
      release.allocations := the waterfall lines in allocation order
    input_set: "InventoryLots of the order's product"
    precision: "integer units"

  - name: blanket_remaining_qty
    trigger: "release create (reserve), release cancel (give-back), order confirm (initialize)"
    algorithm: aggregation
    formula: |
      remaining_qty = committed_qty - sum(qty of releases in status SCHEDULED | ON_HOLD | PICKED | SHIPPED)
      CANCELLED releases are EXCLUDED from the sum (their qty is given back).
      Auto-close: after any ship/cancel, if remaining_qty == 0 AND no releases in SCHEDULED|ON_HOLD|PICKED
      -> BlanketOrder CLOSED.
    input_set: "all Releases of the BlanketOrder with the status filter above"
    precision: "integer units"

  - name: hazard_month_mass
    trigger: "POST /api/disposal-records (only when the product's used_media_hazard_class != NONE)"
    algorithm: aggregation
    formula: |
      month_total_kg = sum(gross_weight_kg) over DisposalRecords where:
        customer_ref == new record's customer_ref,
        product.used_media_hazard_class != NONE,
        disposed_at falls in the SAME calendar month as the new record's disposed_at
        (month boundaries inclusive: [first day 00:00, next month first day 00:00) ),
        INCLUDING the new record itself.
      if month_total_kg >= 1000.00 -> regulator_report_ref is REQUIRED on this record
      Boundary is INCLUSIVE: exactly 1000.00 kg triggers the requirement.
    input_set: "hazard DisposalRecords of the same customer_ref in the same calendar month"
    constants:
      HAZARD_MONTH_THRESHOLD_KG: 1000.00
    precision: "2 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role must be listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Request shape: required fields present, enum values valid, numeric positivity (qty >= 1, parts >= 1, weight > 0, rpm >= 1, escalation_pct >= 0), window shape (scheduled_end >= scheduled_start; effective_to > effective_from when present), BONDED product carries shelf_life_months, reject carries rejection_reason, discontinue carries replacement_product_id"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 4
    category: existence
    check: "Path ids exist, then body FK ids exist (order: machine, product, lot, contract, blanket order as they appear); a provided lot must belong to the given product (mismatch -> ERR_INVALID_REQUEST); replacement product must exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "OCC: expected_blanket_order_version == order.version (release create); expected_contract_version == contract.version (amend). Evaluated before state preconditions."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/blanket-orders/{orderId}/releases; PATCH /api/contracts/{id}"
  - priority: 6
    category: state
    check: "Target/cross-entity state preconditions. Sub-order: (a) path resource's own state (ERR_INVALID_STATE_TRANSITION: release only SCHEDULED->pick, PICKED->ship, non-terminal->cancel; contract ACTIVE for amend; order DRAFT for confirm; trial EVALUATION for convert/reject; product ACTIVE for discontinue; machine QUARANTINED for reinstate / ACTIVE for quarantine), then (b) cross-entity states: machine must be ACTIVE for usage/trial create (ERR_MACHINE_NOT_ACTIVE), lot must be AVAILABLE for usage (ERR_LOT_NOT_AVAILABLE), contract must be ACTIVE for confirm and ship (ERR_CONTRACT_NOT_ACTIVE)"
    error_id: "ERR_INVALID_STATE_TRANSITION / ERR_MACHINE_NOT_ACTIVE / ERR_LOT_NOT_AVAILABLE / ERR_CONTRACT_NOT_ACTIVE"
    http_status: 409
    applies_to: "state transition endpoints; POST /api/usage-records; POST /api/trials"
  - priority: 7
    category: business_safety
    check: "Safety/compliance. Sub-order: speed before guard: product.max_operating_speed_rpm >= machine.spindle_max_rpm (ERR_SPEED_RATING_EXCEEDED); BONDED product requires machine.guard_type IN {FIXED, ADJUSTABLE} (ERR_GUARD_REQUIRED). Disposal: hazard-class media requires disposal_method == HAZARDOUS_WASTE_FACILITY (ERR_HAZARD_DISPOSAL_METHOD_REQUIRED), then manifest_number + certified_facility_ref present (ERR_MANIFEST_FIELDS_REQUIRED), then hazard_month_mass >= 1000.00 requires regulator_report_ref (ERR_REGULATOR_REPORT_REQUIRED)"
    error_id: "ERR_SPEED_RATING_EXCEEDED / ERR_GUARD_REQUIRED / ERR_HAZARD_DISPOSAL_METHOD_REQUIRED / ERR_MANIFEST_FIELDS_REQUIRED / ERR_REGULATOR_REPORT_REQUIRED"
    http_status: 409
    applies_to: "POST /api/usage-records; POST /api/trials; POST /api/disposal-records"
  - priority: 8
    category: business_constraint
    check: "Constraint rules. Sub-order where multiple apply: release create — order.substitution_status == NONE (ERR_SUBSTITUTION_PENDING) then product.status == ACTIVE (ERR_PRODUCT_DISCONTINUED); confirm — ContractLine exists for (contract, product) (ERR_CONTRACT_LINE_MISSING) then product ACTIVE (ERR_PRODUCT_DISCONTINUED); standard create — no half-open window overlap among ACTIVE standards of same (machine_id, product_id) (ERR_STANDARD_WINDOW_OVERLAP); trial create — product ACTIVE (ERR_PRODUCT_DISCONTINUED) then closed-window + 1-day buffer conflict on machine (ERR_TRIAL_WINDOW_CONFLICT); discontinue — replacement != self and ACTIVE (ERR_REPLACEMENT_INVALID); convert — converting X-User-ID != results_submitted_by_user_id (ERR_SEPARATION_OF_DUTIES); usage — covering ACTIVE standard exists for usage_date (ERR_NO_COVERING_STANDARD)"
    error_id: "ERR_SUBSTITUTION_PENDING / ERR_PRODUCT_DISCONTINUED / ERR_CONTRACT_LINE_MISSING / ERR_STANDARD_WINDOW_OVERLAP / ERR_TRIAL_WINDOW_CONFLICT / ERR_REPLACEMENT_INVALID / ERR_SEPARATION_OF_DUTIES / ERR_NO_COVERING_STANDARD"
    http_status: 409
    applies_to: "POST /api/blanket-orders/{orderId}/releases; POST /api/blanket-orders/{id}/confirm; POST /api/standards; POST /api/trials; POST /api/products/{id}/discontinue; POST /api/trials/{id}/convert; POST /api/usage-records"
  - priority: 9
    category: business_temporal
    check: "Temporal rules: release scheduled_ship_date must fall within [contract.term_start, contract.term_end] inclusive (ERR_RELEASE_WINDOW_OUTSIDE_TERM); usage_date must not be after the current logical-clock date (ERR_USAGE_DATE_IN_FUTURE)"
    error_id: "ERR_RELEASE_WINDOW_OUTSIDE_TERM / ERR_USAGE_DATE_IN_FUTURE"
    http_status: 409
    applies_to: "POST /api/blanket-orders/{orderId}/releases; POST /api/usage-records"
  - priority: 10
    category: business_fiscal
    check: "Capacity/quota rules: release qty <= order.remaining_qty (ERR_RELEASE_EXCEEDS_REMAINING); usage qty_used <= lot.qty_on_hand (ERR_LOT_QTY_EXCEEDED); pick FEFO pool empty (ERR_NO_ELIGIBLE_LOT) then pool total < qty (ERR_INSUFFICIENT_STOCK)"
    error_id: "ERR_RELEASE_EXCEEDS_REMAINING / ERR_LOT_QTY_EXCEEDED / ERR_NO_ELIGIBLE_LOT / ERR_INSUFFICIENT_STOCK"
    http_status: 409
    applies_to: "POST /api/blanket-orders/{orderId}/releases; POST /api/usage-records; POST /api/releases/{id}/pick"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Catalog ---
  - method: POST
    path: "/api/products"
    description: "Register an abrasives product (SKU)"
    roles: [ProgramAdmin]
    code: 201
    input: [sku, name, product_form, max_operating_speed_rpm, "shelf_life_months?", "shelf_life_policy?", "used_media_hazard_class?"]
    output: Product
    side_effects: ["status=ACTIVE; shelf_life_policy defaults EXACT_DAY; used_media_hazard_class defaults NONE"]
  - method: GET
    path: "/api/products"
    description: "List products"
    roles: [ProgramAdmin, AccountManager, EHSOfficer]
    code: 200
    input: ["status?", "product_form?", "replacement_product_id?", "limit?", "offset?"]
    output: "Product[]"
    side_effects: []
  - method: GET
    path: "/api/products/{id}"
    description: "Get a product"
    roles: [ProgramAdmin, AccountManager, EHSOfficer]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: POST
    path: "/api/products/{id}/discontinue"
    description: "Discontinue a product with a named substitution replacement; cascades to blanket orders, releases, and lots"
    roles: [ProgramAdmin]
    code: 200
    input: [replacement_product_id]
    output: Product
    side_effects: ["see Product state machine: substitution PENDING hop, release ON_HOLD hop, lot BLOCK fan-out"]

  # --- Machines ---
  - method: POST
    path: "/api/machines"
    description: "Register a customer machine asset"
    roles: [AccountManager]
    code: 201
    input: [customer_ref, asset_tag, machine_type, spindle_max_rpm, guard_type]
    output: MachineAsset
    side_effects: ["status=ACTIVE; consumption_flag=NORMAL"]
  - method: GET
    path: "/api/machines/{id}"
    description: "Get a machine"
    roles: [ProgramAdmin, AccountManager, EHSOfficer]
    code: 200
    input: []
    output: MachineAsset
    side_effects: []
  - method: POST
    path: "/api/machines/{id}/quarantine"
    description: "Safety-quarantine a machine (blocks usage and trials)"
    roles: [EHSOfficer]
    code: 200
    input: []
    output: MachineAsset
    side_effects: ["status -> QUARANTINED"]
  - method: POST
    path: "/api/machines/{id}/reinstate"
    description: "Return a quarantined machine to service"
    roles: [EHSOfficer]
    code: 200
    input: []
    output: MachineAsset
    side_effects: ["status -> ACTIVE"]

  # --- Inventory lots ---
  - method: POST
    path: "/api/lots"
    description: "Receive an inventory lot; computes expiry_date for shelf-life products"
    roles: [AccountManager]
    code: 201
    input: [product_id, lot_code, manufacture_date, qty_received]
    output: InventoryLot
    side_effects: ["qty_on_hand := qty_received; expiry_date := lot_expiry_date(product policy); status=AVAILABLE"]
  - method: GET
    path: "/api/lots/{id}"
    description: "Get a lot"
    roles: [ProgramAdmin, AccountManager, EHSOfficer]
    code: 200
    input: []
    output: InventoryLot
    side_effects: []
  - method: GET
    path: "/api/lots"
    description: "List lots"
    roles: [ProgramAdmin, AccountManager, EHSOfficer]
    code: 200
    input: ["product_id?", "status?", "limit?", "offset?"]
    output: "InventoryLot[]"
    side_effects: []

  # --- Usage standards ---
  - method: POST
    path: "/api/standards"
    description: "Create a standard consumption rate for (machine, product) over a half-open window"
    roles: [AccountManager]
    code: 201
    input: [machine_id, product_id, operation_name, standard_qty_per_part, effective_from, "effective_to?"]
    output: UsageStandard
    side_effects: ["status=ACTIVE; needs_review=false; ERR_STANDARD_WINDOW_OVERLAP on overlap with ACTIVE same-key standard"]
  - method: GET
    path: "/api/standards/{id}"
    description: "Get a standard"
    roles: [ProgramAdmin, AccountManager, EHSOfficer]
    code: 200
    input: []
    output: UsageStandard
    side_effects: []
  - method: GET
    path: "/api/standards"
    description: "List standards"
    roles: [ProgramAdmin, AccountManager, EHSOfficer]
    code: 200
    input: ["machine_id?", "product_id?", "status?", "limit?", "offset?"]
    output: "UsageStandard[]"
    side_effects: []
  - method: POST
    path: "/api/standards/{id}/retire"
    description: "Retire a standard (frees its window)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: UsageStandard
    side_effects: ["status -> RETIRED; recompute machine consumption_flag"]

  # --- Usage records ---
  - method: POST
    path: "/api/usage-records"
    description: "Record media consumption on a machine from a lot (VMI field audit)"
    roles: [AccountManager]
    code: 201
    input: [machine_id, product_id, lot_id, usage_date, qty_used, parts_produced]
    output: UsageRecord
    side_effects: ["lot.qty_on_hand -= qty_used (lot -> DEPLETED at 0); compute actual_qty_per_part/variance_pct/variance_band; update covering standard needs_review; recompute machine consumption_flag"]
  - method: GET
    path: "/api/usage-records/{id}"
    description: "Get a usage record"
    roles: [ProgramAdmin, AccountManager, EHSOfficer]
    code: 200
    input: []
    output: UsageRecord
    side_effects: []
  - method: GET
    path: "/api/usage-records"
    description: "List usage records"
    roles: [ProgramAdmin, AccountManager, EHSOfficer]
    code: 200
    input: ["machine_id?", "product_id?", "lot_id?", "limit?", "offset?"]
    output: "UsageRecord[]"
    side_effects: []

  # --- Contracts ---
  - method: POST
    path: "/api/contracts"
    description: "Create a pricing contract with per-product price lines"
    roles: [AccountManager]
    code: 201
    input: [customer_ref, contract_number, term_start, term_end, price_hold_end, escalation_pct, escalation_effective_date, lines]
    output: Contract
    side_effects: ["status=DRAFT; one ContractLine created per lines[] entry {product_id, base_unit_price_cents} with current_unit_price_cents := base"]
  - method: GET
    path: "/api/contracts/{id}"
    description: "Get a contract"
    roles: [ProgramAdmin, AccountManager, EHSOfficer]
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: POST
    path: "/api/contracts/{id}/activate"
    description: "Activate a contract; stamps line current prices at the logical clock"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Contract
    side_effects: ["status -> ACTIVE; increments Contract.version by 1; stamp ContractLine.current_unit_price_cents"]
  - method: PATCH
    path: "/api/contracts/{id}"
    description: "Amend escalation_pct and/or price_hold_end on an ACTIVE contract (OCC); depth-3 price cascade"
    roles: [ProgramAdmin]
    code: 200
    input: [expected_contract_version, "escalation_pct?", "price_hold_end?"]
    output: Contract
    side_effects: ["increments Contract.version by 1; cascade: ContractLine re-stamp -> OPEN BlanketOrder provisional re-stamp -> SCHEDULED Release provisional re-stamp"]
  - method: POST
    path: "/api/contracts/{id}/terminate"
    description: "Terminate a contract"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Contract
    side_effects: ["status -> TERMINATED"]
  - method: GET
    path: "/api/contract-lines/{id}"
    description: "Get a contract line"
    roles: [ProgramAdmin, AccountManager, EHSOfficer]
    code: 200
    input: []
    output: ContractLine
    side_effects: []
  - method: GET
    path: "/api/contract-lines"
    description: "List contract lines"
    roles: [ProgramAdmin, AccountManager, EHSOfficer]
    code: 200
    input: ["contract_id?", "product_id?", "limit?", "offset?"]
    output: "ContractLine[]"
    side_effects: []

  # --- Blanket orders ---
  - method: POST
    path: "/api/blanket-orders"
    description: "Create a blanket order against a contract for one product"
    roles: [AccountManager]
    code: 201
    input: [contract_id, product_id, committed_qty]
    output: BlanketOrder
    side_effects: ["status=DRAFT; substitution_status=NONE; remaining_qty NULL until confirm"]
  - method: GET
    path: "/api/blanket-orders/{id}"
    description: "Get a blanket order"
    roles: [ProgramAdmin, AccountManager, EHSOfficer]
    code: 200
    input: []
    output: BlanketOrder
    side_effects: []
  - method: GET
    path: "/api/blanket-orders"
    description: "List blanket orders"
    roles: [ProgramAdmin, AccountManager, EHSOfficer]
    code: 200
    input: ["contract_id?", "product_id?", "status?", "limit?", "offset?"]
    output: "BlanketOrder[]"
    side_effects: []
  - method: POST
    path: "/api/blanket-orders/{id}/confirm"
    description: "Confirm a draft blanket order (requires ACTIVE contract, price line, ACTIVE product)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: BlanketOrder
    side_effects: ["status -> OPEN; remaining_qty := committed_qty; provisional prices stamped from contract line; increments BlanketOrder.version by 1"]
  - method: POST
    path: "/api/blanket-orders/{id}/cancel"
    description: "Cancel a blanket order; cascades cancellation to open releases with give-back and lot restore"
    roles: [AccountManager]
    code: 200
    input: []
    output: BlanketOrder
    side_effects: ["status -> CANCELLED; releases SCHEDULED|ON_HOLD|PICKED -> CANCELLED; PICKED releases restore lots"]
  - method: POST
    path: "/api/blanket-orders/{id}/accept-substitution"
    description: "Accept the discontinued product's replacement on a PENDING order"
    roles: [AccountManager]
    code: 200
    input: []
    output: BlanketOrder
    side_effects: ["product_id := replacement product; substitution_status -> ACCEPTED; provisional_unit_price_cents re-stamped from replacement line; ON_HOLD releases -> SCHEDULED with provisional re-stamped"]

  # --- Releases ---
  - method: POST
    path: "/api/blanket-orders/{orderId}/releases"
    description: "Schedule a release against an OPEN blanket order (OCC on order version); reserves qty and stamps provisional price"
    roles: [AccountManager]
    code: 201
    input: [qty, scheduled_ship_date, expected_blanket_order_version]
    output: Release
    side_effects: ["status=SCHEDULED; order.remaining_qty -= qty; provisional_unit_price_cents := price_at(scheduled_ship_date); increments BlanketOrder.version by 1"]
  - method: GET
    path: "/api/releases/{id}"
    description: "Get a release"
    roles: [ProgramAdmin, AccountManager, EHSOfficer]
    code: 200
    input: []
    output: Release
    side_effects: []
  - method: GET
    path: "/api/releases"
    description: "List releases"
    roles: [ProgramAdmin, AccountManager, EHSOfficer]
    code: 200
    input: ["blanket_order_id?", "status?", "limit?", "offset?"]
    output: "Release[]"
    side_effects: []
  - method: POST
    path: "/api/releases/{id}/pick"
    description: "FEFO-allocate stock lots for a SCHEDULED release"
    roles: [AccountManager]
    code: 200
    input: []
    output: Release
    side_effects: ["status -> PICKED; lot decrements per fefo_allocation; allocations set"]
  - method: POST
    path: "/api/releases/{id}/ship"
    description: "Ship a PICKED release; stamps final price and billed total; requires ACTIVE contract"
    roles: [AccountManager]
    code: 200
    input: []
    output: Release
    side_effects: ["status -> SHIPPED; final_unit_price_cents and billed_total_cents computed; order auto-close check"]
  - method: POST
    path: "/api/releases/{id}/cancel"
    description: "Cancel a SCHEDULED/ON_HOLD/PICKED release; give-back qty; PICKED also restores lots"
    roles: [AccountManager]
    code: 200
    input: []
    output: Release
    side_effects: ["status -> CANCELLED; order.remaining_qty += qty; PICKED branch restores allocation lots and clears allocations"]

  # --- Trials ---
  - method: POST
    path: "/api/trials"
    description: "Document a product trial on a machine (safety-gated; closed-window scheduling with 1-day buffer)"
    roles: [AccountManager]
    code: 201
    input: [machine_id, product_id, scheduled_start, scheduled_end, "incumbent_product_id?"]
    output: TrialCase
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/api/trials/{id}"
    description: "Get a trial"
    roles: [ProgramAdmin, AccountManager, EHSOfficer]
    code: 200
    input: []
    output: TrialCase
    side_effects: []
  - method: GET
    path: "/api/trials"
    description: "List trials"
    roles: [ProgramAdmin, AccountManager, EHSOfficer]
    code: 200
    input: ["machine_id?", "product_id?", "incumbent_product_id?", "converted_standard_id?", "status?", "limit?", "offset?"]
    output: "TrialCase[]"
    side_effects: []
  - method: POST
    path: "/api/trials/{id}/submit-results"
    description: "EHS officer submits trial measurements and safety documentation"
    roles: [EHSOfficer]
    code: 200
    input: [measured_removal_rate_g_per_min, parts_per_unit_media, cost_per_part_cents]
    output: TrialCase
    side_effects: ["status -> EVALUATION; results_submitted_by_user_id := X-User-ID"]
  - method: POST
    path: "/api/trials/{id}/convert"
    description: "Approve conversion: retires old operation standard and creates the converted standard"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: TrialCase
    side_effects: ["status -> CONVERTED; segregation-of-duties check; old ACTIVE standard for (machine, product) RETIRED; new UsageStandard created; converted_standard_id set"]
  - method: POST
    path: "/api/trials/{id}/reject"
    description: "Reject a trial under evaluation"
    roles: [ProgramAdmin]
    code: 200
    input: [rejection_reason]
    output: TrialCase
    side_effects: ["status -> REJECTED"]

  # --- Disposal ---
  - method: POST
    path: "/api/disposal-records"
    description: "File a used-media waste disposal manifest"
    roles: [EHSOfficer]
    code: 201
    input: [customer_ref, product_id, qty_disposed, gross_weight_kg, disposal_method, disposed_at, "lot_id?", "manifest_number?", "certified_facility_ref?", "regulator_report_ref?"]
    output: DisposalRecord
    side_effects: ["hazard_month_mass aggregation may require regulator_report_ref"]
  - method: GET
    path: "/api/disposal-records/{id}"
    description: "Get a disposal record"
    roles: [ProgramAdmin, AccountManager, EHSOfficer]
    code: 200
    input: []
    output: DisposalRecord
    side_effects: []
  - method: GET
    path: "/api/disposal-records"
    description: "List disposal records"
    roles: [ProgramAdmin, AccountManager, EHSOfficer]
    code: 200
    input: ["product_id?", "lot_id?", "limit?", "offset?"]
    output: "DisposalRecord[]"
    side_effects: []

  # --- Test-driving clock ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). Startup default is exactly 2026-08-01T00:00:00Z and the clock MUST NOT fall back to wall-clock time. Setting the clock runs monotonic sweeps: AVAILABLE lots with expiry_date < new date -> EXPIRED; ACTIVE contracts with term_end < new date -> EXPIRED."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, lots_expired: integer, contracts_expired: integer }
    side_effects: ["lot expiry sweep; contract expiry sweep (sweeps never reverse)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not listed in the endpoint's roles" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, non-positive quantity, malformed window, BONDED product without shelf_life_months, lot-product mismatch, missing rejection_reason or replacement_product_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced body FK id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Target resource is in a state where the requested transition is not allowed (including terminal-state lockdown)" }
  - { id: ERR_MACHINE_NOT_ACTIVE, http: 409, condition: "Usage recording or trial creation against a QUARANTINED machine" }
  - { id: ERR_LOT_NOT_AVAILABLE, http: 409, condition: "Usage recording against a lot not in AVAILABLE (BLOCKED/EXPIRED/DEPLETED)" }
  - { id: ERR_SPEED_RATING_EXCEEDED, http: 409, condition: "product.max_operating_speed_rpm < machine.spindle_max_rpm" }
  - { id: ERR_GUARD_REQUIRED, http: 409, condition: "BONDED product on a machine with guard_type == NONE" }
  - { id: ERR_PRODUCT_DISCONTINUED, http: 409, condition: "Blanket confirm, release create, or trial create references a DISCONTINUED product" }
  - { id: ERR_SUBSTITUTION_PENDING, http: 409, condition: "Release create on a blanket order with substitution_status == PENDING" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Blanket confirm or release ship while the contract is DRAFT/EXPIRED/TERMINATED" }
  - { id: ERR_CONTRACT_LINE_MISSING, http: 409, condition: "No ContractLine for (contract_id, product_id) at confirm or substitution acceptance" }
  - { id: ERR_STANDARD_WINDOW_OVERLAP, http: 409, condition: "Half-open window overlaps another ACTIVE standard for the same (machine_id, product_id); adjacency (to == from) is allowed" }
  - { id: ERR_TRIAL_WINDOW_CONFLICT, http: 409, condition: "Trial window overlaps or lacks the required 1-day buffer against another ACTIVE/EVALUATION trial on the same machine" }
  - { id: ERR_SEPARATION_OF_DUTIES, http: 409, condition: "Trial conversion attempted by the same X-User-ID that submitted the results" }
  - { id: ERR_NO_COVERING_STANDARD, http: 409, condition: "No ACTIVE UsageStandard whose half-open window contains usage_date for (machine_id, product_id)" }
  - { id: ERR_RELEASE_WINDOW_OUTSIDE_TERM, http: 409, condition: "scheduled_ship_date outside [contract.term_start, contract.term_end] inclusive" }
  - { id: ERR_USAGE_DATE_IN_FUTURE, http: 409, condition: "usage_date is after the current logical-clock date" }
  - { id: ERR_RELEASE_EXCEEDS_REMAINING, http: 409, condition: "Release qty > order.remaining_qty (qty == remaining is allowed)" }
  - { id: ERR_LOT_QTY_EXCEEDED, http: 409, condition: "Usage qty_used > lot.qty_on_hand (qty == on_hand is allowed and depletes the lot)" }
  - { id: ERR_NO_ELIGIBLE_LOT, http: 409, condition: "FEFO candidate pool is empty at pick" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "FEFO pool non-empty but total qty_on_hand < release qty" }
  - { id: ERR_HAZARD_DISPOSAL_METHOD_REQUIRED, http: 409, condition: "Hazard-class used media disposed with a method other than HAZARDOUS_WASTE_FACILITY" }
  - { id: ERR_MANIFEST_FIELDS_REQUIRED, http: 400, condition: "Hazard-class disposal missing manifest_number or certified_facility_ref" }
  - { id: ERR_REGULATOR_REPORT_REQUIRED, http: 409, condition: "Calendar-month hazard mass including this record >= 1000.00 kg and regulator_report_ref missing" }
  - { id: ERR_REPLACEMENT_INVALID, http: 409, condition: "Discontinuation replacement is the product itself or not ACTIVE" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Distributor program administrator: owns the catalog, pricing contracts, standards lifecycle, discontinuation/substitution, trial conversion decisions, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/products; POST /api/products/{id}/discontinue"
      - "POST /api/contracts/{id}/activate; PATCH /api/contracts/{id}; POST /api/contracts/{id}/terminate"
      - "POST /api/blanket-orders/{id}/confirm"
      - "POST /api/standards/{id}/retire"
      - "POST /api/trials/{id}/convert; POST /api/trials/{id}/reject"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: AccountManager
    description: "Distributor account/field operations: registers machines, receives lots, drafts contracts and blanket orders, schedules/picks/ships/cancels releases, records usage audits, documents trials"
    identity: opaque
    exclusive_operations:
      - "POST /api/machines"
      - "POST /api/lots"
      - "POST /api/standards"
      - "POST /api/usage-records"
      - "POST /api/contracts"
      - "POST /api/blanket-orders; POST /api/blanket-orders/{id}/cancel; POST /api/blanket-orders/{id}/accept-substitution"
      - "POST /api/blanket-orders/{orderId}/releases; POST /api/releases/{id}/pick; POST /api/releases/{id}/ship; POST /api/releases/{id}/cancel"
      - "POST /api/trials"
    shared_operations:
      - "All GET endpoints"
  - name: EHSOfficer
    description: "Customer-side environmental/health/safety officer: quarantines and reinstates machines, submits trial results and safety documentation, files waste disposal manifests"
    identity: opaque
    exclusive_operations:
      - "POST /api/machines/{id}/quarantine; POST /api/machines/{id}/reinstate"
      - "POST /api/trials/{id}/submit-results"
      - "POST /api/disposal-records"
    shared_operations:
      - "All GET endpoints"
