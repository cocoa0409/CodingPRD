scaffold_corner_design:

  # ===========================================================================
  # Section 1 -- Entities
  # ===========================================================================
  - section: entities
    instances:

      - name: create_branch_returns_201_with_zeroed_counters
        claim_type: creation
        grounds: [entities.Branch, entities.Branch.fields.on_hand_count, entities.Branch.fields.serviceable_available_count]
        distinguishing_aspect: "A freshly created Branch answers 201 with on_hand_count 0, serviceable_available_count 0, version 1 and a server-minted uuid id with no type prefix."
        test_recipe:
          setup:
            - "One branch already exists so the new row is not the only one in the table."
          setup_api_calls:
            - call: "POST /fleet/branches"
              payload:
                code: "WST-01"
                name: "West Yard"
                region: "WEST"
                yard_capacity: 10
                peak_season_start_date: "2026-09-01"
                peak_season_end_date: "2026-11-30"
                lease_reserve_pct: 0.00
              as: FleetAdmin
              captures: { b_west_id: "$.data.id" }
          trigger:
            - call: "POST /fleet/branches"
              payload:
                code: "EST-01"
                name: "East Yard"
                region: "EAST"
                yard_capacity: 8
                peak_season_start_date: "2026-06-01"
                peak_season_end_date: "2026-08-31"
                lease_reserve_pct: 0.20
              as: FleetAdmin
              captures: { b_east_id: "$.data.id", b_east_v: "$.data.version", b_east_onhand: "$.data.on_hand_count" }
          assert:
            - "HTTP status == 201"
            - "${b_east_onhand} == 0"
            - "${b_east_v} == 1"
            - "Branch.${b_east_id}.serviceable_available_count == 0"
            - "Branch.${b_east_id}.lease_reserve_pct == 0.20"
            - "${b_east_id} != ${b_west_id}"
            - "${b_east_id} matches the bare uuid form 8-4-4-4-12 with no type prefix"

      - name: get_trailer_by_unknown_id_returns_trailer_not_found
        claim_type: not_found
        grounds: ["entities.Trailer", "errors[ERR_TRAILER_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "Reading a trailer id that was never minted answers ERR_TRAILER_NOT_FOUND with HTTP 404, not an empty object."
        test_recipe:
          setup:
            - "A branch exists but no trailer has ever been created."
          setup_api_calls:
            - call: "POST /fleet/branches"
              payload:
                code: "WST-01"
                name: "West Yard"
                region: "WEST"
                yard_capacity: 10
                peak_season_start_date: "2026-09-01"
                peak_season_end_date: "2026-11-30"
              as: FleetAdmin
              captures: { b_west_id: "$.data.id" }
          trigger:
            - call: "GET /fleet/trailers/2f0c6b1e-9a44-4d0b-8c2e-000000000000"
              payload: {}
              as: FleetAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_TRAILER_NOT_FOUND"

      - name: create_trailer_without_home_branch_id_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Trailer.fields.home_branch_id", "errors[ERR_INVALID_REQUEST]", "validations[priority=5]"]
        distinguishing_aspect: "home_branch_id has source input and no default, so omitting it answers ERR_INVALID_REQUEST (422) and no Trailer row is created."
        test_recipe:
          setup:
            - "A branch and a trailer type exist."
          setup_api_calls:
            - call: "POST /fleet/branches"
              payload:
                code: "WST-01"
                name: "West Yard"
                region: "WEST"
                yard_capacity: 10
                peak_season_start_date: "2026-09-01"
                peak_season_end_date: "2026-11-30"
              as: FleetAdmin
              captures: { b_west_id: "$.data.id" }
            - call: "POST /fleet/trailer-types"
              payload:
                code: "DRY_VAN_53"
                description: "53ft dry van"
                base_daily_rate_cents: 4500
                base_monthly_rate_cents: 95000
                residual_floor_cents: 450000
                required_physical_damage_limit_cents: 3000000
              as: FleetAdmin
              captures: { tt_dv_id: "$.data.id" }
          trigger:
            - call: "POST /fleet/trailers"
              payload:
                unit_number: "T-1001"
                trailer_type_id: "${tt_dv_id}"
                acquisition_cost_cents: 4500000
                in_service_date: "2022-08-01"
                last_dot_inspection_date: "2026-01-01"
              as: FleetAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 422"
            - "${err} == ERR_INVALID_REQUEST"
            - "count(Trailer WHERE unit_number == T-1001) == 0"
            - "Branch.${b_west_id}.on_hand_count == 0"

      - name: create_branch_without_lease_reserve_pct_defaults_to_zero
        claim_type: defaults
        grounds: [entities.Branch.fields.lease_reserve_pct, calculations.trailer_selection]
        distinguishing_aspect: "Omitting lease_reserve_pct stores exactly 0.00, so the peak reserve holds back ceil(n * 0.00) == 0 units and the whole serviceable pool stays rentable."
        test_recipe:
          setup:
            - "Nothing pre-exists; the branch is created without lease_reserve_pct."
          setup_api_calls:
            - call: "POST /fleet/trailer-types"
              payload:
                code: "DRY_VAN_53"
                description: "53ft dry van"
                base_daily_rate_cents: 4500
                base_monthly_rate_cents: 95000
                residual_floor_cents: 450000
                required_physical_damage_limit_cents: 3000000
              as: FleetAdmin
              captures: { tt_dv_id: "$.data.id" }
          trigger:
            - call: "POST /fleet/branches"
              payload:
                code: "DEF-01"
                name: "Default Yard"
                region: "CENTRAL"
                yard_capacity: 10
                peak_season_start_date: "2026-09-01"
                peak_season_end_date: "2026-11-30"
              as: FleetAdmin
              captures: { b_def_id: "$.data.id", b_def_reserve: "$.data.lease_reserve_pct" }
            - call: "POST /fleet/trailers"
              payload:
                unit_number: "T-9001"
                trailer_type_id: "${tt_dv_id}"
                home_branch_id: "${b_def_id}"
                acquisition_cost_cents: 4500000
                in_service_date: "2022-08-01"
                last_dot_inspection_date: "2026-01-01"
                hub_miles: 1000
              as: FleetAdmin
            - call: "GET /fleet/branches/${b_def_id}/availability"
              payload: { trailer_type_id: "${tt_dv_id}", product: "SHORT_TERM_RENTAL", window_start_date: "2026-09-05", window_end_date: "2026-09-12" }
              as: FleetAdmin
              captures: { reserved: "$.data.lease_reserved_count", rental: "$.data.rental_available_count" }
          assert:
            - "${b_def_reserve} == 0.00"
            - "${reserved} == 0"
            - "${rental} == 1"

      - name: create_trailer_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Trailer.fields.availability_status, entities.Trailer.fields.current_branch_id, entities.Trailer.fields.service_status]
        distinguishing_aspect: "availability_status, current_branch_id and service_status are server-owned: a create body attempting to set availability_status RETIRED and current_branch_id to a foreign yard is ignored and the row is stored AVAILABLE / SERVICEABLE at home_branch_id."
        test_recipe:
          setup:
            - "Two branches and one trailer type exist."
          setup_api_calls:
            - call: "POST /fleet/branches"
              payload:
                code: "WST-01"
                name: "West Yard"
                region: "WEST"
                yard_capacity: 10
                peak_season_start_date: "2026-09-01"
                peak_season_end_date: "2026-11-30"
              as: FleetAdmin
              captures: { b_west_id: "$.data.id" }
            - call: "POST /fleet/branches"
              payload:
                code: "EST-01"
                name: "East Yard"
                region: "EAST"
                yard_capacity: 8
                peak_season_start_date: "2026-06-01"
                peak_season_end_date: "2026-08-31"
              as: FleetAdmin
              captures: { b_east_id: "$.data.id" }
            - call: "POST /fleet/trailer-types"
              payload:
                code: "DRY_VAN_53"
                description: "53ft dry van"
                base_daily_rate_cents: 4500
                base_monthly_rate_cents: 95000
                residual_floor_cents: 450000
                required_physical_damage_limit_cents: 3000000
              as: FleetAdmin
              captures: { tt_dv_id: "$.data.id" }
          trigger:
            - call: "POST /fleet/trailers"
              payload:
                unit_number: "T-1001"
                trailer_type_id: "${tt_dv_id}"
                home_branch_id: "${b_west_id}"
                acquisition_cost_cents: 4500000
                in_service_date: "2022-08-01"
                last_dot_inspection_date: "2026-01-01"
                hub_miles: 41000
                availability_status: "RETIRED"
                current_branch_id: "${b_east_id}"
                service_status: "OOS_DAMAGE"
                damage_points: 99
              as: FleetAdmin
              captures: { tr1_id: "$.data.id" }
          assert:
            - "Trailer.${tr1_id}.availability_status == AVAILABLE"
            - "Trailer.${tr1_id}.service_status == SERVICEABLE"
            - "Trailer.${tr1_id}.current_branch_id == ${b_west_id}"
            - "Trailer.${tr1_id}.damage_points == 0"
            - "Branch.${b_west_id}.on_hand_count == 1"
            - "Branch.${b_east_id}.on_hand_count == 0"

      - name: create_branch_with_duplicate_code_rejected
        claim_type: type_constraints
        grounds: ["entities.Branch.fields.code", "errors[ERR_DUPLICATE_BRANCH_CODE]", "validations[priority=7]"]
        distinguishing_aspect: "Branch.code is a natural key; a second POST carrying code WST-01 answers ERR_DUPLICATE_BRANCH_CODE (409) and leaves exactly one branch with that code."
        test_recipe:
          setup:
            - "Branch WST-01 already exists."
          setup_api_calls:
            - call: "POST /fleet/branches"
              payload:
                code: "WST-01"
                name: "West Yard"
                region: "WEST"
                yard_capacity: 10
                peak_season_start_date: "2026-09-01"
                peak_season_end_date: "2026-11-30"
              as: FleetAdmin
              captures: { b_west_id: "$.data.id" }
          trigger:
            - call: "POST /fleet/branches"
              payload:
                code: "WST-01"
                name: "West Yard Annex"
                region: "CENTRAL"
                yard_capacity: 4
                peak_season_start_date: "2026-09-01"
                peak_season_end_date: "2026-11-30"
              as: FleetAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_DUPLICATE_BRANCH_CODE"
            - "count(Branch WHERE code == WST-01) == 1"

      - name: trailer_dot_expires_on_computed_from_type_interval
        claim_type: computed_fields
        grounds: [entities.Trailer.fields.dot_expires_on, entities.TrailerType.fields.dot_inspection_interval_days, calculations.trailer_service_status]
        distinguishing_aspect: "dot_expires_on is last_dot_inspection_date plus the type's dot_inspection_interval_days: 2026-01-01 plus 365 days is exactly 2027-01-01, and the field is server-computed even when the client omits it."
        test_recipe:
          setup:
            - "Branch WST-01 and trailer type DRY_VAN_53 with dot_inspection_interval_days 365."
          setup_api_calls:
            - call: "POST /fleet/branches"
              payload:
                code: "WST-01"
                name: "West Yard"
                region: "WEST"
                yard_capacity: 10
                peak_season_start_date: "2026-09-01"
                peak_season_end_date: "2026-11-30"
              as: FleetAdmin
              captures: { b_west_id: "$.data.id" }
            - call: "POST /fleet/trailer-types"
              payload:
                code: "DRY_VAN_53"
                description: "53ft dry van"
                base_daily_rate_cents: 4500
                base_monthly_rate_cents: 95000
                residual_floor_cents: 450000
                required_physical_damage_limit_cents: 3000000
                dot_inspection_interval_days: 365
                pm_interval_miles: 30000
              as: FleetAdmin
              captures: { tt_dv_id: "$.data.id" }
          trigger:
            - call: "POST /fleet/trailers"
              payload:
                unit_number: "T-1001"
                trailer_type_id: "${tt_dv_id}"
                home_branch_id: "${b_west_id}"
                acquisition_cost_cents: 4500000
                in_service_date: "2022-08-01"
                last_dot_inspection_date: "2026-01-01"
                hub_miles: 41000
              as: FleetAdmin
              captures: { tr1_id: "$.data.id", dot_exp: "$.data.dot_expires_on", pm_base: "$.data.last_pm_hub_miles" }
          assert:
            - "${dot_exp} == 2027-01-01"
            - "${pm_base} == 41000"
            - "Trailer.${tr1_id}.service_status == SERVICEABLE"
            - "Trailer.${tr1_id}.last_dot_passed == true"

      - name: maintenance_event_is_immutable_and_has_no_version
        claim_type: immutability
        grounds: [entities.MaintenanceEvent, endpoints.GET_maintenance_events]
        distinguishing_aspect: "MaintenanceEvent declares common_fields false, so its stored row carries id and created_at but no version and no updated_at, and §1.5 exposes no update or delete endpoint for it."
        test_recipe:
          setup:
            - "Branch WST-01, trailer type DRY_VAN_53, one trailer T-1001."
          setup_api_calls:
            - call: "POST /fleet/branches"
              payload:
                code: "WST-01"
                name: "West Yard"
                region: "WEST"
                yard_capacity: 10
                peak_season_start_date: "2026-09-01"
                peak_season_end_date: "2026-11-30"
                lease_reserve_pct: 0.00
              as: FleetAdmin
              captures: { b_west_id: "$.data.id", b_west_v1: "$.data.version" }
            - call: "POST /fleet/trailer-types"
              payload:
                code: "DRY_VAN_53"
                description: "53ft dry van"
                base_daily_rate_cents: 4500
                base_monthly_rate_cents: 95000
                residual_floor_cents: 450000
                required_physical_damage_limit_cents: 3000000
                dot_inspection_interval_days: 365
                pm_interval_miles: 30000
              as: FleetAdmin
              captures: { tt_dv_id: "$.data.id" }
            - call: "POST /fleet/rate-cards"
              payload:
                branch_id: "${b_west_id}"
                trailer_type_id: "${tt_dv_id}"
                product: "SHORT_TERM_RENTAL"
                daily_rate_cents: 5200
                monthly_rate_cents: 110000
                peak_uplift_pct: 0.30
                mileage_included_per_month: 2500
                excess_mileage_rate_cents_per_mile: 22
                effective_date: "2026-07-01"
                expected_branch_version: "${b_west_v1}"
              as: FleetAdmin
            - call: "POST /fleet/trailers"
              payload:
                unit_number: "T-1001"
                trailer_type_id: "${tt_dv_id}"
                home_branch_id: "${b_west_id}"
                acquisition_cost_cents: 4500000
                in_service_date: "2022-08-01"
                last_dot_inspection_date: "2026-01-01"
                hub_miles: 41000
              as: FleetAdmin
              captures: { tr1_id: "$.data.id" }
            - call: "POST /fleet/customers"
              payload:
                legal_name: "Ridge Haul LLC"
                dot_number: "DOT-771"
                credit_tier: "B"
                credit_limit_cents: 5000000
              as: FleetAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /fleet/insurance-certificates"
              payload:
                customer_id: "${cust_id}"
                carrier_name: "Great West Casualty"
                policy_number: "P-1"
                physical_damage_limit_cents: 3000000
                liability_limit_cents: 100000000
                effective_date: "2024-01-01"
                expiry_date: "2027-01-01"
              as: FleetAdmin
          trigger:
            - call: "POST /fleet/maintenance-events"
              payload:
                trailer_id: "${tr1_id}"
                event_type: "PM_SERVICE"
                performed_on: "2026-08-02"
                hub_miles_at_event: 41000
                cost_cents: 42000
              as: Inspector
              as_user_id: "insp-1"
              captures: { me_id: "$.data.id" }
            - call: "GET /fleet/maintenance-events/${me_id}"
              payload: {}
              as: FleetAdmin
              captures: { me_type: "$.data.event_type", me_who: "$.data.inspector_user_id" }
          assert:
            - "HTTP status of the create == 201"
            - "${me_type} == PM_SERVICE"
            - "${me_who} == insp-1"
            - "the MaintenanceEvent response body contains no version key and no updated_at key"
            - "§1.5 declares no PUT, PATCH or DELETE on /fleet/maintenance-events/{maintenance_event_id}"
            - "Trailer.${tr1_id}.last_pm_hub_miles == 41000"

      - name: list_trailers_paginates_and_filters_by_current_branch
        claim_type: listing
        grounds: [endpoints.GET_trailers, entities.Trailer.fields.current_branch_id, entities.Trailer.fields.availability_status]
        distinguishing_aspect: "GET /fleet/trailers honours limit/offset together with the current_branch_id and availability_status filters, and the envelope reports total_count 3 with has_more true when limit is 2."
        test_recipe:
          setup:
            - "Branch WST-01 holding three AVAILABLE DRY_VAN_53 trailers."
          setup_api_calls:
            - call: "POST /fleet/branches"
              payload:
                code: "WST-01"
                name: "West Yard"
                region: "WEST"
                yard_capacity: 10
                peak_season_start_date: "2026-09-01"
                peak_season_end_date: "2026-11-30"
                lease_reserve_pct: 0.00
              as: FleetAdmin
              captures: { b_west_id: "$.data.id", b_west_v1: "$.data.version" }
            - call: "POST /fleet/trailer-types"
              payload:
                code: "DRY_VAN_53"
                description: "53ft dry van"
                base_daily_rate_cents: 4500
                base_monthly_rate_cents: 95000
                residual_floor_cents: 450000
                required_physical_damage_limit_cents: 3000000
                dot_inspection_interval_days: 365
                pm_interval_miles: 30000
              as: FleetAdmin
              captures: { tt_dv_id: "$.data.id" }
            - call: "POST /fleet/rate-cards"
              payload:
                branch_id: "${b_west_id}"
                trailer_type_id: "${tt_dv_id}"
                product: "SHORT_TERM_RENTAL"
                daily_rate_cents: 5200
                monthly_rate_cents: 110000
                peak_uplift_pct: 0.30
                mileage_included_per_month: 2500
                excess_mileage_rate_cents_per_mile: 22
                effective_date: "2026-07-01"
                expected_branch_version: "${b_west_v1}"
              as: FleetAdmin
            - call: "POST /fleet/trailers"
              payload:
                unit_number: "T-1001"
                trailer_type_id: "${tt_dv_id}"
                home_branch_id: "${b_west_id}"
                acquisition_cost_cents: 4500000
                in_service_date: "2022-08-01"
                last_dot_inspection_date: "2026-01-01"
                hub_miles: 41000
              as: FleetAdmin
              captures: { tr1_id: "$.data.id" }
            - call: "POST /fleet/customers"
              payload:
                legal_name: "Ridge Haul LLC"
                dot_number: "DOT-771"
                credit_tier: "B"
                credit_limit_cents: 5000000
              as: FleetAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /fleet/insurance-certificates"
              payload:
                customer_id: "${cust_id}"
                carrier_name: "Great West Casualty"
                policy_number: "P-1"
                physical_damage_limit_cents: 3000000
                liability_limit_cents: 100000000
                effective_date: "2024-01-01"
                expiry_date: "2027-01-01"
              as: FleetAdmin
            - call: "POST /fleet/trailers"
              payload:
                unit_number: "T-1002"
                trailer_type_id: "${tt_dv_id}"
                home_branch_id: "${b_west_id}"
                acquisition_cost_cents: 4500000
                in_service_date: "2022-08-01"
                last_dot_inspection_date: "2026-01-01"
                hub_miles: 52000
              as: FleetAdmin
              captures: { tr2_id: "$.data.id" }
            - call: "POST /fleet/trailers"
              payload:
                unit_number: "T-1003"
                trailer_type_id: "${tt_dv_id}"
                home_branch_id: "${b_west_id}"
                acquisition_cost_cents: 4500000
                in_service_date: "2022-08-01"
                last_dot_inspection_date: "2026-01-01"
                hub_miles: 63000
              as: FleetAdmin
              captures: { tr3_id: "$.data.id" }
          trigger:
            - call: "GET /fleet/trailers"
              payload: { current_branch_id: "${b_west_id}", availability_status: "AVAILABLE", limit: 2, offset: 0 }
              as: FleetAdmin
              captures: { first_id: "$.data[0].id" }
          assert:
            - "the response envelope pagination block reports limit == 2, offset == 0, total_count == 3 and has_more == true"
            - "the returned array has exactly 2 elements"
            - "every returned element has current_branch_id == ${b_west_id} and availability_status == AVAILABLE"
            - "${first_id} is one of ${tr1_id}, ${tr2_id}, ${tr3_id}"

      - name: create_agreement_with_unknown_customer_returns_customer_not_found
        claim_type: parent_relationships
        grounds: ["entities.Agreement.fields.customer_id", "errors[ERR_CUSTOMER_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "A body foreign key that resolves to nothing answers ERR_CUSTOMER_NOT_FOUND (404) at validation priority 4, before any state or business rule can run."
        test_recipe:
          setup:
            - "Branch WST-01, trailer type DRY_VAN_53, one trailer and one real customer exist."
          setup_api_calls:
            - call: "POST /fleet/branches"
              payload:
                code: "WST-01"
                name: "West Yard"
                region: "WEST"
                yard_capacity: 10
                peak_season_start_date: "2026-09-01"
                peak_season_end_date: "2026-11-30"
                lease_reserve_pct: 0.00
              as: FleetAdmin
              captures: { b_west_id: "$.data.id", b_west_v1: "$.data.version" }
            - call: "POST /fleet/trailer-types"
              payload:
                code: "DRY_VAN_53"
                description: "53ft dry van"
                base_daily_rate_cents: 4500
                base_monthly_rate_cents: 95000
                residual_floor_cents: 450000
                required_physical_damage_limit_cents: 3000000
                dot_inspection_interval_days: 365
                pm_interval_miles: 30000
              as: FleetAdmin
              captures: { tt_dv_id: "$.data.id" }
            - call: "POST /fleet/rate-cards"
              payload:
                branch_id: "${b_west_id}"
                trailer_type_id: "${tt_dv_id}"
                product: "SHORT_TERM_RENTAL"
                daily_rate_cents: 5200
                monthly_rate_cents: 110000
                peak_uplift_pct: 0.30
                mileage_included_per_month: 2500
                excess_mileage_rate_cents_per_mile: 22
                effective_date: "2026-07-01"
                expected_branch_version: "${b_west_v1}"
              as: FleetAdmin
            - call: "POST /fleet/trailers"
              payload:
                unit_number: "T-1001"
                trailer_type_id: "${tt_dv_id}"
                home_branch_id: "${b_west_id}"
                acquisition_cost_cents: 4500000
                in_service_date: "2022-08-01"
                last_dot_inspection_date: "2026-01-01"
                hub_miles: 41000
              as: FleetAdmin
              captures: { tr1_id: "$.data.id" }
            - call: "POST /fleet/customers"
              payload:
