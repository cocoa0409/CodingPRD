  - section: errors
    instances:
      - name: corner_missing_auth_headers_return_the_three_401_codes
        claim_type: error_triggerability
        grounds:
          - errors.ERR_MISSING_ROLE_HEADER
          - errors.ERR_UNKNOWN_ROLE
          - errors.ERR_MISSING_USER_HEADER
          - validations[priority=1]
          - validations[priority=2]
        distinguishing_aspect: "The three 401 codes are distinct and are decided before anything else: a blank X-User-Role is ERR_MISSING_ROLE_HEADER, a syntactically fine but undeclared role is ERR_UNKNOWN_ROLE, and a blank X-User-ID with a perfectly valid role is ERR_MISSING_USER_HEADER - all three on a request whose path, body and permissions would otherwise succeed."
        test_recipe:
          setup:
            - "One documentation program that the same GET would return successfully with correct headers."
          setup_api_calls:
            - call: "POST /documentation-programs"
              as: ProgramAdmin
              as_user_id: "pa-1"
              payload:
                program_code: "DSCR"
                name: "Investor DSCR"
                min_dscr: 1.1000
                max_ltv_pct: 85.00
                min_fico: 660
                min_reserves_months: 6
                min_residual_income_cents: 0
                second_valuation_ltv_threshold_pct: 90.00
                second_valuation_loan_amount_threshold_cents: 150000000
                atr_exempt_flag: true
                seasoning_matrix: { FORECLOSURE: 36, SHORT_SALE: 24, DEED_IN_LIEU: 24, BK_CH7: 24, BK_CH13: 12, MODIFICATION: 12, MORTGAGE_LATE_60: 12 }
              captures: { prog_id: "$.data.id" }
          trigger:
            - call: "GET /documentation-programs/${prog_id}"
              as: ""
              as_user_id: "pa-1"
              captures: { err_role: "$.data.error_id" }
            - call: "GET /documentation-programs/${prog_id}"
              as: "Auditor"
              as_user_id: "pa-1"
              captures: { err_unknown: "$.data.error_id" }
            - call: "GET /documentation-programs/${prog_id}"
              as: ProgramAdmin
              as_user_id: ""
              captures: { err_user: "$.data.error_id" }
            - call: "GET /documentation-programs/${prog_id}"
              as: ProgramAdmin
              as_user_id: "pa-1"
          assert:
            - "First trigger call (X-User-Role header omitted entirely): HTTP status == 401 and error_id == ERR_MISSING_ROLE_HEADER"
            - "Second trigger call (X-User-Role: Auditor, not one of the eight declared roles): HTTP status == 401 and error_id == ERR_UNKNOWN_ROLE"
            - "Third trigger call (X-User-ID header omitted): HTTP status == 401 and error_id == ERR_MISSING_USER_HEADER"
            - "Fourth trigger call: HTTP status == 200 and id == ${prog_id}, proving the three failures were caused only by the headers"
            - "A whitespace-only X-User-Role behaves exactly like an absent one (ERR_MISSING_ROLE_HEADER), never like ERR_UNKNOWN_ROLE"

      - name: corner_invalid_payload_shape_range_and_duplicate_code_rejected
        claim_type: error_triggerability
        grounds:
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_VALUE_OUT_OF_RANGE
          - errors.ERR_DUPLICATE_CODE
          - validations[priority=3]
          - validations[priority=4]
        distinguishing_aspect: "Shape errors (400) are separated from domain errors (422) and from uniqueness errors (409): a missing required field, an undeclared enum member and an unknown body field are all ERR_INVALID_REQUEST, a fico_score of 900 is a well-shaped value outside its declared domain, and a repeated program_code is neither of those."
        test_recipe:
          setup:
            - "One DSCR program whose program_code will be re-used, and one valid borrower."
          setup_api_calls:
            - call: "POST /documentation-programs"
              as: ProgramAdmin
              as_user_id: "pa-1"
              payload:
                program_code: "DSCR"
                name: "Investor DSCR"
                min_dscr: 1.1000
                max_ltv_pct: 85.00
                min_fico: 660
                min_reserves_months: 6
                min_residual_income_cents: 0
                second_valuation_ltv_threshold_pct: 90.00
                second_valuation_loan_amount_threshold_cents: 150000000
                atr_exempt_flag: true
                seasoning_matrix: { FORECLOSURE: 36, SHORT_SALE: 24, DEED_IN_LIEU: 24, BK_CH7: 24, BK_CH13: 12, MODIFICATION: 12, MORTGAGE_LATE_60: 12 }
              captures: { prog_id: "$.data.id" }
            - call: "POST /borrowers"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload: { legal_name: "Vera Valid", fico_score: 700, monthly_debt_obligations_cents: 0, verified_liquid_assets_cents: 5000000, age_years: 50 }
              captures: { borr_id: "$.data.id" }
          trigger:
            - call: "POST /borrowers"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload: { legal_name: "No Fico", monthly_debt_obligations_cents: 0, verified_liquid_assets_cents: 5000000, age_years: 50 }
              captures: { err_missing: "$.data.error_id" }
            - call: "POST /borrowers"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload: { legal_name: "High Fico", fico_score: 900, monthly_debt_obligations_cents: 0, verified_liquid_assets_cents: 5000000, age_years: 50 }
              captures: { err_range: "$.data.error_id" }
            - call: "POST /loan-files"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload:
                borrower_id: "${borr_id}"
                program_id: "${prog_id}"
                investor_code: "INV-ALPHA"
                loan_amount_cents: 60000000
                property_value_cents: 80000000
                occupancy: "PRIMARY_RESIDENCE"
                purpose: "PURCHASE"
                lien_position: "FIRST"
                note_rate_pct: 8.750
                apor_pct: 6.100
                term_months: 360
                amortization_type: "INTEREST_ONLY"
                monthly_taxes_cents: 60000
                monthly_insurance_cents: 20000
              captures: { err_enum: "$.data.error_id" }
            - call: "POST /borrowers"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload: { legal_name: "Negative Assets", fico_score: 700, monthly_debt_obligations_cents: 0, verified_liquid_assets_cents: -1, age_years: 50 }
              captures: { err_negative: "$.data.error_id" }
            - call: "POST /documentation-programs"
              as: ProgramAdmin
              as_user_id: "pa-1"
              payload:
                program_code: "DSCR"
                name: "Investor DSCR Second Attempt"
                min_dscr: 1.2000
                max_ltv_pct: 80.00
                min_fico: 680
                min_reserves_months: 6
                min_residual_income_cents: 0
                second_valuation_ltv_threshold_pct: 90.00
                second_valuation_loan_amount_threshold_cents: 150000000
                atr_exempt_flag: true
                seasoning_matrix: { FORECLOSURE: 36, SHORT_SALE: 24, DEED_IN_LIEU: 24, BK_CH7: 24, BK_CH13: 12, MODIFICATION: 12, MORTGAGE_LATE_60: 12 }
              captures: { err_dup: "$.data.error_id" }
          assert:
            - "First trigger call: HTTP status == 400 and error_id == ERR_INVALID_REQUEST (fico_score is required and has no default)"
            - "Second trigger call: HTTP status == 422 and error_id == ERR_VALUE_OUT_OF_RANGE (300 <= fico_score <= 850, so 900 is well-shaped but out of domain)"
            - "Third trigger call: HTTP status == 400 and error_id == ERR_INVALID_REQUEST (PRIMARY_RESIDENCE is not a member of {PRIMARY, SECOND_HOME, INVESTMENT}); the shape rule at priority 3 fires before the existence rule at priority 5 would have accepted the ids"
            - "Fourth trigger call: HTTP status == 422 and error_id == ERR_VALUE_OUT_OF_RANGE (all *_cents fields must be >= 0)"
            - "Fifth trigger call: HTTP status == 409 and error_id == ERR_DUPLICATE_CODE; GET /documentation-programs/${prog_id} still reports name == Investor DSCR and min_fico == 660, so the duplicate attempt overwrote nothing"

      - name: corner_every_declared_not_found_code_is_reachable
        claim_type: error_triggerability
        grounds:
          - validations[priority=5]
          - errors.ERR_PROGRAM_NOT_FOUND
          - errors.ERR_OVERLAY_NOT_FOUND
          - errors.ERR_BORROWER_NOT_FOUND
          - errors.ERR_LOAN_FILE_NOT_FOUND
          - errors.ERR_WORKSHEET_NOT_FOUND
          - errors.ERR_STATEMENT_MONTH_NOT_FOUND
          - errors.ERR_VALUATION_ORDER_NOT_FOUND
          - errors.ERR_REVIEW_NOT_FOUND
