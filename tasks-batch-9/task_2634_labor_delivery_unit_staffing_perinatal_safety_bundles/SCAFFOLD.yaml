# =============================================================================
# PRD-Bench scaffold — task_2634 Labor & Delivery Unit Staffing & Perinatal
# Safety Bundles.  PART 1: preamble, §1.0 response envelope, §1.1 entities,
# §1.2 state machines (+ §1.2.1 concurrency rules), §1.3 calculations,
# §1.4 validations, §1.5 endpoints (101), §1.6 error catalog (116 ids) and
# §1.7 RBAC matrix (6 roles).  COMPLETE — §1.8/§1.9 live in their own files.
#
# Naming conventions this file commits to (so §1.5–§1.7 derive mechanically):
#   * endpoints  : kebab-case plural collections, camelCase path params
#                  ("POST /labor-encounters/{encounterId}/advance-phase").
#                  Logical-clock and sweep drivers: "POST /_clock/set_current_utc",
#                  "POST /obstetric-units/{unitId}/capacity-sweep".
#   * error ids  : ERR_<SUBJECT>_<CONDITION>, SCREAMING_SNAKE.
#                  OCC losers are ERR_STALE_<PARENT>_VERSION (HTTP 412).
#   * roles      : ChargeNurse, BedsideNurse, ObstetricianAttending,
#                  AnesthesiaLead, PerinatalSafetyOfficer, PatientAccessCoordinator.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2634. Labor & Delivery Unit Staffing & Perinatal Safety Bundles (hospital obstetrics unit): staffing ratios by labor phase and acuity with one-to-one requirements, induction scheduling with bed and staffing capacity constraints, hemorrhage and hypertension bundle activation with timed intervention checklists, emergency cesarean decision-to-incision readiness and drill documentation, fetal monitoring interpretation escalation chains, unexpected newborn complication review and case debriefs, doula and support person policies with visitation constraints, quality measure reporting on primary cesarean and episiotomy rates

domain_name: perinatal-safety-ops
api_prefix: ""                    # deliberately EMPTY: this scaffold has no single root
                                  # collection.  The entity topology is a graph, so §1.5
                                  # mounts fourteen sibling collections at "/" (see the
                                  # endpoint table); every path there is already absolute
                                  # and MUST NOT be re-prefixed.

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency        # OCC on ObstetricUnit / LaborEncounter / SafetyBundleActivation version
    - cascading_side_effects        # coverage breach -> posture -> induction bumps -> bed release
    - dual_variant_calculation      # bundle timeliness anchoring; quality-measure cohort attribution
    - rate_threshold_triggers       # deficit / breach-count / gestational-age / decision-to-incision breakpoints

  entity_topology: graph
  # Peer aggregates (ObstetricUnit, LaborEncounter) linked by junction rows
  # (CareAssignment joins ShiftAssignment x LaborEncounter), plus four
  # self-referential FKs (shift handoff, assignment supersede, assessment
  # supersede, snapshot supersede).  Not a tree: Bed <-> LaborEncounter <->
  # InductionBooking form a cycle of nullable references.

  state_machine_shape: parallel
  # LaborEncounter carries TWO independent state axes (labor_phase x
  # staffing_state) that constrain each other through preconditions; the
  # scaffold also contains cyclic machines (InductionBooking rebooking loop,
  # FetalMonitoringAssessment escalation re-arm, NewbornComplicationReview
  # rework loop, CesareanReadinessDrill invalidate/re-document loop), a
  # branching fork-join (EmergencyCesareanEvent), and a compound derived
  # posture on ObstetricUnit.

  relationship_patterns:
    - one_to_many          # ObstetricUnit -> Bed / StaffMember / ShiftAssignment / InductionBooking
    - many_to_many         # StaffMember <-> LaborEncounter via CareAssignment
    - self_referential     # ShiftAssignment.relieved_by_shift_id, CareAssignment.superseded_by_assignment_id,
                           # FetalMonitoringAssessment.supersedes_assessment_id, QualityMeasureSnapshot.superseded_by_snapshot_id
    - cross_aggregate      # SafetyBundleActivation (LaborEncounter aggregate) mutates ObstetricUnit posture

  role_model: segregation_of_duties
  # The PerinatalSafetyOfficer who closes a debrief or certifies a quality
  # snapshot MUST NOT be the clinician who documented the case, and the
  # NewbornComplicationReview facilitator MUST NOT hold a CareAssignment on
  # the reviewed encounter.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table  (15 entities)
# =============================================================================
entities:
  - name: ObstetricUnit
    parent: null
    common_fields: true
    fields:
      - { name: unit_name, type: string, source: input, description: "Human label of the L&D unit", constraints: "1..120 chars, unique across units" }
      - { name: licensed_ldr_beds, type: integer, source: input, description: "Licensed labor-delivery-recovery bed count", constraints: ">= 1" }
      - { name: licensed_or_rooms, type: integer, source: input, description: "Licensed obstetric operating rooms", constraints: ">= 1" }
      - { name: max_daily_induction_bed_minutes, type: integer, source: input, default: 2880, description: "Per-calendar-day (UTC) LDR bed-minute budget available to scheduled inductions", constraints: ">= 0" }
      - { name: staffing_posture, type: enum, source: computed, default: "OPEN", description: "Derived gate over child operations, per calc unit_posture_derivation", constraints: "OPEN | RATIO_STRAINED | INDUCTION_FROZEN | DIVERT" }
      - { name: coverage_deficit_units, type: number, source: computed, default: 0, description: "Sum over in-unit encounters of max(0, required_coverage_units - assigned_coverage_units), per calc unit_posture_derivation; 1 decimal place" }
      - { name: cesarean_readiness_state, type: enum, source: computed, default: "NOT_READY", description: "Derived from drill currency + OR standby staffing + rolling real decision-to-incision performance, per calc cesarean_readiness_derivation", constraints: "READY | DEGRADED | NOT_READY" }
      - { name: escalation_breach_count, type: integer, source: computed, default: 0, description: "Count of FetalMonitoringAssessment rows on this unit in escalation_status TIMED_OUT_BREACH; never decremented except by rescind of the owning encounter transfer" }
      - { name: bundle_breach_count, type: integer, source: computed, default: 0, description: "Count of SafetyBundleActivation rows on this unit whose missed_step_count >= 1 and status IN {CONTROLLED, DEBRIEF_PENDING, CLOSED}" }
      - { name: turnover_buffer_minutes, type: integer, source: computed, default: 45, description: "Bed turnover buffer applied to induction interval arithmetic: 45 when staffing_posture == OPEN, 75 otherwise" }
      - { name: committed_bed_minutes_by_day, type: object, source: computed, description: "Map of UTC date (YYYY-MM-DD) -> summed projected_occupancy_minutes of InductionBooking rows with status IN {CONFIRMED, ADMITTED}" }
      - { name: held_bed_minutes_by_day, type: object, source: computed, description: "Map of UTC date (YYYY-MM-DD) -> summed projected_occupancy_minutes of InductionBooking rows with status == CAPACITY_HELD; conserved quantity of invariant induction_bed_minute_conservation" }
      - { name: last_capacity_sweep_at, type: datetime, source: computed, description: "Logical-clock instant of the most recent POST /obstetric-units/{unitId}/capacity-sweep; null before the first sweep" }

  - name: StaffMember
    parent: ObstetricUnit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> ObstetricUnit.id; set from the creation path, immutable" }
      - { name: full_name, type: string, source: input, description: "Staff display name", constraints: "1..120 chars" }
      - { name: staff_role, type: enum, source: input, description: "Clinical role determining eligible role_slot values and base capacity", constraints: "RN_LABOR_DELIVERY | OB_ATTENDING | CERTIFIED_NURSE_MIDWIFE | ANESTHESIOLOGIST | SURGICAL_TECH | NEONATAL_RESUSCITATOR" }
      - { name: fetal_monitoring_cert_level, type: enum, source: input, default: "BASIC", description: "Electronic fetal monitoring competency; caps acuity load per calc staff_capacity_units", constraints: "BASIC | ADVANCED | EXPIRED" }
      - { name: credential_expires_at, type: datetime, source: input, description: "Licensure expiry; compared against the logical clock at assignment time (strict >)" }
      - { name: or_circulating_qualified, type: boolean, source: input, default: false, description: "Eligible for role_slot OR_STANDBY and for EmergencyCesareanEvent team mobilization" }
      - { name: employment_status, type: enum, source: system, default: "ACTIVE", description: "Availability flag mutated by PATCH /staff-members/{staffId}", constraints: "ACTIVE | ON_LEAVE | INACTIVE" }
      - { name: last_validated_drill_at, type: datetime, source: computed, description: "decision_at of the most recent CesareanReadinessDrill with status == VALIDATED listing this staff id in participant_staff_ids; null when none" }
      - { name: drill_currency_state, type: enum, source: computed, default: "LAPSED", description: "CURRENT when last_validated_drill_at is non-null and clock_now - last_validated_drill_at <= DRILL_CURRENCY_DAYS; else LAPSED", constraints: "CURRENT | LAPSED" }
      - { name: capacity_units, type: number, source: computed, description: "Effective acuity-unit capacity for this staff member, per calc staff_capacity_units; 1 decimal place" }

  - name: ShiftAssignment
    parent: ObstetricUnit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> ObstetricUnit.id; the unit whose posture this shift feeds" }
      - { name: staff_id, type: string, source: input, description: "FK -> StaffMember.id; the staff member working the interval" }
      - { name: role_slot, type: enum, source: input, description: "Slot the staff member fills for this interval", constraints: "CHARGE | BEDSIDE | ONE_TO_ONE_FLOAT | OR_STANDBY | TRIAGE" }
      - { name: shift_start_utc, type: datetime, source: input, description: "Interval start, INCLUSIVE (half-open [start, end) semantics for staff overlap)" }
      - { name: shift_end_utc, type: datetime, source: input, description: "Interval end, EXCLUSIVE; must be > shift_start_utc and <= start + MAX_SHIFT_MINUTES" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED -> ACTIVE -> RELIEVED, or -> CANCELLED", constraints: "SCHEDULED | ACTIVE | RELIEVED | CANCELLED" }
      - { name: capacity_units_effective, type: number, source: computed, description: "Snapshot of calc staff_capacity_units evaluated for this role_slot at activation; 1 decimal place" }
      - { name: assigned_acuity_load_units, type: number, source: computed, default: 0, description: "Sum of CareAssignment.acuity_units_consumed for rows with status == ACTIVE referencing this shift; conserved quantity of invariant acuity_load_conservation; 1 decimal place" }
      - { name: relieved_by_shift_id, type: string, source: input, description: "FK -> ShiftAssignment.id; self-referential handoff pointer supplied on POST /shift-assignments/{shiftId}/relieve, null otherwise" }

  - name: Bed
    parent: ObstetricUnit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> ObstetricUnit.id; set from the creation path, immutable" }
      - { name: bed_label, type: string, source: input, description: "Room label", constraints: "unique per (unit_id, bed_label)" }
      - { name: bed_type, type: enum, source: input, description: "Physical bed class; only LDR beds satisfy induction holds, only OR beds satisfy cesarean mobilization", constraints: "LDR | OR | TRIAGE | POSTPARTUM" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE -> HELD -> OCCUPIED -> TURNOVER -> AVAILABLE, plus BLOCKED / CLOSED", constraints: "AVAILABLE | HELD | OCCUPIED | TURNOVER | BLOCKED | CLOSED" }
      - { name: current_encounter_id, type: string, source: computed, description: "FK -> LaborEncounter.id; the encounter physically occupying the bed, null unless status == OCCUPIED" }
      - { name: held_booking_id, type: string, source: computed, description: "FK -> InductionBooking.id; the booking holding the bed, null unless status == HELD" }
      - { name: turnover_clear_at, type: datetime, source: computed, description: "Instant at which a TURNOVER bed returns to AVAILABLE = turnover_started_at + unit.turnover_buffer_minutes; null unless status == TURNOVER" }

  - name: LaborEncounter
    parent: ObstetricUnit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> ObstetricUnit.id; set from the creation path, immutable" }
      - { name: bed_id, type: string, source: computed, description: "FK -> Bed.id; the LDR bed currently occupied, null while labor_phase == ANTEPARTUM or after DISCHARGED" }
      - { name: source_booking_id, type: string, source: computed, description: "FK -> InductionBooking.id; set when the encounter was created by POST /induction-bookings/{bookingId}/admit, null for walk-in encounters" }
      - { name: patient_record_code, type: string, source: input, description: "De-identified patient reference", constraints: "unique per unit_id" }
      - { name: labor_phase, type: enum, source: system, default: "ANTEPARTUM", description: "Clinical progression axis (state machine 1)", constraints: "ANTEPARTUM | LATENT | ACTIVE_FIRST_STAGE | SECOND_STAGE | THIRD_STAGE_DELIVERED | POSTPARTUM_RECOVERY | DISCHARGED | TRANSFERRED_OUT" }
      - { name: staffing_state, type: enum, source: system, default: "UNASSIGNED", description: "Coverage axis (state machine 2); evolves independently of labor_phase and gates it", constraints: "UNASSIGNED | RATIO_COVERED | ONE_TO_ONE_COVERED | COVERAGE_BREACH | RELEASED" }
      - { name: parity, type: integer, source: input, description: "Prior births; parity == 0 means nulliparous", constraints: ">= 0" }
      - { name: prior_cesarean, type: boolean, source: input, default: false, description: "Any prior cesarean delivery; excludes the encounter from the NTSV denominator and makes a cesarean CESAREAN_REPEAT" }
      - { name: gestational_age_weeks, type: integer, source: input, description: "Completed weeks of gestation at admission", constraints: "20..44" }
      - { name: fetus_count, type: integer, source: input, default: 1, description: "Number of fetuses; > 1 excludes the encounter from the NTSV denominator", constraints: ">= 1" }
      - { name: presentation, type: enum, source: input, default: "VERTEX", description: "Fetal presentation at admission", constraints: "VERTEX | BREECH | OTHER" }
      - { name: is_ntsv, type: boolean, source: computed, description: "Nulliparous-Term-Singleton-Vertex flag = (parity == 0 AND prior_cesarean == false AND gestational_age_weeks >= 37 AND fetus_count == 1 AND presentation == VERTEX)" }
      - { name: acuity_tier, type: enum, source: computed, default: "TIER_I", description: "Acuity classification per calc encounter_required_coverage_units step 1", constraints: "TIER_I | TIER_II | TIER_III | TIER_IV" }
      - { name: one_to_one_required, type: boolean, source: computed, default: false, description: "True when any one-to-one trigger in calc encounter_required_coverage_units step 2 holds" }
      - { name: required_coverage_units, type: number, source: computed, description: "Acuity units this encounter demands, per calc encounter_required_coverage_units; 1 decimal place" }
      - { name: assigned_coverage_units, type: number, source: computed, default: 0, description: "Sum of CareAssignment.acuity_units_consumed for rows on this encounter with status == ACTIVE; 1 decimal place" }
      - { name: magnesium_infusion_active, type: boolean, source: computed, default: false, description: "True while a SafetyBundleActivation with bundle_type == SEVERE_HYPERTENSION on this encounter has status IN {STAGE_1_IN_PROGRESS, STAGE_2_ESCALATED, STAGE_3_MASSIVE_TRANSFUSION}" }
      - { name: delivery_mode, type: enum, source: system, description: "Set by the advance-phase call that reaches THIRD_STAGE_DELIVERED, or by EmergencyCesareanEvent record-delivery / abort-to-vaginal; null before delivery", constraints: "SPONTANEOUS_VAGINAL | OPERATIVE_VAGINAL | CESAREAN_PRIMARY | CESAREAN_REPEAT" }
      - { name: episiotomy_performed, type: boolean, source: input, default: false, description: "Supplied on the advance-phase call that reaches THIRD_STAGE_DELIVERED; numerator input of the episiotomy measure" }
      - { name: admitted_at, type: datetime, source: system, description: "Logical-clock instant of encounter creation; admission-cohort attribution key of calc quality_measure_rates" }
      - { name: delivery_recorded_at, type: datetime, source: system, description: "Logical-clock instant at which delivery_mode was first set; delivery-cohort attribution key of calc quality_measure_rates; null before delivery" }
      - { name: review_required, type: boolean, source: computed, default: false, description: "True once a NewbornComplicationReview exists on this encounter with status != CLOSED; blocks DISCHARGED" }

  - name: CareAssignment
    parent: LaborEncounter
    common_fields: true
    fields:
      - { name: encounter_id, type: string, source: input, description: "FK -> LaborEncounter.id; the patient being covered" }
      - { name: shift_assignment_id, type: string, source: input, description: "FK -> ShiftAssignment.id; the staffed interval funding this coverage" }
      - { name: staff_id, type: string, source: computed, description: "FK -> StaffMember.id; denormalized from the referenced ShiftAssignment.staff_id" }
      - { name: coverage_mode, type: enum, source: input, description: "RATIO_SHARED consumes tiered units; ONE_TO_ONE consumes the staff member's whole capacity", constraints: "RATIO_SHARED | ONE_TO_ONE" }
      - { name: acuity_units_consumed, type: number, source: computed, description: "Units debited from ShiftAssignment.assigned_acuity_load_units, per calc care_assignment_unit_debit; 1 decimal place" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE -> RELEASED (explicit release / encounter closure) or ACTIVE -> SUPERSEDED (handoff create)", constraints: "ACTIVE | RELEASED | SUPERSEDED" }
      - { name: released_at, type: datetime, source: system, description: "Logical-clock instant of the release or supersede transition; null while ACTIVE" }
      - { name: superseded_by_assignment_id, type: string, source: computed, description: "FK -> CareAssignment.id; self-referential handoff pointer written on the predecessor when a new ONE_TO_ONE assignment supersedes it, null otherwise" }

  - name: InductionBooking
    parent: ObstetricUnit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> ObstetricUnit.id; set from the creation path, immutable" }
      - { name: bed_id, type: string, source: computed, description: "FK -> Bed.id; the LDR bed held for this booking, null unless status IN {CAPACITY_HELD, CONFIRMED, ADMITTED}" }
      - { name: encounter_id, type: string, source: computed, description: "FK -> LaborEncounter.id; the encounter minted by admit, null before admission" }
      - { name: patient_record_code, type: string, source: input, description: "De-identified patient reference carried onto the minted encounter" }
      - { name: gestational_age_weeks, type: integer, source: input, description: "Planned completed weeks at induction start; the 39-week elective boundary is evaluated with >=", constraints: "20..44" }
      - { name: indication_code, type: enum, source: input, description: "Clinical indication driving priority_class", constraints: "PREECLAMPSIA | POST_DATES_41W | FGR | PROM | GDM_CONTROLLED | ELECTIVE_NO_INDICATION" }
      - { name: priority_class, type: enum, source: computed, description: "Ranking class per calc induction_priority_class; drives sweep promotion order and bump exposure", constraints: "MEDICALLY_INDICATED | ELECTIVE_39_WEEK | PATIENT_REQUEST" }
      - { name: requested_start_utc, type: datetime, source: input, description: "Requested induction start; must be > clock_now at creation" }
      - { name: expected_labor_minutes, type: integer, source: input, default: 720, description: "Clinician estimate of occupancy before turnover", constraints: "60..2160" }
      - { name: projected_occupancy_minutes, type: integer, source: computed, description: "expected_labor_minutes + unit.turnover_buffer_minutes snapshotted at hold time, per calc induction_capacity_projection; the conserved bed-minute quantum" }
      - { name: hold_expires_at, type: datetime, source: computed, description: "Hold TTL = hold_granted_at + HOLD_TTL_MINUTES; null unless status == CAPACITY_HELD" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED -> CAPACITY_HELD -> CONFIRMED -> ADMITTED, with BUMPED -> REQUESTED re-queue and CANCELLED / EXPIRED exits", constraints: "REQUESTED | CAPACITY_HELD | CONFIRMED | ADMITTED | BUMPED | CANCELLED | EXPIRED" }
      - { name: bump_count, type: integer, source: computed, default: 0, description: "Number of times this booking has been bumped; >= BUMP_ESCALATION_LIMIT forces MEDICALLY_INDICATED-equivalent rank per calc induction_priority_class step 4" }

  - name: SafetyBundleActivation
    parent: LaborEncounter
    common_fields: true
    fields:
      - { name: encounter_id, type: string, source: system, description: "FK -> LaborEncounter.id; set from the request body, immutable" }
      - { name: unit_id, type: string, source: computed, description: "FK -> ObstetricUnit.id; denormalized from the encounter for posture accounting" }
      - { name: bundle_type, type: enum, source: input, description: "Which perinatal safety bundle is running", constraints: "OBSTETRIC_HEMORRHAGE | SEVERE_HYPERTENSION" }
      - { name: activation_trigger, type: enum, source: input, description: "Objective trigger; QBL_THRESHOLD requires quantitative_blood_loss_ml, BP_THRESHOLD requires both pressures", constraints: "QBL_THRESHOLD | BP_THRESHOLD | CLINICIAN_JUDGMENT" }
      - { name: quantitative_blood_loss_ml, type: integer, source: input, description: "Cumulative quantified blood loss; the 1000 mL boundary is evaluated with >=; null for SEVERE_HYPERTENSION", constraints: ">= 0" }
      - { name: systolic_mmhg, type: integer, source: input, description: "Severe-range systolic reading; the 160 boundary is evaluated with >=; null for OBSTETRIC_HEMORRHAGE", constraints: "60..300" }
      - { name: diastolic_mmhg, type: integer, source: input, description: "Severe-range diastolic reading; the 110 boundary is evaluated with >=; null for OBSTETRIC_HEMORRHAGE", constraints: "30..200" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock instant of activation; anchor of the authoritative activation_anchored due dates" }
      - { name: status, type: enum, source: system, default: "ACTIVATED", description: "ACTIVATED -> STAGE_1_IN_PROGRESS -> {STAGE_2_ESCALATED -> {STAGE_3_MASSIVE_TRANSFUSION, CONTROLLED}} -> CONTROLLED -> DEBRIEF_PENDING -> CLOSED, plus RESCINDED", constraints: "ACTIVATED | STAGE_1_IN_PROGRESS | STAGE_2_ESCALATED | STAGE_3_MASSIVE_TRANSFUSION | CONTROLLED | DEBRIEF_PENDING | CLOSED | RESCINDED" }
      - { name: highest_stage_reached, type: integer, source: computed, default: 0, description: "High-water stage number (0 at ACTIVATED, 1/2/3 as stages are entered); never decreases while status != RESCINDED" }
      - { name: on_time_step_count, type: integer, source: computed, default: 0, description: "Count of child BundleChecklistItem rows with status == COMPLETED under activation-anchored due dates" }
      - { name: late_step_count, type: integer, source: computed, default: 0, description: "Count of child BundleChecklistItem rows with status == LATE_COMPLETED under activation-anchored due dates" }
      - { name: missed_step_count, type: integer, source: computed, default: 0, description: "Count of child BundleChecklistItem rows with status == MISSED" }
      - { name: timeliness_score, type: number, source: computed, description: "AUTHORITATIVE compliance score from calc bundle_intervention_timeliness variant activation_anchored; 2 decimal places, round_half_up; null until status IN {CONTROLLED, DEBRIEF_PENDING, CLOSED}" }
      - { name: sequence_adjusted_score, type: number, source: computed, description: "Advisory score from calc bundle_intervention_timeliness variant sequence_anchored, recorded in the debrief packet only; 2 decimal places, round_half_up; null until status IN {CONTROLLED, DEBRIEF_PENDING, CLOSED}" }
      - { name: rescind_reason, type: string, source: input, description: "Free-text justification required by POST /bundle-activations/{activationId}/rescind; null otherwise", constraints: "10..500 chars when present" }

  - name: BundleChecklistItem
    parent: SafetyBundleActivation
    common_fields: true
    fields:
      - { name: activation_id, type: string, source: system, description: "FK -> SafetyBundleActivation.id; every item is minted by the activation, never client-created" }
      - { name: step_code, type: enum, source: system, description: "Templated intervention step; the template per bundle_type is fixed in calc bundle_checklist_template", constraints: "QBL_MEASURE | UTEROTONIC_GIVEN | TYPE_AND_SCREEN | MTP_ACTIVATED | ANTIHYPERTENSIVE_GIVEN | MAGNESIUM_LOADED | REPEAT_BP | OB_AT_BEDSIDE" }
      - { name: step_sequence, type: integer, source: system, description: "1-based ordinal within the activation template; ties impossible (unique per activation_id)", constraints: ">= 1" }
      - { name: stage_gate, type: integer, source: system, description: "Stage that must be entered before this item may be completed (1, 2 or 3)", constraints: "1..3" }
      - { name: required_within_minutes, type: integer, source: system, description: "Template allowance for this step, measured from the previous step under sequence anchoring and cumulatively from activated_at under activation anchoring", constraints: ">= 1" }
      - { name: due_at_activation_anchored, type: datetime, source: computed, description: "activated_at + sum(required_within_minutes of items with step_sequence <= this one); AUTHORITATIVE due date" }
      - { name: due_at_sequence_anchored, type: datetime, source: computed, description: "predecessor.completed_at (or activated_at for step_sequence == 1) + required_within_minutes; recomputed whenever the predecessor is completed; advisory only" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING -> COMPLETED | LATE_COMPLETED (authoritative anchoring decides which) | MISSED (sweep) | NOT_APPLICABLE (rescind or stage never reached)", constraints: "PENDING | COMPLETED | LATE_COMPLETED | MISSED | NOT_APPLICABLE" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock instant supplied by the complete call; null while PENDING" }
      - { name: performed_by_staff_id, type: string, source: input, description: "FK -> StaffMember.id; the clinician documenting the intervention, required by the complete call" }
      - { name: minutes_from_activation, type: number, source: computed, description: "floor((completed_at - activation.activated_at) / 60 seconds) in whole minutes; null while PENDING" }

  - name: FetalMonitoringAssessment
    parent: LaborEncounter
    common_fields: true
    fields:
      - { name: encounter_id, type: string, source: system, description: "FK -> LaborEncounter.id; set from the request body, immutable" }
      - { name: interpreted_by_staff_id, type: string, source: input, description: "FK -> StaffMember.id; interpreter, must hold fetal_monitoring_cert_level IN {BASIC, ADVANCED} and an ACTIVE CareAssignment or CHARGE shift on the unit" }
      - { name: supersedes_assessment_id, type: string, source: computed, description: "FK -> FetalMonitoringAssessment.id; self-referential pointer to the immediately prior assessment on the same encounter by created_at ASC, null for the first" }
      - { name: assessed_at, type: datetime, source: system, description: "Logical-clock instant of interpretation; anchor of escalation_due_at" }
      - { name: category, type: enum, source: input, description: "NICHD interpretation category", constraints: "CATEGORY_I | CATEGORY_II | CATEGORY_III" }
      - { name: baseline_rate_bpm, type: integer, source: input, description: "Baseline fetal heart rate", constraints: "50..220" }
      - { name: variability, type: enum, source: input, description: "Baseline variability", constraints: "ABSENT | MINIMAL | MODERATE | MARKED" }
      - { name: recurrent_decelerations, type: boolean, source: input, default: false, description: "Recurrent late or variable decelerations present" }
      - { name: escalation_status, type: enum, source: system, description: "Escalation chain axis; initial value is NOT_REQUIRED for CATEGORY_I and ESCALATION_DUE otherwise", constraints: "NOT_REQUIRED | ESCALATION_DUE | TIER_1_NOTIFIED | TIER_2_NOTIFIED | TIER_3_ACTIVATED | REASSESSMENT_PENDING | RESOLVED | TIMED_OUT_BREACH" }
      - { name: escalation_tier_high_water, type: integer, source: computed, default: 0, description: "Highest tier reached across the re-arm cycles of this assessment (0..3); a re-armed chain must resume at high_water + 1" }
      - { name: escalation_due_at, type: datetime, source: computed, description: "assessed_at + ESCALATION_DUE_MINUTES[category]; null when escalation_status == NOT_REQUIRED. Re-arm rewrites this to the re-arm instant + the same allowance" }
      - { name: next_tier_due_at, type: datetime, source: computed, description: "Deadline for the next tier notification = last tier instant + TIER_ADVANCE_MINUTES[category]; null unless escalation_status IN {TIER_1_NOTIFIED, TIER_2_NOTIFIED}" }
      - { name: reassessment_due_at, type: datetime, source: computed, description: "Deadline for a follow-up assessment = resolve instant + REASSESSMENT_WINDOW_MINUTES; null unless escalation_status == REASSESSMENT_PENDING" }

  - name: EmergencyCesareanEvent
    parent: LaborEncounter
    common_fields: true
    fields:
      - { name: encounter_id, type: string, source: system, description: "FK -> LaborEncounter.id; set from the request body or from the tier-3 escalation that minted this event" }
      - { name: or_bed_id, type: string, source: computed, description: "FK -> Bed.id; the OR bed moved to OCCUPIED by team mobilization, null before mobilization and after abort" }
      - { name: triggering_assessment_id, type: string, source: input, description: "FK -> FetalMonitoringAssessment.id; the CATEGORY_III assessment that forced the decision, null for hemorrhage-driven or clinician-declared events" }
      - { name: triggering_activation_id, type: string, source: input, description: "FK -> SafetyBundleActivation.id; the STAGE_2_ESCALATED hemorrhage bundle that forced the decision, null otherwise" }
      - { name: urgency_class, type: enum, source: input, description: "CATEGORY_1_CRASH targets 15 minutes decision-to-incision, CATEGORY_2_URGENT targets 30", constraints: "CATEGORY_1_CRASH | CATEGORY_2_URGENT" }
      - { name: decision_at, type: datetime, source: system, description: "Logical-clock instant the decision was declared; anchor of the decision-to-incision measurement" }
      - { name: incision_at, type: datetime, source: system, description: "Logical-clock instant supplied by record-incision; null before, and permanently null on the ABORTED_TO_VAGINAL branch" }
      - { name: delivery_at, type: datetime, source: system, description: "Logical-clock instant supplied by record-delivery; null before" }
      - { name: decision_to_incision_minutes, type: integer, source: computed, description: "floor((incision_at - decision_at) / 60 seconds) per calc decision_to_incision_measurement; null until incision recorded" }
      - { name: met_target, type: boolean, source: computed, description: "decision_to_incision_minutes <= D2I_TARGET_MINUTES[urgency_class] (boundary inclusive); null until incision recorded" }
      - { name: mobilized_staff_ids, type: array, source: computed, description: "Staff ids credited by mobilize-team (array of StaffMember.id); ordered by the request payload order" }
      - { name: status, type: enum, source: system, default: "DECISION_DECLARED", description: "DECISION_DECLARED -> TEAM_MOBILIZED -> INCISION_RECORDED -> DELIVERED -> REVIEW_PENDING -> CLOSED, or the ABORTED_TO_VAGINAL branch from either of the first two states", constraints: "DECISION_DECLARED | TEAM_MOBILIZED | INCISION_RECORDED | DELIVERED | REVIEW_PENDING | CLOSED | ABORTED_TO_VAGINAL" }

  - name: CesareanReadinessDrill
    parent: ObstetricUnit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> ObstetricUnit.id; set from the creation path, immutable" }
      - { name: drill_type, type: enum, source: input, description: "Simulated scenario", constraints: "DECISION_TO_INCISION | HEMORRHAGE_STAGE_2 | ECLAMPSIA" }
      - { name: scheduled_for_utc, type: datetime, source: input, description: "Planned drill start; must be >= clock_now at creation" }
      - { name: participant_staff_ids, type: array, source: input, description: "Array of StaffMember.id credited on validation; must contain at least one staff_role == OB_ATTENDING and one ANESTHESIOLOGIST" }
      - { name: decision_at, type: datetime, source: system, description: "Simulated decision instant supplied by the document call" }
      - { name: incision_at, type: datetime, source: system, description: "Simulated incision instant supplied by the document call; must be > decision_at" }
      - { name: measured_d2i_minutes, type: integer, source: computed, description: "floor((incision_at - decision_at) / 60 seconds); null until documented" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED -> IN_PROGRESS -> DOCUMENTED -> VALIDATED, with VALIDATED -> INVALIDATED -> DOCUMENTED re-documentation loop and ABANDONED exit", constraints: "SCHEDULED | IN_PROGRESS | DOCUMENTED | VALIDATED | INVALIDATED | ABANDONED" }
      - { name: validated_at, type: datetime, source: system, description: "Logical-clock instant of validation; null unless the drill has been validated at least once" }
      - { name: validated_by_user_id, type: string, source: system, description: "StaffMember.id of the acting PerinatalSafetyOfficer, copied from X-User-ID at validation (audit stamp, deliberately not a navigable FK); must differ from documented_by_staff_id" }
      - { name: documented_by_staff_id, type: string, source: input, description: "FK -> StaffMember.id; the clinician who documented the timings, required by the document call" }
      - { name: expires_at, type: datetime, source: computed, description: "validated_at + DRILL_CURRENCY_DAYS; null unless status == VALIDATED" }
      - { name: invalidation_reason, type: string, source: input, description: "Justification required by the invalidate call", constraints: "10..500 chars when present" }
      - { name: revision_count, type: integer, source: computed, default: 0, description: "Number of times this drill has re-entered DOCUMENTED from INVALIDATED; >= DRILL_REVISION_LIMIT blocks further re-documentation" }

  - name: NewbornComplicationReview
    parent: LaborEncounter
    common_fields: true
    fields:
      - { name: encounter_id, type: string, source: system, description: "FK -> LaborEncounter.id; set from the request body, immutable" }
      - { name: complication_code, type: enum, source: input, description: "Unexpected newborn outcome under review", constraints: "UNEXPECTED_NICU_TERM | HIE_SUSPECTED | APGAR5_UNDER_7 | BIRTH_INJURY | UNEXPECTED_TRANSFER" }
      - { name: facilitator_staff_id, type: string, source: input, description: "FK -> StaffMember.id; debrief facilitator, must never have held a CareAssignment on this encounter (segregation of duties)" }
      - { name: opened_at, type: datetime, source: system, description: "Logical-clock instant of review creation; anchor of the debrief scheduling deadline" }
      - { name: debrief_due_at, type: datetime, source: computed, description: "opened_at + DEBRIEF_DUE_HOURS; a schedule call whose debrief_scheduled_for_utc exceeds this is rejected" }
      - { name: debrief_scheduled_for_utc, type: datetime, source: input, description: "Planned debrief instant; null until scheduled" }
      - { name: debrief_held_at, type: datetime, source: system, description: "Logical-clock instant of findings submission; null until submitted" }
      - { name: findings_summary, type: string, source: input, description: "Narrative supplied by submit-findings", constraints: "40..2000 chars when present" }
      - { name: contributing_factor_codes, type: array, source: input, description: "Array of factor enum values (STAFFING_RATIO | MONITORING_INTERPRETATION | BUNDLE_DELAY | COMMUNICATION | EQUIPMENT); must be non-empty on submit" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN -> DEBRIEF_SCHEDULED -> FINDINGS_SUBMITTED -> CLOSED, with FINDINGS_SUBMITTED -> REWORK_REQUESTED -> DEBRIEF_SCHEDULED rework loop", constraints: "OPEN | DEBRIEF_SCHEDULED | FINDINGS_SUBMITTED | REWORK_REQUESTED | CLOSED" }
      - { name: rework_count, type: integer, source: computed, default: 0, description: "Number of completed rework loops; >= REWORK_LIMIT blocks further rework requests" }
      - { name: closed_by_user_id, type: string, source: system, description: "StaffMember.id of the acting PerinatalSafetyOfficer, copied from X-User-ID at closure (audit stamp, deliberately not a navigable FK); null until CLOSED" }

  - name: SupportPersonPass
    parent: LaborEncounter
    common_fields: true
    fields:
      - { name: encounter_id, type: string, source: system, description: "FK -> LaborEncounter.id; set from the creation path, immutable" }
      - { name: person_name, type: string, source: input, description: "Support person display name", constraints: "1..120 chars" }
      - { name: credential_type, type: enum, source: input, description: "Visitation class; DOULA_CERTIFIED passes are exempt from the base support-person cap per calc support_person_occupancy", constraints: "PARTNER | DOULA_CERTIFIED | STUDENT_OBSERVER | INTERPRETER" }
      - { name: doula_certification_expires_at, type: datetime, source: input, description: "Required when credential_type == DOULA_CERTIFIED; must be > clock_now at issuance and at every check-in" }
      - { name: or_credentialed, type: boolean, source: input, default: false, description: "Cleared to remain present during an EmergencyCesareanEvent in TEAM_MOBILIZED or INCISION_RECORDED" }
      - { name: status, type: enum, source: system, default: "ISSUED", description: "ISSUED -> CHECKED_IN -> CHECKED_OUT with re-entry back to CHECKED_IN, plus REVOKED and EXPIRED exits", constraints: "ISSUED | CHECKED_IN | CHECKED_OUT | REVOKED | EXPIRED" }
      - { name: checked_in_at, type: datetime, source: system, description: "Logical-clock instant of the most recent check-in; null while ISSUED" }
      - { name: checked_out_at, type: datetime, source: system, description: "Logical-clock instant of the most recent check-out; null unless status == CHECKED_OUT" }
      - { name: valid_until, type: datetime, source: computed, description: "Issuance instant + PASS_VALID_HOURS; a sweep past this instant expires the pass" }
      - { name: reentry_count, type: integer, source: computed, default: 0, description: "Number of CHECKED_OUT -> CHECKED_IN re-entries; >= REENTRY_LIMIT blocks further re-entry" }

  - name: QualityMeasureSnapshot
    parent: ObstetricUnit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> ObstetricUnit.id; set from the creation path, immutable" }
      - { name: period_start_utc, type: datetime, source: input, description: "Reporting window start, INCLUSIVE (half-open [start, end) attribution)" }
      - { name: period_end_utc, type: datetime, source: input, description: "Reporting window end, EXCLUSIVE; must be > period_start_utc" }
      - { name: attribution_basis, type: enum, source: system, default: "DELIVERY_COHORT", description: "Authoritative cohort basis; always DELIVERY_COHORT, with ADMISSION_COHORT computed only as the shadow figure", constraints: "DELIVERY_COHORT" }
      - { name: ntsv_cesarean_numerator, type: integer, source: computed, description: "Count of delivery-cohort encounters with is_ntsv == true and delivery_mode == CESAREAN_PRIMARY" }
      - { name: ntsv_cesarean_denominator, type: integer, source: computed, description: "Count of delivery-cohort encounters with is_ntsv == true and delivery_mode != null" }
      - { name: ntsv_cesarean_rate_pct, type: number, source: computed, description: "100 * numerator / denominator rounded to 4 decimals (round_half_up); null when the denominator is 0" }
      - { name: episiotomy_numerator, type: integer, source: computed, description: "Count of delivery-cohort encounters with episiotomy_performed == true and delivery_mode IN {SPONTANEOUS_VAGINAL, OPERATIVE_VAGINAL}" }
      - { name: episiotomy_denominator, type: integer, source: computed, description: "Count of delivery-cohort encounters with delivery_mode IN {SPONTANEOUS_VAGINAL, OPERATIVE_VAGINAL}" }
      - { name: episiotomy_rate_pct, type: number, source: computed, description: "100 * numerator / denominator rounded to 4 decimals (round_half_up); null when the denominator is 0" }
      - { name: shadow_ntsv_rate_pct, type: number, source: computed, description: "Same NTSV formula over the ADMISSION_COHORT variant of calc quality_measure_rates; advisory trending figure, never submitted; null when that denominator is 0" }
      - { name: composite_quality_index, type: number, source: computed, description: "Average of the two already-4dp-rounded authoritative rates, then rounded to 2 decimals (round_half_up); null when either rate is null" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT -> CERTIFIED, or DRAFT/CERTIFIED -> SUPERSEDED when a newer snapshot for the same window is created", constraints: "DRAFT | CERTIFIED | SUPERSEDED" }
      - { name: certified_at, type: datetime, source: system, description: "Logical-clock instant of certification; null unless status == CERTIFIED" }
      - { name: certified_by_user_id, type: string, source: system, description: "StaffMember.id of the acting PerinatalSafetyOfficer, copied from X-User-ID at certification (audit stamp, deliberately not a navigable FK); null unless status == CERTIFIED" }
      - { name: superseded_by_snapshot_id, type: string, source: computed, description: "FK -> QualityMeasureSnapshot.id; self-referential pointer written on the predecessor when a newer snapshot supersedes it, null otherwise" }

# =============================================================================
# §1.2 State Machine Table
# 11 machines. LaborEncounter carries two independent axes (labor_phase and
# staffing_state) declared as two entries distinguished by `state_field:`.
# All logical-clock reads are "clock_now" = the value last set by
# POST /_clock/set_current_utc, default 2026-08-01T00:00:00Z.
# =============================================================================
state_machines:
  - entity: LaborEncounter
    state_field: labor_phase
    shape: linear_with_guarded_branch
    initial_state: ANTEPARTUM
    terminal_states: [DISCHARGED, TRANSFERRED_OUT]
    note: "Axis 1 of 2 on LaborEncounter. Every forward step is gated by the OTHER axis (staffing_state) and by sibling entities (CareAssignment, FetalMonitoringAssessment, SafetyBundleActivation, EmergencyCesareanEvent, NewbornComplicationReview, SupportPersonPass)."
    transitions:
      - from: ANTEPARTUM
        to: LATENT
        trigger: "POST /labor-encounters/{encounterId}/advance-phase with target_phase=LATENT"
        actor: ChargeNurse
        preconditions:
          - "encounter.staffing_state IN {RATIO_COVERED, ONE_TO_ONE_COVERED} (ERR_ENCOUNTER_COVERAGE_INSUFFICIENT)"
          - "encounter.bed_id is non-null and that Bed.status == OCCUPIED and Bed.bed_type == LDR (ERR_ENCOUNTER_BED_NOT_ASSIGNED)"
          - "unit.staffing_posture != DIVERT (ERR_UNIT_POSTURE_BLOCKS_OPERATION)"
        side_effects:
          - "Recompute calc encounter_required_coverage_units -> encounter.acuity_tier, encounter.one_to_one_required, encounter.required_coverage_units"
          - "Recompute calc unit_posture_derivation -> unit.coverage_deficit_units, unit.staffing_posture; increments unit.version"

      - from: LATENT
        to: ACTIVE_FIRST_STAGE
        trigger: "POST /labor-encounters/{encounterId}/advance-phase with target_phase=ACTIVE_FIRST_STAGE"
        actor: ChargeNurse
        preconditions:
          - "encounter.staffing_state IN {RATIO_COVERED, ONE_TO_ONE_COVERED} (ERR_ENCOUNTER_COVERAGE_INSUFFICIENT)"
          - "The latest FetalMonitoringAssessment on this encounter (max assessed_at, tie-break created_at DESC) exists and clock_now - assessed_at <= FETAL_ASSESSMENT_WINDOW_MINUTES (30), inclusive (ERR_FETAL_ASSESSMENT_STALE)"
          - "That latest assessment has escalation_status NOT IN {ESCALATION_DUE, TIER_1_NOTIFIED, TIER_2_NOTIFIED, TIER_3_ACTIVATED, TIMED_OUT_BREACH} (ERR_FETAL_ESCALATION_UNRESOLVED)"
        side_effects:
          - "Recompute calc encounter_required_coverage_units (acuity_tier floor rises to TIER_II)"
          - "Recompute calc unit_posture_derivation; increments unit.version"

      - from: ACTIVE_FIRST_STAGE
        to: SECOND_STAGE
        trigger: "POST /labor-encounters/{encounterId}/advance-phase with target_phase=SECOND_STAGE"
        actor: ChargeNurse
        preconditions:
          - "encounter.staffing_state == ONE_TO_ONE_COVERED (ERR_ONE_TO_ONE_COVERAGE_REQUIRED)"
          - "The latest FetalMonitoringAssessment exists and clock_now - assessed_at <= SECOND_STAGE_ASSESSMENT_WINDOW_MINUTES (15), inclusive (ERR_FETAL_ASSESSMENT_STALE)"
          - "That assessment.category IN {CATEGORY_I, CATEGORY_II}, OR category == CATEGORY_III together with an EmergencyCesareanEvent on this encounter in status IN {DECISION_DECLARED, TEAM_MOBILIZED} (ERR_FETAL_CATEGORY_BLOCKS_PHASE)"
          - "unit.cesarean_readiness_state != NOT_READY (ERR_CESAREAN_READINESS_NOT_MET)"
        side_effects:
          - "encounter.one_to_one_required := true and acuity_tier floor rises to TIER_III (calc encounter_required_coverage_units)"
          - "CASCADE hop 2 — the covering CareAssignment is re-priced by calc care_assignment_unit_debit; the covering ShiftAssignment.assigned_acuity_load_units is recomputed"
          - "CASCADE hop 3 — if that recompute pushes assigned_acuity_load_units > capacity_units_effective, every OTHER LaborEncounter covered by the same ShiftAssignment transitions staffing_state RATIO_COVERED -> COVERAGE_BREACH, oldest first by CareAssignment.created_at ASC, until the load is back within capacity"
          - "CASCADE hop 4 — each such breach re-runs calc unit_posture_derivation, raising unit.coverage_deficit_units and possibly unit.staffing_posture to INDUCTION_FROZEN"
          - "CASCADE hop 5 — on entering INDUCTION_FROZEN every InductionBooking with status == CAPACITY_HELD transitions to BUMPED (bump_count += 1) and releases its held bed (Bed.status HELD -> AVAILABLE, held_booking_id := null), decrementing unit.held_bed_minutes_by_day by exactly projected_occupancy_minutes per invariant induction_bed_minute_conservation"
          - "increments encounter.version and unit.version"

      - from: SECOND_STAGE
        to: THIRD_STAGE_DELIVERED
        trigger: "POST /labor-encounters/{encounterId}/advance-phase with target_phase=THIRD_STAGE_DELIVERED, delivery_mode and episiotomy_performed"
        actor: ObstetricianAttending
        preconditions:
          - "delivery_mode is supplied (ERR_DELIVERY_MODE_REQUIRED)"
          - "If delivery_mode IN {CESAREAN_PRIMARY, CESAREAN_REPEAT}: an EmergencyCesareanEvent on this encounter has status IN {DELIVERED, REVIEW_PENDING, CLOSED} (ERR_CESAREAN_EVENT_NOT_DELIVERED)"
          - "If encounter.prior_cesarean == true: delivery_mode != CESAREAN_PRIMARY (ERR_DELIVERY_MODE_CONFLICTS_HISTORY)"
          - "If episiotomy_performed == true: delivery_mode IN {SPONTANEOUS_VAGINAL, OPERATIVE_VAGINAL} (ERR_EPISIOTOMY_MODE_CONFLICT)"
        side_effects:
          - "encounter.delivery_mode := payload value; encounter.delivery_recorded_at := clock_now"
          - "Every QualityMeasureSnapshot on this unit with status == DRAFT whose [period_start_utc, period_end_utc) contains delivery_recorded_at is recomputed in place by calc quality_measure_rates (numerators, denominators, both rates, shadow rate, composite index); snapshots with status IN {CERTIFIED, SUPERSEDED} are never retro-mutated"
          - "increments encounter.version and each recomputed snapshot.version"

      - from: THIRD_STAGE_DELIVERED
        to: POSTPARTUM_RECOVERY
        trigger: "POST /labor-encounters/{encounterId}/advance-phase with target_phase=POSTPARTUM_RECOVERY"
        actor: ChargeNurse
        preconditions:
          - "Every FetalMonitoringAssessment on this encounter has escalation_status IN {NOT_REQUIRED, RESOLVED, TIMED_OUT_BREACH} (ERR_FETAL_ESCALATION_UNRESOLVED)"
          - "No EmergencyCesareanEvent on this encounter has status IN {DECISION_DECLARED, TEAM_MOBILIZED, INCISION_RECORDED} (ERR_CESAREAN_EVENT_IN_PROGRESS)"
        side_effects:
          - "The occupied LDR Bed transitions OCCUPIED -> TURNOVER with turnover_clear_at := clock_now + unit.turnover_buffer_minutes; encounter.bed_id := null"
          - "CASCADE hop 2 — the freed LDR bed changes the unit's available-bed count, re-running calc unit_posture_derivation (a DIVERT posture caused solely by bed exhaustion relaxes to the deficit-derived tier)"
          - "encounter.one_to_one_required is re-derived (drops to false unless a bundle or magnesium trigger still holds); calc encounter_required_coverage_units re-run"
          - "increments encounter.version, bed.version, unit.version"

      - from: POSTPARTUM_RECOVERY
        to: DISCHARGED
        trigger: "POST /labor-encounters/{encounterId}/discharge"
        actor: ChargeNurse
        preconditions:
          - "encounter.review_required == false, i.e. every NewbornComplicationReview on this encounter has status == CLOSED (ERR_NEWBORN_REVIEW_OPEN)"
          - "Every SafetyBundleActivation on this encounter has status IN {CLOSED, RESCINDED} (ERR_BUNDLE_NOT_CLOSED)"
          - "Every SupportPersonPass on this encounter has status IN {CHECKED_OUT, REVOKED, EXPIRED} (ERR_SUPPORT_PASS_STILL_PRESENT)"
          - "encounter.staffing_state == RELEASED (ERR_CARE_ASSIGNMENT_STILL_ACTIVE)"
        side_effects:
          - "If encounter.bed_id is non-null the Bed transitions OCCUPIED -> TURNOVER with turnover_clear_at := clock_now + unit.turnover_buffer_minutes"
          - "Recompute calc unit_posture_derivation. A posture improvement does NOT promote waiting bookings here: promotion happens only inside POST /obstetric-units/{unitId}/capacity-sweep"
          - "increments encounter.version and unit.version"

      - from: ANTEPARTUM | LATENT | ACTIVE_FIRST_STAGE
        to: TRANSFERRED_OUT
        trigger: "POST /labor-encounters/{encounterId}/transfer-out"
        actor: ObstetricianAttending
        preconditions:
          - "No EmergencyCesareanEvent on this encounter has status IN {TEAM_MOBILIZED, INCISION_RECORDED} (ERR_CESAREAN_EVENT_IN_PROGRESS)"
          - "No SafetyBundleActivation on this encounter has status IN {STAGE_2_ESCALATED, STAGE_3_MASSIVE_TRANSFUSION} (ERR_BUNDLE_STAGE_BLOCKS_TRANSFER)"
        side_effects:
          - "COMPENSATION — every CareAssignment on this encounter with status == ACTIVE transitions to RELEASED (released_at := clock_now) and credits back exactly acuity_units_consumed to its ShiftAssignment.assigned_acuity_load_units, satisfying invariant acuity_load_conservation; encounter.staffing_state := RELEASED"
          - "Every SafetyBundleActivation on this encounter with status IN {ACTIVATED, STAGE_1_IN_PROGRESS} transitions to RESCINDED (rescind_reason := 'TRANSFER_OUT') and each of its PENDING BundleChecklistItem rows transitions to NOT_APPLICABLE"
          - "Every FetalMonitoringAssessment with escalation_status == TIMED_OUT_BREACH decrements unit.escalation_breach_count by 1 (the breach follows the patient), and every non-terminal escalation_status becomes RESOLVED"
          - "Every SupportPersonPass with status IN {ISSUED, CHECKED_IN, CHECKED_OUT} transitions to REVOKED"
          - "The occupied Bed transitions OCCUPIED -> TURNOVER; recompute calc unit_posture_derivation; increments encounter.version, bed.version, unit.version"

  - entity: LaborEncounter
    state_field: staffing_state
    shape: parallel_dimension_with_cycle
    initial_state: UNASSIGNED
    terminal_states: [RELEASED]
    note: "Axis 2 of 2 on LaborEncounter, evolving independently of labor_phase: coverage can breach and recover any number of times inside a single labor_phase, and labor_phase can stand still while this axis cycles. Each axis appears in the other's preconditions."
    transitions:
      - from: UNASSIGNED
        to: RATIO_COVERED
        trigger: "POST /care-assignments with coverage_mode=RATIO_SHARED"
        actor: ChargeNurse
        preconditions:
          - "encounter.one_to_one_required == false (ERR_ONE_TO_ONE_COVERAGE_REQUIRED)"
          - "The referenced ShiftAssignment.status == ACTIVE and its interval covers clock_now, i.e. shift_start_utc <= clock_now < shift_end_utc (ERR_SHIFT_NOT_ACTIVE)"
          - "StaffMember.employment_status == ACTIVE and credential_expires_at > clock_now (ERR_STAFF_CREDENTIAL_EXPIRED)"
          - "shift.assigned_acuity_load_units + calc care_assignment_unit_debit <= shift.capacity_units_effective (ERR_STAFF_ACUITY_CAPACITY_EXCEEDED)"
          - "expected_encounter_version matches encounter.version (ERR_STALE_ENCOUNTER_VERSION, per concurrency rule care-assignment-create-stale-encounter)"
        side_effects:
          - "CareAssignment created with status ACTIVE and acuity_units_consumed from calc care_assignment_unit_debit"
          - "shift.assigned_acuity_load_units += acuity_units_consumed; encounter.assigned_coverage_units recomputed"
          - "If assigned_coverage_units >= required_coverage_units the encounter enters RATIO_COVERED; otherwise it remains UNASSIGNED and the request still succeeds (partial coverage is legal below the ratio floor)"
          - "Recompute calc unit_posture_derivation; increments encounter.version and unit.version"

      - from: UNASSIGNED | RATIO_COVERED | COVERAGE_BREACH
        to: ONE_TO_ONE_COVERED
        trigger: "POST /care-assignments with coverage_mode=ONE_TO_ONE"
        actor: ChargeNurse
        preconditions:
          - "The referenced ShiftAssignment.role_slot IN {BEDSIDE, ONE_TO_ONE_FLOAT} (ERR_ROLE_SLOT_NOT_ELIGIBLE)"
          - "The staff member holds no other CareAssignment with status == ACTIVE on a different encounter (ERR_STAFF_NOT_EXCLUSIVELY_AVAILABLE)"
          - "StaffMember.fetal_monitoring_cert_level IN {BASIC, ADVANCED} and, when encounter.acuity_tier == TIER_IV, == ADVANCED (ERR_MONITORING_CERT_INSUFFICIENT)"
          - "StaffMember.employment_status == ACTIVE and credential_expires_at > clock_now (ERR_STAFF_CREDENTIAL_EXPIRED)"
          - "expected_encounter_version matches encounter.version (ERR_STALE_ENCOUNTER_VERSION)"
        side_effects:
          - "SUPERSEDE HANDOFF — any CareAssignment on this encounter with status == ACTIVE and coverage_mode == ONE_TO_ONE transitions to SUPERSEDED (released_at := clock_now, superseded_by_assignment_id := new assignment id) and credits back exactly acuity_units_consumed to its ShiftAssignment, satisfying invariant acuity_load_conservation"
          - "Any CareAssignment on this encounter with status == ACTIVE and coverage_mode == RATIO_SHARED transitions to RELEASED with the same credit-back"
          - "New assignment debits the full calc staff_capacity_units of the new shift (ONE_TO_ONE consumes whole capacity)"
          - "Recompute calc unit_posture_derivation; increments encounter.version and unit.version"

      - from: RATIO_COVERED | ONE_TO_ONE_COVERED
        to: COVERAGE_BREACH
        trigger: "system, evaluated at the end of POST /labor-encounters/{encounterId}/advance-phase, POST /bundle-activations, POST /care-assignments/{assignmentId}/release, POST /shift-assignments/{shiftId}/relieve, POST /shift-assignments/{shiftId}/cancel, and POST /obstetric-units/{unitId}/capacity-sweep"
        actor: system
        preconditions:
          - "encounter.assigned_coverage_units < encounter.required_coverage_units, OR the covering ShiftAssignment.assigned_acuity_load_units > capacity_units_effective, OR (encounter.one_to_one_required == true AND no ACTIVE CareAssignment on this encounter has coverage_mode == ONE_TO_ONE)"
        side_effects:
          - "unit.coverage_deficit_units += max(0, required_coverage_units - assigned_coverage_units) via calc unit_posture_derivation"
          - "unit.staffing_posture is re-derived; entering INDUCTION_FROZEN or DIVERT bumps CAPACITY_HELD bookings (see LaborEncounter.labor_phase ACTIVE_FIRST_STAGE -> SECOND_STAGE cascade hop 5)"
          - "increments encounter.version and unit.version"
        note: "Cycle edge: an encounter may re-enter COVERAGE_BREACH after recovering, without bound."

      - from: COVERAGE_BREACH
        to: RATIO_COVERED | ONE_TO_ONE_COVERED
        trigger: "POST /care-assignments (remediating assignment)"
        actor: ChargeNurse
        preconditions:
          - "After the new debit, encounter.assigned_coverage_units >= encounter.required_coverage_units. This is an EDGE CONDITION, not a validation: when the remediating debit leaves the encounter still short, the request SUCCEEDS (201) and staffing_state remains COVERAGE_BREACH — no error is raised"
          - "If encounter.one_to_one_required == true the new assignment's coverage_mode == ONE_TO_ONE (ERR_ONE_TO_ONE_COVERAGE_REQUIRED)"
        side_effects:
          - "Target state is ONE_TO_ONE_COVERED when one_to_one_required == true, else RATIO_COVERED"
          - "unit.coverage_deficit_units decreases by exactly the deficit this encounter contributed; calc unit_posture_derivation re-run; posture may relax but bumped bookings are NOT auto-restored (they wait in REQUESTED for the next sweep)"
          - "increments encounter.version and unit.version"

      - from: UNASSIGNED | RATIO_COVERED | ONE_TO_ONE_COVERED | COVERAGE_BREACH
        to: RELEASED
        trigger: "POST /labor-encounters/{encounterId}/discharge, POST /labor-encounters/{encounterId}/transfer-out, or POST /care-assignments/{assignmentId}/release releasing the last ACTIVE assignment while labor_phase IN {POSTPARTUM_RECOVERY, DISCHARGED, TRANSFERRED_OUT}"
        actor: ChargeNurse
        preconditions:
          - "No CareAssignment on this encounter remains with status == ACTIVE after this call (ERR_CARE_ASSIGNMENT_STILL_ACTIVE)"
          - "labor_phase IN {POSTPARTUM_RECOVERY, DISCHARGED, TRANSFERRED_OUT} — releasing the last assignment in an earlier phase drives COVERAGE_BREACH instead (ERR_ENCOUNTER_COVERAGE_INSUFFICIENT is NOT raised; the breach is recorded)"
        side_effects:
          - "encounter.required_coverage_units := 0; unit.coverage_deficit_units loses this encounter's contribution; calc unit_posture_derivation re-run"
          - "increments encounter.version and unit.version"

  - entity: ShiftAssignment
    state_field: status
    shape: linear_with_cancel
    initial_state: SCHEDULED
    terminal_states: [RELIEVED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /shift-assignments/{shiftId}/activate"
        actor: ChargeNurse
        preconditions:
          - "shift_start_utc <= clock_now < shift_end_utc (ERR_SHIFT_WINDOW_NOT_CURRENT)"
          - "StaffMember.employment_status == ACTIVE and credential_expires_at > clock_now (ERR_STAFF_CREDENTIAL_EXPIRED)"
          - "If role_slot == OR_STANDBY: StaffMember.or_circulating_qualified == true and drill_currency_state == CURRENT (ERR_OR_STANDBY_NOT_QUALIFIED)"
        side_effects:
          - "capacity_units_effective := snapshot of calc staff_capacity_units for this role_slot"
          - "Recompute calc cesarean_readiness_derivation (an activating OR_STANDBY shift can lift unit.cesarean_readiness_state) and calc unit_posture_derivation; increments unit.version"

      - from: ACTIVE
        to: RELIEVED
        trigger: "POST /shift-assignments/{shiftId}/relieve with relieved_by_shift_id"
        actor: ChargeNurse
        preconditions:
          - "The relieving ShiftAssignment exists, has status == ACTIVE, the same unit_id, role_slot equal to this shift's role_slot, and a different staff_id (ERR_RELIEVING_SHIFT_INELIGIBLE)"
          - "The relieving shift has spare capacity for every ACTIVE CareAssignment being moved: relieving.assigned_acuity_load_units + sum(moved acuity_units_consumed) <= relieving.capacity_units_effective (ERR_STAFF_ACUITY_CAPACITY_EXCEEDED)"
        side_effects:
          - "Every ACTIVE CareAssignment on this shift is re-pointed to the relieving shift: the old shift is credited back exactly acuity_units_consumed and the relieving shift is debited the same amount, so invariant acuity_load_conservation holds across the handoff"
          - "Encounters whose ONE_TO_ONE staff changed keep staffing_state ONE_TO_ONE_COVERED; encounters left short transition to COVERAGE_BREACH (see the staffing_state machine)"
          - "Recompute calc unit_posture_derivation; increments unit.version"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /shift-assignments/{shiftId}/cancel"
        actor: ChargeNurse
        preconditions:
          - "No CareAssignment references this shift with status == ACTIVE (ERR_SHIFT_HAS_ACTIVE_COVERAGE)"
        side_effects:
          - "Recompute calc cesarean_readiness_derivation and calc unit_posture_derivation; increments unit.version"

  - entity: Bed
    state_field: status
    shape: cyclic_occupancy
    initial_state: AVAILABLE
    terminal_states: [CLOSED]
    note: "Occupancy cycle AVAILABLE -> HELD -> OCCUPIED -> TURNOVER -> AVAILABLE, traversable without bound. TURNOVER is cleared only by the sweep, which is what makes the turnover buffer observable in induction interval arithmetic."
    transitions:
      - from: AVAILABLE
        to: HELD
        trigger: "POST /induction-bookings/{bookingId}/hold-capacity"
        actor: PatientAccessCoordinator
        preconditions:
          - "bed_type == LDR (ERR_BED_TYPE_NOT_ELIGIBLE)"
          - "No InductionBooking with status IN {CAPACITY_HELD, CONFIRMED, ADMITTED} on this bed has an interval that collides with the requested interval under the closed-interval-plus-buffer rule (ERR_BED_TURNOVER_CONFLICT)"
        side_effects: ["held_booking_id := booking.id; unit.held_bed_minutes_by_day[date(requested_start_utc)] += booking.projected_occupancy_minutes; increments bed.version and unit.version"]

      - from: HELD
        to: AVAILABLE
        trigger: "POST /induction-bookings/{bookingId}/bump, POST /induction-bookings/{bookingId}/cancel, or hold expiry inside POST /obstetric-units/{unitId}/capacity-sweep"
        actor: system
        preconditions: ["The releasing booking is the one named by held_booking_id (ERR_BED_HOLD_MISMATCH)"]
        side_effects: ["held_booking_id := null; unit.held_bed_minutes_by_day[date] -= exactly the same projected_occupancy_minutes that was added (invariant induction_bed_minute_conservation); increments bed.version and unit.version"]

      - from: HELD
        to: OCCUPIED
        trigger: "POST /induction-bookings/{bookingId}/admit"
        actor: ChargeNurse
        preconditions: ["clock_now >= booking.requested_start_utc - ADMIT_EARLY_GRACE_MINUTES (30), inclusive (ERR_INDUCTION_ADMIT_TOO_EARLY)"]
        side_effects: ["current_encounter_id := the minted LaborEncounter.id; held_booking_id := null; unit.held_bed_minutes_by_day[date] -= projected_occupancy_minutes and unit.committed_bed_minutes_by_day[date] += the same amount (net-zero move, invariant induction_bed_minute_conservation)"]

      - from: AVAILABLE
        to: OCCUPIED
        trigger: "POST /labor-encounters/{encounterId}/assign-bed (walk-in admission) or POST /emergency-cesareans/{eventId}/mobilize-team (OR bed)"
        actor: ChargeNurse
        preconditions:
          - "bed_type == LDR for assign-bed and bed_type == OR for mobilize-team (ERR_BED_TYPE_NOT_ELIGIBLE)"
          - "The encounter has no other bed with status == OCCUPIED pointing at it (ERR_ENCOUNTER_ALREADY_IN_BED)"
        side_effects: ["current_encounter_id := encounter.id; recompute calc unit_posture_derivation (bed exhaustion can raise DIVERT); increments bed.version and unit.version"]

      - from: OCCUPIED
        to: TURNOVER
        trigger: "POST /labor-encounters/{encounterId}/advance-phase to POSTPARTUM_RECOVERY, POST /labor-encounters/{encounterId}/discharge, POST /labor-encounters/{encounterId}/transfer-out, POST /emergency-cesareans/{eventId}/record-delivery, or POST /emergency-cesareans/{eventId}/abort-to-vaginal"
        actor: system
        preconditions: []
        side_effects: ["turnover_clear_at := clock_now + unit.turnover_buffer_minutes; current_encounter_id := null; increments bed.version"]

      - from: TURNOVER
        to: AVAILABLE
        trigger: "POST /obstetric-units/{unitId}/capacity-sweep"
        actor: system
        preconditions: ["clock_now >= turnover_clear_at — the boundary instant itself clears the bed (ERR not applicable; beds not yet due are skipped)"]
        side_effects: ["turnover_clear_at := null; recompute calc unit_posture_derivation; increments bed.version and unit.version"]

      - from: AVAILABLE | BLOCKED
        to: BLOCKED | AVAILABLE
        trigger: "PATCH /beds/{bedId} with status"
        actor: ChargeNurse
        preconditions: ["Current status IN {AVAILABLE, BLOCKED} — a bed in HELD, OCCUPIED or TURNOVER cannot be blocked (ERR_BED_NOT_RELEASABLE)"]
        side_effects: ["Recompute calc unit_posture_derivation; increments bed.version and unit.version"]

      - from: AVAILABLE | BLOCKED
        to: CLOSED
        trigger: "DELETE /beds/{bedId}"
        actor: PerinatalSafetyOfficer
        preconditions: ["No InductionBooking with status IN {CAPACITY_HELD, CONFIRMED} references this bed (ERR_BED_HAS_FUTURE_HOLDS)"]
        side_effects: ["Recompute calc unit_posture_derivation; increments bed.version and unit.version"]

  - entity: InductionBooking
    state_field: status
    shape: cyclic
    initial_state: REQUESTED
    terminal_states: [ADMITTED, CANCELLED, EXPIRED]
    note: "Cyclic: CONFIRMED -> BUMPED -> REQUESTED -> CAPACITY_HELD -> CONFIRMED can repeat until bump_count reaches BUMP_ESCALATION_LIMIT, after which the booking ranks as MEDICALLY_INDICATED and can no longer be bumped."
    transitions:
      - from: REQUESTED
        to: CAPACITY_HELD
        trigger: "POST /induction-bookings/{bookingId}/hold-capacity with bed_id and expected_unit_version"
        actor: PatientAccessCoordinator
        preconditions:
          - "unit.staffing_posture IN {OPEN, RATIO_STRAINED} (ERR_UNIT_POSTURE_BLOCKS_OPERATION)"
          - "If priority_class == PATIENT_REQUEST: unit.staffing_posture == OPEN (ERR_UNIT_POSTURE_BLOCKS_OPERATION)"
          - "Bed interval free under the closed-interval-plus-buffer rule (ERR_BED_TURNOVER_CONFLICT)"
          - "committed + held + this booking's projected_occupancy_minutes <= unit.max_daily_induction_bed_minutes for date(requested_start_utc) (ERR_INDUCTION_CAPACITY_EXCEEDED)"
          - "expected_unit_version matches unit.version (ERR_STALE_UNIT_VERSION, per concurrency rule induction-hold-stale-unit)"
        side_effects:
          - "projected_occupancy_minutes := calc induction_capacity_projection snapshot (expected_labor_minutes + unit.turnover_buffer_minutes at hold time, frozen for the life of the hold)"
          - "hold_expires_at := clock_now + HOLD_TTL_MINUTES (120); Bed AVAILABLE -> HELD; unit.held_bed_minutes_by_day[date] += projected_occupancy_minutes"
          - "increments booking.version, bed.version and unit.version"

      - from: CAPACITY_HELD
        to: CONFIRMED
        trigger: "POST /induction-bookings/{bookingId}/confirm"
        actor: ObstetricianAttending
        preconditions:
          - "clock_now < hold_expires_at (ERR_INDUCTION_HOLD_EXPIRED)"
          - "unit.cesarean_readiness_state IN {READY, DEGRADED} (ERR_CESAREAN_READINESS_NOT_MET)"
          - "If priority_class == ELECTIVE_39_WEEK: gestational_age_weeks >= 39 (ERR_ELECTIVE_INDUCTION_GESTATIONAL_AGE)"
          - "unit.staffing_posture IN {OPEN, RATIO_STRAINED} (ERR_UNIT_POSTURE_BLOCKS_OPERATION)"
          - "committed + this booking's projected_occupancy_minutes <= unit.max_daily_induction_bed_minutes for date(requested_start_utc) (ERR_INDUCTION_CAPACITY_EXCEEDED)"
        side_effects:
          - "unit.held_bed_minutes_by_day[date] -= projected_occupancy_minutes and unit.committed_bed_minutes_by_day[date] += the same amount; hold_expires_at := null; Bed stays HELD"
          - "increments booking.version and unit.version"

      - from: CONFIRMED
        to: ADMITTED
        trigger: "POST /induction-bookings/{bookingId}/admit"
        actor: ChargeNurse
        preconditions:
          - "clock_now >= requested_start_utc - ADMIT_EARLY_GRACE_MINUTES (30) (ERR_INDUCTION_ADMIT_TOO_EARLY)"
          - "unit.staffing_posture != DIVERT (ERR_UNIT_POSTURE_BLOCKS_OPERATION)"
          - "The held Bed.status == HELD and held_booking_id == this booking (ERR_BED_HOLD_MISMATCH)"
        side_effects:
          - "Mints a LaborEncounter (labor_phase ANTEPARTUM, staffing_state UNASSIGNED, source_booking_id := booking.id, admitted_at := clock_now, patient_record_code and gestational_age_weeks copied from the booking); Bed HELD -> OCCUPIED"
          - "Recompute calc encounter_required_coverage_units and calc unit_posture_derivation; increments booking.version, bed.version and unit.version"

      - from: CAPACITY_HELD | CONFIRMED
        to: BUMPED
        trigger: "POST /induction-bookings/{bookingId}/bump, or automatically inside POST /labor-encounters/{encounterId}/advance-phase, POST /bundle-activations, POST /cesarean-readiness-drills/{drillId}/invalidate and POST /obstetric-units/{unitId}/capacity-sweep when the unit posture or readiness degrades"
        actor: ChargeNurse | system
        preconditions:
          - "bump_count < BUMP_ESCALATION_LIMIT (2) (ERR_INDUCTION_BUMP_LIMIT_REACHED)"
          - "priority_class != MEDICALLY_INDICATED for the manual bump; the automatic bump only ever selects bookings whose priority_class IN {ELECTIVE_39_WEEK, PATIENT_REQUEST}, ordered priority_class DESC (PATIENT_REQUEST first), then requested_start_utc DESC, then created_at DESC (ERR_INDUCTION_NOT_BUMPABLE)"
        side_effects:
          - "bump_count += 1; Bed HELD -> AVAILABLE; the day's held_bed_minutes_by_day (if CAPACITY_HELD) or committed_bed_minutes_by_day (if CONFIRMED) decreases by exactly projected_occupancy_minutes, satisfying invariant induction_bed_minute_conservation"
          - "bed_id := null; hold_expires_at := null; increments booking.version, bed.version and unit.version"

      - from: BUMPED
        to: REQUESTED
        trigger: "POST /induction-bookings/{bookingId}/requeue, or automatically inside POST /obstetric-units/{unitId}/capacity-sweep"
        actor: PatientAccessCoordinator | system
        preconditions: ["requested_start_utc > clock_now, otherwise the booking goes to EXPIRED instead (ERR_INDUCTION_WINDOW_PASSED on the manual call)"]
        side_effects: ["priority_class re-derived by calc induction_priority_class (bump_count >= BUMP_ESCALATION_LIMIT promotes the booking to MEDICALLY_INDICATED rank); increments booking.version"]
        note: "Cycle edge closing REQUESTED -> CAPACITY_HELD -> CONFIRMED -> BUMPED -> REQUESTED."

      - from: CAPACITY_HELD
        to: EXPIRED
        trigger: "POST /obstetric-units/{unitId}/capacity-sweep"
        actor: system
        preconditions: ["clock_now >= hold_expires_at — the boundary instant itself expires the hold"]
        side_effects: ["Bed HELD -> AVAILABLE; unit.held_bed_minutes_by_day[date] -= projected_occupancy_minutes; increments booking.version, bed.version and unit.version"]

      - from: REQUESTED | CAPACITY_HELD | CONFIRMED
        to: CANCELLED
        trigger: "POST /induction-bookings/{bookingId}/cancel"
        actor: PatientAccessCoordinator
        preconditions: ["status != ADMITTED (ERR_INDUCTION_ALREADY_ADMITTED)"]
        side_effects: ["Any held Bed returns HELD -> AVAILABLE; the day's held or committed bed-minutes decrease by exactly projected_occupancy_minutes (invariant induction_bed_minute_conservation); increments booking.version, bed.version and unit.version"]

  - entity: SafetyBundleActivation
    state_field: status
    shape: branching_fork_join_with_compensation
    initial_state: ACTIVATED
    terminal_states: [CLOSED, RESCINDED]
    note: "Fork at STAGE_2_ESCALATED: the STAGE_3_MASSIVE_TRANSFUSION branch and the direct CONTROLLED branch carry different side-effect sets and rejoin at CONTROLLED. RESCINDED is the compensating exit and is reachable only before stage 2."
    transitions:
      - from: ACTIVATED
        to: STAGE_1_IN_PROGRESS
        trigger: "POST /bundle-activations/{activationId}/checklist-items/{itemId}/complete (first completion on the activation)"
        actor: BedsideNurse
        preconditions:
          - "The item's stage_gate == 1 (ERR_CHECKLIST_STAGE_NOT_REACHED)"
          - "encounter.labor_phase NOT IN {DISCHARGED, TRANSFERRED_OUT} (ERR_ENCOUNTER_PHASE_TERMINAL)"
        side_effects:
          - "highest_stage_reached := 1"
          - "encounter.acuity_tier floor rises to TIER_III and, for bundle_type == SEVERE_HYPERTENSION with step MAGNESIUM_LOADED completed, encounter.magnesium_infusion_active := true -> encounter.one_to_one_required := true (calc encounter_required_coverage_units)"
          - "CASCADE — the one-to-one flip re-prices the covering CareAssignment (calc care_assignment_unit_debit), which can push the covering ShiftAssignment over capacity, which drives sibling encounters to COVERAGE_BREACH, which raises unit.coverage_deficit_units and re-derives unit.staffing_posture (calc unit_posture_derivation)"
          - "increments activation.version, encounter.version and unit.version"

      - from: STAGE_1_IN_PROGRESS
        to: STAGE_2_ESCALATED
        trigger: "POST /bundle-activations/{activationId}/escalate-stage with target_stage=2"
        actor: ObstetricianAttending
        preconditions:
          - "For OBSTETRIC_HEMORRHAGE: quantitative_blood_loss_ml supplied on the call is >= STAGE_2_QBL_ML (1500) (ERR_BUNDLE_STAGE_CRITERIA_NOT_MET)"
          - "For SEVERE_HYPERTENSION: a second severe-range reading is supplied with systolic_mmhg >= 160 or diastolic_mmhg >= 110 (ERR_BUNDLE_STAGE_CRITERIA_NOT_MET)"
          - "Every BundleChecklistItem with stage_gate == 1 has status IN {COMPLETED, LATE_COMPLETED, MISSED} (ERR_CHECKLIST_STAGE_INCOMPLETE)"
        side_effects:
          - "highest_stage_reached := 2; the stage-2 template items become completable (stage_gate == 2)"
          - "encounter.acuity_tier := TIER_IV and encounter.one_to_one_required := true; ONE_TO_ONE coverage becomes mandatory (calc encounter_required_coverage_units)"
          - "unit.staffing_posture is re-derived: a unit already at RATIO_STRAINED with an active stage-2 bundle moves to INDUCTION_FROZEN (calc unit_posture_derivation), which bumps CAPACITY_HELD bookings"
          - "increments activation.version, encounter.version and unit.version"

      - from: STAGE_2_ESCALATED
        to: STAGE_3_MASSIVE_TRANSFUSION
        trigger: "POST /bundle-activations/{activationId}/escalate-stage with target_stage=3"
        actor: ObstetricianAttending
        preconditions:
          - "bundle_type == OBSTETRIC_HEMORRHAGE (ERR_BUNDLE_STAGE_CRITERIA_NOT_MET)"
          - "quantitative_blood_loss_ml supplied on the call is >= STAGE_3_QBL_ML (2500) (ERR_BUNDLE_STAGE_CRITERIA_NOT_MET)"
          - "An ACTIVE ShiftAssignment with role_slot == OR_STANDBY exists on the unit (ERR_OR_STANDBY_NOT_STAFFED)"
        side_effects:
          - "BRANCH A side-effects — highest_stage_reached := 3; the MTP_ACTIVATED item (stage_gate 3) becomes completable"
          - "An EmergencyCesareanEvent is minted on the encounter in status DECISION_DECLARED with urgency_class CATEGORY_1_CRASH, decision_at := clock_now and triggering_activation_id := activation.id"
          - "unit.staffing_posture := DIVERT (calc unit_posture_derivation), which bumps every CAPACITY_HELD and CONFIRMED booking with priority_class IN {ELECTIVE_39_WEEK, PATIENT_REQUEST} and releases their beds"
          - "increments activation.version, encounter.version and unit.version"

      - from: STAGE_2_ESCALATED
        to: CONTROLLED
        trigger: "POST /bundle-activations/{activationId}/resolve"
        actor: ObstetricianAttending
        preconditions:
          - "Every BundleChecklistItem with stage_gate <= 2 has status IN {COMPLETED, LATE_COMPLETED, MISSED} (ERR_CHECKLIST_STAGE_INCOMPLETE)"
          - "For OBSTETRIC_HEMORRHAGE the resolve call supplies quantitative_blood_loss_ml with no increase since the stage-2 reading (ERR_BUNDLE_NOT_CONTROLLED)"
        side_effects:
          - "BRANCH B side-effects (no OR mobilization, no DIVERT) — every PENDING item with stage_gate == 3 transitions to NOT_APPLICABLE"
          - "timeliness_score := calc bundle_intervention_timeliness variant activation_anchored; sequence_adjusted_score := variant sequence_anchored"
          - "encounter.acuity_tier and one_to_one_required are re-derived; unit.staffing_posture re-derived (calc unit_posture_derivation)"
          - "increments activation.version, encounter.version and unit.version"

      - from: STAGE_3_MASSIVE_TRANSFUSION
        to: CONTROLLED
        trigger: "POST /bundle-activations/{activationId}/resolve"
        actor: ObstetricianAttending
        preconditions:
          - "Every BundleChecklistItem with stage_gate <= 3 has status IN {COMPLETED, LATE_COMPLETED, MISSED} (ERR_CHECKLIST_STAGE_INCOMPLETE)"
          - "The EmergencyCesareanEvent minted by the stage-3 escalation has status IN {DELIVERED, REVIEW_PENDING, CLOSED, ABORTED_TO_VAGINAL} (ERR_CESAREAN_EVENT_IN_PROGRESS)"
        side_effects:
          - "JOIN — same scoring side-effects as branch B: timeliness_score and sequence_adjusted_score computed by calc bundle_intervention_timeliness"
          - "unit.staffing_posture leaves DIVERT and is re-derived from coverage_deficit_units and readiness (calc unit_posture_derivation)"
          - "increments activation.version, encounter.version and unit.version"

      - from: CONTROLLED
        to: DEBRIEF_PENDING
        trigger: "system, evaluated at the end of POST /bundle-activations/{activationId}/resolve"
        actor: system
        preconditions:
          - "missed_step_count >= 1 OR late_step_count >= 2 OR highest_stage_reached >= 2 — otherwise the activation stays CONTROLLED and is closable without a debrief"
        side_effects:
          - "unit.bundle_breach_count += 1 when missed_step_count >= 1 (calc unit_posture_derivation input)"
          - "increments activation.version and unit.version"

      - from: CONTROLLED | DEBRIEF_PENDING
        to: CLOSED
        trigger: "POST /bundle-activations/{activationId}/close-debrief"
        actor: PerinatalSafetyOfficer
        preconditions:
          - "If status == DEBRIEF_PENDING the call supplies debrief_notes of 40..2000 chars (ERR_DEBRIEF_NOTES_REQUIRED)"
          - "X-User-ID differs from every performed_by_staff_id on this activation's checklist items (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "timeliness_score is non-null (ERR_BUNDLE_SCORE_NOT_COMPUTED)"
        side_effects:
          - "Any remaining PENDING item transitions to NOT_APPLICABLE"
          - "encounter.review_required is re-derived; if the encounter is in POSTPARTUM_RECOVERY with no other blocker the discharge precondition set is now satisfiable"
          - "increments activation.version and encounter.version"

      - from: ACTIVATED | STAGE_1_IN_PROGRESS
        to: RESCINDED
        trigger: "POST /bundle-activations/{activationId}/rescind with rescind_reason and expected_activation_version"
        actor: ObstetricianAttending
        preconditions:
          - "highest_stage_reached <= 1 (ERR_BUNDLE_STAGE_BLOCKS_RESCIND)"
          - "rescind_reason is 10..500 chars (ERR_RESCIND_REASON_REQUIRED)"
        side_effects:
          - "COMPENSATION — every BundleChecklistItem transitions to NOT_APPLICABLE regardless of prior status; on_time_step_count, late_step_count and missed_step_count reset to 0; timeliness_score and sequence_adjusted_score remain null"
          - "encounter.magnesium_infusion_active := false; encounter.acuity_tier and one_to_one_required are re-derived from the remaining triggers only, so encounter.required_coverage_units returns to exactly its pre-activation value (invariant acuity_load_conservation)"
          - "The covering CareAssignment is re-priced back, so every affected ShiftAssignment.assigned_acuity_load_units returns to its pre-activation value and unit.coverage_deficit_units returns to its pre-activation value"
          - "unit.bundle_breach_count is unchanged (a rescinded activation never counted); unit.staffing_posture re-derived (calc unit_posture_derivation)"
          - "increments activation.version, encounter.version and unit.version"

  - entity: BundleChecklistItem
    state_field: status
    shape: branching_terminal
    initial_state: PENDING
    terminal_states: [COMPLETED, LATE_COMPLETED, MISSED, NOT_APPLICABLE]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /bundle-activations/{activationId}/checklist-items/{itemId}/complete"
        actor: BedsideNurse
        preconditions:
          - "activation.highest_stage_reached >= item.stage_gate (ERR_CHECKLIST_STAGE_NOT_REACHED), where a stage_gate == 1 item may be completed while the activation is still ACTIVATED"
          - "completed_at supplied on the call satisfies activated_at <= completed_at <= clock_now (ERR_CHECKLIST_TIMESTAMP_OUT_OF_RANGE)"
          - "performed_by_staff_id holds an ACTIVE CareAssignment on the encounter or an ACTIVE ShiftAssignment with role_slot IN {CHARGE, OR_STANDBY} on the unit (ERR_PERFORMER_NOT_ON_CASE)"
          - "completed_at <= due_at_activation_anchored — the boundary instant itself counts as on time (ERR not raised; a later instant selects LATE_COMPLETED instead)"
        side_effects:
          - "minutes_from_activation computed; activation.on_time_step_count += 1"
          - "Successor item's due_at_sequence_anchored recomputed from this completed_at (advisory anchoring only)"
          - "increments item.version and activation.version"

      - from: PENDING
        to: LATE_COMPLETED
        trigger: "POST /bundle-activations/{activationId}/checklist-items/{itemId}/complete"
        actor: BedsideNurse
        preconditions:
          - "Same preconditions as the COMPLETED edge, except completed_at > due_at_activation_anchored (strictly after)"
        side_effects:
          - "activation.late_step_count += 1; successor's due_at_sequence_anchored recomputed"
          - "increments item.version and activation.version"
        note: "The authoritative anchoring is activation_anchored: an item completed inside its sequence-anchored allowance but past its activation-anchored due date is LATE_COMPLETED."

      - from: PENDING
        to: MISSED
        trigger: "POST /obstetric-units/{unitId}/capacity-sweep"
        actor: system
        preconditions:
          - "clock_now > due_at_activation_anchored + MISSED_GRACE_MINUTES (5), strictly after, AND activation.highest_stage_reached >= item.stage_gate AND activation.status IN {ACTIVATED, STAGE_1_IN_PROGRESS, STAGE_2_ESCALATED, STAGE_3_MASSIVE_TRANSFUSION}"
        side_effects:
          - "activation.missed_step_count += 1; unit.bundle_breach_count is NOT incremented here (only on the CONTROLLED -> DEBRIEF_PENDING edge)"
          - "increments item.version and activation.version"

      - from: PENDING
        to: NOT_APPLICABLE
        trigger: "POST /bundle-activations/{activationId}/resolve, /close-debrief, /rescind, or POST /labor-encounters/{encounterId}/transfer-out"
        actor: system
        preconditions: ["The item's stage_gate was never reached, or the activation is being rescinded (which voids items in every status)"]
        side_effects: ["No counter changes; increments item.version"]

  - entity: FetalMonitoringAssessment
    state_field: escalation_status
    shape: cyclic
    initial_state: ESCALATION_DUE
    terminal_states: [RESOLVED, TIMED_OUT_BREACH]
    note: "Initial state is NOT_REQUIRED when category == CATEGORY_I and ESCALATION_DUE otherwise. Cyclic: REASSESSMENT_PENDING -> ESCALATION_DUE re-arms the chain, and a re-armed chain MUST resume at escalation_tier_high_water + 1, so the second lap starts higher than the first."
    transitions:
      - from: ESCALATION_DUE
        to: TIER_1_NOTIFIED
        trigger: "POST /fetal-monitoring-assessments/{assessmentId}/escalate with target_tier=1 and notified_staff_id"
        actor: BedsideNurse
        preconditions:
          - "escalation_tier_high_water == 0 (ERR_ESCALATION_TIER_SKIPPED)"
          - "clock_now <= escalation_due_at (ERR_ESCALATION_WINDOW_EXPIRED)"
          - "notified_staff_id names a StaffMember with an ACTIVE ShiftAssignment whose role_slot == CHARGE on the encounter's unit (ERR_ESCALATION_TARGET_INELIGIBLE)"
        side_effects:
          - "escalation_tier_high_water := 1; next_tier_due_at := clock_now + TIER_ADVANCE_MINUTES[category]"
          - "increments assessment.version"

      - from: TIER_1_NOTIFIED
        to: TIER_2_NOTIFIED
        trigger: "POST /fetal-monitoring-assessments/{assessmentId}/escalate with target_tier=2 and notified_staff_id"
        actor: ChargeNurse
        preconditions:
          - "target_tier == escalation_tier_high_water + 1 (ERR_ESCALATION_TIER_SKIPPED)"
          - "notified_staff_id names a StaffMember with staff_role == OB_ATTENDING and an ACTIVE ShiftAssignment on the unit (ERR_ESCALATION_TARGET_INELIGIBLE)"
        side_effects:
          - "escalation_tier_high_water := 2; next_tier_due_at := clock_now + TIER_ADVANCE_MINUTES[category]"
          - "encounter.acuity_tier floor rises to TIER_III (calc encounter_required_coverage_units); increments assessment.version and encounter.version"

      - from: TIER_2_NOTIFIED
        to: TIER_3_ACTIVATED
        trigger: "POST /fetal-monitoring-assessments/{assessmentId}/escalate with target_tier=3"
        actor: ObstetricianAttending
        preconditions:
          - "target_tier == escalation_tier_high_water + 1 (ERR_ESCALATION_TIER_SKIPPED)"
          - "category == CATEGORY_III (ERR_ESCALATION_CATEGORY_INSUFFICIENT)"
          - "An ACTIVE ShiftAssignment with role_slot == OR_STANDBY exists on the unit (ERR_OR_STANDBY_NOT_STAFFED)"
        side_effects:
          - "escalation_tier_high_water := 3; next_tier_due_at := null"
          - "CASCADE hop 1 — an EmergencyCesareanEvent is minted on the encounter in DECISION_DECLARED with urgency_class CATEGORY_1_CRASH, decision_at := clock_now, triggering_assessment_id := assessment.id"
          - "CASCADE hop 2 — the new event sets encounter.one_to_one_required := true and acuity_tier := TIER_IV (calc encounter_required_coverage_units), re-pricing the covering CareAssignment"
          - "CASCADE hop 3 — the re-pricing raises the covering ShiftAssignment.assigned_acuity_load_units, which can drive sibling encounters to COVERAGE_BREACH and raise unit.coverage_deficit_units, re-deriving unit.staffing_posture (calc unit_posture_derivation)"
          - "increments assessment.version, encounter.version and unit.version"

      - from: TIER_1_NOTIFIED | TIER_2_NOTIFIED | TIER_3_ACTIVATED
        to: REASSESSMENT_PENDING
        trigger: "POST /fetal-monitoring-assessments/{assessmentId}/resolve"
        actor: ObstetricianAttending
        preconditions:
          - "escalation_tier_high_water >= 1 (ERR_ESCALATION_NOT_STARTED)"
          - "No EmergencyCesareanEvent minted from this assessment has status IN {TEAM_MOBILIZED, INCISION_RECORDED} (ERR_CESAREAN_EVENT_IN_PROGRESS)"
        side_effects:
          - "reassessment_due_at := clock_now + REASSESSMENT_WINDOW_MINUTES (30); next_tier_due_at := null"
          - "increments assessment.version"

      - from: REASSESSMENT_PENDING
        to: RESOLVED
        trigger: "POST /fetal-monitoring-assessments (a newer assessment on the same encounter)"
        actor: system
        preconditions:
          - "The newer assessment has category == CATEGORY_I and its assessed_at <= this assessment's reassessment_due_at (inclusive)"
        side_effects:
          - "This assessment's escalation_status := RESOLVED; the newer assessment starts at NOT_REQUIRED and its supersedes_assessment_id points at this row"
          - "increments both assessment rows' version"

      - from: REASSESSMENT_PENDING
        to: ESCALATION_DUE
        trigger: "POST /fetal-monitoring-assessments (a newer assessment still CATEGORY_II/III) or POST /obstetric-units/{unitId}/capacity-sweep once clock_now > reassessment_due_at"
        actor: system
        preconditions:
          - "Either a newer assessment on the same encounter has category IN {CATEGORY_II, CATEGORY_III} with assessed_at <= reassessment_due_at, or clock_now > reassessment_due_at (strictly after) with no newer assessment at all"
        side_effects:
          - "RE-ARM — escalation_due_at := clock_now + ESCALATION_DUE_MINUTES[category]; escalation_tier_high_water is PRESERVED, so the next escalate call must target high_water + 1; reassessment_due_at := null"
          - "increments assessment.version"
        note: "Cycle edge. A chain may re-arm repeatedly until high_water reaches 3, after which only RESOLVED or TIMED_OUT_BREACH remain."

      - from: ESCALATION_DUE | TIER_1_NOTIFIED | TIER_2_NOTIFIED
        to: TIMED_OUT_BREACH
        trigger: "POST /obstetric-units/{unitId}/capacity-sweep"
        actor: system
        preconditions:
          - "From ESCALATION_DUE: clock_now > escalation_due_at (strictly after). From TIER_1_NOTIFIED or TIER_2_NOTIFIED: clock_now > next_tier_due_at (strictly after)"
        side_effects:
          - "unit.escalation_breach_count += 1"
          - "CASCADE — unit.staffing_posture is re-derived; escalation_breach_count >= ESCALATION_BREACH_FREEZE (2) forces at least INDUCTION_FROZEN (calc unit_posture_derivation), which bumps every CAPACITY_HELD booking and releases their held beds"
          - "increments assessment.version and unit.version"

  - entity: EmergencyCesareanEvent
    state_field: status
    shape: branching_fork_join
    initial_state: DECISION_DECLARED
    terminal_states: [CLOSED, ABORTED_TO_VAGINAL]
    note: "Fork at DECISION_DECLARED/TEAM_MOBILIZED: the incision branch measures decision-to-incision and produces a cesarean delivery_mode, while the ABORTED_TO_VAGINAL branch never measures decision-to-incision and produces OPERATIVE_VAGINAL."
    transitions:
      - from: DECISION_DECLARED
        to: TEAM_MOBILIZED
        trigger: "POST /emergency-cesareans/{eventId}/mobilize-team with or_bed_id and staff_ids"
        actor: ObstetricianAttending
        preconditions:
          - "The named Bed has bed_type == OR and status == AVAILABLE (ERR_BED_TYPE_NOT_ELIGIBLE / ERR_OR_BED_UNAVAILABLE)"
          - "staff_ids contains at least one StaffMember with staff_role == ANESTHESIOLOGIST, one with SURGICAL_TECH and or_circulating_qualified == true, and one with NEONATAL_RESUSCITATOR, each holding an ACTIVE ShiftAssignment on the unit (ERR_CESAREAN_TEAM_INCOMPLETE)"
          - "unit.cesarean_readiness_state != NOT_READY, unless urgency_class == CATEGORY_1_CRASH which bypasses this check (ERR_CESAREAN_READINESS_NOT_MET)"
        side_effects:
          - "or_bed_id := bed.id; the OR Bed transitions AVAILABLE -> OCCUPIED; mobilized_staff_ids := payload order"
          - "encounter.one_to_one_required := true (calc encounter_required_coverage_units); recompute calc unit_posture_derivation"
          - "Every SupportPersonPass on the encounter with status == CHECKED_IN and (credential_type != DOULA_CERTIFIED or or_credentialed == false) transitions to CHECKED_OUT (calc support_person_occupancy drops the room allowance to 1)"
          - "increments event.version, bed.version, encounter.version and unit.version"

      - from: TEAM_MOBILIZED
        to: INCISION_RECORDED
        trigger: "POST /emergency-cesareans/{eventId}/record-incision with incision_at"
        actor: ObstetricianAttending
        preconditions:
          - "decision_at < incision_at <= clock_now (ERR_CESAREAN_TIMESTAMP_OUT_OF_RANGE)"
        side_effects:
          - "decision_to_incision_minutes and met_target := calc decision_to_incision_measurement"
          - "Recompute calc cesarean_readiness_derivation: the rolling mean over the last ROLLING_EVENT_WINDOW (3) measured events can drop unit.cesarean_readiness_state to DEGRADED or NOT_READY"
          - "CASCADE — a readiness drop to NOT_READY bumps every CONFIRMED booking with priority_class == ELECTIVE_39_WEEK (releasing their held beds and decrementing committed bed-minutes by exactly projected_occupancy_minutes)"
          - "increments event.version and unit.version"

      - from: INCISION_RECORDED
        to: DELIVERED
        trigger: "POST /emergency-cesareans/{eventId}/record-delivery with delivery_at"
        actor: ObstetricianAttending
        preconditions:
          - "incision_at <= delivery_at <= clock_now (ERR_CESAREAN_TIMESTAMP_OUT_OF_RANGE)"
        side_effects:
          - "encounter.delivery_mode := CESAREAN_REPEAT when encounter.prior_cesarean == true else CESAREAN_PRIMARY; encounter.delivery_recorded_at := delivery_at"
          - "DRAFT QualityMeasureSnapshot rows whose window contains delivery_recorded_at are recomputed by calc quality_measure_rates; CERTIFIED rows are never retro-mutated"
          - "The OR Bed transitions OCCUPIED -> TURNOVER with turnover_clear_at := clock_now + unit.turnover_buffer_minutes"
          - "increments event.version, encounter.version, bed.version and affected snapshot versions"

      - from: DELIVERED
        to: REVIEW_PENDING
        trigger: "system, evaluated at the end of POST /emergency-cesareans/{eventId}/record-delivery"
        actor: system
        preconditions:
          - "met_target == false OR urgency_class == CATEGORY_1_CRASH — otherwise the event goes straight to CLOSED on the same call"
        side_effects:
          - "encounter.review_required := true; a NewbornComplicationReview is NOT auto-created (it is opened explicitly by POST /newborn-complication-reviews)"
          - "increments event.version and encounter.version"

      - from: DELIVERED | REVIEW_PENDING
        to: CLOSED
        trigger: "POST /emergency-cesareans/{eventId}/close"
        actor: PerinatalSafetyOfficer
        preconditions:
          - "If status == REVIEW_PENDING: a NewbornComplicationReview on this encounter has status == CLOSED (ERR_NEWBORN_REVIEW_OPEN)"
          - "X-User-ID differs from every id in mobilized_staff_ids (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects: ["encounter.review_required re-derived; increments event.version and encounter.version"]

      - from: DECISION_DECLARED | TEAM_MOBILIZED
        to: ABORTED_TO_VAGINAL
        trigger: "POST /emergency-cesareans/{eventId}/abort-to-vaginal"
        actor: ObstetricianAttending
        preconditions:
          - "incision_at is null (ERR_CESAREAN_ALREADY_INCISED)"
          - "The latest FetalMonitoringAssessment on the encounter has category IN {CATEGORY_I, CATEGORY_II} (ERR_FETAL_CATEGORY_BLOCKS_ABORT)"
        side_effects:
          - "BRANCH B side-effects — decision_to_incision_minutes and met_target stay null and are excluded from the rolling readiness mean (calc cesarean_readiness_derivation input_set)"
          - "If or_bed_id is non-null that OR Bed transitions OCCUPIED -> TURNOVER; or_bed_id := null"
          - "encounter.delivery_mode is left untouched (the subsequent advance-phase call supplies OPERATIVE_VAGINAL or SPONTANEOUS_VAGINAL)"
          - "encounter.one_to_one_required re-derived; recompute calc unit_posture_derivation; increments event.version, bed.version, encounter.version and unit.version"

  - entity: CesareanReadinessDrill
    state_field: status
    shape: cyclic_with_revert
    initial_state: SCHEDULED
    terminal_states: [ABANDONED]
    note: "VALIDATED -> INVALIDATED -> DOCUMENTED -> VALIDATED is a revision loop bounded by DRILL_REVISION_LIMIT. VALIDATED is not terminal because currency can be revoked."
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /cesarean-readiness-drills/{drillId}/start"
        actor: ChargeNurse
        preconditions: ["clock_now >= scheduled_for_utc (inclusive) (ERR_DRILL_NOT_DUE)", "unit.staffing_posture != DIVERT (ERR_UNIT_POSTURE_BLOCKS_OPERATION)"]
        side_effects: ["increments drill.version"]
      - from: IN_PROGRESS | INVALIDATED
        to: DOCUMENTED
        trigger: "POST /cesarean-readiness-drills/{drillId}/document with decision_at, incision_at, documented_by_staff_id"
        actor: ChargeNurse
        preconditions:
          - "decision_at < incision_at <= clock_now (ERR_DRILL_TIMESTAMP_OUT_OF_RANGE)"
          - "participant_staff_ids contains at least one OB_ATTENDING and one ANESTHESIOLOGIST, all with employment_status == ACTIVE (ERR_DRILL_PARTICIPANTS_INSUFFICIENT)"
          - "When coming from INVALIDATED: revision_count < DRILL_REVISION_LIMIT (2) (ERR_DRILL_REVISION_LIMIT_REACHED)"
        side_effects:
          - "measured_d2i_minutes := floor((incision_at - decision_at) / 60 seconds); when coming from INVALIDATED revision_count += 1"
          - "increments drill.version"
      - from: DOCUMENTED
        to: VALIDATED
        trigger: "POST /cesarean-readiness-drills/{drillId}/validate"
        actor: PerinatalSafetyOfficer
        preconditions:
          - "measured_d2i_minutes <= DRILL_PASS_MINUTES (30), boundary inclusive (ERR_DRILL_PERFORMANCE_FAILED)"
          - "X-User-ID != documented_by_staff_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "validated_at := clock_now; expires_at := validated_at + DRILL_CURRENCY_DAYS (90 days); validated_by_user_id := X-User-ID"
          - "Every participant StaffMember gets last_validated_drill_at := decision_at and drill_currency_state := CURRENT"
          - "CASCADE hop 2 — recompute calc cesarean_readiness_derivation; unit.cesarean_readiness_state can rise to READY, which no longer blocks POST /induction-bookings/{bookingId}/confirm"
          - "increments drill.version, each participant staff version and unit.version"
      - from: VALIDATED
        to: INVALIDATED
        trigger: "POST /cesarean-readiness-drills/{drillId}/invalidate with invalidation_reason"
        actor: PerinatalSafetyOfficer
        preconditions: ["invalidation_reason is 10..500 chars (ERR_INVALIDATION_REASON_REQUIRED)"]
        side_effects:
          - "CASCADE hop 1 — expires_at := null; every participant StaffMember re-derives last_validated_drill_at from its remaining VALIDATED drills (ordered decision_at DESC, tie-break created_at DESC) and may fall to drill_currency_state == LAPSED"
          - "CASCADE hop 2 — calc cesarean_readiness_derivation re-runs; losing the only current drill sets unit.cesarean_readiness_state := NOT_READY"
          - "CASCADE hop 3 — NOT_READY bumps every InductionBooking with status IN {CAPACITY_HELD, CONFIRMED} and priority_class IN {ELECTIVE_39_WEEK, PATIENT_REQUEST} to BUMPED (bump_count += 1)"
          - "CASCADE hop 4 — each bump releases its Bed (HELD -> AVAILABLE) and decrements the day's held or committed bed-minutes by exactly projected_occupancy_minutes (invariant induction_bed_minute_conservation)"
          - "increments drill.version, participant staff versions, unit.version, and each bumped booking and bed version"
      - from: SCHEDULED | IN_PROGRESS
        to: ABANDONED
        trigger: "POST /cesarean-readiness-drills/{drillId}/abandon"
        actor: ChargeNurse
        preconditions: ["status != DOCUMENTED and != VALIDATED (ERR_DRILL_NOT_ABANDONABLE)"]
        side_effects: ["No readiness change (an abandoned drill never contributed currency); increments drill.version"]

  - entity: NewbornComplicationReview
    state_field: status
    shape: cyclic_rework
    initial_state: OPEN
    terminal_states: [CLOSED]
    note: "FINDINGS_SUBMITTED -> REWORK_REQUESTED -> DEBRIEF_SCHEDULED -> FINDINGS_SUBMITTED is a rework loop bounded by REWORK_LIMIT."
    transitions:
      - from: OPEN | REWORK_REQUESTED
        to: DEBRIEF_SCHEDULED
        trigger: "POST /newborn-complication-reviews/{reviewId}/schedule-debrief with debrief_scheduled_for_utc"
        actor: ChargeNurse
        preconditions:
          - "clock_now <= debrief_scheduled_for_utc <= debrief_due_at (opened_at + DEBRIEF_DUE_HOURS = 72h), both boundaries inclusive (ERR_DEBRIEF_WINDOW_VIOLATION)"
          - "facilitator_staff_id has never held a CareAssignment on this encounter in any status (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects: ["increments review.version"]
      - from: DEBRIEF_SCHEDULED
        to: FINDINGS_SUBMITTED
        trigger: "POST /newborn-complication-reviews/{reviewId}/submit-findings with findings_summary and contributing_factor_codes"
        actor: ChargeNurse
        preconditions:
          - "clock_now >= debrief_scheduled_for_utc (inclusive) (ERR_DEBRIEF_NOT_HELD)"
          - "contributing_factor_codes is non-empty (ERR_CONTRIBUTING_FACTORS_REQUIRED) and findings_summary is 40..2000 chars (ERR_DEBRIEF_NOTES_REQUIRED)"
          - "Every SafetyBundleActivation on this encounter has status IN {CLOSED, RESCINDED} (ERR_BUNDLE_NOT_CLOSED)"
        side_effects: ["debrief_held_at := clock_now; increments review.version"]
      - from: FINDINGS_SUBMITTED
        to: REWORK_REQUESTED
        trigger: "POST /newborn-complication-reviews/{reviewId}/request-rework with rework_reason"
        actor: PerinatalSafetyOfficer
        preconditions:
          - "rework_count < REWORK_LIMIT (2) (ERR_REVIEW_REWORK_LIMIT_REACHED)"
          - "X-User-ID != facilitator_staff_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "rework_count += 1; findings_summary and contributing_factor_codes cleared; debrief_scheduled_for_utc cleared; debrief_held_at cleared"
          - "debrief_due_at is EXTENDED to clock_now + REWORK_EXTENSION_HOURS (24), which is the only way the 72-hour window moves"
          - "increments review.version"
        note: "Cycle edge."
      - from: FINDINGS_SUBMITTED
        to: CLOSED
        trigger: "POST /newborn-complication-reviews/{reviewId}/close"
        actor: PerinatalSafetyOfficer
        preconditions:
          - "X-User-ID != facilitator_staff_id and X-User-ID is not any StaffMember.id that held a CareAssignment on this encounter (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "contributing_factor_codes is non-empty (ERR_CONTRIBUTING_FACTORS_REQUIRED)"
        side_effects:
          - "closed_by_user_id := X-User-ID; encounter.review_required re-derived to false when this was the last non-CLOSED review"
          - "Any EmergencyCesareanEvent on the encounter in REVIEW_PENDING becomes closable; increments review.version and encounter.version"

  - entity: SupportPersonPass
    state_field: status
    shape: cyclic_reentry
    initial_state: ISSUED
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: ISSUED | CHECKED_OUT
        to: CHECKED_IN
        trigger: "POST /support-person-passes/{passId}/check-in"
        actor: PatientAccessCoordinator
        preconditions:
          - "clock_now < valid_until (ERR_SUPPORT_PASS_EXPIRED)"
          - "If credential_type == DOULA_CERTIFIED: doula_certification_expires_at > clock_now (ERR_DOULA_CREDENTIAL_EXPIRED)"
          - "Current checked-in occupancy + 1 <= calc support_person_occupancy allowance for the encounter (ERR_SUPPORT_OCCUPANCY_EXCEEDED)"
          - "No EmergencyCesareanEvent on the encounter has status IN {TEAM_MOBILIZED, INCISION_RECORDED} unless credential_type == DOULA_CERTIFIED and or_credentialed == true (ERR_VISITATION_RESTRICTED_BY_PROCEDURE)"
          - "encounter.labor_phase NOT IN {DISCHARGED, TRANSFERRED_OUT} (ERR_ENCOUNTER_PHASE_TERMINAL)"
          - "When coming from CHECKED_OUT: reentry_count < REENTRY_LIMIT (3) (ERR_SUPPORT_REENTRY_LIMIT_REACHED)"
        side_effects: ["checked_in_at := clock_now; checked_out_at := null; when coming from CHECKED_OUT reentry_count += 1; increments pass.version"]
        note: "Cycle edge with CHECKED_OUT."
      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /support-person-passes/{passId}/check-out, or automatically inside POST /emergency-cesareans/{eventId}/mobilize-team"
        actor: PatientAccessCoordinator | system
        preconditions: []
        side_effects: ["checked_out_at := clock_now; increments pass.version"]
      - from: ISSUED | CHECKED_IN | CHECKED_OUT
        to: REVOKED
        trigger: "POST /support-person-passes/{passId}/revoke, or automatically inside POST /labor-encounters/{encounterId}/transfer-out"
        actor: ChargeNurse | system
        preconditions: []
        side_effects: ["increments pass.version"]
      - from: ISSUED | CHECKED_OUT
        to: EXPIRED
        trigger: "POST /obstetric-units/{unitId}/capacity-sweep"
        actor: system
        preconditions: ["clock_now >= valid_until — the boundary instant itself expires the pass; a CHECKED_IN pass is never auto-expired"]
        side_effects: ["increments pass.version"]

  - entity: QualityMeasureSnapshot
    state_field: status
    shape: linear_with_supersede
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /quality-measure-snapshots/{snapshotId}/certify"
        actor: PerinatalSafetyOfficer
        preconditions:
          - "ntsv_cesarean_denominator >= 1 AND episiotomy_denominator >= 1 (ERR_EMPTY_MEASURE_DENOMINATOR)"
          - "period_end_utc <= clock_now (ERR_MEASURE_PERIOD_NOT_CLOSED)"
          - "No LaborEncounter in the delivery cohort has an open SafetyBundleActivation, i.e. every activation with encounter.delivery_recorded_at inside the window has status IN {CLOSED, RESCINDED} (ERR_BUNDLE_NOT_CLOSED)"
        side_effects: ["certified_at := clock_now; certified_by_user_id := X-User-ID; the row's counts and rates are frozen and excluded from all later recomputation; increments snapshot.version"]
      - from: DRAFT | CERTIFIED
        to: SUPERSEDED
        trigger: "POST /obstetric-units/{unitId}/quality-measure-snapshots (a newer snapshot for an identical [period_start_utc, period_end_utc) window)"
        actor: system
        preconditions: ["The newer snapshot passes expected_unit_version OCC (ERR_STALE_UNIT_VERSION, per concurrency rule snapshot-create-stale-unit)"]
        side_effects: ["superseded_by_snapshot_id := the newer snapshot id; frozen values are retained for audit; increments snapshot.version"]

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only.
# Each rule is a CREATE/WRITE-with-supersede that a second strictly sequential
# request with a refreshed version would legitimately be allowed to perform.
# =============================================================================
concurrency_rules:
  - rule_id: care-assignment-create-stale-encounter
    parent_entity: LaborEncounter
    write_endpoint: "POST /care-assignments"
    occ_field: "expected_encounter_version"
    description: |
      Creating a CareAssignment against a LaborEncounter whose version has
      advanced since the client last read it is rejected. A ONE_TO_ONE
      assignment legitimately supersedes the encounter's prior one-to-one
      coverage (nurse handoff), so the write cannot be rejected by a state
      precondition; the stale-version check is what stops a client from
      handing off from a view that predates an acuity change, a bundle
      activation, or an earlier handoff.
    error_id: ERR_STALE_ENCOUNTER_VERSION
    http_status: 412

  - rule_id: induction-hold-stale-unit
    parent_entity: ObstetricUnit
    write_endpoint: "POST /induction-bookings/{bookingId}/hold-capacity"
    occ_field: "expected_unit_version"
    description: |
      Placing a capacity hold against an ObstetricUnit whose version has
      advanced since the client last read it is rejected. Another hold,
      admission, bed turnover or posture recompute may have consumed the
      day's bed-minute budget the client based its request on, and a hold
      from a stale view of committed_bed_minutes_by_day would over-subscribe
      the day even though the booking itself is in a perfectly valid state.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412

  - rule_id: snapshot-create-stale-unit
    parent_entity: ObstetricUnit
    write_endpoint: "POST /obstetric-units/{unitId}/quality-measure-snapshots"
    occ_field: "expected_unit_version"
    description: |
      Creating a QualityMeasureSnapshot against an ObstetricUnit whose
      version has advanced since the client last read it is rejected. A new
      snapshot for an already-covered window legitimately supersedes the
      prior one, so nothing in the snapshot's own state forbids the write;
      the stale-version check is what prevents a supersede computed from a
      unit view that predates newly recorded deliveries.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412

  - rule_id: bundle-rescind-stale-activation
    parent_entity: SafetyBundleActivation
    write_endpoint: "POST /bundle-activations/{activationId}/rescind"
    occ_field: "expected_activation_version"
    description: |
      Rescinding a SafetyBundleActivation whose version has advanced since
      the client last read it is rejected. Checklist completions and score
      recomputations bump the activation's version without leaving stage 1,
      so a rescind is still permitted by the state machine while the
      compensation it would run (voiding items, restoring acuity units) was
      computed against a view that no longer matches the row.
    error_id: ERR_STALE_ACTIVATION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# All money-free arithmetic; every rounding step and every ordering is pinned.
# "clock_now" is the logical clock (POST /_clock/set_current_utc, default
# 2026-08-01T00:00:00Z).
# =============================================================================
calculations:
  - name: staff_capacity_units
    trigger: "POST /shift-assignments/{shiftId}/activate (snapshotted into ShiftAssignment.capacity_units_effective), PATCH /staff-members/{staffId}, POST /care-assignments, POST /care-assignments/{assignmentId}/release, POST /cesarean-readiness-drills/{drillId}/validate and /invalidate (StaffMember.capacity_units)"
    algorithm: weighted_scoring
    formula: |
      # Four interacting inputs; nested min/max, NOT a linear sum.
      if staff.employment_status != ACTIVE:            return 0.0
      if staff.credential_expires_at <= clock_now:     return 0.0
      if staff.fetal_monitoring_cert_level == EXPIRED:  return 0.0
      raw      = min(BASE_CAPACITY_UNITS[shift.role_slot], CERT_CAP_UNITS[staff.fetal_monitoring_cert_level])
      admin    = CHARGE_ADMIN_OFFSET_UNITS if shift.role_slot == CHARGE else 0.0
      # focus penalty: holding coverage on any TIER_IV encounter shrinks capacity
      focus    = TIER_IV_FOCUS_PENALTY_UNITS if EXISTS CareAssignment ca
                     (ca.shift_assignment_id == shift.id AND ca.status == ACTIVE
                      AND ca.encounter.acuity_tier == TIER_IV) else 0.0
      capacity = max(0.0, raw - admin - focus)
      return round_half_up(capacity, 1)
    input_set: "The single StaffMember referenced by the ShiftAssignment, plus CareAssignment rows with status == ACTIVE on that shift (RELEASED and SUPERSEDED rows are excluded)"
    constants:
      BASE_CAPACITY_UNITS: { CHARGE: 3.0, BEDSIDE: 4.0, ONE_TO_ONE_FLOAT: 4.0, OR_STANDBY: 2.0, TRIAGE: 6.0 }
      CERT_CAP_UNITS: { ADVANCED: 4.0, BASIC: 3.0, EXPIRED: 0.0 }
      CHARGE_ADMIN_OFFSET_UNITS: 1.0
      TIER_IV_FOCUS_PENALTY_UNITS: 1.0
    precision: "1 decimal place, round_half_up"

  - name: care_assignment_unit_debit
    trigger: "POST /care-assignments; re-priced by POST /labor-encounters/{encounterId}/advance-phase, POST /bundle-activations, POST /bundle-activations/{activationId}/escalate-stage, POST /bundle-activations/{activationId}/rescind, POST /fetal-monitoring-assessments/{assessmentId}/escalate, POST /emergency-cesareans/{eventId}/mobilize-team and POST /shift-assignments/{shiftId}/relieve"
    algorithm: tiered_pricing
    formula: |
      if assignment.coverage_mode == ONE_TO_ONE:
          # a one-to-one nurse is consumed entirely, whatever the acuity
          debit = shift.capacity_units_effective
      else:
          debit = ACUITY_UNITS[encounter.acuity_tier] * PHASE_MULTIPLIER[encounter.labor_phase]
      return round_half_up(debit, 1)
      # Re-pricing rule: when the encounter's tier or phase changes, the
      # existing ACTIVE row is re-priced IN PLACE — the shift is credited the
      # OLD acuity_units_consumed and debited the NEW value in that order, so
      # invariant acuity_load_conservation holds at every intermediate step.
    input_set: "One CareAssignment with status == ACTIVE, its ShiftAssignment (capacity_units_effective snapshot) and its LaborEncounter (acuity_tier, labor_phase)"
    constants:
      ACUITY_UNITS: { TIER_I: 1.0, TIER_II: 1.5, TIER_III: 2.0, TIER_IV: 4.0 }
      PHASE_MULTIPLIER: { ANTEPARTUM: 0.5, LATENT: 1.0, ACTIVE_FIRST_STAGE: 1.5, SECOND_STAGE: 2.0, THIRD_STAGE_DELIVERED: 1.5, POSTPARTUM_RECOVERY: 0.5, DISCHARGED: 0.0, TRANSFERRED_OUT: 0.0 }
    precision: "1 decimal place, round_half_up"

  - name: encounter_required_coverage_units
    trigger: "POST /labor-encounters, POST /induction-bookings/{bookingId}/admit, every POST /labor-encounters/{encounterId}/advance-phase, POST /bundle-activations, /escalate-stage, /resolve, /rescind, POST /fetal-monitoring-assessments, /escalate, /resolve, POST /emergency-cesareans/{eventId}/mobilize-team, /abort-to-vaginal"
    algorithm: constraint_propagation
    formula: |
      # STEP 1 — acuity_tier = the MAXIMUM tier any active condition demands.
      tier = TIER_I
      if encounter.gestational_age_weeks < 37 OR encounter.fetus_count > 1
         OR encounter.presentation != VERTEX OR encounter.prior_cesarean == true
         OR encounter.labor_phase IN {ACTIVE_FIRST_STAGE, THIRD_STAGE_DELIVERED}:
          tier = max(tier, TIER_II)
      if encounter.labor_phase == SECOND_STAGE
         OR EXISTS SafetyBundleActivation a (a.encounter_id == encounter.id AND a.status == STAGE_1_IN_PROGRESS)
         OR latest_assessment.category == CATEGORY_II AND latest_assessment.escalation_status
              IN {ESCALATION_DUE, TIER_1_NOTIFIED, TIER_2_NOTIFIED, REASSESSMENT_PENDING}:
          tier = max(tier, TIER_III)
      if EXISTS SafetyBundleActivation a (a.encounter_id == encounter.id AND a.status IN {STAGE_2_ESCALATED, STAGE_3_MASSIVE_TRANSFUSION})
         OR encounter.magnesium_infusion_active == true
         OR (latest_assessment.category == CATEGORY_III AND latest_assessment.escalation_status != RESOLVED)
         OR EXISTS EmergencyCesareanEvent e (e.encounter_id == encounter.id AND e.status IN {DECISION_DECLARED, TEAM_MOBILIZED, INCISION_RECORDED}):
          tier = max(tier, TIER_IV)
      # STEP 2 — one-to-one requirement (independent of the tier ladder)
      one_to_one_required = (encounter.labor_phase == SECOND_STAGE)
                            OR tier == TIER_IV
                            OR encounter.magnesium_infusion_active == true
      # STEP 3 — demanded units
      if encounter.labor_phase IN {DISCHARGED, TRANSFERRED_OUT}: required = 0.0
      elif one_to_one_required:                                   required = ONE_TO_ONE_REQUIRED_UNITS
      else: required = round_half_up(ACUITY_UNITS[tier] * PHASE_MULTIPLIER[encounter.labor_phase], 1)
    input_set: |
      latest_assessment = the FetalMonitoringAssessment on this encounter with the greatest assessed_at;
      tie-break created_at DESC. SafetyBundleActivation rows with status IN {CLOSED, RESCINDED} and
      EmergencyCesareanEvent rows with status IN {CLOSED, ABORTED_TO_VAGINAL} are EXCLUDED from every clause.
    constants:
      ONE_TO_ONE_REQUIRED_UNITS: 4.0
      ACUITY_UNITS: { TIER_I: 1.0, TIER_II: 1.5, TIER_III: 2.0, TIER_IV: 4.0 }
      PHASE_MULTIPLIER: { ANTEPARTUM: 0.5, LATENT: 1.0, ACTIVE_FIRST_STAGE: 1.5, SECOND_STAGE: 2.0, THIRD_STAGE_DELIVERED: 1.5, POSTPARTUM_RECOVERY: 0.5 }
    precision: "1 decimal place, round_half_up"

  - name: unit_posture_derivation
    trigger: "Every mutation that touches coverage, beds, bundles, escalations or readiness: POST /care-assignments, /release, POST /shift-assignments/{shiftId}/activate, /relieve, /cancel, every POST /labor-encounters/{encounterId}/* call, POST /bundle-activations and its stage calls, POST /fetal-monitoring-assessments/{assessmentId}/escalate, POST /cesarean-readiness-drills/{drillId}/validate and /invalidate, POST /beds/* and POST /obstetric-units/{unitId}/capacity-sweep"
    algorithm: threshold
    formula: |
      coverage_deficit_units = round_half_up( SUM over LaborEncounter e
          WHERE e.unit_id == unit.id
            AND e.labor_phase IN {ANTEPARTUM, LATENT, ACTIVE_FIRST_STAGE, SECOND_STAGE,
                                  THIRD_STAGE_DELIVERED, POSTPARTUM_RECOVERY}
          OF max(0.0, e.required_coverage_units - e.assigned_coverage_units), 1 )
      available_ldr_beds = COUNT Bed b WHERE b.unit_id == unit.id AND b.bed_type == LDR AND b.status == AVAILABLE
      # First matching branch wins — evaluation order is part of the contract.
      if coverage_deficit_units >= DIVERT_DEFICIT_UNITS
         OR available_ldr_beds == 0
         OR EXISTS SafetyBundleActivation a (a.unit_id == unit.id AND a.status == STAGE_3_MASSIVE_TRANSFUSION):
          staffing_posture = DIVERT
      elif coverage_deficit_units >= FREEZE_DEFICIT_UNITS
         OR unit.escalation_breach_count >= ESCALATION_BREACH_FREEZE
         OR unit.bundle_breach_count >= BUNDLE_BREACH_FREEZE
         OR unit.cesarean_readiness_state == NOT_READY
         OR (coverage_deficit_units > 0.0 AND EXISTS SafetyBundleActivation a
              (a.unit_id == unit.id AND a.status == STAGE_2_ESCALATED)):
          staffing_posture = INDUCTION_FROZEN
      elif coverage_deficit_units > 0.0
         OR EXISTS LaborEncounter e (e.unit_id == unit.id AND e.staffing_state == COVERAGE_BREACH):
          staffing_posture = RATIO_STRAINED
      else:
          staffing_posture = OPEN
      turnover_buffer_minutes = 45 if staffing_posture == OPEN else 75   # derived AFTER posture
    input_set: "In-unit LaborEncounter rows in the six non-terminal labor phases; Bed rows of bed_type LDR; SafetyBundleActivation rows in stage 2 or 3; the unit's own breach counters and cesarean_readiness_state"
    constants:
      DIVERT_DEFICIT_UNITS: 8.0
      FREEZE_DEFICIT_UNITS: 4.0
      ESCALATION_BREACH_FREEZE: 2
      BUNDLE_BREACH_FREEZE: 3
    precision: "coverage_deficit_units to 1 decimal place, round_half_up; thresholds are inclusive (>=) at DIVERT and INDUCTION_FROZEN and strict (>) at RATIO_STRAINED"
    note: "Boundary contract: deficit 4.0 freezes, 3.9 does not; deficit 0.1 strains, exactly 0.0 does not. Posture is computed BEFORE turnover_buffer_minutes; buffer changes never feed back into posture inside the same request."

  - name: acuity_load_conservation
    trigger: "Asserted after every CareAssignment create, release, supersede, re-price and shift relieve, and after POST /bundle-activations/{activationId}/rescind"
    algorithm: invariant
    formula: |
      # Conserved quantity 1 — staffing acuity units.
      FOR EVERY ShiftAssignment s WITH s.status IN {SCHEDULED, ACTIVE}:
        s.assigned_acuity_load_units
          == round_half_up(SUM of ca.acuity_units_consumed
                           FOR CareAssignment ca WHERE ca.shift_assignment_id == s.id
                             AND ca.status == ACTIVE, 1)
      AND FOR EVERY LaborEncounter e:
        e.assigned_coverage_units
          == round_half_up(SUM of ca.acuity_units_consumed
                           FOR CareAssignment ca WHERE ca.encounter_id == e.id
                             AND ca.status == ACTIVE, 1)
      # Compensation contract: create-then-release, ONE_TO_ONE handoff
      # (create-supersedes-predecessor), shift relieve, and bundle rescind each
      # leave BOTH sums, and unit.coverage_deficit_units, bit-identical to the
      # values they had before the forward action.
    input_set: "CareAssignment rows with status == ACTIVE only; RELEASED and SUPERSEDED rows contribute 0"
    precision: "1 decimal place, round_half_up; equality is exact after rounding"

  - name: induction_bed_minute_conservation
    trigger: "Asserted after every hold-capacity, confirm, admit, bump, requeue, cancel and hold expiry"
    algorithm: invariant
    formula: |
      # Conserved quantity 2 — schedulable LDR bed-minutes per UTC day.
      FOR EVERY UTC date d:
        unit.held_bed_minutes_by_day[d]
          == SUM of b.projected_occupancy_minutes FOR InductionBooking b
             WHERE b.unit_id == unit.id AND b.status == CAPACITY_HELD
               AND date(b.requested_start_utc) == d
        AND unit.committed_bed_minutes_by_day[d]
          == SUM of b.projected_occupancy_minutes FOR InductionBooking b
             WHERE b.unit_id == unit.id AND b.status IN {CONFIRMED, ADMITTED}
               AND date(b.requested_start_utc) == d
      # Compensation contract: hold -> bump, hold -> cancel, hold -> expiry, and
      # hold -> confirm -> bump each return
      #   held_bed_minutes_by_day[d] + committed_bed_minutes_by_day[d]
      # to exactly its pre-hold value. projected_occupancy_minutes is frozen at
      # hold time, so a posture change (45 -> 75 minute buffer) between hold and
      # release can never leave drift.
    input_set: "InductionBooking rows keyed by date(requested_start_utc); rows in REQUESTED, BUMPED, CANCELLED and EXPIRED contribute 0 to both maps"
    precision: "Integer minutes; equality is exact"

  - name: bundle_checklist_template
    trigger: "POST /bundle-activations (items are minted with the activation); due_at_sequence_anchored is recomputed on every POST /bundle-activations/{activationId}/checklist-items/{itemId}/complete"
    algorithm: projection
    formula: |
      TEMPLATE[OBSTETRIC_HEMORRHAGE] = [
        (seq 1, QBL_MEASURE,            stage_gate 1, required_within_minutes 10),
        (seq 2, UTEROTONIC_GIVEN,       stage_gate 1, required_within_minutes 15),
        (seq 3, TYPE_AND_SCREEN,        stage_gate 2, required_within_minutes 20),
        (seq 4, MTP_ACTIVATED,          stage_gate 3, required_within_minutes 10) ]
      TEMPLATE[SEVERE_HYPERTENSION] = [
        (seq 1, ANTIHYPERTENSIVE_GIVEN, stage_gate 1, required_within_minutes 30),
        (seq 2, MAGNESIUM_LOADED,       stage_gate 1, required_within_minutes 60),
        (seq 3, REPEAT_BP,              stage_gate 2, required_within_minutes 15),
        (seq 4, OB_AT_BEDSIDE,          stage_gate 2, required_within_minutes 20) ]
      # ANCHOR A (authoritative) — cumulative from activation:
      due_at_activation_anchored(n) = activation.activated_at
            + SUM(required_within_minutes of items with step_sequence <= n)
        # hemorrhage: +10, +25, +45, +55 minutes
      # ANCHOR B (advisory) — chained from the predecessor's actual completion:
      due_at_sequence_anchored(1) = activation.activated_at + required_within_minutes(1)
      due_at_sequence_anchored(n) = completed_at(n-1) + required_within_minutes(n)
                                    when item n-1 has completed_at, else null
    input_set: "The activation's own bundle_type; items are never client-created and step_sequence is unique per activation_id, so no tie-break is needed"
    precision: "Whole minutes; datetime arithmetic in UTC"

  - name: bundle_intervention_timeliness
    trigger: "POST /bundle-activations/{activationId}/resolve (writes both SafetyBundleActivation.timeliness_score and .sequence_adjusted_score)"
    algorithm: weighted_scoring
    formula: |
      applicable = [ items WHERE status != NOT_APPLICABLE ]
      if applicable is empty: return null   # empty-set boundary
      on_time = COUNT items in applicable WHERE completed_at is non-null
                                            AND completed_at <= DUE(item)
      late    = COUNT items in applicable WHERE completed_at is non-null
                                            AND completed_at >  DUE(item)
      missed  = COUNT items in applicable WHERE status == MISSED
      raw     = 100.0 * (on_time + LATE_CREDIT * late) / COUNT(applicable)
                - MISSED_PENALTY_POINTS * missed
      score   = round_half_up(max(0.0, min(100.0, raw)), 2)
      # DUE(item) is what separates the two variants; the counter fields
      # on_time_step_count / late_step_count on the activation always follow
      # variant activation_anchored.
    input_set: "BundleChecklistItem rows of this activation with status != NOT_APPLICABLE; PENDING rows count as neither on_time nor late but DO enter the denominator"
    constants:
      LATE_CREDIT: 0.5
      MISSED_PENALTY_POINTS: 10.0
    precision: "2 decimal places, round_half_up; the max/min clamp is applied BEFORE rounding"
    variants:
      - name: activation_anchored
        when: "AUTHORITATIVE — always; this is the value stored in timeliness_score and the only value any gate or report consumes"
        difference: "DUE(item) = item.due_at_activation_anchored, i.e. the cumulative allowance from activated_at. A step completed inside its own allowance but after the cumulative deadline is LATE."
      - name: sequence_anchored
        when: "ADVISORY — recorded in sequence_adjusted_score for the debrief packet only; never gates a transition"
        difference: |
          DUE(item) = item.due_at_sequence_anchored, i.e. predecessor.completed_at
          + required_within_minutes. Identical data yields a different score:
          with activated_at = T, item 1 completed at T+2 and item 2 completed at
          T+20, the activation-anchored due dates are T+10 / T+25 (both on time,
          score 100.00) while the sequence-anchored due dates are T+10 / T+17
          (item 2 late, score 87.50 over 4 applicable items).
      - name: rescinded_activation
        when: "activation.status == RESCINDED"
        difference: "Both scores stay null and all counters are 0; a rescinded activation never contributes to unit.bundle_breach_count."

  - name: escalation_deadline_derivation
    trigger: "POST /fetal-monitoring-assessments (initial escalation_due_at), POST /fetal-monitoring-assessments/{assessmentId}/escalate (next_tier_due_at), /resolve (reassessment_due_at), and the re-arm edge inside POST /obstetric-units/{unitId}/capacity-sweep"
    algorithm: threshold
    formula: |
      escalation_status_initial = NOT_REQUIRED if category == CATEGORY_I else ESCALATION_DUE
      escalation_due_at   = assessed_at + ESCALATION_DUE_MINUTES[category]
      next_tier_due_at    = <instant of the tier notification> + TIER_ADVANCE_MINUTES[category]
      reassessment_due_at = <instant of the resolve call> + REASSESSMENT_WINDOW_MINUTES
      # RE-ARM: escalation_due_at := <re-arm instant> + ESCALATION_DUE_MINUTES[category]
      #         escalation_tier_high_water is preserved across the re-arm.
      # Breach test is STRICT: clock_now > deadline breaches; clock_now == deadline does not.
      # Escalate test is INCLUSIVE: clock_now <= escalation_due_at is still in time.
    input_set: "One FetalMonitoringAssessment; category is immutable after creation"
    constants:
      ESCALATION_DUE_MINUTES: { CATEGORY_II: 20, CATEGORY_III: 5 }
      TIER_ADVANCE_MINUTES: { CATEGORY_II: 15, CATEGORY_III: 5 }
      REASSESSMENT_WINDOW_MINUTES: 30
    precision: "Whole minutes, UTC"

  - name: decision_to_incision_measurement
    trigger: "POST /emergency-cesareans/{eventId}/record-incision and POST /cesarean-readiness-drills/{drillId}/document"
    algorithm: threshold
    formula: |
      minutes    = floor((incision_at - decision_at) total_seconds / 60)   # truncating, never rounding up
      met_target = (minutes <= D2I_TARGET_MINUTES[urgency_class])          # inclusive boundary
      # Drill variant: measured_d2i_minutes uses the same floor and is judged
      # against DRILL_PASS_MINUTES (30) with the same inclusive boundary.
      # An event on the ABORTED_TO_VAGINAL branch never gets a measurement and
      # is excluded from every rolling aggregate.
    input_set: "One EmergencyCesareanEvent with non-null incision_at, or one CesareanReadinessDrill with non-null decision_at and incision_at"
    constants:
      D2I_TARGET_MINUTES: { CATEGORY_1_CRASH: 15, CATEGORY_2_URGENT: 30 }
      DRILL_PASS_MINUTES: 30
    precision: "Integer minutes via floor; a 30-minute-0-second interval measures 30 and MEETS a 30-minute target, while 30 minutes 1 second also measures 30 and still meets it — only 31 whole minutes fails"

  - name: cesarean_readiness_derivation
    trigger: "POST /cesarean-readiness-drills/{drillId}/validate and /invalidate, POST /shift-assignments/{shiftId}/activate, /relieve, /cancel, POST /emergency-cesareans/{eventId}/record-incision, and POST /obstetric-units/{unitId}/capacity-sweep"
    algorithm: aggregation
    formula: |
      current_drill = the CesareanReadinessDrill on this unit WHERE status == VALIDATED
                        AND expires_at > clock_now, ordered validated_at DESC,
                        tie-break created_at DESC, take 1 (null when none)
      rolling = EmergencyCesareanEvent rows on this unit WHERE decision_to_incision_minutes
                  is non-null AND status IN {INCISION_RECORDED, DELIVERED, REVIEW_PENDING, CLOSED},
                ordered incision_at DESC, tie-break created_at DESC, take ROLLING_EVENT_WINDOW (3)
      mean_d2i = null if rolling is empty
                 else round_half_up(SUM(decision_to_incision_minutes) / COUNT(rolling), 2)
      or_standby_staffed = EXISTS ShiftAssignment s (s.unit_id == unit.id AND s.status == ACTIVE
                             AND s.role_slot == OR_STANDBY
                             AND s.staff.drill_currency_state == CURRENT)
      # First matching branch wins.
      if current_drill is null OR (mean_d2i is non-null AND mean_d2i > READINESS_DEGRADED_CEILING):
          cesarean_readiness_state = NOT_READY
      elif or_standby_staffed == false OR (mean_d2i is non-null AND mean_d2i > READINESS_READY_CEILING):
          cesarean_readiness_state = DEGRADED
      else:
          cesarean_readiness_state = READY
    input_set: "VALIDATED drills with expires_at > clock_now (INVALIDATED, DOCUMENTED and ABANDONED drills contribute nothing); the three most recent MEASURED emergency events (ABORTED_TO_VAGINAL events are excluded); ACTIVE OR_STANDBY shifts"
    constants:
      ROLLING_EVENT_WINDOW: 3
      READINESS_READY_CEILING: 30.00
      READINESS_DEGRADED_CEILING: 45.00
      DRILL_CURRENCY_DAYS: 90
    precision: "mean_d2i to 2 decimal places, round_half_up; both ceilings are strict (mean exactly 30.00 stays READY, exactly 45.00 stays DEGRADED)"
    note: "Empty-set boundary: a unit with a current validated drill, OR standby staffed and ZERO measured emergency events is READY — an empty rolling window is not treated as a failure."

  - name: induction_priority_class
    trigger: "POST /induction-bookings, POST /induction-bookings/{bookingId}/requeue, and the automatic requeue inside POST /obstetric-units/{unitId}/capacity-sweep"
    algorithm: threshold
    formula: |
      if indication_code IN {PREECLAMPSIA, POST_DATES_41W, FGR, PROM}:
          priority_class = MEDICALLY_INDICATED
      elif indication_code IN {GDM_CONTROLLED, ELECTIVE_NO_INDICATION}
           AND gestational_age_weeks >= ELECTIVE_GA_WEEKS:          # inclusive
          priority_class = ELECTIVE_39_WEEK
      else:
          priority_class = PATIENT_REQUEST
      # Bump escalation: a booking bumped BUMP_ESCALATION_LIMIT times ranks as
      # MEDICALLY_INDICATED regardless of indication_code, which also makes it
      # ineligible for any further bump.
      if bump_count >= BUMP_ESCALATION_LIMIT: priority_class = MEDICALLY_INDICATED
    input_set: "One InductionBooking; recomputed on every requeue so bump history feeds the rank"
    constants:
      ELECTIVE_GA_WEEKS: 39
      BUMP_ESCALATION_LIMIT: 2
      PRIORITY_RANK: { MEDICALLY_INDICATED: 0, ELECTIVE_39_WEEK: 1, PATIENT_REQUEST: 2 }
    precision: "Integer weeks; the 39-week boundary is inclusive, so 39 is ELECTIVE_39_WEEK and 38 is PATIENT_REQUEST"

  - name: induction_capacity_projection
    trigger: "POST /induction-bookings/{bookingId}/hold-capacity, /confirm, and the whole of POST /obstetric-units/{unitId}/capacity-sweep"
    algorithm: waterfall_allocation
    formula: |
      projected_occupancy_minutes = booking.expected_labor_minutes
                                    + unit.turnover_buffer_minutes AT HOLD TIME (frozen)
      day_load(d) = unit.committed_bed_minutes_by_day[d] + unit.held_bed_minutes_by_day[d]
      capacity_ok(booking) = day_load(date(requested_start_utc)) + projected_occupancy_minutes
                             <= unit.max_daily_induction_bed_minutes          # inclusive
      # ---- SWEEP EVALUATION ORDER (pinned; the value is otherwise ill-defined
      # because posture feeds the buffer, the buffer feeds projections,
      # projections feed capacity, and capacity feeds which bookings are held,
      # which feeds posture again) ----
      #  1. posture_at_sweep := unit.staffing_posture as read at sweep start;
      #     the whole sweep uses THIS value and the buffer derived from it.
      #  2. Clear TURNOVER beds whose turnover_clear_at <= clock_now.
      #  3. Expire CAPACITY_HELD bookings whose hold_expires_at <= clock_now
      #     (each releases its bed and its held bed-minutes).
      #  4. Requeue BUMPED bookings whose requested_start_utc > clock_now to
      #     REQUESTED (recomputing priority_class), and move the rest to EXPIRED.
      #  5. Promote REQUESTED bookings one at a time, re-testing capacity_ok and
      #     bed availability AFTER each promotion, in this order:
      #        PRIORITY_RANK[priority_class] ASC,
      #        then requested_start_utc ASC,
      #        then created_at ASC          # final tie-break; `id` is never used
      #     Eligibility filter for promotion: status == REQUESTED
      #        AND requested_start_utc > clock_now
      #        AND posture_at_sweep IN {OPEN, RATIO_STRAINED}
      #        AND (posture_at_sweep == OPEN OR priority_class != PATIENT_REQUEST)
      #        AND at least one Bed with bed_type == LDR, status == AVAILABLE and
      #            no interval collision (see the closed-interval-plus-buffer rule)
      #     Bed selection among candidates: bed_label ASC (lexicographic).
      #     Empty candidate set: nothing is promoted, promoted_count is 0, and no
      #     error is raised.
      #  6. Recompute calc unit_posture_derivation ONCE, at the very end.
      # Interval collision (closed interval, buffer included on the existing side):
      #   new_window      = [requested_start_utc, requested_start_utc + expected_labor_minutes]
      #   existing_window = [b.requested_start_utc, b.requested_start_utc + b.projected_occupancy_minutes]
      #   collides = (new_start <= existing_end) AND (existing_start <= new_end)
      #   Touching endpoints DO collide — back-to-back bookings on one bed must be
      #   separated by strictly more than the frozen buffer.
    input_set: "InductionBooking rows on the unit with status IN {CAPACITY_HELD, CONFIRMED, ADMITTED} define occupied windows; REQUESTED rows are candidates; BUMPED, CANCELLED and EXPIRED rows are ignored"
    constants:
      HOLD_TTL_MINUTES: 120
      ADMIT_EARLY_GRACE_MINUTES: 30
    precision: "Integer minutes; the daily capacity test is inclusive (a booking that lands exactly on max_daily_induction_bed_minutes is accepted)"
    note: "Contrast with staff shift intervals, which are half-open [start, end) and where touching endpoints do NOT collide. The two overlap rules are deliberately different geometry on different resources."

  - name: quality_measure_rates
    trigger: "POST /obstetric-units/{unitId}/quality-measure-snapshots, and in-place recomputation of DRAFT snapshots by POST /labor-encounters/{encounterId}/advance-phase reaching THIRD_STAGE_DELIVERED and POST /emergency-cesareans/{eventId}/record-delivery"
    algorithm: aggregation
    formula: |
      # ---- cohort selection (see variants for the two attribution bases) ----
      cohort = LaborEncounter rows WHERE unit_id == snapshot.unit_id
                 AND delivery_mode is non-null
                 AND ATTRIBUTION_KEY IN [period_start_utc, period_end_utc)   # half-open
      ntsv_cesarean_denominator = COUNT cohort WHERE is_ntsv == true
      ntsv_cesarean_numerator   = COUNT cohort WHERE is_ntsv == true
                                    AND delivery_mode == CESAREAN_PRIMARY
      episiotomy_denominator    = COUNT cohort WHERE delivery_mode IN
                                    {SPONTANEOUS_VAGINAL, OPERATIVE_VAGINAL}
      episiotomy_numerator      = COUNT cohort WHERE delivery_mode IN
                                    {SPONTANEOUS_VAGINAL, OPERATIVE_VAGINAL}
                                    AND episiotomy_performed == true
      # ---- ROUNDING ORDER (pinned; round-then-average, NOT average-then-round) ----
      ntsv_rate  = null if ntsv_cesarean_denominator == 0
                   else round_half_up(100.0 * ntsv_num / ntsv_den, 4)
      epis_rate  = null if episiotomy_denominator == 0
                   else round_half_up(100.0 * epis_num / epis_den, 4)
      composite_quality_index = null if (ntsv_rate is null OR epis_rate is null)
                   else round_half_up((ntsv_rate + epis_rate) / 2.0, 2)
      # The two component rates are rounded to 4 decimals FIRST and the already
      # rounded values are averaged and then rounded to 2 decimals. Averaging the
      # unrounded quotients and rounding once would produce a different cent-level
      # value; that order is forbidden.
    input_set: |
      Only LaborEncounter rows with delivery_mode non-null enter either cohort;
      TRANSFERRED_OUT encounters without a recorded delivery are excluded from
      numerator AND denominator. Encounters whose delivery is recorded after a
      snapshot is CERTIFIED never re-enter that snapshot.
    constants:
      RATE_DECIMALS: 4
      COMPOSITE_DECIMALS: 2
    precision: "Component rates 4 decimals round_half_up; composite 2 decimals round_half_up; denominators of 0 yield null rates (never 0.0) and a null composite"
    variants:
      - name: delivery_cohort
        when: "AUTHORITATIVE — always; snapshot.attribution_basis is fixed at DELIVERY_COHORT and this is what certification freezes and what any external submission reports"
        difference: "ATTRIBUTION_KEY = encounter.delivery_recorded_at."
      - name: admission_cohort
        when: "ADVISORY — computed on the same call into shadow_ntsv_rate_pct for internal trending; never certified, never gated on"
        difference: |
          ATTRIBUTION_KEY = encounter.admitted_at. Identical data yields a
          different rate whenever an encounter straddles the window boundary:
          a patient admitted at 2026-08-31T22:00Z who delivers by cesarean at
          2026-09-01T03:00Z is in the August admission cohort and the September
          delivery cohort, so the August snapshot's authoritative NTSV rate
          excludes her while its shadow rate includes her.

  - name: support_person_occupancy
    trigger: "POST /support-person-passes, POST /support-person-passes/{passId}/check-in, and re-evaluated by POST /emergency-cesareans/{eventId}/mobilize-team and POST /labor-encounters/{encounterId}/advance-phase"
    algorithm: threshold
    formula: |
      staff_in_room = COUNT CareAssignment WHERE encounter_id == encounter.id AND status == ACTIVE
      base = BASE_SUPPORT_BY_PHASE[encounter.labor_phase]
      doula_bonus = 1 if EXISTS SupportPersonPass p (p.encounter_id == encounter.id
                        AND p.credential_type == DOULA_CERTIFIED
                        AND p.doula_certification_expires_at > clock_now
                        AND p.status IN {ISSUED, CHECKED_IN, CHECKED_OUT})
                      AND unit.staffing_posture != DIVERT
                    else 0
      allowance = min(base + doula_bonus, MAX_ROOM_OCCUPANCY - staff_in_room)
      if unit.staffing_posture IN {INDUCTION_FROZEN, DIVERT}: allowance = min(allowance, 1)
      if EXISTS EmergencyCesareanEvent e (e.encounter_id == encounter.id
           AND e.status IN {TEAM_MOBILIZED, INCISION_RECORDED}):
          allowance = 1   # OR override: only one support person, and a
                          # DOULA_CERTIFIED pass needs or_credentialed == true
      allowance = max(0, allowance)
      # check-in is admitted only while
      #   COUNT(passes on this encounter with status == CHECKED_IN) + 1 <= allowance
    input_set: "SupportPersonPass rows on the encounter with status == CHECKED_IN for the occupancy count; ACTIVE CareAssignment rows for staff_in_room; REVOKED and EXPIRED passes contribute nothing"
    constants:
      BASE_SUPPORT_BY_PHASE: { ANTEPARTUM: 2, LATENT: 2, ACTIVE_FIRST_STAGE: 2, SECOND_STAGE: 1, THIRD_STAGE_DELIVERED: 1, POSTPARTUM_RECOVERY: 2, DISCHARGED: 0, TRANSFERRED_OUT: 0 }
      MAX_ROOM_OCCUPANCY: 4
      PASS_VALID_HOURS: 24
      REENTRY_LIMIT: 3
    precision: "Integer persons; the check-in test is inclusive (a check-in that lands exactly on the allowance is admitted)"
    note: "Zero-allowance boundary: at MAX_ROOM_OCCUPANCY 4 with 4 ACTIVE care assignments the allowance is 0 and every check-in fails with ERR_SUPPORT_OCCUPANCY_EXCEEDED even for a certified doula."

# =============================================================================
# §1.4 Validation Rules Table — evaluated STRICTLY in ascending priority order.
# The first failing rule determines the response; later rules are never reached.
# Domain ordering inside the business block:
#   segregation of duties -> clinical safety -> structural constraints
#   -> temporal windows -> capacity/quota -> reporting completeness.
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are present, non-empty, and X-User-Role is one of the six declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role is permitted to call this endpoint per the RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every id in the path exists, validated left-to-right (unitId before bedId/snapshotId, activationId before itemId)"
    error_id: "ERR_UNIT_NOT_FOUND / ERR_BED_NOT_FOUND / ERR_STAFF_NOT_FOUND / ERR_SHIFT_NOT_FOUND / ERR_ENCOUNTER_NOT_FOUND / ERR_CARE_ASSIGNMENT_NOT_FOUND / ERR_BOOKING_NOT_FOUND / ERR_ACTIVATION_NOT_FOUND / ERR_CHECKLIST_ITEM_NOT_FOUND / ERR_ASSESSMENT_NOT_FOUND / ERR_CESAREAN_EVENT_NOT_FOUND / ERR_DRILL_NOT_FOUND / ERR_REVIEW_NOT_FOUND / ERR_PASS_NOT_FOUND / ERR_SNAPSHOT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying path ids"

  - priority: 4
    category: existence
    check: "Every id referenced in the request body exists, validated in the field order declared by the endpoint's input list"
    error_id: "ERR_ENCOUNTER_NOT_FOUND / ERR_SHIFT_NOT_FOUND / ERR_STAFF_NOT_FOUND / ERR_BED_NOT_FOUND / ERR_ASSESSMENT_NOT_FOUND / ERR_ACTIVATION_NOT_FOUND"
    http_status: 404
    applies_to: "POST /care-assignments, POST /shift-assignments, POST /labor-encounters/{encounterId}/assign-bed, POST /bundle-activations, POST /bundle-activations/{activationId}/checklist-items/{itemId}/complete, POST /fetal-monitoring-assessments, POST /fetal-monitoring-assessments/{assessmentId}/escalate, POST /emergency-cesareans, POST /emergency-cesareans/{eventId}/mobilize-team, POST /cesarean-readiness-drills, POST /newborn-complication-reviews, POST /induction-bookings/{bookingId}/hold-capacity, POST /shift-assignments/{shiftId}/relieve"

  - priority: 5
    category: business_constraint
    check: "Field types, enum membership and numeric/string ranges match the declared constraints (gestational_age_weeks 20..44, parity >= 0, fetus_count >= 1, systolic 60..300, diastolic 30..200, quantitative_blood_loss_ml >= 0, target_tier 1..3, target_stage 2..3, reason/notes length bounds, limit 1..100, offset >= 0)"
    error_id: ERR_INVALID_FIELD_VALUE
    http_status: 400
    applies_to: all

  - priority: 6
    category: state
    check: "OCC guard — when the endpoint declares an expected_*_version input, it must equal the current parent version: expected_encounter_version on POST /care-assignments, expected_unit_version on POST /induction-bookings/{bookingId}/hold-capacity and POST /obstetric-units/{unitId}/quality-measure-snapshots, expected_activation_version on POST /bundle-activations/{activationId}/rescind. Checked BEFORE any state or business rule."
    error_id: "ERR_STALE_ENCOUNTER_VERSION / ERR_STALE_UNIT_VERSION / ERR_STALE_ACTIVATION_VERSION"
    http_status: 412
    applies_to: "POST /care-assignments, POST /induction-bookings/{bookingId}/hold-capacity, POST /obstetric-units/{unitId}/quality-measure-snapshots, POST /bundle-activations/{activationId}/rescind"

  - priority: 7
    category: business_referential
    check: "Cross-aggregate scoping — every referenced resource belongs to the same ObstetricUnit as the operation's subject (shift.unit_id == encounter.unit_id on POST /care-assignments; bed.unit_id == encounter.unit_id on assign-bed and mobilize-team; staff.unit_id == unit_id on escalate targets and drill participants; item.activation_id == activationId)"
    error_id: ERR_CROSS_UNIT_REFERENCE
    http_status: 422
    applies_to: "POST /care-assignments, POST /shift-assignments, POST /labor-encounters/{encounterId}/assign-bed, POST /emergency-cesareans/{eventId}/mobilize-team, POST /fetal-monitoring-assessments/{assessmentId}/escalate, POST /cesarean-readiness-drills, POST /bundle-activations/{activationId}/checklist-items/{itemId}/complete"

  - priority: 8
    category: state
    check: "The subject resource is in a state from which this transition is declared in §1.2 (e.g. escalate-stage requires STAGE_1_IN_PROGRESS or STAGE_2_ESCALATED; validate requires DOCUMENTED; check-in requires ISSUED or CHECKED_OUT; confirm requires CAPACITY_HELD)"
    error_id: "ERR_INVALID_STATE_TRANSITION"
    http_status: 409
    applies_to: "all action endpoints"
    note: "SPECIFIC-OVER-GENERIC CARVE-OUT — this generic guard yields to a later sub-rule whenever that sub-rule names the exact reason the current status is not a declared `from:` state, so the specific id is returned instead of ERR_INVALID_STATE_TRANSITION. The complete carve-out list is: (a) shift cancel while any CareAssignment on the shift is ACTIVE -> ERR_SHIFT_HAS_ACTIVE_COVERAGE (8.08, 409); (b) induction cancel on a booking whose status == ADMITTED -> ERR_INDUCTION_ALREADY_ADMITTED (8.09, 409); (c) induction admit whose bed is not HELD by exactly this booking -> ERR_BED_HOLD_MISMATCH (8.07, 409); (d) DELETE /beds/{bedId} while an InductionBooking with status IN {CAPACITY_HELD, CONFIRMED, ADMITTED} references that bed -> ERR_BED_HAS_FUTURE_HOLDS (8.07, 409); (e) bundle rescind while highest_stage_reached >= 2 -> ERR_BUNDLE_STAGE_BLOCKS_RESCIND (8.10, 409); (f) drill abandon from a status NOT IN {SCHEDULED, IN_PROGRESS} -> ERR_DRILL_NOT_ABANDONABLE (8.10, 409); (g) abort-to-vaginal once incision_at is non-null -> ERR_CESAREAN_ALREADY_INCISED (8.10, 409); (h) close-debrief on an activation whose timeliness_score is still null -> ERR_BUNDLE_SCORE_NOT_COMPUTED (11.5, 422), which is what makes PRIORITY CONFLICT PAIR 3 at priority 10 constructible; (i) fetal escalation resolve while escalation_tier_high_water == 0 -> ERR_ESCALATION_NOT_STARTED (8.10, 409). Every other undeclared edge — replaying a terminal transition, confirming a REQUESTED booking, checking out an already CHECKED_OUT pass, activating a CANCELLED shift, deleting a CLOSED bed — still answers ERR_INVALID_STATE_TRANSITION here."

  - priority: 8.01
    category: state
    check: "The owning LaborEncounter is not in a terminal labor_phase: labor_phase NOT IN {DISCHARGED, TRANSFERRED_OUT} for any clinical write on its children (care assignments, bundles, checklist items, assessments, cesarean events, passes, reviews)"
    error_id: ERR_ENCOUNTER_PHASE_TERMINAL
    http_status: 409
    applies_to: "POST /care-assignments, POST /bundle-activations, POST /bundle-activations/{activationId}/checklist-items/{itemId}/complete, POST /fetal-monitoring-assessments, POST /emergency-cesareans, POST /support-person-passes, POST /support-person-passes/{passId}/check-in, POST /newborn-complication-reviews"
    note: "PRIORITY CONFLICT PAIR 1 (state vs business_safety) — a POST /care-assignments naming a DISCHARGED encounter AND a staff member whose credential_expires_at <= clock_now fails HERE with ERR_ENCOUNTER_PHASE_TERMINAL (409), not with the priority-11.1 ERR_STAFF_CREDENTIAL_EXPIRED (422)."

  - priority: 8.02
    category: state
    check: "The unit's derived posture permits the operation: staffing_posture != DIVERT for admissions, phase advances and drill starts; staffing_posture IN {OPEN, RATIO_STRAINED} for induction holds, confirms and admits; staffing_posture == OPEN additionally for priority_class == PATIENT_REQUEST holds"
    error_id: ERR_UNIT_POSTURE_BLOCKS_OPERATION
    http_status: 409
    applies_to: "POST /labor-encounters, POST /labor-encounters/{encounterId}/advance-phase, POST /induction-bookings/{bookingId}/hold-capacity, /confirm, /admit, POST /cesarean-readiness-drills/{drillId}/start"

  - priority: 8.03
    category: state
    check: "Parallel-axis guard — the labor_phase advance requires the staffing_state axis to be at or above the phase's floor: LATENT and ACTIVE_FIRST_STAGE require staffing_state IN {RATIO_COVERED, ONE_TO_ONE_COVERED}; SECOND_STAGE requires ONE_TO_ONE_COVERED"
    error_id: "ERR_ENCOUNTER_COVERAGE_INSUFFICIENT / ERR_ONE_TO_ONE_COVERAGE_REQUIRED"
    http_status: 409
    applies_to: "POST /labor-encounters/{encounterId}/advance-phase"

  - priority: 8.04
    category: state
    check: "Blocking-children guard — discharge requires every NewbornComplicationReview CLOSED (ERR_NEWBORN_REVIEW_OPEN), every SafetyBundleActivation IN {CLOSED, RESCINDED} (ERR_BUNDLE_NOT_CLOSED), every SupportPersonPass IN {CHECKED_OUT, REVOKED, EXPIRED} (ERR_SUPPORT_PASS_STILL_PRESENT) and staffing_state == RELEASED (ERR_CARE_ASSIGNMENT_STILL_ACTIVE), evaluated in exactly that order; transfer-out is blocked by an in-progress cesarean event (ERR_CESAREAN_EVENT_IN_PROGRESS) then by a stage-2/3 bundle (ERR_BUNDLE_STAGE_BLOCKS_TRANSFER)"
    error_id: "ERR_NEWBORN_REVIEW_OPEN / ERR_BUNDLE_NOT_CLOSED / ERR_SUPPORT_PASS_STILL_PRESENT / ERR_CARE_ASSIGNMENT_STILL_ACTIVE / ERR_CESAREAN_EVENT_IN_PROGRESS / ERR_BUNDLE_STAGE_BLOCKS_TRANSFER"
    http_status: 409
    applies_to: "POST /labor-encounters/{encounterId}/discharge, POST /labor-encounters/{encounterId}/transfer-out"

  - priority: 8.05
    category: state
    check: "Prerequisite-child guard — escalate-stage requires every stage-1 (and for stage 3, every stage-2) BundleChecklistItem to be terminal (ERR_CHECKLIST_STAGE_INCOMPLETE); a checklist item may only be completed once its stage_gate has been reached (ERR_CHECKLIST_STAGE_NOT_REACHED); resolve on the stage-3 branch requires the minted EmergencyCesareanEvent to be out of the operating room (ERR_CESAREAN_EVENT_IN_PROGRESS)"
    error_id: "ERR_CHECKLIST_STAGE_INCOMPLETE / ERR_CHECKLIST_STAGE_NOT_REACHED / ERR_CESAREAN_EVENT_IN_PROGRESS"
    http_status: 409
    applies_to: "POST /bundle-activations/{activationId}/escalate-stage, POST /bundle-activations/{activationId}/checklist-items/{itemId}/complete, POST /bundle-activations/{activationId}/resolve"

  - priority: 8.06
    category: state
    check: "Bundle uniqueness — at most one SafetyBundleActivation per (encounter_id, bundle_type) may be in a non-terminal status {ACTIVATED, STAGE_1_IN_PROGRESS, STAGE_2_ESCALATED, STAGE_3_MASSIVE_TRANSFUSION, CONTROLLED, DEBRIEF_PENDING}"
    error_id: ERR_BUNDLE_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /bundle-activations"

  - priority: 8.07
    category: state
    check: "Bed lifecycle guards — the bed must be AVAILABLE to be held or occupied (ERR_OR_BED_UNAVAILABLE for OR beds), HELD by exactly this booking to be admitted or released (ERR_BED_HOLD_MISMATCH), releasable only from AVAILABLE/BLOCKED (ERR_BED_NOT_RELEASABLE), and free of future holds to be closed (ERR_BED_HAS_FUTURE_HOLDS); the encounter must not already occupy another bed (ERR_ENCOUNTER_ALREADY_IN_BED)"
    error_id: "ERR_OR_BED_UNAVAILABLE / ERR_BED_HOLD_MISMATCH / ERR_BED_NOT_RELEASABLE / ERR_BED_HAS_FUTURE_HOLDS / ERR_ENCOUNTER_ALREADY_IN_BED"
    http_status: 409
    applies_to: "POST /induction-bookings/{bookingId}/hold-capacity, /admit, POST /labor-encounters/{encounterId}/assign-bed, POST /emergency-cesareans/{eventId}/mobilize-team, PATCH /beds/{bedId}, DELETE /beds/{bedId}"

  - priority: 8.08
    category: state
    check: "Shift and assignment guards — a CareAssignment requires ShiftAssignment.status == ACTIVE with shift_start_utc <= clock_now < shift_end_utc (ERR_SHIFT_NOT_ACTIVE); a shift cancel requires no ACTIVE CareAssignment (ERR_SHIFT_HAS_ACTIVE_COVERAGE); a relieve requires an eligible ACTIVE relieving shift of the same unit and role_slot with a different staff_id (ERR_RELIEVING_SHIFT_INELIGIBLE); activation requires shift_start_utc <= clock_now < shift_end_utc (ERR_SHIFT_WINDOW_NOT_CURRENT)"
    error_id: "ERR_SHIFT_NOT_ACTIVE / ERR_SHIFT_HAS_ACTIVE_COVERAGE / ERR_RELIEVING_SHIFT_INELIGIBLE / ERR_SHIFT_WINDOW_NOT_CURRENT"
    http_status: 409
    applies_to: "POST /care-assignments, POST /shift-assignments/{shiftId}/activate, /relieve, /cancel"

  - priority: 8.09
    category: state
    check: "Induction lifecycle guards — hold TTL not elapsed on confirm (ERR_INDUCTION_HOLD_EXPIRED), bump only below BUMP_ESCALATION_LIMIT (ERR_INDUCTION_BUMP_LIMIT_REACHED) and only for bumpable priority classes (ERR_INDUCTION_NOT_BUMPABLE), requeue only while requested_start_utc > clock_now (ERR_INDUCTION_WINDOW_PASSED), cancel only before ADMITTED (ERR_INDUCTION_ALREADY_ADMITTED)"
    error_id: "ERR_INDUCTION_HOLD_EXPIRED / ERR_INDUCTION_BUMP_LIMIT_REACHED / ERR_INDUCTION_NOT_BUMPABLE / ERR_INDUCTION_WINDOW_PASSED / ERR_INDUCTION_ALREADY_ADMITTED"
    http_status: 409
    applies_to: "POST /induction-bookings/{bookingId}/confirm, /bump, /requeue, /cancel"

  - priority: 8.10
    category: state
    check: "Escalation chain guards — escalate requires escalation_status to be the chain's current step and target_tier == escalation_tier_high_water + 1 (ERR_ESCALATION_TIER_SKIPPED); resolve requires escalation_tier_high_water >= 1 (ERR_ESCALATION_NOT_STARTED); an abort requires incision_at to be null (ERR_CESAREAN_ALREADY_INCISED); a drill abandon requires status IN {SCHEDULED, IN_PROGRESS} (ERR_DRILL_NOT_ABANDONABLE); a rescind requires highest_stage_reached <= 1 (ERR_BUNDLE_STAGE_BLOCKS_RESCIND); a rework requires rework_count < REWORK_LIMIT (ERR_REVIEW_REWORK_LIMIT_REACHED); a re-document requires revision_count < DRILL_REVISION_LIMIT (ERR_DRILL_REVISION_LIMIT_REACHED); a re-entry requires reentry_count < REENTRY_LIMIT (ERR_SUPPORT_REENTRY_LIMIT_REACHED)"
    error_id: "ERR_ESCALATION_TIER_SKIPPED / ERR_ESCALATION_NOT_STARTED / ERR_CESAREAN_ALREADY_INCISED / ERR_DRILL_NOT_ABANDONABLE / ERR_BUNDLE_STAGE_BLOCKS_RESCIND / ERR_REVIEW_REWORK_LIMIT_REACHED / ERR_DRILL_REVISION_LIMIT_REACHED / ERR_SUPPORT_REENTRY_LIMIT_REACHED"
    http_status: 409
    applies_to: "POST /fetal-monitoring-assessments/{assessmentId}/escalate, /resolve, POST /emergency-cesareans/{eventId}/abort-to-vaginal, POST /cesarean-readiness-drills/{drillId}/abandon, /document, POST /bundle-activations/{activationId}/rescind, POST /newborn-complication-reviews/{reviewId}/request-rework, POST /support-person-passes/{passId}/check-in"

  - priority: 9
    category: business_constraint
    check: "Context-required fields are present and within length bounds: rescind_reason on rescind (ERR_RESCIND_REASON_REQUIRED), invalidation_reason on invalidate (ERR_INVALIDATION_REASON_REQUIRED), debrief_notes on a DEBRIEF_PENDING close and findings_summary on submit-findings (ERR_DEBRIEF_NOTES_REQUIRED), non-empty contributing_factor_codes on submit-findings and close (ERR_CONTRIBUTING_FACTORS_REQUIRED), delivery_mode on the THIRD_STAGE_DELIVERED advance (ERR_DELIVERY_MODE_REQUIRED)"
    error_id: "ERR_RESCIND_REASON_REQUIRED / ERR_INVALIDATION_REASON_REQUIRED / ERR_DEBRIEF_NOTES_REQUIRED / ERR_CONTRIBUTING_FACTORS_REQUIRED / ERR_DELIVERY_MODE_REQUIRED"
    http_status: 422
    applies_to: "POST /bundle-activations/{activationId}/rescind, /close-debrief, POST /cesarean-readiness-drills/{drillId}/invalidate, POST /newborn-complication-reviews/{reviewId}/submit-findings, /close, POST /labor-encounters/{encounterId}/advance-phase"

  - priority: 10
    category: auth
    check: "Segregation of duties — the acting X-User-ID must not be a party to the work being reviewed: the bundle debrief closer is not any checklist performed_by_staff_id; the drill validator is not documented_by_staff_id; the review facilitator never held a CareAssignment on the encounter and the review closer is neither the facilitator nor any care participant; the emergency-cesarean closer is not in mobilized_staff_ids; the snapshot certifier is not any facilitator of a review inside the reporting window"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: "POST /bundle-activations/{activationId}/close-debrief, POST /cesarean-readiness-drills/{drillId}/validate, POST /newborn-complication-reviews/{reviewId}/schedule-debrief, /request-rework, /close, POST /emergency-cesareans/{eventId}/close, POST /quality-measure-snapshots/{snapshotId}/certify"
    note: "PRIORITY CONFLICT PAIR 3 (auth vs business_safety) — a close-debrief sent by a clinician who performed a checklist step on an activation whose timeliness_score is still null fails HERE with ERR_SEGREGATION_OF_DUTIES_VIOLATION (403), not with the priority-11.5 ERR_BUNDLE_SCORE_NOT_COMPUTED (409)."

  - priority: 11.1
    category: business_safety
    check: "Every StaffMember drawn into the operation has employment_status == ACTIVE and credential_expires_at > clock_now (strict)"
    error_id: ERR_STAFF_CREDENTIAL_EXPIRED
    http_status: 422
    applies_to: "POST /care-assignments, POST /shift-assignments, POST /shift-assignments/{shiftId}/activate, /relieve, POST /emergency-cesareans/{eventId}/mobilize-team, POST /cesarean-readiness-drills/{drillId}/document, POST /fetal-monitoring-assessments"

  - priority: 11.2
    category: business_safety
    check: "Competency and slot eligibility — ONE_TO_ONE coverage requires role_slot IN {BEDSIDE, ONE_TO_ONE_FLOAT} (ERR_ROLE_SLOT_NOT_ELIGIBLE), a TIER_IV encounter requires fetal_monitoring_cert_level == ADVANCED and any interpreter requires it to be IN {BASIC, ADVANCED} (ERR_MONITORING_CERT_INSUFFICIENT), a ONE_TO_ONE nurse holds no other ACTIVE CareAssignment (ERR_STAFF_NOT_EXCLUSIVELY_AVAILABLE), an OR_STANDBY shift requires or_circulating_qualified and drill_currency_state == CURRENT (ERR_OR_STANDBY_NOT_QUALIFIED), and an escalation target must hold the tier's required role and an ACTIVE shift (ERR_ESCALATION_TARGET_INELIGIBLE)"
    error_id: "ERR_ROLE_SLOT_NOT_ELIGIBLE / ERR_MONITORING_CERT_INSUFFICIENT / ERR_STAFF_NOT_EXCLUSIVELY_AVAILABLE / ERR_OR_STANDBY_NOT_QUALIFIED / ERR_ESCALATION_TARGET_INELIGIBLE"
    http_status: 422
    applies_to: "POST /care-assignments, POST /shift-assignments/{shiftId}/activate, POST /fetal-monitoring-assessments, POST /fetal-monitoring-assessments/{assessmentId}/escalate"

  - priority: 11.3
    category: business_safety
    check: "Fetal-monitoring gates — the latest assessment must be inside the phase's freshness window (30 minutes for ACTIVE_FIRST_STAGE, 15 for SECOND_STAGE, inclusive) (ERR_FETAL_ASSESSMENT_STALE), must not sit in an unresolved escalation state (ERR_FETAL_ESCALATION_UNRESOLVED), must not be CATEGORY_III without a declared cesarean when advancing to SECOND_STAGE (ERR_FETAL_CATEGORY_BLOCKS_PHASE) or when aborting a cesarean (ERR_FETAL_CATEGORY_BLOCKS_ABORT), and tier-3 escalation requires category == CATEGORY_III (ERR_ESCALATION_CATEGORY_INSUFFICIENT)"
    error_id: "ERR_FETAL_ASSESSMENT_STALE / ERR_FETAL_ESCALATION_UNRESOLVED / ERR_FETAL_CATEGORY_BLOCKS_PHASE / ERR_FETAL_CATEGORY_BLOCKS_ABORT / ERR_ESCALATION_CATEGORY_INSUFFICIENT"
    http_status: 422
    applies_to: "POST /labor-encounters/{encounterId}/advance-phase, POST /emergency-cesareans/{eventId}/abort-to-vaginal, POST /fetal-monitoring-assessments/{assessmentId}/escalate"

  - priority: 11.4
    category: business_safety
    check: "Cesarean readiness gates — unit.cesarean_readiness_state must be IN {READY, DEGRADED} to confirm an induction and to advance to SECOND_STAGE, and != NOT_READY to mobilize a CATEGORY_2_URGENT team (ERR_CESAREAN_READINESS_NOT_MET); the mobilized team must contain an anesthesiologist, an OR-qualified surgical tech and a neonatal resuscitator (ERR_CESAREAN_TEAM_INCOMPLETE); stage-3 escalation and tier-3 activation require an ACTIVE OR_STANDBY shift (ERR_OR_STANDBY_NOT_STAFFED); drill documentation requires an attending plus an anesthesiologist among participants (ERR_DRILL_PARTICIPANTS_INSUFFICIENT); validation requires measured_d2i_minutes <= 30 (ERR_DRILL_PERFORMANCE_FAILED)"
    error_id: "ERR_CESAREAN_READINESS_NOT_MET / ERR_CESAREAN_TEAM_INCOMPLETE / ERR_OR_STANDBY_NOT_STAFFED / ERR_DRILL_PARTICIPANTS_INSUFFICIENT / ERR_DRILL_PERFORMANCE_FAILED"
    http_status: 422
    applies_to: "POST /induction-bookings/{bookingId}/confirm, POST /labor-encounters/{encounterId}/advance-phase, POST /emergency-cesareans/{eventId}/mobilize-team, POST /bundle-activations/{activationId}/escalate-stage, POST /fetal-monitoring-assessments/{assessmentId}/escalate, POST /cesarean-readiness-drills/{drillId}/document, /validate"
    note: "PRIORITY CONFLICT PAIR 2 (business_safety vs business_fiscal) — a confirm on a unit whose cesarean_readiness_state == NOT_READY AND whose day is already at max_daily_induction_bed_minutes fails HERE with ERR_CESAREAN_READINESS_NOT_MET (422), not with the priority-15 ERR_INDUCTION_CAPACITY_EXCEEDED (409)."

  - priority: 11.5
    category: business_safety
    check: "Bundle clinical criteria — activation requires its objective trigger to be met (QBL_THRESHOLD needs quantitative_blood_loss_ml >= ACTIVATION_QBL_ML 1000; BP_THRESHOLD needs systolic_mmhg >= 160 OR diastolic_mmhg >= 110; CLINICIAN_JUDGMENT needs neither) (ERR_ACTIVATION_CRITERIA_NOT_MET); stage escalation requires its stage threshold (ERR_BUNDLE_STAGE_CRITERIA_NOT_MET); resolve requires no further blood-loss increase (ERR_BUNDLE_NOT_CONTROLLED); close-debrief requires a non-null timeliness_score (ERR_BUNDLE_SCORE_NOT_COMPUTED)"
    error_id: "ERR_ACTIVATION_CRITERIA_NOT_MET / ERR_BUNDLE_STAGE_CRITERIA_NOT_MET / ERR_BUNDLE_NOT_CONTROLLED / ERR_BUNDLE_SCORE_NOT_COMPUTED"
    http_status: 422
    applies_to: "POST /bundle-activations, /escalate-stage, /resolve, /close-debrief"

  - priority: 11.6
    category: business_safety
    check: "Visitation safety — a pass may not be used past valid_until (ERR_SUPPORT_PASS_EXPIRED), a DOULA_CERTIFIED pass requires doula_certification_expires_at > clock_now at issuance and at every check-in (ERR_DOULA_CREDENTIAL_EXPIRED), and no check-in is admitted while an EmergencyCesareanEvent on the encounter is IN {TEAM_MOBILIZED, INCISION_RECORDED} unless the pass is a DOULA_CERTIFIED pass with or_credentialed == true (ERR_VISITATION_RESTRICTED_BY_PROCEDURE)"
    error_id: "ERR_SUPPORT_PASS_EXPIRED / ERR_DOULA_CREDENTIAL_EXPIRED / ERR_VISITATION_RESTRICTED_BY_PROCEDURE"
    http_status: 422
    applies_to: "POST /support-person-passes, POST /support-person-passes/{passId}/check-in"

  - priority: 11.7
    category: business_safety
    check: "Delivery-mode coherence — a cesarean delivery_mode requires a DELIVERED/REVIEW_PENDING/CLOSED EmergencyCesareanEvent (ERR_CESAREAN_EVENT_NOT_DELIVERED); prior_cesarean == true forbids CESAREAN_PRIMARY (ERR_DELIVERY_MODE_CONFLICTS_HISTORY); episiotomy_performed == true requires a vaginal delivery_mode (ERR_EPISIOTOMY_MODE_CONFLICT)"
    error_id: "ERR_CESAREAN_EVENT_NOT_DELIVERED / ERR_DELIVERY_MODE_CONFLICTS_HISTORY / ERR_EPISIOTOMY_MODE_CONFLICT"
    http_status: 422
    applies_to: "POST /labor-encounters/{encounterId}/advance-phase"

  - priority: 11.8
    category: business_safety
    check: "Elective-induction compliance — a booking whose priority_class == ELECTIVE_39_WEEK may only be confirmed when gestational_age_weeks >= 39 (inclusive), and a booking with indication_code == ELECTIVE_NO_INDICATION and gestational_age_weeks < 39 can never leave REQUESTED"
    error_id: ERR_ELECTIVE_INDUCTION_GESTATIONAL_AGE
    http_status: 422
    applies_to: "POST /induction-bookings/{bookingId}/hold-capacity, /confirm"

  - priority: 12
    category: business_referential
    check: "The acting clinician is attached to the case: a checklist performer holds an ACTIVE CareAssignment on the encounter or an ACTIVE CHARGE/OR_STANDBY shift on the unit (ERR_PERFORMER_NOT_ON_CASE); an assessment interpreter likewise; a drill documenter is listed in participant_staff_ids"
    error_id: ERR_PERFORMER_NOT_ON_CASE
    http_status: 422
    applies_to: "POST /bundle-activations/{activationId}/checklist-items/{itemId}/complete, POST /fetal-monitoring-assessments, POST /cesarean-readiness-drills/{drillId}/document"
    note: "PRIORITY CONFLICT PAIR 5 (business_referential vs business_temporal) — a checklist complete whose performed_by_staff_id is not on the case AND whose completed_at precedes activation.activated_at fails HERE with ERR_PERFORMER_NOT_ON_CASE (422), not with the priority-14 ERR_CHECKLIST_TIMESTAMP_OUT_OF_RANGE (400)."

  - priority: 13.1
    category: business_constraint
    check: "Uniqueness — patient_record_code is unique per unit_id across LaborEncounter rows in non-terminal labor phases (ERR_DUPLICATE_PATIENT_RECORD_CODE); bed_label is unique per (unit_id, bed_label) among Bed rows with status != CLOSED (ERR_DUPLICATE_BED_LABEL); unit_name is unique across units (ERR_DUPLICATE_UNIT_NAME)"
    error_id: "ERR_DUPLICATE_PATIENT_RECORD_CODE / ERR_DUPLICATE_BED_LABEL / ERR_DUPLICATE_UNIT_NAME"
    http_status: 409
    applies_to: "POST /obstetric-units, POST /obstetric-units/{unitId}/beds, POST /labor-encounters, POST /induction-bookings/{bookingId}/admit"

  - priority: 13.2
    category: business_constraint
    check: "Staff interval overlap (HALF-OPEN semantics) — a new ShiftAssignment for a staff_id must not overlap any existing ShiftAssignment of that staff_id with status IN {SCHEDULED, ACTIVE}, where windows are [shift_start_utc, shift_end_utc) and touching endpoints (previous end == new start) DO NOT overlap; the window must also satisfy shift_end_utc - shift_start_utc <= MAX_SHIFT_MINUTES (720) (ERR_SHIFT_WINDOW_TOO_LONG)"
    error_id: "ERR_SHIFT_WINDOW_OVERLAP / ERR_SHIFT_WINDOW_TOO_LONG"
    http_status: 409
    applies_to: "POST /shift-assignments"

  - priority: 13.3
    category: business_constraint
    check: "Bed interval overlap (CLOSED semantics plus frozen turnover buffer) — a hold must not collide with any InductionBooking on the same bed with status IN {CAPACITY_HELD, CONFIRMED, ADMITTED}, where the existing window is [requested_start_utc, requested_start_utc + projected_occupancy_minutes] and the new window is [requested_start_utc, requested_start_utc + expected_labor_minutes]; endpoints that merely touch DO collide. The bed must also be of the required bed_type (ERR_BED_TYPE_NOT_ELIGIBLE). An encounter leaving PRE_ADMISSION must already hold a bed_id whose Bed.status == OCCUPIED and Bed.bed_type == LDR (ERR_ENCOUNTER_BED_NOT_ASSIGNED)"
    error_id: "ERR_BED_TURNOVER_CONFLICT / ERR_BED_TYPE_NOT_ELIGIBLE / ERR_ENCOUNTER_BED_NOT_ASSIGNED"
    http_status: 409
    applies_to: "POST /induction-bookings/{bookingId}/hold-capacity, POST /labor-encounters/{encounterId}/assign-bed, POST /labor-encounters/{encounterId}/advance-phase, POST /emergency-cesareans/{eventId}/mobilize-team"
    note: "PRIORITY CONFLICT PAIR 4 (business_constraint vs business_fiscal) — a hold-capacity whose bed window touches an existing hold AND whose day is already at max_daily_induction_bed_minutes fails HERE with ERR_BED_TURNOVER_CONFLICT (409), not with the priority-15 ERR_INDUCTION_CAPACITY_EXCEEDED (409)."

  - priority: 14.1
    category: business_temporal
    check: "Supplied clinical timestamps lie inside their legal range: activation.activated_at <= completed_at <= clock_now (ERR_CHECKLIST_TIMESTAMP_OUT_OF_RANGE); decision_at < incision_at <= delivery_at <= clock_now on cesarean events (ERR_CESAREAN_TIMESTAMP_OUT_OF_RANGE); decision_at < incision_at <= clock_now on drills (ERR_DRILL_TIMESTAMP_OUT_OF_RANGE); assessed_at defaults to clock_now and any supplied value must satisfy encounter.admitted_at <= assessed_at <= clock_now (ERR_ASSESSMENT_TIMESTAMP_OUT_OF_RANGE)"
    error_id: "ERR_CHECKLIST_TIMESTAMP_OUT_OF_RANGE / ERR_CESAREAN_TIMESTAMP_OUT_OF_RANGE / ERR_DRILL_TIMESTAMP_OUT_OF_RANGE / ERR_ASSESSMENT_TIMESTAMP_OUT_OF_RANGE"
    http_status: 400
    applies_to: "POST /bundle-activations/{activationId}/checklist-items/{itemId}/complete, POST /emergency-cesareans/{eventId}/record-incision, /record-delivery, POST /cesarean-readiness-drills/{drillId}/document, POST /fetal-monitoring-assessments"

  - priority: 14.2
    category: business_temporal
    check: "Windows and deadlines — an escalate must arrive at clock_now <= escalation_due_at (ERR_ESCALATION_WINDOW_EXPIRED); a debrief must be scheduled with clock_now <= debrief_scheduled_for_utc <= debrief_due_at (ERR_DEBRIEF_WINDOW_VIOLATION) and findings submitted only once clock_now >= debrief_scheduled_for_utc (ERR_DEBRIEF_NOT_HELD); a drill starts only once clock_now >= scheduled_for_utc (ERR_DRILL_NOT_DUE); an admit needs clock_now >= requested_start_utc - 30 minutes (ERR_INDUCTION_ADMIT_TOO_EARLY); a booking's requested_start_utc must be > clock_now at creation (ERR_BOOKING_START_IN_PAST); a snapshot window must satisfy period_start_utc < period_end_utc (ERR_MEASURE_PERIOD_INVALID)"
    error_id: "ERR_ESCALATION_WINDOW_EXPIRED / ERR_DEBRIEF_WINDOW_VIOLATION / ERR_DEBRIEF_NOT_HELD / ERR_DRILL_NOT_DUE / ERR_INDUCTION_ADMIT_TOO_EARLY / ERR_BOOKING_START_IN_PAST / ERR_MEASURE_PERIOD_INVALID"
    http_status: 422
    applies_to: "POST /fetal-monitoring-assessments/{assessmentId}/escalate, POST /newborn-complication-reviews/{reviewId}/schedule-debrief, /submit-findings, POST /cesarean-readiness-drills/{drillId}/start, POST /induction-bookings, /admit, POST /obstetric-units/{unitId}/quality-measure-snapshots"

  - priority: 15
    category: business_fiscal
    check: "Capacity and quota, checked last — a CareAssignment must fit the shift (shift.assigned_acuity_load_units + calc care_assignment_unit_debit <= shift.capacity_units_effective, inclusive) (ERR_STAFF_ACUITY_CAPACITY_EXCEEDED); a hold or confirm must fit the day (day_load + projected_occupancy_minutes <= unit.max_daily_induction_bed_minutes, inclusive) (ERR_INDUCTION_CAPACITY_EXCEEDED); a check-in must fit the room (checked-in count + 1 <= calc support_person_occupancy allowance, inclusive) (ERR_SUPPORT_OCCUPANCY_EXCEEDED)"
    error_id: "ERR_STAFF_ACUITY_CAPACITY_EXCEEDED / ERR_INDUCTION_CAPACITY_EXCEEDED / ERR_SUPPORT_OCCUPANCY_EXCEEDED"
    http_status: 409
    applies_to: "POST /care-assignments, POST /shift-assignments/{shiftId}/relieve, POST /induction-bookings/{bookingId}/hold-capacity, /confirm, POST /support-person-passes/{passId}/check-in"

  - priority: 16
    category: business_constraint
    check: "Reporting completeness — certification requires both measure denominators >= 1 (ERR_EMPTY_MEASURE_DENOMINATOR), a closed reporting period with period_end_utc <= clock_now (ERR_MEASURE_PERIOD_NOT_CLOSED), and every SafetyBundleActivation of the delivery cohort in a terminal status (ERR_BUNDLE_NOT_CLOSED)"
    error_id: "ERR_EMPTY_MEASURE_DENOMINATOR / ERR_MEASURE_PERIOD_NOT_CLOSED / ERR_BUNDLE_NOT_CLOSED"
    http_status: 409
    applies_to: "POST /quality-measure-snapshots/{snapshotId}/certify"
    note: "Empty-collection boundary: a window in which every encounter transferred out before delivering yields both denominators 0, both rates null and a null composite; the DRAFT snapshot is still creatable and readable but never certifiable."

# =============================================================================
# §1.5 API Endpoint Table
# Conventions: kebab-case plural collections, camelCase path params, action
# endpoints as POST /<collection>/{id}/<verb-phrase>.  Every endpoint carries
# X-User-ID and X-User-Role headers (validation priority 1/2).  Every list
# endpoint accepts limit?/offset? and returns the §1.0 pagination fields.
#
#   input:                 declared body/query fields; "?" marks OPTIONAL
#   input_types:           per-field type + required-ness
#   output:                response `data` shape (Entity | Entity[] | report)
#   validation_priorities: §1.4 rows that apply, in ASCENDING evaluation order
#   transitions:           §1.2 edges this endpoint fires (own + cascaded)
#   side_effects:          §1.3 calculations re-run and version bumps
#   error_ids:             every error_id this endpoint can return
#
# There is NO seeded data: every entity below is reachable from an empty DB
# through these endpoints alone.  Two test-driving endpoints live in the
# `/_<name>` namespace (POST /_clock/set_current_utc, GET /_clock); the
# capacity sweep is a real operator action on the unit, not a back door.
# =============================================================================
endpoints:

  # ---------------------------------------------------------------- clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the logical clock (clock_now) that every deadline, window, expiry and freshness rule in this scaffold reads. The server's startup default is exactly 2026-08-01T00:00:00Z and the clock NEVER falls back to real wall-clock time. Time may be moved forward or backward; no entity state changes on this call (deadline consequences are realised by POST /obstetric-units/{unitId}/capacity-sweep)."
    roles: [ChargeNurse, BedsideNurse, ObstetricianAttending, AnesthesiaLead, PerinatalSafetyOfficer, PatientAccessCoordinator]
    code: 200
    input: [current_utc]
    input_types: { current_utc: "datetime ISO8601, required" }
    output: ClockState
    output_fields: { current_utc: "datetime — the new clock_now", previous_utc: "datetime — the value before this call" }
    validation_priorities: [1, 2, 5]
    transitions: []
    side_effects: ["None; no derived field is recomputed and no version is bumped"]
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_INVALID_FIELD_VALUE]

  - method: GET
    path: "/_clock"
    description: "Reads the logical clock so a test or operator can assert which instant every temporal rule is being evaluated against; returns 2026-08-01T00:00:00Z before the first set_current_utc call."
    roles: [ChargeNurse, BedsideNurse, ObstetricianAttending, AnesthesiaLead, PerinatalSafetyOfficer, PatientAccessCoordinator]
    code: 200
    input: []
    input_types: {}
    output: ClockState
    output_fields: { current_utc: "datetime — current clock_now", previous_utc: "datetime — null when never set" }
    validation_priorities: [1, 2]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS]

  # -------------------------------------------------------- obstetric unit ----
  - method: POST
    path: "/obstetric-units"
    description: "Creates an ObstetricUnit, the root aggregate. staffing_posture starts OPEN, cesarean_readiness_state starts NOT_READY (no validated drill yet), turnover_buffer_minutes starts 45, both bed-minute maps start empty and last_capacity_sweep_at starts null."
    roles: [PerinatalSafetyOfficer]
    code: 201
    input: [unit_name, licensed_ldr_beds, licensed_or_rooms, "max_daily_induction_bed_minutes?"]
    input_types: { unit_name: "string 1..120, required, unique across units", licensed_ldr_beds: "integer >= 1, required", licensed_or_rooms: "integer >= 1, required", max_daily_induction_bed_minutes: "integer >= 0, optional, default 2880" }
    output: ObstetricUnit
    validation_priorities: [1, 2, 5, 13.1]
    transitions: []
    side_effects: ["staffing_posture := OPEN and cesarean_readiness_state := NOT_READY by calc unit_posture_derivation / calc cesarean_readiness_derivation on an empty unit; version := 1"]
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_INVALID_FIELD_VALUE, ERR_DUPLICATE_UNIT_NAME]

  - method: GET
    path: "/obstetric-units"
    description: "Lists ObstetricUnit rows, ordered created_at ASC (final tie-break created_at ASC; `id` is never an ordering key)."
    roles: [ChargeNurse, BedsideNurse, ObstetricianAttending, AnesthesiaLead, PerinatalSafetyOfficer, PatientAccessCoordinator]
    code: 200
    input: ["staffing_posture?", "cesarean_readiness_state?", "limit?", "offset?"]
    input_types: { staffing_posture: "enum OPEN|RATIO_STRAINED|INDUCTION_FROZEN|DIVERT, optional", cesarean_readiness_state: "enum READY|DEGRADED|NOT_READY, optional", limit: "integer 1..100, optional, default 10", offset: "integer >= 0, optional, default 0" }
    output: ObstetricUnit[]
    validation_priorities: [1, 2, 5]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_INVALID_FIELD_VALUE]

  - method: GET
    path: "/obstetric-units/{unitId}"
    description: "Reads one ObstetricUnit including every derived field of calc unit_posture_derivation (staffing_posture, coverage_deficit_units, turnover_buffer_minutes), calc cesarean_readiness_derivation (cesarean_readiness_state), the two breach counters, both bed-minute maps and `version` (the value an OCC caller must echo as expected_unit_version)."
    roles: [ChargeNurse, BedsideNurse, ObstetricianAttending, AnesthesiaLead, PerinatalSafetyOfficer, PatientAccessCoordinator]
    code: 200
    input: []
    input_types: {}
    output: ObstetricUnit
    validation_priorities: [1, 2, 3]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_UNIT_NOT_FOUND]

  - method: PATCH
    path: "/obstetric-units/{unitId}"
    description: "Adjusts the unit's daily induction bed-minute budget. unit_name, licensed bed counts and every computed field are immutable here; changing the budget never bumps posture on its own but changes the outcome of the priority-15 capacity test."
    roles: [PerinatalSafetyOfficer]
    code: 200
    input: [max_daily_induction_bed_minutes]
    input_types: { max_daily_induction_bed_minutes: "integer >= 0, required" }
    output: ObstetricUnit
    validation_priorities: [1, 2, 3, 5]
    transitions: []
    side_effects: ["increments unit.version (so a stale expected_unit_version is observable)"]
