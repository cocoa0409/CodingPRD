# ---------------------------------------------------------------------------
# §1.9 Scaffold Corner Design — task_2786_theme_park_ride_maintenance_daily_inspection
#
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7. Every instance is reachable from
# an empty DB using only endpoints declared in §1.5. The logical clock starts at
# exactly 2026-08-01T00:00:00Z, so an instance that never calls
# POST /_clock/set_current_utc is anchored there.
#
# Non-existent-id literal used throughout: 00000000-0000-4000-8000-000000000000
# ---------------------------------------------------------------------------

scaffold_corner_design:

  - section: entities
    instances:

      - name: attraction_create_returns_201_with_all_declared_fields_and_system_defaults
        claim_type: creation
        grounds:
          - "endpoints[POST /park-ops/attractions]"
          - "entities.Attraction"
          - "response_envelope.success"
        distinguishing_aspect: "A single POST with every required input returns 201 and a body carrying all 17 Attraction fields plus id/created_at/updated_at/version, with every computed field at its declared default and operational_posture already derived as CLOSED_PENDING_INSPECTION."
        test_recipe:
          setup:
            - "Empty DB. Logical clock at its process-start value 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /park-ops/attractions"
              payload: { name: "Thunder Ridge", park_area: "FRONTIER", manufacturer: "Vekoma", model_code: "SLC-689", ride_class: "THRILL", theoretical_hourly_capacity: 1100, min_operators_required: 3, parts_budget_cents: 5000000, mean_repair_minutes: 75 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_id: "$.data.id" }
          assert:
            - "HTTP status is 201"
            - "response_type == \"object\" and meta.api_request_id and meta.api_request_timestamp are both non-null strings"
            - "Attraction.${a_id}.name == \"Thunder Ridge\" and park_area == \"FRONTIER\" and ride_class == \"THRILL\""
            - "Attraction.${a_id}.theoretical_hourly_capacity == 1100 and min_operators_required == 3 and parts_budget_cents == 5000000"
            - "Attraction.${a_id}.mean_repair_minutes == 75"
            - "Attraction.${a_id}.parts_budget_committed_cents == 0 and cumulative_cycles == 0 and ytd_downtime_minutes == 0"
            - "Attraction.${a_id}.regulatory_hold == false and certified_operator_count == 0"
            - "Attraction.${a_id}.active_template_id is null and last_signed_off_service_date is null"
            - "Attraction.${a_id}.operational_posture == \"CLOSED_PENDING_INSPECTION\""
            - "Attraction.${a_id}.version == 1 and id, created_at, updated_at are all non-null"

      - name: attraction_and_child_defaults_are_applied_when_optional_inputs_omitted
        claim_type: defaults
        grounds:
          - "entities.Attraction.fields.mean_repair_minutes"
          - "entities.ChecklistItem.fields.requires_photo"
          - "entities.OverhaulWorkOrder.fields.expedite_requested"
          - "calculations.overhaul_cost_estimate"
        distinguishing_aspect: "Omitting mean_repair_minutes yields exactly 120, omitting requires_photo yields false, and omitting expedite_requested yields expedite_pct 0 with estimated_total_cents == discounted_base_cents == 1380000 rather than any expedited figure."
        test_recipe:
          setup:
            - "One attraction created without mean_repair_minutes; one DRAFT template with one checklist item created without requires_photo; one shop bay; one non-off-season work order created without expedite_requested."
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Lagoon Racer", park_area: "LAGOON", manufacturer: "Mack", model_code: "PW-12", ride_class: "FAMILY", theoretical_hourly_capacity: 900, min_operators_required: 2, parts_budget_cents: 9000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_id: "$.data.id" }
            - call: "POST /park-ops/components"
              payload: { attraction_id: "${a_id}", name: "Main Gearbox", component_type: "GEARBOX", criticality: "ESSENTIAL", ndt_interval_cycles: 500000, ndt_interval_days: 3650 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { c_id: "$.data.id" }
            - call: "POST /park-ops/inspection-templates"
              payload: { attraction_id: "${a_id}", effective_from_date: "2026-08-01" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { t_id: "$.data.id" }
            - call: "POST /park-ops/shop-bays"
              payload: { name: "Bay Alpha", concurrent_slot_capacity: 1 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { bay_id: "$.data.id", bay_v: "$.data.version" }
          trigger:
            - call: "GET /park-ops/attractions/${a_id}"
              payload: {}
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "POST /park-ops/inspection-templates/${t_id}/items"
              payload: { sequence_no: 1, description: "Verify gearbox oil level", severity_class: "ADVISORY" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { ci_id: "$.data.id" }
            - call: "POST /park-ops/overhaul-work-orders"
              payload: { attraction_id: "${a_id}", component_id: "${c_id}", shop_bay_id: "${bay_id}", expected_shop_bay_version: "${bay_v}", window_start_date: "2026-09-10", window_end_date: "2026-09-12", parts_subtotal_cents: 1000000, labor_hours: 40 }
              as: MaintenanceManager
              as_user_id: "mgr-1"
              captures: { w_id: "$.data.id" }
          assert:
            - "Attraction.${a_id}.mean_repair_minutes == 120"
            - "ChecklistItem.${ci_id}.requires_photo == false"
            - "ChecklistItem.${ci_id}.component_id is null"
            - "OverhaulWorkOrder.${w_id}.expedite_requested == false and expedite_pct == 0 and expedite_fee_cents == 0"
            - "OverhaulWorkOrder.${w_id}.off_season == false and base_total_cents == 1380000 and off_season_discount_cents == 0"
            - "OverhaulWorkOrder.${w_id}.discounted_base_cents == 1380000 and estimated_total_cents == 1380000"

      - name: attraction_create_with_client_supplied_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - "entities.Attraction.fields.cumulative_cycles"
          - "endpoints[POST /park-ops/attractions]"
        distinguishing_aspect: "id, created_at, updated_at, version and cumulative_cycles sent in the request body are discarded: the server mints its own id, sets version 1 and cumulative_cycles 0, and the supplied id is not retrievable."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /park-ops/attractions"
              payload: { name: "Skyline Drop", park_area: "SKYLINE", manufacturer: "Intamin", model_code: "GD-40", ride_class: "THRILL", theoretical_hourly_capacity: 800, min_operators_required: 3, parts_budget_cents: 4000000, id: "00000000-0000-4000-8000-000000000000", created_at: "2001-01-01T00:00:00.000Z", updated_at: "2001-01-01T00:00:00.000Z", version: 77, cumulative_cycles: 999999 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_id: "$.data.id" }
            - call: "GET /park-ops/attractions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ParkOpsAdmin
              as_user_id: "admin-1"
          assert:
            - "First call returns 201 and Attraction.${a_id}.id != \"00000000-0000-4000-8000-000000000000\""
            - "Attraction.${a_id}.version == 1 and cumulative_cycles == 0"
            - "Attraction.${a_id}.created_at != \"2001-01-01T00:00:00.000Z\" and updated_at != \"2001-01-01T00:00:00.000Z\""
            - "Second call returns 404 with error_id == \"ERR_ATTRACTION_NOT_FOUND\""

      - name: attraction_create_with_client_supplied_computed_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - "entities.Attraction.fields.operational_posture"
          - "entities.Attraction.fields.parts_budget_committed_cents"
          - "calculations.operational_posture_derivation"
        distinguishing_aspect: "operational_posture OPEN, regulatory_hold true, parts_budget_committed_cents 123456 and certified_operator_count 9 in the body are all ignored; the server re-derives CLOSED_PENDING_INSPECTION, false, 0 and 0."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /park-ops/attractions"
              payload: { name: "Kids Cove Carousel", park_area: "KIDS_COVE", manufacturer: "Chance", model_code: "CAR-2", ride_class: "KIDDIE", theoretical_hourly_capacity: 600, min_operators_required: 1, parts_budget_cents: 1000000, operational_posture: "OPEN", regulatory_hold: true, parts_budget_committed_cents: 123456, certified_operator_count: 9, ytd_downtime_minutes: 500 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_id: "$.data.id" }
          assert:
            - "HTTP status is 201"
            - "Attraction.${a_id}.operational_posture == \"CLOSED_PENDING_INSPECTION\" (derivation clause 4: last_signed_off_service_date is null)"
            - "Attraction.${a_id}.regulatory_hold == false"
            - "Attraction.${a_id}.parts_budget_committed_cents == 0 and certified_operator_count == 0 and ytd_downtime_minutes == 0"

      - name: component_retrieval_returns_stored_row_with_initialised_ndt_baselines
        claim_type: retrieval
        grounds:
          - "endpoints[GET /park-ops/components/{id}]"
          - "entities.ComponentAsset.fields.last_ndt_at"
          - "entities.ComponentAsset.fields.last_ndt_cycles"
        distinguishing_aspect: "GET /park-ops/components/{id} returns the stored row with last_ndt_at exactly the creating request's logical clock instant 2026-08-01T00:00:00Z, last_ndt_cycles 0, last_ndt_method null, ndt_status CURRENT and condition_flag OK."
        test_recipe:
          setup:
            - "One attraction; one SAFETY_CRITICAL component created at the process-start clock 2026-08-01T00:00:00Z with cumulative_cycles still 0."
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Frontier Flyer", park_area: "FRONTIER", manufacturer: "Zierer", model_code: "FL-8", ride_class: "FAMILY", theoretical_hourly_capacity: 700, min_operators_required: 2, parts_budget_cents: 3000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_id: "$.data.id" }
            - call: "POST /park-ops/components"
              payload: { attraction_id: "${a_id}", name: "Left Brake Caliper", component_type: "BRAKE", criticality: "SAFETY_CRITICAL", ndt_interval_cycles: 40000, ndt_interval_days: 180 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "GET /park-ops/components/${c_id}"
              payload: {}
              as: QualifiedInspector
              as_user_id: "insp-1"
          assert:
            - "HTTP status is 200 and response_type == \"object\""
            - "ComponentAsset.${c_id}.attraction_id == \"${a_id}\" and name == \"Left Brake Caliper\" and component_type == \"BRAKE\""
            - "ComponentAsset.${c_id}.criticality == \"SAFETY_CRITICAL\" and ndt_interval_cycles == 40000 and ndt_interval_days == 180"
            - "ComponentAsset.${c_id}.last_ndt_at == \"2026-08-01T00:00:00.000Z\" and last_ndt_cycles == 0"
            - "ComponentAsset.${c_id}.last_ndt_method is null"
            - "ComponentAsset.${c_id}.ndt_status == \"CURRENT\" and condition_flag == \"OK\""
            - "ComponentAsset.${c_id}.version == 1"

      - name: attraction_listing_paginates_filters_and_bounds_the_limit_range
        claim_type: listing
        grounds:
          - "endpoints[GET /park-ops/attractions]"
          - "response_envelope.pagination_fields"
          - "response_envelope.pagination_defaults"
          - "validations[priority 5]"
        distinguishing_aspect: "With three attractions (two in FRONTIER, one in LAGOON): limit 2 returns 2 rows with total_count 3 and has_more true; offset 2 returns 1 row with has_more false; the park_area filter narrows total_count to 2; limit 0 and limit 101 are both refused with ERR_INVALID_REQUEST because the declared range is 1..100."
        test_recipe:
          setup:
            - "Three attractions created in a fixed order: two with park_area FRONTIER, one with park_area LAGOON."
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Alpha Coaster", park_area: "FRONTIER", manufacturer: "Vekoma", model_code: "SLC-689", ride_class: "THRILL", theoretical_hourly_capacity: 1000, min_operators_required: 3, parts_budget_cents: 2000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a1: "$.data.id" }
            - call: "POST /park-ops/attractions"
              payload: { name: "Beta Splash", park_area: "LAGOON", manufacturer: "Mack", model_code: "PW-12", ride_class: "WATER", theoretical_hourly_capacity: 800, min_operators_required: 2, parts_budget_cents: 2000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a2: "$.data.id" }
            - call: "POST /park-ops/attractions"
              payload: { name: "Gamma Mine Train", park_area: "FRONTIER", manufacturer: "Vekoma", model_code: "MT-3", ride_class: "FAMILY", theoretical_hourly_capacity: 600, min_operators_required: 2, parts_budget_cents: 2000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a3: "$.data.id" }
          trigger:
            - call: "GET /park-ops/attractions"
              payload: { limit: 2, offset: 0 }
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "GET /park-ops/attractions"
              payload: { limit: 2, offset: 2 }
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "GET /park-ops/attractions"
              payload: { park_area: "FRONTIER" }
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "GET /park-ops/attractions"
              payload: { limit: 0 }
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "GET /park-ops/attractions"
              payload: { limit: 101 }
              as: MaintenanceManager
              as_user_id: "mgr-1"
          assert:
            - "Call 1: response_type == \"array\", len(data) == 2, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "Call 2: len(data) == 1, total_count == 3, offset == 2, has_more == false"
            - "Call 3: len(data) == 2, total_count == 2, limit == 10 (declared default), offset == 0, has_more == false; the returned ids are exactly {${a1}, ${a3}}"
            - "Call 4: HTTP 400 with error_id == \"ERR_INVALID_REQUEST\""
            - "Call 5: HTTP 400 with error_id == \"ERR_INVALID_REQUEST\""

      - name: attraction_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "validations[priority 5]"
          - "errors[ERR_INVALID_REQUEST]"
          - "entities.Attraction.fields.theoretical_hourly_capacity"
        distinguishing_aspect: "theoretical_hourly_capacity has source input and no default, so omitting it returns ERR_INVALID_REQUEST 400 and no Attraction row is created (the subsequent list is empty)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /park-ops/attractions"
              payload: { name: "No Capacity Ride", park_area: "SKYLINE", manufacturer: "Intamin", model_code: "GD-40", ride_class: "THRILL", min_operators_required: 2, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { err: "$.data.error_id" }
            - call: "GET /park-ops/attractions"
              payload: {}
              as: ParkOpsAdmin
              as_user_id: "admin-1"
          assert:
            - "HTTP status is 400 and ${err} == \"ERR_INVALID_REQUEST\""
            - "response_type == \"error\" and data.message is a non-empty string"
            - "The follow-up list returns total_count == 0"

      - name: attraction_create_invalid_enum_and_out_of_range_integer_rejected
        claim_type: type_constraints
        grounds:
          - "validations[priority 5]"
          - "entities.Attraction.fields.park_area"
          - "entities.Attraction.fields.theoretical_hourly_capacity"
          - "entities.ComponentAsset.fields.criticality"
        distinguishing_aspect: "park_area MIDWAY is outside the declared enum, theoretical_hourly_capacity 0 is below the declared >= 1 floor, and criticality CRITICAL is outside ComponentAsset's enum — all three return ERR_INVALID_REQUEST 400, never a 422 or a silent coercion."
        test_recipe:
          setup:
            - "One valid attraction exists so that the component call fails on the enum, not on the FK."
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Enum Probe", park_area: "SKYLINE", manufacturer: "Intamin", model_code: "GD-40", ride_class: "THRILL", theoretical_hourly_capacity: 800, min_operators_required: 2, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_id: "$.data.id" }
          trigger:
            - call: "POST /park-ops/attractions"
              payload: { name: "Bad Area", park_area: "MIDWAY", manufacturer: "Intamin", model_code: "GD-40", ride_class: "THRILL", theoretical_hourly_capacity: 800, min_operators_required: 2, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "POST /park-ops/attractions"
              payload: { name: "Zero Capacity", park_area: "SKYLINE", manufacturer: "Intamin", model_code: "GD-40", ride_class: "THRILL", theoretical_hourly_capacity: 0, min_operators_required: 2, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "POST /park-ops/components"
              payload: { attraction_id: "${a_id}", name: "Bad Criticality", component_type: "AXLE", criticality: "CRITICAL", ndt_interval_cycles: 1000, ndt_interval_days: 90 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
          assert:
            - "All three calls return HTTP 400 with error_id == \"ERR_INVALID_REQUEST\""
            - "GET /park-ops/attractions still reports total_count == 1"
            - "GET /park-ops/components?attraction_id=${a_id} reports total_count == 0"

      - name: checklist_item_is_immutable_and_exposes_no_version_field
        claim_type: immutability
        grounds:
          - "entities.ChecklistItem"
          - "endpoints[GET /park-ops/checklist-items/{id}]"
          - "endpoints[GET /park-ops/checklist-items]"
        distinguishing_aspect: "ChecklistItem is declared common_fields false: its read body carries template_id, component_id, sequence_no, description, severity_class and requires_photo but no version and no updated_at, and §1.5 exposes no PUT/PATCH/DELETE for it."
        test_recipe:
          setup:
            - "One attraction, one DRAFT template, one checklist item bound to a component."
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Immutable Probe", park_area: "FRONTIER", manufacturer: "Zierer", model_code: "FL-8", ride_class: "FAMILY", theoretical_hourly_capacity: 700, min_operators_required: 2, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_id: "$.data.id" }
            - call: "POST /park-ops/components"
              payload: { attraction_id: "${a_id}", name: "Restraint Actuator 1", component_type: "RESTRAINT_ACTUATOR", criticality: "SAFETY_CRITICAL", ndt_interval_cycles: 900000, ndt_interval_days: 3650 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { c_id: "$.data.id" }
            - call: "POST /park-ops/inspection-templates"
              payload: { attraction_id: "${a_id}", effective_from_date: "2026-08-01" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { t_id: "$.data.id" }
            - call: "POST /park-ops/inspection-templates/${t_id}/items"
              payload: { sequence_no: 1, description: "Cycle restraint actuator", severity_class: "SAFETY_CRITICAL", component_id: "${c_id}", requires_photo: true }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { ci_id: "$.data.id" }
          trigger:
            - call: "GET /park-ops/checklist-items/${ci_id}"
              payload: {}
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "GET /park-ops/checklist-items"
              payload: { template_id: "${t_id}" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
          assert:
            - "ChecklistItem.${ci_id}.template_id == \"${t_id}\" and component_id == \"${c_id}\" and sequence_no == 1"
            - "ChecklistItem.${ci_id}.severity_class == \"SAFETY_CRITICAL\" and requires_photo == true"
            - "The GET /park-ops/checklist-items/${ci_id} body contains no \"version\" key and no \"updated_at\" key"
            - "The filtered list returns total_count == 1 and data[0].id == \"${ci_id}\""

      - name: component_create_with_unknown_attraction_returns_attraction_not_found
        claim_type: parent_relationships
        grounds:
          - "validations[priority 4]"
          - "errors[ERR_ATTRACTION_NOT_FOUND]"
          - "entities.ComponentAsset.fields.attraction_id"
        distinguishing_aspect: "A body FK naming no live row returns ERR_ATTRACTION_NOT_FOUND 404 (priority 4), not ERR_INVALID_REQUEST 400, and creates no ComponentAsset."
        test_recipe:
          setup:
            - "Empty DB (no attraction with the probed id can exist)."
          setup_api_calls: []
          trigger:
            - call: "POST /park-ops/components"
              payload: { attraction_id: "00000000-0000-4000-8000-000000000000", name: "Orphan Axle", component_type: "AXLE", criticality: "ESSENTIAL", ndt_interval_cycles: 20000, ndt_interval_days: 365 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { err: "$.data.error_id" }
            - call: "GET /park-ops/components"
              payload: {}
              as: ParkOpsAdmin
              as_user_id: "admin-1"
          assert:
            - "HTTP status is 404 and ${err} == \"ERR_ATTRACTION_NOT_FOUND\""
            - "The follow-up list returns total_count == 0"

      - name: part_requisition_polymorphic_parent_links_cross_reference_integrity_rejected
        claim_type: flat
        grounds:
          - "validations[priority 5]"
          - "state_machines.PartRequisition.transitions.None_to_REQUESTED"
          - "entities.PartRequisition.fields.downtime_event_id"
          - "entities.PartRequisition.fields.bulletin_action_id"
        distinguishing_aspect: "The optional polymorphic parentage is integrity-checked three ways: supplying a downtime_event_id belonging to another attraction is refused with ERR_INVALID_REQUEST, supplying both parent links at once is refused with ERR_INVALID_REQUEST, and the same requisition with the matching same-attraction link is accepted with status REQUESTED and total_cost_cents 60000."
        test_recipe:
          setup:
            - "Two attractions A1 and A2. One OPEN downtime event on A2. One acknowledged ADVISORY bulletin fanning out one PENDING action on A1."
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Cross Ref A1", park_area: "FRONTIER", manufacturer: "Gerstlauer", model_code: "XR-1", ride_class: "THRILL", theoretical_hourly_capacity: 900, min_operators_required: 2, parts_budget_cents: 5000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a1: "$.data.id" }
            - call: "POST /park-ops/attractions"
              payload: { name: "Cross Ref A2", park_area: "LAGOON", manufacturer: "Zamperla", model_code: "XR-2", ride_class: "FAMILY", theoretical_hourly_capacity: 500, min_operators_required: 1, parts_budget_cents: 5000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a2: "$.data.id" }
            - call: "POST /park-ops/downtime-events"
              payload: { attraction_id: "${a2}", started_at: "2026-08-01T09:00:00.000Z", cause_category: "MECHANICAL" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { d2: "$.data.id" }
            - call: "POST /park-ops/bulletins"
              payload: { bulletin_ref: "BR-XREF-1", manufacturer: "Gerstlauer", model_code: "XR-1", severity: "ADVISORY", issued_date: "2026-07-01", compliance_deadline_date: "2026-12-01" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
