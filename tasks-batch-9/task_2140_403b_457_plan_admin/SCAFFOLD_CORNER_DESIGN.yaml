scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:

      - name: employer_creation_derives_governmental_and_qualified_organization_flags
        claim_type: computed_fields
        grounds:
          - entities.Employer.fields.is_governmental
          - entities.Employer.fields.is_qualified_organization
          - endpoints[POST /plan-admin/employers]
        distinguishing_aspect: "A PUBLIC_SCHOOL/SCHOOL sponsor comes back with is_governmental true and is_qualified_organization true, while a TAX_EXEMPT_501C3/OTHER sponsor comes back false on both; neither flag is an input."
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /plan-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /plan-admin/employers"
              payload: { legal_name: "Riverbend Unified School District", ein: "11-1111111", entity_type: "PUBLIC_SCHOOL", organization_subtype: "SCHOOL", total_employee_count: 400 }
              as: SystemOperator
              captures: { gov_id: $.data.id }
            - call: "POST /plan-admin/employers"
              payload: { legal_name: "Lakeside Community Trust", ein: "33-3333333", entity_type: "TAX_EXEMPT_501C3", organization_subtype: "OTHER", total_employee_count: 300 }
              as: SystemOperator
              captures: { nq_id: $.data.id }
            - call: "POST /plan-admin/employers"
              payload: { legal_name: "Harborview Hospital", ein: "44-4444444", entity_type: "TAX_EXEMPT_501C3", organization_subtype: "HOSPITAL", total_employee_count: 900 }
              as: SystemOperator
              captures: { hosp_id: $.data.id }
          assert:
            - "Employer.${gov_id}.is_governmental == true and is_qualified_organization == true"
            - "Employer.${nq_id}.is_governmental == false and is_qualified_organization == false"
            - "Employer.${hosp_id}.is_governmental == false and is_qualified_organization == true"
            - "each response is 201 and carries id, created_at, updated_at and version == 1"

      - name: plan_creation_missing_required_plan_type_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /plan-admin/plans]
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting plan_type, a required input with no default, is refused with ERR_INVALID_REQUEST at 400 and creates nothing."
        test_recipe:
          setup:
            - "One PUBLIC_SCHOOL employer exists; no plan exists."
          setup_api_calls:
            - call: "POST /plan-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /plan-admin/employers"
              payload: { legal_name: "Riverbend Unified School District", ein: "11-1111111", entity_type: "PUBLIC_SCHOOL", organization_subtype: "SCHOOL", total_employee_count: 400 }
              as: SystemOperator
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /plan-admin/plans"
              payload: { employer_id: "${emp_id}", plan_name: "Riverbend 403(b)", plan_year: 2026, reported_participant_count: 250 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response is 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /plan-admin/plans?employer_id=${emp_id} returns 0 rows"

      - name: plan_permission_flags_default_to_true_when_omitted
        claim_type: defaults
        grounds:
          - entities.Plan.fields.permits_loans
          - entities.Plan.fields.permits_contract_exchanges
          - entities.Plan.fields.permits_incoming_transfers
          - endpoints[POST /plan-admin/plans]
        distinguishing_aspect: "A plan created without any permits_* field comes back with permits_loans, permits_hardship, permits_unforeseeable_emergency, permits_contract_exchanges, permits_incoming_transfers and permits_outgoing_transfers all true, and status DRAFT."
        test_recipe:
          setup:
            - "One PUBLIC_SCHOOL employer exists."
          setup_api_calls:
            - call: "POST /plan-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /plan-admin/employers"
              payload: { legal_name: "Riverbend Unified School District", ein: "11-1111111", entity_type: "PUBLIC_SCHOOL", organization_subtype: "SCHOOL", total_employee_count: 400 }
              as: SystemOperator
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /plan-admin/plans"
              payload: { employer_id: "${emp_id}", plan_name: "Riverbend 403(b)", plan_type: "PLAN_403B", plan_year: 2026, reported_participant_count: 250 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { p_id: $.data.id }
          assert:
            - "Plan.${p_id}.permits_loans == true"
            - "Plan.${p_id}.permits_hardship == true"
            - "Plan.${p_id}.permits_unforeseeable_emergency == true"
            - "Plan.${p_id}.permits_contract_exchanges == true"
            - "Plan.${p_id}.permits_incoming_transfers == true and permits_outgoing_transfers == true"
            - "Plan.${p_id}.status == DRAFT"
            - "Plan.${p_id}.open_correction_count == 0 and compliance_posture == CLEAR"
            - "Plan.${p_id}.is_small_plan == false because reported_participant_count 250 is not below 100"

      - name: vendor_account_vested_balance_computed_by_floor_of_basis_points
        claim_type: computed_fields
        grounds:
          - entities.VendorAccount.fields.vested_balance_cents
          - entities.VendorAccount.fields.vested_percentage_bps
          - endpoints[POST /plan-admin/vendor-accounts]
        distinguishing_aspect: "vested_balance_cents is floor(accumulated_benefit_cents * vested_percentage_bps / 10000): 3333333 cents at 6667 bps yields exactly 2222332, proving the floor rather than a round."
        test_recipe:
          setup:
            - "A PUBLIC_SCHOOL employer with an ACTIVE PLAN_403B plan and one participant."
          setup_api_calls:
            - call: "POST /plan-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /plan-admin/employers"
              payload: { legal_name: "Riverbend Unified School District", ein: "11-1111111", entity_type: "PUBLIC_SCHOOL", organization_subtype: "SCHOOL", total_employee_count: 400 }
              as: SystemOperator
              captures: { emp_id: $.data.id }
            - call: "POST /plan-admin/vendors"
              payload: { legal_name: "Northline Annuity", vendor_code: "NLA", contact_email: "ops@northline.example" }
              as: SystemOperator
              captures: { v1_id: $.data.id }
            - call: "POST /plan-admin/plans"
              payload: { employer_id: "${emp_id}", plan_name: "Riverbend 403(b)", plan_type: "PLAN_403B", plan_year: 2026, reported_participant_count: 250 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { p403_id: $.data.id }
            - call: "POST /plan-admin/plans/${p403_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
            - call: "POST /plan-admin/participants"
              payload: { employer_id: "${emp_id}", full_name: "Ada Reyes", date_of_birth: "1975-05-05", hire_date: "2014-08-01", scheduled_hours_per_week: 40, prior_year_hours_worked: 2000, includible_compensation_cents: 9000000, years_of_service: 12 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { pa_id: $.data.id }
          trigger:
            - call: "POST /plan-admin/vendor-accounts"
              payload: { participant_id: "${pa_id}", plan_id: "${p403_id}", vendor_id: "${v1_id}", contract_number: "NLA-0001", accumulated_benefit_cents: 3333333, vested_percentage_bps: 6667 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { a_id: $.data.id }
          assert:
            - "VendorAccount.${a_id}.vested_balance_cents == 2222332"
            - "VendorAccount.${a_id}.status == OPEN"
            - "VendorAccount.${a_id}.outstanding_loan_balance_cents == 0 and ytd_elective_deferrals_cents == 0 and pending_lost_earnings_cents == 0"
            - "Participant.${pa_id}.total_accumulated_benefit_cents == 3333333 and total_vested_balance_cents == 2222332"

      - name: vendor_account_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.VendorAccount.fields.ytd_elective_deferrals_cents
          - entities.VendorAccount.fields.outstanding_loan_balance_cents
          - endpoints[POST /plan-admin/vendor-accounts]
        distinguishing_aspect: "ytd_elective_deferrals_cents and outstanding_loan_balance_cents are system fields that the creation endpoint does not accept; supplying them is refused with ERR_INVALID_REQUEST rather than silently honoured."
        test_recipe:
          setup:
            - "A PUBLIC_SCHOOL employer with an ACTIVE PLAN_403B plan, one provider and one participant."
          setup_api_calls:
            - call: "POST /plan-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /plan-admin/employers"
              payload: { legal_name: "Riverbend Unified School District", ein: "11-1111111", entity_type: "PUBLIC_SCHOOL", organization_subtype: "SCHOOL", total_employee_count: 400 }
              as: SystemOperator
              captures: { emp_id: $.data.id }
            - call: "POST /plan-admin/vendors"
              payload: { legal_name: "Northline Annuity", vendor_code: "NLA", contact_email: "ops@northline.example" }
              as: SystemOperator
              captures: { v1_id: $.data.id }
            - call: "POST /plan-admin/plans"
              payload: { employer_id: "${emp_id}", plan_name: "Riverbend 403(b)", plan_type: "PLAN_403B", plan_year: 2026, reported_participant_count: 250 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { p403_id: $.data.id }
            - call: "POST /plan-admin/plans/${p403_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
            - call: "POST /plan-admin/participants"
              payload: { employer_id: "${emp_id}", full_name: "Ada Reyes", date_of_birth: "1975-05-05", hire_date: "2014-08-01", scheduled_hours_per_week: 40, prior_year_hours_worked: 2000, includible_compensation_cents: 9000000, years_of_service: 12 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { pa_id: $.data.id }
          trigger:
            - call: "POST /plan-admin/vendor-accounts"
              payload: { participant_id: "${pa_id}", plan_id: "${p403_id}", vendor_id: "${v1_id}", contract_number: "NLA-0001", accumulated_benefit_cents: 1000000, ytd_elective_deferrals_cents: 999999, outstanding_loan_balance_cents: 500000 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response is 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /plan-admin/vendor-accounts?participant_id=${pa_id} returns 0 rows"

      - name: participant_retrieval_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /plan-admin/participants/{id}]
          - validations[priority=4]
          - errors[ERR_PARTICIPANT_NOT_FOUND]
        distinguishing_aspect: "A well-formed UUID that matches no Participant row yields 404 with ERR_PARTICIPANT_NOT_FOUND, not an empty 200."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /plan-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "GET /plan-admin/participants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err: $.data.error_id }
          assert:
            - "response is 404 with data.error_id == ERR_PARTICIPANT_NOT_FOUND"
            - "the error body follows the §1.0 envelope with response_type == error"

      - name: plans_listing_returns_pagination_envelope
        claim_type: listing
        grounds:
          - endpoints[GET /plan-admin/plans]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /plan-admin/plans with limit 2 and offset 1 over three plans returns 2 rows, total_count 3 and has_more true, with response_type array."
        test_recipe:
          setup:
            - "One PUBLIC_SCHOOL employer with three DRAFT plans."
          setup_api_calls:
            - call: "POST /plan-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /plan-admin/employers"
              payload: { legal_name: "Riverbend Unified School District", ein: "11-1111111", entity_type: "PUBLIC_SCHOOL", organization_subtype: "SCHOOL", total_employee_count: 400 }
              as: SystemOperator
              captures: { emp_id: $.data.id }
            - call: "POST /plan-admin/plans"
              payload: { employer_id: "${emp_id}", plan_name: "Plan One", plan_type: "PLAN_403B", plan_year: 2026, reported_participant_count: 250 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
            - call: "POST /plan-admin/plans"
              payload: { employer_id: "${emp_id}", plan_name: "Plan Two", plan_type: "PLAN_403B", plan_year: 2026, reported_participant_count: 250 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
            - call: "POST /plan-admin/plans"
              payload: { employer_id: "${emp_id}", plan_name: "Plan Three", plan_type: "PLAN_457B", plan_year: 2026, reported_participant_count: 250 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
          trigger:
            - call: "GET /plan-admin/plans"
              payload: { employer_id: "${emp_id}", limit: 2, offset: 1 }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "response is 200 with response_type == array"
            - "the page contains exactly 2 rows"
            - "total_count == 3 and has_more == true and limit == 2 and offset == 1"
            - "GET /plan-admin/plans with plan_type PLAN_457B returns exactly 1 row"

      - name: pagination_limit_above_maximum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - endpoints[GET /plan-admin/plans]
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "limit 101 exceeds the declared maximum of 100 and is refused with ERR_INVALID_REQUEST at 400; limit 100 is accepted."
        test_recipe:
          setup:
            - "One PUBLIC_SCHOOL employer with one plan."
          setup_api_calls:
            - call: "POST /plan-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /plan-admin/employers"
              payload: { legal_name: "Riverbend Unified School District", ein: "11-1111111", entity_type: "PUBLIC_SCHOOL", organization_subtype: "SCHOOL", total_employee_count: 400 }
              as: SystemOperator
              captures: { emp_id: $.data.id }
            - call: "POST /plan-admin/plans"
              payload: { employer_id: "${emp_id}", plan_name: "Plan One", plan_type: "PLAN_403B", plan_year: 2026, reported_participant_count: 250 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
          trigger:
            - call: "GET /plan-admin/plans"
              payload: { limit: 101 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err: $.data.error_id }
            - call: "GET /plan-admin/plans"
              payload: { limit: 100 }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "the limit 101 request responds 400 with data.error_id == ERR_INVALID_REQUEST"
            - "the limit 100 request responds 200 with exactly 1 row and total_count == 1"

      - name: plan_creation_with_unknown_plan_type_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Plan.fields.plan_type
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "plan_type accepts only PLAN_403B and PLAN_457B; the value PLAN_401K is refused with ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "One PUBLIC_SCHOOL employer exists."
          setup_api_calls:
            - call: "POST /plan-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /plan-admin/employers"
              payload: { legal_name: "Riverbend Unified School District", ein: "11-1111111", entity_type: "PUBLIC_SCHOOL", organization_subtype: "SCHOOL", total_employee_count: 400 }
              as: SystemOperator
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /plan-admin/plans"
              payload: { employer_id: "${emp_id}", plan_name: "Riverbend 401(k)", plan_type: "PLAN_401K", plan_year: 2026, reported_participant_count: 250 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response is 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /plan-admin/plans?employer_id=${emp_id} returns 0 rows"

      - name: universal_availability_notice_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.UniversalAvailabilityNotice.common_fields
          - endpoints[POST /plan-admin/plans/{id}/universal-availability-notices]
          - endpoints[GET /plan-admin/plans/{id}/universal-availability-notices]
        distinguishing_aspect: "UniversalAvailabilityNotice is declared common_fields false, so a created notice exposes id and created_at but no updated_at and no version, and the API offers no update endpoint for it."
        test_recipe:
          setup:
            - "A PUBLIC_SCHOOL employer with an ACTIVE PLAN_403B plan for plan year 2026."
          setup_api_calls:
            - call: "POST /plan-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /plan-admin/employers"
              payload: { legal_name: "Riverbend Unified School District", ein: "11-1111111", entity_type: "PUBLIC_SCHOOL", organization_subtype: "SCHOOL", total_employee_count: 400 }
              as: SystemOperator
              captures: { emp_id: $.data.id }
            - call: "POST /plan-admin/plans"
              payload: { employer_id: "${emp_id}", plan_name: "Riverbend 403(b)", plan_type: "PLAN_403B", plan_year: 2026, reported_participant_count: 250 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { p403_id: $.data.id }
            - call: "POST /plan-admin/plans/${p403_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /plan-admin/plans/${p403_id}/universal-availability-notices"
              payload: { plan_year: 2026, issued_date: "2026-01-05", delivery_method: "EMAIL", recipient_count: 250, describes_effective_opportunity: true }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { notice_id: $.data.id }
            - call: "GET /plan-admin/plans/${p403_id}/universal-availability-notices"
              payload: { plan_year: 2026 }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "the creation responds 201 and the body carries id and created_at"
            - "the body carries no updated_at and no version field"
            - "UniversalAvailabilityNotice.${notice_id}.is_valid == true"
            - "the listing responds 200 with exactly 1 row"

      - name: contribution_election_self_reference_reverse_lookup_by_supersedes_election_id
        claim_type: parent_relationships
        grounds:
          - entities.ContributionElection.fields.supersedes_election_id
          - endpoints[GET /plan-admin/contribution-elections]
        distinguishing_aspect: "ContributionElection carries a self-referential foreign key, and filtering the collection by supersedes_election_id returns exactly the successor election that names the given predecessor."
        test_recipe:
          setup:
            - "A PUBLIC_SCHOOL employer with an ACTIVE PLAN_403B plan, a valid 2026 notice, one participant with one contract and an ELIGIBLE determination by co-1."
            - "One EFFECTIVE election for 500000 cents over [2026-01-01, 2026-06-30], approved by co-2."
          setup_api_calls:
            - call: "POST /plan-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /plan-admin/employers"
              payload: { legal_name: "Riverbend Unified School District", ein: "11-1111111", entity_type: "PUBLIC_SCHOOL", organization_subtype: "SCHOOL", total_employee_count: 400 }
              as: SystemOperator
              captures: { emp_id: $.data.id }
            - call: "POST /plan-admin/vendors"
              payload: { legal_name: "Northline Annuity", vendor_code: "NLA", contact_email: "ops@northline.example" }
              as: SystemOperator
              captures: { v1_id: $.data.id }
            - call: "POST /plan-admin/plans"
              payload: { employer_id: "${emp_id}", plan_name: "Riverbend 403(b)", plan_type: "PLAN_403B", plan_year: 2026, reported_participant_count: 250 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { p403_id: $.data.id }
            - call: "POST /plan-admin/plans/${p403_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
            - call: "POST /plan-admin/plans/${p403_id}/universal-availability-notices"
              payload: { plan_year: 2026, issued_date: "2026-01-05", delivery_method: "EMAIL", recipient_count: 250, describes_effective_opportunity: true }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
            - call: "POST /plan-admin/participants"
              payload: { employer_id: "${emp_id}", full_name: "Ada Reyes", date_of_birth: "1975-05-05", hire_date: "2014-08-01", scheduled_hours_per_week: 40, prior_year_hours_worked: 2000, includible_compensation_cents: 9000000, years_of_service: 12 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { pa_id: $.data.id }
            - call: "POST /plan-admin/vendor-accounts"
              payload: { participant_id: "${pa_id}", plan_id: "${p403_id}", vendor_id: "${v1_id}", contract_number: "NLA-0001", accumulated_benefit_cents: 5000000, vested_percentage_bps: 10000 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /plan-admin/eligibility-determinations"
              payload: { plan_id: "${p403_id}", participant_id: "${pa_id}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /plan-admin/participants/${pa_id}"
              payload: {}
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { pa_v: $.data.version }
            - call: "POST /plan-admin/contribution-elections"
              payload: { participant_id: "${pa_id}", plan_id: "${p403_id}", vendor_account_id: "${a1_id}", annual_deferral_amount_cents: 500000, effective_from: "2026-01-01", effective_through: "2026-06-30", expected_participant_version: "${pa_v}" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { el1_id: $.data.id }
            - call: "POST /plan-admin/contribution-elections/${el1_id}/decision"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-2"
          trigger:
            - call: "GET /plan-admin/participants/${pa_id}"
              payload: {}
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { pa_v2: $.data.version }
            - call: "POST /plan-admin/contribution-elections"
