        grounds:
          - validations[priority=9]
          - errors[ERR_PERIOD_OVERLAP]
          - entities.PerformanceYear.fields.period_end
        distinguishing_aspect: |
          Resource PerformanceYear with half-open interval semantics
          [period_start, period_end): a second year starting exactly at the
