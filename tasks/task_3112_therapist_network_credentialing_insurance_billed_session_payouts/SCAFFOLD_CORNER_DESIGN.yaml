          assert:
            - "the session read succeeds with exactly 1 row and total_count == 1"
            - "the payout-line read returns status 403 and error_id == ERR_UNAUTHORIZED"
            - "error_id != ERR_CLINICIAN_NOT_FOUND, so the refusal happened at authorization rather than at lookup"
            - "GET /network/patients/${patient_id} succeeds for the same caller, confirming the read scope is granted and the refusal is operation-specific"

      - name: payroll_service_can_pay_a_locked_batch_but_cannot_open_or_lock_one
        claim_type: Role model patterns
        grounds:
