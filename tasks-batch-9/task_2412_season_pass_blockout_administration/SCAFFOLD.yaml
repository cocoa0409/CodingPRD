  - { error_id: ERR_DUPLICATE_BLOCKOUT_ASSIGNMENT, http_status: 422, category: business_referential, message: "An active blockout already exists for this tier and park day" }
  - { error_id: ERR_DUPLICATE_RESERVATION,         http_status: 422, category: business_referential, message: "This pass already holds a reservation on that park day" }
