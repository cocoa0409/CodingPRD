# =============================================================================
# PRD-bench scaffold — Comedy Club & Live-Show Venue (Expert band)
# =============================================================================

scenario: "Comedy Club & Live-Show Venue: show calendar & seating (GA/reserved/table), ticket tier & 2-item/drink minimum, reservation & comp/guest-list, performer/lineup & contract, table assignment & server, refund/exchange, private event, box-office settlement"

domain_name: comedy-club-venue
api_prefix: /

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: hybrid
  # Venue -> Show -> Section -> Table is a hierarchy; Performer, Server,
  # Reservation, Ticket, GuestListEntry, PrivateEvent, Settlement, LineupSlot
  # cross-cut the hierarchy via FK references.

  state_machine_shape: parallel
  # Reservation carries two independent dimensions (booking_status x
  # settlement_status). LineupSlot is cyclic (contract negotiation rounds).
  # Show is branching (DRAFT -> {ON_SALE, PRIVATE_HELD} -> ...). Settlement is
  # compound (derives box-office numbers from its show's reservations).

  relationship_patterns:
    - one_to_many        # Show -> Section -> Table; Reservation -> Ticket
    - many_to_many       # Show <-> Performer via LineupSlot
    - cross_aggregate    # Reservation references Table across the Section tree

  role_model: peer_roles
  # BoxOffice sells/refunds reservations; Booker owns shows/lineups/contracts;
  # FloorManager assigns tables/servers and runs settlement; Patron is the
  # ticket buyer acting on their own reservation; Performer is entity-backed
  # for accepting/countering contracts.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Venue name" }
      - { name: settlement_currency, type: string, source: input, description: "ISO currency code, e.g. USD; all money fields are integer cents in this currency" }
      - { name: house_fee_pct, type: number, source: input, description: "House cut of gross box-office, fraction in [0,1], applied at settlement", default: 0.20 }
      - { name: posture, type: enum, source: computed, description: "OPEN | RECONCILING | CLOSED — OPEN normally; RECONCILING while any of the venue's shows is in SETTLING; CLOSED when the venue is manually closed. Gates new reservation creation.", constraints: "enum: OPEN, RECONCILING, CLOSED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 each mutation" }

  - name: Show
    parent: Venue
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: venue_id, type: string, source: system, description: "FK -> Venue.id; set from path" }
      - { name: title, type: string, source: input, description: "Show title" }
      - { name: starts_at, type: datetime, source: input, description: "Show start (ISO 8601 UTC); doors open and seating windows derive from this" }
      - { name: ends_at, type: datetime, source: input, description: "Show end (ISO 8601 UTC); must be strictly after starts_at" }
      - { name: doors_buffer_minutes, type: integer, source: input, description: "Minutes before starts_at that the room is occupied for turnover; widens the overlap window", default: 30 }
      - { name: status, type: enum, source: system, description: "DRAFT | ON_SALE | PRIVATE_HELD | SOLD_OUT | CANCELLED | SETTLING | SETTLED", constraints: "enum: DRAFT, ON_SALE, PRIVATE_HELD, SOLD_OUT, CANCELLED, SETTLING, SETTLED" }
      - { name: is_private, type: boolean, source: computed, description: "True once a PrivateEvent in HELD/CONFIRMED references this show", default: false }
      - { name: ga_sold_count, type: integer, source: computed, description: "Sum of party_size over this show's reservations whose section is GA and booking_status IN {BOOKED, SEATED, CHECKED_IN}", default: 0 }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 each mutation" }

  - name: SeatingSection
    parent: Show
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: show_id, type: string, source: system, description: "FK -> Show.id; set from path" }
      - { name: kind, type: enum, source: input, description: "GA (general standing) | RESERVED (numbered seats, capacity-tracked like GA but no table/server) | TABLE (table-and-server service)", constraints: "enum: GA, RESERVED, TABLE" }
      - { name: label, type: string, source: input, description: "Section label, e.g. 'Main Floor'" }
      - { name: ga_capacity, type: integer, source: input, description: "Head capacity for capacity-tracked sections; required when kind IN {GA, RESERVED}, must be omitted (null) when kind=TABLE", default: null }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 each mutation" }

  - name: SeatTable
    parent: SeatingSection
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: section_id, type: string, source: system, description: "FK -> SeatingSection.id; set from path; the section must have kind=TABLE" }
      - { name: table_number, type: string, source: input, description: "Human label, unique within section among non-RETIRED tables" }
      - { name: seats, type: integer, source: input, description: "Number of seats at this table; must be >= 1" }
      - { name: min_items_per_seat, type: integer, source: input, description: "Per-seat item/drink minimum for parties seated here; the venue-wide default is 2", default: 2 }
      - { name: assigned_server_id, type: string, source: system, description: "FK -> Server.id; null until a server is assigned", default: null }
      - { name: status, type: enum, source: system, description: "AVAILABLE | HELD | OCCUPIED | RETIRED", constraints: "enum: AVAILABLE, HELD, OCCUPIED, RETIRED" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 each mutation" }

  - name: Performer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; equals X-User-ID when acting as Performer" }
      - { name: stage_name, type: string, source: input, description: "Performer stage name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: standard_fee_cents, type: integer, source: input, description: "Default booking fee in cents the performer asks for" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 each mutation" }

  - name: LineupSlot
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: show_id, type: string, source: input, description: "FK -> Show.id" }
      - { name: performer_id, type: string, source: input, description: "FK -> Performer.id" }
      - { name: slot_order, type: integer, source: input, description: "Lineup position within the show; lower goes on stage first; unique per show among non-DROPPED slots" }
      - { name: role, type: enum, source: input, description: "HOST | OPENER | FEATURE | HEADLINER", constraints: "enum: HOST, OPENER, FEATURE, HEADLINER" }
      - { name: offered_fee_cents, type: integer, source: input, description: "Fee currently on the table (cents); set by Booker on offer, overwritten by performer counter" }
      - { name: agreed_fee_cents, type: integer, source: system, description: "Final contracted fee, frozen when contract_status reaches SIGNED", default: null }
      - { name: contract_status, type: enum, source: system, description: "OFFERED | COUNTERED | SIGNED | DROPPED", constraints: "enum: OFFERED, COUNTERED, SIGNED, DROPPED" }
      - { name: counter_rounds, type: integer, source: system, description: "Number of performer counters so far; capped at MAX_COUNTER_ROUNDS (constant = 3)", default: 0 }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 each mutation" }

  - name: TicketTier
    parent: Show
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: show_id, type: string, source: system, description: "FK -> Show.id; set from path" }
      - { name: section_id, type: string, source: input, description: "FK -> SeatingSection.id; the section this tier sells into; must belong to the same show" }
      - { name: name, type: string, source: input, description: "Tier name, e.g. 'GA Advance', 'VIP Table'" }
      - { name: price_cents, type: integer, source: input, description: "Per-seat ticket price in cents" }
      - { name: min_items_override, type: integer, source: input, description: "Optional per-seat item minimum that overrides the table/venue default when this tier is used", default: null }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 each mutation" }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: show_id, type: string, source: input, description: "FK -> Show.id" }
      - { name: section_id, type: string, source: input, description: "FK -> SeatingSection.id; the section booked into" }
      - { name: tier_id, type: string, source: input, description: "FK -> TicketTier.id; the priced tier used" }
      - { name: table_id, type: string, source: system, description: "FK -> SeatTable.id; null for GA/RESERVED, set when a TABLE party is assigned a table", default: null }
      - { name: patron_id, type: string, source: input, description: "Opaque patron identifier; equals X-User-ID when a Patron acts on their own reservation" }
      - { name: party_size, type: integer, source: input, description: "Number of guests/seats; must be >= 1" }
      - { name: is_comp, type: boolean, source: input, description: "True for guest-list comps (zero ticket price, item minimum still applies unless waived)", default: false }
      - { name: booking_status, type: enum, source: system, description: "BOOKED | SEATED | CHECKED_IN | NO_SHOW | CANCELLED | EXCHANGED", constraints: "enum: BOOKED, SEATED, CHECKED_IN, NO_SHOW, CANCELLED, EXCHANGED" }
      - { name: settlement_status, type: enum, source: system, description: "UNCOLLECTED | TICKET_PAID | MINIMUM_MET | REFUNDED — independent settlement dimension", constraints: "enum: UNCOLLECTED, TICKET_PAID, MINIMUM_MET, REFUNDED" }
      - { name: ticket_charge_cents, type: integer, source: computed, description: "Computed ticket charge (see compute_ticket_charge); 0 when is_comp" }
      - { name: minimum_due_cents, type: integer, source: computed, description: "Computed item/drink minimum the party owes (see compute_minimum_due)" }
      - { name: items_consumed_cents, type: integer, source: input, description: "Running tab of items/drinks consumed, recorded by floor staff", default: 0 }
      - { name: refunded_cents, type: integer, source: computed, description: "Total refunded to patron on cancel/exchange (see compute_refund)", default: 0 }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 each mutation" }

  - name: Ticket
    parent: Reservation
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: reservation_id, type: string, source: system, description: "FK -> Reservation.id; set from path" }
      - { name: seat_label, type: string, source: input, description: "Seat label printed on the ticket, e.g. 'GA' or 'T4-S2'" }
      - { name: scan_state, type: enum, source: system, description: "ISSUED | SCANNED | VOID", constraints: "enum: ISSUED, SCANNED, VOID" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision; used as the tie-break for scan ordering" }

  - name: GuestListEntry
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: show_id, type: string, source: input, description: "FK -> Show.id" }
      - { name: host_performer_id, type: string, source: input, description: "FK -> Performer.id; the performer who put the guest on the list" }
      - { name: guest_name, type: string, source: input, description: "Guest name" }
      - { name: party_size, type: integer, source: input, description: "Seats reserved on the comp list; must be >= 1" }
      - { name: minimum_waived, type: boolean, source: input, description: "True if the item/drink minimum is waived for this comp", default: false }
      - { name: status, type: enum, source: system, description: "LISTED | CONVERTED | REVOKED", constraints: "enum: LISTED, CONVERTED, REVOKED" }
      - { name: reservation_id, type: string, source: system, description: "FK -> Reservation.id; set when the comp is converted into a reservation", default: null }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 each mutation" }

  - name: Server
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Server (staff) name" }
      - { name: max_tables, type: integer, source: input, description: "Max tables this server can be assigned across all shows; must be >= 1", default: 4 }
      - { name: assigned_table_count, type: integer, source: computed, description: "Count of SeatTable rows whose assigned_server_id == this server and status != RETIRED", default: 0 }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 each mutation" }

  - name: PrivateEvent
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: show_id, type: string, source: input, description: "FK -> Show.id; the show being bought out" }
      - { name: client_name, type: string, source: input, description: "Buyout client" }
      - { name: buyout_fee_cents, type: integer, source: input, description: "Flat buyout fee in cents replacing per-ticket revenue" }
      - { name: deposit_pct, type: number, source: input, description: "Fraction of buyout_fee_cents taken as non-refundable deposit at HELD, in [0,1]", default: 0.25 }
      - { name: status, type: enum, source: system, description: "HELD | CONFIRMED | CANCELLED", constraints: "enum: HELD, CONFIRMED, CANCELLED" }
      - { name: deposit_cents, type: integer, source: computed, description: "Computed non-refundable deposit (see compute_buyout_deposit)" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 each mutation" }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: show_id, type: string, source: input, description: "FK -> Show.id; the show being settled" }
      - { name: status, type: enum, source: system, description: "OPEN | FINALIZED", constraints: "enum: OPEN, FINALIZED" }
      - { name: gross_ticket_cents, type: integer, source: computed, description: "Sum of ticket_charge_cents over included reservations (see compute_settlement)" }
      - { name: gross_minimum_cents, type: integer, source: computed, description: "Sum of collected item-minimum revenue over included reservations" }
      - { name: buyout_cents, type: integer, source: computed, description: "Buyout fee from a CONFIRMED PrivateEvent on the show, else 0" }
      - { name: performer_payout_cents, type: integer, source: computed, description: "Sum of agreed_fee_cents over the show's SIGNED LineupSlots" }
      - { name: house_cut_cents, type: integer, source: computed, description: "House cut = round(house_fee_pct * gross_box_office) (see compute_settlement)" }
      - { name: net_to_venue_cents, type: integer, source: computed, description: "Net payable to venue after performer payout (see compute_settlement)" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 each mutation" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Show
    field: status
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    note: "Branching: DRAFT forks to ON_SALE (public) or PRIVATE_HELD (buyout). SOLD_OUT auto-derives from GA capacity."
    transitions:
      - from: DRAFT
        to: ON_SALE
        trigger: "POST /venues/{venue_id}/shows/{show_id}/publish"
        actor: Booker
        preconditions:
          - "Show has at least one SeatingSection"
          - "Show has at least one TicketTier"
          - "No PrivateEvent in HELD or CONFIRMED references this show"
          - "Venue.posture != CLOSED"
        side_effects:
          - "status -> ON_SALE; reservations may now be created against this show"

      - from: DRAFT
        to: PRIVATE_HELD
        trigger: "system (POST /private-events creates a HELD buyout for this DRAFT show)"
        actor: system
        preconditions:
          - "Show is DRAFT"
          - "Show has zero reservations with booking_status IN {BOOKED, SEATED, CHECKED_IN}"
        side_effects:
          - "status -> PRIVATE_HELD; is_private computed to true; public reservation creation blocked"

      - from: PRIVATE_HELD
        to: ON_SALE
        trigger: "system (the show's HELD PrivateEvent is CANCELLED)"
        actor: system
        preconditions:
          - "No PrivateEvent in HELD or CONFIRMED references this show"
        side_effects:
          - "status -> ON_SALE; is_private computed back to false"

      - from: ON_SALE
        to: SOLD_OUT
        trigger: "system (a GA reservation brings ga_sold_count to the GA section's ga_capacity)"
        actor: system
        preconditions:
          - "After the reservation side-effect, ga_sold_count == GA SeatingSection.ga_capacity for every GA section, OR no GA section has remaining capacity"
        side_effects:
          - "status -> SOLD_OUT; further GA reservation creation rejected with ERR_SECTION_SOLD_OUT"

      - from: SOLD_OUT
        to: ON_SALE
        trigger: "system (a reservation cancel/exchange frees GA capacity)"
        actor: system
        preconditions:
          - "ga_sold_count < GA SeatingSection.ga_capacity for some GA section"
        side_effects:
          - "status -> ON_SALE"

      - from: [DRAFT, ON_SALE, PRIVATE_HELD, SOLD_OUT]
        to: CANCELLED
        trigger: "POST /venues/{venue_id}/shows/{show_id}/cancel"
        actor: Booker
        preconditions:
          - "Show is not SETTLING or SETTLED"
        side_effects:
          - "CASCADE: every Reservation with booking_status IN {BOOKED, SEATED, CHECKED_IN} for this show -> CANCELLED, each computing a full refund (refunded_cents) and settlement_status -> REFUNDED"
          - "CASCADE: each cancelled Reservation that held a SeatTable releases it (SeatTable.status -> AVAILABLE)"
          - "CASCADE: every LineupSlot for this show with contract_status IN {OFFERED, COUNTERED, SIGNED} -> DROPPED"
          - "Any HELD/CONFIRMED PrivateEvent on this show -> CANCELLED (deposit retained per compute_buyout_deposit)"

      - from: [ON_SALE, PRIVATE_HELD, SOLD_OUT]
        to: SETTLING
        trigger: "POST /settlements (open a settlement for the show)"
        actor: FloorManager
        preconditions:
          - "now >= Show.ends_at (logical clock)"
          - "No OPEN Settlement already exists for this show"
        side_effects:
          - "status -> SETTLING; Venue.posture recomputed to RECONCILING; new reservation creation for this show blocked"

      - from: SETTLING
        to: SETTLED
        trigger: "system (the show's OPEN Settlement is FINALIZED)"
        actor: system
        preconditions:
          - "The show's Settlement.status == FINALIZED"
        side_effects:
          - "status -> SETTLED; Venue.posture recomputed (OPEN if no other show SETTLING)"

  - entity: Reservation
    field: booking_status
    initial_state: BOOKED
    terminal_states: [CANCELLED, EXCHANGED, NO_SHOW]
    note: "PARALLEL: booking_status (this machine) and settlement_status (next machine) evolve independently on the same Reservation row."
    transitions:
      - from: BOOKED
        to: SEATED
        trigger: "POST /reservations/{reservation_id}/seat"
        actor: FloorManager
        preconditions:
          - "Reservation.section_id refers to a TABLE section"
          - "Reservation has a table_id assigned (table assignment already happened)"
          - "Show.status IN {ON_SALE, SOLD_OUT}"
        side_effects:
          - "booking_status -> SEATED; SeatTable.status -> OCCUPIED"

      - from: [BOOKED, SEATED]
        to: CHECKED_IN
        trigger: "POST /reservations/{reservation_id}/check-in"
        actor: BoxOffice
        preconditions:
          - "Show.status IN {ON_SALE, SOLD_OUT}"
          - "settlement_status == TICKET_PAID OR is_comp == true"
        side_effects:
          - "booking_status -> CHECKED_IN; Tickets for this reservation move ISSUED -> SCANNED in created_at ASC order"

      - from: [BOOKED, SEATED, CHECKED_IN]
        to: CANCELLED
        trigger: "POST /reservations/{reservation_id}/cancel"
        actor: [BoxOffice, Patron]
        preconditions:
          - "Show.status != SETTLED"
        side_effects:
          - "booking_status -> CANCELLED; compute_refund sets refunded_cents; settlement_status -> REFUNDED"
          - "CASCADE: all Tickets of this reservation in scan_state IN {ISSUED, SCANNED} -> VOID"
          - "CASCADE: if table_id set, SeatTable.status -> AVAILABLE and (if it had a server) the server's assigned_table_count recomputes"
          - "CASCADE: if a GuestListEntry pointed here (status CONVERTED), it reverts to REVOKED"
          - "Show.ga_sold_count recomputed; Show may auto-transition SOLD_OUT -> ON_SALE"

      - from: BOOKED
        to: EXCHANGED
        trigger: "POST /reservations/{reservation_id}/exchange"
        actor: [BoxOffice, Patron]
        preconditions:
          - "Show.status IN {ON_SALE, SOLD_OUT}"
          - "Target tier/section in the request exists and has capacity"
        side_effects:
          - "booking_status -> EXCHANGED (terminal on the old row); a NEW Reservation is created in BOOKED for the target tier with party_size carried over"
          - "compute_refund on the old row sets refunded_cents to the difference credited (never negative); settlement_status -> REFUNDED on old row"
          - "CASCADE: all Tickets of the old row in scan_state IN {ISSUED, SCANNED} -> VOID"
          - "CASCADE: old row's table_id (if any) released -> AVAILABLE; Show.ga_sold_count recomputed both old and new section"

      - from: [BOOKED, SEATED, CHECKED_IN]
        to: NO_SHOW
        trigger: "POST /reservations/{reservation_id}/no-show"
        actor: FloorManager
        preconditions:
          - "now >= Show.starts_at + doors_buffer_minutes (logical clock)"
          - "booking_status != CHECKED_IN at no-show time means seat not scanned"
        side_effects:
          - "booking_status -> NO_SHOW; ticket charge retained (no refund); SeatTable released if held"

  - entity: Reservation
    field: settlement_status
    initial_state: UNCOLLECTED
    terminal_states: [REFUNDED]
    note: "PARALLEL second dimension on Reservation. Independent of booking_status: a BOOKED reservation may already be TICKET_PAID; a CHECKED_IN one may still owe its minimum."
    transitions:
      - from: UNCOLLECTED
        to: TICKET_PAID
        trigger: "POST /reservations/{reservation_id}/collect-ticket"
        actor: BoxOffice
        preconditions:
          - "booking_status IN {BOOKED, SEATED, CHECKED_IN}"
          - "ticket_charge_cents already computed at creation"
        side_effects:
          - "settlement_status -> TICKET_PAID; Tickets (one per seat) issued in ISSUED scan_state"

      - from: TICKET_PAID
        to: MINIMUM_MET
        trigger: "POST /reservations/{reservation_id}/record-consumption"
        actor: FloorManager
        preconditions:
          - "items_consumed_cents (after applying the request delta) >= minimum_due_cents"
        side_effects:
          - "settlement_status -> MINIMUM_MET; the difference between minimum_due_cents and a smaller prior tab no longer billable as a shortfall"

      - from: [UNCOLLECTED, TICKET_PAID, MINIMUM_MET]
        to: REFUNDED
        trigger: "system (Reservation booking_status -> CANCELLED or EXCHANGED, or Show CANCELLED cascade)"
        actor: system
        preconditions:
          - "A cancel/exchange/show-cancel side-effect fired on this reservation"
        side_effects:
          - "settlement_status -> REFUNDED; refunded_cents already set by compute_refund"

  - entity: LineupSlot
    field: contract_status
    initial_state: OFFERED
    terminal_states: [SIGNED, DROPPED]
    note: "CYCLIC: OFFERED <-> COUNTERED negotiation loop (capped at MAX_COUNTER_ROUNDS) before SIGNED or DROPPED."
    transitions:
      - from: OFFERED
        to: COUNTERED
        trigger: "POST /lineup-slots/{lineup_slot_id}/counter"
        actor: Performer
        preconditions:
          - "Performer (X-User-ID) == LineupSlot.performer_id"
          - "counter_rounds < MAX_COUNTER_ROUNDS"
        side_effects:
          - "contract_status -> COUNTERED; offered_fee_cents := requested counter_fee_cents; counter_rounds += 1"

      - from: COUNTERED
        to: OFFERED
        trigger: "POST /lineup-slots/{lineup_slot_id}/revise-offer"
        actor: Booker
        preconditions:
          - "counter_rounds < MAX_COUNTER_ROUNDS"
        side_effects:
          - "contract_status -> OFFERED; offered_fee_cents := new_offered_fee_cents (re-opens the loop)"

      - from: [OFFERED, COUNTERED]
        to: SIGNED
        trigger: "POST /lineup-slots/{lineup_slot_id}/sign"
        actor: [Booker, Performer]
        preconditions:
          - "Show.status IN {DRAFT, ON_SALE, PRIVATE_HELD, SOLD_OUT}"
        side_effects:
          - "contract_status -> SIGNED; agreed_fee_cents := offered_fee_cents (frozen)"

      - from: [OFFERED, COUNTERED]
        to: DROPPED
        trigger: "POST /lineup-slots/{lineup_slot_id}/drop"
        actor: Booker
        preconditions: []
        side_effects:
          - "contract_status -> DROPPED; slot_order freed for reuse on this show"

  - entity: SeatTable
    field: status
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    note: "Quota resource. HELD on assignment, OCCUPIED on seating, back to AVAILABLE on release."
    transitions:
      - from: AVAILABLE
        to: HELD
        trigger: "POST /reservations/{reservation_id}/assign-table"
        actor: FloorManager
        preconditions:
          - "SeatTable.section_id == Reservation.section_id (same TABLE section)"
          - "SeatTable.seats >= Reservation.party_size"
          - "SeatTable has assigned_server_id != null (a server must already be assigned)"
        side_effects:
          - "SeatTable.status -> HELD; Reservation.table_id := this table"

      - from: HELD
        to: OCCUPIED
        trigger: "system (Reservation.booking_status -> SEATED)"
        actor: system
        preconditions:
          - "Owning Reservation.booking_status == SEATED"
        side_effects:
          - "SeatTable.status -> OCCUPIED"

      - from: [HELD, OCCUPIED]
        to: AVAILABLE
        trigger: "system (owning Reservation CANCELLED/EXCHANGED/NO_SHOW)"
        actor: system
        preconditions:
          - "Owning Reservation left a non-terminal-occupying state"
        side_effects:
          - "SeatTable.status -> AVAILABLE; Reservation.table_id cleared"

      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /tables/{table_id}/retire"
        actor: FloorManager
        preconditions:
          - "SeatTable.status == AVAILABLE (no active hold)"
        side_effects:
          - "SeatTable.status -> RETIRED; if a server was assigned, that server's assigned_table_count recomputes"

  - entity: PrivateEvent
    field: status
    initial_state: HELD
    terminal_states: [CONFIRMED, CANCELLED]
    note: "Buyout lifecycle; gates the underlying show's public/private posture."
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /private-events/{private_event_id}/confirm"
        actor: Booker
        preconditions:
          - "Underlying Show.status == PRIVATE_HELD"
          - "deposit_cents already computed at HELD"
        side_effects:
          - "status -> CONFIRMED; Show remains PRIVATE_HELD and is excluded from public sale"

      - from: [HELD, CONFIRMED]
        to: CANCELLED
        trigger: "POST /private-events/{private_event_id}/cancel"
        actor: Booker
        preconditions: []
        side_effects:
          - "status -> CANCELLED; deposit_cents retained (non-refundable); if this was the only HELD/CONFIRMED buyout, Show auto-transitions PRIVATE_HELD -> ON_SALE"

  - entity: Settlement
    field: status
    initial_state: OPEN
    terminal_states: [FINALIZED]
    note: "COMPOUND: derives its money fields from the show's reservations, lineup, and private event at finalize time."
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /settlements/{settlement_id}/finalize"
        actor: FloorManager
        preconditions:
          - "Show.status == SETTLING"
          - "No Reservation for this show is in settlement_status == TICKET_PAID with booking_status == CHECKED_IN and items_consumed_cents < minimum_due_cents (all minimums resolved or written off)"
        side_effects:
          - "compute_settlement runs: gross_ticket_cents, gross_minimum_cents, buyout_cents, performer_payout_cents, house_cut_cents, net_to_venue_cents frozen"
          - "status -> FINALIZED; CASCADE: Show.status -> SETTLED; Venue.posture recomputed"

  - entity: GuestListEntry
    field: status
    initial_state: LISTED
    terminal_states: [REVOKED]
    note: "Comp/guest-list lifecycle. CONVERTED is non-terminal (a converted comp can revert to REVOKED if its linked reservation is cancelled)."
    transitions:
      - from: LISTED
        to: CONVERTED
        trigger: "POST /guest-list-entries/{guest_list_entry_id}/convert"
        actor: BoxOffice
        preconditions:
          - "GuestListEntry.status == LISTED"
          - "Show.status IN {ON_SALE, SOLD_OUT}"
          - "Requested section_id and tier_id belong to the same show"
        side_effects:
          - "status -> CONVERTED; creates a comp Reservation (is_comp=true) with party_size carried over; reservation_id linked; minimum waived per minimum_waived"

      - from: [LISTED, CONVERTED]
        to: REVOKED
        trigger: "POST /guest-list-entries/{guest_list_entry_id}/revoke OR system (linked Reservation cancelled)"
        actor: [Booker, Performer, system]
        preconditions: []
        side_effects:
          - "status -> REVOKED; if a comp Reservation was linked and still active, it is cancelled (booking_status -> CANCELLED)"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (true CREATE-with-supersede races, OCC-resolved)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: assign-table-stale-table
    parent_entity: SeatTable
    write_endpoint: "POST /reservations/{reservation_id}/assign-table"
    occ_field: expected_table_version
    description: |
      Assigning a SeatTable to a reservation against a table whose version has
      advanced since the client last observed it is rejected. Captures the case
      where the table was just assigned to (or retired by) another writer and
      this writer's view of the table is stale; the AVAILABLE the client saw no
      longer holds.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: signoff-stale-slot
    parent_entity: LineupSlot
    write_endpoint: "POST /lineup-slots/{lineup_slot_id}/sign"
    occ_field: expected_lineup_slot_version
    description: |
      Signing a LineupSlot against a version that has advanced since the client
      last observed it is rejected. Captures the case where a counter or
      revise-offer (which legitimately changes the on-the-table fee) landed
      after the client read the slot, so the fee the signer believes they are
      freezing is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: compute_ticket_charge
    trigger: "Reservation creation (POST /reservations) and exchange target creation"
    algorithm: tiered_pricing
    formula: |
      if reservation.is_comp:
        ticket_charge_cents = 0
      else:
        ticket_charge_cents = tier.price_cents * party_size
      # No rounding needed — integer cents times integer party_size.
    input_set: "The single TicketTier referenced by tier_id; party_size from the reservation."
    precision: "integer cents, exact"

  - name: compute_minimum_due
    trigger: "Reservation creation; recomputed when a TABLE party is assigned a table (min_items_per_seat may differ from tier override)"
    algorithm: threshold
    formula: |
      # Per-seat minimum precedence (first non-null wins):
      #   1. tier.min_items_override (if not null)
      #   2. table.min_items_per_seat (if table_id assigned and section kind == TABLE)
      #   3. VENUE_DEFAULT_MIN_ITEMS (=2)
      if reservation.is_comp and the converting GuestListEntry.minimum_waived:
        per_seat_min = 0
      else:
        per_seat_min = first_non_null(tier.min_items_override,
                                      table.min_items_per_seat if table_id else null,
                                      VENUE_DEFAULT_MIN_ITEMS)
      minimum_due_cents = per_seat_min * MIN_ITEM_UNIT_PRICE_CENTS * party_size
    input_set: "tier override, assigned table (if any), guest-list waiver flag, party_size."
    constants:
      VENUE_DEFAULT_MIN_ITEMS: 2
      MIN_ITEM_UNIT_PRICE_CENTS: 1000   # each required 'item' is valued at $10.00 of consumption
    precision: "integer cents, exact"
    variants:
      - name: pre_seating_estimate
        when: "At reservation creation before a table is assigned"
        difference: "Uses tier override else VENUE_DEFAULT_MIN_ITEMS (table tier unknown), so a later table with a higher min_items_per_seat RAISES minimum_due_cents on assignment."
      - name: post_seating_final
        when: "After assign-table for a TABLE-section reservation"
        difference: "Recomputed with table.min_items_per_seat in the precedence chain; this is the value the floor must collect."

  - name: compute_refund
    trigger: "Reservation cancel, exchange, no-show, and Show-cancel cascade"
    algorithm: chronological
    formula: |
      # Refund depends on WHICH action and the reservation's settlement_status.
      collected = ticket_charge_cents if settlement_status IN {TICKET_PAID, MINIMUM_MET} else 0
      collected_minimum = min(items_consumed_cents, minimum_due_cents) if settlement_status == MINIMUM_MET else 0
      base = collected + collected_minimum
      action = the triggering transition
      if action == NO_SHOW:
        refunded_cents = 0                      # no refund on no-shows
      elif action == SHOW_CANCEL:
        refunded_cents = base                   # full refund, fee waived
      elif action == CANCEL:
        # Patron-initiated cancel keeps a cancellation fee unless > LATE_CANCEL window before doors
        if now <= Show.starts_at - LATE_CANCEL_GRACE_MINUTES (logical clock):
          refunded_cents = base                 # outside late window: full refund
        else:
          refunded_cents = max(0, base - CANCEL_FEE_CENTS)
      elif action == EXCHANGE:
        # credit difference: old base minus new ticket charge, never negative
        new_charge = compute_ticket_charge(target tier, party_size)
        refunded_cents = max(0, base - new_charge)
    input_set: "settlement_status, ticket_charge_cents, items_consumed_cents, minimum_due_cents, logical clock vs Show.starts_at, triggering action."
    constants:
      CANCEL_FEE_CENTS: 1500
      LATE_CANCEL_GRACE_MINUTES: 120
    precision: "integer cents, exact; max(0, ...) floors at zero"
    variants:
      - name: full_refund_on_show_cancel
        when: "Show cancelled by venue"
        difference: "No cancellation fee deducted; patron made whole on ticket + collected minimum."
      - name: fee_retained_on_late_patron_cancel
        when: "Patron cancels inside the LATE_CANCEL_GRACE_MINUTES window"
        difference: "CANCEL_FEE_CENTS retained from the refund (floored at 0)."

  - name: compute_buyout_deposit
    trigger: "PrivateEvent creation (POST /private-events)"
    algorithm: threshold
    formula: |
      deposit_cents = round_half_up(deposit_pct * buyout_fee_cents)
      # deposit is non-refundable: retained even if the buyout is later CANCELLED.
    input_set: "deposit_pct and buyout_fee_cents on the PrivateEvent."
    constants: {}
    precision: "integer cents, round_half_up"

  - name: compute_settlement
    trigger: "Settlement finalize (POST /settlements/{id}/finalize)"
    algorithm: aggregation
    formula: |
      # Included reservations: those for the show with booking_status IN
      # {CHECKED_IN, NO_SHOW} (attended or forfeited) — CANCELLED/EXCHANGED excluded,
      # tie-break/order not needed (sums are commutative).
      gross_ticket_cents   = sum(r.ticket_charge_cents for r in included
                                 if r.settlement_status IN {TICKET_PAID, MINIMUM_MET})
      gross_minimum_cents  = sum(min(r.items_consumed_cents, r.minimum_due_cents) for r in included
                                 if r.settlement_status == MINIMUM_MET)
      buyout_cents         = the show's CONFIRMED PrivateEvent.buyout_fee_cents, else 0
      gross_box_office     = gross_ticket_cents + gross_minimum_cents + buyout_cents
      house_cut_cents      = round_half_up(Venue.house_fee_pct * gross_box_office)
      performer_payout_cents = sum(slot.agreed_fee_cents for slot in show's SIGNED LineupSlots)
      net_to_venue_cents   = gross_box_office - house_cut_cents - performer_payout_cents
      # ORDER PINNED: compute each gross component first, sum to gross_box_office,
      # THEN round the house cut ONCE on the total (round-then-not-per-line),
      # THEN subtract payout. Rounding the house cut per-reservation would drift.
    input_set: "Reservations for the show (filtered by booking_status and settlement_status), CONFIRMED PrivateEvent if any, SIGNED LineupSlots."
    constants: {}
    precision: "integer cents; single round_half_up on house_cut over the gross total (NOT per line)"
    variants:
      - name: public_show_settlement
        when: "Show was sold publicly (no CONFIRMED PrivateEvent)"
        difference: "buyout_cents = 0; gross from ticket + minimum revenue only."
      - name: private_buyout_settlement
        when: "Show has a CONFIRMED PrivateEvent"
        difference: "buyout_cents = buyout_fee_cents replaces ticket/minimum streams (which are ~0 for a bought-out show); house cut taken on the buyout fee."

  - name: compute_section_availability
    trigger: "Reservation create/cancel/exchange; GA SOLD_OUT auto-transition check"
    algorithm: aggregation
    formula: |
      # Capacity-tracked sections (kind IN {GA, RESERVED}) track headcount;
      # TABLE sections track table holds (no ga_capacity).
      section_sold_count = sum(r.party_size for r in show's reservations
                          where r.section_id == this_capacity_section
                          and r.booking_status IN {BOOKED, SEATED, CHECKED_IN})
      section_remaining  = section.ga_capacity - section_sold_count
      # boundary: a create requesting party_size is allowed iff
      #   party_size <= section_remaining  (>, not >=, triggers ERR_SECTION_SOLD_OUT)
      # Show.ga_sold_count is the per-show aggregate over its GA sections only.
    input_set: "Reservations for the capacity-tracked section filtered by booking_status."
    constants: {}
    precision: "integer headcount, exact"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC"
    error_id: ERR_ROLE_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path/body resource id resolves to an existing entity, validated left-to-right in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "X-User-ID ownership: a Patron may only cancel/exchange a Reservation whose patron_id == X-User-ID; a Performer may only counter a LineupSlot whose performer_id == X-User-ID"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "reservation cancel/exchange (Patron), lineup-slot counter (Performer)"

  - priority: 5
    category: business_constraint
    check: "Required input fields present and well-typed; enum values valid; party_size >= 1; seats >= 1; deposit_pct/house_fee_pct in [0,1]; ga_capacity present iff kind IN {GA, RESERVED}"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all create/update endpoints

  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested operation (per §1.2 from-state); for reservation create the show must be sellable (Show.status IN {ON_SALE, SOLD_OUT}) — a DRAFT/PRIVATE_HELD/CANCELLED/SETTLING/SETTLED show rejects new reservations here"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints and reservation create"

  - priority: 7
    category: business_temporal
    check: "Time-gated actions respect the logical clock: settlement open requires now >= ends_at; no-show requires now >= starts_at + doors_buffer; late-cancel window affects refund"
    error_id: ERR_TIMING_NOT_ALLOWED
    http_status: 409
    applies_to: "settlement open, reservation no-show"

  - priority: 8
    category: business_safety
    check: "Posture gate: when Venue.posture == CLOSED, no new shows or reservations; when a show is SETTLING/SETTLED, no new reservations for it (a non-sellable show status that is NOT a normal sale state, applied after the priority-6 sellable-state check passes for ON_SALE/SOLD_OUT shows)"
    error_id: ERR_POSTURE_BLOCKED
    http_status: 409
    applies_to: "show create, show publish, reservation create"

  - priority: 9
    category: business_constraint
    check: "Contract negotiation cap: counter and revise-offer rejected when counter_rounds >= MAX_COUNTER_ROUNDS (MAX_COUNTER_ROUNDS = 3)"
    error_id: ERR_COUNTER_LIMIT_REACHED
    http_status: 409
    applies_to: "lineup-slot counter, lineup-slot revise-offer"

  - priority: 10
    category: business_constraint
    check: "Table fit: assigned SeatTable.seats must be >= Reservation.party_size and table must be in the reservation's section"
    error_id: ERR_TABLE_TOO_SMALL
    http_status: 409
    applies_to: "reservation assign-table"

  - priority: 11
    category: business_constraint
    check: "Server load: assigning a server (or a table to a served reservation) must not push the server's assigned_table_count above max_tables"
    error_id: ERR_SERVER_OVERLOADED
    http_status: 409
    applies_to: "table assign-server, reservation assign-table"

  - priority: 12
    category: business_temporal
    check: "Show-room overlap: a show's [starts_at - doors_buffer_minutes, ends_at] window must not overlap another non-CANCELLED show at the same venue"
    error_id: ERR_SHOW_TIME_CONFLICT
    http_status: 409
    applies_to: "show create"

  - priority: 13
    category: business_constraint
    check: "Table assignment overlap: a SeatTable cannot be HELD/OCCUPIED by two reservations of the same show at once"
    error_id: ERR_TABLE_UNAVAILABLE
    http_status: 409
    applies_to: "reservation assign-table"

  - priority: 14
    category: business_fiscal
    check: "Section capacity: a reservation into a capacity-tracked section (kind IN {GA, RESERVED}) must have party_size <= section_remaining; party_size > section_remaining is rejected"
    error_id: ERR_SECTION_SOLD_OUT
    http_status: 409
    applies_to: "reservation create, reservation exchange"

  - priority: 15
    category: business_fiscal
    check: "Minimum not met: finalize blocked / consumption recording validated against minimum_due_cents"
    error_id: ERR_MINIMUM_NOT_MET
    http_status: 409
    applies_to: "settlement finalize"

  - priority: 16
    category: business_referential
    check: "Cross-show integrity: tier_id and section_id on a reservation must belong to the same show_id; a TicketTier's section must belong to its show"
    error_id: ERR_CROSS_SHOW_REFERENCE
    http_status: 409
    applies_to: "reservation create, ticket-tier create"

  - priority: 17
    category: state
    check: "OCC: expected_<parent>_version must equal the parent's current version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "reservation assign-table, lineup-slot sign"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Logical clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call here the clock reads exactly that default and never falls back to wall-clock time."
    roles: [FloorManager, Booker, BoxOffice]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601"]

  # ---- Venue ----
  - method: POST
    path: "/venues"
    description: "Create a venue"
    roles: [Booker]
    code: 201
    input: [name, settlement_currency, "house_fee_pct?"]
    output: Venue
    side_effects: ["posture=OPEN", "version=1"]

  - method: GET
    path: "/venues/{venue_id}"
    description: "Read venue (includes posture)"
    roles: [Booker, BoxOffice, FloorManager]
    code: 200
    input: []
    output: Venue
    side_effects: []

  - method: POST
    path: "/venues/{venue_id}/close"
    description: "Manually close a venue (posture -> CLOSED)"
    roles: [Booker]
    code: 200
    input: []
    output: Venue
    side_effects: ["posture -> CLOSED; new show/reservation creation blocked"]

  # ---- Show ----
  - method: POST
    path: "/venues/{venue_id}/shows"
    description: "Create a show in DRAFT"
    roles: [Booker]
    code: 201
    input: [title, starts_at, ends_at, "doors_buffer_minutes?"]
    output: Show
    side_effects: ["status=DRAFT; overlap checked against other non-CANCELLED shows at the venue"]

  - method: GET
    path: "/shows/{show_id}"
    description: "Read show (includes status, ga_sold_count, is_private)"
    roles: [Booker, BoxOffice, FloorManager]
    code: 200
    input: []
    output: Show
    side_effects: []

  - method: GET
    path: "/shows"
    description: "List shows filtered by venue_id (reverse-reachability for Show.venue_id) or status; paginated"
    roles: [Booker, BoxOffice, FloorManager]
    code: 200
    input: ["venue_id?", "status?", "limit?", "offset?"]
    output: Show[]
    side_effects: []

  - method: POST
    path: "/venues/{venue_id}/shows/{show_id}/publish"
    description: "Publish a DRAFT show to ON_SALE"
    roles: [Booker]
    code: 200
    input: []
    output: Show
    side_effects: ["status -> ON_SALE"]

  - method: POST
    path: "/venues/{venue_id}/shows/{show_id}/cancel"
    description: "Cancel a show; cascades refunds, table releases, lineup drops, buyout cancel"
    roles: [Booker]
    code: 200
    input: []
    output: Show
    side_effects: ["status -> CANCELLED; cascades per §1.2"]

  # ---- Sections ----
  - method: POST
    path: "/venues/{venue_id}/shows/{show_id}/sections"
    description: "Create a seating section under a show"
    roles: [Booker]
    code: 201
    input: [kind, label, "ga_capacity?"]
    output: SeatingSection
    side_effects: ["ga_capacity required iff kind=GA"]

  - method: GET
    path: "/sections/{section_id}"
    description: "Read a seating section"
    roles: [Booker, BoxOffice, FloorManager]
    code: 200
    input: []
    output: SeatingSection
    side_effects: []

  - method: GET
    path: "/sections"
    description: "List sections filtered by show_id (reverse-reachability for SeatingSection.show_id)"
    roles: [Booker, BoxOffice, FloorManager]
    code: 200
    input: ["show_id?", "limit?", "offset?"]
    output: SeatingSection[]
    side_effects: []

  # ---- Tables ----
  - method: POST
    path: "/venues/{venue_id}/shows/{show_id}/sections/{section_id}/tables"
    description: "Create a table under a TABLE section"
    roles: [Booker, FloorManager]
    code: 201
    input: [table_number, seats, "min_items_per_seat?"]
    output: SeatTable
    side_effects: ["status=AVAILABLE; section must be kind=TABLE"]

  - method: GET
    path: "/tables/{table_id}"
    description: "Read a table (includes status, assigned_server_id)"
    roles: [Booker, BoxOffice, FloorManager]
    code: 200
    input: []
    output: SeatTable
    side_effects: []

  - method: GET
    path: "/tables"
    description: "List tables filtered by section_id (reverse-reachability for SeatTable.section_id) or assigned_server_id (reverse-reachability for SeatTable.assigned_server_id)"
    roles: [Booker, BoxOffice, FloorManager]
    code: 200
    input: ["section_id?", "assigned_server_id?", "limit?", "offset?"]
    output: SeatTable[]
    side_effects: []

  - method: POST
    path: "/tables/{table_id}/assign-server"
    description: "Assign a server to a table"
    roles: [FloorManager]
    code: 200
    input: [server_id]
    output: SeatTable
    side_effects: ["assigned_server_id set; server.assigned_table_count recomputed; rejected if over max_tables"]

  - method: POST
    path: "/tables/{table_id}/retire"
    description: "Retire an AVAILABLE table"
    roles: [FloorManager]
    code: 200
    input: []
    output: SeatTable
    side_effects: ["status -> RETIRED; server.assigned_table_count recomputed"]

  # ---- Ticket tiers ----
  - method: POST
    path: "/venues/{venue_id}/shows/{show_id}/tiers"
    description: "Create a ticket tier for a show's section"
    roles: [Booker]
    code: 201
    input: [section_id, name, price_cents, "min_items_override?"]
    output: TicketTier
    side_effects: ["section must belong to this show (else ERR_CROSS_SHOW_REFERENCE)"]

  - method: GET
    path: "/tiers/{tier_id}"
    description: "Read a ticket tier"
    roles: [Booker, BoxOffice, FloorManager]
    code: 200
    input: []
    output: TicketTier
    side_effects: []

  - method: GET
    path: "/tiers"
    description: "List tiers filtered by show_id (reverse-reachability for TicketTier.show_id) or section_id (reverse-reachability for TicketTier.section_id)"
    roles: [Booker, BoxOffice, FloorManager]
    code: 200
    input: ["show_id?", "section_id?", "limit?", "offset?"]
    output: TicketTier[]
    side_effects: []

  # ---- Performers ----
  - method: POST
    path: "/performers"
    description: "Register a performer"
    roles: [Booker]
    code: 201
    input: [stage_name, email, standard_fee_cents]
    output: Performer
    side_effects: ["version=1"]

  - method: GET
    path: "/performers/{performer_id}"
    description: "Read a performer"
    roles: [Booker, FloorManager, Performer]
    code: 200
    input: []
    output: Performer
    side_effects: []

  # ---- Lineup slots / contracts ----
  - method: POST
    path: "/lineup-slots"
    description: "Offer a lineup slot (contract OFFERED) linking a show and performer"
    roles: [Booker]
    code: 201
    input: [show_id, performer_id, slot_order, role, offered_fee_cents]
    output: LineupSlot
    side_effects: ["contract_status=OFFERED; slot_order unique among non-DROPPED slots for the show"]

  - method: GET
    path: "/lineup-slots/{lineup_slot_id}"
    description: "Read a lineup slot"
    roles: [Booker, FloorManager, Performer]
    code: 200
    input: []
    output: LineupSlot
    side_effects: []

  - method: GET
    path: "/lineup-slots"
    description: "List lineup slots filtered by show_id or performer_id (reverse-reachability)"
    roles: [Booker, FloorManager, Performer]
    code: 200
    input: ["show_id?", "performer_id?", "limit?", "offset?"]
    output: LineupSlot[]
    side_effects: []

  - method: POST
    path: "/lineup-slots/{lineup_slot_id}/counter"
    description: "Performer counters the offer (OFFERED -> COUNTERED)"
    roles: [Performer]
    code: 200
    input: [counter_fee_cents]
    output: LineupSlot
    side_effects: ["offered_fee_cents := counter_fee_cents; counter_rounds += 1"]

  - method: POST
    path: "/lineup-slots/{lineup_slot_id}/revise-offer"
    description: "Booker revises the offer (COUNTERED -> OFFERED)"
    roles: [Booker]
    code: 200
    input: [new_offered_fee_cents]
    output: LineupSlot
    side_effects: ["offered_fee_cents := new_offered_fee_cents"]

  - method: POST
    path: "/lineup-slots/{lineup_slot_id}/sign"
    description: "Sign the contract (OFFERED/COUNTERED -> SIGNED), OCC-guarded on the slot version"
    roles: [Booker, Performer]
    code: 200
    input: [expected_lineup_slot_version]
    output: LineupSlot
    side_effects: ["contract_status -> SIGNED; agreed_fee_cents := offered_fee_cents; increments LineupSlot.version by 1"]

  - method: POST
    path: "/lineup-slots/{lineup_slot_id}/drop"
    description: "Drop a lineup slot (-> DROPPED)"
    roles: [Booker]
    code: 200
    input: []
    output: LineupSlot
    side_effects: ["contract_status -> DROPPED"]

  # ---- Reservations ----
  - method: POST
    path: "/reservations"
    description: "Create a reservation (party booking) against a show/section/tier"
    roles: [BoxOffice, Patron]
    code: 201
    input: [show_id, section_id, tier_id, patron_id, party_size, "is_comp?"]
    output: Reservation
    side_effects: ["booking_status=BOOKED; settlement_status=UNCOLLECTED; compute_ticket_charge; compute_minimum_due (pre_seating_estimate); GA capacity checked; Show may -> SOLD_OUT"]

  - method: GET
    path: "/reservations/{reservation_id}"
    description: "Read a reservation (both status dimensions, computed money fields)"
    roles: [BoxOffice, FloorManager, Patron]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: GET
    path: "/reservations"
    description: "List reservations filtered by show_id, section_id, tier_id, table_id, or patron_id (reverse-reachability for Reservation.show_id, .section_id, .tier_id, .table_id)"
    roles: [BoxOffice, FloorManager, Patron]
    code: 200
    input: ["show_id?", "section_id?", "tier_id?", "table_id?", "patron_id?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: POST
    path: "/reservations/{reservation_id}/collect-ticket"
    description: "Collect ticket payment (settlement UNCOLLECTED -> TICKET_PAID), issues tickets"
    roles: [BoxOffice]
    code: 200
    input: []
    output: Reservation
    side_effects: ["settlement_status -> TICKET_PAID; one Ticket per seat issued ISSUED"]

  - method: POST
    path: "/reservations/{reservation_id}/assign-table"
    description: "Assign a TABLE-section reservation to a table (AVAILABLE -> HELD), OCC-guarded on the table version"
    roles: [FloorManager]
    code: 200
    input: [table_id, expected_table_version]
    output: Reservation
    side_effects: ["Reservation.table_id set; SeatTable.status -> HELD; compute_minimum_due recomputed (post_seating_final); increments SeatTable.version by 1"]

  - method: POST
    path: "/reservations/{reservation_id}/seat"
    description: "Seat a party (booking BOOKED -> SEATED)"
    roles: [FloorManager]
    code: 200
    input: []
    output: Reservation
    side_effects: ["booking_status -> SEATED; SeatTable.status -> OCCUPIED"]

  - method: POST
    path: "/reservations/{reservation_id}/check-in"
    description: "Check a party in at the door (booking -> CHECKED_IN); scans tickets"
    roles: [BoxOffice]
    code: 200
    input: []
    output: Reservation
    side_effects: ["booking_status -> CHECKED_IN; tickets ISSUED -> SCANNED in created_at ASC"]

  - method: POST
    path: "/reservations/{reservation_id}/record-consumption"
    description: "Record items/drinks consumed; may flip settlement TICKET_PAID -> MINIMUM_MET"
    roles: [FloorManager]
    code: 200
    input: [delta_cents]
    output: Reservation
    side_effects: ["items_consumed_cents += delta_cents; settlement_status -> MINIMUM_MET when threshold reached"]

  - method: POST
    path: "/reservations/{reservation_id}/cancel"
    description: "Cancel a reservation; computes refund and releases held resources"
    roles: [BoxOffice, Patron]
    code: 200
    input: []
    output: Reservation
    side_effects: ["booking_status -> CANCELLED; compute_refund; settlement_status -> REFUNDED; table released; show ga_sold_count recomputed"]

  - method: POST
    path: "/reservations/{reservation_id}/exchange"
    description: "Exchange a BOOKED reservation for a new tier/section; credits difference"
    roles: [BoxOffice, Patron]
    code: 200
    input: [target_section_id, target_tier_id]
    output: Reservation
    side_effects: ["old row -> EXCHANGED + REFUNDED with credited difference; new Reservation created BOOKED; resources rebalanced"]

  - method: POST
    path: "/reservations/{reservation_id}/no-show"
    description: "Mark a reservation as a no-show (no refund)"
    roles: [FloorManager]
    code: 200
    input: []
    output: Reservation
    side_effects: ["booking_status -> NO_SHOW; refunded_cents=0; table released"]

  - method: GET
    path: "/tickets/{ticket_id}"
    description: "Read a single issued ticket"
    roles: [BoxOffice, FloorManager, Patron]
    code: 200
    input: []
    output: Ticket
    side_effects: []

  - method: GET
    path: "/tickets"
    description: "List tickets filtered by reservation_id (reverse-reachability for Ticket.reservation_id)"
    roles: [BoxOffice, FloorManager, Patron]
    code: 200
    input: ["reservation_id?", "limit?", "offset?"]
    output: Ticket[]
    side_effects: []

  # ---- Guest list ----
  - method: POST
    path: "/guest-list-entries"
    description: "Add a comp/guest-list entry for a show, hosted by a performer"
    roles: [Booker, Performer]
    code: 201
    input: [show_id, host_performer_id, guest_name, party_size, "minimum_waived?"]
    output: GuestListEntry
    side_effects: ["status=LISTED"]

  - method: GET
    path: "/guest-list-entries/{guest_list_entry_id}"
    description: "Read a guest-list entry"
    roles: [Booker, FloorManager, Performer]
    code: 200
    input: []
    output: GuestListEntry
    side_effects: []

  - method: GET
    path: "/guest-list-entries"
    description: "List guest-list entries filtered by show_id, host_performer_id, or reservation_id (reverse-reachability for GuestListEntry.show_id, .host_performer_id, .reservation_id)"
    roles: [Booker, FloorManager, Performer]
    code: 200
    input: ["show_id?", "host_performer_id?", "reservation_id?", "limit?", "offset?"]
    output: GuestListEntry[]
    side_effects: []

  - method: POST
    path: "/guest-list-entries/{guest_list_entry_id}/convert"
    description: "Convert a guest-list entry into a comp reservation"
    roles: [BoxOffice]
    code: 200
    input: [section_id, tier_id]
    output: GuestListEntry
    side_effects: ["status -> CONVERTED; creates a comp Reservation (is_comp=true); reservation_id linked"]

  - method: POST
    path: "/guest-list-entries/{guest_list_entry_id}/revoke"
    description: "Revoke a guest-list entry"
    roles: [Booker, Performer]
    code: 200
    input: []
    output: GuestListEntry
    side_effects: ["status -> REVOKED"]

  # ---- Servers ----
  - method: POST
    path: "/servers"
    description: "Register a floor server"
    roles: [FloorManager]
    code: 201
    input: [name, "max_tables?"]
    output: Server
    side_effects: ["version=1"]

  - method: GET
    path: "/servers/{server_id}"
    description: "Read a server (includes assigned_table_count)"
    roles: [FloorManager, Booker]
    code: 200
    input: []
    output: Server
    side_effects: []

  # ---- Private events ----
  - method: POST
    path: "/private-events"
    description: "Create a private buyout (HELD) for a DRAFT show; computes deposit"
    roles: [Booker]
    code: 201
    input: [show_id, client_name, buyout_fee_cents, "deposit_pct?"]
    output: PrivateEvent
    side_effects: ["status=HELD; compute_buyout_deposit; Show DRAFT -> PRIVATE_HELD"]

  - method: GET
    path: "/private-events/{private_event_id}"
    description: "Read a private event"
    roles: [Booker, FloorManager]
    code: 200
    input: []
    output: PrivateEvent
    side_effects: []

  - method: GET
    path: "/private-events"
    description: "List private events filtered by show_id (reverse-reachability for PrivateEvent.show_id)"
    roles: [Booker, FloorManager]
    code: 200
    input: ["show_id?", "limit?", "offset?"]
    output: PrivateEvent[]
    side_effects: []

  - method: POST
    path: "/private-events/{private_event_id}/confirm"
    description: "Confirm a held buyout (HELD -> CONFIRMED)"
    roles: [Booker]
    code: 200
    input: []
    output: PrivateEvent
    side_effects: ["status -> CONFIRMED"]

  - method: POST
    path: "/private-events/{private_event_id}/cancel"
    description: "Cancel a buyout; deposit retained; may revert show to ON_SALE"
    roles: [Booker]
    code: 200
    input: []
    output: PrivateEvent
    side_effects: ["status -> CANCELLED; Show PRIVATE_HELD -> ON_SALE if no other buyout"]

  # ---- Settlements ----
  - method: POST
    path: "/settlements"
    description: "Open a settlement for a show after it ends (show -> SETTLING)"
    roles: [FloorManager]
    code: 201
    input: [show_id]
    output: Settlement
    side_effects: ["status=OPEN; Show -> SETTLING; Venue.posture -> RECONCILING; requires now >= ends_at"]

  - method: GET
    path: "/settlements/{settlement_id}"
    description: "Read a settlement (computed money fields once finalized)"
    roles: [FloorManager, Booker]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: GET
    path: "/settlements"
    description: "List settlements filtered by show_id (reverse-reachability for Settlement.show_id)"
    roles: [FloorManager, Booker]
    code: 200
    input: ["show_id?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []

  - method: POST
    path: "/settlements/{settlement_id}/finalize"
    description: "Finalize a settlement; runs compute_settlement; cascades Show -> SETTLED"
    roles: [FloorManager]
    code: 200
    input: []
    output: Settlement
    side_effects: ["compute_settlement; status -> FINALIZED; Show -> SETTLED; Venue.posture recomputed"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth / existence ---
  - { id: ERR_MISSING_AUTH, http: 401, condition: "X-User-Role or X-User-ID header missing" }
  - { id: ERR_ROLE_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "Acting Patron/Performer is not the owner of the target reservation/lineup slot" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, bad type, invalid enum, party_size<1, seats<1, pct out of [0,1], or ga_capacity present/absent inconsistent with kind" }
  - { id: ERR_CROSS_SHOW_REFERENCE, http: 409, condition: "section_id and tier_id (or tier section) do not belong to the same show" }
  # --- state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  # --- temporal ---
  - { id: ERR_TIMING_NOT_ALLOWED, http: 409, condition: "Action attempted outside its allowed logical-clock window (settlement before ends_at, no-show before doors+buffer)" }
  - { id: ERR_SHOW_TIME_CONFLICT, http: 409, condition: "New show's [starts_at - doors_buffer, ends_at] window overlaps another non-CANCELLED show at the venue" }
  # --- posture / safety ---
  - { id: ERR_POSTURE_BLOCKED, http: 409, condition: "Venue CLOSED, or show SETTLING/SETTLED, blocks new shows/reservations" }
  # --- contract ---
  - { id: ERR_COUNTER_LIMIT_REACHED, http: 409, condition: "counter_rounds >= MAX_COUNTER_ROUNDS; no further counter/revise allowed" }
  # --- seating / quota ---
  - { id: ERR_SECTION_SOLD_OUT, http: 409, condition: "GA reservation party_size exceeds remaining GA capacity" }
  - { id: ERR_TABLE_TOO_SMALL, http: 409, condition: "SeatTable.seats < Reservation.party_size on assign-table" }
  - { id: ERR_TABLE_UNAVAILABLE, http: 409, condition: "SeatTable is not AVAILABLE (already HELD/OCCUPIED/RETIRED) on assign-table" }
  - { id: ERR_WRONG_SECTION_KIND, http: 409, condition: "Operation requires a section of a specific kind (e.g. table create on non-TABLE section, assign-table on a GA reservation)" }
  - { id: ERR_SERVER_OVERLOADED, http: 409, condition: "Server assignment would exceed the server's max_tables" }
  - { id: ERR_NO_SERVER_ASSIGNED, http: 409, condition: "assign-table attempted on a table with no assigned server" }
  # --- settlement / fiscal ---
  - { id: ERR_MINIMUM_NOT_MET, http: 409, condition: "Settlement finalize blocked: a checked-in TICKET_PAID reservation has items_consumed_cents below minimum_due_cents" }
  - { id: ERR_SETTLEMENT_EXISTS, http: 409, condition: "An OPEN settlement already exists for this show" }
  - { id: ERR_SHOW_NOT_ENDED, http: 409, condition: "Settlement open attempted before now >= Show.ends_at" }
  # --- guest list ---
  - { id: ERR_GUEST_LIST_NOT_LISTED, http: 409, condition: "convert/revoke attempted on a guest-list entry not in LISTED state" }
  # --- pagination ---
  - { id: ERR_INVALID_PAGINATION, http: 422, condition: "limit/offset out of bounds (limit not in [1,100], offset < 0)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Booker
    description: "Programs shows, sections, tiers, performers, lineup contracts, and private buyouts"
    identity: "opaque"
    exclusive_operations:
      - "POST /venues — create venue"
      - "POST /venues/{id}/close — close venue"
      - "POST /venues/{id}/shows — create show"
      - "POST /venues/{id}/shows/{id}/publish — publish show"
      - "POST /venues/{id}/shows/{id}/cancel — cancel show"
      - "POST /venues/{id}/shows/{id}/sections — create section"
      - "POST /venues/{id}/shows/{id}/tiers — create tier"
      - "POST /performers — register performer"
      - "POST /lineup-slots — offer lineup slot"
      - "POST /lineup-slots/{id}/revise-offer — revise offer"
      - "POST /lineup-slots/{id}/drop — drop slot"
      - "POST /private-events — create buyout"
      - "POST /private-events/{id}/confirm — confirm buyout"
      - "POST /private-events/{id}/cancel — cancel buyout"
    shared_operations:
      - "POST /lineup-slots/{id}/sign — sign contract (with Performer)"
      - "POST /guest-list-entries — add comp (with Performer)"
      - "POST /guest-list-entries/{id}/revoke — revoke comp (with Performer)"
      - "POST /venues/{id}/shows/{id}/sections/{id}/tables — create table (with FloorManager)"
      - "GET endpoints — reads"

  - name: BoxOffice
    description: "Sells, collects, checks in, cancels, and exchanges reservations; converts guest list"
    identity: "opaque"
    exclusive_operations:
      - "POST /reservations/{id}/collect-ticket — collect ticket payment"
      - "POST /reservations/{id}/check-in — check party in"
      - "POST /guest-list-entries/{id}/convert — convert comp to reservation"
    shared_operations:
      - "POST /reservations — create reservation (with Patron)"
      - "POST /reservations/{id}/cancel — cancel reservation (with Patron)"
      - "POST /reservations/{id}/exchange — exchange reservation (with Patron)"
      - "GET endpoints — reads"

  - name: FloorManager
    description: "Runs the room: assigns tables/servers, seats, records consumption, no-shows, and box-office settlement"
    identity: "opaque"
    exclusive_operations:
      - "POST /venues/{id}/shows/{id}/sections/{id}/tables/{id}/assign-server — assign server"
      - "POST /venues/{id}/shows/{id}/sections/{id}/tables/{id}/retire — retire table"
      - "POST /reservations/{id}/assign-table — assign table"
      - "POST /reservations/{id}/seat — seat party"
      - "POST /reservations/{id}/record-consumption — record consumption"
      - "POST /reservations/{id}/no-show — mark no-show"
      - "POST /servers — register server"
      - "POST /settlements — open settlement"
      - "POST /settlements/{id}/finalize — finalize settlement"
    shared_operations:
      - "POST /venues/{id}/shows/{id}/sections/{id}/tables — create table (with Booker)"
      - "GET endpoints — reads"

  - name: Patron
    description: "Ticket buyer acting on their own reservations; X-User-ID is the patron_id on those reservations"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /reservations — create own reservation (with BoxOffice)"
      - "POST /reservations/{id}/cancel — cancel own reservation (with BoxOffice)"
      - "POST /reservations/{id}/exchange — exchange own reservation (with BoxOffice)"
      - "GET own reservation / tickets"

  - name: Performer
    description: "Acts on own lineup contracts (counter/sign) and own guest list; X-User-ID equals the Performer entity id"
    identity: "entity_backed:Performer"
    exclusive_operations:
      - "POST /lineup-slots/{id}/counter — counter an offer"
    shared_operations:
      - "POST /lineup-slots/{id}/sign — sign contract (with Booker)"
      - "POST /guest-list-entries — add comp (with Booker)"
      - "POST /guest-list-entries/{id}/revoke — revoke comp (with Booker)"
      - "GET own lineup slots / performer / guest list"
