  - section: consistency_model
    instances:
      - name: certificate_issuance_is_visible_in_its_own_response_and_in_every_immediate_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.certificate_validity_window
          - calculations.provider_ledger_balance
          - endpoints.GET /candidates/{id}/compliance-summary
        distinguishing_aspect: |
          There is no settle step and no lag anywhere: the POST /certificates response itself already carries
          every computed field (certificate_number, expires_at, recert_window_opens_at, issuance_fee_cents), and
          the very next requests — with no intervening write, no clock move and no refresh call — show the
          candidate at CERTIFIED, the provider ledger already debited by 1500, the derived compliance-summary
          projection fully populated, and the filtered list already counting the new row. An implementation that
          computes any of these on a later read, or that needs a second call to reconcile the ledger, fails.
        test_recipe:
          setup:
            - "Jurisdiction J (recert_cycle_months 60, requires_local_registration false, surcharge 0.045) / provider prepaid 500000 / ACTIVE EN form / 2-seat EN site / REGISTERED EN proctor."
            - "Candidate A sat on 2026-09-12, scored 60 of 80, and the report is FINAL with pass_flag true. The clock stays at 2026-09-12T10:30:00Z. No certificate exists yet, and the provider ledger reads lifetime_credited_cents 500000 / lifetime_charged_cents 3762 / credit_balance_cents 496238."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Travis County Health TX", jurisdiction_code: "TX-TRAVIS", accepted_accreditation_bodies: ["ANAB_CFP"], accepted_languages: ["EN"], requires_local_registration: false, recert_cycle_months: 60, exam_fee_surcharge_pct: 0.045 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /training-providers"
              payload: { legal_name: "Lone Star Food Safety", jurisdiction_id: "${jur_id}", contact_email: "ops@lonestar.test" }
