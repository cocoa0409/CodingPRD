        grounds: ["roles.PlatformAdmin", "roles.Member", "errors[ERR_ROLE_FORBIDDEN]", "validations[priority=3]"]
        distinguishing_aspect: "Plan creation is exclusive to PlatformAdmin: a Member attempting it returns ERR_ROLE_FORBIDDEN with HTTP 403, and no plan is created."
        test_recipe:
          setup: ["One ACTIVE member exists."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
