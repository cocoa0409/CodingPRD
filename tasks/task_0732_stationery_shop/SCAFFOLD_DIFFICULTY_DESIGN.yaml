              as: Customer
              captures: { d7_id: "$.data.id" }
            - call: "POST /orders"
              payload: { customer_id: "${c7_id}", design_id: "${d7_id}" }
              as: Customer
              captures: { o7_id: "$.data.id", o7_v0: "$.data.version" }
            - call: "POST /orders/${o7_id}/line-items"
              payload: { paper_stock_id: "${p7_id}", finish_option_id: "${f7_id}", quantity: 150, expected_order_version: "${o7_v0}" }
              as: Customer
            - call: "POST /orders/${o7_id}/addressing-jobs"
              payload: { job_type: "ADDRESSING", quantity: 150, scheduled_date: "2026-04-20", unit_price_cents: 200 }
              as: Customer
              as_user_id: "${c7_id}"
              captures: { aj7_id: "$.data.id" }
            - call: "POST /orders/${o7_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${c7_id}"
            - call: "POST /_payments/simulate"
              payload: { order_id: "${o7_id}", amount_cents: 41250, outcome: "SUCCEEDED" }
              as: ShopAdmin
            - call: "POST /designs/${d7_id}/proofs"
              payload: { designer_id: "${des7_id}" }
              as: Designer
              captures: { pr7_id: "$.data.id" }
            - call: "POST /proofs/${pr7_id}/submit"
              payload: {}
              as: Designer
          trigger:
            - call: "POST /orders/${o7_id}/cancel"
              payload: {}
              as: Customer
