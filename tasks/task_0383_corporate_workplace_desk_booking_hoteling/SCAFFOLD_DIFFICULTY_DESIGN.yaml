            - call: "POST /workplace/reservations"
              payload: { employee_id: "${emp_a}", resource_type: "SEAT", seat_id: "${seat_a}", booking_date: "2026-07-01", start_minute: 540, end_minute: 600, expected_seat_version: "${seat_a_v}" }
              as: Employee
