    code: 200
    input: ["limit?", "offset?"]
    output: Waiver[]
    side_effects: []

  # --- Invoices ---
  - method: GET
    path: /chair-massage/invoices
    description: "List invoices (paginated)"
    roles: [PlatformAdmin, Organizer]
    code: 200
    input: ["limit?", "offset?", "status?", "corporate_account_id?", "booking_id?"]
    output: Invoice[]
    side_effects: []

  - method: GET
    path: /chair-massage/invoices/{id}
    description: "Fetch one invoice"
    roles: [PlatformAdmin, Organizer]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: POST
    path: /chair-massage/invoices/{id}/issue
    description: "Issue a DRAFT invoice (checks credit limit)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "CorporateAccount.outstanding_balance_cents += total_cents"
      - "CorporateAccount.lifetime_billed_cents += total_cents"
      - "Booking.billing_status UNBILLED -> INVOICED"
      - "Invoice.version += 1"

  - method: POST
    path: /chair-massage/invoices/{id}/record-payment
    description: "Record payment on an ISSUED invoice"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "CorporateAccount.outstanding_balance_cents -= total_cents"
      - "Booking.billing_status INVOICED -> PAID"
      - "Invoice.version += 1"

  - method: POST
    path: /chair-massage/invoices/{id}/dispute
    description: "Organizer disputes an ISSUED invoice"
    roles: [Organizer]
    code: 200
    input: [dispute_reason]
    output: Invoice
    side_effects:
      - "Booking.billing_status INVOICED -> DISPUTED"
      - "Invoice.version += 1"

  - method: POST
    path: /chair-massage/invoices/{id}/resolve-dispute
    description: "Admin resolves dispute; invoice returns DISPUTED -> ISSUED (cyclic)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "Booking.billing_status DISPUTED -> INVOICED"
      - "Invoice.version += 1"

  - method: POST
    path: /chair-massage/invoices/{id}/void
    description: "Void a DRAFT or DISPUTED invoice (cyclic-back to UNBILLED on booking)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "From DISPUTED: outstanding_balance_cents -= total_cents; Booking.billing_status DISPUTED -> UNBILLED"
      - "From DRAFT: no balance change; Booking.billing_status stays UNBILLED"
      - "Invoice.version += 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or empty X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint per RBAC" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id references a non-existent entity" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed field: bad enum value, bad date format, integer out of range, window_duration_minutes not divisible by slot_minutes is reported under ERR_WINDOW_NOT_DIVISIBLE instead" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity not in a state from which the requested transition is permitted" }
  - { id: ERR_STALE_BOOKING_VERSION, http: 412, condition: "expected_booking_version does not match Booking.version" }
  - { id: ERR_STALE_CHAIR_SLOT_VERSION, http: 412, condition: "expected_chair_slot_version does not match ChairSlot.version" }
  - { id: ERR_THERAPIST_DAILY_CAP, http: 422, condition: "Assignment would push therapist's booked chair-minutes on event_date above max_minutes_per_day" }
  - { id: ERR_LICENSE_INVALID, http: 422, condition: "Therapist lacks an ACTIVE license in the booking's region with expires_on >= event_date" }
  - { id: ERR_THERAPIST_DOUBLE_BOOKED, http: 422, condition: "Therapist has another ASSIGNED/EN_ROUTE/ON_SITE ChairSlot whose extended window overlaps this booking's extended window on the same event_date" }
  - { id: ERR_SIGNUP_SHEET_FULL, http: 422, condition: "Claiming a new slot would exceed window_duration_minutes / slot_minutes for this chair" }
  - { id: ERR_DUPLICATE_SIGNUP, http: 422, condition: "recipient_email already has a non-CANCELLED claim on this booking" }
  - { id: ERR_WAIVER_MISSING, http: 422, condition: "Check-in attempted without an active (non-revoked) waiver for this claim" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "Issuing would push CorporateAccount.outstanding_balance_cents above credit_limit_cents" }
  - { id: ERR_LIVE_INVOICE_EXISTS, http: 422, condition: "Another DRAFT/ISSUED/DISPUTED invoice already exists for this booking" }
  - { id: ERR_DUPLICATE_SURVEY, http: 422, condition: "A SatisfactionSurvey already exists for this slot_claim_id" }
  - { id: ERR_WINDOW_NOT_DIVISIBLE, http: 422, condition: "window_duration_minutes is not an exact multiple of slot_minutes" }
  - { id: ERR_ACCOUNT_SUSPENDED, http: 422, condition: "Operation requires CorporateAccount.status == ACTIVE" }
  - { id: ERR_REGION_INACTIVE, http: 422, condition: "Operation requires Region.is_active == true" }
  - { id: ERR_BOOKING_NOT_COMPLETED, http: 422, condition: "Survey submission requires the SlotClaim's booking to be IN_PROGRESS or COMPLETED and the claim to be COMPLETED" }
  - { id: ERR_CLAIMS_OUTSTANDING, http: 422, condition: "Booking.complete requires every SlotClaim of the booking to be in {COMPLETED, NO_SHOW, CANCELLED}" }
  - { id: ERR_DISPUTE_REASON_REQUIRED, http: 400, condition: "Invoice dispute attempted with empty dispute_reason" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator with full override; manages regions, accounts, therapists, licenses, invoices, payouts"
    identity: "opaque"
    exclusive_operations:
      - "POST /chair-massage/regions"
      - "POST /chair-massage/corporate-accounts"
      - "POST /chair-massage/corporate-accounts/{id}/suspend, reactivate, close"
      - "POST /chair-massage/therapists"
      - "POST /chair-massage/therapists/{id}/suspend, reactivate, deactivate"
      - "POST /chair-massage/therapist-licenses and license suspend/reinstate/revoke"
      - "POST /chair-massage/bookings/{id}/invoices (create DRAFT invoice)"
      - "POST /chair-massage/invoices/{id}/issue, record-payment, resolve-dispute, void"
      - "POST /chair-massage/waivers/{id}/revoke"
      - "POST /chair-massage/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: Organizer
    description: "Corporate HR or event planner; owns Bookings and WellnessPrograms of their CorporateAccount"
    identity: "entity_backed:CorporateAccount"
    exclusive_operations:
      - "POST /chair-massage/wellness-programs and program pause/resume/terminate/materialize-occurrence"
      - "POST /chair-massage/bookings (EVENT booking creation)"
      - "POST /chair-massage/bookings/{id}/open-scheduling, confirm, start-service, complete, cancel"
      - "POST /chair-massage/chair-slots/{id}/assign, release, mark-no-show"
      - "POST /chair-massage/chair-slots/{id}/claims (sign-up sheet)"
      - "POST /chair-massage/slot-claims/{id}/check-in, cancel, mark-no-show"
      - "POST /chair-massage/slot-claims/{id}/waiver"
      - "POST /chair-massage/slot-claims/{id}/satisfaction-surveys"
      - "POST /chair-massage/invoices/{id}/dispute"
    shared_operations:
      - "GET endpoints for own account's resources"

  - name: Therapist
    description: "Massage therapist; manages own chair-slot lifecycle and completes claims"
    identity: "entity_backed:Therapist"
    exclusive_operations:
      - "POST /chair-massage/chair-slots/{id}/depart, arrive"
      - "POST /chair-massage/slot-claims/{id}/complete"
    shared_operations:
      - "GET endpoints for own schedule, licenses, payout ledger"
