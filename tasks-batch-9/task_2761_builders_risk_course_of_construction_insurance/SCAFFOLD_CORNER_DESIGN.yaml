            - "e6 == ERR_CLAIM_NOT_FOUND, e7 == ERR_PAYMENT_NOT_FOUND, e8 == ERR_NOTICE_NOT_FOUND, e9 == ERR_FACILITY_NOT_FOUND, e10 == ERR_ASSIGNMENT_NOT_FOUND"
            - "all ten responses carry HTTP 404"
            - "GET /builders-risk/projects, GET /builders-risk/policies, GET /builders-risk/claims and GET /builders-risk/facilities each return total_count == 0 with has_more == false - the reads created nothing"

      - name: corner_body_foreign_key_not_found_outranks_the_body_schema_check
        claim_type: violation_to_error
        grounds:
          - validations[priority 32].body foreign-key not-found
          - validations[priority 40].ERR_INVALID_REQUEST
          - errors[ERR_POLICY_NOT_FOUND]
          - errors[ERR_INTEREST_NOT_FOUND]
        distinguishing_aspect: "A body FK that does not resolve is reported as that entity's not-found error (404) even when the same body also carries an out-of-range integer that priority 40 would reject, because the FK check sits at priority 32 - and the FK error names the missing entity family, not the endpoint's own entity."
        test_recipe:
          setup:
            - "One ELIGIBLE project with a DRAFT policy and one OWNER interest, so the endpoints have valid alternatives to the unknown ids used below."
          setup_api_calls:
            - call: "POST /builders-risk/projects"
              payload: { name: "Cedar Mills Warehouse", site_address: "12 Mill Rd, Cedar", construction_type: "FIRE_RESISTIVE", project_kind: "NEW_CONSTRUCTION", hard_cost_value_cents: 400000000, cat_zone: "INLAND", planned_start_date: "2026-09-01T00:00:00Z", projected_completion_date: "2027-03-01T00:00:00Z" }
