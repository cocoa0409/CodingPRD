  # ===========================================================================
  # RULE 5 — priority_pair_validation_conflict
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: invalid_state_at_priority_9_beats_club_day_capacity_at_priority_32
        grounds:
          - validations[priority=9]
          - validations[priority=32]
          - calculations.club_day_calendar_utilization
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CLUB_DAY_CAPACITY_FULL]
        distinguishing_aspect: |
          Event B is DRAFT at a club whose single daily slot is already taken
          by a CONFIRMED event on the same date, so APPROVE on B violates both
          validations[priority=9] (DRAFT is not a from-state of APPROVE) and
          validations[priority=32] (confirmed_count 1 >= daily_event_capacity
          1). The response must be ERR_INVALID_STATE, not
          ERR_CLUB_DAY_CAPACITY_FULL. The control step then submits B and
          re-approves, proving the capacity rule really was violated all along
          by returning ERR_CLUB_DAY_CAPACITY_FULL from the identical call.
        test_recipe:
          setup:
            - "Club C with daily_event_capacity 1 — the tightest legal value — and food_station_count 2."
            - "Non-food product P in category HOUSEHOLD with weekly_sample_case_pool 20, so ERR_FOOD_STATION_UNAVAILABLE (priority 33) cannot fire and category_count stays at 1 of MAX_EVENTS_PER_CATEGORY_PER_DAY 2 so priority 34 cannot fire either. Priorities 9 and 32 are the only two rules in contention."
            - "Event A on 2026-09-14 MORNING driven to CONFIRMED, consuming the club's only slot for that date."
            - "Event B on 2026-09-14 AFTERNOON left in DRAFT."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Verrow Housewares", billing_email: "ap@verrow.example", program_tier: "STANDARD", credit_limit_cents: 3000000, credit_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { mfr_id: "$.data.id" }
            - call: "POST /clubs"
              payload: { club_number: "C-4909", name: "Verrow Club 4909", region_code: "W", club_tier: "STANDARD", daily_event_capacity: 1, food_station_count: 2, health_permit_expires_on: "2027-10-31" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "VW-PAN-909", name: "Ceramic Sauté Pan", category: "HOUSEHOLD", requires_food_handling: false, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 3400, samples_per_case: 4, weekly_sample_case_pool: 20 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_id: "$.data.id" }
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-09-14", day_part: "MORNING", requested_sample_cases: 2, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { a_id: "$.data.id" }
            - call: "POST /demo-events/${a_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /demo-events/${a_id}/transitions"
              payload: { action: "APPROVE" }
              as: ClubOperations
              as_user_id: "${club_id}"
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-09-14", day_part: "AFTERNOON", requested_sample_cases: 2, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { b_id: "$.data.id" }
          trigger:
            - call: "POST /demo-events/${b_id}/transitions"
              payload: { action: "APPROVE" }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { err_from_draft: "$.data.error_id" }
            - call: "POST /demo-events/${b_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /demo-events/${b_id}/transitions"
              payload: { action: "APPROVE" }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { err_from_submitted: "$.data.error_id" }
            - call: "GET /clubs/${club_id}/capacity?event_date=2026-09-14"
              payload: { event_date: "2026-09-14" }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { confirmed_count: "$.data.confirmed_count", remaining_slots: "$.data.remaining_slots" }
          assert:
            - "${err_from_draft} == ERR_INVALID_STATE"
            - "the first APPROVE responds with HTTP 409"
            - "${err_from_draft} != ERR_CLUB_DAY_CAPACITY_FULL"
            - "${err_from_submitted} == ERR_CLUB_DAY_CAPACITY_FULL"
            - "the third APPROVE responds with HTTP 409"
            - "DemoEvent.${b_id}.booking_status == SUBMITTED"
            - "DemoEvent.${b_id}.allocated_sample_cases == 0"
            - "DemoEvent.${b_id}.approved_at == null"
            - "DemoEvent.${a_id}.booking_status == CONFIRMED"
            - "${confirmed_count} == 1"
            - "${remaining_slots} == 0"

      - name: food_cert_at_priority_17_beats_home_club_mismatch_at_priority_21
        grounds:
          - validations[priority=17]
          - validations[priority=21]
          - errors[ERR_FOOD_CERT_INVALID]
          - errors[ERR_DEMONSTRATOR_CLUB_MISMATCH]
          - entities.EventAssignment.fields.travel_authorized
        distinguishing_aspect: |
          A demonstrator homed at club B with no FOOD_HANDLER certification is
          assigned to a FOOD_SAMPLING event at club A without travel
          authorisation, violating validations[priority=17] and
          validations[priority=21] at once; the response must be
          ERR_FOOD_CERT_INVALID. Granting the certification and repeating the
          identical call then yields ERR_DEMONSTRATOR_CLUB_MISMATCH, proving
          the lower-priority rule was live under the first failure. Unlike the
          state-versus-capacity pair, both rules here sit in the 422 band and
          in different categories (business_safety vs business_referential),
          so the pair cannot be distinguished by HTTP status alone.
        test_recipe:
          setup:
            - "Two clubs: A (the host, club_number C-5010) and B (the demonstrator's home club, club_number C-5011)."
            - "FOOD product P with requires_heat_equipment false and allergen_flag false, so priority 18 (ERR_SPECIALTY_CERT_MISSING) is never in contention."
            - "DemoEvent E at club A on 2026-09-14 MIDDAY with requested_sample_cases 3, driven to CONFIRMED so allocated_sample_cases is 3, required_support_count is 0 and one LEAD alone can make it FULLY_STAFFED."
            - "Demonstrator D: home_club_id is club B, employment_status ACTIVE (so priority 16 is satisfied), holding NO certification at all."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Saltmarsh Kitchens", billing_email: "ap@saltmarsh.example", program_tier: "STANDARD", credit_limit_cents: 3000000, credit_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { mfr_id: "$.data.id" }
            - call: "POST /clubs"
              payload: { club_number: "C-5010", name: "Saltmarsh Host Club 5010", region_code: "SE", club_tier: "STANDARD", daily_event_capacity: 4, food_station_count: 2, health_permit_expires_on: "2027-11-30" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_a_id: "$.data.id" }
            - call: "POST /clubs"
              payload: { club_number: "C-5011", name: "Saltmarsh Home Club 5011", region_code: "SE", club_tier: "STANDARD", daily_event_capacity: 4, food_station_count: 2, health_permit_expires_on: "2027-11-30" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_b_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "SM-SOU-010", name: "Roasted Tomato Soup Shots", category: "DAIRY", requires_food_handling: true, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 190, samples_per_case: 60, weekly_sample_case_pool: 20 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_id: "$.data.id" }
            - call: "POST /demonstrators"
              payload: { home_club_id: "${club_b_id}", full_name: "Ronan Vasquez", hourly_rate_cents: 2200 }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { dem_id: "$.data.id" }
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_a_id}", product_id: "${product_id}", event_date: "2026-09-14", day_part: "MIDDAY", requested_sample_cases: 3, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { event_id: "$.data.id" }
            - call: "POST /demo-events/${event_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /demo-events/${event_id}/transitions"
              payload: { action: "APPROVE" }
              as: ClubOperations
              as_user_id: "${club_a_id}"
          trigger:
            - call: "POST /demo-events/${event_id}/assignments"
              payload: { demonstrator_id: "${dem_id}", role: "LEAD" }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { err_no_cert: "$.data.error_id" }
            - call: "POST /demonstrators/${dem_id}/certifications"
              payload: { cert_type: "FOOD_HANDLER", certificate_number: "FH-2026-1101", issued_on: "2026-04-01", expires_on: "2027-04-01" }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { cert_id: "$.data.id" }
            - call: "POST /demo-events/${event_id}/assignments"
              payload: { demonstrator_id: "${dem_id}", role: "LEAD" }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { err_wrong_club: "$.data.error_id" }
            - call: "POST /demo-events/${event_id}/assignments"
