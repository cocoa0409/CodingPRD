  # ===========================================================================
  - section: calculations
    instances:
      - name: calc_billet_cut_weight_exact
        claim_type: correct_result
        grounds: [calculations.billet_cut_weight]
        distinguishing_aspect: "cut_weight_lbs = round_half_up(cut_length_in * bar_lbs_per_in, 2): 20.0 in * 2.50 = 50.00 exactly; 10.5 in * 2.50 = 26.25 exactly."
        test_recipe:
          setup: ["Alloy; heat H-7201 CERT_VERIFIED"]
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager, captures: { alloy_id: "$.data.id" } }
            - { call: "POST /mill-heats", payload: { heat_number: "H-7201", alloy_spec_id: "${alloy_id}", mill_name: "Ellwood Bar Mill", received_weight_lbs: 20000.00, bar_lbs_per_in: 2.50 }, as: PlantManager, captures: { heat_id: "$.data.id" } }
            - { call: "POST /mill-heats/${heat_id}/verify-cert", payload: { carbon_pct: 0.40, manganese_pct: 0.90 }, as: QualityEngineer }
          trigger:
            - { call: "POST /mill-heats/${heat_id}/billets", payload: { cuts: [ { cut_length_in: 20.0, quantity: 2 }, { cut_length_in: 10.5, quantity: 1 } ] }, as: SawOperator, captures: { w1: "$.data[0].cut_weight_lbs", w2: "$.data[1].cut_weight_lbs", w3: "$.data[2].cut_weight_lbs", s1: "$.data[0].cut_seq", s2: "$.data[1].cut_seq", s3: "$.data[2].cut_seq" } }
            - { call: "GET /mill-heats/${heat_id}", payload: {}, as: PlantManager, captures: { rem: "$.data.remaining_weight_lbs" } }
          assert:
            - "cut weights: 50.00, 50.00, 26.25; cut_seq 1, 2, 3 assigned in creation order across mixed cut lines"
            - "heat remaining_weight_lbs == 20000.00 - 126.25 == 19873.75"

      - name: calc_required_tonnage_ceiling
        claim_type: correct_result
        grounds: [calculations.required_press_tonnage]
        distinguishing_aspect: "required_tonnage = ceil(area * flow_stress / 2): 25.0 in^2 * 8.0 ksi / 2 = exactly 100; 25.01 in^2 pushes to 101 (ceiling, not floor)."
        test_recipe:
          setup: ["Alloy AISI-4140 (flow_stress 8.0)"]
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager, captures: { alloy_id: "$.data.id" } }
          trigger:
            - { call: "POST /work-orders", payload: { order_number: "WO-40", customer_name: "Acme Aero", alloy_spec_id: "${alloy_id}", part_number: "PN-100", ordered_qty: 2, part_net_weight_lbs: 40.00, billet_weight_lbs: 50.00, projected_area_in2: 25.0, required_process: "PRESS", price_tier1_limit_tons: 1.0, price_tier1_cents_per_ton: 2000000, price_tier2_limit_tons: 5.0, price_tier2_cents_per_ton: 1800000, price_tier3_cents_per_ton: 1500000, scrap_recovery_rate_cents_per_lb: 150 }, as: SalesPlanner, captures: { t1: "$.data.required_tonnage" } }
            - { call: "POST /work-orders", payload: { order_number: "WO-41", customer_name: "Acme Aero", alloy_spec_id: "${alloy_id}", part_number: "PN-101", ordered_qty: 2, part_net_weight_lbs: 40.00, billet_weight_lbs: 50.00, projected_area_in2: 25.01, required_process: "PRESS", price_tier1_limit_tons: 1.0, price_tier1_cents_per_ton: 2000000, price_tier2_limit_tons: 5.0, price_tier2_cents_per_ton: 1800000, price_tier3_cents_per_ton: 1500000, scrap_recovery_rate_cents_per_lb: 150 }, as: SalesPlanner, captures: { t2: "$.data.required_tonnage" } }
          assert:
            - "WO-40.required_tonnage == 100 (exact boundary, no upward nudge)"
            - "WO-41.required_tonnage == 101 (ceil(100.04))"

      - name: calc_invoice_tier_boundary_average_rate
        claim_type: correct_result
        grounds: [calculations.invoice_price, entities.Invoice.fields.tier_rate_cents_per_ton]
        distinguishing_aspect: "Average-rate tiers: billable_tons == 1.000 (exactly the tier-1 limit, inclusive <=) bills ALL tons at the tier-1 rate; 1.001 t bills ALL tons at tier 2 (no marginal split). Provisional invoices used so no production is needed."
        test_recipe:
          setup: ["Alloy; surcharge 2026-08; WO-42 qty 50 net 40.00 (est 2000.00 lbs = 1.000 t); WO-43 qty 50 net 40.04 (est 2002.00 lbs = 1.001 t)"]
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager, captures: { alloy_id: "$.data.id" } }
            - { call: "POST /surcharge-indices", payload: { alloy_spec_id: "${alloy_id}", effective_month: "2026-08", surcharge_cents_per_ton: 250000, energy_pct: 0.10 }, as: PlantManager }
            - { call: "POST /work-orders", payload: { order_number: "WO-42", customer_name: "Acme Aero", alloy_spec_id: "${alloy_id}", part_number: "PN-100", ordered_qty: 50, part_net_weight_lbs: 40.00, billet_weight_lbs: 50.00, projected_area_in2: 25.0, required_process: "PRESS", price_tier1_limit_tons: 1.0, price_tier1_cents_per_ton: 2000000, price_tier2_limit_tons: 5.0, price_tier2_cents_per_ton: 1800000, price_tier3_cents_per_ton: 1500000, scrap_recovery_rate_cents_per_lb: 150 }, as: SalesPlanner, captures: { wo_a: "$.data.id", wo_av: "$.data.version" } }
            - { call: "POST /work-orders", payload: { order_number: "WO-43", customer_name: "Acme Aero", alloy_spec_id: "${alloy_id}", part_number: "PN-100", ordered_qty: 50, part_net_weight_lbs: 40.04, billet_weight_lbs: 50.00, projected_area_in2: 25.0, required_process: "PRESS", price_tier1_limit_tons: 1.0, price_tier1_cents_per_ton: 2000000, price_tier2_limit_tons: 5.0, price_tier2_cents_per_ton: 1800000, price_tier3_cents_per_ton: 1500000, scrap_recovery_rate_cents_per_lb: 150 }, as: SalesPlanner, captures: { wo_b: "$.data.id", wo_bv: "$.data.version" } }
          trigger:
            - { call: "POST /work-orders/${wo_a}/invoices", payload: { expected_work_order_version: "${wo_av}" }, as: SalesPlanner, captures: { a_tons: "$.data.billable_tons", a_rate: "$.data.tier_rate_cents_per_ton", a_base: "$.data.base_amount_cents", a_total: "$.data.total_cents" } }
            - { call: "POST /work-orders/${wo_b}/invoices", payload: { expected_work_order_version: "${wo_bv}" }, as: SalesPlanner, captures: { b_tons: "$.data.billable_tons", b_rate: "$.data.tier_rate_cents_per_ton", b_base: "$.data.base_amount_cents", b_total: "$.data.total_cents" } }
          assert:
            - "WO-42: billable_tons == 1.000 -> tier_rate_cents_per_ton == 2000000 (inclusive <= boundary); base 2000000; total == 2475000 (2000000 + 250000 + 225000)"
            - "WO-43: billable_tons == 1.001 -> tier_rate_cents_per_ton == 1800000 on ALL tons; base 1801800; total == 2257255 (1801800 + 250250 + 205205)"

      - name: calc_workcenter_selector_lowest_tonnage_and_empty_pool
        claim_type: correct_result
        grounds: [calculations.workcenter_selection]
        distinguishing_aspect: "Auto-select picks the eligible UP center with the LOWEST adequate rated_tonnage (120t beats 500t for a 100t requirement; created_at breaks ties); setting both DOWN empties the pool -> ERR_NO_WORKCENTER_AVAILABLE."
        test_recipe:
          setup: ["Alloy; die DIE-34; WC-A 500t and WC-B 120t both PRESS UP; WO-44 (required 100t)"]
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager, captures: { alloy_id: "$.data.id" } }
            - { call: "POST /die-sets", payload: { die_set_code: "DIE-34", part_family: "FLG-4", wear_limit_hits: 300, max_resinks: 2 }, as: DieShopTechnician, captures: { die_id: "$.data.id" } }
            - { call: "POST /work-centers", payload: { code: "WC-A", type: "PRESS", rated_tonnage: 500 }, as: PlantManager, captures: { wc_a: "$.data.id" } }
            - { call: "POST /work-centers", payload: { code: "WC-B", type: "PRESS", rated_tonnage: 120 }, as: PlantManager, captures: { wc_b: "$.data.id" } }
            - { call: "POST /work-orders", payload: { order_number: "WO-44", customer_name: "Acme Aero", alloy_spec_id: "${alloy_id}", part_number: "PN-100", ordered_qty: 4, part_net_weight_lbs: 40.00, billet_weight_lbs: 50.00, projected_area_in2: 25.0, required_process: "PRESS", price_tier1_limit_tons: 1.0, price_tier1_cents_per_ton: 2000000, price_tier2_limit_tons: 5.0, price_tier2_cents_per_ton: 1800000, price_tier3_cents_per_ton: 1500000, scrap_recovery_rate_cents_per_lb: 150 }, as: SalesPlanner, captures: { wo_id: "$.data.id", wo_v: "$.data.version" } }
          trigger:
            - { call: "POST /forge-runs", payload: { work_order_id: "${wo_id}", die_set_id: "${die_id}", planned_start: "2026-08-03T09:00:00Z", planned_end: "2026-08-03T10:30:00Z", planned_qty: 4, expected_work_order_version: "${wo_v}" }, as: ForgeOperator, captures: { r1_wc: "$.data.work_center_id", r1: "$.data.id" } }
            - { call: "POST /work-centers/${wc_a}/set-status", payload: { status: "DOWN" }, as: PlantManager }
            - { call: "POST /work-centers/${wc_b}/set-status", payload: { status: "DOWN" }, as: PlantManager }
            - { call: "GET /work-orders/${wo_id}", payload: {}, as: SalesPlanner, captures: { wo_v2: "$.data.version" } }
            - { call: "POST /forge-runs", payload: { work_order_id: "${wo_id}", die_set_id: "${die_id}", planned_start: "2026-08-03T13:00:00Z", planned_end: "2026-08-03T14:30:00Z", planned_qty: 4, expected_work_order_version: "${wo_v2}" }, as: ForgeOperator, captures: { err: "$.data.error_id" } }
          assert:
            - "auto-selected run R1 has work_center_id == ${wc_b} (120t lowest adequate beats 500t)"
            - "with both centers DOWN: HTTP 409, error_id == ERR_NO_WORKCENTER_AVAILABLE"

      - name: calc_reheat_limit_boundary
        claim_type: constants_applied
        grounds: [calculations.workcenter_selection, entities.Billet.fields.charge_count]
        distinguishing_aspect: "Re-heat limit is charge_count <= reheat_limit + 1: with limit 2 the SAME billet is chargeable exactly 3 times (charges 1-3 succeed across discharge cycles) and the 4th charge fails with ERR_REHEAT_LIMIT_EXCEEDED."
        test_recipe:
          setup: ["Alloy AISI-4140 (reheat_limit 2); heat H-7202 CERT_VERIFIED; billet b1; FUR-1"]
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager, captures: { alloy_id: "$.data.id" } }
            - { call: "POST /mill-heats", payload: { heat_number: "H-7202", alloy_spec_id: "${alloy_id}", mill_name: "Ellwood Bar Mill", received_weight_lbs: 20000.00, bar_lbs_per_in: 2.50 }, as: PlantManager, captures: { heat_id: "$.data.id" } }
            - { call: "POST /mill-heats/${heat_id}/verify-cert", payload: { carbon_pct: 0.40, manganese_pct: 0.90 }, as: QualityEngineer }
            - { call: "POST /mill-heats/${heat_id}/billets", payload: { cuts: [ { cut_length_in: 20.0, quantity: 1 } ] }, as: SawOperator, captures: { b1: "$.data[0].id" } }
            - { call: "POST /furnaces", payload: { furnace_code: "FUR-1", capacity_lbs: 5000 }, as: PlantManager, captures: { fur_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: PlantManager }
            - { call: "POST /furnace-charges", payload: { furnace_id: "${fur_id}", billet_ids: ["${b1}"], target_temp_f: 2200, soak_minutes: 30, planned_load_start: "2026-08-02T08:00:00Z", planned_unload: "2026-08-02T09:00:00Z" }, as: FurnaceOperator, captures: { c1: "$.data.id" } }
            - { call: "POST /furnace-charges/${c1}/close-loading", payload: {}, as: FurnaceOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:30:00Z" }, as: PlantManager }
            - { call: "POST /furnace-charges/${c1}/mark-ready", payload: {}, as: FurnaceOperator }
            - { call: "POST /furnace-charges/${c1}/discharge", payload: {}, as: FurnaceOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:00:00Z" }, as: PlantManager }
            - { call: "POST /furnace-charges", payload: { furnace_id: "${fur_id}", billet_ids: ["${b1}"], target_temp_f: 2200, soak_minutes: 30, planned_load_start: "2026-08-02T10:00:00Z", planned_unload: "2026-08-02T11:00:00Z" }, as: FurnaceOperator, captures: { c2: "$.data.id" } }
            - { call: "POST /furnace-charges/${c2}/close-loading", payload: {}, as: FurnaceOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:30:00Z" }, as: PlantManager }
            - { call: "POST /furnace-charges/${c2}/mark-ready", payload: {}, as: FurnaceOperator }
            - { call: "POST /furnace-charges/${c2}/discharge", payload: {}, as: FurnaceOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: PlantManager }
            - { call: "POST /furnace-charges", payload: { furnace_id: "${fur_id}", billet_ids: ["${b1}"], target_temp_f: 2200, soak_minutes: 30, planned_load_start: "2026-08-02T12:00:00Z", planned_unload: "2026-08-02T13:00:00Z" }, as: FurnaceOperator, captures: { c3: "$.data.id" } }
            - { call: "POST /furnace-charges/${c3}/close-loading", payload: {}, as: FurnaceOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:30:00Z" }, as: PlantManager }
            - { call: "POST /furnace-charges/${c3}/mark-ready", payload: {}, as: FurnaceOperator }
            - { call: "POST /furnace-charges/${c3}/discharge", payload: {}, as: FurnaceOperator }
            - { call: "GET /billets/${b1}", payload: {}, as: FurnaceOperator, captures: { cc: "$.data.charge_count" } }
          trigger:
            - { call: "POST /furnace-charges", payload: { furnace_id: "${fur_id}", billet_ids: ["${b1}"], target_temp_f: 2200, soak_minutes: 30, planned_load_start: "2026-08-02T14:00:00Z", planned_unload: "2026-08-02T15:00:00Z" }, as: FurnaceOperator, captures: { err: "$.data.error_id" } }
          assert:
            - "three full charge/discharge cycles succeeded; billet charge_count == 3 == reheat_limit + 1"
            - "4th charge: HTTP 409, error_id == ERR_REHEAT_LIMIT_EXCEEDED (safety priority 8 fires before the temporal window check)"
