              captures: { drill_id: $.data.id }
            - call: POST /cesarean-readiness-drills/${drill_id}/start
              payload: {}
              as: ChargeNurse
              as_user_id: "${s_charge}"
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-22T07:20:00Z" }
              as: PerinatalSafetyOfficer
            - call: POST /cesarean-readiness-drills/${drill_id}/document
              payload: { decision_at: "2026-08-22T07:00:00Z", incision_at: "2026-08-22T07:18:00Z", documented_by_staff_id: "${s_anes}" }
              as: AnesthesiaLead
