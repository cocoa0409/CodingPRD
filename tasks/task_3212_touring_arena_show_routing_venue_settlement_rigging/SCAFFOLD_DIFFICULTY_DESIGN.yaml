  # ===========================================================================
  # Rule 8: resource_temporal_overlap — different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: date_avail_half_open_overlap_adjacency_allowed
        grounds:
          - validations.priority_11_business_temporal
          - errors.ERR_AVAIL_OVERLAP
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [opens_at, closes_at). Adjacency — new
          avail opens_at == existing closes_at — is ALLOWED. Resource: DateAvail
          on a Venue. Endpoint: POST /venues/{id}/date-avails.
        test_recipe:
          setup:
            - "Venue V with DateAvail A1 [Sep 10, Sep 15)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /venues"
              payload: { name: "V", market_code: "DAL", capacity_seats: 10000, load_in_dock_doors: 4, union_rule_set: "NON_UNION", default_rent_cents: 4000000, percentage_share_pct: 0.30 }
              as: VenueBooker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/date-avails"
              payload: { opens_at: "2026-09-10T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", priority_rank: 10 }
              as: VenueBooker
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /venues/${venue_id}/date-avails"
              payload: { opens_at: "2026-09-15T00:00:00Z", closes_at: "2026-09-20T00:00:00Z", priority_rank: 10 }
              as: VenueBooker
              captures: { a2: $.data.id }
            - call: "POST /venues/${venue_id}/date-avails"
              payload: { opens_at: "2026-09-14T00:00:00Z", closes_at: "2026-09-16T00:00:00Z", priority_rank: 10 }
              as: VenueBooker
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent avail A2 created successfully (status OPEN) — half-open adjacency allowed"
            - "Overlapping avail rejected with error_id == ERR_AVAIL_OVERLAP (Sep 14-16 intersects [Sep 10, Sep 15))"

      - name: engagement_window_half_open_containment_within_avail
        grounds:
          - validations.priority_7_business_temporal
          - errors.ERR_ENGAGEMENT_WINDOW_OUT_OF_AVAIL
        distinguishing_aspect: |
          Different interval semantics on a different resource entity
          (Engagement within DateAvail): engagement's load_out_at must be
          STRICTLY less than avail.closes_at (half-open containment). An
          engagement whose load_out_at == avail.closes_at is REJECTED —
          opposite boundary treatment from the adjacency rule in instance 1.
        test_recipe:
          setup:
            - "Venue V with DateAvail A1 [Sep 10, Sep 15)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tours"
              payload: { name: "T", home_base_city: "Tampa", season_start_on: "2026-09-01T00:00:00Z", season_end_on: "2027-06-30T00:00:00Z", market_cooldown_days: 30, royalty_reserve_pct: 0 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/open-routing"
              payload: {}
              as: TourManager
            - call: "POST /venues"
              payload: { name: "V", market_code: "DAL", capacity_seats: 10000, load_in_dock_doors: 4, union_rule_set: "NON_UNION", default_rent_cents: 4000000, percentage_share_pct: 0.30 }
              as: VenueBooker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/date-avails"
              payload: { opens_at: "2026-09-10T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", priority_rank: 10 }
              as: VenueBooker
              captures: { a1: $.data.id, a1_v: $.data.version }
          trigger:
            - call: "POST /tours/${tour_id}/engagements"
              payload: { venue_id: "${venue_id}", date_avail_id: "${a1}", load_in_at: "2026-09-10T08:00:00Z", first_show_at: "2026-09-11T19:00:00Z", load_out_at: "2026-09-15T00:00:00Z", deal_type: "FLAT_RENT", agreed_rent_cents: 4000000, expected_avail_version: "${a1_v}" }
              as: TourManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ENGAGEMENT_WINDOW_OUT_OF_AVAIL (load_out_at == closes_at violates half-open containment)"
            - "GET /tours/${tour_id}/engagements returns 0 rows"

