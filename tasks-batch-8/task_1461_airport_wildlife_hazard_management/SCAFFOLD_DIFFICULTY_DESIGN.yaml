              as_user_id: "${r_id}"
              captures: { tp_status_after_d2: $.data.status, tp_consumed_after_d2: $.data.take_consumed }
            # Close D3 (total = 5+3 = 8, exceeds — fails)
            - call: "POST /wildlife/dispersal-activities/${d3_id}/close"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { err_d3: $.data.error_id }
          assert:
            - "After D2 close: TakePermit.take_consumed == 5 (exactly at authorized_take_total)"
            - "TakePermit.status == EXHAUSTED (auto-transition at boundary)"
            - "After D3 close attempt: HTTP 422, error_id == ERR_TAKE_BUDGET_EXCEEDED"
            - "D3 remains in REVIEWED — no partial consumption"

