# =============================================================================
# Task 1884: §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk over §1.1-§1.7 per references/claim-extraction-guide.md.
# Sections with corners already exercised by §1.8 carry excluded_because stubs.
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_corner_design:

  - section: entities
    instances:
      - name: student_creation_applies_defaults_and_computed
        claim_type: defaults
        grounds: [entities.Student]
        distinguishing_aspect: "Omitting advising_required_flag yields false; all computed fields materialize at creation (no re-read needed)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /advising/students", payload: { full_name: "E1", email: "e1@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.5 }, as: AdvisingDirector, captures: { e1_flag: "$.data.advising_required_flag", e1_care: "$.data.care_status", e1_score: "$.data.at_risk_score", e1_tier: "$.data.risk_tier", e1_req: "$.data.advising_requirement_status", e1_clear: "$.data.registration_clearance", e1_terms: "$.data.enrolled_term_codes", e1_ns: "$.data.no_show_count", e1_v: "$.data.version" } }
          assert:
            - "e1_flag == false AND e1_care == \"ENROLLED\""
            - "e1_score == 10 (gpa 3.5 >= 2.5 band) AND e1_tier == \"LOW\""
            - "e1_req == \"NOT_REQUIRED\" AND e1_clear == \"CLEARED\""
            - "e1_terms == [\"FA26\"] AND e1_ns == 0 AND e1_v == 1"

      - name: student_missing_required_gpa_returns_validation
        claim_type: required_fields
        grounds: [entities.Student.fields.gpa, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "gpa is source=input with no default; omitting it is a 400 ERR_VALIDATION before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /advising/students", payload: { full_name: "E2", email: "e2@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26" }, as: AdvisingDirector, captures: { e2_err: "$.data.error_id" } }
          assert:
            - "e2_err == \"ERR_VALIDATION\""

      - name: advisor_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Advisor, "errors[ERR_ADVISOR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent advisor id returns 404 ERR_ADVISOR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /advising/advisors/00000000-0000-0000-0000-000000000000", payload: {}, as: AdvisingDirector, captures: { e3_err: "$.data.error_id" } }
          assert:
            - "e3_err == \"ERR_ADVISOR_NOT_FOUND\""

      - name: student_patch_term_change_appends_enrolled_terms
        claim_type: computed_fields
        grounds: [entities.Student.fields.enrolled_term_codes, endpoints: "PATCH /advising/students/{studentId}"]
        distinguishing_aspect: "PATCHing current_term_code while ENROLLED appends the new term to enrolled_term_codes; the array drives TERM_OVER_TERM retention."
        test_recipe:
          setup: ["student ENROLLED in FA26"]
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "E4", email: "e4@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { e4_id: "$.data.id" } }
          trigger:
            - { call: "PATCH /advising/students/${e4_id}", payload: { current_term_code: "SP27" }, as: AdvisingDirector, captures: { e4_terms: "$.data.enrolled_term_codes", e4_v: "$.data.version" } }
          assert:
            - "e4_terms == [\"FA26\", \"SP27\"]"
            - "e4_v == 2 (mutation bumps version)"

  - section: state_machines
    instances:
      - name: appointment_checkin_complete_satisfies_requirement
        claim_type: side_effect_execution
        grounds: [state_machines.Appointment.SCHEDULED_to_CHECKED_IN, state_machines.Appointment.CHECKED_IN_to_COMPLETED, calculations.advising_requirement]
        distinguishing_aspect: "COMPLETED appointment whose term_code equals the student's current_term_code flips advising_requirement_status REQUIRED -> SATISFIED and registration_clearance BLOCKED -> CLEARED."
        test_recipe:
          setup:
            - "student created with advising_required_flag=true (requirement REQUIRED, clearance BLOCKED)"
            - "appointment 10:00-10:30 FA26; logical clock set inside the check-in window [09:50, 10:10]"
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "S1", email: "s1c@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0, advising_required_flag: true }, as: AdvisingDirector, captures: { sm1_stu: "$.data.id" } }
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor SM1", email: "sm1@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { sm1_adv: "$.data.id" } }
            - { call: "POST /advising/appointments", payload: { student_id: "${sm1_stu}", advisor_id: "${sm1_adv}", term_code: "FA26", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T10:30:00Z" }, as: FrontDeskStaff, captures: { sm1_appt: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:55:00Z" }, as: AdvisingDirector }
          trigger:
            - { call: "POST /advising/appointments/${sm1_appt}/check-in", payload: {}, as: FrontDeskStaff, captures: { sm1_st1: "$.data.status" } }
            - { call: "POST /advising/appointments/${sm1_appt}/complete", payload: {}, as: AdvisingDirector, captures: { sm1_st2: "$.data.status" } }
            - { call: "GET /advising/students/${sm1_stu}", payload: {}, as: AdvisingDirector, captures: { sm1_req: "$.data.advising_requirement_status", sm1_clear: "$.data.registration_clearance" } }
          assert:
            - "sm1_st1 == \"CHECKED_IN\" AND sm1_st2 == \"COMPLETED\""
            - "sm1_req == \"SATISFIED\" AND sm1_clear == \"CLEARED\""

      - name: appointment_complete_from_scheduled_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Appointment.CHECKED_IN_to_COMPLETED, "errors[ERR_APPOINTMENT_INVALID_STATE]"]
        distinguishing_aspect: "complete is only defined from CHECKED_IN; from SCHEDULED it is rejected and no side effects fire."
        test_recipe:
          setup: ["one SCHEDULED appointment"]
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "S2", email: "s2c@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { sm2_stu: "$.data.id" } }
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor SM2", email: "sm2@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { sm2_adv: "$.data.id" } }
            - { call: "POST /advising/appointments", payload: { student_id: "${sm2_stu}", advisor_id: "${sm2_adv}", term_code: "FA26", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T10:30:00Z" }, as: FrontDeskStaff, captures: { sm2_appt: "$.data.id" } }
          trigger:
            - { call: "POST /advising/appointments/${sm2_appt}/complete", payload: {}, as: AdvisingDirector, captures: { sm2_err: "$.data.error_id" } }
          assert:
            - "sm2_err == \"ERR_APPOINTMENT_INVALID_STATE\""

      - name: degree_plan_return_from_approved_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.DegreePlan, "errors[ERR_PLAN_INVALID_STATE]"]
        distinguishing_aspect: "APPROVED is terminal; return from APPROVED is rejected."
        test_recipe:
          setup: ["plan pushed DRAFT -> SUBMITTED -> APPROVED"]
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "S3", email: "s3c@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { sm3_stu: "$.data.id" } }
            - { call: "POST /advising/students/${sm3_stu}/degree-plans", payload: { catalog_year: 2024, required_credits: 10, terms: [ { term_code: "FA26", courses: [ { course_code: "BIO1", credits: 3.5 }, { course_code: "CHM1", credits: 3.5 }, { course_code: "MAT1", credits: 3.5 } ] } ] }, as: AdvisingDirector, captures: { sm3_plan: "$.data.id" } }
            - { call: "POST /advising/students/${sm3_stu}/degree-plans/${sm3_plan}/submit", payload: {}, as: AdvisingDirector }
            - { call: "POST /advising/students/${sm3_stu}/degree-plans/${sm3_plan}/approve", payload: {}, as: AdvisingDirector }
          trigger:
            - { call: "POST /advising/students/${sm3_stu}/degree-plans/${sm3_plan}/return", payload: { reason: "too late" }, as: AdvisingDirector, captures: { sm3_err: "$.data.error_id" } }
          assert:
            - "sm3_err == \"ERR_PLAN_INVALID_STATE\""

      - name: daily_close_marks_no_show_and_cascades_risk
        claim_type: side_effect_execution
        grounds: [state_machines.Appointment.SCHEDULED_to_NO_SHOW, calculations.at_risk_score, endpoints: "POST /advising/ops/daily-close"]
        distinguishing_aspect: "The ops-run sweep (not a user action on the appointment) moves the overdue SCHEDULED appointment to NO_SHOW and the student risk cascade fires (no_show_count 1, score 40 -> 50)."
        test_recipe:
          setup: ["student gpa 1.9 (base 40); appointment 10:00-10:30; clock advanced to 10:11 (past 10-minute grace)"]
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "S4", email: "s4c@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 1.9 }, as: AdvisingDirector, captures: { sm4_stu: "$.data.id" } }
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor SM4", email: "sm4@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { sm4_adv: "$.data.id" } }
            - { call: "POST /advising/appointments", payload: { student_id: "${sm4_stu}", advisor_id: "${sm4_adv}", term_code: "FA26", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T10:30:00Z" }, as: FrontDeskStaff, captures: { sm4_appt: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:11:00Z" }, as: AdvisingDirector }
          trigger:
            - { call: "POST /advising/ops/daily-close", payload: {}, as: AdvisingDirector, captures: { sm4_noshow: "$.data.no_show_marked" } }
            - { call: "GET /advising/appointments/${sm4_appt}", payload: {}, as: AdvisingDirector, captures: { sm4_ast: "$.data.status" } }
            - { call: "GET /advising/students/${sm4_stu}", payload: {}, as: AdvisingDirector, captures: { sm4_ns: "$.data.no_show_count", sm4_score: "$.data.at_risk_score", sm4_tier: "$.data.risk_tier" } }
          assert:
            - "sm4_noshow == 1 AND sm4_ast == \"NO_SHOW\""
            - "sm4_ns == 1 AND sm4_score == 50 (40 base + 10 no-show) AND sm4_tier == \"MEDIUM\""

      - name: dropin_leave_from_served_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.DropInTicket, "errors[ERR_TICKET_INVALID_STATE]"]
        distinguishing_aspect: "SERVED is terminal; leave from SERVED is rejected (QUEUED -> CALLED -> SERVED path exercised first)."
        test_recipe:
          setup: ["ticket walked QUEUED -> CALLED -> SERVED by an advisor"]
          setup_api_calls:
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor SM5", email: "sm5@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { sm5_adv: "$.data.id" } }
            - { call: "POST /advising/students", payload: { full_name: "S5", email: "s5c@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { sm5_stu: "$.data.id" } }
            - { call: "POST /advising/dropin-tickets", payload: { student_id: "${sm5_stu}", reason: "quick question" }, as: FrontDeskStaff, captures: { sm5_tkt: "$.data.id" } }
            - { call: "POST /advising/dropin-tickets/call-next", payload: {}, as: Advisor, as_user_id: "${sm5_adv}" }
            - { call: "POST /advising/dropin-tickets/${sm5_tkt}/complete", payload: {}, as: Advisor, as_user_id: "${sm5_adv}" }
          trigger:
            - { call: "POST /advising/dropin-tickets/${sm5_tkt}/leave", payload: {}, as: FrontDeskStaff, captures: { sm5_err: "$.data.error_id" } }
          assert:
            - "sm5_err == \"ERR_TICKET_INVALID_STATE\""

      - name: referral_auto_escalates_on_third_no_answer
        claim_type: side_effect_execution
        grounds: [state_machines.EarlyAlertReferral.NO_RESPONSE_to_ESCALATED, calculations.at_risk_score]
        distinguishing_aspect: "System auto-transition: the third NO_ANSWER outreach lands in ESCALATED (not the usual cycle target) and fires the full escalation cascade including Intervention creation."
        test_recipe:
          setup: ["student gpa 3.0; one MEDIUM referral OPEN"]
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "S6", email: "s6c@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { sm6_stu: "$.data.id" } }
            - { call: "POST /advising/referrals", payload: { student_id: "${sm6_stu}", source: "FACULTY", severity: "MEDIUM", reason: "low quiz scores" }, as: FacultyReferrer, captures: { sm6_ref: "$.data.id" } }
          trigger:
            - { call: "POST /advising/referrals/${sm6_ref}/outreach", payload: { outcome: "NO_ANSWER" }, as: AdvisingDirector }
            - { call: "POST /advising/referrals/${sm6_ref}/outreach", payload: { outcome: "NO_ANSWER" }, as: AdvisingDirector }
            - { call: "POST /advising/referrals/${sm6_ref}/outreach", payload: { outcome: "NO_ANSWER" }, as: AdvisingDirector, captures: { sm6_st: "$.data.status", sm6_ac: "$.data.attempt_count" } }
            - { call: "GET /advising/interventions", payload: { referral_id: "${sm6_ref}" }, as: AdvisingDirector, captures: { sm6_iv: "$.data[0].status" } }
          assert:
            - "sm6_st == \"ESCALATED\" AND sm6_ac == 3"
            - "sm6_iv == \"OPEN\" (cascade-created intervention linked to the referral)"

      - name: assignment_supersede_ends_prior
        claim_type: side_effect_execution
        grounds: [state_machines.AdvisorAssignment.ACTIVE_to_ENDED, endpoints: "POST /advising/advisor-assignments"]
        distinguishing_aspect: "Creating a second ACTIVE assignment for the same student system-ends the first with ended_reason SUPERSEDED and shifts the advisor counts."
        test_recipe:
          setup: ["student assigned to advisor A; advisor B idle"]
          setup_api_calls:
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor SA", email: "sa@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { sup_a: "$.data.id" } }
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor SB", email: "sb@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { sup_b: "$.data.id" } }
            - { call: "POST /advising/students", payload: { full_name: "S7", email: "s7c@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { sup_stu: "$.data.id", sup_sv1: "$.data.version" } }
            - { call: "POST /advising/advisor-assignments", payload: { student_id: "${sup_stu}", advisor_id: "${sup_a}", expected_student_version: "${sup_sv1}" }, as: AdvisingDirector, captures: { sup_asg1: "$.data.id" } }
            - { call: "GET /advising/students/${sup_stu}", payload: {}, as: AdvisingDirector, captures: { sup_sv2: "$.data.version" } }
          trigger:
            - { call: "POST /advising/advisor-assignments", payload: { student_id: "${sup_stu}", advisor_id: "${sup_b}", expected_student_version: "${sup_sv2}" }, as: AdvisingDirector }
            - { call: "GET /advising/advisor-assignments", payload: { student_id: "${sup_stu}", status: "ENDED" }, as: AdvisingDirector, captures: { sup_ended: "$.data[0].ended_reason" } }
            - { call: "GET /advising/advisors/${sup_b}", payload: {}, as: AdvisingDirector, captures: { sup_bcount: "$.data.assigned_active_count" } }
          assert:
            - "sup_ended == \"SUPERSEDED\" (first assignment auto-ended by the create)"
            - "sup_bcount == 1"

      - name: referral_close_from_open_rejected
        claim_type: invalid_transition
        grounds: [state_machines.EarlyAlertReferral, "errors[ERR_REFERRAL_INVALID_STATE]"]
        distinguishing_aspect: "close is defined only from RESPONDED/ESCALATED; from OPEN it is rejected."
        test_recipe:
          setup: ["one OPEN referral"]
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "S8", email: "s8c@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { sm8_stu: "$.data.id" } }
            - { call: "POST /advising/referrals", payload: { student_id: "${sm8_stu}", source: "STAFF", severity: "LOW", reason: "minor" }, as: FacultyReferrer, captures: { sm8_ref: "$.data.id" } }
          trigger:
            - { call: "POST /advising/referrals/${sm8_ref}/close", payload: {}, as: AdvisingDirector, captures: { sm8_err: "$.data.error_id" } }
          assert:
            - "sm8_err == \"ERR_REFERRAL_INVALID_STATE\""

      - name: hold_release_from_released_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RegistrationHold.ACTIVE_to_RELEASED, "errors[ERR_HOLD_NOT_ACTIVE]"]
        distinguishing_aspect: "Second release of an already-RELEASED hold is rejected; no cascade re-fires."
        test_recipe:
          setup: ["one ACTIVE hold, then released once"]
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "S9", email: "s9c@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { sm9_stu: "$.data.id" } }
            - { call: "POST /advising/students/${sm9_stu}/holds", payload: { hold_type: "ADMINISTRATIVE" }, as: AdvisingDirector, captures: { sm9_hold: "$.data.id" } }
            - { call: "POST /advising/students/${sm9_stu}/holds/${sm9_hold}/release", payload: {}, as: AdvisingDirector }
          trigger:
            - { call: "POST /advising/students/${sm9_stu}/holds/${sm9_hold}/release", payload: {}, as: AdvisingDirector, captures: { sm9_err: "$.data.error_id" } }
          assert:
            - "sm9_err == \"ERR_HOLD_NOT_ACTIVE\""

      - name: corner_degree_plan_cycle_excluded
        claim_type: valid_transition
        grounds: [state_machines.DegreePlan]
        excluded_because: { difficulty_instance: degree_plan_revision_cycle, rationale: "Cycle transitions and re-entry asserted there." }

      - name: corner_referral_cycle_excluded
        claim_type: valid_transition
        grounds: [state_machines.EarlyAlertReferral]
        excluded_because: { difficulty_instance: referral_outreach_retry_cycle, rationale: "OUTREACH_IN_PROGRESS <-> NO_RESPONSE loop asserted there." }

      - name: corner_escalation_cascade_excluded
        claim_type: side_effect_execution
        grounds: [state_machines.EarlyAlertReferral.OPEN_to_ESCALATED]
        excluded_because: { difficulty_instance: referral_escalation_cascades_to_clearance_block, rationale: "Manual-escalate 3-link cascade asserted there; auto-escalate variant covered by referral_auto_escalates_on_third_no_answer." }

      - name: corner_hold_cascade_excluded
        claim_type: side_effect_execution
        grounds: [state_machines.RegistrationHold.ACTIVE_to_RELEASED]
        excluded_because: { difficulty_instance: hold_release_cascades_to_clearance, rationale: "Release -> clearance cascade asserted there." }

      - name: corner_assign_end_invariant_excluded
        claim_type: side_effect_execution
        grounds: [state_machines.AdvisorAssignment.ACTIVE_to_ENDED]
        excluded_because: { difficulty_instance: assign_end_conserve_advisor_count, rationale: "Manual-end compensation asserted as invariant there." }

      - name: corner_book_cancel_invariant_excluded
        claim_type: side_effect_execution
        grounds: [state_machines.Appointment.SCHEDULED_to_CANCELLED]
        excluded_because: { difficulty_instance: book_cancel_conserve_scheduled_minutes, rationale: "Cancel compensation asserted as invariant there." }

  - section: calculations
    instances:
      - name: queue_position_assigns_creation_order
        claim_type: correct_result
        grounds: [calculations.queue_position, entities.DropInTicket.fields.position]
        distinguishing_aspect: "Positions are gap-free in creation order within the queue_date: first ticket 1, second 2, regardless of later status changes."
        test_recipe:
          setup: ["two students, empty queue on default date"]
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "QC1", email: "qc1@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { qc1_id: "$.data.id" } }
            - { call: "POST /advising/students", payload: { full_name: "QC2", email: "qc2@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { qc2_id: "$.data.id" } }
          trigger:
            - { call: "POST /advising/dropin-tickets", payload: { student_id: "${qc1_id}", reason: "a" }, as: FrontDeskStaff, captures: { qc_p1: "$.data.position" } }
            - { call: "POST /advising/dropin-tickets", payload: { student_id: "${qc2_id}", reason: "b" }, as: FrontDeskStaff, captures: { qc_p2: "$.data.position", qc_qd: "$.data.queue_date" } }
          assert:
            - "qc_p1 == 1 AND qc_p2 == 2"
            - "qc_qd == \"2026-08-01\" (logical clock default date)"

      - name: sla_due_at_computed_by_severity
        claim_type: constants_applied
        grounds: [calculations.outreach_sla_due_at, entities.EarlyAlertReferral.fields.due_at]
        distinguishing_aspect: "MEDIUM referral created at the clock default gets due_at exactly created_at + 5 days."
        test_recipe:
          setup: ["one student"]
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "QC3", email: "qc3@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { qc3_id: "$.data.id" } }
          trigger:
            - { call: "POST /advising/referrals", payload: { student_id: "${qc3_id}", source: "FACULTY", severity: "MEDIUM", reason: "attendance" }, as: FacultyReferrer, captures: { qc3_due: "$.data.due_at", qc3_breach: "$.data.is_sla_breached" } }
          assert:
            - "qc3_due == \"2026-08-06T00:00:00Z\" (2026-08-01T00:00:00Z + 5 days)"
            - "qc3_breach == false (at creation now < due_at)"

      - name: clearance_blocked_by_unsatisfied_requirement
        claim_type: correct_result
        grounds: [calculations.advising_requirement, calculations.registration_clearance]
        distinguishing_aspect: "advising_required_flag=true with no completed current-term appointment yields requirement REQUIRED and clearance BLOCKED even with zero holds."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /advising/students", payload: { full_name: "QC4", email: "qc4@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0, advising_required_flag: true }, as: AdvisingDirector, captures: { qc4_req: "$.data.advising_requirement_status", qc4_clear: "$.data.registration_clearance" } }
          assert:
            - "qc4_req == \"REQUIRED\" AND qc4_clear == \"BLOCKED\""

      - name: weighted_load_recomputes_on_tier_flip
        claim_type: correct_result
        grounds: [calculations.caseload_load, calculations.at_risk_score, entities.Advisor.fields.weighted_load]
        distinguishing_aspect: "Advisor.weighted_load tracks the advisee's CURRENT risk_tier: assigning a LOW student (weight 1) then filing a HIGH referral that flips the student to MEDIUM raises weighted_load 1 -> 2 without any assignment change."
        test_recipe:
          setup: ["advisor assigned to student gpa 2.4 (base 25, LOW)"]
          setup_api_calls:
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor QC5", email: "qc5@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { qc5_adv: "$.data.id" } }
            - { call: "POST /advising/students", payload: { full_name: "QC5", email: "qc5s@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 2.4 }, as: AdvisingDirector, captures: { qc5_stu: "$.data.id", qc5_sv: "$.data.version" } }
            - { call: "POST /advising/advisor-assignments", payload: { student_id: "${qc5_stu}", advisor_id: "${qc5_adv}", expected_student_version: "${qc5_sv}" }, as: AdvisingDirector }
            - { call: "GET /advising/advisors/${qc5_adv}", payload: {}, as: AdvisingDirector, captures: { qc5_pre: "$.data.weighted_load" } }
          trigger:
            - { call: "POST /advising/referrals", payload: { student_id: "${qc5_stu}", source: "FACULTY", severity: "HIGH", reason: "failing" }, as: FacultyReferrer }
            - { call: "GET /advising/advisors/${qc5_adv}", payload: {}, as: AdvisingDirector, captures: { qc5_post: "$.data.weighted_load" } }
            - { call: "GET /advising/students/${qc5_stu}", payload: {}, as: AdvisingDirector, captures: { qc5_score: "$.data.at_risk_score", qc5_tier: "$.data.risk_tier" } }
          assert:
            - "qc5_pre == 1 (LOW weight) AND qc5_post == 2 (MEDIUM weight)"
            - "qc5_score == 45 (25 base + 20 HIGH) AND qc5_tier == \"MEDIUM\""

      - name: retention_rate_zero_denominator
        claim_type: precision
        grounds: [calculations.retention_rate]
        distinguishing_aspect: "TERM_OVER_TERM over a from_term no student has yields denominator 0 and the pinned rate 0 rather than an error or null."
        test_recipe:
          setup: ["one student in FA26"]
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "QC6", email: "qc6@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector }
          trigger:
            - { call: "GET /advising/reports/retention", payload: { variant: "TERM_OVER_TERM", from_term_code: "ZZ99", to_term_code: "ZZ98" }, as: AdvisingDirector, captures: { qc6_num: "$.data.numerator", qc6_den: "$.data.denominator", qc6_rate: "$.data.rate" } }
          assert:
            - "qc6_num == 0 AND qc6_den == 0 AND qc6_rate == 0"

      - name: corner_caseload_dual_variant_excluded
        claim_type: variant_divergence
        grounds: [calculations.caseload_load]
        excluded_because: { difficulty_instance: caseload_headcount_vs_weighted_ranking, rationale: "Both variants' divergent winners asserted there." }

      - name: corner_retention_dual_variant_excluded
        claim_type: variant_divergence
        grounds: [calculations.retention_rate]
        excluded_because: { difficulty_instance: retention_cohort_vs_term_variant, rationale: "Both variants' divergent rates asserted there." }

      - name: corner_at_risk_formula_excluded
        claim_type: correct_result
        grounds: [calculations.at_risk_score]
        excluded_because: { difficulty_instance: at_risk_score_conditional_bands, rationale: "Multi-input formula literal asserted there; no-show input leg asserted in daily_close_marks_no_show_and_cascades_risk." }

      - name: corner_term_rounding_excluded
        claim_type: precision
        grounds: [calculations.term_credit_mapping]
        excluded_because: { difficulty_instance: term_credit_per_term_rounding_order, rationale: "Pinned rounding order asserted there." }

      - name: corner_sla_boundary_excluded
        claim_type: correct_result
        grounds: [calculations.outreach_sla_due_at]
        excluded_because: { difficulty_instance: referral_sla_breach_strict_greater_than, rationale: "Strict-> boundary asserted there; due_at value asserted in sla_due_at_computed_by_severity." }

      - name: corner_capacity_boundary_excluded
        claim_type: correct_result
        grounds: [calculations.caseload_load, "errors[ERR_NO_ELIGIBLE_ADVISOR]"]
        excluded_because: { difficulty_instance: advisor_capacity_at_max_excluded, rationale: "count == max_caseload exclusion boundary asserted there." }

  - section: validations
    instances:
      - name: unknown_role_header_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A call whose X-User-Role value is not a declared role is rejected 400 at priority 1 before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /advising/students", payload: {}, as: GhostRole, captures: { v1_err: "$.data.error_id" } }
          assert:
            - "v1_err == \"ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER\""

      - name: wrong_role_beats_not_found_priority
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=4]"]
        distinguishing_aspect: "FacultyReferrer reading a single student by a nonexistent id hits role authorization (priority 3) before existence (priority 4): ERR_UNAUTHORIZED_ROLE, not ERR_STUDENT_NOT_FOUND."
        test_recipe:
          setup: ["empty DB (id does not exist)"]
          setup_api_calls: []
          trigger:
            - { call: "GET /advising/students/00000000-0000-0000-0000-000000000000", payload: {}, as: FacultyReferrer, captures: { v2_err: "$.data.error_id" } }
          assert:
            - "v2_err == \"ERR_UNAUTHORIZED_ROLE\" (403 priority 3 beats 404 priority 4)"

      - name: confidential_note_create_by_unassigned_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_NOTE_CONFIDENTIALITY_RESTRICTED]"]
        distinguishing_aspect: "Solo safety failure (student ENROLLED, so the state gate passes): an unassigned Advisor creating a CONFIDENTIAL note gets ERR_NOTE_CONFIDENTIALITY_RESTRICTED."
        test_recipe:
          setup: ["student assigned to advisor A; advisor B exists and is unassigned"]
          setup_api_calls:
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor VA", email: "va@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { v3_advA: "$.data.id" } }
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor VB", email: "vb@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { v3_advB: "$.data.id" } }
            - { call: "POST /advising/students", payload: { full_name: "V3", email: "v3@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { v3_stu: "$.data.id", v3_sv: "$.data.version" } }
            - { call: "POST /advising/advisor-assignments", payload: { student_id: "${v3_stu}", advisor_id: "${v3_advA}", expected_student_version: "${v3_sv}" }, as: AdvisingDirector }
          trigger:
            - { call: "POST /advising/students/${v3_stu}/notes", payload: { visibility: "CONFIDENTIAL", body: "private" }, as: Advisor, as_user_id: "${v3_advB}", captures: { v3_err: "$.data.error_id" } }
          assert:
            - "v3_err == \"ERR_NOTE_CONFIDENTIALITY_RESTRICTED\""

      - name: corner_checkin_priority_conflict_excluded
        claim_type: priority_ordering
        grounds: ["validations[priority=5]", "validations[priority=8]"]
        excluded_because: { difficulty_instance: checkin_cancelled_outside_window_state_beats_temporal, rationale: "state vs business_temporal dual-failure asserted there." }

      - name: corner_note_priority_conflict_excluded
        claim_type: priority_ordering
        grounds: ["validations[priority=5]", "validations[priority=6]"]
        excluded_because: { difficulty_instance: confidential_note_on_inactive_student_state_beats_safety, rationale: "state vs business_safety dual-failure asserted there." }

      - name: corner_appointment_student_dependency_excluded
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_STUDENT_NOT_ENROLLED]"]
        excluded_because: { difficulty_instance: appointment_requires_student_enrolled, rationale: "Cross-entity state rejection asserted there." }

      - name: corner_hold_plan_dependency_excluded
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_PLAN_NOT_APPROVED]"]
        excluded_because: { difficulty_instance: hold_release_requires_plan_approved, rationale: "Plan-gate rejection and satisfaction asserted there." }

      - name: corner_overlap_rejection_excluded
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_APPOINTMENT_OVERLAP]"]
        excluded_because: { difficulty_instance: appointment_half_open_adjacency, rationale: "Half-open accept/reject pair asserted there." }

      - name: corner_queue_capacity_excluded
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_QUEUE_CAPACITY_REACHED]"]
        excluded_because: { difficulty_instance: dropin_queue_instantaneous_capacity, rationale: "Capacity rejection and refill asserted there." }

  - section: endpoints
    instances:
      - name: students_list_pagination_defaults
        claim_type: listing
        grounds: [response_envelope, endpoints: "GET /advising/students"]
        distinguishing_aspect: "Default pagination (limit 10) plus explicit limit=2 returns 2 rows with total_count 3 and has_more true; envelope carries meta.api_request_id."
        test_recipe:
          setup: ["three students created"]
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "L1", email: "l1@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector }
            - { call: "POST /advising/students", payload: { full_name: "L2", email: "l2@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector }
            - { call: "POST /advising/students", payload: { full_name: "L3", email: "l3@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector }
          trigger:
            - { call: "GET /advising/students", payload: { limit: 2 }, as: AdvisingDirector }
          assert:
            - "response data array length == 2"
            - "total_count == 3 AND has_more == true AND limit == 2 AND offset == 0"
            - "meta.api_request_id present and response_type == \"array\""

      - name: create_student_response_envelope_shape
        claim_type: standard_crud
        grounds: [response_envelope, endpoints: "POST /advising/students"]
        distinguishing_aspect: "A 201 create response wraps the entity in the fixed envelope: meta.api_request_id, meta.api_request_timestamp, response_type object."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /advising/students", payload: { full_name: "L4", email: "l4@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { l4_id: "$.data.id" } }
          assert:
            - "HTTP status 201; body has meta.api_request_id and meta.api_request_timestamp"
            - "response_type == \"object\" AND data.id == l4_id (server-minted UUID, no type prefix)"

  - section: errors
    instances:
      - name: appointment_advisor_not_found_trigger
        claim_type: error_triggerable
        grounds: ["errors[ERR_ADVISOR_NOT_FOUND]"]
        distinguishing_aspect: "Body-referenced advisor_id that does not exist is a 404 ERR_ADVISOR_NOT_FOUND (existence covers path and body ids)."
        test_recipe:
          setup: ["one ENROLLED student"]
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "R1", email: "r1e@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { er1_stu: "$.data.id" } }
          trigger:
            - { call: "POST /advising/appointments", payload: { student_id: "${er1_stu}", advisor_id: "00000000-0000-0000-0000-000000000000", term_code: "FA26", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T10:30:00Z" }, as: FrontDeskStaff, captures: { er1_err: "$.data.error_id" } }
          assert:
            - "er1_err == \"ERR_ADVISOR_NOT_FOUND\""

      - name: plan_already_active_trigger
        claim_type: error_triggerable
        grounds: ["errors[ERR_PLAN_ALREADY_ACTIVE]"]
        distinguishing_aspect: "Second degree-plan create while a DRAFT exists is rejected; uniqueness window covers DRAFT and SUBMITTED only."
        test_recipe:
          setup: ["student with one DRAFT plan"]
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "R2", email: "r2e@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { er2_stu: "$.data.id" } }
            - { call: "POST /advising/students/${er2_stu}/degree-plans", payload: { catalog_year: 2024, required_credits: 10, terms: [ { term_code: "FA26", courses: [ { course_code: "BIO1", credits: 4.0 } ] } ] }, as: AdvisingDirector }
          trigger:
            - { call: "POST /advising/students/${er2_stu}/degree-plans", payload: { catalog_year: 2025, required_credits: 12, terms: [ { term_code: "SP27", courses: [ { course_code: "ENG1", credits: 4.0 } ] } ] }, as: AdvisingDirector, captures: { er2_err: "$.data.error_id" } }
          assert:
            - "er2_err == \"ERR_PLAN_ALREADY_ACTIVE\""

      - name: invalid_duration_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_APPOINTMENT_DURATION]", "validations[priority=2]"]
        distinguishing_aspect: "A 10-minute appointment violates the [15, 60] duration bound with a 400 before any state or overlap check."
        test_recipe:
          setup: ["student and advisor exist"]
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "R3", email: "r3e@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { er3_stu: "$.data.id" } }
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor R3", email: "r3a@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { er3_adv: "$.data.id" } }
          trigger:
            - { call: "POST /advising/appointments", payload: { student_id: "${er3_stu}", advisor_id: "${er3_adv}", term_code: "FA26", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T10:10:00Z" }, as: FrontDeskStaff, captures: { er3_err: "$.data.error_id" } }
          assert:
            - "er3_err == \"ERR_INVALID_APPOINTMENT_DURATION\""

      - name: plan_submit_insufficient_credits_rejected
        claim_type: error_triggerable
        grounds: ["errors[ERR_PLAN_CREDITS_INSUFFICIENT]", state_machines.DegreePlan.DRAFT_to_SUBMITTED]
        distinguishing_aspect: "Submit with mapped 11 < required 12 (term load legal) fails the credit gate only."
        test_recipe:
          setup: ["DRAFT plan: one term 11 rounded credits, required 12"]
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "R4", email: "r4e@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { er4_stu: "$.data.id" } }
            - { call: "POST /advising/students/${er4_stu}/degree-plans", payload: { catalog_year: 2024, required_credits: 12, terms: [ { term_code: "FA26", courses: [ { course_code: "BIO1", credits: 3.5 }, { course_code: "CHM1", credits: 3.5 }, { course_code: "MAT1", credits: 3.5 } ] } ] }, as: AdvisingDirector, captures: { er4_plan: "$.data.id" } }
          trigger:
            - { call: "POST /advising/students/${er4_stu}/degree-plans/${er4_plan}/submit", payload: {}, as: AdvisingDirector, captures: { er4_err: "$.data.error_id" } }
          assert:
            - "er4_err == \"ERR_PLAN_CREDITS_INSUFFICIENT\" (11 < 12)"

      - name: plan_submit_term_overload_rejected
        claim_type: error_triggerable
        grounds: ["errors[ERR_PLAN_TERM_OVERLOAD]", state_machines.DegreePlan.DRAFT_to_SUBMITTED]
        distinguishing_aspect: "Submit with a 20-credit term (mapped 20 >= required 10, credit gate passes) fails the per-term overload gate only."
        test_recipe:
          setup: ["DRAFT plan: one term of five 4.0-credit courses"]
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "R5", email: "r5e@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { er5_stu: "$.data.id" } }
            - { call: "POST /advising/students/${er5_stu}/degree-plans", payload: { catalog_year: 2024, required_credits: 10, terms: [ { term_code: "FA26", courses: [ { course_code: "A", credits: 4.0 }, { course_code: "B", credits: 4.0 }, { course_code: "C", credits: 4.0 }, { course_code: "D", credits: 4.0 }, { course_code: "E", credits: 4.0 } ] } ] }, as: AdvisingDirector, captures: { er5_plan: "$.data.id" } }
          trigger:
            - { call: "POST /advising/students/${er5_stu}/degree-plans/${er5_plan}/submit", payload: {}, as: AdvisingDirector, captures: { er5_err: "$.data.error_id" } }
          assert:
            - "er5_err == \"ERR_PLAN_TERM_OVERLOAD\" (20 > 18)"

      - name: student_already_has_active_ticket_rejected
        claim_type: error_triggerable
        grounds: ["errors[ERR_STUDENT_ALREADY_HAS_ACTIVE_TICKET]"]
        distinguishing_aspect: "Same student joining today's queue twice (first ticket still QUEUED) is rejected independently of day capacity."
        test_recipe:
          setup: ["one student with one QUEUED ticket today"]
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "R6", email: "r6e@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { er6_stu: "$.data.id" } }
            - { call: "POST /advising/dropin-tickets", payload: { student_id: "${er6_stu}", reason: "first" }, as: FrontDeskStaff }
          trigger:
            - { call: "POST /advising/dropin-tickets", payload: { student_id: "${er6_stu}", reason: "second" }, as: FrontDeskStaff, captures: { er6_err: "$.data.error_id" } }
          assert:
            - "er6_err == \"ERR_STUDENT_ALREADY_HAS_ACTIVE_TICKET\""

      - name: queue_empty_call_next_rejected
        claim_type: error_triggerable
        grounds: ["errors[ERR_QUEUE_EMPTY]", endpoints: "POST /advising/dropin-tickets/call-next"]
        distinguishing_aspect: "call-next with no QUEUED ticket on the current logical date is a 409 ERR_QUEUE_EMPTY (selector empty-pool fallback for the drop-in queue)."
        test_recipe:
          setup: ["advisor exists; no tickets today"]
          setup_api_calls:
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor R7", email: "r7a@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { er7_adv: "$.data.id" } }
          trigger:
            - { call: "POST /advising/dropin-tickets/call-next", payload: {}, as: Advisor, as_user_id: "${er7_adv}", captures: { er7_err: "$.data.error_id" } }
          assert:
            - "er7_err == \"ERR_QUEUE_EMPTY\""

      - name: appointment_with_inactive_advisor_rejected
        claim_type: error_triggerable
        grounds: ["errors[ERR_ADVISOR_NOT_ACTIVE]", endpoints: "PATCH /advising/advisors/{advisorId}"]
        distinguishing_aspect: "After PATCH sets the advisor INACTIVE, a new appointment referencing that advisor is rejected ERR_ADVISOR_NOT_ACTIVE (cross-entity referential gate at priority 9); existing appointments are untouched."
        test_recipe:
          setup: ["advisor ACTIVE, then patched to INACTIVE; student ENROLLED"]
          setup_api_calls:
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor R8", email: "r8a@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { er8_adv: "$.data.id" } }
            - { call: "POST /advising/students", payload: { full_name: "R8", email: "r8e@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { er8_stu: "$.data.id" } }
            - { call: "PATCH /advising/advisors/${er8_adv}", payload: { status: "INACTIVE" }, as: AdvisingDirector, captures: { er8_status: "$.data.status" } }
          trigger:
            - { call: "POST /advising/appointments", payload: { student_id: "${er8_stu}", advisor_id: "${er8_adv}", term_code: "FA26", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T10:30:00Z" }, as: FrontDeskStaff, captures: { er8_err: "$.data.error_id" } }
          assert:
            - "er8_status == \"INACTIVE\" (PATCH took effect)"
            - "er8_err == \"ERR_ADVISOR_NOT_ACTIVE\""

  - section: rbac
    instances:
      - name: faculty_cannot_book_appointment
        claim_type: role_exclusive_denied
        grounds: [roles, "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "FacultyReferrer (referral-only role) is denied POST /appointments with 403 ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["student and advisor exist"]
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "RB1", email: "rb1@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { rb1_stu: "$.data.id" } }
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor RB1", email: "rb1a@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { rb1_adv: "$.data.id" } }
          trigger:
            - { call: "POST /advising/appointments", payload: { student_id: "${rb1_stu}", advisor_id: "${rb1_adv}", term_code: "FA26", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T10:30:00Z" }, as: FacultyReferrer, captures: { rb1_err: "$.data.error_id" } }
          assert:
            - "rb1_err == \"ERR_UNAUTHORIZED_ROLE\""

      - name: unassigned_advisor_cannot_release_hold
        claim_type: role_exclusive_denied
        grounds: [roles, "errors[ERR_NOT_ASSIGNED_ADVISOR]", "validations[priority=6]"]
        distinguishing_aspect: "Ownership gate: Advisor B (student is assigned to A) releasing a hold is denied ERR_NOT_ASSIGNED_ADVISOR; AdvisingDirector is exempt (hierarchical override)."
        test_recipe:
          setup: ["student assigned to advisor A; one ACTIVE hold; advisor B exists"]
          setup_api_calls:
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor RA", email: "ra@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { rb2_advA: "$.data.id" } }
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor RB", email: "rb@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { rb2_advB: "$.data.id" } }
            - { call: "POST /advising/students", payload: { full_name: "RB2", email: "rb2@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { rb2_stu: "$.data.id", rb2_sv: "$.data.version" } }
            - { call: "POST /advising/advisor-assignments", payload: { student_id: "${rb2_stu}", advisor_id: "${rb2_advA}", expected_student_version: "${rb2_sv}" }, as: AdvisingDirector }
            - { call: "POST /advising/students/${rb2_stu}/holds", payload: { hold_type: "ADVISING" }, as: AdvisingDirector, captures: { rb2_hold: "$.data.id" } }
          trigger:
            - { call: "POST /advising/students/${rb2_stu}/holds/${rb2_hold}/release", payload: {}, as: Advisor, as_user_id: "${rb2_advB}", captures: { rb2_err: "$.data.error_id" } }
            - { call: "POST /advising/students/${rb2_stu}/holds/${rb2_hold}/release", payload: {}, as: Advisor, as_user_id: "${rb2_advA}", captures: { rb2_ok: "$.data.status" } }
          assert:
            - "rb2_err == \"ERR_NOT_ASSIGNED_ADVISOR\" (unassigned advisor denied)"
            - "rb2_ok == \"RELEASED\" (assigned advisor succeeds)"

      - name: confidential_note_visibility_filter_by_role
        claim_type: hierarchical_override
        grounds: [roles, entities.AdvisingNote.fields.visibility, endpoints: "GET /advising/students/{studentId}/notes"]
        distinguishing_aspect: "Shared-record access: the assigned advisor's CONFIDENTIAL note is hidden from another advisor's list (SHARED only) while AdvisingDirector sees both — the director's override applies to reads."
        test_recipe:
          setup: ["student assigned to advisor A; A authors one CONFIDENTIAL and one SHARED note; advisor B unassigned"]
          setup_api_calls:
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor NA", email: "na@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { rb3_advA: "$.data.id" } }
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor NB", email: "nb@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { rb3_advB: "$.data.id" } }
            - { call: "POST /advising/students", payload: { full_name: "RB3", email: "rb3@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { rb3_stu: "$.data.id", rb3_sv: "$.data.version" } }
            - { call: "POST /advising/advisor-assignments", payload: { student_id: "${rb3_stu}", advisor_id: "${rb3_advA}", expected_student_version: "${rb3_sv}" }, as: AdvisingDirector }
            - { call: "POST /advising/students/${rb3_stu}/notes", payload: { visibility: "CONFIDENTIAL", body: "secret" }, as: Advisor, as_user_id: "${rb3_advA}" }
            - { call: "POST /advising/students/${rb3_stu}/notes", payload: { visibility: "SHARED", body: "public" }, as: Advisor, as_user_id: "${rb3_advA}" }
          trigger:
            - { call: "GET /advising/students/${rb3_stu}/notes", payload: {}, as: Advisor, as_user_id: "${rb3_advB}", captures: { rb3_b_first: "$.data[0].visibility" } }
            - { call: "GET /advising/students/${rb3_stu}/notes", payload: {}, as: AdvisingDirector }
          assert:
            - "Advisor B list: total_count == 1 AND rb3_b_first == \"SHARED\" (CONFIDENTIAL filtered out)"
            - "AdvisingDirector list: total_count == 2 (override sees both)"

      - name: advisor_cannot_create_advisor
        claim_type: role_exclusive_denied
        grounds: [roles, "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Advisor management is an AdvisingDirector exclusive; an Advisor caller is denied."
        test_recipe:
          setup: ["one advisor exists (caller identity)"]
          setup_api_calls:
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor RB4", email: "rb4@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { rb4_adv: "$.data.id" } }
          trigger:
            - { call: "POST /advising/advisors", payload: { full_name: "Sneaky", email: "sn@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: Advisor, as_user_id: "${rb4_adv}", captures: { rb4_err: "$.data.error_id" } }
          assert:
            - "rb4_err == \"ERR_UNAUTHORIZED_ROLE\""

  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_assignment_create_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[assignment-create-stale-student]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Second create carrying the student's pre-first-create version is rejected 412 ERR_STALE_VERSION; the first create advanced Student.version to 2."
        test_recipe:
          setup: ["student created (version 1 observed); two advisors exist"]
          setup_api_calls:
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor OA", email: "oa@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { oc_advA: "$.data.id" } }
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor OB", email: "ob@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { oc_advB: "$.data.id" } }
            - { call: "POST /advising/students", payload: { full_name: "OC1", email: "oc1@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { oc_stu: "$.data.id", oc_sv: "$.data.version" } }
          trigger:
            - { call: "POST /advising/advisor-assignments", payload: { student_id: "${oc_stu}", advisor_id: "${oc_advA}", expected_student_version: "${oc_sv}" }, as: AdvisingDirector, captures: { oc_asg: "$.data.id" } }
            - { call: "POST /advising/advisor-assignments", payload: { student_id: "${oc_stu}", advisor_id: "${oc_advB}", expected_student_version: "${oc_sv}" }, as: AdvisingDirector, captures: { oc_err: "$.data.error_id" } }
            - { call: "GET /advising/students/${oc_stu}", payload: {}, as: AdvisingDirector, captures: { oc_v: "$.data.version" } }
          assert:
            - "oc_asg is non-null (first create with matching version succeeded)"
            - "oc_err == \"ERR_STALE_VERSION\" (stale ${oc_sv} rejected, HTTP 412)"
            - "oc_v == 2 (exactly one version bump from the successful create)"

      - name: auto_assign_tie_break_uses_created_at
        claim_type: selector_policy
        grounds: [calculations.caseload_load, endpoints: "POST /advising/advisor-assignments/auto-assign"]
        distinguishing_aspect: "Two eligible advisors with identical weighted_load (0) and identical headcount (0) are ordered by created_at ASC — the earlier-created advisor wins; id is never consulted."
        test_recipe:
          setup: ["advisor A created before advisor B; both ACTIVE, serve CS, max_caseload 5, zero load"]
          setup_api_calls:
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor TA", email: "ta@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { tb_advA: "$.data.id" } }
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor TB", email: "tb@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { tb_advB: "$.data.id" } }
            - { call: "POST /advising/students", payload: { full_name: "TB1", email: "tb1@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { tb_stu: "$.data.id" } }
          trigger:
            - { call: "POST /advising/advisor-assignments/auto-assign", payload: { student_id: "${tb_stu}" }, as: AdvisingDirector, captures: { tb_winner: "$.data.advisor_id", tb_mode: "$.data.assignment_mode" } }
          assert:
            - "tb_winner == ${tb_advA} (created_at ASC tie-break)"
            - "tb_mode == \"AUTO\""

      - name: auto_assign_eligibility_excludes_mismatch
        claim_type: selector_policy
        grounds: [calculations.caseload_load, "errors[ERR_NO_ELIGIBLE_ADVISOR]"]
        distinguishing_aspect: "Eligibility filter: the only ACTIVE advisor does not serve the student's major (BIO-only vs CS), so the pool is empty and auto-assign returns 422 ERR_NO_ELIGIBLE_ADVISOR."
        test_recipe:
          setup: ["one advisor serving BIO only; one CS student"]
          setup_api_calls:
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor TE", email: "te@x.edu", major_codes: ["BIO"], max_caseload: 5 }, as: AdvisingDirector }
            - { call: "POST /advising/students", payload: { full_name: "TE1", email: "te1@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { te_stu: "$.data.id" } }
          trigger:
            - { call: "POST /advising/advisor-assignments/auto-assign", payload: { student_id: "${te_stu}" }, as: AdvisingDirector, captures: { te_err: "$.data.error_id" } }
          assert:
            - "te_err == \"ERR_NO_ELIGIBLE_ADVISOR\""

      - name: daily_close_expires_stale_queued_tickets
        claim_type: ops_run_checkpoint
        grounds: [state_machines.DropInTicket, endpoints: "POST /advising/ops/daily-close"]
        distinguishing_aspect: "A ticket QUEUED on 2026-08-01 is moved to LEFT by the daily-close run under a 2026-08-02 logical clock; the sweep report counts it."
        test_recipe:
          setup: ["one QUEUED ticket created under the default clock (queue_date 2026-08-01); clock advanced to next day"]
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "OP1", email: "op1@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { op1_stu: "$.data.id" } }
            - { call: "POST /advising/dropin-tickets", payload: { student_id: "${op1_stu}", reason: "late question" }, as: FrontDeskStaff, captures: { op1_tkt: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: AdvisingDirector }
          trigger:
            - { call: "POST /advising/ops/daily-close", payload: {}, as: AdvisingDirector, captures: { op1_exp: "$.data.queue_expired" } }
            - { call: "GET /advising/dropin-tickets/${op1_tkt}", payload: {}, as: AdvisingDirector, captures: { op1_st: "$.data.status" } }
          assert:
            - "op1_exp == 1 AND op1_st == \"LEFT\""

  - section: consistency_model
    instances:
      - name: mutation_immediately_visible_in_response
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model, calculations.at_risk_score]
        distinguishing_aspect: "Immediate consistency: the POST /students create response already carries the fully computed at_risk_score (25 for gpa 2.2) — no re-read or lag."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /advising/students", payload: { full_name: "IM1", email: "im1@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 2.2 }, as: AdvisingDirector, captures: { im1_score: "$.data.at_risk_score", im1_tier: "$.data.risk_tier" } }
          assert:
            - "im1_score == 25 AND im1_tier == \"LOW\" in the create response itself (2.0 <= 2.2 < 2.5 band; 25 < 40)"
