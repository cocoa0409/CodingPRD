              as: BillingStaff
              captures: { pol_id: $.data.id, pol_v0: $.data.version }
            - call: "POST /sports-med/claims"
              payload: { injury_case_id: "${case_id}", insurance_policy_id: "${pol_id}", billed_amount_cents: 50000, line_items: [ { cpt_code: "S1", charge_cents: 50000, service_date: "2026-08-02" } ] }
