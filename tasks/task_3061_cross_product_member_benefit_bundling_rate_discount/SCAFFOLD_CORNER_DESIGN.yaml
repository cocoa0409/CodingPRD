        distinguishing_aspect: "The acknowledge precondition compares the acting id to the notice's member_id, so a Member acknowledging a peer's SENT notice is refused while a PlatformAdmin is not permitted on the endpoint at all."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-R-005 has a SENT notice; member M-R-006 is a different member."
          setup_api_calls:
