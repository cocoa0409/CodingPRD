      - name: validation_subscription_that_overflows_max_shares_is_rejected
        claim_type: aggregate_validation
        grounds:
          - validations[priority=75]
          - errors[ERR_OFFERING_OVERSUBSCRIBED]
          - endpoints[POST /de-novo/subscriptions]
          - entities.CapitalRaise.fields.subscribed_shares
          - entities.CapitalRaise.fields.max_shares
        distinguishing_aspect: >
          The check is on the COLLECTION, not the row: a 150,000-share subscription is individually
          well formed and would pass every field rule, yet it is refused because 4,900,000 already
          subscribed plus 150,000 exceeds max_shares 5,000,000 - and a 100,000-share request that
          lands exactly on 5,000,000 is accepted.
        test_recipe:
          setup:
            - "One OrganizingGroup at stage ORGANIZING with one OPEN CapitalRaise: max_shares 5,000,000,"
            - "offering_price_cents_per_share 1000, minimum_gross_cents 4,100,000,000."
            - "Two PLEDGED subscriptions of 3,000,000 and 1,900,000 shares, so subscribed_shares is"
            - "4,900,000 and 100,000 shares of capacity remain."
          setup_api_calls:
            - call: "POST /de-novo/organizing-groups"
              payload: { proposed_bank_name: "Cascade Charter Bank", home_state_code: "WA", charter_type: "NATIONAL", target_opening_date: "2027-03-01T00:00:00Z" }
              as: CharterCounsel
              captures: { g_id: $.data.id }
            - call: "POST /de-novo/capital-raises"
              payload: { group_id: "${g_id}", target_gross_cents: 4300000000, minimum_gross_cents: 4100000000, offering_price_cents_per_share: 1000, max_shares: 5000000, organizational_expense_claim_cents: 150000000 }
              as: CharterCounsel
              captures: { r_id: $.data.id }
            - call: "POST /de-novo/capital-raises/${r_id}/open"
              payload: {}
              as: CharterCounsel
            - call: "POST /de-novo/subscriptions"
              payload: { capital_raise_id: "${r_id}", subscriber_name: "Harbor Trust LP", shares: 3000000 }
              as: EscrowAgent
              captures: { s1_id: $.data.id }
            - call: "POST /de-novo/subscriptions"
              payload: { capital_raise_id: "${r_id}", subscriber_name: "Puget Founders Fund", shares: 1900000 }
              as: EscrowAgent
              captures: { s2_id: $.data.id }
          trigger:
            - call: "POST /de-novo/subscriptions"
              payload: { capital_raise_id: "${r_id}", subscriber_name: "Olympic Coast Holdings", shares: 150000 }
              as: EscrowAgent
              captures: { err_id: $.data.error_id }
            - call: "POST /de-novo/subscriptions"
              payload: { capital_raise_id: "${r_id}", subscriber_name: "Olympic Coast Holdings", shares: 100000 }
              as: EscrowAgent
              captures: { s3_id: $.data.id }
          assert:
            - "before the trigger CapitalRaise.${r_id}.subscribed_shares == 4900000"
            - "the first call returns 409 with $.data.error_id == ERR_OFFERING_OVERSUBSCRIBED"
            - "after the first call CapitalRaise.${r_id}.subscribed_shares == 4900000 - unchanged"
            - "after the first call CapitalRaise.${r_id}.pledged_gross_cents == 4900000000"
            - "the second call returns 201 and Subscription.${s3_id}.shares == 100000"
            - "Subscription.${s3_id}.amount_cents == 100000000"
            - "CapitalRaise.${r_id}.subscribed_shares == 5000000 - exactly max_shares"
            - "CapitalRaise.${r_id}.pledged_gross_cents == 5000000000"
            - "CapitalRaise.${r_id}.cleared_escrow_cents == 0 - nothing funded or screened yet"
      - name: validation_adverse_finding_type_required_only_for_flagged_outcome
