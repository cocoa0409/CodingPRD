# =============================================================================
# PRD Benchmark Seed Tables — task_3389
# Cohort Scholar Selection, Partner Placement & Campus Support
# =============================================================================

scenario: |
  Cohort Scholar Selection, Partner Placement & Campus Support (Posse Foundation):
  city-based recruitment with nominations from high schools and community
  organizations, dynamic assessment process evaluating candidates in group
  settings across multiple rounds, cohort formation of scholars who will attend
  the same partner college together, partner college agreements providing
  full-tuition leadership scholarships with cohort commitments, pre-collegiate
  training over months before matriculation covering academics, leadership and
  team building, on-campus mentoring by a faculty mentor with regular cohort
  meetings and individual check-ins, career program with internship placement
  and alumni network access, partner renewal decisions based on scholar
  retention and graduation outcomes.

domain_name: cohort-scholar-program
api_prefix: /api

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate
  note: |
    Finite scholarship seats per cohort (quota/allocation core) wrapped in a
    multi-round assessment pipeline (orchestration). Scholar carries two
    independent state axes (enrollment_status, standing) that evolve
    independently. Difficulty comes from rule depth: seat-ledger invariants,
    waitlist promotion cascades, outcome-rate dual variants, and validation
    priority chains.

# =============================================================================
# Table 1.0: Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table (13 entities, flat topology)
# =============================================================================
entities:
  - name: CityProgram
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Short unique city code, e.g. ATL" }
      - { name: name, type: string, source: input, description: "City program display name" }
      - { name: admissions_cycle, type: string, source: input, description: "Admissions cycle label, e.g. 2027" }
      - { name: nomination_window_opens_at, type: datetime, source: input, description: "ISO8601; nominations accepted from this instant (inclusive)" }
      - { name: nomination_window_closes_at, type: datetime, source: input, description: "ISO8601; nominations accepted until this instant (inclusive)" }

  - name: NominatingPartner
    parent: null
    common_fields: true
    fields:
      - { name: city_program_id, type: string, source: input, description: "FK -> CityProgram.id; the city program this partner nominates into" }
      - { name: name, type: string, source: input, description: "High school or community organization name" }
      - { name: kind, type: enum, source: input, description: "HIGH_SCHOOL | COMMUNITY_ORG" }
      - { name: nomination_quota, type: integer, source: input, description: "Max live nominations per cycle; must satisfy 1 <= quota <= 20" }
      - { name: nominations_used, type: integer, source: computed, description: "Count of this partner's nominees whose status != WITHDRAWN; nominations_used + remaining == nomination_quota at all times" }

  - name: Nominee
    parent: null
    common_fields: true
    fields:
      - { name: city_program_id, type: string, source: input, description: "FK -> CityProgram.id" }
      - { name: nominator_id, type: string, source: system, description: "FK -> NominatingPartner.id; set from X-User-ID for Nominator callers, from nominator_id input for ProgramAdmin" }
      - { name: full_name, type: string, source: input, description: "Candidate full name" }
      - { name: first_generation, type: boolean, source: input, description: "First-generation college student flag", default: false }
      - { name: status, type: enum, source: system, description: "NOMINATED | ROUND_1 | ROUND_2 | ROUND_3 | SELECTED | WAITLISTED | PLACED | DROPPED | WITHDRAWN" }
      - { name: current_round, type: integer, source: system, description: "0 while NOMINATED; 1..3 while in assessment rounds; stays 3 in SELECTED/WAITLISTED" }
      - { name: round_1_score, type: integer, source: computed, description: "null until >=2 evaluations for round 1; then round_half_up average of their weighted_score" }
      - { name: round_2_score, type: integer, source: computed, description: "null until >=2 evaluations for round 2" }
      - { name: round_3_score, type: integer, source: computed, description: "null until >=2 evaluations for round 3; waitlist ranking key" }

  - name: Evaluation
    parent: null
    common_fields: false
    fields:
      - { name: nominee_id, type: string, source: input, description: "FK -> Nominee.id" }
      - { name: round_number, type: integer, source: input, description: "1 | 2 | 3; must equal nominee.current_round at submission" }
      - { name: assessor_ref, type: string, source: system, description: "Opaque assessor identifier copied from X-User-ID; uniqueness key with (nominee_id, round_number)" }
      - { name: leadership, type: integer, source: input, description: "0..100" }
      - { name: teamwork, type: integer, source: input, description: "0..100" }
      - { name: group_presence, type: integer, source: input, description: "0..100" }
      - { name: weighted_score, type: integer, source: computed, description: "4*leadership + 3*teamwork + 3*group_presence, capped at 499 when any dimension < 40" }
    note: "Immutable record: no update/delete endpoint exists."

  - name: PartnerCollege
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Partner college name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PROBATION | LAPSED; derived from census outcome rates and renewal decisions" }
      - { name: renewed_cycles_count, type: integer, source: system, description: "Number of successful renewal decisions; starts 0, +1 per RENEW" }

  - name: Mentor
    parent: null
    common_fields: true
    fields:
      - { name: partner_college_id, type: string, source: input, description: "FK -> PartnerCollege.id; the college this faculty mentor belongs to" }
      - { name: full_name, type: string, source: input, description: "Mentor full name" }

  - name: PartnerAgreement
    parent: null
    common_fields: true
    fields:
      - { name: partner_college_id, type: string, source: input, description: "FK -> PartnerCollege.id" }
      - { name: admissions_cycle, type: string, source: input, description: "Cycle this agreement funds, e.g. 2027" }
      - { name: cohort_size, type: integer, source: input, description: "Committed scholarship seats; must satisfy 3 <= cohort_size <= 6" }
      - { name: tuition_annual_cents, type: integer, source: input, description: "Annual full-tuition value per scholar, cents, > 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUPERSEDED | FULFILLED | EXPIRED" }

  - name: Cohort
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> PartnerAgreement.id; 1:1 — at most one cohort per agreement" }
      - { name: city_program_id, type: string, source: input, description: "FK -> CityProgram.id; all scholars of this cohort are recruited from this city" }
      - { name: partner_college_id, type: string, source: system, description: "FK -> PartnerCollege.id; copied from agreement.partner_college_id at creation" }
      - { name: mentor_id, type: string, source: input, description: "FK -> Mentor.id; mentor.partner_college_id must equal agreement.partner_college_id" }
      - { name: cohort_size, type: integer, source: system, description: "Copied from agreement.cohort_size at creation; immutable" }
      - { name: tuition_annual_cents, type: integer, source: system, description: "Copied from agreement.tuition_annual_cents at creation" }
      - { name: status, type: enum, source: system, description: "FORMING | LOCKED | MATRICULATED | COMPLETED" }
      - { name: seats_committed, type: integer, source: computed, description: "Count of this cohort's offers in status ACCEPTED" }
      - { name: offers_outstanding, type: integer, source: computed, description: "Count of this cohort's offers in status OFFERED" }
      - { name: seats_remaining, type: integer, source: computed, description: "cohort_size - seats_committed - offers_outstanding; offer creation requires seats_remaining > 0" }
      - { name: projected_fill_provisional, type: integer, source: computed, description: "seats_committed + round_half_up(offers_outstanding * 7500 / 10000)" }
      - { name: projected_fill_final, type: integer, source: computed, description: "seats_committed (pending offers count as zero)" }
      - { name: meetings_held_count, type: integer, source: computed, description: "Count of CohortMeeting records for this cohort" }
      - { name: invoice_total_cents, type: integer, source: computed, description: "null until matriculation; then sum of per-scholar fees (each scholar fee rounded HALF_UP to cents BEFORE summing) over scholars who matriculated in that matriculate call" }

  - name: Offer
    parent: null
    common_fields: true
    fields:
      - { name: nominee_id, type: string, source: input, description: "FK -> Nominee.id; nominee must be SELECTED and city-matched to the cohort" }
      - { name: cohort_id, type: string, source: input, description: "FK -> Cohort.id" }
      - { name: status, type: enum, source: system, description: "OFFERED | ACCEPTED | DECLINED | EXPIRED | REVOKED | FULFILLED" }
      - { name: expires_at, type: datetime, source: system, description: "created_at + 14 days; offer is sweep-expired when expires_at < logical now (strictly)" }

  - name: Scholar
    parent: null
    common_fields: true
    fields:
      - { name: cohort_id, type: string, source: system, description: "FK -> Cohort.id; set at offer acceptance" }
      - { name: nominee_id, type: string, source: system, description: "FK -> Nominee.id; 1:1 with the accepted offer's nominee" }
      - { name: enrollment_status, type: enum, source: system, description: "PRE_COLLEGIATE | MATRICULATED | RETAINED | GRADUATED | WITHDRAWN | DISMISSED" }
      - { name: standing, type: enum, source: system, description: "GOOD_STANDING | PROBATION; independent axis from enrollment_status; frozen once enrollment is terminal" }
      - { name: ever_matriculated, type: boolean, source: system, description: "Set true when the scholar first reaches MATRICULATED; gates inclusion in outcome-rate denominators" }
      - { name: training_completed_count, type: integer, source: computed, description: "Count of this scholar's TrainingRecords in status COMPLETED (0..8)" }
      - { name: alumni_network_access, type: boolean, source: computed, description: "true iff enrollment_status == GRADUATED" }

  - name: TrainingRecord
    parent: null
    common_fields: true
    fields:
      - { name: scholar_id, type: string, source: system, description: "FK -> Scholar.id; 8 records auto-created per scholar (T1..T8)" }
      - { name: module_code, type: enum, source: system, description: "T1 | T2 | T3 | T4 | T5 | T6 | T7 | T8" }
      - { name: category, type: enum, source: system, description: "ACADEMIC (T1-T3) | LEADERSHIP (T4-T6) | TEAM_BUILDING (T7-T8)" }
      - { name: status, type: enum, source: system, description: "NOT_STARTED | COMPLETED" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp of completion; null until COMPLETED" }

  - name: CohortMeeting
    parent: null
    common_fields: true
    fields:
      - { name: cohort_id, type: string, source: input, description: "FK -> Cohort.id; cohort must be MATRICULATED and cohort.mentor_id must equal X-User-ID" }
      - { name: kind, type: enum, source: input, description: "COHORT (whole-group meeting) | INDIVIDUAL (one-scholar check-in)" }
      - { name: scholar_id, type: string, source: input, description: "Required when kind=INDIVIDUAL, must be null when kind=COHORT; validated to exist and belong to cohort_id, but not declared as an FK relation" , default: null }
      - { name: starts_at, type: datetime, source: input, description: "ISO8601 meeting start" }
      - { name: ends_at, type: datetime, source: input, description: "ISO8601 meeting end; must be strictly after starts_at" }

  - name: Internship
    parent: null
    common_fields: true
    fields:
      - { name: scholar_id, type: string, source: input, description: "FK -> Scholar.id" }
      - { name: employer_name, type: string, source: input, description: "Host employer name" }
      - { name: starts_on, type: string, source: input, description: "Inclusive start date YYYY-MM-DD" }
      - { name: ends_on, type: string, source: input, description: "Inclusive end date YYYY-MM-DD; must be >= starts_on" }
      - { name: status, type: enum, source: system, description: "PROPOSED | CONFIRMED | COMPLETED | TERMINATED" }

# =============================================================================
# Table 1.2: State Machine Table (7 machines)
# =============================================================================
state_machines:
  - entity: Nominee
    field: status
    initial_state: NOMINATED
    terminal_states: [PLACED, DROPPED, WITHDRAWN]
    note: "Cyclic shape: WAITLISTED loops back into the selection flow (WAITLISTED -> SELECTED) via system promotion or manual decision."
    transitions:
      - from: NOMINATED
        to: ROUND_1
        trigger: "POST /api/nominees/{id}/decision with decision=ADVANCE"
        actor: SelectionOfficer | ProgramAdmin
        preconditions: []
        side_effects: ["current_round := 1"]
      - from: ROUND_1
        to: ROUND_2
        trigger: "POST /api/nominees/{id}/decision with decision=ADVANCE"
        actor: SelectionOfficer | ProgramAdmin
        preconditions:
          - ">= 2 evaluations exist for (nominee, round 1) else ERR_INSUFFICIENT_EVALUATIONS"
          - "round_1_score >= 600 else ERR_CUTOFF_NOT_MET"
        side_effects: ["current_round := 2"]
      - from: ROUND_2
        to: ROUND_3
        trigger: "POST /api/nominees/{id}/decision with decision=ADVANCE"
        actor: SelectionOfficer | ProgramAdmin
        preconditions:
          - ">= 2 evaluations exist for (nominee, round 2) else ERR_INSUFFICIENT_EVALUATIONS"
          - "round_2_score >= 700 else ERR_CUTOFF_NOT_MET"
        side_effects: ["current_round := 3"]
      - from: ROUND_3
        to: SELECTED
        trigger: "POST /api/nominees/{id}/decision with decision=ADVANCE"
        actor: SelectionOfficer | ProgramAdmin
        preconditions:
          - ">= 2 evaluations exist for (nominee, round 3) else ERR_INSUFFICIENT_EVALUATIONS"
          - "round_3_score >= 800 else ERR_CUTOFF_NOT_MET"
        side_effects: []
      - from: ROUND_3
        to: WAITLISTED
        trigger: "POST /api/nominees/{id}/decision with decision=WAITLIST"
        actor: SelectionOfficer | ProgramAdmin
        preconditions:
          - ">= 2 evaluations exist for (nominee, round 3) else ERR_INSUFFICIENT_EVALUATIONS (no cutoff requirement)"
        side_effects: []
      - from: WAITLISTED
        to: SELECTED
        trigger: "POST /api/nominees/{id}/decision with decision=ADVANCE, OR system waitlist promotion cascade"
        actor: SelectionOfficer | ProgramAdmin | system
        preconditions: []
        side_effects:
          - "When caused by system promotion: a new Offer is created for (nominee, triggering cohort) in status OFFERED with expires_at = now + 14 days and cohort.offers_outstanding += 1"
      - from: [NOMINATED, ROUND_1, ROUND_2, ROUND_3, WAITLISTED, SELECTED]
        to: DROPPED
        trigger: "POST /api/nominees/{id}/decision with decision=DROP"
        actor: SelectionOfficer | ProgramAdmin
        preconditions: []
        side_effects:
          - "If the nominee holds an offer in status OFFERED: that offer -> REVOKED, cohort.offers_outstanding -= 1, then the waitlist promotion sweep runs for that cohort"
      - from: NOMINATED
        to: WITHDRAWN
        trigger: "POST /api/nominees/{id}/withdraw"
        actor: Nominator (own nominees only) | ProgramAdmin
        preconditions:
          - "status == NOMINATED (withdrawal is only possible before ROUND_1)"
        side_effects:
          - "nominator.nominations_used -= 1 (quota released)"

  - entity: Offer
    field: status
    initial_state: OFFERED
    terminal_states: [DECLINED, EXPIRED, REVOKED, FULFILLED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /api/offers/{id}/accept"
        actor: Nominee (offer.nominee_id == X-User-ID)
        preconditions:
          - "status == OFFERED (an OFFERED offer whose expires_at < now is already EXPIRED via the clock sweep)"
        note: "No cohort-state precondition is needed here by construction: the offer-create capacity gate (seats_remaining > 0) plus the LOCKED-at-full rule guarantee committed + outstanding <= cohort_size, so LOCKED implies zero outstanding; matriculate expires every pending OFFERED offer. An OFFERED offer therefore always belongs to a FORMING cohort, and accept never violates capacity."
        side_effects:
          - "Create Scholar (cohort_id, nominee_id from the offer; enrollment_status=PRE_COLLEGIATE; standing=GOOD_STANDING; ever_matriculated=false)"
          - "Auto-create 8 TrainingRecords (T1..T8) for the new scholar, all NOT_STARTED"
          - "nominee.status := PLACED"
          - "cohort.seats_committed += 1; cohort.offers_outstanding -= 1"
          - "If cohort.seats_committed >= cohort.cohort_size: cohort.status := LOCKED"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /api/offers/{id}/decline"
        actor: Nominee (offer.nominee_id == X-User-ID)
        preconditions: ["status == OFFERED"]
        side_effects:
          - "cohort.offers_outstanding -= 1"
          - "Waitlist promotion sweep runs for the cohort (only fires when cohort.status == FORMING and seats_remaining > 0)"
      - from: OFFERED
        to: EXPIRED
        trigger: "system (POST /api/_clock/set_current_utc sweep: expires_at < new now)"
        actor: system
        preconditions: []
        side_effects:
          - "cohort.offers_outstanding -= 1"
          - "Waitlist promotion sweep runs for the cohort (same conditions as decline)"
      - from: OFFERED
        to: REVOKED
        trigger: "system (nominee dropped while offer pending)"
        actor: system
        preconditions: []
        side_effects:
          - "cohort.offers_outstanding -= 1"
          - "Waitlist promotion sweep runs for the cohort"
      - from: ACCEPTED
        to: REVOKED
        trigger: "system (scholar PRE_COLLEGIATE -> WITHDRAWN, including via matriculate training gate)"
        actor: system
        preconditions: []
        side_effects:
          - "cohort.seats_committed -= 1"
          - "If cohort.status == LOCKED and cohort.seats_committed < cohort.cohort_size: cohort.status := FORMING, then waitlist promotion sweep runs (suppressed entirely once cohort is MATRICULATED or COMPLETED)"
      - from: ACCEPTED
        to: FULFILLED
        trigger: "system (cohort matriculation, scholar matriculated)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Cohort
    field: status
    initial_state: FORMING
    terminal_states: [COMPLETED]
    note: "Branching with revert: FORMING -> LOCKED -> FORMING is allowed via accepted-offer revocation; COMPLETED bubbles up from scholar terminal states."
    transitions:
      - from: FORMING
        to: LOCKED
        trigger: "system (offer acceptance makes seats_committed >= cohort_size)"
        actor: system
        preconditions: ["seats_committed >= cohort_size (boundary is inclusive: == locks)"]
        side_effects: ["No further offer creation or acceptance (ERR_COHORT_NOT_FORMING / state gate)"]
      - from: LOCKED
        to: FORMING
        trigger: "system (ACCEPTED offer revoked; seats_committed drops below cohort_size)"
        actor: system
        preconditions: ["seats_committed < cohort_size"]
        side_effects: ["Waitlist promotion sweep runs immediately after the revert"]
      - from: LOCKED
        to: MATRICULATED
        trigger: "POST /api/cohorts/{id}/matriculate"
        actor: ProgramAdmin
        preconditions: ["status == LOCKED else ERR_INVALID_STATE"]
        side_effects:
          - "Step 1: cohort.status := MATRICULATED first (this suppresses every LOCKED->FORMING revert and every promotion sweep for the remainder of the call)"
          - "Step 2: each OFFERED offer -> EXPIRED; cohort.offers_outstanding -= 1 per expiry (no promotion sweep)"
          - "Step 3: for each scholar of the cohort in scholar.created_at ASC order: if training_completed_count == 8 then enrollment_status := MATRICULATED, ever_matriculated := true, offer -> FULFILLED; else enrollment_status := WITHDRAWN, offer -> REVOKED, cohort.seats_committed -= 1 (no revert, no promotion)"
          - "Step 4: cohort.invoice_total_cents := program-fee invoice over the scholars matriculated in Step 3 (see cohort_program_fee_invoice)"
      - from: MATRICULATED
        to: COMPLETED
        trigger: "system (every scholar of the cohort reaches a terminal enrollment_status: GRADUATED | WITHDRAWN | DISMISSED)"
        actor: system
        preconditions: ["count(scholars with non-terminal enrollment_status) == 0"]
        side_effects:
          - "agreement.status := FULFILLED (the cohort's agreement, ACTIVE -> FULFILLED)"
          - "Recompute census outcome rates for the partner college; if census retention_bps < 7000 the college -> PROBATION; if the college was PROBATION and census retention_bps >= 8000 the college -> ACTIVE"

  - entity: Scholar
    field: enrollment_status
    initial_state: PRE_COLLEGIATE
    terminal_states: [GRADUATED, WITHDRAWN, DISMISSED]
    note: "Scholar carries two independent state axes: enrollment_status (this machine) and standing (next machine). They transition independently except that standing freezes once enrollment_status is terminal."
    transitions:
      - from: PRE_COLLEGIATE
        to: MATRICULATED
        trigger: "system (cohort matriculate only; POST /api/scholars/{id}/lifecycle with to_enrollment_status=MATRICULATED is rejected ERR_INVALID_STATE)"
        actor: system
        preconditions: ["training_completed_count == 8 (enforced inside matriculate; shortfall routes the scholar to WITHDRAWN instead)"]
        side_effects: ["ever_matriculated := true"]
      - from: PRE_COLLEGIATE
        to: WITHDRAWN
        trigger: "POST /api/scholars/{id}/lifecycle with to_enrollment_status=WITHDRAWN, or system (matriculate training gate)"
        actor: Scholar (self only) | ProgramAdmin | system
        preconditions: []
        side_effects:
          - "Accepted offer -> REVOKED; cohort.seats_committed -= 1; LOCKED->FORMING revert + promotion sweep when cohort still LOCKED"
      - from: MATRICULATED
        to: RETAINED
        trigger: "POST /api/scholars/{id}/lifecycle with to_enrollment_status=RETAINED"
        actor: ProgramAdmin
        preconditions: []
        side_effects: []
      - from: [MATRICULATED, RETAINED]
        to: WITHDRAWN
        trigger: "POST /api/scholars/{id}/lifecycle with to_enrollment_status=WITHDRAWN"
        actor: Scholar (self only) | ProgramAdmin
        preconditions: []
        side_effects: ["Outcome rates change on next read (WITHDRAWN post-matriculation counts in denominators); cohort completion check runs"]
      - from: [MATRICULATED, RETAINED]
        to: DISMISSED
        trigger: "POST /api/scholars/{id}/lifecycle with to_enrollment_status=DISMISSED"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["Outcome rates change on next read; cohort completion check runs"]
      - from: RETAINED
        to: GRADUATED
        trigger: "POST /api/scholars/{id}/lifecycle with to_enrollment_status=GRADUATED"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["alumni_network_access := true", "Outcome rates change on next read; cohort completion check runs"]

  - entity: Scholar
    field: standing
    initial_state: GOOD_STANDING
    terminal_states: []
    transitions:
      - from: GOOD_STANDING
        to: PROBATION
        trigger: "POST /api/scholars/{id}/lifecycle with to_standing=PROBATION"
        actor: ProgramAdmin
        preconditions: ["enrollment_status not terminal (GRADUATED | WITHDRAWN | DISMISSED) else ERR_INVALID_STATE"]
        side_effects: []
      - from: PROBATION
        to: GOOD_STANDING
        trigger: "POST /api/scholars/{id}/lifecycle with to_standing=GOOD_STANDING"
        actor: ProgramAdmin
        preconditions: ["enrollment_status not terminal else ERR_INVALID_STATE"]
        side_effects: []

  - entity: PartnerCollege
    field: status
    initial_state: ACTIVE
    terminal_states: [LAPSED]
    note: "Cyclic: ACTIVE <-> PROBATION is driven by census outcome rates each time a cohort completes; LAPSED is terminal."
    transitions:
      - from: ACTIVE
        to: PROBATION
        trigger: "system (cohort completion leaves census retention_bps < 7000)"
        actor: system
        preconditions: []
        side_effects: ["New agreement activation blocked while PROBATION (ERR_COLLEGE_NOT_ACTIVE)"]
      - from: PROBATION
        to: ACTIVE
        trigger: "system (a later cohort completion lifts census retention_bps >= 8000)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [ACTIVE, PROBATION]
        to: LAPSED
        trigger: "POST /api/partner-colleges/{id}/renewal-review with decision=LAPSE"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "All DRAFT agreements of this college -> EXPIRED"
          - "Agreement creation and activation blocked (ERR_COLLEGE_NOT_ACTIVE)"
      - from: [ACTIVE, PROBATION]
        to: ACTIVE
        trigger: "POST /api/partner-colleges/{id}/renewal-review with decision=RENEW"
        actor: ProgramAdmin
        preconditions:
          - "census retention_bps >= 8000 AND census graduation_bps >= 6000 else ERR_RENEWAL_THRESHOLDS_NOT_MET (null rates fail the gate)"
        side_effects: ["renewed_cycles_count += 1", "status becomes/stays ACTIVE"]

  - entity: PartnerAgreement
    field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, FULFILLED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/partner-agreements/{id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "college.status == ACTIVE else ERR_COLLEGE_NOT_ACTIVE"
          - "No other ACTIVE agreement exists for the same (partner_college_id, admissions_cycle) else ERR_ACTIVE_AGREEMENT_EXISTS"
        side_effects: []
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (a new PartnerAgreement is created for the same (partner_college_id, admissions_cycle))"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: EXPIRED
        trigger: "system (college LAPSED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: FULFILLED
        trigger: "system (its cohort reaches COMPLETED)"
        actor: system
        preconditions: []
        side_effects: ["College census outcome rates recompute; college standing may flip (see PartnerCollege machine)"]

  - entity: Internship
    field: status
    initial_state: PROPOSED
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /api/internships/{id}/transition with to_status=CONFIRMED"
        actor: CareerDirector | ProgramAdmin
        preconditions: ["scholar.standing == GOOD_STANDING at confirm time (re-checked) else ERR_SCHOLAR_NOT_ELIGIBLE"]
        side_effects: []
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /api/internships/{id}/transition with to_status=COMPLETED"
        actor: CareerDirector | ProgramAdmin
        preconditions: []
        side_effects: []
      - from: [PROPOSED, CONFIRMED]
        to: TERMINATED
        trigger: "POST /api/internships/{id}/transition with to_status=TERMINATED"
        actor: CareerDirector | ProgramAdmin
        preconditions: []
        side_effects: ["A TERMINATED internship stops occupying the scholar's calendar (overlap rule ignores it)"]

  - entity: TrainingRecord
    field: status
    initial_state: NOT_STARTED
    terminal_states: [COMPLETED]
    transitions:
      - from: NOT_STARTED
        to: COMPLETED
        trigger: "POST /api/training-records/{id}/complete"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "completed_at := logical now"
          - "scholar.training_completed_count += 1"

# =============================================================================
# Table 1.2.1: Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-create-stale-college
    parent_entity: PartnerCollege
    write_endpoint: "POST /api/partner-agreements"
    occ_field: expected_college_version
    description: |
      Creating a PartnerAgreement against a PartnerCollege whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just created an agreement for the same
      (college, cycle) — which legitimately supersedes the prior DRAFT under
      the supersede transition — so the current writer's view of the college
      is stale and must be refreshed before drafting terms.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table (10 rules; every constant pinned)
# =============================================================================
calculations:
  - name: evaluation_weighted_score
    trigger: "POST /api/evaluations (at creation; stored on the Evaluation)"
    algorithm: weighted_scoring
    formula: |
      base = W_LEADERSHIP*leadership + W_TEAMWORK*teamwork + W_GROUP_PRESENCE*group_presence
      if min(leadership, teamwork, group_presence) < DIMENSION_FLOOR:
          weighted_score = min(base, FLOOR_CAP_SCORE)
      else:
          weighted_score = base
      All arithmetic is exact integer arithmetic; no rounding step exists.
    input_set: "The three dimension scores of the single evaluation being created."
    constants:
      W_LEADERSHIP: 4
      W_TEAMWORK: 3
      W_GROUP_PRESENCE: 3
      DIMENSION_FLOOR: 40
      FLOOR_CAP_SCORE: 499
    precision: "integer, exact"
    variants: []

  - name: nominee_round_score
    trigger: "POST /api/evaluations (after each creation, recompute for the affected (nominee, round_number))"
    algorithm: aggregation
    formula: |
      Let E = evaluations for (nominee, round_number), any assessor.
      if count(E) < REQUIRED_EVALUATIONS_PER_ROUND: round_N_score = null
      else: round_N_score = round_half_up( sum(weighted_score over E) / count(E) )
    input_set: "All Evaluation records for the nominee with the given round_number (evaluations are immutable; none are ever excluded once created)."
    constants:
      REQUIRED_EVALUATIONS_PER_ROUND: 2
    precision: "integer, round_half_up on the average"

  - name: round_advancement_gate
    trigger: "POST /api/nominees/{id}/decision with decision=ADVANCE from ROUND_1/ROUND_2/ROUND_3"
    algorithm: threshold
    formula: |
      ROUND_1 -> ROUND_2 requires round_1_score >= ROUND_1_CUTOFF
      ROUND_2 -> ROUND_3 requires round_2_score >= ROUND_2_CUTOFF
      ROUND_3 -> SELECTED requires round_3_score >= ROUND_3_CUTOFF
      Boundary is inclusive (>=): score == cutoff advances; score == cutoff - 1 fails with ERR_CUTOFF_NOT_MET.
      Gate ordering: the >= REQUIRED_EVALUATIONS_PER_ROUND check runs BEFORE the cutoff check
      (ERR_INSUFFICIENT_EVALUATIONS beats ERR_CUTOFF_NOT_MET when both would fail).
    input_set: "The nominee's stored round_N_score."
    constants:
      ROUND_1_CUTOFF: 600
      ROUND_2_CUTOFF: 700
      ROUND_3_CUTOFF: 800
    precision: "integer comparison"

  - name: cohort_seat_ledger
    trigger: "offer create, accept, decline, expire, revoke; cohort create"
    algorithm: aggregation
    formula: |
      seats_committed   = count(offers of cohort with status == ACCEPTED)
      offers_outstanding = count(offers of cohort with status == OFFERED)
      seats_remaining   = cohort_size - seats_committed - offers_outstanding
      seats_remaining is never negative: POST /api/offers requires seats_remaining > 0
      (else ERR_COHORT_FULL) at creation time.
    input_set: "All Offer records with cohort_id == cohort.id, any status."
    precision: "integer, exact"
    invariant: "seats_committed == count(ACCEPTED offers) at all times; an accept followed by the scholar's PRE_COLLEGIATE withdrawal leaves seats_committed unchanged."

  - name: cohort_fill_projection
    trigger: "read of Cohort (both variants surfaced as fields on every Cohort read)"
    algorithm: forward_looking
    formula: |
      projected_fill_provisional = seats_committed + round_half_up(offers_outstanding * PROVISIONAL_OFFER_WEIGHT_BPS / 10000)
      projected_fill_final       = seats_committed
    input_set: "cohort.seats_committed and cohort.offers_outstanding as defined by cohort_seat_ledger."
    constants:
      PROVISIONAL_OFFER_WEIGHT_BPS: 7500
    precision: "integer, round_half_up on the weighted term"
    variants:
      - name: provisional
        when: "Planning view: pending offers are weighted at 75% likely to convert."
        difference: "Adds round_half_up(offers_outstanding * 0.75) to committed seats."
      - name: final
        when: "Committed view: only accepted offers count."
        difference: "Pending offers count as zero; equals seats_committed."

  - name: waitlist_promotion_selection
    trigger: "Any event that raises seats_remaining while cohort.status == FORMING: offer decline, offer expiry sweep, offer revocation, LOCKED->FORMING revert"
    algorithm: selector_policy
    formula: |
      eligible = nominees with status == WAITLISTED
                 AND nominee.city_program_id == cohort.city_program_id
                 AND nominee holds no offer in status OFFERED or ACCEPTED (any cohort)
      if eligible is empty: no-op (cohort simply stays FORMING with an open seat)
      else repeat while cohort.seats_remaining > 0 and eligible non-empty:
          pick nominee ranked by round_3_score DESC, tie-break nominee.created_at ASC
          (id is NEVER used in ranking or tie-break)
          nominee.status := SELECTED
          create Offer(nominee, cohort) status=OFFERED, expires_at = now + OFFER_TTL_DAYS
          cohort.offers_outstanding += 1 (recomputed by ledger)
    input_set: "All Nominee records (any city filtered out), all Offer records for the exclusion predicate."
    constants:
      OFFER_TTL_DAYS: 14
    precision: "deterministic total order: round_3_score DESC, created_at ASC"

  - name: cohort_program_fee_invoice
    trigger: "POST /api/cohorts/{id}/matriculate (Step 4)"
    algorithm: aggregation
    formula: |
      For each scholar matriculated in this matriculate call (Step 3), in scholar.created_at ASC order:
          scholar_fee_cents = FEE_BASE_CENTS + round_half_up(cohort.tuition_annual_cents * FEE_RATE_BPS / 10000)
      cohort.invoice_total_cents = sum(scholar_fee_cents)
      ROUNDING ORDER IS PINNED: each per-scholar fee is rounded HALF_UP to whole cents
      BEFORE the sum. Summing raw fractions first and rounding once is FORBIDDEN and
      yields a different total (e.g. tuition_annual_cents=6123460 with 2 matriculated
      scholars: 653086 pinned vs 653087 under sum-then-round).
      If zero scholars matriculated: invoice_total_cents = 0.
    input_set: "Scholars of the cohort that transitioned to MATRICULATED during this matriculate call only (pre-existing MATRICULATED or WITHDRAWN scholars excluded)."
    constants:
      FEE_BASE_CENTS: 250000
      FEE_RATE_BPS: 125
    precision: "whole cents, round_half_up per scholar line item"

  - name: partner_outcome_rates
    trigger: "GET /api/partner-colleges/{id}/outcomes (computed on read; also drives standing derivation on cohort completion)"
    algorithm: aggregation
    formula: |
      ever_matriculated scholars only (ever_matriculated == true) enter any set.
      Census variant:  scholars whose cohort.status == COMPLETED.
      Rolling variant: scholars of cohorts in ANY status (FORMING, LOCKED, MATRICULATED, COMPLETED).
      For variant V with scholar set S_V:
        retention_bps_V  = round_half_up(10000 * count(enrollment_status in {RETAINED, GRADUATED}) / count(S_V))
                           null when count(S_V) == 0
        graduation set G_V = members of S_V with enrollment_status in {GRADUATED, WITHDRAWN, DISMISSED}
        graduation_bps_V = round_half_up(10000 * count(GRADUATED in G_V) / count(G_V))
                           null when count(G_V) == 0
      Scholars who withdrew in PRE_COLLEGIATE (ever_matriculated == false) are excluded
      from every numerator and denominator.
    input_set: "All Scholars whose cohort.partner_college_id == college.id, filtered as above."
    precision: "integer basis points, round_half_up"
    variants:
      - name: census
        when: "Authoritative for renewal decisions and standing derivation: only COMPLETED cohorts count."
        difference: "Scholars of not-yet-completed cohorts are excluded from both sets."
      - name: rolling
        when: "Live dashboard view returned alongside census on the outcomes endpoint."
        difference: "Scholars of cohorts in any status are included; produces different bps whenever a non-COMPLETED cohort has matriculated scholars."

  - name: partner_standing_derivation
    trigger: "system, immediately after a cohort of this college reaches COMPLETED (census rates recomputed)"
    algorithm: threshold
    formula: |
      r = census retention_bps (recomputed by partner_outcome_rates after the completion)
      if college.status == ACTIVE   and r < PROBATION_RETENTION_FLOOR_BPS: status := PROBATION
      if college.status == PROBATION and r >= RECOVERY_RETENTION_BPS:      status := ACTIVE
      Otherwise unchanged. null r (empty census) never changes standing.
      Boundary: r == 6999 -> PROBATION; r == 7000 stays ACTIVE; recovery requires r >= 8000.
    constants:
      PROBATION_RETENTION_FLOOR_BPS: 7000
      RECOVERY_RETENTION_BPS: 8000
    precision: "integer bps comparison"
    note: "Renewal gate constants (used by renewal-review, not by standing): RENEWAL_MIN_RETENTION_BPS=8000, RENEWAL_MIN_GRADUATION_BPS=6000 over the census variant."

  - name: offer_expiry_sweep
    trigger: "POST /api/_clock/set_current_utc (after the clock moves)"
    algorithm: threshold
    formula: |
      For each Offer with status == OFFERED and expires_at < new_now (STRICTLY less than):
          offer.status := EXPIRED
          cohort.offers_outstanding -= 1 (ledger recompute)
          waitlist promotion sweep runs for that cohort
      Boundary: expires_at == new_now does NOT expire (offer still acceptable at exactly its deadline).
      Processing order across multiple expired offers: offer.created_at ASC, tie-break never needed
      on id (identical created_at offers process in any order that the ledger makes unobservable;
      promotion selection order is fully pinned by waitlist_promotion_selection).
    constants:
      OFFER_TTL_DAYS: 14
    precision: "ISO8601 instant comparison, strict less-than"

# =============================================================================
# Table 1.4: Validation Rules Table (strict priority order; lower number wins
# when one request violates multiple rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role names a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Request body shape: required fields present, types valid, enum values in range, numeric ranges honored (quota 1..20, cohort_size bounds are priority 10), ends_at > starts_at, ends_on >= starts_on, ISO8601/date formats parse; kind=INDIVIDUAL meetings require scholar_id, kind=COHORT meetings forbid it"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 3
    category: auth
    check: "Role authorization: caller's role is in the endpoint's roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 4
    category: auth
    check: "Ownership scope: Nominator acts only on own nominees (nominee.nominator_id == X-User-ID); Nominee acts only on own offers (offer.nominee_id == X-User-ID); FacultyMentor acts only on own cohorts (cohort.mentor_id == X-User-ID); Scholar self-lifecycle may only set to_enrollment_status=WITHDRAWN; ProgramAdmin is exempt from ownership checks"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "POST /api/nominees/{id}/withdraw, POST /api/offers/{id}/accept, POST /api/offers/{id}/decline, POST /api/cohort-meetings, POST /api/scholars/{id}/lifecycle, POST /api/nominees (nominator_id mismatch)"
  - priority: 5
    category: existence
    check: "Path parameters resolve left to right: every {id} segment must name an existing resource"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 6
    category: existence
    check: "Body-referenced ids exist: city_program_id, nominator_id, nominee_id, partner_college_id, agreement_id, mentor_id, cohort_id, scholar_id (and meeting scholar_id when kind=INDIVIDUAL)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all POST/PUT with body references"
  - priority: 7
    category: state
    check: "OCC: expected_college_version equals the PartnerCollege's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/partner-agreements"
  - priority: 8
    category: state
    check: "State preconditions of the target state machine transition, including: offer create requires nominee.status == SELECTED (ERR_INVALID_STATE); cohort.status == FORMING for offer create (ERR_COHORT_NOT_FORMING); evaluation requires nominee.status == ROUND_N matching round_number (ERR_NOMINEE_NOT_IN_ROUND); cohort create requires agreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE); agreement activate requires college.status == ACTIVE (ERR_COLLEGE_NOT_ACTIVE); matriculate requires cohort LOCKED; lifecycle/transition/decision/withdraw/complete must be a declared transition from the current state (ERR_INVALID_STATE); internship create/confirm requires scholar enrollment in {MATRICULATED, RETAINED} and standing GOOD_STANDING (ERR_SCHOLAR_NOT_ELIGIBLE)"
    error_id: "ERR_INVALID_STATE | ERR_NOMINEE_NOT_IN_ROUND | ERR_COHORT_NOT_FORMING | ERR_AGREEMENT_NOT_ACTIVE | ERR_COLLEGE_NOT_ACTIVE | ERR_SCHOLAR_NOT_ELIGIBLE"
    http_status: 409
    applies_to: "all action endpoints; ordering inside this tier: nominee state first, then cohort state, then other entity state"
  - priority: 9
    category: business_temporal
    check: "Nomination window: logical now within [nomination_window_opens_at, nomination_window_closes_at] inclusive for the nominee's city program"
    error_id: ERR_NOMINATION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /api/nominees"
  - priority: 10
    category: business_constraint
    check: "Uniqueness / overlap / referential-consistency rules: (a) no duplicate evaluation per (nominee_id, round_number, assessor_ref); (b) nominee holds at most one offer in OFFERED|ACCEPTED across all cohorts; (c) at most one cohort per agreement; (d) at most one ACTIVE agreement per (college, cycle); (e) nominee.city_program_id == cohort.city_program_id on offer create; (f) mentor.partner_college_id == agreement.partner_college_id on cohort create; (g) mentor meeting 15-minute buffer rule; (h) internship inclusive-interval overlap rule; (i) cohort_size within [3, 6] on agreement create"
    error_id: "ERR_DUPLICATE_EVALUATION | ERR_ACTIVE_OFFER_EXISTS | ERR_COHORT_EXISTS | ERR_ACTIVE_AGREEMENT_EXISTS | ERR_CITY_MISMATCH | ERR_MENTOR_COLLEGE_MISMATCH | ERR_MENTOR_SCHEDULE_CONFLICT | ERR_INTERNSHIP_OVERLAP | ERR_COHORT_SIZE_INVALID"
    http_status: "409 for (a)-(d); 422 for (e)-(i)"
    applies_to: "POST /api/evaluations, POST /api/offers, POST /api/cohorts, POST /api/partner-agreements/{id}/activate, POST /api/partner-agreements, POST /api/cohort-meetings, POST /api/internships"
  - priority: 11
    category: business_fiscal
    check: "Capacity / quota: nominator.nominations_used < nomination_quota on nomination create; cohort.seats_remaining > 0 on offer create"
    error_id: "ERR_NOMINATION_QUOTA_EXCEEDED | ERR_COHORT_FULL"
    http_status: 422
    applies_to: "POST /api/nominees, POST /api/offers"
  - priority: 12
    category: business_constraint
    check: "Threshold gates: >= 2 evaluations before ADVANCE/WAITLIST (ERR_INSUFFICIENT_EVALUATIONS); round score >= round cutoff for ADVANCE (ERR_CUTOFF_NOT_MET); renewal RENEW requires census retention_bps >= 8000 AND census graduation_bps >= 6000 (ERR_RENEWAL_THRESHOLDS_NOT_MET, null rates fail)"
    error_id: "ERR_INSUFFICIENT_EVALUATIONS | ERR_CUTOFF_NOT_MET | ERR_RENEWAL_THRESHOLDS_NOT_MET"
    http_status: 422
    applies_to: "POST /api/nominees/{id}/decision, POST /api/partner-colleges/{id}/renewal-review"

# =============================================================================
# Table 1.5: API Endpoint Table (40 endpoints)
# All list endpoints return the envelope pagination fields and sort by
# created_at ASC unless noted; the training-records sub-resource sorts by
# module_code ASC (T1..T8 created together share a created_at).
# =============================================================================
endpoints:
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Advance the logical clock. Server boots at exactly 2026-09-01T00:00:00Z before any set call (never wall-clock). to_iso8601 must be >= 2026-09-01T00:00:00Z. Side effect: offer_expiry_sweep runs against the new now."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["offer_expiry_sweep: OFFERED offers with expires_at < now -> EXPIRED, ledger recompute, promotion sweep per affected cohort"]

  - method: POST
    path: "/api/city-programs"
    description: "Create a city recruitment program for an admissions cycle"
    roles: [ProgramAdmin]
    code: 201
    input: [code, name, admissions_cycle, nomination_window_opens_at, nomination_window_closes_at]
    output: CityProgram
    side_effects: []

  - method: GET
    path: "/api/city-programs/{id}"
    description: "Get one city program"
    roles: [ProgramAdmin, Nominator, Assessor, SelectionOfficer, Nominee, FacultyMentor, CareerDirector, Scholar]
    code: 200
    input: []
    output: CityProgram
    side_effects: []

  - method: POST
    path: "/api/nominating-partners"
    description: "Register a high school or community organization as a nominating partner"
    roles: [ProgramAdmin]
    code: 201
    input: [city_program_id, name, kind, nomination_quota]
    output: NominatingPartner
    side_effects: ["nominations_used := 0"]

  - method: GET
    path: "/api/city-programs/{id}/partners"
    description: "List nominating partners of a city program"
    roles: [ProgramAdmin, Nominator, Assessor, SelectionOfficer, Nominee, FacultyMentor, CareerDirector, Scholar]
    code: 200
    input: ["limit?", "offset?"]
    output: NominatingPartner[]
    side_effects: []

  - method: POST
    path: "/api/nominees"
    description: "Submit a nomination. For role Nominator the server sets nominator_id := X-User-ID (input nominator_id must be absent or equal); ProgramAdmin must supply nominator_id."
    roles: [Nominator, ProgramAdmin]
    code: 201
    input: [city_program_id, full_name, "nominator_id?", "first_generation?"]
    output: Nominee
    side_effects: ["status=NOMINATED, current_round=0, all round scores null", "nominator.nominations_used += 1"]

  - method: GET
    path: "/api/nominees"
    description: "List/filter nominees; FK reverse lookup for Nominee.city_program_id and Nominee.nominator_id"
    roles: [ProgramAdmin, Nominator, Assessor, SelectionOfficer, Nominee, FacultyMentor, CareerDirector, Scholar]
    code: 200
    input: ["city_program_id?", "nominator_id?", "status?", "limit?", "offset?"]
    output: Nominee[]
    side_effects: []

  - method: GET
    path: "/api/nominees/{id}"
    description: "Get one nominee (status, current_round, round scores)"
    roles: [ProgramAdmin, Nominator, Assessor, SelectionOfficer, Nominee, FacultyMentor, CareerDirector, Scholar]
    code: 200
    input: []
    output: Nominee
    side_effects: []

  - method: POST
    path: "/api/nominees/{id}/withdraw"
    description: "Withdraw a nominee; only valid from NOMINATED and releases one quota slot"
    roles: [Nominator, ProgramAdmin]
    code: 200
    input: []
    output: Nominee
    side_effects: ["status -> WITHDRAWN", "nominator.nominations_used -= 1"]

  - method: POST
    path: "/api/nominees/{id}/decision"
    description: "Assessment decision: ADVANCE (NOMINATED->ROUND_1->ROUND_2->ROUND_3->SELECTED, or WAITLISTED->SELECTED), WAITLIST (ROUND_3 only), DROP (any non-terminal)"
    roles: [SelectionOfficer, ProgramAdmin]
    code: 200
    input: [decision]
    output: Nominee
    side_effects: ["round/cutoff gates per round_advancement_gate", "DROP revokes a pending OFFERED offer and runs the promotion sweep"]

  - method: GET
    path: "/api/nominees/{id}/evaluations"
    description: "List evaluations of a nominee (FK reverse for Evaluation.nominee_id)"
    roles: [ProgramAdmin, Nominator, Assessor, SelectionOfficer, Nominee, FacultyMentor, CareerDirector, Scholar]
    code: 200
    input: ["round_number?", "limit?", "offset?"]
    output: Evaluation[]
    side_effects: []

  - method: POST
    path: "/api/evaluations"
    description: "Submit one assessor scorecard for a nominee in the nominee's current round; assessor_ref := X-User-ID"
    roles: [Assessor]
    code: 201
    input: [nominee_id, round_number, leadership, teamwork, group_presence]
    output: Evaluation
    side_effects: ["weighted_score computed per evaluation_weighted_score", "nominee round score recomputed per nominee_round_score"]

  - method: POST
    path: "/api/partner-colleges"
    description: "Create a partner college (status=ACTIVE, renewed_cycles_count=0)"
    roles: [ProgramAdmin]
    code: 201
    input: [name]
    output: PartnerCollege
    side_effects: []

  - method: GET
    path: "/api/partner-colleges/{id}"
    description: "Get one partner college"
    roles: [ProgramAdmin, Nominator, Assessor, SelectionOfficer, Nominee, FacultyMentor, CareerDirector, Scholar]
    code: 200
    input: []
    output: PartnerCollege
    side_effects: []

  - method: GET
    path: "/api/partner-colleges/{id}/outcomes"
    description: "Computed read: census and rolling retention/graduation rates in basis points (null when a denominator is empty) plus current college status"
    roles: [ProgramAdmin, Nominator, Assessor, SelectionOfficer, Nominee, FacultyMentor, CareerDirector, Scholar]
    code: 200
    input: []
    output: { retention_bps_census: "integer|null", graduation_bps_census: "integer|null", retention_bps_rolling: "integer|null", graduation_bps_rolling: "integer|null", college_status: string }
    side_effects: []

  - method: GET
    path: "/api/partner-colleges/{id}/agreements"
    description: "List agreements of a college (FK reverse for PartnerAgreement.partner_college_id)"
    roles: [ProgramAdmin, Nominator, Assessor, SelectionOfficer, Nominee, FacultyMentor, CareerDirector, Scholar]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PartnerAgreement[]
    side_effects: []

  - method: GET
    path: "/api/partner-colleges/{id}/mentors"
    description: "List mentors of a college (FK reverse for Mentor.partner_college_id)"
    roles: [ProgramAdmin, Nominator, Assessor, SelectionOfficer, Nominee, FacultyMentor, CareerDirector, Scholar]
    code: 200
    input: ["limit?", "offset?"]
    output: Mentor[]
    side_effects: []

  - method: POST
    path: "/api/partner-colleges/{id}/renewal-review"
    description: "Renewal decision on the partnership: RENEW (threshold-gated on census rates) or LAPSE (terminal)"
    roles: [ProgramAdmin]
    code: 200
    input: [decision]
    output: PartnerCollege
    side_effects: ["RENEW: renewed_cycles_count += 1, status ACTIVE", "LAPSE: status LAPSED, DRAFT agreements -> EXPIRED"]

  - method: POST
    path: "/api/mentors"
    description: "Register a faculty mentor for a partner college"
    roles: [ProgramAdmin]
    code: 201
    input: [partner_college_id, full_name]
    output: Mentor
    side_effects: []

  - method: POST
    path: "/api/partner-agreements"
    description: "Draft a partner agreement; OCC-guarded by expected_college_version; supersedes any existing DRAFT agreement for the same (college, cycle); increments PartnerCollege.version by 1"
    roles: [ProgramAdmin]
    code: 201
    input: [partner_college_id, admissions_cycle, cohort_size, tuition_annual_cents, expected_college_version]
    output: PartnerAgreement
    side_effects: ["increments PartnerCollege.version by 1", "existing DRAFT agreements for (college, cycle) -> SUPERSEDED"]

  - method: POST
    path: "/api/partner-agreements/{id}/activate"
    description: "Activate a DRAFT agreement"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: PartnerAgreement
    side_effects: ["status -> ACTIVE (gates: college ACTIVE, no other ACTIVE agreement for same college+cycle)"]

  - method: POST
    path: "/api/cohorts"
    description: "Create the cohort for an ACTIVE agreement (1:1); copies cohort_size/tuition from the agreement; mentor must belong to the agreement's college"
    roles: [ProgramAdmin]
    code: 201
    input: [agreement_id, city_program_id, mentor_id]
    output: Cohort
    side_effects: ["status=FORMING, seats_committed=0, offers_outstanding=0, invoice_total_cents=null, meetings_held_count=0"]

  - method: GET
    path: "/api/cohorts"
    description: "List/filter cohorts; FK reverse lookup for Cohort.agreement_id, Cohort.city_program_id, Cohort.partner_college_id"
    roles: [ProgramAdmin, Nominator, Assessor, SelectionOfficer, Nominee, FacultyMentor, CareerDirector, Scholar]
    code: 200
    input: ["agreement_id?", "city_program_id?", "partner_college_id?", "mentor_id?", "status?", "limit?", "offset?"]
    output: Cohort[]
    side_effects: []

  - method: GET
    path: "/api/cohorts/{id}"
    description: "Get one cohort (seat ledger, both fill projections, status, invoice)"
    roles: [ProgramAdmin, Nominator, Assessor, SelectionOfficer, Nominee, FacultyMentor, CareerDirector, Scholar]
    code: 200
    input: []
    output: Cohort
    side_effects: []

  - method: POST
    path: "/api/cohorts/{id}/matriculate"
    description: "Matriculate a LOCKED cohort: expires pending offers, matriculates scholars with all 8 training modules complete (withdraws the rest), computes the program-fee invoice — in the pinned Step 1..4 order"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Cohort
    side_effects: ["cohort -> MATRICULATED", "per-scholar training gate", "invoice computed per cohort_program_fee_invoice"]

  - method: POST
    path: "/api/offers"
    description: "Extend a placement offer to a SELECTED nominee for a FORMING cohort with seats_remaining > 0"
    roles: [SelectionOfficer, ProgramAdmin]
    code: 201
    input: [nominee_id, cohort_id]
    output: Offer
    side_effects: ["status=OFFERED, expires_at = now + 14 days", "cohort.offers_outstanding += 1"]

  - method: GET
    path: "/api/offers"
    description: "List/filter offers; FK reverse lookup for Offer.nominee_id and Offer.cohort_id"
    roles: [ProgramAdmin, Nominator, Assessor, SelectionOfficer, Nominee, FacultyMentor, CareerDirector, Scholar]
    code: 200
    input: ["nominee_id?", "cohort_id?", "status?", "limit?", "offset?"]
    output: Offer[]
    side_effects: []

  - method: GET
    path: "/api/offers/{id}"
    description: "Get one offer"
    roles: [ProgramAdmin, Nominator, Assessor, SelectionOfficer, Nominee, FacultyMentor, CareerDirector, Scholar]
    code: 200
    input: []
    output: Offer
    side_effects: []

  - method: POST
    path: "/api/offers/{id}/accept"
    description: "Nominee accepts an offer: creates the Scholar + 8 training records, decrements outstanding, increments committed, auto-locks the cohort at exactly cohort_size"
    roles: [Nominee]
    code: 200
    input: []
    output: Offer
    side_effects: ["offer -> ACCEPTED", "Scholar + 8 TrainingRecords created", "nominee -> PLACED", "seat ledger update", "auto-LOCK at seats_committed >= cohort_size"]

  - method: POST
    path: "/api/offers/{id}/decline"
    description: "Nominee declines an offer: releases the outstanding seat slot and runs the waitlist promotion sweep"
    roles: [Nominee]
    code: 200
    input: []
    output: Offer
    side_effects: ["offer -> DECLINED", "cohort.offers_outstanding -= 1", "waitlist promotion sweep"]

  - method: GET
    path: "/api/scholars"
    description: "List/filter scholars; FK reverse lookup for Scholar.cohort_id and Scholar.nominee_id"
    roles: [ProgramAdmin, Nominator, Assessor, SelectionOfficer, Nominee, FacultyMentor, CareerDirector, Scholar]
    code: 200
    input: ["cohort_id?", "nominee_id?", "enrollment_status?", "standing?", "limit?", "offset?"]
    output: Scholar[]
    side_effects: []

  - method: GET
    path: "/api/scholars/{id}"
    description: "Get one scholar (both state axes, training count, alumni flag, ever_matriculated)"
    roles: [ProgramAdmin, Nominator, Assessor, SelectionOfficer, Nominee, FacultyMentor, CareerDirector, Scholar]
    code: 200
    input: []
    output: Scholar
    side_effects: []

  - method: GET
    path: "/api/scholars/{id}/training-records"
    description: "List the scholar's 8 training records sorted by module_code ASC (FK reverse for TrainingRecord.scholar_id)"
    roles: [ProgramAdmin, Nominator, Assessor, SelectionOfficer, Nominee, FacultyMentor, CareerDirector, Scholar]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TrainingRecord[]
    side_effects: []

  - method: GET
    path: "/api/scholars/{id}/internships"
    description: "List the scholar's internships (FK reverse for Internship.scholar_id)"
    roles: [ProgramAdmin, Nominator, Assessor, SelectionOfficer, Nominee, FacultyMentor, CareerDirector, Scholar]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Internship[]
    side_effects: []

  - method: POST
    path: "/api/scholars/{id}/lifecycle"
    description: "Drive either state axis: to_enrollment_status in {RETAINED, GRADUATED, WITHDRAWN, DISMISSED} and/or to_standing in {GOOD_STANDING, PROBATION}; at least one required. Scholar role may only set to_enrollment_status=WITHDRAWN on self."
    roles: [ProgramAdmin, Scholar]
    code: 200
    input: ["to_enrollment_status?", "to_standing?"]
    output: Scholar
    side_effects: ["enrollment transitions per Scholar machines incl. offer-revocation and cohort-completion cascades", "GRADUATED sets alumni_network_access"]

  - method: POST
    path: "/api/training-records/{id}/complete"
    description: "Mark a training module COMPLETED (completed_at := logical now)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: TrainingRecord
    side_effects: ["scholar.training_completed_count += 1"]

  - method: POST
    path: "/api/cohort-meetings"
    description: "Log a cohort meeting (COHORT) or individual check-in (INDIVIDUAL, scholar_id required). Cohort must be MATRICULATED; caller must be the cohort's mentor; mentor's meetings observe the 15-minute buffer rule."
    roles: [FacultyMentor]
    code: 201
    input: [cohort_id, kind, starts_at, ends_at, "scholar_id?"]
    output: CohortMeeting
    side_effects: ["cohort.meetings_held_count += 1"]

  - method: GET
    path: "/api/cohorts/{id}/meetings"
    description: "List meetings of a cohort (FK reverse for CohortMeeting.cohort_id)"
    roles: [ProgramAdmin, Nominator, Assessor, SelectionOfficer, Nominee, FacultyMentor, CareerDirector, Scholar]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: CohortMeeting[]
    side_effects: []

  - method: POST
    path: "/api/internships"
    description: "Propose an internship for a scholar; gates: enrollment in {MATRICULATED, RETAINED} and standing GOOD_STANDING; inclusive date-overlap rule against the scholar's PROPOSED/CONFIRMED internships"
    roles: [CareerDirector, ProgramAdmin]
    code: 201
    input: [scholar_id, employer_name, starts_on, ends_on]
    output: Internship
    side_effects: ["status=PROPOSED"]

  - method: POST
    path: "/api/internships/{id}/transition"
    description: "Move an internship: PROPOSED->CONFIRMED (standing re-checked), CONFIRMED->COMPLETED, PROPOSED|CONFIRMED->TERMINATED"
    roles: [CareerDirector, ProgramAdmin]
    code: 200
    input: [to_status]
    output: Internship
    side_effects: []

# =============================================================================
# Table 1.6: Error Code Catalog (27 codes)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/malformed X-User-Role or X-User-ID header, or unknown role" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type/enum/range violation, unparseable datetime, ends_at <= starts_at, ends_on < starts_on, INDIVIDUAL meeting without scholar_id, COHORT meeting with scholar_id, lifecycle call with neither target field" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on this endpoint, or ownership scope violated (nominator/nominee/mentor/scholar self rules)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body-referenced id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_college_version does not match the PartnerCollege's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Current state does not declare the requested transition (incl. offer create for non-SELECTED nominee, matriculate of non-LOCKED cohort, withdraw after NOMINATED, terminal-state mutations)" }
  - { id: ERR_NOMINEE_NOT_IN_ROUND, http: 409, condition: "Evaluation submitted for a nominee whose status/current_round does not match round_number" }
  - { id: ERR_COHORT_NOT_FORMING, http: 409, condition: "Offer create attempted while cohort is LOCKED, MATRICULATED, or COMPLETED" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Cohort create against a DRAFT, SUPERSEDED, FULFILLED, or EXPIRED agreement" }
  - { id: ERR_COLLEGE_NOT_ACTIVE, http: 409, condition: "Agreement activation against a PROBATION college, or agreement create/activate against a LAPSED college" }
  - { id: ERR_SCHOLAR_NOT_ELIGIBLE, http: 409, condition: "Internship create/confirm: scholar enrollment not in {MATRICULATED, RETAINED} or standing != GOOD_STANDING" }
  - { id: ERR_NOMINATION_WINDOW_CLOSED, http: 422, condition: "Nomination submitted outside the city program's inclusive nomination window" }
  - { id: ERR_DUPLICATE_EVALUATION, http: 409, condition: "An evaluation already exists for (nominee_id, round_number, assessor_ref)" }
  - { id: ERR_ACTIVE_OFFER_EXISTS, http: 409, condition: "Nominee already holds an offer in OFFERED or ACCEPTED status" }
  - { id: ERR_COHORT_EXISTS, http: 409, condition: "A cohort already exists for this agreement" }
  - { id: ERR_ACTIVE_AGREEMENT_EXISTS, http: 409, condition: "Another ACTIVE agreement exists for the same (college, admissions_cycle)" }
  - { id: ERR_CITY_MISMATCH, http: 422, condition: "Offer create: nominee.city_program_id != cohort.city_program_id" }
  - { id: ERR_MENTOR_COLLEGE_MISMATCH, http: 422, condition: "Cohort create: mentor.partner_college_id != agreement.partner_college_id" }
  - { id: ERR_MENTOR_SCHEDULE_CONFLICT, http: 422, condition: "New meeting for a mentor overlaps an existing meeting of the same mentor under the 15-minute buffer rule: conflict iff new.starts_at < existing.ends_at + 15min AND existing.starts_at < new.ends_at + 15min" }
  - { id: ERR_INTERNSHIP_OVERLAP, http: 422, condition: "New internship for a scholar overlaps a PROPOSED or CONFIRMED internship of the same scholar under inclusive date semantics: conflict iff new.starts_on <= existing.ends_on AND existing.starts_on <= new.ends_on (shared boundary date IS a conflict)" }
  - { id: ERR_COHORT_SIZE_INVALID, http: 422, condition: "cohort_size outside [3, 6] on agreement create" }
  - { id: ERR_NOMINATION_QUOTA_EXCEEDED, http: 422, condition: "nominator.nominations_used == nomination_quota at nomination create" }
  - { id: ERR_COHORT_FULL, http: 422, condition: "Offer create while cohort.seats_remaining == 0 (cohort may still be FORMING with all seats spoken for)" }
  - { id: ERR_INSUFFICIENT_EVALUATIONS, http: 422, condition: "ADVANCE/WAITLIST decision with fewer than 2 evaluations in the current round" }
  - { id: ERR_CUTOFF_NOT_MET, http: 422, condition: "ADVANCE decision with round score strictly below the round cutoff" }
  - { id: ERR_RENEWAL_THRESHOLDS_NOT_MET, http: 422, condition: "RENEW decision while census retention_bps < 8000 or census graduation_bps < 6000 (null fails)" }

# =============================================================================
# Table 1.7: RBAC Matrix (8 roles)
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Foundation operator; superset of every write operation except offer accept/decline (Nominee-only), evaluation submission (Assessor-only), and meeting logging (FacultyMentor-only)"
    identity: opaque
    exclusive_operations: ["city-programs", "nominating-partners", "partner-colleges", "mentors", "partner-agreements create/activate", "renewal-review", "cohorts create", "cohorts matriculate", "training-records complete", "_clock set"]
    shared_operations: ["nominees create/decision/withdraw", "offers create", "scholars lifecycle", "internships create/transition", "all GETs"]
  - name: Nominator
    description: "High school or community organization submitting nominations against its quota"
    identity: "entity_backed:NominatingPartner"
    exclusive_operations: []
    shared_operations: ["nominees create (nominator_id := X-User-ID)", "nominees withdraw (own nominees)", "all GETs"]
  - name: Assessor
    description: "Evaluation scorecard submitter in the dynamic assessment rounds"
    identity: opaque
    exclusive_operations: ["evaluations create"]
    shared_operations: ["all GETs"]
  - name: SelectionOfficer
    description: "Runs round advancement, waitlist and drop decisions; extends offers"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["nominees decision", "offers create", "all GETs"]
  - name: Nominee
    description: "A nominated candidate; accepts or declines own offers"
    identity: "entity_backed:Nominee"
    exclusive_operations: ["offers accept", "offers decline"]
    shared_operations: ["all GETs"]
  - name: FacultyMentor
    description: "College faculty mentor assigned to a cohort; logs cohort meetings and individual check-ins"
    identity: "entity_backed:Mentor"
    exclusive_operations: ["cohort-meetings create"]
    shared_operations: ["all GETs"]
  - name: CareerDirector
    description: "Career program staff; proposes and advances internships"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["internships create/transition", "all GETs"]
  - name: Scholar
    description: "An accepted, enrolled cohort member; may self-withdraw"
    identity: "entity_backed:Scholar"
    exclusive_operations: []
    shared_operations: ["scholars lifecycle (only to_enrollment_status=WITHDRAWN, only self)", "all GETs"]
