  - rule_id: boundary_precision_check
    instances:
      - name: recovery_observation_span_of_exactly_fifteen_minutes_is_sufficient
        grounds:
          - validations.priority_12_ERR_RECOVERY_CRITERIA_NOT_MET
          - state_machines.Procedure.clinical_status.RECOVERY_to_DISCHARGED
          - entities.RecoveryObservation.fields.observed_at
        distinguishing_aspect: |
          The discharge gate measures max(observed_at) - min(observed_at) against
          MIN_RECOVERY_SPAN_MIN 15 with an INCLUSIVE boundary. Two observations 14 minutes apart
          (14:10 and 14:24), both already satisfying the aldrete >= 9 and on_room_air criteria,
          are rejected; adding a third at 14:25 makes the span exactly 15 and the same discharge
          call succeeds. The off-by-one is a pure span test - the count criterion (>= 2) and the
          latest-observation criteria are satisfied throughout, so nothing else can explain the
          flip.
        test_recipe:
          setup:
            - "one FEE_FOR_SERVICE patient, one IN_USE AVG access with a single 2026-07-28 reading, one ROUTINE referral"
            - "one MODERATE procedure driven to RECOVERY with sedation_end_at 14:00"
