              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { pkg: "$.data.id" }
            - call: "POST /modular/design-packages/${pkg}/submit"
              payload: { review_note: "R1" }
              as: DesignEngineer
              as_user_id: "eng-001"
            - call: "POST /modular/design-packages/${pkg}/review-decision"
              payload: { decision: "FREEZE" }
              as: DesignEngineer
              as_user_id: "eng-002"
            - call: "POST /modular/permits"
