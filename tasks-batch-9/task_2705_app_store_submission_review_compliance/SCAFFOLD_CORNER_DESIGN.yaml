            - *c_prof_act
            - *c_app
            - *c_rule
            - *c_rule_pub
            - *c_map
            - *c_map_start
            - *c_window
            - *c_map_pass
            - *c_app_reread
            - *c_sub
            - *c_loc
            - *c_age
            - *c_priv
            - *c_prc
            - *c_queue
            - *c_claim
            - *c_approve
            - *c_app_reread3
            - *c_plan
            - *c_start
            - *c_app_reread6
            - *c_item
            - &c_item_submit
              call: "POST /commerce-items/${item_id}/submit"
