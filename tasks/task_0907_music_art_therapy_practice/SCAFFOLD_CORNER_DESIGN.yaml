  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_client_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-create-stale-client]", "errors[ERR_STALE_CLIENT_VERSION]"]
        distinguishing_aspect: "Second plan create carrying the pre-first-create client version (stale) -> ERR_STALE_CLIENT_VERSION (412)."
        test_recipe:
          setup: ["A client with two ASSESSED+recommended referrals; first plan already created (client.version advanced)."]
          setup_api_calls:
            - call: "POST /therapists"
              payload: { full_name: "T", discipline: "MUSIC", credential: "MT-BC" }
              as: IntakeCoordinator
              captures: { ther_id: $.data.id }
