      - name: safety_before_constraint_priority_covered
        claim_type: priority_ordering
        grounds: ["validations[priority=9]", "validations[priority=10]"]
        distinguishing_aspect: "Excluded — the safety-vs-constraint priority pair is asserted by the difficulty instance."
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / complete_safety_before_constraint
          rationale: "Dual-failure complete with over-limit residual and incomplete steps asserts the safety error wins."

  # -------------------------------------------------------------- endpoints ---
  - section: endpoints
    instances:
      - name: response_envelope_shape_on_object_and_list
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "Every response carries meta.api_request_id and meta.api_request_timestamp; object reads use response_type 'object', lists 'array' with the four pagination fields."
        test_recipe:
          setup: ["Program, zone, one hydrant"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
          trigger:
            - { call: "GET /hydrants/${h_id}", as: ProgramAdmin }
            - { call: "GET /hydrants", as: ProgramAdmin }
          assert:
            - "Object response: meta.api_request_id present, response_type == 'object', data contains the hydrant"
            - "List response: response_type == 'array' and pagination fields limit/offset/total_count/has_more present with defaults limit 10, offset 0"

      - name: list_pagination_and_status_filter
        claim_type: listing
        grounds: [response_envelope, entities.Hydrant.fields.status]
        distinguishing_aspect: "Filter + paginate interaction: two IN_SERVICE hydrants with limit 1 return exactly one item, total_count 2, has_more true."
        test_recipe:
          setup: ["Program, zone, hydrants H-1 and H-2"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-1", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-2", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin }
          trigger:
            - { call: "GET /hydrants", payload: { status: "IN_SERVICE", limit: 1 }, as: ProgramAdmin }
          assert:
            - "Response contains exactly 1 hydrant, total_count == 2, has_more == true, limit == 1, offset == 0"

      - name: fk_reverse_reachability_filtered_lists
        claim_type: parent_relationships
        grounds: [entities.Inspection.fields.hydrant_id, entities.FlowTest.fields.hydrant_id]
        distinguishing_aspect: "Children are discoverable from their parent id via filtered lists: GET /inspections?hydrant_id and GET /flow-tests?hydrant_id each return exactly the children of that hydrant."
        test_recipe:
          setup: ["Hydrants H1 (one inspection, one flow test) and H2 (no children)"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-1", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h1_id: $.data.id, h1_v: $.data.version } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-2", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h2_id: $.data.id } }
            - { call: "POST /inspections", payload: { hydrant_id: "${h1_id}", scheduled_date: "2026-08-10T00:00:00Z", expected_hydrant_version: "${h1_v}" }, as: FieldOperator, as_user_id: "op_1", captures: { in_id: $.data.id } }
            - { call: "POST /flow-tests", payload: { hydrant_id: "${h1_id}", window_start: "2026-08-02T10:00:00Z", window_end: "2026-08-02T11:00:00Z" }, as: FieldOperator, as_user_id: "op_1", captures: { ft_id: $.data.id } }
          trigger:
            - { call: "GET /inspections", payload: { hydrant_id: "${h1_id}" }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "GET /inspections", payload: { hydrant_id: "${h2_id}" }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "GET /flow-tests", payload: { hydrant_id: "${h1_id}" }, as: FieldOperator, as_user_id: "op_1" }
          assert:
            - "inspections?hydrant_id=${h1_id} returns exactly [${in_id}]; for ${h2_id} returns empty with total_count 0"
            - "flow-tests?hydrant_id=${h1_id} returns exactly [${ft_id}]"

      - name: clock_default_and_set
        claim_type: conditional_action
        grounds: [entities.HydrantOutage.fields.notified_at]
        distinguishing_aspect: "Before any set_current_utc call the logical clock is exactly 2026-08-01T00:00:00Z: an outage created without touching the clock stamps notified_at 2026-08-01T00:00:00Z and ack_deadline 2026-08-01T02:00:00Z."
        test_recipe:
          setup: ["Program, zone, hydrant H; clock never set"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
          trigger:
            - { call: "POST /outages", payload: { hydrant_id: "${h_id}", reason: "OTHER" }, as: FieldOperator, as_user_id: "op_1", captures: { out_id: $.data.id } }
          assert:
            - "HydrantOutage.${out_id}.notified_at == 2026-08-01T00:00:00Z and ack_deadline == 2026-08-01T02:00:00Z (default clock, no wall-clock fallback)"

  # ----------------------------------------------------------------- errors ---
  - section: errors
    instances:
      - name: not_found_family_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_FLOW_TEST_NOT_FOUND]", "errors[ERR_WORK_ORDER_NOT_FOUND]", "errors[ERR_ISO_SNAPSHOT_NOT_FOUND]"]
        distinguishing_aspect: "Representative sample of the 404 family beyond the hydrant case: unknown flow-test, work-order, and snapshot ids each return their resource-specific error id."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /flow-tests/00000000-0000-0000-0000-000000000000", as: ProgramAdmin, captures: { err1: $.data.error_id } }
            - { call: "GET /work-orders/00000000-0000-0000-0000-000000000000", as: ProgramAdmin, captures: { err2: $.data.error_id } }
            - { call: "GET /iso-snapshots/00000000-0000-0000-0000-000000000000", as: ProgramAdmin, captures: { err3: $.data.error_id } }
          assert:
            - "err1 == ERR_FLOW_TEST_NOT_FOUND, err2 == ERR_WORK_ORDER_NOT_FOUND, err3 == ERR_ISO_SNAPSHOT_NOT_FOUND (all http 404)"

      - name: remaining_error_ids_exercised_elsewhere
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]", "errors[ERR_DECHLORINATION_LIMIT_EXCEEDED]", "errors[ERR_FLOW_TEST_WINDOW_OVERLAP]", "errors[ERR_SEQUENCE_ZONE_COOLDOWN]", "errors[ERR_OPEN_WORK_ORDERS_EXIST]", "errors[ERR_HYDRANT_NOT_IN_SERVICE]"]
        distinguishing_aspect: "Excluded — each cited error is triggered by a named difficulty instance."
        excluded_because:
          difficulty_instance: resource_temporal_overlap / flow_test_half_open_window_adjacency
          rationale: "Window overlap, zone cooldown, OCC stale version, dechlorination limit, open-work-order and not-in-service errors are each the assertion target of a §1.8 instance (or of the corner instances above)."

  # ------------------------------------------------------------------- rbac ---
  - section: rbac
    instances:
      - name: fire_dept_liaison_cannot_approve_work_order
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "FireDeptLiaison holds only acknowledge-notification; calling approve returns ERR_FORBIDDEN_ROLE (403) before state or OCC checks."
        test_recipe:
          setup: ["Hydrant H; part P; work order W SUBMITTED"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /parts", payload: { sku: "GASKET-6", name: "6in gasket", unit_price_cents: 6500, on_hand_qty: 100 }, as: ProgramAdmin, captures: { part_id: $.data.id } }
            - { call: "POST /work-orders", payload: { hydrant_id: "${h_id}", description: "Replace gaskets" }, as: FieldOperator, as_user_id: "op_1", captures: { wo_id: $.data.id } }
            - { call: "POST /work-orders/${wo_id}/part-lines", payload: { part_id: "${part_id}", qty: 1 }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /work-orders/${wo_id}/submit", as: FieldOperator, as_user_id: "op_1" }
            - { call: "GET /work-orders/${wo_id}", as: FireDeptLiaison, as_user_id: "fd_1", captures: { wo_v: $.data.version } }
          trigger:
            - { call: "POST /work-orders/${wo_id}/approve", payload: { expected_work_order_version: "${wo_v}" }, as: FireDeptLiaison, as_user_id: "fd_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE with http 403; work order remains SUBMITTED"

      - name: private_owner_cannot_verify_inspection
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "PrivateOwnerRep may record evidence on its own hydrant but may never verify — verify is UtilitySupervisor-only, even for the owner's own hydrant."
        test_recipe:
          setup: ["Owner O1; private hydrant H; inspection recorded by O1"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /private-owners", payload: { name: "Mall Corp", contact_email: "ops@mall.example" }, as: ProgramAdmin, captures: { owner_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-P1", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "PRIVATE", private_owner_id: "${owner_id}", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id, h_v: $.data.version } }
            - { call: "POST /inspections", payload: { hydrant_id: "${h_id}", scheduled_date: "2026-08-10T00:00:00Z", expected_hydrant_version: "${h_v}" }, as: FieldOperator, as_user_id: "op_1", captures: { in_id: $.data.id } }
            - { call: "POST /inspections/${in_id}/record", payload: { performed_date: "2026-08-10T00:00:00Z", defects_found: false }, as: PrivateOwnerRep, as_user_id: "${owner_id}" }
          trigger:
            - { call: "POST /inspections/${in_id}/verify", payload: { decision: "VERIFY" }, as: PrivateOwnerRep, as_user_id: "${owner_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE with http 403; inspection remains PENDING_VERIFICATION"

      - name: field_operator_cannot_create_part
        claim_type: rbac_denial
        grounds: [roles]
        distinguishing_aspect: "Catalog administration is ProgramAdmin-only: FieldOperator creating a part returns ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /parts", payload: { sku: "GASKET-6", name: "6in gasket", unit_price_cents: 6500, on_hand_qty: 100 }, as: FieldOperator, as_user_id: "op_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE with http 403"

      - name: private_owner_records_own_hydrant_allowed
        claim_type: rbac_allow
        grounds: [roles]
        distinguishing_aspect: "Excluded — the owner-evidence happy path runs inside the difficulty ISO instance's setup."
        excluded_because:
          difficulty_instance: dual_variant_calc / iso_points_municipal_only_vs_half_private
          rationale: "Its setup records and verifies a private hydrant inspection as PrivateOwnerRep with matching X-User-ID."

  # --------------------------------------------- cross-cutting layers + occ ---
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_inspection_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[inspection-create-stale-hydrant]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Hydrant.version: after one inspection create advances the version, a second create carrying the previously observed version fails with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Hydrant H at version 1; client observed version 1"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id, h_v: $.data.version } }
            - { call: "POST /inspections", payload: { hydrant_id: "${h_id}", scheduled_date: "2026-08-10T00:00:00Z", expected_hydrant_version: "${h_v}" }, as: FieldOperator, as_user_id: "op_1", captures: { in1_id: $.data.id } }
          trigger:
            - { call: "POST /inspections", payload: { hydrant_id: "${h_id}", scheduled_date: "2026-08-11T00:00:00Z", expected_hydrant_version: "${h_v}" }, as: FieldOperator, as_user_id: "op_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_VERSION with http 412 (observed ${h_v} is now stale)"
            - "Hydrant.${h_id}.latest_inspection_id still == ${in1_id}"

      - name: occ_stale_version_on_work_order_approve
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[work-order-approve-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on RepairWorkOrder.version: after a successful approve advances the version, a repeated approve with the previously observed version fails 412 — the OCC check (priority 7) precedes the state check (priority 8)."
        test_recipe:
          setup: ["Hydrant H; part P; work order W SUBMITTED; approver holds version wo_v"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /parts", payload: { sku: "GASKET-6", name: "6in gasket", unit_price_cents: 6500, on_hand_qty: 100 }, as: ProgramAdmin, captures: { part_id: $.data.id } }
            - { call: "POST /work-orders", payload: { hydrant_id: "${h_id}", description: "Replace gaskets" }, as: FieldOperator, as_user_id: "op_1", captures: { wo_id: $.data.id } }
            - { call: "POST /work-orders/${wo_id}/part-lines", payload: { part_id: "${part_id}", qty: 1 }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /work-orders/${wo_id}/submit", as: FieldOperator, as_user_id: "op_1" }
            - { call: "GET /work-orders/${wo_id}", as: UtilitySupervisor, as_user_id: "sup_1", captures: { wo_v: $.data.version } }
            - { call: "POST /work-orders/${wo_id}/approve", payload: { expected_work_order_version: "${wo_v}" }, as: UtilitySupervisor, as_user_id: "sup_1" }
          trigger:
            - { call: "POST /work-orders/${wo_id}/approve", payload: { expected_work_order_version: "${wo_v}" }, as: UtilitySupervisor, as_user_id: "sup_2", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_VERSION with http 412 (version advanced by the first approve)"

      - name: ack_notification_reconciles_program_counter
        claim_type: derived_field_reconciliation
        grounds: [entities.FlushingProgram.fields.unacknowledged_notification_count, state_machines.HydrantOutage.ACTIVE_to_ACTIVE]
        distinguishing_aspect: "Derived counter reconciliation: outage create raises unacknowledged_notification_count to 1 and the acknowledge transition lowers it back to 0, each visible immediately on GET /programs/{id}."
        test_recipe:
          setup: ["Hydrant H tagged out (notification PENDING)"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /outages", payload: { hydrant_id: "${h_id}", reason: "LEAK" }, as: FieldOperator, as_user_id: "op_1", captures: { out_id: $.data.id } }
          trigger:
            - { call: "POST /outages/${out_id}/acknowledge-notification", as: FireDeptLiaison, as_user_id: "fd_1" }
            - { call: "GET /programs/${prog_id}", as: ProgramAdmin }
          assert:
            - "After acknowledge: unacknowledged_notification_count == 0 while hydrants_out_of_service_count remains 1"

      - name: deep_cascades_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [state_machines.Hydrant.IN_SERVICE_to_OUT_OF_SERVICE, calculations.complaint_cluster]
        distinguishing_aspect: "Excluded — the two depth-3 cascades are the difficulty transitive-cascade instances."
        excluded_because:
          difficulty_instance: transitive_cascade / outage_tag_cascade_depth3
          rationale: "Outage cascade and complaint-cluster cascade end-to-end assertions live in §1.8."

  # -------------------------------------------------------- consistency model ---
  - section: consistency_model
    instances:
      - name: immediate_consistency_on_create_response
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: the POST /outages response body itself carries status ACTIVE and notification_status PENDING, and a following GET returns identical values — no reconciliation lag."
        test_recipe:
          setup: ["Program, zone, hydrant H"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
          trigger:
            - { call: "POST /outages", payload: { hydrant_id: "${h_id}", reason: "LEAK" }, as: FieldOperator, as_user_id: "op_1", captures: { out_id: $.data.id, out_status: $.data.status, out_notif: $.data.notification_status } }
            - { call: "GET /outages/${out_id}", as: FieldOperator, as_user_id: "op_1" }
          assert:
            - "Create response: status == ACTIVE and notification_status == PENDING"
            - "GET /outages/${out_id} returns identical status and notification_status in the immediately following request"
