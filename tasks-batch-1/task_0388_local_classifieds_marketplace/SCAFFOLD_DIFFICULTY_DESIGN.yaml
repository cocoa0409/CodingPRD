          Pair {state (priority 5) vs business_temporal (priority 11)}: confirming an already-CONFIRMED
          meetup that also collides with another CONFIRMED meetup surfaces ERR_INVALID_STATE (state wins)
          rather than ERR_SPOT_TIME_CONFLICT, because state precedes the temporal overlap check.
