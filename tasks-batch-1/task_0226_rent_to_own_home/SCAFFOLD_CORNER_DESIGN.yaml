# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Rent-to-Own / Lease-Purchase Home — breadth probe over §1.1-§1.7.
# Sections / claim_types from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: entity_create_agreement_returns_201_with_fields
        claim_type: Creation
        grounds:
          - entities.Agreement
          - endpoints
        distinguishing_aspect: "POST /agreements with all required fields -> 201; landlord_id copied from Property; status DRAFT; option_deadline computed."
        test_recipe:
          setup: ["Landlord, Tenant, AVAILABLE Property exist."]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { legal_name: "C1L", email: "c1l@x.com", payout_account_ref: "acct_c1l" }
              as: Landlord
              captures: { l_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "C1T", email: "c1t@x.com", credit_score: 700 }
              as: Tenant
              captures: { t_id: $.data.id }
            - call: "POST /properties"
              payload: { landlord_id: "${l_id}", address: "C1 Way", list_price_cents: 30000000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /agreements"
              payload: { property_id: "${p_id}", tenant_id: "${t_id}", locked_price_cents: 30000000, option_fee_cents: 500000, monthly_payment_cents: 200000, credit_pct: 0.30, lease_start: "2026-01-01T00:00:00Z", option_term_months: 24 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { a_id: $.data.id, st: $.data.status, ll: $.data.landlord_id }
          assert:
            - "response status == 201"
            - "Agreement.${a_id}.status == DRAFT"
            - "Agreement.${a_id}.landlord_id == ${l_id}"

      - name: entity_get_agreement_returns_stored
        claim_type: Retrieval
        grounds:
          - entities.Agreement
          - endpoints
        distinguishing_aspect: "GET /agreements/{id} returns the stored Agreement with matching id."
        test_recipe:
          setup: ["A DRAFT Agreement exists."]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { legal_name: "C2L", email: "c2l@x.com", payout_account_ref: "acct_c2l" }
              as: Landlord
              captures: { l_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "C2T", email: "c2t@x.com", credit_score: 700 }
              as: Tenant
              captures: { t_id: $.data.id }
            - call: "POST /properties"
              payload: { landlord_id: "${l_id}", address: "C2 Way", list_price_cents: 30000000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { p_id: $.data.id }
            - call: "POST /agreements"
              payload: { property_id: "${p_id}", tenant_id: "${t_id}", locked_price_cents: 30000000, option_fee_cents: 500000, monthly_payment_cents: 200000, credit_pct: 0.30, lease_start: "2026-01-01T00:00:00Z", option_term_months: 24 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { a_id: $.data.id }
          trigger:
            - call: "GET /agreements/${a_id}"
              as: Tenant
              as_user_id: "${t_id}"
              captures: { got: $.data.id }
          assert:
            - "response status == 200"
            - "data.id == ${a_id}"

      - name: entity_list_properties_paginated
        claim_type: Listing
        grounds:
          - entities.Property
          - endpoints
        distinguishing_aspect: "GET /properties returns a paginated list with total_count and has_more in meta/envelope."
        test_recipe:
          setup: ["One landlord with one property."]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { legal_name: "C3L", email: "c3l@x.com", payout_account_ref: "acct_c3l" }
              as: Landlord
              captures: { l_id: $.data.id }
            - call: "POST /properties"
              payload: { landlord_id: "${l_id}", address: "C3 Way", list_price_cents: 30000000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /properties"
              payload: { landlord_id: "${l_id}", limit: 10, offset: 0 }
              as: Landlord
              as_user_id: "${l_id}"
          assert:
            - "response status == 200"
            - "response_type == array; pagination total_count >= 1; has_more == false"

      - name: entity_get_agreement_not_found
        claim_type: Not Found
        grounds:
          - entities.Agreement
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /agreements/{bogus-uuid} -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["No agreement with the queried id."]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { legal_name: "C4L", email: "c4l@x.com", payout_account_ref: "acct_c4l" }
              as: Landlord
              captures: { l_id: $.data.id }
          trigger:
            - call: "GET /agreements/00000000-0000-4000-8000-000000000999"
              as: Landlord
              as_user_id: "${l_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: entity_create_agreement_missing_required_field
        claim_type: Required Fields
        grounds:
          - entities.Agreement.fields.credit_pct
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /agreements omitting required credit_pct -> 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Landlord, Tenant, Property exist."]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { legal_name: "C5L", email: "c5l@x.com", payout_account_ref: "acct_c5l" }
              as: Landlord
              captures: { l_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "C5T", email: "c5t@x.com", credit_score: 700 }
              as: Tenant
              captures: { t_id: $.data.id }
            - call: "POST /properties"
              payload: { landlord_id: "${l_id}", address: "C5 Way", list_price_cents: 30000000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /agreements"
              payload: { property_id: "${p_id}", tenant_id: "${t_id}", locked_price_cents: 30000000, option_fee_cents: 500000, monthly_payment_cents: 200000, lease_start: "2026-01-01T00:00:00Z", option_term_months: 24 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: entity_agreement_defaults_applied
        claim_type: Defaults
        grounds:
          - entities.Agreement.fields.max_credit_pct
          - entities.Agreement.fields.grace_days
          - entities.Agreement.fields.maintenance_threshold_cents
          - entities.Agreement.fields.option_fee_creditable
        distinguishing_aspect: "Omitting max_credit_pct/grace_days/maintenance_threshold_cents/option_fee_creditable applies defaults 0.20 / 5 / 50000 / true."
        test_recipe:
          setup: ["Landlord, Tenant, Property exist."]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { legal_name: "C6L", email: "c6l@x.com", payout_account_ref: "acct_c6l" }
              as: Landlord
              captures: { l_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "C6T", email: "c6t@x.com", credit_score: 700 }
              as: Tenant
              captures: { t_id: $.data.id }
            - call: "POST /properties"
              payload: { landlord_id: "${l_id}", address: "C6 Way", list_price_cents: 30000000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /agreements"
              payload: { property_id: "${p_id}", tenant_id: "${t_id}", locked_price_cents: 30000000, option_fee_cents: 500000, monthly_payment_cents: 200000, credit_pct: 0.30, lease_start: "2026-01-01T00:00:00Z", option_term_months: 24 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { a_id: $.data.id, mcp: $.data.max_credit_pct, gd: $.data.grace_days, mtc: $.data.maintenance_threshold_cents, ofc: $.data.option_fee_creditable }
          assert:
            - "Agreement.${a_id}.max_credit_pct == 0.20"
            - "Agreement.${a_id}.grace_days == 5"
            - "Agreement.${a_id}.maintenance_threshold_cents == 50000"
            - "Agreement.${a_id}.option_fee_creditable == true"

      - name: entity_rentpayment_amount_copied_from_agreement
        claim_type: Computed Fields
        grounds:
          - entities.RentPayment.fields.amount_cents
          - entities.RentPayment.fields.rent_portion_cents
          - entities.RentPayment.fields.credit_portion_cents
          - calculations.payment_split
        distinguishing_aspect: "On create, RentPayment.amount_cents is copied from Agreement.monthly_payment_cents (200000); credit_portion=60000, rent_portion=140000; client amount input ignored (no input field)."
        test_recipe:
          setup: ["Agreement A ACTIVE (monthly_payment_cents=200000, credit_pct=0.30)."]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { legal_name: "C7L", email: "c7l@x.com", payout_account_ref: "acct_c7l" }
              as: Landlord
              captures: { l_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "C7T", email: "c7t@x.com", credit_score: 700 }
              as: Tenant
              captures: { t_id: $.data.id }
            - call: "POST /properties"
              payload: { landlord_id: "${l_id}", address: "C7 Way", list_price_cents: 30000000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /agreements"
              payload: { property_id: "${p_id}", tenant_id: "${t_id}", locked_price_cents: 30000000, option_fee_cents: 500000, monthly_payment_cents: 200000, credit_pct: 0.30, lease_start: "2026-01-01T00:00:00Z", option_term_months: 24 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agreements/${a_id}/activate"
              payload: { expected_property_version: "${p_ver}" }
              as: Landlord
              as_user_id: "${l_id}"
          trigger:
            - call: "POST /agreements/${a_id}/rent-payments"
              payload: { period_index: 1, due_date: "2026-02-01T00:00:00Z" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { rp_id: $.data.id, amt: $.data.amount_cents, cp: $.data.credit_portion_cents, rp: $.data.rent_portion_cents }
          assert:
            - "RentPayment.${rp_id}.amount_cents == 200000"
            - "RentPayment.${rp_id}.credit_portion_cents == 60000"
            - "RentPayment.${rp_id}.rent_portion_cents == 140000"

      - name: entity_system_fields_generated
        claim_type: System Fields
        grounds:
          - entities.Property
        distinguishing_aspect: "Property create response includes server-minted id (bare UUID, no prefix), created_at, updated_at, version==1; status defaults AVAILABLE."
        test_recipe:
          setup: ["A landlord exists."]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { legal_name: "C8L", email: "c8l@x.com", payout_account_ref: "acct_c8l" }
              as: Landlord
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /properties"
              payload: { landlord_id: "${l_id}", address: "C8 Way", list_price_cents: 30000000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { p_id: $.data.id, v: $.data.version, st: $.data.status }
          assert:
            - "response status == 201"
            - "Property.${p_id}.version == 1"
            - "Property.${p_id}.status == AVAILABLE"

      - name: entity_tenant_credit_score_out_of_range
        claim_type: Type Constraints
        grounds:
          - entities.Tenant.fields.credit_score
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /tenants with credit_score=900 (> 850) -> 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["No preconditions."]
          setup_api_calls: []
          trigger:
            - call: "POST /tenants"
              payload: { legal_name: "C9T", email: "c9t@x.com", credit_score: 900 }
              as: Tenant
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: entity_property_fk_landlord_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Property.fields.landlord_id
          - "validations[priority=3]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "POST /properties referencing a non-existent landlord_id -> 404 ERR_NOT_FOUND (FK integrity)."
        test_recipe:
          setup: ["No landlord with the referenced id."]
          setup_api_calls: []
          trigger:
            - call: "POST /properties"
              payload: { landlord_id: "00000000-0000-4000-8000-0000000000aa", address: "C10 Way", list_price_cents: 30000000 }
              as: Landlord
              as_user_id: "00000000-0000-4000-8000-0000000000aa"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: sm_initial_state_agreement_draft
        claim_type: Initial State
        grounds:
          - state_machines.Agreement
          - entities.Agreement.fields.status
        distinguishing_aspect: "A newly created Agreement starts in DRAFT (initial_state)."
        excluded_because:
          difficulty_instance: dual_variant_calc / dvc_rent_credit_provisional_vs_final
          rationale: "Covered indirectly; explicitly asserted by corner entity_create_agreement_returns_201_with_fields (status==DRAFT)."

      - name: sm_record_on_terminal_paid_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.RentPayment.PENDING_to_PAID
          - "errors[ERR_PAYMENT_NOT_PENDING]"
        distinguishing_aspect: "Recording a payment again after it is PAID -> 409 ERR_PAYMENT_NOT_PENDING; no side effects fire."
        test_recipe:
          setup: ["Agreement A ACTIVE; RentPayment rp1 already PAID."]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { legal_name: "C11L", email: "c11l@x.com", payout_account_ref: "acct_c11l" }
              as: Landlord
              captures: { l_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "C11T", email: "c11t@x.com", credit_score: 700 }
              as: Tenant
              captures: { t_id: $.data.id }
            - call: "POST /properties"
              payload: { landlord_id: "${l_id}", address: "C11 Way", list_price_cents: 30000000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /agreements"
              payload: { property_id: "${p_id}", tenant_id: "${t_id}", locked_price_cents: 30000000, option_fee_cents: 500000, monthly_payment_cents: 200000, credit_pct: 0.30, lease_start: "2026-01-01T00:00:00Z", option_term_months: 24 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agreements/${a_id}/activate"
              payload: { expected_property_version: "${p_ver}" }
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /agreements/${a_id}/rent-payments"
              payload: { period_index: 1, due_date: "2026-02-01T00:00:00Z" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { rp1_id: $.data.id }
            - call: "POST /rent-payments/${rp1_id}/record"
              payload: { paid_at: "2026-02-03T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /rent-payments/${rp1_id}/record"
              payload: { paid_at: "2026-02-04T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_PAYMENT_NOT_PENDING"

      - name: sm_cure_non_late_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.RentPayment.LATE_to_PAID
          - "errors[ERR_PAYMENT_NOT_LATE]"
        distinguishing_aspect: "Curing a PENDING (not LATE) payment -> 409 ERR_PAYMENT_NOT_LATE."
        test_recipe:
          setup: ["Agreement A ACTIVE; RentPayment rp1 still PENDING."]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { legal_name: "C12L", email: "c12l@x.com", payout_account_ref: "acct_c12l" }
              as: Landlord
              captures: { l_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "C12T", email: "c12t@x.com", credit_score: 700 }
              as: Tenant
              captures: { t_id: $.data.id }
            - call: "POST /properties"
              payload: { landlord_id: "${l_id}", address: "C12 Way", list_price_cents: 30000000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /agreements"
              payload: { property_id: "${p_id}", tenant_id: "${t_id}", locked_price_cents: 30000000, option_fee_cents: 500000, monthly_payment_cents: 200000, credit_pct: 0.30, lease_start: "2026-01-01T00:00:00Z", option_term_months: 24 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agreements/${a_id}/activate"
              payload: { expected_property_version: "${p_ver}" }
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /agreements/${a_id}/rent-payments"
              payload: { period_index: 1, due_date: "2026-02-01T00:00:00Z" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { rp1_id: $.data.id }
          trigger:
            - call: "POST /rent-payments/${rp1_id}/cure"
              payload: {}
              as: Landlord
              as_user_id: "${l_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_PAYMENT_NOT_LATE"

      - name: sm_terminal_converted_no_further_transition
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Agreement
          - "errors[ERR_AGREEMENT_NOT_ACTIVE]"
        distinguishing_aspect: "Once an Agreement is CONVERTED, attempting expire -> 409 ERR_AGREEMENT_NOT_ACTIVE (terminal lockdown)."
        excluded_because:
          difficulty_instance: transitive_cascade / tc_mortgage_conversion_depth3
          rationale: "Reaching CONVERTED is exercised by tc_mortgage_conversion_depth3; terminal lockdown is the same machine's no-out-edge claim from that terminal."

      - name: sm_expire_before_deadline_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Agreement.ACTIVE_to_EXPIRED
          - "validations[priority=10]"
          - "errors[ERR_OPTION_NOT_YET_EXPIRED]"
        distinguishing_aspect: "Expire while current clock <= option_deadline -> 409 ERR_OPTION_NOT_YET_EXPIRED."
        test_recipe:
          setup: ["Agreement A ACTIVE; clock set to 2026-06-01 (before option_deadline 2028-01-01)."]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { legal_name: "C13L", email: "c13l@x.com", payout_account_ref: "acct_c13l" }
              as: Landlord
              captures: { l_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "C13T", email: "c13t@x.com", credit_score: 700 }
              as: Tenant
              captures: { t_id: $.data.id }
            - call: "POST /properties"
              payload: { landlord_id: "${l_id}", address: "C13 Way", list_price_cents: 30000000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /agreements"
              payload: { property_id: "${p_id}", tenant_id: "${t_id}", locked_price_cents: 30000000, option_fee_cents: 500000, monthly_payment_cents: 200000, credit_pct: 0.30, lease_start: "2026-01-01T00:00:00Z", option_term_months: 24 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agreements/${a_id}/activate"
              payload: { expected_property_version: "${p_ver}" }
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Landlord
              as_user_id: "${l_id}"
          trigger:
            - call: "POST /agreements/${a_id}/expire"
              payload: {}
              as: Landlord
              as_user_id: "${l_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_OPTION_NOT_YET_EXPIRED"

      - name: sm_exercise_after_deadline_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Agreement.ACTIVE_to_EXERCISED
          - "validations[priority=9]"
          - "errors[ERR_OPTION_EXPIRED]"
        distinguishing_aspect: "Exercise with exercised_at after option_deadline -> 409 ERR_OPTION_EXPIRED."
        test_recipe:
          setup: ["Agreement A ACTIVE with option_term_months=2 (option_deadline 2026-03-01); exercise attempted at 2026-04-01."]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { legal_name: "C14L", email: "c14l@x.com", payout_account_ref: "acct_c14l" }
              as: Landlord
              captures: { l_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "C14T", email: "c14t@x.com", credit_score: 700 }
              as: Tenant
              captures: { t_id: $.data.id }
            - call: "POST /properties"
              payload: { landlord_id: "${l_id}", address: "C14 Way", list_price_cents: 30000000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /agreements"
              payload: { property_id: "${p_id}", tenant_id: "${t_id}", locked_price_cents: 30000000, option_fee_cents: 500000, monthly_payment_cents: 200000, credit_pct: 0.30, lease_start: "2026-01-01T00:00:00Z", option_term_months: 2 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agreements/${a_id}/activate"
              payload: { expected_property_version: "${p_ver}" }
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Landlord
              as_user_id: "${l_id}"
