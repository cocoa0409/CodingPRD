          - entities.ReportingCycle.fields.min_slack_days_calendar
          - entities.ReportingCycle.fields.min_slack_days_business
        distinguishing_aspect: |
          The aggregate is forward-looking, so it must react to newly PLANNED work with no transition
          call at all: a cycle whose only open milestone is CLOSE reads (7, 5), adding a FILING window
          ending 2026-08-09T06:00:00Z immediately drops it to (1, 1), and then adding a REVIEW window
          ending 2026-08-06T00:00:00Z — which computes its own (4, 2) — leaves the aggregate at (1, 1)
          because it is a minimum, not a most-recent-write. The REVIEW row is admitted only because its
          start is exactly 48 hours after the CLOSE end, the boundary of CLOSE_TO_REVIEW.
        test_recipe:
