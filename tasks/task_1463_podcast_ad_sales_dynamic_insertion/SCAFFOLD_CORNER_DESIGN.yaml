            - "Campaign.${cmp}.delivered_impressions == 900 (800 baseline + 100 bonus)"
            - "MakeGood.${mg}.status == EXPIRED (bonus 100 < granted 200)"
            - "Campaign.${cmp}.status == ENDED (invoice never PAID -> no reconcile)"

  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with neither X-User-Role nor X-User-ID is rejected 401 before any other check, even on a read endpoint."
        test_recipe:
          setup: ["One show exists"]
          setup_api_calls:
            - call: "POST /adnet/shows"
              payload: { title: "Auth FM", content_category: "NEWS", avg_downloads_30d: 100 }
              as: AdOps
              captures: { sh: $.data.id }
          trigger:
            - call: "GET /adnet/shows/${sh}"
              as: AdOps
              captures: { err: $.data.error_id }
          assert:
            - "When the request is sent with both headers stripped: HTTP 401, error_id == ERR_UNAUTHENTICATED (the trigger row denotes the header-less call; role shown for endpoint resolution only)"

      - name: agency_mismatch_returns_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=3.5]", "errors[ERR_AGENCY_MISMATCH]"]
        distinguishing_aspect: "An agency creating a campaign for an advertiser represented by a DIFFERENT agency gets 403 ERR_AGENCY_MISMATCH."
        test_recipe:
          setup: ["Agencies AG1 and AG2; advertiser represented by AG1"]
          setup_api_calls:
            - call: "POST /adnet/agencies"
              payload: { name: "AG1", commission_bps: 1500 }
              as: AdOps
              captures: { ag1: $.data.id }
            - call: "POST /adnet/agencies"
              payload: { name: "AG2", commission_bps: 1000 }
              as: AdOps
              captures: { ag2: $.data.id }
            - call: "POST /adnet/advertisers"
              payload: { name: "RepCo", category: "FINTECH", agency_id: "${ag1}" }
              as: AdOps
              captures: { adv: $.data.id }
          trigger:
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${adv}", name: "CX", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 10, cpm_cents: 1000, billing_model: "ACTUAL_DELIVERY" }
              as: Agency
              as_user_id: "${ag2}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403, error_id == ERR_AGENCY_MISMATCH"

      - name: campaign_patch_on_active_rejected
        claim_type: violation_to_error
