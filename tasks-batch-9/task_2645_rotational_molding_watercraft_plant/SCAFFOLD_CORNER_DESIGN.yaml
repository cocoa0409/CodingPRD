          - state_machines.WarrantyClaim.storage_review_status
          - calculations.warranty_payout
          - endpoints.POST_/warranty-claims/{warranty_claim_id}/storage-review
        distinguishing_aspect: "Two customers who acknowledged the storage guidance one second apart around the identical delivery instant diverge on storage-review: acknowledging AT 2026-08-01T12:00:00Z verifies, acknowledging at 12:00:01Z is refused 422, and the only route left for the late customer is VIOLATED then WAIVED, which cuts the payout from 335671 to 212003 cents."
