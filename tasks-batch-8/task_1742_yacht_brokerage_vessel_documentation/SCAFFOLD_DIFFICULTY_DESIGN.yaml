              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /yacht/offers/${offI}/fail"
              payload: {}
              as: SellingAgent
              as_user_id: "${saI}"
          trigger:
            - call: "POST /yacht/escrow-entries/${entI}/refund"
              payload: {}
              as: EscrowOfficer
            - call: "GET /yacht/offers/${offI}/escrow-entries"
              payload: {}
              as: EscrowOfficer
          assert:
            - "EscrowLedgerEntry.${entI}.status == REFUNDED"
            - "sum(DEPOSIT amounts where status == CLEARED) on offer ${offI} == 0 (the only deposit left CLEARED state)"
            - "sum(outflows REFUNDED) == 15000000 == original deposit: trust-balance invariant holds with zero drift"

      - name: commission_side_split_invariant_across_reopen
        grounds:
          - calculations.commission_split
          - calculations.closing_total
          - state_machines.ClosingStatement.APPROVED_to_BALANCED
        distinguishing_aspect: |
          Conserved quantity = commission decomposition identity:
          listing_side_cents + selling_side_cents == commission_cents must
          hold after EVERY build, including a reopen->rebalance cycle; the
          forward action (build) paired with its compensating action (reopen)
          followed by rebuild must leave the identity intact with no drift.
        test_recipe:
          setup:
            - "Co-broke offer gross 700000000 (MID tier 8%); commission = 56000000"
            - "Build -> approve -> reopen -> build again via a second build call after reopen"
            - "Actually: reopen sets BALANCED and re-runs calculations; assert identity holds on the rebalanced row"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /yacht/brokerages"
              payload: { legal_name: "Split House L", home_state_code: "FL", escrow_account_ref: "T-SL", license_no: "FL-BRK-SL", default_commission_tier_code: "STANDARD" }
              as: PlatformAdmin
              captures: { brkSL: $.data.id }
            - call: "POST /yacht/brokerages"
              payload: { legal_name: "Split House S", home_state_code: "WA", escrow_account_ref: "T-SS", license_no: "WA-BRK-SS", default_commission_tier_code: "STANDARD" }
              as: PlatformAdmin
              captures: { brkSS: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkSL}", full_name: "LASP", license_no: "FL-AG-SP1", split_pct_basis: 6000 }
              as: PlatformAdmin
              captures: { laSP: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkSS}", full_name: "SASP", license_no: "WA-AG-SP2", split_pct_basis: 5000 }
              as: PlatformAdmin
              captures: { saSP: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "SELLER", full_name: "SSP", residency_state_code: "FL", tax_id_last4: "1501" }
              as: PlatformAdmin
              captures: { selSP: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "BUYER", full_name: "BSP", residency_state_code: "WA", tax_id_last4: "1502" }
              as: PlatformAdmin
              captures: { buySP: $.data.id }
            - call: "POST /yacht/vessels"
              payload: { hin: "USSPLT123456", make: "Fleming", model: "58", year_built: 2019, length_overall_ft: 58.0, documentation_mode: "USCG", uscg_official_no: "1112224", current_location_state_code: "FL" }
              as: PlatformAdmin
              captures: { vesSP: $.data.id }
            - call: "POST /yacht/listings"
              payload: { brokerage_id: "${brkSL}", listing_agent_id: "${laSP}", seller_id: "${selSP}", vessel_id: "${vesSP}", agreement_type: "CENTRAL", list_price_cents: 720000000, start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-01T00:00:00Z" }
              as: ListingAgent
              as_user_id: "${laSP}"
              captures: { lstSP: $.data.id }
            - call: "POST /yacht/listings/${lstSP}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${laSP}"
            - call: "POST /yacht/offers"
              payload: { listing_id: "${lstSP}", buyer_id: "${buySP}", selling_agent_id: "${saSP}", offer_price_cents: 700000000, deposit_pct_basis: 1000, acceptance_deadline: "2026-08-05T00:00:00Z", settlement_state_code: "FL" }
              as: SellingAgent
              as_user_id: "${saSP}"
              captures: { offSP: $.data.id, offSP_v: $.data.version }
            - call: "POST /yacht/offers/${offSP}/accept"
              payload: { expected_offer_version: "${offSP_v}" }
              as: ListingAgent
              as_user_id: "${laSP}"
            - call: "GET /yacht/offers/${offSP}/contingencies"
              payload: {}
              as: SellingAgent
              as_user_id: "${saSP}"
              captures: { s0: "$.data[0].id", s1: "$.data[1].id", s2: "$.data[2].id" }
            - call: "POST /yacht/contingencies/${s0}/waive"
              payload: {}
              as: SellingAgent
              as_user_id: "${saSP}"
            - call: "POST /yacht/contingencies/${s1}/waive"
              payload: {}
              as: SellingAgent
              as_user_id: "${saSP}"
            - call: "POST /yacht/contingencies/${s2}/waive"
              payload: {}
              as: SellingAgent
              as_user_id: "${saSP}"
            - call: "POST /yacht/closing-statements"
              payload: { offer_id: "${offSP}", rounding_mode: "PER_LINE_THEN_SUM" }
              as: ClosingOfficer
              captures: { csSP: $.data.id }
            - call: "GET /yacht/offers/${offSP}"
              payload: {}
              as: ClosingOfficer
              captures: { offSP_vn: $.data.version }
            - call: "POST /yacht/closing-statements/${csSP}/build"
              payload: { expected_offer_version: "${offSP_vn}" }
              as: ClosingOfficer
              captures: { csSP_v1: $.data.version }
            - call: "POST /yacht/closing-statements/${csSP}/approve"
              payload: { expected_statement_version: "${csSP_v1}" }
              as: ListingAgent
              as_user_id: "${laSP}"
          trigger:
            - call: "POST /yacht/closing-statements/${csSP}/reopen"
              payload: {}
              as: ClosingOfficer
            - call: "GET /yacht/closing-statements/${csSP}"
              payload: {}
              as: ClosingOfficer
          assert:
            - "ClosingStatement.${csSP}.commission_cents == 56000000 after rebuild"
            - "ClosingStatement.${csSP}.listing_side_cents + ClosingStatement.${csSP}.selling_side_cents == 56000000 exactly (identity conserved across the build->approve->reopen->rebuild cycle)"
            - "ClosingStatement.${csSP}.status == BALANCED after reopen"
