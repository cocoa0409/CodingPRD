          trigger:
            - call: "GET /land-bank/inventory-summary"
              payload: {}
              as: CountyTreasurer
              as_user_id: "treas-1"
              captures: { all_count: $.data.inventory_property_count, all_area: $.data.inventory_area_sqft, auth: $.data.total_authorized_cents, comm: $.data.total_committed_cents, disb: $.data.total_disbursed_cents, avail: $.data.total_available_cents }
            - call: "GET /land-bank/inventory-summary?situs_ward=7"
              payload: { situs_ward: 7 }
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { w7_count: $.data.inventory_property_count, w7_area: $.data.inventory_area_sqft, w7_conveyed: $.data.conveyed_area_sqft, w7_cure: $.data.cure_pending_count, w7_auth: $.data.total_authorized_cents, w7_disb: $.data.total_disbursed_cents }
