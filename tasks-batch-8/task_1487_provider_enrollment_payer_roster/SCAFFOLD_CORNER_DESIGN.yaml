            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq: "$.data[0].id" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { app: $.data.id }
            - call: "POST /api/enrollment-applications/${app}/submit"
              as: EnrollmentSpecialist
            - call: "POST /api/enrollment-applications/${app}/approve"
              as: PayerRepresentative
            - call: "GET /api/enrollment-records"
              payload: { provider_id: "${prov}", payer_id: "${py_a}" }
              as: EnrollmentSpecialist
              captures: { rec: "$.data[0].id" }
          trigger:
            - call: "POST /api/enrollment-records/${rec}/terminate"
              payload: { termination_effective_date: "2026-07-01" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_TERMINATION_DATE_INVALID"
            - "EnrollmentRecord.${rec}.status remains ACTIVE"

      - name: future_service_date_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_FUTURE_SERVICE_DATE]
        distinguishing_aspect: "A claim whose service_date (2026-08-02) is later than the current logical date (2026-08-01) is rejected with ERR_FUTURE_SERVICE_DATE."
        test_recipe:
          setup: ["Provider and payer exist; clock at default 2026-08-01"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
          trigger:
            - call: "POST /api/claims"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", service_date: "2026-08-02", amount_cents: 1000 }
              as: EnrollmentSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FUTURE_SERVICE_DATE"

      - name: term_line_confirm_without_active_enrollment
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_NO_ACTIVE_ENROLLMENT]
          - state_machines.RosterLine.PENDING_to_CONFIRMED
        distinguishing_aspect: "Confirming a TERM line for a provider with no {ACTIVE, PENDING_REVALIDATION} record on the agreement's payer fails with ERR_NO_ACTIVE_ENROLLMENT and leaves the line PENDING."
        test_recipe:
          setup: ["Agreement ACTIVE; roster with one TERM line for an unenrolled provider"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/delegation-agreements"
              payload: { practice_group_id: "${pg}", payer_id: "${py_a}", effective_date: "2026-01-01", expiry_date: "2027-12-31" }
              as: ComplianceOfficer
              captures: { ag: $.data.id, ag_v: $.data.version }
            - call: "POST /api/roster-files"
              payload:
                agreement_id: "${ag}"
                expected_agreement_version: "${ag_v}"
                lines:
                  - { provider_id: "${prov}", action: "TERM", enrollment_scope: "GROUP_LINK", benefit_assignment: "GROUP", expected_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { rf: $.data.id }
            - call: "GET /api/roster-files/${rf}/lines"
              as: EnrollmentSpecialist
              captures: { ln: "$.data[0].id" }
          trigger:
            - call: "POST /api/roster-files/${rf}/lines/${ln}/confirm"
              payload: { confirmed_effective_date: "2026-08-01" }
              as: PayerRepresentative
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NO_ACTIVE_ENROLLMENT"
            - "RosterLine.${ln}.status remains PENDING"

      - name: revalidate_too_early_returns_not_due
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_REVALIDATION_NOT_DUE]
        distinguishing_aspect: "Revalidating an ACTIVE record whose window has not opened (approved 2026-08-01, window from 2026-12-28) fails with ERR_REVALIDATION_NOT_DUE, distinct from the generic state error used for DEACTIVATED/TERMINATED records."
        test_recipe:
          setup: ["Attested provider; commercial record approved at default clock (interval 200)"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq: "$.data[0].id" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { app: $.data.id }
            - call: "POST /api/enrollment-applications/${app}/submit"
              as: EnrollmentSpecialist
            - call: "POST /api/enrollment-applications/${app}/approve"
              as: PayerRepresentative
            - call: "GET /api/enrollment-records"
              payload: { provider_id: "${prov}", payer_id: "${py_a}" }
              as: EnrollmentSpecialist
              captures: { rec: "$.data[0].id" }
          trigger:
            - call: "POST /api/enrollment-records/${rec}/revalidate"
              as: EnrollmentSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_REVALIDATION_NOT_DUE"

      - name: submit_blocked_without_attestation
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_CAQH_ATTESTATION_NOT_CURRENT]
        distinguishing_aspect: "A NEVER_ATTESTED profile blocks application submit (creation is allowed — the gate fires at submit, not at create)."
        test_recipe:
          setup: ["Provider exists, CAQH never attested; DRAFT application"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { app: $.data.id, st0: $.data.status }
          trigger:
            - call: "POST /api/enrollment-applications/${app}/submit"
              as: EnrollmentSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "${st0} == DRAFT (creation succeeded without attestation)"
            - "${err} == ERR_CAQH_ATTESTATION_NOT_CURRENT"

      - name: claim_for_terminated_provider_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_PROVIDER_TERMINATED]
        distinguishing_aspect: "Claim creation for a TERMINATED provider fails with ERR_PROVIDER_TERMINATED even though payer and service_date are otherwise valid."
        test_recipe:
          setup: ["Provider terminated at 2026-08-01 (no enrollment records); payer exists"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/providers/${prov}/terminate"
              payload: { termination_effective_date: "2026-08-01", reason: "departed" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /api/claims"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", service_date: "2026-07-15", amount_cents: 1000 }
              as: EnrollmentSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_PROVIDER_TERMINATED"

      - name: clock_regression_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_CLOCK_REGRESSION]
        distinguishing_aspect: "The logical clock is monotonic: after setting 2026-08-02, a set to 2026-08-01 fails with ERR_CLOCK_REGRESSION and the clock stays at 2026-08-02."
        test_recipe:
          setup: ["Clock advanced to 2026-08-02T00:00:00Z"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CLOCK_REGRESSION"
            - "A subsequent set to 2026-08-02T00:00:00Z (equal, non-decreasing) succeeds"

      - name: priority_pairs_covered_by_difficulty
        claim_type: priority_ordering
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - validations[priority=9]
          - validations[priority=10]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / state_beats_safety_on_withdrawn_submit and referential_beats_temporal_on_roster_line"
          rationale: "Dual-failure priority conflicts are asserted by the two named §1.8 instances."

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: claims_list_pagination_and_filter
        claim_type: standard_crud
        grounds:
          - response_envelope
          - entities.Claim
        distinguishing_aspect: "List endpoint honors limit/offset with envelope pagination fields: three claims, limit=2 yields 2 items with total_count 3 and has_more true; offset=2 yields the last item with has_more false; status filter narrows the set."
        test_recipe:
          setup: ["Attested provider with approved record; three RELEASED claims (services 2026-08-01)"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq: "$.data[0].id" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { app: $.data.id }
            - call: "POST /api/enrollment-applications/${app}/submit"
              as: EnrollmentSpecialist
            - call: "POST /api/enrollment-applications/${app}/approve"
              as: PayerRepresentative
            - call: "POST /api/claims"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", service_date: "2026-08-01", amount_cents: 1000 }
              as: EnrollmentSpecialist
            - call: "POST /api/claims"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", service_date: "2026-08-01", amount_cents: 2000 }
              as: EnrollmentSpecialist
            - call: "POST /api/claims"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", service_date: "2026-08-01", amount_cents: 3000 }
              as: EnrollmentSpecialist
          trigger:
            - call: "GET /api/claims"
              payload: { provider_id: "${prov}", limit: 2, offset: 0 }
              as: EnrollmentSpecialist
            - call: "GET /api/claims"
              payload: { provider_id: "${prov}", limit: 2, offset: 2 }
              as: EnrollmentSpecialist
            - call: "GET /api/claims"
              payload: { provider_id: "${prov}", status: "HELD" }
              as: EnrollmentSpecialist
          assert:
            - "Page 1: response_type == 'array', 2 items, total_count == 3, has_more == true"
            - "Page 2 (offset 2): 1 item, total_count == 3, has_more == false"
            - "status=HELD filter returns 0 items (all three are RELEASED)"

      - name: applications_filter_by_status_and_provider
        claim_type: standard_crud
        grounds:
          - entities.EnrollmentApplication
        distinguishing_aspect: "The filtered list returns only applications matching every supplied filter: one DRAFT and one SUBMITTED application for the provider are separable by the status parameter."
        test_recipe:
          setup: ["Attested provider; payer A app SUBMITTED; payer B app DRAFT"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq: "$.data[0].id" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/payers"
              payload: { payer_code: "PB", name: "Payer B", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_b: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { app_a: $.data.id }
            - call: "POST /api/enrollment-applications/${app_a}/submit"
              as: EnrollmentSpecialist
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_b}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { app_b: $.data.id }
          trigger:
            - call: "GET /api/enrollment-applications"
              payload: { provider_id: "${prov}", status: "DRAFT" }
              as: EnrollmentSpecialist
              captures: { only_id: "$.data[0].id" }
          assert:
            - "Filtered list has exactly 1 item (total_count == 1)"
            - "${only_id} == ${app_b} (the DRAFT one); the SUBMITTED application ${app_a} is excluded"

      - name: success_envelope_shape_on_object_and_array
        claim_type: standard_crud
        grounds:
          - response_envelope
        distinguishing_aspect: "Single-resource GET wraps data as an object; list GET wraps data as an array; both carry meta.api_request_id and meta.api_request_timestamp."
        test_recipe:
          setup: ["One practice group"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
          trigger:
            - call: "GET /api/practice-groups/${pg}"
              as: EnrollmentSpecialist
            - call: "GET /api/practice-groups/${pg}/providers"
              as: EnrollmentSpecialist
          assert:
            - "GET object: response_type == 'object', data is a mapping with id == ${pg}, meta.api_request_id present"
            - "GET list: response_type == 'array', data is a list, pagination fields limit/offset/total_count/has_more present"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_catalog_triggerability_check
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ENROLLMENT_OVERLAP]
          - errors[ERR_AGREEMENT_OVERLAP]
          - errors[ERR_EMPTY_ROSTER]
          - errors[ERR_PROVIDER_GROUP_MISMATCH]
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
          - errors[ERR_STALE_AGREEMENT_VERSION]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / enrollment_interval_half_open_touch; resource_temporal_overlap / agreement_closed_interval_touch_rejected; boundary_precision_check / empty_roster_rejected; priority_pair_validation_conflict / referential_beats_temporal_on_roster_line; cross_entity_state_dependency / roster_submit_blocked_by_terminated_agreement; (OCC instance occ_stale_agreement_version_rejected in cross_cutting_layers)"
          rationale: "These catalog entries are already triggered by the named §1.8 instances or the named §1.9 instance; every remaining catalog error is triggered by a §1.9 instance in validations/state_machines/rbac."

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: specialist_cannot_approve_application
        claim_type: role_denial
        grounds:
          - roles.PayerRepresentative
          - errors[ERR_FORBIDDEN_FOR_ROLE]
        distinguishing_aspect: "Approve is exclusive to PayerRepresentative; an EnrollmentSpecialist attempting it gets ERR_FORBIDDEN_FOR_ROLE (403) before any state evaluation."
        test_recipe:
          setup: ["Attested provider; application SUBMITTED"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq: "$.data[0].id" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { app: $.data.id }
            - call: "POST /api/enrollment-applications/${app}/submit"
              as: EnrollmentSpecialist
          trigger:
            - call: "POST /api/enrollment-applications/${app}/approve"
              as: EnrollmentSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FORBIDDEN_FOR_ROLE"
            - "EnrollmentApplication.${app}.status remains SUBMITTED"

      - name: payer_rep_cannot_submit_roster
        claim_type: role_denial
        grounds:
          - roles.EnrollmentSpecialist
          - errors[ERR_FORBIDDEN_FOR_ROLE]
        distinguishing_aspect: "Roster submission is exclusive to EnrollmentSpecialist; a PayerRepresentative is rejected with ERR_FORBIDDEN_FOR_ROLE even with a valid OCC version."
        test_recipe:
          setup: ["Agreement ACTIVE (version 1)"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/delegation-agreements"
              payload: { practice_group_id: "${pg}", payer_id: "${py_a}", effective_date: "2026-01-01", expiry_date: "2027-12-31" }
              as: ComplianceOfficer
              captures: { ag: $.data.id, ag_v: $.data.version }
          trigger:
            - call: "POST /api/roster-files"
              payload:
                agreement_id: "${ag}"
                expected_agreement_version: "${ag_v}"
                lines:
                  - { provider_id: "${prov}", action: "ADD", enrollment_scope: "GROUP_LINK", benefit_assignment: "GROUP", expected_effective_date: "2026-08-01" }
              as: PayerRepresentative
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FORBIDDEN_FOR_ROLE"
            - "Agreement version is unchanged (still ${ag_v}) — the write never happened"

      - name: provider_cannot_create_payer
        claim_type: role_denial
        grounds:
          - roles.ComplianceOfficer
          - errors[ERR_FORBIDDEN_FOR_ROLE]
        distinguishing_aspect: "Payer configuration is exclusive to ComplianceOfficer; the entity-backed Provider role is denied."
        test_recipe:
          setup: ["One provider exists (used as the acting identity)"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
          trigger:
            - call: "POST /api/payers"
              payload: { payer_code: "PX", name: "Payer X", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: Provider
              as_user_id: "${prov}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FORBIDDEN_FOR_ROLE"

      - name: provider_attesting_others_profile_rejected
        claim_type: role_denial
        grounds:
          - roles.Provider
          - validations[priority=5]
          - errors[ERR_PROFILE_OWNERSHIP_MISMATCH]
        distinguishing_aspect: "Entity-backed identity: X-User-ID must equal the profile's provider_id; provider P2 attesting P1's profile is rejected with ERR_PROFILE_OWNERSHIP_MISMATCH."
        test_recipe:
          setup: ["Providers P1 and P2 with auto-created CAQH profiles"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { p1: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P2", full_name: "Dr Two", specialty: "PD" }
              as: EnrollmentSpecialist
              captures: { p2: $.data.id }
            - call: "GET /api/providers/${p1}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq1: "$.data[0].id" }
          trigger:
            - call: "POST /api/caqh-profiles/${cq1}/attest"
              as: Provider
              as_user_id: "${p2}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_PROFILE_OWNERSHIP_MISMATCH"
            - "CAQHProfile.${cq1}.status remains NEVER_ATTESTED"

      - name: roster_reconcile_segregation_of_duties
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=5]
          - state_machines.RosterFile.CONFIRMED_to_RECONCILED
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "The specialist whose X-User-ID submitted the roster cannot reconcile it (ERR_SEGREGATION_OF_DUTIES); a different ComplianceOfficer identity reconciles successfully."
        test_recipe:
          setup: ["Agreement ACTIVE; single-line roster submitted by user 'spec-1' and confirmed (file CONFIRMED)"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/delegation-agreements"
              payload: { practice_group_id: "${pg}", payer_id: "${py_a}", effective_date: "2026-01-01", expiry_date: "2027-12-31" }
              as: ComplianceOfficer
              captures: { ag: $.data.id, ag_v: $.data.version }
            - call: "POST /api/roster-files"
              payload:
                agreement_id: "${ag}"
                expected_agreement_version: "${ag_v}"
                lines:
                  - { provider_id: "${prov}", action: "ADD", enrollment_scope: "GROUP_LINK", benefit_assignment: "GROUP", expected_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              as_user_id: "spec-1"
              captures: { rf: $.data.id }
            - call: "GET /api/roster-files/${rf}/lines"
              as: EnrollmentSpecialist
              captures: { ln: "$.data[0].id" }
            - call: "POST /api/roster-files/${rf}/lines/${ln}/confirm"
              payload: { confirmed_effective_date: "2026-08-01" }
              as: PayerRepresentative
          trigger:
            - call: "POST /api/roster-files/${rf}/reconcile"
              as: ComplianceOfficer
              as_user_id: "spec-1"
              captures: { err: $.data.error_id }
            - call: "POST /api/roster-files/${rf}/reconcile"
              as: ComplianceOfficer
              as_user_id: "officer-7"
              captures: { st: $.data.status }
          assert:
            - "${err} == ERR_SEGREGATION_OF_DUTIES (submitter 'spec-1' blocked)"
            - "${st} == RECONCILED when reconciled by a different identity 'officer-7'"

      - name: missing_auth_headers_returns_400
        claim_type: role_denial
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers is rejected with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before role or resource checks."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/payers"
              payload: { payer_code: "PX", name: "Payer X", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER with HTTP 400"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_agreement_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[roster-submit-stale-agreement]
          - errors[ERR_STALE_AGREEMENT_VERSION]
        distinguishing_aspect: "OCC on DelegatedCredentialingAgreement.version: a second roster submission carrying the pre-first-submission version (1) fails 412; resending with the observed current version (2) succeeds; each successful submission increments version by 1."
        test_recipe:
          setup: ["Agreement ACTIVE (version 1 captured); roster A submitted with version 1 (agreement now version 2)"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/delegation-agreements"
              payload: { practice_group_id: "${pg}", payer_id: "${py_a}", effective_date: "2026-01-01", expiry_date: "2027-12-31" }
              as: ComplianceOfficer
              captures: { ag: $.data.id, ag_v1: $.data.version }
            - call: "POST /api/roster-files"
              payload:
                agreement_id: "${ag}"
                expected_agreement_version: "${ag_v1}"
                lines:
                  - { provider_id: "${prov}", action: "ADD", enrollment_scope: "GROUP_LINK", benefit_assignment: "GROUP", expected_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { rf_a: $.data.id }
          trigger:
            - call: "POST /api/roster-files"
              payload:
                agreement_id: "${ag}"
                expected_agreement_version: "${ag_v1}"
                lines:
                  - { provider_id: "${prov}", action: "ADD", enrollment_scope: "GROUP_LINK", benefit_assignment: "GROUP", expected_effective_date: "2026-09-01" }
              as: EnrollmentSpecialist
              captures: { err: $.data.error_id }
            - call: "GET /api/delegation-agreements/${ag}"
              as: ComplianceOfficer
              captures: { ag_v_now: $.data.version }
          assert:
            - "${err} == ERR_STALE_AGREEMENT_VERSION with HTTP 412 (stale expected_agreement_version == ${ag_v1})"
            - "${ag_v_now} == ${ag_v1} + 1 (exactly one successful submission incremented the version)"
            - "RosterFile.${rf_a} remains SUBMITTED (the rejected write did not supersede it)"

      - name: clock_sweep_advances_all_entity_families
        claim_type: ops_run_checkpoint
        grounds:
          - calculations.caqh_attestation_cycle
          - calculations.revalidation_schedule
          - state_machines.DelegatedCredentialingAgreement.ACTIVE_to_EXPIRED
        distinguishing_aspect: "One clock set to 2026-12-15 drives three independent sweeps in a single checkpoint: the CAQH profile lapses (due 2026-11-29), the 60-day-interval enrollment record deactivates (due 2026-09-30), and the delegation agreement expires (expiry 2026-11-30)."
        test_recipe:
          setup:
            - "Attested provider (due 2026-11-29); payer with revalidation_interval_days 60; record approved at default clock (due 2026-09-30); agreement [2026-01-01, 2026-11-30]"
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq: "$.data[0].id" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
            - call: "POST /api/payers"
              payload: { payer_code: "P60", name: "Payer 60", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 60 }
              as: ComplianceOfficer
              captures: { py: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { app: $.data.id }
            - call: "POST /api/enrollment-applications/${app}/submit"
              as: EnrollmentSpecialist
            - call: "POST /api/enrollment-applications/${app}/approve"
              as: PayerRepresentative
            - call: "GET /api/enrollment-records"
              payload: { provider_id: "${prov}", payer_id: "${py}" }
              as: EnrollmentSpecialist
              captures: { rec: "$.data[0].id", due0: "$.data[0].revalidation_due_date" }
            - call: "POST /api/delegation-agreements"
              payload: { practice_group_id: "${pg}", payer_id: "${py}", effective_date: "2026-01-01", expiry_date: "2026-11-30" }
              as: ComplianceOfficer
              captures: { ag: $.data.id }
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq_st: "$.data[0].status" }
            - call: "GET /api/enrollment-records/${rec}"
              as: EnrollmentSpecialist
              captures: { rec_st: $.data.status }
            - call: "GET /api/delegation-agreements/${ag}"
              as: ComplianceOfficer
              captures: { ag_st: $.data.status }
          assert:
            - "${due0} == '2026-09-30' (2026-08-01 + 60 days)"
            - "${cq_st} == LAPSED"
            - "${rec_st} == DEACTIVATED"
            - "${ag_st} == EXPIRED"

      - name: cascades_and_variants_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile
        excluded_because:
          difficulty_instance: "transitive_cascade / provider_retro_termination_cascade; transitive_cascade / roster_add_confirm_release_cascade; compensating_invariant / recoupment_balance_compensation"
          rationale: "Multi-level cascade execution, ordering, and derived-field reconciliation after forward + compensating actions are asserted by the named §1.8 instances."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: approve_effects_visible_immediately
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.EnrollmentApplication.SUBMITTED_to_APPROVED
        distinguishing_aspect: "Immediate consistency: the approve response itself carries APPROVED, and a read issued right after shows the created ACTIVE EnrollmentRecord and the released claim — no delay, no recompute endpoint."
        test_recipe:
          setup: ["Attested provider; HELD claim (service 2026-08-01) pending enrollment; SUBMITTED application"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq: "$.data[0].id" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/claims"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", service_date: "2026-08-01", amount_cents: 1000 }
              as: EnrollmentSpecialist
              captures: { cl: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { app: $.data.id }
            - call: "POST /api/enrollment-applications/${app}/submit"
              as: EnrollmentSpecialist
          trigger:
            - call: "POST /api/enrollment-applications/${app}/approve"
              as: PayerRepresentative
              captures: { app_st: $.data.status }
            - call: "GET /api/enrollment-records"
              payload: { provider_id: "${prov}", payer_id: "${py_a}" }
              as: EnrollmentSpecialist
              captures: { rec_st: "$.data[0].status" }
            - call: "GET /api/claims/${cl}"
              as: EnrollmentSpecialist
              captures: { cl_st: $.data.status }
          assert:
            - "${app_st} == APPROVED in the mutation response itself"
            - "${rec_st} == ACTIVE and ${cl_st} == RELEASED on the immediately following reads"
