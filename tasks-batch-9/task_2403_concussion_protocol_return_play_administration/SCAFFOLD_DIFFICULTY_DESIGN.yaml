# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) - task 2403
# 9 rule_ids x 2 instances = 18 instances.
# YAML anchors are used for the long canonical setup chains (BASE = empty-DB
# through the canonical diagnosis; RTP = the five graduated stages; CLEAR = the
# baseline retest, final consultant clearance and return to contact). Aliases
# expand to identical structured call objects, so every instance still carries a
# complete, directly executable chain after parsing.
#
# Canonical fixture (logical clock default 2026-08-01T00:00:00Z):
#   Clubs      Harbor City Kraken (HCK), Ridgeway Sentinels (RWS)
#   Clinicians Dr Vance   CLUB_AFFILIATED @ HCK        -> screens, diagnoses, runs RTP
#              Dr Osei    UNAFFILIATED_OBSERVER        -> initiates, attends locker-room exam
#              Dr Iyer    INDEPENDENT_CONSULTANT       -> final clearance only
#   Player     K Mbeki #24 HCK, pre-season baseline composite 88
#   Game       2026 week 1 HCK v RWS, kickoff 2026-09-13T17:00:00Z
#   Case       diagnosed 2026-09-13T18:19:00Z, symptom 9, composite 70
#              -> baseline_deviation_points 18, severity_index 82
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: case_provisional_projection_diverges_from_accrued_return_date
        grounds:
          - calculations.case_return_readiness_timeline
          - entities.ConcussionCase.fields.projected_return_at
          - entities.ConcussionCase.fields.earliest_return_at
          - state_machines.ReturnStep.IN_PROGRESS_to_PASSED
        distinguishing_aspect: |
          Both variants answer "when may this player return to contact" for the SAME case, yet the
          PROVISIONAL_PROJECTION stamped at diagnosis (2026-09-23T18:19:00.000Z) is four days and
          17h41m earlier than the FINAL_ACCRUED value derived from the stage-5 sign-off
          (2026-09-28T12:00:00.000Z); only the accrued value gates return-to-contact, and this
          instance lives on the ConcussionCase entity domain (clinical timeline), not on Club.
        test_recipe:
          setup:
            - "Two clubs, a club physician, an unaffiliated observer and an independent consultant, all credentialed to 2027-12-31"
            - "K Mbeki with a pre-season baseline of composite 88 filed 2026-08-01"
            - "Week-1 game IN_PROGRESS; observer-initiated evaluation screened with an ATAXIA no-go sign and symptom score 9"
            - "Locker-room exam attended by the observer from 18:10, diagnosis documented at 18:19 (9 whole minutes of exam)"
            - "All five return-to-participation stages started and passed on the earliest legal instants, the stage-5 sign-off landing on 2026-09-27T12:00:00Z"
          setup_api_calls:
            - &c_clock_aug1
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueAdmin
            - &c_club_h
              call: "POST /concussion-program/clubs"
              payload: { name: "Harbor City Kraken", market_code: "HCK", exemption_slots_total: 3 }
              as: LeagueAdmin
              captures: { club_h_id: $.data.id }
            - &c_club_r
              call: "POST /concussion-program/clubs"
              payload: { name: "Ridgeway Sentinels", market_code: "RWS", exemption_slots_total: 3 }
              as: LeagueAdmin
              captures: { club_r_id: $.data.id }
            - &c_doc_h
              call: "POST /concussion-program/clinicians"
              payload: { full_name: "Dr Vance", affiliation: "CLUB_AFFILIATED", license_number: "LIC-1001", credential_expires_at: "2027-12-31T00:00:00Z", club_id: "${club_h_id}" }
              as: LeagueAdmin
              captures: { doc_h_id: $.data.id }
            - &c_obs
              call: "POST /concussion-program/clinicians"
              payload: { full_name: "Dr Osei", affiliation: "UNAFFILIATED_OBSERVER", license_number: "LIC-2001", credential_expires_at: "2027-12-31T00:00:00Z" }
              as: LeagueAdmin
              captures: { obs_id: $.data.id }
            - &c_inc
              call: "POST /concussion-program/clinicians"
              payload: { full_name: "Dr Iyer", affiliation: "INDEPENDENT_CONSULTANT", license_number: "LIC-3001", credential_expires_at: "2027-12-31T00:00:00Z" }
              as: LeagueAdmin
              captures: { inc_id: $.data.id }
            - &c_player
              call: "POST /concussion-program/players"
              payload: { club_id: "${club_h_id}", full_name: "K Mbeki", jersey_number: 24, position: "WR" }
              as: LeagueAdmin
              captures: { player_id: $.data.id, player_v1: $.data.version }
            - &c_baseline
              call: "POST /concussion-program/baseline-tests"
              payload: { player_id: "${player_id}", season_year: 2026, composite_score: 88, reaction_time_ms: 520, symptom_score: 0, expected_player_version: "${player_v1}" }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
              captures: { baseline_id: $.data.id }
            - &c_game
              call: "POST /concussion-program/games"
              payload: { season_year: 2026, week_index: 1, home_club_id: "${club_h_id}", away_club_id: "${club_r_id}", kickoff_at: "2026-09-13T17:00:00Z" }
              as: LeagueAdmin
              captures: { game_id: $.data.id }
            - &c_clock_kick
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T17:00:00Z" }
              as: LeagueAdmin
            - &c_game_live
              call: "POST /concussion-program/games/${game_id}/advance-status"
              payload: { to_status: "IN_PROGRESS" }
              as: LeagueAdmin
            - &c_clock_1805
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T18:05:00Z" }
              as: LeagueAdmin
            - &c_eval
              call: "POST /concussion-program/sideline-evaluations"
              payload: { player_id: "${player_id}", game_id: "${game_id}", trigger_source: "UNAFFILIATED_OBSERVER" }
              as: UnaffiliatedObserver
              as_user_id: "${obs_id}"
              captures: { eval_id: $.data.id }
            - &c_screen
              call: "POST /concussion-program/sideline-evaluations/${eval_id}/screen"
              payload: { no_go_signs: ["ATAXIA"], symptom_score: 9 }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
            - &c_clock_1810
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T18:10:00Z" }
              as: LeagueAdmin
            - &c_exam
              call: "POST /concussion-program/sideline-evaluations/${eval_id}/locker-room-exam"
              payload: { inc_clinician_id: "${obs_id}" }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
            - &c_clock_1819
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T18:19:00Z" }
              as: LeagueAdmin
            - &c_diagnose
              call: "POST /concussion-program/sideline-evaluations/${eval_id}/diagnose-concussion"
              payload: { symptom_score: 9, composite_score: 70, documentation_note: "no-go sign ataxia, removed from play" }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
              captures: { case_id: $.data.id, projected: $.data.projected_return_at }
            - &c_clock_0915
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T12:00:00Z" }
              as: LeagueAdmin
            - &c_step1
              call: "POST /concussion-program/concussion-cases/${case_id}/return-steps"
              payload: { stage_index: 1 }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
              captures: { step1_id: $.data.id }
            - &c_clock_0916
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-16T12:00:00Z" }
              as: LeagueAdmin
            - &c_pass1
              call: "POST /concussion-program/return-steps/${step1_id}/evaluate"
              payload: { outcome: "PASS", symptom_score: 0 }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
            - &c_clock_0917
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-17T12:00:00Z" }
              as: LeagueAdmin
            - &c_step2
              call: "POST /concussion-program/concussion-cases/${case_id}/return-steps"
              payload: { stage_index: 2 }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
              captures: { step2_id: $.data.id }
            - &c_clock_0918
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-18T12:00:00Z" }
              as: LeagueAdmin
            - &c_pass2
              call: "POST /concussion-program/return-steps/${step2_id}/evaluate"
              payload: { outcome: "PASS", symptom_score: 0 }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
            - &c_clock_0919
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-19T12:00:00Z" }
              as: LeagueAdmin
            - &c_step3
              call: "POST /concussion-program/concussion-cases/${case_id}/return-steps"
              payload: { stage_index: 3 }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
              captures: { step3_id: $.data.id }
            - &c_clock_0920
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T12:00:00Z" }
              as: LeagueAdmin
            - &c_pass3
              call: "POST /concussion-program/return-steps/${step3_id}/evaluate"
              payload: { outcome: "PASS", symptom_score: 1 }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
            - &c_clock_0921
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-21T12:00:00Z" }
              as: LeagueAdmin
            - &c_step4
              call: "POST /concussion-program/concussion-cases/${case_id}/return-steps"
              payload: { stage_index: 4 }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
              captures: { step4_id: $.data.id }
            - &c_clock_0923
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-23T12:00:00Z" }
              as: LeagueAdmin
            - &c_pass4
              call: "POST /concussion-program/return-steps/${step4_id}/evaluate"
              payload: { outcome: "PASS", symptom_score: 0 }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
            - &c_clock_0925
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-25T12:00:00Z" }
              as: LeagueAdmin
            - &c_step5
              call: "POST /concussion-program/concussion-cases/${case_id}/return-steps"
              payload: { stage_index: 5 }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
              captures: { step5_id: $.data.id }
            - &c_clock_0927
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-27T12:00:00Z" }
              as: LeagueAdmin
          trigger:
            - &c_pass5
              call: "POST /concussion-program/return-steps/${step5_id}/evaluate"
              payload: { outcome: "PASS", symptom_score: 0 }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
          assert:
            - "ReturnStep.${step5_id}.status == PASSED"
            - "ConcussionCase.${case_id}.rtp_stage == 5"
            - "ConcussionCase.${case_id}.severity_index == 82"
            - "ConcussionCase.${case_id}.projected_return_at == 2026-09-23T18:19:00.000Z"
            - "ConcussionCase.${case_id}.earliest_return_at == 2026-09-28T12:00:00.000Z"
            - "ConcussionCase.${case_id}.earliest_return_at > ConcussionCase.${case_id}.projected_return_at"
            - "ConcussionCase.${case_id}.case_status == RTP_IN_PROGRESS"

      - name: club_compliance_preliminary_diverges_from_adjudicated_score
        grounds:
          - calculations.club_compliance_score
          - entities.Club.fields.compliance_score
          - entities.Club.fields.adjudicated_compliance_score
          - state_machines.ProtocolAudit.FINDINGS_ISSUED_to_CLOSED_UPHELD
        distinguishing_aspect: |
          The PRELIMINARY variant counts an audit the moment findings are issued while the
          ADJUDICATED variant waits for CLOSED_UPHELD, so the same club shows compliance_score 82 and
          adjudicated_compliance_score 100 at the same observable instant; this instance lives on the
          Club entity domain (compliance accounting), a different subject from the ConcussionCase
          timeline variant.
        test_recipe:
          setup:
            - "One club with no audit history (compliance_score 100, adjudicated_compliance_score 100, TIER_0, ACTIVE)"
            - "One protocol audit opened by auditor-a and still OPEN"
          setup_api_calls:
            - *c_clock_aug1
            - *c_club_h
            - &c_audit_open_a
              call: "POST /concussion-program/protocol-audits"
              payload: { club_id: "${club_h_id}" }
              as: LeagueAuditor
              as_user_id: "auditor-a"
              captures: { audit_id: $.data.id }
          trigger:
            - &c_findings_mmr
              call: "POST /concussion-program/protocol-audits/${audit_id}/findings"
              payload: { violation_codes: ["MISSED_MANDATORY_REMOVAL"], exposure_days: 0 }
              as: LeagueAuditor
              as_user_id: "auditor-b"
            - call: "GET /concussion-program/clubs/${club_h_id}/compliance-summary"
              as: LeagueAuditor
              as_user_id: "auditor-b"
            - call: "POST /concussion-program/protocol-audits/${audit_id}/close"
              payload: { disposition: "UPHELD", closing_note: "violation upheld on review" }
              as: LeagueAuditor
              as_user_id: "auditor-c"
          assert:
            - "after findings: ProtocolAudit.${audit_id}.assessed_fine_cents == 15000000"
            - "after findings: Club.${club_h_id}.compliance_score == 82"
            - "after findings: Club.${club_h_id}.adjudicated_compliance_score == 100"
            - "after findings: Club.${club_h_id}.escalation_tier == TIER_1 and Club.${club_h_id}.status == PROBATION"
            - "after close UPHELD: Club.${club_h_id}.compliance_score == 82"
            - "after close UPHELD: Club.${club_h_id}.adjudicated_compliance_score == 82"
            - "after close UPHELD: Club.${club_h_id}.open_violation_count == 0"

  - rule_id: combinatorial_formula
    instances:
      - name: audit_fine_rounds_each_violation_line_before_summing
        grounds:
          - calculations.audit_fine_amount_cents
          - entities.ProtocolAudit.fields.assessed_fine_cents
          - entities.ProtocolAudit.fields.exposure_days
          - state_machines.ProtocolAudit.OPEN_to_FINDINGS_ISSUED
        distinguishing_aspect: |
          Mode (b) - nested rounding whose order changes the answer: with exposure_factor 9/7 and
          severity_factor 1.15 the two violation lines round UP individually to 36964286 and 29571429
          for a total of 66535715, whereas summing the unrounded lines and rounding once yields
          66535714; the scaffold pins round-per-line-then-sum and the one-cent gap proves it.
        test_recipe:
          setup:
            - "The canonical diagnosed case with severity_index 82 (so severity_factor is 1.15)"
            - "The club still has a clean record: compliance_score 100, escalation_tier TIER_0"
            - "An audit opened by auditor-a against that club and linked to the case"
          setup_api_calls:
            - *c_clock_aug1
            - *c_club_h
            - *c_club_r
            - *c_doc_h
            - *c_obs
            - *c_inc
            - *c_player
            - *c_baseline
            - *c_game
            - *c_clock_kick
            - *c_game_live
            - *c_clock_1805
            - *c_eval
            - *c_screen
            - *c_clock_1810
            - *c_exam
            - *c_clock_1819
            - *c_diagnose
            - &c_audit_open_case
              call: "POST /concussion-program/protocol-audits"
              payload: { club_id: "${club_h_id}", case_id: "${case_id}", sideline_evaluation_id: "${eval_id}" }
              as: LeagueAuditor
              as_user_id: "auditor-a"
              captures: { audit_id: $.data.id }
          trigger:
            - call: "POST /concussion-program/protocol-audits/${audit_id}/findings"
              payload: { violation_codes: ["MISSING_INC_CLEARANCE", "UNAUTHORIZED_SAME_GAME_RETURN"], exposure_days: 2 }
              as: LeagueAuditor
              as_user_id: "auditor-b"
          assert:
            - "ProtocolAudit.${audit_id}.escalation_tier_at_issuance == TIER_0"
            - "ProtocolAudit.${audit_id}.assessed_fine_cents == 66535715"
            - "ProtocolAudit.${audit_id}.assessed_fine_cents != 66535714"
            - "ProtocolAudit.${audit_id}.status == FINDINGS_ISSUED"
            - "Club.${club_h_id}.outstanding_fine_cents == 66535715"
            - "Club.${club_h_id}.compliance_score == 55"
            - "Club.${club_h_id}.escalation_tier == TIER_3 and Club.${club_h_id}.status == SANCTIONED"
            - "ConcussionCase.${case_id}.case_status == MANDATORY_REMOVAL and ConcussionCase.${case_id}.heightened_review_required == true"

      - name: audit_fine_uses_tier_stamped_before_its_own_score_impact
        grounds:
          - calculations.audit_fine_amount_cents
          - calculations.club_posture_propagation
          - entities.ProtocolAudit.fields.escalation_tier_at_issuance
          - state_machines.Club.ACTIVE_to_PROBATION
        distinguishing_aspect: |
          Mode (c) - a circular-looking dependency pinned by evaluation order: the fine depends on the
          club's escalation_tier while the tier depends on the very audit being priced, so the scaffold
          reads the tier EXCLUDING this audit (TIER_1 from score 85) giving 33267857, where using the
          post-transaction tier (TIER_2 from score 67) would give 44357142.
        test_recipe:
          setup:
            - "The canonical diagnosed case with severity_index 82"
            - "A first audit already FINDINGS_ISSUED for EVALUATION_DEADLINE_BREACH (weight 15, fine 5000000), leaving the club at compliance_score 85, escalation_tier TIER_1, status PROBATION"
            - "A second audit opened by auditor-a, linked to the case, still OPEN"
          setup_api_calls:
            - *c_clock_aug1
            - *c_club_h
            - *c_club_r
            - *c_doc_h
            - *c_obs
            - *c_inc
            - *c_player
            - *c_baseline
            - *c_game
            - *c_clock_kick
            - *c_game_live
            - *c_clock_1805
            - *c_eval
            - *c_screen
            - *c_clock_1810
            - *c_exam
            - *c_clock_1819
            - *c_diagnose
            - call: "POST /concussion-program/protocol-audits"
              payload: { club_id: "${club_h_id}" }
              as: LeagueAuditor
              as_user_id: "auditor-a"
              captures: { audit1_id: $.data.id }
            - call: "POST /concussion-program/protocol-audits/${audit1_id}/findings"
              payload: { violation_codes: ["EVALUATION_DEADLINE_BREACH"], exposure_days: 0 }
              as: LeagueAuditor
              as_user_id: "auditor-b"
            - call: "POST /concussion-program/protocol-audits"
              payload: { club_id: "${club_h_id}", case_id: "${case_id}" }
              as: LeagueAuditor
              as_user_id: "auditor-a"
              captures: { audit2_id: $.data.id }
          trigger:
            - call: "POST /concussion-program/protocol-audits/${audit2_id}/findings"
              payload: { violation_codes: ["MISSED_MANDATORY_REMOVAL"], exposure_days: 2 }
              as: LeagueAuditor
              as_user_id: "auditor-b"
          assert:
            - "ProtocolAudit.${audit1_id}.assessed_fine_cents == 5000000"
            - "ProtocolAudit.${audit2_id}.escalation_tier_at_issuance == TIER_1"
            - "ProtocolAudit.${audit2_id}.assessed_fine_cents == 33267857"
            - "ProtocolAudit.${audit2_id}.assessed_fine_cents != 44357142"
            - "Club.${club_h_id}.compliance_score == 67"
            - "Club.${club_h_id}.escalation_tier == TIER_2"
            - "Club.${club_h_id}.status == SANCTIONED"
            - "Club.${club_h_id}.outstanding_fine_cents == 38267857"

  - rule_id: non_linear_state_machine
    instances:
      - name: case_status_cycles_pending_clearance_back_to_rtp_on_denial
        grounds:
          - state_machines.ConcussionCase.RTP_IN_PROGRESS_to_PENDING_INC_CLEARANCE
          - state_machines.ConcussionCase.PENDING_INC_CLEARANCE_to_RTP_IN_PROGRESS
          - state_machines.ReturnStep.PASSED_to_REVOKED
          - entities.ConcussionCase.fields.rtp_stage
        distinguishing_aspect: |
          ConcussionCase.case_status is cyclic: RTP_IN_PROGRESS -> PENDING_INC_CLEARANCE ->
          RTP_IN_PROGRESS on a DENIED_MORE_REST decision, and the loop is not a no-op because it
          revokes the stage-5 pass and drops rtp_stage from 5 to 4 while nulling earliest_return_at.
        test_recipe:
          setup:
            - "The canonical case with all five stages passed (rtp_stage 5, earliest_return_at 2026-09-28T12:00:00.000Z)"
            - "A post-diagnosis baseline retest filed so the player is baseline VALID again"
            - "A PENDING IncClearance assigned to Dr Iyer, case_status PENDING_INC_CLEARANCE"
          setup_api_calls:
            - *c_clock_aug1
            - *c_club_h
            - *c_club_r
            - *c_doc_h
            - *c_obs
            - *c_inc
            - *c_player
            - *c_baseline
            - *c_game
            - *c_clock_kick
            - *c_game_live
            - *c_clock_1805
            - *c_eval
            - *c_screen
            - *c_clock_1810
            - *c_exam
            - *c_clock_1819
            - *c_diagnose
            - *c_clock_0915
            - *c_step1
            - *c_clock_0916
            - *c_pass1
            - *c_clock_0917
            - *c_step2
            - *c_clock_0918
            - *c_pass2
            - *c_clock_0919
            - *c_step3
            - *c_clock_0920
            - *c_pass3
            - *c_clock_0921
            - *c_step4
            - *c_clock_0923
            - *c_pass4
            - *c_clock_0925
            - *c_step5
            - *c_clock_0927
            - *c_pass5
            - &c_get_player_v2
              call: "GET /concussion-program/players/${player_id}"
              as: LeagueAdmin
              captures: { player_v2: $.data.version }
            - &c_retest
              call: "POST /concussion-program/baseline-tests"
              payload: { player_id: "${player_id}", season_year: 2026, composite_score: 87, reaction_time_ms: 515, symptom_score: 0, expected_player_version: "${player_v2}" }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
              captures: { retest_id: $.data.id }
            - &c_get_case_v
              call: "GET /concussion-program/concussion-cases/${case_id}"
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
              captures: { case_v: $.data.version }
            - &c_request_inc
              call: "POST /concussion-program/concussion-cases/${case_id}/inc-clearances"
              payload: { inc_clinician_id: "${inc_id}", expected_case_version: "${case_v}" }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
              captures: { clearance_id: $.data.id }
          trigger:
            - call: "POST /concussion-program/inc-clearances/${clearance_id}/decide"
              payload: { decision: "DENIED_MORE_REST", decision_notes: "symptom diary still abnormal, further rest required" }
              as: IndependentConsultant
              as_user_id: "${inc_id}"
          assert:
            - "IncClearance.${clearance_id}.status == DENIED_MORE_REST"
            - "ReturnStep.${step5_id}.status == REVOKED"
            - "ConcussionCase.${case_id}.case_status == RTP_IN_PROGRESS"
            - "ConcussionCase.${case_id}.rtp_stage == 4"
            - "ConcussionCase.${case_id}.earliest_return_at == null"
            - "ConcussionCase.${case_id}.recurrence_count == 0"
            - "ReturnStep.${step4_id}.status == PASSED"

      - name: audit_findings_response_findings_revision_cycle
        grounds:
          - state_machines.ProtocolAudit.FINDINGS_ISSUED_to_CLUB_RESPONDED
          - state_machines.ProtocolAudit.CLUB_RESPONDED_to_FINDINGS_ISSUED
          - entities.ProtocolAudit.fields.response_round_count
          - calculations.audit_fine_amount_cents
        distinguishing_aspect: |
          ProtocolAudit - a different entity from ConcussionCase - carries its own cycle
          FINDINGS_ISSUED -> CLUB_RESPONDED -> FINDINGS_ISSUED, and the revision re-prices the audit
          from scratch (violation_codes replaced, escalation_tier_at_issuance re-stamped from the
          score computed with this audit excluded, assessed_fine_cents recomputed to 15000000).
        test_recipe:
          setup:
            - "One club with no other audits"
            - "An audit opened by auditor-a, findings issued by auditor-b for LATE_INJURY_REPORT (fine 1500000, club score 94)"
          setup_api_calls:
            - *c_clock_aug1
            - *c_club_h
            - *c_audit_open_a
            - call: "POST /concussion-program/protocol-audits/${audit_id}/findings"
              payload: { violation_codes: ["LATE_INJURY_REPORT"], exposure_days: 0 }
              as: LeagueAuditor
              as_user_id: "auditor-b"
          trigger:
            - call: "POST /concussion-program/protocol-audits/${audit_id}/respond"
              payload: { response_note: "the filing delay was caused by a league portal outage" }
              as: ClubComplianceOfficer
              as_user_id: "${club_h_id}"
            - call: "POST /concussion-program/protocol-audits/${audit_id}/findings"
              payload: { violation_codes: ["MISSED_MANDATORY_REMOVAL"], exposure_days: 0 }
              as: LeagueAuditor
              as_user_id: "auditor-b"
          assert:
            - "after respond: ProtocolAudit.${audit_id}.status == CLUB_RESPONDED"
            - "after respond: ProtocolAudit.${audit_id}.response_round_count == 1"
            - "after respond: Club.${club_h_id}.compliance_score == 94"
            - "after revised findings: ProtocolAudit.${audit_id}.status == FINDINGS_ISSUED"
            - "after revised findings: ProtocolAudit.${audit_id}.violation_codes == [MISSED_MANDATORY_REMOVAL]"
            - "after revised findings: ProtocolAudit.${audit_id}.escalation_tier_at_issuance == TIER_0"
            - "after revised findings: ProtocolAudit.${audit_id}.assessed_fine_cents == 15000000"
            - "after revised findings: ProtocolAudit.${audit_id}.response_round_count == 1"
            - "after revised findings: Club.${club_h_id}.compliance_score == 82 and Club.${club_h_id}.outstanding_fine_cents == 15000000"

  - rule_id: transitive_cascade
    instances:
      - name: sweep_breach_cascades_to_club_sanction_and_case_freeze
        grounds:
          - state_machines.SidelineEvaluation.LOCKER_ROOM_EXAM_to_PROTOCOL_BREACH
          - state_machines.ProtocolAudit.OPEN_to_FINDINGS_ISSUED
          - state_machines.Club.PROBATION_to_SANCTIONED
          - state_machines.ConcussionCase.RTP_IN_PROGRESS_to_STAGE_FROZEN
          - calculations.club_posture_propagation
        distinguishing_aspect: |
          Four causally chained hops from ONE sweep call: (1) the abandoned evaluation becomes
          PROTOCOL_BREACH, (2) that breach - not the sweep - opens and issues an auto ProtocolAudit,
          (3) that audit's weights drive the club from PROBATION to SANCTIONED, (4) the SANCTIONED
          posture - not the audit - freezes the unrelated in-progress case into STAGE_FROZEN.
        test_recipe:
          setup:
            - "The canonical case with stage 1 started (case_status RTP_IN_PROGRESS, one IN_PROGRESS ReturnStep)"
            - "A second Harbor City player with a week-2 evaluation abandoned in LOCKER_ROOM_EXAM whose 15-minute mandatory deadline has passed"
            - "A pre-existing audit already FINDINGS_ISSUED for MISSING_INC_CLEARANCE + LATE_INJURY_REPORT, leaving the club at compliance_score 74, TIER_2, PROBATION, outstanding_fine_cents 21500000"
            - "Logical clock at 2026-09-16T18:16:00Z, one minute past the second evaluation's deadline"
