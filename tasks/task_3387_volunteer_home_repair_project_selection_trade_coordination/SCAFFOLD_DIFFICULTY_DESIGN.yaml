  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: funding_pool_conserved_across_selection_delivery_return_and_cancel
        grounds:
          - calculations.funding_cycle_ledger
          - state_machines.MaterialOrder.DELIVERED_to_RETURNED
          - state_machines.Project.PLANNING_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity is MONEY: available_cents == pool_cents -
          reserved_cents - spent_cents at every checkpoint, and the
          select/cancel pair plus the deliver/return pair each restore the
          pre-action figure with zero drift.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Cycle budget 1000000; one selected project (envelope 115000); one material order (total 1787) staged, delivered, then returned; then the project is cancelled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rebuild/funding-cycles"
              payload: { name: "FY27", fiscal_year: 2027, total_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { cyc: $.data.id }
            - call: "GET /rebuild/funding-cycles/${cyc}"
              payload: {}
              as: Any
              captures: { avail0: $.data.available_cents, resv0: $.data.reserved_cents, spent0: $.data.spent_cents }
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", homeowner_name: "Ledger Site", date_of_birth: "1990-01-01", household_size: 1, household_income_cents: 1000000, is_veteran: false, has_disability: false, ownership_doc_provided: true, occupancy_doc_provided: true, address: "22 C St" }
              as: Anonymous
