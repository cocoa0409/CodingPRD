            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10141", full_name: "Hearing Patient", date_of_birth: "1959-04-22" }
              as: PracticeAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /supply-lots"
              payload: { item_type: "HEARING_AID", lot_number: "LOT-1007", quantity_received: 5, expires_at: "2028-06-30T00:00:00Z" }
              as: PracticeAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /diagnostic-studies"
              payload: { patient_id: "${pat_id}", study_type: "AUDIOMETRY" }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { study_a: $.data.id, ver_a1: $.data.version, status_a1: $.data.status }
          trigger:
            - call: "POST /device-dispenses"
              payload: { diagnostic_study_id: "${study_a}", supply_lot_id: "${lot_id}", device_type: "HEARING_AID", device_serial: "HA300001", ear: "LEFT", price_cents: 289000, expected_study_version: "${ver_a1}" }
              as: Audiologist
              as_user_id: "u_aud_1"
            - call: "POST /diagnostic-studies/${study_a}/results"
              payload: { pta_db_hl: 30.0, word_recognition_pct: 88 }
              as: Audiologist
              as_user_id: "u_aud_1"
            - call: "POST /diagnostic-studies/${study_a}/interpretation"
              payload: {}
              as: Audiologist
              as_user_id: "u_aud_2"
              captures: { rec_a: $.data.recommendation }
            - call: "GET /diagnostic-studies/${study_a}"
              payload: {}
              as: Audiologist
              as_user_id: "u_aud_1"
              captures: { ver_a3: $.data.version }
            - call: "POST /device-dispenses"
              payload: { diagnostic_study_id: "${study_a}", supply_lot_id: "${lot_id}", device_type: "HEARING_AID", device_serial: "HA300001", ear: "LEFT", price_cents: 289000, expected_study_version: "${ver_a3}" }
              as: Audiologist
              as_user_id: "u_aud_1"
            - call: "POST /diagnostic-studies"
              payload: { patient_id: "${pat_id}", study_type: "AUDIOMETRY" }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { study_b: $.data.id }
            - call: "POST /diagnostic-studies/${study_b}/results"
              payload: { pta_db_hl: 55.0, word_recognition_pct: 62 }
              as: Audiologist
              as_user_id: "u_aud_1"
            - call: "POST /diagnostic-studies/${study_b}/interpretation"
              payload: {}
              as: Audiologist
              as_user_id: "u_aud_2"
              captures: { rec_b: $.data.recommendation }
            - call: "GET /diagnostic-studies/${study_b}"
              payload: {}
              as: Audiologist
              as_user_id: "u_aud_1"
              captures: { ver_b3: $.data.version }
            - call: "POST /device-dispenses"
              payload: { diagnostic_study_id: "${study_b}", supply_lot_id: "${lot_id}", device_type: "HEARING_AID", device_serial: "HA300001", ear: "LEFT", price_cents: 289000, expected_study_version: "${ver_b3}" }
              as: Audiologist
              as_user_id: "u_aud_1"
              captures: { dispense_id: $.data.id, trial_end: $.data.trial_end_at }
          assert:
            - "Layer 1 (lifecycle) — the dispense against ORDERED study ${study_a} returns HTTP 409 with error.id == \"ERR_STUDY_STATE_INVALID\", not 412 and not ERR_DEVICE_TYPE_NOT_RECOMMENDED"
            - "DiagnosticStudy.${study_a}.version is still 1 after that rejection, and SupplyLot.${lot_id}.quantity_on_hand is still 5"
            - "Study ${study_a} reaches version 2 at results and version 3 at interpretation, with recommendation \"OBSERVATION\" (pta_db_hl 30.0 < 40)"
            - "Layer 2 (content) — the same body against INTERPRETED study ${study_a} with the fresh version 3 returns HTTP 409 with error.id == \"ERR_DEVICE_TYPE_NOT_RECOMMENDED\": DEVICE_TYPE_FOR_RECOMMENDATION has no entry for OBSERVATION"
            - "Study ${study_b} interprets to recommendation \"HEARING_AID\" (pta_db_hl 55.0 >= 40)"
            - "Success — the identical body against study ${study_b} returns HTTP 201 with fit_status \"FITTED\", billing_status \"INVOICED\", adjustment_count 0, dispensed_at \"2026-08-01T00:00:00Z\" and trial_end_at \"2026-08-31T00:00:00Z\" (clock + 30 days)"
            - "SupplyLot.${lot_id} after the single successful dispense: quantity_on_hand 4, quantity_consumed 1, quantity_wasted 0, available_quantity 4, status \"ACTIVE\" — the two rejected attempts consumed nothing"
            - "DiagnosticStudy.${study_b}.superseded_dispense_count == 0 and version == 4 after the dispense; DiagnosticStudy.${study_a}.version is still 3"

  # ===========================================================================
  # RULE 8 — resource_temporal_overlap
  # Two different resources under two different interval semantics. The scope is
  # a single-occupancy resource on CLOSED intervals (a shared endpoint IS a
  # conflict) plus an asymmetric-looking but actually symmetric 45-minute
  # turnaround buffer. The surgery block is a multi-occupancy resource on
  # HALF-OPEN intervals (a shared endpoint is NOT a conflict) with an aggregate
  # concurrency ceiling and a containment window.
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: endoscope_closed_interval_and_turnaround_buffer
        grounds:
          - errors.ERR_SCOPE_INTERVAL_CONFLICT
          - errors.ERR_REPROCESSING_BUFFER_VIOLATION
          - calculations.scope_reprocessing_due.constants.REPROCESSING_BUFFER_MINUTES
          - entities.ProcedureBooking.fields.endoscope_asset_id
          - endpoints[POST /procedure-bookings]
        distinguishing_aspect: |
          Resource: EndoscopeAsset, single-occupancy, CLOSED intervals — [start_at, end_at]
          with both endpoints inclusive, so a candidate starting exactly when the incumbent
          ends is a conflict, not an adjacency. Layered on top is a 45-minute turnaround
          buffer that is checked in both directions: forward (candidate start too soon after a
          preceding end) and backward (candidate end too soon before a following start). Six
          candidates on one day separate three outcomes — accepted, ERR_SCOPE_INTERVAL_CONFLICT
          and ERR_REPROCESSING_BUFFER_VIOLATION — including the 15-minute-apart pair that
          distinguishes the buffer rule from the overlap rule. Different resource and
          different interval semantics from the sibling instance.
        test_recipe:
          setup:
            - "PayerPolicy OVL-2999 and one adult Patient, so no pediatric venue or supervision rule interferes."
            - "One EndoscopeAsset SC-0005 registered READY with last_reprocessed_at null and hld_expires_at null, so the 168-hour shelf-life rule cannot fire on any create."
            - "No bookings exist on the scope at the start of the trigger chain; the clock stays at its default 2026-08-01T00:00:00Z while every candidate interval sits on 2026-08-03."
            - "Every candidate is DIAGNOSTIC_ENDOSCOPY / IN_OFFICE_SUITE on that one scope with physician_user_id u_ent_1, so the only variable between calls is the interval."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Overlap Health", plan_code: "OVL-2999", requires_prior_auth: true }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10151", full_name: "Interval Patient", date_of_birth: "1966-07-03" }
              as: PracticeAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /endoscopes"
              payload: { serial_number: "SC-0005", model: "ENF-V4 rhinolaryngoscope" }
              as: PracticeAdmin
              captures: { scope_id: $.data.id }
          trigger:
            - call: "POST /procedure-bookings"
              payload: { patient_id: "${pat_id}", procedure_type: "DIAGNOSTIC_ENDOSCOPY", venue: "IN_OFFICE_SUITE", start_at: "2026-08-03T09:00:00Z", end_at: "2026-08-03T10:00:00Z", physician_user_id: "u_ent_1", endoscope_asset_id: "${scope_id}" }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { b1: $.data.id }
            - call: "POST /procedure-bookings"
              payload: { patient_id: "${pat_id}", procedure_type: "DIAGNOSTIC_ENDOSCOPY", venue: "IN_OFFICE_SUITE", start_at: "2026-08-03T10:00:00Z", end_at: "2026-08-03T11:00:00Z", physician_user_id: "u_ent_1", endoscope_asset_id: "${scope_id}" }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
            - call: "POST /procedure-bookings"
              payload: { patient_id: "${pat_id}", procedure_type: "DIAGNOSTIC_ENDOSCOPY", venue: "IN_OFFICE_SUITE", start_at: "2026-08-03T10:30:00Z", end_at: "2026-08-03T11:30:00Z", physician_user_id: "u_ent_1", endoscope_asset_id: "${scope_id}" }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
            - call: "POST /procedure-bookings"
              payload: { patient_id: "${pat_id}", procedure_type: "DIAGNOSTIC_ENDOSCOPY", venue: "IN_OFFICE_SUITE", start_at: "2026-08-03T10:45:00Z", end_at: "2026-08-03T11:45:00Z", physician_user_id: "u_ent_1", endoscope_asset_id: "${scope_id}" }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { b4: $.data.id }
            - call: "POST /procedure-bookings"
              payload: { patient_id: "${pat_id}", procedure_type: "DIAGNOSTIC_ENDOSCOPY", venue: "IN_OFFICE_SUITE", start_at: "2026-08-03T08:00:00Z", end_at: "2026-08-03T08:30:00Z", physician_user_id: "u_ent_1", endoscope_asset_id: "${scope_id}" }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
            - call: "POST /procedure-bookings"
