        grounds:
          - concurrency_rules[change-order-create-stale-project]
        distinguishing_aspect: "OCC rule change-order-create-stale-project: after CO1 bumps Project.version to 2, a second CO create carrying the pre-CO1 version is rejected 412 and the supersede side effect does NOT fire."
        test_recipe:
          setup: ["Project P (version 1); owner O; condition C OPEN"]
          setup_api_calls:
            - call: "POST /site-utility/projects"
              payload: { name: "P-OCC2", contract_ref: "C-801", soil_class_default: SOIL_B, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /site-utility/utility-owners"
              payload: { name: "City Water", owner_type: WATER, min_notice_hours: 48, max_shutdown_hours: 8 }
