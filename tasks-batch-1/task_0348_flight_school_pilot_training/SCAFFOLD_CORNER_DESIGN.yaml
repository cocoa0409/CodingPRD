# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across the claim-extraction-guide sections, walking
# SCAFFOLD.yaml §1.1–§1.7. Corners already covered by a §1.8 instance are
# emitted as excluded_because stubs citing the difficulty instance by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_student_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Student.fields.full_name, entities.Student.fields.deposit_balance_cents]
        distinguishing_aspect: "POST /students with full_name+email returns 201; deposit_balance_cents=0, deposit_held_cents=0, no_show_strikes=0, status=ACTIVE, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /flight-school/students"
              payload: { full_name: "New Student", email: "new@x.com" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Student.${stu_id}.deposit_balance_cents == 0 and deposit_held_cents == 0 and deposit_consumed_cents == 0"
            - "Student.${stu_id}.no_show_strikes == 0 and status == ACTIVE and version == 1"

      - name: create_aircraft_missing_billing_basis_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Aircraft.fields.billing_basis, "validations[priority=4]"]
        distinguishing_aspect: "POST /aircraft omitting required billing_basis -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /flight-school/aircraft"
              payload: { tail_number: "NBAD", model: "C172", rental_rate_cents_per_hour: 15000, initial_hobbs: 10.0, initial_tach: 8.0 }
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_aircraft_invalid_billing_basis_enum
        claim_type: Type Constraints
        grounds: [entities.Aircraft.fields.billing_basis]
        distinguishing_aspect: "billing_basis must be in {HOBBS,TACH}; value WALLCLOCK -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /flight-school/aircraft"
              payload: { tail_number: "NENM", model: "C172", rental_rate_cents_per_hour: 15000, billing_basis: "WALLCLOCK", initial_hobbs: 10.0, initial_tach: 8.0 }
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: aircraft_default_is_complex_false
        claim_type: Defaults
        grounds: [entities.Aircraft.fields.is_complex]
        distinguishing_aspect: "Omitting is_complex applies default false; booking_cost_estimate then applies 0% surcharge."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /flight-school/aircraft"
              payload: { tail_number: "NDFL", model: "C152", rental_rate_cents_per_hour: 15000, billing_basis: "HOBBS", initial_hobbs: 0.0, initial_tach: 0.0 }
              as: SchoolAdmin
              captures: { ac_id: $.data.id }
          assert:
            - "Aircraft.${ac_id}.is_complex == false"
            - "Aircraft.${ac_id}.status == AVAILABLE and current_hobbs == 0.0"

      - name: get_student_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [endpoints, "validations[priority=3]"]
        distinguishing_aspect: "GET /students/{random-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /flight-school/students/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: list_students_pagination_envelope
        claim_type: Listing
        grounds: [endpoints]
        distinguishing_aspect: "GET /students returns array envelope with pagination fields limit, offset, total_count, has_more."
        test_recipe:
          setup: ["One student exists."]
          setup_api_calls:
            - call: "POST /flight-school/students"
              payload: { full_name: "Lister One", email: "l1@x.com" }
              as: SchoolAdmin
          trigger:
            - call: "GET /flight-school/students"
              payload: {}
              as: SchoolAdmin
          assert:
            - "HTTP 200, response_type == array"
            - "meta has limit, offset, total_count, has_more; total_count >= 1"

      - name: syllabus_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Syllabus]
        distinguishing_aspect: "Syllabus has common_fields:false; response carries id+created_at only, no version/updated_at and no update endpoint exists."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /flight-school/syllabi"
              payload: { name: "INSTRUMENT", required_dual_hours: 40, required_solo_hours: 0, stage_count: 2, min_deposit_cents: 30000 }
              as: SchoolAdmin
              captures: { syl_id: $.data.id }
          assert:
            - "HTTP 201; Syllabus.${syl_id} has id and created_at"
            - "No PUT/PATCH endpoint for syllabi exists in §1.5"

      - name: flat_topology_fk_enrollment_bad_student_not_found
        claim_type: Parent Relationships
        grounds: [entities.Enrollment.fields.student_id, "validations[priority=3]"]
        distinguishing_aspect: "Flat topology FK integrity: POST /enrollments with non-existent student_id -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["A syllabus exists; no student with the bogus id."]
          setup_api_calls:
            - call: "POST /flight-school/syllabi"
              payload: { name: "PRIVATE_PILOT", required_dual_hours: 40, required_solo_hours: 10, stage_count: 3, min_deposit_cents: 50000 }
              as: SchoolAdmin
              captures: { syl_id: $.data.id }
          trigger:
            - call: "POST /flight-school/enrollments"
              payload: { student_id: "00000000-0000-4000-8000-000000000001", syllabus_id: "${syl_id}" }
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: computed_estimated_cost_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Booking.fields.estimated_cost_cents, calculations.booking_cost_estimate]
        distinguishing_aspect: "estimated_cost_cents is computed; estimated_cost_cents is not an input field, so the server computes it from booking_cost_estimate regardless of client intent."
        test_recipe:
          setup: ["ACTIVE enrollment; noncomplex aircraft 15000c/hr; DUAL instructor 6000c/hr; deposit 100000c."]
          setup_api_calls:
            - call: "POST /flight-school/students"
              payload: { full_name: "Cy Computed", email: "cyc@x.com" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /flight-school/students/${stu_id}/deposits"
              payload: { amount_cents: 100000 }
              as: SchoolAdmin
            - call: "POST /flight-school/syllabi"
              payload: { name: "PRIVATE_PILOT", required_dual_hours: 40, required_solo_hours: 10, stage_count: 3, min_deposit_cents: 50000 }
              as: SchoolAdmin
              captures: { syl_id: $.data.id }
            - call: "POST /flight-school/instructors"
              payload: { full_name: "Iris CFI", email: "irisc@x.com", cfi_rate_cents_per_hour: 6000, authorized_endorsement_codes: ["SOLO"] }
              as: SchoolAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /flight-school/aircraft"
              payload: { tail_number: "NCMP", model: "C172", rental_rate_cents_per_hour: 15000, billing_basis: "HOBBS", initial_hobbs: 100.0, initial_tach: 200.0 }
              as: SchoolAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /flight-school/enrollments"
              payload: { student_id: "${stu_id}", syllabus_id: "${syl_id}" }
              as: SchoolAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /flight-school/enrollments/${enr_id}/clearance"
              payload: { clearance_type: "MEDICAL", decision: "CLEARED", medical_expiry_date: "2027-06-14T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /flight-school/enrollments/${enr_id}/clearance"
              payload: { clearance_type: "TSA", decision: "CLEARED" }
              as: SchoolAdmin
            - call: "POST /flight-school/enrollments/${enr_id}/activate"
              payload: {}
              as: SchoolAdmin
          trigger:
            - call: "GET /flight-school/aircraft/${ac_id}"
              payload: {}
              as: Dispatcher
              captures: { acv_ac_id_1: $.data.version }
            - call: "POST /flight-school/bookings"
              payload: { enrollment_id: "${enr_id}", aircraft_id: "${ac_id}", instructor_id: "${instr_id}", lesson_type: "DUAL", start_at: "2026-07-01T14:00:00.000Z", end_at: "2026-07-01T16:00:00.000Z", estimated_hours: 2.0, expected_aircraft_version: "${acv_ac_id_1}" }
              as: Dispatcher
              captures: { bk_id: $.data.id }
          assert:
            - "Booking.${bk_id}.estimated_cost_cents == 42000 (computed, not client-supplied)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_already_confirmed_booking_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Booking.REQUESTED_to_CONFIRMED, "errors[ERR_BOOKING_NOT_REQUESTED]"]
        distinguishing_aspect: "Confirming a booking already CONFIRMED -> ERR_BOOKING_NOT_REQUESTED (409); no second hold placed."
        test_recipe:
          setup: ["A CONFIRMED booking (estimate 42000c held)."]
          setup_api_calls:
            - call: "POST /flight-school/students"
              payload: { full_name: "Ida Idem", email: "ida@x.com" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /flight-school/students/${stu_id}/deposits"
              payload: { amount_cents: 100000 }
              as: SchoolAdmin
            - call: "POST /flight-school/syllabi"
              payload: { name: "PRIVATE_PILOT", required_dual_hours: 40, required_solo_hours: 10, stage_count: 3, min_deposit_cents: 50000 }
              as: SchoolAdmin
              captures: { syl_id: $.data.id }
            - call: "POST /flight-school/instructors"
              payload: { full_name: "Iris CFI", email: "irisd@x.com", cfi_rate_cents_per_hour: 6000, authorized_endorsement_codes: ["SOLO"] }
              as: SchoolAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /flight-school/aircraft"
              payload: { tail_number: "NIDM", model: "C172", rental_rate_cents_per_hour: 15000, billing_basis: "HOBBS", initial_hobbs: 100.0, initial_tach: 200.0 }
              as: SchoolAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /flight-school/enrollments"
              payload: { student_id: "${stu_id}", syllabus_id: "${syl_id}" }
              as: SchoolAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /flight-school/enrollments/${enr_id}/clearance"
              payload: { clearance_type: "MEDICAL", decision: "CLEARED", medical_expiry_date: "2027-06-14T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /flight-school/enrollments/${enr_id}/clearance"
              payload: { clearance_type: "TSA", decision: "CLEARED" }
              as: SchoolAdmin
            - call: "POST /flight-school/enrollments/${enr_id}/activate"
              payload: {}
              as: SchoolAdmin
            - call: "GET /flight-school/aircraft/${ac_id}"
              payload: {}
              as: Dispatcher
              captures: { acv_ac_id_2: $.data.version }
            - call: "POST /flight-school/bookings"
              payload: { enrollment_id: "${enr_id}", aircraft_id: "${ac_id}", instructor_id: "${instr_id}", lesson_type: "DUAL", start_at: "2026-07-01T14:00:00.000Z", end_at: "2026-07-01T16:00:00.000Z", estimated_hours: 2.0, expected_aircraft_version: "${acv_ac_id_2}" }
              as: Dispatcher
              captures: { bk_id: $.data.id }
            - call: "POST /flight-school/bookings/${bk_id}/confirm"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /flight-school/bookings/${bk_id}/confirm"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 data.error_id == ERR_BOOKING_NOT_REQUESTED"
            - "Student.${stu_id}.deposit_held_cents == 42000 (no double hold)"

      - name: dispatch_solo_without_endorsement_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Booking.CONFIRMED_to_DISPATCHED, "errors[ERR_SOLO_ENDORSEMENT_MISSING]"]
        distinguishing_aspect: "Dispatching a SOLO booking with no VALID SOLO endorsement for the enrollment -> ERR_SOLO_ENDORSEMENT_MISSING (409)."
        test_recipe:
          setup: ["ACTIVE enrollment with NO solo endorsement; a CONFIRMED SOLO booking."]
          setup_api_calls:
            - call: "POST /flight-school/students"
              payload: { full_name: "Sol Solo", email: "sol@x.com" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /flight-school/students/${stu_id}/deposits"
              payload: { amount_cents: 100000 }
              as: SchoolAdmin
            - call: "POST /flight-school/syllabi"
              payload: { name: "PRIVATE_PILOT", required_dual_hours: 40, required_solo_hours: 10, stage_count: 3, min_deposit_cents: 50000 }
              as: SchoolAdmin
              captures: { syl_id: $.data.id }
            - call: "POST /flight-school/aircraft"
              payload: { tail_number: "NSOLO", model: "C152", rental_rate_cents_per_hour: 15000, billing_basis: "HOBBS", initial_hobbs: 100.0, initial_tach: 200.0 }
              as: SchoolAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /flight-school/enrollments"
              payload: { student_id: "${stu_id}", syllabus_id: "${syl_id}" }
              as: SchoolAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /flight-school/enrollments/${enr_id}/clearance"
              payload: { clearance_type: "MEDICAL", decision: "CLEARED", medical_expiry_date: "2027-06-14T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /flight-school/enrollments/${enr_id}/clearance"
              payload: { clearance_type: "TSA", decision: "CLEARED" }
              as: SchoolAdmin
            - call: "POST /flight-school/enrollments/${enr_id}/activate"
              payload: {}
              as: SchoolAdmin
            - call: "GET /flight-school/aircraft/${ac_id}"
              payload: {}
              as: Dispatcher
              captures: { acv_ac_id_3: $.data.version }
            - call: "POST /flight-school/bookings"
              payload: { enrollment_id: "${enr_id}", aircraft_id: "${ac_id}", lesson_type: "SOLO", start_at: "2026-07-01T14:00:00.000Z", end_at: "2026-07-01T16:00:00.000Z", estimated_hours: 1.5, expected_aircraft_version: "${acv_ac_id_3}" }
              as: Dispatcher
              captures: { bk_id: $.data.id }
            - call: "POST /flight-school/bookings/${bk_id}/confirm"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /flight-school/bookings/${bk_id}/dispatch"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 data.error_id == ERR_SOLO_ENDORSEMENT_MISSING"
            - "Booking.${bk_id}.status == CONFIRMED (unchanged)"

      - name: enrollment_activate_blocked_until_both_clearances
        claim_type: Precondition Enforcement
        grounds: [state_machines.Enrollment.PENDING_CLEARANCE_to_ACTIVE, "errors[ERR_TSA_NOT_CLEARED]"]
        distinguishing_aspect: "Parallel clearance axes: medical CLEARED but TSA still PENDING -> activate fails ERR_TSA_NOT_CLEARED (409)."
        test_recipe:
          setup: ["Enrollment with medical CLEARED, tsa PENDING, deposit above minimum."]
          setup_api_calls:
            - call: "POST /flight-school/students"
              payload: { full_name: "Tess TSA", email: "tess@x.com" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /flight-school/students/${stu_id}/deposits"
              payload: { amount_cents: 60000 }
              as: SchoolAdmin
            - call: "POST /flight-school/syllabi"
              payload: { name: "PRIVATE_PILOT", required_dual_hours: 40, required_solo_hours: 10, stage_count: 3, min_deposit_cents: 50000 }
              as: SchoolAdmin
              captures: { syl_id: $.data.id }
            - call: "POST /flight-school/enrollments"
              payload: { student_id: "${stu_id}", syllabus_id: "${syl_id}" }
              as: SchoolAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /flight-school/enrollments/${enr_id}/clearance"
              payload: { clearance_type: "MEDICAL", decision: "CLEARED", medical_expiry_date: "2027-06-14T00:00:00.000Z" }
              as: SchoolAdmin
          trigger:
            - call: "POST /flight-school/enrollments/${enr_id}/activate"
              payload: {}
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 data.error_id == ERR_TSA_NOT_CLEARED"
            - "Enrollment.${enr_id}.status == PENDING_CLEARANCE and medical_status == CLEARED and tsa_status == PENDING"

      - name: stage_check_begin_out_of_order_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.StageCheck.SCHEDULED_to_IN_PROGRESS, "errors[ERR_STAGE_OUT_OF_ORDER]"]
        distinguishing_aspect: "Beginning a stage check whose stage_index (2) != enrollment.current_stage_index (1) -> ERR_STAGE_OUT_OF_ORDER (409)."
        test_recipe:
          setup: ["ACTIVE enrollment current_stage_index=1; a SCHEDULED stage check at stage_index=2."]
          setup_api_calls:
            - call: "POST /flight-school/students"
              payload: { full_name: "Ola Order", email: "ola@x.com" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /flight-school/students/${stu_id}/deposits"
              payload: { amount_cents: 60000 }
              as: SchoolAdmin
            - call: "POST /flight-school/syllabi"
              payload: { name: "PRIVATE_PILOT", required_dual_hours: 40, required_solo_hours: 10, stage_count: 3, min_deposit_cents: 50000 }
              as: SchoolAdmin
              captures: { syl_id: $.data.id }
            - call: "POST /flight-school/instructors"
              payload: { full_name: "Ed Examiner", email: "ed2@x.com", cfi_rate_cents_per_hour: 6000, authorized_endorsement_codes: ["SOLO"] }
              as: SchoolAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /flight-school/enrollments"
              payload: { student_id: "${stu_id}", syllabus_id: "${syl_id}" }
              as: SchoolAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /flight-school/enrollments/${enr_id}/clearance"
              payload: { clearance_type: "MEDICAL", decision: "CLEARED", medical_expiry_date: "2027-06-14T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /flight-school/enrollments/${enr_id}/clearance"
              payload: { clearance_type: "TSA", decision: "CLEARED" }
              as: SchoolAdmin
            - call: "POST /flight-school/enrollments/${enr_id}/activate"
              payload: {}
              as: SchoolAdmin
            - call: "POST /flight-school/stage-checks"
              payload: { enrollment_id: "${enr_id}", examiner_instructor_id: "${instr_id}", stage_index: 2 }
              as: SchoolAdmin
              captures: { sc_id: $.data.id }
          trigger:
            - call: "POST /flight-school/stage-checks/${sc_id}/begin"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 data.error_id == ERR_STAGE_OUT_OF_ORDER"

      - name: terminal_passed_stage_check_cannot_fail
        claim_type: Terminal State Lockdown
        grounds: [state_machines.StageCheck.IN_PROGRESS_to_PASSED, "errors[ERR_STAGE_CHECK_NOT_IN_PROGRESS]"]
        distinguishing_aspect: "A PASSED stage check is terminal; failing it -> ERR_STAGE_CHECK_NOT_IN_PROGRESS (409)."
        test_recipe:
          setup: ["A PASSED stage check at stage 1."]
          setup_api_calls:
            - call: "POST /flight-school/students"
              payload: { full_name: "Per Pass", email: "per@x.com" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /flight-school/students/${stu_id}/deposits"
              payload: { amount_cents: 60000 }
              as: SchoolAdmin
            - call: "POST /flight-school/syllabi"
              payload: { name: "PRIVATE_PILOT", required_dual_hours: 40, required_solo_hours: 10, stage_count: 3, min_deposit_cents: 50000 }
              as: SchoolAdmin
              captures: { syl_id: $.data.id }
            - call: "POST /flight-school/instructors"
              payload: { full_name: "Ed Examiner", email: "ed3@x.com", cfi_rate_cents_per_hour: 6000, authorized_endorsement_codes: ["SOLO"] }
              as: SchoolAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /flight-school/enrollments"
              payload: { student_id: "${stu_id}", syllabus_id: "${syl_id}" }
              as: SchoolAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /flight-school/enrollments/${enr_id}/clearance"
              payload: { clearance_type: "MEDICAL", decision: "CLEARED", medical_expiry_date: "2027-06-14T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /flight-school/enrollments/${enr_id}/clearance"
              payload: { clearance_type: "TSA", decision: "CLEARED" }
              as: SchoolAdmin
            - call: "POST /flight-school/enrollments/${enr_id}/activate"
              payload: {}
              as: SchoolAdmin
            - call: "POST /flight-school/stage-checks"
              payload: { enrollment_id: "${enr_id}", examiner_instructor_id: "${instr_id}", stage_index: 1 }
              as: SchoolAdmin
              captures: { sc_id: $.data.id }
            - call: "POST /flight-school/stage-checks/${sc_id}/begin"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /flight-school/stage-checks/${sc_id}/pass"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
          trigger:
            - call: "POST /flight-school/stage-checks/${sc_id}/fail"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 data.error_id == ERR_STAGE_CHECK_NOT_IN_PROGRESS"
            - "StageCheck.${sc_id}.status == PASSED and Enrollment.${enr_id}.current_stage_index == 2"

      - name: squawk_defer_grounding_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Squawk.OPEN_to_DEFERRED, "errors[ERR_GROUNDING_SQUAWK_NOT_DEFERRABLE]"]
        distinguishing_aspect: "A grounding squawk cannot be deferred -> ERR_GROUNDING_SQUAWK_NOT_DEFERRABLE (409); aircraft stays GROUNDED."
        test_recipe:
          setup: ["An aircraft with an OPEN grounding squawk."]
          setup_api_calls:
            - call: "POST /flight-school/aircraft"
              payload: { tail_number: "NDFR", model: "C172", rental_rate_cents_per_hour: 15000, billing_basis: "HOBBS", initial_hobbs: 10.0, initial_tach: 8.0 }
