# =============================================================================
# Task 1946 — Hog Contract Finishing & Pig Flow (contract finisher operations)
# Structured seed tables: §1.0–§1.7
# =============================================================================

scenario: |
  1946. Hog Contract Finishing & Pig Flow (Smithfield contract finisher): pig placement
  schedule & barn space matching, feed budget & phase-diet delivery, mortality/cull
  reporting & performance measures, close-out settlement & performance bonus, biosecurity
  & transport washing protocol, market timing & packer delivery slot, manure management
  plan & land application, barn maintenance & owner/contractor responsibility split

domain_name: hog-contract-finishing
api_prefix: /

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # barn space, slot head-capacity, feed/nutrient/lagoon budgets
  secondary_archetype: compliance_audit      # biosecurity wash protocol, manure plan regulation, SoD on money
  complexity_layers:
    - optimistic_concurrency                 # OCC on Barn.version (placement) and PackerSlot.version (load booking)
    - cascading_side_effects                 # load-delivery -> group close -> settlement -> grower ledger
    - dual_variant_calculation               # settlement provisional-vs-final; feed hard-cap vs phase-plan
    - rate_threshold_triggers                # FCR tiers, mortality gate, slot FULL, SHORTED variance
  entity_topology: flat                      # peer entities linked by FK references; no URL nesting except event sub-resource
  state_machine_shape: branching             # fork/join, revert loops (wash reject, dispute cycle, plan revise), parallel dims on PigGroup
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties          # quote!=approve, approve!=pay, record!=verify, submit!=approve
  consistency_model: immediate               # every mutation + cascade is atomic within its request

# =============================================================================
# §1.1 Entity-Relationship Table (15 entities)
# =============================================================================
entities:
  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Site display name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code" }
      - { name: county, type: string, source: input, description: "County name" }
      - { name: site_status, type: enum, source: system, description: "ACTIVE | SUSPENDED | DECOMMISSIONED", default: ACTIVE }
      - { name: total_capacity_head, type: integer, source: computed, description: "Sum of capacity_head over barns with barn_status != OUT_OF_SERVICE" }

  - name: Grower
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Grower legal name" }
      - { name: grower_code, type: string, source: input, description: "Unique grower code", constraints: "unique across Grower" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: grower_status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED", default: ACTIVE }
      - { name: balance_due_cents, type: integer, source: computed, description: "Amount grower owes integrator (post-settlement negligence charges)", default: 0 }
      - { name: lifetime_paid_cents, type: integer, source: computed, description: "Sum of total_pay_cents over settlements that reached PAID", default: 0 }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: input, description: "FK -> Grower.id; contracting grower" }
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; finishing site covered" }
      - { name: base_pay_cents_per_head, type: integer, source: input, description: "Base pay per head placed, cents" }
      - { name: bonus_cap_cents_per_head, type: integer, source: input, description: "Max performance bonus per head placed, cents" }
      - { name: fcr_target, type: number, source: input, description: "Feed-conversion target (2 decimals), e.g. 2.60" }
      - { name: adg_target_lbs, type: number, source: input, description: "Average-daily-gain target lbs/day, e.g. 1.90" }
      - { name: mortality_threshold_pct, type: number, source: input, description: "Mortality percent gate; bonus zeroed when mortality_pct strictly greater" }
      - { name: feed_budget_lbs_per_head, type: integer, source: input, description: "Feed budget lbs per head placed" }
      - { name: structural_owner_pct, type: integer, source: input, description: "Owner share pct for STRUCTURAL tickets", default: 100, constraints: "0..100" }
      - { name: equipment_owner_pct, type: integer, source: input, description: "Owner share pct for EQUIPMENT tickets", default: 50, constraints: "0..100" }
      - { name: routine_owner_pct, type: integer, source: input, description: "Owner share pct for ROUTINE and EMERGENCY tickets", default: 0, constraints: "0..100" }
      - { name: effective_date, type: string, source: input, description: "ISO date; activation allowed on/after" }
      - { name: expiry_date, type: string, source: input, description: "ISO date; activation requires clock <= this; expire allowed after" }
      - { name: contract_status, type: enum, source: system, description: "DRAFT | ACTIVE | TERMINATED | EXPIRED", default: DRAFT }

  - name: Barn
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; barn's site" }
      - { name: barn_code, type: string, source: input, description: "Barn code unique within site", constraints: "unique per site_id" }
      - { name: capacity_head, type: integer, source: input, description: "Maximum head capacity" }
      - { name: floor_space_sqft, type: integer, source: input, description: "Usable floor square footage" }
      - { name: barn_status, type: enum, source: system, description: "AVAILABLE | OCCUPIED | WASH_REQUIRED | WASHING | DOWNTIME | OUT_OF_SERVICE", default: AVAILABLE }
      - { name: wash_required, type: boolean, source: system, description: "True once a group closed without a later verified wash; drives return-to-service target", default: false }
      - { name: downtime_until, type: datetime, source: system, description: "Earliest release instant set on wash verification; null otherwise" }
      - { name: current_group_id, type: string, source: system, description: "Group currently occupying (status PLACED or MARKETING); null otherwise" }

  - name: PigGroup
    parent: null
    common_fields: true
    fields:
      - { name: barn_id, type: string, source: input, description: "FK -> Barn.id; placement barn" }
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; governing contract" }
      - { name: placement_date, type: string, source: input, description: "ISO date pigs arrive" }
      - { name: target_market_date, type: string, source: input, description: "ISO date; end of occupancy interval, exclusive" }
      - { name: head_placed, type: integer, source: input, description: "Scheduled head; overwritten by actual_head_count at confirm" }
      - { name: avg_start_weight_lbs, type: number, source: input, description: "Avg start weight lbs (2 dp); overwritten at confirm if actual supplied" }
      - { name: group_status, type: enum, source: system, description: "SCHEDULED | PLACED | MARKETING | CLOSED | CANCELLED", default: SCHEDULED }
      - { name: current_phase, type: enum, source: system, description: "STARTER | GROWER | FINISHER_1 | FINISHER_2 (parallel dimension, independent of group_status)", default: STARTER }
      - { name: placed_at, type: datetime, source: system, description: "Clock instant of confirm-placement; null until PLACED" }
      - { name: closed_at, type: datetime, source: system, description: "Clock instant of close; null until CLOSED" }
      - { name: mortality_total, type: integer, source: computed, description: "Sum of mortality_count over all MortalityReport of this group", default: 0 }
      - { name: cull_total, type: integer, source: computed, description: "Sum of cull_count over all MortalityReport of this group", default: 0 }
      - { name: head_marketed, type: integer, source: computed, description: "Sum of head_count over loads DELIVERED", default: 0 }
      - { name: head_unaccounted, type: integer, source: system, description: "head_current at force close-out; 0 on natural close", default: 0 }
      - { name: head_current, type: integer, source: computed, description: "head_placed - mortality_total - cull_total - head_marketed (pre-close); 0 after close" }
      - { name: total_live_weight_lbs, type: integer, source: computed, description: "Sum of live_weight_lbs_total over loads DELIVERED", default: 0 }
      - { name: cumulative_feed_lbs, type: integer, source: computed, description: "Sum of delivered_lbs over feed orders in DELIVERED or SHORTED", default: 0 }
      - { name: mortality_pct, type: number, source: computed, description: "round_half_up(100*mortality_total/head_placed, 2)" }
      - { name: pending_deductions_cents, type: integer, source: computed, description: "Accrued reject penalties + negligence grower shares in occupancy window", default: 0 }

  - name: FeedOrder
    parent: null
    common_fields: true
    fields:
      - { name: group_id, type: string, source: input, description: "FK -> PigGroup.id" }
      - { name: phase, type: enum, source: input, description: "STARTER | GROWER | FINISHER_1 | FINISHER_2; must equal group.current_phase" }
      - { name: diet_code, type: string, source: input, description: "Mill diet code" }
      - { name: quantity_lbs, type: integer, source: input, description: "Ordered lbs", constraints: ">= 1" }
      - { name: requested_delivery_date, type: string, source: input, description: "ISO date requested" }
      - { name: scheduled_delivery_date, type: string, source: system, description: "ISO date set at schedule; null until SCHEDULED" }
      - { name: delivered_lbs, type: integer, source: system, description: "Actual delivered lbs set at delivery; null until DELIVERED/SHORTED" }
      - { name: over_phase_plan, type: boolean, source: computed, description: "quantity_lbs > phase-plan remaining for this phase at creation" }
      - { name: order_status, type: enum, source: system, description: "REQUESTED | SCHEDULED | DELIVERED | SHORTED | CANCELLED", default: REQUESTED }

  - name: MortalityReport
    parent: null
    common_fields: false
    fields:
      - { name: group_id, type: string, source: system, description: "FK -> PigGroup.id; from path" }
      - { name: report_date, type: string, source: input, description: "ISO date of losses; within [placement_date, clock date]" }
      - { name: mortality_count, type: integer, source: input, description: "Dead count >= 0" }
      - { name: cull_count, type: integer, source: input, description: "Culled count >= 0" }
      - { name: reason_code, type: enum, source: input, description: "DISEASE | INJURY | STRESS | OTHER" }

  - name: PackerSlot
    parent: null
    common_fields: true
    fields:
      - { name: plant_code, type: string, source: input, description: "Packer plant code" }
      - { name: slot_date, type: string, source: input, description: "ISO date of the slot" }
      - { name: shift, type: enum, source: input, description: "AM | PM" }
      - { name: capacity_head, type: integer, source: input, description: "Max head the plant takes in this slot", constraints: ">= 1" }
      - { name: min_weight_lbs, type: integer, source: input, description: "Min acceptable avg live weight" }
      - { name: max_weight_lbs, type: integer, source: input, description: "Max acceptable avg live weight", constraints: ">= min_weight_lbs" }
      - { name: reserved_head, type: integer, source: computed, description: "Sum of head_count over loads in SCHEDULED|DISPATCHED|DELIVERED|REJECTED_AT_PLANT", default: 0 }
      - { name: slot_status, type: enum, source: system, description: "OPEN | FULL | CLOSED", default: OPEN }

  - name: TruckWash
    parent: null
    common_fields: true
    fields:
      - { name: truck_code, type: string, source: input, description: "Truck/trailer code" }
      - { name: washed_at, type: datetime, source: input, description: "ISO instant wash completed" }
      - { name: wash_type, type: enum, source: input, description: "FULL_DISINFECT | WASH_ONLY" }
      - { name: recorded_by, type: string, source: system, description: "X-User-ID of recorder" }
      - { name: verified_by, type: string, source: system, description: "X-User-ID of verifier; null until VERIFIED" }
      - { name: wash_status, type: enum, source: system, description: "RECORDED | VERIFIED | REJECTED", default: RECORDED }

  - name: MarketLoad
    parent: null
    common_fields: true
    fields:
      - { name: group_id, type: string, source: input, description: "FK -> PigGroup.id" }
      - { name: slot_id, type: string, source: input, description: "FK -> PackerSlot.id" }
      - { name: head_count, type: integer, source: input, description: "Head shipped", constraints: ">= 1" }
      - { name: truck_wash_id, type: string, source: system, description: "FK -> TruckWash.id; set at dispatch" }
      - { name: live_weight_lbs_total, type: integer, source: system, description: "Scale total lbs set at delivery; null until delivered/rejected" }
      - { name: avg_weight_lbs, type: number, source: computed, description: "round_half_up(live_weight_lbs_total/head_count, 2); null until delivery" }
      - { name: load_status, type: enum, source: system, description: "SCHEDULED | DISPATCHED | DELIVERED | REJECTED_AT_PLANT | CANCELLED", default: SCHEDULED }

  - name: BarnWash
    parent: null
    common_fields: true
    fields:
      - { name: barn_id, type: string, source: input, description: "FK -> Barn.id" }
      - { name: wash_type, type: enum, source: input, description: "FULL_DISINFECT | WASH_ONLY" }
      - { name: completed_at, type: datetime, source: input, description: "ISO instant wash completed; <= clock" }
      - { name: recorded_by, type: string, source: system, description: "X-User-ID of recorder (Grower)" }
      - { name: verified_by, type: string, source: system, description: "X-User-ID of verifier; null until VERIFIED" }
      - { name: wash_status, type: enum, source: system, description: "RECORDED | VERIFIED | REJECTED", default: RECORDED }

  - name: ManurePlan
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: plan_year, type: integer, source: input, description: "Calendar year the plan governs" }
      - { name: lagoon_capacity_gal, type: integer, source: input, description: "Lagoon storage capacity gallons" }
      - { name: lagoon_start_gal, type: integer, source: input, description: "Gallons in lagoon at plan start; <= lagoon_capacity_gal" }
      - { name: n_budget_lbs, type: integer, source: input, description: "Annual nitrogen application budget lbs" }
      - { name: p_budget_lbs, type: integer, source: input, description: "Annual phosphorus application budget lbs" }
      - { name: submitted_by, type: string, source: system, description: "X-User-ID that submitted; null until SUBMITTED" }
      - { name: plan_status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | SUPERSEDED", default: DRAFT }
      - { name: n_applied_lbs, type: integer, source: computed, description: "Sum n_lbs over applications in RECORDED|CONFIRMED", default: 0 }
      - { name: p_applied_lbs, type: integer, source: computed, description: "Sum p_lbs over applications in RECORDED|CONFIRMED", default: 0 }
      - { name: lagoon_available_gal, type: integer, source: computed, description: "lagoon_start_gal - sum gallons over applications in RECORDED|CONFIRMED" }

  - name: ManureApplication
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> ManurePlan.id" }
      - { name: field_code, type: string, source: input, description: "Application field code" }
      - { name: applied_at, type: datetime, source: input, description: "ISO instant; within [plan_year-03-01, plan_year-11-30] and <= clock" }
      - { name: gallons, type: integer, source: input, description: "Gallons applied", constraints: ">= 1" }
      - { name: n_lbs, type: integer, source: input, description: "Nitrogen lbs per lab manifest", constraints: ">= 0" }
      - { name: p_lbs, type: integer, source: input, description: "Phosphorus lbs per lab manifest", constraints: ">= 0" }
      - { name: application_status, type: enum, source: system, description: "RECORDED | CONFIRMED | VOIDED", default: RECORDED }

  - name: MaintenanceTicket
    parent: null
    common_fields: true
    fields:
      - { name: barn_id, type: string, source: input, description: "FK -> Barn.id" }
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id; ACTIVE contract on barn's site at creation" }
      - { name: grower_id, type: string, source: system, description: "FK -> Grower.id; from that contract" }
      - { name: category, type: enum, source: input, description: "STRUCTURAL | EQUIPMENT | ROUTINE | EMERGENCY" }
      - { name: description, type: string, source: input, description: "Free-text problem description" }
      - { name: cause, type: enum, source: system, description: "WEAR | NEGLIGENCE | ACT_OF_NATURE; set at quote" }
      - { name: cost_cents, type: integer, source: system, description: "Quoted cost cents; set at quote", constraints: ">= 1" }
      - { name: quoted_by, type: string, source: system, description: "X-User-ID of quoting FieldTech" }
      - { name: approved_by, type: string, source: system, description: "X-User-ID of approver; null until approved" }
      - { name: approved_flag, type: boolean, source: system, description: "True once approval recorded (matters for EMERGENCY retro path)", default: false }
      - { name: owner_share_cents, type: integer, source: computed, description: "Computed at approval per maintenance_cost_split" }
      - { name: grower_share_cents, type: integer, source: computed, description: "cost_cents - owner_share_cents" }
      - { name: completed_at, type: datetime, source: system, description: "Clock instant of completion; null until COMPLETED" }
      - { name: ticket_status, type: enum, source: system, description: "OPEN | QUOTED | APPROVED | IN_PROGRESS | COMPLETED | REJECTED | CANCELLED", default: OPEN }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: group_id, type: string, source: system, description: "FK -> PigGroup.id; 1:1, minted when group CLOSED" }
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id; copied from group" }
      - { name: head_marketed, type: integer, source: computed, description: "Snapshot from group at close" }
      - { name: total_live_weight_lbs, type: integer, source: computed, description: "Snapshot from group at close" }
      - { name: days_on_feed, type: integer, source: computed, description: "(closed date - placement_date).days" }
      - { name: fcr, type: number, source: computed, description: "round_half_up(cumulative_feed_lbs / weight_gain_lbs, 2)" }
      - { name: adg_lbs, type: number, source: computed, description: "round_half_up(weight_gain_lbs / (head_marketed * days_on_feed), 2)" }
      - { name: mortality_pct, type: number, source: computed, description: "Snapshot of group.mortality_pct at close" }
      - { name: base_pay_cents, type: integer, source: computed, description: "head_placed * base_pay_cents_per_head" }
      - { name: bonus_cents, type: integer, source: computed, description: "performance_bonus result; 0 when gated" }
      - { name: deductions_cents, type: integer, source: computed, description: "group.pending_deductions_cents at close (+ later window postings while FINALIZED/DISPUTED)" }
      - { name: adjustment_cents, type: integer, source: input, description: "Signed adjustment set at refinalize", default: 0 }
      - { name: total_pay_cents, type: integer, source: computed, description: "base_pay_cents + bonus_cents + adjustment_cents - deductions_cents" }
      - { name: approved_by, type: string, source: system, description: "X-User-ID of approver; null until APPROVED" }
      - { name: paid_by, type: string, source: system, description: "X-User-ID of payer; null until PAID" }
      - { name: settlement_status, type: enum, source: system, description: "FINALIZED | DISPUTED | APPROVED | PAID", default: FINALIZED }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Site
    field: site_status
    initial_state: ACTIVE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /sites/{id}/suspend"
        actor: IntegratorAdmin
        preconditions: []
        side_effects: ["New contract activation and new pig-group creation on this site become blocked"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /sites/{id}/reinstate"
        actor: IntegratorAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "POST /sites/{id}/decommission"
        actor: IntegratorAdmin
        preconditions:
          - "No Contract with contract_id.site_id == this site in ACTIVE"
          - "No PigGroup on barns of this site in SCHEDULED, PLACED, or MARKETING"
        side_effects: []

  - entity: Grower
    field: grower_status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /growers/{id}/suspend"
        actor: IntegratorAdmin
        preconditions: []
        side_effects: ["Contract activation for this grower blocked"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /growers/{id}/reinstate"
        actor: IntegratorAdmin
        preconditions: []
        side_effects: []
      - from: [ACTIVE, SUSPENDED]
        to: TERMINATED
        trigger: "POST /growers/{id}/terminate"
        actor: IntegratorAdmin
        preconditions:
          - "No Contract for this grower in ACTIVE"
        side_effects: []

  - entity: Contract
    field: contract_status
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /contracts/{id}/activate"
        actor: IntegratorAdmin
        preconditions:
          - "Grower.grower_status == ACTIVE (ERR_GROWER_NOT_ACTIVE)"
          - "Site.site_status == ACTIVE (ERR_SITE_NOT_ACTIVE)"
          - "effective_date <= clock date <= expiry_date (ERR_CONTRACT_NOT_YET_EFFECTIVE / ERR_CONTRACT_EXPIRED)"
          - "No other Contract with same site_id in ACTIVE (ERR_CONTRACT_SITE_OVERLAP)"
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /contracts/{id}/terminate"
        actor: IntegratorAdmin
        preconditions:
          - "No PigGroup with this contract_id in SCHEDULED, PLACED, or MARKETING (ERR_CONTRACT_HAS_ACTIVE_GROUPS)"
          - "No Settlement with this contract_id in FINALIZED, DISPUTED, or APPROVED (ERR_SETTLEMENTS_PENDING)"
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /contracts/{id}/expire"
        actor: IntegratorAdmin
        preconditions:
          - "clock date > expiry_date (ERR_CONTRACT_NOT_EXPIRED)"
          - "Same group/settlement preconditions as terminate"
        side_effects: []

  - entity: Barn
    field: barn_status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: OCCUPIED
        trigger: "system (POST /pig-groups/{id}/confirm-placement succeeds)"
        actor: system
        preconditions: ["barn_status == AVAILABLE"]
        side_effects:
          - "Barn.current_group_id := group.id"
          - "Barn.version incremented"
      - from: OCCUPIED
        to: WASH_REQUIRED
        trigger: "system (occupying PigGroup -> CLOSED)"
        actor: system
        preconditions: []
        side_effects:
          - "Barn.current_group_id := null; Barn.wash_required := true"
          - "Barn.version incremented"
      - from: WASH_REQUIRED
        to: WASHING
        trigger: "system (POST /barn-washes created for this barn)"
        actor: system
        preconditions: ["barn_status == WASH_REQUIRED"]
        side_effects: ["Barn.version incremented"]
      - from: WASHING
        to: DOWNTIME
        trigger: "system (POST /barn-washes/{id}/verify)"
        actor: system
        preconditions: ["wash_type == FULL_DISINFECT (ERR_WASH_TYPE_INSUFFICIENT)"]
        side_effects:
          - "Barn.downtime_until := wash.completed_at + 72h"
          - "Barn.version incremented"
      - from: WASHING
        to: WASH_REQUIRED
        trigger: "system (POST /barn-washes/{id}/reject)"
        actor: system
        preconditions: []
        side_effects: ["Barn.version incremented"]
      - from: DOWNTIME
        to: AVAILABLE
        trigger: "POST /barns/{id}/release"
        actor: IntegratorAdmin
        preconditions:
          - "clock >= Barn.downtime_until (ERR_BARN_DOWNTIME_ACTIVE)"
        side_effects:
          - "Barn.wash_required := false; Barn.downtime_until := null"
          - "Barn.version incremented"
      - from: [AVAILABLE, WASH_REQUIRED, WASHING, DOWNTIME]
        to: OUT_OF_SERVICE
        trigger: "POST /barns/{id}/mark-out-of-service"
        actor: IntegratorAdmin
        preconditions: ["barn_status != OCCUPIED (ERR_BARN_OCCUPIED)"]
        side_effects: ["Barn.version incremented"]
      - from: OUT_OF_SERVICE
        to: AVAILABLE
        trigger: "POST /barns/{id}/return-to-service"
        actor: IntegratorAdmin
        preconditions:
          - "No MaintenanceTicket for this barn in OPEN, QUOTED, APPROVED, or IN_PROGRESS (ERR_TICKETS_OPEN)"
          - "Barn.wash_required == false (otherwise target is WASH_REQUIRED per next transition)"
        side_effects: ["Barn.version incremented"]
      - from: OUT_OF_SERVICE
        to: WASH_REQUIRED
        trigger: "POST /barns/{id}/return-to-service"
        actor: IntegratorAdmin
        preconditions:
          - "No MaintenanceTicket for this barn in OPEN, QUOTED, APPROVED, or IN_PROGRESS"
          - "Barn.wash_required == true"
        side_effects: ["Barn.version incremented"]

  - entity: PigGroup
    field: group_status
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    note: "Parallel dimensions: group_status (lifecycle) x current_phase (feed phase) evolve independently."
    transitions:
      - from: SCHEDULED
        to: PLACED
        trigger: "POST /pig-groups/{id}/confirm-placement"
        actor: FieldTech
        preconditions:
          - "Barn.barn_status == AVAILABLE (ERR_BARN_NOT_PLACEABLE)"
          - "clock date >= placement_date (ERR_CONFIRM_TOO_EARLY)"
          - "Contract.contract_status == ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
          - "actual_head_count (if supplied) passes space checks (ERR_SPACE_HEAD_EXCEEDED / ERR_FLOOR_SPACE_EXCEEDED)"
        side_effects:
          - "head_placed := actual_head_count if supplied; avg_start_weight_lbs := actual_avg_weight_lbs if supplied"
          - "placed_at := clock; Barn -> OCCUPIED with current_group_id := this group"
      - from: PLACED
        to: MARKETING
        trigger: "system (first MarketLoad of this group -> DELIVERED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [PLACED, MARKETING]
        to: CLOSED
        trigger: "system (head_current reaches 0 after a mortality report or a load delivery) OR POST /pig-groups/{id}/close-out"
        actor: "system or FieldTech"
        preconditions:
          - "Auto path: head_current == 0 after applying the triggering event"
          - "Force path (close-out): group in PLACED or MARKETING; head_current >= 0"
        side_effects:
          - "Force path: head_unaccounted := head_current; head_current := 0"
          - "closed_at := clock; occupying Barn -> WASH_REQUIRED (wash_required := true, current_group_id := null)"
          - "Settlement created for this group in FINALIZED with all computed fields per calculations.settlement_pay (FINAL variant)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /pig-groups/{id}/cancel"
        actor: FieldTech
        preconditions: []
        side_effects: ["Barn untouched (group never occupied it)"]

  - entity: PigGroupPhase
    field: current_phase
    note: "Parallel state dimension physically stored on PigGroup; independent of group_status."
    initial_state: STARTER
    terminal_states: [FINISHER_2]
    transitions:
      - from: STARTER
        to: GROWER
        trigger: "POST /pig-groups/{id}/advance-phase"
        actor: FieldTech
        preconditions: ["group_status in {PLACED, MARKETING} (ERR_GROUP_NOT_ACTIVE)"]
        side_effects: ["All FeedOrder of this group with phase == STARTER in REQUESTED or SCHEDULED -> CANCELLED (feed-phase cascade)"]
      - from: GROWER
        to: FINISHER_1
        trigger: "POST /pig-groups/{id}/advance-phase"
        actor: FieldTech
        preconditions: ["group_status in {PLACED, MARKETING} (ERR_GROUP_NOT_ACTIVE)"]
        side_effects: ["All FeedOrder of this group with phase == GROWER in REQUESTED or SCHEDULED -> CANCELLED"]
      - from: FINISHER_1
        to: FINISHER_2
        trigger: "POST /pig-groups/{id}/advance-phase"
        actor: FieldTech
        preconditions: ["group_status in {PLACED, MARKETING} (ERR_GROUP_NOT_ACTIVE)"]
        side_effects: ["All FeedOrder of this group with phase == FINISHER_1 in REQUESTED or SCHEDULED -> CANCELLED"]

  - entity: FeedOrder
    field: order_status
    initial_state: REQUESTED
    terminal_states: [DELIVERED, SHORTED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /feed-orders/{id}/schedule"
        actor: FeedMill
        preconditions: ["scheduled_delivery_date >= clock date (ERR_FEED_DATE_PAST)"]
        side_effects: []
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /feed-orders/{id}/deliver"
        actor: FeedMill
        preconditions: ["delivered_lbs >= 0.80 * quantity_lbs (else SHORTED branch)"]
        side_effects: ["PigGroup.cumulative_feed_lbs += delivered_lbs"]
      - from: SCHEDULED
        to: SHORTED
        trigger: "POST /feed-orders/{id}/deliver"
        actor: FeedMill
        preconditions: ["delivered_lbs < 0.80 * quantity_lbs"]
        side_effects: ["PigGroup.cumulative_feed_lbs += delivered_lbs"]
      - from: [REQUESTED, SCHEDULED]
        to: CANCELLED
        trigger: "POST /feed-orders/{id}/cancel OR system (advance-phase cascade)"
        actor: "FieldTech or system"
        preconditions: []
        side_effects: ["Committed budget released (order leaves the committed set)"]

  - entity: PackerSlot
    field: slot_status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system (reserved_head == capacity_head after a load booking)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FULL
        to: OPEN
        trigger: "system (a load cancellation drops reserved_head below capacity_head)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [OPEN, FULL]
        to: CLOSED
        trigger: "POST /packer-slots/{id}/close"
        actor: IntegratorAdmin
        preconditions: ["No MarketLoad with this slot_id in SCHEDULED or DISPATCHED (ERR_SLOT_HAS_ACTIVE_LOADS)"]
        side_effects: []

  - entity: MarketLoad
    field: load_status
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, REJECTED_AT_PLANT, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /market-loads/{id}/dispatch"
        actor: TransportCoordinator
        preconditions:
          - "TruckWash.wash_status == VERIFIED (ERR_WASH_NOT_VERIFIED)"
          - "TruckWash.wash_type == FULL_DISINFECT (ERR_WASH_TYPE_INSUFFICIENT)"
          - "clock <= TruckWash.washed_at + 48h (ERR_WASH_STALE)"
          - "TruckWash not referenced by any other load in DISPATCHED, DELIVERED, or REJECTED_AT_PLANT (ERR_WASH_ALREADY_USED)"
          - "clock date <= PackerSlot.slot_date (ERR_SLOT_DATE_PAST)"
        side_effects: ["MarketLoad.truck_wash_id := wash id"]
      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /market-loads/{id}/deliver (avg weight inside slot window)"
        actor: TransportCoordinator
        preconditions:
          - "clock date >= PackerSlot.slot_date (ERR_DELIVERY_BEFORE_SLOT_DATE)"
          - "avg_weight_lbs within [slot.min_weight_lbs, slot.max_weight_lbs]"
        side_effects:
          - "PigGroup.head_marketed += head_count; total_live_weight_lbs += live_weight_lbs_total; head_current -= head_count"
          - "If group was PLACED -> MARKETING"
          - "If group.head_current == 0 -> group CLOSED (closed_at := clock), Barn -> WASH_REQUIRED, Settlement created FINALIZED"
      - from: DISPATCHED
        to: REJECTED_AT_PLANT
        trigger: "POST /market-loads/{id}/deliver (avg weight outside slot window)"
        actor: TransportCoordinator
        preconditions:
          - "clock date >= PackerSlot.slot_date"
          - "avg_weight_lbs outside [slot.min_weight_lbs, slot.max_weight_lbs]"
        side_effects:
          - "PigGroup.pending_deductions_cents += 1500 * head_count (reject penalty)"
          - "head_count NOT marketed; load still counts toward slot.reserved_head"
          - "If Settlement exists for group in FINALIZED or DISPUTED -> deductions_cents and total_pay_cents recomputed"
      - from: [SCHEDULED, DISPATCHED]
        to: CANCELLED
        trigger: "POST /market-loads/{id}/cancel"
        actor: FieldTech
        preconditions: []
        side_effects:
          - "PackerSlot.reserved_head recomputed (load leaves reserved set); FULL -> OPEN if now below capacity"
          - "PackerSlot.version incremented"
          - "If load was DISPATCHED, its TruckWash is freed for reuse"

  - entity: TruckWash
    field: wash_status
    initial_state: RECORDED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: RECORDED
        to: VERIFIED
        trigger: "POST /truck-washes/{id}/verify"
        actor: IntegratorAdmin
        preconditions: ["X-User-ID != recorded_by (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["verified_by := X-User-ID"]
      - from: RECORDED
        to: REJECTED
        trigger: "POST /truck-washes/{id}/reject"
        actor: IntegratorAdmin
        preconditions: ["X-User-ID != recorded_by (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: []

  - entity: BarnWash
    field: wash_status
    initial_state: RECORDED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: RECORDED
        to: VERIFIED
        trigger: "POST /barn-washes/{id}/verify"
        actor: IntegratorAdmin
        preconditions: ["X-User-ID != recorded_by (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["verified_by := X-User-ID; barn WASHING -> DOWNTIME with downtime_until := completed_at + 72h"]
      - from: RECORDED
        to: REJECTED
        trigger: "POST /barn-washes/{id}/reject"
        actor: IntegratorAdmin
        preconditions: ["X-User-ID != recorded_by (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["barn WASHING -> WASH_REQUIRED"]

  - entity: ManurePlan
    field: plan_status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    note: "Cyclic revision loop: SUBMITTED -> REJECTED -> DRAFT -> SUBMITTED is permitted."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /manure-plans/{id}/submit"
        actor: EnvironmentalManager
        preconditions: ["No other ManurePlan with same site_id and plan_year in SUBMITTED or APPROVED (ERR_PLAN_YEAR_OVERLAP)"]
        side_effects: ["submitted_by := X-User-ID"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /manure-plans/{id}/approve"
        actor: IntegratorAdmin
        preconditions: ["Site.site_status == ACTIVE (ERR_SITE_NOT_ACTIVE)"]
        side_effects: ["Every other ManurePlan with same site_id in APPROVED -> SUPERSEDED"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /manure-plans/{id}/reject"
        actor: IntegratorAdmin
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: DRAFT
        trigger: "POST /manure-plans/{id}/revise"
        actor: EnvironmentalManager
        preconditions: []
        side_effects: []

  - entity: ManureApplication
    field: application_status
    initial_state: RECORDED
    terminal_states: [CONFIRMED, VOIDED]
    transitions:
      - from: RECORDED
        to: CONFIRMED
        trigger: "POST /manure-applications/{id}/confirm"
        actor: EnvironmentalManager
        preconditions: []
        side_effects: []
      - from: [RECORDED, CONFIRMED]
        to: VOIDED
        trigger: "POST /manure-applications/{id}/void"
        actor: EnvironmentalManager
        preconditions: []
        side_effects: ["ManurePlan.n_applied_lbs -= n_lbs; p_applied_lbs -= p_lbs; lagoon_available_gal += gallons (compensating credit)"]

  - entity: MaintenanceTicket
    field: ticket_status
    initial_state: OPEN
    terminal_states: [COMPLETED, REJECTED, CANCELLED]
    transitions:
      - from: OPEN
        to: QUOTED
        trigger: "POST /maintenance-tickets/{id}/quote"
        actor: FieldTech
        preconditions: []
        side_effects: ["cost_cents, cause, quoted_by := inputs/header"]
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /maintenance-tickets/{id}/quote (EMERGENCY retro-quote)"
        actor: FieldTech
        preconditions: ["category == EMERGENCY (ERR_INVALID_STATE_TRANSITION otherwise)"]
        side_effects: ["cost_cents, cause, quoted_by := inputs/header"]
      - from: QUOTED
        to: APPROVED
        trigger: "POST /maintenance-tickets/{id}/approve"
        actor: "FieldTech (cost_cents < 50000) or IntegratorAdmin (any cost)"
        preconditions:
          - "cost_cents >= 50000 requires IntegratorAdmin (ERR_FORBIDDEN_ROLE)"
          - "X-User-ID != quoted_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["owner_share_cents / grower_share_cents computed per maintenance_cost_split; approved_by := X-User-ID; approved_flag := true"]
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /maintenance-tickets/{id}/approve (EMERGENCY retro-approval)"
        actor: "FieldTech (cost_cents < 50000) or IntegratorAdmin (any cost)"
        preconditions:
          - "category == EMERGENCY"
          - "cost_cents >= 50000 requires IntegratorAdmin (ERR_FORBIDDEN_ROLE)"
          - "X-User-ID != quoted_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["shares computed; approved_by := X-User-ID; approved_flag := true"]
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /maintenance-tickets/{id}/start-work"
        actor: FieldTech
        preconditions: []
        side_effects: []
      - from: QUOTED
        to: IN_PROGRESS
        trigger: "POST /maintenance-tickets/{id}/start-work (EMERGENCY fix-first)"
        actor: FieldTech
        preconditions: ["category == EMERGENCY (ERR_INVALID_STATE_TRANSITION otherwise)"]
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /maintenance-tickets/{id}/complete"
        actor: FieldTech
        preconditions: ["approved_flag == true (ERR_TICKET_UNAPPROVED)"]
        side_effects:
          - "completed_at := clock"
          - "If cause == NEGLIGENCE: charge grower_share_cents — to PigGroup.pending_deductions_cents of the group whose [placement_date, closed_at] contains clock on this barn (and recompute that group's Settlement deductions_cents/total_pay_cents when it is FINALIZED or DISPUTED); to Grower.balance_due_cents when no such group or its Settlement is APPROVED/PAID"
      - from: QUOTED
        to: REJECTED
        trigger: "POST /maintenance-tickets/{id}/reject"
        actor: FieldTech
        preconditions: []
        side_effects: []
      - from: [OPEN, QUOTED]
        to: CANCELLED
        trigger: "POST /maintenance-tickets/{id}/cancel"
        actor: Grower
        preconditions: ["ticket.grower_id == X-User-ID (ERR_NOT_RESOURCE_OWNER)"]
        side_effects: []

  - entity: Settlement
    field: settlement_status
    initial_state: FINALIZED
    terminal_states: [PAID]
    note: "Dispute cycle FINALIZED -> DISPUTED -> FINALIZED permitted any number of rounds."
    transitions:
      - from: FINALIZED
        to: DISPUTED
        trigger: "POST /settlements/{id}/dispute"
        actor: Grower
        preconditions: ["Contract of this settlement has grower_id == X-User-ID (ERR_NOT_RESOURCE_OWNER)"]
        side_effects: []
      - from: DISPUTED
        to: FINALIZED
        trigger: "POST /settlements/{id}/refinalize"
        actor: FieldTech
        preconditions: []
        side_effects: ["adjustment_cents := input; total_pay_cents recomputed"]
      - from: FINALIZED
        to: APPROVED
        trigger: "POST /settlements/{id}/approve"
        actor: IntegratorAdmin
        preconditions: []
        side_effects: ["approved_by := X-User-ID"]
      - from: APPROVED
        to: PAID
        trigger: "POST /settlements/{id}/pay"
        actor: IntegratorAdmin
        preconditions: ["X-User-ID != approved_by (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["paid_by := X-User-ID; Grower.lifetime_paid_cents += total_pay_cents"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: pig-group-create-stale-barn
    parent_entity: Barn
    write_endpoint: "POST /pig-groups"
    occ_field: "expected_barn_version"
    description: |
      Creating a PigGroup against a Barn whose version has advanced since the
      client last observed it is rejected. The client's space/overlap decision
      was computed from a superseded view of the barn's booking book (another
      writer may have scheduled a group or changed barn state in between), so
      the write is refused with a stale-version error.
    error_id: ERR_STALE_BARN_VERSION
    http_status: 412
  - rule_id: market-load-create-stale-slot
    parent_entity: PackerSlot
    write_endpoint: "POST /market-loads"
    occ_field: "expected_slot_version"
    description: |
      Creating a MarketLoad against a PackerSlot whose version has advanced
      since the client last observed it is rejected. The client's head-capacity
      decision was computed from a superseded view of the slot's reservation
      book, so the write is refused with a stale-version error.
    error_id: ERR_STALE_SLOT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: space_requirement_check
    trigger: "POST /pig-groups and POST /pig-groups/{id}/confirm-placement (when actual_head_count supplied)"
    algorithm: threshold
    formula: |
      require head <= Barn.capacity_head            (ERR_SPACE_HEAD_EXCEEDED)
      require head * SQFT_PER_HEAD <= Barn.floor_space_sqft   (ERR_FLOOR_SPACE_EXCEEDED)
      where head = head_placed (create) or actual_head_count (confirm)
    constants:
      SQFT_PER_HEAD: 8
    precision: "integer comparison, no rounding"

  - name: occupancy_overlap_check
    trigger: "POST /pig-groups"
    algorithm: interval_merge
    formula: |
      Occupancy interval of a group = [placement_date, target_market_date), half-open:
      touching intervals (new.placement_date == existing.target_market_date) do NOT overlap.
      Reject (ERR_OCCUPANCY_OVERLAP) when any OTHER group on the same barn with
      group_status IN {SCHEDULED, PLACED, MARKETING} satisfies:
        new.placement_date < existing.target_market_date AND existing.placement_date < new.target_market_date
      Evaluation order over multiple existing groups: created_at ASC; rejection is order-independent.
    precision: "date granularity"

  - name: slot_reserved_head
    trigger: "MarketLoad create, cancel, and status changes"
    algorithm: aggregation
    formula: |
      PackerSlot.reserved_head = sum(MarketLoad.head_count)
        over loads with slot_id == slot AND load_status IN {SCHEDULED, DISPATCHED, DELIVERED, REJECTED_AT_PLANT}
      Booking gate: reserved_head + new head_count <= capacity_head (equality allowed).
      slot_status := FULL iff reserved_head == capacity_head; OPEN iff < and not CLOSED.
    input_set: "loads in the four reserved statuses above; CANCELLED excluded"

  - name: projected_market_weight
    trigger: "POST /market-loads (booking validation)"
    algorithm: forward_looking
    formula: |
      days = (slot.slot_date - group.placement_date).days   (>= 0)
      projected_avg_weight = group.avg_start_weight_lbs + ADG_PROJECTION_LBS_PER_DAY * days
      require slot.min_weight_lbs <= projected_avg_weight <= slot.max_weight_lbs
        (ERR_WEIGHT_WINDOW_PROJECTED)
    constants:
      ADG_PROJECTION_LBS_PER_DAY: 1.85
    precision: "2 decimal places, round_half_up"

  - name: feed_budget_gate
    trigger: "POST /feed-orders"
    algorithm: aggregation
    formula: |
      budget_lbs = group.head_placed * contract.feed_budget_lbs_per_head
      committed_lbs = sum(quantity_lbs over orders of group in REQUESTED|SCHEDULED)
      delivered_lbs_total = sum(delivered_lbs over orders of group in DELIVERED|SHORTED)
      hard_remaining_lbs = budget_lbs - committed_lbs - delivered_lbs_total
      HARD GATE: new quantity_lbs > hard_remaining_lbs -> ERR_FEED_BUDGET_EXCEEDED
    input_set: "orders of the group in the statuses listed"
    precision: "integer lbs"
    variants:
      - name: hard_cap
        when: "booking gate (rejection)"
        difference: "chronological actual basis: whole-budget drawdown; rejection authority"
      - name: phase_plan
        when: "over_phase_plan advisory flag on the created order"
        difference: |
          forward-looking allocation basis: phase_plan_qty(phase) = round_half_up(PHASE_PLAN_PCT[phase] * budget_lbs);
          phase_remaining = phase_plan_qty - committed(phase) - delivered(phase);
          over_phase_plan := quantity_lbs > phase_remaining. Never rejects.
    constants:
      PHASE_PLAN_PCT: { STARTER: 0.15, GROWER: 0.30, FINISHER_1: 0.30, FINISHER_2: 0.25 }

  - name: group_head_reconciliation
    trigger: "every mortality report, load delivery, and close"
    algorithm: chronological
    formula: |
      INVARIANT (pre-close): head_placed == head_current + mortality_total + cull_total + head_marketed
      INVARIANT (post-close): head_placed == mortality_total + cull_total + head_marketed + head_unaccounted
      mortality_total = sum(mortality_count over ALL MortalityReport of group)
      cull_total      = sum(cull_count over ALL MortalityReport of group)
      head_marketed   = sum(head_count over loads of group in DELIVERED)
      mortality_pct   = round_half_up(100 * mortality_total / head_placed, 2)
      Reject any report that would violate: mortality_total + cull_total + head_marketed + new_mort + new_cull > head_placed (ERR_HEAD_COUNT_EXCEEDED)
    input_set: "all reports of the group (no status filter — reports are immutable); loads DELIVERED only"

  - name: performance_metrics
    trigger: "group close (Settlement creation)"
    algorithm: aggregation
    formula: |
      weight_gain_lbs = total_live_weight_lbs - head_marketed * avg_start_weight_lbs
      days_on_feed = (closed date - placement_date).days
      adg_lbs = round_half_up(weight_gain_lbs / (head_marketed * days_on_feed), 2)
      fcr = round_half_up(cumulative_feed_lbs / weight_gain_lbs, 2)
      mortality_pct = round_half_up(100 * mortality_total / head_placed, 2)
      Preconditions: head_marketed >= 1 and weight_gain_lbs > 0 (group marketed at least one load)
    precision: "2 decimal places, round_half_up"

  - name: performance_bonus
    trigger: "Settlement creation (FINAL) and settlement-preview (PROVISIONAL)"
    algorithm: threshold
    formula: |
      if head_unaccounted > 0: bonus_cents = 0                      (incomplete marketing gate)
      elif mortality_pct > contract.mortality_threshold_pct: 0      (STRICTLY greater; == survives)
      else:
        tier = 1.00 if fcr <= fcr_target - 0.10
               0.60 if fcr <= fcr_target
               0.30 if fcr <= fcr_target + 0.10
               0.00 otherwise
        adg_factor = 1.0 if adg_lbs >= adg_target_lbs else 0.5
        bonus_cents = round_half_up(bonus_cap_cents_per_head * head_placed * tier * adg_factor)
      Single final rounding only (no intermediate rounding of tier products).
    input_set: "group aggregates at close (FINAL) or projection-blended aggregates (PROVISIONAL)"
    precision: "integer cents, round_half_up"

  - name: settlement_pay
    trigger: "group close (FINAL variant); GET /pig-groups/{id}/settlement-preview (PROVISIONAL variant)"
    algorithm: forward_looking
    formula: |
      base_pay_cents = head_placed * base_pay_cents_per_head
      deductions_cents = group.pending_deductions_cents
      total_pay_cents = base_pay_cents + bonus_cents + adjustment_cents - deductions_cents
      FINAL: all inputs are actuals at close (adjustment_cents starts 0).
    precision: "integer cents"
    variants:
      - name: PROVISIONAL
        when: "preview while group in PLACED or MARKETING"
        difference: |
          Blends actuals with projection for the head_current pigs not yet marketed:
            rem_days = max(0, (target_market_date - clock date).days)
            proj_gain_per_head = 1.85 * rem_days
            proj_feed_per_head = proj_gain_per_head * PROJ_FCR
            prov_weight_gain = actual_weight_gain + head_current * proj_gain_per_head
            prov_fcr = round_half_up((cumulative_feed_lbs + head_current * proj_feed_per_head) / prov_weight_gain, 2)
            prov_adg = round_half_up(prov_weight_gain / ((head_marketed + head_current) * total_days), 2)
              where total_days = (target_market_date - placement_date).days
            prov_mortality_pct = current mortality_pct
          bonus per performance_bonus with prov_* metrics; deductions = pending_deductions_cents to date;
          adjustment_cents = 0. Requires head_current >= 1 and prov_weight_gain > 0.
      - name: FINAL
        when: "group close"
        difference: "actuals only; no projection terms; creates the Settlement entity."
    constants:
      PROJ_FCR: 2.70

  - name: maintenance_cost_split
    trigger: "MaintenanceTicket approval"
    algorithm: tiered_pricing
    formula: |
      if cause == NEGLIGENCE: owner_share_cents = 0; grower_share_cents = cost_cents
      else:
        owner_pct = contract.structural_owner_pct   (category STRUCTURAL)
                    contract.equipment_owner_pct    (category EQUIPMENT)
                    contract.routine_owner_pct      (category ROUTINE or EMERGENCY)
        ROUNDING ORDER (pinned): round the OWNER share first, grower takes the remainder:
        owner_share_cents  = round_half_up(cost_cents * owner_pct / 100)
        grower_share_cents = cost_cents - owner_share_cents
      The reverse order (round grower first) yields different cents on odd amounts; it is WRONG.
    precision: "integer cents, round_half_up on owner share only"

  - name: nutrient_budget_drawdown
    trigger: "ManureApplication create / void"
    algorithm: aggregation
    formula: |
      n_applied_lbs = sum(n_lbs over applications of plan in RECORDED|CONFIRMED)
      p_applied_lbs = sum(p_lbs over applications of plan in RECORDED|CONFIRMED)
      lagoon_available_gal = lagoon_start_gal - sum(gallons over same set)
      Create gates (in order): n_applied + new.n_lbs > n_budget_lbs -> ERR_NUTRIENT_BUDGET_EXCEEDED;
                               p_applied + new.p_lbs > p_budget_lbs -> ERR_NUTRIENT_BUDGET_EXCEEDED;
                               new.gallons > lagoon_available_gal   -> ERR_LAGOON_INSUFFICIENT
      VOIDED applications are excluded from every sum (credit-back on void).
    input_set: "applications in RECORDED|CONFIRMED only"
    precision: "integer"

  - name: wash_staleness_check
    trigger: "POST /market-loads/{id}/dispatch"
    algorithm: threshold
    formula: |
      valid iff wash_status == VERIFIED AND wash_type == FULL_DISINFECT
             AND clock <= washed_at + WASH_VALIDITY_HOURS
      Boundary: clock == washed_at + 48h exactly is still VALID (<= comparison).
    constants:
      WASH_VALIDITY_HOURS: 48
    precision: "datetime comparison"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and non-empty", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is in the endpoint's roles list (for MaintenanceTicket approve: FieldTech only when cost_cents < 50000)", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Grower-identity ownership: acting Grower's X-User-ID equals the resource's grower chain (group.contract.grower_id / ticket.grower_id / settlement.contract.grower_id / barn's ACTIVE contract grower_id)", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "Grower-role endpoints" }
  - { priority: 4, category: existence, check: "Path ids exist, then body FK ids exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: existence, check: "OCC: expected_barn_version == Barn.version on POST /pig-groups; expected_slot_version == PackerSlot.version on POST /market-loads", error_id: "ERR_STALE_BARN_VERSION / ERR_STALE_SLOT_VERSION", http_status: 412, applies_to: "POST /pig-groups, POST /market-loads" }
  - { priority: 6, category: business_constraint, check: "Field shape: required fields present, enum members valid, integers >= their minimums, max_weight_lbs >= min_weight_lbs", error_id: ERR_MALFORMED_FIELD, http_status: 400, applies_to: "all mutating endpoints" }
  - { priority: 7, category: state, check: "Target resource in a valid from-state for the requested transition (per §1.2; includes ERR_GROUP_NOT_ACTIVE, ERR_CONTRACT_NOT_ACTIVE, ERR_SITE_NOT_ACTIVE, ERR_GROWER_NOT_ACTIVE, ERR_BARN_NOT_PLACEABLE, ERR_PLAN_NOT_APPROVED, ERR_SLOT_NOT_OPEN, ERR_TICKET_UNAPPROVED, ERR_INVALID_STATE_TRANSITION)", error_id: "ERR_INVALID_STATE_TRANSITION (and domain variants)", http_status: 409, applies_to: "state-transition and state-gated endpoints" }
  - { priority: 8, category: business_safety, check: "Biosecurity: wash VERIFIED before use (ERR_WASH_NOT_VERIFIED), FULL_DISINFECT type (ERR_WASH_TYPE_INSUFFICIENT), barn downtime honored (ERR_BARN_DOWNTIME_ACTIVE)", error_id: "ERR_WASH_NOT_VERIFIED / ERR_WASH_TYPE_INSUFFICIENT / ERR_BARN_DOWNTIME_ACTIVE", http_status: 409, applies_to: "dispatch, barn-wash verify, barn release" }
  - { priority: 9, category: business_temporal, check: "Clock/window rules: placement_date not past (ERR_PLACEMENT_DATE_PAST), target after placement (ERR_TARGET_BEFORE_PLACEMENT), confirm not early (ERR_CONFIRM_TOO_EARLY), slot date not past (ERR_SLOT_DATE_PAST), delivery not before slot date (ERR_DELIVERY_BEFORE_SLOT_DATE), report_date within [placement, clock] (ERR_REPORT_DATE_OUT_OF_RANGE), feed dates not past (ERR_FEED_DATE_PAST), application window Mar1-Nov30 of plan_year and not future (ERR_APPLICATION_OUTSIDE_WINDOW), wash staleness >48h (ERR_WASH_STALE), contract effective window (ERR_CONTRACT_NOT_YET_EFFECTIVE / ERR_CONTRACT_EXPIRED / ERR_CONTRACT_NOT_EXPIRED)", error_id: "temporal set", http_status: 409, applies_to: "dated endpoints" }
  - { priority: 10, category: business_referential, check: "Cross-aggregate consistency: barn.site_id == contract.site_id on group creation (ERR_CROSS_SITE_REFERENCE)", error_id: ERR_CROSS_SITE_REFERENCE, http_status: 409, applies_to: "POST /pig-groups" }
  - { priority: 11, category: business_constraint, check: "Uniqueness/overlap/quota: grower_code unique (ERR_DUPLICATE_GROWER_CODE), barn_code unique per site (ERR_DUPLICATE_BARN_CODE), slot (plant_code, slot_date, shift) unique (ERR_DUPLICATE_SLOT), occupancy overlap (ERR_OCCUPANCY_OVERLAP), space limits (ERR_SPACE_HEAD_EXCEEDED / ERR_FLOOR_SPACE_EXCEEDED), phase match (ERR_PHASE_MISMATCH), head reconciliation (ERR_HEAD_COUNT_EXCEEDED), zero-loss report (ERR_EMPTY_REPORT), wash reuse (ERR_WASH_ALREADY_USED), plan year overlap (ERR_PLAN_YEAR_OVERLAP), contract site overlap (ERR_CONTRACT_SITE_OVERLAP), active-groups/settlements blockers (ERR_CONTRACT_HAS_ACTIVE_GROUPS / ERR_SETTLEMENTS_PENDING / ERR_SLOT_HAS_ACTIVE_LOADS / ERR_TICKETS_OPEN / ERR_BARN_OCCUPIED), projected weight window (ERR_WEIGHT_WINDOW_PROJECTED)", error_id: "constraint set", http_status: 409, applies_to: "create/booking endpoints" }
  - { priority: 12, category: business_fiscal, check: "Money/capacity budgets, last: feed budget (ERR_FEED_BUDGET_EXCEEDED), slot head capacity (ERR_SLOT_CAPACITY_EXCEEDED), nutrient budget (ERR_NUTRIENT_BUDGET_EXCEEDED), lagoon draw (ERR_LAGOON_INSUFFICIENT), lagoon start vs capacity (ERR_LAGOON_OVER_CAPACITY)", error_id: "fiscal set", http_status: 409, applies_to: "budget-gated endpoints" }

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
