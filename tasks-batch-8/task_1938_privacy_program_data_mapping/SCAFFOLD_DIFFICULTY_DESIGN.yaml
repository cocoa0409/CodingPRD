  - rule_id: compensating_invariant
    instances:
      - name: notice_publish_retract_conserves_published_count
        grounds:
          - state_machines.Notice.DRAFT_to_PUBLISHED
          - state_machines.Notice.PUBLISHED_to_RETRACTED
        distinguishing_aspect: |
          Conserved quantity: count of PUBLISHED notices per scope. publish-then-retract
          leaves the count at 1 AND restores the predecessor's identity — no drift.
        test_recipe:
          setup: ["empty notice table; scope LOYALTY_PROGRAM unused"]
          setup_api_calls:
            - call: "POST /privacy/notices"
              payload: { scope: LOYALTY_PROGRAM, title: "loyalty v1", body: "b", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: PrivacyAdmin
              captures: { n_a: $.data.id }
          trigger:
            - call: "POST /privacy/notices/${n_a}/publish"
              payload: {}
              as: PrivacyAdmin
            - call: "POST /privacy/notices"
              payload: { scope: LOYALTY_PROGRAM, title: "loyalty v2", body: "b2", effective_from: "2026-06-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z", supersedes_notice_id: "${n_a}" }
              as: PrivacyAdmin
              captures: { n_b: $.data.id }
            - call: "POST /privacy/notices/${n_b}/publish"
              payload: {}
              as: PrivacyAdmin
            - call: "GET /privacy/notices?scope=LOYALTY_PROGRAM&status=PUBLISHED"
              payload: { scope: LOYALTY_PROGRAM, status: PUBLISHED }
              as: PrivacyAdmin
              captures: { pub_mid: "$.data[0].id" }
            - call: "POST /privacy/notices/${n_b}/retract"
              payload: {}
              as: PrivacyAdmin
            - call: "GET /privacy/notices?scope=LOYALTY_PROGRAM&status=PUBLISHED"
              payload: { scope: LOYALTY_PROGRAM, status: PUBLISHED }
              as: PrivacyAdmin
              captures: { pub_end: "$.data[0].id" }
          assert:
            - "after publish(n_a): exactly 1 PUBLISHED notice in scope (== n_a)"
            - "after publish(n_b superseding n_a): still exactly 1 PUBLISHED (== n_b; n_a SUPERSEDED)"
            - "after retract(n_b): exactly 1 PUBLISHED and it is ${n_a} again — publish + retract conserves the per-scope published count and restores identity"

      - name: activity_activate_retire_conserves_risk_total
        grounds:
          - state_machines.ProcessingActivity.DRAFT_to_ACTIVE
          - state_machines.ProcessingActivity.ACTIVE_to_RETIRED
          - calculations.activity_risk_score
        distinguishing_aspect: |
          Conserved quantity: sum of risk_score over ACTIVE activities (a different
          quantity than the notice count). activate(A1) adds exactly risk_score(A1);
          retire(A1) removes exactly the same 50 — the pair leaves the total at 300.
        test_recipe:
          setup:
            - "A1 [email] risk 50; A2 [bank_acct] risk 300; both with CONTRACT purposes"
          setup_api_calls:
            - call: "POST /privacy/data-elements"
              payload: { element_key: "email", category: BASIC_CONTACT, classification: INTERNAL }
              as: DataSteward
              captures: { e_mail: $.data.id }
            - call: "POST /privacy/data-elements"
              payload: { element_key: "bank_acct", category: FINANCIAL, classification: CONFIDENTIAL }
              as: DataSteward
              captures: { e_bank: $.data.id }
            - call: "POST /privacy/retention-policies"
              payload: { policy_code: "RP-1YR", duration_days: 365, disposal_action: DELETE }
              as: PrivacyAdmin
              captures: { rp1: $.data.id }
            - call: "POST /privacy/processing-activities"
              payload: { activity_name: "Newsletter", business_unit: "Marketing", notice_scope: WEBSITE, data_element_ids: ["${e_mail}"] }
              as: DataSteward
              captures: { a1: $.data.id }
            - call: "POST /privacy/processing-activities"
              payload: { activity_name: "Billing", business_unit: "Finance", notice_scope: WEBSITE, data_element_ids: ["${e_bank}"] }
              as: DataSteward
              captures: { a2: $.data.id }
            - call: "POST /privacy/processing-activities/${a1}/purposes"
              payload: { purpose_type: MARKETING, legal_basis: LEGITIMATE_INTEREST, retention_policy_id: "${rp1}" }
              as: DataSteward
            - call: "POST /privacy/processing-activities/${a2}/purposes"
              payload: { purpose_type: SERVICE_DELIVERY, legal_basis: CONTRACT, retention_policy_id: "${rp1}" }
              as: DataSteward
          trigger:
            - call: "POST /privacy/processing-activities/${a2}/activate"
              payload: {}
              as: DataSteward
            - call: "POST /privacy/processing-activities/${a1}/activate"
              payload: {}
              as: DataSteward
            - call: "GET /privacy/processing-activities?status=ACTIVE"
              payload: { status: ACTIVE }
              as: DataSteward
              captures: { mid_count: $.meta }
            - call: "POST /privacy/processing-activities/${a1}/retire"
              payload: {}
              as: DataSteward
              captures: { a1_st: $.data.status }
            - call: "GET /privacy/processing-activities?status=ACTIVE"
              payload: { status: ACTIVE }
              as: DataSteward
              captures: { end_a2: "$.data[0].id", end_a2_risk: "$.data[0].risk_score" }
          assert:
            - "after activating both: ACTIVE set == {A1, A2} and risk total == 350 (50 + 300)"
            - "after retire(A1): A1 status == RETIRED; ACTIVE set == {A2} with risk_score == 300"
            - "activate(A1) + retire(A1) leaves the ACTIVE risk total unchanged at 300 — no drift"
