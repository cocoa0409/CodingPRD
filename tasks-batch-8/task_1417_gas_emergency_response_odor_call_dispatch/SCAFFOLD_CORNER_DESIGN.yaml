              captures: { terr_id: "$.data.id" }
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "Z17", caller_phone: "555-0241", address_line: "17 Imm St", city: "Springfield", territory_id: "${terr_id}", location_context: "INSIDE_STRUCTURE", odor_reported: true, symptoms_reported: false, hissing_reported: false }
              as: Dispatcher
              captures: { inc_id: "$.data.incident_id" }
          trigger:
            - call: "POST /gas-ops/incidents/${inc_id}/triage"
              payload: { priority: "P2" }
              as: Dispatcher
              captures: { lc: "$.data.lifecycle_status", pri: "$.data.priority", ver: "$.data.version" }
          assert:
            - "Triage response: lifecycle_status == TRIAGED, priority == P2, version incremented relative to creation (== 2)"
            - "updated_at == the triage logical time (2026-08-01T00:00:00Z default clock)"
