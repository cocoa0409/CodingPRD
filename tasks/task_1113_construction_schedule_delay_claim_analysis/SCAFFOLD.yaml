    roles: [ContractorScheduler]
    code: 201
    input: [delay_event_id, requested_days, "cost_recovery_cents?"]
    output: TimeExtensionRequest
    side_effects: ["status = DRAFT", "submission_round := 1"]

  - method: GET
    path: "/construction-projects/{pid}/eot-requests"
    description: "List EOT requests"
    roles: [ContractorScheduler, ProjectControlsEngineer, OwnerRepresentative, ClaimsConsultant, SystemAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "TimeExtensionRequest[]"
    side_effects: []

  - method: GET
    path: "/construction-projects/{pid}/eot-requests/{eid}"
    description: "Get an EOT request"
    roles: [ContractorScheduler, ProjectControlsEngineer, OwnerRepresentative, ClaimsConsultant, SystemAdmin]
    code: 200
    input: []
    output: TimeExtensionRequest
    side_effects: []

  - method: POST
    path: "/construction-projects/{pid}/eot-requests/{eid}/submit"
    description: "Submit an EOT"
    roles: [ContractorScheduler]
    code: 200
    input: []
    output: TimeExtensionRequest
    side_effects: ["status → SUBMITTED"]

  - method: POST
    path: "/construction-projects/{pid}/eot-requests/{eid}/begin-review"
    description: "Owner begins review"
    roles: [OwnerRepresentative]
    code: 200
    input: []
    output: TimeExtensionRequest
    side_effects: ["status → UNDER_REVIEW"]

  - method: POST
    path: "/construction-projects/{pid}/eot-requests/{eid}/approve"
    description: "Approve an EOT in full (OCC on project.version)"
    roles: [OwnerRepresentative]
    code: 200
    input: [expected_project_version, approved_days, awarded_cost_cents]
    output: TimeExtensionRequest
    side_effects:
      - "status → APPROVED"
      - "project.current_completion_date += approved_days"
      - "Increments ConstructionProject.version by 1"
      - "Cascade: overlapping PROPOSED LDAs → OFFSET_BY_EOT"

  - method: POST
    path: "/construction-projects/{pid}/eot-requests/{eid}/partial-approve"
    description: "Approve an EOT in part"
    roles: [OwnerRepresentative]
    code: 200
    input: [expected_project_version, approved_days, awarded_cost_cents]
    output: TimeExtensionRequest
    side_effects:
      - "status → PARTIALLY_APPROVED"
      - "project.current_completion_date += approved_days"
      - "Increments ConstructionProject.version by 1"
      - "Cascade: overlapping PROPOSED LDAs → OFFSET_BY_EOT"

  - method: POST
    path: "/construction-projects/{pid}/eot-requests/{eid}/deny"
    description: "Deny an EOT"
    roles: [OwnerRepresentative]
    code: 200
    input: []
    output: TimeExtensionRequest
    side_effects: ["status → DENIED"]

  - method: POST
    path: "/construction-projects/{pid}/eot-requests/{eid}/appeal"
    description: "Appeal a denied EOT"
    roles: [ContractorScheduler]
    code: 200
    input: []
    output: TimeExtensionRequest
    side_effects: ["status DENIED → SUBMITTED", "submission_round += 1"]

