            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-C-CND", class_code: "C", class_ceiling_ft: 700, requires_authorization: true, max_concurrent_authorizations: 2 }
              as: AirspaceAuthority
              captures: { zc: $.data.id }
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-G-CND", class_code: "G", class_ceiling_ft: 400, requires_authorization: false, max_concurrent_authorizations: 2 }
              as: AirspaceAuthority
