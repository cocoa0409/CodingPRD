          - state_machines.StudyPlan.UNDER_AGENCY_REVIEW_to_APPROVED
        distinguishing_aspect: "APPROVE is only defined from UNDER_AGENCY_REVIEW; issuing it against a DRAFT plan is the invalid-from rejection and must not stamp approved_at."
        test_recipe:
          setup:
