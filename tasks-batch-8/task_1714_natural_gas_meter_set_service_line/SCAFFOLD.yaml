# =============================================================================
# PRD Benchmark Seed Tables — Natural Gas Meter Set & Service Line Installation
# (gas utility new-business group)
# =============================================================================

scenario: |
  Natural Gas Meter Set & Service Line Installation (gas utility new-business group): new-service application & load calculation, main extension cost share & contribution in aid of construction, permit/road-cut & inspection scheduling, meter set & regulator sizing, purge & leak test documentation, customer appliance turn-on & safety check, timeline commitment & builder coordination, as-built GIS update

domain_name: natural-gas-meter-set
api_prefix: /    # flat topology: every entity collection hangs off the root (e.g. /service-applications, /main-extensions, /meter-sets)

# =============================================================================
# Complexity Profile (SKILL §0.1–§0.4) — deliberately pushed past Expert band
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency       # OCC on ServiceApplication / ApplianceLoad / TimelineCommitment
    - cascading_side_effects       # certify-PASS → meter → application spine; cancel unwind; finalize true-up
    - dual_variant_calculation     # provisional vs as-built CIAC; optimistic vs conservative commitment dates
    - scheduled_actions            # logical clock sweeps: quote expiry, permit expiry, inspection expiry, commitment MISSED
  entity_topology: flat            # peer collections joined by FK references; no nested URL paths
  state_machine_shape: compound    # application spine is guarded by aggregate child state; hold axis runs parallel
  relationship_patterns:
    - one_to_many                  # application → loads, permits, bookings, inspections, turn-ons
    - cross_aggregate              # bookings/inspections reference crews/inspectors resources
  role_model: segregation_of_duties # invoice issuer vs payment clerk; test installer vs certifying witness
  consistency_model: immediate     # every mutation + cascade is atomic within the request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Builder
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Builder / developer legal name" }
      - { name: contact_email, type: string, source: input, description: "Primary coordination email" }
      - { name: license_number, type: string, source: input, description: "State contractor license number" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED — SUSPENDED builders cannot create or submit applications", constraints: "ACTIVE | SUSPENDED" }

  - name: ServiceApplication
    parent: null
    common_fields: true
    fields:
      - { name: builder_id, type: string, source: input, description: "FK -> Builder.id; owning builder" }
      - { name: service_address, type: string, source: input, description: "Street address of new service" }
      - { name: city, type: string, source: input, description: "Municipality" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code" }
      - { name: postal_code, type: string, source: input, description: "ZIP/postal code" }
      - { name: pressure_class_requested, type: enum, source: input, default: LOW, description: "LOW (0.25 psi) | MEDIUM (2 psi) delivery pressure class", constraints: "LOW | MEDIUM" }
      - { name: requested_in_service_date, type: string, source: input, description: "ISO date the builder wants gas on" }
      - { name: status, type: enum, source: system, description: "Spine: DRAFT | SUBMITTED | LOAD_CONFIRMED | DESIGN | QUOTED | CIAC_PENDING | APPROVED_FOR_CONSTRUCTION | PERMITTING | CONSTRUCTION_SCHEDULED | SERVICE_INSTALLED | METER_WORK | TESTING | TURN_ON | ENERGIZED | GIS_REVIEW | COMPLETED | REJECTED | CANCELLED | EXPIRED", constraints: "spine order is canonical; REJECTED/CANCELLED/EXPIRED are terminal off-spine" }
      - { name: hold_status, type: enum, source: system, default: NOT_HELD, description: "Parallel hold axis: NOT_HELD | HELD_BY_BUILDER | HELD_BY_UTILITY — any non-NOT_HELD value freezes all child mutations and spine transitions", constraints: "NOT_HELD | HELD_BY_BUILDER | HELD_BY_UTILITY" }
      - { name: hold_reason, type: string, source: system, description: "Free-text reason captured by /hold" }
      - { name: appliance_count, type: integer, source: computed, description: "Count of ApplianceLoad rows for this application" }
      - { name: total_connected_load_cfph, type: number, source: computed, description: "Sum of ApplianceLoad.counted_load_cfph, 1 decimal" }
      - { name: diversity_adjusted_load_cfph, type: number, source: computed, description: "load_calculation output: total_connected × diversity factor(appliance_count), 1 decimal" }
      - { name: quote_valid_until, type: string, source: computed, description: "ISO date = approve-design date + QUOTE_VALIDITY_DAYS(30); set when entering QUOTED" }
      - { name: submitted_at, type: datetime, source: system, description: "Set on DRAFT→SUBMITTED" }
      - { name: completed_at, type: datetime, source: system, description: "Set on →COMPLETED" }

  - name: ApplianceLoad
    parent: null
    common_fields: true
    fields:
      - { name: service_application_id, type: string, source: input, description: "FK -> ServiceApplication.id" }
      - { name: appliance_type, type: enum, source: input, description: "FURNACE | WATER_HEATER | RANGE | DRYER | FIREPLACE | STANDBY_GENERATOR | POOL_HEATER | OTHER", constraints: "enum" }
      - { name: quantity, type: integer, source: input, description: "Number of identical appliances; >= 1" }
      - { name: btuh_input_rating, type: integer, source: input, description: "Per-unit nameplate input BTU/hr; > 0" }
      - { name: counted_load_cfph, type: number, source: computed, description: "= round_half_up(quantity × btuh_input_rating / BTU_PER_CFH, 1)" }

  - name: MainExtension
    parent: null
    common_fields: true
    fields:
      - { name: service_application_id, type: string, source: input, description: "FK -> ServiceApplication.id; at most one non-CANCELLED MainExtension per application" }
      - { name: design_footage_ft, type: integer, source: input, description: "Designed main-extension footage; > 0" }
      - { name: crossings, type: array, source: input, description: "Road-crossing segments: [{surface_type: ASPHALT|CONCRETE|LANDSCAPE, length_ft: number, width_ft: number}]; may be empty" }
      - { name: rock_excavation_expected, type: boolean, source: input, default: false, description: "Design expects rock excavation" }
      - { name: crossings_count, type: integer, source: computed, description: "= len(crossings); > 0 forces an APPROVED ROAD_CUT Permit before construction scheduling" }
      - { name: allowance_ft, type: integer, source: computed, description: "Tariff allowance = BASE_ALLOWANCE_FT(100) + ALLOWANCE_FT_PER_APPLIANCE(25) × application.appliance_count" }
      - { name: provisional_base_cost_cents, type: integer, source: computed, description: "= design_footage_ft × STANDARD_UNIT_COST_CENTS_PER_FT(4500)" }
      - { name: provisional_surcharges_cents, type: integer, source: computed, description: "= crossings_count × CROSSING_SURCHARGE_CENTS(15000) + (rock_excavation_expected ? design_footage_ft × ROCK_SURCHARGE_CENTS_PER_FT(2000) : 0)" }
      - { name: provisional_net_ciac_cents, type: integer, source: computed, description: "= max(0, base + surcharges − allowance_ft × 4500)" }
      - { name: provisional_gross_up_cents, type: integer, source: computed, description: "= round_half_up(provisional_net_ciac_cents × GROSS_UP_NUM(21) / GROSS_UP_DEN(79), 0)" }
      - { name: provisional_total_due_cents, type: integer, source: computed, description: "= provisional_net_ciac_cents + provisional_gross_up_cents" }
      - { name: actual_footage_ft, type: integer, source: input, description: "As-built footage (record-as-built)" }
      - { name: actual_unit_cost_cents, type: integer, source: input, description: "As-built blended unit cost per foot" }
      - { name: actual_rock_excavation, type: boolean, source: input, description: "As-built rock flag" }
      - { name: actual_crossings, type: array, source: input, description: "As-built crossing segments (same shape as crossings)" }
      - { name: final_net_ciac_cents, type: integer, source: computed, description: "Final variant of CIAC from as-built inputs; computed at finalize" }
      - { name: final_gross_up_cents, type: integer, source: computed, description: "Gross-up on final net" }
      - { name: final_total_due_cents, type: integer, source: computed, description: "= final_net + final_gross_up" }
      - { name: ciac_delta_cents, type: integer, source: computed, description: "= final_total_due_cents − provisional_total_due_cents (signed)" }
      - { name: status, type: enum, source: system, description: "DRAFT | DESIGN_SUBMITTED | QUOTED | ACCEPTED | CONSTRUCTED | AS_BUILT_RECORDED | FINALIZED | CANCELLED | EXPIRED", constraints: "enum" }

  - name: CIACInvoice
    parent: null
    common_fields: true
    fields:
      - { name: main_extension_id, type: string, source: system, description: "FK -> MainExtension.id" }
      - { name: service_application_id, type: string, source: system, description: "FK -> ServiceApplication.id (denormalized for filtering)" }
      - { name: amount_due_cents, type: integer, source: computed, description: "Current amount the customer must pay; repriced by finalize true-up" }
      - { name: payments_applied_cents, type: integer, source: computed, description: "Σ CIACPayment.amount_cents where direction=PAYMENT" }
      - { name: refunds_issued_cents, type: integer, source: computed, description: "Σ CIACPayment.amount_cents where direction=REFUND" }
      - { name: balance_due_cents, type: integer, source: computed, description: "= amount_due_cents − payments_applied_cents (may go negative only transiently at true-up; refund_required_cents then carries the magnitude)" }
      - { name: refund_required_cents, type: integer, source: computed, default: 0, description: "Set when entering REFUND_PENDING = payments_applied − amount_due (finalize overpayment) or = payments_applied (cancel/expiry unwind)" }
      - { name: status, type: enum, source: system, description: "ISSUED | PARTIALLY_PAID | PAID | SETTLED | REFUND_PENDING | REFUNDED | VOID", constraints: "enum" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of the NewBusinessRep whose approve-design created this invoice" }

  - name: CIACPayment
    parent: null
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: ciac_invoice_id, type: string, source: input, description: "FK -> CIACInvoice.id (path parent)" }
      - { name: direction, type: enum, source: system, description: "PAYMENT (via /payments) | REFUND (via /refunds)", constraints: "PAYMENT | REFUND" }
      - { name: amount_cents, type: integer, source: input, description: "> 0" }
      - { name: method, type: enum, source: input, description: "CHECK | ACH | CARD", constraints: "CHECK | ACH | CARD" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the BillingClerk who recorded the event" }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: service_application_id, type: string, source: input, description: "FK -> ServiceApplication.id" }
      - { name: permit_type, type: enum, source: input, description: "ROAD_CUT | EASEMENT | RAILROAD_CROSSING | DOT_HIGHWAY", constraints: "enum" }
      - { name: jurisdiction, type: string, source: input, description: "Issuing authority (city/county/state)" }
      - { name: crossings, type: array, source: input, description: "Road-cut segments [{surface_type, length_ft, width_ft}]; must be non-empty when permit_type=ROAD_CUT" }
      - { name: permit_fee_cents, type: integer, source: computed, description: "permit_fee calculation: Σ per-segment rounded fees + FILING_FEE_CENTS(7500)" }
      - { name: status, type: enum, source: system, description: "DRAFT | FILED | APPROVED | REJECTED | EXPIRED | CLOSED | WITHDRAWN", constraints: "enum" }
      - { name: filed_at, type: datetime, source: system, description: "Set on DRAFT→FILED" }
      - { name: decided_at, type: datetime, source: system, description: "Set on FILED→APPROVED/REJECTED" }
      - { name: expires_at, type: string, source: input, description: "ISO date permit approval lapses (required on decision=APPROVED)" }
      - { name: decision_note, type: string, source: input, description: "Authority note / rejection reason" }

  - name: FieldCrew
    parent: null
    common_fields: true
    fields:
      - { name: crew_name, type: string, source: input, description: "Crew identifier label" }
      - { name: specialty, type: enum, source: input, description: "MAIN_EXTENSION | SERVICE_LINE | RESTORATION | GENERAL", constraints: "enum" }
      - { name: daily_capacity_minutes, type: integer, source: input, description: "Bookable minutes per crew per work_date; > 0" }
      - { name: active, type: boolean, source: input, default: true, description: "Inactive crews reject new bookings" }

  - name: CrewBooking
    parent: null
    common_fields: true
    fields:
      - { name: service_application_id, type: string, source: input, description: "FK -> ServiceApplication.id" }
      - { name: field_crew_id, type: string, source: input, description: "FK -> FieldCrew.id" }
      - { name: work_date, type: string, source: input, description: "ISO date of the work window" }
      - { name: start_minute, type: integer, source: input, description: "Window start, minutes from local midnight, 0–1439" }
      - { name: end_minute, type: integer, source: input, description: "Window end, > start_minute, <= 1440" }
      - { name: scope, type: enum, source: input, description: "MAIN_CONSTRUCTION | SERVICE_INSTALL | RESTORATION", constraints: "enum" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | COMPLETED | CANCELLED", constraints: "enum" }

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Inspector name" }
      - { name: certifications, type: array, source: input, description: "Subset of [PRESSURE_TEST, ROAD_CUT, FINAL_SAFETY]; gates inspection types and purge/leak witnessing" }
      - { name: active, type: boolean, source: input, default: true, description: "Inactive inspectors reject new inspections" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: service_application_id, type: string, source: input, description: "FK -> ServiceApplication.id" }
      - { name: inspector_id, type: string, source: input, description: "FK -> Inspector.id" }
      - { name: inspection_type, type: enum, source: input, description: "ROAD_CUT_RESTORATION | PRESSURE_TEST | FINAL_SAFETY — requires matching Inspector.certifications member", constraints: "enum" }
      - { name: inspection_date, type: string, source: input, description: "ISO date" }
      - { name: start_minute, type: integer, source: input, description: "Half-open window start [start_minute, end_minute)" }
      - { name: end_minute, type: integer, source: input, description: "Half-open window end, > start_minute" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED_PASS | COMPLETED_FAIL | CANCELLED | EXPIRED", constraints: "enum" }
      - { name: result_notes, type: string, source: input, description: "Inspector notes at record-result" }

  - name: MeterSet
    parent: null
    common_fields: true
    fields:
      - { name: service_application_id, type: string, source: input, description: "FK -> ServiceApplication.id; at most one non-CANCELLED MeterSet per application" }
      - { name: meter_model, type: enum, source: computed, description: "AL_425 | AL_800 | AL_1400 | AL_2300 | AL_5000 — selected by meter_sizing", constraints: "enum" }
      - { name: regulator_model, type: enum, source: computed, description: "R_325 | R_750 | R_1200 | R_2100 | R_4500 — paired per meter model", constraints: "enum" }
      - { name: serial_number, type: string, source: input, description: "Device serial recorded at mark-ordered" }
      - { name: installed_by_user_id, type: string, source: system, description: "X-User-ID of the MeterTechnician who ran /install" }
      - { name: installed_at, type: datetime, source: system, description: "Set on ORDERED→INSTALLED" }
      - { name: status, type: enum, source: system, description: "PLANNED | SIZED | ORDERED | INSTALLED | TESTING | REPAIR | READY_FOR_TURN_ON | ENERGIZED | CANCELLED", constraints: "enum" }

  - name: PurgeLeakTest
    parent: null
    common_fields: true
    fields:
      - { name: meter_set_id, type: string, source: input, description: "FK -> MeterSet.id" }
      - { name: installer_user_id, type: string, source: system, description: "X-User-ID of the MeterTechnician recording the test" }
      - { name: purge_duration_min, type: integer, source: input, description: "Minutes purged; safety minimum 5" }
      - { name: test_pressure_psi, type: number, source: input, description: "Applied test pressure; safety minimum 10.0" }
      - { name: test_duration_min, type: integer, source: input, description: "Duration of pressure hold; safety minimum 15" }
      - { name: observed_pressure_drop_psi, type: number, source: input, description: "Observed drop, 3 decimals" }
      - { name: max_allowed_drop_psi, type: number, source: computed, description: "leak_test_acceptance: round_half_up(ALLOW_REF_DROP_PSI(0.300) × ALLOW_REF_DURATION_MIN(60) / test_duration_min, 3)" }
      - { name: result, type: enum, source: computed, description: "PASS iff observed_pressure_drop_psi <= max_allowed_drop_psi (equality PASSES), else FAIL", constraints: "PASS | FAIL" }
      - { name: status, type: enum, source: system, description: "RECORDED | CERTIFIED | REJECTED", constraints: "enum" }
      - { name: witness_inspector_id, type: string, source: system, description: "Inspector.id of the certifying witness; must differ from installer_user_id (segregation of duties)" }
      - { name: rejection_reason, type: string, source: input, description: "Set when witness rejects documentation" }

  - name: TurnOnEvent
    parent: null
    common_fields: true
    fields:
      - { name: service_application_id, type: string, source: input, description: "FK -> ServiceApplication.id" }
      - { name: appliance_load_id, type: string, source: input, description: "FK -> ApplianceLoad.id; must belong to the same application" }
      - { name: technician_user_id, type: string, source: system, description: "X-User-ID of the MeterTechnician" }
      - { name: co_reading_ppm, type: number, source: input, description: "Ambient CO reading at appliance, 1 decimal" }
      - { name: odor_detected, type: boolean, source: input, description: "Gas odor present" }
      - { name: ignition_verified, type: boolean, source: input, description: "Appliance ignites and burns correctly" }
      - { name: venting_verified, type: boolean, source: input, description: "Venting/flue verified" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | VERIFIED | FAILED | CANCELLED — VERIFIED iff !odor_detected && ignition_verified && venting_verified && co_reading_ppm < CO_FAIL_THRESHOLD_PPM(9.0); equality 9.0 FAILS", constraints: "enum" }

  - name: TimelineCommitment
    parent: null
    common_fields: true
    fields:
      - { name: service_application_id, type: string, source: system, description: "FK -> ServiceApplication.id; at most one non-CANCELLED commitment per application" }
      - { name: base_date, type: string, source: computed, description: "ISO date of the approve-design that created this commitment" }
      - { name: optimistic_completion_date, type: string, source: computed, description: "commitment_dates optimistic variant" }
      - { name: conservative_completion_date, type: string, source: computed, description: "commitment_dates conservative variant" }
      - { name: committed_completion_date, type: string, source: computed, description: "= conservative at creation; replaced by requested_completion_date when a revision is accepted" }
      - { name: requested_completion_date, type: string, source: input, description: "Builder-proposed date in propose-revision" }
      - { name: delay_attribution, type: enum, source: input, description: "UTILITY | BUILDER | MUNICIPALITY | WEATHER — set by mark-delayed; default UTILITY when MISSED without attribution", constraints: "enum" }
      - { name: penalty_credit_cents, type: integer, source: computed, default: 0, description: "delay_penalty_credit output; computed at application completion" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACCEPTED | REVISION_PENDING | AT_RISK | MET | MISSED | CANCELLED", constraints: "enum" }

  - name: GISAsBuilt
    parent: null
    common_fields: true
    fields:
      - { name: service_application_id, type: string, source: input, description: "FK -> ServiceApplication.id; at most one non-CANCELLED record per application" }
      - { name: geometry_geojson, type: string, source: input, description: "LineString geometry of the as-built service + main extension" }
      - { name: pipe_material, type: enum, source: input, description: "STEEL | PE | CSST", constraints: "enum" }
      - { name: depth_inches, type: number, source: input, description: "Cover depth; code minimum MIN_COVER_DEPTH_IN(18) enforced at validate" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the FieldSupervisor" }
      - { name: validated_by_user_id, type: string, source: system, description: "X-User-ID of the GISAnalyst" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VALIDATED | REJECTED | CANCELLED", constraints: "enum" }
      - { name: rejection_reason, type: string, source: input, description: "Set on reject" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
# Spine order (canonical, used by every "status X or later" guard):
#   DRAFT(0) SUBMITTED(1) LOAD_CONFIRMED(2) DESIGN(3) QUOTED(4) CIAC_PENDING(5)
#   APPROVED_FOR_CONSTRUCTION(6) PERMITTING(7) CONSTRUCTION_SCHEDULED(8)
#   SERVICE_INSTALLED(9) METER_WORK(10) TESTING(11) TURN_ON(12) ENERGIZED(13)
#   GIS_REVIEW(14) COMPLETED(15); REJECTED/CANCELLED/EXPIRED terminal off-spine.
state_machines:
  - entity: ServiceApplication
    initial_state: DRAFT
    terminal_states: [COMPLETED, REJECTED, CANCELLED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /service-applications/{id}/submit"
        actor: Builder
        preconditions:
          - "acting Builder.id == service_application.builder_id (else ERR_FORBIDDEN_OWNER)"
          - "builder.status == ACTIVE (else ERR_BUILDER_SUSPENDED)"
          - "appliance_count >= 1 (else ERR_NO_APPLIANCE_LOADS)"
        side_effects:
          - "run load_calculation: persist appliance_count, total_connected_load_cfph, diversity_adjusted_load_cfph"
          - "submitted_at = now; version += 1"
      - from: SUBMITTED
        to: LOAD_CONFIRMED
        trigger: "POST /service-applications/{id}/confirm-load"
        actor: NewBusinessRep
        preconditions: []
        side_effects:
          - "ApplianceLoad rows for this application become immutable (POST/PATCH/DELETE on them → ERR_LOADS_LOCKED)"
          - "version += 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /service-applications/{id}/reject"
        actor: NewBusinessRep
        preconditions: []
        side_effects: ["version += 1"]
      - from: LOAD_CONFIRMED
        to: DESIGN
        trigger: "system (on successful POST /main-extensions for this application)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: DESIGN
        to: QUOTED
        trigger: "system (on MainExtension DESIGN_SUBMITTED→QUOTED approve-design)"
        actor: system
        preconditions: []
        side_effects:
          - "quote_valid_until = current date + 30 days"
          - "version += 1"
      - from: QUOTED
        to: CIAC_PENDING
        trigger: "system (on MainExtension QUOTED→ACCEPTED accept-quote)"
        actor: system
        preconditions: []
        side_effects:
          - "version += 1"
          - "if CIACInvoice.amount_due_cents == 0: invoice transitions ISSUED→PAID (zero-CIAC auto-pay) and this application immediately continues CIAC_PENDING→APPROVED_FOR_CONSTRUCTION (chained transition caused by the invoice reaching PAID)"
      - from: QUOTED
        to: EXPIRED
        trigger: "system sweep (POST /_clock/set_current_utc) when current date > quote_valid_until + EXPIRY_SWEEP_GRACE_DAYS(7) — during the grace window the application stays QUOTED and accept-quote fails with ERR_QUOTE_EXPIRED"
        actor: system
        preconditions: []
        side_effects:
          - "MainExtension QUOTED→EXPIRED"
          - "CIACInvoice: ISSUED→VOID if payments_applied_cents == 0 else ISSUED/PARTIALLY_PAID→REFUND_PENDING with refund_required_cents = payments_applied_cents"
          - "TimelineCommitment non-terminal → CANCELLED"
          - "version += 1"
      - from: CIAC_PENDING
        to: APPROVED_FOR_CONSTRUCTION
        trigger: "system (on CIACInvoice reaching PAID)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: APPROVED_FOR_CONSTRUCTION
        to: PERMITTING
        trigger: "system (on first Permit for this application reaching FILED)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: APPROVED_FOR_CONSTRUCTION
        to: CONSTRUCTION_SCHEDULED
        trigger: "POST /service-applications/{id}/schedule-construction"
        actor: FieldSupervisor
        preconditions:
          - "hold_status == NOT_HELD (else ERR_APPLICATION_ON_HOLD)"
          - "every Permit of this application is in {APPROVED, CLOSED} (else ERR_PERMIT_NOT_APPROVED)"
          - "if MainExtension.crossings_count > 0 then at least one ROAD_CUT Permit is in {APPROVED, CLOSED} (else ERR_PERMIT_NOT_APPROVED)"
          - "at least one CrewBooking for this application has status CONFIRMED (else ERR_NO_CONFIRMED_BOOKING)"
          - "CIACInvoice.status == PAID (else ERR_CIAC_UNPAID)"
        side_effects: ["version += 1"]
      - from: PERMITTING
        to: CONSTRUCTION_SCHEDULED
        trigger: "POST /service-applications/{id}/schedule-construction"
        actor: FieldSupervisor
        preconditions: ["same guard set as APPROVED_FOR_CONSTRUCTION→CONSTRUCTION_SCHEDULED"]
        side_effects: ["version += 1"]
      - from: CONSTRUCTION_SCHEDULED
        to: SERVICE_INSTALLED
        trigger: "system (on a CONFIRMED CrewBooking of this application reaching COMPLETED)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: SERVICE_INSTALLED
        to: METER_WORK
        trigger: "system (on MeterSet ORDERED→INSTALLED)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: METER_WORK
        to: TESTING
        trigger: "system (on first PurgeLeakTest RECORDED for the application's MeterSet)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: TESTING
        to: TURN_ON
        trigger: "system (on a PurgeLeakTest CERTIFIED with result == PASS)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: TURN_ON
        to: ENERGIZED
        trigger: "POST /service-applications/{id}/energize"
        actor: MeterTechnician
        preconditions:
          - "hold_status == NOT_HELD (else ERR_APPLICATION_ON_HOLD)"
          - "MeterSet.status == READY_FOR_TURN_ON (else ERR_METER_NOT_READY)"
          - "every ApplianceLoad of this application has at least one TurnOnEvent with status VERIFIED (else ERR_TURN_ON_INCOMPLETE)"
        side_effects:
          - "MeterSet READY_FOR_TURN_ON→ENERGIZED"
          - "version += 1"
      - from: ENERGIZED
        to: GIS_REVIEW
        trigger: "system (on GISAsBuilt created → SUBMITTED)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: ENERGIZED
        to: COMPLETED
        trigger: "POST /service-applications/{id}/complete"
        actor: NewBusinessRep
        preconditions:
          - "hold_status == NOT_HELD (else ERR_APPLICATION_ON_HOLD)"
          - "a GISAsBuilt with status VALIDATED exists for this application (else ERR_GIS_NOT_VALIDATED)"
          - "MainExtension.status == FINALIZED (else ERR_INVALID_STATE)"
          - "CIACInvoice.status in {SETTLED, REFUNDED} (else ERR_CIAC_UNPAID)"
        side_effects:
          - "completed_at = now"
          - "TimelineCommitment outcome: completed date <= committed_completion_date → MET; else MISSED and if delay_attribution (latest mark-delayed, default UTILITY) == UTILITY run delay_penalty_credit"
          - "version += 1"
      - from: GIS_REVIEW
        to: COMPLETED
        trigger: "POST /service-applications/{id}/complete"
        actor: NewBusinessRep
        preconditions: ["same guard set as ENERGIZED→COMPLETED"]
        side_effects: ["same side effects as ENERGIZED→COMPLETED"]
      - from: ANY_NON_TERMINAL
        to: CANCELLED
        trigger: "POST /service-applications/{id}/cancel"
        actor: Builder
        preconditions:
          - "acting Builder.id == builder_id, or actor is NewBusinessRep (else ERR_FORBIDDEN_OWNER / ERR_UNAUTHORIZED_ROLE)"
          - "status not in {COMPLETED, REJECTED, CANCELLED, EXPIRED} (else ERR_APPLICATION_TERMINAL)"
        side_effects:
          - "MainExtension non-terminal → CANCELLED (chain link 1)"
          - "that MainExtension cancellation forces its CIACInvoice: ISSUED→VOID; PARTIALLY_PAID/PAID→REFUND_PENDING with refund_required_cents = payments_applied_cents (chain link 2)"
          - "Permits in DRAFT/FILED → WITHDRAWN; APPROVED stays (municipal record) unless construction not started, in which case APPROVED→WITHDRAWN — pin: APPROVED/CLOSED permits are never withdrawn"
          - "CrewBookings REQUESTED/CONFIRMED → CANCELLED; Inspections SCHEDULED → CANCELLED; TurnOnEvents SCHEDULED/FAILED → CANCELLED"
          - "MeterSet non-terminal → CANCELLED; its RECORDED PurgeLeakTests → REJECTED"
          - "TimelineCommitment non-terminal → CANCELLED; GISAsBuilt SUBMITTED/REJECTED → CANCELLED"
          - "version += 1"
    note: "hold_status is a parallel axis: POST /hold sets HELD_BY_BUILDER (actor Builder) or HELD_BY_UTILITY (internal roles), POST /resume clears to NOT_HELD; neither touches spine status. Any non-NOT_HELD blocks all child-entity mutations and all spine transitions with ERR_APPLICATION_ON_HOLD."

  - entity: MainExtension
    initial_state: DRAFT
    terminal_states: [FINALIZED, CANCELLED, EXPIRED]
    transitions:
      - from: DRAFT
        to: DESIGN_SUBMITTED
        trigger: "POST /main-extensions/{id}/submit-design"
        actor: DesignEngineer
        preconditions: ["parent application hold_status == NOT_HELD"]
        side_effects: ["version += 1"]
      - from: DESIGN_SUBMITTED
        to: QUOTED
        trigger: "POST /main-extensions/{id}/approve-design"
        actor: NewBusinessRep
        preconditions: ["parent application.status == DESIGN (else ERR_INVALID_STATE)"]
        side_effects:
          - "create CIACInvoice: amount_due_cents = provisional_total_due_cents, status ISSUED (or PAID when amount_due_cents == 0), issued_by_user_id = actor X-User-ID"
          - "create TimelineCommitment PROPOSED via commitment_dates calculation (base_date = today)"
          - "application DESIGN→QUOTED with quote_valid_until = today + 30"
          - "version += 1"
      - from: QUOTED
        to: ACCEPTED
        trigger: "POST /main-extensions/{id}/accept-quote"
        actor: Builder
        preconditions:
          - "acting Builder owns the parent application (else ERR_FORBIDDEN_OWNER)"
          - "current date <= parent.quote_valid_until (else ERR_QUOTE_EXPIRED)"
        side_effects:
          - "application QUOTED→CIAC_PENDING; if invoice amount_due == 0 the zero-CIAC chain fires (invoice ISSUED→PAID → application CIAC_PENDING→APPROVED_FOR_CONSTRUCTION)"
          - "version += 1"
      - from: QUOTED
        to: DRAFT
        trigger: "POST /main-extensions/{id}/revise"
        actor: DesignEngineer
        preconditions:
          - "expected_main_extension_version == version (else ERR_STALE_VERSION, 412)"
          - "CIACInvoice.payments_applied_cents == 0 (else ERR_INVOICE_HAS_PAYMENTS)"
        side_effects:
          - "CIACInvoice ISSUED → VOID"
          - "TimelineCommitment PROPOSED → CANCELLED"
          - "application QUOTED → DESIGN, quote_valid_until cleared"
          - "recompute provisional_* fields from (possibly updated) design inputs"
          - "version += 1"
      - from: QUOTED
        to: EXPIRED
        trigger: "system sweep (application QUOTED→EXPIRED)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: ACCEPTED
        to: CONSTRUCTED
        trigger: "system (on CrewBooking CONFIRMED→COMPLETED for the parent application)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: CONSTRUCTED
        to: AS_BUILT_RECORDED
        trigger: "POST /main-extensions/{id}/record-as-built"
        actor: FieldSupervisor
        preconditions: ["parent application spine status is SERVICE_INSTALLED or later (else ERR_INVALID_STATE)"]
        side_effects: ["version += 1"]
      - from: AS_BUILT_RECORDED
        to: FINALIZED
        trigger: "POST /main-extensions/{id}/finalize"
        actor: BillingClerk
        preconditions: []
        side_effects:
          - "run ciac_final_true_up: compute final_* and ciac_delta_cents"
          - "invoice true-up: PAID & delta > 0 → ISSUED with amount_due_cents = final_total_due_cents; PAID & delta < 0 → REFUND_PENDING with refund_required_cents = −delta; PAID & delta == 0 → SETTLED; unpaid ISSUED → stays ISSUED with amount_due_cents repriced to final_total_due_cents"
          - "version += 1"
      - from: ANY_NON_TERMINAL
        to: CANCELLED
        trigger: "system (application cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]

  - entity: CIACInvoice
    initial_state: ISSUED
    terminal_states: [SETTLED, REFUNDED, VOID]
    transitions:
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /ciac-invoices/{id}/payments with amount_cents < balance_due_cents"
        actor: BillingClerk
        preconditions:
          - "actor X-User-ID != issued_by_user_id (else ERR_SOD_PAYMENT_BY_ISSUER)"
          - "amount_cents <= balance_due_cents (else ERR_OVERPAYMENT)"
        side_effects: ["payments_applied_cents += amount_cents", "create CIACPayment(PAYMENT)", "version += 1"]
      - from: ISSUED
        to: PAID
        trigger: "POST /ciac-invoices/{id}/payments with amount_cents == balance_due_cents"
        actor: BillingClerk
        preconditions: ["same as ISSUED→PARTIALLY_PAID"]
        side_effects:
          - "payments_applied_cents += amount_cents; create CIACPayment(PAYMENT)"
          - "application CIAC_PENDING→APPROVED_FOR_CONSTRUCTION (bubble-up)"
          - "version += 1"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /ciac-invoices/{id}/payments with amount_cents == balance_due_cents"
        actor: BillingClerk
        preconditions: ["same as ISSUED→PARTIALLY_PAID"]
        side_effects: ["same as ISSUED→PAID"]
      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /ciac-invoices/{id}/payments with amount_cents < balance_due_cents"
        actor: BillingClerk
        preconditions: ["same as ISSUED→PARTIALLY_PAID"]
        side_effects: ["payments_applied_cents += amount_cents", "create CIACPayment(PAYMENT)", "version += 1"]
      - from: ISSUED
        to: VOID
        trigger: "system (MainExtension revise / application cancel / quote expiry) — requires payments_applied_cents == 0"
        actor: system
        preconditions: ["payments_applied_cents == 0"]
        side_effects: ["version += 1"]
      - from: PARTIALLY_PAID
        to: REFUND_PENDING
        trigger: "system (application cancel or quote expiry unwind)"
        actor: system
        preconditions: []
        side_effects: ["refund_required_cents = payments_applied_cents", "version += 1"]
      - from: PAID
        to: ISSUED
        trigger: "system (finalize true-up with ciac_delta_cents > 0)"
        actor: system
        preconditions: []
        side_effects: ["amount_due_cents = final_total_due_cents", "version += 1"]
      - from: PAID
        to: REFUND_PENDING
        trigger: "system (finalize true-up with ciac_delta_cents < 0; or application cancel)"
        actor: system
        preconditions: []
        side_effects: ["refund_required_cents = −ciac_delta_cents (finalize) or payments_applied_cents (cancel)", "version += 1"]
      - from: PAID
        to: SETTLED
        trigger: "system (finalize true-up with ciac_delta_cents == 0)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: REFUND_PENDING
        to: REFUNDED
        trigger: "POST /ciac-invoices/{id}/refunds bringing refunds_issued_cents == refund_required_cents"
        actor: BillingClerk
        preconditions:
          - "actor X-User-ID != recorded_by_user_id of every POSTED PAYMENT on this invoice (else ERR_SOD_REFUND_BY_PAYER)"
          - "amount_cents <= refund_required_cents − refunds_issued_cents (else ERR_REFUND_AMOUNT_MISMATCH); partial refunds allowed, invoice stays REFUND_PENDING until fully refunded"
        side_effects: ["refunds_issued_cents += amount_cents", "create CIACPayment(REFUND)", "version += 1"]
      - from: REFUND_PENDING
        to: REFUND_PENDING
        trigger: "POST /ciac-invoices/{id}/refunds (partial)"
        actor: BillingClerk
        preconditions: ["same as REFUND_PENDING→REFUNDED"]
        side_effects: ["same as REFUND_PENDING→REFUNDED"]

  - entity: Permit
    initial_state: DRAFT
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /permits/{id}/file"
        actor: PermitCoordinator
        preconditions: ["parent application hold_status == NOT_HELD", "permit_type == ROAD_CUT ⇒ crossings non-empty (else ERR_INVALID_REQUEST)"]
        side_effects: ["filed_at = now", "application APPROVED_FOR_CONSTRUCTION→PERMITTING if currently APPROVED_FOR_CONSTRUCTION", "version += 1"]
      - from: FILED
        to: APPROVED
        trigger: "POST /permits/{id}/record-decision {decision: APPROVED, expires_at}"
        actor: PermitCoordinator
        preconditions: ["expires_at present and >= current date (else ERR_DATE_IN_PAST)"]
        side_effects: ["decided_at = now", "version += 1"]
      - from: FILED
        to: REJECTED
        trigger: "POST /permits/{id}/record-decision {decision: REJECTED, decision_note}"
        actor: PermitCoordinator
        preconditions: []
        side_effects: ["decided_at = now", "version += 1"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /permits/{id}/amend"
        actor: PermitCoordinator
        preconditions: []
        side_effects: ["recompute permit_fee_cents if crossings changed", "version += 1"]
      - from: EXPIRED
        to: DRAFT
        trigger: "POST /permits/{id}/amend"
        actor: PermitCoordinator
        preconditions: []
        side_effects: ["recompute permit_fee_cents if crossings changed", "version += 1"]
      - from: APPROVED
        to: EXPIRED
        trigger: "system sweep (POST /_clock/set_current_utc) when current date > expires_at"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: APPROVED
        to: CLOSED
        trigger: "POST /permits/{id}/close"
        actor: PermitCoordinator
        preconditions: ["parent application spine status is SERVICE_INSTALLED or later (else ERR_INVALID_STATE)"]
        side_effects: ["version += 1"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system (application cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: FILED
        to: WITHDRAWN
        trigger: "system (application cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]

  - entity: CrewBooking
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /crew-bookings/{id}/confirm"
        actor: FieldSupervisor
        preconditions:
          - "work_date >= current date (else ERR_DATE_IN_PAST)"
          - "crew.active == true (else ERR_INVALID_STATE)"
          - "no buffered-overlap with any CONFIRMED booking of the same crew on the same work_date (else ERR_CREW_WINDOW_CONFLICT) — buffered closed-interval semantics, see validations"
          - "Σ(duration of CONFIRMED bookings of this crew on work_date) + duration <= crew.daily_capacity_minutes (else ERR_CREW_CAPACITY_EXCEEDED)"
        side_effects: ["version += 1"]
      - from: CONFIRMED
        to: REQUESTED
        trigger: "POST /crew-bookings/{id}/reschedule (new window stored; must be re-confirmed)"
        actor: FieldSupervisor
        preconditions: []
        side_effects: ["work_date/start_minute/end_minute replaced", "version += 1"]
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /crew-bookings/{id}/complete"
        actor: FieldSupervisor
        preconditions: []
        side_effects:
          - "application CONSTRUCTION_SCHEDULED→SERVICE_INSTALLED"
          - "MainExtension ACCEPTED→CONSTRUCTED"
          - "version += 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /crew-bookings/{id}/cancel or application cancel cascade"
        actor: FieldSupervisor
        preconditions: []
        side_effects: ["version += 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /crew-bookings/{id}/cancel or application cancel cascade"
        actor: FieldSupervisor
        preconditions: []
        side_effects: ["crew-day confirmed minutes released (capacity restored)", "version += 1"]

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [COMPLETED_PASS, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED_PASS
        trigger: "POST /inspections/{id}/record-result {result: PASS}"
        actor: Inspector
        preconditions: ["actor X-User-ID == inspection.inspector_id (else ERR_FORBIDDEN_OWNER)"]
        side_effects: ["version += 1"]
      - from: SCHEDULED
        to: COMPLETED_FAIL
        trigger: "POST /inspections/{id}/record-result {result: FAIL}"
        actor: Inspector
        preconditions: ["actor X-User-ID == inspection.inspector_id (else ERR_FORBIDDEN_OWNER)"]
        side_effects: ["version += 1"]
      - from: COMPLETED_FAIL
        to: SCHEDULED
        trigger: "POST /inspections/{id}/reschedule (re-validates window, certification, date)"
        actor: PermitCoordinator
        preconditions: ["same creation-time window checks"]
        side_effects: ["version += 1"]
      - from: EXPIRED
        to: SCHEDULED
        trigger: "POST /inspections/{id}/reschedule"
        actor: PermitCoordinator
        preconditions: ["same creation-time window checks"]
        side_effects: ["version += 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /inspections/{id}/cancel or application cancel cascade"
        actor: PermitCoordinator
        preconditions: []
        side_effects: ["version += 1"]
      - from: SCHEDULED
        to: EXPIRED
        trigger: "system sweep when current date > inspection_date"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
    note: "COMPLETED_FAIL is non-terminal so the fail→reschedule→re-inspect loop can cycle; COMPLETED_PASS is terminal."

  - entity: MeterSet
    initial_state: PLANNED
    terminal_states: [ENERGIZED, CANCELLED]
    transitions:
      - from: PLANNED
        to: SIZED
        trigger: "POST /meter-sets/{id}/size"
        actor: DesignEngineer
        preconditions:
          - "parent application spine status is LOAD_CONFIRMED or later (loads locked) (else ERR_INVALID_STATE)"
          - "a meter model exists whose pressure-adjusted capacity >= application.diversity_adjusted_load_cfph (else ERR_METER_SIZE_UNAVAILABLE)"
        side_effects: ["run meter_sizing: set meter_model + regulator_model", "version += 1"]
      - from: SIZED
        to: ORDERED
        trigger: "POST /meter-sets/{id}/mark-ordered {serial_number}"
        actor: MeterTechnician
        preconditions: []
        side_effects: ["version += 1"]
      - from: ORDERED
        to: INSTALLED
        trigger: "POST /meter-sets/{id}/install"
        actor: MeterTechnician
        preconditions: ["parent application.status == SERVICE_INSTALLED (else ERR_SERVICE_LINE_NOT_INSTALLED)"]
        side_effects:
          - "installed_by_user_id = actor X-User-ID; installed_at = now"
          - "application SERVICE_INSTALLED→METER_WORK"
          - "version += 1"
      - from: INSTALLED
        to: TESTING
        trigger: "system (on POST /purge-leak-tests success)"
        actor: system
        preconditions: ["no other PurgeLeakTest of this meter set is RECORDED (else ERR_TEST_ALREADY_ACTIVE)"]
        side_effects: ["application METER_WORK→TESTING", "version += 1"]
      - from: TESTING
        to: READY_FOR_TURN_ON
        trigger: "system (on PurgeLeakTest CERTIFIED with result == PASS)"
        actor: system
        preconditions: []
        side_effects: ["application TESTING→TURN_ON", "version += 1"]
      - from: TESTING
        to: REPAIR
        trigger: "system (on PurgeLeakTest CERTIFIED with result == FAIL)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: REPAIR
        to: INSTALLED
        trigger: "POST /meter-sets/{id}/mark-repaired"
        actor: MeterTechnician
        preconditions: []
        side_effects: ["version += 1"]
      - from: READY_FOR_TURN_ON
        to: ENERGIZED
        trigger: "system (on application TURN_ON→ENERGIZED)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: ANY_NON_TERMINAL
        to: CANCELLED
        trigger: "system (application cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["its RECORDED PurgeLeakTests → REJECTED", "version += 1"]

  - entity: PurgeLeakTest
    initial_state: RECORDED
    terminal_states: [CERTIFIED, REJECTED]
    transitions:
      - from: RECORDED
        to: CERTIFIED
        trigger: "POST /purge-leak-tests/{id}/certify"
        actor: Inspector
        preconditions:
          - "witness Inspector.certifications contains PRESSURE_TEST (else ERR_INSPECTOR_NOT_CERTIFIED)"
          - "witness Inspector.id != installer_user_id (else ERR_SOD_WITNESS_IS_INSTALLER)"
        side_effects:
          - "witness_inspector_id = actor X-User-ID"
          - "result == PASS: MeterSet TESTING→READY_FOR_TURN_ON (link 1) which bubbles application TESTING→TURN_ON (link 2)"
          - "result == FAIL: MeterSet TESTING→REPAIR"
          - "version += 1"
      - from: RECORDED
        to: REJECTED
        trigger: "POST /purge-leak-tests/{id}/reject {rejection_reason} or application cancel cascade"
        actor: Inspector
        preconditions: []
        side_effects: ["MeterSet remains TESTING (a new PurgeLeakTest may be recorded)", "version += 1"]

  - entity: TurnOnEvent
    initial_state: SCHEDULED
    terminal_states: [VERIFIED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: VERIFIED
        trigger: "POST /turn-on-events/{id}/complete (safety result computed: !odor && ignition && venting && co_reading_ppm < 9.0)"
        actor: MeterTechnician
        preconditions: ["parent application.status == TURN_ON (else ERR_METER_NOT_READY)"]
        side_effects: ["version += 1"]
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /turn-on-events/{id}/complete (any safety check fails or co_reading_ppm >= 9.0)"
        actor: MeterTechnician
        preconditions: ["parent application.status == TURN_ON (else ERR_METER_NOT_READY)"]
        side_effects: ["version += 1"]
      - from: FAILED
        to: SCHEDULED
        trigger: "POST /turn-on-events/{id}/retry"
        actor: MeterTechnician
        preconditions: []
        side_effects: ["version += 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (application cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: FAILED
        to: CANCELLED
        trigger: "system (application cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]

  - entity: TimelineCommitment
    initial_state: PROPOSED
    terminal_states: [MET, MISSED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /timeline-commitments/{id}/accept"
        actor: Builder
        preconditions: ["acting Builder owns the parent application"]
        side_effects: ["version += 1"]
      - from: ACCEPTED
        to: REVISION_PENDING
        trigger: "POST /timeline-commitments/{id}/propose-revision {requested_completion_date, expected_commitment_version}"
        actor: Builder
        preconditions:
          - "expected_commitment_version == version (else ERR_STALE_VERSION, 412)"
          - "requested_completion_date > current date (else ERR_DATE_IN_PAST)"
        side_effects: ["version += 1"]
      - from: REVISION_PENDING
        to: ACCEPTED
        trigger: "POST /timeline-commitments/{id}/respond-revision {decision: ACCEPT}"
        actor: NewBusinessRep
        preconditions: []
        side_effects: ["committed_completion_date = requested_completion_date; requested_completion_date cleared", "version += 1"]
      - from: REVISION_PENDING
        to: ACCEPTED
        trigger: "POST /timeline-commitments/{id}/respond-revision {decision: REJECT}"
        actor: NewBusinessRep
        preconditions: []
        side_effects: ["committed_completion_date unchanged; requested_completion_date cleared", "version += 1"]
      - from: ACCEPTED
        to: AT_RISK
        trigger: "POST /timeline-commitments/{id}/mark-delayed {delay_attribution, expected_completion_date}"
        actor: NewBusinessRep
        preconditions: []
        side_effects: ["version += 1"]
      - from: AT_RISK
        to: AT_RISK
        trigger: "POST /timeline-commitments/{id}/mark-delayed (attribution/date update)"
        actor: NewBusinessRep
        preconditions: []
        side_effects: ["version += 1"]
      - from: ACCEPTED
        to: MISSED
        trigger: "system sweep when current date > committed_completion_date and application not COMPLETED"
        actor: system
        preconditions: []
        side_effects: ["delay_attribution = UTILITY if unset", "version += 1"]
      - from: AT_RISK
        to: MISSED
        trigger: "system sweep when current date > committed_completion_date and application not COMPLETED"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: ACCEPTED
        to: MET
        trigger: "system (application → COMPLETED with completed date <= committed_completion_date)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: AT_RISK
        to: MET
        trigger: "system (application → COMPLETED with completed date <= committed_completion_date)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: ACCEPTED
        to: MISSED
        trigger: "system (application → COMPLETED with completed date > committed_completion_date)"
        actor: system
        preconditions: []
        side_effects: ["delay_attribution = UTILITY if unset; run delay_penalty_credit", "version += 1"]
      - from: PROPOSED
        to: CANCELLED
        trigger: "system (MainExtension revise or application cancel/expire cascade)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: ACCEPTED
        to: CANCELLED
        trigger: "system (application cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: REVISION_PENDING
        to: CANCELLED
        trigger: "system (application cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: AT_RISK
        to: CANCELLED
        trigger: "system (application cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]

  - entity: GISAsBuilt
    initial_state: SUBMITTED
    terminal_states: [VALIDATED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: VALIDATED
        trigger: "POST /gis-as-builts/{id}/validate"
        actor: GISAnalyst
        preconditions: ["depth_inches >= MIN_COVER_DEPTH_IN(18) (else ERR_GIS_DEPTH_VIOLATION)"]
        side_effects: ["validated_by_user_id = actor X-User-ID", "version += 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /gis-as-builts/{id}/reject {rejection_reason}"
        actor: GISAnalyst
        preconditions: []
        side_effects: ["version += 1"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /gis-as-builts/{id}/resubmit (updated geometry/depth)"
        actor: FieldSupervisor
        preconditions: []
        side_effects: ["version += 1"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "system (application cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]
      - from: REJECTED
        to: CANCELLED
        trigger: "system (application cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: appliance-load-update-stale
    parent_entity: ApplianceLoad
    write_endpoint: "PATCH /appliance-loads/{id}"
    occ_field: "expected_load_version"
    description: |
      Updating an ApplianceLoad whose version has advanced since the client
      last observed it is rejected. This captures the case where another writer
      has just edited the same load row (each successful edit legitimately
      replaces the prior values and bumps version), so the current writer's
      view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: application-patch-stale
    parent_entity: ServiceApplication
    write_endpoint: "PATCH /service-applications/{id}"
    occ_field: "expected_application_version"
    description: |
      Editing DRAFT application header fields against a version that has since
      advanced (e.g., another writer already patched the same draft) is
      rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: commitment-revision-stale
    parent_entity: TimelineCommitment
    write_endpoint: "POST /timeline-commitments/{id}/propose-revision"
    occ_field: "expected_commitment_version"
    description: |
      Proposing a commitment revision carrying an expected_commitment_version
      that no longer matches the commitment's current version is rejected,
      even when the commitment has since returned to ACCEPTED (a propose →
      reject round-trip restores the state but not the version), so the
      stale view cannot silently supersede the newer one.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: load_calculation
    description: "Connected + diversity-adjusted gas load for a ServiceApplication"
    trigger: "POST /service-applications/{id}/submit (persisted on the application); ApplianceLoad.counted_load_cfph recomputed per row at POST/PATCH"
    inputs: [ApplianceLoad.quantity, ApplianceLoad.btuh_input_rating, appliance_count]
    algorithm: aggregation
    formula: |
      per row: counted_load_cfph = round_half_up(quantity × btuh_input_rating / BTU_PER_CFH, 1)
      total_connected_load_cfph = round_half_up(Σ counted_load_cfph over ALL ApplianceLoad rows of the application, 1)
      n = appliance_count (number of ApplianceLoad rows, not quantities)
      diversity_factor = 1.00 if n == 1; 0.85 if 2 <= n <= 3; 0.75 if 4 <= n <= 6; 0.65 if n >= 7
      diversity_adjusted_load_cfph = round_half_up(total_connected_load_cfph × diversity_factor, 1)
    constants:
      BTU_PER_CFH: 1000
    precision: "1 decimal place, round_half_up"
    input_set: "all ApplianceLoad rows whose service_application_id == application.id (no status filter — rows are immutable after LOAD_CONFIRMED and deleted rows are gone)"

  - name: meter_sizing
    description: "Smallest meter model whose pressure-adjusted capacity covers the diversity-adjusted load; regulator is paired 1:1"
    trigger: "POST /meter-sets/{id}/size"
    inputs: [ServiceApplication.diversity_adjusted_load_cfph, ServiceApplication.pressure_class_requested]
    algorithm: threshold
    formula: |
      capacity(model) = BASE_CAPACITY_CFPH[model] × (PRESSURE_MEDIUM_MULTIPLIER if pressure_class_requested == MEDIUM else 1)
      selected = the model with the smallest capacity such that capacity >= diversity_adjusted_load_cfph
      (equality SELECTS that model: capacity == load ⇒ that model, not the next size up)
      regulator_model = PAIRED_REGULATOR[selected]
      if no model satisfies: reject with ERR_METER_SIZE_UNAVAILABLE
    constants:
      BASE_CAPACITY_CFPH: {AL_425: 425, AL_800: 800, AL_1400: 1400, AL_2300: 2300, AL_5000: 5000}
      PAIRED_REGULATOR: {AL_425: R_325, AL_800: R_750, AL_1400: R_1200, AL_2300: R_2100, AL_5000: R_4500}
      PRESSURE_MEDIUM_MULTIPLIER: 2.0
    precision: "capacities are integers; comparison at exact equality"
    input_set: "single application row"

  - name: ciac_provisional
    description: "Provisional contribution-in-aid-of-construction at design time; evaluation order pinned (gross-up base is the net AFTER allowance)"
    trigger: "POST /main-extensions (and recompute on /revise)"
    inputs: [design_footage_ft, crossings, rock_excavation_expected, appliance_count]
    algorithm: constraint_propagation
    formula: |
      (1) allowance_ft = BASE_ALLOWANCE_FT + ALLOWANCE_FT_PER_APPLIANCE × appliance_count
      (2) base_cost = design_footage_ft × STANDARD_UNIT_COST_CENTS_PER_FT
      (3) surcharges = len(crossings) × CROSSING_SURCHARGE_CENTS + (rock_excavation_expected ? design_footage_ft × ROCK_SURCHARGE_CENTS_PER_FT : 0)
      (4) net_ciac = max(0, base_cost + surcharges − allowance_ft × STANDARD_UNIT_COST_CENTS_PER_FT)
      (5) gross_up = round_half_up(net_ciac × GROSS_UP_NUM / GROSS_UP_DEN, 0)   # 21/79 tax gross-up on the NET only
      (6) total_due = net_ciac + gross_up
      Evaluation order is contractual: the gross-up base never includes the allowance offset,
      and the allowance value is always priced at the STANDARD unit cost even in the final variant.
    constants:
      BASE_ALLOWANCE_FT: 100
      ALLOWANCE_FT_PER_APPLIANCE: 25
      STANDARD_UNIT_COST_CENTS_PER_FT: 4500
      CROSSING_SURCHARGE_CENTS: 15000
      ROCK_SURCHARGE_CENTS_PER_FT: 2000
      GROSS_UP_NUM: 21
      GROSS_UP_DEN: 79
    precision: "integer cents; round_half_up at step (5) only"
    input_set: "single MainExtension + its application's appliance_count"
    variants:
      - name: provisional
        when: "design time (POST /main-extensions, /revise, /approve-design)"
        difference: "uses design_footage_ft, standard unit cost 4500, design crossings count, expected rock flag"
      - name: final
        when: "POST /main-extensions/{id}/finalize"
        difference: "uses actual_footage_ft, actual_unit_cost_cents, len(actual_crossings), actual_rock_excavation; same allowance formula (appliance-count driven) priced at the STANDARD rate"

  - name: ciac_final_true_up
    description: "Final CIAC from as-built values and the reconciliation against what was already collected"
    trigger: "POST /main-extensions/{id}/finalize"
    inputs: [actual_footage_ft, actual_unit_cost_cents, actual_crossings, actual_rock_excavation, allowance_ft, provisional_total_due_cents, CIACInvoice.payments_applied_cents]
    algorithm: constraint_propagation
    formula: |
      final_base = actual_footage_ft × actual_unit_cost_cents
      final_surcharges = len(actual_crossings) × CROSSING_SURCHARGE_CENTS + (actual_rock_excavation ? actual_footage_ft × ROCK_SURCHARGE_CENTS_PER_FT : 0)
      final_net = max(0, final_base + final_surcharges − allowance_ft × STANDARD_UNIT_COST_CENTS_PER_FT)
      final_gross_up = round_half_up(final_net × GROSS_UP_NUM / GROSS_UP_DEN, 0)
      final_total = final_net + final_gross_up
      ciac_delta_cents = final_total − provisional_total_due_cents
      invoice effect (status PAID): delta > 0 → ISSUED, amount_due = final_total (balance = final_total − payments);
        delta < 0 → REFUND_PENDING, refund_required = payments_applied − final_total;
        delta == 0 → SETTLED.
      invoice effect (status ISSUED, unpaid): amount_due repriced to final_total, stays ISSUED.
    constants:
      CROSSING_SURCHARGE_CENTS: 15000
      ROCK_SURCHARGE_CENTS_PER_FT: 2000
      STANDARD_UNIT_COST_CENTS_PER_FT: 4500
      GROSS_UP_NUM: 21
      GROSS_UP_DEN: 79
    precision: "integer cents; round_half_up at gross-up only"
    input_set: "single MainExtension + its CIACInvoice"

  - name: permit_fee
    description: "Road-cut restoration fee; ROUNDING ORDER IS PINNED: round each segment to whole cents FIRST, then sum, then add the flat filing fee"
    trigger: "POST /permits (and recompute on /amend when crossings change)"
    inputs: [crossings]
    algorithm: tiered_pricing
    formula: |
      segment_fee(segment) = round_half_up(length_ft × width_ft × SURFACE_RATE_CENTS_PER_SQFT[surface_type], 0)
      permit_fee_cents = Σ segment_fee over crossings + FILING_FEE_CENTS
      (the alternative order — sum raw segment fees then round once — yields different cents and is NOT the contract)
    constants:
      SURFACE_RATE_CENTS_PER_SQFT: {ASPHALT: 350, CONCRETE: 525, LANDSCAPE: 150}
      FILING_FEE_CENTS: 7500
    precision: "whole cents per segment, round_half_up"
    input_set: "crossings array of the Permit"

  - name: leak_test_acceptance
    description: "Maximum allowable pressure drop for a documented leak test"
    trigger: "POST /purge-leak-tests (result computed at record time)"
    inputs: [test_duration_min, observed_pressure_drop_psi]
    algorithm: threshold
    formula: |
      max_allowed_drop_psi = round_half_up(ALLOW_REF_DROP_PSI × ALLOW_REF_DURATION_MIN / test_duration_min, 3)
      result = PASS iff observed_pressure_drop_psi <= max_allowed_drop_psi   # equality PASSES
      result = FAIL iff observed_pressure_drop_psi >  max_allowed_drop_psi
    constants:
      ALLOW_REF_DROP_PSI: 0.300
      ALLOW_REF_DURATION_MIN: 60
    precision: "3 decimal places, round_half_up, comparison at 3-decimal equality"
    input_set: "single PurgeLeakTest row"

  - name: commitment_dates
    description: "Proposed builder-commitment dates — TWO VARIANTS computed and stored side by side"
    trigger: "MainExtension DESIGN_SUBMITTED→QUOTED (approve-design)"
    inputs: [MainExtension.design_footage_ft, MainExtension.crossings_count, base_date]
    algorithm: forward_looking
    formula: |
      permit_required = (crossings_count > 0)
      optimistic_days  = (permit_required ? PERMIT_MIN_DAYS    : 0) + ceil(design_footage_ft / CONSTRUCTION_FT_PER_DAY_OPTIMISTIC)     + METER_SET_DAYS
      conservative_days= (permit_required ? PERMIT_MEDIAN_DAYS : 0) + ceil(design_footage_ft / CONSTRUCTION_FT_PER_DAY_CONSERVATIVE) + METER_SET_DAYS + CONSERVATIVE_BUFFER_DAYS
      optimistic_completion_date    = base_date + optimistic_days  (calendar days)
      conservative_completion_date  = base_date + conservative_days
      committed_completion_date     = conservative_completion_date
    constants:
      PERMIT_MIN_DAYS: 10
      PERMIT_MEDIAN_DAYS: 20
      CONSTRUCTION_FT_PER_DAY_OPTIMISTIC: 150
      CONSTRUCTION_FT_PER_DAY_CONSERVATIVE: 100
      METER_SET_DAYS: 5
      CONSERVATIVE_BUFFER_DAYS: 5
    precision: "whole ISO dates, calendar-day arithmetic"
    input_set: "the MainExtension being approved + current logical date"
    variants:
      - name: optimistic
        when: "stored on TimelineCommitment.optimistic_completion_date"
        difference: "statutory-minimum permit days (10), faster construction rate (150 ft/day), zero buffer"
      - name: conservative
        when: "stored on conservative_completion_date and used as committed_completion_date"
        difference: "jurisdiction-median permit days (20), slower construction rate (100 ft/day), +5 day buffer — always >= optimistic, strictly greater whenever the footage or permit terms differ"

  - name: delay_penalty_credit
    description: "Builder penalty credit when the utility misses the committed completion date"
    trigger: "application → COMPLETED with completed date > committed_completion_date and delay_attribution == UTILITY"
    inputs: [committed_completion_date, completed_at, delay_attribution]
    algorithm: tiered_pricing
    formula: |
      days_late = calendar_days(completed_date − committed_completion_date); 0 or negative ⇒ MET, no penalty
      daily_credit = 2500 for each of the first 5 late days; 5000 for each late day beyond 5
      penalty_credit_cents = min(MAX_CREDIT_CENTS, min(days_late, 5) × 2500 + max(0, days_late − 5) × 5000)
      applied only when delay_attribution == UTILITY; otherwise 0
    constants:
      MAX_CREDIT_CENTS: 50000
    precision: "integer cents"
    input_set: "single TimelineCommitment + application completed_at"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a declared role; X-User-ID header present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "acting role is in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "ownership: Builder actor's X-User-ID == resource's builder_id; Inspector actor's X-User-ID == inspection.inspector_id on record-result"
    error_id: ERR_FORBIDDEN_OWNER
    http_status: 403
    applies_to: "builder-scoped mutations (submit, hold, resume, cancel, appliance-load writes, accept-quote, commitment accept/propose-revision); inspections record-result"
  - priority: 4
    category: existence
    check: "path ids and body FK references exist, validated left-to-right (path first, then body fields in declared order); each entity has its own 404 id: ERR_BUILDER_NOT_FOUND, ERR_APPLICATION_NOT_FOUND, ERR_LOAD_NOT_FOUND, ERR_MAIN_EXTENSION_NOT_FOUND, ERR_INVOICE_NOT_FOUND, ERR_PAYMENT_NOT_FOUND, ERR_PERMIT_NOT_FOUND, ERR_CREW_NOT_FOUND, ERR_BOOKING_NOT_FOUND, ERR_INSPECTOR_NOT_FOUND, ERR_INSPECTION_NOT_FOUND, ERR_METER_SET_NOT_FOUND, ERR_TEST_NOT_FOUND, ERR_TURN_ON_NOT_FOUND, ERR_COMMITMENT_NOT_FOUND, ERR_GIS_NOT_FOUND"
    error_id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path or body references"
  - priority: 5
    category: state
    check: "optimistic concurrency: expected_*_version in body == current version of the target entity"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /appliance-loads/{id}, PATCH /service-applications/{id}, POST /timeline-commitments/{id}/propose-revision"
  - priority: 6
    category: state
    check: "application posture gates: terminal spine status blocks every child mutation (ERR_APPLICATION_TERMINAL); hold_status != NOT_HELD blocks every child mutation and spine transition (ERR_APPLICATION_ON_HOLD)"
    error_id: ERR_APPLICATION_TERMINAL | ERR_APPLICATION_ON_HOLD
    http_status: 409
    applies_to: "all child-entity mutations and all spine transition endpoints"
  - priority: 7
    category: state
    check: "entity state machine permits the requested transition from its current state (including ERR_INVOICE_NOT_PAYABLE, ERR_INVOICE_NOT_REFUNDABLE, ERR_COMMITMENT_NOT_REVISABLE, ERR_SERVICE_LINE_NOT_INSTALLED, ERR_METER_NOT_READY family)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 8
    category: business_safety
    check: "purge_duration_min >= 5 AND test_pressure_psi >= 10.0 AND test_duration_min >= 15; segregation of duties: payment clerk != invoice issuer (ERR_SOD_PAYMENT_BY_ISSUER); purge/leak witness != installer (ERR_SOD_WITNESS_IS_INSTALLER); refund clerk != any payment clerk on the invoice (ERR_SOD_REFUND_BY_PAYER); GIS cover depth >= 18 in (ERR_GIS_DEPTH_VIOLATION, raised at validate)"
    error_id: ERR_TEST_PARAMS_UNSAFE | ERR_SOD_PAYMENT_BY_ISSUER | ERR_SOD_WITNESS_IS_INSTALLER | ERR_SOD_REFUND_BY_PAYER | ERR_GIS_DEPTH_VIOLATION
    http_status: 422
    applies_to: "POST /purge-leak-tests, POST /purge-leak-tests/{id}/certify, POST /ciac-invoices/{id}/payments, POST /ciac-invoices/{id}/refunds, POST /gis-as-builts/{id}/validate"
  - priority: 9
    category: business_temporal
    check: "quote not expired (accept-quote: today <= quote_valid_until → else ERR_QUOTE_EXPIRED); booking/inspection/commitment dates not in the past (ERR_DATE_IN_PAST)"
    error_id: ERR_QUOTE_EXPIRED | ERR_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /main-extensions/{id}/accept-quote, POST /crew-bookings/{id}/confirm, POST /inspections, POST /inspections/{id}/reschedule, POST /timeline-commitments/{id}/propose-revision, POST /permits/{id}/record-decision"
  - priority: 10
    category: business_constraint
    check: "uniqueness (one non-CANCELLED MainExtension / MeterSet / GISAsBuilt / non-CANCELLED TimelineCommitment per application); loads locked after LOAD_CONFIRMED (ERR_LOADS_LOCKED); at most one RECORDED PurgeLeakTest per meter set (ERR_TEST_ALREADY_ACTIVE); inspector certification covers inspection type (ERR_INSPECTOR_NOT_CERTIFIED); crew/inspector window overlap (ERR_CREW_WINDOW_CONFLICT / ERR_INSPECTOR_WINDOW_CONFLICT); crew daily capacity (ERR_CREW_CAPACITY_EXCEEDED); meter size exists (ERR_METER_SIZE_UNAVAILABLE); builder ACTIVE for create/submit (ERR_BUILDER_SUSPENDED); appliance_count >= 1 at submit (ERR_NO_APPLIANCE_LOADS); revise blocked once payments exist (ERR_INVOICE_HAS_PAYMENTS)"
    error_id: ERR_CONSTRAINT_FAMILY
    http_status: 409
    applies_to: "create + action endpoints as listed"
  - priority: 11
    category: business_referential
    check: "cross-entity state gates: all Permits APPROVED/CLOSED and ROAD_CUT covered (ERR_PERMIT_NOT_APPROVED); a CONFIRMED CrewBooking exists (ERR_NO_CONFIRMED_BOOKING); every ApplianceLoad has a VERIFIED TurnOnEvent (ERR_TURN_ON_INCOMPLETE); a VALIDATED GISAsBuilt exists (ERR_GIS_NOT_VALIDATED); TurnOnEvent.appliance_load_id belongs to the same application (ERR_LOAD_APP_MISMATCH)"
    error_id: ERR_REFERENTIAL_FAMILY
    http_status: 422
    applies_to: "schedule-construction, energize, complete, POST /turn-on-events"
  - priority: 12
    category: business_fiscal
    check: "CIAC gates and money rules: invoice PAID before schedule-construction / SETTLED-or-REFUNDED before complete (ERR_CIAC_UNPAID); payment amount <= balance_due (ERR_OVERPAYMENT); refund amount <= refund remaining (ERR_REFUND_AMOUNT_MISMATCH)"
    error_id: ERR_CIAC_UNPAID | ERR_OVERPAYMENT | ERR_REFUND_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "schedule-construction, complete, POST /ciac-invoices/{id}/payments, POST /ciac-invoices/{id}/refunds"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Builder ---
  - { method: POST, path: "/builders", description: "Register a builder account", roles: [NewBusinessRep, SystemAdmin], code: 201, input: [company_name, contact_email, license_number], output: Builder, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/builders/{id}", description: "Get one builder", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: [], output: Builder, side_effects: [] }
  - { method: GET, path: "/builders", description: "List builders (status? filter, paginated)", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "Builder[]", side_effects: [] }
  - { method: PATCH, path: "/builders/{id}", description: "Suspend/reactivate a builder", roles: [SystemAdmin], code: 200, input: [status], output: Builder, side_effects: ["version += 1"] }

  # --- ServiceApplication ---
  - { method: POST, path: "/service-applications", description: "Create a DRAFT new-service application", roles: [Builder], code: 201, input: [builder_id, service_address, city, state_code, postal_code, "pressure_class_requested?", requested_in_service_date], output: ServiceApplication, side_effects: ["status=DRAFT; builder must be ACTIVE else ERR_BUILDER_SUSPENDED"] }
  - { method: GET, path: "/service-applications/{id}", description: "Get one application", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: [], output: ServiceApplication, side_effects: [] }
  - { method: GET, path: "/service-applications", description: "List applications (builder_id?, status?; paginated)", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: ["builder_id?", "status?", "limit?", "offset?"], output: "ServiceApplication[]", side_effects: [] }
  - { method: PATCH, path: "/service-applications/{id}", description: "Edit DRAFT application header fields (OCC)", roles: [Builder], code: 200, input: [expected_application_version, "service_address?", "city?", "state_code?", "postal_code?", "requested_in_service_date?"], output: ServiceApplication, side_effects: ["increments ServiceApplication.version by 1; only while status == DRAFT (else ERR_INVALID_STATE)"] }
  - { method: POST, path: "/service-applications/{id}/submit", description: "Submit application: runs load calculation", roles: [Builder], code: 200, input: [], output: ServiceApplication, side_effects: ["DRAFT→SUBMITTED; run load_calculation"] }
  - { method: POST, path: "/service-applications/{id}/confirm-load", description: "Utility confirms the load calculation; locks loads", roles: [NewBusinessRep], code: 200, input: [], output: ServiceApplication, side_effects: ["SUBMITTED→LOAD_CONFIRMED"] }
  - { method: POST, path: "/service-applications/{id}/reject", description: "Reject a submitted application", roles: [NewBusinessRep], code: 200, input: [reason], output: ServiceApplication, side_effects: ["SUBMITTED→REJECTED"] }
  - { method: POST, path: "/service-applications/{id}/schedule-construction", description: "Gate-checked transition to CONSTRUCTION_SCHEDULED", roles: [FieldSupervisor], code: 200, input: [], output: ServiceApplication, side_effects: ["APPROVED_FOR_CONSTRUCTION|PERMITTING→CONSTRUCTION_SCHEDULED"] }
  - { method: POST, path: "/service-applications/{id}/energize", description: "Turn gas on after all turn-ons verified", roles: [MeterTechnician], code: 200, input: [], output: ServiceApplication, side_effects: ["TURN_ON→ENERGIZED; MeterSet→ENERGIZED"] }
  - { method: POST, path: "/service-applications/{id}/complete", description: "Close out the application; evaluates commitment outcome", roles: [NewBusinessRep], code: 200, input: [], output: ServiceApplication, side_effects: ["ENERGIZED|GIS_REVIEW→COMPLETED; commitment MET/MISSED + penalty"] }
  - { method: POST, path: "/service-applications/{id}/hold", description: "Place a hold (Builder → HELD_BY_BUILDER, internal → HELD_BY_UTILITY)", roles: [Builder, NewBusinessRep, FieldSupervisor], code: 200, input: [reason], output: ServiceApplication, side_effects: ["hold_status set; spine unchanged"] }
  - { method: POST, path: "/service-applications/{id}/resume", description: "Clear a hold", roles: [Builder, NewBusinessRep, FieldSupervisor], code: 200, input: [], output: ServiceApplication, side_effects: ["hold_status=NOT_HELD"] }
  - { method: POST, path: "/service-applications/{id}/cancel", description: "Cancel with full compensation cascade", roles: [Builder, NewBusinessRep], code: 200, input: [], output: ServiceApplication, side_effects: ["→CANCELLED; cascades per state machine"] }
  - { method: GET, path: "/service-applications/{id}/readiness", description: "Computed posture read. blockers entries drawn from the fixed vocabulary [CIAC_UNPAID, PERMIT_NOT_APPROVED, NO_CONFIRMED_BOOKING, METER_NOT_READY, TURN_ON_INCOMPLETE, GIS_NOT_VALIDATED, ON_HOLD]; readiness_posture = BLOCKED iff blockers non-empty else READY; counters derived live from child rows", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: [], output: "{ readiness_posture: string, blockers: string[], unpaid_ciac_cents: integer, open_permit_count: integer, confirmed_booking_count: integer, verified_turn_on_count: integer, active_load_count: integer, gis_validated: boolean }", side_effects: [] }

  # --- ApplianceLoad ---
  - { method: POST, path: "/appliance-loads", description: "Add an appliance load to a DRAFT/SUBMITTED application", roles: [Builder], code: 201, input: [service_application_id, appliance_type, quantity, btuh_input_rating], output: ApplianceLoad, side_effects: ["counted_load_cfph computed; rejected with ERR_LOADS_LOCKED once application is LOAD_CONFIRMED or later"] }
  - { method: GET, path: "/appliance-loads/{id}", description: "Get one load", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: [], output: ApplianceLoad, side_effects: [] }
  - { method: GET, path: "/appliance-loads", description: "List loads (service_application_id? filter)", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: ["service_application_id?", "limit?", "offset?"], output: "ApplianceLoad[]", side_effects: [] }
  - { method: PATCH, path: "/appliance-loads/{id}", description: "Edit a load (OCC; only while application is DRAFT)", roles: [Builder], code: 200, input: [expected_load_version, "quantity?", "btuh_input_rating?"], output: ApplianceLoad, side_effects: ["counted_load_cfph recomputed; increments ApplianceLoad.version by 1"] }
  - { method: DELETE, path: "/appliance-loads/{id}", description: "Remove a load (only while application is DRAFT)", roles: [Builder], code: 204, input: [], output: null, side_effects: ["row deleted"] }

  # --- MainExtension ---
  - { method: POST, path: "/main-extensions", description: "Create a main-extension design (provisional CIAC computed)", roles: [DesignEngineer], code: 201, input: [service_application_id, design_footage_ft, crossings, "rock_excavation_expected?"], output: MainExtension, side_effects: ["status=DRAFT; run ciac_provisional; application LOAD_CONFIRMED→DESIGN; ERR_DUPLICATE_MAIN_EXTENSION if a non-CANCELLED one exists"] }
  - { method: GET, path: "/main-extensions/{id}", description: "Get one main extension", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: [], output: MainExtension, side_effects: [] }
  - { method: GET, path: "/main-extensions", description: "List main extensions (service_application_id? filter)", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: ["service_application_id?", "limit?", "offset?"], output: "MainExtension[]", side_effects: [] }
  - { method: POST, path: "/main-extensions/{id}/submit-design", description: "Submit design for utility review", roles: [DesignEngineer], code: 200, input: [], output: MainExtension, side_effects: ["DRAFT→DESIGN_SUBMITTED"] }
  - { method: POST, path: "/main-extensions/{id}/approve-design", description: "Approve design: issues CIAC invoice + creates timeline commitment", roles: [NewBusinessRep], code: 200, input: [], output: MainExtension, side_effects: ["DESIGN_SUBMITTED→QUOTED; create CIACInvoice; create TimelineCommitment; application→QUOTED"] }
  - { method: POST, path: "/main-extensions/{id}/accept-quote", description: "Builder accepts the quote before expiry", roles: [Builder], code: 200, input: [], output: MainExtension, side_effects: ["QUOTED→ACCEPTED; application→CIAC_PENDING (+ zero-CIAC chain)"] }
  - { method: POST, path: "/main-extensions/{id}/revise", description: "Send a quoted design back to DRAFT for redesign (OCC)", roles: [DesignEngineer], code: 200, input: [expected_main_extension_version, "design_footage_ft?", "crossings?", "rock_excavation_expected?"], output: MainExtension, side_effects: ["QUOTED→DRAFT; invoice ISSUED→VOID; commitment PROPOSED→CANCELLED; application QUOTED→DESIGN; increments MainExtension.version by 1"] }
  - { method: POST, path: "/main-extensions/{id}/record-as-built", description: "Record as-built footage/costs after construction", roles: [FieldSupervisor], code: 200, input: [actual_footage_ft, actual_unit_cost_cents, actual_rock_excavation, actual_crossings], output: MainExtension, side_effects: ["CONSTRUCTED→AS_BUILT_RECORDED"] }
  - { method: POST, path: "/main-extensions/{id}/finalize", description: "Finalize: run ciac_final_true_up and reconcile the invoice", roles: [BillingClerk], code: 200, input: [], output: MainExtension, side_effects: ["AS_BUILT_RECORDED→FINALIZED; invoice true-up transitions"] }

  # --- CIACInvoice / CIACPayment ---
  - { method: GET, path: "/ciac-invoices/{id}", description: "Get one invoice", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: [], output: CIACInvoice, side_effects: [] }
  - { method: GET, path: "/ciac-invoices", description: "List invoices (main_extension_id?, service_application_id? filters)", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: ["main_extension_id?", "service_application_id?", "limit?", "offset?"], output: "CIACInvoice[]", side_effects: [] }
  - { method: POST, path: "/ciac-invoices/{id}/payments", description: "Record a CIAC payment (clerk must differ from issuer)", roles: [BillingClerk], code: 201, input: [amount_cents, method], output: CIACPayment, side_effects: ["invoice ISSUED/PARTIALLY_PAID→PARTIALLY_PAID/PAID; on PAID: application CIAC_PENDING→APPROVED_FOR_CONSTRUCTION"] }
  - { method: POST, path: "/ciac-invoices/{id}/refunds", description: "Record a CIAC refund while REFUND_PENDING (clerk must differ from payment clerks)", roles: [BillingClerk], code: 201, input: [amount_cents, method], output: CIACPayment, side_effects: ["REFUND_PENDING→REFUNDED when fully refunded"] }
  - { method: GET, path: "/ciac-payments/{id}", description: "Get one payment/refund event", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: [], output: CIACPayment, side_effects: [] }
  - { method: GET, path: "/ciac-payments", description: "List payment/refund events (ciac_invoice_id? filter)", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: ["ciac_invoice_id?", "limit?", "offset?"], output: "CIACPayment[]", side_effects: [] }

  # --- Permit ---
  - { method: POST, path: "/permits", description: "Create a permit (fee computed from crossings)", roles: [PermitCoordinator], code: 201, input: [service_application_id, permit_type, jurisdiction, crossings], output: Permit, side_effects: ["status=DRAFT; run permit_fee"] }
  - { method: GET, path: "/permits/{id}", description: "Get one permit", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: [], output: Permit, side_effects: [] }
  - { method: GET, path: "/permits", description: "List permits (service_application_id?, permit_type?, status? filters)", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: ["service_application_id?", "permit_type?", "status?", "limit?", "offset?"], output: "Permit[]", side_effects: [] }
  - { method: POST, path: "/permits/{id}/file", description: "File the permit with the authority", roles: [PermitCoordinator], code: 200, input: [], output: Permit, side_effects: ["DRAFT→FILED; application APPROVED_FOR_CONSTRUCTION→PERMITTING"] }
  - { method: POST, path: "/permits/{id}/record-decision", description: "Record the authority decision", roles: [PermitCoordinator], code: 200, input: [decision, "expires_at?", "decision_note?"], output: Permit, side_effects: ["FILED→APPROVED (expires_at required, not past) or FILED→REJECTED"] }
  - { method: POST, path: "/permits/{id}/amend", description: "Amend a REJECTED/EXPIRED permit back to DRAFT", roles: [PermitCoordinator], code: 200, input: ["jurisdiction?", "crossings?"], output: Permit, side_effects: ["REJECTED|EXPIRED→DRAFT; fee recomputed when crossings change"] }
  - { method: POST, path: "/permits/{id}/close", description: "Close an approved permit after construction", roles: [PermitCoordinator], code: 200, input: [], output: Permit, side_effects: ["APPROVED→CLOSED"] }

  # --- FieldCrew / CrewBooking ---
  - { method: POST, path: "/field-crews", description: "Register a field crew", roles: [SystemAdmin], code: 201, input: [crew_name, specialty, daily_capacity_minutes], output: FieldCrew, side_effects: ["active=true"] }
  - { method: GET, path: "/field-crews/{id}", description: "Get one crew", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: [], output: FieldCrew, side_effects: [] }
  - { method: GET, path: "/field-crews", description: "List crews", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: ["limit?", "offset?"], output: "FieldCrew[]", side_effects: [] }
  - { method: POST, path: "/crew-bookings", description: "Request a construction window on a crew", roles: [FieldSupervisor], code: 201, input: [service_application_id, field_crew_id, work_date, start_minute, end_minute, scope], output: CrewBooking, side_effects: ["status=REQUESTED"] }
  - { method: GET, path: "/crew-bookings/{id}", description: "Get one booking", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: [], output: CrewBooking, side_effects: [] }
  - { method: GET, path: "/crew-bookings", description: "List bookings (field_crew_id?, service_application_id?, work_date?, status? filters)", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: ["field_crew_id?", "service_application_id?", "work_date?", "status?", "limit?", "offset?"], output: "CrewBooking[]", side_effects: [] }
  - { method: POST, path: "/crew-bookings/{id}/confirm", description: "Confirm a booking: buffered-overlap + daily-capacity checks", roles: [FieldSupervisor], code: 200, input: [], output: CrewBooking, side_effects: ["REQUESTED→CONFIRMED"] }
  - { method: POST, path: "/crew-bookings/{id}/complete", description: "Mark construction complete", roles: [FieldSupervisor], code: 200, input: [], output: CrewBooking, side_effects: ["CONFIRMED→COMPLETED; application→SERVICE_INSTALLED; MainExtension→CONSTRUCTED"] }
  - { method: POST, path: "/crew-bookings/{id}/cancel", description: "Cancel a booking (releases crew-day minutes)", roles: [FieldSupervisor], code: 200, input: [], output: CrewBooking, side_effects: ["REQUESTED|CONFIRMED→CANCELLED"] }
  - { method: POST, path: "/crew-bookings/{id}/reschedule", description: "Move a confirmed booking to a new window (back to REQUESTED)", roles: [FieldSupervisor], code: 200, input: [work_date, start_minute, end_minute], output: CrewBooking, side_effects: ["CONFIRMED→REQUESTED with new window"] }

  # --- Inspector / Inspection ---
  - { method: POST, path: "/inspectors", description: "Register an inspector", roles: [SystemAdmin], code: 201, input: [full_name, certifications], output: Inspector, side_effects: ["active=true"] }
  - { method: GET, path: "/inspectors/{id}", description: "Get one inspector", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: [], output: Inspector, side_effects: [] }
  - { method: GET, path: "/inspectors", description: "List inspectors", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: ["limit?", "offset?"], output: "Inspector[]", side_effects: [] }
  - { method: POST, path: "/inspections", description: "Schedule an inspection (created directly in SCHEDULED; half-open window checks)", roles: [PermitCoordinator], code: 201, input: [service_application_id, inspector_id, inspection_type, inspection_date, start_minute, end_minute], output: Inspection, side_effects: ["status=SCHEDULED"] }
  - { method: GET, path: "/inspections/{id}", description: "Get one inspection", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: [], output: Inspection, side_effects: [] }
  - { method: GET, path: "/inspections", description: "List inspections (inspector_id?, service_application_id?, status? filters)", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: ["inspector_id?", "service_application_id?", "status?", "limit?", "offset?"], output: "Inspection[]", side_effects: [] }
  - { method: POST, path: "/inspections/{id}/record-result", description: "Inspector records PASS/FAIL (must be the assigned inspector)", roles: [Inspector], code: 200, input: [result, "notes?"], output: Inspection, side_effects: ["SCHEDULED→COMPLETED_PASS|COMPLETED_FAIL"] }
  - { method: POST, path: "/inspections/{id}/cancel", description: "Cancel a scheduled inspection", roles: [PermitCoordinator], code: 200, input: [], output: Inspection, side_effects: ["SCHEDULED→CANCELLED"] }
  - { method: POST, path: "/inspections/{id}/reschedule", description: "Re-schedule a failed/expired inspection to a new window", roles: [PermitCoordinator], code: 200, input: [inspection_date, start_minute, end_minute], output: Inspection, side_effects: ["COMPLETED_FAIL|EXPIRED→SCHEDULED with re-validated window"] }

  # --- MeterSet / PurgeLeakTest ---
  - { method: POST, path: "/meter-sets", description: "Create the meter set for an application", roles: [MeterTechnician], code: 201, input: [service_application_id], output: MeterSet, side_effects: ["status=PLANNED; ERR_DUPLICATE_METER_SET if a non-CANCELLED one exists"] }
  - { method: GET, path: "/meter-sets/{id}", description: "Get one meter set", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: [], output: MeterSet, side_effects: [] }
  - { method: GET, path: "/meter-sets", description: "List meter sets (service_application_id? filter)", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: ["service_application_id?", "limit?", "offset?"], output: "MeterSet[]", side_effects: [] }
  - { method: POST, path: "/meter-sets/{id}/size", description: "Run meter_sizing; selects meter + regulator", roles: [DesignEngineer], code: 200, input: [], output: MeterSet, side_effects: ["PLANNED→SIZED; sets meter_model, regulator_model"] }
  - { method: POST, path: "/meter-sets/{id}/mark-ordered", description: "Record meter order with device serial", roles: [MeterTechnician], code: 200, input: [serial_number], output: MeterSet, side_effects: ["SIZED→ORDERED"] }
  - { method: POST, path: "/meter-sets/{id}/install", description: "Install the meter set (requires service line in)", roles: [MeterTechnician], code: 200, input: [], output: MeterSet, side_effects: ["ORDERED→INSTALLED; records installed_by_user_id; application→METER_WORK"] }
  - { method: POST, path: "/meter-sets/{id}/mark-repaired", description: "Close a repair loop back to INSTALLED", roles: [MeterTechnician], code: 200, input: [], output: MeterSet, side_effects: ["REPAIR→INSTALLED"] }
  - { method: POST, path: "/purge-leak-tests", description: "Document a purge & leak test (result computed at record time)", roles: [MeterTechnician], code: 201, input: [meter_set_id, purge_duration_min, test_pressure_psi, test_duration_min, observed_pressure_drop_psi], output: PurgeLeakTest, side_effects: ["status=RECORDED; run leak_test_acceptance; MeterSet INSTALLED|REPAIR→TESTING; application→TESTING"] }
  - { method: GET, path: "/purge-leak-tests/{id}", description: "Get one test record", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: [], output: PurgeLeakTest, side_effects: [] }
  - { method: GET, path: "/purge-leak-tests", description: "List test records (meter_set_id? filter)", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: ["meter_set_id?", "limit?", "offset?"], output: "PurgeLeakTest[]", side_effects: [] }
  - { method: POST, path: "/purge-leak-tests/{id}/certify", description: "Witness-certify a test (SoD: witness != installer; PRESSURE_TEST certification)", roles: [Inspector], code: 200, input: [], output: PurgeLeakTest, side_effects: ["RECORDED→CERTIFIED; PASS: meter→READY_FOR_TURN_ON + application→TURN_ON; FAIL: meter→REPAIR"] }
  - { method: POST, path: "/purge-leak-tests/{id}/reject", description: "Witness rejects the documentation", roles: [Inspector], code: 200, input: [rejection_reason], output: PurgeLeakTest, side_effects: ["RECORDED→REJECTED; meter stays TESTING"] }

  # --- TurnOnEvent ---
  - { method: POST, path: "/turn-on-events", description: "Schedule an appliance turn-on & safety check", roles: [MeterTechnician], code: 201, input: [service_application_id, appliance_load_id], output: TurnOnEvent, side_effects: ["status=SCHEDULED"] }
  - { method: GET, path: "/turn-on-events/{id}", description: "Get one turn-on event", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: [], output: TurnOnEvent, side_effects: [] }
  - { method: GET, path: "/turn-on-events", description: "List turn-on events (service_application_id?, appliance_load_id?, status? filters)", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: ["service_application_id?", "appliance_load_id?", "status?", "limit?", "offset?"], output: "TurnOnEvent[]", side_effects: [] }
  - { method: POST, path: "/turn-on-events/{id}/complete", description: "Record safety-check results; computes VERIFIED/FAILED", roles: [MeterTechnician], code: 200, input: [co_reading_ppm, odor_detected, ignition_verified, venting_verified], output: TurnOnEvent, side_effects: ["SCHEDULED→VERIFIED|FAILED"] }
  - { method: POST, path: "/turn-on-events/{id}/retry", description: "Re-open a failed turn-on for another attempt", roles: [MeterTechnician], code: 200, input: [], output: TurnOnEvent, side_effects: ["FAILED→SCHEDULED"] }

  # --- TimelineCommitment ---
  - { method: GET, path: "/timeline-commitments/{id}", description: "Get one commitment", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: [], output: TimelineCommitment, side_effects: [] }
  - { method: GET, path: "/timeline-commitments", description: "List commitments (service_application_id? filter)", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: ["service_application_id?", "limit?", "offset?"], output: "TimelineCommitment[]", side_effects: [] }
  - { method: POST, path: "/timeline-commitments/{id}/accept", description: "Builder accepts the proposed commitment", roles: [Builder], code: 200, input: [], output: TimelineCommitment, side_effects: ["PROPOSED→ACCEPTED"] }
  - { method: POST, path: "/timeline-commitments/{id}/propose-revision", description: "Builder proposes a new committed date (OCC)", roles: [Builder], code: 200, input: [requested_completion_date, expected_commitment_version], output: TimelineCommitment, side_effects: ["ACCEPTED→REVISION_PENDING; increments TimelineCommitment.version by 1"] }
  - { method: POST, path: "/timeline-commitments/{id}/respond-revision", description: "Utility accepts or rejects the proposed revision", roles: [NewBusinessRep], code: 200, input: [decision], output: TimelineCommitment, side_effects: ["REVISION_PENDING→ACCEPTED; ACCEPT adopts requested date"] }
  - { method: POST, path: "/timeline-commitments/{id}/mark-delayed", description: "Flag a commitment at risk with delay attribution", roles: [NewBusinessRep], code: 200, input: [delay_attribution, expected_completion_date], output: TimelineCommitment, side_effects: ["ACCEPTED→AT_RISK (or AT_RISK update)"] }

  # --- GISAsBuilt ---
  - { method: POST, path: "/gis-as-builts", description: "Submit the as-built GIS record (application must be ENERGIZED/GIS_REVIEW)", roles: [FieldSupervisor], code: 201, input: [service_application_id, geometry_geojson, pipe_material, depth_inches], output: GISAsBuilt, side_effects: ["status=SUBMITTED; application ENERGIZED→GIS_REVIEW; ERR_DUPLICATE_GIS if a non-CANCELLED one exists"] }
  - { method: GET, path: "/gis-as-builts/{id}", description: "Get one GIS record", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: [], output: GISAsBuilt, side_effects: [] }
  - { method: GET, path: "/gis-as-builts", description: "List GIS records (service_application_id? filter)", roles: [Builder, NewBusinessRep, DesignEngineer, BillingClerk, PermitCoordinator, FieldSupervisor, MeterTechnician, Inspector, GISAnalyst, SystemAdmin], code: 200, input: ["service_application_id?", "limit?", "offset?"], output: "GISAsBuilt[]", side_effects: [] }
  - { method: POST, path: "/gis-as-builts/{id}/validate", description: "Validate the as-built (depth code check)", roles: [GISAnalyst], code: 200, input: [], output: GISAsBuilt, side_effects: ["SUBMITTED→VALIDATED"] }
  - { method: POST, path: "/gis-as-builts/{id}/reject", description: "Reject the as-built", roles: [GISAnalyst], code: 200, input: [rejection_reason], output: GISAsBuilt, side_effects: ["SUBMITTED→REJECTED"] }
  - { method: POST, path: "/gis-as-builts/{id}/resubmit", description: "Resubmit a rejected as-built with corrections", roles: [FieldSupervisor], code: 200, input: ["geometry_geojson?", "pipe_material?", "depth_inches?"], output: GISAsBuilt, side_effects: ["REJECTED→SUBMITTED"] }

  # --- Logical clock (test-driving endpoint) ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z; the logical clock NEVER falls back to wall-clock. Each set performs the time sweep: quote expiry (QUOTED→EXPIRED once current date passes quote_valid_until + 7-day grace), permit expiry (APPROVED→EXPIRED past expires_at), inspection expiry (SCHEDULED→EXPIRED past inspection_date), commitment MISSED sweep (ACCEPTED/AT_RISK past committed_completion_date while application not COMPLETED).", roles: [SystemAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["runs all time-based sweeps atomically"] }

