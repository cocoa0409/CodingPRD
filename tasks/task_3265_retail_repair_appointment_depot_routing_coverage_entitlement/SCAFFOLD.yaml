errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or empty X-User-Role or X-User-ID headers."

  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role is not permitted to perform the requested operation."

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced entity does not exist."

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Entity is in a state that does not allow the requested transition."

  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "RepairOrder is already in a terminal state (COMPLETED or CANCELLED)."

  - id: ERR_SECURITY_VERIFICATION_REQUIRED
    http: 422
    condition: "Activation lock or ownership proof verification is required but not completed."

  - id: ERR_ACCOUNT_LOCKED
    http: 403
    condition: "Customer account is LOCKED or CLOSED."

  - id: ERR_SLOT_CONFLICT
    http: 409
    condition: "Requested appointment slot conflicts with an existing appointment for the same technician."

  - id: ERR_LOCATION_UNAVAILABLE
    http: 422
    condition: "Service location is not ACTIVE or does not support the requested service type."

  - id: ERR_INVALID_REFERENCE
    http: 422
    condition: "Foreign key reference is invalid (e.g., device does not belong to customer)."

  - id: ERR_COVERAGE_EXHAUSTED
    http: 422
    condition: "Coverage plan is not ACTIVE or has no remaining accidental damage incidents."

  - id: ERR_INVALID_SLOT_TIME
    http: 422
    condition: "Appointment slot is in the past or more than 30 days in the future."

  - id: ERR_REPEAT_WINDOW_EXPIRED
    http: 422
    condition: "Repeat repair escalation is requested more than 90 days after completion."

  - id: ERR_INSUFFICIENT_PARTS
    http: 422
    condition: "Part inventory does not have sufficient available quantity."

  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_*_version does not match current entity version."

  - id: ERR_DATA_BACKUP_REQUIRED
    http: 422
    condition: "Data backup acknowledgment or privacy wipe consent is missing."

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Request payload is malformed or missing required fields."

  - id: ERR_DEVICE_NOT_FOUND
    http: 404
    condition: "Device id does not exist."

  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "Customer id does not exist."

  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "Appointment id does not exist."

  - id: ERR_REPAIR_ORDER_NOT_FOUND
    http: 404
    condition: "Repair order id does not exist."

  - id: ERR_COVERAGE_PLAN_NOT_FOUND
    http: 404
    condition: "Coverage plan id does not exist."

  - id: ERR_LOCATION_NOT_FOUND
    http: 404
    condition: "Service location id does not exist."

  - id: ERR_PART_NOT_FOUND
    http: 404
    condition: "Part id does not exist."

roles:
  - name: Anonymous
    description: "Unauthenticated caller; can only register."
    identity: opaque
    exclusive_operations: ["POST /customers"]
    shared_operations: []

  - name: Customer
    description: "End user who owns devices and books appointments."
    identity: entity_backed:Customer
    exclusive_operations:
      - "POST /devices"
      - "POST /appointments"
      - "POST /appointments/{id}/check-in"
      - "POST /appointments/{id}/cancel"
      - "POST /repair-orders/{id}/cancel"
      - "POST /repair-orders/{id}/complete-pickup"
      - "POST /quality-follow-ups/{id}/resolve-satisfied"
      - "GET /customers/{id}/devices"
      - "GET /customers/{id}/appointments"
      - "GET /customers/{id}/repair-orders"
    shared_operations:
      - "GET /customers/{id}"
      - "GET /devices/{id}"
      - "GET /appointments/{id}"
      - "GET /repair-orders/{id}"
      - "GET /coverage-plans/{id}"
      - "GET /coverage-entitlements/{id}"
      - "GET /quality-follow-ups/{id}"
      - "GET /service-locations"
