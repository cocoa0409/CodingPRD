  # ---------------------------------------------------------------------------
  - section: cross_cutting
    instances:
      - name: excise_report_stale_distillery_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[excise-report-supersede-stale-distillery]", "errors[ERR_STALE_VERSION]", entities.Distillery.fields.version]
        distinguishing_aspect: "Filing a second ExciseReport carrying the pre-first-filing expected_distillery_version (now stale after the first filing bumped Distillery.version) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A distillery at version 1; one ExciseReport already FILED for 2026-05 (which advanced Distillery.version to 2)."]
          setup_api_calls:
            - { call: "POST /dsp/distilleries", payload: { name: "Bench DSP", dsp_permit_number: "DSP-CB-15", state_code: "CA" }, as: ComplianceOfficer, captures: { dist_id: $.data.id, v1: $.data.version } }
            - { call: "POST /dsp/excise-reports", payload: { distillery_id: "${dist_id}", period_month: "2026-05", expected_distillery_version: "${v1}" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /dsp/excise-reports", payload: { distillery_id: "${dist_id}", period_month: "2026-05", expected_distillery_version: "${v1}" }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_STALE_VERSION; HTTP 412"]

      - name: excise_report_supersede_prior_filed_report
        claim_type: derived_field_reconciliation
        grounds: [state_machines.ExciseReport.FILED_to_SUPERSEDED, entities.ExciseReport.fields.supersedes_report_id]
        distinguishing_aspect: "A second ExciseReport for the same period filed with the current version supersedes the first: report1 -> SUPERSEDED and report2.supersedes_report_id == report1.id."
        test_recipe:
          setup: ["A distillery with one FILED report for 2026-05; current Distillery.version read via GET."]
          setup_api_calls:
            - { call: "POST /dsp/distilleries", payload: { name: "Bench DSP", dsp_permit_number: "DSP-CB-16", state_code: "CA" }, as: ComplianceOfficer, captures: { dist_id: $.data.id, v1: $.data.version } }
            - { call: "POST /dsp/excise-reports", payload: { distillery_id: "${dist_id}", period_month: "2026-05", expected_distillery_version: "${v1}" }, as: ComplianceOfficer, captures: { r1: $.data.id } }
            - { call: "GET /dsp/distilleries/${dist_id}", payload: {}, as: ComplianceOfficer, captures: { v2: $.data.version } }
          trigger:
            - { call: "POST /dsp/excise-reports", payload: { distillery_id: "${dist_id}", period_month: "2026-05", expected_distillery_version: "${v2}" }, as: ComplianceOfficer, captures: { r2: $.data.id, sup: $.data.supersedes_report_id } }
          assert:
            - "ExciseReport.${r2}.status == FILED"
            - "ExciseReport.${r2}.supersedes_report_id == ${r1}"
            - "ExciseReport.${r1}.status == SUPERSEDED"

