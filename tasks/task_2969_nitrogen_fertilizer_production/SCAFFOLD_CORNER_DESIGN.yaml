      - name: turnaround_approve_without_endorsed_psm_review_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=15]
          - errors[ERR_PSM_REVIEW_MISSING]
          - state_machines.Turnaround.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          SUBMITTED -> APPROVED is a declared transition, so the priority-9 gate passes and the call
