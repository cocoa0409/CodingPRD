            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Second bagged item", category: "GENERAL", packaging_type: "PAPER_BAG", appraised_value_cents: 500, seized_at: "2026-07-31T12:05:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item2_id: $.data.id }
            - call: "POST /evidence-items/${item1_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g9_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /evidence-items/${item2_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g9_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
            - call: "POST /evidence-items/${item2_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { fallback_location: $.data.storage_location_id }
          assert:
            - "Each item is individually valid for G-09 (category GENERAL matches) but the collective occupancy would be 2 against capacity 1, so the second responds 409 with ${err} == 'ERR_STORAGE_LOCATION_FULL'"
            - "GET /storage-locations/${loc_g9_id} shows occupied_slots == 1 == capacity_slots and version unchanged by the refused call"
            - "${fallback_location} == ${loc_g_id}: the same item is accepted by the bin that still has room"
            - "GET /evidence-items/${item2_id} shows custody_state == 'STORED' only after the successful attempt"

      - name: autoselect_with_no_eligible_location_rejected
        claim_type: Violation → Error
        grounds:
          - "validations[priority=33]"
          - "calculations.storage_location_autoselect"
          - "errors[ERR_NO_ELIGIBLE_STORAGE]"
        test_recipe:
          setup:
            - "Base fixture with G-01 and R-01 only — the room has no OVERSIZED_YARD bin at all."
            - "An OVERSIZED item is logged into case 26-00001, so required_storage_category == OVERSIZED_YARD."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_loc_g
            - *c_loc_r
            - *c_tech
            - *c_case1
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Wrapped pallet of copper pipe", category: "OVERSIZED", packaging_type: "PALLET_WRAP", appraised_value_cents: 90000, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /evidence-items/${item_id}/storage-assignment"
              payload: {}
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
            - call: "POST /storage-locations"
              payload: { property_room_id: "${room_id}", code: "Y-01", category: "OVERSIZED_YARD", capacity_slots: 2 }
              as: PropertyRoomManager
              captures: { yard_id: $.data.id }
            - call: "POST /evidence-items/${item_id}/storage-assignment"
              payload: {}
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { chosen: $.data.storage_location_id }
          assert:
            - "The first autoselect responds 409 with ${err} == 'ERR_NO_ELIGIBLE_STORAGE' — the eligible pool is empty, which is a different failure from ERR_STORAGE_LOCATION_FULL"
            - "G-01 and R-01 are never considered even though both have free capacity, because neither category equals OVERSIZED_YARD"
            - "${chosen} == ${yard_id} once a yard bin exists, with no other input changed"
            - "GET /evidence-items/${item_id} shows custody_state == 'LOGGED' after the refusal and 'STORED' after the success"

      - name: suspended_custodian_transfer_rejected
        claim_type: Conditional validation
        grounds:
          - "validations[priority=12]"
          - "entities.Custodian.fields.status"
          - "endpoints[POST /custodians/{custodianId}/suspend]"
          - "errors[ERR_CUSTODIAN_SUSPENDED]"
        test_recipe:
          setup:
            - "Base fixture; a GENERAL item is stored in G-01 and the laboratory analyst L-200 is suspended."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_loc_g
            - *c_tech
            - *c_lab
            - *c_case1
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Cartridge casings", category: "GENERAL", packaging_type: "RIGID_BOX", appraised_value_cents: 100, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id }
            - call: "POST /evidence-items/${item_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /custodians/${lab_id}/suspend"
              payload: { reason: "Pending internal affairs review" }
              as: PropertyRoomManager
              captures: { lab_status: $.data.status, lab_reason: $.data.suspension_reason }
          trigger:
            - call: "POST /custody-transfers"
              payload: { evidence_item_id: "${item_id}", to_custodian_id: "${lab_id}", purpose: "LAB_ANALYSIS", released_at: "2026-08-02T09:00:00Z", due_back_at: "2026-08-12T09:00:00Z" }
              as: LabAnalyst
              as_user_id: "${lab_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${lab_status} == 'SUSPENDED' and ${lab_reason} == 'Pending internal affairs review'"
            - "Responds 409 with ${err} == 'ERR_CUSTODIAN_SUSPENDED': the suspended custodian is both the caller and the receiving holder, and the rule covers any referenced actor"
            - "The suspension is not an authentication failure: priority 4 still resolves X-User-ID to a Custodian whose role_type is LAB_ANALYST, so the rejection is a business constraint at priority 12, not ERR_CUSTODIAN_ROLE_MISMATCH"
            - "No CustodyTransfer row exists and GET /custodians/${lab_id} shows open_escort_count == 0"

      - name: expired_certification_blocks_transfer
        claim_type: Conditional validation
        excluded_because:
          difficulty_instance: certification_beats_custody_window_conflict_on_transfer_create
          rationale: "The §1.8 priority-pair instance already triggers priority 13 (ERR_CUSTODIAN_NOT_CERTIFIED) on POST /custody-transfers with a custodian whose certification_expires_at is not after the clock."

      - name: lockdown_beats_state_priority_ordering
        claim_type: Priority Ordering
        excluded_because:
          difficulty_instance: lockdown_posture_beats_invalid_custody_state_on_execute
          rationale: "The §1.8 instance violates priority 8 and priority 11 in one call and asserts the priority 8 error, covering the business_safety-over-state ordering claim."

      - name: certification_beats_temporal_priority_ordering
        claim_type: Priority Ordering
        excluded_because:
          difficulty_instance: certification_beats_custody_window_conflict_on_transfer_create
          rationale: "The §1.8 instance violates priority 13 and priority 21 in one call and asserts the priority 13 error, covering the business_constraint-over-business_temporal ordering claim."

      - name: fiscal_beats_settlement_window_priority_ordering
        claim_type: Priority conflict
        excluded_because:
          difficulty_instance: reserve_floor_beats_settlement_window_on_settle
          rationale: "The §1.8 instance violates priority 30 and priority 32 in one settle call and asserts ERR_SALE_BELOW_RESERVE, covering the deliberate out-of-category ordering of the two fiscal/temporal rules."

      - name: audit_window_buffer_temporal_validation
        claim_type: Temporal validation
        excluded_because:
          difficulty_instance: audit_window_48h_buffer_on_location
          rationale: "The §1.8 resource_temporal_overlap instance pins priority 22 at exactly the 48-hour buffer edge on the same StorageLocation, including the inclusive-boundary rejection and the success one millisecond later."

      - name: escort_capacity_aggregate_validation
        claim_type: Aggregate validation
        excluded_because:
          difficulty_instance: custodian_escort_capacity_closed_interval_third_overlap_rejected
          rationale: "The §1.8 instance already shows two individually valid transfers being accepted and a third pushing the receiving custodian's aggregate escort load over MAX_CONCURRENT_ESCORTS."

  # ===========================================================================
  - section: endpoints
    instances:

      - name: custodian_create_then_read_round_trip
        claim_type: Standard CRUD
        grounds:
          - "endpoints[POST /custodians]"
          - "endpoints[GET /custodians/{custodianId}]"
          - "endpoints[GET /custodians]"
          - "entities.Custodian.fields.role_type"
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z and room CPD only."
          setup_api_calls:
            - *c_clock
            - *c_room
          trigger:
            - call: "POST /custodians"
              payload: { property_room_id: "${room_id}", badge_number: "T-500", full_name: "Nia Fowler", role_type: "EVIDENCE_TECH", certification_expires_at: "2028-01-01T00:00:00Z" }
              as: PropertyRoomManager
              captures: { cust_id: $.data.id }
            - call: "GET /custodians/${cust_id}"
              payload: {}
              as: PropertyRoomManager
            - call: "GET /custodians?property_room_id=${room_id}&role_type=EVIDENCE_TECH"
              payload: {}
              as: PropertyRoomManager
              captures: { listed_id: "$.data[0].id" }
          assert:
            - "Create responds 201 with status == 'ACTIVE', suspension_reason == null, open_escort_count == 0 and version == 1"
            - "The read returns badge_number == 'T-500', full_name == 'Nia Fowler', role_type == 'EVIDENCE_TECH', certification_expires_at == '2028-01-01T00:00:00.000Z'"
            - "The filtered list returns total_count == 1 with ${listed_id} == ${cust_id}"
            - "GET /custodians?role_type=AUDITOR returns total_count == 0: the filter is applied, not ignored"
            - "§1.5 declares no update or delete endpoint for Custodian — the only mutation is POST /custodians/{custodianId}/suspend"

      - name: case_charge_action_sets_charged_at
        claim_type: Action endpoint
        grounds:
          - "endpoints[POST /cases/{caseId}/charge]"
          - "state_machines.Case.OPEN_to_CHARGED"
          - "entities.Case.fields.charged_at"
          - "errors[ERR_CASE_STATE_INVALID]"
        test_recipe:
          setup:
            - "Base fixture; case 26-00001 is OPEN and the clock is advanced to 2026-08-04T14:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_inv
            - *c_case1
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T14:00:00Z" }
              as: PropertyRoomManager
          trigger:
            - call: "POST /cases/${case1_id}/charge"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { status_after: $.data.status, charged: $.data.charged_at }
            - call: "POST /cases/${case1_id}/charge"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { second_err: $.data.error_id }
          assert:
            - "The action responds 200 with ${status_after} == 'CHARGED' and ${charged} == '2026-08-04T14:00:00.000Z' (the logical clock, not the request wall clock)"
            - "adjudicated_at, appeal_opened_at and closed_at remain null and version increments to 2"
            - "The repeat call responds 409 with ${second_err} == 'ERR_CASE_STATE_INVALID' and charged_at is NOT overwritten"
            - "POST /cases/${case1_id}/adjudicate now succeeds, so charge is the precondition that unlocks the next action"

      - name: property_room_read_exposes_derived_counters
        claim_type: Computed read
        grounds:
          - "endpoints[GET /property-rooms/{roomId}]"
          - "entities.PropertyRoom.fields.posture"
          - "entities.PropertyRoom.fields.disposal_eligible_count"
          - "entities.PropertyRoom.fields.escrow_balance_cents"
          - "calculations.room_posture"
        test_recipe:
          setup:
            - "Base fixture; one GENERAL item is logged into case 26-00001 and stored in G-01. Nothing has been audited, lost or disposed."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_loc_g
            - *c_tech
            - *c_case1
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Stored evidence", category: "GENERAL", packaging_type: "PAPER_BAG", appraised_value_cents: 1000, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id }
            - call: "POST /evidence-items/${item_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
          trigger:
            - call: "GET /property-rooms/${room_id}"
              payload: {}
              as: InternalAuditor
              as_user_id: "${aud_id}"
              captures: { posture: $.data.posture, sweep_at: $.data.last_sweep_at }
          assert:
            - "${posture} == 'OPEN' and every derived counter reads 0: open_discrepancy_count, missing_high_risk_count, sealed_location_count, disposal_eligible_count and escrow_balance_cents"
            - "${sweep_at} == null because POST /property-rooms/{roomId}/daily-sweep has never run"
            - "The read is a projection of live child state, not a stored snapshot: after the item's retention matures and one sweep runs, the same GET reports disposal_eligible_count == 1"
            - "agency_code == 'CPD' and name == 'Central Property Unit' are echoed unchanged"

      - name: auto_authorized_destruction_order_skips_court_authorization
        claim_type: Conditional action
        grounds:
          - "calculations.auto_authorization_predicate"
          - "entities.DispositionOrder.fields.auto_authorized"
          - "state_machines.DispositionOrder.PENDING_COURT_AUTH_to_AUTHORIZED"
          - "errors[ERR_ORDER_STATE_INVALID]"
        test_recipe:
          setup:
            - "Base fixture; case 26-00002 (statute AB-1, destruction_requires_court_order false) holds two items: a GENERAL item appraised 40000 stored in G-01 and a FIREARM appraised 45000 stored in V-01."
            - "The case is charged, the clock advanced to 2026-10-30 and the case adjudicated, so both items become DISPOSAL_ELIGIBLE."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_ab1
            - *c_loc_g
            - *c_loc_v
            - *c_tech
            - *c_tech2
            - *c_inv
            - *c_aud
            - *c_case2
            - call: "POST /evidence-items"
              payload: { case_id: "${case2_id}", item_description: "Broken bicycle", category: "GENERAL", packaging_type: "CHAIN_TAG_ONLY", appraised_value_cents: 40000, seized_at: "2026-07-30T09:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { plain_item: $.data.id }
            - call: "POST /evidence-items/${plain_item}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /evidence-items"
              payload: { case_id: "${case2_id}", item_description: "Surrendered revolver", category: "FIREARM", packaging_type: "RIGID_BOX", appraised_value_cents: 45000, seized_at: "2026-07-30T09:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { gun_item: $.data.id }
            - call: "POST /evidence-items/${gun_item}/storage-assignment"
              payload: { storage_location_id: "${loc_v_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /cases/${case2_id}/charge"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-30T00:00:00Z" }
              as: PropertyRoomManager
            - call: "POST /cases/${case2_id}/adjudicate"
              payload: {}
              as: CourtClerk
          trigger:
            - call: "POST /disposition-orders"
              payload: { evidence_item_id: "${plain_item}", type: "DESTRUCTION", requested_by_custodian_id: "${tech_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { auto_order: $.data.id, auto_flag: $.data.auto_authorized, auto_status: $.data.status }
            - call: "POST /disposition-orders"
              payload: { evidence_item_id: "${gun_item}", type: "DESTRUCTION", requested_by_custodian_id: "${tech_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { manual_order: $.data.id, manual_flag: $.data.auto_authorized, manual_status: $.data.status }
            - call: "POST /disposition-orders/${manual_order}/execute"
              payload: { executed_by_custodian_id: "${tech2_id}", witness_custodian_id: "${aud_id}" }
              as: PropertyRoomManager
              captures: { premature_err: $.data.error_id }
          assert:
            - "${auto_flag} == true, ${auto_status} == 'AUTHORIZED' and authorized_at is set even though POST /disposition-orders/{orderId}/authorize was never called — the predicate is satisfied (DESTRUCTION, statute flag false, category GENERAL, 40000 < 500000)"
            - "${manual_flag} == false and ${manual_status} == 'PENDING_COURT_AUTH': the FIREARM category disqualifies auto-authorization regardless of its 45000 appraisal"
            - "Executing the non-authorized order responds 409 with ${premature_err} == 'ERR_ORDER_STATE_INVALID'; after POST /disposition-orders/${manual_order}/authorize the same execute succeeds"
            - "The auto-authorized order carries court_order_number == null, which distinguishes it from a clerk-authorized order in the audit record"

      - name: daily_sweep_processes_steps_in_declared_order
        claim_type: Bulk action
        grounds:
          - "endpoints[POST /property-rooms/{roomId}/daily-sweep]"
          - "state_machines.CustodyTransfer.RELEASED_to_OVERDUE"
          - "state_machines.OwnerClaim.NOTICE_SENT_to_EXPIRED"
          - "state_machines.EvidenceItem.RETAINED_to_UNCLAIMED_ELIGIBLE"
          - "state_machines.EvidenceItem.RETAINED_to_DISPOSAL_ELIGIBLE"
          - "entities.PropertyRoom.fields.last_sweep_at"
        test_recipe:
          setup:
            - "Base fixture; item A (case 26-00001, TH-3) is stored in G-09 and released to L-200 on a transfer due back 2026-08-12."
            - "Items B and C (case 26-00002, statute AB-1 with 0 statutory days, so retention_release_at equals intake_at 2026-08-01) are both stored in G-01."
            - "Item B additionally carries an IN_PERSON owner notice issued at 2026-08-01, so its claim deadline is 2026-08-31."
            - "The clock is then advanced to 2026-09-05T00:00:00Z, after the transfer due date and after the claim deadline."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_stat_ab1
            - *c_loc_g
            - *c_loc_g9
            - *c_tech
            - *c_lab
            - *c_case1
            - *c_case2
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Item A out at the laboratory", category: "GENERAL", packaging_type: "PAPER_BAG", appraised_value_cents: 500, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { itemA_id: $.data.id }
            - call: "POST /evidence-items/${itemA_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g9_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /custody-transfers"
              payload: { evidence_item_id: "${itemA_id}", to_custodian_id: "${lab_id}", purpose: "LAB_ANALYSIS", released_at: "2026-08-02T09:00:00Z", due_back_at: "2026-08-12T09:00:00Z" }
              as: LabAnalyst
              as_user_id: "${lab_id}"
              captures: { transfer_id: $.data.id }
            - call: "POST /custody-transfers/${transfer_id}/release"
              payload: { released_signature: "sig-release-A" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /evidence-items"
              payload: { case_id: "${case2_id}", item_description: "Item B with an owner notice", category: "GENERAL", packaging_type: "CHAIN_TAG_ONLY", appraised_value_cents: 20000, seized_at: "2026-07-30T09:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { itemB_id: $.data.id }
            - call: "POST /evidence-items/${itemB_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /owner-claims"
              payload: { evidence_item_id: "${itemB_id}", claimant_name: "Unresponsive owner", claimant_contact: "Counter notice served", notice_method: "IN_PERSON" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { claim_id: $.data.id, claim_deadline: $.data.claim_deadline_at }
            - call: "POST /evidence-items"
              payload: { case_id: "${case2_id}", item_description: "Item C with no owner notice", category: "GENERAL", packaging_type: "CHAIN_TAG_ONLY", appraised_value_cents: 20000, seized_at: "2026-07-30T09:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { itemC_id: $.data.id }
            - call: "POST /evidence-items/${itemC_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: PropertyRoomManager
          trigger:
            - call: "POST /property-rooms/${room_id}/daily-sweep"
              payload: {}
              as: PropertyRoomManager
              captures: { eligible_count: $.data.disposal_eligible_count, swept_at: $.data.last_sweep_at, posture: $.data.posture }
          assert:
            - "${claim_deadline} == '2026-08-31T00:00:00.000Z' (30 seized-property days from the 2026-08-01 notice)"
            - "Step 1: GET /custody-transfers/${transfer_id} shows status == 'OVERDUE' while item A stays custody_state == 'CHECKED_OUT'"
            - "Step 2: GET /owner-claims/${claim_id} shows status == 'EXPIRED' and GET /evidence-items/${itemB_id} shows disposition_state == 'UNCLAIMED_ELIGIBLE'"
            - "Step ordering is observable: item B's retention_release_at (2026-08-01, statute AB-1 with 0 days) had also matured, so a sweep that ran step 3 before step 2 would have left it 'DISPOSAL_ELIGIBLE' instead of 'UNCLAIMED_ELIGIBLE'"
            - "Step 3: GET /evidence-items/${itemC_id} shows disposition_state == 'DISPOSAL_ELIGIBLE'; item A is skipped because it is CHECKED_OUT, not STORED"
            - "Step 4: ${eligible_count} == 2 (UNCLAIMED_ELIGIBLE and DISPOSAL_ELIGIBLE both count), ${swept_at} == '2026-09-05T00:00:00.000Z' and ${posture} == 'OPEN'"
            - "A second identical sweep is a no-op for these rows: the transfer stays OVERDUE, the claim stays EXPIRED, and disposal_eligible_count remains 2"

      - name: owner_claim_to_disposition_order_cross_reference
        claim_type: Cross-reference link
        excluded_because:
          difficulty_instance: return_to_owner_execute_requires_verified_claim
          rationale: "The §1.8 cross-entity instance already links an OwnerClaim to a RETURN_TO_OWNER DispositionOrder, requires both entities to exist and asserts the claim's RELEASED transition on execution."

  # ===========================================================================
  - section: errors
    instances:

      - name: request_without_user_headers_rejected
        claim_type: Every error triggerable
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_USER_CONTEXT]"
        test_recipe:
          setup:
            - "Base fixture; the trigger call is issued with both X-User-Role and X-User-ID omitted."
          setup_api_calls:
            - *c_clock
            - *c_room
          trigger:
            - call: "GET /property-rooms/${room_id}"
              payload: {}
              as: none
              captures: { err: $.data.error_id }
          assert:
            - "Responds 400 with ${err} == 'ERR_MISSING_USER_CONTEXT'"
            - "An empty-string X-User-Role produces the same error, and so does a present role with an absent X-User-ID on an entity_backed endpoint"
            - "The check precedes every other rule: the same headerless request to POST /evidence-items with an invalid body still returns ERR_MISSING_USER_CONTEXT, not ERR_INVALID_REQUEST"

      - name: request_with_unknown_role_rejected
        claim_type: Every error triggerable
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_INVALID_ROLE]"
        test_recipe:
          setup:
            - "Base fixture; the trigger uses a role string that is not one of the six declared roles."
          setup_api_calls:
            - *c_clock
            - *c_room
          trigger:
            - call: "GET /property-rooms/${room_id}"
              payload: {}
              as: PropertyClerk
              as_user_id: "anybody"
              captures: { err: $.data.error_id }
          assert:
            - "Responds 401 with ${err} == 'ERR_INVALID_ROLE' — an unrecognised role is an authentication failure, distinct from the 403 ERR_ROLE_NOT_PERMITTED for a recognised role calling the wrong endpoint"
            - "The role string is compared exactly: 'propertyroommanager' in lower case is also ERR_INVALID_ROLE"

      - name: custodian_role_type_mismatch_rejected
        claim_type: Every error triggerable
        grounds:
          - "validations[priority=4]"
          - "entities.Custodian.fields.role_type"
          - "errors[ERR_CUSTODIAN_ROLE_MISMATCH]"
        test_recipe:
          setup:
            - "Base fixture; L-200 is a LAB_ANALYST custodian and T-100 is an EVIDENCE_TECH custodian."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_tech
            - *c_lab
            - *c_case1
          trigger:
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Intake by the wrong custodian", category: "GENERAL", packaging_type: "PAPER_BAG", appraised_value_cents: 100, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${lab_id}"
              captures: { mismatch_err: $.data.error_id }
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Intake by an unknown custodian", category: "GENERAL", packaging_type: "PAPER_BAG", appraised_value_cents: 100, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "00000000-0000-4000-8000-0000000000aa"
              captures: { unknown_err: $.data.error_id }
          assert:
            - "Responds 403 with ${mismatch_err} == 'ERR_CUSTODIAN_ROLE_MISMATCH': the acting role EvidenceTechnician requires a Custodian whose role_type is EVIDENCE_TECH, and L-200 is LAB_ANALYST"
            - "${unknown_err} == 'ERR_CUSTODIAN_ROLE_MISMATCH' as well — priority 4 covers both 'not a custodian' and 'wrong custodian type' before any body validation runs"
            - "No EvidenceItem is created in either attempt"

      - name: scan_unknown_barcode_not_found
        claim_type: Every error triggerable
        grounds:
          - "validations[priority=7]"
          - "endpoints[POST /audit-sessions/{sessionId}/scan]"
          - "errors[ERR_BARCODE_NOT_FOUND]"
        test_recipe:
          setup:
            - "Base fixture; an audit session on the empty bin G-09 is scheduled and started."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_loc_g9
            - *c_aud
            - call: "POST /audit-sessions"
              payload: { storage_location_id: "${loc_g9_id}", auditor_id: "${aud_id}", scheduled_start_at: "2026-08-10T09:00:00Z", scheduled_end_at: "2026-08-10T17:00:00Z", expected_storage_location_version: "${loc_g9_v}" }
              as: InternalAuditor
              as_user_id: "${aud_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /audit-sessions/${sess_id}/start"
              payload: {}
              as: InternalAuditor
              as_user_id: "${aud_id}"
          trigger:
            - call: "POST /audit-sessions/${sess_id}/scan"
              payload: { barcode: "CPD-26-00001-0009-9" }
              as: InternalAuditor
              as_user_id: "${aud_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Responds 404 with ${err} == 'ERR_BARCODE_NOT_FOUND': a well-formed but unassigned barcode is a body-reference miss at priority 7"
            - "GET /audit-sessions/${sess_id} shows scanned_item_count == 0 and status still 'IN_PROGRESS'"

      - name: duplicate_case_number_rejected
        claim_type: Every error triggerable
        grounds:
          - "validations[priority=15]"
          - "entities.Case.fields.case_number"
          - "errors[ERR_DUPLICATE_CASE_NUMBER]"
        test_recipe:
          setup:
            - "Base fixture; CPD already holds case 26-00001, and the MPD room exists as a second scope."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_case1
            - *c_room2
          trigger:
            - call: "POST /cases"
              payload: { property_room_id: "${room_id}", case_number: "26-00001", offense_statute_id: "${th3_id}" }
              as: PropertyRoomManager
              captures: { dup_err: $.data.error_id }
            - call: "POST /cases"
              payload: { property_room_id: "${room2_id}", case_number: "26-00001", offense_statute_id: "${th3_id}" }
              as: PropertyRoomManager
              captures: { other_room_case: $.data.id }
            - call: "POST /offense-statutes"
              payload: { offense_code: "TH-3", description: "Duplicate statute code", preservation_class: "STANDARD", statutory_retention_days: 100, appeal_window_days: 10, destruction_requires_court_order: false }
              as: PropertyRoomManager
              captures: { statute_err: $.data.error_id }
          assert:
            - "Re-using 26-00001 inside CPD responds 409 with ${dup_err} == 'ERR_DUPLICATE_CASE_NUMBER'"
            - "${other_room_case} is created successfully: case_number uniqueness is scoped per property_room_id, so MPD may hold its own 26-00001"
            - "${statute_err} == 'ERR_DUPLICATE_OFFENSE_CODE' — offense_code is global, demonstrating that the two uniqueness scopes in priority 15 differ"
            - "GET /cases?property_room_id=${room_id} still returns total_count == 1"

      - name: disburse_without_held_proceeds_rejected
        claim_type: Every error triggerable
        grounds:
          - "validations[priority=31]"
          - "entities.DispositionOrder.fields.settlement_status"
          - "errors[ERR_NO_PROCEEDS_HELD]"
        test_recipe:
          setup:
            - "Base fixture; a GENERAL item appraised 40000 in case 26-00002 is stored in G-01, the case is charged and adjudicated at 2026-10-30, and an auto-authorized DESTRUCTION order is executed."
            - "Because the type is not AUCTION the order auto-settles inside execute with zero proceeds."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_ab1
            - *c_loc_g
            - *c_tech
            - *c_tech2
            - *c_inv
            - *c_aud
            - *c_case2
            - call: "POST /evidence-items"
              payload: { case_id: "${case2_id}", item_description: "Broken bicycle for destruction", category: "GENERAL", packaging_type: "CHAIN_TAG_ONLY", appraised_value_cents: 40000, seized_at: "2026-07-30T09:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id }
            - call: "POST /evidence-items/${item_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /cases/${case2_id}/charge"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-30T00:00:00Z" }
              as: PropertyRoomManager
            - call: "POST /cases/${case2_id}/adjudicate"
              payload: {}
              as: CourtClerk
            - call: "POST /disposition-orders"
              payload: { evidence_item_id: "${item_id}", type: "DESTRUCTION", requested_by_custodian_id: "${tech_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { order_id: $.data.id }
            - call: "POST /disposition-orders/${order_id}/execute"
              payload: { executed_by_custodian_id: "${tech2_id}", witness_custodian_id: "${aud_id}" }
              as: PropertyRoomManager
              captures: { status_after_exec: $.data.status, settle_status: $.data.settlement_status }
          trigger:
            - call: "POST /disposition-orders/${order_id}/disburse"
              payload: { payee_reference: "GL-2026-9001" }
              as: PropertyRoomManager
              captures: { err: $.data.error_id }
          assert:
            - "${status_after_exec} == 'SETTLED' and ${settle_status} == 'NONE': a DESTRUCTION never holds proceeds, so execute auto-settles with settled_net_proceeds_cents == 0"
            - "Responds 409 with ${err} == 'ERR_NO_PROCEEDS_HELD' — the order is in the right state (SETTLED) but has nothing to pay out, which is why this is a fiscal rule and not ERR_ORDER_STATE_INVALID"
            - "GET /property-rooms/${room_id} shows escrow_balance_cents == 0 and payee_reference stays null on the order"

      - name: sealed_location_blocks_operations_error
        claim_type: Every error triggerable
        excluded_because:
          difficulty_instance: return_blocked_while_storage_location_sealed
          rationale: "ERR_LOCATION_SEALED is already triggered by the §1.8 cross-entity instance, which returns an item to a bin that an active audit has sealed."

      - name: locked_down_room_blocks_operations_error
        claim_type: Every error triggerable
        excluded_because:
          difficulty_instance: lockdown_posture_beats_invalid_custody_state_on_execute
          rationale: "ERR_ROOM_LOCKED_DOWN is already triggered by the §1.8 priority-pair instance, which drives the room to LOCKED_DOWN through a high-risk MISSING discrepancy and then attempts a gated operation."

  # ===========================================================================
  - section: rbac
    instances:

      - name: court_clerk_can_authorize_and_reject_orders
        claim_type: Can perform all exclusive_operations and shared_operations
        grounds:
          - "endpoints[POST /disposition-orders/{orderId}/authorize]"
          - "endpoints[POST /disposition-orders/{orderId}/reject]"
          - "endpoints[POST /cases/{caseId}/adjudicate]"
        test_recipe:
          setup:
            - "Base fixture; case 26-00002 (statute AB-1) holds two FIREARM items stored in the vault V-01, so neither order can be auto-authorized."
            - "The case is charged, the clock advanced to 2026-10-30 and adjudicated by the clerk, leaving both items DISPOSAL_ELIGIBLE; one DESTRUCTION order is raised per item."
          setup_api_calls:
