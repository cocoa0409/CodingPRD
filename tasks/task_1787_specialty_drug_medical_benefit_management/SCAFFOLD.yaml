# =============================================================================
# Specialty Drug Medical-Benefit Management — benchmark seed tables
# =============================================================================

scenario: |
  Specialty Drug Medical-Benefit Management (health plan pharmacy department): buy-and-bill vs specialty-pharmacy sourcing decision, J-code billing & unit/waste (JW modifier) validation, site-of-care redirection program, biosimilar substitution policy & incentives, dose optimization & weight-based rounding rules, provider reimbursement methodology (ASP-based) updates, authorization & clinical policy alignment, spend forecasting by drug pipeline

domain_name: specialty-drug-medical-benefit
api_prefix: /api

complexity_profile:
  primary_archetype: "Pricing engine"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - "Dual-variant calculation"
    - "Cascading side effects"
    - "Optimistic concurrency"
    - "Scheduled / deferred actions"
  entity_topology: flat            # all entities top-level; relationships via FK fields + filtered lists
  state_machine_shape: branching   # claim adjudication forks (auto-approve vs pend-review) + auth suspend/reinstate cycle
  relationship_patterns:
    - one_to_many        # drug -> schedules/policies; auth -> claims/redirections; claim -> adjustments
    - cross_aggregate    # claim -> provider account ledger; claim -> biosimilar policy lookup
  role_model: peer_roles           # PlanAdmin / MedicalPolicyOfficer / ProviderRep / CaseManager / PharmacyAnalyst own different surfaces
  consistency_model: immediate     # all mutations + cascades atomic within the request

# =============================================================================
# Table 1: Entity-Relationship Table  (flat topology; all entities parent: null)
# =============================================================================
entities:
  - name: DrugCatalogEntry
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: j_code, type: string, source: input, description: "HCPCS J-code (e.g. J1745); unique across all drugs (ERR_JCODE_NOT_UNIQUE)" }
      - { name: drug_name, type: string, source: input, description: "Display name of the specialty drug" }
      - { name: billing_unit_mg, type: integer, source: input, description: "Milligrams represented by ONE billed J-code unit; >= 1" }
      - { name: vial_size_mg, type: integer, source: input, description: "Single vial size in mg; must be a positive multiple of billing_unit_mg (ERR_INVALID_VIAL_UNIT_RATIO)" }
      - { name: single_dose_vial, type: boolean, source: input, description: "JW-modifier waste is payable only when true" }
      - { name: sourcing_rule, type: enum, source: input, description: "BUY_AND_BILL_ONLY | SPECIALTY_PHARMACY_ONLY | EITHER — drives the buy-and-bill vs specialty-pharmacy sourcing decision on claims" }
      - { name: weight_based_dosing, type: boolean, source: input, default: false, description: "When true, dose optimization computes raw dose from weight_kg x mg_per_kg" }
      - { name: mg_per_kg, type: number, source: input, required: false, description: "Required iff weight_based_dosing = true; must be absent otherwise (ERR_INVALID_REQUEST)" }
      - { name: dose_rounding_mode, type: enum, source: input, description: "VIAL (ceil to whole vial multiple) | INCREMENT (round_half_up to rounding_increment_mg)" }
      - { name: rounding_increment_mg, type: integer, source: input, required: false, description: "Required iff dose_rounding_mode = INCREMENT; must be absent otherwise (ERR_INVALID_REQUEST)" }
      - { name: max_single_dose_mg, type: integer, source: input, description: "Inclusive cap: requested/computed dose == max is allowed, max + 1 rejected (ERR_DOSE_EXCEEDS_MAX)" }
      - { name: site_of_care_eligible, type: boolean, source: input, description: "Drug participates in the site-of-care redirection program" }

  - name: AspRateSchedule
    parent: null
    common_fields: true
    fields:
      - { name: drug_id, type: string, source: input, description: "FK -> DrugCatalogEntry.id; schedule belongs to this drug" }
      - { name: effective_start, type: string, source: input, description: "ISO date (YYYY-MM-DD) from which this ASP rate applies; several schedules may share the same effective_start — the one with the latest created_at wins" }
      - { name: asp_rate_cents, type: integer, source: input, description: "Average Sales Price per billing unit in cents; must be > 0 (ERR_INVALID_REQUEST)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED (effective_start in future) | EFFECTIVE | SUPERSEDED; a create with effective_start <= current date lands directly in EFFECTIVE" }

  - name: ClinicalPolicy
    parent: null
    common_fields: true
    fields:
      - { name: drug_id, type: string, source: input, description: "FK -> DrugCatalogEntry.id; policy governs this drug" }
      - { name: covered_diagnoses, type: array, source: input, description: "Non-empty list of covered ICD-10 diagnosis codes" }
      - { name: step_therapy_required, type: boolean, source: input, description: "When true, auth approval requires step_therapy_completed = true on the authorization" }
      - { name: requires_site_of_care_redirection, type: boolean, source: input, description: "When true (and drug site_of_care_eligible), auth approval auto-creates an OFFERED SiteOfCareRedirection" }
      - { name: biosimilar_substitution, type: enum, source: input, description: "DISABLED | PREFERRED | MANDATORY — MANDATORY blocks approval for the reference drug while an ACTIVE biosimilar policy covers requested_start_date (ERR_BIOSIMILAR_SUBSTITUTION_REQUIRED)" }
      - { name: version_no, type: integer, source: system, description: "Per-drug sequential version number, starts at 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUPERSEDED; creating/activating a version supersedes the prior ACTIVE version" }

  - name: ProviderAccount
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Provider organization name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RECOUPMENT_HOLD; HOLD entered automatically when recoupment_balance_cents becomes > 0" }
      - { name: cumulative_paid_cents, type: integer, source: computed, default: 0, description: "Ledger: += claim.allowed_amount_cents on pay; += delta_cents of each reprice adjustment" }
      - { name: recoupment_balance_cents, type: integer, source: computed, default: 0, description: "Sum of outstanding negative reprice deltas (as positive cents); zeroed by settle-recoupment" }

  - name: PriorAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: drug_id, type: string, source: input, description: "FK -> DrugCatalogEntry.id; drug being authorized" }
      - { name: member_id, type: string, source: input, description: "Health plan member identifier (opaque string)" }
      - { name: provider_account_id, type: string, source: system, description: "FK -> ProviderAccount.id; set from X-User-ID of the creating ProviderRep" }
      - { name: diagnosis_code, type: string, source: input, description: "ICD-10 diagnosis code; must be in the ACTIVE clinical policy's covered_diagnoses at approval" }
      - { name: requested_dose_mg, type: number, source: input, required: false, description: "Required iff drug is not weight_based (ERR_MISSING_WEIGHT_OR_DOSE); inclusive cap max_single_dose_mg applies (ERR_DOSE_EXCEEDS_MAX)" }
      - { name: weight_kg, type: number, source: input, required: false, description: "Required iff drug.weight_based_dosing = true (ERR_MISSING_WEIGHT_OR_DOSE)" }
      - { name: requested_start_date, type: string, source: input, description: "ISO date; must be >= current date (ERR_START_DATE_IN_PAST)" }
      - { name: step_therapy_completed, type: boolean, source: input, default: false, description: "Member completed required step therapy" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DENIED | SUSPENDED | EXPIRED | CANCELLED | EXHAUSTED" }
      - { name: approved_dose_mg, type: number, source: computed, description: "null until approval; output of dose_optimization calculation" }
      - { name: validity_start, type: string, source: system, description: "= requested_start_date, set at approval" }
      - { name: validity_end, type: string, source: system, description: "= validity_start + 180 days, INCLUSIVE (closed interval)" }
      - { name: max_administrations, type: integer, source: system, description: ">= 1; supplied at approval" }
      - { name: administrations_used, type: integer, source: computed, default: 0, description: "Incremented when a claim reaches APPROVED_FOR_PAYMENT; reaching max_administrations auto-exhausts the auth" }
      - { name: policy_id, type: string, source: system, description: "FK -> ClinicalPolicy.id; null until approval; pinned version used at approval (version-pinning on approval)" }
      - { name: policy_version_no, type: integer, source: system, description: "ClinicalPolicy.version_no pinned at approval; null until approval" }
      - { name: denial_reason, type: string, source: system, description: "Set on deny; null otherwise" }

  - name: InfusionClaim
    parent: null
    common_fields: true
    fields:
      - { name: auth_id, type: string, source: input, description: "FK -> PriorAuthorization.id; authorization being billed against" }
      - { name: drug_id, type: string, source: input, description: "FK -> DrugCatalogEntry.id; must equal auth.drug_id (ERR_DRUG_AUTH_MISMATCH)" }
      - { name: provider_account_id, type: string, source: system, description: "FK -> ProviderAccount.id; set from X-User-ID of the creating ProviderRep" }
      - { name: service_date, type: string, source: input, description: "ISO date of administration; must be <= current date (ERR_FUTURE_SERVICE_DATE) and inside auth validity window (ERR_SERVICE_DATE_OUT_OF_WINDOW)" }
      - { name: site_of_care, type: enum, source: input, description: "HOPD | OFFICE | HOME | AMBULATORY" }
      - { name: sourcing_path, type: enum, source: input, description: "BUY_AND_BILL | WHITE_BAG; validated against drug.sourcing_rule (ERR_SOURCING_VIOLATION)" }
      - { name: j_code_billed, type: string, source: input, description: "Must equal the drug's catalog j_code (ERR_JCODE_MISMATCH)" }
      - { name: billed_units, type: integer, source: input, description: "Administered J-code units; >= 1" }
      - { name: waste_units, type: integer, source: input, default: 0, description: "Discarded units from a single-dose vial; > 0 requires jw_modifier = true (ERR_JW_MODIFIER_REQUIRED); must be < vial_size_mg / billing_unit_mg (ERR_WASTE_EXCEEDS_VIAL)" }
      - { name: jw_modifier, type: boolean, source: input, default: false, description: "JW modifier flag; true with waste_units = 0 is rejected (ERR_JW_WITHOUT_WASTE)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED (transient at create) -> APPROVED_FOR_PAYMENT | PENDED -> PAID -> ADJUSTED | DENIED" }
      - { name: pend_reason, type: enum, source: system, description: "DOSE_REVIEW | AUTH_SUSPENDED; null when not PENDED" }
      - { name: administered_mg, type: number, source: computed, description: "= billed_units x drug.billing_unit_mg (excludes waste)" }
      - { name: payable_waste_units, type: integer, source: computed, description: "= waste_units when drug.single_dose_vial and jw_modifier; else 0" }
      - { name: asp_schedule_id_used, type: string, source: system, description: "FK -> AspRateSchedule.id; schedule whose rate priced this claim" }
      - { name: asp_rate_cents, type: number, source: computed, description: "ASP per billing unit captured at pricing" }
      - { name: addon_pct_applied, type: number, source: computed, description: "Total add-on fraction applied (base + redirection + biosimilar incentive)" }
      - { name: allowed_amount_cents, type: integer, source: computed, description: "Plan payment per claim_allowed_amount (per-component rounding)" }
      - { name: member_cost_share_cents, type: integer, source: computed, description: "Member coinsurance per member_cost_share; computed at adjudication and NOT retro-adjusted on ASP repricing" }
      - { name: override_by, type: string, source: system, description: "X-User-ID of the MedicalPolicyOfficer who override-approved; null on the direct-approval branch" }
      - { name: denial_reason, type: string, source: system, description: "Set when DENIED; null otherwise" }
      - { name: paid_at, type: string, source: system, description: "ISO datetime of payment; null until PAID" }

  - name: ClaimAdjustment
    parent: null
    common_fields: false   # immutable event: id + created_at only
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> InfusionClaim.id; claim being repriced" }
      - { name: asp_schedule_id, type: string, source: system, description: "FK -> AspRateSchedule.id; schedule that triggered the repricing" }
      - { name: old_allowed_cents, type: integer, source: system, description: "allowed_amount_cents before repricing" }
      - { name: new_allowed_cents, type: integer, source: system, description: "allowed_amount_cents after repricing" }
      - { name: delta_cents, type: integer, source: system, description: "= new_allowed_cents - old_allowed_cents (may be negative)" }
      - { name: reason, type: enum, source: system, description: "ASP_RETRO" }

  - name: SiteOfCareRedirection
    parent: null
    common_fields: true
    fields:
      - { name: auth_id, type: string, source: system, description: "FK -> PriorAuthorization.id; created automatically at auth approval when policy requires redirection" }
      - { name: from_site, type: enum, source: system, description: "HOPD — the high-cost site being redirected away from" }
      - { name: candidate_sites, type: array, source: system, description: "[OFFICE, HOME, AMBULATORY]" }
      - { name: accepted_site, type: enum, source: system, description: "OFFICE | HOME | AMBULATORY once accepted; null until then" }
      - { name: member_incentive_cents, type: integer, source: computed, default: 0, description: "Estimated waived member cost share, set at acceptance per redirection_incentive_estimate" }
      - { name: status, type: enum, source: system, description: "OFFERED | ACCEPTED | DECLINED | EXPIRED (offer lapses 30 days after creation or on auth cancel)" }

  - name: BiosimilarPolicy
    parent: null
    common_fields: true
    fields:
      - { name: reference_drug_id, type: string, source: input, description: "FK -> DrugCatalogEntry.id; reference biologic" }
      - { name: biosimilar_drug_id, type: string, source: input, description: "FK -> DrugCatalogEntry.id; preferred biosimilar (must differ from reference: ERR_REFERENCE_SELF_BIOSIMILAR; must not be mapped by another ACTIVE policy: ERR_BIOSIMILAR_ALREADY_MAPPED)" }
      - { name: provider_incentive_addon_pct, type: number, source: input, description: "Extra reimbursement add-on fraction (0, 0.10] when billing the biosimilar inside the window" }
      - { name: member_copay_waiver_pct, type: number, source: input, description: "Fraction of member cost share waived [0, 1] for biosimilar claims inside the window" }
      - { name: effective_start, type: string, source: input, description: "ISO date, HALF-OPEN start (inclusive)" }
      - { name: effective_end, type: string, source: input, description: "ISO date, HALF-OPEN end (exclusive); must be > effective_start (ERR_INVALID_WINDOW)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | EXPIRED (system when current date >= effective_end)" }

  - name: PipelineDrug
    parent: null
    common_fields: true
    fields:
      - { name: drug_name, type: string, source: input, description: "Investigational / pipeline drug name" }
      - { name: expected_approval_date, type: string, source: input, description: "ISO date of expected launch" }
      - { name: prevalence_per_100k, type: number, source: input, description: "Eligible patients per 100,000 members; > 0" }
      - { name: projected_annual_cost_cents, type: integer, source: input, description: "Projected annual cost per treated patient; > 0" }
      - { name: year1_uptake_pct, type: number, source: input, description: "Fraction of eligible patients treated in the launch year, (0, 1]" }
      - { name: steady_state_uptake_pct, type: number, source: input, description: "Fraction treated in each full post-launch year, (0, 1]" }
      - { name: biosimilar_erosion_pct, type: number, source: input, description: "Cost erosion fraction [0, 1) applied only by the POLICY_ADJUSTED forecast variant" }

  - name: SpendForecastRun
    parent: null
    common_fields: false   # immutable computed snapshot: id + created_at only
    fields:
      - { name: variant, type: enum, source: input, description: "BASELINE | POLICY_ADJUSTED" }
      - { name: horizon_years, type: integer, source: input, description: "1..5" }
      - { name: enrollment_projection, type: integer, source: input, description: "Projected member count; >= 1" }
      - { name: as_of_date, type: string, source: system, description: "Clock date at creation" }
      - { name: pipeline_total_cents, type: integer, source: computed, description: "Sum of per-drug pipeline projections over the horizon" }
      - { name: inline_annualized_cents, type: integer, source: computed, description: "Annualized in-line spend per inline_annualized_spend" }
      - { name: total_projected_cents, type: integer, source: computed, description: "= pipeline_total_cents + inline_annualized_cents x horizon_years" }
      - { name: per_drug_projections, type: array, source: computed, description: "List of { pipeline_drug_id, projected_cents } for included pipeline drugs" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: PriorAuthorization
    initial_state: SUBMITTED
    terminal_states: [DENIED, EXPIRED, CANCELLED, EXHAUSTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/prior-authorizations/{authId}/approve"
        actor: MedicalPolicyOfficer
        preconditions:
          - "Auth in SUBMITTED (ERR_AUTH_NOT_PENDING)"
          - "An ACTIVE ClinicalPolicy exists for auth.drug_id (ERR_NO_ACTIVE_POLICY)"
          - "diagnosis_code in policy.covered_diagnoses (ERR_DIAGNOSIS_NOT_COVERED)"
          - "If policy.step_therapy_required: auth.step_therapy_completed must be true (ERR_STEP_THERAPY_REQUIRED)"
          - "If policy.biosimilar_substitution = MANDATORY: no ACTIVE BiosimilarPolicy with reference_drug_id = auth.drug_id may cover requested_start_date in [effective_start, effective_end) (ERR_BIOSIMILAR_SUBSTITUTION_REQUIRED)"
          - "dose_optimization result <= drug.max_single_dose_mg (ERR_DOSE_EXCEEDS_MAX)"
          - "No other auth for the same member_id + drug_id in APPROVED or SUSPENDED with an overlapping CLOSED validity window: overlap iff validity_start <= other.validity_end AND other.validity_start <= validity_end (touching dates DO overlap) (ERR_AUTH_WINDOW_OVERLAP)"
        side_effects:
          - "approved_dose_mg = dose_optimization(drug, requested_dose_mg | weight_kg)"
          - "validity_start = requested_start_date; validity_end = validity_start + 180 days (inclusive)"
          - "policy_id / policy_version_no pinned from the ACTIVE policy; administrations_used = 0"
          - "If policy.requires_site_of_care_redirection AND drug.site_of_care_eligible: create SiteOfCareRedirection (OFFERED, from_site HOPD, candidate_sites [OFFICE, HOME, AMBULATORY])"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /api/prior-authorizations/{authId}/deny"
        actor: MedicalPolicyOfficer
        preconditions:
          - "Auth in SUBMITTED (ERR_AUTH_NOT_PENDING)"
        side_effects: ["denial_reason = payload.reason"]
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /api/prior-authorizations/{authId}/suspend"
        actor: MedicalPolicyOfficer
        preconditions:
          - "Auth in APPROVED (ERR_AUTH_NOT_APPROVED)"
        side_effects:
          - "CASCADE hop 1->2: every InfusionClaim with auth_id = this auth in APPROVED_FOR_PAYMENT -> PENDED with pend_reason = AUTH_SUSPENDED (PAID/ADJUSTED/PENDED(DOSE_REVIEW) claims untouched)"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /api/prior-authorizations/{authId}/reinstate"
        actor: MedicalPolicyOfficer
        preconditions:
          - "Auth in SUSPENDED (ERR_AUTH_NOT_SUSPENDED)"
        side_effects:
          - "CASCADE: every InfusionClaim with auth_id = this auth in PENDED with pend_reason = AUTH_SUSPENDED -> APPROVED_FOR_PAYMENT (PENDED(DOSE_REVIEW) claims stay PENDED); administrations_used unchanged"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /api/prior-authorizations/{authId}/cancel"
        actor: MedicalPolicyOfficer
        preconditions:
          - "Auth in SUBMITTED, APPROVED, or SUSPENDED (ERR_AUTH_NOT_CANCELLABLE from terminal states)"
        side_effects:
          - "OFFERED SiteOfCareRedirection for this auth -> EXPIRED (offer withdrawn)"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /api/prior-authorizations/{authId}/cancel"
        actor: MedicalPolicyOfficer
        preconditions:
          - "Auth in SUBMITTED, APPROVED, or SUSPENDED (ERR_AUTH_NOT_CANCELLABLE from terminal states)"
        side_effects:
          - "OFFERED SiteOfCareRedirection for this auth -> EXPIRED (offer withdrawn)"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /api/prior-authorizations/{authId}/cancel"
        actor: MedicalPolicyOfficer
        preconditions:
          - "Auth in SUBMITTED, APPROVED, or SUSPENDED (ERR_AUTH_NOT_CANCELLABLE from terminal states)"
        side_effects:
          - "OFFERED SiteOfCareRedirection for this auth -> EXPIRED (offer withdrawn)"
      - from: APPROVED
        to: EXPIRED
        trigger: "system (clock: current date > validity_end; applied lazily before any precondition check on the auth and eagerly on POST /api/_clock/set_current_utc)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system (clock: current date > validity_end)"
        actor: system
        preconditions: []
        side_effects:
          - "Claims PENDED with pend_reason = AUTH_SUSPENDED for this auth -> DENIED with denial_reason = AUTH_EXPIRED"
      - from: APPROVED
        to: EXHAUSTED
        trigger: "system (automatic when administrations_used reaches max_administrations after a claim approval debit)"
        actor: system
        preconditions: []
        side_effects: []
        note: "EXHAUSTED is terminal; claims against it fail with ERR_AUTH_NOT_APPROVED"

  - entity: InfusionClaim
    initial_state: SUBMITTED
    terminal_states: [DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED_FOR_PAYMENT
        trigger: "system (synchronous adjudication inside POST /api/claims when all validations pass and administered_mg <= approved_dose_mg)"
        actor: system
        preconditions:
          - "Full §1.4 claim validation chain passes (auth APPROVED; referential, temporal, sourcing, site, JW/waste, fiscal checks)"
        side_effects:
          - "claim_allowed_amount computed and stored (allowed_amount_cents, asp_rate_cents, addon_pct_applied, payable_waste_units, asp_schedule_id_used)"
          - "member_cost_share computed and stored"
          - "CASCADE hop 1->2: auth.administrations_used += 1"
          - "CASCADE hop 2->3: if administrations_used == auth.max_administrations then auth -> EXHAUSTED"
      - from: SUBMITTED
        to: PENDED
        trigger: "system (adjudication inside POST /api/claims when approved_dose_mg < administered_mg AND administered_mg x 10 <= approved_dose_mg x 11, i.e. overage within the inclusive 110% tolerance)"
        actor: system
        preconditions: []
        side_effects:
          - "pend_reason = DOSE_REVIEW; provisional pricing computed (allowed_amount_cents, member_cost_share_cents) but NO auth administration debit"
      - from: PENDED
        to: APPROVED_FOR_PAYMENT
        trigger: "POST /api/claims/{claimId}/override-approve"
        actor: MedicalPolicyOfficer
        preconditions:
          - "Claim in PENDED (ERR_CLAIM_NOT_PENDED)"
          - "Auth is APPROVED (ERR_AUTH_NOT_APPROVED); an APPROVED auth always has administrations_used < max_administrations because reaching the cap auto-exhausts it"
        side_effects:
          - "override_by = X-User-ID of the MedicalPolicyOfficer (divergent branch marker vs the direct-approval branch)"
          - "CASCADE hop 1->2: auth.administrations_used += 1"
          - "CASCADE hop 2->3: if administrations_used == auth.max_administrations then auth -> EXHAUSTED"
      - from: PENDED
        to: DENIED
        trigger: "POST /api/claims/{claimId}/deny"
        actor: MedicalPolicyOfficer
        preconditions:
          - "Claim in PENDED (ERR_CLAIM_NOT_PENDED)"
        side_effects: ["denial_reason = payload.reason"]
      - from: PENDED
        to: DENIED
        trigger: "system (auth expiry sweep: pend_reason = AUTH_SUSPENDED and auth -> EXPIRED)"
        actor: system
        preconditions: []
        side_effects: ["denial_reason = AUTH_EXPIRED"]
      - from: APPROVED_FOR_PAYMENT
        to: PENDED
        trigger: "system (auth suspension cascade)"
        actor: system
        preconditions: []
        side_effects: ["pend_reason = AUTH_SUSPENDED"]
      - from: APPROVED_FOR_PAYMENT
        to: PAID
        trigger: "POST /api/claims/{claimId}/pay"
        actor: PlanAdmin
        preconditions:
          - "Claim in APPROVED_FOR_PAYMENT (ERR_CLAIM_NOT_PAYABLE)"
          - "ProviderAccount.status == ACTIVE (ERR_PROVIDER_RECOUPMENT_HOLD)"
        side_effects:
          - "paid_at = current clock timestamp"
          - "LEDGER SYNC: ProviderAccount.cumulative_paid_cents += allowed_amount_cents"
      - from: PAID
        to: ADJUSTED
        trigger: "system (asp_retro_repricing when a newly EFFECTIVE schedule covers claim.service_date)"
        actor: system
        preconditions: []
        side_effects:
          - "ClaimAdjustment created {old_allowed_cents, new_allowed_cents, delta_cents, reason ASP_RETRO}"
          - "allowed_amount_cents = repriced value at new rate (member_cost_share_cents NOT retro-adjusted)"
          - "LEDGER SYNC: ProviderAccount.cumulative_paid_cents += delta_cents; if delta_cents < 0 then recoupment_balance_cents += -delta_cents"
          - "If recoupment_balance_cents > 0 then ProviderAccount -> RECOUPMENT_HOLD"
      - from: ADJUSTED
        to: ADJUSTED
        trigger: "system (further asp_retro_repricing)"
        actor: system
        preconditions: []
        side_effects:
          - "Same ClaimAdjustment + ledger + recoupment side effects as PAID -> ADJUSTED"
    note: "Claims in APPROVED_FOR_PAYMENT or PENDED inside a reprice window are repriced IN PLACE (allowed_amount_cents updated, no ClaimAdjustment, no ledger movement)."

  - entity: AspRateSchedule
    initial_state: SCHEDULED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: SCHEDULED
        to: EFFECTIVE
        trigger: "system (clock sweep when current date >= effective_start) OR at create when effective_start <= current date (create lands directly in EFFECTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE hop 1->2: every other EFFECTIVE schedule for the same drug -> SUPERSEDED (if several schedules are due, activate in effective_start ASC order so the latest-dated one ends EFFECTIVE)"
          - "CASCADE hop 2->3: asp_retro_repricing over claims with drug_id = schedule.drug_id and service_date >= effective_start: PAID/ADJUSTED claims -> ADJUSTED with ClaimAdjustment per claim; APPROVED_FOR_PAYMENT/PENDED claims repriced in place"
          - "CASCADE hop 3->4: each ClaimAdjustment's delta_cents applied to the claim's ProviderAccount.cumulative_paid_cents; negative deltas accumulate recoupment_balance_cents; balance > 0 flips ProviderAccount -> RECOUPMENT_HOLD"
    note: "The effective ASP for a service date = asp_rate_cents of the schedule of that drug with the greatest effective_start <= service_date; ties broken by latest created_at."

  - entity: ClinicalPolicy
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/clinical-policies/{policyId}/activate  (also POST /api/clinical-policies with status=ACTIVE performs DRAFT->ACTIVE atomically at create)"
        actor: MedicalPolicyOfficer
        preconditions:
          - "Policy in DRAFT (ERR_POLICY_NOT_DRAFT)"
          - "OCC: expected_drug_version == drug.version (ERR_STALE_DRUG_VERSION, checked before business rules)"
        side_effects:
          - "Prior ACTIVE ClinicalPolicy for the same drug -> SUPERSEDED (create-with-supersede)"
          - "increments DrugCatalogEntry.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (another policy version for the same drug becomes ACTIVE)"
        actor: system
        preconditions: []
        side_effects: []
        note: "SUPERSEDED policies remain pinned on auths approved under them (version-pinning on approval); they never govern new approvals."

  - entity: SiteOfCareRedirection
    initial_state: OFFERED
    terminal_states: [DECLINED, EXPIRED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /api/redirections/{redirectionId}/accept"
        actor: CaseManager
        preconditions:
          - "Redirection in OFFERED (ERR_REDIRECTION_NOT_OFFERED)"
          - "accepted_site in candidate_sites (ERR_INVALID_REQUEST)"
          - "Auth is APPROVED (ERR_AUTH_NOT_APPROVED)"
        side_effects:
          - "accepted_site = payload.accepted_site"
          - "member_incentive_cents = redirection_incentive_estimate"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /api/redirections/{redirectionId}/decline"
        actor: CaseManager
        preconditions:
          - "Redirection in OFFERED (ERR_REDIRECTION_NOT_OFFERED)"
        side_effects: []
      - from: OFFERED
        to: EXPIRED
        trigger: "system (clock: current date > creation date + 30 days) OR auth cancellation"
        actor: system
        preconditions: []
        side_effects: []
    note: "An ACCEPTED redirection constrains later claims: site_of_care must equal accepted_site (ERR_SITE_OF_CARE_VIOLATION); a matching site earns the redirection add-on and waives member cost share."

  - entity: BiosimilarPolicy
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/biosimilar-policies/{policyId}/activate"
        actor: PlanAdmin
        preconditions:
          - "Policy in DRAFT (ERR_BIOSIMILAR_POLICY_NOT_DRAFT)"
          - "No other ACTIVE policy for the same reference_drug_id with an overlapping HALF-OPEN window: overlap iff effective_start < other.effective_end AND other.effective_start < effective_end (a touching boundary end == start does NOT overlap) (ERR_POLICY_WINDOW_OVERLAP)"
          - "biosimilar_drug_id not mapped by any other ACTIVE policy (ERR_BIOSIMILAR_ALREADY_MAPPED)"
        side_effects:
          - "CASCADE hop 1->2: in-flight repricing — claims with drug_id = biosimilar_drug_id, status APPROVED_FOR_PAYMENT or PENDED, and service_date inside [effective_start, effective_end) are repriced IN PLACE with the incentive add-on (no ClaimAdjustment, no ledger movement)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock: current date >= effective_end)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ProviderAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: RECOUPMENT_HOLD
        trigger: "system (automatic when recoupment_balance_cents becomes > 0 during asp_retro_repricing)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RECOUPMENT_HOLD
        to: ACTIVE
        trigger: "POST /api/provider-accounts/{accountId}/settle-recoupment"
        actor: PlanAdmin
        preconditions:
          - "Account in RECOUPMENT_HOLD (ERR_PROVIDER_NOT_ON_HOLD)"
        side_effects: ["recoupment_balance_cents = 0"]

# =============================================================================
# Table 2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: policy-create-stale-drug
    parent_entity: DrugCatalogEntry
    write_endpoint: "POST /api/clinical-policies"
    occ_field: expected_drug_version
    description: |
      Creating a ClinicalPolicy (any status) against a DrugCatalogEntry whose
      version has advanced since the client last observed it is rejected. This
      captures the case where another writer has just created or activated a
      policy version (which legitimately supersedes the prior ACTIVE policy
      under the create-with-supersede rule) and the current writer's view of
      the drug's policy lineage is therefore stale.
    error_id: ERR_STALE_DRUG_VERSION
    http_status: 412
  - rule_id: policy-activate-stale-drug
    parent_entity: DrugCatalogEntry
    write_endpoint: "POST /api/clinical-policies/{policyId}/activate"
    occ_field: expected_drug_version
    description: |
      Activating a DRAFT ClinicalPolicy against a DrugCatalogEntry whose
      version has advanced since the client last observed it is rejected,
      because activation supersedes the currently ACTIVE version and must not
      be based on a stale view of the drug's policy lineage.
    error_id: ERR_STALE_DRUG_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: dose_optimization
    trigger: "PriorAuthorization approval (SUBMITTED -> APPROVED)"
    algorithm: threshold
    formula: |
      raw_mg = auth.requested_dose_mg                      # non-weight-based drugs
             = auth.weight_kg * drug.mg_per_kg             # weight_based_dosing drugs
      variant VIAL:      approved_dose_mg = ceil(raw_mg / drug.vial_size_mg) * drug.vial_size_mg
      variant INCREMENT: approved_dose_mg = round_half_up(raw_mg / drug.rounding_increment_mg) * drug.rounding_increment_mg
      cap: approved_dose_mg <= drug.max_single_dose_mg else approval fails with ERR_DOSE_EXCEEDS_MAX
    input_set: "The single PriorAuthorization being approved and its DrugCatalogEntry"
    constants:
      AUTH_VALIDITY_DAYS: 180
    precision: "dose in whole mg (integer arithmetic); raw_mg kept exact until rounding"
    variants:
      - name: VIAL
        when: "drug.dose_rounding_mode = VIAL"
        difference: "Rounds UP to a whole-vial multiple (ceil) — guarantees enough drug on hand; e.g. raw 172 mg with 100 mg vials -> 200 mg"
      - name: INCREMENT
        when: "drug.dose_rounding_mode = INCREMENT"
        difference: "Rounds to NEAREST increment with round_half_up — e.g. raw 172 mg with 10 mg increment -> 170 mg"

  - name: claim_allowed_amount
    trigger: "claim adjudication (POST /api/claims), claim override-approve re-pricing is NOT done (price fixed at adjudication), asp_retro_repricing, biosimilar activation in-flight repricing"
    algorithm: tiered_pricing
    formula: |
      rate  = asp_rate_cents of the drug's schedule with greatest effective_start <= service_date
              (tie -> latest created_at); none -> ERR_NO_ASP_RATE
      addon = BASE_ADDON_PCT
            + REDIRECTED_SITE_ADDON_PCT   iff auth has an ACCEPTED redirection AND claim.site_of_care == redirection.accepted_site
            + policy.provider_incentive_addon_pct  iff an ACTIVE BiosimilarPolicy has biosimilar_drug_id == claim.drug_id
                                                   AND effective_start <= service_date < effective_end
      payable_waste_units = waste_units iff (drug.single_dose_vial AND jw_modifier) else 0
      PINNED ROUNDING ORDER (per-component, then sum):
        drug_amount_cents  = round_half_up(billed_units        * rate * (1 + addon))
        waste_amount_cents = round_half_up(payable_waste_units * rate * (1 + addon))
        allowed_amount_cents = drug_amount_cents + waste_amount_cents
      (Sum-then-round is a DIFFERENT, non-conformant result: e.g. rate 325, addon 0.06,
       billed 3 + waste 1 -> 1034 + 345 = 1379 per-component vs 1378 sum-first.)
    input_set: "The single claim; ASP rate as of service_date; redirection of claim.auth_id; ACTIVE biosimilar policies"
    constants:
      BASE_ADDON_PCT: 0.06
      REDIRECTED_SITE_ADDON_PCT: 0.02
    precision: "integer cents, round_half_up, applied PER COMPONENT before summation"

  - name: member_cost_share
    trigger: "claim adjudication (same moment as claim_allowed_amount); recomputed whenever an UNPAID claim (APPROVED_FOR_PAYMENT or PENDED) is repriced in place (ASP retro or biosimilar activation); NEVER recomputed for PAID/ADJUSTED claims"
    algorithm: threshold
    formula: |
      if auth has ACCEPTED redirection AND claim.site_of_care == redirection.accepted_site:
          member_cost_share_cents = 0
      else:
          waiver = policy.member_copay_waiver_pct of the ACTIVE BiosimilarPolicy whose biosimilar_drug_id == claim.drug_id
                   and whose window covers service_date; 0 when none
          member_cost_share_cents = round_half_up(allowed_amount_cents * COINSURANCE_PCT * (1 - waiver))
    input_set: "The single claim after allowed_amount_cents is computed"
    constants:
      COINSURANCE_PCT: 0.20
    precision: "integer cents, round_half_up, single rounding at the end"

  - name: redirection_incentive_estimate
    trigger: "SiteOfCareRedirection OFFERED -> ACCEPTED"
    algorithm: aggregation
    formula: |
      est_units   = ceil(auth.approved_dose_mg / drug.billing_unit_mg)
      est_rate    = asp_rate_cents effective on the CURRENT clock date (greatest effective_start <= today, tie -> latest created_at); none -> ERR_NO_ASP_RATE
      est_allowed = round_half_up(est_units * est_rate * (1 + BASE_ADDON_PCT))
      member_incentive_cents = round_half_up(est_allowed * COINSURANCE_PCT)
    input_set: "The redirection's auth, its drug, the ASP effective today"
    constants:
      BASE_ADDON_PCT: 0.06
      COINSURANCE_PCT: 0.20
    precision: "integer cents, round_half_up"

  - name: asp_retro_repricing
    trigger: "an AspRateSchedule becomes EFFECTIVE (immediate at create when effective_start <= today, or via clock sweep)"
    algorithm: chronological
    formula: |
      candidate claims = InfusionClaim where drug_id = schedule.drug_id
                         AND service_date >= schedule.effective_start
                         AND asp_schedule_id_used != schedule.id
      process in order: service_date ASC, then created_at ASC (never id)
      for each claim:
        new_allowed = claim_allowed_amount evaluated at the NEW rate (same units, addon recomputed with current rules)
        if claim.status in {PAID, ADJUSTED}:
            create ClaimAdjustment{old_allowed_cents, new_allowed_cents, delta_cents, ASP_RETRO, asp_schedule_id = schedule.id}
            claim.allowed_amount_cents = new_allowed; claim.status = ADJUSTED; claim.asp_schedule_id_used = schedule.id
            provider.cumulative_paid_cents += delta_cents
            if delta_cents < 0: provider.recoupment_balance_cents += -delta_cents
        else (APPROVED_FOR_PAYMENT or PENDED):
            claim.allowed_amount_cents = new_allowed; claim.asp_schedule_id_used = schedule.id   (in place, no adjustment)
      after all claims: any ProviderAccount with recoupment_balance_cents > 0 -> RECOUPMENT_HOLD
    input_set: "Claims of the drug with service_date >= new effective_start not already priced at this schedule; states PAID, ADJUSTED, APPROVED_FOR_PAYMENT, PENDED"
    precision: "integer cents, round_half_up per component (same as claim_allowed_amount)"

  - name: pipeline_spend_forecast
    trigger: "POST /api/spend-forecasts"
    algorithm: forward_looking
    formula: |
      T0 = current clock date; horizon H = horizon_years; E = enrollment_projection
      forecast year y (y = 1..H) is the interval [T0 + (y-1) years, T0 + y years)
      for each PipelineDrug p:
        if p.expected_approval_date >= end of year H: EXCLUDED from per_drug_projections (contributes nothing)
        patients_p = E * p.prevalence_per_100k / 100000
        for each year y:
          if p.expected_approval_date >= end of year y:            factor_y = 0
          elif p.expected_approval_date inside year y:             factor_y = p.year1_uptake_pct * (days from approval date to end of year y) / 365
          else (approval before year y):                           factor_y = p.steady_state_uptake_pct
          cost_y = round_half_up(patients_p * p.projected_annual_cost_cents * factor_y)   # round per year, then sum
        projected_cents_p = sum(cost_y for y = 1..H)
        POLICY_ADJUSTED variant only: projected_cents_p = round_half_up(projected_cents_p * (1 - p.biosimilar_erosion_pct))
      pipeline_total_cents = sum(projected_cents_p)
      total_projected_cents = pipeline_total_cents + inline_annualized_cents * H
    input_set: "All PipelineDrug entities; variant selects whether biosimilar_erosion_pct applies"
    precision: "integer cents; per-year round_half_up, then summed; variant multiplier rounded once per drug"
    variants:
      - name: BASELINE
        when: "payload.variant = BASELINE"
        difference: "No erosion applied"
      - name: POLICY_ADJUSTED
        when: "payload.variant = POLICY_ADJUSTED"
        difference: "Each pipeline drug's projection multiplied by (1 - biosimilar_erosion_pct), modeling biosimilar substitution savings — strictly lower totals whenever any erosion_pct > 0"

  - name: inline_annualized_spend
    trigger: "POST /api/spend-forecasts (part of every forecast run)"
    algorithm: aggregation
    formula: |
      window = [as_of_date - 90 days, as_of_date)   # half-open, excludes as_of_date itself
      base = sum(allowed_amount_cents of InfusionClaim where status in {PAID, ADJUSTED} AND service_date in window)
      inline_annualized_cents = round_half_up(base * 365 / 90)
    input_set: "Claims in PAID or ADJUSTED only (PENDED, APPROVED_FOR_PAYMENT, DENIED excluded); service_date in the trailing 90-day half-open window"
    precision: "integer cents, round_half_up once at the end"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and name a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "The role must be permitted for this endpoint per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 2.5
    category: auth
    check: "ProviderRep scope: X-User-ID is a ProviderAccount id; single-resource reads and list filters touching another provider's resources are rejected (list queries without an explicit foreign provider_account_id filter are silently scoped to the caller's own account)"
    error_id: ERR_PROVIDER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "GET /api/claims, GET /api/claims/{id}, GET /api/prior-authorizations, GET /api/prior-authorizations/{id}, GET /api/provider-accounts/{id}, GET /api/redirections, GET /api/claim-adjustments (ProviderRep only)"

  - priority: 2.7
    category: business_constraint
    check: "Request shape: required fields present, types match, enum members valid, conditional-field rules honored (mg_per_kg present iff weight_based_dosing; rounding_increment_mg present iff dose_rounding_mode = INCREMENT; accepted_site in candidate_sites; horizon_years in 1..5; positive rates/percentages). Shape failures precede existence checks."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 3
    category: existence
    check: "Path ids must exist (left-to-right), then body FK references (auth_id, drug_id, reference_drug_id, biosimilar_drug_id) must exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with ids"

  - priority: 4
    category: state
    check: "OCC: expected_drug_version must equal the drug's current version; checked BEFORE any business rule"
    error_id: ERR_STALE_DRUG_VERSION
    http_status: 412
    applies_to: "POST /api/clinical-policies, POST /api/clinical-policies/{policyId}/activate"

  - priority: 5
    category: state
    check: "Target entity state permits the operation: auth approve/deny require SUBMITTED (ERR_AUTH_NOT_PENDING); suspend requires APPROVED and reinstate requires SUSPENDED (ERR_AUTH_NOT_APPROVED / ERR_AUTH_NOT_SUSPENDED); cancel requires non-terminal (ERR_AUTH_NOT_CANCELLABLE); policy activate requires DRAFT (ERR_POLICY_NOT_DRAFT); biosimilar activate requires DRAFT (ERR_BIOSIMILAR_POLICY_NOT_DRAFT); claim override-approve/deny require PENDED (ERR_CLAIM_NOT_PENDED); claim pay requires APPROVED_FOR_PAYMENT (ERR_CLAIM_NOT_PAYABLE); redirection accept/decline require OFFERED (ERR_REDIRECTION_NOT_OFFERED); settle-recoupment requires RECOUPMENT_HOLD (ERR_PROVIDER_NOT_ON_HOLD)"
    error_id: "ERR_AUTH_NOT_PENDING | ERR_AUTH_NOT_APPROVED | ERR_AUTH_NOT_SUSPENDED | ERR_AUTH_NOT_CANCELLABLE | ERR_POLICY_NOT_DRAFT | ERR_BIOSIMILAR_POLICY_NOT_DRAFT | ERR_CLAIM_NOT_PENDED | ERR_CLAIM_NOT_PAYABLE | ERR_REDIRECTION_NOT_OFFERED | ERR_PROVIDER_NOT_ON_HOLD"
    http_status: 409
    applies_to: "action endpoints"

  - priority: 5.5
    category: state
    check: "Cross-entity state gates: claim creation requires auth.status == APPROVED (ERR_AUTH_NOT_APPROVED); claim pay requires ProviderAccount ACTIVE (ERR_PROVIDER_RECOUPMENT_HOLD); auth approve requires an ACTIVE ClinicalPolicy for the drug (ERR_NO_ACTIVE_POLICY)"
    error_id: "ERR_AUTH_NOT_APPROVED | ERR_PROVIDER_RECOUPMENT_HOLD | ERR_NO_ACTIVE_POLICY"
    http_status: 409
    applies_to: "POST /api/claims, POST /api/claims/{claimId}/pay, POST /api/claims/{claimId}/override-approve, POST /api/prior-authorizations/{authId}/approve, POST /api/redirections/{redirectionId}/accept"

  - priority: 6
    category: business_safety
    check: "Clinical/compliance safety: dosing input completeness — weight_kg required for weight_based drugs, requested_dose_mg required otherwise (ERR_MISSING_WEIGHT_OR_DOSE); diagnosis covered by ACTIVE policy (ERR_DIAGNOSIS_NOT_COVERED); step therapy completed when required (ERR_STEP_THERAPY_REQUIRED); MANDATORY biosimilar substitution blocks reference-drug approval (ERR_BIOSIMILAR_SUBSTITUTION_REQUIRED); requested/computed dose <= max_single_dose_mg inclusive (ERR_DOSE_EXCEEDS_MAX); JW/waste rules — waste_units > 0 requires jw_modifier (ERR_JW_MODIFIER_REQUIRED), jw_modifier with waste_units = 0 rejected (ERR_JW_WITHOUT_WASTE), waste on non-single-dose vial rejected (ERR_WASTE_NOT_PAYABLE_MULTIDOSE), waste_units must be < vial_size_mg / billing_unit_mg (ERR_WASTE_EXCEEDS_VIAL)"
    error_id: "ERR_MISSING_WEIGHT_OR_DOSE | ERR_DIAGNOSIS_NOT_COVERED | ERR_STEP_THERAPY_REQUIRED | ERR_BIOSIMILAR_SUBSTITUTION_REQUIRED | ERR_DOSE_EXCEEDS_MAX | ERR_JW_MODIFIER_REQUIRED | ERR_JW_WITHOUT_WASTE | ERR_WASTE_NOT_PAYABLE_MULTIDOSE | ERR_WASTE_EXCEEDS_VIAL"
    http_status: 422
    applies_to: "POST /api/prior-authorizations, POST /api/prior-authorizations/{authId}/approve, POST /api/claims"

  - priority: 7
    category: business_referential
    check: "Referential coherence: claim.drug_id == auth.drug_id (ERR_DRUG_AUTH_MISMATCH); j_code_billed == drug.j_code (ERR_JCODE_MISMATCH); biosimilar_drug_id != reference_drug_id (ERR_REFERENCE_SELF_BIOSIMILAR); vial_size_mg a positive multiple of billing_unit_mg (ERR_INVALID_VIAL_UNIT_RATIO); j_code unique across drugs (ERR_JCODE_NOT_UNIQUE)"
    error_id: "ERR_DRUG_AUTH_MISMATCH | ERR_JCODE_MISMATCH | ERR_REFERENCE_SELF_BIOSIMILAR | ERR_INVALID_VIAL_UNIT_RATIO | ERR_JCODE_NOT_UNIQUE"
    http_status: 422
    applies_to: "POST /api/claims, POST /api/biosimilar-policies, POST /api/drugs"

  - priority: 8
    category: business_temporal
    check: "Windows and clock: requested_start_date >= current date (ERR_START_DATE_IN_PAST); service_date <= current date (ERR_FUTURE_SERVICE_DATE); service_date inside auth [validity_start, validity_end] closed window (ERR_SERVICE_DATE_OUT_OF_WINDOW); auth approval window must not overlap another APPROVED/SUSPENDED auth for same member+drug, closed-interval semantics (ERR_AUTH_WINDOW_OVERLAP); biosimilar window effective_start < effective_end (ERR_INVALID_WINDOW); biosimilar activation must not overlap another ACTIVE policy for the reference under half-open semantics (ERR_POLICY_WINDOW_OVERLAP)"
    error_id: "ERR_START_DATE_IN_PAST | ERR_FUTURE_SERVICE_DATE | ERR_SERVICE_DATE_OUT_OF_WINDOW | ERR_AUTH_WINDOW_OVERLAP | ERR_INVALID_WINDOW | ERR_POLICY_WINDOW_OVERLAP"
    http_status: 422
    applies_to: "POST /api/prior-authorizations, POST /api/prior-authorizations/{authId}/approve, POST /api/claims, POST /api/biosimilar-policies, POST /api/biosimilar-policies/{policyId}/activate"

  - priority: 9
    category: business_constraint
    check: "Sourcing decision and site program: sourcing_path BUY_AND_BILL required when drug.sourcing_rule = BUY_AND_BILL_ONLY and forbidden when SPECIALTY_PHARMACY_ONLY (ERR_SOURCING_VIOLATION); when the auth has an ACCEPTED redirection, claim.site_of_care must equal accepted_site (ERR_SITE_OF_CARE_VIOLATION)"
    error_id: "ERR_SOURCING_VIOLATION | ERR_SITE_OF_CARE_VIOLATION"
    http_status: 422
    applies_to: "POST /api/claims"

  - priority: 10
    category: business_fiscal
    check: "Fiscal gates (evaluated in this sub-order): an ASP rate must exist for the drug on service_date (ERR_NO_ASP_RATE); administered_mg may exceed approved_dose_mg by at most 10% inclusive — administered_mg x 10 > approved_dose_mg x 11 is rejected outright (ERR_DOSE_EXCEEDS_APPROVED) while overage within tolerance lands the claim in PENDED"
    error_id: "ERR_NO_ASP_RATE | ERR_DOSE_EXCEEDS_APPROVED"
    http_status: 422
    applies_to: "POST /api/claims, POST /api/claims/{claimId}/override-approve"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Drug catalog ---
  - method: POST
    path: "/api/drugs"
    description: "Register a specialty drug in the catalog"
    roles: [PlanAdmin]
    code: 201
    input: [j_code, drug_name, billing_unit_mg, vial_size_mg, single_dose_vial, sourcing_rule, "weight_based_dosing?", "mg_per_kg?", dose_rounding_mode, "rounding_increment_mg?", max_single_dose_mg, site_of_care_eligible]
    output: DrugCatalogEntry
    side_effects: []
  - method: GET
    path: "/api/drugs"
    description: "List drugs; filterable"
    roles: [PlanAdmin, MedicalPolicyOfficer, ProviderRep, CaseManager, PharmacyAnalyst]
    code: 200
    input: ["sourcing_rule?", "site_of_care_eligible?"]
    output: "DrugCatalogEntry[]"
    side_effects: []
  - method: GET
    path: "/api/drugs/{drugId}"
    description: "Get one drug (canonical source of the OCC version field)"
    roles: [PlanAdmin, MedicalPolicyOfficer, ProviderRep, CaseManager, PharmacyAnalyst]
    code: 200
    input: []
    output: DrugCatalogEntry
    side_effects: []

  # --- ASP rate schedules ---
  - method: POST
    path: "/api/asp-schedules"
    description: "Publish an ASP rate schedule; effective_start <= current date activates immediately and runs asp_retro_repricing"
    roles: [PlanAdmin]
    code: 201
    input: [drug_id, effective_start, asp_rate_cents]
    output: AspRateSchedule
    side_effects:
      - "status = EFFECTIVE when effective_start <= current date else SCHEDULED"
      - "On activation: other EFFECTIVE schedules of the drug -> SUPERSEDED; claims repriced per asp_retro_repricing (PAID/ADJUSTED -> ADJUSTED with ClaimAdjustment + provider ledger deltas; APPROVED_FOR_PAYMENT/PENDED repriced in place); recoupment_balance > 0 -> provider RECOUPMENT_HOLD"
  - method: GET
    path: "/api/asp-schedules"
    description: "List ASP schedules; filterable by drug"
    roles: [PlanAdmin, MedicalPolicyOfficer, ProviderRep, CaseManager, PharmacyAnalyst]
    code: 200
    input: ["drug_id?", "status?"]
    output: "AspRateSchedule[]"
    side_effects: []
  - method: GET
    path: "/api/asp-schedules/{scheduleId}"
    description: "Get one ASP schedule"
    roles: [PlanAdmin, MedicalPolicyOfficer, ProviderRep, CaseManager, PharmacyAnalyst]
    code: 200
    input: []
    output: AspRateSchedule
    side_effects: []

  # --- Clinical policies (OCC-guarded create-with-supersede) ---
  - method: POST
    path: "/api/clinical-policies"
    description: "Create a clinical policy version; status=ACTIVE supersedes the prior ACTIVE version; OCC on the drug's version"
    roles: [MedicalPolicyOfficer]
    code: 201
    input: [drug_id, status, expected_drug_version, covered_diagnoses, step_therapy_required, requires_site_of_care_redirection, biosimilar_substitution]
    output: ClinicalPolicy
    side_effects:
      - "version_no = next per-drug sequence"
      - "When status = ACTIVE: prior ACTIVE policy for the drug -> SUPERSEDED"
      - "increments DrugCatalogEntry.version by 1"
  - method: GET
    path: "/api/clinical-policies"
    description: "List clinical policies; filterable by drug"
    roles: [PlanAdmin, MedicalPolicyOfficer, ProviderRep, CaseManager, PharmacyAnalyst]
    code: 200
    input: ["drug_id?", "status?"]
    output: "ClinicalPolicy[]"
    side_effects: []
  - method: GET
    path: "/api/clinical-policies/{policyId}"
    description: "Get one clinical policy"
    roles: [PlanAdmin, MedicalPolicyOfficer, ProviderRep, CaseManager, PharmacyAnalyst]
    code: 200
    input: []
    output: ClinicalPolicy
    side_effects: []
  - method: POST
    path: "/api/clinical-policies/{policyId}/activate"
    description: "Activate a DRAFT policy, superseding the prior ACTIVE version; OCC on the drug's version"
    roles: [MedicalPolicyOfficer]
    code: 200
    input: [expected_drug_version]
    output: ClinicalPolicy
    side_effects:
      - "Prior ACTIVE policy for the drug -> SUPERSEDED"
      - "increments DrugCatalogEntry.version by 1"

  # --- Provider accounts ---
  - method: POST
    path: "/api/provider-accounts"
    description: "Register a provider organization"
    roles: [PlanAdmin]
    code: 201
    input: [name]
    output: ProviderAccount
    side_effects: []
  - method: GET
    path: "/api/provider-accounts"
    description: "List provider accounts"
    roles: [PlanAdmin, MedicalPolicyOfficer, CaseManager, PharmacyAnalyst]
    code: 200
    input: ["status?"]
    output: "ProviderAccount[]"
    side_effects: []
  - method: GET
    path: "/api/provider-accounts/{accountId}"
    description: "Get one provider account (ProviderRep may read only its own id)"
    roles: [PlanAdmin, MedicalPolicyOfficer, ProviderRep, CaseManager, PharmacyAnalyst]
    code: 200
    input: []
    output: ProviderAccount
    side_effects: []
  - method: POST
    path: "/api/provider-accounts/{accountId}/settle-recoupment"
    description: "Settle outstanding recoupment: zero the balance and return the account to ACTIVE"
    roles: [PlanAdmin]
    code: 200
    input: []
    output: ProviderAccount
    side_effects: ["recoupment_balance_cents = 0; status -> ACTIVE"]

  # --- Prior authorizations ---
  - method: POST
    path: "/api/prior-authorizations"
    description: "Submit a prior authorization request for a member"
    roles: [ProviderRep]
    code: 201
    input: [drug_id, member_id, diagnosis_code, requested_start_date, "requested_dose_mg?", "weight_kg?", "step_therapy_completed?"]
    output: PriorAuthorization
    side_effects: ["status = SUBMITTED; provider_account_id set from X-User-ID"]
  - method: GET
    path: "/api/prior-authorizations"
    description: "List auths; filterable (ProviderRep auto-scoped to own provider_account_id)"
    roles: [PlanAdmin, MedicalPolicyOfficer, ProviderRep, CaseManager, PharmacyAnalyst]
    code: 200
    input: ["drug_id?", "member_id?", "status?", "provider_account_id?", "policy_id?"]
    output: "PriorAuthorization[]"
    side_effects: []
  - method: GET
    path: "/api/prior-authorizations/{authId}"
    description: "Get one auth (ProviderRep own-account only)"
    roles: [PlanAdmin, MedicalPolicyOfficer, ProviderRep, CaseManager, PharmacyAnalyst]
    code: 200
    input: []
    output: PriorAuthorization
    side_effects: []
  - method: POST
    path: "/api/prior-authorizations/{authId}/approve"
    description: "Approve an auth: dose optimization, validity window, policy pinning, optional redirection auto-creation"
    roles: [MedicalPolicyOfficer]
    code: 200
    input: [max_administrations]
    output: PriorAuthorization
    side_effects:
      - "approved_dose_mg per dose_optimization; validity window [requested_start_date, +180 days] inclusive; policy pinned; administrations_used = 0"
      - "Auto-creates OFFERED SiteOfCareRedirection when the ACTIVE policy requires redirection and the drug is site_of_care_eligible"
  - method: POST
    path: "/api/prior-authorizations/{authId}/deny"
    description: "Deny a SUBMITTED auth"
    roles: [MedicalPolicyOfficer]
    code: 200
    input: [reason]
    output: PriorAuthorization
    side_effects: ["status -> DENIED; denial_reason set"]
  - method: POST
    path: "/api/prior-authorizations/{authId}/suspend"
    description: "Suspend an APPROVED auth; unpaid approved claims are pended (AUTH_SUSPENDED)"
    roles: [MedicalPolicyOfficer]
    code: 200
    input: []
    output: PriorAuthorization
    side_effects: ["Claims APPROVED_FOR_PAYMENT for this auth -> PENDED (pend_reason AUTH_SUSPENDED)"]
  - method: POST
    path: "/api/prior-authorizations/{authId}/reinstate"
    description: "Reinstate a SUSPENDED auth; its AUTH_SUSPENDED-pended claims return to APPROVED_FOR_PAYMENT"
    roles: [MedicalPolicyOfficer]
    code: 200
    input: []
    output: PriorAuthorization
    side_effects: ["Claims PENDED (pend_reason AUTH_SUSPENDED) -> APPROVED_FOR_PAYMENT; administrations_used unchanged"]
  - method: POST
    path: "/api/prior-authorizations/{authId}/cancel"
    description: "Cancel a non-terminal auth; an OFFERED redirection is withdrawn (EXPIRED)"
    roles: [MedicalPolicyOfficer]
    code: 200
    input: []
    output: PriorAuthorization
    side_effects: ["OFFERED SiteOfCareRedirection for this auth -> EXPIRED"]

  # --- Infusion claims ---
  - method: POST
    path: "/api/claims"
    description: "Submit a medical-benefit infusion claim; synchronous adjudication per the full validation chain; dose within the inclusive 110% tolerance lands PENDED"
    roles: [ProviderRep]
    code: 201
    input: [auth_id, drug_id, service_date, site_of_care, sourcing_path, j_code_billed, billed_units, "waste_units?", "jw_modifier?"]
    output: InfusionClaim
    side_effects:
      - "Adjudication -> APPROVED_FOR_PAYMENT or PENDED (pend_reason DOSE_REVIEW); pricing fields computed per claim_allowed_amount and member_cost_share"
      - "On APPROVED_FOR_PAYMENT: auth.administrations_used += 1; reaching max_administrations -> auth EXHAUSTED"
  - method: GET
    path: "/api/claims"
    description: "List claims; filterable (ProviderRep auto-scoped to own provider_account_id)"
    roles: [PlanAdmin, MedicalPolicyOfficer, ProviderRep, CaseManager, PharmacyAnalyst]
    code: 200
    input: ["auth_id?", "drug_id?", "provider_account_id?", "status?", "asp_schedule_id_used?"]
    output: "InfusionClaim[]"
    side_effects: []
  - method: GET
    path: "/api/claims/{claimId}"
    description: "Get one claim (ProviderRep own-account only)"
    roles: [PlanAdmin, MedicalPolicyOfficer, ProviderRep, CaseManager, PharmacyAnalyst]
    code: 200
    input: []
    output: InfusionClaim
    side_effects: []
  - method: POST
    path: "/api/claims/{claimId}/override-approve"
    description: "Medical override of a PENDED claim; records override_by and debits the auth administration"
    roles: [MedicalPolicyOfficer]
    code: 200
    input: []
    output: InfusionClaim
    side_effects:
      - "override_by = X-User-ID; status -> APPROVED_FOR_PAYMENT"
      - "auth.administrations_used += 1; reaching max_administrations -> auth EXHAUSTED"
  - method: POST
    path: "/api/claims/{claimId}/deny"
    description: "Deny a PENDED claim after medical review"
    roles: [MedicalPolicyOfficer]
    code: 200
    input: [reason]
    output: InfusionClaim
    side_effects: ["status -> DENIED; denial_reason set"]
  - method: POST
    path: "/api/claims/{claimId}/pay"
    description: "Pay an APPROVED_FOR_PAYMENT claim; credits the provider ledger"
    roles: [PlanAdmin]
    code: 200
    input: []
    output: InfusionClaim
    side_effects: ["status -> PAID; paid_at set; ProviderAccount.cumulative_paid_cents += allowed_amount_cents"]

  # --- Claim adjustments (read-only event log) ---
  - method: GET
    path: "/api/claim-adjustments"
    description: "List repricing adjustments; filterable"
    roles: [PlanAdmin, MedicalPolicyOfficer, ProviderRep, CaseManager, PharmacyAnalyst]
    code: 200
    input: ["claim_id?", "asp_schedule_id?"]
    output: "ClaimAdjustment[]"
    side_effects: []
  - method: GET
    path: "/api/claim-adjustments/{adjustmentId}"
    description: "Get one adjustment"
    roles: [PlanAdmin, MedicalPolicyOfficer, ProviderRep, CaseManager, PharmacyAnalyst]
    code: 200
    input: []
    output: ClaimAdjustment
    side_effects: []

  # --- Site-of-care redirections ---
  - method: GET
    path: "/api/redirections"
    description: "List redirections; filterable by auth (ProviderRep auto-scoped to own accounts)"
    roles: [PlanAdmin, MedicalPolicyOfficer, ProviderRep, CaseManager, PharmacyAnalyst]
    code: 200
    input: ["auth_id?", "status?"]
    output: "SiteOfCareRedirection[]"
    side_effects: []
  - method: GET
    path: "/api/redirections/{redirectionId}"
    description: "Get one redirection"
    roles: [PlanAdmin, MedicalPolicyOfficer, ProviderRep, CaseManager, PharmacyAnalyst]
    code: 200
    input: []
    output: SiteOfCareRedirection
    side_effects: []
  - method: POST
    path: "/api/redirections/{redirectionId}/accept"
    description: "Record member acceptance of redirection to a candidate site; computes the member incentive estimate"
    roles: [CaseManager]
    code: 200
    input: [accepted_site]
    output: SiteOfCareRedirection
    side_effects: ["accepted_site set; member_incentive_cents per redirection_incentive_estimate"]
  - method: POST
    path: "/api/redirections/{redirectionId}/decline"
    description: "Record member decline of the redirection offer"
    roles: [CaseManager]
    code: 200
    input: []
    output: SiteOfCareRedirection
    side_effects: ["status -> DECLINED"]

  # --- Biosimilar policies ---
  - method: POST
    path: "/api/biosimilar-policies"
    description: "Create a biosimilar substitution policy for a reference drug (starts DRAFT)"
    roles: [PlanAdmin]
    code: 201
    input: [reference_drug_id, biosimilar_drug_id, provider_incentive_addon_pct, member_copay_waiver_pct, effective_start, effective_end]
    output: BiosimilarPolicy
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/api/biosimilar-policies"
    description: "List biosimilar policies; filterable by reference or biosimilar drug"
    roles: [PlanAdmin, MedicalPolicyOfficer, ProviderRep, CaseManager, PharmacyAnalyst]
    code: 200
    input: ["reference_drug_id?", "biosimilar_drug_id?", "status?"]
    output: "BiosimilarPolicy[]"
    side_effects: []
  - method: GET
    path: "/api/biosimilar-policies/{policyId}"
    description: "Get one biosimilar policy"
    roles: [PlanAdmin, MedicalPolicyOfficer, ProviderRep, CaseManager, PharmacyAnalyst]
    code: 200
    input: []
    output: BiosimilarPolicy
    side_effects: []
  - method: POST
    path: "/api/biosimilar-policies/{policyId}/activate"
    description: "Activate a biosimilar policy; half-open window overlap check; reprices in-flight biosimilar claims"
    roles: [PlanAdmin]
    code: 200
    input: []
    output: BiosimilarPolicy
    side_effects: ["In-flight claims (APPROVED_FOR_PAYMENT/PENDED) on the biosimilar drug with service_date in the window repriced in place with the incentive add-on"]

  # --- Pipeline drugs & spend forecasts ---
  - method: POST
    path: "/api/pipeline-drugs"
    description: "Register a pipeline drug for spend forecasting"
    roles: [PlanAdmin]
    code: 201
    input: [drug_name, expected_approval_date, prevalence_per_100k, projected_annual_cost_cents, year1_uptake_pct, steady_state_uptake_pct, biosimilar_erosion_pct]
    output: PipelineDrug
    side_effects: []
  - method: GET
    path: "/api/pipeline-drugs"
    description: "List pipeline drugs"
    roles: [PlanAdmin, MedicalPolicyOfficer, ProviderRep, CaseManager, PharmacyAnalyst]
    code: 200
    input: []
    output: "PipelineDrug[]"
    side_effects: []
  - method: GET
    path: "/api/pipeline-drugs/{pipelineDrugId}"
    description: "Get one pipeline drug"
    roles: [PlanAdmin, MedicalPolicyOfficer, ProviderRep, CaseManager, PharmacyAnalyst]
    code: 200
    input: []
    output: PipelineDrug
    side_effects: []
  - method: POST
    path: "/api/spend-forecasts"
    description: "Run a spend forecast: pipeline launch projection + annualized in-line spend; variant BASELINE or POLICY_ADJUSTED"
    roles: [PharmacyAnalyst]
    code: 201
    input: [variant, horizon_years, enrollment_projection]
    output: SpendForecastRun
    side_effects: ["Computes per pipeline_spend_forecast and inline_annualized_spend; stores immutable snapshot"]
  - method: GET
    path: "/api/spend-forecasts/{forecastId}"
    description: "Get a stored forecast run"
    roles: [PlanAdmin, MedicalPolicyOfficer, ProviderRep, CaseManager, PharmacyAnalyst]
    code: 200
    input: []
    output: SpendForecastRun
    side_effects: []

  # --- Test-driving clock ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server's logical clock (ISO8601 UTC). Startup default before any call is exactly 2026-08-01T00:00:00Z — never the wall clock. Triggers due-transition sweeps: SCHEDULED ASP activation (+ repricing cascade), auth expiry, redirection offer expiry, biosimilar policy expiry."
    roles: [PlanAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Applies all clock-due state transitions (lazy equivalents are also applied before any precondition check that reads a time-sensitive entity)"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Authentication & authorization ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or not a declared role" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_PROVIDER_SCOPE_VIOLATION, http: 403, condition: "ProviderRep addressed a resource belonging to a different provider account" }

  # --- Existence & request shape ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum member, or conditional-field violation (mg_per_kg / rounding_increment_mg presence rules; accepted_site not in candidate_sites; horizon_years outside 1..5)" }

  # --- Concurrency ---
  - { id: ERR_STALE_DRUG_VERSION, http: 412, condition: "expected_drug_version does not equal the drug's current version on policy create/activate" }

  # --- Drug catalog ---
  - { id: ERR_JCODE_NOT_UNIQUE, http: 409, condition: "j_code already registered on another drug" }
  - { id: ERR_INVALID_VIAL_UNIT_RATIO, http: 422, condition: "vial_size_mg is not a positive multiple of billing_unit_mg" }

  # --- Auth state machine ---
  - { id: ERR_AUTH_NOT_PENDING, http: 409, condition: "approve/deny require the auth to be SUBMITTED" }
  - { id: ERR_AUTH_NOT_APPROVED, http: 409, condition: "Operation requires an APPROVED auth (claim create, override-approve, redirection accept, suspend)" }
  - { id: ERR_AUTH_NOT_SUSPENDED, http: 409, condition: "reinstate requires the auth to be SUSPENDED" }
  - { id: ERR_AUTH_NOT_CANCELLABLE, http: 409, condition: "cancel requires SUBMITTED, APPROVED, or SUSPENDED (terminal auths reject)" }
  - { id: ERR_NO_ACTIVE_POLICY, http: 409, condition: "No ACTIVE ClinicalPolicy exists for the auth's drug at approval" }

  # --- Clinical safety ---
  - { id: ERR_MISSING_WEIGHT_OR_DOSE, http: 422, condition: "weight_kg missing for a weight_based drug or requested_dose_mg missing otherwise" }
  - { id: ERR_START_DATE_IN_PAST, http: 422, condition: "requested_start_date is before the current date" }
  - { id: ERR_DIAGNOSIS_NOT_COVERED, http: 422, condition: "diagnosis_code not in the ACTIVE policy's covered_diagnoses" }
  - { id: ERR_STEP_THERAPY_REQUIRED, http: 422, condition: "Policy requires step therapy but step_therapy_completed is not true" }
  - { id: ERR_BIOSIMILAR_SUBSTITUTION_REQUIRED, http: 422, condition: "Policy biosimilar_substitution = MANDATORY and an ACTIVE biosimilar policy covers requested_start_date for the reference drug" }
  - { id: ERR_DOSE_EXCEEDS_MAX, http: 422, condition: "requested_dose_mg (submission) or computed approved dose (approval) exceeds max_single_dose_mg; equal to the cap is allowed" }

  # --- Claim referential / temporal / constraint ---
  - { id: ERR_DRUG_AUTH_MISMATCH, http: 422, condition: "claim.drug_id != auth.drug_id" }
  - { id: ERR_JCODE_MISMATCH, http: 422, condition: "j_code_billed != the drug's catalog j_code" }
  - { id: ERR_SERVICE_DATE_OUT_OF_WINDOW, http: 422, condition: "service_date outside the auth's closed [validity_start, validity_end] window" }
  - { id: ERR_FUTURE_SERVICE_DATE, http: 422, condition: "service_date after the current date" }
  - { id: ERR_AUTH_WINDOW_OVERLAP, http: 409, condition: "Approval would create overlapping CLOSED validity windows for the same member + drug (touching dates count as overlap)" }
  - { id: ERR_SOURCING_VIOLATION, http: 422, condition: "sourcing_path violates the drug's sourcing_rule (BUY_AND_BILL_ONLY requires BUY_AND_BILL; SPECIALTY_PHARMACY_ONLY forbids BUY_AND_BILL)" }
  - { id: ERR_SITE_OF_CARE_VIOLATION, http: 422, condition: "Auth has an ACCEPTED redirection and claim.site_of_care != accepted_site" }

  # --- JW / waste compliance ---
  - { id: ERR_JW_MODIFIER_REQUIRED, http: 422, condition: "waste_units > 0 without jw_modifier = true" }
  - { id: ERR_JW_WITHOUT_WASTE, http: 422, condition: "jw_modifier = true with waste_units = 0" }
  - { id: ERR_WASTE_NOT_PAYABLE_MULTIDOSE, http: 422, condition: "waste_units > 0 on a multi-dose vial drug (single_dose_vial = false)" }
  - { id: ERR_WASTE_EXCEEDS_VIAL, http: 422, condition: "waste_units >= vial_size_mg / billing_unit_mg (a whole vial or more cannot be waste; strictly-less boundary)" }

  # --- Fiscal ---
  - { id: ERR_NO_ASP_RATE, http: 422, condition: "No ASP schedule of the drug has effective_start <= service_date (or <= today, for redirection incentive estimate)" }
  - { id: ERR_DOSE_EXCEEDS_APPROVED, http: 422, condition: "administered_mg exceeds approved_dose_mg by more than the inclusive 10% tolerance (administered_mg x 10 > approved_dose_mg x 11)" }

  # --- Claim / provider state machine ---
  - { id: ERR_CLAIM_NOT_PENDED, http: 409, condition: "override-approve and deny require the claim to be PENDED" }
  - { id: ERR_CLAIM_NOT_PAYABLE, http: 409, condition: "pay requires the claim to be APPROVED_FOR_PAYMENT" }
  - { id: ERR_PROVIDER_RECOUPMENT_HOLD, http: 409, condition: "ProviderAccount is in RECOUPMENT_HOLD; payments blocked until settled" }
  - { id: ERR_PROVIDER_NOT_ON_HOLD, http: 409, condition: "settle-recoupment requires RECOUPMENT_HOLD" }

  # --- Policy / biosimilar ---
  - { id: ERR_POLICY_NOT_DRAFT, http: 409, condition: "activate requires a DRAFT clinical policy" }
  - { id: ERR_BIOSIMILAR_POLICY_NOT_DRAFT, http: 409, condition: "activate requires a DRAFT biosimilar policy" }
  - { id: ERR_REFERENCE_SELF_BIOSIMILAR, http: 422, condition: "biosimilar_drug_id equals reference_drug_id" }
  - { id: ERR_BIOSIMILAR_ALREADY_MAPPED, http: 409, condition: "biosimilar_drug_id already mapped by another ACTIVE policy" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "effective_start >= effective_end" }
  - { id: ERR_POLICY_WINDOW_OVERLAP, http: 409, condition: "Another ACTIVE policy for the reference drug overlaps the HALF-OPEN window (touching boundaries do not overlap)" }

  # --- Redirection ---
  - { id: ERR_REDIRECTION_NOT_OFFERED, http: 409, condition: "accept/decline require the redirection to be OFFERED" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlanAdmin
    description: "Health plan pharmacy administrator: drug catalog, ASP rate schedules, provider accounts, biosimilar policies, pipeline registry, claim payment runs, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/drugs"
      - "POST /api/asp-schedules"
      - "POST /api/provider-accounts"
      - "POST /api/provider-accounts/{accountId}/settle-recoupment"
      - "POST /api/claims/{claimId}/pay"
      - "POST /api/biosimilar-policies"
      - "POST /api/biosimilar-policies/{policyId}/activate"
      - "POST /api/pipeline-drugs"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: MedicalPolicyOfficer
    description: "Clinical policy author and medical reviewer: clinical policy lifecycle, authorization decisions, pended-claim override review"
    identity: opaque
    exclusive_operations:
      - "POST /api/clinical-policies"
      - "POST /api/clinical-policies/{policyId}/activate"
      - "POST /api/prior-authorizations/{authId}/approve"
      - "POST /api/prior-authorizations/{authId}/deny"
      - "POST /api/prior-authorizations/{authId}/suspend"
      - "POST /api/prior-authorizations/{authId}/reinstate"
      - "POST /api/prior-authorizations/{authId}/cancel"
      - "POST /api/claims/{claimId}/override-approve"
      - "POST /api/claims/{claimId}/deny"
    shared_operations:
      - "All GET endpoints"

  - name: ProviderRep
    description: "Provider organization representative: submits prior authorizations and infusion claims for their own ProviderAccount; reads are scoped to that account"
    identity: "entity_backed:ProviderAccount"
    exclusive_operations:
      - "POST /api/prior-authorizations"
      - "POST /api/claims"
    shared_operations:
      - "All GET endpoints (auto-scoped to own provider_account_id; foreign access -> ERR_PROVIDER_SCOPE_VIOLATION)"

  - name: CaseManager
    description: "Health plan case manager: records member decisions on site-of-care redirection offers"
    identity: opaque
    exclusive_operations:
      - "POST /api/redirections/{redirectionId}/accept"
      - "POST /api/redirections/{redirectionId}/decline"
    shared_operations:
      - "All GET endpoints"

  - name: PharmacyAnalyst
    description: "Pharmacy analytics: runs spend forecasts; otherwise read-only"
    identity: opaque
    exclusive_operations:
      - "POST /api/spend-forecasts"
    shared_operations:
      - "All GET endpoints"
