          - entities.PromoCode.fields.uses_count
        distinguishing_aspect: |
          Different conserved quantity = PromoCode.uses_count (redemption count). Forward confirm increments
          uses_count to 1; compensating cancel decrements it back to 0 — uses_count is invariant across the
