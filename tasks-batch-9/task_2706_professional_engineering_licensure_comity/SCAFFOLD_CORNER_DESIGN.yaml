            - call: "GET /licenses/${lic_nils}"
              payload: {}
              as: Licensee
              as_user_id: "${eng_nils}"
              captures: { lic_nils_v2: $.data.version }
            - call: "POST /cpc-reports"
              payload: { license_id: "${lic_nils}", period_start: "2026-01-15T00:00:00Z", period_end: "2028-01-15T00:00:00Z", self_certified_pdh: 32, carryover_pdh_claimed: 0, expected_license_version: "${lic_nils_v2}" }
              as: Licensee
              as_user_id: "${eng_nils}"
              captures: { rep_nils_2: $.data.id }
          assert:
            - "trigger[0] http_status == 412"
            - "trigger[0] response.data.error_id == \"ERR_STALE_LICENSE_VERSION\""
            - "trigger[1] response.data.version == ${lic_nils_v1} + 1"
            - "trigger[2] http_status == 201"
            - "trigger[2] response.data.status == \"SUBMITTED\""
            - "trigger[2] response.data.self_certified_pdh == 32"
            - "CPCReport.${rep_nils_1}.status == \"SUPERSEDED\""
            - "License.${lic_nils}.version == ${lic_nils_v1} + 2"
            - "GET /cpc-reports?license_id=${lic_nils} returns total_count == 2"

      - name: consent_order_create_with_stale_case_version_conflicts
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[consent-order-create-stale-case]
          - errors.ERR_STALE_CASE_VERSION
          - state_machines.Case.transitions.PROPOSED_to_PROPOSED
        distinguishing_aspect: "The sanction axis permits PROPOSED -> PROPOSED, so a renegotiated order is legal; the only thing separating a deliberate renegotiation from a writer on an outdated view is expected_case_version, which yields 412 ERR_STALE_CASE_VERSION and leaves the first order live."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default."
            - "An UNLICENSED_PRACTICE case against 'Pim Sorel' is at investigation_status PROBABLE_CAUSE with a PROPOSED SUSPENSION consent order already filed against the case version observed after the finding; that create advanced Case.version by 1."
