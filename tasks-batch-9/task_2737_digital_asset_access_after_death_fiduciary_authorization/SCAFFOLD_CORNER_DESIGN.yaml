# =============================================================================
# §1.9 Scaffold Corner Design — task_2737 Digital Asset Access After Death &
# Fiduciary Authorization.
#
# Breadth probe. Every instance below is a testable claim that §1.1–§1.7 of
# SCAFFOLD.yaml declares and that SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) does
# not already assert. Sections and claim_type values come from
# references/claim-extraction-guide.md; no category is invented here.
#
# Conventions shared by every recipe:
#   * the server starts with an empty database and its logical clock pinned at
#     2026-08-01T00:00:00Z; a recipe restates the clock only when it moves it.
#   * every Fiduciary-role call carries as_user_id of a Fiduciary of the target
#     estate (§1.4 priority 24) and every PlatformCompliance-role call carries
#     as_user_id equal to the platform_id of the target resource (priority 25).
#   * court_case_number values are unique per instance so a chain can never be
#     confused with another instance's estate.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: estate_creation_returns_intake_phase_zeroed_counters_and_the_alternate_date
        claim_type: Creation
        grounds:
          - endpoints[POST /estates]
          - entities.Estate.fields.administration_phase
          - entities.Estate.fields.alternate_valuation_date
          - calculations.estate_administration_phase
          - response_envelope.success
        distinguishing_aspect: |
          A fresh Estate is born in INTAKE with all eleven computed counters at 0, valuation_basis
          null and alternate_valuation_date already computed as date_of_death + exactly 6 calendar
          months (2026-02-14 -> 2026-08-14) — the alternate date is NOT waited for, NOT null until a
          run, and NOT 180 days after death.
        test_recipe:
          setup:
            - "empty database; logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
          trigger:
            - call: "POST /estates"
              payload: { decedent_name: "Rowan Ives", date_of_death: "2026-02-14", domicile_state: "CA", court_case_number: "PR-2737-C01" }
              as: EstateAdmin
              captures: { est_id: $.data.id, phase: $.data.administration_phase, alt_date: $.data.alternate_valuation_date }
          assert:
            - "HTTP 201"
            - "the response body has meta.api_request_id, meta.api_request_timestamp, response_type == object and a data object"
            - "${phase} == INTAKE"
            - "${alt_date} == 2026-08-14"
            - "Estate.${est_id}.inventory_total_count == 0"
            - "Estate.${est_id}.disclosed_asset_count == 0"
            - "Estate.${est_id}.assets_pending_disposition_count == 0"
            - "Estate.${est_id}.assets_disposed_count == 0"
            - "Estate.${est_id}.open_cancellation_count == 0"
            - "Estate.${est_id}.cancelled_subscription_count == 0"
            - "Estate.${est_id}.gross_digital_estate_cents == 0"
            - "Estate.${est_id}.admin_deduction_cents == 0"
            - "Estate.${est_id}.taxable_digital_estate_cents == 0"
            - "Estate.${est_id}.undistributed_value_cents == 0"
            - "Estate.${est_id}.refund_recovered_cents == 0"
            - "Estate.${est_id}.valuation_basis is null and closed_at is null and closing_statement is null"
            - "Estate.${est_id}.version == 1 and created_at == 2026-08-01T00:00:00Z"
            - "an estate created with decedent_name 'Rowan Ives' and date_of_death 2026-08-31 (after the clock) returns HTTP 400 with error_id ERR_DATE_OF_DEATH_IN_FUTURE"
            - "an estate created with date_of_death 2026-08-01 (exactly the clock date) is accepted, and its alternate_valuation_date == 2027-02-01"

      - name: single_resource_reads_return_every_stored_and_derived_field
        claim_type: Retrieval
        grounds:
          - endpoints[GET /platforms/{platform_id}]
          - endpoints[GET /estates/{estate_id}]
          - endpoints[GET /fiduciaries/{fiduciary_id}]
          - entities.Platform.fields.refund_policy
          - entities.Fiduciary.fields.letters_status
        distinguishing_aspect: |
          GET by id echoes exactly what was stored plus the derived fields — the platform's twelve
          policy flags round-trip unchanged, and a freshly appointed Fiduciary reads back
          letters_status == PENDING (not ISSUED, and not null) before any document is verified.
        test_recipe:
          setup:
            - "one Platform 'CloudVault' registered with an explicit policy flag set"
            - "one Estate and one EXECUTOR Fiduciary on it, with no document verified yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
              payload: { name: "CloudVault", platform_type: "CLOUD_STORAGE", form_code: "CV-FORM-1", review_window_days: 14, refund_policy: "NONE", supports_online_tool: true, supports_transfer: true, supports_memorialization: true, supports_deletion: true, requires_court_order_for_content: false, license_terminates_at_death: false, transfer_fee_cents: 2500, request_fee_cents: 1500 }
              as: EstateAdmin
              captures: { p_cloud_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_name: "Rowan Ives", date_of_death: "2026-02-14", domicile_state: "CA", court_case_number: "PR-2737-C02" }
              as: EstateAdmin
              captures: { est_id: $.data.id }
            - call: "POST /estates/${est_id}/fiduciaries"
              payload: { full_name: "Dana Ives", appointment_type: "EXECUTOR", court_reference: "APPT-2737-C02" }
              as: CourtRegistrar
              captures: { fid1_id: $.data.id }
          trigger:
            - call: "GET /platforms/${p_cloud_id}"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { got_status: $.data.status, got_fee: $.data.transfer_fee_cents }
            - call: "GET /fiduciaries/${fid1_id}"
              payload: {}
              as: PlatformCompliance
              as_user_id: "${p_cloud_id}"
              captures: { got_letters: $.data.letters_status }
            - call: "GET /estates/${est_id}"
              payload: {}
              as: CourtRegistrar
              captures: { got_phase: $.data.administration_phase }
          assert:
            - "each read returns HTTP 200 with response_type == object"
            - "${got_status} == PARTICIPATING"
            - "${got_fee} == 2500"
            - "Platform.${p_cloud_id}.request_fee_cents == 1500, review_window_days == 14, refund_policy == NONE, form_code == CV-FORM-1"
            - "Platform.${p_cloud_id}.supports_online_tool == true, supports_transfer == true, supports_memorialization == true, supports_deletion == true, requires_court_order_for_content == false, license_terminates_at_death == false"
            - "${got_letters} == PENDING"
            - "Fiduciary.${fid1_id}.estate_id == ${est_id} and appointment_type == EXECUTOR and court_reference == APPT-2737-C02"
            - "${got_phase} == INTAKE"
            - "all four roles can perform these three reads; no read mutates version (Platform.version == 1, Fiduciary.version == 1)"

      - name: digital_asset_list_filters_by_access_status_and_paginates_with_total_count
        claim_type: Listing
        grounds:
          - endpoints[GET /digital-assets]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          The list endpoint pages over a three-asset estate with limit 2 / offset 0 (has_more true,
          total_count 3) and limit 2 / offset 2 (has_more false), while total_count always reports
          the FILTERED cardinality, not the table cardinality: filtering access_status == UNVERIFIED
          on the same three assets still reports 3, and category == EMAIL reports 1.
        test_recipe:
          setup:
            - "one Platform and one Estate with a Fiduciary"
            - "three DigitalAssets on that estate created in a known order: vault-a (CLOUD_STORAGE), vault-b (CLOUD_STORAGE), inbox-a (EMAIL)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
              payload: { name: "CloudVault", platform_type: "CLOUD_STORAGE", form_code: "CV-FORM-1", review_window_days: 14, refund_policy: "NONE", supports_online_tool: true, supports_transfer: true, supports_memorialization: true, supports_deletion: true, requires_court_order_for_content: false, license_terminates_at_death: false, transfer_fee_cents: 0, request_fee_cents: 0 }
              as: EstateAdmin
              captures: { p_cloud_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_name: "Rowan Ives", date_of_death: "2026-02-14", domicile_state: "CA", court_case_number: "PR-2737-C03" }
              as: EstateAdmin
              captures: { est_id: $.data.id }
            - call: "POST /estates/${est_id}/fiduciaries"
              payload: { full_name: "Dana Ives", appointment_type: "EXECUTOR", court_reference: "APPT-2737-C03" }
              as: CourtRegistrar
              captures: { fid1_id: $.data.id }
            - call: "POST /estates/${est_id}/digital-assets"
              payload: { platform_id: "${p_cloud_id}", category: "CLOUD_STORAGE", account_handle: "vault-a", quoted_value_cents: 10000 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /estates/${est_id}/digital-assets"
              payload: { platform_id: "${p_cloud_id}", category: "CLOUD_STORAGE", account_handle: "vault-b", quoted_value_cents: 20000 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a2_id: $.data.id }
            - call: "POST /estates/${est_id}/digital-assets"
              payload: { platform_id: "${p_cloud_id}", category: "EMAIL", account_handle: "inbox-a", quoted_value_cents: 0 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a3_id: $.data.id }
          trigger:
            - call: "GET /digital-assets"
              payload: { estate_id: "${est_id}", limit: 2, offset: 0 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { page1_first: "$.data[0].id", page1_second: "$.data[1].id" }
            - call: "GET /digital-assets"
              payload: { estate_id: "${est_id}", limit: 2, offset: 2 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { page2_first: "$.data[0].id" }
            - call: "GET /digital-assets"
              payload: { estate_id: "${est_id}", category: "EMAIL" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { email_first: "$.data[0].id" }
            - call: "GET /digital-assets"
              payload: { estate_id: "${est_id}", access_status: "CATALOG_DISCLOSED" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
          assert:
            - "each list response has response_type == array and meta carrying limit, offset, total_count and has_more"
            - "page 1: exactly 2 rows, meta.total_count == 3, meta.has_more == true, ${page1_first} == ${a1_id} and ${page1_second} == ${a2_id} (created_at ASC)"
            - "page 2: exactly 1 row, meta.total_count == 3, meta.has_more == false, ${page2_first} == ${a3_id}"
            - "the category == EMAIL list returns exactly 1 row with meta.total_count == 1 and ${email_first} == ${a3_id}"
            - "the access_status == CATALOG_DISCLOSED list returns 0 rows with meta.total_count == 0 and has_more == false"
            - "omitting limit and offset returns all 3 rows with meta.limit == 10 and meta.offset == 0"
            - "GET /digital-assets with no estate_id filter returns all 3 rows (the filter is optional, not implied)"

      - name: every_path_parameter_rejects_an_unknown_id_with_its_own_not_found_error
        claim_type: Not Found
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - validations[priority=8]
          - validations[priority=9]
          - validations[priority=10]
          - validations[priority=11]
          - validations[priority=12]
          - validations[priority=13]
          - validations[priority=14]
          - validations[priority=15]
          - validations[priority=16]
          - validations[priority=17]
          - validations[priority=18]
          - validations[priority=19]
        distinguishing_aspect: |
          Each of the fourteen path parameters returns its OWN 404 error_id rather than a shared
          generic code, and the check runs on an empty database — no other resource needs to exist
          for the lookup to fail.
        test_recipe:
          setup:
            - "empty database; logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
          trigger:
            - call: "GET /estates/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: EstateAdmin
              captures: { e_estate: $.data.error_id }
            - call: "GET /fiduciaries/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: EstateAdmin
              captures: { e_fid: $.data.error_id }
            - call: "GET /documents/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: EstateAdmin
              captures: { e_doc: $.data.error_id }
            - call: "GET /platforms/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: EstateAdmin
              captures: { e_plat: $.data.error_id }
            - call: "GET /authority-directives/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: EstateAdmin
              captures: { e_dir: $.data.error_id }
            - call: "GET /digital-assets/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: EstateAdmin
              captures: { e_asset: $.data.error_id }
            - call: "GET /subscription-terms/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: EstateAdmin
              captures: { e_term: $.data.error_id }
            - call: "GET /platform-requests/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: EstateAdmin
              captures: { e_req: $.data.error_id }
            - call: "GET /authority-grants/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: EstateAdmin
              captures: { e_grant: $.data.error_id }
            - call: "GET /beneficiary-designations/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: EstateAdmin
              captures: { e_desig: $.data.error_id }
            - call: "GET /disposition-elections/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: EstateAdmin
              captures: { e_elect: $.data.error_id }
            - call: "GET /cancellation-orders/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: EstateAdmin
              captures: { e_order: $.data.error_id }
            - call: "GET /refund-claims/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: EstateAdmin
              captures: { e_claim: $.data.error_id }
            - call: "GET /valuation-runs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: EstateAdmin
              captures: { e_run: $.data.error_id }
          assert:
            - "every one of the fourteen calls returns HTTP 404 with response_type == error and a non-empty data.message"
            - "${e_estate} == ERR_ESTATE_NOT_FOUND"
            - "${e_fid} == ERR_FIDUCIARY_NOT_FOUND"
            - "${e_doc} == ERR_DOCUMENT_NOT_FOUND"
            - "${e_plat} == ERR_PLATFORM_NOT_FOUND"
            - "${e_dir} == ERR_DIRECTIVE_NOT_FOUND"
            - "${e_asset} == ERR_ASSET_NOT_FOUND"
            - "${e_term} == ERR_SUBSCRIPTION_TERM_NOT_FOUND"
            - "${e_req} == ERR_REQUEST_NOT_FOUND"
            - "${e_grant} == ERR_GRANT_NOT_FOUND"
            - "${e_desig} == ERR_DESIGNATION_NOT_FOUND"
            - "${e_elect} == ERR_ELECTION_NOT_FOUND"
            - "${e_order} == ERR_ORDER_NOT_FOUND"
            - "${e_claim} == ERR_CLAIM_NOT_FOUND"
            - "${e_run} == ERR_VALUATION_RUN_NOT_FOUND"
            - "POST /estates/00000000-0000-0000-0000-000000000000/digital-assets returns HTTP 404 ERR_ESTATE_NOT_FOUND (priority 6 precedes every body-level check)"

      - name: missing_required_inputs_and_out_of_range_values_return_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=4]
          - endpoints[POST /estates/{estate_id}/digital-assets]
          - entities.DigitalAsset.fields.quoted_value_cents
          - entities.DigitalAsset.fields.category
          - entities.Platform.fields.review_window_days
        distinguishing_aspect: |
          One well-formed asset creation succeeds; the same call with any required field removed, an
          out-of-enum category, a negative quoted_value_cents, or an unknown body key is rejected
          with the single ERR_INVALID_REQUEST code at HTTP 400 — and the rejection happens before
          any state check, so nothing is persisted (inventory_total_count stays 1).
        test_recipe:
          setup:
            - "one Platform, one Estate, one Fiduciary"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
              payload: { name: "CloudVault", platform_type: "CLOUD_STORAGE", form_code: "CV-FORM-1", review_window_days: 14, refund_policy: "NONE", supports_online_tool: true, supports_transfer: true, supports_memorialization: true, supports_deletion: true, requires_court_order_for_content: false, license_terminates_at_death: false, transfer_fee_cents: 0, request_fee_cents: 0 }
              as: EstateAdmin
              captures: { p_cloud_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_name: "Rowan Ives", date_of_death: "2026-02-14", domicile_state: "CA", court_case_number: "PR-2737-C04" }
              as: EstateAdmin
              captures: { est_id: $.data.id }
            - call: "POST /estates/${est_id}/fiduciaries"
              payload: { full_name: "Dana Ives", appointment_type: "EXECUTOR", court_reference: "APPT-2737-C04" }
              as: CourtRegistrar
              captures: { fid1_id: $.data.id }
          trigger:
            - call: "POST /estates/${est_id}/digital-assets"
              payload: { platform_id: "${p_cloud_id}", category: "CLOUD_STORAGE", account_handle: "vault-a", quoted_value_cents: 10000 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a1_id: $.data.id }
          assert:
            - "the well-formed creation returns HTTP 201 and Estate.${est_id}.inventory_total_count == 1"
            - "repeating the call without account_handle returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "repeating the call without platform_id returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "repeating the call without category returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "repeating the call without quoted_value_cents returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "repeating the call with category 'PHOTO_ALBUM' (not in the enum) returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "repeating the call with quoted_value_cents -1 returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "repeating the call with loyalty_points -5 returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "repeating the call with an extra body key transferability: 'TRANSFERABLE' returns HTTP 400 with error_id ERR_INVALID_REQUEST (a computed field may not be supplied)"
            - "POST /platforms with review_window_days 0 or 91 returns HTTP 400 with error_id ERR_INVALID_REQUEST (range 1..90)"
            - "POST /estates with domicile_state 'Cal' returns HTTP 400 with error_id ERR_INVALID_REQUEST (exactly 2 uppercase letters)"
            - "POST /estates/${est_id}/beneficiary-designations with share_bp 0 or 10001 returns HTTP 400 with error_id ERR_INVALID_REQUEST (range 1..10000)"
            - "after all rejections Estate.${est_id}.inventory_total_count is still 1 and exactly one DigitalAsset exists"

      - name: omitted_optional_inputs_fall_back_to_their_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Platform.fields.status
          - entities.DigitalAsset.fields.loyalty_points
          - entities.BeneficiaryDesignation.fields.relationship
          - entities.CancellationOrder.fields.auto_renew_stopped
          - entities.RefundClaim.fields.credited_cents
        distinguishing_aspect: |
          Every optional input has a declared default that the server applies rather than storing
          null: Platform.status defaults to PARTICIPATING (not LIMITED), DigitalAsset.loyalty_points
          to 0 (not null), CancellationOrder.auto_renew_stopped to false, RefundClaim.credited_cents
          to 0, while genuinely nullable text fields (relationship, inventory_note) stay null.
        test_recipe:
          setup:
            - "one Platform registered WITHOUT the optional status field"
            - "one Estate with a Fiduciary"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
              payload: { name: "LoyalMiles", platform_type: "LOYALTY", form_code: "LM-FORM-2", review_window_days: 30, refund_policy: "NONE", supports_online_tool: false, supports_transfer: true, supports_memorialization: false, supports_deletion: true, requires_court_order_for_content: false, license_terminates_at_death: false, transfer_fee_cents: 0, request_fee_cents: 0 }
              as: EstateAdmin
              captures: { p_loyal_id: $.data.id, plat_status: $.data.status }
            - call: "POST /estates"
              payload: { decedent_name: "Rowan Ives", date_of_death: "2026-02-14", domicile_state: "CA", court_case_number: "PR-2737-C05" }
              as: EstateAdmin
              captures: { est_id: $.data.id }
            - call: "POST /estates/${est_id}/fiduciaries"
              payload: { full_name: "Dana Ives", appointment_type: "EXECUTOR", court_reference: "APPT-2737-C05" }
              as: CourtRegistrar
              captures: { fid1_id: $.data.id }
          trigger:
            - call: "POST /estates/${est_id}/digital-assets"
              payload: { platform_id: "${p_loyal_id}", category: "LOYALTY_PROGRAM", account_handle: "miles-1", quoted_value_cents: 30000 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a1_id: $.data.id, a1_points: $.data.loyalty_points, a1_note: $.data.inventory_note }
            - call: "POST /estates/${est_id}/beneficiary-designations"
              payload: { beneficiary_name: "Ada Ives", share_bp: 10000, source: "WILL" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { ben_id: $.data.id, ben_rel: $.data.relationship }
          assert:
            - "${plat_status} == PARTICIPATING"
            - "${a1_points} == 0"
            - "${a1_note} is null"
            - "${ben_rel} is null"
            - "BeneficiaryDesignation.${ben_id}.allocation_rank == 1, planned_allocation_cents == 0, received_value_cents == 0"
            - "DigitalAsset.${a1_id}.access_status == UNVERIFIED, disposition_status == PENDING, content_clamp_reason == NONE, subscription_billing_state == NOT_APPLICABLE, appraised_value_cents is null, appraised_basis is null"
            - "supplying status LIMITED explicitly on POST /platforms stores LIMITED, proving the default is not hardcoded"
            - "a CancellationOrder auto-created by an approval has auto_renew_stopped == false and refund_policy_snapshot copied from the platform"
            - "a RefundClaim created by POST /cancellation-orders/{order_id}/refund-claims has credited_cents == 0 and status == FILED before any CREDIT"

      - name: transferability_is_computed_at_creation_for_the_personal_and_default_rules
        claim_type: Computed Fields
        grounds:
          - calculations.asset_transferability_class
          - entities.DigitalAsset.fields.transferability
          - entities.DigitalAsset.fields.transferability_reason
        distinguishing_aspect: |
          Rule 1 and rule 6 of the ordered chain, which the §1.8 first-match instance does not
          exercise: an EMAIL and a SOCIAL_PROFILE asset are NON_TRANSFERABLE / CATEGORY_PERSONAL even
          on a platform whose supports_transfer is true, while a CLOUD_STORAGE asset on that same
          platform falls through to rule 6 as TRANSFERABLE / TRANSFERABLE_PROPERTY. The class is
          stamped at creation — before any grant, request or valuation exists.
        test_recipe:
          setup:
            - "one Platform 'OpenNet' with supports_transfer true and license_terminates_at_death false"
            - "one Estate with a Fiduciary"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
