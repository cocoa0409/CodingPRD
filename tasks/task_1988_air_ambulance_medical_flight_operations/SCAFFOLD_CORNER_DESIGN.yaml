          setup: ["TRIAGED ALS request; CCT_CAPABLE rotor; pilot + nurse"]
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
