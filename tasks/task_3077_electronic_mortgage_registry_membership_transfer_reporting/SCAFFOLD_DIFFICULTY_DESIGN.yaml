# =============================================================================
# §1.8 Scaffold Difficulty Design — task_3077 MERS
# Two instances per Difficulty Rule (§0.5), 18 total. Every setup_api_calls
# chain replays against SCAFFOLD.yaml §1.5 exactly; every ${var} binds earlier.
#
# Precomputed literals (verified by executing the §1.3 formulas):
#   MIN: org 1000000 + serial 1 -> "100000000000000016" (check digit 6)
#        org 1000001 + serial 1 -> "100000100000000014" (check digit 4)
#        org 1000001 + serial 3 -> "100000100000000030" (check digit 0)
#   Late fee (marginal tiers 2500/5000/10000 per day over days 1-15/16-30/31+):
#        days_late 0 -> 0;  1 -> 2500;  20 -> 62500
#   Timeliness (3 transfers: 100M + 200M on time, 300M at days_late 20):
#        count-based rate 0.6667; amount-weighted rate 0.5000
#   Sanction per-line rounding: 3 MINOR x 25005 x 1.5 x 0.9
#        per line 33757 -> total 101271 (sum-then-round gives 101270)
#   QA score: (1*1.0 + 2*0.5 + 5*0.2) / 20 = 0.1500; 2*0.5 / 20 = 0.0500
#   Standing: t=0.6667, d=0.15, exc=3 -> 66.00 -> PROBATION
#        floor: t=0.4, d=0.5, exc=16 -> raw 24.00 -> DISENGAGEMENT_ELIGIBLE
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: reporting_rate_count_vs_amount_weighted_diverge
        grounds:
          - calculations.transfer_timeliness_reporting_rate
          - entities.AnnualReport.fields.reporting_rate
          - entities.AnnualReport.fields.reporting_rate_amount_weighted
        distinguishing_aspect: |
          Same three CONFIRMED transfers yield two different stored rates on one
          AnnualReport: count-based reporting_rate == 0.6667 while
          amount-weighted reporting_rate_amount_weighted == 0.5000, because the
          single late transfer carries the largest loan_amount_cents. The dual
          variant lives on the Transfer/AnnualReport domain.
        test_recipe:
          setup:
            - "Logical clock 2026-06-30T00:00:00Z."
            - "Member A (org 1000000, SERVICER) ACTIVE with one ALL-scope signer; Member B (org 1000001, INVESTOR) ACTIVE with one ALL-scope signer."
            - "A registers 3 loans: 100000000, 200000000, 300000000 cents, state TX, closing 2026-01-05."
            - "A -> B SERVICING transfers: loan1 effective 2026-02-01 at clock 2026-02-01 (days_late 0); loan2 effective 2026-02-10 at clock 2026-02-20 (deadline day, days_late 0); loan3 effective 2026-02-10 at clock 2026-03-02 (days_late 20, fee 62500)."
            - "Clock advanced to 2026-12-31 for report generation."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Alpha Mortgage", org_id: "1000000", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_a: $.data.id }
            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "Alice Signer", email: "alice@alpha.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_a}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Beta Investors", org_id: "1000001", org_id_type: "LEI", member_type: "INVESTOR" }
              as: RegistryAdmin
              captures: { m_b: $.data.id }
            - call: "POST /registry/members/${m_b}/signers"
              payload: { full_name: "Bob Signer", email: "bob@beta.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_b}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 100000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { loan1: $.data.id, loan1_v: $.data.version }
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 200000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { loan2: $.data.id, loan2_v: $.data.version }
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 300000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { loan3: $.data.id, loan3_v: $.data.version }
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/transfers"
              payload: { loan_id: "${loan1}", to_member_id: "${m_b}", transfer_type: "SERVICING", effective_date: "2026-02-01T00:00:00Z", idempotency_key: "k-rate-1", expected_loan_version: "${loan1_v}" }
              as: MemberRep
              as_user_id: "${m_a}"
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-20T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/transfers"
              payload: { loan_id: "${loan2}", to_member_id: "${m_b}", transfer_type: "SERVICING", effective_date: "2026-02-10T00:00:00Z", idempotency_key: "k-rate-2", expected_loan_version: "${loan2_v}" }
              as: MemberRep
              as_user_id: "${m_a}"
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/transfers"
              payload: { loan_id: "${loan3}", to_member_id: "${m_b}", transfer_type: "SERVICING", effective_date: "2026-02-10T00:00:00Z", idempotency_key: "k-rate-3", expected_loan_version: "${loan3_v}" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { tr3: $.data.id }
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-31T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /registry/members/${m_a}/annual-reports"
              payload: { report_year: 2026 }
              as: RegistryAdmin
              captures: { rep: $.data.id }
          assert:
            - "AnnualReport.${rep}.reporting_rate == 0.6667"
            - "AnnualReport.${rep}.reporting_rate_amount_weighted == 0.5000"
            - "AnnualReport.${rep}.reporting_rate != AnnualReport.${rep}.reporting_rate_amount_weighted"
            - "Transfer.${tr3}.days_late == 20 and Transfer.${tr3}.late_fee_cents == 62500"
            - "AnnualReport.${rep}.open_exceptions == 3 (each transfer left a PENDING TransferMatch; the December clock flipped them to EXPIRED, and EXPIRED matches still count as open exceptions)"

      - name: qa_score_provisional_draft_vs_frozen_issue_diverge
        grounds:
          - calculations.qa_discrepancy_score
          - entities.QAReview.fields.discrepancy_score
          - state_machines.QAReview.FINDINGS_ISSUED_to_DRAFT
        distinguishing_aspect: |
          On the QAReview domain (different entity domain from the Transfer
          rate variants), discrepancy_score is a live provisional value while
          the review is DRAFT and freezes at issue; reopening, adding 1 CRITICAL
          and 5 MINOR findings to the same 20-loan sample, and re-issuing
          produces a different frozen score (0.0500 at first issue vs 0.1500 at
          re-issue) for the same review over the same period.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T00:00:00Z. Member G (org 1000001, SERVICER) ACTIVE with one ALL-scope signer."
            - "G registers exactly 2 loans (50000000 cents each, TX, closing 2026-01-05)."
            - "QAReview R created by qa-creator for G over 2026-01-01..2026-06-30."
            - "Two MAJOR findings recorded on the two loans; review issued (score frozen 0.2500 over sample 2)."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Gamma Servicing", org_id: "1000001", org_id_type: "CHARTER_NUMBER", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_g: $.data.id }
            - call: "POST /registry/members/${m_g}/signers"
              payload: { full_name: "Gail Signer", email: "gail@gamma.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_g}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 50000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_g}"
              captures: { g_loan1: $.data.id }
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 50000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_g}"
              captures: { g_loan2: $.data.id }
            - call: "POST /registry/qa-reviews"
              payload: { member_id: "${m_g}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: QAAuditor
              as_user_id: "qa-creator"
              captures: { rev: $.data.id }
            - call: "POST /registry/qa-reviews/${rev}/findings"
              payload: { loan_id: "${g_loan1}", field_name: "CURRENT_SERVICER", expected_value: "1000001", actual_value: "1000999", severity: "MAJOR" }
              as: QAAuditor
              as_user_id: "qa-creator"
            - call: "POST /registry/qa-reviews/${rev}/findings"
              payload: { loan_id: "${g_loan2}", field_name: "CURRENT_INVESTOR", expected_value: "1000001", actual_value: "1000888", severity: "MAJOR" }
              as: QAAuditor
              as_user_id: "qa-creator"
            - call: "POST /registry/qa-reviews/${rev}/issue"
              payload: {}
              as: QAAuditor
              as_user_id: "qa-creator"
            - call: "POST /registry/qa-reviews/${rev}/reopen"
              payload: {}
              as: QAAuditor
              as_user_id: "qa-creator"
            - call: "POST /registry/qa-reviews/${rev}/findings"
              payload: { loan_id: "${g_loan1}", field_name: "MIN", expected_value: "100000100000000014", actual_value: "100000100000000099", severity: "CRITICAL" }
              as: QAAuditor
              as_user_id: "qa-creator"
            - call: "POST /registry/qa-reviews/${rev}/findings"
              payload: { loan_id: "${g_loan2}", field_name: "CLOSING_DATE", expected_value: "2026-01-05", actual_value: "2026-01-06", severity: "MINOR" }
              as: QAAuditor
              as_user_id: "qa-creator"
          trigger:
            - call: "POST /registry/qa-reviews/${rev}/issue"
              payload: {}
              as: QAAuditor
              as_user_id: "qa-creator"
          assert:
            - "QAReview.${rev}.sample_size == 2 at both issues"
            - "after the first issue QAReview.${rev}.discrepancy_score == 0.2500 (2 MAJOR x 0.5 / 2)"
            - "after re-issue QAReview.${rev}.discrepancy_score == 1.1000 ((1 CRITICAL x 1.0 + 2 MAJOR x 0.5 + 1 MINOR x 0.2) / 2 = 2.2 / 2; the score is not capped at 1.0)"
            - "the re-issued frozen score differs from the first frozen score"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: late_fee_marginal_tiers_mode_a
        grounds:
          - calculations.transfer_late_fee
          - entities.Transfer.fields.days_late
          - entities.Transfer.fields.late_fee_cents
        distinguishing_aspect: |
          Mode (a): the fee has >= 3 inputs (days_late, three tier rates, tier
          brackets) with non-linear marginal interaction — a transfer 20 days
          late at 20 days late pays 15x2500 + 5x5000 == 62500 — not 20x5000 and not
          20x2500 — and the instance recipe exercises the tier-1-only leg
          (days_late 10 -> 25000): the marginal tier of each day depends on
          how many lower-tier days were already consumed.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T00:00:00Z. Members A (org 1000000) and B (org 1000001) ACTIVE with signers. A registers one loan (TX, closing 2026-01-05, 100000000 cents), version 1."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Alpha Mortgage", org_id: "1000000", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_a: $.data.id }
            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "Alice Signer", email: "alice@alpha.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_a}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Beta Investors", org_id: "1000001", org_id_type: "LEI", member_type: "INVESTOR" }
              as: RegistryAdmin
              captures: { m_b: $.data.id }
            - call: "POST /registry/members/${m_b}/signers"
              payload: { full_name: "Bob Signer", email: "bob@beta.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_b}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 100000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { loan: $.data.id, loan_v: $.data.version }
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-24T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /registry/transfers"
              payload: { loan_id: "${loan}", to_member_id: "${m_b}", transfer_type: "BENEFICIAL", effective_date: "2026-02-04T00:00:00Z", idempotency_key: "k-fee-20", expected_loan_version: "${loan_v}" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { tr: $.data.id }
          assert:
            - "Transfer.${tr}.days_late == 10 (calendar day difference 2026-02-24 minus 2026-02-04 = 20, minus the 10-day window = 10)"
            - "Transfer.${tr}.late_fee_cents == 25000 (10 x 2500, all within tier 1)"

      - name: sanction_per_line_round_then_sum_mode_b
        grounds:
          - calculations.sanction_assessment
          - entities.Sanction.fields.total_amount_cents
        distinguishing_aspect: |
          Mode (b): rounding order is pinned round-per-line-then-sum. With 3
          MINOR findings (base 25005), repeat multiplier 1.5 and abatement 0.9,
          each line rounds 33756.75 to 33757 and the total is 101271 — the
          sum-then-round order would produce 101270, one cent less; the
          scaffold's pinned order is the only accepted answer.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T00:00:00Z. Member D (org 1000002) ACTIVE with signer; registers 3 loans (TX, 40000000 cents, closing 2026-01-05)."
            - "Review R1 for D by qa-creator with 1 MAJOR finding; issued; settled by qa-settler with abatement 1.0; D pays the sanction (proven prior exists)."
            - "Review R2 for D by qa-creator with 3 MINOR findings (one per loan); issued."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Delta Funding", org_id: "1000002", org_id_type: "TAX_ID", member_type: "ORIGINATOR" }
              as: RegistryAdmin
              captures: { m_d: $.data.id }
            - call: "POST /registry/members/${m_d}/signers"
              payload: { full_name: "Dan Signer", email: "dan@delta.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_d}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 40000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_d}"
              captures: { d_loan1: $.data.id }
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 40000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_d}"
              captures: { d_loan2: $.data.id }
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 40000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_d}"
              captures: { d_loan3: $.data.id }
            - call: "POST /registry/qa-reviews"
              payload: { member_id: "${m_d}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }
              as: QAAuditor
              as_user_id: "qa-creator"
              captures: { rev1: $.data.id }
            - call: "POST /registry/qa-reviews/${rev1}/findings"
              payload: { loan_id: "${d_loan1}", field_name: "PROPERTY_STATE", expected_value: "TX", actual_value: "TN", severity: "MAJOR" }
              as: QAAuditor
              as_user_id: "qa-creator"
            - call: "POST /registry/qa-reviews/${rev1}/issue"
              payload: {}
              as: QAAuditor
              as_user_id: "qa-creator"
            - call: "POST /registry/qa-reviews/${rev1}/settle"
              payload: { abatement_factor: 1.0 }
              as: QAAuditor
              as_user_id: "qa-settler"
            - call: "GET /registry/sanctions"
              payload: { review_id: "${rev1}" }
              as: QAAuditor
              as_user_id: "qa-settler"
              captures: { sanc1: "$.data[0].id" }
            - call: "POST /registry/sanctions/${sanc1}/pay"
              payload: {}
              as: MemberRep
              as_user_id: "${m_d}"
            - call: "POST /registry/qa-reviews"
              payload: { member_id: "${m_d}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: QAAuditor
              as_user_id: "qa-creator"
              captures: { rev2: $.data.id }
            - call: "POST /registry/qa-reviews/${rev2}/findings"
              payload: { loan_id: "${d_loan1}", field_name: "CLOSING_DATE", expected_value: "2026-01-05", actual_value: "2026-01-07", severity: "MINOR" }
              as: QAAuditor
              as_user_id: "qa-creator"
            - call: "POST /registry/qa-reviews/${rev2}/findings"
              payload: { loan_id: "${d_loan2}", field_name: "CLOSING_DATE", expected_value: "2026-01-05", actual_value: "2026-01-08", severity: "MINOR" }
              as: QAAuditor
              as_user_id: "qa-creator"
            - call: "POST /registry/qa-reviews/${rev2}/findings"
              payload: { loan_id: "${d_loan3}", field_name: "MIN", expected_value: "100000200000000012", actual_value: "100000200000000021", severity: "MINOR" }
              as: QAAuditor
              as_user_id: "qa-creator"
            - call: "POST /registry/qa-reviews/${rev2}/issue"
              payload: {}
              as: QAAuditor
              as_user_id: "qa-creator"
          trigger:
            - call: "POST /registry/qa-reviews/${rev2}/settle"
              payload: { abatement_factor: 0.9 }
              as: QAAuditor
              as_user_id: "qa-settler"
            - call: "GET /registry/sanctions"
              payload: { review_id: "${rev2}" }
              as: QAAuditor
              as_user_id: "qa-settler"
              captures: { sanc2: "$.data[0].id" }
          assert:
            - "Sanction.${sanc2}.line_count == 3"
            - "Sanction.${sanc2}.total_amount_cents == 101271 (per-line round 33757 x 3)"
            - "Sanction.${sanc2}.total_amount_cents != 101270 (the sum-then-round value is rejected)"
            - "the repeat multiplier 1.5 was applied because Sanction.${sanc1} is PAID (a proven prior)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: loan_foreclosure_rescind_cycle_on_registered_loan
        grounds:
          - state_machines.RegisteredLoan.ACTIVE_to_FORECLOSING
          - state_machines.RegisteredLoan.FORECLOSING_to_ACTIVE
        distinguishing_aspect: |
          RegisteredLoan's machine is cyclic: ACTIVE -> FORECLOSING -> ACTIVE
          via rescind, and the loop can repeat — after rescind the same loan
          re-enters FORECLOSING with a fresh signer check, which a linear
          pipeline could never express. The cycle lives on RegisteredLoan.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T00:00:00Z. Member A (org 1000000) ACTIVE with signer S (role_scope ALL, effective_from 2026-01-01)."
            - "A registers one TX loan (IN_REGISTRY_ALLOWED)."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Alpha Mortgage", org_id: "1000000", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_a: $.data.id }
            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "Alice Signer", email: "alice@alpha.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
              captures: { sig_a: $.data.id }
            - call: "POST /registry/members/${m_a}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 75000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { loan: $.data.id }
          trigger:
            - call: "POST /registry/loans/${loan}/foreclose"
              payload: { signer_id: "${sig_a}" }
              as: MemberRep
              as_user_id: "${m_a}"
            - call: "POST /registry/loans/${loan}/rescind-foreclosure"
              payload: {}
              as: MemberRep
              as_user_id: "${m_a}"
            - call: "POST /registry/loans/${loan}/foreclose"
              payload: { signer_id: "${sig_a}" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { loan_after: $.data.version }
          assert:
            - "first foreclose sets RegisteredLoan.${loan}.status == FORECLOSING"
            - "rescind sets status back to ACTIVE"
            - "second foreclose succeeds again, status == FORECLOSING and version == 4 (each transition bumped version)"
            - "the cyclic loop was traversed twice without any terminal-state rejection"

      - name: qa_review_issue_reopen_issue_cycle_on_qa_review
        grounds:
          - state_machines.QAReview.DRAFT_to_FINDINGS_ISSUED
          - state_machines.QAReview.FINDINGS_ISSUED_to_DRAFT
        distinguishing_aspect: |
          QAReview's machine is cyclic on a different entity than
          RegisteredLoan: DRAFT -> FINDINGS_ISSUED -> DRAFT -> FINDINGS_ISSUED,
          and each pass through issue re-freezes sample_size and
          discrepancy_score — the loop is a corrective re-review, not a
          pipeline bug.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T00:00:00Z. Member G (org 1000001) ACTIVE with signer; one loan registered."
            - "Review R by qa-creator with one MINOR finding; issued."
          setup_api_calls:
