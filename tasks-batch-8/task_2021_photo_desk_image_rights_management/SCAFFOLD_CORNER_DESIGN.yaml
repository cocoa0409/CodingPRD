scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: photographer_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Photographer.fields.rights_reversion_months, entities.Photographer.fields.status, entities.Photographer.fields.accrued_earnings_cents]
        distinguishing_aspect: "Omitting rights_reversion_months applies default 24; status starts ACTIVE; both computed ledgers start at 0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /photographers", payload: { full_name: "Sam Staff", email: "sam@acme.news", photographer_type: "STAFF", day_rate_cents: 25000, per_image_fee_cents: 40000, royalty_rate_per_use_cents: 305 }, as: PhotoEditor, captures: { rev: $.data.rights_reversion_months, st: $.data.status, acc: $.data.accrued_earnings_cents, paid: $.data.paid_out_cents } }
          assert:
            - "captured rev == 24 (default applied)"
            - "captured st == ACTIVE"
            - "captured acc == 0 and paid == 0"

      - name: photographer_email_must_be_unique
        claim_type: type_constraints
        grounds: [entities.Photographer.fields.email, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A second photographer with an already-registered email is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["one photographer with email sam@acme.news"]
          setup_api_calls:
            - { call: "POST /photographers", payload: { full_name: "Sam Staff", email: "sam@acme.news", photographer_type: "STAFF", day_rate_cents: 25000, per_image_fee_cents: 40000, royalty_rate_per_use_cents: 305 }, as: PhotoEditor }
          trigger:
            - { call: "POST /photographers", payload: { full_name: "Samuel Staff", email: "sam@acme.news", photographer_type: "FREELANCE", day_rate_cents: 20000, per_image_fee_cents: 30000, royalty_rate_per_use_cents: 305 }, as: PhotoEditor, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_REQUEST"

      - name: image_wire_ingest_missing_agency_rejected
        claim_type: required_fields
        grounds: [entities.Image.fields.agency_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "agency_name is conditionally required: WIRE ingest without it fails while ASSIGNMENT-source images never carry it."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /images", payload: { source_type: "WIRE", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_REQUEST (agency_name required for WIRE/STOCK)"

      - name: image_ingest_assignment_source_rejected
        claim_type: type_constraints
        grounds: [entities.Image.fields.source_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /images is the wire/stock ingest channel only; source_type ASSIGNMENT is rejected there because assignment images enter via assignment submission."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /images", payload: { source_type: "ASSIGNMENT", base_license_fee_cents: 0, caption: "Firefighters at dawn on the bridge", credit_line: "Sam Staff / ACME News" }, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_REQUEST"

      - name: wire_image_ingest_defaults_and_initial_state
        claim_type: initial_state
        grounds: [entities.Image.fields.status, entities.Image.fields.restriction_status, entities.Image.fields.times_used, entities.Image.fields.rights_reverted, state_machines.Image]
        distinguishing_aspect: "A freshly ingested wire image starts INGESTED with restriction_status NONE, times_used 0, rights_reverted false."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { st: $.data.status, rst: $.data.restriction_status, used: $.data.times_used, rev: $.data.rights_reverted, base: $.data.base_license_fee_cents } }
          assert:
            - "captured st == INGESTED"
            - "captured rst == NONE"
            - "captured used == 0"
            - "captured rev == false"
            - "captured base == 10000"

      - name: usage_run_record_immutable_no_version
        claim_type: immutability
        grounds: [entities.UsageRun]
        distinguishing_aspect: "UsageRun is an append-only event (common_fields false): the creation response carries id and created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup:
            - "CLEARED WIRE image with ACTIVE DIGITAL license covering August"
          setup_api_calls:
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { w_id: $.data.id } }
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager }
            - { call: "GET /images/${w_id}", as: RightsManager, captures: { w_v: $.data.version } }
            - { call: "POST /images/${w_id}/licenses", payload: { usage_scope: "DIGITAL", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-08-31T23:59:59Z", expected_image_version: "${w_v}" }, as: RightsManager, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: RightsManager }
          trigger:
            - { call: "POST /images/${w_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "DIGITAL", story_slug: "flood-day-one", published_at: "2026-08-03T12:00:00Z" }, as: RightsManager, captures: { run_id: $.data.id, run_at: $.data.created_at, run_roy: $.data.royalty_cents } }
          assert:
            - "captured run_id is a UUID and run_at is set (common_fields false still supplies id and created_at)"
            - "the UsageRun response contains no version or updated_at field"
            - "captured run_roy == 0 (WIRE image photographer_id is null, so no per-line royalty accrues to any photographer)"

      - name: get_image_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_IMAGE_NOT_FOUND]"]
        distinguishing_aspect: "Reading a random image id yields ERR_IMAGE_NOT_FOUND with http 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /images/00000000-0000-4000-8000-000000000000", as: PhotoEditor, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_IMAGE_NOT_FOUND"

      - name: get_claim_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_CLAIM_NOT_FOUND]"]
        distinguishing_aspect: "Reading a random claim id yields ERR_CLAIM_NOT_FOUND with http 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /infringement-claims/00000000-0000-4000-8000-000000000000", as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_CLAIM_NOT_FOUND"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: assignment_accept_from_in_progress_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Assignment.IN_PROGRESS_to_SUBMITTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "accept is declared only from SUBMITTED; invoking it from IN_PROGRESS fails with ERR_INVALID_STATE and leaves the assignment untouched."
        test_recipe:
          setup: ["commissioned assignment with one submitted image, still IN_PROGRESS (not yet submitted)"]
          setup_api_calls:
            - { call: "POST /photographers", payload: { full_name: "Sam Staff", email: "sam@acme.news", photographer_type: "STAFF", day_rate_cents: 25000, per_image_fee_cents: 40000, royalty_rate_per_use_cents: 305 }, as: PhotoEditor, captures: { p_id: $.data.id } }
            - { call: "POST /story-requests", payload: { headline: "Bridge fire", slug: "bridge-fire", needed_by: "2026-09-01T00:00:00Z", budget_cents: 30000 }, as: PhotoEditor, captures: { s_id: $.data.id } }
            - { call: "POST /story-requests/${s_id}/decide", payload: { decision: "COMMISSION", photographer_id: "${p_id}", brief: "Fire scene", shoot_start: "2026-08-10T09:00:00Z", shoot_end: "2026-08-11T17:00:00Z" }, as: PhotoEditor, captures: { a_id: $.data.commissioned_assignment_id } }
            - { call: "POST /assignments/${a_id}/images", payload: { caption: "Firefighters at dawn on the bridge", credit_line: "Sam Staff / ACME News" }, as: Photographer, as_user_id: "${p_id}" }
          trigger:
            - { call: "POST /assignments/${a_id}/accept", payload: {}, as: PhotoEditor, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_STATE"

      - name: assignment_cancel_from_accepted_terminal_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Assignment]
        distinguishing_aspect: "ACCEPTED is terminal for Assignment: a later cancel is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["assignment fully accepted"]
          setup_api_calls:
            - { call: "POST /photographers", payload: { full_name: "Sam Staff", email: "sam@acme.news", photographer_type: "STAFF", day_rate_cents: 25000, per_image_fee_cents: 40000, royalty_rate_per_use_cents: 305 }, as: PhotoEditor, captures: { p_id: $.data.id } }
            - { call: "POST /story-requests", payload: { headline: "Bridge fire", slug: "bridge-fire", needed_by: "2026-09-01T00:00:00Z", budget_cents: 30000 }, as: PhotoEditor, captures: { s_id: $.data.id } }
            - { call: "POST /story-requests/${s_id}/decide", payload: { decision: "COMMISSION", photographer_id: "${p_id}", brief: "Fire scene", shoot_start: "2026-08-10T09:00:00Z", shoot_end: "2026-08-11T17:00:00Z" }, as: PhotoEditor, captures: { a_id: $.data.commissioned_assignment_id } }
            - { call: "POST /assignments/${a_id}/images", payload: { caption: "Firefighters at dawn on the bridge", credit_line: "Sam Staff / ACME News" }, as: Photographer, as_user_id: "${p_id}" }
            - { call: "POST /assignments/${a_id}/submit", payload: {}, as: Photographer, as_user_id: "${p_id}" }
            - { call: "POST /assignments/${a_id}/accept", payload: {}, as: PhotoEditor }
          trigger:
            - { call: "POST /assignments/${a_id}/cancel", payload: {}, as: PhotoEditor, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_STATE"

      - name: claim_offer_from_intake_rejected
        claim_type: invalid_transition
        grounds: [state_machines.InfringementClaim.INTAKE_to_UNDER_REVIEW, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "offer is declared from UNDER_REVIEW or COUNTERED only; from INTAKE it fails with ERR_INVALID_STATE (review step cannot be skipped)."
        test_recipe:
          setup: ["CLEARED WIRE image with a claim in INTAKE"]
          setup_api_calls:
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { w_id: $.data.id } }
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager }
            - { call: "POST /infringement-claims", payload: { image_id: "${w_id}", claimant_name: "Pix Agency", claim_type: "UNLICENSED_USE", description: "Alleged unlicensed use", claimed_amount_cents: 50000 }, as: RightsManager, as_user_id: "rm_alice", captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /infringement-claims/${c_id}/offer", payload: { settlement_offer_cents: 40000 }, as: RightsManager, as_user_id: "rm_alice", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_STATE"

      - name: license_double_activate_rejected
        claim_type: idempotency
        grounds: [state_machines.License.DRAFT_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating an already-ACTIVE license repeats a fired trigger: the second activate is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["CLEARED WIRE image with an ACTIVE DIGITAL license"]
          setup_api_calls:
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { w_id: $.data.id } }
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager }
            - { call: "GET /images/${w_id}", as: RightsManager, captures: { w_v: $.data.version } }
            - { call: "POST /images/${w_id}/licenses", payload: { usage_scope: "DIGITAL", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-08-31T23:59:59Z", expected_image_version: "${w_v}" }, as: RightsManager, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: RightsManager }
          trigger:
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_STATE"

      - name: image_archive_from_ingested_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Image, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "archive is declared from CLEARED or PUBLISHED only; archiving an INGESTED image fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["WIRE image freshly ingested (INGESTED)"]
          setup_api_calls:
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { w_id: $.data.id } }
          trigger:
            - { call: "POST /images/${w_id}/archive", payload: {}, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_STATE"

      - name: story_fulfilled_by_matching_usage_run
        claim_type: valid_transition
        grounds: [state_machines.StoryRequest, entities.StoryRequest.fields.sourced_image_id]
        distinguishing_aspect: "The system auto-transition DECIDED -> FULFILLED fires when a usage run lands whose license is linked to the story (WIRE_STOCK sourcing path end-to-end)."
        test_recipe:
          setup: ["CLEARED WIRE image; story decided WIRE_STOCK against it; ACTIVE story-linked DIGITAL license"]
          setup_api_calls:
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { w_id: $.data.id } }
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager }
            - { call: "POST /story-requests", payload: { headline: "Flood aftermath", slug: "flood-aftermath", needed_by: "2026-09-01T00:00:00Z", budget_cents: 30000 }, as: PhotoEditor, captures: { s_id: $.data.id } }
            - { call: "POST /story-requests/${s_id}/decide", payload: { decision: "WIRE_STOCK", image_id: "${w_id}" }, as: PhotoEditor, captures: { s_st: $.data.status, s_img: $.data.sourced_image_id } }
            - { call: "GET /images/${w_id}", as: RightsManager, captures: { w_v: $.data.version } }
            - { call: "POST /images/${w_id}/licenses", payload: { usage_scope: "DIGITAL", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-08-31T23:59:59Z", story_request_id: "${s_id}", expected_image_version: "${w_v}" }, as: RightsManager, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: RightsManager }
          trigger:
            - { call: "POST /images/${w_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "DIGITAL", story_slug: "flood-aftermath", published_at: "2026-08-03T12:00:00Z" }, as: PhotoEditor }
            - { call: "GET /story-requests/${s_id}", as: PhotoEditor, captures: { s_st2: $.data.status } }
          assert:
            - "captured s_st == DECIDED and s_img == captured w_id"
            - "captured s_st2 == FULFILLED (auto-transition on the matching usage run)"

      - name: claim_intake_latches_image_restricted
        claim_type: side_effect_execution
        grounds: [state_machines.Image.restriction_status, state_machines.InfringementClaim]
        distinguishing_aspect: "Claim intake's cross-entity side effect flips the image's restriction dimension to RESTRICTED while its editorial status stays CLEARED (parallel dimensions evolve independently)."
        test_recipe:
          setup: ["CLEARED WIRE image"]
          setup_api_calls:
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { w_id: $.data.id } }
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager }
          trigger:
            - { call: "POST /infringement-claims", payload: { image_id: "${w_id}", claimant_name: "Pix Agency", claim_type: "COPYRIGHT_DISPUTE", description: "Disputed rights", claimed_amount_cents: 50000 }, as: RightsManager, as_user_id: "rm_alice", captures: { c_st: $.data.status, c_by: $.data.intaken_by_user_id } }
            - { call: "GET /images/${w_id}", as: RightsManager, captures: { img_st: $.data.status, img_rst: $.data.restriction_status } }
          assert:
            - "captured c_st == INTAKE"
            - "captured c_by == rm_alice (intaker stamped for segregation of duties)"
            - "captured img_st == CLEARED (editorial dimension unchanged)"
            - "captured img_rst == RESTRICTED (restriction dimension latched)"

      - name: embargo_set_then_cleared_with_null
        claim_type: valid_transition
        grounds: [entities.Image.fields.embargo_until]
        distinguishing_aspect: "PUT embargo sets the embargo instant and a null payload clears it; both writes bump Image.version."
        test_recipe:
          setup: ["CLEARED WIRE image without embargo"]
          setup_api_calls:
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { w_id: $.data.id } }
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager }
          trigger:
            - { call: "PUT /images/${w_id}/embargo", payload: { embargo_until: "2026-09-01T00:00:00Z" }, as: RightsManager, captures: { emb1: $.data.embargo_until, v1: $.data.version } }
            - { call: "PUT /images/${w_id}/embargo", payload: { embargo_until: null }, as: RightsManager, captures: { emb2: $.data.embargo_until, v2: $.data.version } }
          assert:
            - "captured emb1 == 2026-09-01T00:00:00Z"
            - "captured emb2 == null"
            - "captured v2 == v1 + 1 (every mutation bumps version)"

      - name: clear_without_credit_line_returns_incomplete_metadata
        claim_type: precondition_enforcement
        grounds: [state_machines.Image.INGESTED_to_CLEARED, "validations[priority=14]", "errors[ERR_INCOMPLETE_METADATA]"]
        distinguishing_aspect: "The metadata/caption standard is enforced at clear time: a wire image ingested without credit_line cannot be cleared until the credit is supplied."
        test_recipe:
          setup: ["WIRE image ingested with a valid caption but no credit_line"]
          setup_api_calls:
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north" }, as: RightsManager, captures: { w_id: $.data.id } }
          trigger:
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INCOMPLETE_METADATA"

  # =====================================================================
  # Section: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: license_fee_single_final_rounding
        claim_type: precision
        grounds: [calculations.license_fee_quote]
        distinguishing_aspect: "Rounding happens once at the final step: base 1001 with SYNDICATION (1.5) then GLOBAL (1.6) yields round_half_up(2402.4) = 2402; rounding the intermediate 1501.5 first would yield 2403."
        test_recipe:
          setup: ["CLEARED STOCK image with base_license_fee_cents 1001, never used"]
          setup_api_calls:
            - { call: "POST /images", payload: { source_type: "STOCK", agency_name: "StockHouse", base_license_fee_cents: 1001, caption: "Aerial view of the harbor at dusk", credit_line: "StockHouse / StockHouse" }, as: RightsManager, captures: { w_id: $.data.id } }
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager }
            - { call: "GET /images/${w_id}", as: RightsManager, captures: { w_v: $.data.version } }
          trigger:
            - { call: "POST /images/${w_id}/licenses", payload: { usage_scope: "SYNDICATION", territory: "GLOBAL", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z", expected_image_version: "${w_v}" }, as: RightsManager, captures: { fee: $.data.fee_cents } }
          assert:
            - "captured fee == 2402 (single final round_half_up, not step-rounded 2403)"

      - name: payment_run_period_half_open_membership
        claim_type: input_set_filtering
        grounds: [calculations.photographer_payout]
        distinguishing_aspect: "The payout window is half-open [period_start, period_end): an assignment accepted exactly at period_start counts and one accepted exactly at period_end is excluded."
        test_recipe:
          setup:
            - "STAFF photographer (day 25000, per-image 40000) with assignment A1 accepted at 2026-08-01T00:00:00Z (1 shoot day, 1 image) and assignment A2 accepted at 2026-09-01T00:00:00Z (1 shoot day, 1 image)"
          setup_api_calls:
            - { call: "POST /photographers", payload: { full_name: "Sam Staff", email: "sam@acme.news", photographer_type: "STAFF", day_rate_cents: 25000, per_image_fee_cents: 40000, royalty_rate_per_use_cents: 305 }, as: PhotoEditor, captures: { p_id: $.data.id } }
            - { call: "POST /story-requests", payload: { headline: "Bridge fire", slug: "bridge-fire", needed_by: "2026-09-01T00:00:00Z", budget_cents: 30000 }, as: PhotoEditor, captures: { s1_id: $.data.id } }
            - { call: "POST /story-requests/${s1_id}/decide", payload: { decision: "COMMISSION", photographer_id: "${p_id}", brief: "Fire scene", shoot_start: "2026-08-05T09:00:00Z", shoot_end: "2026-08-05T17:00:00Z" }, as: PhotoEditor, captures: { a1_id: $.data.commissioned_assignment_id } }
            - { call: "POST /assignments/${a1_id}/images", payload: { caption: "Firefighters at dawn on the bridge", credit_line: "Sam Staff / ACME News" }, as: Photographer, as_user_id: "${p_id}" }
            - { call: "POST /assignments/${a1_id}/submit", payload: {}, as: Photographer, as_user_id: "${p_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /assignments/${a1_id}/accept", payload: {}, as: PhotoEditor }
            - { call: "POST /story-requests", payload: { headline: "Harbor festival", slug: "harbor-festival", needed_by: "2026-10-01T00:00:00Z", budget_cents: 30000 }, as: PhotoEditor, captures: { s2_id: $.data.id } }
            - { call: "POST /story-requests/${s2_id}/decide", payload: { decision: "COMMISSION", photographer_id: "${p_id}", brief: "Festival crowd", shoot_start: "2026-08-20T09:00:00Z", shoot_end: "2026-08-20T17:00:00Z" }, as: PhotoEditor, captures: { a2_id: $.data.commissioned_assignment_id } }
            - { call: "POST /assignments/${a2_id}/images", payload: { caption: "Festival crowd at the harbor", credit_line: "Sam Staff / ACME News" }, as: Photographer, as_user_id: "${p_id}" }
            - { call: "POST /assignments/${a2_id}/submit", payload: {}, as: Photographer, as_user_id: "${p_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /assignments/${a2_id}/accept", payload: {}, as: PhotoEditor }
            - { call: "GET /photographers/${p_id}", as: FinanceAdmin, captures: { p_v: $.data.version } }
          trigger:
            - { call: "POST /photographers/${p_id}/payment-runs", payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", expected_photographer_version: "${p_v}" }, as: FinanceAdmin, captures: { run_g: $.data.guarantee_amount_cents, run_t: $.data.total_cents } }
          assert:
            - "captured run_g == 65000 (only A1: 25000 x 1 day + 40000 x 1 image; A2 accepted exactly at period_end is excluded)"

      - name: rights_reversion_boundary_and_license_block
        claim_type: correct_result
        grounds: [calculations.rights_reversion_date, "validations[priority=17]", "errors[ERR_RIGHTS_REVERTED]"]
        distinguishing_aspect: "rights_reverted flips at exactly first_published_at + rights_reversion_months (>= boundary): one second before, new licenses are allowed; at the instant, creation is rejected with ERR_RIGHTS_REVERTED."
        test_recipe:
          setup:
            - "FREELANCE photographer (reversion 12 months) with a PUBLISHED assignment image (first published 2026-08-20T00:00:00Z, so rights_reversion_at = 2027-08-20T00:00:00Z) holding an ACTIVE DIGITAL license"
          setup_api_calls:
            - { call: "POST /photographers", payload: { full_name: "Fran Free", email: "fran@freelance.io", photographer_type: "FREELANCE", day_rate_cents: 20000, per_image_fee_cents: 30000, royalty_rate_per_use_cents: 305, rights_reversion_months: 12 }, as: PhotoEditor, captures: { p_id: $.data.id } }
            - { call: "POST /story-requests", payload: { headline: "Night market", slug: "night-market", needed_by: "2026-09-01T00:00:00Z", budget_cents: 30000 }, as: PhotoEditor, captures: { s_id: $.data.id } }
            - { call: "POST /story-requests/${s_id}/decide", payload: { decision: "COMMISSION", photographer_id: "${p_id}", brief: "Market coverage", shoot_start: "2026-08-10T09:00:00Z", shoot_end: "2026-08-10T17:00:00Z" }, as: PhotoEditor, captures: { a_id: $.data.commissioned_assignment_id } }
            - { call: "POST /assignments/${a_id}/images", payload: { caption: "Night market stalls under rain", credit_line: "Fran Free / ACME News" }, as: Photographer, as_user_id: "${p_id}", captures: { img_id: $.data.id } }
            - { call: "POST /assignments/${a_id}/submit", payload: {}, as: Photographer, as_user_id: "${p_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /assignments/${a_id}/accept", payload: {}, as: PhotoEditor }
            - { call: "GET /images/${img_id}", as: RightsManager, captures: { img_v: $.data.version } }
            - { call: "POST /images/${img_id}/licenses", payload: { usage_scope: "DIGITAL", valid_from: "2026-08-01T00:00:00Z", valid_to: "2028-01-01T00:00:00Z", expected_image_version: "${img_v}" }, as: RightsManager, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: RightsManager }
            - { call: "POST /images/${img_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "DIGITAL", story_slug: "night-market", published_at: "2026-08-20T00:00:00Z" }, as: PhotoEditor }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-08-19T23:59:59Z" }, as: PlatformAdmin }
            - { call: "GET /images/${img_id}", as: RightsManager, captures: { rev_before: $.data.rights_reverted, rev_at: $.data.rights_reversion_at } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-08-20T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /images/${img_id}", as: RightsManager, captures: { rev_after: $.data.rights_reverted, img_v2: $.data.version } }
            - { call: "POST /images/${img_id}/licenses", payload: { usage_scope: "PRINT", valid_from: "2027-08-21T00:00:00Z", valid_to: "2027-12-31T23:59:59Z", expected_image_version: "${img_v2}" }, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "captured rev_at == 2027-08-20T00:00:00Z (12 calendar months after first publication)"
            - "captured rev_before == false (one second before the reversion instant)"
            - "captured rev_after == true (>= boundary at exactly the reversion instant)"
            - "captured err == ERR_RIGHTS_REVERTED (new licenses blocked on reverted ASSIGNMENT images)"

      - name: kill_fee_credited_on_cancel_from_submitted
        claim_type: correct_result
        grounds: [calculations.assignment_kill_fee, entities.Assignment.fields.kill_fee_cents]
        distinguishing_aspect: "Cancelling from SUBMITTED credits a kill fee of round_half_up(day_rate x day_count x 0.5) = 25000 to the photographer's accrual; cancelling earlier credits nothing."
        test_recipe:
          setup: ["STAFF photographer (day 25000); assignment (2 shoot days) with 1 image, in SUBMITTED"]
          setup_api_calls:
            - { call: "POST /photographers", payload: { full_name: "Sam Staff", email: "sam@acme.news", photographer_type: "STAFF", day_rate_cents: 25000, per_image_fee_cents: 40000, royalty_rate_per_use_cents: 305 }, as: PhotoEditor, captures: { p_id: $.data.id } }
            - { call: "POST /story-requests", payload: { headline: "Bridge fire", slug: "bridge-fire", needed_by: "2026-09-01T00:00:00Z", budget_cents: 30000 }, as: PhotoEditor, captures: { s_id: $.data.id } }
            - { call: "POST /story-requests/${s_id}/decide", payload: { decision: "COMMISSION", photographer_id: "${p_id}", brief: "Fire scene", shoot_start: "2026-08-10T09:00:00Z", shoot_end: "2026-08-11T17:00:00Z" }, as: PhotoEditor, captures: { a_id: $.data.commissioned_assignment_id } }
            - { call: "POST /assignments/${a_id}/images", payload: { caption: "Firefighters at dawn on the bridge", credit_line: "Sam Staff / ACME News" }, as: Photographer, as_user_id: "${p_id}" }
            - { call: "POST /assignments/${a_id}/submit", payload: {}, as: Photographer, as_user_id: "${p_id}" }
          trigger:
            - { call: "POST /assignments/${a_id}/cancel", payload: {}, as: PhotoEditor, captures: { kf: $.data.kill_fee_cents, a_st: $.data.status } }
            - { call: "GET /photographers/${p_id}", as: PhotoEditor, captures: { p_accr: $.data.accrued_earnings_cents } }
          assert:
            - "captured a_st == CANCELLED"
            - "captured kf == 25000 (round_half_up(25000 x 2 x 0.5))"
            - "captured p_accr == 25000"

  # =====================================================================
  # Section: validations
  # =====================================================================
  - section: validations
    instances:
      - name: sod_resolver_equals_intaker_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties: the RightsManager user who intook the claim cannot resolve it, even though the role is permitted; a different user id succeeds."
        test_recipe:
          setup: ["CLEARED WIRE image with an UNDER_REVIEW claim intaken by rm_alice"]
          setup_api_calls:
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { w_id: $.data.id } }
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager }
            - { call: "POST /infringement-claims", payload: { image_id: "${w_id}", claimant_name: "Pix Agency", claim_type: "UNLICENSED_USE", description: "Alleged unlicensed use", claimed_amount_cents: 50000 }, as: RightsManager, as_user_id: "rm_alice", captures: { c_id: $.data.id } }
            - { call: "POST /infringement-claims/${c_id}/review", payload: {}, as: RightsManager, as_user_id: "rm_alice" }
          trigger:
            - { call: "POST /infringement-claims/${c_id}/resolve", payload: { outcome: "DISMISSED" }, as: RightsManager, as_user_id: "rm_alice", captures: { err: $.data.error_id } }
            - { call: "POST /infringement-claims/${c_id}/resolve", payload: { outcome: "DISMISSED" }, as: RightsManager, as_user_id: "rm_bob", captures: { c_st: $.data.status } }
          assert:
            - "captured err == ERR_SEGREGATION_OF_DUTIES"
            - "captured c_st == DISMISSED (different resolver succeeds)"

      - name: usage_run_at_valid_to_allowed_then_violation
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_LICENSE_WINDOW_VIOLATION]"]
        distinguishing_aspect: "The license window is CLOSED: a usage run at exactly valid_to is allowed and one second after is rejected with ERR_LICENSE_WINDOW_VIOLATION."
        test_recipe:
          setup: ["CLEARED WIRE image with ACTIVE DIGITAL license valid [2026-08-01, 2026-08-05T00:00:00Z]"]
          setup_api_calls:
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { w_id: $.data.id } }
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager }
            - { call: "GET /images/${w_id}", as: RightsManager, captures: { w_v: $.data.version } }
            - { call: "POST /images/${w_id}/licenses", payload: { usage_scope: "DIGITAL", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-08-05T00:00:00Z", expected_image_version: "${w_v}" }, as: RightsManager, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: RightsManager }
          trigger:
            - { call: "POST /images/${w_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "DIGITAL", story_slug: "flood-edge", published_at: "2026-08-05T00:00:00Z" }, as: RightsManager, captures: { run_id: $.data.id } }
            - { call: "POST /images/${w_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "DIGITAL", story_slug: "flood-late", published_at: "2026-08-05T00:00:01Z" }, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "first run created at exactly valid_to (closed interval)"
            - "captured err == ERR_LICENSE_WINDOW_VIOLATION one second after valid_to"

      - name: usage_run_scope_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "errors[ERR_SCOPE_NOT_LICENSED]"]
        distinguishing_aspect: "A PRINT usage run against a DIGITAL-scoped ACTIVE license is rejected with ERR_SCOPE_NOT_LICENSED even though image, window, and license state are all valid."
        test_recipe:
          setup: ["CLEARED WIRE image with ACTIVE DIGITAL license covering August"]
          setup_api_calls:
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { w_id: $.data.id } }
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager }
            - { call: "GET /images/${w_id}", as: RightsManager, captures: { w_v: $.data.version } }
            - { call: "POST /images/${w_id}/licenses", payload: { usage_scope: "DIGITAL", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-08-31T23:59:59Z", expected_image_version: "${w_v}" }, as: RightsManager, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: RightsManager }
          trigger:
            - { call: "POST /images/${w_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "PRINT", story_slug: "flood-print", published_at: "2026-08-03T12:00:00Z" }, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_SCOPE_NOT_LICENSED"

      - name: usage_run_license_image_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_LICENSE_IMAGE_MISMATCH]"]
        distinguishing_aspect: "A license authorizes only its own image: using image A's ACTIVE license to publish image B is rejected with ERR_LICENSE_IMAGE_MISMATCH."
        test_recipe:
          setup: ["two CLEARED WIRE images W1 (with ACTIVE DIGITAL license) and W2 (no license)"]
          setup_api_calls:
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { w1_id: $.data.id } }
            - { call: "POST /images/${w1_id}/clear", payload: {}, as: RightsManager }
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Rescue boats on the river", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { w2_id: $.data.id } }
            - { call: "POST /images/${w2_id}/clear", payload: {}, as: RightsManager }
            - { call: "GET /images/${w1_id}", as: RightsManager, captures: { w1_v: $.data.version } }
            - { call: "POST /images/${w1_id}/licenses", payload: { usage_scope: "DIGITAL", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-08-31T23:59:59Z", expected_image_version: "${w1_v}" }, as: RightsManager, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: RightsManager }
          trigger:
            - { call: "POST /images/${w2_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "DIGITAL", story_slug: "flood-boats", published_at: "2026-08-03T12:00:00Z" }, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_LICENSE_IMAGE_MISMATCH"

      - name: usage_run_with_draft_license_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=21]", "errors[ERR_LICENSE_NOT_ACTIVE]"]
        distinguishing_aspect: "A DRAFT license never authorizes publication: usage against an unactivated license fails with ERR_LICENSE_NOT_ACTIVE."
        test_recipe:
          setup: ["CLEARED WIRE image with a DIGITAL license created but never activated"]
          setup_api_calls:
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { w_id: $.data.id } }
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager }
            - { call: "GET /images/${w_id}", as: RightsManager, captures: { w_v: $.data.version } }
            - { call: "POST /images/${w_id}/licenses", payload: { usage_scope: "DIGITAL", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-08-31T23:59:59Z", expected_image_version: "${w_v}" }, as: RightsManager, captures: { lic_id: $.data.id } }
          trigger:
            - { call: "POST /images/${w_id}/usage-runs", payload: { license_id: "${lic_id}", channel: "DIGITAL", story_slug: "flood-draft", published_at: "2026-08-03T12:00:00Z" }, as: RightsManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_LICENSE_NOT_ACTIVE"

      - name: image_limit_exceeded_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_IMAGE_LIMIT_EXCEEDED]"]
        distinguishing_aspect: "Submitting a second image to an assignment with max_image_count 1 is rejected with ERR_IMAGE_LIMIT_EXCEEDED."
        test_recipe:
          setup: ["commissioned assignment with max_image_count 1 and one image already submitted"]
          setup_api_calls:
            - { call: "POST /photographers", payload: { full_name: "Sam Staff", email: "sam@acme.news", photographer_type: "STAFF", day_rate_cents: 25000, per_image_fee_cents: 40000, royalty_rate_per_use_cents: 305 }, as: PhotoEditor, captures: { p_id: $.data.id } }
            - { call: "POST /story-requests", payload: { headline: "Bridge fire", slug: "bridge-fire", needed_by: "2026-09-01T00:00:00Z", budget_cents: 30000 }, as: PhotoEditor, captures: { s_id: $.data.id } }
            - { call: "POST /story-requests/${s_id}/decide", payload: { decision: "COMMISSION", photographer_id: "${p_id}", brief: "Fire scene", shoot_start: "2026-08-10T09:00:00Z", shoot_end: "2026-08-11T17:00:00Z", max_image_count: 1 }, as: PhotoEditor, captures: { a_id: $.data.commissioned_assignment_id } }
            - { call: "POST /assignments/${a_id}/images", payload: { caption: "Firefighters at dawn on the bridge", credit_line: "Sam Staff / ACME News" }, as: Photographer, as_user_id: "${p_id}" }
          trigger:
            - { call: "POST /assignments/${a_id}/images", payload: { caption: "Smoke over the river at sunrise", credit_line: "Sam Staff / ACME News" }, as: Photographer, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_IMAGE_LIMIT_EXCEEDED"

      - name: min_images_not_met_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=22]", "errors[ERR_MIN_IMAGES_NOT_MET]"]
        distinguishing_aspect: "An assignment requiring 2 images cannot be submitted with only 1: ERR_MIN_IMAGES_NOT_MET."
        test_recipe:
          setup: ["commissioned assignment with min_image_count 2 and only one image submitted"]
          setup_api_calls:
            - { call: "POST /photographers", payload: { full_name: "Sam Staff", email: "sam@acme.news", photographer_type: "STAFF", day_rate_cents: 25000, per_image_fee_cents: 40000, royalty_rate_per_use_cents: 305 }, as: PhotoEditor, captures: { p_id: $.data.id } }
            - { call: "POST /story-requests", payload: { headline: "Bridge fire", slug: "bridge-fire", needed_by: "2026-09-01T00:00:00Z", budget_cents: 30000 }, as: PhotoEditor, captures: { s_id: $.data.id } }
            - { call: "POST /story-requests/${s_id}/decide", payload: { decision: "COMMISSION", photographer_id: "${p_id}", brief: "Fire scene", shoot_start: "2026-08-10T09:00:00Z", shoot_end: "2026-08-11T17:00:00Z", min_image_count: 2 }, as: PhotoEditor, captures: { a_id: $.data.commissioned_assignment_id } }
            - { call: "POST /assignments/${a_id}/images", payload: { caption: "Firefighters at dawn on the bridge", credit_line: "Sam Staff / ACME News" }, as: Photographer, as_user_id: "${p_id}" }
          trigger:
            - { call: "POST /assignments/${a_id}/submit", payload: {}, as: Photographer, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_MIN_IMAGES_NOT_MET"

      - name: story_second_decide_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_STORY_ALREADY_DECIDED]"]
        distinguishing_aspect: "decide is one-shot: a second decide on a DECIDED story fails with ERR_STORY_ALREADY_DECIDED even with a valid WIRE_STOCK payload."
        test_recipe:
          setup: ["story already DECIDED (COMMISSION); a CLEARED WIRE image available for the second decide attempt"]
          setup_api_calls:
            - { call: "POST /photographers", payload: { full_name: "Sam Staff", email: "sam@acme.news", photographer_type: "STAFF", day_rate_cents: 25000, per_image_fee_cents: 40000, royalty_rate_per_use_cents: 305 }, as: PhotoEditor, captures: { p_id: $.data.id } }
            - { call: "POST /story-requests", payload: { headline: "Bridge fire", slug: "bridge-fire", needed_by: "2026-09-01T00:00:00Z", budget_cents: 30000 }, as: PhotoEditor, captures: { s_id: $.data.id } }
            - { call: "POST /story-requests/${s_id}/decide", payload: { decision: "COMMISSION", photographer_id: "${p_id}", brief: "Fire scene", shoot_start: "2026-08-10T09:00:00Z", shoot_end: "2026-08-11T17:00:00Z" }, as: PhotoEditor }
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { w_id: $.data.id } }
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager }
          trigger:
            - { call: "POST /story-requests/${s_id}/decide", payload: { decision: "WIRE_STOCK", image_id: "${w_id}" }, as: PhotoEditor, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_STORY_ALREADY_DECIDED"

      - name: suspended_photographer_cannot_be_commissioned
        claim_type: conditional_validation
        grounds: ["validations[priority=12]", state_machines.Photographer, "errors[ERR_PHOTOGRAPHER_SUSPENDED]"]
        distinguishing_aspect: "Commissioning is conditional on the photographer's state: after suspend, decide(COMMISSION) fails with ERR_PHOTOGRAPHER_SUSPENDED; after reactivate it succeeds."
        test_recipe:
          setup: ["photographer created then suspended; one OPEN story request"]
          setup_api_calls:
            - { call: "POST /photographers", payload: { full_name: "Sam Staff", email: "sam@acme.news", photographer_type: "STAFF", day_rate_cents: 25000, per_image_fee_cents: 40000, royalty_rate_per_use_cents: 305 }, as: PhotoEditor, captures: { p_id: $.data.id } }
            - { call: "POST /photographers/${p_id}/suspend", payload: {}, as: PhotoEditor, captures: { p_st: $.data.status } }
            - { call: "POST /story-requests", payload: { headline: "Bridge fire", slug: "bridge-fire", needed_by: "2026-09-01T00:00:00Z", budget_cents: 30000 }, as: PhotoEditor, captures: { s_id: $.data.id } }
          trigger:
            - { call: "POST /story-requests/${s_id}/decide", payload: { decision: "COMMISSION", photographer_id: "${p_id}", brief: "Fire scene", shoot_start: "2026-08-10T09:00:00Z", shoot_end: "2026-08-11T17:00:00Z" }, as: PhotoEditor, captures: { err: $.data.error_id } }
            - { call: "POST /photographers/${p_id}/reactivate", payload: {}, as: PhotoEditor }
            - { call: "POST /story-requests/${s_id}/decide", payload: { decision: "COMMISSION", photographer_id: "${p_id}", brief: "Fire scene", shoot_start: "2026-08-10T09:00:00Z", shoot_end: "2026-08-11T17:00:00Z" }, as: PhotoEditor, captures: { s_st: $.data.status } }
          assert:
            - "captured p_st == SUSPENDED"
            - "captured err == ERR_PHOTOGRAPHER_SUSPENDED"
            - "captured s_st == DECIDED after reactivation"

      - name: payment_period_overlap_locked
        claim_type: violation_to_error
        grounds: ["validations[priority=23]", "errors[ERR_PAYMENT_PERIOD_LOCKED]"]
        distinguishing_aspect: "A new run overlapping an APPROVED run's half-open period is rejected with ERR_PAYMENT_PERIOD_LOCKED; an exactly adjacent period is allowed."
        test_recipe:
          setup: ["STAFF photographer with an APPROVED payment run for [2026-08-01, 2026-09-01)"]
          setup_api_calls:
            - { call: "POST /photographers", payload: { full_name: "Sam Staff", email: "sam@acme.news", photographer_type: "STAFF", day_rate_cents: 25000, per_image_fee_cents: 40000, royalty_rate_per_use_cents: 305 }, as: PhotoEditor, captures: { p_id: $.data.id } }
            - { call: "GET /photographers/${p_id}", as: FinanceAdmin, captures: { p_v0: $.data.version } }
            - { call: "POST /photographers/${p_id}/payment-runs", payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", expected_photographer_version: "${p_v0}" }, as: FinanceAdmin, captures: { run1_id: $.data.id } }
            - { call: "POST /payment-runs/${run1_id}/approve", payload: {}, as: FinanceAdmin }
          trigger:
            - { call: "GET /photographers/${p_id}", as: FinanceAdmin, captures: { p_v1: $.data.version } }
            - { call: "POST /photographers/${p_id}/payment-runs", payload: { period_start: "2026-08-15T00:00:00Z", period_end: "2026-10-01T00:00:00Z", expected_photographer_version: "${p_v1}" }, as: FinanceAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /photographers/${p_id}/payment-runs", payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", expected_photographer_version: "${p_v1}" }, as: FinanceAdmin, captures: { run2_id: $.data.id } }
          assert:
            - "captured err == ERR_PAYMENT_PERIOD_LOCKED (overlapping an APPROVED run)"
            - "captured run2_id is set (period starting exactly at the other run's period_end is adjacent, allowed)"

      - name: budget_exceeded_on_activate
        claim_type: violation_to_error
        grounds: ["validations[priority=24]", "errors[ERR_BUDGET_EXCEEDED]"]
        distinguishing_aspect: "Activating a story-linked license whose fee (12000) exceeds the remaining budget (10000) is rejected with ERR_BUDGET_EXCEEDED; the license stays DRAFT."
        test_recipe:
          setup: ["story with budget 10000; CLEARED WIRE image with story-linked DRAFT DIGITAL license (fee 12000)"]
          setup_api_calls:
            - { call: "POST /story-requests", payload: { headline: "Flood aftermath", slug: "flood-aftermath", needed_by: "2026-09-01T00:00:00Z", budget_cents: 10000 }, as: PhotoEditor, captures: { s_id: $.data.id } }
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { w_id: $.data.id } }
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager }
            - { call: "GET /images/${w_id}", as: RightsManager, captures: { w_v: $.data.version } }
            - { call: "POST /images/${w_id}/licenses", payload: { usage_scope: "DIGITAL", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-08-31T23:59:59Z", story_request_id: "${s_id}", expected_image_version: "${w_v}" }, as: RightsManager, captures: { lic_id: $.data.id } }
          trigger:
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: RightsManager, captures: { err: $.data.error_id } }
            - { call: "GET /story-requests/${s_id}", as: PhotoEditor, captures: { comm: $.data.committed_cents } }
          assert:
            - "captured err == ERR_BUDGET_EXCEEDED"
            - "captured comm == 0 (no budget committed on failure)"

      - name: resolve_upheld_missing_amount_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Conditional requirement: resolve(UPHELD) without settlement_amount_cents fails shape validation with ERR_INVALID_REQUEST before any state or SoD check."
        test_recipe:
          setup: ["CLEARED WIRE image with an UNDER_REVIEW claim intaken by rm_alice"]
          setup_api_calls:
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { w_id: $.data.id } }
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager }
            - { call: "POST /infringement-claims", payload: { image_id: "${w_id}", claimant_name: "Pix Agency", claim_type: "UNLICENSED_USE", description: "Alleged unlicensed use", claimed_amount_cents: 50000 }, as: RightsManager, as_user_id: "rm_alice", captures: { c_id: $.data.id } }
            - { call: "POST /infringement-claims/${c_id}/review", payload: {}, as: RightsManager, as_user_id: "rm_alice" }
          trigger:
            - { call: "POST /infringement-claims/${c_id}/resolve", payload: { outcome: "UPHELD" }, as: RightsManager, as_user_id: "rm_bob", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_REQUEST"

      - name: priority_state_beats_temporal_on_usage
        claim_type: priority_ordering
        grounds: ["validations[priority=6]", "validations[priority=15]"]
        excluded_because:
          difficulty_instance: state_error_beats_embargo_temporal
          rationale: "Dual-failure ordering of ERR_IMAGE_NOT_CLEARED over ERR_EMBARGO_ACTIVE is asserted by the named §1.8 instance."

      - name: priority_safety_beats_fiscal_on_activate
        claim_type: priority_ordering
        grounds: ["validations[priority=8]", "validations[priority=24]"]
        excluded_because:
          difficulty_instance: release_safety_beats_budget_fiscal
          rationale: "Dual-failure ordering of ERR_RELEASE_REQUIRED over ERR_BUDGET_EXCEEDED is asserted by the named §1.8 instance."

  # =====================================================================
  # Section: endpoints
  # =====================================================================
  - section: endpoints
    instances:
      - name: images_search_filters_pagination_and_archive_visibility
        claim_type: listing
        grounds: [entities.Image.fields.status, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Archive search composes filters with pagination: ARCHIVED images are excluded by default (soft-delete layer), included only via include_archived=true by Archivist/RightsManager; limit/offset drive total_count and has_more."
        test_recipe:
          setup: ["three CLEARED desk images: W1 (WIRE, keyword flood), W2 (STOCK), W3 (WIRE) archived"]
          setup_api_calls:
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo", keywords: ["flood"] }, as: RightsManager, captures: { w1_id: $.data.id } }
            - { call: "POST /images/${w1_id}/clear", payload: {}, as: RightsManager }
            - { call: "POST /images", payload: { source_type: "STOCK", agency_name: "StockHouse", base_license_fee_cents: 8000, caption: "Aerial view of the harbor at dusk", credit_line: "StockHouse / StockHouse" }, as: RightsManager, captures: { w2_id: $.data.id } }
            - { call: "POST /images/${w2_id}/clear", payload: {}, as: RightsManager }
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 12000, caption: "Championship celebration on the pitch", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { w3_id: $.data.id } }
            - { call: "POST /images/${w3_id}/clear", payload: {}, as: RightsManager }
            - { call: "POST /images/${w3_id}/archive", payload: {}, as: RightsManager }
          trigger:
            - { call: "GET /images", payload: {}, as: Archivist, captures: { first_id: "$.data[0].id" } }
            - { call: "GET /images", payload: { include_archived: true }, as: Archivist }
            - { call: "GET /images", payload: { source_type: "WIRE" }, as: Archivist }
            - { call: "GET /images", payload: { q: "flood" }, as: Archivist }
            - { call: "GET /images", payload: { limit: 1, offset: 1 }, as: Archivist }
          assert:
            - "default list returns total_count == 2 (ARCHIVED W3 excluded)"
            - "include_archived=true returns total_count == 3"
            - "source_type=WIRE returns total_count == 1 (only W1; W3 archived)"
            - "q=flood returns total_count == 1 and first hit is W1"
            - "limit=1&offset=1 returns 1 item with total_count == 2 and has_more == false"

      - name: include_archived_forbidden_for_photo_editor
        claim_type: conditional_action
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "include_archived=true is restricted to Archivist and RightsManager; a PhotoEditor passing it is rejected with ERR_FORBIDDEN even though PhotoEditor may list images."
        test_recipe:
          setup: ["one CLEARED image exists"]
          setup_api_calls:
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { w_id: $.data.id } }
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager }
          trigger:
            - { call: "GET /images", payload: { include_archived: true }, as: PhotoEditor, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_FORBIDDEN"

      - name: reuse_check_computed_read_blockers_and_quote
        claim_type: computed_read
        grounds: [entities.Image.fields.embargo_until, entities.Image.fields.has_identifiable_people, calculations.license_fee_quote]
        distinguishing_aspect: "The re-use license check aggregates embargo, release, and pricing into one read: before the embargo lifts with no MODEL release it reports eligible=false with both blocking reasons; after a release and a later date it reports eligible=true with the FIRST_USE fee quote 12000."
        test_recipe:
          setup: ["CLEARED WIRE image (base 10000) with has_identifiable_people=true, embargo_until 2026-08-05T00:00:00Z, no releases"]
          setup_api_calls:
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Actor on the gala red carpet", credit_line: "WireCo Staff / WireCo", has_identifiable_people: true, embargo_until: "2026-08-05T00:00:00Z" }, as: RightsManager, captures: { w_id: $.data.id } }
            - { call: "POST /images/${w_id}/clear", payload: {}, as: RightsManager }
          trigger:
            - { call: "GET /images/${w_id}/reuse-check", payload: { channel: "DIGITAL", published_at: "2026-08-03T00:00:00Z" }, as: Archivist, captures: { elig1: $.data.eligible, fee1: $.data.fee_quote_cents, var1: $.data.pricing_variant, rel1: $.data.requires_model_release } }
            - { call: "POST /images/${w_id}/releases", payload: { subject_type: "MODEL", subject_name: "Actor A", document_ref: "doc-123", signed_at: "2026-07-15T00:00:00Z" }, as: RightsManager }
            - { call: "GET /images/${w_id}/reuse-check", payload: { channel: "DIGITAL", published_at: "2026-08-06T00:00:00Z" }, as: Archivist, captures: { elig2: $.data.eligible, fee2: $.data.fee_quote_cents } }
          assert:
            - "captured elig1 == false and blocking_reasons includes ERR_EMBARGO_ACTIVE and ERR_RELEASE_REQUIRED"
            - "captured rel1 == true"
            - "captured fee1 == 12000 and var1 == FIRST_USE (DIGITAL/DOMESTIC/non-exclusive on 10000 base)"
            - "captured elig2 == true and fee2 == 12000 after the MODEL release and embargo-lifted date"

