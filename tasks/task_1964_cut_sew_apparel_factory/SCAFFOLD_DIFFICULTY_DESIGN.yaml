  - rule_id: priority_pair_validation_conflict
    instances:
      - name: marker_approve_state_beats_fiscal
        grounds:
          - validations[priority=4.3]
          - validations[priority=9.1]
          - errors[ERR_MARKER_NOT_DRAFT]
          - errors[ERR_INSUFFICIENT_FABRIC]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: re-approving an already APPROVED
          marker while the roll also lacks yards returns ERR_MARKER_NOT_DRAFT (priority 4.3),
          never ERR_INSUFFICIENT_FABRIC (priority 9.1).
        test_recipe:
          setup:
            - "Roll 41.3yd AVAILABLE; marker m1 (40.0yd) APPROVED against it (roll allocated 41.3, available 0)"
          setup_api_calls:
            - { call: "POST /styles", payload: { style_code: "ST-PV1", base_size: "M", size_run: ["M"], declared_fabric_domestic: true, target_content_claim: "NONE" }, as: Merchandiser, captures: { st: $.data.id } }
            - { call: "POST /production-orders", payload: { style_id: "${st}", color: "navy", size_quantities: [{ size: "M", qty: 100 }] }, as: ProductionPlanner, captures: { po: $.data.id } }
            - { call: "POST /fabric-rolls", payload: { roll_code: "R1", fabric_code: "DEN", origin_country: "US", cost_cents_per_yard: 200, received_yards: 41.3 }, as: MaterialsPlanner, captures: { fr: $.data.id } }
            - { call: "POST /fabric-rolls/${fr}/record-qc", payload: { result: "PASS" }, as: MaterialsPlanner, captures: { fr_v: $.data.version } }
            - { call: "POST /markers", payload: { production_order_id: "${po}", fabric_roll_id: "${fr}", marker_length_yards: 40.0, planned_pieces: 100 }, as: CuttingManager, captures: { mk: $.data.id } }
            - { call: "POST /markers/${mk}/approve", payload: { expected_fabric_roll_version: "${fr_v}" }, as: CuttingManager }
            - { call: "GET /fabric-rolls/${fr}", as: Any, captures: { fr_v2: $.data.version } }
          trigger:
            - { call: "POST /markers/${mk}/approve", payload: { expected_fabric_roll_version: "${fr_v2}" }, as: CuttingManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_MARKER_NOT_DRAFT (state priority 4.3 beats business_fiscal 9.1)"
            - "OCC passed (fresh roll version supplied): the 409 is not ERR_STALE_VERSION"
            - "Marker.${mk} remains APPROVED; roll allocated_yards still 41.3 (no double reservation)"

      - name: plan_claim_safety_beats_pack_referential
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_CONTENT_CLAIM_VIOLATION]
          - errors[ERR_TECH_PACK_NOT_APPROVED]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_referential: planning an order under
          a MADE_IN_USA style with declared_fabric_domestic == false AND a REJECTED (unapproved)
          candidate pack returns ERR_CONTENT_CLAIM_VIOLATION (priority 5), not
          ERR_TECH_PACK_NOT_APPROVED (priority 6).
        test_recipe:
          setup:
            - "Style ST-PV2 target MADE_IN_USA, declared_fabric_domestic false"
            - "Pack v1 with one op, submitted then REJECTED (exists but not APPROVED)"
            - "Order exists (unplanned)"
          setup_api_calls:
            - { call: "POST /styles", payload: { style_code: "ST-PV2", base_size: "M", size_run: ["M"], declared_fabric_domestic: false, target_content_claim: "MADE_IN_USA" }, as: Merchandiser, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /tech-packs", payload: { style_id: "${st}", version_no: 1, base_measurements: [{ point: "chest", base_value_in: 20.0 }], grade_rules: [], labor_cost_cents_per_unit: 800, fabric_cost_cents_per_unit: 500 }, as: Merchandiser, as_user_id: u-m1, captures: { tp: $.data.id } }
            - { call: "POST /operation-specs", payload: { tech_pack_id: "${tp}", sequence_no: 1, name: "join", machine_type: "MANUAL", sam_seconds: 60, piece_rate_cents: 10 }, as: Merchandiser }
            - { call: "POST /tech-packs/${tp}/submit", payload: {}, as: Merchandiser }
            - { call: "POST /tech-packs/${tp}/review", payload: { decision: "REJECT", expected_style_version: "${st_v}" }, as: PlantManager, as_user_id: u-pm1 }
            - { call: "POST /production-orders", payload: { style_id: "${st}", color: "navy", size_quantities: [{ size: "M", qty: 10 }] }, as: ProductionPlanner, captures: { po: $.data.id } }
          trigger:
            - { call: "POST /production-orders/${po}/plan", payload: { tech_pack_id: "${tp}" }, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CONTENT_CLAIM_VIOLATION (business_safety priority 5 beats business_referential priority 6)"
            - "ProductionOrder.${po}.tech_pack_id still null and trim_hold_status == MATERIALS_OK (no pinning happened)"

  - rule_id: boundary_precision_check
    instances:
      - name: aql_accept_at_accept_max_fail_at_reject_min
        grounds:
