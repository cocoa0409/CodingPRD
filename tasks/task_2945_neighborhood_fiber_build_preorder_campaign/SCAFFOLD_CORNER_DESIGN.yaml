            - call: "GET /ledger-entries/00000000-0000-0000-0000-00000000010b"
              payload: {}
              as: ProgramManager
          assert:
            - "every call is HTTP 404"
            - "data.error_id is ERR_SERVICE_ADDRESS_NOT_FOUND, ERR_ACCOUNT_NOT_FOUND, ERR_MDU_AGREEMENT_NOT_FOUND, ERR_PERMIT_APPLICATION_NOT_FOUND, ERR_POLE_REQUEST_NOT_FOUND, ERR_INSTALL_CREW_NOT_FOUND, ERR_INSTALL_APPOINTMENT_NOT_FOUND, ERR_DAMAGE_CLAIM_NOT_FOUND, ERR_FALLBACK_OPTION_NOT_FOUND, ERR_FALLBACK_OFFER_NOT_FOUND and ERR_LEDGER_ENTRY_NOT_FOUND respectively"
            - "each envelope carries success false with a non-empty data.message"

      - name: missing_or_unknown_role_header_is_unauthenticated_and_a_valid_wrong_role_is_forbidden
        claim_type: Violation → Error
        grounds:
          - validations[priority 1 ERR_UNAUTHENTICATED]
          - validations[priority 2 ERR_FORBIDDEN_ROLE]
          - roles
        distinguishing_aspect: "The two auth rules are separated by whether the role name is even real: an absent header, an empty-string header and the invented role SuperAdmin are all 401 ERR_UNAUTHENTICATED, while the genuine but unlisted Subscriber role on POST /campaigns is 403 ERR_FORBIDDEN_ROLE -- and the 401 wins over a 404 for an id that does not exist."
        test_recipe:
          setup:
            - "One campaign to aim the reads at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000 }
              as: ProgramManager
              captures: { camp: $.data.id }
          trigger:
            - call: "GET /campaigns/${camp}"
              payload: {}
              as: "(no X-User-Role header at all)"
            - call: "GET /campaigns/${camp}"
              payload: {}
              as: ""
            - call: "GET /campaigns/${camp}"
              payload: {}
              as: SuperAdmin
            - call: "POST /campaigns"
              payload: { name: "Rogue Campaign", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000 }
              as: Subscriber
            - call: "GET /accounts/00000000-0000-0000-0000-0000000001ff"
              payload: {}
              as: ""
          assert:
            - "the first three calls are HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "an X-User-Role header sent as the empty string is treated as absent, not as a role named empty"
            - "the fourth call is HTTP 403 with data.error_id == ERR_FORBIDDEN_ROLE and no campaign is created"
            - "the fifth call is HTTP 401, not 404 -- authentication at priority 1 precedes existence at priority 3"
            - "GET /campaigns?city=Aurora as ProgramManager still returns total_count 1"

      - name: permit_resubmission_stops_at_the_declared_limit
        claim_type: Violation → Error
        grounds:
          - validations[priority 29 ERR_RESUBMISSION_LIMIT_REACHED]
          - state_machines.PermitApplication.transitions.REJECTED_to_SUBMITTED
          - entities.PermitApplication.fields.submission_round
        distinguishing_aspect: "The counter is off-by-one on purpose: with max_resubmissions 1 the application may be submitted twice in total, so the refusal appears only on the third submit, when submission_round is already 2, and the row stays REJECTED with its rejection_reason intact."
        test_recipe:
          setup:
            - "One campaign and one zone requiring ROW."
            - "One ROW application created with max_resubmissions 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000 }
              as: ProgramManager
              captures: { camp: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 10, required_permit_types: ["ROW"] }
              as: ProgramManager
              captures: { z1: $.data.id }
            - call: "POST /permit-applications"
              payload: { build_zone_id: "${z1}", permit_type: "ROW", valid_days: 120, max_resubmissions: 1 }
              as: ProgramManager
              captures: { pa1: $.data.id }
          trigger:
            - call: "POST /permit-applications/${pa1}/submit"
              payload: {}
              as: ProgramManager
              captures: { round_1: $.data.submission_round }
            - call: "POST /permit-applications/${pa1}/decision"
              payload: { decision: "REJECT", rejection_reason: "Traffic plan incomplete." }
              as: PermitOffice
            - call: "POST /permit-applications/${pa1}/submit"
              payload: {}
              as: ProgramManager
              captures: { round_2: $.data.submission_round, reason_cleared: $.data.rejection_reason }
            - call: "POST /permit-applications/${pa1}/decision"
              payload: { decision: "REJECT", rejection_reason: "Still missing the detour drawing." }
              as: PermitOffice
            - call: "POST /permit-applications/${pa1}/submit"
              payload: {}
              as: ProgramManager
          assert:
            - "${round_1} == 1 and ${round_2} == 2"
            - "${reason_cleared} == null -- resubmitting clears the previous rejection_reason"
            - "the third submit is HTTP 409 with data.error_id == ERR_RESUBMISSION_LIMIT_REACHED"
            - "PermitApplication.${pa1}.status == REJECTED with submission_round 2 and rejection_reason 'Still missing the detour drawing.'"
            - "BuildZone.${z1}.readiness_posture == PERMIT_PENDING throughout"

      - name: answered_or_expired_fallback_offer_rejects_a_response
        claim_type: Violation → Error
        grounds:
          - validations[priority 10 ERR_FALLBACK_OFFER_STATE_INVALID]
          - state_machines.FallbackOffer.status
          - endpoints["POST /fallback-offers/{id}/response"]
        distinguishing_aspect: "Two different non-OFFERED states produce the same refusal through different routes: one offer was actively DECLINED and the other drifted to EXPIRED by the clock alone, and the DECLINE on the first address does not stop the same option being offered at a second address."
        test_recipe:
          setup:
            - "One campaign with a single ENABLED FIXED_WIRELESS option (300 Mbps, 7000 cents, reach 1500 m)."
            - "One zone with two unserved SINGLE_FAMILY addresses, each with a GRANTED exception, and one RESIDENT account."
