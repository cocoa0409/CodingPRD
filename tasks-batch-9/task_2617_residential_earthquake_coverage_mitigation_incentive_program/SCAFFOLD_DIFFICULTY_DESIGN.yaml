  - rule_id: resource_temporal_overlap
    instances:
      - name: contractor_calendar_half_open_windows_widened_60_minutes_on_both_sides
        grounds:
          - validations.ERR_INSPECTION_SLOT_OVERLAP
          - entities.Inspection.fields.window_start
          - entities.Inspection.fields.contractor_id
        distinguishing_aspect: |
          The contractor calendar compares the requested window widened by 60 minutes on BOTH sides
          against existing PENDING windows treated as half-open, so against an existing
          [09:00, 11:00) the request 11:59-12:59 is refused and 12:00-13:00 is accepted, while on the
          early side 07:01-08:01 is refused and 07:00-08:00 is accepted - four probes one minute
          apart that a closed-interval or one-sided-buffer implementation cannot all satisfy.
        test_recipe:
          setup:
            - "One contractor certified for CRIPPLE_WALL_BRACING holding three projects (A, B, C) in AWAITING_INSPECTION, at the 3-project cap"
