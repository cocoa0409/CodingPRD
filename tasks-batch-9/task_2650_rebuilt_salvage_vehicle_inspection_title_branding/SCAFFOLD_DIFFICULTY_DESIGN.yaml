            - "RebuiltApplication.${app_id}.documented_parts_cost_cents == 230000"
            - "230000 equals the sum of amount_cents over the documents still in VERIFIED (200000 + 30000), so the aggregate is exactly reconciled"
            - "RebuiltApplication.${app_id}.documentation_completeness_pct == 66.67"
            - "GET /v1/parts-documents?application_id=${app_id}&status=VERIFIED returns exactly 2 rows"
            - "RebuiltApplication.${app_id}.assessed_fee_cents == 20000 (the STRUCTURAL surcharge survives because the structural document is still VERIFIED)"
            - "RebuiltApplication.${app_id}.status == DRAFT"

