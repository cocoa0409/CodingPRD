  - { method: GET, path: "/f2s/farms", description: "List farms", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: ["status?", "limit?", "offset?"], output: "Farm[]", side_effects: [] }
  - { method: GET, path: "/f2s/farms/{id}", description: "Get farm", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: [], output: Farm, side_effects: [] }
  - { method: POST, path: "/f2s/farms/{id}/approve", description: "APPLIED -> APPROVED (compliance gate)", roles: [DistrictProgramAdmin], code: 200, input: [], output: Farm, side_effects: ["status -> APPROVED"] }
  - { method: POST, path: "/f2s/farms/{id}/suspend", description: "APPROVED -> SUSPENDED with cascade", roles: [DistrictProgramAdmin, StateGrantAuditor], code: 200, input: [], output: Farm, side_effects: ["offerings VERIFIED->SUSPENDED", "agreements ->BREACHED", "SCHEDULED deliveries ->CANCELLED", "DRAFT invoices ->VOIDED"] }
  - { method: POST, path: "/f2s/farms/{id}/reinstate", description: "SUSPENDED -> APPROVED (compliance gate)", roles: [DistrictProgramAdmin], code: 200, input: [], output: Farm, side_effects: ["offerings SUSPENDED->VERIFIED"] }

  # --- ComplianceDocument ---
  - { method: POST, path: "/f2s/compliance-documents", description: "Upload safety cert or insurance policy", roles: [FarmManager], code: 201, input: [farm_id, doc_type, issuer, "coverage_cents?", effective_on, expires_on], output: ComplianceDocument, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/f2s/compliance-documents", description: "List compliance documents", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: ["farm_id?", "doc_type?", "status?", "limit?", "offset?"], output: "ComplianceDocument[]", side_effects: [] }
  - { method: GET, path: "/f2s/compliance-documents/{id}", description: "Get compliance document", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: [], output: ComplianceDocument, side_effects: [] }
  - { method: POST, path: "/f2s/compliance-documents/{id}/revoke", description: "ACTIVE -> REVOKED", roles: [StateGrantAuditor], code: 200, input: [], output: ComplianceDocument, side_effects: ["status -> REVOKED"] }

  # --- Product ---
  - { method: POST, path: "/f2s/products", description: "Create catalog product", roles: [DistrictProgramAdmin], code: 201, input: [name, category, unit, season_start_week, season_end_week], output: Product, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/f2s/products", description: "List products", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: ["category?", "status?", "limit?", "offset?"], output: "Product[]", side_effects: [] }
  - { method: GET, path: "/f2s/products/{id}", description: "Get product", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: [], output: Product, side_effects: [] }
  - { method: POST, path: "/f2s/products/{id}/discontinue", description: "ACTIVE -> DISCONTINUED", roles: [DistrictProgramAdmin], code: 200, input: [], output: Product, side_effects: ["status -> DISCONTINUED"] }

  # --- FarmProductOffering ---
  - { method: POST, path: "/f2s/offerings", description: "Farm offers a product for a program year; eligibility and preference points pinned", roles: [FarmManager], code: 201, input: [farm_id, program_year_id, product_id, price_cents_per_unit, max_weekly_quantity, harvest_start_week, harvest_end_week], output: FarmProductOffering, side_effects: ["is_local_eligible + preference_points computed and pinned", "status=DRAFT"] }
  - { method: GET, path: "/f2s/offerings", description: "List offerings", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: ["farm_id?", "product_id?", "program_year_id?", "status?", "limit?", "offset?"], output: "FarmProductOffering[]", side_effects: [] }
  - { method: GET, path: "/f2s/offerings/{id}", description: "Get offering", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: [], output: FarmProductOffering, side_effects: [] }
  - { method: POST, path: "/f2s/offerings/{id}/submit", description: "DRAFT -> SUBMITTED", roles: [FarmManager], code: 200, input: [], output: FarmProductOffering, side_effects: ["status -> SUBMITTED"] }
  - { method: POST, path: "/f2s/offerings/{id}/verify", description: "SUBMITTED -> VERIFIED (farm compliance gate)", roles: [DistrictProgramAdmin], code: 200, input: [], output: FarmProductOffering, side_effects: ["status -> VERIFIED"] }
  - { method: POST, path: "/f2s/offerings/{id}/reject", description: "SUBMITTED -> REJECTED", roles: [DistrictProgramAdmin], code: 200, input: ["reason?"], output: FarmProductOffering, side_effects: ["status -> REJECTED"] }
  - { method: POST, path: "/f2s/offerings/{id}/withdraw", description: "-> WITHDRAWN (blocked with active agreements)", roles: [FarmManager], code: 200, input: [], output: FarmProductOffering, side_effects: ["status -> WITHDRAWN"] }

  # --- MenuForecastLine ---
  - { method: POST, path: "/f2s/forecast-lines", description: "Create weekly menu forecast line", roles: [DistrictProgramAdmin], code: 201, input: [program_year_id, product_id, week_number, planned_quantity], output: MenuForecastLine, side_effects: ["reserved_quantity/uncovered_quantity computed on read"] }
  - { method: GET, path: "/f2s/forecast-lines", description: "List forecast lines", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: ["program_year_id?", "product_id?", "week_number?", "limit?", "offset?"], output: "MenuForecastLine[]", side_effects: [] }
  - { method: GET, path: "/f2s/forecast-lines/{id}", description: "Get forecast line (with reserved/uncovered)", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: [], output: MenuForecastLine, side_effects: [] }

  # --- Kitchen ---
  - { method: POST, path: "/f2s/kitchens", description: "Create school kitchen", roles: [DistrictProgramAdmin], code: 201, input: [name], output: Kitchen, side_effects: [] }
  - { method: GET, path: "/f2s/kitchens", description: "List kitchens", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: ["limit?", "offset?"], output: "Kitchen[]", side_effects: [] }
  - { method: GET, path: "/f2s/kitchens/{id}", description: "Get kitchen", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: [], output: Kitchen, side_effects: [] }

  # --- ReceivingWindow ---
  - { method: POST, path: "/f2s/receiving-windows", description: "Create weekly receiving window (half-open overlap check)", roles: [KitchenManager], code: 201, input: [kitchen_id, weekday, start_minute, end_minute, capacity_deliveries], output: ReceivingWindow, side_effects: [] }
  - { method: GET, path: "/f2s/receiving-windows", description: "List receiving windows", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: ["kitchen_id?", "weekday?", "limit?", "offset?"], output: "ReceivingWindow[]", side_effects: [] }
  - { method: GET, path: "/f2s/receiving-windows/{id}", description: "Get receiving window", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: [], output: ReceivingWindow, side_effects: [] }
  - { method: DELETE, path: "/f2s/receiving-windows/{id}", description: "Delete window (blocked while in use)", roles: [KitchenManager], code: 204, input: [], output: null, side_effects: [] }

  # --- PlantingAgreement ---
  - { method: POST, path: "/f2s/planting-agreements", description: "District proposes planting agreement against a VERIFIED offering", roles: [DistrictProgramAdmin], code: 201, input: [program_year_id, offering_id, committed_quantity, harvest_start_week, harvest_end_week], output: PlantingAgreement, side_effects: ["unit_price_cents + local_eligible pinned from offering", "status=PROPOSED"] }
  - { method: GET, path: "/f2s/planting-agreements", description: "List planting agreements", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: ["program_year_id?", "offering_id?", "status?", "limit?", "offset?"], output: "PlantingAgreement[]", side_effects: [] }
  - { method: GET, path: "/f2s/planting-agreements/{id}", description: "Get planting agreement", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: [], output: PlantingAgreement, side_effects: [] }
  - { method: POST, path: "/f2s/planting-agreements/{id}/sign", description: "Grower signs: PROPOSED -> SIGNED", roles: [FarmManager], code: 200, input: [], output: PlantingAgreement, side_effects: ["status -> SIGNED", "increments PlantingAgreement.version by 1"] }
  - { method: POST, path: "/f2s/planting-agreements/{id}/cancel", description: "-> CANCELLED (pre-fulfillment only)", roles: [DistrictProgramAdmin, FarmManager], code: 200, input: [], output: PlantingAgreement, side_effects: ["released_quantity = committed - delivered", "remaining_quantity = 0"] }

  # --- AgreementAmendment ---
  - { method: POST, path: "/f2s/planting-agreements/{id}/amendments", description: "Propose amendment (OCC on agreement version; supersedes prior PROPOSED amendment; allowed from SIGNED/AMENDMENT_PROPOSED/FULFILLING)", roles: [FarmManager, DistrictProgramAdmin], code: 201, input: ["new_committed_quantity?", "new_unit_price_cents?", expected_agreement_version], output: AgreementAmendment, side_effects: ["prior PROPOSED amendment -> SUPERSEDED", "agreement -> AMENDMENT_PROPOSED", "increments PlantingAgreement.version by 1"] }
  - { method: GET, path: "/f2s/planting-agreements/{id}/amendments", description: "List amendments of an agreement", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: ["limit?", "offset?"], output: "AgreementAmendment[]", side_effects: [] }
  - { method: GET, path: "/f2s/agreement-amendments/{id}", description: "Get amendment", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: [], output: AgreementAmendment, side_effects: [] }
  - { method: POST, path: "/f2s/agreement-amendments/{id}/accept", description: "Counterparty accepts: terms applied, agreement -> SIGNED", roles: [FarmManager, DistrictProgramAdmin], code: 200, input: [], output: AgreementAmendment, side_effects: ["agreement terms updated", "agreement -> SIGNED", "increments PlantingAgreement.version by 1"] }
  - { method: POST, path: "/f2s/agreement-amendments/{id}/reject", description: "Counterparty rejects: agreement -> SIGNED unchanged", roles: [FarmManager, DistrictProgramAdmin], code: 200, input: [], output: AgreementAmendment, side_effects: ["agreement -> SIGNED"] }

  # --- Delivery ---
  - { method: POST, path: "/f2s/deliveries", description: "Schedule a delivery to a school kitchen window", roles: [FarmManager], code: 201, input: [agreement_id, kitchen_id, window_id, delivery_date, quantity], output: Delivery, side_effects: ["status=SCHEDULED", "week_number computed", "first delivery flips agreement SIGNED -> FULFILLING"] }
  - { method: GET, path: "/f2s/deliveries", description: "List deliveries", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: ["agreement_id?", "kitchen_id?", "window_id?", "status?", "delivery_date?", "limit?", "offset?"], output: "Delivery[]", side_effects: [] }
  - { method: GET, path: "/f2s/deliveries/{id}", description: "Get delivery", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: [], output: Delivery, side_effects: [] }
  - { method: POST, path: "/f2s/deliveries/{id}/check-in", description: "SCHEDULED -> CHECKED_IN", roles: [KitchenManager], code: 200, input: [], output: Delivery, side_effects: ["status -> CHECKED_IN"] }
  - { method: POST, path: "/f2s/deliveries/{id}/accept", description: "CHECKED_IN -> ACCEPTED with accepted_quantity", roles: [KitchenManager], code: 200, input: [accepted_quantity], output: Delivery, side_effects: ["agreement.delivered_quantity recomputed", "agreement -> COMPLETED when delivered == committed"] }
  - { method: POST, path: "/f2s/deliveries/{id}/reject", description: "CHECKED_IN -> REJECTED", roles: [KitchenManager], code: 200, input: [reason], output: Delivery, side_effects: ["status -> REJECTED"] }
  - { method: POST, path: "/f2s/deliveries/{id}/dispute", description: "REJECTED -> DISPUTED", roles: [FarmManager], code: 200, input: [], output: Delivery, side_effects: ["status -> DISPUTED"] }
  - { method: POST, path: "/f2s/deliveries/{id}/resolve-dispute", description: "DISPUTED -> ACCEPTED | CLOSED_REJECTED", roles: [DistrictProgramAdmin], code: 200, input: [resolution, "accepted_quantity?"], output: Delivery, side_effects: ["on ACCEPTED: same side effects as accept"] }
  - { method: POST, path: "/f2s/deliveries/{id}/cancel", description: "SCHEDULED -> CANCELLED", roles: [FarmManager], code: 200, input: [], output: Delivery, side_effects: ["status -> CANCELLED"] }

  # --- Invoice ---
  - { method: POST, path: "/f2s/invoices", description: "Create invoice for an ACCEPTED delivery", roles: [FarmManager], code: 201, input: [delivery_id, invoice_number], output: Invoice, side_effects: ["subtotal/incentive/total computed", "farm_compliant_at_delivery snapshot", "status=DRAFT"] }
  - { method: GET, path: "/f2s/invoices", description: "List invoices", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: ["farm_id?", "delivery_id?", "agreement_id?", "status?", "limit?", "offset?"], output: "Invoice[]", side_effects: [] }
  - { method: GET, path: "/f2s/invoices/{id}", description: "Get invoice", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: POST, path: "/f2s/invoices/{id}/submit", description: "DRAFT -> SUBMITTED", roles: [FarmManager], code: 200, input: [], output: Invoice, side_effects: ["status -> SUBMITTED"] }
  - { method: POST, path: "/f2s/invoices/{id}/approve", description: "SUBMITTED -> APPROVED; captures approver user id", roles: [DistrictProgramAdmin], code: 200, input: [], output: Invoice, side_effects: ["approved_by_user_id set"] }
  - { method: POST, path: "/f2s/invoices/{id}/reject", description: "SUBMITTED -> REJECTED", roles: [DistrictProgramAdmin], code: 200, input: [reason], output: Invoice, side_effects: ["status -> REJECTED"] }
  - { method: POST, path: "/f2s/invoices/{id}/revise", description: "REJECTED -> DRAFT (revision loop)", roles: [FarmManager], code: 200, input: [], output: Invoice, side_effects: ["status -> DRAFT"] }
  - { method: POST, path: "/f2s/invoices/{id}/pay", description: "APPROVED -> PAID; paid_at = logical clock", roles: [DistrictProgramAdmin], code: 200, input: [], output: Invoice, side_effects: ["paid_at set"] }

  # --- ReimbursementClaim / ClaimLine ---
  - { method: POST, path: "/f2s/reimbursement-claims", description: "Create monthly reimbursement claim batch", roles: [ClaimsCoordinator], code: 201, input: [program_year_id, period_month], output: ReimbursementClaim, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/f2s/reimbursement-claims", description: "List claims", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: ["program_year_id?", "status?", "period_month?", "limit?", "offset?"], output: "ReimbursementClaim[]", side_effects: [] }
  - { method: GET, path: "/f2s/reimbursement-claims/{id}", description: "Get claim (with totals and match fields)", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: [], output: ReimbursementClaim, side_effects: [] }
  - { method: POST, path: "/f2s/reimbursement-claims/{id}/lines", description: "Add invoice as claim line (OCC on claim version)", roles: [ClaimsCoordinator], code: 201, input: [invoice_id, expected_claim_version], output: ClaimLine, side_effects: ["claimed_amount_cents snapshot", "claim totals + match_provisional recompute", "increments ReimbursementClaim.version by 1"] }
  - { method: GET, path: "/f2s/claim-lines", description: "List claim lines", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: ["claim_id?", "invoice_id?", "audit_status?", "limit?", "offset?"], output: "ClaimLine[]", side_effects: [] }
  - { method: GET, path: "/f2s/claim-lines/{id}", description: "Get claim line", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: [], output: ClaimLine, side_effects: [] }
  - { method: POST, path: "/f2s/reimbursement-claims/{id}/submit", description: "OPEN -> SUBMITTED (SoD gate)", roles: [ClaimsCoordinator], code: 200, input: [], output: ReimbursementClaim, side_effects: ["submitted_by_user_id set"] }
  - { method: POST, path: "/f2s/reimbursement-claims/{id}/start-review", description: "SUBMITTED -> UNDER_REVIEW", roles: [StateGrantAuditor], code: 200, input: [], output: ReimbursementClaim, side_effects: ["status -> UNDER_REVIEW"] }
  - { method: POST, path: "/f2s/claim-lines/{id}/allow", description: "PENDING -> ALLOWED; may auto-derive claim outcome", roles: [StateGrantAuditor], code: 200, input: [], output: ClaimLine, side_effects: ["claim totals recompute", "claim auto-transition when last PENDING adjudicated"] }
  - { method: POST, path: "/f2s/claim-lines/{id}/disallow", description: "PENDING -> DISALLOWED with amount", roles: [StateGrantAuditor], code: 200, input: [disallowed_amount_cents, reason], output: ClaimLine, side_effects: ["claim totals recompute", "claim auto-transition when last PENDING adjudicated"] }
  - { method: POST, path: "/f2s/reimbursement-claims/{id}/reconcile", description: "AWARDED/PARTIALLY_AWARDED -> RECONCILED; draws grant", roles: [StateGrantAuditor], code: 200, input: [], output: ReimbursementClaim, side_effects: ["program_year.grant_drawn_cents += total_awarded_cents"] }
  - { method: POST, path: "/f2s/reimbursement-claims/{id}/reverse", description: "RECONCILED -> REVERSED; restores grant (compensating action)", roles: [StateGrantAuditor], code: 200, input: [], output: ReimbursementClaim, side_effects: ["program_year.grant_drawn_cents -= total_awarded_cents"] }

  # --- SubstitutionRequest ---
  - { method: POST, path: "/f2s/substitution-requests", description: "Request substitution for an uncovered forecast gap", roles: [DistrictProgramAdmin], code: 201, input: [forecast_line_id, substitute_product_id, quantity, reason], output: SubstitutionRequest, side_effects: ["status=REQUESTED"] }
  - { method: GET, path: "/f2s/substitution-requests", description: "List substitution requests", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: ["forecast_line_id?", "substitute_product_id?", "status?", "limit?", "offset?"], output: "SubstitutionRequest[]", side_effects: [] }
  - { method: GET, path: "/f2s/substitution-requests/{id}", description: "Get substitution request", roles: [DistrictProgramAdmin, FarmManager, KitchenManager, ClaimsCoordinator, StateGrantAuditor], code: 200, input: [], output: SubstitutionRequest, side_effects: [] }
  - { method: POST, path: "/f2s/substitution-requests/{id}/approve", description: "REQUESTED -> APPROVED (cap re-checked)", roles: [StateGrantAuditor], code: 200, input: [], output: SubstitutionRequest, side_effects: ["status -> APPROVED"] }
  - { method: POST, path: "/f2s/substitution-requests/{id}/deny", description: "REQUESTED -> DENIED", roles: [StateGrantAuditor], code: 200, input: [], output: SubstitutionRequest, side_effects: ["status -> DENIED"] }

  # --- Test-driving logical clock ---
  - { method: POST, path: "/f2s/_clock/set_current_utc", description: "Advance the logical clock. Startup default (before any call) is exactly 2026-05-01T00:00:00Z and never falls back to wall-clock. Sweeps on advance: ComplianceDocuments past expires_on -> EXPIRED; SCHEDULED deliveries with delivery_date < current date -> NO_SHOW; agreements in {SIGNED, AMENDMENT_PROPOSED, FULFILLING} with current week > harvest_end_week -> COMPLETED if delivered==committed else BREACHED (pending amendments -> REJECTED first).", roles: [DistrictProgramAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["expiry sweep", "NO_SHOW sweep", "agreement window-close sweep"] }

