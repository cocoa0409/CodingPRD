        grounds:
          - "concurrency_rules[asset-update-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "PATCH carries expected_asset_version; after a successful PATCH bumps the version, a second PATCH replaying the old version is rejected 412 — two strictly sequential requests, each fully complete before the next is sent."
        test_recipe:
          setup: ["AssetClass MACH; asset A-080 in DRAFT"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-080", description: "OCC asset", asset_class_id: "${cls}", acquisition_cost_cents: 500000, cost_center: "CC1", location: "PLANT-1" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { a: $.data.id }
            - call: "GET /fixed-assets/${a}"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { av: $.data.version }
          trigger:
            - call: "PATCH /fixed-assets/${a}"
              payload: { expected_asset_version: "${av}", location: "PLANT-9" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { av_new: $.data.version }
            - call: "PATCH /fixed-assets/${a}"
              payload: { expected_asset_version: "${av}", location: "PLANT-8" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { err: $.data.error_id }
          assert:
            - "first PATCH: 200, location == PLANT-9, version == ${av} + 1"
            - "second PATCH with the stale version: 412 ERR_STALE_VERSION; location remains PLANT-9"

      - name: impairment_confirm_stale_asset_occ
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[impairment-confirm-stale-asset]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "The confirm pins the asset version the recoverable estimate was based on; a depreciation run that posts in between silently advances the asset version, so the confirm built on the pre-run NBV is rejected 412 and must be re-based."
        test_recipe:
          setup: ["Asset A-081 cost 120000 life 12 in service 2026-01-10; OPEN review by u_acct_1; asset version captured; then run 2026-01 posted (bumps version, NBV now 110000)"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-081", description: "OCC review asset", asset_class_id: "${cls}", acquisition_cost_cents: 120000, cost_center: "CC1", location: "PLANT-1", useful_life_months: 12 }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { a: $.data.id }
            - call: "POST /fixed-assets/${a}/place-in-service"
              payload: { in_service_date: "2026-01-10" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /impairment-reviews"
              payload: { asset_id: "${a}", indicator: "MARKET_DECLINE" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { rev: $.data.id }
            - call: "GET /fixed-assets/${a}"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { av: $.data.version }
            - call: "POST /depreciation-runs"
              payload: { period: "2026-01" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { r1: $.data.id }
            - call: "POST /depreciation-runs/${r1}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
          trigger:
            - call: "POST /impairment-reviews/${rev}/confirm"
              payload: { recoverable_value_cents: 0, expected_asset_version: "${av}" }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { err: $.data.error_id }
            - call: "GET /fixed-assets/${a}"
              payload: {}
              as: Controller
              as_user_id: u_ctrl_1
              captures: { av2: $.data.version }
            - call: "POST /impairment-reviews/${rev}/confirm"
              payload: { recoverable_value_cents: 0, expected_asset_version: "${av2}" }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { wd: $.data.write_down_cents }
          assert:
            - "confirm with pre-run version -> 412 ERR_STALE_VERSION; review stays OPEN; impairment_total_cents stays 0"
            - "confirm with the fresh version -> 200 WRITTEN_DOWN, write_down_cents == 110000 (recomputed against the post-run NBV)"

      - name: location_patch_reconciles_mismatch
        claim_type: derived_field_reconciliation
        grounds:
          - "calculations.inventory_line_reconciliation"
          - "entities.FixedAsset.fields.open_inventory_exception"
        distinguishing_aspect: "Patching the asset's location to the counted location re-derives the line to MATCHED and clears the exception — the derived state follows the source field without touching the line directly."
        test_recipe:
          setup: ["Asset A-082 in PLANT-1, IN_SERVICE; run scope ALL; line counted found=true at PLANT-2 -> LOCATION_MISMATCH; run still COUNTING"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-082", description: "Moved asset", asset_class_id: "${cls}", acquisition_cost_cents: 500000, cost_center: "CC1", location: "PLANT-1" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { a: $.data.id }
            - call: "POST /fixed-assets/${a}/place-in-service"
              payload: { in_service_date: "2026-01-10" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /inventory-runs"
              payload: { name: "Move run", scope_type: "ALL" }
              as: InventoryClerk
              as_user_id: u_clerk_1
              captures: { inv: $.data.id }
            - call: "POST /inventory-runs/${inv}/count-lines"
              payload: { asset_id: "${a}", found: true, counted_location: "PLANT-2" }
              as: InventoryClerk
              as_user_id: u_clerk_1
              captures: { st_pre: $.data.reconciliation_status }
            - call: "GET /fixed-assets/${a}"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { av: $.data.version }
          trigger:
            - call: "PATCH /fixed-assets/${a}"
              payload: { expected_asset_version: "${av}", location: "PLANT-2" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /inventory-runs/${inv}/begin-reconciliation"
              payload: {}
              as: InventoryClerk
              as_user_id: u_clerk_1
            - call: "POST /inventory-runs/${inv}/close"
              payload: {}
              as: Controller
              as_user_id: u_ctrl_1
          assert:
            - "before patch: reconciliation_status == LOCATION_MISMATCH and open_inventory_exception == true"
            - "after patch the line re-derives to MATCHED (no direct line write), so begin-reconciliation and close both succeed"
            - "closed run: matched_count == 1; asset open_inventory_exception == false"

      - name: dual_variant_layer_coverage
        claim_type: dual_variant_calculation
        grounds:
          - "complexity_profile.complexity_layers"
        excluded_because:
          difficulty_instance: book_vs_tax_period_amount_divergence
          rationale: "Both variants asserted with literal amounts there and in book_vs_tax_disposal_gain_loss_divergence."

      - name: cascading_layer_coverage
        claim_type: cascading_side_effects
        grounds:
          - "complexity_profile.complexity_layers"
        excluded_because:
          difficulty_instance: disposal_post_component_cascade
          rationale: "3-link disposal cascade and the 3-link impairment cascade (impairment_confirm_three_link_cascade) are covered in §1.8."

      - name: ops_run_checkpoint_layer_coverage
        claim_type: ops_run_checkpoint
        grounds:
          - "complexity_profile.complexity_layers"
        excluded_because:
          difficulty_instance: depreciation_run_period_slot_rules
          rationale: "Epoch advancement, slot exclusivity, and zero-entry posts are asserted there; eligibility expiry at FULLY_DEPRECIATED is asserted in full_depreciation_exact_equality_transition."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_run_post
        claim_type: immediate
        grounds:
          - "complexity_profile.consistency_model"
          - "endpoints[POST /depreciation-runs/{id}/post]"
        distinguishing_aspect: "The post response already carries the run totals, and a GET issued immediately afterwards sees the cascaded asset fields — no eventual-consistency lag."
        test_recipe:
          setup: ["AssetClass MACH; asset A-090 cost 600000 SL/60 in service 2026-01-10; run 2026-01 created"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-090", description: "Immediate read", asset_class_id: "${cls}", acquisition_cost_cents: 600000, cost_center: "CC1", location: "PLANT-1" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { a: $.data.id }
            - call: "POST /fixed-assets/${a}/place-in-service"
              payload: { in_service_date: "2026-01-10" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /depreciation-runs"
              payload: { period: "2026-01" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /depreciation-runs/${r1}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { n: $.data.entries_created_count, tb: $.data.total_book_amount_cents, tt: $.data.total_tax_amount_cents }
            - call: "GET /fixed-assets/${a}"
              payload: {}
              as: Controller
              as_user_id: u_ctrl_1
              captures: { acc_b: $.data.accumulated_book_cents, acc_t: $.data.accumulated_tax_cents }
          assert:
            - "post response: entries_created_count == 2, total_book_amount_cents == 10000, total_tax_amount_cents == 10000 (MACRS-5 year 1: 600000*0.20/12)"
            - "immediate GET: accumulated_book_cents == 10000, accumulated_tax_cents == 10000, net_book_value_cents == 590000"
