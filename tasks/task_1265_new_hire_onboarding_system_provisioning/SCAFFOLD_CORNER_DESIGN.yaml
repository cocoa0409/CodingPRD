# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Enumerative walk of SCAFFOLD.yaml §1.1–§1.7 beyond the nine §0.5 Difficulty Rules.
# Chains reuse the canonical fixture: profile (3 tasks / 2 trainings / Laptop+VPN / probation 90d, ext 1x30d / buddy 2x7d / mgr [1,30] / sla 48h), start_date 2026-05-04, default clock 2026-05-01T00:00:00Z.

scaffold_corner_design:
- section: entities
  instances:
  - name: role_profile_creation_applies_defaults
    claim_type: creation
    grounds:
    - entities.RoleProfile.fields.status
    - entities.RoleProfile.fields.published_version
    distinguishing_aspect: A created RoleProfile starts DRAFT with published_version 0 and version 1; only publish moves it.
    test_recipe:
      setup:
      - No setup
      setup_api_calls: []
      trigger:
      - call: POST /api/role-profiles
        as: HRAdmin
        captures:
          p_status: $.data.status
          p_ver: $.data.published_version
          p_v: $.data.version
        payload:
          name: SE
          preboarding_tasks: &id001
          - task_kind: DOCUMENT_UPLOAD
            title: Government ID
            is_required: true
          - task_kind: FORM_ACK
            title: NDA
            is_required: true
          - task_kind: POLICY_READ
            title: Handbook
            is_required: false
          training_modules: &id002
          - module_code: SEC101
            due_offset_days: 7
          - module_code: HR201
            due_offset_days: 14
          equipment_items: &id003
          - item_name: Laptop
            quantity: 1
          access_grants: &id004
          - system_name: VPN
            permission_level: STANDARD
          probation_days: 90
          max_probation_extensions: 1
          extension_days: 30
          buddy_checkin_interval_days: 7
          buddy_checkin_count: 2
          manager_checkin_offsets_days: &id005
          - 1
          - 30
          provisioning_sla_hours: 48
      assert:
      - response.status == DRAFT
      - response.published_version == 0
      - response.version == 1
      - response.id is a server-minted UUID; created_at/updated_at stamped
  - name: case_creation_generates_children_from_pinned_profile
    claim_type: computed_fields
    grounds:
    - entities.OnboardingCase.fields.pinned_profile_version
    - entities.OnboardingCase.fields.phase
    - entities.OnboardingTask.fields.status
    - entities.CheckIn.fields.scheduled_at
    distinguishing_aspect: Case creation pins published_version == 1 and generates 3 tasks (PENDING), 2 trainings (ASSIGNED, due 2026-05-11T23:59:59Z
      / 2026-05-18T23:59:59Z), 4 check-ins (SCHEDULED at 2026-05-05T09:00:00Z, 2026-06-03T09:00:00Z, 2026-05-05T09:00:00Z, 2026-05-12T09:00:00Z),
      1 probation cycle (ACTIVE, due 2026-08-02T17:00:00Z); phase PRE_BOARDING, health ON_TRACK, health_score 100, version 1.
    test_recipe:
      setup:
      - Profile published; manager/buddy/new hire exist; clock at default 2026-05-01T00:00:00Z
      setup_api_calls:
      - call: POST /api/role-profiles
        as: HRAdmin
        captures:
          p_id: $.data.id
        payload:
          name: SE
          preboarding_tasks: *id001
          training_modules: *id002
          equipment_items: *id003
          access_grants: *id004
          probation_days: 90
          max_probation_extensions: 1
          extension_days: 30
          buddy_checkin_interval_days: 7
          buddy_checkin_count: 2
          manager_checkin_offsets_days: *id005
          provisioning_sla_hours: 48
      - call: POST /api/role-profiles/${p_id}/publish
        as: HRAdmin
      - call: POST /api/employees
        as: HRAdmin
        captures:
          mgr_id: $.data.id
        payload:
          full_name: Mgr
          email: mgr-e2@x.com
      - call: POST /api/employees
        as: HRAdmin
        captures:
          bud_id: $.data.id
        payload:
          full_name: Bud
          email: bud-e2@x.com
      - call: POST /api/new-hires
        as: HRAdmin
        captures:
          nh_id: $.data.id
        payload:
          full_name: NH
          personal_email: nh-e2@x.com
          start_date: '2026-05-04'
          department: Engineering
      trigger:
      - call: POST /api/onboarding-cases
        as: HRAdmin
        captures:
          case_id: $.data.id
          ph: $.data.phase
          ppv: $.data.pinned_profile_version
          hs: $.data.health_score
          hh: $.data.health
          cv: $.data.version
        payload:
          new_hire_id: ${nh_id}
          role_profile_id: ${p_id}
          manager_id: ${mgr_id}
          buddy_id: ${bud_id}
          start_date: '2026-05-04'
          base_salary_cents: 90000
          signing_bonus_cents: 10000
          relocation_stipend_cents: 2500
          benefits_tier: PLUS
      - call: GET /api/onboarding-cases/${case_id}/tasks
        as: HRAdmin
        captures:
          t1_st: $.data[0].status
          t3_req: $.data[2].is_required
      - call: GET /api/onboarding-cases/${case_id}/training-assignments
        as: HRAdmin
        captures:
          tr1_due: $.data[0].due_at
          tr2_due: $.data[1].due_at
      - call: GET /api/onboarding-cases/${case_id}/check-ins
        as: HRAdmin
        captures:
          c1_at: $.data[0].scheduled_at
          c2_at: $.data[1].scheduled_at
          c3_at: $.data[2].scheduled_at
          c4_at: $.data[3].scheduled_at
      - call: GET /api/onboarding-cases/${case_id}/probation-cycles
        as: HRAdmin
        captures:
          cy_st: $.data[0].status
          cy_due: $.data[0].evaluation_due_at
      assert:
      - case.phase == PRE_BOARDING and health == ON_TRACK and health_score == 100 and version == 1
      - case.pinned_profile_version == 1 (pinned at creation)
      - tasks[0].status == PENDING; tasks[2].is_required == false (Handbook optional)
      - trainings[0].due_at == 2026-05-11T23:59:59Z and trainings[1].due_at == 2026-05-18T23:59:59Z
      - check-ins scheduled_at == [2026-05-05T09:00:00Z, 2026-06-03T09:00:00Z, 2026-05-05T09:00:00Z, 2026-05-12T09:00:00Z] (MANAGER offsets ASC
        first, then BUDDY date ASC)
      - probation-cycles[0].status == ACTIVE and evaluation_due_at == 2026-08-02T17:00:00Z (start + 90 days)
  - name: case_create_extra_field_input_ignored
    claim_type: system_fields
    grounds:
    - entities.OnboardingCase.fields.phase
    - entities.OnboardingCase.fields.health_score
    distinguishing_aspect: 'Client-supplied system/computed fields (phase, health_score) in the create body are ignored: the response shows phase
      PRE_BOARDING and health_score 100 regardless of injected values.'
    test_recipe:
      setup:
      - Profile published; employees and new hire exist
      setup_api_calls:
      - call: POST /api/role-profiles
        as: HRAdmin
        captures:
          p_id: $.data.id
        payload:
          name: SE
          preboarding_tasks: *id001
          training_modules: *id002
          equipment_items: *id003
          access_grants: *id004
          probation_days: 90
          max_probation_extensions: 1
          extension_days: 30
          buddy_checkin_interval_days: 7
          buddy_checkin_count: 2
          manager_checkin_offsets_days: *id005
          provisioning_sla_hours: 48
      - call: POST /api/role-profiles/${p_id}/publish
        as: HRAdmin
      - call: POST /api/employees
        as: HRAdmin
        captures:
          mgr_id: $.data.id
        payload:
          full_name: Mgr
          email: mgr-e3@x.com
      - call: POST /api/employees
        as: HRAdmin
        captures:
          bud_id: $.data.id
        payload:
          full_name: Bud
          email: bud-e3@x.com
      - call: POST /api/new-hires
        as: HRAdmin
        captures:
          nh_id: $.data.id
        payload:
          full_name: NH
          personal_email: nh-e3@x.com
          start_date: '2026-05-04'
          department: Engineering
      trigger:
      - call: POST /api/onboarding-cases
        as: HRAdmin
        captures:
          ph: $.data.phase
          hs: $.data.health_score
        payload:
          new_hire_id: ${nh_id}
          role_profile_id: ${p_id}
          manager_id: ${mgr_id}
          buddy_id: ${bud_id}
          start_date: '2026-05-04'
          base_salary_cents: 90000
          benefits_tier: PLUS
          phase: COMPLETED
          health_score: 5
      assert:
      - response.phase == PRE_BOARDING (client-injected COMPLETED ignored)
      - response.health_score == 100 (client-injected 5 ignored)
  - name: summary_computed_read_fresh_case
    claim_type: computed_fields
    grounds:
    - entities.OnboardingCase.fields.health_score
    - calculations.time_to_productivity
    distinguishing_aspect: 'On a fresh PRE_BOARDING case the computed summary reads: health_score 100, health ON_TRACK, estimated_ttp_days ==
      30 (base max(14,30), no slips), actual_ttp_days == null, open_handoff_count == 0.'
    test_recipe:
      setup:
      - Case created, still PRE_BOARDING
      setup_api_calls:
      - call: POST /api/role-profiles
        as: HRAdmin
        captures:
          p_id: $.data.id
        payload:
          name: SE
          preboarding_tasks: *id001
          training_modules: *id002
          equipment_items: *id003
          access_grants: *id004
          probation_days: 90
          max_probation_extensions: 1
          extension_days: 30
          buddy_checkin_interval_days: 7
          buddy_checkin_count: 2
          manager_checkin_offsets_days: *id005
          provisioning_sla_hours: 48
      - call: POST /api/role-profiles/${p_id}/publish
        as: HRAdmin
      - call: POST /api/employees
        as: HRAdmin
        captures:
          mgr_id: $.data.id
        payload:
          full_name: Mgr
          email: mgr-e4@x.com
      - call: POST /api/employees
        as: HRAdmin
        captures:
          bud_id: $.data.id
        payload:
          full_name: Bud
          email: bud-e4@x.com
          manager_id: ${mgr_id}
      - call: POST /api/new-hires
        as: HRAdmin
        captures:
          nh_id: $.data.id
        payload:
          full_name: NH
          personal_email: nh-e4@x.com
          start_date: '2026-05-04'
          department: Engineering
      - call: POST /api/onboarding-cases
        as: HRAdmin
        captures:
          case_id: $.data.id
        payload:
          new_hire_id: ${nh_id}
          role_profile_id: ${p_id}
          manager_id: ${mgr_id}
          buddy_id: ${bud_id}
          start_date: '2026-05-04'
          base_salary_cents: 90000
          signing_bonus_cents: 10000
          relocation_stipend_cents: 2500
          benefits_tier: PLUS
      trigger:
      - call: GET /api/onboarding-cases/${case_id}/summary
        as: HRAdmin
        captures:
          hs: $.data.health_score
          hh: $.data.health
          ph: $.data.phase
          est: $.data.estimated_ttp_days
          act: $.data.actual_ttp_days
          oh: $.data.open_handoff_count
      assert:
      - summary.health_score == 100 and health == ON_TRACK and phase == PRE_BOARDING
      - summary.estimated_ttp_days == 30
      - summary.actual_ttp_days == null (ACTUAL variant gated on all trainings + MANAGER check-ins COMPLETED)
      - summary.open_handoff_count == 0
  - name: profile_republish_pins_new_cases_only
    claim_type: computed_fields
    grounds:
    - entities.OnboardingCase.fields.pinned_profile_version
    - entities.RoleProfile.fields.published_version
    - state_machines.RoleProfile.PUBLISHED_to_PUBLISHED
    distinguishing_aspect: 'Version pinning: after PUT + re-publish bumps the profile to published_version 2 (probation_days 60), a new case pins
      2 (due 2026-07-03T17:00:00Z) while the older case keeps pinned_profile_version 1 (due 2026-08-02T17:00:00Z).'
    test_recipe:
      setup:
      - Profile published (v1); case A created against v1
      setup_api_calls:
      - call: POST /api/role-profiles
        as: HRAdmin
        captures:
          p_id: $.data.id
        payload:
          name: SE
          preboarding_tasks: *id001
          training_modules: *id002
          equipment_items: *id003
          access_grants: *id004
          probation_days: 90
          max_probation_extensions: 1
          extension_days: 30
          buddy_checkin_interval_days: 7
          buddy_checkin_count: 2
          manager_checkin_offsets_days: *id005
          provisioning_sla_hours: 48
      - call: POST /api/role-profiles/${p_id}/publish
        as: HRAdmin
      - call: POST /api/employees
        as: HRAdmin
        captures:
          mgr_id: $.data.id
        payload:
          full_name: Mgr
          email: mgr-e5@x.com
      - call: POST /api/employees
        as: HRAdmin
        captures:
          bud_id: $.data.id
        payload:
          full_name: Bud
          email: bud-e5@x.com
      - call: POST /api/new-hires
        as: HRAdmin
        captures:
          nh_a: $.data.id
        payload:
          full_name: NHA
          personal_email: nh-e5a@x.com
          start_date: '2026-05-04'
          department: Engineering
      - call: POST /api/onboarding-cases
        as: HRAdmin
        captures:
          case_a: $.data.id
        payload:
          new_hire_id: ${nh_a}
          role_profile_id: ${p_id}
          manager_id: ${mgr_id}
          buddy_id: ${bud_id}
          start_date: '2026-05-04'
          base_salary_cents: 90000
          benefits_tier: STANDARD
      - call: PUT /api/role-profiles/${p_id}
        as: HRAdmin
        payload:
          probation_days: 60
      - call: POST /api/role-profiles/${p_id}/publish
        as: HRAdmin
        captures:
          pv2: $.data.published_version
      - call: POST /api/new-hires
        as: HRAdmin
        captures:
          nh_b: $.data.id
        payload:
          full_name: NHB
          personal_email: nh-e5b@x.com
          start_date: '2026-05-04'
          department: Engineering
      trigger:
      - call: POST /api/onboarding-cases
        as: HRAdmin
        captures:
          case_b: $.data.id
          ppv_b: $.data.pinned_profile_version
        payload:
          new_hire_id: ${nh_b}
          role_profile_id: ${p_id}
          manager_id: ${mgr_id}
          buddy_id: ${bud_id}
          start_date: '2026-05-04'
          base_salary_cents: 90000
          benefits_tier: STANDARD
      - call: GET /api/onboarding-cases/${case_a}/probation-cycles
        as: HRAdmin
        captures:
          due_a: $.data[0].evaluation_due_at
      - call: GET /api/onboarding-cases/${case_b}/probation-cycles
        as: HRAdmin
        captures:
          due_b: $.data[0].evaluation_due_at
      assert:
      - profile.published_version == 2 after re-publish
      - case B pinned_profile_version == 2 (pins current version at creation)
      - case A cycle evaluation_due_at == 2026-08-02T17:00:00Z (90 days, v1 content preserved)
      - case B cycle evaluation_due_at == 2026-07-03T17:00:00Z (60 days, v2 content)
  - name: employees_list_filter_by_manager_self_reference
    claim_type: listing
    grounds:
    - entities.Employee.fields.manager_id
    distinguishing_aspect: 'The self-referential Employee.manager_id FK is queryable: filtering by manager_id returns exactly the 2 direct reports
      out of 3 employees.'
    test_recipe:
      setup:
      - One manager and three employees exist; two report to the manager
      setup_api_calls:
      - call: POST /api/employees
        as: HRAdmin
        captures:
          top_id: $.data.id
        payload:
          full_name: Top
          email: top-e6@x.com
      - call: POST /api/employees
        as: HRAdmin
        payload:
          full_name: R1
          email: r1-e6@x.com
          manager_id: ${top_id}
      - call: POST /api/employees
        as: HRAdmin
        payload:
          full_name: R2
          email: r2-e6@x.com
          manager_id: ${top_id}
      - call: POST /api/employees
        as: HRAdmin
        payload:
          full_name: Other
          email: other-e6@x.com
      trigger:
      - call: GET /api/employees
        as: HRAdmin
        captures:
          first_id: $.data[0].id
        payload:
          manager_id: ${top_id}
      assert:
      - GET /api/employees?manager_id=${top_id} returns exactly 2 entries, each with manager_id == ${top_id}
      - envelope carries total_count == 2 and has_more == false
- section: state_machines
  instances:
  - name: task_rework_and_health_cycles
    claim_type: valid_transition
    grounds:
    - state_machines.OnboardingTask.REJECTED_to_SUBMITTED
    - state_machines.OnboardingCase.AT_RISK_to_ON_TRACK
    excluded_because:
      difficulty_instance: task_rework_cycle_submit_reject_resubmit
      rationale: Cyclic transitions for both entities are asserted by the named §1.8 instance and case_health_dimension_cycles_with_training_recovery.
  - name: task_review_of_pending_task_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.OnboardingTask.transitions
    - errors[ERR_INVALID_TASK_STATE]
    distinguishing_aspect: 'Review requires SUBMITTED: reviewing a still-PENDING task is rejected with ERR_INVALID_TASK_STATE and the task stays
      PENDING.'
    test_recipe:
      setup:
      - Case PRE_BOARDING; task t1 PENDING
      setup_api_calls:
      - call: POST /api/role-profiles
        as: HRAdmin
        captures:
          p_id: $.data.id
        payload:
          name: SE
          preboarding_tasks: *id001
          training_modules: *id002
          equipment_items: *id003
          access_grants: *id004
          probation_days: 90
          max_probation_extensions: 1
          extension_days: 30
          buddy_checkin_interval_days: 7
          buddy_checkin_count: 2
          manager_checkin_offsets_days: *id005
          provisioning_sla_hours: 48
      - call: POST /api/role-profiles/${p_id}/publish
        as: HRAdmin
      - call: POST /api/employees
        as: HRAdmin
        captures:
          mgr_id: $.data.id
        payload:
          full_name: Mgr
          email: mgr-s2@x.com
      - call: POST /api/employees
        as: HRAdmin
        captures:
          bud_id: $.data.id
        payload:
          full_name: Bud
          email: bud-s2@x.com
          manager_id: ${mgr_id}
      - call: POST /api/new-hires
        as: HRAdmin
        captures:
          nh_id: $.data.id
        payload:
          full_name: NH
          personal_email: nh-s2@x.com
          start_date: '2026-05-04'
          department: Engineering
      - call: POST /api/onboarding-cases
        as: HRAdmin
        captures:
          case_id: $.data.id
        payload:
          new_hire_id: ${nh_id}
          role_profile_id: ${p_id}
          manager_id: ${mgr_id}
          buddy_id: ${bud_id}
          start_date: '2026-05-04'
          base_salary_cents: 90000
          signing_bonus_cents: 10000
          relocation_stipend_cents: 2500
          benefits_tier: PLUS
      - call: GET /api/onboarding-cases/${case_id}/tasks
        as: HRAdmin
        captures:
          t1: $.data[0].id
      trigger:
      - call: POST /api/onboarding-tasks/${t1}/review
        as: HRAdmin
        captures:
          err: $.data.error_id
        payload:
          decision: APPROVE
      - call: GET /api/onboarding-cases/${case_id}/tasks
        as: HRAdmin
        captures:
          t1_st: $.data[0].status
      assert:
      - error_id == ERR_INVALID_TASK_STATE
      - tasks[0].status == PENDING (unchanged)
  - name: terminal_case_lockdown_blocks_further_transitions
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.OnboardingCase.transitions
    - errors[ERR_CASE_TERMINAL]
    distinguishing_aspect: After withdraw (WITHDRAWN terminal), submit-for-clearance is rejected with ERR_CASE_TERMINAL, and a task CANCELLED
      by the cascade rejects submit with ERR_INVALID_TASK_STATE.
    test_recipe:
      setup:
      - Case PRE_BOARDING
      setup_api_calls:
      - call: POST /api/role-profiles
        as: HRAdmin
        captures:
          p_id: $.data.id
        payload:
          name: SE
          preboarding_tasks: *id001
          training_modules: *id002
          equipment_items: *id003
          access_grants: *id004
          probation_days: 90
          max_probation_extensions: 1
          extension_days: 30
          buddy_checkin_interval_days: 7
          buddy_checkin_count: 2
          manager_checkin_offsets_days: *id005
          provisioning_sla_hours: 48
      - call: POST /api/role-profiles/${p_id}/publish
        as: HRAdmin
      - call: POST /api/employees
        as: HRAdmin
        captures:
          mgr_id: $.data.id
        payload:
          full_name: Mgr
          email: mgr-s3@x.com
      - call: POST /api/employees
        as: HRAdmin
        captures:
          bud_id: $.data.id
        payload:
          full_name: Bud
          email: bud-s3@x.com
          manager_id: ${mgr_id}
      - call: POST /api/new-hires
        as: HRAdmin
        captures:
          nh_id: $.data.id
        payload:
          full_name: NH
          personal_email: nh-s3@x.com
          start_date: '2026-05-04'
          department: Engineering
      - call: POST /api/onboarding-cases
        as: HRAdmin
        captures:
          case_id: $.data.id
        payload:
          new_hire_id: ${nh_id}
          role_profile_id: ${p_id}
          manager_id: ${mgr_id}
          buddy_id: ${bud_id}
          start_date: '2026-05-04'
          base_salary_cents: 90000
          signing_bonus_cents: 10000
          relocation_stipend_cents: 2500
          benefits_tier: PLUS
      trigger:
      - call: POST /api/onboarding-cases/${case_id}/withdraw
        as: HRAdmin
        captures:
          ph: $.data.phase
      - call: POST /api/onboarding-cases/${case_id}/submit-for-clearance
        as: HRAdmin
        as_user_id: hr-1
        captures:
          err: $.data.error_id
      - call: GET /api/onboarding-cases/${case_id}/tasks
        as: HRAdmin
        captures:
          t1: $.data[0].id
          t1_st: $.data[0].status
      - call: POST /api/onboarding-tasks/${t1}/submit
        as: NewHire
        as_user_id: ${nh_id}
        captures:
          err2: $.data.error_id
        payload:
          document_ref: doc://x
      assert:
      - withdraw response phase == WITHDRAWN
      - submit-for-clearance on WITHDRAWN case -> error_id == ERR_CASE_TERMINAL
      - tasks[0].status == CANCELLED (cascade) and its submit -> error_id == ERR_INVALID_TASK_STATE
  - name: order_compound_status_bubbles_from_items
    claim_type: side_effect_execution
    grounds:
    - state_machines.ProvisioningOrder.transitions
    - state_machines.ProvisioningItem.transitions
    - calculations.case_health_score
    distinguishing_aspect: 'Compound order status derives from items: first item start flips SUBMITTED -> IN_PROGRESS; a BLOCKED item flips ATTENTION_REQUIRED
      and drops case health_score to 80; retry restores IN_PROGRESS and 100; all-DONE flips FULFILLED.'
    test_recipe:
      setup:
      - Case PROVISIONING; order has items i1 (Laptop), i2 (VPN)
      setup_api_calls:
      - call: POST /api/role-profiles
