            - "no ComplianceNotice row exists on the folio after the refusals: GET /flood-zone/compliance-notices?loan_folio_id=${f_a_id} returns total_count == 0 and open_notice_count == 0"

  # ===========================================================================
  - section: rbac
    instances:
      - name: corner_panel_lifecycle_is_exclusive_to_the_agency
        claim_type: exclusive_operations
        grounds:
          - rbac.AgencyOfficer.exclusive_operations
          - endpoints.POST_/flood-zone/map-panels/{map_panel_id}/appeal-period
        distinguishing_aspect: "Map authorship is the agency's exclusive province end to end: all four panel-lifecycle writes are refused to both provider roles and to both loan-side roles, and the refusal is by endpoint, not by entity - the same provider roles may read every panel."
        test_recipe:
          setup:
            - "FL community with panel seq 1 EFFECTIVE and panel seq 2 PRELIMINARY"
          setup_api_calls:
