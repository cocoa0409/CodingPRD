              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION and http status == 412 (OCC fires before any fiscal check; periods do not overlap)"
            - "only Invoice.${inv1} exists for the work package"

  # ------------------------------------------------------------------
  # Section: consistency_model
  # ------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: receipt_response_reflects_on_hand_immediately
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model, calculations.material_reconciliation]
        distinguishing_aspect: "Immediate consistency: the POST /stock-items/{id}/receipts response itself shows the updated on_hand (0 + 100 == 100) without any re-read or delay."
        test_recipe:
          setup: ["Contract exists; stock item with initial_on_hand 0"]
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "CM-1", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/stock-items"
              payload: { material_code: "MAT-C", description: "Cons stock", uom: "EACH", initial_on_hand: 0 }
              as: UTILITY_DISPATCHER
              captures: { stock_id: $.data.id }
          trigger:
            - call: "POST /stock-items/${stock_id}/receipts"
              payload: { quantity: 100 }
              as: UTILITY_DISPATCHER
              captures: { oh: $.data.on_hand, ver: $.data.version }
          assert:
            - "receipt response data.on_hand == 100 in the same request (no re-read needed)"
            - "StockItem.${stock_id}.version incremented by exactly 1"
