  # ===================================================================
  # Rule 9 — compensating-action invariants across different conserved quantities
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: bond_money_conservation_on_release
        grounds:
          - calculations.bond_refund
          - entities.RestorationBond.fields.held_cents
          - entities.RestorationBond.fields.refunded_cents
          - entities.RestorationBond.fields.forfeited_cents
          - state_machines.RestorationBond.POSTED_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity = money: held_cents + refunded_cents + forfeited_cents == posted_cents
          (80000) after release, with the 55000 refund and 25000 forfeit splitting exactly.
        test_recipe:
          setup:
            - "Issued permit with 80000 bond; closure activated, restoration requested (est 10000), signed off PASS (assessed 25000)."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Acme", license_number: "L1", contact_email: "a@x.com" }
              as: PlatformAdmin
