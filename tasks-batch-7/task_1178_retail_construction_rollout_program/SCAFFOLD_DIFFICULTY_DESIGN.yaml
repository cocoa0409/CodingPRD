            - "Permit.${perm}.fee_cents == 30000 after refile"
            - "Permit.${perm}.status == FILED immediately after refile"
            - "Permit.${perm}.status == ISSUED after second review"
            - "Site.${site}.permit_fees_paid_cents == 90000"

