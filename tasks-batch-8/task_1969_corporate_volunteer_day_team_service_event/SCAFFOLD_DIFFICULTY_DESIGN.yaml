      - name: supervision_ratio_eight_adult_boundary_lock
        grounds:
          - calculations.supervision_requirement
          - errors[ERR_INSUFFICIENT_SUPERVISION]
          - state_machines.ServiceProject.MATCHED_to_LOCKED
        distinguishing_aspect: |
          Boundary metric = supervision headcount ratio, reached via POST /service-projects/{id}/lock:
          exactly 8 confirmed adults need exactly ceil(8/8)=1 lead — lock SUCCEEDS; the 9th
          confirmation pushes required to ceil(9/8)=2 > 1 active lead, demoting the project, and
          a fresh lock is REJECTED with ERR_INSUFFICIENT_SUPERVISION. 8 is allowed, 9 is not.
