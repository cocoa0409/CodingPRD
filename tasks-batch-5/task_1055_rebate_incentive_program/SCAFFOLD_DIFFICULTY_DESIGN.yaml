  - rule_id: boundary_precision_check
    instances:
      - name: budget_gate_accepts_final_equal_to_available_and_locks_at_exactly_one
        grounds:
          - "calculations.program_budget_position"
          - "validations[priority=50]"
          - "errors[ERR_BUDGET_EXCEEDED]"
          - "state_machines.Program.ACTIVE_to_BUDGET_LOCKED"
          - "concurrency_rules[budget-adjust-stale-program]"
        distinguishing_aspect: |
          Numeric-threshold boundary on the money metric, reached through POST /api/claims/{id}/approve:
          final 100000 against available 50000 is rejected, and after a +50000 budget adjustment the
          same claim with final exactly equal to available 100000 is accepted, driving utilization_pct
          to exactly 1.0000 and locking the program (the gate is >=, not >).
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z."
