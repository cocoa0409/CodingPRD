              payload: { lot_code: "LOT-K", received_qty: 4, unit_cost_cents: 20, received_at: "2026-01-02T00:00:00.000Z", expected_avl_entry_version: "${avl_v}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /boms"
              payload: { product_code: "BRD-12", revision: "A" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { bom_id: $.data.id }
            - call: "POST /boms/${bom_id}/lines"
              payload: { part_id: "${part_id}", ref_designators: ["R1","R2"], qty_per_assembly: 2 }
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /boms/${bom_id}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /work-orders"
              payload: { bom_id: "${bom_id}", planned_qty: 2 }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/kit"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { shortage: $.data.kit_shortage_count }
          assert:
            - "WorkOrder.${wo_id}.kit_shortage_count == 0"
            - "WorkOrder.${wo_id}.status == KITTED"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: workorder_setup_requires_verified_lineprogram
        grounds:
          - state_machines.WorkOrder.KITTED_to_SETUP
          - validations[priority=13]
          - entities.LineProgram.fields.status
        distinguishing_aspect: |
          Entity pair WorkOrder->LineProgram: a WorkOrder's KITTED->SETUP transition
          is valid only when the referenced LineProgram.status == VERIFIED. An
          UNVERIFIED program rejects with ERR_PROGRAM_NOT_READY though the WO itself
          is in a valid KITTED state.
        test_recipe:
          setup:
            - "A KITTED WorkOrder; a LineProgram targeting its BOM but still UNVERIFIED."
          setup_api_calls:
            - call: "POST /parts"
              payload: { internal_pn: "P-LP", description: "res", package_type: "0402", standard_cost_cents: 20, is_rohs_required: false, contains_conflict_minerals: false }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { part_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Vendor L", cage_code: "2LMN3" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { vendor_id: $.data.id }
            - call: "POST /avl-entries"
              payload: { part_id: "${part_id}", vendor_id: "${vendor_id}", vendor_pn: "VL-R", approval_rank: 1 }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { avl_id: $.data.id, avl_v: $.data.version }
            - call: "POST /avl-entries/${avl_id}/receive-lot"
              payload: { lot_code: "LOT-L", received_qty: 10, unit_cost_cents: 20, received_at: "2026-01-02T00:00:00.000Z", expected_avl_entry_version: "${avl_v}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /boms"
              payload: { product_code: "BRD-13", revision: "A" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { bom_id: $.data.id }
            - call: "POST /boms/${bom_id}/lines"
              payload: { part_id: "${part_id}", ref_designators: ["R1"], qty_per_assembly: 1 }
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /boms/${bom_id}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /line-programs"
              payload: { bom_id: "${bom_id}", line_code: "LINE-A", feeder_slot_count: 2, program_checksum: "CK13" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { prog_id: $.data.id }
            - call: "POST /work-orders"
              payload: { bom_id: "${bom_id}", planned_qty: 1 }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/kit"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
          trigger:
            - call: "POST /work-orders/${wo_id}/setup"
              payload: { line_program_id: "${prog_id}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PROGRAM_NOT_READY"
            - "WorkOrder.${wo_id}.status == KITTED"

      - name: rma_open_requires_unit_shipped
        grounds:
          - validations[priority=14]
          - entities.Unit.fields.disposition
          - entities.Rma.fields.unit_id
        distinguishing_aspect: |
          A different entity pair Rma->Unit: opening an RMA via POST /rmas is valid
          only when the target Unit.disposition == SHIPPED. A unit still IN_PROCESS
          rejects with ERR_UNIT_NOT_SHIPPED, distinct from the WorkOrder->LineProgram
          dependency above.
        test_recipe:
          setup:
            - "A PASS unit on an AT_TEST/PASSED WorkOrder that has NOT been shipped (disposition still IN_PROCESS)."
          setup_api_calls:
            - call: "POST /parts"
              payload: { internal_pn: "P-RMA", description: "res", package_type: "0402", standard_cost_cents: 20, is_rohs_required: false, contains_conflict_minerals: false }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { part_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Vendor M", cage_code: "3MNO4" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { vendor_id: $.data.id }
            - call: "POST /avl-entries"
              payload: { part_id: "${part_id}", vendor_id: "${vendor_id}", vendor_pn: "VM-R", approval_rank: 1 }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { avl_id: $.data.id, avl_v: $.data.version }
            - call: "POST /avl-entries/${avl_id}/receive-lot"
              payload: { lot_code: "LOT-M", received_qty: 10, unit_cost_cents: 20, received_at: "2026-01-02T00:00:00.000Z", expected_avl_entry_version: "${avl_v}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /boms"
              payload: { product_code: "BRD-14", revision: "A" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { bom_id: $.data.id }
            - call: "POST /boms/${bom_id}/lines"
              payload: { part_id: "${part_id}", ref_designators: ["R1"], qty_per_assembly: 1 }
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /boms/${bom_id}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /line-programs"
              payload: { bom_id: "${bom_id}", line_code: "LINE-A", feeder_slot_count: 2, program_checksum: "CK14" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { prog_id: $.data.id }
            - call: "POST /line-programs/${prog_id}/verify"
              payload: {}
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /work-orders"
              payload: { bom_id: "${bom_id}", planned_qty: 1 }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/kit"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /work-orders/${wo_id}/setup"
              payload: { line_program_id: "${prog_id}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /work-orders/${wo_id}/units"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/test-result"
              payload: { result: "PASS" }
              as: QualityEngineer
              as_user_id: "qe-1"
          trigger:
            - call: "POST /rmas"
              payload: { unit_id: "${unit_id}", reported_defect_code: "FIELD-X" }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNIT_NOT_SHIPPED"
            - "Unit.${unit_id}.disposition == IN_PROCESS"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: lot_code_uniqueness_within_part_collision
        grounds:
          - entities.InventoryLot.fields.lot_code
          - state_machines.AvlEntry.APPROVED_to_REVOKED
          - validations[priority=16]
        distinguishing_aspect: |
          Identity-interval semantics on the InventoryLot resource: lot_code occupies
          a one-point uniqueness interval within a part. Receiving a second lot with a
          lot_code already taken for that part collides and is rejected with
          ERR_VALIDATION; the interval treatment is exact equality (point overlap).
        test_recipe:
          setup:
            - "A part with one AVAILABLE lot LOT-DUP received against its approved AVL entry."
          setup_api_calls:
            - call: "POST /parts"
              payload: { internal_pn: "P-DUP", description: "res", package_type: "0402", standard_cost_cents: 20, is_rohs_required: false, contains_conflict_minerals: false }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { part_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Vendor N", cage_code: "4NOP5" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { vendor_id: $.data.id }
            - call: "POST /avl-entries"
              payload: { part_id: "${part_id}", vendor_id: "${vendor_id}", vendor_pn: "VN-R", approval_rank: 1 }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { avl_id: $.data.id, avl_v0: $.data.version }
            - call: "POST /avl-entries/${avl_id}/receive-lot"
              payload: { lot_code: "LOT-DUP", received_qty: 10, unit_cost_cents: 20, received_at: "2026-01-02T00:00:00.000Z", expected_avl_entry_version: "${avl_v0}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { avl_v1: $.data.version }
          trigger:
            - call: "POST /avl-entries/${avl_id}/receive-lot"
              payload: { lot_code: "LOT-DUP", received_qty: 5, unit_cost_cents: 20, received_at: "2026-01-03T00:00:00.000Z", expected_avl_entry_version: "${avl_v1}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

      - name: bom_revision_uniqueness_within_product_collision
        grounds:
          - entities.Bom.fields.revision
          - state_machines.Bom.DRAFT_to_RELEASED
          - validations[priority=16]
        distinguishing_aspect: |
          A different resource (Bom) with a different interval semantics: revision is
          unique within product_code, an aggregate two-key occupancy (product_code,
          revision). A second BOM with the same (product_code, revision) pair collides
          even with a distinct supersedes chain, unlike the single-key lot_code point
          overlap.
        test_recipe:
          setup:
            - "A BOM for product BRD-15 revision A already created."
          setup_api_calls:
            - call: "POST /boms"
              payload: { product_code: "BRD-15", revision: "A" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { bom_a_id: $.data.id }
          trigger:
            - call: "POST /boms"
              payload: { product_code: "BRD-15", revision: "A" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: kit_then_cancel_conserves_part_available_qty
        grounds:
          - state_machines.WorkOrder.PLANNED_to_KITTED
          - state_machines.WorkOrder.KITTED_to_CANCELLED
          - entities.Part.fields.available_qty
          - entities.KitRequirement.fields.reserved_qty
        distinguishing_aspect: |
          Conserved quantity #1 = Part.available_qty. The forward action (kit reserves
          4 from a lot of 10 -> available 6) paired with its compensating action
          (cancel releases the reservation) MUST restore Part.available_qty to its
          pre-kit value of 10 exactly: available_qty_after_cancel ==
          available_qty_before_kit, with no drift.
        test_recipe:
          setup:
            - "Part with one AVAILABLE lot qty 10 (available_qty 10); RELEASED BOM line qty_per_assembly 2; WorkOrder planned_qty 2 kitted (reserves 4 -> available 6)."
          setup_api_calls:
            - call: "POST /parts"
              payload: { internal_pn: "P-CONS1", description: "res", package_type: "0402", standard_cost_cents: 20, is_rohs_required: false, contains_conflict_minerals: false }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { part_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Vendor O", cage_code: "5OPQ6" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { vendor_id: $.data.id }
            - call: "POST /avl-entries"
              payload: { part_id: "${part_id}", vendor_id: "${vendor_id}", vendor_pn: "VO-R", approval_rank: 1 }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { avl_id: $.data.id, avl_v: $.data.version }
            - call: "POST /avl-entries/${avl_id}/receive-lot"
              payload: { lot_code: "LOT-O", received_qty: 10, unit_cost_cents: 20, received_at: "2026-01-02T00:00:00.000Z", expected_avl_entry_version: "${avl_v}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /boms"
              payload: { product_code: "BRD-16", revision: "A" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { bom_id: $.data.id }
            - call: "POST /boms/${bom_id}/lines"
              payload: { part_id: "${part_id}", ref_designators: ["R1","R2"], qty_per_assembly: 2 }
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /boms/${bom_id}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /work-orders"
              payload: { bom_id: "${bom_id}", planned_qty: 2 }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/kit"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
          trigger:
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "GET /parts/${part_id}"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { avail_after: $.data.available_qty }
          assert:
            - "Part.${part_id}.available_qty == 10"
            - "WorkOrder.${wo_id}.status == CANCELLED"

      - name: revoke_lot_receipt_balance_invariant
        grounds:
          - state_machines.AvlEntry.APPROVED_to_REVOKED
          - entities.Part.fields.total_on_hand_qty
          - entities.InventoryLot.fields.status
          - state_machines.InventoryLot.AVAILABLE_to_QUARANTINED
        distinguishing_aspect: |
          A different conserved quantity #2 = Part.total_on_hand_qty (physical floor
          stock, AVAILABLE+QUARANTINED). Quarantining a lot is a compensating move
          that conserves total_on_hand_qty exactly (the lot's remaining_qty stays
          counted under QUARANTINED) while removing it from available_qty: pinned
          invariant total_on_hand_qty_after_quarantine == total_on_hand_qty_before,
          distinct from the reservation-conservation quantity above.
        test_recipe:
          setup:
            - "Part with one AVAILABLE lot qty 30 (total_on_hand_qty 30, available_qty 30)."
          setup_api_calls:
            - call: "POST /parts"
              payload: { internal_pn: "P-CONS2", description: "res", package_type: "0402", standard_cost_cents: 20, is_rohs_required: false, contains_conflict_minerals: false }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { part_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Vendor P", cage_code: "6PQR7" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { vendor_id: $.data.id }
            - call: "POST /avl-entries"
              payload: { part_id: "${part_id}", vendor_id: "${vendor_id}", vendor_pn: "VP-R", approval_rank: 1 }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { avl_id: $.data.id, avl_v: $.data.version }
            - call: "POST /avl-entries/${avl_id}/receive-lot"
              payload: { lot_code: "LOT-P", received_qty: 30, unit_cost_cents: 20, received_at: "2026-01-02T00:00:00.000Z", expected_avl_entry_version: "${avl_v}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /inventory-lots/${lot_id}/quarantine"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "GET /parts/${part_id}"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { toh_after: $.data.total_on_hand_qty, avail_after: $.data.available_qty }
          assert:
            - "Part.${part_id}.total_on_hand_qty == 30"
            - "Part.${part_id}.available_qty == 0"
            - "InventoryLot.${lot_id}.status == QUARANTINED"
