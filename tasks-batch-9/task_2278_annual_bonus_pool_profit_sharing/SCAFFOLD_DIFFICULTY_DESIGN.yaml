      - name: minimum_service_at_exactly_ninety_credited_days
        grounds:
          - calculations.participant_prorated_target
          - entities.ParticipantAward.fields.credited_days
          - entities.ParticipantAward.fields.eligibility_status
          - entities.BusinessUnitPool.fields.eligible_headcount
          - endpoints."POST /bonus-plans/{planId}/target-assignments"
        distinguishing_aspect: |
          Boundary metric: credited_days against MIN_SERVICE_DAYS 90, tested
          on a different endpoint (target-assignments) from the curve
          boundary. A hire on 2026-10-03 yields exactly 90 credited days —
          ELIGIBLE with a 246,575-cent target — while a hire one day later
          yields 89 days, INELIGIBLE_MIN_SERVICE and a target of 0. The
          eligible pool target therefore counts only one of the two
          participants (246,575, headcount 1), so an off-by-one in the day
          count changes both the money and the headcount.
        test_recipe:
          setup:
            - "One unit UNIT-B2, one plan, L3 target 10.00%, one pool, two participants both L3 at 10,000,000: Nia hired 2026-10-03 (90 credited days) and Oli hired 2026-10-04 (89 credited days)."
