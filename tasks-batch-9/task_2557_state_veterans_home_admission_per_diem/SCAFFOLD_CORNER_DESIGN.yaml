      - name: rbac_federal_auditor_cannot_create_correct_or_submit_claims
        claim_type: segregation_of_duties
        grounds:
          - rbac.FederalPerDiemAuditor
          - rbac.BusinessOfficeManager
          - validations[priority=20,ERR_ROLE_NOT_PERMITTED]
          - validations[priority=60,ERR_CLAIM_STATE_INVALID]
        distinguishing_aspect: |
          The claim lifecycle is split across two roles that cannot cross over: the auditor may not open,
          correct or submit a claim and the business office may not adjudicate one, both refused at the role
          rung (20) with 403. The auditor's OWN operation on a DRAFT claim is refused later, at the state
          rung (60) with 409 ERR_CLAIM_STATE_INVALID - so a 403 here always means the role, never the state.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome with one CERTIFIED NURSING unit and no residents."
            - "One DRAFT AUDITED_BASIS claim for 2026-07 opened by bom-1, with claim_amount_cents 0 because no census day exists."
            - "The logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Ravenswood State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01" }
              as: StateProgramAdmin
              captures: { home_id: "$.data.id" }
            - call: "POST /svh/veterans-homes/${home_id}/care-units"
              payload: { unit_name: "Nursing A", care_level: "NURSING", licensed_bed_count: 2, out_of_service_bed_count: 0 }
              as: StateProgramAdmin
              captures: { nu_id: "$.data.id" }
            - call: "POST /svh/per-diem-claims"
              payload: { veterans_home_id: "${home_id}", care_unit_id: "${nu_id}", claim_month: "2026-07", basis: "AUDITED_BASIS" }
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { c_id: "$.data.id", c_v: "$.data.version", c_status0: "$.data.status", c_amt: "$.data.claim_amount_cents" }
          trigger:
            - call: "POST /svh/per-diem-claims"
              payload: { veterans_home_id: "${home_id}", care_unit_id: "${nu_id}", claim_month: "2026-06", basis: "AUDITED_BASIS" }
              as: FederalPerDiemAuditor
              as_user_id: "auditor-1"
              captures: { auditor_open_err: "$.data.error_id" }
            - call: "POST /svh/per-diem-claims/${c_id}/submit"
              payload: {}
              as: FederalPerDiemAuditor
              as_user_id: "auditor-1"
              captures: { auditor_submit_err: "$.data.error_id" }
            - call: "POST /svh/per-diem-claims/${c_id}/correct"
              payload: { expected_claim_version: "${c_v}", correction_note: "auditor tries to correct" }
              as: FederalPerDiemAuditor
              as_user_id: "auditor-1"
              captures: { auditor_correct_err: "$.data.error_id" }
            - call: "POST /svh/per-diem-claims/${c_id}/adjudicate"
              payload: { outcome: "PAID", adjudication_note: "business office pays itself" }
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { bom_adjudicate_err: "$.data.error_id" }
            - call: "GET /svh/per-diem-claims/${c_id}"
              payload: {}
              as: FederalPerDiemAuditor
              as_user_id: "auditor-1"
              captures: { auditor_read_status: "$.data.status", auditor_read_amt: "$.data.claim_amount_cents" }
            - call: "POST /svh/per-diem-claims/${c_id}/adjudicate"
              payload: { outcome: "PAID", adjudication_note: "adjudicating a draft" }
              as: FederalPerDiemAuditor
              as_user_id: "auditor-1"
              captures: { auditor_state_err: "$.data.error_id" }
            - call: "GET /svh/per-diem-claims"
              payload: { veterans_home_id: "${home_id}", limit: 10 }
              as: FederalPerDiemAuditor
              as_user_id: "auditor-1"
              captures: { claim_total: "$.meta.total_count" }
          assert:
            - "c_status0 == DRAFT"
            - "c_amt == 0"
            - "the auditor's claim creation returns HTTP 403"
            - "auditor_open_err == ERR_ROLE_NOT_PERMITTED"
            - "the auditor's submit returns HTTP 403"
            - "auditor_submit_err == ERR_ROLE_NOT_PERMITTED"
            - "the auditor's correction returns HTTP 403"
            - "auditor_correct_err == ERR_ROLE_NOT_PERMITTED"
            - "the business office adjudication returns HTTP 403"
            - "bom_adjudicate_err == ERR_ROLE_NOT_PERMITTED"
            - "auditor_read_status == DRAFT"
            - "auditor_read_amt == 0"
            - "the auditor's adjudication of a DRAFT claim returns HTTP 409"
            - "auditor_state_err == ERR_CLAIM_STATE_INVALID"
            - "claim_total == 1"

      - name: rbac_resident_representative_is_read_only_and_cannot_write
