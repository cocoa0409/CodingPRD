  # ===========================================================================
  - section: validations
    instances:

      - name: create_center_missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "Priority 1 dominates everything: a request without the X-User-ID/X-User-Role headers fails with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER even when the body is otherwise valid."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /aha/training-centers"
              payload: { legal_name: "No Auth Center", region: "WEST", contact_email: "x@x.example" }
              as: NationalAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the trigger is sent without the X-User-ID and X-User-Role headers and returns 400 with error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: authorization_beats_existence_for_denied_role
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors.ERR_INSUFFICIENT_PERMISSIONS
        distinguishing_aspect: "A denied role acting on a non-existent resource gets 403 ERR_INSUFFICIENT_PERMISSIONS (priority 2), never the 404 — authorization is checked before any id is resolved."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /aha/training-centers/00000000-0000-4000-8000-000000000000/sites"
              payload: { name: "Ghost Lab", street_address: "1 Nowhere Rd", city: "Austin", state_code: "TX", capacity_students: 10 }
              as: TCCoordinator
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "error_id != ERR_TRAINING_CENTER_NOT_FOUND"

      - name: occ_stale_version_blocks_second_site_align
        claim_type: violation_to_error
        grounds:
          - concurrency_rules[site-align-stale-center]
          - validations[priority=3.5]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on TrainingCenter.version: after the first site alignment advances the center version, a second alignment carrying the pre-alignment version fails with 412 ERR_STALE_VERSION even though every business precondition holds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Center with faculty oversight and two PENDING_ALIGNMENT sites; the center version was captured before any alignment."
          setup_api_calls:
            - *c_clock
            - *c_center
            - *c_faculty
            - *c_grant
            - *c_falign
            - call: "GET /aha/training-centers/${center_id}"
              payload: {}
              as: TCAdmin
              captures: { center_v0: $.data.version }
            - call: "POST /aha/training-centers/${center_id}/sites"
              payload: { name: "Site One", street_address: "100 CPR Way", city: "Austin", state_code: "TX", capacity_students: 24 }
              as: TCAdmin
              captures: { site1_id: $.data.id }
            - call: "POST /aha/training-centers/${center_id}/sites"
              payload: { name: "Site Two", street_address: "200 Airway Blvd", city: "Austin", state_code: "TX", capacity_students: 12 }
              as: TCAdmin
              captures: { site2_id: $.data.id }
          trigger:
            - call: "POST /aha/training-sites/${site1_id}/align"
              payload: { expected_training_center_version: "${center_v0}" }
              as: TCAdmin
              captures: { site1_status: $.data.status }
            - call: "POST /aha/training-sites/${site2_id}/align"
              payload: { expected_training_center_version: "${center_v0}" }
              as: TCAdmin
              captures: { err_stale: $.data.error_id }
          assert:
            - "site1_status == ALIGNED"
            - "the second align returns 412 and err_stale == ERR_STALE_VERSION"
            - "TrainingSite.${site2_id}.status is still PENDING_ALIGNMENT"

      - name: occ_stale_version_blocks_audit_open
        claim_type: violation_to_error
        grounds:
          - concurrency_rules[audit-open-stale-center]
          - validations[priority=3.5]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on the audit-open path: an audit opened with the center version from before a successful audit was opened is rejected with 412 ERR_STALE_VERSION, because the first audit bumped the center version."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Activated center; its version captured before any audit exists."
          setup_api_calls:
            - *c_clock
            - *c_center
            - *c_faculty
            - *c_grant
            - *c_falign
            - *c_cv
            - *c_site
            - *c_align
            - *c_activate
            - call: "GET /aha/training-centers/${center_id}"
              payload: {}
              as: QAAuditor
              captures: { center_v0: $.data.version }
          trigger:
            - call: "POST /aha/quality-audits"
              payload: { target_training_center_id: "${center_id}", expected_training_center_version: "${center_v0}" }
              as: QAAuditor
              captures: { audit1_id: $.data.id }
            - call: "POST /aha/quality-audits"
              payload: { target_training_center_id: "${center_id}", expected_training_center_version: "${center_v0}" }
              as: QAAuditor
              captures: { err_stale: $.data.error_id }
          assert:
            - "the first audit is created (201) with status OPEN"
            - "the second audit create returns 412 and err_stale == ERR_STALE_VERSION"
            - "GET /aha/training-centers/${center_id}/quality-audits returns exactly 1 row"

      - name: roster_add_on_full_session_returns_session_full
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors.ERR_SESSION_FULL
        distinguishing_aspect: "The quota check is last: when seats_available == 0 the roster add fails with 422 ERR_SESSION_FULL — and a cancel frees exactly one seat so the next identical add succeeds."
        test_recipe:
