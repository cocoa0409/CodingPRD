            - call: "POST /integrity/reports"
              payload: { offering_id: "${offering_id}", student_id: "${student_id}", alleged_violation_type: "PLAGIARISM", narrative: "ESSAY scored twice.", incident_at: "2026-07-20T00:00:00Z", component_scores: [{ code: "ESSAY", earned_points: 156 }, { code: "ESSAY", earned_points: 150 }, { code: "MIDTERM", earned_points: 68 }, { code: "PROJECT", earned_points: 56 }, { code: "FINAL", earned_points: 113 }] }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { err_scores_duplicate_code: $.data.error_id }
            - call: "POST /integrity/reports"
              payload: { offering_id: "${offering_id}", student_id: "${student_id}", alleged_violation_type: "PLAGIARISM", narrative: "All four components, declaration order reversed.", incident_at: "2026-07-20T00:00:00Z", component_scores: [{ code: "FINAL", earned_points: 113 }, { code: "PROJECT", earned_points: 56 }, { code: "MIDTERM", earned_points: 68 }, { code: "ESSAY", earned_points: 156 }] }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { report_ok_id: $.data.id }
          assert:
            - "the three-component payload returns HTTP 409 with data.error_id == ERR_COMPONENT_SCORES_INCOMPLETE"
            - "the payload with the extra QUIZ code returns HTTP 409 with data.error_id == ERR_COMPONENT_SCORES_INCOMPLETE"
            - "the payload with ESSAY twice returns HTTP 409 with data.error_id == ERR_COMPONENT_SCORES_INCOMPLETE - exactly one entry per code is required"
            - "all three refusals are 409 and not 400: the arrays are shape-valid, so priority 5 passes and priority 34 is the first failing rule"
            - "the reversed-order payload returns HTTP 201 with IntegrityReport.${report_ok_id}.status == DRAFT - component order is irrelevant"
            - "GET /integrity/reports?offering_id=${offering_id} returns total_count 1"

      - name: appeal_gates_stack_window_duplication_state_grounds_and_reduced_rank
        claim_type: Temporal validation
        grounds:
          - validations[priority=20]
          - validations[priority=43]
          - validations[priority=57]
          - validations[priority=58]
          - validations[priority=59]
          - errors.ERR_APPEAL_WINDOW_CLOSED
          - errors.ERR_APPEAL_ALREADY_FILED
          - errors.ERR_APPEAL_STATE_INVALID
          - errors.ERR_APPEAL_GROUNDS_MISMATCH
          - errors.ERR_REDUCED_RANK_INVALID
          - state_machines.Appeal
          - global_constants.APPEAL_WINDOW_DAYS
        distinguishing_aspect: |
          The appeal window is inclusive at exactly decided_at + 10 days: a filing at
          2026-08-30T10:00:00Z (decided_at 2026-08-20T10:00:00Z plus 10 days to the second) succeeds
          because the rule fires only on clock > deadline, while the same filing at
          2026-08-31T00:00:00Z is ERR_APPEAL_WINDOW_CLOSED. Between those two points every other appeal
          gate is exercised on the same row: a second filing while one is open is
          ERR_APPEAL_ALREADY_FILED, decide-before-screen and screen-twice are both
          ERR_APPEAL_STATE_INVALID, REMANDED on SANCTION_SEVERITY grounds is
          ERR_APPEAL_GROUNDS_MISMATCH, and reduced_ladder_rank 3 against a governing rank of 3 is
          ERR_REDUCED_RANK_INVALID because the legal interval is [1, 2].
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; ENGL, reporter Rita trained, chair Cora trained, pan1/pan2/pan3, ROOM-A, student Sam"
            - "a FORMAL PLAGIARISM case decided RESPONSIBLE at 2026-08-20T10:00:00Z with recommended_ladder_rank 3, and a rank-3 GRADE_PENALTY_COURSE sanction IMPOSED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/departments"
              payload: { code: "ENGL", name: "English", enrolled_student_count: 2000, faculty_headcount: 5 }
              as: IntegrityOfficer
              captures: { dept_engl_id: $.data.id }
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Rita Reporter", email: "rita@u.edu" }
              as: IntegrityOfficer
              captures: { reporter_id: $.data.id }
            - call: "POST /integrity/faculty-members/${reporter_id}/training-completions"
              payload: { module_code: "AI-101", completed_at: "2026-01-15T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Cora Chair", email: "cora@u.edu" }
              as: IntegrityOfficer
              captures: { chair_id: $.data.id }
            - call: "POST /integrity/faculty-members/${chair_id}/training-completions"
              payload: { module_code: "AI-101", completed_at: "2026-02-01T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Pat Panel One", email: "pan1@u.edu" }
              as: IntegrityOfficer
              captures: { pan1_id: $.data.id }
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Pia Panel Two", email: "pan2@u.edu" }
              as: IntegrityOfficer
              captures: { pan2_id: $.data.id }
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Pim Panel Three", email: "pan3@u.edu" }
              as: IntegrityOfficer
              captures: { pan3_id: $.data.id }
            - call: "POST /integrity/hearing-rooms"
              payload: { code: "ROOM-A", seat_capacity: 12, buffer_minutes: 30, sessions_per_day_cap: 2 }
              as: IntegrityOfficer
              captures: { room_a_id: $.data.id }
            - call: "POST /integrity/students"
              payload: { full_name: "Sam Student", email: "sam@u.edu", program_code: "BA-ENG", class_year: 3 }
              as: IntegrityOfficer
              captures: { student_id: $.data.id }
            - call: "POST /integrity/course-offerings"
              payload: { department_id: "${dept_engl_id}", instructor_id: "${reporter_id}", course_code: "ENGL-201", term_code: "2026FA", grade_components: [{ code: "ESSAY", max_points: 200, weight_pct: 40 }, { code: "MIDTERM", max_points: 70, weight_pct: 30 }, { code: "PROJECT", max_points: 90, weight_pct: 20 }, { code: "FINAL", max_points: 180, weight_pct: 10 }] }
              as: IntegrityOfficer
              captures: { offering_id: $.data.id }
            - call: "POST /integrity/reports"
              payload: { offering_id: "${offering_id}", student_id: "${student_id}", alleged_violation_type: "PLAGIARISM", narrative: "Essay reuses an uncited source.", incident_at: "2026-07-20T00:00:00Z", component_scores: [{ code: "ESSAY", earned_points: 156 }, { code: "MIDTERM", earned_points: 68 }, { code: "PROJECT", earned_points: 56 }, { code: "FINAL", earned_points: 113 }] }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { report_id: $.data.id }
            - call: "POST /integrity/evidence-items"
              payload: { report_id: "${report_id}", kind: "SIMILARITY_REPORT", sha256: "1111111111111111111111111111111111111111111111111111111111111111", page_count: 4, similarity_pct: 45.00 }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
            - call: "POST /integrity/reports/${report_id}/submit"
              as: FacultyReporter
              as_user_id: "${reporter_id}"
            - call: "POST /integrity/reports/${report_id}/triage"
              payload: { decision: "ACCEPT", triage_note: "Sufficient evidence." }
              as: IntegrityOfficer
            - call: "POST /integrity/cases"
              payload: { report_id: "${report_id}" }
              as: IntegrityOfficer
              captures: { case_id: $.data.id }
            - call: "POST /integrity/cases/${case_id}/pathway"
              payload: { pathway: "FORMAL" }
              as: IntegrityOfficer
            - call: "POST /integrity/cases/${case_id}/notifications"
              payload: { kind: "ALLEGATION_NOTICE", response_window_days: 5 }
              as: IntegrityOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /integrity/notifications/${notice_id}/acknowledge"
              as: Student
              as_user_id: "${student_id}"
            - call: "POST /integrity/hearing-sessions"
              payload: { case_id: "${case_id}", room_id: "${room_a_id}", chair_id: "${chair_id}", panelist_ids: ["${pan1_id}", "${pan2_id}", "${pan3_id}"], start_at: "2026-08-20T10:00:00Z", end_at: "2026-08-20T11:30:00Z" }
              as: IntegrityOfficer
              captures: { session_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T10:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/hearing-sessions/${session_id}/convene"
              as: PanelChair
              as_user_id: "${chair_id}"
            - call: "POST /integrity/panel-votes"
              payload: { session_id: "${session_id}", panelist_id: "${pan1_id}", verdict: "RESPONSIBLE", severity_recommendation: 3 }
              as: PanelChair
              as_user_id: "${chair_id}"
            - call: "POST /integrity/panel-votes"
              payload: { session_id: "${session_id}", panelist_id: "${pan2_id}", verdict: "RESPONSIBLE", severity_recommendation: 3 }
              as: PanelChair
              as_user_id: "${chair_id}"
            - call: "POST /integrity/panel-votes"
              payload: { session_id: "${session_id}", panelist_id: "${pan3_id}", verdict: "NOT_RESPONSIBLE" }
              as: PanelChair
              as_user_id: "${chair_id}"
            - call: "POST /integrity/hearing-sessions/${session_id}/decide"
              as: PanelChair
              as_user_id: "${chair_id}"
            - call: "GET /integrity/cases/${case_id}"
              as: IntegrityOfficer
              captures: { case_v_decided: $.data.version }
            - call: "POST /integrity/sanctions"
              payload: { case_id: "${case_id}", expected_case_version: "${case_v_decided}", kind: "GRADE_PENALTY_COURSE", ladder_rank: 3, effective_from: "2026-08-21T00:00:00Z" }
              as: IntegrityOfficer
              captures: { sanction_id: $.data.id }
            - call: "POST /integrity/sanctions/${sanction_id}/impose"
              as: IntegrityOfficer
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-30T10:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/appeals"
              payload: { case_id: "${case_id}", grounds: "SANCTION_SEVERITY", statement: "The course-grade penalty is out of proportion to a first offence." }
              as: Student
              as_user_id: "${student_id}"
              captures: { appeal_a_id: $.data.id }
            - call: "POST /integrity/appeals"
              payload: { case_id: "${case_id}", grounds: "PROCEDURE", statement: "A second, overlapping appeal." }
              as: Student
              as_user_id: "${student_id}"
              captures: { err_already_filed: $.data.error_id }
            - call: "POST /integrity/appeals/${appeal_a_id}/decide"
              payload: { outcome: "UPHELD_ORIGINAL", decision_reason: "Deciding before screening." }
              as: AppealsDean
              captures: { err_decide_before_screen: $.data.error_id }
            - call: "POST /integrity/appeals/${appeal_a_id}/screen"
              payload: { decision: "ACCEPT_FOR_REVIEW", decision_reason: "Proportionality is arguable." }
              as: AppealsDean
            - call: "POST /integrity/appeals/${appeal_a_id}/screen"
              payload: { decision: "ACCEPT_FOR_REVIEW", decision_reason: "Screening a second time." }
              as: AppealsDean
              captures: { err_screen_twice: $.data.error_id }
            - call: "POST /integrity/appeals/${appeal_a_id}/decide"
              payload: { outcome: "REMANDED", decision_reason: "Remand on severity grounds." }
              as: AppealsDean
              captures: { err_grounds_mismatch: $.data.error_id }
            - call: "POST /integrity/appeals/${appeal_a_id}/decide"
              payload: { outcome: "SANCTION_REDUCED", decision_reason: "Reduce to the same rank.", reduced_ladder_rank: 3 }
              as: AppealsDean
              captures: { err_reduced_rank: $.data.error_id }
            - call: "POST /integrity/appeals/${appeal_a_id}/decide"
              payload: { outcome: "SANCTION_REDUCED", decision_reason: "A warning is proportionate for a first offence.", reduced_ladder_rank: 1 }
              as: AppealsDean
            - call: "GET /integrity/sanctions?case_id=${case_id}"
              as: IntegrityOfficer
            - call: "GET /integrity/students/${student_id}"
              as: IntegrityOfficer
              captures: { points_after_reduction: $.data.active_sanction_points }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/appeals"
              payload: { case_id: "${case_id}", grounds: "PROCEDURE", statement: "Filed one day past the window." }
              as: Student
              as_user_id: "${student_id}"
              captures: { err_window_closed: $.data.error_id }
          assert:
            - "Case.${case_id}.decided_at == 2026-08-20T10:00:00Z, so the appeal deadline is exactly 2026-08-30T10:00:00Z"
            - "the first filing at 2026-08-30T10:00:00Z returns HTTP 201 with Appeal.${appeal_a_id}.status == SUBMITTED and grounds == SANCTION_SEVERITY - the rule fires on clock > deadline, so the boundary instant is inside the window"
            - "the second filing returns HTTP 409 with data.error_id == ERR_APPEAL_ALREADY_FILED"
            - "decide before screen returns HTTP 409 with data.error_id == ERR_APPEAL_STATE_INVALID (decide requires UNDER_REVIEW)"
            - "the first screen returns HTTP 200 with Appeal.${appeal_a_id}.status == UNDER_REVIEW, Case.${case_id}.adjudication_status == APPEAL_UNDER_REVIEW and pre_appeal_adjudication_status == SANCTION_IMPOSED"
            - "the second screen returns HTTP 409 with data.error_id == ERR_APPEAL_STATE_INVALID (screen requires SUBMITTED)"
            - "REMANDED on SANCTION_SEVERITY grounds returns HTTP 409 with data.error_id == ERR_APPEAL_GROUNDS_MISMATCH"
            - "SANCTION_REDUCED with reduced_ladder_rank 3 returns HTTP 409 with data.error_id == ERR_REDUCED_RANK_INVALID - the governing rank is 3 so the legal interval is [1, 2]"
            - "SANCTION_REDUCED with reduced_ladder_rank 1 returns HTTP 200 with Appeal.${appeal_a_id}.status == SANCTION_REDUCED and decided_at == 2026-08-30T10:00:00Z"
            - "Sanction.${sanction_id}.status == VACATED with vacated_reason == APPEAL_REDUCED"
            - "GET /integrity/sanctions?case_id=${case_id} returns total_count 2, and the new row has origin == APPEAL_REDUCTION, replaces_sanction_id == ${sanction_id}, ladder_rank == 1, kind == WARNING and status == IMPOSED (the vacated sanction was IMPOSED)"
            - "Student.${student_id}.active_sanction_points == 1 (was 3), and standing == GOOD_STANDING"
            - "Case.${case_id}.adjudication_status == SANCTION_IMPOSED again and pre_appeal_adjudication_status == null"
            - "the filing at 2026-08-31T00:00:00Z returns HTTP 409 with data.error_id == ERR_APPEAL_WINDOW_CLOSED, NOT ERR_APPEAL_ALREADY_FILED - priority 43 outranks priority 57 and only one appeal row exists"
            - "GET /integrity/cases/${case_id}/appeals returns total_count 1 - neither refused filing persisted a row"

      - name: an_accepted_informal_resolution_is_appealable_only_on_procedure_grounds
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=30]
          - errors.ERR_INFORMAL_RESOLUTION_NOT_APPEALABLE
          - state_machines.Case.INFORMAL_ACCEPTED_to_APPEAL_UNDER_REVIEW
          - global_constants.APPEAL_MAX_PER_CASE
        distinguishing_aspect: |
          The gate lives on the SCREEN endpoint, not on the filing endpoint, and it is
          decision-independent: an EVIDENCE-grounds appeal against an INFORMAL_ACCEPTED case is filed
          successfully (201) and then cannot be screened at all - both ACCEPT_FOR_REVIEW and
          DENY_NO_GROUNDS return ERR_INFORMAL_RESOLUTION_NOT_APPEALABLE - whereas a PROCEDURE-grounds
          appeal on the same case screens through to UNDER_REVIEW. The two appeals also exhaust
          APPEAL_MAX_PER_CASE, so a third filing is refused.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; ENGL, reporter Rita trained, student Sam, ENGL-201"
            - "a PLAGIARISM case with provisional severity 44.00, recommended_ladder_rank 3, pathway INFORMAL, an instructor proposal accepted by the student at 2026-08-10T00:00:00Z"
