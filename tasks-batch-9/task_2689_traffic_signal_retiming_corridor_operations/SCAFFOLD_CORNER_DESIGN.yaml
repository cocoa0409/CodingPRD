            - call: "POST /signal-ops/intersections/${i1_id}/turning-movement-counts"
              payload: { project_id: "${p1_id}", study_role: "BEFORE", count_date: "2026-08-01T00:00:00Z", period: "AM_PEAK", phase_volumes: { "1": 350, "2": 500, "4": 250, "6": 180 } }
