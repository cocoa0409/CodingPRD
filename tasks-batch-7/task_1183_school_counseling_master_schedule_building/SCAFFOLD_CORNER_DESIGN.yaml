              captures: { dem_rows: "$.data.rows" }
          assert:
            - "demand for ALT-1 == 2.0 (1.0 primary + 2 x 0.5 alternates)"
      - name: credit_audit_input_set_excludes_dropped
        claim_type: input_set_filtering
        grounds:
          - calculations.credit_pace_requirement
        distinguishing_aspect: "final_audit counts only ENROLLED entries: after a DROP executes, the dropped entry's credits leave planned_credit_load (2.0 -> 1.0)."
        test_recipe:
          setup:
            - "term CHANGE_WINDOW; student s_drp enrolled in 2 courses (2.0 credits); an APPROVED DROP for one entry exists"
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Drp", max_caseload: 50 }
              as: Administrator
              captures: { c_drp: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2050-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25 }
              as: Administrator
              captures: { t_drp: "$.data.id" }
            # NOTE for the test-generator: standard chain to CHANGE_WINDOW with
            # s_drp enrolled in 2 x 1.0-credit sections, then DROP approved.
            - call: "POST /scheduling/students"
              payload: { external_ref: "DRP", full_name: "Drop Stu", grade_level: 9, counselor_id: "${c_drp}", earned_credits: 0 }
              as: Administrator
              captures: { s_drp: "$.data.id" }
          trigger:
