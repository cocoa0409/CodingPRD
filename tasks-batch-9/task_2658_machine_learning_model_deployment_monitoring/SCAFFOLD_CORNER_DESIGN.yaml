          rationale: "Boundary behaviour of the cumulative urgency tiers and of the RETRAIN_REQUIRED_THRESHOLD is asserted by the named §1.8 instance, and the instantaneous drift thresholds at exactly DRIFT_WARN_THRESHOLD and DRIFT_CRITICAL_THRESHOLD by boundary_precision_check / skew_ratio_exactly_at_block_threshold_on_skew_checks and by the drift cascade instance."

  # ===========================================================================
  # 9. From Consistency Model — immediate
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: every_derived_field_and_cascade_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.endpoint_traffic_ledger
          - state_machines.Deployment.RAMPING_to_LIVE
          - state_machines.Deployment.LIVE_to_ROLLED_BACK
        distinguishing_aspect: |
          consistency_model is `immediate`, so no denormalised field is ever allowed to lag: the ramp
          response that promotes a champion must already carry the new rollout_state, and the cross-aggregate
          writes it triggers (Model.champion_version_id, ServingEndpoint.allocated_traffic_pct) must be true
          on the very next read with no reconciliation call in between. The claim is about VISIBILITY, not
          arithmetic — the same three hops are read back immediately after the write and after the
          compensating rollback, and the new rows appear in their list endpoints in the next request.
        setup_note: |
          No clock advance anywhere in this instance: every read happens at the same logical instant as the
          write it observes, which is what makes a lagging implementation detectable.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z startup default"
            - "one APPROVED version 1.0.0 (no parent) and one OPEN cluster, both serving fs-v1"
          setup_api_calls:
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml" }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { m_id: $.data.id }
            - call: "POST /training-datasets"
              payload: { name: "snap-2026-07", snapshot_uri: "s3://snaps/2026-07", row_count: 1000000, feature_hash: "fs-v1", baseline_bin_proportions: [0.20, 0.20, 0.20, 0.20, 0.20], baseline_positive_rate: 0.30, license_class: "INTERNAL", pii_review_passed: true }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { ds_id: $.data.id }
            - call: "POST /training-datasets/${ds_id}/submit"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
            - call: "POST /training-datasets/${ds_id}/decision"
              payload: { decision: "APPROVE" }
              as: DataSteward
              as_user_id: "u_stew_1"
            - call: "POST /model-versions"
              payload: { model_id: "${m_id}", training_dataset_id: "${ds_id}", semver: "1.0.0", artifact_digest: "sha256:aaa", feature_spec_hash: "fs-v1", baseline_accuracy: 0.82, baseline_positive_rate: 0.30, baseline_p95_latency_ms: 200, doc_sections: ["INTENDED_USE", "TRAINING_DATA", "EVALUATION", "LIMITATIONS"], repro_artifacts: ["TRAINING_CODE_COMMIT", "ENV_LOCKFILE_DIGEST", "RANDOM_SEED", "FEATURE_SPEC_HASH"] }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { v1_id: $.data.id, v1_parent: $.data.parent_version_id }
            - call: "POST /model-versions/${v1_id}/submit-for-review"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
            - call: "POST /model-versions/${v1_id}/decision"
              payload: { decision: "APPROVE" }
              as: ModelApprover
              as_user_id: "u_appr_1"
            - call: "POST /serving-endpoints"
              payload: { name: "rt-cluster-a", region: "us-east-1", serving_feature_spec_hash: "fs-v1", max_traffic_pct: 100.00, deploy_cooldown_minutes: 30 }
              as: PlatformAdmin
              as_user_id: "u_admin_1"
              captures: { se_id: $.data.id, se_v: $.data.version }
          trigger:
            - call: "POST /deployments"
              payload: { model_version_id: "${v1_id}", serving_endpoint_id: "${se_id}", pattern: "REALTIME", serve_from: "2026-08-01T00:00:00Z", serve_until: "2026-12-31T00:00:00Z", expected_serving_endpoint_version: "${se_v}", fallback_strategy: "PREVIOUS_CHAMPION" }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { d1_id: $.data.id, d1_target: $.data.target_traffic_pct }
            - call: "GET /deployments"
              payload: { serving_endpoint_id: "${se_id}", limit: 10, offset: 0 }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { list_total: $.meta.total_count, list_first: "$.data[0].id" }
            - call: "POST /deployments/${d1_id}/ramp"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { r1_state: $.data.rollout_state, r1_traffic: $.data.traffic_pct }
            - call: "GET /serving-endpoints/${se_id}"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { alloc_after_r1: $.data.allocated_traffic_pct }
            - call: "POST /deployments/${d1_id}/ramp"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
            - call: "POST /deployments/${d1_id}/ramp"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
            - call: "POST /deployments/${d1_id}/ramp"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
            - call: "POST /deployments/${d1_id}/ramp"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { r5_state: $.data.rollout_state, r5_traffic: $.data.traffic_pct, r5_index: $.data.ramp_step_index, r5_cumulative: $.data.cumulative_ramp_delta_pct }
            - call: "GET /models/${m_id}"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { champ: $.data.champion_version_id, champ_at: $.data.champion_promoted_at }
            - call: "GET /serving-endpoints/${se_id}"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { alloc_live: $.data.allocated_traffic_pct }
            - call: "POST /deployments/${d1_id}/rollout-action"
              payload: { action: "ROLLBACK" }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { rb_state: $.data.rollout_state, rb_traffic: $.data.traffic_pct, rb_at: $.data.rolled_back_at, rb_cumulative: $.data.cumulative_ramp_delta_pct }
            - call: "GET /serving-endpoints/${se_id}"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { alloc_after_rb: $.data.allocated_traffic_pct }
            - call: "GET /models/${m_id}"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { champ_after_rb: $.data.champion_version_id }
            - call: "GET /deployments/${d1_id}/ramp-steps"
              payload: { limit: 10, offset: 0 }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { steps_total: $.meta.total_count }
          assert:
            - "NO INDEXING LAG: the deployment created in the immediately preceding request is already the only row on GET /deployments for that cluster — total_count 1 and data[0].id equal to the created id"
            - "the write's own response is authoritative: the first ramp returns rollout_state 'RAMPING' and traffic_pct 5.00 in the SAME response, with no follow-up read required"
            - "the cross-aggregate ledger is already reconciled on the next read: allocated_traffic_pct is 5.00"
            - "the fifth ramp response itself carries the promotion: rollout_state 'LIVE', traffic_pct 100.00, ramp_step_index 5 and cumulative_ramp_delta_pct 100.00 (5.00 + 10.00 + 20.00 + 30.00 + 35.00)"
            - "the cross-entity champion write is visible immediately: GET /models/{id} returns champion_version_id equal to 1.0.0's id and champion_promoted_at '2026-08-01T00:00:00Z' — the same logical instant as the ramp"
            - "allocated_traffic_pct is 100.00 on that same instant, with no reconciliation endpoint in between"
            - "the compensation is equally immediate: the ROLLBACK response itself reports rollout_state 'ROLLED_BACK', traffic_pct 0.00, cumulative_ramp_delta_pct 0.00 and rolled_back_at '2026-08-01T00:00:00Z'"
            - "and its two cross-aggregate hops are true on the next read: allocated_traffic_pct is back to 0.00 and champion_version_id is back to null (1.0.0 has no parent_version_id)"
            - "the append-only audit trail is complete in the same instant: GET /deployments/{id}/ramp-steps has total_count 6 — five RAMP_STEP rows plus one ROLLBACK_RELEASE"
