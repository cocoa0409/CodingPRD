      - name: corner_rbac_safety_plan_authorship_moves_with_the_last_patch
        claim_type: Segregation of duties
        grounds:
          - sod_rules.safety-plan-author-vs-certifier
          - errors.ERR_SAFETY_SELF_CERTIFICATION
          - entities.SafetyPlan.fields.authored_by_user_id
        distinguishing_aspect: "authored_by_user_id is not frozen at creation: it is rewritten by the most recent PATCH, so the pair of officials who may certify swaps as the plan is edited. The author who is locked out at first becomes eligible once a peer edits the plan, and the peer who was eligible becomes locked out — a single frozen creator check passes the naive test and fails this one."
        test_recipe:
          setup:
            - "An accepted ATL stop with a DRAFT SafetyPlan created by SafetyOfficial user so-a"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 Thunder Tour", year: 2026, season_start_date: "2026-10-01", season_end_date: "2027-03-31", total_marketing_budget_cents: 40000000 }
              as: SeriesPromoter
              captures: { season: "$.data.id" }
            - call: "POST /venues"
              payload: { name: "Atlanta Dome", market_code: "ATL", city: "Atlanta", state_code: "GA", seat_capacity: 9000, floor_type: "DIRT", catch_fence_max_height_ft: 10, medical_bay_count: 2, load_in_hours_required: 10, staging_bay_count: 4, turnaround_hours: 12 }
              as: SeriesPromoter
              captures: { venue_atl: "$.data.id" }
            - call: "POST /venue-bookings"
              payload: { season_id: "${season}", venue_id: "${venue_atl}", tour_date: "2026-11-14", rental_base_cents: 3000000, revenue_share_pct: 0.12, per_ticket_facility_fee_cents: 350, load_in_start_utc: "2026-11-13T14:00:00Z", tear_down_end_utc: "2026-11-15T06:00:00Z" }
              as: SeriesPromoter
              captures: { b_atl: "$.data.id" }
            - call: "POST /venue-bookings/${b_atl}/accept"
              payload: {}
              as: SeriesPromoter
            - call: "GET /tour-stops"
              payload: { venue_booking_id: "${b_atl}" }
              as: SeriesPromoter
              captures: { stop_atl: "$.data[0].id" }
            - call: "POST /tour-stops/${stop_atl}/safety-plan"
              payload: { barrier_linear_feet: 1200, catch_fence_height_ft: 6, medical_als_staff_count: 1, medical_bls_staff_count: 2, ambulance_count: 1, emergency_access_lanes: 1 }
              as: SafetyOfficial
              as_user_id: "so-a"
              captures: { plan_atl: "$.data.id" }
            - call: "POST /safety-plans/${plan_atl}/submit"
              payload: {}
              as: SafetyOfficial
              as_user_id: "so-a"
          trigger:
            - call: "POST /safety-plans/${plan_atl}/certify"
              payload: { note: "author trying to certify their own plan" }
              as: SafetyOfficial
              as_user_id: "so-a"
              captures: { e_self_certify: "$.data.error_id" }
            - call: "POST /safety-plans/${plan_atl}/return"
              payload: { reason: "second official wants a taller fence" }
              as: SafetyOfficial
              as_user_id: "so-b"
            - call: "PATCH /safety-plans/${plan_atl}"
              payload: { catch_fence_height_ft: 8 }
              as: SafetyOfficial
              as_user_id: "so-b"
            - call: "POST /safety-plans/${plan_atl}/submit"
              payload: {}
              as: SafetyOfficial
              as_user_id: "so-b"
            - call: "POST /safety-plans/${plan_atl}/certify"
              payload: { note: "the editor trying to certify what they just edited" }
              as: SafetyOfficial
              as_user_id: "so-b"
              captures: { e_editor_certify: "$.data.error_id" }
            - call: "POST /safety-plans/${plan_atl}/certify"
              payload: { note: "original author is now an independent certifier" }
              as: SafetyOfficial
              as_user_id: "so-a"
          assert:
            - "trigger call 1 returns HTTP 403 with ${e_self_certify} == ERR_SAFETY_SELF_CERTIFICATION; SafetyPlan.${plan_atl}.state stays SUBMITTED and TourStop.${stop_atl}.safety_state stays SAFETY_REVIEW"
            - "trigger call 2 returns HTTP 200: state == RETURNED and safety_state cycles back to SAFETY_DRAFT"
            - "trigger call 3 returns HTTP 200 and rewrites authored_by_user_id from \"so-a\" to \"so-b\""
            - "trigger call 5 returns HTTP 403 with ${e_editor_certify} == ERR_SAFETY_SELF_CERTIFICATION: so-b created nothing but is now the recorded author"
            - "trigger call 6 returns HTTP 200: so-a, who was refused in trigger call 1, is now an acceptable certifier, and the plan reaches CERTIFIED with safety_state SAFETY_CERTIFIED"
            - "the certified plan carries certified_by_user_id == \"so-a\" and authored_by_user_id == \"so-b\", which must differ"

