  - method: GET
    path: "/wind-ops/turbines/{id}"
    description: "Read one turbine including both state dimensions, telemetry counters and service-due flags."
    roles: [SiteAdmin, ControlRoomOperator, MaintenancePlanner, ReliabilityEngineer, CrewLead, CommercialManager]
    code: 200
    input: []
    output: Turbine
    side_effects: []
  - method: GET
    path: "/wind-ops/turbines"
    description: "List turbines filtered by farm, model or availability state. Reverse-reachability channel for Turbine.wind_farm_id and Turbine.turbine_model_id."
    roles: [SiteAdmin, ControlRoomOperator, MaintenancePlanner, ReliabilityEngineer, CrewLead, CommercialManager]
    code: 200
    input: ["wind_farm_id?", "turbine_model_id?", "availability_state?", "curtailment_state?", "limit?", "offset?"]
    output: Turbine[]
    side_effects: []
  - method: POST
    path: "/wind-ops/turbines/{id}/scada-sync"
    description: "Post a supervisory-control telemetry increment for one turbine: elapsed operating hours plus metered and potential energy for the period."
