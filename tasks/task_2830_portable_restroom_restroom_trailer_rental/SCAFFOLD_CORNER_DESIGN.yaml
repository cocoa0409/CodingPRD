        excluded_because:
          difficulty_instance: route_density_planned_vs_realized_diverge_on_same_schedule_set
          rationale: "The floor()-based percent, the capacity denominator and the fact that repeated recomputes do not accumulate error are all asserted there across several schedule and visit transitions."

