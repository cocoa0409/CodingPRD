  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: lock_chamber_pairwise_buffered_half_open_window_conflict
        grounds:
          - calculations.lock_transit_window
          - validations[priority=20]
          - errors[ERR_LOCK_WINDOW_CONFLICT]
          - entities.LockReservation.fields.occupied_until_at
          - entities.Lock.fields.turnback_buffer_minutes
        distinguishing_aspect: |
          Lock uses PAIRWISE half-open interval arithmetic whose right edge is
          extended by the chamber's turnback buffer: a granted 08:00 slot occupies
          [08:00, 09:15) once the 45-minute cycle and the 30-minute buffer are added,
          so a 09:00 request collides while a 09:15 request touching that exclusive
          edge is admitted.
        test_recipe:
          setup:
            - "Lock Chain of Rocks with chamber capacity 9, a 45-minute cycle and a 30-minute turnback buffer, status OPEN."
            - "Three empty tows, each with barge_count 0 so every reservation is a single cut."
            - "Tow 1 holds a GRANTED reservation starting 2026-08-15T08:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: WaterwayAdmin
            - call: "POST /locks"
              payload: { lock_name: "Chain of Rocks", river_mile: 185.0, chamber_capacity_barges: 9, cycle_minutes: 45, turnback_buffer_minutes: 30 }
              as: WaterwayAdmin
              captures: { lock_id: $.data.id }
            - call: "POST /tows"
              payload: { towboat_name: "M/V Alpha", horsepower: 4000, origin_mile: 600, destination_mile: 200, controlling_gauge_station: "MEMPHIS" }
              as: TowboatDispatcher
              captures: { t1_id: $.data.id, t1_v: $.data.version }
            - call: "POST /tows"
              payload: { towboat_name: "M/V Bravo", horsepower: 4000, origin_mile: 600, destination_mile: 200, controlling_gauge_station: "MEMPHIS" }
              as: TowboatDispatcher
              captures: { t2_id: $.data.id, t2_v: $.data.version }
            - call: "POST /tows"
              payload: { towboat_name: "M/V Charlie", horsepower: 4000, origin_mile: 600, destination_mile: 200, controlling_gauge_station: "MEMPHIS" }
              as: TowboatDispatcher
              captures: { t3_id: $.data.id, t3_v: $.data.version }
            - call: "POST /lock-reservations"
              payload: { lock_id: "${lock_id}", tow_id: "${t1_id}", requested_start_at: "2026-08-15T08:00:00Z", expected_tow_version: "${t1_v}" }
              as: TowboatDispatcher
              captures: { r1_id: $.data.id }
            - call: "POST /lock-reservations/${r1_id}/grant"
              payload: {}
              as: LockMaster
              as_user_id: "${lock_id}"
          trigger:
            - call: "POST /lock-reservations"
              payload: { lock_id: "${lock_id}", tow_id: "${t2_id}", requested_start_at: "2026-08-15T09:00:00Z", expected_tow_version: "${t2_v}" }
              as: TowboatDispatcher
              captures: { overlap_error: $.data.error_id }
            - call: "POST /lock-reservations"
              payload: { lock_id: "${lock_id}", tow_id: "${t3_id}", requested_start_at: "2026-08-15T09:15:00Z", expected_tow_version: "${t3_v}" }
              as: TowboatDispatcher
              captures: { r3_id: $.data.id }
          assert:
            - "LockReservation.${r1_id}.cut_count == 1"
            - "LockReservation.${r1_id}.scheduled_end_at == \"2026-08-15T08:45:00Z\""
            - "LockReservation.${r1_id}.occupied_until_at == \"2026-08-15T09:15:00Z\""
            - "${overlap_error} == ERR_LOCK_WINDOW_CONFLICT with HTTP 409"
            - "the 09:15 request returns HTTP 201 - touching the exclusive right edge is not a conflict"
            - "LockReservation.${r3_id}.scheduled_end_at == \"2026-08-15T10:00:00Z\" and LockReservation.${r3_id}.occupied_until_at == \"2026-08-15T10:30:00Z\""
            - "Lock.${lock_id}.granted_reservation_count == 1 - only r1 is granted"
            - "Tow.${t2_id}.pending_lock_reservation_count == 0"

      - name: fleeting_berth_aggregate_occupancy_over_half_open_intervals
        grounds:
          - calculations.fleeting_fee_assessment
          - validations[priority=21]
          - errors[ERR_BERTH_CAPACITY_EXCEEDED]
          - entities.FleetingBerth.fields.capacity_barges
          - entities.FleetingBerth.fields.occupied_barge_count
        distinguishing_aspect: |
          FleetingBerth uses AGGREGATE head-count interval arithmetic on a different
          resource entity: overlapping is allowed up to capacity, so the rejection
          depends on the peak occupancy count reached at any instant inside the candidate window
          rather than on any pairwise collision. Two reservations may overlap freely
          on a capacity-2 berth; a third that raises the instantaneous count to 3 is
          refused, while the same third barge is admitted for a window that begins
          exactly when an earlier interval's exclusive end falls.
        test_recipe:
          setup:
            - "Fleeting berth Cairo Harbor with capacity_barges 2, 15000 cents per barge-day and a 60000-cent switch fee."
            - "Three idle hulls BL-6001, BL-6002 and BL-6003."
            - "BL-6001 reserved over [2026-08-18T00:00Z, 2026-08-20T00:00Z) and BL-6002 over [2026-08-18T12:00Z, 2026-08-21T00:00Z), both RESERVED - they overlap and the berth is exactly full."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-17T00:00:00Z" }
              as: WaterwayAdmin
            - call: "POST /fleeting-berths"
              payload: { harbor_name: "Cairo Harbor", river_mile: 955.0, capacity_barges: 2, daily_fee_cents_per_barge: 15000, switch_fee_cents: 60000 }
              as: WaterwayAdmin
              captures: { fb_id: $.data.id }
            - call: "POST /barges"
              payload: { hull_number: "BL-6001", capacity_tons: 1750, light_draft_feet: 1.5, tons_per_inch_immersion: 17.0 }
              as: WaterwayAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /barges"
              payload: { hull_number: "BL-6002", capacity_tons: 1750, light_draft_feet: 1.5, tons_per_inch_immersion: 17.0 }
              as: WaterwayAdmin
              captures: { b2_id: $.data.id }
            - call: "POST /barges"
              payload: { hull_number: "BL-6003", capacity_tons: 1750, light_draft_feet: 1.5, tons_per_inch_immersion: 17.0 }
              as: WaterwayAdmin
              captures: { b3_id: $.data.id }
            - call: "POST /fleeting-assignments"
              payload: { barge_id: "${b1_id}", fleeting_berth_id: "${fb_id}", start_at: "2026-08-18T00:00:00Z", end_at: "2026-08-20T00:00:00Z" }
              as: HarborAgent
              captures: { fa1_id: $.data.id }
            - call: "POST /fleeting-assignments"
              payload: { barge_id: "${b2_id}", fleeting_berth_id: "${fb_id}", start_at: "2026-08-18T12:00:00Z", end_at: "2026-08-21T00:00:00Z" }
              as: HarborAgent
              captures: { fa2_id: $.data.id }
          trigger:
            - call: "POST /fleeting-assignments"
              payload: { barge_id: "${b3_id}", fleeting_berth_id: "${fb_id}", start_at: "2026-08-19T00:00:00Z", end_at: "2026-08-19T12:00:00Z" }
              as: HarborAgent
              captures: { capacity_error: $.data.error_id }
            - call: "POST /fleeting-assignments"
              payload: { barge_id: "${b3_id}", fleeting_berth_id: "${fb_id}", start_at: "2026-08-20T00:00:00Z", end_at: "2026-08-20T12:00:00Z" }
              as: HarborAgent
              captures: { fa3_id: $.data.id }
          assert:
            - "${capacity_error} == ERR_BERTH_CAPACITY_EXCEEDED with HTTP 409 - occupancy would be 3 at 2026-08-19T00:00:00Z"
            - "immediately after the refused call FleetingBerth.${fb_id}.occupied_barge_count == 2 and Barge.${b3_id}.operational_status == IDLE"
            - "the 2026-08-20T00:00:00Z request returns HTTP 201 - BL-6001's interval is right-open and does not occupy the berth at its own end instant"
            - "FleetingAssignment.${fa3_id}.status == RESERVED and estimated_fee_cents == 75000"
            - "FleetingBerth.${fb_id}.occupied_barge_count == 3 - the aggregate test is interval-based, not a running head-count"
            - "FleetingAssignment.${fa1_id}.estimated_fee_cents == 90000 and FleetingAssignment.${fa2_id}.estimated_fee_cents == 105000"

