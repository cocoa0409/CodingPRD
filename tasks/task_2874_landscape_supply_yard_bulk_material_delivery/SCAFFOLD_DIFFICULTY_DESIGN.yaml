            - call: "POST /materials"
              payload: { sku: "SOIL-COMPOST", name: "Leaf Compost", offered_forms: [BULK], seasonal_category: "SOIL", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: false }
