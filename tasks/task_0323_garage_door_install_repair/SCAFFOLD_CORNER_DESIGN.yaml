# =============================================================================
# task_0323_garage_door_install_repair — §1.9 Scaffold Corner Design
# Breadth probe: enumerative coverage of testable claims beyond the 9
# Difficulty Rules. claim_type values come from claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_customer_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Customer, endpoints]
        distinguishing_aspect: "POST /customers with required fields returns 201; financing_standing=GOOD and active_warranty_count=0 by default."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Cora New", email: "cora@x.com", service_address: "1 Main" }
              as: ServiceManager
              captures: { cust_id: $.data.id, fs: $.data.financing_standing, awc: $.data.active_warranty_count }
          assert:
            - "response status == 201"
            - "Customer.${cust_id}.financing_standing == GOOD"
            - "Customer.${cust_id}.active_warranty_count == 0"

      - name: get_customer_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Customer, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /customers/{id} with an unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ServiceManager
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "response status == 404"

      - name: create_quote_missing_required_field_invalid_request
        claim_type: Required Fields
        grounds: [entities.Quote, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /quotes omitting quote_type returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Quin Mis", email: "quin@x.com", service_address: "2 Main" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}" }
              as: ServiceManager
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "response status == 422"

      - name: create_quote_invalid_enum_value_rejected
        claim_type: Type Constraints
        grounds: [entities.Quote.fields.quote_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /quotes with quote_type=WHOLESALE (not in {SERVICE_CALL, INSTALL}) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Enid Num", email: "enid@x.com", service_address: "3 Main" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", quote_type: "WHOLESALE" }
              as: ServiceManager
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "response status == 422"

      - name: create_part_duplicate_sku_rejected
        claim_type: Type Constraints
        grounds: [entities.Part.fields.sku, "validations[priority=18]", "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Creating a second Part with an already-used sku returns ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["A part with sku SPR-DUP exists."]
          setup_api_calls:
            - call: "POST /parts"
              payload: { sku: "SPR-DUP", category: "SPRING", unit_price_cents: 9000, on_hand_qty: 5 }
              as: ServiceManager
          trigger:
            - call: "POST /parts"
              payload: { sku: "SPR-DUP", category: "SPRING", unit_price_cents: 9000, on_hand_qty: 5 }
              as: ServiceManager
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE"
            - "response status == 409"

      - name: create_part_default_markup_applied
        claim_type: Defaults
        grounds: [entities.Part.fields.markup_pct, entities.Part.fields.available_qty]
        distinguishing_aspect: "POST /parts omitting markup_pct defaults to 0.35; available_qty initialized to on_hand_qty."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /parts"
              payload: { sku: "PNL-DEF", category: "PANEL", unit_price_cents: 15000, on_hand_qty: 7 }
              as: ServiceManager
              captures: { part_id: $.data.id, mk: $.data.markup_pct, aq: $.data.available_qty }
          assert:
            - "Part.${part_id}.markup_pct == 0.35"
            - "Part.${part_id}.available_qty == 7"

      - name: door_model_is_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.DoorModel]
        distinguishing_aspect: "DoorModel has common_fields:false — no version field and no update endpoint; only create/read exist."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /door-models"
              payload: { sku: "DR-IMM", name: "Imm", width_in: 96, height_in: 84, list_price_cents: 100000, install_labor_minutes: 120 }
              as: ServiceManager
              captures: { door_id: $.data.id }
          assert:
            - "response status == 201"
            - "DoorModel.${door_id} response has no version field"

      - name: customer_computed_active_warranty_count_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Customer.fields.active_warranty_count]
        distinguishing_aspect: "active_warranty_count is source:computed; even if a client supplies it on create, the server returns 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Comp Ute", email: "comp@x.com", service_address: "4 Main" }
              as: ServiceManager
              captures: { cust_id: $.data.id, awc: $.data.active_warranty_count }
          assert:
            - "Customer.${cust_id}.active_warranty_count == 0"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: depart_job_from_unscheduled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Job.dispatch_status.SCHEDULED_to_EN_ROUTE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /jobs/{id}/depart while dispatch_status==UNSCHEDULED (never scheduled) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An accepted job still UNSCHEDULED (never dispatched)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Una Sched", email: "una@x.com", service_address: "5 Main" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /technicians"
              payload: { display_name: "Ray", skill_level: "CERTIFIED" }
              as: ServiceManager
              captures: { tech_id: $.data.id }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", quote_type: "SERVICE_CALL", service_call_fee_cents: 5000 }
              as: ServiceManager
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lines"
              payload: { item_kind: "LABOR", qty: 30 }
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /jobs"
              payload: { quote_id: "${quote_id}" }
              as: ServiceManager
              captures: { job_id: "$.data[0].id" }
          trigger:
            - call: "POST /jobs/${job_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "response status == 409"

      - name: decline_already_declined_quote_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Quote.status.SENT_to_DECLINED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second POST /quotes/{id}/decline on an already-DECLINED (terminal) quote returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A SENT quote is declined once."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Dee Cline", email: "dee@x.com", service_address: "6 Main" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", quote_type: "SERVICE_CALL", service_call_fee_cents: 5000 }
              as: ServiceManager
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lines"
              payload: { item_kind: "LABOR", qty: 30 }
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/decline"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /quotes/${quote_id}/decline"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "response status == 409"

      - name: send_quote_with_no_lines_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Quote.status.DRAFT_to_SENT, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /quotes/{id}/send on a DRAFT quote with zero QuoteLine rows violates the 'at least one line' precondition -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DRAFT quote with no lines."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Em Pty", email: "empt@x.com", service_address: "7 Main" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", quote_type: "SERVICE_CALL", service_call_fee_cents: 5000 }
              as: ServiceManager
              captures: { quote_id: $.data.id }
          trigger:
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: ServiceManager
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "response status == 409"

      - name: accept_expired_quote_returns_quote_expired
        claim_type: Precondition Enforcement
        grounds: [state_machines.Quote.status.DRAFT_to_EXPIRED, "validations[priority=6]", "errors[ERR_QUOTE_EXPIRED]"]
        distinguishing_aspect: "After advancing the clock 15 days past a SENT quote's send instant, POST /quotes/{id}/accept returns ERR_QUOTE_EXPIRED (409)."
        test_recipe:
          setup: ["A SENT quote; the server clock is then advanced beyond expires_at (send + 14 days)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T12:00:00Z" }
              as: ServiceManager
            - call: "POST /customers"
              payload: { full_name: "Ex Pired", email: "exp@x.com", service_address: "8 Main" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", quote_type: "SERVICE_CALL", service_call_fee_cents: 5000 }
              as: ServiceManager
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lines"
              payload: { item_kind: "LABOR", qty: 30 }
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: ServiceManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-16T12:00:00Z" }
              as: ServiceManager
          trigger:
            - call: "POST /quotes/${quote_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_QUOTE_EXPIRED"
            - "response status == 409"

      - name: callback_reopen_cycle_then_resolve
        claim_type: Valid Transition
        grounds: [state_machines.Callback.status.ON_SITE_to_OPEN, state_machines.Callback.status.OPEN_to_SCHEDULED]
        distinguishing_aspect: "Cyclic Callback: ON_SITE -> OPEN (reopen) returns status OPEN, and the callback can be re-scheduled afterward."
        test_recipe:
          setup: ["A callback on a completed job is OPEN -> SCHEDULED -> ON_SITE."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cy Cle", email: "cyc@x.com", service_address: "9 Main", time_zone: "America/Phoenix" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /technicians"
              payload: { display_name: "Sam", skill_level: "CERTIFIED" }
              as: ServiceManager
              captures: { tech_id: $.data.id }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", quote_type: "SERVICE_CALL", service_call_fee_cents: 5000 }
              as: ServiceManager
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lines"
              payload: { item_kind: "LABOR", qty: 30 }
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /jobs"
              payload: { quote_id: "${quote_id}" }
              as: ServiceManager
              captures: { job_id: "$.data[0].id" }
            - call: "POST /jobs/${job_id}/schedule"
              payload: { technician_id: "${tech_id}", scheduled_start: "2026-07-01T17:00:00Z", scheduled_end: "2026-07-01T18:00:00Z" }
              as: Dispatcher
            - call: "POST /jobs/${job_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /jobs/${job_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /jobs/${job_id}/safety-check"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /jobs/${job_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /callbacks"
              payload: { job_id: "${job_id}", reason: "noise" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { cb_id: $.data.id }
            - call: "POST /callbacks/${cb_id}/schedule"
              payload: {}
              as: Dispatcher
            - call: "POST /callbacks/${cb_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /callbacks/${cb_id}/reopen"
              payload: {}
              as: Dispatcher
              captures: { st: $.data.status }
          assert:
            - "Callback.${cb_id}.status == OPEN"

      - name: financing_decline_branch
        claim_type: Valid Transition
        grounds: [state_machines.FinancingApplication.status.SUBMITTED_to_DECLINED]
        distinguishing_aspect: "Branching FinancingApplication: SUBMITTED -> DECLINED via /decline lands the application in terminal DECLINED."
        test_recipe:
          setup: ["A SUBMITTED financing application."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Fi Nance", email: "fin@x.com", service_address: "10 Main" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", quote_type: "SERVICE_CALL", service_call_fee_cents: 5000 }
              as: ServiceManager
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lines"
              payload: { item_kind: "LABOR", qty: 30 }
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: ServiceManager
            - call: "POST /financing-applications"
              payload: { customer_id: "${cust_id}", quote_id: "${quote_id}", principal_cents: 12500, term_months: 12 }
              as: ServiceManager
              captures: { fa_id: $.data.id }
          trigger:
            - call: "POST /financing-applications/${fa_id}/decline"
              payload: {}
              as: ServiceManager
              captures: { st: $.data.status }
          assert:
            - "FinancingApplication.${fa_id}.status == DECLINED"

      - name: warranty_expire_before_exhausted_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.WarrantyPlan.status.ACTIVE_to_EXPIRED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /warranty-plans/{id}/expire on an ACTIVE plan whose tune_ups_used (0) < tune_ups_included (2) violates the exhaustion precondition -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An ACTIVE warranty plan with tune_ups_included 2, tune_ups_used 0."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "We Arr", email: "wear@x.com", service_address: "11 Main", time_zone: "America/Phoenix" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /technicians"
              payload: { display_name: "Tom", skill_level: "CERTIFIED" }
              as: ServiceManager
              captures: { tech_id: $.data.id }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", quote_type: "SERVICE_CALL", service_call_fee_cents: 6000 }
              as: ServiceManager
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lines"
              payload: { item_kind: "LABOR", qty: 30 }
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /jobs"
              payload: { quote_id: "${quote_id}" }
              as: ServiceManager
              captures: { job_id: "$.data[0].id" }
            - call: "POST /warranty-plans"
              payload: { job_id: "${job_id}", customer_id: "${cust_id}", tune_ups_included: 2 }
              as: ServiceManager
              captures: { wp_id: $.data.id }
            - call: "POST /jobs/${job_id}/schedule"
              payload: { technician_id: "${tech_id}", scheduled_start: "2026-07-01T17:00:00Z", scheduled_end: "2026-07-01T18:00:00Z" }
              as: Dispatcher
            - call: "POST /jobs/${job_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /jobs/${job_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /jobs/${job_id}/safety-check"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /jobs/${job_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /jobs/${job_id}/invoice"
              payload: {}
              as: ServiceManager
              as_user_id: "mgr-1"
            - call: "POST /jobs/${job_id}/pay"
              payload: {}
              as: ServiceManager
              as_user_id: "mgr-1"
            - call: "POST /jobs/${job_id}/close"
              payload: {}
              as: ServiceManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /warranty-plans/${wp_id}/expire"
              payload: {}
              as: ServiceManager
              as_user_id: "mgr-1"
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "response status == 409"

      - name: terminal_cancelled_job_cannot_reschedule
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Job.dispatch_status.UNSCHEDULED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED job (terminal) rejects /schedule with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An accepted job is cancelled while UNSCHEDULED."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ca Ncl", email: "cncl@x.com", service_address: "12 Main" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /technicians"
              payload: { display_name: "Uma", skill_level: "CERTIFIED" }
              as: ServiceManager
              captures: { tech_id: $.data.id }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", quote_type: "SERVICE_CALL", service_call_fee_cents: 5000 }
              as: ServiceManager
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lines"
              payload: { item_kind: "LABOR", qty: 30 }
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /jobs"
              payload: { quote_id: "${quote_id}" }
              as: ServiceManager
              captures: { job_id: "$.data[0].id" }
            - call: "POST /jobs/${job_id}/cancel"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /jobs/${job_id}/schedule"
              payload: { technician_id: "${tech_id}", scheduled_start: "2026-07-01T17:00:00Z", scheduled_end: "2026-07-01T18:00:00Z" }
              as: Dispatcher
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "response status == 409"

      - name: initial_state_quote_is_draft
        claim_type: Initial State
        grounds: [state_machines.Quote, entities.Quote.fields.status]
        distinguishing_aspect: "A freshly created quote has status DRAFT and revision 1."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "In It", email: "init@x.com", service_address: "13 Main" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", quote_type: "INSTALL" }
              as: ServiceManager
              captures: { quote_id: $.data.id, st: $.data.status, rev: $.data.revision }
          assert:
            - "Quote.${quote_id}.status == DRAFT"
            - "Quote.${quote_id}.revision == 1"

  # ===========================================================================
  - section: calculations
    instances:
      - name: financing_monthly_payment_correct_24mo_tier
        claim_type: Correct Result
        grounds: [calculations.financing_monthly_payment, entities.FinancingApplication.fields.monthly_payment_cents]
        distinguishing_aspect: "principal 50900, term 24 -> APR 0.149 tier -> monthly_payment_cents == 2466."
        test_recipe:
          setup: ["A SUBMITTED financing application principal 50900, term 24."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Mo Pay", email: "mopay@x.com", service_address: "14 Main" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
