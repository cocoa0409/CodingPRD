      - name: the_delinquency_sweep_fires_only_past_the_thirty_day_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - state_machines.MemberAssessment.INVOICED_to_DELINQUENT
        distinguishing_aspect: "The sweep condition is strict: a levy certified at 2026-08-01T00:00:00Z is still INVOICED when the clock lands exactly on 2026-08-31T00:00:00Z (30 days later) and only turns DELINQUENT one second past it, with delinquent_member_assessment_count reporting 0 then 1."
        test_recipe:
          setup:
            - "Insolvency in TRIGGERED with a PERSONAL_AUTO profile and one cancelled policy."
            - "One ACTIVE MemberInsurer M1 with premium base 10000000."
            - "Assessment CERTIFIED at the 2026-08-01T00:00:00Z clock default, leaving one MemberAssessment levied 150000 in INVOICED and unpaid."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "PERSONAL_AUTO", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2 }
              as: AssociationAdmin
            - call: "POST /insolvencies"
              payload: { insurer_name: "Great Lakes Mutual Casualty", naic_code: "10001", domiciliary_state_code: "MI", liquidation_order_date: "2026-03-01" }
              as: AssociationAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /policies"
              payload: { insolvency_id: "${ins_id}", policy_number: "PA-1001", line_of_business: "PERSONAL_AUTO", policyholder_name: "Ada Renner", policyholder_state_code: "MI", effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 1200000 }
              as: ReceiverLiaison
            - call: "POST /insolvencies/${ins_id}/trigger"
              payload: {}
              as: AssociationAdmin
            - call: "POST /member-insurers"
              payload: { naic_code: "20001", insurer_name: "Huron Standard Insurance", assessable_line: "PERSONAL_AUTO", base_year: 2025, direct_written_premium_cents: 10000000 }
              as: AssociationAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /assessments"
              payload: { insolvency_id: "${ins_id}", assessable_line: "PERSONAL_AUTO", base_year: 2025, needed_amount_cents: 150000 }
              as: AssessmentOfficer
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/certify"
              payload: {}
              as: AssessmentOfficer
              captures: { certified: $.data.certified_at_utc }
            - call: "GET /member-assessments"
              payload: { assessment_id: "${asmt_id}" }
              as: AssessmentOfficer
              captures: { ma_id: $.data.0.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: AssociationAdmin
              captures: { count_at_boundary: $.data.delinquent_member_assessment_count }
            - call: "GET /member-assessments/${ma_id}"
              payload: {}
              as: AssessmentOfficer
              captures: { bs_at_boundary: $.data.billing_status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:01Z" }
              as: AssociationAdmin
              captures: { count_past_boundary: $.data.delinquent_member_assessment_count }
            - call: "GET /member-assessments/${ma_id}"
              payload: {}
              as: AssessmentOfficer
              captures: { bs_past_boundary: $.data.billing_status }
          assert:
            - "${certified} == 2026-08-01T00:00:00Z"
            - "${count_at_boundary} == 0 and ${bs_at_boundary} == INVOICED"
            - "${count_past_boundary} == 1 and ${bs_past_boundary} == DELINQUENT"
            - "MemberAssessment.${ma_id}.recoupment_status == NOT_STARTED"
            - "Assessment.${asmt_id}.status == CERTIFIED"

      - name: the_punitive_damages_flag_toggles_the_covered_basis
