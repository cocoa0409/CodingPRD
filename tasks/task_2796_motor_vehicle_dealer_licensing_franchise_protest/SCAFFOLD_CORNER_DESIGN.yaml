            - "LicenseApplication.${app_c37_id}.status == SUBMITTED"
            - "LicenseApplication.${app_c37_id}.deficiency_codes == [FACILITY_TOO_SMALL]"
            - "LicenseApplication.${app_c37_id}.decision_outcome == null"
            - "LicenseApplication.${app_c37_id}.fee_total_cents == null"
            - "Dealer.${dlr_c37_id}.license_status == PROSPECTIVE"
            - "Dealer.${dlr_c37_id}.license_effective_on == null"

      - name: renewal_window_opens_exactly_sixty_days_before_expiry
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_49_ERR_RENEWAL_WINDOW_NOT_OPEN
          - validations.priority_51_ERR_TERM_NOT_CONTIGUOUS
          - calculations.license_fee_assessment
        distinguishing_aspect: "The window is inclusive at its opening edge: the identical RENEWAL submit is refused 422 ERR_RENEWAL_WINDOW_NOT_OPEN on 2028-06-30 and succeeds on 2028-07-01 (exactly 60 days before the 2028-08-30 expiry), quoting 111000 with no late penalty."
