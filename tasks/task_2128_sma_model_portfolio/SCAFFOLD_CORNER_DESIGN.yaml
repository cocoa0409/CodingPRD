# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2128 — Separately Managed Account & Model Portfolio Delivery
# Breadth probe over every testable claim §1.1–§1.7 declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: security_creation_returns_full_body_with_system_fields
        claim_type: creation
        grounds: ["entities.Security", "endpoints.POST./sma/securities"]
        distinguishing_aspect: "POST /sma/securities with all required fields returns 201, echoes ticker/name/asset_class/last_price_cents, and stamps a server-minted id plus version 1."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /sma/securities"
              payload: { ticker: "ALFA", name: "Alfa Industrials", asset_class: "US_EQUITY", last_price_cents: 10000 }
              as: PlatformAdmin
              captures: { sec_alfa: "$.data.id" }
          assert:
            - "Response status is 201"
            - "Security.${sec_alfa}.ticker == ALFA and name == 'Alfa Industrials' and asset_class == US_EQUITY"
            - "Security.${sec_alfa}.last_price_cents == 10000 and restricted_globally == false"
            - "Security.${sec_alfa}.version == 1 and created_at is a non-null ISO-8601 UTC timestamp"
            - "Response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == 'object'"

      - name: account_get_with_unknown_id_returns_account_not_found
        claim_type: not_found
        grounds: ["entities.Account", "errors[ERR_ACCOUNT_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "GET /sma/accounts/{id} with a well-formed but unused UUID returns HTTP 404 and error_id ERR_ACCOUNT_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /sma/accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SponsorOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status is 404 with error_id ERR_ACCOUNT_NOT_FOUND"
            - "Response envelope response_type == 'error' and data carries only error_id and message"

      - name: model_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Model.fields.base_fee_bps", "validations[priority=7]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required base_fee_bps from POST /sma/models returns HTTP 400 with ERR_INVALID_REQUEST and creates no Model row."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /sma/models"
              payload: { manager_name: "Cobalt Asset Mgmt", name: "Core Equity", strategy_code: "CORE", asset_class: "US_EQUITY" }
              as: PortfolioManager
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status is 400 with error_id ERR_INVALID_REQUEST"
            - "No Model row exists afterwards"

      - name: account_optional_inputs_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Account.fields.cash_reserve_bps
          - entities.Account.fields.drift_basis
          - entities.Account.fields.tax_overlay_enabled
          - entities.Account.fields.harvest_budget_cents
        distinguishing_aspect: "Creating an account with only the four required fields yields cash_reserve_bps 100, drift_basis SETTLED, tax_overlay_enabled false, harvest_budget_cents 0, cash_cents 0, implementation_status SYNCED and billing_status CURRENT."
        test_recipe:
          setup: ["Model CORE has one PUBLISHED ModelVersion"]
          setup_api_calls:
            - call: "POST /sma/securities"
              payload: { ticker: "ALFA", name: "Alfa Industrials", asset_class: "US_EQUITY", last_price_cents: 10000 }
              as: PlatformAdmin
              captures: { sec_alfa: "$.data.id" }
            - call: "POST /sma/sponsors"
              payload: { name: "Northline Wealth", platform_code: "NRTH", revenue_share_bps: 3333 }
              as: PlatformAdmin
              captures: { sp1: "$.data.id" }
            - call: "POST /sma/models"
              payload: { manager_name: "Cobalt Asset Mgmt", name: "Core Equity", strategy_code: "CORE", asset_class: "US_EQUITY", base_fee_bps: 90 }
              as: PortfolioManager
              captures: { m1: "$.data.id" }
            - call: "POST /sma/model-versions"
              payload: { model_id: "${m1}" }
              as: PortfolioManager
              captures: { mv1: "$.data.id" }
            - call: "POST /sma/model-versions/${mv1}/sleeves"
              payload: { sleeves: [ { security_id: "${sec_alfa}", target_weight_bps: 10000 } ] }
              as: PortfolioManager
            - call: "POST /sma/model-versions/${mv1}/submit"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-1"
            - call: "POST /sma/model-versions/${mv1}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sma/model-versions/${mv1}/publish"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-1"
          trigger:
            - call: "POST /sma/accounts"
              payload: { sponsor_id: "${sp1}", model_id: "${m1}", account_number: "ACC-001" }
              as: SponsorOperator
              as_user_id: "${sp1}"
              captures: { a1: "$.data.id" }
          assert:
            - "Account.${a1}.cash_reserve_bps == 100"
            - "Account.${a1}.drift_basis == SETTLED"
            - "Account.${a1}.tax_overlay_enabled == false"
            - "Account.${a1}.harvest_budget_cents == 0"
            - "Account.${a1}.cash_cents == 0 and market_value_cents == 0"
            - "Account.${a1}.implementation_status == SYNCED and billing_status == CURRENT"
            - "Account.${a1}.current_model_version_id == ${mv1} and pending_model_version_id == null"
            - "Account.${a1}.drift_bps == null and version == 1"

      - name: account_market_value_recomputed_from_open_lots_and_cash
        claim_type: computed_fields
        grounds: ["entities.Account.fields.market_value_cents", "endpoints.POST./sma/accounts/{account_id}/transfers-in"]
        distinguishing_aspect: "market_value_cents is derived, never supplied: after a 2,500,000c deposit plus 1250 ALFA at 10000c it reads 15,000,000c, and re-marking ALFA to 12000c moves it to 17,500,000c with no further write."
        test_recipe:
          setup: ["Account ACC-001 exists on a published Model CORE"]
          setup_api_calls:
            - call: "POST /sma/securities"
              payload: { ticker: "ALFA", name: "Alfa Industrials", asset_class: "US_EQUITY", last_price_cents: 10000 }
              as: PlatformAdmin
              captures: { sec_alfa: "$.data.id" }
            - call: "POST /sma/sponsors"
              payload: { name: "Northline Wealth", platform_code: "NRTH", revenue_share_bps: 3333 }
              as: PlatformAdmin
              captures: { sp1: "$.data.id" }
            - call: "POST /sma/models"
              payload: { manager_name: "Cobalt Asset Mgmt", name: "Core Equity", strategy_code: "CORE", asset_class: "US_EQUITY", base_fee_bps: 90 }
              as: PortfolioManager
              captures: { m1: "$.data.id" }
            - call: "POST /sma/model-versions"
              payload: { model_id: "${m1}" }
              as: PortfolioManager
              captures: { mv1: "$.data.id" }
            - call: "POST /sma/model-versions/${mv1}/sleeves"
              payload: { sleeves: [ { security_id: "${sec_alfa}", target_weight_bps: 10000 } ] }
              as: PortfolioManager
            - call: "POST /sma/model-versions/${mv1}/submit"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-1"
            - call: "POST /sma/model-versions/${mv1}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sma/model-versions/${mv1}/publish"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-1"
            - call: "POST /sma/accounts"
              payload: { sponsor_id: "${sp1}", model_id: "${m1}", account_number: "ACC-001" }
              as: SponsorOperator
              as_user_id: "${sp1}"
              captures: { a1: "$.data.id" }
          trigger:
            - call: "POST /sma/accounts/${a1}/deposits"
              payload: { amount_cents: 2500000 }
              as: SponsorOperator
              as_user_id: "${sp1}"
            - call: "POST /sma/accounts/${a1}/transfers-in"
              payload: { security_id: "${sec_alfa}", shares: 1250, cost_basis_cents: 12500000, origin: "TRANSFER_IN" }
              as: SponsorOperator
              as_user_id: "${sp1}"
              captures: { lot1: "$.data.id" }
            - call: "POST /sma/securities/${sec_alfa}/price"
              payload: { last_price_cents: 12000 }
              as: PlatformAdmin
            - call: "GET /sma/accounts/${a1}"
              payload: {}
              as: SponsorOperator
              captures: { mv_after: "$.data.market_value_cents" }
          assert:
            - "Account.${a1}.market_value_cents == 15000000 right after the transfer-in (2,500,000 cash + 1250 * 10000)"
            - "Account.${a1}.market_value_cents == 17500000 after the re-mark (2,500,000 cash + 1250 * 12000)"
            - "TaxLot.${lot1}.cost_basis_cents == 12500000 — the re-mark never rewrites stored basis"
            - "TaxLot.${lot1}.origin == TRANSFER_IN, status == OPEN, shares_open == 1250, shares_closed == 0"
            - "Account.${a1}.cash_cents == 2500000 — a transfer-in never moves cash"

      - name: model_version_number_is_server_assigned_and_sequential
        claim_type: system_fields
        grounds: ["entities.ModelVersion.fields.version_number", "entities.Model.fields.version_count"]
        distinguishing_aspect: "version_number is server-minted per model: the first DRAFT gets 1 and the second gets 2, and Model.version_count tracks them, with no client input accepted for either."
        test_recipe:
          setup: ["Model CORE exists with no versions"]
          setup_api_calls:
            - call: "POST /sma/models"
              payload: { manager_name: "Cobalt Asset Mgmt", name: "Core Equity", strategy_code: "CORE", asset_class: "US_EQUITY", base_fee_bps: 90 }
              as: PortfolioManager
              captures: { m1: "$.data.id" }
          trigger:
            - call: "POST /sma/model-versions"
              payload: { model_id: "${m1}" }
              as: PortfolioManager
              captures: { mv1: "$.data.id", mv1_num: "$.data.version_number" }
            - call: "POST /sma/model-versions"
              payload: { model_id: "${m1}" }
              as: PortfolioManager
              captures: { mv2: "$.data.id", mv2_num: "$.data.version_number" }
          assert:
            - "ModelVersion.${mv1}.version_number == 1 and status == DRAFT and sleeve_count == 0 and total_target_weight_bps == 0"
            - "ModelVersion.${mv2}.version_number == 2 and status == DRAFT"
            - "Model.${m1}.version_count == 2 and published_model_version_id == null"
            - "ModelVersion.${mv1}.distribution_count == 0 and submitted_by_user_id == null and approved_by_user_id == null"

      - name: security_invalid_asset_class_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.Security.fields.asset_class", "validations[priority=7]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An asset_class outside {US_EQUITY, GLOBAL_EQUITY, FIXED_INCOME, CASH_EQUIV} returns HTTP 400 ERR_INVALID_REQUEST and no Security row is created."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /sma/securities"
              payload: { ticker: "ALFA", name: "Alfa Industrials", asset_class: "CRYPTO", last_price_cents: 10000 }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status is 400 with error_id ERR_INVALID_REQUEST"
            - "GET /sma/securities/{any id} finds nothing — no Security row was created"

      - name: duplicate_account_number_returns_duplicate_key
        claim_type: type_constraints
        grounds: ["entities.Account.fields.account_number", "validations[priority=18]", "errors[ERR_DUPLICATE_KEY]"]
        distinguishing_aspect: "account_number is globally unique: a second account created with account_number ACC-001 returns HTTP 409 ERR_DUPLICATE_KEY even under the same sponsor and model."
        test_recipe:
          setup: ["Account ACC-001 already exists on published Model CORE under sponsor NRTH"]
          setup_api_calls:
            - call: "POST /sma/securities"
              payload: { ticker: "ALFA", name: "Alfa Industrials", asset_class: "US_EQUITY", last_price_cents: 10000 }
              as: PlatformAdmin
              captures: { sec_alfa: "$.data.id" }
            - call: "POST /sma/sponsors"
              payload: { name: "Northline Wealth", platform_code: "NRTH", revenue_share_bps: 3333 }
              as: PlatformAdmin
              captures: { sp1: "$.data.id" }
            - call: "POST /sma/models"
              payload: { manager_name: "Cobalt Asset Mgmt", name: "Core Equity", strategy_code: "CORE", asset_class: "US_EQUITY", base_fee_bps: 90 }
              as: PortfolioManager
              captures: { m1: "$.data.id" }
            - call: "POST /sma/model-versions"
              payload: { model_id: "${m1}" }
              as: PortfolioManager
              captures: { mv1: "$.data.id" }
            - call: "POST /sma/model-versions/${mv1}/sleeves"
              payload: { sleeves: [ { security_id: "${sec_alfa}", target_weight_bps: 10000 } ] }
              as: PortfolioManager
            - call: "POST /sma/model-versions/${mv1}/submit"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-1"
            - call: "POST /sma/model-versions/${mv1}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sma/model-versions/${mv1}/publish"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-1"
            - call: "POST /sma/accounts"
              payload: { sponsor_id: "${sp1}", model_id: "${m1}", account_number: "ACC-001" }
              as: SponsorOperator
              as_user_id: "${sp1}"
              captures: { a1: "$.data.id" }
          trigger:
            - call: "POST /sma/accounts"
              payload: { sponsor_id: "${sp1}", model_id: "${m1}", account_number: "ACC-001" }
              as: SponsorOperator
              as_user_id: "${sp1}"
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status is 409 with error_id ERR_DUPLICATE_KEY"
            - "GET /sma/accounts?sponsor_id=${sp1} returns exactly 1 row"
            - "Sponsor.${sp1}.account_count == 1"

      - name: model_version_create_against_unknown_model_returns_model_not_found
        claim_type: parent_relationships
        grounds: ["entities.ModelVersion.fields.model_id", "validations[priority=6]", "errors[ERR_MODEL_NOT_FOUND]"]
        distinguishing_aspect: "The body FK model_id is resolved before anything else in the body; an unused UUID returns HTTP 404 ERR_MODEL_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /sma/model-versions"
              payload: { model_id: "00000000-0000-4000-8000-000000000000" }
              as: PortfolioManager
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status is 404 with error_id ERR_MODEL_NOT_FOUND"
            - "GET /sma/model-versions returns exactly 0 rows"

      - name: tax_lots_list_filters_by_account_and_security_with_pagination_envelope
        claim_type: listing
        grounds: ["entities.TaxLot", "endpoints.GET./sma/tax-lots"]
        distinguishing_aspect: "GET /sma/tax-lots honours account_id and security_id filters together and returns the four pagination fields; with three ALFA lots and one BETA lot on the account the filtered total_count is 3."
        test_recipe:
          setup: ["Account ACC-001 holds three separate ALFA transfer-in lots and one BETA lot"]
          setup_api_calls:
            - call: "POST /sma/securities"
              payload: { ticker: "ALFA", name: "Alfa Industrials", asset_class: "US_EQUITY", last_price_cents: 10000 }
              as: PlatformAdmin
              captures: { sec_alfa: "$.data.id" }
            - call: "POST /sma/securities"
              payload: { ticker: "BETA", name: "Beta Materials", asset_class: "US_EQUITY", last_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_beta: "$.data.id" }
            - call: "POST /sma/sponsors"
              payload: { name: "Northline Wealth", platform_code: "NRTH", revenue_share_bps: 3333 }
              as: PlatformAdmin
              captures: { sp1: "$.data.id" }
            - call: "POST /sma/models"
              payload: { manager_name: "Cobalt Asset Mgmt", name: "Core Equity", strategy_code: "CORE", asset_class: "US_EQUITY", base_fee_bps: 90 }
              as: PortfolioManager
              captures: { m1: "$.data.id" }
            - call: "POST /sma/model-versions"
              payload: { model_id: "${m1}" }
              as: PortfolioManager
              captures: { mv1: "$.data.id" }
            - call: "POST /sma/model-versions/${mv1}/sleeves"
              payload: { sleeves: [ { security_id: "${sec_alfa}", target_weight_bps: 10000 } ] }
              as: PortfolioManager
            - call: "POST /sma/model-versions/${mv1}/submit"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-1"
            - call: "POST /sma/model-versions/${mv1}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sma/model-versions/${mv1}/publish"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-1"
            - call: "POST /sma/accounts"
              payload: { sponsor_id: "${sp1}", model_id: "${m1}", account_number: "ACC-001" }
              as: SponsorOperator
              as_user_id: "${sp1}"
              captures: { a1: "$.data.id" }
            - call: "POST /sma/accounts/${a1}/transfers-in"
              payload: { security_id: "${sec_alfa}", shares: 10, cost_basis_cents: 100000, origin: "TRANSFER_IN" }
              as: SponsorOperator
              as_user_id: "${sp1}"
              captures: { lot1: "$.data.id" }
            - call: "POST /sma/accounts/${a1}/transfers-in"
              payload: { security_id: "${sec_alfa}", shares: 20, cost_basis_cents: 220000, origin: "TRANSFER_IN" }
              as: SponsorOperator
              as_user_id: "${sp1}"
              captures: { lot2: "$.data.id" }
            - call: "POST /sma/accounts/${a1}/transfers-in"
              payload: { security_id: "${sec_alfa}", shares: 30, cost_basis_cents: 360000, origin: "TRADE" }
              as: SponsorOperator
              as_user_id: "${sp1}"
              captures: { lot3: "$.data.id" }
            - call: "POST /sma/accounts/${a1}/transfers-in"
              payload: { security_id: "${sec_beta}", shares: 40, cost_basis_cents: 200000, origin: "TRANSFER_IN" }
              as: SponsorOperator
              as_user_id: "${sp1}"
              captures: { lot4: "$.data.id" }
          trigger:
            - call: "GET /sma/tax-lots"
              payload: { account_id: "${a1}", security_id: "${sec_alfa}", limit: 2, offset: 0 }
              as: SponsorOperator
              captures: { first_lot: "$.data[0].id" }
            - call: "GET /sma/tax-lots"
              payload: { account_id: "${a1}", security_id: "${sec_alfa}", origin: "TRADE" }
              as: SponsorOperator
              captures: { trade_lot: "$.data[0].id" }
          assert:
            - "The first read returns 2 rows with total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "Ordering is created_at ASC then sequence_number ASC, so ${first_lot} == ${lot1}"
            - "The origin-filtered read returns exactly 1 row and ${trade_lot} == ${lot3}"
            - "Account.${a1}.market_value_cents == 800000 (10+20+30 ALFA at 10000c plus 40 BETA at 5000c)"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: submit_from_approved_model_version_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.ModelVersion.DRAFT_to_PENDING_APPROVAL", "validations[priority=11]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "submit is declared only from DRAFT; issuing it on an APPROVED version returns HTTP 409 ERR_INVALID_STATE and leaves status APPROVED with submitted_by_user_id untouched."
        test_recipe:
          setup: ["ModelVersion v1 of Model CORE is APPROVED, submitted by pm-1 and approved by co-1"]
          setup_api_calls:
            - call: "POST /sma/securities"
              payload: { ticker: "ALFA", name: "Alfa Industrials", asset_class: "US_EQUITY", last_price_cents: 10000 }
              as: PlatformAdmin
              captures: { sec_alfa: "$.data.id" }
            - call: "POST /sma/models"
              payload: { manager_name: "Cobalt Asset Mgmt", name: "Core Equity", strategy_code: "CORE", asset_class: "US_EQUITY", base_fee_bps: 90 }
              as: PortfolioManager
              captures: { m1: "$.data.id" }
            - call: "POST /sma/model-versions"
              payload: { model_id: "${m1}" }
              as: PortfolioManager
              captures: { mv1: "$.data.id" }
            - call: "POST /sma/model-versions/${mv1}/sleeves"
              payload: { sleeves: [ { security_id: "${sec_alfa}", target_weight_bps: 10000 } ] }
              as: PortfolioManager
            - call: "POST /sma/model-versions/${mv1}/submit"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-1"
            - call: "POST /sma/model-versions/${mv1}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /sma/model-versions/${mv1}/submit"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status is 409 with error_id ERR_INVALID_STATE"
            - "ModelVersion.${mv1}.status == APPROVED and approved_by_user_id == 'co-1'"

      - name: publish_from_draft_model_version_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.ModelVersion.APPROVED_to_PUBLISHED", "validations[priority=11]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "publish is declared only from APPROVED; issuing it on a DRAFT version returns HTTP 409 ERR_INVALID_STATE and Model.published_model_version_id stays null."
        test_recipe:
          setup: ["ModelVersion v1 of Model CORE is DRAFT with balanced sleeves but has never been submitted"]
          setup_api_calls:
            - call: "POST /sma/securities"
              payload: { ticker: "ALFA", name: "Alfa Industrials", asset_class: "US_EQUITY", last_price_cents: 10000 }
              as: PlatformAdmin
              captures: { sec_alfa: "$.data.id" }
            - call: "POST /sma/models"
              payload: { manager_name: "Cobalt Asset Mgmt", name: "Core Equity", strategy_code: "CORE", asset_class: "US_EQUITY", base_fee_bps: 90 }
              as: PortfolioManager
              captures: { m1: "$.data.id" }
            - call: "POST /sma/model-versions"
              payload: { model_id: "${m1}" }
              as: PortfolioManager
              captures: { mv1: "$.data.id" }
            - call: "POST /sma/model-versions/${mv1}/sleeves"
              payload: { sleeves: [ { security_id: "${sec_alfa}", target_weight_bps: 10000 } ] }
              as: PortfolioManager
          trigger:
            - call: "POST /sma/model-versions/${mv1}/publish"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status is 409 with error_id ERR_INVALID_STATE"
            - "ModelVersion.${mv1}.status == DRAFT and published_at == null"
            - "Model.${m1}.published_model_version_id == null"

      - name: superseded_model_version_rejects_every_further_transition
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.ModelVersion.APPROVED_to_PUBLISHED", "errors[ERR_INVALID_STATE]"]
