  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: overlap_page_spread_collides_adjacent_slot
        grounds:
          - validations[priority=13]
          - entities.LadderPage.fields.spread_span
          - errors[ERR_PAGE_NUMBER_CONFLICT]
        distinguishing_aspect: |
          Interval semantics: a page occupies the half-open run [page_number, page_number+spread_span).
          A spread_span=2 page at page_number 7 occupies {7,8}; a later single page at page_number 8
          collides on the shared slot 8 → ERR_PAGE_NUMBER_CONFLICT. The overlap is geometric over a
          multi-slot span, not a single-point uniqueness check.
        test_recipe:
          setup:
            - "Yearbook target_page_count=96. A spread page at page_number 7, spread_span 2 (occupies 7-8)."
          setup_api_calls:
            - call: "POST /yearbooks"
              payload: { school_name: "Lincoln High", academic_year: "2025-2026", target_page_count: 96, unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb: $.data.id }
            - call: "POST /yearbooks/pages"
              payload: { yearbook_id: "${yb}", page_number: 7, section: "SPORTS", template_code: "T-SPREAD", spread_span: 2 }
              as: Adviser
              as_user_id: "adv-1"
              captures: { spread: $.data.id }
          trigger:
            - call: "POST /yearbooks/pages"
              payload: { yearbook_id: "${yb}", page_number: 8, section: "CLUBS", template_code: "T" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_PAGE_NUMBER_CONFLICT"

      - name: overlap_presale_window_early_standard_partition
        grounds:
          - calculations.presale_price
          - entities.Yearbook.fields.presale_open_iso
          - entities.Yearbook.fields.presale_close_iso
        distinguishing_aspect: |
          Different interval semantics on a different resource (the Yearbook's presale time window):
          the window is partitioned [open, close) = EARLY and [close, +inf) = STANDARD with a
          half-open boundary at close — an order at EXACTLY presale_close_iso falls to STANDARD, not
          EARLY. This is adjacency-of-intervals arithmetic on time, distinct from the page-span
          aggregate-slot collision above.
        test_recipe:
          setup:
            - "Yearbook presale_close_iso=2026-03-01T00:00:00Z. Clock set to EXACTLY close."
          setup_api_calls:
            - call: "POST /yearbooks"
              payload: { school_name: "Lincoln High", academic_year: "2025-2026", target_page_count: 96, unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
          trigger:
            - call: "POST /yearbooks/presale-orders"
              payload: { yearbook_id: "${yb}", buyer_name: "At Close", quantity: 1 }
              as: SalesRep
              as_user_id: "sr-1"
              captures: { ord: $.data.id }
          assert:
            - "response status == 201"
            - "PreSaleOrder.${ord}.price_tier == STANDARD"
            - "PreSaleOrder.${ord}.total_price_cents == 8000"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: compensating_ad_revenue_sign_then_void
        grounds:
          - state_machines.AdContract.DRAFT_to_SIGNED
          - state_machines.AdContract.SIGNED_to_VOIDED
          - entities.Yearbook.fields.ad_revenue_cents
        distinguishing_aspect: |
          Conserved quantity #1 = Yearbook.ad_revenue_cents. Forward action sign adds
          net_price_cents (21600) to ad_revenue_cents; the compensating void of a SIGNED contract
          subtracts the same net_price_cents, leaving ad_revenue_cents EXACTLY at its pre-sign value
          (0). Invariant: ad_revenue_cents == sum(net_price_cents over {SIGNED,PLACED} contracts).
        test_recipe:
          setup:
            - "Yearbook, ADS page #2, AdContract HALF disc 0.10 (net 21600) SIGNED so ad_revenue_cents=21600."
          setup_api_calls:
            - call: "POST /yearbooks"
              payload: { school_name: "Lincoln High", academic_year: "2025-2026", target_page_count: 96, unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb: $.data.id }
            - call: "POST /yearbooks/pages"
              payload: { yearbook_id: "${yb}", page_number: 2, section: "ADS", template_code: "T-AD" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { pg: $.data.id }
            - call: "POST /yearbooks/ad-contracts"
              payload: { yearbook_id: "${yb}", ladder_page_id: "${pg}", sponsor_name: "Joe Pizza", size: "HALF", discount_pct: 0.10 }
              as: SalesRep
              as_user_id: "sr-1"
              captures: { ad: $.data.id }
            - call: "POST /yearbooks/ad-contracts/${ad}/sign"
              payload: {}
              as: SalesRep
              as_user_id: "sr-1"
          trigger:
            - call: "POST /yearbooks/ad-contracts/${ad}/void"
              payload: {}
              as: SalesRep
              as_user_id: "sr-1"
            - call: "GET /yearbooks/${yb}"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
              captures: { adrev: $.data.ad_revenue_cents }
          assert:
            - "AdContract.${ad}.status == VOIDED"
            - "Yearbook.${yb}.ad_revenue_cents == 0"

      - name: compensating_presale_revenue_pay_then_cancel
        grounds:
          - state_machines.PreSaleOrder.PLACED_to_PAID
          - state_machines.PreSaleOrder.PAID_to_CANCELLED
          - entities.Yearbook.fields.presale_revenue_cents
        distinguishing_aspect: |
          Different conserved quantity #2 = Yearbook.presale_revenue_cents. Forward action pay adds
          total_price_cents (6500) to presale_revenue_cents; the compensating cancel of a PAID order
          subtracts the same total, restoring presale_revenue_cents to its pre-pay value (0).
          Invariant: presale_revenue_cents == sum(total_price_cents over {PAID,FULFILLED} orders).
        test_recipe:
          setup:
            - "Clock at 2026-02-01 (EARLY). One PreSaleOrder qty1 PAID so presale_revenue_cents=6500."
          setup_api_calls:
            - call: "POST /yearbooks"
              payload: { school_name: "Lincoln High", academic_year: "2025-2026", target_page_count: 96, unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
            - call: "POST /yearbooks/presale-orders"
              payload: { yearbook_id: "${yb}", buyer_name: "Pat", quantity: 1 }
              as: SalesRep
              as_user_id: "sr-1"
              captures: { ord: $.data.id }
            - call: "POST /yearbooks/presale-orders/${ord}/pay"
              payload: {}
              as: SalesRep
              as_user_id: "sr-1"
          trigger:
            - call: "POST /yearbooks/presale-orders/${ord}/cancel"
              payload: {}
              as: SalesRep
              as_user_id: "sr-1"
            - call: "GET /yearbooks/${yb}"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
              captures: { presrev: $.data.presale_revenue_cents }
          assert:
            - "PreSaleOrder.${ord}.status == CANCELLED"
            - "Yearbook.${yb}.presale_revenue_cents == 0"
