            - { call: "POST /api/production-runs/${r1}/complete", payload: { actual_units: 10, waste_units: 0 }, as: PlantScheduler, as_user_id: "${pl1}" }
            - { call: "POST /api/orders", payload: { delivery_week: "2026-09-07", lines: [ { product_id: "${p1}", qty_requested: 10 } ] }, as: DistributorRep, as_user_id: "${d1}", captures: { o1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T00:00:00Z" }, as: BrandAdmin }
          trigger:
            - { call: "POST /api/orders/allocate-week", payload: { delivery_week: "2026-09-07" }, as: PlantScheduler, as_user_id: "${pl1}" }
          assert:
            - "Order.${o1}.allocation_status == SHORTED with qty_allocated == 0 (expired lot excluded from the pool)"

