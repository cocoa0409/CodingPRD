              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Damage 1" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo1: $.data.id }
            - call: "POST /work-orders/${wo1}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
            - call: "POST /work-orders/${wo1}/start"
              payload: { resident_consent_confirmed: true }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo1}/sign-off"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
            - call: "POST /work-orders/${wo1}/complete"
              payload: { photo_urls: ["https://x/n1.jpg"], damage_reported: true, estimated_damage_cost_cents: 5000 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /chargebacks"
              payload: { work_order_id: "${wo1}" }
              as: PropertyManager
              captures: {cb1: "$.data[0].id"}
            - call: "POST /chargebacks/${cb1}/events"
              payload: { event_type: "BILL", line_items: [{ description: "Repair", quantity: 1, unit_cost_cents: 5000, resident_share_pct: 1.0 }] }
              as: PropertyManager
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Damage 2" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo2: $.data.id }
            - call: "POST /work-orders/${wo2}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T14:00:00Z", scheduled_end_at: "2026-08-01T16:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
            - call: "POST /work-orders/${wo2}/start"
              payload: { resident_consent_confirmed: true }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo2}/sign-off"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
            - call: "POST /work-orders/${wo2}/complete"
              payload: { photo_urls: ["https://x/n2.jpg"], damage_reported: true, estimated_damage_cost_cents: 7000 }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "GET /residents/${res_id}"
              payload: {}
              as: PropertyManager
              captures: { bal: $.data.chargeback_balance_cents }
          assert:
            - "chargeback_balance_cents == 5000 (BILLED chargeback only)"
            - "The PENDING chargeback (provisional 7000) is excluded from the balance"
            - "GET /chargebacks?resident_id=${res_id} returns total_count == 2"

      - name: sla_report_variants_covered_by_difficulty
        claim_type: variant_divergence
        grounds: [calculations.sla_compliance_report]
        excluded_because:
          difficulty_instance: dual_variant_calc / sla_report_open_inclusive_vs_closed_only
          rationale: "Both bases and their divergence are asserted by the named §1.8 instance."

