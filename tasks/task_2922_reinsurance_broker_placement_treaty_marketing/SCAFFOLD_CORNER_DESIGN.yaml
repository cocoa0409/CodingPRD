      - name: market_submission_and_quote_constraints_bind_across_three_entities
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=54]
          - validations[priority=38]
          - validations[priority=25]
          - validations[priority=55]
          - errors.ERR_DUPLICATE_MARKET_SUBMISSION
          - errors.ERR_LEAD_NOT_AUTHORISED
          - errors.ERR_MARKET_SUBMISSION_CLOSED
          - errors.ERR_LINE_EXCEEDS_OFFER
        distinguishing_aspect: |
          Four constraints on the submission → quote → firm-order chain each read a field of a
          DIFFERENT entity than the one being written. The duplicate-submission rule is scoped to
          (layer_id, reinsurer_id) in status SENT **or** QUOTED, so it still bites after the market
          has answered; is_lead is checked against Reinsurer.lead_authorised, not against the quote;
          a second quote on the same submission is refused because the submission has left SENT;
          and accepted_line_pct is bounded by Quote.offered_line_pct with equality allowed. The
          final probe also shows that a rejected firm order does NOT advance Layer.version, so the
          OCC token read before the refusal is still good for the retry.
        test_recipe:
          setup:
            - "An IN_MARKET program with one IN_MARKET catastrophe layer."
            - "Alpha Re is lead_authorised; Bravo Re is not."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
