              payload: { client_id: "${maya_ok_id}", class_session_id: "${sess_ok3_id}", channel: "STUDIO", payment_source: "CLASS_PACK", class_pack_id: "${pack_id}" }
              as: Client
              as_user_id: "${maya_ok_id}"
              captures: { bk_use_id: $.data.id }
          trigger:
            - call: "POST /wellness/bookings/${bk_use_id}/cancel"
              payload: { reason: "schedule conflict" }
              as: Client
              as_user_id: "${maya_ok_id}"
            - call: "POST /_inject/client-entitlement"
              payload: { client_id: "${maya_ok_id}", studio_id: "${studio_ok_id}", kind: "CLASS_PACK", credits: 0 }
              as: OperatorOnly
              captures: { empty_pack_id: $.data.entity_id }
            - call: "POST /wellness/bookings"
              payload: { client_id: "${maya_ok_id}", class_session_id: "${sess_ok3_id}", channel: "STUDIO", payment_source: "CLASS_PACK", class_pack_id: "${empty_pack_id}" }
              as: Client
