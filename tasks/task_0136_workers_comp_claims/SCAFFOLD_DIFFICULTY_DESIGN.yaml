            - "Had disability_days been 13, the amount would be 85716 (6 compensable days), confirming the >= boundary at 14."

      - name: ime_window_touching_endpoints_no_overlap
        grounds:
          - validations[priority=10]
          - entities.IMEOrder.fields.scheduled_start
          - entities.IMEOrder.fields.scheduled_end
        distinguishing_aspect: |
          Interval/empty-edge boundary on a DIFFERENT metric (time-window adjacency)
          and DIFFERENT endpoint (POST /ime-orders): two IME windows that merely touch
          at an endpoint ([10:00,11:00) then [11:00,12:00)) do NOT overlap and the
          second is accepted, whereas a 1-second earlier start collides.
        test_recipe:
          setup:
            - "Claim A with one SCHEDULED IME [2026-03-10T10:00:00Z, 2026-03-10T11:00:00Z)."
          setup_api_calls:
