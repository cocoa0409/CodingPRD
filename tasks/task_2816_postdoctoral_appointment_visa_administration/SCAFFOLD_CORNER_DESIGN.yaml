        grounds:
          - roles.PostdocAffairsOfficer
          - roles.FacultyMentor
          - endpoints.POST /_clock/set_current_utc
        distinguishing_aspect: "All six declared roles are exercised on their own exclusive operations inside one appointment lifecycle - officer creates and issues, HRCompensationApprover verifies the award, Postdoc accepts, InternationalScholarAdvisor files the petition, ExportControlReviewer records the screen, FacultyMentor requests the bench - and the shared surface is confirmed to be genuinely shared: the same GET /appointments/{id} returns the identical row to all six roles, and POST /_clock/set_current_utc is accepted from a role that owns none of the appointment's data."
