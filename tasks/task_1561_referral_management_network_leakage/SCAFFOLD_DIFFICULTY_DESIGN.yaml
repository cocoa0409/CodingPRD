              payload: { to_iso8601: "2026-08-01T14:15:00Z" }
              as: NetworkAdmin
            - call: "POST /appointments/${a3}/mark-no-show"
              as: ReferralCoordinator
            - call: "POST /appointments/${a2}/excuse"
              payload: { reason: "Transport verified" }
              as: ReferralCoordinator
          assert:
            - "after 3 no-shows: Patient.${pt1}.no_show_strikes == 3, status == OUTREACH_REQUIRED, Referral.${r4}.escalation_flag == true"
            - "after excuse: no_show_strikes == 2 == COUNT(appointments in NO_SHOW) (a1 and a3 remain NO_SHOW; a2 is EXCUSED)"
            - "Patient.${pt1}.status == ACTIVE again and Referral.${r4}.escalation_flag == false (full compensation, no drift)"

      - name: booked_slot_compensation
        grounds:
          - calculations.panel_utilization
          - state_machines.Appointment.SCHEDULED_to_CANCELLED
          - state_machines.Appointment.CONFIRMED_to_COMPLETED
          - entities.SpecialistProvider.fields.booked_appointments_count
        distinguishing_aspect: |
          Conserved quantity: specialist slot inventory — booked_appointments_count
          == COUNT(appointments of the specialist in {SCHEDULED, CONFIRMED}) at
          every step. Book (+1), cancel (-1) and confirm+complete (-1) pairs leave
          the counter consistent; distinct quantity from the patient strike ledger
          in strike_excuse_compensation.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; plan; S1 capacity 10 with participation; provider PA; patient PT; R1 booked 2026-08-02T10:00-11:00, R2 booked 2026-08-02T12:00-13:00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /insurance-plans"
              payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }
              as: NetworkAdmin
              captures: { plan1: $.data.id }
            - call: "POST /specialty-providers"
              payload: { name: "S1", npi: "1000000001", specialty: "CARDIOLOGY", base_region: "NORTH", weekly_capacity: 10 }
              as: NetworkAdmin
              captures: { s1: $.data.id }
            - call: "POST /network-participations"
              payload: { specialist_id: "${s1}", insurance_plan_id: "${plan1}", tier: "PREFERRED", effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: NetworkAdmin
            - call: "POST /referring-providers"
              payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }
              as: NetworkAdmin
              captures: { pa: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }
              as: NetworkAdmin
              captures: { pt1: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }
              as: ReferringProvider
              as_user_id: "${pa}"
              captures: { r1: $.data.id }
            - call: "POST /referrals/${r1}/accept"
              as: ReferralCoordinator
            - call: "POST /referrals/${r1}/assign-specialist"
              payload: { specialist_id: "${s1}" }
              as: ReferralCoordinator
              captures: { r1_v: $.data.version }
            - call: "POST /referrals/${r1}/appointments"
              payload: { expected_referral_version: "${r1_v}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }
              as: ReferralCoordinator
              captures: { a1: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I11", urgency: "ROUTINE" }
              as: ReferringProvider
              as_user_id: "${pa}"
              captures: { r2: $.data.id }
            - call: "POST /referrals/${r2}/accept"
              as: ReferralCoordinator
            - call: "POST /referrals/${r2}/assign-specialist"
              payload: { specialist_id: "${s1}" }
              as: ReferralCoordinator
              captures: { r2_v: $.data.version }
            - call: "POST /referrals/${r2}/appointments"
              payload: { expected_referral_version: "${r2_v}", scheduled_start: "2026-08-02T12:00:00Z", scheduled_end: "2026-08-02T13:00:00Z" }
              as: ReferralCoordinator
              captures: { a2: $.data.id }
          trigger:
            - call: "GET /specialty-providers/${s1}"
              as: ReferralCoordinator
              captures: { booked0: $.data.booked_appointments_count }
            - call: "POST /appointments/${a1}/cancel"
              as: ReferralCoordinator
            - call: "GET /specialty-providers/${s1}"
              as: ReferralCoordinator
              captures: { booked1: $.data.booked_appointments_count }
            - call: "POST /appointments/${a2}/confirm"
              payload: { confirmation_channel: "PHONE" }
              as: ReferralCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T12:00:00Z" }
              as: NetworkAdmin
            - call: "POST /appointments/${a2}/complete"
              as: SpecialistProvider
              as_user_id: "${s1}"
            - call: "GET /specialty-providers/${s1}"
              as: ReferralCoordinator
              captures: { booked2: $.data.booked_appointments_count }
          assert:
            - "after two bookings: booked_appointments_count == 2"
            - "after cancel of A1: booked_appointments_count == 1 (cancel compensates the booking)"
            - "after confirm+complete of A2: booked_appointments_count == 0 (completion releases the slot)"
            - "Referral.${r1}.status == ACCEPTED after A1 cancel; Referral.${r2}.status == VISIT_COMPLETED after A2 complete"
