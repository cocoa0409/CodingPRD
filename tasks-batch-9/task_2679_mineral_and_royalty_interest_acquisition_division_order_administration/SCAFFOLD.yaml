scenario: |
  Generate task harder than expert level!

  2679. Mineral and Royalty Interest Acquisition & Division Order Administration (mineral royalty acquisition firm): title research through county records to establish net mineral acres and burdens, valuation from production decline curves, operator activity and undeveloped acreage upside, offer letters, purchase and sale agreements and defect curative periods, deed recording, ownership change notice and division order execution with the operator, revenue check detail reconciliation against expected decimal interest, suspense account resolution for title defects and unlocatable owners, unitization, pooling elections and pugh clause effects, severance tax and depletion reporting to owners

domain_name: mineral-royalty-acquisition-division-order
api_prefix: ""   # flat top-level resource paths; every collection is its own root segment

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Compliance / audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
    - version_pinning_on_approval

  entity_topology: graph
  # Unit <-> Tract is a true many-to-many through UnitTractAllocation (a junction
  # entity carrying its own temporal interval, acreage and pooling election), and
  # MineralInterest / PurchaseSaleAgreement / DivisionOrder all reference across
  # aggregate boundaries (tract chain-of-title vs unit acreage pool vs revenue
  # ledger). No single ownership tree exists: the same Tract participates in many
  # Units and the same MineralInterest is settled through many DivisionOrders.

  state_machine_shape: cyclic
  # OfferLetter negotiates in rounds (SENT -> COUNTERED -> REVISED -> COUNTERED),
  # TitleDefect cures in rounds (RAISED -> CURE_SUBMITTED -> CURE_REJECTED ->
  # CURE_SUBMITTED), MineralInterest reverts UNDER_PSA -> PROSPECT when a PSA
  # terminates, and DivisionOrder loops SENT -> DISPUTED -> SENT on correction.
  # PurchaseSaleAgreement additionally carries two independent state dimensions
  # (curative_status x funding_status) with a derived psa_status, and
  # DivisionOrder branches SENT -> {EXECUTED, DISPUTED} with divergent side
  # effects per branch.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  # Two hard SoD constraints are enforced on X-User-ID:
  #   (1) the AcquisitionManager who created the CURRENT Valuation may not issue
  #       the OfferLetter priced against it;
  #   (2) the DivisionOrderAdmin who created a DivisionOrder may not release the
  #       SuspenseAccount that its own revenue variance produced.
  # Beyond SoD the roles are also peer-scoped: TitleAnalyst owns chain-of-title,
  # AcquisitionManager owns valuation/offer/PSA, Operator owns unit + revenue
  # reporting, DivisionOrderAdmin owns division orders + suspense, RoyaltyOwner
  # acts only on its own offers/cures.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: Tract
    parent: null
    common_fields: true
    fields:
      - name: county
        type: string
        source: input
        description: County whose deed records were searched.
        constraints: "1..80 chars, non-empty"
      - name: state_code
        type: enum
        source: input
        description: State in which the tract lies; drives the severance-tax table only when the tract is the producing state.
        constraints: "one of {TX, OK, NM, ND}"
      - name: gross_acres
        type: number
        source: input
        description: Surveyed gross surface acres of the tract; the denominator of every ownership fraction.
        constraints: "> 0, 4 decimal places"
      - name: operator_activity_tier
        type: enum
        source: input
        default: MODERATE
        description: Operator-activity classification used as the undeveloped-upside multiplier in valuation.
        constraints: "one of {HIGH, MODERATE, LOW}"
      - name: title_status
        type: enum
        source: system
        default: RESEARCH
        description: Chain-of-title posture; gates MineralInterest creation and offer issuance.
        constraints: "one of {RESEARCH, CERTIFIED}"
      - name: net_mineral_acres_certified
        type: number
        source: computed
        default: null
        description: Net mineral acres surviving the chronological chain replay; null while title_status == RESEARCH. See calculations.net_mineral_acres_from_chain.
        constraints: "4 decimal places, >= 0"
      - name: existing_burden_fraction
        type: number
        source: computed
        default: null
        description: Aggregate outstanding ORRI burden carved out of the tract by ASSIGNMENT instruments, capped. See calculations.tract_burden_fraction.
        constraints: "4 decimal places, 0 <= x <= 0.2500"
      - name: chain_entry_count
        type: integer
        source: computed
        default: 0
        description: Count of TitleChainEntry rows recorded against this tract.
      - name: certified_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant at which title_status last became CERTIFIED.

  - name: TitleChainEntry
    parent: Tract
    common_fields: false
    fields:
      - name: tract_id
        type: string
        source: input
        description: "FK -> Tract.id; the tract whose county records produced this instrument."
      - name: instrument_type
        type: enum
        source: input
        description: Instrument class; decides how the chronological replay mutates the running acreage.
        constraints: "one of {PATENT, DEED, PROBATE, ASSIGNMENT}"
      - name: instrument_date
        type: string
        source: input
        description: Recorded instrument date; primary sort key of the chronological chain replay.
        constraints: "ISO 8601 date YYYY-MM-DD"
      - name: conveyed_fraction
        type: number
        source: input
        default: null
        description: Fractional operand. Required for PATENT (mineral fraction severed to the patentee), PROBATE (fraction devised to the subject line) and ASSIGNMENT (ORRI burden fraction). MUST be null for DEED.
        constraints: "0 < x <= 1, 6 decimal places"
      - name: conveyed_acres
        type: number
        source: input
        default: null
        description: Absolute net mineral acres granted out of the subject line. Required for DEED; MUST be null for PATENT, PROBATE and ASSIGNMENT.
        constraints: ">= 0, 4 decimal places"
      - name: county_book_page
        type: string
        source: input
        description: County clerk book/page citation; unique per tract_id.
        constraints: "matches ^[0-9]{1,6}/[0-9]{1,6}$"
      - name: grantor_name
        type: string
        source: input
        description: Grantor as recited on the instrument.
      - name: grantee_name
        type: string
        source: input
        description: Grantee as recited on the instrument.

  - name: RoyaltyOwner
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Owner-of-record legal name as it will appear on the division order and the tax statement.
      - name: state_code
        type: enum
        source: input
        description: Owner's state of residence; used for the escheat destination default.
        constraints: "one of {TX, OK, NM, ND}"
      - name: contact_status
        type: enum
        source: input
        default: LOCATED
        description: Locatability posture; gates suspense release and forces UNLOCATABLE_OWNER suspense on new revenue checks.
        constraints: "one of {LOCATED, UNLOCATABLE, DECEASED_ESTATE_OPEN}"
      - name: tax_id_on_file
        type: boolean
        source: input
        default: false
        description: Whether a signed W-9 is on file; required before a suspense account may be released.
      - name: mailing_address
        type: string
        source: input
        default: null
        description: Mailing address of record for check and 1099 delivery.
      - name: suspense_total
        type: number
        source: computed
        default: 0.00
        description: Sum of SuspenseAccount.accrued_amount over this owner's accounts whose suspense_status == ACCRUING.
        constraints: "2 decimal places"

  - name: MineralInterest
    parent: null
    common_fields: true
    fields:
      - name: tract_id
        type: string
        source: input
        description: "FK -> Tract.id; the tract the interest is carved from. Tract MUST be CERTIFIED at creation."
      - name: seller_owner_id
        type: string
        source: input
        description: "FK -> RoyaltyOwner.id; the owner of record who would convey this interest."
      - name: seller_share_fraction
        type: number
        source: input
        description: Share of the tract's certified net mineral acres held by this seller.
        constraints: "0 < x <= 1, 6 decimal places"
      - name: lease_royalty_rate
        type: number
        source: input
        description: Lease royalty rate reserved on the interest (for example 0.1875 for 3/16).
        constraints: "0 < x <= 1, 6 decimal places"
      - name: undeveloped_net_acres
        type: number
        source: input
        description: Net mineral acres considered undeveloped upside at intake; the Valuation may restate it.
        constraints: ">= 0, 4 decimal places"
      - name: net_mineral_acres
        type: number
        source: computed
        description: "round(tract.net_mineral_acres_certified * seller_share_fraction, 4), fixed at creation from the tract's certified figure."
        constraints: "4 decimal places, >= 0"
      - name: existing_burden_fraction
        type: number
        source: computed
        description: Copy of tract.existing_burden_fraction at creation; the ORRI carve-out subtracted from the lease royalty rate when the decimal interest is built.
        constraints: "4 decimal places"
      - name: interest_status
        type: enum
        source: system
        default: PROSPECT
        description: Acquisition lifecycle posture of the interest.
        constraints: "one of {PROSPECT, OFFERED, UNDER_PSA, ACQUIRED, RELEASED}"
      - name: current_valuation_id
        type: string
        source: system
        default: null
        description: Denormalised pointer to the Valuation of this interest whose valuation_status == CURRENT; the authoritative link is Valuation.mineral_interest_id. Null until the first valuation is filed.
      - name: acquiring_deed_book_page
        type: string
        source: system
        default: null
        description: County book/page of the recorded deed that moved this interest to ACQUIRED; null otherwise.

  - name: Valuation
    parent: MineralInterest
    common_fields: true
    fields:
      - name: mineral_interest_id
        type: string
        source: input
        description: "FK -> MineralInterest.id; the interest being valued."
      - name: current_monthly_net_revenue
        type: number
        source: input
        description: Trailing-month net royalty revenue attributable to the interest; the first-year cash-flow base of the decline curve.
        constraints: ">= 0, 2 decimal places"
      - name: annual_decline_rate
        type: number
        source: input
        description: Annual production decline applied as a step decay across the five-year horizon.
        constraints: "0 <= x < 1, 6 decimal places"
      - name: undeveloped_net_acres
        type: number
        source: input
        description: Net mineral acres priced as undeveloped upside in this valuation.
        constraints: ">= 0, 4 decimal places"
      - name: operator_activity_tier
        type: enum
        source: computed
        description: Copy of the tract's operator_activity_tier at valuation time; selects the undeveloped-upside multiplier.
        constraints: "one of {HIGH, MODERATE, LOW}"
      - name: pdp_pv
        type: number
        source: computed
        description: Present value of proved-developed-producing cash flow. See calculations.valuation_bid_band.
        constraints: "2 decimal places"
      - name: undeveloped_pv
        type: number
        source: computed
        description: Risked present value of undeveloped acreage upside. See calculations.valuation_bid_band.
        constraints: "2 decimal places"
      - name: bid_floor
        type: number
        source: computed
        description: PDP-only burden-adjusted bid (variant pdp_only of calculations.valuation_bid_band); the minimum acceptable offer.
        constraints: "2 decimal places"
      - name: max_bid
        type: number
        source: computed
        description: PDP-plus-risked-upside burden-adjusted bid (variant risked_upside of calculations.valuation_bid_band); the maximum authorised offer.
        constraints: "2 decimal places"
      - name: valuation_status
        type: enum
        source: system
        default: CURRENT
        description: CURRENT when this is the interest's live valuation, SUPERSEDED when a newer valuation replaced it, STALE when a PSA termination invalidated it.
        constraints: "one of {CURRENT, SUPERSEDED, STALE}"
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the AcquisitionManager who filed this valuation; the segregation-of-duties counterparty for offer issuance.

  - name: OfferLetter
    parent: MineralInterest
    common_fields: true
    fields:
      - name: mineral_interest_id
        type: string
        source: input
        description: "FK -> MineralInterest.id; the interest under offer."
      - name: offer_amount
        type: number
        source: input
        description: Opening offer amount in dollars; must sit inside the CURRENT valuation's [bid_floor, max_bid] band.
        constraints: "> 0, 2 decimal places"
      - name: expires_on
        type: string
        source: input
        description: Last date on which the offer may be countered or accepted, inclusive.
        constraints: "ISO 8601 date YYYY-MM-DD"
      - name: current_amount
        type: number
        source: computed
        description: Live amount on the table - offer_amount initially, then the latest revised_amount after each REVISED transition.
        constraints: "2 decimal places"
      - name: last_counter_amount
        type: number
        source: system
        default: null
        description: Amount named in the most recent owner counter; null before the first counter.
      - name: counter_round_count
        type: integer
        source: computed
        default: 0
        description: Number of owner counters recorded on this offer; capped by MAX_COUNTER_ROUNDS.
      - name: offer_status
        type: enum
        source: system
        default: SENT
        description: Negotiation posture of the offer.
        constraints: "one of {SENT, COUNTERED, REVISED, ACCEPTED, REJECTED, EXPIRED, VOIDED}"
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the AcquisitionManager who issued the offer.
      - name: accepted_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the ACCEPTED transition; null otherwise.

  - name: PurchaseSaleAgreement
    parent: null
    common_fields: true
    fields:
      - name: offer_letter_id
        type: string
        source: input
        description: "FK -> OfferLetter.id; the ACCEPTED offer this agreement papers."
      - name: mineral_interest_id
        type: string
        source: computed
        description: "FK -> MineralInterest.id; copied from the offer letter at creation."
      - name: tract_id
        type: string
        source: computed
        description: "FK -> Tract.id; copied from the mineral interest at creation; the resource whose PSA occupancy window is exclusive."
      - name: purchase_price
        type: number
        source: computed
        description: OfferLetter.current_amount frozen at PSA creation.
        constraints: "2 decimal places"
      - name: effective_date
        type: string
        source: input
        description: Effective date of the agreement and the start of its exclusive occupancy window on the tract.
        constraints: "ISO 8601 date YYYY-MM-DD"
      - name: curative_days
        type: integer
        source: input
        default: 45
        description: Length of the title defect curative period in days.
        constraints: "1 <= x <= 180"
      - name: curative_deadline
        type: string
        source: computed
        description: "effective_date + curative_days days; last date on which defect activity is permitted, inclusive."
        constraints: "ISO 8601 date YYYY-MM-DD"
      - name: window_end_with_buffer
        type: string
        source: computed
        description: "curative_deadline + PSA_WINDOW_BUFFER_DAYS days; the inclusive end of this PSA's exclusive occupancy window on the tract."
        constraints: "ISO 8601 date YYYY-MM-DD"
      - name: individual_defect_threshold
        type: number
        source: input
        description: Per-defect deductible subtracted from each uncured defect's allocated value before the basket test.
        constraints: ">= 0, 2 decimal places"
      - name: aggregate_defect_basket
        type: number
        source: input
        description: Aggregate basket; only the excess above it adjusts the price.
        constraints: ">= 0, 2 decimal places"
      - name: defect_adjustment_amount
        type: number
        source: computed
        default: 0.00
        description: Price reduction produced at curative close. See calculations.defect_price_adjustment.
        constraints: "2 decimal places, >= 0"
      - name: adjusted_purchase_price
        type: number
        source: computed
        description: "round(purchase_price - defect_adjustment_amount, 2); equals purchase_price until curative close."
        constraints: "2 decimal places"
      - name: curative_status
        type: enum
        source: system
        default: CURATIVE_OPEN
        description: First independent state dimension - the curative period's posture.
        constraints: "one of {CURATIVE_OPEN, CURATIVE_CLOSED, CURATIVE_TERMINATED}"
      - name: funding_status
        type: enum
        source: system
        default: UNFUNDED
        description: Second independent state dimension - whether the purchase price has been wired.
        constraints: "one of {UNFUNDED, FUNDED}"
      - name: psa_status
        type: enum
        source: computed
        default: EXECUTED
        description: "Derived posture: TERMINATED when curative_status == CURATIVE_TERMINATED; CLOSED when curative_status == CURATIVE_CLOSED and funding_status == FUNDED and recorded_book_page is not null; EXECUTED otherwise."
        constraints: "one of {EXECUTED, CLOSED, TERMINATED}"
      - name: wire_reference
        type: string
        source: system
        default: null
        description: Wire confirmation reference captured at funding.
      - name: recording_county
        type: string
        source: system
        default: null
        description: County in which the deed was filed.
      - name: recorded_book_page
        type: string
        source: system
        default: null
        description: County clerk book/page of the recorded deed; null until recording.
      - name: recording_date
        type: string
        source: system
        default: null
        description: Recording date of the deed.
        constraints: "ISO 8601 date YYYY-MM-DD"
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the AcquisitionManager who created the agreement.

  - name: TitleDefect
    parent: PurchaseSaleAgreement
    common_fields: true
    fields:
      - name: psa_id
        type: string
        source: input
        description: "FK -> PurchaseSaleAgreement.id; the agreement whose curative period this defect was raised in."
      - name: defect_type
        type: enum
        source: input
        description: Defect classification.
        constraints: "one of {MISSING_HEIR, UNRELEASED_LEASE, TAX_SALE_GAP, OVERCONVEYANCE, UNLOCATABLE_OWNER}"
      - name: affected_nma
        type: number
        source: input
        description: Net mineral acres clouded by the defect.
        constraints: "> 0, 4 decimal places"
      - name: description
        type: string
        source: input
        description: Narrative of the defect as asserted to the seller.
      - name: allocated_value
        type: number
        source: computed
        description: "round(psa.purchase_price * affected_nma / mineral_interest.net_mineral_acres, 2) - the gross dollar exposure of this defect."
        constraints: "2 decimal places"
      - name: net_defect_value
        type: number
        source: computed
        description: "round(max(0, allocated_value - psa.individual_defect_threshold), 2) - the per-defect figure that enters the basket sum."
        constraints: "2 decimal places, >= 0"
      - name: defect_status
        type: enum
        source: system
        default: RAISED
        description: Curative posture of the defect.
        constraints: "one of {RAISED, CURE_SUBMITTED, CURE_REJECTED, CURED, WAIVED, UNCURED}"
      - name: cure_round_count
        type: integer
        source: computed
        default: 0
        description: Number of cure submissions recorded against this defect.
      - name: cure_instrument_book_page
        type: string
        source: system
        default: null
        description: Book/page of the curative instrument named in the latest cure submission.
      - name: raised_by_user_id
        type: string
        source: system
        description: X-User-ID of the TitleAnalyst who raised the defect.
      - name: waived_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the AcquisitionManager who waived the defect; null unless defect_status == WAIVED.

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - name: unit_name
        type: string
        source: input
        description: Operator's designation for the pooled or unitised area.
      - name: formation
        type: string
        source: input
        description: Target formation of the unit.
      - name: state_code
        type: enum
        source: input
        description: Producing state of the unit; selects the severance-tax rate row.
        constraints: "one of {TX, OK, NM, ND}"
      - name: unit_gross_acres
        type: number
        source: input
        description: Total acreage inside the unit boundary; the participation denominator and the acreage-conservation total.
        constraints: "> 0, 4 decimal places"
      - name: royalty_rate_cap
        type: number
        source: input
        description: Maximum royalty rate the unit agreement will honour; caps the lease royalty rate for POOLED and NON_CONSENT elections.
        constraints: "0 < x <= 1, 6 decimal places"
      - name: pugh_clause_active
        type: boolean
        source: input
        default: false
        description: Whether the unit's leases carry a pugh clause that releases non-producing depths after the deadline.
      - name: pugh_deadline
        type: string
        source: input
        default: null
        description: First date on which a pugh release may be exercised; required when pugh_clause_active is true.
        constraints: "ISO 8601 date YYYY-MM-DD"
      - name: producing_depth_count
        type: integer
        source: input
        description: Number of depth intervals actually producing.
        constraints: ">= 0, <= total_depth_count"
      - name: total_depth_count
        type: integer
        source: input
        description: Number of depth intervals held by the unit's leases.
        constraints: ">= 1"
      - name: unallocated_acres
        type: number
        source: computed
        description: Acreage inside the unit not currently committed to an allocation; initialised to unit_gross_acres. Half of the acreage-conservation invariant.
        constraints: "4 decimal places, >= 0"
      - name: active_allocation_count
        type: integer
        source: computed
        default: 0
        description: Count of this unit's allocations whose allocation_status IN {ACTIVE, PUGH_RELEASED}.
      - name: operator_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the Operator that created the unit; every operator action on the unit and on its division orders must present this id.

  - name: UnitTractAllocation
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; the unit that draws acreage."
      - name: tract_id
        type: string
        source: input
        description: "FK -> Tract.id; the tract contributing acreage."
      - name: allocated_acres
        type: number
        source: input
        description: Tract acres committed to the unit; reduced in place by a pugh release.
        constraints: "> 0, 4 decimal places"
      - name: effective_from
        type: string
        source: input
        description: Inclusive start of the allocation's occupancy interval on the (unit, tract) pair.
        constraints: "ISO 8601 date YYYY-MM-DD"
      - name: effective_to
        type: string
        source: input
        description: Exclusive end of the allocation's occupancy interval; effective_to > effective_from.
        constraints: "ISO 8601 date YYYY-MM-DD"
      - name: pooling_election
        type: enum
        source: input
        description: The owner's pooling election for this allocation; changes how the decimal interest is built.
        constraints: "one of {POOLED, NON_CONSENT, LEASED_ROYALTY_ONLY}"
      - name: allocation_status
        type: enum
        source: system
        default: ACTIVE
        description: Occupancy posture of the allocation.
        constraints: "one of {ACTIVE, PUGH_RELEASED, TERMINATED}"
      - name: released_acres
        type: number
        source: computed
        default: 0.0000
        description: Acres handed back to unit.unallocated_acres by a pugh release; 0.0000 otherwise.
        constraints: "4 decimal places, >= 0"
      - name: termination_reason
        type: string
        source: system
        default: null
        description: Free-text reason recorded when the allocation was terminated.

  - name: DivisionOrder
    parent: null
    common_fields: true
    fields:
      - name: mineral_interest_id
        type: string
        source: input
        description: "FK -> MineralInterest.id; the interest whose decimal the order sets out."
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; the unit the order is issued against."
      - name: royalty_owner_id
        type: string
        source: computed
        description: "FK -> RoyaltyOwner.id; copied from mineral_interest.seller_owner_id at creation - the payee of record for this order."
      - name: allocation_id
        type: string
        source: computed
        description: Id of the UnitTractAllocation selected by calculations.expected_decimal_interest at creation; the authoritative link is UnitTractAllocation.unit_id plus UnitTractAllocation.tract_id. Recomputed on every correction.
      - name: expected_decimal
        type: number
        source: computed
        description: Decimal interest the firm computes from current state. See calculations.expected_decimal_interest.
        constraints: "8 decimal places"
      - name: pinned_decimal
        type: number
        source: system
        default: null
        description: expected_decimal frozen at the EXECUTED transition; the pinned variant used to reconcile every revenue check. Null until execution.
        constraints: "8 decimal places"
      - name: operator_decimal
        type: number
        source: input
        default: null
        description: Decimal the operator returned on the order; null until the operator responds.
        constraints: "8 decimal places"
      - name: do_status
        type: enum
        source: system
        default: SENT
        description: Division-order lifecycle posture.
        constraints: "one of {SENT, EXECUTED, DISPUTED, SUSPENDED}"
      - name: dispute_reason
        type: enum
        source: system
        default: NONE
        description: Why the order is in dispute.
        constraints: "one of {NONE, DECIMAL_MISMATCH, OWNERSHIP_CHANGE}"
      - name: effective_production_month
        type: string
        source: input
        default: null
        description: First production month the executed order governs; earlier months may not be reported against it.
        constraints: "YYYY-MM"
      - name: cumulative_variance_amount
        type: number
        source: computed
        default: 0.00
        description: Running sum of variance_amount over this order's VARIANCE_HELD revenue details.
        constraints: "2 decimal places"
      - name: paid_net_total
        type: number
        source: computed
        default: 0.00
        description: Running sum of net_amount over this order's revenue details whose check_status == PAID. Half of the revenue-conservation invariant.
        constraints: "2 decimal places"
      - name: correction_round_count
        type: integer
        source: computed
        default: 0
        description: Number of operator corrections applied to this order.
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the DivisionOrderAdmin who created the order; the segregation-of-duties counterparty for suspense release.

  - name: RevenueCheckDetail
    parent: DivisionOrder
    common_fields: true
    fields:
      - name: division_order_id
        type: string
        source: input
        description: "FK -> DivisionOrder.id; the executed order the check detail is reported against."
      - name: production_month
        type: string
        source: input
        description: Production month the revenue relates to; unique per (division_order_id, product_code).
        constraints: "YYYY-MM"
      - name: product_code
        type: enum
        source: input
        description: Product stream reported.
        constraints: "one of {OIL, GAS, NGL}"
      - name: gross_volume
        type: number
        source: input
        description: Gross unit volume for the month.
        constraints: ">= 0, 4 decimal places"
      - name: gross_value
        type: number
        source: input
        description: Gross unit sales value for the month, before any owner decimal is applied.
        constraints: ">= 0, 2 decimal places"
      - name: operator_decimal_used
        type: number
        source: input
        description: Decimal the operator actually paid on.
        constraints: "8 decimal places"
      - name: reported_gross_royalty
        type: number
        source: computed
        description: "round(gross_value * operator_decimal_used, 2)."
        constraints: "2 decimal places"
      - name: severance_tax_rate
        type: number
        source: computed
        description: Rate selected from SEVERANCE_RATES by (unit.state_code, product_code).
        constraints: "6 decimal places"
      - name: severance_tax_amount
        type: number
        source: computed
        description: "round(reported_gross_royalty * severance_tax_rate, 2)."
        constraints: "2 decimal places"
      - name: net_amount
        type: number
        source: computed
        description: "round(reported_gross_royalty - severance_tax_amount, 2) - the dollars the operator actually owes for this line."
        constraints: "2 decimal places"
      - name: expected_gross_royalty
        type: number
        source: computed
        description: Pinned variant of calculations.royalty_check_reconciliation - built from division_order.pinned_decimal.
        constraints: "2 decimal places"
      - name: expected_net_amount
        type: number
        source: computed
        description: Pinned-variant net after severance tax.
        constraints: "2 decimal places"
      - name: variance_amount
        type: number
        source: computed
        description: "round(expected_net_amount - net_amount, 2); non-zero routes the whole line to suspense."
        constraints: "2 decimal places, may be negative"
      - name: audit_decimal
        type: number
        source: computed
        description: Live variant of calculations.royalty_check_reconciliation - calculations.expected_decimal_interest re-evaluated against current allocation, unit and interest state.
        constraints: "8 decimal places"
      - name: audit_gross_royalty
        type: number
        source: computed
        description: "round(gross_value * audit_decimal, 2) - the live-variant gross royalty."
        constraints: "2 decimal places"
      - name: audit_variance_amount
        type: number
        source: computed
        description: "round(round(audit_gross_royalty - round(audit_gross_royalty * severance_tax_rate, 2), 2) - net_amount, 2)."
        constraints: "2 decimal places, may be negative"
      - name: check_status
        type: enum
        source: system
        description: PAID when the line settled at the pinned decimal against a locatable owner, VARIANCE_HELD when it was routed to suspense.
        constraints: "one of {PAID, VARIANCE_HELD}"

  - name: SuspenseAccount
    parent: null
    common_fields: true
    fields:
      - name: division_order_id
        type: string
        source: computed
        description: "FK -> DivisionOrder.id; the order whose held revenue accrues here. Unique per (division_order_id, royalty_owner_id)."
      - name: royalty_owner_id
        type: string
        source: computed
        description: "FK -> RoyaltyOwner.id; the payee whose funds are held."
      - name: suspense_reason
        type: enum
        source: system
        description: Why funds are held; set by the cascade that opened the account and never rewritten.
        constraints: "one of {DECIMAL_VARIANCE, UNLOCATABLE_OWNER, OWNERSHIP_TRANSFER}"
      - name: accrued_amount
        type: number
        source: computed
        default: 0.00
        description: Sum of net_amount over this order's VARIANCE_HELD revenue details. Half of the revenue-conservation invariant.
        constraints: "2 decimal places, >= 0"
      - name: held_detail_count
        type: integer
        source: computed
        default: 0
        description: Count of VARIANCE_HELD revenue details rolled into accrued_amount.
      - name: first_suspended_month
        type: string
        source: system
        description: production_month of the first detail routed here, or the logical clock's month when the account was opened by an ownership-change cascade.
        constraints: "YYYY-MM"
      - name: months_held
        type: integer
        source: computed
        description: "(clock.year - first_year) * 12 + (clock.month - first_month), evaluated against the logical clock on every read and every write touching this account."
        constraints: ">= 0"
      - name: interest_accrued
        type: number
        source: computed
        description: "round(accrued_amount * SUSPENSE_INTEREST_ANNUAL * months_held / 12, 2)."
        constraints: "2 decimal places"
      - name: release_amount
        type: number
        source: computed
        description: "round(accrued_amount + interest_accrued, 2) - what a release would pay out. Interest is deliberately outside the conserved revenue quantity."
        constraints: "2 decimal places"
      - name: suspense_status
        type: enum
        source: system
        default: ACCRUING
        description: Suspense posture.
        constraints: "one of {ACCRUING, RELEASED, ESCHEATED}"
      - name: escheat_state_code
        type: string
        source: system
        default: null
        description: State the funds were escheated to; null unless suspense_status == ESCHEATED.
      - name: released_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the DivisionOrderAdmin who released the account; null otherwise.

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: Tract
    initial_state: RESEARCH
    terminal_states: []
    note: |
      Cyclic by design: filing a further county instrument on an already
      CERTIFIED tract re-opens research, because the certified net mineral acre
      figure every downstream interest was carved from is no longer defensible.
    transitions:
      - from: RESEARCH
        to: CERTIFIED
        trigger: "POST /tracts/{id}/certify-title"
        actor: TitleAnalyst
        preconditions:
          - "tract.title_status == RESEARCH"
          - "tract.chain_entry_count >= 1"
          - "exactly one TitleChainEntry for this tract has instrument_type == PATENT"
          - "the chronological replay of calculations.net_mineral_acres_from_chain never drives the running acreage below 0 (else ERR_CHAIN_ACREAGE_NEGATIVE)"
        side_effects:
          - "recompute tract.net_mineral_acres_certified via calculations.net_mineral_acres_from_chain"
          - "recompute tract.existing_burden_fraction via calculations.tract_burden_fraction"
          - "set tract.certified_at = logical clock instant"
          - "increment tract.version by 1"
      - from: CERTIFIED
        to: RESEARCH
        trigger: "POST /tracts/{id}/title-chain-entries (system revert on a certified tract)"
        actor: TitleAnalyst
        preconditions:
          - "tract.title_status == CERTIFIED"
        side_effects:
          - "set tract.title_status = RESEARCH"
          - "set tract.net_mineral_acres_certified = null and tract.existing_burden_fraction = null"
          - "set tract.certified_at = null"
          - "increment tract.chain_entry_count by 1"
          - "increment tract.version by 1"
          - "MineralInterest rows already carved from this tract keep their frozen net_mineral_acres - the revert does NOT retro-adjust them; it only blocks new interests and new offers until re-certification"

  - entity: MineralInterest
    initial_state: PROSPECT
    terminal_states: [ACQUIRED]
    note: |
      Cyclic: an interest that reaches UNDER_PSA can fall all the way back to
      PROSPECT when the agreement terminates on excessive title defects, and can
      then be offered again.
    transitions:
      - from: PROSPECT
        to: OFFERED
        trigger: "POST /mineral-interests/{id}/offer-letters"
        actor: AcquisitionManager
        preconditions:
          - "mineral_interest.interest_status == PROSPECT"
          - "tract.title_status == CERTIFIED (cross-entity guard on the parent Tract)"
          - "a Valuation with valuation_status == CURRENT exists for this interest"
          - "X-User-ID != valuation.approved_by_user_id (segregation of duties)"
          - "valuation.bid_floor <= offer_amount <= valuation.max_bid"
        side_effects:
          - "create OfferLetter with offer_status = SENT and current_amount = offer_amount"
          - "set mineral_interest.interest_status = OFFERED"
          - "increment mineral_interest.version by 1"
      - from: OFFERED
        to: UNDER_PSA
        trigger: "POST /psas"
        actor: AcquisitionManager
        preconditions:
          - "mineral_interest.interest_status == OFFERED"
          - "offer_letter.offer_status == ACCEPTED"
          - "expected_mineral_interest_version == mineral_interest.version (else ERR_STALE_INTEREST_VERSION)"
          - "no other PurchaseSaleAgreement on the same tract_id with psa_status IN {EXECUTED, TERMINATED} has a buffered occupancy window overlapping [effective_date, window_end_with_buffer]"
        side_effects:
          - "create PurchaseSaleAgreement with curative_status = CURATIVE_OPEN, funding_status = UNFUNDED, psa_status = EXECUTED"
          - "set psa.purchase_price = offer_letter.current_amount and psa.adjusted_purchase_price = purchase_price"
          - "set mineral_interest.interest_status = UNDER_PSA"
          - "increment mineral_interest.version by 1"
      - from: UNDER_PSA
        to: PROSPECT
        trigger: "system cascade from PurchaseSaleAgreement CURATIVE_OPEN -> CURATIVE_TERMINATED"
        actor: system
        preconditions:
          - "psa.curative_status just became CURATIVE_TERMINATED"
        side_effects:
          - "set mineral_interest.interest_status = PROSPECT"
          - "increment mineral_interest.version by 1"
          - "cascade hop 3: the OfferLetter whose offer_status == ACCEPTED for this interest is set to VOIDED, and the Valuation whose valuation_status == CURRENT for this interest is set to STALE"
      - from: UNDER_PSA
        to: ACQUIRED
        trigger: "POST /psas/{id}/record-deed"
        actor: TitleAnalyst
        preconditions:
          - "psa.curative_status == CURATIVE_CLOSED"
          - "psa.funding_status == FUNDED"
          - "psa.recorded_book_page is null"
        side_effects:
          - "set mineral_interest.interest_status = ACQUIRED"
          - "set mineral_interest.acquiring_deed_book_page = psa.recorded_book_page"
          - "increment mineral_interest.version by 1"
          - "cascade hop 3: every DivisionOrder for this mineral_interest_id whose do_status IN {SENT, EXECUTED} is set to do_status = DISPUTED, dispute_reason = OWNERSHIP_CHANGE, and its expected_decimal is recomputed"
      - from: OFFERED
        to: RELEASED
        trigger: "POST /offer-letters/{id}/reject"
        actor: RoyaltyOwner
        preconditions:
          - "offer_letter.offer_status IN {SENT, COUNTERED, REVISED}"
        side_effects:
          - "set offer_letter.offer_status = REJECTED"
          - "set mineral_interest.interest_status = RELEASED"
          - "increment mineral_interest.version by 1"

  - entity: OfferLetter
    initial_state: SENT
    terminal_states: [ACCEPTED, REJECTED, EXPIRED, VOIDED]
    note: |
      Cyclic negotiation: SENT -> COUNTERED -> REVISED -> COUNTERED -> REVISED ...
      bounded by MAX_COUNTER_ROUNDS owner counters. EXPIRED is a lazy
      system auto-transition evaluated on every write against the offer.
    transitions:
      - from: SENT
        to: COUNTERED
        trigger: "POST /offer-letters/{id}/counter"
        actor: RoyaltyOwner
        preconditions:
          - "offer_letter.offer_status IN {SENT, REVISED}"
          - "logical clock date <= offer_letter.expires_on (else the system auto-transition to EXPIRED fires first)"
          - "offer_letter.counter_round_count < MAX_COUNTER_ROUNDS"
          - "X-User-ID == mineral_interest.seller_owner_id"
        side_effects:
          - "set offer_letter.last_counter_amount = counter_amount"
          - "increment offer_letter.counter_round_count by 1"
          - "set offer_letter.offer_status = COUNTERED"
          - "current_amount is NOT changed by a counter - only a REVISED transition moves the firm's number"
      - from: REVISED
        to: COUNTERED
        trigger: "POST /offer-letters/{id}/counter"
        actor: RoyaltyOwner
        preconditions:
          - "offer_letter.offer_status == REVISED"
          - "logical clock date <= offer_letter.expires_on"
          - "offer_letter.counter_round_count < MAX_COUNTER_ROUNDS"
        side_effects:
          - "same as SENT -> COUNTERED; this is the loop-closing edge of the negotiation cycle"
      - from: COUNTERED
        to: REVISED
        trigger: "POST /offer-letters/{id}/revise"
        actor: AcquisitionManager
        preconditions:
          - "offer_letter.offer_status == COUNTERED"
          - "logical clock date <= offer_letter.expires_on"
          - "valuation.bid_floor <= revised_amount <= valuation.max_bid where valuation is the interest's CURRENT valuation"
        side_effects:
          - "set offer_letter.current_amount = revised_amount"
          - "set offer_letter.expires_on = the request's expires_on"
          - "set offer_letter.offer_status = REVISED"
      - from: SENT
        to: ACCEPTED
        trigger: "POST /offer-letters/{id}/accept"
        actor: RoyaltyOwner
        preconditions:
          - "offer_letter.offer_status IN {SENT, REVISED}"
          - "logical clock date <= offer_letter.expires_on"
          - "X-User-ID == mineral_interest.seller_owner_id"
        side_effects:
          - "set offer_letter.offer_status = ACCEPTED"
          - "set offer_letter.accepted_at = logical clock instant"
      - from: REVISED
        to: ACCEPTED
        trigger: "POST /offer-letters/{id}/accept"
        actor: RoyaltyOwner
        preconditions:
          - "offer_letter.offer_status == REVISED"
          - "logical clock date <= offer_letter.expires_on"
        side_effects:
          - "same as SENT -> ACCEPTED, accepting current_amount rather than offer_amount"
      - from: SENT
        to: REJECTED
        trigger: "POST /offer-letters/{id}/reject"
        actor: RoyaltyOwner
        preconditions:
          - "offer_letter.offer_status IN {SENT, COUNTERED, REVISED}"
        side_effects:
          - "set offer_letter.offer_status = REJECTED"
          - "set mineral_interest.interest_status = RELEASED (cross-entity)"
      - from: SENT
        to: EXPIRED
        trigger: "system auto-transition evaluated at the start of any write targeting this offer"
        actor: system
        preconditions:
          - "offer_letter.offer_status IN {SENT, COUNTERED, REVISED}"
          - "logical clock date > offer_letter.expires_on"
        side_effects:
          - "set offer_letter.offer_status = EXPIRED"
          - "set mineral_interest.interest_status = RELEASED"
          - "the triggering write is then rejected with ERR_OFFER_EXPIRED"
      - from: ACCEPTED
        to: VOIDED
        trigger: "system cascade from MineralInterest UNDER_PSA -> PROSPECT"
        actor: system
        preconditions:
          - "mineral_interest.interest_status just became PROSPECT because its PSA terminated"
        side_effects:
          - "set offer_letter.offer_status = VOIDED"

  - entity: PurchaseSaleAgreement
    initial_state: EXECUTED
    terminal_states: [CLOSED, TERMINATED]
    note: |
      Two independent state dimensions evolve on the same row -
      curative_status (CURATIVE_OPEN -> CURATIVE_CLOSED | CURATIVE_TERMINATED)
      and funding_status (UNFUNDED -> FUNDED) - plus a derived psa_status that is
      a pure function of both dimensions and of recorded_book_page. Funding is
      gated on the curative dimension, but the curative dimension is never gated
      on funding, so the two axes are genuinely independent in one direction.
    transitions:
      - from: CURATIVE_OPEN
        to: CURATIVE_CLOSED
        trigger: "POST /psas/{id}/close-curative"
        actor: AcquisitionManager
        note: "curative dimension"
        preconditions:
          - "psa.curative_status == CURATIVE_OPEN"
          - "calculations.defect_price_adjustment yields adjustment <= round(psa.purchase_price * PSA_TERMINATION_THRESHOLD_PCT, 2)"
        side_effects:
          - "sweep every TitleDefect of this psa whose defect_status IN {RAISED, CURE_SUBMITTED, CURE_REJECTED} to defect_status = UNCURED"
          - "set psa.defect_adjustment_amount = the computed adjustment"
          - "set psa.adjusted_purchase_price = round(psa.purchase_price - psa.defect_adjustment_amount, 2)"
          - "set psa.curative_status = CURATIVE_CLOSED"
          - "recompute psa.psa_status (stays EXECUTED until funded and recorded)"
      - from: CURATIVE_OPEN
        to: CURATIVE_TERMINATED
        trigger: "POST /psas/{id}/close-curative"
        actor: AcquisitionManager
        note: "curative dimension - the branch taken when the uncured defect excess breaches the termination threshold; cascade depth 3 starts here"
        preconditions:
          - "psa.curative_status == CURATIVE_OPEN"
          - "calculations.defect_price_adjustment yields adjustment > round(psa.purchase_price * PSA_TERMINATION_THRESHOLD_PCT, 2)"
        side_effects:
          - "sweep every TitleDefect of this psa whose defect_status IN {RAISED, CURE_SUBMITTED, CURE_REJECTED} to defect_status = UNCURED"
          - "set psa.defect_adjustment_amount = the computed adjustment and psa.adjusted_purchase_price = round(purchase_price - adjustment, 2)"
          - "set psa.curative_status = CURATIVE_TERMINATED and psa.psa_status = TERMINATED"
          - "cascade hop 2: mineral_interest.interest_status UNDER_PSA -> PROSPECT"
          - "cascade hop 3 (caused by hop 2, not by this transition): that interest's ACCEPTED OfferLetter -> VOIDED and its CURRENT Valuation -> STALE"
      - from: UNFUNDED
        to: FUNDED
        trigger: "POST /psas/{id}/fund"
        actor: AcquisitionManager
        note: "funding dimension"
        preconditions:
          - "psa.curative_status == CURATIVE_CLOSED (else ERR_CURATIVE_PERIOD_OPEN)"
          - "psa.funding_status == UNFUNDED"
          - "wire_amount == psa.adjusted_purchase_price (else ERR_FUNDING_AMOUNT_MISMATCH)"
        side_effects:
          - "set psa.funding_status = FUNDED and psa.wire_reference = wire_reference"
          - "recompute psa.psa_status (still EXECUTED until the deed is recorded)"
      - from: EXECUTED
        to: CLOSED
        trigger: "POST /psas/{id}/record-deed"
        actor: TitleAnalyst
        note: "derived psa_status dimension; cascade depth 4 starts here"
        preconditions:
          - "psa.curative_status == CURATIVE_CLOSED"
          - "psa.funding_status == FUNDED"
          - "psa.recorded_book_page is null (else ERR_DEED_ALREADY_RECORDED)"
          - "recording_date >= psa.effective_date"
        side_effects:
          - "set psa.recording_county, psa.recorded_book_page, psa.recording_date"
          - "set psa.psa_status = CLOSED"
          - "cascade hop 2: mineral_interest.interest_status UNDER_PSA -> ACQUIRED and acquiring_deed_book_page = recorded_book_page"
          - "cascade hop 3 (caused by hop 2): every DivisionOrder of that interest with do_status IN {SENT, EXECUTED} -> do_status = DISPUTED, dispute_reason = OWNERSHIP_CHANGE, expected_decimal recomputed"
          - "cascade hop 4 (caused by hop 3): for each such DivisionOrder, upsert its SuspenseAccount on (division_order_id, royalty_owner_id) with suspense_status = ACCRUING, suspense_reason = OWNERSHIP_TRANSFER, first_suspended_month = the logical clock's YYYY-MM when the account is created"

  - entity: TitleDefect
    initial_state: RAISED
    terminal_states: [CURED, WAIVED, UNCURED]
    note: |
      Cyclic cure loop: RAISED -> CURE_SUBMITTED -> CURE_REJECTED ->
      CURE_SUBMITTED -> ... until the analyst accepts, the manager waives, or
      the curative close sweeps whatever is left to UNCURED.
    transitions:
      - from: RAISED
        to: CURE_SUBMITTED
        trigger: "POST /title-defects/{id}/submit-cure"
        actor: RoyaltyOwner
        preconditions:
          - "defect.defect_status IN {RAISED, CURE_REJECTED}"
          - "psa.curative_status == CURATIVE_OPEN"
          - "logical clock date <= psa.curative_deadline (else ERR_CURATIVE_DEADLINE_PASSED)"
          - "X-User-ID == mineral_interest.seller_owner_id"
        side_effects:
          - "set defect.defect_status = CURE_SUBMITTED"
          - "set defect.cure_instrument_book_page = cure_instrument_book_page"
          - "increment defect.cure_round_count by 1"
      - from: CURE_SUBMITTED
        to: CURE_REJECTED
        trigger: "POST /title-defects/{id}/cure-decision with decision == REJECTED"
        actor: TitleAnalyst
        preconditions:
          - "defect.defect_status == CURE_SUBMITTED"
          - "psa.curative_status == CURATIVE_OPEN"
        side_effects:
          - "set defect.defect_status = CURE_REJECTED"
      - from: CURE_REJECTED
        to: CURE_SUBMITTED
        trigger: "POST /title-defects/{id}/submit-cure"
        actor: RoyaltyOwner
        preconditions:
          - "defect.defect_status == CURE_REJECTED"
          - "psa.curative_status == CURATIVE_OPEN"
          - "logical clock date <= psa.curative_deadline"
        side_effects:
          - "same as RAISED -> CURE_SUBMITTED; this is the loop-closing edge of the cure cycle"
      - from: CURE_SUBMITTED
        to: CURED
        trigger: "POST /title-defects/{id}/cure-decision with decision == ACCEPTED"
        actor: TitleAnalyst
        preconditions:
          - "defect.defect_status == CURE_SUBMITTED"
          - "psa.curative_status == CURATIVE_OPEN"
        side_effects:
          - "set defect.defect_status = CURED"
          - "the defect no longer enters calculations.defect_price_adjustment"
      - from: RAISED
        to: WAIVED
        trigger: "POST /title-defects/{id}/waive"
        actor: AcquisitionManager
        preconditions:
          - "defect.defect_status IN {RAISED, CURE_SUBMITTED, CURE_REJECTED}"
          - "psa.curative_status == CURATIVE_OPEN"
          - "logical clock date <= psa.curative_deadline"
        side_effects:
          - "set defect.defect_status = WAIVED and defect.waived_by_user_id = X-User-ID"
          - "the defect no longer enters calculations.defect_price_adjustment"
      - from: RAISED
        to: UNCURED
        trigger: "system sweep during POST /psas/{id}/close-curative"
        actor: system
        preconditions:
          - "defect.defect_status IN {RAISED, CURE_SUBMITTED, CURE_REJECTED} at the moment the curative period closes"
        side_effects:
          - "set defect.defect_status = UNCURED"
          - "defect.net_defect_value enters calculations.defect_price_adjustment"

  - entity: UnitTractAllocation
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    note: "Compensating pair: creation draws acreage out of unit.unallocated_acres, termination returns all of it, and a pugh release returns the non-producing share."
    transitions:
      - from: ACTIVE
        to: PUGH_RELEASED
        trigger: "POST /unit-tract-allocations/{id}/pugh-release"
        actor: Operator
        preconditions:
          - "allocation.allocation_status == ACTIVE"
          - "unit.pugh_clause_active == true (else ERR_PUGH_CLAUSE_NOT_APPLICABLE)"
          - "logical clock date >= unit.pugh_deadline (else ERR_PUGH_DEADLINE_NOT_REACHED)"
          - "unit.producing_depth_count < unit.total_depth_count"
          - "X-User-ID == unit.operator_user_id"
        side_effects:
          - "set retained = round(allocation.allocated_acres * unit.producing_depth_count / unit.total_depth_count, 4)"
          - "set allocation.released_acres = round(allocation.allocated_acres - retained, 4) then allocation.allocated_acres = retained"
          - "set allocation.allocation_status = PUGH_RELEASED"
          - "set unit.unallocated_acres = round(unit.unallocated_acres + allocation.released_acres, 4) and increment unit.version by 1"
          - "the acreage-conservation invariant unit_acreage_total is preserved exactly"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /unit-tract-allocations/{id}/terminate"
        actor: Operator
        preconditions:
          - "allocation.allocation_status IN {ACTIVE, PUGH_RELEASED}"
          - "X-User-ID == unit.operator_user_id"
        side_effects:
          - "set allocation.allocation_status = TERMINATED and allocation.termination_reason = termination_reason"
          - "set unit.unallocated_acres = round(unit.unallocated_acres + allocation.allocated_acres, 4), decrement unit.active_allocation_count by 1, increment unit.version by 1"
          - "the acreage-conservation invariant unit_acreage_total is preserved exactly - this is the compensating action for allocation creation"

  - entity: DivisionOrder
    initial_state: SENT
    terminal_states: []
    note: |
      Branching fork with divergent side-effect sets: the operator's single
      response splits SENT into EXECUTED (decimal agreed - pin it and open the
      revenue channel) or DISPUTED (decimal disagreed - no pinning, no revenue),
      and DISPUTED loops back to SENT through a correction.
    transitions:
      - from: SENT
        to: EXECUTED
        trigger: "POST /division-orders/{id}/operator-response where operator_decimal == division_order.expected_decimal"
        actor: Operator
        note: "branch A of the fork"
        preconditions:
          - "division_order.do_status == SENT"
          - "X-User-ID == unit.operator_user_id"
          - "operator_decimal == division_order.expected_decimal"
        side_effects:
          - "set division_order.operator_decimal = operator_decimal"
          - "set division_order.pinned_decimal = division_order.expected_decimal (version-pinning on approval)"
          - "set division_order.effective_production_month = effective_production_month"
          - "set division_order.do_status = EXECUTED and dispute_reason = NONE"
      - from: SENT
        to: DISPUTED
        trigger: "POST /division-orders/{id}/operator-response where operator_decimal != division_order.expected_decimal"
        actor: Operator
        note: "branch B of the fork - a strictly different side-effect set: nothing is pinned and no revenue channel opens"
        preconditions:
          - "division_order.do_status == SENT"
          - "X-User-ID == unit.operator_user_id"
          - "operator_decimal != division_order.expected_decimal"
        side_effects:
          - "set division_order.operator_decimal = operator_decimal"
          - "set division_order.do_status = DISPUTED and dispute_reason = DECIMAL_MISMATCH"
          - "division_order.pinned_decimal stays null and division_order.effective_production_month stays null"
      - from: DISPUTED
        to: SENT
        trigger: "POST /division-orders/{id}/correct"
        actor: Operator
        note: "loop-closing edge - re-issues the order for a fresh operator response"
        preconditions:
          - "division_order.do_status == DISPUTED"
          - "X-User-ID == unit.operator_user_id"
          - "corrected_decimal == division_order.expected_decimal recomputed from current state"
        side_effects:
          - "recompute division_order.expected_decimal via calculations.expected_decimal_interest"
          - "set division_order.operator_decimal = null, do_status = SENT, dispute_reason = NONE"
          - "increment division_order.correction_round_count by 1"
      - from: EXECUTED
        to: SUSPENDED
        trigger: "system cascade from a RevenueCheckDetail entering check_status = VARIANCE_HELD"
        actor: system
        note: "cascade hop 2 of the revenue cascade"
        preconditions:
          - "the just-created RevenueCheckDetail has check_status == VARIANCE_HELD"
        side_effects:
          - "set division_order.do_status = SUSPENDED"
          - "set division_order.cumulative_variance_amount = round(previous + detail.variance_amount, 2)"
          - "cascade hop 3 (caused by hop 2): upsert the SuspenseAccount on (division_order_id, royalty_owner_id) - accrued_amount += detail.net_amount, held_detail_count += 1, suspense_status = ACCRUING"
      - from: SUSPENDED
        to: EXECUTED
        trigger: "system cascade from POST /suspense-accounts/{id}/release"
        actor: system
        preconditions:
          - "the SuspenseAccount for this order moved ACCRUING -> RELEASED"
        side_effects:
          - "every RevenueCheckDetail of this order with check_status == VARIANCE_HELD becomes check_status = PAID"
          - "set division_order.paid_net_total = round(previous + suspense.accrued_amount, 2)"
          - "set division_order.cumulative_variance_amount = 0.00 and do_status = EXECUTED"
          - "the revenue-conservation invariant division_order_net_revenue_total is preserved exactly - this is the compensating action for the variance hold"
      - from: EXECUTED
        to: DISPUTED
        trigger: "system cascade from PurchaseSaleAgreement EXECUTED -> CLOSED (ownership change notice)"
        actor: system
        note: "cascade hop 3 of the recording cascade"
        preconditions:
          - "the order's mineral_interest just became ACQUIRED"
        side_effects:
          - "set division_order.do_status = DISPUTED and dispute_reason = OWNERSHIP_CHANGE"
          - "recompute division_order.expected_decimal"
          - "cascade hop 4 (caused by hop 3): upsert the SuspenseAccount with suspense_reason = OWNERSHIP_TRANSFER"

  - entity: SuspenseAccount
    initial_state: ACCRUING
    terminal_states: [RELEASED, ESCHEATED]
    transitions:
      - from: ACCRUING
        to: RELEASED
        trigger: "POST /suspense-accounts/{id}/release"
        actor: DivisionOrderAdmin
        preconditions:
          - "suspense.suspense_status == ACCRUING"
          - "royalty_owner.contact_status == LOCATED (cross-entity guard on RoyaltyOwner; else ERR_OWNER_UNLOCATABLE)"
          - "royalty_owner.tax_id_on_file == true (else ERR_OWNER_TAX_ID_MISSING)"
          - "X-User-ID != division_order.created_by_user_id (segregation of duties)"
        side_effects:
          - "recompute suspense.months_held, interest_accrued and release_amount against the logical clock"
          - "set suspense.suspense_status = RELEASED and released_by_user_id = X-User-ID"
          - "set suspense.accrued_amount = 0.00 and held_detail_count = 0"
          - "cascade: the parent DivisionOrder moves SUSPENDED -> EXECUTED and its VARIANCE_HELD details become PAID"
      - from: ACCRUING
        to: ESCHEATED
        trigger: "POST /suspense-accounts/{id}/escheat"
        actor: DivisionOrderAdmin
        preconditions:
          - "suspense.suspense_status == ACCRUING"
          - "suspense.suspense_reason == UNLOCATABLE_OWNER"
          - "suspense.months_held >= ESCHEAT_MONTHS (else ERR_ESCHEAT_PERIOD_NOT_ELAPSED)"
        side_effects:
          - "recompute suspense.months_held, interest_accrued and release_amount"
          - "set suspense.suspense_status = ESCHEATED and escheat_state_code = escheat_state_code"
          - "set suspense.accrued_amount = 0.00 and held_detail_count = 0"
          - "the parent DivisionOrder stays SUSPENDED - escheat is not a compensating action and does not restore the revenue channel"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's version - the only sanctioned
# write-write conflict mechanism)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: psa-create-stale-interest
    parent_entity: MineralInterest
    write_endpoint: "POST /psas"
    occ_field: "expected_mineral_interest_version"
    description: |
      Creating a PurchaseSaleAgreement against a MineralInterest whose version
      has advanced since the client last read it is rejected. The product
      legitimately allows a fresh agreement to be papered on the same interest
      after a prior agreement terminated, so a second create is not inherently
      invalid - it is invalid only because the client's view of the interest
      (its valuation, its accepted offer, its status) is stale.
    error_id: ERR_STALE_INTEREST_VERSION
    http_status: 412

  - rule_id: division-order-create-stale-unit
    parent_entity: Unit
    write_endpoint: "POST /division-orders"
    occ_field: "expected_unit_version"
    description: |
      Creating a DivisionOrder against a Unit whose version has advanced since
      the client last read it is rejected. A further division order on the same
      (interest, unit) pair legitimately supersedes the earlier one once the
      unit's allocation set has been amended, so the create itself is valid -
      it is rejected only because the acreage picture the client priced the
      decimal against is stale.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: net_mineral_acres_from_chain
    trigger: "POST /tracts/{id}/certify-title (writes tract.net_mineral_acres_certified); also replayed - without persisting - by POST /tracts/{id}/title-chain-entries to reject a chain that would go negative"
    algorithm: chronological
    formula: |
      # Source set: EVERY TitleChainEntry whose tract_id == tract.id. There is no
      # status filter because TitleChainEntry is append-only and immutable
      # (common_fields: false). Window: unbounded - all entries participate.
      # Sort key: instrument_date ASC; tie-break: created_at ASC. Never id.
      entries = sort(TitleChainEntry where tract_id == tract.id,
                     by instrument_date ASC, then created_at ASC)
      acres = 0.0000
      for e in entries:
          if   e.instrument_type == "PATENT":     acres = round(tract.gross_acres * e.conveyed_fraction, 4)
          elif e.instrument_type == "DEED":       acres = round(acres - e.conveyed_acres, 4)
          elif e.instrument_type == "PROBATE":    acres = round(acres * e.conveyed_fraction, 4)
          elif e.instrument_type == "ASSIGNMENT": acres = acres          # ORRI burden only; acreage untouched
          if acres < 0: raise ERR_CHAIN_ACREAGE_NEGATIVE
      tract.net_mineral_acres_certified = acres
    input_set: "All TitleChainEntry rows for the tract, in instrument_date ASC / created_at ASC order. Order matters: DEED subtracts an absolute acreage while PROBATE multiplies by a fraction, so a DEED-before-PROBATE chain and a PROBATE-before-DEED chain over the same instruments yield different acreages (and the reversed order can drive the running acreage negative)."
    constants: {}
    precision: "4 decimal places, round_half_up, applied after every step (not only at the end)"

  - name: tract_burden_fraction
    trigger: "POST /tracts/{id}/certify-title (writes tract.existing_burden_fraction); copied into MineralInterest.existing_burden_fraction at interest creation"
    algorithm: aggregation
    formula: |
      # Source: TitleChainEntry where tract_id == tract.id AND instrument_type == "ASSIGNMENT".
      # Window: unbounded. Order-insensitive (pure sum), so no tie-break needed.
      raw = round(sum(e.conveyed_fraction for e in ASSIGNMENT entries of this tract), 4)
      if raw > BURDEN_CAP: raise ERR_BURDEN_CAP_EXCEEDED
      tract.existing_burden_fraction = raw
    input_set: "Only ASSIGNMENT instruments; PATENT / DEED / PROBATE entries are excluded."
    constants:
      BURDEN_CAP: 0.2500
    precision: "4 decimal places, round_half_up"

  - name: valuation_bid_band
    trigger: "POST /mineral-interests/{id}/valuations - writes Valuation.pdp_pv, undeveloped_pv, bid_floor and max_bid in that order"
    algorithm: decay_function
    formula: |
      # Step decay by whole year, discounted at year end. Each year's discounted
      # cash flow is rounded to cents BEFORE it is added to the running total
      # (per-year rounding then sum - this order is PINNED; summing the raw
      # yearly figures and rounding once at the end is NOT the sanctioned order).
      pdp_pv = 0.00
      for y in 1..HORIZON_YEARS:
          annual_y     = round(valuation.current_monthly_net_revenue * 12
                               * (1 - valuation.annual_decline_rate) ** (y - 1), 2)
          discounted_y = round(annual_y / ((1 + DISCOUNT_RATE_ANNUAL) ** y), 2)
          pdp_pv       = round(pdp_pv + discounted_y, 2)

      undeveloped_pv = round(valuation.undeveloped_net_acres
                             * UPSIDE_PER_NET_ACRE
                             * RISK_FACTOR_UNDEVELOPED
                             * ACTIVITY_MULTIPLIER[valuation.operator_activity_tier], 2)

      burden = mineral_interest.existing_burden_fraction
      bid_floor = round(pdp_pv * (1 - burden), 2)                        # variant pdp_only
      max_bid   = round((pdp_pv + undeveloped_pv) * (1 - burden), 2)     # variant risked_upside
    input_set: "A single Valuation row plus its interest's existing_burden_fraction and its tract's operator_activity_tier (copied onto the Valuation at creation so a later tract re-classification cannot retro-move a filed valuation)."
    constants:
      DISCOUNT_RATE_ANNUAL: 0.10
      HORIZON_YEARS: 5
      RISK_FACTOR_UNDEVELOPED: 0.45
      UPSIDE_PER_NET_ACRE: 1800.00
      ACTIVITY_MULTIPLIER: { HIGH: 1.20, MODERATE: 1.00, LOW: 0.80 }
    precision: "2 decimal places, round_half_up, applied per year and again on each band edge"
    variants:
      - name: pdp_only
        when: "Establishing the walk-away floor - the number below which the firm will not bid, written to Valuation.bid_floor and enforced as the lower edge of the offer band."
        difference: "Counts only proved-developed-producing cash flow: undeveloped_pv is excluded entirely from the burden-adjusted result."
      - name: risked_upside
        when: "Establishing the maximum authorised bid - written to Valuation.max_bid and enforced as the upper edge of the offer band."
        difference: "Adds the risked undeveloped acreage value (undeveloped_net_acres x UPSIDE_PER_NET_ACRE x RISK_FACTOR_UNDEVELOPED x the operator-activity multiplier) to pdp_pv before applying the burden haircut. For identical Valuation inputs the two variants differ by exactly round(undeveloped_pv * (1 - burden), 2)."

  - name: expected_decimal_interest
    trigger: "POST /division-orders (writes DivisionOrder.expected_decimal and DivisionOrder.allocation_id); re-evaluated by POST /division-orders/{id}/correct, by the ownership-change cascade, and as the live variant of royalty_check_reconciliation"
    algorithm: constraint_propagation
    formula: |
      # --- allocation selector (deterministic, no random fields) -------------
      # Eligibility filter: UnitTractAllocation rows where
      #   unit_id == division_order.unit_id
      #   AND tract_id == mineral_interest.tract_id
      #   AND effective_from <= clock_date < effective_to   (half-open interval)
      # Ranking expression: effective_from DESC.
      # Tie-break: created_at DESC (never id).
      # Empty candidate set: raise ERR_NO_ACTIVE_ALLOCATION.
      allocation = first(candidates ordered by effective_from DESC, created_at DESC)
      if allocation.allocation_status not in {ACTIVE, PUGH_RELEASED}:
          raise ERR_ALLOCATION_NOT_ACTIVE

      ownership     = mineral_interest.net_mineral_acres / tract.gross_acres
      participation = allocation.allocated_acres / unit.unit_gross_acres

      # Conditional branch on the allocation's pooling election:
      if allocation.pooling_election == "LEASED_ROYALTY_ONLY":
          # a leased royalty owner is not a unit participant, so the unit's
          # royalty cap does not bind - the lease rate stands as written
          effective_rate  = mineral_interest.lease_royalty_rate
          election_factor = 1.0
      elif allocation.pooling_election == "NON_CONSENT":
          effective_rate  = min(mineral_interest.lease_royalty_rate, unit.royalty_rate_cap)
          election_factor = round(1 - NON_CONSENT_PENALTY_PCT, 4)
      else:  # POOLED
          effective_rate  = min(mineral_interest.lease_royalty_rate, unit.royalty_rate_cap)
          election_factor = 1.0

      net_burden = max(0, round(effective_rate - mineral_interest.existing_burden_fraction, 6))
      expected_decimal = round(ownership * participation * net_burden * election_factor, 8)
    input_set: "One MineralInterest, its Tract, one Unit, and the single UnitTractAllocation chosen by the selector above. Pugh effects arrive purely through allocation.allocated_acres (a pugh release rewrites the acreage in place) - there is no separate pugh factor in this formula, so the depth ratio is never applied twice."
    constants:
      NON_CONSENT_PENALTY_PCT: 0.30
    precision: "8 decimal places, round_half_up, applied once at the end; net_burden is rounded to 6 places first"

  - name: defect_price_adjustment
    trigger: "POST /psas/{id}/close-curative - writes psa.defect_adjustment_amount and psa.adjusted_purchase_price, and decides the CURATIVE_CLOSED vs CURATIVE_TERMINATED branch"
    algorithm: waterfall_allocation
    formula: |
      # Source set: TitleDefect rows where psa_id == psa.id AND defect_status
      # (after the close-curative sweep) == "UNCURED". CURED and WAIVED defects
      # are excluded. Window: unbounded within the PSA.
      # Processing order: created_at ASC (never id) - immaterial to the sum, but
      # pinned so the per-defect rounding sequence is reproducible.
      #
      # ROUNDING ORDER IS PINNED: round each defect to cents FIRST, then sum the
      # rounded per-defect figures. Summing the raw allocated values and
      # rounding once at the end is NOT the sanctioned order and can differ by
      # cents once three or more defects are present.
      sum_net = 0.00
      for d in uncured defects ordered by created_at ASC:
          d.allocated_value  = round(psa.purchase_price * d.affected_nma
                                     / mineral_interest.net_mineral_acres, 2)
          d.net_defect_value = round(max(0, d.allocated_value
                                     - psa.individual_defect_threshold), 2)
          sum_net = round(sum_net + d.net_defect_value, 2)

      # Basket waterfall: the first psa.aggregate_defect_basket dollars are
      # absorbed by the buyer. Boundary is inclusive - sum_net EQUAL to the
      # basket produces a zero adjustment.
      if sum_net <= psa.aggregate_defect_basket:
          adjustment = 0.00
      else:
          adjustment = round(sum_net - psa.aggregate_defect_basket, 2)

      termination_ceiling = round(psa.purchase_price * PSA_TERMINATION_THRESHOLD_PCT, 2)
      if adjustment > termination_ceiling:
          -> CURATIVE_TERMINATED branch          # strictly greater; equality does NOT terminate
      else:
          -> CURATIVE_CLOSED branch
      psa.defect_adjustment_amount = adjustment
      psa.adjusted_purchase_price  = round(psa.purchase_price - adjustment, 2)
    input_set: "Only UNCURED defects of this PSA. Defects that reached CURED or WAIVED before the close are excluded, which is what makes the cure cycle economically meaningful."
    constants:
      PSA_TERMINATION_THRESHOLD_PCT: 0.20
    precision: "2 decimal places, round_half_up, applied per defect and then on the running sum"

  - name: royalty_check_reconciliation
    trigger: "POST /division-orders/{id}/revenue-check-details - writes reported_gross_royalty, severance_tax_rate, severance_tax_amount, net_amount, expected_gross_royalty, expected_net_amount, variance_amount, audit_decimal, audit_gross_royalty, audit_variance_amount and check_status"
    algorithm: forward_looking
    formula: |
      rate = SEVERANCE_RATES[unit.state_code][detail.product_code]

      # what the operator actually paid
      reported_gross_royalty = round(detail.gross_value * detail.operator_decimal_used, 2)
      severance_tax_amount   = round(reported_gross_royalty * rate, 2)
      net_amount             = round(reported_gross_royalty - severance_tax_amount, 2)

      # --- variant division_order_pinned ---------------------------------
      expected_gross_royalty = round(detail.gross_value * division_order.pinned_decimal, 2)
      expected_net_amount    = round(expected_gross_royalty
                                     - round(expected_gross_royalty * rate, 2), 2)
      variance_amount        = round(expected_net_amount - net_amount, 2)

      # --- variant live_allocation ---------------------------------------
      audit_decimal          = expected_decimal_interest evaluated NOW against the
                               current UnitTractAllocation / Unit / MineralInterest state
      audit_gross_royalty    = round(detail.gross_value * audit_decimal, 2)
      audit_net              = round(audit_gross_royalty
                                     - round(audit_gross_royalty * rate, 2), 2)
      audit_variance_amount  = round(audit_net - net_amount, 2)

      # --- suspense routing (precedence is fixed, owner status wins) ------
      if royalty_owner.contact_status != "LOCATED":
          check_status = "VARIANCE_HELD"; suspense_reason = "UNLOCATABLE_OWNER"
      elif variance_amount != 0.00:
          check_status = "VARIANCE_HELD"; suspense_reason = "DECIMAL_VARIANCE"
      else:
          check_status = "PAID"; division_order.paid_net_total += net_amount
    input_set: "One RevenueCheckDetail, the DivisionOrder it hangs off (for pinned_decimal and royalty_owner_id), the Unit (for state_code and the live decimal) and the currently selected UnitTractAllocation (for the live decimal). audit_* is always computed, even when the line is PAID."
    constants:
      SEVERANCE_RATES:
        TX: { OIL: 0.046000, GAS: 0.075000, NGL: 0.046000 }
        OK: { OIL: 0.070000, GAS: 0.070000, NGL: 0.070000 }
        NM: { OIL: 0.037500, GAS: 0.037500, NGL: 0.037500 }
        ND: { OIL: 0.050000, GAS: 0.065000, NGL: 0.050000 }
    precision: "2 decimal places, round_half_up, on every dollar figure; severance tax is computed on the ROUNDED gross royalty, never on the raw product"
    variants:
      - name: division_order_pinned
        when: "Settlement - deciding whether the operator underpaid and whether the line goes to suspense. Uses DivisionOrder.pinned_decimal, frozen at the EXECUTED transition."
        difference: "Ignores every allocation, pooling and pugh change that happened after execution. This is the variant that writes variance_amount and drives the suspense cascade."
      - name: live_allocation
        when: "Audit - deciding whether the pinned decimal is still the right decimal. Re-runs calculations.expected_decimal_interest against present-day state."
        difference: "Uses today's allocated_acres, pooling_election and interest fields. After a pugh release the live decimal is strictly smaller than the pinned decimal, so audit_gross_royalty and expected_gross_royalty diverge for byte-identical detail inputs; audit_variance_amount is written but never routes funds."

  - name: suspense_accrual
    trigger: "recomputed on every read of a SuspenseAccount and on every write that touches it (revenue-detail cascade, POST /suspense-accounts/{id}/release, POST /suspense-accounts/{id}/escheat)"
    algorithm: aggregation
    formula: |
      # Source: RevenueCheckDetail where division_order_id == suspense.division_order_id
      # AND check_status == "VARIANCE_HELD". Window: unbounded. Order-insensitive.
      accrued_amount   = round(sum(d.net_amount for d in that set), 2)
      held_detail_count = count(that set)
      months_held      = (clock.year - year(first_suspended_month)) * 12
                         + (clock.month - month(first_suspended_month))
      interest_accrued = round(accrued_amount * SUSPENSE_INTEREST_ANNUAL * months_held / 12, 2)
      release_amount   = round(accrued_amount + interest_accrued, 2)
      escheat_eligible = (suspense.suspense_reason == "UNLOCATABLE_OWNER"
                          and months_held >= ESCHEAT_MONTHS)     # inclusive boundary
    input_set: "Only VARIANCE_HELD details of the parent division order. Details already flipped to PAID by a previous release are excluded, which is why a release drives accrued_amount to exactly 0.00."
    constants:
      SUSPENSE_INTEREST_ANNUAL: 0.06
      ESCHEAT_MONTHS: 36
    precision: "2 decimal places, round_half_up; months_held is an integer count of whole calendar months"

  - name: owner_tax_statement
    trigger: "GET /royalty-owners/{id}/tax-statement?tax_year=YYYY"
    algorithm: aggregation
    formula: |
      # Source: RevenueCheckDetail d where check_status == "PAID"
      #   AND d.division_order.royalty_owner_id == royalty_owner.id
      #   AND d.production_month BETWEEN "<tax_year>-01" AND "<tax_year>-12" inclusive
      # Window: the twelve production months of the calendar year, both ends
      # inclusive. Order-insensitive (pure sums).
      gross_royalty          = round(sum(d.reported_gross_royalty), 2)
      severance_tax_withheld = round(sum(d.severance_tax_amount), 2)
      detail_count           = count(that set)

      # CIRCULAR-LOOKING DEPENDENCY, EVALUATION ORDER PINNED:
      # percentage depletion is capped at a share of taxable income, and taxable
      # income is itself reduced by depletion. The order below is normative:
      #   (1) taxable_before_depletion  - depletion is NOT yet subtracted
      #   (2) depletion_allowance       - min of the statutory rate on gross and
      #                                   the income cap on step (1)
      #   (3) net_taxable               - step (1) minus step (2)
      # Feeding net_taxable back into step (2) is forbidden; the fixed point is
      # defined by this single pass, not by iteration.
      taxable_before_depletion = round(gross_royalty - severance_tax_withheld, 2)
      depletion_allowance      = round(min(DEPLETION_RATE * gross_royalty,
                                           DEPLETION_INCOME_CAP_PCT * taxable_before_depletion), 2)
      net_taxable              = round(taxable_before_depletion - depletion_allowance, 2)
      # Empty set: gross_royalty, severance_tax_withheld, taxable_before_depletion,
      # depletion_allowance and net_taxable are all 0.00 and detail_count is 0;
      # the endpoint returns 200, never an error.
    input_set: "Only PAID revenue details of every division order whose royalty_owner_id is this owner. VARIANCE_HELD details are excluded until a release flips them to PAID, so a suspense release retroactively enlarges the statement."
    constants:
      DEPLETION_RATE: 0.15
      DEPLETION_INCOME_CAP_PCT: 0.65
    precision: "2 decimal places, round_half_up"

  - name: unit_acreage_conservation_invariant
    trigger: "asserted after POST /unit-tract-allocations, POST /unit-tract-allocations/{id}/pugh-release and POST /unit-tract-allocations/{id}/terminate"
    algorithm: aggregation
    formula: |
      # Conserved quantity: ACREAGE (unit_acreage_total), in net acres.
      unit_acreage_total(U) = round(
          sum(a.allocated_acres for a in UnitTractAllocation
              where a.unit_id == U.id and a.allocation_status IN {ACTIVE, PUGH_RELEASED})
          + U.unallocated_acres, 4)
      INVARIANT: unit_acreage_total(U) == U.unit_gross_acres, always.
      # Forward action  : POST /unit-tract-allocations draws allocated_acres out
      #                   of U.unallocated_acres.
      # Compensating    : POST /unit-tract-allocations/{id}/terminate returns the
      #                   full allocated_acres to U.unallocated_acres and drops
      #                   the row out of the summed status set.
      # Partial return  : a pugh release moves exactly released_acres from the
      #                   allocation to U.unallocated_acres, so the total is
      #                   preserved mid-cycle as well.
    input_set: "One Unit and every UnitTractAllocation referencing it; TERMINATED allocations are excluded from the sum because their acreage has already been returned to unallocated_acres."
    constants: {}
    precision: "4 decimal places, round_half_up"

  - name: division_order_net_revenue_invariant
    trigger: "asserted after POST /division-orders/{id}/revenue-check-details and after POST /suspense-accounts/{id}/release"
    algorithm: aggregation
    formula: |
      # Conserved quantity: MONEY (division_order_net_revenue_total), in dollars.
      division_order_net_revenue_total(DO) = round(
          sum(d.net_amount for d in RevenueCheckDetail where d.division_order_id == DO.id), 2)
      INVARIANT: division_order_net_revenue_total(DO)
                 == round(DO.paid_net_total
                          + sum(s.accrued_amount for s in SuspenseAccount
                                where s.division_order_id == DO.id), 2)
      # Forward action  : a variance routes a whole line's net_amount into
      #                   suspense.accrued_amount instead of DO.paid_net_total.
      # Compensating    : POST /suspense-accounts/{id}/release moves exactly
      #                   accrued_amount into DO.paid_net_total and zeroes
      #                   accrued_amount, leaving the total unchanged.
      # suspense.interest_accrued is DELIBERATELY OUTSIDE this quantity: it is
      # newly created money owed by the firm, not reallocated operator revenue.
    input_set: "One DivisionOrder, all of its RevenueCheckDetail rows regardless of check_status, and its SuspenseAccount rows regardless of suspense_status (RELEASED and ESCHEATED accounts carry accrued_amount == 0.00 and so contribute nothing)."
    constants: {}
    precision: "2 decimal places, round_half_up"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated in ascending priority order; the first
# rule that fails is the error the client sees)
# ---------------------------------------------------------------------------
validations:

  # --- 1-9 : auth, existence, shape, concurrency --------------------------
  - priority: 1
    category: auth
    check: "X-User-ID header is present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role header is present and is one of the six roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "the acting role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "entity-backed / owner-bound identity match: for RoyaltyOwner-acted offer and cure endpoints X-User-ID == mineral_interest.seller_owner_id; for Operator-acted unit, allocation and division-order endpoints X-User-ID == unit.operator_user_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /offer-letters/{id}/counter, POST /offer-letters/{id}/accept, POST /offer-letters/{id}/reject, POST /title-defects/{id}/submit-cure, POST /unit-tract-allocations/{id}/pugh-release, POST /unit-tract-allocations/{id}/terminate, POST /division-orders/{id}/operator-response, POST /division-orders/{id}/correct"

  - priority: 5
    category: existence
    check: "every resource named by a path parameter exists, validated left-to-right"
    error_id: "ERR_TRACT_NOT_FOUND | ERR_ROYALTY_OWNER_NOT_FOUND | ERR_MINERAL_INTEREST_NOT_FOUND | ERR_VALUATION_NOT_FOUND | ERR_OFFER_LETTER_NOT_FOUND | ERR_PSA_NOT_FOUND | ERR_TITLE_DEFECT_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_DIVISION_ORDER_NOT_FOUND | ERR_REVENUE_DETAIL_NOT_FOUND | ERR_SUSPENSE_ACCOUNT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 6
    category: existence
    check: "every FK supplied in the request body resolves to an existing row (tract_id, seller_owner_id, mineral_interest_id, offer_letter_id, unit_id, royalty_owner_id, division_order_id)"
    error_id: "ERR_TRACT_NOT_FOUND | ERR_ROYALTY_OWNER_NOT_FOUND | ERR_MINERAL_INTEREST_NOT_FOUND | ERR_OFFER_LETTER_NOT_FOUND | ERR_UNIT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /tracts/{id}/title-chain-entries, POST /mineral-interests, POST /psas, POST /unit-tract-allocations, POST /division-orders"

  - priority: 7
    category: existence
    check: "request body shape: all required fields present, enum fields hold a declared value, numeric fields are numbers within their declared range, dates are ISO-8601, fractions are within [0, 1]"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 8
    category: existence
    check: "pagination bounds: 1 <= limit <= 100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all GET list endpoints"

  - priority: 9
    category: state
    check: "OCC on the parent MineralInterest: expected_mineral_interest_version == mineral_interest.version"
    error_id: ERR_STALE_INTEREST_VERSION
    http_status: 412
    applies_to: "POST /psas"

  - priority: 10
    category: state
    check: "OCC on the parent Unit: expected_unit_version == unit.version"
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412
    applies_to: "POST /division-orders"

  # --- 20-33 : state preconditions ----------------------------------------
  - priority: 20
    category: state
    check: "the tract the interest is carved from is CERTIFIED"
    error_id: ERR_TRACT_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /mineral-interests, POST /mineral-interests/{id}/valuations, POST /mineral-interests/{id}/offer-letters"

  - priority: 21
    category: state
    check: "the tract's chain contains at least one entry and exactly one PATENT instrument"
    error_id: ERR_TITLE_CHAIN_INCOMPLETE
    http_status: 409
    applies_to: "POST /tracts/{id}/certify-title"

  - priority: 22
    category: state
    check: "tract.title_status == RESEARCH (a certified tract cannot be certified again)"
    error_id: ERR_TRACT_STATE_INVALID
    http_status: 409
    applies_to: "POST /tracts/{id}/certify-title"

  - priority: 23
    category: state
    check: "mineral_interest.interest_status is the state the requested operation transitions out of (PROSPECT for a new offer letter, OFFERED for a PSA)"
    error_id: ERR_INTEREST_STATE_INVALID
    http_status: 409
    applies_to: "POST /mineral-interests/{id}/offer-letters, POST /psas"

  - priority: 24
    category: state
    check: "a Valuation with valuation_status == CURRENT exists for the interest"
    error_id: ERR_NO_CURRENT_VALUATION
    http_status: 409
    applies_to: "POST /mineral-interests/{id}/offer-letters, POST /offer-letters/{id}/revise"

  - priority: 25
    category: state
    check: "offer_letter.offer_status is in the from-set of the requested transition (SENT/REVISED for counter and accept; SENT/COUNTERED/REVISED for reject; COUNTERED for revise; ACCEPTED for POST /psas)"
    error_id: ERR_OFFER_STATE_INVALID
    http_status: 409
    applies_to: "POST /offer-letters/{id}/counter, POST /offer-letters/{id}/revise, POST /offer-letters/{id}/accept, POST /offer-letters/{id}/reject, POST /psas"

  - priority: 26
    category: state
    check: "psa.curative_status == CURATIVE_OPEN"
    error_id: ERR_CURATIVE_PERIOD_CLOSED
    http_status: 409
    applies_to: "POST /psas/{id}/title-defects, POST /psas/{id}/close-curative, POST /title-defects/{id}/submit-cure, POST /title-defects/{id}/cure-decision, POST /title-defects/{id}/waive"

  - priority: 27
    category: state
    check: "psa.curative_status == CURATIVE_CLOSED before money moves or a deed is recorded"
    error_id: ERR_CURATIVE_PERIOD_OPEN
    http_status: 409
    applies_to: "POST /psas/{id}/fund, POST /psas/{id}/record-deed"

  - priority: 28
    category: state
    check: "psa.funding_status == UNFUNDED for a fund request, and == FUNDED for a record-deed request"
    error_id: ERR_PSA_ALREADY_FUNDED
    http_status: 409
    applies_to: "POST /psas/{id}/fund, POST /psas/{id}/record-deed"

  - priority: 29
    category: state
    check: "psa.recorded_book_page is null"
    error_id: ERR_DEED_ALREADY_RECORDED
    http_status: 409
    applies_to: "POST /psas/{id}/record-deed"

  - priority: 30
    category: state
    check: "defect.defect_status is in the from-set of the requested transition (RAISED/CURE_REJECTED for submit-cure; CURE_SUBMITTED for cure-decision; RAISED/CURE_SUBMITTED/CURE_REJECTED for waive)"
    error_id: ERR_DEFECT_STATE_INVALID
    http_status: 409
    applies_to: "POST /title-defects/{id}/submit-cure, POST /title-defects/{id}/cure-decision, POST /title-defects/{id}/waive"

  - priority: 31
    category: state
    check: "allocation.allocation_status == ACTIVE for a pugh release, and IN {ACTIVE, PUGH_RELEASED} for a termination"
    error_id: ERR_ALLOCATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /unit-tract-allocations/{id}/pugh-release, POST /unit-tract-allocations/{id}/terminate"

  - priority: 32
    category: state
    check: "division_order.do_status is in the from-set of the requested transition (SENT for operator-response; DISPUTED for correct; EXECUTED for a new revenue check detail)"
    error_id: ERR_DIVISION_ORDER_STATE_INVALID
    http_status: 409
    applies_to: "POST /division-orders/{id}/operator-response, POST /division-orders/{id}/correct, POST /division-orders/{id}/revenue-check-details"

  - priority: 33
    category: state
    check: "suspense.suspense_status == ACCRUING"
    error_id: ERR_SUSPENSE_STATE_INVALID
    http_status: 409
    applies_to: "POST /suspense-accounts/{id}/release, POST /suspense-accounts/{id}/escheat"

  # --- 50-54 : business_safety (compliance and segregation of duties) -----
  - priority: 50
    category: business_safety
    check: "segregation of duties on acquisition: X-User-ID issuing the offer letter must differ from valuation.approved_by_user_id of the interest's CURRENT valuation"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /mineral-interests/{id}/offer-letters"

  - priority: 51
    category: business_safety
    check: "segregation of duties on disbursement: X-User-ID releasing suspense must differ from division_order.created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /suspense-accounts/{id}/release"

  - priority: 52
    category: business_safety
    check: "cross-entity owner status: royalty_owner.contact_status == LOCATED before funds are released"
    error_id: ERR_OWNER_UNLOCATABLE
    http_status: 409
    applies_to: "POST /suspense-accounts/{id}/release"

  - priority: 53
    category: business_safety
    check: "cross-entity tax compliance: royalty_owner.tax_id_on_file == true before funds are released"
    error_id: ERR_OWNER_TAX_ID_MISSING
    http_status: 409
    applies_to: "POST /suspense-accounts/{id}/release"

  - priority: 54
    category: business_safety
    check: "escheat is only lawful for an unlocatable owner: suspense.suspense_reason == UNLOCATABLE_OWNER"
    error_id: ERR_ESCHEAT_REASON_INVALID
    http_status: 409
    applies_to: "POST /suspense-accounts/{id}/escheat"

  # --- 60-66 : business_temporal -----------------------------------------
  - priority: 60
    category: business_temporal
    check: "the offer has not lapsed: logical clock date <= offer_letter.expires_on (the lazy EXPIRED auto-transition fires first, then the write is rejected)"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /offer-letters/{id}/counter, POST /offer-letters/{id}/revise, POST /offer-letters/{id}/accept"

  - priority: 61
    category: business_temporal
    check: "the curative window is still open in time: logical clock date <= psa.curative_deadline"
    error_id: ERR_CURATIVE_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /title-defects/{id}/submit-cure, POST /title-defects/{id}/waive"

  - priority: 62
    category: business_temporal
    check: "a recorded deed cannot pre-date the agreement: recording_date >= psa.effective_date"
    error_id: ERR_RECORDING_DATE_BEFORE_EFFECTIVE
    http_status: 422
    applies_to: "POST /psas/{id}/record-deed"

  - priority: 63
    category: business_temporal
    check: "the pugh deadline has arrived: logical clock date >= unit.pugh_deadline"
    error_id: ERR_PUGH_DEADLINE_NOT_REACHED
    http_status: 409
    applies_to: "POST /unit-tract-allocations/{id}/pugh-release"

  - priority: 64
    category: business_temporal
    check: "the statutory dormancy period has elapsed: suspense.months_held >= ESCHEAT_MONTHS (36), boundary inclusive"
    error_id: ERR_ESCHEAT_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /suspense-accounts/{id}/escheat"

  - priority: 65
    category: business_temporal
    check: "buffered PSA occupancy on a tract: the closed inclusive window [effective_date, window_end_with_buffer] of the new agreement must not intersect that of any existing PurchaseSaleAgreement on the same tract_id whose psa_status IN {EXECUTED, TERMINATED}. Touching endpoints count as an intersection."
    error_id: ERR_PSA_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /psas"

  - priority: 66
    category: business_temporal
    check: "allocation interval exclusivity on (unit_id, tract_id): the half-open interval [effective_from, effective_to) of the new allocation must not overlap that of any allocation for the same pair whose allocation_status IN {ACTIVE, PUGH_RELEASED}. Adjacency (new.effective_from == existing.effective_to) is explicitly allowed."
    error_id: ERR_ALLOCATION_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /unit-tract-allocations"

  # --- 67-71 : business_constraint ---------------------------------------
  - priority: 67
    category: business_constraint
    check: "the negotiation is not exhausted: offer_letter.counter_round_count < MAX_COUNTER_ROUNDS (3)"
    error_id: ERR_COUNTER_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /offer-letters/{id}/counter"

  - priority: 68
    category: business_constraint
    check: "the chronological chain replay never drives running acreage below zero"
    error_id: ERR_CHAIN_ACREAGE_NEGATIVE
    http_status: 422
    applies_to: "POST /tracts/{id}/certify-title"

  - priority: 69
    category: business_constraint
    check: "aggregate ORRI burden on a tract does not exceed BURDEN_CAP (0.2500)"
    error_id: ERR_BURDEN_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /tracts/{id}/certify-title"

  - priority: 70
    category: business_constraint
    check: "pugh releases require undeveloped depth: unit.pugh_clause_active == true and unit.producing_depth_count < unit.total_depth_count"
    error_id: "ERR_PUGH_CLAUSE_NOT_APPLICABLE | ERR_PUGH_ALL_DEPTHS_PRODUCING"
    http_status: 409
    applies_to: "POST /unit-tract-allocations/{id}/pugh-release"

  - priority: 71
    category: business_constraint
    check: "one revenue check detail per (division_order_id, production_month, product_code)"
    error_id: ERR_DUPLICATE_PRODUCTION_MONTH
    http_status: 409
    applies_to: "POST /division-orders/{id}/revenue-check-details"

  - priority: 79
    category: business_constraint
    check: "county_book_page is unique within a tract's chain of title"
    error_id: ERR_DUPLICATE_BOOK_PAGE
    http_status: 409
    applies_to: "POST /tracts/{id}/title-chain-entries"

  # --- 72-74 : business_referential --------------------------------------
  - priority: 72
    category: business_referential
    check: "given the interest's tract participates in the unit at all (at least one UnitTractAllocation row exists for (unit.id, interest.tract_id) in any status and any interval), at least one such row covers the logical clock date: effective_from <= clock_date < effective_to. Disjoint from priority 74: this rule is inapplicable when no row exists for the pair."
    error_id: ERR_NO_ACTIVE_ALLOCATION
    http_status: 422
    applies_to: "POST /division-orders, POST /division-orders/{id}/correct"

  - priority: 73
    category: business_referential
    check: "the selected allocation's allocation_status IN {ACTIVE, PUGH_RELEASED}"
    error_id: ERR_ALLOCATION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /division-orders, POST /division-orders/{id}/correct"

  - priority: 74
    category: business_referential
    check: "the interest's tract participates in the named unit at all: at least one UnitTractAllocation row exists for (unit.id, interest.tract_id) in any status and any interval. Disjoint from priority 72, which only applies once such a row exists. The division order's royalty_owner_id is always derived from mineral_interest.seller_owner_id and is never client-supplied."
    error_id: ERR_TRACT_UNIT_MISMATCH
    http_status: 422
    applies_to: "POST /division-orders"

  # --- 80-85 : business_fiscal (money checks last) ------------------------
  - priority: 80
    category: business_fiscal
    check: "unit acreage capacity: round(sum(allocated_acres of ACTIVE/PUGH_RELEASED allocations) + new allocated_acres, 4) <= unit.unit_gross_acres. Equality is allowed."
    error_id: ERR_UNIT_ACREAGE_OVERSUBSCRIBED
    http_status: 422
    applies_to: "POST /unit-tract-allocations"

  - priority: 81
    category: business_fiscal
    check: "offer amount is not below the walk-away floor: offer_amount >= valuation.bid_floor (equality allowed)"
    error_id: ERR_OFFER_BELOW_BID_FLOOR
    http_status: 422
    applies_to: "POST /mineral-interests/{id}/offer-letters, POST /offer-letters/{id}/revise"

  - priority: 82
    category: business_fiscal
    check: "offer amount is within authority: offer_amount <= valuation.max_bid (equality allowed)"
    error_id: ERR_OFFER_ABOVE_MAX_BID
    http_status: 422
    applies_to: "POST /mineral-interests/{id}/offer-letters, POST /offer-letters/{id}/revise"

  - priority: 83
    category: business_fiscal
    check: "the wire must settle the defect-adjusted price exactly: wire_amount == psa.adjusted_purchase_price"
    error_id: ERR_FUNDING_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /psas/{id}/fund"

  - priority: 84
    category: business_fiscal
    check: "a defect cannot impair more acreage than was bought: affected_nma <= mineral_interest.net_mineral_acres"
    error_id: ERR_DEFECT_ACREAGE_EXCEEDS_INTEREST
    http_status: 422
    applies_to: "POST /psas/{id}/title-defects"

  - priority: 85
    category: business_fiscal
    check: "a correction must state the recomputed decimal: corrected_decimal == calculations.expected_decimal_interest evaluated against current state, to 8 decimal places"
    error_id: ERR_CORRECTED_DECIMAL_MISMATCH
    http_status: 422
    applies_to: "POST /division-orders/{id}/correct"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:

  # ---------------- Tract and title chain ---------------------------------
  - method: POST
    path: "/tracts"
    description: "Open a tract file for county-records title research. The tract starts in RESEARCH with no certified acreage."
    roles: [TitleAnalyst]
    code: 201
    input: [county, state_code, gross_acres, "operator_activity_tier?"]
    output: Tract
    side_effects:
      - "sets title_status = RESEARCH, chain_entry_count = 0, net_mineral_acres_certified = null, existing_burden_fraction = null"

  - method: GET
    path: "/tracts/{id}"
    description: "Read one tract, including its certified net mineral acres and aggregate ORRI burden."
    roles: [TitleAnalyst, AcquisitionManager, DivisionOrderAdmin, Operator]
    code: 200
    input: []
    output: Tract
    side_effects: []

  - method: GET
    path: "/tracts"
    description: "List tracts, filterable by state and title posture."
    roles: [TitleAnalyst, AcquisitionManager, DivisionOrderAdmin, Operator]
    code: 200
    input: ["state_code?", "title_status?", "limit?", "offset?"]
    output: Tract[]
    side_effects: []

  - method: POST
    path: "/tracts/{id}/title-chain-entries"
    description: "Record one county instrument in the tract's chain of title. Append-only and immutable. Filing against an already CERTIFIED tract reverts it to RESEARCH."
    roles: [TitleAnalyst]
    code: 201
    input: [instrument_type, instrument_date, "conveyed_fraction?", "conveyed_acres?", county_book_page, grantor_name, grantee_name]
    output: TitleChainEntry
    side_effects:
      - "increments tract.chain_entry_count by 1 and tract.version by 1"
      - "if tract.title_status == CERTIFIED: reverts it to RESEARCH and nulls net_mineral_acres_certified, existing_burden_fraction and certified_at"
      - "rejects with ERR_CHAIN_ACREAGE_NEGATIVE nothing at this stage - the acreage replay is only enforced at certification"

  - method: GET
    path: "/tracts/{id}/title-chain-entries"
    description: "FK reverse-reachability for TitleChainEntry.tract_id. Returns the tract's chain in instrument_date ASC, created_at ASC order - the exact order the chronological replay uses."
    roles: [TitleAnalyst, AcquisitionManager]
    code: 200
    input: ["instrument_type?", "limit?", "offset?"]
    output: TitleChainEntry[]
    side_effects: []

  - method: POST
    path: "/tracts/{id}/certify-title"
    description: "Certify the chain of title: replay the chain chronologically to establish net mineral acres and aggregate ORRI burden."
    roles: [TitleAnalyst]
    code: 200
    input: []
    output: Tract
    side_effects:
      - "runs calculations.net_mineral_acres_from_chain and writes tract.net_mineral_acres_certified"
      - "runs calculations.tract_burden_fraction and writes tract.existing_burden_fraction"
      - "sets tract.title_status = CERTIFIED and tract.certified_at = the logical clock instant"
      - "increments tract.version by 1"

  - method: GET
    path: "/tracts/{id}/unit-allocations"
    description: "FK reverse-reachability for UnitTractAllocation.tract_id. Every allocation that has ever drawn acreage from this tract, any status."
    roles: [TitleAnalyst, DivisionOrderAdmin, Operator]
    code: 200
    input: ["allocation_status?", "limit?", "offset?"]
    output: UnitTractAllocation[]
    side_effects: []

  # ---------------- Royalty owner ------------------------------------------
  - method: POST
    path: "/royalty-owners"
    description: "Register an owner of record. contact_status defaults to LOCATED and tax_id_on_file to false."
    roles: [DivisionOrderAdmin]
    code: 201
    input: [legal_name, state_code, mailing_address, "contact_status?", "tax_id_on_file?"]
    output: RoyaltyOwner
    side_effects:
      - "sets suspense_total = 0.00"

  - method: GET
    path: "/royalty-owners/{id}"
    description: "Read one owner of record."
    roles: [TitleAnalyst, AcquisitionManager, DivisionOrderAdmin, RoyaltyOwner]
    code: 200
    input: []
    output: RoyaltyOwner
    side_effects: []

  - method: GET
    path: "/royalty-owners"
    description: "List owners of record, filterable by locatability."
    roles: [AcquisitionManager, DivisionOrderAdmin]
    code: 200
    input: ["contact_status?", "state_code?", "limit?", "offset?"]
    output: RoyaltyOwner[]
    side_effects: []

  - method: PATCH
    path: "/royalty-owners/{id}"
    description: "Update owner contact data - the business surface that makes an owner unlocatable, re-locates a found owner, or records a received W-9."
    roles: [DivisionOrderAdmin]
    code: 200
    input: ["contact_status?", "tax_id_on_file?", "mailing_address?"]
    output: RoyaltyOwner
    side_effects:
      - "increments royalty_owner.version by 1"
      - "does NOT retro-route revenue: details already PAID stay PAID and details already VARIANCE_HELD stay held"

  - method: GET
    path: "/royalty-owners/{id}/tax-statement"
    description: "Computed read: the owner's annual severance-tax and percentage-depletion statement for one tax year, per calculations.owner_tax_statement. Returns zeros with detail_count 0 when the owner has no PAID revenue detail in the year."
    roles: [DivisionOrderAdmin, RoyaltyOwner]
    code: 200
    input: [tax_year]
    output:
      royalty_owner_id: string
      tax_year: integer
      gross_royalty: number
      severance_tax_withheld: number
      taxable_before_depletion: number
      depletion_allowance: number
      net_taxable: number
      detail_count: integer
    side_effects: []

  # ---------------- Mineral interest and valuation -------------------------
  - method: POST
    path: "/mineral-interests"
    description: "Carve a mineral interest out of a CERTIFIED tract. net_mineral_acres and existing_burden_fraction are frozen from the tract at creation."
    roles: [AcquisitionManager]
    code: 201
    input: [tract_id, seller_owner_id, seller_share_fraction, lease_royalty_rate, undeveloped_net_acres]
    output: MineralInterest
    side_effects:
      - "sets net_mineral_acres = round(tract.net_mineral_acres_certified * seller_share_fraction, 4)"
      - "copies tract.existing_burden_fraction into the interest"
      - "sets interest_status = PROSPECT"

  - method: GET
    path: "/mineral-interests/{id}"
    description: "Read one mineral interest."
    roles: [TitleAnalyst, AcquisitionManager, DivisionOrderAdmin]
    code: 200
    input: []
    output: MineralInterest
    side_effects: []

  - method: GET
    path: "/mineral-interests"
    description: "FK reverse-reachability for MineralInterest.tract_id and MineralInterest.seller_owner_id."
    roles: [TitleAnalyst, AcquisitionManager, DivisionOrderAdmin]
    code: 200
    input: ["tract_id?", "seller_owner_id?", "interest_status?", "limit?", "offset?"]
    output: MineralInterest[]
    side_effects: []

  - method: POST
    path: "/mineral-interests/{id}/valuations"
    description: "File a decline-curve valuation. Both variants of calculations.valuation_bid_band are evaluated: bid_floor from pdp_only and max_bid from risked_upside."
    roles: [AcquisitionManager]
    code: 201
    input: [current_monthly_net_revenue, annual_decline_rate, undeveloped_net_acres]
    output: Valuation
    side_effects:
      - "copies tract.operator_activity_tier onto the valuation"
      - "computes pdp_pv, undeveloped_pv, bid_floor and max_bid per calculations.valuation_bid_band"
      - "sets valuation_status = CURRENT and approved_by_user_id = X-User-ID"
      - "supersedes the interest's previous CURRENT valuation (valuation_status = SUPERSEDED) and repoints mineral_interest.current_valuation_id"
      - "increments mineral_interest.version by 1"

  - method: GET
    path: "/mineral-interests/{id}/valuations"
    description: "FK reverse-reachability for Valuation.mineral_interest_id. All valuations of the interest, newest first."
    roles: [AcquisitionManager, DivisionOrderAdmin]
    code: 200
    input: ["valuation_status?", "limit?", "offset?"]
    output: Valuation[]
    side_effects: []

  - method: GET
    path: "/valuations/{id}"
    description: "Read one valuation, including the bid band the offer surface enforces."
    roles: [AcquisitionManager, DivisionOrderAdmin]
    code: 200
    input: []
    output: Valuation
    side_effects: []

  - method: POST
    path: "/mineral-interests/{id}/offer-letters"
    description: "Issue an offer letter inside the CURRENT valuation's bid band. Segregation of duties: the issuer must not be the manager who filed the valuation."
    roles: [AcquisitionManager]
    code: 201
    input: [offer_amount, expires_on]
    output: OfferLetter
    side_effects:
      - "sets offer_status = SENT, current_amount = offer_amount, counter_round_count = 0, issued_by_user_id = X-User-ID"
      - "sets mineral_interest.interest_status = OFFERED and increments mineral_interest.version by 1"

  - method: GET
    path: "/mineral-interests/{id}/offer-letters"
    description: "FK reverse-reachability for OfferLetter.mineral_interest_id."
    roles: [AcquisitionManager, RoyaltyOwner]
    code: 200
    input: ["offer_status?", "limit?", "offset?"]
    output: OfferLetter[]
    side_effects: []

  # ---------------- Offer negotiation --------------------------------------
  - method: GET
    path: "/offer-letters/{id}"
    description: "Read one offer letter, including its live amount and counter round count."
    roles: [AcquisitionManager, RoyaltyOwner]
    code: 200
    input: []
    output: OfferLetter
    side_effects: []

  - method: POST
    path: "/offer-letters/{id}/counter"
    description: "Owner counters the offer. Records the counter amount without moving the firm's live amount. Bounded by MAX_COUNTER_ROUNDS (3)."
    roles: [RoyaltyOwner]
    code: 200
    input: [counter_amount]
    output: OfferLetter
    side_effects:
      - "sets last_counter_amount, increments counter_round_count by 1, sets offer_status = COUNTERED"
      - "evaluates the lazy EXPIRED auto-transition first; a lapsed offer is expired and the write rejected with ERR_OFFER_EXPIRED"

  - method: POST
    path: "/offer-letters/{id}/revise"
    description: "Firm revises its live amount and extends the expiry. The revised amount must still sit inside the CURRENT valuation's bid band."
    roles: [AcquisitionManager]
    code: 200
    input: [revised_amount, expires_on]
    output: OfferLetter
    side_effects:
      - "sets current_amount = revised_amount, expires_on = the supplied date, offer_status = REVISED"

  - method: POST
    path: "/offer-letters/{id}/accept"
    description: "Owner accepts the live amount. Only the seller of record on the interest may accept."
    roles: [RoyaltyOwner]
    code: 200
    input: []
    output: OfferLetter
    side_effects:
      - "sets offer_status = ACCEPTED and accepted_at = the logical clock instant"

  - method: POST
    path: "/offer-letters/{id}/reject"
    description: "Owner rejects the offer; the interest is released back out of the acquisition pipeline."
    roles: [RoyaltyOwner]
    code: 200
    input: ["rejection_reason?"]
    output: OfferLetter
    side_effects:
      - "sets offer_status = REJECTED"
      - "sets mineral_interest.interest_status = RELEASED and increments mineral_interest.version by 1"

  # ---------------- Purchase and sale agreement ----------------------------
  - method: POST
    path: "/psas"
    description: "Paper a purchase and sale agreement on an ACCEPTED offer. Optimistic concurrency on the parent MineralInterest via expected_mineral_interest_version (§1.2.1 psa-create-stale-interest). The buffered occupancy window [effective_date, window_end_with_buffer] must not intersect any existing agreement's window on the same tract."
    roles: [AcquisitionManager]
    code: 201
    input: [offer_letter_id, effective_date, individual_defect_threshold, aggregate_defect_basket, expected_mineral_interest_version, "curative_days?"]
    output: PurchaseSaleAgreement
    side_effects:
      - "copies mineral_interest_id from the offer letter and tract_id from the interest"
      - "freezes purchase_price = offer_letter.current_amount and adjusted_purchase_price = purchase_price"
      - "computes curative_deadline = effective_date + curative_days and window_end_with_buffer = curative_deadline + PSA_WINDOW_BUFFER_DAYS (30)"
      - "sets curative_status = CURATIVE_OPEN, funding_status = UNFUNDED, psa_status = EXECUTED, created_by_user_id = X-User-ID"
      - "sets mineral_interest.interest_status = UNDER_PSA and increments mineral_interest.version by 1"

  - method: GET
    path: "/psas/{id}"
    description: "Read one agreement across both of its state dimensions plus the derived psa_status."
    roles: [TitleAnalyst, AcquisitionManager]
    code: 200
    input: []
    output: PurchaseSaleAgreement
    side_effects: []

  - method: GET
    path: "/psas"
    description: "FK reverse-reachability for PurchaseSaleAgreement.offer_letter_id, .mineral_interest_id and .tract_id."
    roles: [TitleAnalyst, AcquisitionManager]
    code: 200
    input: ["offer_letter_id?", "mineral_interest_id?", "tract_id?", "psa_status?", "curative_status?", "limit?", "offset?"]
    output: PurchaseSaleAgreement[]
    side_effects: []

  - method: POST
    path: "/psas/{id}/title-defects"
    description: "Raise a title defect inside the open curative period."
    roles: [TitleAnalyst]
    code: 201
    input: [defect_type, affected_nma, description]
    output: TitleDefect
    side_effects:
      - "computes allocated_value and net_defect_value per calculations.defect_price_adjustment"
      - "sets defect_status = RAISED, cure_round_count = 0, raised_by_user_id = X-User-ID"

  - method: GET
    path: "/psas/{id}/title-defects"
    description: "FK reverse-reachability for TitleDefect.psa_id."
    roles: [TitleAnalyst, AcquisitionManager, RoyaltyOwner]
    code: 200
    input: ["defect_status?", "limit?", "offset?"]
    output: TitleDefect[]
    side_effects: []

  - method: POST
    path: "/psas/{id}/close-curative"
    description: "Close the curative period: sweep every unresolved defect to UNCURED, run the basket waterfall, and take either the CURATIVE_CLOSED or the CURATIVE_TERMINATED branch."
    roles: [AcquisitionManager]
    code: 200
    input: []
    output: PurchaseSaleAgreement
    side_effects:
      - "sweeps RAISED / CURE_SUBMITTED / CURE_REJECTED defects to UNCURED"
      - "writes defect_adjustment_amount and adjusted_purchase_price per calculations.defect_price_adjustment"
      - "branch CURATIVE_CLOSED when adjustment <= round(purchase_price * 0.20, 2)"
      - "branch CURATIVE_TERMINATED otherwise, cascading mineral_interest UNDER_PSA -> PROSPECT, its ACCEPTED OfferLetter -> VOIDED and its CURRENT Valuation -> STALE"

  - method: POST
    path: "/psas/{id}/fund"
    description: "Wire the defect-adjusted purchase price. Requires the curative dimension to be CURATIVE_CLOSED and the wire to match adjusted_purchase_price exactly."
    roles: [AcquisitionManager]
    code: 200
    input: [wire_amount, wire_reference]
    output: PurchaseSaleAgreement
    side_effects:
      - "sets funding_status = FUNDED and wire_reference"

  - method: POST
    path: "/psas/{id}/record-deed"
    description: "Record the mineral deed with the county clerk. Fires the four-hop ownership-change cascade: PSA -> MineralInterest -> DivisionOrder -> SuspenseAccount."
    roles: [TitleAnalyst]
    code: 200
    input: [recording_county, recorded_book_page, recording_date]
    output: PurchaseSaleAgreement
    side_effects:
      - "sets recording_county, recorded_book_page, recording_date and psa_status = CLOSED"
      - "hop 2: mineral_interest.interest_status = ACQUIRED, acquiring_deed_book_page = recorded_book_page, version incremented"
      - "hop 3: every DivisionOrder of that interest with do_status IN {SENT, EXECUTED} -> DISPUTED with dispute_reason = OWNERSHIP_CHANGE and expected_decimal recomputed"
      - "hop 4: for each such order, upserts its SuspenseAccount with suspense_reason = OWNERSHIP_TRANSFER and suspense_status = ACCRUING"

  # ---------------- Title defect curative ---------------------------------
  - method: GET
    path: "/title-defects/{id}"
    description: "Read one title defect, including its allocated and net defect values."
    roles: [TitleAnalyst, AcquisitionManager, RoyaltyOwner]
    code: 200
    input: []
    output: TitleDefect
    side_effects: []

  - method: POST
    path: "/title-defects/{id}/submit-cure"
    description: "Seller submits a curative instrument. Loop-closing edge of the cure cycle - callable again after a rejection."
    roles: [RoyaltyOwner]
    code: 200
    input: [cure_instrument_book_page]
    output: TitleDefect
    side_effects:
      - "sets defect_status = CURE_SUBMITTED, records cure_instrument_book_page, increments cure_round_count by 1"

  - method: POST
    path: "/title-defects/{id}/cure-decision"
    description: "Analyst accepts or rejects the submitted cure. ACCEPTED removes the defect from the price adjustment; REJECTED returns it to the cure loop."
    roles: [TitleAnalyst]
    code: 200
    input: [decision, "decision_note?"]
    output: TitleDefect
    side_effects:
      - "decision == ACCEPTED sets defect_status = CURED; decision == REJECTED sets defect_status = CURE_REJECTED"

  - method: POST
    path: "/title-defects/{id}/waive"
    description: "Manager waives the defect, removing it from the basket waterfall without a curative instrument."
    roles: [AcquisitionManager]
    code: 200
    input: ["waiver_note?"]
    output: TitleDefect
    side_effects:
      - "sets defect_status = WAIVED and waived_by_user_id = X-User-ID"

  # ---------------- Unitization and pooling --------------------------------
  - method: POST
    path: "/units"
    description: "Form a unit. unallocated_acres starts equal to unit_gross_acres, which is what makes the acreage-conservation invariant hold from creation."
    roles: [Operator]
    code: 201
    input: [unit_name, formation, state_code, unit_gross_acres, royalty_rate_cap, producing_depth_count, total_depth_count, "pugh_clause_active?", "pugh_deadline?"]
    output: Unit
    side_effects:
      - "sets unallocated_acres = unit_gross_acres, active_allocation_count = 0, operator_user_id = X-User-ID"

  - method: GET
    path: "/units/{id}"
    description: "Read one unit, including its live unallocated acreage."
    roles: [TitleAnalyst, AcquisitionManager, DivisionOrderAdmin, Operator]
    code: 200
    input: []
    output: Unit
    side_effects: []

  - method: GET
    path: "/units"
    description: "List units."
    roles: [DivisionOrderAdmin, Operator]
    code: 200
    input: ["state_code?", "formation?", "limit?", "offset?"]
    output: Unit[]
    side_effects: []

  - method: PATCH
    path: "/units/{id}"
    description: "Operator amends the unit's depth and pugh configuration - the business surface that brings a depth interval on production or activates a pugh clause."
    roles: [Operator]
    code: 200
    input: ["producing_depth_count?", "pugh_clause_active?", "pugh_deadline?", "royalty_rate_cap?"]
    output: Unit
    side_effects:
      - "increments unit.version by 1, which is exactly what makes a previously-read expected_unit_version stale for POST /division-orders"
      - "does NOT re-run any existing DivisionOrder's decimal - a pinned decimal only moves through POST /division-orders/{id}/correct"

  - method: POST
    path: "/unit-tract-allocations"
    description: "Commit tract acreage to a unit for a half-open occupancy interval [effective_from, effective_to). Adjacent intervals on the same (unit, tract) pair are allowed; overlapping ones are not."
    roles: [Operator]
    code: 201
    input: [unit_id, tract_id, allocated_acres, effective_from, effective_to, pooling_election]
    output: UnitTractAllocation
    side_effects:
      - "sets allocation_status = ACTIVE and released_acres = 0.0000"
      - "sets unit.unallocated_acres = round(unit.unallocated_acres - allocated_acres, 4), increments unit.active_allocation_count by 1 and unit.version by 1"
      - "preserves calculations.unit_acreage_conservation_invariant"

  - method: GET
    path: "/unit-tract-allocations/{id}"
    description: "Read one allocation, including released acreage after a pugh release."
    roles: [DivisionOrderAdmin, Operator]
    code: 200
    input: []
    output: UnitTractAllocation
    side_effects: []

  - method: GET
    path: "/units/{id}/tract-allocations"
    description: "FK reverse-reachability for UnitTractAllocation.unit_id."
    roles: [DivisionOrderAdmin, Operator]
    code: 200
    input: ["allocation_status?", "tract_id?", "limit?", "offset?"]
    output: UnitTractAllocation[]
    side_effects: []

  - method: POST
    path: "/unit-tract-allocations/{id}/pugh-release"
    description: "Exercise the pugh clause: release the non-producing depth share of the allocation's acreage back to the unit. Requires an active pugh clause, the pugh deadline reached, and at least one non-producing depth."
    roles: [Operator]
    code: 200
    input: []
    output: UnitTractAllocation
    side_effects:
      - "retains round(allocated_acres * producing_depth_count / total_depth_count, 4) and books the remainder to released_acres"
      - "sets allocation_status = PUGH_RELEASED"
      - "returns released_acres to unit.unallocated_acres and increments unit.version by 1"
      - "preserves calculations.unit_acreage_conservation_invariant; every subsequent live-variant decimal shrinks accordingly"

  - method: POST
    path: "/unit-tract-allocations/{id}/terminate"
    description: "Terminate the allocation and return all of its remaining acreage to the unit - the compensating action for allocation creation."
    roles: [Operator]
    code: 200
    input: [termination_reason]
    output: UnitTractAllocation
    side_effects:
      - "sets allocation_status = TERMINATED and termination_reason"
      - "sets unit.unallocated_acres = round(unit.unallocated_acres + allocated_acres, 4), decrements unit.active_allocation_count by 1, increments unit.version by 1"
      - "preserves calculations.unit_acreage_conservation_invariant exactly - no acreage drift across the create/terminate pair"

  # ---------------- Division order and revenue -----------------------------
  - method: POST
    path: "/division-orders"
    description: "Issue a division order to the operator. Optimistic concurrency on the parent Unit via expected_unit_version (§1.2.1 division-order-create-stale-unit). expected_decimal is computed from the allocation effective at the logical clock date."
    roles: [DivisionOrderAdmin]
    code: 201
    input: [mineral_interest_id, unit_id, expected_unit_version]
    output: DivisionOrder
    side_effects:
      - "selects the effective UnitTractAllocation and stores its id in allocation_id"
      - "computes expected_decimal per calculations.expected_decimal_interest"
      - "copies royalty_owner_id from mineral_interest.seller_owner_id"
      - "sets do_status = SENT, dispute_reason = NONE, pinned_decimal = null, created_by_user_id = X-User-ID"
      - "increments unit.version by 1"

  - method: GET
    path: "/division-orders/{id}"
    description: "Read one division order, including the expected, pinned and operator decimals side by side."
    roles: [DivisionOrderAdmin, Operator, RoyaltyOwner]
    code: 200
    input: []
    output: DivisionOrder
    side_effects: []

  - method: GET
    path: "/division-orders"
    description: "FK reverse-reachability for DivisionOrder.mineral_interest_id, .unit_id and .royalty_owner_id."
    roles: [DivisionOrderAdmin, Operator]
    code: 200
    input: ["mineral_interest_id?", "unit_id?", "royalty_owner_id?", "do_status?", "limit?", "offset?"]
    output: DivisionOrder[]
    side_effects: []

  - method: POST
    path: "/division-orders/{id}/operator-response"
    description: "Operator returns its decimal. Branch A (decimal agreed) executes the order and pins the decimal; branch B (decimal disagreed) disputes it and pins nothing."
    roles: [Operator]
    code: 200
    input: [operator_decimal, effective_production_month]
    output: DivisionOrder
    side_effects:
      - "branch A: pinned_decimal = expected_decimal, effective_production_month set, do_status = EXECUTED, dispute_reason = NONE"
      - "branch B: pinned_decimal stays null, effective_production_month stays null, do_status = DISPUTED, dispute_reason = DECIMAL_MISMATCH"

  - method: POST
    path: "/division-orders/{id}/correct"
    description: "Re-issue a disputed order after the decimal has been re-derived. Loop-closing edge back to SENT. corrected_decimal must equal the freshly recomputed expected_decimal."
    roles: [Operator]
    code: 200
    input: [corrected_decimal]
    output: DivisionOrder
    side_effects:
      - "recomputes expected_decimal per calculations.expected_decimal_interest"
      - "clears operator_decimal, sets do_status = SENT and dispute_reason = NONE"
      - "increments correction_round_count by 1"

  - method: POST
    path: "/division-orders/{id}/revenue-check-details"
    description: "Operator reports one month of revenue on one product stream. Runs both variants of calculations.royalty_check_reconciliation and routes the line to PAID or to suspense."
    roles: [Operator]
    code: 201
    input: [production_month, product_code, gross_volume, gross_value, operator_decimal_used]
    output: RevenueCheckDetail
    side_effects:
      - "computes reported_gross_royalty, severance_tax_rate, severance_tax_amount and net_amount"
      - "pinned variant: expected_gross_royalty, expected_net_amount, variance_amount"
      - "live variant: audit_decimal, audit_gross_royalty, audit_variance_amount"
      - "PAID adds net_amount to division_order.paid_net_total"
      - "VARIANCE_HELD cascades the order EXECUTED -> SUSPENDED and upserts its SuspenseAccount (accrued_amount += net_amount, held_detail_count += 1)"

  - method: GET
    path: "/division-orders/{id}/revenue-check-details"
    description: "FK reverse-reachability for RevenueCheckDetail.division_order_id."
    roles: [DivisionOrderAdmin, Operator, RoyaltyOwner]
    code: 200
    input: ["production_month?", "check_status?", "limit?", "offset?"]
    output: RevenueCheckDetail[]
    side_effects: []

  - method: GET
    path: "/revenue-check-details/{id}"
    description: "Read one revenue check detail, including both the pinned-variance and the audit-variance figures."
    roles: [DivisionOrderAdmin, Operator, RoyaltyOwner]
    code: 200
    input: []
    output: RevenueCheckDetail
    side_effects: []

  # ---------------- Suspense resolution ------------------------------------
  - method: GET
    path: "/suspense-accounts/{id}"
    description: "Read one suspense account, including recomputed months_held, interest_accrued and release_amount as of the logical clock."
    roles: [DivisionOrderAdmin, RoyaltyOwner]
    code: 200
    input: []
    output: SuspenseAccount
    side_effects: []

  - method: GET
    path: "/suspense-accounts"
    description: "FK reverse-reachability for SuspenseAccount.division_order_id and .royalty_owner_id."
    roles: [DivisionOrderAdmin, RoyaltyOwner]
    code: 200
    input: ["division_order_id?", "royalty_owner_id?", "suspense_status?", "suspense_reason?", "limit?", "offset?"]
    output: SuspenseAccount[]
    side_effects: []

  - method: POST
    path: "/suspense-accounts/{id}/release"
    description: "Release held funds to a located owner with a W-9 on file. Segregation of duties: the releasing admin must not be the admin who created the division order."
    roles: [DivisionOrderAdmin]
    code: 200
    input: []
    output: SuspenseAccount
    side_effects:
      - "recomputes months_held, interest_accrued and release_amount against the logical clock"
      - "sets suspense_status = RELEASED, released_by_user_id = X-User-ID, accrued_amount = 0.00, held_detail_count = 0"
      - "cascade: every VARIANCE_HELD revenue detail of the order becomes PAID, division_order.paid_net_total grows by the released accrual, cumulative_variance_amount resets to 0.00 and do_status returns to EXECUTED"
      - "preserves calculations.division_order_net_revenue_invariant"

  - method: POST
    path: "/suspense-accounts/{id}/escheat"
    description: "Escheat dormant funds to the state after the statutory holding period. Only lawful for an UNLOCATABLE_OWNER account and only at or after ESCHEAT_MONTHS (36) months held."
    roles: [DivisionOrderAdmin]
    code: 200
    input: [escheat_state_code]
    output: SuspenseAccount
    side_effects:
      - "recomputes months_held, interest_accrued and release_amount"
      - "sets suspense_status = ESCHEATED, escheat_state_code, accrued_amount = 0.00, held_detail_count = 0"
      - "the parent DivisionOrder deliberately stays SUSPENDED - escheat is not a compensating action"

  # ---------------- Test-driving surface ----------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Every deadline, expiry, months-held and effective-interval rule in this scaffold reads this clock and never the wall clock. Before any call to this endpoint the logical clock reads exactly the fixed default 2026-08-01T00:00:00Z."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output:
      current_utc: string
    side_effects:
      - "moves the logical clock only; no entity is mutated and no lazy transition fires until the next write touches the affected row"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:

  # --- auth ---------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID missing or empty, or X-User-Role missing or not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "role-bound identity mismatch: a RoyaltyOwner acting on an offer or cure whose X-User-ID != mineral_interest.seller_owner_id, or an Operator acting on a unit, allocation or division order whose X-User-ID != unit.operator_user_id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the same X-User-ID would perform both halves of a split duty: issuing an offer against a valuation it approved, or releasing suspense on a division order it created"

  # --- request shape ------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, undeclared enum value, wrong type, malformed ISO date, fraction outside [0, 1], or pagination outside 1 <= limit <= 100 / offset >= 0"

  # --- not found ----------------------------------------------------------
  - id: ERR_TRACT_NOT_FOUND
    http: 404
    condition: "no Tract with the given id, in the path or in tract_id"
  - id: ERR_ROYALTY_OWNER_NOT_FOUND
    http: 404
    condition: "no RoyaltyOwner with the given id, in the path or in seller_owner_id"
  - id: ERR_MINERAL_INTEREST_NOT_FOUND
    http: 404
    condition: "no MineralInterest with the given id, in the path or in mineral_interest_id"
  - id: ERR_VALUATION_NOT_FOUND
    http: 404
    condition: "no Valuation with the given id"
  - id: ERR_OFFER_LETTER_NOT_FOUND
    http: 404
    condition: "no OfferLetter with the given id, in the path or in offer_letter_id"
  - id: ERR_PSA_NOT_FOUND
    http: 404
    condition: "no PurchaseSaleAgreement with the given id"
  - id: ERR_TITLE_DEFECT_NOT_FOUND
    http: 404
    condition: "no TitleDefect with the given id"
  - id: ERR_UNIT_NOT_FOUND
    http: 404
    condition: "no Unit with the given id, in the path or in unit_id"
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "no UnitTractAllocation with the given id"
  - id: ERR_DIVISION_ORDER_NOT_FOUND
    http: 404
    condition: "no DivisionOrder with the given id, in the path or in division_order_id"
  - id: ERR_REVENUE_DETAIL_NOT_FOUND
    http: 404
    condition: "no RevenueCheckDetail with the given id"
  - id: ERR_SUSPENSE_ACCOUNT_NOT_FOUND
    http: 404
    condition: "no SuspenseAccount with the given id"

  # --- optimistic concurrency (§1.2.1) ------------------------------------
  - id: ERR_STALE_INTEREST_VERSION
    http: 412
    condition: "POST /psas with expected_mineral_interest_version != mineral_interest.version"
  - id: ERR_STALE_UNIT_VERSION
    http: 412
    condition: "POST /division-orders with expected_unit_version != unit.version"

  # --- state preconditions ------------------------------------------------
  - id: ERR_TRACT_STATE_INVALID
    http: 409
    condition: "certification attempted on a tract whose title_status is already CERTIFIED"
  - id: ERR_TITLE_CHAIN_INCOMPLETE
    http: 409
    condition: "certification attempted with an empty chain, no PATENT instrument, or more than one PATENT instrument"
  - id: ERR_TRACT_NOT_CERTIFIED
    http: 409
    condition: "an interest, a valuation or an offer is attempted while the underlying tract's title_status is RESEARCH"
  - id: ERR_INTEREST_STATE_INVALID
    http: 409
    condition: "mineral_interest.interest_status is not the from-state of the requested operation (offer requires PROSPECT, PSA requires OFFERED)"
  - id: ERR_NO_CURRENT_VALUATION
    http: 409
    condition: "no Valuation with valuation_status == CURRENT exists for the interest, e.g. after a terminated PSA marked it STALE"
  - id: ERR_OFFER_STATE_INVALID
    http: 409
    condition: "offer_letter.offer_status is not in the from-set of the requested transition"
  - id: ERR_CURATIVE_PERIOD_CLOSED
    http: 409
    condition: "defect activity attempted on an agreement whose curative_status is no longer CURATIVE_OPEN"
  - id: ERR_CURATIVE_PERIOD_OPEN
    http: 409
    condition: "funding or deed recording attempted while curative_status is still CURATIVE_OPEN"
  - id: ERR_PSA_ALREADY_FUNDED
    http: 409
    condition: "funding attempted on an agreement whose funding_status is already FUNDED, or recording attempted while funding_status is UNFUNDED"
  - id: ERR_DEED_ALREADY_RECORDED
    http: 409
    condition: "recording attempted when psa.recorded_book_page is already set"
  - id: ERR_DEFECT_STATE_INVALID
    http: 409
    condition: "defect.defect_status is not in the from-set of the requested transition, including any attempt to act on a CURED, WAIVED or UNCURED defect"
  - id: ERR_ALLOCATION_STATE_INVALID
    http: 409
    condition: "pugh release attempted on a non-ACTIVE allocation, or termination attempted on an already TERMINATED allocation"
  - id: ERR_DIVISION_ORDER_STATE_INVALID
    http: 409
    condition: "division_order.do_status is not the from-state of the requested operation (operator response requires SENT, correction requires DISPUTED, revenue detail requires EXECUTED)"
  - id: ERR_SUSPENSE_STATE_INVALID
    http: 409
    condition: "release or escheat attempted on a suspense account that is already RELEASED or ESCHEATED"
  - id: ERR_ALLOCATION_NOT_ACTIVE
    http: 409
    condition: "the allocation selected for a decimal computation has allocation_status == TERMINATED"

  # --- business safety / compliance ---------------------------------------
  - id: ERR_OWNER_UNLOCATABLE
    http: 409
    condition: "suspense release attempted while royalty_owner.contact_status != LOCATED"
  - id: ERR_OWNER_TAX_ID_MISSING
    http: 409
    condition: "suspense release attempted while royalty_owner.tax_id_on_file == false"
  - id: ERR_ESCHEAT_REASON_INVALID
    http: 409
    condition: "escheat attempted on an account whose suspense_reason is not UNLOCATABLE_OWNER"

  # --- business temporal ---------------------------------------------------
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "a counter, revision or acceptance is attempted after the logical clock date passed offer_letter.expires_on; the offer is auto-expired first and the write then rejected"
  - id: ERR_CURATIVE_DEADLINE_PASSED
    http: 409
    condition: "a cure submission or waiver is attempted after the logical clock date passed psa.curative_deadline"
  - id: ERR_RECORDING_DATE_BEFORE_EFFECTIVE
    http: 422
    condition: "recording_date is earlier than psa.effective_date"
  - id: ERR_PUGH_DEADLINE_NOT_REACHED
    http: 409
    condition: "pugh release attempted while the logical clock date is before unit.pugh_deadline"
  - id: ERR_ESCHEAT_PERIOD_NOT_ELAPSED
    http: 409
    condition: "escheat attempted while suspense.months_held < ESCHEAT_MONTHS (36)"
  - id: ERR_PSA_WINDOW_CONFLICT
    http: 409
    condition: "the new agreement's buffered occupancy window [effective_date, window_end_with_buffer] intersects - including at a single touching endpoint - the window of an existing EXECUTED or TERMINATED agreement on the same tract"
  - id: ERR_ALLOCATION_INTERVAL_OVERLAP
    http: 409
    condition: "the new allocation's half-open interval [effective_from, effective_to) overlaps an existing ACTIVE or PUGH_RELEASED allocation on the same (unit_id, tract_id) pair; exact adjacency does not conflict"

  # --- business constraint -------------------------------------------------
  - id: ERR_COUNTER_ROUNDS_EXHAUSTED
    http: 409
    condition: "a fourth owner counter is attempted once counter_round_count reached MAX_COUNTER_ROUNDS (3)"
  - id: ERR_CHAIN_ACREAGE_NEGATIVE
    http: 422
    condition: "the chronological chain replay drives running net mineral acreage below zero at any step"
  - id: ERR_BURDEN_CAP_EXCEEDED
    http: 422
    condition: "the summed ASSIGNMENT conveyed_fraction on a tract exceeds BURDEN_CAP (0.2500)"
  - id: ERR_DUPLICATE_BOOK_PAGE
    http: 409
    condition: "a TitleChainEntry with the same county_book_page already exists on the tract"
  - id: ERR_PUGH_CLAUSE_NOT_APPLICABLE
    http: 409
    condition: "pugh release attempted on a unit whose pugh_clause_active == false"
  - id: ERR_PUGH_ALL_DEPTHS_PRODUCING
    http: 409
    condition: "pugh release attempted when unit.producing_depth_count == unit.total_depth_count, so no depth interval is releasable"
  - id: ERR_DUPLICATE_PRODUCTION_MONTH
    http: 409
    condition: "a RevenueCheckDetail already exists for this (division_order_id, production_month, product_code)"

  # --- business referential ------------------------------------------------
  - id: ERR_NO_ACTIVE_ALLOCATION
    http: 422
    condition: "no UnitTractAllocation covers (unit_id, tract_id) at the logical clock date"
  - id: ERR_TRACT_UNIT_MISMATCH
    http: 422
    condition: "the interest's tract has never been allocated to the named unit, or the royalty_owner_id implied by the interest does not match the order's payee"

  # --- business fiscal -----------------------------------------------------
  - id: ERR_UNIT_ACREAGE_OVERSUBSCRIBED
    http: 422
    condition: "committed acreage plus the requested allocated_acres would exceed unit.unit_gross_acres; equality is permitted"
  - id: ERR_OFFER_BELOW_BID_FLOOR
    http: 422
    condition: "offer_amount or revised_amount is strictly below valuation.bid_floor"
  - id: ERR_OFFER_ABOVE_MAX_BID
    http: 422
    condition: "offer_amount or revised_amount is strictly above valuation.max_bid"
  - id: ERR_FUNDING_AMOUNT_MISMATCH
    http: 422
    condition: "wire_amount != psa.adjusted_purchase_price"
  - id: ERR_DEFECT_ACREAGE_EXCEEDS_INTEREST
    http: 422
    condition: "affected_nma exceeds mineral_interest.net_mineral_acres"
  - id: ERR_CORRECTED_DECIMAL_MISMATCH
    http: 422
    condition: "corrected_decimal does not equal the freshly recomputed expected_decimal to 8 decimal places"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix - role model: segregation_of_duties
# ---------------------------------------------------------------------------
roles:

  - name: TitleAnalyst
    description: "Runs county-records title research: opens tract files, files chain instruments, certifies net mineral acres and burdens, raises and adjudicates title defects, and records the deed."
    identity: opaque
    exclusive_operations:
      - "POST /tracts"
      - "POST /tracts/{id}/title-chain-entries"
      - "POST /tracts/{id}/certify-title"
      - "POST /psas/{id}/title-defects"
      - "POST /title-defects/{id}/cure-decision"
      - "POST /psas/{id}/record-deed"
    shared_operations:
      - "GET /tracts, GET /tracts/{id}, GET /tracts/{id}/title-chain-entries, GET /tracts/{id}/unit-allocations"
      - "GET /royalty-owners/{id}"
      - "GET /mineral-interests, GET /mineral-interests/{id}"
      - "GET /psas, GET /psas/{id}, GET /psas/{id}/title-defects, GET /title-defects/{id}"
      - "GET /units/{id}"

  - name: AcquisitionManager
    description: "Owns the buy side: files decline-curve valuations, issues and revises offer letters inside the bid band, papers agreements, waives defects, closes the curative period and wires funds. Cannot certify title and cannot record the deed."
    identity: opaque
    exclusive_operations:
      - "POST /mineral-interests"
      - "POST /mineral-interests/{id}/valuations"
      - "POST /mineral-interests/{id}/offer-letters"
      - "POST /offer-letters/{id}/revise"
      - "POST /psas"
      - "POST /psas/{id}/close-curative"
      - "POST /psas/{id}/fund"
      - "POST /title-defects/{id}/waive"
    shared_operations:
      - "GET /tracts, GET /tracts/{id}, GET /tracts/{id}/title-chain-entries"
      - "GET /royalty-owners, GET /royalty-owners/{id}"
      - "GET /mineral-interests, GET /mineral-interests/{id}, GET /mineral-interests/{id}/valuations, GET /valuations/{id}"
      - "GET /mineral-interests/{id}/offer-letters, GET /offer-letters/{id}"
      - "GET /psas, GET /psas/{id}, GET /psas/{id}/title-defects, GET /title-defects/{id}"
      - "GET /units/{id}"
    segregation_notes:
      - "the X-User-ID issuing an offer letter must differ from the X-User-ID that filed the interest's CURRENT valuation (ERR_SEGREGATION_OF_DUTIES), so at least two distinct AcquisitionManager user ids are needed to reach any OFFERED interest"

  - name: DivisionOrderAdmin
    description: "Owns the revenue side: registers owners of record, maintains their locatability and W-9 status, issues division orders, and resolves suspense by release or escheat. Cannot value or bid."
    identity: opaque
    exclusive_operations:
      - "POST /royalty-owners"
      - "PATCH /royalty-owners/{id}"
      - "POST /division-orders"
      - "POST /suspense-accounts/{id}/release"
      - "POST /suspense-accounts/{id}/escheat"
    shared_operations:
      - "GET /tracts/{id}, GET /tracts/{id}/unit-allocations"
      - "GET /royalty-owners, GET /royalty-owners/{id}, GET /royalty-owners/{id}/tax-statement"
      - "GET /mineral-interests, GET /mineral-interests/{id}, GET /mineral-interests/{id}/valuations, GET /valuations/{id}"
      - "GET /units, GET /units/{id}, GET /units/{id}/tract-allocations, GET /unit-tract-allocations/{id}"
      - "GET /division-orders, GET /division-orders/{id}, GET /division-orders/{id}/revenue-check-details, GET /revenue-check-details/{id}"
      - "GET /suspense-accounts, GET /suspense-accounts/{id}"
    segregation_notes:
      - "the X-User-ID releasing a suspense account must differ from division_order.created_by_user_id (ERR_SEGREGATION_OF_DUTIES), so at least two distinct DivisionOrderAdmin user ids are needed to reach any RELEASED account"

  - name: Operator
    description: "The unit operator. Forms and amends units, commits tract acreage, exercises pugh releases, responds to division orders and reports monthly revenue check detail. Every operator action is bound to unit.operator_user_id."
    identity: opaque
    exclusive_operations:
      - "POST /units"
      - "PATCH /units/{id}"
      - "POST /unit-tract-allocations"
      - "POST /unit-tract-allocations/{id}/pugh-release"
      - "POST /unit-tract-allocations/{id}/terminate"
      - "POST /division-orders/{id}/operator-response"
      - "POST /division-orders/{id}/correct"
      - "POST /division-orders/{id}/revenue-check-details"
    shared_operations:
      - "GET /tracts, GET /tracts/{id}, GET /tracts/{id}/unit-allocations"
      - "GET /units, GET /units/{id}, GET /units/{id}/tract-allocations, GET /unit-tract-allocations/{id}"
      - "GET /division-orders, GET /division-orders/{id}, GET /division-orders/{id}/revenue-check-details, GET /revenue-check-details/{id}"
    identity_notes:
      - "opaque rather than entity_backed: X-User-ID is an operator staff identifier, never a Unit id. It is compared to unit.operator_user_id, which the server stamped from whichever X-User-ID created the unit."

  - name: RoyaltyOwner
    description: "The mineral owner of record. Counters, accepts or rejects offers on interests it owns, submits curative instruments, and reads its own division orders, revenue detail, suspense accounts and annual tax statement."
    identity: "entity_backed:RoyaltyOwner"
    exclusive_operations:
      - "POST /offer-letters/{id}/counter"
      - "POST /offer-letters/{id}/accept"
      - "POST /offer-letters/{id}/reject"
      - "POST /title-defects/{id}/submit-cure"
    shared_operations:
      - "GET /royalty-owners/{id}, GET /royalty-owners/{id}/tax-statement"
      - "GET /mineral-interests/{id}/offer-letters, GET /offer-letters/{id}"
      - "GET /psas/{id}/title-defects, GET /title-defects/{id}"
      - "GET /division-orders/{id}, GET /division-orders/{id}/revenue-check-details, GET /revenue-check-details/{id}"
      - "GET /suspense-accounts, GET /suspense-accounts/{id}"
    identity_notes:
      - "X-User-ID equals a RoyaltyOwner.id. Every write is additionally gated on X-User-ID == mineral_interest.seller_owner_id (ERR_NOT_RESOURCE_OWNER), so one owner cannot accept another owner's offer."

  - name: PlatformAdmin
    description: "Operational role with no business authority. Its only capability is moving the logical clock so time-gated rules are testable."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: []
