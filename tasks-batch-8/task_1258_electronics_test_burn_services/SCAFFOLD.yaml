# =============================================================================
# Task 1258: Electronics Test & Burn-In Services (third-party test house)
# Scaffold seed tables (§1.0–§1.7). Difficulty: beyond-Expert (dense coupling:
# temporal windowing + event-sourced unit genealogy + compliance gating).
# =============================================================================

scenario: |
  1258. Electronics Test & Burn-In Services (third-party test house): test program & fixture development, chamber slot scheduling & profile, serialized pass/fail & bin mapping, retest policy & escape analysis, customer-owned equipment maintenance, yield reporting & lot disposition, ESD program audit, RMA failure analysis loop

domain_name: electronics-test-burn-in
api_prefix: /api

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing        # chamber slot scheduling with overlap/buffer semantics
  secondary_archetype: event_sourcing          # unit test state derived by replaying non-voided TestResults
  complexity_layers:
    - optimistic_concurrency                   # OCC on TestProgram.version (revisions) and ChamberReservation.version (reschedule)
    - cascading_side_effects                   # supersession cascade depth-3; RMA escape cascade depth-2; fixture maintenance cascade
    - dual_variant_calculation                 # lot yield (FIRST_PASS vs FINAL); chamber utilization (SCHEDULED vs ACTUAL)
    - rate_threshold_triggers                  # disposition thresholds, calibration due (>=), retest limit (<)
  entity_topology: graph                       # flat collections; dense FK cross-references; self-ref + polymorphic
  state_machine_shape: cyclic                  # Unit retest loop; Lot REWORK/CONTAINED loops; Fixture & Equipment maintenance loops
  relationship_patterns:
    - one_to_many                              # Customer→Lot→Unit→TestResult, Customer→TestProgram→Fixture
    - cross_aggregate                          # ChamberReservation → Chamber + Lot + Fixture; TestResult → Unit + Fixture + Equipment
    - self_referential                         # TestProgram.supersedes_program_id -> TestProgram.id (revision chain)
    - polymorphic                              # MaintenanceOrder.target_id -> CustomerEquipment | Chamber via target_type
  role_model: segregation_of_duties            # retest authorizer must differ from failing-result recorder; QE-only voids/dispositions
  consistency_model: immediate                 # all derived fields recomputed within the same request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal customer name" }
      - { name: tier, type: enum, source: input, description: "STANDARD | STRATEGIC; commercial tier" }
      - { name: requires_esd_certification, type: boolean, source: input, description: "If true, chamber reservations for this customer's lots are blocked while an OPEN EsdAudit with a MAJOR finding exists on the chamber's area_code", default: false }
      - { name: account_status, type: enum, source: system, description: "ACTIVE | SUSPENDED; SUSPENDED blocks new lot creation", default: ACTIVE }

  - name: TestProgram
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning customer" }
      - { name: part_number, type: string, source: input, description: "Customer part number this program tests" }
      - { name: revision, type: integer, source: system, description: "Starts at 1; each revisions call mints revision = prior revision + 1" }
      - { name: supersedes_program_id, type: string, source: system, description: "FK -> TestProgram.id; the revision this one replaces, null for revision 1", default: null }
      - { name: bin_map, type: object, source: input, description: "Object mapping bin_code (string of integer) to PASS | SOFT_FAIL | HARD_FAIL; bin 1 conventionally PASS" }
      - { name: max_retests_per_unit, type: integer, source: input, description: "Retest policy ceiling: a unit may accumulate at most this many counted retest insertions; authorization requires retest_count < max_retests_per_unit" }
      - { name: burn_profile, type: array, source: input, description: "Ordered array of {target_temp_c, ramp_rate_c_per_min, soak_minutes}; drives planned_duration_minutes on reservations" }
      - { name: status, type: enum, source: system, description: "DRAFT | VALIDATED | RELEASED | OBSOLETE" }

  - name: Fixture
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> TestProgram.id; program this fixture belongs to" }
      - { name: serial_number, type: string, source: input, description: "Fixture serial" }
      - { name: site_count, type: integer, source: input, description: "Parallel test sites (units per insertion)" }
      - { name: status, type: enum, source: system, description: "COMMISSIONING | AVAILABLE | UNDER_MAINTENANCE | DECOMMISSIONED" }

  - name: Chamber
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Chamber name" }
      - { name: area_code, type: string, source: input, description: "ESD audit area this chamber belongs to" }
      - { name: slot_count, type: integer, source: input, description: "Total burn-in slots" }
      - { name: supported_profile_classes, type: array, source: input, description: "Array of thermal profile classes: A | B | C" }
      - { name: status, type: enum, source: system, description: "ONLINE | MAINTENANCE | OFFLINE" }
      - { name: available_slots, type: integer, source: computed, description: "slot_count minus sum of slot_count over reservations with status IN {RESERVED, IN_PROGRESS}; invariant target of reserve/cancel pairs" }

  - name: ChamberReservation
    parent: null
    common_fields: true
    fields:
      - { name: chamber_id, type: string, source: input, description: "FK -> Chamber.id; booked chamber" }
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; lot occupying the slots" }
      - { name: fixture_id, type: string, source: input, description: "FK -> Fixture.id; fixture that must remain AVAILABLE; its program must equal the lot's program" }
      - { name: profile_class, type: enum, source: input, description: "A | B | C; must be in chamber.supported_profile_classes; class changes across adjacent runs force a purge buffer" }
      - { name: start_at, type: datetime, source: input, description: "Window start (inclusive), ISO 8601 UTC; must be >= current logical clock" }
      - { name: end_at, type: datetime, source: input, description: "Window end (exclusive), ISO 8601 UTC; must be > start_at" }
      - { name: slot_count, type: integer, source: input, description: "Slots occupied; must be >= 1 and <= chamber.available_slots at creation" }
      - { name: planned_duration_minutes, type: integer, source: computed, description: "Burn-in profile duration of the lot's program, per-segment rounded then summed (calculation burn_in_profile_duration)" }
      - { name: status, type: enum, source: system, description: "RESERVED | IN_PROGRESS | COMPLETED | CANCELLED" }

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning customer (CustomerRep must act as this id)" }
      - { name: program_id, type: string, source: input, description: "FK -> TestProgram.id; must be RELEASED at creation and enqueue" }
      - { name: part_number, type: string, source: input, description: "Must equal program.part_number" }
      - { name: quantity, type: integer, source: input, description: "Number of serialized units in the lot; >= 1" }
      - { name: status, type: enum, source: system, description: "RECEIVED | QUEUED | IN_TEST | AWAITING_DISPOSITION | CONTAINED | SHIPPED | SCRAPPED" }
      - { name: units_registered, type: integer, source: computed, description: "Count of Unit rows for this lot" }
      - { name: units_untested, type: integer, source: computed, description: "Units with test_status UNTESTED" }
      - { name: units_passed, type: integer, source: computed, description: "Units with test_status PASSED" }
      - { name: units_failed, type: integer, source: computed, description: "Units with test_status FAILED" }
      - { name: retested_unit_count, type: integer, source: computed, description: "Units with retest_count >= 1" }
      - { name: escape_count, type: integer, source: computed, description: "RmaCase rows CLOSED with fa_conclusion TEST_ESCAPE for this lot" }
      - { name: suggested_disposition, type: enum, source: computed, description: "SHIP | MRB_REVIEW | SCRAP_REVIEW; null until computed at complete-test or RMA containment; see disposition_suggestion", default: null }

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; owning lot" }
      - { name: serial_number, type: string, source: input, description: "Unique within the lot" }
      - { name: test_status, type: enum, source: system, description: "UNTESTED | PASSED | FAILED; derived by replaying the unit's non-voided, non-excluded TestResults" }
      - { name: current_bin, type: integer, source: system, description: "Bin of the latest tally-effective TestResult; null while UNTESTED", default: null }
      - { name: retest_count, type: integer, source: system, description: "Counted retest insertions (insertion_index >= 2 that consumed an authorization); reset to 0 on REWORK" }

  - name: TestResult
    parent: null
    common_fields: false
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; tested unit" }
      - { name: lot_id, type: string, source: computed, description: "FK -> Lot.id; denormalized from unit.lot_id at creation for lot-scoped queries" }
      - { name: program_id, type: string, source: computed, description: "FK -> TestProgram.id; denormalized from lot.program_id; pins the exact program revision used" }
      - { name: fixture_id, type: string, source: input, description: "FK -> Fixture.id; fixture used" }
      - { name: equipment_id, type: string, source: input, description: "FK -> CustomerEquipment.id; optional customer-owned tester used; must be IN_SERVICE when provided", default: null }
      - { name: bin_code, type: integer, source: input, description: "Observed bin; must be a key of the lot program's bin_map" }
      - { name: passed, type: boolean, source: computed, description: "bin_map[bin_code] == PASS" }
      - { name: insertion_index, type: integer, source: computed, description: "1-based count of the unit's non-voided, non-excluded results including this one, assigned chronologically" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the recording TestEngineer; feeds retest segregation-of-duties" }
      - { name: consumed_authorization_id, type: string, source: system, description: "RetestAuthorization consumed by this insertion (insertion_index >= 2); null for first insertions", default: null }
      - { name: voided, type: boolean, source: system, description: "True after POST /test-results/{id}/void", default: false }
      - { name: void_reason, type: string, source: system, description: "Reason captured at void", default: null }
      - { name: excluded_from_tally, type: boolean, source: system, description: "True after a REWORK disposition resets the lot; excluded rows no longer drive unit state or tallies", default: false }

  - name: RetestAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; unit being authorized for one more insertion" }
      - { name: reason, type: string, source: input, description: "Free-text justification" }
      - { name: authorized_by_user_id, type: string, source: system, description: "X-User-ID of the authorizing TestEngineer; must differ from the recorded_by_user_id of the unit's latest tally-effective result" }
      - { name: expires_at, type: datetime, source: system, description: "created_at + 48h; an ACTIVE authorization whose expires_at <= current logical clock is treated as EXPIRED" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CONSUMED | REVOKED | EXPIRED (EXPIRED is derived lazily from expires_at vs the logical clock)" }

  - name: CustomerEquipment
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning customer (customer-owned tester/handler loaned to the test house)" }
      - { name: equipment_type, type: enum, source: input, description: "TESTER | HANDLER | PROBER" }
      - { name: serial_number, type: string, source: input, description: "Equipment serial" }
      - { name: calibration_interval_days, type: integer, source: input, description: "Days between calibrations; >= 1" }
      - { name: last_calibrated_at, type: datetime, source: input, description: "Timestamp of last calibration" }
      - { name: next_calibration_due, type: datetime, source: computed, description: "last_calibrated_at + calibration_interval_days" }
      - { name: status, type: enum, source: system, description: "IN_SERVICE | CALIBRATION_DUE | IN_MAINTENANCE | RETURNED; CALIBRATION_DUE derives lazily when clock >= next_calibration_due" }

  - name: MaintenanceOrder
    parent: null
    common_fields: true
    fields:
      - { name: target_type, type: enum, source: input, description: "EQUIPMENT | CHAMBER; selects which aggregate target_id references" }
      - { name: target_id, type: string, source: input, description: "FK -> CustomerEquipment.id when target_type == EQUIPMENT; otherwise references Chamber.id" }
      - { name: kind, type: enum, source: input, description: "CALIBRATION | REPAIR | PREVENTIVE" }
      - { name: window_start, type: datetime, source: input, description: "Maintenance window start (inclusive); CLOSED interval semantics" }
      - { name: window_end, type: datetime, source: input, description: "Maintenance window end (inclusive); CLOSED interval semantics: a second window touching window_start == existing window_end CONFLICTS" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_PROGRESS | DONE | CANCELLED" }

  - name: EsdAudit
    parent: null
    common_fields: true
    fields:
      - { name: area_code, type: string, source: input, description: "Audited area; gates chamber reservations for certification-requiring customers" }
      - { name: findings, type: array, source: input, description: "Array of {severity: MINOR | MAJOR, description}; may be empty" }
      - { name: corrective_actions, type: array, source: system, description: "Array of {finding_index, action} captured at close; every MAJOR finding index must be covered", default: [] }
      - { name: outcome, type: enum, source: computed, description: "PASS (no findings) | PASS_WITH_MINOR (only MINOR) | FAIL (any MAJOR); computed at close", default: null }
      - { name: auditor_user_id, type: string, source: system, description: "X-User-ID of the QualityEngineer creator" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED" }

  - name: RmaCase
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; lot the returned unit shipped from" }
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; returned serialized unit; must belong to lot_id and be PASSED on a SHIPPED lot" }
      - { name: failure_mode, type: string, source: input, description: "Customer-reported failure description" }
      - { name: fa_status, type: enum, source: system, description: "INTAKE | FA_IN_PROGRESS | FA_COMPLETE | CLOSED" }
      - { name: fa_conclusion, type: enum, source: system, description: "TEST_ESCAPE | CUSTOMER_INDUCED | NO_TROUBLE_FOUND; set at complete-fa", default: null }
      - { name: created_by_customer_id, type: string, source: system, description: "X-User-ID of the creating CustomerRep (equals lot.customer_id)" }

  - name: LotDispositionReview
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: computed, description: "FK -> Lot.id; lot under MRB review" }
      - { name: suggested_disposition, type: enum, source: computed, description: "SHIP | MRB_REVIEW | SCRAP_REVIEW; snapshot of lot.suggested_disposition at review creation" }
      - { name: decision, type: enum, source: system, description: "SHIP | SCRAP | REWORK; null until decided", default: null }
      - { name: rationale, type: string, source: system, description: "Decision rationale captured at decide", default: null }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the deciding QualityEngineer", default: null }
      - { name: status, type: enum, source: system, description: "PENDING | DECIDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /api/customers/{customer_id} with account_status=SUSPENDED"
        actor: OperationsManager
        preconditions: []
        side_effects:
          - "Blocks POST /api/lots for this customer (ERR_CUSTOMER_SUSPENDED)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /api/customers/{customer_id} with account_status=ACTIVE"
        actor: OperationsManager
        preconditions: []
        side_effects: []

  - entity: TestProgram
    initial_state: DRAFT
    terminal_states: [OBSOLETE]
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /api/test-programs/{program_id}/validate"
        actor: TestEngineer
        preconditions:
          - "At least one Fixture with fixture.program_id == program.id has status == AVAILABLE (ERR_NO_AVAILABLE_FIXTURE otherwise)"
        side_effects:
          - "increments TestProgram.version by 1"
      - from: VALIDATED
        to: RELEASED
        trigger: "POST /api/test-programs/{program_id}/release"
        actor: TestEngineer
        preconditions: []
        side_effects:
          - "increments TestProgram.version by 1"
          - "CASCADE HOP 1: the previously RELEASED TestProgram P_old with (customer_id, part_number) equal to this program, if any, transitions RELEASED -> OBSOLETE (its version increments)"
          - "CASCADE HOP 2: every Fixture with program_id == P_old.id and status IN {COMMISSIONING, AVAILABLE, UNDER_MAINTENANCE} transitions to DECOMMISSIONED (version increments)"
          - "CASCADE HOP 3: every ChamberReservation with fixture_id of a fixture decommissioned in hop 2 and status == RESERVED transitions to CANCELLED (version increments)"
          - "CASCADE HOP 4: each cancellation in hop 3 recomputes the affected Chamber.available_slots (slot ledger frees the reservation's slot_count)"
      - from: RELEASED
        to: OBSOLETE
        trigger: "system (a later revision of the same customer_id + part_number is RELEASED)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascades per the release transition hops 2-4"
        note: "Supersession is always caused by a release; there is no manual obsolete endpoint"
      - from: DRAFT
        to: DRAFT
        trigger: "POST /api/test-programs/{program_id}/revisions creates a NEW TestProgram row (revision+1, status DRAFT, supersedes_program_id = this program's id)"
        actor: TestEngineer
        preconditions:
          - "Source program status == RELEASED (ERR_INVALID_STATE otherwise)"
          - "OCC: expected_test_program_version equals source program's current version (ERR_STALE_VERSION otherwise)"
        side_effects:
          - "increments the SOURCE TestProgram.version by 1"
          - "New row copies customer_id, part_number, bin_map, max_retests_per_unit, burn_profile from the source"
        note: "Self-transition on the source row while minting the successor row"

  - entity: Fixture
    initial_state: COMMISSIONING
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: COMMISSIONING
        to: AVAILABLE
        trigger: "POST /api/fixtures/{fixture_id}/commission"
        actor: TestEngineer
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: UNDER_MAINTENANCE
        trigger: "POST /api/fixtures/{fixture_id}/maintenance"
        actor: TestEngineer
        preconditions: []
        side_effects:
          - "Every ChamberReservation with fixture_id == this fixture, status == RESERVED, transitions to CANCELLED"
          - "Each such cancellation recomputes Chamber.available_slots on the affected chamber"
      - from: UNDER_MAINTENANCE
        to: AVAILABLE
        trigger: "POST /api/fixtures/{fixture_id}/return-from-maintenance"
        actor: TestEngineer
        preconditions: []
        side_effects: []
      - from: [COMMISSIONING, AVAILABLE, UNDER_MAINTENANCE]
        to: DECOMMISSIONED
        trigger: "system (owning program superseded at release time)"
        actor: system
        preconditions: []
        side_effects:
          - "Cancels RESERVED ChamberReservations referencing this fixture (see TestProgram release cascade)"

  - entity: Chamber
    initial_state: ONLINE
    terminal_states: [OFFLINE]
    transitions:
      - from: ONLINE
        to: MAINTENANCE
        trigger: "PATCH /api/chambers/{chamber_id} with status=MAINTENANCE, or MaintenanceOrder start with target CHAMBER"
        actor: "OperationsManager or system"
        preconditions: []
        side_effects: []
      - from: MAINTENANCE
        to: ONLINE
        trigger: "PATCH /api/chambers/{chamber_id} with status=ONLINE, or MaintenanceOrder complete with target CHAMBER"
        actor: "OperationsManager or system"
        preconditions: []
        side_effects: []
      - from: ONLINE
        to: OFFLINE
        trigger: "PATCH /api/chambers/{chamber_id} with status=OFFLINE"
        actor: OperationsManager
        preconditions: []
        side_effects:
          - "Every ChamberReservation with chamber_id == this chamber and status == RESERVED transitions to CANCELLED; available_slots recomputed"

  - entity: ChamberReservation
    initial_state: RESERVED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: RESERVED
        to: IN_PROGRESS
        trigger: "POST /api/chamber-reservations/{reservation_id}/start"
        actor: OperationsManager
        preconditions:
          - "current logical clock >= start_at AND < end_at (ERR_INVALID_STATE otherwise)"
          - "Chamber.status == ONLINE (ERR_CHAMBER_NOT_ONLINE otherwise)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/chamber-reservations/{reservation_id}/complete"
        actor: OperationsManager
        preconditions:
          - "current logical clock >= end_at (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "Recomputes Chamber.available_slots (slot ledger frees slot_count)"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /api/chamber-reservations/{reservation_id}/cancel, or system (fixture maintenance, fixture decommission via program supersession, chamber offline)"
        actor: "OperationsManager or system"
        preconditions: []
        side_effects:
          - "Recomputes Chamber.available_slots (slot ledger frees slot_count)"
      - from: RESERVED
        to: RESERVED
        trigger: "PATCH /api/chamber-reservations/{reservation_id} (reschedule window / slot_count / profile_class)"
        actor: OperationsManager
        preconditions:
          - "OCC: expected_chamber_reservation_version equals current version (ERR_STALE_VERSION otherwise)"
          - "Re-validates overlap, profile buffer, capacity, ESD gate against the NEW values, excluding this reservation itself from the overlap scan"
        side_effects:
          - "increments ChamberReservation.version by 1"
          - "Recomputes Chamber.available_slots when slot_count changes"

  - entity: Lot
    initial_state: RECEIVED
    terminal_states: [SHIPPED, SCRAPPED]
    transitions:
      - from: RECEIVED
        to: QUEUED
        trigger: "POST /api/lots/{lot_id}/enqueue"
        actor: OperationsManager
        preconditions:
          - "units_registered == quantity (ERR_UNITS_INCOMPLETE otherwise)"
          - "program status == RELEASED (ERR_PROGRAM_NOT_RELEASED otherwise)"
        side_effects: []
      - from: QUEUED
        to: IN_TEST
        trigger: "POST /api/lots/{lot_id}/start-test"
        actor: OperationsManager
        preconditions: []
        side_effects: []
      - from: IN_TEST
        to: AWAITING_DISPOSITION
        trigger: "POST /api/lots/{lot_id}/complete-test"
        actor: OperationsManager
        preconditions:
          - "units_untested == 0 (ERR_UNITS_INCOMPLETE otherwise)"
        side_effects:
          - "Computes lot.suggested_disposition via disposition_suggestion"
          - "If suggested_disposition != SHIP: auto-creates a LotDispositionReview (status PENDING, suggested_disposition snapshot)"
      - from: AWAITING_DISPOSITION
        to: SHIPPED
        trigger: "POST /api/lots/{lot_id}/ship, or LotDispositionReview decide with decision=SHIP"
        actor: "OperationsManager (ship) or QualityEngineer (decide)"
        preconditions:
          - "Direct ship: suggested_disposition == SHIP AND no PENDING LotDispositionReview exists for the lot (ERR_DISPOSITION_REVIEW_REQUIRED otherwise)"
        side_effects: []
      - from: [AWAITING_DISPOSITION, CONTAINED]
        to: SCRAPPED
        trigger: "LotDispositionReview decide with decision=SCRAP"
        actor: QualityEngineer
        preconditions:
          - "Review status == PENDING"
        side_effects: []
      - from: [AWAITING_DISPOSITION, CONTAINED]
        to: QUEUED
        trigger: "LotDispositionReview decide with decision=REWORK"
        actor: QualityEngineer
        preconditions:
          - "Review status == PENDING"
        side_effects:
          - "Every Unit of the lot: test_status -> UNTESTED, current_bin -> null, retest_count -> 0"
          - "Every non-voided TestResult of the lot: excluded_from_tally -> true"
          - "Lot tallies recomputed (units_untested == quantity)"
        note: "REWORK loops the lot back into the test pipeline - the lot may cycle QUEUED->IN_TEST->AWAITING_DISPOSITION repeatedly"
      - from: SHIPPED
        to: CONTAINED
        trigger: "system (RmaCase closed with fa_conclusion == TEST_ESCAPE)"
        actor: system
        preconditions: []
        side_effects:
          - "lot.escape_count increments by 1"
          - "The escaped Unit: test_status -> FAILED, current_bin -> null"
          - "Lot tallies recomputed (units_passed -1, units_failed +1)"
          - "lot.suggested_disposition recomputed (escape_count >= 1 forces SCRAP_REVIEW)"
          - "Auto-creates a LotDispositionReview (status PENDING, suggested_disposition SCRAP_REVIEW)"
      - from: CONTAINED
        to: SHIPPED
        trigger: "LotDispositionReview decide with decision=SHIP (containment released)"
        actor: QualityEngineer
        preconditions:
          - "Review status == PENDING"
        side_effects: []

  - entity: Unit
    initial_state: UNTESTED
    terminal_states: []
    transitions:
      - from: UNTESTED
        to: PASSED
        trigger: "POST /api/test-results with bin_code mapping to PASS"
        actor: TestEngineer
        preconditions:
          - "Lot status == IN_TEST; program RELEASED; fixture AVAILABLE; bin mapped"
        side_effects:
          - "Lot tallies recomputed"
      - from: UNTESTED
        to: FAILED
        trigger: "POST /api/test-results with bin_code mapping to SOFT_FAIL or HARD_FAIL"
        actor: TestEngineer
        preconditions:
          - "Lot status == IN_TEST; program RELEASED; fixture AVAILABLE; bin mapped"
        side_effects:
          - "Lot tallies recomputed"
      - from: FAILED
        to: PASSED
        trigger: "POST /api/test-results (retest insertion consuming an ACTIVE RetestAuthorization)"
        actor: TestEngineer
        preconditions:
          - "An ACTIVE, unexpired RetestAuthorization exists for the unit and is consumed by this insertion (ERR_NO_ACTIVE_AUTHORIZATION / ERR_AUTHORIZATION_EXPIRED otherwise)"
        side_effects:
          - "unit.retest_count increments by 1"
          - "Consumed RetestAuthorization -> CONSUMED"
          - "Lot tallies recomputed; lot.retested_unit_count recomputed"
        note: "The retest cycle FAILED -> PASSED may repeat; each loop consumes one authorization and is bounded by max_retests_per_unit"
      - from: FAILED
        to: FAILED
        trigger: "POST /api/test-results (retest insertion, bin still failing)"
        actor: TestEngineer
        preconditions:
          - "Same authorization preconditions as FAILED -> PASSED"
        side_effects:
          - "unit.retest_count increments by 1; consumed authorization -> CONSUMED; tallies recomputed"
      - from: PASSED
        to: FAILED
        trigger: "system (RmaCase closed with fa_conclusion == TEST_ESCAPE for this unit)"
        actor: system
        preconditions: []
        side_effects:
          - "Lot tallies recomputed; lot.escape_count increments (see Lot SHIPPED -> CONTAINED)"
      - from: [PASSED, FAILED]
        to: UNTESTED
        trigger: "system (lot REWORK disposition)"
        actor: system
        preconditions: []
        side_effects:
          - "retest_count -> 0; current_bin -> null; prior results excluded_from_tally -> true"
      - from: [PASSED, FAILED]
        to: [PASSED, FAILED]
        trigger: "POST /api/test-results/{result_id}/void on the unit's LATEST tally-effective result (QualityEngineer)"
        actor: QualityEngineer
        preconditions:
          - "Only the latest non-voided, non-excluded TestResult of the unit may be voided (ERR_INVALID_STATE otherwise)"
          - "Lot status != SHIPPED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "Result voided -> true; unit.test_status and current_bin recomputed by replaying remaining non-voided, non-excluded results (unit_tally_projection); if none remain, unit -> UNTESTED"
          - "Lot tallies recomputed; retest_count NOT decremented (history preserved)"

  - entity: RetestAuthorization
    initial_state: ACTIVE
    terminal_states: [CONSUMED, REVOKED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: CONSUMED
        trigger: "system (a TestResult with insertion_index >= 2 references this authorization)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /api/retest-authorizations/{authorization_id}/revoke"
        actor: TestEngineer
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazy: current logical clock >= expires_at at read or consume time)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CustomerEquipment
    initial_state: IN_SERVICE
    terminal_states: [RETURNED]
    transitions:
      - from: IN_SERVICE
        to: CALIBRATION_DUE
        trigger: "system (lazy: current logical clock >= next_calibration_due at read or gating-check time)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [IN_SERVICE, CALIBRATION_DUE]
        to: IN_MAINTENANCE
        trigger: "POST /api/maintenance-orders/{order_id}/start with target EQUIPMENT"
        actor: OperationsManager
        preconditions:
          - "clock within [window_start, window_end] (ERR_INVALID_STATE otherwise)"
        side_effects: []
      - from: IN_MAINTENANCE
        to: IN_SERVICE
        trigger: "POST /api/maintenance-orders/{order_id}/complete with target EQUIPMENT"
        actor: OperationsManager
        preconditions: []
        side_effects:
          - "If order kind == CALIBRATION: last_calibrated_at = current logical clock; next_calibration_due recomputed"
      - from: [IN_SERVICE, CALIBRATION_DUE, IN_MAINTENANCE]
        to: RETURNED
        trigger: "POST /api/customer-equipment/{equipment_id}/return"
        actor: OperationsManager
        preconditions: []
        side_effects: []

  - entity: MaintenanceOrder
    initial_state: OPEN
    terminal_states: [DONE, CANCELLED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /api/maintenance-orders/{order_id}/start"
        actor: OperationsManager
        preconditions:
          - "clock >= window_start AND clock <= window_end (closed interval; ERR_INVALID_STATE otherwise)"
          - "Target not RETURNED / OFFLINE (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "Target EQUIPMENT -> IN_MAINTENANCE; target CHAMBER -> MAINTENANCE"
      - from: IN_PROGRESS
        to: DONE
        trigger: "POST /api/maintenance-orders/{order_id}/complete"
        actor: OperationsManager
        preconditions: []
        side_effects:
          - "Target EQUIPMENT -> IN_SERVICE; target CHAMBER -> ONLINE"
          - "If EQUIPMENT and kind == CALIBRATION: last_calibrated_at = clock; next_calibration_due recomputed"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /api/maintenance-orders/{order_id}/cancel"
        actor: OperationsManager
        preconditions: []
        side_effects: []

  - entity: EsdAudit
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /api/esd-audits/{audit_id}/close"
        actor: QualityEngineer
        preconditions:
          - "corrective_actions covers every MAJOR finding index (ERR_MISSING_CORRECTIVE_ACTION otherwise)"
        side_effects:
          - "outcome computed: PASS | PASS_WITH_MINOR | FAIL"

  - entity: RmaCase
    initial_state: INTAKE
    terminal_states: [CLOSED]
    transitions:
      - from: INTAKE
        to: FA_IN_PROGRESS
        trigger: "POST /api/rma-cases/{rma_id}/start-fa"
        actor: QualityEngineer
        preconditions: []
        side_effects: []
      - from: FA_IN_PROGRESS
        to: FA_COMPLETE
        trigger: "POST /api/rma-cases/{rma_id}/complete-fa with fa_conclusion"
        actor: QualityEngineer
        preconditions: []
        side_effects:
          - "fa_conclusion recorded"
      - from: FA_COMPLETE
        to: CLOSED
        trigger: "POST /api/rma-cases/{rma_id}/close"
        actor: QualityEngineer
        preconditions: []
        side_effects:
          - "If fa_conclusion == TEST_ESCAPE: Lot SHIPPED -> CONTAINED cascade (escape_count++, escaped Unit -> FAILED, tallies recomputed, auto LotDispositionReview PENDING with SCRAP_REVIEW)"
          - "Other conclusions: no lot effect"

  - entity: LotDispositionReview
    initial_state: PENDING
    terminal_states: [DECIDED]
    transitions:
      - from: PENDING
        to: DECIDED
        trigger: "POST /api/lot-disposition-reviews/{review_id}/decide with decision"
        actor: QualityEngineer
        preconditions: []
        side_effects:
          - "Lot AWAITING_DISPOSITION: SHIP -> SHIPPED; SCRAP -> SCRAPPED; REWORK -> QUEUED with unit reset"
          - "Lot CONTAINED: SHIP -> SHIPPED (containment released); SCRAP -> SCRAPPED; REWORK -> QUEUED with unit reset"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: program-revision-stale-version
    parent_entity: TestProgram
    write_endpoint: "POST /api/test-programs/{program_id}/revisions"
    occ_field: "expected_test_program_version"
    description: |
      Minting a successor revision from a TestProgram whose version has
      advanced since the client last read it is rejected. A prior revision
      mint (or any other mutation of the program) advances the source
      program's version, so a caller holding an older version is writing
      against a stale view of the revision lineage.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: reservation-reschedule-stale-version
    parent_entity: ChamberReservation
    write_endpoint: "PATCH /api/chamber-reservations/{reservation_id}"
    occ_field: "expected_chamber_reservation_version"
    description: |
      Rescheduling a ChamberReservation whose version has advanced since the
      client last read it is rejected. A prior successful reschedule advances
      the reservation's version and re-validates the slot ledger against the
      new window, so a caller holding an older version would silently undo a
      reschedule it never observed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: lot_yield_metrics
    trigger: "computed at POST /api/lots/{lot_id}/complete-test and on every GET /api/lots/{lot_id}/yield-report"
    algorithm: aggregation
    formula: |
      Consider the lot's units and their non-voided, non-excluded TestResults.
      first_insertion_pass_count = count of units whose FIRST tally-effective result (insertion_index == 1) has passed == true
      tested_unit_count          = count of units with at least one tally-effective result
      first_pass_yield           = first_insertion_pass_count / tested_unit_count   (0 when tested_unit_count == 0)
      final_yield                = count of units with test_status == PASSED / lot.quantity
      The two variants differ in BOTH numerator and denominator, so identical lot
      data yields different numbers whenever any unit failed its first insertion.
    input_set: "Units of the lot; TestResults with voided == false AND excluded_from_tally == false"
    constants: {}
    precision: "ratio carried exactly as a fraction; serialized rounded to 4 decimal places, round_half_up"
    variants:
      - name: FIRST_PASS
        when: "first-pass quality measure"
        difference: "numerator = first-insertion passes; denominator = tested units only"
      - name: FINAL
        when: "shippable quality measure after retests"
        difference: "numerator = currently PASSED units; denominator = full lot quantity"

  - name: disposition_suggestion
    trigger: "POST /api/lots/{lot_id}/complete-test; recomputed on RMA TEST_ESCAPE containment"
    algorithm: threshold
    formula: |
      fpy          = first_pass_yield (from lot_yield_metrics)
      escape_count = lot.escape_count
      retest_rate  = lot.retested_unit_count / lot.quantity
      Evaluated top-down; first matching branch wins:
        1. escape_count >= ESCAPE_SCRAP_THRESHOLD            -> SCRAP_REVIEW
        2. fpy < SCRAP_FPY_THRESHOLD                          -> SCRAP_REVIEW
        3. fpy >= SHIP_FPY_THRESHOLD AND escape_count == 0
           AND retest_rate <= RETEST_RATE_MAX                 -> SHIP
        4. otherwise                                          -> MRB_REVIEW
    input_set: "Lot computed fields at evaluation time"
    constants:
      SHIP_FPY_THRESHOLD: 0.75
      RETEST_RATE_MAX: 0.25
      SCRAP_FPY_THRESHOLD: 0.50
      ESCAPE_SCRAP_THRESHOLD: 1
    precision: "threshold comparisons on exact fractions (e.g. 3/4 >= 0.75 is true); no rounding before comparison"

  - name: burn_in_profile_duration
    trigger: "POST /api/chamber-reservations (planned_duration_minutes computed from the lot's program burn_profile)"
    algorithm: aggregation
    formula: |
      prev_temp = AMBIENT_C
      total = 0
      for each segment in burn_profile (array order):
        ramp_minutes = round_half_up(abs(segment.target_temp_c - prev_temp) / segment.ramp_rate_c_per_min)
        total += ramp_minutes + segment.soak_minutes
        prev_temp = segment.target_temp_c
      planned_duration_minutes = total
      PINNED ROUNDING ORDER: round each segment's ramp to whole minutes FIRST, then
      sum. The alternative order (sum raw minutes, round once at the end) produces a
      different integer and is NOT the contract.
    input_set: "burn_profile of the TestProgram pinned on the lot"
    constants:
      AMBIENT_C: 25
    precision: "integer minutes; per-segment round_half_up then integer sum"

  - name: chamber_utilization
    trigger: "GET /api/chambers/{chamber_id}/utilization with window_start, window_end, basis"
    algorithm: aggregation
    formula: |
      overlap_minutes(r) = max(0, min(r.end_at, window_end) - max(r.start_at, window_start)) in minutes
      numerator_slot_minutes = sum over selected reservations r of r.slot_count * overlap_minutes(r)
      SCHEDULED variant (forward-looking):
        selected = reservations with status IN {RESERVED, IN_PROGRESS, COMPLETED}
        denominator_slot_minutes = chamber.slot_count * (window_end - window_start in minutes)
      ACTUAL variant (chronological, completed work only):
        selected = reservations with status == COMPLETED
        denominator_slot_minutes = chamber.slot_count * (min(window_end, current logical clock) - window_start in minutes)
      utilization_ratio = numerator_slot_minutes / denominator_slot_minutes (0 when denominator <= 0)
    input_set: "ChamberReservations with chamber_id == chamber; CANCELLED reservations never selected"
    constants: {}
    precision: "ratio rounded to 4 decimal places, round_half_up"
    variants:
      - name: SCHEDULED
        when: "basis == SCHEDULED"
        difference: "counts RESERVED and IN_PROGRESS work against the full window"
      - name: ACTUAL
        when: "basis == ACTUAL"
        difference: "counts COMPLETED work only, against the window portion already elapsed at the logical clock"

  - name: chamber_slot_ledger
    trigger: "reservation create, reschedule, cancel, complete, chamber offline cascade, fixture maintenance cascade, program supersession cascade"
    algorithm: aggregation
    formula: |
      committed = sum of slot_count over ChamberReservations with chamber_id == chamber
                  AND status IN {RESERVED, IN_PROGRESS}
      available_slots = chamber.slot_count - committed
      INVARIANT (compensating pair): a create followed by a cancel of the same
      reservation returns available_slots to its prior value.
    input_set: "non-terminal ChamberReservations of the chamber"
    constants: {}
    precision: "integer"

  - name: unit_tally_projection
    trigger: "POST /api/test-results; POST /api/test-results/{result_id}/void; REWORK disposition; RMA TEST_ESCAPE close"
    algorithm: projection
    formula: |
      For a unit, replay its TestResults with voided == false AND excluded_from_tally == false
      ordered by (created_at ASC, insertion_index ASC):
        test_status = UNTESTED if the replay set is empty, else PASSED if the last result passed else FAILED
        current_bin = last result's bin_code, or null when UNTESTED
        insertion_index of a new result = replay set size + 1
      Lot tallies: units_untested / units_passed / units_failed = counts of unit.test_status over the lot
      INVARIANT (compensating pair): units_untested + units_passed + units_failed == lot.quantity
      for every lot, before and after any record / void / rework / escape mutation.
    input_set: "TestResults per unit; Units per lot"
    constants: {}
    precision: "integer counts"

  - name: equipment_calibration_status
    trigger: "read of CustomerEquipment; gating check inside POST /api/test-results"
    algorithm: threshold
    formula: |
      next_calibration_due = last_calibrated_at + calibration_interval_days * 24h
      effective_status = CALIBRATION_DUE when stored status == IN_SERVICE AND current logical clock >= next_calibration_due
      Boundary is INCLUSIVE: clock exactly equal to next_calibration_due yields CALIBRATION_DUE.
    input_set: "the CustomerEquipment row"
    constants: {}
    precision: "timestamp comparison at second precision"

  - name: esd_area_containment
    trigger: "POST /api/chamber-reservations; PATCH /api/chamber-reservations/{id}"
    algorithm: aggregation
    formula: |
      containment_active(area_code) = exists EsdAudit with audit.area_code == area_code
        AND status == OPEN AND any finding with severity == MAJOR
      A reservation create/reschedule is rejected with ERR_ESD_CONTAINMENT when
      containment_active(chamber.area_code) AND lot.customer.requires_esd_certification == true.
    input_set: "EsdAudits; chamber of the reservation; customer of the lot"
    constants: {}
    precision: "boolean predicate"

  - name: retest_policy_gate
    trigger: "POST /api/retest-authorizations"
    algorithm: threshold
    formula: |
      eligible(unit) requires ALL of:
        unit.test_status == FAILED
        bin_class = bin_map[unit.current_bin]; bin_class == SOFT_FAIL   (HARD_FAIL -> ERR_HARD_FAIL_NO_RETEST)
        unit.retest_count < program.max_retests_per_unit                (STRICT less-than; count == max -> ERR_RETEST_LIMIT_REACHED)
        X-User-ID != recorded_by_user_id of the unit's latest tally-effective result (ERR_RETEST_SEGREGATION)
    input_set: "Unit; lot's TestProgram; unit's latest tally-effective TestResult"
    constants: {}
    precision: "integer comparison, strict <"

  - name: rma_escape_containment
    trigger: "POST /api/rma-cases/{rma_id}/close with fa_conclusion == TEST_ESCAPE"
    algorithm: threshold
    formula: |
      lot.escape_count += 1
      escaped unit -> FAILED (current_bin -> null)
      lot.status SHIPPED -> CONTAINED
      lot.suggested_disposition recomputed (escape_count >= ESCAPE_SCRAP_THRESHOLD forces SCRAP_REVIEW)
      auto-create LotDispositionReview PENDING with the recomputed suggestion
    input_set: "RmaCase; its Lot and Unit"
    constants:
      ESCAPE_SCRAP_THRESHOLD: 1
    precision: "integer"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per §1.5 roles; CustomerRep may only act on resources whose customer_id == X-User-ID"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 2
    category: auth
    check: "CustomerRep body/path customer scope: lot creation, unit registration and RMA creation must carry customer_id (or a lot/unit belonging to the customer) equal to X-User-ID"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "POST /api/lots; POST /api/units; POST /api/rma-cases"
  - priority: 3
    category: existence
    check: "Every id referenced in path and body exists, validated left-to-right (path first, then body in field order)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "Target resource's own lifecycle permits the operation (lot IN_TEST for results; unit FAILED for retest authorization; review PENDING for decide; audit OPEN for close; reservation RESERVED for start/cancel/reschedule; program DRAFT/VALIDATED for validate/release; no PENDING review exists when creating another or shipping directly)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition and state-gated endpoints"
  - priority: 4
    category: state
    check: "Aggregate state gate: creating a LotDispositionReview while another PENDING review exists for the lot"
    error_id: ERR_REVIEW_PENDING
    http_status: 409
    applies_to: "POST /api/lot-disposition-reviews"
  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/test-programs/{program_id}/revisions; PATCH /api/chamber-reservations/{reservation_id}"
  - priority: 6
    category: business_safety
    check: "Customer account ACTIVE when creating lots"
    error_id: ERR_CUSTOMER_SUSPENDED
    http_status: 409
    applies_to: "POST /api/lots"
  - priority: 6
    category: business_safety
    check: "ESD containment: chamber.area_code has an OPEN EsdAudit with a MAJOR finding AND lot's customer requires_esd_certification == true"
    error_id: ERR_ESD_CONTAINMENT
    http_status: 409
    applies_to: "POST /api/chamber-reservations; PATCH /api/chamber-reservations/{reservation_id}"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: retest authorizer X-User-ID differs from the recorded_by_user_id of the unit's latest tally-effective result"
    error_id: ERR_RETEST_SEGREGATION
    http_status: 403
    applies_to: "POST /api/retest-authorizations"
  - priority: 7
    category: business_temporal
    check: "Reservation window well-formed: start_at >= current logical clock and end_at > start_at (half-open [start_at, end_at)); maintenance window well-formed: window_start <= window_end"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /api/chamber-reservations; PATCH /api/chamber-reservations/{reservation_id}; POST /api/maintenance-orders"
  - priority: 7
    category: business_temporal
    check: "Referenced lot must be QUEUED when a reservation is created (burn-in scheduling happens before test start)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /api/chamber-reservations"
  - priority: 7
    category: business_temporal
    check: "Chamber overlap: half-open intervals on the same chamber; [s,e) collides with an existing non-CANCELLED reservation when s < existing.end_at AND existing.start_at < e"
    error_id: ERR_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /api/chamber-reservations; PATCH /api/chamber-reservations/{reservation_id}"
  - priority: 7
    category: business_temporal
    check: "Profile purge buffer: on the same chamber, a new run of a DIFFERENT profile_class than an adjacent non-CANCELLED run must leave a 30-minute gap; same-class runs may abut (end_at == start_at allowed)"
    error_id: ERR_PROFILE_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /api/chamber-reservations; PATCH /api/chamber-reservations/{reservation_id}"
  - priority: 7
    category: business_temporal
    check: "Maintenance windows on the same target use CLOSED interval semantics: a new order conflicts when window_start <= existing.window_end AND existing.window_start <= window_end over orders with status IN {OPEN, IN_PROGRESS}; touching endpoints conflict"
    error_id: ERR_MAINTENANCE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /api/maintenance-orders"
  - priority: 7
    category: business_temporal
    check: "Retest authorization liveness: consuming an authorization whose expires_at <= current logical clock is rejected"
    error_id: ERR_AUTHORIZATION_EXPIRED
    http_status: 409
    applies_to: "POST /api/test-results"
  - priority: 8
    category: business_referential
    check: "Program must be RELEASED at lot creation and enqueue"
    error_id: ERR_PROGRAM_NOT_RELEASED
    http_status: 422
    applies_to: "POST /api/lots; POST /api/lots/{lot_id}/enqueue"
  - priority: 8
    category: business_referential
    check: "Program pinned on the lot must not be OBSOLETE when recording results"
    error_id: ERR_PROGRAM_SUPERSEDED
    http_status: 409
    applies_to: "POST /api/test-results"
  - priority: 8
    category: business_referential
    check: "Referenced fixture AVAILABLE for reservations and result recording; fixture.program_id == lot.program_id for reservations"
    error_id: ERR_FIXTURE_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /api/chamber-reservations; PATCH /api/chamber-reservations/{reservation_id}; POST /api/test-results"
  - priority: 8
    category: business_referential
    check: "Fixture-to-program lineage: fixture.program_id == lot.program_id"
    error_id: ERR_FIXTURE_PROGRAM_MISMATCH
    http_status: 422
    applies_to: "POST /api/chamber-reservations; POST /api/test-results"
  - priority: 8
    category: business_referential
    check: "Chamber must be ONLINE for reservation create/reschedule/start"
    error_id: ERR_CHAMBER_NOT_ONLINE
    http_status: 409
    applies_to: "POST /api/chamber-reservations; PATCH /api/chamber-reservations/{reservation_id}; POST /api/chamber-reservations/{reservation_id}/start"
  - priority: 8
    category: business_referential
    check: "Provided equipment must be effectively IN_SERVICE (not CALIBRATION_DUE, IN_MAINTENANCE, RETURNED) when recording results"
    error_id: ERR_EQUIPMENT_NOT_IN_SERVICE
    http_status: 409
    applies_to: "POST /api/test-results"
  - priority: 8
    category: business_referential
    check: "Program validation requires at least one AVAILABLE fixture for the program"
    error_id: ERR_NO_AVAILABLE_FIXTURE
    http_status: 422
    applies_to: "POST /api/test-programs/{program_id}/validate"
  - priority: 9
    category: business_constraint
    check: "bin_code is a key of the lot program's bin_map"
    error_id: ERR_BIN_NOT_MAPPED
    http_status: 422
    applies_to: "POST /api/test-results"
  - priority: 9
    category: business_constraint
    check: "Retest policy: latest bin must map to SOFT_FAIL (HARD_FAIL units may not be retested)"
    error_id: ERR_HARD_FAIL_NO_RETEST
    http_status: 422
    applies_to: "POST /api/retest-authorizations"
  - priority: 9
    category: business_constraint
    check: "Retest policy: unit.retest_count < program.max_retests_per_unit (strict less-than; equality rejects)"
    error_id: ERR_RETEST_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /api/retest-authorizations"
  - priority: 9
    category: business_constraint
    check: "Recording a retest insertion (unit FAILED) requires an ACTIVE unexpired RetestAuthorization to consume"
    error_id: ERR_NO_ACTIVE_AUTHORIZATION
    http_status: 409
    applies_to: "POST /api/test-results"
  - priority: 9
    category: business_constraint
    check: "Units with test_status PASSED accept no further insertions; only the latest tally-effective result may be voided; a voided result may not be re-voided"
    error_id: ERR_RESULT_IMMUTABLE
    http_status: 409
    applies_to: "POST /api/test-results; POST /api/test-results/{result_id}/void"
  - priority: 9
    category: business_constraint
    check: "serial_number unique within the lot"
    error_id: ERR_DUPLICATE_SERIAL
    http_status: 409
    applies_to: "POST /api/units"
  - priority: 9
    category: business_constraint
    check: "units_registered < lot.quantity before adding another unit (registering unit number quantity+1 rejects; exactly quantity is allowed)"
    error_id: ERR_QUANTITY_EXCEEDED
    http_status: 422
    applies_to: "POST /api/units"
  - priority: 9
    category: business_constraint
    check: "enqueue requires units_registered == quantity; complete-test requires units_untested == 0"
    error_id: ERR_UNITS_INCOMPLETE
    http_status: 409
    applies_to: "POST /api/lots/{lot_id}/enqueue; POST /api/lots/{lot_id}/complete-test"
  - priority: 9
    category: business_constraint
    check: "reservation slot_count >= 1 and slot_count <= chamber.available_slots (boundary: equal to available_slots is allowed)"
    error_id: ERR_SLOT_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /api/chamber-reservations; PATCH /api/chamber-reservations/{reservation_id}"
  - priority: 9
    category: business_constraint
    check: "profile_class is in chamber.supported_profile_classes"
    error_id: ERR_PROFILE_NOT_SUPPORTED
    http_status: 422
    applies_to: "POST /api/chamber-reservations; PATCH /api/chamber-reservations/{reservation_id}"
  - priority: 9
    category: business_constraint
    check: "Audit close: corrective_actions covers every MAJOR finding index"
    error_id: ERR_MISSING_CORRECTIVE_ACTION
    http_status: 422
    applies_to: "POST /api/esd-audits/{audit_id}/close"
  - priority: 9
    category: business_constraint
    check: "Direct ship requires suggested_disposition == SHIP AND no PENDING LotDispositionReview for the lot (escape-free, FPY >= threshold, retest rate within policy)"
    error_id: ERR_DISPOSITION_REVIEW_REQUIRED
    http_status: 409
    applies_to: "POST /api/lots/{lot_id}/ship"
  - priority: 9
    category: business_constraint
    check: "Lot part_number equals the referenced program's part_number"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /api/lots"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving; declared per §1.5 priority ladder rung 3) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Sets the logical clock used by every time-dependent rule (reservation windows, authorization expiry, calibration due, utilization ACTUAL). Startup default is exactly 2026-05-01T00:00:00Z; before any call the clock reads this default and never the wall clock."
    roles: [OperationsManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Lazy derivations (CALIBRATION_DUE, authorization EXPIRED) re-evaluate against the new clock on next read or gating check"]

  # --- Customer ---
  - method: POST
    path: "/api/customers"
    description: "Register a customer"
    roles: [OperationsManager]
    code: 201
    input: [name, tier, "requires_esd_certification?"]
    output: Customer
    side_effects: ["account_status=ACTIVE"]
  - method: GET
    path: "/api/customers/{customer_id}"
    description: "Get a customer"
    roles: [CustomerRep, TestEngineer, OperationsManager, QualityEngineer]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: PATCH
    path: "/api/customers/{customer_id}"
    description: "Suspend/activate account or change tier"
    roles: [OperationsManager]
    code: 200
    input: ["account_status?", "tier?"]
    output: Customer
    side_effects: ["increments Customer.version by 1"]

  # --- TestProgram ---
  - method: POST
    path: "/api/test-programs"
    description: "Create a DRAFT test program (revision 1)"
    roles: [TestEngineer]
    code: 201
    input: [customer_id, part_number, bin_map, max_retests_per_unit, burn_profile]
    output: TestProgram
    side_effects: ["status=DRAFT", "revision=1"]
  - method: GET
    path: "/api/test-programs/{program_id}"
    description: "Get a test program"
    roles: [CustomerRep, TestEngineer, OperationsManager, QualityEngineer]
    code: 200
    input: []
    output: TestProgram
    side_effects: []
  - method: GET
    path: "/api/test-programs"
    description: "List test programs (FK reverse lookup for Customer and supersession chain)"
    roles: [CustomerRep, TestEngineer, OperationsManager, QualityEngineer]
    code: 200
    input: ["customer_id?", "supersedes_program_id?", "status?", "limit?", "offset?"]
    output: TestProgram[]
    side_effects: []
  - method: POST
    path: "/api/test-programs/{program_id}/validate"
    description: "DRAFT -> VALIDATED (requires an AVAILABLE fixture)"
    roles: [TestEngineer]
    code: 200
    input: []
    output: TestProgram
    side_effects: ["status -> VALIDATED", "increments TestProgram.version by 1"]
  - method: POST
    path: "/api/test-programs/{program_id}/release"
    description: "VALIDATED -> RELEASED; supersedes the previously RELEASED revision (OBSOLETE cascade)"
    roles: [TestEngineer]
    code: 200
    input: []
    output: TestProgram
    side_effects: ["status -> RELEASED", "increments TestProgram.version by 1", "prior RELEASED revision -> OBSOLETE with fixture/reservation/slot-ledger cascade"]
  - method: POST
    path: "/api/test-programs/{program_id}/revisions"
    description: "Mint the next revision (new DRAFT row, supersedes_program_id = this program); OCC-guarded on the source program's version"
    roles: [TestEngineer]
    code: 201
    input: [expected_test_program_version]
    output: TestProgram
    side_effects: ["increments the source TestProgram.version by 1", "new row: revision = source.revision + 1, status DRAFT, config copied"]

  # --- Fixture ---
  - method: POST
    path: "/api/fixtures"
    description: "Create a fixture for a program (COMMISSIONING)"
    roles: [TestEngineer]
    code: 201
    input: [program_id, serial_number, site_count]
    output: Fixture
    side_effects: ["status=COMMISSIONING"]
  - method: GET
    path: "/api/fixtures/{fixture_id}"
    description: "Get a fixture"
    roles: [CustomerRep, TestEngineer, OperationsManager, QualityEngineer]
    code: 200
    input: []
    output: Fixture
    side_effects: []
  - method: GET
    path: "/api/fixtures"
    description: "List fixtures (FK reverse lookup for TestProgram)"
    roles: [CustomerRep, TestEngineer, OperationsManager, QualityEngineer]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: Fixture[]
    side_effects: []
  - method: POST
    path: "/api/fixtures/{fixture_id}/commission"
    description: "COMMISSIONING -> AVAILABLE"
    roles: [TestEngineer]
    code: 200
    input: []
    output: Fixture
    side_effects: ["status -> AVAILABLE", "increments Fixture.version by 1"]
  - method: POST
    path: "/api/fixtures/{fixture_id}/maintenance"
    description: "AVAILABLE -> UNDER_MAINTENANCE; cancels future RESERVED reservations using it"
    roles: [TestEngineer]
    code: 200
    input: []
    output: Fixture
    side_effects: ["status -> UNDER_MAINTENANCE", "increments Fixture.version by 1", "RESERVED reservations with this fixture -> CANCELLED", "Chamber.available_slots recomputed"]
  - method: POST
    path: "/api/fixtures/{fixture_id}/return-from-maintenance"
    description: "UNDER_MAINTENANCE -> AVAILABLE"
    roles: [TestEngineer]
    code: 200
    input: []
    output: Fixture
    side_effects: ["status -> AVAILABLE", "increments Fixture.version by 1"]

  # --- Chamber ---
  - method: POST
    path: "/api/chambers"
    description: "Register a burn-in chamber (ONLINE)"
    roles: [OperationsManager]
    code: 201
    input: [name, area_code, slot_count, supported_profile_classes]
    output: Chamber
    side_effects: ["status=ONLINE", "available_slots = slot_count"]
  - method: GET
    path: "/api/chambers/{chamber_id}"
    description: "Get a chamber (includes computed available_slots)"
    roles: [CustomerRep, TestEngineer, OperationsManager, QualityEngineer]
    code: 200
    input: []
    output: Chamber
    side_effects: []
  - method: PATCH
    path: "/api/chambers/{chamber_id}"
    description: "Chamber status transitions ONLINE <-> MAINTENANCE, ONLINE -> OFFLINE (OFFLINE terminal; offlining cancels RESERVED reservations)"
    roles: [OperationsManager]
    code: 200
    input: ["status?"]
    output: Chamber
    side_effects: ["increments Chamber.version by 1", "OFFLINE: RESERVED reservations -> CANCELLED, available_slots recomputed"]
  - method: GET
    path: "/api/chambers/{chamber_id}/utilization"
    description: "Computed slot-hour utilization over a window; basis selects the SCHEDULED or ACTUAL variant"
    roles: [CustomerRep, TestEngineer, OperationsManager, QualityEngineer]
    code: 200
    input: [window_start, window_end, basis]
    output: { basis: string, utilization_ratio: number, numerator_slot_minutes: integer, denominator_slot_minutes: integer }
    side_effects: []

  # --- ChamberReservation ---
  - method: POST
    path: "/api/chamber-reservations"
    description: "Reserve chamber slots for a lot's burn-in window (half-open interval, profile purge buffer, ESD gate, OCC-free)"
    roles: [OperationsManager]
    code: 201
    input: [chamber_id, lot_id, fixture_id, profile_class, start_at, end_at, slot_count]
    output: ChamberReservation
    side_effects: ["status=RESERVED", "planned_duration_minutes computed via burn_in_profile_duration", "Chamber.available_slots recomputed"]
  - method: GET
    path: "/api/chamber-reservations/{reservation_id}"
    description: "Get a reservation"
    roles: [CustomerRep, TestEngineer, OperationsManager, QualityEngineer]
    code: 200
    input: []
    output: ChamberReservation
    side_effects: []
  - method: GET
    path: "/api/chamber-reservations"
    description: "List reservations (FK reverse lookup for Chamber, Lot, Fixture)"
    roles: [CustomerRep, TestEngineer, OperationsManager, QualityEngineer]
    code: 200
    input: ["chamber_id?", "lot_id?", "fixture_id?", "status?", "limit?", "offset?"]
    output: ChamberReservation[]
    side_effects: []
  - method: PATCH
    path: "/api/chamber-reservations/{reservation_id}"
    description: "Reschedule a RESERVED reservation (window/slot_count/profile_class); OCC-guarded; re-validates overlap, buffer, capacity, ESD excluding itself"
    roles: [OperationsManager]
    code: 200
    input: [expected_chamber_reservation_version, "start_at?", "end_at?", "slot_count?", "profile_class?"]
    output: ChamberReservation
    side_effects: ["increments ChamberReservation.version by 1", "Chamber.available_slots recomputed when slot_count changes"]
  - method: POST
    path: "/api/chamber-reservations/{reservation_id}/start"
    description: "RESERVED -> IN_PROGRESS (clock within [start_at, end_at); chamber ONLINE)"
    roles: [OperationsManager]
    code: 200
    input: []
    output: ChamberReservation
    side_effects: ["status -> IN_PROGRESS", "increments ChamberReservation.version by 1"]
  - method: POST
    path: "/api/chamber-reservations/{reservation_id}/complete"
    description: "IN_PROGRESS -> COMPLETED (clock >= end_at); frees slots"
    roles: [OperationsManager]
    code: 200
    input: []
    output: ChamberReservation
    side_effects: ["status -> COMPLETED", "increments ChamberReservation.version by 1", "Chamber.available_slots recomputed"]
  - method: POST
    path: "/api/chamber-reservations/{reservation_id}/cancel"
    description: "RESERVED -> CANCELLED; frees slots (compensating action of create)"
    roles: [OperationsManager]
    code: 200
    input: []
    output: ChamberReservation
    side_effects: ["status -> CANCELLED", "increments ChamberReservation.version by 1", "Chamber.available_slots recomputed"]

  # --- Lot ---
  - method: POST
    path: "/api/lots"
    description: "Customer creates a lot (RECEIVED); program must be RELEASED and part_number must match"
    roles: [CustomerRep]
    code: 201
    input: [customer_id, part_number, quantity, program_id]
    output: Lot
    side_effects: ["status=RECEIVED", "tallies zeroed", "escape_count=0"]
  - method: GET
    path: "/api/lots/{lot_id}"
    description: "Get a lot (includes computed tallies, escape_count, suggested_disposition)"
    roles: [CustomerRep, TestEngineer, OperationsManager, QualityEngineer]
    code: 200
    input: []
    output: Lot
    side_effects: []
  - method: GET
    path: "/api/lots"
    description: "List lots (FK reverse lookup for Customer and TestProgram)"
    roles: [CustomerRep, TestEngineer, OperationsManager, QualityEngineer]
    code: 200
    input: ["customer_id?", "program_id?", "status?", "limit?", "offset?"]
    output: Lot[]
    side_effects: []
  - method: POST
    path: "/api/lots/{lot_id}/enqueue"
    description: "RECEIVED -> QUEUED (all units registered; program RELEASED)"
    roles: [OperationsManager]
    code: 200
    input: []
    output: Lot
    side_effects: ["status -> QUEUED", "increments Lot.version by 1"]
  - method: POST
    path: "/api/lots/{lot_id}/start-test"
    description: "QUEUED -> IN_TEST"
    roles: [OperationsManager]
    code: 200
    input: []
    output: Lot
    side_effects: ["status -> IN_TEST", "increments Lot.version by 1"]
  - method: POST
    path: "/api/lots/{lot_id}/complete-test"
    description: "IN_TEST -> AWAITING_DISPOSITION (all units tested); computes suggestion; auto-creates PENDING review when suggestion != SHIP"
    roles: [OperationsManager]
    code: 200
    input: []
    output: Lot
    side_effects: ["status -> AWAITING_DISPOSITION", "increments Lot.version by 1", "suggested_disposition computed", "auto LotDispositionReview PENDING when suggestion != SHIP"]
  - method: POST
    path: "/api/lots/{lot_id}/ship"
    description: "Direct ship from AWAITING_DISPOSITION; only when suggested_disposition == SHIP and no PENDING review"
    roles: [OperationsManager]
    code: 200
    input: []
    output: Lot
    side_effects: ["status -> SHIPPED", "increments Lot.version by 1"]
  - method: GET
    path: "/api/lots/{lot_id}/yield-report"
    description: "Computed yield report: dual-variant yields, tallies, bin histogram, retest stats, escapes, suggestion"
    roles: [CustomerRep, TestEngineer, OperationsManager, QualityEngineer]
    code: 200
    input: []
    output: { lot_id: string, first_pass_yield: number, final_yield: number, units_registered: integer, units_passed: integer, units_failed: integer, units_untested: integer, retested_unit_count: integer, escape_count: integer, bin_counts: object, suggested_disposition: string }
    side_effects: []

  # --- Unit ---
  - method: POST
    path: "/api/units"
    description: "Register a serialized unit on a RECEIVED lot (CustomerRep declares serials for own lots; OperationsManager may register on receipt)"
    roles: [OperationsManager, CustomerRep]
    code: 201
    input: [lot_id, serial_number]
    output: Unit
    side_effects: ["test_status=UNTESTED", "retest_count=0", "Lot.units_registered recomputed"]
  - method: GET
    path: "/api/units/{unit_id}"
    description: "Get a unit"
    roles: [CustomerRep, TestEngineer, OperationsManager, QualityEngineer]
    code: 200
    input: []
    output: Unit
    side_effects: []
  - method: GET
    path: "/api/units"
    description: "List units (FK reverse lookup for Lot)"
    roles: [CustomerRep, TestEngineer, OperationsManager, QualityEngineer]
    code: 200
    input: ["lot_id?", "test_status?", "limit?", "offset?"]
    output: Unit[]
    side_effects: []

  # --- TestResult ---
  - method: POST
    path: "/api/test-results"
    description: "Record a serialized test insertion; computes passed/insertion_index; consumes retest authorization for insertions beyond the first"
    roles: [TestEngineer]
    code: 201
    input: [unit_id, fixture_id, bin_code, "equipment_id?"]
    output: TestResult
    side_effects: ["unit.test_status / current_bin recomputed via unit_tally_projection", "retest insertions: retest_count++ and authorization -> CONSUMED", "Lot tallies and retested_unit_count recomputed"]
  - method: GET
    path: "/api/test-results/{result_id}"
    description: "Get a test result"
    roles: [CustomerRep, TestEngineer, OperationsManager, QualityEngineer]
    code: 200
    input: []
    output: TestResult
    side_effects: []
  - method: GET
    path: "/api/test-results"
    description: "List test results (FK reverse lookup for Unit, Lot, Fixture, CustomerEquipment, TestProgram)"
    roles: [CustomerRep, TestEngineer, OperationsManager, QualityEngineer]
    code: 200
    input: ["unit_id?", "lot_id?", "fixture_id?", "equipment_id?", "program_id?", "limit?", "offset?"]
    output: TestResult[]
    side_effects: []
  - method: POST
    path: "/api/test-results/{result_id}/void"
    description: "Void the unit's latest tally-effective result (compensating action); replays remaining results"
    roles: [QualityEngineer]
    code: 200
    input: [reason]
    output: TestResult
    side_effects: ["voided -> true", "unit state recomputed via unit_tally_projection", "Lot tallies recomputed"]

  # --- RetestAuthorization ---
  - method: POST
    path: "/api/retest-authorizations"
    description: "Authorize one more insertion for a FAILED SOFT_FAIL unit; segregation of duties enforced; expires in 48h"
    roles: [TestEngineer]
    code: 201
    input: [unit_id, reason]
    output: RetestAuthorization
    side_effects: ["status=ACTIVE", "expires_at = clock + 48h"]
  - method: GET
    path: "/api/retest-authorizations/{authorization_id}"
    description: "Get a retest authorization"
    roles: [CustomerRep, TestEngineer, OperationsManager, QualityEngineer]
    code: 200
    input: []
    output: RetestAuthorization
    side_effects: []
  - method: GET
    path: "/api/retest-authorizations"
    description: "List retest authorizations (FK reverse lookup for Unit)"
    roles: [CustomerRep, TestEngineer, OperationsManager, QualityEngineer]
    code: 200
    input: ["unit_id?", "status?", "limit?", "offset?"]
    output: RetestAuthorization[]
    side_effects: []
  - method: POST
    path: "/api/retest-authorizations/{authorization_id}/revoke"
    description: "ACTIVE -> REVOKED"
    roles: [TestEngineer]
    code: 200
    input: []
    output: RetestAuthorization
    side_effects: ["status -> REVOKED", "increments RetestAuthorization.version by 1"]

  # --- CustomerEquipment ---
  - method: POST
    path: "/api/customer-equipment"
    description: "Register customer-owned equipment (IN_SERVICE)"
    roles: [OperationsManager]
    code: 201
    input: [customer_id, equipment_type, serial_number, calibration_interval_days, last_calibrated_at]
    output: CustomerEquipment
    side_effects: ["status=IN_SERVICE", "next_calibration_due computed"]
  - method: GET
    path: "/api/customer-equipment/{equipment_id}"
    description: "Get equipment (lazy CALIBRATION_DUE derivation applied)"
    roles: [CustomerRep, TestEngineer, OperationsManager, QualityEngineer]
    code: 200
    input: []
    output: CustomerEquipment
    side_effects: []
  - method: GET
    path: "/api/customer-equipment"
    description: "List customer equipment (FK reverse lookup for Customer)"
    roles: [CustomerRep, TestEngineer, OperationsManager, QualityEngineer]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: CustomerEquipment[]
    side_effects: []
  - method: POST
    path: "/api/customer-equipment/{equipment_id}/return"
    description: "Any non-terminal status -> RETURNED (terminal; back to customer)"
    roles: [OperationsManager]
    code: 200
    input: []
    output: CustomerEquipment
    side_effects: ["status -> RETURNED", "increments CustomerEquipment.version by 1"]

  # --- MaintenanceOrder ---
  - method: POST
    path: "/api/maintenance-orders"
    description: "Schedule a maintenance window on equipment or a chamber; CLOSED-interval conflict detection on the same target"
    roles: [OperationsManager]
    code: 201
    input: [target_type, target_id, kind, window_start, window_end]
    output: MaintenanceOrder
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/api/maintenance-orders/{order_id}"
    description: "Get a maintenance order"
    roles: [CustomerRep, TestEngineer, OperationsManager, QualityEngineer]
    code: 200
    input: []
    output: MaintenanceOrder
    side_effects: []
  - method: GET
    path: "/api/maintenance-orders"
    description: "List maintenance orders (FK reverse lookup for target)"
    roles: [CustomerRep, TestEngineer, OperationsManager, QualityEngineer]
    code: 200
    input: ["target_id?", "target_type?", "status?", "limit?", "offset?"]
    output: MaintenanceOrder[]
    side_effects: []
  - method: POST
    path: "/api/maintenance-orders/{order_id}/start"
    description: "OPEN -> IN_PROGRESS within the window; target leaves service"
    roles: [OperationsManager]
    code: 200
    input: []
    output: MaintenanceOrder
    side_effects: ["status -> IN_PROGRESS", "target EQUIPMENT -> IN_MAINTENANCE / CHAMBER -> MAINTENANCE", "increments MaintenanceOrder.version by 1"]
  - method: POST
    path: "/api/maintenance-orders/{order_id}/complete"
    description: "IN_PROGRESS -> DONE; target returns to service; CALIBRATION resets last_calibrated_at"
    roles: [OperationsManager]
    code: 200
    input: []
    output: MaintenanceOrder
    side_effects: ["status -> DONE", "target EQUIPMENT -> IN_SERVICE / CHAMBER -> ONLINE", "CALIBRATION on equipment: last_calibrated_at = clock, next_calibration_due recomputed", "increments MaintenanceOrder.version by 1"]
  - method: POST
    path: "/api/maintenance-orders/{order_id}/cancel"
    description: "OPEN -> CANCELLED; frees the window"
    roles: [OperationsManager]
    code: 200
    input: []
    output: MaintenanceOrder
    side_effects: ["status -> CANCELLED", "increments MaintenanceOrder.version by 1"]

  # --- EsdAudit ---
  - method: POST
    path: "/api/esd-audits"
    description: "Open an ESD program audit on an area"
    roles: [QualityEngineer]
    code: 201
    input: [area_code, findings]
    output: EsdAudit
    side_effects: ["status=OPEN", "auditor_user_id = X-User-ID"]
  - method: GET
    path: "/api/esd-audits/{audit_id}"
    description: "Get an ESD audit"
    roles: [CustomerRep, TestEngineer, OperationsManager, QualityEngineer]
    code: 200
    input: []
    output: EsdAudit
    side_effects: []
  - method: GET
    path: "/api/esd-audits"
    description: "List ESD audits"
    roles: [CustomerRep, TestEngineer, OperationsManager, QualityEngineer]
    code: 200
    input: ["area_code?", "status?", "limit?", "offset?"]
    output: EsdAudit[]
    side_effects: []
  - method: POST
    path: "/api/esd-audits/{audit_id}/close"
    description: "OPEN -> CLOSED; every MAJOR finding index needs a corrective action; outcome computed"
    roles: [QualityEngineer]
    code: 200
    input: [corrective_actions]
    output: EsdAudit
    side_effects: ["status -> CLOSED", "outcome computed", "increments EsdAudit.version by 1"]

  # --- RmaCase ---
  - method: POST
    path: "/api/rma-cases"
    description: "Customer opens an RMA for a PASSED unit of a SHIPPED lot"
    roles: [CustomerRep]
    code: 201
    input: [lot_id, unit_id, failure_mode]
    output: RmaCase
    side_effects: ["fa_status=INTAKE"]
  - method: GET
    path: "/api/rma-cases/{rma_id}"
    description: "Get an RMA case"
    roles: [CustomerRep, TestEngineer, OperationsManager, QualityEngineer]
    code: 200
    input: []
    output: RmaCase
    side_effects: []
  - method: GET
    path: "/api/rma-cases"
    description: "List RMA cases (FK reverse lookup for Lot and Unit)"
    roles: [CustomerRep, TestEngineer, OperationsManager, QualityEngineer]
    code: 200
    input: ["lot_id?", "unit_id?", "fa_status?", "limit?", "offset?"]
    output: RmaCase[]
    side_effects: []
  - method: POST
    path: "/api/rma-cases/{rma_id}/start-fa"
    description: "INTAKE -> FA_IN_PROGRESS"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: RmaCase
    side_effects: ["fa_status -> FA_IN_PROGRESS", "increments RmaCase.version by 1"]
  - method: POST
    path: "/api/rma-cases/{rma_id}/complete-fa"
    description: "FA_IN_PROGRESS -> FA_COMPLETE with failure-analysis conclusion"
    roles: [QualityEngineer]
    code: 200
    input: [fa_conclusion]
    output: RmaCase
    side_effects: ["fa_status -> FA_COMPLETE", "fa_conclusion recorded", "increments RmaCase.version by 1"]
  - method: POST
    path: "/api/rma-cases/{rma_id}/close"
    description: "FA_COMPLETE -> CLOSED; TEST_ESCAPE fires the containment cascade on the source lot"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: RmaCase
    side_effects: ["fa_status -> CLOSED", "increments RmaCase.version by 1", "TEST_ESCAPE: lot -> CONTAINED, escape_count++, unit -> FAILED, auto LotDispositionReview PENDING (SCRAP_REVIEW)"]

  # --- LotDispositionReview ---
  - method: POST
    path: "/api/lot-disposition-reviews"
    description: "Open an MRB review for an AWAITING_DISPOSITION or CONTAINED lot; one PENDING review per lot"
    roles: [QualityEngineer]
    code: 201
    input: [lot_id]
    output: LotDispositionReview
    side_effects: ["status=PENDING", "suggested_disposition snapshot from lot"]
  - method: GET
    path: "/api/lot-disposition-reviews/{review_id}"
    description: "Get a review"
    roles: [CustomerRep, TestEngineer, OperationsManager, QualityEngineer]
    code: 200
    input: []
    output: LotDispositionReview
    side_effects: []
  - method: GET
    path: "/api/lot-disposition-reviews"
    description: "List reviews (FK reverse lookup for Lot)"
    roles: [CustomerRep, TestEngineer, OperationsManager, QualityEngineer]
    code: 200
    input: ["lot_id?", "status?", "limit?", "offset?"]
    output: LotDispositionReview[]
    side_effects: []
  - method: POST
    path: "/api/lot-disposition-reviews/{review_id}/decide"
    description: "PENDING -> DECIDED; drives the lot transition per decision (SHIP/SCRAP/REWORK)"
    roles: [QualityEngineer]
    code: 200
    input: [decision, rationale]
    output: LotDispositionReview
    side_effects: ["status -> DECIDED", "decided_by_user_id = X-User-ID", "Lot transitions per decision (REWORK resets units and excludes prior results)", "increments LotDispositionReview.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "CustomerRep acting on a customer scope != X-User-ID" }
  # --- request / existence ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed value, invalid enum member, inverted/past reservation window, or lot part_number mismatch with program" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced id (path or body) does not exist" }
  # --- state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource's lifecycle state forbids the operation (includes all invalid-from and terminal-lockdown rejections, RMA on non-SHIPPED lot, void on non-latest result or SHIPPED lot, retest authorization on non-FAILED unit)" }
  - { id: ERR_REVIEW_PENDING, http: 409, condition: "A PENDING LotDispositionReview already exists for the lot (blocks second review and direct ship)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  # --- business safety ---
  - { id: ERR_CUSTOMER_SUSPENDED, http: 409, condition: "Lot creation while customer account_status == SUSPENDED" }
  - { id: ERR_ESD_CONTAINMENT, http: 409, condition: "OPEN EsdAudit with a MAJOR finding on the chamber's area_code and the lot's customer requires_esd_certification" }
  - { id: ERR_RETEST_SEGREGATION, http: 403, condition: "Retest authorizer is the same X-User-ID that recorded the unit's latest tally-effective result" }
  # --- business temporal ---
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "Half-open window collision on the same chamber with a non-CANCELLED reservation" }
  - { id: ERR_PROFILE_BUFFER_VIOLATION, http: 409, condition: "Adjacent run of a different profile_class without the 30-minute purge gap on the same chamber" }
  - { id: ERR_MAINTENANCE_WINDOW_CONFLICT, http: 409, condition: "Closed-interval maintenance window collision (touching endpoints conflict) on the same target" }
  - { id: ERR_AUTHORIZATION_EXPIRED, http: 409, condition: "Retest authorization expires_at <= logical clock at consume time" }
  # --- business referential ---
  - { id: ERR_PROGRAM_NOT_RELEASED, http: 422, condition: "Lot create/enqueue with a program not in RELEASED status" }
  - { id: ERR_PROGRAM_SUPERSEDED, http: 409, condition: "Recording a result against a lot whose pinned program revision is OBSOLETE" }
  - { id: ERR_FIXTURE_NOT_AVAILABLE, http: 409, condition: "Referenced fixture not AVAILABLE" }
  - { id: ERR_FIXTURE_PROGRAM_MISMATCH, http: 422, condition: "fixture.program_id != lot.program_id" }
  - { id: ERR_CHAMBER_NOT_ONLINE, http: 409, condition: "Chamber not ONLINE for reservation create/reschedule/start" }
  - { id: ERR_EQUIPMENT_NOT_IN_SERVICE, http: 409, condition: "Referenced equipment effectively not IN_SERVICE (including lazy CALIBRATION_DUE)" }
  - { id: ERR_NO_AVAILABLE_FIXTURE, http: 422, condition: "Program validation without any AVAILABLE fixture" }
  # --- business constraint ---
  - { id: ERR_BIN_NOT_MAPPED, http: 422, condition: "bin_code not a key of the lot program's bin_map" }
  - { id: ERR_HARD_FAIL_NO_RETEST, http: 422, condition: "Retest authorization for a unit whose latest bin maps HARD_FAIL" }
  - { id: ERR_RETEST_LIMIT_REACHED, http: 422, condition: "unit.retest_count >= program.max_retests_per_unit" }
  - { id: ERR_NO_ACTIVE_AUTHORIZATION, http: 409, condition: "Retest insertion without an ACTIVE unexpired authorization" }
  - { id: ERR_RESULT_IMMUTABLE, http: 409, condition: "Insertion on a PASSED unit, or void of an already-voided result" }
  - { id: ERR_DUPLICATE_SERIAL, http: 409, condition: "serial_number already registered within the lot" }
  - { id: ERR_QUANTITY_EXCEEDED, http: 422, condition: "Unit registration beyond lot.quantity" }
  - { id: ERR_UNITS_INCOMPLETE, http: 409, condition: "enqueue with units_registered < quantity, or complete-test with units_untested > 0" }
  - { id: ERR_SLOT_CAPACITY_EXCEEDED, http: 422, condition: "reservation slot_count > chamber.available_slots (equality allowed)" }
  - { id: ERR_PROFILE_NOT_SUPPORTED, http: 422, condition: "profile_class not in chamber.supported_profile_classes" }
  - { id: ERR_MISSING_CORRECTIVE_ACTION, http: 422, condition: "Audit close without corrective_actions covering every MAJOR finding index" }
  - { id: ERR_DISPOSITION_REVIEW_REQUIRED, http: 409, condition: "Direct ship while suggested_disposition != SHIP" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CustomerRep
    description: "Customer representative; owns lots, units' serial declarations and RMA intake for their own customer"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /api/lots — create lot (customer_id must equal X-User-ID)"
      - "POST /api/rma-cases — open RMA (lot must belong to X-User-ID's customer)"
    shared_operations:
      - "POST /api/units — register serialized units on own lots"
      - "All GET endpoints"
  - name: TestEngineer
    description: "Test house engineer; develops programs/fixtures and records results; retest authorization is segregated from result recording"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/test-programs (+ validate/release/revisions)"
      - "POST /api/fixtures (+ commission/maintenance/return-from-maintenance)"
      - "POST /api/test-results — record test insertions"
      - "POST /api/retest-authorizations (+ revoke) — X-User-ID must differ from the failing result's recorder"
    shared_operations:
      - "All GET endpoints"
  - name: OperationsManager
    description: "Test house operations; owns customers, chambers, slot scheduling, lot pipeline transitions, equipment and maintenance"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/customers; PATCH /api/customers/{id}"
      - "POST /api/chambers; PATCH /api/chambers/{id}"
      - "POST /api/chamber-reservations (+ PATCH/start/complete/cancel)"
      - "POST /api/lots/{id}/enqueue|start-test|complete-test|ship"
      - "POST /api/customer-equipment (+ return); POST /api/maintenance-orders (+ start/complete/cancel)"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "POST /api/units — register serialized units on receipt"
      - "All GET endpoints"
  - name: QualityEngineer
    description: "Quality/MRB authority; voids results, runs ESD audits, dispositions lots, closes the RMA failure-analysis loop"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/test-results/{id}/void"
      - "POST /api/esd-audits (+ close)"
      - "POST /api/lot-disposition-reviews (+ decide)"
      - "POST /api/rma-cases/{id}/start-fa|complete-fa|close"
    shared_operations:
      - "All GET endpoints"
