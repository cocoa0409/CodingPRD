# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — section 1.9 Coverage Index (breadth probe)
# Task: task_3447_crayon_manufacturing_color_retirement_experience_attraction
# Every testable claim of SCAFFOLD.yaml sections 1.1-1.7 that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Anchors defined in
# the first section are reused throughout; list order on multi-row responses is
# created_at ASC. Logical clock default: 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: color_create_returns_201_defaults_and_envelope
        claim_type: Creation
        grounds:
          - entities.Color
          - endpoints.POST_/crayon-works/colors
          - response_envelope
        distinguishing_aspect: "A color created with only name and hex_code comes back 201 with status PROPOSED, version 1, is_core_curriculum false, null introduced_on/retired_on/archive_after_date, and system-stamped id/created_at/updated_at inside the fixed success envelope."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &k_clock0
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &k_color
              call: "POST /crayon-works/colors"
              payload: { name: "Cerulean", hex_code: "#02A4D3" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
          assert:
            - "the response status is 201, response_type is object, and meta carries api_request_id and api_request_timestamp"
            - "Color.${c_id}.status == PROPOSED and version == 1"
            - "Color.${c_id}.is_core_curriculum == false (default applied)"
            - "introduced_on, retired_on and archive_after_date are all null"
            - "id, created_at and updated_at are non-null and server-stamped"

      - name: color_get_roundtrips_stored_fields_unchanged
        claim_type: Retrieval
        grounds:
          - entities.Color
          - endpoints.GET_/crayon-works/colors/{id}
        distinguishing_aspect: "Every input field round-trips through GET exactly as posted, including the explicit is_core_curriculum true."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One core-curriculum color created."
          setup_api_calls:
            - *k_clock0
            - call: "POST /crayon-works/colors"
              payload: { name: "Atomic Tangerine", hex_code: "#FF9966", is_core_curriculum: true }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /crayon-works/colors/${c_id}"
              payload: {}
              as: Formulator
              as_user_id: "f-1"
          assert:
            - "the response status is 200"
            - "Color.${c_id}.name == \"Atomic Tangerine\" and hex_code == \"#FF9966\""
            - "Color.${c_id}.is_core_curriculum == true"
            - "Color.${c_id}.status == PROPOSED"

      - name: production_runs_list_paginates_and_filters
        claim_type: Listing
        grounds:
          - endpoints.GET_/crayon-works/production-runs
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three PLANNED runs on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false — total_count spans the whole filtered set, not the page."
        test_recipe:
          setup:
            - "Full production-capable setup: color Cerulean ACTIVE, spec {Cerulean:8}, batch CERTIFIED, formula APPROVED. Three runs created, none advanced."
          setup_api_calls:
            - *k_clock0
            - *k_color
            - &k_camp
              call: "POST /crayon-works/colors/${c_id}/vote-campaigns"
              payload: { kind: INTRODUCTION, opens_on: "2026-09-05T00:00:00Z", closes_on: "2026-09-20T23:59:59Z" }
              as: PlatformAdmin
              captures: { camp_id: $.data.id }
            - &k_open
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - &k_epoch
              call: "POST /crayon-works/ops/run-epoch"
              payload: {}
              as: PlatformAdmin
            - &k_pass
              call: "POST /crayon-works/votes"
              payload: { campaign_id: "${camp_id}", voter_segment: KIDS, choice: "YES", count: 20 }
              as: Consumer
            - &k_close
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: PlatformAdmin
            - *k_epoch
            - &k_spec
              call: "POST /crayon-works/assortment-specs"
              payload: { name: "Cerulean 8-box", kind: RETAIL, entries: [{ color_id: "${c_id}", count: 8 }], wholesale_price_cents: 1600 }
              as: PlatformAdmin
              captures: { spec_id: $.data.id }
            - &k_batch
              call: "POST /crayon-works/pigment-batches"
              payload: { pigment_name: "Phthalo Blue", supplier_name: "PigmentCo", hazard_class: STANDARD, received_quantity_kg: 500, certification_mark: ACMI_AP }
              as: SourcingManager
              as_user_id: "sm-1"
              captures: { bat_id: $.data.id }
            - &k_cert
              call: "POST /crayon-works/pigment-batches/${bat_id}/certification-decision"
              payload: { decision: CERTIFY }
              as: QualityAssurance
              as_user_id: "qa-1"
            - &k_formula
              call: "POST /crayon-works/formulas"
              payload: { color_id: "${c_id}", intended_use: CRAYON, pigment_recipe: [{ pigment_name: "Phthalo Blue", parts: 3 }] }
              as: Formulator
              as_user_id: "f-1"
              captures: { frm_id: $.data.id }
            - &k_submit
              call: "POST /crayon-works/formulas/${frm_id}/transition"
              payload: { action: SUBMIT }
              as: Formulator
              as_user_id: "f-1"
            - &k_tests
              call: "GET /crayon-works/formulas/${frm_id}/safety-tests"
              payload: {}
              as: SafetyOfficer
              as_user_id: "so-1"
              captures: { test_id: "$.data[0].id" }
            - &k_tpass
              call: "POST /crayon-works/safety-tests/${test_id}/record-result"
              payload: { outcome: PASS, result_notes: "clean" }
              as: LabTechnician
              as_user_id: "lab-1"
            - &k_approve
              call: "POST /crayon-works/formulas/${frm_id}/transition"
              payload: { action: APPROVE }
              as: SafetyOfficer
              as_user_id: "so-1"
            - &k_run
              call: "POST /crayon-works/production-runs"
              payload: { assortment_spec_id: "${spec_id}", pigment_batch_id: "${bat_id}", planned_boxes: 125, planned_start_date: "2027-04-15T00:00:00Z", planned_end_date: "2027-05-20T00:00:00Z" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /crayon-works/production-runs"
              payload: { assortment_spec_id: "${spec_id}", pigment_batch_id: "${bat_id}", planned_boxes: 6, planned_start_date: "2027-04-15T00:00:00Z", planned_end_date: "2027-05-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /crayon-works/production-runs"
              payload: { assortment_spec_id: "${spec_id}", pigment_batch_id: "${bat_id}", planned_boxes: 25, planned_start_date: "2027-04-15T00:00:00Z", planned_end_date: "2027-05-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /crayon-works/production-runs"
              payload: { stage: PLANNED, limit: 2, offset: 0 }
              as: PlatformAdmin
          assert:
            - "the response status is 200 and response_type is array"
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /crayon-works/production-runs?stage=PLANNED&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /crayon-works/production-runs?pigment_batch_id=${bat_id} returns 3 rows; ?pigment_batch_id=<unknown uuid> returns 0 rows"

      - name: formula_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/crayon-works/formulas/{id}
          - errors.ERR_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unallocated id produces 404 ERR_NOT_FOUND with the fixed error envelope, not a 400 and not an empty 200."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. No formulas exist."
          setup_api_calls:
            - *k_clock0
          trigger:
            - call: "GET /crayon-works/formulas/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SafetyOfficer
              as_user_id: "so-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and err == ERR_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: formula_create_missing_required_recipe_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Formula.fields.pigment_recipe
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "pigment_recipe is a required input with no default; omitting it is a 400 ERR_INVALID_REQUEST at priority 3 — before any color-existence check at priority 4, so the unknown color_id in the same payload is never reported."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One color exists."
          setup_api_calls:
            - *k_clock0
            - *k_color
          trigger:
            - call: "POST /crayon-works/formulas"
              payload: { color_id: "00000000-0000-4000-8000-000000000000", intended_use: CRAYON }
              as: Formulator
              as_user_id: "f-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST"
            - "err != ERR_NOT_FOUND even though color_id is unallocated — required-field shape is checked first"
            - "GET /crayon-works/colors/${c_id}/formulas returns 0 rows"

      - name: defaults_applied_when_optional_fields_omitted
        claim_type: Defaults
        grounds:
          - entities.AttractionSession.fields.is_charter
          - endpoints.POST_/crayon-works/votes
        distinguishing_aspect: "Two independent defaults: a session created without is_charter stores false (STANDARD pricing applies), and a vote cast without count imports exactly 1 ballot (weight_applied 1.0 for KIDS)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; one color with an OPEN introduction campaign; one session created without is_charter."
          setup_api_calls:
            - *k_clock0
            - *k_color
            - *k_camp
            - *k_open
            - *k_epoch
            - call: "POST /crayon-works/attraction-sessions"
              payload: { venue_name: "Hall A", session_date: "2026-10-17T00:00:00Z", start_minute: 600, duration_minutes: 120, capacity_units: 100, base_price_cents: 2000 }
              as: PlatformAdmin
              captures: { ses_id: $.data.id }
          trigger:
            - call: "POST /crayon-works/votes"
              payload: { campaign_id: "${camp_id}", voter_segment: KIDS, choice: "YES" }
              as: Consumer
          assert:
            - "AttractionSession.${ses_id}.is_charter == false"
            - "the vote response shows accepted == true and weight_applied == 1.0 (single KIDS ballot)"
            - "GET /crayon-works/colors/${c_id}/vote-campaigns shows data[0].turnout_count == 1"

      - name: spec_box_size_computed_and_client_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.AssortmentSpec.fields.box_size
          - endpoints.POST_/crayon-works/assortment-specs
        distinguishing_aspect: "box_size is computed from entries, never taken from the client: a spec with one 8-count entry reports box_size 8, and a client-supplied box_size of 64 is ignored."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; color Cerulean ACTIVE."
          setup_api_calls:
            - *k_clock0
            - *k_color
            - *k_camp
            - *k_open
            - *k_epoch
            - *k_pass
            - *k_close
            - *k_epoch
          trigger:
            - call: "POST /crayon-works/assortment-specs"
              payload: { name: "Cerulean 8-box", kind: RETAIL, entries: [{ color_id: "${c_id}", count: 8 }], wholesale_price_cents: 1600, box_size: 64 }
              as: PlatformAdmin
              captures: { spec_id: $.data.id }
          assert:
            - "the response status is 201"
            - "AssortmentSpec.${spec_id}.box_size == 8 (computed from entries; the supplied 64 was ignored as an undeclared field)"
            - "AssortmentSpec.${spec_id}.status == ACTIVE and boxes_available == 0 and boxes_reserved == 0"

      - name: batch_create_client_supplied_status_is_ignored_input
        claim_type: System Fields
        grounds:
          - entities.PigmentBatch.fields.status
          - endpoints.POST_/crayon-works/pigment-batches
        distinguishing_aspect: "status, created_by_user_id and version are system-owned: a client sending status CERTIFIED and version 99 still gets a QUARANTINE batch at version 1 with created_by_user_id taken from the header."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock0
          trigger:
            - call: "POST /crayon-works/pigment-batches"
              payload: { pigment_name: "Phthalo Blue", supplier_name: "PigmentCo", hazard_class: STANDARD, received_quantity_kg: 500, certification_mark: ACMI_AP, status: CERTIFIED, version: 99, created_by_user_id: "spoofed" }
              as: SourcingManager
              as_user_id: "sm-1"
              captures: { bat_id: $.data.id }
          assert:
            - "the response status is 201"
            - "PigmentBatch.${bat_id}.status == QUARANTINE and version == 1"
            - "PigmentBatch.${bat_id}.created_by_user_id == \"sm-1\" (from X-User-ID, not the spoofed payload value)"

      - name: spec_create_with_out_of_set_box_size_is_rejected
        claim_type: Type Constraints
        grounds:
          - entities.AssortmentSpec.fields.box_size
          - errors.ERR_SPEC_INVALID
        distinguishing_aspect: "The box_size constraint is a closed set {8, 16, 24, 64}: entries summing to 3 fail creation with ERR_SPEC_INVALID even though every entry color is ACTIVE and well-formed."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; color Cerulean ACTIVE."
          setup_api_calls:
            - *k_clock0
            - *k_color
            - *k_camp
            - *k_open
            - *k_epoch
            - *k_pass
            - *k_close
            - *k_epoch
          trigger:
            - call: "POST /crayon-works/assortment-specs"
              payload: { name: "Tiny 3-box", kind: RETAIL, entries: [{ color_id: "${c_id}", count: 3 }], wholesale_price_cents: 600 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_SPEC_INVALID"
            - "no spec was persisted (a subsequent create of a valid spec succeeds)"

      - name: allocation_create_with_invalid_enum_tier_is_rejected
        claim_type: Type Constraints
        grounds:
          - entities.RetailAllocation.fields.priority_tier
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "priority_tier is a closed enum PLATINUM|GOLD|STANDARD; DIAMOND is rejected at priority 3 with 400 ERR_INVALID_REQUEST before the foreign keys are even looked up."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One color exists (its version is only borrowed as a placeholder; the enum check fires before it is read)."
          setup_api_calls:
            - *k_clock0
            - call: "POST /crayon-works/colors"
              payload: { name: "Cerulean", hex_code: "#02A4D3" }
              as: PlatformAdmin
              captures: { any_v: $.data.version }
          trigger:
            - call: "POST /crayon-works/retail-allocations"
              payload: { assortment_spec_id: "00000000-0000-4000-8000-000000000000", retailer_name: "MegaMart", priority_tier: DIAMOND, requested_boxes: 10, requested_ship_date: "2027-07-15T00:00:00Z", expected_assortment_spec_version: "${any_v}" }
              as: AllocationPlanner
              as_user_id: "ap-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST"
            - "err != ERR_NOT_FOUND — enum membership is a priority-3 shape check"

      - name: run_create_with_unknown_spec_id_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.ProductionRun.fields.assortment_spec_id
          - validations[priority=4]
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "Flat topology puts the foreign keys in the request body and priority 4 checks them in declared input order — assortment_spec_id first: with both ids unknown the failure is 404 ERR_NOT_FOUND for the spec, and the batch id is never examined."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock0
          trigger:
            - call: "POST /crayon-works/production-runs"
              payload: { assortment_spec_id: "00000000-0000-4000-8000-000000000001", pigment_batch_id: "00000000-0000-4000-8000-000000000002", planned_boxes: 10, planned_start_date: "2027-04-15T00:00:00Z", planned_end_date: "2027-05-20T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and err == ERR_NOT_FOUND"

      - name: ticket_create_group_missing_school_name_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Ticket.fields.school_name
          - entities.Ticket.fields.group_size
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "school_name is conditionally required: kind=GROUP without school_name is a 400 ERR_INVALID_REQUEST, while kind=INDIVIDUAL without it succeeds — the same field is mandatory in one branch and forbidden-free to omit in the other."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; one session exists."
          setup_api_calls:
            - *k_clock0
            - &k_session
              call: "POST /crayon-works/attraction-sessions"
              payload: { venue_name: "Hall A", session_date: "2026-10-17T00:00:00Z", start_minute: 600, duration_minutes: 120, capacity_units: 100, base_price_cents: 2000 }
              as: PlatformAdmin
              captures: { ses_id: $.data.id }
          trigger:
            - call: "POST /crayon-works/tickets"
              payload: { session_id: "${ses_id}", kind: GROUP, group_size: 20 }
              as: BoxOffice
              as_user_id: "bo-1"
              captures: { err: $.data.error_id }
            - call: "POST /crayon-works/tickets"
              payload: { session_id: "${ses_id}", kind: INDIVIDUAL }
              as: BoxOffice
              as_user_id: "bo-1"
              captures: { t_id: $.data.id }
          assert:
            - "the GROUP attempt returns 400 and err == ERR_INVALID_REQUEST"
            - "the INDIVIDUAL attempt returns 201 and Ticket.${t_id}.units == 1"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: formula_created_in_draft_initial_state
        claim_type: Initial State
        grounds:
          - state_machines.Formula
          - endpoints.POST_/crayon-works/formulas
        distinguishing_aspect: "A new formula starts in DRAFT at version 1 with licensed_use_count 0 and null submitted/approved user ids — no safety test exists until a SUBMIT transition creates one."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; one color exists."
          setup_api_calls:
            - *k_clock0
            - *k_color
          trigger:
            - *k_formula
          assert:
            - "the response status is 201"
            - "Formula.${frm_id}.status == DRAFT and version == 1"
            - "licensed_use_count == 0; submitted_by_user_id and approved_by_user_id are null"
            - "GET /crayon-works/formulas/${frm_id}/safety-tests returns 0 rows"

      - name: batch_created_in_quarantine_initial_state
        claim_type: Initial State
        grounds:
          - state_machines.PigmentBatch
          - endpoints.POST_/crayon-works/pigment-batches
        distinguishing_aspect: "A registered batch starts in QUARANTINE — never directly CERTIFIED — with created_by_user_id stamped from X-User-ID and certified_by_user_id null."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock0
          trigger:
            - *k_batch
          assert:
            - "the response status is 201"
            - "PigmentBatch.${bat_id}.status == QUARANTINE and certified_by_user_id is null"
            - "created_by_user_id == \"sm-1\""

      - name: campaign_created_in_scheduled_initial_state
        claim_type: Initial State
        grounds:
          - state_machines.VoteCampaign
          - endpoints.POST_/crayon-works/colors/{id}/vote-campaigns
        distinguishing_aspect: "A campaign is born SCHEDULED with zeroed tallies and null outcome even when its opens_on is in the future — and its creation flips the color PROPOSED -> IN_VOTE in the same response window."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; color Cerulean PROPOSED."
          setup_api_calls:
            - *k_clock0
            - *k_color
          trigger:
            - *k_camp
          assert:
            - "the response status is 201"
            - "VoteCampaign.${camp_id}.status == SCHEDULED with votes_yes_weighted == 0, votes_total_weighted == 0, turnout_count == 0, outcome null"
            - "GET /crayon-works/colors/${c_id} shows status == IN_VOTE"

      - name: ticket_individual_created_confirmed_initial_state
        claim_type: Initial State
        grounds:
          - state_machines.Ticket
          - endpoints.POST_/crayon-works/tickets
        distinguishing_aspect: "An INDIVIDUAL ticket on a session with free capacity is created directly in CONFIRMED with units 1 and a computed price — WAITLISTED is only reachable for GROUP bookings."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; session Hall A 2026-10-17 capacity 100 base 2000."
          setup_api_calls:
            - *k_clock0
            - *k_session
          trigger:
            - call: "POST /crayon-works/tickets"
              payload: { session_id: "${ses_id}", kind: INDIVIDUAL }
              as: BoxOffice
              as_user_id: "bo-1"
              captures: { t_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Ticket.${t_id}.status == CONFIRMED and units == 1 and price_cents == 2070 (Saturday, ratio 0 < 0.5)"
            - "AttractionSession.${ses_id}.booked_units == 1"

      - name: formula_submit_creates_scheduled_safety_test
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Formula.DRAFT_to_SUBMITTED
          - state_machines.SafetyTest
          - endpoints.GET_/crayon-works/formulas/{id}/safety-tests
        distinguishing_aspect: "The SUBMIT side effect is observable through the reverse-reachability GET: exactly one SafetyTest appears, in SCHEDULED, with the default ASTM_D4236 standard and no recorded result."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; color Cerulean PROPOSED; formula created DRAFT."
          setup_api_calls:
            - *k_clock0
            - *k_color
            - *k_formula
          trigger:
            - *k_submit
            - *k_tests
          assert:
            - "Formula.${frm_id}.status == SUBMITTED and submitted_by_user_id == \"f-1\""
            - "the safety-tests list returns exactly 1 row: SafetyTest.${test_id}.status == SCHEDULED, test_standard == ASTM_D4236, recorded_by_user_id null"
            - "SafetyTest.${test_id}.formula_id == ${frm_id}"

      - name: formula_approve_from_draft_is_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Formula
