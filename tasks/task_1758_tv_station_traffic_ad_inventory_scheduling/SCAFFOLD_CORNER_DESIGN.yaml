        grounds: ["concurrency_rules[order-approve-stale-version]", "errors[ERR_STALE_ORDER_VERSION]"]
        distinguishing_aspect: "approving with an expected_order_version captured before an intervening mutation (line add bumped the version) is rejected 412; retrying with the fresh version succeeds."
        test_recipe:
          setup: ["advertiser, program exist; order with one line submitted (version advanced by submit)"]
          setup_api_calls:
            - call: "POST /traffic/advertisers"
              payload: { name: "OCC", product_category: "RETAIL", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { adv_id: "$.data.id"}
            - call: "POST /traffic/programs"
              payload: { title: "OCC P", daypart_code: "PRIME", airs_weekday: 6, start_time_local: "20:00", duration_minutes: 60, rating_estimate: 5.0 }
              as: TrafficManager
              captures: { prog_id: "$.data.id"}
            - call: "POST /traffic/orders"
              payload: { advertiser_id: "${adv_id}", flight_start_date: "2026-08-03", flight_end_date: "2026-08-09" }
              as: SalesRep
              captures: { order_id: "$.data.id",  order_v_create: "$.data.version"}
            - call: "POST /traffic/orders/${order_id}/lines"
              payload: { program_id: "${prog_id}", weeks_requested: 1, spots_per_week: 1, spot_length_seconds: 30, gross_rate_cents: 5000, guaranteed_rating: 0 }
              as: SalesRep
            - call: "POST /traffic/orders/${order_id}/submit"
              payload: {}
              as: SalesRep
            - call: "GET /traffic/orders/${order_id}"
              payload: {}
              as: SalesRep
              captures: { order_v_fresh: "$.data.version"}
          trigger:
            - call: "POST /traffic/orders/${order_id}/approve"
              payload: { expected_order_version: "${order_v_create}" }
              as: TrafficManager
              captures: { err: "$.data.error_id"}
            - call: "POST /traffic/orders/${order_id}/approve"
              payload: { expected_order_version: "${order_v_fresh}" }
              as: TrafficManager
          assert:
            - "${err} == ERR_STALE_ORDER_VERSION (412) — version at create is stale after line-add and submit bumped it"
            - "second approve with the fresh version succeeds: Order.${order_id}.status == APPROVED"
      - name: occ_stale_avail_version_on_place
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[spot-place-stale-avail]", "errors[ERR_STALE_AVAIL_VERSION]"]
