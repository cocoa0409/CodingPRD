      - name: progress_report_periods_must_be_contiguous_and_non_overlapping
        claim_type: Violation -> Error
        grounds:
          - validations[21]
          - validations[20]
          - errors.ERR_REPORT_PERIOD_GAP
          - errors.ERR_REPORT_PERIOD_OVERLAP
        distinguishing_aspect: |
          The monthly series is pinned from BOTH sides on the same recall: the very
          first period must start exactly at stop_sale_effective_at (not one day
          later), every later period must start exactly prior_end + 24h, and the
          closed-interval overlap check makes a period starting exactly at the prior
          period_end a conflict — the deliberate opposite of the half-open audit
          window. The two rules also report different codes and different HTTP
          statuses, so collapsing them is observable.
