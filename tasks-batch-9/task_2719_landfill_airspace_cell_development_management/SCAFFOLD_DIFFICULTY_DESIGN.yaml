      - name: survey_void_restores_prior_survey_or_falls_back_to_the_ledger
        grounds:
          - state_machines.AerialSurvey.RECORDED_to_VOID
          - state_machines.AerialSurvey.SUPERSEDED_to_RECORDED
          - calculations.remaining_life_projection
          - entities.Landfill.fields.remaining_life_years
          - state_machines.Landfill.RESTRICTED_AIRSPACE_to_OPEN
        distinguishing_aspect: |
          Voiding a survey compensates along a CHAIN rather than a single field: it restores
          the most recent SUPERSEDED survey by (flown_on DESC, created_at DESC) and re-derives
          the landfill projection, and when the candidate set is empty it restores nothing and
          the projection silently changes VARIANT from survey_based to ledger_based with
          source_survey_id null. The compensation is also deliberately PARTIAL — the
          RESTRICTED_AIRSPACE posture that the survey caused is not lifted by the void even
          though remaining_life_years returns above 2.0; only the admin edge clears it.
        test_recipe:
          setup:
            - "Landfill LF (planned_density_tons_per_cy 0.90, annual_tonnage_forecast 300000) with one QA_CERTIFIED cell C-1 of design_airspace_cy 1000000, so the ledger basis is 1000000 cy at 0.90."
            - "Survey S1 flown_on 2026-08-01 covering [2026-05-01, 2026-07-31], measured_remaining_airspace_cy 700000, tons_placed_in_period 250000."
            - "Survey S2 flown_on 2026-10-30 covering [2026-08-01, 2026-10-29], measured_remaining_airspace_cy 640000, tons_placed_in_period 50000, which supersedes S1."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000, daily_load_limit: 200 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id }
            - call: "POST /cells"
              payload: { landfill_id: "${lf_id}", cell_code: "C-1", design_airspace_cy: 1000000, design_area_sf: 120001, liner_type: "DOUBLE_COMPOSITE", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-15T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /cells/${c1_id}/begin-construction"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
            - call: "POST /liner-qa-packages"
              payload: { cell_id: "${c1_id}", seam_length_ft: 4000, destructive_test_count: 20, passing_test_count: 20, panel_count: 40, defect_count: 2 }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { qa1_id: $.data.id }
            - call: "POST /liner-qa-packages/${qa1_id}/begin-review"
              payload: {}
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
            - call: "POST /liner-qa-packages/${qa1_id}/approve"
              payload: { certification_reference: "CQA-2026-001" }
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
            - call: "GET /landfills/${lf_id}/remaining-life-projection"
              payload: {}
              as: SurveyorOfRecord
              as_user_id: "surveyor-1"
              captures: { proj0_variant: $.data.variant, proj0_life: $.data.remaining_life_years }
            - call: "POST /aerial-surveys"
              payload: { landfill_id: "${lf_id}", flown_on: "2026-08-01T00:00:00Z", coverage_period_start: "2026-05-01T00:00:00Z", coverage_period_end: "2026-07-31T00:00:00Z", measured_remaining_airspace_cy: 700000, tons_placed_in_period: 250000 }
              as: SurveyorOfRecord
              as_user_id: "surveyor-1"
              captures: { s1_id: $.data.id }
            - call: "POST /aerial-surveys"
              payload: { landfill_id: "${lf_id}", flown_on: "2026-10-30T00:00:00Z", coverage_period_start: "2026-08-01T00:00:00Z", coverage_period_end: "2026-10-29T00:00:00Z", measured_remaining_airspace_cy: 640000, tons_placed_in_period: 50000 }
              as: SurveyorOfRecord
              as_user_id: "surveyor-1"
              captures: { s2_id: $.data.id }
            - call: "GET /landfills/${lf_id}"
              payload: {}
              as: SurveyorOfRecord
              as_user_id: "surveyor-1"
              captures: { lf_life1: $.data.remaining_life_years, lf_status1: $.data.operating_status }
          trigger:
            - call: "POST /aerial-surveys/${s2_id}/void"
              payload: { void_reason: "Ground control point mis-identified in the flight log." }
              as: SurveyorOfRecord
              as_user_id: "surveyor-1"
              captures: { s2_state: $.data.status }
            - call: "GET /landfills/${lf_id}/remaining-life-projection"
              payload: {}
              as: SurveyorOfRecord
              as_user_id: "surveyor-1"
              captures: { proj1_variant: $.data.variant, proj1_life: $.data.remaining_life_years, proj1_src: $.data.source_survey_id, proj1_density: $.data.density_tons_per_cy }
            - call: "POST /aerial-surveys/${s1_id}/void"
              payload: { void_reason: "Same flight log; the whole campaign was rejected." }
              as: SurveyorOfRecord
              as_user_id: "surveyor-1"
              captures: { s1_state: $.data.status }
            - call: "GET /landfills/${lf_id}/remaining-life-projection"
              payload: {}
              as: SurveyorOfRecord
              as_user_id: "surveyor-1"
              captures: { proj2_variant: $.data.variant, proj2_life: $.data.remaining_life_years, proj2_src: $.data.source_survey_id, proj2_density: $.data.density_tons_per_cy, proj2_remaining: $.data.remaining_airspace_cy }
            - call: "GET /landfills/${lf_id}"
              payload: {}
              as: SurveyorOfRecord
              as_user_id: "surveyor-1"
              captures: { lf_life2: $.data.remaining_life_years, lf_status2: $.data.operating_status }
            - call: "POST /aerial-surveys/${s2_id}/void"
              payload: { void_reason: "Duplicate void attempt." }
              as: SurveyorOfRecord
              as_user_id: "surveyor-1"
            - call: "POST /landfills/${lf_id}/operating-status"
              payload: { operating_status: "OPEN" }
              as: PlatformAdmin
              captures: { lf_status3: $.data.operating_status }
          assert:
            - "${proj0_variant} == 'ledger_based' and ${proj0_life} == 3.00 before any survey exists"
            - "${lf_life1} == 1.78 and ${lf_status1} == 'RESTRICTED_AIRSPACE' — S2 is the RECORDED survey and its 0.8333 measured density crossed the 2.0-year threshold"
            - "${s2_state} == 'VOID' and AerialSurvey.${s1_id}.status is back to 'RECORDED'"
            - "${proj1_variant} == 'survey_based', ${proj1_src} == '${s1_id}', ${proj1_density} == 0.8333 and ${proj1_life} == 1.94 — the restore chain re-selected S1, not the ledger"
            - "${s1_state} == 'VOID'"
            - "${proj2_variant} == 'ledger_based', ${proj2_src} is null, ${proj2_density} == 0.90, ${proj2_remaining} == 1000000.00 and ${proj2_life} == 3.00 — with an empty SUPERSEDED candidate set nothing is restored and the variant falls back"
            - "${lf_life2} == 3.00 but ${lf_status2} == 'RESTRICTED_AIRSPACE' — the void compensates the projection only; the posture is NOT auto-lifted"
            - "the second void of ${s2_id} returns ERR_INVALID_STATE_TRANSITION with HTTP 409, because VOID is terminal, and no survey is restored by the refused call"
            - "AerialSurvey.${s1_id}.status and AerialSurvey.${s2_id}.status are both still 'VOID' after the refused call, and Landfill.${lf_id}.remaining_life_years is still 3.00"
            - "${lf_status3} == 'OPEN' — only the PlatformAdmin RESTRICTED_AIRSPACE -> OPEN edge clears the posture"
