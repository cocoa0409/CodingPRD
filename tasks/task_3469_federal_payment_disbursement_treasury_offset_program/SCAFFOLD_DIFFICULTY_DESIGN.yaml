  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: payment_reversal_depth3
        grounds:
          - state_machines.Payment.EXECUTED_to_REVERSED
          - state_machines.Offset.APPLIED_to_REVERSED
          - state_machines.Debt.PAID_IN_FULL_to_ACTIVE
          - calculations.outstanding_receivable_aggregation
        distinguishing_aspect: "Depth-3 cascade triggered by payment reversal: (1) Payment reversal flips each APPLIED Offset to REVERSED; (2) each offset reversal restores its Debt balance and reopens PAID_IN_FULL debts to ACTIVE; (3) each debt restoration debits the CreditorAgency remittance ledger and re-derives outstanding_receivable_cents. The sibling cascade is depth 2 and triggered by do-not-pay record creation."
