          assert:
            - "HTTP status == 409"
            - "error_id == ERR_CHARITY_NOT_VETTED (business_safety priority 9 precedes business_fiscal priority 23)"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on DIFFERENT metrics/endpoints
  #   instance 1 = grant amount >= minimum_grant_cents (numeric threshold, grant submit)
  #   instance 2 = empty pool set on grant pay (need<=0 -> redeem nothing, distinct endpoint)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: grant_amount_exactly_at_minimum_grant_cents
        grounds:
          - validations[priority=10]
          - entities.Sponsor.fields.minimum_grant_cents
          - endpoints.POST /daf/grants
        distinguishing_aspect: |
          Numeric threshold boundary on the grant-submit endpoint: amount_cents == minimum_grant_cents
          (5000) is permitted (>=), but amount_cents == 4999 is rejected with ERR_BELOW_MINIMUM_GRANT.
          The check is >=, not >.
        test_recipe:
          setup:
            - "Sponsor with default minimum_grant_cents=5000; VETTED Charity; ACTIVE DonorAccount funded 1000000 cash."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "Bnd Sponsor", ein: "11-2020202" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /daf/charities"
              payload: { sponsor_id: "${sponsor_id}", legal_name: "Scouts", ein: "11-9000001", ntee_code: "O40", is_private_foundation: false }
              as: ComplianceOfficer
              captures: { charity_id: $.data.id }
            - call: "POST /daf/charities/${charity_id}/vet"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /daf/accounts"
              payload: { sponsor_id: "${sponsor_id}", account_name: "Bnd Fund", primary_advisor_user_id: "adv-10" }
              as: SponsorAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /daf/contributions"
              payload: { donor_account_id: "${acct_id}", asset_type: "CASH", cash_amount_cents: 1000000 }
              as: DonorAdvisor
              as_user_id: "adv-10"
              captures: { contrib_id: $.data.id }
            - call: "POST /daf/contributions/${contrib_id}/settle"
              payload: {}
              as: ContributionAdmin
            - call: "GET /daf/accounts/${acct_id}"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-10"
              captures: { ver1: $.data.version }
          trigger:
            - call: "POST /daf/grants"
              payload: { donor_account_id: "${acct_id}", charity_id: "${charity_id}", amount_cents: 5000, expected_account_version: "${ver1}" }
              as: DonorAdvisor
              as_user_id: "adv-10"
              captures: { ok_grant_id: $.data.id }
            - call: "GET /daf/accounts/${acct_id}"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-10"
              captures: { ver2: $.data.version }
