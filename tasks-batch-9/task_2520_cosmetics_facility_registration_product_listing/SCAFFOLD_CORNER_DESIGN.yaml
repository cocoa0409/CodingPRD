              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { ok_status: $.data.report_status }
            - call: "POST /cosmetics/listings/${lst_id}/adverse-events"
              payload: { event_description: "Timestamped one millisecond into the future", received_at: "2026-08-05T08:00:00.001Z", seriousness: "NON_SERIOUS", outcome_code: "NONE" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${ok_status} == \"RETAINED\" — received_at == now is inside the allowed range"
