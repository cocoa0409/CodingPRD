- rule_id: priority_pair_validation_conflict
  instances:
  - name: allergen_conflict_outranks_the_stale_version_check
    grounds:
    - validations[priority=6]
    - validations[priority=5]
    - errors.ERR_ALLERGEN_CONFLICT
    - errors.ERR_STALE_VERSION
    distinguishing_aspect: "A build request that both carries a deliberately stale expected_box_order_version and would draw an allergen-bearing lot returns the priority 6 business_safety error ERR_ALLERGEN_CONFLICT at 422, never the priority 5 state error ERR_STALE_VERSION at 412 \u2014 the state-versus-business_safety pair, resolved by priority alone."
    test_recipe:
      setup:
