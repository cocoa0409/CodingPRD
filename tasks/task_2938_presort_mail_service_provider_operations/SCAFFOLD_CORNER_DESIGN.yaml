# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2938 — Presort Mail Service Provider Operations
#
# Breadth probe. The nine `section:` values and their `claim_type:` values come
# from references/claim-extraction-guide.md; every `grounds:` entry resolves to a
# declared element of SCAFFOLD.yaml §1.1–§1.7. Corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as `excluded_because:` stubs with
# no test_recipe.
#
# Fixture arithmetic reused below (same literals as §1.8):
#   MARKETING_MAIL base 32 c/piece; SCF-021 drop_ship_discount_bp 300
#   3000 pooled pieces -> THREE_DIGIT (1500 bp) -> 26384 mills -> 79152 c
#   pro_rata(79152; 1200, 1800) -> 31660 / 47492
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section 1 — Entities (§1.1)
  # ===========================================================================
  - section: entities
    instances:

      - name: creation_client_returns_envelope_with_all_declared_fields
        claim_type: creation
        grounds:
          - entities.Client
          - endpoints[POST /clients]
          - response_envelope.success
        distinguishing_aspect: "A created Client comes back inside the fixed §1.0 success envelope with every §1.1 field present — including the computed ledgers at 0 and the system status — not just the input echo."
        test_recipe:
          setup:
            - "Empty database; logical clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { name: "Northline Mail Group", client_code: "NORTH", service_fee_rate_per_thousand_cents: 1400, billing_terms: "NET_15", commingle_opt_in: true }
              as: BureauAdmin
              captures: { cl_id: $.data.id }
          assert:
            - "HTTP 201 with response_type == 'object' and meta.api_request_id / meta.api_request_timestamp present"
            - "Client.${cl_id}: name == 'Northline Mail Group', client_code == 'NORTH', service_fee_rate_per_thousand_cents == 1400, billing_terms == 'NET_15', commingle_opt_in == true"
            - "System and computed fields are materialised: status == 'ACTIVE', suspension_reason == null, unbilled_postage_cents == 0, lifetime_pieces_mailed == 0"
            - "Common fields present: id is a bare UUID with no type prefix, created_at and updated_at are ISO 8601 UTC with three fractional digits, version == 1"

      - name: retrieval_mail_job_returns_stored_values
        claim_type: retrieval
        grounds:
          - entities.MailJob
          - endpoints[GET /mail-jobs/{id}]
        distinguishing_aspect: "A GET must return the persisted row, not a recomputation: the job's computed mirrors (accepted_piece_count, address_quality_pct, move_update_compliant) still show the hygiene run's values on a later read."
        test_recipe:
          setup:
            - "Client NORTH is ACTIVE with an ACTIVE permit account."
            - "One MARKETING_MAIL/LETTERS job of 1250 declared pieces has had one hygiene run (1250 submitted, 1235 CASS-matched, 50 undeliverable, move-update age 30)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Northline Mail Group", client_code: "NORTH", service_fee_rate_per_thousand_cents: 1400 }
              as: BureauAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_id}", permit_number: "PI-700700", payment_method: "METER", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_id}", permit_account_id: "${pa_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1250, declared_weight_oz_per_piece: 1.2 }
              as: PresortOperator
              captures: { job_id: $.data.id }
            - call: "POST /mail-jobs/${job_id}/hygiene-runs"
              payload: { submitted_piece_count: 1250, cass_matched_count: 1235, ncoa_move_updated_count: 40, undeliverable_removed_count: 50, move_update_age_days: 30 }
              as: PresortOperator
          trigger:
            - call: "GET /mail-jobs/${job_id}"
              payload: {}
              as: PresortOperator
          assert:
            - "HTTP 200 and the returned id == ${job_id}, client_id == ${cl_id}, permit_account_id == ${pa_id}"
            - "declared_piece_count == 1250 while accepted_piece_count == 1200, address_quality_pct == 98.80 and move_update_compliant == true"
            - "status == 'HYGIENE_CLEARED', hygiene_run_count == 1, rework_count == 0, postage_due_cents == 0, commingle_batch_id == null, mailed_at_utc == null"

      - name: listing_mail_jobs_filters_and_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /mail-jobs]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "The list endpoint must apply the client_id and status filters BEFORE paginating, so total_count counts the filtered population (2) and not the whole table (3), and has_more reflects the filtered remainder."
        test_recipe:
          setup:
            - "Client NORTH has two RECEIVED jobs; Client SOUTH has one RECEIVED job."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Northline Mail Group", client_code: "NORTH", service_fee_rate_per_thousand_cents: 1400 }
              as: BureauAdmin
              captures: { cl_n_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Southgate Mailers", client_code: "SOUTH", service_fee_rate_per_thousand_cents: 1600 }
              as: BureauAdmin
              captures: { cl_s_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_n_id}", permit_number: "PI-700700", payment_method: "METER", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_n_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_s_id}", permit_number: "PI-800800", payment_method: "METER", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_s_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_n_id}", permit_account_id: "${pa_n_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 500, declared_weight_oz_per_piece: 1.0 }
              as: PresortOperator
              captures: { job_n1_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_n_id}", permit_account_id: "${pa_n_id}", mail_class: "MARKETING_MAIL", processing_category: "FLATS", declared_piece_count: 600, declared_weight_oz_per_piece: 2.0 }
              as: PresortOperator
              captures: { job_n2_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_s_id}", permit_account_id: "${pa_s_id}", mail_class: "FIRST_CLASS", processing_category: "LETTERS", declared_piece_count: 700, declared_weight_oz_per_piece: 0.8 }
              as: PresortOperator
              captures: { job_s1_id: $.data.id }
          trigger:
            - call: "GET /mail-jobs"
              payload: { client_id: "${cl_n_id}", status: "RECEIVED", limit: 1, offset: 0 }
              as: PostageManager
            - call: "GET /mail-jobs"
              payload: { client_id: "${cl_n_id}", status: "RECEIVED", limit: 1, offset: 1 }
              as: PostageManager
            - call: "GET /mail-jobs"
              payload: {}
              as: PostageManager
          assert:
            - "First page: response_type == 'array', exactly 1 row, total_count == 2, limit == 1, offset == 0, has_more == true"
            - "Second page: exactly 1 row, total_count == 2, offset == 1, has_more == false, and the row differs from the first page's row"
            - "The two pages together contain exactly ${job_n1_id} and ${job_n2_id}; ${job_s1_id} never appears because it belongs to another client"
            - "Unfiltered list applies the defaults limit == 10 and offset == 0 and reports total_count == 3"

      - name: not_found_unknown_mail_job_id
        claim_type: not_found
        grounds:
          - validations[priority=5]
          - errors.ERR_MAIL_JOB_NOT_FOUND
          - endpoints[GET /mail-jobs/{id}]
        distinguishing_aspect: "A syntactically valid but unknown UUID must yield the entity-specific 404 in the error envelope, not a 500 and not a 200 with an empty body."
        test_recipe:
          setup:
            - "Empty database: no MailJob has ever been created."
          setup_api_calls: []
          trigger:
            - call: "GET /mail-jobs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PresortOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 with response_type == 'error' and ${err_id} == ERR_MAIL_JOB_NOT_FOUND"
            - "data carries both error_id and a non-empty message per §1.0"

      - name: required_fields_missing_declared_piece_count_on_mail_job
        claim_type: required_fields
        grounds:
          - entities.MailJob.fields.declared_piece_count
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
          - endpoints[POST /mail-jobs]
        distinguishing_aspect: "declared_piece_count has source input with no default, so omitting it is a request-shape failure (priority 3, 400 ERR_INVALID_REQUEST) rather than a piece-arithmetic failure (priority 31, ERR_INVALID_PIECE_COUNT) — the two are easy to conflate."
        test_recipe:
          setup:
            - "Client NORTH is ACTIVE with an ACTIVE permit account."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Northline Mail Group", client_code: "NORTH", service_fee_rate_per_thousand_cents: 1400 }
              as: BureauAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_id}", permit_number: "PI-700700", payment_method: "METER", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_id: $.data.id }
          trigger:
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_id}", permit_account_id: "${pa_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_weight_oz_per_piece: 1.2 }
              as: PresortOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400 with ${err_id} == ERR_INVALID_REQUEST"
            - "No MailJob row was created: GET /clients/${cl_id}/mail-jobs returns total_count == 0"

      - name: defaults_billing_terms_and_commingle_opt_in_applied
        claim_type: defaults
        grounds:
          - entities.Client.fields.billing_terms
          - entities.Client.fields.commingle_opt_in
          - endpoints[POST /clients]
        distinguishing_aspect: "billing_terms and commingle_opt_in are optional inputs with declared defaults NET_30 and true; omitting them must persist those defaults rather than null, because commingle_opt_in == false later drives ERR_COMMINGLE_OPT_OUT and a null would silently opt every client out."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { name: "Default Terms Co", client_code: "DEFCO", service_fee_rate_per_thousand_cents: 1000 }
              as: BureauAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Opted Out Co", client_code: "OPTOUT", service_fee_rate_per_thousand_cents: 1000, billing_terms: "NET_15", commingle_opt_in: false }
              as: BureauAdmin
              captures: { cl_2_id: $.data.id }
          assert:
            - "Client.${cl_id}: billing_terms == 'NET_30' and commingle_opt_in == true, both applied from the §1.1 defaults"
            - "Client.${cl_2_id}: billing_terms == 'NET_15' and commingle_opt_in == false, proving the explicit values are not overwritten by the defaults"
            - "Both rows carry status == 'ACTIVE' and version == 1"

      - name: system_fields_client_supplied_id_and_version_are_ignored
        claim_type: system_fields
        grounds:
          - entities.Client
          - endpoints[POST /clients]
        distinguishing_aspect: "id, created_at, updated_at, version, status and the computed ledgers are server-minted and are NOT in POST /clients' declared input, so priority 3's closing sentence ('Unknown fields are rejected') makes a spoofing attempt a 400 rather than a silently-ignored key. The clean create that follows proves the same fields are minted by the server with version 1 and status ACTIVE."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { name: "Spoofer Mail", client_code: "SPOOF", service_fee_rate_per_thousand_cents: 1200, id: "11111111-1111-4111-8111-111111111111", version: 99, status: "SUSPENDED", unbilled_postage_cents: 500000 }
              as: BureauAdmin
              captures: { err_id: $.data.error_id }
            - call: "POST /clients"
              payload: { name: "Spoofer Mail", client_code: "SPOOF", service_fee_rate_per_thousand_cents: 1200 }
              as: BureauAdmin
              captures: { cl_id: $.data.id }
          assert:
            - "Spoofing attempt: HTTP 400 with ${err_id} == ERR_INVALID_REQUEST, because id / version / status / unbilled_postage_cents are not in the endpoint's declared input"
            - "No row was created by the rejected call: the second call with client_code 'SPOOF' succeeds with HTTP 201 instead of failing on ERR_DUPLICATE_CLIENT_CODE"
            - "Clean create: ${cl_id} != '11111111-1111-4111-8111-111111111111', version == 1, status == 'ACTIVE', suspension_reason == null, unbilled_postage_cents == 0, lifetime_pieces_mailed == 0"
            - "created_at and updated_at are server-generated ISO 8601 UTC values with three fractional digits and are equal to each other on the freshly created row"

      - name: type_constraints_reject_unknown_mail_class_enum_value
        claim_type: type_constraints
        grounds:
          - entities.MailJob.fields.mail_class
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "mail_class is closed over {FIRST_CLASS, MARKETING_MAIL, PERIODICALS}; a plausible near-miss value ('STANDARD_MAIL', the retired USPS name) must be rejected at priority 3 rather than stored and later priced with a missing BASE_RATE_CENTS_PER_PIECE entry."
        test_recipe:
          setup:
            - "Client NORTH is ACTIVE with an ACTIVE permit account."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Northline Mail Group", client_code: "NORTH", service_fee_rate_per_thousand_cents: 1400 }
              as: BureauAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_id}", permit_number: "PI-700700", payment_method: "METER", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_id: $.data.id }
          trigger:
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_id}", permit_account_id: "${pa_id}", mail_class: "STANDARD_MAIL", processing_category: "LETTERS", declared_piece_count: 1000, declared_weight_oz_per_piece: 1.0 }
              as: PresortOperator
              captures: { err_id: $.data.error_id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_id}", permit_account_id: "${pa_id}", mail_class: "MARKETING_MAIL", processing_category: "PARCELS", declared_piece_count: 1000, declared_weight_oz_per_piece: 1.0 }
              as: PresortOperator
              captures: { err_id_2: $.data.error_id }
          assert:
            - "First call: HTTP 400 with ${err_id} == ERR_INVALID_REQUEST"
            - "Second call: HTTP 400 with ${err_id_2} == ERR_INVALID_REQUEST — processing_category is likewise closed over {LETTERS, FLATS}"
            - "GET /clients/${cl_id}/mail-jobs returns total_count == 0"

      - name: immutability_hygiene_run_carries_no_version_and_has_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.AddressHygieneRun
          - entities.VerificationFinding
          - endpoints[GET /mail-jobs/{id}/hygiene-runs]
        distinguishing_aspect: "AddressHygieneRun and VerificationFinding are declared common_fields: false — they carry only id and created_at, have no version and no mutating endpoint. Corrections happen by appending a new run with the next run_index, so the append must not overwrite the earlier row and the job must mirror the HIGHEST run_index."
        test_recipe:
          setup:
            - "Client NORTH is ACTIVE with an ACTIVE permit account and one MARKETING_MAIL/LETTERS job of 1250 declared pieces."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Northline Mail Group", client_code: "NORTH", service_fee_rate_per_thousand_cents: 1400 }
              as: BureauAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_id}", permit_number: "PI-700700", payment_method: "METER", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_id}", permit_account_id: "${pa_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1250, declared_weight_oz_per_piece: 1.2 }
              as: PresortOperator
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /mail-jobs/${job_id}/hygiene-runs"
              payload: { submitted_piece_count: 1250, cass_matched_count: 1100, ncoa_move_updated_count: 40, undeliverable_removed_count: 100, move_update_age_days: 200 }
              as: PresortOperator
              captures: { run_0_id: $.data.id }
            - call: "POST /mail-jobs/${job_id}/hygiene-runs"
              payload: { submitted_piece_count: 1250, cass_matched_count: 1235, ncoa_move_updated_count: 40, undeliverable_removed_count: 50, move_update_age_days: 30 }
              as: PresortOperator
              captures: { run_1_id: $.data.id }
            - call: "GET /mail-jobs/${job_id}/hygiene-runs"
              payload: {}
              as: PresortOperator
          assert:
            - "Both runs exist as separate rows: total_count == 2, with AddressHygieneRun.${run_0_id}.run_index == 0 and AddressHygieneRun.${run_1_id}.run_index == 1"
            - "AddressHygieneRun.${run_0_id} is unchanged by the second append: address_quality_pct == 88.00, net_piece_count == 1150, move_update_compliant == false"
            - "Neither row exposes a version or an updated_at field — only id and created_at accompany the declared fields"
            - "MailJob.${job_id} mirrors the HIGHEST run_index only: accepted_piece_count == 1200, address_quality_pct == 98.80, move_update_compliant == true, hygiene_run_count == 2, status == 'HYGIENE_CLEARED'"

      - name: parent_relationships_permit_account_of_another_client_is_rejected
        claim_type: parent_relationships
        grounds:
          - validations[priority=8]
          - errors.ERR_PERMIT_CLIENT_MISMATCH
          - entities.PermitAccount.parent
          - endpoints[POST /mail-jobs]
        distinguishing_aspect: "PermitAccount is a child of Client, so a job may only cite a permit belonging to its own client. Both ids exist and both rows are ACTIVE, so a naive existence check passes; only the parent linkage fails, and it must be reported as ERR_PERMIT_CLIENT_MISMATCH (422) rather than a 404."
        test_recipe:
          setup:
            - "Clients NORTH and SOUTH are both ACTIVE, each owning its own ACTIVE permit account."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Northline Mail Group", client_code: "NORTH", service_fee_rate_per_thousand_cents: 1400 }
              as: BureauAdmin
              captures: { cl_n_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Southgate Mailers", client_code: "SOUTH", service_fee_rate_per_thousand_cents: 1600 }
              as: BureauAdmin
              captures: { cl_s_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_n_id}", permit_number: "PI-700700", payment_method: "METER", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_n_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_s_id}", permit_number: "PI-800800", payment_method: "METER", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_s_id: $.data.id }
          trigger:
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_n_id}", permit_account_id: "${pa_s_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1000, declared_weight_oz_per_piece: 1.0 }
              as: PresortOperator
              captures: { err_id: $.data.error_id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_n_id}", permit_account_id: "${pa_n_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1000, declared_weight_oz_per_piece: 1.0 }
              as: PresortOperator
              captures: { job_id: $.data.id }
          assert:
            - "Cross-client attempt: HTTP 422 with ${err_id} == ERR_PERMIT_CLIENT_MISMATCH, not ERR_CLIENT_NOT_FOUND and not ERR_INVALID_REQUEST"
            - "Own-client attempt with the identical shape: HTTP 201, MailJob.${job_id}.permit_account_id == ${pa_n_id} and status == 'RECEIVED'"
            - "GET /clients/${cl_n_id}/mail-jobs returns total_count == 1 and GET /clients/${cl_s_id}/mail-jobs returns total_count == 0"

      - name: computed_fields_hygiene_metrics_mirrored_onto_job
        claim_type: computed_fields
        grounds:
          - calculations.address_hygiene_metrics
          - entities.MailJob.fields.accepted_piece_count
        excluded_because:
          difficulty_instance: boundary_precision_check / move_update_age_exactly_ninety_five_days_is_compliant
          rationale: "That instance already asserts run_index, net_piece_count, address_quality_pct and move_update_compliant as computed outputs and their mirrors on MailJob, including the input value being ignored in favour of the derivation."

  # ===========================================================================
  # Section 2 — State Machines (§1.2)
  # ===========================================================================
  - section: state_machines
    instances:

      - name: initial_states_assigned_on_creation_of_every_entity
        claim_type: initial_state
        grounds:
          - state_machines.Client.initial_state
          - state_machines.PermitAccount.initial_state
          - state_machines.EntryFacility.initial_state
          - state_machines.MailJob.initial_state
          - state_machines.CommingleBatch.initial_state
          - state_machines.SortContainer.initial_state
          - state_machines.DropShipment.initial_state
        distinguishing_aspect: "Seven entities carry a state machine and each must start in its declared initial_state — MailJob at RECEIVED (not HYGIENE_CLEARED, even though hygiene is the next step), SortContainer at STAGED (not DOCUMENTED, even when the container qualifies) and DropShipment at SCHEDULED. One creation pass reads all seven so no entity can quietly start mid-lifecycle."
        test_recipe:
          setup:
            - "Empty database; logical clock set to 2026-08-10T09:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00.000Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /clients"
              payload: { name: "Initial State Co", client_code: "INIT", service_fee_rate_per_thousand_cents: 1000 }
              as: BureauAdmin
              captures: { cl_id: $.data.id, cl_status: $.data.status }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_id}", permit_number: "PI-111100", payment_method: "PERMIT_IMPRINT", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_id: $.data.id, pa_status: $.data.status }
            - call: "POST /entry-facilities"
              payload: { facility_code: "SCF-021", facility_type: "SCF", zip3: "021", dock_capacity_pallets_per_slot: 12, drop_ship_discount_bp: 300, served_zip3_list: ["021", "022"] }
              as: BureauAdmin
              captures: { fac_id: $.data.id, fac_status: $.data.status }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_id}", permit_account_id: "${pa_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1000, declared_weight_oz_per_piece: 1.0 }
              as: PresortOperator
              captures: { job_id: $.data.id, job_status: $.data.status }
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_id: $.data.id, batch_status: $.data.status }
            - call: "POST /commingle-batches/${batch_id}/containers"
              payload: { container_type: "TRAY", destination_zip3: "021", sort_level: "FIVE_DIGIT", piece_count: 1000 }
