        grounds: ["validations[priority=6]", "errors[ERR_PROFILE_NOT_LOCKED]", "errors[ERR_RETROFIT_NOT_APPROVED]"]
        distinguishing_aspect: "SavingsCase creation gates on two other entities' states: COLLECTING baseline -> ERR_PROFILE_NOT_LOCKED; LOCKED baseline but PROPOSED project -> ERR_RETROFIT_NOT_APPROVED."
